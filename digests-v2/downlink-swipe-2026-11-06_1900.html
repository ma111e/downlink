<script type="application/json" id="dl-articles">[{"n":3,"title":"Free Certified Patch for Critical Rails Active Storage Vulnerability","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/rails-active-storage-patch?utm_medium=feed","time":"20:40","priority":"MUST READ","score":95,"tldr":"Rails 8.0.5.2 and 8.1.4.1 fix a critical Active Storage/ImageMagick flaw (GHSA-f3w6-w445-fwh9) that can let unauthenticated attackers write or potentially read server files through malicious uploads. Upgrade immediately and ensure MiniMagick is at least 5.1, or apply Socket’s free interim patch if upgrading is delayed.","briefOverview":"\u003cp\u003eRuby on Rails released versions 8.0.5.2 and 8.1.4.1 on November 4, 2026, addressing 21 vulnerabilities including critical Active Storage issue GHSA-f3w6-w445-fwh9. The flaw affects applications that process untrusted Active Storage uploads with ImageMagick through the \u003ccode\u003e:mini_magick\u003c/code\u003e variant processor when the system ImageMagick policy does not block dangerous file handlers. A crafted upload may let an unauthenticated attacker write arbitrary files to the server and, for applications using Active Storage’s Disk service, potentially read files accessible to the application process.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure of sensitive files, including \u003ccode\u003esecret_key_base\u003c/code\u003e, application credentials, and database secrets, could lead to remote code execution or access to connected systems. Active Storage automatically analyzes attached files, meaning exploitation does not require a separate preview, transformation, or explicit analysis request. Rails recommends upgrading promptly, updating MiniMagick to version 5.1 or later where required, reviewing ImageMagick policy settings, and rotating potentially exposed credentials. Socket also provides a free Certified Patch for this specific flaw as an interim option, although it does not address the other vulnerabilities fixed in the Rails releases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ruby on Rails released versions 8.0.5.2 and 8.1.4.1 to address 21 vulnerabilities, including critical Active Storage issue GHSA-f3w6-w445-fwh9.","The critical flaw affects Rails applications that use MiniMagick with ImageMagick to process untrusted Active Storage uploads when the system ImageMagick policy does not block dangerous file handlers.","A crafted upload may allow an unauthenticated attacker to write arbitrary server files and, with Active Storage’s Disk service, potentially read sensitive files such as application secrets and database credentials.","Applications using the MiniMagick variant processor must update MiniMagick to version 5.1 or later when applying the Rails fix.","Socket offers a free Certified Patch for GHSA-f3w6-w445-fwh9 as an interim measure, but it does not address the other vulnerabilities fixed in the Rails releases."],"insights":["Exploitation can occur as soon as an attachment is added because Active Storage automatically analyzes uploaded files, without requiring a separate image preview or transformation request.","Teams applying the Rails fix to applications using MiniMagick must also use MiniMagick 5.1 or later, or affected applications will raise an exception during startup.","Organizations using Active Storage’s Disk service are advised to rotate potentially exposed credentials because the flaw may permit reading files accessible to the application process.","Socket’s free Certified Patch is limited to GHSA-f3w6-w445-fwh9 and does not remediate the other 20 issues addressed by the Rails releases."],"referencedReports":[{"title":"GHSA-f3w6-w445-fwh9","url":"https://github.com/rails/rails/security/advisories/GHSA-f3w6-w445-fwh9","publisher":"ruby-on-rails","context":"The article cites the Rails security advisory for the critical Active Storage issue and its remediation guidance.","category":"advisory","primary":true}],"body":"\u003cp\u003eRuby on Rails released versions 8.0.5.2 and 8.1.4.1 on November 4, 2026, addressing 21 vulnerabilities including critical Active Storage issue GHSA-f3w6-w445-fwh9. The flaw affects applications that process untrusted Active Storage uploads with ImageMagick through the \u003ccode\u003e:mini_magick\u003c/code\u003e variant processor when the system ImageMagick policy does not block dangerous file handlers. A crafted upload may let an unauthenticated attacker write arbitrary files to the server and, for applications using Active Storage’s Disk service, potentially read files accessible to the application process.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure of sensitive files, including \u003ccode\u003esecret_key_base\u003c/code\u003e, application credentials, and database secrets, could lead to remote code execution or access to connected systems. Active Storage automatically analyzes attached files, meaning exploitation does not require a separate preview, transformation, or explicit analysis request. Rails recommends upgrading promptly, updating MiniMagick to version 5.1 or later where required, reviewing ImageMagick policy settings, and rotating potentially exposed credentials. Socket also provides a free Certified Patch for this specific flaw as an interim option, although it does not address the other vulnerabilities fixed in the Rails releases.\u003c/p\u003e\n"},{"n":2,"title":"Turning Up the Heat: Inside the Attacks on Europe’s Refrigeration System","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/europes-refrigeration-systems-attacks/","time":"21:15","priority":"SHOULD READ","score":84,"tldr":"Cyberattacks on internet-exposed refrigeration controllers disrupted hundreds of European supermarkets, raising units into defrost mode and causing widespread food spoilage, with France most heavily affected. The initial access method remains unconfirmed, but weak configurations, default credentials, and unpatched software are suspected.","briefOverview":"\u003cp\u003eSince at least October 2026, attackers have targeted refrigeration controllers in Europe, placing them into defrost mode and causing supermarkets to discard spoiled food. The first reported wave, on October 11–12, primarily affected about 700 supermarkets in France; another wave on November 1–2 affected more than 100–115 retail locations in at least 10 additional European countries. French authorities also disclosed impacts on refrigeration systems used by medical facilities, although there was no evidence that blood products were spoiled.\u003c/p\u003e\n\n\u003cp\u003eAccording to public reporting cited by Unit 42, attackers raised temperatures in targeted units to as high as 50°C (122°F), and some incidents resulted in fires. The initial method used to gain access remains unconfirmed, though vulnerable software and manufacturer-provided default credentials have been suggested as possible factors. Unit 42 identified more than 5,000 internet-exposed devices made by manufacturers listed in a CERT-FR advisory, while emphasizing that exposure does not establish that a device was vulnerable; it also observed a sharp decline in such exposed devices in France from October through early November. NoName057(16) and Z-Pentest claimed responsibility on Telegram, but those claims were unverified.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyberattacks targeting refrigeration systems in Europe since at least October 2026 placed controllers into defrost mode and caused supermarkets to discard spoiled food.","The first reported wave occurred on October 11–12, 2026 and primarily affected about 700 supermarkets in France, while a later wave on November 1–2 affected more than 100–115 retail locations across at least 10 additional European countries.","French authorities said refrigeration systems used by medical facilities were also affected, although there was no evidence that blood products were spoiled.","The initial access method is unconfirmed, but reporting has raised the possibility that vulnerable software or manufacturer-provided default credentials were involved.","Unit 42 identified more than 5,000 internet-exposed devices made by companies listed in a French CERT advisory, while noting that exposure did not establish that the devices were vulnerable."],"insights":["Internet-exposed devices in France associated with manufacturers named in the CERT-FR advisory fell sharply from 1,853 during October 1–15 to 558 during October 16–31 and 316 during November 1–6, 2026.","The reported impact extended beyond spoiled supermarket inventory: refrigeration systems at medical facilities were also affected, and some targeted units reportedly reached 50°C, with fires occurring in some cases.","Although NoName057(16) and Z-Pentest claimed responsibility through Telegram, the article states that those claims had not been verified.","Unit 42 found more than 5,000 internet-exposed devices from listed manufacturers, but explicitly cautioned that internet exposure alone does not show a device was running vulnerable software."],"referencedReports":[{"title":"CERTFR-2026-ALE-012","url":"https://cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-012","publisher":"CERT-FR","context":"The article uses this French CERT advisory to identify manufacturers whose internet-exposed devices were counted in Unit 42's analysis.","category":"advisory","primary":false},{"title":"European Refrigeration Controller Exposure Sitrep","url":"https://censys.com/blog/european-refrigeration-controller-exposure-sitrep/","publisher":"Censys","context":"The article notes that Censys reported extensively on European refrigeration-controller exposure trends.","category":"research","primary":false},{"title":"U.S. Government Partners Urge Hardening of Industrial Refrigeration and Cold Chain Monitoring Systems","url":"https://www.cisa.gov/resources-tools/resources/us-government-partners-urge-hardening-industrial-refrigeration-and-cold-chain-monitoring-systems","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article cites this CISA advisory warning that refrigeration and cold-chain systems may be exploited through authentication bypass, arbitrary code injection, and weak configurations.","category":"advisory","primary":false}],"body":"\u003cp\u003eSince at least October 2026, attackers have targeted refrigeration controllers in Europe, placing them into defrost mode and causing supermarkets to discard spoiled food. The first reported wave, on October 11–12, primarily affected about 700 supermarkets in France; another wave on November 1–2 affected more than 100–115 retail locations in at least 10 additional European countries. French authorities also disclosed impacts on refrigeration systems used by medical facilities, although there was no evidence that blood products were spoiled.\u003c/p\u003e\n\n\u003cp\u003eAccording to public reporting cited by Unit 42, attackers raised temperatures in targeted units to as high as 50°C (122°F), and some incidents resulted in fires. The initial method used to gain access remains unconfirmed, though vulnerable software and manufacturer-provided default credentials have been suggested as possible factors. Unit 42 identified more than 5,000 internet-exposed devices made by manufacturers listed in a CERT-FR advisory, while emphasizing that exposure does not establish that a device was vulnerable; it also observed a sharp decline in such exposed devices in France from October through early November. NoName057(16) and Z-Pentest claimed responsibility on Telegram, but those claims were unverified.\u003c/p\u003e\n"},{"n":5,"title":"CVE-2026-123158 (*sshole): OpenSSH Password Authentication Bypass on Alpine Linux","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/cve-2026-123158-sshhole-openssh-musl-password-bypass","time":"22:30","priority":"SHOULD READ","score":84,"tldr":"A flaw in unpatched OpenSSH on musl-based systems such as Alpine Linux can let attackers log into eligible passwordless accounts using an overlong password when password authentication is enabled and PAM is not used. Upgrade to Alpine’s patched OpenSSH packages, restart sshd, and disable password authentication or enable PAM where immediate patching is not possible.","briefOverview":"\u003cp\u003eCVE-2026-123158, also called *sshole, is an OpenSSH password-authentication bypass affecting unpatched musl-based systems such as Alpine Linux when PAM is not used. Under specific conditions, a network attacker can log in to an eligible account with a \u003ccode\u003e*\u003c/code\u003e shadow-password field by submitting an overlong password. The issue affects systems with \u003ccode\u003ePasswordAuthentication yes\u003c/code\u003e, an SSH-permitted passwordless target account, and at least one local account with a real SHA-crypt password hash; root also requires \u003ccode\u003ePermitRootLogin yes\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe article’s Alpine VM and Docker tests with OpenSSH 10.3_p1-r1 confirmed that passwords of 257 bytes or more could bypass authentication after an initial failed attempt in the same connection. Accounts with real password hashes were not affected, and testing showed that PAM with \u003ccode\u003eUsePAM yes\u003c/code\u003e blocked the bypass. OpenSSH fixed the problem in 10.6p2, and Alpine issued patched packages for all branches, including older unsupported releases.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights practical risks for Alpine-based container images, remote-debugging environments, and CI/CD runners that expose sshd. It also warns that version-banner checks can falsely identify Alpine systems as vulnerable because Alpine backported the fix without changing the upstream-reported OpenSSH version. Recommended actions are to upgrade and restart sshd, disable password authentication where possible, or use the PAM package with \u003ccode\u003eUsePAM yes\u003c/code\u003e if an immediate upgrade is not possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123158 affects unpatched OpenSSH on musl-based systems without PAM, including Alpine Linux, and can allow login to eligible accounts whose shadow password field is `*` using an overlong password.","The bypass requires PasswordAuthentication to be enabled, an SSH-permitted target account with a `*` shadow password field, and at least one local account with a real SHA-crypt password hash; direct root login also requires PermitRootLogin yes.","In the authors’ Alpine VM and Docker tests using pre-fix OpenSSH 10.3_p1-r1, a 257-byte or longer password succeeded only after an initial failed authentication attempt in the same connection.","OpenSSH fixed the issue in version 10.6p2, while Alpine backported fixes to supported and unsupported branches; Alpine 3.24 received the fix in openssh-server 10.3_p1-r2.","For systems that cannot immediately upgrade, the article says disabling password authentication or using the PAM package with UsePAM yes blocked the bypass in testing."],"insights":["A scanner that submits only one long password per connection can miss affected systems, because the tested bypass required a failed password attempt followed by the long password within the same connection.","The article’s tested client and askpass setup could deliver passwords only up to 1023 bytes even though the server-side code separately accepts up to 1024 bytes, showing that client-side limits can distort vulnerability testing results.","OpenSSH version banners can produce false positives on Alpine because the distribution backported the fix without changing the reported upstream version, so installed package revisions or behavioral testing are more reliable indicators.","Authentication logs can reveal the pattern through a failed password event followed by a successful password login for an account whose shadow password field is `*` in the same session.","Fresh Alpine 3.24 installations of openssh-server receive the patched package from the current repository; the main container risk is older pinned images, cached build layers, internal registry copies, or mirrored package repositories."],"referencedReports":[{"title":"*sshole: OpenSSH Password Authentication Bypass on Alpine Linux","url":"https://sshhole.com","publisher":"Özgün Kültekin","context":"The article identifies this as the original disclosure describing the flaw and its exploitation conditions.","category":"research","primary":true},{"title":"OpenSSH Release Notes: 10.6p2","url":"https://www.openssh.org/releasenotes.html#10.6p2","publisher":"OpenSSH","context":"The article cites the release notes for the upstream fix in OpenSSH 10.6p2.","category":"advisory","primary":false},{"title":"OpenSSH Server Password Authentication Bypass","url":"https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/","publisher":"Alpine Linux","context":"The article cites Alpine's security advisory for affected branches, patched package revisions, and documented attack behavior.","category":"advisory","primary":true},{"title":"GHSA-4fcc-vm97-gx3x: OpenSSH Password Authentication Bypass on musl libc","url":"https://github.com/advisories/GHSA-4fcc-vm97-gx3x","publisher":"GitHub Advisory Database","context":"The article references this unreviewed GitHub advisory as the source assigning CVE-2026-123158 and a CVSS score.","category":"advisory","primary":false},{"title":"*sshole: OpenSSH Authentication Bypass Gives Attackers Root on Alpine Linux","url":"https://orca.security/resources/research/sshole-openssh-authentication-bypass-gives-attackers-root-on-alpine-linux","publisher":"Orca Security","context":"The article lists Orca Security's analysis as a technical reference on the *sshole flaw.","category":"research","primary":false}],"body":"\u003cp\u003eCVE-2026-123158, also called *sshole, is an OpenSSH password-authentication bypass affecting unpatched musl-based systems such as Alpine Linux when PAM is not used. Under specific conditions, a network attacker can log in to an eligible account with a \u003ccode\u003e*\u003c/code\u003e shadow-password field by submitting an overlong password. The issue affects systems with \u003ccode\u003ePasswordAuthentication yes\u003c/code\u003e, an SSH-permitted passwordless target account, and at least one local account with a real SHA-crypt password hash; root also requires \u003ccode\u003ePermitRootLogin yes\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe article’s Alpine VM and Docker tests with OpenSSH 10.3_p1-r1 confirmed that passwords of 257 bytes or more could bypass authentication after an initial failed attempt in the same connection. Accounts with real password hashes were not affected, and testing showed that PAM with \u003ccode\u003eUsePAM yes\u003c/code\u003e blocked the bypass. OpenSSH fixed the problem in 10.6p2, and Alpine issued patched packages for all branches, including older unsupported releases.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights practical risks for Alpine-based container images, remote-debugging environments, and CI/CD runners that expose sshd. It also warns that version-banner checks can falsely identify Alpine systems as vulnerable because Alpine backported the fix without changing the upstream-reported OpenSSH version. Recommended actions are to upgrade and restart sshd, disable password authentication where possible, or use the PAM package with \u003ccode\u003eUsePAM yes\u003c/code\u003e if an immediate upgrade is not possible.\u003c/p\u003e\n"},{"n":1,"title":"Medical services company settles with 4 states over 2023 hack of sensitive patient records","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/medical-services-company-settles-with-4-state-ags","time":"19:06","priority":"SHOULD READ","score":78,"tldr":"Perry Johnson Companies will pay $300,000 and implement major security reforms after a 2023 breach exposed sensitive health data of more than 13 million people, allegedly enabled by compromised employee credentials and a lack of multi-factor authentication. Failure to comply could trigger an additional $9.7 million penalty from four U.S. states.","briefOverview":"\u003cp\u003ePerry Johnson Companies, a Nevada-based health care services firm, agreed to pay \u003cspan class=\"math inline\"\u003e\\(300,000 to settle a case brought by the attorneys general of Connecticut, New Jersey, New York, and Michigan over a March 2023 breach. The incident affected the company’s medical transcription, coding, and imaging subsidiaries and exposed data belonging to more than 13 million people nationwide. If the company does not complete required cybersecurity reforms, it could owe the four states an additional \\)\u003c/span\u003e9.7 million.\u003c/p\u003e\n\n\u003cp\u003eAccording to the New York Attorney General’s office, hackers entered the company’s systems using an employee’s credentials, and the company did not use multi-factor authentication. The attackers allegedly collected passwords and unencrypted files containing sensitive patient information for two months, while monitoring software recorded activity but did not alert the security team because it was poorly configured. The settlement requires an information security program, incident-response standards, multi-factor authentication, encryption, password management, annual risk assessments, and controls for handling health data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Perry Johnson Companies agreed to pay $300,000 to settle claims brought by the attorneys general of Connecticut, New Jersey, New York, and Michigan over a March 2023 data breach.","The breach exposed sensitive records of more than 13 million people nationwide, including names, Social Security numbers, medical information, insurance details, and test results.","According to New York Attorney General Letitia James’s office, hackers accessed the company’s systems using an employee’s credentials while the company lacked multi-factor authentication.","The attackers allegedly remained in the systems for two months, and security software recorded their activity but did not alert the information security team because it was poorly configured.","The settlement requires security improvements including multi-factor authentication, encryption, password management, annual risk assessments, and data-handling controls; noncompliance could result in an additional $9.7 million payment."],"insights":["The company’s software reportedly recorded the intruder’s activity, but poor configuration meant the security team was not alerted, highlighting that deploying monitoring software alone was insufficient.","The company allegedly learned of the breach only after the hackers notified it, despite the unauthorized access continuing for two months.","The additional $9.7 million payment for failing to complete required reforms is far larger than the $300,000 initial settlement payment.","The required reforms extend beyond login protections to include encryption, annual risk reviews, incident-response standards, and controls over how health data is collected, retained, and disposed of."],"referencedReports":[{"title":"Attorney General James Secures $10 Million and Critical Reforms from Companies That Failed to Protect Patients’ Private Information","url":"https://ag.ny.gov/press-release/2026/attorney-general-james-secures-10-million-and-critical-reforms-companies-failed","publisher":"office-of-the-new-york-attorney-general","context":"The article cites this New York Attorney General press release for details of the settlement, alleged security failures, and required reforms.","category":"advisory","primary":true}],"body":"\u003cp\u003ePerry Johnson Companies, a Nevada-based health care services firm, agreed to pay \u003cspan class=\"math inline\"\u003e\\(300,000 to settle a case brought by the attorneys general of Connecticut, New Jersey, New York, and Michigan over a March 2023 breach. The incident affected the company’s medical transcription, coding, and imaging subsidiaries and exposed data belonging to more than 13 million people nationwide. If the company does not complete required cybersecurity reforms, it could owe the four states an additional \\)\u003c/span\u003e9.7 million.\u003c/p\u003e\n\n\u003cp\u003eAccording to the New York Attorney General’s office, hackers entered the company’s systems using an employee’s credentials, and the company did not use multi-factor authentication. The attackers allegedly collected passwords and unencrypted files containing sensitive patient information for two months, while monitoring software recorded activity but did not alert the security team because it was poorly configured. The settlement requires an information security program, incident-response standards, multi-factor authentication, encryption, password management, annual risk assessments, and controls for handling health data.\u003c/p\u003e\n"},{"n":6,"title":"French authorities probe cyberattack targeting nation’s blood supply","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/french-authorities-probe-cyberattack-targeting-nations-blood-supply/","time":"20:46","priority":"SHOULD READ","score":78,"tldr":"French authorities are investigating a cyberattack on a refrigeration-equipment supplier to the French Blood Establishment, raising concerns about disruption to France’s civilian blood supply.","briefOverview":"\u003cp\u003eFrench authorities are investigating a cyberattack that targeted a supplier of refrigeration equipment for the French Blood Establishment (EFS). The EFS oversees France’s civilian blood supply. The article does not identify the supplier or describe the method used in the attack.\u003c/p\u003e\n\n\u003cp\u003eThe incident follows a wave of hacks against refrigeration systems at supermarkets across Europe. Health-ISAC’s chief security officer, Errol Weiss, said the organization sent an advisory to its U.S. members warning of the potential risk of attack. The article frames the event as a concern involving equipment that supports the national blood supply.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["French authorities are investigating a cyberattack targeting a refrigeration-equipment supplier for the French Blood Establishment (EFS).","The EFS oversees France’s civilian blood supply.","The incident follows a wave of hacks targeting refrigeration systems at supermarkets across Europe.","Health-ISAC sent its U.S. members an advisory warning about the potential risk of attack, according to its chief security officer Errol Weiss."],"insights":["The incident highlights that a cyberattack on an equipment supplier can raise concerns for an organization responsible for a national civilian blood supply.","The reported wave of attacks on supermarket refrigeration systems across Europe places the French incident in a broader pattern involving refrigeration-related targets.","Health-ISAC’s advisory to U.S. members shows that the potential risk was communicated beyond France."],"referencedReports":[],"body":"\u003cp\u003eFrench authorities are investigating a cyberattack that targeted a supplier of refrigeration equipment for the French Blood Establishment (EFS). The EFS oversees France’s civilian blood supply. The article does not identify the supplier or describe the method used in the attack.\u003c/p\u003e\n\n\u003cp\u003eThe incident follows a wave of hacks against refrigeration systems at supermarkets across Europe. Health-ISAC’s chief security officer, Errol Weiss, said the organization sent an advisory to its U.S. members warning of the potential risk of attack. The article frames the event as a concern involving equipment that supports the national blood supply.\u003c/p\u003e\n"},{"n":4,"title":"What Refrigerator Hacks Reveal About ICS Exposure","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/what-refrigerator-hacks-reveal-about-ics-exposure/","time":"19:02","priority":"MAY READ","score":58,"tldr":"Recent hacks of Danfoss StoreView refrigeration controllers in Europe underscore that internet-exposed industrial control systems remain a persistent risk, with roughly 134,000 systems visible globally. Poor asset visibility on mobile networks, exposed IT services and HMIs, outdated firmware, default credentials, and network concentration make these systems easier to find and compromise.","briefOverview":"\u003cp\u003eRecent hacks affecting refrigeration systems across Europe reportedly caused spoiled food, fires, and millions of euros in inventory losses. Reports suggest Danfoss StoreView refrigeration controllers were exploited, and Censys observed just over 1,000 exposed StoreView instances globally as of November 2. The incidents illustrate the continuing risk from industrial control systems connected directly to the public internet.\u003c/p\u003e\n\n\u003cp\u003eCensys reported roughly 134,000 internet-exposed industrial control systems globally, about 4% more than in 2024. About 70% of hosts running industrial devices and services are on consumer or mobile networks, which can make ownership difficult to identify because public registration details often point to the telecommunications provider rather than the operator. The article also notes that 31% to 99% of hosts running industrial protocols expose non-industrial services such as HTTP, SSH, or FTP, while outdated firmware, default passwords, and concentration on individual mobile networks can compound the risk.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Recent hacks of Danfoss StoreView refrigeration controllers in Europe reportedly caused spoiled food, fires, and millions of euros in inventory losses.","Censys observed just over 1,000 Danfoss StoreView instances exposed globally as of November 2, while global internet-exposed industrial control systems totaled roughly 134,000, about 4% higher than in 2024.","About 70% of hosts running industrial control devices and services are on consumer and mobile networks, where provider metadata can obscure the actual equipment owner.","Between 31% and 99% of hosts running an industrial control protocol also expose at least one non-industrial service such as HTTP, SSH, or FTP, expanding the available entry points.","The article cites outdated firmware, default configurations such as the Unitronics password \"1111,\" and concentration on individual mobile networks as factors that can keep industrial systems exposed."],"insights":["Industrial operators may miss exposed equipment because much of it is connected through consumer or mobile networks rather than the organization’s corporate internet addresses.","Mobile-network registration data often identifies the telecommunications provider instead of the equipment owner, making responsible notification of exposed systems difficult even when they are easy to discover.","The article notes that attackers may not need specialized industrial knowledge because many industrial hosts also expose familiar services such as HTTP, SSH, FTP, VNC, or RDP.","A single mobile provider can account for most observed exposed industrial hosts in a country, such as Turkcell’s 81% share in Turkey and Korea Telecom’s 71% share in South Korea, concentrating both discovery and disruption risk.","Patches for several vulnerabilities relevant to the refrigeration incidents had reportedly been available for more than a year, yet affected controllers were often unsupported older models or running outdated firmware."],"referencedReports":[{"title":"Exploitation of Unitronics PLCs Used in Water and Wastewater Systems","url":"https://www.cisa.gov/news-events/alerts/2023/11/28/exploitation-unitronics-plcs-used-water-and-wastewater-systems","publisher":"cisa","context":"The article cites CISA’s recommendations following the 2023 Municipal Water Authority of Aliquippa incident, including changing the Unitronics default password.","category":"advisory","primary":false}],"body":"\u003cp\u003eRecent hacks affecting refrigeration systems across Europe reportedly caused spoiled food, fires, and millions of euros in inventory losses. Reports suggest Danfoss StoreView refrigeration controllers were exploited, and Censys observed just over 1,000 exposed StoreView instances globally as of November 2. The incidents illustrate the continuing risk from industrial control systems connected directly to the public internet.\u003c/p\u003e\n\n\u003cp\u003eCensys reported roughly 134,000 internet-exposed industrial control systems globally, about 4% more than in 2024. About 70% of hosts running industrial devices and services are on consumer or mobile networks, which can make ownership difficult to identify because public registration details often point to the telecommunications provider rather than the operator. The article also notes that 31% to 99% of hosts running industrial protocols expose non-industrial services such as HTTP, SSH, or FTP, while outdated firmware, default passwords, and concentration on individual mobile networks can compound the risk.\u003c/p\u003e\n"}]</script>
