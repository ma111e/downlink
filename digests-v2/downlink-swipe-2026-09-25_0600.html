g to Bitget CEO Gracy Chen, attackers compromised a critical backend wallet system, spoofed transaction data, and triggered the authorization process for transfers.","Bitget temporarily suspended withdrawals while it investigates with law enforcement, Mandiant, SlowMist, and on-chain security institutions.","Bitget said its cold wallets, most platform assets, and its independently operated Bitget Wallet were not affected, and that its User Protection Fund of more than $464 million will cover losses.","The incident affected assets across Ethereum, XRP Ledger, Arbitrum, Avalanche, Optimism, BSC, and Base, including ETH, XRP, BNB, AVAX, USDT, and USDC."],"insights":["The theft was enabled by manipulation of transaction information inside Bitget’s wallet infrastructure, allowing the attackers to trigger an otherwise trusted approval process rather than simply draining a single exposed wallet.","Although withdrawals were paused, Bitget said deposits and trading continued normally and customer account balances remained accurate, indicating that the operational disruption was focused on moving assets out of the exchange.","The exchange said the loss falls within its $464 million User Protection Fund, which exceeds the reported $351.6 million stolen amount.","Some blockchain networks reportedly froze hacker wallet addresses after the incident, potentially limiting the attackers’ ability to move or use part of the stolen assets."],"referencedReports":[],"body":"\u003cp\u003eBitget disclosed that suspected North Korean hackers stole approximately $351.6 million from a limited number of the cryptocurrency exchange’s hot and warm wallets. The company detected the incident on Thursday evening after security systems flagged multiple unauthorized transfers. Bitget temporarily suspended withdrawals while working with law enforcement, Mandiant, SlowMist, and on-chain security institutions.\u003c/p\u003e\n\n\u003cp\u003eBitget CEO Gracy Chen said the attackers compromised a critical backend wallet system, spoofed transaction data, and triggered the authorization process used to move funds. The incident affected Ethereum, XRP Ledger, Arbitrum, Avalanche, Optimism, BSC, and Base, involving assets including ETH, XRP, BNB, AVAX, USDT, and USDC; XRP was the largest single-chain loss. Bitget said its cold wallets, most platform assets, and independently operated Bitget Wallet were unaffected, and that its more than $464 million User Protection Fund will cover losses while withdrawals remain paused until it is safe to resume them.\u003c/p\u003e\n"},{"n":2,"title":"Inside the Telecom Attack Surface: SS7, BGP Hijacking, and the Technical Reality of Nation-State Intrusions","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/ss7-bgp-nation-state-intrusions/","time":"08:50","priority":"MAY READ","score":55,"tldr":"Telecom networks remain vulnerable to nation-state intrusion through trust-based SS7 and BGP protocols and poorly secured edge routers, allowing surveillance, traffic interception, and persistent access without zero-days. Carriers should harden signaling and route validation, rapidly patch exposed infrastructure, and monitor external threat activity for early warning.","briefOverview":"\u003cp\u003eThe article examines how nation-state operators can abuse longstanding telecom trust relationships through SS7 signaling, BGP internet routing, and compromised carrier routers. SS7 can let entities with signaling access request subscriber locations or reroute SMS because it does not verify whether requests are authorized. BGP likewise lacks intrinsic route-origin verification, allowing networks to announce prefixes they do not own and receive redirected traffic. These weaknesses can support location tracking, interception of voice data and multi-factor authentication keys, and traffic diversion.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a 2025 CISA and allied-agency advisory that found PRC state-sponsored actors targeting major telecom backbone, provider-edge, and customer-edge routers. It states that Salt Typhoon used known flaws in Ivanti Connect Secure, Palo Alto PAN-OS GlobalProtect, and Cisco IOS XE, then implanted malicious code and configured GRE tunnels to extract data through compromised routers. Detection is difficult because malicious signaling requests, route updates, and tunnels can resemble normal roaming, routing, and provisioning activity. The article recommends signaling firewalls, strict partner vetting, RPKI route validation, rapid patching, and audits of network tunnels, mirror sessions, and AAA configurations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SS7 allows nodes with signaling access to request subscriber location information or reroute SMS because it lacks built-in verification that a requester is authorized.","BGP does not intrinsically verify route ownership, so a network can announce a prefix it does not own and cause traffic to be sent to it.","A 2025 CISA and allied-agency advisory reported that PRC state-sponsored actors targeted major telecom providers' backbone, provider-edge, and customer-edge routers and modified routers for persistent access.","The advisory identified known flaws in Ivanti Connect Secure, Palo Alto PAN-OS GlobalProtect, and Cisco IOS XE as common initial-access paths.","The article recommends SS7 and Diameter firewalls, strict vetting of Global Title partners, RPKI origin validation, rapid patching, and audits of tunnels, mirror sessions, and AAA configurations."],"insights":["Moving subscribers to 4G or 5G does not fully remove signaling risk because roaming users can be downgraded to SS7, while Diameter has its own location-tracking weaknesses.","These intrusions can evade conventional detection because abusive signaling requests, false route announcements, and unauthorized GRE tunnels can resemble legitimate roaming, routing, and network-provisioning activity.","The article notes that attackers may route signaling traffic through third-country networks, complicating attribution and visibility.","Aging telecom equipment can make removal of intruders harder because some carrier equipment is reportedly too old to patch."],"referencedReports":[{"title":"2010 Report to Congress","url":"https://www.uscc.gov/sites/default/files/annual_reports/2010-Report-to-Congress.pdf","publisher":"u.s.-china-economic-and-security-review-commission","context":"The article cites this report's account of China Telecom advertising erroneous routes in April 2010 that redirected traffic through Chinese servers.","category":"research","primary":false},{"title":"Countering Chinese State-Sponsored Actors Compromise of Networks Worldwide to Feed Global Espionage System","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a","publisher":"cisa","context":"The article cites this 2025 joint advisory on PRC state-sponsored actors targeting telecom routers, using known vulnerabilities, and establishing persistent access.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe article examines how nation-state operators can abuse longstanding telecom trust relationships through SS7 signaling, BGP internet routing, and compromised carrier routers. SS7 can let entities with signaling access request subscriber locations or reroute SMS because it does not verify whether requests are authorized. BGP likewise lacks intrinsic route-origin verification, allowing networks to announce prefixes they do not own and receive redirected traffic. These weaknesses can support location tracking, interception of voice data and multi-factor authentication keys, and traffic diversion.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a 2025 CISA and allied-agency advisory that found PRC state-sponsored actors targeting major telecom backbone, provider-edge, and customer-edge routers. It states that Salt Typhoon used known flaws in Ivanti Connect Secure, Palo Alto PAN-OS GlobalProtect, and Cisco IOS XE, then implanted malicious code and configured GRE tunnels to extract data through compromised routers. Detection is difficult because malicious signaling requests, route updates, and tunnels can resemble normal roaming, routing, and provisioning activity. The article recommends signaling firewalls, strict partner vetting, RPKI route validation, rapid patching, and audits of network tunnels, mirror sessions, and AAA configurations.\u003c/p\u003e\n"}]</script>
