<script type="application/json" id="dl-articles">[{"n":4,"title":"CISA warns admins to immediately fix Ivanti flaw exploited as zero-day","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-admins-to-immediately-fix-ivanti-flaw-exploited-as-zero-day/","time":"12:58","priority":"MUST READ","score":98,"tldr":"CISA urges organizations to immediately patch Ivanti Connect Secure for CVE-2026-104935, a high-severity zero-day authentication bypass actively exploited to enable unauthenticated command execution, credential theft, and data exfiltration. Suspected compromises require forensic investigation and may warrant a factory reset, upgrade, and credential rotation.","briefOverview":"\u003cp\u003eCISA has urged organizations to immediately patch CVE-2026-104935, a high-severity Ivanti Connect Secure authentication-bypass flaw that has been exploited as a zero-day since at least October 1. The flaw allows remote, unauthenticated attackers to execute arbitrary commands with low complexity and no user interaction. Ivanti released Connect Secure versions 22.8R2.5, 25.1.3.0, 25.1.3.1, and 25.1.1.2 to address it, warning customers of limited exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eVolexity reported that a threat actor tracked as UTA0576 chained the authentication bypass with remote code execution and privilege-escalation flaws to gain unauthenticated root-level code execution. The actor targeted Active Directory credentials and secrets, including LAPS passwords and BitLocker recovery keys, while CISA said the attacks involve credential theft and data exfiltration. Because attacker commands may execute only in memory, Ivanti\u0026rsquo;s Integrity Checker Tool may not detect evidence of compromise; CISA recommends network and memory forensics and, for confirmed compromises, a configuration backup, factory reset and upgrade, restoration, and credential and certificate rotation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA urged organizations to immediately patch CVE-2026-104935, an actively exploited Ivanti Connect Secure authentication-bypass flaw that enables unauthenticated remote command execution.","Ivanti released Connect Secure versions 22.8R2.5, 25.1.3.0, 25.1.3.1, and 25.1.1.2 to address the flaw and said exploitation in the wild is limited.","Volexity reported that threat actor UTA0576 chained the authentication bypass with remote code execution and privilege escalation flaws to obtain unauthenticated root-level code execution.","CISA said attackers have used the zero-day to steal credentials and exfiltrate data, while Volexity observed targeting of Active Directory secrets including LAPS passwords and BitLocker recovery keys.","CISA advised organizations that find a compromised appliance to back up its configuration, factory-reset and update it, restore the configuration, and reset credentials, certificates, API keys, and license-server credentials."],"insights":["Ivanti's Integrity Checker Tool may not reveal compromise from CVE-2026-104935 because the attackers' commands can run only in memory, making network and memory forensics necessary.","The observed attack chain achieved root-level control without authentication by combining an authentication bypass, remote code execution, and privilege escalation.","Recovery requires more than applying the update: CISA advises resetting all account passwords and replacing stored certificates, API keys, and license-server credentials after a confirmed compromise.","Shadowserver identified more than 5,600 internet-exposed systems with Ivanti Connect Secure fingerprints, but the article notes that the number patched or operating as honeypots is unknown."],"referencedReports":[{"title":"Security Advisory: Ivanti Connect Secure CVE-2026-104935","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935?language=en_US","publisher":"Ivanti","context":"Ivanti's security advisory describes the actively exploited Connect Secure flaw and the fixed product versions.","category":"advisory","primary":true},{"title":"A Series of Unauthenticated Events: Chained Exploitation of Ivanti Connect Secure Zero-Days","url":"https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/","publisher":"Volexity","context":"Volexity reported that UTA0576 chained the flaws to gain unauthenticated root-level code execution and target Active Directory secrets.","category":"research","primary":true},{"title":"CISA Urges Patching Newly Exploited Vulnerability in Ivanti Connect Secure","url":"https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-urges-patching-newly-exploited-vulnerability-ivanti-connect-secure","publisher":"CISA","context":"CISA's advisory urges immediate patching, describes observed credential theft and data exfiltration, and provides recovery guidance for compromised appliances.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has urged organizations to immediately patch CVE-2026-104935, a high-severity Ivanti Connect Secure authentication-bypass flaw that has been exploited as a zero-day since at least October 1. The flaw allows remote, unauthenticated attackers to execute arbitrary commands with low complexity and no user interaction. Ivanti released Connect Secure versions 22.8R2.5, 25.1.3.0, 25.1.3.1, and 25.1.1.2 to address it, warning customers of limited exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eVolexity reported that a threat actor tracked as UTA0576 chained the authentication bypass with remote code execution and privilege-escalation flaws to gain unauthenticated root-level code execution. The actor targeted Active Directory credentials and secrets, including LAPS passwords and BitLocker recovery keys, while CISA said the attacks involve credential theft and data exfiltration. Because attacker commands may execute only in memory, Ivanti\u0026rsquo;s Integrity Checker Tool may not detect evidence of compromise; CISA recommends network and memory forensics and, for confirmed compromises, a configuration backup, factory reset and upgrade, restoration, and credential and certificate rotation.\u003c/p\u003e\n"},{"n":6,"title":"CISA warns of new Ivanti bug being exploited as latest Patch Tuesday breaks records","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/new-ivanti-microsoft-bugs-exploitation","time":"12:35","priority":"MUST READ","score":98,"tldr":"CISA warned that attackers are actively exploiting a critical Ivanti Connect Secure zero-day for unauthenticated command execution, credential theft, and data exfiltration, and ordered federal agencies to patch by Friday. Microsoft also issued a record October Patch Tuesday release fixing 1,407 vulnerabilities, including an actively exploited Windows Shell flaw.","briefOverview":"\u003cp\u003eCISA warned that CVE-2026-104935, an actively exploited flaw in Ivanti Connect Secure, allows remote attackers to run commands without logging in. The agency gave U.S. federal civilian agencies until Friday to apply Ivanti’s patch. Ivanti said it is working with a limited number of customers affected through the issue, which has an 8.6 severity score.\u003c/p\u003e\n\n\u003cp\u003eVolexity investigated malicious activity involving a fully patched Ivanti appliance and identified three previously unknown flaws, two of which Ivanti patched Tuesday while work continued on the third. The attackers appeared to focus on stealing credentials, taking data, altering logs, and surveying networks; Volexity did not find malware that would let them continue operating without exploiting the appliance again. The warning is the sixth Ivanti issue added to CISA’s exploited-vulnerability list in 2026, while CISA also flagged an exploited Windows Shell flaw among Microsoft’s record October Patch Tuesday release of 1,407 fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that CVE-2026-104935 in Ivanti Connect Secure is actively exploited and directed federal civilian agencies to patch it by Friday.","Ivanti said the flaw has an 8.6 severity score and is being exploited against a limited number of customers.","Volexity found that attackers abusing a fully patched Ivanti VPN appliance appeared to pursue credential theft, data exfiltration, log tampering, and network reconnaissance.","CISA also added the actively exploited Windows Shell security feature bypass CVE-2026-96951 to its warnings, with federal agencies required to patch by Friday.","Microsoft’s October Patch Tuesday release addressed 1,407 vulnerabilities, which experts described as a monthly record."],"insights":["The Ivanti incident involved three previously unknown flaws on a fully patched appliance, but Ivanti fixed only two of them in Tuesday’s update and was still developing a fix for the third.","Volexity found no malware that would allow attackers to continue acting without exploiting the Ivanti appliance again, indicating that repeated access depended on the vulnerable device.","This is the sixth Ivanti flaw added to CISA’s known-exploited list in 2026, underscoring the repeated targeting of the company’s products.","Microsoft’s October release fixed 1,407 CVEs—more than the 1,261 it patched across all of 2020—and brought its 2026 total past 4,000 with two months remaining.","The Windows Shell flaw requires user interaction, such as opening a malicious link or attachment, unlike the Ivanti issue, which permits unauthenticated remote command execution."],"referencedReports":[{"title":"Security Advisory: Ivanti Connect Secure CVE-2026-104935","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935?language=en_US","publisher":"ivanti","context":"Ivanti confirmed that CVE-2026-104935 is being exploited and issued patching guidance for Connect Secure customers.","category":"advisory","primary":true},{"title":"A Series of Unauthenticated Events: Chained Exploitation of Ivanti Connect Secure Zero-Days","url":"https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/","publisher":"volexity","context":"The article cites Volexity's technical analysis of the malicious activity and three zero-day flaws found on a fully patched Ivanti appliance.","category":"research","primary":true},{"title":"CISA Urges Patching of Newly Exploited Vulnerability in Ivanti Connect Secure","url":"https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-urges-patching-newly-exploited-vulnerability-ivanti-connect-secure","publisher":"cisa","context":"CISA's advisory warns that attackers are exploiting the Ivanti flaw for remote command execution, credential theft, and data exfiltration.","category":"advisory","primary":true},{"title":"CVE-2026-96951","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-96951","publisher":"microsoft","context":"Microsoft's security advisory describes the actively exploited Windows Shell security feature bypass and its user-interaction requirement.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA warned that CVE-2026-104935, an actively exploited flaw in Ivanti Connect Secure, allows remote attackers to run commands without logging in. The agency gave U.S. federal civilian agencies until Friday to apply Ivanti’s patch. Ivanti said it is working with a limited number of customers affected through the issue, which has an 8.6 severity score.\u003c/p\u003e\n\n\u003cp\u003eVolexity investigated malicious activity involving a fully patched Ivanti appliance and identified three previously unknown flaws, two of which Ivanti patched Tuesday while work continued on the third. The attackers appeared to focus on stealing credentials, taking data, altering logs, and surveying networks; Volexity did not find malware that would let them continue operating without exploiting the appliance again. The warning is the sixth Ivanti issue added to CISA’s exploited-vulnerability list in 2026, while CISA also flagged an exploited Windows Shell flaw among Microsoft’s record October Patch Tuesday release of 1,407 fixes.\u003c/p\u003e\n"},{"n":11,"title":"CISA Urges Immediate Ivanti Connect Secure Updates as Honeypots Log 105 Exploit Attempts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/cisa-urges-immediate-ivanti-connect.html","time":"12:30","priority":"MUST READ","score":98,"tldr":"CISA is urging immediate patching of Ivanti Connect Secure for actively exploited CVE-2026-104935, an authentication bypass that enables unauthenticated remote command execution and has been used for credential theft and data exfiltration. Organizations should investigate for compromise and, if affected, rebuild or factory-reset appliances and rotate credentials, certificates, and API keys.","briefOverview":"\u003cp\u003eCISA urged organizations to immediately update Ivanti Connect Secure appliances and deployments following active exploitation of CVE-2026-104935. The authentication-bypass flaw affects specified Ivanti Connect Secure versions and can allow a remote attacker to run arbitrary commands without signing in. CISA said threat actors have used the zero-day to steal credentials and exfiltrate data, and added it to the Known Exploited Vulnerabilities catalog with an October 16, 2026 remediation deadline for federal civilian agencies.\u003c/p\u003e\n\n\u003cp\u003eOrganizations seeking to determine whether they were compromised need network and memory forensics, according to CISA. If compromise is found, CISA recommends backing up the configuration, factory-resetting or rebuilding the appliance, upgrading it, restoring the configuration, and rotating passwords, certificates, API keys, and license-server credentials. Previdian observed 105 exploitation attempts from 50 IP addresses, while Volexity reported that UTA0576 chained the flaw with a privilege-escalation issue to gain root-level code execution and conduct credential theft, reconnaissance, and limited Active Directory data collection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA urged organizations to immediately update Ivanti Connect Secure after CVE-2026-104935, an actively exploited authentication-bypass flaw allowing unauthenticated remote command execution.","CISA said attackers have used the flaw to steal credentials and remove data, and added it to its Known Exploited Vulnerabilities catalog with an October 16, 2026 patch deadline for federal civilian agencies.","Previdian recorded 105 attempts to exploit the flaw against its honeypot sensors from 50 unique IP addresses located in Singapore and the United States as of October 14, 2026.","Volexity reported that the previously undocumented group UTA0576 exploited CVE-2026-104935 alongside a privilege-escalation flaw to gain root-level code execution and conduct credential theft, reconnaissance, and limited Active Directory data collection.","CISA advises organizations that find evidence of compromise to back up configurations, factory-reset or rebuild affected systems, update them, and reset accounts, certificates, API keys, and license-server credentials."],"insights":["Patching alone may not be sufficient for organizations already exposed, because CISA says determining whether a system was compromised requires network and memory analysis, followed by a reset or rebuild and broad credential rotation if compromise is found.","The observed probes used a specific request header to reach an internal program and upload Perl scripts disguised as ZIP files, with returned markers indicating whether remote command execution worked.","Although Previdian's captured payloads were primarily checking whether code could run rather than installing malicious software, Volexity reported a separate campaign in which UTA0576 had already obtained root-level access and performed credential collection and directory-service reconnaissance.","The required recovery steps extend beyond user passwords to stored certificates, API keys, and license-server credentials, indicating that multiple types of stored access material may need replacement after compromise."],"referencedReports":[{"title":"CISA Urges Patching Newly Exploited Vulnerability in Ivanti Connect Secure","url":"https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-urges-patching-newly-exploited-vulnerability-ivanti-connect-secure","publisher":"cisa","context":"The article cites this CISA alert for the agency's warning that the actively exploited Ivanti flaw has been used for credential theft and data exfiltration.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/10/13/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article references this CISA advisory for the addition of CVE-2026-104935 to the Known Exploited Vulnerabilities catalog and the federal patch deadline.","category":"advisory","primary":false},{"title":"CVE-2026-104935 Telemetry","url":"https://previdian.com/CVE-2026-104935#telemetry","publisher":"previdian","context":"The article cites Previdian's telemetry as the source for the reported 105 exploitation attempts against its honeypot sensors.","category":"research","primary":true}],"body":"\u003cp\u003eCISA urged organizations to immediately update Ivanti Connect Secure appliances and deployments following active exploitation of CVE-2026-104935. The authentication-bypass flaw affects specified Ivanti Connect Secure versions and can allow a remote attacker to run arbitrary commands without signing in. CISA said threat actors have used the zero-day to steal credentials and exfiltrate data, and added it to the Known Exploited Vulnerabilities catalog with an October 16, 2026 remediation deadline for federal civilian agencies.\u003c/p\u003e\n\n\u003cp\u003eOrganizations seeking to determine whether they were compromised need network and memory forensics, according to CISA. If compromise is found, CISA recommends backing up the configuration, factory-resetting or rebuilding the appliance, upgrading it, restoring the configuration, and rotating passwords, certificates, API keys, and license-server credentials. Previdian observed 105 exploitation attempts from 50 IP addresses, while Volexity reported that UTA0576 chained the flaw with a privilege-escalation issue to gain root-level code execution and conduct credential theft, reconnaissance, and limited Active Directory data collection.\u003c/p\u003e\n"},{"n":19,"title":"Emerging Threat: (CVE-2026-103849) Adobe Commerce Template Injection Remote Code Execution","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-103849-adobe-commerce-template-injection-remote-code-execution/","time":"10:31","priority":"MUST READ","score":93,"tldr":"Adobe has patched CVE-2026-103849, a critical unauthenticated template-injection flaw (CVSS 10.0) that allows remote code execution in Adobe Commerce, Adobe Commerce B2B, and Magento Open Source. Organizations should urgently update every production and staging storefront to the October 2026 dated releases, as external scans cannot reliably distinguish patched from vulnerable builds.","briefOverview":"\u003cp\u003eCVE-2026-103849 is a template injection flaw in Adobe Commerce, Adobe Commerce B2B, and Magento Open Source that can result in arbitrary code execution. It has a CVSS v3.1 score of 10.0 and can be exploited remotely without an account or user interaction. Adobe states that exploitation could give an attacker control in the context of the current user and potentially elevated access to an affected account or session. The article notes that compromised online stores can expose customer data, payment pages, and checkout flows to attackers.\u003c/p\u003e\n\n\u003cp\u003eAdobe released fixes in security bulletin APSB26-153 on 13 October 2026, and affected organizations should update to the relevant October 2026 dated release. The article emphasizes that a major version number alone is insufficient because a September build can be vulnerable while an October build on the same major line is fixed. External scans can identify the platform but cannot determine the dated patch level, making internal inventory necessary. Organizations should include production, staging, test, QA, demo, and brand-specific storefronts in their patching efforts.\u003c/p\u003e\n\n\u003cp\u003eCyCognito observed that nearly all identified assets were public web applications and that roughly one in six carried staging, test, QA, or demo markers. It advises organizations to review whether internet-facing staging environments need to remain public, check payment and checkout pages for unauthorized scripts, and review administrative accounts, API keys, and integration tokens for unexpected changes. The article also recommends monitoring logs for unusual template-rendering errors and unexpected process execution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-103849 is a CVSS 10.0 template-injection flaw that can allow unauthenticated remote code execution in Adobe Commerce, Adobe Commerce B2B, and Magento Open Source.","Adobe released fixes in security bulletin APSB26-153 on 13 October 2026, with affected organizations instructed to install the October 2026 dated releases for their product line.","A store’s major version alone cannot establish whether it is vulnerable, because the dated September builds are affected while the corresponding October builds are fixed.","CyCognito found that roughly one in six observed storefronts had staging, test, QA, or demo markers, and these internet-facing environments may run the same codebase as production.","The article recommends inventorying all production and non-production instances, checking payment and checkout pages for unauthorized scripts, and reviewing admin accounts, API keys, and integration tokens for unexpected changes."],"insights":["Adobe’s dated release naming makes major-version inventory inadequate: a store recorded simply as version 2.4.7 could be either vulnerable on the September build or fixed on the October build.","External scanning can identify Adobe Commerce or Magento, but it cannot reliably determine the dated patch level needed to distinguish a vulnerable storefront from a patched one.","Internet-facing staging, test, QA, and demo storefronts are a significant concern because they commonly use the same codebase as production while receiving less attention during change windows.","The article warns that asset geolocation largely reflects CDN or cloud-hosting infrastructure, so the high number of storefronts resolving to the United States should not be treated as evidence that the businesses themselves are U.S.-based.","Sector exposure percentages may be driven by large organizations operating many separate brand, market, and language storefronts rather than by greater platform adoption across those industries."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-103849 is a template injection flaw in Adobe Commerce, Adobe Commerce B2B, and Magento Open Source that can result in arbitrary code execution. It has a CVSS v3.1 score of 10.0 and can be exploited remotely without an account or user interaction. Adobe states that exploitation could give an attacker control in the context of the current user and potentially elevated access to an affected account or session. The article notes that compromised online stores can expose customer data, payment pages, and checkout flows to attackers.\u003c/p\u003e\n\n\u003cp\u003eAdobe released fixes in security bulletin APSB26-153 on 13 October 2026, and affected organizations should update to the relevant October 2026 dated release. The article emphasizes that a major version number alone is insufficient because a September build can be vulnerable while an October build on the same major line is fixed. External scans can identify the platform but cannot determine the dated patch level, making internal inventory necessary. Organizations should include production, staging, test, QA, demo, and brand-specific storefronts in their patching efforts.\u003c/p\u003e\n\n\u003cp\u003eCyCognito observed that nearly all identified assets were public web applications and that roughly one in six carried staging, test, QA, or demo markers. It advises organizations to review whether internet-facing staging environments need to remain public, check payment and checkout pages for unauthorized scripts, and review administrative accounts, API keys, and integration tokens for unexpected changes. The article also recommends monitoring logs for unusual template-rendering errors and unexpected process execution.\u003c/p\u003e\n"},{"n":1,"title":"Global takedown hits network behind 1 billion phishing messages","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/global-takedown-hits-network-behind-1-billion-phishing-messages/","time":"13:12","priority":"MUST READ","score":90,"tldr":"A global law-enforcement operation disrupted YAM Store and associated phishing kits CoGUI and Iron Man, which facilitated more than a billion phishing messages targeting organizations worldwide. Microsoft disabled over 20,000 linked accounts and blocked 100,000 fraudulent domains used to impersonate organizations and steal credentials and payment data.","briefOverview":"\u003cp\u003eMicrosoft, Japan’s National Police Agency, and other partners disrupted YAM Store, a Chinese-language cybercrime marketplace connected to the CoGUI, Haozi, and Iron Man System phishing kits. The ecosystem facilitated more than one billion malicious messages targeting over 75,000 organizations across 150 countries. Microsoft said that, since the start of the year, more than 750 million malicious email and text messages had targeted its customers.\u003c/p\u003e\n\n\u003cp\u003eYAM Store sold compromised or fraudulently obtained Microsoft and Google accounts, licenses, and storage, and its operators used expired domains and AI-generated fake organizations to obtain cloud accounts. The phishing kits impersonated banks, retailers, delivery services, and government agencies, using lures such as unpaid tolls, traffic penalties, delivery problems, and account-verification requests. Under a U.S. court order, Microsoft and Health-ISAC seized or redirected supporting domains, while Microsoft deactivated more than 20,000 linked accounts and blocked 100,000 domains used for impersonation and fraud.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A global investigation disrupted YAM Store, an underground marketplace linked to the CoGUI, Haozi, and Iron Man System phishing kits, collectively tracked as Storm-2990.","Microsoft said the phishing platforms sent more than 750 million malicious email and text messages to Microsoft customers since the start of the year, while the broader ecosystem facilitated more than one billion messages targeting over 75,000 organizations in 150 countries.","YAM Store sold compromised or fraudulently obtained Microsoft and Google accounts, licenses, and storage, including accounts acquired using expired domains or fake organizations created with AI tools.","The phishing kits used lures such as unpaid tolls, traffic penalties, delivery problems, and account verification requests, while also using location restrictions, fake human-verification pages, and IP filtering to hinder analysis.","Under a U.S. court order, Microsoft and Health-ISAC seized and redirected supporting domains, deactivated more than 20,000 YAM Store-linked accounts, and blocked 100,000 domains used for impersonation and fraud."],"insights":["The operators reportedly made expired organizations appear active again by rebuilding their websites, then used those identities to obtain cloud accounts.","YAM Store also created fake organizations with AI-generated content and documentation, showing that the infrastructure supply chain included fabricated business identities rather than only stolen accounts.","Iron Man had more than 2,300 impersonation templates spanning banks, retailers, delivery services, and government agencies, and had displaced CoGUI by mid-2026.","The phishing platforms used Microsoft SharePoint and OneDrive storage for hosting and employed fake CAPTCHA pages, location-based targeting, and IP filtering to make investigation more difficult."],"referencedReports":[{"title":"The hidden network inside the phishing infrastructure ecosystem powering global cybercrime","url":"https://www.microsoft.com/en-us/security/blog/2026/10/14/the-hidden-network-inside-the-phishing-infrastructure-ecosystem-powering-global-cybercrime/","publisher":"microsoft","context":"Microsoft's report describes YAM Store, the associated phishing kits, and actions taken to disrupt the infrastructure.","category":"research","primary":true},{"title":"Iron Man \u0026 YAM Store: Powering a global phishing-as-a-service ecosystem","url":"https://www.resecurity.com/blog/article/iron-man-yamstore-powering-a-global-phishing-as-a-service-ecosystem","publisher":"resecurity","context":"Resecurity's technical analysis provides additional details on Iron Man infrastructure, including an exposed registry and phishing-package catalog.","category":"research","primary":false},{"title":"Disruption targets major Chinese-language phishing kits with Japanese focus","url":"https://www.proofpoint.com/us/blog/threat-insight/disruption-targets-major-chinese-language-phishing-kits-japanese-focus","publisher":"proofpoint","context":"Proofpoint's research is cited for identifying CoGUI-linked email campaigns consistently targeting Japan in late 2024.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft, Japan’s National Police Agency, and other partners disrupted YAM Store, a Chinese-language cybercrime marketplace connected to the CoGUI, Haozi, and Iron Man System phishing kits. The ecosystem facilitated more than one billion malicious messages targeting over 75,000 organizations across 150 countries. Microsoft said that, since the start of the year, more than 750 million malicious email and text messages had targeted its customers.\u003c/p\u003e\n\n\u003cp\u003eYAM Store sold compromised or fraudulently obtained Microsoft and Google accounts, licenses, and storage, and its operators used expired domains and AI-generated fake organizations to obtain cloud accounts. The phishing kits impersonated banks, retailers, delivery services, and government agencies, using lures such as unpaid tolls, traffic penalties, delivery problems, and account-verification requests. Under a U.S. court order, Microsoft and Health-ISAC seized or redirected supporting domains, while Microsoft deactivated more than 20,000 linked accounts and blocked 100,000 domains used for impersonation and fraud.\u003c/p\u003e\n"},{"n":9,"title":"curl Patches HTTP/2 Upload Flaw After PoC Demonstrates Client-Side Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/curl-patches-http2-upload-flaw-after.html","time":"12:13","priority":"SHOULD READ","score":86,"tldr":"curl and libcurl 8.12.0–8.22.0 contain a high-severity HTTP/2 upload use-after-free flaw (CVE-2026-92392) that a malicious upload server could potentially turn into client-side code execution. Upgrade to curl 8.23.0 or a listed backported release, or disable HTTP/2 until patched.","briefOverview":"\u003cp\u003ecurl released version 8.23.0 on October 14 to fix CVE-2026-92392, a high-severity use-after-free flaw in HTTP/2 uploads affecting curl and libcurl 8.12.0 through 8.22.0. A malicious server receiving an upload can corrupt memory on the client, and the researcher’s proof of concept demonstrated client-side code execution under highly specific conditions. The issue affects both the curl command-line tool and libcurl, which is used by other applications.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires an approximately 135 KB upload over HTTP/2 to an attacker-controlled server with a certificate accepted by the client. During a stalled and reset upload, leftover data can be interpreted as a new request after curl has prematurely removed the transfer’s HTTP/2 references, leaving a pointer to a handle that may later be freed and reused. curl says practical code execution requires detailed knowledge of the target’s build and memory layout and is more likely to cause a crash, but recommends upgrading to 8.23.0 or a backported fixed version; users unable to update can temporarily force HTTP/1.1.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["curl fixed CVE-2026-92392 in version 8.23.0, a high-severity use-after-free flaw affecting curl and libcurl versions 8.12.0 through 8.22.0.","A malicious server receiving an HTTP/2 upload can trigger the flaw, and the public proof of concept demonstrated code execution on the uploading client under highly specific conditions.","The attack requires an upload of roughly 135 KB to an attacker-controlled server whose certificate passes the client’s checks, with HTTP/2 enabled and negotiated.","Users should upgrade to curl 8.23.0 or an available backported fixed release; until then, curl recommends avoiding HTTP/2 by using HTTP/1.1.","The public report credited Luna Tong of Anthropic, and curl said Anthropic’s OSS Scanner identified the issue."],"insights":["The flaw is triggered by the server receiving an upload rather than by a malicious download, meaning the client can be endangered while sending data to a server it trusts enough to accept its certificate.","The published proof of concept reportedly needs exact knowledge of the target’s curl build, architecture, memory allocator, and heap layout, and curl says a failed attempt is more likely to crash the client than execute code.","A build of libcurl without HTTP/2 support cannot reach the vulnerable upload path, and temporarily forcing HTTP/1.1 is the documented mitigation when an immediate update is not possible.","The actual code fix is a six-line reordering that retains HTTP/2 references to a transfer handle until remaining upload data has been flushed.","The report was credited to Luna Tong of Anthropic and associated with Anthropic’s OSS Scanner, despite curl’s maintainer previously saying that most AI-related security submissions received that year had not been valid."],"referencedReports":[{"title":"CVE-2026-92392","url":"https://curl.se/docs/CVE-2026-92392.html","publisher":"curl project","context":"curl's advisory documents the HTTP/2 upload use-after-free flaw, affected versions, and mitigation details.","category":"advisory","primary":true},{"title":"HackerOne report #4030333","url":"https://hackerone.com/reports/4030333","publisher":"luna tong of anthropic","context":"The article cites the reporter's public write-up as containing a malicious server script and Docker reproducer for the demonstrated client-side code execution.","category":"research","primary":true},{"title":"A UAF turned RCE","url":"https://daniel.haxx.se/blog/2026/10/14/a-uaf-turned-rce/","publisher":"daniel stenberg","context":"The article cites curl's lead developer's technical explanation of the vulnerable HTTP/2 upload and retry code path.","category":"research","primary":false}],"body":"\u003cp\u003ecurl released version 8.23.0 on October 14 to fix CVE-2026-92392, a high-severity use-after-free flaw in HTTP/2 uploads affecting curl and libcurl 8.12.0 through 8.22.0. A malicious server receiving an upload can corrupt memory on the client, and the researcher’s proof of concept demonstrated client-side code execution under highly specific conditions. The issue affects both the curl command-line tool and libcurl, which is used by other applications.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires an approximately 135 KB upload over HTTP/2 to an attacker-controlled server with a certificate accepted by the client. During a stalled and reset upload, leftover data can be interpreted as a new request after curl has prematurely removed the transfer’s HTTP/2 references, leaving a pointer to a handle that may later be freed and reused. curl says practical code execution requires detailed knowledge of the target’s build and memory layout and is more likely to cause a crash, but recommends upgrading to 8.23.0 or a backported fixed version; users unable to update can temporarily force HTTP/1.1.\u003c/p\u003e\n"},{"n":14,"title":"Researchers Used a Public OpenAI Model to Build a $250,000 Chrome Full-Chain Exploit in Six Days","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/researchers-used-public-openai-model-to.html","time":"11:19","priority":"SHOULD READ","score":86,"tldr":"XBOW researchers used OpenAI’s public GPT-5.6 Sol model to help build a three-bug Chrome-for-Windows exploit chain in six days, earning Google’s $250,000 maximum reward. Google has patched the flaws, so Chrome users should restart and update to version 152.0.7977.82 or later.","briefOverview":"\u003cp\u003eXBOW researchers used AI agents running OpenAI’s public GPT-5.6 Sol model to construct a full Google Chrome exploit chain for Windows in six days. The chain combined three then-unknown flaws and could run code on a computer when a user merely loaded a web page, with no click or download required. Google confirmed the flaws, fixed them, and awarded XBOW its maximum $250,000 reward for a full Chrome exploit.\u003c/p\u003e\n\n\u003cp\u003eThe chain crossed Chrome’s two nested protective barriers, moving from control inside the V8 JavaScript engine through Chrome’s animated-WebP image decoder and then Crashpad, the browser’s crash handler that runs outside the sandbox. XBOW said the six-day work cost about $40,000 in AI charges, though it followed months of preparation and an earlier full chain that took two months. Google fixed the identified issues in Chrome 152 updates, and users need to restart Chrome after updating so version 152.0.7977.82 or later takes effect.\u003c/p\u003e\n\n\u003cp\u003eXBOW said AI agents searched Chrome source code, tested ideas, built proof-of-concept code, and drafted exploit code, while researchers selected targets, checked results, and assembled the chain. The company said the flaws were never used against Chrome users, but estimated that about 1 billion people using Chrome on Windows could have been at risk before fixes were released. XBOW characterized the result as evidence that AI can reduce the time and cost needed to produce a high-value Chrome exploit chain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["XBOW researchers used AI agents running OpenAI's publicly available GPT-5.6 Sol model to build a Chrome-for-Windows exploit chain in six days.","The chain combined three previously unknown Chrome flaws to let a web page run code outside Chrome on a Windows computer without requiring a click or download.","Google confirmed and fixed all three flaws and paid XBOW its maximum $250,000 reward for a full Chrome exploit chain.","XBOW said the six-day effort cost about $40,000 in AI charges, although it followed months of earlier work and an earlier full-chain effort that took two months.","Chrome users need to restart the browser after updating so that version 152.0.7977.82 or later takes effect."],"insights":["The six-day result followed months of preparation and an earlier full Chrome exploit chain that took XBOW two months, so the headline sprint was not a wholly from-scratch effort.","XBOW designed the exploit chain as interchangeable parts, allowing researchers to replace one component after learning that Google already knew about the flaw it used.","The Chrome fixes do not fully protect users until the browser is restarted, even though Chrome updates automatically.","According to XBOW, the AI agents handled source-code searching, testing, proof-of-concept development, and initial exploit drafts, while researchers selected targets and decided how to combine the results."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/08/stable-channel-update-for-desktop_0256176589.html","publisher":"google","context":"The article cites Google's Chrome release notes as confirmation that the reported flaws were fixed.","category":"advisory","primary":false}],"body":"\u003cp\u003eXBOW researchers used AI agents running OpenAI’s public GPT-5.6 Sol model to construct a full Google Chrome exploit chain for Windows in six days. The chain combined three then-unknown flaws and could run code on a computer when a user merely loaded a web page, with no click or download required. Google confirmed the flaws, fixed them, and awarded XBOW its maximum $250,000 reward for a full Chrome exploit.\u003c/p\u003e\n\n\u003cp\u003eThe chain crossed Chrome’s two nested protective barriers, moving from control inside the V8 JavaScript engine through Chrome’s animated-WebP image decoder and then Crashpad, the browser’s crash handler that runs outside the sandbox. XBOW said the six-day work cost about $40,000 in AI charges, though it followed months of preparation and an earlier full chain that took two months. Google fixed the identified issues in Chrome 152 updates, and users need to restart Chrome after updating so version 152.0.7977.82 or later takes effect.\u003c/p\u003e\n\n\u003cp\u003eXBOW said AI agents searched Chrome source code, tested ideas, built proof-of-concept code, and drafted exploit code, while researchers selected targets, checked results, and assembled the chain. The company said the flaws were never used against Chrome users, but estimated that about 1 billion people using Chrome on Windows could have been at risk before fixes were released. XBOW characterized the result as evidence that AI can reduce the time and cost needed to produce a high-value Chrome exploit chain.\u003c/p\u003e\n"},{"n":21,"title":"Disrupting the service economy behind transnational cybercrime operations","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/disrupting-the-service-economy-behind-transnational-cybercrime-operations/","time":"13:34","priority":"SHOULD READ","score":85,"tldr":"Microsoft, Japan’s National Police Agency, Health-ISAC, and partners are disrupting YAM Store, CoGUI, and Iron Man, a Chinese-language cybercrime service ecosystem that enabled more than one billion phishing and scam messages worldwide in 2026.","briefOverview":"\u003cp\u003eMicrosoft and Japan’s National Police Agency investigated fraud and scam activity targeting people and businesses in Japan and traced it to a Chinese-language cybercrime marketplace. The marketplace offered accounts, hosting services, and tools used to create fake websites and online identities. Microsoft said the investigation expanded globally with participation from the Japan Cybercrime Control Center, Resecurity, Cloudflare, Oracle, Proofpoint, TRM Labs, and Health-ISAC.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft and Health-ISAC are moving to dismantle three components of the marketplace: YAM Store, CoGUI, and Iron Man. Since January 2026, the three services collectively enabled more than one billion malicious messages targeting over 75,000 organizations worldwide, including more than 750 million messages directed at Microsoft customers. The messages targeted consumers, healthcare organizations, financial institutions, and other businesses in more than 150 countries, and the article states that the operators generated tens of millions of dollars.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft and Japan’s National Police Agency traced fraud and scam activity targeting Japan to a Chinese-language cybercrime marketplace offering accounts, hosting services, and tools for fake websites and online identities.","Microsoft and Health-ISAC are moving to dismantle YAM Store, CoGUI, and Iron Man, three components of that criminal marketplace.","Since January 2026, YAM Store, CoGUI, and Iron Man collectively enabled more than one billion malicious messages targeting more than 75,000 organizations worldwide.","More than 750 million of the malicious messages were aimed at Microsoft customers, and targets included consumers, healthcare organizations, financial institutions, and other businesses in more than 150 countries.","The investigation involved the Japan Cybercrime Control Center, Resecurity, Cloudflare, Oracle, Proofpoint, and TRM Labs."],"insights":["The investigation found that scams targeting Japan were supported by a broader Chinese-language marketplace where criminals could purchase the accounts, hosting, and tools needed to run fraudulent operations.","The three services appear to support different building blocks of online fraud, including fake websites and online identities, rather than being described as a single scam campaign.","The scale of the activity spans consumers and organizations in healthcare, finance, and other industries across more than 150 countries, showing that the underlying services were used beyond a single sector or location.","The disruption effort combines law enforcement, a health-sector information-sharing nonprofit, technology companies, and threat-research organizations, reflecting the range of parties involved in addressing the marketplace."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft and Japan’s National Police Agency investigated fraud and scam activity targeting people and businesses in Japan and traced it to a Chinese-language cybercrime marketplace. The marketplace offered accounts, hosting services, and tools used to create fake websites and online identities. Microsoft said the investigation expanded globally with participation from the Japan Cybercrime Control Center, Resecurity, Cloudflare, Oracle, Proofpoint, TRM Labs, and Health-ISAC.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft and Health-ISAC are moving to dismantle three components of the marketplace: YAM Store, CoGUI, and Iron Man. Since January 2026, the three services collectively enabled more than one billion malicious messages targeting over 75,000 organizations worldwide, including more than 750 million messages directed at Microsoft customers. The messages targeted consumers, healthcare organizations, financial institutions, and other businesses in more than 150 countries, and the article states that the operators generated tens of millions of dollars.\u003c/p\u003e\n"},{"n":7,"title":"Microsoft takes down 3 major phishing platforms used by Chinese cybercriminals","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/microsoft-takes-down-3-major-chinese-phishing-platforms","time":"13:18","priority":"SHOULD READ","score":84,"tldr":"Microsoft, working with Japanese police and Health-ISAC, used a U.S. court order to disrupt the YAM Store, CoGUI, and Iron Man phishing platforms, which collectively enabled more than 750 million malicious messages targeting Microsoft customers since January. The operation seized and redirected domains, disabled over 20,000 associated accounts, and targeted infrastructure used to steal credentials and financial data worldwide.","briefOverview":"\u003cp\u003eMicrosoft, working with Japan’s National Police Agency and Health-ISAC, obtained a U.S. court order to seize and redirect domains supporting the YAM Store, CoGUI, and Iron Man phishing platforms. The three services collectively enabled more than 750 million malicious messages targeting Microsoft customers since January and impersonated more than 75,000 organizations worldwide. Their campaigns targeted consumers, healthcare organizations, financial institutions, and businesses in more than 150 countries to steal credentials, personal information, banking data, and other login details.\u003c/p\u003e\n\n\u003cp\u003eIron Man sold subscriptions containing more than 2,300 pre-built fake webpages for services including postal companies, tax agencies, banks, and telecom providers, while CoGUI supplied ready-made websites and messages impersonating trusted brands and institutions. YAM Store operated as a marketplace for compromised or fraudulently obtained Microsoft and Google environments, including domains connected to legitimate or expired organization names. Microsoft disabled more than 20,000 accounts linked to YAM Store, continues to remove hosted infrastructure, and is blocking more than 100,000 domains used for impersonation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft obtained a U.S. court order, working with Japan’s National Police Agency and Health-ISAC, to seize and redirect domains supporting the YAM Store, CoGUI, and Iron Man phishing platforms.","Since January, YAM Store, CoGUI, and Iron Man collectively enabled more than 750 million malicious messages targeting Microsoft customers.","Iron Man offered subscribers more than 2,300 ready-made fake webpages impersonating services such as postal companies, tax agencies, banks, and telecom providers.","Microsoft disabled more than 20,000 accounts connected to YAM Store and said it is blocking more than 100,000 domains used for impersonation.","The platforms were used to target consumers, healthcare organizations, financial institutions, and other businesses in more than 150 countries to steal credentials, personal information, and banking data."],"insights":["The phishing ecosystem included a marketplace, YAM Store, where criminals could buy compromised or fraudulently obtained Microsoft and Google environments selected by factors such as account age, subscription type, and education or nonprofit domain type.","Microsoft found similarities in the infrastructure behind YAM Store, CoGUI, and Iron Man, suggesting that their developers collaborated closely or that the platforms had shared development origins.","Criminals could buy expired domains formerly used by real organizations, rebuild the associated websites to appear legitimate, and use them to collect Microsoft 365 credentials for resale on YAM Store."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft, working with Japan’s National Police Agency and Health-ISAC, obtained a U.S. court order to seize and redirect domains supporting the YAM Store, CoGUI, and Iron Man phishing platforms. The three services collectively enabled more than 750 million malicious messages targeting Microsoft customers since January and impersonated more than 75,000 organizations worldwide. Their campaigns targeted consumers, healthcare organizations, financial institutions, and businesses in more than 150 countries to steal credentials, personal information, banking data, and other login details.\u003c/p\u003e\n\n\u003cp\u003eIron Man sold subscriptions containing more than 2,300 pre-built fake webpages for services including postal companies, tax agencies, banks, and telecom providers, while CoGUI supplied ready-made websites and messages impersonating trusted brands and institutions. YAM Store operated as a marketplace for compromised or fraudulently obtained Microsoft and Google environments, including domains connected to legitimate or expired organization names. Microsoft disabled more than 20,000 accounts linked to YAM Store, continues to remove hosted infrastructure, and is blocking more than 100,000 domains used for impersonation.\u003c/p\u003e\n"},{"n":12,"title":"Hirudo Android Trojan Uses Patched Banking Apps to Bypass Their Built-In Security Checks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/hirudo-android-trojan-uses-patched.html","time":"11:08","priority":"SHOULD READ","score":84,"tldr":"ThreatFabric uncovered Hirudo, an Android banking trojan distributed through fake app updates that steals credentials and remotely controls devices. Its key advance is replacing legitimate Indonesian banking apps with tampered copies that bypass in-app signature, accessibility, screen-capture, and Play Integrity checks.","briefOverview":"\u003cp\u003eThreatFabric disclosed Hirudo, an Android banking trojan delivered through shopping, adult video, and entertainment apps that present a fake in-app update. The malicious apps can load real content in a WebView while checking whether the Hirudo payload has been installed and granted accessibility and notification permissions. Hirudo supports credential theft, SMS theft, screen and camera capture, and live remote control. ThreatFabric identified credential targeting across Indonesia, China, India, Mexico, Morocco, and Thailand.\u003c/p\u003e\n\n\u003cp\u003eHirudo’s notable capability is replacing genuine banking apps with purpose-built altered versions, with replacements identified for eight Indonesian banking apps. The trojan detects a targeted app, checks its signing certificate, opens Android’s uninstaller for the legitimate app, and downloads a bank-specific replacement. These altered apps use a hooking engine to provide deceptive responses to signature, accessibility, screen-capture, and Play Integrity checks, including allowing screens normally protected from capture to be viewed and recorded remotely. ThreatFabric said that locally generated app security signals should be verified server-side because they can be influenced once an app is replaced.\u003c/p\u003e\n\n\u003cp\u003eThe operation also uses a deliberately non-functional VPN connection before payload installation, which ThreatFabric assessed as an effort to reduce online reputation and code-analysis checks rather than fully defeat Google Play Protect. Fake web pages impersonating Google Play Store listings for shopping, short drama, and football apps are used for distribution, with users assessed to be directed through Meta-owned social-media advertisements. The backend manages campaigns, device control, and stolen data such as device records, lock-screen history, and financial profiles. ThreatFabric described Hirudo as an escalation because its reusable tampering engine moves manipulation into the banking app itself.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ThreatFabric identified Hirudo, an Android banking trojan delivered through shopping, adult video, and entertainment dropper apps that present a fake in-app update to install the payload.","Hirudo can steal credentials, SMS messages, screen and camera data, and enable live remote control of an infected device.","The operation includes patched replacements for eight Indonesian banking apps, which are installed after the genuine app is removed.","The altered banking apps use a hooking engine to return deceptive results for signature, accessibility, screen-capture, and Play Integrity checks.","ThreatFabric said Hirudo campaigns use fake Google Play Store-style web pages and may direct users there through advertisements on Meta-owned social media platforms."],"insights":["Hirudo’s fake VPN connection is intended to reduce online reputation and code-analysis checks before installation, but ThreatFabric noted that Google Play Protect can still detect known harmful apps offline.","A valid Play Integrity result cannot by itself prove that an app is genuine in this case, because Hirudo relays integrity requests to an operator-controlled server that supplies a verdict accepted by the altered app.","The banking-app replacement process has a practical limitation: the legitimate app must first be removed before the near-identical malicious version can be installed.","ThreatFabric said that once an app can be replaced, security signals produced locally by the app, including its signature and accessibility status, should be verified on the server because they can be influenced by an attacker."],"referencedReports":[{"title":"Hirudo: From Fake Updates to Patched Banking Apps","url":"https://www.threatfabric.com/blogs/hirudo-from-fake-updates-to-patched-banking-apps","publisher":"threatfabric","context":"The article relies on ThreatFabric's technical analysis of the Hirudo Android banking trojan and its patched banking-app replacements.","category":"research","primary":true}],"body":"\u003cp\u003eThreatFabric disclosed Hirudo, an Android banking trojan delivered through shopping, adult video, and entertainment apps that present a fake in-app update. The malicious apps can load real content in a WebView while checking whether the Hirudo payload has been installed and granted accessibility and notification permissions. Hirudo supports credential theft, SMS theft, screen and camera capture, and live remote control. ThreatFabric identified credential targeting across Indonesia, China, India, Mexico, Morocco, and Thailand.\u003c/p\u003e\n\n\u003cp\u003eHirudo’s notable capability is replacing genuine banking apps with purpose-built altered versions, with replacements identified for eight Indonesian banking apps. The trojan detects a targeted app, checks its signing certificate, opens Android’s uninstaller for the legitimate app, and downloads a bank-specific replacement. These altered apps use a hooking engine to provide deceptive responses to signature, accessibility, screen-capture, and Play Integrity checks, including allowing screens normally protected from capture to be viewed and recorded remotely. ThreatFabric said that locally generated app security signals should be verified server-side because they can be influenced once an app is replaced.\u003c/p\u003e\n\n\u003cp\u003eThe operation also uses a deliberately non-functional VPN connection before payload installation, which ThreatFabric assessed as an effort to reduce online reputation and code-analysis checks rather than fully defeat Google Play Protect. Fake web pages impersonating Google Play Store listings for shopping, short drama, and football apps are used for distribution, with users assessed to be directed through Meta-owned social-media advertisements. The backend manages campaigns, device control, and stolen data such as device records, lock-screen history, and financial profiles. ThreatFabric described Hirudo as an escalation because its reusable tampering engine moves manipulation into the banking app itself.\u003c/p\u003e\n"},{"n":3,"title":"Hirudo Android malware replaces banking apps to evade security checks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hirudo-android-malware-replaces-banking-apps-to-evade-security-checks/","time":"11:41","priority":"SHOULD READ","score":82,"tldr":"Hirudo Android banking malware uses seemingly legitimate app loaders to replace real banking apps with patched copies that bypass signature, Accessibility, and Play Integrity checks. It can then steal banking credentials and PINs, intercept SMS, record screens and audio, and remotely control infected devices, with current targeting centered on Indonesian banks.","briefOverview":"\u003cp\u003eThreatFabric has identified a new Android banking malware called Hirudo that replaces legitimate banking apps with modified copies to bypass built-in security checks. Hirudo has been observed impersonating at least seven Indonesian banks and also targets financial organizations in China, India, Mexico, Morocco, and Thailand. It is distributed through apparently functional shopping, adult-content, and short-drama apps that display fake update notices and request permissions, including Accessibility access.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining the required access, Hirudo launches the genuine banking app’s uninstaller, downloads a patched replacement, and uses Accessibility permissions to install it. The altered app retains most of the original code but uses a hooking engine based on YAHFA and Dobby to substitute certificate information, hide enabled Accessibility services, remove screenshot protection, and modify attestation-related checks. Hirudo can steal banking passwords, payment PINs, device-unlock secrets, and SMS messages, while also streaming screens, recording audio, and accessing cameras. ThreatFabric found thousands of credential entries and related device and financial-profile data in an unsecured backend panel, though the total victim count is unknown.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hirudo is an Android banking malware that replaces legitimate banking apps with modified copies designed to bypass security checks and steal credentials.","The malware is delivered through seemingly functional shopping, adult-content, and short-drama apps that show fake update prompts to obtain permissions, including access that lets the app control parts of the phone.","After installation, Hirudo can remove the real banking app, install a patched version, hide enabled accessibility services, disable screenshot protections, and alter certificate-related checks.","Hirudo can steal banking passwords, payment PINs, device-unlock secrets, and SMS messages, while also streaming the screen, recording audio, and accessing both cameras.","ThreatFabric observed Hirudo impersonating at least seven Indonesian banks and reported that it also targets financial organizations in China, India, Mexico, Morocco, and Thailand."],"insights":["Hirudo does not merely imitate banking screens; it installs altered versions of the real banking apps that retain most of the original code, allowing its changes to run inside the bank app’s own process.","The app-replacement step is a weak point for the operators because victims can interrupt the process both when the real banking app is removed and when the patched replacement is installed.","Some of Hirudo’s certificate-forgery defenses may be detectable because its bundled attestation keybox was publicly leaked and Google has marked two associated certificates as compromised.","The malware’s payment theft flow is designed to conceal fraud from victims by showing a fake payment-success message after collecting their PINs.","ThreatFabric found thousands of credential entries and other sensitive device and financial-profile data in an unsecured operator backend, although the total number of victims is unknown."],"referencedReports":[{"title":"Hirudo: From Fake Updates to Patched Banking Apps","url":"https://www.threatfabric.com/blogs/hirudo-from-fake-updates-to-patched-banking-apps","publisher":"threatfabric","context":"The article relies on ThreatFabric's research for its analysis of Hirudo's delivery chain, banking-app replacement process, evasion methods, targeting, and data-stealing capabilities.","category":"research","primary":true}],"body":"\u003cp\u003eThreatFabric has identified a new Android banking malware called Hirudo that replaces legitimate banking apps with modified copies to bypass built-in security checks. Hirudo has been observed impersonating at least seven Indonesian banks and also targets financial organizations in China, India, Mexico, Morocco, and Thailand. It is distributed through apparently functional shopping, adult-content, and short-drama apps that display fake update notices and request permissions, including Accessibility access.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining the required access, Hirudo launches the genuine banking app’s uninstaller, downloads a patched replacement, and uses Accessibility permissions to install it. The altered app retains most of the original code but uses a hooking engine based on YAHFA and Dobby to substitute certificate information, hide enabled Accessibility services, remove screenshot protection, and modify attestation-related checks. Hirudo can steal banking passwords, payment PINs, device-unlock secrets, and SMS messages, while also streaming screens, recording audio, and accessing cameras. ThreatFabric found thousands of credential entries and related device and financial-profile data in an unsecured backend panel, though the total victim count is unknown.\u003c/p\u003e\n"},{"n":18,"title":"Break the silence: Kazakhstan-nexus UAT-6275 targets CIS government organizations","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/break-the-silence-kazakhstan-nexus-uat-6275-targets-cis-government-organizations/","time":"14:00","priority":"SHOULD READ","score":82,"tldr":"Cisco Talos and Recorded Future linked UAT-6275 (TAG-193/Silent Lynx), a suspected Kazakhstan-nexus espionage group, to campaigns targeting government, environmental, and energy organizations across Central Asia and the CIS. The group uses malicious documents, PowerShell downloaders, GitHub-hosted payloads, and a WinRAR exploit to deploy reverse shells and maintain access.","briefOverview":"\u003cp\u003eCisco Talos and Recorded Future investigated UAT-6275, also tracked as TAG-193 and overlapping with reported Silent Lynx activity, targeting government organizations across Central Asia and the wider Commonwealth of Independent States. The group’s observed victims and lure themes spanned Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan, Uzbekistan, Armenia, Azerbaijan, Russia, and Belarus. Targeted organizations included entities responsible for diplomacy, economic development, agriculture, environmental management, water resources, forestry, and energy. Talos assessed with medium confidence that the activity has a Kazakhstan nexus.\u003c/p\u003e\n\n\u003cp\u003eResearchers found three publicly accessible staging directories and a previously unreported GitHub repository used to host malicious scripts and payloads. These exposed resources revealed payload builds, tool inventories, command-and-control infrastructure changes, and indications of preparation for post-compromise operations, including Linux-compatible tools and a proof-of-concept for FortiWeb CVE-2025-25257. From June 2025 through April 2026, the group used four delivery chains involving macro-enabled Word documents, PS2EXE-packaged PowerShell downloaders, malicious shortcuts that fetch GitHub-hosted scripts, and a crafted WinRAR archive exploiting CVE-2025-8088. Recovered payloads included the Chvost, Laplas, and PickleShell reverse shells, while some samples created scheduled tasks or placed PickleShell in the Windows Startup folder for persistence.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s decoys and timing suggest an intelligence focus on regional diplomatic developments, environmental management, and energy resources. Talos observed activity involving a Tajik government entity after treaty discussions with Kazakhstan and a Belarusian entity before a bilateral meeting, while lures referenced international trade, aviation, forestry, and oil cooperation. The article advises affected sectors to monitor unexpected PowerShell activity, GitHub downloads, scheduled-task creation, and Startup-folder changes, and to keep archive utilities patched. Cisco lists ClamAV signatures and Snort rules for detection, with indicators of compromise published in its GitHub repository.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos and Recorded Future identified UAT-6275, also tracked as TAG-193, targeting government organizations across Central Asia and the wider Commonwealth of Independent States.","The group used four delivery chains involving macro-enabled Word documents, PowerShell-based downloaders, GitHub-hosted scripts, and a WinRAR archive exploiting CVE-2025-8088.","Recovered payloads included the Chvost, Laplas, and PickleShell reverse shells, which provide interactive remote access on compromised systems.","Three publicly accessible staging directories and a GitHub repository exposed payload builds, tool inventories, and changes to the group’s command-and-control infrastructure.","Talos assessed with medium confidence that UAT-6275 has a Kazakhstan nexus based on infrastructure access, Russian-language artifacts, sample submissions, working-hour analysis, and regional targeting interests."],"insights":["The group’s publicly exposed staging directories and GitHub commit history gave researchers unusual visibility into its payload development, tool inventory, and changes to command-and-control infrastructure.","UAT-6275 progressed from document- and downloader-based delivery to exploiting CVE-2025-8088 in WinRAR, allowing PickleShell to be placed in a user’s Startup folder for execution at the next sign-in.","Recovered Linux-compatible tools and a public proof-of-concept for FortiWeb CVE-2025-25257 indicate that the group was preparing capabilities beyond the Windows-focused delivery chains described in the article.","The timing of observed activity involving Tajik and Belarusian government entities coincided with Kazakhstan-related diplomatic events, while decoy documents also referenced regional trade, aviation, and energy matters.","Organizations in the targeted sectors can look for unexpected PowerShell activity, downloads from GitHub, newly created scheduled tasks, and changes to Startup folders as indicators of the delivery methods described."],"referencedReports":[{"title":"Break the Silence: Tracking Silent Lynx Through Exposed Infrastructure","url":"https://www.virusbulletin.com/uploads/pdf/conference/vb2026/papers/Break-the-silence-tracking-Silent-Lynx-through-exposed-infrastructure.pdf","publisher":"Cisco Talos and Recorded Future Insikt Group","context":"The article summarizes this joint Virus Bulletin 2026 white paper and refers readers to it for full technical analysis and indicators of compromise.","category":"research","primary":true},{"title":"TAG-193: Regional Espionage Operations","url":"http://www.recordedfuture.com/blog/tag193-regional-espionage-operations","publisher":"Recorded Future","context":"The article identifies Recorded Future's TAG-193 tracking as corresponding to UAT-6275 and links to Recorded Future's related research post.","category":"research","primary":false},{"title":"Silent Lynx APT Targeting Central Asian Entities","url":"https://www.seqrite.com/blog/silent-lynx-apt-targeting-central-asian-entities/","publisher":"Seqrite","context":"The article states that Seqrite first reported Silent Lynx and notes overlap between that activity and UAT-6275.","category":"research","primary":false},{"title":"YoroTrooper Espionage Campaign Targets CIS, Turkey and Europe","url":"https://blog.talosintelligence.com/yorotrooper-espionage-campaign-cis-turkey-europe/","publisher":"Cisco Talos","context":"The article references Talos's earlier YoroTrooper research when describing a broader related set of campaigns.","category":"research","primary":false},{"title":"Tomiris Called, They Want Their Turla Malware Back","url":"https://securelist.com/tomiris-called-they-want-their-turla-malware-back/109552/","publisher":"Kaspersky","context":"The article cites Kaspersky's Tomiris research as identifying indicators overlapping with related reported clusters.","category":"research","primary":false},{"title":"ShadowSilk","url":"https://www.group-ib.com/blog/shadowsilk/","publisher":"Group-IB","context":"The article cites Group-IB's ShadowSilk research among reports that identified overlapping indicators across related clusters.","category":"research","primary":false},{"title":"Cavalry Werewolf Raids Russia’s Public Sector With Trusted Relationship Attacks","url":"https://bi-zone.medium.com/cavalry-werewolf-raids-russias-public-sector-with-trusted-relationship-attacks-e19f7a5c83ef","publisher":"BI.ZONE","context":"The article cites BI.ZONE's Cavalry Werewolf research as reporting indicator overlap with related activity clusters.","category":"research","primary":false},{"title":"Hydra Saiga: Covert Espionage and Infiltration of Critical Utilities","url":"https://www.vmray.com/hydra-saiga-covert-espionage-and-infiltration-of-critical-utilities/","publisher":"VMRay","context":"The article cites VMRay's Hydra Saiga research for prior reporting on Silent Lynx targeting water-resource organizations in Central Asia.","category":"research","primary":false}],"body":"\u003cp\u003eCisco Talos and Recorded Future investigated UAT-6275, also tracked as TAG-193 and overlapping with reported Silent Lynx activity, targeting government organizations across Central Asia and the wider Commonwealth of Independent States. The group’s observed victims and lure themes spanned Kazakhstan, Kyrgyzstan, Tajikistan, Turkmenistan, Uzbekistan, Armenia, Azerbaijan, Russia, and Belarus. Targeted organizations included entities responsible for diplomacy, economic development, agriculture, environmental management, water resources, forestry, and energy. Talos assessed with medium confidence that the activity has a Kazakhstan nexus.\u003c/p\u003e\n\n\u003cp\u003eResearchers found three publicly accessible staging directories and a previously unreported GitHub repository used to host malicious scripts and payloads. These exposed resources revealed payload builds, tool inventories, command-and-control infrastructure changes, and indications of preparation for post-compromise operations, including Linux-compatible tools and a proof-of-concept for FortiWeb CVE-2025-25257. From June 2025 through April 2026, the group used four delivery chains involving macro-enabled Word documents, PS2EXE-packaged PowerShell downloaders, malicious shortcuts that fetch GitHub-hosted scripts, and a crafted WinRAR archive exploiting CVE-2025-8088. Recovered payloads included the Chvost, Laplas, and PickleShell reverse shells, while some samples created scheduled tasks or placed PickleShell in the Windows Startup folder for persistence.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s decoys and timing suggest an intelligence focus on regional diplomatic developments, environmental management, and energy resources. Talos observed activity involving a Tajik government entity after treaty discussions with Kazakhstan and a Belarusian entity before a bilateral meeting, while lures referenced international trade, aviation, forestry, and oil cooperation. The article advises affected sectors to monitor unexpected PowerShell activity, GitHub downloads, scheduled-task creation, and Startup-folder changes, and to keep archive utilities patched. Cisco lists ClamAV signatures and Snort rules for detection, with indicators of compromise published in its GitHub repository.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft: Recent Windows updates may trigger Remote Desktop failures","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-recent-windows-updates-may-trigger-remote-desktop-failures/","time":"10:48","priority":"SHOULD READ","score":78,"tldr":"Microsoft says recent Windows 11 updates can cause Remote Desktop connections to fail with error 0xC000000D on enterprise-managed hosts when Administrator protection is enabled. Until a fix is released, IT administrators should disable Administrator protection through policy management.","briefOverview":"\u003cp\u003eMicrosoft has confirmed that recent Windows updates can prevent non-admin users from connecting to devices through Remote Desktop when the Administrator protection security feature is enabled. Connections may fail with error 0xC000000D and state that the token passed to the function is invalid. The issue primarily affects enterprise-managed remote devices used as Remote Desktop hosts.\u003c/p\u003e\n\n\u003cp\u003eThe problem affects Windows 11 versions 24H2, 25H2, 26H1, and 26H2 after the KB5124010 September 2026 preview update or later updates. Administrator protection is enabled by default for organizations using applicable Windows security baselines, unless they have changed the policy. Microsoft is working on a fix and advises IT administrators to temporarily disable Administrator protection through policy management, such as by resetting the \u0026ldquo;User Account Control Type Of Admin Approval Mode\u0026rdquo; policy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says non-admin users may be unable to connect through Remote Desktop after recent Windows updates when Administrator protection is enabled.","Remote Desktop connections can fail with error 0xC000000D and the message \"The token that was passed to the function is invalid.\"","The issue primarily affects enterprise-managed remote devices used as Remote Desktop hosts on Windows 11 24H2, 25H2, 26H1, and 26H2.","Microsoft says Administrator protection is enabled by default in Windows 11 security baselines for versions 24H2, 25H2, and 26H2 unless an organization changed the policy.","Microsoft's temporary workaround is for IT administrators to disable Administrator protection through their policy-management method, such as by resetting the User Account Control Type Of Admin Approval Mode policy."],"insights":["Organizations using Microsoft’s Windows security baselines may encounter the problem without separately choosing to enable Administrator protection, because the feature is enabled by default in the listed Windows 11 baselines unless policy settings were changed.","The issue is not limited to one way of configuring Administrator protection; Microsoft says it affects Remote Desktop hosts regardless of how the feature was enabled.","Microsoft’s currently available mitigation requires disabling a security feature through policy, creating a temporary operational tradeoff while it works on a permanent fix.","This is the latest in several recent Windows update-related Remote Desktop and Remote Desktop Services problems, including issues Microsoft fixed in March 2025 and emergency Windows Server updates released the previous month."],"referencedReports":[{"title":"Windows 11, version 25H2 known issues and notifications","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-25h2#5031msgdesc","publisher":"microsoft","context":"Microsoft’s Windows release-health notice confirms that Remote Desktop connections can fail with error 0xC000000D when Administrator protection is enabled.","category":"advisory","primary":true},{"title":"Windows Message Center","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#5038","publisher":"microsoft","context":"Microsoft’s Message Center notice is cited to support that Administrator protection is enabled by default in applicable Windows security baselines.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft has confirmed that recent Windows updates can prevent non-admin users from connecting to devices through Remote Desktop when the Administrator protection security feature is enabled. Connections may fail with error 0xC000000D and state that the token passed to the function is invalid. The issue primarily affects enterprise-managed remote devices used as Remote Desktop hosts.\u003c/p\u003e\n\n\u003cp\u003eThe problem affects Windows 11 versions 24H2, 25H2, 26H1, and 26H2 after the KB5124010 September 2026 preview update or later updates. Administrator protection is enabled by default for organizations using applicable Windows security baselines, unless they have changed the policy. Microsoft is working on a fix and advises IT administrators to temporarily disable Administrator protection through policy management, such as by resetting the \u0026ldquo;User Account Control Type Of Admin Approval Mode\u0026rdquo; policy.\u003c/p\u003e\n"},{"n":5,"title":"Congressional probe faults Match Group for failing to rein in dating app scams","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/co
