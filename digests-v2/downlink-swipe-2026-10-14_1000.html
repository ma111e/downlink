ngressional-probe-faults-match-group-for-failing-to-stop-dating-app-scams","time":"12:32","priority":"SHOULD READ","score":78,"tldr":"A U.S. congressional investigation found that Match Group failed to adequately prevent scammers from reaching users on Tinder and Hinge, with roughly 1.5 million bad actors matching with legitimate users in the first nine months of 2025. The report says outdated fraud-detection models and platform incentives amplified scammer visibility, while Match Group disputes aspects of the findings and cites newer biometric verification measures.","briefOverview":"\u003cp\u003eA U.S. Joint Economic Committee investigation found that nearly 1.5 million scammers and other bad actors on Tinder and Hinge matched with legitimate users during the first nine months of 2025. The report faulted Match Group’s efforts to combat fraud across platforms including Tinder, Hinge, Match, and Plenty of Fish. It said romance scams took $1.5 billion from Americans last year, according to Federal Trade Commission data, and described substantial financial and emotional harm to victims. Match Group said the report mischaracterized its safety investments and anti-scam work.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found that the median Tinder scammer’s profile views rose by more than 700% between May 2024 and December 2025, and said Tinder was more likely to show scammer or bad-actor profiles than regular-user profiles. The report also said Tinder had not updated certain machine-learning models used to detect scammers in years, although a Match Group official disputed that claim. After committee pressure, Match Group introduced a newer profile-review model in early 2026 and said its Face Check video-selfie verification, rolled out for new Tinder users in October 2025, reduced U.S. interactions with scam accounts by 70% in pilots. The Senate also unanimously passed legislation last month that would require dating apps to notify users who interacted with scammers, including when the accounts have already been banned.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A U.S. Joint Economic Committee investigation found that nearly 1.5 million scammers and other bad actors on Tinder and Hinge matched with legitimate users during the first nine months of 2025.","The report said the median Tinder scammer's profile views increased by more than 700% from May 2024 to December 2025 and alleged that Tinder was more likely to show scammer or bad-actor profiles than regular-user profiles.","Investigators said internal Match Group documents showed that Tinder had not updated certain machine-learning models used to identify scammers for years, although a company official disputed that characterization.","Match Group said its Face Check video-selfie verification tool, rolled out across new Tinder accounts in October 2025, reduced U.S. user interactions with scam accounts by 70% in pilots.","The Senate unanimously passed bipartisan legislation last month that would require dating apps to notify people who interacted with a scammer, even after the scam account has been banned."],"insights":["The investigation found that scammers were not merely present on Tinder: their visibility grew sharply, with the median scammer receiving more than 700% more profile views between May 2024 and December 2025.","Match Group’s reported Face Check pilot results suggest that requiring a video selfie from new users can substantially reduce encounters with scam accounts, reducing such interactions by 70% in U.S. pilots.","The report highlights that fraud-detection models can quickly become ineffective if not refreshed, citing an AI safety researcher who said such models should be retrained at least monthly depending on monitoring systems.","The pending notification requirement would address a gap in which people may not learn they interacted with a scammer after that account has already been removed from a dating app."],"referencedReports":[{"title":"Outmatched: Tinder Scammers and Match Group’s Efforts to Catch Up","url":"https://www.jec.senate.gov/public/_cache/files/28a087ac-734e-4e4b-af8b-c9bc58cf82a4/outmatched---tinder-scammers-and-match-group-s-efforts-to-catch-up.pdf","publisher":"joint-economic-committee","context":"The article is based on the Joint Economic Committee’s year-long investigation into Match Group dating platforms and its findings on scam prevention.","category":"research","primary":true}],"body":"\u003cp\u003eA U.S. Joint Economic Committee investigation found that nearly 1.5 million scammers and other bad actors on Tinder and Hinge matched with legitimate users during the first nine months of 2025. The report faulted Match Group’s efforts to combat fraud across platforms including Tinder, Hinge, Match, and Plenty of Fish. It said romance scams took $1.5 billion from Americans last year, according to Federal Trade Commission data, and described substantial financial and emotional harm to victims. Match Group said the report mischaracterized its safety investments and anti-scam work.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found that the median Tinder scammer’s profile views rose by more than 700% between May 2024 and December 2025, and said Tinder was more likely to show scammer or bad-actor profiles than regular-user profiles. The report also said Tinder had not updated certain machine-learning models used to detect scammers in years, although a Match Group official disputed that claim. After committee pressure, Match Group introduced a newer profile-review model in early 2026 and said its Face Check video-selfie verification, rolled out for new Tinder users in October 2025, reduced U.S. interactions with scam accounts by 70% in pilots. The Senate also unanimously passed legislation last month that would require dating apps to notify users who interacted with scammers, including when the accounts have already been banned.\u003c/p\u003e\n"},{"n":15,"title":"The Sign-In Link Pointed Home, and Home Was a Decoy","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/oauth-authorize-link-decoy-uri-parameter-no-redirect-uri","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email used a legitimate Microsoft OAuth authorization endpoint and a fake, readable URL pointing to the victim’s own nonexistent subdomain to make the link appear trustworthy. Defenders should assess and hunt the OAuth client ID and app registration rather than trust URL-shaped query parameters such as uri.","briefOverview":"\u003cp\u003eA senior finance leader at a UK medical-device and infection-prevention manufacturer received a Teams-styled email claiming a company document was ready. Its VIEW \u0026amp; COMPLETE button opened a genuine Microsoft authorization endpoint, while the readable URL embedded in the request pointed to a nonexistent subdomain of the victim’s own company. The message was designed to make the link appear like a plausible internal sign-in or verification path.\u003c/p\u003e\n\n\u003cp\u003eThe request used an unknown third-party OAuth client ID, \u003ccode\u003eprompt=none\u003c/code\u003e, and permissions for identity information and Microsoft Graph User.Read. Its \u003ccode\u003euri\u003c/code\u003e value was not a documented Microsoft authorization parameter, and the link omitted the documented required \u003ccode\u003eredirect_uri\u003c/code\u003e and \u003ccode\u003eresponse_type\u003c/code\u003e parameters, meaning the visible hostname did not establish the real reply destination. SPF, DKIM, DMARC, composite authentication, and URL reputation checks all passed, but IRONSCALES identified VIP impersonation at 85 confidence and quarantined the affected mailbox; the article states there was no evidence anyone clicked.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Teams-styled phishing email targeting a senior finance leader at a UK medical-device and infection-prevention manufacturer linked to the genuine Microsoft OAuth authorization endpoint.","The authorization link contained an unknown third-party OAuth client ID, prompt=none, identity and Microsoft Graph User.Read permissions, and a double-encoded uri parameter pointing to a nonexistent subdomain of the victim’s company.","The link omitted redirect_uri and response_type, which Microsoft documents as required parameters, while uri is not a documented Microsoft authorization parameter.","Microsoft filtering delivered the message despite passed SPF, DKIM, DMARC, and composite authentication checks and clean reputations for its Microsoft-hosted links.","IRONSCALES classified the email as VIP impersonation with 85 confidence and automatically quarantined the single affected mailbox, with no evidence that anyone clicked."],"insights":["A readable URL inside an OAuth sign-in link can be deliberate decoration: the article found that the only visible destination was carried in an undocumented uri parameter and did not determine where the authorization flow would send a response.","When redirect_uri is absent from an OAuth link, the actual reply location may exist only in the third-party app’s registration, so examining the OAuth client ID is more actionable than judging the visible hostname.","The phishing message passed SPF, DKIM, DMARC, composite authentication, and URL-reputation checks because it used legitimate Microsoft-hosted links and an established sending domain, showing why those checks alone did not identify it.","The use of prompt=none was designed to let the Microsoft authorization request proceed without displaying user interface, making an unsolicited OAuth link especially concerning.","The article states that an automated analysis treated the fake company subdomain as a plausible sign-in destination, demonstrating that the planted value was capable of misleading link analysis as well as recipients."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's statistics on the human element and credential involvement across breaches.","category":"research","primary":false},{"title":"CISA Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references this guidance as supporting identity-layer controls against phishing.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites the report in noting that identity attacks are a major pressure on enterprise tenants.","category":"research","primary":false}],"body":"\u003cp\u003eA senior finance leader at a UK medical-device and infection-prevention manufacturer received a Teams-styled email claiming a company document was ready. Its VIEW \u0026amp; COMPLETE button opened a genuine Microsoft authorization endpoint, while the readable URL embedded in the request pointed to a nonexistent subdomain of the victim’s own company. The message was designed to make the link appear like a plausible internal sign-in or verification path.\u003c/p\u003e\n\n\u003cp\u003eThe request used an unknown third-party OAuth client ID, \u003ccode\u003eprompt=none\u003c/code\u003e, and permissions for identity information and Microsoft Graph User.Read. Its \u003ccode\u003euri\u003c/code\u003e value was not a documented Microsoft authorization parameter, and the link omitted the documented required \u003ccode\u003eredirect_uri\u003c/code\u003e and \u003ccode\u003eresponse_type\u003c/code\u003e parameters, meaning the visible hostname did not establish the real reply destination. SPF, DKIM, DMARC, composite authentication, and URL reputation checks all passed, but IRONSCALES identified VIP impersonation at 85 confidence and quarantined the affected mailbox; the article states there was no evidence anyone clicked.\u003c/p\u003e\n"},{"n":8,"title":"Russian travel booking platform suspends reservations after cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-anywayanyday-travel-website-cyberattack","time":"13:05","priority":"MAY READ","score":68,"tldr":"Russian online travel agency Anywayanyday suspended new airline, train, and hotel bookings after a cyberattack disrupted its IT infrastructure, though it says existing reservations remain valid and there is no evidence of customer data compromise.","briefOverview":"\u003cp\u003eRussian online travel agency Anywayanyday temporarily suspended new reservations after a cyberattack disrupted its IT infrastructure. Its website remains unavailable, preventing customers from buying airline and train tickets or booking hotels through the platform. The company said previously confirmed reservations remain valid.\u003c/p\u003e\n\n\u003cp\u003eAnywayanyday said it has strengthened security measures and is working to restore service, but did not provide a timeline or identify the attackers. It also said it found no evidence that customers’ personal data was compromised. The incident affects one of Russia’s oldest online booking services, which had partnerships with about 800 airlines and 330,000 hotels as of 2025, and comes amid widespread flight disruptions around Moscow.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russian online travel agency Anywayanyday temporarily suspended new bookings after a cyberattack on its IT infrastructure.","Customers cannot currently purchase airline or train tickets or book hotels through Anywayanyday, while previously confirmed reservations remain valid.","Anywayanyday said its website is unavailable as it restores systems and that it has found no evidence that customers' personal data was compromised.","The company did not identify the attackers, explain how its systems were breached, or provide a timeline for restoring normal service.","The incident occurs amid broader travel disruptions in Russia, where more than 500 flights serving Moscow have been delayed or canceled since Tuesday evening."],"insights":["The disruption affects a large travel marketplace with partnerships spanning about 800 airlines and 330,000 hotels, which increases the potential reach of the booking outage.","Anywayanyday says confirmed reservations remain valid, indicating that the service interruption is currently focused on making new bookings rather than canceling existing ones.","The company has not provided a recovery timeline or disclosed how the intrusion occurred, leaving customers without clarity on when booking services will return.","The outage coincides with widespread flight delays and cancellations around Moscow, compounding travel difficulties for people seeking to make or change travel arrangements."],"referencedReports":[],"body":"\u003cp\u003eRussian online travel agency Anywayanyday temporarily suspended new reservations after a cyberattack disrupted its IT infrastructure. Its website remains unavailable, preventing customers from buying airline and train tickets or booking hotels through the platform. The company said previously confirmed reservations remain valid.\u003c/p\u003e\n\n\u003cp\u003eAnywayanyday said it has strengthened security measures and is working to restore service, but did not provide a timeline or identify the attackers. It also said it found no evidence that customers’ personal data was compromised. The incident affects one of Russia’s oldest online booking services, which had partnerships with about 800 airlines and 330,000 hotels as of 2025, and comes amid widespread flight disruptions around Moscow.\u003c/p\u003e\n"},{"n":10,"title":"An AI Agent Found a Critical OTP Bypass in Production. The Attack Was the Easy Part.","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/an-ai-agent-found-critical-otp-bypass.html","time":"11:00","priority":"MAY READ","score":65,"tldr":"In an authorized assessment, Reflectiz says its AI pentesting agent discovered that a major insurer’s login API could send one-time passcodes to an attacker-controlled email address, enabling account takeover with customer identifiers. The sponsored case study argues that continuous, context-aware agentic testing can uncover authentication flaws missed by periodic pentests.","briefOverview":"\u003cp\u003eDuring an authorized assessment of a major insurer’s production website, Reflectiz says its AI pentesting agent found and confirmed a critical authentication bypass. The agent requested a login code, directed it to an inbox it controlled, used the code to log in, and then stopped because of its guardrails. Reflectiz reported the finding to the insurer.\u003c/p\u003e\n\n\u003cp\u003eThe issue was that the login request included fields controlling the one-time passcode delivery channel and destination address. By changing the channel to email and supplying an address, the server allegedly sent the code there without checking whether the address belonged to the targeted account. The article says an attacker with the required customer identifiers could potentially use this weakness to access a customer account, and argues that repeated agentic testing can help evaluate changing website workflows more frequently than point-in-time pentests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["During an authorized assessment of a major insurer’s production website, Reflectiz says its AI pentesting agent independently identified and confirmed a critical authentication bypass.","The login request allowed the delivery channel and destination for a one-time passcode to be changed, and the server sent an email code to the supplied address without verifying that it belonged to the account.","The agent analyzed the site’s JavaScript and API calls, then tested the suspected delivery-field manipulation through the live login flow and reached an authenticated state before its guardrails stopped the test.","Reflectiz says its agentic pentesting combines open-ended investigation with structured endpoint and attack-category testing, while a separate validator agent reproduces suspected findings before reporting them.","The article argues that recurring agentic testing can assess changing web applications more frequently than point-in-time pentests when the system has appropriate access and defined boundaries."],"insights":["A one-time sign-in code is not meaningful proof of account ownership if the server lets a login request choose an unverified destination for that code.","The article highlights that finding suspicious fields in website requests is not enough to establish a security issue; the suspected weakness had to be confirmed through the complete live login process.","The agent stopped after reaching an authenticated state, illustrating that testing controls can limit activity even when a serious flaw has been successfully validated.","The insurer had reportedly tested the site about six months earlier, showing the article’s point that a previous security review does not necessarily reflect the security of a changing website."],"referencedReports":[],"body":"\u003cp\u003eDuring an authorized assessment of a major insurer’s production website, Reflectiz says its AI pentesting agent found and confirmed a critical authentication bypass. The agent requested a login code, directed it to an inbox it controlled, used the code to log in, and then stopped because of its guardrails. Reflectiz reported the finding to the insurer.\u003c/p\u003e\n\n\u003cp\u003eThe issue was that the login request included fields controlling the one-time passcode delivery channel and destination address. By changing the channel to email and supplying an address, the server allegedly sent the code there without checking whether the address belonged to the targeted account. The article says an attacker with the required customer identifiers could potentially use this weakness to access a customer account, and argues that repeated agentic testing can help evaluate changing website workflows more frequently than point-in-time pentests.\u003c/p\u003e\n"},{"n":16,"title":"Package managers have an integrity problem","source":"blog.trailofbits.com","sourceColorIdx":6,"link":"https://blog.trailofbits.com/2026/10/14/package-managers-have-an-integrity-problem/","time":"11:00","priority":"MAY READ","score":60,"tldr":"Testing of 25 popular package managers found that fewer than half verify lockfile integrity by default, and only Go verifies every downloaded package and signatures by default against a compromised repository. The article argues that stronger default verification using signed packages, identity-based signing, and transparency logs is needed to prevent repository-side supply-chain tampering.","briefOverview":"\u003cp\u003eTrail of Bits tested 25 popular source-code package managers against a simulated compromised package repository that inserted malicious code into legitimate packages. Fewer than half used lockfiles that detected tampering by default, and only Go and vcpkg verified the integrity of every downloaded package in the tested configurations. The testing harness used Docker containers and mitmproxy to alter repository responses while leaving backend resources, such as signing keys, outside the simulated compromise.\u003c/p\u003e\n\n\u003cp\u003eThe article finds that hashes in lockfiles are not always enforced: Pub, for example, warns of a mismatch but installs the package and updates the lockfile unless the non-default \u003ccode\u003e--enforce-lockfile\u003c/code\u003e option is used. Package signatures are also often unused during ordinary installs, with npm requiring a separate audit command and NuGet requiring configuration to reject invalidly signed packages. Go provided the strongest default protection in the tests by checking package contents against its signed checksum database, while the article argues that identity-based signing and transparency logs could improve protection against repository-side tampering.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Docker and mitmproxy-based test harness evaluated 25 package managers by simulating a compromised package repository that injects malicious code into otherwise legitimate packages.","Fewer than half of the tested package managers used lockfiles that detect tampering by default, and only Go and vcpkg verified integrity for every downloaded package in the tested configurations.","Several package managers contain hashes in lockfiles but do not reliably enforce them by default; for example, Pub warns about a hash mismatch and updates the lockfile unless the non-default --enforce-lockfile option is used.","Package signatures are available in several ecosystems, but many package managers do not verify them during standard installation or require users to configure trusted signing keys and verification settings.","Go was the only tested package manager that verified signatures by default, using its checksum database and a public key hardcoded in Go’s source code to validate downloaded package contents."],"insights":["A lockfile containing a cryptographic hash does not necessarily protect users: Pub, for example, detects a mismatch but installs the package and replaces the recorded hash unless the non-default --enforce-lockfile option is used.","Repository-provided signatures alone do not protect against a fully compromised repository, because the attacker could use the repository’s legitimate signing capability to sign malicious packages.","Some package managers offer signing ecosystems but do not check signatures during normal installation; npm requires a separate npm audit signatures command, while NuGet defaults to accepting invalid signatures.","Lockfiles can improve integrity but also delay security updates, because a newer dependency release has a different hash and requires the lockfile to be updated before users receive it.","The article proposes recording a developer identity or signing key in lockfiles rather than only a fixed package hash, allowing integrity checks even when a project permits dependency updates."],"referencedReports":[{"title":"Gamage et al. lockfile design study","url":"https://arxiv.org/abs/2505.04834v3","publisher":"Gamage et al.","context":"The article references this recent study for its analysis of lockfile design decisions across seven package managers, published-project analysis, and interviews with 15 developers.","category":"research","primary":false}],"body":"\u003cp\u003eTrail of Bits tested 25 popular source-code package managers against a simulated compromised package repository that inserted malicious code into legitimate packages. Fewer than half used lockfiles that detected tampering by default, and only Go and vcpkg verified the integrity of every downloaded package in the tested configurations. The testing harness used Docker containers and mitmproxy to alter repository responses while leaving backend resources, such as signing keys, outside the simulated compromise.\u003c/p\u003e\n\n\u003cp\u003eThe article finds that hashes in lockfiles are not always enforced: Pub, for example, warns of a mismatch but installs the package and updates the lockfile unless the non-default \u003ccode\u003e--enforce-lockfile\u003c/code\u003e option is used. Package signatures are also often unused during ordinary installs, with npm requiring a separate audit command and NuGet requiring configuration to reject invalidly signed packages. Go provided the strongest default protection in the tests by checking package contents against its signed checksum database, while the article argues that identity-based signing and transparency logs could improve protection against repository-side tampering.\u003c/p\u003e\n"},{"n":20,"title":"5 Key Takeaways From Censys’ State of the Internet Report","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/state-of-the-internet-report-2026/","time":"13:00","priority":"MAY READ","score":58,"tldr":"Censys’ 2026 report finds that major Internet security risks often hide in overlooked assets, including exposed AI automation platforms, mobile-connected industrial systems, unpatched legacy software, and services running on nonstandard ports. Effective asset visibility across all networks and ports is critical because attackers can easily find exposures that organizations may not know they own.","briefOverview":"\u003cp\u003eCensys’ 2026 State of the Internet Report examines AI exposures, industrial control system exposures, software update behavior, threat infrastructure, and broader Internet visibility. It concludes that many meaningful risks exist in overlooked or poorly tracked Internet-connected systems rather than in especially complex threats. The report says organizations can reduce gaps by improving visibility into exposed assets.\u003c/p\u003e\n\n\u003cp\u003eThe report found that hosts exposing AI-related tools grew more than 63% between October 2025 and July 2026, and identified 113,926 exposed n8n hosts. It also found that about 70% of global hosts running industrial control system devices and services are consistently on consumer and mobile networks, which can hide ownership and make remediation difficult. Older software versions remained at small but stable exposure levels over 2.5 years, while many services operated on non-standard ports, including 68% of HTTP(S) services and 34% of SSH services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Between October 2025 and July 2026, Internet-exposed hosts running AI-related tools grew by more than 63%, with n8n accounting for 113,926 exposed hosts.","Censys found that roughly 70% of hosts running industrial control system devices and services globally are consistently located on consumer and mobile networks, which can obscure ownership and complicate remediation.","The oldest exposed software versions changed very little over a 2.5-year period, persisting at small but stable levels despite broader software populations gradually updating.","The United States hosts 45.5% of observed web-based threats, while the report says threat actors select hosting providers mainly for cost and permissiveness rather than country.","Many Internet services run on non-standard ports, including 96% of SOCKS proxies, 68% of HTTP(S) services, and 34% of SSH services."],"insights":["The highest-impact AI risks may be in behind-the-scenes workflow and agent-management platforms rather than user-facing AI applications, because these platforms can hold credentials and connect to external services.","Organizations that search only their corporate address ranges can miss their own industrial systems when those systems use mobile networks, even though attackers can still discover them easily.","Stable populations of very old software versions may represent forgotten or unmonitored systems that are unlikely to be upgraded, despite healthier update behavior across most exposed software.","Geographic concentration of malicious web infrastructure does not reliably indicate where its operators are located, since providers are chosen chiefly for low cost and permissive conditions.","Checking only default service ports leaves a substantial visibility gap because many common Internet services, including HTTP(S) and SSH, are deployed on non-standard ports."],"referencedReports":[],"body":"\u003cp\u003eCensys’ 2026 State of the Internet Report examines AI exposures, industrial control system exposures, software update behavior, threat infrastructure, and broader Internet visibility. It concludes that many meaningful risks exist in overlooked or poorly tracked Internet-connected systems rather than in especially complex threats. The report says organizations can reduce gaps by improving visibility into exposed assets.\u003c/p\u003e\n\n\u003cp\u003eThe report found that hosts exposing AI-related tools grew more than 63% between October 2025 and July 2026, and identified 113,926 exposed n8n hosts. It also found that about 70% of global hosts running industrial control system devices and services are consistently on consumer and mobile networks, which can hide ownership and make remediation difficult. Older software versions remained at small but stable exposure levels over 2.5 years, while many services operated on non-standard ports, including 68% of HTTP(S) services and 34% of SSH services.\u003c/p\u003e\n"},{"n":13,"title":"How to Run a Deepfake Readiness Drill Before a Cloned Voice Calls Your Team","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/how-to-run-deepfake-readiness-drill.html","time":"11:50","priority":"MAY READ","score":52,"tldr":"Organizations should run regular, controlled deepfake-readiness drills to test whether staff follow out-of-band verification procedures for urgent payment, MFA reset, and privileged-access requests. Because cloned voices and video can be convincing, reliable callback rules, dual approval, and blameless reporting matter more than detecting a fake by ear or sight.","briefOverview":"\u003cp\u003eCloned voices and synthetic video calls are being used in payment fraud, help-desk MFA resets, and requests for privileged access. The article cites a 2025 Gartner survey in which 62% of 302 cybersecurity leaders said their organizations had experienced a deepfake attack in the previous year, including audio-call and video-call incidents. It argues that organizations should rely on consistent verification processes rather than asking employees to identify a fake by voice or appearance.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends deepfake-readiness drills that identify likely impersonated leaders and likely targets, establish callback and approval rules, and use multi-channel scenarios involving email, chat, voice, or video. Simulations should be controlled so no real payments, account changes, or access grants can occur, followed by prompt, blameless debriefs that identify process failures. It advises measuring verification and escalation behavior, repeating drills at least twice yearly, and ensuring employees have explicit permission from leadership to pause, hang up, and independently call back before acting on urgent requests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloned voices and synthetic video calls can be used to request fraudulent payments, help desk MFA resets, or privileged account changes.","The article recommends verifying payment, banking, credential, MFA, and access-change requests through an independently sourced phone number rather than a number supplied in the request.","A deepfake readiness drill should use controlled scenarios and ensure that no real money can move and no real access can be granted.","Organizations should measure whether participants followed verification procedures, how quickly they escalated concerns, and where the process broke down.","The article recommends conducting drills at least twice a year and updating them when high-exposure personnel or organizational circumstances change."],"insights":["Deepfake drills should test multi-channel deception, because an email or chat message can establish credibility before a cloned voice or video call applies pressure.","Access-review scenarios can conceal a harmful request among legitimate cleanup tasks, making it important to assess whether staff examine each requested change instead of approving an entire batch.","The article notes that a few minutes of audio from a webinar may be enough to clone a person, so exposure assessments should include directors and other leaders with public recordings, not only top executives.","A participant’s reason for trusting a request can identify the right fix: confidence based on a realistic voice differs from confidence created by a preceding email.","Explicit written support from senior leaders for employees to pause and call back is important because deepfake fraud relies on urgency and perceived authority."],"referencedReports":[{"title":"Why CIOs Cannot Ignore the Rising Tide of Deepfake Attacks","url":"https://www.gartner.com/en/newsroom/press-releases/2025-09-02-why-cios-cannot-ignore-the-rising-tide-of-deepfake-attacks","publisher":"gartner","context":"The article cites Gartner's 2025 survey of 302 cybersecurity leaders on organizational experience with deepfake attacks, audio calls, and video calls.","category":"research","primary":false},{"title":"Public Service Announcement 250515: Malicious Campaign Impersonating Senior U.S. Officials","url":"https://www.ic3.gov/PSA/2025/PSA250515","publisher":"fbi-internet-crime-complaint-center","context":"The article cites the FBI warning that AI-generated voices can closely resemble real people and recommends confirming identity through independently sourced phone numbers.","category":"advisory","primary":false},{"title":"FinCEN Issues Alert on Fraud Schemes Involving Deepfake Media Targeting Financial Institutions","url":"https://fincen.gov/news/news-releases/fincen-issues-alert-fraud-schemes-involving-deepfake-media-targeting-financial","publisher":"fincen","context":"The article references FinCEN's alert on criminals using generative AI to impersonate executives and direct employees to transfer funds.","category":"advisory","primary":false}],"body":"\u003cp\u003eCloned voices and synthetic video calls are being used in payment fraud, help-desk MFA resets, and requests for privileged access. The article cites a 2025 Gartner survey in which 62% of 302 cybersecurity leaders said their organizations had experienced a deepfake attack in the previous year, including audio-call and video-call incidents. It argues that organizations should rely on consistent verification processes rather than asking employees to identify a fake by voice or appearance.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends deepfake-readiness drills that identify likely impersonated leaders and likely targets, establish callback and approval rules, and use multi-channel scenarios involving email, chat, voice, or video. Simulations should be controlled so no real payments, account changes, or access grants can occur, followed by prompt, blameless debriefs that identify process failures. It advises measuring verification and escalation behavior, repeating drills at least twice yearly, and ensuring employees have explicit permission from leadership to pause, hang up, and independently call back before acting on urgent requests.\u003c/p\u003e\n"},{"n":17,"title":"The Week in Vulnerabilities: Toptech, Lantronix, Langflow, and CISA Malcolm Flaws","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/weekly-vulnerability-report-langflow-n8n-ics-flaws/","time":"13:36","priority":"MAY READ","score":40,"tldr":"Cyble observed active exploitation of newly disclosed web and AI-platform flaws alongside persistent targeting of old IoT and embedded-networking bugs, while CISA issued 14 ICS advisories covering 54 vulnerabilities, including critical issues in fuel-management, router, camera, and charging-platform products. Organizations should urgently patch exposed systems, replace default credentials, restrict remote-access services, and isolate unpatched OT assets.","briefOverview":"\u003cp\u003eCyble’s global sensors observed exploitation attempts against about 20 known vulnerabilities, spanning newly disclosed issues in WordPress, Apache Solr, Langflow, n8n, and Gravity SMTP as well as older flaws in routers and embedded networking stacks. The most-attempted issue was CVE-2020-11899 in the Treck TCP/IP stack, followed by VxWorks TCP buffer overflows, other Treck flaws, and the BlueKeep Microsoft Remote Desktop vulnerability. Cyble also recorded malware activity involving CoinMiner, WannaCry, Mirai, IRCBot, Hajime, Gafgyt, and Wacatac, alongside phishing and brute-force attempts against exposed remote-access and database services.\u003c/p\u003e\n\n\u003cp\u003eCISA issued 14 industrial control system advisories covering 54 vulnerabilities, with 13 rated critical, affecting vendors including Toptech Systems, Lantronix, MikroTik, VIVOTEK, Monta, Anjvision, Armatura, and CISA itself. Toptech’s TMS7 and TopHAT fuel and chemical distribution products contained critical SQL injection, unrestricted file upload, and file-exposure issues, while other critical flaws affected MikroTik RouterOS, VIVOTEK cameras, Monta, and several camera and dashcam products. Several affected products had no vendor fix referenced, and the article emphasizes patching exposed systems, replacing default credentials, restricting remote services, segmenting IT and operational networks, and isolating unpatched industrial devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyble’s global sensors observed exploitation attempts against about 20 known vulnerabilities, including recently disclosed flaws in WordPress, Apache Solr, Langflow, and n8n as well as older embedded-device and router flaws.","CISA issued 14 industrial control system advisories covering 54 vulnerabilities, including 13 rated critical, across vendors such as Toptech Systems, Lantronix, VIVOTEK, MikroTik, Monta, Anjvision, Armatura, and CISA’s Malcolm platform.","Toptech Systems TMS7 and TopHAT contained multiple critical issues, including SQL injection, unrestricted file upload, and exposure of files to external parties; these products support liquid fuel and chemical distribution.","Cyble recorded a Mirai variant chaining CVE-2018-10561 and CVE-2018-10562 against Dasan GPON home routers, allowing unauthenticated remote command execution when the flaws are combined.","Cyble also observed phishing, brute-force activity against remote-access and database services, and malware families including CoinMiner, WannaCry, Mirai, IRCBot, Hajime, Gafgyt, and Wacatac."],"insights":["The most frequently targeted flaw was CVE-2020-11899 in the Treck TCP/IP stack, showing that attackers continued to focus heavily on aging networking code embedded in IoT and industrial devices that often remain unpatched for years.","CISA disclosed 15 vulnerabilities in Malcolm, its own open-source network traffic analysis and threat-hunting platform, including authentication bypass, command injection, path traversal, and server-side request forgery issues.","Several affected ICS products, including Monta, Anjvision, Viidure, and Armatura One, had no vendor fixes referenced, making network isolation and other compensating controls the primary available defense.","The reported ICS issues span multiple infrastructure sectors at once: vulnerabilities affecting Energy, Information Technology, and Water and Wastewater accounted for 27.8% of the 54 vulnerabilities analyzed, illustrating that shared products can create cross-sector risk.","Lantronix G520 gateway flaws could form a multistage path in which weak firmware-signature verification enables unauthorized firmware installation and an XSS issue supports further compromise of remote field devices."],"referencedReports":[{"title":"MacSync: New Version","url":"https://securelist.com/macsync-new-version/121383/","publisher":"Kaspersky Securelist","context":"The article cites Kaspersky Securelist's report on a new MacSync macOS infostealer campaign targeting cryptocurrency users and developers.","category":"research","primary":false}],"body":"\u003cp\u003eCyble’s global sensors observed exploitation attempts against about 20 known vulnerabilities, spanning newly disclosed issues in WordPress, Apache Solr, Langflow, n8n, and Gravity SMTP as well as older flaws in routers and embedded networking stacks. The most-attempted issue was CVE-2020-11899 in the Treck TCP/IP stack, followed by VxWorks TCP buffer overflows, other Treck flaws, and the BlueKeep Microsoft Remote Desktop vulnerability. Cyble also recorded malware activity involving CoinMiner, WannaCry, Mirai, IRCBot, Hajime, Gafgyt, and Wacatac, alongside phishing and brute-force attempts against exposed remote-access and database services.\u003c/p\u003e\n\n\u003cp\u003eCISA issued 14 industrial control system advisories covering 54 vulnerabilities, with 13 rated critical, affecting vendors including Toptech Systems, Lantronix, MikroTik, VIVOTEK, Monta, Anjvision, Armatura, and CISA itself. Toptech’s TMS7 and TopHAT fuel and chemical distribution products contained critical SQL injection, unrestricted file upload, and file-exposure issues, while other critical flaws affected MikroTik RouterOS, VIVOTEK cameras, Monta, and several camera and dashcam products. Several affected products had no vendor fix referenced, and the article emphasizes patching exposed systems, replacing default credentials, restricting remote services, segmenting IT and operational networks, and isolating unpatched industrial devices.\u003c/p\u003e\n"}]</script>
