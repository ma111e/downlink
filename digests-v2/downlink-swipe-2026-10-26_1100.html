<script type="application/json" id="dl-articles">[{"n":1,"title":"Borrowed Reputation: Domain Shadowing and Gambling SEO","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/borrowed-reputation-domain-shadowing-and-gambling-seo/","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"Infoblox uncovered two domain-shadowing operations that abused unauthorized DNS records and subdomain delegations under legitimate school and government domains to host illegal gambling SEO pages. Organizations should monitor DNS changes, especially unexpected CNAMEs, NS delegations, and wildcard records, and secure all DNS-management accounts with MFA and auditing.","briefOverview":"\u003cp\u003eInfoblox identified two unrelated domain-shadowing operations that used unauthorized DNS changes beneath legitimate school and government domains to promote illegal gambling content. The primary institutional websites remained available, potentially allowing the unauthorized hostnames to go unnoticed by organizations focused on their main sites or application logs. The affected institutions were in Bangladesh, India, and Mexico, and the activity used the reputation of their domains to support search visibility and traffic acquisition.\u003c/p\u003e\n\n\u003cp\u003eOne actor, Hidden Hawk, added individual CNAME records that directed institutional hostnames to gambling pages, mostly hosted on Cloudflare Pages, and was associated with more than 850 observed entry points across eight institutional domains. A separate operation delegated subzones under \u003ccode\u003emaharashtra.gov.in\u003c/code\u003e and \u003ccode\u003eonline.esic.gov.in\u003c/code\u003e to third-party nameservers, allowing the actor to manage records below those subzones; a wildcard under \u003ccode\u003egam.maharashtra.gov.in\u003c/code\u003e enabled arbitrary names to resolve. Infoblox recommends that DNS operators validate new NS delegations, investigate unexpected subdomains, CNAMEs, and wildcard records, and secure DNS-management accounts with MFA, credential rotation, and access-log reviews.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox identified two unrelated domain-shadowing operations that placed illegal gambling content beneath legitimate school and government domains.","Hidden Hawk added individual CNAME records beneath institutional domains, generally pointing the affected hostnames to gambling pages hosted on Cloudflare Pages.","A separate operation delegated subzones under maharashtra.gov.in and online.esic.gov.in to ClouDNS nameservers, enabling the operator to manage records beneath those subzones and use a wildcard under gam.maharashtra.gov.in.","The primary institutional websites remained available, meaning unauthorized subdomains could evade detection by organizations focused only on their main websites or application logs.","The article recommends that DNS operators validate new NS delegations, investigate unexpected subdomains and CNAMEs, review wildcard records, and secure DNS-management accounts with MFA and access-log reviews."],"insights":["The abuse did not require replacing or defacing an institution’s main website, so normal website availability and application logs may not reveal that unauthorized gambling pages exist under the same domain.","Delegating a subzone to external nameservers gives an actor ongoing control of records below that subzone without needing to alter the victim’s DNS environment for every new hostname; a wildcard can then make arbitrary names resolve.","Hidden Hawk’s Cloudflare Pages hostnames often replicated the compromised institutional hostname with dots replaced by hyphens, providing a way to reconstruct relationships between victim-side DNS names and externally hosted content.","The article cautions against blocking affected school and government domains at the second-level domain because the institutions themselves are legitimate; remediation should target unauthorized hostnames, actor infrastructure, and the access that enabled the DNS changes."],"referencedReports":[],"body":"\u003cp\u003eInfoblox identified two unrelated domain-shadowing operations that used unauthorized DNS changes beneath legitimate school and government domains to promote illegal gambling content. The primary institutional websites remained available, potentially allowing the unauthorized hostnames to go unnoticed by organizations focused on their main sites or application logs. The affected institutions were in Bangladesh, India, and Mexico, and the activity used the reputation of their domains to support search visibility and traffic acquisition.\u003c/p\u003e\n\n\u003cp\u003eOne actor, Hidden Hawk, added individual CNAME records that directed institutional hostnames to gambling pages, mostly hosted on Cloudflare Pages, and was associated with more than 850 observed entry points across eight institutional domains. A separate operation delegated subzones under \u003ccode\u003emaharashtra.gov.in\u003c/code\u003e and \u003ccode\u003eonline.esic.gov.in\u003c/code\u003e to third-party nameservers, allowing the actor to manage records below those subzones; a wildcard under \u003ccode\u003egam.maharashtra.gov.in\u003c/code\u003e enabled arbitrary names to resolve. Infoblox recommends that DNS operators validate new NS delegations, investigate unexpected subdomains, CNAMEs, and wildcard records, and secure DNS-management accounts with MFA, credential rotation, and access-log reviews.\u003c/p\u003e\n"}]</script>
