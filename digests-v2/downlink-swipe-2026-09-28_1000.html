<script type="application/json" id="dl-articles">[{"n":1,"title":"Oh Look, The Foot Gun Went Off Again (Citrix NetScaler PreAuth Command Injection CVE-2026-88771)","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/oh-look-the-foot-gun-went-off-again-citrix-netscaler-preauth-command-injection-cve-2026-88771/","time":"10:55","priority":"MUST READ","score":97,"tldr":"Citrix NetScaler CVE-2026-88771 is an actively exploited, pre-authentication command injection affecting default configurations, allowing remote attackers to execute commands as root through poisoned log entries. Organizations should urgently update NetScaler ADC and Gateway to Citrix’s fixed releases.","briefOverview":"\u003cp\u003eThe article analyzes CVE-2026-88771, an actively exploited pre-authentication command-injection flaw in Citrix NetScaler ADC and Gateway appliances. It affects default configurations and can allow an unauthenticated attacker to run arbitrary commands. Citrix addressed it alongside seven other vulnerabilities in security bulletin CTX697096 and recommends updating affected appliances to fixed releases.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable \u003ccode\u003ens_monuploadd_err.pl\u003c/code\u003e script parsed crash-related log messages with shell commands and later inserted an attacker-influenced value into another shell command. A crafted login value or other logged HTTP-controlled data could introduce shell command separators, causing a command to run as root when the script processed the logs. The patch restricts the parsed values to an expected NetScaler process name and numeric process ID, runs \u003ccode\u003efind\u003c/code\u003e without a shell, and validates the resulting path as additional protection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-88771 is a pre-authentication command-injection flaw in Citrix NetScaler ADC and Gateway that Citrix says was exploited in the wild and affects default configurations.","The vulnerable NetScaler script ns_monuploadd_err.pl extracted attacker-influenced text from logs and inserted it into a shell command, enabling arbitrary commands to run as root.","The article states that controlled values in login fields, request parameters, HTTP headers, failed login attempts, and rate-limited requests can reach logs and potentially trigger the issue.","Citrix fixed the flaw by restricting extracted core-file values to a Packet Engine name and numeric process ID, invoking find without a shell, and validating returned paths.","Citrix recommends updating NetScaler ADC and Gateway 14.1 to version 14.1-73.37 or later, and 13.1 to version 13.1-64.23 or later."],"insights":["The malicious input does not execute immediately; it is written to logs first and may execute when the NetScaler monitoring script runs, which the article says can take up to 24 hours.","The issue is not confined to the demonstrated login endpoint: the article states that any endpoint or port that logs attacker-controlled HTTP header data can potentially trigger it, including the management interface.","The fix removes two separate risks by both limiting the parsed log values to a narrow expected format and running the file-search command without a shell interpreting special characters.","Among the eight flaws addressed in Citrix bulletin CTX697096, CVE-2026-88778 requires Enhanced ISN Generation to be enabled because upgrading alone does not address it."],"referencedReports":[{"title":"Citrix NetScaler ADC and Citrix NetScaler Gateway Security Bulletin for CVE-2026-88771 through CVE-2026-88778","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697096\u0026articleURL=Citrix_NetScaler_ADC_and_Citrix_NetScaler_Gateway_Security_Bulletin_for_CVE_2026_88771_CVE_2026_88772_CVE_2026_88773_CVE_2026_88774_CVE_2026_88775_CVE_2026_88776_CVE_2026_88777_and_CVE_2026_88778","publisher":"citrix","context":"The article cites Citrix bulletin CTX697096 as the advisory covering eight NetScaler vulnerabilities and the fixed software versions.","category":"advisory","primary":true}],"body":"\u003cp\u003eThe article analyzes CVE-2026-88771, an actively exploited pre-authentication command-injection flaw in Citrix NetScaler ADC and Gateway appliances. It affects default configurations and can allow an unauthenticated attacker to run arbitrary commands. Citrix addressed it alongside seven other vulnerabilities in security bulletin CTX697096 and recommends updating affected appliances to fixed releases.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerable \u003ccode\u003ens_monuploadd_err.pl\u003c/code\u003e script parsed crash-related log messages with shell commands and later inserted an attacker-influenced value into another shell command. A crafted login value or other logged HTTP-controlled data could introduce shell command separators, causing a command to run as root when the script processed the logs. The patch restricts the parsed values to an expected NetScaler process name and numeric process ID, runs \u003ccode\u003efind\u003c/code\u003e without a shell, and validates the resulting path as additional protection.\u003c/p\u003e\n"},{"n":2,"title":"Cyberattack on Polish medical software provider exposes patient data","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/poland-cyberattack-medical-medyc","time":"13:30","priority":"SHOULD READ","score":84,"tldr":"Polish medical software provider Qbusoft suffered an SQL injection breach of its Medyc platform, potentially exposing patient identities and sensitive medical records. Authorities are investigating amid broader attacks on Poland’s healthcare sector, while attackers claim to have stolen data on millions of patients.","briefOverview":"\u003cp\u003ePolish healthcare software provider Qbusoft’s Medyc platform was breached after an attacker exploited an SQL injection flaw in August. The intrusion was detected overnight on September 9, after an encrypted database archive was transferred outside Qbusoft’s systems. Medyc said attackers obtained names, PESEL national identification numbers, addresses, phone numbers, and email addresses, while theft of medical records has not been confirmed.\u003c/p\u003e\n\n\u003cp\u003eAn affected treatment center in Inowrocław said evidence indicated attackers ran scripts against database tables containing medical information, making medical-record exposure highly likely. Potentially affected information included hospital treatment records and discharge summaries for patients in its addiction-treatment day unit. Qbusoft said it fixed the flaw, restricted database permissions, rotated credentials, and added monitoring, while Polish authorities opened an investigation and ordered an audit amid broader recent attacks on the country’s healthcare sector.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Qbusoft’s Medyc healthcare platform was breached after an attacker exploited an SQL injection flaw in August, with the intrusion detected overnight on September 9.","Attackers obtained names, PESEL national identification numbers, addresses, phone numbers, and email addresses, while medical-record theft has not been confirmed but is considered highly likely by an affected provider.","Patients of the Addiction and Psychiatric Treatment Center in Inowrocław’s Day Treatment Unit for Addiction Treatment were affected, and potentially exposed records included hospital treatment documentation and discharge summaries.","Qbusoft said it fixed the flaw on the day the incident was discovered, restricted database permissions, rotated credentials, and added monitoring.","Polish authorities are investigating the incident, and the data protection authority has ordered an audit of the company behind Medyc."],"insights":["Although some identifiers in the database were encrypted, Qbusoft advised the affected provider to assume attackers could easily decrypt them, limiting the protective value of that encryption.","The incident was detected weeks after the late-August intrusion, after an encrypted database archive had already been transferred outside Qbusoft’s systems.","Poland’s digital affairs minister said Qbusoft did not initially report the incident to CERT Polska or the healthcare-sector incident-response team, and authorities are considering stricter certification and medical-data processing rules.","The same Inowrocław treatment center was affected by both the Medyc and MyDr incidents, underscoring that separate healthcare software breaches can affect the same care provider."],"referencedReports":[{"title":"Zawiadomienie o naruszeniu ochrony danych osobowych","url":"https://terapia-inowroclaw.pl/aktualnosci/zawiadomienie-o-naruszeniu-ochrony-danych-osobowych/","publisher":"Addiction and Psychiatric Treatment Center in Inowrocław","context":"The affected treatment center’s breach notification states that the Medyc intrusion exploited an SQL injection flaw and may have exposed patient medical information.","category":"advisory","primary":true}],"body":"\u003cp\u003ePolish healthcare software provider Qbusoft’s Medyc platform was breached after an attacker exploited an SQL injection flaw in August. The intrusion was detected overnight on September 9, after an encrypted database archive was transferred outside Qbusoft’s systems. Medyc said attackers obtained names, PESEL national identification numbers, addresses, phone numbers, and email addresses, while theft of medical records has not been confirmed.\u003c/p\u003e\n\n\u003cp\u003eAn affected treatment center in Inowrocław said evidence indicated attackers ran scripts against database tables containing medical information, making medical-record exposure highly likely. Potentially affected information included hospital treatment records and discharge summaries for patients in its addiction-treatment day unit. Qbusoft said it fixed the flaw, restricted database permissions, rotated credentials, and added monitoring, while Polish authorities opened an investigation and ordered an audit amid broader recent attacks on the country’s healthcare sector.\u003c/p\u003e\n"},{"n":4,"title":"Carbonato Botnet Compromises Docker Hosts to Deploy Telegram-Controlled Hermes AI Agent","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/carbonato-botnet-compromises-docker.html","time":"11:46","priority":"SHOULD READ","score":84,"tldr":"The Carbonato botnet exploits unauthenticated Docker daemons to worm across networks, establish persistent remote access, and deploy a Telegram-controlled Hermes AI agent that can execute attacker-directed commands and steal credentials.","briefOverview":"\u003cp\u003eResearchers disclosed Carbonato, a botnet that targets Docker daemons exposed without authentication on port 2375. It can spread across nearby networks by finding additional exposed Docker hosts and launching privileged containers that execute commands on the underlying systems. The operation has not been attributed to a known group, although language, timezone, and infrastructure clues point to operators in Costa Rica.\u003c/p\u003e\n\n\u003cp\u003eCarbonato establishes remote access through a reverse SSH tunnel to a Costa Rica relay, installs an SSH server with the operators’ key, and reports deployments through Telegram. It uses cron jobs and watchdog scripts for persistence, while masquerading as a system component to reduce detection. The botnet installs Hermes Agent and changes its SOUL.md instruction file so the AI agent accepts Telegram tasks, executes generated terminal commands, maintains persistence, and prioritizes collecting AI API keys and other credentials.\u003c/p\u003e\n\n\u003cp\u003eThe report arrives amid other disclosed campaigns in which attackers used AI tools to automate target discovery, exploitation, post-compromise work, and command-and-control activity. Examples cited include operations using Hermes Agent, DeepSeek, Strix, and Cairn against government systems and online retailers. The article also describes CLOSEDQUORUM, a Windows implant that queries multiple AI providers to select post-compromise actions such as credential theft, code injection, persistence, and likely movement to other systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Carbonato targets Docker daemons exposed without authentication on port 2375, launches privileged containers on compromised hosts, and scans nearby networks every five minutes to spread further.","The botnet installs Hermes Agent, replaces its SOUL.md persona with instructions to accept Telegram tasks, maintain persistence, and prioritize collecting AI API keys and other credentials.","Carbonato creates a reverse SSH tunnel to a relay in Costa Rica, installs an SSH server using the operators' key, and reports new deployments through Telegram.","The malware masquerades as a system component and uses cron jobs and watchdog scripts to restart itself if its files are removed.","The report links Carbonato to a broader trend of attackers using AI agents and large language models to automate target discovery, exploitation, post-compromise activity, and command-and-control."],"insights":["Carbonato does not need to modify the Hermes Agent codebase: it changes the framework's 39-line SOUL.md persona file, showing that an AI agent's behavior can be repurposed through its instructions alone.","The botnet combines automated network spreading with a Telegram-based task interface, allowing operators to send instructions to each newly compromised host while the agent turns those tasks into terminal commands.","Its persistence is layered: cron jobs and watchdog scripts are intended to relaunch the implant even after malicious files are removed.","Researchers discovered the operation through an unauthenticated Docker registry that had been publicly accessible since May 2026, which also contained data tied to a separate trojanized cryptocurrency-wallet campaign.","The article describes other 2026 campaigns in which AI tools were used across multiple stages of intrusions, from finding weaknesses and launching attacks to post-compromise orchestration and credential theft."],"referencedReports":[{"title":"Carbonato","url":"https://www.threatdown.com/blog/carbonato/","publisher":"threatdown","context":"ThreatDown's technical analysis is the primary source for the Carbonato botnet's Docker propagation, persistence, Telegram control, and Hermes Agent deployment.","category":"research","primary":true},{"title":"Autonomous AI Cyber Attack Campaign","url":"https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/","publisher":"palo-alto-networks-unit-42","context":"Unit 42 linked the China-based knaithe and KnYuan actors to an AI-enabled campaign using DeepSeek through Hermes Agent and Telegram.","category":"research","primary":false},{"title":"Thailand Ministry of Finance Targeted With Hermes AI Agent","url":"https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent","publisher":"hunt-io","context":"Hunt.io documented a separate operation that used Hermes Agent in unattended YOLO mode against Thailand's Ministry of Finance.","category":"research","primary":false},{"title":"Autonomous AI Agents Target Online Retailers","url":"https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company","publisher":"gambit-security","context":"Gambit Security reported on a Chinese-speaking operator using Strix, Cairn, and Hermes AI tools against hundreds of online retailers.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers disclosed Carbonato, a botnet that targets Docker daemons exposed without authentication on port 2375. It can spread across nearby networks by finding additional exposed Docker hosts and launching privileged containers that execute commands on the underlying systems. The operation has not been attributed to a known group, although language, timezone, and infrastructure clues point to operators in Costa Rica.\u003c/p\u003e\n\n\u003cp\u003eCarbonato establishes remote access through a reverse SSH tunnel to a Costa Rica relay, installs an SSH server with the operators’ key, and reports deployments through Telegram. It uses cron jobs and watchdog scripts for persistence, while masquerading as a system component to reduce detection. The botnet installs Hermes Agent and changes its SOUL.md instruction file so the AI agent accepts Telegram tasks, executes generated terminal commands, maintains persistence, and prioritizes collecting AI API keys and other credentials.\u003c/p\u003e\n\n\u003cp\u003eThe report arrives amid other disclosed campaigns in which attackers used AI tools to automate target discovery, exploitation, post-compromise work, and command-and-control activity. Examples cited include operations using Hermes Agent, DeepSeek, Strix, and Cairn against government systems and online retailers. The article also describes CLOSEDQUORUM, a Windows implant that queries multiple AI providers to select post-compromise actions such as credential theft, code injection, persistence, and likely movement to other systems.\u003c/p\u003e\n"},{"n":3,"title":"Former US soldier gets nearly six-year sentence for hacking, extorting telecoms","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/hacker-telecom-army-sentenced","time":"12:45","priority":"SHOULD READ","score":78,"tldr":"Former U.S. Army soldier Cameron John Wagenius was sentenced to 70 months in prison and ordered to pay nearly $295,000 for hacking telecoms, stealing sensitive customer records, and extorting victims. Prosecutors said he also tried to sell stolen data to a foreign military intelligence service.","briefOverview":"\u003cp\u003eFormer U.S. Army soldier Cameron John Wagenius, 22, was sentenced to 70 months in federal prison and ordered to pay nearly $295,000 in restitution for hacking telecommunications companies, stealing sensitive records, and extorting victims. Wagenius was on active duty in South Korea and at Fort Cavazos, Texas, during the activity, which occurred from April 2023 through December 18, 2024. He pleaded guilty to charges including wire fraud, extortion, aggravated identity theft, and offenses involving the posting and transmission of confidential phone records.\u003c/p\u003e\n\n\u003cp\u003eUsing the username “kiberphant0m,” Wagenius and others used a tool he created, called “SSH Brute,” to access at least 10 organizations and obtain hundreds of thousands of business and customer records. The stolen material included phone and text-message history records, telecommunications identifying information, and other personal information; the group sought at least $1 million in ransom demands and marketed data on BreachForums and XSS.is. Prosecutors said Wagenius also used stolen information for fraud including SIM-swapping and contacted an address he believed belonged to a foreign military intelligence service to try to sell the data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former U.S. Army soldier Cameron John Wagenius, 22, received a 70-month federal prison sentence and was ordered to pay nearly $295,000 in restitution.","Wagenius pleaded guilty to wire fraud, extortion, aggravated identity theft, and charges related to posting and transmitting confidential phone records.","Between April 2023 and December 2024, Wagenius and two other hackers stole sensitive call records and other customer data from telecommunications companies and sought at least $1 million in ransoms.","Using the username \"kiberphant0m,\" Wagenius used a tool called \"SSH Brute\" with others to access at least 10 organizations and market stolen data on BreachForums and XSS.is.","Prosecutors said Wagenius contacted an address he believed belonged to an unnamed country’s military intelligence service in an attempt to sell stolen information."],"insights":["The campaign went beyond stealing data: prosecutors said the stolen records were used for extortion, sold online, and used to support SIM-swapping fraud.","The compromised AT\u0026T data reportedly included metadata for nearly all customer calls and texts during a six-month period in 2022, showing that non-content communications records can still be highly sensitive.","Wagenius was an active-duty soldier during the alleged activity, stationed in both South Korea and Texas, which prosecutors described as a betrayal of the trust placed in him.","Prosecutors said Wagenius tried to sell stolen information to what he believed was a foreign military intelligence service, elevating the case beyond financially motivated extortion.","The case documents connect Wagenius to a broader set of telecom and Snowflake-related incidents involving alleged hackers Connor Riley Moucka and John Erin Binns."],"referencedReports":[],"body":"\u003cp\u003eFormer U.S. Army soldier Cameron John Wagenius, 22, was sentenced to 70 months in federal prison and ordered to pay nearly $295,000 in restitution for hacking telecommunications companies, stealing sensitive records, and extorting victims. Wagenius was on active duty in South Korea and at Fort Cavazos, Texas, during the activity, which occurred from April 2023 through December 18, 2024. He pleaded guilty to charges including wire fraud, extortion, aggravated identity theft, and offenses involving the posting and transmission of confidential phone records.\u003c/p\u003e\n\n\u003cp\u003eUsing the username “kiberphant0m,” Wagenius and others used a tool he created, called “SSH Brute,” to access at least 10 organizations and obtain hundreds of thousands of business and customer records. The stolen material included phone and text-message history records, telecommunications identifying information, and other personal information; the group sought at least $1 million in ransom demands and marketed data on BreachForums and XSS.is. Prosecutors said Wagenius also used stolen information for fraud including SIM-swapping and contacted an address he believed belonged to a foreign military intelligence service to try to sell the data.\u003c/p\u003e\n"},{"n":6,"title":"A Salary Notice Whose Effective Date Was Its Build Clock","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/salary-notice-effective-date-was-its-build-clock","time":"11:00","priority":"MAY READ","score":68,"tldr":"A payroll phishing PDF exposed its automated generation by using a salary effective timestamp one second before the file was created and two seconds before delivery. Although the attachment contained no malicious links or code, its QR-code signing prompt and broken personalization made it a social-engineering lure that was caught by human reporting.","briefOverview":"\u003cp\u003eA fake internal payroll notice sent to four mailboxes at a UAE-based food import and distribution group carried a two-page PDF claiming a compensation adjustment. The PDF stated that the adjustment was effective at 2026-05-07 11:50:13, while its creation metadata was timestamped one second later and the email arrived at 11:50:15 UTC. All four messages were quarantined, and a human report ultimately produced the malicious verdict.\u003c/p\u003e\n\n\u003cp\u003eThe document showed signs of automated, incomplete personalization: the recipient email address was used as both employee identification and document reference, and a shared mailbox local part was used as a personal greeting. It instructed recipients to scan a verification code to electronically sign documentation, but analysis found no links, scripts, automatic PDF actions, recovered code, or destination. The readable attachment contained no executable content, so its clean automated scan verdict was technically correct; the case illustrates that a harmless-looking document can still support social engineering by moving the recipient to an uninspected channel.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fake payroll PDF stated that a compensation adjustment was effective at 2026-05-07 11:50:13, while its creation timestamp was one second later and the email was timestamped at 11:50:15 UTC.","Four mailboxes at a UAE-based food import and distribution group received the messages within about four minutes, and all four were quarantined.","The PDF used the recipient's email address for both the employee identification and document reference fields, and addressed a shared mailbox local part as though it were a person.","The attachment instructed recipients to scan a verification code to electronically sign documentation, but analysis found no PDF links, scripts, automatic actions, recovered code, or destination.","The attachment was readable and contained no executable content, so the platform scan correctly marked it clean; a human report led to the malicious verdict."],"insights":["A salary effective date rendered to the second, followed almost immediately by the PDF creation and email delivery times, can reveal that a supposed business fact was copied from an automated document generator's clock.","A PDF can be technically clean and still be maliciously useful when it directs the recipient to continue the interaction by scanning a code, moving the next step outside the email security path.","Broken personalization, such as using an email address as an employee ID and greeting a shared mailbox as a person, provides practical evidence of a template populated with limited recipient data.","Passing sender-authentication checks at the final delivery hop did not establish that the message's earlier path was trustworthy, because the preserved earlier results showed failed authentication and the ARC chain was broken.","Human reporting was the decisive control in this case after automated scanning found no executable content and the AI analyst returned no confidence or labels."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's email attack mix, phishing initial-access statistics, human-element findings, and observations about AI-assisted malicious email.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references this guidance for stopping phishing during its first phase.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites this report as a survey of the broader threat landscape at scale.","category":"research","primary":false}],"body":"\u003cp\u003eA fake internal payroll notice sent to four mailboxes at a UAE-based food import and distribution group carried a two-page PDF claiming a compensation adjustment. The PDF stated that the adjustment was effective at 2026-05-07 11:50:13, while its creation metadata was timestamped one second later and the email arrived at 11:50:15 UTC. All four messages were quarantined, and a human report ultimately produced the malicious verdict.\u003c/p\u003e\n\n\u003cp\u003eThe document showed signs of automated, incomplete personalization: the recipient email address was used as both employee identification and document reference, and a shared mailbox local part was used as a personal greeting. It instructed recipients to scan a verification code to electronically sign documentation, but analysis found no links, scripts, automatic PDF actions, recovered code, or destination. The readable attachment contained no executable content, so its clean automated scan verdict was technically correct; the case illustrates that a harmless-looking document can still support social engineering by moving the recipient to an uninspected channel.\u003c/p\u003e\n"},{"n":7,"title":"Attack Surface Management in 2026: Why Point-in-Time Scans Can’t Keep Up With Cloud Sprawl","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/attack-surface-management-point-in-time/","time":"13:28","priority":"MAY READ","score":38,"tldr":"Quarterly or annual attack-surface scans cannot keep pace with rapidly changing cloud environments, leaving ephemeral and misconfigured internet-facing assets unmonitored for extended periods. The article argues that continuous outside-in discovery, monitoring, prioritization, and ownership workflows are now necessary, and promotes Cyble Odin as a solution.","briefOverview":"\u003cp\u003eCloud infrastructure can change hourly, but many organizations still assess their external attack surface quarterly or annually. The article argues that this leaves newly created test environments, storage buckets, subdomains, and other internet-facing assets exposed and unmonitored until the next scheduled review. It identifies short-lived assets, decentralized cloud and SaaS ownership, and configuration changes as reasons a point-in-time scan quickly becomes outdated.\u003c/p\u003e\n\n\u003cp\u003eThe article cites CISA Binding Operational Directive 23-01, which requires U.S. federal civilian agencies to conduct automated asset discovery every seven days and vulnerability enumeration every 14 days, with on-demand discovery available within 72 hours. It also cites NSA guidance on cloud misconfigurations and “ghost assets,” alongside FBI, ENISA, and CERT-EU reporting that highlights growing financial losses and rapid exploitation of internet-facing software. The article says continuous attack surface management should combine attacker-style external discovery, ongoing monitoring for new exposures, prioritization based on exploitability and threat activity, and assignment of findings to owners for remediation.\u003c/p\u003e\n\n\u003cp\u003eCyble promotes its Cyble Attack Surface Management product, powered by Cyble Odin, as a continuously updated view of an organization’s internet-facing infrastructure. According to the article, Odin identifies newly exposed hosts, cloud services, open ports, and misconfigured assets shortly after they appear, and uses Cyble threat intelligence to add context on exploit activity and threat-actor interest. The stated conclusion is that continuous visibility is necessary because scheduled assessments cannot keep pace with cloud changes and attackers can weaponize flaws within days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Point-in-time attack-surface scans become outdated within hours in multi-cloud environments driven by infrastructure as code, CI/CD pipelines, and self-service provisioning.","Ephemeral assets, decentralized ownership, and configuration drift can create unmonitored external exposures between scheduled scan windows.","CISA Binding Operational Directive 23-01 requires U.S. federal civilian agencies to perform automated asset discovery every seven days and vulnerability enumeration every 14 days.","ENISA reported that vulnerability exploitation accounted for 21.3% of initial access in the EU in 2025, with widespread campaigns weaponizing flaws within days of disclosure.","The article states that continuous attack surface management requires outside-in discovery, continuous monitoring, threat-informed prioritization, and ownership workflows."],"insights":["A 90-day assessment cycle is roughly 13 times less current than the weekly asset-discovery baseline required of U.S. federal civilian agencies under CISA BOD 23-01.","CISA guidance requires agencies to begin a new vulnerability scan every 14 days even if the prior scan has not completed, showing that scan completion should not delay regular visibility.","Federal agencies must be able to start asset discovery within 72 hours of a CISA request, making rapid on-demand visibility an explicit operational expectation.","The article emphasizes that finding exposures is insufficient unless each one is assigned to its owning team and tracked through remediation.","Threat-informed ranking can help teams focus on exposed assets that show real-world exploitability or threat-actor interest rather than simply addressing findings by volume."],"referencedReports":[{"title":"Binding Operational Directive 23-01: Improving Asset Visibility and Vulnerability Detection on Federal Networks","url":"https://www.cisa.gov/news-events/directives/bod-23-01-improving-asset-visibility-and-vulnerability-detection-federal-networks","publisher":"cisa","context":"The article cites the directive's requirements for automated asset discovery every seven days and vulnerability enumeration every 14 days for U.S. federal civilian agencies.","category":"advisory","primary":true},{"title":"BOD 23-01 Implementation Guidance: Improving Asset Visibility and Vulnerability Detection on Federal Networks","url":"https://www.cisa.gov/news-events/directives/bod-23-01-implementation-guidance-improving-asset-visibility-and-vulnerability-detection-federal","publisher":"cisa","context":"The article references the guidance to note that agencies must begin a new scan every 14 days even when the prior scan has not finished.","category":"guide","primary":false},{"title":"2025 Internet Crime Report","url":"https://www.fbi.gov/file-repository/2025_ic3report.pdf","publisher":"fbi","context":"The article cites the report's figures for 2025 complaints, reported losses, and ransomware complaints.","category":"research","primary":false},{"title":"Top Ten Cloud Security Mitigation Strategies","url":"https://media.defense.gov/2024/Mar/07/2003407860/-1/-1/0/CSI-CloudTop10-Mitigation-Strategies.PDF","publisher":"nsa","context":"The article references the NSA document's warning that misconfigured, unsecured, or unmonitored cloud systems and ghost assets are attractive targets.","category":"guide","primary":false},{"title":"ENISA Threat Landscape 2025","url":"https://www.enisa.europa.eu/sites/default/files/2025-11/ENISA%20Threat%20Landscape%202025.pdf","publisher":"enisa","context":"The article cites ENISA's finding that vulnerability exploitation accounted for 21.3% of initial access in the EU and that flaws can be weaponized within days.","category":"research","primary":false},{"title":"Threat Landscape Report 2025","url":"https://cert.europa.eu/blog/threat-landscape-report-2025","publisher":"cert-eu","context":"The article references CERT-EU's assessment that exploitation of internet-facing software was the highest-impact initial access vector for the second consecutive year.","category":"research","primary":false}],"body":"\u003cp\u003eCloud infrastructure can change hourly, but many organizations still assess their external attack surface quarterly or annually. The article argues that this leaves newly created test environments, storage buckets, subdomains, and other internet-facing assets exposed and unmonitored until the next scheduled review. It identifies short-lived assets, decentralized cloud and SaaS ownership, and configuration changes as reasons a point-in-time scan quickly becomes outdated.\u003c/p\u003e\n\n\u003cp\u003eThe article cites CISA Binding Operational Directive 23-01, which requires U.S. federal civilian agencies to conduct automated asset discovery every seven days and vulnerability enumeration every 14 days, with on-demand discovery available within 72 hours. It also cites NSA guidance on cloud misconfigurations and “ghost assets,” alongside FBI, ENISA, and CERT-EU reporting that highlights growing financial losses and rapid exploitation of internet-facing software. The article says continuous attack surface management should combine attacker-style external discovery, ongoing monitoring for new exposures, prioritization based on exploitability and threat activity, and assignment of findings to owners for remediation.\u003c/p\u003e\n\n\u003cp\u003eCyble promotes its Cyble Attack Surface Management product, powered by Cyble Odin, as a continuously updated view of an organization’s internet-facing infrastructure. According to the article, Odin identifies newly exposed hosts, cloud services, open ports, and misconfigured assets shortly after they appear, and uses Cyble threat intelligence to add context on exploit activity and threat-actor interest. The stated conclusion is that continuous visibility is necessary because scheduled assessments cannot keep pace with cloud changes and attackers can weaponize flaws within days.\u003c/p\u003e\n"},{"n":5,"title":"Webinar: How to Govern AI Agents, Reduce Excessive Access, and Control Shadow AI","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/webinar-how-to-govern-ai-agents-reduce.html","time":"11:58","priority":"MAY READ","score":25,"tldr":"Okta is hosting a webinar on treating AI agents as first-class identities to improve visibility, ownership, access reviews, and revocation. The session focuses on reducing excessive permissions and governing shadow AI rather than simply blocking it.","briefOverview":"\u003cp\u003eOkta is hosting a webinar featuring Regional CSO Matt Immler on governing AI agents as first-class identities. The session will address how organizations can improve visibility into AI agents, assign ownership, review access, reduce excessive permissions, and control shadow AI. The article states that AI agents are increasingly connecting to applications, handling data, calling APIs, and acting across business systems.\u003c/p\u003e\n\n\u003cp\u003eAccording to Okta’s Global CISO Insights 2026 report, only 47% of CISOs are confident they can identify every AI agent in their environment, and roughly 80% of those confident in their visibility still worry that excessive access may go unreviewed. Only one in four surveyed organizations has adopted a purpose-built framework for securing AI agents, while 21% still use shared credentials or broad-permission service accounts. The article argues that organizations need to know which agents exist, what they can access, who approved them, whether access remains justified, and how quickly it can be removed when risk changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Okta is hosting a webinar with Regional CSO Matt Immler on governing AI agents as first-class identities.","Okta’s Global CISO Insights 2026 report found that only 47% of CISOs are confident they can identify every AI agent in their environment.","The article states that only one in four surveyed organizations has adopted a purpose-built framework for securing AI agents, while 21% still use shared credentials or broad-permission service accounts.","The webinar will address discovering AI agents, assigning ownership, reviewing their access, reducing excessive permissions, and controlling shadow AI."],"insights":["Being able to identify an AI agent does not by itself show whether its access is appropriate, reviewed, or removable without affecting other services.","The article argues that blocking unapproved AI tools alone does not address the governance problem; organizations also need to discover them, determine what they can access, and assign an owner.","Organizations with more mature identity governance report less shadow AI, faster responses to rogue agents, and lower concern about AI-enabled breaches, according to Okta’s research."],"referencedReports":[],"body":"\u003cp\u003eOkta is hosting a webinar featuring Regional CSO Matt Immler on governing AI agents as first-class identities. The session will address how organizations can improve visibility into AI agents, assign ownership, review access, reduce excessive permissions, and control shadow AI. The article states that AI agents are increasingly connecting to applications, handling data, calling APIs, and acting across business systems.\u003c/p\u003e\n\n\u003cp\u003eAccording to Okta’s Global CISO Insights 2026 report, only 47% of CISOs are confident they can identify every AI agent in their environment, and roughly 80% of those confident in their visibility still worry that excessive access may go unreviewed. Only one in four surveyed organizations has adopted a purpose-built framework for securing AI agents, while 21% still use shared credentials or broad-permission service accounts. The article argues that organizations need to know which agents exist, what they can access, who approved them, whether access remains justified, and how quickly it can be removed when risk changes.\u003c/p\u003e\n"}]</script>
