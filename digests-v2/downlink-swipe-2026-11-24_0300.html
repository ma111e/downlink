<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers Exploit N-able MailAssure Flaw While AI Agents Exploit MONAI Label Zero-Day","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-n-able-mailassure-flaw.html","time":"06:02","priority":"MUST READ","score":96,"tldr":"CISA added actively exploited flaws in N-able MailAssure and MONAI Label to its KEV catalog, including a MONAI Label zero-day reportedly exploited by AI agents to gain root-level reverse-shell access. Organizations should urgently patch CVE-2026-134624 and CVE-2026-133968.","briefOverview":"\u003cp\u003eCISA added two actively exploited vulnerabilities to its Known Exploited Vulnerabilities catalog: CVE-2026-134624 in N-able MailAssure and CVE-2026-133968 in MONAI Label. The MailAssure flaw is a server-side request forgery issue that allows an authenticated API user to reach arbitrary internal hosts and ports and send crafted data to internal services. N-able linked its exploitation to a November 16 security incident that disrupted Mail Assure and SpamExperts Hosted Cloud, although the company said affected functions were restored and its investigation found exploitation confined to one hosted server.\u003c/p\u003e\n\n\u003cp\u003eThe MONAI Label flaw lets an unauthenticated remote attacker write files outside the intended data directory and could result in remote code execution. A suspected China-linked actor reportedly used CAIRN AI agents to identify and exploit the zero-day in about 11 minutes, then wrote a Python reverse-shell payload to sitecustomize.py and triggered a training endpoint to obtain a root shell. The article places this activity within a broader set of AI-driven campaigns involving ARTEX, AntiFox, and CyberStrikeAI, which have targeted organizations, payment services, cloud environments, and cryptocurrency exchanges. Federal Civilian Executive Branch agencies were advised to apply fixes for both vulnerabilities by November 26, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-134624 in N-able MailAssure and CVE-2026-133968 in MONAI Label to its Known Exploited Vulnerabilities catalog after finding evidence of active exploitation.","CVE-2026-134624 is a critical MailAssure flaw that lets an authenticated API user reach arbitrary internal hosts and ports and send crafted data to internal services.","CVE-2026-133968 is a critical MONAI Label path traversal flaw that allows an unauthenticated remote attacker to write files outside the intended directory and could lead to remote code execution.","A suspected China-linked actor reportedly used CAIRN AI agents to identify and exploit the MONAI Label zero-day, then used a Python startup file and a training API endpoint to establish a root reverse shell.","Federal Civilian Executive Branch agencies were advised to apply fixes for both vulnerabilities by November 26, 2026."],"insights":["The MONAI Label zero-day was reportedly identified and exploited by AI agents in about 11 minutes, showing that the agents could discover and use an unknown flaw with minimal human direction.","The attackers reportedly gained persistent root-level access by writing a payload to Python’s automatically imported sitecustomize.py file and then triggering a training endpoint to start a new Python process.","AWS described an ARTEX campaign in which stolen AI-model access keys funded the AI processing used to find additional credentials, creating a self-sustaining operation.","ARTEX activity against AWS environments used both compromised long-term access keys and public Cognito user pools, including account registration and account enumeration through collected tokens.","Previdian observed ARTEX-related traffic attempting several high-impact techniques, including application discovery, authentication probing, remote code execution attempts, path traversal, and retrieval of sensitive configuration data."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/23/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA’s advisory is cited for adding the N-able MailAssure and MONAI Label flaws to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Amazon Threat Intelligence Observes Threat Actors Running Cybercrime Campaigns with ARTEX AI Agents","url":"https://aws.amazon.com/blogs/security/amazon-threat-intelligence-observes-threat-actors-running-cybercrime-campaigns-with-artex-ai-agents/","publisher":"amazon-web-services","context":"The article cites AWS research describing ARTEX-linked campaigns involving AI-model credential theft and cryptocurrency exchange KYC bypass attempts.","category":"research","primary":false},{"title":"ARTEX Agentic Attacks in AWS Environments","url":"https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/","publisher":"datadog-security-labs","context":"Datadog Security Labs is cited for analysis of ARTEX activity in AWS environments, including use of valid long-term access keys to search for financial data.","category":"research","primary":false},{"title":"ARTEX Traffic: Previdian Threat Intelligence Report — November 2026","url":"https://blog.previdian.com/artex-traffic-previdian-threat-intelligence-report-november-2026/","publisher":"previdian","context":"Previdian’s threat-intelligence report is cited for sensor telemetry documenting ARTEX-marked traffic and related discovery, authentication, code-execution, and path-traversal attempts.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added two actively exploited vulnerabilities to its Known Exploited Vulnerabilities catalog: CVE-2026-134624 in N-able MailAssure and CVE-2026-133968 in MONAI Label. The MailAssure flaw is a server-side request forgery issue that allows an authenticated API user to reach arbitrary internal hosts and ports and send crafted data to internal services. N-able linked its exploitation to a November 16 security incident that disrupted Mail Assure and SpamExperts Hosted Cloud, although the company said affected functions were restored and its investigation found exploitation confined to one hosted server.\u003c/p\u003e\n\n\u003cp\u003eThe MONAI Label flaw lets an unauthenticated remote attacker write files outside the intended data directory and could result in remote code execution. A suspected China-linked actor reportedly used CAIRN AI agents to identify and exploit the zero-day in about 11 minutes, then wrote a Python reverse-shell payload to sitecustomize.py and triggered a training endpoint to obtain a root shell. The article places this activity within a broader set of AI-driven campaigns involving ARTEX, AntiFox, and CyberStrikeAI, which have targeted organizations, payment services, cloud environments, and cryptocurrency exchanges. Federal Civilian Executive Branch agencies were advised to apply fixes for both vulnerabilities by November 26, 2026.\u003c/p\u003e\n"},{"n":2,"title":"OpenAI and Cisco Unveil AI-Assisted Linux Security Tool to Block Exploits Before Patching","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/openai-and-cisco-unveil-ai-assisted.html","time":"06:02","priority":"MAY READ","score":72,"tldr":"OpenAI and Cisco have launched Shirudo, an open-source Linux runtime that uses AI-generated, signed eBPF “shields” to block known exploit paths without restarting services while patches are tested and deployed.","briefOverview":"\u003cp\u003eOpenAI and Cisco have launched Shirudo, an open-source Linux runtime designed to let AI agents create temporary protections against exploits without interrupting running services. The project aims to give defenders time to test and deploy permanent patches while reducing the risk from newly identified software flaws. OpenAI described it as an initial step toward infrastructure that can adapt to threats while continuing to operate.\u003c/p\u003e\n\n\u003cp\u003eShirudo uses eBPF, which allows lightweight sandboxed programs to run inside the Linux kernel without changing system code or restarting the machine. Its guardian agent can create targeted \u0026ldquo;shields\u0026rdquo; that block vulnerable code paths, first allowing teams to monitor their effect before enabling active blocking. Shields are cryptographically signed, delivered in .bee packages through OCI-compliant registries, and validated using TPM-based checks; in a controlled experiment, OpenAI said a Codex-generated shield blocked a Java4Shell attempt against a running Elasticsearch service without a restart.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI and Cisco launched Shirudo, an open-source Linux runtime intended to let AI agents deploy temporary safeguards against exploits without interrupting running services.","Shirudo uses eBPF, a Linux capability for running lightweight sandboxed programs in the kernel, to block vulnerable code paths without restarting the system.","Security teams can monitor the effect of a proposed Shirudo shield before enforcing it, and shields are cryptographically signed and verified before loading.","Shirudo is built on Tetragon, an eBPF-based security platform developed and open-sourced by Isovalent.","In a controlled experiment, OpenAI said a Codex-generated shield blocked a Java4Shell exploit attempt against a running Elasticsearch service without requiring a restart."],"insights":["Shirudo is designed as a temporary bridge to patching rather than a replacement for it: shields are meant to be retired after the permanent software fix is deployed.","Before a shield begins blocking activity, operators can observe its effect on an application, allowing them to check that legitimate requests still work while the exploit path is stopped.","Shields are packaged for distribution through OCI-compatible registries and validated with cryptographic signatures and TPM-based trust checks before target systems load them.","Cisco describes agents as using both open-source code and vendor disclosures to map a flaw to affected assets and attack paths before generating a narrowly targeted defense.","The project is motivated by the gap between increasingly fast AI-assisted vulnerability discovery and the days, weeks, or months often required to deploy fixes broadly."],"referencedReports":[],"body":"\u003cp\u003eOpenAI and Cisco have launched Shirudo, an open-source Linux runtime designed to let AI agents create temporary protections against exploits without interrupting running services. The project aims to give defenders time to test and deploy permanent patches while reducing the risk from newly identified software flaws. OpenAI described it as an initial step toward infrastructure that can adapt to threats while continuing to operate.\u003c/p\u003e\n\n\u003cp\u003eShirudo uses eBPF, which allows lightweight sandboxed programs to run inside the Linux kernel without changing system code or restarting the machine. Its guardian agent can create targeted \u0026ldquo;shields\u0026rdquo; that block vulnerable code paths, first allowing teams to monitor their effect before enabling active blocking. Shields are cryptographically signed, delivered in .bee packages through OCI-compliant registries, and validated using TPM-based checks; in a controlled experiment, OpenAI said a Codex-generated shield blocked a Java4Shell attempt against a running Elasticsearch service without a restart.\u003c/p\u003e\n"}]</script>
