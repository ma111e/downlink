})();

<script type="application/json" id="dl-articles">[{"n":3,"title":"How to patch PHP2Shell with free Aikido Images","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/how-to-patch-php2shell-with-free-aikido-images","time":"22:15","priority":"MUST READ","score":96,"tldr":"Critical PHP2Shell RCE flaws (CVE-2026-109618 and CVE-2026-109619) are reportedly being exploited, so organizations should immediately upgrade to fixed PHP releases or use Aikido’s backported container images for unsupported PHP versions and redeploy affected containers.","briefOverview":"\u003cp\u003ePHP2Shell refers to two critical PHP flaws, CVE-2026-109618 and CVE-2026-109619, that can allow an unauthenticated person to run code on a server handling PHP requests. Both vulnerabilities have a CVSS v4.0 score of 9.2, and Cloudflare reports that exploitation has begun. PHP issued fixes on October 21 in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35, but PHP 8.1 and older are out of support and will not receive upstream releases.\u003c/p\u003e\n\n\u003cp\u003eAikido provides free patched PHP container images through its public Amazon ECR repository for PHP release lines 5.5 through 8.5, except 8.0, including backported PHP2Shell fixes for older versions. Organizations should rebuild and redeploy every PHP-based image after changing images, then restart PHP-FPM or Apache workers so no processes continue using an old build. The article also recommends keeping \u003ccode\u003esession.upload_progress.enabled=0\u003c/code\u003e, testing public URLs with Aikido’s PHP2Shell checker, and checking systems for signs of compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP2Shell consists of two critical PHP remote-code-execution flaws, CVE-2026-109618 and CVE-2026-109619, each rated 9.2 under CVSS v4.0.","PHP released fixes on October 21 in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35, while PHP 8.1 and older will not receive upstream releases because they are out of support.","Cloudflare reports that exploitation of PHP2Shell has started.","Aikido provides free patched PHP container images for release lines 5.5 through 8.5, except PHP 8.0, with the PHP2Shell fixes backported for older versions.","After switching images, the article recommends rebuilding and redeploying PHP containers, disabling session.upload_progress.enabled, checking public sites with Aikido’s PHP2Shell checker, and looking for signs of compromise."],"insights":["Updating a running PHP container is not sufficient because the article says the exposed image must be rebuilt and redeployed so no workers remain on the old build.","The legacy session.upload_progress.enabled setting should remain disabled because the article identifies it as one confirmed path to CVE-2026-109619.","Organizations can remain on certain exact earlier PHP patch versions, including 8.2.34 and 8.3.35, by using Aikido’s backported patched builds instead of immediately changing their application’s PHP release line.","PHP 8.0 is an exception among the listed legacy release lines because Aikido does not yet provide a PHP2Shell-patched image for it."],"referencedReports":[{"title":"PHP2Shell","url":"https://www.aikido.dev/blog/critical-vulnerabilities-in-php-php2shell","publisher":"aikido","context":"The article directs readers to this Aikido post for details on the two PHP2Shell CVEs, temporary mitigations, and signs of compromise.","category":"advisory","primary":true}],"body":"\u003cp\u003ePHP2Shell refers to two critical PHP flaws, CVE-2026-109618 and CVE-2026-109619, that can allow an unauthenticated person to run code on a server handling PHP requests. Both vulnerabilities have a CVSS v4.0 score of 9.2, and Cloudflare reports that exploitation has begun. PHP issued fixes on October 21 in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35, but PHP 8.1 and older are out of support and will not receive upstream releases.\u003c/p\u003e\n\n\u003cp\u003eAikido provides free patched PHP container images through its public Amazon ECR repository for PHP release lines 5.5 through 8.5, except 8.0, including backported PHP2Shell fixes for older versions. Organizations should rebuild and redeploy every PHP-based image after changing images, then restart PHP-FPM or Apache workers so no processes continue using an old build. The article also recommends keeping \u003ccode\u003esession.upload_progress.enabled=0\u003c/code\u003e, testing public URLs with Aikido’s PHP2Shell checker, and checking systems for signs of compromise.\u003c/p\u003e\n"},{"n":7,"title":"Cross-request KV cache exposure in the GLM-5.3 Workers AI model, and our remediation with SGLang","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/kv-cache-exposure-remediation/","time":"22:01","priority":"SHOULD READ","score":85,"tldr":"Cloudflare disclosed that a misconfigured KV-cache pool and an SGLang disaggregated-inference bug caused 155 GLM-5.3 Workers AI responses to expose data from recent requests by other customers between August 27 and September 9, 2026. Cloudflare took the model offline, corrected the configuration and engine behavior, restored service, and worked with SGLang on upstream fixes and broader KV-cache safety hardening.","briefOverview":"\u003cp\u003eCloudflare disclosed a tenant-isolation issue in its GLM-5.3 Workers AI model that caused some customers to receive responses containing data from other customers’ recent requests. The exposure was present from the model’s August 27, 2026 launch until Cloudflare disabled it on September 9, and it affected 155 responses to prompts longer than 681,280 tokens. Cloudflare stated that it found no evidence of deliberate exploitation and confirmed that no other Workers AI model was affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue resulted from a mismatch between GLM-5.3’s 1,048,576-token context window and a prefill memory cache that could hold only 681,280 tokens, combined with an SGLang bug in its distributed processing mode. Oversized prompts were internally replaced with a one-token placeholder, but the system still treated the transfer as complete and generated output using leftover memory pages from earlier requests. Cloudflare increased the cache capacity to about 2.04 million tokens, patched the rejection path, validated the changes, and restored the model on September 9. It also worked with SGLang maintainers on upstream fixes, broader safeguards for memory-transfer races, integrity checks, and recommendations for operators to use SGLang v0.5.22 or later.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare disclosed that 155 responses from its GLM-5.3 Workers AI model contained data from other customers’ recent requests between August 27 and September 9, 2026.","The exposure occurred only for prompts longer than 681,280 tokens, because the model’s configured 1,048,576-token context window exceeded the capacity of its prefill memory cache.","An SGLang disaggregated prefill/decode bug allowed rejected oversized requests to transfer only placeholder data while decode systems read leftover memory pages from earlier requests.","Cloudflare disabled the model on September 9, increased the prefill cache capacity to about 2.04 million tokens, patched the inference engine, and restored the model later that day.","Cloudflare stated that no other Workers AI model was affected and recommended that disaggregated SGLang operators update to version 0.5.22 or later."],"insights":["Cloudflare knew the memory cache was smaller than the model’s advertised input limit before launch, but its testing checked successful HTTP responses rather than whether long-input output was correct and coherent.","The exposed data did not require an attacker to directly read memory: the model generated normal-looking responses while using leftover internal data that had not been overwritten by the new request.","Increasing cache capacity prevented valid requests from reaching the faulty rejection path, but Cloudflare also patched SGLang because future configuration changes could recreate the same unsafe condition.","Cloudflare’s broader hardening addresses cases where a cancelled request can still be writing data into memory later assigned to another request, showing that safe cleanup must be coordinated across both parts of the AI serving system.","Cloudflare is pursuing checks that verify a request owns each memory page before it is used, aiming to stop an affected request instead of returning another user’s data."],"referencedReports":[{"title":"SGLang team post on the Cloudflare security incident","url":"https://www.lmsys.org/blog/2026-10-26-cf-security","publisher":"SGLang team at RadixArk","context":"Cloudflare links to a coordinated post from the SGLang team for additional details on the incident and upstream remediation work.","category":"advisory","primary":false}],"body":"\u003cp\u003eCloudflare disclosed a tenant-isolation issue in its GLM-5.3 Workers AI model that caused some customers to receive responses containing data from other customers’ recent requests. The exposure was present from the model’s August 27, 2026 launch until Cloudflare disabled it on September 9, and it affected 155 responses to prompts longer than 681,280 tokens. Cloudflare stated that it found no evidence of deliberate exploitation and confirmed that no other Workers AI model was affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue resulted from a mismatch between GLM-5.3’s 1,048,576-token context window and a prefill memory cache that could hold only 681,280 tokens, combined with an SGLang bug in its distributed processing mode. Oversized prompts were internally replaced with a one-token placeholder, but the system still treated the transfer as complete and generated output using leftover memory pages from earlier requests. Cloudflare increased the cache capacity to about 2.04 million tokens, patched the rejection path, validated the changes, and restored the model on September 9. It also worked with SGLang maintainers on upstream fixes, broader safeguards for memory-transfer races, integrity checks, and recommendations for operators to use SGLang v0.5.22 or later.\u003c/p\u003e\n"},{"n":5,"title":"eMudhra, Brotli, and the Long Tail of a Security Fix","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/emudhra-brotli-security-fix?utm_medium=feed","time":"21:18","priority":"MAY READ","score":70,"tldr":"Fixing the eMudhra certificate compromise and Brotli flaw requires more than updating Node.js: vulnerable certificate trust paths and bundled decoders may persist across runtimes, applications, and compiled artifacts. Organizations need to inventory what actually shipped, rebuild affected software, and verify that the running application uses the corrected trust store or library.","briefOverview":"\u003cp\u003eThe article examines how the eMudhra certificate compromise and the Brotli decoding flaw created a much wider cleanup effort than a single Node.js update. Eight eMudhra intermediate certificate authority private keys were recoverable because they fit in eight bits, despite being intended as 384-bit keys. Chrome and Firefox distributed blocks for the affected certificates quickly, but other software could still trust them if it used a separate certificate store or verification path.\u003c/p\u003e\n\n\u003cp\u003eThe Brotli flaw, CVE-2026-111497, could corrupt memory when software decoded malicious compressed input, and affected copies appeared in Node.js, Bun, Python environments using Requests with Brotli support, and .NET. Updating a runtime or library does not necessarily fix compiled applications or bundled copies: Go applications require rebuilding with a patched toolchain, and Bun executables built with \u003ccode\u003ebun build --compile\u003c/code\u003e retain their own runtime until rebuilt. The article urges teams to track bundled components and certificate settings, maintain rebuild paths, use temporary mitigations where possible, and verify that the corrected code or certificate decision is actually present in deployed and running software.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["eMudhra disclosed that a flawed key-generation ceremony in April 2025 produced eight intermediate certificate authority private keys that fit within eight bits, making them easy to recover.","Chrome and Firefox distributed blocks for the compromised eMudhra intermediate certificates, but other applications may use different certificate stores or verification paths and still trust them.","Node.js patched both the eMudhra certificate issue and the Brotli decoding flaw, but updating Node.js does not fix separate bundled or compiled copies in other software.","The Brotli flaw, CVE-2026-111497, can corrupt memory when applications decode malicious compressed data and also affected software including Bun, Python Requests installations with Brotli support, and .NET.","Organizations should inventory bundled dependencies, rebuild affected artifacts, apply available mitigations, and verify that deployed applications are using corrected decoders and certificate verification settings."],"insights":["A compromised certificate can be blocked in a browser while a command-line tool on the same computer still accepts it because the two programs may use different certificate trust stores.","Installing a patched Go compiler does not change existing Go executables; applications must be rebuilt with the corrected toolchain to receive the verifier change.","A Bun executable created with `bun build --compile` contains its own runtime, so it remains affected until that executable is rebuilt even after Bun itself is updated.","The absence of certificates in Certificate Transparency logs did not prove the compromised eMudhra keys were unused, because some clients do not require that logging.","A security release being published does not mean the corrected component is running, since bundled copies may need replacement and shared libraries may require a service restart."],"referencedReports":[{"title":"October 2026 Security Releases","url":"https://nodejs.org/en/blog/vulnerability/october-2026-security-releases","publisher":"Node.js","context":"The article cites this Node.js security release as delivering fixes for both the eMudhra certificate issue and the Brotli flaw.","category":"advisory","primary":false},{"title":"Certificate Security Incident","url":"https://emudhra.com/en/post/certificate-security-incident","publisher":"eMudhra","context":"The article cites eMudhra’s incident statement about the flawed April 2025 key-generation ceremony.","category":"advisory","primary":false},{"title":"Eight Bits of Trust: eMudhra’s CA Keys Cracked in Milliseconds","url":"https://scotthelme.co.uk/eight-bits-of-trust-emudhras-ca-keys-cracked-in-milliseconds/","publisher":"Scott Helme","context":"The article references this technical analysis of the weak eMudhra intermediate certificate keys.","category":"research","primary":false},{"title":"Protecting Firefox Users Following the Compromise of eMudhra Intermediate Certificates","url":"https://blog.mozilla.org/security/2026/10/20/protecting-firefox-users-following-the-compromise-of-emudhra-intermediate-certificates/","publisher":"Mozilla","context":"The article cites Mozilla’s account of distributing a OneCRL certificate block to Firefox users.","category":"advisory","primary":false},{"title":"Brotli v1.2.1","url":"https://github.com/google/brotli/releases/tag/v1.2.1","publisher":"Google","context":"The article cites the Brotli release advisory for CVE-2026-111497, a memory-corruption flaw in malicious compressed-data decoding.","category":"advisory","primary":false},{"title":"GHSA-663w-cv8g-jj2p","url":"https://github.com/oven-sh/bun/security/advisories/GHSA-663w-cv8g-jj2p","publisher":"Oven","context":"The article cites Bun’s security advisory describing its update to the affected Brotli library in Bun 1.4.4.","category":"advisory","primary":false},{"title":"GHSA-p3jp-9v83-76w9","url":"https://github.com/dotnet/runtime/security/advisories/GHSA-p3jp-9v83-76w9","publisher":"Microsoft","context":"The article cites Microsoft’s .NET advisory for applications that decode untrusted Brotli data.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe article examines how the eMudhra certificate compromise and the Brotli decoding flaw created a much wider cleanup effort than a single Node.js update. Eight eMudhra intermediate certificate authority private keys were recoverable because they fit in eight bits, despite being intended as 384-bit keys. Chrome and Firefox distributed blocks for the affected certificates quickly, but other software could still trust them if it used a separate certificate store or verification path.\u003c/p\u003e\n\n\u003cp\u003eThe Brotli flaw, CVE-2026-111497, could corrupt memory when software decoded malicious compressed input, and affected copies appeared in Node.js, Bun, Python environments using Requests with Brotli support, and .NET. Updating a runtime or library does not necessarily fix compiled applications or bundled copies: Go applications require rebuilding with a patched toolchain, and Bun executables built with \u003ccode\u003ebun build --compile\u003c/code\u003e retain their own runtime until rebuilt. The article urges teams to track bundled components and certificate settings, maintain rebuild paths, use temporary mitigations where possible, and verify that the corrected code or certificate decision is actually present in deployed and running software.\u003c/p\u003e\n"},{"n":4,"title":"Discover and remediate PHP2Shell exposure with Tenable","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/discover-and-remediate-php2shell-exposure-with-tenable","time":"19:48","priority":"MAY READ","score":55,"tldr":"Tenable urges organizations to rapidly identify and patch PHP2Shell flaws CVE-2026-109618 and CVE-2026-109619, using its attack-surface, vulnerability, web-app, cloud, and patch-management tools to locate affected PHP deployments and validate remediation.","briefOverview":"\u003cp\u003eThe article describes how organizations can use Tenable products to identify and remediate PHP2Shell vulnerabilities, CVE-2026-109618 and CVE-2026-109619. It states that PHP runs on more than 70% of websites and that many sites use unsupported legacy PHP branches, creating urgency to locate affected systems and update to fixed versions. Tenable presents the flaws as a race against attackers seeking to target exposed systems.\u003c/p\u003e\n\n\u003cp\u003eTenable One Attack Surface Management can identify externally facing PHP assets, including forgotten or shadow IT, while Tenable One Vulnerability Management and Tenable Security Center offer detections and local checks for Linux PHP packages. Tenable One Web App Scanning can inspect web applications for PHP versions and associated vulnerabilities, and Tenable One Cloud Exposure can identify affected cloud virtual machines, images, and container images. Tenable Patch Management can correlate findings with patches, initiate patch workflows, and use post-scan checks to validate that remediation closed the exposure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The PHP2Shell vulnerabilities CVE-2026-109618 and CVE-2026-109619 require organizations to identify affected PHP deployments and update them to fixed versions.","Tenable One Attack Surface Management can discover externally facing PHP assets, including forgotten, rogue, or shadow IT assets, and can alert teams to new PHP deployments or end-of-life installations.","Tenable One Vulnerability Management and Tenable Security Center provide PHP detections, including local checks for PHP packages from Linux distributions, and support targeted scans and remediation tracking.","Tenable One Web App Scanning can assess web applications and APIs for PHP2Shell by inspecting components, HTTP headers, server signatures, and cookies for PHP versions and associated vulnerabilities.","Tenable Patch Management can match exposure findings to required patches, launch patch workflows, and validate that exposures are closed through post-scan checks."],"insights":["External attack-surface discovery can uncover PHP deployments that may not be in an organization’s known inventory by using public information such as DNS records, IP ranges, ASN data, WHOIS registrations, and neighboring IP ranges.","For urgent PHP2Shell investigations, enabling thorough testing and paranoia mode can help detect software across all system drives and deep component-level issues that default scan settings might miss.","Web application scans do not require a custom policy for PHP2Shell if all plugin groups are selected, but they depend on known web targets, making attack-surface-management findings useful for expanding scan coverage.","Cloud Exposure can track PHP2Shell across virtual machines, virtual machine images, and container images from a single Emerging Threats view, while saved Explorer queries can also power policies, dashboards, reports, and automated notifications.","Tenable Hexa AI can turn natural-language requests into operational actions, including identifying affected assets, creating an exposure initiative with service-level agreements, and generating remediation tickets."],"referencedReports":[],"body":"\u003cp\u003eThe article describes how organizations can use Tenable products to identify and remediate PHP2Shell vulnerabilities, CVE-2026-109618 and CVE-2026-109619. It states that PHP runs on more than 70% of websites and that many sites use unsupported legacy PHP branches, creating urgency to locate affected systems and update to fixed versions. Tenable presents the flaws as a race against attackers seeking to target exposed systems.\u003c/p\u003e\n\n\u003cp\u003eTenable One Attack Surface Management can identify externally facing PHP assets, including forgotten or shadow IT, while Tenable One Vulnerability Management and Tenable Security Center offer detections and local checks for Linux PHP packages. Tenable One Web App Scanning can inspect web applications for PHP versions and associated vulnerabilities, and Tenable One Cloud Exposure can identify affected cloud virtual machines, images, and container images. Tenable Patch Management can correlate findings with patches, initiate patch workflows, and use post-scan checks to validate that remediation closed the exposure.\u003c/p\u003e\n"},{"n":2,"title":"Authorization Differential Testing in Salesforce","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/authorization-differential-testing-in-salesforce/","time":"19:17","priority":"MAY READ","score":52,"tldr":"Salesforce authorization should be tested by sending the same request through UI API, GraphQL, and custom Apex, since custom Apex can enforce permissions differently and expose data withheld by native APIs. Review Apex sharing declarations, class API versions, and explicit database access modes—especially for Experience Cloud guest-accessible methods.","briefOverview":"\u003cp\u003eThe article presents Authorization Differential Testing, a method for comparing the same Salesforce request for the same user, record, and field across UI API, GraphQL, custom Apex, and other paths exposed by an application. It highlights a case where a restricted Experience Cloud user cannot see the \u003ccode\u003eAnnualRevenue\u003c/code\u003e field through UI API or GraphQL, but receives it from a custom \u003ccode\u003e@AuraEnabled\u003c/code\u003e Apex method. The difference can occur because Salesforce applies record sharing, object permissions, field-level security, Apex class access, and database execution modes at different stages. Teams should investigate any path that returns data or permits changes that another path denies.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that \u003ccode\u003ewith sharing\u003c/code\u003e enforces record-level sharing but does not independently enforce object permissions or field-level security for system-mode Apex database operations. Apex classes compiled at API version 66 or earlier default to system-mode database operations unless user mode is selected, while classes compiled at version 67 or later default to user mode. It also warns that disabling guest access to native APIs or migrating from Aura to LWR does not automatically secure reachable custom Apex methods. Administrators and developers should test restricted users and Experience Cloud guests separately, document Apex API versions and access modes, and repeat tests after permission, framework, or API-version changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Authorization Differential Testing compares the same operation for the same user, record, and field across UI API, GraphQL, custom Apex, and other application paths to identify inconsistent access decisions.","Salesforce UI API and its GraphQL API enforce the caller’s object permissions, field-level security, and record-sharing access, while custom Apex requires separate review of its authorization behavior.","Apex classes using `with sharing` enforce record-level sharing but do not, by themselves, enforce object permissions or field-level security for system-mode database operations.","Apex database operations in classes compiled at API version 66 or earlier default to system mode unless user mode is selected, whereas classes compiled at API version 67 or later default to user mode.","Experience Cloud guest access to native APIs and to custom Apex methods should be tested separately because guest users may reach different authorization checks through each path."],"insights":["Two nearly identical Apex controllers can make different authorization decisions solely because one is compiled at API version 66 or earlier and the other at version 67 or later, so an organization can have mixed access behavior at the same time.","Removing an old Aura route during an LWR migration or disabling guest access to native public APIs does not automatically secure custom Apex methods that remain reachable by a guest user.","A class name found in a JavaScript file does not prove that a guest can invoke the class; Salesforce’s server-side Apex class access check determines whether the call is allowed.","When an operation should return only the fields a caller may access rather than fail entirely, the article recommends using `Security.stripInaccessible()` to sanitize the returned records."],"referencedReports":[],"body":"\u003cp\u003eThe article presents Authorization Differential Testing, a method for comparing the same Salesforce request for the same user, record, and field across UI API, GraphQL, custom Apex, and other paths exposed by an application. It highlights a case where a restricted Experience Cloud user cannot see the \u003ccode\u003eAnnualRevenue\u003c/code\u003e field through UI API or GraphQL, but receives it from a custom \u003ccode\u003e@AuraEnabled\u003c/code\u003e Apex method. The difference can occur because Salesforce applies record sharing, object permissions, field-level security, Apex class access, and database execution modes at different stages. Teams should investigate any path that returns data or permits changes that another path denies.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that \u003ccode\u003ewith sharing\u003c/code\u003e enforces record-level sharing but does not independently enforce object permissions or field-level security for system-mode Apex database operations. Apex classes compiled at API version 66 or earlier default to system-mode database operations unless user mode is selected, while classes compiled at version 67 or later default to user mode. It also warns that disabling guest access to native APIs or migrating from Aura to LWR does not automatically secure reachable custom Apex methods. Administrators and developers should test restricted users and Experience Cloud guests separately, document Apex API versions and access modes, and repeat tests after permission, framework, or API-version changes.\u003c/p\u003e\n"},{"n":6,"title":"Socket Threat Intel Now Shows Which Malware Campaigns Were Blocked or Detected","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/threat-intel-campaign-impact?utm_medium=feed","time":"22:14","priority":"MAY READ","score":36,"tldr":"Socket Threat Intel now shows whether malware campaigns were blocked, detected, or not seen in an organization, with links to the relevant repository scans and Firewall events. The Org Impact view lets teams trace affected package versions to specific repositories, branches, and evidence.","briefOverview":"\u003cp\u003eSocket Threat Intel now displays a real-time status for each malware campaign on its Threat Intel → Campaigns page: Blocked by Socket, Detected in Firewall/SCA, or Not Detected. The summaries use immutable full repository scans, pull-request diff scans, and Socket Firewall event traffic. This gives organizations visibility into both malicious packages found in their code and campaigns that Socket blocked.\u003c/p\u003e\n\n\u003cp\u003eA campaign’s Org Impact tab lists each campaign package found in an organization, including the repositories and branches where it appeared and the first and last dates it was seen. Those dates link directly to the associated scan report or matching Socket Firewall events. For campaigns involving multiple packages, each package version has its own status and dates, and users can also view related Socket blogs and the full affected-package list.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket Threat Intel’s Campaigns page now provides each organization with a real-time campaign status of Blocked by Socket, Detected in Firewall/SCA, or Not Detected.","Campaign summaries draw on immutable repository scans, pull-request diff scans, and Socket Firewall event traffic.","The Org Impact tab lists campaign packages found in an organization, including the repositories and branches containing them and their first and last observed dates.","Date links in Org Impact open the associated scan report or matching Socket Firewall events.","For campaigns involving multiple packages, Org Impact displays each package and version separately with its own status and first and last seen dates."],"insights":["The campaign view distinguishes software that entered an organization’s code from malicious package installation attempts that Socket blocked, giving teams visibility into both exposure and prevention outcomes.","Links from first- and last-seen dates to individual scan reports or Firewall events create an evidence trail for investigating a campaign rather than requiring teams to search for supporting records separately.","Multi-package campaigns can be assessed at the individual package-version level, which helps identify exactly which malicious versions were encountered or blocked."],"referencedReports":[],"body":"\u003cp\u003eSocket Threat Intel now displays a real-time status for each malware campaign on its Threat Intel → Campaigns page: Blocked by Socket, Detected in Firewall/SCA, or Not Detected. The summaries use immutable full repository scans, pull-request diff scans, and Socket Firewall event traffic. This gives organizations visibility into both malicious packages found in their code and campaigns that Socket blocked.\u003c/p\u003e\n\n\u003cp\u003eA campaign’s Org Impact tab lists each campaign package found in an organization, including the repositories and branches where it appeared and the first and last dates it was seen. Those dates link directly to the associated scan report or matching Socket Firewall events. For campaigns involving multiple packages, each package version has its own status and dates, and users can also view related Socket blogs and the full affected-package list.\u003c/p\u003e\n"},{"n":1,"title":"Varonis' Takeaways from Forrester’s 2026 Email, Messaging, and Collaboration Security Solutions Landscape Report","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/forrester-email-security-solutions-landscape-report-2026","time":"19:14","priority":"MAY READ","score":35,"tldr":"Varonis highlights Forrester’s 2026 email, messaging, and collaboration security landscape, arguing that AI-driven social engineering increasingly crosses channels and exploits trusted communications. The company promotes Varonis Interceptor as a zero-trust defense that analyzes and blocks malicious links before users or AI agents interact with them.","briefOverview":"\u003cp\u003eForrester published \u003cem\u003eThe Email, Messaging, And Collaboration Security Solutions Landscape, Q4 2026\u003c/em\u003e on October 23, and its overview includes Varonis Interceptor among 26 notable vendors. The article presents the report as arriving during a shift in which email, messaging, and collaboration security are converging. It argues that AI is making social-engineering messages more convincing and harder to distinguish from ordinary business communications.\u003c/p\u003e\n\n\u003cp\u003eThe article says attackers can use AI to tailor phishing campaigns at scale, while AI agents may read emails, open links and files, and carry out requests for employees. It also says a scam may begin in email and continue through chat, shared files, browser tabs, personal accounts, web traffic, or social platforms. Because malicious intent can hide in messages that appear to come from trusted colleagues, vendors, or ongoing threads, the article argues that defenses should assess the message, sender-recipient relationship, and the actual behavior and destination of links and attachments.\u003c/p\u003e\n\n\u003cp\u003eVaronis states that Interceptor provides zero-trust social-engineering defense across multiple channels. According to the article, it tests every message in a sandbox before users or agents interact with it and blocks phishing links originating in email, collaboration tools, search, ads, and social media. The full Forrester market overview is available to Forrester subscribers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Forrester published The Email, Messaging, And Collaboration Security Solutions Landscape, Q4 2026 on October 23, and it includes Varonis Interceptor among 26 notable vendors.","The article says attackers use AI to tailor phishing campaigns at scale, while AI agents increasingly read emails, open links and files, and carry out requests for employees.","The article states that social-engineering campaigns can move from email into chat threads, shared files, browser tabs, personal accounts, web traffic, and social platforms.","Forrester identifies the primary challenge as malicious intent hiding inside legitimate communications, including messages from real colleague mailboxes, familiar vendors, or existing message threads.","Varonis says Interceptor tests every message in a sandbox before users or agents interact with it and blocks phishing links from email, collaboration tools, search, ads, and social media."],"insights":["The article frames AI agents as part of the attack target because they may independently read messages, open files and links, or act on requests, so protections must account for both human and automated recipients.","Traditional trust signals such as a familiar sender, domain, or ongoing message thread can now be used by attackers rather than serving as reliable indicators of safety.","The article argues that the most important security gap is often between separate communication and web channels, because attackers can continue the same scam across email, chat, shared files, search results, ads, and social media.","It emphasizes evaluating what a message, link, or attachment actually does and where it leads, rather than relying only on whether it appears legitimate."],"referencedReports":[{"title":"The Email, Messaging, And Collaboration Security Solutions Landscape, Q4 2026","url":"https://www.forrester.com/report/the-email-messaging-and-collaboration-security-solutions-landscape-q4-2026/RES200000216","publisher":"Forrester Research, Inc.","context":"The article discusses Forrester’s market landscape report, which lists Varonis Interceptor among 26 notable vendors and informs the article’s discussion of AI-driven social engineering and cross-channel protection.","category":"research","primary":true}],"body":"\u003cp\u003eForrester published \u003cem\u003eThe Email, Messaging, And Collaboration Security Solutions Landscape, Q4 2026\u003c/em\u003e on October 23, and its overview includes Varonis Interceptor among 26 notable vendors. The article presents the report as arriving during a shift in which email, messaging, and collaboration security are converging. It argues that AI is making social-engineering messages more convincing and harder to distinguish from ordinary business communications.\u003c/p\u003e\n\n\u003cp\u003eThe article says attackers can use AI to tailor phishing campaigns at scale, while AI agents may read emails, open links and files, and carry out requests for employees. It also says a scam may begin in email and continue through chat, shared files, browser tabs, personal accounts, web traffic, or social platforms. Because malicious intent can hide in messages that appear to come from trusted colleagues, vendors, or ongoing threads, the article argues that defenses should assess the message, sender-recipient relationship, and the actual behavior and destination of links and attachments.\u003c/p\u003e\n\n\u003cp\u003eVaronis states that Interceptor provides zero-trust social-engineering defense across multiple channels. According to the article, it tests every message in a sandbox before users or agents interact with it and blocks phishing links originating in email, collaboration tools, search, ads, and social media. The full Forrester market overview is available to Forrester subscribers.\u003c/p\u003e\n"}]</script>
