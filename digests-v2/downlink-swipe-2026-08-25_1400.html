<script type="application/json" id="dl-articles">[{"n":1,"title":"Drive-By Agent Hijacking: One Website Visit, Persistent Model Poisoning","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/nemoclaw-one-website-visit-to-hijack-your-ai-agent","time":"15:39","priority":"SHOULD READ","score":86,"tldr":"A NemoClaw configuration that exposes Ollama on 0.0.0.0 lets a malicious website use DNS rebinding to gain unauthenticated access to the local model server. An attacker can then persistently poison the model’s chat template, silently steering the victim’s AI agent even when it supplies its own system prompt.","briefOverview":"\u003cp\u003eA vulnerability in NVIDIA NemoClaw, identified in the article as CVE-2026-65105, can let an attacker gain full, unauthenticated control over the local Ollama model server used by the OpenClaw AI agent. The attack can begin with a single visit to an attacker-controlled webpage. Oasis Security found the issue during research into non-human identity and AI agent risks and reported the findings to NVIDIA through its Product Security Incident Response Team before publication.\u003c/p\u003e\n\n\u003cp\u003eNemoClaw configures Ollama with OLLAMA_HOST=0.0.0.0:11434 so OpenShell Docker containers can reach the host’s local inference service. That binding exposes Ollama on every network interface and causes Ollama’s Host header validation to be skipped, leaving only CORS protections. The article explains that DNS rebinding can bypass those remaining protections by making browser requests to the attacker’s domain reach the victim’s local Ollama API while still appearing same-origin.\u003c/p\u003e\n\n\u003cp\u003eOnce the attacker has access to Ollama’s API, they can run inference on the victim’s hardware, enumerate models and system details, delete or pull models, and modify model configurations. The article highlights model template poisoning as the most impactful payload, because changing the model’s chat template can append attacker-controlled instructions to future conversations even when the OpenClaw agent sends its own system prompt. The poisoned template persists across future interactions, affects all consumers of the model, and could steer an agent that has access to organizational resources such as source control systems, CI/CD pipelines, internal APIs, cloud services, communication platforms, and MCP servers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A vulnerability in NVIDIA NemoClaw can let an attacker gain full, unauthenticated control over the local Ollama model server after the victim visits an attacker-controlled webpage.","NemoClaw starts Ollama with OLLAMA_HOST=0.0.0.0:11434 so OpenShell containers can reach it, which exposes the unauthenticated Ollama API beyond localhost and disables Ollama’s Host header validation.","The attack uses DNS rebinding so browser requests to the attacker’s domain are redirected to the victim’s local Ollama instance while still passing Ollama’s remaining CORS checks.","With access to the Ollama API, an attacker can run inference on the victim’s hardware, enumerate installed models and system details, delete or pull models, and modify model configurations.","The researchers found that poisoning the model’s chat template through Ollama’s /api/create endpoint can persistently append attacker-controlled instructions to future agent interactions, even when the OpenClaw agent sends its own system prompt."],"insights":["The installation message says NemoClaw is using Ollama on localhost:11434, but the actual binding is 0.0.0.0, which can give users a misleading impression that the service is only reachable locally.","Ollama’s Host header protection is specifically disabled when the service is bound to a non-loopback address, so NemoClaw’s container-reachability choice removes a defense designed to stop browser-based local service access.","Poisoning the model’s system field is less effective against OpenClaw because the agent supplies its own system prompt, but poisoning the model template works because it changes how all future messages are rendered before the model sees them.","The poisoned template can preserve the model’s original formatting and tool-rendering behavior while adding hidden instructions, making the compromise harder to notice through normal model use.","OpenShell sandboxing may protect the host endpoint, but the article emphasizes that the practical blast radius comes from the AI agent’s authorized access to organizational resources such as source control, CI/CD pipelines, internal APIs, cloud services, and MCP servers."],"referencedReports":[],"body":"\u003cp\u003eA vulnerability in NVIDIA NemoClaw, identified in the article as CVE-2026-65105, can let an attacker gain full, unauthenticated control over the local Ollama model server used by the OpenClaw AI agent. The attack can begin with a single visit to an attacker-controlled webpage. Oasis Security found the issue during research into non-human identity and AI agent risks and reported the findings to NVIDIA through its Product Security Incident Response Team before publication.\u003c/p\u003e\n\n\u003cp\u003eNemoClaw configures Ollama with OLLAMA_HOST=0.0.0.0:11434 so OpenShell Docker containers can reach the host’s local inference service. That binding exposes Ollama on every network interface and causes Ollama’s Host header validation to be skipped, leaving only CORS protections. The article explains that DNS rebinding can bypass those remaining protections by making browser requests to the attacker’s domain reach the victim’s local Ollama API while still appearing same-origin.\u003c/p\u003e\n\n\u003cp\u003eOnce the attacker has access to Ollama’s API, they can run inference on the victim’s hardware, enumerate models and system details, delete or pull models, and modify model configurations. The article highlights model template poisoning as the most impactful payload, because changing the model’s chat template can append attacker-controlled instructions to future conversations even when the OpenClaw agent sends its own system prompt. The poisoned template persists across future interactions, affects all consumers of the model, and could steer an agent that has access to organizational resources such as source control systems, CI/CD pipelines, internal APIs, cloud services, communication platforms, and MCP servers.\u003c/p\u003e\n"}]</script>
