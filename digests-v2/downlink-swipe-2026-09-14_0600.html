<script type="application/json" id="dl-articles">[{"n":3,"title":"CISA: Hackers now exploit max severity GitLab flaw in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-hackers-now-exploit-max-severity-gitlab-flaw-in-attacks/","time":"07:06","priority":"MUST READ","score":98,"tldr":"CISA says attackers are actively exploiting CVE-2026-85706, a maximum-severity GitLab path traversal flaw that allows unauthenticated reading of sensitive files. Organizations should immediately upgrade GitLab CE/EE to versions 19.3.2, 19.2.6, or 19.1 and review logs for suspicious repository commits API requests.","briefOverview":"\u003cp\u003eCISA has warned that attackers are actively exploiting CVE-2026-85706, a maximum-severity GitLab flaw, and added it to its Known Exploited Vulnerabilities catalog. The issue affects GitLab’s repository commits API because authentication is not properly enforced and file paths are not properly restricted. Unauthenticated attackers can use it to read credentials, secrets, and other sensitive information from vulnerable GitLab servers.\u003c/p\u003e\n\n\u003cp\u003eGitLab released fixes for Community Edition and Enterprise Edition in versions 19.3.2, 19.2.6, and 19.1, urging users to patch immediately. watchTowr reported seeing internet-wide probes for unpatched systems one day after the fixes were released and said the flaw can allow arbitrary file reads through a single HTTP request. It advised reviewing logs for HTTP POST requests to repository commits API URLs containing \u003ccode\u003efile.path\u003c/code\u003e parameters, while CISA gave U.S. federal agencies three days to secure affected systems and encouraged all organizations to prioritize remediation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-85706 to its Known Exploited Vulnerabilities catalog after hackers began exploiting the maximum-severity GitLab flaw.","The flaw affects GitLab's repository commits API and can let unauthenticated attackers read credentials, secrets, and other sensitive files from vulnerable servers.","GitLab fixed the issue in Community and Enterprise Edition versions 19.3.2, 19.2.6, and 19.1, and urged users to patch immediately.","watchTowr reported observing internet-wide probes for unpatched GitLab servers and advised defenders to review logs for suspicious POST requests to repository commits API URLs containing file.path parameters.","CISA gave U.S. federal agencies three days to secure affected systems under Binding Operational Directive 26-04 and encouraged all organizations to prioritize remediation."],"insights":["Attackers can reportedly use CVE-2026-85706 to read arbitrary files with a single HTTP request, making exposed secrets and credentials particularly urgent to protect.","Internet-wide probing was observed one day after GitLab released fixes, showing that defenders may have little time between public disclosure and attempted compromise.","A practical investigation clue is to look for HTTP POST requests to repository commits API addresses that include a file.path parameter.","CISA has listed four GitLab flaws as actively exploited since November 2021, including two added in February of the same year."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/11/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites CISA's alert announcing that CVE-2026-85706 was added to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Patch Release: GitLab 19.3.2, 19.2.6, and 19.1","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/#cve-2026-85706---path-traversal-issue-in-repository-commits-api-impacts-gitlab-ceee","publisher":"gitlab","context":"The article links GitLab's patch-release advisory describing CVE-2026-85706 and the fixed GitLab CE and EE versions.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has warned that attackers are actively exploiting CVE-2026-85706, a maximum-severity GitLab flaw, and added it to its Known Exploited Vulnerabilities catalog. The issue affects GitLab’s repository commits API because authentication is not properly enforced and file paths are not properly restricted. Unauthenticated attackers can use it to read credentials, secrets, and other sensitive information from vulnerable GitLab servers.\u003c/p\u003e\n\n\u003cp\u003eGitLab released fixes for Community Edition and Enterprise Edition in versions 19.3.2, 19.2.6, and 19.1, urging users to patch immediately. watchTowr reported seeing internet-wide probes for unpatched systems one day after the fixes were released and said the flaw can allow arbitrary file reads through a single HTTP request. It advised reviewing logs for HTTP POST requests to repository commits API URLs containing \u003ccode\u003efile.path\u003c/code\u003e parameters, while CISA gave U.S. federal agencies three days to secure affected systems and encouraged all organizations to prioritize remediation.\u003c/p\u003e\n"},{"n":8,"title":"Emerging Threat: (CVE-2026-78006) The Events Calendar Remote Code Execution via PHP Object Injection","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-78006-the-events-calendar-remote-code-execution-via-php-object-injection/","time":"09:38","priority":"MUST READ","score":92,"tldr":"CVE-2026-78006 is a critical pre-authentication remote code execution flaw in The Events Calendar WordPress plugin affecting versions through 6.17.4, exploitable through comments enabled on event pages. Update to version 6.17.4.1 immediately and disable or restrict event comments until patching is verified.","briefOverview":"\u003cp\u003eCVE-2026-78006 is a critical vulnerability in StellarWP’s The Events Calendar WordPress plugin that can allow an unauthenticated attacker to run code on the affected server. The flaw affects all versions through 6.17.4 and has a CVSS v3.1 score of 9.8. It can be delivered through malicious comment content submitted to an event page, without an account, credentials, or administrator interaction.\u003c/p\u003e\n\n\u003cp\u003eThe unauthenticated delivery path requires comments to be enabled and visible on event pages, so disabling comments for the events post type or requiring commenters to log in removes that route. Publicly exposed calendar sites may include secondary, regional, agency-managed, acquired, staging, and pre-production WordPress properties that are outside central IT patching processes. StellarWP released version 6.17.4.1 on September 10, 2026, and organizations should verify the full installed version, disable or restrict event comments until patched, and inventory public WordPress assets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-78006 is a critical PHP object injection flaw in StellarWP’s The Events Calendar WordPress plugin that can allow remote code execution on the underlying host.","The flaw can be exploited without an account or administrator interaction by submitting malicious comment content to an event page, provided comments are enabled and visible.","All The Events Calendar versions through 6.17.4 are affected, while version 6.17.4.1, released on September 10, 2026, fixes the issue.","Organizations should inventory public WordPress sites, including agency-managed, acquired, staging, and pre-production properties, because calendar sites are often outside central IT patching processes.","Until patching is confirmed, organizations should disable event comments where unnecessary or require commenters to authenticate."],"insights":["The comment-moderation link lets a commenter immediately render their own pending comment, so the malicious content can run before any moderator reviews or approves it.","Checking only major and minor plugin versions is insufficient because 6.17.4 is vulnerable while the fixed release is 6.17.4.1.","The observed asset set was identified mainly through service fingerprints rather than confirmed vulnerable-version detection, so it represents potentially exposed sites rather than confirmed exploitable targets.","The article characterizes the core exposure problem as an ownership and asset-discovery issue, since vulnerable calendar sites may be agency-managed, acquired, staging, or unrelated in name to the parent organization."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-78006 is a critical vulnerability in StellarWP’s The Events Calendar WordPress plugin that can allow an unauthenticated attacker to run code on the affected server. The flaw affects all versions through 6.17.4 and has a CVSS v3.1 score of 9.8. It can be delivered through malicious comment content submitted to an event page, without an account, credentials, or administrator interaction.\u003c/p\u003e\n\n\u003cp\u003eThe unauthenticated delivery path requires comments to be enabled and visible on event pages, so disabling comments for the events post type or requiring commenters to log in removes that route. Publicly exposed calendar sites may include secondary, regional, agency-managed, acquired, staging, and pre-production WordPress properties that are outside central IT patching processes. StellarWP released version 6.17.4.1 on September 10, 2026, and organizations should verify the full installed version, disable or restrict event comments until patched, and inventory public WordPress assets.\u003c/p\u003e\n"},{"n":4,"title":"Microsoft: September updates cause RDS failures on Windows Server","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-september-updates-cause-rds-failures-on-windows-server/","time":"09:50","priority":"SHOULD READ","score":84,"tldr":"Microsoft confirmed that September 2026 security updates can destabilize Remote Desktop Services on Windows Server 2012 and later, causing failed RDP connections, sign-in problems, and server hangs. Administrators can deploy Microsoft’s Known Issue Rollback Group Policy as a temporary mitigation while a permanent fix is developed.","briefOverview":"\u003cp\u003eMicrosoft has confirmed that September 2026 security updates can cause Remote Desktop Services (RDS) failures on Windows Server 2012 and later, as well as Windows 10 and Windows 11 devices. The issue follows widespread administrator reports that the updates prevented remote connections and, in some cases, required a hard reset to restore service. Microsoft says affected RDS environments can become unstable, with connection failures after several minutes, sign-in problems, and servers hanging at the Remote Desktop Configuration screen.\u003c/p\u003e\n\n\u003cp\u003eThe disruption can also affect Microsoft Management Console, RDS Licensing Diagnoser, File Explorer, and the Windows Update page, which may become unresponsive. Existing remote sessions may not disconnect or log off correctly, while new sessions can hang during connection attempts. Microsoft has released version-specific Known Issue Rollback Group Policy packages for enterprise-managed devices and is working on a permanent fix. Restarting an affected virtual machine may temporarily restore connectivity, while uninstalling the problematic updates may restore Remote Desktop functionality but removes that month’s security fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that September 2026 security updates can make Remote Desktop Services unstable on Windows Server 2012 and later, as well as Windows 10 and Windows 11 devices.","Affected systems may experience failed remote connections after several minutes, sign-in problems, servers hanging during remote-desktop configuration, and unresponsive management tools or Windows Update pages.","Existing remote sessions may fail to disconnect or log off properly, while new connection attempts can hang and fail.","Microsoft has released version-specific Group Policy Known Issue Rollback packages to mitigate the issue on enterprise-managed devices.","Restarting an affected virtual machine may temporarily restore remote access, while uninstalling the problematic updates can restore functionality but removes that month’s security fixes."],"insights":["The problem extends beyond remote connections: Microsoft says MMC, RDS Licensing Diagnoser, File Explorer, and the Windows Update page can also become unresponsive on affected systems.","Microsoft’s mitigation is delivered as separate Known Issue Rollback Group Policy packages for specific Windows and Windows Server versions, so administrators need to select the package matching their environment.","Uninstalling the affected updates can restore Remote Desktop functionality, but it also removes the security fixes delivered in the same month’s Patch Tuesday release.","For virtual machines that cannot be reached through remote desktop, stopping and restarting the affected virtual machine may temporarily restore access."],"referencedReports":[{"title":"Remote Desktop Services might stop responding after September 2026 security update","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-25h2#remote-desktop-services-might-stop-responding-after-sept--2026-security-update","publisher":"microsoft","context":"Microsoft's release health update confirms the Remote Desktop Services issue and describes the affected systems and symptoms.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft has confirmed that September 2026 security updates can cause Remote Desktop Services (RDS) failures on Windows Server 2012 and later, as well as Windows 10 and Windows 11 devices. The issue follows widespread administrator reports that the updates prevented remote connections and, in some cases, required a hard reset to restore service. Microsoft says affected RDS environments can become unstable, with connection failures after several minutes, sign-in problems, and servers hanging at the Remote Desktop Configuration screen.\u003c/p\u003e\n\n\u003cp\u003eThe disruption can also affect Microsoft Management Console, RDS Licensing Diagnoser, File Explorer, and the Windows Update page, which may become unresponsive. Existing remote sessions may not disconnect or log off correctly, while new sessions can hang during connection attempts. Microsoft has released version-specific Known Issue Rollback Group Policy packages for enterprise-managed devices and is working on a permanent fix. Restarting an affected virtual machine may temporarily restore connectivity, while uninstalling the problematic updates may restore Remote Desktop functionality but removes that month’s security fixes.\u003c/p\u003e\n"},{"n":5,"title":"Malicious Twitch Browser Extension Leaks OAuth Tokens From Nearly 31,000 Users","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/malicious-twitch-browser-extension.html","time":"07:24","priority":"SHOULD READ","score":84,"tldr":"The Twitch Enhanced Viewer | JeetBot browser extension exposed OAuth session tokens from nearly 31,000 Chrome and Firefox users by sending them to operator-controlled proxy servers, potentially enabling account actions such as reading whispers, chatting, and spending channel points. Users should disable or update the extension immediately and revoke affected Twitch sessions, since updating does not invalidate tokens already transmitted.","briefOverview":"\u003cp\u003eA malicious browser extension named Twitch Enhanced Viewer | JeetBot leaked Twitch OAuth tokens associated with nearly 31,000 users across Chrome and Firefox. The extension was listed on the Chrome Web Store with about 30,000 users and on Firefox Add-Ons with 604 users. It presented itself as a tool for improved Twitch viewing, including 1080p streams in restricted regions and an ad-free experience.\u003c/p\u003e\n\n\u003cp\u003eAccording to Socket researcher Kush Pandya, current v85.x builds routed Twitch video-playlist requests through operator-controlled proxy servers and included users’ tokens in an \u003ccode\u003eauth\u003c/code\u003e URL parameter. This caused the tokens to be written in cleartext to proxy request logs, although a hard-coded list of 10 Twitch channels was exempt from forwarding. A holder of a live Twitch OAuth session token can act on an account without the password or second factor, including reading and sending whispers, posting chat messages, and spending channel points.\u003c/p\u003e\n\n\u003cp\u003eJeetBot’s documentation says Firefox version 85.8.7 changes the playlist process so that OAuth tokens are no longer sent to its proxies, while an equivalent Chrome release was under review. Users with older versions were told to update or temporarily disable the extension to stop further transmission. The developer also warned that disabling or updating it does not revoke tokens that had already been sent.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Twitch Enhanced Viewer | JeetBot extension on the Chrome Web Store and Firefox Add-Ons store exposed OAuth tokens associated with nearly 31,000 users by forwarding them to operator-controlled proxy servers.","The extension sent users' Twitch tokens as an auth query parameter when routing video-playlist requests through its proxy infrastructure, causing the tokens to be recorded in proxy request logs in cleartext.","A Twitch OAuth session token can allow its holder to act on an account without its password or second factor, including reading and sending whispers, posting in chat, and spending channel points.","The token-forwarding behavior excluded a hard-coded list of 10 Twitch channels, most of which are Russian-language streamers.","JeetBot's documentation says Firefox extension version 85.8.7 no longer sends users' Twitch OAuth tokens to its proxies, but tokens transmitted by older versions are not revoked by updating or disabling the extension."],"insights":["The extension’s token forwarding was selectively disabled for 10 hard-coded channels, while viewers of other channels had their live session tokens sent through the operator’s proxy infrastructure.","Sending tokens in a URL parameter meant they could be stored in the proxy servers’ request logs as readable text rather than only being used temporarily to retrieve video playlists.","Users cannot eliminate the risk from tokens already sent merely by disabling or updating the extension, because the developer states that prior transmissions are not revoked.","The Chrome and Firefox store descriptions did not disclose that the extension routed authenticated Twitch sessions through operator-controlled servers, despite its broad Twitch host permissions.","Earlier version 4.x builds reportedly sent tokens directly to a dedicated set-token endpoint and used deno.dev and deno.net as backup destinations."],"referencedReports":[{"title":"Malicious Twitch Browser Extension Leaks OAuth Tokens From Nearly 31,000 Users","url":"https://socket.dev/blog/malicious-twitch-browser-extension","publisher":"socket","context":"The article relies on Socket researcher Kush Pandya's technical analysis of the JeetBot extension's OAuth-token forwarding behavior.","category":"research","primary":true}],"body":"\u003cp\u003eA malicious browser extension named Twitch Enhanced Viewer | JeetBot leaked Twitch OAuth tokens associated with nearly 31,000 users across Chrome and Firefox. The extension was listed on the Chrome Web Store with about 30,000 users and on Firefox Add-Ons with 604 users. It presented itself as a tool for improved Twitch viewing, including 1080p streams in restricted regions and an ad-free experience.\u003c/p\u003e\n\n\u003cp\u003eAccording to Socket researcher Kush Pandya, current v85.x builds routed Twitch video-playlist requests through operator-controlled proxy servers and included users’ tokens in an \u003ccode\u003eauth\u003c/code\u003e URL parameter. This caused the tokens to be written in cleartext to proxy request logs, although a hard-coded list of 10 Twitch channels was exempt from forwarding. A holder of a live Twitch OAuth session token can act on an account without the password or second factor, including reading and sending whispers, posting chat messages, and spending channel points.\u003c/p\u003e\n\n\u003cp\u003eJeetBot’s documentation says Firefox version 85.8.7 changes the playlist process so that OAuth tokens are no longer sent to its proxies, while an equivalent Chrome release was under review. Users with older versions were told to update or temporarily disable the extension to stop further transmission. The developer also warned that disabling or updating it does not revoke tokens that had already been sent.\u003c/p\u003e\n"},{"n":1,"title":"Revolut discloses data breach exposing financial info, passports","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/revolut-discloses-data-breach-exposing-financial-info-passports/","time":"08:48","priority":"SHOULD READ","score":82,"tldr":"Revolut disclosed that attackers impersonating a government agency used an unauthorized but domain-authenticated email account to obtain highly sensitive data from a limited number of customers, including identity documents, selfies, account statements, and transaction histories. The company says its systems and customer funds were not affected.","briefOverview":"\u003cp\u003eRevolut disclosed that it provided customer information to a threat actor who impersonated a government agency. The request was sent from an unauthorized email account using the agency’s official email domain and carried valid domain-authentication credentials. Revolut said it fulfilled the request because it reasonably believed it was authentic.\u003c/p\u003e\n\n\u003cp\u003eThe information shared included identity and contact details, copies of passports and/or driver’s licenses, facial verification images, account statements containing IBAN numbers, withdrawal records, and full transaction histories, including Bitcoin transactions. Revolut described the number of affected customers as very limited but did not provide an exact figure; ZachXBT said the incident appears to have targeted high-net-worth users. The company said its systems and customer funds were unaffected, and that it blocked the address and notified the relevant government agency, law enforcement, data-protection authorities, and financial regulators.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Revolut disclosed that it shared customer data with a threat actor who impersonated a government agency through an unauthorized email account using the agency’s official email domain.","The exposed data included identity and contact details, passport or driver’s license copies, facial verification images, account statements with IBAN numbers, withdrawal records, and complete transaction histories including Bitcoin transactions.","Revolut said the breach affected a very limited but undisclosed number of customers and that its systems and customer funds were unaffected.","Revolut said it blocked the email address after detecting the incident and notified the relevant government agency, law enforcement, data-protection authorities, and financial regulators.","Crypto fraud investigator ZachXBT said the incident appears to have targeted high-net-worth Revolut users."],"insights":["The fraudulent request was accepted because it appeared to originate from an official government domain and carried valid domain-authentication credentials, showing that those signals alone were treated as sufficient to support the request.","The records disclosed combined identity documents and facial verification images with account statements, withdrawal records, and full transaction histories, making the exposed information unusually broad across both identity and financial records.","Revolut characterized the affected group as very limited but did not disclose an exact number, despite serving more than 80 million customers worldwide.","This is Revolut’s second disclosed customer-data incident in four years, following a September 2022 breach that exposed data from 50,150 customers."],"referencedReports":[],"body":"\u003cp\u003eRevolut disclosed that it provided customer information to a threat actor who impersonated a government agency. The request was sent from an unauthorized email account using the agency’s official email domain and carried valid domain-authentication credentials. Revolut said it fulfilled the request because it reasonably believed it was authentic.\u003c/p\u003e\n\n\u003cp\u003eThe information shared included identity and contact details, copies of passports and/or driver’s licenses, facial verification images, account statements containing IBAN numbers, withdrawal records, and full transaction histories, including Bitcoin transactions. Revolut described the number of affected customers as very limited but did not provide an exact figure; ZachXBT said the incident appears to have targeted high-net-worth users. The company said its systems and customer funds were unaffected, and that it blocked the address and notified the relevant government agency, law enforcement, data-protection authorities, and financial regulators.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft: September updates break audio on some Windows PCs","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-september-updates-break-audio-on-some-windows-pcs/","time":"08:08","priority":"MAY READ","score":68,"tldr":"Microsoft confirmed that September 2026 Windows 11 security updates KB5124008 and KB5124012 can prevent some USB Audio Class 1.0 devices from starting or producing sound, particularly in multichannel modes. No official workaround is available yet, though switching affected devices to 2-channel audio may restore functionality.","briefOverview":"\u003cp\u003eMicrosoft confirmed that the September 2026 Windows security updates KB5124008 and KB5124012 can cause some USB Audio Class 1.0 devices to fail to start or produce audio. The known issue affects systems running Windows 11 version 24H2 or later. Affected users have reported Device Manager errors stating \u0026ldquo;This device cannot start (Code 10),\u0026rdquo; missing audio output, and unresponsive volume controls and sound settings.\u003c/p\u003e\n\n\u003cp\u003eSome affected USB speakers reportedly fail only when multichannel features, including 3D audio or 8-channel modes, are enabled. Microsoft has not issued an official workaround, although some users have restored sound by switching devices to 2-channel mode. The issue is another in a series of Windows 11 audio compatibility problems, following earlier issues involving USB audio drivers, Dirac audio software, Intel Smart Sound Technology drivers, Bluetooth audio devices, and USB DAC systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that the September 2026 Windows security updates KB5124008 and KB5124012 can cause some USB Audio Class 1.0 devices to fail to start or produce sound.","The issue affects only systems running Windows 11 version 24H2 or later and is limited to USB Audio Class 1.0 devices.","Affected users reported Device Manager Code 10 errors, no audio output, and unresponsive volume controls and sound settings.","Some impacted USB audio speakers fail only when multichannel features such as 3D audio or 8-channel modes are used.","Microsoft has not provided an official workaround, but some users restored audio by switching to 2-channel mode."],"insights":["The problem is narrowly limited to USB Audio Class 1.0 devices, rather than affecting all USB audio hardware on Windows 11.","For some affected speakers, the failure appears tied to multichannel functions such as 3D audio or 8-channel output, meaning basic 2-channel mode may avoid the issue.","Microsoft has documented the issue but has not yet supplied an official workaround, so affected users currently rely on a user-reported configuration change.","The incident follows several prior Windows 11 audio compatibility issues involving USB audio drivers, Dirac audio software, Intel Smart Sound Technology drivers, Bluetooth devices, and USB DAC systems."],"referencedReports":[{"title":"USB audio devices might fail to start or produce no sound","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-25h2#usb-audio-devices-might-fail-to-start-or-produce-no-sound","publisher":"microsoft","context":"Microsoft's Windows release health dashboard documents the known issue affecting USB Audio Class 1.0 devices after the September 2026 security update.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that the September 2026 Windows security updates KB5124008 and KB5124012 can cause some USB Audio Class 1.0 devices to fail to start or produce audio. The known issue affects systems running Windows 11 version 24H2 or later. Affected users have reported Device Manager errors stating \u0026ldquo;This device cannot start (Code 10),\u0026rdquo; missing audio output, and unresponsive volume controls and sound settings.\u003c/p\u003e\n\n\u003cp\u003eSome affected USB speakers reportedly fail only when multichannel features, including 3D audio or 8-channel modes, are enabled. Microsoft has not issued an official workaround, although some users have restored sound by switching devices to 2-channel mode. The issue is another in a series of Windows 11 audio compatibility problems, following earlier issues involving USB audio drivers, Dirac audio software, Intel Smart Sound Technology drivers, Bluetooth audio devices, and USB DAC systems.\u003c/p\u003e\n"},{"n":6,"title":"How the UK Cyber Security and Resilience Bill Extends to the Supply Chain","source":"radiflow.com","sourceColorIdx":2,"link":"https://www.radiflow.com/blog/how-the-uk-cyber-security-and-resilience-bill-extends-to-the-supply-chain/","time":"08:06","priority":"MAY READ","score":52,"tldr":"The UK Cyber Security and Resilience Bill could extend cyber-security obligations beyond critical infrastructure operators to their suppliers, through formal critical-supplier designations and tougher contractual requirements. Manufacturers and OT technology providers should prepare to demonstrate their product security posture and supply-chain risk management before customers demand it.","briefOverview":"\u003cp\u003eThe proposed UK Cyber Security and Resilience Bill directly regulates Operators of Essential Services, managed service providers, and data centre operators, but its effects may extend further through supply-chain provisions. It introduces a Designated Critical Supplier category that allows regulators to designate suppliers whose products or services are essential to maintaining an essential service. Designated suppliers would face obligations equivalent to those for Operators of Essential Services, including security standards, incident reporting, regulatory inspection, and turnover-based penalties.\u003c/p\u003e\n\n\u003cp\u003eThe Bill may also drive regulated organisations to impose security requirements on suppliers through contracts, procurement processes, due-diligence requests, and audit rights. Manufacturers and technology providers supplying energy, water, or other regulated sectors may therefore need to demonstrate their products\u0026rsquo; security posture, including known vulnerabilities, network behaviour, update mechanisms, and required access. The article says commercial pressure from customers is likely to affect more organisations and arrive sooner than formal critical-supplier designation, while manufacturers must also assess cyber risks introduced by their own connected suppliers and technology vendors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The UK Cyber Security and Resilience Bill directly regulates Operators of Essential Services, managed service providers, and data centre operators.","The Bill proposes a Designated Critical Supplier category that would allow regulators to impose equivalent security, incident-reporting, inspection, and turnover-based penalty obligations on designated suppliers.","Organisations regulated under the Bill are likely to pass security expectations to suppliers through procurement requirements, due-diligence requests, and contractual audit rights.","Manufacturers and technology providers supplying regulated sectors may need to demonstrate details of their products' security posture, including known weaknesses, network behaviour, update mechanisms, and required access.","The article states that manufacturers should understand both which regulated sectors their products reach and the cyber risks posed by their own suppliers and connected plant-network technology."],"insights":["Commercial pressure is likely to reach far more suppliers, and sooner, than formal designation because regulated customers can immediately add security conditions to procurement and contract processes.","The same supply-chain risk issue applies in both directions: manufacturers may be scrutinized by critical-infrastructure customers while also needing to examine what their own suppliers and vendors can access in plant environments.","For products used in operational environments, a supplier must be prepared to explain practical details such as how the product behaves on a network, how it is updated, and what access it needs to operate.","The article frames early preparation as a business-readiness issue rather than only a compliance exercise, since suppliers may need answers before a customer asks for them."],"referencedReports":[],"body":"\u003cp\u003eThe proposed UK Cyber Security and Resilience Bill directly regulates Operators of Essential Services, managed service providers, and data centre operators, but its effects may extend further through supply-chain provisions. It introduces a Designated Critical Supplier category that allows regulators to designate suppliers whose products or services are essential to maintaining an essential service. Designated suppliers would face obligations equivalent to those for Operators of Essential Services, including security standards, incident reporting, regulatory inspection, and turnover-based penalties.\u003c/p\u003e\n\n\u003cp\u003eThe Bill may also drive regulated organisations to impose security requirements on suppliers through contracts, procurement processes, due-diligence requests, and audit rights. Manufacturers and technology providers supplying energy, water, or other regulated sectors may therefore need to demonstrate their products\u0026rsquo; security posture, including known vulnerabilities, network behaviour, update mechanisms, and required access. The article says commercial pressure from customers is likely to affect more organisations and arrive sooner than formal critical-supplier designation, while manufacturers must also assess cyber risks introduced by their own connected suppliers and technology vendors.\u003c/p\u003e\n"},{"n":7,"title":"Introducing the CyCognito MCP Server: Full Exposure Context, On Demand","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/introducing-the-cycognito-mcp-server-full-exposure-context-on-demand/","time":"09:32","priority":"MAY READ","score":45,"tldr":"CyCognito has launched a beta MCP server that lets AI clients such as Claude, Cursor, and ChatGPT query its external attack-surface and exposure data using CyQL. The read-only integration preserves existing user permissions and supports asset, issue, evidence, and archived-issue searches.","briefOverview":"\u003cp\u003eCyCognito has announced the beta release of its MCP server, which makes external attack-surface data available to AI clients that support the Model Context Protocol, including Claude, Cursor, and ChatGPT. The server uses CyQL, CyCognito’s proprietary query language for searching assets, issues, and their relationships. It is available in CyCognito’s EU and US environments for accounts enabled through a customer success manager.\u003c/p\u003e\n\n\u003cp\u003eThe read-only server supports searches across assets and issues, access to detailed records and related evidence, archived-issue analysis, and conversion of plain-language requests into CyQL. Every request is logged, and users retain the same access permissions they have in the CyCognito platform. CyCognito says the integration can support morning issue triage, investigation of why assets were attributed to a subsidiary, and comparisons between discovered internet-facing assets and a company’s CMDB; broader data coverage and carefully scoped write access are planned.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CyCognito has released a beta MCP server that makes its external attack-surface data available to AI clients that support the Model Context Protocol, including Claude, Cursor, and ChatGPT.","The server uses CyQL and supports realm-wide searches for assets and issues, detailed records and evidence, archived-issue access, and free-text-to-CyQL translation.","The MCP server is read-only, logs every request, and applies the same platform privileges so users can access only data they could already view in CyCognito.","CyCognito says the MCP server can help teams review newly opened issues, investigate asset attribution, and compare discovered internet-facing assets with CMDB records.","The server is available in CyCognito’s EU and US environments, while broader data coverage and carefully scoped write access are planned for the future."],"insights":["The MCP server is designed to combine CyCognito’s external discovery data with other tools in the same AI session, enabling comparisons such as identifying internet-facing assets that are absent from a company’s CMDB.","CyCognito’s asset-attribution capability can provide the reasoning for linking an unfamiliar domain to an organization or subsidiary, addressing assets that were not previously documented internally.","Although the integration is intended to support AI-driven investigation and remediation workflows, CyCognito has deliberately limited the initial release to read-only access while it works through approval and audit requirements for changes made by agents."],"referencedReports":[],"body":"\u003cp\u003eCyCognito has announced the beta release of its MCP server, which makes external attack-surface data available to AI clients that support the Model Context Protocol, including Claude, Cursor, and ChatGPT. The server uses CyQL, CyCognito’s proprietary query language for searching assets, issues, and their relationships. It is available in CyCognito’s EU and US environments for accounts enabled through a customer success manager.\u003c/p\u003e\n\n\u003cp\u003eThe read-only server supports searches across assets and issues, access to detailed records and related evidence, archived-issue analysis, and conversion of plain-language requests into CyQL. Every request is logged, and users retain the same access permissions they have in the CyCognito platform. CyCognito says the integration can support morning issue triage, investigation of why assets were attributed to a subsidiary, and comparisons between discovered internet-facing assets and a company’s CMDB; broader data coverage and carefully scoped write access are planned.\u003c/p\u003e\n"}]</script>
