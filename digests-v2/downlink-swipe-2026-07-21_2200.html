<script type="application/json" id="dl-articles">[{"n":2,"title":"FakeGit campaign uses 7,600 GitHub repos to push SmartLoader malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fakegit-campaign-uses-7-600-github-repos-to-push-smartloader-malware/","time":"22:34","priority":"MUST READ","score":92,"tldr":"A large FakeGit campaign is using 7,600 malicious GitHub repositories, including AI tool and MCP server lures, to distribute SmartLoader and StealC malware. Researchers warn that these repos are being surfaced by AI agents and public catalogs, making malicious downloads look more credible to developers.","briefOverview":"\u003cp\u003eA large-scale operation called FakeGit is using 7,600 malicious GitHub repositories to distribute SmartLoader and StealC malware. More than 800 of the repositories pretended to be AI skills or MCP servers and appeared more than 600 times in public AI registries and catalogs. Researchers at Island said this increased the chance that AI agents and developers would discover them, a technique they call “agentbaiting.”\u003c/p\u003e\n\n\u003cp\u003eThe campaign is considered a continuation of an older operation that used Lumma Stealer and was attributed by Trend Micro to a threat actor tracked as Water Kurita. Many repositories imitated consumer and enterprise tools such as Gmail, WhatsApp, Databricks, Jenkins, and Docker, using convincing documentation, fabricated stars and fork counts, copied descriptions, and real developer account names. Their README files directed visitors to ZIP archives that posed as installers or project releases but were disguised Lua payloads that triggered SmartLoader.\u003c/p\u003e\n\n\u003cp\u003eOnce active, SmartLoader creates persistence through scheduled tasks, retrieves its command-and-control address through a Polygon smart contract, and downloads additional encrypted stages from GitHub before delivering StealC. Island said GitHub public download counters for 335 unique Release assets across 211 FakeGit repositories recorded 14,084,688 cumulative download events, though this included repeated requests and automated activity and should not be interpreted as infections. Island recommends approved catalogs for skills and MCP servers, isolated testing of new capabilities, independent verification of publishers and repositories, and immediate secret rotation where SmartLoader execution is suspected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A campaign called FakeGit is using 7,600 malicious GitHub repositories to distribute SmartLoader and StealC malware.","More than 800 repositories pretended to be AI skills or MCP servers and appeared over 600 times in public AI registries and catalogs.","Island researchers said the campaign uses an emerging technique called AgentBaiting to make malicious repositories more visible to AI agents and more likely to be recommended or used.","The malicious repositories often imitate tools such as Gmail, WhatsApp, Databricks, Jenkins, and Docker, with README files directing users to ZIP archives disguised as installers or releases.","GitHub public download counters for 335 unique release assets across 211 FakeGit repositories showed 14,084,688 cumulative download events, but Island said this should not be interpreted as infections."],"insights":["Public AI registries and catalogs can amplify malicious repositories by making them easier to discover and appear more credible, even when researchers cannot determine whether listings were submitted manually or indexed automatically.","In Island’s controlled testing, Claude Code cloned malicious repositories and downloaded malicious files but stopped before execution after detecting suspicious indicators, showing that agent safeguards may intervene late in the workflow rather than at discovery.","The campaign’s reported 14,084,688 GitHub download events should be treated as exposure data rather than infection data because the figure includes repeated requests and automated activity.","SmartLoader’s use of a Polygon smart contract to retrieve its command-and-control address makes the attack chain depend on infrastructure beyond the malicious GitHub repositories themselves.","Island’s recommendation to rotate all secrets immediately where SmartLoader execution is suspected indicates that credential exposure is a primary concern after any successful run."],"referencedReports":[{"title":"AI-Assisted Fake GitHub Repositories","url":"http://www.trendmicro.com/en_us/research/25/c/ai-assisted-fake-github-repositories.html","publisher":"Trend Micro","context":"The article says the FakeGit campaign is considered a continuation of an older operation covered by Trend Micro researchers that used Lumma Stealer and was attributed to Water Kurita.","category":"research","primary":false}],"body":"\u003cp\u003eA large-scale operation called FakeGit is using 7,600 malicious GitHub repositories to distribute SmartLoader and StealC malware. More than 800 of the repositories pretended to be AI skills or MCP servers and appeared more than 600 times in public AI registries and catalogs. Researchers at Island said this increased the chance that AI agents and developers would discover them, a technique they call “agentbaiting.”\u003c/p\u003e\n\n\u003cp\u003eThe campaign is considered a continuation of an older operation that used Lumma Stealer and was attributed by Trend Micro to a threat actor tracked as Water Kurita. Many repositories imitated consumer and enterprise tools such as Gmail, WhatsApp, Databricks, Jenkins, and Docker, using convincing documentation, fabricated stars and fork counts, copied descriptions, and real developer account names. Their README files directed visitors to ZIP archives that posed as installers or project releases but were disguised Lua payloads that triggered SmartLoader.\u003c/p\u003e\n\n\u003cp\u003eOnce active, SmartLoader creates persistence through scheduled tasks, retrieves its command-and-control address through a Polygon smart contract, and downloads additional encrypted stages from GitHub before delivering StealC. Island said GitHub public download counters for 335 unique Release assets across 211 FakeGit repositories recorded 14,084,688 cumulative download events, though this included repeated requests and automated activity and should not be interpreted as infections. Island recommends approved catalogs for skills and MCP servers, isolated testing of new capabilities, independent verification of publishers and repositories, and immediate secret rotation where SmartLoader execution is suspected.\u003c/p\u003e\n"},{"n":1,"title":"Police dismantle Kratos phishing platform, arrest developer","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-dismantle-kratos-phishing-platform-arrest-developer/","time":"23:07","priority":"SHOULD READ","score":82,"tldr":"German and U.S. authorities dismantled the Kratos phishing-as-a-service platform by seizing over 200 servers, while its developer was arrested in Indonesia. The takedown disrupts a service allegedly used by more than 1,800 criminals to run about 15,000 Microsoft credential-phishing campaigns per month.","briefOverview":"\u003cp\u003eAuthorities in Germany and the U.S. dismantled the central infrastructure of Kratos, a phishing-as-a-service platform with global reach. More than 200 servers were seized, disrupting the malicious service and rendering it inoperable. The platform’s developer and technical administrator was arrested in Indonesia.\u003c/p\u003e\n\n\u003cp\u003eGermany’s BKA described Kratos as one of the world’s most widely used criminal phishing services, with confirmed victims in 35 countries, particularly in Europe and the United States. Authorities believe more than 1,800 criminal customers purchased Kratos and used it to conduct roughly 15,000 phishing campaigns per month. Each campaign had the potential to affect several thousand recipients worldwide.\u003c/p\u003e\n\n\u003cp\u003eKratos allowed threat actors to create and manage fake Microsoft authentication pages designed to steal email addresses and passwords. Stolen access to Microsoft accounts was often used to commit further crimes, including business email compromise, data theft, account takeover, and phishing attacks targeting victims’ contacts. Authorities estimate the service owner made at least €300,000 since 2024 from Kratos subscription fees, and seized servers may provide forensic evidence to identify customers of the service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Authorities in Germany and the U.S. dismantled the central infrastructure of the Kratos phishing-as-a-service platform and seized more than 200 servers.","The technical administrator and developer of Kratos was arrested in Indonesia.","Germany’s BKA described Kratos as one of the world’s most widely used criminal phishing services, with confirmed victims across 35 countries, particularly in Europe and the United States.","Authorities believe more than 1,800 criminal customers used Kratos to conduct roughly 15,000 phishing campaigns per month.","Kratos allowed criminals to create fake Microsoft authentication pages to steal email addresses and passwords, enabling Microsoft account hijacking."],"insights":["The seizure of Kratos servers may expose evidence that helps authorities identify customers of the phishing service, not just its administrator.","Kratos’ reliance on central infrastructure meant that seizing more than 200 servers could render the service inoperable and stop ongoing campaigns.","Although Kratos allegedly enabled roughly 15,000 phishing campaigns per month, authorities estimate the service owner made at least €300,000 from subscriptions since 2024.","The stolen Microsoft account credentials were valuable beyond initial account hijacking because they could be used for further crimes such as business email compromise, data theft, account takeover, and phishing victims’ contacts."],"referencedReports":[],"body":"\u003cp\u003eAuthorities in Germany and the U.S. dismantled the central infrastructure of Kratos, a phishing-as-a-service platform with global reach. More than 200 servers were seized, disrupting the malicious service and rendering it inoperable. The platform’s developer and technical administrator was arrested in Indonesia.\u003c/p\u003e\n\n\u003cp\u003eGermany’s BKA described Kratos as one of the world’s most widely used criminal phishing services, with confirmed victims in 35 countries, particularly in Europe and the United States. Authorities believe more than 1,800 criminal customers purchased Kratos and used it to conduct roughly 15,000 phishing campaigns per month. Each campaign had the potential to affect several thousand recipients worldwide.\u003c/p\u003e\n\n\u003cp\u003eKratos allowed threat actors to create and manage fake Microsoft authentication pages designed to steal email addresses and passwords. Stolen access to Microsoft accounts was often used to commit further crimes, including business email compromise, data theft, account takeover, and phishing attacks targeting victims’ contacts. Authorities estimate the service owner made at least €300,000 since 2024 from Kratos subscription fees, and seized servers may provide forensic evidence to identify customers of the service.\u003c/p\u003e\n"}]</script>
