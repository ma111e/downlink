<script type="application/json" id="dl-articles">[{"n":3,"title":"WordPress Core \"wp2shell\" RCE flaws get public exploits, patch now","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/wordpress-core-wp2shell-rce-flaws-get-public-exploits-patch-now/","time":"17:22","priority":"MUST READ","score":98,"tldr":"Public exploits are now available for the critical WordPress Core “wp2shell” flaws that can enable unauthenticated remote code execution on affected 6.9.x and 7.0.x sites. Administrators should immediately update to WordPress 7.0.2 or 6.9.5, with WAF or REST API blocking only as temporary mitigation.","briefOverview":"\u003cp\u003ePublic proof-of-concept exploits have been released for the critical “wp2shell” remote code execution vulnerabilities affecting WordPress Core. The flaws, tracked as CVE-2026-63030 and CVE-2026-60137, can be chained to achieve pre-authentication remote code execution against WordPress installs running affected 6.9.x and 7.0.x versions. Searchlight Cyber said the attack has no preconditions and can be exploited by an anonymous user against a stock WordPress installation with no plugins.\u003c/p\u003e\n\n\u003cp\u003eThe complete RCE chain affects WordPress 6.9.0 through 6.9.4 and WordPress 7.0.0 through 7.0.1, and it has been fixed in WordPress 6.9.5 and 7.0.2. WordPress enabled forced automatic security updates for supported installations running affected versions and urged site owners to update immediately. The SQL injection flaw also affects WordPress 6.8.0 through 6.8.5, but the article says it cannot be chained to RCE there because the REST API batch-route confusion bug was added in WordPress 6.9.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber is withholding technical details and created wp2shell.com so administrators can test whether their installations are vulnerable. For organizations unable to update immediately, it recommends temporarily blocking anonymous REST API access or blocking \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e and \u003ccode\u003e?rest_route=/batch/v1\u003c/code\u003e at a WAF level. Cloudflare deployed WAF protections for both vulnerabilities, and watchTowr said it has seen public exploit code in circulation and the first signs of in-the-wild exploitation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Public proof-of-concept exploits have been released for the critical “wp2shell” remote code execution vulnerabilities affecting WordPress Core.","The wp2shell attack chains CVE-2026-63030, a REST API batch-route confusion flaw, with CVE-2026-60137, an SQL injection flaw in the author__not_in parameter of WP_Query.","The complete remote code execution chain affects WordPress 6.9.0 through 6.9.4 and WordPress 7.0.0 through 7.0.1, and it has been fixed in WordPress 6.9.5 and 7.0.2.","WordPress has enabled forced automatic security updates for supported installations running affected versions and urged site owners to update immediately.","Cloudflare deployed WAF protections for both vulnerabilities, while watchTowr said it has seen public exploit code in circulation and the first signs of in-the-wild exploitation."],"insights":["The RCE risk is version-dependent: WordPress 6.8.x is affected by the SQL injection flaw, but the article says it cannot be chained to remote code execution because the REST API batch-route confusion bug was introduced only in WordPress 6.9.","Searchlight Cyber withheld technical details and created a testing site for administrators, but multiple public GitHub proof-of-concept exploits appeared anyway, shrinking the patching window for site owners.","Some public exploits reportedly rely on cracking an administrator password after extracting WordPress password hashes, while others claim pre-authentication remote code execution, showing that the public exploit landscape is not uniform.","The recommended temporary mitigations focus specifically on blocking anonymous REST API access or the batch endpoint, indicating that reducing exposure to `/wp-json/batch/v1` and `?rest_route=/batch/v1` is a practical short-term control when immediate patching is not possible.","Cloudflare’s WAF protections were deployed even for free accounts, but Cloudflare explicitly said these protections only reduce exposure and are not a substitute for updating WordPress."],"referencedReports":[{"title":"wp2shell: Pre-Authentication RCE in WordPress Core","url":"http://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core/","publisher":"Searchlight Cyber","context":"The article cites Searchlight Cyber's research describing the pre-authentication remote code execution issue in WordPress Core and the lack of preconditions for exploitation.","category":"research","primary":true},{"title":"WordPress 7.0.2 Release","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article references WordPress's security announcement urging immediate updates and noting forced automatic security updates for affected versions.","category":"advisory","primary":true},{"title":"CVE-2026-63030 WordPress Core Security Advisory","url":"http://github.com/WordPress/wordpress-develop/security/advisories/GHSA-ff9f-jf42-662q","publisher":"WordPress","context":"The article links to the advisory for CVE-2026-63030, described as a REST API batch-route confusion vulnerability introduced in WordPress 6.9.","category":"advisory","primary":true},{"title":"CVE-2026-60137 WordPress Core Security Advisory","url":"http://github.com/WordPress/wordpress-develop/security/advisories/GHSA-fpp7-x2x2-2mjf","publisher":"WordPress","context":"The article links to the advisory for CVE-2026-60137, described as a high-severity SQL injection vulnerability in the author__not_in parameter of WP_Query.","category":"advisory","primary":true}],"body":"\u003cp\u003ePublic proof-of-concept exploits have been released for the critical “wp2shell” remote code execution vulnerabilities affecting WordPress Core. The flaws, tracked as CVE-2026-63030 and CVE-2026-60137, can be chained to achieve pre-authentication remote code execution against WordPress installs running affected 6.9.x and 7.0.x versions. Searchlight Cyber said the attack has no preconditions and can be exploited by an anonymous user against a stock WordPress installation with no plugins.\u003c/p\u003e\n\n\u003cp\u003eThe complete RCE chain affects WordPress 6.9.0 through 6.9.4 and WordPress 7.0.0 through 7.0.1, and it has been fixed in WordPress 6.9.5 and 7.0.2. WordPress enabled forced automatic security updates for supported installations running affected versions and urged site owners to update immediately. The SQL injection flaw also affects WordPress 6.8.0 through 6.8.5, but the article says it cannot be chained to RCE there because the REST API batch-route confusion bug was added in WordPress 6.9.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber is withholding technical details and created wp2shell.com so administrators can test whether their installations are vulnerable. For organizations unable to update immediately, it recommends temporarily blocking anonymous REST API access or blocking \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e and \u003ccode\u003e?rest_route=/batch/v1\u003c/code\u003e at a WAF level. Cloudflare deployed WAF protections for both vulnerabilities, and watchTowr said it has seen public exploit code in circulation and the first signs of in-the-wild exploitation.\u003c/p\u003e\n"},{"n":6,"title":"New North Korean campaign uses fake coding interviews to steal developer credentials","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography","time":"00:00","priority":"MUST READ","score":94,"tldr":"Elastic Security Labs uncovered a DPRK-aligned Contagious Interview campaign that lures developers with fake coding challenges and hides OTTERCOOKIE-like malware inside SVG files. Running the trojanized projects can steal browser credentials, crypto wallets, sensitive files and clipboard data while installing a Socket.IO-based remote access backdoor.","briefOverview":"\u003cp\u003eElastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter targeted its community Slack workspace with a job posting and coding challenge. The trojanized projects were fully functional e-commerce templates, but they silently executed malicious code when users ran the server. Elastic said the activity overlaps with prior reporting on OTTERCOOKIE based on code similarity, behavior, and related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaign matters because developers are the direct targets, and a compromised developer machine can provide attackers with access to credentials, keys, wallets, files, and potentially downstream organizations. The payload delivered four main capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The malware collected browser login data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.\u003c/p\u003e\n\n\u003cp\u003eA key technique in the infection chain was hiding Base64 payload fragments inside HTML comments across SVG flag images in the project’s assets directory. A JavaScript file reassembled the fragments in alphabetical order, decoded them with a custom Base64 function, and executed the result with eval during server startup. Elastic also observed command-and-control activity using rightwidth[.]dev subdomains, including upload endpoints, a Socket.IO controller, and Windows second-stage download paths.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter posted a job offer in its community Slack workspace and sent developers a trojanized coding challenge.","The trojanized projects hid Base64-encoded payload fragments inside HTML comments across SVG flag images, then reassembled and executed the payload when the project server started.","Running the malicious project delivered four OTTERCOOKIE-aligned capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer.","The malware targeted developer machines across Windows, macOS, and Linux by collecting browser data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.","Elastic linked the activity to Contagious Interview based on code similarity, behavior, and infrastructure overlapping with prior reporting on OTTERCOOKIE and related DPRK campaigns."],"insights":["The trojanized repositories had zero antivirus detections at the time of writing, showing that benign-looking coding assignments can evade standard file reputation checks even when they contain active credential theft and remote access code.","The campaign used fully functional e-commerce projects copied from legitimate templates, so a project running correctly was not evidence that it was safe.","The malware avoided simple detection patterns by hiding payload fragments in SVG comments and decoding them with a custom Base64 function before using eval, rather than relying on common decoding methods such as Buffer.from or atob.","The file stealer’s exclusion list deliberately avoided many common developer and AI-coding-tool directories such as .claude, .cursor, .gemini, and .windsurf, indicating the attackers tuned collection to reduce noise on developer systems.","The malware tagged virtual machines and sandboxes in its command-and-control response but did not stop running, which means analysis environments may still observe behavior while operators can separately prioritize likely real victims."],"referencedReports":[{"title":"Contagious Interview malware delivered through fake developer job interviews","url":"https://www.microsoft.com/en-us/security/blog/2026/03/11/contagious-interview-malware-delivered-through-fake-developer-job-interviews/","publisher":"Microsoft","context":"The article cites this Microsoft blog as prior public reporting whose strings, behavior, and script layout overlap with the malicious JavaScript analyzed by Elastic.","category":"research","primary":false},{"title":"OTTERCOOKIE Contagious Interview analysis","url":"https://jp.security.ntt/insights_resources/tech_blog/en-contagious-interview-ottercookie/","publisher":"NTT Security","context":"The article references NTT Security’s OTTERCOOKIE analysis as prior research on the malware family that Elastic says its samples resemble.","category":"research","primary":false},{"title":"Rollup polyfill masquerading infrastructure","url":"https://research.jfrog.com/post/rollup-polyfill-masquerading/","publisher":"JFrog Security","context":"The article cites JFrog Security research because the observed API endpoints in Elastic’s samples matched infrastructure recently linked by JFrog.","category":"research","primary":false}],"body":"\u003cp\u003eElastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter targeted its community Slack workspace with a job posting and coding challenge. The trojanized projects were fully functional e-commerce templates, but they silently executed malicious code when users ran the server. Elastic said the activity overlaps with prior reporting on OTTERCOOKIE based on code similarity, behavior, and related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaign matters because developers are the direct targets, and a compromised developer machine can provide attackers with access to credentials, keys, wallets, files, and potentially downstream organizations. The payload delivered four main capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The malware collected browser login data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.\u003c/p\u003e\n\n\u003cp\u003eA key technique in the infection chain was hiding Base64 payload fragments inside HTML comments across SVG flag images in the project’s assets directory. A JavaScript file reassembled the fragments in alphabetical order, decoded them with a custom Base64 function, and executed the result with eval during server startup. Elastic also observed command-and-control activity using rightwidth[.]dev subdomains, including upload endpoints, a Socket.IO controller, and Windows second-stage download paths.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft warns of surge in ACR Stealer attacks on customers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-warns-of-surge-in-acr-stealer-attacks-on-customers/","time":"14:17","priority":"MUST READ","score":92,"tldr":"Microsoft says ACR Stealer attacks are surging against enterprise customers, using ClickFix lures, WebDAV, MSHTA, and obfuscated PowerShell to steal browser credentials, tokens, and business documents. Organizations should restrict risky script/tool execution and web-based delivery paths to reduce exposure.","briefOverview":"\u003cp\u003eMicrosoft has observed a surge in attacks using ACR Stealer malware against its enterprise customers between late April and mid-June. The malware is used to steal browser-stored passwords, authentication tokens, and sensitive documents. Microsoft says ACR Stealer is a malware-as-a-service operation believed to be a rebranding of Amatera Stealer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft highlighted two prevalent delivery chains involving ClickFix social-engineering lures. One chain runs a malicious DLL from a remote WebDAV share using rundll32.exe, then uses obfuscated PowerShell, a bundled Python loader, a scheduled task for persistence, timestamp manipulation, PowerShell history clearing, and in-memory payload execution. Some variants use public blockchain services as dead-drop resolvers to obtain updated payload locations or command-and-control addresses.\u003c/p\u003e\n\n\u003cp\u003eA second chain uses ClickFix to launch MSHTA, retrieve malicious content from the attacker’s server, and run an obfuscated PowerShell downloader that extracts an encrypted payload hidden inside a publicly hosted JPEG image. The malware targets passwords, cookies, session data, authentication tokens, Chromium browser databases on Chrome and Edge, PDFs, Microsoft 365 documents, Desktop and Downloads folders, and enterprise-synchronized OneDrive and SharePoint directories. Microsoft recommends avoiding copied command instructions, filtering and blocking low-reputation or new domains, restricting unnecessary online resources, and using application control rules for tools such as PowerShell, Python, mshta.exe, and rundll32.exe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft observed a surge between late April and mid-June in attacks using ACR Stealer to steal browser-stored passwords, authentication tokens, and sensitive documents from enterprise customers.","The threat actor used ClickFix social engineering, WebDAV servers, and the MSHTA utility to deliver the ACR Stealer payload.","One common intrusion chain uses a ClickFix lure to run a malicious DLL from a remote WebDAV share with rundll32.exe, followed by obfuscated PowerShell, a bundled Python loader, persistence through a scheduled task, and in-memory payload execution.","A second common intrusion chain uses ClickFix to launch MSHTA, retrieve malicious content from the attacker’s server, run an obfuscated PowerShell downloader, and execute an encrypted payload hidden inside a publicly hosted JPEG image.","Microsoft recommends defenses including avoiding copied command instructions from websites, filtering or blocking low-reputation and new domains, restricting unnecessary online resources, and using application control rules for tools such as PowerShell, Python, mshta.exe, and rundll32.exe."],"insights":["The ACR Stealer campaigns rely heavily on trusted Windows utilities such as MSHTA, rundll32.exe, PowerShell, and scheduled tasks, making application control around these tools especially relevant when they launch content from remote or user-writeable locations.","Some ACR Stealer variants use public blockchain services as dead-drop resolvers for updated payload locations or command-and-control addresses, so blocking only fixed attacker servers may be insufficient for the observed activity.","The WebDAV-based campaign uses GUID-style directories and legitimate-looking filenames such as google.ct to make malicious network paths appear normal, which makes domain and resource reputation filtering more important than filename appearance alone.","The malware specifically targets enterprise-synchronized OneDrive and SharePoint directories in addition to local Desktop and Downloads folders, increasing the potential business impact beyond a single infected device."],"referencedReports":[{"title":"ACR Stealer: Two observed intrusion chains amid increased threat activity","url":"https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/#campaign-1-webdav-based-clickfix-with-python-loaders-and-blockchain-c2","publisher":"Microsoft","context":"The article cites a Microsoft report describing two prevalent ACR Stealer intrusion chains, mitigations, and indicators of compromise.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft has observed a surge in attacks using ACR Stealer malware against its enterprise customers between late April and mid-June. The malware is used to steal browser-stored passwords, authentication tokens, and sensitive documents. Microsoft says ACR Stealer is a malware-as-a-service operation believed to be a rebranding of Amatera Stealer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft highlighted two prevalent delivery chains involving ClickFix social-engineering lures. One chain runs a malicious DLL from a remote WebDAV share using rundll32.exe, then uses obfuscated PowerShell, a bundled Python loader, a scheduled task for persistence, timestamp manipulation, PowerShell history clearing, and in-memory payload execution. Some variants use public blockchain services as dead-drop resolvers to obtain updated payload locations or command-and-control addresses.\u003c/p\u003e\n\n\u003cp\u003eA second chain uses ClickFix to launch MSHTA, retrieve malicious content from the attacker’s server, and run an obfuscated PowerShell downloader that extracts an encrypted payload hidden inside a publicly hosted JPEG image. The malware targets passwords, cookies, session data, authentication tokens, Chromium browser databases on Chrome and Edge, PDFs, Microsoft 365 documents, Desktop and Downloads folders, and enterprise-synchronized OneDrive and SharePoint directories. Microsoft recommends avoiding copied command instructions, filtering and blocking low-reputation or new domains, restricting unnecessary online resources, and using application control rules for tools such as PowerShell, Python, mshta.exe, and rundll32.exe.\u003c/p\u003e\n"},{"n":4,"title":"Update now: 7-Zip fixes RCE flaw exploitable with malicious archives","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/update-now-7-zip-fixes-rce-flaw-exploitable-with-malicious-archives/","time":"19:32","priority":"MUST READ","score":91,"tldr":"7-Zip 26.02 fixes a remote code execution flaw in its XZ decompression handling that could be triggered by a malicious archive. Because 7-Zip does not auto-update, users should manually install the latest version from the official site.","briefOverview":"\u003cp\u003e7-Zip version 26.02 was released to fix a remote code execution vulnerability that could allow attackers to execute malicious code if users open specially crafted compressed files. The flaw was disclosed by Lunbun researcher Landon Peng and exists in 7-Zip\u0026rsquo;s processing of XZ-compressed data. According to a Zero Day Initiative advisory, specially crafted XZ data can trigger a heap-based buffer overflow and potentially allow arbitrary code execution as the user.\u003c/p\u003e\n\n\u003cp\u003eThe developer has not published technical details about the flaw, but the 26.02 source code changes suggest it is related to how 7-Zip tracks available space while decompressing XZ data. The patch adds checks to ensure the decoder cannot write beyond the remaining available space in an output buffer. The advisory says exploitation requires user interaction, such as visiting a malicious page or opening a malicious archive file.\u003c/p\u003e\n\n\u003cp\u003e7-Zip does not include an automatic update feature, so users must manually download the latest version from 7-zip.org to receive the fix. The article notes that 7-Zip is widely used on Windows and that flaws in archive utilities can be attractive to threat actors. There are currently no reports that attackers are actively exploiting this newly disclosed vulnerability, but users are advised to update to version 26.02 as soon as possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["7-Zip version 26.02 was released to fix a remote code execution vulnerability in the program’s processing of XZ-compressed data.","The Zero Day Initiative advisory says specially crafted XZ data can trigger a heap-based buffer overflow that may allow attackers to execute arbitrary code as the user.","Exploitation requires user interaction, such as visiting a malicious page or opening a malicious archive file.","7-Zip does not include an automatic update feature, so users must manually download and install the latest version from 7-zip.org.","There are currently no reports that attackers are actively exploiting this newly disclosed 7-Zip vulnerability."],"insights":["The lack of an automatic update feature makes this fix especially actionable because vulnerable users will remain exposed unless they manually install 7-Zip 26.02 from the official site.","Although the developer has not published technical details, the source code changes indicate the fix centers on preventing the XZ decoder from writing past the remaining output buffer space.","The article highlights archive-file flaws as a practical threat because attackers have previously exploited 7-Zip and WinRAR vulnerabilities through phishing or social engineering campaigns.","The absence of current exploitation reports does not remove the risk, since 7-Zip’s widespread Windows usage makes its archive-handling flaws attractive targets for future attacks."],"referencedReports":[{"title":"ZDI-26-444","url":"https://www.zerodayinitiative.com/advisories/ZDI-26-444/","publisher":"Zero Day Initiative","context":"The article cites this advisory for details that specially crafted XZ data can trigger a heap-based buffer overflow and potentially allow arbitrary code execution as the user.","category":"advisory","primary":true}],"body":"\u003cp\u003e7-Zip version 26.02 was released to fix a remote code execution vulnerability that could allow attackers to execute malicious code if users open specially crafted compressed files. The flaw was disclosed by Lunbun researcher Landon Peng and exists in 7-Zip\u0026rsquo;s processing of XZ-compressed data. According to a Zero Day Initiative advisory, specially crafted XZ data can trigger a heap-based buffer overflow and potentially allow arbitrary code execution as the user.\u003c/p\u003e\n\n\u003cp\u003eThe developer has not published technical details about the flaw, but the 26.02 source code changes suggest it is related to how 7-Zip tracks available space while decompressing XZ data. The patch adds checks to ensure the decoder cannot write beyond the remaining available space in an output buffer. The advisory says exploitation requires user interaction, such as visiting a malicious page or opening a malicious archive file.\u003c/p\u003e\n\n\u003cp\u003e7-Zip does not include an automatic update feature, so users must manually download the latest version from 7-zip.org to receive the fix. The article notes that 7-Zip is widely used on Windows and that flaws in archive utilities can be attractive to threat actors. There are currently no reports that attackers are actively exploiting this newly disclosed vulnerability, but users are advised to update to version 26.02 as soon as possible.\u003c/p\u003e\n"},{"n":5,"title":"The Squarespace Phish With No Brand Text to Match","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/squarespace-invisible-unicode-ocr-logo-brand-detection-bypass","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A Squarespace phishing email bypassed brand-text detection by hiding the brand name with invisible Unicode characters and placing it only inside an image, while passing SPF, DKIM, and DMARC through a hijacked aged domain. It was ultimately caught through behavioral signals such as malicious link reputation, sender anomalies, and OCR/image-based detection.","briefOverview":"\u003cp\u003eA credential-harvesting email impersonating Squarespace reached a K-12 school district and appeared to be a billing notice about an expiring subscription. It warned that a domain would be deactivated in two days and offered a “Payment link” button. The article says the message mattered because it looked like a familiar brand while leaving automated brand detection with no normal text to match.\u003c/p\u003e\n\n\u003cp\u003eThe attackers hid the readable brand name by putting the Squarespace wordmark and logo in an image and padding the subject line and sender display name with invisible U+206E characters. The email also passed SPF, DKIM, and DMARC because it was sent from the hijacked 24-year-old domain oldanopetroli[.]com through Aliyun DirectMail infrastructure. IRONSCALES Themis flagged the incident at 90% confidence as Credential Theft and Image-Based Attack, relying on signals such as malicious link reputation, sender anomalies, OCR, and community correlation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A credential-harvesting email impersonating Squarespace reached a K-12 school district and used a fake billing notice to warn that a domain would be deactivated in two days.","The word “Squarespace” did not appear as machine-readable text in the message because the logo and wordmark were delivered as an image and the subject and sender display name were padded with invisible U+206E characters.","The message passed SPF, DKIM, and DMARC because it was sent from the hijacked 24-year-old domain oldanopetroli[.]com through Aliyun DirectMail infrastructure.","The payment link led to a tokenized subdomain on compromised studiointech[.]net, which was flagged malicious.","IRONSCALES Themis flagged the incident at 90% confidence as Credential Theft and Image-Based Attack and automatically resolved it as phishing before anyone in the district acted on it."],"insights":["Brand-impersonation detection that depends on finding readable brand text can fail when the brand appears only in an image and is fragmented in headers with invisible Unicode characters.","Passing SPF, DKIM, and DMARC did not indicate legitimacy in this case because the attacker used a hijacked, aged domain that was authorized to send through a bulk mail service.","OCR, link reputation, sender behavior, and community signals were more useful than standard content scanning for catching this message.","The European-style amount and date format were a practical clue that the lure did not fit the targeted US school district."],"referencedReports":[{"title":"2024 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article cites the report to note that the human element still factors into the majority of breaches.","category":"research","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites IC3 data to state that phishing remains among the most-reported crime types year over year.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing mitigation advisory as process-level guidance for reducing phishing risk.","category":"advisory","primary":false}],"body":"\u003cp\u003eA credential-harvesting email impersonating Squarespace reached a K-12 school district and appeared to be a billing notice about an expiring subscription. It warned that a domain would be deactivated in two days and offered a “Payment link” button. The article says the message mattered because it looked like a familiar brand while leaving automated brand detection with no normal text to match.\u003c/p\u003e\n\n\u003cp\u003eThe attackers hid the readable brand name by putting the Squarespace wordmark and logo in an image and padding the subject line and sender display name with invisible U+206E characters. The email also passed SPF, DKIM, and DMARC because it was sent from the hijacked 24-year-old domain oldanopetroli[.]com through Aliyun DirectMail infrastructure. IRONSCALES Themis flagged the incident at 90% confidence as Credential Theft and Image-Based Attack, relying on signals such as malicious link reputation, sender anomalies, OCR, and community correlation.\u003c/p\u003e\n"},{"n":2,"title":"The Future of Age Verification: Your Face Never Leaves Your Device","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-future-of-age-verification-your-face-never-leaves-your-device/","time":"13:15","priority":"MAY READ","score":35,"tldr":"Incode is promoting an on-device age verification system that estimates age and checks liveness locally so users’ face images are not transmitted or stored. The company positions this as a privacy-preserving way for platforms to meet expanding age assurance laws while still detecting spoofing and tampering.","briefOverview":"\u003cp\u003eIncode Technologies is promoting On-Device Age Estimation, a product that runs facial age estimation and passive liveness detection on a user’s phone, tablet, or laptop. The article says the user’s face is analyzed locally and is not transmitted or stored, while only the result of whether the user meets the platform’s age threshold is sent onward. It presents this as a response to expanding age assurance laws in places including the UK, Australia, Brazil, and U.S. states.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that server-based age estimation creates privacy and security concerns because face data can be intercepted, stored, breached, or exposed through vendors. Incode says its system still uses a server-side layer to analyze session metadata, such as device and connection characteristics, to detect tampering and injected camera feeds without using facial or biometric information. The article also describes Incode’s $100 million commitment to privacy-preserving identity infrastructure and its acquisition of Identiq, whose technology is intended to let organizations share fraud signals without pooling customer data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Incode says more than 30 age assurance laws are now in force worldwide, including requirements in the UK, Australia, Brazil, and about half of U.S. states.","Incode’s On-Device Age Estimation runs facial age estimation and passive liveness detection on a user’s phone, tablet, or laptop so the face is not transmitted or stored.","The system sends only the outcome of whether the user meets the platform’s required age threshold, while server-side checks analyze session metadata for tampering and injection attempts without facial or biometric data.","Incode announced a $100 million commitment to privacy-preserving identity infrastructure alongside its acquisition of Identiq, which developed technology for sharing fraud signals without exposing customer data to a third party.","The article states that Incode’s models have processed more than 7 billion trust checks and that its security layer achieves 99% spoof detection across deepfakes, injection attacks, replay attacks, and physical spoofing."],"insights":["The article frames privacy policies as insufficient for biometric age checks because they only assign responsibility after a problem, while on-device processing is presented as a way to remove the face image from the data flow entirely.","Incode’s approach still uses server-side analysis, but only for session integrity signals such as device and connection characteristics, showing that local face processing alone is not presented as enough to stop tampering.","The article highlights a tension for regulated platforms: facial age estimation is described as the method users choose most often, but biometric data collection is also cited as a major consumer concern.","Incode connects age verification and anti-fraud data sharing under the same privacy-preserving strategy, pairing on-device face analysis with Identiq’s approach to sharing fraud signals without central data pools."],"referencedReports":[{"title":"2025 Annual Data Breach Report","url":"https://www.idtheftcenter.org/publication/2025-data-breach-report/","publisher":"Identity Theft Resource Center","context":"The article cites the report for figures on U.S. data compromises and supply-chain breaches.","category":"research","primary":false}],"body":"\u003cp\u003eIncode Technologies is promoting On-Device Age Estimation, a product that runs facial age estimation and passive liveness detection on a user’s phone, tablet, or laptop. The article says the user’s face is analyzed locally and is not transmitted or stored, while only the result of whether the user meets the platform’s age threshold is sent onward. It presents this as a response to expanding age assurance laws in places including the UK, Australia, Brazil, and U.S. states.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that server-based age estimation creates privacy and security concerns because face data can be intercepted, stored, breached, or exposed through vendors. Incode says its system still uses a server-side layer to analyze session metadata, such as device and connection characteristics, to detect tampering and injected camera feeds without using facial or biometric information. The article also describes Incode’s $100 million commitment to privacy-preserving identity infrastructure and its acquisition of Identiq, whose technology is intended to let organizations share fraud signals without pooling customer data.\u003c/p\u003e\n"}]</script>
