zations were compromised within 90 minutes, with roughly one-third affected during the first 10 minutes. Huntress believes the initial access involved an authentication flaw in RMM+ versions 1.0.31 and 1.0.32, which could accept an empty shared access key when one had not been configured.\u003c/p\u003e\n\n\u003cp\u003eThe attackers deployed SCKit, a toolkit containing 16 scripts and components intended to maintain remote access and spread through ScreenConnect-managed systems. Its RelayTrap component attempted to replace the legitimate ScreenConnect Guest process on an infected customer device and send a malicious file to an MSP technician\u0026rsquo;s computer when the technician connected, using CVE-2026-84869. Huntress and Blackpoint Cyber found no evidence that this worm-like technique succeeded, and Blackpoint\u0026rsquo;s testing showed that a current patched ScreenConnect client did not execute the payload. MSPs are urged to disable affected extensions, update ScreenConnect clients, investigate unauthorized remote-access installations, review Run Command and Toolbox activity, and avoid interactive sessions with potentially infected devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Recent ScreenConnect attacks targeted managed service providers and compromised at least 288 endpoints across 48 organizations within 90 minutes, according to Huntress.","Huntress said attackers likely used an authentication flaw in RMM+ versions 1.0.31 and 1.0.32 that accepted an empty shared access key when administrators had not configured one.","The SCKit toolkit deployed rogue ScreenConnect Access clients for persistent remote access and included RelayTrap, which attempted to replace the legitimate ScreenConnect Guest process on compromised endpoints.","RelayTrap attempted to exploit CVE-2026-84869 to send and execute a malicious file on an MSP technician's workstation when the technician connected to an infected device.","Huntress and Blackpoint Cyber reported that they had not observed successful worm-like spread or technician-console takeover attempts, and Blackpoint found that patched current ScreenConnect clients prevented the payload from executing."],"insights":["The suspected RMM+ entry point did not require stolen user credentials when an administrator had left the extension's shared access key blank, because an empty key could pass its authentication check.","The SCKit design attempted to reverse the normal direction of remote support by using an infected customer device to send a file to the technician's computer rather than receiving one from the technician.","Attackers stored RelayTrap as C# source code and compiled it on compromised devices with PowerShell instead of distributing a prebuilt executable.","Commands were linked to RMM+ in logs without corresponding ScreenConnect user-login activity, a pattern Huntress said matched the observed attacks.","Both research teams recommend avoiding interactive ScreenConnect sessions with potentially infected endpoints and using separate security tools to investigate them."],"referencedReports":[{"title":"SCKit Worm \u0026 Rogue ScreenConnect","url":"https://www.huntress.com/blog/sckit-worm-rogue-screenconnect","publisher":"huntress","context":"The article relies on Huntress's updated report for details on the campaign scope, suspected RMM+ authentication flaw, and SCKit's behavior.","category":"research","primary":true},{"title":"ScreenConnect Attack: SCKit","url":"https://blackpointcyber.com/blog/screenconnect-attack-sckit/","publisher":"blackpoint-cyber","context":"The article cites Blackpoint Cyber's analysis of the recovered SCKit loader, its components, and testing showing the patched ScreenConnect client blocked execution.","category":"research","primary":true},{"title":"ConnectWise Trust Advisories","url":"https://www.connectwise.com/company/trust/advisories","publisher":"connectwise","context":"The article references ConnectWise's advisory information stating that five potentially related third-party extensions were disabled across approximately 400 partner environments.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers targeted managed service providers (MSPs) through ScreenConnect environments and used the platform\u0026rsquo;s Run Command feature to install unauthorized ScreenConnect remote-access clients on customer endpoints. Huntress reported that at least 288 endpoints across 48 organizations were compromised within 90 minutes, with roughly one-third affected during the first 10 minutes. Huntress believes the initial access involved an authentication flaw in RMM+ versions 1.0.31 and 1.0.32, which could accept an empty shared access key when one had not been configured.\u003c/p\u003e\n\n\u003cp\u003eThe attackers deployed SCKit, a toolkit containing 16 scripts and components intended to maintain remote access and spread through ScreenConnect-managed systems. Its RelayTrap component attempted to replace the legitimate ScreenConnect Guest process on an infected customer device and send a malicious file to an MSP technician\u0026rsquo;s computer when the technician connected, using CVE-2026-84869. Huntress and Blackpoint Cyber found no evidence that this worm-like technique succeeded, and Blackpoint\u0026rsquo;s testing showed that a current patched ScreenConnect client did not execute the payload. MSPs are urged to disable affected extensions, update ScreenConnect clients, investigate unauthorized remote-access installations, review Run Command and Toolbox activity, and avoid interactive sessions with potentially infected devices.\u003c/p\u003e\n"},{"n":17,"title":"Feds announce seizure of $1.2 billion from Binance theft; also takedown of ‘FaceStealer’ tools","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/stolen-binance-crypto-recovered-doj-facestealer-disrupted","time":"21:42","priority":"SHOULD READ","score":88,"tldr":"The U.S. Justice Department has seized or restrained more than $1.2 billion linked to North Korea’s TraderTraitor theft from Binance and disrupted FaceStealer infrastructure used to steal over $400 million through fake Zoom and Teams meetings. The campaign uses compromised accounts, prerecorded or deepfake video, and fake technical fixes to install malware and propagate to victims’ trusted contacts.","briefOverview":"\u003cp\u003eThe U.S. Justice Department obtained authorization to seize or restrain more than \u003cspan class=\"math inline\"\u003e\\(1.2 billion stolen in the Binance theft, part of \\)\u003c/span\u003e2.7 billion frozen by cryptocurrency platforms after the incident. Binance and the FBI attributed the theft to TraderTraitor, a North Korean hacking group. The Justice Department said tracing and recovery remain ongoing as the group launders assets through bridges, mixers, and exchanges. Authorities said the funds from large cryptocurrency thefts help support North Korea’s illicit weapons program.\u003c/p\u003e\n\n\u003cp\u003eThe FBI and Justice Department also disrupted cloud infrastructure supporting FaceStealer, a North Korean social-engineering campaign that allegedly stole more than $400 million in cryptocurrency over 18 months. Attackers use accounts taken from prior victims to send fake Calendly invitations to Zoom or Teams meetings, use prerecorded or AI-generated video to appear credible, and offer a fake technical fix that installs malware. That software can harvest browser cookies, record keystrokes and screens, and provide continuing access to the compromised computer. The campaign has targeted cryptocurrency organizations and open-source developers, including maintainers associated with NPM and Rust packages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Justice Department obtained court authorization to seize or restrain more than $1.2 billion stolen from Binance, part of $2.7 billion frozen by cryptocurrency platforms after the theft.","Binance and the FBI attributed the theft to TraderTraitor, a North Korean hacking group that continues to launder funds through cryptocurrency bridges, mixers, and exchanges.","The FBI and Justice Department disrupted cloud infrastructure used in the FaceStealer social-engineering campaign, which they said stole more than $400 million in cryptocurrency over 18 months.","FaceStealer operators use stolen accounts to send fake Calendly invitations to Zoom or Teams meetings, where a purported technical fix installs software that can capture browser information, keystrokes, screens, and provide ongoing access to a victim’s device.","The FBI said North Korean actors have also targeted cryptocurrency organizations and open-source software developers, including maintainers of NPM and Rust software packages."],"insights":["FaceStealer can expand through trusted networks because attackers use stolen chat histories and accounts to craft tailored invitations to a victim’s contacts, sometimes months after the original compromise.","The scheme uses recorded webcam footage of earlier victims and, in some cases, AI-generated videos of prominent cryptocurrency figures to make fake group meetings appear credible.","North Korean laundering activity includes creating worthless tokens and routing stolen assets through decentralized-exchange liquidity pools so funds do not move directly between wallets holding stolen assets and recipient wallets.","The campaign extends beyond cryptocurrency theft: access to a compromised developer’s computer could be used to target software infrastructure, and the FBI reported attempts against NPM and Rust package maintainers."],"referencedReports":[{"title":"Binance $5.5B Hack Using Advanced AI Models: Blockaid Detects the Biggest Theft in Crypto History","url":"https://blockaid.io/blog/binance-55b-hack-using-advanced-ai-models-blockaid-detects-the-biggest-theft-in-crypto-history","publisher":"blockaid","context":"The article cites Blockaid among blockchain security firms reporting that North Korea and other actors used novel automated methods to launder the stolen cryptocurrency.","category":"research","primary":false},{"title":"North Korea meme coins and the Binance hack","url":"https://www.elliptic.co/insights/north-korea-meme-coins-binance-hack/","publisher":"elliptic","context":"The article cites Elliptic’s analysis of North Korean launderers creating worthless tokens and using decentralized-exchange liquidity pools to obscure stolen-asset transfers.","category":"research","primary":false}],"body":"\u003cp\u003eThe U.S. Justice Department obtained authorization to seize or restrain more than \u003cspan class=\"math inline\"\u003e\\(1.2 billion stolen in the Binance theft, part of \\)\u003c/span\u003e2.7 billion frozen by cryptocurrency platforms after the incident. Binance and the FBI attributed the theft to TraderTraitor, a North Korean hacking group. The Justice Department said tracing and recovery remain ongoing as the group launders assets through bridges, mixers, and exchanges. Authorities said the funds from large cryptocurrency thefts help support North Korea’s illicit weapons program.\u003c/p\u003e\n\n\u003cp\u003eThe FBI and Justice Department also disrupted cloud infrastructure supporting FaceStealer, a North Korean social-engineering campaign that allegedly stole more than $400 million in cryptocurrency over 18 months. Attackers use accounts taken from prior victims to send fake Calendly invitations to Zoom or Teams meetings, use prerecorded or AI-generated video to appear credible, and offer a fake technical fix that installs malware. That software can harvest browser cookies, record keystrokes and screens, and provide continuing access to the compromised computer. The campaign has targeted cryptocurrency organizations and open-source developers, including maintainers associated with NPM and Rust packages.\u003c/p\u003e\n"},{"n":23,"title":"PTC Patches Critical Windchill and FlexPLM Flaw That Could Enable Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/ptc-patches-critical-windchill-and.html","time":"11:33","priority":"SHOULD READ","score":88,"tldr":"PTC has released patches for CVE-2026-126325, a critical deserialization flaw (CVSS 9.2) in Windchill and FlexPLM that could allow remote code execution. Organizations running self-hosted affected versions should patch immediately and monitor for web shells or other signs of compromise.","briefOverview":"\u003cp\u003ePTC has released patches for CVE-2026-126325, a critical remote code execution issue affecting Windchill and FlexPLM. The flaw has a CVSS v4 score of 9.2 and is described as improper input validation and deserialization of untrusted data. An attacker could exploit it with crafted requests to run code remotely on an affected system.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include multiple Windchill and FlexPLM versions from 11.0 M030 through specified 13.x releases. PTC said it has already applied the patches for environments it hosts, while self-hosted customers should install the updates as soon as possible. Organizations are also advised to monitor for code execution, backdoor access, and web shells, or restrict network access if immediate patching is not possible.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure comes after CVE-2026-12569, another critical Windchill and FlexPLM remote code execution flaw that was actively exploited. Cl0p-linked actors reportedly used that earlier issue to deploy JSP web shells and steal sensitive product data from manufacturing and industrial organizations. According to watchTowr, compromise of PTC software can enable data theft and disruption of industrial, logistics, and fulfillment processes, potentially creating material downtime costs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PTC released patches for CVE-2026-126325, a critical remote code execution flaw affecting Windchill and FlexPLM with a CVSS v4 score of 9.2.","The flaw involves improper input validation and deserialization of untrusted data, allowing remote code execution through crafted requests.","PTC said customers with Windchill or FlexPLM environments hosted by PTC have already had the patches applied.","Organizations running self-hosted affected systems are urged to patch as soon as possible and monitor for code execution, backdoor access, or web shells.","The disclosure follows CVE-2026-12569, another critical Windchill and FlexPLM remote code execution issue that was actively exploited by Cl0p-linked threat actors in a data-extortion campaign."],"insights":["PTC-hosted Windchill and FlexPLM environments have already been patched, while organizations operating their own environments must apply the fixes themselves.","If patching cannot happen immediately, the article recommends restricting network access to reduce the chance of compromise.","The earlier Windchill and FlexPLM flaw was reportedly used by Cl0p-linked actors to install JSP web shells and steal sensitive product data from manufacturing and industrial organizations.","Compromise of these systems can extend beyond data theft, potentially disrupting time-sensitive manufacturing, logistics, and fulfillment operations with material costs from downtime."],"referencedReports":[{"title":"Windchill \u0026 FlexPLM RCE Vulnerability","url":"https://www.ptc.com/en/about/trust-center/advisory-center/active-advisories/windchill-flexplm-rce-vulnerability","publisher":"ptc","context":"PTC's advisory states that patches have already been applied for PTC-hosted environments and urges self-hosted customers to patch promptly.","category":"advisory","primary":true}],"body":"\u003cp\u003ePTC has released patches for CVE-2026-126325, a critical remote code execution issue affecting Windchill and FlexPLM. The flaw has a CVSS v4 score of 9.2 and is described as improper input validation and deserialization of untrusted data. An attacker could exploit it with crafted requests to run code remotely on an affected system.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include multiple Windchill and FlexPLM versions from 11.0 M030 through specified 13.x releases. PTC said it has already applied the patches for environments it hosts, while self-hosted customers should install the updates as soon as possible. Organizations are also advised to monitor for code execution, backdoor access, and web shells, or restrict network access if immediate patching is not possible.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure comes after CVE-2026-12569, another critical Windchill and FlexPLM remote code execution flaw that was actively exploited. Cl0p-linked actors reportedly used that earlier issue to deploy JSP web shells and steal sensitive product data from manufacturing and industrial organizations. According to watchTowr, compromise of PTC software can enable data theft and disruption of industrial, logistics, and fulfillment processes, potentially creating material downtime costs.\u003c/p\u003e\n"},{"n":25,"title":"New N-central Exploits Work Against Patched Servers, Enable Root RCE and Windows SYSTEM Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/new-n-central-exploits-work-against.html","time":"11:51","priority":"SHOULD READ","score":88,"tldr":"New public exploits dubbed 4EverAble2Shell and Agent2Shell reportedly bypass N-able’s recent N-central patch, enabling unauthenticated root RCE on exposed servers and SYSTEM-level command execution on managed Windows agents. N-able says the server issue requires the non-default Legacy API to be enabled and internet-accessible, and urges customers to disable it immediately.","briefOverview":"\u003cp\u003eN-able is investigating newly disclosed vulnerabilities in on-premise N-central 2026.4.1 HF2 that reportedly remain exploitable after the company’s November 10, 2026 security update. Researcher Sean Bales has called the new issues 4EverAble2Shell and Agent2Shell, and stated that their proof-of-concept exploits work against patched build 2026.4.1.26. N-able said the server issue requires the Legacy API to be enabled and exposed to the public internet; the feature is disabled by default and is not recommended. Hosted N-central environments are not affected, according to the company.\u003c/p\u003e\n\n\u003cp\u003eBales said 4EverAble2Shell enables unauthenticated remote code execution with root privileges on N-central servers. He said Agent2Shell uses more than 10 zero-day vulnerabilities to run commands as NT AUTHORITY\\SYSTEM on managed Windows agents if an attacker knows the target appliance ID. N-able urged customers to disable the Legacy API immediately if it is enabled.\u003c/p\u003e\n\n\u003cp\u003ePrevidian reported observing targeted probes for 4EverAble2Shell within hours of the proof-of-concept release, although it said there was no evidence of successful exploitation at the time of writing. The observed activity attempted initial code execution through Apache Axis flaw CVE-2026-90436, then attempted to use 4EverAble2Shell to gain root privileges and download a shell script using curl. WatchTowr also reported seeing probes aimed at N-central builds with the Legacy API enabled.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able is investigating a public disclosure alleging additional vulnerabilities in on-premise N-central version 2026.4.1 HF2.","N-able said the server issue depends on the Legacy API being enabled and exposed to the public internet, although the feature is disabled by default and not recommended.","Researcher Sean Bales said the 4EverAble2Shell proof of concept can enable unauthenticated remote code execution with root privileges on N-central servers patched to build 2026.4.1.26.","Bales said Agent2Shell combines more than 10 zero-day vulnerabilities to run commands as NT AUTHORITY\\SYSTEM on managed Windows agents when an attacker knows the target appliance ID.","Previdian and watchTowr reported observing probes targeting 4EverAble2Shell, but Previdian said there was no evidence of successful exploitation at the time of writing."],"insights":["N-able’s November 10, 2026 update for the earlier Able2Shell flaws did not prevent the newly published 4EverAble2Shell and Agent2Shell proof-of-concept exploits from working against build 2026.4.1.26.","The reported server takeover risk is tied to a non-default exposure: the Legacy API must be both enabled and reachable from the public internet, making disabling that feature an immediate mitigation identified by N-able.","Observed activity combined an attempt to gain initial access through Apache Axis flaw CVE-2026-90436 with an attempted 4EverAble2Shell privilege increase to root, showing the flaws being probed as part of a multi-step sequence.","Managed Windows agents may be affected separately from the N-central server because Agent2Shell reportedly can run commands as the highest Windows system account if the attacker knows the appliance ID."],"referencedReports":[{"title":"N-central Legacy API advisory","url":"https://uptime.n-able.com/event/202609/","publisher":"n-able","context":"N-able’s advisory states that the reported server issue requires the Legacy API to be enabled and exposed to the public internet, and urges customers to disable it.","category":"advisory","primary":true},{"title":"N-Central N-Able zero-day disclosures","url":"https://github.com/MSPNightmare/CVEs/tree/main/0-Days/N-Central%20N-Able","publisher":"sean-bales","context":"The article cites Sean Bales’s technical disclosure and proof-of-concept exploits for 4EverAble2Shell and Agent2Shell.","category":"research","primary":true},{"title":"VULN-2026-0009 telemetry","url":"https://previdian.com/VULN-2026-0009#telemetry","publisher":"previdian","context":"Previdian’s telemetry reports targeted probing for 4EverAble2Shell following the public proof-of-concept release.","category":"research","primary":false}],"body":"\u003cp\u003eN-able is investigating newly disclosed vulnerabilities in on-premise N-central 2026.4.1 HF2 that reportedly remain exploitable after the company’s November 10, 2026 security update. Researcher Sean Bales has called the new issues 4EverAble2Shell and Agent2Shell, and stated that their proof-of-concept exploits work against patched build 2026.4.1.26. N-able said the server issue requires the Legacy API to be enabled and exposed to the public internet; the feature is disabled by default and is not recommended. Hosted N-central environments are not affected, according to the company.\u003c/p\u003e\n\n\u003cp\u003eBales said 4EverAble2Shell enables unauthenticated remote code execution with root privileges on N-central servers. He said Agent2Shell uses more than 10 zero-day vulnerabilities to run commands as NT AUTHORITY\\SYSTEM on managed Windows agents if an attacker knows the target appliance ID. N-able urged customers to disable the Legacy API immediately if it is enabled.\u003c/p\u003e\n\n\u003cp\u003ePrevidian reported observing targeted probes for 4EverAble2Shell within hours of the proof-of-concept release, although it said there was no evidence of successful exploitation at the time of writing. The observed activity attempted initial code execution through Apache Axis flaw CVE-2026-90436, then attempted to use 4EverAble2Shell to gain root privileges and download a shell script using curl. WatchTowr also reported seeing probes aimed at N-central builds with the Legacy API enabled.\u003c/p\u003e\n"},{"n":26,"title":"SCKit Malware Turns ScreenConnect Support Sessions Into Potential MSP Attack Paths","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sckit-malware-targets-screenconnect.html","time":"13:08","priority":"SHOULD READ","score":88,"tldr":"The SCKit toolkit abuses a patched ScreenConnect flaw and stolen technician sessions to turn managed endpoints into potential paths into MSP environments. Patching blocks the known CVE-2026-84869 exploit, but organizations must also secure operator sessions, investigate rogue Access clients and extensions, and protect technician workstations.","briefOverview":"\u003cp\u003eThe SCKit campaign targeting ConnectWise ScreenConnect uses the already patched CVE-2026-84869 flaw rather than a new vulnerability. Blackpoint Cyber said a fully patched ScreenConnect client blocked the exploit payload in testing. However, the toolkit can also hijack authenticated operator sessions and use legitimate ScreenConnect management capabilities to push malicious commands.\u003c/p\u003e\n\n\u003cp\u003eSCKit includes RelayTrap, which attempts to infect the workstation of a technician who connects to investigate a suspicious managed endpoint. It can deploy unauthorized ScreenConnect Access clients for persistent control, then search a technician’s browser data and process memory for authenticated ScreenConnect session cookies. Those sessions could allow an attacker to distribute commands to other endpoints managed by that technician, potentially extending an intrusion across customer environments.\u003c/p\u003e\n\n\u003cp\u003eConnectWise disabled five third-party extensions as a precaution, and Huntress identified a flaw in RMM+ versions 1.0.31 and 1.0.32 that could accept a blank access key when none was configured. The article states that there is no evidence that the campaign successfully propagated to a technician workstation or bypassed the CVE-2026-84869 patch. Blackpoint Cyber emphasized protecting operator sessions and reviewing rogue Access installations, administrative command histories, technician workstations, and browser sessions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The SCKit toolkit exploits the patched ScreenConnect flaw CVE-2026-84869 to transfer files and execute code through an active remote session without authorization or host confirmation.","Blackpoint Cyber said testing confirmed that fully patched ScreenConnect clients block the CVE-2026-84869 payload, but the toolkit can also hijack authenticated operator sessions and abuse legitimate management features.","SCKit includes RelayTrap functionality that attempts to infect the workstation of a technician who connects to investigate a compromised managed endpoint.","After reaching a technician workstation, the malware searches browser data and process memory for authenticated ScreenConnect session cookies that could let attackers send commands to other endpoints.","ConnectWise disabled five third-party extensions as a precaution, while Huntress identified a blank-default access-key flaw in RMM+ versions 1.0.31 and 1.0.32; the article states there is no evidence of successful technician-workstation propagation or a patch bypass."],"insights":["Patching ScreenConnect blocks the known CVE-2026-84869 exploit, but it does not prevent attackers from abusing a technician’s already authenticated ScreenConnect session to distribute commands through normal management features.","RelayTrap is designed to turn a support investigation into an infection opportunity by sending a malicious payload back toward the technician who connects to an affected endpoint.","RMM+ versions 1.0.31 and 1.0.32 could accept a blank access key when none was configured, potentially allowing commands to reach endpoints without ScreenConnect login activity or its normal authentication controls.","The reported campaign illustrates why MSP investigations must examine the management relationship as well as the initially affected machine, including technician workstations, browser sessions, command histories, and unauthorized ScreenConnect Access installations."],"referencedReports":[{"title":"SCKit Attack","url":"https://blackpointcyber.com/blog/screenconnect-attack-sckit/","publisher":"blackpoint-cyber","context":"Blackpoint Cyber's Adversary Pursuit Group published the technical analysis describing the recovered SCKit toolkit, its use of CVE-2026-84869, session hijacking, and RelayTrap.","category":"research","primary":true},{"title":"SCKit Worm Rogue ScreenConnect","url":"https://www.huntress.com/blog/sckit-worm-rogue-screenconnect","publisher":"huntress","context":"Huntress's update is cited for its finding that RMM+ versions 1.0.31 and 1.0.32 could accept a blank access key and allow unauthorized commands.","category":"research","primary":false}],"body":"\u003cp\u003eThe SCKit campaign targeting ConnectWise ScreenConnect uses the already patched CVE-2026-84869 flaw rather than a new vulnerability. Blackpoint Cyber said a fully patched ScreenConnect client blocked the exploit payload in testing. However, the toolkit can also hijack authenticated operator sessions and use legitimate ScreenConnect management capabilities to push malicious commands.\u003c/p\u003e\n\n\u003cp\u003eSCKit includes RelayTrap, which attempts to infect the workstation of a technician who connects to investigate a suspicious managed endpoint. It can deploy unauthorized ScreenConnect Access clients for persistent control, then search a technician’s browser data and process memory for authenticated ScreenConnect session cookies. Those sessions could allow an attacker to distribute commands to other endpoints managed by that technician, potentially extending an intrusion across customer environments.\u003c/p\u003e\n\n\u003cp\u003eConnectWise disabled five third-party extensions as a precaution, and Huntress identified a flaw in RMM+ versions 1.0.31 and 1.0.32 that could accept a blank access key when none was configured. The article states that there is no evidence that the campaign successfully propagated to a technician workstation or bypassed the CVE-2026-84869 patch. Blackpoint Cyber emphasized protecting operator sessions and reviewing rogue Access installations, administrative command histories, technician workstations, and browser sessions.\u003c/p\u003e\n"},{"n":30,"title":"Citrix Patches 12 NetScaler and Secure Access Client Flaws, Including Authentication Bypass","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/citrix-patches-12-netscaler-and-secure.html","time":"15:38","priority":"SHOULD READ","score":88,"tldr":"Citrix released patches for 12 high- and critical-severity flaws in NetScaler products and Secure Access Client, including an unauthenticated NetScaler Console authentication bypass and multiple memory-corruption issues that can cause denial of service. Organizations should promptly update affected NetScaler ADC, Gateway, Console, and client installations; Citrix says no active exploitation is known.","briefOverview":"\u003cp\u003eCitrix has released security updates for 12 flaws affecting NetScaler ADC, NetScaler Gateway, NetScaler Console, and Secure Access Client for Windows and Linux. The issues include multiple critical NetScaler memory overflow and memory corruption bugs with CVSS scores ranging from 9.3 to 9.5. Depending on the affected configuration, these bugs can cause unpredictable behavior or denial of service. Citrix said it is not aware of exploitation of the disclosed vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe NetScaler issues affect particular features and deployments, including SMPP load balancing, DNS and DNS-over-HTTPS, NetScaler Push, Email OTP, Endpoint Analysis, ICA proxy, and Gateway or AAA virtual servers. CVE-2026-107412, rated 9.5, affects NetScaler configured as a Gateway or AAA virtual server and can lead to unpredictable behavior and denial of service. Citrix also fixed CVE-2026-120869, a 9.4-rated NetScaler Console authentication flaw that could let an unauthenticated attacker bypass controls and access restricted appliance resources. Updates are available for supported NetScaler ADC and Gateway release branches, with NetScaler Console fixed in version 14.1-74.34 and later.\u003c/p\u003e\n\n\u003cp\u003eSecure Access Client for Windows and Linux also received fixes for privilege-management flaws rated 8.5. The Windows issue could allow a low-privileged user to elevate privileges to SYSTEM, while the Linux issue could allow a low-privileged user to gain root privileges. Citrix said the updates followed a deeper code review that used AI-assisted analysis to identify and resolve vulnerabilities. The company urged customers to apply the patches to improve their NetScaler security posture.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix released patches for 12 security flaws affecting NetScaler ADC, NetScaler Gateway, NetScaler Console, and Secure Access Client for Windows and Linux.","Nine critical NetScaler ADC and Gateway flaws, with CVSS scores from 9.3 to 9.5, can cause unpredictable behavior or denial of service in affected configurations.","CVE-2026-120869 is an authentication flaw in NetScaler Console that can allow an unauthenticated attacker to bypass login controls and access restricted appliance resources.","Secure Access Client flaws CVE-2026-118268 and CVE-2026-118269 could allow low-privileged users on Windows or Linux to obtain SYSTEM or root privileges, respectively.","Citrix said it is not aware of exploitation of the disclosed flaws and urged customers to apply the updates."],"insights":["The NetScaler issues are configuration-dependent, so organizations can prioritize review based on whether they use features such as SMPP, DNS-over-HTTPS, NetScaler Push, Email OTP, Endpoint Analysis, or ICA proxy.","The most severe listed NetScaler issue is CVE-2026-107412 with a CVSS score of 9.5, and it affects deployments configured as a Gateway or AAA virtual server.","The NetScaler Console flaw is especially notable because it can be used without logging in to access restricted appliance resources.","The Secure Access Client issues require an existing low-privileged local user, but could elevate that user to SYSTEM on Windows or root on Linux.","Citrix said the fixes resulted from a deeper codebase review using AI-assisted code analysis, rather than from known active exploitation."],"referencedReports":[{"title":"Citrix NetScaler ADC and NetScaler Gateway Security Advisory","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697305","publisher":"citrix","context":"The article cites this Citrix advisory for the critical NetScaler ADC and NetScaler Gateway vulnerabilities and their fixed versions.","category":"advisory","primary":true},{"title":"Citrix NetScaler Console Security Advisory","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697320","publisher":"citrix","context":"The article cites this Citrix advisory for CVE-2026-120869, an authentication-bypass issue in NetScaler Console.","category":"advisory","primary":true},{"title":"Citrix Secure Access Client for Windows Security Advisory","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697280","publisher":"citrix","context":"The article cites this Citrix advisory for CVE-2026-118268, a Windows Secure Access Client privilege-management flaw.","category":"advisory","primary":true},{"title":"Citrix Secure Access Client for Linux Security Advisory","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697281","publisher":"citrix","context":"The article cites this Citrix advisory for CVE-2026-118269, a Linux Secure Access Client privilege-management flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eCitrix has released security updates for 12 flaws affecting NetScaler ADC, NetScaler Gateway, NetScaler Console, and Secure Access Client for Windows and Linux. The issues include multiple critical NetScaler memory overflow and memory corruption bugs with CVSS scores ranging from 9.3 to 9.5. Depending on the affected configuration, these bugs can cause unpredictable behavior or denial of service. Citrix said it is not aware of exploitation of the disclosed vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe NetScaler issues affect particular features and deployments, including SMPP load balancing, DNS and DNS-over-HTTPS, NetScaler Push, Email OTP, Endpoint Analysis, ICA proxy, and Gateway or AAA virtual servers. CVE-2026-107412, rated 9.5, affects NetScaler configured as a Gateway or AAA virtual server and can lead to unpredictable behavior and denial of service. Citrix also fixed CVE-2026-120869, a 9.4-rated NetScaler Console authentication flaw that could let an unauthenticated attacker bypass controls and access restricted appliance resources. Updates are available for supported NetScaler ADC and Gateway release branches, with NetScaler Console fixed in version 14.1-74.34 and later.\u003c/p\u003e\n\n\u003cp\u003eSecure Access Client for Windows and Linux also received fixes for privilege-management flaws rated 8.5. The Windows issue could allow a low-privileged user to elevate privileges to SYSTEM, while the Linux issue could allow a low-privileged user to gain root privileges. Citrix said the updates followed a deeper code review that used AI-assisted analysis to identify and resolve vulnerabilities. The company urged customers to apply the patches to improve their NetScaler security posture.\u003c/p\u003e\n"},{"n":32,"title":"Critical Pre-Auth MongoDB Flaw (CVE-2026-118383) Can Crash Lagging Servers on Failover","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-pre-auth-mongodb-flaw-cve-2026.html","time":"09:25","priority":"SHOULD READ","score":88,"tldr":"MongoDB CVE-2026-118383 is a critical pre-authentication use-after-free flaw that can crash a vulnerable lagging replica-set member if it later becomes primary. Organizations should upgrade all self-managed replica-set members to MongoDB’s fixed releases and restrict database network access until patching is complete.","briefOverview":"\u003cp\u003eMongoDB released fixes for CVE-2026-118383, a critical use-after-free flaw rated 9.5 out of 10 under CVSS 4.0. Datadog Security Labs reported that an unauthenticated client can send two specially crafted ping requests to a vulnerable replica-set member, even when authentication is enabled. The member does not immediately crash; the failure requires it to later be elected as the main server while it is missing recent changes. MongoDB said it was not aware of attempts to exploit the issue.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs during the elected member\u0026rsquo;s catch-up process, when cleanup can run twice and reuse memory that has already been freed, causing a crash before the new main server accepts writes. It affects replica-set members, including shard and configuration server members in sharded clusters, but not a standalone MongoDB server. MongoDB Atlas clusters will receive fixed versions during maintenance, while self-managed deployments need to upgrade every replica-set member and verify versions on containers and previously offline members. Until upgrades are complete, researchers recommend limiting database network access to only required systems, though this does not eliminate the flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-118383 is a MongoDB Server use-after-free flaw that can be triggered by two unauthenticated ping requests containing readConcern.afterOpTime values.","The vulnerable server crashes only if it is later elected primary while it is behind on recent changes, causing cleanup during its catch-up process to run twice.","MongoDB rated the flaw 9.5 out of 10 under CVSS 4.0 and released fixed versions for affected branches, while stating it was not aware of exploitation attempts.","The issue affects replica-set members, including shard and config server members in sharded clusters, but does not affect standalone mongod deployments.","MongoDB Atlas clusters will receive fixes during maintenance, while self-managed users should upgrade every replica-set member and restrict database network access until upgrades are complete."],"insights":["Enabling authentication alone does not stop the two malicious requests on vulnerable versions, even though the requests can be sent by a client without credentials.","The planted request state can remain on a server until it restarts, rolls back changes, or stops being the primary server, meaning the triggering requests may occur well before a later failover.","An attacker cannot directly make the targeted server fall behind, win the election, or determine when those conditions occur, which limits their control over when a crash happens.","Administrators can investigate suspected activity by correlating unauthenticated slow ping queries with two catch-up exit log events and a subsequent crash involving CatchupState::abort_inlock().","MongoDB 8.2 is no longer supported and is absent from the affected-version list, but a published proof of concept reported the issue in a lab test of version 8.2.12 using a test-only setting."],"referencedReports":[{"title":"CVE-2026-118383: MongoDB Server Use-After-Free","url":"https://securitylabs.datadoghq.com/articles/cve-2026-118383-mongodb-server-use-after-free/","publisher":"datadog-security-labs","context":"The article cites Datadog Security Labs' technical analysis for its explanation of the crash mechanism and laboratory reproduction results.","category":"research","primary":true},{"title":"Important MongoDB Security Update Available: Action Required – November 10, 2026","url":"https://www.mongodb.com/community/forums/t/important-mongodb-security-update-available-action-required-november-10-2026/344843","publisher":"mongodb","context":"The article cites MongoDB's security announcement for patch availability and Atlas maintenance information.","category":"advisory","primary":true}],"body":"\u003cp\u003eMongoDB released fixes for CVE-2026-118383, a critical use-after-free flaw rated 9.5 out of 10 under CVSS 4.0. Datadog Security Labs reported that an unauthenticated client can send two specially crafted ping requests to a vulnerable replica-set member, even when authentication is enabled. The member does not immediately crash; the failure requires it to later be elected as the main server while it is missing recent changes. MongoDB said it was not aware of attempts to exploit the issue.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs during the elected member\u0026rsquo;s catch-up process, when cleanup can run twice and reuse memory that has already been freed, causing a crash before the new main server accepts writes. It affects replica-set members, including shard and configuration server members in sharded clusters, but not a standalone MongoDB server. MongoDB Atlas clusters will receive fixed versions during maintenance, while self-managed deployments need to upgrade every replica-set member and verify versions on containers and previously offline members. Until upgrades are complete, researchers recommend limiting database network access to only required systems, though this does not eliminate the flaw.\u003c/p\u003e\n"},{"n":35,"title":"Node.js Fixes 16 Flaws, Including HTTP/2 Bugs That Crash Servers and Leak Other Connections' Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/nodejs-fixes-16-flaws-including-http2.html","time":"08:20","priority":"SHOULD READ","score":88,"tldr":"Node.js released security updates for supported 22.x, 24.x, and 26.x lines fixing 16 flaws, including HTTP/2 and HTTPS bugs that can crash servers, leak memory or other connections’ data, and potentially expose TLS private keys. Organizations running Node.js servers should upgrade to 22.23.5, 24.22.3, or 26.13.1 immediately, as no workarounds are listed and end-of-life versions remain vulnerable.","briefOverview":"\u003cp\u003eNode.js released versions 22.23.5, 24.22.3, and 26.13.1 to fix 16 vulnerabilities, including seven rated high severity. The issues affect the runtime’s built-in HTTP/2, HTTPS, and TLS server code, making them relevant where a Node.js process directly accepts those connections. Node.js lists updating as the only fix and provides no workaround for servers that cannot update.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-123863 can let an unauthenticated client crash default HTTP/2 servers on 24.x and 26.x when a response is sent before the full request body arrives, which the project describes as typical behavior. CVE-2026-123866 can cause HTTP/2 servers on all supported lines to send clients pieces of memory, including responses intended for other connections. A separate HTTPS flaw, CVE-2026-123864, can expose memory from other connections, including TLS private keys and other users’ requests, under specific handler conditions. End-of-life Node.js versions, including 20.x and 25.x, receive no fix and are always affected, while the advisory reports no known exploitation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Node.js released versions 22.23.5, 24.22.3, and 26.13.1 to address 16 vulnerabilities, seven of which are rated high severity.","CVE-2026-123863 can allow an unauthenticated client to crash default Node.js HTTP/2 servers on the 24.x and 26.x release lines when the server responds before the request body fully arrives.","CVE-2026-123866 can cause a Node.js HTTP/2 server to send a client portions of memory that may include responses intended for other connections, and it affects all three supported release lines.","CVE-2026-123864 affects Node.js HTTPS servers and can allow an unauthenticated client to read memory from other connections, including TLS private keys and other users' requests, under specific handler conditions.","Node.js lists updating as the only fix, provides no workaround for servers that cannot update, and states that end-of-life lines including 20.x and 25.x receive no fixes."],"insights":["The HTTP/2 crash flaw CVE-2026-123863 can affect typical server behavior because it requires only that a server respond before the full request body arrives, and it works over both encrypted and unencrypted connections.","The HTTPS memory-disclosure flaw CVE-2026-123864 applies only to handlers that send headers early with res.flushHeaders() and later finish with data, but leaked memory can include TLS private keys and other users' requests if a route also returns or stores request bodies.","Node.js HTTP/2 file-serving endpoints using stream.respondWithFile() or stream.respondWithFD() have distinct risks: memory corruption on 24.x and 26.x and server crashes from canceled downloads on all supported lines.","A TLS 1.2 renegotiation issue can let a client accepted for one hostname change to another hostname with stricter client-certificate requirements without satisfying those stricter rules.","The advisory reports no known attacks, but it offers no workaround for servers that cannot update and leaves end-of-life Node.js lines, including 20.x and 25.x, without fixes."],"referencedReports":[{"title":"November 2026 Security Releases","url":"https://nodejs.org/en/blog/vulnerability/november-2026-security-releases","publisher":"node-js-project","context":"The article cites the Node.js security advisory for vulnerability details, affected versions, and the absence of workarounds.","category":"advisory","primary":true}],"body":"\u003cp\u003eNode.js released versions 22.23.5, 24.22.3, and 26.13.1 to fix 16 vulnerabilities, including seven rated high severity. The issues affect the runtime’s built-in HTTP/2, HTTPS, and TLS server code, making them relevant where a Node.js process directly accepts those connections. Node.js lists updating as the only fix and provides no workaround for servers that cannot update.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-123863 can let an unauthenticated client crash default HTTP/2 servers on 24.x and 26.x when a response is sent before the full request body arrives, which the project describes as typical behavior. CVE-2026-123866 can cause HTTP/2 servers on all supported lines to send clients pieces of memory, including responses intended for other connections. A separate HTTPS flaw, CVE-2026-123864, can expose memory from other connections, including TLS private keys and other users’ requests, under specific handler conditions. End-of-life Node.js versions, including 20.x and 25.x, receive no fix and are always affected, while the advisory reports no known exploitation.\u003c/p\u003e\n"},{"n":45,"title":"Attackers Use Autonomous AI to Target Semiconductor, Defense and Civil Society Sectors","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/","time":"15:00","priority":"SHOULD READ","score":88,"tldr":"Unit 42 reports that a suspected China-linked group used the open-source Cairn AI agent framework with Chinese language models to autonomously target 19 organizations in semiconductor, defense, and civil-society sectors, gaining unauthorized access or data from 10. The campaign scaled known, preventable weaknesses—such as weak credentials, authentication bypasses, and exposed APIs—rather than using novel exploits.","briefOverview":"\u003cp\u003eUnit 42 reported that Chinese-speaking attackers used the open-source Cairn AI penetration-testing framework to conduct 25 operations against at least 19 organizations from August through September 2026. The targets included organizations in the advanced semiconductor supply chain, U.S. defense and defense policy, and human rights and civil society. Unit 42 assesses with moderate confidence that the activity, tracked as CL-STA-1238, represents China-nexus intelligence collection.\u003c/p\u003e\n\n\u003cp\u003eThe attackers paired Cairn with Zhipu GLM 5.2 and DeepSeek V4 Flash and Pro models, supplying a target and a short goal while the framework mapped the target, planned actions, executed them, and recorded findings. The investigation found unauthorized access or data retrieval at 10 organizations, including access to more than one million member records at a U.S. teachers’ union, military and government-linked identities, and persistent administrator accounts in a semiconductor company’s production system. The article says the campaign increased the volume and coverage of attacks through autonomous operation, but it primarily relied on known weaknesses such as weak credentials, authentication bypasses, exposed cloud APIs, and older public CVEs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["From August through September 2026, Chinese-speaking attackers used the open-source Cairn penetration-testing framework with Zhipu GLM and DeepSeek models to conduct 25 operations against at least 19 organizations.","Unit 42 assessed with moderate confidence that the activity, tracked as CL-STA-1238, was a China-nexus intelligence-collection campaign targeting semiconductor and advanced manufacturing, U.S. defense and policy, and human-rights and civil-society organizations.","Cairn let attackers provide a target and a goal while an AI worker mapped targets, selected actions, executed them, and recorded confirmed findings through repeated planning and exploration cycles.","The investigation found unauthorized access or data retrieval at 10 targeted organizations, including more than one million member records at a U.S. teachers’ union and the creation of persistent administrator accounts at a semiconductor company.","The campaign primarily exploited known weaknesses, including authentication bypasses, insecure direct object references, mass-assignment privilege escalation, weak or default credentials, exposed cloud APIs, and older public CVEs."],"insights":["The attackers needed only to provide a target and a brief objective, while Cairn independently built target-specific plans spanning three to seven stages and chose follow-on actions from confirmed results.","A simple false claim that every task was authorized, reinforced by an AUTHORIZATION.md file, was sufficient for the Zhipu GLM and DeepSeek models used in the campaign to continue performing offensive tasks without refusing.","The attackers appear to have compared model performance by retrying resistant targets with the higher-tier DeepSeek V4 Pro after using DeepSeek V4 Flash.","Individual operations ran from 20 minutes to more than 50 hours without an attacker-imposed time limit, illustrating how automated campaigns can continue pursuing objectives beyond direct human working hours.","The article concludes that the AI system increased the number and coverage of intrusion attempts, but the successful activity still relied on familiar weaknesses such as weak credentials, authentication flaws, exposed cloud interfaces, and older publicly known software flaws."],"referencedReports":[],"body":"\u003cp\u003eUnit 42 reported that Chinese-speaking attackers used the open-source Cairn AI penetration-testing framework to conduct 25 operations against at least 19 organizations from August through September 2026. The targets included organizations in the advanced semiconductor supply chain, U.S. defense and defense policy, and human rights and civil society. Unit 42 assesses with moderate confidence that the activity, tracked as CL-STA-1238, represents China-nexus intelligence collection.\u003c/p\u003e\n\n\u003cp\u003eThe attackers paired Cairn with Zhipu GLM 5.2 and DeepSeek V4 Flash and Pro models, supplying a target and a short goal while the framework mapped the target, planned actions, executed them, and recorded findings. The investigation found unauthorized access or data retrieval at 10 organizations, including access to more than one million member records at a U.S. teachers’ union, military and government-linked identities, and persistent administrator accounts in a semiconductor company’s production system. The article says the campaign increased the volume and coverage of attacks through autonomous operation, but it primarily relied on known weaknesses such as weak credentials, authentication bypasses, exposed cloud APIs, and older public CVEs.\u003c/p\u003e\n"},{"n":47,"title":"Emerging Threat: (CVE-2026-119618) Apache HTTP Server Remote Code Execution via mod_http2","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-119618-apache-http-server-remote-code-execution-via-mod_http2/","time":"17:29","priority":"SHOULD READ","score":88,"tldr":"Apache HTTP Server versions 2.4.55–2.4.70 with mod_http2 and HTTP/2 enabled are vulnerable to pre-authentication remote code execution via CVE-2026-119618; upgrade to 2.4.71 or later or disable h2/h2c until patched.","briefOverview":"\u003cp\u003eCVE-2026-119618 is a critical race condition in Apache HTTP Server’s mod_http2 component that can corrupt memory in a server child process and may enable remote code execution. An attacker needs only network access to a server that accepts HTTP/2 connections, with no authentication or user interaction required. The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 when mod_http2 is loaded and HTTP/2 is enabled through the Protocols directive. The article states that there are no public reports of exploitation in the wild and that the flaw is not listed in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include public web servers, reverse proxies, and load-balancing tiers that run Apache with HTTP/2 enabled, including potentially overlooked bundled builds in appliances and base images. Apache fixed the vulnerability in version 2.4.71, released on November 11, 2026, though organizations using operating-system packages or vendor-bundled builds should confirm that fixes have been backported. Until patching is confirmed, defenders should inventory internet-facing Apache servers, identify h2 or h2c configurations, disable HTTP/2 where it is not required, and monitor logs for repeated child-process crashes or segmentation faults. The article also recommends disabling cleartext h2c on servers exposed to untrusted networks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-119618 is a critical race condition in Apache HTTP Server's mod_http2 that can corrupt memory and may allow remote code execution without authentication.","Apache HTTP Server versions 2.4.55 through 2.4.70 are affected when mod_http2 is loaded and HTTP/2 is enabled through the Protocols directive.","Apache fixed the issue in version 2.4.71, released on November 11, 2026.","The article states that the vulnerability is not listed in CISA's Known Exploited Vulnerabilities catalog and that there are no public reports of exploitation in the wild.","Until patching is confirmed, defenders should identify exposed Apache servers, check whether h2 or h2c is enabled, and disable HTTP/2 where it is not needed."],"insights":["External exposure identification is imperfect because most observed systems were identified by service fingerprint rather than confirmed version detection, and HTTP/2 enablement cannot always be verified from outside the server.","The risk can be overlooked because affected Apache servers often operate as front-end layers for applications owned by other teams, while appliances and infrequently rebuilt base images may contain bundled Apache versions.","Disabling cleartext HTTP/2 (h2c) on systems exposed to untrusted networks is a specific interim measure while patch availability is confirmed.","Repeated child-process crashes or segmentation faults in Apache error logs may help defenders identify signs consistent with the memory-corruption issue.","Organizations using operating-system packages or vendor-bundled Apache builds should verify vendor backports directly, since package availability and fixed standalone mod_h2 releases were not uniformly confirmed."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-119618 is a critical race condition in Apache HTTP Server’s mod_http2 component that can corrupt memory in a server child process and may enable remote code execution. An attacker needs only network access to a server that accepts HTTP/2 connections, with no authentication or user interaction required. The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 when mod_http2 is loaded and HTTP/2 is enabled through the Protocols directive. The article states that there are no public reports of exploitation in the wild and that the flaw is not listed in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include public web servers, reverse proxies, and load-balancing tiers that run Apache with HTTP/2 enabled, including potentially overlooked bundled builds in appliances and base images. Apache fixed the vulnerability in version 2.4.71, released on November 11, 2026, though organizations using operating-system packages or vendor-bundled builds should confirm that fixes have been backported. Until patching is confirmed, defenders should inventory internet-facing Apache servers, identify h2 or h2c configurations, disable HTTP/2 where it is not required, and monitor logs for repeated child-process crashes or segmentation faults. The article also recommends disabling cleartext h2c on servers exposed to untrusted networks.\u003c/p\u003e\n"},{"n":5,"title":"New Windows SignDrop zero-day gives hackers SYSTEM privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-windows-signdrop-zero-day-gives-hackers-system-privileges/","time":"16:04","priority":"SHOULD READ","score":87,"tldr":"Researcher Abdelhamid Naceri released SignDrop, an unpatched Windows zero-day that abuses CLFS authentication-file handling to potentially elevate local privileges to SYSTEM and bypass antimalware tamper protection on many Windows systems.","briefOverview":"\u003cp\u003eSecurity researcher Abdelhamid Naceri, also known as Nightmare Eclipse, released SignDrop, a Windows zero-day proof of concept that can give attackers SYSTEM-level privileges. The flaw affects the Common Log File System (CLFS) driver’s handling of authentication files created for new log files. Naceri said it abuses a Microsoft mitigation introduced in October 2025 to defend against authentication attacks targeting CLFS vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eAccording to Naceri, CLFS performs access checks correctly when a log file is created, but its logic can be abused when a privileged process later opens that file. Processes such as Windows Defender can be forced to open the files, causing an authentication file to be created with SYSTEM privileges and the original file’s permissions. Naceri said this can bypass antimalware tamper protection because the file-creation request appears to come from the antimalware process itself.\u003c/p\u003e\n\n\u003cp\u003eNaceri tested SignDrop on Windows 11 26H2, Windows 11 26H2 Experimental, and Windows Server 2025 Experimental, and estimated that 80% of Windows installations are vulnerable. He said systems can be checked with the proof of concept or by examining the CLFS Authentication Mode registry value, where values of 0 or 1 indicate vulnerability. There is currently no solution other than waiting for a Microsoft patch, since disabling the CLFS mitigation would expose devices to memory-corruption attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Abdelhamid Naceri released SignDrop, a Windows zero-day proof of concept that can grant SYSTEM-level privileges by abusing CLFS authentication-file creation.","The flaw stems from CLFS logic that can create an authentication file with SYSTEM privileges when a privileged process, such as Windows Defender, later opens a log file.","Naceri said the technique can bypass antimalware self-defense because arbitrary file creation can appear to originate from the antimalware product’s legitimate process.","Naceri tested SignDrop on Windows 11 26H2, Windows 11 26H2 Experimental, and Windows Server 2025 Experimental, and estimated that 80% of Windows installations are vulnerable.","There is currently no solution other than waiting for a Microsoft patch, because disabling the CLFS mitigation would expose devices to memory-corruption attacks."],"insights":["A Microsoft mitigation introduced in October 2025 to reduce CLFS-related authentication attacks is itself the condition that enables SignDrop’s abuse path.","A device can be checked for exposure by running the proof of concept or inspecting the CLFS Authentication\\Mode registry value; values of 0 or 1 indicate vulnerability according to Naceri.","The technique can cause a privileged process such as Windows Defender to create files under its own identity, which Naceri said allows it to bypass the self-protection mechanisms of antimalware products.","Disabling the CLFS mitigation is not presented as a safe workaround because it would reopen systems to attacks using CLFS memory-corruption flaws."],"referencedReports":[],"body":"\u003cp\u003eSecurity researcher Abdelhamid Naceri, also known as Nightmare Eclipse, released SignDrop, a Windows zero-day proof of concept that can give attackers SYSTEM-level privileges. The flaw affects the Common Log File System (CLFS) driver’s handling of authentication files created for new log files. Naceri said it abuses a Microsoft mitigation introduced in October 2025 to defend against authentication attacks targeting CLFS vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eAccording to Naceri, CLFS performs access checks correctly when a log file is created, but its logic can be abused when a privileged process later opens that file. Processes such as Windows Defender can be forced to open the files, causing an authentication file to be created with SYSTEM privileges and the original file’s permissions. Naceri said this can bypass antimalware tamper protection because the file-creation request appears to come from the antimalware process itself.\u003c/p\u003e\n\n\u003cp\u003eNaceri tested SignDrop on Windows 11 26H2, Windows 11 26H2 Experimental, and Windows Server 2025 Experimental, and estimated that 80% of Windows installations are vulnerable. He said systems can be checked with the proof of concept or by examining the CLFS Authentication Mode registry value, where values of 0 or 1 indicate vulnerability. There is currently no solution other than waiting for a Microsoft patch, since disabling the CLFS mitigation would expose devices to memory-corruption attacks.\u003c/p\u003e\n"},{"n":19,"title":"Kazakhstan-linked hackers used AI agent to spy on Central Asian governments","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/kazakhstan-hackers-central-asia","time":"13:00","priority":"SHOULD READ","score":86,"tldr":"Kazakhstan-linked espionage group Silent Lynx used a DeepSeek-powered Hermes AI agent, controlled through Telegram, to automate reconnaissance, data theft and cleanup during intrusions into Central Asian government networks. The group reportedly accessed Tajikistan’s railway and government document systems and also compromised an Uzbek forestry platform.","briefOverview":"\u003cp\u003eCloudSEK reported that suspected Kazakhstan-linked group Silent Lynx used the open-source Hermes AI agent, primarily powered by DeepSeek models, in espionage operations against Central Asian government targets. The researchers found an exposed Silent Lynx server containing more than a dozen gigabytes of stolen government documents, hacking tools, and records showing the AI agent’s use. The operator communicated with the agent in Russian and linked it to a Telegram bot to send instructions remotely from a phone.\u003c/p\u003e\n\n\u003cp\u003eThe agent assisted with reconnaissance, data collection, and removing evidence from compromised systems, and it could run some potentially destructive commands without further approval. In Tajikistan, the group reportedly accessed the national railway network and, using one employee’s credentials, reached a government document platform used by ministries and agencies, downloading thousands of files including Defense Ministry documents. CloudSEK also found evidence of a compromise involving Uzbekistan’s Smart Forestry system and files disguised as Turkmenistan government documents that may have been prepared for a phishing campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CloudSEK found an exposed server associated with Silent Lynx containing more than a dozen gigabytes of stolen government documents, hacking tools, and records of AI-agent use.","The operator used the open-source Hermes AI agent, primarily with DeepSeek models, for reconnaissance, data collection, and removing traces from compromised systems.","Silent Lynx maintained access to Tajikistan’s national railway network from at least mid-August through early October and stole databases with login credentials, internal documents, and operational reports.","Using a railway employee’s credentials, the group accessed Tajikistan’s national electronic document management platform and automated downloads of thousands of documents, including documents sent to or processed by the Defense Ministry in 2026.","CloudSEK found evidence of a compromise involving Uzbekistan’s Smart Forestry server and malicious files posing as Turkmenistan official documents that appeared to be prepared for a phishing campaign."],"insights":["The Hermes agent was connected to a Telegram bot, allowing the operator to issue instructions remotely from a phone rather than working directly from a single computer.","The agent was configured to run some potentially destructive commands without additional approval, increasing the level of autonomy available to the operator.","Credentials from one Tajik railway employee reportedly provided access to the country’s broader electronic document platform used by ministries and agencies, showing how access to one organization extended into wider government communications.","CloudSEK assessed Silent Lynx’s Kazakhstan ties with only medium confidence and stated that the evidence does not establish a connection to the Kazakh government.","The exposed server included newly created and tested files disguised as Turkmenistan official documents, but researchers could not determine whether the apparent phishing activity against Turkmenistan succeeded."],"referencedReports":[{"title":"Off the Rails: Inside an Exposed Silent Lynx Server","url":"https://www.cloudsek.com/blog/off-the-rails-inside-an-exposed-silent-lynx-server","publisher":"cloudsek","context":"The article relies on CloudSEK's report for findings on Silent Lynx's exposed server, AI-agent use, and intrusions affecting Central Asian government systems.","category":"research","primary":true}],"body":"\u003cp\u003eCloudSEK reported that suspected Kazakhstan-linked group Silent Lynx used the open-source Hermes AI agent, primarily powered by DeepSeek models, in espionage operations against Central Asian government targets. The researchers found an exposed Silent Lynx server containing more than a dozen gigabytes of stolen government documents, hacking tools, and records showing the AI agent’s use. The operator communicated with the agent in Russian and linked it to a Telegram bot to send instructions remotely from a phone.\u003c/p\u003e\n\n\u003cp\u003eThe agent assisted with reconnaissance, data collection, and removing evidence from compromised systems, and it could run some potentially destructive commands without further approval. In Tajikistan, the group reportedly accessed the national railway network and, using one employee’s credentials, reached a government document platform used by ministries and agencies, downloading thousands of files including Defense Ministry documents. CloudSEK also found evidence of a compromise involving Uzbekistan’s Smart Forestry system and files disguised as Turkmenistan government documents that may have been prepared for a phishing campaign.\u003c/p\u003e\n"},{"n":21,"title":"Attackers turn NIKKE’s game launcher into malware","source":"bitdefender.com","sourceColorIdx":7,"link":"https://www.bitdefender.com/en-us/blog/labs/nikke-game-launcher-malware","time":"10:22","priority":"SHOULD READ","score":86,"tldr":"Bitdefender found that attackers abused NIKKE’s legitimate server-pushed launcher task channel to deliver the Lua-based k2f-agent infostealer, which ran inside the signed launcher and stole browser credentials, crypto-wallet data, and developer secrets. The malicious delivery server was taken down, but players active during the attack window should treat affected PCs as compromised and rotate relevant credentials and wallet seeds.","briefOverview":"\u003cp\u003eBitdefender investigated a credential-theft campaign in which attackers abused the legitimate Goddess of Victory: NIKKE game launcher’s server-pushed task channel. The launcher was instructed at runtime to download a malicious file from \u003ccode\u003eanalytics.insightjs[.]com\u003c/code\u003e, without attackers patching the launcher binary, exploiting a vulnerability, or placing malicious content in the shipped game files. The downloaded file was presented as an ordinary launcher log but contained compiled LuaJIT code for an information stealer Bitdefender calls k2f-agent.\u003c/p\u003e\n\n\u003cp\u003eThe payload ran inside the signed launcher process, used the launcher’s browser-to-native service mechanism, and could collect saved browser credentials, cookies, cryptocurrency-wallet extension data, and developer-related secrets. It could decrypt Chrome password data including data protected by Chrome’s App-Bound Encryption, and it targeted MetaMask, Phantom, Coinbase Wallet, Keplr, and TronLink. Stolen information was sent through the launcher’s existing encrypted telemetry traffic, and the observed download, collection, exfiltration, and cleanup sequence took less than ten minutes; the malicious delivery server has since been taken down.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers abused NIKKE’s legitimate server-pushed launcher task channel to download a malicious LuaJIT payload without modifying the launcher’s shipped binaries or exploiting a disclosed vulnerability.","The payload, called k2f-agent, ran inside the signed NIKKE launcher process and could collect saved passwords and cookies from Chrome, Edge, and Opera, as well as data from MetaMask, Phantom, Coinbase Wallet, Keplr, and TronLink browser extensions.","The stealer also included capabilities to collect SSH and GPG keys, Git credentials, Kubernetes configurations, environment variables, shell history, Windows Credential Manager entries, NuGet.Config, and PowerShell profiles.","Stolen data was sent through the launcher’s existing encrypted telemetry connection, while download, collection, exfiltration, and cleanup were completed in under ten minutes.","The malicious delivery server was taken down, and Bitdefender advises people who used the affected launcher during the attack window to rotate passwords, developer secrets, and potentially exposed cryptocurrency wallet seed phrases."],"insights":["The attackers did not need to alter the NIKKE launcher on disk: they supplied a runtime download task through its normal backend channel, meaning checks limited to installed game files would not reveal the malicious delivery URL.","Because the payload ran within a signed, legitimate launcher process and used its existing encrypted telemetry connection for stolen data, ordinary network activity could appear normal even while credentials were being collected.","The malware’s ability to handle Chrome’s newer App-Bound Encryption shows it was designed to obtain browser credentials from recent Chrome versions rather than only relying on older password-storage methods.","The collection of NuGet feed credentials, SSH keys, Git credentials, Kubernetes configurations, and PowerShell profiles indicates that the operators could target software-development and supply-chain access in addition to game-player accounts.","The article identifies behavior-based signs that remain useful despite cleanup, including a game launcher accessing browser credential databases and unusually large .log files beginning with the LuaJIT bytecode marker."],"referencedReports":[],"body":"\u003cp\u003eBitdefender investigated a credential-theft campaign in which attackers abused the legitimate Goddess of Victory: NIKKE game launcher’s server-pushed task channel. The launcher was instructed at runtime to download a malicious file from \u003ccode\u003eanalytics.insightjs[.]com\u003c/code\u003e, without attackers patching the launcher binary, exploiting a vulnerability, or placing malicious content in the shipped game files. The downloaded file was presented as an ordinary launcher log but contained compiled LuaJIT code for an information stealer Bitdefender calls k2f-agent.\u003c/p\u003e\n\n\u003cp\u003eThe payload ran inside the signed launcher process, used the launcher’s browser-to-native service mechanism, and could collect saved browser credentials, cookies, cryptocurrency-wallet extension data, and developer-related secrets. It could decrypt Chrome password data including data protected by Chrome’s App-Bound Encryption, and it targeted MetaMask, Phantom, Coinbase Wallet, Keplr, and TronLink. Stolen information was sent through the launcher’s existing encrypted telemetry traffic, and the observed download, collection, exfiltration, and cleanup sequence took less than ten minutes; the malicious delivery server has since been taken down.\u003c/p\u003e\n"},{"n":7,"title":"Hackers plant GSocket on Linux servers for persistent access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-plant-gsocket-on-linux-servers-for-persistent-access/","time":"09:38","priority":"SHOULD READ","score":85,"tldr":"Threat actors are increasingly using the legitimate GSocket remote-access tool to persist on compromised Linux web and hosting servers through outbound encrypted relay connections that bypass inbound firewall controls. Defenders should remove GSocket artifacts, audit persistence mechanisms, restrict egress traffic, and patch exposed systems.","briefOverview":"\u003cp\u003eMultiple threat actors are abusing GSocket, a legitimate open-source remote-access tool, to maintain access to compromised Linux servers after the vulnerabilities used for initial entry have been patched. Microsoft Defender for Endpoint telemetry showed GSocket-related detections rising 356.2% between March and August. The activity has particularly affected web applications and hosting environments, which accounted for 87.1% of detected incidents. PHP applications and cPanel hosting represented 63.9% of incidents, while Apache represented 24.3%.\u003c/p\u003e\n\n\u003cp\u003eGSocket enables the compromised server and the attacker to each make outbound connections to a relay network, which matches them and creates an encrypted session. This means the compromised host does not need an inbound listener, a public IP address, or a dedicated attacker-controlled command-and-control server, making IP- and domain-based blocking less effective. Attackers have disguised GSocket as kernel threads and used cron jobs, systemd services, and shell startup files to remain on systems; some also attempted to exploit the Dirty Frag flaw, CVE-2026-43284, to gain root privileges. Microsoft recommends removing GSocket-related files, verifying that relay connections have stopped, restricting outbound traffic, auditing persistence locations, and keeping operating systems and applications patched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Multiple threat actors are abusing the legitimate open-source GSocket remote-access tool to retain access to Linux servers after the initial vulnerabilities used to compromise them are patched.","Microsoft Defender for Endpoint telemetry recorded a 356.2% increase in GSocket-related detections between March and August.","GSocket routes encrypted sessions through its Global Socket Relay Network, allowing both the compromised host and attacker to connect outward without requiring an inbound listener or public server address.","Of detected GSocket incidents, 87.1% involved web applications and hosting environments, with PHP applications and cPanel hosting accounting for 63.9% and Apache for 24.3%.","Researchers observed attackers using cron jobs, systemd services, and shell startup files to make GSocket persist on compromised hosts."],"insights":["GSocket can let an attacker reconnect without knowing the compromised server’s IP address or hostname, reducing the usefulness of IP- and domain-based blocking lists.","Because both sides initiate outbound connections, traditional inbound firewall rules may not detect this activity; the article specifically points to egress filtering and outbound monitoring as more relevant controls.","Attackers were observed disguising GSocket as kernel threads and establishing persistence through cron jobs, systemd services, and shell startup files, giving defenders concrete locations to audit.","Some attackers attempted to use CVE-2026-43284, known as Dirty Frag, to obtain root-level control on affected Linux hosts."],"referencedReports":[{"title":"Global Socket: How threat actors are weaponizing GSocket for stealthy C2","url":"https://www.microsoft.com/en-us/security/blog/2026/11/11/global-socket-how-threat-actors-weaponizing-gsocket-stealthy-c2/","publisher":"microsoft","context":"The article relies on Microsoft’s analysis and Microsoft Defender for Endpoint telemetry t
