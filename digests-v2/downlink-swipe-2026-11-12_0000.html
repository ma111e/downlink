<script type="application/json" id="dl-articles">[{"n":12,"title":"New N-able \"4EverAble2Shell\" zero-day exploited hours after PoC released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-n-able-4everable2shell-zero-day-exploited-hours-after-poc-released/","time":"19:51","priority":"MUST READ","score":98,"tldr":"Attackers began exploiting the newly disclosed N-able N-central 4EverAble2Shell zero-day within hours of its PoC release, gaining root access and deploying XMRig Monero miners on at least 21 servers, including fully updated systems. Organizations should disable Legacy API access and treat any indicators of compromise as a full server breach.","briefOverview":"\u003cp\u003eAttackers began exploiting the newly disclosed N-able N-central zero-day called 4EverAble2Shell within hours of the public release of proof-of-concept code on November 12. The flaw can allow unauthenticated attackers to run commands with full administrative control on vulnerable N-central servers when Legacy API access is enabled. N-central is used by managed service providers and IT teams to remotely monitor, manage, and secure customer devices and networks. Researchers reported that at least 21 production N-central servers were compromised, including 19 running the latest Hotfix 2 release.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain combines Apache Axis CVE-2026-90436 with a separate N-central privilege-escalation weakness, first running commands as the \u003ccode\u003enable\u003c/code\u003e service account and then obtaining root access. Observed attackers downloaded a script that installed the XMRig Monero cryptocurrency miner, configured to use roughly half of available CPU cores. N-able said it had restricted certain N-central features and integrations, disabled Intune integration as a precaution, and advised on-premises customers to ensure Legacy API access is disabled. Organizations are also advised to investigate suspicious requests to \u003ccode\u003e/dms/services/ServerUI\u003c/code\u003e and signs such as unexpected \u003ccode\u003exvd.service\u003c/code\u003e services, mining processes, or files under \u003ccode\u003e/tmp/.xvd\u003c/code\u003e and \u003ccode\u003e/var/tmp/.xvd\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers reported that attackers began probing for the N-able N-central 4EverAble2Shell flaw shortly after its proof-of-concept exploit was publicly released on November 12.","The 4EverAble2Shell exploit chain combines Apache Axis CVE-2026-90436 with an N-central privilege-escalation weakness to let unauthenticated attackers execute commands as root when Legacy API access is enabled.","Huntback reported that at least 21 production N-central servers were compromised to install XMRig Monero cryptocurrency miners, including 19 servers running N-central 2026.4.1.26 Hotfix 2.","N-able said it restricted certain N-central features and integrations, disabled Intune integration as a precaution, and advised on-premises customers to ensure Legacy API access is disabled.","Organizations are advised to investigate suspicious requests to /dms/services/ServerUI and check for unexpected xvd.service services, mining processes, and files under /tmp/.xvd or /var/tmp/.xvd."],"insights":["Nineteen of the 21 identified compromised servers were running N-central 2026.4.1.26 Hotfix 2, the latest security update issued two days before the new proof-of-concept exploits were released.","Although disabling Legacy API access is the key mitigation and it is already disabled by default, the reported attack chain shows that exposed installations with this feature enabled can be taken from unauthenticated access to full root control.","The observed miner was configured to use roughly half of a server’s CPU cores, which Huntback said was likely intended to make the unauthorized cryptocurrency mining less noticeable.","Because the exploit provides root-level access, Huntback advises treating the discovery of associated indicators such as xvd.service or files in /tmp/.xvd as a full compromise of the N-central server."],"referencedReports":[{"title":"VULN-2026-0009","url":"https://previdian.com/VULN-2026-0009","publisher":"previdian","context":"Previdian’s technical analysis describes observed probing and exploitation of the 4EverAble2Shell chain and tracks the N-central privilege-escalation issue as VULN-2026-0009.","category":"research","primary":true},{"title":"N-central 4EverAble2Shell miners on live servers","url":"https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers","publisher":"huntback","context":"Huntback reports identifying at least 21 compromised N-central servers used to deploy XMRig cryptocurrency miners.","category":"research","primary":true},{"title":"N-central 2026.4 HF2 release notes","url":"https://status.n-able.com/2026/11/10/n-central-2026-4-hf2-release-notes/","publisher":"n-able","context":"The article cites N-able’s Hotfix 2 guidance for customers to continue upgrading N-central Agents and Probes.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers began exploiting the newly disclosed N-able N-central zero-day called 4EverAble2Shell within hours of the public release of proof-of-concept code on November 12. The flaw can allow unauthenticated attackers to run commands with full administrative control on vulnerable N-central servers when Legacy API access is enabled. N-central is used by managed service providers and IT teams to remotely monitor, manage, and secure customer devices and networks. Researchers reported that at least 21 production N-central servers were compromised, including 19 running the latest Hotfix 2 release.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain combines Apache Axis CVE-2026-90436 with a separate N-central privilege-escalation weakness, first running commands as the \u003ccode\u003enable\u003c/code\u003e service account and then obtaining root access. Observed attackers downloaded a script that installed the XMRig Monero cryptocurrency miner, configured to use roughly half of available CPU cores. N-able said it had restricted certain N-central features and integrations, disabled Intune integration as a precaution, and advised on-premises customers to ensure Legacy API access is disabled. Organizations are also advised to investigate suspicious requests to \u003ccode\u003e/dms/services/ServerUI\u003c/code\u003e and signs such as unexpected \u003ccode\u003exvd.service\u003c/code\u003e services, mining processes, or files under \u003ccode\u003e/tmp/.xvd\u003c/code\u003e and \u003ccode\u003e/var/tmp/.xvd\u003c/code\u003e.\u003c/p\u003e\n"},{"n":34,"title":"Attacker Used 4,837 Hijacked GitHub Accounts to Run a CI Secret Stealer in 1,806+ Repositories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/4837-hijacked-github-accounts-ran-ci.html","time":"06:42","priority":"MUST READ","score":97,"tldr":"An attacker used 4,837 compromised GitHub accounts to probe more than 61,000 repositories and deploy a CI credential-stealing payload that executed in at least 1,806, exposing repository secrets and cloud credentials. Affected owners should immediately revoke account access, rotate all workflow-accessible secrets, and investigate for AWS, Azure, and GCP persistence.","briefOverview":"\u003cp\u003eAn attacker used stolen credentials from 4,837 GitHub accounts to test write access in 61,764 repositories through pull requests titled \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e from \u003ccode\u003ewfx-docs\u003c/code\u003e branches. Aikido Security reported that a CI secret-stealing payload ran in at least 1,806 repositories, while SafeDep identified malicious commits in 8,093 public repositories. The attacker usually reverted the malicious changes within minutes and often deleted workflow logs or entire runs.\u003c/p\u003e\n\n\u003cp\u003eThe payload was designed to collect GitHub Actions secrets, workflow tokens, cloud credentials, credential files, repository data, and recent workflow artifacts. In some cases it was inserted as an npm postinstall hook, meaning it could also run on a developer’s machine during \u003ccode\u003enpm install\u003c/code\u003e. It could use GitHub identity tokens to access AWS, GCP, and Azure environments and establish persistence by changing AWS role trust policies or adding Azure federated credentials. Repository owners are advised to revoke compromised account access, enable 2FA, rotate all accessible secrets and variables, and check cloud environments for the listed persistence indicators.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker used stolen credentials from 4,837 GitHub accounts to open test pull requests in 61,764 repositories and deployed a CI secret-stealing payload that ran in at least 1,806 repositories.","The payload targeted GitHub Actions secrets and variables, workflow tokens, cloud credentials, credential files, repository data, recent artifacts, and, on self-hosted runners, cloud instance metadata and system state.","SafeDep identified malicious commits in 8,093 public repositories, including 7,309 where the stealer was inserted into an existing workflow and 771 where it was delivered through an npm postinstall hook.","The attacker commonly reverted malicious changes within minutes and deleted workflow logs or entire runs, but missing run numbers on attacker commits can indicate that the stealer executed.","Affected repository owners are advised to revoke the compromised author’s tokens, OAuth grants, SSH keys, and sessions; enable 2FA; rotate accessible secrets and variables; and investigate potential AWS, Azure, GCP, and Vault persistence."],"insights":["A repository should treat any account that opened the attacker's test pull request as compromised, even when no payload was subsequently observed.","The absence of visible artifacts such as wfx-loot files, cache entries, or workflow summaries does not rule out data theft; a missing run number on the attacker's commit is described as a more reliable sign that the payload executed.","Credential rotation alone may not remove access because the payload can alter AWS role trust policies and create Azure federated credentials that let repository workflows sign in without stored secrets.","The incident extended beyond repository workflows: an npm postinstall hook could execute on a developer's machine, and a malicious Packagist release could trigger it when npm install was run inside its vendor directory."],"referencedReports":[{"title":"GitHub Actions WFX Credential Stealer","url":"https://safedep.io/blog/github-actions-wfx-credential-stealer","publisher":"safedep","context":"The article cites SafeDep's analysis for its count of malicious commits and details on the stealer's delivery methods, data exfiltration, and cloud persistence behavior.","category":"research","primary":true},{"title":"Compromised GitHub Accounts Push CI Secret Stealer to Tens of Thousands of Repositories","url":"https://www.aikido.dev/blog/compromised-github-accounts-push-ci-secret-stealer-to-tens-of-thousands-of-repositories","publisher":"aikido-security","context":"The article cites Aikido Security's technical analysis for the account and repository impact figures, attack indicators, and response guidance.","category":"research","primary":true}],"body":"\u003cp\u003eAn attacker used stolen credentials from 4,837 GitHub accounts to test write access in 61,764 repositories through pull requests titled \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e from \u003ccode\u003ewfx-docs\u003c/code\u003e branches. Aikido Security reported that a CI secret-stealing payload ran in at least 1,806 repositories, while SafeDep identified malicious commits in 8,093 public repositories. The attacker usually reverted the malicious changes within minutes and often deleted workflow logs or entire runs.\u003c/p\u003e\n\n\u003cp\u003eThe payload was designed to collect GitHub Actions secrets, workflow tokens, cloud credentials, credential files, repository data, and recent workflow artifacts. In some cases it was inserted as an npm postinstall hook, meaning it could also run on a developer’s machine during \u003ccode\u003enpm install\u003c/code\u003e. It could use GitHub identity tokens to access AWS, GCP, and Azure environments and establish persistence by changing AWS role trust policies or adding Azure federated credentials. Repository owners are advised to revoke compromised account access, enable 2FA, rotate all accessible secrets and variables, and check cloud environments for the listed persistence indicators.\u003c/p\u003e\n"},{"n":51,"title":"WFX Phantom: The GitHub Actions Secret Stealer That Deletes Its Tracks","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/wfx-phantom-the-github-actions-secret-stealer","time":"10:47","priority":"MUST READ","score":97,"tldr":"The WFX campaign is using stolen GitHub tokens to inject a GitHub Actions secret-stealing script into writable repositories, exfiltrate secrets and cloud credentials, then quickly revert commits and delete workflow runs. Organizations should urgently hunt for the listed PRs, commits, missing Actions run numbers, and persistence indicators, then revoke compromised tokens and rotate every credential accessible to affected workflows.","briefOverview":"\u003cp\u003eBeginning November 10, 2026, attackers used stolen GitHub tokens to place a CI secret-stealing script called WFX in repositories where the compromised accounts had write access. They first opened harmless probe pull requests titled \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e, then injected the payload through existing GitHub Actions workflows, ordinary shell scripts already run by CI, new workflows, or hidden \u003ccode\u003e.ci-*.sh\u003c/code\u003e files invoked through npm scripts. The attackers commonly reverted the malicious commit and deleted the related workflow run within minutes, leaving missing run numbers in the GitHub Actions history. GitHub search showed more than 63,000 probe pull requests as of November 12, although the article says the payload reached thousands rather than all probed repositories.\u003c/p\u003e\n\n\u003cp\u003eWFX collects GitHub Actions secrets and variables, runner memory, cloud credentials, process environments, credential files, and repository data, then attempts to use cloud sign-in access to reach AWS, GCP, and Azure resources. It also includes persistence attempts such as creating AWS access keys, opening AWS role trust policies to all AWS principals, and adding Azure federated identity credentials named \u003ccode\u003ewfx-ci-*\u003c/code\u003e. Earlier samples sent data to three IP-based collection servers, while newer samples sent stolen data only to a Telegram chat, making IP blocklists insufficient on their own. The article advises affected organizations to identify suspicious commits and missing workflow runs, rotate all credentials accessible to impacted jobs, remove cloud persistence, and revoke compromised GitHub account access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beginning November 10, 2026, attackers used stolen GitHub tokens to push the WFX secret stealer into repositories that the compromised accounts could modify.","The campaign used harmless-looking pull requests titled \"docs: dependency audit notes\" to identify writable repositories before adding the payload through workflows, existing shell scripts, or npm install hooks.","WFX collected GitHub Actions secrets, runner-process memory, cloud credentials, repository data, and other credential files, then attempted to establish lasting access in AWS and Azure environments.","After a malicious workflow started, the attackers commonly reverted their changes and deleted the workflow run, leaving gaps in GitHub Actions run numbers as evidence.","Later WFX samples sent stolen data to a Telegram chat instead of the previously identified collection servers, so blocking those IP addresses alone no longer stopped the newest copies."],"insights":["A missing GitHub Actions run number immediately after a suspicious commit is a strong indicator that WFX ran, because the attackers commonly delete the workflow run after collecting data.","WFX can steal secrets without visibly modifying a workflow by reading the memory of the runner process, allowing payloads embedded in ordinary shell scripts or npm install hooks to collect credentials.","Blocking the campaign’s known collection IP addresses is insufficient for newer samples, which send stolen archives only to a Telegram chat; an outbound network allowlist is needed to stop both delivery methods.","Credential rotation alone may not remove the attacker’s access because WFX attempts to create long-lived AWS access keys, weaken AWS role trust policies, and add Azure federated identity credentials.","Bot and automation accounts are particularly high-value targets in this campaign because compromised bot tokens can have write access and may bypass branch-protection controls."],"referencedReports":[],"body":"\u003cp\u003eBeginning November 10, 2026, attackers used stolen GitHub tokens to place a CI secret-stealing script called WFX in repositories where the compromised accounts had write access. They first opened harmless probe pull requests titled \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e, then injected the payload through existing GitHub Actions workflows, ordinary shell scripts already run by CI, new workflows, or hidden \u003ccode\u003e.ci-*.sh\u003c/code\u003e files invoked through npm scripts. The attackers commonly reverted the malicious commit and deleted the related workflow run within minutes, leaving missing run numbers in the GitHub Actions history. GitHub search showed more than 63,000 probe pull requests as of November 12, although the article says the payload reached thousands rather than all probed repositories.\u003c/p\u003e\n\n\u003cp\u003eWFX collects GitHub Actions secrets and variables, runner memory, cloud credentials, process environments, credential files, and repository data, then attempts to use cloud sign-in access to reach AWS, GCP, and Azure resources. It also includes persistence attempts such as creating AWS access keys, opening AWS role trust policies to all AWS principals, and adding Azure federated identity credentials named \u003ccode\u003ewfx-ci-*\u003c/code\u003e. Earlier samples sent data to three IP-based collection servers, while newer samples sent stolen data only to a Telegram chat, making IP blocklists insufficient on their own. The article advises affected organizations to identify suspicious commits and missing workflow runs, rotate all credentials accessible to impacted jobs, remove cloud persistence, and revoke compromised GitHub account access.\u003c/p\u003e\n"},{"n":40,"title":"Compromised GitHub accounts push CI secret stealer to tens of thousands of repositories","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/compromised-github-accounts-push-ci-secret-stealer-to-tens-of-thousands-of-repositories","time":"01:45","priority":"MUST READ","score":96,"tldr":"A threat actor used thousands of compromised GitHub accounts to inject short-lived malicious CI workflows into tens of thousands of repositories, stealing GitHub Actions secrets, cloud credentials, and runner data from at least 1,806 repositories. Organizations should investigate the listed branches, pull requests, commits, and workflow indicators and rotate all secrets available to affected CI workflows.","briefOverview":"\u003cp\u003eStarting November 10, a threat actor used stolen GitHub credentials from 4,837 compromised accounts to open probe pull requests across 61,764 repositories. The probes used a \u003ccode\u003ewfx-docs\u003c/code\u003e branch and the title \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e, then were followed by malicious commits or short-lived branches where the attacker had write access. At least 1,806 repositories appear to have run the payload and had credentials taken, although the true impact may be higher because workflow logs were deleted.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code targeted GitHub Actions secrets and variables, workflow tokens, cloud credentials, runner memory and environment data, repository contents, caches, and build artifacts. The actor used workflow injection, an npm \u003ccode\u003epostinstall\u003c/code\u003e hook, or a throwaway workflow branch, then generally reverted changes and deleted the workflow run within one minute; a missing workflow run number may be the only trace. The campaign also reached at least one Packagist package and one Go module through automated publishing triggers, while the article notes that the affected Go versions contained the payload only in workflow files and not in source code or release binaries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beginning November 10, a threat actor used stolen GitHub credentials to open probe pull requests in 61,764 repositories through 4,837 compromised accounts.","The campaign injected malicious GitHub Actions workflows or install hooks that stole Actions secrets, cloud credentials, environment data, repository contents, caches, and build artifacts.","The article identified evidence that the payload ran in at least 1,806 repositories, while attackers deleted affected workflow runs and logs to obscure the activity.","Affected repository owners are advised to treat every secret and cloud role available to a workflow as compromised if the payload ran.","The campaign was linked by overlapping compromised accounts to October GhostActions activity, but the article does not attribute the November operation to the same actor."],"insights":["A pull request titled \"docs: dependency audit notes\" was a write-access probe rather than the payload itself, but its presence means the account that opened it was compromised even if no malicious workflow ran.","The attackers typically reverted their changes and deleted workflow logs within one minute, so an unexplained missing run number in a workflow’s history may be the only remaining evidence.","More than 10,000 probe pull requests reached repositories the compromised account did not own through collaborator or organization access, showing that one stolen account could expose many unrelated projects.","The identified Go module versions contained malicious code only in GitHub Actions workflow files; their Go source and release binaries were unchanged, and ordinary Go builds do not execute those workflow files.","Accounts affected by the October GhostActions activity were about a thousand times more likely than other active accounts to be used in the November campaign, although the article does not attribute both operations to the same actor."],"referencedReports":[],"body":"\u003cp\u003eStarting November 10, a threat actor used stolen GitHub credentials from 4,837 compromised accounts to open probe pull requests across 61,764 repositories. The probes used a \u003ccode\u003ewfx-docs\u003c/code\u003e branch and the title \u003ccode\u003edocs: dependency audit notes\u003c/code\u003e, then were followed by malicious commits or short-lived branches where the attacker had write access. At least 1,806 repositories appear to have run the payload and had credentials taken, although the true impact may be higher because workflow logs were deleted.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code targeted GitHub Actions secrets and variables, workflow tokens, cloud credentials, runner memory and environment data, repository contents, caches, and build artifacts. The actor used workflow injection, an npm \u003ccode\u003epostinstall\u003c/code\u003e hook, or a throwaway workflow branch, then generally reverted changes and deleted the workflow run within one minute; a missing workflow run number may be the only trace. The campaign also reached at least one Packagist package and one Go module through automated publishing triggers, while the article notes that the affected Go versions contained the payload only in workflow files and not in source code or release binaries.\u003c/p\u003e\n"},{"n":43,"title":"PHP2Shell Exploitation on Check Point Gateway","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/","time":"13:56","priority":"MUST READ","score":96,"tldr":"Attackers exploited unpatched Check Point Mobile Access gateways using PHP2Shell and CVE-2026-123039, deploying PhiliKit-linked TSGA/TSProxy backdoors and, in some Israeli intrusions, pivoting to ESXi hosts to run the destroy_v6 wiper. The campaign has links to China-nexus UNC5221 tooling, but its destructive, Israel-focused elements leave attribution uncertain.","briefOverview":"\u003cp\u003eBeginning October 30, 2026, attackers targeted organizations with unpatched Check Point Security Gateways through vulnerable Mobile Access portals, with the first wave concentrating on Israeli organizations. The activity was consistent with PHP2Shell exploitation associated with CVE-2026-109618 and CVE-2026-109619, followed by exploitation of CVE-2026-123039 in the DynamicCLI interface to gain root access. A broader second wave on November 2 targeted organizations in multiple countries and sectors, with no observed destructive activity.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining privileged access, the attackers installed PHP webshells and deployed the persistent TSGA backdoor and its embedded TSProxy networking component. They used the gogo scanner to discover internal assets, accessed a VMware ESXi host over SSH with the vpxuser service account, and in destructive cases ran the destroy_v6 wiper and left DREAM_ANNEXATION.txt notes. TSGA and TSProxy share code, configuration, and cryptographic material with the PhiliKit framework previously associated with China-nexus UNC5221, but the article states that the operation’s true nature and attribution cannot be assessed with high confidence.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beginning on October 30, 2026, attackers targeted unpatched Check Point Security Gateways through Mobile Access portals using activity consistent with PHP2Shell exploitation.","After initial access, the attackers exploited CVE-2026-123039 in the DynamicCLI interface to gain root-level control and installed PHP webshells plus the TSGA and TSProxy backdoors.","The attackers used the gogo scanner to identify internal systems, accessed a VMware ESXi host over SSH using the vpxuser account, and executed the destroy_v6 wiper in the destructive stage.","The first wave focused on Israeli organizations and included destructive activity in some cases, while a November 2 wave targeted organizations in multiple countries without observed destructive activity.","TSGA and TSProxy share code, configuration, and cryptographic material with the PhiliKit framework, but the article states that the operation’s true nature and attribution cannot be assessed with high confidence."],"insights":["The campaign began about one week after a security fix became available, showing that organizations with unpatched Check Point Mobile Access portals were rapidly targeted.","Repeated PHP session files containing the \"upload_progress_pwn\" marker and hundreds of Apache/PHP worker crashes are described as evidence that defenders can use to identify attempted PHP2Shell activity.","The TSGA implant combined several persistence methods, including relocating itself to a boot-persistence directory and installing TSProxy into an existing appliance library path, allowing concealed access through normal-looking services.","Although TSGA and TSProxy strongly share a lineage with PhiliKit, the article cautions that the destructive activity, Israel focus, and politically themed note do not fully align with known UNC5221 patterns, so attribution remains uncertain."],"referencedReports":[{"title":"ESET APT Activity Report Q4 2025–Q1 2026","url":"https://web-assets.esetstatic.com/wls/en/papers/threat-reports/eset-apt-activity-report-q4-2025-q1-2026.pdf","publisher":"eset","context":"The article cites this ESET threat report as prior documentation of PhiliKit in attacks exploiting Ivanti vulnerabilities.","category":"research","primary":false},{"title":"Chained PHP2Shell Exploit Roots 25 Servers","url":"https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers","publisher":"dream-security","context":"The article references Dream Security research on PHP2Shell exploitation of Palo Alto Networks devices by China-nexus actors.","category":"research","primary":false},{"title":"CISA Cybersecurity Advisory AA25-022A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-022a","publisher":"cisa","context":"The article cites this CISA advisory as reporting use of the gogo scanner in activity involving Chinese-nexus actors exploiting Ivanti vulnerabilities.","category":"advisory","primary":false}],"body":"\u003cp\u003eBeginning October 30, 2026, attackers targeted organizations with unpatched Check Point Security Gateways through vulnerable Mobile Access portals, with the first wave concentrating on Israeli organizations. The activity was consistent with PHP2Shell exploitation associated with CVE-2026-109618 and CVE-2026-109619, followed by exploitation of CVE-2026-123039 in the DynamicCLI interface to gain root access. A broader second wave on November 2 targeted organizations in multiple countries and sectors, with no observed destructive activity.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining privileged access, the attackers installed PHP webshells and deployed the persistent TSGA backdoor and its embedded TSProxy networking component. They used the gogo scanner to discover internal assets, accessed a VMware ESXi host over SSH with the vpxuser service account, and in destructive cases ran the destroy_v6 wiper and left DREAM_ANNEXATION.txt notes. TSGA and TSProxy share code, configuration, and cryptographic material with the PhiliKit framework previously associated with China-nexus UNC5221, but the article states that the operation’s true nature and attribution cannot be assessed with high confidence.\u003c/p\u003e\n"},{"n":4,"title":"Hackers compromise 4,800 GitHub accounts to steal cloud credentials","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-compromise-4-800-github-accounts-to-steal-cloud-credentials/","time":"22:25","priority":"MUST READ","score":94,"tldr":"The wfx-loot campaign used 4,837 compromised GitHub accounts to probe more than 61,000 repositories and inject credential-stealing GitHub Actions workflows, stealing secrets from at least 1,835 targets. Affected repository owners should investigate suspicious pull requests and workflow changes and immediately rotate all workflow-accessible secrets and cloud credentials.","briefOverview":"\u003cp\u003eThe wfx-loot campaign targeted tens of thousands of GitHub repositories using credentials from 4,837 compromised GitHub accounts. Beginning around 12:45 UTC on November 10, the attacker probed 61,764 repositories for write access by opening pull requests titled “docs: dependency audit notes.” Researchers confirmed that secrets were stolen from at least 1,835 targets. Some compromised accounts were associated with Fortune 100 organizations, the U.S. General Services Administration, the French government, Nextcloud, and WebdriverIO.\u003c/p\u003e\n\n\u003cp\u003eThe attacker delivered a 1,500-line credential-stealing shell script through modified GitHub Actions workflows, new workflows on short-lived branches, or npm install hooks. It sought GitHub Actions tokens, AWS, Azure, and Google Cloud credentials, developer and infrastructure keys, package-registry credentials, AI service credentials, and secrets from files, shell histories, process memory, commits, and workflow artifacts. The script could exchange GitHub OIDC tokens for temporary cloud sessions and, where permitted, create long-lived credentials or alter cloud identity and trust policies. The attacker reverted changes and deleted workflow runs and logs in under a minute, and affected repository owners are advised to investigate the “wfx-docs” branch, suspicious pull requests, and workflow-run gaps before rotating exposed secrets and cloud roles.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The wfx-loot campaign used credentials from 4,837 compromised GitHub accounts to probe 61,764 repositories for write access beginning around 12:45 UTC on November 10.","The attackers opened pull requests titled “docs: dependency audit notes” and injected a 1,500-line script into GitHub Actions workflows, short-lived branches, or npm install hooks to steal credentials.","Researchers confirmed that secrets were stolen from at least 1,835 targets, although not every targeted repository ran the malicious payload.","The script targeted GitHub Actions tokens, AWS, Azure, and Google Cloud credentials, developer keys, package-registry credentials, and credentials for AI services and developer tools.","Repository owners are advised to search for the “wfx-docs” branch, the suspicious pull request, and gaps in workflow run numbers, and to rotate all secrets and cloud roles available to affected workflows."],"insights":["About 92% of the malicious pull requests remained open, indicating that many repository owners had not noticed the probing activity.","The attackers could erase workflow runs and logs and revert their changes in under a minute, making the activity harder to detect after execution.","Roughly 50 compromised accounts appeared to have publishing rights on package ecosystems, and automated publishing placed the payload in one Packagist package release and two Go module versions.","The stolen GitHub identity tokens could be exchanged for temporary cloud sessions and, where permissions allowed, used to create long-lived credentials or change cloud trust policies for persistent access."],"referencedReports":[{"title":"Compromised GitHub accounts push CI secret stealer to tens of thousands of repositories","url":"https://www.aikido.dev/blog/compromised-github-accounts-push-ci-secret-stealer-to-tens-of-thousands-of-repositories","publisher":"aikido","context":"The article relies on Aikido's technical analysis for details of the wfx-loot campaign, its credential-stealing capabilities, affected repositories, and persistence methods.","category":"research","primary":true}],"body":"\u003cp\u003eThe wfx-loot campaign targeted tens of thousands of GitHub repositories using credentials from 4,837 compromised GitHub accounts. Beginning around 12:45 UTC on November 10, the attacker probed 61,764 repositories for write access by opening pull requests titled “docs: dependency audit notes.” Researchers confirmed that secrets were stolen from at least 1,835 targets. Some compromised accounts were associated with Fortune 100 organizations, the U.S. General Services Administration, the French government, Nextcloud, and WebdriverIO.\u003c/p\u003e\n\n\u003cp\u003eThe attacker delivered a 1,500-line credential-stealing shell script through modified GitHub Actions workflows, new workflows on short-lived branches, or npm install hooks. It sought GitHub Actions tokens, AWS, Azure, and Google Cloud credentials, developer and infrastructure keys, package-registry credentials, AI service credentials, and secrets from files, shell histories, process memory, commits, and workflow artifacts. The script could exchange GitHub OIDC tokens for temporary cloud sessions and, where permitted, create long-lived credentials or alter cloud identity and trust policies. The attacker reverted changes and deleted workflow runs and logs in under a minute, and affected repository owners are advised to investigate the “wfx-docs” branch, suspicious pull requests, and workflow-run gaps before rotating exposed secrets and cloud roles.\u003c/p\u003e\n"},{"n":24,"title":"ScreenConnect Attacks Target at Least 288 Endpoints Across 48 Organizations With Rogue Clients","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/screenconnect-attacks-target-at-least.html","time":"04:39","priority":"MUST READ","score":94,"tldr":"Attackers used compromised ConnectWise ScreenConnect panels or operator sessions to deploy rogue ScreenConnect clients and the SCKit toolkit to at least 288 endpoints across 48 organizations, creating persistent access and potential worm-like lateral movement. ConnectWise disabled five third-party extensions as a precaution, while investigators say no ScreenConnect vulnerability has been confirmed.","briefOverview":"\u003cp\u003eConnectWise disabled five third-party ScreenConnect extensions as a precaution after reports of unauthorized access in partner environments. The company said it has no evidence that its infrastructure was compromised or that ScreenConnect has a software vulnerability, and that the activity may involve abuse of independently installed extensions. Huntress observed attackers using cloud-hosted ScreenConnect panels to deploy rogue ScreenConnect clients to at least 288 managed endpoints across 48 organizations.\u003c/p\u003e\n\n\u003cp\u003eThe rogue clients deliver SCKit, a toolkit designed to maintain remote access and intercept session cookies. Huntress said the apparent initial access may involve compromised credentials or hijacked operator sessions, although the exact method remains unclear. The malware is designed to spread when technicians connect to infected endpoints, potentially stealing browser sessions and sign-in tokens and using access to deploy payloads to other reachable systems. Sophos separately reported similar deployments involving a malicious ScreenConnect installer downloaded from 185.99.255[.]28 and a second-stage script retrieved from ns[.]mo7sen[.]dev.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ConnectWise disabled five third-party ScreenConnect extensions as a precaution after reports of unauthorized access, while stating that it has found no evidence of a ScreenConnect vulnerability or compromise of its infrastructure.","Huntress observed attackers using cloud-hosted ScreenConnect panels to run commands that installed rogue ScreenConnect clients on at least 288 managed endpoints across 48 organizations.","The rogue clients deliver SCKit, a malicious toolkit designed to establish persistent remote access, create a mechanism for intercepting session cookies, add Microsoft Defender exclusions, and install another attacker-controlled ScreenConnect client.","Huntress said current evidence points to compromised credentials or hijacked operator sessions as the likely initial access route, though the exact method remains unclear.","Sophos observed malicious ScreenConnect client deployments involving curl downloading an installer from 185.99.255[.]28 and PowerShell retrieving a second-stage script from ns[.]mo7sen[.]dev."],"insights":["Installing a rogue ScreenConnect client gives attackers persistent access to an endpoint even if access to the originally compromised ScreenConnect panel is removed.","The suspected spread path targets support technicians: an infected endpoint may steal a technician’s saved browser sessions and sign-in tokens when the technician connects, potentially opening access to other panels and customer systems.","Huntress found code intended to spread from a technician workstation to other endpoints, but said it has not yet observed a successful instance of that later-stage spread in incidents.","The attackers reportedly label compromised managed service providers with sequential numbers, and the observed numbering began partway through the sequence, suggesting that additional providers may have been affected earlier.","A component called ToolboxRelayUploader.exe is designed to remove its uploaded Shared Toolbox item roughly 60 seconds after broadcasting it to reachable systems, limiting the time the item remains visible."],"referencedReports":[{"title":"ConnectWise Trust Center Advisories","url":"https://www.connectwise.com/company/trust/advisories","publisher":"connectwise","context":"The article cites ConnectWise's advisory describing its precautionary disabling of five third-party extensions and its assessment of the incident.","category":"advisory","primary":false},{"title":"SCKit Worm: Rogue ScreenConnect Clients","url":"https://www.huntress.com/blog/sckit-worm-rogue-screenconnect","publisher":"huntress","context":"The article relies on Huntress tracking and technical analysis of rogue ScreenConnect clients and the SCKit toolkit.","category":"research","primary":true},{"title":"Malicious ScreenConnect Deployments Observed","url":"https://www.sophos.com/en-us/blog/malicious-screenconnect-deployments-observed","publisher":"sophos","context":"The article cites Sophos's alert on unauthorized ScreenConnect client deployments and related command activity.","category":"advisory","primary":false}],"body":"\u003cp\u003eConnectWise disabled five third-party ScreenConnect extensions as a precaution after reports of unauthorized access in partner environments. The company said it has no evidence that its infrastructure was compromised or that ScreenConnect has a software vulnerability, and that the activity may involve abuse of independently installed extensions. Huntress observed attackers using cloud-hosted ScreenConnect panels to deploy rogue ScreenConnect clients to at least 288 managed endpoints across 48 organizations.\u003c/p\u003e\n\n\u003cp\u003eThe rogue clients deliver SCKit, a toolkit designed to maintain remote access and intercept session cookies. Huntress said the apparent initial access may involve compromised credentials or hijacked operator sessions, although the exact method remains unclear. The malware is designed to spread when technicians connect to infected endpoints, potentially stealing browser sessions and sign-in tokens and using access to deploy payloads to other reachable systems. Sophos separately reported similar deployments involving a malicious ScreenConnect installer downloaded from 185.99.255[.]28 and a second-stage script retrieved from ns[.]mo7sen[.]dev.\u003c/p\u003e\n"},{"n":33,"title":"Critical Apache HTTP/2 Flaw Could Let Unauthenticated Attackers Execute Code Remotely","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-apache-http2-flaw-could-let.html","time":"05:12","priority":"MUST READ","score":94,"tldr":"Apache HTTP Server versions 2.4.55–2.4.70 with HTTP/2 enabled are vulnerable to unauthenticated remote code execution via CVE-2026-119618; administrators should upgrade to 2.4.71 or disable h2 and h2c until patched.","briefOverview":"\u003cp\u003eA critical flaw, CVE-2026-119618, in Apache HTTP Server\u0026rsquo;s HTTP/2 component, mod_http2, can allow an unauthenticated remote attacker to run code on a vulnerable server. It affects Apache HTTP Server versions 2.4.55 through 2.4.70 when HTTP/2 is enabled and is fixed in version 2.4.71. Red Hat assigned a CVSS score of 9.8 and said an attacker could take full control of the server process.\u003c/p\u003e\n\n\u003cp\u003eHTTP/2 is enabled through the Apache \u003ccode\u003eProtocols\u003c/code\u003e directive, either across a server or for individual virtual hosts, using \u003ccode\u003eh2\u003c/code\u003e for encrypted connections and \u003ccode\u003eh2c\u003c/code\u003e for unencrypted connections. Administrators should upgrade to Apache HTTP Server 2.4.71; those unable to update can remove \u003ccode\u003eh2\u003c/code\u003e and \u003ccode\u003eh2c\u003c/code\u003e and leave \u003ccode\u003eProtocols http/1.1\u003c/code\u003e as a temporary measure. Red Hat released fixes for RHEL 9 and 10, while RHEL 6, 7, and 8 are not affected; standalone mod_h2 versions 2.0.8 through 2.0.42 are affected and currently have no fixed release.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-119618 is a critical flaw in Apache HTTP Server's mod_http2 component that affects versions 2.4.55 through 2.4.70 and is fixed in version 2.4.71.","The flaw affects only servers with HTTP/2 enabled and could allow an unauthenticated remote attacker to execute code and take control of the server process.","Red Hat rated the issue 9.8 out of 10, stating that public research demonstrated a reliable exploit against a default configuration with mod_http2 enabled, while Wiz said no public exploit or in-the-wild exploitation had been reported.","Administrators unable to update can remove h2 and h2c from the Apache Protocols directive and leave Protocols http/1.1 as a temporary mitigation.","Red Hat released fixes for Red Hat Enterprise Linux 9 and 10, while Red Hat Enterprise Linux 6, 7, and 8 are not affected."],"insights":["HTTP/2 may be enabled either for an entire Apache server or for individual virtual hosts, so checking only a global setting may miss affected sites.","Red Hat considers the issue less severe on RHEL 9 and 10 because its mod_http2 packages use a separate memory allocator for each HTTP/2 connection stream, which the vendor says makes exploitation much harder.","The standalone mod_h2 project has no fixed release, and its archived repository’s latest release, 2.0.42, is still affected; disabling HTTP/2 is the stated option for those deployments.","There is conflicting public information about exploit availability: Red Hat says public research demonstrated a reliable exploit, while Wiz reported that no exploit was available and found no reported in-the-wild exploitation.","Updating to Apache HTTP Server 2.4.67 or any later release through 2.4.70 does not address this newly reported flaw; the article identifies 2.4.71 as the fixed upstream release."],"referencedReports":[{"title":"Apache HTTP Server 2.4 Vulnerabilities","url":"https://httpd.apache.org/security/vulnerabilities_24.html#CVE-2026-119618","publisher":"apache-http-server-project","context":"The article cites Apache HTTP Server's security advisory as identifying version 2.4.71 as the fixed upstream release for CVE-2026-119618.","category":"advisory","primary":true},{"title":"CVE-2026-119618 Severity Assessment","url":"https://access.redhat.com/security/cve/cve-2026-119618","publisher":"red-hat","context":"The article cites Red Hat's severity assessment for its evaluation of exploitability and the status of affected Red Hat Enterprise Linux releases.","category":"advisory","primary":true},{"title":"CVE-2026-119618 RCE Apache HTTP Server Vulnerability Analysis","url":"https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability","publisher":"wiz","context":"The article cites Wiz's vulnerability analysis for its statement that no exploit was available or reported in the wild and for its temporary HTTP/2-disablement guidance.","category":"research","primary":false}],"body":"\u003cp\u003eA critical flaw, CVE-2026-119618, in Apache HTTP Server\u0026rsquo;s HTTP/2 component, mod_http2, can allow an unauthenticated remote attacker to run code on a vulnerable server. It affects Apache HTTP Server versions 2.4.55 through 2.4.70 when HTTP/2 is enabled and is fixed in version 2.4.71. Red Hat assigned a CVSS score of 9.8 and said an attacker could take full control of the server process.\u003c/p\u003e\n\n\u003cp\u003eHTTP/2 is enabled through the Apache \u003ccode\u003eProtocols\u003c/code\u003e directive, either across a server or for individual virtual hosts, using \u003ccode\u003eh2\u003c/code\u003e for encrypted connections and \u003ccode\u003eh2c\u003c/code\u003e for unencrypted connections. Administrators should upgrade to Apache HTTP Server 2.4.71; those unable to update can remove \u003ccode\u003eh2\u003c/code\u003e and \u003ccode\u003eh2c\u003c/code\u003e and leave \u003ccode\u003eProtocols http/1.1\u003c/code\u003e as a temporary measure. Red Hat released fixes for RHEL 9 and 10, while RHEL 6, 7, and 8 are not affected; standalone mod_h2 versions 2.0.8 through 2.0.42 are affected and currently have no fixed release.\u003c/p\u003e\n"},{"n":38,"title":"Apache HTTP Server: Critical RCE Vulnerability ( CVE-2026-119618 )","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/apache-http-server-critical-rce-vulnerability-cve-2026-119618/","time":"22:49","priority":"MUST READ","score":94,"tldr":"Apache HTTP Server versions 2.4.55–2.4.70 with HTTP/2 enabled are affected by critical unauthenticated RCE CVE-2026-119618; upgrade to 2.4.71 immediately or disable mod_http2/HTTP/2 until patched.","briefOverview":"\u003cp\u003eApache Software Foundation disclosed CVE-2026-119618, a critical flaw in the HTTP/2 component of Apache HTTP Server. The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 when HTTP/2 is enabled. Apache rates it Critical, while Red Hat assigned a CVSS 3.1 score of 9.8. Servers that support only HTTP/1.1 are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a timing problem in mod_http2\u0026rsquo;s \u003ccode\u003eassign_headers()\u003c/code\u003e function, where concurrent threads access a shared header table without sufficient synchronization. An unauthenticated remote attacker could corrupt memory and potentially run code on an affected server, while crashes and service disruption are also possible. The article notes that public research reproducing the memory corruption is available, although no exploitation in the wild had been reported at the time of the notice. Apache HTTP Server 2.4.71 fixes the issue, and organizations unable to update immediately can reduce exposure by disabling HTTP/2 or unloading mod_http2, then restarting Apache.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-119618 is a critical race condition in Apache HTTP Server's mod_http2 component that can corrupt memory and potentially allow unauthenticated remote code execution.","Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 are affected when HTTP/2 is enabled, while servers supporting only HTTP/1.1 are not affected.","Apache HTTP Server 2.4.71 fixes CVE-2026-119618, and administrators should restart httpd after updating so all child processes load the patched module.","If patching is delayed, organizations can reduce exposure by disabling HTTP/2 or unloading mod_http2, although these measures are not substitutes for updating.","No exploitation in the wild had been reported at the time of the notice, but public research reproducing the memory corruption was available."],"insights":["An Apache installation may remain protected even if it reports an older version number, because Linux distribution packages can include the fix through vendor security updates; administrators should verify patch status against their vendor’s advisory.","Checking only a global Apache configuration is insufficient because HTTP/2 can be enabled within individual VirtualHost settings, so every relevant configuration location must be reviewed.","The article notes that attacks may resemble normal HTTP/2 traffic and Apache has published no specific indicators, making repeated web-server crashes, segmentation faults, or unexpected processes run by the web-server account especially important warning signs.","Organizations that must preserve HTTP/2 for users can reduce exposure by ending HTTP/2 connections at an unaffected load balancer, CDN, or reverse proxy and sending only HTTP/1.1 traffic to Apache.","An update alone is not enough until Apache is restarted rather than merely reloaded, because existing child processes need to load the patched module."],"referencedReports":[{"title":"Apache HTTP Server — Security Advisory","url":"https://httpd.apache.org/security/vulnerabilities_24.html","publisher":"Apache Software Foundation","context":"The article directs readers to Apache’s security advisory for patch information on CVE-2026-119618.","category":"advisory","primary":true},{"title":"Red Hat — CVE-2026-119618","url":"https://access.redhat.com/security/cve/cve-2026-119618","publisher":"Red Hat","context":"The article cites Red Hat’s CVE advisory as a vendor security-errata source for affected RHEL 9 and RHEL 10 systems.","category":"advisory","primary":false},{"title":"Public research — memory corruption reproduction","url":"https://github.com/googlesky/CVE-2026-119618","publisher":"googlesky","context":"The article links public research that reproduces the memory-corruption condition associated with CVE-2026-119618.","category":"research","primary":false}],"body":"\u003cp\u003eApache Software Foundation disclosed CVE-2026-119618, a critical flaw in the HTTP/2 component of Apache HTTP Server. The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 when HTTP/2 is enabled. Apache rates it Critical, while Red Hat assigned a CVSS 3.1 score of 9.8. Servers that support only HTTP/1.1 are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a timing problem in mod_http2\u0026rsquo;s \u003ccode\u003eassign_headers()\u003c/code\u003e function, where concurrent threads access a shared header table without sufficient synchronization. An unauthenticated remote attacker could corrupt memory and potentially run code on an affected server, while crashes and service disruption are also possible. The article notes that public research reproducing the memory corruption is available, although no exploitation in the wild had been reported at the time of the notice. Apache HTTP Server 2.4.71 fixes the issue, and organizations unable to update immediately can reduce exposure by disabling HTTP/2 or unloading mod_http2, then restarting Apache.\u003c/p\u003e\n"},{"n":50,"title":"CVE-2026-126187: React Server Components Flaw Lets Attackers Execute Code Through Smuggled Flight Rows","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/cve-2026-126187-react-flight-rce","time":"14:55","priority":"MUST READ","score":94,"tldr":"React Server Components packages before 19.0.9, 19.1.10, 19.2.9, and 19.3.1 reportedly contain a critical Flight transport framing flaw that can enable unauthenticated server-side code execution under specific shared-ArrayBuffer conditions. Upgrade affected React/framework dependencies, rebuild and redeploy, and avoid sending multiple typed-array views over a shared ArrayBuffer until patched.","briefOverview":"\u003cp\u003eReact published CVE-2026-126187 on November 10, 2026, describing a critical unauthenticated remote code execution issue in React Server Components with a CVSS 4.0 score of 9.5. The affected packages are react-server-dom-webpack, react-server-dom-parcel, and react-server-dom-turbopack across specified React 19 release lines. The issue can affect server-side and edge rendering environments, while client-only React applications without a server and applications without an RSC-capable framework or bundler plugin are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when a response carries multiple typed-array views over a shared ArrayBuffer, attacker-controlled bytes are present in one view, and a downstream consumer transfers the backing storage. In vulnerable versions, a binary row\u0026rsquo;s length header can be sent while its payload is silently skipped, allowing the Flight parser to consume later bytes incorrectly and potentially interpret attacker-controlled data as a module-loading row. React fixed the issue in versions 19.0.9, 19.1.10, 19.2.9, and 19.3.1 by copying large typed-array payloads into exact-size buffers before they cross the destination boundary. Organizations should upgrade their framework or direct dependencies, verify resolved versions in lockfiles, rebuild and redeploy affected applications, and avoid transporting multiple shared-buffer views in RSC payloads until updated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-126187 is described as a critical, unauthenticated remote code execution flaw in React Server Components, with a CVSS 4.0 score of 9.5.","The affected packages are react-server-dom-webpack, react-server-dom-parcel, and react-server-dom-turbopack in versions through 19.0.8, 19.1.9, 19.2.8, and 19.3.0.","The issue requires a response containing multiple typed-array views over a shared ArrayBuffer, attacker-influenced bytes in one view, and a downstream path that transfers the backing storage.","React fixed the issue in versions 19.0.9, 19.1.10, 19.2.9, and 19.3.1 by copying large typed-array payloads into exact-size buffers before sending them.","Organizations should upgrade framework-managed or direct dependencies, confirm the resolved package versions in lockfiles, and rebuild and redeploy affected applications."],"insights":["The patched Flight parser can still process a deliberately corrupted stream, so the fix depends primarily on the writer no longer emitting a binary-row header without its promised bytes.","The vulnerable behavior can occur silently: a transferred or detached shared buffer may cause the writer to retain the binary length header while skipping the now-zero-length payload, without surfacing an error.","A smuggled module row can turn data into executable code because a framing mismatch causes the parser to consume later rows as binary data and then resume parsing inside attacker-controlled bytes.","Many organizations may not see the affected packages declared directly because they are commonly installed transitively through RSC frameworks, making resolved lockfile versions more important than declared dependencies.","A practical stopgap before upgrading is to copy shared typed-array views, such as with sharedView.slice(), before placing them in an RSC payload."],"referencedReports":[{"title":"GHSA-xqc2-xf4c-x3h3","url":"https://github.com/react/react/security/advisories/GHSA-xqc2-xf4c-x3h3","publisher":"react","context":"The article cites React's GitHub security advisory for CVE-2026-126187 and its affected packages, versions, and preconditions.","category":"advisory","primary":true},{"title":"CVE-2026-126187","url":"https://www.cve.org/CVERecord?id=CVE-2026-126187","publisher":"cve-program","context":"The article links the official CVE record for the React Server Components flaw.","category":"advisory","primary":true},{"title":"Unit 42 on CVE-2025-55182 React and CVE-2025-66478 Next","url":"https://unit42.paloaltonetworks.com/cve-2025-55182-react-and-cve-2025-66478-next","publisher":"unit-42","context":"The article references this Unit 42 analysis as coverage of the prior Flight-protocol vulnerability.","category":"research","primary":false}],"body":"\u003cp\u003eReact published CVE-2026-126187 on November 10, 2026, describing a critical unauthenticated remote code execution issue in React Server Components with a CVSS 4.0 score of 9.5. The affected packages are react-server-dom-webpack, react-server-dom-parcel, and react-server-dom-turbopack across specified React 19 release lines. The issue can affect server-side and edge rendering environments, while client-only React applications without a server and applications without an RSC-capable framework or bundler plugin are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when a response carries multiple typed-array views over a shared ArrayBuffer, attacker-controlled bytes are present in one view, and a downstream consumer transfers the backing storage. In vulnerable versions, a binary row\u0026rsquo;s length header can be sent while its payload is silently skipped, allowing the Flight parser to consume later bytes incorrectly and potentially interpret attacker-controlled data as a module-loading row. React fixed the issue in versions 19.0.9, 19.1.10, 19.2.9, and 19.3.1 by copying large typed-array payloads into exact-size buffers before they cross the destination boundary. Organizations should upgrade their framework or direct dependencies, verify resolved versions in lockfiles, rebuild and redeploy affected applications, and avoid transporting multiple shared-buffer views in RSC payloads until updated.\u003c/p\u003e\n"},{"n":8,"title":"Apache HTTP Server patches critical HTTP/2 remote code execution flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/apache-http-server-patches-critical-http-2-remote-code-execution-flaw/","time":"19:12","priority":"MUST READ","score":93,"tldr":"Apache patched CVE-2026-119618, a critical race condition in mod_http2 that can allow unauthenticated remote code execution on vulnerable Apache HTTP Server deployments with HTTP/2 enabled. Administrators using Apache HTTP Server 2.4.55–2.4.70 or standalone mod_h2 2.0.8–2.0.42 should update immediately or disable HTTP/2.","briefOverview":"\u003cp\u003eThe Apache Software Foundation has patched CVE-2026-119618, a critical flaw in the mod_http2 component of Apache HTTP Server. The issue is a race condition in assign_headers() that can corrupt heap memory when shared resources are used by concurrent threads without proper synchronization. An unauthenticated attacker could potentially use this corruption to run code with the web server process\u0026rsquo;s privileges.\u003c/p\u003e\n\n\u003cp\u003eAffected versions include Apache HTTP Server 2.4.55 through 2.4.70 and standalone mod_h2 2.0.8 through 2.0.42, provided HTTP/2 is enabled. Wiz reported that 64% of cloud environments have vulnerable resources and roughly half have publicly exposed instances, although that estimate does not account for HTTP/2 being disabled by default. Wiz said it knew of no public exploits or attacks at the time of publication, while watchTowr recommended patching immediately or disabling HTTP/2 until patching is possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apache Software Foundation patched CVE-2026-119618, a critical race condition in mod_http2 that can corrupt memory and potentially enable unauthenticated remote code execution.","The issue affects Apache HTTP Server versions 2.4.55 through 2.4.70 and standalone mod_h2 versions 2.0.8 through 2.0.42 when HTTP/2 is enabled.","Wiz reported that 64% of cloud environments have vulnerable resources and that roughly half of those environments have publicly exposed instances, though these figures do not account for whether HTTP/2 is enabled.","Wiz said it was not aware of public exploits or attacks targeting CVE-2026-119618 at the time of publication.","The latest Apache HTTP Server release also fixes CVE-2026-106023 in mod_md and CVE-2026-109163 in mod_vhost_alias."],"insights":["The reported exposure figures may overstate immediate risk because the affected HTTP/2 feature is disabled by default and must be enabled for the flaw to be reachable.","Administrators that cannot patch immediately can reduce risk by disabling HTTP/2, an interim measure specifically recommended by watchTowr.","Successful exploitation would run commands with the web server process's privileges, meaning the impact depends on what access that process has on the host.","Although no public exploit or active attacks were known at publication, Wiz warned that this could change soon."],"referencedReports":[{"title":"Apache HTTP Server 2.4 Vulnerabilities","url":"http://httpd.apache.org/security/vulnerabilities_24","publisher":"Apache Software Foundation","context":"The article cites Apache's vulnerability advisory for its description of the mod_http2 flaw and affected issue.","category":"advisory","primary":true},{"title":"CVE-2026-119618 RCE Apache HTTP Server Vulnerability","url":"https://www.wiz.io/blog/cve-2026-119618-rce-apache-http-server-vulnerability","publisher":"Wiz","context":"The article cites Wiz researchers' technical assessment that the synchronization issue can cause heap corruption and lead to remote code execution.","category":"research","primary":true}],"body":"\u003cp\u003eThe Apache Software Foundation has patched CVE-2026-119618, a critical flaw in the mod_http2 component of Apache HTTP Server. The issue is a race condition in assign_headers() that can corrupt heap memory when shared resources are used by concurrent threads without proper synchronization. An unauthenticated attacker could potentially use this corruption to run code with the web server process\u0026rsquo;s privileges.\u003c/p\u003e\n\n\u003cp\u003eAffected versions include Apache HTTP Server 2.4.55 through 2.4.70 and standalone mod_h2 2.0.8 through 2.0.42, provided HTTP/2 is enabled. Wiz reported that 64% of cloud environments have vulnerable resources and roughly half have publicly exposed instances, although that estimate does not account for HTTP/2 being disabled by default. Wiz said it knew of no public exploits or attacks at the time of publication, while watchTowr recommended patching immediately or disabling HTTP/2 until patching is possible.\u003c/p\u003e\n"},{"n":15,"title":"ConnectWise investigates ScreenConnect breaches after reports of incidents at nearly 50 organizations","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/connectwise-screenconnect-breaches-third-party-tool","time":"16:16","priority":"MUST READ","score":93,"tldr":"ConnectWise is investigating breaches affecting nearly 50 organizations linked to abuse of the RMM+ third-party ScreenConnect extension, with attackers deploying remote-access tools and potentially compromising technician workstations. Evidence suggests some incidents may also involve unpatched CVE-2026-84869 or hijacked operator sessions, prompting ConnectWise to disable RMM+ in affected cloud environments.","briefOverview":"\u003cp\u003eConnectWise is investigating reports of unauthorized access to customer environments after cybersecurity firms reported incidents affecting nearly 50 organizations through its ScreenConnect remote-management tool. Huntress said it observed 288 affected endpoints across 48 organizations targeted within 90 minutes. ConnectWise believes the activity involved abuse of RMM+, an independently developed third-party ScreenConnect extension. The company disabled RMM+ in approximately 400 partner environments and told on-premises customers to disable it themselves.\u003c/p\u003e\n\n\u003cp\u003eRMM+ provides an API that can execute remote commands, protected by a passphrase configured during setup. ConnectWise said attackers deployed additional remote-access software and may have compromised technician workstations during interactive connections to affected devices. It cautioned that disabling extensions and resetting credentials may not remove unauthorized software, persistence mechanisms, or access already established on endpoints. Huntress reported that attackers used compromised systems to create persistent backdoors and, in some cases, spread malware across networks when technicians connected to infected endpoints.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the campaign may be connected to CVE-2026-84869, a ScreenConnect vulnerability that CISA had previously warned was being exploited. Blackpoint Cyber researchers said their testing showed the attacker toolkit targeted that vulnerability and that the existing patch blocked the exploit, suggesting affected systems were likely unpatched. They also said the toolkit could hijack authenticated operator sessions and use legitimate ScreenConnect management features to deploy malicious code. As a result, patching the known flaw does not address risks from an already compromised operator session.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ConnectWise is investigating reports of unauthorized access affecting nearly 50 organizations through its ScreenConnect remote-management tool.","ConnectWise linked the activity to abuse of the independently developed RMM+ extension, which can execute remote commands through an API protected by a customer-configured passphrase.","Huntress reported 288 affected endpoints across 48 organizations targeted within 90 minutes and said it had not found evidence of a new vulnerability.","ConnectWise disabled RMM+ in approximately 400 partner environments and instructed customers with on-premises ScreenConnect systems to disable it themselves.","Blackpoint Cyber researchers said their testing found the toolkit targets CVE-2026-84869, that the existing patch blocks the exploit, and that the toolkit can also hijack authenticated operator sessions."],"insights":["The presence of RMM+ in roughly 400 partner environments does not itself prove those environments were compromised, according to ConnectWise.","Patching CVE-2026-84869 blocks the tested exploit, but it does not remove the risk from an already hijacked technician or operator session.","Simply disabling extensions and resetting credentials may leave unauthorized software, persistent access mechanisms, or existing endpoint access in place.","A compromised endpoint can become a path for wider network infection when a technician later connects to it through ScreenConnect."],"referencedReports":[{"title":"SCKIT Worm: Rogue ScreenConnect","url":"https://www.huntress.com/blog/sckit-worm-rogue-screenconnect","publisher":"huntress","context":"Huntress reported seeing 288 affected endpoints across 48 organizations targeted within 90 minutes and found RMM+-related commands on several ScreenConnect systems.","category":"research","primary":true},{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://cisa.gov/news-events/alerts/2026/09/11/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's warning that CVE-2026-84869 was being exploited in September.","category":"advisory","primary":false}],"body":"\u003cp\u003eConnectWise is investigating reports of unauthorized access to customer environments after cybersecurity firms reported incidents affecting nearly 50 organizations through its ScreenConnect remote-management tool. Huntress said it observed 288 affected endpoints across 48 organizations targeted within 90 minutes. ConnectWise believes the activity involved abuse of RMM+, an independently developed third-party ScreenConnect extension. The company disabled RMM+ in approximately 400 partner environments and told on-premises customers to disable it themselves.\u003c/p\u003e\n\n\u003cp\u003eRMM+ provides an API that can execute remote commands, protected by a passphrase configured during setup. ConnectWise said attackers deployed additional remote-access software and may have compromised technician workstations during interactive connections to affected devices. It cautioned that disabling extensions and resetting credentials may not remove unauthorized software, persistence mechanisms, or access already established on endpoints. Huntress reported that attackers used compromised systems to create persistent backdoors and, in some cases, spread malware across networks when technicians connected to infected endpoints.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the campaign may be connected to CVE-2026-84869, a ScreenConnect vulnerability that CISA had previously warned was being exploited. Blackpoint Cyber researchers said their testing showed the attacker toolkit targeted that vulnerability and that the existing patch blocked the exploit, suggesting affected systems were likely unpatched. They also said the toolkit could hijack authenticated operator sessions and use legitimate ScreenConnect management features to deploy malicious code. As a result, patching the known flaw does not address risks from an already compromised operator session.\u003c/p\u003e\n"},{"n":29,"title":"Critical Red Hat Quay Flaw Lets Attackers Read and Overwrite All Private Container Images in a Registry","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-red-hat-quay-flaw-lets.html","time":"16:27","priority":"MUST READ","score":93,"tldr":"Red Hat has patched two critical Quay flaws that could let unauthenticated or low-privilege attackers steal and overwrite private container images across registry tenants. Organizations should urgently install fixed Quay releases, restrict access to the /keys endpoint, and rotate potentially exposed robot credentials.","briefOverview":"\u003cp\u003eRed Hat disclosed two critical vulnerabilities in Red Hat Quay, a container-image registry, and released fixed builds for eight Quay 3 branches. CVE-2026-123710, rated 9.8, can let an attacker add an attacker-controlled signing key that Quay will trust for tokens granting access to any repository. If anonymous access is enabled, no account is needed; if it is disabled, any valid Quay account can still exploit the issue. Attackers could read private images and secrets within them, overwrite images that downstream systems later pull, or delete active keys and cause normal pushes and pulls to fail.\u003c/p\u003e\n\n\u003cp\u003eThe second flaw, CVE-2026-110697, has a CVSS score of 9.9 and can allow a Quay user who can create a namespace to obtain other tenants\u0026rsquo; robot-account tokens. The issue occurs because an underscore in a namespace name acts as a wildcard in an SQL search, potentially returning another tenant\u0026rsquo;s robot accounts and decrypted tokens. Red Hat says the stolen credentials can be used to read, push, or overwrite images, including potentially injecting malicious images into OpenShift CI/CD pipelines. The company recommends installing the fixed releases, blocking untrusted access to the /keys endpoint, reviewing audit logs for suspicious key events, removing unknown service keys, and rotating affected robot tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123710 is a critical Red Hat Quay flaw with a CVSS score of 9.8 that can allow attackers to add a trusted signing key and create tokens for any repository.","When anonymous access is enabled, CVE-2026-123710 can be exploited without an account, while disabling anonymous access still leaves the flaw exploitable by any valid Quay user.","Attackers exploiting CVE-2026-123710 can read private images, obtain secrets or credentials stored in them, overwrite images, and disrupt normal registry access by deleting active signing keys.","CVE-2026-110697, rated 9.9, can allow Quay users who create specially named namespaces to obtain other tenants' robot account tokens and use them to access or modify their images.","Red Hat released fixed builds for eight Quay 3 branches and recommends blocking untrusted access to the /keys endpoint, reviewing relevant audit events, removing unrecognized service keys, and updating Quay."],"insights":["Disabling anonymous access is not sufficient protection for CVE-2026-123710, because any authenticated Quay user can still obtain a usable token and exploit the key-handling weakness.","Removing an unauthorized signing key before applying the update is only temporary, since an attacker can add another key through the same vulnerable endpoint.","A planted signing key can persist through restarts and remain valid after password resets or robot-token changes, making post-incident cleanup dependent on identifying and removing unrecognized keys.","The second flaw stems from an underscore being treated as a wildcard in a database search, allowing a specially named namespace to match another tenant’s robot accounts and expose decrypted tokens.","Red Hat advises limiting creation of namespaces containing underscores and rotating tokens for matching namespaces until updates are deployed, but states that only updating fully resolves CVE-2026-110697."],"referencedReports":[{"title":"CVE-2026-123710 Bug Report","url":"https://bugzilla.redhat.com/show_bug.cgi?id=2568072","publisher":"red-hat","context":"The article cites this Red Hat bug report for the statement that the vulnerable key-handling logic has existed since Quay's first public commit.","category":"advisory","primary":true},{"title":"CVE-2026-123710","url":"https://access.redhat.com/security/cve/cve-2026-123710","publisher":"red-hat","context":"The article references this Red Hat CVE entry for affected Quay packages and fix-status information.","category":"advisory","primary":true},{"title":"Key Remediation Article","url":"https://access.redhat.com/solutions/7149923","publisher":"red-hat","context":"The article cites this Red Hat remediation guidance for the warning that disabling anonymous access does not prevent exploitation of CVE-2026-123710.","category":"guide","primary":false},{"title":"CVE-2026-110697","url":"https://access.redhat.com/security/cve/cve-2026-110697","publisher":"red-hat","context":"The article references this Red Hat CVE page for affected releases, update guidance, and the status of Quay.io.","category":"advisory","primary":true}],"body":"\u003cp\u003eRed Hat disclosed two critical vulnerabilities in Red Hat Quay, a container-image registry, and released fixed builds for eight Quay 3 branches. CVE-2026-123710, rated 9.8, can let an attacker add an attacker-controlled signing key that Quay will trust for tokens granting access to any repository. If anonymous access is enabled, no account is needed; if it is disabled, any valid Quay account can still exploit the issue. Attackers could read private images and secrets within them, overwrite images that downstream systems later pull, or delete active keys and cause normal pushes and pulls to fail.\u003c/p\u003e\n\n\u003cp\u003eThe second flaw, CVE-2026-110697, has a CVSS score of 9.9 and can allow a Quay user who can create a namespace to obtain other tenants\u0026rsquo; robot-account tokens. The issue occurs because an underscore in a namespace name acts as a wildcard in an SQL search, potentially returning another tenant\u0026rsquo;s robot accounts and decrypted tokens. Red Hat says the stolen credentials can be used to read, push, or overwrite images, including potentially injecting malicious images into OpenShift CI/CD pipelines. The company recommends installing the fixed releases, blocking untrusted access to the /keys endpoint, reviewing audit logs for suspicious key events, removing unknown service keys, and rotating affected robot tokens.\u003c/p\u003e\n"},{"n":9,"title":"New worm-like 'SCKit' malware targets MSPs in ScreenConnect attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-worm-like-sckit-malware-targets-msps-in-screenconnect-attacks/","time":"22:53","priority":"MUST READ","score":92,"tldr":"Attackers targeting MSPs used the SCKit toolkit to deploy rogue ScreenConnect clients and attempt to spread from compromised customer endpoints to technician workstations via a patched ScreenConnect flaw. Researchers found the worm-like takeover attempt has not succeeded in observed cases, but MSPs should patch ScreenConnect, disable affected RMM+ extensions, and investigate unauthorized remote-access activity.","briefOverview":"\u003cp\u003eAttackers targeted managed service providers (MSPs) through ScreenConnect environments and used the platform\u0026rsquo;s Run Command feature to install unauthorized ScreenConnect remote-access clients on customer endpoints. Huntress reported that at least 288 endpoints across 48 organi
