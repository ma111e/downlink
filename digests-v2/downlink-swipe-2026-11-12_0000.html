o describe GSocket abuse, affected environments, and recommended defenses.","category":"research","primary":true}],"body":"\u003cp\u003eMultiple threat actors are abusing GSocket, a legitimate open-source remote-access tool, to maintain access to compromised Linux servers after the vulnerabilities used for initial entry have been patched. Microsoft Defender for Endpoint telemetry showed GSocket-related detections rising 356.2% between March and August. The activity has particularly affected web applications and hosting environments, which accounted for 87.1% of detected incidents. PHP applications and cPanel hosting represented 63.9% of incidents, while Apache represented 24.3%.\u003c/p\u003e\n\n\u003cp\u003eGSocket enables the compromised server and the attacker to each make outbound connections to a relay network, which matches them and creates an encrypted session. This means the compromised host does not need an inbound listener, a public IP address, or a dedicated attacker-controlled command-and-control server, making IP- and domain-based blocking less effective. Attackers have disguised GSocket as kernel threads and used cron jobs, systemd services, and shell startup files to remain on systems; some also attempted to exploit the Dirty Frag flaw, CVE-2026-43284, to gain root privileges. Microsoft recommends removing GSocket-related files, verifying that relay connections have stopped, restricting outbound traffic, auditing persistence locations, and keeping operating systems and applications patched.\u003c/p\u003e\n"},{"n":22,"title":"Calendar Invites and Live Proxies: Inside a Google Session Hijacking Campaign","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/calendar-invites-and-live-proxies.html","time":"11:51","priority":"SHOULD READ","score":85,"tldr":"Material Security uncovered a phishing campaign using trusted Google Calendar and Drive links plus Nyasher reverse proxies to capture live Google Workspace sessions despite MFA. The operation relied on compromised trusted senders and disposable infrastructure, prompting takedowns of hundreds of malicious domains.","briefOverview":"\u003cp\u003eSince mid-August 2026, Material Security tracked a phishing campaign targeting corporate Google users through Calendar invites and, later, Google Drive file and document-share invitations. The messages used mundane themes such as voicemail notices, payment issues, court summonses, and RFP requests, often sent from compromised accounts belonging to organizations recipients already knew. The campaign used trusted Google redirect links, share.google, Drive links, and in one case Intuit notification links, making the visible domains and certificates appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eAfter a victim clicked through, the Nyasher framework placed a live reverse proxy in front of Google’s genuine sign-in flow and captured the victim’s active session while passing passwords and additional sign-in prompts to Google in real time. Material Security said this approach could capture sessions despite SMS codes, authenticator codes, Tap-Yes number matching, or phone-based recovery, potentially giving an attacker access to mail, Drive, and the ability to grant OAuth access in the victim’s name. During one month of Operation CloudFire, researchers blocked 68,676 campaign messages, analyzed 2,112 malicious URLs, took down 897 domains, and identified 8,570 compromised sender addresses; reported phishing destinations were placed behind Cloudflare warning pages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Since mid-August 2026, a phishing campaign has used Google Calendar invites and later Google Drive share invites to target corporate Google users.","The campaign used Google redirect links, compromised sender accounts, and a live proxy of Google’s real sign-in page to capture authenticated sessions even when victims completed additional sign-in checks.","Material Security identified the phishing framework as Nyasher and reported campaign infrastructure to Cloudflare, which placed phishing warnings in front of confirmed malicious destinations.","During one month of Operation CloudFire, researchers recorded 68,676 blocked campaign messages, 2,112 malicious URLs, 897 domains taken down, and 8,570 compromised sender addresses across 6,354 root domains.","A stolen Google Workspace session can provide access to the victim’s email and Drive files and allow OAuth access to be granted in the victim’s name."],"insights":["The campaign bypassed common trust signals by using legitimate Google redirect links, trusted compromised sender accounts, and real Cloudflare challenges, so domain reputation alone provided little warning.","Because the phishing page was assembled in the visitor’s browser only after a challenge was completed, automated scanners and proxy logs could have little or nothing to inspect.","Calendar invitations require dedicated security review because many gateway tools focus on email in transit, while this campaign delivered many of its lures as invites.","Stopping a stolen live session requires rapid response: teams may need to revoke sessions, remove OAuth permissions, and reset accounts within an hour to limit access to mail and Drive."],"referencedReports":[{"title":"Calendar Invite Whitepaper","url":"https://content.material.security/hubfs/Material%20Security%20Site%20CMS/CalendarInviteWhitepaper-sep2026.pdf","publisher":"material-security","context":"The article directs teams to this companion whitepaper for a full technical breakdown, indicators of compromise, and a campaign timeline.","category":"research","primary":true}],"body":"\u003cp\u003eSince mid-August 2026, Material Security tracked a phishing campaign targeting corporate Google users through Calendar invites and, later, Google Drive file and document-share invitations. The messages used mundane themes such as voicemail notices, payment issues, court summonses, and RFP requests, often sent from compromised accounts belonging to organizations recipients already knew. The campaign used trusted Google redirect links, share.google, Drive links, and in one case Intuit notification links, making the visible domains and certificates appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eAfter a victim clicked through, the Nyasher framework placed a live reverse proxy in front of Google’s genuine sign-in flow and captured the victim’s active session while passing passwords and additional sign-in prompts to Google in real time. Material Security said this approach could capture sessions despite SMS codes, authenticator codes, Tap-Yes number matching, or phone-based recovery, potentially giving an attacker access to mail, Drive, and the ability to grant OAuth access in the victim’s name. During one month of Operation CloudFire, researchers blocked 68,676 campaign messages, analyzed 2,112 malicious URLs, took down 897 domains, and identified 8,570 compromised sender addresses; reported phishing destinations were placed behind Cloudflare warning pages.\u003c/p\u003e\n"},{"n":10,"title":"Police dismantle Gootloader, CastleRAT, StealC malware infrastructure","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-dismantles-gootloader-castlerat-stealc-malware-infrastructure/","time":"15:07","priority":"SHOULD READ","score":84,"tldr":"Operation Endgame authorities from nine countries seized 235 servers and 257 domains supporting the Gootloader, CastleRAT, and StealC malware operations, securing 6.4 million stolen victim datasets. The credentials will be shared with breach-notification partners to alert affected users.","briefOverview":"\u003cp\u003eLaw-enforcement agencies from Bulgaria, Canada, Denmark, Germany, Moldova, the Netherlands, Poland, the United Kingdom, and the United States seized infrastructure linked to the Gootloader, CastleRAT, and StealC malware operations. Coordinated by Europol and Eurojust under Operation Endgame, the action seized 257 domains and 235 servers. Private-sector partners also helped identify, seize, take down, and block the targeted infrastructure.\u003c/p\u003e\n\n\u003cp\u003eAuthorities found 6.4 million victim datasets on the criminal infrastructure, including credentials stolen after victims’ systems were infected. Europol said the suspects used the stolen credentials for sale and in later cyberattacks, including ransomware incidents. Data from the operation will be made available through multiple notification platforms, while WordPress users are urged to update credentials, enable multi-factor authentication, and patch vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation Endgame law-enforcement partners from nine countries seized 257 domains and 235 servers linked to the Gootloader, CastleRAT, and StealC malware operations.","Authorities identified 6.4 million victim datasets on the seized criminal infrastructure, including credentials stolen from infected systems.","Europol said the stolen credentials had been used by suspects for sale and for subsequent cyberattacks, including ransomware incidents.","Victim data will be shared through platforms including HaveIBeenPwned, DIVD, CheckjeHack, NoMoreLeaks, Sekoia, The Shadowserver Foundation, and NL-NCSC to alert affected people.","Europol urged WordPress users to update their credentials, enable multi-factor authentication, and patch vulnerabilities."],"insights":["The operation targeted not only the systems used to spread harmful programs but also the stolen-data infrastructure that can enable later account misuse and ransomware incidents.","The 6.4 million victim datasets are being routed through multiple notification services, creating a path for affected people to learn that their credentials may have been stolen.","Operation Endgame has repeatedly targeted related criminal infrastructure, including SocGholish, Amadey, StealC, Rhadamanthys, VenomRAT, and Elysium operations.","The article specifically calls on WordPress users to change credentials, enable multi-factor authentication, and apply updates, indicating that account security and software updates remain relevant after infrastructure seizures."],"referencedReports":[],"body":"\u003cp\u003eLaw-enforcement agencies from Bulgaria, Canada, Denmark, Germany, Moldova, the Netherlands, Poland, the United Kingdom, and the United States seized infrastructure linked to the Gootloader, CastleRAT, and StealC malware operations. Coordinated by Europol and Eurojust under Operation Endgame, the action seized 257 domains and 235 servers. Private-sector partners also helped identify, seize, take down, and block the targeted infrastructure.\u003c/p\u003e\n\n\u003cp\u003eAuthorities found 6.4 million victim datasets on the criminal infrastructure, including credentials stolen after victims’ systems were infected. Europol said the suspects used the stolen credentials for sale and in later cyberattacks, including ransomware incidents. Data from the operation will be made available through multiple notification platforms, while WordPress users are urged to update credentials, enable multi-factor authentication, and patch vulnerabilities.\u003c/p\u003e\n"},{"n":13,"title":"Romania says it stopped Russian cyberattack targeting government emails","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/romania-russia-cyberattack-emails","time":"13:30","priority":"SHOULD READ","score":84,"tldr":"Romania’s intelligence service said it contained a December 2025 Turla cyberespionage intrusion targeting a government email system, with no sensitive-data exfiltration identified. ESET reported the Russian-linked group used its Cereal toolkit on Microsoft Exchange servers to intercept Romania’s communications with NATO and EU institutions.","briefOverview":"\u003cp\u003eRomania’s intelligence service said it detected and contained a December 2025 cyberespionage intrusion at an unspecified government institution, attributing it to the Russian state-linked Turla group. The agency said attackers exploited Microsoft-system vulnerabilities, but Romanian specialists restored the affected email service and found no evidence that sensitive data was taken. Romania notified relevant domestic authorities and shared information with European intelligence services and NATO and EU partners.\u003c/p\u003e\n\n\u003cp\u003eESET researchers said Turla used a previously unknown toolkit named Cereal to compromise government Microsoft Exchange servers in Romania and Kazakhstan. The toolkit could monitor email traffic, collect selected messages, and retain access while avoiding detection; in Romania, it was reportedly configured to intercept messages involving NATO and EU institutions. The incident adds to Romania’s stated concerns about Russian-linked cyber operations and other hybrid threats, while authorities investigate other potentially related activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Romania’s intelligence service said it detected and contained a December 2025 intrusion attributed to the Russian state-linked Turla group at an unspecified government institution.","Romanian authorities said they found no evidence that sensitive data was taken and restored the affected email service.","ESET reported that Turla used a previously unknown toolkit called Cereal to compromise government Microsoft Exchange servers in Romania and Kazakhstan.","According to ESET, the Cereal malware in Romania was configured to intercept emails exchanged with NATO and European Union institutions.","The Romanian Intelligence Service said it shared information about the incident with relevant domestic authorities, European intelligence services, and partners in NATO and the EU."],"insights":["The reported targeting was highly selective: in Romania, Cereal was configured specifically to monitor messages sent to or received from NATO and EU institutions rather than indiscriminately collecting all email.","The intrusion was discovered and contained despite Cereal’s reported ability to maintain access to compromised Microsoft Exchange servers while avoiding detection.","Romania shared incident information with domestic authorities, European intelligence services, NATO, and EU partners, reflecting that the affected communications had relevance beyond the unnamed Romanian institution.","The Romanian Intelligence Service said it is investigating other potentially related Russia-linked cyber operations, indicating the incident is not being treated as an isolated matter."],"referencedReports":[],"body":"\u003cp\u003eRomania’s intelligence service said it detected and contained a December 2025 cyberespionage intrusion at an unspecified government institution, attributing it to the Russian state-linked Turla group. The agency said attackers exploited Microsoft-system vulnerabilities, but Romanian specialists restored the affected email service and found no evidence that sensitive data was taken. Romania notified relevant domestic authorities and shared information with European intelligence services and NATO and EU partners.\u003c/p\u003e\n\n\u003cp\u003eESET researchers said Turla used a previously unknown toolkit named Cereal to compromise government Microsoft Exchange servers in Romania and Kazakhstan. The toolkit could monitor email traffic, collect selected messages, and retain access while avoiding detection; in Romania, it was reportedly configured to intercept messages involving NATO and EU institutions. The incident adds to Romania’s stated concerns about Russian-linked cyber operations and other hybrid threats, while authorities investigate other potentially related activity.\u003c/p\u003e\n"},{"n":48,"title":"Cyberattacks Are Skyrocketing in Japan as Researchers Trace AI-Assisted Intrusions","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/japan-cyberattack-surge?utm_medium=feed","time":"14:51","priority":"SHOULD READ","score":84,"tldr":"Japan is experiencing a record surge in disclosed cyber incidents, particularly web-application and third-party email-service breaches that exposed hundreds of millions of records. Researchers have found evidence of AI-assisted vulnerability discovery and API exploitation, prompting emergency government measures and calls for faster patching.","briefOverview":"\u003cp\u003eJapan reported a record 233 publicly disclosed security incidents in October, about 2.4 times the previous monthly record. MM Research Institute estimated that approximately 185 million personal-information records were exposed or potentially exposed in incidents disclosed that month, and 30 incidents involved at least one million records. Major retailers, technology firms, financial-services providers, and government agencies were among the affected organizations.\u003c/p\u003e\n\n\u003cp\u003eThe increase was driven largely by unauthorized access and web-system compromises rather than a comparable rise in publicly disclosed ransomware incidents. Arara said attackers obtained approximately 81.3 million email addresses and may have affected up to 380 corporate customers, while Ymir Link reported that attackers extracted approximately 47.9 million email-distribution records from 49 systems. JPCERT/CC found evidence that attackers used AI to scan for known weaknesses and analyzed Android applications to identify backend service entry points, prompting Japan to announce a 10 billion yen emergency cybersecurity package and seek earlier warning of serious software flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Japan publicly disclosed a record 233 security incidents in October, about 2.4 times its previous monthly record, while an MM Research Institute analysis estimated that about 185 million personal-information records were exposed or potentially exposed during the month.","TrendAI counted 607 publicly disclosed Japanese security incidents from January through September 2026, including 331 unauthorized-access incidents, while publicly disclosed ransomware incidents changed little from the same period in 2025.","Arara said attackers obtained about 81.3 million email addresses and potentially affected up to 380 corporate customers, and the attackers used its service to send as many as 7.13 million fraudulent messages.","JPCERT/CC found evidence that attackers used AI to scan for known weaknesses and attack through application connections, including by analyzing Android apps to identify backend service entry points.","Japan announced a 10 billion yen emergency cybersecurity package and is seeking earlier access to information about undisclosed software weaknesses as organizations face pressure to fix known issues faster."],"insights":["The rise in Japanese incident disclosures was not primarily driven by ransomware: TrendAI found ransomware reports were nearly flat year over year, while unauthorized access accounted for more than half of the incidents it tracked.","Third-party service providers can multiply the impact of a single intrusion, as Arara’s breach potentially affected up to 380 business customers and Ymir Link reported nearly 47.9 million email-distribution records extracted from 49 systems.","Web-system compromises expanded beyond large online retailers to small, specialized services such as tournament registration, tourist-train reservations, funeral flower orders, ticket refunds, and blogger-management systems.","Researchers found that attackers can use mobile-app analysis to uncover backend service entry points and authentication details that may not be visible on a public website, then test those services for weaknesses.","The October spike was not solely delayed reporting of old compromises, because researchers observed evidence of successful intrusions continuing into late October."],"referencedReports":[{"title":"Analysis of Personal Information Exposure in October 2026","url":"https://www.m2ri.jp/release/detail.html?id=745","publisher":"mm-research-institute","context":"The article cites this analysis for its estimate that approximately 185 million personal-information records were exposed or potentially exposed in incidents disclosed during October.","category":"research","primary":true},{"title":"Security Incidents in Japan: January–September 2026","url":"https://www.trendaisecurity.com/en/resources-insights/deep-research/security-incidents-in-japan-january-september-2026","publisher":"trendai","context":"The article relies on this incident analysis for counts and categories of publicly disclosed Japanese security incidents through September 2026.","category":"research","primary":true},{"title":"Web Incidents in 2026: October Update","url":"https://security.macnica.co.jp/blog/2026/11/web-incidents2026-oct2.html","publisher":"macnica","context":"The article cites this investigation for the increase in web-system breaches, examples of affected services, and observations about authentication and access-control weaknesses.","category":"research","primary":true},{"title":"Web API Attacks","url":"https://blogs.jpcert.or.jp/en/2026/10/web_api_attacks.html","publisher":"jpcert-cc","context":"The article references this technical investigation as evidence that attackers used AI-assisted scanning and Android application analysis to identify and target API weaknesses.","category":"research","primary":true},{"title":"Japan to Seek Software Vulnerability Data From US AI Firms Amid Cyberattack Surge","url":"https://www.reuters.com/legal/litigation/japan-seek-software-vulnerability-data-us-ai-firms-amid-cyberattack-surge-nikkei-2026-11-04/","publisher":"reuters","context":"The article cites this Reuters report, which referenced Nikkei, regarding Japan's plan to seek earlier access to information about undisclosed software vulnerabilities.","category":"news","primary":false}],"body":"\u003cp\u003eJapan reported a record 233 publicly disclosed security incidents in October, about 2.4 times the previous monthly record. MM Research Institute estimated that approximately 185 million personal-information records were exposed or potentially exposed in incidents disclosed that month, and 30 incidents involved at least one million records. Major retailers, technology firms, financial-services providers, and government agencies were among the affected organizations.\u003c/p\u003e\n\n\u003cp\u003eThe increase was driven largely by unauthorized access and web-system compromises rather than a comparable rise in publicly disclosed ransomware incidents. Arara said attackers obtained approximately 81.3 million email addresses and may have affected up to 380 corporate customers, while Ymir Link reported that attackers extracted approximately 47.9 million email-distribution records from 49 systems. JPCERT/CC found evidence that attackers used AI to scan for known weaknesses and analyzed Android applications to identify backend service entry points, prompting Japan to announce a 10 billion yen emergency cybersecurity package and seek earlier warning of serious software flaws.\u003c/p\u003e\n"},{"n":6,"title":"Massive Microsoft 365 outage disrupts Outlook, Teams, Copilot worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/massive-microsoft-365-outage-disrupts-outlook-teams-copilot-worldwide/","time":"20:15","priority":"SHOULD READ","score":83,"tldr":"Microsoft is investigating a worldwide Microsoft 365 outage affecting Outlook, Teams, Copilot, Exchange Online, SharePoint, and other services after servers unexpectedly became unavailable and strained remaining infrastructure.","briefOverview":"\u003cp\u003eMicrosoft is investigating a widespread Microsoft 365 outage affecting services including Outlook, Microsoft Teams, Copilot, Exchange Online, SharePoint Online, and Microsoft Defender XDR. The company said the incident began at 1:26 PM ET on Thursday, after it had earlier investigated Exchange Online mailbox connectivity problems in the Americas. Microsoft later confirmed that users in any region could be affected.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft determined that servers unexpectedly became unavailable, straining the remaining infrastructure, rather than elevated customer traffic causing the load. It paused deployments, redistributed connection traffic across its global infrastructure, moved additional traffic away from affected systems, and restarted affected servers to restore capacity. A separate Teams messaging outage affecting North and South America earlier that day was resolved, but Microsoft has not said whether it was related to the ongoing Microsoft 365 incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is investigating a widespread outage affecting Microsoft 365 services including Outlook, Microsoft Teams, Copilot, Exchange Online, SharePoint Online, and Microsoft Defender XDR.","Microsoft said the disruption began at 1:26 PM ET on Thursday and can affect users in any region.","The company determined that servers unexpectedly became unavailable, straining the remaining infrastructure, rather than an increase in traffic causing the elevated load.","Microsoft paused deployments, redistributed and moved connection traffic away from affected systems, and restarted affected servers to restore capacity.","A separate Teams messaging incident in North and South America earlier that day was resolved, and Microsoft has not said whether it is related to the ongoing Microsoft 365 outage."],"insights":["Microsoft initially investigated Exchange Online mailbox connectivity issues in the Americas, but later confirmed that users in any region could be affected.","Microsoft determined that the elevated infrastructure load was caused by unavailable servers straining the remaining systems, not by increased customer traffic.","The incident affected services spanning email, collaboration, file access, Copilot, and Defender XDR, indicating that multiple Microsoft 365 services were impacted at once.","Microsoft had already resolved a separate Teams messaging outage in North and South America earlier the same day, but has not said whether it was related to the ongoing wider outage."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is investigating a widespread Microsoft 365 outage affecting services including Outlook, Microsoft Teams, Copilot, Exchange Online, SharePoint Online, and Microsoft Defender XDR. The company said the incident began at 1:26 PM ET on Thursday, after it had earlier investigated Exchange Online mailbox connectivity problems in the Americas. Microsoft later confirmed that users in any region could be affected.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft determined that servers unexpectedly became unavailable, straining the remaining infrastructure, rather than elevated customer traffic causing the load. It paused deployments, redistributed connection traffic across its global infrastructure, moved additional traffic away from affected systems, and restarted affected servers to restore capacity. A separate Teams messaging outage affecting North and South America earlier that day was resolved, but Microsoft has not said whether it was related to the ongoing Microsoft 365 incident.\u003c/p\u003e\n"},{"n":11,"title":"Microsoft: Recent Windows updates cause SQL Server performance issues","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-recent-windows-updates-cause-sql-server-performance-issues/","time":"12:11","priority":"SHOULD READ","score":82,"tldr":"Microsoft says Windows updates released since the October 2026 Patch Tuesday can cause SQL Server linked-server queries using OLE DB to leave Oracle and PostgreSQL connections open, degrading performance and stability. An out-of-band Windows update is expected within days; administrators can seek a temporary mitigation from Microsoft Support.","briefOverview":"\u003cp\u003eMicrosoft has confirmed that Windows updates released since the October 2026 Patch Tuesday are causing SQL Server performance and stability problems. The issue occurs when SQL Server linked-server queries use OLE DB providers to access external databases, including Oracle and PostgreSQL. After the queries finish, some connections remain open instead of closing, causing the number of open connections to grow over time and degrade server performance.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Windows 10, Windows 11, and Windows Server 2012 and later. Administrators may be able to temporarily improve stability by manually closing leftover connections or restarting the SQL service, but either action can end active queries and the problem can return. Microsoft plans to release an out-of-band Windows update within days and says administrators can contact Microsoft Support for Business for an interim mitigation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that Windows updates released since the October 2026 Patch Tuesday can cause SQL Server performance and stability issues.","The issue affects SQL Server linked-server queries using OLE DB providers to connect to external databases, including known impacts on Oracle and PostgreSQL connections.","Affected queries can leave connections open after completion, causing connections to accumulate and server performance to degrade over time.","The issue affects Windows 10, Windows 11, and Windows Server 2012 and later, and Microsoft plans an out-of-band Windows update within days.","Administrators may temporarily close the leftover connections or restart the SQL service, but these actions can terminate active queries and the problem may return."],"insights":["The degradation can build gradually because database connections remain open even after the related SQL Server queries have finished, rather than appearing only while queries are running.","Restarting the SQL service or manually closing leftover connections may provide temporary relief, but can terminate active queries and does not prevent the issue from returning.","Microsoft says the problem spans both client and server Windows systems, including Windows 10, Windows 11, and Windows Server 2012 or later.","Organizations needing an interim measure before the out-of-band update can contact Microsoft Support for Business for a mitigation."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft has confirmed that Windows updates released since the October 2026 Patch Tuesday are causing SQL Server performance and stability problems. The issue occurs when SQL Server linked-server queries use OLE DB providers to access external databases, including Oracle and PostgreSQL. After the queries finish, some connections remain open instead of closing, causing the number of open connections to grow over time and degrade server performance.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Windows 10, Windows 11, and Windows Server 2012 and later. Administrators may be able to temporarily improve stability by manually closing leftover connections or restarting the SQL service, but either action can end active queries and the problem can return. Microsoft plans to release an out-of-band Windows update within days and says administrators can contact Microsoft Support for Business for an interim mitigation.\u003c/p\u003e\n"},{"n":14,"title":"European authorities take down SteaIC malware servers for second time this year","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/european-authorities-take-down-stealic-malware-second-time","time":"16:21","priority":"SHOULD READ","score":82,"tldr":"An international law-enforcement operation disrupted 235 servers and 257 domains supporting StealC, Gootloader, and CastleRAT, including rebuilt StealC infrastructure hosted through Virtualine. Investigators recovered about 6.4 million stolen credentials affecting more than 40,000 victims, marking the second StealC-focused takedown this year.","briefOverview":"\u003cp\u003eEuropean authorities dismantled more than 100 servers used by the StealC password-stealing malware, marking the second takedown of its infrastructure this year. German investigators traced the rebuilt network to Virtualine, a bulletproof hosting provider seized by the FBI in October, with support from Frankfurt police and the Dutch National High Tech Crime Unit. The action followed an initial June crackdown against StealC-related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eA wider international operation disrupted 235 servers and 257 domains used by StealC, Gootloader, and CastleRAT. Investigators found copies of approximately 6.4 million stolen login credentials linked to more than 40,000 victims, and encouraged people to check politie.nl/checkyourhack and haveibeenpwned.com for potential exposure. No arrests, cryptocurrency seizures, or criminal charges were reported in the latest operation.\u003c/p\u003e\n\n\u003cp\u003ePolice from nine countries, including Germany, the Netherlands, Britain, and the United States, participated alongside private cybersecurity companies. German Federal Criminal Police Office cybercrime chief Carsten Meywirth said that rebuilding infrastructure after a police action creates new leads for investigators. In the June operation, authorities and Microsoft dismantled hundreds of servers and domains linked to StealC and other malware tools and restricted access to €41 million in cryptocurrency.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["European authorities dismantled more than 100 servers used by the StealC password-stealing malware, marking the second such takedown this year.","A wider international operation disrupted 235 servers and 257 domains used by StealC, Gootloader, and CastleRAT.","Investigators found around 6.4 million stolen login credentials from more than 40,000 victims obtained by the malware.","German authorities traced StealC's rebuilt network to Virtualine, a bulletproof hosting provider seized by the FBI in October.","The latest operation involved police from nine countries, including Germany, the Netherlands, Britain, and the United States, and resulted in no reported arrests, cryptocurrency seizures, or criminal charges."],"insights":["The StealC infrastructure was rebuilt after the June crackdown, but investigators said the rebuilt network created new leads that helped them trace it to Virtualine.","The operation recovered roughly 6.4 million stolen login credentials tied to more than 40,000 victims, indicating that affected individuals may need to check whether their accounts were exposed.","Although authorities disrupted a large number of servers and domains, the latest action included no arrests, cryptocurrency seizures, or criminal charges.","The June operation restricted access to €41 million in cryptocurrency, while the later action focused on disrupting rebuilt infrastructure."],"referencedReports":[],"body":"\u003cp\u003eEuropean authorities dismantled more than 100 servers used by the StealC password-stealing malware, marking the second takedown of its infrastructure this year. German investigators traced the rebuilt network to Virtualine, a bulletproof hosting provider seized by the FBI in October, with support from Frankfurt police and the Dutch National High Tech Crime Unit. The action followed an initial June crackdown against StealC-related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eA wider international operation disrupted 235 servers and 257 domains used by StealC, Gootloader, and CastleRAT. Investigators found copies of approximately 6.4 million stolen login credentials linked to more than 40,000 victims, and encouraged people to check politie.nl/checkyourhack and haveibeenpwned.com for potential exposure. No arrests, cryptocurrency seizures, or criminal charges were reported in the latest operation.\u003c/p\u003e\n\n\u003cp\u003ePolice from nine countries, including Germany, the Netherlands, Britain, and the United States, participated alongside private cybersecurity companies. German Federal Criminal Police Office cybercrime chief Carsten Meywirth said that rebuilding infrastructure after a police action creates new leads for investigators. In the June operation, authorities and Microsoft dismantled hundreds of servers and domains linked to StealC and other malware tools and restricted access to €41 million in cryptocurrency.\u003c/p\u003e\n"},{"n":20,"title":"Shipping giant Maersk says recent cyber incident affected legacy system","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/shipping-giant-maersk-says-recent-incident-affected-legacy-system","time":"18:28","priority":"SHOULD READ","score":82,"tldr":"Maersk says a cyber incident was confined to a legacy system inherited through its 2022 acquisition of LF Logistics, with no evidence of sensitive-data exposure or disruption to customer-facing systems. The statement follows a WhiteArmor ransomware claim that it stole 100GB of LF Logistics data and demanded $5 million.","briefOverview":"\u003cp\u003eMaersk said threat actors gained access to a legacy system inherited through a previous acquisition, but that the incident was isolated to a local system. The company said it found no indication that other Maersk systems, connected customer or partner systems, or integrations using APIs and EDI were affected. Maersk also said its findings suggest no sensitive data was disclosed and that it does not expect customer disruptions.\u003c/p\u003e\n\n\u003cp\u003eThe statement followed a claim by the WhiteArmor ransomware group that it had attacked LF Logistics, the Hong Kong-based logistics company Maersk acquired in 2022. WhiteArmor claimed it stole 100GB of data, including information related to drivers, warehouses, and customers, and demanded $5 million within 30 days. The event comes amid other recent cyber incidents affecting shipping and port operations, including an attack on Brazil’s Santos Port Authority that caused a power outage, cargo delays, and manual scheduling and billing work; the authority said it had restored about 70% of its systems from backups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Maersk said unauthorized actors accessed a legacy system from a previous acquisition and that the incident was isolated to a local system.","Maersk said it found no indication that other Maersk systems or customer and partner systems connected through APIs and EDI were affected.","The WhiteArmor ransomware group claimed it attacked LF Logistics, which Maersk acquired in 2022, stole 100GB of data, and demanded $5 million within 30 days.","Maersk said its findings suggest no sensitive data was disclosed and that it does not expect customer disruptions.","A separate cyber incident at Brazil’s Santos Port Authority caused a power outage and cargo-handling delays, while the authority said it had restored about 70% of its systems through backups."],"insights":["The Maersk incident shows that systems inherited through acquisitions can remain a distinct source of exposure years after a deal closes, as LF Logistics was acquired in 2022.","There is a notable gap between WhiteArmor’s claim of stealing 100GB of LF Logistics data and Maersk’s statement that its findings show no sensitive data was disclosed.","Maersk said the affected system was isolated and that connected customer and partner systems using APIs and EDI showed no indication of impact, limiting the reported scope beyond the local system.","The Santos Port Authority’s recovery of about 70% of its systems through backups illustrates the practical role backups played in restoring port operations after its incident."],"referencedReports":[],"body":"\u003cp\u003eMaersk said threat actors gained access to a legacy system inherited through a previous acquisition, but that the incident was isolated to a local system. The company said it found no indication that other Maersk systems, connected customer or partner systems, or integrations using APIs and EDI were affected. Maersk also said its findings suggest no sensitive data was disclosed and that it does not expect customer disruptions.\u003c/p\u003e\n\n\u003cp\u003eThe statement followed a claim by the WhiteArmor ransomware group that it had attacked LF Logistics, the Hong Kong-based logistics company Maersk acquired in 2022. WhiteArmor claimed it stole 100GB of data, including information related to drivers, warehouses, and customers, and demanded $5 million within 30 days. The event comes amid other recent cyber incidents affecting shipping and port operations, including an attack on Brazil’s Santos Port Authority that caused a power outage, cargo delays, and manual scheduling and billing work; the authority said it had restored about 70% of its systems from backups.\u003c/p\u003e\n"},{"n":28,"title":"New SignDrop Zero-Day Exploit Turns Windows CLFS Security Feature Into SYSTEM Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/new-signdrop-zero-day-exploit-turns.html","time":"17:50","priority":"SHOULD READ","score":82,"tldr":"Public SignDrop proof-of-concept code claims a local Windows user can abuse the CLFS log-authentication feature and Microsoft Defender to gain SYSTEM privileges on recent Windows versions. Microsoft has not confirmed, assigned a CVE, or patched the issue, though independent testing found the exploit works but is unreliable and conspicuous.","briefOverview":"\u003cp\u003ePublic proof-of-concept code called SignDrop claims that a local Windows user can obtain SYSTEM privileges through the Common Log File System (CLFS) driver. The technique targets a log-authentication feature Microsoft added in October 2025 to protect CLFS log files from tampering. Microsoft had not confirmed the flaw, assigned it a CVE, or released a fix at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eAccording to the researcher, an attacker can prepare a CLFS log and use object manager symbolic links to redirect creation of a related \u003ccode\u003e.cnpf\u003c/code\u003e recovery file when a privileged process opens the log. The published chain uses the Microsoft Defender antimalware service, causing the file to be created under SYSTEM privileges while remaining writable by the standard user, which can be chained into a SYSTEM shell. Independent testing by 78researchlab found the exploit works but is not reliable enough for operational use, and the demonstrated method is noticeable because it alters UAC prompts to open both standard-user and SYSTEM shells.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A public proof of concept named SignDrop claims that a local Windows user can gain SYSTEM privileges by abusing companion-file creation in the Common Log File System driver’s log-authentication feature.","The published exploit redirects creation of a CLFS .cnpf recovery file through object manager symbolic links and uses the Microsoft Defender antimalware service as the privileged process in its demonstrated chain.","The researcher says recent Windows 11 and Windows Server 2025 systems are affected when the CLFS Authentication Mode registry setting is 0 or 1, while modes 2 and 3 disable the mitigation but allow CLFS to parse tampered log files.","Researcher Heewon Song of 78researchlab independently tested the exploit and found it works, but assessed that it is not reliable enough for operational use.","Microsoft had not confirmed SignDrop, assigned it a CVE, or released a patch as of the article’s publication."],"insights":["The CLFS authentication protection intended to prevent tampered log files from being parsed is itself the feature SignDrop targets, through creation of its associated recovery file.","The claimed affected configuration includes both learning and enforced authentication modes, and established systems typically move automatically to enforced mode after 90 days.","Disabling CLFS authentication removes the claimed SignDrop attack surface but re-enables the risk that CLFS will parse tampered log files, which the protection was designed to prevent.","The published demonstration depends on Microsoft Defender being enabled and visibly causes UAC prompts to open both a standard-user shell and a SYSTEM shell, making the activity noticeable to someone using the computer."],"referencedReports":[{"title":"SignDrop","url":"https://github.com/MSNightmare/SignDrop","publisher":"msnightmare","context":"The article cites the researcher’s proof-of-concept code and detailed writeup describing the claimed CLFS privilege-escalation technique.","category":"research","primary":true},{"title":"Published assessment of SignDrop","url":"https://www.linkedin.com/pulse/20261112-%EB%AA%A8%EB%8B%9D%EB%B3%B4%EC%95%88%EA%B8%B0%EC%88%A0kren-sungyup-nam-z2wmc/","publisher":"78researchlab","context":"The article cites Sungyup Nam’s published assessment reporting that a PurpleHound researcher tested the exploit and found it works but is unreliable.","category":"research","primary":false},{"title":"Common Log File System (CLFS) authentication mitigation","url":"https://support.microsoft.com/en-us/servicing/os/windows/2025/03/common-log-file-system-clfs-authentication-mitigation","publisher":"microsoft","context":"The article references Microsoft’s mitigation guidance for the CLFS Authentication Mode setting and the risks of disabling it.","category":"guide","primary":false}],"body":"\u003cp\u003ePublic proof-of-concept code called SignDrop claims that a local Windows user can obtain SYSTEM privileges through the Common Log File System (CLFS) driver. The technique targets a log-authentication feature Microsoft added in October 2025 to protect CLFS log files from tampering. Microsoft had not confirmed the flaw, assigned it a CVE, or released a fix at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eAccording to the researcher, an attacker can prepare a CLFS log and use object manager symbolic links to redirect creation of a related \u003ccode\u003e.cnpf\u003c/code\u003e recovery file when a privileged process opens the log. The published chain uses the Microsoft Defender antimalware service, causing the file to be created under SYSTEM privileges while remaining writable by the standard user, which can be chained into a SYSTEM shell. Independent testing by 78researchlab found the exploit works but is not reliable enough for operational use, and the demonstrated method is noticeable because it alters UAC prompts to open both standard-user and SYSTEM shells.\u003c/p\u003e\n"},{"n":36,"title":"Google Cloud Warns Three AMD Turin CPU Flaws Could Leak Data Across Processes in VMs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/google-cloud-warns-three-amd-turin-cpu.html","time":"12:09","priority":"SHOULD READ","score":82,"tldr":"Google Cloud warns that three AMD EPYC Turin transient scheduler side-channel flaws could expose data between processes inside a VM; customers must apply guest OS patches and stop then start affected VMs once Google’s CPU-information update is available. Google has already mitigated cross-VM and VM-to-host risks, while bare-metal users need firmware and OS updates.","briefOverview":"\u003cp\u003eGoogle Cloud warned that three AMD EPYC Turin processor flaws could allow code running on the same processor core within a virtual machine to infer data from other processes or the kernel. The affected Google Cloud machine series are C4D, N4D, H4D, Z4D, and G4, including C4D and Z4D bare-metal instances. Google rated the issue Medium and said it has already applied mitigations for attacks between VMs and between VMs and the host. The remaining concern is exposure among processes inside an affected VM.\u003c/p\u003e\n\n\u003cp\u003eThe flaws are transient scheduler attacks: TSA-SQ (CVE-2024-36350), TSA-L1 (CVE-2024-36357), and CVE-2026-0004, which the Xen Project calls TSA-Fill. AMD says Zen 5 processors, including Turin, are affected differently than previously characterized AMD processors. AMD classifies all three as local attacks with high attack complexity and low privilege requirements, and neither AMD nor Google reported exploitation. None of the flaws was in CISA’s Known Exploited Vulnerabilities catalog at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eFor affected VMs, customers should install their operating-system vendor’s fix when available, then stop and start the VM after Google updates the CPU information reported to it; Google states that rebooting the guest OS alone is not enough. Bare-metal customers running their own operating system or hypervisor should apply vendor fixes, while GKE node images for Turin-based bare-metal instances are planned and Cloud Run requires no action. For Turin systems on customer-owned hardware, AMD says both platform firmware and OS updates are needed for full mitigation, which may affect performance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google Cloud warned that three AMD EPYC Turin CPU flaws could allow code running on the same processor core inside a virtual machine to infer data from other processes or the kernel.","Google says it has already applied mitigations for attacks between virtual machines and between virtual machines and the host, while affected machine series include C4D, N4D, H4D, Z4D, and G4.","The flaws are TSA-SQ (CVE-2024-36350), TSA-L1 (CVE-2024-36357), and the newly disclosed CVE-2026-0004, also called TSA-Fill by the Xen Project.","Affected Google Cloud VM customers should install their operating system vendor’s fix when available and stop then start the VM after Google’s CPU-information update arrives, because a guest reboot alone is insufficient.","AMD says full mitigation for Turin servers on customer-owned hardware requires both platform firmware and operating-system updates, and may affect performance."],"insights":["For affected Google Cloud VMs, an ordinary reboot is explicitly insufficient; customers must stop and start the VM after Google updates the CPU information it reports.","Google has addressed the higher-isolation risks between VMs and between a VM and its host, but processes within the same VM may still be exposed until the guest operating system mitigation is enabled.","Customers may face a remediation gap because Google provides no interim action for operating systems whose vendors have not released a fix, and does not explain how to determine when its CPU-information update has reached a VM.","As of the article’s publication, none of the three flaws was listed in CISA’s Known Exploited Vulnerabilities catalog, and neither AMD nor Google reported active exploitation."],"referencedReports":[{"title":"Google Cloud Security Bulletin GCP-2026-081","url":"https://docs.cloud.google.com/support/bulletins#gcp-2026-081","publisher":"google-cloud","context":"Google’s security bulletin provides the mitigation and restart instructions for affected services.","category":"advisory","primary":true},{"title":"AMD Security Bulletin AMD-SB-7073","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7073.html","publisher":"amd","context":"AMD’s Zen 5 bulletin classifies the transient scheduler flaws as local, high-complexity attacks requiring low privileges.","category":"advisory","primary":false},{"title":"AMD Security Bulletin AMD-SB-3055","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3055.html","publisher":"amd","context":"AMD’s advisory covers the newly disclosed CVE-2026-0004 flaw.","category":"advisory","primary":false},{"title":"Technical Guidance for Mitigating Transient Scheduler Attacks","url":"https://www.amd.com/content/dam/amd/en/documents/resources/bulletin/technical-guidance-for-mitigating-transient-scheduler-attacks.pdf","publisher":"amd","context":"AMD’s technical guidance states that customer-owned Turin servers need both firmware and operating-system updates and that mitigation may affect performance.","category":"guide","primary":false},{"title":"Xen Security Advisory 525","url":"https://xenbits.xen.org/xsa/advisory-525.html","publisher":"xen-project","context":"The Xen Project advisory publishes hypervisor patches and notes that Zen 5 microcode for the TSA flaws has been available in linux-firmware since September 23.","category":"advisory","primary":false}],"body":"\u003cp\u003eGoogle Cloud warned that three AMD EPYC Turin processor flaws could allow code running on the same processor core within a virtual machine to infer data from other processes or the kernel. The affected Google Cloud machine series are C4D, N4D, H4D, Z4D, and G4, including C4D and Z4D bare-metal instances. Google rated the issue Medium and said it has already applied mitigations for attacks between VMs and between VMs and the host. The remaining concern is exposure among processes inside an affected VM.\u003c/p\u003e\n\n\u003cp\u003eThe flaws are transient scheduler attacks: TSA-SQ (CVE-2024-36350), TSA-L1 (CVE-2024-36357), and CVE-2026-0004, which the Xen Project calls TSA-Fill. AMD says Zen 5 processors, including Turin, are affected differently than previously characterized AMD processors. AMD classifies all three as local attacks with high attack complexity and low privilege requirements, and neither AMD nor Google reported exploitation. None of the flaws was in CISA’s Known Exploited Vulnerabilities catalog at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eFor affected VMs, customers should install their operating-system vendor’s fix when available, then stop and start the VM after Google updates the CPU information reported to it; Google states that rebooting the guest OS alone is not enough. Bare-metal customers running their own operating system or hypervisor should apply vendor fixes, while GKE node images for Turin-based bare-metal instances are planned and Cloud Run requires no action. For Turin systems on customer-owned hardware, AMD says both platform firmware and OS updates are needed for full mitigation, which may affect performance.\u003c/p\u003e\n"},{"n":37,"title":"186 Fake AI Domains Redirect Users to ClickFix Lures, Browser Malware, and Search Hijackers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/186-fake-ai-domains-redirect-users-to.html","time":"15:15","priority":"SHOULD READ","score":82,"tldr":"Researchers uncovered 186 typosquatted AI-tool domains that redirect users to ClickFix prompts, Net Guard browser-hijacking behavior, or Chrome search-hijacker extensions. A mistyped address for services such as ChatGPT, Claude, Gemini, or Perplexity can expose users to malicious commands, unwanted browser changes, and search-query leakage.","briefOverview":"\u003cp\u003eIsland researchers identified a campaign called TypoPrompting that uses 186 lookalike domains across 27 AI brands, including ChatGPT, Claude, Gemini, Copilot, DeepSeek, Perplexity, and Midjourney. The domains target people who mistype familiar AI-service addresses and redirect them to malicious or unwanted destinations. Some listed lookalikes include cloude[.]ai, chatlgpt[.]com, geimini[.]com, deepceek[.]com, and preplexity[.]ai.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses three routes: ClickFix-style fake verification pages, fake Security Check pages delivering Net Guard, and Chrome extensions that hijack searches. The ClickFix route fingerprints the browser and collects the public IP address before presenting a fake Cloudflare page that instructs Windows users to run a PowerShell command, macOS users to run a shell command, or visitors to download and run an executable. Island said Net Guard is the unmodified Microsoft Store app signed by Microsoft, but it can run operator-controlled JavaScript, change Chrome\u0026rsquo;s default search engine while the user is idle, edit browser profiles, and install arbitrary Chrome extensions.\u003c/p\u003e\n\n\u003cp\u003eA Perplexity lookalike, preplexity[.]ai, redirects to the Quick Search extension, which changes the browser\u0026rsquo;s default search provider to find.flashysearches[.]com and sends searches to a third party. Island found Quick Search belongs to a group of 16 Chrome Web Store extensions with 972,000 declared users as of November 3, 2026. The article notes that workplace searches routed this way can include internal hostnames, customer names, and project details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Island identified a TypoPrompting campaign involving 186 lookalike domains across 27 AI brands, including ChatGPT, Claude, Gemini, Copilot, DeepSeek, Mistral, Perplexity, Midjourney, ElevenLabs, Lovable, and Cursor.","The domains direct visitors through three routes: fake verification pages that prompt users to run commands, fake Security Check pages delivering Net Guard, and search-hijacking Chrome extensions.","The ClickFix route fingerprints the visitor's browser and collects its public IP address before showing a fake Cloudflare verification page that provides a PowerShell command on Windows.","Island said the Microsoft Store version of Net Guard is unmodified and signed by Microsoft, but includes capabilities to change Chrome search settings, alter browser profiles, install Chrome extensions, and run operator-controlled JavaScript.","A Perplexity lookalike domain redirects users to the Quick Search Chrome extension, one of 16 related extensions with a combined 972,000 declared users as of November 3, 2026."],"insights":["Net Guard is distributed byte-for-byte as the Microsoft Store version and carries Microsoft’s Store signature, yet Island said every copy includes hidden browser-control capabilities that activate without asking.","The ClickFix fingerprinting gate extends beyond AI lookalikes to 211 entry domains impersonating banks, insurers, telecoms, and enterprise software providers.","Quick Search can redirect searches to a third party through its browser-search-provider setting without needing executable JavaScript or declared permissions for its main action.","Some AI lookalike domains, including cloude[.]ai and cluade[.]ai, were registered as early as July 2023, showing that the infrastructure predates the reported campaign by years."],"referencedReports":[{"title":"TypoPrompting: From AI Typos to Malware","url":"https://www.island.io/blog/typoprompting-from-ai-typos-to-malware","publisher":"island","context":"The article is based on Island's report identifying AI lookalike domains that lead to ClickFix lures, Net Guard, and search-hijacking browser extensions.","category":"research","primary":true}],"body":"\u003cp\u003eIsland researchers identified a campaign called TypoPrompting that uses 186 lookalike domains across 27 AI brands, including ChatGPT, Claude, Gemini, Copilot, DeepSeek, Perplexity, and Midjourney. The domains target people who mistype familiar AI-service addresses and redirect them to malicious or unwanted destinations. Some listed lookalikes include cloude[.]ai, chatlgpt[.]com, geimini[.]com, deepceek[.]com, and preplexity[.]ai.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses three routes: ClickFix-style fake verification pages, fake Security Check pages delivering Net Guard, and Chrome extensions that hijack searches. The ClickFix route fingerprints the browser and collects the public IP address before presenting a fake Cloudflare page that instructs Windows users to run a PowerShell command, macOS users to run a shell command, or visitors to download and run an executable. Island said Net Guard is the unmodified Microsoft Store app signed by Microsoft, but it can run operator-controlled JavaScript, change Chrome\u0026rsquo;s default search engine while the user is idle, edit browser profiles, and install arbitrary Chrome extensions.\u003c/p\u003e\n\n\u003cp\u003eA Perplexity lookalike, preplexity[.]ai, redirects to the Quick Search extension, which changes the browser\u0026rsquo;s default search provider to find.flashysearches[.]com and sends searches to a third party. Island found Quick Search belongs to a group of 16 Chrome Web Store extensions with 972,000 declared users as of November 3, 2026. The article notes that workplace searches routed this way can include internal hostnames, customer names, and project details.\u003c/p\u003e\n"},{"n":16,"title":"Hijacked email accounts complicate investigations into European bomb hoaxes","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/europe-hoax-email-threats","time":"14:45","priority":"SHOULD READ","score":81,"tldr":"A coordinated wave of bomb hoaxes targeting thousands of European schools, airports and newsrooms was sent through compromised accounts at legitimate institutions, helping the messages evade spam controls. Investigators face attribution challenges because the accounts span multiple countries and may have been accessed through anonymizing services.","briefOverview":"\u003cp\u003eBomb threats sent to thousands of schools across Europe were traced to a compromised email account at Taiwan’s Da-Yeh University, while authorities in Bogotá were investigating a possible compromise at a city health agency linked to other hoax messages. A larger wave on Wednesday targeted thousands of Italian state schools and hundreds of schools in Scotland, Northern Ireland, and Ireland, prompting evacuations in Italy. Similar threats previously targeted airports and at least a dozen newsrooms, mostly in Europe.\u003c/p\u003e\n\n\u003cp\u003eThe use of real accounts at legitimate institutions helped the messages pass authentication checks and avoid spam filters. Proofpoint said the threats it examined came from compromised accounts rather than forged addresses and lacked malicious links or attachments, indicating an objective of disruption or intimidation rather than delivering malware or stealing credentials. Investigations are complicated by anonymizing services that may obscure account access records and by the need to obtain evidence across multiple jurisdictions through slow legal-assistance processes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bomb threats sent to thousands of European schools were traced to a compromised email account at Taiwan’s Da-Yeh University, which suspended the account used to send them.","Authorities in Scotland, Ireland, and Northern Ireland assessed the mass-distributed school threats as hoaxes or not credible, though the messages prompted evacuations in Italy.","Proofpoint said the threats it examined originated from compromised legitimate accounts rather than forged addresses, enabling messages to pass authentication checks and avoid spam filters.","The campaign also targeted at least a dozen newsrooms and several airports in Europe, and the messages contained no malicious links or attachments.","Investigators face challenges because account-access records may be obscured by anonymizing services and evidence requests must cross multiple national jurisdictions."],"insights":["Using genuine compromised accounts allowed the hoax messages to pass email authentication checks and avoid spam filters, making them appear more trustworthy than messages sent from forged addresses.","Because the threats were sent through legitimate webmail accounts, much of the technical email data points back to the providers’ own services rather than directly to the sender.","The absence of malicious links or attachments led Proofpoint to assess the observed messages as aimed at disruption or intimidation rather than delivering harmful software or stealing credentials.","Different signatures on the messages, including “fighters of the Male State” and “Mikhail Andropov,” do not establish who sent them to an evidentiary standard."],"referencedReports":[],"body":"\u003cp\u003eBomb threats sent to thousands of schools across Europe were traced to a compromised email account at Taiwan’s Da-Yeh University, while authorities in Bogotá were investigating a possible compromise at a city health agency linked to other hoax messages. A larger wave on Wednesday targeted thousands of Italian state schools and hundreds of schools in Scotland, Northern Ireland, and Ireland, prompting evacuations in Italy. Similar threats previously targeted airports and at least a dozen newsrooms, mostly in Europe.\u003c/p\u003e\n\n\u003cp\u003eThe use of real accounts at legitimate institutions helped the messages pass authentication checks and avoid spam filters. Proofpoint said the threats it examined came from compromised accounts rather than forged addresses and lacked malicious links or attachments, indicating an objective of disruption or intimidation rather than delivering malware or stealing credentials. Investigations are complicated by anonymizing services that may obscure account access records and by the need to obtain evidence across multiple jurisdictions through slow legal-assistance processes.\u003c/p\u003e\n"},{"n":1,"title":"Apify rotates API tokens, prompts 2FA resets after breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/apify-rotates-api-tokens-prompts-2fa-resets-after-breach/","time":"14:36","priority":"SHOULD READ","score":78,"tldr":"Apify disclosed unauthorized access to parts of its internal systems on November 9–10, prompting it to rotate API tokens and proxy passwords, reset active sessions, and revoke some OAuth integrations. The company says it found no evidence that customer account data was affected, but some users must reset 2FA because their codes may have been exposed.","briefOverview":"\u003cp\u003eApify disclosed that an unauthorized third party accessed parts of its internal systems on November 9 and 10, 2026. The company detected the activity on November 11 at 12:13 UTC, cut off the attacker’s access, and began an investigation into the impact. Apify is a Czech web-scraping and browser-automation platform that reports having 80,000 customers.\u003c/p\u003e\n\n\u003cp\u003eIn response, Apify invalidated internal credentials, rotated API tokens and Apify Proxy passwords for impacted customers, and reset all active sessions. It also revoked OAuth connections to external services, including GitHub, and said affected users would receive email when it is safe to reconnect. Apify said it found no indication that account data stored on its platform was affected, but advised some customers to reset two-factor authentication because their codes may have been exposed, while stating that passwords remain safe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apify said an unauthorized third party accessed parts of its internal systems on November 9 and 10, 2026, and the company detected the incident on November 11 at 12:13 UTC.","Apify responded by cutting off the attacker’s access, invalidating internal credentials, rotating API tokens, and resetting all active sessions.","The company revoked OAuth connections to external integrations, including GitHub, and said affected users would be notified by email when it is safe to reconnect.","Apify said it found no indication that account data stored on its platform was affected, while impacted customers’ Apify API tokens and Apify Proxy passwords were rotated.","Some affected customers were advised to reset two-factor authentication through the Apify Console because their two-factor authentication codes may have been exposed, although Apify said passwords remained safe."],"insights":["The incident response treated access credentials and connected third-party accounts as separate risks: Apify rotated API and proxy credentials while also revoking OAuth links such as GitHub connections.","Affected users may need to reset two-factor authentication even though Apify said passwords remained safe, because the company warned that two-factor codes may have been exposed.","Apify revoked external OAuth connections as a precaution and plans to notify affected users by email when reconnection is safe, rather than asking them to reconnect immediately.","Although Apify reported no indication that stored account data was affected, it still reset all active sessions and rotated customer-facing access credentials."],"referencedReports":[],"body":"\u003cp\u003eApify disclosed that an unauthorized third party accessed parts of its internal systems on November 9 and 10, 2026. The company detected the activity on November 11 at 12:13 UTC, cut off the attacker’s access, and began an investigation into the impact. Apify is a Czech web-scraping and browser-automation platform that reports having 80,000 customers.\u003c/p\u003e\n\n\u003cp\u003eIn response, Apify invalidated internal credentials, rotated API tokens and Apify Proxy passwords for impacted customers, and reset all active sessions. It also revoked OAuth connections to external services, including GitHub, and said affected users would receive email when it is safe to reconnect. Apify said it found no indication that account data stored on its platform was affected, but advised some customers to reset two-factor authentication because their codes may have been exposed, while stating that passwords remain safe.\u003c/p\u003e\n"},{"n":53,"title":"Step 1: Phish Mitiga. Step 2: Get Your Kit Dissected","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/step-1-phish-mitiga-get-dissected","time":"16:39","priority":"SHOULD READ","score":78,"tldr":"Mitiga uncovered an ongoing phishing campaign that uses compromised Microsoft Office 365 accounts, AWS infrastructure, Oracle Cloud-hosted fake login pages, and dozens of compromised websites to steal credentials. Organizations should enforce MFA and investigate mailbox rules, hidden folders, and suspicious sign-ins for signs of account compromise.","briefOverview":"\u003cp\u003eMitiga investigated an ongoing phishing campaign, active since at least April 2020, that impersonates Microsoft Office 365 voicemail notifications to steal user credentials. The emails are sent from legitimate Office 365 accounts that have been compromised by an unknown threat actor. The campaign has targeted small and medium-sized businesses and major financial institutions in the United States and Australia, particularly C-level executives.\u003c/p\u003e\n\n\u003cp\u003eAfter a victim clicks the voicemail link, the traffic is redirected through several proxies, including AWS load balancers, before reaching a compromised legitimate website and ultimately a fake Office 365 sign-in page. Mitiga identified more than 40 compromised SMB websites used in this infrastructure, while the fake login pages were hosted on Oracle Cloud resources or, in some cases, AWS S3 buckets imitating Zoom invitations. Entered credentials were sent to compromised legitimate websites, potentially enabling deeper access to victim organizations or business email compromise.\u003c/p\u003e\n\n\u003cp\u003eMitiga found parallel versions of the phishing pages with small code and infrastructure differences, which it said may indicate a third-party phishing platform used by several sub-groups. The researchers also found references to Asian locations and Indonesian words in the page code, but cautioned that these could be false flags. Mitiga recommends enforcing Office 365 multi-factor authentication and reviewing mailbox forwarding rules, hidden folders, login and settings changes, and suspicious account activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mitiga identified an ongoing phishing campaign, active since at least April 2020, that impersonates Microsoft Office 365 voicemail notifications to steal account credentials.","The phishing emails were sent from legitimate but compromised Office 365 accounts and directed victims through AWS load balancers and compromised websites to fake Office 365 sign-in pages.","The fake sign-in pages were hosted on Oracle Cloud infrastructure in many cases, while some were hosted in AWS S3 buckets with names imitating Zoom invitations.","Mitiga identified more than 40 compromised small and medium-sized business websites used in the campaign's proxy chain and credential-exfiltration infrastructure.","The campaign targeted email addresses at small and medium-sized businesses and major financial institutions in the United States and Australia, with a focus on C-level executives."],"insights":["The campaign used a layered delivery chain involving AWS load balancers, more than 40 compromised websites, and cloud-hosted fake login pages, making the phishing links appear to pass through legitimate infrastructure.","Different but parallel versions of the phishing pages, including changed code names and credential-collection sites, led Mitiga to assess that the infrastructure may be a third-party phishing platform used by multiple groups.","The phishing emails originated from compromised legitimate Office 365 accounts, so recipients could receive malicious messages from real accounts rather than obviously forged senders.","Mitiga recommends checking mailbox forwarding rules, hidden folders, and unexpected messages in built-in folders such as RSS Feeds because account compromise may involve changes beyond stolen passwords.","Code references to Asian locations and Indonesian words were identified in the phishing pages, but Mitiga cautioned that these could be deliberate false flags rather than reliable attribution evidence."],"referencedReports":[],"body":"\u003cp\u003eMitiga investigated an ongoing phishing campaign, active since at least April 2020, that impersonates Microsoft Office 365 voicemail notifications to steal user credentials. The emails are sent from legitimate Office 365 accounts that have been compromised by an unknown threat actor. The campaign has targeted small and medium-sized businesses and major financial institutions in the United States and Australia, particularly C-level executives.\u003c/p\u003e\n\n\u003cp\u003eAfter a victim clicks the voicemail link, the traffic is redirected through several proxies, including AWS load balancers, before reaching a compromised legitimate website and ultimately a fake Office 365 sign-in page. Mitiga identified more than 40 compromised SMB websites used in this infrastructure, while the fake login pages were hosted on Oracle Cloud resources or, in some cases, AWS S3 buckets imitating Zoom invitations. Entered credentials were sent to compromised legitimate websites, potentially enabling deeper access to victim organizations or business email compromise.\u003c/p\u003e\n\n\u003cp\u003eMitiga found parallel versions of the phishing pages with small code and infrastructure differences, which it said may indicate a third-party phishing platform used by several sub-groups. The researchers also found references to Asian locations and Indonesian words in the page code, but cautioned that these could be false flags. Mitiga recommends enforcing Office 365 multi-factor authentication and reviewing mailbox forwarding rules, hidden folders, login and settings changes, and suspicious account activity.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft confirms Windows security updates installation issues","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-confirms-kb5132061-installation-issues-0x80070306-0x800f0989-0x800f0993-errors/","time":"10:24","priority":"MAY READ","score":72,"tldr":"Microsoft confirmed that November 2026 Windows 11 security update KB5132061 can fail on some devices that installed the October preview update KB5127936, producing installation errors. Microsoft says an automatic repair will reach affected devices within 24–48 hours, after which the security update should install normally.","briefOverview":"\u003cp\u003eMicrosoft confirmed that the November 2026 Windows 11 security update, KB5132061, may fail to install on a limited number of devices. The problem affects systems that previously installed the October 2026 non-security preview update, KB5127936. Devices that did not receive the October preview update are not affected, according to Microsoft.\u003c/p\u003e\n\n\u003cp\u003eAffected systems may repeatedly try to install the update, freeze partway through installation, or show error codes 0x80070306, 0x800f0989, or 0x800f0993. Microsoft said it will automatically repair affected devices within 24 to 48 hours starting November 11, 2026, after which Windows Update should download and install the November security update. The company said end users do not need to take action and advised IT administrators to contact Microsoft Support if the issue persists after 48 hours.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that some Windows 11 devices cannot complete installation of the November 2026 security update KB5132061.","The issue affects a limited number of devices that installed the October 2026 non-security preview update KB5127936, while devices that did not install that preview update are not affected.","Affected devices may repeatedly attempt the update or display error codes 0x80070306, 0x800f0989, or 0x800f0993.","Microsoft said it will automatically repair affected devices within 24 to 48 hours from November 11, 2026, after which Windows Update will download and install the November security update.","Microsoft advised IT administrators to contact Microsoft Support if installation issues continue after 48 hours."],"insights":["The installation problem is narrowly linked to devices that installed the October 2026 optional preview update, rather than to all Windows 11 systems receiving the November security update.","Microsoft expects the repair to occur automatically, so affected end users do not need to manually fix their computers before the security update can be installed.","The issue can present as repeated update attempts as well as several different error codes, which may make the same underlying problem appear differently across affected devices.","IT administrators should wait through Microsoft's stated 24-to-48-hour repair window and contact Microsoft Support only if affected devices still fail afterward."],"referencedReports":[{"title":"Microsoft service update on Windows Update installation issues","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1549693","publisher":"microsoft","context":"Microsoft's service update confirms that some devices cannot complete installation of the November 2026 Windows security update after installing the October preview update.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that the November 2026 Windows 11 security update, KB5132061, may fail to install on a limited number of devices. The problem affects systems that previously installed the October 2026 non-security preview update, KB5127936. Devices that did not receive the October preview update are not affected, according to Microsoft.\u003c/p\u003e\n\n\u003cp\u003eAffected systems may repeatedly try to install the update, freeze partway through installation, or show error codes 0x80070306, 0x800f0989, or 0x800f0993. Microsoft said it will automatically repair affected devices within 24 to 48 hours starting November 11, 2026, after which Windows Update should download and install the November security update. The company said end users do not need to take action and advised IT administrators to contact Microso
