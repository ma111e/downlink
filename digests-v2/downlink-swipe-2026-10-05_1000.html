<script type="application/json" id="dl-articles">[{"n":11,"title":"SubQuery Ecosystem Compromise: Hidden Credential Theft and Backdoors","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/subql-ecosystem-compromised","time":"13:15","priority":"MUST READ","score":96,"tldr":"@subql/common version 5.8.3 is a compromised npm package that executes on installation or import to steal credentials, access CI/cloud secrets, and establish remote shell access via ci-artifacts.dev. Organizations should immediately block the domain, prevent resolution of 5.8.3, isolate affected systems, and rotate exposed credentials.","briefOverview":"\u003cp\u003eStepSecurity reported that npm package \u003ccode\u003e@subql/common@5.8.3\u003c/code\u003e contains a hidden payload that runs both during installation and when the package is imported. The package is part of the SubQuery ecosystem, and other SubQuery packages may resolve to this version through permitted dependency ranges without receiving a new release themselves. The article advises treating 5.8.3 as unsafe, blocking \u003ccode\u003eci-artifacts.dev\u003c/code\u003e, and investigating systems where the version was installed or loaded.\u003c/p\u003e\n\n\u003cp\u003eThe investigation found that a temporary GitHub branch published a harmless canary prerelease before a separate commit altered the release workflow for 5.8.3. That workflow downloaded an external archive from \u003ccode\u003eci-artifacts.dev\u003c/code\u003e and replaced the built \u003ccode\u003epackages/common\u003c/code\u003e directory immediately before publication, without hash or signature verification. The recovered payload can collect local, CI, cloud, Kubernetes, Vault, GitHub, npm, SSH, and wallet-related credentials, send encrypted data to \u003ccode\u003eci-artifacts.dev\u003c/code\u003e, and support remote command or shell access. Because the worker can run detached and importing the package also triggers it, uninstalling the package or disabling install scripts alone may not stop it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity’s investigation found that @subql/common version 5.8.3 contains a hidden payload that runs during installation and when the package is imported.","The payload is designed to collect local credentials, process environment data, GitHub tokens, cloud and Kubernetes secrets, and to send encrypted results to ci-artifacts.dev.","A temporary GitHub branch was used to publish a harmless 5.8.3-onf-rt1 canary release and later to publish 5.8.3 after a workflow downloaded and substituted an external package archive from ci-artifacts.dev.","Other SubQuery packages can resolve to @subql/common 5.8.3 through permitted dependency version ranges, even when their parent packages were not newly released.","The article recommends blocking ci-artifacts.dev, excluding version 5.8.3 from dependency resolution, isolating affected systems, and rotating credentials available to affected processes."],"insights":["Disabling npm install scripts alone does not prevent execution because importing @subql/common 5.8.3 also starts its hidden worker.","The malicious release workflow replaced the already built packages/common directory with an archive downloaded from ci-artifacts.dev immediately before npm publication, without hash or signature verification.","The package’s source map contains only a short placeholder TypeScript skeleton and omits the execution paths, so reviewing mapped source alone would not reveal the published JavaScript payload.","The payload’s worker is detached, ignores standard streams, and is unreferenced by its parent process, meaning it can continue after the install or application process exits with little visible output.","Pinning a SubQuery parent package to an exact version does not necessarily prevent exposure because its dependency range can still allow @subql/common 5.8.3."],"referencedReports":[],"body":"\u003cp\u003eStepSecurity reported that npm package \u003ccode\u003e@subql/common@5.8.3\u003c/code\u003e contains a hidden payload that runs both during installation and when the package is imported. The package is part of the SubQuery ecosystem, and other SubQuery packages may resolve to this version through permitted dependency ranges without receiving a new release themselves. The article advises treating 5.8.3 as unsafe, blocking \u003ccode\u003eci-artifacts.dev\u003c/code\u003e, and investigating systems where the version was installed or loaded.\u003c/p\u003e\n\n\u003cp\u003eThe investigation found that a temporary GitHub branch published a harmless canary prerelease before a separate commit altered the release workflow for 5.8.3. That workflow downloaded an external archive from \u003ccode\u003eci-artifacts.dev\u003c/code\u003e and replaced the built \u003ccode\u003epackages/common\u003c/code\u003e directory immediately before publication, without hash or signature verification. The recovered payload can collect local, CI, cloud, Kubernetes, Vault, GitHub, npm, SSH, and wallet-related credentials, send encrypted data to \u003ccode\u003eci-artifacts.dev\u003c/code\u003e, and support remote command or shell access. Because the worker can run detached and importing the package also triggers it, uninstalling the package or disabling install scripts alone may not stop it.\u003c/p\u003e\n"},{"n":4,"title":"Data breach at Denmark’s national population register exposes 8.8 million people","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/denmark-breach-register-cyberattack","time":"12:00","priority":"MUST READ","score":94,"tldr":"Unauthorized users exploited a domestic company’s legitimate access to Denmark’s Central Person Register, exposing names, addresses, and CPR numbers of about 8.8 million people. Danish authorities are investigating the September breach and reviewing the security of the national registry.","briefOverview":"\u003cp\u003eDenmark is investigating unauthorized access to its Central Person Register (CPR), affecting approximately 8.8 million people. The perpetrators exploited an unnamed domestic company’s legitimate access to obtain names, addresses, and CPR numbers. CPR numbers are 10-digit lifelong identifiers used for healthcare, banking, and government services.\u003c/p\u003e\n\n\u003cp\u003eOfficials detected irregular activity affecting the system on Friday and concluded over the weekend that the breach occurred during September. Denmark’s Data Protection Agency said the activity involved a very large number of automated searches intended to identify valid CPR numbers. The government ordered a broad security review, while the country’s digital-security hotline extended its hours in the days following the incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Denmark is investigating unauthorized access to its Central Person Register that affected approximately 8.8 million people.","The perpetrators used an unnamed domestic company’s legitimate access to obtain names, addresses, and CPR numbers.","Officials detected irregular CPR-system activity on Friday and determined that the breach occurred during September.","Denmark’s Data Protection Agency said the incident involved a very large number of automated searches intended to identify valid CPR numbers.","The government ordered a broad security review and extended the operating hours of its digital-security hotline."],"insights":["The affected total exceeds Denmark’s current population because the register also contains records for people who moved abroad and people who are deceased.","CPR numbers begin with a person’s date of birth and are used across healthcare, banking, and government services, so exposure can have long-term consequences because the numbers are intended to last for life.","The unauthorized activity consisted of a very large number of automated searches aimed at finding valid CPR numbers, rather than a disclosed theft of the entire register.","The incident shows that a private company’s legitimate connection to a central government database can become the route to population-scale exposure."],"referencedReports":[],"body":"\u003cp\u003eDenmark is investigating unauthorized access to its Central Person Register (CPR), affecting approximately 8.8 million people. The perpetrators exploited an unnamed domestic company’s legitimate access to obtain names, addresses, and CPR numbers. CPR numbers are 10-digit lifelong identifiers used for healthcare, banking, and government services.\u003c/p\u003e\n\n\u003cp\u003eOfficials detected irregular activity affecting the system on Friday and concluded over the weekend that the breach occurred during September. Denmark’s Data Protection Agency said the activity involved a very large number of automated searches intended to identify valid CPR numbers. The government ordered a broad security review, while the country’s digital-security hotline extended its hours in the days following the incident.\u003c/p\u003e\n"},{"n":8,"title":"Realtek Jungle SDK Exploit Attempts Deliver Cling Botnet With STUN-Based C2","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/realtek-jungle-sdk-exploit-attempts.html","time":"11:46","priority":"SHOULD READ","score":89,"tldr":"Attackers are exploiting the critical Realtek Jungle SDK flaw CVE-2021-35394 to deploy the Cling botnet, which persists on compromised routers and DVRs and can spread to other vulnerable devices. Cling disguises its command-and-control traffic as STUN activity, enabling proxying, tunneling, scanning, and DDoS commands while blending into legitimate-looking network traffic.","briefOverview":"\u003cp\u003eThreat actors have been attempting to exploit CVE-2021-35394, a critical remote-code-execution flaw in the Realtek Jungle SDK, to deploy the Cling botnet. Nozomi Networks observed a spike in these attempts beginning around September 5, 2026, with a subset delivering Cling. The malware also includes exploit logic for known command-injection and remote-code-execution flaws affecting routers and DVRs from several vendors, including Realtek, Eir, MVPower, LB-LINK, FiberHome, China Mobile, TBK, and Linksys.\u003c/p\u003e\n\n\u003cp\u003eCling persists by copying itself to hidden locations and adding itself to startup files on SysV and BusyBox init systems; in an alternative method, it replaces the system\u0026rsquo;s wget binary. Its command-and-control activity imitates ordinary STUN communications, registering infected devices and polling for commands embedded in a STUN transaction ID field. The botnet can scan for and infect additional devices, create TCP tunnels and proxies, and carry out denial-of-service attacks, while some command traffic appeared to originate from an IP address associated with Google\u0026rsquo;s public STUN service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nozomi Networks observed a spike beginning around September 5, 2026, in attempts to exploit the critical Realtek Jungle SDK remote-code-execution flaw CVE-2021-35394, with some attempts delivering the Cling botnet.","Cling contains exploit code for multiple known flaws affecting routers and DVRs, including devices associated with Realtek, Eir, MVPower, LB-LINK, FiberHome, China Mobile, TBK, and Linksys.","The malware attempts to persist by copying itself to hidden paths, adding those copies to startup files, and in some cases replacing the system's wget program after moving the original.","Cling uses STUN-looking network traffic to register infected hosts, receive commands, and make its communications resemble legitimate services used to help devices connect across network boundaries.","Cling commands can scan for and infect additional devices, create or stop tunnels and proxy services, and launch denial-of-service flooding attacks against specified targets."],"insights":["Cling uses an all-zero STUN transaction ID rather than the random value expected by the protocol, providing a distinctive network indicator despite its attempt to blend in with normal STUN traffic.","Its registration messages do not conform to the STUN specification and should be dropped by legitimate STUN servers, while a server at 145.249.115[.]184 showed behavior consistent with being tailored to the botnet.","The malware can achieve persistence by replacing the system's wget program, causing Cling to run whenever a legitimate process attempts to use wget.","Operator command packets appeared to originate from an IP address associated with stun.l.google.com, making commands look like replies from a widely recognized public STUN service."],"referencedReports":[{"title":"A STUNning Disguise: Cling Malware Masquerades as Google","url":"https://www.nozominetworks.com/blog/a-stunning-disguise-cling-malware-masquerades-as-google-","publisher":"nozomi-networks","context":"The article relies on Nozomi Networks' report for its observations of Cling botnet activity, its exploitation of Realtek Jungle SDK, and its STUN-based command-and-control behavior.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors have been attempting to exploit CVE-2021-35394, a critical remote-code-execution flaw in the Realtek Jungle SDK, to deploy the Cling botnet. Nozomi Networks observed a spike in these attempts beginning around September 5, 2026, with a subset delivering Cling. The malware also includes exploit logic for known command-injection and remote-code-execution flaws affecting routers and DVRs from several vendors, including Realtek, Eir, MVPower, LB-LINK, FiberHome, China Mobile, TBK, and Linksys.\u003c/p\u003e\n\n\u003cp\u003eCling persists by copying itself to hidden locations and adding itself to startup files on SysV and BusyBox init systems; in an alternative method, it replaces the system\u0026rsquo;s wget binary. Its command-and-control activity imitates ordinary STUN communications, registering infected devices and polling for commands embedded in a STUN transaction ID field. The botnet can scan for and infect additional devices, create TCP tunnels and proxies, and carry out denial-of-service attacks, while some command traffic appeared to originate from an IP address associated with Google\u0026rsquo;s public STUN service.\u003c/p\u003e\n"},{"n":2,"title":"Alleged dev of Ploutus ATM malware appears in US court after arrest","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/suspected-dev-of-ploutus-atm-malware-appears-in-us-court-after-arrest/","time":"13:01","priority":"SHOULD READ","score":82,"tldr":"U.S. authorities arrested alleged Ploutus malware developer Anibal Alexander Canelon Aguirre, accusing him of helping lead a Tren de Aragua-linked ATM jackpotting operation that stole millions from financial institutions. The scheme allegedly targeted ATMs across 47 states and several countries, using malware designed to resist analysis and erase itself after deployment.","briefOverview":"\u003cp\u003eThe U.S. Department of Justice announced the arrest of Anibal Alexander Canelon Aguirre, also known as “Prometheus” and “The Engineer,” who is accused of developing Ploutus malware and helping lead an ATM jackpotting conspiracy. The FBI added the 50-year-old to its Top 10 Most Wanted Fugitives list in March 2026. Prosecutors allege that he and accomplices deployed Ploutus against bank and credit-union ATMs between February 2024 and December 2025.\u003c/p\u003e\n\n\u003cp\u003eThe alleged attacks stole more than \u003cspan class=\"math inline\"\u003e\\(5.4 million in at least 63 incidents targeting banks and 54 targeting credit unions, with another \\)\u003c/span\u003e1.43 million attempted. The Justice Department said the malware included protections meant to hinder reverse-engineering and debugging, as well as files intended to erase it from cash machines after deployment. Authorities say the proceeds were laundered and transferred to accounts controlled by the Venezuelan Tren de Aragua gang, while the broader conspiracy targeted or carried out attacks in 47 states, Washington, D.C., and several foreign countries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. authorities arrested Anibal Alexander Canelon Aguirre, who is accused of developing Ploutus malware and helping lead an ATM cash-theft conspiracy linked to Tren de Aragua.","Court documents allege that Ploutus was used in ATM jackpotting incidents from February 2024 through December 2025, stealing more than $5.4 million in at least 63 attacks against banks and 54 against credit unions.","The Justice Department said Ploutus included measures intended to hinder forensic review and files designed to remove the malware from affected cash machines.","Canelon Aguirre faces charges including conspiracies to commit bank fraud, money laundering, bank burglary and computer-related fraud, and providing material support to terrorists.","The Justice Department said the investigation found that the conspiracy targeted or conducted ATM jackpotting attacks in 47 states, the District of Columbia, and several foreign countries."],"insights":["The alleged operation combined physical cash-machine theft with anti-forensic software features, including protections against reverse-engineering and debugging and tools intended to remove the malware after use.","The alleged proceeds were not only laundered but transferred to accounts controlled by Tren de Aragua in multiple countries, linking ATM cash theft to the gang’s broader international financial network.","Authorities describe the activity as geographically widespread: the investigation found attacks or attempted targeting across 47 states, Washington, D.C., and several foreign nations.","The enforcement response has expanded beyond the alleged developer, with the Justice Department charging 98 suspects linked to Tren de Aragua ATM jackpotting schemes since October 2025."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. Department of Justice announced the arrest of Anibal Alexander Canelon Aguirre, also known as “Prometheus” and “The Engineer,” who is accused of developing Ploutus malware and helping lead an ATM jackpotting conspiracy. The FBI added the 50-year-old to its Top 10 Most Wanted Fugitives list in March 2026. Prosecutors allege that he and accomplices deployed Ploutus against bank and credit-union ATMs between February 2024 and December 2025.\u003c/p\u003e\n\n\u003cp\u003eThe alleged attacks stole more than \u003cspan class=\"math inline\"\u003e\\(5.4 million in at least 63 incidents targeting banks and 54 targeting credit unions, with another \\)\u003c/span\u003e1.43 million attempted. The Justice Department said the malware included protections meant to hinder reverse-engineering and debugging, as well as files intended to erase it from cash machines after deployment. Authorities say the proceeds were laundered and transferred to accounts controlled by the Venezuelan Tren de Aragua gang, while the broader conspiracy targeted or carried out attacks in 47 states, Washington, D.C., and several foreign countries.\u003c/p\u003e\n"},{"n":6,"title":"Apple Plans Tighter macOS Full Disk Access Controls Over AI Agent Data Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/apple-plans-tighter-macos-full-disk.html","time":"10:38","priority":"SHOULD READ","score":80,"tldr":"Apple plans to tighten macOS Full Disk Access controls after AI agents such as Meta Muse demonstrated how broad permissions can expose users’ messages, files, browsing history, and other sensitive data. The change will require clearer, explicit user approval for this high-risk access.","briefOverview":"\u003cp\u003eApple plans to tighten controls for Full Disk Access (FDA) in macOS because AI agents with this permission can expose highly sensitive user data. FDA lets approved apps bypass some normal protections and read or write files across the system, including data associated with Mail, Messages, Safari, and Time Machine backups. Apple said future changes will ensure such access is granted only through an explicit user action, though it did not provide a release date.\u003c/p\u003e\n\n\u003cp\u003eThe move appears connected to reports that Meta’s Muse agent accessed a journalist’s private iMessages after it was granted FDA. Meta said Muse also requires its separate Messages connector to be enabled before it can read Messages content. Apple warned that communication apps with this level of access can affect not only users’ privacy but also that of the people with whom they communicate.\u003c/p\u003e\n\n\u003cp\u003eThe article also cites research by Patrick Wardle into a now-patched Muse Mac app issue involving an undocumented setting called \u003ccode\u003eendo_voyager_dictation_endpoint\u003c/code\u003e. The issue could allow an unprivileged local process to redirect Muse dictation traffic, capture audio and prompts, inject malicious prompts, and misuse the access granted to Muse. Wardle also reported CVE-2026-100754 in OpenAI’s ChatGPT app for Mac, which could have allowed an attacker to take over the assistant and access chat logs and other app-stored data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apple plans to tighten macOS Full Disk Access controls so that applications receive this broad access only through explicit user action.","Full Disk Access can allow an application to read and write system files and access data from Mail, Messages, Safari, and Time Machine backups.","Apple warned that AI agents with Full Disk Access could expose users’ files, email, messages, and browsing history, as well as the privacy of people they communicate with.","The announcement follows reports that Meta’s Muse accessed a journalist’s private iMessages after Full Disk Access was granted, although Meta said the Messages connector must also be enabled.","Researcher Patrick Wardle demonstrated a now-patched Muse Mac app flaw that could let an unprivileged local process redirect dictation traffic, capture audio and prompts, inject prompts, and abuse the app’s granted access."],"insights":["Meta said Muse can read private Messages content only when both macOS Full Disk Access and Muse’s separate Messages connector are enabled, showing that access can depend on more than one setting.","A now-patched Muse flaw reportedly allowed an unprivileged local process to redirect dictation traffic, capture audio and prompts, inject prompts, and misuse permissions already granted to Muse.","Apple’s concern extends beyond the Mac user: a communication app with broad access can also compromise the privacy of the people the user exchanges messages with.","The article notes that Apple has not said when its revised Full Disk Access controls will be released."],"referencedReports":[{"title":"Meta’s New Muse AI Agent Read My Private Messages. I Never Asked It To.","url":"https://www.inc.com/jason-aten/metas-new-muse-ai-agent-read-my-private-messages-i-never-asked-it-to/91408202","publisher":"inc","context":"The article cites this report as describing how Meta Muse accessed a journalist’s private iMessages after Full Disk Access was granted.","category":"news","primary":false},{"title":"One Hidden Meta Muse Setting Could Let Local Apps Capture Dictation and Abuse Granted Access","url":"https://thehackernews.com/2026/09/one-hidden-meta-muse-setting-could-let.html","publisher":"the-hacker-news","context":"The article references Patrick Wardle’s proof-of-concept analysis of the now-patched Muse Mac app issue involving the endo_voyager_dictation_endpoint setting.","category":"research","primary":false},{"title":"A Flaw in ChatGPT’s Mac App Could Have Let Hackers Grab Sensitive Data","url":"https://www.wired.com/story/a-flaw-in-chatgpts-mac-app-could-have-let-hackers-grab-sensitive-data/","publisher":"wired","context":"The article links to coverage of CVE-2026-100754, which Wardle reported in OpenAI’s ChatGPT app for Mac.","category":"news","primary":false}],"body":"\u003cp\u003eApple plans to tighten controls for Full Disk Access (FDA) in macOS because AI agents with this permission can expose highly sensitive user data. FDA lets approved apps bypass some normal protections and read or write files across the system, including data associated with Mail, Messages, Safari, and Time Machine backups. Apple said future changes will ensure such access is granted only through an explicit user action, though it did not provide a release date.\u003c/p\u003e\n\n\u003cp\u003eThe move appears connected to reports that Meta’s Muse agent accessed a journalist’s private iMessages after it was granted FDA. Meta said Muse also requires its separate Messages connector to be enabled before it can read Messages content. Apple warned that communication apps with this level of access can affect not only users’ privacy but also that of the people with whom they communicate.\u003c/p\u003e\n\n\u003cp\u003eThe article also cites research by Patrick Wardle into a now-patched Muse Mac app issue involving an undocumented setting called \u003ccode\u003eendo_voyager_dictation_endpoint\u003c/code\u003e. The issue could allow an unprivileged local process to redirect Muse dictation traffic, capture audio and prompts, inject malicious prompts, and misuse the access granted to Muse. Wardle also reported CVE-2026-100754 in OpenAI’s ChatGPT app for Mac, which could have allowed an attacker to take over the assistant and access chat logs and other app-stored data.\u003c/p\u003e\n"},{"n":5,"title":"Japanese media group Nikkei discloses cyberattack targeting journalistic sources","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/nikkei-cyberattack-japan-data","time":"13:15","priority":"SHOULD READ","score":78,"tldr":"Nikkei disclosed two compromised employee cloud-email accounts: a Microsoft 365 account used to send about 9,000 phishing emails to contacts including journalistic sources, and a Google Workspace account that may have exposed data for 1,646 people. The incidents highlight a broader wave of recent cyber breaches affecting Japanese companies.","briefOverview":"\u003cp\u003eJapanese media company Nikkei disclosed that an attacker compromised an employee’s Microsoft 365 account and used it on September 30 to send roughly 9,000 phishing emails. The messages, sent to people inside and outside the company including journalistic sources, contained links to malicious websites and targeted people who had previously communicated with Nikkei employees. Nikkei reset the affected account’s password, said it found no further unauthorized access, and asked recipients to delete the messages.\u003c/p\u003e\n\n\u003cp\u003eThe company said the Microsoft 365 incident may have exposed recipients’ names, email addresses, and the contents of some emails, while it continues to determine the number of people affected. In a separate incident disclosed the same day, unauthorized access to a Google Workspace account beginning in late July may have exposed names and email addresses of 1,646 employees and business partners, but Nikkei said this information did not involve readers or journalistic sources. Nikkei has not said whether the incidents were connected or attributed either one to a specific group, and the disclosures come amid recent cyber incidents at other Japanese companies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nikkei disclosed that a compromised Microsoft 365 employee account was used on September 30 to send roughly 9,000 phishing emails to people inside and outside the company, including journalistic sources.","The phishing emails targeted people who had previously communicated with Nikkei employees and contained links to malicious websites.","Nikkei said names, email addresses, and the contents of some emails may have been exposed in the Microsoft 365 incident, and it is still determining how many people were affected.","In a separate incident, an unauthorized user accessed a Nikkei employee’s Google Workspace account beginning in late July, potentially exposing personal information of 1,646 employees and business partners.","Nikkei said it has not determined whether the Google Workspace and Microsoft 365 incidents were connected, and neither has been attributed to a specific hacking group."],"insights":["The Microsoft 365 compromise was especially sensitive because it targeted people who had previously communicated with Nikkei employees, including journalistic sources, rather than an unrelated mass audience.","Nikkei’s warning that impersonation messages may increase means recipients face an ongoing risk even after the company reset the compromised account’s password.","The two incidents had different stated exposure scopes: the Google Workspace case did not involve reader or journalistic-source information, while the Microsoft 365 case may have exposed information tied to journalistic sources.","Nikkei has experienced several prior cyber incidents, including a 2025 Slack-related credential theft and a 2022 ransomware incident affecting its Singapore headquarters."],"referencedReports":[],"body":"\u003cp\u003eJapanese media company Nikkei disclosed that an attacker compromised an employee’s Microsoft 365 account and used it on September 30 to send roughly 9,000 phishing emails. The messages, sent to people inside and outside the company including journalistic sources, contained links to malicious websites and targeted people who had previously communicated with Nikkei employees. Nikkei reset the affected account’s password, said it found no further unauthorized access, and asked recipients to delete the messages.\u003c/p\u003e\n\n\u003cp\u003eThe company said the Microsoft 365 incident may have exposed recipients’ names, email addresses, and the contents of some emails, while it continues to determine the number of people affected. In a separate incident disclosed the same day, unauthorized access to a Google Workspace account beginning in late July may have exposed names and email addresses of 1,646 employees and business partners, but Nikkei said this information did not involve readers or journalistic sources. Nikkei has not said whether the incidents were connected or attributed either one to a specific group, and the disclosures come amid recent cyber incidents at other Japanese companies.\u003c/p\u003e\n"},{"n":9,"title":"Your Own MX Signed the Phish. Then DKIM Failed.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/forwarding-mx-signed-inbound-phish-with-recipients-own-dkim-key","time":"11:00","priority":"MAY READ","score":68,"tldr":"A legacy cPanel/Exim MX forwarding mail to Microsoft 365 signed an inbound Meta-themed phishing email with the recipient organization’s own DKIM domain, then subsequent relaying broke the signature and made the victim appear responsible for the failure. The case shows why DKIM and spam verdicts must be interpreted across the full mail path, not as proof that a domain sent or endorsed a message.","briefOverview":"\u003cp\u003eA Meta for Business trademark-complaint phishing email reached a South African motor-dealership group through a legacy cPanel and Exim host that still receives mail for the group’s primary domain before redirecting it into Microsoft 365. The forwarding host applied a DKIM signature in the dealership’s own domain to a message it had accepted from a third party. Later relaying modified the message, causing that signature to fail at final delivery alongside \u003ccode\u003ecompauth=fail\u003c/code\u003e. The resulting headers appeared to attribute a DKIM failure to the recipient organization despite the organization not having sent the email.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that a DKIM failure for an organization’s own domain can be caused by its own forwarding infrastructure signing incoming mail, rather than by external spoofing. The message crossed a Sophos gateway multiple times and two Microsoft 365 tenants, where it received divergent spam scores, including \u003ccode\u003eSCL:9\u003c/code\u003e at one hop and \u003ccode\u003eSCL:-1\u003c/code\u003e at another. The article attributes those differences to each layer assessing the preceding relay’s identity and reputation rather than the message content. It recommends determining whether legacy MX hosts sign forwarded inbound mail and interpreting authentication and spam results across the complete mail path.\u003c/p\u003e\n\n\u003cp\u003eThe lure used a display name of Meta for Business, claimed in its body to be from \u003ccode\u003esupport@meta.com\u003c/code\u003e, and directed recipients to a Submit Appeal link hosted on a Cloudflare Workers subdomain that an independent scanner marked malicious. Its actual From domain was an abused education-sector Google Workspace account, while visible errors included an email address presented as the affected Facebook asset and a malformed business name. The kit used styled text and CSS-drawn graphics instead of external images, and the delivered link had been rewritten by the recipient gateway. The article presents this as an example of credential phishing passing authenticated transport checks while inconsistent relay-based judgments and self-inflicted DKIM failures obscure the message’s origin and risk.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A legacy cPanel and Exim host in front of a South African motor-dealership group’s Microsoft 365 environment forwarded an inbound phishing email and applied a DKIM signature using the group’s own domain.","The forwarded message was modified again later in transit, causing the dealership domain’s DKIM signature to fail verification at delivery alongside a compauth failure.","The phishing email impersonated Meta for Business through its display name and claimed to be from support@meta.com, while its actual From domain was an abused education-sector Google Workspace account.","The email’s Submit Appeal link led to a Cloudflare Workers subdomain on a /meta.help path that an independent scanner classified as malicious.","Different Microsoft 365 hops assigned contrasting spam verdicts to the message, including SCL:9 and SCL:-1, based on the relay identity being evaluated."],"insights":["A DKIM failure naming an organization’s own domain is not necessarily evidence that outsiders are spoofing that organization; it can result from the organization’s forwarding server signing inbound mail and later changes breaking that signature.","The article shows that mail security verdicts can reflect the reputation of the immediately preceding relay rather than the underlying message, so the same email received both spam and trusted-sender assessments across different hops.","The phishing kit avoided external images by rendering its branding with styled text and CSS shapes, removing tracking pixels and image fetches that some detection methods could examine.","The gateway’s rewritten link was tied directly to the message through a hash matching the gateway email ID, meaning the delivered phishing email contained both the recipient infrastructure’s DKIM signature and its own link-rewrite wrapper.","The lure’s visible inconsistencies, including an email address presented as the affected Facebook asset and a malformed business name, provided stronger evidence of deception than its authenticated transport details."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for statistics on phishing as an initial access vector, credential use across the kill chain, and gateway attack mix.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references the report to support its statement that attackers increasingly abuse legitimate services and valid accounts so authentication checks pass.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites this guidance when explaining that phishing is defined by deception rather than the transport path.","category":"guide","primary":false}],"body":"\u003cp\u003eA Meta for Business trademark-complaint phishing email reached a South African motor-dealership group through a legacy cPanel and Exim host that still receives mail for the group’s primary domain before redirecting it into Microsoft 365. The forwarding host applied a DKIM signature in the dealership’s own domain to a message it had accepted from a third party. Later relaying modified the message, causing that signature to fail at final delivery alongside \u003ccode\u003ecompauth=fail\u003c/code\u003e. The resulting headers appeared to attribute a DKIM failure to the recipient organization despite the organization not having sent the email.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that a DKIM failure for an organization’s own domain can be caused by its own forwarding infrastructure signing incoming mail, rather than by external spoofing. The message crossed a Sophos gateway multiple times and two Microsoft 365 tenants, where it received divergent spam scores, including \u003ccode\u003eSCL:9\u003c/code\u003e at one hop and \u003ccode\u003eSCL:-1\u003c/code\u003e at another. The article attributes those differences to each layer assessing the preceding relay’s identity and reputation rather than the message content. It recommends determining whether legacy MX hosts sign forwarded inbound mail and interpreting authentication and spam results across the complete mail path.\u003c/p\u003e\n\n\u003cp\u003eThe lure used a display name of Meta for Business, claimed in its body to be from \u003ccode\u003esupport@meta.com\u003c/code\u003e, and directed recipients to a Submit Appeal link hosted on a Cloudflare Workers subdomain that an independent scanner marked malicious. Its actual From domain was an abused education-sector Google Workspace account, while visible errors included an email address presented as the affected Facebook asset and a malformed business name. The kit used styled text and CSS-drawn graphics instead of external images, and the delivered link had been rewritten by the recipient gateway. The article presents this as an example of credential phishing passing authenticated transport checks while inconsistent relay-based judgments and self-inflicted DKIM failures obscure the message’s origin and risk.\u003c/p\u003e\n"},{"n":7,"title":"The Credential Layer Is Expanding Faster Than Security Teams Can See It","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/the-credential-layer-is-expanding.html","time":"11:55","priority":"MAY READ","score":55,"tldr":"GitGuardian argues that rapidly growing software development, AI-agent adoption, and credential sprawl across repositories, collaboration tools, and developer endpoints are outpacing traditional security visibility. Organizations need a continuous, contextual inventory of credentials—including validity, ownership, permissions, dependencies, and exposure locations—before they can effectively remediate or prevent abuse.","briefOverview":"\u003cp\u003eGitGuardian argues that the credential layer—the digital credentials connecting people, applications, infrastructure, services, and AI—is expanding faster than security teams can map it. It cites GitHub’s rising commit volume and says GitGuardian detected 28.65 million new hardcoded secrets in public GitHub commits in 2025, up 34% year over year. The article says credentials increasingly appear across source-code repositories, collaboration tools, developer laptops, personal projects, cloud services, and AI-agent configurations.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations need detection across repositories, public exposure, and developer endpoints before they can remediate or prevent credential risk. Each discovered credential should be enriched with information on whether it remains valid, where it has appeared, who owns it, what permissions it has, and which workloads depend on it. It warns that attackers can collect credentials across these boundaries, while AI agents and Model Context Protocol connections add further places where access must be established and understood.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitGuardian reported detecting 28.65 million new hardcoded secrets in public GitHub commits in 2025, a 34% year-over-year increase, while leaked credentials associated with AI services rose 81%.","The article states that internal repositories were about six times more likely than public repositories to contain at least one secret, and that about 28% of secret incidents began outside source-code repositories in collaboration and productivity systems.","GitGuardian’s analysis of 6,943 systems compromised in the Shai-Hulud 2 supply-chain campaign found 33,185 unique secrets, with 44% of affected machines holding more than 10 secrets.","The article says credentials can persist for years: GitGuardian retested credentials confirmed valid in 2022 and found that 64% remained valid in January 2026.","The article argues that organizations need discovery across repositories, public exposures, and developer endpoints, enriched with information about each credential’s validity, owner, permissions, and workload dependencies."],"insights":["A secrets vault can create a misleading sense of coverage because it measures only credentials already under management, while plaintext copies or entirely unmanaged credentials may remain in repositories, employee laptops, and collaboration tools.","Credential fingerprinting lets security teams treat repeated discoveries of the same secret as one credential with multiple exposures, which better shows how widely that credential has spread.","GitGuardian found 24,008 unique secrets in public Model Context Protocol configuration files during 2025, including 2,117 that could be verified as valid.","Knowing that a credential is exposed is not sufficient for safe remediation: teams also need to know its owner, permissions, and the workloads that depend on it before rotating or revoking it.","The article contrasts periodic discovery with attacker speed, citing CrowdStrike’s reported average 29-minute eCrime breakout time in 2025 and a fastest observed case of 27 seconds to lateral movement."],"referencedReports":[{"title":"State of Secrets Sprawl 2026","url":"https://www.gitguardian.com/state-of-secrets-sprawl-report-2026","publisher":"gitguardian","context":"The article cites this research for figures on hardcoded secrets in public GitHub commits, AI-service credential leaks, internal repository exposure, and collaboration-system incidents.","category":"research","primary":true},{"title":"2026 CrowdStrike Global Threat Report","url":"https://www.crowdstrike.com/en-us/press-releases/2026-crowdstrike-global-threat-report/","publisher":"crowdstrike","context":"The article cites the report’s eCrime breakout-time figures to illustrate the shrinking time available for defenders to respond.","category":"research","primary":false}],"body":"\u003cp\u003eGitGuardian argues that the credential layer—the digital credentials connecting people, applications, infrastructure, services, and AI—is expanding faster than security teams can map it. It cites GitHub’s rising commit volume and says GitGuardian detected 28.65 million new hardcoded secrets in public GitHub commits in 2025, up 34% year over year. The article says credentials increasingly appear across source-code repositories, collaboration tools, developer laptops, personal projects, cloud services, and AI-agent configurations.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations need detection across repositories, public exposure, and developer endpoints before they can remediate or prevent credential risk. Each discovered credential should be enriched with information on whether it remains valid, where it has appeared, who owns it, what permissions it has, and which workloads depend on it. It warns that attackers can collect credentials across these boundaries, while AI agents and Model Context Protocol connections add further places where access must be established and understood.\u003c/p\u003e\n"},{"n":1,"title":"OpenAI will show visual ads in ChatGPT while you generate images","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/openai-will-show-visual-ads-in-chatgpt-while-you-generate-images/","time":"10:28","priority":"MAY READ","score":48,"tldr":"OpenAI will begin testing clearly labeled visual ads alongside ChatGPT image generation in the United States later this month, while keeping them separate from generated images and model responses. The company is also expanding ad-conversion measurement and brand-suitability partnerships as it monetizes ChatGPT's user base.","briefOverview":"\u003cp\u003eOpenAI will begin testing visual advertisements during image generation in ChatGPT later this month in the United States with an initial group of advertisers. The company says the ads will be clearly labeled and will remain separate from the image being created. OpenAI also reiterated that ads will not influence ChatGPT’s answers.\u003c/p\u003e\n\n\u003cp\u003eThe ads may use images to present product inspiration, product use, or service experiences. OpenAI says ChatGPT reaches 1.2 billion people every week and describes advertising as another way to monetize users who do not pay for subscriptions. Alongside the visual-ad test, OpenAI is adding conversion measurement integrations with Hightouch, Tealium, and LiveRamp, as well as attribution partners including AppsFlyer, Adjust, Branch, Triple Whale, and Kochava.\u003c/p\u003e\n\n\u003cp\u003eOpenAI is also working with DoubleVerify and Integral Ad Science on brand suitability because ads appear around conversations rather than traditional webpages. The company says safeguards are designed to prevent ads from appearing in emotionally vulnerable, sensitive, or otherwise unsuitable conversations. It also says independent partners will not receive access to private user conversations while assessing whether the safeguards work as intended.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI will begin testing clearly labeled visual advertisements during ChatGPT image generation later this month with an initial group of advertisers in the United States.","OpenAI says the advertisements will remain separate from the image being created and will not influence ChatGPT’s answers.","The company says ChatGPT reaches 1.2 billion people every week and is using advertising as another monetization option for people who do not pay for a subscription.","OpenAI is integrating with Hightouch, Tealium, and LiveRamp for conversion data and adding attribution partners including AppsFlyer, Adjust, Branch, Triple Whale, and Kochava.","OpenAI says its safeguards are designed to prevent ads from appearing in sensitive or emotionally vulnerable conversations, and that independent partners will not access private user conversations while evaluating those safeguards."],"insights":["OpenAI is pairing the new visual ad format with conversion and attribution integrations, indicating that advertisers will be able to assess whether ChatGPT ads lead to purchases or other actions rather than only measuring whether users saw them.","Because ads will appear around conversations rather than on traditional webpages, OpenAI is using brand-suitability partners and safeguards intended to keep advertising out of emotionally vulnerable or sensitive discussions.","OpenAI says outside partners evaluating ad-safety safeguards will not receive access to private user conversations, addressing a privacy boundary while those safeguards are assessed.","The initial test is limited to the United States, but OpenAI presents advertising as a broader way to monetize users who do not subscribe to ChatGPT."],"referencedReports":[],"body":"\u003cp\u003eOpenAI will begin testing visual advertisements during image generation in ChatGPT later this month in the United States with an initial group of advertisers. The company says the ads will be clearly labeled and will remain separate from the image being created. OpenAI also reiterated that ads will not influence ChatGPT’s answers.\u003c/p\u003e\n\n\u003cp\u003eThe ads may use images to present product inspiration, product use, or service experiences. OpenAI says ChatGPT reaches 1.2 billion people every week and describes advertising as another way to monetize users who do not pay for subscriptions. Alongside the visual-ad test, OpenAI is adding conversion measurement integrations with Hightouch, Tealium, and LiveRamp, as well as attribution partners including AppsFlyer, Adjust, Branch, Triple Whale, and Kochava.\u003c/p\u003e\n\n\u003cp\u003eOpenAI is also working with DoubleVerify and Integral Ad Science on brand suitability because ads appear around conversations rather than traditional webpages. The company says safeguards are designed to prevent ads from appearing in emotionally vulnerable, sensitive, or otherwise unsuitable conversations. It also says independent partners will not receive access to private user conversations while assessing whether the safeguards work as intended.\u003c/p\u003e\n"},{"n":10,"title":"5th October – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/5th-october-threat-intelligence-report/","time":"13:57","priority":"MAY READ","score":40,"tldr":"Check Point’s weekly threat intelligence roundup highlights major breaches, AI-enabled attack activity, actively exploited enterprise vulnerabilities, and espionage/ransomware campaigns affecting organizations worldwide.","briefOverview":"\u003cp\u003eCheck Point’s weekly threat intelligence report for 5 October covers data breaches, ransomware, AI-related threats, vulnerabilities, and espionage campaigns. Arizona’s state court system suffered a phishing-led incident that exposed protective-order records and more than 150,000 Foster Care Review Board reports. Times Car disclosed a breach affecting about 6.6 million accounts, while Fakturownia reported copied customer, company, banking, authentication, and invoice data.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights critical issues in Citrix NetScaler, Cisco Catalyst SD-WAN Manager, Apple CoreGraphics, and GitLab AI Gateway. Cisco said CVE-2026-76504 was actively exploited and had no available fixes, while Apple reported highly targeted exploitation of its CoreGraphics flaw. Researchers also described malicious ChatGPT Custom GPTs used to deliver remote-access malware, AI-enabled destructive activity in Azure environments, Warlock ransomware exploiting SharePoint ToolShell flaws, and phishing campaigns by China- and Russia-linked groups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arizona’s state court system suffered a phishing-led cyberattack that exposed backup files containing protective-order records and more than 150,000 Foster Care Review Board reports.","Times Car disclosed a breach affecting about 6.6 million current and former accounts, including driver’s-license images for roughly 1.6 million accounts.","Cisco reported active exploitation of CVE-2026-76504, a critical Catalyst SD-WAN Manager flaw that can allow an unauthenticated remote attacker to gain administrator access, with no fixes available.","Researchers documented Warlock ransomware attacks exploiting SharePoint ToolShell vulnerabilities against utilities, telecom, government, and education organizations.","Researchers reported that China-aligned TA419 impersonated economists and AI policymakers to target US AI policy experts with phishing pages intended to steal Microsoft 365 credentials and session cookies."],"insights":["The reported Citrix, Cisco, Apple, and GitLab issues span network infrastructure, cloud administration, image processing, and AI services, showing that serious exposure is not limited to one type of technology.","AI-related activity in the report includes both attackers using AI-enabled automation after gaining cloud access and malicious ChatGPT Custom GPTs being used to lead victims toward remote-access malware.","Several campaigns relied on trusted or familiar services and identities, including Microsoft 365 for Antino command-and-control activity, impersonated policy experts in TA419 phishing, and ChatGPT-hosted Custom GPTs in the ClickFix campaign.","The Cisco Catalyst SD-WAN Manager issue is particularly urgent because Cisco reported active exploitation while stating that no fixes were available.","The Arizona, Times Car, and Fakturownia incidents demonstrate that exposed data can include sensitive case records, identity documents, password hashes, bank details, and authentication tokens rather than only basic contact information."],"referencedReports":[{"title":"ChatGPT Custom GPTs Used in ClickFix Campaign to Deliver Remote Access Malware","url":"https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat","publisher":"huntress","context":"Huntress researchers demonstrated that malicious ChatGPT Custom GPTs were used in a ClickFix campaign that led victims to run commands and install remote-access malware.","category":"research","primary":false},{"title":"China-Nexus UAT-11587 Targets Government and Policy Organizations Across Asia With Antino Backdoor","url":"https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/","publisher":"cisco-talos","context":"The article cites research on UAT-11587 using spear-phishing and decoy documents to deploy the Antino backdoor against Asian government and policy organizations.","category":"research","primary":false},{"title":"Hallucinating Credibility: China-Aligned TA419 Impersonates Its Way Into US AI Policy","url":"https://www.proofpoint.com/us/blog/threat-insight/hallucinating-credibility-china-aligned-ta419-impersonates-its-way-us-ai-policy","publisher":"proofpoint","context":"The article references Proofpoint research on TA419 impersonating economists and AI policymakers to steal Microsoft 365 credentials and session cookies from US AI policy experts.","category":"research","primary":false},{"title":"Star Blizzard Scales Phishing Operations","url":"https://fieldeffect.com/blog/star-blizzard-scales-phishing-operations","publisher":"fieldeffect","context":"The article cites research mapping Star Blizzard phishing campaigns and its RedFlick technique for deploying the CosmicPulse backdoor.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point’s weekly threat intelligence report for 5 October covers data breaches, ransomware, AI-related threats, vulnerabilities, and espionage campaigns. Arizona’s state court system suffered a phishing-led incident that exposed protective-order records and more than 150,000 Foster Care Review Board reports. Times Car disclosed a breach affecting about 6.6 million accounts, while Fakturownia reported copied customer, company, banking, authentication, and invoice data.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights critical issues in Citrix NetScaler, Cisco Catalyst SD-WAN Manager, Apple CoreGraphics, and GitLab AI Gateway. Cisco said CVE-2026-76504 was actively exploited and had no available fixes, while Apple reported highly targeted exploitation of its CoreGraphics flaw. Researchers also described malicious ChatGPT Custom GPTs used to deliver remote-access malware, AI-enabled destructive activity in Azure environments, Warlock ransomware exploiting SharePoint ToolShell flaws, and phishing campaigns by China- and Russia-linked groups.\u003c/p\u003e\n"},{"n":3,"title":"tenfold CE: Our free Identity Governance tool just got 2 new features","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/tenfold-ce-our-free-identity-governance-tool-just-got-2-new-features/","time":"13:33","priority":"MAY READ","score":25,"tldr":"Sponsored content: tenfold’s free Community Edition for organizations with fewer than 150 managed users now adds Microsoft 365 shared-content access reviews and centralized event auditing, while retaining the platform’s full IGA feature set.","briefOverview":"\u003cp\u003etenfold announced two additions to its free Community Edition: governance for shared Microsoft 365 content and centralized event auditing. The edition is available to organizations with fewer than 150 managed users, including administrator and service accounts. According to the article, it includes all features and integrations from tenfold’s highest licensing tier, with the user cap as the stated limit.\u003c/p\u003e\n\n\u003cp\u003eThe shared-content feature provides an overview of files shared through Teams, OneDrive, and SharePoint, including content in sites, channels, chats, and users’ OneDrives. It also supports recurring access reviews, sending owners a personalized checklist so they can confirm or revoke previous sharing permissions. The event-auditing feature ingests and analyzes selected event logs, enables filtering by user, system, or event type, and supports saved and shared queries. tenfold states that these capabilities can help organizations identify events such as login spikes and newly created administrator accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["tenfold offers a free Community Edition of its Identity Governance and Administration platform for organizations with fewer than 150 managed users, including administrator and service accounts.","The Community Edition includes the same features and integrations as tenfold’s highest licensing tier, with the managed-user cap as its stated usage limit.","A new shared-content governance feature provides visibility into files shared through Microsoft Teams, OneDrive, and SharePoint and supports recurring reviews of who can access them.","A new event-auditing feature can ingest and analyze event logs, filter records by user, system, or event type, and help identify activity such as login spikes or newly created administrator accounts.","The article states that Community Edition users receive updates and new features at the same time as paid-tier users."],"insights":["The Community Edition’s 150-user limit counts administrator and service accounts, so organizations need to include non-employee accounts when determining eligibility.","Shared-access reviews are directed to the owners of files, channels, or sites through personalized dashboards, allowing those owners to confirm or revoke prior sharing permissions.","The event-auditing feature combines governance functions with searchable, real-time event records and supports saving and sharing queries for repeated investigations.","The free edition is stated to receive new features and updates at the same time as tenfold’s paid tiers, rather than on a delayed release schedule."],"referencedReports":[],"body":"\u003cp\u003etenfold announced two additions to its free Community Edition: governance for shared Microsoft 365 content and centralized event auditing. The edition is available to organizations with fewer than 150 managed users, including administrator and service accounts. According to the article, it includes all features and integrations from tenfold’s highest licensing tier, with the user cap as the stated limit.\u003c/p\u003e\n\n\u003cp\u003eThe shared-content feature provides an overview of files shared through Teams, OneDrive, and SharePoint, including content in sites, channels, chats, and users’ OneDrives. It also supports recurring access reviews, sending owners a personalized checklist so they can confirm or revoke previous sharing permissions. The event-auditing feature ingests and analyzes selected event logs, enables filtering by user, system, or event type, and supports saved and shared queries. tenfold states that these capabilities can help organizations identify events such as login spikes and newly created administrator accounts.\u003c/p\u003e\n"}]</script>
