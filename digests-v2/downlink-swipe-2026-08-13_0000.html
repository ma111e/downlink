l helped SocGholish regain access to traffic from tens of thousands of compromised sites shortly after Operation Endgame disrupted SocGholish infrastructure in June 2026. The article concludes that dropcatch domains pose significant risk, arguably greater than newly registered domains, because they can inherit established traffic and reputation from prior activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox describes a class of dropcatch actors that acquire expired malicious domains still embedded in compromised websites and use the inherited traffic for scams, advertising fraud, or malware delivery.","Stuffy Squirrel has been active since at least 2020, hides malicious activity inside legitimate-looking scripts, and monetizes traffic through affiliate advertising platforms including ExoClick, PushHouse, and a Russian popunder network.","Shady Squirrel has operated since at least July 2023 and has sent traffic to 1Win, a tech support scam actor, SocGholish, and Keitaro-based redirection chains.","Infoblox reports that Shady Squirrel helped SocGholish regain access to traffic from tens of thousands of compromised sites shortly after Operation Endgame disrupted SocGholish infrastructure in June 2026.","Swiping Squirrel has acquired more than 3,000 domains since 2022 and sells fraudulently obtained traffic mainly through Team Internet’s ZeroPark, where visitors may be sent to malware, scams, or shopping pages."],"insights":["Expired malicious domains can remain valuable because compromised websites continue sending visitor requests to them even after the original attacker-controlled domain has expired.","Stuffy Squirrel’s delivery chain can evade automated analysis at multiple independent points, including serving a legitimate Raphaël.js decoy, filtering later server-side requests, and only opening popunders after a real user click.","Shady Squirrel’s malicious behavior is difficult to observe in public scanning tools because it requires specific referral conditions and additional cloaking checks before victims are redirected.","The article reports that Shady Squirrel’s shift from a tech support scam actor to SocGholish occurred shortly after the tech support operation went silent, showing how the same inherited traffic source can be redirected to different criminal customers over time.","Swiping Squirrel’s activity shows that traffic sold through advertising brokers can still expose users to malware or scams even when the dropcatch actor is not directly hosting the final malicious content."],"referencedReports":[{"title":"Massive Campaign Uses Hacked WordPress Sites as Platform for Black Hat Ad Network","url":"https://blog.sucuri.net/2023/01/massive-campaign-uses-hacked-wordpress-sites-as-platform-for-black-hat-ad-network.html","publisher":"Sucuri","context":"The article cites this Sucuri research when describing weatherplllatform[.]com as previously used in Balada injector infrastructure that infected thousands of WordPress sites.","category":"research","primary":false},{"title":"Balada Injector: Synopsis of a Massive Ongoing WordPress Malware Campaign","url":"https://blog.sucuri.net/2023/04/balada-injector-synopsis-of-a-massive-ongoing-wordpress-malware-campaign.html","publisher":"Sucuri","context":"The article references this Sucuri analysis to support the description of weatherplllatform[.]com as one of Sucuri’s most-blocklisted Balada-related resources in 2022.","category":"research","primary":false},{"title":"Update: JavaScript Skimmer Enhancements","url":"https://www.zscaler.com/blogs/security-research/update-javascript-skimmer-enhancements","publisher":"Zscaler","context":"The article cites this Zscaler security research when noting that magesource[.]su was previously used as a Magecart card-skimming domain against compromised Magento stores.","category":"research","primary":false},{"title":"Help TDS: Malicious Plugins Redirect Tech Support Scams","url":"https://www.godaddy.com/resources/news/help-tds-malicious-plugins-redirect-tech-support-scams","publisher":"GoDaddy","context":"The article references GoDaddy’s Help TDS analysis while describing a newly surfaced attack chain that redirected through Help TDS.","category":"research","primary":false},{"title":"Inside Master134: Ad networks’ blind eye threatens enterprises","url":"https://www.techtarget.com/searchsecurity/feature/Inside-Master134-Ad-networks-blind-eye-threatens-enterprises","publisher":"TechTarget SearchSecurity","context":"The article cites this report when discussing AdventureFeeds’ reported connections with the malvertiser master134.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox describes a class of “dropcatch” threat actors that acquire expired malicious domains previously used in website compromise campaigns. Because those domains remain embedded in many compromised websites, visitor requests continue even after the original operators abandon them. The new owners can inherit that traffic without compromising websites themselves and redirect users to scams, unwanted content, affiliate advertising, or malware.\u003c/p\u003e\n\n\u003cp\u003eThe article profiles three actors: Stuffy Squirrel, Shady Squirrel, and Swiping Squirrel. Stuffy Squirrel hides malicious activity inside legitimate-looking scripts and monetizes traffic through affiliate advertising platforms such as ExoClick, PushHouse, and a Russian popunder network. Shady Squirrel uses referral checks, cloaking, custom injections, and Keitaro-based redirection chains, and in 2026 sent traffic to 1Win, a tech support scam actor, SocGholish, and Keitaro infrastructure. Swiping Squirrel has acquired more than 3,000 domains since 2022 and sells traffic mainly through Team Internet’s ZeroPark, where visitors may land on malware, scams, or shopping pages.\u003c/p\u003e\n\n\u003cp\u003eThe real-world impact is that tens of thousands of compromised websites can continue exposing visitors to harm long after the original malicious domains expire. Infoblox reports that Shady Squirrel helped SocGholish regain access to traffic from tens of thousands of compromised sites shortly after Operation Endgame disrupted SocGholish infrastructure in June 2026. The article concludes that dropcatch domains pose significant risk, arguably greater than newly registered domains, because they can inherit established traffic and reputation from prior activity.\u003c/p\u003e\n"},{"n":28,"title":"Dissecting the JWR phishing framework","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/dissecting-the-jwr-phishing-framework/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Cisco Talos analyzed JWR, a sophisticated real-time phishing framework likely related to The Outsider PhaaS, that lets operators live-control victim sessions and steal payment data, credentials, identity documents, 2FA codes, and device fingerprints. Talos observed it being delivered through SMS lures impersonating toll, postal, and courier services across Southeast Asia and the Middle East.","briefOverview":"\u003cp\u003eCisco Talos identified an undocumented phishing framework internally branded “JWR” that impersonates checkout and login pages across major payment and shopping platforms. The framework can harvest complete payment card data, login credentials, personally identifiable information, identity document images, 2FA codes, and device fingerprints in real time. Talos assesses with medium confidence that JWR is a variant of “The Outsider,” a phishing-as-a-service platform, based on similarities in client engine scripts and functionality.\u003c/p\u003e\n\n\u003cp\u003eThe JWR client engine uses a real-time, operator-driven design rather than simply collecting submitted form data. It keeps an AES-CTR encrypted WebSocket open to the actor’s command-and-control server, allowing the operator to steer the victim’s session live, redirect them between phishing pages, display fake errors, and request additional information such as OTPs, PINs, or app approvals. The Vue.js victim application renders across 44 phishing pages, streams keystrokes as they are typed, and supports more than 40 actor-issued instructions.\u003c/p\u003e\n\n\u003cp\u003eTalos observed an active SMS phishing campaign delivering the JWR client through lures impersonating toll authorities, postal services, and courier services in Southeast Asia and the Middle East. The malicious URLs led victims to fake pages that loaded the JWR client and enabled host mode. The article also notes JWR integrations for Shopify and WooCommerce, which can reconstruct realistic shopping cart details to make fake checkout pages more convincing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos identified an undocumented phishing framework internally branded “JWR” that impersonates checkout and login pages for major payment and shopping platforms.","The JWR client engine keeps an AES-CTR encrypted WebSocket open to the threat actor, allowing the operator to steer each victim’s session live instead of only collecting submitted form data.","JWR targets payment data, identity documents, Social Security numbers, passport and driver’s license images, website and PayPal credentials, 2FA codes, and device fingerprints.","Talos assesses with medium confidence that JWR is a variant of “The Outsider” phishing-as-a-service platform based on similarities in client engine scripts and functionality.","Talos observed a real-world SMS phishing campaign delivering the JWR client through lures impersonating toll authorities, postal services, and courier services in Southeast Asia and the Middle East."],"insights":["JWR streams victim keystrokes to the operator as they are typed, allowing the actor to decide the next fake verification step before the victim submits the form.","The framework can repeatedly show fake failure prompts such as declined-card or invalid-code messages, enabling the operator to pressure one victim into entering multiple cards or verification codes in a single session.","JWR includes an HTTP long-poll fallback endpoint for environments where WebSocket connections are blocked, preserving live operator control under more restrictive network conditions.","The client stores and reuses a JWRCID session token across visits, allowing the operator to correlate repeat visits from the same device.","JWR’s Shopify and WooCommerce integrations reconstruct realistic cart details such as product names, quantities, prices, and totals, making the fake checkout flow more convincing."],"referencedReports":[{"title":"The Outsider Part 1: Pulling One Thread on a $1.9 Billion Phishing Machine","url":"https://tapetumlabs.com/the-outsider-part-1-pulling-one-thread-on-a-1-9-billion-phishing-machine/","publisher":"Tapetum Labs","context":"The article cites this external research as reporting on The Outsider PhaaS platform operated by the Chinese-speaking actor Outsider Enterprise, which Talos compares to JWR.","category":"research","primary":true},{"title":"The Outsider Part 2: Putting a Price on a Phishing Machine","url":"https://tapetumlabs.com/the-outsider-part-2-putting-a-price-on-a-phishing-machine/","publisher":"Tapetum Labs","context":"The article cites this external research for information that The Outsider PhaaS was sold as a self-servicing product through the actor’s Telegram channels.","category":"research","primary":false}],"body":"\u003cp\u003eCisco Talos identified an undocumented phishing framework internally branded “JWR” that impersonates checkout and login pages across major payment and shopping platforms. The framework can harvest complete payment card data, login credentials, personally identifiable information, identity document images, 2FA codes, and device fingerprints in real time. Talos assesses with medium confidence that JWR is a variant of “The Outsider,” a phishing-as-a-service platform, based on similarities in client engine scripts and functionality.\u003c/p\u003e\n\n\u003cp\u003eThe JWR client engine uses a real-time, operator-driven design rather than simply collecting submitted form data. It keeps an AES-CTR encrypted WebSocket open to the actor’s command-and-control server, allowing the operator to steer the victim’s session live, redirect them between phishing pages, display fake errors, and request additional information such as OTPs, PINs, or app approvals. The Vue.js victim application renders across 44 phishing pages, streams keystrokes as they are typed, and supports more than 40 actor-issued instructions.\u003c/p\u003e\n\n\u003cp\u003eTalos observed an active SMS phishing campaign delivering the JWR client through lures impersonating toll authorities, postal services, and courier services in Southeast Asia and the Middle East. The malicious URLs led victims to fake pages that loaded the JWR client and enabled host mode. The article also notes JWR integrations for Shopify and WooCommerce, which can reconstruct realistic shopping cart details to make fake checkout pages more convincing.\u003c/p\u003e\n"},{"n":8,"title":"Akira hackers disable EDR with Safe Mode, steal data but fail to encrypt","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/akira-hackers-disable-edr-with-safe-mode-steal-data-but-fail-to-encrypt/","time":"20:47","priority":"SHOULD READ","score":86,"tldr":"An Akira ransomware affiliate used access through an unprotected SonicWall VPN to reboot a victim system into Safe Mode with Networking, disable EDR and Microsoft Defender protections, and steal data. The attempted file encryption failed due to system errors, but the attack still shows how Safe Mode abuse can blind defenses long enough for extortion-focused ransomware operations.","briefOverview":"\u003cp\u003eAn Akira ransomware affiliate disabled endpoint detection and response on a compromised system by restarting the machine into Safe Mode with Networking. The attack began on August 4 after the attacker gained access through an exposed SonicWall VPN device that did not have multi-factor authentication. Huntress said the attacker reached the domain controller through RDP, enumerated Active Directory users and computers, then moved to an application server.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used WinRAR to archive mapped file shares and s5cmd to upload stolen data to an attacker-controlled S3 bucket before installing AnyDesk for remote access. They then used AnyDesk to reboot the host into Safe Mode with Networking, where the Huntress agent and Microsoft Defender real-time protection were disabled. Huntress said that for 10 minutes in Safe Mode, the host had no working EDR and antivirus was blinded.\u003c/p\u003e\n\n\u003cp\u003eThe attempt to run the Akira ransomware payload in Safe Mode failed because the system reported low virtual memory and generated out-of-memory and PowerShell errors. Microsoft Defender later detected the Akira executable during a scheduled scan, but it only quarantined the file after the attacker rebooted the system into normal mode. Although encryption failed, the attacker still stole credentials and files for data extortion in less than five hours from initial access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An Akira ransomware affiliate gained initial access through an exposed SonicWall VPN device that did not have multi-factor authentication enabled.","After logging in, the attacker used RDP to connect to the domain controller, enumerated Active Directory users and computers, moved to an application server, archived mapped file shares with WinRAR, and uploaded stolen data to an attacker-controlled S3 bucket using s5cmd.","The attacker installed AnyDesk, forced the compromised host to boot into Safe Mode with Networking, and disabled both the Huntress agent and Microsoft Defender’s real-time protection.","The attempt to launch the Akira ransomware payload in Safe Mode failed because the system reported low virtual memory and generated out-of-memory and PowerShell errors.","Microsoft Defender detected the Akira executable during a scheduled scan and quarantined it only after the attacker rebooted the system into normal mode, which restored real-time protection."],"insights":["Safe Mode can create a temporary blind spot for defenses because Windows starts with only a limited set of drivers and services, leaving the host without working EDR and with antivirus real-time protection disabled in this incident.","Adding AnyDesk to the Windows Safe Mode registry allowed the attacker to preserve remote access even after forcing the machine into Safe Mode with Networking.","Even though Microsoft Defender’s real-time protection was disabled in Safe Mode, a scheduled Defender scan still detected the Akira executable, but removal did not occur until the system returned to normal mode.","The attacker completed initial access, discovery, data theft, defense disabling, and a failed encryption attempt in less than five hours, showing how quickly data extortion can occur even when ransomware deployment fails.","Huntress had seen Safe Mode abuse from ransomware families such as Snatch and AvosLocker before, but this was the first time it observed the tactic in an Akira attack."],"referencedReports":[{"title":"Akira Hits Safe Mode: Ransomware Rebooting Around EDR","url":"https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr","publisher":"Huntress","context":"The article cites Huntress’s analysis describing how the Akira affiliate used Safe Mode with Networking to disable defenses during the intrusion.","category":"research","primary":true}],"body":"\u003cp\u003eAn Akira ransomware affiliate disabled endpoint detection and response on a compromised system by restarting the machine into Safe Mode with Networking. The attack began on August 4 after the attacker gained access through an exposed SonicWall VPN device that did not have multi-factor authentication. Huntress said the attacker reached the domain controller through RDP, enumerated Active Directory users and computers, then moved to an application server.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used WinRAR to archive mapped file shares and s5cmd to upload stolen data to an attacker-controlled S3 bucket before installing AnyDesk for remote access. They then used AnyDesk to reboot the host into Safe Mode with Networking, where the Huntress agent and Microsoft Defender real-time protection were disabled. Huntress said that for 10 minutes in Safe Mode, the host had no working EDR and antivirus was blinded.\u003c/p\u003e\n\n\u003cp\u003eThe attempt to run the Akira ransomware payload in Safe Mode failed because the system reported low virtual memory and generated out-of-memory and PowerShell errors. Microsoft Defender later detected the Akira executable during a scheduled scan, but it only quarantined the file after the attacker rebooted the system into normal mode. Although encryption failed, the attacker still stole credentials and files for data extortion in less than five hours from initial access.\u003c/p\u003e\n"},{"n":29,"title":"Emerging Threat: (CVE-2026-26035) FortiWeb Admin Authentication Bypass via RADIUS Admin Groups","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/2817-2/","time":"10:31","priority":"SHOULD READ","score":85,"tldr":"Fortinet disclosed CVE-2026-26035, a high-impact FortiWeb authentication bypass that can let unauthenticated attackers gain admin access when RADIUS admin groups are configured. Organizations should urgently identify FortiWeb appliances using RADIUS admin authentication, restrict management access, audit for suspicious admin activity, and confirm patched versions with Fortinet.","briefOverview":"\u003cp\u003eFortinet disclosed CVE-2026-26035 on August 12, 2026 in advisory FG-IR-26-158, describing it as a broken access control issue in the RADIUS type admin group. The article says the flaw is an improper authentication vulnerability in FortiWeb’s remote RADIUS administrator authentication path. Public reporting describes exploitation as pre-authentication, allowing a remote attacker with no valid credentials to log in to the FortiWeb GUI and CLI using arbitrary usernames and passwords.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because successful exploitation gives an attacker administrative access to a web application firewall. The article says that position could allow policy changes, certificate and key access, log manipulation, and visibility into inspected traffic. Fortinet rates the issue High, while third-party trackers report a CVSS v3.1 score of 9.8, with the article noting that defenders should judge risk based on whether their appliances use the affected configuration.\u003c/p\u003e\n\n\u003cp\u003eFortinet lists FortiWeb 8.0, 7.6, 7.4, 7.2, and 7.0 branches as affected, but the article stresses that risk is narrower than the version list because it depends on use of remote RADIUS administrator authentication through an admin group. No public proof of concept has been reported, and Fortinet has not reported exploitation in the wild at the time of writing. Until fixed versions are confirmed, the article recommends inventorying FortiWeb appliances, identifying those using RADIUS admin authentication, restricting management access, disabling RADIUS-based admin groups where local accounts are sufficient, and auditing administrator activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-26035 is an improper authentication vulnerability in Fortinet FortiWeb’s remote RADIUS administrator authentication path, disclosed by Fortinet on August 12, 2026 in advisory FG-IR-26-158.","Public reporting states that a remote attacker with no valid credentials can log in to the FortiWeb GUI and CLI using arbitrary usernames and passwords and obtain administrative access to the appliance.","Fortinet lists FortiWeb 8.0, 7.6, 7.4, 7.2, and 7.0 branches as affected, but the deployments at risk are those configured to authenticate administrators against a RADIUS server through an admin group.","The article says no public proof of concept has been reported and Fortinet has not reported exploitation in the wild at the time of writing.","Until patching is confirmed, defenders are advised to inventory FortiWeb appliances, identify those using remote RADIUS admin authentication, restrict management interface access, disable RADIUS-based admin groups where local accounts are sufficient, and audit administrator activity."],"insights":["The article emphasizes that the real priority should be determined by whether each FortiWeb appliance uses RADIUS-backed administrator groups, not by the broad list of affected software versions or the highest published severity score.","Patch status is ambiguous enough that the article advises defenders to confirm fixed builds directly with Fortinet instead of assuming that versions beyond third-party affected ranges are safe.","CyCognito’s exposure data identifies FortiWeb assets through service fingerprinting but does not confirm software version or administrator authentication configuration, so the observed assets are potentially affected rather than confirmed vulnerable.","The article highlights a security paradox: FortiWeb appliances are deployed to protect edge web applications, but if their own management login path is exposed and vulnerable, that protective position can become a high-value entry point."],"referencedReports":[],"body":"\u003cp\u003eFortinet disclosed CVE-2026-26035 on August 12, 2026 in advisory FG-IR-26-158, describing it as a broken access control issue in the RADIUS type admin group. The article says the flaw is an improper authentication vulnerability in FortiWeb’s remote RADIUS administrator authentication path. Public reporting describes exploitation as pre-authentication, allowing a remote attacker with no valid credentials to log in to the FortiWeb GUI and CLI using arbitrary usernames and passwords.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because successful exploitation gives an attacker administrative access to a web application firewall. The article says that position could allow policy changes, certificate and key access, log manipulation, and visibility into inspected traffic. Fortinet rates the issue High, while third-party trackers report a CVSS v3.1 score of 9.8, with the article noting that defenders should judge risk based on whether their appliances use the affected configuration.\u003c/p\u003e\n\n\u003cp\u003eFortinet lists FortiWeb 8.0, 7.6, 7.4, 7.2, and 7.0 branches as affected, but the article stresses that risk is narrower than the version list because it depends on use of remote RADIUS administrator authentication through an admin group. No public proof of concept has been reported, and Fortinet has not reported exploitation in the wild at the time of writing. Until fixed versions are confirmed, the article recommends inventorying FortiWeb appliances, identifying those using RADIUS admin authentication, restricting management access, disabling RADIUS-based admin groups where local accounts are sufficient, and auditing administrator activity.\u003c/p\u003e\n"},{"n":17,"title":"Trump taps cyber firms to go on offensive against criminals","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/trump-cyber-crime-offensive","time":"13:30","priority":"SHOULD READ","score":84,"tldr":"The Trump administration will let vetted U.S. cybersecurity companies conduct government-approved offensive cyber operations against transnational cybercriminal groups under DOJ and DHS oversight. The plan aims to disrupt scams and ransomware but raises legal and diplomatic concerns, including liability, misidentification, and risks to participating employees abroad.","briefOverview":"\u003cp\u003eThe Trump administration released a presidential memorandum allowing vetted U.S. private companies to conduct offensive cyber operations against transnational cybercrime organizations. These firms would work under the direction and oversight of the Justice and Homeland Security departments, with each operation requiring written approval before action is taken. The memorandum says operations will not be approved if they would cause loss of life or rise to the level of use of force or armed attack under international law.\u003c/p\u003e\n\n\u003cp\u003eThe effort is intended to use private-sector capabilities to combat cybercrime, fraud, scams, ransomware attacks, and other schemes targeting Americans. A White House fact sheet said American consumers reported $20.8 billion in cyber-related losses last year. The memorandum builds on a March executive order that directed federal agencies to take a stronger stance against cybercrime.\u003c/p\u003e\n\n\u003cp\u003eParticipating companies must sign contracts with DOJ or DHS, undergo rigorous vetting, disclose contractual relationships, report activities routinely, and face penalties of at least $1 million for violations. Federal agencies have two months to create operating procedures, minimum standards, and a framework for identifying targets. The article notes concerns from cybersecurity experts about legal protections, risks to employees abroad, and procedures for mistakes or misidentified targets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Trump administration released a presidential memorandum allowing vetted U.S. private companies to conduct offensive cyber operations against transnational cybercrime organizations under DOJ and DHS direction and oversight.","Each cyber operation must be approved in advance in writing by DOJ and DHS officials, and the memorandum says operations will not be sanctioned if they could cause loss of life or rise to the level of use of force or armed attack under international law.","The White House said the effort aims to use private-sector capabilities to combat cybercrime, fraud, scams, ransomware, and other schemes that caused American consumers to report $20.8 billion in cyber-related losses last year.","Participating companies must sign contracts with DOJ or DHS, undergo rigorous vetting, disclose contractual relationships, report activities routinely, and face penalties of at least $1 million for violations.","Several cybersecurity experts raised concerns about missing legal protections, risks to employees from foreign governments, and protocols for mistakes or misidentified targets."],"insights":["The memorandum leaves unresolved how private offensive operations should handle cybercrime groups that may be linked to foreign governments, even though the article cites examples involving Chinese-linked scam centers and government or military officials in Cambodia and Myanmar.","The program is not immediately operational because DOJ, DHS, and other agencies still have two months to create operating procedures, minimum participation standards, and a target-identification framework.","The memorandum explicitly anticipates accidental targeting of U.S. persons or U.S.-controlled systems and requires companies to stop the operation, minimize the impact, and notify federal authorities if that happens.","Participating companies may receive threat information from the federal government, which could materially change what private firms are able to do in operations against cybercrime groups.","The required $1 million minimum penalty for violations shows the administration plans to enforce compliance through contract terms rather than relying only on general oversight language."],"referencedReports":[],"body":"\u003cp\u003eThe Trump administration released a presidential memorandum allowing vetted U.S. private companies to conduct offensive cyber operations against transnational cybercrime organizations. These firms would work under the direction and oversight of the Justice and Homeland Security departments, with each operation requiring written approval before action is taken. The memorandum says operations will not be approved if they would cause loss of life or rise to the level of use of force or armed attack under international law.\u003c/p\u003e\n\n\u003cp\u003eThe effort is intended to use private-sector capabilities to combat cybercrime, fraud, scams, ransomware attacks, and other schemes targeting Americans. A White House fact sheet said American consumers reported $20.8 billion in cyber-related losses last year. The memorandum builds on a March executive order that directed federal agencies to take a stronger stance against cybercrime.\u003c/p\u003e\n\n\u003cp\u003eParticipating companies must sign contracts with DOJ or DHS, undergo rigorous vetting, disclose contractual relationships, report activities routinely, and face penalties of at least $1 million for violations. Federal agencies have two months to create operating procedures, minimum standards, and a framework for identifying targets. The article notes concerns from cybersecurity experts about legal protections, risks to employees abroad, and procedures for mistakes or misidentified targets.\u003c/p\u003e\n"},{"n":4,"title":"White House taps security firms for offensive hack-back operations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/white-house-taps-security-firms-for-offensive-hack-back-operations/","time":"13:30","priority":"SHOULD READ","score":82,"tldr":"A new White House memo directs the National Coordination Center to create a program allowing vetted private security firms to conduct government-approved offensive cyber operations against foreign cybercrime groups. The program marks a major expansion of private-sector involvement in U.S. hack-back efforts, with legal compliance rules, oversight, and financial penalties for violations.","briefOverview":"\u003cp\u003eA new White House national security presidential memorandum signed by U.S. President Donald Trump directs the National Coordination Center to establish a program for private security companies to seek approval to hack foreign cybercrime organizations. The NCC, which is part of the Homeland Security Task Force, would use private-sector capabilities to conduct cyber operations against transnational criminal organizations under U.S. government control and authority. The White House said the program is aimed at groups involved in ransomware attacks, phishing campaigns, financial fraud, sextortion schemes, and impersonation scams.\u003c/p\u003e\n\n\u003cp\u003eThe memorandum calls for rigorous procedures for reviewing and conducting these limited cyber operations, with requirements for compliance with the U.S. Constitution, federal law, and applicable international agreements. The program will be overseen by executive directors designated by the Justice Department and the Department of Homeland Security, and participating companies will be vetted before entering into contracts with one of those departments. Companies must also maintain a bond or escrow of at least $1 million that can be forfeited if they fail to comply with contractual agreements.\u003c/p\u003e\n\n\u003cp\u003eParticipating firms must immediately stop operations and notify the National Coordination Center if they discover activity that exceeds approved limits, including unintended targeting of U.S. citizens or U.S.-based systems. The White House said U.S. consumers reported losing more than $20.8 billion to cyber-enabled crime in 2025. Veracode co-founder Chris Wysopal described the memo as a major shift in U.S. cyber policy, while former Cyber National Mission Force leader and Automox CTO Jason Kikta called it “a perpetual motion machine for billable threats.”\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new White House national security presidential memorandum signed by President Donald Trump directs the National Coordination Center to establish a program allowing private security companies to seek approval to hack foreign cybercrime organizations.","The program will let the National Coordination Center leverage private-sector capabilities to conduct cyber operations against transnational criminal organizations under U.S. government control and authority.","Participating security firms will be vetted before entering contracts with the Justice Department or the Department of Homeland Security, and the program will be overseen by executive directors from those departments.","Companies in the program must maintain a bond or escrow of at least $1 million that can be forfeited if they do not comply with contractual agreements.","The White House said the program is intended to disrupt foreign criminal organizations involved in ransomware attacks, phishing campaigns, financial fraud, sextortion schemes, and impersonation scams."],"insights":["The memo does not create a free-form private hack-back system; participating companies would operate under U.S. government direction, contracts, vetting, and procedures tied to legal and international obligations.","The required $1 million bond or escrow creates a direct financial penalty mechanism for companies that fail to follow the program’s contractual rules.","The program encourages private companies to coordinate with other private entities and federal, state, local, tribal, and territorial agencies before proposing cyber operations, making threat information sharing part of the operational model.","The requirement to immediately stop and notify the National Coordination Center if operations exceed approved limits shows that unintended contact with U.S. citizens or U.S.-based systems is an explicitly anticipated risk.","Security experts quoted in the article described the memo as a major policy shift and raised concern that it could create ongoing incentives around billable cyber threats."],"referencedReports":[],"body":"\u003cp\u003eA new White House national security presidential memorandum signed by U.S. President Donald Trump directs the National Coordination Center to establish a program for private security companies to seek approval to hack foreign cybercrime organizations. The NCC, which is part of the Homeland Security Task Force, would use private-sector capabilities to conduct cyber operations against transnational criminal organizations under U.S. government control and authority. The White House said the program is aimed at groups involved in ransomware attacks, phishing campaigns, financial fraud, sextortion schemes, and impersonation scams.\u003c/p\u003e\n\n\u003cp\u003eThe memorandum calls for rigorous procedures for reviewing and conducting these limited cyber operations, with requirements for compliance with the U.S. Constitution, federal law, and applicable international agreements. The program will be overseen by executive directors designated by the Justice Department and the Department of Homeland Security, and participating companies will be vetted before entering into contracts with one of those departments. Companies must also maintain a bond or escrow of at least $1 million that can be forfeited if they fail to comply with contractual agreements.\u003c/p\u003e\n\n\u003cp\u003eParticipating firms must immediately stop operations and notify the National Coordination Center if they discover activity that exceeds approved limits, including unintended targeting of U.S. citizens or U.S.-based systems. The White House said U.S. consumers reported losing more than $20.8 billion to cyber-enabled crime in 2025. Veracode co-founder Chris Wysopal described the memo as a major shift in U.S. cyber policy, while former Cyber National Mission Force leader and Automox CTO Jason Kikta called it “a perpetual motion machine for billable threats.”\u003c/p\u003e\n"},{"n":14,"title":"Germany moves to give spy agencies hacking and sabotage powers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/germany-spy-agency-powers","time":"12:45","priority":"SHOULD READ","score":82,"tldr":"Germany’s cabinet approved a major intelligence-law overhaul that would let the BND and BfV conduct hacking, sabotage, data interference and limited disinformation operations, while also imposing new oversight and restrictions including on AI analysis. The bill, driven by growing security threats, still needs parliamentary approval and is expected to face civil liberties challenges.","briefOverview":"\u003cp\u003eGermany’s cabinet approved legislation that would let its intelligence agencies hack foreign systems, sabotage adversaries’ supply chains, and feed false information to extremists inside Germany. The bill would overhaul the laws governing the foreign intelligence service, the BND, and the domestic agency for the protection of the constitutional order, the BfV. It still has to clear parliament, but the governing coalition has said it wants the law in force next year.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the new powers could be used to substitute faulty components into deliveries, sabotage drone factories or chemical weapons laboratories through cyber operations, and disable servers run by hostile state-sponsored hackers and disinformation operators. The draft would also require telecommunications carriers and digital service providers to assist the agencies, with enforcement powers that could include fines or service suspension. The proposed powers stop short of allowing measures intended to endanger a person’s life or physical safety.\u003c/p\u003e\n\n\u003cp\u003eThe bill would give the BfV new operational abilities, including blocking or rerouting data traffic, altering transmissions in transit, corrupting stored data used in a plot, and disabling equipment about to be used in an attack. It also authorizes self-learning systems for intelligence analysis while banning discriminatory algorithms and requiring spot checks of machine-generated outputs under the supervision of an officer qualified to serve as a judge. Civil liberties groups have said they plan to challenge the draft legislation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Germany’s cabinet approved draft legislation that would allow its intelligence agencies to hack foreign systems, sabotage adversaries’ supply chains, and feed false information to extremists inside Germany.","The bill would rewrite the laws governing Germany’s foreign intelligence service, the BND, and its domestic intelligence agency, the BfV, and would require telecommunications carriers and digital service providers to assist the agencies when compelled.","The proposed powers would not allow measures intended to endanger a person’s life or physical safety, leaving the BND without paramilitary capabilities like those of some allied intelligence services.","Under the draft, the BND’s disruption operations would require its president to formally declare that a named foreign power was persistently and systematically threatening German interests, with the declaration expiring after 12 months and reviewed every six months.","The bill would authorize self-learning systems for intelligence analysis while banning discriminatory algorithms and requiring machine-generated outputs to be spot-checked under judicially qualified supervision."],"insights":["The draft gives Germany’s domestic intelligence service an unusual power to feed false information to people inside the country, and the article states that no equivalent statutory authority exists in British, French, or American law.","Germany’s proposed framework is narrower than those of several close allies because it explicitly bars intelligence measures intended to endanger life or physical safety, rather than relying on broader legal authorizations for covert action abroad.","The bill treats some AI-generated conclusions, such as movement profiles and personality assessments, as intrusions in their own right, meaning the legal concern is not only the data collected but also what the system infers from it.","The legal rationale for the overhaul is complicated by a prior Constitutional Court judgment that allowed lower thresholds for intelligence agencies partly because they lacked operational powers, while the new bill would give them such powers."],"referencedReports":[],"body":"\u003cp\u003eGermany’s cabinet approved legislation that would let its intelligence agencies hack foreign systems, sabotage adversaries’ supply chains, and feed false information to extremists inside Germany. The bill would overhaul the laws governing the foreign intelligence service, the BND, and the domestic agency for the protection of the constitutional order, the BfV. It still has to clear parliament, but the governing coalition has said it wants the law in force next year.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the new powers could be used to substitute faulty components into deliveries, sabotage drone factories or chemical weapons laboratories through cyber operations, and disable servers run by hostile state-sponsored hackers and disinformation operators. The draft would also require telecommunications carriers and digital service providers to assist the agencies, with enforcement powers that could include fines or service suspension. The proposed powers stop short of allowing measures intended to endanger a person’s life or physical safety.\u003c/p\u003e\n\n\u003cp\u003eThe bill would give the BfV new operational abilities, including blocking or rerouting data traffic, altering transmissions in transit, corrupting stored data used in a plot, and disabling equipment about to be used in an attack. It also authorizes self-learning systems for intelligence analysis while banning discriminatory algorithms and requiring spot checks of machine-generated outputs under the supervision of an officer qualified to serve as a judge. Civil liberties groups have said they plan to challenge the draft legislation.\u003c/p\u003e\n"},{"n":20,"title":"One Extra Letter, Full Auth Pass, Nothing to Scan","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/typosquat-full-auth-ach-change-out-of-band-encrypted-file-pin","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"Attackers impersonated a healthcare supplier using a one-letter typosquat domain that passed SPF, DKIM, and DMARC, then requested ACH banking details without using malicious links or payloads. The key lesson is that email authentication proves control of a domain, not legitimacy, so payment changes must be verified outside email.","briefOverview":"\u003cp\u003eA large U.S. regional healthcare system received an ACH enrolment notice that appeared to come from a medical-device manufacturer it already did business with. The sender used \u003ccode\u003earthrrex[.]com\u003c/code\u003e, a one-character typosquat of the real \u003ccode\u003earthrex[.]com\u003c/code\u003e domain with a doubled \u003ccode\u003er\u003c/code\u003e. The message claimed the manufacturer was ending check and credit-card payments and moving payments to ACH through a subsidiary company under another name.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, Microsoft composite authentication, and ARC checks because the attacker owned and properly configured the lookalike domain. The links in the message pointed to the real manufacturer’s legitimate website and social channels, while the attached PDF had no JavaScript, form fields, embedded executable, account number, or routing details. The actual request was plain text asking recipients to email \u003ccode\u003eapinquiry@arthrrex[.]com\u003c/code\u003e with banking details, while the PDF said ACH information would arrive later as an encrypted file with a PIN sent separately.\u003c/p\u003e\n\n\u003cp\u003eThe PDF metadata showed the memo was created and modified on the same day the typosquat domain was registered, despite the memo text being dated three days earlier. IRONSCALES Themis scored the message at 84 percent confidence because the return-path domain was newly registered, and four mailboxes across two waves were quarantined and mitigated. The article emphasizes that authentication checks only proved the attacker-controlled domain sent the email, and recommends treating payment-instruction changes as unverifiable by email and confirming them using contact information from the contract.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A large U.S. regional healthcare system received an ACH enrolment notice from the typosquat domain arthrrex.com, which differed from the real medical-device manufacturer domain arthrex.com by one extra letter.","The attacker's domain had SPF, DKIM, and DMARC configured correctly, so the message passed email authentication checks under the attacker's own domain.","The attached PDF contained no JavaScript, form fields, embedded executable, account number, or routing details, and the email’s request to contact apinquiry@arthrrex.com was plain text rather than a link.","The PDF metadata showed it was created and modified on the same day the lookalike domain was registered, while the memo text was dated three days earlier.","IRONSCALES Themis scored the message at 84 percent confidence mainly because the return-path domain was newly registered, and four mailboxes across two waves were quarantined and mitigated."],"insights":["A full SPF, DKIM, and DMARC pass can be misleading in business email compromise because it may only prove that the attacker controls the lookalike domain that sent the message.","The attacker avoided many gateway checks by putting the real request in plain text, using only clean links to the legitimate manufacturer’s public sites, and withholding bank details from the email and attachment.","Edit-distance checks against a company’s existing vendor list would have been more meaningful than generic domain reputation because the malicious domain differed from a real supplier’s domain by only one character.","The PDF’s metadata contradicted the memo’s printed date, showing that file metadata can expose a staged vendor-change narrative even when the attachment itself is not malicious.","Email-based verification is unsafe for payment-change requests in this scenario because the attacker designed the message to move the conversation into follow-up replies and out-of-band files."],"referencedReports":[{"title":"RFC 9989","url":"https://datatracker.ietf.org/doc/html/rfc9989","publisher":"IETF","context":"The article cites RFC 9989 to explain that a DMARC pass means a message is aligned and authenticated, not that the sender is legitimate.","category":"research","primary":false},{"title":"Phishing: Spearphishing Attachment","url":"https://attack.mitre.org/techniques/T1566/001/","publisher":"MITRE ATT\u0026CK","context":"The article maps the attached PDF payment-change memo to MITRE ATT\u0026CK technique T1566.001.","category":"research","primary":false},{"title":"Establish Accounts: Email Accounts","url":"https://attack.mitre.org/techniques/T1585/002/","publisher":"MITRE ATT\u0026CK","context":"The article maps the attacker’s prebuilt typosquat email infrastructure to MITRE ATT\u0026CK technique T1585.002.","category":"research","primary":false},{"title":"Impersonation","url":"https://attack.mitre.org/techniques/T1656/","publisher":"MITRE ATT\u0026CK","context":"The article maps the impersonation of the medical-device manufacturer and fabricated personas to MITRE ATT\u0026CK technique T1656.","category":"research","primary":false},{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article references the report’s statistics on pretexting as an initial access vector and breaches involving a human element.","category":"research","primary":false},{"title":"2025 FBI IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report’s figure for business email compromise losses.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article cites CISA guidance when recommending that payment changes be confirmed using trusted contact details rather than information in the request email.","category":"guide","primary":false}],"body":"\u003cp\u003eA large U.S. regional healthcare system received an ACH enrolment notice that appeared to come from a medical-device manufacturer it already did business with. The sender used \u003ccode\u003earthrrex[.]com\u003c/code\u003e, a one-character typosquat of the real \u003ccode\u003earthrex[.]com\u003c/code\u003e domain with a doubled \u003ccode\u003er\u003c/code\u003e. The message claimed the manufacturer was ending check and credit-card payments and moving payments to ACH through a subsidiary company under another name.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, Microsoft composite authentication, and ARC checks because the attacker owned and properly configured the lookalike domain. The links in the message pointed to the real manufacturer’s legitimate website and social channels, while the attached PDF had no JavaScript, form fields, embedded executable, account number, or routing details. The actual request was plain text asking recipients to email \u003ccode\u003eapinquiry@arthrrex[.]com\u003c/code\u003e with banking details, while the PDF said ACH information would arrive later as an encrypted file with a PIN sent separately.\u003c/p\u003e\n\n\u003cp\u003eThe PDF metadata showed the memo was created and modified on the same day the typosquat domain was registered, despite the memo text being dated three days earlier. IRONSCALES Themis scored the message at 84 percent confidence because the return-path domain was newly registered, and four mailboxes across two waves were quarantined and mitigated. The article emphasizes that authentication checks only proved the attacker-controlled domain sent the email, and recommends treating payment-instruction changes as unverifiable by email and confirming them using contact information from the contract.\u003c/p\u003e\n"},{"n":26,"title":"The State of Ransomware Q2 2026","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/the-state-of-ransomware-q2-2026/","time":"12:54","priority":"SHOULD READ","score":82,"tldr":"Check Point Research’s Q2 2026 ransomware report says the ecosystem remains highly active but is becoming less concentrated, with more groups entering the field while top operators like Qilin and The Gentlemen still drive much of the victim volume. The report also highlights falling payment rates, faster AI-assisted exploitation and tooling development, and law enforcement pressure on shared ransomware infrastructure.","briefOverview":"\u003cp\u003eCheck Point Research’s State of Ransomware Q2 2026 report says the ransomware ecosystem is starting to shift after a period dominated by a handful of large RaaS operations. The leaders are still responsible for much of the damage, but the path to becoming a major operator has become shorter. The top 10 groups accounted for 57.6% of victims, down from 71% in Q1, while active groups rose from 71 to 93.\u003c/p\u003e\n\n\u003cp\u003eVictim volume remained high, with data leak sites recording 2,139 victims in Q2, essentially flat from Q1 and up 33% year over year. Qilin stayed the most prolific operator for a fourth straight quarter with 279 victims, though its count fell 17%. The Gentlemen rose 62% to 269 victims and outpaced Qilin during June.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights an internal leak from The Gentlemen that exposed a core team of about nine operators, a broader affiliate base, and use of AI coding assistants to build a ransomware management panel in about three days. Ransom payment rates fell to a multi-year low near 23%, even as on-chain ransomware payments exceeded $820 million in 2025 and average and median payments moved in different directions. Law enforcement focused on shared infrastructure used by multiple ransomware actors, while the US share of victims fell from 50% to 42% and vulnerabilities continued to be weaponized within hours to days of disclosure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research reported that the top 10 ransomware groups accounted for 57.6% of all victims in Q2 2026, down from 71% in Q1, while the number of active groups rose from 71 to 93.","Data leak sites recorded 2,139 victims in Q2 2026, essentially flat compared with Q1 and up 33% year over year.","Qilin remained the most prolific operator for a fourth straight quarter with 279 victims, while The Gentlemen rose 62% to 269 victims and outpaced Qilin in June.","An internal leak from The Gentlemen showed a core team of about nine operators, a broader affiliate base, and use of AI coding assistants to build a ransomware management panel in about three days.","Ransom payment rates fell to a multi-year low near 23%, continuing a six-year decline from 85% in 2019, even though on-chain ransomware payments still exceeded $820 million in 2025."],"insights":["The ransomware ecosystem is becoming easier to enter: overall victim volume stayed high while active groups reached a new high and the top 10 groups lost share, showing that more smaller operators are now contributing to the same level of harm.","The Gentlemen’s internal leak provides rare first-party evidence that AI can materially shorten malicious tool development, with its ransomware management panel reportedly built in about three days.","Law enforcement in Q2 focused on services used across multiple ransomware groups, such as laundering, malware signing, infostealer, and anonymization infrastructure, rather than only pursuing individual ransomware brands.","The drop in the US victim share from 50% to 42% shows that changes in which groups grow fastest can meaningfully shift the geographic distribution of ransomware impact.","The payment market is splitting: fewer victims are paying overall, but large enterprises continue to make high payments while the mid-market increasingly refuses or settles for smaller amounts."],"referencedReports":[],"body":"\u003cp\u003eCheck Point Research’s State of Ransomware Q2 2026 report says the ransomware ecosystem is starting to shift after a period dominated by a handful of large RaaS operations. The leaders are still responsible for much of the damage, but the path to becoming a major operator has become shorter. The top 10 groups accounted for 57.6% of victims, down from 71% in Q1, while active groups rose from 71 to 93.\u003c/p\u003e\n\n\u003cp\u003eVictim volume remained high, with data leak sites recording 2,139 victims in Q2, essentially flat from Q1 and up 33% year over year. Qilin stayed the most prolific operator for a fourth straight quarter with 279 victims, though its count fell 17%. The Gentlemen rose 62% to 269 victims and outpaced Qilin during June.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights an internal leak from The Gentlemen that exposed a core team of about nine operators, a broader affiliate base, and use of AI coding assistants to build a ransomware management panel in about three days. Ransom payment rates fell to a multi-year low near 23%, even as on-chain ransomware payments exceeded $820 million in 2025 and average and median payments moved in different directions. Law enforcement focused on shared infrastructure used by multiple ransomware actors, while the US share of victims fell from 50% to 42% and vulnerabilities continued to be weaponized within hours to days of disclosure.\u003c/p\u003e\n"},{"n":11,"title":"Drop Something? Don’t Worry, Someone Caught it","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/drop-something-dont-worry-someone-caught-it/","time":"13:00","priority":"SHOULD READ","score":80,"tldr":"Infoblox found that about one in five newly registered domains are previously expired domains that have been re-registered, giving them inherited reputation, traffic, and lingering connections. This makes dropcatch domains attractive not only to investors and defenders, but also to threat actors who can abuse that residual trust for malware, hijacking, and other schemes.","briefOverview":"\u003cp\u003eInfoblox Threat Intel examined “dropcatch” domains, which are domains that expired, became available again, and were re-registered by someone else. During the first half of 2026, Infoblox observed over 50,000 dropcatch domains per day in gTLDs alone, rising to about 65,000 per day when including various ccTLDs. For gTLDs, nearly 20% of observed daily registrations were dropcatch domains, meaning about one in five newly registered domains had a prior life.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that dropped domains can come from failed businesses, missed renewal notices, abandoned internal domains, temporary events, charitable initiatives, political campaigns, personal blogs, mergers, acquisitions, and bulk registrations abandoned by threat actors. Measuring dropcatch activity is difficult because it depends on creation-date data and long-term domain history, and many ccTLD registries do not publicly provide creation dates. Infoblox focused on domains that reappeared with a new creation date after a prior registration, while domains that changed ownership before deletion were not included in its dataset.\u003c/p\u003e\n\n\u003cp\u003eThe security significance is that re-registered domains may retain reputation, traffic, email, cached search results, old web references, and lingering DNS records from their previous owners. The article says this inherited trust can make such domains valuable to domain investors, defenders, and threat actors. Infoblox cites an example in which a previously expired CDN domain used by a marketing service was acquired in February 2026 by an actor it calls Shady Squirrel, who then began sending website visitors to malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox defines dropcatch domains as domains that expired, became available again, and were re-registered by someone else.","During the first half of 2026, Infoblox observed over 50,000 dropcatch domains per day in gTLDs alone and about 65,000 per day when including various ccTLDs.","Infoblox found that nearly 20% of observed daily gTLD registrations were dropcatch domains, meaning about one in five newly registered domains had a prior registration history.","Approximately 92% of all observed gTLD dropcatch domains came from just 15 TLDs, with .net and .xyz showing dropcatch rates of nearly three out of every ten newly observed domains.","The article says dropcatch domains can create security concerns because they may retain reputation, traffic, email, cached search results, lingering DNS records, and other connections from their previous owners."],"insights":["A domain’s apparent age can be misleading because a re-registered domain may benefit from signals tied to its earlier life, causing researchers, security products, and reputation systems to view it more favorably than a truly new domain.","Creation-date availability strongly affects visibility into dropcatch activity, because gTLDs are easier to measure under ICANN registration data policies while many ccTLDs do not publicly provide creation dates.","Registrar and ownership data alone are often insufficient to determine whether a re-registered domain is being actively used, held for resale, parked, monetized, or controlled by a portfolio operator.","Expired domains can remain dangerous for years after abandonment because old links, embedded URLs, email flows, and DNS records may continue to point people or systems toward the domain after a new owner takes control.","The article’s CDN example shows that even domains tied to major media websites and acquired startups can be forgotten long enough for a later buyer to redirect visitors to malware."],"referencedReports":[{"title":"The Perils of Expired Domains: We’re Reading Your Email","url":"https://labs.watchtowr.com/the-perils-of-expired-domains-were-reading-your-email/","publisher":"watchTowr Labs","context":"The article cites this analysis as an example of how expired domains can receive email intended for the original domain holder after being acquired by someone else.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox Threat Intel examined “dropcatch” domains, which are domains that expired, became available again, and were re-registered by someone else. During the first half of 2026, Infoblox observed over 50,000 dropcatch domains per day in gTLDs alone, rising to about 65,000 per day when including various ccTLDs. For gTLDs, nearly 20% of observed daily registrations were dropcatch domains, meaning about one in five newly registered domains had a prior life.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that dropped domains can come from failed businesses, missed renewal notices, abandoned internal domains, temporary events, charitable initiatives, political campaigns, personal blogs, mergers, acquisitions, and bulk registrations abandoned by threat actors. Measuring dropcatch activity is difficult because it depends on creation-date data and long-term domain history, and many ccTLD registries do not publicly provide creation dates. Infoblox focused on domains that reappeared with a new creation date after a prior registration, while domains that changed ownership before deletion were not included in its dataset.\u003c/p\u003e\n\n\u003cp\u003eThe security significance is that re-registered domains may retain reputation, traffic, email, cached search results, old web references, and lingering DNS records from their previous owners. The article says this inherited trust can make such domains valuable to domain investors, defenders, and threat actors. Infoblox cites an example in which a previously expired CDN domain used by a marketing service was acquired in February 2026 by an actor it calls Shady Squirrel, who then began sending website visitors to malware.\u003c/p\u003e\n"},{"n":3,"title":"Ukraine shuts down 94 fraudulent call centers, seize millions in cash","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ukraine-shuts-down-94-fraudulent-call-centers-seize-millions-in-cash/","time":"21:12","priority":"SHOULD READ","score":78,"tldr":"Ukrainian authorities shut down 94 fraudulent call centers that ran investment, banking, and recovery scams targeting victims in Ukraine and the EU. Police seized millions in cash, crypto wallet access tools, devices, SIM cards, vehicles, and gold, and named 26 suspects.","briefOverview":"\u003cp\u003eAuthorities in Ukraine shut down 94 fraudulent call centers across the country that lured people into investment scams or tried to obtain access to bank accounts. The operation took place this week and included 411 searches conducted after an investigation involving the National Police, Ukraine\u0026rsquo;s Security Service, the Prosecutor General’s Office, and German police. Police said the call centers posed as bankers, brokers, and law enforcement officers to trick victims.\u003c/p\u003e\n\n\u003cp\u003eThe schemes included fake investment platforms, bank impersonation calls about supposedly suspicious transactions, loan applications, and requests for payment card details. Some victims were persuaded to install remote-access tools on phones and computers, while others were promised help recovering money they had already lost and were scammed again. Police also said some call centers promoted products as medical treatments despite the products having no actual medicinal properties.\u003c/p\u003e\n\n\u003cp\u003eDuring the raids, police seized 1,794 fully equipped workstations, 3,336 pieces of computer equipment, 1,346 phones, 5,200 SIM cards, 90 bank cards, access tools for 20 cryptocurrency wallets, 22 vehicles, cash, and gold. Authorities said 26 individuals have been formally notified that they are suspects. Forensic examination of the seized equipment is underway to identify victims, determine losses, and collect evidence against organizers, participants, money mules, and money launderers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian authorities shut down 94 fraudulent call centers after 411 searches conducted with involvement from the National Police, Ukraine's Security Service, the Prosecutor General’s Office, and German police.","The call centers posed as bankers, brokers, and law enforcement officers to lure victims into fake investment platforms, obtain bank account access, or pressure them over supposedly suspicious bank transactions.","Some call centers targeted citizens in foreign countries, particularly in the European Union, and persuaded victims to install remote-access software on their computers.","Police seized 1,794 fully equipped workstations, 3,336 pieces of computer equipment, 1,346 phones, 5,200 SIM cards, 90 bank cards, access tools for 20 cryptocurrency wallets, 22 vehicles, cash, and gold.","Authorities have formally notified 26 individuals that they are suspects, and forensic examination of seized equipment is underway to identify victims, losses, organizers, participants, money mules, and money launderers."],"insights":["The fraud operation was not limited to one script or audience; police said the call centers ran multiple scam types, including fake investments, bank impersonation, recovery scams, and false medical-treatment sales.","The seizure of 5,200 SIM cards alongside 1,346 phones suggests the call centers relied heavily on large-scale phone-based outreach rather than isolated individual scammers.","Police said some call centers had dedicated teams for identifying people genuinely interested in investing, showing that victims were being filtered and targeted rather than contacted only at random.","The investigation is aimed beyond the call center operators, as police said forensic analysis may identify organizers, money mules, and money launderers connected to the schemes."],"referencedReports":[],"body":"\u003cp\u003eAuthorities in Ukraine shut down 94 fraudulent call centers across the country that lured people into investment scams or tried to obtain access to bank accounts. The operation took place this week and included 411 searches conducted after an investigation involving the National Police, Ukraine\u0026rsquo;s Security Service, the Prosecutor General’s Office, and German police. Police said the call centers posed as bankers, brokers, and law enforcement officers to trick victims.\u003c/p\u003e\n\n\u003cp\u003eThe schemes included fake investment platforms, bank impersonation calls about supposedly suspicious transactions, loan applications, and requests for payment card details. Some victims were persuaded to install remote-access tools on phones and computers, while others were promised help recovering money they had already lost and were scammed again. Police also said some call centers promoted products as medical treatments despite the products having no actual medicinal properties.\u003c/p\u003e\n\n\u003cp\u003eDuring the raids, police seized 1,794 fully equipped workstations, 3,336 pieces of computer equipment, 1,346 phones, 5,200 SIM cards, 90 bank cards, access tools for 20 cryptocurrency wallets, 22 vehicles, cash, and gold. Authorities said 26 individuals have been formally notified that they are suspects. Forensic examination of the seized equipment is underway to identify victims, determine losses, and collect evidence against organizers, participants, money mules, and money launderers.\u003c/p\u003e\n"},{"n":15,"title":"Flock tightens privacy controls amid scandals over officer abuse","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/flock-safety-audit-assistance-police-departments","time":"16:47","priority":"SHOULD READ","score":78,"tldr":"Flock Safety is tightening privacy controls for its license plate reader network after reports that law enforcement officers used it to stalk or track people for personal reasons. Critics, including the ACLU, say the changes may not prevent abuse because officers can still misrepresent the purpose of searches.","briefOverview":"\u003cp\u003eFlock Safety is changing some policies for its license plate reader technology after reports that law enforcement officers used it to track people for personal reasons. The company said all customers must adopt its Audit Assistance feature by the end of the year, and user accounts will be automatically suspended while flagged activity is reviewed. Flock will also require officers to enter case codes tied to investigations when conducting searches, though this can be bypassed in emergencies.\u003c/p\u003e\n\n\u003cp\u003eThe changes follow allegations and arrests involving officers accused of using Flock cameras to stalk or follow former romantic partners. The article cites a Washington Post investigation that found at least 50 law enforcement officers had been charged with misusing Flock’s tools. The company presented the measures as part of its commitment to safety and privacy, while the ACLU’s Chad Marlow criticized the announcement as largely a public relations move.\u003c/p\u003e\n\n\u003cp\u003eFlock also said clients can limit how their camera data is shared with other agencies, such as allowing use for missing person investigations but not immigration enforcement. The article says it is unclear how an officer would be prevented from lying about the purpose of a search, and Marlow said a similar requirement had failed before because users could circumvent it. Flock has contracts with more than 7,000 organizations and about 120,000 license plate readers, but opposition has led cities including Los Angeles, Cambridge, and Eugene to cancel contracts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Flock Safety announced that all customers must adopt its Audit Assistance feature by the end of the year, with user accounts automatically suspended while flagged activity is reviewed.","Flock Safety will require officers to enter case codes tied to investigations when conducting searches, though the requirement can be bypassed in emergencies.","The policy changes follow reports that law enforcement officers used Flock license plate readers to track people for personal reasons, including allegations in Massachusetts and arrests in Georgia.","The ACLU’s Chad Marlow dismissed several of Flock’s announced changes as largely a public relations move and said some measures repeat previously inadequate safeguards.","Flock Safety has contracts with more than 7,000 organizations and operates a network of about 120,000 license plate readers, while opposition has led some cities including Los Angeles, Cambridge, and Eugene to cancel contracts."],"insights":["Flock’s new safeguards still rely in part on officers accurately stating the reason for a search, and the article notes it is unclear how the system would stop an officer from lying about that reason.","The company is making some controls mandatory only after repeated abuse cases became public, including a Washington Post finding that at least 50 officers had been charged with misusing Flock’s tools.","The proposed reduction of retained license plate search data from 30 days to seven days was the one change the ACLU described as potentially positive, while it criticized several other measures as recycled safeguards.","Flock now says agencies can limit how their camera data is shared with other agencies by purpose, such as allowing missing-person searches but not immigration enforcement searches."],"referencedReports":[{"title":"How police officers used a vast network of cameras to spy on their exes","url":"https://www.washingtonpost.com/technology/2026/08/02/how-police-officers-used-vast-network-cameras-spy-their-exes/","publisher":"washington-post","context":"The article cites a Washington Post investigation that found at least 50 law enforcement officers had been charged with misusing Flock’s tools.","category":"news","primary":false}],"body":"\u003cp\u003eFlock Safety is changing some policies for its license plate reader technology after reports that law enforcement officers used it to track people for personal reasons. The company said all customers must adopt its Audit Assistance feature by the end of the year, and user accounts will be automatically suspended while flagged activity is reviewed. Flock will also require officers to enter case codes tied to investigations when conducting searches, though this can be bypassed in emergencies.\u003c/p\u003e\n\n\u003cp\u003eThe changes follow allegations and arrests involving officers accused of using Flock cameras to stalk or follow former romantic partners. The article cites a Washington Post investigation that found at least 50 law enforcement officers had been charged with misusing Flock’s tools. The company presented the measures as part of its commitment to safety and privacy, while the ACLU’s Chad Marlow criticized the announcement as largely a public relations move.\u003c/p\u003e\n\n\u003cp\u003eFlock also said clients can limit how their camera data is shared with other agencies, such as allowing use for missing person investigations but not immigration enforcement. The article says it is unclear how an officer would be prevented from lying about the purpose of a search, and Marlow said a similar requirement had failed before because users could circumvent it. Flock has contracts with more than 7,000 organizations and about 120,000 license plate readers, but opposition has led cities including Los Angeles, Cambridge, and Eugene to cancel contracts.\u003c/p\u003e\n"},{"n":18,"title":"Brazil orders Discord to suspend livestreaming after teen suicide","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/discord-brazil-orders-suspension-livestreaming","time":"13:37","priority":"SHOULD READ","score":78,"tldr":"Brazil ordered Discord to disable its Go Live livestreaming feature nationwide while regulators investigate alleged safety failures after a 13-year-old girl died by suicide during a Discord livestream. Discord says the suspension is premature and disputes the regulator’s characterization of its child-safety practices.","briefOverview":"\u003cp\u003eBrazil’s National Data Protection Authority ordered Discord to suspend its Go Live livestreaming feature in Brazil while authorities investigate whether the platform failed to protect children from content encouraging self-harm and suicide. The order follows the death of a 13-year-old girl in central-western Brazil whom authorities say was encouraged to harm herself during a roughly 45-minute Discord livestream in July. Five teenagers have been arrested in connection with the case, and police also intervened in a separate incident involving a girl preparing to die by suicide during an online broadcast.\u003c/p\u003e\n\n\u003cp\u003eThe ANPD said it found “robust evidence” that Discord failed to take reasonable steps to protect children and teenagers from harmful content, particularly material promoting or facilitating violence, self-harm or suicide. The regulator stressed that Discord itself is not being blocked in Brazil and that the order applies only to Go Live. Discord has three business days to demonstrate that it has fully implemented the suspension across Brazil, and it could face fines of up to 50 million Brazilian reais per violation if violations are confirmed.\u003c/p\u003e\n\n\u003cp\u003eThe regulator said Discord’s technical setup makes it difficult to prevent livestream abuse because the company cannot access video content as it is being broadcast, limiting real-time detection and leaving it dependent on automated systems and user reports. Brazilian authorities also criticized Discord’s March addition of end-to-end encryption to Go Live, saying it further limited the company’s ability to detect harmful activity as it happened. Discord confirmed it received the order, disputed the regulator’s description of its safety practices, and called the suspension “premature.”\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Brazil’s National Data Protection Authority ordered Discord to suspend its Go Live livestreaming feature in Brazil until the company can show effective safeguards for children and teenagers.","The order follows the death of a 13-year-old girl in central-western Brazil whom authorities say was encouraged to harm herself during a roughly 45-minute Discord livestream in July.","Brazilian authorities said five teenagers were arrested in connection with the case and that police also intervened in a separate incident involving a girl preparing to die by suicide during an online broadcast.","The ANPD said it found robust evidence that Discord failed to take reasonable steps to protect children and teenagers from content promoting or facilitating violence, self-harm, or suicide.","Discord confirmed it received the order, disputed the regulator’s description of its safety practices, and called the suspension of livestreaming in Brazil premature."],"insights":["Brazil’s order targets only Discord’
