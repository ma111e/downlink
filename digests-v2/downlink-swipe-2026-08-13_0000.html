<script type="application/json" id="dl-articles">[{"n":9,"title":"Critical VMware vCenter RCE flaw exploited for reverse SSH access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-vmware-vcenter-rce-flaw-exploited-for-reverse-ssh-access/","time":"16:40","priority":"MUST READ","score":95,"tldr":"Attackers are actively exploiting the critical VMware vCenter Syslog Server flaw CVE-2026-59310 to compromise exposed systems and deploy reverse SSH for persistent remote access. Broadcom has no workaround, so administrators should urgently apply the emergency vCenter updates.","briefOverview":"\u003cp\u003eA recently patched critical vulnerability, CVE-2026-59310, in VMware vCenter Syslog Server is being exploited in an active campaign. Broadcom disclosed the flaw on July 29 as a critical directory traversal issue that could let an unauthenticated attacker with network access execute arbitrary code. The company provides no workarounds or mitigations and urges administrators to apply the emergency update.\u003c/p\u003e\n\n\u003cp\u003eDigital forensics and incident response company QUIRSO identified compromises at 361 IP addresses across 47 countries. More than half of the affected IP addresses were located in Germany, the U.S., Turkey, Iran, and France. Compromised systems began connecting to attacker-controlled infrastructure on August 3, five days after Broadcom disclosed the flaw and released the emergency patch.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to vulnerable vCenter systems, the attacker deployed the open-source reverse_ssh framework for persistence and remote access. The reverse SSH connection provides an outbound command-and-control channel and can help bypass firewalls or other network security measures. QUIRSO released a generic YARA rule to detect reverse_ssh client binaries, while noting that legitimate use of the tool can also trigger the alert.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A recently patched critical vulnerability, CVE-2026-59310, in VMware vCenter Syslog Server is being exploited to deploy a reverse SSH tool for persistence and remote access.","QUIRSO identified compromises at 361 IP addresses across 47 countries, with more than half located in Germany, the U.S., Turkey, Iran, and France.","Broadcom disclosed CVE-2026-59310 on July 29 as a critical directory traversal vulnerability that could allow an unauthenticated attacker with network access to execute arbitrary code.","Compromised systems began connecting to attacker-controlled infrastructure on August 3, five days after Broadcom disclosed the flaw and released an emergency patch.","Broadcom provides no workarounds or mitigations and urges administrators to apply the emergency update for affected vCenter releases."],"insights":["Exploitation began just five days after Broadcom released the emergency patch, showing that the window for safely delaying vCenter updates was very short in this campaign.","The victim count grew rapidly from the first observed connections on August 3 to 343 victim IPs by August 5, indicating the campaign expanded quickly after disclosure.","The attackers used reverse SSH because it creates an outbound remote access channel that can help bypass firewalls or other network security measures.","QUIRSO’s YARA rule can help detect reverse_ssh client binaries, but the article warns that legitimate use of the same tool will also trigger alerts."],"referencedReports":[{"title":"Active Exploitation of CVE-2026-59310: 361 Victim IPs Across 47 Countries","url":"https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff","publisher":"QUIRSO","context":"The article cites QUIRSO’s findings on the active exploitation campaign, victim counts, timing, and use of reverse_ssh.","category":"research","primary":true},{"title":"Broadcom Security Advisory for CVE-2026-59310","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017","publisher":"Broadcom","context":"The article links to Broadcom’s emergency update and says administrators are urged to apply the patched vCenter releases.","category":"advisory","primary":false},{"title":"VMSA-2026-0006 FAQ","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/tree/main/security-advisories/vmsa-2026-0006","publisher":"VMware","context":"The article points readers to the FAQ post for additional information about the vCenter security advisory.","category":"advisory","primary":false}],"body":"\u003cp\u003eA recently patched critical vulnerability, CVE-2026-59310, in VMware vCenter Syslog Server is being exploited in an active campaign. Broadcom disclosed the flaw on July 29 as a critical directory traversal issue that could let an unauthenticated attacker with network access execute arbitrary code. The company provides no workarounds or mitigations and urges administrators to apply the emergency update.\u003c/p\u003e\n\n\u003cp\u003eDigital forensics and incident response company QUIRSO identified compromises at 361 IP addresses across 47 countries. More than half of the affected IP addresses were located in Germany, the U.S., Turkey, Iran, and France. Compromised systems began connecting to attacker-controlled infrastructure on August 3, five days after Broadcom disclosed the flaw and released the emergency patch.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to vulnerable vCenter systems, the attacker deployed the open-source reverse_ssh framework for persistence and remote access. The reverse SSH connection provides an outbound command-and-control channel and can help bypass firewalls or other network security measures. QUIRSO released a generic YARA rule to detect reverse_ssh client binaries, while noting that legitimate use of the tool can also trigger the alert.\u003c/p\u003e\n"},{"n":19,"title":"Attackers Exploit SharePoint Authentication Bypass After Public PoC Release","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/attackers-exploit-sharepoint.html","time":"06:09","priority":"MUST READ","score":94,"tldr":"Attackers are exploiting CVE-2026-55040, a critical Microsoft SharePoint authentication bypass, after Rapid7 released public PoC code. Organizations running SharePoint should apply Microsoft’s July 2026 patches immediately to prevent unauthenticated impersonation and data access.","briefOverview":"\u003cp\u003eThreat actors have begun exploiting CVE-2026-55040, a critical Microsoft SharePoint security feature bypass, after Rapid7 released proof-of-concept code. Microsoft patched the flaw in its July 2026 Patch Tuesday updates and said it stems from weak authentication. Successful exploitation can allow an unauthenticated attacker to bypass authentication on a vulnerable SharePoint server and act as a SharePoint site user or administrator.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the vulnerability could allow an attacker to disclose files and modify data, but not affect system availability. Rapid7 said the issue involves several weaknesses in the JWT token validation pipeline, specifically in two SharePoint classes that handle Bearer service-to-service tokens. The exploit chain can let an unauthenticated remote attacker forge a valid JWT and impersonate any SharePoint site user.\u003c/p\u003e\n\n\u003cp\u003eRapid7’s Python-based proof of concept uses the forged JWT to query a target’s domain controller, enumerate users by SID, and locate a site administrator. KEVIntel telemetry recorded 12 exploitation attempts since July 19, 2026, with eight occurring on August 12 and 13 after the PoC release. The attempts came from eight unique IP addresses tied to Hong Kong, Japan, the Netherlands, Taiwan, and the United States, and SharePoint users are advised to keep their instances up to date.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors have begun exploiting CVE-2026-55040, a critical Microsoft SharePoint security feature bypass, after Rapid7 released proof-of-concept exploit code.","Microsoft patched CVE-2026-55040 in its July 2026 Patch Tuesday updates and said the flaw could allow impersonation, file disclosure, and data modification.","Rapid7 said the vulnerability stems from several issues in SharePoint’s JWT token validation pipeline and can let an unauthenticated remote attacker forge a valid JWT to impersonate any SharePoint site user.","Rapid7’s Python-based proof of concept uses a forged JWT token to query a target’s domain controller, enumerate users by SID, and locate a site administrator.","KEVIntel telemetry recorded 12 exploitation attempts since July 19, 2026, with eight occurring on August 12 and 13 from IP addresses tied to Hong Kong, Japan, the Netherlands, Taiwan, and the United States."],"insights":["The exploitation activity increased sharply after the public proof-of-concept was released, with eight of the 12 recorded attempts occurring on August 12 and 13.","The flaw is especially actionable for attackers because successful exploitation does not require authentication and can result in impersonation of a SharePoint site user or administrator.","The exploit chain depends on multiple JWT validation weaknesses working together, including acceptance of an outer token with \"alg: none\" and an actor token signature that is present but not verified.","The available proof-of-concept goes beyond demonstrating token forgery by also helping identify a site administrator through domain controller queries and SID enumeration."],"referencedReports":[{"title":"Microsoft SharePoint JWT Token Authentication Bypass CVE-2026-55040","url":"https://www.rapid7.com/blog/post/ra-microsoft-sharepoint-jwt-token-authentication-bypass-cve-2026-55040/","publisher":"Rapid7","context":"The article cites Rapid7's technical analysis explaining that the SharePoint flaw stems from several issues in the JWT token validation pipeline and describes the exploit chain.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors have begun exploiting CVE-2026-55040, a critical Microsoft SharePoint security feature bypass, after Rapid7 released proof-of-concept code. Microsoft patched the flaw in its July 2026 Patch Tuesday updates and said it stems from weak authentication. Successful exploitation can allow an unauthenticated attacker to bypass authentication on a vulnerable SharePoint server and act as a SharePoint site user or administrator.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the vulnerability could allow an attacker to disclose files and modify data, but not affect system availability. Rapid7 said the issue involves several weaknesses in the JWT token validation pipeline, specifically in two SharePoint classes that handle Bearer service-to-service tokens. The exploit chain can let an unauthenticated remote attacker forge a valid JWT and impersonate any SharePoint site user.\u003c/p\u003e\n\n\u003cp\u003eRapid7’s Python-based proof of concept uses the forged JWT to query a target’s domain controller, enumerate users by SID, and locate a site administrator. KEVIntel telemetry recorded 12 exploitation attempts since July 19, 2026, with eight occurring on August 12 and 13 after the PoC release. The attempts came from eight unique IP addresses tied to Hong Kong, Japan, the Netherlands, Taiwan, and the United States, and SharePoint users are advised to keep their instances up to date.\u003c/p\u003e\n"},{"n":30,"title":"Emerging Threat: (CVE-2026-71362) Adobe Commerce Account Takeover via Session Identity Flaw","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-71362-adobe-commerce-account-takeover-via-session-identity-flaw/","time":"09:56","priority":"MUST READ","score":94,"tldr":"Adobe Commerce and Magento Open Source have a critical unauthenticated account-takeover flaw, CVE-2026-71362, affecting public storefronts on multiple 2.4.x release lines. Fixed August 2026 patches are available, but organizations should urgently inventory all storefronts, including staging and campaign sites, patch, invalidate sessions, and monitor for exploitation.","briefOverview":"\u003cp\u003eCVE-2026-71362 is a critical incorrect authorization vulnerability in Adobe Commerce and Magento Open Source with a CVSS v3.1 base score of 9.1. The flaw is caused by the platform failing to correctly bind a customer identity to an account session. Adobe says exploitation requires no authentication, no administrator privileges, and no user interaction, with only network access to the public storefront required.\u003c/p\u003e\n\n\u003cp\u003eSansec’s patch analysis found that the issue involves improper handling of customer identity within an account session, allowing an attacker to switch an active session to a different customer account. In practice, this gives the attacker that customer’s authenticated context, including access to stored personal data and order history. Adobe says it is not aware of exploits in the wild, while Sansec reports that its Shield web application firewall is already blocking exploitation attempts against this CVE.\u003c/p\u003e\n\n\u003cp\u003eAffected assets include Adobe Commerce 2.4.4 through 2.4.9 and Magento Open Source 2.4.6 through 2.4.9 at the 2026-jul build and earlier, with Adobe Commerce B2B fixes also included in the same bulletin. Adobe published fixed 2026-aug builds in APSB26-92 on August 11, 2026, but the article notes that isolated patches may require stores to already be on the latest point release for their supported branch. Recommended actions include inventorying all Adobe Commerce and Magento hosts, deploying WAF coverage for storefront customer and session endpoints, invalidating active customer sessions after patching, monitoring for account or session switching, and scanning exposed stores for backdoors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-71362 is a critical incorrect authorization vulnerability in Adobe Commerce and Magento Open Source that can allow an unauthenticated attacker to switch an active session to a different customer account.","Affected software includes Adobe Commerce 2.4.4 through 2.4.9 and Magento Open Source 2.4.6 through 2.4.9 at the 2026-jul build and earlier in each line.","Adobe published fixed 2026-aug builds in bulletin APSB26-92 on August 11, 2026, covering Adobe Commerce, Magento Open Source, and Adobe Commerce B2B supported lines.","Adobe says it is not aware of exploitation in the wild, while Sansec reports that its Shield web application firewall is already blocking exploitation attempts against this CVE.","The article recommends inventorying all Adobe Commerce and Magento hosts, deploying WAF coverage for storefront customer and session endpoints, invalidating active customer sessions after patching, monitoring logs for account or session switching, and scanning exposed stores for backdoors."],"insights":["The article highlights a meaningful discrepancy in exploitation status: Adobe says it is not aware of in-the-wild exploitation, but Sansec reports its WAF is already blocking attempts, so defenders should verify their own exposure rather than relying only on the vendor advisory.","Remediation may take longer than simply applying the August fix because Adobe’s monthly fixes are distributed as isolated patches and require stores to already be on the latest point release for their supported branch.","The highest exposure concentration in the observed dataset is in Communication Services, where many small, separately managed merchandise, ticketing, licensing, and promotional storefronts can create a fragmented patching problem.","The article emphasizes that staging, preproduction, UAT, developer, and campaign storefronts are part of the real exposure surface because they often run the same codebase but may be excluded from normal production change control.","Session invalidation after patching is specifically recommended because the flaw involves improper handling of customer identity inside active account sessions."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-71362 is a critical incorrect authorization vulnerability in Adobe Commerce and Magento Open Source with a CVSS v3.1 base score of 9.1. The flaw is caused by the platform failing to correctly bind a customer identity to an account session. Adobe says exploitation requires no authentication, no administrator privileges, and no user interaction, with only network access to the public storefront required.\u003c/p\u003e\n\n\u003cp\u003eSansec’s patch analysis found that the issue involves improper handling of customer identity within an account session, allowing an attacker to switch an active session to a different customer account. In practice, this gives the attacker that customer’s authenticated context, including access to stored personal data and order history. Adobe says it is not aware of exploits in the wild, while Sansec reports that its Shield web application firewall is already blocking exploitation attempts against this CVE.\u003c/p\u003e\n\n\u003cp\u003eAffected assets include Adobe Commerce 2.4.4 through 2.4.9 and Magento Open Source 2.4.6 through 2.4.9 at the 2026-jul build and earlier, with Adobe Commerce B2B fixes also included in the same bulletin. Adobe published fixed 2026-aug builds in APSB26-92 on August 11, 2026, but the article notes that isolated patches may require stores to already be on the latest point release for their supported branch. Recommended actions include inventorying all Adobe Commerce and Magento hosts, deploying WAF coverage for storefront customer and session endpoints, invalidating active customer sessions after patching, monitoring for account or session switching, and scanning exposed stores for backdoors.\u003c/p\u003e\n"},{"n":32,"title":"Team PCP Stole 78,330 Secrets From 2,186 Organizations. CloudSEK Just Published the List.","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/teampcp-supply-chain-attack-cicd-secrets-cloudsek-disclosure","time":"17:54","priority":"MUST READ","score":94,"tldr":"Team PCP allegedly stole 78,330 secrets from CI/CD pipelines across 2,186 organizations by compromising trusted open source components and using them to harvest credentials at scale. The key takeaway is that CI/CD systems are now a primary supply-chain target and need production-grade controls like dependency pinning, runtime monitoring, and network egress restrictions.","briefOverview":"\u003cp\u003eTeam PCP exfiltrated 78,330 distinct secrets from the CI/CD pipelines of 2,186 organizations over five days, from March 19 to 24, 2026. CloudSEK published a searchable dataset of the exposure, and StepSecurity analyzed it. The affected organizations include 92 public companies with a combined market capitalization above $6.2 trillion.\u003c/p\u003e\n\n\u003cp\u003eThe article describes Team PCP as a threat actor that compromises trusted open source projects, plants credential stealers, collects secrets from CI/CD runners, and uses stolen credentials to compromise additional maintainers, repositories, or registries. The campaign included compromises involving the Trivy GitHub Action, the Checkmarx KICS action, the telnyx PyPI package, and LiteLLM. StepSecurity’s analysis found that GitLab accounted for 1,064 exposed organizations, followed by GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, and CircleCI.\u003c/p\u003e\n\n\u003cp\u003eThe stolen secrets included JWTs, private key blocks, AWS access keys, GitLab and GitHub personal access tokens, OpenAI keys, Slack webhooks, and Google API keys. The article argues that CI/CD pipelines are being targeted because they often hold powerful credentials while lacking controls such as runtime monitoring, network egress restrictions, and governance over which dependencies execute with secrets in scope. It recommends that affected organizations rotate exposed credentials, audit access logs since March 19, 2026, pin CI/CD dependencies to immutable references, and deploy runtime and network egress controls on runners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CloudSEK published a searchable dataset showing that Team PCP exfiltrated 78,330 distinct secrets from the CI/CD pipelines of 2,186 organizations between March 19 and March 24, 2026.","The article says Team PCP’s playbook is to compromise trusted open source components, run credential stealers in CI/CD pipelines, exfiltrate secrets, and use those credentials to compromise additional maintainers, repositories, or registries.","StepSecurity’s analysis of the CloudSEK dataset found affected organizations using GitLab, GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, and CircleCI, with GitLab accounting for 1,064 exposed organizations.","The exposed credentials included JWTs, private key blocks, AWS access keys, GitLab personal access tokens, GitHub personal access tokens, OpenAI keys, Slack webhooks, and Google API keys.","The article recommends that organizations appearing in the dataset rotate exposed credentials, audit access logs since March 19, 2026, pin CI/CD dependencies to immutable references, and deploy runtime and network egress controls on runners."],"insights":["The campaign was not mainly a GitHub Actions problem: StepSecurity’s analysis found GitLab had the most exposed organizations by a wide margin, and Azure DevOps appeared in more than 230 organizations.","The article emphasizes that rotating exposed credentials is not sufficient because the dataset shows what left the runners, not what Team PCP may already have done with the stolen access.","A single compromised open source component can expose many organizations at once because CI/CD pipelines often load secrets into environments where any running step can read them.","The presence of 157 leaked OpenAI API keys and the LiteLLM compromise led CloudSEK to frame the incident as an AI supply chain event, showing that AI infrastructure is being affected through ordinary software delivery pipelines.","The article argues that pinning dependencies only closes one route of compromise because Team PCP also reached runners through dependencies that were not known to be compromised at the time."],"referencedReports":[{"title":"AI Supply Chain Incident","url":"https://exposure.cloudsek.com/ai-supply-chain-incident","publisher":"CloudSEK","context":"The article says CloudSEK’s Threat Intelligence team cataloged the Team PCP exposure and published a searchable dataset that StepSecurity analyzed throughout the post.","category":"research","primary":true}],"body":"\u003cp\u003eTeam PCP exfiltrated 78,330 distinct secrets from the CI/CD pipelines of 2,186 organizations over five days, from March 19 to 24, 2026. CloudSEK published a searchable dataset of the exposure, and StepSecurity analyzed it. The affected organizations include 92 public companies with a combined market capitalization above $6.2 trillion.\u003c/p\u003e\n\n\u003cp\u003eThe article describes Team PCP as a threat actor that compromises trusted open source projects, plants credential stealers, collects secrets from CI/CD runners, and uses stolen credentials to compromise additional maintainers, repositories, or registries. The campaign included compromises involving the Trivy GitHub Action, the Checkmarx KICS action, the telnyx PyPI package, and LiteLLM. StepSecurity’s analysis found that GitLab accounted for 1,064 exposed organizations, followed by GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, and CircleCI.\u003c/p\u003e\n\n\u003cp\u003eThe stolen secrets included JWTs, private key blocks, AWS access keys, GitLab and GitHub personal access tokens, OpenAI keys, Slack webhooks, and Google API keys. The article argues that CI/CD pipelines are being targeted because they often hold powerful credentials while lacking controls such as runtime monitoring, network egress restrictions, and governance over which dependencies execute with secrets in scope. It recommends that affected organizations rotate exposed credentials, audit access logs since March 19, 2026, pin CI/CD dependencies to immutable references, and deploy runtime and network egress controls on runners.\u003c/p\u003e\n"},{"n":33,"title":"PATCHCORD: New malware cluster targets Afghan telecom and South Asian critical infrastructure","source":"acronis.com","sourceColorIdx":10,"link":"https://www.acronis.com/en/tru/posts/patchcord-new-malware-cluster-targets-afghan-telecom-and-south-asian-critical-infrastructure/","time":"07:45","priority":"MUST READ","score":94,"tldr":"Acronis researchers uncovered an active espionage campaign using new PATCHCORD, SHEETCORD, and HACKERAI implants to target Afghan telecom providers and South Asian government, defense, and critical infrastructure organizations. The activity is assessed with moderate confidence to overlap with APT36/Transparent Tribe and uses evolving C2 methods including custom HTTP, Google Sheets, and GitHub Gists.","briefOverview":"\u003cp\u003eAcronis Threat Research Unit identified an ongoing campaign delivering a previously undocumented custom backdoor called PATCHCORD against Afghan telecom providers and South Asian critical infrastructure organizations. The malware was delivered through sector-specific lures, including fake VPN installers impersonating Afghan Telecom and telecom management tools. Infrastructure pivoting also uncovered SHEETCORD, a Go-based implant that builds on PATCHCORD’s capabilities while abusing Google Sheets for command-and-control communication, and HACKERAI C2 Agent, which uses GitHub Gists for tasking and data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s infrastructure centers on a single C2 server at 46.30.188.13 with multiple associated domains impersonating Afghan telecom operators, Indian government entities, and other organizations. Acronis found that the same infrastructure served additional campaigns, including one impersonating India’s National Informatics Centre to distribute SHEETCORD and an earlier campaign targeting India’s energy sector with a PATCHCORD variant. TRU assesses with moderate confidence that the activity overlaps with APT36, also known as Transparent Tribe, based on targeting patterns, malware similarities, shared infrastructure, and operational tradecraft.\u003c/p\u003e\n\n\u003cp\u003ePATCHCORD establishes persistence through browser shortcut hijacking and a registry Run key, fingerprints the host, registers with its C2 server, and supports process enumeration, in-memory shellcode execution, remote command execution, and control over the shortcut hijacking mechanism. SHEETCORD reimplements similar browser shortcut hijacking, adds startup persistence through a VBScript file and registry Run key, and uses Google Sheets API v4 with hardcoded GCP service account credentials for victim-specific communication. An exposed staging server revealed campaign lures, SuperShell C2 framework, GateSentinel, HackBrowserData, Metasploit artifacts, credential brute-forcing files, and exploit tooling for CVE-2024-6387 and CVE-2021-4034.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis Threat Research Unit identified an ongoing campaign delivering a previously undocumented C/C++ backdoor called PATCHCORD against Afghan telecom providers and South Asian critical infrastructure organizations.","PATCHCORD was delivered through sector-specific lures, including a fake Afghan Telecom TMS installer, and it communicates with the hardcoded C2 domain appstoore[.]solutions over TCP port 8080.","Infrastructure pivoting uncovered SHEETCORD, a Go-based implant distributed through a domain impersonating India’s National Informatics Centre and using Google Sheets for command-and-control communication.","An exposed staging server tied to the campaign contained campaign files, SuperShell C2 framework, multiple RAT frameworks, credential harvesting tools, and exploit tooling for CVE-2024-6387 and CVE-2021-4034.","Acronis assesses with moderate confidence that the campaign overlaps with APT36, also known as Transparent Tribe, based on targeting patterns, malware similarities, shared infrastructure, and operational tradecraft."],"insights":["PATCHCORD preserves the user’s normal browser experience after hijacking browser shortcuts by silently launching the legitimate browser first, making the persistence mechanism less noticeable to victims.","The same operator infrastructure supported three distinct command-and-control methods across related implants: PATCHCORD used a custom HTTP server, SHEETCORD abused Google Sheets, and HACKERAI C2 Agent used GitHub Gists.","The exposed staging server showed that campaign files for Afghan telecom lures were stored alongside tools such as SuperShell, GateSentinel, HackBrowserData, Metasploit, and CVE-2024-6387 exploit tooling, giving defenders concrete clues about the operator’s broader toolkit.","The threat actor maintained a single C2 server at 46.30.188.13 while rotating many impersonation domains over several months, so blocking or investigating only one domain may miss related active infrastructure.","The SHEETCORD implant expanded PATCHCORD’s browser shortcut hijacking from three browsers to six, adding Brave, Opera, and Vivaldi in addition to Chrome, Firefox, and Edge."],"referencedReports":[{"title":"APT Attacks Target Indian Government Using SHEETCREEP, FIREPOWER, and...","url":"https://www.zscaler.com/blogs/security-research/apt-attacks-target-indian-government-using-sheetcreep-firepower-and","publisher":"Zscaler","context":"The article says SHEETCORD has code and functionality overlaps with the previously documented SHEETCREEP RAT and later notes the SHEETCREEP campaign was attributed with medium confidence to APT36 or a related Pakistan-linked subgroup.","category":"research","primary":false},{"title":"APT36: Nightmare VibeWare","url":"https://www.bitdefender.com/en-us/blog/businessinsights/apt36-nightmare-vibeware","publisher":"Bitdefender","context":"The article references Bitdefender researchers as having independently documented GateSentinel as part of APT36's toolkit in a March 2026 report on Transparent Tribe operations.","category":"research","primary":false},{"title":"Silver Fox Tax Notification Campaign","url":"https://securelist.com/tr/silver-fox-tax-notification-campaign/120038/","publisher":"Kaspersky","context":"The article says Kaspersky independently documented related SuperShell infrastructure as a ValleyRAT C2 server associated with the SilverFox ABCDoor campaign.","category":"research","primary":false},{"title":"Golang-based credential stealer targets Indian Airforce Officials","url":"https://xelemental.github.io/Golang-based-credential-stealer-targets-Indian-Airforce-Officials/","publisher":"xElemental","context":"The article cites this analysis when noting that HackBrowserData had previously been observed in APT36 operations targeting Indian Air Force officials.","category":"research","primary":false}],"body":"\u003cp\u003eAcronis Threat Research Unit identified an ongoing campaign delivering a previously undocumented custom backdoor called PATCHCORD against Afghan telecom providers and South Asian critical infrastructure organizations. The malware was delivered through sector-specific lures, including fake VPN installers impersonating Afghan Telecom and telecom management tools. Infrastructure pivoting also uncovered SHEETCORD, a Go-based implant that builds on PATCHCORD’s capabilities while abusing Google Sheets for command-and-control communication, and HACKERAI C2 Agent, which uses GitHub Gists for tasking and data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eThe campaign’s infrastructure centers on a single C2 server at 46.30.188.13 with multiple associated domains impersonating Afghan telecom operators, Indian government entities, and other organizations. Acronis found that the same infrastructure served additional campaigns, including one impersonating India’s National Informatics Centre to distribute SHEETCORD and an earlier campaign targeting India’s energy sector with a PATCHCORD variant. TRU assesses with moderate confidence that the activity overlaps with APT36, also known as Transparent Tribe, based on targeting patterns, malware similarities, shared infrastructure, and operational tradecraft.\u003c/p\u003e\n\n\u003cp\u003ePATCHCORD establishes persistence through browser shortcut hijacking and a registry Run key, fingerprints the host, registers with its C2 server, and supports process enumeration, in-memory shellcode execution, remote command execution, and control over the shortcut hijacking mechanism. SHEETCORD reimplements similar browser shortcut hijacking, adds startup persistence through a VBScript file and registry Run key, and uses Google Sheets API v4 with hardcoded GCP service account credentials for victim-specific communication. An exposed staging server revealed campaign lures, SuperShell C2 framework, GateSentinel, HackBrowserData, Metasploit artifacts, credential brute-forcing files, and exploit tooling for CVE-2024-6387 and CVE-2021-4034.\u003c/p\u003e\n"},{"n":12,"title":"$7 Million in Expired Domains Fuel a Streaming Empire with a Malware Secret","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/7-million-in-expired-domains-fuel-a-streaming-empire-with-a-malware-secret/","time":"12:59","priority":"MUST READ","score":93,"tldr":"Infoblox says Sable Squirrel has built a massive illegal sports-streaming and gambling operation by spending millions on expired domains with trusted histories, then reusing some of those same domains as malware command-and-control infrastructure. The campaign links more than 10,000 domains and over 31,000 malware samples, showing how domain reputation can be weaponized across multiple criminal business lines.","briefOverview":"\u003cp\u003eInfoblox Threat Intel reports that Sable Squirrel controls more than 10,000 domains used across illegal sports streaming, online gambling promotion, redirection, CDN and tracking infrastructure, mobile app distribution, and malware command-and-control. The operation centers heavily on Vietnamese-language sports piracy brands such as Xoilac, Cakhia, 90phut, Socolive, and MiTom, while also showing links to Chinese-language betting brands and campaigns aimed at Indonesian and Russian-speaking audiences. Infoblox says the actor overlaps strongly with the prosecuted Vietnamese Xoi Lac TV network, though it cannot definitively confirm they are the same operation.\u003c/p\u003e\n\n\u003cp\u003eA major feature of the operation is its domain strategy: Sable Squirrel buys expired domains with real history, backlinks, residual traffic, and reputation signals, while also registering fresh lookalike domains tied to its streaming brands. Infoblox confirmed more than \u003cspan class=\"math inline\"\u003e\\(430,000 in dropcatch purchases across roughly 160 domains and estimates total dropcatch spending at more than \\)\u003c/span\u003e7 million. Many acquired domains formerly belonged to legitimate organizations, including corporate initiatives, media sites, charities, academic institutions, and sports-related entities.\u003c/p\u003e\n\n\u003cp\u003eThe investigation found that some of the same domains presenting live football streaming pages to visitors also operated as malware command-and-control infrastructure. Infoblox identified over 31,000 malware samples connecting to Sable Squirrel domains, including Quasar RAT, AsyncRAT, DCRat, NanoCore, Remcos, njRAT, and samples carrying HiddenTear ransomware signatures. A coordinated wave began in November 2025 and surged in December 2025, configuring hundreds of existing Sable Squirrel domains as malware C2 while the streaming and gambling operation continued despite Vietnamese enforcement actions in early 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox reports that Sable Squirrel controls more than 10,000 domains used for illegal sports streaming, online gambling promotion, traffic redirection, CDN and tracking infrastructure, mobile app distribution, and malware command-and-control.","Infoblox confirmed more than $430,000 in dropcatch purchases across roughly 160 Sable Squirrel domains and estimates the actor’s total dropcatch spending at more than $7 million.","Researchers identified over 31,000 malware samples connecting to Sable Squirrel domains, including Quasar RAT, AsyncRAT, DCRat, NanoCore, Remcos, njRAT, and samples carrying HiddenTear ransomware signatures.","A coordinated wave beginning in November 2025 and surging in December 2025 configured hundreds of existing Sable Squirrel domains as malware command-and-control infrastructure, often while the same domains still served live football streaming sites.","Vietnamese enforcement actions in February and March 2026 froze sites, charged 30 suspects, and seized about 300 billion VND, but Infoblox observed that registrations recovered within a month and the operation continued expanding toward the 2026 World Cup."],"insights":["Sable Squirrel’s use of expired domains shows that a domain’s long, clean history and backlinks can become a liability when security checks treat historical reputation as a sign of trust.","The same domain can show a normal-looking live football site to a person while also serving as a control channel for infected devices, making the malicious role harder to notice from web content alone.","The malware attribution was unusually direct because many samples contained Sable Squirrel’s own brand names, including socolive, xoilac, and 8xbet, in Windows executable metadata.","The February and March 2026 Vietnamese enforcement actions disrupted new registrations for only about one month, while customer queries to Sable Squirrel domains remained roughly steady.","Although Sable Squirrel configured hundreds of domains as malware infrastructure, exposure was concentrated in a small number of domains, with colatv88xb[.]cc accounting for nearly 70% of exposed customer networks in the Infoblox data set."],"referencedReports":[{"title":"Meet the hydras: tracing the illegal gambling operators that sponsor football","url":"https://www.playthegame.org/news/meet-the-hydras-tracing-the-illegal-gambling-operators-that-sponsor-football/","publisher":"Play the Game","context":"The article cites this research as documenting how illegal gambling networks use many front brands on shared software and payment rails to blur ownership.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox Threat Intel reports that Sable Squirrel controls more than 10,000 domains used across illegal sports streaming, online gambling promotion, redirection, CDN and tracking infrastructure, mobile app distribution, and malware command-and-control. The operation centers heavily on Vietnamese-language sports piracy brands such as Xoilac, Cakhia, 90phut, Socolive, and MiTom, while also showing links to Chinese-language betting brands and campaigns aimed at Indonesian and Russian-speaking audiences. Infoblox says the actor overlaps strongly with the prosecuted Vietnamese Xoi Lac TV network, though it cannot definitively confirm they are the same operation.\u003c/p\u003e\n\n\u003cp\u003eA major feature of the operation is its domain strategy: Sable Squirrel buys expired domains with real history, backlinks, residual traffic, and reputation signals, while also registering fresh lookalike domains tied to its streaming brands. Infoblox confirmed more than \u003cspan class=\"math inline\"\u003e\\(430,000 in dropcatch purchases across roughly 160 domains and estimates total dropcatch spending at more than \\)\u003c/span\u003e7 million. Many acquired domains formerly belonged to legitimate organizations, including corporate initiatives, media sites, charities, academic institutions, and sports-related entities.\u003c/p\u003e\n\n\u003cp\u003eThe investigation found that some of the same domains presenting live football streaming pages to visitors also operated as malware command-and-control infrastructure. Infoblox identified over 31,000 malware samples connecting to Sable Squirrel domains, including Quasar RAT, AsyncRAT, DCRat, NanoCore, Remcos, njRAT, and samples carrying HiddenTear ransomware signatures. A coordinated wave began in November 2025 and surged in December 2025, configuring hundreds of existing Sable Squirrel domains as malware C2 while the streaming and gambling operation continued despite Vietnamese enforcement actions in early 2026.\u003c/p\u003e\n"},{"n":1,"title":"Hackers breach govt webmail while running parallel crypto fraud","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-breach-govt-webmail-while-running-parallel-crypto-fraud/","time":"18:15","priority":"MUST READ","score":92,"tldr":"China-linked Jewelbug breached shared government webmail infrastructure in the Middle East to steal cookies, credentials, and emails across 15 tenants, while Symantec found the same operators also ran large-scale cryptocurrency fraud from the same control panel.","briefOverview":"\u003cp\u003eThe Jewelbug hacker group has been conducting espionage operations against governments, militaries, and critical-sector organizations while also running cryptocurrency fraud. In a recent campaign targeting a country in the Middle East, the group compromised webmail accounts belonging to 15 government tenants. Symantec found that the espionage campaign and cryptocurrency fraud were conducted from the same control panel.\u003c/p\u003e\n\n\u003cp\u003eJewelbug gained write access to a shared webmail installation and inserted a malicious script into a common template, causing it to run on login pages and mailbox views across affected tenants. The script opened a WebSocket connection to the attackers’ command-and-control server, stole webmail cookies, and checked whether the user’s email address belonged to a targeted government domain. Valuable targets were shown a fake Adobe Flash update prompt that installed the Antino backdoor and browser tooling.\u003c/p\u003e\n\n\u003cp\u003eSymantec said Jewelbug’s victim database contained more than one million implant check-in rows, over 580,000 stolen browser cookies, several thousand captured credentials, and more than 2,300 exfiltrated email bodies. The group also used tools including XG-Web, a malicious browser extension named PDF Viewer, and a Rust-based implant called ClientKing. Its cryptocurrency fraud operation used AI-generated articles, fake crypto exchange sites, lookalike domains impersonating OKX and Binance, and click-fraud bots to drive traffic and manipulate search rankings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Jewelbug hacker group compromised webmail accounts belonging to 15 government tenants in a campaign targeting a country in the Middle East.","Symantec found that Jewelbug’s espionage campaign and cryptocurrency fraud operations were conducted from the same control panel.","Jewelbug gained write access to a shared webmail installation and inserted a malicious script into a common template, causing it to run on login pages and mailbox views across the affected tenants.","The script exfiltrated webmail cookies and checked whether users belonged to targeted government domains before showing valuable targets a fake Adobe Flash update prompt that installed the Antino backdoor and browser tooling.","Symantec said Jewelbug’s victim database contained more than one million implant check-in rows, over 580,000 stolen browser cookies, several thousand captured credentials, and more than 2,300 exfiltrated email bodies."],"insights":["A single script tag placed in a shared webmail template allowed Jewelbug to reach users across more than 15 government webmail tenants, showing how compromise of a common platform can multiply impact across many agencies.","Jewelbug’s script did not treat every webmail user the same; it checked whether the user’s email address belonged to targeted government domains before delivering the fake Adobe Flash update prompt to valuable targets.","Symantec linked espionage and cryptocurrency fraud to the same control panel, indicating that Jewelbug’s intelligence collection and profit-driven scams were operationally intertwined rather than isolated activities.","Jewelbug used public Google Docs to host obfuscated payloads retrieved and executed by its implants, helping its traffic blend in with legitimate Google services.","The group’s cryptocurrency fraud operation combined AI-generated fake download pages, lookalike domains impersonating OKX and Binance, and click-fraud bots to drive victims toward fraudulent sites."],"referencedReports":[{"title":"Jewelbug: Crypto Fraud and Espionage","url":"https://www.security.com/threat-intelligence/jewelbug-crypto-fraud-espionage","publisher":"Symantec","context":"The article cites Symantec’s research describing Jewelbug’s espionage activity, cryptocurrency fraud operations, targeting, logs, and infrastructure.","category":"research","primary":true},{"title":"Jewelbug Dossier","url":"https://sed-cms.broadcom.com/sites/default/files/2026-08/Jewelbug%20Dossier.pdf","publisher":"Symantec","context":"The article says Symantec published a detailed technical report describing Jewelbug’s tooling, tradecraft, financial operation, and attack infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eThe Jewelbug hacker group has been conducting espionage operations against governments, militaries, and critical-sector organizations while also running cryptocurrency fraud. In a recent campaign targeting a country in the Middle East, the group compromised webmail accounts belonging to 15 government tenants. Symantec found that the espionage campaign and cryptocurrency fraud were conducted from the same control panel.\u003c/p\u003e\n\n\u003cp\u003eJewelbug gained write access to a shared webmail installation and inserted a malicious script into a common template, causing it to run on login pages and mailbox views across affected tenants. The script opened a WebSocket connection to the attackers’ command-and-control server, stole webmail cookies, and checked whether the user’s email address belonged to a targeted government domain. Valuable targets were shown a fake Adobe Flash update prompt that installed the Antino backdoor and browser tooling.\u003c/p\u003e\n\n\u003cp\u003eSymantec said Jewelbug’s victim database contained more than one million implant check-in rows, over 580,000 stolen browser cookies, several thousand captured credentials, and more than 2,300 exfiltrated email bodies. The group also used tools including XG-Web, a malicious browser extension named PDF Viewer, and a Rust-based implant called ClientKing. Its cryptocurrency fraud operation used AI-generated articles, fake crypto exchange sites, lookalike domains impersonating OKX and Binance, and click-fraud bots to drive traffic and manipulate search rankings.\u003c/p\u003e\n"},{"n":5,"title":"Trezor discloses data breach affecting nearly 14,000 customers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/trezor-discloses-data-breach-affecting-nearly-14-000-customers/","time":"15:13","priority":"MUST READ","score":92,"tldr":"Trezor says nearly 14,000 customers had order details exposed after shipping partner ShipMonk was breached through a Metabase zero-day, but Trezor’s own systems and hardware wallets were not compromised. Affected customers should watch for targeted phishing using leaked names, emails, phone numbers, and addresses.","briefOverview":"\u003cp\u003eTrezor disclosed a data breach affecting nearly 14,000 customers after ShipMonk, its shipping and logistics provider, was hacked. Attackers accessed customer order data, including full names, shipping addresses, email addresses, and phone numbers. The breach affects customers in the United States, the United Kingdom, Sweden, Colombia, Brazil, Italy, and Portugal who received orders between May 10 and August 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eTrezor said 11,742 customers had full exposure of name, email, phone number, and shipping address, while 1,947 customers had partial exposure of name, city, and email. The company said its own systems were not compromised, its operations and services were not impacted, and all Trezor devices remain secure. Trezor warned affected customers that the exposed data could be used for more sophisticated phishing attempts, including fake emails, phone calls, letters, or impersonation of banks, crypto exchanges, or Trezor.\u003c/p\u003e\n\n\u003cp\u003eShipMonk told affected customers that attackers exploited a vulnerability in the third-party analytics platform Metabase to access data related to their account and customers. Metabase had previously revealed that threat actors exploited a critical SQL injection zero-day vulnerability to gain administrator access to customer instances and steal data. BleepingComputer reported that Framework and Tally also notified customers after their Metabase instances were hijacked, and it learned that ShipMonk received extortion emails from the ShinyHunters extortion gang.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trezor disclosed a data breach affecting nearly 14,000 customers after its shipping and logistics provider ShipMonk was hacked.","The exposed order data included full names, shipping addresses, email addresses, and phone numbers for some customers, while others had names, cities, and email addresses exposed.","The breach affected customers from the United States, the United Kingdom, Sweden, Colombia, Brazil, Italy, and Portugal who received orders between May 10 and August 8, 2026.","Trezor said its own systems were not compromised, its operations and services were not impacted, and all Trezor devices remain secure.","ShipMonk told affected customers that attackers exploited a vulnerability in the third-party analytics platform Metabase to access customer-related data."],"insights":["The breach creates a high-risk phishing scenario because attackers have enough personal order details to make fake emails, phone calls, and letters appear credible to Trezor customers.","The incident shows that customer data exposure can come through a chain of third parties, as Trezor customers were affected through ShipMonk and ShipMonk attributed the access to Metabase software.","Metabase-related data theft was not limited to ShipMonk, since Framework and Tally also notified customers after their Metabase instances were hijacked.","ShipMonk told customers that Metabase had patched the vulnerability and invalidated active sessions, indicating the response included both a software fix and session reset.","BleepingComputer learned that ShipMonk received extortion emails from the ShinyHunters extortion gang, adding an extortion element to the incident."],"referencedReports":[],"body":"\u003cp\u003eTrezor disclosed a data breach affecting nearly 14,000 customers after ShipMonk, its shipping and logistics provider, was hacked. Attackers accessed customer order data, including full names, shipping addresses, email addresses, and phone numbers. The breach affects customers in the United States, the United Kingdom, Sweden, Colombia, Brazil, Italy, and Portugal who received orders between May 10 and August 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eTrezor said 11,742 customers had full exposure of name, email, phone number, and shipping address, while 1,947 customers had partial exposure of name, city, and email. The company said its own systems were not compromised, its operations and services were not impacted, and all Trezor devices remain secure. Trezor warned affected customers that the exposed data could be used for more sophisticated phishing attempts, including fake emails, phone calls, letters, or impersonation of banks, crypto exchanges, or Trezor.\u003c/p\u003e\n\n\u003cp\u003eShipMonk told affected customers that attackers exploited a vulnerability in the third-party analytics platform Metabase to access data related to their account and customers. Metabase had previously revealed that threat actors exploited a critical SQL injection zero-day vulnerability to gain administrator access to customer instances and steal data. BleepingComputer reported that Framework and Tally also notified customers after their Metabase instances were hijacked, and it learned that ShipMonk received extortion emails from the ShinyHunters extortion gang.\u003c/p\u003e\n"},{"n":16,"title":"New Mirai variant adds stealth capabilities to notorious botnet code","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/new-mirai-variant-adds-stealth-to-botnet-code","time":"15:52","priority":"MUST READ","score":92,"tldr":"A new Mirai-based botnet called Evooo1Bot is actively exploiting unpatched internet-facing routers and edge devices, adding stealthier features like encrypted command-and-control, honeypot avoidance, credential sniffing, and SOCKS proxy abuse. Its proxy capability could let attackers hide their origin and use compromised devices to pivot into victim networks.","briefOverview":"\u003cp\u003eResearchers at FortiGuard Labs said a previously undocumented Linux-based malware called Evooo1Bot has been actively exploiting vulnerabilities in internet-facing hardware for at least a month. The malware is derived from the infamous Mirai botnet code and targets routers and other hardware from Alcatel, D-Link, Mitsubishi Electric, Netgear, Tenda and Telesquare. The report does not specify how many devices have been compromised, but FortiGuard Labs telemetry shows activity concentrated in North America, South America, Europe, India, China and Japan.\u003c/p\u003e\n\n\u003cp\u003eEvooo1Bot goes beyond Mirai’s usual distributed denial-of-service functions with several added capabilities. FortiGuard Labs said it uses encrypted communications with command-and-control servers, includes a scanner that looks for SSH code while skipping devices that appear to be honeypots, and has a sniffer that searches for default access credentials that were never changed. The researchers said these capabilities place Evooo1Bot well beyond the technical baseline of conventional Mirai-derived malware.\u003c/p\u003e\n\n\u003cp\u003eFortiGuard Labs described Evooo1Bot’s abuse of the SOCKS protocol as arguably its most operationally significant capability. By turning a compromised router, firewall, IP camera, or other edge device into a persistent proxy, the malware can help attackers conceal their true origin, pivot into internal networks, and conduct follow-on operations through a victim’s infrastructure. The article notes that Mirai’s source code was publicly released in 2016 and has since served as the basis for numerous variants, including Aisuru and KimWolf.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FortiGuard Labs reported that Evooo1Bot is a previously undocumented Linux-based malware variant derived from Mirai that has been actively exploiting vulnerabilities in internet-facing hardware for at least a month.","Evooo1Bot targets routers and other hardware from Alcatel, D-Link, Mitsubishi Electric, Netgear, Tenda and Telesquare.","FortiGuard Labs said its telemetry shows Evooo1Bot activity concentrated in North America, South America, Europe, India, China and Japan, but the report does not specify how many devices have been compromised worldwide.","Evooo1Bot includes capabilities beyond Mirai’s usual distributed denial-of-service functions, including encrypted command-and-control communications, SSH scanning that skips apparent honeypots, and sniffing for unchanged default access credentials.","FortiGuard Labs said Evooo1Bot’s abuse of the SOCKS protocol can turn compromised routers, firewalls, IP cameras, or other edge devices into persistent proxies that help attackers conceal their origin and pivot into internal networks."],"insights":["Evooo1Bot’s SOCKS proxy capability makes compromised edge devices useful for more than DDoS, because FortiGuard Labs said it can help attackers hide their origin and conduct follow-on operations through a victim’s infrastructure.","The malware’s scanner skips devices that appear to be honeypots, showing that this Mirai-derived variant includes measures aimed at avoiding security research and monitoring environments.","Its credential-sniffing feature makes unchanged default access credentials a directly relevant risk for affected devices, not just unpatched vulnerabilities.","The affected hardware spans several vendors and telemetry shows activity across multiple continents, indicating the campaign is not limited to a single manufacturer or region.","The article shows that Mirai’s publicly released 2016 source code continues to generate more advanced variants nearly a decade later, including Evooo1Bot as well as descendants such as Aisuru and KimWolf."],"referencedReports":[{"title":"Multi-Functional Linux Botnet Evooo1Bot","url":"https://www.fortinet.com/blog/threat-research/multi-functional-linux-botnet-evooo1bot","publisher":"FortiGuard Labs","context":"The article cites FortiGuard Labs researchers as the source for the findings on Evooo1Bot’s targets, capabilities, and activity.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at FortiGuard Labs said a previously undocumented Linux-based malware called Evooo1Bot has been actively exploiting vulnerabilities in internet-facing hardware for at least a month. The malware is derived from the infamous Mirai botnet code and targets routers and other hardware from Alcatel, D-Link, Mitsubishi Electric, Netgear, Tenda and Telesquare. The report does not specify how many devices have been compromised, but FortiGuard Labs telemetry shows activity concentrated in North America, South America, Europe, India, China and Japan.\u003c/p\u003e\n\n\u003cp\u003eEvooo1Bot goes beyond Mirai’s usual distributed denial-of-service functions with several added capabilities. FortiGuard Labs said it uses encrypted communications with command-and-control servers, includes a scanner that looks for SSH code while skipping devices that appear to be honeypots, and has a sniffer that searches for default access credentials that were never changed. The researchers said these capabilities place Evooo1Bot well beyond the technical baseline of conventional Mirai-derived malware.\u003c/p\u003e\n\n\u003cp\u003eFortiGuard Labs described Evooo1Bot’s abuse of the SOCKS protocol as arguably its most operationally significant capability. By turning a compromised router, firewall, IP camera, or other edge device into a persistent proxy, the malware can help attackers conceal their true origin, pivot into internal networks, and conduct follow-on operations through a victim’s infrastructure. The article notes that Mirai’s source code was publicly released in 2016 and has since served as the basis for numerous variants, including Aisuru and KimWolf.\u003c/p\u003e\n"},{"n":25,"title":"Armored Likho expands its cyber-espionage toolkit","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/armored-likho-still-toolkit/121033/","time":"08:00","priority":"MUST READ","score":92,"tldr":"Kaspersky researchers uncovered a new Armored Likho cyber-espionage campaign targeting Russia that uses a fake donation app to deploy the Rust-based Still Toolkit. Its new modules steal Telegram session data and perform covert audio surveillance, showing the group is expanding into a more cohesive and capable spying toolset.","briefOverview":"\u003cp\u003eIn May 2026, Kaspersky discovered a new cyber-espionage campaign by Armored Likho, also known as Eagle Werewolf, targeting private individuals and organizations in Russia. The affected sectors include major corporations, the public sector, IT, and education. The campaign begins with a fake donation service app that appears legitimate while secretly decrypting and launching the next-stage payload.\u003c/p\u003e\n\n\u003cp\u003eThe most significant finding is the Still Toolkit, a new Rust-based cyber-espionage toolkit made up of Still Sync and Still Audio. Still Sync steals Telegram session data and can use it to access the victim’s Telegram account through the Telegram API, collecting chats, media files, user details, and information about private chats, groups, and channels. Still Audio is an audio surveillance implant that detects speech, records conversations, encodes the recordings, and sends them to a command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eKaspersky attributes the campaign to Armored Likho with high confidence based on overlaps with earlier campaigns, including matching dropper architecture, shared sysmarker generation logic, reuse of an encryption algorithm and key, and similar infrastructure patterns. The attackers use domains and hosting providers that differ from the February campaign but follow similar naming patterns that mimic Windows system services and update mechanisms. Kaspersky says the new tools show the group is expanding its cyber-espionage capabilities into a cohesive tool ecosystem designed for long-term use and further expansion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky discovered a May 2026 cyber-espionage campaign by Armored Likho, also known as Eagle Werewolf, targeting private individuals and organizations in Russia, including major corporations, the public sector, IT, and education.","The campaign starts with a fake donation service app built in Rust with the Tauri framework, which displays a legitimate-looking catalog while quietly decrypting and launching the next-stage payload.","The newly identified Still Toolkit includes Still Sync, a Rust-based tool that steals Telegram session data and can use it to pull chat logs, media files, user details, and information about chats, groups, and channels through the Telegram API.","The Still Toolkit also includes Still Audio, a Rust-based audio surveillance implant that detects speech, records conversations, encodes recordings with libmp3lame, and sends them to a command-and-control server.","Kaspersky attributes the campaign to Armored Likho based on overlaps with earlier campaigns, including identical dropper architecture, matching sysmarker generation logic, shared encryption algorithm and key, and similar infrastructure patterns."],"insights":["Still Sync does not perform malicious actions until it successfully registers with its command-and-control server and retrieves settings, meaning its behavior can depend on live server-side configuration rather than only what is embedded in the sample.","Still Sync uses multiple fallback methods to access Telegram files, including abusing SeBackupPrivilege, Shadow Copy, and Robocopy in backup mode, which shows the operators designed it to keep collecting data even when normal file access fails.","Still Audio uses a GitHub-hosted dead drop as a fallback for command-and-control information after three days of server unreachability, using the same Blowfish ECB encryption algorithm and key previously seen in AquilaRAT.","The audio implant does not fully hide its microphone use from Windows settings; in the analyzed sample, IntAudio.exe appeared as “Intel Audio” in the list of apps using the microphone.","The attackers’ infrastructure avoids direct domain and IP overlap with the February campaign but still reuses hosting-provider choices and Windows-service-like domain naming patterns, which Kaspersky cites as part of the attribution picture."],"referencedReports":[{"title":"BI.ZONE February report on Armored Likho activity","url":"https://bi.zone/eng/expertise/blog/triedinoe-zlo-oborotni-atakuyut-sotrudnikov-silovykh-struktur/","publisher":"BI.ZONE","context":"The article references BI.ZONE’s February report as prior research on Armored Likho activity and malware families that overlap with the current campaign.","category":"research","primary":false}],"body":"\u003cp\u003eIn May 2026, Kaspersky discovered a new cyber-espionage campaign by Armored Likho, also known as Eagle Werewolf, targeting private individuals and organizations in Russia. The affected sectors include major corporations, the public sector, IT, and education. The campaign begins with a fake donation service app that appears legitimate while secretly decrypting and launching the next-stage payload.\u003c/p\u003e\n\n\u003cp\u003eThe most significant finding is the Still Toolkit, a new Rust-based cyber-espionage toolkit made up of Still Sync and Still Audio. Still Sync steals Telegram session data and can use it to access the victim’s Telegram account through the Telegram API, collecting chats, media files, user details, and information about private chats, groups, and channels. Still Audio is an audio surveillance implant that detects speech, records conversations, encodes the recordings, and sends them to a command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eKaspersky attributes the campaign to Armored Likho with high confidence based on overlaps with earlier campaigns, including matching dropper architecture, shared sysmarker generation logic, reuse of an encryption algorithm and key, and similar infrastructure patterns. The attackers use domains and hosting providers that differ from the February campaign but follow similar naming patterns that mimic Windows system services and update mechanisms. Kaspersky says the new tools show the group is expanding its cyber-espionage capabilities into a cohesive tool ecosystem designed for long-term use and further expansion.\u003c/p\u003e\n"},{"n":31,"title":"Potential for Remote Code Execution in Microsoft SCCM via Newly-Discovered Exploit Chain","source":"xmcyber.com","sourceColorIdx":9,"link":"https://xmcyber.com/blog/potential-for-remote-code-execution-in-microsoft-sccm-via-newly-discovered-exploit-chain/","time":"12:01","priority":"SHOULD READ","score":89,"tldr":"XM Cyber researchers found an SCCM exploit chain that can let a low-privileged domain user or Operations Administrator achieve remote code execution as SYSTEM on the primary site server. Microsoft has patched only the RBAC bypass so far, leaving parts of the chain unpatched until a planned future ConfigMgr release, so organizations should restrict AdminService access and audit SCCM roles.","briefOverview":"\u003cp\u003eXM Cyber researchers discovered a chain of vulnerabilities in Microsoft System Center Configuration Management that could be used to achieve remote code execution. The article says a standard domain user with no SCCM permissions, no admin role, and no user interaction could take advantage of the chain. The exploit targets the primary site server, which manages the entire infrastructure, and successful exploitation could grant control over the whole environment.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft assigned CVE-2026-47301 to one vulnerability in the chain and released a fix for that issue in July 2026. The article states that the rest of the chain remains unpatched, with Microsoft planning fixes in ConfigMgr 2609 in October 2026. SCCM is widely used for operating system deployment, patch management, software distribution, and compliance monitoring, and the article cites Microsoft reports of more than 100 million active users.\u003c/p\u003e\n\n\u003cp\u003eThe chain combines a missing authorization check in an AdminService upload endpoint, weak code-signing verification, a CAB extraction path traversal issue called “CabSlip,” and automatic privileged DLL loading by SMS Executive. Even after the authorization fix, users with the Operations Administrator role or Create permission on SMS_ConsoleExtensionData can still trigger the downstream chain through a different API. The article recommends monitoring AdminService.log for a System.IO.DirectoryNotFoundException followed by an HTTP 500 response, watching for unexpected changes to adsource.dll, restricting network access to the AdminService API port, and auditing SCCM role assignments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["XM Cyber researchers discovered a chain of vulnerabilities in Microsoft System Center Configuration Management that could allow remote code execution by a standard domain user with no SCCM permissions, no admin role, and no user interaction.","Microsoft assigned CVE-2026-47301 to one vulnerability in the chain and released a July 2026 fix for the broken authorization issue, but the article states that the rest of the chain remains unpatched until a planned ConfigMgr 2609 release in October 2026.","The exploit chain combines a missing authorization check in an AdminService chunked upload endpoint, weak code-signing verification, a path traversal issue in CAB extraction called “CabSlip,” and unsigned secondary DLL loading by SMS Executive.","The same downstream exploit path can still be triggered by SCCM users with the built-in Operations Administrator role or any custom role with Create permission on the SMS_ConsoleExtensionData object type.","The article recommends monitoring AdminService.log for a System.IO.DirectoryNotFoundException followed by an HTTP 500 response, watching for unexpected changes to adsource.dll, restricting network access to the AdminService API port, and auditing SCCM role assignments."],"insights":["The July 2026 fix changes the immediate risk profile: standard domain users are blocked from abusing the chunked upload endpoint, but users with the built-in Operations Administrator role can still reach the same downstream code execution path through a different upload API.","The code-signing check described in the article is weak enough that SCCM accepts a CAB signed with any standard commercially purchased code-signing certificate, rather than requiring a Microsoft or organization-specific trusted signer.","A failed cleanup operation can become a practical detection signal because the path traversal causes extracted files to land outside the expected ExpandedCab folder, leading to a System.IO.DirectoryNotFoundException followed by an HTTP 500 error in AdminService.log.","Microsoft does not support disabling SCCMProviderGraph.exe, so the article’s recommended mitigation before the full vendor fix is to restrict network access to the AdminService API port instead.","The article highlights a specific high-value file integrity target, adsource.dll, because overwriting it can lead SMS Executive to load attacker-controlled code as NT AUTHORITY\\SYSTEM."],"referencedReports":[],"body":"\u003cp\u003eXM Cyber researchers discovered a chain of vulnerabilities in Microsoft System Center Configuration Management that could be used to achieve remote code execution. The article says a standard domain user with no SCCM permissions, no admin role, and no user interaction could take advantage of the chain. The exploit targets the primary site server, which manages the entire infrastructure, and successful exploitation could grant control over the whole environment.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft assigned CVE-2026-47301 to one vulnerability in the chain and released a fix for that issue in July 2026. The article states that the rest of the chain remains unpatched, with Microsoft planning fixes in ConfigMgr 2609 in October 2026. SCCM is widely used for operating system deployment, patch management, software distribution, and compliance monitoring, and the article cites Microsoft reports of more than 100 million active users.\u003c/p\u003e\n\n\u003cp\u003eThe chain combines a missing authorization check in an AdminService upload endpoint, weak code-signing verification, a CAB extraction path traversal issue called “CabSlip,” and automatic privileged DLL loading by SMS Executive. Even after the authorization fix, users with the Operations Administrator role or Create permission on SMS_ConsoleExtensionData can still trigger the downstream chain through a different API. The article recommends monitoring AdminService.log for a System.IO.DirectoryNotFoundException followed by an HTTP 500 response, watching for unexpected changes to adsource.dll, restricting network access to the AdminService API port, and auditing SCCM role assignments.\u003c/p\u003e\n"},{"n":10,"title":"Microsoft patches LegacyHive Windows zero-day vulnerability","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-patches-legacyhive-windows-zero-day-vulnerability/","time":"17:46","priority":"SHOULD READ","score":88,"tldr":"Microsoft has officially patched the Windows LegacyHive zero-day, now tracked as CVE-2026-62832, which could let authenticated local attackers with another account’s credentials load another user’s registry hive and gain administrator privileges. Users should apply the August Patch Tuesday updates to mitigate the flaw.","briefOverview":"\u003cp\u003eMicrosoft has released security patches for a Windows zero-day vulnerability known as LegacyHive as part of its August Patch Tuesday updates. The flaw was disclosed after the July 2026 Patch Tuesday by a researcher using the handle Nightmare Eclipse, who published a proof-of-concept exploit and said it targeted the Windows User Profile Service. Microsoft now tracks the vulnerability as CVE-2026-62832, but the company tagged it as reported by an anonymous researcher.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says LegacyHive is caused by improper link resolution before file access in the Windows User Profile Service. According to Microsoft, an authenticated attacker with credentials for another local account could run a specially crafted application to load another user’s registry hive, access or modify another user’s data, and gain administrator privileges without user interaction. The article also notes that ACROS Security released free unofficial 0Patch fixes on July 20 for systems running Windows 10 2004 or later and Windows Server 2022 or later.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released security patches for the Windows zero-day vulnerability known as LegacyHive as part of its August Patch Tuesday updates.","Microsoft now tracks LegacyHive as CVE-2026-62832 and describes it as an improper link resolution before file access issue in the Windows User Profile Service.","Microsoft says an authenticated attacker with credentials for another local account could run a specially crafted application to load another user’s registry hive, access or modify that user’s data, and gain administrator privileges without user interaction.","The LegacyHive proof-of-concept exploit was published by the researcher using the handle Nightmare Eclipse shortly after the July 2026 Patch Tuesday updates.","ACROS Security released free unofficial LegacyHive patches on July 20 for systems running Windows 10 2004 or later and Windows Server 2022 or later."],"insights":["The LegacyHive exploit is harder to weaponize than some earlier Nightmare Eclipse releases because it requires additional credentials, according to the article.","Microsoft credited CVE-2026-62832 to an anonymous researcher even though the article says the flaw was publicly disclosed by Nightmare Eclipse.","Defenders using Microsoft Defender for Endpoint had detection queries available from Kevin Beaumont before Microsoft’s official patch was released.","Unofficial 0Patch fixes were available for some affected Windows versions before Microsoft issued its official August Patch Tuesday update."],"referencedReports":[{"title":"CVE-2026-62832","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-62832","publisher":"Microsoft","context":"The article links to Microsoft’s official advisory for the patched LegacyHive vulnerability now tracked as CVE-2026-62832.","category":"advisory","primary":true},{"title":"LegacyHive exploitation detection queries","url":"https://github.com/GossiTheDog/ThreatHunting/blob/master/AdvancedHuntingQueries/LegacyHive.kql","publisher":"Kevin Beaumont","context":"The article says Kevin Beaumont published Microsoft Defender for Endpoint detection queries for LegacyHive exploitation.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft has released security patches for a Windows zero-day vulnerability known as LegacyHive as part of its August Patch Tuesday updates. The flaw was disclosed after the July 2026 Patch Tuesday by a researcher using the handle Nightmare Eclipse, who published a proof-of-concept exploit and said it targeted the Windows User Profile Service. Microsoft now tracks the vulnerability as CVE-2026-62832, but the company tagged it as reported by an anonymous researcher.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says LegacyHive is caused by improper link resolution before file access in the Windows User Profile Service. According to Microsoft, an authenticated attacker with credentials for another local account could run a specially crafted application to load another user’s registry hive, access or modify another user’s data, and gain administrator privileges without user interaction. The article also notes that ACROS Security released free unofficial 0Patch fixes on July 20 for systems running Windows 10 2004 or later and Windows Server 2022 or later.\u003c/p\u003e\n"},{"n":13,"title":"Dropcatch Scavengers: Expired Malicious Domains Become Cash Cows","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/dropcatch-scavengers-expired-malicious-domains-become-cash-cows/","time":"12:58","priority":"SHOULD READ","score":88,"tldr":"Infoblox found multiple “dropcatch” threat actors buying expired malicious domains that remain embedded in compromised websites, letting them inherit victim traffic without hacking new sites. These actors monetize the traffic through scams, ad networks, and malware delivery, including SocGholish, making expired malicious domains a significant ongoing risk.","briefOverview":"\u003cp\u003eInfoblox describes a class of “dropcatch” threat actors that acquire expired malicious domains previously used in website compromise campaigns. Because those domains remain embedded in many compromised websites, visitor requests continue even after the original operators abandon them. The new owners can inherit that traffic without compromising websites themselves and redirect users to scams, unwanted content, affiliate advertising, or malware.\u003c/p\u003e\n\n\u003cp\u003eThe article profiles three actors: Stuffy Squirrel, Shady Squirrel, and Swiping Squirrel. Stuffy Squirrel hides malicious activity inside legitimate-looking scripts and monetizes traffic through affiliate advertising platforms such as ExoClick, PushHouse, and a Russian popunder network. Shady Squirrel uses referral checks, cloaking, custom injections, and Keitaro-based redirection chains, and in 2026 sent traffic to 1Win, a tech support scam actor, SocGholish, and Keitaro infrastructure. Swiping Squirrel has acquired more than 3,000 domains since 2022 and sells traffic mainly through Team Internet’s ZeroPark, where visitors may land on malware, scams, or shopping pages.\u003c/p\u003e\n\n\u003cp\u003eThe real-world impact is that tens of thousands of compromised websites can continue exposing visitors to harm long after the original malicious domains expire. Infoblox reports that Shady Squirre
