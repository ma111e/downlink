<script type="application/json" id="dl-articles">[{"n":8,"title":"Six Unpatched Danfoss Refrigeration Controller Flaws Could Allow Remote Takeover Without Login","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/six-unpatched-danfoss-refrigeration.html","time":"12:34","priority":"SHOULD READ","score":88,"tldr":"Six unpatched flaws in Danfoss AK-SM800A refrigeration controllers could allow unauthenticated remote root-level takeover, including potentially bypassing Strict mode. Operators should immediately remove management interfaces from the public internet and use protected remote access, as no fix is currently available.","briefOverview":"\u003cp\u003eMidnight Blue researchers found six unpatched flaws in Danfoss AK-SM800A refrigeration controllers that could let a remote attacker take over a device without logging in. The flaws affect firmware through version 5.3.2, and the researchers said the latest release, version 5.4.0, does not fix them. No CVE identifiers or vendor advisory for the flaws had been published, and Danfoss had not announced a fix date.\u003c/p\u003e\n\n\u003cp\u003eFive flaws are in web request handlers that run as root without requiring authentication, while the sixth affects the gateway that enforces Strict mode. Researchers said an attacker with root-level control could alter settings, trigger defrost cycles, hide activity from logs, make a controller unusable, or install code that survives factory resets and firmware updates because the devices lack secure boot. Cybersecurity agencies in Belgium, Ireland, and Germany advised operators to remove controller management interfaces from the public internet and use protected remote access, warning that updated firmware, changed default passwords, and Strict mode alone are not enough.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at Midnight Blue identified six flaws in Danfoss AK-SM800A refrigeration controllers that could allow a remote attacker to take control without logging in.","No patch has been published, and Midnight Blue said that the latest available AK-SM800A firmware, version 5.4.0, does not fix the reported flaws.","Five flaws are in unauthenticated web request handlers running as root, while a sixth affects the gateway that enforces the controller's Strict mode login protection.","Belgian, Irish, and German cybersecurity agencies advised operators to remove controller management interfaces from the public internet and use protected remote access instead.","An attacker with root-level control could alter refrigeration settings, trigger defrost cycles, conceal activity in logs, or install code that persists through a factory reset and firmware update."],"insights":["Strict mode is not sufficient protection on its own because one of the reported flaws affects the separate gateway that is meant to block unauthenticated requests; researchers caused that gateway to crash with Strict mode enabled.","The controllers lack secure boot, meaning an attacker who gains root-level control could install code that remains after both a factory reset and a firmware update.","The latest firmware release, version 5.4.0, was likely built before Midnight Blue submitted its reports, so it could not realistically contain fixes for the six newly disclosed flaws.","Danfoss's own update guide states that AK-SM800A controllers should never be directly exposed to the public internet, including when Strict mode is enabled."],"referencedReports":[{"title":"Multiple RCE Danfoss AK-SM800A","url":"https://www.midnightblue.nl/blog/multiple-rce-danfoss-aksm800a","publisher":"midnight-blue","context":"Midnight Blue's technical write-up describes the six flaws and the researchers' testing of affected firmware.","category":"research","primary":true},{"title":"Security Notice 2026-306525-1032","url":"https://www.bsi.bund.de/SharedDocs/Cybersicherheitswarnungen/DE/2026/2026-306525-1032.pdf?__blob=publicationFile\u0026v=2","publisher":"bsi","context":"Germany's BSI security notice says the AK-SM800A was involved in earlier incidents involving tampered refrigeration units.","category":"advisory","primary":false},{"title":"Warning: Six New Danfoss Vulnerabilities in Refrigeration Controllers Require Immediate Action","url":"https://ccb.belgium.be/advisories/warning-six-new-danfoss-vulnerabilities-refrigeration-controllers-risk-immediate-action","publisher":"centre-for-cybersecurity-belgium","context":"The Belgian advisory recommends removing internet exposure and using protected remote access for affected controllers.","category":"advisory","primary":true},{"title":"New Vulnerabilities in Refrigeration Controllers","url":"https://www.ncsc.gov.ie/pdfs/2611130306_New_Vulnerabilities_in_Refrigeration_Controllers.pdf","publisher":"national-cyber-security-centre-ireland","context":"Ireland's advisory recommends protected remote access, current firmware, changed default passwords, and Strict mode without relying on those measures alone.","category":"advisory","primary":true},{"title":"AK-SM 800A Update Guide","url":"https://assets.danfoss.com/documents/latest/615405/BC576633631268en-000105.pdf","publisher":"danfoss","context":"Danfoss's update guide states that AK-SM800A controllers should not be directly reachable from the public internet, including with Strict mode enabled.","category":"guide","primary":false}],"body":"\u003cp\u003eMidnight Blue researchers found six unpatched flaws in Danfoss AK-SM800A refrigeration controllers that could let a remote attacker take over a device without logging in. The flaws affect firmware through version 5.3.2, and the researchers said the latest release, version 5.4.0, does not fix them. No CVE identifiers or vendor advisory for the flaws had been published, and Danfoss had not announced a fix date.\u003c/p\u003e\n\n\u003cp\u003eFive flaws are in web request handlers that run as root without requiring authentication, while the sixth affects the gateway that enforces Strict mode. Researchers said an attacker with root-level control could alter settings, trigger defrost cycles, hide activity from logs, make a controller unusable, or install code that survives factory resets and firmware updates because the devices lack secure boot. Cybersecurity agencies in Belgium, Ireland, and Germany advised operators to remove controller management interfaces from the public internet and use protected remote access, warning that updated firmware, changed default passwords, and Strict mode alone are not enough.\u003c/p\u003e\n"},{"n":7,"title":"Retadup Worm Resurfaces 7 Years After Takedown to Spread CoffeeLoader Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/retadup-worm-resurfaces-7-years-after.html","time":"12:33","priority":"SHOULD READ","score":82,"tldr":"The Retadup USB-spreading worm has resurfaced years after its 2019 takedown, with re-registered command-and-control domains now delivering the CoffeeLoader malware loader. CoffeeLoader uses GPU-assisted packing, persistence mechanisms, and process injection to fetch and execute further payloads.","briefOverview":"\u003cp\u003eKaspersky has identified a new CoffeeLoader variant being distributed through Retadup, a Windows worm disrupted by French law enforcement in August 2019. Someone began re-registering Retadup command-and-control domains two years ago and using them to instruct infected systems to download third-party malware. The servers first delivered Armoury-packed SmokeLoader and began serving CoffeeLoader in early 2025.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain uses an NSIS installer that drops a modified 7-Zip library named \u003ccode\u003e7z.dll\u003c/code\u003e and executes it with \u003ccode\u003erundll32.exe\u003c/code\u003e. The patched library contains self-decrypting code from an updated Armoury packer, which now uses OpenGL rather than OpenCL for GPU-based decryption and delivers downloader shellcode. The downloader copies itself into ProgramData or LocalAppData, configures automatic startup through a Run registry key, injects into legitimate Windows processes, and retrieves CoffeeLoader from a hard-coded command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eCoffeeLoader can execute next-stage malware by injecting it into a process, saving and launching an executable, or saving a DLL and running it with \u003ccode\u003erundll32.exe\u003c/code\u003e. Retadup spreads via infected USB drives and has previously delivered cryptocurrency miners, Stop ransomware, and the Arkei password stealer. Kaspersky said it blocked approximately 15,000 systems from infection by the resurrected worm, with most located in Peru, Angola, Russia, and Bolivia.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified a new CoffeeLoader variant delivered through the Retadup Windows worm, whose former command-and-control domains were re-registered and used to distribute third-party malware.","The new CoffeeLoader delivery chain uses a modified 7-Zip library containing self-decrypting code from an updated Armoury packer that uses OpenGL rather than OpenCL.","The CoffeeLoader downloader establishes automatic startup through Windows registry settings, copies itself into ProgramData or LocalAppData subfolders, and injects itself into legitimate Windows processes.","After connecting to a built-in control server, CoffeeLoader can run additional software by placing it inside another process, saving and launching an executable, or saving a library and launching it with rundll32.exe.","Kaspersky said it blocked roughly 15,000 systems from the revived Retadup infections, with most affected systems in Peru, Angola, Russia, and Bolivia."],"insights":["Previously disrupted Retadup command-and-control domains became useful again after someone re-registered them, allowing commands to be issued to still-reachable infected systems years after the original takedown.","The infrastructure initially served Armoury-packed SmokeLoader and shifted to CoffeeLoader in early 2025, demonstrating a change in the malware delivered through the same Retadup servers.","The updated Armoury packer changed from using OpenCL to OpenGL for GPU-based decryption and now delivers intermediate downloader code rather than directly delivering a DLL.","CoffeeLoader’s downloader creates a registry setting intended to stop users from disabling its automatic startup through Task Manager, adding a barrier to straightforward removal."],"referencedReports":[{"title":"Retadup Delivers CoffeeLoader","url":"https://securelist.com/retadup-delivers-coffeeloader/121908/","publisher":"kaspersky","context":"The article relies on Kaspersky's technical analysis of the new CoffeeLoader variant, its Armoury packer changes, persistence, and Retadup-based distribution.","category":"research","primary":true}],"body":"\u003cp\u003eKaspersky has identified a new CoffeeLoader variant being distributed through Retadup, a Windows worm disrupted by French law enforcement in August 2019. Someone began re-registering Retadup command-and-control domains two years ago and using them to instruct infected systems to download third-party malware. The servers first delivered Armoury-packed SmokeLoader and began serving CoffeeLoader in early 2025.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain uses an NSIS installer that drops a modified 7-Zip library named \u003ccode\u003e7z.dll\u003c/code\u003e and executes it with \u003ccode\u003erundll32.exe\u003c/code\u003e. The patched library contains self-decrypting code from an updated Armoury packer, which now uses OpenGL rather than OpenCL for GPU-based decryption and delivers downloader shellcode. The downloader copies itself into ProgramData or LocalAppData, configures automatic startup through a Run registry key, injects into legitimate Windows processes, and retrieves CoffeeLoader from a hard-coded command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eCoffeeLoader can execute next-stage malware by injecting it into a process, saving and launching an executable, or saving a DLL and running it with \u003ccode\u003erundll32.exe\u003c/code\u003e. Retadup spreads via infected USB drives and has previously delivered cryptocurrency miners, Stop ransomware, and the Arkei password stealer. Kaspersky said it blocked approximately 15,000 systems from infection by the resurrected worm, with most located in Peru, Angola, Russia, and Bolivia.\u003c/p\u003e\n"},{"n":3,"title":"Australian retail giant Coles investigates cybersecurity incident","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/australian-retail-giant-coles-investigates-cybersecurity-incident/","time":"11:18","priority":"SHOULD READ","score":78,"tldr":"Australian retailer Coles is investigating a cybersecurity incident and says it has found no evidence so far that customer, employee, or supplier data was stolen. Stores, online shopping, Flybuys, and subscriptions remain operational, though some Liquorland click-and-collect customers are affected.","briefOverview":"\u003cp\u003eColes Group, Australia’s second-largest retailer, is investigating a cybersecurity incident and says it is working with external security experts to contain and secure its IT environment. The company is also coordinating with the Australian Cyber Security Centre and says it will continue engaging appropriate agencies and regulators. Coles has not disclosed when it discovered the incident, whether a ransom demand was made, or who may be responsible.\u003c/p\u003e\n\n\u003cp\u003eBased on its investigation so far, Coles says it has found no evidence that customer, employee, or supplier data was compromised or removed from its systems. Customers can continue shopping normally, and Coles stores, online outlets, Flybuys, Coles Plus, Coles Plus Delivery, and QuiteLike subscriptions have not been affected. Coles is aware of Liquorland click-and-collect issues affecting a small number of customers and has advised people to be alert for suspicious messages seeking personal information and to use strong, unique passwords.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Coles Group is investigating a cybersecurity incident and is working with the Australian Cyber Security Centre and external security experts to contain and secure its IT environment.","Coles says its investigation has not found evidence that customer, employee, or supplier data was compromised or removed from its systems.","Coles stores, online outlets, Flybuys accounts, Coles Plus, Coles Plus Delivery, and QuiteLike subscriptions have not been affected and customers can shop as normal.","Coles is aware of Liquorland click-and-collect issues affecting a small number of customers.","The company advised people to remain alert to suspicious requests for personal information and to use strong, unique passwords that are not reused across services."],"insights":["The incident has not caused a broad retail shutdown: Coles says in-store shopping, online outlets, Flybuys, and its listed subscription services continue to operate normally.","Liquorland click-and-collect is the only customer-facing service issue Coles specifically identified, and it says the problem affects only a small number of customers.","Coles has not disclosed when it discovered the incident, whether any ransom was demanded, or who may be responsible, and no major threat group has claimed it.","Coles’ warning about suspicious communications and unique passwords gives customers immediate steps to reduce the risk of scams that could follow news of the incident."],"referencedReports":[],"body":"\u003cp\u003eColes Group, Australia’s second-largest retailer, is investigating a cybersecurity incident and says it is working with external security experts to contain and secure its IT environment. The company is also coordinating with the Australian Cyber Security Centre and says it will continue engaging appropriate agencies and regulators. Coles has not disclosed when it discovered the incident, whether a ransom demand was made, or who may be responsible.\u003c/p\u003e\n\n\u003cp\u003eBased on its investigation so far, Coles says it has found no evidence that customer, employee, or supplier data was compromised or removed from its systems. Customers can continue shopping normally, and Coles stores, online outlets, Flybuys, Coles Plus, Coles Plus Delivery, and QuiteLike subscriptions have not been affected. Coles is aware of Liquorland click-and-collect issues affecting a small number of customers and has advised people to be alert for suspicious messages seeking personal information and to use strong, unique passwords.\u003c/p\u003e\n"},{"n":4,"title":"Lithuanian customs agency restores services after cyberattack, possible data breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/lithuania-customs-agency-cyberattack","time":"14:06","priority":"SHOULD READ","score":78,"tldr":"Lithuanian Customs has partially restored services after a targeted cyberattack on its BAP portal, which may have exposed personal data belonging to several hundred users and businesses. The incident also disrupted access to EU customs systems, while investigators assess whether attackers reached deeper government infrastructure.","briefOverview":"\u003cp\u003eLithuanian Customs partially restored online services after a cyberattack detected on November 10 led it to shut down its BAP user-management portal. BAP is used by individuals and businesses to access customs services and certain European Commission systems. The agency confirmed unauthorized access to the portal and said a potential personal-data breach may have affected users who logged in on November 9 or 10.\u003c/p\u003e\n\n\u003cp\u003eSeveral hundred individuals and businesses, mostly in Lithuania, may have been affected, though the agency said this does not establish that information was accessed, copied, or stolen. Potentially exposed data reportedly included names, home addresses, phone numbers, email addresses, and Lithuanian personal identification numbers. The outage disrupted access to EU customs platforms including the Import Control System 2, while customs intermediaries continued operating normally; preliminary findings indicate the attackers may have exploited a poorly secured technical function and attempted to reach more sensitive systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lithuanian Customs partially restored online services after a cyberattack detected on November 10 forced it to shut down its BAP user-management portal.","The agency confirmed unauthorized access to BAP and said users who logged in on November 9 or 10 may have been affected by a potential personal-data breach.","Several hundred individuals and businesses, mostly based in Lithuania, may have been affected, although the agency said this does not confirm that their information was accessed, copied, or stolen.","The outage disrupted access to several European Commission customs platforms, including the Import Control System 2, while services used by customs intermediaries continued operating normally.","Lithuanian Customs notified national cybersecurity and data-protection authorities as well as relevant European Union institutions, and investigators have not identified the attackers or the vulnerability used."],"insights":["The potential exposure appears limited to users who logged in to the BAP portal on November 9 or 10, rather than all Lithuanian Customs users.","The disruption fell disproportionately on individuals and smaller businesses that use BAP to reach other customs systems, while customs intermediaries continued operating normally.","Preliminary findings indicate the attackers may have used a poorly secured technical function and attempted to move beyond BAP into systems holding more sensitive information.","Lithuanian Customs restored some services through Lithuania’s electronic government portal, but digital-certificate login remained unavailable."],"referencedReports":[],"body":"\u003cp\u003eLithuanian Customs partially restored online services after a cyberattack detected on November 10 led it to shut down its BAP user-management portal. BAP is used by individuals and businesses to access customs services and certain European Commission systems. The agency confirmed unauthorized access to the portal and said a potential personal-data breach may have affected users who logged in on November 9 or 10.\u003c/p\u003e\n\n\u003cp\u003eSeveral hundred individuals and businesses, mostly in Lithuania, may have been affected, though the agency said this does not establish that information was accessed, copied, or stolen. Potentially exposed data reportedly included names, home addresses, phone numbers, email addresses, and Lithuanian personal identification numbers. The outage disrupted access to EU customs platforms including the Import Control System 2, while customs intermediaries continued operating normally; preliminary findings indicate the attackers may have exploited a poorly secured technical function and attempted to reach more sensitive systems.\u003c/p\u003e\n"},{"n":6,"title":"EU sanctions pro-Russia hackers, two dozen staff at Kremlin disinformation contractor","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-europe-sanctions-doppelganger","time":"14:15","priority":"SHOULD READ","score":78,"tldr":"The EU sanctioned Russia’s Social Design Agency, 24 staff members, six pro-Kremlin media figures, and hacktivist group NoName057(16) for disinformation, election interference, and disruptive DDoS activity targeting European infrastructure and officials.","briefOverview":"\u003cp\u003eThe European Union sanctioned 31 people and entities under its regime targeting Russian destabilization activities. The designations include the Moscow-based Social Design Agency (SDA), 24 of its employees, six pro-Kremlin commentators, and pro-Russian hacktivist group NoName057(16). The SDA had already been sanctioned over Russia’s war in Ukraine, but the new listing specifically addresses operations directed against the EU.\u003c/p\u003e\n\n\u003cp\u003eThe EU said the SDA ran the Doppelgänger campaign, including cloned news sites, Wikipedia-style platforms, and physical provocations around the 2024 European parliamentary elections. The new legal regime could give Brussels additional tools, including restrictions on transactions involving physical infrastructure such as servers and network equipment. Separately, the European Council sanctioned NoName057(16) for denial-of-service attacks against critical infrastructure and election candidates, following allegations that the group also published senior European officials’ personal data and offered cryptocurrency rewards for additional information.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Union added 31 names to its sanctions regime targeting Russian destabilization activities, including the Social Design Agency, 24 of its staff members, and six pro-Kremlin commentators.","The Social Design Agency is accused of running the Doppelgänger disinformation campaign, which the EU says cloned news websites, created Wikipedia-style platforms, and staged physical provocations around the 2024 European parliamentary elections.","The new sanctions place the Social Design Agency under a legal regime aimed at operations against the EU, which could enable restrictions on transactions involving physical infrastructure such as servers and network equipment.","The EU said major Social Design Agency foreign-interference operations require approval from Sergey Kiriyenko, with officials including Sofia Zakharova overseeing daily work.","The European Council also sanctioned the pro-Russian hacktivist group NoName057(16) over denial-of-service attacks targeting critical infrastructure and election candidates."],"insights":["Although the Social Design Agency had already been sanctioned over the war in Ukraine, its new designation under the EU’s Russian destabilization regime gives Brussels additional options, including potential restrictions on transactions involving servers and network equipment.","The EU’s listing identifies a reported management structure behind the disinformation activity, alleging that major foreign-interference operations require approval from senior Kremlin official Sergey Kiriyenko while Sofia Zakharova oversees daily work.","The sanctions extend beyond public-facing commentators to operational roles at the Social Design Agency, including caricaturists, monitors, a system administrator, and the editor of its internal Telegram-based “Pulse” network.","Most of the newly listed Social Design Agency employees had already faced sanctions elsewhere: Britain had designated 22 of them, while Canada had sanctioned two of the named media figures.","The NoName057(16) designation follows reporting that the group allegedly published European officials’ personal information on the dark web and offered cryptocurrency rewards for further information about them and their families."],"referencedReports":[{"title":"Beyond Operation Doppelgänger","url":"https://mpf.se/download/18.7cffbee41969f6d83e115221/1747230166207/Beyond%20Operation%20Doppelganger.pdf","publisher":"sweden's-psychological-defense-agency","context":"The article cites this analysis of the Social Design Agency's internal Telegram-based Pulse network for monitoring and aggregating news.","category":"research","primary":false}],"body":"\u003cp\u003eThe European Union sanctioned 31 people and entities under its regime targeting Russian destabilization activities. The designations include the Moscow-based Social Design Agency (SDA), 24 of its employees, six pro-Kremlin commentators, and pro-Russian hacktivist group NoName057(16). The SDA had already been sanctioned over Russia’s war in Ukraine, but the new listing specifically addresses operations directed against the EU.\u003c/p\u003e\n\n\u003cp\u003eThe EU said the SDA ran the Doppelgänger campaign, including cloned news sites, Wikipedia-style platforms, and physical provocations around the 2024 European parliamentary elections. The new legal regime could give Brussels additional tools, including restrictions on transactions involving physical infrastructure such as servers and network equipment. Separately, the European Council sanctioned NoName057(16) for denial-of-service attacks against critical infrastructure and election candidates, following allegations that the group also published senior European officials’ personal data and offered cryptocurrency rewards for additional information.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft: Windows Server 2016 reaches end of support in 60 days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-windows-server-2016-reaches-end-of-support-in-60-days/","time":"12:53","priority":"MAY READ","score":70,"tldr":"Windows Server 2016 will reach end of extended support on January 13, 2027, after which it will no longer receive regular security updates unless organizations enroll in Microsoft’s Extended Security Updates program. Microsoft recommends upgrading to Windows Server 2025.","briefOverview":"\u003cp\u003eMicrosoft reminded customers that all editions of Windows Server 2016 will reach the end of extended support on January 13, 2027. The January 2027 Windows security update will be the final update supplied during extended support. After that date, monthly security updates will be available only to Windows Server 2016 devices enrolled in the Extended Security Updates program.\u003c/p\u003e\n\n\u003cp\u003eThe same deadline also ends support for Windows Server 2016 Essentials features, including Remote Web Access and related Essentials-specific functionality. Microsoft advises IT administrators to move to Windows Server 2025, the latest Long-Term Servicing Channel release, and offers a free 180-day evaluation through its Evaluation Center. Windows Server 2025 reached general availability in November 2024 and is scheduled to receive mainstream support through November 2029, followed by extended support through November 14, 2034.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["All editions of Windows Server 2016 will reach the end of extended support on January 13, 2027, and the January 2027 security update will be the final update provided under that support period.","After January 13, 2027, monthly security updates for Windows Server 2016 will continue only for devices enrolled in Microsoft’s Extended Security Updates program.","Microsoft will also end support for Windows Server 2016 Essentials features, including Remote Web Access and related Essentials-specific functionality, on the same date.","Microsoft advises administrators to upgrade to Windows Server 2025, which is the latest Windows Server Long-Term Servicing Channel release.","Windows Server 2025 will receive mainstream support until November 2029 and extended support until November 14, 2034."],"insights":["Organizations have roughly two months to plan for the January 13, 2027 deadline, according to Microsoft’s reminder.","Administrators can evaluate Windows Server 2025 for 180 days at no cost through the Microsoft Evaluation Center before deploying it more broadly.","The end-of-support date affects not only Windows Server 2016 itself but also Essentials-specific capabilities such as Remote Web Access.","Windows Server 2025 offers a substantially longer support runway, with extended support scheduled through November 14, 2034."],"referencedReports":[{"title":"Windows release health message center","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#5080","publisher":"microsoft","context":"The article cites Microsoft’s message center update stating that Windows Server 2016 extended support ends on January 13, 2027 and that security updates afterward require Extended Security Updates enrollment.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft reminded customers that all editions of Windows Server 2016 will reach the end of extended support on January 13, 2027. The January 2027 Windows security update will be the final update supplied during extended support. After that date, monthly security updates will be available only to Windows Server 2016 devices enrolled in the Extended Security Updates program.\u003c/p\u003e\n\n\u003cp\u003eThe same deadline also ends support for Windows Server 2016 Essentials features, including Remote Web Access and related Essentials-specific functionality. Microsoft advises IT administrators to move to Windows Server 2025, the latest Long-Term Servicing Channel release, and offers a free 180-day evaluation through its Evaluation Center. Windows Server 2025 reached general availability in November 2024 and is scheduled to receive mainstream support through November 2029, followed by extended support through November 14, 2034.\u003c/p\u003e\n"},{"n":5,"title":"British government ‘complacent’ on cyber threats from hostile states, peers warn","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/british-government-complacent-foreign-cyber-threats","time":"14:21","priority":"MAY READ","score":68,"tldr":"A House of Lords committee warned that the UK is dangerously underprepared for cyber and other hostile-state threats from Russia, China and Iran, calling the government complacent. It said the delayed Cyber Security and Resilience Bill is too limited and urged broader regulation, stronger enforcement and greater public transparency.","briefOverview":"\u003cp\u003eA House of Lords National Resilience Committee report warned that the United Kingdom is underprepared for potentially catastrophic risks, including cyberattacks linked to Russia, China and Iran. The committee said the government appears complacent and that its legislative programme is not keeping pace with the resilience challenges identified in the inquiry. It urged the government to be more direct with the public about ongoing hostile activity, including cyberattacks, proxy violence, and threats to undersea cables and pipelines.\u003c/p\u003e\n\n\u003cp\u003eThe committee said the long-delayed Cyber Security and Resilience Bill would provide useful baseline requirements but has a limited scope and falls short of the standards needed to protect the country. It called for broader cyber security regulation and for regulators to have enough resources and capacity to enforce requirements, while noting that much of the public sector is not covered by the bill. A Government Cyber Unit official told the committee that government and public-sector organizations face critically high digital resilience risks and extremely low resilience levels, while the broader National Cyber Action Plan has also faced delays.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The House of Lords National Resilience Committee said the United Kingdom is underprepared for potentially catastrophic risks, including cyberattacks from Russia, China and Iran.","The committee said the proposed Cyber Security and Resilience Bill would establish useful baseline requirements but has a limited scope and does not provide the necessary security standards to protect the country.","The report urged ministers to broaden cyber security regulation and ensure regulators have sufficient resources and capacity to enforce requirements.","The committee said the government appears complacent and should more directly inform the public about ongoing hostile activity, including cyberattacks and threats to undersea cables and pipelines.","Government Cyber Unit deputy director Michael Brunton-Spall told the committee that the government and public sector face critically high cyber and digital resilience risks and extremely low levels of resilience."],"insights":["The Cyber Security and Resilience Bill has been in development for more than five years, yet the committee concluded that the government’s legislative timetable is not keeping pace with the risks it identified.","The proposed bill may leave much of the public sector outside its coverage, despite a Government Cyber Unit official describing public-sector resilience levels as extremely low.","Peers have already defeated the government in two House of Lords votes seeking regular assessments of whether the bill remains fit for purpose and a register of foreign states posing cyber threats.","The government’s broader National Cyber Action Plan, intended to defend the wider economy from state-backed and criminal hacking, has also been delayed and was expected by sources to be published in mid-November."],"referencedReports":[{"title":"National Resilience Committee report","url":"https://publications.parliament.uk/pa/ld5902/ldselect/ldresilience/79/79.pdf","publisher":"house-of-lords-national-resilience-committee","context":"The article is based on this committee report, which warns that the UK is underprepared for catastrophic risks including cyberattacks from hostile states.","category":"research","primary":true}],"body":"\u003cp\u003eA House of Lords National Resilience Committee report warned that the United Kingdom is underprepared for potentially catastrophic risks, including cyberattacks linked to Russia, China and Iran. The committee said the government appears complacent and that its legislative programme is not keeping pace with the resilience challenges identified in the inquiry. It urged the government to be more direct with the public about ongoing hostile activity, including cyberattacks, proxy violence, and threats to undersea cables and pipelines.\u003c/p\u003e\n\n\u003cp\u003eThe committee said the long-delayed Cyber Security and Resilience Bill would provide useful baseline requirements but has a limited scope and falls short of the standards needed to protect the country. It called for broader cyber security regulation and for regulators to have enough resources and capacity to enforce requirements, while noting that much of the public sector is not covered by the bill. A Government Cyber Unit official told the committee that government and public-sector organizations face critically high digital resilience risks and extremely low resilience levels, while the broader National Cyber Action Plan has also faced delays.\u003c/p\u003e\n"},{"n":11,"title":"Health intel-sharing group warns industry in wake of cyberattack on French blood bank","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-intel-sharing-group-warns-industry-in-wake-of-cyberattack-on-french-blood-bank/","time":"11:19","priority":"MAY READ","score":68,"tldr":"Health-ISAC warned that cyberattacks on refrigeration controllers, including an incident affecting a major French blood bank, can directly threaten patient safety by endangering stored blood, plasma, and critical therapies.","briefOverview":"\u003cp\u003eHealth-ISAC issued a security bulletin warning healthcare-industry members about a recent wave of cyberattacks targeting refrigeration controllers. The bulletin included an incident affecting a major French blood bank. The article links to NPR coverage of the incident.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, Health-ISAC’s chief security officer, said the incident demonstrates that healthcare cybersecurity is fundamentally a patient-safety issue. He noted that cold-chain storage and refrigeration units may hold donor blood, plasma, or critical therapies. According to Weiss, manipulation of this operational technology can directly endanger the physical resources required to sustain human life, rather than merely exposing data or disrupting administrative files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC issued a security bulletin warning members about a recent wave of cyberattacks targeting refrigeration controllers.","The warning cited an incident that affected a major French blood bank.","Health-ISAC Chief Security Officer Errol Weiss said that manipulating cold-chain storage and refrigeration units can endanger donor blood, plasma, and critical therapies.","Weiss characterized cybersecurity in healthcare as fundamentally a patient-safety issue because attacks on operational technology can threaten physical resources needed to sustain human life."],"insights":["The reported targeting of refrigeration controllers shows that healthcare cyber incidents can affect physical storage conditions for blood, plasma, and therapies, not only administrative records or data.","Health-ISAC framed protection of cold-chain and refrigeration equipment as a patient-safety concern because interference with those systems can jeopardize resources required for lifesaving care.","The incident affecting a major French blood bank was presented as part of a broader recent wave of attacks against refrigeration controllers."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC issued a security bulletin warning healthcare-industry members about a recent wave of cyberattacks targeting refrigeration controllers. The bulletin included an incident affecting a major French blood bank. The article links to NPR coverage of the incident.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, Health-ISAC’s chief security officer, said the incident demonstrates that healthcare cybersecurity is fundamentally a patient-safety issue. He noted that cold-chain storage and refrigeration units may hold donor blood, plasma, or critical therapies. According to Weiss, manipulation of this operational technology can directly endanger the physical resources required to sustain human life, rather than merely exposing data or disrupting administrative files.\u003c/p\u003e\n"},{"n":1,"title":"Google warns that fully-automated AI attacks are coming soon","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-warns-that-fully-automated-ai-attacks-are-coming-soon/","time":"14:00","priority":"MAY READ","score":58,"tldr":"Google says threat actors are increasingly using AI-powered multi-agent frameworks to automate vulnerability discovery and exploitation, sharply reducing defenders’ time to patch. It expects low-touch attacks within three months and sophisticated fully autonomous campaigns within six months.","briefOverview":"\u003cp\u003eGoogle Threat Intelligence Group says financially motivated and state-sponsored threat actors are increasingly using AI-powered agentic workflows to automate vulnerability discovery and exploitation. It identified use of open-source penetration-testing frameworks including CAIRN, ARTEX, CyberStrikeAI, and HexStrike AI in attacks. Google estimates that attacks requiring little to no human interaction could emerge within three months, with sophisticated fully autonomous attacks likely within six months.\u003c/p\u003e\n\n\u003cp\u003eGTIG reported that a multi-agent system called exploit_agent was used to automate the identification and exploitation of vulnerabilities against French media, entertainment, and education websites. An exposed attacker staging server hosting the framework also contained stolen victim data, reconnaissance information, webshells, and brute-forcing scripts. Google says this automation reduces the time defenders have to patch exposed systems and can also generate unreliable proof-of-concept code that defenders must assess.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes UNC6836, a cluster suspected of links to Midnight Neptune, using modified Claude Code in attacks against cryptocurrency firms in North America and Europe. Following an initial compromise, the altered application was configured to download the SOMBERMEME backdoor when launched. Google additionally reports that state-backed groups, commercial vendors, and political networks routinely use AI in influence operations, while LLMjacking has become an increasingly widespread source of costly cloud AI charges for affected organizations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google Threat Intelligence Group reported that threat actors are using AI-powered multi-agent frameworks to automate vulnerability discovery and exploitation, including without a human in the loop.","Google estimates that low-complexity attacks requiring little to no human interaction could emerge within three months, while sophisticated fully autonomous attacks may appear within six months.","GTIG identified an exposed staging server for a multi-agent framework called exploit_agent that was used to automate vulnerability discovery and exploitation against French media, entertainment, and education websites.","The FBI warned that multiple threat actors have weaponized the ARTEX AI penetration-testing framework since August to target financial, government, technology, defense, healthcare, and other sectors.","Google also observed UNC6836, a cluster suspected of links to Midnight Neptune, using modified Claude Code to download the SOMBERMEME backdoor after compromising cryptocurrency firms in North America and Europe."],"insights":["AI-assisted attacks do not need advanced software flaws to be effective: Google observed adaptive campaigns against internet-exposed systems with low-complexity weaknesses for which language models could readily create exploit code.","The exposed exploit_agent staging server contained stolen data, reconnaissance details, webshells, and brute-force scripts, showing that the automation framework was part of a broader operational environment rather than an isolated research tool.","AI-generated proof-of-concept code can create a defensive burden even when it is not usable, as hundreds of purported PHP2Shell exploits forced defenders to verify code and develop protections.","The article identifies LLMjacking as an increasingly common revenue source for attackers that can impose significant cloud AI charges on affected organizations."],"referencedReports":[{"title":"Agentic threat activity crosses a significant threshold","url":"https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold","publisher":"google-threat-intelligence-group","context":"The article cites Google’s AI Threat Tracker report for its findings on threat actors using multi-agent systems to automate vulnerability discovery and exploitation.","category":"research","primary":true}],"body":"\u003cp\u003eGoogle Threat Intelligence Group says financially motivated and state-sponsored threat actors are increasingly using AI-powered agentic workflows to automate vulnerability discovery and exploitation. It identified use of open-source penetration-testing frameworks including CAIRN, ARTEX, CyberStrikeAI, and HexStrike AI in attacks. Google estimates that attacks requiring little to no human interaction could emerge within three months, with sophisticated fully autonomous attacks likely within six months.\u003c/p\u003e\n\n\u003cp\u003eGTIG reported that a multi-agent system called exploit_agent was used to automate the identification and exploitation of vulnerabilities against French media, entertainment, and education websites. An exposed attacker staging server hosting the framework also contained stolen victim data, reconnaissance information, webshells, and brute-forcing scripts. Google says this automation reduces the time defenders have to patch exposed systems and can also generate unreliable proof-of-concept code that defenders must assess.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes UNC6836, a cluster suspected of links to Midnight Neptune, using modified Claude Code in attacks against cryptocurrency firms in North America and Europe. Following an initial compromise, the altered application was configured to download the SOMBERMEME backdoor when launched. Google additionally reports that state-backed groups, commercial vendors, and political networks routinely use AI in influence operations, while LLMjacking has become an increasingly widespread source of costly cloud AI charges for affected organizations.\u003c/p\u003e\n"},{"n":9,"title":"Tenable One Adversary View brings Claude Mythos’ adversarial reasoning to your environment","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/tenable-one-adversary-view-claude-mythos-break-attack-paths","time":"13:30","priority":"MAY READ","score":45,"tldr":"Tenable has made Adversary View generally available in Tenable One for Hexa AI users, using Claude Mythos to analyze existing scan data for attacker-style vulnerability chains and remediation choke points. It prioritizes patches and configuration changes by the number of attack paths they disrupt.","briefOverview":"\u003cp\u003eTenable One Adversary View is generally available for Tenable One customers with Tenable Hexa AI. The feature uses Claude Mythos to examine existing vulnerability scan data from an attacker’s perspective and identify chains of weaknesses across connected assets. It produces ranked attack routes, identifies chokepoints, and prioritizes repairs according to how many routes each action can block.\u003c/p\u003e\n\n\u003cp\u003eAdversary View is an on-demand, point-in-time analysis that can be scoped to all assets or narrowed by tags, IP ranges, operating systems, or business units. It builds an asset-connection map without new sensors or agents and supports each route with scan evidence such as network connections and specific CVEs. In Tenable’s example, patching two servers and blocking internet-to-internal SMB traffic closed many paths, including 32 SMB connections; users can also create Jira tickets, remediation dashboards, and PDF reports from the results.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tenable One Adversary View is generally available to Tenable One customers with Tenable Hexa AI.","Adversary View uses Claude Mythos to analyze existing vulnerability scan data and identify chains of weaknesses and routes an attacker could use through connected assets.","The feature ranks remediation actions by how many identified routes they close, rather than relying on severity ratings alone.","Users can scope an analysis to all assets or to tags, IP ranges, operating systems, or business units, and review scan evidence supporting each step of a route.","Adversary View can generate Jira tickets, remediation dashboards, and downloadable PDF reports for identified findings."],"insights":["A single firewall rule blocking internet-to-internal SMB traffic closed 32 direct connections in Tenable’s production-environment example, illustrating that one configuration change can disrupt many routes at once.","Adversary View requires no new sensors or agents because it constructs its analysis from data already collected by vulnerability scans and scan plugins.","The feature is a point-in-time investigation, while Tenable’s existing attack path analysis continuously monitors for paths based on predefined rules.","For the analysis to work on target assets, scans must have “Override normal verbosity” and “Report as much information as possible” enabled.","Each route can be supported by concrete scan evidence such as active network connections and specific CVEs, rather than only a high-level risk score."],"referencedReports":[],"body":"\u003cp\u003eTenable One Adversary View is generally available for Tenable One customers with Tenable Hexa AI. The feature uses Claude Mythos to examine existing vulnerability scan data from an attacker’s perspective and identify chains of weaknesses across connected assets. It produces ranked attack routes, identifies chokepoints, and prioritizes repairs according to how many routes each action can block.\u003c/p\u003e\n\n\u003cp\u003eAdversary View is an on-demand, point-in-time analysis that can be scoped to all assets or narrowed by tags, IP ranges, operating systems, or business units. It builds an asset-connection map without new sensors or agents and supports each route with scan evidence such as network connections and specific CVEs. In Tenable’s example, patching two servers and blocking internet-to-internal SMB traffic closed many paths, including 32 SMB connections; users can also create Jira tickets, remediation dashboards, and PDF reports from the results.\u003c/p\u003e\n"},{"n":10,"title":"16th November – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/16th-november-threat-intelligence-report/","time":"14:44","priority":"MAY READ","score":40,"tldr":"Check Point’s 16 November threat report highlights major breaches at TSMC, Maersk, Osaka and ConnectWise alongside growing AI-assisted intrusion activity. It also warns of actively exploited flaws in Check Point gateways, Microsoft Outlook and Google Chrome, urging organizations to patch exposed systems promptly.","briefOverview":"\u003cp\u003eCheck Point’s 16 November threat intelligence report covers recent breaches, AI-assisted intrusions, security fixes, and espionage activity. TSMC disclosed employee data exposure at an unnamed cloud provider, Maersk reported data theft from an acquired legacy system, and Osaka said a third-party email service compromise exposed more than one million email addresses. ConnectWise also disclosed attacks against its ScreenConnect remote-access platform that affected managed service provider environments.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights attackers’ use of AI tools, including suspected AI-generated scripts in an intrusion against a US retailer and DeepSeek- and Zhipu GLM-based agents used in campaigns against organizations in several sectors. It also describes active exploitation of PHP2Shell against unpatched Check Point Mobile Access portals, followed by privilege escalation through CVE-2026-123039 and, in some cases, wiping of VMware ESXi hosts. Microsoft, Google, and Apache released fixes for serious flaws affecting Outlook, Chrome, and Apache HTTP Server, including vulnerabilities reported as actively exploited. The report further covers CopperDragon, Shahid Kaveh/CyberAv3ngers, and Turla activity targeting government, military, telecom, critical infrastructure, and government Exchange servers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TSMC confirmed a breach at an unnamed cloud provider that exposed current and former employee information, while stating that its own systems and customer data were unaffected.","Maersk confirmed unauthorized access and data theft from a legacy system acquired through an acquisition, and the WhiteArmor group claimed to have stolen about 100 GB of information.","Researchers reported AI-assisted intrusions involving DeepSeek and Zhipu GLM agents that targeted at least 19 organizations and compromised 10 of them.","Check Point Research traced attacks exploiting PHP2Shell through unpatched Mobile Access portals on Check Point Security Gateways, followed by privilege escalation using CVE-2026-123039.","Microsoft, Google, and Apache released fixes for serious vulnerabilities, including actively exploited flaws affecting Outlook and Google Chrome."],"insights":["The Osaka incident shows how a compromise of one third-party email distribution service affected nearly 400 customers and exposed about 77 million email addresses, far beyond the more than one million addresses disclosed by the city itself.","In the suspected AI-assisted retailer intrusion, the attacker changed tactics after security tools blocked initial commands and moved from stealing SolarWinds Orion credentials to accessing another server within minutes.","The Check Point gateway attacks progressed beyond initial access: attackers used CVE-2026-123039 to gain higher privileges, maintain access, and in some cases erase a VMware ESXi host.","Check Point’s October figures found that one in every 35 enterprise GenAI prompts carried a high risk of leaking sensitive data, while reported ransomware incidents reached 1,063.","France attributed sabotage of refrigeration controllers at about 700 retail sites to an IRGC-affiliated unit, with the disruption reportedly causing food losses and fires."],"referencedReports":[{"title":"AI-Assisted Attack on a US Retailer","url":"https://www.security.com/threat-intelligence/ai-assisted-attack-us-retailer","publisher":"security.com","context":"The article cites researchers' analysis of a suspected AI-assisted intrusion that targeted a US retailer.","category":"research","primary":false},{"title":"CAIRN Framework: AI Autonomous Attacks","url":"https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/","publisher":"unit-42","context":"The article references researchers' findings on an autonomous intrusion campaign using DeepSeek and Zhipu GLM AI agents.","category":"research","primary":false},{"title":"Off the Rails: Inside an Exposed Silent Lynx Server","url":"https://www.cloudsek.com/blog/off-the-rails-inside-an-exposed-silent-lynx-server","publisher":"cloudsek","context":"The article cites research into an exposed Silent Lynx server and the group's use of a DeepSeek-powered AI agent.","category":"research","primary":false},{"title":"Russia-linked APT Turla Turned Exchange Servers Into Their Own Control Room","url":"https://securityaffairs.com/202800/apt/russia-linked-apt-turla-turned-exchange-servers-into-their-own-control-room.html","publisher":"security-affairs","context":"The article references an analysis of Turla's Cereal toolset found on compromised government Microsoft Exchange servers.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point’s 16 November threat intelligence report covers recent breaches, AI-assisted intrusions, security fixes, and espionage activity. TSMC disclosed employee data exposure at an unnamed cloud provider, Maersk reported data theft from an acquired legacy system, and Osaka said a third-party email service compromise exposed more than one million email addresses. ConnectWise also disclosed attacks against its ScreenConnect remote-access platform that affected managed service provider environments.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights attackers’ use of AI tools, including suspected AI-generated scripts in an intrusion against a US retailer and DeepSeek- and Zhipu GLM-based agents used in campaigns against organizations in several sectors. It also describes active exploitation of PHP2Shell against unpatched Check Point Mobile Access portals, followed by privilege escalation through CVE-2026-123039 and, in some cases, wiping of VMware ESXi hosts. Microsoft, Google, and Apache released fixes for serious flaws affecting Outlook, Chrome, and Apache HTTP Server, including vulnerabilities reported as actively exploited. The report further covers CopperDragon, Shahid Kaveh/CyberAv3ngers, and Turla activity targeting government, military, telecom, critical infrastructure, and government Exchange servers.\u003c/p\u003e\n"}]</script>
