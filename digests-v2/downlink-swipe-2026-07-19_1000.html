<script type="application/json" id="dl-articles">[{"n":1,"title":"The Policy PDF That Hid Its Link From Every Scanner","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/pdf-uri-annotation-redirect-m365-admin-credential-harvest","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing email that passed SPF, DKIM, and DMARC used a mostly image-based PDF with hidden URI annotations to redirect finance leaders through a compromised WordPress site toward the Microsoft 365 admin portal. The key lesson is that authenticated email and clean static file scans do not prove safety when malicious links are embedded outside readable text.","briefOverview":"\u003cp\u003eA finance team at an insurance company received a “Revised Policy” email from a life-insurance administrator they had corresponded with before. The message passed SPF, DKIM, DMARC, and Microsoft compauth checks, and its visible body contained only a corporate signature block and data-protection disclaimer. The attached scanned PDF was named \u003ccode\u003ePolicy_Revision...KY.pdf\u003c/code\u003e and was judged clean by static engines because it had no JavaScript, forms, macros, or embedded executables.\u003c/p\u003e\n\n\u003cp\u003eThe malicious element was hidden in the PDF’s URI link annotations rather than in the email body or readable PDF text. Forensic extraction found seven URI annotations, including one that redirected through a compromised WordPress site to \u003ccode\u003ehxxps://admin[.]microsoft[.]com/AdminPortal/Home?ref=Domains\u003c/code\u003e. The article says this targeted admin-tier credentials for tenant takeover, because Microsoft 365 admin access can allow control over accounts, security settings, mail-flow rules, domains, and mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe only visible text-level warning sign was a phone number in the signature block that was one digit different from the sender organization’s real published line. Themis flagged the message at 90% confidence using behavioral and contextual signals, including the low-text scanned attachment, redirecting link annotations, administrative sign-in destination, signature inconsistency, and VIP finance recipients. The message was quarantined across four affected mailboxes within minutes of delivery before anyone clicked.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A finance team at an insurance company received a “Revised Policy” email that passed SPF, DKIM, DMARC, and Microsoft compauth checks.","The attached scanned PDF was judged clean by static scanners because it contained no JavaScript, forms, macros, or embedded executables and had very little extractable text.","Forensic extraction found seven URI annotations in the PDF, including one that redirected through a compromised WordPress site to the Microsoft 365 admin sign-in portal.","The only visible text-level warning sign was a phone number in the signature block that was one digit different from the sender organization’s real published line.","Themis flagged the message at 90% confidence using behavioral and contextual signals and quarantined it across four affected mailboxes before anyone clicked."],"insights":["Passing SPF, DKIM, and DMARC can still indicate that a real authorized sender infrastructure was used, which makes authenticated mail a useful delivery path for credential harvesting rather than proof of safety.","PDF URI annotations need to be treated as links during attachment analysis because they can exist outside the readable text that many scanners inspect.","A low-text scanned PDF can be suspicious when the business context normally calls for a text-based document such as a policy, invoice, or contract.","The final destination of a redirect chain matters more than the reputation of the first domain, especially when a link resolves to an administrative sign-in surface such as the Microsoft 365 admin portal.","Out-of-band verification should use already-known contact details because even a one-digit phone-number change in a signature block can redirect a callback to an attacker."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for findings that credentials were involved in 39% of breaches and phishing was behind 16% of breaches as an initial-access vector.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references the report to support that attackers prioritize high-privilege, high-trust roles for financial and administrative reach.","category":"research","primary":false}],"body":"\u003cp\u003eA finance team at an insurance company received a “Revised Policy” email from a life-insurance administrator they had corresponded with before. The message passed SPF, DKIM, DMARC, and Microsoft compauth checks, and its visible body contained only a corporate signature block and data-protection disclaimer. The attached scanned PDF was named \u003ccode\u003ePolicy_Revision...KY.pdf\u003c/code\u003e and was judged clean by static engines because it had no JavaScript, forms, macros, or embedded executables.\u003c/p\u003e\n\n\u003cp\u003eThe malicious element was hidden in the PDF’s URI link annotations rather than in the email body or readable PDF text. Forensic extraction found seven URI annotations, including one that redirected through a compromised WordPress site to \u003ccode\u003ehxxps://admin[.]microsoft[.]com/AdminPortal/Home?ref=Domains\u003c/code\u003e. The article says this targeted admin-tier credentials for tenant takeover, because Microsoft 365 admin access can allow control over accounts, security settings, mail-flow rules, domains, and mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe only visible text-level warning sign was a phone number in the signature block that was one digit different from the sender organization’s real published line. Themis flagged the message at 90% confidence using behavioral and contextual signals, including the low-text scanned attachment, redirecting link annotations, administrative sign-in destination, signature inconsistency, and VIP finance recipients. The message was quarantined across four affected mailboxes within minutes of delivery before anyone clicked.\u003c/p\u003e\n"}]</script>
