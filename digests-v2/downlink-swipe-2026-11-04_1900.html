<script type="application/json" id="dl-articles">[{"n":2,"title":"Zyxel fixes zero-day exploited to hack nearly 1,000 network switches","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/zyxel-fixes-zero-day-exploited-to-hack-nearly-1-000-network-switches/","time":"20:58","priority":"MUST READ","score":94,"tldr":"Zyxel patched CVE-2026-107441, an actively exploited unauthenticated remote command-execution flaw in GS1900 switches that attackers used to compromise nearly 1,000 devices and steal configurations and credentials. Administrators should install the latest firmware, as prior patches for CVE-2026-7273 did not stop this separate zero-day.","briefOverview":"\u003cp\u003eZyxel has released firmware updates for CVE-2026-107441, a previously unknown flaw in the web management interface of ten GS1900 network switch models. The flaw can allow an attacker with network access to send specially crafted web requests and run commands on the device without logging in. Attackers exploited it to compromise 996 devices across 48 countries and collect device configurations, hashed root credentials, and network information.\u003c/p\u003e\n\n\u003cp\u003eThe activity was initially attributed to CVE-2026-7273, an earlier GS1900 flaw that Zyxel patched in June 2026 and that CISA added to its Known Exploited Vulnerabilities catalog. Binarly found that the recovered exploit instead targeted a separate weakness and remained effective against all firmware versions patched for CVE-2026-7273. Zyxel\u0026rsquo;s October 22 updates limit web-request parameter sizes and validate the parameter count before copying data into memory, and administrators are advised to install the latest firmware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zyxel released firmware updates on October 22 for CVE-2026-107441, an unauthenticated flaw in GS1900 switch web management interfaces that can let network-accessible attackers run operating-system commands.","GreyNoise reported that the Kapibala threat actor compromised 996 Zyxel devices across 48 countries beginning around August 17, 2026.","Attackers used the exploited flaw to run commands and download a script that collected device configurations, hashed root credentials, and network information.","The attacks were initially attributed to CVE-2026-7273, but Binarly determined that the exploit targeted the separate, previously unknown CVE-2026-107441.","Zyxel's latest firmware limits HTTP parameter sizes and checks the parameter count before copying data into memory, blocking the exploitation method described by Binarly."],"insights":["Switches that had already received Zyxel's June update for CVE-2026-7273 remained vulnerable, because the recovered exploit specifically checked for firmware versions containing that earlier fix.","The campaign was initially linked to CVE-2026-7273 and prompted a CISA Known Exploited Vulnerabilities listing, but later analysis showed attackers were exploiting a different zero-day, CVE-2026-107441.","Binarly found the exploit in an exposed, obfuscated Python archive associated with Red Heron infrastructure, rather than through Zyxel's original vulnerability disclosure process.","Zyxel's new firmware addresses both oversized HTTP parameters and validation of the parameter count before data is copied into memory, targeting the specific bypass identified by researchers."],"referencedReports":[{"title":"Zyxel Security Advisory for Out-of-Bounds Write Vulnerability in GS1900 Series Switches","url":"https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026","publisher":"zyxel","context":"Zyxel's advisory documents CVE-2026-107441 and the firmware updates released for affected GS1900 switches.","category":"advisory","primary":false},{"title":"Zyxel Security Advisory for Stack-Based Buffer Overflow Vulnerability in GS1900 Series Switches","url":"https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-stack-based-buffer-overflow-vulnerability-in-gs1900-series-switches-06-16-2026","publisher":"zyxel","context":"The article references this Zyxel advisory for the earlier CVE-2026-7273 firmware updates.","category":"advisory","primary":false},{"title":"Red Heron Exploits Gitea N-Day Flaw in Multinational Campaign Exposing New Linux Rootkit","url":"https://www.acronis.com/en/tru/posts/red-heron-exploits-gitea-n-day-flaw-in-multinational-campaign-exposing-new-linux-rootkit/","publisher":"acronis","context":"The article cites Acronis's reporting on the Red Heron campaign and its exploitation of a Gitea vulnerability.","category":"research","primary":false},{"title":"Zyxel GS1900 RCE: CVE-2026-107441","url":"http://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441","publisher":"binarly","context":"Binarly's technical analysis identified that the attacks targeted the separate CVE-2026-107441 zero-day rather than the previously patched CVE-2026-7273.","category":"research","primary":true}],"body":"\u003cp\u003eZyxel has released firmware updates for CVE-2026-107441, a previously unknown flaw in the web management interface of ten GS1900 network switch models. The flaw can allow an attacker with network access to send specially crafted web requests and run commands on the device without logging in. Attackers exploited it to compromise 996 devices across 48 countries and collect device configurations, hashed root credentials, and network information.\u003c/p\u003e\n\n\u003cp\u003eThe activity was initially attributed to CVE-2026-7273, an earlier GS1900 flaw that Zyxel patched in June 2026 and that CISA added to its Known Exploited Vulnerabilities catalog. Binarly found that the recovered exploit instead targeted a separate weakness and remained effective against all firmware versions patched for CVE-2026-7273. Zyxel\u0026rsquo;s October 22 updates limit web-request parameter sizes and validate the parameter count before copying data into memory, and administrators are advised to install the latest firmware.\u003c/p\u003e\n"},{"n":5,"title":"More Asian airlines announce data breaches after attack on Spanish IT provider Amadeus","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/asian-airlines-announce-data-breach-it-provider-incident","time":"21:30","priority":"SHOULD READ","score":84,"tldr":"A vulnerability in Amadeus’s travel booking display environment exposed customer booking data for multiple Asian airlines, affecting at least 191,000 records across Japan Airlines, Cathay Pacific, and Singapore Airlines. Exposed data included passenger names, booking references, itineraries, and in some cases passport or travel-document details, though Amadeus says no payment data was accessed.","briefOverview":"\u003cp\u003eMultiple Asian airlines reported customer-data breaches linked to a vulnerability in a travel booking display environment operated by Spanish IT provider Amadeus. Japan Airlines, Cathay Pacific, Korean Air, Asiana Airlines, Singapore Airlines, and Malaysia Airlines said they were affected. Amadeus provides reservation, ticketing, and check-in technology to hundreds of airlines and airports.\u003c/p\u003e\n\n\u003cp\u003eAmadeus said certain booking-display data was accessible through the vulnerability and that it found no evidence that payment or financial information was accessed. Japan Airlines reported 92,000 affected customers, Singapore Airlines reported 46,000 accessed records, and Cathay Pacific reported 53,000 stolen records, some of which included passport or travel-document information. Amadeus said the actors used credentials assigned to a system account, fixed the vulnerability, and added monitoring and detection measures, while the airlines said their own systems and operations were not affected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Multiple Asian airlines reported customer-data breaches linked to a vulnerability in an Amadeus travel booking display environment.","Amadeus said certain booking-display data was accessible through the vulnerability and that it found no evidence that payment or financial data was accessed.","Japan Airlines said information belonging to 92,000 customers was stolen, Singapore Airlines said 46,000 records were accessed, and Cathay Pacific said 53,000 records were stolen.","Cathay Pacific said the exposed data included booking numbers, passenger names, and flight details, while some records also contained passports or other travel documents, frequent-flyer numbers, and email addresses.","Amadeus said it fixed the vulnerability and added enhanced monitoring and detection capabilities, while the affected airlines said their own systems and operations were not impacted."],"insights":["The incident shows how a weakness in a shared travel-technology provider can affect multiple airlines at once, because Amadeus supplies reservation, ticketing, and check-in platforms to hundreds of airlines and airports.","Amadeus told affected companies that the intruders used login credentials assigned to a system account, rather than describing a direct compromise of each airline’s own systems.","Singapore Airlines planned to change exposed booking numbers for customers with upcoming flights and warned customers to watch for malicious emails, reflecting the immediate risk associated with exposed itinerary and confirmation details.","Amadeus said it found no indication that the issue was used for ransomware and no evidence that payment or financial information was accessed, despite the exposure of booking-related personal data."],"referencedReports":[],"body":"\u003cp\u003eMultiple Asian airlines reported customer-data breaches linked to a vulnerability in a travel booking display environment operated by Spanish IT provider Amadeus. Japan Airlines, Cathay Pacific, Korean Air, Asiana Airlines, Singapore Airlines, and Malaysia Airlines said they were affected. Amadeus provides reservation, ticketing, and check-in technology to hundreds of airlines and airports.\u003c/p\u003e\n\n\u003cp\u003eAmadeus said certain booking-display data was accessible through the vulnerability and that it found no evidence that payment or financial information was accessed. Japan Airlines reported 92,000 affected customers, Singapore Airlines reported 46,000 accessed records, and Cathay Pacific reported 53,000 stolen records, some of which included passport or travel-document information. Amadeus said the actors used credentials assigned to a system account, fixed the vulnerability, and added monitoring and detection measures, while the airlines said their own systems and operations were not affected.\u003c/p\u003e\n"},{"n":1,"title":"DreamHost confirms data breach exposed FTP logins and webmail sessions","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/dreamhost-confirms-data-breach-exposed-ftp-logins-and-webmail-sessions/","time":"19:05","priority":"SHOULD READ","score":78,"tldr":"DreamHost says attackers exploited its web-based File Manager from August through October 23, 2026, exposing FTP/SFTP credentials and potentially some webmail session data. The company reset affected passwords and sessions, patched the flaw, and says billing and control-panel credentials were not accessed.","briefOverview":"\u003cp\u003eDreamHost disclosed that an unauthorized third party accessed the server running its web-based File Manager at files.dreamhost.com. The intrusion lasted from approximately August 2026 until October 23, 2026, when it was discovered. According to the company, the attacker exploited a flaw in the File Manager software. DreamHost described the incident as a deliberate attack.\u003c/p\u003e\n\n\u003cp\u003eThe attacker was able to access FTP/SFTP usernames and passwords belonging to people who used the File Manager during the affected period. A limited number of users may also have had webmail session information, including credentials, exposed. DreamHost said it found no evidence that control-panel login information or billing and payment details were accessed. It has blocked the attacker, addressed the exploited flaw, ended potentially affected sessions, and invalidated passwords.\u003c/p\u003e\n\n\u003cp\u003eAffected notification recipients are advised to check website files for unauthorized changes, review webmail forwarding rules and filters, and change passwords reused on other accounts. DreamHost is offering impacted individuals one year of Equifax credit monitoring and identity theft protection. Recipients are also encouraged to consider a fraud alert or security freeze on their credit reports. DreamHost had not responded to questions about the precise number of affected accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DreamHost said an unauthorized party accessed the server running its web-based File Manager at files.dreamhost.com from approximately August 2026 through October 23, 2026.","The intruder exploited a software flaw to access FTP/SFTP usernames and passwords for people who logged into the File Manager during that period.","DreamHost said a limited number of users may also have had webmail session information, including credentials, accessed.","The company said it found no evidence that control panel login information or customer billing and payment details were accessed.","DreamHost said it blocked the intruder, fixed the exploited flaw, ended potentially affected active sessions, and invalidated passwords."],"insights":["The exposure window applies specifically to customers who logged into DreamHost’s web-based File Manager between August 2026 and October 23, 2026, rather than necessarily to every DreamHost customer.","Because some webmail session information may have been exposed, DreamHost specifically advises recipients to inspect mail forwarding rules and filters for unauthorized changes.","DreamHost invalidated passwords and ended active sessions for potentially affected users, meaning customers may need to sign in again and update any other accounts where they reused the same credentials.","The number of affected accounts has not been disclosed, despite BleepingComputer’s repeated requests for that information.","DreamHost is offering one year of Equifax credit monitoring and identity theft protection to impacted individuals, alongside recommendations to consider fraud alerts or credit freezes."],"referencedReports":[{"title":"DreamHost Data Security Breach Notice Letter","url":"https://oag.ca.gov/system/files/DreamHost%20-%20Data%20Security%20Breach%20Notice%20Letter%20%28USA%20other%20than%20MA%29%20261102.1.pdf","publisher":"dreamhost","context":"The article cites DreamHost's data breach notification for details on the File Manager intrusion, exposed credentials, and affected timeframe.","category":"advisory","primary":true}],"body":"\u003cp\u003eDreamHost disclosed that an unauthorized third party accessed the server running its web-based File Manager at files.dreamhost.com. The intrusion lasted from approximately August 2026 until October 23, 2026, when it was discovered. According to the company, the attacker exploited a flaw in the File Manager software. DreamHost described the incident as a deliberate attack.\u003c/p\u003e\n\n\u003cp\u003eThe attacker was able to access FTP/SFTP usernames and passwords belonging to people who used the File Manager during the affected period. A limited number of users may also have had webmail session information, including credentials, exposed. DreamHost said it found no evidence that control-panel login information or billing and payment details were accessed. It has blocked the attacker, addressed the exploited flaw, ended potentially affected sessions, and invalidated passwords.\u003c/p\u003e\n\n\u003cp\u003eAffected notification recipients are advised to check website files for unauthorized changes, review webmail forwarding rules and filters, and change passwords reused on other accounts. DreamHost is offering impacted individuals one year of Equifax credit monitoring and identity theft protection. Recipients are also encouraged to consider a fraud alert or security freeze on their credit reports. DreamHost had not responded to questions about the precise number of affected accounts.\u003c/p\u003e\n"},{"n":3,"title":"Vercel rolls out new protection against stolen session cookie attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/vercel-rolls-out-new-protection-against-stolen-session-cookie-attacks/","time":"21:31","priority":"MAY READ","score":72,"tldr":"Vercel is gradually deploying Device Bound Session Credentials, which bind login sessions to TPM-protected device keys so stolen cookies cannot be reused on another device. It also launched Security Review in public beta to scan GitHub code changes for issues such as exposed secrets and missing authorization checks.","briefOverview":"\u003cp\u003eVercel is gradually rolling out Device Bound Session Credentials (DBSC) for logins to vercel.com, where developers manage projects and deployments. The feature stores a private key in a device’s TPM and uses it to sign the session cookie. Vercel says that because the private key cannot be retrieved, a stolen session cookie cannot be reused on another device.\u003c/p\u003e\n\n\u003cp\u003eDBSC currently works with Chrome on macOS and Windows, though Vercel is handling OAuth application edge cases as it expands the rollout. The company is also introducing DPoP, a similar protective technology, for the Vercel CLI. Separately, Vercel launched Security Review in public beta for Pro and Enterprise teams, allowing Vercel Agent to scan code changes pushed to connected GitHub repositories for issues including exposed secrets and missing authorization checks. If permitted, the agent can validate and commit fixes; scans are free until November 10, 2026, while agent-generated fixes are billed separately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Vercel is gradually rolling out Device Bound Session Credentials for vercel.com logins, tying sessions to a private key stored in a user device’s TPM.","The feature is intended to prevent stolen session cookies from being reused on another device, and currently works in Chrome on macOS and Windows.","Vercel is also rolling out DPoP, a similar protective technology, for its Vercel CLI.","Vercel launched Security Review in public beta for Pro and Enterprise teams, using Vercel Agent to scan code changes on pushes to connected GitHub repositories.","Security Review can flag missing authorization checks and exposed secrets, and Vercel says scans are free until November 10, 2026 while agent-generated fixes are billed separately."],"insights":["Device Bound Session Credentials add protection even when browser cookie theft succeeds, because a stolen cookie cannot be used from a different device without the device-bound private key.","Vercel is rolling out the login protection gradually because OAuth application edge cases still need to be handled appropriately.","Security Review can do more than identify issues: when permissions allow, Vercel Agent can validate and commit fixes, although those agent-generated fixes are billed separately.","Vercel’s recent focus on identifying exposed secrets is notable because attackers in its April breach viewed environment variables that had not been marked as sensitive."],"referencedReports":[],"body":"\u003cp\u003eVercel is gradually rolling out Device Bound Session Credentials (DBSC) for logins to vercel.com, where developers manage projects and deployments. The feature stores a private key in a device’s TPM and uses it to sign the session cookie. Vercel says that because the private key cannot be retrieved, a stolen session cookie cannot be reused on another device.\u003c/p\u003e\n\n\u003cp\u003eDBSC currently works with Chrome on macOS and Windows, though Vercel is handling OAuth application edge cases as it expands the rollout. The company is also introducing DPoP, a similar protective technology, for the Vercel CLI. Separately, Vercel launched Security Review in public beta for Pro and Enterprise teams, allowing Vercel Agent to scan code changes pushed to connected GitHub repositories for issues including exposed secrets and missing authorization checks. If permitted, the agent can validate and commit fixes; scans are free until November 10, 2026, while agent-generated fixes are billed separately.\u003c/p\u003e\n"},{"n":4,"title":"Canadian extradited to US for allegedly hacking schools in at least four states","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/canadian-nationals-accused-us-education-hacks-cryptomining","time":"19:17","priority":"MAY READ","score":68,"tldr":"A Canadian man was extradited to the U.S. to face charges that he and another Canadian allegedly hacked educational institutions in four states from 2016 to 2019, stealing credentials and installing cryptomining software. U.S. authorities are still seeking the co-defendant’s extradition from Canada.","briefOverview":"\u003cp\u003eThe U.S. Department of Justice indicted Canadian nationals Ryan James Roach and Mathiew James Stubbings for allegedly conducting a hacking campaign against U.S. educational institutions between June 2016 and December 2019. Roach was arrested and extradited from Canada and appeared in federal court in Rochester, New York. U.S. authorities are still seeking Stubbings’ extradition through Canadian court proceedings.\u003c/p\u003e\n\n\u003cp\u003eProsecutors allege the pair stole login credentials and installed cryptocurrency-mining software on compromised computers at educational institutions in New York, Tennessee, North Carolina, and Massachusetts. They allegedly focused on institutions with supercomputers, researched weaknesses in their networks, and used servers in several European countries and previously compromised computers to conceal their identities. At their peak, the indictments state that 10 computers were running the mining software, and each defendant faces charges carrying a maximum sentence of 10 years in prison.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Department of Justice charged Canadian nationals Ryan James Roach and Mathiew James Stubbings over an alleged 2016–2019 campaign targeting educational institutions.","Roach was arrested in Canada, extradited to the United States, and appeared in federal court in Rochester, New York, while U.S. authorities are still pursuing Stubbings’ extradition.","Prosecutors allege the pair stole login credentials, used servers in several European countries to conceal their identities, and installed cryptocurrency-mining software on compromised computers.","The alleged targets included educational institutions in New York, Tennessee, North Carolina, and Massachusetts, particularly those with supercomputers.","Both defendants face charges carrying a maximum penalty of 10 years in prison."],"insights":["The alleged operators specifically sought out U.S. educational institutions with supercomputers, indicating that high-capacity research systems were a focus of the campaign.","Prosecutors say the pair used servers in several European countries as well as computers previously compromised from another victim to hide their identities.","Despite the multi-year campaign, the indictments say the operation peaked at 10 computers running cryptocurrency-mining software.","The case reflects increased international cooperation on cybercrime extraditions, with one defendant already transferred from Canada and proceedings continuing for the other."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. Department of Justice indicted Canadian nationals Ryan James Roach and Mathiew James Stubbings for allegedly conducting a hacking campaign against U.S. educational institutions between June 2016 and December 2019. Roach was arrested and extradited from Canada and appeared in federal court in Rochester, New York. U.S. authorities are still seeking Stubbings’ extradition through Canadian court proceedings.\u003c/p\u003e\n\n\u003cp\u003eProsecutors allege the pair stole login credentials and installed cryptocurrency-mining software on compromised computers at educational institutions in New York, Tennessee, North Carolina, and Massachusetts. They allegedly focused on institutions with supercomputers, researched weaknesses in their networks, and used servers in several European countries and previously compromised computers to conceal their identities. At their peak, the indictments state that 10 computers were running the mining software, and each defendant faces charges carrying a maximum sentence of 10 years in prison.\u003c/p\u003e\n"},{"n":6,"title":"Surviving cybersecurity until the end of 2026","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/cybersecurity-surviving-vulnerabilities-malware-best-practices","time":"21:06","priority":"MAY READ","score":55,"tldr":"Organizations should assume that developer laptops, vendors, packages, and CI systems will eventually be compromised, then limit the damage through short-lived credentials, tight access controls, dependency and vendor hygiene, reduced internet exposure, and continuous testing.","briefOverview":"\u003cp\u003eRecent incidents cited by the article include a developer laptop linked to the largest theft in crypto history at Binance, poisoned LiteLLM packages on PyPI, PHP2Shell and Node2Shell affecting PHP and Node.js, and eMudhra private keys that could be recovered in seconds. The article argues that these incidents used familiar techniques, but attackers moved quickly and the time between a disclosure and exploitation is shrinking. It recommends that teams assume a laptop, vendor, package, or CI runner will eventually be compromised. The resulting damage depends on how far an attacker can move from that initial point.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends making stolen credentials less useful through short-lived access, limited permissions, multi-factor authentication, and reviews of issued keys and tokens. It also calls for managing inherited code with minimal and hardened container images, dependency tracking, internal mirrors, support for end-of-life dependencies, and rapid patching of critical issues. Organizations should inventory vendors, integrations, internet-facing systems, and software on user devices, then remove or restrict anything unnecessary. Finally, teams should use attack-surface monitoring, recurring external network tests, continuous application testing, and breach exercises to find and contain weaknesses before attackers do.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Recent incidents involving a developer laptop, compromised PyPI packages, PHP2Shell, Node2Shell, and eMudhra demonstrate that familiar techniques can cause severe damage and that exploitation can follow disclosures quickly.","Organizations should assume that a laptop, vendor, package, or CI runner will eventually be compromised and focus on limiting how far an attacker can move from that initial compromise.","Short-lived credentials, tightly limited permissions, multi-factor authentication, and regular credential audits can reduce the impact of stolen tokens and keys.","Teams should track and patch open-source dependencies, use minimal and hardened container images where appropriate, and remove unsupported or unused software.","Organizations should inventory their internet-exposed services and vendors, remove unnecessary access and integrations, control software installed on user machines, and routinely test their defenses through attack-surface monitoring, network testing, and breach exercises."],"insights":["A minimum package-age delay of at least 48 hours can reduce exposure to malicious npm and PyPI releases because the article states that many malicious packages are detected within hours.","Auto-shutting down non-production computing resources when they are not needed reduces both the number of systems attackers can reach and operating costs.","Security logs from identity providers, cloud platforms, source control, and CI systems should be stored where production credentials cannot delete them.","Browser extensions, IDE extensions, MCP servers, and AI tools should be included in device software inventories because they can create access paths into important systems.","Vendor management should cover not only paid providers but also open-source maintainers, plugins, integrations, and dependencies that run within an organization’s environment."],"referencedReports":[],"body":"\u003cp\u003eRecent incidents cited by the article include a developer laptop linked to the largest theft in crypto history at Binance, poisoned LiteLLM packages on PyPI, PHP2Shell and Node2Shell affecting PHP and Node.js, and eMudhra private keys that could be recovered in seconds. The article argues that these incidents used familiar techniques, but attackers moved quickly and the time between a disclosure and exploitation is shrinking. It recommends that teams assume a laptop, vendor, package, or CI runner will eventually be compromised. The resulting damage depends on how far an attacker can move from that initial point.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends making stolen credentials less useful through short-lived access, limited permissions, multi-factor authentication, and reviews of issued keys and tokens. It also calls for managing inherited code with minimal and hardened container images, dependency tracking, internal mirrors, support for end-of-life dependencies, and rapid patching of critical issues. Organizations should inventory vendors, integrations, internet-facing systems, and software on user devices, then remove or restrict anything unnecessary. Finally, teams should use attack-surface monitoring, recurring external network tests, continuous application testing, and breach exercises to find and contain weaknesses before attackers do.\u003c/p\u003e\n"}]</script>
