<script type="application/json" id="dl-articles">[{"n":1,"title":"Update now: 7-Zip fixes RCE flaw exploitable with malicious archives","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/update-now-7-zip-fixes-rce-flaw-exploitable-with-malicious-archives/","time":"19:32","priority":"MUST READ","score":91,"tldr":"7-Zip 26.02 fixes a remote code execution flaw in its XZ decompression handling that could be triggered by a malicious archive. Because 7-Zip does not auto-update, users should manually install the latest version from the official site.","briefOverview":"\u003cp\u003e7-Zip version 26.02 was released to fix a remote code execution vulnerability that could allow attackers to execute malicious code if users open specially crafted compressed files. The flaw was disclosed by Lunbun researcher Landon Peng and exists in 7-Zip\u0026rsquo;s processing of XZ-compressed data. According to a Zero Day Initiative advisory, specially crafted XZ data can trigger a heap-based buffer overflow and potentially allow arbitrary code execution as the user.\u003c/p\u003e\n\n\u003cp\u003eThe developer has not published technical details about the flaw, but the 26.02 source code changes suggest it is related to how 7-Zip tracks available space while decompressing XZ data. The patch adds checks to ensure the decoder cannot write beyond the remaining available space in an output buffer. The advisory says exploitation requires user interaction, such as visiting a malicious page or opening a malicious archive file.\u003c/p\u003e\n\n\u003cp\u003e7-Zip does not include an automatic update feature, so users must manually download the latest version from 7-zip.org to receive the fix. The article notes that 7-Zip is widely used on Windows and that flaws in archive utilities can be attractive to threat actors. There are currently no reports that attackers are actively exploiting this newly disclosed vulnerability, but users are advised to update to version 26.02 as soon as possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["7-Zip version 26.02 was released to fix a remote code execution vulnerability in the program’s processing of XZ-compressed data.","The Zero Day Initiative advisory says specially crafted XZ data can trigger a heap-based buffer overflow that may allow attackers to execute arbitrary code as the user.","Exploitation requires user interaction, such as visiting a malicious page or opening a malicious archive file.","7-Zip does not include an automatic update feature, so users must manually download and install the latest version from 7-zip.org.","There are currently no reports that attackers are actively exploiting this newly disclosed 7-Zip vulnerability."],"insights":["The lack of an automatic update feature makes this fix especially actionable because vulnerable users will remain exposed unless they manually install 7-Zip 26.02 from the official site.","Although the developer has not published technical details, the source code changes indicate the fix centers on preventing the XZ decoder from writing past the remaining output buffer space.","The article highlights archive-file flaws as a practical threat because attackers have previously exploited 7-Zip and WinRAR vulnerabilities through phishing or social engineering campaigns.","The absence of current exploitation reports does not remove the risk, since 7-Zip’s widespread Windows usage makes its archive-handling flaws attractive targets for future attacks."],"referencedReports":[{"title":"ZDI-26-444","url":"https://www.zerodayinitiative.com/advisories/ZDI-26-444/","publisher":"Zero Day Initiative","context":"The article cites this advisory for details that specially crafted XZ data can trigger a heap-based buffer overflow and potentially allow arbitrary code execution as the user.","category":"","primary":false}],"body":"\u003cp\u003e7-Zip version 26.02 was released to fix a remote code execution vulnerability that could allow attackers to execute malicious code if users open specially crafted compressed files. The flaw was disclosed by Lunbun researcher Landon Peng and exists in 7-Zip\u0026rsquo;s processing of XZ-compressed data. According to a Zero Day Initiative advisory, specially crafted XZ data can trigger a heap-based buffer overflow and potentially allow arbitrary code execution as the user.\u003c/p\u003e\n\n\u003cp\u003eThe developer has not published technical details about the flaw, but the 26.02 source code changes suggest it is related to how 7-Zip tracks available space while decompressing XZ data. The patch adds checks to ensure the decoder cannot write beyond the remaining available space in an output buffer. The advisory says exploitation requires user interaction, such as visiting a malicious page or opening a malicious archive file.\u003c/p\u003e\n\n\u003cp\u003e7-Zip does not include an automatic update feature, so users must manually download the latest version from 7-zip.org to receive the fix. The article notes that 7-Zip is widely used on Windows and that flaws in archive utilities can be attractive to threat actors. There are currently no reports that attackers are actively exploiting this newly disclosed vulnerability, but users are advised to update to version 26.02 as soon as possible.\u003c/p\u003e\n"}]</script>
