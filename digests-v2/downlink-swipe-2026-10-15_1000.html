<script type="application/json" id="dl-articles">[{"n":4,"title":"ADINT: Weaponized Ad Tech for Zero-Click Spyware and Mass Identity Vacuuming","source":"blog.confiant.com","sourceColorIdx":8,"link":"https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming","time":"10:03","priority":"MUST READ","score":94,"tldr":"Confiant found that Discover-Tech allegedly weaponized its large ad-tech footprint to collect cookies and device identities at internet scale, then selectively deliver encrypted, remotely controlled JavaScript through infrastructure attributed by Citizen Lab to Candiru. The operation appears designed for stealthy ADINT surveillance and potential zero-click spyware staging rather than ordinary advertising or financially motivated malvertising.","briefOverview":"\u003cp\u003eConfiant reported that Discover-Tech used its advertising infrastructure to deliver heavily obfuscated JavaScript that collected device, network, and behavioral data and communicated with an operator-controlled command server. Some ad traffic was handed to CloudFront infrastructure that Citizen Lab attributed to mercenary spyware company Candiru. Confiant said the activity differed from typical financially motivated malvertising because it used sophisticated encryption, covert communications, selective code delivery, and little visible user-facing behavior.\u003c/p\u003e\n\n\u003cp\u003eThe analyzed code could fingerprint browsers and devices, track interactions such as mouse movements, typing, scrolling, and page visibility, and decrypt code received from the operator for execution with \u003ccode\u003enew Function(...)\u003c/code\u003e. Confiant also observed Discover-Tech creatives collecting accessible first-party cookies and high-entropy browser information, including on more than 1,000 publisher domains where cookies could contain analytics IDs, advertising IDs, session identifiers, and sometimes personal data in tokens. Discover-Tech activity was observed in 228 countries and on sensitive organizational networks, while its infrastructure was estimated to serve about 10 million ad impressions daily and operate cookie-matching systems producing billions of audience touch-points per month.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Confiant reported that Discover-Tech’s ad-serving infrastructure delivered encrypted JavaScript through small hidden frames and handed some traffic to CloudFront infrastructure that Citizen Lab attributed to Candiru.","The analyzed JavaScript fingerprinted devices and network capabilities, monitored user interactions, contacted a command server for instructions, and could decrypt and execute code supplied by the operator.","Confiant observed Discover-Tech ad code sending browser cookies, high-detail browser and device information, and other identity fields to Discover-Tech-controlled endpoints; on shared publisher pages, this could include non-HttpOnly first-party cookies.","Confiant estimated that Discover-Tech served roughly 10 million ad impressions per day and said its cookie-matching infrastructure generated billions of audience touch-points per month across tens of thousands of websites.","Discover-Tech ads were observed in 228 countries and on networks associated with government, research, education, health, defense, judicial, security, and international organizations."],"insights":["The analyzed payload used two separate encryption schemes: an ECDH-derived secret to decrypt operator-supplied code and a fresh AES key wrapped with an RSA public key to protect collected results from parties in the advertising chain.","Discover-Tech’s code read and transmitted the entire accessible first-party cookie jar before loading the next JavaScript stage, and Confiant observed this at scale on more than 1,000 publisher domains.","The SDK’s DNS-over-HTTPS helper resolved an operator-chosen domain and then contacted its IP address directly, meaning the destination would not appear as a plaintext DNS request or connection hostname.","The Candiru-attributed ad handoffs were low-volume, with hundreds to low thousands of impressions per day, while Discover-Tech’s broader infrastructure was estimated to serve about 10 million impressions daily.","Confiant found that Discover-Tech, Adtimizer, and Tekma infrastructure shared the same AWS load balancer and that Discover-Tech’s website, DSP domain, and Tekma site carried the same Wix account UUID."],"referencedReports":[{"title":"How Discover-Tech Turned Targeted Ads Into a Pipeline for Spyware","url":"https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/","publisher":"the-citizen-lab","context":"The article cites Citizen Lab’s concurrent investigation for high-confidence attribution of delivery infrastructure to Candiru.","category":"research","primary":true},{"title":"Strategic Web Compromises in the Middle East With PinchDuke and Candiru","url":"https://www.welivesecurity.com/2021/11/16/strategic-web-compromises-middle-east-pinch-candiru/","publisher":"eset","context":"The article references ESET’s analysis of a Candiru-attributed JavaScript payload as evidence of similar tradecraft, including a Google copyright decoy.","category":"research","primary":false},{"title":"Sold to the Highest Bidder: The Escalation of ADINT From Geolocation Tracking to Intrusion Vector","url":"https://www.sekoia.com/blog/sold-to-the-highest-bidder-the-escalation-of-adint-from-geolocation-tracking-to-intrusion-vector","publisher":"sekoia","context":"The article links Sekoia’s research when discussing Intelos and its ADINT-focused capabilities.","category":"research","primary":false}],"body":"\u003cp\u003eConfiant reported that Discover-Tech used its advertising infrastructure to deliver heavily obfuscated JavaScript that collected device, network, and behavioral data and communicated with an operator-controlled command server. Some ad traffic was handed to CloudFront infrastructure that Citizen Lab attributed to mercenary spyware company Candiru. Confiant said the activity differed from typical financially motivated malvertising because it used sophisticated encryption, covert communications, selective code delivery, and little visible user-facing behavior.\u003c/p\u003e\n\n\u003cp\u003eThe analyzed code could fingerprint browsers and devices, track interactions such as mouse movements, typing, scrolling, and page visibility, and decrypt code received from the operator for execution with \u003ccode\u003enew Function(...)\u003c/code\u003e. Confiant also observed Discover-Tech creatives collecting accessible first-party cookies and high-entropy browser information, including on more than 1,000 publisher domains where cookies could contain analytics IDs, advertising IDs, session identifiers, and sometimes personal data in tokens. Discover-Tech activity was observed in 228 countries and on sensitive organizational networks, while its infrastructure was estimated to serve about 10 million ad impressions daily and operate cookie-matching systems producing billions of audience touch-points per month.\u003c/p\u003e\n"},{"n":8,"title":"Drupal Patches Critical Core RCE Flaw with No-Login Path via Contributed Modules","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/drupal-patches-critical-core-rce-flaw.html","time":"12:07","priority":"MUST READ","score":94,"tldr":"Drupal released critical security updates for a Field UI remote code execution flaw (CVE-2026-108097) that contributed modules or custom code can expose without login. Sites should upgrade to supported fixed releases immediately or temporarily uninstall Field UI; the Entity List module requires a separate update for a similar RCE flaw.","briefOverview":"\u003cp\u003eDrupal released critical security updates on October 14 for CVE-2026-108097, a flaw in the core Field UI module that could allow code to run on a website’s server. Drupal said core alone does not provide a path to the flaw, but contributed modules or custom code can expose it, including at least one known path that does not require a login. Fixed versions are Drupal 11.4.10, 11.3.19, and 10.6.19, while end-of-life branches such as Drupal 11.2.x and below and 10.5.x and below received no fix.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurred because Field UI ran a callable supplied in a table row’s \u003ccode\u003e#region_callback\u003c/code\u003e property without checking it, bypassing wider renderer restrictions on untrusted callbacks. The update removes that callback execution and instead reads the row’s region value directly; custom code that relied on \u003ccode\u003e#region_callback\u003c/code\u003e will no longer run. Sites unable to update can temporarily uninstall Field UI, though this removes administrative pages for managing fields and displays, while Drupal Steward blocks only some known attack paths. Drupal also issued a separate critical RCE advisory for the Entity List module, CVE-2026-108099, which requires its own update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Drupal released updates on October 14 for CVE-2026-108097, a critical Field UI flaw that can allow code execution on a site server through contributed modules or custom code.","The advisory states that Drupal core alone does not provide a path to the flaw, but at least one known contributed-module path does not require a login.","Affected supported branches should update to Drupal 11.4.10, 11.3.19, or 10.6.19, while sites unable to update can temporarily uninstall the Field UI module.","Drupal also issued a separate critical advisory for the Entity List module, CVE-2026-108099, and updating Drupal core does not update that module.","The same Drupal core releases fix two moderately critical cross-site scripting flaws in the Link and Navigation modules that require at least a logged-in user."],"insights":["The unsafe behavior had existed in Field UI code since at least Drupal 8.9.0, despite Drupal’s general renderer restrictions on untrusted callbacks that were introduced in 2019.","The flaw bypassed Drupal’s existing callback safeguards because Field UI’s trusted table-rendering step separately executed a callback supplied by each table row without validating it.","Uninstalling Field UI is an official temporary mitigation, but it disables the administrative pages used to manage fields and their display.","Drupal Steward blocks some known attack paths, but Drupal explicitly says it does not cover every possible path and does not replace updating.","More than 151,000 reporting Drupal sites were on affected branches that received no fix, because those branches were already end of life."],"referencedReports":[{"title":"SA-CORE-2026-014: Drupal core critical remote code execution vulnerability","url":"https://www.drupal.org/sa-core-2026-014","publisher":"drupal-security-team","context":"The article relies on this Drupal Security Team advisory for the Field UI remote code execution flaw, affected versions, mitigations, and update guidance.","category":"advisory","primary":true},{"title":"SA-CONTRIB-2026-218: Entity List critical remote code execution vulnerability","url":"https://www.drupal.org/sa-contrib-2026-218","publisher":"drupal-security-team","context":"The article cites this separate advisory for the Entity List module flaw, CVE-2026-108099.","category":"advisory","primary":false},{"title":"SA-CORE-2026-015: Link module cross-site scripting vulnerability","url":"https://www.drupal.org/sa-core-2026-015","publisher":"drupal-security-team","context":"The article references this advisory as covering one of two moderately critical cross-site scripting flaws fixed in the same core releases.","category":"advisory","primary":false},{"title":"SA-CORE-2026-016: Navigation module cross-site scripting vulnerability","url":"https://www.drupal.org/sa-core-2026-016","publisher":"drupal-security-team","context":"The article references this advisory as covering the Navigation module cross-site scripting flaw fixed in the same core releases.","category":"advisory","primary":false}],"body":"\u003cp\u003eDrupal released critical security updates on October 14 for CVE-2026-108097, a flaw in the core Field UI module that could allow code to run on a website’s server. Drupal said core alone does not provide a path to the flaw, but contributed modules or custom code can expose it, including at least one known path that does not require a login. Fixed versions are Drupal 11.4.10, 11.3.19, and 10.6.19, while end-of-life branches such as Drupal 11.2.x and below and 10.5.x and below received no fix.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurred because Field UI ran a callable supplied in a table row’s \u003ccode\u003e#region_callback\u003c/code\u003e property without checking it, bypassing wider renderer restrictions on untrusted callbacks. The update removes that callback execution and instead reads the row’s region value directly; custom code that relied on \u003ccode\u003e#region_callback\u003c/code\u003e will no longer run. Sites unable to update can temporarily uninstall Field UI, though this removes administrative pages for managing fields and displays, while Drupal Steward blocks only some known attack paths. Drupal also issued a separate critical RCE advisory for the Entity List module, CVE-2026-108099, which requires its own update.\u003c/p\u003e\n"},{"n":3,"title":"Inside Help TDS: Hotejka, Cloudflare Pages, and Predictive Detection","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/inside-help-tds-hotejka-cloudflare-pages-and-predictive-detection/","time":"13:00","priority":"SHOULD READ","score":84,"tldr":"Infoblox links the long-running Help TDS tech-support-scam operation to the Russian-language Hotejka/ROI777 affiliate program, which routes traffic from compromised sites, spam, and ads into browser-lock scams that persuade victims to install remote-access software. The group uses thousands of disposable Cloudflare Pages domains, but Infoblox says it can now predict many of those domains roughly seven days before they are deployed.","briefOverview":"\u003cp\u003eInfoblox assesses that Hotejka, a Russian-language affiliate program, operates the long-running Help Traffic Distribution System (TDS) and is a rebrand of ROI777. Help TDS receives traffic from affiliates using compromised websites, malvertising, spam, social-media posts, and other sources, then evaluates visitors by browser fingerprint and location. Selected users see alarming fake Microsoft warnings and browser locks that direct them to phone numbers for purported technical support. In a recorded call, an operator instructed researchers to download UltraViewer, a remote desktop tool that would provide full access to the computer.\u003c/p\u003e\n\n\u003cp\u003eSince April 2026, the operation has used disposable Cloudflare Pages domains, announcing nearly 300 new pages per day through a Telegram channel and creating thousands more. Infoblox says it observed more than 20,000 such domains in six months and developed detections that identified likely Hotejka domains about seven days before they were used. The company reported that more than 16,000 predicted domains were later used for Help TDS through mid-September, reducing exposure among its cloud customers from as much as 4% on a single day to around 0.5%. The article also describes affiliate code that retrieves current scam domains from Telegram or a backup JSON source, limits lures to U.S. business hours, and can display fake CAPTCHA or update-required prompts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox assesses that the Russian-language Hotejka affiliate program operates Help TDS and is a rebrand of the previously exposed ROI777 operation.","Help TDS directs traffic from sources including compromised websites, malvertising, social-media posts, and spam to fake Microsoft browser-lock pages that prompt users to call scam call centers.","During a recorded call-center interaction, an operator claiming to be Microsoft Technical Support instructed the researchers to download UltraViewer remote desktop software.","Since April 2026, Help TDS has used free Cloudflare Pages sites and announced nearly 300 new Cloudflare Pages domains daily through a Telegram channel.","Infoblox reported detecting likely Help TDS Cloudflare Pages domains about seven days before their use and identified more than 16,000 domains later used for the TDS through mid-September."],"insights":["The Hotejka affiliate code checks a Telegram channel for the current command domain, falls back to a JSON source, caches the result for 30 seconds, and only shows its lures during U.S. business hours calculated from Moscow time.","Hotejka’s use of multiple domain-naming patterns on Cloudflare Pages still produced detectable fingerprints, allowing Infoblox to identify likely domains before the operator announced them for affiliate use.","The operator appears to create substantially more Cloudflare Pages domains than it announces for Help TDS, with roughly 30,000 detected domains but only about 16,000 announced through its Telegram channel; some unannounced sites displayed decoy advertising or fake financial-app content.","A DNS CNAME setup let affiliates route visitors through Hotejka-controlled infrastructure without using Help TDS directly, and one observed chain began with a parked domain and ultimately reached a tech-support-scam page.","The article reports that the same Cloudflare Pages domain was sometimes reused weeks later with different nameservers, which may reflect either domain-generation collisions or an effort to make domains appear established before scam use."],"referencedReports":[{"title":"Help TDS: Malicious Plugins Redirect Tech Support Scams","url":"https://www.godaddy.com/resources/news/help-tds-malicious-plugins-redirect-tech-support-scams","publisher":"godaddy","context":"The article cites GoDaddy’s documentation of the malicious WordPress plugin distributed to Help TDS affiliates.","category":"research","primary":false},{"title":"Operation Prowli: Traffic Manipulation, Cryptocurrency Mining and More","url":"https://www.akamai.com/blog/security/operation-prowli-traffic-manipulation-cryptocurrency-mining","publisher":"akamai","context":"The article references an Akamai report describing 40,000 compromised machines that sent traffic to the ROI777/Help TDS infrastructure.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox assesses that Hotejka, a Russian-language affiliate program, operates the long-running Help Traffic Distribution System (TDS) and is a rebrand of ROI777. Help TDS receives traffic from affiliates using compromised websites, malvertising, spam, social-media posts, and other sources, then evaluates visitors by browser fingerprint and location. Selected users see alarming fake Microsoft warnings and browser locks that direct them to phone numbers for purported technical support. In a recorded call, an operator instructed researchers to download UltraViewer, a remote desktop tool that would provide full access to the computer.\u003c/p\u003e\n\n\u003cp\u003eSince April 2026, the operation has used disposable Cloudflare Pages domains, announcing nearly 300 new pages per day through a Telegram channel and creating thousands more. Infoblox says it observed more than 20,000 such domains in six months and developed detections that identified likely Hotejka domains about seven days before they were used. The company reported that more than 16,000 predicted domains were later used for Help TDS through mid-September, reducing exposure among its cloud customers from as much as 4% on a single day to around 0.5%. The article also describes affiliate code that retrieves current scam domains from Telegram or a backup JSON source, limits lures to U.S. business hours, and can display fake CAPTCHA or update-required prompts.\u003c/p\u003e\n"},{"n":5,"title":"India Mandates Registered Caller Name Display on 4G and Newer Networks From November 1","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/india-mandates-registered-caller-name.html","time":"10:42","priority":"SHOULD READ","score":78,"tldr":"India will require telecom providers to display the registered name associated with incoming domestic calls on 4G and newer networks starting November 1, 2026, to help combat spam and fraud. The name will come from carrier subscriber records when the number is not saved in the recipient’s contacts, while international calls will be labeled accordingly.","briefOverview":"\u003cp\u003eIndia’s Department of Telecommunications has directed telecom service providers to implement Calling Name Presentation (CNAP) for incoming calls on 4G and newer wireless networks beginning November 1, 2026. The service will display a caller’s registered name alongside their phone number to help recipients identify unknown callers and address spam or fraudulent calls. The directive does not yet apply to 2G, 3G, or public switched telephone networks, which will be considered separately.\u003c/p\u003e\n\n\u003cp\u003eWhen a caller’s number is already stored in a recipient’s contacts, the saved contact name will be shown. For unsaved domestic numbers, providers will display the name recorded in the originating provider’s subscriber database, while calls from outside India will be labeled “International Call.” Providers must maintain name-to-number databases, avoid retaining caller-name information after the incoming call ends, and offer callers an option to hide their identity; eligible business and bulk-connection users may instead display a documented preferred trade or trademark name.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["India has directed telecom service providers to display callers’ registered names alongside incoming phone numbers on 4G and newer networks starting November 1, 2026.","For numbers not saved in a recipient’s contacts, domestic calls will display the caller name recorded in the originating telecom provider’s subscriber database, while calls from outside India will be labeled “International Call.”","The Calling Name Presentation rollout does not yet cover 2G, 3G, or public switched telephone networks, which will be considered separately.","Telecom providers must maintain subscriber name-to-number databases, support efficient name queries, avoid retaining the caller name after an incoming call ends, and provide an option for callers to hide their identity.","Business or bulk-connection users may use a preferred name if it is a registered trademark or a trade name registered on the Goods and Services Tax portal."],"insights":["The displayed name for an unknown domestic caller will come from the telecom provider’s subscriber records rather than a crowd-sourced caller-identification database.","The government requires providers not to retain the caller-name information after an incoming call ends, making temporary handling of this data an explicit design requirement.","Business and bulk-connection users can replace their subscriber-record name with a preferred name, but only when it is supported by a registered trademark or a Goods and Services Tax portal trade-name record.","Calls originating outside India will not display an individual caller name under the stated rules; recipients will instead see the label “International Call.”"],"referencedReports":[{"title":"Calling Name Presentation Service Circular","url":"https://www.dot.gov.in/static/uploads/2026/10/d86da4092d50f052becd6113de83d37e.pdf","publisher":"Indian Ministry of Communications","context":"The article cites this October 13, 2026 circular as the source of the requirements for telecom providers to implement Calling Name Presentation.","category":"advisory","primary":true}],"body":"\u003cp\u003eIndia’s Department of Telecommunications has directed telecom service providers to implement Calling Name Presentation (CNAP) for incoming calls on 4G and newer wireless networks beginning November 1, 2026. The service will display a caller’s registered name alongside their phone number to help recipients identify unknown callers and address spam or fraudulent calls. The directive does not yet apply to 2G, 3G, or public switched telephone networks, which will be considered separately.\u003c/p\u003e\n\n\u003cp\u003eWhen a caller’s number is already stored in a recipient’s contacts, the saved contact name will be shown. For unsaved domestic numbers, providers will display the name recorded in the originating provider’s subscriber database, while calls from outside India will be labeled “International Call.” Providers must maintain name-to-number databases, avoid retaining caller-name information after the incoming call ends, and offer callers an option to hide their identity; eligible business and bulk-connection users may instead display a documented preferred trade or trademark name.\u003c/p\u003e\n"},{"n":9,"title":"The Trello Invite Whose Subject Line the Attacker Wrote","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/trello-invite-attacker-written-subject-board-name-proton-inviter","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"An attacker used a genuine Trello invitation, authenticated by Trello’s SPF, DKIM, and DMARC controls, to impersonate a bank CEO through attacker-controlled display-name and board-title fields. Defenders should inspect the platform-displayed inviter email address in the message body, not just the legitimate SaaS sender address.","briefOverview":"\u003cp\u003eAn attacker registered a Trello account with a Proton Mail address, used a display name resembling a digital bank’s CEO, and created a board titled “(Attention Needed) Confidential Executive Review: Regulation - Sanction - Compliance.” Trello then sent a genuine board invitation to a bank employee from its legitimate infrastructure. The subject line combined the attacker-controlled display name and board title, making the message appear to be an urgent executive request. The original invitation reached one employee and forwarded copies reached three others.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, and DMARC checks for trello.com, and all 16 links led to Trello, Atlassian, or related legitimate pages. However, Trello’s invitation body also printed the actual inviter address, \u003ccode\u003eaccount.board.review+[bank name]@proton[.]me\u003c/code\u003e, beside the borrowed executive identity. The article recommends treating SaaS invitation display names and titles as potentially attacker-controlled and checking the platform-displayed inviter address instead. It also recommends alerting on internal executive names and mathematical Unicode characters in SaaS notification display names, and searching for the inviter’s base address without its plus-address tag.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker created a Trello account using a Proton Mail address, set its display name to resemble a digital bank’s CEO, and created a board with an urgent compliance-themed title.","Trello sent the invitation from its legitimate infrastructure, and the message passed SPF, DKIM, and DMARC checks for trello.com.","The invitation body displayed the Proton Mail address of the actual Trello inviter alongside the impersonated executive name.","All links in the message pointed to Trello, Atlassian identity, tracking, or social-media pages, and the article reports no attachment, QR code, or confirmed board contents.","The article recommends treating SaaS notification display names and titles as attacker-controlled content and verifying the platform-displayed inviter address."],"insights":["A message can pass SPF, DKIM, and DMARC because the SaaS platform genuinely sent it, while its most persuasive text was supplied by the attacker through profile and board-name fields.","For SaaS invitations, the visible From address may only identify the platform; the platform-printed inviter address inside the message can be the more useful identity field to verify.","The Proton Mail plus-address tag matched the target bank’s name, and the article notes that searching for the base address without the plus tag may reveal other activity using the same mailbox.","Unicode Mathematical Bold Script characters in a job title can make attacker-entered text look like intentional branding, and the article recommends flagging mathematical alphanumeric characters in SaaS notification display names."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites this report for its statement that pretexting accounts for 6% of initial access vectors.","category":"research","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references this report to note that business email compromise remains among the costliest complaint categories.","category":"research","primary":false},{"title":"Cost of a Data Breach Report 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"ibm","context":"The article cites this report regarding phishing as a common and expensive initial vector.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references this report for its observation of increased abuse of legitimate cloud services.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA guidance emphasizing out-of-band identity verification.","category":"guide","primary":false}],"body":"\u003cp\u003eAn attacker registered a Trello account with a Proton Mail address, used a display name resembling a digital bank’s CEO, and created a board titled “(Attention Needed) Confidential Executive Review: Regulation - Sanction - Compliance.” Trello then sent a genuine board invitation to a bank employee from its legitimate infrastructure. The subject line combined the attacker-controlled display name and board title, making the message appear to be an urgent executive request. The original invitation reached one employee and forwarded copies reached three others.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, and DMARC checks for trello.com, and all 16 links led to Trello, Atlassian, or related legitimate pages. However, Trello’s invitation body also printed the actual inviter address, \u003ccode\u003eaccount.board.review+[bank name]@proton[.]me\u003c/code\u003e, beside the borrowed executive identity. The article recommends treating SaaS invitation display names and titles as potentially attacker-controlled and checking the platform-displayed inviter address instead. It also recommends alerting on internal executive names and mathematical Unicode characters in SaaS notification display names, and searching for the inviter’s base address without its plus-address tag.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft: Windows Server 2022 reached end of mainstream support","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-windows-server-2022-reached-end-of-mainstream-support/","time":"13:18","priority":"MAY READ","score":72,"tldr":"Windows Server 2022 reached end of mainstream support on October 13, 2026, but will continue receiving free monthly security updates under extended support through October 14, 2031. Microsoft recommends planning an upgrade to Windows Server 2025 for full mainstream support.","briefOverview":"\u003cp\u003eMicrosoft announced that Windows Server 2022 reached the end of mainstream support on October 13, 2026. The October 2026 security update was the last update issued under mainstream support. Windows Server 2022 was released as a Long-Term Servicing Channel version and will remain in extended support through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eDuring extended support, Windows Server 2022 will continue to receive monthly security updates at no additional cost. Microsoft also extended hotpatching through October 2027 for systems running Windows Server 2022 Datacenter: Azure Edition. The company advises administrators to plan an upgrade to Windows Server 2025, which has mainstream support until November 2029 and extended support until November 14, 2034.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Windows Server 2022 reached the end of mainstream support on October 13, 2026, and its October 2026 security update was the last mainstream-support update.","Windows Server 2022 will receive free monthly security updates during extended support through October 14, 2031.","Microsoft extended hotpatching for Windows Server 2022 Datacenter: Azure Edition through October 2027.","Microsoft recommends that administrators plan an upgrade to Windows Server 2025, which has mainstream support until November 2029 and extended support until November 14, 2034."],"insights":["The end of mainstream support does not immediately end security protection for Windows Server 2022, because Microsoft will continue providing monthly security updates at no additional cost through October 14, 2031.","Organizations using the Datacenter: Azure Edition have an additional operational option: hotpatching is available through October 2027, one year beyond the mainstream-support end date.","Administrators can test Windows Server 2025 before deployment using Microsoft’s free 180-day evaluation version."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft announced that Windows Server 2022 reached the end of mainstream support on October 13, 2026. The October 2026 security update was the last update issued under mainstream support. Windows Server 2022 was released as a Long-Term Servicing Channel version and will remain in extended support through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eDuring extended support, Windows Server 2022 will continue to receive monthly security updates at no additional cost. Microsoft also extended hotpatching through October 2027 for systems running Windows Server 2022 Datacenter: Azure Edition. The company advises administrators to plan an upgrade to Windows Server 2025, which has mainstream support until November 2029 and extended support until November 14, 2034.\u003c/p\u003e\n"},{"n":1,"title":"Police arrests 95 suspects in international CSAM crackdown action","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-arrests-95-suspects-in-child-sexual-abuse-material-crackdown/","time":"11:55","priority":"MAY READ","score":65,"tldr":"An INTERPOL-coordinated operation across 17 Latin American and European countries arrested 95 suspects accused of distributing child sexual abuse material through online messaging groups. Investigators executed 127 search warrants, rescued a five-year-old victim, and expect seized evidence to identify more offenders and children at risk.","briefOverview":"\u003cp\u003eINTERPOL coordinated International Effort Confluencia, a series of four law-enforcement operations conducted from March through September 2026 across 17 countries in Latin America and Europe. Authorities arrested 95 suspects accused of distributing child sexual abuse material through online messaging groups and executed 127 search warrants. The operation also rescued a five-year-old victim whose parent had allegedly produced and sold abuse material online.\u003c/p\u003e\n\n\u003cp\u003eInvestigators reported cases in several countries, including an Ecuadorian suspect found with approximately 15GB of abuse images and more than 4,000 files. In Panama, authorities arrested an administrator of a group with more than 700 users, while an Argentine suspect was accused of sextorting minors after allegedly threatening girls who refused requests for increasingly explicit content. INTERPOL said the messaging platforms were used to groom children, coordinate abuse, connect offenders, accept payment for illegal content, and recirculate material, which continues to victimize the children depicted.\u003c/p\u003e\n\n\u003cp\u003eINTERPOL expects material seized during the investigation to help identify further offenders and children at risk, enabling additional safeguarding action. The article also notes related international enforcement activity, including Operation Cumberland arrests tied to AI-generated abuse material, the 2025 Kidflix takedown, and Operation Alice\u0026rsquo;s shutdown of more than 373,000 dark-web sites offering fake abuse-material packages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An INTERPOL-coordinated operation involving authorities from 17 countries in Latin America and Europe arrested 95 suspects accused of distributing child sexual abuse material through online messaging groups.","International Effort Confluencia included four law enforcement operations between March and September 2026, during which investigators executed 127 search warrants.","Authorities rescued a five-year-old victim whose parent had allegedly been producing and selling child sexual abuse material online.","Ecuadorian authorities found a suspected group member with about 15GB of abuse images and more than 4,000 files, while Panamanian investigators arrested an administrator of a group with more than 700 users.","INTERPOL said that material seized in the investigation is expected to help identify additional offenders and children at risk."],"insights":["The operation shows that online messaging groups can serve several roles at once: grooming children, coordinating abuse, connecting offenders, taking payments, and redistributing illegal material.","The reported cases ranged from possession of thousands of files to administration of a group with more than 700 users, illustrating the scale that a single participant or group administrator can reach.","The Argentina case highlights that online coercion can escalate when a suspect allegedly threatens minors who refuse requests for increasingly explicit material.","Seized material is expected to support follow-on safeguarding work by helping investigators identify both additional suspects and children who may be at risk."],"referencedReports":[],"body":"\u003cp\u003eINTERPOL coordinated International Effort Confluencia, a series of four law-enforcement operations conducted from March through September 2026 across 17 countries in Latin America and Europe. Authorities arrested 95 suspects accused of distributing child sexual abuse material through online messaging groups and executed 127 search warrants. The operation also rescued a five-year-old victim whose parent had allegedly produced and sold abuse material online.\u003c/p\u003e\n\n\u003cp\u003eInvestigators reported cases in several countries, including an Ecuadorian suspect found with approximately 15GB of abuse images and more than 4,000 files. In Panama, authorities arrested an administrator of a group with more than 700 users, while an Argentine suspect was accused of sextorting minors after allegedly threatening girls who refused requests for increasingly explicit content. INTERPOL said the messaging platforms were used to groom children, coordinate abuse, connect offenders, accept payment for illegal content, and recirculate material, which continues to victimize the children depicted.\u003c/p\u003e\n\n\u003cp\u003eINTERPOL expects material seized during the investigation to help identify further offenders and children at risk, enabling additional safeguarding action. The article also notes related international enforcement activity, including Operation Cumberland arrests tied to AI-generated abuse material, the 2025 Kidflix takedown, and Operation Alice\u0026rsquo;s shutdown of more than 373,000 dark-web sites offering fake abuse-material packages.\u003c/p\u003e\n"},{"n":12,"title":"Silent Push 6.1 Enhances Brand and Infrastructure Impersonation","source":"digitalitnews.com","sourceColorIdx":6,"link":"https://digitalitnews.com/silent-push-6-1-enhances-brand-and-infrastructure-impersonation/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=silent-push-6-1-enhances-brand-and-infrastructure-impersonation","time":"13:43","priority":"MAY READ","score":64,"tldr":"Silent Push 6.1 adds automated brand and infrastructure impersonation detection to identify and prioritize look-alike domains before they are used in phishing campaigns. The release also expands analyst workflows through XSOAR, browser, AI/MCP, and bidirectional TAXII integrations.","briefOverview":"\u003cp\u003eSilent Push announced version 6.1 of its preemptive cyber defense platform, centered on a rebuilt and automated Brand and Infrastructure Impersonation capability. The feature continuously searches for look-alike domains and reports findings to customers. Silent Push said the capability is intended to identify impersonation activity before a phishing email is sent or a look-alike domain is used.\u003c/p\u003e\n\n\u003cp\u003eThe platform scores suspicious domains by risk and adds registrar and hosting information, groups activity by threat actor, and can export evidence for takedown efforts. Version 6.1 also adds expanded investigation functions, including searches across domains, IP addresses, ASNs, subnets, and HTML titles, as well as passive DNS timelines, IP certificates, screenshot date filtering, and PDF export. Integrations include Palo Alto Cortex XSOAR, a Chrome extension, an MCP server for AI assistants and agentic workflows, and an updated TAXII server that supports two-way threat-intelligence sharing.\u003c/p\u003e\n\n\u003cp\u003eSilent Push 6.1 also introduces My Assets, which allows users to create reusable lists of owned domains, IP ranges, ASNs, and top-level domains. Custom analyst reports now support TLP: AMBER+STRICT to limit distribution of subscription-based intelligence to intended recipients. The interface is available in English, Korean, and Spanish, with Japanese planned shortly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push launched version 6.1 of its preemptive cyber defense platform with a rebuilt, automated Brand and Infrastructure Impersonation capability.","The new impersonation engine continuously identifies look-alike domains, assigns risk scores, adds registrar and hosting information, groups related activity by threat actor, and exports evidence for takedown efforts.","Silent Push 6.1 adds investigation features including expanded searches for domains, IP addresses, ASNs, subnets, and HTML titles, along with passive DNS timelines and certificate information.","The release integrates Silent Push intelligence with Palo Alto Cortex XSOAR, a Chrome extension, AI assistants through an MCP server, and bidirectional threat-intelligence sharing through its updated TAXII server.","The interface is now available in Korean and Spanish as well as English, with Japanese planned shortly."],"insights":["The article frames brand impersonation as a security-operations intelligence requirement rather than solely a marketing issue, emphasizing the need to identify malicious domains and phishing assets before they are used.","Silent Push says its detection approach uses information from attackers’ own infrastructure to identify impostor domains before the domains are used against customers.","The updated TAXII server supports two-way intelligence sharing, allowing organizations to both receive and share threat information through STIX/TAXII.","TLP: AMBER+STRICT support allows custom analyst reports containing subscription-based intelligence to be restricted to intended organizations and individuals.","The My Assets feature lets teams maintain reusable, tagged lists of their own domains, IP ranges, ASNs, and top-level domains for use throughout the platform."],"referencedReports":[],"body":"\u003cp\u003eSilent Push announced version 6.1 of its preemptive cyber defense platform, centered on a rebuilt and automated Brand and Infrastructure Impersonation capability. The feature continuously searches for look-alike domains and reports findings to customers. Silent Push said the capability is intended to identify impersonation activity before a phishing email is sent or a look-alike domain is used.\u003c/p\u003e\n\n\u003cp\u003eThe platform scores suspicious domains by risk and adds registrar and hosting information, groups activity by threat actor, and can export evidence for takedown efforts. Version 6.1 also adds expanded investigation functions, including searches across domains, IP addresses, ASNs, subnets, and HTML titles, as well as passive DNS timelines, IP certificates, screenshot date filtering, and PDF export. Integrations include Palo Alto Cortex XSOAR, a Chrome extension, an MCP server for AI assistants and agentic workflows, and an updated TAXII server that supports two-way threat-intelligence sharing.\u003c/p\u003e\n\n\u003cp\u003eSilent Push 6.1 also introduces My Assets, which allows users to create reusable lists of owned domains, IP ranges, ASNs, and top-level domains. Custom analyst reports now support TLP: AMBER+STRICT to limit distribution of subscription-based intelligence to intended recipients. The interface is available in English, Korean, and Spanish, with Japanese planned shortly.\u003c/p\u003e\n"},{"n":13,"title":"AI Security Starts with Visibility Into Your SaaS Environment","source":"appomni.com","sourceColorIdx":0,"link":"https://appomni.com/blog/ai-security-and-visibility-in-saas-environments/","time":"12:00","priority":"MAY READ","score":45,"tldr":"AI security in SaaS starts with visibility into every agent’s owner, identity, data access, connected tools, and permitted actions. Apply least privilege, Zero Trust, continuous monitoring, and runtime safeguards such as prompt-injection defenses and approvals for high-impact actions.","briefOverview":"\u003cp\u003eAI assistants and agents are now used in SaaS workflows to pull together updates, summarize support cases, read customer records, and update tickets. The article argues that security teams need visibility into the data these agents can access, the identities or accounts they use, their connected tools, and the actions they are allowed to perform. An agent may operate through delegated user access or a non-human identity such as a service account, making its permissions part of the SaaS attack surface.\u003c/p\u003e\n\n\u003cp\u003eAn actionable inventory should connect every agent to an accountable owner, its business purpose, reachable data, permitted actions, tools and destinations, and activity records. The article recommends applying least privilege, checking authority at each action, and continuously monitoring for changes in access, group membership, sharing, connected tools, and configurations. For consequential actions, such as changing access settings or sending sensitive information externally, organizations should consider explicit human approval.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that agents can encounter malicious instructions hidden in documents or support tickets, potentially causing them to act beyond their intended task. It recommends layered safeguards such as checking inputs, inspecting outputs for sensitive data, limiting tools, enforcing permissions through the applications the agent uses, and maintaining a tested way to pause a workflow or revoke access. Teams can start by tracing agents in core SaaS or AI applications that hold important data, then prioritize workflows with sensitive data, broad permissions, or the ability to make consequential changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI agents in SaaS applications may act through a user’s access or through a service account, allowing them to retrieve documents, change records, call connected tools, or trigger workflows.","An effective AI-agent inventory should identify each agent’s business owner, intended task, access identity, reachable data, permitted actions, connected tools, and available activity records.","Organizations should apply least privilege by limiting an agent’s access to the specific data and actions needed for its assigned task, including reviewing the service accounts and repositories it uses.","For high-impact actions such as changing access settings or sending sensitive information outside the organization, teams should consider requiring explicit human approval.","AI agents can be manipulated by malicious instructions embedded in documents or support tickets, so workflows may need input checks, output inspection, restricted tools, and a tested process to pause or revoke access."],"insights":["An AI agent can appear narrowly configured for a task while still having broad real-world authority through an overly privileged service account or permissively shared repository.","A prompt that tells an agent to stay within its purpose does not alter the underlying permissions available through the applications and accounts it uses.","Limited platform logs and configuration visibility are themselves a security finding that can justify limiting or deferring higher-risk AI workflows.","Measuring the number of AI agents alone does not demonstrate reduced risk; more useful measures include named owners, removed excess permissions, monitored activity, and tested access-revocation procedures.","Security reviews should follow an agent’s complete workflow from the initial request through connected tools to the final output, rather than assessing the agent in isolation."],"referencedReports":[],"body":"\u003cp\u003eAI assistants and agents are now used in SaaS workflows to pull together updates, summarize support cases, read customer records, and update tickets. The article argues that security teams need visibility into the data these agents can access, the identities or accounts they use, their connected tools, and the actions they are allowed to perform. An agent may operate through delegated user access or a non-human identity such as a service account, making its permissions part of the SaaS attack surface.\u003c/p\u003e\n\n\u003cp\u003eAn actionable inventory should connect every agent to an accountable owner, its business purpose, reachable data, permitted actions, tools and destinations, and activity records. The article recommends applying least privilege, checking authority at each action, and continuously monitoring for changes in access, group membership, sharing, connected tools, and configurations. For consequential actions, such as changing access settings or sending sensitive information externally, organizations should consider explicit human approval.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that agents can encounter malicious instructions hidden in documents or support tickets, potentially causing them to act beyond their intended task. It recommends layered safeguards such as checking inputs, inspecting outputs for sensitive data, limiting tools, enforcing permissions through the applications the agent uses, and maintaining a tested way to pause a workflow or revoke access. Teams can start by tracing agents in core SaaS or AI applications that hold important data, then prioritize workflows with sensitive data, broad permissions, or the ability to make consequential changes.\u003c/p\u003e\n"},{"n":6,"title":"Why AI Confidence Is Not Validation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/why-ai-confidence-is-not-validation.html","time":"11:04","priority":"MAY READ","score":42,"tldr":"AI-generated findings in digital forensics and incident response are not validation: practitioners must independently verify evidence, document the exact tools and versions used, and retain human authority over irreversible or legally consequential actions. SANS advocates separate AI governance frameworks for forensics and incident response because their speed and evidentiary-risk requirements differ.","briefOverview":"\u003cp\u003eAI is already used in digital forensics and incident response, but the article argues that confidence in an AI output is not proof that it is correct. SANS introduced separate Digital Forensics \u0026amp; AI Investigations and Incident Response \u0026amp; AI Investigations frameworks, mapped to SWGDE standards and the NIST Cybersecurity Framework 2.0. Both frameworks maintain that AI may accelerate work, but human examiners remain the final authority.\u003c/p\u003e\n\n\u003cp\u003eFor forensic work, AI findings must be checked against the original source files, and investigators should document the tool involved and, for general-purpose models, its exact version. The article distinguishes incident response, where validated AI can support faster triage and containment under human monitoring, from forensics, where every source file requires validation and findings may later be scrutinized in reports, depositions, or court. It recommends that AI automate reversible actions such as hash verification but not independently make irreversible or legally consequential decisions, including evidence collection or collecting cloud data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI confidence scores do not validate investigative findings, which must be independently confirmed against the original source files and evidence.","SANS created separate Digital Forensics \u0026 AI Investigations and Incident Response \u0026 AI Investigations frameworks, mapped respectively to SWGDE standards and the NIST Cybersecurity Framework 2.0.","Investigators should document the tool that produced an AI-assisted finding, and record the precise version when using a general-purpose model because capabilities change over time.","Incident response can allow more AI-assisted speed during active events when tools have been built and validated, while digital forensics requires validation of every source file.","AI should not make irreversible decisions such as collecting cloud data, choosing an acquisition approach, or deploying tools to capture activity across systems; human practitioners remain responsible for those choices."],"insights":["Many examiners may already rely on AI-derived confidence scores through built-in functions such as skin detection, facial similarity, and image categorization, even if they say they do not use AI.","Recording an AI model’s exact version is important because technology may change substantially between an investigation and later testimony, allowing legal challenges to claims about what the tool could do at the time.","The article offers a practical boundary for AI use: it can automate reversible tasks such as hash verification, but it should not independently take actions that cannot be undone, including collecting cloud data.","During a live incident, requiring human approval for every AI-recommended action can overwhelm analysts; continuous human monitoring can be workable when the organization has built and validated the AI tooling."],"referencedReports":[],"body":"\u003cp\u003eAI is already used in digital forensics and incident response, but the article argues that confidence in an AI output is not proof that it is correct. SANS introduced separate Digital Forensics \u0026amp; AI Investigations and Incident Response \u0026amp; AI Investigations frameworks, mapped to SWGDE standards and the NIST Cybersecurity Framework 2.0. Both frameworks maintain that AI may accelerate work, but human examiners remain the final authority.\u003c/p\u003e\n\n\u003cp\u003eFor forensic work, AI findings must be checked against the original source files, and investigators should document the tool involved and, for general-purpose models, its exact version. The article distinguishes incident response, where validated AI can support faster triage and containment under human monitoring, from forensics, where every source file requires validation and findings may later be scrutinized in reports, depositions, or court. It recommends that AI automate reversible actions such as hash verification but not independently make irreversible or legally consequential decisions, including evidence collection or collecting cloud data.\u003c/p\u003e\n"},{"n":7,"title":"Fake AI Attacks Spread Across US Companies: How MSSPs Can Stop Incidents Early","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/fake-ai-attacks-spread-across-us.html","time":"11:46","priority":"MAY READ","score":38,"tldr":"Attackers are impersonating popular AI services such as Claude, ChatGPT, Copilot, and Gemini to trick employees into running PowerShell-based malware that can steal browser sessions and business credentials. The article promotes behavioral sandboxing and threat-intelligence sharing as ways for MSSPs to detect related campaigns faster across clients.","briefOverview":"\u003cp\u003eAttackers are impersonating popular AI services, including Claude, ChatGPT, GitHub Copilot, and Gemini, to distribute malware, steal browser sessions, and compromise business accounts. ANY.RUN linked 1,258 public sandbox analyses to fake AI campaigns between April and October 2026, with U.S. organizations representing 16% of country-attributed targets. The lures appear in sponsored search results, legitimate hosting services, shared AI conversations, and counterfeit download websites.\u003c/p\u003e\n\n\u003cp\u003eIn one analyzed fake Claude campaign, a Windows download button copied a command to the victim’s clipboard and instructed them to run it in PowerShell. Rather than installing an application, the command launched mshta.exe, retrieved a malicious HTA file, and started an encoded PowerShell execution chain associated with infostealer activity. The article argues that managed security service providers can reduce repeated investigation work across customers by using behavioral investigation, continuously updated threat intelligence, and threat hunting based on recurring behaviors such as suspicious PowerShell commands, mshta.exe execution, and scheduled browser launches.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ANY.RUN linked 1,258 public sandbox analyses to fake AI campaigns between April and October 2026, with 16% of country-attributed targets located in the United States.","The campaigns impersonate AI brands including Claude, ChatGPT, GitHub Copilot, and Gemini through sponsored search results, legitimate hosting services, shared AI conversations, and counterfeit download sites.","In an analyzed fake Claude download campaign, clicking a Windows download button copied a command that launched mshta.exe, retrieved a malicious HTA file, and initiated an encoded PowerShell execution chain.","ANY.RUN states that its Interactive Sandbox enables analysts to reproduce suspicious interactions in isolation and observe resulting processes, network activity, and malicious behavior.","The article says MSSPs can reuse investigation findings and threat-intelligence indicators across customer environments to improve detection, triage, and threat hunting."],"insights":["Fake AI lures can evade simple screening because employees voluntarily initiate the process and the harmful activity may not appear until several steps after a seemingly normal download action.","Although attackers rotate landing domains, AI brand names, and hosting services, recurring behaviors such as mshta.exe use, encoded PowerShell commands, and scheduled browser launches can support broader detection and hunting.","For managed security providers, the main operational risk is not only a single infection but repeated, similar investigations across customers with different tools and policies, which can increase response times and escalations.","An investigation at one customer can be used to identify related attacker infrastructure and search for similar activity at other customers, reducing duplicated research effort.","The article reports that 30% of unique malicious indicators found by ANY.RUN customers during sandbox investigations are already present in its threat-intelligence feeds."],"referencedReports":[],"body":"\u003cp\u003eAttackers are impersonating popular AI services, including Claude, ChatGPT, GitHub Copilot, and Gemini, to distribute malware, steal browser sessions, and compromise business accounts. ANY.RUN linked 1,258 public sandbox analyses to fake AI campaigns between April and October 2026, with U.S. organizations representing 16% of country-attributed targets. The lures appear in sponsored search results, legitimate hosting services, shared AI conversations, and counterfeit download websites.\u003c/p\u003e\n\n\u003cp\u003eIn one analyzed fake Claude campaign, a Windows download button copied a command to the victim’s clipboard and instructed them to run it in PowerShell. Rather than installing an application, the command launched mshta.exe, retrieved a malicious HTA file, and started an encoded PowerShell execution chain associated with infostealer activity. The article argues that managed security service providers can reduce repeated investigation work across customers by using behavioral investigation, continuously updated threat intelligence, and threat hunting based on recurring behaviors such as suspicious PowerShell commands, mshta.exe execution, and scheduled browser launches.\u003c/p\u003e\n"},{"n":10,"title":"Reverse proof of work: How AI changed hiring signals","source":"blog.castle.io","sourceColorIdx":8,"link":"https://blog.castle.io/reverse-proof-of-work-how-ai-changed-hiring-signals/","time":"11:55","priority":"MAY READ","score":38,"tldr":"AI has made polished take-home assignments and codebase analyses cheap to produce but costly to verify, weakening them as hiring signals. Hiring processes should focus less on volume and more on candidates’ demonstrated judgment, validation, prioritization, and reasoning.","briefOverview":"\u003cp\u003eThe author describes hiring as an information problem in which companies and candidates both have incomplete information, and each interview step should reduce a specific uncertainty. Traditionally, work such as take-home assignments, open-source projects, and technical writing could serve as useful signals because they were difficult to produce but comparatively quick to review. The author argues that these steps should be justified by what they reveal, particularly because they can require substantial unpaid time from candidates.\u003c/p\u003e\n\n\u003cp\u003eAI tools have changed the meaning of polished technical artifacts by making long analyses, code suggestions, and lists of observations much cheaper to produce. The author calls the resulting imbalance “reverse proof of work”: generating material is inexpensive, while validating claims and determining what the artifact says about the candidate can be costly. Rather than rewarding volume, hiring processes should emphasize judgment, prioritization, validation, technical depth, and the ability to explain trade-offs, such as through discussions of a shorter exercise or critiques of AI-generated proposals.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The author views hiring as an information problem in which each interview step should reduce a specific uncertainty about the candidate and the role.","Traditional hiring signals such as take-home assignments can be useful because they are difficult for candidates to produce but relatively quick for employers to review.","AI can make long technical analyses cheap to produce while leaving employers with the expensive task of validating claims and deciding what the work reveals about the candidate.","The author calls this shift “reverse proof of work,” where production is inexpensive but verification remains costly.","The article argues that hiring processes should reward judgment, prioritization, validation, and explanation of trade-offs rather than the volume of material a candidate produces."],"insights":["A detailed AI-assisted report can still demonstrate expertise if the candidate supplied strong context, built a sophisticated workflow, and carefully evaluated the output, but the finished document alone does not reveal whether that happened.","A technically correct observation may not be useful if it does not matter to the team’s priorities, making prioritization a more meaningful hiring signal than the number of findings produced.","A short exercise followed by discussion can reveal more about a candidate than a lengthy deliverable because it allows employers to observe how the candidate validates claims, rejects weak ideas, and defends recommendations.","The author suggests that candidates may be better evaluated by critiquing an AI-generated proposal or explaining what they discarded than by generating a large original-looking analysis."],"referencedReports":[],"body":"\u003cp\u003eThe author describes hiring as an information problem in which companies and candidates both have incomplete information, and each interview step should reduce a specific uncertainty. Traditionally, work such as take-home assignments, open-source projects, and technical writing could serve as useful signals because they were difficult to produce but comparatively quick to review. The author argues that these steps should be justified by what they reveal, particularly because they can require substantial unpaid time from candidates.\u003c/p\u003e\n\n\u003cp\u003eAI tools have changed the meaning of polished technical artifacts by making long analyses, code suggestions, and lists of observations much cheaper to produce. The author calls the resulting imbalance “reverse proof of work”: generating material is inexpensive, while validating claims and determining what the artifact says about the candidate can be costly. Rather than rewarding volume, hiring processes should emphasize judgment, prioritization, validation, technical depth, and the ability to explain trade-offs, such as through discussions of a shorter exercise or critiques of AI-generated proposals.\u003c/p\u003e\n"},{"n":11,"title":"Predictive Security Starts With What Threat Actors Already Have","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/predictive-security-starts-with-what-threat-actors-already-have/","time":"11:57","priority":"MAY READ","score":35,"tldr":"Constella promotes predictive security as a way to use breached and infostealer-derived identity data alongside internal access context to identify and remediate likely attack paths before intrusion is detected. The approach prioritizes actions such as credential resets, session reviews, device investigation, and monitoring for exposed high-risk accounts.","briefOverview":"\u003cp\u003eConstella Intelligence describes predictive security as using evidence of stolen identities, credentials, and other exposed information to identify likely opportunities for attackers before an intrusion is confirmed. The article says breach data and infostealer logs can show what information may already be in adversaries’ hands. Organizations can combine this external exposure intelligence with internal knowledge about account status, access privileges, authentication controls, and business impact. This helps teams decide which exposures require the fastest response.\u003c/p\u003e\n\n\u003cp\u003eIn the article’s illustrative scenario, infostealer malware on a finance employee’s personal laptop captures credentials associated with the employee’s corporate email address while the employee accesses a browser-based business application. After Constella identifies the exposure, the security team investigates the device, resets credentials, reviews active sessions, checks recent activity, and assesses access privileges and authentication controls. The article emphasizes acting before there is proof that an attacker used the information, rather than waiting for internal monitoring to detect unauthorized access. It recommends assigning ownership for findings, defining response criteria, and tracking assessment and remediation times, unresolved high-priority exposures, and repeated exposure involving the same identities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Predictive security uses evidence about threats, exposures, and business context to identify likely attack paths and support action before attackers exploit them.","Constella Intelligence says it analyzes breach data and infostealer logs to identify compromised identities, stolen credentials, and related connections.","Organizations can combine external exposure intelligence with internal details such as account status, access privileges, authentication controls, and business impact to prioritize responses.","In the article’s illustrative scenario, a security team responds to exposed employee credentials by investigating the device, resetting credentials, reviewing active sessions, and examining recent account activity.","The article recommends measuring time from exposure alert to assessment, time from validation to remediation, unresolved high-priority exposures, and repeated exposure involving the same identities."],"insights":["An exposed identity becomes more actionable when paired with internal context, because the same stolen information may require different urgency depending on account privileges, credential changes, and available authentication protections.","The article treats active session objects stolen by infostealers as a concern separate from passwords, since defenders may need to review sessions and consider extra monitoring or blocking of session-based access from unusual sources.","The recommended success measures focus on how quickly teams assess and remediate exposures and whether exposures recur, rather than attempting to estimate how many breaches were prevented.","Clear ownership and predefined response criteria are presented as necessary for exposure alerts to produce protection, because an alert only creates value when someone makes a decision and acts on it."],"referencedReports":[],"body":"\u003cp\u003eConstella Intelligence describes predictive security as using evidence of stolen identities, credentials, and other exposed information to identify likely opportunities for attackers before an intrusion is confirmed. The article says breach data and infostealer logs can show what information may already be in adversaries’ hands. Organizations can combine this external exposure intelligence with internal knowledge about account status, access privileges, authentication controls, and business impact. This helps teams decide which exposures require the fastest response.\u003c/p\u003e\n\n\u003cp\u003eIn the article’s illustrative scenario, infostealer malware on a finance employee’s personal laptop captures credentials associated with the employee’s corporate email address while the employee accesses a browser-based business application. After Constella identifies the exposure, the security team investigates the device, resets credentials, reviews active sessions, checks recent activity, and assesses access privileges and authentication controls. The article emphasizes acting before there is proof that an attacker used the information, rather than waiting for internal monitoring to detect unauthorized access. It recommends assigning ownership for findings, defining response criteria, and tracking assessment and remediation times, unresolved high-priority exposures, and repeated exposure involving the same identities.\u003c/p\u003e\n"}]</script>
