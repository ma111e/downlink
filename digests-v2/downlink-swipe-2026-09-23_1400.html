<script type="application/json" id="dl-articles">[{"n":6,"title":"MikroTrick Chain Let Attackers Take Over MikroTik Routers Without a Password or SSH Key","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/mikrotrick-chain-let-attackers-take.html","time":"16:06","priority":"MUST READ","score":96,"tldr":"CERT Polska says attackers are actively chaining two MikroTik RouterOS SSH flaws, CVE-2026-67279 and CVE-2026-86060, to gain full administrator access to Internet-exposed routers without credentials. Administrators should urgently update RouterOS, restrict public SSH access, and investigate devices for indicators such as failed logins using the username \"-2\" or unauthorized \"ops\" accounts.","briefOverview":"\u003cp\u003eCERT Polska’s technical analysis identifies the MikroTrick attack chain as two MikroTik RouterOS SSH flaws, CVE-2026-67279 and CVE-2026-86060. When chained, they allow attackers to take full administrative control of Internet-exposed routers without a password, SSH key, or completed authentication. Evidence in logs indicates the chain was exploited before MikroTik released patches on September 3. MikroTik fixed the flaws in RouterOS versions 6.49.21, 7.23.4, and 7.24.2.\u003c/p\u003e\n\n\u003cp\u003eThe first flaw lets an unauthenticated SSH client reach the command stage by forcing key renegotiation during login, while the second makes the RouterOS login program treat the username \u0026ldquo;-2\u0026rdquo; as an option. This enables the attacker to supply a chosen username and a full-administrator privilege level through the SSH session, opening a privileged console. CERT Polska cited indicators including failed SSH logins for \u0026ldquo;-2,\u0026rdquo; unauthorized \u0026ldquo;ops\u0026rdquo; administrator accounts, and activity involving IP addresses 82.192.72.4 and 103.102.31.18. Patching stops the attack but does not remove prior changes, so administrators who find indicators should isolate and reset affected devices, rebuild from a trusted configuration, and change credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT Polska’s MikroTrick analysis describes a chain of CVE-2026-67279 and CVE-2026-86060 that can give an unauthenticated attacker full administrative control of an Internet-exposed MikroTik RouterOS device over SSH.","CVE-2026-67279 lets a client reach the SSH command stage by triggering key renegotiation during authentication, while CVE-2026-86060 allows the username \"-2\" to be interpreted by the RouterOS login program as an option that reads identity and privilege data from the session terminal.","MikroTik released patches in RouterOS versions 6.49.21, 7.23.4, and 7.24.2, but CERT Polska found evidence that the chain was exploited before those fixes were available.","Observed indicators include SSH login attempts using the username \"-2,\" creation of a fully privileged \"ops\" account, and activity involving IP addresses 82.192.72.4 and 103.102.31.18.","CERT Polska recommends that administrators finding compromise indicators isolate the router, preserve logs and configuration, factory reset and rebuild it from a trusted configuration, and change all passwords and keys."],"insights":["Updating RouterOS prevents further use of the chain but does not undo accounts, configuration changes, or data theft that may have occurred before patching.","The RouterOS Flagged status can detect only selected signs of compromise, so a device not marked as flagged cannot be assumed to be clean.","A failed SSH login for the unusual username \"-2\" is a particularly useful investigation clue because it reflects the argument-handling behavior used in the observed attack chain.","The two flaws have complementary roles: one bypasses the normal point at which SSH verifies identity, while the other turns access to the login process into a fully privileged console.","The risk is concentrated on devices whose SSH service is reachable from untrusted public networks; MikroTik says its default home configuration does not expose SSH to the internet."],"referencedReports":[{"title":"MikroTrick Technical Analysis","url":"https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/","publisher":"cert-polska","context":"The article relies on CERT Polska's technical analysis to identify the two RouterOS flaws in the MikroTrick chain and explain how they produce administrative access.","category":"research","primary":true},{"title":"Diagnostic Report on the MikroTik Forum","url":"https://forum.mikrotik.com/t/important-security-update/272851/105","publisher":"mikrotik-forum","context":"The article cites this diagnostic report as evidence of an observed attack sequence involving the username \"-2,\" forced renegotiation, and an attempt to create a privileged \"ops\" account.","category":"research","primary":false}],"body":"\u003cp\u003eCERT Polska’s technical analysis identifies the MikroTrick attack chain as two MikroTik RouterOS SSH flaws, CVE-2026-67279 and CVE-2026-86060. When chained, they allow attackers to take full administrative control of Internet-exposed routers without a password, SSH key, or completed authentication. Evidence in logs indicates the chain was exploited before MikroTik released patches on September 3. MikroTik fixed the flaws in RouterOS versions 6.49.21, 7.23.4, and 7.24.2.\u003c/p\u003e\n\n\u003cp\u003eThe first flaw lets an unauthenticated SSH client reach the command stage by forcing key renegotiation during login, while the second makes the RouterOS login program treat the username \u0026ldquo;-2\u0026rdquo; as an option. This enables the attacker to supply a chosen username and a full-administrator privilege level through the SSH session, opening a privileged console. CERT Polska cited indicators including failed SSH logins for \u0026ldquo;-2,\u0026rdquo; unauthorized \u0026ldquo;ops\u0026rdquo; administrator accounts, and activity involving IP addresses 82.192.72.4 and 103.102.31.18. Patching stops the attack but does not remove prior changes, so administrators who find indicators should isolate and reset affected devices, rebuild from a trusted configuration, and change credentials.\u003c/p\u003e\n"},{"n":1,"title":"Malicious AI agents steal 600K credit cards, infect 100+ sites with skimmers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malicious-ai-agents-steal-600k-credit-cards-infect-100-plus-sites-with-skimmers/","time":"16:20","priority":"MUST READ","score":94,"tldr":"A financially motivated attacker used autonomous AI agent frameworks to compromise at least 119 online retail sites, steal more than 600,000 payment-card records, and deploy persistent web skimmers at a cost estimated near $25 per target. The campaign shows how low-cost AI automation can rapidly scale exploitation, data theft, and destructive cleanup across organizations.","briefOverview":"\u003cp\u003eA financially motivated threat actor has used open-source AI agent frameworks to target online retailers at scale, according to Gambit. The campaign has been active since at least July and was ongoing as of September 22. Gambit found that the attacker compromised at least 119 websites with payment-card skimmers and stole more than 600,000 valid card records from two companies.\u003c/p\u003e\n\n\u003cp\u003eThe operation used Strix for scanning and finding weaknesses, Cairn to obtain access such as a system shell or administrator privileges, and Hermes to coordinate activity using Claude Opus 4.6. Between September 10 and 15, the attacker launched 105 attack waves and succeeded to varying degrees against at least 27 companies. The skimmers were added through altered JavaScript, checkout-page or Google tag scripts, poisoned S3/CDN content and caches, database changes, Kubernetes deployment changes, and cron jobs that restored the code after removal.\u003c/p\u003e\n\n\u003cp\u003eThe attacker also instructed Hermes to delete payment-card data from Magento databases after taking it, which caused data loss and operational disruption at several retailers. Gambit reported that the operator used a website traffic-ranking service to prioritize valuable targets, particularly those using custom software. The researchers estimated overall AI-service costs of \u003cspan class=\"math inline\"\u003e\\(12,000 to \\)\u003c/span\u003e18,000, or roughly a few to a few tens of dollars per target, illustrating the low cost of conducting the campaign at scale.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A financially motivated threat actor used the Strix, Cairn, and Hermes AI tools to scan, break into, and manage attacks against online retailers.","Gambit reported that the campaign compromised at least 119 websites with payment-card skimmers and stole more than 600,000 valid card details from two companies.","Between September 10 and 15, the attacker launched 105 distinct attack waves and achieved varying degrees of success against at least 27 companies.","The skimmers were inserted through methods including altered JavaScript files, checkout-page scripts, poisoned S3/CDN content, database changes, Kubernetes deployment changes, and cron jobs that restored removed code.","Gambit estimated that the operation cost between $12,000 and $18,000 overall, with the attacker’s own review showing an average cost of $25.46 across 101 completed scans."],"insights":["The operator reportedly gave the AI agents only short goal-oriented instructions, while the agents handled scanning, gaining access, post-compromise work, and tactical decisions across many targets.","The campaign’s skimmers were designed for resilience: attackers used several insertion points and, in some cases, cron jobs to restore the malicious code after defenders removed it.","After taking payment-card data, the attacker instructed an AI agent to delete the source fields from Magento databases in batches, meaning the campaign caused retailer data loss as well as card theft.","The reported economics were unusually low for the scale: Gambit estimated a few dollars to a few tens of dollars per targeted company, with a $25.46 average across 101 completed scans.","The attacker used a traffic-ranking service to prioritize valuable sites from Strix’s scan results and favored organizations using custom software."],"referencedReports":[{"title":"Autonomous AI agents target online retailers for $25 a company","url":"https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company","publisher":"gambit","context":"The article relies on Gambit's investigation and cites this analysis for findings on the campaign's operational costs and scale.","category":"research","primary":true}],"body":"\u003cp\u003eA financially motivated threat actor has used open-source AI agent frameworks to target online retailers at scale, according to Gambit. The campaign has been active since at least July and was ongoing as of September 22. Gambit found that the attacker compromised at least 119 websites with payment-card skimmers and stole more than 600,000 valid card records from two companies.\u003c/p\u003e\n\n\u003cp\u003eThe operation used Strix for scanning and finding weaknesses, Cairn to obtain access such as a system shell or administrator privileges, and Hermes to coordinate activity using Claude Opus 4.6. Between September 10 and 15, the attacker launched 105 attack waves and succeeded to varying degrees against at least 27 companies. The skimmers were added through altered JavaScript, checkout-page or Google tag scripts, poisoned S3/CDN content and caches, database changes, Kubernetes deployment changes, and cron jobs that restored the code after removal.\u003c/p\u003e\n\n\u003cp\u003eThe attacker also instructed Hermes to delete payment-card data from Magento databases after taking it, which caused data loss and operational disruption at several retailers. Gambit reported that the operator used a website traffic-ranking service to prioritize valuable targets, particularly those using custom software. The researchers estimated overall AI-service costs of \u003cspan class=\"math inline\"\u003e\\(12,000 to \\)\u003c/span\u003e18,000, or roughly a few to a few tens of dollars per target, illustrating the low cost of conducting the campaign at scale.\u003c/p\u003e\n"},{"n":4,"title":"FBI investigating alleged ShinyHunters breach of its jobs site","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/fbi-investigating-alleged-shinyhunters-job-site-breach","time":"14:22","priority":"SHOULD READ","score":88,"tldr":"The FBI is investigating claims by ShinyHunters that it breached and defaced FBIjobs.gov, allegedly stealing records on current and former employees and job applicants. The group has threatened to publish the data unless the FBI withdraws a public warning that disputes its claims.","briefOverview":"\u003cp\u003eThe FBI is investigating alleged unauthorized activity affecting FBIjobs.gov after ShinyHunters defaced the job application site with an image associated with the group. ShinyHunters claimed it stole information on current and former FBI employees and applicants, and threatened to release it unless the FBI removes a May public notice about the group. An FBI spokesperson said the agency was aware of the claims and was investigating.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters provided samples of 5,000 purported FBI agent records to several news outlets, which reported that they confirmed the records were legitimate. As of Wednesday morning, the site displayed a notice that the special-agent application portal was unavailable. Experts warned that if the alleged data is released or sold, it could be used for fraud, threats against personnel and their families, and targeted online or physical attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI is investigating claims of unauthorized activity affecting its FBIjobs.gov job application platform after ShinyHunters defaced the site.","ShinyHunters claimed it stole information on current and former FBI employees and job applicants and threatened to release it unless the FBI removes a May public notice about the group.","The group provided samples of 5,000 purported FBI agent records to several news outlets, which reported confirming their legitimacy.","As of Wednesday morning, FBIjobs.gov displayed a notice that the special-agent application portal was unavailable.","Security experts warned that publication or sale of the alleged data could enable fraud, threats, and targeted harm against law-enforcement personnel and their families."],"insights":["ShinyHunters used both a visible website defacement and a threatened data release to pressure the FBI to remove a public notice that challenged the group’s claims.","The group’s distribution of 5,000 sample records to news outlets, reportedly verified as legitimate, gave its extortion threat added credibility before any broader release.","The alleged records could create risks beyond identity fraud because FBI personnel may work against dangerous criminal groups and could face threats to themselves or their families.","The FBI’s special-agent application portal remained unavailable after the incident, indicating that the claimed activity affected a service used by prospective applicants."],"referencedReports":[{"title":"FBI Public Service Announcement on ShinyHunters","url":"https://www.ic3.gov/PSA/2026/PSA260515","publisher":"fbi-internet-crime-complaint-center","context":"The article says ShinyHunters demanded that the FBI remove this May public notice, which made assertions the group disputes.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe FBI is investigating alleged unauthorized activity affecting FBIjobs.gov after ShinyHunters defaced the job application site with an image associated with the group. ShinyHunters claimed it stole information on current and former FBI employees and applicants, and threatened to release it unless the FBI removes a May public notice about the group. An FBI spokesperson said the agency was aware of the claims and was investigating.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters provided samples of 5,000 purported FBI agent records to several news outlets, which reported that they confirmed the records were legitimate. As of Wednesday morning, the site displayed a notice that the special-agent application portal was unavailable. Experts warned that if the alleged data is released or sold, it could be used for fraud, threats against personnel and their families, and targeted online or physical attacks.\u003c/p\u003e\n"},{"n":8,"title":"A Leaked GitLab Issue Email Address Lets Anyone Push Code and Run CI Jobs as You","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/a-leaked-gitlab-issue-email-address.html","time":"16:53","priority":"SHOULD READ","score":87,"tldr":"GitLab’s non-expiring incoming-email token can act as a reusable credential: anyone who obtains a user’s project email address can submit patches that GitLab commits under that user’s permissions, potentially to main and with CI/CD execution. The feature bypasses sender verification, IP restrictions, and 2FA, so users should rotate exposed tokens and self-managed administrators should consider disabling incoming email.","briefOverview":"\u003cp\u003eAikido Security reported that GitLab’s private incoming-email address for creating work items contains a non-expiring token tied to a user account. The token is reused across the user’s project addresses and can apply to every public or private project that the account can access. GitLab does not verify the email sender, so anyone who obtains the address can submit email that GitLab handles with the account owner’s permissions.\u003c/p\u003e\n\n\u003cp\u003eBy changing the address suffix from \u003ccode\u003e-issue\u003c/code\u003e to \u003ccode\u003e-merge-request\u003c/code\u003e, a holder can email an attached patch and specify a target branch in the subject line. GitLab can apply the patch as a commit authored by the account owner, including to \u003ccode\u003emain\u003c/code\u003e where that user has permission, and a changed \u003ccode\u003e.gitlab-ci.yml\u003c/code\u003e can trigger CI/CD jobs. Incoming email is exempt from IP restrictions and can work without two-factor authentication; users can reset their incoming-email token to invalidate addresses, while self-managed administrators can disable incoming email across the instance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab’s incoming-email address contains a non-expiring token tied to a user account, and the same token is used across that user’s project email addresses.","Aikido Security demonstrated that a person with this address can change its suffix to create merge requests by email and send an attached patch that GitLab commits under the account owner’s identity.","The email sender is not verified, and incoming email is exempt from GitLab IP restrictions and can work without two-factor authentication.","An attacker’s access is limited to the leaked account’s permissions, but a Maintainer-level account may be able to modify protected branches and run CI/CD jobs with access to project secrets.","Users can invalidate exposed addresses by resetting the incoming-email token, while self-managed GitLab administrators can disable incoming email for the entire instance."],"insights":["Although GitLab presents the address as belonging to a particular project, its embedded token applies to every public or private project that the account can access.","An address intended for emailing work items can be converted into a code-submission route simply by replacing its “-issue” suffix with “-merge-request.”","A private project is not fully reachable from the token alone: an attacker also needs the project path and numeric ID, while public projects expose both values.","GitLab changed its wording to acknowledge that the address can create merge requests, but the article says the non-expiring token, unverified senders, and lack of an individual opt-out remain unchanged.","Resetting the incoming-email token invalidates all of a user’s project email addresses at once, and self-managed GitLab offers only an instance-wide disable option rather than a per-user setting."],"referencedReports":[{"title":"GitLab Email Push to Main","url":"https://www.aikido.dev/blog/gitlab-email-push-to-main","publisher":"aikido-security","context":"The article relies on Aikido Security’s report and demonstration that a leaked GitLab incoming-email address can be used to submit patches and run CI/CD jobs under the account owner’s permissions.","category":"research","primary":true}],"body":"\u003cp\u003eAikido Security reported that GitLab’s private incoming-email address for creating work items contains a non-expiring token tied to a user account. The token is reused across the user’s project addresses and can apply to every public or private project that the account can access. GitLab does not verify the email sender, so anyone who obtains the address can submit email that GitLab handles with the account owner’s permissions.\u003c/p\u003e\n\n\u003cp\u003eBy changing the address suffix from \u003ccode\u003e-issue\u003c/code\u003e to \u003ccode\u003e-merge-request\u003c/code\u003e, a holder can email an attached patch and specify a target branch in the subject line. GitLab can apply the patch as a commit authored by the account owner, including to \u003ccode\u003emain\u003c/code\u003e where that user has permission, and a changed \u003ccode\u003e.gitlab-ci.yml\u003c/code\u003e can trigger CI/CD jobs. Incoming email is exempt from IP restrictions and can work without two-factor authentication; users can reset their incoming-email token to invalidate addresses, while self-managed administrators can disable incoming email across the instance.\u003c/p\u003e\n"},{"n":7,"title":"This Windows Malware is Built to Let Up to Four AI Models Vote on Its Next Move","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/windows-malware-is-built-to-let-up-to.html","time":"14:17","priority":"MAY READ","score":74,"tldr":"Cisco Talos identified CLOSEDQUORUM, an early Windows malware prototype that asks up to four commercial AI models to vote on post-compromise actions such as credential theft, persistence, and code injection. The publicly available sample is nonfunctional, but its design shows attackers experimenting with AI services as a substitute for traditional command-and-control.","briefOverview":"\u003cp\u003eCisco Talos reported on CLOSEDQUORUM, a Windows malware prototype designed to ask up to four commercial AI services—DeepSeek, Qwen, Mistral, and Google Gemini—to vote on what it should do next. Rather than receiving direct commands from an attacker-controlled server, it sends the models basic information about a computer and a fixed menu of actions. Talos said it is the first publicly documented Windows implant, to its knowledge, that delegates command-and-control decisions to AI models. The public version does not function as published because it contains placeholder API keys and Discord webhook details.\u003c/p\u003e\n\n\u003cp\u003eThe available actions are steal, inject, persist, and move, although the move option has no implementation in the public version. A steal decision can trigger Windows credential-memory dumping, collection of saved browser passwords, and theft of data from MetaMask, Exodus, and Ethereum wallets; other options can inject code into programs or create several automatic-start mechanisms. The malware sends the models\u0026rsquo; choices and stated reasons to an attacker Discord channel before acting, and sends stolen data there in encrypted pieces. Talos advised defenders to detect suspicious combinations of AI-service traffic, LSASS access, process injection, persistence activity, and Discord webhook connections rather than blocking AI-service domains alone.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos reported that CLOSEDQUORUM is a Windows malware prototype designed to ask up to four commercial AI models—DeepSeek, Qwen, Mistral, and Google Gemini—to vote on its next action.","The malware can choose among stealing data, injecting code into another program, establishing automatic restart mechanisms, or moving laterally, although the public version has no code for the move option.","When the steal action is selected, CLOSEDQUORUM attempts to collect Windows login credentials, saved passwords from Chrome, Edge, and Firefox, and data from MetaMask, Exodus, and Ethereum cryptocurrency wallets.","The public sample contains placeholder AI-service API keys and Discord webhook values, so it cannot contact the models or send stolen data as published.","Talos advised defenders to look for an unusual combination of AI-service traffic, access to Windows credential memory, process injection or persistence activity, and Discord webhook traffic."],"insights":["CLOSEDQUORUM does not simply use AI to generate commands; it gives the models a fixed menu of actions and performs whichever action receives the most valid votes.","The malware sends both its decisions and the models' stated reasons to a Discord channel before acting, giving an attacker visibility without operating a traditional command server.","Its reliance on commercial AI services creates operational weaknesses because providers can refuse requests, rate-limit them, or return unusable responses.","Blocking AI-service domains alone would be unreliable because legitimate software may use those services; Talos recommends detecting the combination of AI requests with credential access, code injection, persistence, and Discord traffic instead."],"referencedReports":[{"title":"The CLOSED QUORUM: Inside the First Reported Autonomous AI C2 Implant","url":"https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/","publisher":"cisco-talos","context":"The article relies on Cisco Talos's technical analysis of CLOSEDQUORUM's AI-driven decision process, capabilities, indicators, and limitations.","category":"research","primary":true}],"body":"\u003cp\u003eCisco Talos reported on CLOSEDQUORUM, a Windows malware prototype designed to ask up to four commercial AI services—DeepSeek, Qwen, Mistral, and Google Gemini—to vote on what it should do next. Rather than receiving direct commands from an attacker-controlled server, it sends the models basic information about a computer and a fixed menu of actions. Talos said it is the first publicly documented Windows implant, to its knowledge, that delegates command-and-control decisions to AI models. The public version does not function as published because it contains placeholder API keys and Discord webhook details.\u003c/p\u003e\n\n\u003cp\u003eThe available actions are steal, inject, persist, and move, although the move option has no implementation in the public version. A steal decision can trigger Windows credential-memory dumping, collection of saved browser passwords, and theft of data from MetaMask, Exodus, and Ethereum wallets; other options can inject code into programs or create several automatic-start mechanisms. The malware sends the models\u0026rsquo; choices and stated reasons to an attacker Discord channel before acting, and sends stolen data there in encrypted pieces. Talos advised defenders to detect suspicious combinations of AI-service traffic, LSASS access, process injection, persistence activity, and Discord webhook connections rather than blocking AI-service domains alone.\u003c/p\u003e\n"},{"n":5,"title":"Ryuk ransomware operator gets 2-year sentence after extorting victims for $1.2 million","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ransomware-ryuk-sentenced-doj","time":"15:30","priority":"MAY READ","score":72,"tldr":"Armenian national Karen Vardanyan, described by U.S. prosecutors as a core Ryuk ransomware operator, was sentenced to two years in federal prison and ordered to pay $1.22 million in restitution after extorting victims worldwide.","briefOverview":"\u003cp\u003eKaren Vardanyan, a 35-year-old Armenian national accused of being a core member of the Ryuk ransomware gang, was sentenced to two years in U.S. federal prison. He pleaded guilty in July to conspiracy and fraud in connection with computers after being extradited from Ukraine in July 2025 following his arrest in Kyiv. Vardanyan will also serve three years of supervised release and pay \u003cspan class=\"math inline\"\u003e\\(1,219,106 in restitution to victims. Prosecutors said he personally carried out several attacks and extorted more than \\)\u003c/span\u003e1 million before the FBI placed him on an international wanted list.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Vardanyan and his co-conspirators conducted more than 2,400 ransomware attacks worldwide and received at least \u003cspan class=\"math inline\"\u003e\\(15 million in ransom payments over the years. The attacks restricted access to data and disrupted communications, affecting state and local municipalities as well as hospitals. During the COVID-19 pandemic, U.S. agencies warned that Ryuk actors were heavily targeting hospitals; a Ryuk incident at Universal Health Services ultimately cost the company \\)\u003c/span\u003e67 million. Ryuk, first detected in 2018, has been linked to Russian cybercriminals and Trickbot, while several alleged members and a man accused of laundering Ryuk funds have also been arrested or convicted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Karen Vardanyan, a 35-year-old Armenian national, was sentenced to two years in U.S. federal prison after pleading guilty to conspiracy and computer-related fraud charges connected to ransomware attacks.","Vardanyan was ordered to serve three years of supervised release and pay $1,219,106 in restitution to victims.","U.S. prosecutors described Vardanyan as a core member of the Ryuk ransomware gang and said he and co-conspirators conducted more than 2,400 attacks worldwide.","The Justice Department said Vardanyan and his team received at least $15 million in ransom payments over the years.","Ryuk attacks disrupted state and local municipalities, and U.S. agencies warned in 2020 that Ryuk actors were heavily targeting hospitals."],"insights":["The case demonstrates cross-border enforcement: Vardanyan was arrested in Kyiv, extradited from Ukraine in July 2025, and sentenced in a U.S. federal court.","The article distinguishes Vardanyan's personal extortion amount of more than $1 million from the Ryuk team's reported total ransom proceeds of at least $15 million.","Ryuk's impact extended beyond ransom demands, with the article describing disrupted data access and communications at public entities and a $67 million cost to Universal Health Services after a Ryuk incident.","Authorities have identified and arrested multiple alleged Ryuk-linked individuals over the past three years, including Armenian and Ukrainian nationals, while a Russian man pleaded guilty to laundering Ryuk-related funds."],"referencedReports":[{"title":"Ransomware Activity Targeting the Healthcare and Public Health Sector","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa20-302a","publisher":"cisa","context":"The article cites this joint U.S. government advisory when noting that the FBI and other agencies warned in 2020 that Ryuk actors were heavily targeting hospitals.","category":"advisory","primary":false}],"body":"\u003cp\u003eKaren Vardanyan, a 35-year-old Armenian national accused of being a core member of the Ryuk ransomware gang, was sentenced to two years in U.S. federal prison. He pleaded guilty in July to conspiracy and fraud in connection with computers after being extradited from Ukraine in July 2025 following his arrest in Kyiv. Vardanyan will also serve three years of supervised release and pay \u003cspan class=\"math inline\"\u003e\\(1,219,106 in restitution to victims. Prosecutors said he personally carried out several attacks and extorted more than \\)\u003c/span\u003e1 million before the FBI placed him on an international wanted list.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Vardanyan and his co-conspirators conducted more than 2,400 ransomware attacks worldwide and received at least \u003cspan class=\"math inline\"\u003e\\(15 million in ransom payments over the years. The attacks restricted access to data and disrupted communications, affecting state and local municipalities as well as hospitals. During the COVID-19 pandemic, U.S. agencies warned that Ryuk actors were heavily targeting hospitals; a Ryuk incident at Universal Health Services ultimately cost the company \\)\u003c/span\u003e67 million. Ryuk, first detected in 2018, has been linked to Russian cybercriminals and Trickbot, while several alleged members and a man accused of laundering Ryuk funds have also been arrested or convicted.\u003c/p\u003e\n"},{"n":3,"title":"How One Kubernetes YAML Can Hand Over a GCP Organization","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/how-one-kubernetes-yaml-can-hand-over-a-gcp-organization/","time":"14:01","priority":"MAY READ","score":58,"tldr":"Google Kubernetes Config Connector can become a confused-deputy privilege-escalation path: anyone allowed to create IAMPolicyMember resources in a managed namespace may be able to use KCC’s broad Google Cloud service-account permissions to grant themselves organization-level ownership. Mitigate it by least-privileging KCC identities, using namespace-scoped accounts, and tightly restricting who can submit IAM-related KCC resources.","briefOverview":"\u003cp\u003eGoogle Kubernetes Config Connector (KCC) lets developers describe Google Cloud resources in Kubernetes YAML files while KCC uses its own Google service account to make the corresponding cloud API calls. This avoids distributing Google Cloud credentials to developers, but it can create a privilege-escalation path when KCC’s service account has broad project, folder, or organization permissions. Researcher Justin O\u0026rsquo;Leary named the issue ConfigConfusion.\u003c/p\u003e\n\n\u003cp\u003eA user who can create IAMPolicyMember resources in a KCC-managed namespace can submit a YAML file that grants an attacker-controlled service account a Google Cloud role, potentially including roles/owner for an entire organization if KCC is permitted to assign it. Kubernetes checks whether the user may create the resource, and Google Cloud checks whether KCC’s service account may make the IAM change, but neither system verifies whether the Kubernetes user should be allowed to request that cloud action. Google considers this behavior a configuration outcome rather than a KCC flaw, and recommends limiting KCC’s permissions, using separately scoped service accounts in namespaced mode, restricting IAM-related KCC resources to approved teams, and monitoring high-level IAM changes made by KCC.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google Kubernetes Config Connector (KCC) lets developers declare Google Cloud resources in Kubernetes YAML while KCC authenticates to Google Cloud using its own service account through Workload Identity.","The ConfigConfusion technique, identified by researcher Justin O'Leary, allows a user who can create IAMPolicyMember resources in a KCC-managed namespace to grant IAM roles using KCC's Google Cloud permissions.","If KCC's service account can assign organization-level roles, an attacker can apply an IAMPolicyMember YAML resource that grants an attacker-controlled service account roles/owner over the Google Cloud organization.","The issue is a confused-deputy problem because Kubernetes checks whether a user can create the resource, while Google Cloud IAM checks KCC's authority, but neither checks whether the Kubernetes user should be able to request the resulting Google Cloud action.","Google recommends reducing KCC's authority and restricting creation of IAMPolicyMember, IAMPolicy, and IAMPartialPolicy resources, including using separately scoped service accounts in namespaced mode."],"insights":["Removing cloud credentials from developers can shift risk rather than eliminate it, because a shared controller identity may have far more authority than any individual developer.","Kubernetes permissions and Google Cloud permissions can each appear properly configured in isolation while their combination creates a path to organization-level control.","The practical mitigation is to limit both the controller’s cloud permissions and the Kubernetes users allowed to submit IAM-related configuration, since either control alone does not address the full authorization gap.","AWS Controllers for Kubernetes and Azure Service Operator v2 reduce the potential impact by separating or scoping controller identities, although the article says they do not remove the underlying confused-deputy risk."],"referencedReports":[{"title":"Config Connector Authorization Bypass","url":"https://olearysec.com/research/config-connector-authorization-bypass/","publisher":"justin-o'leary","context":"The article cites this technical research as the source of the ConfigConfusion authorization-bypass technique affecting Google Kubernetes Config Connector deployments.","category":"research","primary":true}],"body":"\u003cp\u003eGoogle Kubernetes Config Connector (KCC) lets developers describe Google Cloud resources in Kubernetes YAML files while KCC uses its own Google service account to make the corresponding cloud API calls. This avoids distributing Google Cloud credentials to developers, but it can create a privilege-escalation path when KCC’s service account has broad project, folder, or organization permissions. Researcher Justin O\u0026rsquo;Leary named the issue ConfigConfusion.\u003c/p\u003e\n\n\u003cp\u003eA user who can create IAMPolicyMember resources in a KCC-managed namespace can submit a YAML file that grants an attacker-controlled service account a Google Cloud role, potentially including roles/owner for an entire organization if KCC is permitted to assign it. Kubernetes checks whether the user may create the resource, and Google Cloud checks whether KCC’s service account may make the IAM change, but neither system verifies whether the Kubernetes user should be allowed to request that cloud action. Google considers this behavior a configuration outcome rather than a KCC flaw, and recommends limiting KCC’s permissions, using separately scoped service accounts in namespaced mode, restricting IAM-related KCC resources to approved teams, and monitoring high-level IAM changes made by KCC.\u003c/p\u003e\n"},{"n":2,"title":"InfraTrust report warns network management systems under attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/infratrust-report-warns-network-management-systems-under-attack/","time":"14:35","priority":"MAY READ","score":40,"tldr":"Eclypsium’s InfraTrust report warns that attackers are increasingly exploiting enterprise infrastructure management platforms, including Cisco FMC and ISE, to gain broad control over managed devices. Organizations should urgently patch, restrict access to, and monitor these high-value administrative systems, many of whose flaws are already listed in CISA’s KEV catalog.","briefOverview":"\u003cp\u003eEclypsium’s September InfraTrust Pulse tracked 158 new infrastructure security advisories from 17 vendors between August 25 and September 17, covering 1,699 vulnerabilities. Forty-two advisories were rated critical, eight included a maximum CVSS score of 10.0, and 71 could be exploited remotely without authentication. Five advisories included flaws later added to CISA’s Known Exploited Vulnerabilities catalog. The report says attackers are increasingly targeting management software that controls network devices, making these platforms high-value targets.\u003c/p\u003e\n\n\u003cp\u003eCisco Secure Firewall Management Center and Cisco Identity Services Engine were among the affected management platforms. CVE-2026-20079, an actively exploited FMC authentication-bypass flaw, can allow an unauthenticated attacker to execute scripts and commands as root, and it was chained with CVE-2026-20316 in attacks linked to three threat clusters, including incidents that deployed Qilin ransomware. The report also highlighted actively exploited SonicWall SMA 1000 flaws that can be chained for unauthenticated remote code execution, as well as critical issues affecting Check Point, Arista, Cisco Nexus 9000, and other management products. Separately, the Linux kernel privilege-escalation flaw CopyFail appeared in 19 advisories from six vendors, illustrating how one upstream defect can create many separate remediation tasks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Eclypsium’s September InfraTrust Pulse tracked 158 new security advisories across 17 vendors, covering 1,699 vulnerabilities between August 25 and September 17.","The report says attackers are increasingly targeting infrastructure management platforms that configure network devices and hold credentials, with several critical flaws already exploited.","Cisco confirmed active exploitation of CVE-2026-20079, an authentication-bypass flaw in Secure Firewall Management Center that can let an unauthenticated attacker execute scripts and commands as root.","Cisco Talos linked attacks chaining two FMC vulnerabilities to threat clusters UAT-12197, UAT-11823, and UAT-11988, with some incidents involving Qilin ransomware.","CVE-2026-31431, the Linux kernel privilege-escalation flaw dubbed CopyFail, appeared in 19 advisories from six vendors, illustrating the patching burden created by a single upstream defect."],"insights":["Infrastructure management consoles are especially consequential targets because they can configure many devices, store their credentials, and provide a single path for making changes across an organization’s network.","Cisco published a shared indicator of compromise for two FMC flaws in July while stating it was unaware of exploitation of CVE-2026-20079; the vulnerabilities were later confirmed to have been chained in attacks.","SonicWall recommends re-imaging affected physical SMA 1000 appliances or redeploying virtual appliances after compromise rather than trying to clean them in place.","A single Linux kernel flaw, CopyFail, generated 19 separate vendor remediation tasks, showing that organizations may need to track the same underlying issue through many different vendor advisories and schedules.","Some severe issues involve services reachable by default, such as the Cisco Nexus 9000 debug ports associated with CVE-2026-20212, while Arista said the affected P4Runtime and gNPSI features are disabled by default."],"referencedReports":[{"title":"InfraTrust Pulse — September 2026","url":"https://pulse.infra-trust.org/september-2026","publisher":"eclypsium","context":"The article is based on Eclypsium’s monthly report tracking infrastructure security advisories and the targeting of management systems.","category":"research","primary":true},{"title":"Cisco Identity Services Engine Authentication Bypass Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ISE-ABP-VNSW7Tn5","publisher":"cisco","context":"The article cites this Cisco advisory for CVE-2026-76460, an actively exploited ISE authentication-bypass flaw enabling root command execution.","category":"advisory","primary":false},{"title":"Arista Security Advisories and Notices","url":"https://www.arista.com/en/support/advisories-notices","publisher":"arista","context":"The article references Arista’s published advisories, including two maximum-severity remote-code-execution issues affecting EOS services.","category":"advisory","primary":false},{"title":"Cisco Nexus 9000 Series Switches Remote Code Execution Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr","publisher":"cisco","context":"The article cites this Cisco advisory for CVE-2026-20212, involving debug ports reachable by default on affected Nexus 9000 switches.","category":"advisory","primary":false},{"title":"CERT/CC Vulnerability Note VU#718077","url":"https://www.kb.cert.org/vuls/id/718077","publisher":"cert-coordination-center","context":"The article references this CERT/CC disclosure for a UEFI Shell Secure Boot bypass affecting systems from multiple vendors.","category":"advisory","primary":false}],"body":"\u003cp\u003eEclypsium’s September InfraTrust Pulse tracked 158 new infrastructure security advisories from 17 vendors between August 25 and September 17, covering 1,699 vulnerabilities. Forty-two advisories were rated critical, eight included a maximum CVSS score of 10.0, and 71 could be exploited remotely without authentication. Five advisories included flaws later added to CISA’s Known Exploited Vulnerabilities catalog. The report says attackers are increasingly targeting management software that controls network devices, making these platforms high-value targets.\u003c/p\u003e\n\n\u003cp\u003eCisco Secure Firewall Management Center and Cisco Identity Services Engine were among the affected management platforms. CVE-2026-20079, an actively exploited FMC authentication-bypass flaw, can allow an unauthenticated attacker to execute scripts and commands as root, and it was chained with CVE-2026-20316 in attacks linked to three threat clusters, including incidents that deployed Qilin ransomware. The report also highlighted actively exploited SonicWall SMA 1000 flaws that can be chained for unauthenticated remote code execution, as well as critical issues affecting Check Point, Arista, Cisco Nexus 9000, and other management products. Separately, the Linux kernel privilege-escalation flaw CopyFail appeared in 19 advisories from six vendors, illustrating how one upstream defect can create many separate remediation tasks.\u003c/p\u003e\n"}]</script>
