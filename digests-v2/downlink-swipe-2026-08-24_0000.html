<script type="application/json" id="dl-articles">[{"n":8,"title":"Open VSX Unblocks Extension IDs Used in Malware Campaign","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/open-vsx-unblocks-malicious-extension-ids?utm_medium=feed","time":"05:48","priority":"SHOULD READ","score":78,"tldr":"Open VSX has unblocked three extension IDs that were previously used in an evil-twin malware campaign so legitimate maintainers can reclaim and publish their packages. The case shows why teams should track extension versions, hashes, publishers, and repositories rather than relying on extension IDs alone, since an ID can move from malicious use back to a legitimate owner.","briefOverview":"\u003cp\u003eOpen VSX unblocked three extension IDs between August 16 and August 20 that had been used by impostors in the 77-extension evil-twin campaign documented by Manifold Security. The IDs were \u003ccode\u003eAlDuncanson.react-hooks-snippets\u003c/code\u003e, \u003ccode\u003emagne-sjaastad.opm-flow-editor-support\u003c/code\u003e, and \u003ccode\u003erumbledb.jsoniq-vscode\u003c/code\u003e. Legitimate versions of the OPM Flow Editor Support and RumbleDB JSONiq extensions are now live, while React Hooks Snippets had been unblocked but had not appeared on Open VSX as of publication.\u003c/p\u003e\n\n\u003cp\u003eThe article says the issue was caused by namesquatting across Microsoft\u0026rsquo;s VS Code Marketplace and Open VSX. Attackers took extension names that were established in Microsoft\u0026rsquo;s marketplace but had not yet been claimed by their real owners on Open VSX. The legitimate publishers were not compromised and were not involved in the campaign, and Open VSX had removed all 77 malicious packages by August 3.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that tracking malicious extensions by ID alone becomes ambiguous when a legitimate maintainer later reclaims the same ID. Open VSX\u0026rsquo;s public malicious-extension list stores extension IDs as strings without version, file hash, publisher account, repository, or date. The article recommends that organizations using Open VSX record the extension ID together with its exact version, file hash, publisher identity, and source repository so historical deny rules remain tied to the malicious artifact.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Open VSX unblocked the extension IDs AlDuncanson.react-hooks-snippets, magne-sjaastad.opm-flow-editor-support, and rumbledb.jsoniq-vscode between August 16 and August 20 after those IDs had been used by impostors in the 77-extension evil-twin campaign documented by Manifold Security.","Legitimate versions of OPM Flow Editor Support and RumbleDB's JSONiq and XQuery extension are now live on Open VSX, while React Hooks Snippets had been unblocked but did not yet have a legitimate Open VSX listing as of publication.","Open VSX had removed all 77 malicious packages by August 3 and added their IDs to its malicious-extension list, while the legitimate publishers were not compromised or involved in the campaign.","The article states that tracking malicious extensions by ID alone is ambiguous because an ID can first belong to an impostor and later return to the legitimate project, while the malicious artifact remains part of the incident history.","The article recommends that organizations using Open VSX record each extension’s ID along with its exact version, file hash, publisher identity, and source repository."],"insights":["An ID-only malicious-extension list can erase visible incident history from the current registry state once an abused name is restored to a legitimate maintainer, even though Git history still preserves the earlier listing.","Security products and internal inventories that store only extension IDs may be unable to distinguish the deleted malicious 0.0.1 packages from legitimate releases such as 0.9.0 and 1.6.0 now using the same names.","The Open VSX reclaim cases show that attackers exploited a gap between Microsoft's VS Code Marketplace and Open VSX by taking names that were established in one marketplace but not yet claimed by their real owners in the other.","Socket engineer John Tuckner’s records, as cited in the article, suggest the issue is broader than the 77-extension campaign, with 491 Open VSX IDs over the previous year matching projects in the VS Code Marketplace and 415 impersonating extensions ranked among Microsoft’s 10,000 most popular.","Open VSX introduced immutable extension versions and a preview changes feed, but the article states that its public documentation does not yet explain how consumers should treat an ID that moves from a malicious publisher to a verified legitimate owner."],"referencedReports":[{"title":"Open VSX Evil Twin Extensions","url":"https://www.manifold.security/blog/open-vsx-evil-twin-extensions","publisher":"Manifold Security","context":"The article cites Manifold Security as documenting the 77-extension evil-twin campaign that used the three Open VSX extension IDs later reclaimed by legitimate maintainers.","category":"research","primary":true}],"body":"\u003cp\u003eOpen VSX unblocked three extension IDs between August 16 and August 20 that had been used by impostors in the 77-extension evil-twin campaign documented by Manifold Security. The IDs were \u003ccode\u003eAlDuncanson.react-hooks-snippets\u003c/code\u003e, \u003ccode\u003emagne-sjaastad.opm-flow-editor-support\u003c/code\u003e, and \u003ccode\u003erumbledb.jsoniq-vscode\u003c/code\u003e. Legitimate versions of the OPM Flow Editor Support and RumbleDB JSONiq extensions are now live, while React Hooks Snippets had been unblocked but had not appeared on Open VSX as of publication.\u003c/p\u003e\n\n\u003cp\u003eThe article says the issue was caused by namesquatting across Microsoft\u0026rsquo;s VS Code Marketplace and Open VSX. Attackers took extension names that were established in Microsoft\u0026rsquo;s marketplace but had not yet been claimed by their real owners on Open VSX. The legitimate publishers were not compromised and were not involved in the campaign, and Open VSX had removed all 77 malicious packages by August 3.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that tracking malicious extensions by ID alone becomes ambiguous when a legitimate maintainer later reclaims the same ID. Open VSX\u0026rsquo;s public malicious-extension list stores extension IDs as strings without version, file hash, publisher account, repository, or date. The article recommends that organizations using Open VSX record the extension ID together with its exact version, file hash, publisher identity, and source repository so historical deny rules remain tied to the malicious artifact.\u003c/p\u003e\n"},{"n":1,"title":"The Phishing Email That Read Backwards in Its Own Source","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/css-bidi-override-source-reversal-esignature-lure-bot-check-gate","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email impersonating an e-signature notice used CSS bidirectional text rendering to make reversed source text display as normal English, bypassing simple keyword and Unicode-control-character defenses. The link chain led through trusted trackers to a malicious bot-check page, showing why defenders must compare rendered and source text and follow URLs to their final destination.","briefOverview":"\u003cp\u003eA senior executive at a national home-care services company received an email that appeared to be a routine e-signature completion notice. The message showed normal English text, including a button labeled “View Completed Document,” but the raw HTML stored the visible copy as reversed strings such as \u003ccode\u003etnemucoD detelpmoC weiV\u003c/code\u003e. The email used four inline spans with \u003ccode\u003eunicode-bidi:bidi-override; direction:rtl; display:inline-block\u003c/code\u003e to render the reversed source text as readable left-to-right copy.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that this was CSS-based bidirectional text abuse, not the better-known use of invisible Unicode control characters. Because the stored text was ordinary printable ASCII typed in reverse, character normalization or stripping directional control characters would not fix or expose the obfuscation. The technique meant a recipient saw fluent English while source-level keyword matching had no normal phrase to detect.\u003c/p\u003e\n\n\u003cp\u003eThe message was delivered through a large email service provider and passed SPF, DKIM, and ARC checks, while the display name impersonated a cloud e-signature service unrelated to the authenticated sending domain. Clicking the button led through the provider’s click tracker, then a second commercial tracking service, and finally to a shared-hosting page with a press-and-hold human-verification card that the platform scanner marked malicious. The article says Themis classified the incident as credential theft with 84 percent confidence and highlights the need to compare rendered text with stored source text and follow URL chains to their final destination.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email sent to a senior executive at a national home-care services company impersonated an e-signature completion notice with a button labeled “View Completed Document.”","The email’s HTML stored visible lure text backwards and used inline CSS with `unicode-bidi:bidi-override; direction:rtl; display:inline-block` to render the reversed text as normal English.","The article distinguishes this CSS-based bidirectional text abuse from attacks using Unicode control characters, because character normalization would not change the printable reversed text in this case.","The message passed SPF and DKIM through a large email service provider, but the sender display name impersonated a cloud e-signature service while the authenticated domain was an unrelated aged business domain.","Clicking the button led through the sending provider’s click tracker and a second commercial tracking service to a bot-check interstitial on shared hosting that the platform’s link scanner marked malicious."],"insights":["Character normalization would not help in this case because the obfuscation was not caused by invisible Unicode control characters; the email source contained ordinary printable ASCII text typed in reverse.","Defenders should compare rendered email text with stored source text, because the recipient and the scanner may effectively see different strings when CSS bidirectional overrides are used.","Inline styles containing `unicode-bidi:bidi-override` or `direction:rtl` in an otherwise left-to-right message are actionable anomalies that can be reversed and re-scored.","Stopping URL analysis at a reputable tracking service can miss the threat, because this email’s click path passed through two shared trackers before reaching the destination marked malicious.","Successful SPF, DKIM, and ARC results did not validate the displayed brand identity, because the impersonation was in the sender alias rather than the authenticated sending domain."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on phishing as an initial access vector and the human element in breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA’s phishing guidance when recommending that unexpected document notices be verified inside the application rather than through email buttons.","category":"guide","primary":false}],"body":"\u003cp\u003eA senior executive at a national home-care services company received an email that appeared to be a routine e-signature completion notice. The message showed normal English text, including a button labeled “View Completed Document,” but the raw HTML stored the visible copy as reversed strings such as \u003ccode\u003etnemucoD detelpmoC weiV\u003c/code\u003e. The email used four inline spans with \u003ccode\u003eunicode-bidi:bidi-override; direction:rtl; display:inline-block\u003c/code\u003e to render the reversed source text as readable left-to-right copy.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that this was CSS-based bidirectional text abuse, not the better-known use of invisible Unicode control characters. Because the stored text was ordinary printable ASCII typed in reverse, character normalization or stripping directional control characters would not fix or expose the obfuscation. The technique meant a recipient saw fluent English while source-level keyword matching had no normal phrase to detect.\u003c/p\u003e\n\n\u003cp\u003eThe message was delivered through a large email service provider and passed SPF, DKIM, and ARC checks, while the display name impersonated a cloud e-signature service unrelated to the authenticated sending domain. Clicking the button led through the provider’s click tracker, then a second commercial tracking service, and finally to a shared-hosting page with a press-and-hold human-verification card that the platform scanner marked malicious. The article says Themis classified the incident as credential theft with 84 percent confidence and highlights the need to compare rendered text with stored source text and follow URL chains to their final destination.\u003c/p\u003e\n"},{"n":3,"title":"Netskope Adds PQC Key Exchange to Next Gen SWG","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/netskope-adds-pqc-key-exchange-to-next-gen-swg","time":"07:01","priority":"MAY READ","score":65,"tldr":"Netskope added hybrid post-quantum key exchange support to Netskope One Next Gen SWG, using X25519MLKEM768 to protect traffic against future quantum decryption risks. The feature is available now in commercial environments as an optional tenant-level flag, with broader environment support planned.","briefOverview":"\u003cp\u003eNetskope has added support for X25519MLKEM768 to Netskope One Next Gen SWG. The article says this is a hybrid key-exchange algorithm that pairs elliptic-curve cryptography with a post-quantum method. Netskope says this helps keep a connection protected even if one of the two approaches is broken in the future.\u003c/p\u003e\n\n\u003cp\u003eThe change is presented in the context of concerns that encrypted data captured today could be stored and decrypted later once capable quantum computers exist. The article highlights data with a long shelf life, such as health records, financial history, government communications, and trade secrets. It also notes that NIST finalized its first set of post-quantum cryptography standards in 2024, including ML-KEM.\u003c/p\u003e\n\n\u003cp\u003eThe new support covers both client-to-Netskope traffic and Netskope-to-destination-server traffic. Netskope says the feature is available in commercial environments today as a tenant-level feature flag for controlled testing, with transaction events showing post-quantum cryptography use. Support for FedRAMP (US), PBMM (Canada), Data Plane on-Premises, and Virtual Private Edge is planned for future releases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope added support for X25519MLKEM768, a hybrid key-exchange algorithm, to Netskope One Next Gen SWG.","The new support covers both client-to-Netskope traffic and Netskope-to-destination-server traffic.","The feature is a tenant-level flag designed for controlled testing rather than a forced rollout.","Transaction events show post-quantum cryptography use so customers can verify when it is working.","The feature is available in commercial environments today, with support for FedRAMP (US), PBMM (Canada), Data Plane on-Premises, and Virtual Private Edge planned for future releases."],"insights":["Netskope is using a hybrid approach that keeps today’s elliptic-curve cryptography alongside a post-quantum method, so protection does not depend entirely on either method remaining unbroken.","The feature is positioned for gradual adoption because customers can enable it at the tenant level for controlled testing rather than being forced into an immediate migration.","The article treats post-quantum migration as especially urgent for organizations with long-lived sensitive data, because copied encrypted data could become readable later if quantum computers advance.","Netskope’s implementation is tied to its OpenSSL 3.5 upgrade, indicating the company is relying on native cryptographic library support rather than a separate add-on."],"referencedReports":[],"body":"\u003cp\u003eNetskope has added support for X25519MLKEM768 to Netskope One Next Gen SWG. The article says this is a hybrid key-exchange algorithm that pairs elliptic-curve cryptography with a post-quantum method. Netskope says this helps keep a connection protected even if one of the two approaches is broken in the future.\u003c/p\u003e\n\n\u003cp\u003eThe change is presented in the context of concerns that encrypted data captured today could be stored and decrypted later once capable quantum computers exist. The article highlights data with a long shelf life, such as health records, financial history, government communications, and trade secrets. It also notes that NIST finalized its first set of post-quantum cryptography standards in 2024, including ML-KEM.\u003c/p\u003e\n\n\u003cp\u003eThe new support covers both client-to-Netskope traffic and Netskope-to-destination-server traffic. Netskope says the feature is available in commercial environments today as a tenant-level feature flag for controlled testing, with transaction events showing post-quantum cryptography use. Support for FedRAMP (US), PBMM (Canada), Data Plane on-Premises, and Virtual Private Edge is planned for future releases.\u003c/p\u003e\n"},{"n":4,"title":"The Rise of Service-Centric Credential Compilations","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/the-rise-of-service-centric-credential-compilations/","time":"05:00","priority":"MAY READ","score":55,"tldr":"Cybercriminals are increasingly turning raw infostealer logs into service-specific packages that bundle credentials with cookies, tokens, and session data, making account takeover faster and more reliable. The biggest concern is AI platforms like ChatGPT, where stolen sessions can expose sensitive corporate knowledge and require defenders to protect and revoke active sessions, not just passwords.","briefOverview":"\u003cp\u003eCybercriminals are increasingly repackaging raw infostealer logs into service-specific compilations focused on platforms such as ChatGPT, Netflix, Microsoft 365, Google Workspace, and social media services. These datasets are curated packages containing information tied to a particular online service rather than random collections of credentials from infected endpoints. The article describes this as part of the professionalization of the cybercriminal ecosystem and a shift toward selling ready-to-use access instead of raw data.\u003c/p\u003e\n\n\u003cp\u003eInitial Access Brokers are playing a growing role by enriching stolen information before selling it to other criminals. These packages may combine fresh credentials with browser cookies, persistent session cookies, refresh tokens, JWTs, CSRF tokens, device identifiers, and other authentication artifacts recovered from a victim’s browser. Because these artifacts can represent an already authenticated session, attackers may be able to reuse access while the tokens remain valid, depending on the service’s authentication model.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights particular concern around AI platforms such as ChatGPT, Claude, Gemini, and other enterprise AI assistants because compromised accounts may expose sensitive corporate knowledge, proprietary source code, strategic plans, financial analysis, legal documents, internal procedures, and confidential conversations. Access to these services can support intelligence gathering, social engineering, exposure of development practices, disclosure of customer information, or visibility into strategic initiatives. The article recommends rapid session invalidation and token revocation, continuous monitoring of exposed identities, adaptive MFA and device-risk analysis, and visibility into underground marketplaces where these compilations are traded.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybercriminals are increasingly organizing raw infostealer logs into service-specific compilations focused on platforms such as ChatGPT, Netflix, Microsoft 365, Google Workspace, and social media services.","These curated packages may include credentials, browser cookies, persistent session cookies, refresh tokens, JWTs, CSRF tokens, device identifiers, and other authentication artifacts recovered from victims’ browsers.","Initial Access Brokers are enriching stolen information by combining fresh credentials from infostealer infections with browser artifacts, session cookies, and authentication tokens before selling it to other criminals.","Compromised AI platform accounts can expose sensitive corporate knowledge, proprietary source code, strategic business plans, financial analysis, legal documents, internal procedures, and confidential conversations.","The article recommends rapid session invalidation and token revocation, continuous monitoring of exposed identities, adaptive MFA and device-risk analysis, and visibility into underground marketplaces where service-centric compilations are traded."],"insights":["The criminal market is shifting from selling raw stolen data to selling ready-to-use access packages, which reduces the buyer’s effort and increases the chance of successful account compromise.","Password resets alone may be insufficient after exposure because valid browser cookies and authentication tokens can preserve access to active sessions.","AI assistant accounts are becoming especially valuable targets because their conversation histories may function as repositories of corporate intellectual property and internal business context.","Fresh stolen data can move through multiple criminal resellers within hours of the original infection, making rapid session invalidation and token revocation time-sensitive.","The article frames cookies, tokens, and active sessions as assets that require protection comparable to passwords, expanding the scope of identity security beyond traditional credentials."],"referencedReports":[],"body":"\u003cp\u003eCybercriminals are increasingly repackaging raw infostealer logs into service-specific compilations focused on platforms such as ChatGPT, Netflix, Microsoft 365, Google Workspace, and social media services. These datasets are curated packages containing information tied to a particular online service rather than random collections of credentials from infected endpoints. The article describes this as part of the professionalization of the cybercriminal ecosystem and a shift toward selling ready-to-use access instead of raw data.\u003c/p\u003e\n\n\u003cp\u003eInitial Access Brokers are playing a growing role by enriching stolen information before selling it to other criminals. These packages may combine fresh credentials with browser cookies, persistent session cookies, refresh tokens, JWTs, CSRF tokens, device identifiers, and other authentication artifacts recovered from a victim’s browser. Because these artifacts can represent an already authenticated session, attackers may be able to reuse access while the tokens remain valid, depending on the service’s authentication model.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights particular concern around AI platforms such as ChatGPT, Claude, Gemini, and other enterprise AI assistants because compromised accounts may expose sensitive corporate knowledge, proprietary source code, strategic plans, financial analysis, legal documents, internal procedures, and confidential conversations. Access to these services can support intelligence gathering, social engineering, exposure of development practices, disclosure of customer information, or visibility into strategic initiatives. The article recommends rapid session invalidation and token revocation, continuous monitoring of exposed identities, adaptive MFA and device-risk analysis, and visibility into underground marketplaces where these compilations are traded.\u003c/p\u003e\n"},{"n":6,"title":"Danglegeddon: The Full Research Report Is Now Available","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/news/danglegeddon-the-full-research-report-is-now-available/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=danglegeddon-the-full-research-report-is-now-available","time":"10:21","priority":"MAY READ","score":55,"tldr":"Silent Push has released its full Danglegeddon research report on how forgotten dangling DNS records can enable subdomain takeovers. The report explains the simulated takeover technique, attacker impact, and defender steps for SOC, IR, and CTI teams.","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push researchers ran a dangling DNS takeover simulation to demonstrate how forgotten infrastructure can become an entry point.","Silent Push has published the full findings in its latest Danglegeddon research report.","The article explains that dangling DNS records are left behind when infrastructure changes and the pointer is not cleaned up.","The report covers the takeover technique Silent Push simulated, what an attacker gains after gaining a foothold, and steps defenders can add to their playbook.","The article says the report is relevant for teams running SOC, incident response, or cyber threat intelligence workflows."],"insights":["Forgotten DNS pointers are presented as an operational cleanup failure that can directly create an attacker entry point after infrastructure changes.","The article emphasizes that attackers are already scanning for dangling DNS records and are becoming faster at finding them, making delayed cleanup increasingly risky.","Silent Push frames dangling DNS review as relevant not only to infrastructure owners but also to SOC, incident response, and cyber threat intelligence workflows.","The report is positioned as actionable because it includes both the simulated takeover technique and defender playbook steps."],"referencedReports":[],"body":""},{"n":7,"title":"How a team of entity maintainers monitors, connects and scores entities in Elastic Security","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/entity-resolution-identity-scoring-elastic-security","time":"00:00","priority":"MAY READ","score":55,"tldr":"Elastic Security’s Entity Store v2 builds continuously updated user, host, service, and generic entity records using ES|QL and background maintainers that resolve identities, map relationships, and calculate risk. The key takeaway is that downstream analytics and investigations depend on deterministic entity IDs and inspectable, correctable maintainer-driven enrichment rather than flat, one-time entity snapshots.","briefOverview":"\u003cp\u003eElastic Security’s Entity Store v2, introduced in Elastic v9.4, is built around background jobs called maintainers that continuously enrich entity records. The article explains how Elastic Security turns telemetry, identity and asset inventories, and threat detections into queryable profiles for users, hosts, services, and generic entities. This matters because baselines, risk scores, relationships, and AI reasoning depend on the quality of the underlying entity records.\u003c/p\u003e\n\n\u003cp\u003eEntity Store v2 uses ES|QL extraction cycles to filter relevant logs, aggregate events into entity records, and use LOOKUP JOIN against the existing entity index to retain previously observed attributes and behaviors. Entity identity is based on a deterministic entity unique ID derived from ordered identity fields, with user entities using namespaces such as okta, entra_id, microsoft_365, active_directory, or local to prevent collisions. The article also explains how authoritative identity data is identified, including asset inventory documents with event.kind: asset and required user identity fields.\u003c/p\u003e\n\n\u003cp\u003eMaintainers add relationships between entities, perform identity resolution, and calculate entity risk scores. Relationship maintainers identify patterns such as frequent or infrequent access, while the resolution maintainer links user accounts that share the same user.email and also supports manual link and unlink actions through the UI or API. The risk score maintainer runs hourly by default, aggregates detection alert risk scores over a rolling time window, and can calculate risk for a resolved user across linked accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security’s Entity Store v2, introduced in Elastic v9.4, is built on background jobs called maintainers that continuously enrich entity records rather than treating entities as flat records rebuilt on demand.","Entity Store v2 uses ES|QL extraction cycles that aggregate relevant logs into entity records and use LOOKUP JOIN against the existing entity index to retain previously observed attributes and behaviors.","Elastic derives each entity’s deterministic entity unique ID from ordered identity fields, with user entities also using a namespace such as okta, entra_id, microsoft_365, active_directory, or local to prevent account collisions.","Maintainers add relationships, perform identity resolution, and calculate risk scores, including linking user accounts that share the same user.email and scoring resolved users across linked accounts.","Elastic says entity store decisions are inspectable and correctable because entity state is stored as Elasticsearch documents, and users can manually link or unlink identities through the UI or API."],"insights":["Custom identity pipelines need to set event.kind: asset, populate user identity fields, and use a recognized event.module or data_stream.dataset prefix; otherwise authoritative users may land in an unknown namespace or fail to be created correctly.","Directory or inventory data should not include host.id unless it represents genuinely host-local activity, because the article says user.name plus host.id without an authoritative signal causes the identity to be treated as a local per-host user.","Elastic deliberately excludes failed login events from identity evidence, because a failed login is not treated as proof that an account exists.","A single alert can affect risk across linked identities because the resolution maintainer runs before risk scoring, allowing risk from multiple accounts belonging to the same person to roll up into one resolved user score.","The article notes a current limitation in entity risk scoring: one static alert risk score can make both the actor and the target appear equally risky, which Elastic plans to address with more entity-specific scoring."],"referencedReports":[],"body":"\u003cp\u003eElastic Security’s Entity Store v2, introduced in Elastic v9.4, is built around background jobs called maintainers that continuously enrich entity records. The article explains how Elastic Security turns telemetry, identity and asset inventories, and threat detections into queryable profiles for users, hosts, services, and generic entities. This matters because baselines, risk scores, relationships, and AI reasoning depend on the quality of the underlying entity records.\u003c/p\u003e\n\n\u003cp\u003eEntity Store v2 uses ES|QL extraction cycles to filter relevant logs, aggregate events into entity records, and use LOOKUP JOIN against the existing entity index to retain previously observed attributes and behaviors. Entity identity is based on a deterministic entity unique ID derived from ordered identity fields, with user entities using namespaces such as okta, entra_id, microsoft_365, active_directory, or local to prevent collisions. The article also explains how authoritative identity data is identified, including asset inventory documents with event.kind: asset and required user identity fields.\u003c/p\u003e\n\n\u003cp\u003eMaintainers add relationships between entities, perform identity resolution, and calculate entity risk scores. Relationship maintainers identify patterns such as frequent or infrequent access, while the resolution maintainer links user accounts that share the same user.email and also supports manual link and unlink actions through the UI or API. The risk score maintainer runs hourly by default, aggregates detection alert risk scores over a rolling time window, and can calculate risk for a resolved user across linked accounts.\u003c/p\u003e\n"},{"n":2,"title":"How Aikido finds more vulnerabilities than Claude Security at half the cost","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/aikido-finds-more-vulnerabilities-claude-security-mythos","time":"11:38","priority":"MAY READ","score":45,"tldr":"Aikido claims its Code Security Audit found more vulnerabilities than Anthropic’s Claude Security and Codex Security on the same benchmark while costing less, arguing that audit harness design and cost allocation matter more than the underlying AI model alone.","briefOverview":"\u003cp\u003eAikido compared Anthropic’s Claude Security, Aikido Code Security Audit, and Codex Security on the same private benchmark application. The benchmark contained 89 known vulnerabilities identified before the test. Claude Security with Mythos found 60 of 89 vulnerabilities for \u003cspan class=\"math inline\"\u003e\\(157, Aikido found 68 of 89 for \\)\u003c/span\u003e75, and Codex Security found 58 of 89 for $125.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that vulnerability discovery depends heavily on the system around the model, not only the model itself. Aikido says its approach uses lower-cost, smaller models for tasks they are best suited for and reserves expensive frontier reasoning for stages where it is most likely to affect the outcome. The article says this allocation allowed Aikido to spend more of its budget on breadth of investigation and achieve higher recall.\u003c/p\u003e\n\n\u003cp\u003eAikido says its additional findings included one critical issue and three high-severity issues missed by Claude Security. One example was a cross-tenant authorization flaw that let users change their organization assignment and access another organization’s data, and another was a timestamp-format mismatch that allowed expired API keys to remain valid. The article also emphasizes cost predictability, stating that Aikido provides an upfront scan estimate and adjustable coverage level, while Claude Security showed the total cost only after the scan completed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido tested Anthropic’s Claude Security, Aikido Code Security Audit, and Codex Security against the same private benchmark application with 89 known vulnerabilities.","Claude Security with Mythos found 60 of 89 vulnerabilities for $157, while Aikido’s Code Security Audit found 68 of 89 for $75 and Codex Security found 58 of 89 for $125.","Aikido found eight more vulnerabilities than Claude Security, including one critical and three high-severity issues, and ten more than Codex Security.","The article says Aikido uses lower-cost, smaller models for tasks they are suited for and reserves more expensive frontier reasoning for stages where it is more likely to affect the outcome.","The article states that Aikido provides a pre-scan cost estimate and lets users adjust coverage level before committing, while Claude Security did not provide the scan cost until after completion."],"insights":["The benchmark suggests that using the strongest available model everywhere can be less effective and more expensive than assigning cheaper models to broad exploration and reserving expensive reasoning for selected stages.","Cost predictability is presented as a practical differentiator because Claude Security’s final scan cost was only visible after completion, while Aikido let users estimate and tune coverage before committing.","Aikido’s additional findings were not limited to low-impact issues; the article says they included a critical cross-tenant authorization flaw and three high-severity issues missed by Claude Security.","The article frames vulnerability discovery as a search problem, implying that how a tool chooses leads to investigate can materially affect recall even when competing systems use highly capable models."],"referencedReports":[],"body":"\u003cp\u003eAikido compared Anthropic’s Claude Security, Aikido Code Security Audit, and Codex Security on the same private benchmark application. The benchmark contained 89 known vulnerabilities identified before the test. Claude Security with Mythos found 60 of 89 vulnerabilities for \u003cspan class=\"math inline\"\u003e\\(157, Aikido found 68 of 89 for \\)\u003c/span\u003e75, and Codex Security found 58 of 89 for $125.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that vulnerability discovery depends heavily on the system around the model, not only the model itself. Aikido says its approach uses lower-cost, smaller models for tasks they are best suited for and reserves expensive frontier reasoning for stages where it is most likely to affect the outcome. The article says this allocation allowed Aikido to spend more of its budget on breadth of investigation and achieve higher recall.\u003c/p\u003e\n\n\u003cp\u003eAikido says its additional findings included one critical issue and three high-severity issues missed by Claude Security. One example was a cross-tenant authorization flaw that let users change their organization assignment and access another organization’s data, and another was a timestamp-format mismatch that allowed expired API keys to remain valid. The article also emphasizes cost predictability, stating that Aikido provides an upfront scan estimate and adjustable coverage level, while Claude Security showed the total cost only after the scan completed.\u003c/p\u003e\n"},{"n":5,"title":"24th August – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/24th-august-threat-intelligence-report/","time":"14:07","priority":"MAY READ","score":40,"tldr":"This week’s threat intelligence highlights major data breaches, rising AI-assisted attacks, and urgent patches for critical flaws in GitLab, Cisco, Citrix, NASA/JPL software, and PTC products. Organizations should prioritize patching exposed systems and monitoring for exploitation tied to campaigns like StopAndProtect and Cl0p.","briefOverview":"\u003cp\u003eThe 24th August Threat Intelligence Report summarizes major cyber incidents, AI-related threats, vulnerabilities, and research findings from the week. Reported breaches included Latvia’s Road Traffic Safety Directorate, Sakura Internet, the Hospital for Sick Children, and Berlin government ministries. The affected data and services included payment records, customer accounts, employee and applicant information, email access, internet access, and public services.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI-related risks, including an autonomous AI agent that exploited a GitHub Actions flaw in Snowflake’s public repository and gained read access to an internal Jira system. US authorities also warned of active AI-assisted attacks targeting Siemens S7 industrial controllers across manufacturing, energy, water, and other critical sectors. Researchers also analyzed Kriminal, a publicly accessible AI platform marketed as uncensored and offering social engineering and exploit assistance through cryptocurrency subscriptions.\u003c/p\u003e\n\n\u003cp\u003eThe article also lists critical patches and research findings affecting GitLab, Cisco, Citrix, NASA/JPL, WordPress sites, Microsoft’s Windows Defender Boot-Time Removal driver, the education sector, and PTC products. GitLab fixed CVE-2026-19478, Cisco fixed nine critical vulnerabilities, Citrix patched NetScaler flaws, and NASA/JPL fixed a critical AIT-GUI issue allowing unauthenticated command execution. Check Point Research described the StopAndProtect campaign, a BTR.sys abuse technique, increased targeting of education, and a Cl0p campaign exploiting CVE-2026-12569 in PTC Windchill and FlexPLM.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Latvia’s Road Traffic Safety Directorate confirmed a breach affecting payment records of more than 1.2 million people and 200,000 organizations after attackers reportedly exploited a vulnerability in an internet-facing system.","Sakura Internet disclosed unauthorized access to rental server environments and a sales management system, with up to 1.36 million customer accounts potentially exposed and malware installed on some affected environments.","US authorities warned of active AI-assisted attacks targeting Siemens S7 industrial controllers across manufacturing, energy, water, and other critical sectors.","GitLab, Cisco, Citrix, and NASA/JPL released fixes for critical vulnerabilities affecting products including GitLab self-managed editions, Cisco Crosswork and Secure Workload, NetScaler ADC and Gateway, and AMMOS Instrument Toolkit AIT-GUI.","Check Point Research reported on the StopAndProtect campaign abusing thousands of compromised WordPress sites to distribute malware and store stolen data."],"insights":["The Snowflake demonstration shows that an autonomous AI agent could exploit a GitHub Actions flaw and exfiltrate tokens within seconds without human steering.","The Windows Defender Boot-Time Removal driver finding is notable because a Microsoft-signed remediation component could be repurposed for privileged file and registry changes during startup, and multiple versions shared a hard-coded RC4 key.","The Citrix NetScaler issue is especially actionable for environments using SAML authentication, because the critical flaw can allow unauthenticated access to affected appliances configured that way.","The StopAndProtect campaign’s operational mistakes exposed logs, screenshots, and victim IP addresses, creating an unusual visibility opportunity into how the campaign operated.","The education sector remained highly targeted ahead of the school year, with organizations averaging 4,696 weekly attacks from January through July 2026 and attackers using school-themed domains and seasonal phishing lures."],"referencedReports":[{"title":"Red Agent: Snowflake Copilot CI/CD Bug","url":"https://www.wiz.io/blog/red-agent-snowflake-copilot-cicd-bug","publisher":"Wiz","context":"The article cites Wiz research demonstrating an autonomous AI agent exploiting a GitHub Actions flaw in Snowflake’s public repository and exfiltrating tokens.","category":"research","primary":false},{"title":"Kriminal","url":"https://www.threatdown.com/blog/kriminal/","publisher":"ThreatDown","context":"The article references ThreatDown research analyzing Kriminal, a publicly accessible AI platform marketed as uncensored and offering social engineering and exploit assistance.","category":"research","primary":false},{"title":"Cl0p Returns with Custom Implant in Mass Extortion Campaign","url":"https://reliaquest.com/blog/clop-returns-with-custom-implant-in-mass-extortion-campaign/","publisher":"ReliaQuest","context":"The article cites ReliaQuest research tracking a Cl0p extortion campaign exploiting CVE-2026-12569 in PTC Windchill and FlexPLM.","category":"research","primary":false}],"body":"\u003cp\u003eThe 24th August Threat Intelligence Report summarizes major cyber incidents, AI-related threats, vulnerabilities, and research findings from the week. Reported breaches included Latvia’s Road Traffic Safety Directorate, Sakura Internet, the Hospital for Sick Children, and Berlin government ministries. The affected data and services included payment records, customer accounts, employee and applicant information, email access, internet access, and public services.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI-related risks, including an autonomous AI agent that exploited a GitHub Actions flaw in Snowflake’s public repository and gained read access to an internal Jira system. US authorities also warned of active AI-assisted attacks targeting Siemens S7 industrial controllers across manufacturing, energy, water, and other critical sectors. Researchers also analyzed Kriminal, a publicly accessible AI platform marketed as uncensored and offering social engineering and exploit assistance through cryptocurrency subscriptions.\u003c/p\u003e\n\n\u003cp\u003eThe article also lists critical patches and research findings affecting GitLab, Cisco, Citrix, NASA/JPL, WordPress sites, Microsoft’s Windows Defender Boot-Time Removal driver, the education sector, and PTC products. GitLab fixed CVE-2026-19478, Cisco fixed nine critical vulnerabilities, Citrix patched NetScaler flaws, and NASA/JPL fixed a critical AIT-GUI issue allowing unauthenticated command execution. Check Point Research described the StopAndProtect campaign, a BTR.sys abuse technique, increased targeting of education, and a Cl0p campaign exploiting CVE-2026-12569 in PTC Windchill and FlexPLM.\u003c/p\u003e\n"},{"n":9,"title":"Frontier AI Threat Landscape","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/frontier-ai-threat-landscape/","time":"16:06","priority":"MAY READ","score":35,"tldr":"Health-ISAC is offering an on-demand Palo Alto Networks webinar on how frontier AI is changing cybercriminal tactics and what organizations should expect in the evolving AI-enabled threat landscape. The session focuses on practical threat intelligence and resilience guidance for healthcare and related organizations.","briefOverview":"\u003cp\u003eHealth-ISAC published an article for a recorded webinar titled “Frontier AI Threat Landscape” dated August 24, 2026. The webinar is from Health-ISAC Visionary Palo Alto Networks. The article provides a link to view the session on demand.\u003c/p\u003e\n\n\u003cp\u003eThe presentation explores Palo Alto Networks’ view into AI-enabled threats. It includes experience with Frontier AI and Project Glasswing. The session describes the evolving strategies of cybercriminals and provides a forward-looking perspective on emerging threats.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations should anticipate changes in the AI-enabled threat landscape in the coming months and years. It states that the session uses real-world examples and the latest threat intelligence. Attendees are expected to gain a broader understanding of the risk landscape and actionable advice for enhancing cyber resilience.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The presentation explores Palo Alto Networks’ view of AI-enabled threats, including experience with Frontier AI and Project Glasswing.","The session describes the evolving strategies of cybercriminals in an AI-enabled threat landscape.","The article says the webinar offers a forward-looking perspective on emerging threats that organizations should anticipate in the coming months and years.","The session uses real-world examples and recent threat intelligence to help attendees understand the broader risk landscape.","Health-ISAC provides an on-demand recording of the webinar from Palo Alto Networks."],"insights":["Organizations are being advised to plan not only for current AI-enabled threats but also for changes expected over the coming months and years.","The webinar frames AI-enabled threats as a resilience issue, emphasizing preparation and defensive improvement rather than only awareness of attacker behavior.","The session combines real-world examples with recent threat intelligence, indicating that its guidance is intended to be practical rather than purely theoretical."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published an article for a recorded webinar titled “Frontier AI Threat Landscape” dated August 24, 2026. The webinar is from Health-ISAC Visionary Palo Alto Networks. The article provides a link to view the session on demand.\u003c/p\u003e\n\n\u003cp\u003eThe presentation explores Palo Alto Networks’ view into AI-enabled threats. It includes experience with Frontier AI and Project Glasswing. The session describes the evolving strategies of cybercriminals and provides a forward-looking perspective on emerging threats.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations should anticipate changes in the AI-enabled threat landscape in the coming months and years. It states that the session uses real-world examples and the latest threat intelligence. Attendees are expected to gain a broader understanding of the risk landscape and actionable advice for enhancing cyber resilience.\u003c/p\u003e\n"}]</script>
