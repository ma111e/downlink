<script type="application/json" id="dl-articles">[{"n":1,"title":"Socket Is Sponsoring Composer and Packagist","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/socket-sponsoring-composer-and-packagist?utm_medium=feed","time":"07:02","priority":"MAY READ","score":45,"tldr":"Socket is joining the new Composer and Packagist sponsorship program to help fund the operations and security work behind PHP’s package registry. The support comes as Packagist faces rising usage, more supply chain attacks, and plans for stronger defenses like mandatory MFA, transparency logs, and signed provenance.","briefOverview":"\u003cp\u003eSocket is a launch sponsor of the new Composer and Packagist sponsorship program announced by Nils Adermann, Jordi Boggiano, and the team that maintains PHP\u0026rsquo;s package infrastructure. The program expands Packagist\u0026rsquo;s funding beyond Private Packagist and donated infrastructure for the first time. The article says Packagist is facing rising usage, more frequent and sophisticated supply chain attacks, expanding regulatory and compliance requirements, and increased consumption and attacks accelerated by AI.\u003c/p\u003e\n\n\u003cp\u003eThe sponsorship money supports the work needed to keep Packagist running, including around-the-clock operations, publisher support, emergency response to attacks, ongoing maintenance, and engineering for new supply chain defenses. Socket says it has worked with the Packagist team during several supply chain attacks, including the Mini Shai-Hulud incident involving \u003ccode\u003eintercom/intercom-php\u003c/code\u003e, eight Composer packages hiding an install hook in \u003ccode\u003epackage.json\u003c/code\u003e, and the Laravel-Lang backdoor across more than 700 versions. The article emphasizes the Packagist team\u0026rsquo;s responsiveness during incidents, including nights and weekends.\u003c/p\u003e\n\n\u003cp\u003ePackagist has already added several defenses, including making stable versions on Packagist.org immutable, building a public transparency log of package changes, and shipping a unified dependency policy framework in Composer 2.10. The article says future work includes mandatory MFA, organizational package ownership, and signed build provenance for installed packages. Socket says it is supporting Packagist because registries act as stewards of community-created work and encourages other companies that build on Packagist to do the same.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket is a launch sponsor of the new Composer and Packagist sponsorship program announced by Nils Adermann, Jordi Boggiano, and the Packagist team.","Packagist is expanding its funding beyond Private Packagist and donated infrastructure because usage is rising, supply chain attacks are increasing, and compliance requirements are expanding.","The sponsorship money funds around-the-clock operations, publisher support, emergency response to attacks, ongoing maintenance, and engineering for new supply chain defenses.","Socket worked with the Packagist team on several supply chain attacks, including incidents involving intercom/intercom-php, eight Composer packages hiding an install hook in package.json, and the Laravel-Lang backdoor.","The Packagist team has made stable versions on Packagist.org immutable, built a public transparency log of package changes, and shipped a unified dependency policy framework in Composer 2.10."],"insights":["Packagist’s maintainers are treating registry security as a shared ecosystem responsibility by seeking funding from companies that build on the registry, rather than relying mainly on their own commercial product and donated infrastructure.","The article highlights that real-time coordination between external security researchers and registry maintainers was important during multiple PHP supply chain incidents, including the intercom/intercom-php compromise and the Laravel-Lang backdoor.","Packagist is moving beyond reactive incident response by adding structural protections such as immutable stable versions, a public package-change transparency log, and dependency policy controls in Composer 2.10.","The planned additions of mandatory MFA, organizational package ownership, and signed build provenance show that Packagist is prioritizing protections around publisher identity, ownership, and trust in installed code."],"referencedReports":[],"body":"\u003cp\u003eSocket is a launch sponsor of the new Composer and Packagist sponsorship program announced by Nils Adermann, Jordi Boggiano, and the team that maintains PHP\u0026rsquo;s package infrastructure. The program expands Packagist\u0026rsquo;s funding beyond Private Packagist and donated infrastructure for the first time. The article says Packagist is facing rising usage, more frequent and sophisticated supply chain attacks, expanding regulatory and compliance requirements, and increased consumption and attacks accelerated by AI.\u003c/p\u003e\n\n\u003cp\u003eThe sponsorship money supports the work needed to keep Packagist running, including around-the-clock operations, publisher support, emergency response to attacks, ongoing maintenance, and engineering for new supply chain defenses. Socket says it has worked with the Packagist team during several supply chain attacks, including the Mini Shai-Hulud incident involving \u003ccode\u003eintercom/intercom-php\u003c/code\u003e, eight Composer packages hiding an install hook in \u003ccode\u003epackage.json\u003c/code\u003e, and the Laravel-Lang backdoor across more than 700 versions. The article emphasizes the Packagist team\u0026rsquo;s responsiveness during incidents, including nights and weekends.\u003c/p\u003e\n\n\u003cp\u003ePackagist has already added several defenses, including making stable versions on Packagist.org immutable, building a public transparency log of package changes, and shipping a unified dependency policy framework in Composer 2.10. The article says future work includes mandatory MFA, organizational package ownership, and signed build provenance for installed packages. Socket says it is supporting Packagist because registries act as stewards of community-created work and encourages other companies that build on Packagist to do the same.\u003c/p\u003e\n"}]</script>
