<script type="application/json" id="dl-articles">[{"n":2,"title":"EtherHiding in the Browser: ClickFix Chain Ends in Amatera","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/etherhiding-in-the-browser-clickfix-chain-ends-in-amatera","time":"14:59","priority":"MUST READ","score":92,"tldr":"Netskope analyzed a WordPress mass-compromise campaign where a rogue must-use plugin registers a persistent browser Service Worker that strips CSP and pulls a fake reCAPTCHA payload from a Base smart contract, leading victims through a ClickFix chain to the Amatera password stealer. The key takeaway is that defenders must remove malicious Service Workers and monitor/block the on-chain and network infrastructure, because the payload can rotate without leaving traditional files or servers to seize.","briefOverview":"\u003cp\u003eNetskope Threat Labs tracked a WordPress mass-compromise campaign affecting hundreds of sites. A rogue must-use plugin registers a malicious Service Worker in visitors’ browsers, and that worker strips the site’s Content-Security-Policy header before injecting a script. The injected script reads its payload from a smart contract on Base and ultimately serves a fake reCAPTCHA that tells Windows visitors to paste and run a command.\u003c/p\u003e\n\n\u003cp\u003eThe campaign is significant because it combines Service Worker persistence, EtherHiding, fake reCAPTCHA, ClickFix, a disguised polyglot file, mshta abuse, fileless PowerShell, a steganographic image loader, reflective loading, and the Amatera password stealer. Netskope said it had not previously seen a Service Worker resolve its payload from a smart contract. The design leaves few durable artifacts to act on, with no stable file to hash, no server to seize, and payload details that can be changed on-chain.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain continues when the victim runs \u003ccode\u003emshta http://timelevel12[.]com/big\u003c/code\u003e, which retrieves an MP3/HTA polyglot and creates a hidden scheduled task that launches PowerShell. Later stages include the Emmenhtal loader, a steganographic JPEG hosted on a legitimate image CDN, and an in-memory PE loader. The final payload is Amatera, a password stealer disguised as \u003ccode\u003eWPA.exe\u003c/code\u003e, which beacons to \u003ccode\u003egw.proxyvector[.]cc\u003c/code\u003e over TLS and uses DNS-over-HTTPS for C2 lookups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Threat Labs tracked a WordPress mass-compromise campaign in which a rogue must-use plugin registers a malicious Service Worker in visitors’ browsers.","The Service Worker strips Content-Security-Policy headers, injects a script carrying the Base contract address, and avoids showing the lure to logged-in WordPress users, wp-admin, wp-login.php, or visitors with the operator’s nc_skip cookie.","The injected script reads fake reCAPTCHA HTML from the Base smart contract 0x58460d0b3d4d6b03761c89120393c0c676676496, which acts as a mutable on-chain payload and script registry.","The fake reCAPTCHA uses ClickFix to copy the command mshta http://timelevel12[.]com/big to the Windows clipboard and instruct the visitor to run it through the Windows Run dialog.","The chain proceeds through an MP3/HTA polyglot, a scheduled task and fileless PowerShell stage, the Emmenhtal loader with a steganographic image payload, and finally the Amatera password stealer using DNS-over-HTTPS for C2 lookups."],"insights":["The campaign deliberately hides the fake reCAPTCHA from logged-in WordPress users, wp-admin, and wp-login.php, meaning the site administrator is less likely to notice the compromise while ordinary logged-out visitors remain exposed.","Cleaning the compromised WordPress server is not sufficient because the malicious Service Worker can persist in visitors’ browsers until it is explicitly unregistered and its caches are deleted.","The Base smart contract lets the operator change downstream payload locations without modifying the compromised websites, so watching the contract is an actionable way to detect payload rotation.","The chain minimizes durable artifacts by combining on-chain payload delivery, ClickFix, fileless PowerShell, a steganographic image on a legitimate CDN, and reflective loading, leaving few conventional files, hashes, or servers for defenders to act on.","The article identifies the EtherHiding Service Worker lane and the inline WordPress injection lane as one campaign because they share the same Base contract, ultraspeed[.]pro/collect beacon, on-chain scripts, and runtime logic."],"referencedReports":[{"title":"Unveiling ErrTraffic: Inside a Growing ClickFix Malware Distribution Framework","url":"https://blog.sekoia.io/unveiling-errtraffic-inside-a-growing-clickfix-malware-distribution-framework","publisher":"Sekoia","context":"The article cites this as an in-depth profile of the ErrTraffic Malware-as-a-Service ecosystem that matches the WordPress compromise pattern.","category":"research","primary":false},{"title":"Abusing the Service Workers API","url":"https://www.akamai.com/blog/security/abusing-the-service-workers-api","publisher":"Akamai","context":"The article references this as prior documentation that Service Worker abuse for persistence is an established technique.","category":"research","primary":false},{"title":"Hijacking Service Workers via DOM Clobbering","url":"https://portswigger.net/research/hijacking-service-workers-via-dom-clobbering","publisher":"PortSwigger","context":"The article cites this research to note that a hijacked Service Worker can defeat Content-Security-Policy.","category":"research","primary":false},{"title":"Current ClickFix Threat Landscape Developments","url":"https://rhisac.org/threat-intelligence/current-clickfix-threat-landscape-developments/","publisher":"RH-ISAC","context":"The article cites RH-ISAC’s landscape reporting to support that ClickFix use as an initial-access method has grown sharply.","category":"research","primary":false},{"title":"WebDAV as a Service: Uncovering the Infrastructure Behind Emmenhtal Loader Distribution","url":"https://blog.sekoia.io/webdav-as-a-service-uncovering-the-infrastructure-behind-emmenhtal-loader-distribution/","publisher":"Sekoia","context":"The article links to this technical analysis when identifying the stage-3 component as the Emmenhtal loader.","category":"research","primary":false},{"title":"Amatera Stealer: Rebranded ACR Stealer with Improved Evasion Sophistication","url":"https://www.proofpoint.com/us/blog/threat-insight/amatera-stealer-rebranded-acr-stealer-improved-evasion-sophistication","publisher":"Proofpoint","context":"The article cites Proofpoint for identifying Amatera as a rebrand of ACR Stealer, also known as AcridRain.","category":"research","primary":false}],"body":"\u003cp\u003eNetskope Threat Labs tracked a WordPress mass-compromise campaign affecting hundreds of sites. A rogue must-use plugin registers a malicious Service Worker in visitors’ browsers, and that worker strips the site’s Content-Security-Policy header before injecting a script. The injected script reads its payload from a smart contract on Base and ultimately serves a fake reCAPTCHA that tells Windows visitors to paste and run a command.\u003c/p\u003e\n\n\u003cp\u003eThe campaign is significant because it combines Service Worker persistence, EtherHiding, fake reCAPTCHA, ClickFix, a disguised polyglot file, mshta abuse, fileless PowerShell, a steganographic image loader, reflective loading, and the Amatera password stealer. Netskope said it had not previously seen a Service Worker resolve its payload from a smart contract. The design leaves few durable artifacts to act on, with no stable file to hash, no server to seize, and payload details that can be changed on-chain.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain continues when the victim runs \u003ccode\u003emshta http://timelevel12[.]com/big\u003c/code\u003e, which retrieves an MP3/HTA polyglot and creates a hidden scheduled task that launches PowerShell. Later stages include the Emmenhtal loader, a steganographic JPEG hosted on a legitimate image CDN, and an in-memory PE loader. The final payload is Amatera, a password stealer disguised as \u003ccode\u003eWPA.exe\u003c/code\u003e, which beacons to \u003ccode\u003egw.proxyvector[.]cc\u003c/code\u003e over TLS and uses DNS-over-HTTPS for C2 lookups.\u003c/p\u003e\n"},{"n":5,"title":"19 Chrome and Edge Extensions Deliver a Wallet Drainer and Credential-Stealing Payloads","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/chrome-edge-extension-wallet-drainer?utm_medium=feed","time":"16:01","priority":"MUST READ","score":92,"tldr":"Socket found 19 malicious Chrome and Edge extensions, including some acquired from legitimate developers, that use a shared malware framework to steal credentials, hijack crypto wallets, phish seed phrases, and drain funds. The biggest risk is trusted browser extensions being silently weaponized through auto-updates, exposing tens of thousands of users.","briefOverview":"\u003cp\u003eSocket Threat Research identified 18 Chrome extensions and 1 Edge extension that share similar malicious code and operational techniques. The malicious versions were published in the last six months, though the campaign is connected through code and technique similarities to activity dating back to February 2024. The extensions include SEO stats checkers, crypto price monitors, screen search utilities, and ad spying tools.\u003c/p\u003e\n\n\u003cp\u003eThe extensions first appeared with their advertised functionality and no malware, then later introduced malicious behavior after trust was established. Five of the identified extensions were bought from legitimate authors, including “Enable Right Click \u0026amp; Copy — Smart Unlock + OCR,” which had around 70,000 Chrome users when malicious functionality was introduced. Together with the related Edge extension, the potential exposure surface was about 80,000 users, and the Edge version was still active and serving malware at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe malware creates a WebSocket communication channel with command-and-control servers, stores downloaded JavaScript modules in Chrome extension local storage, and encrypts communication using AES-GCM. It strips Content Security Policy headers from visited pages and injects malicious JavaScript through hidden page elements to execute payloads. Observed modules include wallet drainers, Ledger and Trezor seed-phrase phishing, exchange and wallet account harvesters, a universal credential form grabber, social-media theft, browser-history exfiltration, and fake browser-update lures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket Threat Research identified 18 Chrome extensions and 1 Edge extension published in malicious versions within the last six months that share similar malicious code and operational techniques.","The extensions first provided their advertised functionality without malware, then later introduced malicious behavior after establishing user trust, including five extensions that were bought from legitimate authors.","The malware creates WebSocket communication with command-and-control servers, strips Content Security Policy headers, and injects downloaded JavaScript modules into visited webpages.","Observed malicious modules include multi-chain wallet drainers, hardware-wallet seed-phrase phishing for Ledger and Trezor users, exchange and wallet account harvesters, a universal credential form grabber, social-media theft, browser-history exfiltration, and fake browser-update lures.","The “Enable Right Click \u0026 Copy — Smart Unlock + OCR” Chrome extension and its Edge counterpart had a potential combined exposure surface of about 80,000 users, and the Edge version was still active and serving malware at the time of writing."],"insights":["The campaign’s most impactful tactic is not only creating malicious extensions, but buying already trusted extensions with existing user bases and then weaponizing them through normal browser auto-updates.","The malware separates its loading framework from its final payloads, allowing the same extension framework to receive changing malicious modules over time while reducing detection risk.","The campaign can rotate command-and-control endpoints and use separate per-victim exfiltration channels based on server instructions, making takedown of a single domain less disruptive to the operation.","Ownership changes for browser extensions are not surfaced to users, which leaves people unaware when an extension they previously trusted has become riskier.","The Edge version of the acquired right-click extension changed to a new command-and-control domain after the Chrome version was removed, showing the operator continued adapting even after detection."],"referencedReports":[{"title":"Hidden Threats of Dual-Function Malware Found in Chrome Extensions","url":"https://dti.domaintools.com/research/hidden-threats-of-dual-function-malware-found-in-chrome-extensions","publisher":"DomainTools","context":"The article says the campaign was initially reported by DomainTools and uses similarities with that research to trace the campaign back to February 2024.","category":"research","primary":false},{"title":"Pixel Perfect","url":"https://annex.security/blog/pixel-perfect/","publisher":"Secure Annex","context":"The article says malware from the same campaign was previously described in a Secure Annex research investigation.","category":"research","primary":false}],"body":"\u003cp\u003eSocket Threat Research identified 18 Chrome extensions and 1 Edge extension that share similar malicious code and operational techniques. The malicious versions were published in the last six months, though the campaign is connected through code and technique similarities to activity dating back to February 2024. The extensions include SEO stats checkers, crypto price monitors, screen search utilities, and ad spying tools.\u003c/p\u003e\n\n\u003cp\u003eThe extensions first appeared with their advertised functionality and no malware, then later introduced malicious behavior after trust was established. Five of the identified extensions were bought from legitimate authors, including “Enable Right Click \u0026amp; Copy — Smart Unlock + OCR,” which had around 70,000 Chrome users when malicious functionality was introduced. Together with the related Edge extension, the potential exposure surface was about 80,000 users, and the Edge version was still active and serving malware at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe malware creates a WebSocket communication channel with command-and-control servers, stores downloaded JavaScript modules in Chrome extension local storage, and encrypts communication using AES-GCM. It strips Content Security Policy headers from visited pages and injects malicious JavaScript through hidden page elements to execute payloads. Observed modules include wallet drainers, Ledger and Trezor seed-phrase phishing, exchange and wallet account harvesters, a universal credential form grabber, social-media theft, browser-history exfiltration, and fake browser-update lures.\u003c/p\u003e\n"},{"n":4,"title":"Cleartext Credential Recovery in ServiceNow","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/08/27/cleartext-credential-recovery-servicenow/","time":"16:00","priority":"SHOULD READ","score":78,"tldr":"The article shows that highly privileged ServiceNow users can modify or create Script Includes to make the platform return cleartext Discovery and LDAP credentials, including passwords, SSH keys, cloud secrets, and service principal credentials. The technique requires significant roles such as discovery_admin or script_include_admin but expands known ServiceNow post-exploitation paths beyond credential coercion or relay.","briefOverview":"\u003cp\u003eThe article describes a technique for recovering cleartext credentials from ServiceNow by using script includes. The author focused on whether ServiceNow could be influenced to return cleartext discovery credentials or secrets to the client, especially non-Windows credentials that are not covered by previously documented forced authentication and relay approaches. In the author’s test environment, the method worked for all credential types stored in the \u003ccode\u003ediscovery_credentials\u003c/code\u003e table, including Windows credentials, SSH private keys, Entra ID service principal secrets, AWS keys, and others.\u003c/p\u003e\n\n\u003cp\u003eThe discovery credential technique involves modifying the \u003ccode\u003eCredentialTestAjax\u003c/code\u003e script include, which is normally used by the “Test Credential” function. By adding an early return in the \u003ccode\u003etestCredential\u003c/code\u003e function after credential decryption, the server sent the decrypted credential object back to the client in the HTTP response instead of only using it for validation through a MID server. The article states that this requires significant permissions, including the ability to execute \u003ccode\u003eCredentialTestAjax\u003c/code\u003e, modify records in \u003ccode\u003esys_script_include\u003c/code\u003e, and read at least part of the \u003ccode\u003ediscovery_credentials\u003c/code\u003e table; in the author’s environment, the \u003ccode\u003ediscovery_admin\u003c/code\u003e role satisfied these requirements.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers LDAP credentials stored in ServiceNow’s \u003ccode\u003eldap_server_config\u003c/code\u003e table. Unlike discovery credentials, the relevant LDAP script include did not already contain decryption code, so the author describes creating a new script include that calls \u003ccode\u003egetDecryptedValue()\u003c/code\u003e on the Password2 password field to return cleartext LDAP connection passwords. The article says this requires the ability to create or modify a script include and execute it, which by default requires the \u003ccode\u003escript_include_admin\u003c/code\u003e role, and notes that this can be less privileged than using the traditional forced authentication path that requires \u003ccode\u003eadmin\u003c/code\u003e to execute \u003ccode\u003eLDAPClientUtils\u003c/code\u003e by default.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes a method for using ServiceNow script includes to return cleartext credential data for any credential type stored in the discovery_credentials table and for LDAP credential records.","The technique for discovery credentials modifies the CredentialTestAjax script include so that its testCredential function returns decrypted credential JSON to the client before running the normal credential test logic.","In the author’s test environment, the discovery credential recovery method worked for Windows credentials, SSH private keys and passphrases, Entra ID service principal secrets, AWS keys, and other discovery credential types.","Recovering discovery credentials required permission to execute CredentialTestAjax, modify the sys_script_include record, and read at least part of the discovery_credentials table; the article states that the discovery_admin role satisfied these requirements in the author’s environment.","For LDAP credentials, the article describes creating a script include that reads ldap_server_config records and calls getDecryptedValue() on the Password2 password field to return cleartext LDAP connection passwords."],"insights":["The discovery credential method works even for credential types that do not expose a “Test Credential” button in the ServiceNow web interface, including SSH private keys, Entra ID service principal secrets, and AWS keys.","The article states that discovery_admin includes script_include_admin by default in the author’s environment, meaning one role can satisfy both the ability to run the relevant credential-testing code and modify the script include that returns decrypted data.","The LDAP credential recovery path can require less default privilege than the previously documented forced-authentication method, because creating or modifying a script include requires script_include_admin while executing LDAPClientUtils requires admin by default.","Although discovery credential secret fields are also stored as Password2 values, the article notes that calling getDecryptedValue() on them did not return cleartext values, unlike the LDAP password field."],"referencedReports":[{"title":"Red Teaming with ServiceNow","url":"https://www.mdsec.co.uk/2025/03/red-teaming-with-servicenow/","publisher":"MDSec","context":"The article recommends reading Tim Carrington’s MDSec blog first and builds on its documented ServiceNow post-exploitation techniques, including credential coercion and LDAP listener methods.","category":"research","primary":true}],"body":"\u003cp\u003eThe article describes a technique for recovering cleartext credentials from ServiceNow by using script includes. The author focused on whether ServiceNow could be influenced to return cleartext discovery credentials or secrets to the client, especially non-Windows credentials that are not covered by previously documented forced authentication and relay approaches. In the author’s test environment, the method worked for all credential types stored in the \u003ccode\u003ediscovery_credentials\u003c/code\u003e table, including Windows credentials, SSH private keys, Entra ID service principal secrets, AWS keys, and others.\u003c/p\u003e\n\n\u003cp\u003eThe discovery credential technique involves modifying the \u003ccode\u003eCredentialTestAjax\u003c/code\u003e script include, which is normally used by the “Test Credential” function. By adding an early return in the \u003ccode\u003etestCredential\u003c/code\u003e function after credential decryption, the server sent the decrypted credential object back to the client in the HTTP response instead of only using it for validation through a MID server. The article states that this requires significant permissions, including the ability to execute \u003ccode\u003eCredentialTestAjax\u003c/code\u003e, modify records in \u003ccode\u003esys_script_include\u003c/code\u003e, and read at least part of the \u003ccode\u003ediscovery_credentials\u003c/code\u003e table; in the author’s environment, the \u003ccode\u003ediscovery_admin\u003c/code\u003e role satisfied these requirements.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers LDAP credentials stored in ServiceNow’s \u003ccode\u003eldap_server_config\u003c/code\u003e table. Unlike discovery credentials, the relevant LDAP script include did not already contain decryption code, so the author describes creating a new script include that calls \u003ccode\u003egetDecryptedValue()\u003c/code\u003e on the Password2 password field to return cleartext LDAP connection passwords. The article says this requires the ability to create or modify a script include and execute it, which by default requires the \u003ccode\u003escript_include_admin\u003c/code\u003e role, and notes that this can be less privileged than using the traditional forced authentication path that requires \u003ccode\u003eadmin\u003c/code\u003e to execute \u003ccode\u003eLDAPClientUtils\u003c/code\u003e by default.\u003c/p\u003e\n"},{"n":1,"title":"How to build an exposure management program the business trusts: Lessons from Tenable’s CSO","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/how-to-build-an-exposure-management-program-the-business-trusts-lessons-from-tenables-cso","time":"14:30","priority":"MAY READ","score":45,"tldr":"Tenable’s CSO says shifting from siloed security tools and technical metrics to a unified exposure management program helped the company prioritize risk by business impact and give executives clearer answers about security posture. The key takeaway is that CISOs need consolidated, business-contextual risk data to build trust with boards and operational teams, especially as AI expands the attack surface.","briefOverview":"\u003cp\u003eTenable’s CSO Robert Huber describes how the company shifted to an AI-driven exposure management program to address security tool sprawl, fragmented data, and siloed teams. He says Tenable’s security organization managed around 50 different tools, each with separate views, workflows, metrics, and reporting. This made it difficult to assess cyber risk holistically and to explain security posture clearly to the C-suite and board.\u003c/p\u003e\n\n\u003cp\u003eHuber says board members generally wanted answers to two questions: whether Tenable was secure and how it compared to peers. The company’s previous reporting relied heavily on operational metrics such as vulnerability counts and scanned assets, which did not translate clearly into business impact. Tenable’s exposure management approach aims to connect security findings to business units, revenue streams, and prioritized actions that reduce risk.\u003c/p\u003e\n\n\u003cp\u003eTenable broadened its vulnerability management team into an exposure management team covering traditional CVEs, misconfigurations, identity weaknesses, cloud workloads, AI tools, on-prem assets, and the application development pipeline. The company chose not to build its own security data warehouse and instead adopted a SaaS-based approach, later acquiring Vulcan Cyber and making it part of the Tenable One Exposure Management Platform. Huber says the resulting program uses simplified red, yellow, and green metrics, asset tagging, automated identification of systemic issues, and customized SLAs to give business and technical teams a more trusted view of cyber exposure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tenable’s CSO Robert Huber says security tool sprawl and data silos made it difficult to assess the company’s cyber risk holistically and communicate it clearly to business leaders.","Tenable shifted from a vulnerability management team to an exposure management team with a broader mandate covering issues such as misconfigurations and identity weaknesses across identity systems, cloud workloads, AI tools, on-prem assets, and the application development pipeline.","Tenable chose not to build its own data warehouse for security risk data and instead selected a SaaS solution, later acquiring Vulcan Cyber and making it part of the Tenable One Exposure Management Platform.","The exposure management approach lets Tenable present simplified red, yellow, and green cyber exposure metrics for lines of business and tie assets to business units and revenue streams.","Huber argues that unified exposure management helps replace fragmented reports and operational metrics with prioritized actions that reduce risk and are easier for the C-suite, board, and business teams to trust."],"insights":["Tenable’s exposure management shift did not require increased headcount; the company centralized triage while allowing specialized teams like cloud security and application security to spend less time chasing remediation and more time securing deployments.","Huber’s board reporting problem was not a lack of metrics but an excess of operational metrics that failed to answer the board’s two core questions: whether Tenable was secure and how it compared to peers.","Tenable decided against building its own security data warehouse because Huber viewed the infrastructure, data, and staffing costs as outside the company’s core competency and likely to become expensive quickly.","Tenable’s use of asset tagging to connect infrastructure to business units and revenue streams made it possible to prioritize security work by business impact rather than by raw vulnerability counts.","The article frames unpatchable assets as systemic root-cause issues to be flagged and managed, rather than simply adding their individual vulnerabilities to a remediation list."],"referencedReports":[],"body":"\u003cp\u003eTenable’s CSO Robert Huber describes how the company shifted to an AI-driven exposure management program to address security tool sprawl, fragmented data, and siloed teams. He says Tenable’s security organization managed around 50 different tools, each with separate views, workflows, metrics, and reporting. This made it difficult to assess cyber risk holistically and to explain security posture clearly to the C-suite and board.\u003c/p\u003e\n\n\u003cp\u003eHuber says board members generally wanted answers to two questions: whether Tenable was secure and how it compared to peers. The company’s previous reporting relied heavily on operational metrics such as vulnerability counts and scanned assets, which did not translate clearly into business impact. Tenable’s exposure management approach aims to connect security findings to business units, revenue streams, and prioritized actions that reduce risk.\u003c/p\u003e\n\n\u003cp\u003eTenable broadened its vulnerability management team into an exposure management team covering traditional CVEs, misconfigurations, identity weaknesses, cloud workloads, AI tools, on-prem assets, and the application development pipeline. The company chose not to build its own security data warehouse and instead adopted a SaaS-based approach, later acquiring Vulcan Cyber and making it part of the Tenable One Exposure Management Platform. Huber says the resulting program uses simplified red, yellow, and green metrics, asset tagging, automated identification of systemic issues, and customized SLAs to give business and technical teams a more trusted view of cyber exposure.\u003c/p\u003e\n"},{"n":3,"title":"Why SpecterOps Signed OpenAI’s Call for Collective Cyber Defense","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/08/27/specterops-openai-collective-cyber-defense/","time":"17:45","priority":"MAY READ","score":45,"tldr":"SpecterOps signed OpenAI’s collective cyber defense letter, arguing that AI will accelerate exploitation of existing identity, permission, and configuration weaknesses, so defenders need broader access to advanced AI and better attack-path visibility. The company frames transparency, shared tools like BloodHound, and governed defensive AI workflows as key to reducing real-world cyber risk.","briefOverview":"\u003cp\u003eSpecterOps signed OpenAI’s call for collective action on cyber defense because it agrees with the principles that existing weaknesses already exist, advanced AI needs to reach more defenders, and the response must be collective and widespread. The company says AI-enabled attackers will exploit issues such as excessive permissions, misconfigurations, legacy systems, and accumulated trust relationships. It argues that AI will increase the speed of discovery and exploitation, giving defenders less time to understand findings before attackers can use them.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that attackers still need paths to important assets through networks of identities, permissions, applications, systems, and trust relationships. SpecterOps says Identity Attack Path Management helps teams see how attackers could move through an environment, identify meaningful choke points, and remove paths to critical assets. It also notes that AI agents add more identities, delegated permissions, data access, and system connections to that graph.\u003c/p\u003e\n\n\u003cp\u003eSpecterOps connects this position to its history with PowerShell tradecraft, PowerView, BloodHound, open-source tools, research, and training. It says publishing attacker behavior helped defenders reproduce techniques, test controls, build detections, and teach others what to look for. The company says its participation in the OpenAI Daybreak Cyber Partner Program reflects its goal of applying frontier AI in governed defensive workflows while sharing lessons through research, tools, training, and practical guidance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps signed OpenAI’s call for collective action on cyber defense because it agrees that existing weaknesses already exist, advanced AI needs to reach more defenders, and the response must be collective and widespread.","The article says AI-enabled attackers will exploit existing issues such as excessive permissions, misconfigurations, legacy systems, and accumulated trust relationships, increasing the speed of discovery and exploitation.","SpecterOps argues that Identity Attack Path Management helps security teams see how an attacker could move through an environment, identify choke points, and remove paths to critical assets.","The article describes PowerView and BloodHound as examples of how publishing attacker tradecraft and making permission and trust relationships visible helped defenders study behavior, test controls, and decide where to intervene.","SpecterOps says its participation in the OpenAI Daybreak Cyber Partner Program is focused on applying frontier AI capabilities in governed defensive workflows and sharing lessons through research, tools, training, and practical guidance."],"insights":["SpecterOps frames the core board-level metric for cyber defense as the number of dangerous paths to the organization’s most important assets that have been eliminated.","The article argues that seemingly minor configuration issues become dangerous when they connect with other identities, permissions, applications, systems, and trust relationships.","SpecterOps presents its PowerShell and BloodHound history as evidence that exposing attacker methods can improve defense by giving practitioners concrete behavior to reproduce, detect, and teach.","The article emphasizes that wider defender access to advanced AI should come with authorization, safeguards, accountable use, and human responsibility for consequential decisions.","SpecterOps identifies AI agents themselves as additions to the enterprise identity and permission graph because they bring more identities, delegated permissions, data access, and system connections."],"referencedReports":[],"body":"\u003cp\u003eSpecterOps signed OpenAI’s call for collective action on cyber defense because it agrees with the principles that existing weaknesses already exist, advanced AI needs to reach more defenders, and the response must be collective and widespread. The company says AI-enabled attackers will exploit issues such as excessive permissions, misconfigurations, legacy systems, and accumulated trust relationships. It argues that AI will increase the speed of discovery and exploitation, giving defenders less time to understand findings before attackers can use them.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that attackers still need paths to important assets through networks of identities, permissions, applications, systems, and trust relationships. SpecterOps says Identity Attack Path Management helps teams see how attackers could move through an environment, identify meaningful choke points, and remove paths to critical assets. It also notes that AI agents add more identities, delegated permissions, data access, and system connections to that graph.\u003c/p\u003e\n\n\u003cp\u003eSpecterOps connects this position to its history with PowerShell tradecraft, PowerView, BloodHound, open-source tools, research, and training. It says publishing attacker behavior helped defenders reproduce techniques, test controls, build detections, and teach others what to look for. The company says its participation in the OpenAI Daybreak Cyber Partner Program reflects its goal of applying frontier AI in governed defensive workflows while sharing lessons through research, tools, training, and practical guidance.\u003c/p\u003e\n"},{"n":6,"title":"What Cloud Threat Hunting Is and How to Run One | Mitiga","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/understanding-cloud-threat-hunting","time":"15:13","priority":"MAY READ","score":45,"tldr":"Cloud threat hunting is a hypothesis-driven investigation process that goes beyond basic detections to determine whether suspicious cloud or SaaS activity is truly malicious. Effective hunts depend on having access to detailed, retained cloud logs, which can be limited by provider licensing and retention policies.","briefOverview":"\u003cp\u003eCloud threat hunting is described as a way to investigate suspicious security events in cloud environments after an indicator has been found. The article explains that a single event, such as an authentication failure, may not show whether the activity is harmless or part of an attack. Hunting uses hypothesis-driven exploratory analysis to dig into the details and determine whether an organization is facing a true attack indicator.\u003c/p\u003e\n\n\u003cp\u003eThe article distinguishes cloud hunting from detection by saying that detection uses lighter pattern recognition and may accept false positives to avoid missing possible attacks. Cloud hunts involve deeper dives into logs and more complicated logic because time and resources are being invested into activity that appears more likely to be harmful. It describes strategic cloud hunts, event-driven hunts, and continuous cloud hunts as different approaches to investigating threats in cloud and SaaS environments.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that cloud hunts depend heavily on log access, which can be harder to control in cloud and SaaS services than in on-premises systems. It notes that some cloud provider logs may not be accessible to users, may depend on service licensing, or may be retained only for a limited time. The article warns that attackers could exploit license-based logging gaps and recommends capturing logs into a security data lake before vendors delete them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloud threat hunting is a hypothesis-driven exploratory analysis and investigation process focused on threats in cloud environments.","Cloud hunts use deeper log analysis and more complicated logic than typical detection, which often relies on lightweight pattern recognition to quickly find possible attack indicators.","The article describes three approaches to cloud hunting: strategic hunts focused on adversary behavior, event-driven hunts based on attacks seen elsewhere, and continuous hunts that repeatedly check cloud and SaaS environments for attack indicators.","Cloud hunts depend on log access, but cloud and SaaS providers may limit available log data based on service licensing or retention policies.","Organizations should capture cloud and SaaS logs into a security data lake before vendors delete them so the logs remain available for threat hunting."],"insights":["A failed authentication event cannot be judged reliably in isolation because it may be either a normal user mistake or an attacker trying to compromise an account.","Attackers can take advantage of license-based logging gaps by temporarily removing a user’s license, performing malicious activity through that account, and restoring the license without leaving logs of the activity.","Cloud threat hunting requires different resource expectations than detection because hunting begins after an organization has decided a suspicious event is worth deeper investigation.","Organizations need to collect cloud and SaaS logs before vendor retention periods expire, or later investigations may lack the evidence needed to understand what happened."],"referencedReports":[],"body":"\u003cp\u003eCloud threat hunting is described as a way to investigate suspicious security events in cloud environments after an indicator has been found. The article explains that a single event, such as an authentication failure, may not show whether the activity is harmless or part of an attack. Hunting uses hypothesis-driven exploratory analysis to dig into the details and determine whether an organization is facing a true attack indicator.\u003c/p\u003e\n\n\u003cp\u003eThe article distinguishes cloud hunting from detection by saying that detection uses lighter pattern recognition and may accept false positives to avoid missing possible attacks. Cloud hunts involve deeper dives into logs and more complicated logic because time and resources are being invested into activity that appears more likely to be harmful. It describes strategic cloud hunts, event-driven hunts, and continuous cloud hunts as different approaches to investigating threats in cloud and SaaS environments.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that cloud hunts depend heavily on log access, which can be harder to control in cloud and SaaS services than in on-premises systems. It notes that some cloud provider logs may not be accessible to users, may depend on service licensing, or may be retained only for a limited time. The article warns that attackers could exploit license-based logging gaps and recommends capturing logs into a security data lake before vendors delete them.\u003c/p\u003e\n"}]</script>
