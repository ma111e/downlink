<script type="application/json" id="dl-articles">[{"n":1,"title":"New XCSSET variant targets macOS devs via compromised Xcode projects","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-xcsset-variant-targets-macos-devs-via-compromised-xcode-projects/","time":"19:03","priority":"MUST READ","score":92,"tldr":"A new XCSSET macOS malware variant is spreading through compromised Xcode projects and GitHub repositories, infecting developers when they build tainted code. The updated malware adds Chrome hijacking and Telegram trojanizing capabilities, while using stronger evasion to steal credentials, intercept traffic, and spread through other Xcode projects.","briefOverview":"\u003cp\u003eA new version of the XCSSET malware is targeting macOS users through compromised Xcode projects and GitHub repositories. Palo Alto Networks\u0026rsquo; Unit 42 says the attackers compromise vulnerable Git repositories and inject a downloader script into benign files within Xcode projects. Developers who download and build the compromised projects become infected, allowing XCSSET to compromise other Xcode projects on the system and spread further through shared source code.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 observed XCSSET version 40 in two attack waves in mid-April and early May after months of inactivity. The malware uses a four-stage infection chain before deploying 17 modules for credential theft, keystroke logging, clipboard manipulation, browser hijacking, and data exfiltration. The latest version adds two new modules: a Chrome hijacker and a Telegram trojanizer.\u003c/p\u003e\n\n\u003cp\u003eThe Chrome hijacker wraps Chrome in a malicious launcher and enables the Chrome DevTools Protocol on a local port to fetch JavaScript from the attackers\u0026rsquo; command-and-control infrastructure. This can let attackers intercept web traffic, including credentials, cookies, and MetaMask transactions, and manipulate payments. Unit 42 also reported new evasion measures and said the malware attempts to disable macOS security features such as XProtect, MRT, TCC, and Rapid Security Response.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new version of XCSSET malware, version 40, is targeting macOS users through compromised Xcode projects and GitHub repositories.","Palo Alto Networks' Unit 42 said attackers compromise vulnerable Git repositories and inject a downloader script into benign files within Xcode projects.","Developers become infected when they build compromised projects, after which XCSSET can compromise other Xcode projects on the same system and spread through shared source code.","The latest XCSSET version adds a Chrome hijacker and a Telegram trojanizer, alongside modules for credential theft, keystroke logging, clipboard manipulation, browser hijacking, and data exfiltration.","Unit 42 reported that the malware uses new evasion measures and attempts to disable macOS security features including XProtect, MRT, TCC, and Rapid Security Response."],"insights":["XCSSET’s ability to infect every other Xcode project on a compromised system means one tainted project can turn a developer’s normal code sharing into a further distribution path.","The Chrome hijacker’s use of the Chrome DevTools Protocol lets attackers intercept browser traffic and manipulate MetaMask transactions while victims use the browser.","Unit 42’s recommended detection points are behavioral rather than purely file-based, including anomalous AppleScript activity, unauthorized browser modifications, suspicious macOS defaults domains, and ad hoc-signed applications.","The malware’s periodic server-side loader recompilation, build-unique ciphers, and separate encryption keys for inbound and outbound communications indicate that defenders may face frequently changing samples from the same campaign."],"referencedReports":[],"body":"\u003cp\u003eA new version of the XCSSET malware is targeting macOS users through compromised Xcode projects and GitHub repositories. Palo Alto Networks\u0026rsquo; Unit 42 says the attackers compromise vulnerable Git repositories and inject a downloader script into benign files within Xcode projects. Developers who download and build the compromised projects become infected, allowing XCSSET to compromise other Xcode projects on the system and spread further through shared source code.\u003c/p\u003e\n\n\u003cp\u003eUnit 42 observed XCSSET version 40 in two attack waves in mid-April and early May after months of inactivity. The malware uses a four-stage infection chain before deploying 17 modules for credential theft, keystroke logging, clipboard manipulation, browser hijacking, and data exfiltration. The latest version adds two new modules: a Chrome hijacker and a Telegram trojanizer.\u003c/p\u003e\n\n\u003cp\u003eThe Chrome hijacker wraps Chrome in a malicious launcher and enables the Chrome DevTools Protocol on a local port to fetch JavaScript from the attackers\u0026rsquo; command-and-control infrastructure. This can let attackers intercept web traffic, including credentials, cookies, and MetaMask transactions, and manipulate payments. Unit 42 also reported new evasion measures and said the malware attempts to disable macOS security features such as XProtect, MRT, TCC, and Rapid Security Response.\u003c/p\u003e\n"},{"n":5,"title":"npm Stealer Reads Its C2 From an Ethereum Contract","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/npm-stealer-reads-its-c2-from-an-ethereum-contract","time":"18:45","priority":"MUST READ","score":92,"tldr":"Netskope found 28 malicious npm package versions across four enterprise namespaces that installed a Shai-Hulud credential stealer targeting developer and CI/CD secrets. The payload hides its exfiltration server by resolving it at runtime from an Ethereum smart contract, letting operators rotate infrastructure without republishing packages.","briefOverview":"\u003cp\u003eNetskope Threat Labs identified 28 malicious npm package versions published across the @servicetitan, @or-sdk, @onereach, and @umacloud namespaces on 2026-08-04. The packages were published in rapid bursts, with @or-sdk and @onereach at 10:39 UTC, @servicetitan at 10:41 UTC, and @umacloud/knowledge at 13:18 UTC. All 28 packages carried an identical or functionally equivalent payload, and the operator behind the campaign calls it Shai-Hulud.\u003c/p\u003e\n\n\u003cp\u003eAt install time, the packages fetched a signed Bun runtime release from GitHub, executed an obfuscated JavaScript stealer under it, and deleted the runtime. Sandbox analysis of @or-sdk/accounts@2.3.5 showed the payload reading SSH private keys, AWS credentials, Docker registry authentication, Jenkins secrets, /etc/shadow, GitHub CLI tokens, AWS secrets, EC2 instance metadata, and Vault AWS login material. The collected data was posted as an encrypted 4.8 KB bundle to npm-cache.com/router.\u003c/p\u003e\n\n\u003cp\u003eThe exfiltration domain was not hardcoded in the payload and was resolved at runtime through an eth_call to an Ethereum smart contract, using three public Ethereum RPC providers until one responded. Netskope stated that the operator can change the exfiltration destination by updating contract state without republishing the packages. The payload recovered from @umacloud/knowledge@1.0.74 matched the same SHA256 hash as the sample used against the keyv package family reported by Aikido Security, confirming a single campaign toolset.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Threat Labs identified 28 malicious npm package versions published across the @servicetitan, @or-sdk, @onereach, and @umacloud namespaces on 2026-08-04.","The packages execute an install-time payload that downloads a signed Bun v1.3.13 runtime from GitHub, runs an obfuscated JavaScript stealer, and then deletes the runtime.","Sandbox analysis of @or-sdk/accounts@2.3.5 showed the payload collecting SSH private keys, AWS credentials, Docker registry authentication, Jenkins secrets, /etc/shadow, GitHub CLI tokens, AWS secrets, EC2 metadata, and Vault AWS login material.","The exfiltration domain is resolved at runtime through an eth_call to an Ethereum smart contract, with three public Ethereum RPC providers tried until one responds.","The recovered @umacloud/knowledge@1.0.74 payload had the same SHA256 hash as the sample used against the keyv package family reported by Aikido Security."],"insights":["The payload’s use of an Ethereum smart contract for C2 resolution means blocking or searching for a hardcoded exfiltration domain in the package would miss the more durable indicator, the 0x02d1e413 Ethereum call selector.","Because the packages download a legitimate signed Bun runtime instead of shipping a malicious binary, detection needs to focus on install-time behavior rather than only suspicious files inside the npm tarball.","The same payload targets both developer workstation secrets and CI/CD environment secrets in one run, so the real-world impact depends heavily on where the npm install occurs.","The rapid publishing bursts across unrelated namespaces suggest the campaign was automated and involved more than a single isolated package compromise.","The article explicitly warns that the Ethereum RPC endpoints are legitimate public services abused by the payload, making them better suited for alerting than blind blocking."],"referencedReports":[{"title":"keyv and friends compromised in npm supply chain attack","url":"https://www.aikido.dev/blog/keyv-and-friends-compromised-in-npm-supply-chain-attack","publisher":"aikido-security","context":"The article cites Aikido Security’s reporting on the keyv package family compromise to confirm that the recovered payload matches the same campaign toolset.","category":"research","primary":false}],"body":"\u003cp\u003eNetskope Threat Labs identified 28 malicious npm package versions published across the @servicetitan, @or-sdk, @onereach, and @umacloud namespaces on 2026-08-04. The packages were published in rapid bursts, with @or-sdk and @onereach at 10:39 UTC, @servicetitan at 10:41 UTC, and @umacloud/knowledge at 13:18 UTC. All 28 packages carried an identical or functionally equivalent payload, and the operator behind the campaign calls it Shai-Hulud.\u003c/p\u003e\n\n\u003cp\u003eAt install time, the packages fetched a signed Bun runtime release from GitHub, executed an obfuscated JavaScript stealer under it, and deleted the runtime. Sandbox analysis of @or-sdk/accounts@2.3.5 showed the payload reading SSH private keys, AWS credentials, Docker registry authentication, Jenkins secrets, /etc/shadow, GitHub CLI tokens, AWS secrets, EC2 instance metadata, and Vault AWS login material. The collected data was posted as an encrypted 4.8 KB bundle to npm-cache.com/router.\u003c/p\u003e\n\n\u003cp\u003eThe exfiltration domain was not hardcoded in the payload and was resolved at runtime through an eth_call to an Ethereum smart contract, using three public Ethereum RPC providers until one responded. Netskope stated that the operator can change the exfiltration destination by updating contract state without republishing the packages. The payload recovered from @umacloud/knowledge@1.0.74 matched the same SHA256 hash as the sample used against the keyv package family reported by Aikido Security, confirming a single campaign toolset.\u003c/p\u003e\n"},{"n":3,"title":"Phishing service spoofs RingCentral to steal Microsoft 365 accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/phishing-service-spoofs-ringcentral-to-steal-microsoft-365-accounts/","time":"21:45","priority":"SHOULD READ","score":84,"tldr":"The Greatness phishing-as-a-service platform is spoofing RingCentral emails to bypass Microsoft 365 email defenses and steal accounts via adversary-in-the-middle and device-code phishing. Organizations should audit safe-sender rules, watch for suspicious MFA-approved sign-ins, and revoke tokens if compromise is suspected.","briefOverview":"\u003cp\u003eThe Greatness phishing-as-a-service platform has expanded from credential phishing to adversary-in-the-middle attacks and device-code phishing targeting Microsoft 365 accounts. The platform has been active since at least mid-2022 and targets users in the United States, Canada, the UK, Australia, and South Africa. It now targets multiple platforms, including Microsoft 365, iCloud, Yahoo, and Google Workspace, and is sold for $289 per month through a Telegram channel with thousands of subscribers.\u003c/p\u003e\n\n\u003cp\u003eIn a recent campaign observed by ZeroBEC, Greatness operators abused trust in RingCentral to bypass recipient-side email security filters. The attackers spoofed service@ringcentral.com and used fake voicemail and performance-review notifications to lure actual RingCentral users. The emails came from an unknown IONOS mail server, failed SPF and DMARC checks, and had no DKIM signature, but were still accepted because RingCentral was whitelisted.\u003c/p\u003e\n\n\u003cp\u003eClicking the embedded button sent victims to Greatness infrastructure, where they were routed through either a Microsoft adversary-in-the-middle phishing flow that captured an MFA-approved authentication token or a device-code phishing flow. After compromise, attackers replayed Microsoft 365 authentication tokens from VPS and commercial VPN infrastructure to access accounts. They enumerated Outlook mailboxes, Teams conversations, SharePoint sites, OneDrive files, contacts, calendars, and registered applications through Microsoft Graph, with access persisting for more than two weeks in some cases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Greatness phishing-as-a-service platform has expanded from credential phishing to adversary-in-the-middle attacks and device-code phishing targeting Microsoft 365 accounts.","ZeroBEC observed a Greatness campaign that abused trust in RingCentral by spoofing service@ringcentral.com and using fake voicemail and performance-review notifications as lures.","The spoofed emails failed SPF and DMARC checks and had no DKIM signature, but were still accepted because RingCentral was whitelisted and achieved a Spam Confidence Level of -1 on Microsoft Exchange.","Victims who clicked the embedded button were routed through Greatness infrastructure to either a Microsoft adversary-in-the-middle phishing flow that captured an MFA-approved authentication token or a device-code phishing flow.","After compromise, attackers replayed Microsoft 365 authentication tokens to access Outlook mailboxes, Teams conversations, SharePoint sites, OneDrive files, contacts, calendars, and registered applications, with access persisting for more than two weeks in some cases."],"insights":["Safe-sender whitelisting can override failed SPF, DMARC, and missing DKIM checks, allowing visibly unauthenticated spoofed email to bypass normal filtering.","The fake banner claiming the sender was verified by the organization’s safe-sender list shows the campaign targeted both technical filtering and human trust at the same time.","Greatness can choose between adversary-in-the-middle phishing and device-code phishing after a victim clicks, giving operators multiple ways to obtain usable Microsoft 365 access.","ZeroBEC recommends replacing blanket domain exclusions with rules that still require valid email authentication, making safe-sender list audits a concrete defensive priority.","Post-compromise access persisted for more than two weeks in some cases, so suspected victims need token revocation and reviews of OAuth consent, Microsoft Graph activity, and Microsoft 365 service access rather than only password resets."],"referencedReports":[{"title":"Greatness PhaaS: AiTM and Device Code Phishing","url":"https://zerobec.com/blog/greatness-phaas-aitm-and-device-code-phishing","publisher":"ZeroBEC","context":"The article cites ZeroBEC’s analysis of a Greatness phishing campaign that spoofed RingCentral and used adversary-in-the-middle and device-code phishing against Microsoft 365 accounts.","category":"research","primary":true},{"title":"Security Bulletin","url":"https://www.ringcentral.com/trust-center/security-bulletin.html","publisher":"RingCentral","context":"The article references RingCentral’s security bulletin disclosing a data breach affecting a limited portion of customers.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe Greatness phishing-as-a-service platform has expanded from credential phishing to adversary-in-the-middle attacks and device-code phishing targeting Microsoft 365 accounts. The platform has been active since at least mid-2022 and targets users in the United States, Canada, the UK, Australia, and South Africa. It now targets multiple platforms, including Microsoft 365, iCloud, Yahoo, and Google Workspace, and is sold for $289 per month through a Telegram channel with thousands of subscribers.\u003c/p\u003e\n\n\u003cp\u003eIn a recent campaign observed by ZeroBEC, Greatness operators abused trust in RingCentral to bypass recipient-side email security filters. The attackers spoofed service@ringcentral.com and used fake voicemail and performance-review notifications to lure actual RingCentral users. The emails came from an unknown IONOS mail server, failed SPF and DMARC checks, and had no DKIM signature, but were still accepted because RingCentral was whitelisted.\u003c/p\u003e\n\n\u003cp\u003eClicking the embedded button sent victims to Greatness infrastructure, where they were routed through either a Microsoft adversary-in-the-middle phishing flow that captured an MFA-approved authentication token or a device-code phishing flow. After compromise, attackers replayed Microsoft 365 authentication tokens from VPS and commercial VPN infrastructure to access accounts. They enumerated Outlook mailboxes, Teams conversations, SharePoint sites, OneDrive files, contacts, calendars, and registered applications through Microsoft Graph, with access persisting for more than two weeks in some cases.\u003c/p\u003e\n"},{"n":2,"title":"77 Open VSX extensions found harvesting developer info","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/77-open-vsx-extensions-found-harvesting-developer-info/","time":"18:50","priority":"SHOULD READ","score":82,"tldr":"Researchers found 77 counterfeit Open VSX extensions impersonating legitimate developer tools and sending system, workspace, Git, and CI metadata to attacker-controlled mangorbit.com infrastructure. The extensions have been removed from the marketplace, but affected developers must manually uninstall them and block the domain.","briefOverview":"\u003cp\u003eManifold Security found 77 extensions on the Open VSX marketplace that impersonated legitimate developer tools while transmitting information about the systems and development environments where they were installed. The extensions were detected between July 26 and August 1, 2026, and were linked through shared code, network behavior, and a common data-exfiltration domain. The packages reused names, namespaces, and descriptions of real Open VSX extensions but were published through unrelated accounts.\u003c/p\u003e\n\n\u003cp\u003eAll 77 extensions communicated with infrastructure under mangorbit[.]com, a domain registered on July 15, 2026. Fifty-eight extensions mainly sent limited system information such as hostnames, while 19 collected broader metadata including usernames, machine identifiers, editor details, workspace paths, Git repository information, installed extensions, and CI or cloud development environment identifiers. Manifold said the extensions did not access source code, credentials, authentication tokens, SSH material, or browser data.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that the listings disclosed “anonymous usage metrics” and accurately said they did not access source code or credentials, but Manifold found some extensions sent more data than disclosed. Some variants could retry transmission for up to seven days and could query a DNS TXT record for a replacement URL if hardcoded infrastructure stopped responding. The packages were removed from Open VSX by August 3, 2026, but affected developers still need to manually remove them and are advised to block the mangorbit[.]com domain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Manifold Security found 77 Open VSX extensions between July 26 and August 1, 2026, that impersonated legitimate developer tools while transmitting information about installed systems and development environments.","All 77 extensions were linked by shared code, network behavior, and communication with the mangorbit.com domain, which was registered on July 15, 2026.","Fifty-eight extensions mainly exfiltrated hostnames, while 19 collected broader metadata including usernames, machine identifiers, editor details, workspace paths, Git repository information, installed extensions, and CI or cloud development environment identifiers.","Manifold reported that the extensions did not access source code, credentials, authentication tokens, SSH material, or browser data, but sent more data than their listings disclosed.","The packages were removed from Open VSX by August 3, 2026, but affected developers still need to manually remove them from their systems and applications."],"insights":["The extensions’ marketplace listings disclosed “anonymous usage metrics” and accurately said they did not access source code or credentials, but Manifold found they still collected more data than disclosed, including CI information that could reveal private repository names or paths.","Some variants could keep retrying data transmission for up to seven days and could retrieve a replacement collection URL from a DNS TXT record if the hardcoded infrastructure stopped responding.","Each counterfeit extension included its own tracking identifier, allowing the operator to tell which specific fake extension had been installed.","Manifold recommends checking workspace configuration files as well as installed extensions because some variants checked whether they were installed manually or automatically through a project configuration."],"referencedReports":[{"title":"Open VSX Evil Twin Extensions","url":"https://www.manifold.security/blog/open-vsx-evil-twin-extensions","publisher":"Manifold Security","context":"The article says Manifold Security discovered and analyzed the 77 Open VSX extensions linked to the evil twin campaign.","category":"research","primary":true}],"body":"\u003cp\u003eManifold Security found 77 extensions on the Open VSX marketplace that impersonated legitimate developer tools while transmitting information about the systems and development environments where they were installed. The extensions were detected between July 26 and August 1, 2026, and were linked through shared code, network behavior, and a common data-exfiltration domain. The packages reused names, namespaces, and descriptions of real Open VSX extensions but were published through unrelated accounts.\u003c/p\u003e\n\n\u003cp\u003eAll 77 extensions communicated with infrastructure under mangorbit[.]com, a domain registered on July 15, 2026. Fifty-eight extensions mainly sent limited system information such as hostnames, while 19 collected broader metadata including usernames, machine identifiers, editor details, workspace paths, Git repository information, installed extensions, and CI or cloud development environment identifiers. Manifold said the extensions did not access source code, credentials, authentication tokens, SSH material, or browser data.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that the listings disclosed “anonymous usage metrics” and accurately said they did not access source code or credentials, but Manifold found some extensions sent more data than disclosed. Some variants could retry transmission for up to seven days and could query a DNS TXT record for a replacement URL if hardcoded infrastructure stopped responding. The packages were removed from Open VSX by August 3, 2026, but affected developers still need to manually remove them and are advised to block the mangorbit[.]com domain.\u003c/p\u003e\n"},{"n":4,"title":"OpenAI: Cambodian scam centers used ChatGPT to lure Indian nationals, conduct investment fraud","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/openai-chatgpt-cambodia-scam-centers-disruption","time":"20:15","priority":"SHOULD READ","score":82,"tldr":"OpenAI said it banned ChatGPT accounts used by scam centers in Cambodia to support investment, romance, gambling, and impersonation scams targeting Indian nationals, including creating fake personas, documents, messages, and job ads. The case highlights how Southeast Asian scam operations are using AI to scale fraud and manage trafficked workers forced into cybercrime.","briefOverview":"\u003cp\u003eOpenAI said it disrupted the use of ChatGPT by cyber scam centers in Cambodia that had integrated the chatbot into investment fraud schemes and human trafficking operations. The scammers used ChatGPT to support investment, romance, gambling, and law enforcement impersonation scams, and to create fake job ads aimed at people in India. OpenAI said it was tipped off by WhatsApp officials and banned the accounts associated with the activity.\u003c/p\u003e\n\n\u003cp\u003eThe activity was traced to Poipet, Cambodia, a city the article describes as having deep ties to scam operations run by Chinese criminal gangs. OpenAI said the network used its models to create fake online personas, generate and translate messages to scam targets, create promotional content, and assist with day-to-day operations. The scammers also used ChatGPT to create fake images of passports, legal notices, stock purchase confirmations, and gambling platform pages.\u003c/p\u003e\n\n\u003cp\u003eOpenAI said it could not calculate the financial losses tied to the scheme, but the operation may have interacted with hundreds of targets across multiple scam types, with several conversations referencing thousands lost by victims. The article also says some conversations referenced detention, escape attempts, immigration status, work permits, visa overstays, and potential criminal liability for people trafficked and forced to work in scam operations. It notes that scam centers continue to proliferate across Southeast Asia, while INTERPOL reported that more than half of cybercrime across Africa now leverages artificial intelligence in some way.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI said it disrupted ChatGPT use by cyber scam centers in Cambodia that integrated the chatbot into investment fraud schemes and human trafficking operations.","OpenAI said the scammers used ChatGPT to support investment, romance, gambling, and law enforcement impersonation scams, as well as fake job ads aimed at people in India.","The activity was traced to Poipet, Cambodia, a city linked in the article to scam operations run by Chinese criminal gangs.","OpenAI said the network used ChatGPT to create fake online personas, generate and translate messages, create promotional content, make fake images of documents and platform pages, and assist with day-to-day operations.","INTERPOL reported that more than half of cybercrime across Africa now uses artificial intelligence in some way, including AI-generated audio and video to impersonate government officials."],"insights":["The same operation moved across several scam types and combined techniques, showing that scam centers may reuse AI support across investment, romance, gambling, impersonation, and recruitment fraud rather than treating them as separate operations.","ChatGPT was allegedly used not only for victim-facing deception but also for internal management tasks such as staff announcements, translations, debt records, salary deductions, disciplinary fines, loan repayments, and recruitment materials.","The WhatsApp tip to OpenAI indicates that platform-to-platform reporting can play a role in disrupting scam networks that operate across multiple online services.","The article links AI-enabled fraud to both financial harm and human trafficking, with OpenAI saying some conversations referenced detention, escape attempts, visa overstays, and possible criminal liability for trafficked workers."],"referencedReports":[{"title":"INTERPOL report finds AI linked to more than half of cybercrime in Africa","url":"https://www.interpol.int/en/News-and-Events/News/2026/INTERPOL-report-finds-AI-linked-to-more-than-half-of-cybercrime-in-Africa","publisher":"INTERPOL","context":"The article cites an INTERPOL study finding that more than half of cybercrime across Africa now uses artificial intelligence in some way.","category":"research","primary":false}],"body":"\u003cp\u003eOpenAI said it disrupted the use of ChatGPT by cyber scam centers in Cambodia that had integrated the chatbot into investment fraud schemes and human trafficking operations. The scammers used ChatGPT to support investment, romance, gambling, and law enforcement impersonation scams, and to create fake job ads aimed at people in India. OpenAI said it was tipped off by WhatsApp officials and banned the accounts associated with the activity.\u003c/p\u003e\n\n\u003cp\u003eThe activity was traced to Poipet, Cambodia, a city the article describes as having deep ties to scam operations run by Chinese criminal gangs. OpenAI said the network used its models to create fake online personas, generate and translate messages to scam targets, create promotional content, and assist with day-to-day operations. The scammers also used ChatGPT to create fake images of passports, legal notices, stock purchase confirmations, and gambling platform pages.\u003c/p\u003e\n\n\u003cp\u003eOpenAI said it could not calculate the financial losses tied to the scheme, but the operation may have interacted with hundreds of targets across multiple scam types, with several conversations referencing thousands lost by victims. The article also says some conversations referenced detention, escape attempts, immigration status, work permits, visa overstays, and potential criminal liability for people trafficked and forced to work in scam operations. It notes that scam centers continue to proliferate across Southeast Asia, while INTERPOL reported that more than half of cybercrime across Africa now leverages artificial intelligence in some way.\u003c/p\u003e\n"},{"n":6,"title":"Mythic 4 Public Beta: More Than a New Coat of Paint","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/08/04/mythic-4-public-beta/","time":"20:09","priority":"MAY READ","score":55,"tldr":"Mythic 4 is now in public beta with major new operator workflows, scoped API tokens for safer automation and AI chat integrations, resumable file transfers, inline task references, and a refreshed UI. Developers and users should test v4-compatible agents, C2 profiles, and services in a development environment because the release includes breaking changes.","briefOverview":"\u003cp\u003eMythic 4 is now available on the Mythic-v4.0.0 branch and is entering a public beta for the next few months. The release adds generic operation chat, a pluggable AI chat container, human-in-the-loop interactions for AI and eventing, operator aliases, inline task references, resumable file transfers, in-browser file editing through agents, and a more consistent interface. The author says this major version includes breaking changes for almost all integrations, agents, and Mythic services, and asks maintainers and users to test during the beta.\u003c/p\u003e\n\n\u003cp\u003eA major focus of Mythic 4 is safer automation, especially as more people use AI to control Mythic. API tokens now have explicit read and write scopes for resources such as callbacks, tasks, responses, files, credentials, payloads, eventing, and chat, and those scopes are enforced across the web API, GraphQL access, and RabbitMQ-based RPC system. Chat containers can connect AI models to an operation with scoped Mythic API tokens, allowing models to view or change only what their permissions allow.\u003c/p\u003e\n\n\u003cp\u003eThe update also changes operator workflows across the platform. Operation chat can host channels, searchable history, system messages, and interactive cards that let eventing workflows pause for operator approval or input. Mythic 4 adds tasking references for stored credentials, per-operator aliases, offset-based and resumable file transfers, an interactive remote file editor, an XTerm.js-based terminal renderer, an updated eventing workflow wizard, and improved parsing and display for Kerberos tickets and JSON web tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mythic 4 is available on the Mythic-v4.0.0 branch and is entering a public beta for the next few months so the community can update and test compatible services.","The release introduces dedicated operation chat, including channels, searchable history, muted or archived channels, markdown support, system messages, and interactive cards for workflows that need operator approval or input.","Mythic 4 adds pluggable AI chat containers that can use scoped Mythic API tokens to limit what a model can read or change within an operation.","The update includes operator workflow improvements such as inline tasking references for stored credentials, per-operator aliases, resumable file transfers, and in-browser editing of remote files through compatible agents.","Mythic 4 includes breaking authentication and API changes, including explicit read and write scopes for API tokens and changes affecting integrations, agents, services, Mythic Scripting, and v4-compatible container libraries."],"insights":["The public beta is specifically intended to absorb the impact of Mythic 4’s permission model changes, because scoped API tokens affect integrations, agents, services, scripting, GraphQL access, and RabbitMQ-based RPC behavior.","AI use is a major driver of the release: Mythic 4 moves away from giving automation broad user-level access and instead lets each AI chat operate through its own limited token with only the permissions it needs.","Developers maintaining private agents, custom C2 profiles, eventing containers, or scripts should prioritize testing early because the article warns that the first beta should not be treated as operation-ready without validation.","Mythic 4’s chat and eventing changes are designed to reduce the need for operators to monitor a separate eventing page by allowing workflows to pause and request approval or input directly in operation chat.","The new tasking references and aliases are aimed at reducing risky and unreadable copy-and-paste workflows, such as repeatedly pasting large Kerberos ticket blobs into command lines."],"referencedReports":[],"body":"\u003cp\u003eMythic 4 is now available on the Mythic-v4.0.0 branch and is entering a public beta for the next few months. The release adds generic operation chat, a pluggable AI chat container, human-in-the-loop interactions for AI and eventing, operator aliases, inline task references, resumable file transfers, in-browser file editing through agents, and a more consistent interface. The author says this major version includes breaking changes for almost all integrations, agents, and Mythic services, and asks maintainers and users to test during the beta.\u003c/p\u003e\n\n\u003cp\u003eA major focus of Mythic 4 is safer automation, especially as more people use AI to control Mythic. API tokens now have explicit read and write scopes for resources such as callbacks, tasks, responses, files, credentials, payloads, eventing, and chat, and those scopes are enforced across the web API, GraphQL access, and RabbitMQ-based RPC system. Chat containers can connect AI models to an operation with scoped Mythic API tokens, allowing models to view or change only what their permissions allow.\u003c/p\u003e\n\n\u003cp\u003eThe update also changes operator workflows across the platform. Operation chat can host channels, searchable history, system messages, and interactive cards that let eventing workflows pause for operator approval or input. Mythic 4 adds tasking references for stored credentials, per-operator aliases, offset-based and resumable file transfers, an interactive remote file editor, an XTerm.js-based terminal renderer, an updated eventing workflow wizard, and improved parsing and display for Kerberos tickets and JSON web tokens.\u003c/p\u003e\n"},{"n":7,"title":"AWS Security Hub Adds Socket for Supply Chain Security","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/aws-security-hub-socket?utm_medium=feed","time":"18:56","priority":"MAY READ","score":45,"tldr":"Socket is now available through the AWS Security Hub Extended plan, letting AWS customers buy supply chain security tools with committed AWS spend and consolidated billing. The offering includes Socket Firewall and SCA, with a first-month-free usage model based on unique package artifacts checked.","briefOverview":"\u003cp\u003eAWS customers can now adopt Socket directly through the AWS Security Hub Extended plan, apply committed AWS spend, and start with the first month free. The Extended plan brings curated third-party security tools into AWS across 10 security categories with pay-as-you-go pricing and no required upfront commitment. Socket adds supply chain security to the lineup by focusing on malicious open source packages.\u003c/p\u003e\n\n\u003cp\u003eSocket analyzes the actual behavior of open source packages across npm, PyPI, Maven, Go, NuGet, and RubyGems. The article says this behavioral approach is meant to catch malicious and high-risk code that tools based only on known vulnerability databases may miss. Socket Firewall blocks malicious and unwanted open source packages and extensions at install time, while Socket’s Software Composition Analysis gives teams visibility into dependencies and flags risk in software they already ship.\u003c/p\u003e\n\n\u003cp\u003eBuying Socket through AWS Security Hub Extended changes procurement and billing by allowing consolidated billing through AWS, month-to-month seat and usage changes, and use of committed AWS spend. Socket Firewall uses a usage model based on unique artifacts checked per month rather than bandwidth, data transfer, raw download counts, or install frequency. A single de-duplicated package version counts once even if it is installed many times in a month.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket is now available through the AWS Security Hub Extended plan, allowing AWS customers to adopt it directly through AWS, apply committed AWS spend, and start with the first month free.","Socket adds supply chain security to the Extended plan by analyzing the behavior of open source packages across ecosystems including npm, PyPI, Maven, Go, NuGet, and RubyGems.","Socket Firewall blocks malicious and unwanted open source packages and extensions at install time before they reach an employee laptop, agent sandbox, or CI pipeline.","Socket’s Software Composition Analysis gives teams visibility into their open source dependencies and flags risk across the software they already ship.","Socket Firewall uses a pricing model based on unique artifacts checked per month rather than bandwidth, data transfer, raw download counts, or install frequency."],"insights":["Teams with existing AWS spending commitments can add Socket without a separate procurement cycle because usage can be billed through AWS and applied against committed AWS spend.","Socket’s unique-artifact pricing means repeated builds of the same locked dependency set do not increase firewall charges, since a package version installed a million times still counts only once.","The first free month is positioned as a way for teams to measure their real unique-artifact usage before committing to paid firewall usage.","Socket is presented as complementary to other AWS Security Hub Extended tools because it focuses on open source dependencies while other partners cover areas such as endpoints, identity, networks, and cloud infrastructure."],"referencedReports":[],"body":"\u003cp\u003eAWS customers can now adopt Socket directly through the AWS Security Hub Extended plan, apply committed AWS spend, and start with the first month free. The Extended plan brings curated third-party security tools into AWS across 10 security categories with pay-as-you-go pricing and no required upfront commitment. Socket adds supply chain security to the lineup by focusing on malicious open source packages.\u003c/p\u003e\n\n\u003cp\u003eSocket analyzes the actual behavior of open source packages across npm, PyPI, Maven, Go, NuGet, and RubyGems. The article says this behavioral approach is meant to catch malicious and high-risk code that tools based only on known vulnerability databases may miss. Socket Firewall blocks malicious and unwanted open source packages and extensions at install time, while Socket’s Software Composition Analysis gives teams visibility into dependencies and flags risk in software they already ship.\u003c/p\u003e\n\n\u003cp\u003eBuying Socket through AWS Security Hub Extended changes procurement and billing by allowing consolidated billing through AWS, month-to-month seat and usage changes, and use of committed AWS spend. Socket Firewall uses a usage model based on unique artifacts checked per month rather than bandwidth, data transfer, raw download counts, or install frequency. A single de-duplicated package version counts once even if it is installed many times in a month.\u003c/p\u003e\n"},{"n":8,"title":"Human Risk Management Purchasing Toolkit","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/human-risk-management-purchasing-toolkit/","time":"20:48","priority":"MAY READ","score":25,"tldr":"Living Security is offering a Human Risk Management Purchasing Toolkit to help security and risk leaders evaluate vendors, build a business case, and deploy a measurable HRM program. The toolkit includes strategy, RFP/vendor evaluation, deployment, and EU consultation templates.","briefOverview":"\u003cp\u003eLiving Security, a Health-ISAC Community Champion, has provided a Human Risk Management Purchasing Toolkit. The toolkit is designed to help security and risk leaders evaluate, justify, and operationalize a Human Risk Management program. The article presents the toolkit as a resource for starting to build a measurable human risk program.\u003c/p\u003e\n\n\u003cp\u003eThe toolkit includes materials for vendor selection, business case development, and measurable risk reduction. Its listed components are a Strategic HRM Framework, an Executive Business Case Pack, an RFP and Vendor Evaluation Kit, a 90-Day Deployment Playbook, and a GDPR and Works Council Consultation Template for the EU. The article directs readers to access the toolkit through Living Security’s linked page.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Living Security, a Health-ISAC Community Champion, provided a toolkit for building a measurable Human Risk Management program.","The toolkit is designed to help security and risk leaders evaluate, justify, and operationalize a Human Risk Management program.","The toolkit includes resources for vendor selection, business case development, and measurable risk reduction.","The toolkit contains a Strategic HRM Framework, an Executive Business Case Pack, an RFP and Vendor Evaluation Kit, a 90-Day Deployment Playbook, and a GDPR and Works Council Consultation Template for the EU."],"insights":["The toolkit is positioned for the purchasing process, because it combines an executive business case pack with an RFP and vendor evaluation kit.","The inclusion of a 90-day deployment playbook makes the toolkit oriented toward near-term rollout rather than only planning or strategy.","The GDPR and Works Council Consultation Template shows that EU privacy and employee consultation requirements are treated as part of Human Risk Management program planning."],"referencedReports":[],"body":"\u003cp\u003eLiving Security, a Health-ISAC Community Champion, has provided a Human Risk Management Purchasing Toolkit. The toolkit is designed to help security and risk leaders evaluate, justify, and operationalize a Human Risk Management program. The article presents the toolkit as a resource for starting to build a measurable human risk program.\u003c/p\u003e\n\n\u003cp\u003eThe toolkit includes materials for vendor selection, business case development, and measurable risk reduction. Its listed components are a Strategic HRM Framework, an Executive Business Case Pack, an RFP and Vendor Evaluation Kit, a 90-Day Deployment Playbook, and a GDPR and Works Council Consultation Template for the EU. The article directs readers to access the toolkit through Living Security’s linked page.\u003c/p\u003e\n"}]</script>
