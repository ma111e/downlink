<script type="application/json" id="dl-articles">[{"n":1,"title":"Authentication Bypass in the default configuration phpBB","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/authentication-bypass-phpbb-technical-writeup","time":"23:45","priority":"MUST READ","score":94,"tldr":"phpBB patched a critical default-configuration authentication bypass in version 3.3.17 that let unauthenticated attackers log in as any user, including admins, by abusing the login-link flow with the Apache auth provider. Site operators should update immediately and check logs for suspicious login_link requests using auth_provider=apache.","briefOverview":"\u003cp\u003eAikido found and reported a critical authentication bypass in phpBB, now known as CVE-2026-48611. The vulnerability works in phpBB’s default configuration and requires only a single unauthenticated request to log in to an arbitrary account. The article says that logging in to an administrator account could give an attacker control over the whole forum.\u003c/p\u003e\n\n\u003cp\u003eThe issue is tied to phpBB’s login-link feature, which is used when connecting external services like Google or GitHub OAuth to an existing forum account. An attacker can provide dummy \u003ccode\u003elogin_link_*\u003c/code\u003e data and control the \u003ccode\u003eauth_provider\u003c/code\u003e parameter so that phpBB uses the \u003ccode\u003eapache\u003c/code\u003e authentication provider. That provider trusts the Basic authentication username and returns a successful login for an existing active user without checking the password, because it is intended for setups where Apache handles authentication first.\u003c/p\u003e\n\n\u003cp\u003eAikido reported the issue through HackerOne on June 2, 2026, and phpBB staff triaged it in under 9 minutes. phpBB released version 3.3.17 with a patch four days later, and the article urges forum managers to update if they have not already. The article also recommends checking request logs for POST requests involving \u003ccode\u003emode=login_link\u003c/code\u003e, \u003ccode\u003eauth_provider=apache\u003c/code\u003e, and \u003ccode\u003elogin_link_*\u003c/code\u003e, including cases where key parameters are supplied in the POST body rather than the URL.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido reported a critical phpBB authentication bypass, now identified as CVE-2026-48611, that works in the default configuration and requires only a single unauthenticated request to log in to an arbitrary account.","The vulnerability is in phpBB’s login-link flow, where an attacker can provide dummy login_link data and control the auth_provider parameter to select the apache provider.","The apache authentication provider trusts the Basic authentication username and returns a successful login for an existing active user without checking the submitted password, because it is intended for deployments where Apache handles authentication first.","phpBB triaged the HackerOne report in under 9 minutes and released a patch in version 3.3.17 four days after the report.","The article recommends checking request logs for POST requests combining mode=login_link, auth_provider=apache, and login_link_* parameters, including cases where mode and auth_provider are supplied in the POST body."],"insights":["The bypass did not require a rare deployment choice or misconfiguration; the article emphasizes that it worked against phpBB’s default configuration by reaching an authentication provider that was not meant to be exposed through the login-link feature.","The vulnerable apache provider was not simply missing a password check by accident; it was designed to trust Apache-provided Basic authentication, but the login-link flow let the client supply that trusted identity directly.","Log detection based only on the URL query string can miss exploit attempts because phpBB lets mode and auth_provider values in the POST body take priority
