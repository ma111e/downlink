<script type="application/json" id="dl-articles">[{"n":2,"title":"Max severity SonicWall SMA1000 flaw now exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/","time":"12:32","priority":"MUST READ","score":94,"tldr":"Attackers are attempting to exploit the newly patched maximum-severity CVE-2026-102255 SSRF flaw in SonicWall SMA1000 appliances, potentially reaching internal services and performing unauthorized actions. Organizations using affected SMA1000 6210, 7210, and 8200v devices should apply SonicWall’s patch immediately.","briefOverview":"\u003cp\u003eAttackers are attempting to exploit CVE-2026-102255, a maximum-severity vulnerability in SonicWall SMA1000 appliances that SonicWall patched three days before the report. The flaw affects the Appliance WorkPlace interface on SMA1000 6210, 7210, and 8200v models, but not SonicWall SMA 100 Series devices or SSL-VPN services on SonicWall firewalls. SonicWall said an unauthenticated remote attacker could cause the appliance to make requests on their behalf, reach internal functions, and perform unauthorized operations.\u003c/p\u003e\n\n\u003cp\u003ePrevidian’s honeypot network observed requests against the WorkPlace Extraweb interface that used a crafted OPTIONS request to target the appliance’s internal CouchDB service at 127.0.0.1:5984. The requests attempted to access a CouchDB design document’s \u003ccode\u003e_rewrite\u003c/code\u003e function and included an HTTP Basic Authorization header with \u003ccode\u003eadmin:admin\u003c/code\u003e credentials, although Previdian has not confirmed that any systems were successfully compromised. Shadowserver tracks more than 400 SMA1000 appliances exposed online, while the number that are patched or honeypots is unknown. SMA1000 gateways are widely used by managed service providers, large companies, and government agencies, and prior SMA1000 zero-day attacks were linked by CISA to ransomware gangs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are attempting to exploit CVE-2026-102255, a maximum-severity flaw in SonicWall SMA1000 appliances that SonicWall patched three days before the report.","The flaw affects the Appliance WorkPlace interface on SMA1000 6210, 7210, and 8200v models, but not the SMA 100 Series or SSL-VPN on SonicWall firewalls.","Previdian detected requests targeting the WorkPlace Extraweb interface that attempted to reach the appliance’s internal CouchDB service using a crafted OPTIONS request and admin:admin credentials.","SonicWall SMA1000 gateways are used by managed service providers, large corporations, and government agencies for access to internal applications and networks.","Shadowserver tracks more than 400 SMA1000 appliances exposed online, although the number that are patched or honeypots is unknown."],"insights":["Although the observed activity is consistent with exploitation attempts, Previdian said it has not confirmed that any attempt successfully compromised a system.","The new flaw targets the same WorkPlace interface involved in earlier SSRF issues, but uses a different technique: a crafted OPTIONS request intended to reach the appliance’s internal CouchDB service.","The attempted request included the default-looking admin:admin credentials and sought to invoke a CouchDB rewrite function, indicating that the activity targeted internal application behavior rather than the public-facing interface alone.","More than 400 SMA1000 devices are visible online, while it remains unknown how many have been patched, which makes the potential exposed population difficult to determine.","SMA1000 appliances have a recent history of zero-day abuse, including attacks linked by CISA to ransomware gangs, raising the operational significance of new exploitation attempts against the platform."],"referencedReports":[{"title":"SNWLID-2026-0017: CVE-2026-102255","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017","publisher":"sonicwall","context":"The article cites SonicWall's advisory for its description of how a remote unauthenticated attacker could abuse the Appliance WorkPlace flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers are attempting to exploit CVE-2026-102255, a maximum-severity vulnerability in SonicWall SMA1000 appliances that SonicWall patched three days before the report. The flaw affects the Appliance WorkPlace interface on SMA1000 6210, 7210, and 8200v models, but not SonicWall SMA 100 Series devices or SSL-VPN services on SonicWall firewalls. SonicWall said an unauthenticated remote attacker could cause the appliance to make requests on their behalf, reach internal functions, and perform unauthorized operations.\u003c/p\u003e\n\n\u003cp\u003ePrevidian’s honeypot network observed requests against the WorkPlace Extraweb interface that used a crafted OPTIONS request to target the appliance’s internal CouchDB service at 127.0.0.1:5984. The requests attempted to access a CouchDB design document’s \u003ccode\u003e_rewrite\u003c/code\u003e function and included an HTTP Basic Authorization header with \u003ccode\u003eadmin:admin\u003c/code\u003e credentials, although Previdian has not confirmed that any systems were successfully compromised. Shadowserver tracks more than 400 SMA1000 appliances exposed online, while the number that are patched or honeypots is unknown. SMA1000 gateways are widely used by managed service providers, large companies, and government agencies, and prior SMA1000 zero-day attacks were linked by CISA to ransomware gangs.\u003c/p\u003e\n"},{"n":3,"title":"Flax Typhoon Exploits Five Flaws as CISA Sets October 11 Deadline for Federal Agencies","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/flax-typhoon-exploits-five-flaws-as.html","time":"12:21","priority":"MUST READ","score":94,"tldr":"CISA added five actively exploited flaws tied to China-linked Flax Typhoon to its KEV catalog, including vulnerabilities in ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND. U.S. federal agencies must patch or discontinue affected products by October 11, 2026.","briefOverview":"\u003cp\u003eCISA added five vulnerabilities to its Known Exploited Vulnerabilities catalog after their abuse by the China-linked threat actor Flax Typhoon. The affected products are ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND. The flaws include issues that can enable arbitrary file access, remote code execution, disclosure of sensitive user details, command execution, or denial of service.\u003c/p\u003e\n\n\u003cp\u003eThe additions coincide with a joint advisory from Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States concerning operations enabled by China-based Integrity Technology Group. The operations targeted eight vulnerabilities in total, with the other three—Shellshock, Ivanti Pulse Connect Secure, and GitLab flaws—already listed in the KEV catalog. The activity reportedly used scanning tools, cross-site scripting, and password spraying against Microsoft Exchange servers, then used VPN software for persistence and scripts to take emails and credentials.\u003c/p\u003e\n\n\u003cp\u003eCISA said Chinese government-affiliated actors continue to position themselves in critical infrastructure networks, including operational technology systems, for possible future disruption. Federal agencies are required to patch the five newly added vulnerabilities or stop using the affected products by October 11, 2026. The deadline reflects the active exploitation of these issues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added five vulnerabilities associated with Flax Typhoon activity to its Known Exploited Vulnerabilities catalog.","The newly added flaws affect ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND.","A joint advisory from Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States said a China-based company called Integrity Technology Group enabled operations targeting eight vulnerabilities.","The reported activity used scanning tools, cross-site scripting, and password spraying against Microsoft Exchange servers to gain access, while scripts were used to steal emails and credentials.","U.S. federal agencies must patch the affected vulnerabilities or stop using the affected products by October 11, 2026."],"insights":["The activity combined newly highlighted flaws with three long-standing KEV entries—Shellshock, Ivanti Pulse Connect Secure, and GitLab—showing that all eight targeted weaknesses were already recognized as actively exploited or were added to that status.","Several of the affected flaws date back to 2015 and 2016, including ProFTPD, Apache Struts, and ISC BIND issues, rather than being limited to recently disclosed software problems.","The reported operations did not stop at initial access: they also established continued access through VPN software and used scripts to collect emails and credentials.","The joint warning linked the activity to a China-based cybersecurity company, Integrity Technology Group, and involved authorities from seven countries.","CISA's deadline gives U.S. federal agencies a specific required action: apply patches or discontinue use of affected products by October 11, 2026."],"referencedReports":[],"body":"\u003cp\u003eCISA added five vulnerabilities to its Known Exploited Vulnerabilities catalog after their abuse by the China-linked threat actor Flax Typhoon. The affected products are ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND. The flaws include issues that can enable arbitrary file access, remote code execution, disclosure of sensitive user details, command execution, or denial of service.\u003c/p\u003e\n\n\u003cp\u003eThe additions coincide with a joint advisory from Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States concerning operations enabled by China-based Integrity Technology Group. The operations targeted eight vulnerabilities in total, with the other three—Shellshock, Ivanti Pulse Connect Secure, and GitLab flaws—already listed in the KEV catalog. The activity reportedly used scanning tools, cross-site scripting, and password spraying against Microsoft Exchange servers, then used VPN software for persistence and scripts to take emails and credentials.\u003c/p\u003e\n\n\u003cp\u003eCISA said Chinese government-affiliated actors continue to position themselves in critical infrastructure networks, including operational technology systems, for possible future disruption. Federal agencies are required to patch the five newly added vulnerabilities or stop using the affected products by October 11, 2026. The deadline reflects the active exploitation of these issues.\u003c/p\u003e\n"},{"n":6,"title":"New GhostAction Wave Hits Hundreds of Repos, Expanding Beyond CI/CD Secrets to Cloud Credentials","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/ghostaction-cloud-credentials?utm_medium=feed","time":"12:07","priority":"MUST READ","score":94,"tldr":"A new GhostAction campaign used compromised GitHub maintainer accounts to inject malicious GitHub Actions workflows into 346 repositories, stealing configured CI/CD secrets and scanning current files plus full Git history for cloud and AI credentials. Organizations should remove the workflow, rotate exposed credentials, investigate workflow runs and egress to the hardcoded collector IP, and secure affected maintainer accounts.","briefOverview":"\u003cp\u003eSocket reported that on October 8, 2026, compromised GitHub accounts henrywoo and kitao added a malicious workflow named \u003ccode\u003e.github/workflows/security-audit.yml\u003c/code\u003e to 346 repositories. The file, presented as a security audit, had no security function and sent collected data to the hardcoded address \u003ccode\u003e193.32.204[.]199\u003c/code\u003e. Affected repositories included Uber-owned \u003ccode\u003euber/athenadriver\u003c/code\u003e and the popular \u003ccode\u003ekitao/pyxel\u003c/code\u003e. Socket said the workflow remained on default branches it checked as of October 9 and had run successfully in affected repositories.\u003c/p\u003e\n\n\u003cp\u003eThis GhostAction variant retains the campaign’s earlier ability to collect GitHub Actions secrets named in repository workflows, including package-publishing credentials. It also performs a new search of checked-out files and reachable Git history for 13 patterns covering AWS, AI-service, source-control, SaaS, and cloud API credentials. The workflow uses a full Git checkout and captures lines surrounding AWS key identifiers, which can include nearby secret access keys needed to form usable credential pairs. Socket reported no malicious package versions on PyPI or crates.io at the time of writing, but recommended removing the workflow, rotating exposed credentials, reviewing workflow and audit logs, and securing affected maintainer accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On October 8, 2026, compromised GitHub accounts henrywoo and kitao added a malicious .github/workflows/security-audit.yml file to 346 repositories, including uber/athenadriver and kitao/pyxel.","The workflow runs on pushes and can collect GitHub Actions secrets named in existing workflows before sending them to the hardcoded IP address 193.32.204[.]199.","This GhostAction variant also searches checked-out files and complete reachable Git history for AWS, AI-service, source-control, SaaS, and cloud API credentials.","The workflow uses a full Git checkout and context around AWS key identifiers to capture nearby information that may include corresponding secret access keys.","Socket reported that the malicious workflow remained on the default branches it checked as of October 9, 2026, and it had not observed malicious package releases to PyPI or crates.io at that time."],"insights":["The malicious workflow was customized with the exact GitHub Actions secret names used by each repository, indicating that the operators first examined existing workflow files before committing the payload.","Fetching complete Git history lets the workflow search credentials that were removed from the current version of a project but remain reachable through old branches or tags.","The payload captures lines surrounding AWS key identifiers because the identifier alone cannot authenticate, while a nearby secret key may form a usable credential pair.","The 279 affected forks in the henrywoo namespace can exfiltrate credentials from a fork owner’s own repository history if Actions are enabled and a push occurs.","Every execution reports its repository identifier even when no credentials are found, giving the operator a record of reachable execution environments."],"referencedReports":[{"title":"GhostAction Campaign: 3,325 Secrets Stolen","url":"https://blog.gitguardian.com/ghostaction-campaign-3-325-secrets-stolen/","publisher":"gitguardian","context":"The article cites GitGuardian’s September 2025 documentation of an earlier GhostAction campaign that stole GitHub Actions secrets.","category":"research","primary":false},{"title":"GhostAction GitHub Actions Supply Chain Attack Returns","url":"https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/","publisher":"gitguardian","context":"The article cites GitGuardian’s report on GhostAction returning in 2026 before this variant expanded to scanning repository history for credentials.","category":"research","primary":false}],"body":"\u003cp\u003eSocket reported that on October 8, 2026, compromised GitHub accounts henrywoo and kitao added a malicious workflow named \u003ccode\u003e.github/workflows/security-audit.yml\u003c/code\u003e to 346 repositories. The file, presented as a security audit, had no security function and sent collected data to the hardcoded address \u003ccode\u003e193.32.204[.]199\u003c/code\u003e. Affected repositories included Uber-owned \u003ccode\u003euber/athenadriver\u003c/code\u003e and the popular \u003ccode\u003ekitao/pyxel\u003c/code\u003e. Socket said the workflow remained on default branches it checked as of October 9 and had run successfully in affected repositories.\u003c/p\u003e\n\n\u003cp\u003eThis GhostAction variant retains the campaign’s earlier ability to collect GitHub Actions secrets named in repository workflows, including package-publishing credentials. It also performs a new search of checked-out files and reachable Git history for 13 patterns covering AWS, AI-service, source-control, SaaS, and cloud API credentials. The workflow uses a full Git checkout and captures lines surrounding AWS key identifiers, which can include nearby secret access keys needed to form usable credential pairs. Socket reported no malicious package versions on PyPI or crates.io at the time of writing, but recommended removing the workflow, rotating exposed credentials, reviewing workflow and audit logs, and securing affected maintainer accounts.\u003c/p\u003e\n"},{"n":5,"title":"The Phishing Page Printed the Visitor's Own Location","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/geofenced-block-page-printed-visitor-location-clean-url-verdict","time":"11:00","priority":"MAY READ","score":72,"tldr":"A French bank-themed phishing email passed SPF, DKIM, and DMARC and received clean URL verdicts because its landing page served different anti-analysis responses based on CAPTCHA and visitor location. The key takeaway is that a clean URL scan reflects only what the phishing kit showed that scanner at that moment, not whether the destination is safe.","briefOverview":"\u003cp\u003eA European aerospace and industrial engineering firm received three French device-renewal phishing emails on 15 May 2026 that impersonated Crédit Agricole. The messages claimed that recipients needed to renew a trusted device by 16 May under a purported PSD2-related security requirement and linked to \u003ccode\u003eportail-client-mail[.]net\u003c/code\u003e, which was not a Crédit Agricole domain. IRONSCALES Themis classified the incident as credential theft with 88 confidence, and all three messages were mitigated within seconds.\u003c/p\u003e\n\n\u003cp\u003eTwo captures of the same destination produced different results: one displayed a Crédit Agricole-branded CAPTCHA security-verification page, while another displayed a French location-blocking notice that showed the visitor\u0026rsquo;s detected country and IP address. Every recorded link verdict was clean, illustrating that a URL verdict reflected only the page response shown to that request at that time and location. SPF, DKIM, DMARC, and composite authentication also passed because the messages were sent through an abused bulk-mail account at a US technical college, while visually identical subjects used different invisible Unicode characters that could defeat exact-match rules.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A European aerospace and industrial engineering firm received three French device-renewal phishing emails on 15 May 2026 that impersonated Crédit Agricole.","Captures of the same landing URL taken two days apart showed different responses: a Crédit Agricole-branded CAPTCHA page and a French geo-restriction page that displayed the visitor’s detected country and IP address.","The landing domain portail-client-mail[.]net was not a Crédit Agricole domain, and the article states that Crédit Agricole was an uninvolved brand impersonation target.","SPF, DKIM, DMARC, and composite authentication passed because the emails were sent through an abused bulk-mail account belonging to a US technical college.","IRONSCALES Themis classified the incident as credential theft with 88 confidence and recorded all three messages as mitigated within seconds of delivery."],"insights":["A clean URL verdict reflected only the response the destination chose to show a particular request at a particular time and network location, rather than proving the destination was safe.","The geo-restriction page unusually exposed its own filtering by displaying the detected country and IP address that it had blocked, providing direct evidence that location-based access control was deliberate.","The three emails used visually identical subject lines with different invisible trailing Unicode characters, which can defeat exact-match rules by making the strings differ at the byte level.","Valid SPF, DKIM, and DMARC results established that the message was genuinely sent through the abused college bulk-mail account, but did not establish that the message itself was legitimate.","The article recommends preserving the actual page response and re-inspecting links from different locations and times, rather than relying on a single URL verdict."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's statistics on phishing as initial access, credential involvement, the human element, and email-gateway attack types.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA guidance in discussing the shift toward identity-focused phishing that can pass technical checks.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references the report alongside CISA guidance on identity-first attacks.","category":"research","primary":false}],"body":"\u003cp\u003eA European aerospace and industrial engineering firm received three French device-renewal phishing emails on 15 May 2026 that impersonated Crédit Agricole. The messages claimed that recipients needed to renew a trusted device by 16 May under a purported PSD2-related security requirement and linked to \u003ccode\u003eportail-client-mail[.]net\u003c/code\u003e, which was not a Crédit Agricole domain. IRONSCALES Themis classified the incident as credential theft with 88 confidence, and all three messages were mitigated within seconds.\u003c/p\u003e\n\n\u003cp\u003eTwo captures of the same destination produced different results: one displayed a Crédit Agricole-branded CAPTCHA security-verification page, while another displayed a French location-blocking notice that showed the visitor\u0026rsquo;s detected country and IP address. Every recorded link verdict was clean, illustrating that a URL verdict reflected only the page response shown to that request at that time and location. SPF, DKIM, DMARC, and composite authentication also passed because the messages were sent through an abused bulk-mail account at a US technical college, while visually identical subjects used different invisible Unicode characters that could defeat exact-match rules.\u003c/p\u003e\n"},{"n":1,"title":"Man admits to running network of 15,000 money mules for cybercriminals","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ukrainian-russian-dual-citizen-admits-to-laundering-millions-for-cybercriminals/","time":"11:14","priority":"MAY READ","score":68,"tldr":"Ukrainian-Russian dual citizen Oleg Korniev pleaded guilty to leading Your Mule Cashout, an international operation that recruited more than 15,000 U.S. money mules and laundered millions in cybercrime proceeds. The scheme caused over $14.7 million in actual and intended victim losses, and Korniev faces up to 50 years in prison.","briefOverview":"\u003cp\u003eUkrainian-Russian dual citizen Oleg Korniev pleaded guilty to running Your Mule Cashout (YMCO), an international money-laundering operation active since September 2007. Korniev managed employees, helped set policies, and rewarded or punished workers based on performance. He pleaded guilty to money laundering, aggravated identity theft, and conspiracies involving money laundering, computer fraud, and access-device theft.\u003c/p\u003e\n\n\u003cp\u003eYMCO recruited more than 15,000 U.S. money mules using spam emails from fake companies and a seemingly legitimate hiring process. Stolen money was sent to the recruits’ bank accounts, then transferred through Western Union and MoneyGram to cash-out contractors in Moldova, Ukraine, Russia, and Latvia. The group processed more than \u003cspan class=\"math inline\"\u003e\\(10 million stolen from over 750 U.S. bank accounts at more than 35 banks, with more than \\)\u003c/span\u003e14.7 million in actual and intended losses to confirmed victims. Korniev admitted laundering at least $7 million and faces between two and 50 years in prison.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian-Russian dual citizen Oleg Korniev pleaded guilty to charges including money laundering, aggravated identity theft, computer fraud conspiracy, and access-device theft conspiracy.","Korniev was a leader of Your Mule Cashout, an organization active since September 2007 that used more than 15,000 money mules in the United States.","Your Mule Cashout recruited U.S. residents through spam emails posing as legitimate companies and instructed them to process payments that were actually stolen funds.","The operation processed more than $10 million stolen from over 750 U.S. bank accounts at more than 35 banks and was linked to more than $14.7 million in actual and intended losses.","Korniev admitted laundering at least $7 million of the $9.7 million received from cybercriminals and faces a prison sentence ranging from two to 50 years."],"insights":["The operation relied on an employment-style recruitment process, using spam from fake companies to make money-moving work appear legitimate to U.S. residents.","Money mules were used to bridge stolen funds from U.S. bank accounts to cash-out contractors in Moldova, Ukraine, Russia, and Latvia through Western Union and MoneyGram.","The article notes that money mules may join because of economic desperation or may be forced through threats, while Europol warned that participants can still be breaking the law.","The case illustrates the long duration of cross-border enforcement: four alleged YMCO participants were arrested overseas, extradited to North Carolina, convicted, and sentenced more than a decade before Korniev’s guilty plea."],"referencedReports":[],"body":"\u003cp\u003eUkrainian-Russian dual citizen Oleg Korniev pleaded guilty to running Your Mule Cashout (YMCO), an international money-laundering operation active since September 2007. Korniev managed employees, helped set policies, and rewarded or punished workers based on performance. He pleaded guilty to money laundering, aggravated identity theft, and conspiracies involving money laundering, computer fraud, and access-device theft.\u003c/p\u003e\n\n\u003cp\u003eYMCO recruited more than 15,000 U.S. money mules using spam emails from fake companies and a seemingly legitimate hiring process. Stolen money was sent to the recruits’ bank accounts, then transferred through Western Union and MoneyGram to cash-out contractors in Moldova, Ukraine, Russia, and Latvia. The group processed more than \u003cspan class=\"math inline\"\u003e\\(10 million stolen from over 750 U.S. bank accounts at more than 35 banks, with more than \\)\u003c/span\u003e14.7 million in actual and intended losses to confirmed victims. Korniev admitted laundering at least $7 million and faces between two and 50 years in prison.\u003c/p\u003e\n"},{"n":4,"title":"The AI Velocity Paradox: Why Security Is Decades Behind AI Ambition","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/the-ai-velocity-paradox-why-security-is.html","time":"11:30","priority":"MAY READ","score":45,"tldr":"SailPoint’s report argues that enterprises are adopting autonomous AI agents faster than their identity security can govern them, leaving non-human identities managed by human-speed, manual controls. Organizations need continuous, automated, machine-speed access governance to close this gap.","briefOverview":"\u003cp\u003eSailPoint’s \u003cem\u003eHorizons of Identity Security\u003c/em\u003e report describes a “velocity paradox” in which enterprises deploy autonomous AI agents while relying on security controls built around slower, human-driven processes. The article says 60% of organizations remain in either Horizon 1, “No Formal Program,” or Horizon 2, “Manual, Tool-Assisted,” for identity security maturity. It argues that this persistence reflects an architectural ceiling rather than a lack of effort, because human-focused operating models do not scale to autonomous agents.\u003c/p\u003e\n\n\u003cp\u003eHuman identity security has improved over five years, with organizations at the lowest maturity level declining from 45% to 23%, while 54% are currently at Horizon 1 for non-human and AI agent identities. Scheduled reviews and ticket-based access decisions are described as ineffective for machine identities that may exist only for seconds or minutes and execute thousands of transactions per minute. The report calls for continuous, contextual, automated policy enforcement and for extending existing governance disciplines to unmanaged non-human identities across an organization’s digital estate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SailPoint’s Horizons of Identity Security report says organizations are adopting autonomous AI agents while relying on security controls designed for human-operated processes.","The report states that 60% of organizations remain in either the “No Formal Program” or “Manual, Tool-Assisted” identity-security maturity stages.","Human identity security has improved over five years, with the share of organizations at the lowest maturity level declining from 45% to 23%.","For non-human and AI agent identities, 54% of organizations are currently at the lowest maturity level, according to the report.","The report argues that organizations need continuous, contextual, automated policy enforcement rather than manual, ticket-based access decisions to operate at machine speed."],"insights":["The article frames the main obstacle as an architectural limit rather than a lack of investment or expertise: processes built for employee access do not scale to AI agents that can be short-lived and perform thousands of transactions per minute.","Digitizing human-oriented controls, such as scheduled access reviews, is presented as insufficient for machine accounts that may exist for only seconds or minutes.","The report suggests the gap is one of coverage rather than competence, because organizations that have improved human identity controls still struggle to apply comparable governance to cloud workloads and AI agents.","The claimed strategy of balancing speed and security is characterized as ineffective unless an organization has the operational ability to enforce that balance automatically and continuously.","The article’s proposed path forward is not to replace all existing governance, but to extend proven identity-governance practices to unmanaged non-human identities in a unified system."],"referencedReports":[],"body":"\u003cp\u003eSailPoint’s \u003cem\u003eHorizons of Identity Security\u003c/em\u003e report describes a “velocity paradox” in which enterprises deploy autonomous AI agents while relying on security controls built around slower, human-driven processes. The article says 60% of organizations remain in either Horizon 1, “No Formal Program,” or Horizon 2, “Manual, Tool-Assisted,” for identity security maturity. It argues that this persistence reflects an architectural ceiling rather than a lack of effort, because human-focused operating models do not scale to autonomous agents.\u003c/p\u003e\n\n\u003cp\u003eHuman identity security has improved over five years, with organizations at the lowest maturity level declining from 45% to 23%, while 54% are currently at Horizon 1 for non-human and AI agent identities. Scheduled reviews and ticket-based access decisions are described as ineffective for machine identities that may exist only for seconds or minutes and execute thousands of transactions per minute. The report calls for continuous, contextual, automated policy enforcement and for extending existing governance disciplines to unmanaged non-human identities across an organization’s digital estate.\u003c/p\u003e\n"}]</script>
