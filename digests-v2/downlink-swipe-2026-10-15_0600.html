<script type="application/json" id="dl-articles">[{"n":3,"title":"Langflow's Critical Authenticated RCE Flaw Targeted in 1,423 Honeypot Exploit Attempts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/langflows-critical-authenticated-rce.html","time":"07:07","priority":"MUST READ","score":96,"tldr":"Attackers are actively targeting CVE-2026-105740, a critical authenticated RCE flaw in Langflow versions before 1.9.0 that lets any authenticated user execute arbitrary server commands through malicious MCP server configurations. Organizations should upgrade immediately, disable auto-login, enforce strong credentials, and investigate suspicious requests to Langflow MCP endpoints.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-105740, a critical Langflow flaw with a CVSS score of 9.9 that affects versions before 1.9.0. Langflow is an open-source platform for building AI applications and agentic workflows. Previdian recorded 1,423 exploit attempts against its honeypot sensors from 27 unique IP addresses since September 19, 2026. Activity increased sharply on October 11, when 333 attempts were observed.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows any authenticated Langflow user, including a non-admin user, to execute arbitrary operating-system commands by adding an MCP server using the stdio transport. Langflow passes the user-provided command directly to a shell without validation, and fetching the MCP server list triggers the command. Attackers can also inject environment variables, while malicious server configurations persist and re-execute whenever the server list is loaded. Observed payloads sought Langflow secrets and environment variables, attempted Docker-based access to the host filesystem, and ran commands such as \u003ccode\u003eid\u003c/code\u003e and \u003ccode\u003ewhoami\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eIn one observed sequence, attackers checked the Langflow version, attempted the auto-login endpoint, authenticated with common credentials, and used the resulting bearer token to reach the vulnerable endpoint. Langflow users are advised to upgrade to a patched version, disable auto-login, use strong unique passwords, limit accounts to trusted users, and review authentication logs and requests to \u003ccode\u003e/api/v2/mcp/servers/\u003c/code\u003e for suspicious activity. If patching cannot happen immediately, Langflow should not be exposed directly to untrusted networks and \u003ccode\u003eLANGFLOW_AUTO_LOGIN\u003c/code\u003e should be set to \u003ccode\u003efalse\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-105740 is a critical authenticated remote-code-execution flaw, rated 9.9 out of 10, affecting Langflow versions before 1.9.0.","The flaw allows any authenticated Langflow user, including a non-administrator, to run arbitrary operating-system commands by creating an MCP server configuration with the stdio transport and then fetching the server list.","Previdian recorded 1,423 exploit attempts from 27 attacker IP addresses against its honeypot sensors since September 19, 2026, with activity rising to 333 attempts on October 11.","Observed payloads attempted to collect Langflow environment variables and secret settings, access the host filesystem through Docker commands, and run basic commands such as id and whoami.","Langflow and Previdian recommend upgrading to a patched version, disabling auto-login, using strong unique passwords, restricting access to trusted users, and reviewing requests to the MCP server endpoints."],"insights":["The malicious MCP server configuration can provide persistence because its command is executed again whenever the server list is loaded.","MCP server configurations are stored in project settings and are not visible during normal flow review, making malicious entries easier to miss than custom component code.","In an observed honeypot sequence, attackers first checked the Langflow version, tried the disabled auto-login endpoint, then successfully used common credentials to obtain a bearer token and access the vulnerable endpoint.","The issue permits not only command execution but also environment-variable injection, including potentially changing the command search path or loading attacker-controlled code through LD_PRELOAD.","Observed payloads included Docker commands intended to access the underlying host filesystem, showing that attackers were probing beyond the Langflow application itself."],"referencedReports":[{"title":"CVE-2026-105740 Telemetry","url":"https://previdian.com/CVE-2026-105740#telemetry","publisher":"previdian","context":"The article cites Previdian's alert and telemetry as the source for the observed Langflow exploitation attempts against its honeypots.","category":"research","primary":true},{"title":"GHSA-7w94-79vh-5mr2: Authenticated Remote Code Execution Through MCP stdio Server Configuration","url":"https://github.com/langflow-ai/langflow/security/advisories/GHSA-7w94-79vh-5mr2","publisher":"langflow","context":"The article cites Langflow's security advisory describing CVE-2026-105740 and its command-execution and environment-variable-injection impact.","category":"advisory","primary":true},{"title":"GHSA-w794-rj3p-xv45: CVE-2026-105697","url":"https://github.com/langflow-ai/langflow/security/advisories/GHSA-w794-rj3p-xv45","publisher":"langflow","context":"The article links to Langflow's advisory for a separate critical MCP stdio server configuration command-injection issue addressed the previous month.","category":"advisory","primary":false}],"body":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-105740, a critical Langflow flaw with a CVSS score of 9.9 that affects versions before 1.9.0. Langflow is an open-source platform for building AI applications and agentic workflows. Previdian recorded 1,423 exploit attempts against its honeypot sensors from 27 unique IP addresses since September 19, 2026. Activity increased sharply on October 11, when 333 attempts were observed.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows any authenticated Langflow user, including a non-admin user, to execute arbitrary operating-system commands by adding an MCP server using the stdio transport. Langflow passes the user-provided command directly to a shell without validation, and fetching the MCP server list triggers the command. Attackers can also inject environment variables, while malicious server configurations persist and re-execute whenever the server list is loaded. Observed payloads sought Langflow secrets and environment variables, attempted Docker-based access to the host filesystem, and ran commands such as \u003ccode\u003eid\u003c/code\u003e and \u003ccode\u003ewhoami\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eIn one observed sequence, attackers checked the Langflow version, attempted the auto-login endpoint, authenticated with common credentials, and used the resulting bearer token to reach the vulnerable endpoint. Langflow users are advised to upgrade to a patched version, disable auto-login, use strong unique passwords, limit accounts to trusted users, and review authentication logs and requests to \u003ccode\u003e/api/v2/mcp/servers/\u003c/code\u003e for suspicious activity. If patching cannot happen immediately, Langflow should not be exposed directly to untrusted networks and \u003ccode\u003eLANGFLOW_AUTO_LOGIN\u003c/code\u003e should be set to \u003ccode\u003efalse\u003c/code\u003e.\u003c/p\u003e\n"},{"n":6,"title":"Palo Alto Networks Patches PAN-OS Authenticated RCE Flaw Amid Active Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/palo-alto-networks-patches-pan-os.html","time":"06:17","priority":"MUST READ","score":96,"tldr":"Palo Alto Networks has patched CVE-2026-0322, an actively exploited authenticated PAN-OS management-interface flaw that lets attackers execute code as root on affected PA-Series, VM-Series, and Panorama systems. Organizations should urgently update to fixed releases and restrict management access to trusted internal addresses or a jump box.","briefOverview":"\u003cp\u003ePalo Alto Networks released security updates for CVE-2026-0322, a high-severity remote code execution flaw in the PAN-OS management interface that it says is under active, though very limited, exploitation. An authenticated attacker with network access can use the issue to execute arbitrary code with root privileges on an affected firewall. Palo Alto Networks said no special configuration is required for exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects PAN-OS on PA-Series and VM-Series firewalls and Panorama virtual and M-Series systems; Cloud NGFW and Prisma Access are not affected. The company provided fixed PAN-OS releases across supported version branches and recommended limiting management-interface access to trusted internal IP addresses or a jump box. It identified three U.S.-geolocated IP addresses assessed to be tied to exploitation attempts.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-0322 to its Known Exploited Vulnerabilities catalog, along with Cisco Secure Email Gateway flaw CVE-2026-76519. Federal Civilian Executive Branch agencies are required to prioritize fixes for both issues by October 17, 2026. Cisco said CVE-2026-76519 is being exploited and could allow an unauthenticated remote attacker to write arbitrary files and execute commands with root privileges when the file reputation service is enabled.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks released security updates for CVE-2026-0322, a high-severity PAN-OS management-interface flaw that is under active exploitation.","CVE-2026-0322 allows an authenticated attacker with network access to execute arbitrary code with root privileges on affected firewalls.","The issue affects PAN-OS on PA-Series and VM-Series firewalls and Panorama virtual and M-Series systems, while Cloud NGFW and Prisma Access are not affected.","Palo Alto Networks said it has observed very limited exploitation and listed three U.S.-geolocated IP addresses assessed to be linked to exploit attempts.","CISA added CVE-2026-0322 and Cisco Secure Email Gateway flaw CVE-2026-76519 to its Known Exploited Vulnerabilities catalog."],"insights":["Although exploitation requires authenticated access, the flaw can grant root-level control of the firewall and does not require any special configuration to be exploitable.","Restricting management-interface access to trusted internal IP addresses, ideally through a dedicated jump box, is the vendor-recommended way to reduce exposure while patching.","Palo Alto Networks described observed exploitation as \"very limited\" but publicly identified three U.S.-geolocated IP addresses assessed to be associated with the attempts.","CISA added the issue to its Known Exploited Vulnerabilities catalog and directed Federal Civilian Executive Branch agencies to prioritize remediation by October 17, 2026."],"referencedReports":[{"title":"CVE-2026-0322","url":"https://security.paloaltonetworks.com/CVE-2026-0322","publisher":"palo-alto-networks","context":"Palo Alto Networks' security advisory describes the authenticated PAN-OS remote code execution flaw, affected products, and available fixes.","category":"advisory","primary":true},{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/10/14/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's alert adding CVE-2026-0322 and CVE-2026-76519 to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003ePalo Alto Networks released security updates for CVE-2026-0322, a high-severity remote code execution flaw in the PAN-OS management interface that it says is under active, though very limited, exploitation. An authenticated attacker with network access can use the issue to execute arbitrary code with root privileges on an affected firewall. Palo Alto Networks said no special configuration is required for exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects PAN-OS on PA-Series and VM-Series firewalls and Panorama virtual and M-Series systems; Cloud NGFW and Prisma Access are not affected. The company provided fixed PAN-OS releases across supported version branches and recommended limiting management-interface access to trusted internal IP addresses or a jump box. It identified three U.S.-geolocated IP addresses assessed to be tied to exploitation attempts.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-0322 to its Known Exploited Vulnerabilities catalog, along with Cisco Secure Email Gateway flaw CVE-2026-76519. Federal Civilian Executive Branch agencies are required to prioritize fixes for both issues by October 17, 2026. Cisco said CVE-2026-76519 is being exploited and could allow an unauthenticated remote attacker to write arbitrary files and execute commands with root privileges when the file reputation service is enabled.\u003c/p\u003e\n"},{"n":5,"title":"AhsayCBS Flaws Exploited to Deploy Web Shells Get New Fixes After Incomplete Patches","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/ahsaycbs-flaws-exploited-to-deploy-web.html","time":"06:43","priority":"MUST READ","score":92,"tldr":"Ahsay Backup released new AhsayCBS hotfixes after earlier patches failed to fully fix two actively exploited flaws that attackers chained to gain unauthenticated remote code execution and install web shells and XMRig miners. Organizations should upgrade to AhsayCBS 10.3.4.45 or 9.15.2.70 and reboot affected servers.","briefOverview":"\u003cp\u003eAhsay Backup released new security hotfixes for two actively exploited AhsayCBS flaws, CVE-2026-105133 and CVE-2026-105134. Attackers have chained the issues to bypass authentication and run arbitrary commands on exposed systems. Huntress observed attackers using the chain to install web shells and XMRig cryptocurrency miners.\u003c/p\u003e\n\n\u003cp\u003eEarlier AhsayCBS releases, versions 9.15.2.59 and 10.3.4.0, were initially believed to address the issues, but Ahsay confirmed the patches were incomplete. The corrected fixes are AhsayCBS v10.3.4.45 hotfix and v9.15.2.70 hotfix, and Ahsay says servers should be rebooted after applying them. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog, with U.S. federal agencies required to patch by October 17, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ahsay Backup released new AhsayCBS hotfixes for CVE-2026-105133 and CVE-2026-105134 after earlier patches did not completely fix the flaws.","Attackers have chained the two flaws to bypass authentication, run arbitrary commands, and deploy web shells and XMRig cryptocurrency miners on exposed systems.","The new fixes are available in AhsayCBS version 10.3.4.45 hotfix and version 9.15.2.70 hotfix, and Ahsay says servers should be rebooted after installation.","Huntress independently verified that the AhsayCBS 10.3.4.45 hotfix mitigates the initial entry point used in the attack chain.","CISA added the two vulnerabilities to its Known Exploited Vulnerabilities catalog and required U.S. federal agencies to apply patches by October 17, 2026."],"insights":["Organizations that applied the August 2026 AhsayCBS updates may still have remained exposed, because Ahsay later confirmed those patches did not fully address the two flaws.","The two issues are especially serious together because attackers can combine them to bypass login controls and then execute commands on the affected system.","The recommended remediation includes restarting the server after installing the hotfix, not merely applying the update.","CISA’s inclusion of both flaws in its Known Exploited Vulnerabilities catalog shows that their active abuse was significant enough to trigger a patch deadline for U.S. federal agencies."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/10/14/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article says CISA added the two AhsayCBS vulnerabilities to its Known Exploited Vulnerabilities catalog following active exploitation.","category":"advisory","primary":false}],"body":"\u003cp\u003eAhsay Backup released new security hotfixes for two actively exploited AhsayCBS flaws, CVE-2026-105133 and CVE-2026-105134. Attackers have chained the issues to bypass authentication and run arbitrary commands on exposed systems. Huntress observed attackers using the chain to install web shells and XMRig cryptocurrency miners.\u003c/p\u003e\n\n\u003cp\u003eEarlier AhsayCBS releases, versions 9.15.2.59 and 10.3.4.0, were initially believed to address the issues, but Ahsay confirmed the patches were incomplete. The corrected fixes are AhsayCBS v10.3.4.45 hotfix and v9.15.2.70 hotfix, and Ahsay says servers should be rebooted after applying them. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog, with U.S. federal agencies required to patch by October 17, 2026.\u003c/p\u003e\n"},{"n":4,"title":"GhostAction Compromises About 1,900 GitHub Accounts, Targets Over 30,000 Repositories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/ghostaction-compromises-about-1900.html","time":"08:45","priority":"MUST READ","score":91,"tldr":"GhostAction attackers compromised about 1,900 GitHub accounts and pushed malicious GitHub Actions workflows to more than 30,000 repositories to steal CI/CD secrets, cloud credentials, and package registry tokens. GitHub began blocking the workflows on October 9, limiting later waves, but previously exposed secrets may remain at risk if they were not rotated.","briefOverview":"\u003cp\u003eGhostAction, a campaign that targets developer infrastructure on GitHub, expanded sharply on October 8 and 9, 2026. According to GitGuardian, attackers compromised about 1,900 GitHub accounts and targeted more than 30,000 repositories across 3,000 users and organizations. The activity attempted to extract 3,174 secrets from public repositories’ CI processes.\u003c/p\u003e\n\n\u003cp\u003eAttackers used stolen Personal Access Tokens or credentials from infostealer logs and dumps to gain write access, then added malicious GitHub Actions workflow files with misleading names such as \u003ccode\u003esecurity-audit.yml\u003c/code\u003e. The workflows sought CI/CD secrets, cloud credentials, package-registry tokens, and AI-provider API keys, while newer versions also scanned Git history for secrets and captured nearby context for AWS key ID matches. GitHub began preventing the malicious workflows from running on October 9, blocking secret extraction in later waves observed on October 10 and 12, although some newly targeted victims had also been compromised in earlier campaigns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GhostAction targeted more than 30,000 GitHub repositories across 3,000 users and organizations during activity observed on October 8 and 9, 2026.","The campaign compromised about 1,900 GitHub accounts and attempted to extract 3,174 secrets from public repositories’ automated build and deployment processes.","Attackers used stolen personal access tokens or credentials from information-stealing logs and dumps to gain repository write access and add malicious GitHub Actions workflow files.","The malicious workflows sought cloud credentials, software package registry tokens, AI provider API keys, and secrets found in repository history.","GitHub began preventing the malicious workflow from running on October 9, so later waves observed on October 10 and 12 could not extract secrets."],"insights":["The attackers deployed the same payload to 160 previously observed victims and then expanded to 28,000 new repositories only 20 minutes later, showing a rapid escalation in scale.","Later versions of the malicious workflow searched Git history and captured nearby text around AWS key identifiers to help pair them with corresponding secret access keys.","Some repositories affected in the October 2026 burst had also been compromised in September 2025 and August 2026, making unrotated previously exposed secrets a continuing concern.","Although new GhostAction waves appeared on October 10 and 12, GitHub’s prevention of the workflow from October 9 meant those later attempts could not collect secrets."],"referencedReports":[{"title":"GhostAction: The GitHub Actions Supply Chain Attack Returns","url":"https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/","publisher":"gitguardian","context":"The article relies on GitGuardian researchers' analysis of the October 2026 GhostAction activity, including the number of compromised accounts, targeted repositories, payload changes, and GitHub's mitigation.","category":"research","primary":true}],"body":"\u003cp\u003eGhostAction, a campaign that targets developer infrastructure on GitHub, expanded sharply on October 8 and 9, 2026. According to GitGuardian, attackers compromised about 1,900 GitHub accounts and targeted more than 30,000 repositories across 3,000 users and organizations. The activity attempted to extract 3,174 secrets from public repositories’ CI processes.\u003c/p\u003e\n\n\u003cp\u003eAttackers used stolen Personal Access Tokens or credentials from infostealer logs and dumps to gain write access, then added malicious GitHub Actions workflow files with misleading names such as \u003ccode\u003esecurity-audit.yml\u003c/code\u003e. The workflows sought CI/CD secrets, cloud credentials, package-registry tokens, and AI-provider API keys, while newer versions also scanned Git history for secrets and captured nearby context for AWS key ID matches. GitHub began preventing the malicious workflows from running on October 9, blocking secret extraction in later waves observed on October 10 and 12, although some newly targeted victims had also been compromised in earlier campaigns.\u003c/p\u003e\n"},{"n":2,"title":"UK Legal Aid Agency: Hackers stole records dating back to 1978","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/uk-legal-aid-agency-hackers-stole-records-dating-back-to-1978/","time":"08:06","priority":"SHOULD READ","score":86,"tldr":"The UK Legal Aid Agency says attackers who breached its systems in April 2025 stole sensitive legal-aid records dating as far back as 1978, including roughly 250,000 records from before 2007. The agency says there is no evidence the exfiltrated personal data has been published and is increasing investment in system modernization and cybersecurity.","briefOverview":"\u003cp\u003eThe UK Legal Aid Agency (LAA) said attackers who breached its IT systems in April 2025 stole records dating as far back as 1978. The LAA, which is part of the Ministry of Justice, manages legal-aid funding and works with around 2,000 providers in England and Wales. The agency initially disclosed the incident in early May, warning that payment information for legal-aid providers may have been compromised.\u003c/p\u003e\n\n\u003cp\u003eFollow-up analysis found that most stolen data relates to applications, claims, payments, or live cases from January 2007 through 16 May 2025, but about 250,000 records predate 2007. The affected information may include applicants\u0026rsquo; contact details, birth dates, national ID numbers, criminal histories, employment status, debts, contributions, and payments, as well as provider contracts, financial data, and LAA Online Portal credentials. The Ministry of Justice says it has no evidence that the data has been published and is investing more than £200 million to modernize legal-aid digital services, improve resilience, and strengthen cyber security.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The UK Legal Aid Agency said attackers who breached its IT systems in April 2025 stole records with an earliest verified date of 1978.","Most of the stolen data concerns legal-aid applications, claims, payments, or live cases from January 2007 to 16 May 2025, while approximately 250,000 records predate 2007.","The stolen information may include applicants’ contact details, dates of birth, national ID numbers, criminal histories, employment status, and financial contribution, debt, and payment details.","Data belonging to legal-aid providers was also taken, including contracts, office locations, financial and contact information, and LAA Online Portal credentials.","The Ministry of Justice said there is currently no evidence that the personal data believed to have been taken has been published and that it is investing more than £200 million in modernizing legal-aid digital services and cyber security."],"insights":["The breach’s known historical scope expanded substantially during follow-up analysis: it was initially described as affecting data from 2010 onward, but the earliest verified stolen record now dates to 1978.","Although the data set reaches back nearly five decades, the agency says only about 250,000 records predate 2007 and that the overwhelming majority of those older records are from the 1990s and 2000s.","The incident affects both people seeking legal aid and the organizations delivering it, because stolen provider information included LAA Online Portal names and email addresses as well as contracts and financial details.","The Ministry of Justice had already committed £20 million to stabilize and upgrade the agency’s digital systems before the incident and now says it is investing more than £200 million in modernization, resilience, and cyber security."],"referencedReports":[],"body":"\u003cp\u003eThe UK Legal Aid Agency (LAA) said attackers who breached its IT systems in April 2025 stole records dating as far back as 1978. The LAA, which is part of the Ministry of Justice, manages legal-aid funding and works with around 2,000 providers in England and Wales. The agency initially disclosed the incident in early May, warning that payment information for legal-aid providers may have been compromised.\u003c/p\u003e\n\n\u003cp\u003eFollow-up analysis found that most stolen data relates to applications, claims, payments, or live cases from January 2007 through 16 May 2025, but about 250,000 records predate 2007. The affected information may include applicants\u0026rsquo; contact details, birth dates, national ID numbers, criminal histories, employment status, debts, contributions, and payments, as well as provider contracts, financial data, and LAA Online Portal credentials. The Ministry of Justice says it has no evidence that the data has been published and is investing more than £200 million to modernize legal-aid digital services, improve resilience, and strengthen cyber security.\u003c/p\u003e\n"},{"n":7,"title":"The GhostX Ecosystem: Forged in Transit, Licensed to Deceive","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/ghostx-forged-in-transit-licensed-to-deceive/","time":"08:44","priority":"SHOULD READ","score":84,"tldr":"Cyble uncovered GhostX, an active ecosystem distributing GhostBat RAT through fake Indian mParivahan and eChallan apps, with backend infrastructure for phishing, device management, and campaign control. The latest Android malware abuses Accessibility Services to stealthily capture PINs in Google Pay, MobiKwik, and dozens of other financial apps while dynamically changing its C2 and features through Firebase.","briefOverview":"\u003cp\u003eCyble’s investigation of fake mParivahan and eChallan Android applications uncovered GhostX, an operator-controlled ecosystem that links phishing infrastructure, backend services, Firebase-based configuration, device management, and GhostBat RAT distribution. The campaign targets Android users in India through text-message scams that direct victims to fake government-service or Google Play-style download pages hosting malicious APKs. Exposed backend records showed administrator and user structures, device-control data, SMS-delivery instructions, call-forwarding activity, and changing phishing content, indicating active campaign management.\u003c/p\u003e\n\n\u003cp\u003eThe latest GhostBat RAT variant abuses Android Accessibility Service to capture financial-app PINs. Its Ghost Overlay feature places transparent touch regions over genuine Google Pay and MobiKwik PIN keypads, records the selected digits, and replays the taps into the legitimate app so the payment flow continues normally. The malware also captures PIN-like input across 60 targeted Indian banking, UPI, wallet, fintech, and payment applications, while Firebase Remote Config allows operators to change command-and-control infrastructure and selected functions without redistributing the APK.\u003c/p\u003e\n\n\u003cp\u003eGhostBat RAT’s delivery mechanisms have also evolved through multiple loaders and droppers, including encrypted APK containers, custom payload formats, in-memory DEX loaders, remote APK downloaders, and a newer native loader in libnetbridge.so. The newest loader uses several transformation, encryption, compression, and custom container stages before recovering a split-APK payload, complicating automated extraction and simple asset scanning. Alongside PIN theft, GhostBat RAT can collect SMS messages and call logs, remotely send SMS messages, manipulate call forwarding, profile devices, and communicate with attacker-controlled services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyble identified GhostX as an operator-controlled ecosystem linking phishing sites, Firebase-based backend services, device management, and distribution of GhostBat RAT through fake mParivahan and eChallan Android apps.","GhostBat RAT is distributed through text-message phishing campaigns that direct victims to fake transport-service or Google Play-style pages hosting malicious APK files, including assets hosted on GitHub.","The latest GhostBat RAT variant abuses Android Accessibility Service to place transparent touch regions over Google Pay and MobiKwik PIN keypads, capture the selected digits, and replay the taps into the genuine app.","The malware also uses accessibility events to capture PIN-like input from 60 targeted Indian banking, UPI, wallet, fintech, and payment applications.","Firebase Remote Config lets the operators change GhostBat RAT’s command-and-control backend and selectively enable or disable malware functions without redistributing the APK."],"insights":["GhostBat RAT’s transparent PIN-capture method is designed to preserve the normal Google Pay or MobiKwik experience: it records a victim’s tap, then uses Android’s accessibility feature to replay that same tap into the real app.","The exposed GhostX backend contained separate administrator, user, and bot-user records, session information, and administrator device fingerprints, indicating a structured operator-management layer rather than only a basic malware control server.","Operators can alter both the malware’s backend address and selected functions through Firebase Remote Config, so blocking the default observed server alone may not provide durable protection.","The newest loader conceals the final split APK behind RC4-like processing, AES-256-GCM decryption, zlib decompression, and custom MSZ1/MSP1 containers, making simple scans for APK or ZIP structures less effective.","The backend’s changing text-message lures, phishing links, vehicle registration numbers, and recipient phone numbers showed active campaign management during the investigation."],"referencedReports":[],"body":"\u003cp\u003eCyble’s investigation of fake mParivahan and eChallan Android applications uncovered GhostX, an operator-controlled ecosystem that links phishing infrastructure, backend services, Firebase-based configuration, device management, and GhostBat RAT distribution. The campaign targets Android users in India through text-message scams that direct victims to fake government-service or Google Play-style download pages hosting malicious APKs. Exposed backend records showed administrator and user structures, device-control data, SMS-delivery instructions, call-forwarding activity, and changing phishing content, indicating active campaign management.\u003c/p\u003e\n\n\u003cp\u003eThe latest GhostBat RAT variant abuses Android Accessibility Service to capture financial-app PINs. Its Ghost Overlay feature places transparent touch regions over genuine Google Pay and MobiKwik PIN keypads, records the selected digits, and replays the taps into the legitimate app so the payment flow continues normally. The malware also captures PIN-like input across 60 targeted Indian banking, UPI, wallet, fintech, and payment applications, while Firebase Remote Config allows operators to change command-and-control infrastructure and selected functions without redistributing the APK.\u003c/p\u003e\n\n\u003cp\u003eGhostBat RAT’s delivery mechanisms have also evolved through multiple loaders and droppers, including encrypted APK containers, custom payload formats, in-memory DEX loaders, remote APK downloaders, and a newer native loader in libnetbridge.so. The newest loader uses several transformation, encryption, compression, and custom container stages before recovering a split-APK payload, complicating automated extraction and simple asset scanning. Alongside PIN theft, GhostBat RAT can collect SMS messages and call logs, remotely send SMS messages, manipulate call forwarding, profile devices, and communicate with attacker-controlled services.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft fixes bug causing Windows black screens, Explorer crashes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-fixes-bug-causing-windows-black-screens-explorer-crashes/","time":"09:10","priority":"MAY READ","score":68,"tldr":"Microsoft fixed a Windows 11 issue causing black screens, desktop-loading failures, and Explorer crashes, primarily affecting Azure Virtual Desktop hosts using FSLogix. Installing cumulative updates released on or after October 13, 2026 resolves the problem.","briefOverview":"\u003cp\u003eMicrosoft has resolved a Windows 11 issue that caused black screens after sign-in, desktop-loading problems, and Windows Explorer crashes. The issue mainly affected Azure Virtual Desktop hosts using FSLogix, a tool designed to speed up user profile loading in virtual desktop environments. Microsoft said the problem is fixed in Windows updates released on or after October 13, 2026.\u003c/p\u003e\n\n\u003cp\u003eAffected users who cannot install the latest updates can temporarily restore their desktop by opening Task Manager, creating a new task, and running \u003ccode\u003eexplorer.exe\u003c/code\u003e. Enterprise-managed devices can also use Microsoft’s Known Issue Rollback group policies for Windows 11 versions 26H1, 25H2, and 24H2. Microsoft noted that administrators must install and configure the appropriate policy and restart devices for the rollback to take effect.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft resolved a Windows 11 issue that caused black screens after sign-in, desktop-loading problems, and Windows Explorer crashes.","The issue mainly affected Azure Virtual Desktop hosts using FSLogix, which is used to speed up user profile loading in virtual desktop environments.","Windows updates released on or after October 13, 2026, resolve the issue, according to Microsoft.","Users unable to install the latest updates can temporarily start Windows Explorer manually through Task Manager by running explorer.exe.","Enterprise-managed devices can use Microsoft’s Known Issue Rollback group policies for Windows 11 versions 26H1, 25H2, and 24H2 until they deploy the permanent update."],"insights":["The problem was concentrated in Azure Virtual Desktop hosts using FSLogix rather than being described as broadly affecting all Windows 11 devices.","Organizations that cannot immediately install the permanent update can restore desktop access by manually starting explorer.exe from Task Manager.","Microsoft provided enterprise rollback policies that disable the change responsible for the issue, but affected devices must be restarted after the policy is installed and configured.","The article notes that Microsoft also addressed Always On VPN problems from September 2026 updates while separately warning of Remote Desktop failures for non-admin users when Administrator protection is enabled."],"referencedReports":[{"title":"Windows 11, version 25H2 release health","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-25h2#5006msgdesc","publisher":"microsoft","context":"Microsoft’s release health update states that Windows updates released on or after October 13, 2026 resolve the black-screen and desktop-loading issue.","category":"advisory","primary":true},{"title":"Windows 11, version 26H1 release health","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-26h1#devices-might-experience-a-black-screen-or-desktop-loading-issues-after-sign-in","publisher":"microsoft","context":"Microsoft’s release health advisory provides instructions and caveats for using a Known Issue Rollback policy on enterprise-managed devices.","category":"advisory","primary":true},{"title":"Use Group Policy to deploy a Known Issue Rollback","url":"https://docs.microsoft.com/en-us/troubleshoot/windows-client/group-policy/use-group-policy-to-deploy-known-issue-rollback","publisher":"microsoft","context":"The article directs IT administrators to Microsoft’s guidance for deploying and configuring Known Issue Rollback Group Policy settings.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft has resolved a Windows 11 issue that caused black screens after sign-in, desktop-loading problems, and Windows Explorer crashes. The issue mainly affected Azure Virtual Desktop hosts using FSLogix, a tool designed to speed up user profile loading in virtual desktop environments. Microsoft said the problem is fixed in Windows updates released on or after October 13, 2026.\u003c/p\u003e\n\n\u003cp\u003eAffected users who cannot install the latest updates can temporarily restore their desktop by opening Task Manager, creating a new task, and running \u003ccode\u003eexplorer.exe\u003c/code\u003e. Enterprise-managed devices can also use Microsoft’s Known Issue Rollback group policies for Windows 11 versions 26H1, 25H2, and 24H2. Microsoft noted that administrators must install and configure the appropriate policy and restart devices for the rollback to take effect.\u003c/p\u003e\n"}]</script>
