<script type="application/json" id="dl-articles">[{"n":33,"title":"wp2shell hits WordPress: detecting pre-auth RCE from plugin drop to command execution","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/wp2shell-wordpress-rce-detection-elastic-defend","time":"00:00","priority":"MUST READ","score":96,"tldr":"WordPress wp2shell is a pre-authentication RCE chain affecting WordPress 6.9.0–6.9.4 and 7.0.0–7.0.1, with public PoCs already leading to scans and exploitation. Patch to 6.9.5 or 7.0.2 immediately and hunt for web-server-spawned shells, suspicious plugin PHP files under wp-content, and batch REST API access-log indicators.","briefOverview":"\u003cp\u003eSearchlight Cyber disclosed wp2shell on July 17, 2026, describing it as a pre-authentication remote code execution chain in WordPress Core tracked as CVE-2026-63030 and CVE-2026-60137. Public proof-of-concept tools appeared on GitHub within hours, and scanning followed immediately. The article says Elastic has observed the same host footprint in customer telemetry, including PHP and web server runtimes spawning shells, new plugin directories under wp-content/plugins/, and access-log markers from stock tooling.\u003c/p\u003e\n\n\u003cp\u003eThe affected WordPress versions for the full pre-authentication RCE chain are 6.9.0 to 6.9.4 and 7.0.0 to 7.0.1, with fixes in 6.9.5 and 7.0.2. The article explains that wp2shell abuses WordPress Core’s REST batch endpoint through route confusion, with public chains nesting batches to bypass method restrictions and reach a pre-authentication SQL injection primitive. Tooling can then escalate to administrator access and upload a plugin-backed webshell, or in other observed activity write a webshell directly to disk through SQL INTO OUTFILE.\u003c/p\u003e\n\n\u003cp\u003eElastic ran the public Icex0 PoC in a lab and mapped the resulting activity to Elastic Defend and SIEM detections. The lab showed apache2 staging plugin files, creating wp2shell\u003cem\u003e\u003chex\u003e plugin directories, spawning dash from the plugin working directory, and running commands such as id, whoami, hostname, cleanup commands, uname, cat /etc/passwd, and SUID file enumeration. The article recommends patching first, hunting fresh indicators such as batch endpoint requests and wp2shell\u003c/em\u003e\u003chex\u003e paths, and relying on behavioral detection because attackers can rename plugins, rewrite payloads, or place webshells outside the plugin directory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Searchlight Cyber disclosed wp2shell on July 17, 2026 as a pre-authentication remote code execution chain in WordPress Core tracked as CVE-2026-63030 and CVE-2026-60137.","The article states that WordPress versions 6.9.0 to 6.9.4 and 7.0.0 to 7.0.1 are exposed to the full pre-authentication RCE chain, while fixed versions are 6.9.5 and 7.0.2.","Elastic observed public proof-of-concept activity producing consistent host behavior, including web server or PHP runtimes spawning shells, new plugin directories under wp-content/plugins/, and access-log markers such as POST requests to the batch REST endpoint.","In Elastic’s lab run of the Icex0 PoC, the exploit staged plugin files under wp-content, executed commands through apache2 spawning dash, and triggered alerts for PHP file creation, payload execution by a web server, and suspicious or unusual command execution.","The article recommends patching first, hunting fresh indicators such as wp2shell_\u003chex\u003e plugin directories and batch endpoint requests, and relying on behavioral detections because attackers can rename plugins or change payload locations."],"insights":["A missing wp2shell_\u003chex\u003e plugin directory does not prove a host is clean, because the Icex0 PoC removes its own plugin directory and staged zip after execution.","The most durable detection opportunity is not the wp2shell plugin name or User-Agent, but the web server process crossing into command execution by spawning a shell such as dash, bash, or sh.","The PHP plugin-directory file creation rule can catch the plugin-upload chain early, but it will not catch variants that write webshells elsewhere, such as under wp-content/cache/.","Repeated PoC shell invocations can create multiple different wp2shell_\u003chex\u003e plugin directories on the same host because each invocation generates a fresh random plugin name.","If immediate patching is not possible, the article recommends temporarily blocking anonymous access to /wp-json/batch/v1 and /?rest_route=/batch/v1, while warning this may break legitimate batch consumers."],"referencedReports":[{"title":"wp2shell: Pre-Authentication RCE in WordPress Core","url":"https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core","publisher":"Searchlight Cyber","context":"The article cites Searchlight Cyber’s disclosure as the source of the wp2shell pre-authentication remote code execution chain and directs readers there for the full technical breakdown.","category":"advisory","primary":true},{"title":"Exploit Brokers Pay $500,000 for a WordPress RCE. I Found One with GPT-5.6","url":"https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/","publisher":"Searchlight Cyber","context":"The article references this Searchlight Cyber methodology write-up as an explanation of how the wp2shell bug was found.","category":"research","primary":true},{"title":"WordPress Exploitation Underway CVE-2026-63030","url":"https://isc.sans.edu/forums/diary/WordPress+Exploitation+Underway+CVE202663030/33168/","publisher":"SANS ISC","context":"The article cites the SANS ISC diary for an in-the-wild SQL injection payload and an example of webshell placement outside the plugin directory.","category":"research","primary":false}],"body":"\u003cp\u003eSearchlight Cyber disclosed wp2shell on July 17, 2026, describing it as a pre-authentication remote code execution chain in WordPress Core tracked as CVE-2026-63030 and CVE-2026-60137. Public proof-of-concept tools appeared on GitHub within hours, and scanning followed immediately. The article says Elastic has observed the same host footprint in customer telemetry, including PHP and web server runtimes spawning shells, new plugin directories under wp-content/plugins/, and access-log markers from stock tooling.\u003c/p\u003e\n\n\u003cp\u003eThe affected WordPress versions for the full pre-authentication RCE chain are 6.9.0 to 6.9.4 and 7.0.0 to 7.0.1, with fixes in 6.9.5 and 7.0.2. The article explains that wp2shell abuses WordPress Core’s REST batch endpoint through route confusion, with public chains nesting batches to bypass method restrictions and reach a pre-authentication SQL injection primitive. Tooling can then escalate to administrator access and upload a plugin-backed webshell, or in other observed activity write a webshell directly to disk through SQL INTO OUTFILE.\u003c/p\u003e\n\n\u003cp\u003eElastic ran the public Icex0 PoC in a lab and mapped the resulting activity to Elastic Defend and SIEM detections. The lab showed apache2 staging plugin files, creating wp2shell\u003cem\u003e\u003chex\u003e plugin directories, spawning dash from the plugin working directory, and running commands such as id, whoami, hostname, cleanup commands, uname, cat /etc/passwd, and SUID file enumeration. The article recommends patching first, hunting fresh indicators such as batch endpoint requests and wp2shell\u003c/em\u003e\u003chex\u003e paths, and relying on behavioral detection because attackers can rename plugins, rewrite payloads, or place webshells outside the plugin directory.\u003c/p\u003e\n"},{"n":16,"title":"Check Point Patches Exploited SmartConsole Flaw Allowing Full Admin Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/check-point-patches-exploited.html","time":"06:34","priority":"MUST READ","score":95,"tldr":"Check Point released urgent fixes for actively exploited SmartConsole and management server flaws, including a critical authentication bypass that can give remote attackers full administrative access when management interfaces are exposed to the internet without Trusted Client restrictions. Customers should apply the July 22 Jumbo hotfix and restrict management access to trusted IPs immediately.","briefOverview":"\u003cp\u003eCheck Point released security updates for multiple vulnerabilities affecting its Security Management and Multi-Domain Management products. The most severe issue, CVE-2026-16232, is a critical SmartConsole authentication bypass with a CVSS score of 9.3 that has been actively exploited in the wild. Check Point said a small number of customers were targeted and that it has already notified them.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-16232 affects the Check Point SmartConsole login process and can allow an unauthenticated remote attacker to obtain an application login token and authenticate with full administrative privileges. Successful exploitation could let an attacker modify security policies and security configurations. Check Point said the issue affects a specific configuration in which Management is exposed directly to the internet without IP restrictions.\u003c/p\u003e\n\n\u003cp\u003eThe company also patched CVE-2026-62144, an authentication bypass that can allow unauthenticated remote administrative command execution, and CVE-2026-62145, a Gaia Portal privilege management flaw that can allow a read-only user to execute commands with root privileges. Customers are advised to apply the July 22 Jumbo hotfix, limit Trusted Clients to trusted IP addresses or subnets, secure Management access with Firewall, and restrict access to trusted IP addresses. CISA added the exploited flaw to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 25, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point released security updates for vulnerabilities affecting Security Management and Multi-Domain Management products, including a critical flaw that is being actively exploited.","CVE-2026-16232 is an authentication bypass in the Check Point SmartConsole login process that can allow an unauthenticated remote attacker to obtain an application login token and authenticate with full administrative privileges.","Check Point said the exploited flaw affects a very specific configuration where Management is exposed directly to the internet without IP restrictions.","The updates also address CVE-2026-62144, which can allow unauthenticated remote attackers to execute administrative commands, and CVE-2026-62145, which can allow a read-only Gaia Portal user to execute commands with root privileges.","CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 25, 2026."],"insights":["The highest-risk exposure is not just running an affected version, but having the Management Server reachable from the internet without Trusted Clients limited to specific IP addresses or subnets.","CVE-2026-16232 can turn access to the SmartConsole login process into full administrative control, making management-plane exposure a direct path to changing security policies and configurations.","Check Point published specific malicious IP addresses tied to the activity, giving customers concrete indicators to check while applying the July 22 Jumbo hotfix.","CISA’s July 25, 2026 remediation deadline for federal civilian agencies shows the active exploitation is considered urgent enough to require fixes within days."],"referencedReports":[{"title":"Security Advisory: Action Required – Active Exploitation of Check Point SmartConsole Authentication Bypass (CVE-2026-16232)","url":"https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-check-point-smartconsole-authentication-bypass-cve-2026-16232/","publisher":"Check Point","context":"The article cites Check Point's security advisory as the source for the released updates addressing actively exploited vulnerabilities.","category":"advisory","primary":true},{"title":"CVE-2026-16232","url":"https://support.checkpoint.com/results/sk/sk185169/","publisher":"Check Point","context":"The article links to Check Point's advisory page for the critical SmartConsole authentication bypass vulnerability.","category":"advisory","primary":true},{"title":"CVE-2026-62144","url":"https://support.checkpoint.com/results/sk/sk185152/","publisher":"Check Point","context":"The article links to Check Point's advisory page for the authentication bypass flaw in Security Management and Multi-Domain Security Management.","category":"advisory","primary":true},{"title":"CVE-2026-62145","url":"https://support.checkpoint.com/results/sk/sk185153/","publisher":"Check Point","context":"The article links to Check Point's advisory page for the Gaia Portal improper privilege management vulnerability.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/22/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA's alert adding the Check Point flaw to its Known Exploited Vulnerabilities catalog and setting a remediation deadline for federal agencies.","category":"advisory","primary":false}],"body":"\u003cp\u003eCheck Point released security updates for multiple vulnerabilities affecting its Security Management and Multi-Domain Management products. The most severe issue, CVE-2026-16232, is a critical SmartConsole authentication bypass with a CVSS score of 9.3 that has been actively exploited in the wild. Check Point said a small number of customers were targeted and that it has already notified them.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-16232 affects the Check Point SmartConsole login process and can allow an unauthenticated remote attacker to obtain an application login token and authenticate with full administrative privileges. Successful exploitation could let an attacker modify security policies and security configurations. Check Point said the issue affects a specific configuration in which Management is exposed directly to the internet without IP restrictions.\u003c/p\u003e\n\n\u003cp\u003eThe company also patched CVE-2026-62144, an authentication bypass that can allow unauthenticated remote administrative command execution, and CVE-2026-62145, a Gaia Portal privilege management flaw that can allow a read-only user to execute commands with root privileges. Customers are advised to apply the July 22 Jumbo hotfix, limit Trusted Clients to trusted IP addresses or subnets, secure Management access with Firewall, and restrict access to trusted IP addresses. CISA added the exploited flaw to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 25, 2026.\u003c/p\u003e\n"},{"n":2,"title":"Russian hackers exploit Zimbra zero-click flaw for email theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/russian-hackers-exploit-zimbra-zero-click-flaw-for-email-theft/","time":"16:49","priority":"MUST READ","score":94,"tldr":"CISA warns that Russian state-backed Laundry Bear hackers are exploiting a patched Zimbra zero-click XSS flaw and phishing kits to steal emails, credentials, 2FA tokens, and application passcodes. Organizations using Zimbra should patch immediately, check CISA’s indicators, and revoke suspicious app passcodes.","briefOverview":"\u003cp\u003eCISA is warning that the Russian state-sponsored hacking group Laundry Bear, also known as Void Blizzard, is targeting organizations that use Zimbra Collaboration email servers. The group combines phishing attacks with exploitation of CVE-2025-66376, a now-patched cross-site scripting flaw in Zimbra Collaboration Suite’s Classic UI. CISA says the group has targeted and compromised users in sectors including the Defense Industrial Base, government, education, energy, law enforcement, media, non-governmental organizations, and technology.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows JavaScript embedded in specially crafted HTML emails to run automatically when a victim views the message, enabling account data theft without requiring a click or a visit to a phishing site. CISA says Laundry Bear exploited the flaw as a zero-day before Zimbra patched it in November 2025 and continues to target organizations running unpatched servers. The exploit is used to collect and send the victim’s last 90 days of emails, email address, password, Global Address List, and two-factor authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eThe attackers also create a new Zimbra application passcode that can be used by legacy email clients such as IMAP or ActiveSync, allowing continued access while bypassing MFA. CISA says stolen information is exfiltrated over DNS and HTTPS to an actor-controlled server running the group’s Flowerbed collection framework. The advisory recommends updating Zimbra, reviewing indicators of compromise, investigating connections to identified domains and IP addresses, monitoring suspicious authentication activity, revoking unauthorized application passcodes, and reviewing accounts for unauthorized mailbox access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that the Russian state-sponsored hacking group Laundry Bear, also known as Void Blizzard, is targeting organizations using Zimbra Collaboration email servers through phishing attacks and exploitation of CVE-2025-66376.","CVE-2025-66376 is a cross-site scripting flaw in Zimbra Collaboration Suite's Classic UI that allows JavaScript in specially crafted HTML emails to execute automatically when a victim views the message.","CISA said Laundry Bear used the flaw to automatically collect and send victims' last 90 days of emails, email address, password, Global Address List, and two-factor authentication tokens.","The attackers also create a new Zimbra application passcode to retain access to email accounts while bypassing MFA through legacy clients such as IMAP or ActiveSync.","CISA advised Zimbra-using organizations to update to the latest version, review indicators of compromise, investigate connections to identified domains and IP addresses, monitor suspicious authentication activity, revoke unauthorized application passcodes, and review accounts for unauthorized mailbox access."],"insights":["The Zimbra flaw is especially dangerous because the malicious JavaScript can run when the victim only views a crafted email, so the attack does not depend on the victim clicking a link or visiting a fake website.","Laundry Bear’s creation of Zimbra application passcodes is a practical persistence method because those passcodes work with legacy clients such as IMAP or ActiveSync and can bypass normal MFA flows.","CISA’s recommendation to revoke unauthorized application passcodes, especially those named “ZimbraWeb,” gives defenders a specific account-level artifact to check beyond simply patching servers.","The campaign combines zero-day exploitation with adversary-in-the-middle phishing kits, showing that patching alone may not remove risk if attackers already stole credentials or session cookies.","The attackers use DNS A-record queries for smaller stolen data and HTTPS compressed archives for larger mailbox data, giving defenders two distinct exfiltration patterns to investigate."],"referencedReports":[{"title":"New Russia-affiliated actor Void Blizzard targets critical sectors for espionage","url":"https://www.microsoft.com/en-us/security/blog/2025/05/27/new-russia-affiliated-actor-void-blizzard-targets-critical-sectors-for-espionage/","publisher":"Microsoft","context":"The article cites Microsoft’s documentation of Void Blizzard compromises of organizations supporting Ukraine, including defense, transportation, and aviation entities.","category":"research","primary":false}],"body":"\u003cp\u003eCISA is warning that the Russian state-sponsored hacking group Laundry Bear, also known as Void Blizzard, is targeting organizations that use Zimbra Collaboration email servers. The group combines phishing attacks with exploitation of CVE-2025-66376, a now-patched cross-site scripting flaw in Zimbra Collaboration Suite’s Classic UI. CISA says the group has targeted and compromised users in sectors including the Defense Industrial Base, government, education, energy, law enforcement, media, non-governmental organizations, and technology.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows JavaScript embedded in specially crafted HTML emails to run automatically when a victim views the message, enabling account data theft without requiring a click or a visit to a phishing site. CISA says Laundry Bear exploited the flaw as a zero-day before Zimbra patched it in November 2025 and continues to target organizations running unpatched servers. The exploit is used to collect and send the victim’s last 90 days of emails, email address, password, Global Address List, and two-factor authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eThe attackers also create a new Zimbra application passcode that can be used by legacy email clients such as IMAP or ActiveSync, allowing continued access while bypassing MFA. CISA says stolen information is exfiltrated over DNS and HTTPS to an actor-controlled server running the group’s Flowerbed collection framework. The advisory recommends updating Zimbra, reviewing indicators of compromise, investigating connections to identified domains and IP addresses, monitoring suspicious authentication activity, revoking unauthorized application passcodes, and reviewing accounts for unauthorized mailbox access.\u003c/p\u003e\n"},{"n":6,"title":"Check Point warns of SmartConsole zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-patches-smartconsole-zero-day-exploited-in-attacks/","time":"08:13","priority":"MUST READ","score":94,"tldr":"Check Point patched an actively exploited SmartConsole zero-day, CVE-2026-16232, that lets unauthenticated attackers obtain admin tokens and alter security policies on exposed management servers. CISA added it to its known exploited vulnerabilities catalog and urged rapid patching or mitigation by restricting trusted clients and management access.","briefOverview":"\u003cp\u003eCheck Point Software addressed an actively exploited zero-day flaw in the company’s SmartConsole graphical user interface admin panel. The vulnerability, tracked as CVE-2026-16232, is an authentication bypass issue that allows unauthenticated attackers to obtain an application login token. That token can be used to authenticate with administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to a vulnerable Security Management Server or Multi-Domain Security Management Server, attackers can change the security configuration and security policy. Check Point said successful remote exploitation requires Internet access to the Management Server IP address and a configuration that does not restrict Trusted Clients. The company said it is aware the vulnerability is being exploited and has affected a very small number of customers.\u003c/p\u003e\n\n\u003cp\u003eAdministrators who cannot immediately upgrade are advised to follow Check Point’s hardening guidance, limit Trusted Clients to trusted IP addresses or subnets, and block management access for non-authorized IP addresses. Check Point also provided a SmartConsole audit log query and instructed admins to search for “Authentication method: application token” to check for signs of compromise. CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to patch vulnerable SmartConsole instances by Saturday, July 25.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point addressed an actively exploited zero-day vulnerability in its SmartConsole graphical user interface admin panel.","The vulnerability, tracked as CVE-2026-16232, allows unauthenticated attackers to obtain an application login token that can be used to authenticate with administrator privileges.","Successful exploitation can allow attackers to change the security configuration and security policy on a vulnerable Security Management Server or Multi-Domain Security Management Server.","Check Point said remote exploitation requires Internet access to the Management Server IP address and a configuration that does not restrict Trusted Clients.","CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to patch vulnerable SmartConsole instances by Saturday, July 25."],"insights":["Exposure risk depends on configuration: Check Point said remote exploitation requires the Management Server IP to be reachable from the Internet and Trusted Clients not to be restricted.","Organizations that cannot immediately upgrade have specific mitigations available, including limiting Trusted Clients to trusted IP addresses or subnets and blocking management access from unauthorized IP addresses.","Check Point provided a concrete compromise check by searching SmartConsole audit logs for “Authentication method: application token” and querying for traffic involving listed IP addresses.","CISA’s deadline for U.S. federal agencies was unusually urgent in the article’s timeline, requiring patching by Saturday, July 25, after adding the flaw to the exploited vulnerabilities catalog on Wednesday.","The article places this issue in a broader pattern of recently exploited Check Point authentication bypass flaws, citing CVE-2026-50751 in June and CVE-2024-24919 two years earlier."],"referencedReports":[{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-16232","publisher":"CISA","context":"The article says CISA added CVE-2026-16232 to its catalog of known exploited vulnerabilities and ordered U.S. federal agencies to patch affected SmartConsole instances.","category":"advisory","primary":false},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/22/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article quotes CISA warning that this type of vulnerability is a frequent attack vector and poses significant risks to the federal enterprise.","category":"advisory","primary":false},{"title":"Meet NailaoLocker: A ransomware distributed in Europe by ShadowPad and PlugX backdoors","url":"https://www.orangecyberdefense.com/global/blog/cert-news/meet-nailaolocker-a-ransomware-distributed-in-europe-by-shadowpad-and-plugx-backdoors","publisher":"Orange Cyberdefense CERT","context":"The article references an Orange Cyberdefense CERT report that linked exploitation of CVE-2024-24919 to NailaoLocker ransomware attacks.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Software addressed an actively exploited zero-day flaw in the company’s SmartConsole graphical user interface admin panel. The vulnerability, tracked as CVE-2026-16232, is an authentication bypass issue that allows unauthenticated attackers to obtain an application login token. That token can be used to authenticate with administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to a vulnerable Security Management Server or Multi-Domain Security Management Server, attackers can change the security configuration and security policy. Check Point said successful remote exploitation requires Internet access to the Management Server IP address and a configuration that does not restrict Trusted Clients. The company said it is aware the vulnerability is being exploited and has affected a very small number of customers.\u003c/p\u003e\n\n\u003cp\u003eAdministrators who cannot immediately upgrade are advised to follow Check Point’s hardening guidance, limit Trusted Clients to trusted IP addresses or subnets, and block management access for non-authorized IP addresses. Check Point also provided a SmartConsole audit log query and instructed admins to search for “Authentication method: application token” to check for signs of compromise. CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to patch vulnerable SmartConsole instances by Saturday, July 25.\u003c/p\u003e\n"},{"n":15,"title":"International alert spotlights Russia-linked attacks on Zimbra webmail","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/zimbra-webmail-zero-click-phishing-russia-laundry-bear","time":"16:58","priority":"MUST READ","score":94,"tldr":"International agencies warn that Russian state-linked group Laundry Bear is using zero-click phishing emails to exploit a patched Zimbra webmail vulnerability and spy on government, defense, transportation and financial targets in Ukraine, the U.S. and NATO countries. Organizations using Zimbra should patch immediately or move users to another mail client if they cannot.","briefOverview":"\u003cp\u003eFederal agencies in the U.S., U.K., Europe, Australia and New Zealand warned that Russian state-aligned hackers have been compromising governmental and commercial organizations in the West through zero-click phishing emails. The campaign is attributed to the advanced persistent threat group Laundry Bear and targets Zimbra Collaboration Suite’s webmail platform. The activity exploits CVE-2025-66376, a vulnerability that was patched in November 2025.\u003c/p\u003e\n\n\u003cp\u003eThe advisory said the hackers extensively targeted Ukrainian entities before focusing on U.S. and NATO organizations. The agencies described this as evidence of a trend in which Russian cyber threat groups target Ukrainian users first as both a priority and a testing ground before broader global deployment. They concluded that the covert, persistent activity and the absence of known financial extortion almost certainly indicate espionage with Russian government backing.\u003c/p\u003e\n\n\u003cp\u003eSince at least July 2025, Laundry Bear has used a malicious JavaScript payload hidden in emails sent from previously compromised email accounts, with the payload executing when the emails are opened. The hackers have attempted to steal the last 90 days of emails from compromised accounts, along with passwords, contact lists, two-factor authentication tokens and other passcodes. Government agencies urged organizations using Zimbra webmail to patch immediately or, if patching is not feasible, direct employees to use a different mail client.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Federal agencies in the U.S., U.K., Europe, Australia and New Zealand warned that Russian state-aligned hackers are compromising Western governmental and commercial organizations through zero-click phishing emails.","The campaign is attributed to Laundry Bear and targets Zimbra Collaboration Suite’s webmail platform by exploiting CVE-2025-66376, a vulnerability patched in November 2025.","The advisory said Laundry Bear extensively targeted Ukrainian entities before shifting to U.S. and NATO organizations, reflecting a trend of Russian cyber groups using Ukrainian users as an initial target and testing ground.","The hackers have attempted to steal the last 90 days of emails from compromised accounts, along with passwords, contact lists, two-factor authentication tokens and other passcodes.","Government agencies urged organizations using Zimbra webmail to patch immediately or direct employees to use a different mail client if patching is not feasible."],"insights":["The campaign shows a shift in Laundry Bear’s methods from previously “unsophisticated” password spraying and click-based phishing to emails that execute a hidden JavaScript payload as soon as they are opened.","The advisory highlights Ukraine as both a priority target and a testing ground for Russian cyber techniques before broader use against U.S. and NATO organizations.","The absence of known financial extortion was cited by agencies as evidence that the activity is almost certainly espionage backed by the Russian government.","The use of previously compromised email accounts to send malicious messages makes the campaign more covert and persistent than ordinary phishing from unfamiliar senders.","If patching Zimbra is not immediately possible, the agencies recommend the practical fallback of directing employees to use a different mail client."],"referencedReports":[{"title":"Cybersecurity Advisory AA26-204A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a","publisher":"CISA","context":"The article cites this advisory for the international warning that Laundry Bear targeted Ukrainian entities before U.S. and NATO organizations and for details on attempted data theft and mitigation guidance.","category":"advisory","primary":true},{"title":"Russian Webmail Espionage","url":"https://unit42.paloaltonetworks.com/russian-webmail-espionage/","publisher":"Palo Alto Networks Unit 42","context":"The article says Unit 42 published a report on the campaign and cites it for affected sectors and regions.","category":"research","primary":true},{"title":"TA488 Targets Zimbra Mail Servers With Half-Click Exploits","url":"https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits","publisher":"Proofpoint","context":"The article cites Proofpoint’s advisory for details that government, high science, and defense industrial base targets in the United States were compromised.","category":"advisory","primary":true},{"title":"Operation GhostMail: Zimbra XSS Russian APT Ukraine","url":"https://www.seqrite.com/blog/operation-ghostmail-zimbra-xss-russian-apt-ukraine/","publisher":"Seqrite","context":"The article references Seqrite’s March 2026 description of a zero-click phishing campaign exploiting Zimbra webmail and its medium-confidence attribution to Fancy Bear.","category":"research","primary":false}],"body":"\u003cp\u003eFederal agencies in the U.S., U.K., Europe, Australia and New Zealand warned that Russian state-aligned hackers have been compromising governmental and commercial organizations in the West through zero-click phishing emails. The campaign is attributed to the advanced persistent threat group Laundry Bear and targets Zimbra Collaboration Suite’s webmail platform. The activity exploits CVE-2025-66376, a vulnerability that was patched in November 2025.\u003c/p\u003e\n\n\u003cp\u003eThe advisory said the hackers extensively targeted Ukrainian entities before focusing on U.S. and NATO organizations. The agencies described this as evidence of a trend in which Russian cyber threat groups target Ukrainian users first as both a priority and a testing ground before broader global deployment. They concluded that the covert, persistent activity and the absence of known financial extortion almost certainly indicate espionage with Russian government backing.\u003c/p\u003e\n\n\u003cp\u003eSince at least July 2025, Laundry Bear has used a malicious JavaScript payload hidden in emails sent from previously compromised email accounts, with the payload executing when the emails are opened. The hackers have attempted to steal the last 90 days of emails from compromised accounts, along with passwords, contact lists, two-factor authentication tokens and other passcodes. Government agencies urged organizations using Zimbra webmail to patch immediately or, if patching is not feasible, direct employees to use a different mail client.\u003c/p\u003e\n"},{"n":25,"title":"Russian Espionage Group Exploited Zimbra Zero-Day to Steal Mail and 2FA Codes","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/russian-espionage-group-exploited.html","time":"18:36","priority":"MUST READ","score":94,"tldr":"Russian state-backed hackers exploited a Zimbra zero-day that ran when users viewed a malicious email, stealing recent mail, passwords, 2FA recovery codes and creating persistent app-specific access. Organizations must patch Zimbra and also audit accounts for stolen credentials, app passwords, IMAP changes and related signs of compromise.","briefOverview":"\u003cp\u003eA Russian state-supported espionage group exploited a then-unknown flaw in Zimbra’s webmail client to read Western mailboxes for months. NSA, CISA, partner agencies, Palo Alto Networks’ Unit 42, and Proofpoint reported on the campaign, which targeted Western government and commercial organizations through Zimbra since at least July 2025. The flaw, CVE-2025-66376, affects Zimbra Collaboration 10.0 before 10.0.18 and 10.1 before 10.1.13, and Zimbra fixed it on November 6, 2025.\u003c/p\u003e\n\n\u003cp\u003eThe exploit worked when a malicious email was viewed in a vulnerable Zimbra Classic UI session, allowing JavaScript to run inside the authenticated mailbox. Proofpoint tracks the payload as ZimReaper and said it stole the CSRF token, browser autofilled password, 2FA scratch codes, Zimbra version details, the Global Address List, and 90 days of the victim’s mail. The article says the payload could also create an app-specific password named ZimbraWeb, potentially granting IMAP, POP3, or SMTP access without two-factor authentication.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that patching stops new crafted emails from running, but it does not revoke credentials or access already obtained by the attackers. Defenders are advised to upgrade affected Zimbra deployments, treat mailboxes that opened or previewed matching messages as potentially compromised, reset passwords, invalidate sessions, regenerate 2FA scratch codes, and review for app-specific passwords, unnecessary IMAP enablement, scratch code requests, and DNS lookups to published command-and-control domains. Proofpoint reported no TA488 activity since February 2026, while Unit 42 and the advisory warned that targeting of unpatched Zimbra systems or Western email systems may continue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Russian state-supported espionage group exploited CVE-2025-66376, a stored cross-site scripting flaw in Zimbra’s Classic UI, to run JavaScript when a malicious email rendered in a vulnerable authenticated webmail session.","The payload, tracked by Proofpoint as ZimReaper, stole recent email, the organization’s email directory, the browser’s saved password, 2FA scratch codes, Zimbra version details, and exfiltrated data over DNS queries to actor infrastructure.","The vulnerability affects Zimbra Collaboration 10.0 before 10.0.18 and 10.1 before 10.1.13, and Zimbra fixed it on November 6, 2025.","Proofpoint said the actor, tracked as TA488, exploited the bug as an unknown vulnerability for at least five months in 2025 and used adversary-controlled Proton Mail accounts and previously compromised addresses to send exploit emails.","The article says patching stops new crafted emails from running, but organizations must also review accounts for app-specific passwords named ZimbraWeb, unnecessary IMAP enablement, 2FA scratch code requests, and DNS lookups to published command-and-control domains."],"insights":["Patching Zimbra is not sufficient remediation because the payload could already have stolen credentials, created app-specific passwords, and obtained 2FA recovery codes that remain useful after the software flaw is fixed.","App-specific passwords named ZimbraWeb are especially important to hunt for because the article says they can allow IMAP, POP3, or SMTP access without two-factor authentication and may survive password resets.","The exploit’s impact depended on message rendering in the vulnerable Classic UI, so any mailbox that opened or previewed a matching message in that client should be treated as potentially compromised.","Threat actor naming is unresolved across sources, but the article notes that Proofpoint and Unit 42 reported the same nine domains, making the shared infrastructure more relevant for defenders than the exact actor label.","The article highlights low-volume signals that may be valuable for detection, such as SOAP calls to GetScratchCodesRequest, which Proofpoint and Seqrite say should be close to absent in normal use."],"referencedReports":[{"title":"Russian State-Sponsored Cyber Actors Exploit Zimbra Collaboration Suite Vulnerability","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a","publisher":"CISA","context":"The article says CISA, NSA, and partner agencies published this joint advisory on the Zimbra exploitation campaign.","category":"advisory","primary":true},{"title":"Russian Webmail Espionage","url":"https://unit42.paloaltonetworks.com/russian-webmail-espionage/","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42 research on the activity it tracks as CL-STA-1114, including targeting, infrastructure, and ongoing activity details.","category":"research","primary":true},{"title":"TA488 Targets Zimbra Mailservers with Half-Click Exploits","url":"https://www.proofpoint.com/us/blog/threat-insight/ta488-targets-zimbra-mailservers-half-click-exploits","publisher":"Proofpoint","context":"The article cites Proofpoint research on TA488, the ZimReaper payload, exploit delivery, and remediation guidance.","category":"research","primary":true},{"title":"Operation GhostMail: Zimbra XSS Russian APT Ukraine","url":"https://www.seqrite.com/blog/operation-ghostmail-zimbra-xss-russian-apt-ukraine/","publisher":"Seqrite","context":"The article references Seqrite’s analysis of a January case at a Ukrainian state hydrology agency and its related remediation guidance.","category":"research","primary":false},{"title":"Public Report on New Cyber Actor","url":"https://www.aivd.nl/site/binaries/site-content/collections/documents/2025/05/27/aivd-en-mivd-onderkennen-nieuwe-russische-cyberactor/Advisory%2BAIVD%2Ben%2BMIVD%2BPublic%2Breport%2Bon%2Bnew%2Bcyber%2Bactor.pdf","publisher":"Dutch intelligence","context":"The article cites this Dutch intelligence report for attribution context around LAUNDRY BEAR and APT28.","category":"advisory","primary":false}],"body":"\u003cp\u003eA Russian state-supported espionage group exploited a then-unknown flaw in Zimbra’s webmail client to read Western mailboxes for months. NSA, CISA, partner agencies, Palo Alto Networks’ Unit 42, and Proofpoint reported on the campaign, which targeted Western government and commercial organizations through Zimbra since at least July 2025. The flaw, CVE-2025-66376, affects Zimbra Collaboration 10.0 before 10.0.18 and 10.1 before 10.1.13, and Zimbra fixed it on November 6, 2025.\u003c/p\u003e\n\n\u003cp\u003eThe exploit worked when a malicious email was viewed in a vulnerable Zimbra Classic UI session, allowing JavaScript to run inside the authenticated mailbox. Proofpoint tracks the payload as ZimReaper and said it stole the CSRF token, browser autofilled password, 2FA scratch codes, Zimbra version details, the Global Address List, and 90 days of the victim’s mail. The article says the payload could also create an app-specific password named ZimbraWeb, potentially granting IMAP, POP3, or SMTP access without two-factor authentication.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that patching stops new crafted emails from running, but it does not revoke credentials or access already obtained by the attackers. Defenders are advised to upgrade affected Zimbra deployments, treat mailboxes that opened or previewed matching messages as potentially compromised, reset passwords, invalidate sessions, regenerate 2FA scratch codes, and review for app-specific passwords, unnecessary IMAP enablement, scratch code requests, and DNS lookups to published command-and-control domains. Proofpoint reported no TA488 activity since February 2026, while Unit 42 and the advisory warned that targeting of unpatched Zimbra systems or Western email systems may continue.\u003c/p\u003e\n"},{"n":1,"title":"New RefluXFS Linux flaw lets attackers gain root privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/linux/new-refluxfs-linux-flaw-lets-attackers-gain-root-privileges/","time":"11:40","priority":"MUST READ","score":92,"tldr":"A nine-year-old Linux kernel XFS flaw called RefluXFS lets local attackers reliably overwrite protected files and gain root privileges on many enterprise Linux systems. Qualys says there are no practical mitigations, so affected organizations should install vendor-fixed kernels and reboot as soon as possible.","briefOverview":"\u003cp\u003eQualys Threat Research Unit disclosed a nine-year-old Linux kernel flaw in the XFS filesystem, tracked as CVE-2026-64600 and dubbed RefluXFS. The race condition allows local attackers to overwrite protected files and gain root privileges. Qualys says it affects systems using XFS with reflink enabled, Linux kernel v4.11 or later, a directory writable by an unprivileged local user, and a high-value root-owned target such as a configuration file or SUID-root binary.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is significant because standard defenses do not block RefluXFS attacks, including SELinux, kernel lockdown, container isolation mechanisms, KASLR, SMEP, and SMAP. Qualys says exploitation is highly reliable, leaves no kernel log output, and survives a reboot. The issue affects major Linux distributions including Red Hat Enterprise Linux, Oracle Linux, Amazon Linux, Fedora, CentOS Stream, Rocky Linux, AlmaLinux, and CloudLinux, and Qualys estimates that more than 16.4 million systems may be affected.\u003c/p\u003e\n\n\u003cp\u003eQualys explains that an attacker can reflink-clone a target file into a scratch file they own and race concurrent O_DIRECT writes so that one write lands in the physical block still backing the original file. The flaw was introduced in February 2017 by Linux kernel commit 3c68d44a2b49 and was patched on July 16 after commit 2f4acd0 was merged into the Linux kernel source tree. Qualys recommends immediate kernel patching and rebooting, especially for exposed and multi-tenant systems, and says there are no reliable or practical temporary mitigations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-64600, dubbed RefluXFS by Qualys, is a nine-year-old race condition in the Linux kernel's XFS filesystem that allows local attackers to overwrite protected files and gain root privileges.","The flaw affects systems using XFS with reflink enabled, Linux kernel version 4.11 or later, a directory writable by an unprivileged local user, and a high-value root-owned target file or SUID-root binary.","Qualys says exploitation is highly reliable, produces no kernel log output, persists across reboot, and is not blocked by defenses such as SELinux, kernel lockdown, container isolation, KASLR, SMEP, or SMAP.","The vulnerability has existed since February 2017 and was patched in the Linux kernel source tree on July 16 after commit 2f4acd0 was merged.","Qualys says vendor-fixed kernels are available and recommends immediate patching and rebooting, especially for exposed and multi-tenant systems, because there are no reliable or practical temporary mitigations."],"insights":["Standard hardening measures are not effective against RefluXFS because the flaw operates at the filesystem allocation layer, below where protections such as SELinux, kernel lockdown, container isolation, KASLR, SMEP, and SMAP apply.","The exploit can modify a root-owned file without touching the file's inode, which means a changed SUID-root binary can keep its SUID bit after being altered.","Qualys says there are no reliable or practical temporary configuration changes, making kernel patching and rebooting the only recommended response.","The vulnerability was identified through a Qualys research initiative with Anthropic in which Claude Mythos Preview was used to hunt for a Dirty COW-like race condition before researchers reproduced and verified the exploit."],"referencedReports":[{"title":"RefluXFS","url":"https://cdn2.qualys.com/advisory/2026/07/22/RefluXFS.txt","publisher":"Qualys Threat Research Unit","context":"The article cites this as Qualys TRU's detailed technical write-up explaining how attackers can exploit the RefluXFS flaw.","category":"research","primary":true}],"body":"\u003cp\u003eQualys Threat Research Unit disclosed a nine-year-old Linux kernel flaw in the XFS filesystem, tracked as CVE-2026-64600 and dubbed RefluXFS. The race condition allows local attackers to overwrite protected files and gain root privileges. Qualys says it affects systems using XFS with reflink enabled, Linux kernel v4.11 or later, a directory writable by an unprivileged local user, and a high-value root-owned target such as a configuration file or SUID-root binary.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is significant because standard defenses do not block RefluXFS attacks, including SELinux, kernel lockdown, container isolation mechanisms, KASLR, SMEP, and SMAP. Qualys says exploitation is highly reliable, leaves no kernel log output, and survives a reboot. The issue affects major Linux distributions including Red Hat Enterprise Linux, Oracle Linux, Amazon Linux, Fedora, CentOS Stream, Rocky Linux, AlmaLinux, and CloudLinux, and Qualys estimates that more than 16.4 million systems may be affected.\u003c/p\u003e\n\n\u003cp\u003eQualys explains that an attacker can reflink-clone a target file into a scratch file they own and race concurrent O_DIRECT writes so that one write lands in the physical block still backing the original file. The flaw was introduced in February 2017 by Linux kernel commit 3c68d44a2b49 and was patched on July 16 after commit 2f4acd0 was merged into the Linux kernel source tree. Qualys recommends immediate kernel patching and rebooting, especially for exposed and multi-tenant systems, and says there are no reliable or practical temporary mitigations.\u003c/p\u003e\n"},{"n":19,"title":"Nine-Year-Old RefluXFS Linux Flaw Gives Local Users Root on Default RHEL Installs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/nine-year-old-refluxfs-linux-flaw-gives.html","time":"08:04","priority":"MUST READ","score":92,"tldr":"A nine-year-old Linux kernel flaw in XFS reflink handling, CVE-2026-64600 “RefluXFS,” can let local unprivileged users overwrite root-owned files and gain persistent root on affected default RHEL-family, Fedora Server, and Amazon Linux installs. Administrators should install the fixed kernel and reboot, as there is no practical mitigation once an XFS filesystem was created with reflink enabled.","briefOverview":"\u003cp\u003eRefluXFS, tracked as \u003ccode\u003eCVE-2026-64600\u003c/code\u003e, is a Linux kernel flaw disclosed on July 22 that lets an unprivileged local user overwrite root-owned files on an XFS filesystem and gain persistent root access. Qualys said default installations of Red Hat Enterprise Linux and its derivatives, Fedora Server, and Amazon Linux can meet the conditions for exploitation. The overwrite happens at the block layer, survives reboot, and leaves ownership, permissions, timestamps, and the setuid bit unchanged.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires Linux 4.11 or later without the fix, an XFS filesystem created with \u003ccode\u003ereflink=1\u003c/code\u003e, and a readable target plus an attacker-writable directory on the same XFS filesystem. The bug is a race in XFS reflink handling where the kernel uses a stale data-fork mapping after dropping and reacquiring a lock. Qualys demonstrated the race against \u003ccode\u003e/etc/passwd\u003c/code\u003e and setuid-root binaries, and said the race usually won in under ten seconds on its test machine.\u003c/p\u003e\n\n\u003cp\u003eThe fix was merged upstream on July 16, and vendors have begun shipping backported kernels, including Red Hat advisories across affected RHEL 8, 9, and 10 streams. Debian’s tracker listed fixes for some branches while other releases were still marked vulnerable as of July 23. Qualys said there is no practical mitigation or temporary configuration change, and the article says administrators must install the vendor kernel update, reboot, and verify the fixed kernel is running.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["RefluXFS, tracked as CVE-2026-64600, is a Linux kernel flaw disclosed on July 22 that lets an unprivileged local user overwrite root-owned files on an XFS filesystem and gain persistent root access.","Qualys said default installations of Red Hat Enterprise Linux and its derivatives, Fedora Server, and Amazon Linux can meet the conditions for exploitation when XFS was created with reflink enabled.","Exploitation requires Linux 4.11 or later without the RefluXFS fix, an XFS filesystem created with reflink=1, and a readable target plus an attacker-writable directory on the same XFS filesystem.","The upstream fix was merged on July 16, and vendors including Red Hat and Debian have begun shipping backported kernel updates for affected releases.","Qualys said there is no practical mitigation or temporary configuration change, so systems must install the vendor kernel update and reboot to run the fixed kernel."],"insights":["The overwrite happens at the block layer and bypasses the target file’s normal metadata path, so ownership, permissions, timestamps, and the setuid bit can remain unchanged even after a protected file is modified.","Qualys reported that SELinux in Enforcing mode, seccomp, kernel lockdown, and container boundaries did not stop exploitation in its testing, leaving patching and rebooting as the required response.","Red Hat errata for some affected streams began landing on July 14, before the public disclosure on July 22, so organizations may already be protected if they applied those kernel updates and rebooted.","The patch fixed two XFS helper functions with the same lock-cycle pattern, including one that the article says did not appear in the Qualys advisory.","Qualys said Anthropic’s restricted-access Claude Mythos Preview model found the race, wrote a working root exploit, and drafted the advisory before researchers reproduced and validated the issue."],"referencedReports":[{"title":"RefluXFS: A Linux Kernel Local Privilege Escalation to Root in XFS (CVE-2026-64600)","url":"https://blog.qualys.com/vulnerabilities-threat-research/2026/07/22/refluxfs-a-linux-kernel-local-privilege-escalation-to-root-in-xfs-cve-2026-64600","publisher":"Qualys","context":"The article cites Qualys’s vulnerability research as the source for affected default installations, exploitation conditions, and patching priority.","category":"research","primary":true},{"title":"RefluXFS Technical Advisory","url":"https://cdn2.qualys.com/advisory/2026/07/22/RefluXFS.txt","publisher":"Qualys","context":"The article references Qualys’s technical advisory for details on how the AI model was used and for exploitation steps.","category":"advisory","primary":true},{"title":"CVE-2026-64600","url":"https://access.redhat.com/security/cve/CVE-2026-64600","publisher":"Red Hat","context":"The article cites Red Hat’s security page while describing Important-rated kernel advisories for affected RHEL streams.","category":"advisory","primary":false},{"title":"CVE-2026-64600","url":"https://security-tracker.debian.org/tracker/CVE-2026-64600","publisher":"Debian","context":"The article cites Debian’s security tracker for the status of fixed and vulnerable kernel versions across Debian releases.","category":"advisory","primary":false}],"body":"\u003cp\u003eRefluXFS, tracked as \u003ccode\u003eCVE-2026-64600\u003c/code\u003e, is a Linux kernel flaw disclosed on July 22 that lets an unprivileged local user overwrite root-owned files on an XFS filesystem and gain persistent root access. Qualys said default installations of Red Hat Enterprise Linux and its derivatives, Fedora Server, and Amazon Linux can meet the conditions for exploitation. The overwrite happens at the block layer, survives reboot, and leaves ownership, permissions, timestamps, and the setuid bit unchanged.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires Linux 4.11 or later without the fix, an XFS filesystem created with \u003ccode\u003ereflink=1\u003c/code\u003e, and a readable target plus an attacker-writable directory on the same XFS filesystem. The bug is a race in XFS reflink handling where the kernel uses a stale data-fork mapping after dropping and reacquiring a lock. Qualys demonstrated the race against \u003ccode\u003e/etc/passwd\u003c/code\u003e and setuid-root binaries, and said the race usually won in under ten seconds on its test machine.\u003c/p\u003e\n\n\u003cp\u003eThe fix was merged upstream on July 16, and vendors have begun shipping backported kernels, including Red Hat advisories across affected RHEL 8, 9, and 10 streams. Debian’s tracker listed fixes for some branches while other releases were still marked vulnerable as of July 23. Qualys said there is no practical mitigation or temporary configuration change, and the article says administrators must install the vendor kernel update, reboot, and verify the fixed kernel is running.\u003c/p\u003e\n"},{"n":24,"title":"Attackers Weaponize GitHub Actions Runners to Target cPanel and WHM Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/attackers-weaponize-github-actions.html","time":"11:28","priority":"MUST READ","score":92,"tldr":"Attackers compromised GitHub repositories tied to Packagist PHP packages and abused GitHub Actions runners as distributed infrastructure to scan for and exploit vulnerable cPanel and WHM servers. The campaign targets CVE-2026-41940 to steal credentials, cloud keys, tokens, and other secrets, without relying on package users to install malicious code.","briefOverview":"\u003cp\u003eCybersecurity researchers reported a large-scale campaign that turned compromised GitHub repositories into distributed attack infrastructure targeting cPanel and WebHost Manager instances. The activity involved malicious Packagist development versions across 10 packages associated with the legitimate PHP and DevOps developer dinushchathurya between July 12 and 13, 2026. Socket said the PHP libraries were not the execution path, because attackers added dozens of malicious GitHub Actions workflows to the compromised maintainer’s source repositories.\u003c/p\u003e\n\n\u003cp\u003eThe malicious workflows launched GitHub-hosted runners after a repository push or manual run, downloaded Linux payloads from attacker-controlled infrastructure, and scanned for cPanel and WHM servers vulnerable to CVE-2026-41940. The payload attempted an authentication bypass and then harvested credentials, configuration files, environment variables, database access, SSH material, Git tokens, cloud keys, payment service credentials, and other secrets. Each affected development version contained 55 to 62 malicious GitHub Actions workflow files, totaling 583 files across all 10 package versions.\u003c/p\u003e\n\n\u003cp\u003eSocket said the workflows reported execution status to the threat actor and uploaded collected results through HTTP POST requests. The campaign did not rely on package users’ systems, but instead abused GitHub-hosted runners to power scanning and exploitation against vulnerable servers. The article also notes signs of a broader campaign, with roughly 6,100 workflow files on GitHub containing the unique DNSHook identifier “f5b0b742-240a-4811-8a5b-b0ba6060685d,” and describes the activity as an opportunistic server-side credential theft operation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers reported a large-scale campaign that turned compromised GitHub repositories into distributed attack infrastructure targeting cPanel and WebHost Manager instances.","Between July 12 and 13, 2026, malicious Packagist development versions appeared across 10 packages associated with the legitimate PHP and DevOps developer dinushchathurya after attackers pushed malicious GitHub Actions workflows to the developer’s repositories.","The malicious workflows launched GitHub-hosted runners, downloaded Linux payloads from attacker-controlled infrastructure, and scanned for cPanel and WHM servers vulnerable to CVE-2026-41940.","The payload attempted an authentication bypass and then harvested credentials, configuration files, environment variables, database access, SSH material, Git tokens, cloud keys, payment service credentials, and other secrets.","Socket said the campaign appears broader than one PHP maintainer, with roughly 6,100 GitHub workflow files containing the unique DNSHook identifier f5b0b742-240a-4811-8a5b-b0ba6060685d."],"insights":["The malicious PHP libraries were not the execution path; the attackers used GitHub Actions workflows inside compromised repositories to run the campaign instead of depending on package users to install the packages.","The campaign abused GitHub-hosted runners as disposable computing resources, allowing scanning and exploitation activity to run from GitHub infrastructure rather than from attacker-owned systems.","Each affected development version contained 55 to 62 malicious workflow files, showing that the attackers heavily duplicated automation inside each compromised repository rather than adding a single malicious file.","The workflows checked runner processor architecture before downloading payloads, indicating the attackers prepared compatible Linux payloads for multiple system types including x86 and ARM.","The presence of about 6,100 GitHub workflow files with the same DNSHook identifier suggests the activity extended far beyond the single compromised PHP maintainer described in detail."],"referencedReports":[{"title":"GitHub Actions Abuse Powers cPanel and WHM Exploitation","url":"https://socket.dev/blog/github-actions-abuse-powers-cpanel-and-whm-exploitation","publisher":"Socket","context":"The article cites Socket research as the basis for details about compromised GitHub repositories abusing GitHub Actions runners to target cPanel and WHM servers.","category":"research","primary":true},{"title":"Operation Muck and Load: Malicious Go Module Exposes GitHub Malware Lure Network","url":"https://socket.dev/blog/malicious-go-module-exposes-github-malware-lure-network","publisher":"Socket","context":"The article references a separate Socket analysis of Operation Muck and Load, a campaign abusing GitHub repositories to deliver Windows-based malware.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers reported a large-scale campaign that turned compromised GitHub repositories into distributed attack infrastructure targeting cPanel and WebHost Manager instances. The activity involved malicious Packagist development versions across 10 packages associated with the legitimate PHP and DevOps developer dinushchathurya between July 12 and 13, 2026. Socket said the PHP libraries were not the execution path, because attackers added dozens of malicious GitHub Actions workflows to the compromised maintainer’s source repositories.\u003c/p\u003e\n\n\u003cp\u003eThe malicious workflows launched GitHub-hosted runners after a repository push or manual run, downloaded Linux payloads from attacker-controlled infrastructure, and scanned for cPanel and WHM servers vulnerable to CVE-2026-41940. The payload attempted an authentication bypass and then harvested credentials, configuration files, environment variables, database access, SSH material, Git tokens, cloud keys, payment service credentials, and other secrets. Each affected development version contained 55 to 62 malicious GitHub Actions workflow files, totaling 583 files across all 10 package versions.\u003c/p\u003e\n\n\u003cp\u003eSocket said the workflows reported execution status to the threat actor and uploaded collected results through HTTP POST requests. The campaign did not rely on package users’ systems, but instead abused GitHub-hosted runners to power scanning and exploitation against vulnerable servers. The article also notes signs of a broader campaign, with roughly 6,100 workflow files on GitHub containing the unique DNSHook identifier “f5b0b742-240a-4811-8a5b-b0ba6060685d,” and describes the activity as an opportunistic server-side credential theft operation.\u003c/p\u003e\n"},{"n":31,"title":"Chaos ransomware's msaRAT: Living off the browser to build a covert C2 channel","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/chaos-msarat-living-off-the-browser-to-build-covert-c2-channel/","time":"10:00","priority":"MUST READ","score":92,"tldr":"Cisco Talos identified msaRAT, a new Rust-based RAT used by the Chaos ransomware group that hides C2 traffic by controlling a headless Chrome or Edge browser through Chrome DevTools Protocol. The malware uses Cloudflare Workers for WebRTC signaling and Twilio TURN relays for encrypted DataChannel communications, making traffic appear to originate from a legitimate browser rather than the RAT process itself.","briefOverview":"\u003cp\u003eCisco Talos discovered a new Rust-based remote access trojan called msaRAT, attributed to the Chaos ransomware group. Chaos is a ransomware-as-a-service group first confirmed in February 2025 that targets large organizations and uses double extortion tactics. Talos identified an infection chain in which an attacker downloads an MSI file named \u003ccode\u003eupdate_ms.msi\u003c/code\u003e from an attacker-controlled server to \u003ccode\u003eC:\\programdata\\update_ms.msi\u003c/code\u003e and executes it before ransomware deployment.\u003c/p\u003e\n\n\u003cp\u003eThe MSI file is configured to impersonate a Windows update and loads an embedded DLL, \u003ccode\u003elib.dll\u003c/code\u003e, directly into memory through a custom action. The DLL exposes a \u003ccode\u003eRUN\u003c/code\u003e function and initializes the Tokio asynchronous runtime so the RAT can handle multiple operations concurrently. msaRAT then searches for Chrome or Edge, launches the browser in headless mode with remote debugging enabled, and manipulates it through the Chrome DevTools Protocol.\u003c/p\u003e\n\n\u003cp\u003eThe RAT does not make external network connections directly; its own network communication is limited to \u003ccode\u003e127.0.0.1\u003c/code\u003e, while external traffic is generated by the browser. It uses Cloudflare Workers for WebRTC signaling, establishes a WebRTC DataChannel through Twilio TURN, and exchanges C2 commands over that channel after setup. The article states that this design hides the attacker’s infrastructure, makes traffic appear as legitimate browser activity, and adds double-layer encryption through WebRTC DTLS plus a ChaCha-Poly1305-based scheme derived from an ECDH key exchange.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos discovered a new Rust-based remote access trojan called msaRAT that is attributed to the Chaos ransomware group.","msaRAT is implemented using the Tokio asynchronous runtime and provides browser-leveraged remote code execution and covert tunneling for command-and-control communications.","The RAT does not make external network connections itself and instead controls Chrome or Edge through the Chrome DevTools Protocol to handle communications from a legitimate browser process.","msaRAT uses Cloudflare Workers for WebRTC signaling and establishes a WebRTC DataChannel through Twilio TURN as a relay to communicate with its command-and-control server.","The malware encrypts its data with a ChaCha-Poly1305-based scheme after an ECDH key exchange, in addition to the DTLS protection provided by WebRTC DataChannel communications."],"insights":["Network monitoring that attributes external traffic only by process may miss msaRAT because the RAT process communicates only with 127.0.0.1 while all external traffic is generated by the browser process.","The MSI download uses plain HTTP on port 443, which can bypass environments that allow traffic based only on port number without inspecting the protocol.","The attacker’s SDP Answer omits ICE candidates and sets the connection address to 0.0.0.0, forcing communications through Twilio TURN rather than allowing direct peer-to-peer connections.","The Cloudflare Workers endpoint is used only for WebRTC signaling and drops out after the DataChannel is established, so later command-and-control activity will not continue to appear as traffic to that endpoint.","The RAT registers distinctive Chrome DevTools Protocol bindings named msaOpen, msaClose, msaError, msaMessage, and dataAck before injecting JavaScript into the browser."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos discovered a new Rust-based remote access trojan called msaRAT, attributed to the Chaos ransomware group. Chaos is a ransomware-as-a-service group first confirmed in February 2025 that targets large organizations and uses double extortion tactics. Talos identified an infection chain in which an attacker downloads an MSI file named \u003ccode\u003eupdate_ms.msi\u003c/code\u003e from an attacker-controlled server to \u003ccode\u003eC:\\programdata\\update_ms.msi\u003c/code\u003e and executes it before ransomware deployment.\u003c/p\u003e\n\n\u003cp\u003eThe MSI file is configured to impersonate a Windows update and loads an embedded DLL, \u003ccode\u003elib.dll\u003c/code\u003e, directly into memory through a custom action. The DLL exposes a \u003ccode\u003eRUN\u003c/code\u003e function and initializes the Tokio asynchronous runtime so the RAT can handle multiple operations concurrently. msaRAT then searches for Chrome or Edge, launches the browser in headless mode with remote debugging enabled, and manipulates it through the Chrome DevTools Protocol.\u003c/p\u003e\n\n\u003cp\u003eThe RAT does not make external network connections directly; its own network communication is limited to \u003ccode\u003e127.0.0.1\u003c/code\u003e, while external traffic is generated by the browser. It uses Cloudflare Workers for WebRTC signaling, establishes a WebRTC DataChannel through Twilio TURN, and exchanges C2 commands over that channel after setup. The article states that this design hides the attacker’s infrastructure, makes traffic appear as legitimate browser activity, and adds double-layer encryption through WebRTC DTLS plus a ChaCha-Poly1305-based scheme derived from an ECDH key exchange.\u003c/p\u003e\n"},{"n":8,"title":"New msaRAT malware uses Chrome, Edge browsers to route C2 traffic","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-msarat-malware-uses-chrome-edge-browsers-to-route-c2-traffic/","time":"09:59","priority":"SHOULD READ","score":88,"tldr":"The Chaos ransomware gang is deploying a new Rust-based backdoor called msaRAT that hides its command-and-control traffic by routing it through headless Chrome or Edge sessions using the Chrome DevTools Protocol. Its use of Cloudflare Workers, WebRTC, and Twilio TURN relays makes attacker infrastructure harder to detect and trace.","briefOverview":"\u003cp\u003eThe Chaos ransomware gang is using a new Rust-based backdoor called msaRAT that hides command-and-control communication by routing it through Chrome or Microsoft Edge. The malware uses the Chrome DevTools Protocol to control a headless browser session and connect to the attacker’s server. Because communications are routed through the browser, the malware does not make a direct connection to the command-and-control infrastructure, lowering the risk of detection.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos observed recent Chaos ransomware attacks beginning with email or voice phishing and continuing with the installation of remote management software for persistence. The attacker then downloaded an MSI installer posing as a Windows update, which loads msaRAT directly in system memory. Once launched, msaRAT finds Chrome or Edge, starts the browser without a visible window, enables remote debugging, opens a new tab, and injects JavaScript to build the communication channel.\u003c/p\u003e\n\n\u003cp\u003eThe browser contacts a Cloudflare Workers endpoint to obtain WebRTC connection information and establish an encrypted channel. Cisco Talos said the malware uses two layers of encryption: browser-provided WebRTC DTLS and a ChaCha20-Poly1305 plus ECDH key implemented by msaRAT. Communication is relayed through Twilio TURN servers, and Cisco Talos said this design prevents the attacker’s real server IP address from appearing in network traffic while making the infrastructure harder to trace.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Chaos ransomware gang is using a new Rust-based backdoor called msaRAT that routes command-and-control communication through Chrome or Microsoft Edge browsers.","msaRAT uses the Chrome DevTools Protocol to control a headless browser session, open a new tab, inject JavaScript, and build its communication channel.","Cisco Talos observed recent Chaos ransomware attacks beginning with email or voice phishing, followed by installation of remote management software and an MSI installer posing as a Windows update.","The malware contacts a Cloudflare Workers endpoint to obtain WebRTC connection information and uses Twilio TURN servers so communications are relayed rather than made directly to the attacker’s server.","Cisco Talos reported that msaRAT uses both browser-provided WebRTC DTLS encryption and its own ChaCha20-Poly1305 plus ECDH encryption layer."],"insights":["msaRAT reduces detection opportunities because the malware itself does not make a direct connection to the attacker’s infrastructure; its communications are buried inside browser-driven web traffic.","The attackers intentionally omit standard WebRTC ICE candidates so connections cannot become direct peer-to-peer sessions and are always forced through Twilio TURN relays.","Blocking the free workers.dev domain is difficult as a defensive measure because the article notes it would disrupt legitimate Cloudflare Workers deployments and benign services.","The combination of Cloudflare Workers for signaling and Twilio TURN for relaying means the attacker’s real server IP address does not appear in network traffic, making infrastructure tracing significantly harder."],"referencedReports":[{"title":"Chaos msaRAT indicators of compromise","url":"http://github.com/Cisco-Talos/IOCs/blob/main/2026/07/chaos-msarat.txt","publisher":"Cisco Talos","context":"The article says Cisco Talos published indicators of compromise associated with attacks using the msaRAT backdoor.","category":"research","primary":true}],"body":"\u003cp\u003eThe Chaos ransomware gang is using a new Rust-based backdoor called msaRAT that hides command-and-control communication by routing it through Chrome or Microsoft Edge. The malware uses the Chrome DevTools Protocol to control a headless browser session and connect to the attacker’s server. Because communications are routed through the browser, the malware does not make a direct connection to the command-and-control infrastructure, lowering the risk of detection.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos observed recent Chaos ransomware attacks beginning with email or voice phishing and continuing with the installation of remote management software for persistence. The attacker then downloaded an MSI installer posing as a Windows update, which loads msaRAT directly in system memory. Once launched, msaRAT finds Chrome or Edge, starts the browser without a visible window, enables remote debugging, opens a new tab, and injects JavaScript to build the communication channel.\u003c/p\u003e\n\n\u003cp\u003eThe browser contacts a Cloudflare Workers endpoint to obtain WebRTC connection information and establish an encrypted channel. Cisco Talos said the malware uses two layers of encryption: browser-provided WebRTC DTLS and a ChaCha20-Poly1305 plus ECDH key implemented by msaRAT. Communication is relayed through Twilio TURN servers, and Cisco Talos said this design prevents the attacker’s real server IP address from appearing in network traffic while making the infrastructure harder to trace.\u003c/p\u003e\n"},{"n":4,"title":"Hackers abuse Notepad++ plugins to stealthily install malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-abuse-notepad-plus-plus-plugins-to-stealthily-install-malware/","time":"16:32","priority":"SHOULD READ","score":86,"tldr":"Ukraine’s CERT says the UAC-0099 threat cluster is distributing a fake PDF that installs a legitimate copy of Notepad++ with a malicious plugin to establish persistence and deploy additional malware. The campaign abuses normal plugin-loading behavior rather than a confirmed Notepad++ supply-chain compromise or exploited vulnerability.","briefOverview":"\u003cp\u003eUkraine\u0026rsquo;s CERT uncovered attacks distributing an archive that contains the legitimate Notepad++ application and a malicious utility called LunchPoke disguised as a plugin to establish persistence. The campaign has been attributed to UAC-0099, a threat cluster that primarily targets organizations in Ukraine. The article says UAC-0099 has previously been linked to providing initial access for attacks carried out by APT44, also known as Sandworm.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA observed that UAC-0099 now delivers a ZIP archive with a VBS script disguised as a PDF document, which retrieves another compressed file named Evernote.zip. That second archive contains Notepad++ version 8.8.3, a malicious NppExport.dll plugin, a password-protected updater.rar archive, and the legitimate WinRAR executable. The VBS script installs the package into a randomly named directory, launches Notepad++, and loads the malicious DLL through the application\u0026rsquo;s normal plugin-loading mechanism.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA says LunchPoke creates a Windows scheduled task and extracts the RAR archive contents, including RemoteLibUpdater.exe and InitTest.dll. RemoteLibUpdater.exe is BurnyBear, a loader for the MatchBoil V2 malware loader, and BurnyBear includes a fallback mechanism that can trigger RAM and CPU resource exhaustion if launching the executable fails. CERT-UA advises administrators to update Notepad++ to version 8.9.7, 7-Zip to version 26.02, and WinRAR to version 7.23.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukraine's CERT uncovered attacks that distribute a ZIP archive containing the legitimate Notepad++ application and a malicious utility called LunchPoke disguised as a plugin to establish persistence.","The campaign has been attributed to UAC-0099, a threat cluster that primarily targets organizations in Ukraine and has previously been linked to providing initial access for attacks by APT44, also known as Sandworm.","CERT-UA observed that UAC-0099 delivers a ZIP archive with a VBS script disguised as a PDF document, which retrieves another compressed file named Evernote.zip.","The second archive contains Notepad++ version 8.8.3, a malicious NppExport.dll plugin, a pa
