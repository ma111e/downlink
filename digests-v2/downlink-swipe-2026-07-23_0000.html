nt to confirm the account belongs to them. Google says users cannot add a selfie video while they are locked out or already in the account recovery process, and it advises users to update the saved video if their facial appearance changes significantly.\u003c/p\u003e\n\n\u003cp\u003eGoogle says the saved selfie video is encrypted at rest, can be deleted at any time, and is used only for account sign-in unless the user chooses to share it for other use cases. The feature is not available for Google Workspace accounts, child accounts, or Google Accounts enrolled in the Advanced Protection Program. Google Cloud Fraud Defense also announced a hand gesture verification system for reCAPTCHA that asks users to perform simple hand movements through their device camera, with videos deleted after verification.\u003c/p\u003e\n"},{"n":27,"title":"Better generic secrets detection starts with finding non-secrets","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/better-generic-secrets-detection-non-secrets","time":"16:11","priority":"MAY READ","score":58,"tldr":"Generic secrets scanners generate many false positives because they can’t verify unknown credential types, so Betterleaks now filters known public-by-design credentials like publishable API keys. This reduced manual review noise by about 2.37% in a Common Crawl test, showing that small denylist-style filters can improve generic secret triage at scale.","briefOverview":"\u003cp\u003eAikido Security describes a change to Betterleaks that filters public-by-design credentials out of generic secret detection results. The article explains that secrets scanners can verify known credential types, such as AWS or GitHub tokens, with liveness checks, but generic secrets lack a predefined way to confirm whether they are actually live. This leaves researchers and analysts manually reviewing many false positives.\u003c/p\u003e\n\n\u003cp\u003eThe new filtering focuses on publishable credentials, such as Stripe publishable API keys, that look like secrets but are intended to appear in public-facing code. Aikido manually authored detection signatures for common public credential types and added them to Betterleaks. In a test using 100GB from Common Crawl, these signatures reduced false positives by 2.37%, which the authors say equaled 27,886 fewer potential secrets to review manually.\u003c/p\u003e\n\n\u003cp\u003eThe article also outlines cases where filtering is harder, including nondistinct key formats, publishable and secret credentials that share the same format, public keys that may be risky if misconfigured, and test credentials that may still expose sensitive internal data. For some of these cases, the authors say liveness checks are needed to determine whether a key can access anything sensitive. Betterleaks now filters publishable keys from generic results by default, with the authors positioning this as one layer in a broader series of noise-reduction improvements.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Secrets scanners can use liveness checks for known credential types such as AWS or GitHub tokens, but generic secrets often lack a predefined way to verify whether they are real live secrets.","Aikido Security added manually authored signatures to Betterleaks to filter out public-by-design credentials, such as Stripe publishable API keys, from generic secret results.","In a 100GB Common Crawl test, the new publishable-credential signatures reduced false positives by 2.37%, which represented 27,886 fewer potential secrets to review manually.","The added filtering increased scanning time by about 5%, but the authors argue that avoiding many false positives is worth the cost.","The article identifies several difficult cases for filtering, including nondistinct key formats, publishable and secret credentials with the same format, misconfigured public keys, and test credentials that may still expose sensitive internal data."],"insights":["Filtering known non-secrets before applying more expensive methods is an explicit strategy in Betterleaks’ roadmap, with ML-assisted triage reserved for the remaining ambiguous generic findings.","The authors found that manually writing signatures for public-by-design credentials was necessary because AI was “surprisingly useless” for identifying and encoding these cases.","A key that is designed to be public is not always safe to suppress automatically, because some public-looking keys may become sensitive depending on permissions or SaaS platform behavior.","Test or sandbox credentials are intentionally not removed by default because the authors found that some organizations place production data in test environments."],"referencedReports":[],"body":"\u003cp\u003eAikido Security describes a change to Betterleaks that filters public-by-design credentials out of generic secret detection results. The article explains that secrets scanners can verify known credential types, such as AWS or GitHub tokens, with liveness checks, but generic secrets lack a predefined way to confirm whether they are actually live. This leaves researchers and analysts manually reviewing many false positives.\u003c/p\u003e\n\n\u003cp\u003eThe new filtering focuses on publishable credentials, such as Stripe publishable API keys, that look like secrets but are intended to appear in public-facing code. Aikido manually authored detection signatures for common public credential types and added them to Betterleaks. In a test using 100GB from Common Crawl, these signatures reduced false positives by 2.37%, which the authors say equaled 27,886 fewer potential secrets to review manually.\u003c/p\u003e\n\n\u003cp\u003eThe article also outlines cases where filtering is harder, including nondistinct key formats, publishable and secret credentials that share the same format, public keys that may be risky if misconfigured, and test credentials that may still expose sensitive internal data. For some of these cases, the authors say liveness checks are needed to determine whether a key can access anything sensitive. Betterleaks now filters publishable keys from generic results by default, with the authors positioning this as one layer in a broader series of noise-reduction improvements.\u003c/p\u003e\n"},{"n":34,"title":"The State of the Internet Is Changing: AI Exposures Surge While Global ICS Trends Shift","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/state-of-the-internet-2026-preview/","time":"12:02","priority":"MAY READ","score":58,"tldr":"Censys reports that public Internet exposure of AI/LLM tools has surged more than 60% in nine months, including fast-growing high-risk products like Langflow and LiteLLM with serious vulnerabilities. It also finds Internet-exposed industrial control systems continue shifting geographically, with Asia’s share rising while Europe’s declines.","briefOverview":"\u003cp\u003eCensys published a preview of findings from its upcoming 2026 State of the Internet Report, which will be released in the fall. The article says the report expands on Censys Internet Map observations and Censys ARC research into technologies, infrastructure, and security trends shaping the Internet. The preview focuses on rapid growth in Internet-exposed AI infrastructure and changing global patterns in Internet-exposed industrial control systems.\u003c/p\u003e\n\n\u003cp\u003eCensys says AI/LLM tool exposures have risen more than 60% in the past nine months, with over 294,000 distinct IPs now exposing one of 43 detected AI/LLM tools to the public Internet, up from about 183,000 in October 2025. The article highlights Langflow, which grew 169% in nine months and has accumulated 18 CVEs from 2024 to 2026, including 14 with CVSS scores above 8.0 and 4 CISA KEV entries. It also highlights LiteLLM, which nearly doubled and has an actively exploited pre-auth SQL injection, CVE-2026-42208, listed in CISA KEV.\u003c/p\u003e\n\n\u003cp\u003eFor industrial control systems, Censys observes an average of 138,000 distinct hosts running ICS services and tooling exposed on the Internet in early 2026, up from about 129,000 in 2024. North America represents roughly 38% of global ICS exposures, Asia has expanded from 22.9% in 2024 to 27% in 2026, and Europe has declined from 36.1% to 31.1%. The article also says roughly 70% of hosts running ICS devices and services globally have consistently been found on consumer and mobile networks for the last 2.5 years.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys reports that AI/LLM tool exposures have risen over 60% in the past nine months, with more than 294,000 distinct IPs now exposing one of 43 detected AI/LLM tools to the public Internet, up from about 183,000 in October 2025.","The article says some of the highest-risk AI/LLM products are among the fastest growing, including Langflow, which grew 169% in nine months and has accumulated 18 CVEs from 2024 to 2026.","Censys states that LiteLLM nearly doubled in the same nine-month period and has an actively exploited pre-auth SQL injection vulnerability, CVE-2026-42208, listed in CISA KEV.","Censys observes an average of 138,000 distinct hosts running ICS services and tooling exposed on the Internet in early 2026, up from about 129,000 in 2024.","The article says North America represents roughly 38% of global Internet-exposed ICS exposures in 2026, while Asia rose from 22.9% in 2024 to 27% in 2026 and Europe declined from 36.1% to 31.1%."],"insights":["The article highlights that AI exposure growth is not limited to low-risk experimentation; the fastest-growing products include tools with severe and actively exploited vulnerabilities, making exposure reduction especially urgent for Langflow and LiteLLM instances.","LiteLLM’s role as a unified LLM proxy makes a single exposed compromise especially consequential because the article says it can expose API keys for every upstream model provider.","The geography of Internet-exposed ICS is changing even though the types of networks hosting them are not, with consumer and mobile networks consistently accounting for roughly 70% of exposed ICS hosts over the last 2.5 years.","The increase in Asia’s share of global ICS exposure alongside Europe’s decline suggests that regional risk prioritization based on older exposure distributions may no longer match the current Internet landscape."],"referencedReports":[],"body":"\u003cp\u003eCensys published a preview of findings from its upcoming 2026 State of the Internet Report, which will be released in the fall. The article says the report expands on Censys Internet Map observations and Censys ARC research into technologies, infrastructure, and security trends shaping the Internet. The preview focuses on rapid growth in Internet-exposed AI infrastructure and changing global patterns in Internet-exposed industrial control systems.\u003c/p\u003e\n\n\u003cp\u003eCensys says AI/LLM tool exposures have risen more than 60% in the past nine months, with over 294,000 distinct IPs now exposing one of 43 detected AI/LLM tools to the public Internet, up from about 183,000 in October 2025. The article highlights Langflow, which grew 169% in nine months and has accumulated 18 CVEs from 2024 to 2026, including 14 with CVSS scores above 8.0 and 4 CISA KEV entries. It also highlights LiteLLM, which nearly doubled and has an actively exploited pre-auth SQL injection, CVE-2026-42208, listed in CISA KEV.\u003c/p\u003e\n\n\u003cp\u003eFor industrial control systems, Censys observes an average of 138,000 distinct hosts running ICS services and tooling exposed on the Internet in early 2026, up from about 129,000 in 2024. North America represents roughly 38% of global ICS exposures, Asia has expanded from 22.9% in 2024 to 27% in 2026, and Europe has declined from 36.1% to 31.1%. The article also says roughly 70% of hosts running ICS devices and services globally have consistently been found on consumer and mobile networks for the last 2.5 years.\u003c/p\u003e\n"},{"n":12,"title":"FedRAMP Rev5 Is Ending: What the 20x Transition Really Requires","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fedramp-rev5-is-ending-what-the-20x-transition-really-requires/","time":"14:00","priority":"MAY READ","score":55,"tldr":"FedRAMP 20X shifts compliance from annual, narrative-based audits to continuous assurance backed by machine-readable evidence and recurring validation. Organizations moving from Rev5 need to build sustainable evidence pipelines and automate KSI validation rather than treating the transition as a documentation remap.","briefOverview":"\u003cp\u003eThe article says FedRAMP 20X changes federal cloud assurance from the Rev5 model of annual, narrative-heavy control documentation to continuous proof that security controls are working. It argues that Rev5 rewarded showing that a control existed at one point in time, while 20X asks organizations to keep proving their posture as environments change. The author frames this as a major shift from compliance writing to operational evidence.\u003c/p\u003e\n\n\u003cp\u003eA central change is the use of Key Security Indicators, or KSIs, which are measurable outcomes supported by machine-readable evidence. The article states that there are 56 KSIs in the Low baseline and 61 in Moderate, organized across twelve domains including cloud-native architecture, identity and access management, monitoring, incident response, and change management. It gives multi-factor authentication as an example, contrasting a Rev5 policy description with a 20X requirement to prove phishing-resistant MFA is enforced across every privileged production account.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations moving from Rev5 need to build evidence pipelines that collect, normalize, map, and generate structured evidence on a recurring cadence. It notes that machine-based KSIs may be revalidated as often as every few days for Moderate systems, while process-based KSIs require at least quarterly validation, and that Phase 2 completeness guidance requires at least 70 percent KSI automation plus both machine-readable and human-readable evidence. The author recommends starting early with a KSI where data already exists, testing continuous validation end to end, and treating assessment as a feedback loop rather than a one-time audit.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FedRAMP 20X replaces narrative-heavy Rev5 controls with Key Security Indicators that require measurable outcomes backed by machine-readable evidence.","The Low baseline includes 56 KSIs and the Moderate baseline includes 61 KSIs across twelve security domains, including cloud-native architecture, identity and access management, monitoring, incident response, and change management.","Under FedRAMP 20X, machine-based KSIs are revalidated on a short recurring schedule, as often as every few days for Moderate systems, while process-based KSIs require at least quarterly validation.","The Phase 2 completeness guidance requires automation to cover at least 70 percent of KSIs, every KSI to be addressed, and evidence to exist in both machine-readable and human-readable forms.","The article says organizations transitioning from Rev5 should run a KSI gap analysis, prioritize domains such as Authorization by FedRAMP and Identity and Access Management, and build evidence pipelines that collect, normalize, map, and generate structured evidence continuously."],"insights":["The article argues that the hardest part of moving to FedRAMP 20X may not be collecting technical telemetry, but updating manual governance items such as policy approvals, training records, and workflows that were not designed for continuous operation.","A practical starting point recommended in the article is to choose a KSI where most data already exists, instrument it end to end, run continuous validation, fix what breaks, and repeat before scaling to harder controls.","The assessor’s role changes under FedRAMP 20X from evaluating documentation and narratives to validating whether the organization’s evidence pipeline accurately reflects reality.","Anecdotes’ own path to FedRAMP 20X Moderate authorization is presented as an example of the framework acting as a feedback loop, because the company first landed at Low, used findings to improve, and then achieved Moderate."],"referencedReports":[],"body":"\u003cp\u003eThe article says FedRAMP 20X changes federal cloud assurance from the Rev5 model of annual, narrative-heavy control documentation to continuous proof that security controls are working. It argues that Rev5 rewarded showing that a control existed at one point in time, while 20X asks organizations to keep proving their posture as environments change. The author frames this as a major shift from compliance writing to operational evidence.\u003c/p\u003e\n\n\u003cp\u003eA central change is the use of Key Security Indicators, or KSIs, which are measurable outcomes supported by machine-readable evidence. The article states that there are 56 KSIs in the Low baseline and 61 in Moderate, organized across twelve domains including cloud-native architecture, identity and access management, monitoring, incident response, and change management. It gives multi-factor authentication as an example, contrasting a Rev5 policy description with a 20X requirement to prove phishing-resistant MFA is enforced across every privileged production account.\u003c/p\u003e\n\n\u003cp\u003eThe article says organizations moving from Rev5 need to build evidence pipelines that collect, normalize, map, and generate structured evidence on a recurring cadence. It notes that machine-based KSIs may be revalidated as often as every few days for Moderate systems, while process-based KSIs require at least quarterly validation, and that Phase 2 completeness guidance requires at least 70 percent KSI automation plus both machine-readable and human-readable evidence. The author recommends starting early with a KSI where data already exists, testing continuous validation end to end, and treating assessment as a feedback loop rather than a one-time audit.\u003c/p\u003e\n"},{"n":32,"title":"How Elasticsearch ES|QL COMPLETION turns noisy curl and wget rules into high-fidelity cloud security alerts","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/esql-completion-curl-wget-detection-triage","time":"00:00","priority":"MAY READ","score":55,"tldr":"Elastic shows how ES|QL COMPLETION can reduce noisy curl and wget detections by first applying deterministic filters and redacting secrets, then using an LLM to triage only the ambiguous cases. The main takeaway is that LLM-assisted triage can keep high-value cloud file-transfer rules enabled without overwhelming analysts with routine package downloads, CI activity, and automation.","briefOverview":"\u003cp\u003eElastic tested an ES|QL COMPLETION-based triage approach for noisy curl and wget detection rules in its own cloud fleet. Over a seven-day test of a wget rule, deterministic filtering reduced the results to three destinations, and the LLM triaged all three without producing an alert that an analyst had to open. The article frames this as a way to keep file transfer detections enabled in cloud environments without overwhelming analysts with routine package downloads, CI jobs, and automation.\u003c/p\u003e\n\n\u003cp\u003eThe rules parse the destination host from curl and wget process executions, filter known-good hosts, redact secrets from command lines, aggregate events by host and destination, and then send only capped, remaining rows to ES|QL COMPLETION for a structured verdict. The LLM is instructed to classify activity as true positive, false positive, or suspicious, and the rule only alerts on true positive or suspicious results above a confidence threshold. Elastic emphasizes that deterministic logic should handle known-good cases first, while LLM triage should be reserved for ambiguous events that still have enough context to evaluate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic tested a noisy wget detection rule on its own cloud fleet for seven days, and only three destinations survived deterministic filtering before ES|QL COMPLETION triaged them.","The article describes using ES|QL COMPLETION inside individual curl and wget detection rules to decide whether remaining events are likely attacker activity, expected automation, or ambiguous activity needing review.","The rules parse the destination host from curl and wget executions, apply allow-lists for known-good destinations, redact secrets from command lines, aggregate by host and destination, and then send capped rows to a large language model for a structured verdict.","Elastic recommends filtering by parsed destination host rather than raw command line text because substring matches in raw arguments can accidentally allow misleading or unrelated values.","In Elastic’s internal seven-day wget test, the LLM marked cdn.playwright.dev and 1.1.1.1 as false positives and 18.66.X.X as suspicious, showing that LLM triage should run after deterministic filtering rather than before it."],"insights":["The article emphasizes that LLM triage is most useful after deterministic filtering, because sending package mirrors, known automation, and other obvious benign activity to the model wastes tokens and adds little value.","Anchoring allow-lists to a parsed destination host is a practical way to avoid brittle command-line exceptions, since a trusted domain can appear in a parameter, path, or misleading string without being the actual destination.","The prompt explicitly treats command and URL text as untrusted data, showing that detection rules using LLMs must account for prompt injection from attacker-controlled process arguments.","The rules suppress duplicate alerts for six hours by host and destination, which reduces both analyst noise and repeated LLM token consumption from the same noisy source.","Elastic’s test showed that even a destination judged suspicious by the LLM was not considered a true positive without supporting command-line context, reinforcing that the model’s role is triage rather than final incident determination."],"referencedReports":[{"title":"Ingress Tool Transfer, T1105","url":"https://attack.mitre.org/techniques/T1105/","publisher":"MITRE ATT\u0026CK","context":"The article cites MITRE ATT\u0026CK to explain that attackers commonly use curl and wget to transfer tools or payloads into victim environments.","category":"research","primary":false}],"body":"\u003cp\u003eElastic tested an ES|QL COMPLETION-based triage approach for noisy curl and wget detection rules in its own cloud fleet. Over a seven-day test of a wget rule, deterministic filtering reduced the results to three destinations, and the LLM triaged all three without producing an alert that an analyst had to open. The article frames this as a way to keep file transfer detections enabled in cloud environments without overwhelming analysts with routine package downloads, CI jobs, and automation.\u003c/p\u003e\n\n\u003cp\u003eThe rules parse the destination host from curl and wget process executions, filter known-good hosts, redact secrets from command lines, aggregate events by host and destination, and then send only capped, remaining rows to ES|QL COMPLETION for a structured verdict. The LLM is instructed to classify activity as true positive, false positive, or suspicious, and the rule only alerts on true positive or suspicious results above a confidence threshold. Elastic emphasizes that deterministic logic should handle known-good cases first, while LLM triage should be reserved for ambiguous events that still have enough context to evaluate.\u003c/p\u003e\n"},{"n":18,"title":"How Synthetic Identity Fraud is Coming for Machine Identities","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/how-synthetic-identity-fraud-is-coming.html","time":"11:45","priority":"MAY READ","score":52,"tldr":"Attackers can create fabricated machine identities that look legitimate, accumulate privileges, and evade controls focused only on stolen credentials. Organizations should require ownership, short-lived secrets, least privilege, and continuous behavioral verification for every non-human identity.","briefOverview":"\u003cp\u003eThe article argues that synthetic identity fraud has a machine-side parallel in non-human identities. Instead of stealing an existing service account, an attacker can fabricate a machine identity that was never legitimately provisioned. Such an identity can blend real environmental attributes with fake ones so it appears to belong inside an enterprise environment.\u003c/p\u003e\n\n\u003cp\u003eFabricated machine identities may use familiar naming conventions, the correct domain, plausible metadata, and permission requests similar to other non-human identities. The article describes rogue service accounts, DCShadow, and shadow credentials as examples of ways illegitimate identities or authentication paths can be accepted by trusted systems. This risk is significant because a fabricated identity has no real owner, compromised user, or stolen credential alert to draw attention to it.\u003c/p\u003e\n\n\u003cp\u003eThe article says agentic AI makes the issue more timely because AI agents can acquire credentials dynamically and increasingly spin up other agents with identities of their own. To defend against fabricated machine identities, it recommends assigning every non-human identity a human owner, documented purpose, and expiration date. It also recommends centralized secrets management with automated rotation, least-privilege and Just-in-Time access, and continuous verification of identity behavior over time.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that synthetic identity fraud has a parallel in non-human identities, where attackers fabricate machine identities that were never legitimately provisioned.","Fabricated machine identities can appear credible by using real environmental attributes such as naming conventions, domains, plausible metadata, and typical permission requests.","The article identifies rogue service accounts, DCShadow, and shadow credentials as ways attackers can create or support illegitimate machine identities that environments accept as trusted.","Agentic AI makes the issue more timely because AI agents can acquire credentials dynamically and increasingly spin up other agents with identities of their own.","The article recommends assigning every non-human identity a human owner, rotating secrets, enforcing least privilege, and continuously verifying behavior to reduce the risk from fabricated identities."],"insights":["Detection programs focused on stolen machine credentials can miss fabricated identities because there is no legitimate owner or compromised account activity to trigger concern.","A fabricated machine identity can become convincing by blending into ordinary administrative patterns, such as matching naming conventions and requesting permissions that other machine identities already hold.","DCShadow is framed as a post-compromise way to fabricate trust at the infrastructure level, because malicious changes can appear to come from legitimate domain controller replication traffic.","Requiring every machine identity to have a human owner, purpose, and expiration date directly removes the condition that lets fabricated identities persist unnoticed."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that synthetic identity fraud has a machine-side parallel in non-human identities. Instead of stealing an existing service account, an attacker can fabricate a machine identity that was never legitimately provisioned. Such an identity can blend real environmental attributes with fake ones so it appears to belong inside an enterprise environment.\u003c/p\u003e\n\n\u003cp\u003eFabricated machine identities may use familiar naming conventions, the correct domain, plausible metadata, and permission requests similar to other non-human identities. The article describes rogue service accounts, DCShadow, and shadow credentials as examples of ways illegitimate identities or authentication paths can be accepted by trusted systems. This risk is significant because a fabricated identity has no real owner, compromised user, or stolen credential alert to draw attention to it.\u003c/p\u003e\n\n\u003cp\u003eThe article says agentic AI makes the issue more timely because AI agents can acquire credentials dynamically and increasingly spin up other agents with identities of their own. To defend against fabricated machine identities, it recommends assigning every non-human identity a human owner, documented purpose, and expiration date. It also recommends centralized secrets management with automated rotation, least-privilege and Just-in-Time access, and continuous verification of identity behavior over time.\u003c/p\u003e\n"},{"n":5,"title":"EU fines Google $1 billion for search, app store antitrust violations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/google/eu-fines-google-1-billion-for-digital-markets-act-breaches-in-search-and-play-store/","time":"12:33","priority":"MAY READ","score":48,"tldr":"The European Commission fined Google €890 million ($1 billion) for violating the Digital Markets Act by favoring its own services in Search and restricting app developers from directing users to cheaper options outside Google Play. Google must end the practices within 60 days or face additional penalties.","briefOverview":"\u003cp\u003eThe European Commission fined Google €890 million ($1 billion) after finding that the company violated the European Union’s Digital Markets Act. The Commission said Google favored its own services in Google Search and restricted how app developers could direct customers to cheaper purchase options on Google Play. Google was designated a gatekeeper for Google Search in September 2023, and non-compliance investigations were opened in March 2024.\u003c/p\u003e\n\n\u003cp\u003eThe fine includes €460 million for boosting Google’s own services in search results and €430 million for app store steering practices. The Commission said Google gave preferential treatment to its own shopping, hotels, transport, and sports results over third-party services. It also said Google prevented app developers from freely communicating offers and concluding contracts with users through distribution channels of their choice, including third-party app stores.\u003c/p\u003e\n\n\u003cp\u003eGoogle was ordered to end the violations within 60 days or risk penalty payments of up to 5% of its worldwide turnover. The Commission noted that Google has begun testing changes to how its own services appear in search results and has rolled out changes to its steering terms, which it described as substantial progress toward compliance. The article also notes other recent European penalties and legal setbacks involving Google, including fines related to adtech practices, cookie regulations, Gmail ads, and Android.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Commission fined Google €890 million ($1 billion) for violating the European Union's Digital Markets Act.","The Commission found that Google favored its own services, including shopping, hotels, transport, and sports results, over third-party services in Google Search.","The Commission said Google restricted app developers from freely promoting offers and concluding contracts with users through channels of their choice, including third-party app stores.","Google was fined €460 million for boosting its services in search results and €430 million for its app store steering practices.","Google was ordered to end the violations within 60 days or risk penalty payments of up to 5% of its worldwide turnover."],"insights":["The fine was split almost evenly between search favoritism and app store steering practices, showing the Commission treated both Google Search and Google Play conduct as major Digital Markets Act compliance failures.","The Commission acknowledged that Google had begun testing search placement changes and revised its steering terms, but still concluded those efforts were not enough to avoid penalties.","The 60-day deadline creates a near-term compliance pressure point because continued violations could trigger penalty payments of up to 5% of Google's worldwide turnover.","The decision adds to several recent European penalties against Google, including fines tied to adtech practices, cookie rules, Gmail ads, and Android-related antitrust conduct."],"referencedReports":[],"body":"\u003cp\u003eThe European Commission fined Google €890 million ($1 billion) after finding that the company violated the European Union’s Digital Markets Act. The Commission said Google favored its own services in Google Search and restricted how app developers could direct customers to cheaper purchase options on Google Play. Google was designated a gatekeeper for Google Search in September 2023, and non-compliance investigations were opened in March 2024.\u003c/p\u003e\n\n\u003cp\u003eThe fine includes €460 million for boosting Google’s own services in search results and €430 million for app store steering practices. The Commission said Google gave preferential treatment to its own shopping, hotels, transport, and sports results over third-party services. It also said Google prevented app developers from freely communicating offers and concluding contracts with users through distribution channels of their choice, including third-party app stores.\u003c/p\u003e\n\n\u003cp\u003eGoogle was ordered to end the violations within 60 days or risk penalty payments of up to 5% of its worldwide turnover. The Commission noted that Google has begun testing changes to how its own services appear in search results and has rolled out changes to its steering terms, which it described as substantial progress toward compliance. The article also notes other recent European penalties and legal setbacks involving Google, including fines related to adtech practices, cookie regulations, Gmail ads, and Android.\u003c/p\u003e\n"},{"n":35,"title":"France Cyber Threat Outlook: Dark Web, Ransomware, and Hacktivism Trends","source":"cloudsek.com","sourceColorIdx":2,"link":"https://www.cloudsek.com/blog/france-dark-web-ransomware-hacktivism-report","time":"00:00","priority":"MAY READ","score":45,"tldr":"France faces a growing cyber threat landscape driven by dark web activity, ransomware operations, and politically motivated hacktivism. Organizations should prioritize monitoring exposed data, hardening defenses, and preparing for disruption-focused attacks.","briefOverview":"\u003cp\u003eThe article is titled “France Cyber Threat Outlook: Dark Web, Ransomware, and Hacktivism Trends.” It presents itself as an overview of cyber threats connected to France. The title identifies dark web activity, ransomware, and hacktivism as the main areas of focus.\u003c/p\u003e\n\n\u003cp\u003eBased on the available article text, the significance is that these threat areas are being discussed together as part of France’s cyber threat outlook. The article does not provide readable details about specific incidents, affected organizations, named threat actors, or technical indicators. No clear linked reports, advisories, or primary research sources are visible in the provided content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"France Cyber Threat Outlook: Dark Web, Ransomware, and Hacktivism Trends.\"","The article focuses on cyber threats related to France.","The article identifies dark web activity, ransomware, and hacktivism as the main trend areas it discusses."],"insights":[],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “France Cyber Threat Outlook: Dark Web, Ransomware, and Hacktivism Trends.” It presents itself as an overview of cyber threats connected to France. The title identifies dark web activity, ransomware, and hacktivism as the main areas of focus.\u003c/p\u003e\n\n\u003cp\u003eBased on the available article text, the significance is that these threat areas are being discussed together as part of France’s cyber threat outlook. The article does not provide readable details about specific incidents, affected organizations, named threat actors, or technical indicators. No clear linked reports, advisories, or primary research sources are visible in the provided content.\u003c/p\u003e\n"},{"n":23,"title":"ThreatsDay: Android Spyware, PLC Attacks, AI Image Prompt Injection + 12 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/threatsday-android-spyware-plc-attacks.html","time":"15:02","priority":"MAY READ","score":40,"tldr":"This week’s threats mostly abused trusted tools and familiar workflows, including malicious npm and VS Code packages, fake Android safety apps, AI prompt-injection images, and exposed PLCs. The key lesson is to tightly limit what ordinary-looking installs, permissions, and automation can access if they turn malicious.","briefOverview":"\u003cp\u003eThis ThreatsDay bulletin summarizes a week of security stories where harmful activity was hidden inside ordinary-looking tools, apps, permissions, and system features. The article covers malicious software packages, fake developer extensions, phishing campaigns, Android surveillance and ad-fraud apps, AI prompt-injection techniques, operational technology targeting, and malware using normal network traffic. Its main theme is that many of the threats relied on borrowed trust rather than visibly advanced hacking.\u003c/p\u003e\n\n\u003cp\u003eSeveral incidents involved software or apps that appeared useful or familiar but performed harmful actions. An npm package named @copilot-mcp/apex installed a macOS AMOS-family infostealer during npm install or npx execution, while a counterfeit Visual Studio Code extension called Markdown All Pro impersonated a popular legitimate extension and opened a remote delivery channel. Fake Android apps also played a major role, including a Bahraini Civil Defense “BH Alert” app that embedded OctagonPanel surveillance malware and fake Android applications used by TAG-182 to distribute MarkiRAT.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights broader risks in AI, industrial systems, and normal infrastructure. GhostCommit hid malicious instructions in a PNG image so an AI coding agent could later be tricked into reading repository secrets, while CISA and other U.S. government partners warned about Iranian-affiliated activity targeting internet-connected PLCs across critical infrastructure sectors. Other stories included Lampion banking malware phishing Portuguese users, TrickBot using DNS tunneling for command-and-control, and findings that AI-generated apps contained hundreds of validated security flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An npm package named @copilot-mcp/apex acted as a postinstall dropper that installed a macOS AMOS-family infostealer when users ran npm install or npx @copilot-mcp/apex.","A counterfeit Visual Studio Code extension called Markdown All Pro impersonated the legitimate Markdown All in One extension, sent machine details to an attacker, and opened a remote delivery channel for additional commands.","A technique called GhostCommit hid malicious instructions inside a PNG image in a pull request so an LLM reviewer or coding agent could later be tricked into reading repository secrets from a .env file.","U.S. government agencies warned that Iranian-affiliated activity was targeting internet-connected operational technology devices, including PLCs from Rockwell Automation, Schneider Electric, and Siemens.","Fake Android apps, including a Bahraini Civil Defense “BH Alert” siren app and fake VPN or media tools linked to TAG-182, were used to collect sensitive data or support surveillance operations."],"insights":["Several threats did not need novel exploits because they relied on trusted user actions such as running an install command, installing a familiar-looking extension, granting Android permissions, or opening what appeared to be a legitimate app.","Software supply-chain controls are tightening proactively, as shown by PyPI blocking new files on releases older than 14 days even though it said it was not aware the weakness had already been abused.","AI systems create new trust boundaries because GhostCommit placed the only malicious instructions inside an image that a text-based reviewer would not read, but an AI coding agent could later process and act on.","Some campaigns used legitimate or familiar platforms to lower suspicion, including a malicious Claude Artifact hosted on Claude.ai and fake app sites that cloned Google Play and Bahraini government pages.","The article shows that normal infrastructure features can become hiding places or control channels, including DNS responses used by TrickBot for command-and-control and reusable PLC code modules targeted in operational technology environments."],"referencedReports":[{"title":"GitHub Announces GHES Security Change","url":"https://github.blog/changelog/2026-07-22-upcoming-ghes-change-impacting-uploading-support-bundles/","publisher":"GitHub","context":"The article cites GitHub’s notice about upcoming rejection of command-line support bundle uploads from older unpatched GHES appliances.","category":"advisory","primary":true},{"title":"Npm Dropper Delivers macOS Infostealer","url":"https://safedep.io/malicious-copilot-mcp-apex-npm-macos-infostealer/","publisher":"SafeDep","context":"The article references SafeDep’s analysis of the @copilot-mcp/apex npm package acting as a postinstall dropper for a macOS infostealer.","category":"research","primary":true},{"title":"Counterfeit VS Extension Steals Machine Data","url":"https://www.manifold.security/blog/a-beaconing-counterfeit-extension-on-the-vs-code-marketplace-the-markdown-all-pro-extension","publisher":"Manifold Security","context":"The article cites Manifold Security’s analysis of a counterfeit Visual Studio Code extension that impersonated Markdown All in One.","category":"research","primary":true},{"title":"PyPI Rejects New Files After 14 Days","url":"https://blog.pypi.org/posts/2026-07-22-releases-now-reject-new-files-after-14-days/","publisher":"PyPI","context":"The article references PyPI’s security change blocking new file uploads to releases older than 14 days.","category":"advisory","primary":true},{"title":"Lampion Malware Targets Portuguese Users","url":"https://www.acronis.com/en/tru/posts/lampions-portugal-focused-phishing-campaign-delivers-multistage-malware/","publisher":"Acronis","context":"The article cites Acronis’s technical analysis of a Portugal-focused phishing campaign delivering Lampion banking malware.","category":"research","primary":true},{"title":"New AfterCall Android Ad Fraud Scheme Exposed","url":"https://medium.com/doubleverify-engineering/a-new-ad-fraud-trend-aftercall-ads-ec44279843b2","publisher":"DoubleVerify","context":"The article references DoubleVerify’s findings on AfterCall Android apps that abuse overlay permissions to display ads after phone calls.","category":"research","primary":true},{"title":"Claude Desktop Malvertising Campaign Targets 29 Organizations with SectopRAT","url":"https://www.huntress.com/blog/fakeagent-claude-desktop-malvertising-ends-in-dotnet-rat","publisher":"Huntress","context":"The article cites Huntress’s disclosure of the FakeAgent malvertising campaign that led to SectopRAT infections.","category":"research","primary":true},{"title":"GhostCommit Hides Prompt Injection in Images to Trick AI Agents","url":"https://asset-group.github.io/disclosures/ghostcommit/","publisher":"University of Missouri-Kansas City ASSET Research Group","context":"The article references ASSET Research Group’s disclosure of GhostCommit, a technique that hides malicious AI-agent instructions inside a PNG image.","category":"research","primary":true},{"title":"CISA Issues Alert About Iran-Affiliated Threat Actors Targeting PLCs","url":"https://www.cisa.gov/news-events/news/cisa-fbi-epa-and-us-government-partners-update-warning-iran-affiliated-threat-actors-targeting","publisher":"CISA","context":"The article cites a U.S. government advisory update about Iranian-affiliated activity targeting internet-connected operational technology devices and PLCs.","category":"advisory","primary":true},{"title":"Fake Bahrain Civil-Defense App Turns Phones Into Listening Posts","url":"https://dreamgroup.com/blog/how-a-fake-bahrain-civil-defense-app-turns-a-phone-into-a-listening-post","publisher":"Dream","context":"The article references Dream’s analysis of a fake Bahraini Civil Defense app embedding OctagonPanel surveillance malware.","category":"research","primary":true},{"title":"Iran-Nexus TAG-182 Disseminates MarkiRAT Surveillance Tool","url":"https://www.recordedfuture.com/research/nexus-tag182-disseminates-markirat","publisher":"Recorded Future","context":"The article cites Recorded Future’s research on TAG-182 distributing MarkiRAT through fake Android applications.","category":"research","primary":true},{"title":"Vibe-Coded Apps Suffer From Exploitable Security Flaws","url":"https://go.xint.io/the-top-security-vulnerabilities-generated-by-ai-code","publisher":"Xint","context":"The article references Xint’s analysis of 28 AI-generated apps that found 434 validated vulnerabilities.","category":"research","primary":true},{"title":"Russian Threat Actor Turns Frontier AI into Offensive Platform","url":"https://www.catonetworks.com/blog/cato-ctrl-how-one-threat-actor-turned-frontier-ai-into-an-offensive-platform/","publisher":"Cato Networks","context":"The article cites Cato Networks’ research on the Russian-speaking threat actor Trim using frontier AI models for offensive tooling.","category":"research","primary":true},{"title":"TrickBot Variant Uses DNS Tunneling for C2","url":"https://www.fortinet.com/blog/threat-research/inside-a-trickbot-variant-using-dns-tunneling-for-c2","publisher":"Fortinet","context":"The article references Fortinet’s technical analysis of a TrickBot variant using DNS tunneling for command-and-control communication.","category":"research","primary":true}],"body":"\u003cp\u003eThis ThreatsDay bulletin summarizes a week of security stories where harmful activity was hidden inside ordinary-looking tools, apps, permissions, and system features. The article covers malicious software packages, fake developer extensions, phishing campaigns, Android surveillance and ad-fraud apps, AI prompt-injection techniques, operational technology targeting, and malware using normal network traffic. Its main theme is that many of the threats relied on borrowed trust rather than visibly advanced hacking.\u003c/p\u003e\n\n\u003cp\u003eSeveral incidents involved software or apps that appeared useful or familiar but performed harmful actions. An npm package named @copilot-mcp/apex installed a macOS AMOS-family infostealer during npm install or npx execution, while a counterfeit Visual Studio Code extension called Markdown All Pro impersonated a popular legitimate extension and opened a remote delivery channel. Fake Android apps also played a major role, including a Bahraini Civil Defense “BH Alert” app that embedded OctagonPanel surveillance malware and fake Android applications used by TAG-182 to distribute MarkiRAT.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights broader risks in AI, industrial systems, and normal infrastructure. GhostCommit hid malicious instructions in a PNG image so an AI coding agent could later be tricked into reading repository secrets, while CISA and other U.S. government partners warned about Iranian-affiliated activity targeting internet-connected PLCs across critical infrastructure sectors. Other stories included Lampion banking malware phishing Portuguese users, TrickBot using DNS tunneling for command-and-control, and findings that AI-generated apps contained hundreds of validated security flaws.\u003c/p\u003e\n"},{"n":29,"title":"Don’t swing at everything","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/dont-swing-at-everything/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Vulnerability volume is rising much faster than active exploitation, so defenders should prioritize patches using exploit-likelihood signals like EPSS and CISA KEV rather than chasing every high-CVSS issue. The newsletter also highlights Cisco Talos’ discovery of msaRAT, a Chaos ransomware-linked RAT that abuses Chrome/Edge DevTools Protocol for stealthy C2.","briefOverview":"\u003cp\u003eThe article argues that vulnerability discovery is accelerating while real-world exploitation and patching remain uneven. In 2026 Q2, CVEs were up 49% year over year, with close to 200 CVEs per day tracked by the end of June. Known Exploited Vulnerabilities grew 13%, and networking-gear-related CVEs accounted for 24% of KEV-related vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe author says older vulnerabilities remain a major problem, with CVEs from 2024 or earlier still making up about 24% of tracked items and 46% of current KEV CVEs tracing back to 2025 or earlier. The article uses EPSS to argue against patching purely by CVSS severity, noting that about 3,700 CVSS 9+ CVEs would be urgent under that approach, but 95% have EPSS scores below 5%. It highlights 32 CVSS 9+ CVEs with EPSS of at least 50%, 25 of which are already on CISA’s KEV list.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main threat item is Cisco Talos’ discovery of msaRAT, a Rust-based remote access trojan used by the Chaos ransomware group. msaRAT uses the Tokio runtime and hijacks Chrome or Edge through the Chrome DevTools Protocol to create a covert command-and-control channel. Talos says defenders should watch for unusual curl commands, MSI files downloaded to ProgramData, plain HTTP traffic over port 443, unauthorized Chrome or Edge manipulation, and unauthorized WebRTC connections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says CVEs grew 49% year over year in 2026 Q2, with close to 200 CVEs per day being tracked by the end of June.","The author found 452 AI-related CVEs in the calendar year using a keyword methodology, but adding “openclaw” would add another 536, showing the metric is sensitive to keyword changes.","Known Exploited Vulnerabilities grew 13%, while networking-gear-related CVEs rose to 24% of KEV-related vulnerabilities, up from 20% in Q1.","The article says 46% of currently actively exploited KEV CVEs trace back to 2025 or earlier, despite typical enterprise patch cycles being described as 30–90 days.","Cisco Talos discovered msaRAT, a Rust-based remote access trojan used by the Chaos ransomware group that hijacks Chrome or Edge through the Chrome DevTools Protocol to create a covert command-and-control channel."],"insights":["High CVSS scores alone would create a large patching workload of about 3,700 CVEs, but the article says 95% of those have EPSS scores below 5%, making exploit-likelihood data a more practical way to decide what to fix first.","The article highlights seven CVSS 9+ CVEs with EPSS scores of at least 50% that are not yet on CISA’s KEV list, making them specific candidates for closer monitoring.","The AI-related CVE count changes dramatically when one keyword, “openclaw,” is added, showing that trend measurements based on keywords may become unreliable as terminology shifts.","The persistence of older exploited vulnerabilities means patching only the newest disclosures is insufficient, since nearly half of current KEV CVEs still trace back to 2025 or earlier.","msaRAT’s use of legitimate browser processes and trusted services means defenders should look for behavior such as unauthorized Chrome or Edge manipulation, rather than relying only on direct network indicators."],"referencedReports":[{"title":"Our evaluation of OpenAI’s GPT-5.5 cyber capabilities","url":"https://www.aisi.gov.uk/blog/our-evaluation-of-openais-gpt-5-5-cyber-capabilities","publisher":"UK AI Security Institute","context":"The article cites this evaluation as evidence that Codex 5.3 and GPT-5.5 deliver comparable or better cyber capabilities in the post-Mythos era.","category":"research","primary":false}],"body":"\u003cp\u003eThe article argues that vulnerability discovery is accelerating while real-world exploitation and patching remain uneven. In 2026 Q2, CVEs were up 49% year over year, with close to 200 CVEs per day tracked by the end of June. Known Exploited Vulnerabilities grew 13%, and networking-gear-related CVEs accounted for 24% of KEV-related vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe author says older vulnerabilities remain a major problem, with CVEs from 2024 or earlier still making up about 24% of tracked items and 46% of current KEV CVEs tracing back to 2025 or earlier. The article uses EPSS to argue against patching purely by CVSS severity, noting that about 3,700 CVSS 9+ CVEs would be urgent under that approach, but 95% have EPSS scores below 5%. It highlights 32 CVSS 9+ CVEs with EPSS of at least 50%, 25 of which are already on CISA’s KEV list.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main threat item is Cisco Talos’ discovery of msaRAT, a Rust-based remote access trojan used by the Chaos ransomware group. msaRAT uses the Tokio runtime and hijacks Chrome or Edge through the Chrome DevTools Protocol to create a covert command-and-control channel. Talos says defenders should watch for unusual curl commands, MSI files downloaded to ProgramData, plain HTTP traffic over port 443, unauthorized Chrome or Edge manipulation, and unauthorized WebRTC connections.\u003c/p\u003e\n"},{"n":30,"title":"Preview: Cisco Talos at Black Hat USA 2026","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/preview-cisco-talos-at-black-hat-usa-2026/","time":"10:00","priority":"MAY READ","score":35,"tldr":"Cisco Talos will be at Black Hat USA 2026 with booth lightning talks, keynote and workshop sessions focused heavily on AI agents, AI-assisted security operations, threat research, and how Talos intelligence is embedded across Cisco’s security portfolio.","briefOverview":"\u003cp\u003eCisco Talos will be present at Black Hat USA 2026 in Las Vegas within the Cisco and Splunk booth 2633. The team plans to discuss its latest threat research, incident response, and how Talos intelligence powers the Cisco portfolio. The article previews several Talos, Cisco, and Splunk activities scheduled around the event.\u003c/p\u003e\n\n\u003cp\u003eTalos researchers will give 15-minute booth lightning talks on topics such as threat actor prompting, Warlock ransomware, zero trust for agent identity, cybersecurity fraud prediction, and vulnerability discovery trends. Cisco’s David Dalling and Rick Miles will also deliver a Main Stage keynote on protecting enterprises as AI agents become increasingly capable and privileged inside business environments. A Talos workshop led by Nick Biasini and Cisco’s Omar Santos will cover AI in SOC workflows, the Foundry Security Spec, Project CodeGuard, and Talos’ use of AI for threat hunting.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights a Splunk workshop about autonomous agents acting as insider threats by using valid credentials and delegated authority. It describes examples such as agents moving sensitive data across tools, distributing brute-force attempts under a single delegation, and manipulating internal systems without triggering traditional SIEM or UEBA alerts. Talos also emphasizes its “It was Talos all along” campaign, stating that Talos is embedded across the Cisco security portfolio rather than sold as a standalone product or bolt-on threat intelligence feed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos will have a presence within the Cisco and Splunk booth 2633 at Black Hat USA 2026 to discuss threat research, incident response, and Talos intelligence across the Cisco portfolio.","Talos researchers will deliver 15-minute booth lightning talks on topics including threat actor prompting, Warlock ransomware, zero trust for agent identity, cybersecurity fraud prediction, and vulnerability discovery trends.","Cisco’s David Dalling and Rick Miles will give a Main Stage keynote on August 5 about protecting enterprises as AI agents become increasingly capable and privileged inside business environments.","Talos’ Nick Biasini and Cisco’s Omar Santos will lead a workshop on August 5 about using AI in SOC workflows, the Foundry Security Spec, Project CodeGuard, and Talos’ use of AI for threat hunting.","A Splunk workshop on August 5 will examine how autonomous agents using valid credentials and delegated authority could act as insider threats without triggering traditional SIEM or UEBA alerts."],"insights":["The article frames AI agents as a security concern not only because they are capable, but because they may become privileged actors inside enterprise environments with delegated authority and valid credentials.","Cisco Talos is positioning AI as both an offensive and defensive factor, with sessions covering adversaries’ use of prompts and agents as well as Talos’ own use of AI for threat hunting and SOC workflows.","The Splunk workshop highlights a detection gap: autonomous agents could move data, distribute brute-force attempts, or manipulate internal systems without triggering traditional SIEM or UEBA alerts.","Talos emphasizes that it is not sold as a separate product or add-on feed, but is embedded across the Cisco security portfolio through threat research and intelligence integrations."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos will be present at Black Hat USA 2026 in Las Vegas within the Cisco and Splunk booth 2633. The team plans to discuss its latest threat research, incident response, and how Talos intelligence powers the Cisco portfolio. The article previews several Talos, Cisco, and Splunk activities scheduled around the event.\u003c/p\u003e\n\n\u003cp\u003eTalos researchers will give 15-minute booth lightning talks on topics such as threat actor prompting, Warlock ransomware, zero trust for agent identity, cybersecurity fraud prediction, and vulnerability discovery trends. Cisco’s David Dalling and Rick Miles will also deliver a Main Stage keynote on protecting enterprises as AI agents become increasingly capable and privileged inside business environments. A Talos workshop led by Nick Biasini and Cisco’s Omar Santos will cover AI in SOC workflows, the Foundry Security Spec, Project CodeGuard, and Talos’ use of AI for threat hunting.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights a Splunk workshop about autonomous agents acting as insider threats by using valid credentials and delegated authority. It describes examples such as agents moving sensitive data across tools, distributing brute-force attempts under a single delegation, and manipulating internal systems without triggering traditional SIEM or UEBA alerts. Talos also emphasizes its “It was Talos all along” campaign, stating that Talos is embedded across the Cisco security portfolio rather than sold as a standalone product or bolt-on threat intelligence feed.\u003c/p\u003e\n"},{"n":36,"title":
