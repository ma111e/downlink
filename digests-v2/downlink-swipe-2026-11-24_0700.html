<script type="application/json" id="dl-articles">[{"n":3,"title":"Patching vCenter Zero-Day Is Only Step One","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/cve-2026-123890-vcenter-zero-day-patching/","time":"08:06","priority":"MUST READ","score":98,"tldr":"Broadcom’s patch for the actively exploited CVE-2026-123890 vCenter authentication bypass must be installed immediately, but organizations should also assume possible compromise if vCenter was reachable since September 2026. Hunt for attacker persistence and rotate vCenter SAML signing keys, privileged credentials, ESXi access, and potentially Active Directory secrets.","briefOverview":"\u003cp\u003eCVE-2026-123890 is a critical authentication bypass in VMware vCenter’s Directory Service that can allow a network-reachable attacker to obtain an \u003ccode\u003eadministrator@vsphere.local\u003c/code\u003e session without a password. Google Threat Intelligence Group and Mandiant reported that the suspected China-nexus group ARMORY CASTLE exploited the flaw as a zero-day from early September 2026. Broadcom released fixes on November 19, 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog with a November 23 deadline for U.S. federal agencies.\u003c/p\u003e\n\n\u003cp\u003eIn the investigated intrusion, attackers entered through a BeyondTrust Remote Support zero-day, moved through internal Linux appliances, and used a custom tool called BONESAW to take over vCenter through TCP port 2012. They copied vCenter’s directory database and SAML token-signing key, enabled SSH on the vCenter appliance, accessed ESXi hosts, and extracted Active Directory data from a virtual machine disk. The article stresses that patching is necessary but does not undo prior compromise, so affected organizations should hunt for unauthorized accounts and persistence, replace the SAML signing certificate, reset relevant vSphere and ESXi credentials, and consider Active Directory passwords exposed where domain-controller disks may have been accessed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123890 is a critical VMware vCenter Directory Service authentication bypass that can let a network-reachable attacker obtain an administrator@vsphere.local session without a password.","Google Threat Intelligence Group and Mandiant reported that the suspected China-nexus group ARMORY CASTLE exploited the flaw as a zero-day from early September 2026.","Broadcom released fixes on November 19, 2026, for vCenter 9.1, 9.0, and 8.0 product lines, while vCenter 7.0 has no public fix.","Attackers in the investigated intrusion stole vCenter’s SAML token-signing key, master encryption key, PostgreSQL password, and Active Directory data extracted from virtual-machine disks.","Patching prevents use of the login flaw but does not invalidate stolen signing keys, remove unauthorized accounts, or reverse credential theft, so the article recommends hunting for compromise and rotating affected secrets."],"insights":["Keeping vCenter off the public internet did not prevent the reported intrusion, because the attackers first compromised a remote-support appliance and then reached vCenter from inside the network.","Replacing the vCenter SAML signing certificate is essential after suspected compromise because someone holding the stolen key can continue creating administrator login tokens even after the authentication flaw is patched.","An organization may need to treat its entire Active Directory environment as exposed if a domain controller’s virtual disk was accessible through compromised VMware hosts, since attackers extracted the directory database and registry files from a virtual machine disk.","The article says vCenter’s built-in appliance firewall cannot restrict access by individual port, meaning access controls managed through that interface may not adequately protect port 2012 or separate management services.","vCenter 7.0, as well as presumed-affected 6.5 and 6.7 systems, present a particularly difficult risk because there is no public fix for vCenter 7.0 and network restriction is the main protection until an upgrade or supported fix is available."],"referencedReports":[{"title":"ARMORY CASTLE Exploits vSphere","url":"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere","publisher":"Google Threat Intelligence Group and Mandiant","context":"The article relies on this technical analysis for details of ARMORY CASTLE’s exploitation path, tools, persistence, indicators, and defensive recommendations.","category":"research","primary":true},{"title":"VMSA-2026-0009","url":"https://www.rapid7.com/blog/post/etr-cve-2026-123890-critical-authentication-bypass-vmware-vcenter/","publisher":"Broadcom","context":"The article identifies Broadcom’s advisory as the disclosure covering CVE-2026-123890 and the associated fixed versions.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog Entry for CVE-2026-123890","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-123890","publisher":"CISA","context":"The article cites CISA’s KEV catalog entry for the vulnerability’s active exploitation status and federal remediation deadline.","category":"advisory","primary":false}],"body":"\u003cp\u003eCVE-2026-123890 is a critical authentication bypass in VMware vCenter’s Directory Service that can allow a network-reachable attacker to obtain an \u003ccode\u003eadministrator@vsphere.local\u003c/code\u003e session without a password. Google Threat Intelligence Group and Mandiant reported that the suspected China-nexus group ARMORY CASTLE exploited the flaw as a zero-day from early September 2026. Broadcom released fixes on November 19, 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog with a November 23 deadline for U.S. federal agencies.\u003c/p\u003e\n\n\u003cp\u003eIn the investigated intrusion, attackers entered through a BeyondTrust Remote Support zero-day, moved through internal Linux appliances, and used a custom tool called BONESAW to take over vCenter through TCP port 2012. They copied vCenter’s directory database and SAML token-signing key, enabled SSH on the vCenter appliance, accessed ESXi hosts, and extracted Active Directory data from a virtual machine disk. The article stresses that patching is necessary but does not undo prior compromise, so affected organizations should hunt for unauthorized accounts and persistence, replace the SAML signing certificate, reset relevant vSphere and ESXi credentials, and consider Active Directory passwords exposed where domain-controller disks may have been accessed.\u003c/p\u003e\n"},{"n":1,"title":"WHMCS SQL Injection Could Expose Customer Data and Admin Password Hashes without Login","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/whmcs-sql-injection-flaw-could-expose.html","time":"08:34","priority":"SHOULD READ","score":88,"tldr":"WHMCS released fixes for three vulnerabilities, including an unauthenticated SQL injection (CVE-2026-82981) that could expose customer data and administrator password hashes from internet-accessible installations. Self-hosted users should upgrade immediately, while the email-campaign flaw also requires deleting existing campaigns and clearing the template cache.","briefOverview":"\u003cp\u003eWHMCS disclosed and fixed three vulnerabilities, including CVE-2026-82981, an SQL injection flaw in its shopping cart that requires no login. Anyone able to access the shopping cart of a vulnerable internet-facing installation could potentially retrieve customer records and administrator account data, including password hashes. WHMCS assigned the flaw a CVSS 4.0 score of 8.7 and said it had not reported attacks using any of the three issues.\u003c/p\u003e\n\n\u003cp\u003eFixed releases include WHMCS 9.0.10 and 8.13.8, while the advisory identifies version 9.1.2 as the fix for the 9.1 series. Installations running versions 8.0 through 8.12 must upgrade to a supported fixed release, and self-hosted administrators are responsible for installing updates; WHMCS Cloud is updated automatically. The other SQL injection, CVE-2026-82979, requires a logged-in client with the View \u0026amp; Manage Contacts permission and could expose other customers\u0026rsquo; personal, billing, and support information, as well as administrator records and password hashes.\u003c/p\u003e\n\n\u003cp\u003eThe third issue, CVE-2026-93700, affects email-campaign processing and could allow a logged-in client to read sensitive server configuration files, including database credentials, and run code on the server. It has a CVSS 3.1 score of 9.0, and its CVE record indicates some user interaction is required. In addition to updating, WHMCS tells administrators to delete every planned or ongoing email campaign and clear the template cache, though the advisory does not explain why existing campaigns must be removed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WHMCS disclosed CVE-2026-82981, an unauthenticated SQL injection flaw in its shopping cart that could expose customer records and administrator password hashes.","WHMCS released versions 9.0.10 and 8.13.8 to address the vulnerabilities, while the security advisory identifies version 9.1.2 as the fix for the 9.1 series.","A second SQL injection flaw, CVE-2026-82979, requires a logged-in client with View \u0026 Manage Contacts permission and could expose other customers' personal, billing, and support information.","CVE-2026-93700 affects email campaigns and could allow a logged-in client to read sensitive server configuration files, including database credentials, and run code on the server.","For CVE-2026-93700, WHMCS advises administrators to delete planned or active email campaigns, clear the template cache, and update to a fixed release."],"insights":["The most urgent flaw can be reached by anyone able to load the shopping cart on a vulnerable internet-facing WHMCS installation, because it does not require a login.","Although the affected administrator passwords are stored as hashes rather than usable passwords, the article notes that attackers could attempt to crack stolen hashes offline.","Organizations running WHMCS versions 8.0 through 8.12 cannot receive a direct fix and must upgrade to a supported release.","For the email-campaign flaw, applying the update alone is not the full vendor-recommended response: administrators are also told to delete all planned or ongoing campaigns and clear the template cache.","WHMCS Cloud installations are updated automatically, but administrators of self-hosted installations are responsible for deploying the fixes."],"referencedReports":[{"title":"CVE-2026-82981 WHMCS Security Update 2026-11-23","url":"https://help.whmcs.com/m/125386/l/2151347-cve-2026-82981-whmcs-security-update-2026-11-23","publisher":"whmcs","context":"The article cites this security advisory for the unauthenticated shopping-cart SQL injection and its fixed version for the 9.1 series.","category":"advisory","primary":true},{"title":"CVE-2026-82979 WHMCS Security Update 2026-11-23","url":"https://help.whmcs.com/m/125386/l/2151340-cve-2026-82979-whmcs-security-update-2026-11-23","publisher":"whmcs","context":"The article cites this advisory for the authenticated Client Area SQL injection affecting clients with the View \u0026 Manage Contacts permission.","category":"advisory","primary":true},{"title":"CVE-2026-93700 WHMCS Security Update 2026-11-23","url":"https://help.whmcs.com/m/125386/l/2151351-cve-2026-93700-whmcs-security-update-2026-11-23","publisher":"whmcs","context":"The article cites this advisory for the email-campaign flaw and its additional remediation steps.","category":"advisory","primary":true},{"title":"WHMCS Security Update May 12, 2026","url":"https://help.whmcs.com/m/125386/l/2073908","publisher":"whmcs","context":"The article references this May advisory as a prior 2026 WHMCS security fix for a Client Area authorization flaw.","category":"advisory","primary":false},{"title":"CVE-2026-67399 WHMCS Security Update 2026-09-03","url":"https://help.whmcs.com/m/125386/l/2118034-cve-2026-67399-whmcs-security-update-2026-09-03","publisher":"whmcs","context":"The article references this September advisory as a prior 2026 fix for an unauthenticated remote-code-execution flaw.","category":"advisory","primary":false}],"body":"\u003cp\u003eWHMCS disclosed and fixed three vulnerabilities, including CVE-2026-82981, an SQL injection flaw in its shopping cart that requires no login. Anyone able to access the shopping cart of a vulnerable internet-facing installation could potentially retrieve customer records and administrator account data, including password hashes. WHMCS assigned the flaw a CVSS 4.0 score of 8.7 and said it had not reported attacks using any of the three issues.\u003c/p\u003e\n\n\u003cp\u003eFixed releases include WHMCS 9.0.10 and 8.13.8, while the advisory identifies version 9.1.2 as the fix for the 9.1 series. Installations running versions 8.0 through 8.12 must upgrade to a supported fixed release, and self-hosted administrators are responsible for installing updates; WHMCS Cloud is updated automatically. The other SQL injection, CVE-2026-82979, requires a logged-in client with the View \u0026amp; Manage Contacts permission and could expose other customers\u0026rsquo; personal, billing, and support information, as well as administrator records and password hashes.\u003c/p\u003e\n\n\u003cp\u003eThe third issue, CVE-2026-93700, affects email-campaign processing and could allow a logged-in client to read sensitive server configuration files, including database credentials, and run code on the server. It has a CVSS 3.1 score of 9.0, and its CVE record indicates some user interaction is required. In addition to updating, WHMCS tells administrators to delete every planned or ongoing email campaign and clear the template cache, though the advisory does not explain why existing campaigns must be removed.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft Fixes Azure API Management Classic Flaw as Actor Targets Customer Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/microsoft-fixes-azure-api-management.html","time":"10:44","priority":"SHOULD READ","score":86,"tldr":"Microsoft closed a flaw in Azure API Management Classic that may have exposed stored secrets, subscription keys, and management tokens from improperly configured instances. Norwegian authorities say an unknown actor actively sought these credentials, prompting affected customers to identify and rotate secrets.","briefOverview":"\u003cp\u003eMicrosoft fixed a security issue in Azure API Management (APIM) Classic tiers that could have allowed unauthorized access to certain management functions. The company identified the issue on November 18, 2026, and closed the access path the following day. APIM v2 tiers were not affected. Microsoft said customers were exposed if their services were not configured according to documented security best practices.\u003c/p\u003e\n\n\u003cp\u003eNorway’s National Security Authority (NSM) said an unknown actor had actively searched APIM for access tokens, secrets, and named values. NSM said the issue affected multiple Norwegian organizations, including energy companies Equinor and Skagerak Energi, as well as entities outside Norway, but it had not seen evidence of impact on Norwegian businesses. Microsoft said an unauthorized party could have accessed stored secrets before the issue was fixed.\u003c/p\u003e\n\n\u003cp\u003ePotentially exposed information includes Named Values secrets, client secrets for identity and OpenID Connect providers, subscription keys, and tokens used to call direct management APIs. Microsoft issued guidance on November 21, 2026, to help customers identify and rotate secrets and credentials configured in APIM. A researcher noted that a taken credential could be used against the protected service directly, depending on its permissions and whether it remains valid.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft identified and closed an access path affecting Azure API Management Classic tiers on November 19, 2026, while version 2 tiers were not affected.","The issue could have allowed unauthorized access to management functions and secrets in Classic instances that were not configured according to Microsoft’s documented security best practices.","Norway’s National Security Authority said an unknown actor was actively looking for access tokens, secrets, and named values in Azure API Management.","Potentially exposed information included named-value secrets, identity-provider and OpenID Connect client secrets, subscription keys, and tokens for direct management APIs.","Microsoft published guidance on November 21, 2026, to help customers identify and rotate credentials configured in their Azure API Management instances."],"insights":["The risk extends beyond Azure API Management itself because any credential taken from its configuration could be used directly against the separate service it protects, depending on that credential’s permissions and validity.","Microsoft’s remediation closed the access path, but customers may still need to rotate previously stored secrets because exposure could have occurred before the issue was identified.","The issue was limited to Azure API Management Classic tiers, while v2-tier instances were not affected.","Although an unknown actor was actively seeking credentials and multiple Norwegian sectors were affected by the issue, Norway’s National Security Authority said it had not seen evidence of impact on Norwegian businesses."],"referencedReports":[{"title":"NSM deler tiltak mot sårbarhet i Azure API Management","url":"https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management","publisher":"norway-national-security-authority","context":"NSM disclosed the Azure API Management issue, stated that an unknown actor was seeking credentials, and shared mitigation measures.","category":"advisory","primary":true},{"title":"Rotating credentials in Azure API Management","url":"https://techcommunity.microsoft.com/blog/integrationsonazureblog/rotating-credentials-in-azure-api-management/4575478","publisher":"microsoft","context":"Microsoft published guidance to help customers identify and rotate secrets and credentials in affected Azure API Management instances.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft fixed a security issue in Azure API Management (APIM) Classic tiers that could have allowed unauthorized access to certain management functions. The company identified the issue on November 18, 2026, and closed the access path the following day. APIM v2 tiers were not affected. Microsoft said customers were exposed if their services were not configured according to documented security best practices.\u003c/p\u003e\n\n\u003cp\u003eNorway’s National Security Authority (NSM) said an unknown actor had actively searched APIM for access tokens, secrets, and named values. NSM said the issue affected multiple Norwegian organizations, including energy companies Equinor and Skagerak Energi, as well as entities outside Norway, but it had not seen evidence of impact on Norwegian businesses. Microsoft said an unauthorized party could have accessed stored secrets before the issue was fixed.\u003c/p\u003e\n\n\u003cp\u003ePotentially exposed information includes Named Values secrets, client secrets for identity and OpenID Connect providers, subscription keys, and tokens used to call direct management APIs. Microsoft issued guidance on November 21, 2026, to help customers identify and rotate secrets and credentials configured in APIM. A researcher noted that a taken credential could be used against the protected service directly, depending on its permissions and whether it remains valid.\u003c/p\u003e\n"},{"n":4,"title":"Health-ISAC Daily Cyber Headlines – November 24, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-24-2026/","time":"07:33","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s daily roundup highlights threats relevant to healthcare defenders, including Ghostscript sandbox-escape RCE, ClickFix lures, covert SoftEther VPN access, emerging extortion activity, and a Prism Medical Products breach affecting 1.3 million people.","briefOverview":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 24, 2026 compiles open-source reporting for health sector defenders. The roundup covers a Ghostscript sandbox escape, a Prism Medical Products data breach, covert access through modified SoftEther VPN software, ClickFix traps, healthcare AI oversight, and ransomware recovery fraud. Health-ISAC states that its Threat Operations Center produces the daily briefing every weekday to provide rapid, actionable threat intelligence.\u003c/p\u003e\n\n\u003cp\u003eHighlighted items include reporting that a single compromised WordPress site hosted 13 ClickFix traps and that researchers demonstrated Ghostscript remote code execution through crafted file uploads in popular applications. The article also links to reporting that Prism Medical Products’ breach affected 1.3 million individuals and that the Inception extortion group, possibly a ShinyHunters reboot, claimed seven victims in one week. Additional linked coverage addresses suspected Webworm modification of SoftEther VPN to hide remote access and the difference between physician AI use and patient preference for human oversight of clinical decisions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 24, 2026 daily headlines cover Ghostscript sandbox escape, a Prism Medical Products data breach, covert VPN access, ClickFix traps, healthcare AI governance, and ransomware recovery fraud.","The roundup links to reporting that Prism Medical Products’ data breach affects 1.3 million individuals.","The article includes reporting on researchers demonstrating remote code execution through a Ghostscript sandbox escape using crafted file uploads in popular applications.","The roundup links to a report that the Inception extortion group, possibly a ShinyHunters reboot, claimed seven victims in one week.","Health-ISAC states that its Threat Operations Center produces Daily Cyber Headlines every weekday for health sector defenders."],"insights":["A single compromised WordPress site was reportedly used to host 13 separate ClickFix traps, indicating that one compromised web property can expose visitors to multiple deceptive prompts.","The roundup pairs a reported breach affecting 1.3 million individuals with several technical intrusion methods, underscoring that the daily briefing covers both large-scale personal-data exposure and routes attackers may use to gain access.","The Inception group’s claimed seven victims in one week is notable because the report raises the possibility that it is a reboot of ShinyHunters rather than an entirely new operation.","The included healthcare AI item highlights a gap between physician use of AI and patient preference for a human to make the final clinical decision.","The linked report on fake recovery firms is notable because it connects organizations that promise ransomware recovery with ransomware operators themselves."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 24, 2026 compiles open-source reporting for health sector defenders. The roundup covers a Ghostscript sandbox escape, a Prism Medical Products data breach, covert access through modified SoftEther VPN software, ClickFix traps, healthcare AI oversight, and ransomware recovery fraud. Health-ISAC states that its Threat Operations Center produces the daily briefing every weekday to provide rapid, actionable threat intelligence.\u003c/p\u003e\n\n\u003cp\u003eHighlighted items include reporting that a single compromised WordPress site hosted 13 ClickFix traps and that researchers demonstrated Ghostscript remote code execution through crafted file uploads in popular applications. The article also links to reporting that Prism Medical Products’ breach affected 1.3 million individuals and that the Inception extortion group, possibly a ShinyHunters reboot, claimed seven victims in one week. Additional linked coverage addresses suspected Webworm modification of SoftEther VPN to hide remote access and the difference between physician AI use and patient preference for human oversight of clinical decisions.\u003c/p\u003e\n"}]</script>
