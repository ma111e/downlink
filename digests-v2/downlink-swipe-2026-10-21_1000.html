<script type="application/json" id="dl-articles">[{"n":2,"title":"LiteLLM compromised again: infostealer and RAT found in version 1.107.0","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/litellm-compromised-infostealer-rat","time":"13:05","priority":"MUST READ","score":98,"tldr":"LiteLLM version 1.107.0 and its corresponding Docker images were compromised to install an infostealer and persistent Python RAT that can steal credentials and execute attacker commands. Anyone who installed or ran the affected release should treat secrets as exposed, investigate affected hosts, and rotate credentials immediately.","briefOverview":"\u003cp\u003eLiteLLM version 1.107.0 was compromised after malicious code was inserted into Python wheels published on PyPI, and the official \u003ccode\u003elitellm/litellm:1.107.0\u003c/code\u003e Docker image was also affected. The article says users who installed that version on any platform, or ran the affected Docker image through versioned or moving tags, should assume credentials may be compromised. PyPI quarantined the package version, but the article states that the compromised Docker image remained available on Docker Hub.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used a \u003ccode\u003ematurin\u003c/code\u003e build configuration directive to add files from a \u003ccode\u003ecook/\u003c/code\u003e directory that was absent from the source tarball and GitHub repository. A \u003ccode\u003e.pth\u003c/code\u003e file caused a credential-stealing script to run at Python startup, while \u003ccode\u003esitecustomize.py\u003c/code\u003e started a background process that checked hourly for and ran attacker-provided Python code. The infostealer collected browser passwords, private keys, cloud and developer credentials, environment variables, and LiteLLM database data, then sent it to an attacker-controlled domain. The article identifies \u003ccode\u003e/tmp/.pc_once_72129118c59f5636c0bb\u003c/code\u003e and \u003ccode\u003e/tmp/remote_code_loader.lock\u003c/code\u003e as signs that the credential theft or remote-command component ran.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LiteLLM version 1.107.0 was compromised through malicious code injected into Python wheels published on PyPI, and its official Docker image for the same version was also affected.","The malicious package installed files that automatically ran whenever Python started, including an infostealer that collected credentials and secrets and a background program that could execute attacker-provided code.","The infostealer collected browser passwords, SSH keys, cloud credentials, environment variables, LiteLLM database contents, and other developer and CI/CD secrets, then sent the data to an attacker-controlled website.","The remote-access component checked every hour for code supplied by the attacker and ran it with the permissions of the affected Python process.","PyPI quarantined LiteLLM 1.107.0, but the article states that the compromised litellm/litellm:1.107.0 Docker image remained available on Docker Hub."],"insights":["The malicious files were added during the wheel-building process through a maturin configuration directive, so the source tarball and GitHub repository did not contain the injected directory or its contents.","A 12-byte .pth file caused the infostealer to run automatically whenever Python started, meaning execution did not require a user to import LiteLLM after installation.","The affected Docker exposure extended beyond the explicitly versioned image because the article says the latest, main-latest, and main-stable tags could also pull the compromised image.","The presence of /tmp/.pc_once_72129118c59f5636c0bb indicates the credential-stealing routine has already run, while /tmp/remote_code_loader.lock indicates the remote-command daemon ran or may still be active.","The infostealer attempted to obtain credentials available directly from cloud instances by querying AWS, GCP, and Azure metadata endpoints, in addition to reading credential files from disk."],"referencedReports":[],"body":"\u003cp\u003eLiteLLM version 1.107.0 was compromised after malicious code was inserted into Python wheels published on PyPI, and the official \u003ccode\u003elitellm/litellm:1.107.0\u003c/code\u003e Docker image was also affected. The article says users who installed that version on any platform, or ran the affected Docker image through versioned or moving tags, should assume credentials may be compromised. PyPI quarantined the package version, but the article states that the compromised Docker image remained available on Docker Hub.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used a \u003ccode\u003ematurin\u003c/code\u003e build configuration directive to add files from a \u003ccode\u003ecook/\u003c/code\u003e directory that was absent from the source tarball and GitHub repository. A \u003ccode\u003e.pth\u003c/code\u003e file caused a credential-stealing script to run at Python startup, while \u003ccode\u003esitecustomize.py\u003c/code\u003e started a background process that checked hourly for and ran attacker-provided Python code. The infostealer collected browser passwords, private keys, cloud and developer credentials, environment variables, and LiteLLM database data, then sent it to an attacker-controlled domain. The article identifies \u003ccode\u003e/tmp/.pc_once_72129118c59f5636c0bb\u003c/code\u003e and \u003ccode\u003e/tmp/remote_code_loader.lock\u003c/code\u003e as signs that the credential theft or remote-command component ran.\u003c/p\u003e\n"},{"n":4,"title":"Cloudflare deploys protections against php2shell vulnerability","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/php-vulnerabilities-waf-protection/","time":"13:56","priority":"MUST READ","score":96,"tldr":"Cloudflare automatically deployed WAF protections for all customers against the critical php2shell flaws (CVE-2026-109618 and CVE-2026-109619), which can enable PHP denial of service, data exposure, or remote code execution. Organizations should still urgently patch their PHP runtime and keep WAF protections enabled.","briefOverview":"\u003cp\u003eCloudflare reported that php2shell, comprising CVE-2026-109618 and CVE-2026-109619, affects web servers running PHP 5.4 or later. The flaws can be triggered through specially crafted HTTP traffic and may cause service disruption, data exposure, or remote code execution. Cloudflare deployed WAF protections roughly nine hours before public disclosure, and customers using its free or paid WAF were protected by default beginning October 21 at 3:02 am UTC.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities stem from unsafe handling of memory after PHP runs out of memory or encounters a fatal error during request processing. In one case, PHP may use internal data that was not fully initialized; in the other, a later request handled by the same PHP process may access memory released after an earlier request. Cloudflare said it observed attack traffic after the vulnerability leaked and introduced full transaction detection, which uses both request and origin-response signals to identify high-confidence exploit attempts and block matching responses. Administrators should apply PHP\u0026rsquo;s vendor update while keeping WAF protections enabled, because changes to application code or plugins alone do not remediate flaws in the PHP runtime.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The php2shell vulnerabilities, CVE-2026-109618 and CVE-2026-109619, affect PHP 5.4 and later and may allow denial of service, remote code execution, or data exposure through specially crafted HTTP traffic.","Cloudflare deployed WAF protections about nine hours before public disclosure, and customers using its free or paid WAF were protected by default beginning October 21 at 3:02 am UTC.","Cloudflare observed attack traffic targeting customers after the vulnerability leaked and saw attackers modify payloads in attempts to bypass protections.","Cloudflare introduced full transaction detection, which evaluates request and response signals from the same HTTP transaction and can block a matching origin response before it reaches the requester.","Cloudflare recommends that administrators apply the PHP vendor update while keeping WAF protections enabled, because updating application code or plugins alone does not fix the PHP runtime flaws."],"insights":["One of the flaws can leave outdated memory references after a fatal error, allowing a later request handled by the same PHP process to access memory that should no longer be available.","Cloudflare states that request data alone was not always sufficient to reliably distinguish an exploit from legitimate traffic, so its new detection method also evaluates the website’s response before blocking it from reaching the requester.","The vulnerability was leaked before its planned public release, and Cloudflare observed attackers altering their request patterns in attempts to evade protections.","Cloudflare’s protections were deployed automatically even for free-plan WAF users, but the article emphasizes that these controls are only an additional safeguard and do not replace updating PHP."],"referencedReports":[{"title":"PHP security advisory for CVE-2026-109618 and CVE-2026-109619","url":"https://www.php.net/archive/2026.php#2026-10-21-5","publisher":"php","context":"The article directs administrators to the PHP advisory for affected versions and remediation instructions.","category":"advisory","primary":true}],"body":"\u003cp\u003eCloudflare reported that php2shell, comprising CVE-2026-109618 and CVE-2026-109619, affects web servers running PHP 5.4 or later. The flaws can be triggered through specially crafted HTTP traffic and may cause service disruption, data exposure, or remote code execution. Cloudflare deployed WAF protections roughly nine hours before public disclosure, and customers using its free or paid WAF were protected by default beginning October 21 at 3:02 am UTC.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities stem from unsafe handling of memory after PHP runs out of memory or encounters a fatal error during request processing. In one case, PHP may use internal data that was not fully initialized; in the other, a later request handled by the same PHP process may access memory released after an earlier request. Cloudflare said it observed attack traffic after the vulnerability leaked and introduced full transaction detection, which uses both request and origin-response signals to identify high-confidence exploit attempts and block matching responses. Administrators should apply PHP\u0026rsquo;s vendor update while keeping WAF protections enabled, because changes to application code or plugins alone do not remediate flaws in the PHP runtime.\u003c/p\u003e\n"},{"n":1,"title":"The Hover Check Passed: Every Link Went to the Real Vendor","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/vendor-bank-change-hover-check-passed-every-link-genuine-lookalike-sender","time":"11:00","priority":"MAY READ","score":70,"tldr":"A vendor bank-change BEC email used a newly registered lookalike domain while embedding genuine vendor website and email links, so hover checks and URL scans appeared clean. The fraud was exposed by sender-domain scrutiny and contradictory, recently edited PDF metadata rather than any malicious link or payload.","briefOverview":"\u003cp\u003eA diversified holding company received a vendor bank-change request from mackaycomm[.]com, a lookalike domain registered 28 days before the email. The sender claimed that the vendor and its sister business had consolidated payments into a new bank account and attached supporting PDFs. Although the signature displayed the lookalike domain, its website links led to the real vendor site and its email link opened a message addressed to a real vendor employee.\u003c/p\u003e\n\n\u003cp\u003eBecause the links pointed to genuine destinations, URL scanners marked them clean, and neither PDF contained scripts, launch actions, embedded files, or link objects. The attached Chase letter displayed a 2026 date but had a 2025 source creation date and was modified on the send morning, while the second PDF was a 2019 scan edited on the same morning. The documents also conflicted on the bank branch, the signer’s job title, and phone information.\u003c/p\u003e\n\n\u003cp\u003eThe lookalike domain authenticated successfully as itself with SPF and DKIM, while recipient-side authentication failures were attributed to the victim’s gateway rather than message tampering. A human analyst classified the message as malicious and removed all four copies from mailboxes, but a later automated re-analysis labeled it safe based on the clean genuine-site links. The article emphasizes checking sender and CC domains, comparing document metadata and printed dates, and confirming unexpected bank changes through an existing vendor contact.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A bank-change email came from mackaycomm[.]com, a lookalike domain registered 28 days before the message, rather than the genuine vendor’s domain.","The email’s signature links and email address visibly used the lookalike domain but directed recipients to the genuine vendor’s website and a real vendor employee, causing link scans to return clean results.","A JPMorgan Chase confirmation letter attached to the email displayed a 2026 date but had a 2025 source creation date and was modified on the morning the message was sent.","The two attached PDFs disagreed about the bank branch, the signer’s job title, and phone details, and the vendor-letterhead document was originally scanned in 2019 before being edited on the send date.","A human analyst classified the message as malicious and removed all four copies from recipient mailboxes, while a later automated re-analysis labeled it safe based on the clean links."],"insights":["A clean link scan can be accurate yet still provide no protection when an attacker uses genuine destinations in a copied email signature.","The lookalike sender domain passed SPF and DKIM as itself, showing that successful email authentication does not establish that a sender is the legitimate vendor being impersonated.","Comparing PDF metadata with printed dates and email timing exposed evidence of same-day document alteration that link and attachment-payload checks could not detect.","Cross-checking details between supposedly supporting documents revealed contradictions in the bank branch, job title, and phone region, making the documents more revealing together than individually.","Calling a vendor contact already on file to verify an unexpected bank-account change is necessary because the fraudulent request can contain no malicious URL, file behavior, or obvious technical indicator."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites this report for its finding that the human element was involved in 62% of breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites this guidance when recommending that unexpected bank-account changes be confirmed through a contact already on file.","category":"guide","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references this report to note that business email compromise payment requests are effective enough to warrant FBI IC3 reporting.","category":"research","primary":false}],"body":"\u003cp\u003eA diversified holding company received a vendor bank-change request from mackaycomm[.]com, a lookalike domain registered 28 days before the email. The sender claimed that the vendor and its sister business had consolidated payments into a new bank account and attached supporting PDFs. Although the signature displayed the lookalike domain, its website links led to the real vendor site and its email link opened a message addressed to a real vendor employee.\u003c/p\u003e\n\n\u003cp\u003eBecause the links pointed to genuine destinations, URL scanners marked them clean, and neither PDF contained scripts, launch actions, embedded files, or link objects. The attached Chase letter displayed a 2026 date but had a 2025 source creation date and was modified on the send morning, while the second PDF was a 2019 scan edited on the same morning. The documents also conflicted on the bank branch, the signer’s job title, and phone information.\u003c/p\u003e\n\n\u003cp\u003eThe lookalike domain authenticated successfully as itself with SPF and DKIM, while recipient-side authentication failures were attributed to the victim’s gateway rather than message tampering. A human analyst classified the message as malicious and removed all four copies from mailboxes, but a later automated re-analysis labeled it safe based on the clean genuine-site links. The article emphasizes checking sender and CC domains, comparing document metadata and printed dates, and confirming unexpected bank changes through an existing vendor contact.\u003c/p\u003e\n"},{"n":5,"title":"php2shell: Zeek and Suricata Detections for PHP RCE | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/php2shell-detection-before-disclosure","time":"13:48","priority":"MAY READ","score":55,"tldr":"Corelight’s php2shell research provides Zeek and Suricata detections for identifying PHP remote-code-execution activity, including exploitation patterns associated with PHP-CGI flaws such as CVE-2024-4577.","briefOverview":"\u003cp\u003eThe article is titled “php2shell: Zeek and Suricata Detections for PHP RCE” and is attributed to Corelight. Its stated subject is detection coverage involving Zeek, Suricata, and PHP remote code execution. The title indicates that the material concerns identifying PHP-related remote command-execution activity.\u003c/p\u003e\n\n\u003cp\u003eThe supplied article body is not readable as normal prose and consists largely of corrupted or encoded characters. As a result, it does not provide verifiable technical details, affected organizations, detection logic, or impact information beyond the title. No additional claims can be reliably summarized from the provided content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “php2shell: Zeek and Suricata Detections for PHP RCE.”","The article concerns detections for Zeek and Suricata.","The article focuses on PHP remote code execution, meaning the ability to run commands on a PHP system remotely.","Corelight is identified as the publisher of the article."],"insights":["The article presents detection coverage for two widely used network-monitoring tools, Zeek and Suricata, rather than limiting the material to one platform.","Its focus is on PHP remote code execution, a particularly consequential scenario because it concerns unauthorized remote command execution on PHP systems."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “php2shell: Zeek and Suricata Detections for PHP RCE” and is attributed to Corelight. Its stated subject is detection coverage involving Zeek, Suricata, and PHP remote code execution. The title indicates that the material concerns identifying PHP-related remote command-execution activity.\u003c/p\u003e\n\n\u003cp\u003eThe supplied article body is not readable as normal prose and consists largely of corrupted or encoded characters. As a result, it does not provide verifiable technical details, affected organizations, detection logic, or impact information beyond the title. No additional claims can be reliably summarized from the provided content.\u003c/p\u003e\n"},{"n":3,"title":"How Tenable brought multi-language support to security detectors with agentic translation","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/how-tenable-brought-multi-language-support-to-security-detectors-with-agentic-translation","time":"13:00","priority":"MAY READ","score":48,"tldr":"Tenable replaced its costly translate-then-detect workflow with a multilingual security detection model trained using an agentic, label-preserving translation pipeline. The resulting Tenable One AI Exposure detectors support 10 validated languages with substantially lower latency and cost while matching or improving detection quality.","briefOverview":"\u003cp\u003eTenable redesigned its AI security detection workflow to support threats and harmful content written in 10 validated languages, rather than translating each non-English request into English before evaluating it. The previous translate-then-detect approach added latency, recurring translation costs, operational overhead, and risk that a translation could obscure security-relevant meaning. The new approach uses one multilingual model that detects threats directly in English, Spanish, German, French, Italian, Portuguese, Mandarin Chinese, Japanese, Arabic, and Hindi.\u003c/p\u003e\n\n\u003cp\u003eTo create reliable multilingual training and test data, Tenable built an agentic translation pipeline that supplies the task, data label, and target language to a frontier model, then has independent judges check fluency, meaning, and label preservation. Translations that fail are refined, while sensitive items refused by the frontier model are handled by a controlled open-source model and subjected to the same quality gate. Tenable reports that the native model runs in tens of milliseconds, is roughly 20–800 times faster per item than its former process, uses under 1 GB of memory rather than 12–14 GB, and matched or exceeded translate-then-detect performance in the evaluations described.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tenable replaced its translate-then-detect approach with a single multilingual model that natively detects AI threats, harmful content, and policy risks in 10 validated languages.","The company used an agentic translation pipeline in which a frontier LLM creates label-aware translations, independent judges assess fluency and meaning preservation, and failed items are refined or handled by a controlled open-source model after refusals.","Tenable reports that native multilingual detection operates in tens of milliseconds, is roughly 20 to 800 times faster per item than the prior translation-based process, and uses less than 1 GB of memory versus 12 to 14 GB.","The multilingual model matched or exceeded translate-then-detect AI-threat detection on 9 of 10 languages and overall, and led on every language for the harmful-content detection evaluation described in the article.","Tenable states that its model may read and flag attacks in thousands of languages beyond the 10 it formally validated, but says that broader capability requires further testing before it can be relied upon."],"insights":["Translation quality for security data depends on preserving the original safety label, because a translation can soften malicious intent or change a dangerous request into something that appears benign.","Tenable found that multilingual pretraining allowed it to test whether English-only training generalized to other languages before paying to create translated data, and to translate only for languages where performance lagged.","The pipeline addresses a data-coverage problem caused by AI refusals: when a frontier model declines to translate sensitive material, a controlled open-source model handles the item and its result still must pass the same quality checks.","Creating multilingual training and benchmark data was a one-time expense of under $10,000 according to Tenable, unlike a production translation service whose cost grows with each customer request."],"referencedReports":[],"body":"\u003cp\u003eTenable redesigned its AI security detection workflow to support threats and harmful content written in 10 validated languages, rather than translating each non-English request into English before evaluating it. The previous translate-then-detect approach added latency, recurring translation costs, operational overhead, and risk that a translation could obscure security-relevant meaning. The new approach uses one multilingual model that detects threats directly in English, Spanish, German, French, Italian, Portuguese, Mandarin Chinese, Japanese, Arabic, and Hindi.\u003c/p\u003e\n\n\u003cp\u003eTo create reliable multilingual training and test data, Tenable built an agentic translation pipeline that supplies the task, data label, and target language to a frontier model, then has independent judges check fluency, meaning, and label preservation. Translations that fail are refined, while sensitive items refused by the frontier model are handled by a controlled open-source model and subjected to the same quality gate. Tenable reports that the native model runs in tens of milliseconds, is roughly 20–800 times faster per item than its former process, uses under 1 GB of memory rather than 12–14 GB, and matched or exceeded translate-then-detect performance in the evaluations described.\u003c/p\u003e\n"}]</script>
