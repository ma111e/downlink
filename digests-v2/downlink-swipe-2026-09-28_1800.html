<script type="application/json" id="dl-articles">[{"n":5,"title":"ShinyHunters exploiting workarounds for Oracle PeopleSoft bug, Mandiant warns","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/shinyhunters-cyberattacks-oracle-mandiant","time":"19:30","priority":"MUST READ","score":95,"tldr":"Mandiant warns that ShinyHunters has resumed exploiting Oracle PeopleSoft CVE-2026-35273, specifically targeting organizations that used workarounds instead of installing Oracle’s patch. The group has compromised dozens of systems globally, deploying web shells and stealing data for extortion.","briefOverview":"\u003cp\u003eMandiant warned that ShinyHunters has resumed exploiting CVE-2026-35273, an Oracle PeopleSoft vulnerability that the group previously used as a zero-day against academic institutions between May 27 and June 9. Oracle released a patch on June 10, but Mandiant said the renewed campaign targets organizations that implemented workarounds rather than applying the patch. PeopleSoft is widely used by government, education, and healthcare organizations for functions including invoices, projects, staffing, payroll, and student records.\u003c/p\u003e\n\n\u003cp\u003eMandiant said ShinyHunters deployed web shells on dozens of systems worldwide across higher education, technology, IT services, healthcare, agriculture, transportation, and government. In analyzed compromises, the group gained full control of an operating system or accessed PeopleSoft configuration files, database connection strings, and application data. Mandiant urged organizations to review database logs for queries involving human-resources, payroll, and student-record tables and to prepare for extortion demands or public exposure of stolen data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mandiant warned that ShinyHunters resumed exploiting Oracle PeopleSoft CVE-2026-35273 by targeting organizations that applied workarounds but did not install Oracle’s June 10 patch.","Mandiant said the group deployed web shells on dozens of systems globally across higher education, technology, IT services, healthcare, agriculture, transportation, and government.","In compromised PeopleSoft systems, ShinyHunters obtained full operating-system control or accessed configuration files, database connection strings, and application data.","ShinyHunters claimed it breached an FBI jobs website through an Oracle PeopleSoft vulnerability and allegedly stole sensitive FBI data, while FBI officials said they were operating under the premise that employee personal information was also being taken.","Mandiant advised PeopleSoft users to review database logs for queries involving human-resources, payroll, and student-record tables and prepare for potential extortion demands."],"insights":["Published workarounds were not sufficient against the renewed campaign: Mandiant said ShinyHunters adapted its approach to target organizations that used them without applying Oracle’s patch.","The compromise can extend beyond the PeopleSoft application itself, because Mandiant observed attackers obtaining either full control of the underlying operating system or access to database connection details and application data.","Mandiant’s recommendation to inspect queries involving human-resources, payroll, and student-record tables indicates that the most sensitive data may be identifiable through database activity logs.","Organizations affected by the campaign should prepare not only for technical remediation but also for extortion messages and possible public release of stolen information, based on ShinyHunters’ established data-theft pattern."],"referencedReports":[{"title":"ShinyHunters’ Renewed Mass Exploitation Campaign Targeting Oracle PeopleSoft","url":"https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft","publisher":"mandiant","context":"The article relies on Mandiant’s analysis warning that ShinyHunters resumed exploiting CVE-2026-35273 against organizations that used workarounds without patching.","category":"research","primary":true},{"title":"Oracle Security Alert for CVE-2026-35273","url":"https://www.oracle.com/security-alerts/alert-cve-2026-35273.html","publisher":"oracle","context":"The article cites Oracle’s security alert announcing the patch for the PeopleSoft vulnerability on June 10.","category":"advisory","primary":false}],"body":"\u003cp\u003eMandiant warned that ShinyHunters has resumed exploiting CVE-2026-35273, an Oracle PeopleSoft vulnerability that the group previously used as a zero-day against academic institutions between May 27 and June 9. Oracle released a patch on June 10, but Mandiant said the renewed campaign targets organizations that implemented workarounds rather than applying the patch. PeopleSoft is widely used by government, education, and healthcare organizations for functions including invoices, projects, staffing, payroll, and student records.\u003c/p\u003e\n\n\u003cp\u003eMandiant said ShinyHunters deployed web shells on dozens of systems worldwide across higher education, technology, IT services, healthcare, agriculture, transportation, and government. In analyzed compromises, the group gained full control of an operating system or accessed PeopleSoft configuration files, database connection strings, and application data. Mandiant urged organizations to review database logs for queries involving human-resources, payroll, and student-record tables and to prepare for extortion demands or public exposure of stolen data.\u003c/p\u003e\n"},{"n":8,"title":"Apple Patches CoreGraphics Flaw Possibly Exploited in Targeted Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/apple-patches-coregraphics-flaw.html","time":"19:18","priority":"MUST READ","score":93,"tldr":"Apple patched CVE-2026-86950, a CoreGraphics out-of-bounds write flaw that may have been used in highly sophisticated targeted attacks to execute arbitrary code on older iOS, iPadOS, and macOS versions. Users should update to iOS/iPadOS 26.7.1 or macOS Tahoe 26.7.1 and Sequoia 15.8.1.","briefOverview":"\u003cp\u003eApple released security updates for older versions of iOS, iPadOS, and macOS to fix CVE-2026-86950, a CoreGraphics flaw. The issue is an out-of-bounds write that could allow arbitrary code execution when a device processes a maliciously crafted file. Apple said it fixed the problem through improved bounds checking and credited Meta Product Security with reporting it.\u003c/p\u003e\n\n\u003cp\u003eApple is aware of a report that the issue may have been used in an extremely sophisticated attack against specifically targeted individuals using iOS versions before iOS 27. The company did not disclose how many people were targeted, whether any exploitation attempts succeeded, or when exploitation was first observed. Fixes are available in iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, and macOS Sequoia 15.8.1 for the listed supported devices and systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apple released security updates for older iOS, iPadOS, and macOS versions to address CVE-2026-86950 in CoreGraphics.","CVE-2026-86950 is an out-of-bounds write that could enable arbitrary code execution when a device processes a maliciously crafted file.","Apple said the flaw may have been exploited in an extremely sophisticated attack against specific targeted individuals on iOS versions before iOS 27.","The issue was fixed through improved bounds checking and was discovered and reported by Meta Product Security.","Apple addressed the flaw in iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, and macOS Sequoia 15.8.1."],"insights":["Apple disclosed only that the suspected real-world use involved iOS versions before iOS 27, even though it issued fixes for iOS, iPadOS, and two macOS release lines.","The company did not disclose how many people were targeted, whether any attempts succeeded, or when exploitation first occurred, leaving the known scope of the activity unclear.","The flaw can be triggered by processing a specially crafted file, making timely installation of the listed operating-system updates the direct mitigation described in the article.","Meta Product Security, rather than Apple, discovered and reported the CoreGraphics issue."],"referencedReports":[],"body":"\u003cp\u003eApple released security updates for older versions of iOS, iPadOS, and macOS to fix CVE-2026-86950, a CoreGraphics flaw. The issue is an out-of-bounds write that could allow arbitrary code execution when a device processes a maliciously crafted file. Apple said it fixed the problem through improved bounds checking and credited Meta Product Security with reporting it.\u003c/p\u003e\n\n\u003cp\u003eApple is aware of a report that the issue may have been used in an extremely sophisticated attack against specifically targeted individuals using iOS versions before iOS 27. The company did not disclose how many people were targeted, whether any exploitation attempts succeeded, or when exploitation was first observed. Fixes are available in iOS and iPadOS 26.7.1, macOS Tahoe 26.7.1, and macOS Sequoia 15.8.1 for the listed supported devices and systems.\u003c/p\u003e\n"},{"n":1,"title":"Over 16,000 Supabase databases expose PII, passwords, auth tokens","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/misconfigured-supabase-apps-expose-data-in-over-16-000-databases/","time":"18:50","priority":"SHOULD READ","score":84,"tldr":"UpGuard found more than 16,000 misconfigured Supabase databases exposing readable data, including PII, passwords, and authentication tokens, primarily because of weak or missing row-level security and misuse of public keys. The exposures affected organizations worldwide and may be worsened by AI-assisted app development without adequate security review.","briefOverview":"\u003cp\u003eUpGuard researchers found more than 16,000 misconfigured Supabase databases with readable tables exposing personally identifiable information, passwords, or authentication tokens. The researchers examined around 300,000 domains showing signs of Supabase use and checked for accessible user-related tables and schemas. More than half of the exposed databases contained personally identifiable information, while a smaller subset included passwords and authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eThe reported cases included a U.S. valet service with more than 100,000 exposed customer records, a Canadian immigration service with nearly 5,000 user records and 884 plaintext passwords, and an India-based adult creator platform with identity data, payment accounts, and over 100,000 private messages. UpGuard also cited an OTP service in the Philippines exposing user and SMS data and an African government consulate exposing records for 25,000 people, including emergency housing locations. The researchers attributed the exposures to poor application security configuration, including missing or ineffective row-level security policies and misuse of public keys, and encouraged Supabase users to review the platform\u0026rsquo;s security documentation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["UpGuard researchers found more than 16,000 misconfigured Supabase databases with publicly readable tables exposing personally identifiable information, passwords, or authentication tokens.","The researchers analyzed roughly 300,000 domains that appeared to use Supabase and used accessible table schemas to infer the kinds of data exposed.","More than half of the exposed databases contained personally identifiable information, while smaller subsets included passwords and authentication tokens.","Examples included a U.S. valet service exposing over 100,000 customer records and a Canadian immigration service exposing nearly 5,000 user records, including 884 plaintext passwords.","UpGuard attributed the exposures to poor application security settings, including missing or ineffective row-level security policies and misuse of public keys."],"insights":["The exposure was not confined to one industry: the article cites affected services ranging from valet parking and immigration assistance to an adult creator platform, an OTP service, and a government consulate.","UpGuard’s review found that even when a database did not expose a table named “users,” another accessible table could still reveal data through its schema.","Although AI-assisted development accounts for more than 60% of newly created Supabase databases, UpGuard said its scans did not prove that every exposed site was created with an AI coding agent.","The reported configuration problems involved access controls rather than a Supabase platform flaw, including ineffective row-level restrictions and inappropriate use of public keys."],"referencedReports":[{"title":"Everything Everywhere: Systemic Data Exposure in Supabase Apps","url":"https://www.upguard.com/blog/everything-everywhere-systemic-data-exposure-in-supabase-apps","publisher":"upguard","context":"The article cites UpGuard's analysis explaining that exposed Supabase applications stem from users misunderstanding database security configuration.","category":"research","primary":true},{"title":"Securing your API","url":"https://supabase.com/docs/guides/api/securing-your-api","publisher":"supabase","context":"The article recommends Supabase's API security guide to help users identify and mitigate exposure risks.","category":"guide","primary":false}],"body":"\u003cp\u003eUpGuard researchers found more than 16,000 misconfigured Supabase databases with readable tables exposing personally identifiable information, passwords, or authentication tokens. The researchers examined around 300,000 domains showing signs of Supabase use and checked for accessible user-related tables and schemas. More than half of the exposed databases contained personally identifiable information, while a smaller subset included passwords and authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eThe reported cases included a U.S. valet service with more than 100,000 exposed customer records, a Canadian immigration service with nearly 5,000 user records and 884 plaintext passwords, and an India-based adult creator platform with identity data, payment accounts, and over 100,000 private messages. UpGuard also cited an OTP service in the Philippines exposing user and SMS data and an African government consulate exposing records for 25,000 people, including emergency housing locations. The researchers attributed the exposures to poor application security configuration, including missing or ineffective row-level security policies and misuse of public keys, and encouraged Supabase users to review the platform\u0026rsquo;s security documentation.\u003c/p\u003e\n"},{"n":2,"title":"Times Car confirms data breach affecting 6.6 million user accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/times-car-confirms-data-breach-affecting-66-million-user-accounts/","time":"20:31","priority":"SHOULD READ","score":83,"tldr":"Japanese car-sharing provider Times Car confirmed that a cyberattack exposed personal data from roughly 6.6 million current and former members, including driver’s license and identity-verification documents. Credit card data was not affected, and the company says passwords were stored in a non-reversible form.","briefOverview":"\u003cp\u003eJapanese car-sharing service Times Car confirmed that a cyberattack exposed data tied to approximately 6.6 million current and former members, including participants in its Times Business Service corporate account program. The company said a third party accessed its systems at the beginning of September and that it blocked the unauthorized access on September 26. It initially investigated whether personal information had been accessed before confirming the data theft in a subsequent update.\u003c/p\u003e\n\n\u003cp\u003eExposed information includes names, addresses, birth dates, phone numbers, email addresses, driver’s license details, identity-verification document images, account passwords, and linked service IDs. Times Car said passwords were stored in a form that cannot be restored, while credit card information was not affected, and it has no evidence that the stolen data has been distributed online. The company is conducting a forensic investigation with an external expert, will notify affected customers in stages, and has warned members to be wary of purported Times Car emails, text messages, and phone calls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Times Car confirmed that unauthorized access to its systems resulted in the theft of data affecting approximately 6.6 million current and former members, including members of its Times Business Service corporate program.","The exposed information includes names, addresses, birth dates, telephone numbers, email addresses, driver’s license information, identity-verification document images, account passwords, and linked service IDs.","Times Car said the affected passwords were stored in a form that cannot be restored, while credit card information was not affected.","The company said it has no evidence that the stolen data has been distributed online and is conducting a forensic investigation with an external expert.","Times Car will notify affected customers in stages and has warned members to be cautious of emails, SMS messages, and phone calls claiming to come from the company."],"insights":["The incident extends beyond active consumer users to former members and current and former participants in the Times Business Service corporate program, broadening the population that may need to watch for impersonation attempts.","The combination of contact details, driver’s license information, and identity-document images makes Times Car’s warning about fraudulent emails, text messages, and phone calls particularly relevant.","Credit card information was not affected, but the exposed data categories include account passwords and linked service IDs, so the company emphasized avoiding requests to enter passwords or card details.","Times Car said it has no evidence that the stolen data has been distributed online, while also stating that customer notifications will be delivered in stages."],"referencedReports":[],"body":"\u003cp\u003eJapanese car-sharing service Times Car confirmed that a cyberattack exposed data tied to approximately 6.6 million current and former members, including participants in its Times Business Service corporate account program. The company said a third party accessed its systems at the beginning of September and that it blocked the unauthorized access on September 26. It initially investigated whether personal information had been accessed before confirming the data theft in a subsequent update.\u003c/p\u003e\n\n\u003cp\u003eExposed information includes names, addresses, birth dates, phone numbers, email addresses, driver’s license details, identity-verification document images, account passwords, and linked service IDs. Times Car said passwords were stored in a form that cannot be restored, while credit card information was not affected, and it has no evidence that the stolen data has been distributed online. The company is conducting a forensic investigation with an external expert, will notify affected customers in stages, and has warned members to be wary of purported Times Car emails, text messages, and phone calls.\u003c/p\u003e\n"},{"n":6,"title":"Hackers Use NeedyMantis to Maintain Long-Term Access in Breached Networks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/hackers-use-needymantis-to-maintain.html","time":"18:35","priority":"SHOULD READ","score":82,"tldr":"Microsoft says the NeedyMantis malware family is being used in targeted post-compromise intrusions to maintain long-term access through DLL sideloading and encrypted payloads. The activity, including use by the suspected China-linked Storm-3069 group, has targeted organizations across telecommunications, academia, healthcare, intergovernmental bodies, and government contracting.","briefOverview":"\u003cp\u003eMicrosoft reported that the NeedyMantis malware family has been used to maintain long-term access in a small number of targeted intrusions affecting telecommunications organizations, universities, medical nonprofits, intergovernmental organizations, and government contractors. The activity dates to at least October 2025. Microsoft found NeedyMantis while following indicators from Kaspersky’s investigation of the DAEMON Tools supply-chain compromise, though it has not seen NeedyMantis delivered through the tampered installers.\u003c/p\u003e\n\n\u003cp\u003eNeedyMantis is deployed alongside legitimate software such as Poedit, curl, Vim, or TightVNC, using a malicious file that the legitimate program loads. The malicious component extracts encrypted stages, contacts a command-and-control server over HTTPS, switches to a WebSocket connection, and can receive additional modules from operators. Microsoft tracks one user of the malware as Storm-3069, assesses that its activity appears to originate in China, and says more than one group may use NeedyMantis. Microsoft published hashes, file paths, a command-and-control domain, and hunting queries, while noting that the queries cover only the previous seven days and that a normal Poedit WinSparkle.dll file must be checked against the published hash.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft identified NeedyMantis as a malware family used to maintain long-term access in a small number of targeted intrusions affecting telecommunications organizations, universities, medical nonprofits, intergovernmental organizations, and government contractors.","NeedyMantis commonly uses DLL sideloading, packaging a legitimate application with a malicious DLL and encrypted archive so that the application loads and runs the malware.","Microsoft tracks one user of NeedyMantis as Storm-3069, assesses its activity appears to originate in China, and has not attributed it to a Chinese nation-state actor.","Microsoft has not confirmed that NeedyMantis was distributed through the compromised DAEMON Tools Lite installers, although it found the malware while investigating indicators related to that supply-chain incident.","Microsoft published file hashes, a command-and-control domain, file paths, and hunting queries to help defenders identify NeedyMantis activity."],"insights":["Microsoft’s published hunting queries look back only seven days, even though the related NeedyMantis files were first seen in October 2025 and May 2026, so unchanged queries would not identify activity from those earlier periods.","A WinSparkle.dll file in Poedit’s normal installation path is not sufficient evidence of infection because WinSparkle.dll is a legitimate Poedit component; the file must be compared with Microsoft’s published hash.","Microsoft found NeedyMantis while investigating indicators tied to the DAEMON Tools supply-chain compromise, but it has not observed the malware being delivered through the tampered DAEMON Tools installers.","Microsoft has observed NeedyMantis outside Storm-3069 activity and says multiple groups may use it, so the malware alone does not establish that a single actor was responsible."],"referencedReports":[{"title":"NeedyMantis: Unpacking a post-compromise malware family used in targeted operations","url":"https://www.microsoft.com/en-us/security/blog/2026/09/28/needymantis-unpacking-a-post-compromise-malware-family-used-in-targeted-operations/","publisher":"microsoft","context":"The article is based on Microsoft's technical analysis of the NeedyMantis malware family and its targeted use for post-compromise access.","category":"research","primary":true},{"title":"Mitigation guidance for supply chain compromise","url":"https://cloud.google.com/blog/topics/threat-intelligence/mitigation-guidance-for-supply-chain-compromise","publisher":"google-threat-intelligence-group","context":"The article cites Google Threat Intelligence Group's tracking of the actor behind the DAEMON Tools supply-chain campaign as UNC6863.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft reported that the NeedyMantis malware family has been used to maintain long-term access in a small number of targeted intrusions affecting telecommunications organizations, universities, medical nonprofits, intergovernmental organizations, and government contractors. The activity dates to at least October 2025. Microsoft found NeedyMantis while following indicators from Kaspersky’s investigation of the DAEMON Tools supply-chain compromise, though it has not seen NeedyMantis delivered through the tampered installers.\u003c/p\u003e\n\n\u003cp\u003eNeedyMantis is deployed alongside legitimate software such as Poedit, curl, Vim, or TightVNC, using a malicious file that the legitimate program loads. The malicious component extracts encrypted stages, contacts a command-and-control server over HTTPS, switches to a WebSocket connection, and can receive additional modules from operators. Microsoft tracks one user of the malware as Storm-3069, assesses that its activity appears to originate in China, and says more than one group may use NeedyMantis. Microsoft published hashes, file paths, a command-and-control domain, and hunting queries, while noting that the queries cover only the previous seven days and that a normal Poedit WinSparkle.dll file must be checked against the published hash.\u003c/p\u003e\n"},{"n":3,"title":"Dutch police confirm arrest in ShinyHunters hacking investigation","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/dutch-police-confirm-arrest-in-shinyhunters-hacking-investigation/","time":"19:49","priority":"SHOULD READ","score":78,"tldr":"Dutch police confirmed that a 24-year-old Amsterdam man was arrested in an investigation into ShinyHunters, though the group denies he has any connection to it. The suspect, reportedly former hacker Pepijn van der Stap (“Umbreon”), was already on probation for prior hacking and extortion convictions.","briefOverview":"\u003cp\u003eDutch police confirmed that a 24-year-old man from Amsterdam was arrested this month in an investigation into the ShinyHunters hacking group. The suspect is due to appear before the Rotterdam District Court on September 29, when police said additional information will be released. KrebsOnSecurity and DataBreaches identified him as Pepijn van der Stap, a Dutch hacker previously known online as “Umbreon.”\u003c/p\u003e\n\n\u003cp\u003eVan der Stap was previously arrested in January 2023, later pleaded guilty to hacking and blackmailing more than a dozen companies, and received a four-year sentence with one year suspended plus three years of probation. DataBreaches reported that Dutch tactical police searched his Amsterdam home on September 15 and seized electronic devices. Reports cited a possible link through the Umbreon identity and Pokémon imagery, although the same character appeared in a 2020 HackForums defacement before van der Stap created the Umbreon account, and a ShinyHunters representative denied that he has any association with the group.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dutch police confirmed that a 24-year-old Amsterdam man was arrested this month as part of an investigation into the ShinyHunters hacking group.","The suspect is scheduled to appear before the Rotterdam District Court on September 29, when police said more information will be released.","KrebsOnSecurity and DataBreaches identified the suspect as Pepijn van der Stap, previously known online as “Umbreon,” who was convicted in an earlier hacking and blackmail case.","Dutch tactical police searched the Amsterdam home van der Stap shared with his mother on September 15 and seized electronic devices, according to DataBreaches.","A ShinyHunters representative denied that van der Stap has any association with the group."],"insights":["The reported link between Pepijn van der Stap and ShinyHunters rests partly on the reused “Umbreon” Pokémon imagery, but the article notes that the same character appeared in a HackForums defacement in 2020 before van der Stap created his Umbreon account.","Police publicly released a suspect’s voice in the separate Odido investigation, but DataBreaches and a close friend of van der Stap said the recording did not sound like him.","The Odido intrusion described by police reportedly began with a caller impersonating an internal IT employee and persuading a help-desk worker to enter credentials and a verification code into a fake login page.","Van der Stap’s reported arrest occurred while he was subject to a three-year probationary period following a prior conviction for hacking and blackmailing companies."],"referencedReports":[{"title":"Dutch Police Arrest “Reformed” Hacker in ShinyHunters Investigation","url":"https://krebsonsecurity.com/2026/09/dutch-police-arrest-reformed-hacker-in-shiny-hunters-investigation/","publisher":"krebsonsecurity","context":"The article cites this report for the suspect’s reported identity and sources describing a possible connection to ShinyHunters.","category":"news","primary":false},{"title":"Still on probation from previous arrest for hacking and extortion, Dutch national is arrested again","url":"https://databreaches.net/2026/09/28/still-on-probation-from-previous-arrest-for-hacking-and-extortion-dutch-national-is-arrested-again/","publisher":"databreaches","context":"The article cites this report for details of the September 15 search, the suspect’s prior sentence, and reactions to a police voice recording.","category":"news","primary":false}],"body":"\u003cp\u003eDutch police confirmed that a 24-year-old man from Amsterdam was arrested this month in an investigation into the ShinyHunters hacking group. The suspect is due to appear before the Rotterdam District Court on September 29, when police said additional information will be released. KrebsOnSecurity and DataBreaches identified him as Pepijn van der Stap, a Dutch hacker previously known online as “Umbreon.”\u003c/p\u003e\n\n\u003cp\u003eVan der Stap was previously arrested in January 2023, later pleaded guilty to hacking and blackmailing more than a dozen companies, and received a four-year sentence with one year suspended plus three years of probation. DataBreaches reported that Dutch tactical police searched his Amsterdam home on September 15 and seized electronic devices. Reports cited a possible link through the Umbreon identity and Pokémon imagery, although the same character appeared in a 2020 HackForums defacement before van der Stap created the Umbreon account, and a ShinyHunters representative denied that he has any association with the group.\u003c/p\u003e\n"},{"n":4,"title":"Japan's Keio confirms ransomware attack disrupted business systems","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/japans-keio-confirms-ransomware-attack-disrupted-business-systems/","time":"20:56","priority":"SHOULD READ","score":78,"tldr":"Keio Corporation confirmed a ransomware attack that disrupted hospitality business systems and payment services, while train operations appear unaffected. The company is investigating possible data exposure with outside experts and police.","briefOverview":"\u003cp\u003eKeio Corporation, a major Japanese private railway operator with hotel operations, confirmed a ransomware attack on its group servers in the early hours of September 26, 2026. The company shut down its network after detecting a system failure to prevent additional damage. Keio reported the incident to police and is investigating the attack route and resulting damage with external experts.\u003c/p\u003e\n\n\u003cp\u003eThe apparent impact is limited to Keio’s hospitality business, not its train operations, though local media reported disruptions to payment systems and Keio Plaza Hotel Tokyo warned of possible delays in some customer-facing services. Keio is also examining whether attackers accessed customer or business-partner information, and no ransomware group had claimed responsibility at the time of reporting. Separately, Tokyo Metro disclosed unauthorized system access affecting 59,000 member email addresses, but it is unclear whether the two incidents are connected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Keio Corporation confirmed that its group servers were hit by a ransomware attack in the early hours of September 26, 2026.","Keio shut down its network to limit further damage and is investigating the attack route, impact, and whether customer or business-partner information was accessed.","The incident appears to affect Keio’s hospitality operations and may have disrupted payment systems, while train operations were not affected.","Tokyo Metro separately reported unauthorized access to systems containing 59,000 member email addresses and said it had identified and closed the weakness used.","No ransomware group had publicly claimed responsibility for the Keio incident at the time of reporting."],"insights":["Keio’s reported impact was limited to its hospitality business rather than train operations, illustrating that disruptions within a large transport group may affect only certain business units.","Keio’s immediate network shutdown was intended to prevent additional damage while the company investigated the incident with external experts and police.","Tokyo Metro said the affected systems contained only member email addresses, and it had already identified and closed the weakness used to gain access.","Although Keio and Tokyo Metro disclosed incidents during the same weekend, the article states that it remains unclear whether they were targeted by the same actor or campaign."],"referencedReports":[],"body":"\u003cp\u003eKeio Corporation, a major Japanese private railway operator with hotel operations, confirmed a ransomware attack on its group servers in the early hours of September 26, 2026. The company shut down its network after detecting a system failure to prevent additional damage. Keio reported the incident to police and is investigating the attack route and resulting damage with external experts.\u003c/p\u003e\n\n\u003cp\u003eThe apparent impact is limited to Keio’s hospitality business, not its train operations, though local media reported disruptions to payment systems and Keio Plaza Hotel Tokyo warned of possible delays in some customer-facing services. Keio is also examining whether attackers accessed customer or business-partner information, and no ransomware group had claimed responsibility at the time of reporting. Separately, Tokyo Metro disclosed unauthorized system access affecting 59,000 member email addresses, but it is unclear whether the two incidents are connected.\u003c/p\u003e\n"},{"n":7,"title":"IAM for AI agents: A Practical Enterprise Framework","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/iam-for-ai-agent.html","time":"18:20","priority":"MAY READ","score":45,"tldr":"Enterprise IAM for AI agents must go beyond provisioning and static roles by assigning distinct, owned, short-lived identities and enforcing task-scoped permissions. Organizations also need runtime observability across applications and infrastructure to verify what agents actually did and rapidly revoke authority when behavior exceeds intent.","briefOverview":"\u003cp\u003eAI agents act across enterprise systems with delegated authority, so the article argues they should be managed as non-human identities with a named human owner, defined purpose, limited authorization, expiration, and continuous monitoring. Traditional identity and access management systems primarily show configured access and sign-in events, rather than what an autonomous agent actually did after entering an application. This creates an intent-to-execution gap, including identities, credentials, application-local accounts, and authentication paths that central identity systems may not report.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends distinct agent identities, federated workload identity, and short-lived automatically rotated credentials rather than shared accounts, borrowed user credentials, or embedded secrets. Agent authority should be constrained through task-scoped grants, tool allowlists, data boundaries, and human approval or a second authorization path for high-consequence actions. Organizations also need application- and infrastructure-level telemetry to compare an agent’s intended task with its actual behavior, generate audit evidence, and revoke delegated authority when behavior diverges from approved scope.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI agents should be treated as non-human identities with a human owner, defined purpose, scoped authorization, expiration, and continuous monitoring.","Traditional IAM systems show configured access and authentication events but generally do not show what an autonomous agent did inside an application.","Agent identities should use distinct identities and favor federated workload identity with short-lived, automatically rotated credentials instead of embedded secrets.","Task-scoped grants, tool allowlists, data boundaries, and approval requirements for high-consequence actions can constrain agent behavior.","Organizations need application- and infrastructure-level telemetry to compare an agent’s intended task with its actual execution and support rapid revocation when they diverge."],"insights":["An agent can appear well governed in an identity provider because its sign-ins look normal, while application-level records reveal sensitive data queries, exports, or entitlement changes that the identity provider never records.","The article distinguishes three separate things that must be evaluated: an agent’s approved intent, the permissions it was granted, and the actions it actually executed; only execution shows what occurred.","Agent identities often escape standard governance because they can be created by deployment pipelines, infrastructure automation, or other workloads rather than human-resources-driven processes.","For most enterprises, the article recommends extending existing identity governance for ownership and approvals, building in-application controls where needed, and adding observability for discovering identities and verifying behavior.","Revocation speed and the quality of evidence are presented as critical evaluation criteria that are often overlooked when organizations focus mainly on provisioning features and connector counts."],"referencedReports":[],"body":"\u003cp\u003eAI agents act across enterprise systems with delegated authority, so the article argues they should be managed as non-human identities with a named human owner, defined purpose, limited authorization, expiration, and continuous monitoring. Traditional identity and access management systems primarily show configured access and sign-in events, rather than what an autonomous agent actually did after entering an application. This creates an intent-to-execution gap, including identities, credentials, application-local accounts, and authentication paths that central identity systems may not report.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends distinct agent identities, federated workload identity, and short-lived automatically rotated credentials rather than shared accounts, borrowed user credentials, or embedded secrets. Agent authority should be constrained through task-scoped grants, tool allowlists, data boundaries, and human approval or a second authorization path for high-consequence actions. Organizations also need application- and infrastructure-level telemetry to compare an agent’s intended task with its actual behavior, generate audit evidence, and revoke delegated authority when behavior diverges from approved scope.\u003c/p\u003e\n"}]</script>
