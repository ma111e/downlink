<script type="application/json" id="dl-articles">[{"n":3,"title":"eMudhra CA compromise: eight private keys, and one of them is 4","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/emudhra-ca-compromise","time":"11:53","priority":"SHOULD READ","score":88,"tldr":"eMudhra generated eight intermediate CA private keys with catastrophically weak values—one was simply 4—allowing attackers to forge certificates for arbitrary domains until clients block or remove the affected trust chains. Browsers have revoked them, but servers, containers, CLI tools, and bundled runtimes may remain vulnerable until their CA bundles and images are updated.","briefOverview":"\u003cp\u003eeMudhra generated private keys for eight intermediate certificate authorities incorrectly, with the article\u0026rsquo;s analysis finding that every key was below 256 and one was simply 4. An intermediate certificate authority can sign certificates for any domain, so possession of one of these keys could allow an attacker to create a certificate that clients accept as valid. The affected intermediates chain to emSign ECC Root CA - G3, and two were also trusted for Microsoft code signing.\u003c/p\u003e\n\n\u003cp\u003eFirefox and Chrome blocked the certificates on October 17, 2026, followed by Apple on October 19 and Microsoft on October 20, but many non-browser clients may still trust them. Command-line tools, container images, CI systems, language runtimes, and IoT devices can carry old certificate bundles or ignore revocation information, leaving them exposed until updated. The article recommends updating certificate bundles and relevant runtimes, rebuilding container images, restarting services, and testing affected clients against the provided domains, where a secure result is an SSL error with HTTP 000.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["eMudhra generated eight intermediate certificate authority private keys incorrectly, and the article states that all eight are below 256, with one key equal to 4.","Anyone holding one of the compromised intermediate keys could sign a certificate for any domain, enabling impersonation for clients that still trust the affected certificate chains.","Firefox and Chrome blocked the certificates on October 17, 2026, while Apple blocked them on October 19 and Microsoft blocked them on October 20.","Command-line tools, containers, CI environments, and language runtimes may still trust the compromised intermediates because many do not check certificate revocation and may carry outdated certificate bundles.","The article advises updating operating systems and certificate bundles, rebuilding container images, restarting services, and testing whether clients reject the affected certificate chains."],"insights":["A browser and built-in command-line tools on the same macOS device can disagree about the same certificate: Apple blocks the compromised certificates at the operating-system level, while tools such as curl may still use an unchanged local certificate file.","Rebuilding a container is necessary because a running container retains the certificate bundle present when its image was built, even after the host or upstream base image has been updated.","Clients that enforce certificate transparency, including Firefox, Chrome, Edge, and Safari, could not have been attacked with these intermediates because the article says the affected certificates did not appear in transparency logs before the block.","Two of the compromised intermediates were trusted for Microsoft code signing, meaning the incident could also allow malware to be signed under any publisher name, not only fake website certificates.","The article provides a practical validation method: requests to two specified test domains should fail with an SSL error and HTTP 000, while an HTTP 200 response indicates the client still trusts the compromised chain."],"referencedReports":[{"title":"Mozilla incident report","url":"https://bugzilla.mozilla.org/show_bug.cgi?id=2083449","publisher":"mozilla","context":"The article lists this Mozilla incident report as a source for the eMudhra intermediate CA compromise.","category":"advisory","primary":true}],"body":"\u003cp\u003eeMudhra generated private keys for eight intermediate certificate authorities incorrectly, with the article\u0026rsquo;s analysis finding that every key was below 256 and one was simply 4. An intermediate certificate authority can sign certificates for any domain, so possession of one of these keys could allow an attacker to create a certificate that clients accept as valid. The affected intermediates chain to emSign ECC Root CA - G3, and two were also trusted for Microsoft code signing.\u003c/p\u003e\n\n\u003cp\u003eFirefox and Chrome blocked the certificates on October 17, 2026, followed by Apple on October 19 and Microsoft on October 20, but many non-browser clients may still trust them. Command-line tools, container images, CI systems, language runtimes, and IoT devices can carry old certificate bundles or ignore revocation information, leaving them exposed until updated. The article recommends updating certificate bundles and relevant runtimes, rebuilding container images, restarting services, and testing affected clients against the provided domains, where a secure result is an SSL error with HTTP 000.\u003c/p\u003e\n"},{"n":1,"title":"StealC Is Back, and This Time It's a RAT","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/stealc-returns","time":"13:00","priority":"SHOULD READ","score":84,"tldr":"The StealC operator has resurfaced after Operation Endgame with Stadia, a subscription-based RAT that retains StealC’s credential-stealing code while adding hidden remote desktop control, command execution, file management, process control, and in-memory loading. Defenders should hunt for its ProgramData-based persistence, hidden scheduled tasks, Defender exclusions, and HTTP POST C2 traffic carrying Base64-encoded RC4 ciphertext.","briefOverview":"\u003cp\u003eAfter Europol’s Operation Endgame disrupted StealC in June, the malware seller returned on October 16 with Stadia, a subscription-based remote access trojan. Stadia retains StealC’s credential-stealing capability but adds hidden remote desktop control, command-shell access, file browsing, process management, and file loading from disk or memory. The seller offered former StealC customers a free month of Stadia’s $900 Pro tier, aiming to bring the earlier customer base to the new platform.\u003c/p\u003e\n\n\u003cp\u003eVaronis Threat Labs obtained and analyzed a Stadia build and found direct code overlap with StealC 3.5, including a byte-for-byte identical Chromium App-Bound Encryption helper. The analyzed Windows executable installs in a randomized folder under C:\\ProgramData\\, uses a hidden scheduled task for persistence, and may add a Microsoft Defender exclusion when run with elevated privileges. It communicates with hard-coded HTTP servers using POST bodies labeled as JSON even though the data is RC4-encrypted and Base64-encoded, while its browser-theft behavior includes injecting code into legitimate Chrome, Edge, or Brave processes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Europol’s Operation Endgame disrupted StealC in June by seizing 326 servers and 142 domains and recovering more than 25 million stolen credentials from 385,000 infected machines.","On October 16, the StealC seller resurfaced with Stadia, a subscription-based remote-access trojan that includes StealC-derived credential theft alongside hidden desktop control, remote command execution, file exploration, process management, and loading capabilities.","Varonis Threat Labs found that Stadia contains a 26,112-byte Chromium App-Bound Encryption helper that is byte-for-byte identical to a helper present in StealC 3.5 builds.","Stadia installs under a randomized 12-character directory in C:\\ProgramData\\, creates a hidden scheduled task that runs at logon and every 15 minutes, and may add a Microsoft Defender exclusion for its installation directory when elevated.","The analyzed Stadia build communicates over plain HTTP with hard-coded IP-address servers, sending RC4-encrypted and Base64-encoded data in HTTP POST bodies labeled as application/json."],"insights":["Stadia’s seller offered former StealC customers a free month of the $900 Pro tier, indicating an explicit effort to preserve the customer base after Operation Endgame disrupted the prior infrastructure.","Although Stadia’s C2 addresses, RC4 key, and access token vary by build, its HTTP requests claim to contain JSON while actually carrying Base64-encoded encrypted data, creating a behavioral network detection opportunity.","Its scheduled task is registered through Windows’ Component Object Model interface rather than schtasks.exe, so detections that only monitor schtasks.exe would miss this persistence method.","The browser-theft component creates and quickly deletes a GUID-named text file in C:\\ProgramData\\ containing a 64-character hexadecimal key, providing a short-lived but distinctive host artifact."],"referencedReports":[{"title":"Global cyber strike disrupts SocGholish, Amadey and StealC malware networks","url":"https://www.europol.europa.eu/media-press/newsroom/news/global-cyber-strike-disrupts-socgholish-amadey-and-stealc-malware-networks","publisher":"europol","context":"The article cites Europol’s announcement for Operation Endgame’s seizure of StealC infrastructure and recovery of stolen credentials.","category":"news","primary":false}],"body":"\u003cp\u003eAfter Europol’s Operation Endgame disrupted StealC in June, the malware seller returned on October 16 with Stadia, a subscription-based remote access trojan. Stadia retains StealC’s credential-stealing capability but adds hidden remote desktop control, command-shell access, file browsing, process management, and file loading from disk or memory. The seller offered former StealC customers a free month of Stadia’s $900 Pro tier, aiming to bring the earlier customer base to the new platform.\u003c/p\u003e\n\n\u003cp\u003eVaronis Threat Labs obtained and analyzed a Stadia build and found direct code overlap with StealC 3.5, including a byte-for-byte identical Chromium App-Bound Encryption helper. The analyzed Windows executable installs in a randomized folder under C:\\ProgramData\\, uses a hidden scheduled task for persistence, and may add a Microsoft Defender exclusion when run with elevated privileges. It communicates with hard-coded HTTP servers using POST bodies labeled as JSON even though the data is RC4-encrypted and Base64-encoded, while its browser-theft behavior includes injecting code into legitimate Chrome, Edge, or Brave processes.\u003c/p\u003e\n"},{"n":2,"title":"A Norwegian Toll Bill Written From a Membership Template","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/reskinned-danish-membership-template-norwegian-autopass-toll-bill","time":"11:00","priority":"MAY READ","score":65,"tldr":"A phishing email impersonated Norway’s AutoPASS toll system with a small 95 NOK payment demand, but reused a Danish membership-renewal template that exposed clear inconsistencies. Although SPF and DMARC passed, behavioral analysis flagged the malicious payment link and classified the message as phishing.","briefOverview":"\u003cp\u003eA role mailbox at a Norwegian IT consultancy received a payment reminder impersonating AutoPASS, seeking 95 NOK for an alleged 60 NOK toll charge plus a 35 NOK late fee. The email used the display name “Siren fra Autopass” and included a “Se og betal faktura” payment button, but supplied no vehicle registration, toll-passage date, or toll-station information. It also referred to an invoice “above” that was not present. AutoPASS is Norway’s road-toll collection brand, and the article notes that it has no members whose membership could be suspended.\u003c/p\u003e\n\n\u003cp\u003eThe message exposed signs of having been adapted from a Danish membership-renewal template, including an HTML \u003ccode\u003elang=\u0026quot;da\u0026quot;\u003c/code\u003e declaration, the Danish sign-off “Med venlig hilsen,” a “© 2026 Medlemsservice” footer, and a leftover HTML comment referencing a Renew Membership button. The sender used an unrelated European domain that passed SPF and DMARC checks, but those checks only confirmed that the domain’s server sent the mail rather than verifying an AutoPASS connection. The payment button led to a path on an unrelated Portuguese company website, which returned HTTP 404 during analysis. Themis assessed the message at 90% confidence, flagged the link as malicious, and automatically classified the incident as phishing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A role mailbox at a Norwegian IT consultancy received a payment reminder impersonating AutoPASS that requested 95 NOK, consisting of a 60 NOK toll charge and a 35 NOK late fee.","The email contained signs of a reused Danish membership template, including a Danish HTML language declaration, the Danish sign-off “Med venlig hilsen,” a “Medlemsservice” footer, and references to suspending a membership.","The message did not provide expected toll-bill details such as a vehicle registration, passage date, or toll station, despite referring to an invoice that was not shown.","The sender’s unrelated European domain passed SPF and DMARC checks, but the payment button linked to a path on an unrelated Portuguese company website that returned HTTP 404 during analysis.","Themis assigned the message 90% confidence and flagged its button link as malicious, resulting in automatic classification of the incident as phishing."],"insights":["Passing SPF and DMARC only confirmed that the sending domain’s server sent the email; it did not establish that the message genuinely came from AutoPASS.","A quick relationship check can expose the impersonation: AutoPASS is a road-toll collection brand and does not have members whose memberships can be suspended.","The reused template left multiple independent clues—Danish metadata and wording, a membership-service footer, and a leftover Renew Membership button comment—showing that brand reskinning can be detected through details beyond the sender address.","The article notes that a reputation-based filter had limited obvious indicators because the sender was authenticated, new to the organization, and used only one link, while behavioral analysis flagged the message as inconsistent with its claimed sender."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for phishing’s role as initial access and the share of email-gateway attacks attributed to plain phishing.","category":"research","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references the report alongside CISA guidance to support reporting suspicious messages rather than quietly deleting them.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA’s guidance as support for reporting suspicious messages.","category":"guide","primary":false}],"body":"\u003cp\u003eA role mailbox at a Norwegian IT consultancy received a payment reminder impersonating AutoPASS, seeking 95 NOK for an alleged 60 NOK toll charge plus a 35 NOK late fee. The email used the display name “Siren fra Autopass” and included a “Se og betal faktura” payment button, but supplied no vehicle registration, toll-passage date, or toll-station information. It also referred to an invoice “above” that was not present. AutoPASS is Norway’s road-toll collection brand, and the article notes that it has no members whose membership could be suspended.\u003c/p\u003e\n\n\u003cp\u003eThe message exposed signs of having been adapted from a Danish membership-renewal template, including an HTML \u003ccode\u003elang=\u0026quot;da\u0026quot;\u003c/code\u003e declaration, the Danish sign-off “Med venlig hilsen,” a “© 2026 Medlemsservice” footer, and a leftover HTML comment referencing a Renew Membership button. The sender used an unrelated European domain that passed SPF and DMARC checks, but those checks only confirmed that the domain’s server sent the mail rather than verifying an AutoPASS connection. The payment button led to a path on an unrelated Portuguese company website, which returned HTTP 404 during analysis. Themis assessed the message at 90% confidence, flagged the link as malicious, and automatically classified the incident as phishing.\u003c/p\u003e\n"},{"n":5,"title":"Localizing compliance at scale: achieving South Korea’s ISMS certification","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/k-isms/","time":"13:00","priority":"MAY READ","score":58,"tldr":"Cloudflare has obtained South Korea’s ISMS certification after a KISA-led audit, demonstrating that its security, privacy, and data-handling controls meet Korean regulatory requirements. To support compliance, Cloudflare implemented Korea-specific itemized consent during sign-up and disabled social sign-up paths that could bypass those required consents.","briefOverview":"\u003cp\u003eCloudflare obtained South Korea’s Information Security Management System (ISMS) certification under the ISMS-P framework after KISA-appointed auditors reviewed 80 controls over ten days. The certification examines whether security and privacy controls operate in accordance with Korean law, Korean-language requirements, and regulator expectations. It is valid for three years and requires an annual audit to remain in effect.\u003c/p\u003e\n\n\u003cp\u003eFor South Korean users, Cloudflare changed account registration to show separate Korean-language consent items, with three required agreements that must be accepted before an account can be created and a separate optional marketing agreement. Cloudflare disabled Google, Apple, and GitHub social sign-up in South Korea because those account-creation flows would bypass the required consent form. The sign-up experience defaults based on IP-derived location, but the country selected by the user overrides that default because IP geolocation can be inaccurate.\u003c/p\u003e\n\n\u003cp\u003eThe audit reviewed personal-information data flows, access controls, public-facing websites, event pages, the Cloudflare dashboard, consent wording, and the full lifecycle of user data through destruction. ISMS coverage is defined by the certified service boundary, including the teams, infrastructure, information assets, and personal-information flows involved, rather than by a list of named products. Cloudflare states that the certification gives Korean organizations a local assurance benchmark alongside its broader compliance certifications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare obtained South Korea’s ISMS certification under the ISMS-P framework following an audit by KISA-appointed auditors that reviewed 80 controls over ten days.","For South Korean sign-ups, Cloudflare presents separately labeled consent items, requires agreement to three required items before account creation, and makes marketing consent optional.","Cloudflare does not offer Google, Apple, or GitHub social sign-up in South Korea because those flows would bypass its required consent form.","The Korean sign-up experience is selected using the user’s chosen country and IP-based location, with the country selected by the user overriding the IP-based default.","The ISMS certificate is valid for three years and requires an annual audit to maintain it."],"insights":["Cloudflare treated IP-based location only as a default because VPNs, travel, mobile carrier networks, and changing IP ownership can make it inaccurate; the country selected by the user takes precedence for the consent experience.","Rather than build a South Korea-only consent screen after authentication, Cloudflare removed social sign-up options in South Korea to ensure no account-creation path could bypass the required consent choices.","The ISMS audit required data-flow diagrams that auditors could directly examine, rather than relying on narrative descriptions of how personal information moves through Cloudflare’s systems.","ISMS product coverage is determined by whether a service is delivered through the certified operational, infrastructure, and data-flow boundary, not by whether the product is explicitly named on the certificate.","Because ISMS audits cover a specific annual period, preparations extending into another audit year required Cloudflare to update translations, evidence, and privacy documentation for the new period."],"referencedReports":[],"body":"\u003cp\u003eCloudflare obtained South Korea’s Information Security Management System (ISMS) certification under the ISMS-P framework after KISA-appointed auditors reviewed 80 controls over ten days. The certification examines whether security and privacy controls operate in accordance with Korean law, Korean-language requirements, and regulator expectations. It is valid for three years and requires an annual audit to remain in effect.\u003c/p\u003e\n\n\u003cp\u003eFor South Korean users, Cloudflare changed account registration to show separate Korean-language consent items, with three required agreements that must be accepted before an account can be created and a separate optional marketing agreement. Cloudflare disabled Google, Apple, and GitHub social sign-up in South Korea because those account-creation flows would bypass the required consent form. The sign-up experience defaults based on IP-derived location, but the country selected by the user overrides that default because IP geolocation can be inaccurate.\u003c/p\u003e\n\n\u003cp\u003eThe audit reviewed personal-information data flows, access controls, public-facing websites, event pages, the Cloudflare dashboard, consent wording, and the full lifecycle of user data through destruction. ISMS coverage is defined by the certified service boundary, including the teams, infrastructure, information assets, and personal-information flows involved, rather than by a list of named products. Cloudflare states that the certification gives Korean organizations a local assurance benchmark alongside its broader compliance certifications.\u003c/p\u003e\n"},{"n":4,"title":"How to contain shadow AI, as it takes on multiple forms and spreads throughout your environment","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/how-to-contain-shadow-ai-as-it-takes-on-multiple-forms-and-spreads-throughout-your-environment","time":"13:00","priority":"MAY READ","score":52,"tldr":"Shadow AI now includes local models, coding assistants, agents, MCP servers, browser extensions, and other unmanaged tools, creating major data leakage, compliance, and access-control risks. Organizations should pair employee education and clear, practical AI acceptable-use policies with continuous exposure management to discover, prioritize, and remediate unauthorized AI use.","briefOverview":"\u003cp\u003eShadow AI has expanded from employees sharing work information with personal chatbots into a broad range of unapproved AI assets, including local models, coding assistants, autonomous agents, browser extensions, Model Context Protocol servers, APIs, and embedded AI features. The article gives examples such as employees connecting AI assistants to internal customer databases, granting browser extensions access to confidential CRM dashboards, and submitting proprietary source code or financial data to public AI tools. These activities can create blind spots for security teams and expose sensitive company information without IT or security approval. The article says the growth of autonomous AI agents makes shadow AI more difficult to detect and control.\u003c/p\u003e\n\n\u003cp\u003eIBM’s 2026 Cost of a Data Breach Report found that 43% of organizations experienced security incidents involving shadow AI assets, up from 20% the prior year, with an average shadow AI-related breach cost of $5.39 million. Almost half of these incidents resulted in data loss or compromise, 42% caused operational disruption, and 21% resulted in regulatory fines. The article recommends educating employees and leaders, understanding why staff use unapproved tools, and creating a practical AI acceptable-use policy with approved tools, data-handling rules, and clear accountability. It also recommends treating shadow AI as part of broader exposure management by maintaining an inventory of AI assets, finding flaws and excessive permissions, prioritizing risks, monitoring data flows, and preventing sensitive information from being shared through AI prompts or uploads.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Shadow AI has expanded beyond chatbots to include local models, coding assistants, autonomous agents, browser extensions, Model Context Protocol servers, APIs, and embedded AI features across enterprise environments.","IBM reported that 43% of organizations experienced security incidents involving shadow AI assets, and the average cost of a shadow AI-related data breach was $5.39 million.","Nearly half of shadow AI security incidents resulted in data loss or compromise, while 42% caused operational disruption and 21% triggered regulatory fines, according to IBM.","The article recommends educating employees and leaders about shadow AI, understanding why employees use unapproved tools, and creating an AI acceptable-use policy with approved tools and data-handling rules.","The article recommends treating shadow AI as part of broader exposure management by maintaining an inventory of AI assets, identifying security flaws and excessive permissions, prioritizing risks, and monitoring sensitive-data flows."],"insights":["Strictly blocking AI by default can drive employees to hide their use of productivity tools, so the article recommends practical guardrails and approved alternatives instead.","Employees may deliberately use unapproved AI because sanctioned tools are inadequate or because their organization lacks a clear AI strategy, making employee needs assessment a security control as well as a governance exercise.","The article recommends evaluating discovered AI tools individually rather than automatically banning them, including whether vendors train public models on user data, encrypt data, disclose incidents, and meet relevant compliance requirements.","During a 30-day period, Tenable One identified 457 million AI-related security issues across 7,000 customer environments, averaging about 62,000 AI-related exposures per customer.","Shadow AI risks should be correlated with an organization’s other security issues to identify paths that could lead to its most critical systems and data."],"referencedReports":[{"title":"2026 Cost of a Data Breach Report","url":"https://www.ibm.com/reports/data-breach","publisher":"IBM","context":"The article cites IBM’s report for statistics on shadow AI security incidents, breach costs, data compromise, operational disruption, and regulatory fines.","category":"research","primary":false},{"title":"The Invisible Enterprise: Shadow AI and the Ungoverned Frontier","url":"https://labs.cloudsecurityalliance.org/research/csa-whitepaper-shadow-ai-asset-blindness-systemic-risk-20260/","publisher":"Cloud Security Alliance","context":"The article references this April report’s finding that AI adoption has outpaced governance, leaving an ungoverned and untracked layer of AI infrastructure.","category":"research","primary":false},{"title":"Future of Professionals 2026","url":"https://www.thomsonreuters.com/en/institute/c/future-of-professionals","publisher":"Thomson Reuters","context":"The article cites the report’s finding that 34% of surveyed employees knowingly used AI tools not approved by their organization.","category":"research","primary":false},{"title":"GenAI Workforce Survey","url":"https://www.deloitte.com/uk/en/issues/generative-ai/genai-workforce-survey-shadow-ai.html","publisher":"Deloitte","context":"The article cites Deloitte’s survey on unauthorized employee AI use and its recommendation to balance innovation with risk management.","category":"research","primary":false}],"body":"\u003cp\u003eShadow AI has expanded from employees sharing work information with personal chatbots into a broad range of unapproved AI assets, including local models, coding assistants, autonomous agents, browser extensions, Model Context Protocol servers, APIs, and embedded AI features. The article gives examples such as employees connecting AI assistants to internal customer databases, granting browser extensions access to confidential CRM dashboards, and submitting proprietary source code or financial data to public AI tools. These activities can create blind spots for security teams and expose sensitive company information without IT or security approval. The article says the growth of autonomous AI agents makes shadow AI more difficult to detect and control.\u003c/p\u003e\n\n\u003cp\u003eIBM’s 2026 Cost of a Data Breach Report found that 43% of organizations experienced security incidents involving shadow AI assets, up from 20% the prior year, with an average shadow AI-related breach cost of $5.39 million. Almost half of these incidents resulted in data loss or compromise, 42% caused operational disruption, and 21% resulted in regulatory fines. The article recommends educating employees and leaders, understanding why staff use unapproved tools, and creating a practical AI acceptable-use policy with approved tools, data-handling rules, and clear accountability. It also recommends treating shadow AI as part of broader exposure management by maintaining an inventory of AI assets, finding flaws and excessive permissions, prioritizing risks, monitoring data flows, and preventing sensitive information from being shared through AI prompts or uploads.\u003c/p\u003e\n"}]</script>
