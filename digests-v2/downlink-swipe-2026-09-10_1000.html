<script type="application/json" id="dl-articles">[{"n":7,"title":"PaperCut Attacker Uses Hundreds of AI Agents to Compromise 440+ Instances","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/papercut-attacker-uses-hundreds-of-ai.html","time":"11:41","priority":"MUST READ","score":96,"tldr":"A suspected Russian-speaking actor used hundreds of AI agents alongside public offensive tools to rapidly exploit PaperCut NG/MF authentication-bypass and RCE flaws, compromising more than 440 instances across 395 organizations in 48 countries. The campaign demonstrates how agentic AI can drastically reduce the time and human effort needed to research, automate, troubleshoot, and scale real-world intrusions.","briefOverview":"\u003cp\u003eA suspected Russian-speaking actor exploited CVE-2026-81578 and CVE-2026-82078, an authentication-bypass and remote-code-execution chain affecting PaperCut NG/MF. GreyNoise and Blackpoint Cyber linked the activity to an IP address previously associated with scanning and brute-force attempts. The campaign primarily targeted education organizations across multiple countries, including the United States, United Kingdom, France, Spain, Canada, Australia, Germany, and Switzerland.\u003c/p\u003e\n\n\u003cp\u003eThe attacker reportedly used hundreds of AI agents powered by OpenAI Codex and a DeepSeek model, alongside tools such as Mimikatz, SharpHound, Certipy, Rubeus, and Impacket. GreyNoise said at least 440 PaperCut instances at 395 identified organizations in 48 countries were compromised, although domain administrator access was obtained at 12 organizations. Blackpoint reported that the AI-assisted workflow supported vulnerability research, exploit development, target selection, failure tracking, retries, and post-compromise tasks, reducing the human effort needed to run the campaign at scale.\u003c/p\u003e\n\n\u003cp\u003eAccording to GreyNoise, the actor went from an empty workspace to remote code execution against a real victim in under four hours and compromised at least 11 organizations in 26 seconds after the campaign began. In one attack against a U.S. high school, the actor reportedly progressed from initial access to full domain administrator access in seven minutes. The actor\u0026rsquo;s final objectives remain unclear, with GreyNoise noting that it is unknown whether the access will be handed to other actors or used for follow-on actions such as data theft or ransomware deployment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A suspected Russian-speaking cyber actor exploited CVE-2026-81578 and CVE-2026-82078, an authentication-bypass and remote-code-execution chain affecting PaperCut NG/MF.","GreyNoise reported that the actor used hundreds of AI agents powered by OpenAI Codex and a DeepSeek model, alongside public security tools, to compromise at least 440 PaperCut instances at 395 identified organizations in 48 countries.","The campaign mainly targeted education-sector organizations in the United States, United Kingdom, France, Spain, Canada, Belgium, Portugal, Australia, Germany, and Switzerland.","GreyNoise said the attacker moved from an empty workspace to remote code execution against a real victim in under four hours and compromised at least 11 organizations in 26 seconds after the campaign began.","Blackpoint reported that the actor’s AI-assisted workflow supported vulnerability research, exploit development, target filtering, failure analysis, repeated retries, and post-compromise activities."],"insights":["The attacker reportedly attempted to exclude entities in 28 countries, but GreyNoise observed victims in some of those countries anyway, showing that the campaign’s targeting restrictions did not reliably prevent unintended compromises.","Although at least 440 PaperCut instances were compromised, the article says domain administrator access was obtained at only 12 victim organizations, indicating that full network control was a less frequent outcome than initial system compromise.","In one reported case involving a U.S. high school, the time from initial access to full domain administrator access was seven minutes.","The actor reportedly built and attacked its own test environment containing vulnerable PaperCut software and an Active Directory server before scaling activity against real targets.","Blackpoint found that the AI-supported process retained context across research, coding, testing, troubleshooting, target expansion, and execution, allowing failures to inform subsequent retry waves."],"referencedReports":[{"title":"Death by a Thousand PaperCuts: AI-Driven Exploitation at Scale","url":"https://blackpointcyber.com/blog/death-by-a-thousand-papercuts-ai-driven-exploitation-at-scale/","publisher":"blackpoint-cyber","context":"Blackpoint Cyber provided analysis of the exposed operator infrastructure and the attacker’s AI-assisted workflow for researching, developing, testing, and scaling the PaperCut campaign.","category":"research","primary":true},{"title":"AI-Orchestrated Campaign Against PaperCut NG/MF","url":"https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf","publisher":"greynoise","context":"GreyNoise reported on the campaign’s infrastructure, victim scope, AI-agent use, targeting behavior, and speed of compromise.","category":"research","primary":true}],"body":"\u003cp\u003eA suspected Russian-speaking actor exploited CVE-2026-81578 and CVE-2026-82078, an authentication-bypass and remote-code-execution chain affecting PaperCut NG/MF. GreyNoise and Blackpoint Cyber linked the activity to an IP address previously associated with scanning and brute-force attempts. The campaign primarily targeted education organizations across multiple countries, including the United States, United Kingdom, France, Spain, Canada, Australia, Germany, and Switzerland.\u003c/p\u003e\n\n\u003cp\u003eThe attacker reportedly used hundreds of AI agents powered by OpenAI Codex and a DeepSeek model, alongside tools such as Mimikatz, SharpHound, Certipy, Rubeus, and Impacket. GreyNoise said at least 440 PaperCut instances at 395 identified organizations in 48 countries were compromised, although domain administrator access was obtained at 12 organizations. Blackpoint reported that the AI-assisted workflow supported vulnerability research, exploit development, target selection, failure tracking, retries, and post-compromise tasks, reducing the human effort needed to run the campaign at scale.\u003c/p\u003e\n\n\u003cp\u003eAccording to GreyNoise, the actor went from an empty workspace to remote code execution against a real victim in under four hours and compromised at least 11 organizations in 26 seconds after the campaign began. In one attack against a U.S. high school, the actor reportedly progressed from initial access to full domain administrator access in seven minutes. The actor\u0026rsquo;s final objectives remain unclear, with GreyNoise noting that it is unknown whether the access will be handed to other actors or used for follow-on actions such as data theft or ransomware deployment.\u003c/p\u003e\n"},{"n":4,"title":"CISA Flags Exploited Cisco, Citrix, Fortinet Flaws, Sets Sept. 12 Federal Patch Deadline","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisa-flags-exploited-cisco-citrix.html","time":"10:36","priority":"MUST READ","score":95,"tldr":"CISA added actively exploited Cisco FMC, Citrix NetScaler, and Fortinet flaws to its Known Exploited Vulnerabilities catalog, requiring U.S. federal agencies to patch by September 12, 2026. The flaws enable authentication bypass or remote code execution and are being used in real-world attacks, including Fortinet infections with the PivotC2 RAT.","briefOverview":"\u003cp\u003eCISA added three actively exploited vulnerabilities affecting Cisco, Citrix, and Fortinet products to its Known Exploited Vulnerabilities catalog. Federal Civilian Executive Branch agencies must patch CVE-2026-20079, CVE-2026-19490, and CVE-2025-25249 by September 12, 2026. The Cisco and Citrix issues allow authentication bypass under affected configurations, while the Fortinet issue can enable remote code or command execution through crafted requests.\u003c/p\u003e\n\n\u003cp\u003eCisco said it became aware of active exploitation of its Secure Firewall Management Center flaw in August 2026, and Previdian recorded 56 attempts against honeypot systems for the Citrix NetScaler flaw since September 3. Separately, SOCRadar reported a campaign suspected of exploiting the Fortinet flaw that targeted more than 3,000 IP addresses and infected 178 devices with the PivotC2 remote-access trojan. PivotC2 can provide attackers with command access, file transfers, tunneling, network scanning, and FortiGate configuration and credential collection, underscoring the risk posed by exposed network-edge devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-20079 in Cisco Secure Firewall Management Center, CVE-2026-19490 in Citrix NetScaler, and CVE-2025-25249 in Fortinet products to its Known Exploited Vulnerabilities catalog.","Federal Civilian Executive Branch agencies must apply patches for the three listed vulnerabilities by September 12, 2026.","Cisco said it became aware of active exploitation of CVE-2026-20079 in August 2026, while Previdian recorded 56 attempts to exploit CVE-2026-19490 against its honeypots since September 3, 2026.","A campaign suspected of exploiting CVE-2025-25249 targeted more than 3,000 IP addresses and infected 178 devices with the PivotC2 remote-access trojan, according to SOCRadar.","SOCRadar said PivotC2 can provide interactive command access, file transfers, traffic tunneling, network scanning, and FortiGate configuration and credential collection."],"insights":["The Fortinet campaign appears selective rather than indiscriminate: more than 3,000 IP addresses were targeted, but 178 devices were reported infected with PivotC2.","PivotC2 is designed to maintain an outbound encrypted connection to its operators and can automatically run a predefined command sequence after infection, reducing the need for continued hands-on control.","Cisco router compromises observed by Sygnia turned network transit devices into positions from which attackers could observe trusted traffic and move further into high-value networks.","For Fortinet users, SOCRadar specifically recommends limiting internet access, looking for signs of compromise, rotating credentials, and applying current patches rather than treating patching as the only response."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/09/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA’s alert is the basis for the article’s report that the Cisco, Citrix, and Fortinet flaws were added to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Cisco Secure Firewall Management Center Software Authentication Bypass Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2","publisher":"cisco","context":"Cisco’s updated advisory states that it became aware of active exploitation of CVE-2026-20079 in August 2026.","category":"advisory","primary":false},{"title":"FG-IR-25-084","url":"https://fortiguard.fortinet.com/psirt/FG-IR-25-084","publisher":"fortinet","context":"Fortinet’s PSIRT advisory is linked for CVE-2025-25249, the FortiOS, FortiSwitchManager, and FortiSASE flaw added to CISA’s catalog.","category":"advisory","primary":false},{"title":"CVE-2025-25249: PivotC2 FortiGate RAT","url":"https://socradar.io/blog/cve-2025-25249-pivotc2-fortigate-rat/","publisher":"socradar","context":"SOCRadar’s report describes a campaign suspected of exploiting CVE-2025-25249 to deploy the PivotC2 remote-access trojan.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added three actively exploited vulnerabilities affecting Cisco, Citrix, and Fortinet products to its Known Exploited Vulnerabilities catalog. Federal Civilian Executive Branch agencies must patch CVE-2026-20079, CVE-2026-19490, and CVE-2025-25249 by September 12, 2026. The Cisco and Citrix issues allow authentication bypass under affected configurations, while the Fortinet issue can enable remote code or command execution through crafted requests.\u003c/p\u003e\n\n\u003cp\u003eCisco said it became aware of active exploitation of its Secure Firewall Management Center flaw in August 2026, and Previdian recorded 56 attempts against honeypot systems for the Citrix NetScaler flaw since September 3. Separately, SOCRadar reported a campaign suspected of exploiting the Fortinet flaw that targeted more than 3,000 IP addresses and infected 178 devices with the PivotC2 remote-access trojan. PivotC2 can provide attackers with command access, file transfers, tunneling, network scanning, and FortiGate configuration and credential collection, underscoring the risk posed by exposed network-edge devices.\u003c/p\u003e\n"},{"n":5,"title":"Check Point Discloses Two 9.8-Rated VPN Certificate Flaws Enabling Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/check-point-discloses-two-98-rated-vpn.html","time":"11:45","priority":"SHOULD READ","score":88,"tldr":"Check Point patched two critical CVSS 9.8 VPN certificate-processing flaws, CVE-2026-85102 and CVE-2026-85103, that could enable unauthenticated remote code execution on Quantum Security Gateway and Security Management systems. Organizations should apply Live Patch or the latest Jumbo Hotfix immediately, though affected versions and fixes for some products remain unclear.","briefOverview":"\u003cp\u003eCheck Point disclosed and began delivering fixes on September 9 for two critical VPN certificate vulnerabilities, CVE-2026-85102 and CVE-2026-85103, both rated CVSS 9.8 by the company. Check Point said it found the flaws internally and had no indication that either had been used in attacks. The issues affect Security Gateway systems, with CVE-2026-85103 also affecting Quantum Security Management systems.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-85102 stems from improper certificate trust validation during VPN negotiation, while CVE-2026-85103 is a heap-based buffer overflow during decoding of a VPN certificate\u0026rsquo;s ASN.1 structure. Both could allow an unauthenticated remote attacker to run code under specific conditions that Check Point has not described. Customers can use Check Point Live Patch or install the latest Jumbo Hotfix, but the article notes uncertainty over coverage for some products and versions, including R81.10, Spark Firewall, and Security Management Server deployments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point disclosed and began delivering fixes on September 9 for two CVSS 9.8 VPN certificate flaws, CVE-2026-85102 and CVE-2026-85103.","CVE-2026-85102 involves improper certificate trust validation during VPN negotiation and could allow unauthenticated remote code execution on a Check Point Security Gateway.","CVE-2026-85103 is a heap-based buffer overflow in VPN certificate ASN.1 decoding that could allow unauthenticated remote code execution on Quantum Security Management and Quantum Security Gateway systems.","Check Point said it found both flaws internally and has no indication that either has been exploited.","Customers can receive protection through Check Point Live Patch or install the latest Jumbo Hotfix for their deployed version, although the article reports unclear version coverage and mitigation guidance for some products."],"insights":["Turning off the VPN software blade may not eliminate exposure to CVE-2026-85103 if VPN certificates remain present, according to a Check Point staff response.","The published affected-version list covers only R81.20, R82, and R82.10, while a Canadian advisory also names Spark Firewall and Security Management Server without specifying versions.","Customers running R81.10 reported that neither a Jumbo Hotfix nor Live Patch was available, leaving them dependent on mitigation guidance that they said was too vague to implement.","Several customers reported that automatic Live Patch rollout had not yet reached their gateways and that advisory download links failed, potentially complicating prompt remediation."],"referencedReports":[{"title":"Action Required: Critical Security Advisory - VPN Vulnerabilities","url":"https://community.checkpoint.com/t5/General-Topics/Action-Required-Critical-Security-Advisory-VPN-Vulnerabilities/td-p/281995","publisher":"check-point","context":"The article cites this Check Point customer-community notice as the September 9 disclosure of the two critical VPN certificate flaws.","category":"advisory","primary":true},{"title":"Check Point Security Advisory AV26-902","url":"https://www.cyber.gc.ca/en/alerts-advisories/check-point-security-advisory-av26-902","publisher":"canadian-center-for-cyber-security","context":"The article references this Canadian government advisory for its broader list of affected Check Point product lines.","category":"advisory","primary":false}],"body":"\u003cp\u003eCheck Point disclosed and began delivering fixes on September 9 for two critical VPN certificate vulnerabilities, CVE-2026-85102 and CVE-2026-85103, both rated CVSS 9.8 by the company. Check Point said it found the flaws internally and had no indication that either had been used in attacks. The issues affect Security Gateway systems, with CVE-2026-85103 also affecting Quantum Security Management systems.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-85102 stems from improper certificate trust validation during VPN negotiation, while CVE-2026-85103 is a heap-based buffer overflow during decoding of a VPN certificate\u0026rsquo;s ASN.1 structure. Both could allow an unauthenticated remote attacker to run code under specific conditions that Check Point has not described. Customers can use Check Point Live Patch or install the latest Jumbo Hotfix, but the article notes uncertainty over coverage for some products and versions, including R81.10, Spark Firewall, and Security Management Server deployments.\u003c/p\u003e\n"},{"n":6,"title":"Gigabud Creates Android Work Profiles to Hide From Banking App Malware Checks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/gigabud-creates-android-work-profiles.html","time":"11:33","priority":"SHOULD READ","score":84,"tldr":"Group-IB reports that the Gigabud banking trojan uses a companion app called Vwork to create an Android work profile and place a tampered banking app inside it, isolating the trojan from the bank app's malware checks. The technique has been confirmed on infected devices in Indonesia and is linked to the GoldFactory group.","briefOverview":"\u003cp\u003eGroup-IB reported that the Gigabud banking trojan installs a second Android app, Vwork, which creates a work profile and places a tampered banking app inside it. Android normally uses work profiles to separate employer apps from a person’s personal apps, but this separation can prevent the banking app from seeing Gigabud in the personal profile. Group-IB confirmed the full Gigabud, Vwork, and tampered banking-app chain on infected devices in Indonesia.\u003c/p\u003e\n\n\u003cp\u003eGigabud is a remote-access trojan linked by Group-IB to GoldFactory that asks victims for Accessibility access, screen-overlay permission, and background-running permission. It can collect installed-app lists, display fake banking login screens, capture lock-screen codes, and let operators run transactions while a black screen hides activity. Between February and July 2026, Group-IB observed about 1,469 compromised devices and 1,281 possibly compromised logins in Indonesia, with estimated losses of about $960,000, though it said these figures reflect only its own observations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Group-IB reported that the Gigabud banking trojan installs a companion app called Vwork that creates an Android work profile and places a tampered banking app inside it.","Because Android work profiles separate their apps from the personal profile, a banking app inside the profile may not detect Gigabud running in the personal space, according to Group-IB.","Gigabud obtains Accessibility access to let operators control infected phones, overlays fake login screens to capture keystrokes, and can obtain the device lock-screen code.","Group-IB confirmed the full Gigabud, Vwork, and tampered banking-app chain on infected devices in Indonesia, while samples targeting several other countries were found but not confirmed as infections.","Between February and July 2026, Group-IB observed about 1,469 compromised devices and 1,281 possibly compromised logins in Indonesia, with estimated losses of about $960,000."],"insights":["Vwork is based on the open-source Shelter app but was altered so that other apps on the phone, rather than the device owner, can create and control the work profile and apps inside it.","The reported bypass relies on Android’s normal separation between personal and work spaces, using that separation to keep Gigabud outside the banking app’s malware scan rather than breaking Android’s app isolation.","Vwork reduces Shelter’s multi-screen work-profile setup to one Chinese-language prompt, despite the confirmed infections being in Indonesia.","For banks, potentially useful warning signs include an unexpected work profile on a consumer phone, the same banking app appearing in both profiles, an otherwise empty work profile, and Accessibility enabled for an app that has no apparent need for it.","Removing the work profile deletes its contents, but Group-IB did not determine whether doing so ends the threat when Gigabud remains installed in the personal profile."],"referencedReports":[{"title":"Vwork App Cloning, Gigabud, and GoldFactory","url":"https://www.group-ib.com/blog/vwork-app-cloning-gigabud-goldfactory/","publisher":"group-ib","context":"The article relies on Group-IB's technical report for its analysis of Gigabud, Vwork, Android work-profile abuse, and confirmed activity in Indonesia.","category":"research","primary":true}],"body":"\u003cp\u003eGroup-IB reported that the Gigabud banking trojan installs a second Android app, Vwork, which creates a work profile and places a tampered banking app inside it. Android normally uses work profiles to separate employer apps from a person’s personal apps, but this separation can prevent the banking app from seeing Gigabud in the personal profile. Group-IB confirmed the full Gigabud, Vwork, and tampered banking-app chain on infected devices in Indonesia.\u003c/p\u003e\n\n\u003cp\u003eGigabud is a remote-access trojan linked by Group-IB to GoldFactory that asks victims for Accessibility access, screen-overlay permission, and background-running permission. It can collect installed-app lists, display fake banking login screens, capture lock-screen codes, and let operators run transactions while a black screen hides activity. Between February and July 2026, Group-IB observed about 1,469 compromised devices and 1,281 possibly compromised logins in Indonesia, with estimated losses of about $960,000, though it said these figures reflect only its own observations.\u003c/p\u003e\n"},{"n":3,"title":"Russian e-commerce giant Wildberries says DDoS attack delayed payments to sellers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russian-e-commerce-giant-wildberries-says-payments-disrupted","time":"13:31","priority":"SHOULD READ","score":78,"tldr":"Wildberries says DDoS-related security measures delayed seller payouts, with marketplace sellers estimating roughly 20 billion rubles ($240 million) remains unpaid. The company has not linked the disruption to a cyberoperation claimed by Ukraine’s HUR and the Cyber Corps hacking group.","briefOverview":"\u003cp\u003eWildberries said a distributed denial-of-service (DDoS) attack led it to introduce security measures that delayed payments to some marketplace sellers. The company said sellers’ funds were safe and would be transferred after technical procedures were completed. It explained that its security systems can temporarily suspend some transfers during an attack, making withdrawal requests take longer.\u003c/p\u003e\n\n\u003cp\u003eThe Russian Union of Marketplace Sellers said about 20 billion rubles ($240 million) for goods sold in the final week of July remained unpaid, and 95.6% of nearly 2,000 surveyed sellers had not received expected payments. The association asked Prime Minister Mikhail Mishustin, Russia’s antitrust authority, and the tax service to address the resulting cash-flow problems, while questioning Wildberries’ explanation and claiming foreign sellers were paid on schedule. Ukraine’s Main Intelligence Directorate separately said it worked with the Cyber Corps hacking group to disrupt Wildberries’ customer service, contact centers, and payment systems, but Wildberries did not confirm the claim or link it to the DDoS attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Wildberries said security measures introduced after a DDoS attack delayed some seller payments, while stating that sellers’ funds remained safe.","The Russian Union of Marketplace Sellers said about 20 billion rubles ($240 million) for goods sold in the final week of July remained unpaid, and its survey found that 95.6% of nearly 2,000 sellers had not received expected payments.","The sellers’ association asked Prime Minister Mikhail Mishustin to oversee the issue and called for reviews by Russia’s antitrust authority and tax service.","Ukraine’s Main Intelligence Directorate said an operation with the Cyber Corps hacking group disrupted Wildberries’ digital infrastructure, but Wildberries did not confirm that claim or connect it to the payment delays."],"insights":["Wildberries’ safeguards can temporarily stop withdrawal processing during an attempted service disruption, meaning protections intended to secure funds can themselves create significant cash-flow problems for sellers.","The sellers’ union challenged Wildberries’ explanation by saying foreign sellers were reportedly paid on time during the same period, raising a documented concern that the delays did not affect all sellers equally.","The reported disruption extends beyond online shopping: Ukraine’s intelligence agency said customer service, contact centers, and payment systems were affected, while Russian media also estimated the company lost more than 1.2 million square meters of warehouse space in Ukrainian attacks.","The sellers’ association sought involvement from the prime minister, antitrust authority, and tax service, showing that delayed marketplace payments can create regulatory and tax-related consequences as well as commercial ones."],"referencedReports":[],"body":"\u003cp\u003eWildberries said a distributed denial-of-service (DDoS) attack led it to introduce security measures that delayed payments to some marketplace sellers. The company said sellers’ funds were safe and would be transferred after technical procedures were completed. It explained that its security systems can temporarily suspend some transfers during an attack, making withdrawal requests take longer.\u003c/p\u003e\n\n\u003cp\u003eThe Russian Union of Marketplace Sellers said about 20 billion rubles ($240 million) for goods sold in the final week of July remained unpaid, and 95.6% of nearly 2,000 surveyed sellers had not received expected payments. The association asked Prime Minister Mikhail Mishustin, Russia’s antitrust authority, and the tax service to address the resulting cash-flow problems, while questioning Wildberries’ explanation and claiming foreign sellers were paid on schedule. Ukraine’s Main Intelligence Directorate separately said it worked with the Cyber Corps hacking group to disrupt Wildberries’ customer service, contact centers, and payment systems, but Wildberries did not confirm the claim or link it to the DDoS attacks.\u003c/p\u003e\n"},{"n":15,"title":"1.1.1.1 now supports post-quantum DNSSEC, all 2,420 bytes of it","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/post-quantum-dnssec-1111/","time":"13:00","priority":"SHOULD READ","score":78,"tldr":"Cloudflare’s 1.1.1.1 resolver now validates post-quantum ML-DSA-44 DNSSEC signatures, enabling Internet-scale testing of oversized DNS responses and downgrade-resistant validation. Full post-quantum DNSSEC will still require adoption by authoritative servers, registries, and the DNS root.","briefOverview":"\u003cp\u003eCloudflare’s 1.1.1.1 resolver now validates DNSSEC signatures using ML-DSA-44, a post-quantum signature algorithm standardized by NIST. The change is intended to prepare DNSSEC for a future in which current algorithms such as RSA and ECDSA could be broken by quantum computers. Users of 1.1.1.1 do not need to make any changes, as validation occurs automatically when a zone publishes the required records.\u003c/p\u003e\n\n\u003cp\u003eML-DSA-44 creates operational challenges because each signature is 2,420 bytes, larger than common DNS-over-UDP response limits before other DNS data is included. Large responses should be truncated and retried over TCP rather than sent as fragmented UDP. During migration, zones may need to publish both conventional and post-quantum signatures, so 1.1.1.1 applies a restrictive policy that requires a valid ML-DSA-44 validation path when an authenticated parent record indicates post-quantum support, preventing fallback to an older algorithm. A complete post-quantum DNSSEC chain will require support from authoritative servers, registrars, registries, parent zones, the DNS root, and validating resolvers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare’s 1.1.1.1 resolver now validates DNSSEC signatures made with ML-DSA-44, a post-quantum signature algorithm standardized by NIST.","An ML-DSA-44 signature is 2,420 bytes and can exceed common DNS-over-UDP response limits before other DNS data is included, often requiring a retry over TCP.","During the transition, zones may publish conventional and ML-DSA-44 signatures together, but 1.1.1.1 requires a valid ML-DSA-44 validation path when an authenticated parent DS record signals support for a post-quantum algorithm.","A complete post-quantum DNSSEC chain requires ML-DSA-44 support from authoritative servers, registrars, registries, parent zones, the DNS root, and validating resolvers.","Cloudflare plans to add ML-DSA-44 signing to Cloudflare Authoritative DNS and corresponding DS record support to Cloudflare Registrar."],"insights":["Post-quantum DNSSEC does not face “harvest now, decrypt later” risk because DNSSEC protects authenticity rather than confidentiality, but the migration must begin early because it requires coordination throughout the DNS hierarchy.","Publishing both old and post-quantum signatures can create a downgrade path: an attacker could forge an old-algorithm-only response unless a resolver requires a valid post-quantum validation path when the parent signals post-quantum support.","Changing a zone’s keys more frequently does not eliminate downgrade risk, because an attacker who compromises a vulnerable key at any higher level of the DNS chain can forge delegations below it.","The 2,420-byte ML-DSA-44 signature is larger than common UDP DNS payload limits by itself, making reliable fallback to TCP or another transport an operational requirement rather than an edge case."],"referencedReports":[],"body":"\u003cp\u003eCloudflare’s 1.1.1.1 resolver now validates DNSSEC signatures using ML-DSA-44, a post-quantum signature algorithm standardized by NIST. The change is intended to prepare DNSSEC for a future in which current algorithms such as RSA and ECDSA could be broken by quantum computers. Users of 1.1.1.1 do not need to make any changes, as validation occurs automatically when a zone publishes the required records.\u003c/p\u003e\n\n\u003cp\u003eML-DSA-44 creates operational challenges because each signature is 2,420 bytes, larger than common DNS-over-UDP response limits before other DNS data is included. Large responses should be truncated and retried over TCP rather than sent as fragmented UDP. During migration, zones may need to publish both conventional and post-quantum signatures, so 1.1.1.1 applies a restrictive policy that requires a valid ML-DSA-44 validation path when an authenticated parent record indicates post-quantum support, preventing fallback to an older algorithm. A complete post-quantum DNSSEC chain will require support from authoritative servers, registrars, registries, parent zones, the DNS root, and validating resolvers.\u003c/p\u003e\n"},{"n":14,"title":"The Machine With Many Faces: Post-Exploitation Identity Misuse in SPIFFE/SPIRE","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/kubernetes-spiffe-spire-identity-spoofing/","time":"10:00","priority":"MAY READ","score":72,"tldr":"Unit 42 found that an attacker with root access to a Kubernetes node running SPIFFE/SPIRE can spoof cgroup metadata to obtain and impersonate co-located workloads’ short-lived identities (SVIDs). The key takeaway is that node-level compromise effectively compromises every workload identity scoped to that node, making node hardening and restrictions on privileged host access essential.","briefOverview":"\u003cp\u003eUnit 42 demonstrated a post-exploitation technique affecting SPIFFE/SPIRE deployments in Kubernetes environments. An attacker with root-level access to a Kubernetes node can manipulate Linux control-group metadata to cause the local SPIRE agent to issue identities belonging to other workloads on that node. The researchers said they have not observed the technique being exploited in the wild. The finding reinforces that compromise of a node can mean compromise of every cryptographic workload identity scoped to it.\u003c/p\u003e\n\n\u003cp\u003eSPIRE uses workload attestation to decide which short-lived identity credential, called an SVID, a process may receive. Its Kubernetes attestor obtains a process’s pod and container information from \u003ccode\u003e/proc/\u0026lt;pid\u0026gt;/mountinfo\u003c/code\u003e or \u003ccode\u003e/proc/\u0026lt;pid\u0026gt;/cgroups\u003c/code\u003e, then matches collected attributes against registered identity rules. The researchers showed that a root-level attacker can place their own process in a crafted cgroup path resembling a target workload’s path and retrieve the target’s identity. Unit 42 released Spooffe, an open-source tool for defenders to assess this exposure, and recommends hardening nodes, restricting root and host access, prohibiting privileged containers, and minimizing use of weak selectors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 demonstrated that an attacker with root-level access to a Kubernetes node can manipulate cgroup metadata used by SPIRE workload attestation to impersonate co-located workloads and obtain their SPIFFE Verifiable Identity Documents (SVIDs).","SPIFFE provides short-lived machine identities, while SPIRE is a production-ready implementation that issues and manages those identities for workloads through a server and an agent running on each node.","The SPIRE Kubernetes workload-attestor derives a workload’s pod and container information from the requesting process’s /proc cgroup or mount metadata, then uses Kubernetes pod metadata to produce selectors for identity matching.","The researchers created Spooffe, an open-source defensive tool that scans a node’s running workloads, recreates their cgroup paths, and queries the local SPIRE agent to assess which workload identities could be retrieved.","Unit 42 stated that it has not observed this technique being exploited in the wild and recommends treating root compromise of a node as compromise of every identity scoped to that node."],"insights":["SPIRE’s cryptographic short-lived identities do not preserve workload separation after node root compromise, because the local agent’s decision about which identity to issue depends on node-controlled process metadata.","The demonstrated impersonation did not require changing the victim workload itself: the researchers used a separate mock cgroup path for their own process, although they noted that placing a process in the victim’s original cgroup would also work.","Registration entries that use broad selectors such as Kubernetes namespace and service account can increase the potential impact because the agent issues an identity when an entry’s selectors are a subset of the requesting process’s collected selectors.","Spooffe is intended to let defenders measure the identity exposure of a compromised node by automating discovery of co-located workload identities that can be requested from the local SPIRE agent."],"referencedReports":[],"body":"\u003cp\u003eUnit 42 demonstrated a post-exploitation technique affecting SPIFFE/SPIRE deployments in Kubernetes environments. An attacker with root-level access to a Kubernetes node can manipulate Linux control-group metadata to cause the local SPIRE agent to issue identities belonging to other workloads on that node. The researchers said they have not observed the technique being exploited in the wild. The finding reinforces that compromise of a node can mean compromise of every cryptographic workload identity scoped to it.\u003c/p\u003e\n\n\u003cp\u003eSPIRE uses workload attestation to decide which short-lived identity credential, called an SVID, a process may receive. Its Kubernetes attestor obtains a process’s pod and container information from \u003ccode\u003e/proc/\u0026lt;pid\u0026gt;/mountinfo\u003c/code\u003e or \u003ccode\u003e/proc/\u0026lt;pid\u0026gt;/cgroups\u003c/code\u003e, then matches collected attributes against registered identity rules. The researchers showed that a root-level attacker can place their own process in a crafted cgroup path resembling a target workload’s path and retrieve the target’s identity. Unit 42 released Spooffe, an open-source tool for defenders to assess this exposure, and recommends hardening nodes, restricting root and host access, prohibiting privileged containers, and minimizing use of weak selectors.\u003c/p\u003e\n"},{"n":8,"title":"The E-Signature Notice That Asked for No Signature","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/completed-envelope-esign-lure-form-free-square-online-gate-page","time":"11:00","priority":"MAY READ","score":68,"tldr":"A mortgage-document phishing email bypassed conventional trust checks by coming from a legitimately authenticated compromised Microsoft 365 mailbox and directing recipients to a convincing Square-hosted lender portal. The key lesson is that SPF, DKIM, and DMARC validate the sender domain—not the message’s intent—so role relevance and link-context analysis remain essential.","briefOverview":"\u003cp\u003eA payroll specialist at a national in-home senior care provider received a mortgage closing email stating that the document had already been signed by all signers and asking the recipient only to review it. The lure used a lender-branded “View the document” link rather than an explicit request to sign, reducing the apparent stakes of the action. Because the recipient had no mortgage, broker relationship, or reason to receive closing paperwork, role relevance was a key warning sign. IRONSCALES automatically classified the message as phishing, with Themis assigning 83 percent confidence.\u003c/p\u003e\n\n\u003cp\u003eThe link led to a convincing page on a free Square Online storefront subdomain that reproduced the impersonated lender’s branding and offered one “VIEW CLOSING DOCUMENT” button but no fields for entering information. The email was sent from a real employee mailbox in a real European manufacturer’s Microsoft 365 tenant, so SPF, DKIM, and DMARC all legitimately passed. Content-level flaws included inconsistent loan-number masking, unrelated legal-practice software social links, a garbled tagline, a misspelled sender alias, and padding intended to push the legitimate corporate signature below the fold. The case demonstrates that sender authentication establishes responsibility for the sending domain, not whether the email’s content or destination is trustworthy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A payroll specialist at a national in-home senior care provider received a mortgage-closing lure stating that the document had already been signed by all signers and asking the recipient to view it.","The email’s main link led to a lender-branded page hosted on a free Square Online storefront subdomain that contained one document-view button and no input fields.","The message was sent from a real employee mailbox in a European manufacturer’s Microsoft 365 tenant, causing SPF, DKIM, and DMARC checks to pass legitimately.","The email contained content inconsistencies, including mismatched loan-number masking, unrelated legal-software social links, a garbled lender tagline, and a misspelled sender alias.","IRONSCALES automatically resolved the message as phishing, with its Themis system assigning 83 percent confidence."],"insights":["Presenting the document as already signed changes the recipient’s task from signing to merely viewing, potentially bypassing awareness training focused on unexpected signature requests.","A page with no login or data-entry fields can function as a gate to a later stage while giving URL-reputation tools little observable behavior to assess.","SPF, DKIM, and DMARC can all pass on a malicious email when attackers send it through a real, compromised mailbox, because those checks confirm domain responsibility rather than message legitimacy.","For this lure, the strongest human-context warning was that a payroll employee had no apparent reason to receive mortgage-closing paperwork, making role relevance more useful than sender authentication or the stated request."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s findings that phishing was an initial access vector in 16 percent of breaches and that the human element was implicated in 62 percent overall.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA’s phishing guidance to emphasize that phishing defense should focus on deception rather than email transport authentication alone.","category":"guide","primary":false}],"body":"\u003cp\u003eA payroll specialist at a national in-home senior care provider received a mortgage closing email stating that the document had already been signed by all signers and asking the recipient only to review it. The lure used a lender-branded “View the document” link rather than an explicit request to sign, reducing the apparent stakes of the action. Because the recipient had no mortgage, broker relationship, or reason to receive closing paperwork, role relevance was a key warning sign. IRONSCALES automatically classified the message as phishing, with Themis assigning 83 percent confidence.\u003c/p\u003e\n\n\u003cp\u003eThe link led to a convincing page on a free Square Online storefront subdomain that reproduced the impersonated lender’s branding and offered one “VIEW CLOSING DOCUMENT” button but no fields for entering information. The email was sent from a real employee mailbox in a real European manufacturer’s Microsoft 365 tenant, so SPF, DKIM, and DMARC all legitimately passed. Content-level flaws included inconsistent loan-number masking, unrelated legal-practice software social links, a garbled tagline, a misspelled sender alias, and padding intended to push the legitimate corporate signature below the fold. The case demonstrates that sender authentication establishes responsibility for the sending domain, not whether the email’s content or destination is trustworthy.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft says September updates fix mouse settings reset issues","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-resolves-mouse-settings-reset-bug-windows-11-update/","time":"11:14","priority":"MAY READ","score":65,"tldr":"Microsoft fixed a Windows 11 bug in the September 2026 KB5124008 update that reset mouse cursor personalization settings on some non-English systems after the optional KB5120998 preview update.","briefOverview":"\u003cp\u003eMicrosoft says the September 2026 KB5124008 cumulative update fixes a Windows 11 issue that reset mouse personalization settings after installation of the KB5120998 August preview update. The problem affected cursor choices and cursor animations configured through Mouse Properties. Microsoft recommends installing the latest security update because it includes this fix and other improvements.\u003c/p\u003e\n\n\u003cp\u003eThe issue was limited to non-English Windows installations, where certain code components caused saved settings to fail to load and Windows to use defaults instead. Users could not manually restore the settings, and uninstalling KB5120998 did not resolve the problem. KB5120998 was optional for Windows 11 versions 24H2 and 25H2, but it could install automatically for users who enabled the option to receive updates as soon as they are available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says the September 8, 2026 KB5124008 cumulative update resolves a Windows 11 issue that reset mouse personalization settings after the KB5120998 August preview update.","The issue affected non-English Windows installations, where certain code components caused mouse settings to fail to load and Windows to use default settings instead.","Affected settings included cursor selections and cursor animations configured through Windows Mouse Properties, and users could not manually restore them while the issue was present.","KB5120998 was an optional update for Windows 11 versions 24H2 and 25H2, although it could install automatically when the “Get the latest updates as soon as they’re available” setting was enabled.","Microsoft also resolved a separate KB5120998-related issue on Tuesday that wiped custom desktop settings on some Windows devices."],"insights":["Removing the problematic KB5120998 update did not restore affected mouse settings, so installing Microsoft’s subsequent fix was necessary to resolve the issue.","The bug was limited to non-English Windows installations because affected locale-specific components failed to load saved personalization settings and forced Windows to use defaults.","Although KB5120998 was presented as optional, users who enabled the setting to receive updates as soon as available could receive it automatically.","Microsoft addressed both mouse-personalization resets and a separate custom-desktop-settings reset linked to the same KB5120998 preview update."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft says the September 2026 KB5124008 cumulative update fixes a Windows 11 issue that reset mouse personalization settings after installation of the KB5120998 August preview update. The problem affected cursor choices and cursor animations configured through Mouse Properties. Microsoft recommends installing the latest security update because it includes this fix and other improvements.\u003c/p\u003e\n\n\u003cp\u003eThe issue was limited to non-English Windows installations, where certain code components caused saved settings to fail to load and Windows to use defaults instead. Users could not manually restore the settings, and uninstalling KB5120998 did not resolve the problem. KB5120998 was optional for Windows 11 versions 24H2 and 25H2, but it could install automatically for users who enabled the option to receive updates as soon as they are available.\u003c/p\u003e\n"},{"n":2,"title":"UK appoints new commander of National Cyber Force","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/uk-appoints-new-commander-of-national-cyber-force","time":"12:44","priority":"MAY READ","score":64,"tldr":"The UK has appointed an undisclosed new commander of the National Cyber Force, replacing Air Vice-Marshal Tim Neal-Hopes after his full tenure. The NCF leads Britain’s offensive cyber operations through a partnership of defense and intelligence agencies.","briefOverview":"\u003cp\u003eThe United Kingdom has appointed a new commander of the National Cyber Force, replacing Air Vice-Marshal Tim Neal-Hopes after he completed his full tenure. The new commander has not yet been formally publicly identified because security considerations are still being addressed. They are the third person to lead the force since it was formed in 2020.\u003c/p\u003e\n\n\u003cp\u003eThe National Cyber Force combines Britain’s offensive cyber capabilities through a partnership between defense and intelligence organizations, including GCHQ, MI6, and the Defence Science and Technology Laboratory. It says it conducts daily operations against state threats, supports military operations, and disrupts terrorists and serious criminals. Its 2023 doctrine described its operations as accountable, precise, and calibrated, though it provided limited practical detail about how ethical standards apply to covert activities. Funding for the force is committed through 2030, and its planned permanent campus in Samlesbury, Lancashire, was reported as progressing on schedule.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new, as-yet-unidentified commander has taken up leadership of the United Kingdom’s National Cyber Force after Air Vice-Marshal Tim Neal-Hopes completed his full tenure.","The new commander is the third leader of the National Cyber Force since it was established in 2020 to bring together Britain’s offensive cyber capabilities.","The commander’s identity has not been formally publicly acknowledged because routine security considerations are still being addressed.","The National Cyber Force operates as a partnership between defense and intelligence bodies and conducts daily operations against state threats, terrorists, and serious criminals.","The force’s permanent headquarters at Samlesbury in Lancashire is progressing as scheduled, and government funding has been committed through 2030."],"insights":["The National Cyber Force has alternated leadership backgrounds so far: its first commander came from GCHQ, while Tim Neal-Hopes came from the armed forces, reflecting its joint defense-and-intelligence structure.","Although MI6 and the Defence Science and Technology Laboratory are constituent National Cyber Force partners, neither has yet provided a commander.","The force’s 2023 public doctrine described offensive cyber operations as accountable, precise, and calibrated, but offered limited detail about how ethical standards are applied in covert operations.","The UK has committed funding for the National Cyber Force through 2030 while its purpose-built permanent campus in Samlesbury, Lancashire, remains under development."],"referencedReports":[],"body":"\u003cp\u003eThe United Kingdom has appointed a new commander of the National Cyber Force, replacing Air Vice-Marshal Tim Neal-Hopes after he completed his full tenure. The new commander has not yet been formally publicly identified because security considerations are still being addressed. They are the third person to lead the force since it was formed in 2020.\u003c/p\u003e\n\n\u003cp\u003eThe National Cyber Force combines Britain’s offensive cyber capabilities through a partnership between defense and intelligence organizations, including GCHQ, MI6, and the Defence Science and Technology Laboratory. It says it conducts daily operations against state threats, supports military operations, and disrupts terrorists and serious criminals. Its 2023 doctrine described its operations as accountable, precise, and calibrated, though it provided limited practical detail about how ethical standards apply to covert activities. Funding for the force is committed through 2030, and its planned permanent campus in Samlesbury, Lancashire, was reported as progressing on schedule.\u003c/p\u003e\n"},{"n":9,"title":"The CVE spike across major software companies is a remediation problem","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/cve-spike-remediation-problem","time":"10:10","priority":"MAY READ","score":55,"tldr":"The surge in reported CVEs is likely driven by AI-enabled vulnerability discovery, but the more important security problem is that organizations are remediating known, actively exploited flaws too slowly. Effective defense increasingly depends on prioritizing vulnerabilities that are reachable and exploitable, then automating fixes rather than waiting for CVEs or vendor advisories.","briefOverview":"\u003cp\u003eA chart shared by a16z using Epoch AI data showed reported critical and high CVEs across 21 major software companies rising from fewer than 100 per month to more than 600 per month since spring 2026. The article argues that this increase is likely driven largely by AI making it easier to find long-existing bugs, rather than by software suddenly becoming less secure. It says neither raw CVE volume nor a flat count of known exploited vulnerabilities alone determines real-world risk.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies remediation as the main bottleneck, citing Verizon’s 2026 Data Breach Investigations Report, which found that only 26% of confirmed actively exploited CISA KEV vulnerabilities were fully remediated in 2025 and that median time to patch rose to 43 days. It also notes that NIST’s vulnerability-scoring backlog grew from 13,000 to more than 27,000 items over eighteen months, prompting prioritization rather than scoring every CVE. Using the Stylesmuggler issue affecting Adobe Commerce and Magento Open Source as an example, the article argues that organizations should identify reachable, exploitable flaws and fix them quickly instead of waiting for CVE identifiers or vendor advisories.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A chart shared by a16z, using Epoch AI data from 21 major software companies, showed reported critical and high CVEs rising from fewer than 100 per month to more than 600 per month since spring 2026.","The article attributes much of the reported CVE increase to AI making it faster to discover bugs that may have existed for years, rather than software suddenly becoming less secure.","A federal audit found that NIST's vulnerability-scoring backlog grew from 13,000 to more than 27,000 items over eighteen months, prompting NIST to prioritize selected CVEs instead of scoring every one.","Verizon's 2026 Data Breach Investigations Report found that only 26% of confirmed actively exploited vulnerabilities on CISA's KEV list were fully remediated in 2025, while the median time to patch rose to 43 days.","The article says Aikido Intel identified the Stylesmuggler remote-code-execution issue affecting Adobe Commerce and Magento Open Source before Adobe released its hotfix, and Aikido Libraries provided fixes for affected versions."],"insights":["Raw CVE totals and a stable list of known exploited flaws are insufficient measures of risk because the article frames risk around identifying which issues matter and how quickly they are fixed.","NIST's growing scoring backlog shows that treating every newly disclosed flaw as equally urgent does not scale, leading it to prioritize issues tied to federal use, critical software, or CISA's known-exploited list.","The Stylesmuggler case illustrates that a flaw can be actively exploited before it receives a CVE identifier or a vendor advisory, making reliance on official notices alone too slow.","The article reports that 67% of packages in which Aikido Intel found vulnerabilities during its first year had never been publicly disclosed in major vulnerability databases."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"verizon","context":"The article cites Verizon's report for remediation rates and patching times for vulnerabilities listed as actively exploited by CISA.","category":"research","primary":false}],"body":"\u003cp\u003eA chart shared by a16z using Epoch AI data showed reported critical and high CVEs across 21 major software companies rising from fewer than 100 per month to more than 600 per month since spring 2026. The article argues that this increase is likely driven largely by AI making it easier to find long-existing bugs, rather than by software suddenly becoming less secure. It says neither raw CVE volume nor a flat count of known exploited vulnerabilities alone determines real-world risk.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies remediation as the main bottleneck, citing Verizon’s 2026 Data Breach Investigations Report, which found that only 26% of confirmed actively exploited CISA KEV vulnerabilities were fully remediated in 2025 and that median time to patch rose to 43 days. It also notes that NIST’s vulnerability-scoring backlog grew from 13,000 to more than 27,000 items over eighteen months, prompting prioritization rather than scoring every CVE. Using the Stylesmuggler issue affecting Adobe Commerce and Magento Open Source as an example, the article argues that organizations should identify reachable, exploitable flaws and fix them quickly instead of waiting for CVE identifiers or vendor advisories.\u003c/p\u003e\n"},{"n":11,"title":"Two chicken nuggets and a Claude account","source":"blog.castle.io","sourceColorIdx":8,"link":"https://blog.castle.io/two-chicken-nuggets-and-a-claude-account/","time":"11:43","priority":"MAY READ","score":55,"tldr":"LLMs are making bot development and anti-bot reverse engineering more efficient, while access to capable models is itself becoming a fraud target. Attackers are increasingly farming accounts, abusing trials and payments, and reselling AI inference, so products offering AI features need conventional anti-fraud controls as well as model-security safeguards.","briefOverview":"\u003cp\u003eThe article argues that large language models such as Claude and ChatGPT are becoming routine tools for bot developers working on code, debugging, reverse engineering, and anti-bot bypasses. The author says these tools raise the baseline for average developers and help skilled reverse engineers work faster, even though a complete bypass is not necessarily achievable with one prompt. Ghostwire is cited as an example of tooling that captures JavaScript runtime activity and can provide Claude with execution traces through MCP, giving the model more context than obfuscated code alone.\u003c/p\u003e\n\n\u003cp\u003eThe author’s team has encountered exposed or poorly secured infrastructure used to create and manage many ChatGPT and Claude accounts, alongside public tools for automated OpenAI registration and web-based model use. These accounts may be used for included credits, free trials, consumer subscriptions, fraudulent-payment-funded usage, or resale of access at lower-than-normal prices. The article concludes that any company offering AI-powered features, including summaries, SQL generation, support answers, or email writing, should consider account farming, payment fraud, automation, and resale because model usage has a direct cost.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says large language models such as Claude and ChatGPT have become part of bot developers’ workflows for code generation, debugging, reverse engineering, and anti-bot bypass development.","Ghostwire is described as an open-source project that instruments JavaScript at runtime through Chrome DevTools Protocol and can provide Claude with execution traces through Model Context Protocol.","The author’s team has repeatedly encountered exposed or poorly secured infrastructure used to create and manage large numbers of ChatGPT and Claude accounts.","The article cites public tools including turb-gpt-free-register for automated ChatGPT/OpenAI registration and Codex OAuth authorization, and gpt-webcodex for connecting ChatGPT’s web version to a local development environment.","The article argues that businesses offering bundled AI usage should address classic abuse risks such as fake accounts, payment fraud, automation, account farming, and resale."],"insights":["AI account farming is framed not merely as misuse of free trials, but as an effort to obtain valuable computing capacity that can be pooled, resold, or accessed more cheaply than standard API pricing.","Runtime traces from tools such as Ghostwire can give an AI model more useful context for examining website defenses than supplying it only with a large block of scrambled JavaScript code.","A narrow AI feature in an ordinary software product, such as document summaries or SQL generation, can be viewed by an abuser as a fixed number of reusable model requests per account.","The article emphasizes that protecting AI features requires attention to established fraud problems—such as fake accounts, automated signups, fraudulent payments, and resale—in addition to concerns about prompts and model behavior."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that large language models such as Claude and ChatGPT are becoming routine tools for bot developers working on code, debugging, reverse engineering, and anti-bot bypasses. The author says these tools raise the baseline for average developers and help skilled reverse engineers work faster, even though a complete bypass is not necessarily achievable with one prompt. Ghostwire is cited as an example of tooling that captures JavaScript runtime activity and can provide Claude with execution traces through MCP, giving the model more context than obfuscated code alone.\u003c/p\u003e\n\n\u003cp\u003eThe author’s team has encountered exposed or poorly secured infrastructure used to create and manage many ChatGPT and Claude accounts, alongside public tools for automated OpenAI registration and web-based model use. These accounts may be used for included credits, free trials, consumer subscriptions, fraudulent-payment-funded usage, or resale of access at lower-than-normal prices. The article concludes that any company offering AI-powered features, including summaries, SQL generation, support answers, or email writing, should consider account farming, payment fraud, automation, and resale because model usage has a direct cost.\u003c/p\u003e\n"},{"n":10,"title":"The agentic harness for Tenable Hexa AI: How Tenable prevents AI agents from going off the rails","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/how-agentic-harness-works-tenable-hexa-ai","time":"13:00","priority":"MAY READ","score":52,"tldr":"Tenable says its Hexa AI uses an external “agentic harness” to restrict permissions, defend against prompt injection, require human approval for changes, and maintain auditable records. The company argues that these controls and continuous safety evaluations are essential for safely delegating production security tasks to AI agents.","briefOverview":"\u003cp\u003eTenable describes the agentic harness it built for Tenable Hexa AI, the agentic AI engine in its Tenable One Exposure Management Platform. The harness is a control layer outside the AI model that determines what information the model can view, what tools it can use, what actions require validation or human approval, and what records are retained. Tenable says this approach treats AI agents as untrusted insiders rather than relying on the model to follow instructions on its own.\u003c/p\u003e\n\n\u003cp\u003eThe article says unguarded agents can exceed a requester’s authority, invent details about a customer environment, fail on oversized or vague tasks, and be influenced by instructions embedded in attacker-controlled security data such as hostnames or service banners. Tenable routes tasks into narrower steps, applies permission checks at every tool call, limits token use and recursive work, screens content before and after model calls, and requires written approval before any state-changing action. It also runs functional and safety evaluation suites against changes, with any unexpected destructive call causing a failed evaluation regardless of other results.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tenable describes an agentic harness for Tenable Hexa AI that controls what the model can access, which tools it may use, what must be checked before an action occurs, when human approval is required, and what is recorded afterward.","The article says AI agents can act beyond a requester’s authority, make confident but incorrect claims about a customer environment, fail on large or vague queries, or be manipulated by instructions embedded in attacker-influenced security data.","Tenable states that each tool call passes through permission checks, so the AI agent operates with the invoking user’s entitlements and cannot access or change items beyond those permissions.","Before any change is made, Tenable Hexa AI produces a proposal describing affected devices, the planned policy and schedule, and potential scope, then waits for the user to approve, narrow, widen, or reject it.","Tenable runs separate functional and safety evaluation suites for changes to its AI system, and any evaluation run that makes an unexpected destructive call fails regardless of other scores."],"insights":["Security-platform data itself can be an AI prompt-injection route because attacker-influenced fields such as hostnames, certificate fields, service banners, and finding descriptions may contain text that a model treats as instructions.","Overly strict safety controls can become a product failure: Tenable found that conservative filtering created false positives that could persist across a session, making legitimate work appear broken.","The article treats a partial response as preferable to failure for oversized tasks, using token, recursion, and step limits to prevent an agent from consuming resources indefinitely.","Tenable says action risk should scale with scope: broad operations must have their full set of affected devices listed and explicitly approved, while some capabilities require an administrator to enable them for a customer.","Tenable uses a fixed, isolated evaluation environment and a pinned baseline so model or prompt changes can be measured for regressions instead of relying on user reports or subjective impressions."],"referencedReports":[],"body":"\u003cp\u003eTenable describes the agentic harness it built for Tenable Hexa AI, the agentic AI engine in its Tenable One Exposure Management Platform. The harness is a control layer outside the AI model that determines what information the model can view, what tools it can use, what actions require validation or human approval, and what records are retained. Tenable says this approach treats AI agents as untrusted insiders rather than relying on the model to follow instructions on its own.\u003c/p\u003e\n\n\u003cp\u003eThe article says unguarded agents can exceed a requester’s authority, invent details about a customer environment, fail on oversized or vague tasks, and be influenced by instructions embedded in attacker-controlled security data such as hostnames or service banners. Tenable routes tasks into narrower steps, applies permission checks at every tool call, limits token use and recursive work, screens content before and after model calls, and requires written approval before any state-changing action. It also runs functional and safety evaluation suites against changes, with any unexpected destructive call causing a failed evaluation regardless of other results.\u003c/p\u003e\n"},{"n":12,"title":"Cyble Introduces Major Upgrade to its Executive Monitoring Module","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/cyble-major-upgrades-to-executive-monitoring-module/","time":"12:26","priority":"MAY READ","score":38,"tldr":"Cyble has upgraded Executive Monitoring in Cyble Vision with a unified findings feed, AI-generated risk verdicts and recommendations, executive risk and reputation scoring, and expanded alerts and reporting. The update is already available to existing customers without requiring action.","briefOverview":"\u003cp\u003eCyble has released a major upgrade to Executive Monitoring within Cyble Vision, with the update now live for existing customers without required action. The module combines Mentions, Impersonations, Exposures, and a new Surface Mentions source for blog and news coverage into one findings stream. Cyble says this removes the need for teams to correlate executive-related risks across separate tools.\u003c/p\u003e\n\n\u003cp\u003eThe update adds a Risk and Reputation score for each monitored executive, plus AI-generated verdicts and recommended next steps for findings. Executive profiles can now include aliases, multiple reference images, and known addresses to reduce same-name false positives. It also introduces data residency support, bulk importing, alerts through email, WhatsApp, and SMS, Access API integrations, and branded PDF reports for leadership.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyble has upgraded the Executive Monitoring module in Cyble Vision, and the update is live for existing customers without requiring action.","The module now combines Mentions, Impersonations, Exposures, and a new Surface Mentions source for blog and news coverage into one findings stream.","Each monitored executive receives a Risk and Reputation score, while each finding includes an AI-generated verdict and recommended next step.","Executive onboarding now supports aliases, multiple reference images, and known addresses to reduce false matches involving people with the same name.","Alerts can be delivered by email, WhatsApp, or SMS, and the platform can generate branded executive PDF reports."],"insights":["The update addresses a common operational problem: security teams previously had to correlate executive-related findings across separate impersonation, exposure, and reputation tools whose measurements did not always align.","Adding aliases, reference images, and known addresses at onboarding is intended to prevent same-name false positives before they reach analysts, rather than only filtering them after alerts are generated.","Surface Mentions expands monitoring beyond dark-web and social sources by incorporating blog and news references to executives.","Data residency support and branded PDF reporting are positioned as features that can help regulated and enterprise customers meet RFP, regulatory, and audit expectations.","Access API integrations and delivery through email, WhatsApp, or SMS are designed to put findings into teams' existing workflows instead of requiring them to watch another platform."],"referencedReports":[],"body":"\u003cp\u003eCyble has released a major upgrade to Executive Monitoring within Cyble Vision, with the update now live for existing customers without required action. The module combines Mentions, Impersonations, Exposures, and a new Surface Mentions source for blog and news coverage into one findings stream. Cyble says this removes the need for teams to correlate executive-related risks across separate tools.\u003c/p\u003e\n\n\u003cp\u003eThe update adds a Risk and Reputation score for each monitored executive, plus AI-generated verdicts and recommended next steps for findings. Executive profiles can now include aliases, multiple reference images, and known addresses to reduce same-name false positives. It also introduces data residency support, bulk importing, alerts through email, WhatsApp, and SMS, Access API integrations, and branded PDF reports for leadership.\u003c/p\u003e\n"},{"n":13,"title":"From Infostealer Log to Marketplace Listing: A Technical Walkthrough of the Credential Theft Pipeline","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/infostealer-malware-credential-theft-pipeline/","time":"10:45","priority":"MAY READ","score":35,"tldr":"Infostealer infections harvest browser credentials, cookies, and device data, which attackers aggregate, enrich, and sell as targeted access on criminal marketplaces. Organizations should monitor for exposed stealer logs and related marketplace activity early rather than wait for a breach disclosure.","briefOverview":"\u003cp\u003eInfostealer malware can infect a device through cracked software installers, fake game cheats, malicious browser extensions, or phishing lures. It collects saved browser credentials, cookies, session tokens, payment details, cryptocurrency wallet files, FTP client settings, and device information. The collected data is stored in a structured folder known as a log, which can contain everything the malware obtained from a single machine. An organization can be exposed when an employee’s work credentials are taken from a personal device outside the organization’s perimeter.\u003c/p\u003e\n\n\u003cp\u003eThreat actors collect logs from many infected devices through command-and-control dashboards, bundle them into archives, and sort them for valuable accounts such as corporate VPNs, SaaS administration panels, and banking portals. They then parse the logs into searchable fields and may add context from earlier leaked data, including an account holder’s employer or job title, increasing the value of targeted credentials. The resulting logs can be sold in bulk or as individual access credentials on dark web marketplaces, with details such as infection date, geography, and browser type. The article argues that monitoring stealer logs, marketplace activity, and credential enrichment can provide earlier warning than waiting for a breach disclosure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infostealer malware commonly arrives through cracked software installers, fake game cheats, malicious browser extensions, or phishing lures and collects browser credentials, cookies, session tokens, payment details, cryptocurrency wallet files, FTP configurations, and system information.","Threat actors collect logs from many infected machines through command-and-control dashboards, bundle them into archives, and sort or screen them for valuable accounts such as corporate VPN logins, SaaS administration panels, and banking portals.","Attackers parse raw logs into searchable username, password, URL, and cookie fields, and may enrich them with information from previously leaked data sets, such as an account holder’s employer or job title.","Parsed and enriched logs can be sold on dark web marketplaces and forums as bulk archives or as individual access credentials, often with metadata including infection date, geography, and browser type.","The article argues that monitoring stealer logs, marketplace discussions, and credential-enrichment activity can provide earlier warning of exposure than waiting for a breach disclosure."],"insights":["A company’s credential exposure can begin on a personal device outside its network perimeter, rather than through a direct intrusion into the organization.","Session cookies and tokens can be especially valuable because they may let an attacker bypass the normal login screen entirely.","Adding employer or job-title information to a stolen credential can substantially increase its value by identifying high-value accounts such as IT administrators.","Marketplace listings may be the first realistic point at which an outside security team can observe stolen credentials, but credentials may already have been sold or tested by then.","Metadata such as infection date, geography, and browser type helps buyers judge whether stolen access is recent and relevant."],"referencedReports":[],"body":"\u003cp\u003eInfostealer malware can infect a device through cracked software installers, fake game cheats, malicious browser extensions, or phishing lures. It collects saved browser credentials, cookies, session tokens, payment details, cryptocurrency wallet files, FTP client settings, and device information. The collected data is stored in a structured folder known as a log, which can contain everything the malware obtained from a single machine. An organization can be exposed when an employee’s work credentials are taken from a personal device outside the organization’s perimeter.\u003c/p\u003e\n\n\u003cp\u003eThreat actors collect logs from many infected devices through command-and-control dashboards, bundle them into archives, and sort them for valuable accounts such as corporate VPNs, SaaS administration panels, and banking portals. They then parse the logs into searchable fields and may add context from earlier leaked data, including an account holder’s employer or job title, increasing the value of targeted credentials. The resulting logs can be sold in bulk or as individual access credentials on dark web marketplaces, with details such as infection date, geography, and browser type. The article argues that monitoring stealer logs, marketplace activity, and credential enrichment can provide earlier warning than waiting for a breach disclosure.\u003c/p\u003e\n"}]</script>
