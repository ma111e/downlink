<script type="application/json" id="dl-articles">[{"n":2,"title":"When Authentication Passes and Malware Still Walks In: A PE Hidden Inside an Inline PNG","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/authenticated-email-embedded-pe-inline-png-idat-malware","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A fully authenticated onboarding email passed SPF, DKIM, and DMARC but hid a Windows executable inside the decompressed IDAT stream of an inline PNG image. The key lesson is that email authentication proves sender path integrity, not content safety, so defenders must inspect inline image payloads and other embedded content.","briefOverview":"\u003cp\u003eAn onboarding email reached an insurance claims examiner’s inbox and appeared to be a routine new-user account setup message for a claims-management platform. The message passed SPF, DKIM, and DMARC, with DMARC passing under a reject policy and a composite authentication score of 100. The article emphasizes that these checks confirmed the message traveled through an authorized mail path and arrived unaltered, but did not prove the content was safe.\u003c/p\u003e\n\n\u003cp\u003eThe email contained three inline PNG images, and one file named image007.png carried a Windows executable inside its image data. The PNG was structurally valid and renderable, but its zlib-compressed IDAT stream decompressed to roughly 6.5 MB and contained the “MZ” Windows PE signature at offset 696,056. The article maps the activity to MITRE ATT\u0026amp;CK T1566.001 for spearphishing attachment and T1027 for obfuscated or embedded payloads.\u003c/p\u003e\n\n\u003cp\u003eThe article states that inline images are often treated differently from attachments by secure email gateways, which may render or header-check images without deeply inspecting their decompressed contents. It argues that detecting this case requires decompressing PNG IDAT streams and scanning the resulting bytes for embedded file signatures such as MZ and PE markers. The published indicators focus on the weaponized image file and its hashes rather than sender domains or URLs, because the message authenticated through a legitimate mail path.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An onboarding email to an insurance claims examiner passed SPF, DKIM, and DMARC, with a composite authentication score of 100.","One inline image named image007.png was a valid, renderable PNG that contained a Windows PE header inside its decompressed IDAT stream.","The executable signature appeared as the bytes \"MZ\" at offset 696,056 inside a roughly 6.5 MB decompressed payload.","The article states that many secure email gateways inspect attachments more deeply than inline images, allowing this kind of embedded payload to slip through.","The publishable indicators include the file name image007.png, MD5 hash 4370319336a256e38dedae0c95414090, and SHA-256 hash 70fb798321c7b92e65a78a172a4429f3009216efef1c86118efd747dcceb638d."],"insights":["The article emphasizes that SPF, DKIM, and DMARC passing should not be treated as a safety verdict because they validate the sending route and message integrity, not whether the email body contains malicious content.","The technique was more evasive than simply appending a binary after a PNG end marker, because the executable bytes were placed inside the legitimate compressed image stream while the PNG still parsed and rendered normally.","The article identifies a specific inspection gap: scanners must decompress PNG IDAT data and examine the resulting bytes for embedded file signatures such as MZ to detect this payload.","The article argues that blocking the authenticated sender domain would be the wrong response because the durable attacker-controlled indicators were the weaponized image file and its hashes, not the legitimate mail path.","Mixed branding in the message body was presented as a weak signal individually but a stronger trust warning when combined with other inconsistencies, even though authentication checks passed."],"referencedReports":[{"title":"Verizon 2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites it for the claim that phishing remains a leading initial-access vector and accounts for roughly 16 percent of breaches.","category":"","primary":false},{"title":"Microsoft 2024 Digital Defense Report","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references it as support for moving defenders toward content and behavioral inspection rather than relying only on signatures and reputation.","category":"","primary":false},{"title":"CISA Cybersecurity Advisories","url":"https://www.cisa.gov/news-events/cybersecurity-advisories","publisher":"CISA","context":"The article cites CISA advisories alongside Microsoft’s report as support for content and behavioral inspection over signature and reputation alone.","category":"","primary":false},{"title":"FBI IC3 2024 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article references it for the point that email-borne fraud and malware delivery remain among the costliest reported categories.","category":"","primary":false}],"body":"\u003cp\u003eAn onboarding email reached an insurance claims examiner’s inbox and appeared to be a routine new-user account setup message for a claims-management platform. The message passed SPF, DKIM, and DMARC, with DMARC passing under a reject policy and a composite authentication score of 100. The article emphasizes that these checks confirmed the message traveled through an authorized mail path and arrived unaltered, but did not prove the content was safe.\u003c/p\u003e\n\n\u003cp\u003eThe email contained three inline PNG images, and one file named image007.png carried a Windows executable inside its image data. The PNG was structurally valid and renderable, but its zlib-compressed IDAT stream decompressed to roughly 6.5 MB and contained the “MZ” Windows PE signature at offset 696,056. The article maps the activity to MITRE ATT\u0026amp;CK T1566.001 for spearphishing attachment and T1027 for obfuscated or embedded payloads.\u003c/p\u003e\n\n\u003cp\u003eThe article states that inline images are often treated differently from attachments by secure email gateways, which may render or header-check images without deeply inspecting their decompressed contents. It argues that detecting this case requires decompressing PNG IDAT streams and scanning the resulting bytes for embedded file signatures such as MZ and PE markers. The published indicators focus on the weaponized image file and its hashes rather than sender domains or URLs, because the message authenticated through a legitimate mail path.\u003c/p\u003e\n"},{"n":1,"title":"Flipper Zero firmware development continues with community help","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/flipper-zero-firmware-development-continues-with-community-help/","time":"14:14","priority":"MAY READ","score":62,"tldr":"Flipper Devices says Flipper Zero firmware will continue to be maintained, but full-time feature development is ending as the company shifts resources to new devices. Future improvements will rely more heavily on community requests, votes, pull requests, and testing through GitHub Discussions.","briefOverview":"\u003cp\u003eFlipper Devices says development of the Flipper Zero firmware will continue, but with a smaller internal team and greater reliance on community contributions. The company decided to focus on building new devices, including the Flipper One open Linux platform and the Busy Bar productivity device. It stated that the official firmware for the Flipper Zero portable pen-testing device will still be maintained, but full-time feature development is now over.\u003c/p\u003e\n\n\u003cp\u003eFlipper Zero Firmware 1.0 was announced in September 2024 after three years of development, and the latest official stable release is version 1.4.3 from December 2025. The team said the firmware had reached maturity, with a stable SDK and APIs and all promised features implemented. After interviews and online discussions gave the impression that firmware development had stopped, community backlash led the team to outline a new approach for keeping the project moving.\u003c/p\u003e\n\n\u003cp\u003eUnder the new process, Flipper Zero requests will be evaluated weekly and handled through GitHub Discussions, where users can also vote on priorities. Community pull requests will be accepted with stricter review requirements, and firmware changes will require mandatory integration and regression testing that is open to the community. Flipper Devices said it will pay particular attention to AI-generated code affecting low-level functions, user interface changes, and changes requiring documentation updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Flipper Devices says development of the Flipper Zero firmware will continue with a smaller internal team and greater reliance on community contributions.","The company said the official Flipper Zero firmware will still be maintained, but full-time feature development is now over.","Flipper Zero Firmware 1.0 was announced in September 2024 after three years of development, and the latest official stable release is version 1.4.3 from December 2025.","The new project process will route requests through GitHub Discussions, where users can vote on priorities and community pull requests will face stricter review requirements.","Flipper Devices said more than one million Flipper Zero users generate more communication than its small team can manage, leading it to disable direct messages on all social media channels."],"insights":["Community backlash appears to have directly influenced Flipper Devices’ decision to define a clearer ongoing maintenance model for Flipper Zero firmware.","The company considers the firmware mature enough to reduce internal feature work because it says the SDK, APIs, and promised features are already stable and implemented.","Future firmware priorities will be shaped by public voting in GitHub Discussions rather than direct communication with the company.","Flipper Devices singled out AI-generated low-level code, user interface changes, and documentation-impacting changes as areas that will receive particular scrutiny during review."],"referencedReports":[],"body":"\u003cp\u003eFlipper Devices says development of the Flipper Zero firmware will continue, but with a smaller internal team and greater reliance on community contributions. The company decided to focus on building new devices, including the Flipper One open Linux platform and the Busy Bar productivity device. It stated that the official firmware for the Flipper Zero portable pen-testing device will still be maintained, but full-time feature development is now over.\u003c/p\u003e\n\n\u003cp\u003eFlipper Zero Firmware 1.0 was announced in September 2024 after three years of development, and the latest official stable release is version 1.4.3 from December 2025. The team said the firmware had reached maturity, with a stable SDK and APIs and all promised features implemented. After interviews and online discussions gave the impression that firmware development had stopped, community backlash led the team to outline a new approach for keeping the project moving.\u003c/p\u003e\n\n\u003cp\u003eUnder the new process, Flipper Zero requests will be evaluated weekly and handled through GitHub Discussions, where users can also vote on priorities. Community pull requests will be accepted with stricter review requirements, and firmware changes will require mandatory integration and regression testing that is open to the community. Flipper Devices said it will pay particular attention to AI-generated code affecting low-level functions, user interface changes, and changes requiring documentation updates.\u003c/p\u003e\n"}]</script>
