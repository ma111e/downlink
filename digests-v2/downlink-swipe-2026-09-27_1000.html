<script type="application/json" id="dl-articles">[{"n":2,"title":"Google Calendar Phishing: One Link, Two Scanner Verdicts","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/same-destination-two-scanner-verdicts-google-calendar-url-wrapper","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"Attackers abused Google Calendar to send a fully authenticated phishing invite containing a Google redirect link to a domain registered only 29 minutes earlier, causing URL scanners to rate the trusted wrapper clean while the underlying destination received only a partial warning. The incident shows that email defenses must resolve and assess final destinations rather than trust platform redirectors or sender authentication.","briefOverview":"\u003cp\u003eAn attacker created a Google Calendar event titled “New Voice Recording Received,” placed a voicemail-themed lure in its description, and invited a VIP mailbox at a digital advertising group. Google Calendar sent the notification through its legitimate infrastructure, with SPF, DKIM, and DMARC all passing. The message included a “Listen to voicemail” link that Google rewrote through its own google.com URL redirector.\u003c/p\u003e\n\n\u003cp\u003eThe final destination, voiceml[.]space, was registered only 29 minutes and 26 seconds before Google sent the notification. A scan of the bare destination returned a partial “Mixed Result” verdict, while the Google redirect URL was marked clean, despite leading to the same site. The article argues that URL defenses should resolve redirectors and evaluate the final destination, while calendar notifications should assess the event organizer and Reply-To rather than relying only on Google’s trusted sender identity.\u003c/p\u003e\n\n\u003cp\u003eThe message was ultimately reported by its recipient and mitigated after a human manual finding identified the voicemail link as malicious. The article notes that Google’s duplicated description text in hidden preview and metadata fields was normal template behavior, not attacker obfuscation. It presents the incident as an example of attackers borrowing trusted productivity platforms for delivery and authentication while using newly registered infrastructure that has little or no established reputation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker placed a voicemail lure in a Google Calendar event description and invited a VIP mailbox at a digital advertising group, prompting Google to send an authenticated calendar notification.","The malicious destination voiceml[.]space was registered 29 minutes and 26 seconds before Google sent the notification, and the bare URL received a partial \"Mixed Result\" scanner verdict.","Google Calendar rewrote the lure link through a google.com redirector, which was scanned as clean even though its q parameter led to the same destination.","SPF, DKIM, and DMARC all passed because the message was genuinely sent by Google Calendar rather than forged by the attacker.","The recipient reported the suspicious message, and the message was mitigated after a human manual approval recorded the malicious finding."],"insights":["A clean verdict for a Google redirect URL assessed the trusted Google wrapper rather than the website ultimately reached by the recipient, demonstrating why redirectors should be resolved before reputation scoring.","Sender-history and authentication checks were ineffective by design because the attacker used Google’s legitimate Calendar notification service, which already had an established relationship with the recipient organization.","The event organizer and Reply-To address provided more useful attribution signals than the visible Google sender, because both pointed to an unrelated third-party mailbox.","The message body repeated the event description in hidden preview and metadata fields due to Google’s standard notification template, so treating those duplicates as attacker obfuscation would create a false finding.","The recipient’s report was the control that resolved conflicting automated URL verdicts and led to mitigation of the message."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites Figure 54 for the distribution of email gateway-blocked phishing attack types and later cites DBIR statistics on the human element and phishing initial access.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA's guidance while recommending that organizations score the final destination behind trusted URL redirectors.","category":"guide","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites the FBI IC3 report in discussing the losses associated with successful phishing.","category":"research","primary":false}],"body":"\u003cp\u003eAn attacker created a Google Calendar event titled “New Voice Recording Received,” placed a voicemail-themed lure in its description, and invited a VIP mailbox at a digital advertising group. Google Calendar sent the notification through its legitimate infrastructure, with SPF, DKIM, and DMARC all passing. The message included a “Listen to voicemail” link that Google rewrote through its own google.com URL redirector.\u003c/p\u003e\n\n\u003cp\u003eThe final destination, voiceml[.]space, was registered only 29 minutes and 26 seconds before Google sent the notification. A scan of the bare destination returned a partial “Mixed Result” verdict, while the Google redirect URL was marked clean, despite leading to the same site. The article argues that URL defenses should resolve redirectors and evaluate the final destination, while calendar notifications should assess the event organizer and Reply-To rather than relying only on Google’s trusted sender identity.\u003c/p\u003e\n\n\u003cp\u003eThe message was ultimately reported by its recipient and mitigated after a human manual finding identified the voicemail link as malicious. The article notes that Google’s duplicated description text in hidden preview and metadata fields was normal template behavior, not attacker obfuscation. It presents the incident as an example of attackers borrowing trusted productivity platforms for delivery and authentication while using newly registered infrastructure that has little or no established reputation.\u003c/p\u003e\n"},{"n":1,"title":"Anthropic turns Claude into an AI marketplace with 2,000+ plugins and connectors","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-turns-claude-into-an-ai-marketplace-with-2-000-plus-plugins-and-connectors/","time":"13:38","priority":"MAY READ","score":55,"tldr":"Anthropic launched the Claude Marketplace with more than 2,000 plugins, connectors, agents, and consulting offerings, aiming to make Claude a central platform for third-party AI integrations and products.","briefOverview":"\u003cp\u003eAnthropic has launched a public Claude Marketplace that brings together AI-related plugins, connectors, agents, and other products. The marketplace already offers more than 2,000 connectors and plugins, including offerings from Atlassian, Google, Microsoft, Notion, and Salesforce. Companies can also purchase Claude-powered agents and products from partners such as CrowdStrike, Cursor, Harvey, Legora, Lovable, and Snowflake.\u003c/p\u003e\n\n\u003cp\u003eThe marketplace also includes consulting and systems integration partners, including Accenture, Boston Consulting Group, and Deloitte, for organizations seeking help deploying Claude. Developers can create connectors and plugins using Model Context Protocol (MCP) and Agent Skills, while companies selling Claude-powered software can apply for marketplace listings. Anthropic says the marketplace is intended to help teams find products that work with Claude and give developers and partners a direct route to Claude customers, though the article notes that a similar OpenAI apps marketplace did not succeed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic has launched a public Claude Marketplace offering more than 2,000 connectors and plugins.","The marketplace includes integrations from companies including Atlassian, Google, Microsoft, Notion, and Salesforce.","Companies can buy Claude-powered agents and products from partners such as CrowdStrike, Cursor, Harvey, Legora, Lovable, and Snowflake.","Developers can build and publish Claude connectors and plugins using Model Context Protocol and Agent Skills.","The marketplace also lists consulting and systems integration partners, including Accenture, Boston Consulting Group, and Deloitte, for organizations deploying Claude."],"insights":["Claude Marketplace extends beyond basic app connections by combining plugins, connectors, Claude-powered agents, partner products, and consulting services in one place.","Anthropic is opening publishing to developers through Model Context Protocol and Agent Skills, rather than limiting the marketplace to its own offerings or a small set of partners.","The article notes that OpenAI’s similar apps marketplace did not succeed, highlighting that major-company integrations alone may not determine whether Claude Marketplace gains traction."],"referencedReports":[],"body":"\u003cp\u003eAnthropic has launched a public Claude Marketplace that brings together AI-related plugins, connectors, agents, and other products. The marketplace already offers more than 2,000 connectors and plugins, including offerings from Atlassian, Google, Microsoft, Notion, and Salesforce. Companies can also purchase Claude-powered agents and products from partners such as CrowdStrike, Cursor, Harvey, Legora, Lovable, and Snowflake.\u003c/p\u003e\n\n\u003cp\u003eThe marketplace also includes consulting and systems integration partners, including Accenture, Boston Consulting Group, and Deloitte, for organizations seeking help deploying Claude. Developers can create connectors and plugins using Model Context Protocol (MCP) and Agent Skills, while companies selling Claude-powered software can apply for marketplace listings. Anthropic says the marketplace is intended to help teams find products that work with Claude and give developers and partners a direct route to Claude customers, though the article notes that a similar OpenAI apps marketplace did not succeed.\u003c/p\u003e\n"}]</script>
