<script type="application/json" id="dl-articles">[{"n":1,"title":"GitHub, PyPI add time-absed defenses against supply chain attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/github-pypi-add-time-absed-defenses-against-supply-chain-attacks/","time":"14:13","priority":"SHOULD READ","score":82,"tldr":"GitHub and PyPI are adding time-based safeguards to reduce supply-chain risk: Dependabot now waits 72 hours before suggesting new dependency updates, and PyPI blocks adding files to releases after 14 days. The goal is to limit how quickly malicious or compromised packages can spread before detection and cleanup.","briefOverview":"\u003cp\u003eGitHub and PyPI have introduced time-based defenses meant to reduce supply-chain attacks and limit their impact. Dependabot now has a default three-day cooldown before issuing dependency update pull requests, while PyPI now rejects new files uploaded to releases older than 14 days. The measures follow multiple high-profile attacks affecting development ecosystems over the past year, including the chalk and debug attacks, s1ngularity, Shai-Hulud, and GhostAction.\u003c/p\u003e\n\n\u003cp\u003eGitHub said Dependabot’s 72-hour delay is intended to reduce the risk of projects automatically adopting newly published malicious packages. The company said many recent malicious npm packages were detected and flagged within minutes, but maintainers and vendors still needed time to remove them. GitHub chose three days as a balance between avoiding risky releases and keeping up with upgrades, and users can configure the cooldown to be shorter or longer.\u003c/p\u003e\n\n\u003cp\u003ePyPI’s 14-day cutoff is designed to stop attackers who compromise publishing tokens or workflows from adding malicious files to old, trusted releases. PyPI said only a very small percentage of projects legitimately uploaded files more than two weeks after publishing a release. The article notes that no known past PyPI attacks have been confirmed to use this release poisoning technique, but PyPI is acting preventatively to block the possibility.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub and PyPI introduced time-based defenses intended to protect against supply-chain attacks and limit their impact.","Dependabot now uses a default three-day cooldown before issuing package update pull requests, with users able to configure a shorter or longer delay.","GitHub said the three-day delay is meant to reduce the risk of automatically adopting newly published malicious packages while still allowing projects to keep up with upgrades.","PyPI now rejects new files uploaded to package releases more than 14 days after the release was published.","PyPI said the 14-day cutoff is intended to prevent attackers with compromised publishing tokens or workflows from poisoning old, trusted releases."],"insights":["GitHub chose a 72-hour Dependabot cooldown because recent malicious npm packages were often detected within minutes, but the remaining risk came from the time needed for maintainers and vendors to remove them.","Dependabot’s cooldown is not a complete defense against longer-term package compromise, so GitHub still recommends lockfiles, restricted-scope tokens, and disabling unnecessary installation scripts in CI.","PyPI’s 14-day cutoff is preventive rather than reactive, since the article says no confirmed past PyPI attacks have used the release-poisoning technique it blocks.","PyPI found that only a very small percentage of projects legitimately uploaded files more than two weeks after publishing a release, which made the cutoff less disruptive."],"referencedReports":[],"body":"\u003cp\u003eGitHub and PyPI have introduced time-based defenses meant to reduce supply-chain attacks and limit their impact. Dependabot now has a default three-day cooldown before issuing dependency update pull requests, while PyPI now rejects new files uploaded to releases older than 14 days. The measures follow multiple high-profile attacks affecting development ecosystems over the past year, including the chalk and debug attacks, s1ngularity, Shai-Hulud, and GhostAction.\u003c/p\u003e\n\n\u003cp\u003eGitHub said Dependabot’s 72-hour delay is intended to reduce the risk of projects automatically adopting newly published malicious packages. The company said many recent malicious npm packages were detected and flagged within minutes, but maintainers and vendors still needed time to remove them. GitHub chose three days as a balance between avoiding risky releases and keeping up with upgrades, and users can configure the cooldown to be shorter or longer.\u003c/p\u003e\n\n\u003cp\u003ePyPI’s 14-day cutoff is designed to stop attackers who compromise publishing tokens or workflows from adding malicious files to old, trusted releases. PyPI said only a very small percentage of projects legitimately uploaded files more than two weeks after publishing a release. The article notes that no known past PyPI attacks have been confirmed to use this release poisoning technique, but PyPI is acting preventatively to block the possibility.\u003c/p\u003e\n"},{"n":2,"title":"DKIM and DMARC Passed. The $97,500 Wire Was Fraud.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/reply-to-hijack-authenticated-wire-diversion-bec","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A $97,500 wire-fraud email passed DKIM and DMARC because it was sent through a legitimate institution’s authorized mail stream, but a mismatched Reply-To redirected responses to the attacker. The key takeaway is that email authentication proves domain control, not that a payment request is legitimate, so high-value transactions still require out-of-band verification.","briefOverview":"\u003cp\u003eAn accounts-payable team received an invoice demanding a same-day $97,500 ACH or wire payment, styled as a reply to an already-approved item. The message passed DKIM and DMARC, was signed by a real federal cultural and research institution’s own mail stream through SendGrid, and received a Microsoft composite authentication score of 100. The article emphasizes that nothing cryptographic was broken and that the message was not a simple spoof.\u003c/p\u003e\n\n\u003cp\u003eThe fraud depended on a mismatched Reply-To header that reused the trusted display name but pointed to \u003ccode\u003emahalaxmitraders@waareepartners[.]com\u003c/code\u003e, an unrelated domain. If a finance clerk replied to ask about bank details or confirm payment, the response would go to the attacker rather than the institution. The email also included a SendGrid open-tracking pixel, which the article describes as live-target confirmation when the message was rendered.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main significance is that email authentication validated control of the sending domain, not the legitimacy of the payment request. IRONSCALES said its Adaptive AI analyst, Themis, flagged the message based on signals including the first-time sender, Reply-To mismatch, urgent large-dollar request, and community reputation signals, then quarantined it across all four affected mailboxes. The article recommends detection that weighs behavioral signals alongside authentication results and an out-of-band verification rule for new or changed bank details and same-day wires.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An accounts-payable team received an invoice demanding a same-day $97,500 ACH or wire payment that was framed as a reply to an already-approved item.","The message passed DKIM and DMARC, was signed by a real federal cultural and research institution’s own mail stream through SendGrid, and received a Microsoft composite authentication score of 100.","The fraud depended on a mismatched Reply-To address, mahalaxmitraders@waareepartners[.]com, which used the trusted display name but pointed replies to an unrelated domain controlled by the attacker.","The email included a SendGrid open-tracking pixel that could confirm when the target rendered the message.","IRONSCALES quarantined the message across all four affected mailboxes after its Adaptive AI analyst, Themis, flagged the first-time sender, Reply-To mismatch, urgent large-dollar request, and related reputation signals."],"insights":["A clean DKIM and DMARC result can increase risk if teams treat it as proof that the business request is legitimate, because in this case authentication only proved the domain’s mail stream was used.","A single Reply-To mismatch can be enough to run a business email compromise scheme without any malicious link, attachment, or broken cryptography.","Open-tracking pixels can function as reconnaissance in payment-fraud emails by confirming that a target mailbox is active and monitored.","Behavioral signals such as first-time sender status, urgent payment language, Reply-To mismatch, and newly provisioned remittance domains can catch fraud that authentication checks alone miss.","The article recommends that same-day wires and new or changed bank details be verified through a known channel outside email, regardless of how authoritative or authenticated the message appears."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites it for the claim that BEC represents roughly 3 percent of the gateway attack mix while carrying high per-incident cost.","category":"research","primary":false},{"title":"FBI IC3 2024 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article references it to note that BEC remains among the costliest categories of cybercrime tracked by IC3.","category":"research","primary":false},{"title":"CISA Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article cites CISA’s phishing guidance to support the point that authentication controls are necessary but insufficient by themselves.","category":"guide","primary":false}],"body":"\u003cp\u003eAn accounts-payable team received an invoice demanding a same-day $97,500 ACH or wire payment, styled as a reply to an already-approved item. The message passed DKIM and DMARC, was signed by a real federal cultural and research institution’s own mail stream through SendGrid, and received a Microsoft composite authentication score of 100. The article emphasizes that nothing cryptographic was broken and that the message was not a simple spoof.\u003c/p\u003e\n\n\u003cp\u003eThe fraud depended on a mismatched Reply-To header that reused the trusted display name but pointed to \u003ccode\u003emahalaxmitraders@waareepartners[.]com\u003c/code\u003e, an unrelated domain. If a finance clerk replied to ask about bank details or confirm payment, the response would go to the attacker rather than the institution. The email also included a SendGrid open-tracking pixel, which the article describes as live-target confirmation when the message was rendered.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main significance is that email authentication validated control of the sending domain, not the legitimacy of the payment request. IRONSCALES said its Adaptive AI analyst, Themis, flagged the message based on signals including the first-time sender, Reply-To mismatch, urgent large-dollar request, and community reputation signals, then quarantined it across all four affected mailboxes. The article recommends detection that weighs behavioral signals alongside authentication results and an out-of-band verification rule for new or changed bank details and same-day wires.\u003c/p\u003e\n"}]</script>
