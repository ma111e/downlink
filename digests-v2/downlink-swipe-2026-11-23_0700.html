<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA flags critical Cisco RCE flaw as actively exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-flags-critical-cisco-expressway-rce-flaw-as-actively-exploited/","time":"07:44","priority":"MUST READ","score":98,"tldr":"CISA added CVE-2026-76466, a critical Cisco Expressway flaw that enables unauthenticated root-level remote code execution on clustered devices, to its Known Exploited Vulnerabilities catalog after evidence of active attacks. Organizations should urgently apply Cisco’s patches, particularly for Internet-exposed Expressway systems.","briefOverview":"\u003cp\u003eCISA has added CVE-2026-76466, a critical vulnerability in Cisco Expressway, to its Known Exploited Vulnerabilities Catalog after determining that attackers are actively exploiting it. The flaw affects Cisco Expressway-C and Expressway-E devices configured in a cluster, which are used to connect enterprise voice and video systems with outside networks and remote users. CISA ordered U.S. Federal Civilian Executive Branch agencies to secure affected systems within three days under Binding Operational Directive 26-04. It also urged private-sector defenders to prioritize patching because the flaw may be targeted in ongoing attacks.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability results from hard-coded credentials and incomplete validation of client certificates. An unauthenticated attacker with the relevant cookies can connect to the database service and invoke specific remote procedure call commands, allowing arbitrary operating-system commands to run as root. Cisco released patches in late October and said at that time that its PSIRT had no knowledge of active exploitation or publicly available proof-of-concept exploits. CISA later tagged the issue as actively exploited.\u003c/p\u003e\n\n\u003cp\u003eF6 reported that attackers used an unnamed AI assistant to exploit the issue against internet-exposed Cisco Expressway devices and obtain root-level command execution. According to F6, they initially compromised two external devices and used one to access two further cluster nodes on the internal network. Afterward, the attackers prepared custom Python scripts to scan networks, identify SMB resources, interact with SQL Server and WinRM, and examine GitLab repositories for credentials and other sensitive information. The article also notes that CISA has added 103 Cisco vulnerabilities to its actively exploited list since November 2021, seven of which were used by ransomware gangs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-76466, a critical Cisco Expressway vulnerability, to its Known Exploited Vulnerabilities Catalog after identifying active exploitation.","The flaw affects clustered Cisco Expressway-C and Expressway-E devices and can allow unauthenticated attackers to execute operating-system commands as root because of hard-coded credentials and incomplete client-certificate validation.","CISA ordered U.S. Federal Civilian Executive Branch agencies to secure affected systems within three days under Binding Operational Directive 26-04 and urged all organizations to prioritize patching.","F6 reported that attackers compromised two internet-facing Cisco Expressway devices, used one to reach two additional internal cluster nodes, and then prepared tools for movement across the network.","Cisco stated when it released patches in late October that its PSIRT was not aware of active exploitation or public proof-of-concept exploits for CVE-2026-76466."],"insights":["The reported intrusions show that compromising an internet-facing Expressway device can provide a path to additional cluster nodes on an organization’s internal network.","F6 said attackers who gained root access prepared custom Python tools to find SMB shares, interact with SQL Server and WinRM, and inspect GitLab repositories for credentials and sensitive information.","CISA’s active-exploitation designation came after Cisco had said its incident-response team was not aware of exploitation in the wild or publicly available proof-of-concept code for the flaw.","CISA has added 103 actively exploited Cisco vulnerabilities to its catalog since November 2021, including seven that ransomware groups have used."],"referencedReports":[{"title":"Cisco Security Advisory for CVE-2026-76466","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t","publisher":"Cisco","context":"Cisco's advisory describes the hard-coded-credential and client-certificate-validation flaw and provides patches for affected Expressway devices.","category":"advisory","primary":true},{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/20/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"CISA's alert identifies CVE-2026-76466 as actively exploited and adds it to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":true},{"title":"Cisco Vulnerability Exploitation","url":"https://f6.security/media-center/press-releases/cisco-vulnerability-exploitation/","publisher":"F6","context":"F6 reported observing attackers compromise internet-facing Cisco Expressway devices, obtain root access, and prepare tools for lateral movement.","category":"research","primary":true}],"body":"\u003cp\u003eCISA has added CVE-2026-76466, a critical vulnerability in Cisco Expressway, to its Known Exploited Vulnerabilities Catalog after determining that attackers are actively exploiting it. The flaw affects Cisco Expressway-C and Expressway-E devices configured in a cluster, which are used to connect enterprise voice and video systems with outside networks and remote users. CISA ordered U.S. Federal Civilian Executive Branch agencies to secure affected systems within three days under Binding Operational Directive 26-04. It also urged private-sector defenders to prioritize patching because the flaw may be targeted in ongoing attacks.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability results from hard-coded credentials and incomplete validation of client certificates. An unauthenticated attacker with the relevant cookies can connect to the database service and invoke specific remote procedure call commands, allowing arbitrary operating-system commands to run as root. Cisco released patches in late October and said at that time that its PSIRT had no knowledge of active exploitation or publicly available proof-of-concept exploits. CISA later tagged the issue as actively exploited.\u003c/p\u003e\n\n\u003cp\u003eF6 reported that attackers used an unnamed AI assistant to exploit the issue against internet-exposed Cisco Expressway devices and obtain root-level command execution. According to F6, they initially compromised two external devices and used one to access two further cluster nodes on the internal network. Afterward, the attackers prepared custom Python scripts to scan networks, identify SMB resources, interact with SQL Server and WinRM, and examine GitLab repositories for credentials and other sensitive information. The article also notes that CISA has added 103 Cisco vulnerabilities to its actively exploited list since November 2021, seven of which were used by ransomware gangs.\u003c/p\u003e\n"},{"n":3,"title":"Hackers Exploit Critical ASP.NET Anti-CSRF Library Flaw Allowing Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-aspnet-anti.html","time":"09:11","priority":"MUST READ","score":94,"tldr":"A critical, actively exploited insecure deserialization flaw in the abandoned Idunno.AntiCsrf ASP.NET library lets unauthenticated attackers execute code on affected IIS servers with a single crafted POST request. Organizations should immediately remove the library, migrate to a supported anti-CSRF mechanism, and investigate for compromise.","briefOverview":"\u003cp\u003eResearchers have warned organizations to stop using Idunno.AntiCsrf, an obsolete ASP.NET anti-CSRF library, after a critical flaw was found to be actively exploited. The vulnerability, CVE-2026-131914, has a CVSS score of 9.3 and affects versions 0.9.1.0 and 0.9.1 Beta. Idunno.AntiCsrf is a third-party component for ASP.NET WebForms applications and has not been updated since December 2008.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs because the library processes untrusted form-token data without cryptographic verification when handling POST requests to ASP.NET WebForms pages. An unauthenticated attacker can send a single crafted POST request and execute arbitrary code in the IIS worker process, potentially fully compromising the application server. Google Mandiant said attackers need only provide a non-empty configured CSRF cookie value and a specially encoded value in the relevant form field.\u003c/p\u003e\n\n\u003cp\u003eBecause no official patch is available, organizations are advised to remove the library and replace it with a supported anti-CSRF option, such as System.Web.Helpers.AntiForgery, ViewStateUserKey with protected ViewState, or ASP.NET Core IAntiforgery. Google also recommended auditing Web.config files and bin directories for Idunno.AntiCsrf references and reviewing IIS logs for suspicious POST requests to .aspx endpoints. Where exploitation may have occurred, organizations should rotate secrets in Web.config and applicationHost.config and inspect webroots for unauthorized files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-131914 is a critical insecure deserialization flaw, rated CVSS 9.3, affecting Idunno.AntiCsrf versions 0.9.1.0 and 0.9.1 Beta.","The flaw allows an unauthenticated remote attacker to execute arbitrary code on an affected ASP.NET WebForms server through a single crafted HTTP POST request.","Google Mandiant reported that the vulnerability is being actively exploited in the wild.","Idunno.AntiCsrf is an abandoned third-party ASP.NET anti-CSRF library that has not been updated since December 2008.","Organizations are advised to discontinue Idunno.AntiCsrf, use a supported anti-CSRF alternative, and review IIS logs and webroots for evidence of exploitation."],"insights":["Exploitation does not require a valid anti-CSRF token: an attacker only needs to provide any non-empty value in the configured cookie and a specially encoded value in the form field.","Because the library has no official patch and has been unmaintained since 2008, the recommended remediation is to remove and replace it rather than wait for an update.","Potential signs of exploitation include unusual POST requests to .aspx pages that return HTTP 302 or HTTP 500 responses with elevated logged request-byte counts.","Organizations that find evidence of compromise should rotate secrets in Web.config and applicationHost.config, including machine keys, encryption keys, and database credentials, and inspect website directories for unauthorized files."],"referencedReports":[{"title":"MNDT-2026-0048","url":"https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md","publisher":"google-mandiant","context":"The article cites Mandiant's vulnerability disclosure and alert describing the actively exploited Idunno.AntiCsrf insecure deserialization flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eResearchers have warned organizations to stop using Idunno.AntiCsrf, an obsolete ASP.NET anti-CSRF library, after a critical flaw was found to be actively exploited. The vulnerability, CVE-2026-131914, has a CVSS score of 9.3 and affects versions 0.9.1.0 and 0.9.1 Beta. Idunno.AntiCsrf is a third-party component for ASP.NET WebForms applications and has not been updated since December 2008.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs because the library processes untrusted form-token data without cryptographic verification when handling POST requests to ASP.NET WebForms pages. An unauthenticated attacker can send a single crafted POST request and execute arbitrary code in the IIS worker process, potentially fully compromising the application server. Google Mandiant said attackers need only provide a non-empty configured CSRF cookie value and a specially encoded value in the relevant form field.\u003c/p\u003e\n\n\u003cp\u003eBecause no official patch is available, organizations are advised to remove the library and replace it with a supported anti-CSRF option, such as System.Web.Helpers.AntiForgery, ViewStateUserKey with protected ViewState, or ASP.NET Core IAntiforgery. Google also recommended auditing Web.config files and bin directories for Idunno.AntiCsrf references and reviewing IIS logs for suspicious POST requests to .aspx endpoints. Where exploitation may have occurred, organizations should rotate secrets in Web.config and applicationHost.config and inspect webroots for unauthorized files.\u003c/p\u003e\n"},{"n":5,"title":"Hackers Exploited GL.iNet Cloud Flaw to Install Malware on Routers and KVM Devices","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploited-glinet-cloud-flaw-to.html","time":"09:04","priority":"SHOULD READ","score":88,"tldr":"Attackers exploited a GL.iNet GoodCloud flaw to remotely run root-level commands and install malware on some routers and KVM devices. GL.iNet has patched the cloud service and released security firmware, but affected owners should update immediately and consider reinstalling firmware without preserving settings because prior compromise may expose credentials and persist.","briefOverview":"\u003cp\u003eHackers exploited a flaw in GL.iNet’s GoodCloud remote-management service to install malware on some customer routers and remote-control KVM devices. GL.iNet said it fixed the cloud-side issue and blocked the attacker’s access, but the fix does not automatically clean devices that were already infected. The company has released security firmware for listed router and KVM models and is contacting customers it identifies as affected. It has not disclosed how many devices were infected, when the activity began, or how GoodCloud was breached.\u003c/p\u003e\n\n\u003cp\u003eRemoteToHome Consulting verified a root-level remote shell on a GL-AXT1800 router running firmware 4.8.3 with GoodCloud enabled, and reported that the shell connected to an external server. Its analysis says a GoodCloud client handler accepted two cloud-message values and ran them as root without checking them, though GL.iNet has not confirmed that technical finding. The shell reportedly left no files and disappeared after a restart, while the vendor’s published process marker was absent on the router with the verified shell. Although GL.iNet says its new firmware removes malware identified in the incident without a factory reset, researchers advise reinstalling firmware without retaining settings for suspected compromises and treating stored passwords, keys, and cloud credentials as exposed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers exploited a flaw in GL.iNet’s GoodCloud remote-management service to install malware on some customer routers and KVM devices.","GL.iNet said it fixed the cloud-side flaw and blocked the attacker’s access, but already infected devices require owners to check their hardware and install the listed security firmware.","RemoteToHome Consulting verified a root-level remote command connection on a GL-AXT1800 router running firmware 4.8.3 with GoodCloud enabled.","GL.iNet’s published firmware updates are intended to remove malware identified in this incident without a factory reset, while researchers caution that a root-level intruder may have left behind additional changes.","Owners of devices showing signs of compromise are advised by researchers to reinstall firmware without keeping settings and treat saved passwords, keys, and cloud credentials as exposed."],"insights":["The vendor’s suggested process marker did not appear on a router where researchers verified the remote shell, so a clean marker check does not reliably rule out compromise.","The verified router shell left no files and its traces disappeared after a restart, making it important to inspect a suspected device before rebooting or upgrading it.","Researchers found that an earlier KVM firmware upgrade that preserved settings also retained password files, SSH keys, and a user directory containing scripts that run at every boot.","Before using netstat on a suspect device, owners are advised to confirm that it still points to BusyBox because the command may have been replaced and running a compromised copy can start malware.","Turning off GoodCloud stops its client software from running until an update is installed, but it does not remove malware from a device that was already infected."],"referencedReports":[{"title":"GL.iNet Security Notice: GoodCloud KVM \u0026 Routers","url":"https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056","publisher":"gl-inet","context":"GL.iNet's security notice lists affected models, fixed firmware versions, and the vendor's guidance on removing identified malware.","category":"advisory","primary":true},{"title":"GL.iNet Security Incident 2026: Incident Investigation","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026","publisher":"remotetohome-consulting","context":"RemoteToHome Consulting's incident investigation reported a verified root-level reverse shell on a managed GL-AXT1800 router.","category":"research","primary":true},{"title":"Router Reverse Shell Analysis","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/router-reverse-shell.md","publisher":"remotetohome-consulting","context":"The analysis describes the router shell's behavior, including that it left no files and its traces disappeared after rebooting.","category":"research","primary":true},{"title":"Technical Breakdown","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/technical-breakdown.md","publisher":"remotetohome-consulting","context":"The technical analysis says the GoodCloud client handled cloud-supplied values by executing them as root without validation.","category":"research","primary":true},{"title":"Detailed Findings","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/findings.md","publisher":"remotetohome-consulting","context":"The article directs readers to these findings for fuller indicators of compromise.","category":"research","primary":false},{"title":"KVM Firmware Analysis","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/kvm-firmware.md","publisher":"remotetohome-consulting","context":"This analysis found that an earlier RM1 update preserving settings retained files and a user directory containing boot-time scripts.","category":"research","primary":false}],"body":"\u003cp\u003eHackers exploited a flaw in GL.iNet’s GoodCloud remote-management service to install malware on some customer routers and remote-control KVM devices. GL.iNet said it fixed the cloud-side issue and blocked the attacker’s access, but the fix does not automatically clean devices that were already infected. The company has released security firmware for listed router and KVM models and is contacting customers it identifies as affected. It has not disclosed how many devices were infected, when the activity began, or how GoodCloud was breached.\u003c/p\u003e\n\n\u003cp\u003eRemoteToHome Consulting verified a root-level remote shell on a GL-AXT1800 router running firmware 4.8.3 with GoodCloud enabled, and reported that the shell connected to an external server. Its analysis says a GoodCloud client handler accepted two cloud-message values and ran them as root without checking them, though GL.iNet has not confirmed that technical finding. The shell reportedly left no files and disappeared after a restart, while the vendor’s published process marker was absent on the router with the verified shell. Although GL.iNet says its new firmware removes malware identified in the incident without a factory reset, researchers advise reinstalling firmware without retaining settings for suspected compromises and treating stored passwords, keys, and cloud credentials as exposed.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft confirms Windows printing issues affecting Forcepoint users","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-confirms-printing-issues-after-kb5132043-windows-hotpatch/","time":"09:11","priority":"MAY READ","score":68,"tldr":"Microsoft says Windows 11 24H2-and-later devices using Forcepoint DLP Endpoint Agent may be unable to print after installing the KB5132043 November 2026 hotpatch because the Print Spooler service can fail to start. The issue is limited to hotpatch updates delivered through Windows Autopatch, and Forcepoint has provided a temporary workaround while Microsoft works on a fix.","briefOverview":"\u003cp\u003eMicrosoft confirmed that the November 2026 Windows 11 hotpatch, KB5132043, can cause printing problems on Windows 11 24H2 and later systems running Forcepoint DLP Endpoint Agent. Affected users may find that printing is disabled or receive errors when selecting a printer. Microsoft said the problem occurs because the Print Spooler service fails to start.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects hotpatch updates delivered through Windows Autopatch, rather than systems using the standard November 2026 Patch Tuesday security updates. Microsoft has not yet released a fix, but Forcepoint has provided a temporary workaround through its support portal. Microsoft also previously confirmed that KB5132043 can cause installation and launch issues for Office and third-party applications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that the November 2026 Windows 11 hotpatch KB5132043 can cause printing failures on Windows 11 24H2 and later devices running Forcepoint DLP Endpoint Agent.","Affected users may find the print option disabled or receive printer-selection errors because the Windows Print Spooler service fails to start.","The issue applies to hotpatch updates deployed through Windows Autopatch and does not affect systems using the standard November 2026 Patch Tuesday security updates.","Forcepoint has published a temporary workaround for customers through its support portal, while Microsoft has not yet released a fix.","Microsoft also reported that KB5132043 can cause application installation and launch problems affecting Office and third-party applications."],"insights":["The printing issue is tied specifically to the hotpatch delivery path through Windows Autopatch, so systems using the standard November 2026 Patch Tuesday updates are not affected by this particular Forcepoint compatibility problem.","The failure occurs because the Windows Print Spooler service does not start, which explains both a disabled print option and errors when users select a printer.","Organizations using Forcepoint DLP Endpoint Agent have a vendor-provided temporary workaround available through the authenticated Forcepoint support portal, even though Microsoft has not yet issued a fix.","KB5132043 has more than one reported impact: alongside the Forcepoint-related printing problem, Microsoft says it can also interfere with installing and launching Office and third-party applications."],"referencedReports":[{"title":"Windows release health service alert WI1562175","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1562175","publisher":"microsoft","context":"Microsoft's Friday service alert identifies the Forcepoint DLP Endpoint Agent printing issue following the November 2026 Windows 11 hotpatch.","category":"advisory","primary":true},{"title":"Forcepoint DLP Endpoint Agent Printing: Print Option Greyed Out or Shows Errors after Windows 11 Hotpatch KB5132043","url":"https://support.forcepoint.com/s/article/Forcepoint-DLP-Endpoint-Agent-Printing-Print-Option-Greyed-Out-or-Shows-Errors-after-Windows-11-Hotpatch-KB5132043","publisher":"forcepoint","context":"Forcepoint's support document provides a temporary workaround for affected customers.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft confirmed that the November 2026 Windows 11 hotpatch, KB5132043, can cause printing problems on Windows 11 24H2 and later systems running Forcepoint DLP Endpoint Agent. Affected users may find that printing is disabled or receive errors when selecting a printer. Microsoft said the problem occurs because the Print Spooler service fails to start.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects hotpatch updates delivered through Windows Autopatch, rather than systems using the standard November 2026 Patch Tuesday security updates. Microsoft has not yet released a fix, but Forcepoint has provided a temporary workaround through its support portal. Microsoft also previously confirmed that KB5132043 can cause installation and launch issues for Office and third-party applications.\u003c/p\u003e\n"},{"n":6,"title":"Black Friday, red flags: too-good-to-be-true deals hiding real threats","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/black-friday-threat-report-2026/122061/","time":"10:00","priority":"MAY READ","score":58,"tldr":"Kaspersky reports a sharp rise in shopping-related phishing and Black Friday spam in 2026, with scammers heavily impersonating Amazon, Apple, Netflix and other trusted brands to steal credentials, payment data and money. Shoppers should treat urgent, unusually cheap offers and unsolicited links with skepticism and verify retailers directly before entering personal or payment information.","briefOverview":"\u003cp\u003eKaspersky’s 2026 Black Friday analysis found that phishing attempts targeting online-store, payment-system, and banking users rose sharply during the first ten months of the year. Its products blocked 19,063,077 attempts to access such phishing links, a 198.1% increase from the comparable 2025 period. Amazon was the most frequently impersonated brand, followed by Apple, Netflix, Shopify, and Alibaba Group-associated brands; together, these five accounted for 83.83% of phishing detections involving online stores and subscription services. Kaspersky also detected 220,071 sales-themed spam messages during the first two weeks of November, up 50.18% year over year.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns used fake login pages, payment forms, support alerts, giveaway pages, and unusually cheap offers to obtain account credentials, payment-card details, personal data, or money. Examples included fraudulent Apple support pages that push victims to call fake support numbers, fake Netflix and other streaming subscription deals, counterfeit gaming offers tied to GTA VI, and beauty or wellness scams using fake endorsements and scarcity tactics. Between June and November, Kaspersky detected 27,416 malware or potentially unwanted-application attacks disguised as GTA VI-related content. Banking Trojans remained active, with 801,150 detected attacks in the first ten months of 2026, although PC banking-malware activity declined as attackers shifted toward mobile-focused fraud and credential theft.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["From January through October 2026, Kaspersky blocked 19,063,077 phishing-link access attempts targeting users of online stores, payment systems, and banks, a 198.1% increase from the same period in 2025.","Amazon, Apple, Netflix, Shopify, and Alibaba Group-associated brands accounted for 7,119,400 phishing detections, representing 83.83% of phishing targeting online stores and subscription services.","Kaspersky detected 220,071 sales-season spam messages during the first two weeks of November 2026, 50.18% more than during the comparable period in 2025.","Between June and November 2026, Kaspersky detected 27,416 attacks involving malware or potentially unwanted applications disguised as GTA VI-related content.","Kaspersky recorded 801,150 banking-Trojan attacks in the first ten months of 2026, down from more than 1.09 million in 2025."],"insights":["Scammers do not rely only on fake storefronts: some Apple-themed pages use alarming pop-ups and a fraudulent support number to pressure victims into disclosing sensitive information or allowing remote access to their devices.","Subscription promotions are a particularly effective lure because Black Friday generated an estimated 8.9 million incremental premium streaming sign-ups in 2025, giving fraudulent Netflix, Spotify, and YouTube Premium offers a believable context.","Gaming scams around GTA VI combine seasonal discount-seeking behavior with the game’s November 19 launch, including fake PlayStation bundles, counterfeit Steam gift-card giveaways, and Discord prompts that download suspicious files.","Beauty and wellness scams use fabricated medical authority, celebrity endorsements, fake customer comments, scarcity warnings, and countdown timers to make dubious products or nonexistent offers appear credible.","Although PC banking-malware detections declined year over year, the article notes that attackers are shifting toward mobile-focused fraud and credential theft rather than abandoning financial theft."],"referencedReports":[{"title":"Holiday 2025 Spending","url":"https://www.pwc.com/us/en/industries/consumer-markets/holiday-2025-spending.html","publisher":"pwc","context":"The article cites PwC’s post-holiday analysis for its finding that holiday spending rose 6.4% year over year in 2025 and Black Friday generated nearly $20 billion.","category":"research","primary":false},{"title":"KPMG Consumer Pulse Survey: Holiday Report 2026","url":"https://kpmg.com/kpmg-us/content/dam/kpmg/pdf/2026/kpmg-consumer-pulse-holiday-report.pdf","publisher":"kpmg","context":"The article cites KPMG’s consumer survey for data on Black Friday’s importance and consumers’ online shopping and purchase-research preferences.","category":"research","primary":false},{"title":"Why Is Premium SVOD Growth Concentrated in Q4?","url":"https://www.antenna.live/insights/why-is-premium-svod-growth-concentrated-in-q4","publisher":"antenna","context":"The article cites Antenna’s analysis estimating that Black Friday drove 8.9 million incremental premium streaming subscriptions in 2025.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky’s 2026 Black Friday analysis found that phishing attempts targeting online-store, payment-system, and banking users rose sharply during the first ten months of the year. Its products blocked 19,063,077 attempts to access such phishing links, a 198.1% increase from the comparable 2025 period. Amazon was the most frequently impersonated brand, followed by Apple, Netflix, Shopify, and Alibaba Group-associated brands; together, these five accounted for 83.83% of phishing detections involving online stores and subscription services. Kaspersky also detected 220,071 sales-themed spam messages during the first two weeks of November, up 50.18% year over year.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns used fake login pages, payment forms, support alerts, giveaway pages, and unusually cheap offers to obtain account credentials, payment-card details, personal data, or money. Examples included fraudulent Apple support pages that push victims to call fake support numbers, fake Netflix and other streaming subscription deals, counterfeit gaming offers tied to GTA VI, and beauty or wellness scams using fake endorsements and scarcity tactics. Between June and November, Kaspersky detected 27,416 malware or potentially unwanted-application attacks disguised as GTA VI-related content. Banking Trojans remained active, with 801,150 detected attacks in the first ten months of 2026, although PC banking-malware activity declined as attackers shifted toward mobile-focused fraud and credential theft.\u003c/p\u003e\n"},{"n":4,"title":"AI-Assisted Cyberattacks Trigger Unauthorized Payments at Indian Banks and Fintech Firms","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/ai-assisted-cyberattacks-trigger.html","time":"08:24","priority":"MAY READ","score":40,"tldr":"India's CERT-In warns that AI-assisted cyberattacks are enabling criminals to manipulate business records and trusted approval workflows, resulting in unauthorized payments at banks, fintechs, and government-linked service providers. The activity illustrates how agentic offensive frameworks can rapidly automate reconnaissance, exploitation, and intrusion tasks while evading controls designed around conventional attacks.","briefOverview":"\u003cp\u003eCERT-In warned that AI-assisted cyberattacks have resulted in unauthorized financial transactions at Indian banks, financial-services entities, technology providers supporting government-linked payments, and platforms handling vendor or partner payouts. In observed cases, attackers targeted business records and approval processes rather than directly exploiting payment APIs. They modified records or approval relationships and then used legitimate payment workflows, taking advantage of weak independent verification, reconciliation, and review.\u003c/p\u003e\n\n\u003cp\u003eCERT-In also reported that AI-driven agentic offensive frameworks are being used for automated reconnaissance, exploit development, parallel intrusion tasks, and adapting scripts or methods after blocked attempts. The Indian Cybercrime Coordination Centre said attacks on banks, non-banking financial companies, and fintech firms caused multi-crore unauthorized transactions through fund-disbursement systems and payment APIs, with money routed through mule accounts and rapidly moved through IMPS or NEFT. The article describes a broader rise in AI-enabled intrusions, including tools such as ARTEX, CAIRN, PentAGI, and CyberStrikeAI, which can accelerate multi-stage operations and lower the expertise needed to conduct them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-In warned that AI-assisted attacks have caused unauthorized financial transactions at Indian banking and financial-services organizations, government-linked payment service providers, and platforms handling vendor or partner payouts.","In observed incidents, attackers altered business records or approval relationships and then used legitimate payment workflows, exploiting gaps in independent verification, reconciliation, and review.","CERT-In said agentic offensive frameworks have been used for automated reconnaissance, rapid exploit generation, parallel intrusion tasks, and adaptation to blocked attempts or returned information.","The Indian Cybercrime Coordination Centre said attacks against banks, non-banking financial companies, and fintech firms led to multi-crore unauthorized transactions through fund-disbursement systems and payment-transfer APIs.","The article reports that frameworks such as ARTEX coordinate specialized AI agents across stages including system discovery, initial access, privilege escalation, internal movement, and data theft."],"insights":["The reported payment fraud often did not require directly breaking payment APIs; attackers instead changed business records and approval relationships so authorized systems processed fraudulent transfers.","CERT-In said AI-assisted operations reduced the time from initial access to final impact from days to a few hours, while multiple AI agents could work in parallel for hours or days.","The article describes AI tools that can adapt after failed or blocked commands by changing scripts, requests, or methods based on responses from a target system.","AI systems themselves have become a target: attackers reportedly stole AI credentials to fund further automated credential hunting, creating what Amazon described as a self-sustaining operation.","The reported threats extend beyond financial systems to lower-priority entry points such as supplier portals, mobile backends, legacy services, and third-party integrations."],"referencedReports":[{"title":"CERT-In Advisory CIAD-2026-0062","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02\u0026VLCODE=CIAD-2026-0062","publisher":"cert-in","context":"CERT-In's advisory describes AI-assisted incidents in which attackers manipulated business records and approval processes to trigger unauthorized transactions.","category":"advisory","primary":true},{"title":"CERT-In Advisory CIAD-2026-0049","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02\u0026VLCODE=CIAD-2026-0049","publisher":"cert-in","context":"The article cites this CERT-In advisory for findings that agentic tooling reduced the time from initial access to financial impact to a few hours.","category":"advisory","primary":true},{"title":"AI-Assisted Cyber Attack on Banks, NBFCs","url":"https://i4c.mha.gov.in/theme/resources/advisories/AI-Assisted-Cyber-Attack-on-Banks-NBFCs.pdf","publisher":"indian-cybercrime-coordination-centre","context":"I4C's advisory is cited for attacks on banks, non-banking financial companies, and fintechs that used compromised systems and payment interfaces to route funds through mule accounts.","category":"advisory","primary":true},{"title":"FBI Cybersecurity Advisory 261113","url":"https://www.ic3.gov/CSA/2026/261113.pdf","publisher":"federal-bureau-of-investigation","context":"The FBI alert is cited for its assessment that ARTEX can rapidly chain techniques and allow minimally skilled actors to run complex operations at scale.","category":"advisory","primary":false},{"title":"Hacking on Autopilot: Inside ARTEX Cybercrime Campaigns","url":"https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/","publisher":"check-point","context":"Check Point's report is cited for identifying more than 1,800 exposed ARTEX instances and observing largely autonomous agent operations.","category":"research","primary":false},{"title":"Agentic Threat Activity Crosses a Significant Threshold","url":"https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold","publisher":"google-mandiant-and-threat-intelligence-group","context":"Google's Mandiant and GTIG analysis is cited for the reported use of exploit_agent to turn software patches into exploits and execute them without human intervention.","category":"research","primary":false},{"title":"ARTEX Is Evidence AI Is Compressing the Cyberattack Timeline","url":"https://www.cohesity.com/blogs/artex-is-evidence-ai-is-compressing-the-cyberattack-timeline/","publisher":"cohesity","context":"Cohesity's report is cited for observations of AI-assisted attackers targeting lower-priority systems and rapidly rewriting tools when they encountered obstacles.","category":"research","primary":false},{"title":"Cairn Framework: AI Autonomous Attacks","url":"https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/","publisher":"palo-alto-networks-unit-42","context":"Unit 42's analysis is cited for activity attributed to CL-STA-1238 using CAIRN with GLM and DeepSeek against organizations in semiconductor, defense-policy, and civil-society sectors.","category":"research","primary":false},{"title":"Chinese-Nexus Actors Used CAIRN AI Agents to Find a Zero-Day","url":"https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/","publisher":"amazon","context":"Amazon's report is cited for a suspected Chinese-nexus actor using CAIRN to find and exploit a MONAI Label zero-day within 11 minutes.","category":"research","primary":false},{"title":"AI Cyber Threat Trends 2026","url":"https://www.recordedfuture.com/research/ai-cyber-threat-trends-2026","publisher":"recorded-future","context":"Recorded Future's research is cited for the finding that enterprise AI tools with access to code, credentials, data, or connected applications create new attack surfaces.","category":"research","primary":false}],"body":"\u003cp\u003eCERT-In warned that AI-assisted cyberattacks have resulted in unauthorized financial transactions at Indian banks, financial-services entities, technology providers supporting government-linked payments, and platforms handling vendor or partner payouts. In observed cases, attackers targeted business records and approval processes rather than directly exploiting payment APIs. They modified records or approval relationships and then used legitimate payment workflows, taking advantage of weak independent verification, reconciliation, and review.\u003c/p\u003e\n\n\u003cp\u003eCERT-In also reported that AI-driven agentic offensive frameworks are being used for automated reconnaissance, exploit development, parallel intrusion tasks, and adapting scripts or methods after blocked attempts. The Indian Cybercrime Coordination Centre said attacks on banks, non-banking financial companies, and fintech firms caused multi-crore unauthorized transactions through fund-disbursement systems and payment APIs, with money routed through mule accounts and rapidly moved through IMPS or NEFT. The article describes a broader rise in AI-enabled intrusions, including tools such as ARTEX, CAIRN, PentAGI, and CyberStrikeAI, which can accelerate multi-stage operations and lower the expertise needed to conduct them.\u003c/p\u003e\n"},{"n":7,"title":"Health-ISAC Daily Cyber Headlines – November 23, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-23-2026/","time":"09:35","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 23 briefing highlights threats relevant to healthcare defenders, including phishing targeting Google and Okta accounts, a MONAI Label zero-day enabling root access, Microsoft tenant-data theft, and compromised GL.iNet devices. It also covers a hospital business email compromise case, WhatsApp security patches, and proposed U.S. IoT security-labeling rules.","briefOverview":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 23, 2026 compiles open-source reporting relevant to health sector defenders. The briefing covers a GoodGuys phishing campaign using paid-interview lures to hijack Google and Okta accounts, as well as a business email compromise scheme that defrauded a North Carolina hospital of $196,000. It also reports that two people were arrested in connection with the hospital fraud case.\u003c/p\u003e\n\n\u003cp\u003eThe roundup includes a MONAI Label zero-day reportedly exploited with AI agents to gain root access. Other items cover a Microsoft Entra Connect Health flaw used to steal tenant data, a GL.iNet Cloud flaw used to infect routers and KVM devices, and three WhatsApp security fixes, including an Android issue suspected of use in scams. The briefing additionally notes proposed Federal Communications Commission regulations for the Cyber Trust Mark IoT labeling program.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 23, 2026 daily briefing covers a GoodGuys phishing campaign that uses paid-interview lures to hijack Google and Okta accounts.","The briefing includes a report that two people were arrested in connection with a business email compromise scheme that defrauded a North Carolina hospital of $196,000.","The roundup reports that threat actors used AI agents to exploit a MONAI Label zero-day and gain root access.","It includes reports of a Microsoft Entra Connect Health flaw used to steal tenant data and a GL.iNet Cloud flaw used to infect routers and KVM devices.","WhatsApp patched three security flaws, including an Android issue suspected of being used in scams."],"insights":["The briefing spans both direct financial fraud against a hospital and technical compromises affecting identity systems, medical-imaging software, routers, remote-management devices, and mobile messaging.","Account theft is a recurring theme across the roundup: the GoodGuys campaign targets Google and Okta accounts, while a Microsoft Entra Connect Health flaw was reportedly used to steal tenant data.","The MONAI Label issue is especially consequential in the roundup because it is described as a zero-day that enabled root access, meaning complete control of the affected system.","The article pairs active threat reporting with policy and remediation developments, including proposed FCC rules for the Cyber Trust Mark IoT labeling program and WhatsApp fixes for three flaws."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 23, 2026 compiles open-source reporting relevant to health sector defenders. The briefing covers a GoodGuys phishing campaign using paid-interview lures to hijack Google and Okta accounts, as well as a business email compromise scheme that defrauded a North Carolina hospital of $196,000. It also reports that two people were arrested in connection with the hospital fraud case.\u003c/p\u003e\n\n\u003cp\u003eThe roundup includes a MONAI Label zero-day reportedly exploited with AI agents to gain root access. Other items cover a Microsoft Entra Connect Health flaw used to steal tenant data, a GL.iNet Cloud flaw used to infect routers and KVM devices, and three WhatsApp security fixes, including an Android issue suspected of use in scams. The briefing additionally notes proposed Federal Communications Commission regulations for the Cyber Trust Mark IoT labeling program.\u003c/p\u003e\n"}]</script>
