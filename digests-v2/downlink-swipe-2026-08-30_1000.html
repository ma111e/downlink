<script type="application/json" id="dl-articles">[{"n":1,"title":"DMARC Said Reject. A Quarantine Release Delivered It Anyway","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/dmarc-reject-quarantined-then-resubmitted-invoice-spoof-delivered","time":"11:00","priority":"MAY READ","score":72,"tldr":"A spoofed QuickBooks-style invoice email that failed SPF, had no DKIM, and failed DMARC under a reject policy was correctly quarantined by Microsoft but later delivered after being resubmitted from quarantine by an internal account. The key risk is that quarantine release can undo strong authentication enforcement, especially for payload-free invoice fraud that relies only on getting a victim to reply.","briefOverview":"\u003cp\u003eA spoofed accounting-brand invoice notice reached a shared accounts-payable mailbox at a financial-advisory firm after it had already been quarantined by Microsoft’s antispam engine. The original evaluation showed SPF failed, there was no DKIM signature, and DMARC failed against a sending domain that published an enforced reject policy. The article says the receiver did not refuse the message at the SMTP layer, but quarantined it, which made later release possible.\u003c/p\u003e\n\n\u003cp\u003eThe delivered copy contained headers showing it was a resubmission rather than a normal inbound delivery. These included an Exchange generated-message-source value of \u003ccode\u003eAntispam Quarantine Agent\u003c/code\u003e, \u003ccode\u003eAuto-Submitted: auto-generated\u003c/code\u003e, and an \u003ccode\u003eX-MS-Exchange-QuarantineResubmitTime\u003c/code\u003e header. Other headers attributed the release to an internal mailbox at the firm, though the article says they do not show whether it was an end-user self-service release or an administrator action.\u003c/p\u003e\n\n\u003cp\u003eThe message had no attachment, link, embedded image, or tracking pixel, and its only attack surface was a reply address at \u003ccode\u003eaccounts@ap2-linkedin[.]com\u003c/code\u003e. That domain was created on April 16, 2026 through Dynadot behind a privacy service and had no relationship to the spoofed accounting brand or LinkedIn. The article’s main takeaway is that a recorded authentication failure and quarantine decision can be undone by later release, so organizations should monitor quarantine resubmission headers and verify new payment or remittance contacts through an already known channel.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A spoofed accounting-brand invoice notice reached a shared accounts-payable mailbox at a financial-advisory firm after Microsoft’s antispam engine had quarantined it on August 13, 2026.","The original authentication results showed SPF failed for sending IP 209[.]222[.]82[.]241, DKIM was absent, and DMARC failed against a domain publishing an enforced reject policy.","Headers on the delivered copy showed it was resubmitted out of quarantine, including an Exchange generated-message-source value of Antispam Quarantine Agent, Auto-Submitted: auto-generated, and X-MS-Exchange-QuarantineResubmitTime.","The release was attributed in headers to an internal mailbox, but the article says the headers do not show whether it was an end-user self-service release or an administrator action.","The message contained no attachment, link, or embedded image, and its only attack surface was the reply address accounts@ap2-linkedin[.]com on a privacy-protected domain created on April 16, 2026."],"insights":["A published DMARC reject policy did not guarantee non-delivery because the receiver applied a local override to quarantine, and quarantined messages can later be released.","The released message could appear better authenticated to downstream controls because a later ARC hop recorded a DKIM pass from the recipient organization’s own internal forwarding domain, while the original failure remained deeper in the headers.","Quarantine release should be treated as a privileged action for messages that originally failed DMARC under an enforced policy, rather than as a routine self-service convenience.","A resubmit timestamp combined with an original failing authentication verdict is described as a high-confidence, easily matchable signal for detecting messages that were released after being blocked.","For payload-free invoice fraud, the article emphasizes detecting sender-brand and reply-path mismatches, because there may be no attachment, link, image, or redirect chain for security tools to analyze."],"referencedReports":[{"title":"RFC 9989","url":"https://datatracker.ietf.org/doc/html/rfc9989","publisher":"IETF","context":"The article cites the current DMARC specification to explain that domain owners can request a disposition for failed mail, but receivers make local handling decisions.","category":"guide","primary":false},{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for figures stating that phishing was behind 16% of breaches as an initial access vector and the human element was involved in 62% of breaches.","category":"research","primary":false},{"title":"2025 FBI IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report for $3,046,598,558 in reported business email compromise losses.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA guidance to support the need for reporting and out-of-band verification when scanners have little to detect.","category":"guide","primary":false}],"body":"\u003cp\u003eA spoofed accounting-brand invoice notice reached a shared accounts-payable mailbox at a financial-advisory firm after it had already been quarantined by Microsoft’s antispam engine. The original evaluation showed SPF failed, there was no DKIM signature, and DMARC failed against a sending domain that published an enforced reject policy. The article says the receiver did not refuse the message at the SMTP layer, but quarantined it, which made later release possible.\u003c/p\u003e\n\n\u003cp\u003eThe delivered copy contained headers showing it was a resubmission rather than a normal inbound delivery. These included an Exchange generated-message-source value of \u003ccode\u003eAntispam Quarantine Agent\u003c/code\u003e, \u003ccode\u003eAuto-Submitted: auto-generated\u003c/code\u003e, and an \u003ccode\u003eX-MS-Exchange-QuarantineResubmitTime\u003c/code\u003e header. Other headers attributed the release to an internal mailbox at the firm, though the article says they do not show whether it was an end-user self-service release or an administrator action.\u003c/p\u003e\n\n\u003cp\u003eThe message had no attachment, link, embedded image, or tracking pixel, and its only attack surface was a reply address at \u003ccode\u003eaccounts@ap2-linkedin[.]com\u003c/code\u003e. That domain was created on April 16, 2026 through Dynadot behind a privacy service and had no relationship to the spoofed accounting brand or LinkedIn. The article’s main takeaway is that a recorded authentication failure and quarantine decision can be undone by later release, so organizations should monitor quarantine resubmission headers and verify new payment or remittance contacts through an already known channel.\u003c/p\u003e\n"}]</script>
