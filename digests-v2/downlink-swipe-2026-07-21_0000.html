<script type="application/json" id="dl-articles">[{"n":1,"title":"Critical wp2shell WordPress flaws exploited to install webshells","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-wp2shell-wordpress-flaws-exploited-to-install-webshells/","time":"16:41","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting critical WordPress Core wp2shell flaws to install malicious plugins, PHP webshells, and rogue admin accounts on vulnerable sites. Administrators should update immediately to the patched WordPress versions and check for signs of compromise.","briefOverview":"\u003cp\u003eHackers are actively exploiting the critical “wp2shell” vulnerability suite, tracked as CVE-2026-63030 and CVE-2026-60137, affecting WordPress Core. The flaws are being used to deploy persistent webshells and install malicious plugins on affected servers. WordPress addressed the issue in versions 7.0.2, 6.9.5, and 6.8.6, and automatic security updates were forced for supported installations.\u003c/p\u003e\n\n\u003cp\u003eThe exploit chain abuses the WordPress REST API’s batch-processing feature, allowing remote attackers to execute code on vulnerable installations without authentication. Wiz reported activity including mass scanning, malicious plugin uploads, PHP webshell installation, collection of administrator usernames and email addresses, local file inclusion attempts targeting wp-config, and successful access to WordPress administration panels. Wiz said it has not observed lateral movement or data exfiltration but continues to monitor the activity.\u003c/p\u003e\n\n\u003cp\u003eJohannes B. Ullrich described two-stage attacks that begin with SQL injection probing before delivering a PHP webshell under the /wp-content/cache/ directory. The webshell used a randomized filename that also functioned as a password and returned a fake 404 page otherwise. Administrators are urged to update immediately, review logs for wp2shell-related requests, inspect installed plugins, and check for rogue PHP files or newly created admin accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers are exploiting the critical wp2shell vulnerability suite, CVE-2026-63030 and CVE-2026-60137, affecting WordPress Core to deploy persistent webshells and install malicious plugins on affected servers.","The exploit chain abuses the WordPress REST API’s batch-processing feature to allow remote code execution on vulnerable WordPress installations without authentication.","Wiz reported observed activity including mass scanning, malicious plugin uploads, PHP webshell installation, administrator username and email collection, local file inclusion attempts targeting wp-config, and successful access to WordPress administration panels.","Johannes B. Ullrich described two-stage attacks that probe for SQL injection before delivering a PHP webshell under the /wp-content/cache/ directory with a randomized filename also used as a password.","Administrators are advised to update to WordPress versions 7.0.2, 6.9.5, or 6.8.6, review logs for wp2shell-related requests, inspect installed plugins, and check for rogue PHP files or newly created admin accounts."],"insights":["Some observed scanning activity is from security scanning rather than attackers, so administrators reviewing logs may need to distinguish malicious attempts from benign probes.","The webshell described by Johannes B. Ullrich hides behind a fake 404 page unless accessed with the correct randomized filename used as a password, making simple page checks less reliable for finding compromise.","Wiz has not observed lateral movement or data exfiltration in the attacks it tracked, indicating the reported activity has so far centered on initial compromise and persistence.","Defiant observed exploitation-related probing within minutes of the public timeline, with initial probing at 23:29 UTC on July 17 and a clear SQL injection attempt 13 minutes later.","A live dashboard cited in the article estimated an 81.6% patch rate from a sample of 124,580 websites, showing that a meaningful minority of sampled WordPress sites may still remain exposed."],"referencedReports":[{"title":"Technical details on wp2shell exploitation involving CVE-2026-63030 and CVE-2026-60137","url":"https://www.wiz.io/blog/wp2shell-cve-2026-63030-cve-2026-60137","publisher":"Wiz","context":"The article cites Wiz as sharing technical details about observed attacks leveraging wp2shell, including malicious plugin uploads, PHP webshells, REST API queries, and local file inclusion attempts.","category":"","primary":false},{"title":"WordPress Exploitation Underway: CVE-2026-63030","url":"https://isc.sans.edu/diary/WordPress+Exploitation+Underway+CVE202663030/33168/","publisher":"SANS Internet Storm Center","context":"The article references Johannes B. Ullrich's separate report describing two-stage attacks that probe for SQL injection before delivering a PHP webshell.","category":"","primary":false},{"title":"wp2shell aftermath: the first critical unauthenticated WordPress Core RCE in nearly a decade","url":"https://www.wordfence.com/blog/2026/07/wp2shell-aftermath-the-first-critical-unauthenticated-wordpress-core-rce-in-nearly-a-decade/","publisher":"Defiant","context":"The article cites Defiant's aftermath post for timing of early exploitation-related probing and a subsequent SQL injection attempt.","category":"","primary":false},{"title":"Exploit brokers pay $500,000 for a WordPress RCE. I found one with GPT-5.6","url":"https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/","publisher":"SearchLight Cyber","context":"The article says SearchLight Cyber researcher Adam Kues published a follow-up report explaining the process of discovering wp2shell and developing a working exploit chain using AI tools.","category":"","primary":false}],"body":"\u003cp\u003eHackers are actively exploiting the critical “wp2shell” vulnerability suite, tracked as CVE-2026-63030 and CVE-2026-60137, affecting WordPress Core. The flaws are being used to deploy persistent webshells and install malicious plugins on affected servers. WordPress addressed the issue in versions 7.0.2, 6.9.5, and 6.8.6, and automatic security updates were forced for supported installations.\u003c/p\u003e\n\n\u003cp\u003eThe exploit chain abuses the WordPress REST API’s batch-processing feature, allowing remote attackers to execute code on vulnerable installations without authentication. Wiz reported activity including mass scanning, malicious plugin uploads, PHP webshell installation, collection of administrator usernames and email addresses, local file inclusion attempts targeting wp-config, and successful access to WordPress administration panels. Wiz said it has not observed lateral movement or data exfiltration but continues to monitor the activity.\u003c/p\u003e\n\n\u003cp\u003eJohannes B. Ullrich described two-stage attacks that begin with SQL injection probing before delivering a PHP webshell under the /wp-content/cache/ directory. The webshell used a randomized filename that also functioned as a password and returned a fake 404 page otherwise. Administrators are urged to update immediately, review logs for wp2shell-related requests, inspect installed plugins, and check for rogue PHP files or newly created admin accounts.\u003c/p\u003e\n"},{"n":6,"title":"Critical Palo Alto VPN bug now exploited by Qilin ransomware gang","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-globalprotect-vpn-bug-now-exploited-in-ransomware-attacks/","time":"10:12","priority":"MUST READ","score":96,"tldr":"The Qilin ransomware gang is actively exploiting Palo Alto Networks’ critical PAN-OS GlobalProtect authentication bypass flaw, CVE-2026-0257, to break into networks and deploy ransomware. Organizations with exposed GlobalProtect instances should patch or mitigate immediately, as exploitation appears ongoing.","briefOverview":"\u003cp\u003eThe Qilin ransomware gang is exploiting CVE-2026-0257, a critical PAN-OS GlobalProtect authentication bypass flaw, to breach victims’ networks, according to Arctic Wolf. Palo Alto Networks addressed the vulnerability on May 13 and warned that attackers had begun abusing it against unpatched PAN-OS devices without mitigations. Rapid7 had reported seeing exploitation against numerous customers starting on May 17.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-0257 to its Known Exploited Vulnerabilities catalog on May 29 and ordered federal agencies to secure their GlobalProtect VPN instances within three days. Arctic Wolf Labs said it investigated multiple June 2026 intrusions that began with exploitation of the flaw and resulted in Qilin ransomware deployment, including domain-wide encryption. The company said post-exploitation activity varied from rapid encryption-only operations to full double-extortion, possibly indicating multiple Qilin affiliates using the same flaw.\u003c/p\u003e\n\n\u003cp\u003eArctic Wolf assessed with moderate confidence that intrusions using CVE-2026-0257 and leading to Qilin ransomware deployment are likely ongoing. Shadowserver tracks more than 167,000 exposed GlobalProtect VPN instances online, while Shodan found more than 172,000 IPs with a GlobalProtect fingerprint, though the article notes it is unknown how many are patched or honeypots. Qilin is a ransomware-as-a-service operation that surfaced in August 2022 under the name Agenda and has claimed more than 2,000 victims on its leak site.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arctic Wolf says the Qilin ransomware gang is exploiting CVE-2026-0257, a critical PAN-OS GlobalProtect authentication bypass flaw, to breach victims’ networks.","Palo Alto Networks patched CVE-2026-0257 on May 13 and warned that limited exploit attempts were targeting unpatched PAN-OS devices without mitigations.","CISA added CVE-2026-0257 to its Known Exploited Vulnerabilities catalog on May 29 and ordered federal agencies to secure their GlobalProtect VPN instances within three days.","Arctic Wolf investigated multiple June 2026 intrusions that began with exploitation of CVE-2026-0257 and ended in Qilin ransomware deployment, including domain-wide encryption.","Shadowserver tracks more than 167,000 exposed GlobalProtect VPN instances online, while Shodan found more than 172,000 IPs with a GlobalProtect fingerprint."],"insights":["Arctic Wolf observed varied post-exploitation behavior, ranging from rapid encryption-only operations to full double-extortion, which it said may indicate multiple Qilin affiliates are using the same flaw.","CISA gave federal agencies only three days to secure affected GlobalProtect instances after adding CVE-2026-0257 to its catalog, underscoring the urgency assigned to this issue.","The exposed attack surface is large, with Shadowserver tracking over 167,000 online GlobalProtect VPN instances and Shodan finding over 172,000 IPs with a GlobalProtect fingerprint, though the article notes it is unknown how many are patched or honeypots.","Arctic Wolf assessed with moderate confidence that Qilin-related exploitation of CVE-2026-0257 is likely ongoing, citing extensive scanning activity and the ransomware-as-a-service model’s tendency to spread successful exploits among affiliates."],"referencedReports":[{"title":"Exploitation of CVE-2026-0257 Leads to Qilin Ransomware","url":"https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/","publisher":"Arctic Wolf Labs","context":"The article cites Arctic Wolf Labs' analysis of multiple June 2026 intrusions where exploitation of CVE-2026-0257 led to Qilin ransomware deployment.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search=CVE-2026-0257\u0026field_date_added_wrapper=all\u0026field_cve=\u0026sort_by=field_date_added\u0026items_per_page=20\u0026url=","publisher":"CISA","context":"The article notes that CISA added CVE-2026-0257 to its Known Exploited Vulnerabilities catalog and ordered federal agencies to secure affected GlobalProtect instances within three days.","category":"","primary":false}],"body":"\u003cp\u003eThe Qilin ransomware gang is exploiting CVE-2026-0257, a critical PAN-OS GlobalProtect authentication bypass flaw, to breach victims’ networks, according to Arctic Wolf. Palo Alto Networks addressed the vulnerability on May 13 and warned that attackers had begun abusing it against unpatched PAN-OS devices without mitigations. Rapid7 had reported seeing exploitation against numerous customers starting on May 17.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-0257 to its Known Exploited Vulnerabilities catalog on May 29 and ordered federal agencies to secure their GlobalProtect VPN instances within three days. Arctic Wolf Labs said it investigated multiple June 2026 intrusions that began with exploitation of the flaw and resulted in Qilin ransomware deployment, including domain-wide encryption. The company said post-exploitation activity varied from rapid encryption-only operations to full double-extortion, possibly indicating multiple Qilin affiliates using the same flaw.\u003c/p\u003e\n\n\u003cp\u003eArctic Wolf assessed with moderate confidence that intrusions using CVE-2026-0257 and leading to Qilin ransomware deployment are likely ongoing. Shadowserver tracks more than 167,000 exposed GlobalProtect VPN instances online, while Shodan found more than 172,000 IPs with a GlobalProtect fingerprint, though the article notes it is unknown how many are patched or honeypots. Qilin is a ransomware-as-a-service operation that surfaced in August 2022 under the name Agenda and has claimed more than 2,000 victims on its leak site.\u003c/p\u003e\n"},{"n":7,"title":"Critical SharePoint RCE flaw exploited to steal machine keys","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-sharepoint-rce-flaw-exploited-to-steal-machine-keys/","time":"20:06","priority":"MUST READ","score":96,"tldr":"Hackers are actively exploiting the critical Microsoft SharePoint RCE flaw CVE-2026-50522 to steal machine keys, letting them forge authentication tokens and maintain access even after patching. Organizations should apply Microsoft’s July updates and rotate exposed credentials or keys on affected SharePoint servers.","briefOverview":"\u003cp\u003eHackers are actively exploiting the critical CVE-2026-50522 vulnerability in Microsoft SharePoint against vulnerable on-premise deployments. Microsoft describes the issue as a deserialization-of-untrusted-data flaw that allows a remote attacker to execute code over a network without authentication. The flaw was addressed in Microsoft’s July security updates, but it was not marked as actively exploited at the time.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr reported that exploitation attempts began shortly after proof-of-concept exploit code became public, with its honeypot network capturing attempts that successfully compromised target systems. The attackers are stealing machine keys, which can allow them to create valid authentication tokens, impersonate users, and access SharePoint sites and documents with the forged identity’s privileges. Defused also detected an undocumented SharePoint deserialization vector in attacks as early as July 17 and later said the activity was likely tied to CVE-2026-50522.\u003c/p\u003e\n\n\u003cp\u003eAt least one PowerShell demonstrative exploit for CVE-2026-50522 is available on GitHub from security researcher Janggggg. The proof of concept attempts to trigger remote code execution by sending a malicious .NET BinaryFormatter payload as the cookie of a forged SecurityContextToken in a WS-Federation sign-in response to SharePoint’s \u0026lsquo;/_trust/default.aspx\u0026rsquo; endpoint. While applying the latest SharePoint security updates removes the vulnerability, watchTowr advises defenders to also rotate credentials on any asset that may have been exposed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers are actively exploiting the critical CVE-2026-50522 vulnerability in Microsoft SharePoint to steal machine keys and maintain access even after affected servers are patched.","Microsoft describes CVE-2026-50522 as a deserialization-of-untrusted-data flaw that allows a remote attacker to execute code over a network without authentication.","Microsoft addressed the flaw in its July security updates, and the advisory noted an increased likelihood of exploitation even though it was not marked as actively exploited at the time.","watchTowr reported that attackers began targeting vulnerable on-premise SharePoint deployments shortly after proof-of-concept exploit code became public.","At least one PowerShell proof-of-concept exploit for CVE-2026-50522 is available on GitHub and attempts to trigger remote code execution through SharePoint’s '/_trust/default.aspx' endpoint."],"insights":["Patching alone may not be enough for exposed SharePoint servers because stolen machine keys can let attackers keep forging valid authentication tokens after the vulnerability is fixed.","The exploitation timeline was extremely compressed, with watchTowr reporting successful honeypot compromises within hours of identifying public proof-of-concept code.","Defused observed related attack activity as early as July 17, before the activity was publicly linked to CVE-2026-50522.","The public proof-of-concept targets SharePoint’s WS-Federation sign-in flow by placing a malicious .NET BinaryFormatter payload inside a forged SecurityContextToken cookie."],"referencedReports":[{"title":"CVE-2026-50522","url":"http://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50522","publisher":"microsoft","context":"The article cites Microsoft’s vulnerability advisory to describe CVE-2026-50522 as a deserialization-of-untrusted-data flaw allowing unauthenticated remote code execution over a network.","category":"","primary":false}],"body":"\u003cp\u003eHackers are actively exploiting the critical CVE-2026-50522 vulnerability in Microsoft SharePoint against vulnerable on-premise deployments. Microsoft describes the issue as a deserialization-of-untrusted-data flaw that allows a remote attacker to execute code over a network without authentication. The flaw was addressed in Microsoft’s July security updates, but it was not marked as actively exploited at the time.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr reported that exploitation attempts began shortly after proof-of-concept exploit code became public, with its honeypot network capturing attempts that successfully compromised target systems. The attackers are stealing machine keys, which can allow them to create valid authentication tokens, impersonate users, and access SharePoint sites and documents with the forged identity’s privileges. Defused also detected an undocumented SharePoint deserialization vector in attacks as early as July 17 and later said the activity was likely tied to CVE-2026-50522.\u003c/p\u003e\n\n\u003cp\u003eAt least one PowerShell demonstrative exploit for CVE-2026-50522 is available on GitHub from security researcher Janggggg. The proof of concept attempts to trigger remote code execution by sending a malicious .NET BinaryFormatter payload as the cookie of a forged SecurityContextToken in a WS-Federation sign-in response to SharePoint’s \u0026lsquo;/_trust/default.aspx\u0026rsquo; endpoint. While applying the latest SharePoint security updates removes the vulnerability, watchTowr advises defenders to also rotate credentials on any asset that may have been exposed.\u003c/p\u003e\n"},{"n":22,"title":"Critical SharePoint RCE CVE-2026-50522 Under Active Exploitation After Public PoC","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/critical-sharepoint-rce-cve-2026-50522.html","time":"14:57","priority":"MUST READ","score":96,"tldr":"Microsoft SharePoint Server CVE-2026-50522, a critical remote code execution flaw, is now being actively exploited after a public proof-of-concept was released. Organizations running on-premises SharePoint should patch immediately and rotate exposed machine keys or credentials, because attackers are using the bug to steal keys and maintain persistence.","briefOverview":"\u003cp\u003eA third SharePoint Server flaw patched by Microsoft in its July 2026 Patch Tuesday update is now under active exploitation, according to watchTowr. The vulnerability is CVE-2026-50522, a critical deserialization of untrusted data issue in Microsoft Office SharePoint with a CVSS score of 9.8. Microsoft said it could allow an unauthorized attacker to execute code over a network and credited DEVCORE researcher “splitline” with discovering and reporting it.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s advisory said a network-based attacker authenticated as at least a Site Owner could write arbitrary code to inject and execute code remotely on the SharePoint Server. The company also rated exploitation as “Exploitation More Likely.” watchTowr said it observed active exploitation against on-premises Microsoft SharePoint deployments after a public proof-of-concept exploit was released, and said attackers are pulling SharePoint machine keys through a single request.\u003c/p\u003e\n\n\u003cp\u003eDefused Cyber said threat actors are likely exploiting CVE-2026-50522 to deliver a .NET deserialization payload to a SharePoint sign-in endpoint, with captured requests carrying no authentication material. The article notes that CVE-2026-50522 is the third SharePoint Server vulnerability after CVE-2026-56164 and CVE-2026-58644 to see active exploitation efforts. CISA has warned that multiple SharePoint Server vulnerabilities are being exploited against supported on-premises versions, including Subscription Edition, 2019, and 2016, to gain unauthorized access and support post-exploitation activity such as IIS machine key theft, persistence, and malware deployment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft patched CVE-2026-50522, a critical deserialization vulnerability in Microsoft Office SharePoint with a CVSS score of 9.8, as part of its July 2026 Patch Tuesday update.","watchTowr reported active exploitation of CVE-2026-50522 against on-premises Microsoft SharePoint deployments after the release of a public proof-of-concept exploit.","watchTowr said attackers are using a single request to pull SharePoint machine keys and warned that patching is not enough because exposed credentials should be rotated.","Defused Cyber said threat actors are likely exploiting CVE-2026-50522 to deliver a .NET deserialization payload to a SharePoint sign-in endpoint without authentication material.","CISA warned that threat actors are exploiting multiple SharePoint Server vulnerabilities affecting supported on-premises versions, including Subscription Edition, 2019, and 2016, to gain unauthorized access and perform post-exploitation activities."],"insights":["Patching CVE-2026-50522 alone may not remove the risk from already targeted SharePoint servers, because watchTowr said attackers are stealing machine keys that can support persistent access.","The article presents a discrepancy in access requirements: Microsoft’s advisory text says an attacker must be authenticated as at least a Site Owner, while Defused Cyber said captured exploit requests carried no authentication material.","CVE-2026-50522 became the third SharePoint Server flaw from the July 2026 patch cycle to face active exploitation, indicating that attackers are repeatedly targeting the same on-premises SharePoint ecosystem.","CISA’s warning links the exploited SharePoint flaws not only to initial unauthorized access, but also to follow-on activity such as IIS machine key theft, deserialization techniques, persistence, and malware deployment."],"referencedReports":[{"title":"CVE-2026-50522","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50522","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for CVE-2026-50522 and quotes its description of the SharePoint remote code execution vulnerability and exploitability assessment.","category":"","primary":false}],"body":"\u003cp\u003eA third SharePoint Server flaw patched by Microsoft in its July 2026 Patch Tuesday update is now under active exploitation, according to watchTowr. The vulnerability is CVE-2026-50522, a critical deserialization of untrusted data issue in Microsoft Office SharePoint with a CVSS score of 9.8. Microsoft said it could allow an unauthorized attacker to execute code over a network and credited DEVCORE researcher “splitline” with discovering and reporting it.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s advisory said a network-based attacker authenticated as at least a Site Owner could write arbitrary code to inject and execute code remotely on the SharePoint Server. The company also rated exploitation as “Exploitation More Likely.” watchTowr said it observed active exploitation against on-premises Microsoft SharePoint deployments after a public proof-of-concept exploit was released, and said attackers are pulling SharePoint machine keys through a single request.\u003c/p\u003e\n\n\u003cp\u003eDefused Cyber said threat actors are likely exploiting CVE-2026-50522 to deliver a .NET deserialization payload to a SharePoint sign-in endpoint, with captured requests carrying no authentication material. The article notes that CVE-2026-50522 is the third SharePoint Server vulnerability after CVE-2026-56164 and CVE-2026-58644 to see active exploitation efforts. CISA has warned that multiple SharePoint Server vulnerabilities are being exploited against supported on-premises versions, including Subscription Edition, 2019, and 2016, to gain unauthorized access and support post-exploitation activity such as IIS machine key theft, persistence, and malware deployment.\u003c/p\u003e\n"},{"n":23,"title":"WordPress wp2shell Exploitation Grows as Public Exploit Fuels Mass Scanning","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/wordpress-wp2shell-exploitation-grows.html","time":"08:59","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting the wp2shell WordPress vulnerability chain to achieve unauthenticated remote code execution, create backdoor admin accounts, and deploy malicious plugins or web shells at scale. WordPress site owners should patch immediately and check for compromise even if updates have already been applied.","briefOverview":"\u003cp\u003eAttackers have begun exploiting two critical WordPress vulnerabilities, CVE-2026-63030 and CVE-2026-60137, collectively called wp2shell. When combined, the flaws can allow unauthenticated remote code execution and complete compromise of vulnerable websites. WatchTowr said exploitation was already underway by early Saturday UTC, first using public exploit code to exfiltrate hashed credentials and later moving to remote code execution after more details became public.\u003c/p\u003e\n\n\u003cp\u003eThe exploit chain was discovered by Searchlight Cyber using OpenAI GPT 5.6 Sol and is described as having no preconditions against a stock WordPress installation with no plugins. Cloudflare said CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use, while the SQL injection vulnerability CVE-2026-60137 is present from WordPress 6.8 onward and the remote code execution issue affects versions from 6.9. Intruder said CVE-2026-60137 is an entry point involving a REST API batch endpoint route confusion bug that bypasses authentication.\u003c/p\u003e\n\n\u003cp\u003eWiz observed post-exploitation activity including malicious plugin uploads, user enumeration, harvesting of administrator usernames and email addresses, local file inclusion attempts targeting database credentials and authentication keys, admin panel access, and PHP web shell uploads. Attackers have also used a 150 KB web shell disguised as a WordPress security plugin called CMSmap, and WatchTowr said its honeypots saw tens of thousands of exploitation attempts after a public exploit was released. Defenders are advised to inspect WordPress instances for new administrator accounts, malicious plugins, and suspicious files regardless of whether the sites have been patched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers have begun exploiting two critical WordPress vulnerabilities, CVE-2026-63030 and CVE-2026-60137, collectively called wp2shell, to achieve unauthenticated remote code execution and compromise vulnerable websites.","Searchlight Cyber said the exploit chain has no preconditions and can be used by an anonymous user against a stock WordPress installation with no plugins.","Cloudflare said CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use, while CVE-2026-60137 is present from WordPress version 6.8 onwards and the remote code execution issue affects versions from 6.9.","Wiz observed post-exploitation activity including malicious plugin uploads, user enumeration, harvesting of admin usernames and email addresses, local file inclusion attempts targeting database credentials and authentication keys, admin panel access, and PHP web shell uploads.","WatchTowr said its honeypots registered tens of thousands of exploitation attempts after a public exploit was released, and more than 100 backdoor administrator accounts were created following exploitation."],"insights":["Patched WordPress sites may still require incident response because defenders are advised to check for new administrator accounts, malicious plugins, and suspicious files regardless of whether fixes have already been applied.","The remote code execution issue is conditional: Cloudflare said CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use.","The risk is not limited to customized WordPress deployments because Searchlight Cyber said the exploit chain works against a stock installation with no plugins and no preconditions.","Attackers are using fake WordPress plugins as a persistence and execution method, including a 150 KB web shell disguised as a legitimate security plugin called CMSmap.","Some observed activity consists of high-volume scanning without follow-on compromise, which Wiz said suggests opportunistic mass scanning alongside legitimate security scanning activity."],"referencedReports":[{"title":"Exploit Brokers Pay $500,000 for a WordPress RCE. I Found One With GPT-5.6","url":"https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/","publisher":"Searchlight Cyber","context":"The article says Searchlight Cyber discovered the wp2shell exploit chain and links to its research write-up.","category":"","primary":false},{"title":"CVE-2026-63030 Sensor Telemetry","url":"https://kevintel.com/CVE-2026-63030#sensor-telemetry","publisher":"KEVIntel","context":"The article cites KEVIntel telemetry showing unique IP addresses linked to exploitation of CVE-2026-63030.","category":"","primary":false},{"title":"WordPress Vulnerabilities","url":"https://blog.cloudflare.com/wordpress-vulnerabilities/","publisher":"Cloudflare","context":"The article cites Cloudflare’s analysis explaining when CVE-2026-63030 enables unauthenticated remote code execution and which WordPress versions are affected.","category":"","primary":false},{"title":"wp2shell CVE-2026-63030 CVE-2026-60137","url":"https://www.wiz.io/blog/wp2shell-cve-2026-63030-cve-2026-60137","publisher":"Wiz","context":"The article cites Wiz research on exposed vulnerable WordPress instances and observed post-exploitation activity.","category":"","primary":false}],"body":"\u003cp\u003eAttackers have begun exploiting two critical WordPress vulnerabilities, CVE-2026-63030 and CVE-2026-60137, collectively called wp2shell. When combined, the flaws can allow unauthenticated remote code execution and complete compromise of vulnerable websites. WatchTowr said exploitation was already underway by early Saturday UTC, first using public exploit code to exfiltrate hashed credentials and later moving to remote code execution after more details became public.\u003c/p\u003e\n\n\u003cp\u003eThe exploit chain was discovered by Searchlight Cyber using OpenAI GPT 5.6 Sol and is described as having no preconditions against a stock WordPress installation with no plugins. Cloudflare said CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use, while the SQL injection vulnerability CVE-2026-60137 is present from WordPress 6.8 onward and the remote code execution issue affects versions from 6.9. Intruder said CVE-2026-60137 is an entry point involving a REST API batch endpoint route confusion bug that bypasses authentication.\u003c/p\u003e\n\n\u003cp\u003eWiz observed post-exploitation activity including malicious plugin uploads, user enumeration, harvesting of administrator usernames and email addresses, local file inclusion attempts targeting database credentials and authentication keys, admin panel access, and PHP web shell uploads. Attackers have also used a 150 KB web shell disguised as a WordPress security plugin called CMSmap, and WatchTowr said its honeypots saw tens of thousands of exploitation attempts after a public exploit was released. Defenders are advised to inspect WordPress instances for new administrator accounts, malicious plugins, and suspicious files regardless of whether the sites have been patched.\u003c/p\u003e\n"},{"n":17,"title":"Critical ServiceNow AI Platform Flaw Exploited for Unauthenticated Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/critical-servicenow-ai-platform-flaw.html","time":"06:29","priority":"MUST READ","score":95,"tldr":"Threat actors are actively exploiting CVE-2026-6875, a critical pre-authentication sandbox escape flaw in ServiceNow AI Platform that can allow unauthenticated remote code execution and full instance compromise. ServiceNow has released patches, and self-hosted customers should update immediately.","briefOverview":"\u003cp\u003eThreat actors are exploiting CVE-2026-6875, a critical security flaw affecting the ServiceNow AI Platform, according to Defused Cyber. The vulnerability has a CVSS score of 9.5 and is described as a sandbox escape issue. It could allow an unauthenticated user to run arbitrary code.\u003c/p\u003e\n\n\u003cp\u003eServiceNow released patches for the flaw throughout June across Brazil EA and GA, Australia Patch 2, Zurich Patch 7b and Patch 9, and Yokohama Patch 12 Hot Fix 1b and Patch 13. Searchlight Cyber said it reported the issue on April 1, 2026. The firm said the flaw could allow complete compromise of a ServiceNow instance and all connected proxy servers.\u003c/p\u003e\n\n\u003cp\u003eDefused Cyber said the observed exploitation targets the pre-authentication endpoint \u003ccode\u003e/assessment_thanks.do\u003c/code\u003e using HTTP POST requests. The article notes that the sandbox-escape gadget leads to the same code execution primitive by a different route than the one documented in the proof-of-concept exploit. In light of active exploitation, self-hosted ServiceNow customers are advised to apply the fixes if they have not already done so.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are exploiting CVE-2026-6875, a critical sandbox escape vulnerability in the ServiceNow AI Platform.","CVE-2026-6875 has a CVSS score of 9.5 and could allow an unauthenticated user to run arbitrary code.","ServiceNow released patches for the flaw throughout June across Brazil, Australia, Zurich, and Yokohama versions.","Searchlight Cyber said the flaw could allow complete compromise of a ServiceNow instance and all connected proxy servers.","Defused Cyber said observed exploitation targets the pre-authentication endpoint “/assessment_thanks.do” using HTTP POST requests."],"insights":["Defenders can focus monitoring on HTTP POST requests to the pre-authentication endpoint “/assessment_thanks.do,” because Defused Cyber observed active exploitation targeting that endpoint even when the route to code execution differs from the published proof-of-concept.","The potential impact extends beyond the ServiceNow instance itself, because Searchlight Cyber said exploitation can also compromise all connected proxy servers.","ServiceNow is not only patching the flaw but also restricting what code can run in sandbox contexts, indicating the fix includes broader hardening of the affected execution environment.","Self-hosted ServiceNow customers are singled out for urgent patching, making them the most immediately actionable audience in the article."],"referencedReports":[{"title":"KB3137947","url":"https://support.servicenow.com/kb?id=kb_article_view\u0026sysparm_article=KB3137947","publisher":"ServiceNow","context":"The article cites this ServiceNow support article as the source for patches released for CVE-2026-6875 across multiple versions.","category":"","primary":false},{"title":"Smashing the ServiceNow Sandbox: Pre-Authentication RCE","url":"https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/","publisher":"Searchlight Cyber","context":"The article references Searchlight Cyber's technical analysis for additional details on the flaw and its potential to compromise ServiceNow instances and connected proxy servers.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors are exploiting CVE-2026-6875, a critical security flaw affecting the ServiceNow AI Platform, according to Defused Cyber. The vulnerability has a CVSS score of 9.5 and is described as a sandbox escape issue. It could allow an unauthenticated user to run arbitrary code.\u003c/p\u003e\n\n\u003cp\u003eServiceNow released patches for the flaw throughout June across Brazil EA and GA, Australia Patch 2, Zurich Patch 7b and Patch 9, and Yokohama Patch 12 Hot Fix 1b and Patch 13. Searchlight Cyber said it reported the issue on April 1, 2026. The firm said the flaw could allow complete compromise of a ServiceNow instance and all connected proxy servers.\u003c/p\u003e\n\n\u003cp\u003eDefused Cyber said the observed exploitation targets the pre-authentication endpoint \u003ccode\u003e/assessment_thanks.do\u003c/code\u003e using HTTP POST requests. The article notes that the sandbox-escape gadget leads to the same code execution primitive by a different route than the one documented in the proof-of-concept exploit. In light of active exploitation, self-hosted ServiceNow customers are advised to apply the fixes if they have not already done so.\u003c/p\u003e\n"},{"n":4,"title":"Anubis ransomware claims Coca-Cola Fairlife attack, threatens data leak","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/anubis-ransomware-claims-coca-cola-fairlife-attack-threatens-data-leak/","time":"18:50","priority":"MUST READ","score":94,"tldr":"The Anubis ransomware gang claims it attacked Coca-Cola’s Fairlife subsidiary, encrypted its Nutanix systems, and stole about 1 TB of data, threatening to leak it unless a ransom is paid. Coca-Cola previously confirmed the ransomware incident disrupted U.S. dairy production but declined to comment on Anubis’ claims.","briefOverview":"\u003cp\u003eThe Anubis ransomware gang has claimed responsibility for the cyberattack on Coca-Cola’s Fairlife dairy subsidiary and threatened to publish allegedly stolen corporate data unless the company pays a ransom. Fairlife produces ultra-filtered milk products, protein shakes, and nutrition drinks sold throughout the United States. Coca-Cola disclosed on July 16 that the ransomware attack disrupted Fairlife’s operations and forced the company to suspend production at its U.S. facilities.\u003c/p\u003e\n\n\u003cp\u003eCoca-Cola said attackers gained unauthorized access to part of Fairlife’s systems, including production-related systems, prompting it to activate incident response and business continuity plans. The company said product quality and safety were not affected and that Canadian production operations continued as normal. At the time of disclosure, Coca-Cola had not said whether data was stolen, whether it had received an extortion demand, or which ransomware operation was responsible.\u003c/p\u003e\n\n\u003cp\u003eAnubis later listed Fairlife on its dark web data leak site, claiming it stole approximately one terabyte of corporate data and encrypted the company’s Nutanix infrastructure. The group claimed it attacked Fairlife roughly a week before Coca-Cola’s public disclosure and warned it would publish the stolen data unless the company entered negotiations by the end of the week. BleepingComputer said it could not independently verify Anubis’ claims about data theft, encryption, or the amount of data allegedly stolen, and Coca-Cola declined to comment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Anubis ransomware gang claimed responsibility for the cyberattack on Coca-Cola’s Fairlife dairy subsidiary and threatened to publish allegedly stolen corporate data unless the company pays a ransom.","Coca-Cola disclosed on July 16 that a ransomware attack disrupted Fairlife’s operations and forced the company to suspend production at its U.S. facilities.","Coca-Cola said attackers gained unauthorized access to part of Fairlife’s systems, including production-related systems, but said product quality and safety were not affected and Canadian production continued normally.","Anubis claimed it encrypted Fairlife’s Nutanix infrastructure and stole approximately one terabyte of corporate data during the attack.","BleepingComputer could not independently verify Anubis’ claims about data theft, system encryption, or the amount of data allegedly stolen, and Coca-Cola declined to comment."],"insights":["Fairlife’s public disclosure came before any confirmed public attribution, showing that the operational impact was significant enough for Coca-Cola to report the incident even without naming the ransomware group or confirming data theft.","Anubis specifically claimed Fairlife did not follow the instructions left on its network, indicating the group is using the victim’s incident response choices as part of its public pressure campaign.","The article separates confirmed business disruption from unverified criminal claims, since Coca-Cola confirmed unauthorized access and halted U.S. production while BleepingComputer could not verify Anubis’ claims about encryption or 1 TB of stolen data.","Anubis’ prior addition of a data wiper makes its claim of encrypted systems more concerning, because the article notes the tool is designed to destroy files and make recovery impossible."],"referencedReports":[],"body":"\u003cp\u003eThe Anubis ransomware gang has claimed responsibility for the cyberattack on Coca-Cola’s Fairlife dairy subsidiary and threatened to publish allegedly stolen corporate data unless the company pays a ransom. Fairlife produces ultra-filtered milk products, protein shakes, and nutrition drinks sold throughout the United States. Coca-Cola disclosed on July 16 that the ransomware attack disrupted Fairlife’s operations and forced the company to suspend production at its U.S. facilities.\u003c/p\u003e\n\n\u003cp\u003eCoca-Cola said attackers gained unauthorized access to part of Fairlife’s systems, including production-related systems, prompting it to activate incident response and business continuity plans. The company said product quality and safety were not affected and that Canadian production operations continued as normal. At the time of disclosure, Coca-Cola had not said whether data was stolen, whether it had received an extortion demand, or which ransomware operation was responsible.\u003c/p\u003e\n\n\u003cp\u003eAnubis later listed Fairlife on its dark web data leak site, claiming it stole approximately one terabyte of corporate data and encrypted the company’s Nutanix infrastructure. The group claimed it attacked Fairlife roughly a week before Coca-Cola’s public disclosure and warned it would publish the stolen data unless the company entered negotiations by the end of the week. BleepingComputer said it could not independently verify Anubis’ claims about data theft, encryption, or the amount of data allegedly stolen, and Coca-Cola declined to comment.\u003c/p\u003e\n"},{"n":18,"title":"Qilin Ransomware Attackers Exploit PAN-OS Authentication Bypass for Initial Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/qilin-ransomware-attackers-exploit-pan.html","time":"14:04","priority":"MUST READ","score":94,"tldr":"Qilin ransomware affiliates are exploiting the patched PAN-OS flaw CVE-2026-0257 to gain unauthorized SSL VPN access and deploy ransomware in victim networks. Attacks commonly involve credential theft, lateral movement with PsExec, Defender disabling, log clearing, and in some cases data exfiltration before encryption.","briefOverview":"\u003cp\u003eThreat actors have been observed exploiting the now-patched Palo Alto Networks PAN-OS vulnerability CVE-2026-0257 to deploy Qilin, also known as Agenda, ransomware in victim environments. Arctic Wolf Labs investigated multiple intrusions in June 2026 that began with exploitation of this authentication bypass flaw in the portal and gateway components of PAN-OS. Successful exploitation allowed unauthenticated remote attackers to establish SSL VPN sessions without valid credentials when authentication override cookies were enabled with specific certificate configurations.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers used the VPN sessions to move further into victim networks, harvest credentials, and conduct lateral movement through Windows administrative shares using compromised administrative accounts. Arctic Wolf said the intrusions showed consistent patterns, including staging ransomware at C:\\PerfLogs\\, using PsExec for lateral execution, deploying password-protected ransomware payloads, clearing logs, and disabling Microsoft Defender Real-Time Protection before running ransomware. The company also noted an unusual Windows Registry persistence pattern involving an asterisk followed by six randomized lowercase alphabetic characters.\u003c/p\u003e\n\n\u003cp\u003eThe follow-on activity varied across victims, ranging from rapid encryption-only operations to full double-extortion activity. Some cases involved enterprise-wide encryption without data exfiltration and reconnaissance using tools such as AnyDesk, Ngrok, or LogMeIn, while others included large-scale credential theft and data exfiltration to MEGA before ransomware deployment using Rclone, Proton Drive, and FileZilla. Arctic Wolf said this variability is consistent with ransomware-as-a-service models, where multiple affiliates may use shared access infrastructure and ransomware tooling while applying different post-exploitation methods.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors exploited the now-patched Palo Alto Networks PAN-OS vulnerability CVE-2026-0257 to gain initial access and deploy Qilin ransomware in victim environments.","Arctic Wolf Labs investigated multiple intrusions in June 2026 that began with exploitation of the authentication bypass flaw affecting PAN-OS portal and gateway components.","Successful exploitation allowed unauthenticated remote attackers to establish SSL VPN sessions without valid credentials when authentication override cookies were enabled with specific certificate configurations.","Across intrusions, attackers commonly staged ransomware at C:\\PerfLogs\\, used PsExec for lateral execution through administrative shares, deployed password-protected ransomware payloads, and cleared logs.","Follow-on activity varied across victims, including enterprise-wide encryption without data exfiltration, reconnaissance using AnyDesk, Ngrok, or LogMeIn, credential theft, and data exfiltration to MEGA before ransomware deployment using Rclone, Proton Drive, and FileZilla."],"insights":["The same initial access vector led to noticeably different outcomes across victims, which Arctic Wolf said is consistent with multiple Qilin RaaS affiliates using shared access and tooling but applying different post-exploitation methods.","The attackers showed repeatable operational patterns that defenders can look for, including ransomware staging at C:\\PerfLogs\\, PsExec execution through administrative shares, password-protected payloads, and comprehensive log-clearing routines.","The article highlights an unusual Windows Registry persistence pattern involving an asterisk followed by six randomized lowercase alphabetic characters, which may help distinguish this activity from more generic ransomware behavior.","Some incidents involved encryption without data exfiltration, while others included large-scale credential theft and data transfers to MEGA before ransomware deployment, showing that Qilin-related intrusions can create both operational disruption and data exposure risks."],"referencedReports":[{"title":"Exploitation of CVE-2026-0257 Leads to Qilin Ransomware","url":"https://arcticwolf.com/resources/blog/exploitation-of-cve-2026-0257-leads-to-qilin-ransomware/","publisher":"Arctic Wolf Labs","context":"The article cites Arctic Wolf Labs' analysis of multiple June 2026 intrusions that began with exploitation of CVE-2026-0257 and led to Qilin ransomware activity.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors have been observed exploiting the now-patched Palo Alto Networks PAN-OS vulnerability CVE-2026-0257 to deploy Qilin, also known as Agenda, ransomware in victim environments. Arctic Wolf Labs investigated multiple intrusions in June 2026 that began with exploitation of this authentication bypass flaw in the portal and gateway components of PAN-OS. Successful exploitation allowed unauthenticated remote attackers to establish SSL VPN sessions without valid credentials when authentication override cookies were enabled with specific certificate configurations.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers used the VPN sessions to move further into victim networks, harvest credentials, and conduct lateral movement through Windows administrative shares using compromised administrative accounts. Arctic Wolf said the intrusions showed consistent patterns, including staging ransomware at C:\\PerfLogs\\, using PsExec for lateral execution, deploying password-protected ransomware payloads, clearing logs, and disabling Microsoft Defender Real-Time Protection before running ransomware. The company also noted an unusual Windows Registry persistence pattern involving an asterisk followed by six randomized lowercase alphabetic characters.\u003c/p\u003e\n\n\u003cp\u003eThe follow-on activity varied across victims, ranging from rapid encryption-only operations to full double-extortion activity. Some cases involved enterprise-wide encryption without data exfiltration and reconnaissance using tools such as AnyDesk, Ngrok, or LogMeIn, while others included large-scale credential theft and data exfiltration to MEGA before ransomware deployment using Rclone, Proton Drive, and FileZilla. Arctic Wolf said this variability is consistent with ransomware-as-a-service models, where multiple affiliates may use shared access infrastructure and ransomware tooling while applying different post-exploitation methods.\u003c/p\u003e\n"},{"n":25,"title":"New ENCFORGE Ransomware Targets AI Model Files in Langflow RCE Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-encforge-ransomware-targets-ai.html","time":"07:34","priority":"MUST READ","score":94,"tldr":"Researchers linked JADEPUFFER to a new ENCFORGE ransomware attack that exploits unpatched Langflow RCE to break out via the Docker socket and encrypt AI model files, vector indexes, and training datasets. Organizations should urgently patch Langflow, remove unnecessary Docker socket access, rotate exposed secrets, and keep immutable backups of AI assets.","briefOverview":"\u003cp\u003eResearchers at Sysdig linked a second attack on the same Langflow server to JADEPUFFER, the AI-agent-driven operator it documented earlier this month. In the new activity, the operator deployed ENCFORGE, a compiled Go ransomware designed to encrypt AI infrastructure files such as model weights, vector indexes, training datasets, PyTorch and TensorFlow checkpoints, Hugging Face SafeTensors, ONNX files, GGUF files, FAISS indexes, Parquet and Arrow datasets, NumPy arrays, and TensorFlow records. The attack again used CVE-2025-3248, an unauthenticated remote code execution flaw in Langflow versions before 1.3.0.\u003c/p\u003e\n\n\u003cp\u003eSysdig retrieved the ENCFORGE binary from the attacker’s command-and-control server, where it was hidden as \u003ccode\u003e/.lockd\u003c/code\u003e. The file is a UPX-packed static Go ELF that uses AES-256-CTR for file data and wraps the per-run key with an embedded RSA-2048 public key. ENCFORGE renames encrypted files with a \u003ccode\u003e.locked\u003c/code\u003e extension, drops ransom notes, kills processes holding files open, avoids re-encrypting completed files, and deletes itself after running.\u003c/p\u003e\n\n\u003cp\u003eAfter confirming code execution, JADEPUFFER found the Docker socket at \u003ccode\u003e/var/run/docker.sock\u003c/code\u003e and adapted when its first attempt to pull ENCFORGE failed. Over five minutes and 24 seconds, the operator created and revised six Python scripts through the Langflow RCE channel until it could create privileged containers, mount the host filesystem, and run ENCFORGE on the host through \u003ccode\u003ensenter\u003c/code\u003e. Sysdig found no exfiltration capability in the recovered binary, and the article emphasizes patching Langflow, rotating exposed credentials, removing unnecessary Docker socket access, and keeping offline or immutable snapshots of model files, indexes, and training data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sysdig researchers linked a second attack on the same Langflow server to JADEPUFFER, which deployed a new Go-based ransomware called ENCFORGE.","The attack used CVE-2025-3248 in Langflow versions before 1.3.0, an unauthenticated remote code execution flaw in the /api/v1/validate/code endpoint.","ENCFORGE is designed to encrypt AI-related files such as model weights, vector indexes, training datasets, PyTorch and TensorFlow checkpoints, Hugging Face SafeTensors, ONNX files, GGUF files, FAISS indexes, Parquet and Arrow datasets, NumPy arrays, and TensorFlow records.","JADEPUFFER found the Docker socket at /var/run/docker.sock and used it to create privileged containers with host access, then ran ENCFORGE on the host through nsenter.","Sysdig found no exfiltration capability in the recovered ENCFORGE binary, and the ransom notes used the same Proton Mail address seen in the prior JADEPUFFER campaign."],"insights":["ENCFORGE’s focus on LoRA adapters, GGUF and GGML weights, FAISS indexes, and training datasets shows that the operator is targeting AI recovery capability rather than using a generic file-locking approach.","The operator adapted in real time when the initial ENCFORGE download path failed, creating and revising six Python scripts in just over five minutes to reach the host through the exposed Docker socket.","The first Python script was built one line at a time and later scripts were base64-decoded inside Python exec calls, showing an effort to avoid simple signature-based detection of complete scripts or shell commands.","The shared Proton Mail address between the earlier database-focused campaign and the ENCFORGE ransom notes is described by Sysdig as the strongest attribution link tying the two operations together.","Because the recovered ENCFORGE binary had no data theft or leak-site component, immutable or offline backups of model files, vector indexes, and training datasets are especially important for reducing the attacker’s leverage."],"referencedReports":[{"title":"JADEPUFFER Evolves: The Agentic Threat Actor Deploys Ransomware Built to Destroy AI Models","url":"https://www.sysdig.com/blog/jadepuffer-evolves-the-agentic-threat-actor-deploys-ransomware-built-to-destroy-ai-models","publisher":"Sysdig","context":"The article relies on Sysdig’s analysis of ENCFORGE, JADEPUFFER activity, indicators, C2 addresses, RSA key fingerprint, and YARA rule.","category":"","primary":false},{"title":"GHSA-rvqx-wpfh-mfx7","url":"https://github.com/langflow-ai/langflow/security/advisories/GHSA-rvqx-wpfh-mfx7","publisher":"Langflow","context":"The article links to the Langflow security advisory describing the unauthenticated /api/v1/validate/code remote code execution issue fixed in Langflow 1.3.0.","category":"","primary":false},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2025/05/05/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites CISA’s alert noting that CVE-2025-3248 was added to the Known Exploited Vulnerabilities catalog on May 5, 2025.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Sysdig linked a second attack on the same Langflow server to JADEPUFFER, the AI-agent-driven operator it documented earlier this month. In the new activity, the operator deployed ENCFORGE, a compiled Go ransomware designed to encrypt AI infrastructure files such as model weights, vector indexes, training datasets, PyTorch and TensorFlow checkpoints, Hugging Face SafeTensors, ONNX files, GGUF files, FAISS indexes, Parquet and Arrow datasets, NumPy arrays, and TensorFlow records. The attack again used CVE-2025-3248, an unauthenticated remote code execution flaw in Langflow versions before 1.3.0.\u003c/p\u003e\n\n\u003cp\u003eSysdig retrieved the ENCFORGE binary from the attacker’s command-and-control server, where it was hidden as \u003ccode\u003e/.lockd\u003c/code\u003e. The file is a UPX-packed static Go ELF that uses AES-256-CTR for file data and wraps the per-run key with an embedded RSA-2048 public key. ENCFORGE renames encrypted files with a \u003ccode\u003e.locked\u003c/code\u003e extension, drops ransom notes, kills processes holding files open, avoids re-encrypting completed files, and deletes itself after running.\u003c/p\u003e\n\n\u003cp\u003eAfter confirming code execution, JADEPUFFER found the Docker socket at \u003ccode\u003e/var/run/docker.sock\u003c/code\u003e and adapted when its first attempt to pull ENCFORGE failed. Over five minutes and 24 seconds, the operator created and revised six Python scripts through the Langflow RCE channel until it could create privileged containers, mount the host filesystem, and run ENCFORGE on the host through \u003ccode\u003ensenter\u003c/code\u003e. Sysdig found no exfiltration capability in the recovered binary, and the article emphasizes patching Langflow, rotating exposed credentials, removing unnecessary Docker socket access, and keeping offline or immutable snapshots of model files, indexes, and training data.\u003c/p\u003e\n"},{"n":32,"title":"Oracle July 2026 Critical Patch Update Addresses 1235 CVEs","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/oracle-july-2026-critical-patch-update-addresses-1235-cves","time":"21:07","priority":"MUST READ","score":94,"tldr":"Oracle’s July 2026 Critical Patch Update fixes 1,235 CVEs across 32 product families, including 261 critical patches. Oracle E-Business Suite and Fusion Middleware received the most fixes, so affected customers should apply the relevant updates promptly.","briefOverview":"\u003cp\u003eOracle released its July 2026 Critical Patch Update on July 21, the third quarterly update of 2026. The update contains fixes for 1,235 unique CVEs in 1,449 security updates across 32 Oracle product families. The article describes this as the largest CPU release.\u003c/p\u003e\n\n\u003cp\u003eOf the 1,449 security updates, 261 patches were rated critical, accounting for 18% of all patches. High severity patches made up the largest share at 52.7%, followed by medium severity patches at 24.7%. This quarter’s update includes 261 critical patches across 228 CVEs.\u003c/p\u003e\n\n\u003cp\u003eOracle E-Business Suite received the highest number of patches at 410, or 28.3% of the total, followed by Oracle Fusion Middleware with 355 patches, or 24.5%. The product-family breakdown also lists vulnerabilities that can be exploited over a network without authentication, including 219 for Oracle Fusion Middleware and 122 for Oracle Communications. Customers are advised to apply all relevant patches and refer to Oracle’s July 2026 advisory for full details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Oracle released its July 2026 Critical Patch Update on July 21 as its third quarterly update of 2026.","The update contains fixes for 1,235 unique CVEs in 1,449 security updates across 32 Oracle product families.","Oracle assigned a critical severity rating to 261 patches, representing 18% of all patches in the update.","Oracle E-Business Suite received the highest number of patches with 410, accounting for 28.3% of all patches.","Oracle Fusion Middleware received 355 patches, accounting for 24.5% of all patches."],"insights":["This is described as Oracle’s largest Critical Patch Update release, with 1,449 security updates addressing 1,235 unique CVEs.","Oracle E-Business Suite and Oracle Fusion Middleware together account for 765 patches, which is more than half of all patches in this update.","Oracle Fusion Middleware has 219 patches for issues that can be exploited over a network without authentication, the highest count in the product-family breakdown.","Oracle Communications has 122 patches for issues that can be exploited over a network without authentication out of 168 total patches, making unauthenticated remote exposure a major theme for that product family.","Although critical issues are prominent, high severity patches make up the largest share of the update at 52.7% of all security patches."],"referencedReports":[{"title":"Oracle Critical Patch Update Advisory - July 2026","url":"https://www.oracle.com/security-alerts/cpujul2026.html","publisher":"Oracle","context":"The article says Oracle released its July 2026 Critical Patch Update and advises customers to refer to this advisory for full details.","category":"","primary":false},{"title":"Oracle July 2026 Critical Patch Update Risk Matrices","url":"https://www.oracle.com/security-alerts/cpujul2026verbose.html","publisher":"Oracle","context":"The article links to Oracle's July 2026 Critical Patch Update risk matrices as additional information about the update.","category":"","primary":false},{"title":"Oracle Advisory to CVE Map","url":"https://www.oracle.com/security-alerts/public-vuln-to-advisory-mapping.html","publisher":"Oracle","context":"The article lists Oracle's advisory-to-CVE mapping as an additional reference for the Critical Patch Update.","category":"","primary":false}],"body":"\u003cp\u003eOracle released its July 2026 Critical Patch Update on July 21, the third quarterly update of 2026. The update contains fixes for 1,235 unique CVEs in 1,449 security updates across 32 Oracle product families. The article describes this as the largest CPU release.\u003c/p\u003e\n\n\u003cp\u003eOf the 1,449 security updates, 261 patches were rated critical, accounting for 18% of all patches. High severity patches made up the largest share at 52.7%, followed by medium severity patches at 24.7%. This quarter’s update includes 261 critical patches across 228 CVEs.\u003c/p\u003e\n\n\u003cp\u003eOracle E-Business Suite received the highest number of patches at 410, or 28.3% of the total, followed by Oracle Fusion Middleware with 355 patches, or 24.5%. The product-family breakdown also lists vulnerabilities that can be exploited over a network without authentication, including 219 for Oracle Fusion Middleware and 122 for Oracle Communications. Customers are advised to apply all relevant patches and refer to Oracle’s July 2026 advisory for full details.\u003c/p\u003e\n"},{"n":44,"title":"Emerging Threat: (CVE-2026-54159) PrestaShop Remote Code Execution via ps_facetedsearch Object Injection","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-54159-prestashop-remote-code-execution-via-ps_facetedsearch-object-injection/","time":"10:49","priority":"MUST READ","score":93,"tldr":"PrestaShop stores using ps_facetedsearch versions 3.0.0 through 4.0.3 are exposed to a critical unauthenticated remote code execution flaw, CVE-2026-54159, when price or weight slider filters are enabled. Merchants should upgrade the module to version 4.0.4 or later and check for unexpected PHP files or webshell activity.","briefOverview":"\u003cp\u003eCVE-2026-54159 is a critical PHP object injection vulnerability in the ps_facetedsearch layered navigation module bundled with PrestaShop. The flaw can let an unauthenticated attacker run arbitrary code on a public storefront and has a CVSS v3.1 base score of 10.0. A visitor-facing category page with a price or weight slider can be enough of an entry point.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects ps_facetedsearch versions 3.0.0 up to, but not including, 4.0.4. The vulnerable path is reachable when a store runs an affected module version and exposes a price or weight slider filter on front-office pages. The article notes that merchants may keep PrestaShop core current while bundled modules drift behind, leaving older ps_facetedsearch versions exposed.\u003c/p\u003e\n\n\u003cp\u003eTechnically, the module reads a slider filter value from the request URL without sufficient validation, writes it into a serialized cache, and later processes it with a raw native unserialize() call in src/Filters/Block.php. A crafted value can smuggle a malicious serialized PHP object into the cache, leading to creation of an attacker-controlled PHP file in the module directory that functions as a webshell. PrestaShop has released ps_facetedsearch 4.0.4 to fix the issue by replacing the raw unserialize() call with \\Tools::unSerialize(), and defenders are advised to verify module versions, monitor the module directory, and review logs for crafted slider-filter values.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-54159 is a critical PHP object injection vulnerability in the PrestaShop ps_facetedsearch module that can allow unauthenticated remote code execution on a storefront.","The flaw affects ps_facetedsearch versions 3.0.0 up to but not including 4.0.4 when a store exposes a price or weight slider filter on front-office pages.","The vulnerability occurs because slider filter values from the URL can be written into a serialized cache and later processed by a raw native unserialize() call in src/Filters/Block.php.","PrestaShop has released ps_facetedsearch version 4.0.4, which fixes the issue by replacing the raw unserialize() call with PrestaShop’s safe \\Tools::unSerialize() wrapper.","Defenders are advised to inventory PrestaShop storefronts, verify installed ps_facetedsearch versions, watch for unexpected PHP files in the module directory, and review logs for crafted slider-filter values."],"insights":["A recent PrestaShop core version does not necessarily mean the store is protected, because ps_facetedsearch is a bundled module whose version must be checked directly.","The article highlights that exposure often comes from normal storefront features that have worked for years, such as price or weight sliders, making them less likely to receive version checks or configuration review.","More than half of the observed exposed assets fell into an unclassified “Others” group, suggesting that affected stores are often secondary, transitional, or poorly inventoried sites rather than only clearly categorized retail properties.","The manual fix is only a temporary measure because editing src/Filters/Block.php directly can be undone the next time the module is updated or reinstalled."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-54159 is a critical PHP object injection vulnerability in the ps_facetedsearch layered navigation module bundled with PrestaShop. The flaw can let an unauthenticated attacker run arbitrary code on a public storefront and has a CVSS v3.1 base score of 10.0. A visitor-facing category page with a price or weight slider can be enough of an entry point.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects ps_facetedsearch versions 3.0.0 up to, but not including, 4.0.4. The vulnerable path is reachable when a store runs an affected module version and exposes a price or weight slider filter on front-office pages. The article notes that merchants may keep PrestaShop core current while bundled modules drift behind, leaving older ps_facetedsearch versions exposed.\u003c/p\u003e\n\n\u003cp\u003eTechnically, the module reads a slider filter value from the request URL without sufficient validation, writes it into a serialized cache, and later processes it with a raw native unserialize() call in src/Filters/Block.php. A crafted value can smuggle a malicious serialized PHP object into the cache, leading to creation of an attacker-controlled PHP file in the module directory that functions as a webshell. PrestaShop has released ps_facetedsearch 4.0.4 to fix the issue by replacing the raw unserialize() call with \\Tools::unSerialize(), and defenders are advised to verify module versions, monitor the module directory, and review logs for crafted slider-filter values.\u003c/p\u003e\n"},{"n":10,"title":"FakeGit campaign uses 7,600 GitHub repos to push SmartLoader malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fakegit-campaign-uses-7-600-github-repos-to-push-smartloader-malware/","time":"22:34","priority":"MUST READ","score":92,"tldr":"A large FakeGit campaign is using 7,600 malicious GitHub repositories, including AI tool and MCP server lures, to distribute SmartLoader and StealC malware. Researchers warn that these repos are being surfaced by AI agents and public catalogs, making malicious downloads look more credible to developers.","briefOverview":"\u003cp\u003eA large-scale operation called FakeGit is using 7,600 malicious GitHub repositories to distribute SmartLoader and StealC malware. More than 800 of the repositories pretended to be AI skills or MCP servers and appeared more than 600 times in public AI registries and catalogs. Researchers at Island said this increased the chance that AI agents and developers would discover them, a technique they call “agentbaiting.”\u003c/p\u003e\n\n\u003cp\u003eThe campaign is considered a continuation of an older operation that used Lumma Stealer and was attributed by Trend Micro to a threat actor tracked as Water Kurita. Many repositories imitated consumer and enterprise tools such as Gmail, WhatsApp, Databricks, Jenkins, and Docker, using convincing documentation, fabricated stars and fork counts, copied descriptions, and real developer account names. Their README files directed visitors to ZIP archives that posed as installers or project releases but were disguised Lua payloads that triggered SmartLoader.\u003c/p\u003e\n\n\u003cp\u003eOnce active, SmartLoader creates persistence through scheduled tasks, retrieves its command-and-control address through a Polygon smart contract, and downloads additional encrypted stages from GitHub before delivering StealC. Island said GitHub public download counters for 335 unique Release assets across 211 FakeGit repositories recorded 14,084,688 cumulative download events, though this included repeated requests and automated activity and should not be interpreted as infections. Island recommends approved catalogs for skills and MCP servers, isolated testing of new capabilities, independent verification of publishers and repositories, and immediate secret rotation where SmartLoader execution is suspected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A campaign called FakeGit is using 7,600 malicious GitHub repositories to distribute SmartLoader and StealC malware.","More than 800 repositories pretended to be AI skills or MCP servers and appeared over 600 times in public AI registries and catalogs.","Island researchers said the campaign uses an emerging technique called AgentBaiting to make malicious repositories more visible to AI agents and more likely to be recommended or used.","The malicious repositories often imitate tools such as Gmail, WhatsApp, Databricks, Jenkins, and Docker, with README files directing users to ZIP archives disguised as installers or releases.","GitHub public download counters for 335 unique release assets across 211 FakeGit repositories showed 14,084,688 cumulative download events, but Island said this should not be interpreted as infections."],"insights":["Public AI registries and catalogs can amplify malicious repositories by making them easier to discover and appear more credible, even when researchers cannot determine whether listings were submitted manually or indexed automatically.","In Island’s controlled testing, Claude Code cloned malicious repositories and downloaded malicious files but stopped before execution after detecting suspicious indicators, showing that agent safeguards may intervene late in the workflow rather than at discovery.","The campaign’s reported 14,084,688 GitHub download events should be treated as exposure data rather than infection data because the figure includes repeated requests and automated activity.","SmartLoader’s use of a Polygon smart contract to retrieve its command-and-control address makes the attack chain depend on infrastructure beyond the malicious GitHub repositories themselves.","Island’s recommendation to rotate all secrets immediately where SmartLoader execution is suspected indicates that credential exposure is a primary concern after any successful run."],"referencedReports":[{"title":"AI-Assisted Fake GitHub Repositories","url":"http://www.trendmicro.com/en_us/research/25/c/ai-assisted-fake-github-repositories.html","publisher":"Trend Micro","context":"The article says the FakeGit campaign is considered a continuation of an older operation covered by Trend Micro researchers that used Lumma Stealer and was attributed to Water Kurita.","category":"","primary":false}],"body":"\u003cp\u003eA large-scale operation called FakeGit is using 7,600 malicious GitHub repositories to distribute SmartLoader and StealC malware. More than 800 of the repositories pretended to be AI skills or MCP servers and appeared more than 600 times in public AI registries and catalogs. Researchers at Island said this increased the chance that AI agents and developers would discover them, a technique they call “agentbaiting.”\u003c/p\u003e\n\n\u003cp\u003eThe campaign is considered a continuation of an older operation that used Lumma Stealer and was attributed by Trend Micro to a threat actor tracked as Water Kurita. Many repositories imitated consumer and enterprise tools such as Gmail, WhatsApp, Databricks, Jenkins, and Docker, using convincing documentation, fabricated stars and fork counts, copied descriptions, and real developer account names. Their README files directed visitors to ZIP archives that posed as installers or project releases but were disguised Lua payloads that triggered SmartLoader.\u003c/p\u003e\n\n\u003cp\u003eOnce active, SmartLoader creates persistence through scheduled tasks, retrieves its command-and-control address through a Polygon smart contract, and downloads additional encrypted stages from GitHub before delivering StealC. Island said GitHub public download counters for 335 unique Release assets across 211 FakeGit repositories recorded 14,084,688 cumulative download events, though this included repeated requests and automated activity and should not be interpreted as infections. Island recommends approved catalogs for skills and MCP servers, isolated testing of new capabilities, independent verification of publishers and repositories, and immediate secret rotation where SmartLoader execution is suspected.\u003c/p\u003e\n"},{"n":21,"title":"Zimbra Patches Critical SNMP Command Injection and Four XSS Vulnerabilities","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/zimbra-patches-critical-snmp-command.html","time":"13:18","priority":"MUST READ","score":92,"tldr":"Zimbra released version 10.1.20 to fix nine security vulnerabilities, including a critical SNMP command injection flaw and multiple XSS bugs in the Classic Web Client. Customers should patch promptly, as Zimbra XSS vulnerabilities have been exploited in the past even though these flaws are not currently reported as actively exploited.","briefOverview":"\u003cp\u003eZimbra released fixes in Zimbra 10.1.20 for nine security vulnerabilities. The issues include a command injection flaw in the SNMP monitoring component when SNMP notifications are enabled. Zimbra said it limited additional disclosure of vulnerability details in line with industry best practices.\u003c/p\u003e\n\n\u003cp\u003eThe update also patches four cross-site scripting flaws in the Classic Web Client involving malicious attachment filenames, crafted fields, and crafted attachments under specific conditions. Separately, Zimbra fixed CVE-2026-50055, a mail forwarding restriction bypass that could allow authenticated users to exfiltrate email despite mail forwarding restrictions being enabled. Rapid7 security researcher Jonah Burgess was credited with discovering and reporting that flaw.\u003c/p\u003e\n\n\u003cp\u003eThe release comes a little over a week after Zimbra patched a critical stored XSS flaw in the Classic Web Client that could result in arbitrary code execution. None of the newly identified vulnerabilities have been flagged as actively exploited. The article notes that XSS bugs in Zimbra email software have been repeatedly exploited by bad actors in the past, making it important for customers to apply the updates to keep environments secure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zimbra released fixes in Zimbra 10.1.20 for nine security vulnerabilities, including a command injection flaw in the SNMP monitoring component when SNMP notifications are enabled.","The update patches four cross-site scripting vulnerabilities in the Classic Web Client involving malicious attachment filenames, crafted fields, and crafted attachments under specific rendering conditions.","Zimbra also fixed CVE-2026-50055, a mail forwarding restriction bypass that could allow authenticated users to exfiltrate email despite mail forwarding restrictions being enabled.","Rapid7 security researcher Jonah Burgess was credited with discovering and reporting the mail forwarding restriction bypass flaw.","Zimbra said it limited disclosure of additional vulnerability details in line with industry best practices, and
