none of the identified vulnerabilities have been flagged as actively exploited."],"insights":["Customers with SNMP notifications enabled should treat the Zimbra 10.1.20 update as especially urgent because the command injection flaw is tied to that specific configuration.","The release follows another critical Zimbra Classic Web Client XSS patch from a little over a week earlier, indicating customers may need to verify they have applied multiple recent updates, not just the latest one.","Even though these vulnerabilities are not reported as actively exploited, the article highlights that Zimbra XSS flaws have been repeatedly exploited by bad actors in the past, making delay in patching risky.","The mail forwarding restriction bypass matters because it could undermine an administrative control intended to prevent email exfiltration by authenticated users."],"referencedReports":[{"title":"Patch Release Update: Zimbra 10.1.20","url":"https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-20/","publisher":"Zimbra","context":"The article cites Zimbra's patch release as the source for fixes addressing multiple security issues, including the SNMP command injection flaw.","category":"","primary":false},{"title":"Zimbra Releases/10.1.20","url":"https://wiki.zimbra.com/wiki/Zimbra_Releases/10.1.20","publisher":"Zimbra","context":"The article references Zimbra's 10.1.20 release page for the set of nine patched vulnerabilities.","category":"","primary":false}],"body":"\u003cp\u003eZimbra released fixes in Zimbra 10.1.20 for nine security vulnerabilities. The issues include a command injection flaw in the SNMP monitoring component when SNMP notifications are enabled. Zimbra said it limited additional disclosure of vulnerability details in line with industry best practices.\u003c/p\u003e\n\n\u003cp\u003eThe update also patches four cross-site scripting flaws in the Classic Web Client involving malicious attachment filenames, crafted fields, and crafted attachments under specific conditions. Separately, Zimbra fixed CVE-2026-50055, a mail forwarding restriction bypass that could allow authenticated users to exfiltrate email despite mail forwarding restrictions being enabled. Rapid7 security researcher Jonah Burgess was credited with discovering and reporting that flaw.\u003c/p\u003e\n\n\u003cp\u003eThe release comes a little over a week after Zimbra patched a critical stored XSS flaw in the Classic Web Client that could result in arbitrary code execution. None of the newly identified vulnerabilities have been flagged as actively exploited. The article notes that XSS bugs in Zimbra email software have been repeatedly exploited by bad actors in the past, making it important for customers to apply the updates to keep environments secure.\u003c/p\u003e\n"},{"n":31,"title":"Your AI agent’s config is now the payload: How attackers are targeting the developer agent harness","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/ai-coding-assistant-agent-harness-attacks","time":"13:00","priority":"SHOULD READ","score":88,"tldr":"Attackers are now poisoning AI coding assistant configuration files so malware runs automatically whenever developers start an AI session, turning trusted agent harnesses into persistence and propagation mechanisms. Defenders should treat these config files like code, require review and hash checks, restrict package install scripts, and treat AI scanner refusals as suspicious.","briefOverview":"\u003cp\u003eTenable says recent Mini Shai-Hulud and Miasma supply-chain campaigns did more than steal tokens and credentials: they rewrote configuration files used by AI coding assistants. The worm scans developers’ home directories for AI tool config files associated with tools such as Claude Code, Gemini CLI, GitHub Copilot, Cursor, ChatGPT Codex, Cline, and Aider. Once it finds them, it injects commands or instructions that can run silently whenever a developer starts an AI coding session.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that AI agent harness files are a powerful persistence vector because developers trust them as configuration, IDEs execute them automatically, and LLMs treat them as authoritative instructions. In Claude Code and Gemini CLI, the malware appends a SessionStart hook that runs a staged payload from ~/.config/index.js without overwriting existing hooks. For markdown-based rule files such as .cursorrules, .windsurfrules, and GitHub Copilot instructions, it injects text telling the AI assistant to run the command silently and not show it to the user.\u003c/p\u003e\n\n\u003cp\u003eTenable also found an evasion technique aimed at AI-based package scanners, where the malicious PyPI wheel’s JavaScript payload was wrapped in content designed to trigger model safety refusals. The article says a scanner refusal should be treated as a suspicious signal rather than a clean result. Recommended defenses include treating AI harness config files as code requiring review, using npm install \u0026ndash;ignore-scripts, flagging broad Cursor alwaysApply rules, validating outbound LLM traffic, pinning harness file hashes, and rotating GitHub tokens after untrusted npm installs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Mini Shai-Hulud worm scans developers’ home directories for AI coding assistant configuration files and injects hooks that run a malware payload every time an AI coding session starts.","AI coding assistant configuration files are attractive targets because developers trust them as configuration, IDEs can execute them automatically, and LLMs treat them as authoritative instructions.","The campaign injects SessionStart hooks into Claude Code and Gemini CLI settings.json files and adds prompt-style instructions to files such as .cursorrules, .windsurfrules, and GitHub Copilot instructions.","Tenable found the malicious PyPI wheel’s JavaScript payload wrapped in content designed to trigger AI-based scanners’ safety refusals, making the payload harder for those scanners to analyze.","The article recommends treating AI harness configuration files as code, enforcing npm install --ignore-scripts, flagging broad alwaysApply Cursor rules, validating LLM provider traffic, treating AI scanner refusals as suspicious, pinning harness file hashes, and rotating GitHub tokens after untrusted npm installs."],"insights":["AI harness files are unusually powerful because the same file can be trusted by the developer, automatically acted on by the IDE, and followed as instruction by the AI model.","The malware’s hook injection is designed to avoid breaking existing developer workflows by appending its command to current settings instead of replacing them.","The article treats an AI scanner refusal as evidence worth escalating, because attackers deliberately embedded prohibited content to make LLM-based scanners refuse analysis.","Cursor MDC rules with alwaysApply: true and broad globs are singled out as especially risky because they can force injected instructions into every AI conversation across a project.","Traffic to legitimate-looking LLM provider domains can hide exfiltration, so the article recommends per-key attribution rather than simply allowing developer machines to contact those domains directly."],"referencedReports":[],"body":"\u003cp\u003eTenable says recent Mini Shai-Hulud and Miasma supply-chain campaigns did more than steal tokens and credentials: they rewrote configuration files used by AI coding assistants. The worm scans developers’ home directories for AI tool config files associated with tools such as Claude Code, Gemini CLI, GitHub Copilot, Cursor, ChatGPT Codex, Cline, and Aider. Once it finds them, it injects commands or instructions that can run silently whenever a developer starts an AI coding session.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that AI agent harness files are a powerful persistence vector because developers trust them as configuration, IDEs execute them automatically, and LLMs treat them as authoritative instructions. In Claude Code and Gemini CLI, the malware appends a SessionStart hook that runs a staged payload from ~/.config/index.js without overwriting existing hooks. For markdown-based rule files such as .cursorrules, .windsurfrules, and GitHub Copilot instructions, it injects text telling the AI assistant to run the command silently and not show it to the user.\u003c/p\u003e\n\n\u003cp\u003eTenable also found an evasion technique aimed at AI-based package scanners, where the malicious PyPI wheel’s JavaScript payload was wrapped in content designed to trigger model safety refusals. The article says a scanner refusal should be treated as a suspicious signal rather than a clean result. Recommended defenses include treating AI harness config files as code requiring review, using npm install \u0026ndash;ignore-scripts, flagging broad Cursor alwaysApply rules, validating outbound LLM traffic, pinning harness file hashes, and rotating GitHub tokens after untrusted npm installs.\u003c/p\u003e\n"},{"n":8,"title":"Windows LegacyHive zero-day flaw gets free, unofficial patches","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/windows-legacyhive-zero-day-flaw-gets-free-unofficial-patches/","time":"08:06","priority":"SHOULD READ","score":86,"tldr":"Free unofficial 0Patch micropatches are available for the Windows LegacyHive zero-day, which lets non-admin users access another user’s registry hive and potentially gain code execution when an admin logs in. Microsoft is still investigating and has not yet released an official fix.","briefOverview":"\u003cp\u003eFree unofficial patches are available for LegacyHive, a recently disclosed Windows zero-day flaw that allows attackers to escalate privileges on up-to-date Windows systems. The vulnerability was found in the Windows User Profile Service by a researcher using the handle Nightmare Eclipse and was disclosed on the day Microsoft released its July 2026 Patch Tuesday updates. Microsoft has not yet assigned a CVE ID or released official security updates for the issue, and said it is aware of the report and actively investigating the claims.\u003c/p\u003e\n\n\u003cp\u003eAfter analyzing the proof-of-concept exploit, Tharros principal vulnerability analyst Will Dormann said non-admin users can exploit LegacyHive to modify the classes registry hive and gain automatic code execution when an admin account logs into a compromised device. ACROS Security, the company behind the 0Patch platform, said the vulnerability allows a regular non-admin user to mount any other user’s registry hive in full access mode and either extract stored secrets or change registry values that affect what runs at the next login. Kevin Beaumont confirmed that the exploit works and published Microsoft Defender for Endpoint detection queries for LegacyHive.\u003c/p\u003e\n\n\u003cp\u003eACROS Security is providing free 0Patch micropatches for Windows 10 2004 or later and Windows Server 2022 or later, because the flaw does not affect systems older than Windows 10 2004 and Windows Server 2019. The company said that with 0Patch enabled, the exploit appears to work but loads a temporary user profile hive instead of the targeted admin user’s hive, which is of no use to the attacker. The micropatch can be deployed through the 0Patch agent without requiring a system restart unless custom patching policies block it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Free unofficial patches are available for a recently disclosed Windows zero-day flaw called LegacyHive that allows attackers to escalate privileges on up-to-date Windows systems.","LegacyHive was found in the Windows User Profile Service by a researcher using the handle Nightmare Eclipse, who disclosed it on the day Microsoft released its July 2026 Patch Tuesday updates.","Tharros principal vulnerability analyst Will Dormann said non-admin users can exploit LegacyHive to modify the classes registry hive and gain automatic code execution when an admin account logs into a compromised device.","ACROS Security is providing free 0Patch micropatches for Windows 10 2004 or later and Windows Server 2022 or later because Microsoft has not yet assigned a CVE ID or released official security updates for LegacyHive.","Microsoft said it is aware of the reported vulnerability and is actively investigating the validity and potential applicability of the claims."],"insights":["ACROS Security says its 0Patch fix does not stop the exploit from appearing to run, but redirects it to load a temporary user profile hive, which the company says is useless to the attacker.","The unofficial micropatch can be deployed automatically through the 0Patch agent without requiring a system restart, unless custom patching policies block it.","Kevin Beaumont published Microsoft Defender for Endpoint hunting queries for LegacyHive, giving defenders a way to look for exploitation while an official Microsoft patch is unavailable.","The researcher who disclosed LegacyHive has released multiple Windows and Microsoft Defender zero-day exploits in recent months, and the article states that several of those issues are still waiting for patches."],"referencedReports":[{"title":"Micropatches Available for LegacyHive Windows User Profile Service Elevation of Privilege 0day","url":"https://0patch.com/blog/micropatches-available-for-legacyhive-windows-user-profile-service-elevation-of-p","publisher":"ACROS Security","context":"The article cites ACROS Security’s 0Patch write-up explaining the LegacyHive vulnerability and the free unofficial micropatches available for affected Windows systems.","category":"","primary":false}],"body":"\u003cp\u003eFree unofficial patches are available for LegacyHive, a recently disclosed Windows zero-day flaw that allows attackers to escalate privileges on up-to-date Windows systems. The vulnerability was found in the Windows User Profile Service by a researcher using the handle Nightmare Eclipse and was disclosed on the day Microsoft released its July 2026 Patch Tuesday updates. Microsoft has not yet assigned a CVE ID or released official security updates for the issue, and said it is aware of the report and actively investigating the claims.\u003c/p\u003e\n\n\u003cp\u003eAfter analyzing the proof-of-concept exploit, Tharros principal vulnerability analyst Will Dormann said non-admin users can exploit LegacyHive to modify the classes registry hive and gain automatic code execution when an admin account logs into a compromised device. ACROS Security, the company behind the 0Patch platform, said the vulnerability allows a regular non-admin user to mount any other user’s registry hive in full access mode and either extract stored secrets or change registry values that affect what runs at the next login. Kevin Beaumont confirmed that the exploit works and published Microsoft Defender for Endpoint detection queries for LegacyHive.\u003c/p\u003e\n\n\u003cp\u003eACROS Security is providing free 0Patch micropatches for Windows 10 2004 or later and Windows Server 2022 or later, because the flaw does not affect systems older than Windows 10 2004 and Windows Server 2019. The company said that with 0Patch enabled, the exploit appears to work but loads a temporary user profile hive instead of the targeted admin user’s hive, which is of no use to the attacker. The micropatch can be deployed through the 0Patch agent without requiring a system restart unless custom patching policies block it.\u003c/p\u003e\n"},{"n":11,"title":"The Procurement Trap: Inside an AiTM Campaign Targeting Global Institutions","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/the-procurement-trap-inside-an-aitm-campaign-targeting-global-institutions/","time":"19:10","priority":"SHOULD READ","score":86,"tldr":"Infoblox uncovered a sophisticated adversary-in-the-middle phishing campaign using compromised aged domains, fake procurement/document portals, CAPTCHAs, and cloned Microsoft login pages to steal MFA-protected session tokens from universities, enterprises, and global institutions. The key takeaway is that MFA alone is not enough when attackers can proxy legitimate authentication flows and hijack authenticated sessions.","briefOverview":"\u003cp\u003eInfoblox analyzed a sophisticated adversary-in-the-middle phishing campaign targeting universities, enterprises, and multinational institutions, including European Union and United Nations agencies. The campaign uses project-themed lures such as requests for information, bid invitations, and shared project documentation. Emails are sent from compromised organizational accounts, which helps the lures appear credible and allows the actor to spread them more broadly across organizations.\u003c/p\u003e\n\n\u003cp\u003eVictims who click the links are guided through fake document download pages, email prompts, CAPTCHA checks, and cloned authentication pages impersonating trusted services such as Microsoft, OpenGov, ConstructConnect, and European financial institutions. The actor uses multiple AiTM phishing kits, including EvilProxy, FlowerStorm/Storm-1167, and Kali365, to intercept credentials, session cookies, authentication tokens, and MFA-protected access in real time. This allows the attacker to establish authenticated sessions without directly bypassing MFA protections.\u003c/p\u003e\n\n\u003cp\u003eThe campaign relies on aged, often dormant domains that are likely compromised and used to host fake document download pages through injected PHP files. Infoblox identified domains such as testserveren.com and barifurniture.net, along with broader infrastructure patterns tied to FlowerStorm/Storm-1167, EvilProxy, and Kali365. The article concludes that MFA alone is not enough against attacks that hijack trusted sessions, and that DNS-based threat intelligence can expose patterns such as RDGA domains, subdomain conventions, and infrastructure reuse before users enter credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox analyzed an adversary-in-the-middle phishing campaign that targets universities, enterprises, multinational institutions, and European Union and United Nations agencies with project-themed lures.","The campaign uses emails sent from compromised organizational accounts and themes such as requests for information, bid invitations, and shared project documentation to increase credibility.","Victims are led through fake document download pages, email prompts, CAPTCHA or Cloudflare Turnstile checks, and cloned authentication pages impersonating services such as Microsoft, OpenGov, ConstructConnect, and European financial institutions.","The actor uses multiple adversary-in-the-middle phishing kits, including EvilProxy, FlowerStorm/Storm-1167, and Kali365, to capture credentials, session cookies, authentication tokens, and MFA-protected access in real time.","The campaign relies on aged and likely compromised domains, including examples such as testserveren.com and barifurniture.net, to host fake document download pages and evade reputation-based detection."],"insights":["The campaign’s use of aged, dormant, and likely compromised domains means domain age and reputation alone may not reliably distinguish malicious infrastructure from legitimate sites.","The phishing flow deliberately adds intermediate steps such as fake file access, email verification, and CAPTCHA checks, which may reduce user suspicion compared with a direct jump to a login page.","The actor’s rotation across EvilProxy, FlowerStorm/Storm-1167, and Kali365 shows operational resilience because the campaign does not depend on a single phishing kit.","The article highlights DNS patterns, including RDGA-style domains and subdomain conventions, as persistent indicators that can remain useful even after individual phishing URLs expire."],"referencedReports":[{"title":"Evil Proxy Phishing Campaign","url":"https://www.okta.com/es-es/blog/threat-intelligence/evil-proxy-phishing-campaign/","publisher":"Okta","context":"The article links to Okta’s analysis as a reference for the EvilProxy phishing-as-a-service kit used in the campaign.","category":"","primary":false},{"title":"FlowerStorm","url":"https://any.run/malware-trends/flowerstorm/","publisher":"ANY.RUN","context":"The article links to ANY.RUN’s FlowerStorm material as a reference for the FlowerStorm phishing kit observed in the campaign.","category":"","primary":false},{"title":"Token Bingo: Don’t Let Your Code Be the Winner","url":"https://arcticwolf.com/resources/blog/token-bingo-dont-let-your-code-be-the-winner/","publisher":"Arctic Wolf","context":"The article links to Arctic Wolf’s Kali365 analysis as a reference for the Kali365 phishing-as-a-service kit observed in the campaign.","category":"","primary":false}],"body":"\u003cp\u003eInfoblox analyzed a sophisticated adversary-in-the-middle phishing campaign targeting universities, enterprises, and multinational institutions, including European Union and United Nations agencies. The campaign uses project-themed lures such as requests for information, bid invitations, and shared project documentation. Emails are sent from compromised organizational accounts, which helps the lures appear credible and allows the actor to spread them more broadly across organizations.\u003c/p\u003e\n\n\u003cp\u003eVictims who click the links are guided through fake document download pages, email prompts, CAPTCHA checks, and cloned authentication pages impersonating trusted services such as Microsoft, OpenGov, ConstructConnect, and European financial institutions. The actor uses multiple AiTM phishing kits, including EvilProxy, FlowerStorm/Storm-1167, and Kali365, to intercept credentials, session cookies, authentication tokens, and MFA-protected access in real time. This allows the attacker to establish authenticated sessions without directly bypassing MFA protections.\u003c/p\u003e\n\n\u003cp\u003eThe campaign relies on aged, often dormant domains that are likely compromised and used to host fake document download pages through injected PHP files. Infoblox identified domains such as testserveren.com and barifurniture.net, along with broader infrastructure patterns tied to FlowerStorm/Storm-1167, EvilProxy, and Kali365. The article concludes that MFA alone is not enough against attacks that hijack trusted sessions, and that DNS-based threat intelligence can expose patterns such as RDGA domains, subdomain conventions, and infrastructure reuse before users enter credentials.\u003c/p\u003e\n"},{"n":35,"title":"New Project CAV3RN module abuses Outlook calendar events for C2 and DNS AAAA records for configuration recovery","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/project-cav3rn-cyberespionage-framework-using-outlook-and-dns/120757/","time":"08:40","priority":"SHOULD READ","score":86,"tldr":"Kaspersky analyzed a new Project CAV3RN communication module that uses Microsoft Graph to hide command-and-control traffic in Outlook calendar events, with encrypted attachments carrying commands and results. If Microsoft Graph access fails, the module can recover replacement Microsoft 365 connection settings through attacker-controlled DNS AAAA records.","briefOverview":"\u003cp\u003eKaspersky analyzed a newly identified Project CAV3RN communication module named \u003ccode\u003eAzureCommunication.dll\u003c/code\u003e, a .NET Native AOT DLL that appears designed to replace the framework’s earlier HTTP/WebSocket communication component. The module exchanges commands, heartbeats, and command results through Outlook calendar events accessed via Microsoft Graph. The default configuration includes Microsoft Entra tenant details, application credentials, a target mailbox, a DNS bootstrap host, and RSA keys used for communication.\u003c/p\u003e\n\n\u003cp\u003eThe module uses the default calendar of the configured mailbox as a dead-drop channel, placing activity in a fixed one-hour window on May 13, 2050. Operator commands are stored in events with subjects containing \u003ccode\u003eEvent ID: \u0026lt;agent-id\u0026gt;\u003c/code\u003e, while heartbeats and results use \u003ccode\u003eBoss update ID: \u0026lt;agent-id\u0026gt;1500\u003c/code\u003e and \u003ccode\u003eBoss Report ID: \u0026lt;agent-id\u0026gt;1500\u003c/code\u003e. Commands and results are carried as encrypted attachments, using RSA-OAEP with SHA-256 to protect an AES-256-GCM key.\u003c/p\u003e\n\n\u003cp\u003eIf Microsoft Graph authentication or validation fails, the module attempts to recover replacement TenantId, ClientId, ClientSecret, and UserEmail values through DNS AAAA responses from \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e. The DNS recovery protocol embeds the agent ID in queries and treats returned IPv6 addresses as containers for configuration data rather than network destinations. Kaspersky retains a low-confidence assessment that Project CAV3RN is associated with OilRig, citing behavioral similarities such as use of Microsoft-hosted services and a secondary mechanism for restoring access to a cloud command-and-control channel.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified a .NET Native AOT communication module named AzureCommunication.dll that appears designed to replace Project CAV3RN’s earlier HTTP/WebSocket communication component.","The module exchanges commands, heartbeats, and command results through Outlook calendar events accessed via Microsoft Graph in the default calendar of a configured Microsoft 365 mailbox.","Commands and results are stored as encrypted calendar event attachments, using RSA-OAEP with SHA-256 to protect an AES-256-GCM key.","If Microsoft Graph authentication or tenant validation fails, the module attempts to recover replacement TenantId, ClientId, ClientSecret, and UserEmail values through DNS AAAA responses from cloudlanecdn.com.","Kaspersky retains a low-confidence assessment that Project CAV3RN is associated with OilRig based on behavioral similarities, including use of Microsoft-hosted services and a secondary recovery mechanism for cloud command-and-control access."],"insights":["All command, heartbeat, and result events use the same fixed one-hour calendar window in 2050, making that specific future time range a concrete hunting location for suspicious Outlook calendar activity.","The module leaves a local configuration artifact named logAzure.txt in the current working directory, containing Microsoft Graph connection settings and RSA keys used by the communication channel.","Command and result attachments differ by filename capitalization, with operator-to-agent commands using file0.txt and agent-to-operator results using File0.txt.","The DNS recovery mechanism only updates TenantId, ClientId, ClientSecret, and UserEmail, but not the recovery domain or RSA keys, limiting what the operators can rotate through DNS alone.","The domain cloudlanecdn.com shifted from Namecheap-managed nameservers to custom in-bailiwick authoritative nameservers on May 2, 2026, aligning with the module’s need for actor-controlled DNS responses."],"referencedReports":[{"title":"CAVERN Manticore: Exposing Iran-linked modular C2 framework","url":"https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/","publisher":"Check Point Research","context":"The article says Check Point Research publicly reported on the same controller-based CAV3RN architecture in July 2026.","category":"","primary":false},{"title":"HollowGraph Microsoft 365","url":"https://www.group-ib.com/blog/hollowgraph-microsoft-365/","publisher":"Group-IB","context":"The article says additional public research covering the same communication component became available during preparation of this report.","category":"","primary":false},{"title":"OilRig novel C2 channel steganography","url":"https://unit42.paloaltonetworks.com/oilrig-novel-c2-channel-steganography/","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42 research on RDAT malware using EWS email messages as a Microsoft-hosted command-and-control channel.","category":"","primary":false},{"title":"OilRig’s persistent attacks using cloud service-powered downloaders","url":"https://www.welivesecurity.com/en/eset-research/oilrig-persistent-attacks-cloud-service-powered-downloaders/","publisher":"ESET Research","context":"The article cites ESET research for cases involving SC5k, OilCheck, and OilBooster using Microsoft cloud services or recovery mechanisms.","category":"","primary":false},{"title":"OilRig’s Outer Space and Juicy Mix: Same ol’ rig, new drill pipes","url":"https://www.welivesecurity.com/en/eset-research/oilrigs-outer-space-juicy-mix-same-ol-rig-new-drill-pipes/","publisher":"ESET Research","context":"The article cites ESET research on Solar malware using a compromised Israeli human-resources company website.","category":"","primary":false},{"title":"Iranian malware attacks Iraqi government","url":"https://research.checkpoint.com/2024/iranian-malware-attacks-iraqi-government/","publisher":"Check Point Research","context":"The article cites Check Point Research on Whisper and Veaty malware using compromised Iraqi government Microsoft 365 mailboxes.","category":"","primary":false}],"body":"\u003cp\u003eKaspersky analyzed a newly identified Project CAV3RN communication module named \u003ccode\u003eAzureCommunication.dll\u003c/code\u003e, a .NET Native AOT DLL that appears designed to replace the framework’s earlier HTTP/WebSocket communication component. The module exchanges commands, heartbeats, and command results through Outlook calendar events accessed via Microsoft Graph. The default configuration includes Microsoft Entra tenant details, application credentials, a target mailbox, a DNS bootstrap host, and RSA keys used for communication.\u003c/p\u003e\n\n\u003cp\u003eThe module uses the default calendar of the configured mailbox as a dead-drop channel, placing activity in a fixed one-hour window on May 13, 2050. Operator commands are stored in events with subjects containing \u003ccode\u003eEvent ID: \u0026lt;agent-id\u0026gt;\u003c/code\u003e, while heartbeats and results use \u003ccode\u003eBoss update ID: \u0026lt;agent-id\u0026gt;1500\u003c/code\u003e and \u003ccode\u003eBoss Report ID: \u0026lt;agent-id\u0026gt;1500\u003c/code\u003e. Commands and results are carried as encrypted attachments, using RSA-OAEP with SHA-256 to protect an AES-256-GCM key.\u003c/p\u003e\n\n\u003cp\u003eIf Microsoft Graph authentication or validation fails, the module attempts to recover replacement TenantId, ClientId, ClientSecret, and UserEmail values through DNS AAAA responses from \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e. The DNS recovery protocol embeds the agent ID in queries and treats returned IPv6 addresses as containers for configuration data rather than network destinations. Kaspersky retains a low-confidence assessment that Project CAV3RN is associated with OilRig, citing behavioral similarities such as use of Microsoft-hosted services and a secondary mechanism for restoring access to a cloud command-and-control channel.\u003c/p\u003e\n"},{"n":20,"title":"Open-Source Android AI Agents Could Let Invisible Screen Text Run Code on Host PCs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/open-source-android-ai-agents-could-let.html","time":"11:58","priority":"SHOULD READ","score":84,"tldr":"Researchers found that five open-source Android AI agent frameworks can be manipulated by hidden or tampered screen text to leak input, spoof actions, and in some cases execute commands on the host PC via unsafe ADB shell handling. The core takeaway is that these agents treat model-perceived screen content as trusted input, but the LLM and screenshot pipeline are not security boundaries.","briefOverview":"\u003cp\u003eResearchers demonstrated seven attacks against five open-source mobile agent frameworks: AppAgent, AppAgentX, Mobile-Agent-v3, Open-AutoGLM, and MobA. Every framework fell to at least six of the seven attacks, according to a paper posted on arXiv on July 1 and revised on July 14. The attacks show that an Android app with abilities such as drawing over other windows or writing to shared storage can feed hidden instructions to the AI agent controlling the phone.\u003c/p\u003e\n\n\u003cp\u003eThe most serious chain described in the article can move from invisible or tampered screen text to commands running on the PC that is driving the agent. AppAgent’s controller is highlighted because it uses a shell call and builds ADB text input from model output with inadequate filtering, leaving shell metacharacters able to affect the host shell. The researchers also found screenshot race conditions, broadcast-based input exposure, fake login screens, and hidden text in low-opacity screen regions or phone corner cutouts.\u003c/p\u003e\n\n\u003cp\u003eThe article says there are no CVEs and that the researchers have no evidence of the techniques being used outside a controlled setting. The affected software is open-source developer tooling, not built-in phone assistants, and the preconditions include an installed app, an agent mid-task, and USB or wireless debugging enabled. Suggested fixes include dropping shell=True, streaming screenshots instead of writing them to device storage, protecting input broadcasts, checking foreground app changes, and applying contrast enhancement, though the paper says some hardware-related hidden-screen issues have no straightforward software fix.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers demonstrated seven attacks against five open-source mobile agent frameworks: AppAgent, AppAgentX, Mobile-Agent-v3, Open-AutoGLM, and MobA, and every framework was vulnerable to at least six of the seven attacks.","The paper describes a chain in which an Android app that can draw over other windows and write to shared storage can place invisible instructions for the AI agent, and in some cases those instructions can lead to commands running on the PC controlling the agent.","AppAgent’s controller builds ADB shell text input from model output with insufficient sanitization, leaving shell metacharacters such as semicolons and ampersands able to be interpreted by the host shell.","The researchers found screenshot race conditions in several frameworks because screenshots were written to shared device storage before being pulled, giving a malicious background service a 50 to 500 millisecond window to alter the image.","The article says the researchers privately emailed affected maintainers before posting the preprint but had not received a response, and The Hacker News found no published security policy in any of the five repositories."],"insights":["The article highlights that model-visible text can be effectively invisible to humans, since all six tested vision models read 2%-opacity text in at least 18 of 20 trials while the paper describes that level as below typical human detection under normal viewing.","A security prompt is not a reliable fallback in these systems because Open-AutoGLM’s prompt only appears when the model judges an action to be sensitive, and perception attacks can alter that judgment before the prompt is triggered.","Some safer implementation choices already exist across the tested projects, but no project combines them: MobA avoids the screenshot file race by streaming screenshots, while Open-AutoGLM avoids host command injection by passing arguments as lists.","The phone’s physical shape creates a software-visible blind spot, because pixels hidden under rounded corners or camera cutouts still appear in screenshots and were read by all five agents in the researchers’ tests.","The article identifies a disclosure gap around research-grade open-source AI agent projects, noting that none of the five repositories had a published security policy and the researchers had not received responses from maintainers."],"referencedReports":[{"title":"Unnamed arXiv preprint on seven attacks against open-source mobile agent frameworks","url":"https://arxiv.org/abs/2607.00333","publisher":"Simon Fraser University, Chinese University of Hong Kong, Shandong University, and Xingtu Lab at QAX","context":"The article is based on this paper, which demonstrated seven attacks against AppAgent, AppAgentX, Mobile-Agent-v3, Open-AutoGLM, and MobA.","category":"","primary":false},{"title":"Prompts Become Shells: RCE Vulnerabilities in AI Agent Frameworks","url":"https://www.microsoft.com/en-us/security/blog/2026/05/07/prompts-become-shells-rce-vulnerabilities-ai-agent-frameworks/","publisher":"Microsoft","context":"The article cites Microsoft’s May writeup on Semantic Kernel as a comparable case where model output reaching a shell led to CVEs and a patched release.","category":"","primary":false},{"title":"Wu et al. research on overlay-window prompt injection against AppAgent and Mobile-Agent","url":"https://arxiv.org/abs/2505.12981","publisher":"Wu et al.","context":"The article cites this May 2025 work as prior research on driving prompt injection through overlay windows against AppAgent and Mobile-Agent.","category":"","primary":false},{"title":"Ding et al. research on prompts that surface only while an agent is looking","url":"https://arxiv.org/abs/2510.07809","publisher":"Ding et al.","context":"The article cites this October work as related mobile-agent security research involving prompts that appear only when an agent is looking.","category":"","primary":false}],"body":"\u003cp\u003eResearchers demonstrated seven attacks against five open-source mobile agent frameworks: AppAgent, AppAgentX, Mobile-Agent-v3, Open-AutoGLM, and MobA. Every framework fell to at least six of the seven attacks, according to a paper posted on arXiv on July 1 and revised on July 14. The attacks show that an Android app with abilities such as drawing over other windows or writing to shared storage can feed hidden instructions to the AI agent controlling the phone.\u003c/p\u003e\n\n\u003cp\u003eThe most serious chain described in the article can move from invisible or tampered screen text to commands running on the PC that is driving the agent. AppAgent’s controller is highlighted because it uses a shell call and builds ADB text input from model output with inadequate filtering, leaving shell metacharacters able to affect the host shell. The researchers also found screenshot race conditions, broadcast-based input exposure, fake login screens, and hidden text in low-opacity screen regions or phone corner cutouts.\u003c/p\u003e\n\n\u003cp\u003eThe article says there are no CVEs and that the researchers have no evidence of the techniques being used outside a controlled setting. The affected software is open-source developer tooling, not built-in phone assistants, and the preconditions include an installed app, an agent mid-task, and USB or wireless debugging enabled. Suggested fixes include dropping shell=True, streaming screenshots instead of writing them to device storage, protecting input broadcasts, checking foreground app changes, and applying contrast enhancement, though the paper says some hardware-related hidden-screen issues have no straightforward software fix.\u003c/p\u003e\n"},{"n":42,"title":"FortiBleed Emergency: 74,000 Fortinet Logins Exposed","source":"youtube.com","sourceColorIdx":6,"link":"https://www.youtube.com/watch?v=fwnEN-OIH_w#new_tab\u0026utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=fortibleed-emergency-74000-fortinet-logins-exposed","time":"13:21","priority":"SHOULD READ","score":84,"tldr":"A reported FortiBleed incident has allegedly exposed about 74,000 Fortinet login credentials, creating an urgent risk for organizations using Fortinet devices. Affected users should assume credentials may be compromised and prioritize resets, MFA, and device checks.","briefOverview":"\u003cp\u003eThe article is titled “FortiBleed Emergency: 74,000 Fortinet Logins Exposed.” It presents FortiBleed as an emergency involving Fortinet logins. The headline states that 74,000 Fortinet logins were exposed.\u003c/p\u003e\n\n\u003cp\u003eThe provided article body does not contain readable explanatory text beyond the title and metadata. No clear details are available in the provided content about how the logins were exposed, who exposed them, or which specific Fortinet products were involved. The stated significance is the scale of the exposure: 74,000 Fortinet logins.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “FortiBleed Emergency: 74,000 Fortinet Logins Exposed.”","The article reports an emergency referred to as “FortiBleed.”","The article states that 74,000 Fortinet logins were exposed."],"insights":["The readable portion of the article identifies exposed logins, making account access details the central issue rather than a general Fortinet news item.","The article frames the FortiBleed issue as an emergency, so the exposure is presented as requiring immediate attention rather than routine monitoring."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “FortiBleed Emergency: 74,000 Fortinet Logins Exposed.” It presents FortiBleed as an emergency involving Fortinet logins. The headline states that 74,000 Fortinet logins were exposed.\u003c/p\u003e\n\n\u003cp\u003eThe provided article body does not contain readable explanatory text beyond the title and metadata. No clear details are available in the provided content about how the logins were exposed, who exposed them, or which specific Fortinet products were involved. The stated significance is the scale of the exposure: 74,000 Fortinet logins.\u003c/p\u003e\n"},{"n":5,"title":"Police dismantle Kratos phishing platform, arrest developer","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-dismantle-kratos-phishing-platform-arrest-developer/","time":"23:07","priority":"SHOULD READ","score":82,"tldr":"German and U.S. authorities dismantled the Kratos phishing-as-a-service platform by seizing over 200 servers, while its developer was arrested in Indonesia. The takedown disrupts a service allegedly used by more than 1,800 criminals to run about 15,000 Microsoft credential-phishing campaigns per month.","briefOverview":"\u003cp\u003eAuthorities in Germany and the U.S. dismantled the central infrastructure of Kratos, a phishing-as-a-service platform with global reach. More than 200 servers were seized, disrupting the malicious service and rendering it inoperable. The platform’s developer and technical administrator was arrested in Indonesia.\u003c/p\u003e\n\n\u003cp\u003eGermany’s BKA described Kratos as one of the world’s most widely used criminal phishing services, with confirmed victims in 35 countries, particularly in Europe and the United States. Authorities believe more than 1,800 criminal customers purchased Kratos and used it to conduct roughly 15,000 phishing campaigns per month. Each campaign had the potential to affect several thousand recipients worldwide.\u003c/p\u003e\n\n\u003cp\u003eKratos allowed threat actors to create and manage fake Microsoft authentication pages designed to steal email addresses and passwords. Stolen access to Microsoft accounts was often used to commit further crimes, including business email compromise, data theft, account takeover, and phishing attacks targeting victims’ contacts. Authorities estimate the service owner made at least €300,000 since 2024 from Kratos subscription fees, and seized servers may provide forensic evidence to identify customers of the service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Authorities in Germany and the U.S. dismantled the central infrastructure of the Kratos phishing-as-a-service platform and seized more than 200 servers.","The technical administrator and developer of Kratos was arrested in Indonesia.","Germany’s BKA described Kratos as one of the world’s most widely used criminal phishing services, with confirmed victims across 35 countries, particularly in Europe and the United States.","Authorities believe more than 1,800 criminal customers used Kratos to conduct roughly 15,000 phishing campaigns per month.","Kratos allowed criminals to create fake Microsoft authentication pages to steal email addresses and passwords, enabling Microsoft account hijacking."],"insights":["The seizure of Kratos servers may expose evidence that helps authorities identify customers of the phishing service, not just its administrator.","Kratos’ reliance on central infrastructure meant that seizing more than 200 servers could render the service inoperable and stop ongoing campaigns.","Although Kratos allegedly enabled roughly 15,000 phishing campaigns per month, authorities estimate the service owner made at least €300,000 from subscriptions since 2024.","The stolen Microsoft account credentials were valuable beyond initial account hijacking because they could be used for further crimes such as business email compromise, data theft, account takeover, and phishing victims’ contacts."],"referencedReports":[],"body":"\u003cp\u003eAuthorities in Germany and the U.S. dismantled the central infrastructure of Kratos, a phishing-as-a-service platform with global reach. More than 200 servers were seized, disrupting the malicious service and rendering it inoperable. The platform’s developer and technical administrator was arrested in Indonesia.\u003c/p\u003e\n\n\u003cp\u003eGermany’s BKA described Kratos as one of the world’s most widely used criminal phishing services, with confirmed victims in 35 countries, particularly in Europe and the United States. Authorities believe more than 1,800 criminal customers purchased Kratos and used it to conduct roughly 15,000 phishing campaigns per month. Each campaign had the potential to affect several thousand recipients worldwide.\u003c/p\u003e\n\n\u003cp\u003eKratos allowed threat actors to create and manage fake Microsoft authentication pages designed to steal email addresses and passwords. Stolen access to Microsoft accounts was often used to commit further crimes, including business email compromise, data theft, account takeover, and phishing attacks targeting victims’ contacts. Authorities estimate the service owner made at least €300,000 since 2024 from Kratos subscription fees, and seized servers may provide forensic evidence to identify customers of the service.\u003c/p\u003e\n"},{"n":12,"title":"Spain fines 23andMe nearly $3 million for cybersecurity failings enabling 2023 hack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/spain-fines-23andme-3-million-cyber-failings-data-breach","time":"17:10","priority":"SHOULD READ","score":82,"tldr":"Spain’s data protection regulator fined 23andMe €2.4 million for GDPR failures tied to its 2023 credential-stuffing breach, saying weak safeguards such as no mandatory multifactor authentication helped expose data on 6.9 million people worldwide. The regulator also faulted 23andMe for waiting 12 days to notify Spanish authorities after learning of the hack.","briefOverview":"\u003cp\u003eSpain’s Agencia Española de Protección de Datos fined 23andMe €2.4 million, or about $2.7 million, over cybersecurity failings tied to the company’s April 2023 data breach. The regulator said more than 2,600 Spaniards were affected by a breach that impacted 6.9 million people worldwide. According to the enforcement decision, 23andMe executives learned about the breach after someone tried to sell a sample of the hacked data on Reddit.\u003c/p\u003e\n\n\u003cp\u003eThe decision said 23andMe did not notify Spanish officials until 12 days after learning of the hack. The regulator called the need for immediate notification “not trivial” because early mitigation was important. It also said the company’s safeguards for highly sensitive genetic data did not meet GDPR requirements.\u003c/p\u003e\n\n\u003cp\u003eThe decision cited 23andMe’s lack of mandatory multifactor authentication as a major factor in the credential stuffing attack. It also said the company did not limit accessing, requesting, or downloading data per IP address. The regulator noted that 23andMe had described ransomware and other cyber threats at length in a May 2023 fiscal report, and that its privacy policy did not specify password strength requirements or periodic password changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Spain’s Agencia Española de Protección de Datos fined 23andMe €2.4 million, or about $2.7 million, over cybersecurity failings connected to the company’s April 2023 data breach.","The regulator said more than 2,600 Spaniards were affected by a breach that impacted 6.9 million people worldwide.","23andMe learned about the breach after someone tried to sell a sample of the hacked data on Reddit, according to the enforcement decision.","The decision cited 23andMe’s lack of mandatory multifactor authentication and lack of limits on accessing, requesting, or downloading data per IP address as factors in the credential stuffing attack.","The decision said 23andMe did not notify Spanish officials until 12 days after learning of the hack, despite the importance of immediate notification for early mitigation."],"insights":["The regulator highlighted a gap between 23andMe’s public risk disclosures and its actual safeguards, noting that the company had warned in a May 2023 fiscal report about cyber threats and breach costs while still lacking protections the decision deemed appropriate.","The enforcement decision treated highly sensitive genetic data as requiring stronger account protections, specifically pointing to the absence of mandatory multifactor authentication as a major factor in the incident.","The decision’s focus on delayed notification shows that regulators may view breach reporting speed as part of harm reduction, not just an administrative requirement.","23andMe’s privacy policy drew scrutiny because it mentioned account credentials only once and did not specify password strength or periodic password-change requirements."],"referencedReports":[{"title":"PS/00140/2025 enforcement decision","url":"https://www.aepd.es/documento/ps-00140-2025.pdf","publisher":"Agencia Española de Protección de Datos","context":"The article cites this enforcement decision as the source for details about Spain’s €2.4 million fine against 23andMe and the regulator’s findings on the 2023 breach.","category":"","primary":false}],"body":"\u003cp\u003eSpain’s Agencia Española de Protección de Datos fined 23andMe €2.4 million, or about $2.7 million, over cybersecurity failings tied to the company’s April 2023 data breach. The regulator said more than 2,600 Spaniards were affected by a breach that impacted 6.9 million people worldwide. According to the enforcement decision, 23andMe executives learned about the breach after someone tried to sell a sample of the hacked data on Reddit.\u003c/p\u003e\n\n\u003cp\u003eThe decision said 23andMe did not notify Spanish officials until 12 days after learning of the hack. The regulator called the need for immediate notification “not trivial” because early mitigation was important. It also said the company’s safeguards for highly sensitive genetic data did not meet GDPR requirements.\u003c/p\u003e\n\n\u003cp\u003eThe decision cited 23andMe’s lack of mandatory multifactor authentication as a major factor in the credential stuffing attack. It also said the company did not limit accessing, requesting, or downloading data per IP address. The regulator noted that 23andMe had described ransomware and other cyber threats at length in a May 2023 fiscal report, and that its privacy policy did not specify password strength requirements or periodic password changes.\u003c/p\u003e\n"},{"n":16,"title":"New Bit2Watt Attack Could Let Cloud Tenants Disrupt Power Grids Without an Exploit","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-bit2watt-attack-could-let-cloud.html","time":"11:24","priority":"SHOULD READ","score":82,"tldr":"Researchers showed that ordinary cloud GPU workloads could intentionally modulate power draw fast enough to create power-quality and grid-stability risks, without exploiting any software flaw. The attack is still largely theoretical at grid scale because it depends on tight synchronization, clustered GPUs, and vulnerable grid conditions, but it highlights a growing risk at the boundary between AI data centers and power infrastructure.","briefOverview":"\u003cp\u003eResearchers at Zhejiang University described Bit2Watt, a technique in which a cloud tenant with ordinary GPU access could make a data center’s power draw rise and fall rapidly without using an exploit or breaking into control systems. The paper, accepted to CHES 2026, combines measurements on real GPUs with simulations of possible grid destabilization. The article emphasizes that the work does not disclose a flaw in a specific commercial product and that no production systems were attacked.\u003c/p\u003e\n\n\u003cp\u003eBit2Watt works by making GPU power use follow controlled changes in computation, switching between high-intensity activity and near-idle states. The researchers tested SWMA, a purpose-built CUDA kernel, and LTMA, which hides modulation inside an LLM training run through hyperparameter changes and auxiliary operations. LTMA runs at lower frequencies than SWMA but produces larger amplitude and blends more easily into normal training noise, making it harder to flag.\u003c/p\u003e\n\n\u003cp\u003eThe most severe grid impacts came from simulations, including a worst-case 1 MW local grid with 1,000 GPUs modulating in perfect lockstep and a larger 9,241-bus grid model. The article notes that a real attack would require enough physically clustered GPUs, tight synchronization, power modulation that survives data-center power conditioning, and a grid resonance that amplifies the chosen frequency. It also describes related risks, including GPU servers shutting down from heat or overcurrent protection, a near-field electromagnetic covert channel, and the lack of conventional monitoring that can easily observe modulation running above common telemetry sampling rates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zhejiang University researchers described Bit2Watt, a technique in which a cloud tenant uses ordinary GPU access to rapidly modulate a data center’s power draw without exploiting a software flaw or breaking into control systems.","The researchers tested two methods: SWMA, a purpose-built CUDA kernel that switches between high-intensity and near-idle states, and LTMA, which hides similar modulation inside an LLM training run.","In the paper’s worst-case simulation of a 1 MW local grid with 1,000 synchronized GPUs, current total harmonic distortion reached 46.8% and the damping ratio fell to -0.27, indicating an unstable mode in the model.","The article states that a real attack would require several conditions to align, including enough physically clustered GPUs, tight synchronization, power modulation that survives data-center power conditioning, and a grid resonance that amplifies the chosen frequency.","The researchers also described Watt2Bit feedback effects that could trip GPU server protections and a near-field electromagnetic covert channel that recovered a 50-bit test sequence with zero errors."],"insights":["The most concerning version of Bit2Watt is not the custom CUDA kernel but the LLM-training variant, because it produces larger power swings while blending into normal training activity and is harder for operators to flag.","Existing data-center telemetry may miss the relevant behavior because common power and GPU monitoring interfaces sample at or below about 1 kHz, while the demonstrated modulation can run several times faster.","The attack surface sits between organizations that usually operate separately: cloud providers monitor compute workloads, while utilities monitor grid behavior, and the article says neither side is built to watch the other.","The paper’s strongest grid-damage results depend on an optimistic attacker assumption: many GPUs must switch in close lockstep, and the article notes that even 100 microseconds of timing jitter reduced aggregate amplitude by about 20% in the model.","The risk is not purely theoretical because Microsoft, OpenAI, and NVIDIA previously warned that synchronized AI-training power swings can cause physical grid damage when they align with critical utility frequencies."],"referencedReports":[{"title":"Bit2Watt","url":"https://arxiv.org/abs/2607.05993","publisher":"Zhejiang University researchers","context":"The article is based on this paper, accepted to CHES 2026, which describes Bit2Watt and presents GPU power-modulation measurements and grid simulations.","category":"","primary":false},{"title":"Paper on stabilizing AI-training power","url":"https://arxiv.org/abs/2508.14318","publisher":"Microsoft, OpenAI, and NVIDIA","context":"The article cites this paper as prior work warning that synchronized swings from large AI-training jobs can align with utility critical frequencies and cause physical grid damage.","category":"","primary":false},{"title":"Incident Review: Large Load Loss","url":"https://www.nerc.com/globalassets/our-work/reports/event-reports/incident_review_large_load_loss.pdf","publisher":"NERC","context":"The article cites this NERC incident review about a July 2024 Northern Virginia transmission fault that caused roughly 1,500 MW of data-center load to drop from the grid at once.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Zhejiang University described Bit2Watt, a technique in which a cloud tenant with ordinary GPU access could make a data center’s power draw rise and fall rapidly without using an exploit or breaking into control systems. The paper, accepted to CHES 2026, combines measurements on real GPUs with simulations of possible grid destabilization. The article emphasizes that the work does not disclose a flaw in a specific commercial product and that no production systems were attacked.\u003c/p\u003e\n\n\u003cp\u003eBit2Watt works by making GPU power use follow controlled changes in computation, switching between high-intensity activity and near-idle states. The researchers tested SWMA, a purpose-built CUDA kernel, and LTMA, which hides modulation inside an LLM training run through hyperparameter changes and auxiliary operations. LTMA runs at lower frequencies than SWMA but produces larger amplitude and blends more easily into normal training noise, making it harder to flag.\u003c/p\u003e\n\n\u003cp\u003eThe most severe grid impacts came from simulations, including a worst-case 1 MW local grid with 1,000 GPUs modulating in perfect lockstep and a larger 9,241-bus grid model. The article notes that a real attack would require enough physically clustered GPUs, tight synchronization, power modulation that survives data-center power conditioning, and a grid resonance that amplifies the chosen frequency. It also describes related risks, including GPU servers shutting down from heat or overcurrent protection, a near-field electromagnetic covert channel, and the lack of conventional monitoring that can easily observe modulation running above common telemetry sampling rates.\u003c/p\u003e\n"},{"n":34,"title":"A new extortion cocktail: office printers, small ransoms, and BitLocker","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/new-extortion-scheme-printers-bitlocker/120718/","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"Attackers in Colombia and Mexico abused exposed or misconfigured RDP and MSSQL services, then used legitimate tools like BitLocker and RMM software to encrypt systems and print ransom notes from office printers. The key lesson is that poor configuration, disabled protection, and ignored alerts can let intruders turn built-in enterprise tools into low-cost ransomware infrastructure.","briefOverview":"\u003cp\u003eKaspersky teams in Latin America investigated incidents in Colombia and Mexico involving misconfiguration, BitLocker encryption, and corporate printers used to deliver ransom notes. In both cases, affected users first saw locked drives in Windows Explorer and were prompted for BitLocker recovery keys. The article says these attacks show adversaries gaining infrastructure access while avoiding investment in or partnership with ransomware groups by using built-in Microsoft tools for encryption.\u003c/p\u003e\n\n\u003cp\u003eIn the Colombia case, attackers exploited an internet-exposed RDP service on a machine connected to an 8 TB storage device containing mission-critical data. They manipulated user credentials, enabled BitLocker on the drive that primarily stored financial data, and printed ransom notes after encryption was complete. The attackers demanded $3,000, but the company restored the system before forensic investigators could collect evidence, eliminating information needed to assess the incident.\u003c/p\u003e\n\n\u003cp\u003eIn the Mexico case, attackers exploited a misconfigured Microsoft SQL Server service after obtaining database login credentials from code insecurely published on GitHub. The server allowed operating system command execution through the xp_cmdshell extended stored procedure, and the attackers later deployed RMM tools including ManageEngine Endpoint Central, Mesh Agent, and Tactical RMM. They used scheduled tasks and a Group Policy Object to enable BitLocker encryption across systems, after which users saw “Hacked by XEntry Team” and ransom notes emerged from office printers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky teams in Latin America investigated incidents in Colombia and Mexico where attackers used BitLocker to encrypt corporate drives and office printers to deliver ransom notes.","In the Colombia case, attackers exploited an internet-exposed RDP service on a system connected to an 8 TB storage device and enabled BitLocker on a drive that primarily stored financial data.","The Colombia victim restored the encrypted disk before forensic investigators could collect evidence, leaving unanswered questions about the incident.","In the Mexico case, attackers exploited a misconfigured Microsoft SQL Server service with xp_cmdshell enabled after obtaining database login credentials from code insecurely published on GitHub.","The Mexico attackers deployed RMM tools including ManageEngine Endpoint Central, Mesh Agent, and Tactical RMM, then used scheduled tasks and Group Policy Object activity to enable BitLocker encryption across systems."],"insights":["The attackers avoided relying on a conventional ransomware group by using BitLocker, a built-in Microsoft tool, to encrypt data and support ransom demands.","The Mexico incident showed that existing security alerts were not enough to stop the intrusion because the organization did not conduct the necessary investigation after the alerts were generated.","The Colombia case demonstrated that rushing to restore encrypted systems can eliminate evidence needed to assess what happened and improve defenses against similar activity.","The ransom demand in the Colombia case was only $3,000, suggesting the attackers may be using lower ransom amounts as part of this extortion approach.","The ransom notes in both cases used similar reputation-based language, which the article says may indicate a link between the actors."],"referencedReports":[],"body":"\u003cp\u003eKaspersky teams in Latin America investigated incidents in Colombia and Mexico involving misconfiguration, BitLocker encryption, and corporate printers used to deliver ransom notes. In both cases, affected users first saw locked drives in Windows Explorer and were prompted for BitLocker recovery keys. The article says these attacks show adversaries gaining infrastructure access while avoiding investment in or partnership with ransomware groups by using built-in Microsoft tools for encryption.\u003c/p\u003e\n\n\u003cp\u003eIn the Colombia case, attackers exploited an internet-exposed RDP service on a machine connected to an 8 TB storage device containing mission-critical data. They manipulated user credentials, enabled BitLocker on the drive that primarily stored financial data, and printed ransom notes after encryption was complete. The attackers demanded $3,000, but the company restored the system before forensic investigators could collect evidence, eliminating information needed to assess the incident.\u003c/p\u003e\n\n\u003cp\u003eIn the Mexico case, attackers exploited a misconfigured Microsoft SQL Server service after obtaining database login credentials from code insecurely published on GitHub. The server allowed operating system command execution through the xp_cmdshell extended stored procedure, and the attackers later deployed RMM tools including ManageEngine Endpoint Central, Mesh Agent, and Tactical RMM. They used scheduled tasks and a Group Policy Object to enable BitLocker encryption across systems, after which users saw “Hacked by XEntry Team” and ransom notes emerged from office printers.\u003c/p\u003e\n"},{"n":47,"title":"The Perfect Heist: NuGet Typosquat Targets Betting Platform to Rig Results","source":"jfrog.com","sourceColorIdx":8,"link":"https://jfrog.com/blog/nuget-typosquat-targets-betting-platform/","time":"13:16","priority":"SHOULD READ","score":82,"tldr":"JFrog found a typosquatted NuGet package, Newtonsoftt.Json.Net, that impersonated Newtonsoft.Json while secretly targeting Digitain’s FG-Crash betting platform to rig game results and, in later versions, exfiltrate them to an attacker-controlled server. The key takeaway is that a supply-chain package can appear fully functional and harmless to most users while carrying a highly targeted payload for one specific victim.","briefOverview":"\u003cp\u003eJFrog Security Research discovered and disclosed a typosquatted NuGet package named \u003ccode\u003eNewtonsoftt.Json.Net\u003c/code\u003e, which masqueraded as the popular \u003ccode\u003eNewtonsoft.Json\u003c/code\u003e library while shipping a trojanized fork. The package specifically targeted Digitain’s BetOnGames \u003ccode\u003eFG-Crash\u003c/code\u003e betting game and, in later versions, exfiltrated rigged round results to an attacker-controlled server using the header \u003ccode\u003eX-Seq-ApiKey: theperfectheist2025\u003c/code\u003e. The package was available and discoverable from August 2025 to October 2025, and although it was later unlisted, the article states that its artifacts remained available for download at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package was notable because it worked as a functional JSON library for users who installed it, while its harmful behavior only activated in a specific environment. The trigger was tied to the \u003ccode\u003eJsonConvert.DefaultSettings\u003c/code\u003e property setter, after which the payload used HarmonyLib to patch \u003ccode\u003eDigitain.FG.SharedCrash.GameLogic.SharedCrashRules.GenerateGameResult\u003c/code\u003e following a delay. Across seven versions, the package evolved through three generations, moving from local-only rigging to versions with exfiltration and then to a cleaner postfix-based method of overwriting game results.\u003c/p\u003e\n\n\u003cp\u003eThe impact described in the article is targeted financial fraud against Digitain’s crash-style betting platform, with the attacker gaining prior knowledge and partial control of crash multipliers on a schedule only they knew. Gen-2 and Gen-3 variants also sent rigged results to \u003ccode\u003ehxxp[:]//185[.]126[.]237[.]64:5341/api/events/raw\u003c/code\u003e in traffic designed to resemble Seq structured logging. JFrog disclosed the issue to Digitain on July 7, 2026, and Digitain responded on July 9, 2026, that it was already aware of the reported issue and had resolved it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JFrog Security Research discovered a typosquatted NuGet package named Newtonsoftt.Json.Net that masqueraded as Newtonsoft.Json while shipping a trojanized fork targeting Digitain’s FG-Crash betting game.","The package included a working JSON library, a malicious payload in Newtonsoft.Values.Net.dll, and 0Harmony.dll, causing applications that referenced it from lib/net8.0 to load all three assemblies.","The payload activated through the JsonConvert.DefaultSettings setter, delayed execution, and used HarmonyLib to patch Digitain.FG.SharedCrash.GameLogic.SharedCrashRules.GenerateGameResult.","Across seven versions, the package evolved from local-only rigging to exfiltrating rigged results to hxxp[:]//185[.]126[.]237[.]64:5341/api/events/raw using the header X-Seq-ApiKey: theperfectheist2025.","JFrog disclosed the malicious package to Digitain on July 7, 2026, and Digitain responded on July 9, 2026, that it was already aware of the issue and had resolved it."],"insights":["The malicious package was designed to remain invisible to most users because it functioned as a real JSON library and only became harmful on systems exposing Digitain’s specific FG-Crash backend method.","The package metadata itself exposed the intended victim by repeatedly including an internal Digitain TFS repository URL for the BetOnGames FG-Crash project.","The attacker used delayed activation, including a 10-minute delay in Gen-3 and a next-day timing pattern in Gen-1, to move the malicious behavior away from application startup when operators were less likely to notice it.","The exfiltration traffic was shaped to look like normal Seq structured logging, using the same raw ingest path, header style, and event format to blend in with application telemetry.","The unobfuscated 11.0.11 release made the C2 URL, API key, and message template recoverable directly from the binary, unlike earlier ConfuserEx-protected versions."],"referencedReports":[],"body":"\u003cp\u003eJFrog Security Research discovered and disclosed a typosquatted NuGet package named \u003ccode\u003eNewtonsoftt.Json.Net\u003c/code\u003e, which masqueraded as the popular \u003ccode\u003eNewtonsoft.Json\u003c/code\u003e library while shipping a trojanized fork. The package specifically targeted Digitain’s BetOnGames \u003ccode\u003eFG-Crash\u003c/code\u003e betting game and, in later versions, exfiltrated rigged round results to an attacker-controlled server using the header \u003ccode\u003eX-Seq-ApiKey: theperfectheist2025\u003c/code\u003e. The package was available and discoverable from August 2025 to October 2025, and although it was later unlisted, the article states that its artifacts remained available for download at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package was notable because it worked as a functional JSON library for users who installed it, while its harmful behavior only activated in a specific environment. The trigger was tied to the \u003ccode\u003eJsonConvert.DefaultSettings\u003c/code\u003e property setter, after which the payload used HarmonyLib to patch \u003ccode\u003eDigitain.FG.SharedCrash.GameLogic.SharedCrashRules.GenerateGameResult\u003c/code\u003e following a delay. Across seven versions, the package evolved through three generations, moving from local-only rigging to versions with exfiltration and then to a cleaner postfix-based method of overwriting game results.\u003c/p\u003e\n\n\u003cp\u003eThe impact described in the article is targeted financial fraud against Digitain’s crash-style betting platform, with the attacker gaining prior knowledge and partial control of crash multipliers on a schedule only they knew. Gen-2 and Gen-3 variants also sent rigged results to \u003ccode\u003ehxxp[:]//185[.]126[.]237[.]64:5341/api/events/raw\u003c/code\u003e in traffic designed to resemble Seq structured logging. JFrog disclosed the issue to Digitain on July 7, 2026, and Digitain responded on July 9, 2026, that it was already aware of the reported issue and had resolved it.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft shares manual fix for WSUS sync delays and timeouts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-shares-manual-fix-for-wsus-sync-delays-and-timeouts/","time":"09:05","priority":"SHOULD READ","score":78,"tldr":"Microsoft says WSUS sync delays and timeouts caused by excess publishing metadata have been mitigated for new or rebuilt servers, but existing affected WSUS installations may need manual cleanup. Admins should back up SUSDB, run Microsoft’s cleanup query, reindex and clean up WSUS, and reset IIS/WsusPool to restore normal update scans.","briefOverview":"\u003cp\u003eMicrosoft shared manual mitigations for Windows Server Update Services servers affected by a known issue that causes Windows Update scans to fail or time out. The issue affects Windows 10, version 1607 and later, and Windows Server 2012 and later. On impacted WSUS servers, administrators may be unable to deploy the latest Windows updates through WSUS or Configuration Manager because synchronization takes longer or times out.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the delays were caused by a buildup of publishing metadata, and it rolled out a service-side mitigation for newly installed or rebuilt WSUS servers. The company said synchronization times and sync operations have been restored and are operating normally for new WSUS installations and rebuilds. For existing WSUS installations that still have long sync times, Microsoft said organizations can clean up unneeded metadata that is present but safe to remove.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s manual steps include backing up each SUSDB database, running a cleanup query from SQL Management Studio against all SUSDB databases including WSUS replicas, and updating MaxXMLPerRequest to its default setting. After cleanup, administrators should reindex SUSDB, run the WSUS Server Cleanup Wizard, and reset IIS or recycle the WsusPool application pool to clear cached catalog state. Microsoft said the first Windows Update scan after cleanup may take longer than usual, but later scans should return to normal timing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft shared manual mitigations for Windows Server Update Services servers affected by a known issue that causes Windows Update scans to fail or time out.","The issue affects Windows 10 version 1607 and later and Windows Server 2012 and later, and it can prevent administrators from deploying the latest Windows updates via WSUS or Configuration Manager.","Microsoft rolled out a service-side mitigation that restored synchronization times and sync operations for newly installed or rebuilt WSUS servers.","For existing WSUS installations with long synchronization times, Microsoft recommends backing up each SUSDB database, running a cleanup query against all SUSDB databases including replicas, and updating the MaxXMLPerRequest value to its default setting.","After cleanup, Microsoft says administrators should reindex SUSDB, run the WSUS Server Cleanup Wizard, and reset IIS or recycle the WsusPool application pool to clear cached catalog state."],"insights":["Microsoft’s service-side mitigation only restores normal synchronization for newly installed or rebuilt WSUS servers, so existing affected installations still require manual database cleanup.","The metadata causing the delays is described by Microsoft as safe to remove, which makes the recommended cleanup a supported remediation rather than a workaround that changes update content.","Administrators should include WSUS replicas when running the SUSDB cleanup query, not just primary WSUS databases.","Microsoft notes that the first Windows Update scan after cleanup may still be slower than usual, so normal performance should be judged by subsequent scans.","The client-side DataStore.edb file is not expected to shrink after the metadata is removed, and Microsoft says this does not affect scan performance."],"referencedReports":[{"title":"Resolved issues in Windows Server 2025","url":"https://learn.microsoft.com/en-us/windows/release-health/resolved-issues-windows-server-2025#3549msgdesc","publisher":"Microsoft","context":"The article cites Microsoft’s Windows release health dashboard update for the explanation that existing WSUS installations can clean up unneeded metadata to address long sync times.","category":"","primary":false},{"title":"KB5121986: Windows Server Update Service sync operations issues and timeouts","url":"https://support.microsoft.com/en-us/servicing/os/windows/docs/2026/07/kb5121986-windows-server-update-service-sync-operations-issues-and-timeouts","publisher":"Microsoft","context":"The article links to Microsoft’s support advisory for the recommended WSUS cleanup steps, including backing up SUSDB, running the cleanup query, and resetting IIS or WsusPool.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft shared manual mitigations for Windows Server Update Services servers affected by a known issue that causes Windows Update scans to fail or time out. The issue affects Windows 10, version 1607 and later, and Windows Server 2012 and later. On impacted WSUS servers, administrators may be unable to deploy the latest Windows updates through WSUS or Configuration Manager because synchronization takes longer or times out.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the delays were caused by a buildup of publishing metadata, and it rolled out a service-side mitigation for newly installed or rebuilt WSUS servers. The company said synchronization times and sync operations have been restored and are operating normally for new WSUS installations and rebuilds. For existing WSUS installations that still have long sync times, Microsoft said organizations can clean up unneeded metadata that is present but safe to remove.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s manual steps include backing up each SUSDB database, running a cleanup query from SQL Management Studio against all SUSDB databases including WSUS replicas, and updating MaxXMLPerRequest to its default setting. After cleanup, administrators should reindex SUSDB, run the WSUS Server Cleanup Wizard, and reset IIS or recycle the WsusPool application pool to clear cached catalog state. Microsoft said the first Windows Update scan after cleanup may take longer than usual, but later scans should return to normal timing.\u003c/p\u003e\n"},{"n":19,"title":"AWS Kiro Flaw Let a Poisoned Web Page Rewrite Its Config and Run Code","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/aws-kiro-flaw-let-poisoned-web-page.html","time":"16:06","priority":"SHOULD READ","score":78,"tldr":"Researchers found that AWS Kiro could be tricked by hidden instructions on a web page into rewriting its MCP configuration and running attacker-controlled code on a developer’s machine without meaningful approval. AWS has patched the flaw by protecting sensitive configuration paths, and users should update to current Kiro versions.","briefOverview":"\u003cp\u003eIntezer, in research with Kodem Security, found that hidden text on a web page could make AWS Kiro rewrite its own configuration file and run attacker-controlled code on a developer’s machine. The attack could start from an ord
