<script type="application/json" id="dl-articles">[{"n":2,"title":"Microsoft July 2026 Patch Tuesday fixes massive 570 flaws, 3 zero-days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-july-2026-patch-tuesday-fixes-massive-570-flaws-3-zero-days/","time":"18:01","priority":"MUST READ","score":96,"tldr":"Microsoft’s July 2026 Patch Tuesday fixes a record 570 vulnerabilities, including 59 critical flaws and three zero-days. Two of the zero-days, affecting Active Directory Federation Services and SharePoint Server, were already being exploited in attacks, making rapid patching a priority.","briefOverview":"\u003cp\u003eMicrosoft’s July 2026 Patch Tuesday released security updates for a record-breaking 570 flaws. The fixes include 59 vulnerabilities rated Critical, with 48 remote code execution flaws, 9 elevation of privilege flaws, 1 security bypass, and 1 spoofing issue. Microsoft said the count only includes fixes released on Patch Tuesday and excludes several earlier Microsoft fixes as well as 468 Microsoft Edge/Chromium flaws fixed by Google this month.\u003c/p\u003e\n\n\u003cp\u003eThe update fixes three zero-day vulnerabilities, including two that were actively exploited in attacks and one that was publicly disclosed. The exploited flaws are CVE-2026-56155 in Active Directory Federation Services, which can allow an authorized attacker to gain administrative privileges locally, and CVE-2026-56164 in Microsoft SharePoint Server, which can allow an unauthorized remote attacker to gain elevated privileges over a network. Microsoft also fixed CVE-2026-50661, a Windows BitLocker security feature bypass that could let an attacker with physical access gain access to encrypted data.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft did not disclose details on how the two actively exploited zero-days were used in attacks. For the SharePoint Server flaw, Microsoft said enabling Antimalware Scan Interface on the server and setting Request Body Scan mode to Full can help mitigate the issue. The article also notes that Microsoft recently warned Patch Tuesday updates would increase because it has begun using an AI-powered vulnerability discovery system to find more Windows security flaws before attackers can exploit them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s July 2026 Patch Tuesday released security updates for 570 flaws, including 59 vulnerabilities rated Critical.","The updates fix three zero-day vulnerabilities, two of which were actively exploited in attacks and one of which was publicly disclosed.","The actively exploited zero-days are CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server.","Microsoft patched CVE-2026-50661, a publicly disclosed Windows BitLocker security feature bypass that could allow an attacker with physical access to gain access to encrypted data.","Microsoft said the Patch Tuesday total excludes flaws fixed earlier in the month in products such as Mariner, Azure OpenAI, Azure Synapse, M365 Copilot, Microsoft Exchange Online, Microsoft Edge for Android, and Microsoft Entra Provisioning Service."],"insights":["Microsoft warned before this release that Patch Tuesday volumes would increase because it is using an AI-powered vulnerability discovery system to find more flaws across the Windows codebase before attackers exploit them.","The 570-flaw total does not include several Microsoft fixes released earlier in the month or 468 Microsoft Edge/Chromium flaws fixed by Google, so the broader Microsoft ecosystem saw substantially more security fixes than the Patch Tuesday count alone shows.","For the actively exploited SharePoint Server flaw CVE-2026-56164, Microsoft said enabling Antimalware Scan Interface on the server and setting Request Body Scan mode to Full can help mitigate the issue.","Microsoft credited CVE-2026-56155 to members of its Detection and Response Team, and the article says this indicates the flaw was likely uncovered while investigating active attacks."],"referencedReports":[{"title":"CVE-2026-56155 - Active Directory Federation Services Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-56155","publisher":"Microsoft Security Response Center","context":"The article references Microsoft’s advisory for an actively exploited Active Directory Federation Services zero-day fixed in the July 2026 Patch Tuesday updates.","category":"","primary":false},{"title":"CVE-2026-56164 - Microsoft SharePoint Server Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-56164","publisher":"Microsoft Security Response Center","context":"The article references Microsoft’s advisory for an actively exploited SharePoint Server zero-day and notes Microsoft’s mitigation guidance.","category":"","primary":false},{"title":"CVE-2026-50661 - Windows BitLocker Security Feature Bypass Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50661","publisher":"Microsoft Security Response Center","context":"The article references Microsoft’s advisory for a publicly disclosed Windows BitLocker bypass flaw fixed in the July 2026 Patch Tuesday updates.","category":"","primary":false},{"title":"Security Advisory Ivanti Xtraction CVE-2026-14902 CVE-2026-14903","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Xtraction-CVE-2026-14902-CVE-2026-14903?language=en_US","publisher":"Ivanti","context":"The article lists Ivanti’s advisory for two vulnerabilities in Ivanti Xtraction among recent updates from other companies.","category":"","primary":false},{"title":"VMware Security Advisory VMSA-2026-0005","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37926?utm_campaign=VCF_FY26_VCF_VMSA-2026-0005_MKT_CM_6254\u0026utm_content=VCF_FY26_VCF_VMSA-2026-0005_6254_SecurityAlert_MKT_TRANS_EM_12268","publisher":"VMware","context":"The article lists VMware’s security advisory for VMware Avi Load Balancer authentication bypass and remote code execution flaws among recent vendor updates.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft’s July 2026 Patch Tuesday released security updates for a record-breaking 570 flaws. The fixes include 59 vulnerabilities rated Critical, with 48 remote code execution flaws, 9 elevation of privilege flaws, 1 security bypass, and 1 spoofing issue. Microsoft said the count only includes fixes released on Patch Tuesday and excludes several earlier Microsoft fixes as well as 468 Microsoft Edge/Chromium flaws fixed by Google this month.\u003c/p\u003e\n\n\u003cp\u003eThe update fixes three zero-day vulnerabilities, including two that were actively exploited in attacks and one that was publicly disclosed. The exploited flaws are CVE-2026-56155 in Active Directory Federation Services, which can allow an authorized attacker to gain administrative privileges locally, and CVE-2026-56164 in Microsoft SharePoint Server, which can allow an unauthorized remote attacker to gain elevated privileges over a network. Microsoft also fixed CVE-2026-50661, a Windows BitLocker security feature bypass that could let an attacker with physical access gain access to encrypted data.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft did not disclose details on how the two actively exploited zero-days were used in attacks. For the SharePoint Server flaw, Microsoft said enabling Antimalware Scan Interface on the server and setting Request Body Scan mode to Full can help mitigate the issue. The article also notes that Microsoft recently warned Patch Tuesday updates would increase because it has begun using an AI-powered vulnerability discovery system to find more Windows security flaws before attackers can exploit them.\u003c/p\u003e\n"},{"n":5,"title":"SonicWall warns of SMA1000 flaws exploited in zero-day attacks, patch now","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-sma1000-flaws-exploited-in-zero-day-attacks-patch-now/","time":"21:23","priority":"MUST READ","score":96,"tldr":"SonicWall is urging SMA1000 customers to immediately install hotfixes for two actively exploited zero-day vulnerabilities, including a critical SSRF flaw and a post-authentication code injection bug. CISA has added both flaws to its Known Exploited Vulnerabilities catalog, and SonicWall says compromised appliances should be re-imaged or redeployed with credentials and TOTP tokens reset.","briefOverview":"\u003cp\u003eSonicWall warned that threat actors are actively exploiting two SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, in zero-day attacks. The company urged customers to install newly released security updates as soon as possible. SonicWall said its PSIRT investigated multiple cases indicating active exploitation of the vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-15409 is a critical server-side request forgery flaw in the SMA1000 Appliance Work Place interface that can let a remote, unauthenticated attacker force an appliance to make requests to unintended locations. CVE-2026-15410 is a high-severity post-authentication code injection flaw in the SMA1000 Appliance Management Console that could allow a remote authenticated administrator to execute arbitrary operating system commands. The flaws affect SMA1000 models 6210, 7210, and 8200v running specified platform-hotfix releases, with fixes available in platform-hotfix versions 12.4.3-03453 and 12.5.0-02835 and later releases.\u003c/p\u003e\n\n\u003cp\u003eSonicWall said the vulnerabilities do not affect SSL-VPN running on SonicWall firewalls or the SMA 100 Series product line. The company shared indicators of compromise for administrators to check and said compromised devices should be re-imaged or redeployed, with all user and administrator passwords changed and TOTP tokens reset. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and gave federal agencies until July 17, 2026, to secure affected systems or discontinue use of the product if mitigations cannot be applied.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall warned that two SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, are being actively exploited in zero-day attacks.","CVE-2026-15409 is a critical server-side request forgery vulnerability in the SMA1000 Appliance Work Place interface that allows a remote, unauthenticated attacker to force an appliance to make requests to unintended locations.","CVE-2026-15410 is a high-severity post-authentication code injection flaw in the SMA1000 Appliance Management Console that could allow a remote authenticated administrator to execute arbitrary operating system commands.","The vulnerabilities affect SMA1000 models 6210, 7210, and 8200v running specified platform-hotfix releases, with fixes available in platform-hotfix versions 12.4.3-03453 and 12.5.0-02835 and later releases.","CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog, and federal agencies have until July 17, 2026, to secure affected systems or discontinue use of the product if mitigations cannot be applied."],"insights":["SonicWall says there are no workarounds or mitigations for these flaws other than installing the hotfixes, making patching the only stated remediation path for affected appliances.","SonicWall has not disclosed whether attackers are chaining the two vulnerabilities together, even though it confirmed both are being actively exploited after investigating multiple incidents.","Administrators are given specific compromise checks, including unusual /__api__/login or /__api__/logout entries, suspicious /wsproxy host parameters, hotfix rollbacks with path traversal names, and illegitimate routes in /var/lib/unit/conf.json.","If compromise is found, SonicWall recommends full re-imaging or redeployment of appliances plus changing all user and administrator passwords and resetting TOTP tokens, indicating that simple patching is not considered sufficient after compromise.","The advisory explicitly excludes SonicWall firewall SSL-VPN and the SMA 100 Series product line, narrowing the urgent action to affected SMA1000 models and software versions."],"referencedReports":[{"title":"SNWLID-2026-0008","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008","publisher":"SonicWall PSIRT","context":"The article cites SonicWall's advisory as the source confirming active exploitation of the SMA1000 vulnerabilities and urging customers to install hotfixes.","category":"","primary":false}],"body":"\u003cp\u003eSonicWall warned that threat actors are actively exploiting two SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, in zero-day attacks. The company urged customers to install newly released security updates as soon as possible. SonicWall said its PSIRT investigated multiple cases indicating active exploitation of the vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-15409 is a critical server-side request forgery flaw in the SMA1000 Appliance Work Place interface that can let a remote, unauthenticated attacker force an appliance to make requests to unintended locations. CVE-2026-15410 is a high-severity post-authentication code injection flaw in the SMA1000 Appliance Management Console that could allow a remote authenticated administrator to execute arbitrary operating system commands. The flaws affect SMA1000 models 6210, 7210, and 8200v running specified platform-hotfix releases, with fixes available in platform-hotfix versions 12.4.3-03453 and 12.5.0-02835 and later releases.\u003c/p\u003e\n\n\u003cp\u003eSonicWall said the vulnerabilities do not affect SSL-VPN running on SonicWall firewalls or the SMA 100 Series product line. The company shared indicators of compromise for administrators to check and said compromised devices should be re-imaged or redeployed, with all user and administrator passwords changed and TOTP tokens reset. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and gave federal agencies until July 17, 2026, to secure affected systems or discontinue use of the product if mitigations cannot be applied.\u003c/p\u003e\n"},{"n":7,"title":"Microsoft Patches Record 622 Flaws, Including Two Zero-Days Under Active Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-patches-record-622-flaws.html","time":"20:25","priority":"MUST READ","score":96,"tldr":"Microsoft’s record July Patch Tuesday fixes 622 flaws, including two actively exploited privilege-escalation zero-days in SharePoint Server and Active Directory Federation Services that should be prioritized over higher-scored bugs. Organizations should patch exploited issues first and audit for Kerberos RC4 dependencies before applying updates, as the RC4 rollback option is being removed.","briefOverview":"\u003cp\u003eMicrosoft released its largest Patch Tuesday on record, fixing 622 of its own CVEs according to its Security Update Guide. Two of the fixes address zero-days that Microsoft says are already being exploited: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. Both are elevation-of-privilege flaws in identity and collaboration infrastructure, and the article says they should be prioritized even though they are not the highest-scored remote code execution bugs.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56164 lets an unauthenticated attacker escalate privileges over the network against SharePoint Server, and Microsoft notes that enabling AMSI in Full Mode can blunt the attack. The article also highlights that SharePoint Server 2016 and 2019 reached the end of extended support the same day, with no paid ESU program available. CVE-2026-56155 affects Active Directory Federation Services and lets an already-authenticated attacker elevate privileges locally through weak access controls.\u003c/p\u003e\n\n\u003cp\u003eThe update also includes a publicly disclosed BitLocker bypass, CVE-2026-50661, which requires physical access and is not reported as under active attack. Microsoft’s July rollout removes the Kerberos RC4 rollback switch, meaning accounts that still request RC4 Kerberos tickets may fail authentication after the update unless administrators audit and address them first. The article argues that the scale of the release and the presence of exploited mid-tier flaws make CVSS-based triage less useful, urging prioritization based on active exploitation signals such as Microsoft’s exploited flag, KEV, and EPSS.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released its largest Patch Tuesday on record, fixing 622 of its own CVEs according to the Security Update Guide.","Two actively exploited zero-days are CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services.","CVE-2026-56164 lets an unauthenticated attacker escalate privileges over the network, and Microsoft notes that enabling AMSI in Full Mode on the server blunts the attack.","CVE-2026-50661 is a publicly disclosed BitLocker bypass that requires physical access to the device and is not reported as under attack.","The July update removes the Kerberos RC4 rollback switch, so service accounts that still request RC4 Kerberos tickets may fail authentication after the update."],"insights":["The two already-exploited zero-days are not the highest-severity remote code execution bugs, showing that organizations should prioritize Microsoft’s exploited flag, KEV, and EPSS over CVSS scores for this release.","SharePoint Server 2016 and 2019 reaching end of extended support on the same day as an exploited SharePoint flaw creates extra urgency because the article says there is no paid ESU program for those versions.","Rapid7’s SharePoint authentication bypass fix matters even though the related remote code execution bug is not patched until August, because the July fix breaks the unauthenticated attack chain described in the article.","The Kerberos RC4 change is more likely to cause operational disruption than an immediate breach, so the article recommends auditing RC4 events and rotating affected service account passwords before patching.","The record number of fixes may shrink the safe testing window because attackers can compare patched and unpatched builds to identify newly fixed bugs before many organizations finish deploying updates."],"referencedReports":[{"title":"July 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Jul","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s Security Update Guide for the July Patch Tuesday count of 622 Microsoft CVEs.","category":"","primary":false},{"title":"CVE-2026-56164","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-56164","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for the actively exploited SharePoint Server privilege-escalation flaw and notes Microsoft’s AMSI Full Mode mitigation.","category":"","primary":false},{"title":"CVE-2026-56155","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-56155","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for the actively exploited Active Directory Federation Services privilege-escalation flaw.","category":"","primary":false},{"title":"CVE-2026-50661","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50661","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for the publicly disclosed BitLocker bypass that requires physical access.","category":"","primary":false},{"title":"VE: CVE-2026-55040: Microsoft SharePoint JWT Token Authentication Bypass Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed/","publisher":"Rapid7","context":"The article references Rapid7 Labs’ disclosure and technical details for the SharePoint JWT authentication bypass used in a Pwn2Own Berlin chain.","category":"","primary":false},{"title":"The July 2026 Security Update Review","url":"https://www.zerodayinitiative.com/blog/2026/7/14/the-july-2026-security-update-review","publisher":"Zero Day Initiative","context":"The article cites ZDI’s July review for its independent CVE count, severity interpretation, and per-product-family callouts.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article references CISA’s KEV catalog to note that the two exploited Microsoft CVEs were not listed there at the time of writing.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released its largest Patch Tuesday on record, fixing 622 of its own CVEs according to its Security Update Guide. Two of the fixes address zero-days that Microsoft says are already being exploited: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. Both are elevation-of-privilege flaws in identity and collaboration infrastructure, and the article says they should be prioritized even though they are not the highest-scored remote code execution bugs.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56164 lets an unauthenticated attacker escalate privileges over the network against SharePoint Server, and Microsoft notes that enabling AMSI in Full Mode can blunt the attack. The article also highlights that SharePoint Server 2016 and 2019 reached the end of extended support the same day, with no paid ESU program available. CVE-2026-56155 affects Active Directory Federation Services and lets an already-authenticated attacker elevate privileges locally through weak access controls.\u003c/p\u003e\n\n\u003cp\u003eThe update also includes a publicly disclosed BitLocker bypass, CVE-2026-50661, which requires physical access and is not reported as under active attack. Microsoft’s July rollout removes the Kerberos RC4 rollback switch, meaning accounts that still request RC4 Kerberos tickets may fail authentication after the update unless administrators audit and address them first. The article argues that the scale of the release and the presence of exploited mid-tier flaws make CVSS-based triage less useful, urging prioritization based on active exploitation signals such as Microsoft’s exploited flag, KEV, and EPSS.\u003c/p\u003e\n"},{"n":9,"title":"Microsoft’s July 2026 Patch Tuesday Addresses 569 CVEs (CVE-2026-56155, CVE-2026-56164)","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/microsofts-july-2026-patch-tuesday-addresses-569-cves-cve-2026-56155-cve-2026-56164","time":"18:23","priority":"MUST READ","score":96,"tldr":"Microsoft’s July 2026 Patch Tuesday fixed a record 569 CVEs, including three zero-days and two vulnerabilities already exploited in the wild affecting Active Directory Federation Services and SharePoint Server. Organizations should prioritize patching the exploited zero-days and critical flaws such as Dynamics NAV/Business Central RCE and multiple DHCP vulnerabilities.","briefOverview":"\u003cp\u003eMicrosoft patched 569 CVEs in its July 2026 Patch Tuesday release, making it the largest Patch Tuesday release yet and far exceeding the previous record of 198 CVEs in June. The release includes 56 critical, 510 important, and 3 moderate vulnerabilities. Microsoft said customers will see a higher volume of security updates as its MDASH scanning system is used to identify vulnerabilities faster.\u003c/p\u003e\n\n\u003cp\u003eThe update includes three zero-days, two of which were exploited in the wild. CVE-2026-56155 affects Active Directory Federation Services and could allow an attacker to gain administrator privileges, while CVE-2026-56164 affects Microsoft SharePoint Server and was also exploited in the wild. Microsoft said AMSI integration can help mitigate the SharePoint issue by scanning for and detecting malicious POST requests.\u003c/p\u003e\n\n\u003cp\u003eOther notable fixes include CVE-2026-55944, a critical remote code execution vulnerability in Microsoft Dynamics NAV and Microsoft Dynamics 365 Business Central that requires no authentication or user interaction. Microsoft also patched multiple DHCP Server and Windows DHCP Client vulnerabilities, including five rated critical, and 20 Windows Kernel elevation of privilege vulnerabilities. Tenable recommends patching systems as soon as possible and regularly scanning environments to identify systems that have not yet been patched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft patched 569 CVEs in its July 2026 Patch Tuesday release, including 56 rated critical, 510 rated important, and 3 rated moderate.","The July 2026 release includes three zero-days, two of which were exploited in the wild.","CVE-2026-56155 is an exploited Active Directory Federation Services elevation of privilege vulnerability that could allow an attacker to gain administrator privileges.","CVE-2026-56164 is an exploited Microsoft SharePoint Server elevation of privilege vulnerability affecting SharePoint Server 2019, SharePoint Server Subscription Edition, SharePoint Server 2016, and SharePoint Enterprise Server 2016.","CVE-2026-55944 is a critical remote code execution vulnerability in Microsoft Dynamics NAV and Microsoft Dynamics 365 Business Central that can be exploited with a crafted login request without authentication or user interaction."],"insights":["The July 2026 Patch Tuesday volume was nearly three times the previous record of 198 CVEs in June, and Microsoft tied the higher update volume to its use of the MDASH agentic scanning system to find vulnerabilities faster.","Although elevation of privilege flaws accounted for the largest share of fixes at 43.8%, organizations also need to prioritize remote code execution issues, which made up 25.1% of the patched vulnerabilities and included several critical flaws.","Microsoft’s advisory says AMSI integration can help mitigate CVE-2026-56164 in SharePoint Server by scanning for and detecting malicious POST requests.","CVE-2026-55944 is especially actionable for exposed Microsoft Dynamics NAV and Business Central environments because Microsoft says exploitation requires neither authentication nor user interaction.","The DHCP fixes deserve focused attention because nine CVEs affected DHCP Server and Windows DHCP Client, five were rated critical, and three were assessed as “Exploitation More Likely.”"],"referencedReports":[{"title":"Microsoft's July 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/en-us/releaseNote/2026-Jul","publisher":"Microsoft","context":"The article uses Microsoft’s July 2026 Security Updates as the source for the Patch Tuesday CVE release.","category":"","primary":false},{"title":"CVE-2026-56155: Active Directory Federation Services Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-56155","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for details on the exploited Active Directory Federation Services zero-day.","category":"","primary":false},{"title":"CVE-2026-56164: Microsoft SharePoint Server Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-56164","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for details on the exploited SharePoint Server zero-day and affected SharePoint versions.","category":"","primary":false},{"title":"CVE-2026-50661: Windows BitLocker Security Feature Bypass Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50661","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the publicly disclosed BitLocker security feature bypass vulnerability.","category":"","primary":false},{"title":"CVE-2026-55944: Microsoft Dynamics NAV and Microsoft Dynamics 365 Business Central Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-55944","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for details on the critical Dynamics NAV and Business Central remote code execution vulnerability.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft patched 569 CVEs in its July 2026 Patch Tuesday release, making it the largest Patch Tuesday release yet and far exceeding the previous record of 198 CVEs in June. The release includes 56 critical, 510 important, and 3 moderate vulnerabilities. Microsoft said customers will see a higher volume of security updates as its MDASH scanning system is used to identify vulnerabilities faster.\u003c/p\u003e\n\n\u003cp\u003eThe update includes three zero-days, two of which were exploited in the wild. CVE-2026-56155 affects Active Directory Federation Services and could allow an attacker to gain administrator privileges, while CVE-2026-56164 affects Microsoft SharePoint Server and was also exploited in the wild. Microsoft said AMSI integration can help mitigate the SharePoint issue by scanning for and detecting malicious POST requests.\u003c/p\u003e\n\n\u003cp\u003eOther notable fixes include CVE-2026-55944, a critical remote code execution vulnerability in Microsoft Dynamics NAV and Microsoft Dynamics 365 Business Central that requires no authentication or user interaction. Microsoft also patched multiple DHCP Server and Windows DHCP Client vulnerabilities, including five rated critical, and 20 Windows Kernel elevation of privilege vulnerabilities. Tenable recommends patching systems as soon as possible and regularly scanning environments to identify systems that have not yet been patched.\u003c/p\u003e\n"},{"n":10,"title":"Microsoft Patch Tuesday for July 2026 — Snort rules and prominent vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/microsoft-patch-tuesday-july-2026/","time":"20:27","priority":"MUST READ","score":95,"tldr":"Microsoft’s July 2026 Patch Tuesday fixes 622 vulnerabilities, including 57 critical flaws and two already exploited in the wild affecting AD FS and SharePoint Server. Organizations should prioritize patching the most likely-to-be-exploited RCE and privilege-escalation issues and update Snort rulesets for detection coverage.","briefOverview":"\u003cp\u003eMicrosoft released its July 2026 monthly security update, addressing 622 vulnerabilities across a range of products. Microsoft marked 57 of the vulnerabilities as critical, and said two vulnerabilities disclosed this month have been exploited in the wild. The exploited issues are CVE-2026-56155, an important-severity elevation of privilege vulnerability in Active Directory Federation Services, and CVE-2026-56164, a moderate-severity spoofing vulnerability in Microsoft SharePoint Server.\u003c/p\u003e\n\n\u003cp\u003eThe 57 critical entries include 48 remote code execution vulnerabilities, seven elevation of privilege vulnerabilities, one spoofing vulnerability and one security feature bypass vulnerability. Eleven of the critical remote code execution vulnerabilities are rated more likely to be exploited, affecting components such as Windows DHCP Server, Windows DHCP client, Windows Media and Media Foundation, Microsoft Message Queuing, SharePoint, Dynamics NAV and Dynamics 365 Business Central, and Minecraft Bedrock Dedicated Server. Other critical vulnerabilities affect products and services including Microsoft Office, Word, PowerPoint, Exchange Server, Hyper-V, Microsoft Defender, Microsoft Copilot, SQL Server, Windows TCP/IP and Windows Print Spooler.\u003c/p\u003e\n\n\u003cp\u003eTalos also highlighted several important-severity vulnerabilities that Microsoft rated more likely to be exploited, including issues in Windows Kernel, Win32k, DirectX Graphics Kernel, Windows SMB, Microsoft Edge and Windows Admin Center. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article lists Snort 2 rule ranges 1:66733 - 1:66743, 1:66745 - 1:66785, 1:66791 - 1:66793 and 1:66800 - 1:66807, as well as Snort 3 rule ranges 1:301555 - 1:301579 and 1:301581 - 1:301583.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s July 2026 security update addresses 622 vulnerabilities across a range of products, including 57 marked as critical.","Microsoft stated that two vulnerabilities disclosed this month, CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server, have been exploited in the wild.","The 57 critical vulnerabilities include 48 remote code execution issues, seven elevation of privilege issues, one spoofing issue and one security feature bypass issue.","Eleven of the critical remote code execution vulnerabilities are rated by Microsoft as more likely to be exploited and affect products including Windows DHCP Server, Windows DHCP client, Windows Media, Microsoft Message Queuing, SharePoint, Dynamics, and Minecraft Bedrock Dedicated Server.","Talos released new Snort 2 and Snort 3 rules to detect attempts to exploit some of the disclosed vulnerabilities."],"insights":["The two vulnerabilities Microsoft says have already been exploited are not rated critical: CVE-2026-56155 is important severity and CVE-2026-56164 is moderate severity, so exploitation status should factor into prioritization alongside severity.","Several critical remote code execution vulnerabilities rated more likely to be exploited can be abused by unauthorized attackers over a network or adjacent network, including issues in Windows DHCP Server, SharePoint, Microsoft Message Queuing, Dynamics, and Minecraft Bedrock Dedicated Server.","Microsoft Office, Word, and PowerPoint account for many of the remaining critical remote code execution vulnerabilities, and the article notes these are typically triggered by opening a specially crafted document.","Some critical entries affecting Microsoft cloud services were not assigned an exploitation-likelihood rating by Microsoft, which limits the use of that rating for prioritizing all affected products.","Talos provided specific Snort 2 and Snort 3 rule ranges for detection, making rule updates an immediate defensive action tied to the disclosures."],"referencedReports":[{"title":"Microsoft Security Update Guide release notes for July 2026","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Jul","publisher":"Microsoft","context":"The article points readers to Microsoft’s update page for the complete list of vulnerabilities disclosed in the July 2026 security update.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released its July 2026 monthly security update, addressing 622 vulnerabilities across a range of products. Microsoft marked 57 of the vulnerabilities as critical, and said two vulnerabilities disclosed this month have been exploited in the wild. The exploited issues are CVE-2026-56155, an important-severity elevation of privilege vulnerability in Active Directory Federation Services, and CVE-2026-56164, a moderate-severity spoofing vulnerability in Microsoft SharePoint Server.\u003c/p\u003e\n\n\u003cp\u003eThe 57 critical entries include 48 remote code execution vulnerabilities, seven elevation of privilege vulnerabilities, one spoofing vulnerability and one security feature bypass vulnerability. Eleven of the critical remote code execution vulnerabilities are rated more likely to be exploited, affecting components such as Windows DHCP Server, Windows DHCP client, Windows Media and Media Foundation, Microsoft Message Queuing, SharePoint, Dynamics NAV and Dynamics 365 Business Central, and Minecraft Bedrock Dedicated Server. Other critical vulnerabilities affect products and services including Microsoft Office, Word, PowerPoint, Exchange Server, Hyper-V, Microsoft Defender, Microsoft Copilot, SQL Server, Windows TCP/IP and Windows Print Spooler.\u003c/p\u003e\n\n\u003cp\u003eTalos also highlighted several important-severity vulnerabilities that Microsoft rated more likely to be exploited, including issues in Windows Kernel, Win32k, DirectX Graphics Kernel, Windows SMB, Microsoft Edge and Windows Admin Center. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article lists Snort 2 rule ranges 1:66733 - 1:66743, 1:66745 - 1:66785, 1:66791 - 1:66793 and 1:66800 - 1:66807, as well as Snort 3 rule ranges 1:301555 - 1:301579 and 1:301581 - 1:301583.\u003c/p\u003e\n"},{"n":8,"title":"SAP Patches CVSS 9.9 NetWeaver ABAP Flaw That Could Expose or Modify Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/sap-patches-cvss-99-netweaver-abap-flaw.html","time":"18:17","priority":"MUST READ","score":92,"tldr":"SAP’s July 2026 security updates fix a critical CVSS 9.9 NetWeaver ABAP flaw that could let authenticated attackers corrupt memory to access or modify data or disrupt systems. Customers should apply the patched ABAP Kernel and also address critical Approuter and Commerce Cloud issues involving HTTP smuggling and default OAuth credentials.","briefOverview":"\u003cp\u003eSAP released July 2026 security updates to address multiple vulnerabilities, including a critical flaw in SAP NetWeaver Application Server ABAP. The main issue is CVE-2026-44747, a CVSS 9.9 out-of-bounds write flaw that allows an authenticated attacker to exploit logical errors in memory management. Successful exploitation could cause memory corruption leading to unauthorized data access, data modification, or system unavailability.\u003c/p\u003e\n\n\u003cp\u003eSAP also addressed CVE-2026-27690, a CVSS 9.1 HTTP request/response smuggling flaw in SAP Approuter deployments in non-Cloud Foundry environments, and CVE-2026-44761, a CVSS 9.1 default credentials flaw in SAP Commerce Cloud. Onapsis said the temporary workaround for CVE-2026-44747 disables certain ICF nodes but can also disable opening transactions in SAP GUI for HTML, so installing the patched ABAP Kernel version is strongly recommended. For CVE-2026-44761, customers are advised to audit production environments for the affected sample OAuth 2.0 client and remove it if present, while the article says there is no evidence the flaws have been exploited in the wild.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP released July 2026 security updates addressing multiple vulnerabilities, including a critical flaw in SAP NetWeaver Application Server ABAP.","CVE-2026-44747 is a CVSS 9.9 out-of-bounds write flaw that can allow an authenticated attacker to cause memory corruption leading to unauthorized data access, data modification, or system unavailability.","SAP also fixed CVE-2026-27690, an HTTP request/response smuggling flaw in SAP Approuter deployments in non-Cloud Foundry environments that can expose user responses and trigger denial-of-service attacks.","SAP addressed CVE-2026-44761, a default credentials issue in SAP Commerce Cloud involving a sample OAuth 2.0 client with publicly documented sample credentials.","The article states there is no evidence that the flaws have been exploited in the wild, but customers are advised to apply the necessary updates."],"insights":["The temporary workaround for CVE-2026-44747 can disable opening transactions in SAP GUI for HTML, so SAP customers may need to prioritize installing the patched ABAP Kernel rather than relying on the workaround.","CVE-2026-44761 only affects SAP Commerce Cloud customers that executed the sample configuration script and kept the resulting OAuth 2.0 client in production without changing the hard-coded secret.","Customers that removed the sample OAuth 2.0 client or replaced its secret with a strong, unique value are not impacted by CVE-2026-44761.","Onapsis traced CVE-2026-44761 to older SAP Help Portal documentation that provided development and testing scripts without explicitly warning customers not to import the default settings into production."],"referencedReports":[{"title":"SAP Security Patch Day – July 2026","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/july-2026.html","publisher":"SAP","context":"The article cites SAP’s July 2026 security updates as the source for the multiple vulnerabilities addressed by SAP.","category":"","primary":false},{"title":"SAP Security Patch Day July 2026","url":"https://onapsis.com/blog/sap-security-patch-day-july-2026/","publisher":"Onapsis","context":"The article quotes Onapsis on the workaround for the NetWeaver ABAP flaw and its analysis of the SAP Commerce Cloud default credentials issue.","category":"","primary":false},{"title":"CVE-2026-44761 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-44761","publisher":"NIST National Vulnerability Database","context":"The article cites the NIST National Vulnerability Database description of CVE-2026-44761 to explain the impact of the default credentials issue.","category":"","primary":false}],"body":"\u003cp\u003eSAP released July 2026 security updates to address multiple vulnerabilities, including a critical flaw in SAP NetWeaver Application Server ABAP. The main issue is CVE-2026-44747, a CVSS 9.9 out-of-bounds write flaw that allows an authenticated attacker to exploit logical errors in memory management. Successful exploitation could cause memory corruption leading to unauthorized data access, data modification, or system unavailability.\u003c/p\u003e\n\n\u003cp\u003eSAP also addressed CVE-2026-27690, a CVSS 9.1 HTTP request/response smuggling flaw in SAP Approuter deployments in non-Cloud Foundry environments, and CVE-2026-44761, a CVSS 9.1 default credentials flaw in SAP Commerce Cloud. Onapsis said the temporary workaround for CVE-2026-44747 disables certain ICF nodes but can also disable opening transactions in SAP GUI for HTML, so installing the patched ABAP Kernel version is strongly recommended. For CVE-2026-44761, customers are advised to audit production environments for the affected sample OAuth 2.0 client and remove it if present, while the article says there is no evidence the flaws have been exploited in the wild.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft releases Windows 10 KB5099539 extended security update","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-windows-10-kb5099539-extended-security-update/","time":"18:49","priority":"SHOULD READ","score":88,"tldr":"Microsoft released the Windows 10 KB5099539 extended security update with July 2026 Patch Tuesday fixes for 570 vulnerabilities, available to Enterprise LTSC and ESU-enrolled devices. The update also fixes several known issues but may break legacy apps using unregistered third-party TDI transports due to new security hardening.","briefOverview":"\u003cp\u003eMicrosoft released the Windows 10 KB5099539 extended security update, which includes the July 2026 Patch Tuesday security updates for 570 vulnerabilities and additional security fixes. The update is available to Windows 10 Enterprise LTSC users and devices enrolled in the Extended Security Updates program through Windows Update. After installation, Windows 10 is updated to build 19045.7548, and Windows 10 Enterprise LTSC 2021 is updated to build 19044.7548.\u003c/p\u003e\n\n\u003cp\u003eThe update includes fixes for issues involving OLE Automation, the OneDrive shortcut in File Explorer, the Recycle Bin confirmation dialog, input hotkey behavior, Secure Boot status reporting, networking hardening, and Remote Desktop security. Microsoft warns that the networking hardening change enforces TDI transport registration requirements and may cause legacy applications using unregistered third-party TDI transports to stop working. Users can check whether they are affected by looking in the Windows System event log in Event Viewer for AFD Event ID 16003 entries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the Windows 10 KB5099539 extended security update, which includes the July 2026 Patch Tuesday security updates for 570 vulnerabilities and additional security fixes.","Consumers enrolled in Microsoft’s free Windows 10 Extended Security Updates program can receive security updates until October 12, 2027, after Microsoft extended the program by an additional year.","Windows 10 Enterprise LTSC users and devices enrolled in the ESU program can install KB5099539 through Windows Update by manually checking for updates.","After installing KB5099539, Windows 10 is updated to build 19045.7548 and Windows 10 Enterprise LTSC 2021 is updated to build 19044.7548.","Microsoft warns that a security hardening change enforcing TDI transport registration requirements may affect legacy applications that rely on unregistered third-party TDI transports."],"insights":["Administrators can check whether they are affected by the new TDI transport hardening by looking in Event Viewer under Windows System logs for AFD Event ID 16003 entries.","Organizations using trusted RDP publishers should move from SHA-1 certificate thumbprints to SHA-256 or stronger algorithms because SHA-1 support is retained only for backward compatibility and is planned for future removal.","The update restores compatibility for applications affected by a June 2026 OLE Automation issue involving COM methods with BYREF parameters sharing the same underlying storage.","Microsoft says the TDI transport change is intentional security hardening, so affected legacy applications may require vendor or configuration changes rather than waiting for Microsoft to roll back the behavior."],"referencedReports":[{"title":"July 14, 2026—KB5099539 (OS Builds 19045.7548 and 19044.7548)","url":"https://support.microsoft.com/en-US/servicing/os/windows-10/2026/07/july-14-2026-kb5099539-os-builds-19045-7548-and-19044-7548","publisher":"Microsoft","context":"The article cites Microsoft’s KB5099539 support page as the source for the Windows 10 extended security update details and fixes.","category":"","primary":false},{"title":"Third-party TDI transports might stop working after installing Windows security updates released on or after July 14, 2026","url":"https://support.microsoft.com/en-US/servicing/os/windows/docs/2026/07/third-party-tdi-transports-might-stop-working-after-installing-windows-security-updates-released-on-or-after-july-14-2026","publisher":"Microsoft","context":"The article links to Microsoft’s guidance for more information about the TDI transport registration hardening change that may affect some applications.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released the Windows 10 KB5099539 extended security update, which includes the July 2026 Patch Tuesday security updates for 570 vulnerabilities and additional security fixes. The update is available to Windows 10 Enterprise LTSC users and devices enrolled in the Extended Security Updates program through Windows Update. After installation, Windows 10 is updated to build 19045.7548, and Windows 10 Enterprise LTSC 2021 is updated to build 19044.7548.\u003c/p\u003e\n\n\u003cp\u003eThe update includes fixes for issues involving OLE Automation, the OneDrive shortcut in File Explorer, the Recycle Bin confirmation dialog, input hotkey behavior, Secure Boot status reporting, networking hardening, and Remote Desktop security. Microsoft warns that the networking hardening change enforces TDI transport registration requirements and may cause legacy applications using unregistered third-party TDI transports to stop working. Users can check whether they are affected by looking in the Windows System event log in Event Viewer for AFD Event ID 16003 entries.\u003c/p\u003e\n"},{"n":11,"title":"11 Malicious NuGet Tools Pose as Game Cheats to Drop a Windows Host-Surveillance Payload","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/11-malicious-nuget-tools-pose-as-game-cheats?utm_medium=feed","time":"19:55","priority":"SHOULD READ","score":84,"tldr":"Socket researchers found 11 malicious NuGet .NET tools posing as game cheats that download and run a Windows payload called pepesoft.exe. The payload collects host and licensing telemetry via Google Sheets, binds activity to hardware IDs, supports remote bans, and in some builds exposes Telegram-controlled screenshot and automation features.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team analyzed 11 malicious NuGet packages published as .NET command-line tools that pose as game utilities, bots, and “panels.” Each package is a first-stage downloader that fetches and executes a Windows payload named \u003ccode\u003epepesoft.exe\u003c/code\u003e from GitHub Releases and Hugging Face paths under the username \u003ccode\u003epepegit666\u003c/code\u003e. The packages target game-related themes including Albion Online, GTA5RP, GrandRP, Majestic RP, RMRP, Lineage 2, Throne and Liberty, Russian Fishing 4, trigger-bot tools, and calculator-themed tools.\u003c/p\u003e\n\n\u003cp\u003eThe downloader stage resolves GitHub download hosts through Google DNS-over-HTTPS, which can bypass hosts-file entries and local DNS sinkholes, and 10 of the 11 downloaders request elevation to resynchronize the Windows system clock before fetching the payload. All 11 packages share the same AWS-style key material and process mutex, tying the downloader stage to a single toolchain. The downloaders try Hugging Face first, then GitHub Releases, and include a dormant BitTorrent fallback because the analyzed samples contain an empty magnet link.\u003c/p\u003e\n\n\u003cp\u003eThe recovered \u003ccode\u003epepesoft.exe\u003c/code\u003e payloads use downloader-supplied key material to retrieve remote configuration, authenticate to Google Sheets, bind activations to hardware, and honor a remote HWID/UUID ban list. The direct-bytecode Albion, Calculator, and Throne payloads also include Telegram bot commands that can send screenshots back to a configured chat, while the eight PyArmor-protected payloads include a hardcoded authenticated HTTP proxy fallback for Google Sheets traffic. The article says this can expose host inventory, runtime status, hardware fingerprints, location and window metadata, and visible sensitive information captured in screenshots.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s Threat Research Team analyzed 11 malicious NuGet packages published as .NET command-line tools that pose as game utilities, bots, and panels.","Each package acts as a first-stage downloader that retrieves and executes a Windows payload named pepesoft.exe from GitHub Releases and Hugging Face paths under the username pepegit666.","The .NET downloaders resolve GitHub download hosts through Google DNS-over-HTTPS, and 10 of the 11 request elevation to resynchronize the Windows system clock before fetching the payload.","The recovered pepesoft.exe payloads retrieve remote configuration, authenticate to Google Sheets, bind activations to hardware, and honor a remote hardware-ID and UUID ban list.","The direct-bytecode Albion, Calculator, and Throne payloads include Telegram bot commands that can send screenshots back to the configured chat."],"insights":["The downloaders use Google DNS-over-HTTPS only for GitHub hosts, which can bypass hosts-file entries and local DNS sinkholes but does not bypass IP, SNI, or proxy controls.","All 11 downloaders share the same mutex and AWS-style key material, and the access key is the mutex GUID with dashes removed and lower-cased, linking the packages to a single toolchain.","The BitTorrent download path is fully implemented through bundled MonoTorrent libraries but dormant because the analyzed samples contain an empty magnet link.","Blocking Google Sheets alone may not stop telemetry from the eight PyArmor-protected payloads because they can reroute Sheets traffic through a hardcoded authenticated HTTP proxy.","The direct-bytecode payloads’ screenshot commands can expose more than game content because full-screen or window captures may include passwords, browser sessions, wallets, private messages, tokens, or recovery phrases visible at the time."],"referencedReports":[],"body":"\u003cp\u003eSocket’s Threat Research Team analyzed 11 malicious NuGet packages published as .NET command-line tools that pose as game utilities, bots, and “panels.” Each package is a first-stage downloader that fetches and executes a Windows payload named \u003ccode\u003epepesoft.exe\u003c/code\u003e from GitHub Releases and Hugging Face paths under the username \u003ccode\u003epepegit666\u003c/code\u003e. The packages target game-related themes including Albion Online, GTA5RP, GrandRP, Majestic RP, RMRP, Lineage 2, Throne and Liberty, Russian Fishing 4, trigger-bot tools, and calculator-themed tools.\u003c/p\u003e\n\n\u003cp\u003eThe downloader stage resolves GitHub download hosts through Google DNS-over-HTTPS, which can bypass hosts-file entries and local DNS sinkholes, and 10 of the 11 downloaders request elevation to resynchronize the Windows system clock before fetching the payload. All 11 packages share the same AWS-style key material and process mutex, tying the downloader stage to a single toolchain. The downloaders try Hugging Face first, then GitHub Releases, and include a dormant BitTorrent fallback because the analyzed samples contain an empty magnet link.\u003c/p\u003e\n\n\u003cp\u003eThe recovered \u003ccode\u003epepesoft.exe\u003c/code\u003e payloads use downloader-supplied key material to retrieve remote configuration, authenticate to Google Sheets, bind activations to hardware, and honor a remote HWID/UUID ban list. The direct-bytecode Albion, Calculator, and Throne payloads also include Telegram bot commands that can send screenshots back to a configured chat, while the eight PyArmor-protected payloads include a hardcoded authenticated HTTP proxy fallback for Google Sheets traffic. The article says this can expose host inventory, runtime status, hardware fingerprints, location and window metadata, and visible sensitive information captured in screenshots.\u003c/p\u003e\n"},{"n":1,"title":"Nearly 300 GitHub repos pose as legit software to push malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/nearly-300-github-repos-pose-as-legit-software-to-push-malware/","time":"19:15","priority":"SHOULD READ","score":82,"tldr":"A threat actor created nearly 300 fake GitHub repositories impersonating legitimate software projects to lure users into downloading a BoryptGrab-like infostealer. The malware steals browser data, crypto wallets, messaging tokens, credentials, and files, then exfiltrates them to a Russia-based command-and-control server.","briefOverview":"\u003cp\u003eA threat actor published 292 fake GitHub repositories impersonating legitimate software and security projects to distribute infostealer malware. The campaign drew traffic from searches for security products, cryptocurrency services, financial tools, developer utilities, secure email providers, macOS utilities, and gaming software. Arctic Wolf identified the activity after finding that one of its products was impersonated starting June 26.\u003c/p\u003e\n\n\u003cp\u003eEach fake repository included a README file with a download link leading to a malicious landing page that used spoofed branding, trust badges, and wording such as “Download Secure Content.” The page delivered a large ZIP archive whose name and payload changed roughly every minute. The archive contained a trojanized libcurl.dll and a legitimate signed WinGUP updater that side-loaded the DLL and executed an embedded infostealer in memory.\u003c/p\u003e\n\n\u003cp\u003eThe infostealer appears to be a BoryptGrab variant that targets data from 19 web browsers, 32 cryptocurrency wallet brands, Telegram, Discord, Steam, Meta’s Max messaging application, Windows Credential Manager, selected files, screenshots, system details, and installed-software lists. Arctic Wolf said this variant has a previously undocumented capability to bypass Chrome’s App-Bound Encryption through direct code injection into the browser process. The stolen data is compressed and sent to a Russia-based command-and-control server, while GitHub had removed many of the repositories but several dozen GitHub Pages redirectors still remained active at the time of the report.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor published 292 fake GitHub repositories impersonating legitimate software and security projects to distribute infostealer malware.","Each fake repository included a README file with a download link that sent visitors to a malicious landing page using trust-inspiring wording, branding, and spoofed badges.","The downloaded ZIP archive contained a trojanized libcurl.dll and a legitimate signed WinGUP updater that side-loaded the DLL to execute an embedded infostealer in memory.","The infostealer appears to be a BoryptGrab variant that steals browser data, cryptocurrency wallet data, messaging and gaming tokens, Windows Credential Manager contents, selected files, screenshots, system details, and installed-software lists.","Arctic Wolf reported that GitHub had removed a large portion of the malicious repositories, but several dozen GitHub Pages redirectors still remained active at the time of its report."],"insights":["The campaign’s delivery infrastructure was highly templated, with a single HTML/JavaScript artifact reused across impersonated brands and URL path values used to customize the visible branding and track the referring repository or redirector.","The malware delivery package changed roughly every minute, including the ZIP archive name and payload, which made the fake downloads a moving target for detection and analysis.","This BoryptGrab variant included a previously undocumented method for bypassing Chrome’s App-Bound Encryption by injecting code directly into the browser process.","The malware did not establish persistence, lacked an anti-analysis layer, and did not wipe its temporary staging directory, leaving forensic evidence behind after its one-time data collection run.","Even after many fake repositories were removed, Arctic Wolf reported that several dozen GitHub Pages redirectors remained active, showing that takedown of repositories did not fully eliminate the campaign’s infrastructure."],"referencedReports":[{"title":"Fake GitHub Repositories Deliver BoryptGrab Lineage Infostealer","url":"https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/","publisher":"Arctic Wolf","context":"The article relies on Arctic Wolf’s report for details about the fake GitHub repositories, delivery pages, malware execution flow, data theft capabilities, and attribution assessment.","category":"","primary":false}],"body":"\u003cp\u003eA threat actor published 292 fake GitHub repositories impersonating legitimate software and security projects to distribute infostealer malware. The campaign drew traffic from searches for security products, cryptocurrency services, financial tools, developer utilities, secure email providers, macOS utilities, and gaming software. Arctic Wolf identified the activity after finding that one of its products was impersonated starting June 26.\u003c/p\u003e\n\n\u003cp\u003eEach fake repository included a README file with a download link leading to a malicious landing page that used spoofed branding, trust badges, and wording such as “Download Secure Content.” The page delivered a large ZIP archive whose name and payload changed roughly every minute. The archive contained a trojanized libcurl.dll and a legitimate signed WinGUP updater that side-loaded the DLL and executed an embedded infostealer in memory.\u003c/p\u003e\n\n\u003cp\u003eThe infostealer appears to be a BoryptGrab variant that targets data from 19 web browsers, 32 cryptocurrency wallet brands, Telegram, Discord, Steam, Meta’s Max messaging application, Windows Credential Manager, selected files, screenshots, system details, and installed-software lists. Arctic Wolf said this variant has a previously undocumented capability to bypass Chrome’s App-Bound Encryption through direct code injection into the browser process. The stolen data is compressed and sent to a Russia-based command-and-control server, while GitHub had removed many of the repositories but several dozen GitHub Pages redirectors still remained active at the time of the report.\u003c/p\u003e\n"},{"n":6,"title":"US unseals indictment against alleged operators of Russian bulletproof hosting service","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/us-unseals-indictment-russians-bulletproof-hosting","time":"19:26","priority":"SHOULD READ","score":82,"tldr":"The U.S. unsealed charges against three Russians accused of running Media Land and ML Cloud, bulletproof hosting services allegedly used by ransomware gangs and stolen-card markets tied to $62 million in victim losses. The State Department is offering up to $10 million for information, including any foreign government links to the operation.","briefOverview":"\u003cp\u003eFederal prosecutors unsealed an indictment against three Russians associated with Media Land, a St. Petersburg-based bulletproof hosting provider, and its sister company ML Cloud. Aleksandr Volosovik, also known as \u0026ldquo;Yalishanda,\u0026rdquo; allegedly owned Media Land, while Yulia Pankova owned ML Cloud. Kirill Zatolokin allegedly collected payments for Media Land and coordinated services with cybercriminals.\u003c/p\u003e\n\n\u003cp\u003eThe indictment, filed in December 2024, accuses all three defendants of conspiracy to commit and aid and abet computer fraud, conspiracy to commit wire fraud, wire fraud, and conspiracy to commit money laundering. Prosecutors said Media Land and ML Cloud provided cybercriminals with infrastructure and technical support designed to help them evade law enforcement. The document cites 44 unnamed victims who suffered $62 million in losses from cybercriminal groups aided by the companies.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said ransomware groups including Lockbit, BlackSuit, and Play used services from Media Land and ML Cloud, along with stolen credit card marketplaces including Briansclub, Cardhouse, crdclub, Club2crd, Verified, Fullzinfo, Swipestore, and Bidencash. The State Department announced a reward of up to $10 million for information in the case, emphasizing information about foreign government links to Media Land and ML Cloud. Agencies from the U.K., Australia, and the Netherlands were involved in the broader investigation, and the article notes that Russia and the U.S. do not have an extradition treaty.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Federal prosecutors unsealed an indictment against three Russians associated with the St. Petersburg-based bulletproof hosting provider Media Land and sister company ML Cloud.","Aleksandr Volosovik, Yulia Pankova, and Kirill Zatolokin face charges including conspiracy to commit and aid and abet computer fraud, conspiracy to commit wire fraud, wire fraud, and conspiracy to commit money laundering.","The indictment cites 44 unnamed victims who suffered $62 million in losses from cybercriminal groups allegedly aided by Media Land and ML Cloud.","Authorities said ransomware groups including Lockbit, BlackSuit, and Play, as well as stolen credit card marketplaces including Briansclub and Bidencash, used Media Land or ML Cloud infrastructure.","The State Department announced a reward of up to $10 million for information in the case, emphasizing information about foreign government links to Media Land and ML Cloud."],"insights":["The indictment was filed in December 2024 but only unsealed after earlier U.S., U.K., and Australian sanctions against related hosting businesses, showing the case combined criminal charges with prior international financial pressure.","The State Department reward specifically asks for information about possible foreign government links to Media Land and ML Cloud, indicating authorities are looking beyond ordinary criminal customers of the hosting services.","Russia’s lack of an extradition treaty with the U.S. and its warning to citizens about travel to countries that extradite suspects to the U.S. may limit the practical reach of the indictment while the defendants remain in Russia.","Data Center Kirishi was sanctioned alongside Media Land and ML Cloud but is not mentioned in the indictment, suggesting the criminal case is narrower than the earlier sanctions action.","Media Land infrastructure allegedly served both ransomware groups and stolen credit card marketplaces, showing one hosting provider can support several distinct types of cybercrime at once."],"referencedReports":[],"body":"\u003cp\u003eFederal prosecutors unsealed an indictment against three Russians associated with Media Land, a St. Petersburg-based bulletproof hosting provider, and its sister company ML Cloud. Aleksandr Volosovik, also known as \u0026ldquo;Yalishanda,\u0026rdquo; allegedly owned Media Land, while Yulia Pankova owned ML Cloud. Kirill Zatolokin allegedly collected payments for Media Land and coordinated services with cybercriminals.\u003c/p\u003e\n\n\u003cp\u003eThe indictment, filed in December 2024, accuses all three defendants of conspiracy to commit and aid and abet computer fraud, conspiracy to commit wire fraud, wire fraud, and conspiracy to commit money laundering. Prosecutors said Media Land and ML Cloud provided cybercriminals with infrastructure and technical support designed to help them evade law enforcement. The document cites 44 unnamed victims who suffered $62 million in losses from cybercriminal groups aided by the companies.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said ransomware groups including Lockbit, BlackSuit, and Play used services from Media Land and ML Cloud, along with stolen credit card marketplaces including Briansclub, Cardhouse, crdclub, Club2crd, Verified, Fullzinfo, Swipestore, and Bidencash. The State Department announced a reward of up to $10 million for information in the case, emphasizing information about foreign government links to Media Land and ML Cloud. Agencies from the U.K., Australia, and the Netherlands were involved in the broader investigation, and the article notes that Russia and the U.S. do not have an extradition treaty.\u003c/p\u003e\n"},{"n":4,"title":"Spanish Police take down €140 million cyber fraud ring, arrest four","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/spanish-police-take-down-140-million-cyber-fraud-ring-arrest-four/","time":"20:23","priority":"SHOULD READ","score":80,"tldr":"Spanish Police dismantled a cyber fraud and money-laundering network accused of moving about €140 million from investment scams and business email compromise schemes. Four suspects were arrested across Spain, Portugal, and Panama, with €3 million frozen for victims.","briefOverview":"\u003cp\u003eSpanish Police dismantled a cybercrime and money-laundering organization that made €140 million from investment fraud and business email compromise attacks. Four people were arrested in Spain, Portugal, and Panama as part of an international operation supported by Interpol and Europol. Police described the scheme as industrial-level because it involved at least 800 bank accounts, 120 business accounts, and 67 external accomplices acting as money mules.\u003c/p\u003e\n\n\u003cp\u003eInvestigators confirmed that €94 million was channeled through the network and linked another €61 million to the group, specifically tied to business email compromise operations in 2024. Police said the fraud included “CEO fraud” and “false-invoice fraud,” involving impersonation of high-ranking executives and diversion of payments to accounts controlled by the fraudsters. Authorities searched six premises in Barcelona, Girona, Tarragona, and Porto, seized 15 computers and more than 170 smartphones, and froze €3 million in crime proceeds for victims.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Spanish Police dismantled a cybercrime and money-laundering organization that made €140 million from investment fraud and business email compromise attacks.","Four people were arrested in Spain, Portugal, and Panama as part of the law enforcement operation.","Police said the scheme involved at least 800 bank accounts, 120 business accounts, and 67 external accomplices who acted as money mules.","Investigators confirmed that €94 million was channeled through the network and linked another €61 million to the group’s 2024 business email compromise operations.","Authorities seized 15 computers and more than 170 smartphones, froze €3 million in crime proceeds, and said the main operators had been arrested."],"insights":["The investigation began after police detected money-laundering signs in 19 linked companies, showing that corporate financial activity was a key entry point for uncovering the wider fraud network.","The operation’s use of at least 800 bank accounts and 67 money mules indicates that the group relied heavily on rapid dispersal of funds across many accounts to keep stolen money out of reach.","The suspects arrested outside Spain had recently left the country but allegedly continued supporting the scheme from Portugal and Panama, highlighting the cross-border nature of the operation.","Only €3 million was immediately frozen despite police linking roughly €140 million to the organization, underscoring how quickly stolen funds can be moved and concealed through layered bank transfers."],"referencedReports":[],"body":"\u003cp\u003eSpanish Police dismantled a cybercrime and money-laundering organization that made €140 million from investment fraud and business email compromise attacks. Four people were arrested in Spain, Portugal, and Panama as part of an international operation supported by Interpol and Europol. Police described the scheme as industrial-level because it involved at least 800 bank accounts, 120 business accounts, and 67 external accomplices acting as money mules.\u003c/p\u003e\n\n\u003cp\u003eInvestigators confirmed that €94 million was channeled through the network and linked another €61 million to the group, specifically tied to business email compromise operations in 2024. Police said the fraud included “CEO fraud” and “false-invoice fraud,” involving impersonation of high-ranking executives and diversion of payments to accounts controlled by the fraudsters. Authorities searched six premises in Barcelona, Girona, Tarragona, and Porto, seized 15 computers and more than 170 smartphones, and froze €3 million in crime proceeds for victims.\u003c/p\u003e\n"},{"n":12,"title":"AI Productivity Tools: The Adoption Journey So Far","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/ai-adoption-the-ride-so-far","time":"21:34","priority":"MAY READ","score":55,"tldr":"AI productivity tools can dramatically increase output, but there is no fixed benchmark for “enough”; the practical goal is continuous improvement. The author argues that success comes from matching the right AI tools to the right tasks, giving clear prompts and goals, and sharing lessons across teams.","briefOverview":"\u003cp\u003eThe article is a first-person reflection on eight months of seriously using AI productivity tools in security work. The author says these tools have made him measurably more productive, sometimes 3x to 5x, but also created uncertainty about whether that improvement is “enough.” He argues that there is no clear benchmark for AI-driven productivity and that the more realistic goal is to be better than yesterday.\u003c/p\u003e\n\n\u003cp\u003eThe author describes using different tools for different purposes rather than relying on one tool for everything. ChatGPT is used for everyday brainstorming and quick questions, Claude for deeper research and planning, Claude Code and Cursor for coding, and NotebookLM for learning and organizing research. He emphasizes that clear goals, structured prompts, and breaking work into smaller parts are necessary for high-quality AI output.\u003c/p\u003e\n\n\u003cp\u003eThe article also explains how AI changed workflows for the author and his team at Mitiga. He says he built a fully operational internal application in about five hours with Claude to track conference submissions, deadlines, reviews, dashboards, and Slack notifications, a task that previously could have taken weeks. He concludes that team-level adoption requires sharing tools, tricks, skills, and resources, because the pace of AI change is too fast for any one person to keep up with everything alone.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The author says eight months of serious AI productivity tool use has made him measurably more productive, but he still lacks a clear benchmark for what level of productivity is enough.","The author uses different AI tools for different purposes, including ChatGPT for everyday brainstorming and questions, Claude for deeper research and planning, Claude Code and Cursor for coding, and NotebookLM for learning and organizing research.","The author built a fully operational internal application for Mitiga’s research team in about five hours using Claude, including conference tracking, submission reviews, dashboards, Slack notifications, SSO, deployment, and security audits.","The author says AI has changed his workflow by making it easier to work on three things in parallel because he can refocus on each task instead of rebuilding full context from scratch.","The author believes poor AI outputs are usually caused by his own vague prompts, failure to break work into smaller steps, or lack of clarity about the desired end goal."],"insights":["The author treats tool selection itself as a learned skill, because no single AI tool performed best across brainstorming, deep research, coding, and learning workflows.","The author found that AI adoption at a team level depends less on forcing a single process and more on repeatedly sharing tools, tricks, skills, and resources so one person’s improvement benefits everyone.","The author’s most sustainable benchmark for AI productivity is not a fixed multiplier such as 5x or 10x, but a recurring review of what worked, what could be extended, and what should be added next.","The author says AI reduced the cost of context switching by letting him preserve plans, status, and next steps across workstreams, changing deep focus into a lighter act of refocusing.","The author frames bad AI output as an operational feedback signal: vague prompts, oversized tasks, or unclear goals usually reveal problems in the user’s thinking before they reveal problems in the tool."],"referencedReports":[],"body":"\u003cp\u003eThe article is a first-person reflection on eight months of seriously using AI productivity tools in security work. The author says these tools have made him measurably more productive, sometimes 3x to 5x, but also created uncertainty about whether that improvement is “enough.” He argues that there is no clear benchmark for AI-driven productivity and that the more realistic goal is to be better than yesterday.\u003c/p\u003e\n\n\u003cp\u003eThe author describes using different tools for different purposes rather than relying on one tool for everything. ChatGPT is used for everyday brainstorming and quick questions, Claude for deeper research and planning, Claude Code and Cursor for coding, and NotebookLM for learning and organizing research. He emphasizes that clear goals, structured prompts, and breaking work into smaller parts are necessary for high-quality AI output.\u003c/p\u003e\n\n\u003cp\u003eThe article also explains how AI changed workflows for the author and his team at Mitiga. He says he built a fully operational internal application in about five hours with Claude to track conference submissions, deadlines, reviews, dashboards, and Slack notifications, a task that previously could have taken weeks. He concludes that team-level adoption requires sharing tools, tricks, skills, and resources, because the pace of AI change is too fast for any one person to keep up with everything alone.\u003c/p\u003e\n"}]</script>
