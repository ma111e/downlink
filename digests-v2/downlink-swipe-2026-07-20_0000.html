-malware-hides-c2-and-stolen.html","time":"14:33","priority":"SHOULD READ","score":88,"tldr":"HollowGraph is a newly reported espionage implant that hides command-and-control instructions and stolen files inside Microsoft 365 calendar events dated in 2050, using legitimate Microsoft Graph API traffic to blend in. Defenders should hunt for far-future calendar events with suspicious subjects or attachments, audit Graph app permissions and client secrets, and check for indicators such as cloudlanecdn[.]com and logAzure.txt.","briefOverview":"\u003cp\u003eGroup-IB has identified a newly discovered espionage implant called HollowGraph that uses a hijacked Microsoft 365 calendar as its command channel. The malware places operator instructions and stolen files as attachments on calendar events dated in the year 2050, where a mailbox owner is unlikely to look. Its use of legitimate Microsoft Graph API traffic makes the activity look like normal Microsoft 365 communication and avoids reliance on attacker-owned command servers.\u003c/p\u003e\n\n\u003cp\u003eHollowGraph is a .NET DLL that supports only two commands, \u003ccode\u003eget\u003c/code\u003e and \u003ccode\u003esend\u003c/code\u003e, and uses the compromised mailbox calendar as a two-way dead drop. It pulls tasking from an event dated \u003ccode\u003e2050-05-13\u003c/code\u003e, reads instructions from an attached file, and exfiltrates stolen files by encrypting them, creating far-future events, and uploading the data as attachments. The article says calendar-carried data is protected with hybrid RSA and AES-256 encryption, while a separate DNS channel refreshes Entra ID login details using IPv6 AAAA records from \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB found HollowGraph on at least 12 machines, with about three actively communicating during the analysis window, and observed victim traffic from 3 June to 9 July 2026. The company ties HollowGraph to Cavern with high confidence based on shared command syntax and matching internal tasking, but does not confidently attribute the campaign to a specific threat actor. Because there is no Microsoft software vulnerability to patch, the article emphasizes monitoring calendars, Microsoft Graph and mailbox activity, OAuth app permissions, DNS behavior, \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e, and the \u003ccode\u003elogAzure.txt\u003c/code\u003e configuration file.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Group-IB identified HollowGraph, a .NET DLL espionage implant that uses a hijacked Microsoft 365 calendar as a two-way command and data channel through legitimate Microsoft Graph API traffic.","HollowGraph reads operator instructions from an attachment on a calendar event dated 2050-05-13 and exfiltrates encrypted stolen files by creating far-future events with attachments.","The implant supports only two commands, get and send, and encrypts calendar-carried data with hybrid RSA and AES-256 encryption using separate key pairs for incoming and outgoing data.","HollowGraph refreshes its Entra ID login details over DNS by decoding tenant ID, client ID, client secret, and target mailbox values from IPv6 AAAA records returned by cloudlanecdn[.]com, then writes them to logAzure.txt.","Group-IB found HollowGraph on at least 12 machines, observed victim traffic from 3 June to 9 July 2026, and tied the malware with high confidence to Cavern while declining to attribute the campaign to a specific threat actor."],"insights":["The most actionable detection opportunities are inside the mailbox calendar itself, especially events dated 2050-05-13, subjects formatted as bare GUIDs or operator-style IDs, and attachments named File{n}.txt.","Because HollowGraph uses compromised Microsoft 365 accounts and normal Graph API functionality, there is no Microsoft patch to deploy; the defensive focus is on identity controls, application permissions, and monitoring.","The DNS channel is weaker than the encrypted calendar channel because it sends Entra ID app login details in the clear through IPv6 AAAA records from cloudlanecdn[.]com.","A small number of active machines among at least 12 infected systems led Group-IB to interpret the activity as targeted espionage rather than opportunistic crime.","The article distinguishes between linking HollowGraph to Cavern code with high confidence and attributing the campaign to a specific operator, which Group-IB explicitly declined to do."],"referencedReports":[{"title":"HollowGraph Microsoft 365","url":"https://www.group-ib.com/blog/hollowgraph-microsoft-365/","publisher":"Group-IB","context":"The article relies on Group-IB's analysis naming HollowGraph and describing how it uses Microsoft 365 calendar events and Microsoft Graph API traffic for command-and-control and exfiltration.","category":"research","primary":true},{"title":"Cavern Manticore: Exposing Iran-linked Modular C2 Framework","url":"https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/","publisher":"Check Point Research","context":"The article cites Check Point's earlier research on the Cavern modular backdoor framework and its attribution to an Iran-linked actor cluster called Cavern Manticore.","category":"research","primary":false}],"body":"\u003cp\u003eGroup-IB has identified a newly discovered espionage implant called HollowGraph that uses a hijacked Microsoft 365 calendar as its command channel. The malware places operator instructions and stolen files as attachments on calendar events dated in the year 2050, where a mailbox owner is unlikely to look. Its use of legitimate Microsoft Graph API traffic makes the activity look like normal Microsoft 365 communication and avoids reliance on attacker-owned command servers.\u003c/p\u003e\n\n\u003cp\u003eHollowGraph is a .NET DLL that supports only two commands, \u003ccode\u003eget\u003c/code\u003e and \u003ccode\u003esend\u003c/code\u003e, and uses the compromised mailbox calendar as a two-way dead drop. It pulls tasking from an event dated \u003ccode\u003e2050-05-13\u003c/code\u003e, reads instructions from an attached file, and exfiltrates stolen files by encrypting them, creating far-future events, and uploading the data as attachments. The article says calendar-carried data is protected with hybrid RSA and AES-256 encryption, while a separate DNS channel refreshes Entra ID login details using IPv6 AAAA records from \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB found HollowGraph on at least 12 machines, with about three actively communicating during the analysis window, and observed victim traffic from 3 June to 9 July 2026. The company ties HollowGraph to Cavern with high confidence based on shared command syntax and matching internal tasking, but does not confidently attribute the campaign to a specific threat actor. Because there is no Microsoft software vulnerability to patch, the article emphasizes monitoring calendars, Microsoft Graph and mailbox activity, OAuth app permissions, DNS behavior, \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e, and the \u003ccode\u003elogAzure.txt\u003c/code\u003e configuration file.\u003c/p\u003e\n"},{"n":37,"title":"Targeted Attack on Government Entities in the Middle East | Part 1","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1","time":"17:45","priority":"SHOULD READ","score":88,"tldr":"Zscaler ThreatLabz analyzed a July 2026 campaign targeting Middle Eastern government entities in which an East Asia-linked actor used a multi-stage malware chain involving TELESHIM, MIXEDKEY, and BINDCLOAK. The attackers abused Telegram for command-and-control, used heavy obfuscation and anti-analysis techniques, and encrypted the final payload with a key tied to each victim machine.","briefOverview":"\u003cp\u003eIn July 2026, Zscaler ThreatLabz observed new activity by a threat actor with links to East Asia targeting government entities in the Middle East. The investigation captured post-compromise activity and uncovered previously undocumented malware tooling named TELESHIM, MIXEDKEY, and BINDCLOAK. The campaign used a multi-stage attack chain to establish and maintain access on infected systems.\u003c/p\u003e\n\n\u003cp\u003eThe attack began with an ISO file containing a legitimate ASUSTek RegSchdTask.exe file that sideloaded a malicious DLL named AsTaskSched.dll. TELESHIM abused the Telegram API for command-and-control communication, used encrypted strings, installed persistence through a scheduled task, and included anti-analysis checks such as a disk I/O stress test, CPUID hypervisor detection, and a WMI RAM speed check. ThreatLabz also observed operator commands for system, user, network, and file reconnaissance, plus deployment of additional payloads.\u003c/p\u003e\n\n\u003cp\u003eMIXEDKEY was deployed as a 64-bit DLL loader that decrypted and reflectively loaded the final BINDCLOAK implant from an encrypted file staged under C:\\ProgramData\\Crypto\\DSS. The final payload was protected with two layers of XOR encryption, including a key derived from the infected machine’s volume serial number so it would decrypt and execute only on the intended target. ThreatLabz assessed with moderate-to-high confidence that the threat actor is operating out of East Asia, based on indicators including public IP geolocation, Windows server system locale, and operational hours.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In July 2026, Zscaler ThreatLabz observed activity by a threat actor linked to East Asia targeting government entities in the Middle East.","The campaign used a multi-stage attack chain that began with an ISO file containing a legitimate ASUSTek RegSchdTask.exe file that sideloaded a malicious AsTaskSched.dll DLL.","ThreatLabz identified previously undocumented malware tooling in the campaign, including TELESHIM, MIXEDKEY, and BINDCLOAK.","TELESHIM abused the Telegram API for command-and-control communication and used anti-analysis techniques including heavy disk I/O activity, CPUID hypervisor detection, and a WMI RAM speed check.","MIXEDKEY decrypted and reflectively loaded the final BINDCLOAK payload using a key derived from the infected machine’s volume serial number."],"insights":["The TELESHIM variant used in this campaign was compiled in July 2026 and added heavy code obfuscation and encrypted strings compared with earlier TELESHIM instances compiled in 2025.","TELESHIM’s hardcoded hook offset in the legitimate ASUSTek executable indicates the attacker had reverse-engineered that host application to make the malicious DLL run early in normal startup.","The actor used environmental keying by encrypting BINDCLOAK with a key derived from each victim machine’s volume serial number, which limited execution to intended targets and complicated analyst decryption.","ThreatLabz observed C2 commands only between 4 AM and 12 PM UTC, with most activity between 7 AM and 11 AM UTC, and used this timing alongside IP geolocation and system locale in its attribution assessment.","The threat actor deliberately staged the final encrypted implant under C:\\ProgramData\\Crypto\\DSS\\ with a .PCPKEY extension to impersonate Microsoft Platform Crypto Provider-related files."],"referencedReports":[],"body":"\u003cp\u003eIn July 2026, Zscaler ThreatLabz observed new activity by a threat actor with links to East Asia targeting government entities in the Middle East. The investigation captured post-compromise activity and uncovered previously undocumented malware tooling named TELESHIM, MIXEDKEY, and BINDCLOAK. The campaign used a multi-stage attack chain to establish and maintain access on infected systems.\u003c/p\u003e\n\n\u003cp\u003eThe attack began with an ISO file containing a legitimate ASUSTek RegSchdTask.exe file that sideloaded a malicious DLL named AsTaskSched.dll. TELESHIM abused the Telegram API for command-and-control communication, used encrypted strings, installed persistence through a scheduled task, and included anti-analysis checks such as a disk I/O stress test, CPUID hypervisor detection, and a WMI RAM speed check. ThreatLabz also observed operator commands for system, user, network, and file reconnaissance, plus deployment of additional payloads.\u003c/p\u003e\n\n\u003cp\u003eMIXEDKEY was deployed as a 64-bit DLL loader that decrypted and reflectively loaded the final BINDCLOAK implant from an encrypted file staged under C:\\ProgramData\\Crypto\\DSS. The final payload was protected with two layers of XOR encryption, including a key derived from the infected machine’s volume serial number so it would decrypt and execute only on the intended target. ThreatLabz assessed with moderate-to-high confidence that the threat actor is operating out of East Asia, based on indicators including public IP geolocation, Windows server system locale, and operational hours.\u003c/p\u003e\n"},{"n":26,"title":"Russian-Speaking Hacker Uses Google Gemini CLI to Control Botnet of Eight Dental Clinic PCs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/russian-speaking-hacker-uses-google.html","time":"09:07","priority":"SHOULD READ","score":85,"tldr":"A Russian-speaking threat actor known as “bandcampro” used Google Gemini CLI as a hands-on hacking assistant to migrate and operate a small botnet controlling eight dental clinic PCs. The case shows how AI agents can make command-and-control infrastructure cheap, portable, and quickly rebuildable, reducing the impact of takedowns and lowering the skill needed for cybercrime.","briefOverview":"\u003cp\u003eA Russian-speaking threat actor known as \u0026ldquo;bandcampro\u0026rdquo; used Google’s open-source Gemini CLI artificial intelligence tool to support hacking operations, according to Trend Micro’s analysis of 200 session logs from March 19 to April 21, 2026. The actor used the AI to crack passwords, set up a residential proxy, compromise WordPress merchants, and plan a phone-based cryptocurrency fraud scheme targeting elderly people in the U.S. and Canada. Trend Micro said the AI also helped migrate command-and-control infrastructure and operate a small botnet.\u003c/p\u003e\n\n\u003cp\u003eThe botnet controlled eight computers at a dental clinic and accessed their OpenDental database. Gemini CLI was used to set up and deploy a new server, configure infrastructure, set up Cloudflare tunnels, manage bots, and debug connectivity issues. The article says the actor sent natural language instructions in Russian, while the AI reported active machines, sent file enumeration and reconnaissance commands, and generated a one-line PowerShell command to infect a machine.\u003c/p\u003e\n\n\u003cp\u003eTrend Micro said the entire command-and-control operation fit in three plaintext files totaling about 5 KB, making it highly replicable and disposable. The article says this portability means a server takedown may be less impactful because the actor could rebuild the setup on a new virtual private server in minutes. Trend Micro also found that the actor contributed 11% of the text in the logs while the AI produced 89%, handling all coding and system command execution described in the operation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trend Micro analyzed 200 Gemini CLI session logs from March 19 to April 21, 2026, showing a Russian-speaking threat actor known as “bandcampro” using Google Gemini CLI for hacking-related tasks.","The actor used Gemini CLI to deploy and operate command-and-control infrastructure for a small botnet controlling eight computers at a dental clinic and accessing its OpenDental database.","Gemini CLI helped migrate the command-and-control setup to a new virtual private server, configure Cloudflare tunnels, manage bots, and debug connectivity issues within minutes.","The article says the entire command-and-control operation fit into three plaintext files totaling about 5 KB, making the infrastructure easy to replicate and rebuild on a fresh server.","The actor also used the AI agent for password cracking, WordPress admin panel brute forcing, analysis of 1Password dumps, and planning a phone-based cryptocurrency fraud scheme targeting elderly people in the U.S. and Canada."],"insights":["The article says the AI agent was not only responding to instructions but proactively proposed improvements 59 times, showing it acted as an active operational contributor rather than a passive code generator.","Trend Micro found that the actor contributed only 11% of the text in the logs while the AI produced 89%, with the AI handling all coding and system command execution described in the operation.","The command-and-control setup was small enough to fit in three plaintext files totaling about 5 KB, which the article says makes the operation highly portable and less affected by server takedowns.","The AI refused a request to build a self-spreading “agent-bomb,” but the article says it still offered helpful suggestions for manually overcoming the limitations.","The actor’s portable skill-file approach could allow similar methods to spread through plain text files that are unlikely to be flagged by traditional malware scanners on their own."],"referencedReports":[{"title":"Actor Behind Patriot Bait Used AI to Deploy C2 Botnet","url":"https://www.trendmicro.com/en_us/research/26/g/actor-behind-patriot-bait-used-ai-to-deploy-c2-botnet.html","publisher":"Trend Micro","context":"The article bases its findings on Trend Micro’s analysis of Gemini CLI session logs showing how the actor used AI to migrate command-and-control infrastructure and operate a botnet.","category":"research","primary":true}],"body":"\u003cp\u003eA Russian-speaking threat actor known as \u0026ldquo;bandcampro\u0026rdquo; used Google’s open-source Gemini CLI artificial intelligence tool to support hacking operations, according to Trend Micro’s analysis of 200 session logs from March 19 to April 21, 2026. The actor used the AI to crack passwords, set up a residential proxy, compromise WordPress merchants, and plan a phone-based cryptocurrency fraud scheme targeting elderly people in the U.S. and Canada. Trend Micro said the AI also helped migrate command-and-control infrastructure and operate a small botnet.\u003c/p\u003e\n\n\u003cp\u003eThe botnet controlled eight computers at a dental clinic and accessed their OpenDental database. Gemini CLI was used to set up and deploy a new server, configure infrastructure, set up Cloudflare tunnels, manage bots, and debug connectivity issues. The article says the actor sent natural language instructions in Russian, while the AI reported active machines, sent file enumeration and reconnaissance commands, and generated a one-line PowerShell command to infect a machine.\u003c/p\u003e\n\n\u003cp\u003eTrend Micro said the entire command-and-control operation fit in three plaintext files totaling about 5 KB, making it highly replicable and disposable. The article says this portability means a server takedown may be less impactful because the actor could rebuild the setup on a new virtual private server in minutes. Trend Micro also found that the actor contributed 11% of the text in the logs while the AI produced 89%, handling all coding and system command execution described in the operation.\u003c/p\u003e\n"},{"n":2,"title":"Cursor, Codex, Gemini CLI, Antigravity hit by sandbox escapes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cursor-codex-gemini-cli-antigravity-hit-by-sandbox-escapes/","time":"21:14","priority":"SHOULD READ","score":84,"tldr":"Researchers found sandbox escape flaws in Cursor, OpenAI Codex, Google Gemini CLI, and Antigravity where AI coding agents could write workspace files that trusted tools outside the sandbox later executed or loaded. Most issues have been patched, but the findings show a broader risk in agentic coding tools that trust project files as safe input.","briefOverview":"\u003cp\u003eSecurity researchers at Pillar Security broke out of the sandboxes in four AI coding agents: Cursor, OpenAI\u0026rsquo;s Codex, Google\u0026rsquo;s Gemini CLI, and Antigravity. The agent did not attack the sandbox directly; it stayed inside the allowed project workspace and wrote files that trusted tools outside the sandbox later ran, loaded, or scanned. Pillar published the findings as a series called the Week of Sandbox Escapes.\u003c/p\u003e\n\n\u003cp\u003eThe article says the core problem is that files inside a project workspace are treated as input by other local tools, including IDE extensions, Git integrations, VS Code task files, hook engines, and Docker Desktop. A prompt injection planted in a README, issue, dependency, or diff can become a local action on a developer\u0026rsquo;s machine. Pillar grouped the seven findings into four failure modes: denylist sandboxes, executable workspace configuration, command allowlists that trust command names rather than arguments, and privileged local daemons outside the sandbox.\u003c/p\u003e\n\n\u003cp\u003eMost of the issues are patched and vendor-acknowledged, including Cursor fixes in version 3.0.0 and an OpenAI Codex CLI fix in version 0.95.0. One Docker socket issue affected Codex, Cursor, and Gemini CLI, while Google downgraded two Antigravity findings because it judged them difficult to exploit. The article says the broader significance is that the same failure pattern appears across four tools from three vendors, and Pillar argues the fix should focus on watching when trusted local tools run something the agent wrote rather than adding more banned filenames.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Pillar Security researchers broke out of the sandboxes in Cursor, OpenAI's Codex, Google's Gemini CLI, and Antigravity by having the agent write files that trusted tools outside the sandbox later ran, loaded, or scanned.","The researchers said prompt injection can trigger the issue when a malicious instruction is planted in a README, an issue, a dependency, or a diff and becomes a local action on the developer's machine.","Pillar Security grouped the seven findings into four failure modes: denylist sandboxes, executable workspace configuration, command allowlists that trust command names rather than arguments, and privileged local daemons outside the sandbox.","Most of the issues are patched and vendor-acknowledged, including Cursor fixes in version 3.0.0 and an OpenAI Codex CLI fix in version 0.95.0.","Google classified the two Antigravity findings as “Other valid security vulnerabilities” and downgraded them because it judged them difficult to exploit due to social engineering or repository-trust requirements."],"insights":["The escapes did not require directly defeating the sandbox; the agent could remain compliant while causing risk through files that outside tools later trusted.","Path-based or filename denylist controls are fragile because Git metadata does not have to live in a folder called .git, allowing execution paths to bypass simple rules.","Command allowlists can be unsafe when they approve a command by name, as shown by Codex CLI trusting git show even though the actual invocation was not read-only.","The same Docker socket issue affected Codex, Cursor, and Gemini CLI, showing that privileged local daemons can create cross-tool escape paths outside individual sandbox designs.","Pillar’s proposed fix focuses on monitoring when trusted local tools run something written by the agent, rather than adding more banned filenames."],"referencedReports":[{"title":"Week of Sandbox Escapes","url":"https://www.pillar.security/blog/the-week-of-sandbox-escapes","publisher":"Pillar Security","context":"The article says Pillar Security published its sandbox escape findings as a series called Week of Sandbox Escapes.","category":"research","primary":true},{"title":"CVE-2026-48124 / GHSA-pc9j-3qc2-95wv","url":"https://github.com/cursor/cursor/security/advisories/GHSA-pc9j-3qc2-95wv","publisher":"Cursor","context":"The article links to Cursor's security advisory for the workspace-controlled .claude hook sandbox escape fixed in version 3.0.0.","category":"advisory","primary":false},{"title":"GHSA-p9g2-cr55-cw9c","url":"https://github.com/cursor/cursor/security/advisories/GHSA-p9g2-cr55-cw9c","publisher":"Cursor","context":"The article links to a second Cursor security advisory about the agent editing a virtualenv interpreter that the Python extension later ran during discovery.","category":"advisory","primary":false},{"title":"GHSA-v4xv-rqh3-w9mc","url":"https://github.com/cursor/cursor/security/advisories/GHSA-v4xv-rqh3-w9mc","publisher":"Cursor","context":"The article links to a security advisory for the Docker socket finding that affected Codex, Cursor, and Gemini CLI.","category":"advisory","primary":false},{"title":"The Race to Ship AI Tools Left Security Behind: Part 1 – Sandbox Escape","url":"https://cymulate.com/blog/the-race-to-ship-ai-tools-left-security-behind-part-1-sandbox-escape/","publisher":"Cymulate","context":"The article says Cymulate documented the same configuration-based sandbox escape pattern across Claude Code, Gemini CLI, and Codex CLI in April.","category":"research","primary":false}],"body":"\u003cp\u003eSecurity researchers at Pillar Security broke out of the sandboxes in four AI coding agents: Cursor, OpenAI\u0026rsquo;s Codex, Google\u0026rsquo;s Gemini CLI, and Antigravity. The agent did not attack the sandbox directly; it stayed inside the allowed project workspace and wrote files that trusted tools outside the sandbox later ran, loaded, or scanned. Pillar published the findings as a series called the Week of Sandbox Escapes.\u003c/p\u003e\n\n\u003cp\u003eThe article says the core problem is that files inside a project workspace are treated as input by other local tools, including IDE extensions, Git integrations, VS Code task files, hook engines, and Docker Desktop. A prompt injection planted in a README, issue, dependency, or diff can become a local action on a developer\u0026rsquo;s machine. Pillar grouped the seven findings into four failure modes: denylist sandboxes, executable workspace configuration, command allowlists that trust command names rather than arguments, and privileged local daemons outside the sandbox.\u003c/p\u003e\n\n\u003cp\u003eMost of the issues are patched and vendor-acknowledged, including Cursor fixes in version 3.0.0 and an OpenAI Codex CLI fix in version 0.95.0. One Docker socket issue affected Codex, Cursor, and Gemini CLI, while Google downgraded two Antigravity findings because it judged them difficult to exploit. The article says the broader significance is that the same failure pattern appears across four tools from three vendors, and Pillar argues the fix should focus on watching when trusted local tools run something the agent wrote rather than adding more banned filenames.\u003c/p\u003e\n"},{"n":9,"title":"New HollowGraph malware uses Microsoft Graph for stealthy C2 comms","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-hollowgraph-malware-uses-microsoft-graph-for-stealthy-c2-comms/","time":"17:43","priority":"SHOULD READ","score":84,"tldr":"A new HollowGraph malware component abuses compromised Microsoft 365 calendars and Microsoft Graph as a stealthy command-and-control channel to receive commands and exfiltrate encrypted data. Researchers link it to the Cavern framework and targeted espionage activity against Israeli organizations.","briefOverview":"\u003cp\u003eA malicious component dubbed HollowGraph uses the calendar feature in compromised Microsoft 365 mailboxes as a command-and-control channel to receive attacker commands and exfiltrate stolen data. Researchers believe it is part of the Cavern command-and-control framework, which has previously been linked to an Iranian threat actor targeting entities in Israel. At least 12 systems have been infected, with three actively communicating with the threat actor between June 3 and July 9.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB says HollowGraph authenticates to the Microsoft Graph API using hardcoded details for a compromised Microsoft 365 account. Its configuration file, stored as logAzure.txt, includes Microsoft Entra ID tenant and application details, a client secret, a target mailbox address, a C2 domain, and two RSA keys. The malware hides commands and stolen data in files attached to calendar events dated May 13, 2050, using specific event-title formats.\u003c/p\u003e\n\n\u003cp\u003eHollowGraph supports GET and SEND commands to retrieve encrypted instructions and create calendar entries containing encrypted stolen files. It also has an unencrypted DNS tunneling channel that retrieves new Microsoft Entra ID details through IPv6 AAAA record queries to cloudlanecdn[.]com. Group-IB recommends monitoring Microsoft Graph and Microsoft 365 audit logs for suspicious application-driven calendar activity, far-future events, unusual subjects and attachments, the cloudlanecdn[.]com domain, the logAzure.txt file, and outbound DNS tunneling patterns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["HollowGraph uses the calendar feature in compromised Microsoft 365 mailboxes as a command-and-control channel to receive attacker commands and exfiltrate stolen data.","Group-IB researchers believe HollowGraph is linked with high confidence to the Cavern command-and-control framework, which has previously been associated with an Iranian threat actor targeting entities in Israel.","At least 12 systems have been infected with HollowGraph, including three that actively communicated with the threat actor between June 3 and July 9.","HollowGraph stores its configuration in a file named logAzure.txt, including Microsoft Entra ID tenant and application details, a client secret, a target mailbox address, a C2 domain, and two RSA keys.","Group-IB recommends monitoring Microsoft Graph and Microsoft 365 audit logs for suspicious application-driven calendar activity, far-future events, unusual subjects and attachments, the cloudlanecdn[.]com domain, the logAzure.txt file, and outbound DNS tunneling patterns."],"insights":["The use of calendar events dated May 13, 2050, within a fixed 22:00 to 23:00 UTC window gives defenders a concrete and unusual Microsoft 365 hunting condition rather than a broad behavior pattern.","HollowGraph can refresh stolen Microsoft Entra ID authentication details through IPv6 AAAA DNS responses from cloudlanecdn[.]com, so blocking only the Microsoft Graph channel would not necessarily remove its ability to regain access.","The malware separates inbound commands and outbound stolen data with different RSA keys and AES-256-GCM encryption, which can make captured calendar attachments difficult to inspect even when the covert channel is discovered.","The small number of known infections and the focus on Israeli organizations indicate selective targeting, making unusual calendar and Graph activity more significant even when it appears on only a few systems."],"referencedReports":[{"title":"HollowGraph Microsoft 365","url":"https://www.group-ib.com/blog/hollowgraph-microsoft-365","publisher":"Group-IB","context":"The article is based primarily on Group-IB's report analyzing HollowGraph's use of Microsoft Graph and Microsoft 365 calendar events for command-and-control activity.","category":"research","primary":true},{"title":"Cavern Manticore: Exposing Iran-linked modular C2 framework","url":"https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/","publisher":"Check Point Research","context":"The article links to this research when explaining that HollowGraph is believed to be part of the Cavern command-and-control framework previously linked to an Iranian threat actor targeting entities in Israel.","category":"research","primary":false}],"body":"\u003cp\u003eA malicious component dubbed HollowGraph uses the calendar feature in compromised Microsoft 365 mailboxes as a command-and-control channel to receive attacker commands and exfiltrate stolen data. Researchers believe it is part of the Cavern command-and-control framework, which has previously been linked to an Iranian threat actor targeting entities in Israel. At least 12 systems have been infected, with three actively communicating with the threat actor between June 3 and July 9.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB says HollowGraph authenticates to the Microsoft Graph API using hardcoded details for a compromised Microsoft 365 account. Its configuration file, stored as logAzure.txt, includes Microsoft Entra ID tenant and application details, a client secret, a target mailbox address, a C2 domain, and two RSA keys. The malware hides commands and stolen data in files attached to calendar events dated May 13, 2050, using specific event-title formats.\u003c/p\u003e\n\n\u003cp\u003eHollowGraph supports GET and SEND commands to retrieve encrypted instructions and create calendar entries containing encrypted stolen files. It also has an unencrypted DNS tunneling channel that retrieves new Microsoft Entra ID details through IPv6 AAAA record queries to cloudlanecdn[.]com. Group-IB recommends monitoring Microsoft Graph and Microsoft 365 audit logs for suspicious application-driven calendar activity, far-future events, unusual subjects and attachments, the cloudlanecdn[.]com domain, the logAzure.txt file, and outbound DNS tunneling patterns.\u003c/p\u003e\n"},{"n":15,"title":"Romania races to restore land registry after cyberattack disrupts property market","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/romania-cyberattack-land-registry","time":"14:45","priority":"SHOULD READ","score":84,"tldr":"Romania’s land registry systems remain offline after a cyberattack disrupted the country’s fully digital property transaction process, though officials say core cadastral and legal databases were not compromised. Authorities are migrating systems to the government cloud and investigating a financially motivated threat actor who exploited known vulnerabilities and leaked credentials.","briefOverview":"\u003cp\u003eRomania\u0026rsquo;s National Agency for Cadastre and Land Registration said a cyberattack disabled its central IT infrastructure, including the nationwide e-Terra cadastral and land registry platform. The outage has left services offline for nearly a week and brought real estate transactions across the country to a standstill. ANCPI said its technical and legal databases, which contain property boundaries, maps, ownership information, and mortgages, had not been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe disruption affected online land registry services, official email systems, and applications used by notaries, lawyers, cadastral specialists, and ANCPI employees. Because Romania\u0026rsquo;s cadastral and land registry system is fully digital, authorities cannot register new property transactions, process existing applications, or issue land registry extracts needed for home sales and mortgage registrations. Local media reported that the outage comes weeks before Romania is set to raise the value-added tax on new homes from 9% to 21%.\u003c/p\u003e\n\n\u003cp\u003eANCPI said it has begun migrating applications to the Romanian government cloud and expects that process to finish on Wednesday before authorities verify system integrity and gradually restore services. Romania\u0026rsquo;s National Directorate for Cyber Security said the attack appeared financially motivated and used known software vulnerabilities and previously leaked credentials. A threat actor using the name ByteToBreach claimed responsibility and advertised alleged stolen ANCPI data, while officials said investigators had found no evidence that personal data or land registry certificates had been stolen.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Romania's National Agency for Cadastre and Land Registration said a cyberattack disabled its central IT infrastructure, including the nationwide e-Terra cadastral and land registry platform.","The outage disrupted online land registry services, official email systems, and applications used by notaries, lawyers, cadastral specialists, and ANCPI employees, preventing new property registrations and processing of existing requests.","ANCPI said its technical and legal databases containing cadastral information, ownership details, and mortgages had not been compromised.","Authorities have begun migrating applications to the Romanian government cloud and said services will be gradually restored after system integrity is verified.","Romania's cyber security director Dan Cimpean said the attack appeared financially motivated and used known software vulnerabilities and previously leaked credentials."],"insights":["Romanian cyber officials said the incident was not very complex and could have been prevented because the attackers used known software vulnerabilities that authorities had recently warned organizations to patch.","The outage shows that a fully digital land registry can halt an entire property market even when officials say the core legal and cadastral records remain intact.","ANCPI is keeping affected systems isolated until every identified security weakness is addressed, prioritizing data integrity over rapid service restoration.","The timing of the outage is especially consequential because it comes just weeks before Romania is set to raise the value-added tax on new homes from 9% to 21%."],"referencedReports":[{"title":"ByteToBreach: A Deep Dive into a Persistent Data Leak Operator","url":"https://www.kelacyber.com/blog/bytetobreach-a-deep-dive-into-a-persistent-data-leak-operator/","publisher":"Kela","context":"The article cites Kela’s analysis attributing the ByteToBreach persona to Zakaria Mahdjoub, an alleged cybercriminal based in Oran, Algeria.","category":"research","primary":false}],"body":"\u003cp\u003eRomania\u0026rsquo;s National Agency for Cadastre and Land Registration said a cyberattack disabled its central IT infrastructure, including the nationwide e-Terra cadastral and land registry platform. The outage has left services offline for nearly a week and brought real estate transactions across the country to a standstill. ANCPI said its technical and legal databases, which contain property boundaries, maps, ownership information, and mortgages, had not been compromised.\u003c/p\u003e\n\n\u003cp\u003eThe disruption affected online land registry services, official email systems, and applications used by notaries, lawyers, cadastral specialists, and ANCPI employees. Because Romania\u0026rsquo;s cadastral and land registry system is fully digital, authorities cannot register new property transactions, process existing applications, or issue land registry extracts needed for home sales and mortgage registrations. Local media reported that the outage comes weeks before Romania is set to raise the value-added tax on new homes from 9% to 21%.\u003c/p\u003e\n\n\u003cp\u003eANCPI said it has begun migrating applications to the Romanian government cloud and expects that process to finish on Wednesday before authorities verify system integrity and gradually restore services. Romania\u0026rsquo;s National Directorate for Cyber Security said the attack appeared financially motivated and used known software vulnerabilities and previously leaked credentials. A threat actor using the name ByteToBreach claimed responsibility and advertised alleged stolen ANCPI data, while officials said investigators had found no evidence that personal data or land registry certificates had been stolen.\u003c/p\u003e\n"},{"n":29,"title":"SleeperGem Uses Three Malicious RubyGems Packages to Target Developer Machines","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/sleepergem-uses-three-malicious.html","time":"05:15","priority":"SHOULD READ","score":84,"tldr":"Researchers found three malicious RubyGems packages used in a supply-chain attack called SleeperGem that targeted developer machines, avoided CI environments, and installed a persistent native backdoor. Users who installed the affected gems should treat their systems and credentials as compromised and rotate secrets.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a software supply chain attack called SleeperGem targeting the Ruby ecosystem through three malicious RubyGems packages. The packages are \u003ccode\u003egit_credential_manager\u003c/code\u003e, \u003ccode\u003eDendreo\u003c/code\u003e, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, with malicious releases published across old or impersonating package names. StepSecurity said each malicious release acts as a loader that fetches a second stage from an attacker-controlled Forgejo host, avoids build systems, and installs persistence on developer machines.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003egit_credential_manager\u003c/code\u003e package impersonates Microsoft Git Credential Manager, while \u003ccode\u003eDendreo\u003c/code\u003e and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e had been dormant for years before receiving malicious updates. The malicious releases were published directly to RubyGems without matching commits or tags in the source projects. The article also notes that \u003ccode\u003egit_credential_manager\u003c/code\u003e was added as a dependency to five packages, including the two dormant packages, allowing the malicious payload to spread to existing users.\u003c/p\u003e\n\n\u003cp\u003eOnce installed, the malware checks for about 30 environment variables related to services such as GitHub Actions, GitLab, CircleCI, Travis, Jenkins, and Vercel, and exits if it detects them. On developer machines, it downloads payloads from \u003ccode\u003egit.disroot[.]org/git-ecosystem\u003c/code\u003e, installs a native daemon, and establishes persistence through cron and a systemd user service. Users who installed the affected gems are advised to treat machines and associated secrets as compromised, remove the dropped daemon and persistence methods, check for a setuid shell at \u003ccode\u003e/usr/local/sbin/ping6\u003c/code\u003e, and rotate all credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers identified a software supply chain attack called SleeperGem involving three malicious RubyGems packages: git_credential_manager, Dendreo, and fastlane-plugin-run_tests_firebase_testlab.","StepSecurity said each malicious release acts as a loader that fetches a second stage from an attacker-controlled Forgejo host, skips build systems, and installs a native daemon with persistence on developer machines.","The git_credential_manager package impersonates Microsoft Git Credential Manager, while Dendreo and fastlane-plugin-run_tests_firebase_testlab had been dormant for years before receiving malicious updates.","The malware checks for about 30 environment variables associated with CI services such as GitHub Actions, GitLab, CircleCI, Travis, Jenkins, and Vercel, and exits if any are found.","Users who installed any of the affected gems are advised to treat their machines and associated secrets as compromised, remove the dropped daemon and persistence methods, check for a setuid shell at /usr/local/sbin/ping6, and rotate all credentials."],"insights":["The malicious releases were published directly to RubyGems without matching commits or tags in the source projects, making registry-to-repository consistency checks a useful warning sign for this campaign.","The attackers appear to have used both a look-alike package name and long-dormant legitimate packages, showing that inactive maintainer accounts can become a high-value takeover path.","The addition of git_credential_manager as a dependency to five packages allowed the malicious payload to reach users who did not directly install the impersonating package.","The malware’s checks for CI-related environment variables indicate it was designed to avoid temporary build systems and focus on longer-lived developer machines where credentials are more likely to be present.","A separate RubyGems abuse case described in the article shows the registry can be misused not only to distribute malicious code but also as a trusted storage location for stolen data."],"referencedReports":[{"title":"SleeperGem: Compromised RubyGems Drop Persistent Backdoor","url":"https://www.stepsecurity.io/blog/sleepergem-compromised-rubygems-drop-persistent-backdoor","publisher":"StepSecurity","context":"The article cites StepSecurity's analysis as the source describing the malicious RubyGems releases as loaders that fetch a second stage and install persistence on developer machines.","category":"research","primary":true},{"title":"SleeperGem RubyGems Supply Chain Attack","url":"https://www.aikido.dev/blog/sleepergem-rubygems-supply-chain-attack","publisher":"Aikido Security","context":"The article quotes Aikido Security researcher Charlie Eriksen on why dormant RubyGems accounts were attractive takeover targets in the SleeperGem campaign.","category":"research","primary":false},{"title":"RubyGems Supply Chain Attack: Dead Drop","url":"https://www.mend.io/blog/rubygems-supply-chain-attack-dead-drop/","publisher":"Mend.io","context":"The article references Mend.io's disclosure of a separate RubyGems supply chain attack that used packages to store stolen credential data.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have identified a software supply chain attack called SleeperGem targeting the Ruby ecosystem through three malicious RubyGems packages. The packages are \u003ccode\u003egit_credential_manager\u003c/code\u003e, \u003ccode\u003eDendreo\u003c/code\u003e, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, with malicious releases published across old or impersonating package names. StepSecurity said each malicious release acts as a loader that fetches a second stage from an attacker-controlled Forgejo host, avoids build systems, and installs persistence on developer machines.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003egit_credential_manager\u003c/code\u003e package impersonates Microsoft Git Credential Manager, while \u003ccode\u003eDendreo\u003c/code\u003e and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e had been dormant for years before receiving malicious updates. The malicious releases were published directly to RubyGems without matching commits or tags in the source projects. The article also notes that \u003ccode\u003egit_credential_manager\u003c/code\u003e was added as a dependency to five packages, including the two dormant packages, allowing the malicious payload to spread to existing users.\u003c/p\u003e\n\n\u003cp\u003eOnce installed, the malware checks for about 30 environment variables related to services such as GitHub Actions, GitLab, CircleCI, Travis, Jenkins, and Vercel, and exits if it detects them. On developer machines, it downloads payloads from \u003ccode\u003egit.disroot[.]org/git-ecosystem\u003c/code\u003e, installs a native daemon, and establishes persistence through cron and a systemd user service. Users who installed the affected gems are advised to treat machines and associated secrets as compromised, remove the dropped daemon and persistence methods, check for a setuid shell at \u003ccode\u003e/usr/local/sbin/ping6\u003c/code\u003e, and rotate all credentials.\u003c/p\u003e\n"},{"n":1,"title":"Hackers steal $23.7 million in crypto from Ostium in off-chain attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-steal-237-million-in-crypto-from-ostium-in-off-chain-attack/","time":"22:22","priority":"SHOULD READ","score":82,"tldr":"Ostium says hackers stole $23.75 million from its liquidity provider vault by compromising off-chain price-feed infrastructure and submitting fake price reports to generate artificial trading profits. Trader collateral and existing positions were not stolen, but trading remains paused while Ostium secures systems and investigates.","briefOverview":"\u003cp\u003eOstium said an attacker stole $23.75 million from its liquidity provider vault after compromising off-chain infrastructure used to feed prices into the protocol. The attacker submitted illegitimate price reports disguised as valid ones, then rapidly opened and closed large positions to generate artificial profits. Ostium first notified its community on July 16 and paused trading due to the security incident.\u003c/p\u003e\n\n\u003cp\u003eThe company said trader collateral was held in a separate contract and was not affected. Existing long and short positions were not closed or liquidated, but they are effectively frozen because all trading was paused within 60 minutes of the first exploit transaction. Ostium said it is working to secure the affected infrastructure and determine a path forward for liquidity providers.\u003c/p\u003e\n\n\u003cp\u003eAccording to PeckShieldAlert, the exploiter swapped the stolen USDC for 12,080 Ethereum and deposited 10,540 Ethereum to TornadoCash. Five days after the incident, trading on Ostium was still paused, and the company said it would provide at least 24 hours\u0026rsquo; notice before operations resume. Ostium also said positions will be marked to the reopening price and that it plans to publish a post-mortem with technical details in the coming days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ostium said an attacker stole $23.75 million from its liquidity provider vault after compromising off-chain infrastructure used to feed prices into the protocol.","The attacker submitted illegitimate price reports disguised as valid ones and rapidly opened and closed large positions to generate artificial profits.","Ostium said trader collateral was held in a separate contract, was not stolen, and existing long and short positions were not closed or liquidated.","According to PeckShieldAlert, the exploiter swapped the stolen USDC for 12,080 Ethereum and deposited 10,540 Ethereum to TornadoCash.","Trading on Ostium was paused within 60 minutes of the first exploit transaction and remained paused five days after the incident."],"insights":["The incident shows that a decentralized trading platform can lose funds through compromised off-chain price infrastructure even when the affected funds are held in on-chain contracts.","Ostium’s separation of trader collateral from the liquidity provider vault limited the stated impact, leaving ordinary traders’ collateral unstolen while liquidity providers faced the loss.","Pausing trading within 60 minutes did not prevent the attacker from extracting $23.75 million, indicating the exploit unfolded quickly once false price reports were accepted.","Ostium plans to mark frozen positions to the reopening price when trading resumes, so the pause affects not only stolen funds but also how existing open positions will be handled."],"referencedReports":[],"body":"\u003cp\u003eOstium said an attacker stole $23.75 million from its liquidity provider vault after compromising off-chain infrastructure used to feed prices into the protocol. The attacker submitted illegitimate price reports disguised as valid ones, then rapidly opened and closed large positions to generate artificial profits. Ostium first notified its community on July 16 and paused trading due to the security incident.\u003c/p\u003e\n\n\u003cp\u003eThe company said trader collateral was held in a separate contract and was not affected. Existing long and short positions were not closed or liquidated, but they are effectively frozen because all trading was paused within 60 minutes of the first exploit transaction. Ostium said it is working to secure the affected infrastructure and determine a path forward for liquidity providers.\u003c/p\u003e\n\n\u003cp\u003eAccording to PeckShieldAlert, the exploiter swapped the stolen USDC for 12,080 Ethereum and deposited 10,540 Ethereum to TornadoCash. Five days after the incident, trading on Ostium was still paused, and the company said it would provide at least 24 hours\u0026rsquo; notice before operations resume. Ostium also said positions will be marked to the reopening price and that it plans to publish a post-mortem with technical details in the coming days.\u003c/p\u003e\n"},{"n":16,"title":"Hackers were inside South Korea's diplomat training system for 9 months","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/south-korea-cyberattack-foreign-ministry","time":"15:15","priority":"SHOULD READ","score":82,"tldr":"Hackers compromised the Korea National Diplomatic Academy’s e-learning platform for about nine months, exposing IDs, names, emails and encrypted passwords of current and former South Korean foreign ministry personnel. Officials say the intrusion involved a zero-day flaw and misconfigured security settings, but they have not attributed it to any group.","briefOverview":"\u003cp\u003eUnidentified hackers compromised the Korea National Diplomatic Academy’s e-learning platform, an online education system used by South Korea’s diplomatic academy. South Korea’s Ministry of Foreign Affairs said the breach lasted from April 2025 to February 2026, when a related government authority notified the ministry of abnormal access. The ministry said it immediately shut the system down and had not restored it since.\u003c/p\u003e\n\n\u003cp\u003eThe compromised data is believed to include trainee IDs, names, email addresses, and encrypted passwords. The ministry said sensitive information such as contact details and personal photos were not affected, but it could not yet determine precisely what information had been accessed or exfiltrated. The Korea National Diplomatic Academy trains diplomatic service candidates, serving diplomats preparing for overseas postings, and senior officials from across central and local government, prompting concern about the potential scope of exposure.\u003c/p\u003e\n\n\u003cp\u003eAccording to JoongAng Daily, the unidentified attacker exploited a previously unknown zero-day vulnerability in the server software, compounded by misconfigured security settings, to access the network. The ministry said no security update was available at the time, which limited its ability to respond, and it did not attribute the attack to any specific threat actor. The incident comes amid broader pressure on Seoul to overhaul digital security following high-profile data incidents and ahead of changes to South Korea’s Personal Information Protection Act set to take effect in September.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unidentified hackers compromised the Korea National Diplomatic Academy’s e-learning platform from April 2025 to February 2026.","South Korea’s Ministry of Foreign Affairs said the exposed data is believed to include trainee IDs, names, email addresses, and encrypted passwords, while contact details and personal photos were not affected.","The ministry shut down the system after being notified of abnormal access by a related government authority and had not restored it as of the announcement.","JoongAng Daily reported that the attacker exploited a previously unknown zero-day vulnerability in the server software, along with misconfigured security settings, to access the network.","The ministry said it could not yet determine exactly what information had been accessed or exfiltrated during the compromise."],"insights":["The breach went undetected until a related government authority notified the ministry of abnormal access, highlighting that the affected ministry did not identify the compromise on its own during the roughly nine-month intrusion window.","The ministry said no security update was available because the attacker used a previously unknown flaw, making the reported misconfigured security settings a particularly important contributing factor in the incident.","The academy’s broad user base, including diplomatic candidates, serving diplomats, and senior officials across government, means the impact may extend beyond a single agency even though the exposed data described so far is limited.","The incident comes as South Korea is preparing stricter data protection rules that can fine companies up to 10% of turnover and make CEOs ultimately responsible for compliance, showing how major breaches are shaping national policy changes."],"referencedReports":[],"body":"\u003cp\u003eUnidentified hackers compromised the Korea National Diplomatic Academy’s e-learning platform, an online education system used by South Korea’s diplomatic academy. South Korea’s Ministry of Foreign Affairs said the breach lasted from April 2025 to February 2026, when a related government authority notified the ministry of abnormal access. The ministry said it immediately shut the system down and had not restored it since.\u003c/p\u003e\n\n\u003cp\u003eThe compromised data is believed to include trainee IDs, names, email addresses, and encrypted passwords. The ministry said sensitive information such as contact details and personal photos were not affected, but it could not yet determine precisely what information had been accessed or exfiltrated. The Korea National Diplomatic Academy trains diplomatic service candidates, serving diplomats preparing for overseas postings, and senior officials from across central and local government, prompting concern about the potential scope of exposure.\u003c/p\u003e\n\n\u003cp\u003eAccording to JoongAng Daily, the unidentified attacker exploited a previously unknown zero-day vulnerability in the server software, compounded by misconfigured security settings, to access the network. The ministry said no security update was available at the time, which limited its ability to respond, and it did not attribute the attack to any specific threat actor. The incident comes amid broader pressure on Seoul to overhaul digital security following high-profile data incidents and ahead of changes to South Korea’s Personal Information Protection Act set to take effect in September.\u003c/p\u003e\n"},{"n":17,"title":"Software provider to more than 2,000 US hospitals says hackers stole employee and customer data","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/software-provider-for-us-hospitals-customer-data-breach","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"Craneware, a UK software provider used by more than 2,000 U.S. hospitals, said hackers accessed its internal network and stole some employee, customer and partner data. The company says the intrusion is contained, services were not disrupted, and it is still determining whether any sensitive or patient data was taken.","briefOverview":"\u003cp\u003eCraneware, a British company whose software is used by thousands of U.S. hospitals, said hackers broke into its internal network and stole data on employees, customers and business partners. The Edinburgh-headquartered company told investors it detected unauthorized access to a subset of its data environment and brought in outside forensic investigators. It also reported the incident to the FBI and Britain’s Information Commissioner’s Office.\u003c/p\u003e\n\n\u003cp\u003eThe company said the intrusion has been contained and the attackers no longer have a foothold in its systems. Craneware said neither its own operations nor the services it provides to hospitals were disrupted. It said a large number of file names were viewed and copied from its network, mostly involving non-sensitive or already publicly available regulatory data, but some employee data and customer and partner records were also taken.\u003c/p\u003e\n\n\u003cp\u003eCraneware said it is still determining exactly what was stolen and expects to notify affected organizations and individuals once it does. The notice did not say who was responsible, when the hackers first got in, how long they had access, whether an extortion demand was made, or whether patient information was among the stolen data. The article notes that Craneware works with more than 2,000 hospitals and close to 10,000 clinics and retail pharmacies, and that healthcare vendors including CareCloud, Insightin, TriZetto Provider Solutions and Episource have also recently reported data theft incidents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Craneware said hackers gained unauthorized access to a subset of its data environment and stole data on employees, customers and business partners.","The company said the intrusion has been contained, the attackers no longer have access to its systems, and its operations and hospital services were not disrupted.","Craneware reported the incident to the FBI and Britain’s Information Commissioner’s Office and brought in outside forensic investigators.","The company said many file names were viewed and copied, mostly involving non-sensitive or publicly available regulatory data, but some employee and customer and partner records were also taken.","Craneware has not said who was responsible, when the hackers first gained access, how long they were inside, whether an extortion demand was made, or whether patient information was stolen."],"insights":["Whether patient information was among the stolen data is a pivotal unresolved issue because the article states that this would determine whether U.S. health privacy rules apply.","The incident affected a supplier with a large healthcare footprint, as Craneware says it works with more than 2,000 hospitals and close to 10,000 clinics and retail pharmacies.","The breach appears to be limited to data theft rather than service disruption, because Craneware said neither its own operations nor the services it provides to hospitals were disrupted.","The article places the incident in a broader pattern of attacks on healthcare vendors, citing recent data theft incidents involving CareCloud, Insightin, TriZetto Provider Solutions and Episource."],"referencedReports":[],"body":"\u003cp\u003eCraneware, a British company whose software is used by thousands of U.S. hospitals, said hackers broke into its internal network and stole data on employees, customers and business partners. The Edinburgh-headquartered company told investors it detected unauthorized access to a subset of its data environment and brought in outside forensic investigators. It also reported the incident to the FBI and Britain’s Information Commissioner’s Office.\u003c/p\u003e\n\n\u003cp\u003eThe company said the intrusion has been contained and the attackers no longer have a foothold in its systems. Craneware said neither its own operations nor the services it provides to hospitals were disrupted. It said a large number of file names were viewed and copied from its network, mostly involving non-sensitive or already publicly available regulatory data, but some employee data and customer and partner records were also taken.\u003c/p\u003e\n\n\u003cp\u003eCraneware said it is still determining exactly what was stolen and expects to notify affected organizations and individuals once it does. The notice did not say who was responsible, when the hackers first got in, how long they had access, whether an extortion demand was made, or whether patient information was among the stolen data. The article notes that Craneware works with more than 2,000 hospitals and close to 10,000 clinics and retail pharmacies, and that healthcare vendors including CareCloud, Insightin, TriZetto Provider Solutions and Episource have also recently reported data theft incidents.\u003c/p\u003e\n"},{"n":18,"title":"India says allegedly leaked nuclear plant files pose no safety risk","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/india-nuclear-plant-kudankulam-world-leaks-documents","time":"18:20","priority":"SHOULD READ","score":82,"tldr":"India’s nuclear operator said files allegedly leaked from a Kudankulam contractor breach relate only to non-nuclear support infrastructure and do not affect plant safety or security. The data was claimed by World Leaks after a Reliance Infrastructure-hosted server incident.","briefOverview":"\u003cp\u003eIndia\u0026rsquo;s state-owned nuclear operator said documents recently posted online and purportedly linked to the Kudankulam Nuclear Power Plant contain no information affecting safety or security. The files were published by the cybercrime group World Leaks and appeared to include engineering drawings, supplier information, inspection records, and insurance documents related to Units 3 and 4, which are under construction. NPCIL said the documents appear to relate only to the engineering, procurement, and construction contract for the plant\u0026rsquo;s conventional Balance of Plant package, which covers support infrastructure separate from the reactors and their safety systems.\u003c/p\u003e\n\n\u003cp\u003eThe files were labeled as originating from Reliance Group, whose subsidiary Reliance Infrastructure is building non-nuclear infrastructure for the new Kudankulam reactors. Reliance Group told Reuters it had suffered a partial breach involving data stored on infrastructure hosted by Indian data center provider Yotta, while Yotta said it detected and stopped suspicious activity on a Reliance Infrastructure server in late May. Independent cybersecurity researcher Rakesh Krishnan said nearly 19,000 files totaling about 14.3 GB related to Kudankulam were published by World Leaks, though the authenticity of the documents could not be independently verified.\u003c/p\u003e\n\n\u003cp\u003eIndian officials rejected suggestions that sensitive nuclear information had been compromised, and Science and Technology Minister Jitendra Singh said there was no immediate need for a broader security review. The article notes that Kudankulam was previously involved in a 2019 cyber incident, when malware later linked by researchers to North Korea\u0026rsquo;s Lazarus Group was found on an internet-connected administrative network, with plant operations reported unaffected. World Leaks, which emerged in early 2025 after the rebranding of Hunters International, has also recently claimed responsibility for breaching Tata Electronics and has focused increasingly on stealing and publishing data to pressure victims into paying extortion demands.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["India's Nuclear Power Corporation of India Limited said the allegedly leaked Kudankulam Nuclear Power Plant documents relate only to conventional Balance of Plant common service facilities and not to nuclear safety or security systems.","World Leaks published files that appeared to include engineering drawings, supplier information, inspection records, and insurance documents related to Kudankulam Units 3 and 4, which are under construction.","Reliance Group said it suffered a partial breach involving data stored on infrastructure hosted by Indian data center provider Yotta, while Yotta said it stopped suspicious activity on a Reliance Infrastructure server in late May.","Independent researcher Rakesh Krishnan said nearly 19,000 files totaling about 14.3 GB related to Kudankulam were published by World Leaks, though the authenticity of the documents could not be independently verified.","Kudankulam previously experienced a 2019 cyber incident in which malware later linked by researchers to North Korea's Lazarus Group was found on an isolated administrative network, with plant operations reported unaffected."],"insights":["The incident highlights that data leaks involving nuclear projects can originate from contractors handling non-nuclear infrastructure rather than from the plant operator or reactor systems themselves.","NPCIL’s response draws a clear boundary between conventional Balance of Plant facilities and nuclear safety or security systems, making the type of leaked project data central to assessing real-world risk.","World Leaks’ activity against both Reliance-linked Kudankulam files and Tata Electronics shows the group is targeting high-profile Indian industrial and technology organizations with data-theft extortion rather than primarily relying on file encryption.","The article shows a gap between public leak claims and verified facts, as the authenticity of the Kudankulam documents and the intrusion method have not been independently confirmed or publicly disclosed."],"referencedReports":[{"title":"Kudankulam Nuclear Power Plant Leak: An Accidental Disclosure","url":"https://theravenfile.com/2026/07/17/kudankulam-nuclear-power-plant-leak-an-accidental-disclosure/","publisher":"Rakesh Krishnan / The Raven File","context":"The article cites independent cybersecurity researcher Rakesh Krishnan as the first to document the purported Kudankulam data leak and references his findings about the files and possible access methods.","category":"research","primary":false}],"body":"\u003cp\u003eIndia\u0026rsquo;s state-owned nuclear operator said documents recently posted online and purportedly linked to the Kudankulam Nuclear Power Plant contain no information affecting safety or security. The files were published by the cybercrime group World Leaks and appeared to include engineering drawings, supplier information, inspection records, and insurance documents related to Units 3 and 4, which are under construction. NPCIL said the documents appear to relate only to the engineering, procurement, and construction contract for the plant\u0026rsquo;s conventional Balance of Plant package, which covers support infrastructure separate from the reactors and their safety systems.\u003c/p\u003e\n\n\u003cp\u003eThe files were labeled as originating from Reliance Group, whose subsidiary Reliance Infrastructure is building non-nuclear infrastructure for the new Kudankulam reactors. Reliance Group told Reuters it had suffered a partial breach involving data stored on infrastructure hosted by Indian data center provider Yotta, while Yotta said it detected and stopped suspicious activity on a Reliance Infrastructure server in late May. Independent cybersecurity researcher Rakesh Krishnan said nearly 19,000 files totaling about 14.3 GB related to Kudankulam were published by World Leaks, though the authenticity of the documents could not be independently verified.\u003c/p\u003e\n\n\u003cp\u003eIndian officials rejected suggestions that sensitive nuclear information had been compromised, and Science and Technology Minister Jitendra Singh said there was no immediate need for a broader security review. The article notes that Kudankulam was previously involved in a 2019 cyber incident, when malware later linked by researchers to North Korea\u0026rsquo;s Lazarus Group was found on an internet-connected administrative network, with plant operations reported unaffected. World Leaks, which emerged in early 2025 after the rebranding of Hunters International, has also recently claimed responsibility for breaching Tata Electronics and has focused increasingly on stealing and publishing data to pressure victims into paying extortion demands.\u003c/p\u003e\n"},{"n":24,"title":"New 7-Zip Vulnerability Could Let Crafted XZ Archives Run Code During Extraction","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-7-zip-vulnerability-could-let.html","time":"09:10","priority":"SHOULD READ","score":82,"tldr":"7-Zip fixed a high-severity heap buffer overflow in its XZ archive handling that could allow code execution when a victim opens a crafted archive. Users should manually update to 7-Zip 26.02 or later, especially on systems that handle archives from untrusted sources.","briefOverview":"\u003cp\u003eA crafted XZ archive opened in 7-Zip could allow an attacker to run code on the machine because of CVE-2026-14266. The flaw is a heap-based buffer overflow in how 7-Zip processes XZ chunked data, and Trend Micro’s Zero Day Initiative detailed it on July 15. A fix shipped on June 25 in 7-Zip 26.02.\u003c/p\u003e\n\n\u003cp\u003eZDI rates the issue 7.0, or High, with a local attack vector and required user interaction. The article notes that “remote code execution” in the advisory means a remote attacker could deliver the file, but the victim still has to open it through email, a download, or a web page that hands it to 7-Zip. As of July 20, 2026, The Hacker News found no public proof-of-concept and no credible report of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe fix is in the MixCoder_Code function in C/XzDec.c, where version 26.02 subtracts bytes already written and exits if the running total exceeds the buffer. The flawed length handling appears unchanged in 7-Zip source back to at least version 21.07, though neither ZDI nor 7-Zip has said which releases are actually exploitable. Users should update manually to 7-Zip 26.02 or later, and any product that ships a vulnerable copy of 7-Zip’s XZ decoder needs its own vendor fix.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-14266 is a heap-based buffer overflow in 7-Zip’s handling of XZ chunked data that could allow code execution when a crafted XZ archive is opened.","7-Zip fixed the flaw in version 26.02, which was released on June 25 before Trend Micro’s Zero Day Initiative detailed the issue on July 15.","ZDI rated the flaw 7.0, or High, with a local attack vector and required user interaction, rather than a network-reachable or no-click issue.","As of July 20, 2026, The Hacker News found no public proof-of-concept and no credible report of exploitation in the wild.","Users should update manually to 7-Zip 26.02 or later, and products that ship a vulnerable copy of 7-Zip’s XZ decoder need their own vendor fixes."],"insights":["The advisory’s “remote code execution” wording does not mean the flaw is network-reachable or no-click; the victim still has to open a delivered archive in 7-Zip.","On Windows, exploitation normally inherits 7-Zip’s limited user rights because 7-Zip runs under a filtered standard-user token unless it was launched elevated.","The vulnerable length-handling pattern appears in 7-Zip source back to at least version 21.07, but neither ZDI nor 7-Zip has stated which releases are actually exploitable.","Updating to 7-Zip 26.02 addresses this XZ flaw and also rolls up fixes for earlier 2026 memory-safety bugs, including CVE-2026-48095.","Because 7-Zip updates require a manual install from the official site, systems that are otherwise left alone will not automatically receive the fix."],"referencedReports":[{"title":"ZDI-26-444","url":"https://www.zerodayinitiative.com/advisories/ZDI-26-444/","publisher":"Trend Micro Zero Day Initiative","context":"The article says ZDI detailed CVE-2026-14266 on July 15 and cites its severity rating and exploit description.","category":"advisory","primary":true},{"title":"GHSL-2026-115_GHSL-2026-122_7-zip","url":"https://securitylab.github.com/advisories/GHSL-2026-115_GHSL-2026-122_7-zip/","publisher":"GitHub Security Lab","context":"The article references this advisory as covering a batch of memory-safety bugs fixed in 7-Zip 26.01.","category":"advisory","primary":false},{"title":"GHSL-2026-140_7-Zip","url":"https://securitylab.github.com/advisories/GHSL-2026-140_7-Zip/","publisher":"GitHub Security Lab","context":"The article says GitHub Security Lab detailed CVE-2026-48095 with a working proof-of-concept on May 22.","category":"advisory","primary":false}],"body":"\u003cp\u003eA crafted XZ archive opened in 7-Zip could allow an attacker to run code on the machine because of CVE-2026-14266. The flaw is a heap-based buffer overflow in how 7-Zip processes XZ chunked data, and Trend Micro’s Zero Day Initiative detailed it on July 15. A fix shipped on June 25 in 7-Zip 26.02.\u003c/p\u003e\n\n\u003cp\u003eZDI rates the issue 7.0, or High, with a local attack vector and required user interaction. The article notes that “remote code execution” in the advisory means a remote attacker could deliver the file, but the victim still has to open it through email, a download, or a web page that hands it to 7-Zip. As of July 20, 2026, The Hacker News found no public proof-of-concept and no credible report of exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe fix is in the MixCoder_Code function in C/XzDec.c, where version 26.02 subtracts bytes already written and exits if the running total exceeds the buffer. The flawed length handling appears unchanged in 7-Zip source back to at least version 21.07, though neither ZDI nor 7-Zip has said which releases are actually exploitable. Users should update manually to 7-Zip 26.02 or later, and any product that ships a vulnerable copy of 7-Zip’s XZ decoder needs its own vendor fix.\u003c/p\u003e\n"},{"n":11,"title":"Microsoft confirms Windows Server Update Services sync delays","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-working-to-fix-wsus-server-sync-delays-and-timeouts/","time":"10:47","priority":"SHOULD READ","score":78,"tldr":"Microsoft confirmed ongoing WSUS synchronization delays and timeouts that can prevent admins from deploying the latest Windows updates via WSUS or Configuration Manager. Mitigations are in place for new or rebuilt WSUS servers, but Microsoft is still working on a safe fix for already affected environments.","briefOverview":"\u003cp\u003eMicrosoft is working to fix a known issue affecting Windows Server Update Services servers that has caused synchronization problems for more than a week. WSUS is used by IT administrators to schedule updates for Microsoft products on enterprise networks from a single local update server instead of updating each endpoint directly from Microsoft’s servers. When synchronization is broken, administrators cannot deploy the latest Windows updates through WSUS or Configuration Manager.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said organizations might experience increased synchronization times or sync operation timeouts on WSUS servers. The issue began in recent days, with heightened impact observed starting July 13, 2026. According to Microsoft, the WSUS synchronization problems affect Windows 10 version 1607 and later, as well as Windows Server 2012 and later.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft rolled out mitigation measures on Saturday to prevent the issue from affecting newly installed or rebuilt WSUS servers. The company said synchronization times and operations have been restored and are operating normally for new WSUS installations and rebuilds. For WSUS servers that were previously affected, Microsoft is still working on mitigation steps to help customers safely remove the affected metadata from their environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is working to fix a known issue affecting Windows Server Update Services servers that has caused synchronization problems for more than a week.","Affected WSUS servers may experience increased synchronization times or sync operation timeouts, preventing administrators from deploying the latest Windows updates through WSUS or Confi
