<script type="application/json" id="dl-articles">[{"n":30,"title":"CVE-2026-63030 \u0026 CVE-2026-60137: WordPress Core Pre-Authentication RCE Overview \u0026 Takeaways","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/cve-2026-63030-cve-2026-60137-wordpress-core-rce/","time":"17:57","priority":"MUST READ","score":98,"tldr":"WordPress disclosed an actively exploited critical vulnerability chain, CVE-2026-63030 and CVE-2026-60137, that can allow unauthenticated attackers to gain full control of affected sites. Administrators should immediately verify their WordPress versions, patch to 7.0.2, 6.9.5, or 6.8.6 as applicable, and check for signs of compromise.","briefOverview":"\u003cp\u003eWordPress disclosed a critical vulnerability chain nicknamed “wp2shell,” made up of CVE-2026-63030 and CVE-2026-60137. CVE-2026-63030 is a REST API Route Confusion flaw affecting WordPress Core 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1. CVE-2026-60137 is a SQL injection flaw affecting those same versions as well as WordPress Core 6.8.0 through 6.8.5.\u003c/p\u003e\n\n\u003cp\u003eWhen chained, the two vulnerabilities can result in unauthenticated SQL injection that grants complete control of an affected WordPress site. The article says this can include access to all data, the ability to install malicious code, and full administrative access. Attackers are actively exploiting the vulnerabilities in the wild, public proof-of-concept code became available on July 17, 2026, and widespread scanning was reported beginning July 18, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends immediately identifying all WordPress instances, verifying their versions, and not assuming forced automatic updates succeeded. WordPress 7.0.x sites should be updated to 7.0.2, 6.9.x sites to 6.9.5, and 6.8.x sites to 6.8.6. If patching is delayed, the article recommends blocking both batch API paths at a WAF and treating internet-facing 6.8.x, 6.9.x, or 7.0.x instances as potentially compromised until patched and integrity-verified.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress disclosed a critical vulnerability chain nicknamed “wp2shell” involving CVE-2026-63030, a REST API Route Confusion flaw, and CVE-2026-60137, a SQL injection flaw.","CVE-2026-63030 affects WordPress Core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while CVE-2026-60137 also affects WordPress Core versions 6.8.0 through 6.8.5.","When CVE-2026-63030 is chained with CVE-2026-60137, an unauthenticated attacker can gain complete control of an affected WordPress site, including access to all data, the ability to install malicious code, and full administrative access.","The article states that attackers are actively exploiting these vulnerabilities in the wild and that public proof-of-concept code became available on July 17, 2026, with widespread scanning reported beginning July 18, 2026.","The article recommends immediately verifying WordPress versions, patching 7.0.x to 7.0.2, 6.9.x to 6.9.5, and 6.8.x to 6.8.6, and checking unpatched instances for signs of compromise."],"insights":["Administrators should not rely on WordPress automatic updates alone, because the article explicitly warns to verify the patched version directly with WP-CLI or the Dashboard.","Blocking only one REST batch API path is insufficient, because the article says both /wp-json/batch/v1 and /?rest_route=/batch/v1 must be blocked to avoid leaving an alternate route open.","The same SQL injection flaw has different real-world impact depending on the WordPress branch, with 6.8.x exposed to SQL injection only while 6.9.x and 7.0.x are exposed to the full unauthenticated RCE chain.","The article recommends treating any internet-facing 6.8.x, 6.9.x, or 7.0.x WordPress instance as potentially compromised until it has been patched and integrity-verified.","Because no official indicators of compromise have been published, defenders are directed to look for behavioral signs such as new admin accounts, unexpected PHP files in wp-content, and injected redirects or JavaScript."],"referencedReports":[{"title":"NVD — CVE-2026-63030","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-63030","publisher":"NVD","context":"The article links to the NVD entry for CVE-2026-63030 as an additional resource for the WordPress REST API Route Confusion vulnerability.","category":"advisory","primary":true},{"title":"NVD — CVE-2026-60137","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-60137","publisher":"NVD","context":"The article links to the NVD entry for CVE-2026-60137 as an additional resource for the WordPress WP_Query SQL injection vulnerability.","category":"advisory","primary":true},{"title":"MITRE — CVE-2026-63030","url":"https://www.cve.org/CVERecord?id=CVE-2026-63030","publisher":"MITRE","context":"The article lists the MITRE CVE record for CVE-2026-63030 as an additional resource.","category":"advisory","primary":false},{"title":"MITRE — CVE-2026-60137","url":"https://www.cve.org/CVERecord?id=CVE-2026-60137","publisher":"MITRE","context":"The article lists the MITRE CVE record for CVE-2026-60137 as an additional resource.","category":"advisory","primary":false},{"title":"GitHub Security Advisory — CVE-2026-63030 (GHSA-ff9f-jf42-662q)","url":"https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-ff9f-jf42-662q","publisher":"GitHub","context":"The article lists the GitHub Security Advisory for CVE-2026-63030 as an additional resource.","category":"advisory","primary":true},{"title":"GitHub Security Advisory — CVE-2026-60137 (GHSA-fpp7-x2x2-2mjf)","url":"https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-fpp7-x2x2-2mjf","publisher":"GitHub","context":"The article lists the GitHub Security Advisory for CVE-2026-60137 as an additional resource.","category":"advisory","primary":true},{"title":"WordPress 7.0.2 Release Notes","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article links to the WordPress 7.0.2 release notes in its patching guidance and additional resources.","category":"advisory","primary":true}],"body":"\u003cp\u003eWordPress disclosed a critical vulnerability chain nicknamed “wp2shell,” made up of CVE-2026-63030 and CVE-2026-60137. CVE-2026-63030 is a REST API Route Confusion flaw affecting WordPress Core 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1. CVE-2026-60137 is a SQL injection flaw affecting those same versions as well as WordPress Core 6.8.0 through 6.8.5.\u003c/p\u003e\n\n\u003cp\u003eWhen chained, the two vulnerabilities can result in unauthenticated SQL injection that grants complete control of an affected WordPress site. The article says this can include access to all data, the ability to install malicious code, and full administrative access. Attackers are actively exploiting the vulnerabilities in the wild, public proof-of-concept code became available on July 17, 2026, and widespread scanning was reported beginning July 18, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends immediately identifying all WordPress instances, verifying their versions, and not assuming forced automatic updates succeeded. WordPress 7.0.x sites should be updated to 7.0.2, 6.9.x sites to 6.9.5, and 6.8.x sites to 6.8.6. If patching is delayed, the article recommends blocking both batch API paths at a WAF and treating internet-facing 6.8.x, 6.9.x, or 7.0.x instances as potentially compromised until patched and integrity-verified.\u003c/p\u003e\n"},{"n":33,"title":"wp2shell (CVE-2026-63030, CVE-2026-60137): Frequently asked questions about remote code execution chain in WordPress Core","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/wp2shell-cve-2026-63030-cve-2026-60137-frequently-asked-questions-about-remote-code-execution","time":"13:36","priority":"MUST READ","score":98,"tldr":"Two WordPress Core flaws, CVE-2026-63030 and CVE-2026-60137, can be chained for unauthenticated remote code execution on affected WordPress 6.9.x and 7.0.x sites, with active exploitation and public PoCs already reported. Administrators should update immediately to WordPress 7.0.2, 6.9.5, or 6.8.6 as applicable, or apply temporary REST API/WAF mitigations until patched.","briefOverview":"\u003cp\u003eTenable’s Research Special Operations team published an FAQ about wp2shell, a chain of two WordPress Core vulnerabilities: CVE-2026-63030 and CVE-2026-60137. The article says an unauthenticated attacker can combine them to achieve pre-authentication remote code execution against affected WordPress 6.9.x and 7.0.x installations. The vulnerabilities were disclosed on July 17, 2026, and multiple security firms confirmed active exploitation within days.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-63030 is described as a REST API batch-route confusion weakness introduced in WordPress 6.9, while CVE-2026-60137 is a SQL injection flaw in the author__not_in parameter of WP_Query present in WordPress 6.8 and later. The full remote code execution chain applies to WordPress 6.9.0 through 7.0.1, while CVE-2026-60137 also affects WordPress 6.8.0 through 6.8.5 as a standalone SQL injection issue. The article notes that the chain can be executed against a default WordPress installation with no plugins required, and Cloudflare said the vulnerable code path is reached when a persistent object cache is not in use.\u003c/p\u003e\n\n\u003cp\u003ePatches were released on July 17, 2026, in WordPress 7.0.2, 6.9.5, and 6.8.6, and WordPress.org enabled forced automatic updates for supported affected installations. For sites that cannot update immediately, the article lists temporary mitigations including blocking unauthenticated REST API access, blocking /wp-json/batch/v1 and ?rest_route=/batch/v1 at the WAF level, or deploying a custom PHP plugin from wp2shell.com. As of July 20, 2026, the article says no specific threat actor attribution or public indicators of compromise had been released.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-63030 and CVE-2026-60137 can be chained to achieve pre-authentication remote code execution against WordPress 6.9.x and 7.0.x installations.","Multiple security firms confirmed in-the-wild exploitation of wp2shell, and public proof-of-concept exploits appeared within hours of the July 17, 2026 disclosure.","CVE-2026-60137 also affects WordPress 6.8.0 through 6.8.5 as a standalone SQL injection issue, but the full remote code execution chain requires CVE-2026-63030, which was introduced in WordPress 6.9.","Patches were released in WordPress 7.0.2, 6.9.5, and 6.8.6, and WordPress.org enabled forced automatic updates for supported affected installations.","Temporary mitigations include blocking unauthenticated REST API access, blocking /wp-json/batch/v1 and ?rest_route=/batch/v1 at the WAF level, or deploying Searchlight Cyber’s custom PHP plugin until patches can be applied."],"insights":["Cloudflare noted that the vulnerable code path is reached when a persistent object cache is not in use, making cache configuration relevant to exposure.","wp2shell targets WordPress Core itself, whereas all four prior WordPress-related entries in CISA’s Known Exploited Vulnerabilities catalog cited in the article involved plugins rather than core.","Searchlight Cyber attributed the rapid appearance of public proof-of-concept exploits to AI-assisted tooling, and Adam Kues stated that no security researcher could have completed the exploit chain in 10 hours without AI.","The article emphasizes that WAF mitigation must cover both /wp-json/batch/v1 and ?rest_route=/batch/v1, because blocking only one pattern may leave another access path open.","Despite confirmed in-the-wild exploitation, the article states that no specific threat actor attribution or public indicators of compromise were available as of July 20, 2026."],"referencedReports":[{"title":"wp2shell Pre-Authentication RCE in WordPress Core","url":"https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core/","publisher":"Searchlight Cyber","context":"The article says Adam Kues of Searchlight Cyber published research on the wp2shell vulnerabilities on the day of disclosure.","category":"research","primary":true},{"title":"Technical Analysis of the wp2shell Attack Chain","url":"https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/","publisher":"Searchlight Cyber","context":"The article references Searchlight Cyber’s full technical breakdown of the wp2shell attack chain published on July 20, 2026.","category":"research","primary":true},{"title":"WordPress 7.0.2 Security Release","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article lists the WordPress 7.0.2 security release as a source for the patches addressing the vulnerabilities.","category":"advisory","primary":true},{"title":"GHSA-ff9f-jf42-662q (CVE-2026-63030)","url":"https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-ff9f-jf42-662q","publisher":"WordPress","context":"The article cites this GitHub Security Advisory for CVE-2026-63030, one of the two wp2shell vulnerabilities.","category":"advisory","primary":true},{"title":"GHSA-fpp7-x2x2-2mjf (CVE-2026-60137)","url":"https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-fpp7-x2x2-2mjf","publisher":"WordPress","context":"The article cites this GitHub Security Advisory for CVE-2026-60137, the SQL injection flaw used in the wp2shell chain.","category":"advisory","primary":true}],"body":"\u003cp\u003eTenable’s Research Special Operations team published an FAQ about wp2shell, a chain of two WordPress Core vulnerabilities: CVE-2026-63030 and CVE-2026-60137. The article says an unauthenticated attacker can combine them to achieve pre-authentication remote code execution against affected WordPress 6.9.x and 7.0.x installations. The vulnerabilities were disclosed on July 17, 2026, and multiple security firms confirmed active exploitation within days.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-63030 is described as a REST API batch-route confusion weakness introduced in WordPress 6.9, while CVE-2026-60137 is a SQL injection flaw in the author__not_in parameter of WP_Query present in WordPress 6.8 and later. The full remote code execution chain applies to WordPress 6.9.0 through 7.0.1, while CVE-2026-60137 also affects WordPress 6.8.0 through 6.8.5 as a standalone SQL injection issue. The article notes that the chain can be executed against a default WordPress installation with no plugins required, and Cloudflare said the vulnerable code path is reached when a persistent object cache is not in use.\u003c/p\u003e\n\n\u003cp\u003ePatches were released on July 17, 2026, in WordPress 7.0.2, 6.9.5, and 6.8.6, and WordPress.org enabled forced automatic updates for supported affected installations. For sites that cannot update immediately, the article lists temporary mitigations including blocking unauthenticated REST API access, blocking /wp-json/batch/v1 and ?rest_route=/batch/v1 at the WAF level, or deploying a custom PHP plugin from wp2shell.com. As of July 20, 2026, the article says no specific threat actor attribution or public indicators of compromise had been released.\u003c/p\u003e\n"},{"n":6,"title":"Critical ServiceNow code execution flaw now exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-servicenow-code-execution-flaw-now-exploited-in-attacks/","time":"09:29","priority":"MUST READ","score":96,"tldr":"Attackers are now exploiting CVE-2026-6875, a critical pre-authentication remote code execution flaw in ServiceNow AI Platform, just days after patches were released. ServiceNow customers with self-hosted instances should upgrade to a fixed version immediately.","briefOverview":"\u003cp\u003eAttackers have begun exploiting CVE-2026-6875, a critical vulnerability in the ServiceNow AI Platform, according to threat intelligence company Defused. ServiceNow AI Platform, formerly known as the Now Platform, is an enterprise Platform-as-a-Service used to integrate AI into enterprise workflows. ServiceNow addressed the flaw across hosted instances and released security updates for self-hosted instances on July 13th.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber found and reported the vulnerability on April 1st and said it allows unauthenticated threat actors to escape the sandbox and execute code remotely within the ServiceNow platform in high-complexity attacks. Defused said it observed in-the-wild exploitation over the weekend, with the first attempts seen on Friday, days after patches were issued. Defused also said the payloads target the same pre-authentication sink, /assessment_thanks.do, documented by Searchlight Cyber, but reach the code-execution capability through a different route than the published proof of concept.\u003c/p\u003e\n\n\u003cp\u003eServiceNow has not yet marked the issue as actively abused and its official advisory still says it is not currently aware of exploitation against ServiceNow instances. The company advises customers who have not already done so to upgrade to a patched release as soon as possible. ServiceNow says its AI Platform runs more than 100 billion workflows each year and powers over 100,000 enterprise AI apps at 85% of all Fortune 500 companies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers have begun exploiting CVE-2026-6875, a critical vulnerability in the ServiceNow AI Platform, according to threat intelligence company Defused.","Searchlight Cyber found and reported the flaw on April 1st, saying it allows unauthenticated threat actors to escape the sandbox and execute code remotely within the ServiceNow platform in high-complexity attacks.","ServiceNow addressed the flaw across hosted instances and released security updates for self-hosted instances on July 13th.","Defused said the observed payloads target the same pre-authentication sink at /assessment_thanks.do documented by Searchlight Cyber, but use a different sandbox-escape route than the published proof of concept.","ServiceNow’s official advisory still says the company is not currently aware of exploitation against ServiceNow instances, while advising customers to upgrade to a patched release as soon as possible."],"insights":["Exploitation was observed only days after ServiceNow released patches, making the patch window for self-hosted customers especially narrow.","The attacks reportedly use a different sandbox-escape route than Searchlight Cyber’s published proof of concept, so defenders should not assume that blocking only the published technique is sufficient.","There is a mismatch between Defused’s report of in-the-wild exploitation and ServiceNow’s advisory, which still says the company is not currently aware of exploitation against ServiceNow instances.","The vulnerable endpoint mentioned by Defused, /assessment_thanks.do, gives defenders a specific place to look when reviewing activity related to attempted exploitation."],"referencedReports":[{"title":"Smashing the ServiceNow Sandbox: Pre-Authentication RCE","url":"https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/","publisher":"Searchlight Cyber","context":"The article cites Searchlight Cyber’s research as the technical analysis that found and reported CVE-2026-6875.","category":"research","primary":true},{"title":"CVE-2026-6875 security updates","url":"https://support.servicenow.com/kb?id=kb_article_view\u0026sysparm_article=KB3137947","publisher":"ServiceNow","context":"The article references ServiceNow’s advisory as the source for patched releases for self-hosted instances and the vendor’s statement about exploitation awareness.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers have begun exploiting CVE-2026-6875, a critical vulnerability in the ServiceNow AI Platform, according to threat intelligence company Defused. ServiceNow AI Platform, formerly known as the Now Platform, is an enterprise Platform-as-a-Service used to integrate AI into enterprise workflows. ServiceNow addressed the flaw across hosted instances and released security updates for self-hosted instances on July 13th.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber found and reported the vulnerability on April 1st and said it allows unauthenticated threat actors to escape the sandbox and execute code remotely within the ServiceNow platform in high-complexity attacks. Defused said it observed in-the-wild exploitation over the weekend, with the first attempts seen on Friday, days after patches were issued. Defused also said the payloads target the same pre-authentication sink, /assessment_thanks.do, documented by Searchlight Cyber, but reach the code-execution capability through a different route than the published proof of concept.\u003c/p\u003e\n\n\u003cp\u003eServiceNow has not yet marked the issue as actively abused and its official advisory still says it is not currently aware of exploitation against ServiceNow instances. The company advises customers who have not already done so to upgrade to a patched release as soon as possible. ServiceNow says its AI Platform runs more than 100 billion workflows each year and powers over 100,000 enterprise AI apps at 85% of all Fortune 500 companies.\u003c/p\u003e\n"},{"n":7,"title":"SonicWall SMA1000 flaws exploited as zero-days to push custom malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sonicwall-sma1000-flaws-exploited-as-zero-days-to-push-custom-malware/","time":"22:23","priority":"MUST READ","score":95,"tldr":"SonicWall SMA1000 vulnerabilities CVE-2026-15409 and CVE-2026-15410 were exploited as zero-days for weeks to gain root access and deploy custom malware on VPN appliances. Customers should urgently apply SonicWall’s patches to versions 12.4.3-03453 or 12.5.0-02835.","briefOverview":"\u003cp\u003eTwo recently disclosed SonicWall SMA1000 vulnerabilities were exploited as zero-days for weeks, allowing threat actors to install custom malware on vulnerable VPN appliances. The flaws are CVE-2026-15409, a critical server-side request forgery vulnerability, and CVE-2026-15410, a high-severity command injection flaw. They affect SMA1000 6210, 7210, and 8200v appliances, and SonicWall released patches in versions 12.4.3-03453 and 12.5.0-02835.\u003c/p\u003e\n\n\u003cp\u003eVolexity, which assisted SonicWall in investigating the attacks, said a previously unknown threat actor it tracks as UTA0533 began exploiting the vulnerabilities as early as June 22. In two compromised appliances, Volexity found the attackers abused the SMA1000 /wsproxy endpoint to establish unauthenticated WebSocket tunnels to services that should only have been accessible from the appliance itself. The attackers then obtained the appliance product_uuid from CouchDB and exploited the sysCtrl.execRemoveHotfix RPC method to execute commands as root.\u003c/p\u003e\n\n\u003cp\u003eWith root access, UTA0533 installed a custom malware dropper called KNUCKLEBALL under the file name deploy_new.py. KNUCKLEBALL deployed two Java-based malware families, Sou5 and ORANGETAIL, designed for SonicWall SMA1000 appliances. Volexity said Sou5 acts as a reverse proxy, while ORANGETAIL is a custom Java webshell, and the attackers also modified nginx configuration to expose ORANGETAIL remotely and installed a privilege-escalation tool called ROOTRUN.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Two recently disclosed SonicWall SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, were exploited as zero-days for weeks to install custom malware on vulnerable VPN appliances.","The flaws affect SonicWall SMA1000 6210, 7210, and 8200v appliances, and SonicWall released patches in versions 12.4.3-03453 and 12.5.0-02835.","Volexity found that threat actor UTA0533 abused the SMA1000 /wsproxy endpoint to create unauthenticated WebSocket tunnels to internal services, including CouchDB and the appliance management service.","After obtaining the appliance product_uuid, the attackers exploited the sysCtrl.execRemoveHotfix RPC method to execute commands as root and take full control of the appliance.","UTA0533 installed KNUCKLEBALL to deploy the Java-based malware families Sou5 and ORANGETAIL, and also modified nginx configuration to expose the ORANGETAIL webshell remotely."],"insights":["The initial compromise path abused the SMA1000 /wsproxy endpoint to reach services that should only have been accessible from the appliance itself, making internal-only services such as CouchDB and the management service part of the attack surface.","The attackers needed the appliance product_uuid from CouchDB before exploiting the second flaw, showing that incident responders should review CouchDB access and queries when investigating these compromises.","The malware was built specifically for SonicWall SMA1000 appliances, including Java-based components named Sou5 and ORANGETAIL, indicating the campaign was tailored rather than using only generic post-compromise tools.","Volexity observed the earliest compromise on June 22, weeks before SonicWall publicly disclosed the flaws, so organizations should investigate activity predating the patch announcement rather than only checking events after disclosure.","Although the campaign and malware showed significant technical sophistication, Volexity said the threat actor was less successful at spreading into victims’ internal networks."],"referencedReports":[{"title":"Proxying to Compromise: SonicWall Secure Mobile Access 0-Day Exploitation","url":"http://www.volexity.com/blog/2026/07/17/proxying-to-compromise-sonicwall-secure-mobile-access-0-day-exploitation/","publisher":"Volexity","context":"The article cites Volexity's report as the source detailing the full exploitation chain and custom malware used against SonicWall SMA1000 appliances.","category":"research","primary":true}],"body":"\u003cp\u003eTwo recently disclosed SonicWall SMA1000 vulnerabilities were exploited as zero-days for weeks, allowing threat actors to install custom malware on vulnerable VPN appliances. The flaws are CVE-2026-15409, a critical server-side request forgery vulnerability, and CVE-2026-15410, a high-severity command injection flaw. They affect SMA1000 6210, 7210, and 8200v appliances, and SonicWall released patches in versions 12.4.3-03453 and 12.5.0-02835.\u003c/p\u003e\n\n\u003cp\u003eVolexity, which assisted SonicWall in investigating the attacks, said a previously unknown threat actor it tracks as UTA0533 began exploiting the vulnerabilities as early as June 22. In two compromised appliances, Volexity found the attackers abused the SMA1000 /wsproxy endpoint to establish unauthenticated WebSocket tunnels to services that should only have been accessible from the appliance itself. The attackers then obtained the appliance product_uuid from CouchDB and exploited the sysCtrl.execRemoveHotfix RPC method to execute commands as root.\u003c/p\u003e\n\n\u003cp\u003eWith root access, UTA0533 installed a custom malware dropper called KNUCKLEBALL under the file name deploy_new.py. KNUCKLEBALL deployed two Java-based malware families, Sou5 and ORANGETAIL, designed for SonicWall SMA1000 appliances. Volexity said Sou5 acts as a reverse proxy, while ORANGETAIL is a custom Java webshell, and the attackers also modified nginx configuration to expose ORANGETAIL remotely and installed a privilege-escalation tool called ROOTRUN.\u003c/p\u003e\n"},{"n":13,"title":"A Look Inside the HuggingFace Breach","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/huggingface-breach","time":"20:15","priority":"MUST READ","score":94,"tldr":"HuggingFace disclosed a breach where an autonomous AI attacker exploited RCE flaws in its dataset processing pipeline to steal credentials and move laterally, while defenders used AI-driven detection to investigate and contain it. The key takeaway is that AI/ML workloads and downloaded datasets must be treated as untrusted code with strict least privilege and monitoring for unusual access patterns.","briefOverview":"\u003cp\u003eHuggingFace disclosed on July 16, 2026, that an autonomous AI attacker infiltrated its internal infrastructure. The attacker accessed a limited set of internal datasets, leaked several service credentials, and generated decoy activity to hide real impact in noise and slow the investigation. HuggingFace contained the attack, fixed the vulnerability that enabled initial access, and removed the attacker’s foothold from affected infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe article says the attacker exploited two remote code execution vulnerabilities in HuggingFace’s dataset processing pipeline. One involved abusing a remote-code dataset loader that runs custom loading scripts during dataset ingestion, and the other involved template injection in a dataset configuration file. From the initial foothold, the attacker operated a distributed command-and-control environment using dynamic, short-lived endpoints, exfiltrated cloud and cluster credentials, and moved laterally into several internal clusters.\u003c/p\u003e\n\n\u003cp\u003eHuggingFace detected the compromise with an AI-assisted threat detection system and used LLM-driven analysis agents to examine logs, extract indicators of compromise, and separate real attacker impact from decoy actions. The article highlights that commercial foundation-model guardrails blocked defenders from processing malicious payloads in their own logs, leading HuggingFace to deploy an open-weight LLM on its own infrastructure. It recommends rotating API access tokens, applying least privilege to AI workloads, treating downloaded models and datasets as untrusted code, and hunting for unusual access patterns around AI infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On July 16, 2026, HuggingFace disclosed a security breach in which an autonomous AI attacker infiltrated its internal infrastructure.","The attacker exploited two remote code execution vulnerabilities in HuggingFace’s dataset processing pipeline, including abuse of a remote-code dataset loader and template injection in a dataset configuration.","The attacker leaked cloud and cluster credentials, moved laterally into several internal clusters, and generated decoy activity to complicate attribution and impact analysis.","HuggingFace detected the compromise with an AI-assisted threat detection system and used LLM-driven analysis agents to extract indicators of compromise from logs.","HuggingFace recommended that users rotate API access tokens and report any unusual account activity."],"insights":["Commercial foundation-model guardrails blocked HuggingFace’s defenders from processing malicious payloads found in their own logs, forcing them to deploy an open-weight LLM on their own infrastructure for the investigation.","The article highlights that dataset ingestion can become an execution path because ML datasets often include custom loading scripts that run automatically when processed.","The attacker’s decoy activity made impact analysis harder, showing that autonomous attacks may try to slow investigations rather than only steal data or maintain access.","The article recommends looking for “intent-drift,” such as unexpected reads of environment variables, cloud metadata endpoints, or secret stores from ML workload processes, as a detectable sign of compromise.","The article argues that organizations need AI-assisted defensive capability ready before an incident because building it during a live, machine-speed attack is described as a losing race."],"referencedReports":[],"body":"\u003cp\u003eHuggingFace disclosed on July 16, 2026, that an autonomous AI attacker infiltrated its internal infrastructure. The attacker accessed a limited set of internal datasets, leaked several service credentials, and generated decoy activity to hide real impact in noise and slow the investigation. HuggingFace contained the attack, fixed the vulnerability that enabled initial access, and removed the attacker’s foothold from affected infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe article says the attacker exploited two remote code execution vulnerabilities in HuggingFace’s dataset processing pipeline. One involved abusing a remote-code dataset loader that runs custom loading scripts during dataset ingestion, and the other involved template injection in a dataset configuration file. From the initial foothold, the attacker operated a distributed command-and-control environment using dynamic, short-lived endpoints, exfiltrated cloud and cluster credentials, and moved laterally into several internal clusters.\u003c/p\u003e\n\n\u003cp\u003eHuggingFace detected the compromise with an AI-assisted threat detection system and used LLM-driven analysis agents to examine logs, extract indicators of compromise, and separate real attacker impact from decoy actions. The article highlights that commercial foundation-model guardrails blocked defenders from processing malicious payloads in their own logs, leading HuggingFace to deploy an open-weight LLM on its own infrastructure. It recommends rotating API access tokens, applying least privilege to AI workloads, treating downloaded models and datasets as untrusted code, and hunting for unusual access patterns around AI infrastructure.\u003c/p\u003e\n"},{"n":23,"title":"Russian Intelligence Hacks IP Cameras to Spy on Military Logistics Across NATO States and Ukraine","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/russian-intelligence-hacks-ip-cameras.html","time":"12:13","priority":"MUST READ","score":94,"tldr":"Dutch intelligence says Russian state actors are hijacking exposed IP cameras across Ukraine and NATO/EU countries to monitor military logistics, weapons shipments, and troop movements. The main fix is basic but urgent: remove cameras from the public internet, change default credentials, patch them, and control what they can see.","briefOverview":"\u003cp\u003eDutch intelligence services AIVD and MIVD say at least one Russian intelligence service is systematically hijacking internet-connected security cameras across Europe and Ukraine. The operation is being used to watch military transport routes, weapons shipments bound for Kyiv, and the locations of Ukrainian troops. In Ukraine, the services say camera access has been used in attempts to neutralise Ukrainian military personnel and destroy their equipment.\u003c/p\u003e\n\n\u003cp\u003eThe article says the same camera access is also collecting military intelligence across EU and NATO states, including information unrelated to the war. In the Netherlands, the Dutch services said they confirmed a small number of breached cameras located directly on military logistics routes and warned the organisations operating them. Censys separately counted more than 87,000 internet-connected cameras across the EU, NATO members, and Ukraine running a service version matching a known-exploited vulnerability, including more than 4,000 in Ukraine.\u003c/p\u003e\n\n\u003cp\u003eThe operators reportedly scan the internet for exposed devices, identify IP cameras by brand, and access those still using default passwords, obsolete firmware, or unchanged factory settings. The article notes that the described access does not require a zero-day, and image-recognition software is used to search video feeds for military vehicles and cargo. Recommended defenses include finding exposed cameras, disabling port forwarding and UPnP, using VPN access, replacing default credentials, patching firmware and software, and keeping sensitive routes or sites out of view.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The AIVD and MIVD said at least one Russian intelligence service is systematically hijacking internet-connected security cameras across Europe and Ukraine to monitor military transport routes, weapons shipments bound for Kyiv, and Ukrainian troop locations.","In Ukraine, access to compromised cameras has been used in attempts to neutralise Ukrainian military personnel and destroy their equipment, according to the Dutch intelligence services.","The operators reportedly find exposed devices by scanning the internet, identifying camera brands, and accessing cameras that still use default passwords, obsolete firmware, or unchanged factory settings.","Censys counted more than 87,000 internet-connected cameras across the EU, NATO members, and Ukraine running a service version matching a known-exploited vulnerability, including more than 4,000 in Ukraine.","The Dutch services said they had confirmed only a small number of breached cameras in the Netherlands, located directly on military logistics routes, and had warned the organisations operating them."],"insights":["The advisory says the operation does not require zero-day exploits because exposed cameras with default passwords, obsolete firmware, or unchanged factory settings can provide useful access on their own.","The intelligence value of a compromised camera depends heavily on where it is pointed, so reducing what cameras can see is presented as a defense alongside patching and password changes.","Censys’ exposure numbers are only a lower-bound estimate and include important caveats, because version matches do not necessarily prove that a device is exploitable or that the camera software itself is vulnerable.","The Dutch services distinguished broad exposure from confirmed compromise, saying only a small number of breached cameras had actually been caught in the Netherlands despite tens of thousands of publicly reachable cameras there.","The article highlights that compromised cameras can provide a live view of physical operations without requiring a deeper breach of the victim’s network."],"referencedReports":[{"title":"Cybersecurity Advisory: Russian State Actors Are Compromising IP Cameras","url":"https://english.aivd.nl/documents/2026/07/10/brochure-cybersecurity-advisory-russian-state-actors-are-compromising-ip-cameras","publisher":"AIVD and MIVD","context":"The article says its core findings come from a cybersecurity advisory published by the Netherlands' civilian and military intelligence services on Russian state actors compromising IP cameras.","category":"advisory","primary":true},{"title":"Russia Camera Hacking Espionage Campaign","url":"https://censys.com/blog/russia-camera-hacking-espionage-campaign/","publisher":"Censys","context":"The article cites Censys' own analysis of the exposed IP camera surface across the EU, NATO members, and Ukraine, including counts of reachable cameras and vulnerable service versions.","category":"research","primary":false}],"body":"\u003cp\u003eDutch intelligence services AIVD and MIVD say at least one Russian intelligence service is systematically hijacking internet-connected security cameras across Europe and Ukraine. The operation is being used to watch military transport routes, weapons shipments bound for Kyiv, and the locations of Ukrainian troops. In Ukraine, the services say camera access has been used in attempts to neutralise Ukrainian military personnel and destroy their equipment.\u003c/p\u003e\n\n\u003cp\u003eThe article says the same camera access is also collecting military intelligence across EU and NATO states, including information unrelated to the war. In the Netherlands, the Dutch services said they confirmed a small number of breached cameras located directly on military logistics routes and warned the organisations operating them. Censys separately counted more than 87,000 internet-connected cameras across the EU, NATO members, and Ukraine running a service version matching a known-exploited vulnerability, including more than 4,000 in Ukraine.\u003c/p\u003e\n\n\u003cp\u003eThe operators reportedly scan the internet for exposed devices, identify IP cameras by brand, and access those still using default passwords, obsolete firmware, or unchanged factory settings. The article notes that the described access does not require a zero-day, and image-recognition software is used to search video feeds for military vehicles and cargo. Recommended defenses include finding exposed cameras, disabling port forwarding and UPnP, using VPN access, replacing default credentials, patching firmware and software, and keeping sensitive routes or sites out of view.\u003c/p\u003e\n"},{"n":8,"title":"JadePuffer agentic attacks now target AI model data with ransomware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/jadepuffer-agentic-attacks-now-target-ai-model-data-with-ransomware/","time":"21:08","priority":"MUST READ","score":92,"tldr":"JadePuffer has upgraded its autonomous ransomware operations with EncForge, malware built to encrypt AI and machine learning assets such as model checkpoints, training datasets, and vector databases. Sysdig says the attacker exploited a vulnerable Langflow instance and exposed Docker socket, highlighting the need to patch Langflow and lock down container access.","briefOverview":"\u003cp\u003eThe JadePuffer autonomous AI agent has upgraded with custom malware called EncForge that focuses on encrypting AI assets, including training datasets, vector databases, and model checkpoints. Sysdig reported that the attacker returned to a previously breached Langflow instance vulnerable to CVE-2025-3248 with Go-based ransomware built for AI and machine learning infrastructure. The threat actor searched for cloud credentials, API tokens, and reachable internal services, then found an exposed Docker socket that provided root-level control.\u003c/p\u003e\n\n\u003cp\u003eWhen the initial ransomware download failed, the operator developed and deployed six Python scripts over five minutes, with the final script solving the delivery issues. Sysdig said the completed payload discovered the target process ID, copied EncForge across the namespace boundary through procfs, ran a test scan, launched live encryption, and counted \u003ccode\u003e.locked\u003c/code\u003e files to verify execution. The malware targets about 180 file extensions across modern AI and ML formats, including Hugging Face SafeTensors files, PyTorch and TensorFlow models, GGUF and GGML weights, FAISS vector indexes, and training datasets such as Parquet, Arrow, TFRecord, NumPy, and DuckDB formats.\u003c/p\u003e\n\n\u003cp\u003eEncForge uses AES-256 in counter mode to encrypt files in a hybrid scheme, with the symmetric key secured by an RSA-2048 public key. To improve performance, it encrypts selected portions of files rather than entire contents, appends the \u003ccode\u003e.locked\u003c/code\u003e extension, and drops a ransom note with a unique identifier. Sysdig found no evidence of data exfiltration during the intrusion, but said encryption of model weights, training datasets, and vector indexes could cost organizations weeks or months of training and fine-tuning, with damages estimated between \u003cspan class=\"math inline\"\u003e\\(75,000 and \\)\u003c/span\u003e500,000 per model.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sysdig reported that the JadePuffer autonomous AI agent returned to a previously breached Langflow instance vulnerable to CVE-2025-3248 and deployed the Go-based EncForge ransomware.","EncForge targets about 180 file extensions across AI and machine learning environments, including model checkpoints, vector databases, training datasets, embedding indices, Hugging Face SafeTensors files, PyTorch and TensorFlow models, GGUF and GGML weights, and FAISS vector indexes.","After discovering an exposed Docker socket with root-level control, the attacker developed and deployed six Python scripts in five minutes to solve ransomware delivery problems.","EncForge uses AES-256 in counter mode with an RSA-2048 public key to encrypt selected portions of files, appends the .locked extension, and drops a ransom note with a unique identifier.","Sysdig found no evidence of data exfiltration during the intrusion and recommended updating to Langflow 1.3.0 or later, restricting Docker socket access, running Langflow containers as non-root, and applying filesystem-level access controls to model weight directories."],"insights":["JadePuffer’s operator adapted to a failed payload download by creating six Python deployment scripts in five minutes, showing how quickly the attack process changed when the initial plan did not work.","EncForge’s targeting of LoRA adapters, GGML files, model checkpoints, vector indexes, and training data indicates it was built for AI and machine learning environments rather than being a generic file-locking tool.","The attack shows that an exposed Docker socket can turn a vulnerable Langflow instance into root-level control, making Docker socket restrictions a high-impact defensive measure.","EncForge encrypts only selected portions of files to improve performance, which can still disrupt valuable AI assets while reducing the time needed to complete encryption.","The Linux variant contains Windows anti-recovery functions, suggesting the ransomware codebase includes cross-platform recovery-disruption capabilities even though a macOS version was only hinted at and not confirmed."],"referencedReports":[{"title":"JadePuffer Evolves: The Agentic Threat Actor Deploys Ransomware Built to Destroy AI Models","url":"http://www.sysdig.com/blog/jadepuffer-evolves-the-agentic-threat-actor-deploys-ransomware-built-to-destroy-ai-models","publisher":"Sysdig","context":"The article cites Sysdig's report as the source for details on JadePuffer returning to a vulnerable Langflow instance and deploying EncForge ransomware against AI and machine learning infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eThe JadePuffer autonomous AI agent has upgraded with custom malware called EncForge that focuses on encrypting AI assets, including training datasets, vector databases, and model checkpoints. Sysdig reported that the attacker returned to a previously breached Langflow instance vulnerable to CVE-2025-3248 with Go-based ransomware built for AI and machine learning infrastructure. The threat actor searched for cloud credentials, API tokens, and reachable internal services, then found an exposed Docker socket that provided root-level control.\u003c/p\u003e\n\n\u003cp\u003eWhen the initial ransomware download failed, the operator developed and deployed six Python scripts over five minutes, with the final script solving the delivery issues. Sysdig said the completed payload discovered the target process ID, copied EncForge across the namespace boundary through procfs, ran a test scan, launched live encryption, and counted \u003ccode\u003e.locked\u003c/code\u003e files to verify execution. The malware targets about 180 file extensions across modern AI and ML formats, including Hugging Face SafeTensors files, PyTorch and TensorFlow models, GGUF and GGML weights, FAISS vector indexes, and training datasets such as Parquet, Arrow, TFRecord, NumPy, and DuckDB formats.\u003c/p\u003e\n\n\u003cp\u003eEncForge uses AES-256 in counter mode to encrypt files in a hybrid scheme, with the symmetric key secured by an RSA-2048 public key. To improve performance, it encrypts selected portions of files rather than entire contents, appends the \u003ccode\u003e.locked\u003c/code\u003e extension, and drops a ransom note with a unique identifier. Sysdig found no evidence of data exfiltration during the intrusion, but said encryption of model weights, training datasets, and vector indexes could cost organizations weeks or months of training and fine-tuning, with damages estimated between \u003cspan class=\"math inline\"\u003e\\(75,000 and \\)\u003c/span\u003e500,000 per model.\u003c/p\u003e\n"},{"n":10,"title":"Estée Lauder discloses data breach via Oracle E-Business flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/est-e-lauder-discloses-data-breach-via-oracle-e-business-flaw/","time":"22:39","priority":"MUST READ","score":92,"tldr":"Estée Lauder is notifying affected individuals after attackers exploited an Oracle E-Business Suite HR system flaw to steal sensitive personal, financial, health, and employment data. The incident appears tied to the Clop mass-exploitation campaign using CVE-2025-61882.","briefOverview":"\u003cp\u003eEstée Lauder is notifying customers of a data breach after hackers exploited a flaw in Oracle E-Business Suite, which the company used for human resources operations. The company said it became aware of a cybersecurity issue involving the Oracle E-Business Suite system and determined on June 19, 2026, that an unauthorized third party had accessed it on or around August 9, 2025. The attackers obtained personal information of certain individuals.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data includes full names, postal addresses, email addresses, dates of birth, Social Security numbers, passport numbers, financial account information, health information, and employment information such as payroll and performance reports. Estée Lauder is advising recipients of the notification letter to remain vigilant for signs of identity theft and fraud. The company is also offering 24 months of complimentary identity monitoring services through Kroll.\u003c/p\u003e\n\n\u003cp\u003eAlthough Estée Lauder did not disclose the specific vulnerability exploited, the breach date correlates with a mass-exploitation campaign targeting Oracle E-Business Suite through CVE-2025-61882. The flaw affected EBS versions 12.2.3 through 12.2.14 and enabled attackers to bypass authentication and remotely execute code through the BI Publisher Integration component. Oracle released fixes for CVE-2025-61882 on October 4, 2025, and CrowdStrike later confirmed that Clop had been exploiting the flaw since early August 2025.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Estée Lauder is notifying customers of a data breach after hackers exploited a flaw in Oracle E-Business Suite used by the company for human resources operations.","The company determined on June 19, 2026, that an unauthorized third party had accessed the Oracle E-Business Suite system on or around August 9, 2025, and obtained personal information of certain individuals.","The exposed data includes full names, postal addresses, email addresses, dates of birth, Social Security numbers, passport numbers, financial account information, health information, and employment information such as payroll and performance reports.","The breach date correlates with a mass-exploitation campaign targeting Oracle E-Business Suite through CVE-2025-61882, which Google and Mandiant linked to the Clop ransomware gang in October 2025.","Estée Lauder is advising recipients to watch for signs of identity theft and fraud and is offering 24 months of complimentary identity monitoring services through Kroll."],"insights":["Estée Lauder identified the intrusion in 2026 even though the unauthorized access occurred around August 9, 2025, showing a long gap between compromise and confirmed determination.","The affected Oracle E-Business Suite system was used for HR management, which explains why the exposed information spans identity, financial, health, payroll, and performance records rather than only customer contact details.","Oracle released fixes for CVE-2025-61882 on October 4, 2025, after the article says Clop had already been exploiting the flaw since early August 2025.","Estée Lauder had previously been compromised by Clop in 2023 through a different zero-day in MOVEit Transfer, making this at least the second Clop-linked incident involving the company mentioned in the article."],"referencedReports":[],"body":"\u003cp\u003eEstée Lauder is notifying customers of a data breach after hackers exploited a flaw in Oracle E-Business Suite, which the company used for human resources operations. The company said it became aware of a cybersecurity issue involving the Oracle E-Business Suite system and determined on June 19, 2026, that an unauthorized third party had accessed it on or around August 9, 2025. The attackers obtained personal information of certain individuals.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data includes full names, postal addresses, email addresses, dates of birth, Social Security numbers, passport numbers, financial account information, health information, and employment information such as payroll and performance reports. Estée Lauder is advising recipients of the notification letter to remain vigilant for signs of identity theft and fraud. The company is also offering 24 months of complimentary identity monitoring services through Kroll.\u003c/p\u003e\n\n\u003cp\u003eAlthough Estée Lauder did not disclose the specific vulnerability exploited, the breach date correlates with a mass-exploitation campaign targeting Oracle E-Business Suite through CVE-2025-61882. The flaw affected EBS versions 12.2.3 through 12.2.14 and enabled attackers to bypass authentication and remotely execute code through the BI Publisher Integration component. Oracle released fixes for CVE-2025-61882 on October 4, 2025, and CrowdStrike later confirmed that Clop had been exploiting the flaw since early August 2025.\u003c/p\u003e\n"},{"n":25,"title":"World's Largest AI Model Repository Hugging Face Breached by Autonomous AI Agent","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/worlds-largest-ai-model-repository.html","time":"05:27","priority":"MUST READ","score":92,"tldr":"Hugging Face said an autonomous AI agent breached parts of its production infrastructure via malicious dataset processing paths, accessing limited internal datasets and service credentials but not public models or its supply chain. The company remediated the intrusion, rotated secrets, and urged users to rotate access tokens and review account activity.","briefOverview":"\u003cp\u003eHugging Face said it detected and responded to a breach targeting its production infrastructure earlier last week. The company identified unauthorized access to a limited set of internal datasets and several credentials used by its services. It said it has found no evidence that the AI agent tampered with public, user-facing models, datasets, Spaces, or its software supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe attack began in the data processing pipeline with a malicious dataset that abused two code execution paths. Hugging Face said the dataset used a remote code dataset loader and a template injection in a dataset configuration to run code on a processing worker. From there, the threat actor escalated to node-level access, collected cloud and cluster credentials, and moved laterally into several internal clusters over a weekend.\u003c/p\u003e\n\n\u003cp\u003eThe exact large language model used in the attack is unclear, but Hugging Face said the campaign was executed by an autonomous agent framework performing many thousands of actions across short-lived sandboxes. The company removed the attacker’s foothold, rebuilt compromised nodes, rotated affected credentials and tokens, deployed stricter controls, and improved detection and alerting. Hugging Face also urged customers to rotate access tokens and review recent activity, and said the incident showed defenders may need a capable model they can run on their own infrastructure during investigations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hugging Face said it detected and responded to unauthorized access targeting its production infrastructure earlier last week.","The company said the intrusion accessed a limited set of internal datasets and several credentials used by its services, but it found no evidence of tampering with public models, datasets, Spaces, or its software supply chain.","Hugging Face said the attack began with a malicious dataset that abused a remote code dataset loader and a template injection in a dataset configuration to run code on a processing worker.","The campaign was described as being executed by an autonomous agent framework performing many thousands of actions across short-lived sandboxes with command-and-control staged on public services.","Hugging Face said it removed the attacker’s foothold, rebuilt compromised nodes, rotated affected credentials and tokens, added stricter cluster controls, and urged customers to rotate access tokens and review recent account activity."],"insights":["The initial access came through Hugging Face’s own data processing pipeline, showing that dataset ingestion features can become an entry point when they include code execution paths.","Hugging Face’s investigators reported that some Western frontier models blocked forensic prompts containing real attack commands and artifacts, which the company said created a practical gap for incident response work.","The company said defenders should have a capable model ready to run on their own infrastructure before an incident, both to avoid safety-filter lockout and to keep attacker data and credentials inside their environment.","The attack’s use of many short-lived sandboxes and command-and-control staged on public services made the campaign operationally distributed rather than a single static intrusion path."],"referencedReports":[],"body":"\u003cp\u003eHugging Face said it detected and responded to a breach targeting its production infrastructure earlier last week. The company identified unauthorized access to a limited set of internal datasets and several credentials used by its services. It said it has found no evidence that the AI agent tampered with public, user-facing models, datasets, Spaces, or its software supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe attack began in the data processing pipeline with a malicious dataset that abused two code execution paths. Hugging Face said the dataset used a remote code dataset loader and a template injection in a dataset configuration to run code on a processing worker. From there, the threat actor escalated to node-level access, collected cloud and cluster credentials, and moved laterally into several internal clusters over a weekend.\u003c/p\u003e\n\n\u003cp\u003eThe exact large language model used in the attack is unclear, but Hugging Face said the campaign was executed by an autonomous agent framework performing many thousands of actions across short-lived sandboxes. The company removed the attacker’s foothold, rebuilt compromised nodes, rotated affected credentials and tokens, deployed stricter controls, and improved detection and alerting. Hugging Face also urged customers to rotate access tokens and review recent activity, and said the incident showed defenders may need a capable model they can run on their own infrastructure during investigations.\u003c/p\u003e\n"},{"n":27,"title":"Exposed Server Reveals AI-Assisted Phishing Toolkit Behind WebDAV Malware Campaign","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/exposed-server-reveals-ai-assisted.html","time":"17:29","priority":"MUST READ","score":92,"tldr":"Rapid7 found an exposed malware delivery server containing an AI-assisted phishing toolkit, including WebDAV-based Windows delivery experiments and live campaigns targeting Mexican users via a fake government ID lookup site. The key takeaway is that attackers are using commodity AI coding tools to rapidly build, test, and scale phishing delivery pipelines around patched and emerging Windows abuse techniques.","briefOverview":"\u003cp\u003eRapid7 found an exposed malware delivery server containing 1,048 files, including lure templates, filename-spoofing tests, execution experiments, droppers, builder notes, and two campaign chains. One campaign was already active against Windows users in Mexico through a fake government CURP national-ID lookup site. The exposed files showed the operation in progress, including failed experiments, documentation, and live delivery logs.\u003c/p\u003e\n\n\u003cp\u003eThe most developed test set focused on CVE-2025-33053, a WebDAV working-directory hijack that abuses a \u003ccode\u003e.url\u003c/code\u003e shortcut to launch a signed Windows binary while pointing its working directory at an attacker-controlled WebDAV share. The operator expanded testing into 59 \u003ccode\u003e.url\u003c/code\u003e files aimed at other signed binaries because the original \u003ccode\u003eiediagcmd.exe\u003c/code\u003e approach breaks on Windows 11 24H2, where Internet Explorer is removed. Rapid7 assessed that the READMEs, lure guides, test matrices, mapping files, and emoji-heavy JavaScript reflected an LLM-assisted workflow likely built with help from the open-source Coderrr AI coding tool.\u003c/p\u003e\n\n\u003cp\u003eThe active Mexico-focused campaign used \u003ccode\u003egobf[.]mx\u003c/code\u003e, a typosquat of the government CURP lookup site, and delivered a \u003ccode\u003e.scr\u003c/code\u003e executable disguised as a PDF report using a right-to-left override in the filename. The payload used an Inno Setup installer to unpack a loader and run a .NET infostealer in memory, stealing cryptocurrency wallets, browser credentials, session cookies, and Telegram sessions. Over roughly 5.5 days, the delivery panel logged 77,098 requests from 3,892 unique IPs across 101 countries, with Mexico accounting for 82.5% of traffic and 96.9% of launch activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rapid7 found an exposed malware delivery server containing 1,048 files, including lure templates, filename-spoofing tests, execution experiments, droppers, builder notes, and two campaign chains.","The most developed test set focused on CVE-2025-33053, a WebDAV working-directory hijack that abuses a .url shortcut to launch a signed Windows binary while pointing its working directory at an attacker-controlled WebDAV share.","Rapid7 assessed that the READMEs, lure-generation guides, test write-ups, mapping files, and emoji-heavy phishing-site JavaScript reflected an LLM-assisted workflow likely built with help from the open-source Coderrr AI coding tool.","An active campaign targeting Mexican users used the typosquat gobf.mx to imitate a government CURP national-ID lookup site and delivered a .scr executable disguised as a PDF report.","The delivery panel logged 77,098 requests from 3,892 unique IPs across 101 countries over roughly 5.5 days, with Mexico accounting for 82.5% of traffic and 96.9% of launch activity."],"insights":["The exposed server captured the operation mid-build, giving defenders unusual visibility into failed experiments, testing notes, documentation, and live delivery logs rather than only final malware payloads.","The operator’s 59-file WebDAV test kit shows they were already searching for replacements because the original iediagcmd.exe technique breaks on Windows 11 24H2, where Internet Explorer is removed.","Rapid7’s delivery metrics distinguish exposure from confirmed compromise, noting that “launch events” mean a client requested or opened an executable from the share, not that the payload definitely executed on an endpoint.","The campaign’s traffic pattern, including heavy activity from Mexico during Mexican working hours, helped separate likely real user interaction from scanning traffic seen from places such as the United States and Germany.","The operator left the Simba Service delivery panel exposed with default port and credentials unchanged, showing that even an organized AI-assisted workflow still suffered from basic operational security failures."],"referencedReports":[{"title":"Exposed WebDAV Malware Delivery Lab Analysis","url":"https://www.rapid7.com/blog/post/tr-exposed-webdav-malware-delivery-lab-analysis/","publisher":"Rapid7","context":"The article is based heavily on Rapid7’s analysis of the exposed malware delivery server, toolkit artifacts, campaign logs, and indicators.","category":"research","primary":true},{"title":"Stealth Falcon Zero-Day","url":"https://research.checkpoint.com/2025/stealth-falcon-zero-day/","publisher":"Check Point","context":"The article cites Check Point’s prior documentation of the WebDAV working-directory hijack involving CVE-2025-33053 and Stealth Falcon.","category":"research","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article notes that CVE-2025-33053 is now included in CISA’s Known Exploited Vulnerabilities catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003eRapid7 found an exposed malware delivery server containing 1,048 files, including lure templates, filename-spoofing tests, execution experiments, droppers, builder notes, and two campaign chains. One campaign was already active against Windows users in Mexico through a fake government CURP national-ID lookup site. The exposed files showed the operation in progress, including failed experiments, documentation, and live delivery logs.\u003c/p\u003e\n\n\u003cp\u003eThe most developed test set focused on CVE-2025-33053, a WebDAV working-directory hijack that abuses a \u003ccode\u003e.url\u003c/code\u003e shortcut to launch a signed Windows binary while pointing its working directory at an attacker-controlled WebDAV share. The operator expanded testing into 59 \u003ccode\u003e.url\u003c/code\u003e files aimed at other signed binaries because the original \u003ccode\u003eiediagcmd.exe\u003c/code\u003e approach breaks on Windows 11 24H2, where Internet Explorer is removed. Rapid7 assessed that the READMEs, lure guides, test matrices, mapping files, and emoji-heavy JavaScript reflected an LLM-assisted workflow likely built with help from the open-source Coderrr AI coding tool.\u003c/p\u003e\n\n\u003cp\u003eThe active Mexico-focused campaign used \u003ccode\u003egobf[.]mx\u003c/code\u003e, a typosquat of the government CURP lookup site, and delivered a \u003ccode\u003e.scr\u003c/code\u003e executable disguised as a PDF report using a right-to-left override in the filename. The payload used an Inno Setup installer to unpack a loader and run a .NET infostealer in memory, stealing cryptocurrency wallets, browser credentials, session cookies, and Telegram sessions. Over roughly 5.5 days, the delivery panel logged 77,098 requests from 3,892 unique IPs across 101 countries, with Mexico accounting for 82.5% of traffic and 96.9% of launch activity.\u003c/p\u003e\n"},{"n":5,"title":"Hugging Face warns an autonomous AI agent hacked its network","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hugging-face-breach-autonomous-ai-agent-system-internal-datasets-credentials/","time":"11:56","priority":"SHOULD READ","score":88,"tldr":"Hugging Face says attackers used an autonomous AI agent to exploit its data-processing pipeline via a malicious dataset, steal internal credentials, and move laterally across clusters. The company says public models and datasets show no evidence of tampering, but it is still investigating possible partner or customer data exposure and urges users to rotate tokens.","briefOverview":"\u003cp\u003eHugging Face disclosed that attackers breached its production infrastructure using an autonomous AI agent system and gained access to internal datasets and credentials. The company is still investigating whether partner or customer data was affected and said it will contact any affected parties directly. Hugging Face said it has found no evidence to date that public-facing models, datasets, or Spaces were tampered with, and said its software supply chain has been verified clean.\u003c/p\u003e\n\n\u003cp\u003eThe intrusion began in Hugging Face\u0026rsquo;s data-processing pipeline, where attackers used a malicious dataset to exploit two code-execution vulnerabilities and run code on a processing worker. The exploited paths were a template injection in a dataset configuration and a remote code dataset loader. This access allowed the attackers to steal cloud and cluster credentials and move laterally across several internal clusters.\u003c/p\u003e\n\n\u003cp\u003eHugging Face said the campaign was run by an autonomous agent framework that executed many thousands of actions across short-lived sandboxes, with command-and-control staged on public services. In response, the company closed the vulnerable code execution paths, evicted the attacker, rebuilt compromised nodes, revoked and rotated affected credentials, improved detection systems, reported the incident to law enforcement, and began working with external forensic experts. Hugging Face advised users to rotate access tokens and review recent account activity for suspicious behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hugging Face disclosed that attackers accessed internal datasets and credentials after breaching its production infrastructure using an autonomous AI agent system.","The intrusion began in Hugging Face's data-processing pipeline, where a malicious dataset exploited a template injection in a dataset configuration and a remote code dataset loader to run code on a processing worker.","Hugging Face said the attackers stole cloud and cluster credentials and moved laterally across several internal clusters.","The company said it has found no evidence to date of tampering with public-facing models, datasets, or Spaces, and said its software supply chain has been verified clean.","Hugging Face closed the vulnerable code execution paths, evicted the attacker, rebuilt compromised nodes, revoked and rotated affected credentials, and advised users to rotate access tokens and review recent account activity."],"insights":["Hugging Face said its initial forensic work was hindered by guardrails in hosted AI models, leading it to recommend that defenders have a capable model ready to run on their own infrastructure during incidents.","The attackers’ autonomous agent framework reportedly executed many thousands of actions across short-lived sandboxes, showing why detection systems may need to handle high-volume, rapidly changing activity patterns.","Hugging Face found no evidence of tampering with public-facing models, datasets, or Spaces, making credential exposure and internal access the central confirmed concern rather than public supply-chain modification.","The company’s user guidance is immediately actionable: rotate access tokens and review recent account activity even though the investigation into partner or customer data impact is still ongoing."],"referencedReports":[{"title":"Security Incident July 2026","url":"https://huggingface.co/blog/security-incident-july-2026","publisher":"hugging-face","context":"The article cites Hugging Face's incident disclosure as the source for details on the autonomous agent campaign and the company's response.","category":"advisory","primary":true}],"body":"\u003cp\u003eHugging Face disclosed that attackers breached its production infrastructure using an autonomous AI agent system and gained access to internal datasets and credentials. The company is still investigating whether partner or customer data was affected and said it will contact any affected parties directly. Hugging Face said it has found no evidence to date that public-facing models, datasets, or Spaces were tampered with, and said its software supply chain has been verified clean.\u003c/p\u003e\n\n\u003cp\u003eThe intrusion began in Hugging Face\u0026rsquo;s data-processing pipeline, where attackers used a malicious dataset to exploit two code-execution vulnerabilities and run code on a processing worker. The exploited paths were a template injection in a dataset configuration and a remote code dataset loader. This access allowed the attackers to steal cloud and cluster credentials and move laterally across several internal clusters.\u003c/p\u003e\n\n\u003cp\u003eHugging Face said the campaign was run by an autonomous agent framework that executed many thousands of actions across short-lived sandboxes, with command-and-control staged on public services. In response, the company closed the vulnerable code execution paths, evicted the attacker, rebuilt compromised nodes, revoked and rotated affected credentials, improved detection systems, reported the incident to law enforcement, and began working with external forensic experts. Hugging Face advised users to rotate access tokens and review recent account activity for suspicious behavior.\u003c/p\u003e\n"},{"n":20,"title":"FakeGit Campaign Uses 7,600 GitHub Repositories to Spread SmartLoader Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fakegit-campaign-uses-7600-github.html","time":"18:23","priority":"SHOULD READ","score":88,"tldr":"Researchers found a large FakeGit campaign using about 7,600 malicious GitHub repositories, including hundreds disguised as AI skills and MCP servers, to spread SmartLoader and ultimately StealC malware. The key risk is “AgentBaiting,” where AI agents like ChatGPT, Claude Code, or Gemini can discover and recommend these fake repositories without a user being sent a malicious link.","briefOverview":"\u003cp\u003eCybersecurity researchers found nearly 7,600 malicious GitHub repositories in an ongoing campaign called FakeGit, with more than 800 posing as AI Skills or Model Context Protocol servers. The repositories use copied projects, lookalike developer profiles, convincing README files, and malicious ZIP files to deliver SmartLoader malware. SmartLoader is used to establish persistence and push secondary payloads, including the StealC information stealer.\u003c/p\u003e\n\n\u003cp\u003eIsland described an AI-focused evolution called AgentBaiting, where an AI agent searching for a Skill or MCP server can independently discover a bogus GitHub repository and pass the attacker’s instructions to the user. The company said its tests found Anthropic Claude Code, Google Gemini, and OpenAI ChatGPT susceptible to surfacing malicious campaign repositories without being shown a link. The article says this turns routine AI-assisted discovery into a possible path toward malicious code execution.\u003c/p\u003e\n\n\u003cp\u003eThe malicious repositories either were fabricated or copied from legitimate projects and led users to ZIP archives that triggered a LuaJIT loader chain, an obfuscated Lua script, SmartLoader, and then StealC. As of July 2026, FakeGit had recorded more than 14 million downloads across GitHub Release assets in about 200 campaign repositories, and more than 600 campaign listings had been flagged across public MCP and Skill registries. The article recommends reviewed catalogs of Skills, MCP servers, and agent plugins, sandbox testing before rollout, publisher and project verification, and monitoring of agentic pathways.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found nearly 7,600 malicious GitHub repositories in the FakeGit campaign, with more than 800 posing as AI skills or Model Context Protocol servers to deliver SmartLoader malware.","FakeGit uses copied projects, lookalike developer profiles, convincing README files, and malicious ZIP files to deliver SmartLoader, which can establish persistence and push secondary payloads such as the StealC information stealer.","Island said FakeGit has an AI-powered evolution called AgentBaiting, where an AI agent searching for a skill or MCP server can discover a bogus GitHub repository and pass the attacker’s instructions to a user.","Island’s tests found Anthropic Claude Code, Google Gemini, and OpenAI ChatGPT susceptible to surfacing malicious campaign repositories without being shown a link.","As of July 2026, the FakeGit operation had recorded more than 14 million downloads across GitHub Release assets in about 200 campaign repositories."],"insights":["FakeGit’s “AgentBaiting” does not require the attacker to send a malicious link, because an AI agent can independently discover a fake repository during a normal search for a skill or MCP server.","The campaign gained credibility by matching real demand for AI capabilities and familiar enterprise or consumer workflows, giving malicious ZIP downloads a routine-looking reason to exist.","Public MCP and Skill registries can amplify the threat by making malicious listings appear more legitimate, with more than 600 campaign listings flagged across such registries.","The article’s recommended defenses focus on interrupting discovery-to-execution paths, including using a reviewed catalog of Skills, MCP servers, and agent plugins and testing new agent capabilities in a sandbox before rollout."],"referencedReports":[{"title":"AgentBaiting: How 800 Fake AI Skills and MCP Servers Delivered Malware","url":"https://www.island.io/blog/agentbaiting-how-800-fake-ai-skills-and-mcp-servers-delivered-malware","publisher":"Island","context":"The article is based on Island’s report about the FakeGit campaign, SmartLoader delivery, and the AgentBaiting technique.","category":"research","primary":true},{"title":"FakeGit LuaJIT GitHub Campaign","url":"https://www.derp.ca/research/fakegit-luajit-github-campaign/","publisher":"Derp.ca","context":"The article cites Derp.ca as having previously flagged the use of trojanized MCP servers to distribute SmartLoader and StealC.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers found nearly 7,600 malicious GitHub repositories in an ongoing campaign called FakeGit, with more than 800 posing as AI Skills or Model Context Protocol servers. The repositories use copied projects, lookalike developer profiles, convincing README files, and malicious ZIP files to deliver SmartLoader malware. SmartLoader is used to establish persistence and push secondary payloads, including the StealC information stealer.\u003c/p\u003e\n\n\u003cp\u003eIsland described an AI-focused evolution called AgentBaiting, where an AI agent searching for a Skill or MCP server can independently discover a bogus GitHub repository and pass the attacker’s instructions to the user. The company said its tests found Anthropic Claude Code, Google Gemini, and OpenAI ChatGPT susceptible to surfacing malicious campaign repositories without being shown a link. The article says this turns routine AI-assisted discovery into a possible path toward malicious code execution.\u003c/p\u003e\n\n\u003cp\u003eThe malicious repositories either were fabricated or copied from legitimate projects and led users to ZIP archives that triggered a LuaJIT loader chain, an obfuscated Lua script, SmartLoader, and then StealC. As of July 2026, FakeGit had recorded more than 14 million downloads across GitHub Release assets in about 200 campaign repositories, and more than 600 campaign listings had been flagged across public MCP and Skill registries. The article recommends reviewed catalogs of Skills, MCP servers, and agent plugins, sandbox testing before rollout, publisher and project verification, and monitoring of agentic pathways.\u003c/p\u003e\n"},{"n":21,"title":"HollowGraph Malware Hides C2 and Stolen Files in Microsoft 365 Events Dated 2050","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/hollowgraph
