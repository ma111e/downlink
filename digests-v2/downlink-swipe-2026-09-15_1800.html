<script type="application/json" id="dl-articles">[{"n":1,"title":"Acronis warns of actively exploited flaw in its cPanel backup plugin","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/acronis-warns-of-actively-exploited-flaw-in-its-cpanel-backup-plugin/","time":"21:37","priority":"SHOULD READ","score":88,"tldr":"Acronis warns that CVE-2026-87886, a high-severity local privilege-escalation flaw in its cPanel/WHM and Plesk backup integrations, has been exploited in limited targeted attacks. Administrators should immediately update to Acronis Backup plugin for cPanel \u0026 WHM 1.9.3 HF3 or Acronis Backup extension for Plesk 1.8.11.","briefOverview":"\u003cp\u003eAcronis disclosed CVE-2026-87886, a high-severity local privilege-escalation flaw in its backup plugin for cPanel \u0026amp; WHM and its extension for Plesk. The company says exploitation has been detected in limited, targeted attacks against cPanel \u0026amp; WHM deployments, though its assessment is based on one report from a potentially affected customer. A low-privileged attacker could use the flaw to gain greater permissions on a vulnerable Linux server without user interaction.\u003c/p\u003e\n\n\u003cp\u003eThe issue could allow attackers to access or modify sensitive data and disrupt affected systems. Acronis has not published technical details or specific indicators of compromise, saying it wants to give administrators time to patch. The cPanel \u0026amp; WHM plugin is fixed in version 1.9.3 HF3, while the Plesk extension is fixed in version 1.8.11, and affected users are advised to update immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis disclosed CVE-2026-87886, a high-severity local privilege-escalation flaw affecting its backup integrations for cPanel \u0026 WHM and Plesk on Linux servers.","Acronis says it detected exploitation of the flaw in limited, targeted attacks, based on one report from a potentially affected customer.","A low-privileged attacker could use the flaw to gain greater permissions on a vulnerable Linux server, potentially accessing or modifying sensitive data or disrupting the system.","The affected Acronis Backup plugin for cPanel \u0026 WHM versions earlier than 1.9.3.1021 are fixed in version 1.9.3 HF3, while affected Plesk extension versions earlier than 1.8.11.638 are fixed in version 1.8.11.","Acronis has not released technical details or specific indicators of compromise and recommends that affected users apply the available updates immediately."],"insights":["Acronis’s statement that exploitation assessment is based on a single report from a “potentially affected” customer means the reported in-the-wild activity is limited in both scope and evidentiary detail.","Because Acronis has published no specific indicators of compromise and is withholding technical details, affected organizations cannot rely on publicly described detection clues and should prioritize applying the available updates.","The flaw requires an attacker to already have low-level access to a vulnerable Linux server, but it can then increase that access enough to potentially view or alter sensitive data or disrupt the system."],"referencedReports":[{"title":"UPD-2609-3d72-20a7","url":"https://security-advisory.acronis.com/updates/UPD-2609-3d72-20a7","publisher":"acronis","context":"The article says Acronis initially published the flaw in this brief advisory last weekend.","category":"advisory","primary":true},{"title":"SEC-10986","url":"https://security-advisory.acronis.com/advisories/SEC-10986","publisher":"acronis","context":"The article cites this Acronis advisory for its warning that exploitation was detected in limited, targeted attacks.","category":"advisory","primary":true}],"body":"\u003cp\u003eAcronis disclosed CVE-2026-87886, a high-severity local privilege-escalation flaw in its backup plugin for cPanel \u0026amp; WHM and its extension for Plesk. The company says exploitation has been detected in limited, targeted attacks against cPanel \u0026amp; WHM deployments, though its assessment is based on one report from a potentially affected customer. A low-privileged attacker could use the flaw to gain greater permissions on a vulnerable Linux server without user interaction.\u003c/p\u003e\n\n\u003cp\u003eThe issue could allow attackers to access or modify sensitive data and disrupt affected systems. Acronis has not published technical details or specific indicators of compromise, saying it wants to give administrators time to patch. The cPanel \u0026amp; WHM plugin is fixed in version 1.9.3 HF3, while the Plesk extension is fixed in version 1.8.11, and affected users are advised to update immediately.\u003c/p\u003e\n"},{"n":2,"title":"Malcious Admin Menu Editor Pro plugin backdoors 1,500 WordPress sites","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malcious-admin-menu-editor-pro-plugin-backdoors-1-500-wordpress-sites/","time":"20:34","priority":"SHOULD READ","score":85,"tldr":"A compromise of the Admin Menu Editor Pro update server distributed trojanized versions 2.35 and 2.36, installing web shells and hidden WordPress users on potentially more than 1,500 sites. Customers should restore from a known-safe backup or remove the malicious plugin files, object-cache directory, and associated database entries.","briefOverview":"\u003cp\u003eAn unauthorized party compromised the adminmenueditor.com website and distributed malicious updates for Admin Menu Editor Pro, a premium WordPress plugin. Versions 2.35 and 2.36 contained an added file, \u003ccode\u003eincludes/wp-user-consent.php\u003c/code\u003e, that installed a web shell and created a hidden user account on affected sites. The initial malicious version 2.35 was available from approximately 06:00 to 13:00 UTC before developer Janis Elsts removed it and released version 2.36. However, the attacker still had access to the website and also compromised that replacement version.\u003c/p\u003e\n\n\u003cp\u003eAt least 230 customers installed the first malicious update on at least 1,500 sites, and the total may be larger because several hundred additional customers downloaded the plugin near the relevant time window. The developer believes the attacker likely had root-level server access and took the website offline while restoring it safely. Customers using versions 2.35 or 2.36 should check for the added PHP file, a \u003ccode\u003e/wp-content/object-cache/\u003c/code\u003e directory, hidden database users beginning with \u003ccode\u003ewp_\u003c/code\u003e, and \u003ccode\u003ewp_ocache*\u003c/code\u003e database options. Restoring from a safe backup made before September 14 is the recommended fix; version 2.34 and the free Admin Menu Editor plugin are believed to be unaffected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An unauthorized party compromised adminmenueditor.com and distributed malicious Admin Menu Editor Pro versions 2.35 and 2.36.","The malicious updates included a file that installed a web shell and created a hidden WordPress user account on affected sites.","The developer estimates that at least 230 customers installed the initial malicious update across at least 1,500 sites, while the total may be higher because version 2.36 was also compromised.","The developer took the website offline after concluding that the attacker likely had root-level server access.","Users of versions 2.35 and 2.36 are advised to restore from a safe backup made before September 14 or remove the plugin, object-cache directory, and identified database entries."],"insights":["The incident shows how a compromise of a software supplier can affect many separate websites at once: approximately 230 customers installed the initial malicious update on at least 1,500 sites.","Installing the developer’s first clean replacement was not necessarily safe because the attacker still had access and also compromised version 2.36.","The malicious account may not appear in the normal WordPress dashboard, so affected site owners need to check the underlying user database for accounts beginning with \"wp_\".","A safe backup from before September 14 is described as the most reliable recovery method, indicating that removing the plugin alone may not fully undo the changes.","The free Admin Menu Editor plugin and version 2.34 are believed to be unaffected, narrowing the concern to Pro versions 2.35 and 2.36."],"referencedReports":[{"title":"Security incident affecting customers","url":"https://adminmenueditor.com/blog/security-incident-affecting-customers-2026-09-14/","publisher":"admin-menu-editor","context":"The developer published this incident page with compromise indicators and recovery recommendations for affected customers.","category":"advisory","primary":true}],"body":"\u003cp\u003eAn unauthorized party compromised the adminmenueditor.com website and distributed malicious updates for Admin Menu Editor Pro, a premium WordPress plugin. Versions 2.35 and 2.36 contained an added file, \u003ccode\u003eincludes/wp-user-consent.php\u003c/code\u003e, that installed a web shell and created a hidden user account on affected sites. The initial malicious version 2.35 was available from approximately 06:00 to 13:00 UTC before developer Janis Elsts removed it and released version 2.36. However, the attacker still had access to the website and also compromised that replacement version.\u003c/p\u003e\n\n\u003cp\u003eAt least 230 customers installed the first malicious update on at least 1,500 sites, and the total may be larger because several hundred additional customers downloaded the plugin near the relevant time window. The developer believes the attacker likely had root-level server access and took the website offline while restoring it safely. Customers using versions 2.35 or 2.36 should check for the added PHP file, a \u003ccode\u003e/wp-content/object-cache/\u003c/code\u003e directory, hidden database users beginning with \u003ccode\u003ewp_\u003c/code\u003e, and \u003ccode\u003ewp_ocache*\u003c/code\u003e database options. Restoring from a safe backup made before September 14 is the recommended fix; version 2.34 and the free Admin Menu Editor plugin are believed to be unaffected.\u003c/p\u003e\n"},{"n":5,"title":"Oracle September 2026 Critical Security Patch Update addresses 672 CVEs","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/oracle-september-2026-critical-security-patch-update-addresses-672-cves","time":"21:00","priority":"SHOULD READ","score":85,"tldr":"Oracle’s September 2026 Critical Security Patch Update delivers 673 patches for 672 CVEs across 17 product families, including 104 critical-severity issues. Oracle E-Business Suite and Fusion Middleware received the largest share of fixes.","briefOverview":"\u003cp\u003eOracle released its September 2026 Critical Security Patch Update on September 15, providing 673 security updates for 672 unique CVEs across 17 Oracle product families. The update includes 104 critical-severity patches, 503 high-severity patches, 59 medium-severity patches, and 7 low-severity patches. Critical patches account for 15.5% of the updates, while high-severity patches account for 74.7%.\u003c/p\u003e\n\n\u003cp\u003eOracle E-Business Suite received the most patches, with 159, followed by Oracle Fusion Middleware with 153. The article identifies 78 Fusion Middleware patches and 50 Hyperion patches for issues that can be exploited over a network without authentication; E-Business Suite has 19 such patches. Oracle introduced monthly Critical Security Patch Updates in May 2026 as a faster release cycle between its larger quarterly Critical Patch Updates, and patch details are available through Oracle’s September 2026 advisory and risk matrices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Oracle released its September 2026 Critical Security Patch Update on September 15, containing 673 security updates for 672 unique CVEs across 17 product families.","The update includes 104 critical-severity patches, 503 high-severity patches, 59 medium-severity patches, and 7 low-severity patches.","Oracle E-Business Suite received 159 patches, the most of any product family, followed by Oracle Fusion Middleware with 153 patches.","The article reports that 19 Oracle E-Business Suite patches and 78 Oracle Fusion Middleware patches address issues that can be exploited remotely without authentication.","Oracle provides patch details in its September 2026 advisory and risk matrices."],"insights":["Oracle Fusion Middleware has the highest number of patches for issues exploitable remotely without authentication, with 78 such patches, despite Oracle E-Business Suite receiving the most patches overall.","Oracle Hyperion has 50 patches for issues exploitable remotely without authentication out of 102 total patches, making these remotely reachable issues a substantial portion of its update count.","Oracle introduced monthly Critical Security Patch Updates in May 2026 to address a focused set of high-severity issues between its larger quarterly update cycles.","High-severity patches make up nearly three-quarters of the update, with 503 of 673 patches classified as high severity."],"referencedReports":[{"title":"Oracle Critical Security Patch Update Advisory - September 2026","url":"https://www.oracle.com/security-alerts/cspusep2026.html","publisher":"oracle","context":"The article identifies this Oracle advisory as the source for the September 2026 Critical Security Patch Update and patch details.","category":"advisory","primary":true},{"title":"Oracle September 2026 Critical Security Patch Update Risk Matrices","url":"https://www.oracle.com/security-alerts/cspusep2026verbose.html","publisher":"oracle","context":"The article links Oracle’s risk matrices for further details on the September 2026 update.","category":"advisory","primary":true}],"body":"\u003cp\u003eOracle released its September 2026 Critical Security Patch Update on September 15, providing 673 security updates for 672 unique CVEs across 17 Oracle product families. The update includes 104 critical-severity patches, 503 high-severity patches, 59 medium-severity patches, and 7 low-severity patches. Critical patches account for 15.5% of the updates, while high-severity patches account for 74.7%.\u003c/p\u003e\n\n\u003cp\u003eOracle E-Business Suite received the most patches, with 159, followed by Oracle Fusion Middleware with 153. The article identifies 78 Fusion Middleware patches and 50 Hyperion patches for issues that can be exploited over a network without authentication; E-Business Suite has 19 such patches. Oracle introduced monthly Critical Security Patch Updates in May 2026 as a faster release cycle between its larger quarterly Critical Patch Updates, and patch details are available through Oracle’s September 2026 advisory and risk matrices.\u003c/p\u003e\n"},{"n":4,"title":"KREMLIN Banking Malware Hijacks Chrome and Edge to Steal Credentials and Session Tokens","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/kremlin-banking-malware-hijacks-chrome.html","time":"18:54","priority":"SHOULD READ","score":84,"tldr":"Elastic researchers uncovered KREMLIN, a Brazilian banking-malware operation that installs malicious Chrome and Edge extensions to steal credentials, session tokens, cookies, and browser data. The campaign uses multi-stage loaders, SentinelOne DLL sideloading, Chromium preference-integrity bypasses, and Ethereum smart contracts to rotate its command-and-control infrastructure.","briefOverview":"\u003cp\u003eElastic Security Labs has identified a Brazilian banking-malware operation, tracked as REF9334, that delivers a toolkit called KREMLIN. Active since at least May 2025, the operation uses lures impersonating Brazilian banks, invoices, or companies to persuade victims to run a JavaScript file. The malware ultimately installs a malicious browser extension in Google Chrome or Microsoft Edge to steal credentials, session tokens, cookies, browser storage, screenshots, and web-page content.\u003c/p\u003e\n\n\u003cp\u003eKREMLIN uses multi-stage JavaScript loaders, a custom C++ installer, and a legitimate SentinelOne binary to sideload an unsigned DLL disguised as SentinelAgentCore.dll. It bypasses Chromium extension-integrity protections by modifying Secure Preferences, enabling developer mode, and adding forged metadata, while Ethereum smart contracts provide changing locations for payloads and command-and-control servers. Elastic registered the malware\u0026rsquo;s network-canary domain and observed 1,515 infected systems attempting to contact it, with more than 98% geolocated in Brazil; this action temporarily degraded the campaign\u0026rsquo;s anti-sandbox defense and may give defenders more time to identify affected endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs identified a Brazilian banking-malware operation tracked as REF9334 that has been active since at least May 2025 and delivers a toolkit called KREMLIN.","KREMLIN uses document-themed JavaScript files to launch multi-stage loaders, then installs a malicious Chrome or Edge extension named “AVSync System Inc.” that steals credentials, session tokens, cookies, browser storage, screenshots, and page contents.","The operation uses Ethereum smart contracts to retrieve changing command-and-control and payload-hosting locations, complicating efforts to disrupt its infrastructure.","KREMLIN bypasses Chromium extension protections by modifying Secure Preferences, enabling developer mode, and generating forged metadata to register its malicious extension.","Elastic registered KREMLIN’s network-canary domain and observed 1,515 infected systems checking it, with more than 98% geolocated in Brazil."],"insights":["KREMLIN uses an Ethereum smart contract as a resilient lookup mechanism for payload and command-server locations, allowing its operators to change infrastructure without embedding fixed addresses in the malware.","The malware’s anti-analysis network check created an unexpected defensive opportunity: after Elastic registered the unregistered canary domain, infected systems contacting it could be identified, and the campaign’s defense mechanism was temporarily degraded.","The malicious extension is only downloaded when it is absent or its locally installed version differs from the version reported by the operator-controlled server, reducing unnecessary downloads.","Although the extension attempts to collect up to 1,000 browser-history entries from the prior 15 days, researchers noted that this likely fails because its manifest does not request browser-history permission."],"referencedReports":[{"title":"Malicious Browser Extension KREMLIN Banking Malware","url":"https://www.elastic.co/security-labs/threat-command/malicious-browser-extension-kremlin-banking-malware","publisher":"elastic-security-labs","context":"The article relies on this Elastic Security Labs technical report for its analysis of the REF9334 KREMLIN operation.","category":"research","primary":true},{"title":"The Phantom Extension: Backdooring Chrome Through Uncharted Pathways","url":"https://www.synacktiv.com/en/publications/the-phantom-extension-backdooring-chrome-through-uncharted-pathways","publisher":"synacktiv","context":"The article cites this publication as documentation of the Phantom Extension technique used to bypass Chromium extension-integrity protections.","category":"research","primary":false}],"body":"\u003cp\u003eElastic Security Labs has identified a Brazilian banking-malware operation, tracked as REF9334, that delivers a toolkit called KREMLIN. Active since at least May 2025, the operation uses lures impersonating Brazilian banks, invoices, or companies to persuade victims to run a JavaScript file. The malware ultimately installs a malicious browser extension in Google Chrome or Microsoft Edge to steal credentials, session tokens, cookies, browser storage, screenshots, and web-page content.\u003c/p\u003e\n\n\u003cp\u003eKREMLIN uses multi-stage JavaScript loaders, a custom C++ installer, and a legitimate SentinelOne binary to sideload an unsigned DLL disguised as SentinelAgentCore.dll. It bypasses Chromium extension-integrity protections by modifying Secure Preferences, enabling developer mode, and adding forged metadata, while Ethereum smart contracts provide changing locations for payloads and command-and-control servers. Elastic registered the malware\u0026rsquo;s network-canary domain and observed 1,515 infected systems attempting to contact it, with more than 98% geolocated in Brazil; this action temporarily degraded the campaign\u0026rsquo;s anti-sandbox defense and may give defenders more time to identify affected endpoints.\u003c/p\u003e\n"},{"n":6,"title":"Silent Push Tracks a Mass Phishing Operation Through Fast Flux","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/fast-flux-phishing/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=fast-flux-phishing","time":"18:55","priority":"SHOULD READ","score":82,"tldr":"Silent Push identified a large phishing ecosystem using fast-flux DNS services to rapidly rotate IP infrastructure and evade takedowns, including campaigns impersonating Canadian banks and international financial brands. The operators combine DNS rotation with traffic cloaking, per-victim URLs, live credential theft, callback scams, and gated malware downloads to defeat automated scanning.","briefOverview":"\u003cp\u003eSilent Push reported identifying thousands of live phishing domains using fast-flux infrastructure, in which domains rapidly rotate across many IP addresses, networks, and countries to make IP-based blocking difficult. The company said it purchased access to a fast-flux service to study its customer setup and develop detection analytics based on the DNS delegation layer used by customers. Its platform query combined nameserver, ASN, and IP-diversity indicators to find domains associated with the service.\u003c/p\u003e\n\n\u003cp\u003eOne cluster targeted nearly 2,000 domains, with roughly 90% impersonating Canadian organizations including banks, the tax authority, Canada Post, and provincial benefit programs. These sites used Keitaro traffic-distribution cloaking, single-use victim URLs, device profiling, and 404 responses for many scanners, researchers, and foreign visitors, while operators could collect keystrokes and direct victims through additional phishing steps. A second cluster used fake fraud hotlines and cloned login forms, then offered a Windows executable in a password-protected ZIP only after a live agent supplied a one-time code, limiting exposure to automated scanning.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the provider-controlled DNS delegation layer offers a detection opportunity even as underlying IP addresses change. It recommends DNS-level monitoring for high IP and ASN diversity, low DNS time-to-live values, and inconsistent IP geolocation, as well as blocking confirmed malicious domains, IPs, and infrastructure tied to bulletproof or abuse-tolerant networks. Silent Push also cites a joint CISA advisory that calls fast flux a national-security threat and encourages accurate, reliable, and timely detection and blocking capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push reported that it purchased a fast-flux service to observe its operation and used the resulting detection approach to identify thousands of live phishing domains.","The identified infrastructure rapidly rotates a domain across IP addresses and networks, which makes IP-address blocking less effective.","One phishing cluster targeted nearly 2,000 domains, with roughly nine in ten impersonating Canadian organizations such as major banks, the tax authority, Canada Post, and provincial benefit programs.","The Canadian banking campaign used Keitaro traffic distribution software to filter visitors, showing phishing pages to selected Canadian residential users while many other visitors received a 404 page.","A second cluster combined fake fraud hotlines, cloned login forms, live chat, and one-time-code-gated downloads of a Windows executable presented as a security verification tool."],"insights":["The provider-controlled DNS delegation layer is a durable detection point because fast-flux providers keep their own domains separate from customer infrastructure while customers delegate domains to provider-controlled nameservers.","The Canadian phishing operation used commercial traffic-distribution cloaking to show most outside scanners a 404 page, while selected Canadian residential visitors received single-use phishing URLs.","The phishing kits were operator-driven rather than static: operators could receive victim keystrokes before form submission, direct victims through additional pages, and test stolen credentials against real banks in parallel.","The callback operation withheld its malicious Windows download until a live agent issued a one-time code, and delivered it in a password-protected ZIP to reduce exposure to email and web scanning.","Fast-flux services were marketed as subscription products with customer portals, support systems, anonymous registration, and cryptocurrency payments, lowering the barrier for phishing operators to use rapidly changing infrastructure."],"referencedReports":[{"title":"Know Your Enemy: Fast-Flux Service Networks","url":"https://honeynet.onofri.org/papers/ff/fast-flux.pdf","publisher":"the-honeynet-project","context":"The article cites The Honeynet Project's 2007 documentation of the fast-flux technique as background on its origins.","category":"research","primary":false},{"title":"Fast Flux: A National Security Threat","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-093a","publisher":"cisa","context":"The article references CISA's joint April 2025 advisory, which recommends that providers develop timely fast-flux detection and blocking capabilities.","category":"advisory","primary":false}],"body":"\u003cp\u003eSilent Push reported identifying thousands of live phishing domains using fast-flux infrastructure, in which domains rapidly rotate across many IP addresses, networks, and countries to make IP-based blocking difficult. The company said it purchased access to a fast-flux service to study its customer setup and develop detection analytics based on the DNS delegation layer used by customers. Its platform query combined nameserver, ASN, and IP-diversity indicators to find domains associated with the service.\u003c/p\u003e\n\n\u003cp\u003eOne cluster targeted nearly 2,000 domains, with roughly 90% impersonating Canadian organizations including banks, the tax authority, Canada Post, and provincial benefit programs. These sites used Keitaro traffic-distribution cloaking, single-use victim URLs, device profiling, and 404 responses for many scanners, researchers, and foreign visitors, while operators could collect keystrokes and direct victims through additional phishing steps. A second cluster used fake fraud hotlines and cloned login forms, then offered a Windows executable in a password-protected ZIP only after a live agent supplied a one-time code, limiting exposure to automated scanning.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the provider-controlled DNS delegation layer offers a detection opportunity even as underlying IP addresses change. It recommends DNS-level monitoring for high IP and ASN diversity, low DNS time-to-live values, and inconsistent IP geolocation, as well as blocking confirmed malicious domains, IPs, and infrastructure tied to bulletproof or abuse-tolerant networks. Silent Push also cites a joint CISA advisory that calls fast flux a national-security threat and encourages accurate, reliable, and timely detection and blocking capabilities.\u003c/p\u003e\n"},{"n":3,"title":"Norway announces investigations into telecom Telenor’s work with Myanmar junta","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/norway-investigations-telenor-telecom-myanmar-regime","time":"20:01","priority":"SHOULD READ","score":78,"tldr":"Norwegian authorities are investigating Telenor over allegations that it enabled Myanmar junta repression by providing customer traffic data after the 2021 coup and by selling sanctioned surveillance equipment without authorization during its Myanmar exit.","briefOverview":"\u003cp\u003eNorway’s National Criminal Investigation Service is investigating whether Telenor was complicit in crimes against humanity by repeatedly giving Myanmar’s military regime customers’ historical traffic data between the February 2021 coup and the March 2022 sale of its Myanmar subsidiary. Norway’s Police Security Service is separately investigating possible sanctions violations related to the sale of surveillance equipment without approval from the Ministry of Foreign Affairs. Norwegian law enforcement raided Telenor’s Oslo headquarters as part of the investigations.\u003c/p\u003e\n\n\u003cp\u003eTelenor said its employees faced possible imprisonment, torture, or the death penalty if they did not comply with military orders, and said it had already provided documents and information to authorities. The company sold its Myanmar business to M1 Group, which later sold 80% of the operation to Shwe Byain Phyu, a company run by allies of the military government. Activists warned that the transaction could have transferred historical data for more than 18 million people and enabled the military to use that information and surveillance tools to identify, arrest, torture, or kill activists, journalists, and other civilians.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Norway’s National Criminal Investigation Service is investigating whether Telenor was complicit in crimes against humanity by repeatedly providing Myanmar’s military regime with customers’ historical traffic data between the February 1, 2021 coup and the March 25, 2022 sale of its subsidiary.","Norway’s Police Security Service is investigating whether Telenor violated sanctions because its sale of the Myanmar subsidiary included sanctioned surveillance equipment without permission from Norway’s Ministry of Foreign Affairs.","Norwegian law enforcement raided Telenor’s Oslo headquarters, while Telenor said its employees risked imprisonment, torture, or the death penalty if they did not comply with military orders.","Telenor sold its Myanmar business to Lebanon’s M1 Group in 2022, after which M1 sold 80% of the operation to Shwe Byain Phyu, a company run by allies of Myanmar’s military government.","Human rights groups and a Swedish nonprofit have brought legal cases alleging that Telenor-shared data was used by Myanmar’s junta to locate, detain, torture, and in at least one alleged case execute people."],"insights":["The case involves two separate legal tracks: one examines whether customer-data disclosures aided crimes against humanity, while the other examines whether the subsidiary sale transferred sanctioned surveillance equipment without required approval.","Telenor’s stated justification for complying with military orders was the immediate danger to its employees, illustrating that the company says it weighed staff safety against demands for customer data.","The ownership chain meant that selling the Myanmar operation did not necessarily remove the military’s access to sensitive information: M1 Group later sold 80% of the business to Shwe Byain Phyu, whose leaders were allied with the military government.","Activists’ concern extended beyond historical records of more than 18 million people, warning that control of the telecom operation could also enable expanded access to calls, text messages, and other personal data through surveillance tools."],"referencedReports":[{"title":"Number of Journalists Behind Bars Reaches Global High","url":"https://cpj.org/reports/2021/12/number-of-journalists-behind-bars-reaches-global-high/","publisher":"committee-to-protect-journalists","context":"The article cites this Committee to Protect Journalists report while describing the Myanmar military regime's arrests and killings following the 2021 coup.","category":"research","primary":false}],"body":"\u003cp\u003eNorway’s National Criminal Investigation Service is investigating whether Telenor was complicit in crimes against humanity by repeatedly giving Myanmar’s military regime customers’ historical traffic data between the February 2021 coup and the March 2022 sale of its Myanmar subsidiary. Norway’s Police Security Service is separately investigating possible sanctions violations related to the sale of surveillance equipment without approval from the Ministry of Foreign Affairs. Norwegian law enforcement raided Telenor’s Oslo headquarters as part of the investigations.\u003c/p\u003e\n\n\u003cp\u003eTelenor said its employees faced possible imprisonment, torture, or the death penalty if they did not comply with military orders, and said it had already provided documents and information to authorities. The company sold its Myanmar business to M1 Group, which later sold 80% of the operation to Shwe Byain Phyu, a company run by allies of the military government. Activists warned that the transaction could have transferred historical data for more than 18 million people and enabled the military to use that information and surveillance tools to identify, arrest, torture, or kill activists, journalists, and other civilians.\u003c/p\u003e\n"},{"n":7,"title":"Mythic C2 Activity at Internet Scale","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/mythic-c2/","time":"19:16","priority":"MAY READ","score":70,"tldr":"Censys identified 131 internet-exposed Mythic C2 hosts, most recognizable through default TLS certificates and port 7443 behavior. While some deployments appear to be labs, others show sophisticated operational infrastructure, making these fingerprints useful for proactive network and host-based detection.","briefOverview":"\u003cp\u003eMythic is an open-source, plugin-based command-and-control framework used for authorized red-team work and also observed in unauthorized intrusions. As of September 11, 2026, Censys tracked 131 unique internet-exposed Mythic hosts across 307 service hits. Most of these hosts could be identified through default deployment fingerprints, including self-signed certificates with \u003ccode\u003eO=Mythic\u003c/code\u003e or \u003ccode\u003eO=Mythic C2\u003c/code\u003e, which appeared on 115 hosts.\u003c/p\u003e\n\n\u003cp\u003ePort 7443 appeared on 99 tracked hosts, and Mythic\u0026rsquo;s default Nginx reverse proxy returns HTTP 502 responses to unauthenticated requests on that port. Ten hosts also exposed other command-and-control frameworks, including Sliver, Adaptix C2, Havoc, and FRP; the article distinguishes an apparent multi-tool lab cluster from a separate cluster that used custom domains, custom payload development, Discord-related scripts, and Mythic tasking scripts. Censys recommends using certificate names, the default \u003ccode\u003eCN=operators\u003c/code\u003e to \u003ccode\u003eCN=multiplayer\u003c/code\u003e certificate chain, port 7443 activity, and unexpected Mythic Docker container names to detect potential Mythic infrastructure or internal systems communicating with it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mythic is an open-source, plugin-based command-and-control framework used in authorized security testing and observed in unauthorized intrusions.","As of September 11, 2026, Censys tracked 131 unique publicly exposed hosts matching Mythic detections, with 115 presenting certificates whose subject organization was \"Mythic\" or \"Mythic C2.\"","Port 7443 appeared on 99 tracked hosts, and Mythic's default Nginx reverse proxy returns an HTTP 502 response to unauthenticated requests on that port.","Ten of the 131 tracked hosts also exposed at least one additional command-and-control framework, including Sliver, Adaptix C2, Havoc, or FRP.","Censys recommends that defenders monitor for Mythic default certificate names, the CN=operators to CN=multiplayer certificate chain, and unexpected Mythic Docker container names."],"insights":["Default Mythic certificate subject organizations, \"Mythic\" and \"Mythic C2,\" covered 115 of 131 tracked hosts, giving defenders a high-coverage way to identify many exposed deployments.","A shared nine-port fingerprint, identical self-signed certificate, generic reverse DNS, and multiple C2 frameworks across three hosts led the article to assess that cluster as a shared lab or training fleet rather than an operational deployment.","The article shows that a Mythic-only footprint can still support substantial custom tooling: one four-host cluster included eleven sequential Windows payload builds, Rust source code, Discord transport diagnostics, steganography scripts, and Mythic tasking scripts.","Only 6 tracked hosts retained Mythic’s unchanged internal certificate chain from \"CN=operators\" to \"CN=multiplayer,\" making that combination a narrower but especially specific default-installation indicator.","Port-based counts should be interpreted carefully because the article’s port aggregation includes every open port on matched hosts, rather than proving that each port is a Mythic listener."],"referencedReports":[],"body":"\u003cp\u003eMythic is an open-source, plugin-based command-and-control framework used for authorized red-team work and also observed in unauthorized intrusions. As of September 11, 2026, Censys tracked 131 unique internet-exposed Mythic hosts across 307 service hits. Most of these hosts could be identified through default deployment fingerprints, including self-signed certificates with \u003ccode\u003eO=Mythic\u003c/code\u003e or \u003ccode\u003eO=Mythic C2\u003c/code\u003e, which appeared on 115 hosts.\u003c/p\u003e\n\n\u003cp\u003ePort 7443 appeared on 99 tracked hosts, and Mythic\u0026rsquo;s default Nginx reverse proxy returns HTTP 502 responses to unauthenticated requests on that port. Ten hosts also exposed other command-and-control frameworks, including Sliver, Adaptix C2, Havoc, and FRP; the article distinguishes an apparent multi-tool lab cluster from a separate cluster that used custom domains, custom payload development, Discord-related scripts, and Mythic tasking scripts. Censys recommends using certificate names, the default \u003ccode\u003eCN=operators\u003c/code\u003e to \u003ccode\u003eCN=multiplayer\u003c/code\u003e certificate chain, port 7443 activity, and unexpected Mythic Docker container names to detect potential Mythic infrastructure or internal systems communicating with it.\u003c/p\u003e\n"}]</script>
