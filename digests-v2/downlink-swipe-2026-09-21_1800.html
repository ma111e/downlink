<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA alerts of active exploitation of three Linux kernel flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-alerts-of-active-exploitation-of-three-linux-kernel-flaws/","time":"20:12","priority":"MUST READ","score":96,"tldr":"CISA says three Linux kernel vulnerabilities, including critical CVE-2025-39964, are being actively exploited and has ordered U.S. federal agencies to patch affected systems and perform forensic triage immediately.","briefOverview":"\u003cp\u003eCISA warned that attackers are actively exploiting three Linux kernel vulnerabilities: CVE-2025-39964, CVE-2026-53266, and CVE-2025-39682. The flaws range from medium to critical severity, and CVE-2025-39964 had existed in the kernel for 14 years. CISA gave the issues its highest priority for U.S. federal agencies, directing them to apply available updates and mitigations by the end of the day.\u003c/p\u003e\n\n\u003cp\u003eCVE-2025-39964 is a race condition in the AF_ALG cryptographic socket interface that may crash systems or alter cryptographic results, while researchers demonstrated privilege escalation and container escape in Google’s kernelCTF. CVE-2026-53266 is an out-of-bounds write in ebtables SNAT that may modify shared file-backed memory, and CVE-2025-39682 involves mishandling zero-length TLS records when kTLS is used. CISA also required forensic triage for affected assets to identify signs of prior exploitation; public exploits are available for CVE-2025-39682, Red Hat confirmed a known exploit for CVE-2026-53266, and none of the flaws is currently marked as used by ransomware groups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added three Linux kernel vulnerabilities to its Known Exploited Vulnerabilities Catalog after determining they had been exploited in attacks.","The vulnerabilities are CVE-2025-39964, CVE-2026-53266, and CVE-2025-39682, with severity ratings ranging from medium to critical.","CISA gave U.S. federal agencies its highest priority for the flaws, requiring them to apply available updates and mitigations by the end of the day and conduct forensic triage on affected assets.","Public exploits are available for CVE-2025-39682, and Red Hat has also confirmed a known exploit for CVE-2026-53266."],"insights":["CVE-2025-39964 had remained in the Linux kernel for 14 years before being identified, and researchers demonstrated privilege escalation and container escape using it in Google’s kernelCTF.","CISA’s “forensic triage” designation requires federal agencies to examine every affected asset for evidence that exploitation may already have occurred, rather than only applying patches.","Although Red Hat confirmed a known exploit for CVE-2026-53266, the researcher’s proposed privilege-escalation chain has not been demonstrated with public exploit code.","None of the three Linux kernel flaws is currently marked as exploited by ransomware groups."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/18/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA’s alert states that two of the Linux kernel vulnerabilities were added to the Known Exploited Vulnerabilities Catalog after exploitation in attacks.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/18/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"CISA’s alert covers the separate addition of another actively exploited Linux kernel vulnerability to its catalog.","category":"advisory","primary":true},{"title":"CVE-2025-39682 Security Bulletin","url":"https://access.redhat.com/security/cve/cve-2025-39682","publisher":"red-hat","context":"The article cites Red Hat’s security bulletin as confirming that public exploits are available for CVE-2025-39682.","category":"advisory","primary":false},{"title":"CVE-2026-53266 Security Bulletin","url":"http://access.redhat.com/security/cve/cve-2026-53266","publisher":"red-hat","context":"The article cites Red Hat’s CVE bulletin as confirming a known exploit for CVE-2026-53266.","category":"advisory","primary":false},{"title":"CVE-2026-53266 Patch-Status Tracker","url":"https://github.com/suominen/CVE-2026-53266","publisher":"kimmo-suominen","context":"The article describes this GitHub resource as a technical analysis and patch-status tracker outlining a potential privilege-escalation path.","category":"research","primary":false}],"body":"\u003cp\u003eCISA warned that attackers are actively exploiting three Linux kernel vulnerabilities: CVE-2025-39964, CVE-2026-53266, and CVE-2025-39682. The flaws range from medium to critical severity, and CVE-2025-39964 had existed in the kernel for 14 years. CISA gave the issues its highest priority for U.S. federal agencies, directing them to apply available updates and mitigations by the end of the day.\u003c/p\u003e\n\n\u003cp\u003eCVE-2025-39964 is a race condition in the AF_ALG cryptographic socket interface that may crash systems or alter cryptographic results, while researchers demonstrated privilege escalation and container escape in Google’s kernelCTF. CVE-2026-53266 is an out-of-bounds write in ebtables SNAT that may modify shared file-backed memory, and CVE-2025-39682 involves mishandling zero-length TLS records when kTLS is used. CISA also required forensic triage for affected assets to identify signs of prior exploitation; public exploits are available for CVE-2025-39682, Red Hat confirmed a known exploit for CVE-2026-53266, and none of the flaws is currently marked as used by ransomware groups.\u003c/p\u003e\n"},{"n":3,"title":"WordPress Click2Shell flaw lets hackers execute PHP on the server","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/wordpress-click2shell-flaw-lets-hackers-execute-php-on-the-server/","time":"18:23","priority":"SHOULD READ","score":88,"tldr":"WordPress fixed the Click2Shell CSRF flaw in version 7.1.1, which could let an attacker trick a logged-in administrator into installing a vulnerable theme and executing arbitrary PHP on the server. Administrators should update immediately, as technical details and a proof-of-concept exploit are public.","briefOverview":"\u003cp\u003eWordPress released version 7.1.1 to fix Click2Shell, a cross-site request forgery flaw in WordPress Core 7.1.0 and earlier. Security researcher Paulos Yibelo of pwn.ai reported the issue to WordPress on August 22 and later published technical details and a proof-of-concept exploit. The flaw has no official identifier.\u003c/p\u003e\n\n\u003cp\u003eClick2Shell can let an attacker without a WordPress account, installation nonce, or administrator privileges trick a logged-in administrator into visiting a crafted link that force-installs a theme from the WordPress.org catalog. A flaw involving a theme-preview URL, the WordPress.org Themes API, and JavaScript in the administrator\u0026rsquo;s browser can cause an inactive vulnerable theme to execute arbitrary PHP during a Customizer preview. This could allow file changes or deletion, access to user data and the wp-config.php file, creation of rogue administrator accounts, and injection of malicious scripts; Patchstack says DISALLOW_FILE_MODS can prevent forced theme or plugin installation until an update is applied.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress 7.1.1 fixes the Click2Shell flaw, which affects WordPress Core 7.1.0 and earlier versions.","Click2Shell can allow an unauthenticated attacker to trick a logged-in WordPress administrator into installing a theme from the official WordPress.org catalog.","During a Customizer preview, an inactive vulnerable theme can execute arbitrary PHP code on the server.","Paulos Yibelo of pwn.ai published technical details and a proof-of-concept exploit for the issue.","Patchstack said that enabling DISALLOW_FILE_MODS prevents a website from being forced to install a theme or malicious plugin when an immediate update is not possible."],"insights":["The attack chain does not require the attacker to have a WordPress account, an installation approval token, or administrative access; it only requires a logged-in administrator to open a crafted link.","A theme does not need to be activated for its server-side code to run, because the code can execute during a Customizer preview.","Author and Editor accounts cannot trigger the full chain because they lack permission to install themes, limiting the affected user role to administrators.","Sites with DISALLOW_FILE_MODS enabled cannot be forced to install the theme or a malicious plugin, providing a temporary mitigation for organizations unable to update immediately."],"referencedReports":[{"title":"Click2Shell","url":"http://pwn.ai/blog/click2shell","publisher":"pwn.ai","context":"The article cites Paulos Yibelo's full technical report as providing a complete proof-of-concept exploit for server-side remote code execution.","category":"research","primary":true},{"title":"Click2Shell: The RCE WordPress 7.1.1 Just Patched","url":"http://patchstack.com/articles/click2shell-the-rce-wordpress-7-1-1-just-patched/","publisher":"patchstack","context":"The article references Patchstack's analysis for details on affected administrator permissions, attack paths, and temporary mitigation.","category":"research","primary":false}],"body":"\u003cp\u003eWordPress released version 7.1.1 to fix Click2Shell, a cross-site request forgery flaw in WordPress Core 7.1.0 and earlier. Security researcher Paulos Yibelo of pwn.ai reported the issue to WordPress on August 22 and later published technical details and a proof-of-concept exploit. The flaw has no official identifier.\u003c/p\u003e\n\n\u003cp\u003eClick2Shell can let an attacker without a WordPress account, installation nonce, or administrator privileges trick a logged-in administrator into visiting a crafted link that force-installs a theme from the WordPress.org catalog. A flaw involving a theme-preview URL, the WordPress.org Themes API, and JavaScript in the administrator\u0026rsquo;s browser can cause an inactive vulnerable theme to execute arbitrary PHP during a Customizer preview. This could allow file changes or deletion, access to user data and the wp-config.php file, creation of rogue administrator accounts, and injection of malicious scripts; Patchstack says DISALLOW_FILE_MODS can prevent forced theme or plugin installation until an update is applied.\u003c/p\u003e\n"},{"n":2,"title":"BigCommerce alerts merchants of data breach linked to Ribon apps","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bigcommerce-alerts-merchants-of-data-breach-linked-to-ribon-apps/","time":"21:18","priority":"SHOULD READ","score":80,"tldr":"BigCommerce removed compromised Ribon and Ribon 1.5 third-party apps after attackers used stolen application credentials to inject malicious scripts and access customer data at a small number of merchant stores. Exposed data may include names, emails, phone numbers, and shipping addresses, while payment-card information and BigCommerce’s core platform were reportedly not affected.","briefOverview":"\u003cp\u003eBigCommerce alerted multiple merchants after attackers compromised credentials for the third-party Ribon and Ribon 1.5 applications. The stolen credentials were used to inject malicious scripts into a small number of merchant storefronts and access shopper data in BigCommerce environments between September 13 and September 17. BigCommerce said it confirmed the credential compromise on September 17, 2026, and removed the apps to protect customers. The company stated that its systems and core platform were not breached.\u003c/p\u003e\n\n\u003cp\u003eUK-based spirits seller Master of Malt said affected information included customers’ full names, email addresses, phone numbers, and shipping postal addresses. BigCommerce said account passwords and payment-card information are stored separately and were not exposed. It uninstalled the applications from affected stores to revoke the attacker’s access, directly notified merchants, and supplied logs for the developer’s investigation. The incident may extend beyond Master of Malt, as several retailers are reportedly notifying customers about data exposure tied to the Ribon application key theft.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BigCommerce confirmed on September 17, 2026, that credentials for the third-party Ribon and Ribon 1.5 applications had been compromised and used to inject malicious scripts into a small number of merchant storefronts.","BigCommerce removed the affected applications from impacted stores, notified merchants directly, and provided log data to support the application developer’s investigation.","Master of Malt said attackers accessed shopper information between September 13 and September 17, including full names, email addresses, phone numbers, and shipping postal addresses.","BigCommerce stated that its own systems and platform were not breached and that account passwords and payment-card information were stored separately and were not exposed.","The incident may affect more than Master of Malt, with a law firm reporting that several retailers are notifying customers about data exposure connected to the Ribon application key theft."],"insights":["The attackers did not need to breach BigCommerce’s core platform; compromised credentials for a connected third-party app were sufficient to access customer records in merchant environments.","Removing the affected apps from stores was used to immediately revoke the attackers’ access, illustrating that disconnecting a compromised integration can contain an incident.","Unlike the earlier FreshClick incident involving ZAGG, this case reportedly exposed existing customer records rather than payment details entered during checkout.","Although only Master of Malt is named as an affected merchant, the article indicates that several retailers may be notifying customers and that the impact could extend to hundreds of stores."],"referencedReports":[],"body":"\u003cp\u003eBigCommerce alerted multiple merchants after attackers compromised credentials for the third-party Ribon and Ribon 1.5 applications. The stolen credentials were used to inject malicious scripts into a small number of merchant storefronts and access shopper data in BigCommerce environments between September 13 and September 17. BigCommerce said it confirmed the credential compromise on September 17, 2026, and removed the apps to protect customers. The company stated that its systems and core platform were not breached.\u003c/p\u003e\n\n\u003cp\u003eUK-based spirits seller Master of Malt said affected information included customers’ full names, email addresses, phone numbers, and shipping postal addresses. BigCommerce said account passwords and payment-card information are stored separately and were not exposed. It uninstalled the applications from affected stores to revoke the attacker’s access, directly notified merchants, and supplied logs for the developer’s investigation. The incident may extend beyond Master of Malt, as several retailers are reportedly notifying customers about data exposure tied to the Ribon application key theft.\u003c/p\u003e\n"},{"n":4,"title":"EU data regulator fines Google more than $460 million for location data violations  ","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/google-europe-location-data-fine","time":"19:15","priority":"SHOULD READ","score":78,"tldr":"Ireland’s Data Protection Commission fined Google €403 million ($462 million) for GDPR violations involving the processing and retention of user location data. Google must bring its practices into compliance within six months.","briefOverview":"\u003cp\u003eIreland’s Data Protection Commission (DPC) fined Google more than €403 million ($462 million) following an inquiry into its processing of location data. The DPC, Google’s lead European Union privacy regulator because Google’s European headquarters are in Dublin, ordered the company to correct its processing practices within six months. The investigation began in February 2020 after European consumer-rights groups raised concerns about possible violations of Europe’s General Data Protection Regulation (GDPR).\u003c/p\u003e\n\n\u003cp\u003eThe inquiry examined Google’s handling of location data in its Web \u0026amp; App Activity, Location History, and Location Accuracy features between May 2018 and February 2020. The regulator assessed whether the processing was legal and fair and whether Google met transparency and accountability requirements, including requirements concerning retention of location data. The DPC said location information can reveal highly private details and that users may have been unaware it was used to influence ads or infer interests; retaining it longer than necessary increased users’ loss of control over their personal data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ireland’s Data Protection Commission fined Google more than €403 million ($462 million) over its processing of location data.","The regulator ordered Google to correct its data-processing practices within six months.","The inquiry examined Google’s handling of location data through Web \u0026 App Activity, Location History, and Location Accuracy from May 2018 through February 2020.","The DPC found that Google’s practices violated GDPR requirements concerning lawful and fair processing, transparency, accountability, and the retention of location data.","The regulator said location data can reveal highly private information and that Google’s failures could have left people unaware that their location was used to influence advertising or infer their interests."],"insights":["Although the investigation concerned practices from May 2018 through February 2020, the DPC has given Google six months to change its current processing practices.","The DPC said keeping location data longer than necessary worsened people’s loss of control over their personal information.","This is the first time Ireland’s Data Protection Commission has fined Google, despite the regulator serving as Google’s lead EU privacy authority because its European headquarters are in Dublin."],"referencedReports":[],"body":"\u003cp\u003eIreland’s Data Protection Commission (DPC) fined Google more than €403 million ($462 million) following an inquiry into its processing of location data. The DPC, Google’s lead European Union privacy regulator because Google’s European headquarters are in Dublin, ordered the company to correct its processing practices within six months. The investigation began in February 2020 after European consumer-rights groups raised concerns about possible violations of Europe’s General Data Protection Regulation (GDPR).\u003c/p\u003e\n\n\u003cp\u003eThe inquiry examined Google’s handling of location data in its Web \u0026amp; App Activity, Location History, and Location Accuracy features between May 2018 and February 2020. The regulator assessed whether the processing was legal and fair and whether Google met transparency and accountability requirements, including requirements concerning retention of location data. The DPC said location information can reveal highly private details and that users may have been unaware it was used to influence ads or infer interests; retaining it longer than necessary increased users’ loss of control over their personal data.\u003c/p\u003e\n"},{"n":5,"title":"Healthcare is Under Attack: Make Identity the Perimeter","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/healthcare-is-under-attack-make-identity-the-perimeter/","time":"18:22","priority":"MAY READ","score":25,"tldr":"Health-ISAC promotes a Radiant Logic webinar arguing that healthcare organizations should treat identity as their security perimeter, because weak access controls, excessive privileges, and lateral movement enable ransomware. The session focuses on reducing reliance on EDR and SIEM alone through stronger identity and access management practices.","briefOverview":"\u003cp\u003eHealth-ISAC highlights a Radiant Logic webinar on why healthcare organizations are heavily targeted and why identity should be treated as the security perimeter. The presentation draws on Paul Dant’s real-world red-teaming experience. It states that attackers do not need rare zero-day exploits to gain access.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies weak identity controls, excessive privileges, and attackers moving between systems as drivers of ransomware. It argues that relying too heavily on endpoint detection and response and security information and event management tools leaves a major gap in defense. Readers can watch the recorded first webinar and register for a second session focused on what it takes to address these issues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Healthcare organizations are heavily targeted, according to the article’s discussion of real-world red-teaming experience.","The article says attackers often rely on weak identity controls, excessive privileges, and movement between systems rather than rare zero-day exploits.","It states that ransomware can be enabled by attackers moving through an organization after gaining access.","The article argues that relying too heavily on endpoint detection and response and security information and event management tools leaves a major defensive gap.","Health-ISAC promotes a recorded Radiant Logic webinar and registration for a second webinar session on identity-focused healthcare security."],"insights":["The article’s central recommendation is to treat identity controls—the rules governing who can access systems and what they can do—as the main security boundary for healthcare organizations.","It emphasizes that attackers do not necessarily need rare, previously unknown software flaws to compromise healthcare environments, because weak account controls and overly broad access can be sufficient.","The article highlights a defensive gap in relying primarily on tools that monitor endpoints and security logs, rather than preventing improper access and movement through systems."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC highlights a Radiant Logic webinar on why healthcare organizations are heavily targeted and why identity should be treated as the security perimeter. The presentation draws on Paul Dant’s real-world red-teaming experience. It states that attackers do not need rare zero-day exploits to gain access.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies weak identity controls, excessive privileges, and attackers moving between systems as drivers of ransomware. It argues that relying too heavily on endpoint detection and response and security information and event management tools leaves a major gap in defense. Readers can watch the recorded first webinar and register for a second session focused on what it takes to address these issues.\u003c/p\u003e\n"}]</script>
