<script type="application/json" id="dl-articles">[{"n":5,"title":"Emerging Threat: (CVE-2026-75604) Next.js Remote Code Execution via Windows Path Traversal","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-75604-next-js-remote-code-execution-via-windows-path-traversal/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"A critical Next.js flaw, CVE-2026-75604, can allow unauthenticated remote code execution on self-hosted Windows deployments using affected versions and routing/cache configurations. Organizations should urgently identify Windows-hosted Next.js apps and upgrade to the fixed releases, as there is no reliable workaround.","briefOverview":"\u003cp\u003eCVE-2026-75604 is a critical path traversal flaw in Next.js that can allow an unauthenticated attacker to write files outside the framework’s on-disk cache directory and reach remote code execution on the host. The vulnerability is tracked as CWE-22 and published by Vercel as GHSA-p293-qw3h-jr36. It has a CVSS v3.1 base score of 9.0, with no authentication or user interaction required.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is specific to self-hosted Windows deployments because Windows treats backslashes as directory separators. Percent-encoded backslash sequences can reach the Next.js routing layer without normalization, and under certain routing and caching conditions can steer a filesystem cache write to a chosen location. Affected deployments include Next.js 13.4 up to 15.5.24 and 16.0 up to 16.3.3 when the application uses the Pages Router or the App Router without Cache Components and runs on a Windows filesystem.\u003c/p\u003e\n\n\u003cp\u003eLinux and macOS deployments are not affected, and applications running on Vercel’s managed platform are not affected because that infrastructure runs on Linux. Vercel released fixed versions in Next.js 15.5.24 and 16.3.3, and the article states there is no known workaround for affected Windows-hosted applications. Recommended actions include inventorying Windows-hosted Next.js deployments, confirming pinned framework versions, monitoring cache paths, blocking percent-encoded backslash sequences, and auditing externally reachable incremental static regeneration routes until patching is confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-75604 is a critical path traversal flaw in Next.js that can allow an unauthenticated attacker to write files outside the framework’s cache directory and reach remote code execution on the host.","The vulnerability affects Next.js 13.4 up to 15.5.24 and 16.0 up to 16.3.3 when the application runs on a Windows filesystem and uses the Pages Router or the App Router without Cache Components.","Linux and macOS deployments are not affected, and applications running on Vercel’s managed platform are not affected because that infrastructure runs on Linux.","Vercel released fixed versions in Next.js 15.5.24 and 16.3.3, and the article states there is no known workaround for affected Windows-hosted applications.","The article recommends inventorying Windows-hosted Next.js deployments, confirming pinned Next.js versions, monitoring cache paths, blocking percent-encoded backslash sequences, and auditing externally reachable incremental static regeneration routes until patching is confirmed."],"insights":["The article frames the exposure as an inventory problem rather than only a patching problem, because many organizations can identify public hosts and domains but not the JavaScript framework version or operating system behind each site.","Windows-hosted Next.js deployments are described as a minority pattern often inherited from existing .NET and IIS environments, which can leave them outside inventories focused on Linux web infrastructure.","The sector distribution is described as relatively flat, suggesting the risk is driven more by distributed web development practices than by any single industry’s technology profile.","The same Next.js security release also changes AVIF image handling by disabling AVIF optimization pending an upstream libheif fix, so teams upgrading for CVE-2026-75604 should expect an operational side effect for AVIF images.","The article notes that WAF-layer virtual patching can be useful when applications cannot be rebuilt immediately, but it only filters requests and does not remove the underlying flaw."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-75604 is a critical path traversal flaw in Next.js that can allow an unauthenticated attacker to write files outside the framework’s on-disk cache directory and reach remote code execution on the host. The vulnerability is tracked as CWE-22 and published by Vercel as GHSA-p293-qw3h-jr36. It has a CVSS v3.1 base score of 9.0, with no authentication or user interaction required.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is specific to self-hosted Windows deployments because Windows treats backslashes as directory separators. Percent-encoded backslash sequences can reach the Next.js routing layer without normalization, and under certain routing and caching conditions can steer a filesystem cache write to a chosen location. Affected deployments include Next.js 13.4 up to 15.5.24 and 16.0 up to 16.3.3 when the application uses the Pages Router or the App Router without Cache Components and runs on a Windows filesystem.\u003c/p\u003e\n\n\u003cp\u003eLinux and macOS deployments are not affected, and applications running on Vercel’s managed platform are not affected because that infrastructure runs on Linux. Vercel released fixed versions in Next.js 15.5.24 and 16.3.3, and the article states there is no known workaround for affected Windows-hosted applications. Recommended actions include inventorying Windows-hosted Next.js deployments, confirming pinned framework versions, monitoring cache paths, blocking percent-encoded backslash sequences, and auditing externally reachable incremental static regeneration routes until patching is confirmed.\u003c/p\u003e\n"},{"n":2,"title":"ValleyRAT masquerading as adware","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/valleyrat-backdoor-adware/121175/","time":"10:00","priority":"SHOULD READ","score":87,"tldr":"Kaspersky found that attackers are disguising the ValleyRAT backdoor as signed QN Wallpaper adware, using DLL sideloading to disable defenses, persist, steal keystrokes and clipboard data, and download additional payloads. The campaign is likely linked to Silver Fox and has mainly affected users in China and India.","briefOverview":"\u003cp\u003eKaspersky analyzed a file submitted by a client and initially classified it as adware, but suspicious network activity led to a deeper investigation. The sample turned out to be an installer that deployed a modified version of the Chinese QN Wallpaper desktop wallpaper tool and triggered an infection chain delivering the ValleyRAT backdoor. The article says the advertising functionality did not work and instead the package was used to run malicious code under the guise of a signed process.\u003c/p\u003e\n\n\u003cp\u003eThe installer unpacked QN Wallpaper modules and malicious components into a Program Files directory, disabled Windows Defender using the DisableAntiSpyware registry key, and launched QnWallpaper.exe. A malicious libcef.dll was loaded by QnWallpaper.exe and QnwPlayer.exe, enabling DLL sideloading and loading AES-encrypted ValleyRAT payloads from either the PeLoader file or libcef.dll resources depending on the host process. ValleyRAT then parsed a reversed configuration string containing settings such as C2 addresses, protocol, sleep timings, and options for process protection and analysis-tool checks.\u003c/p\u003e\n\n\u003cp\u003eValleyRAT can track keystrokes, capture clipboard contents, collect system information, take screenshots, wipe logs, update C2 addresses, download additional modules, and reboot or shut down the computer on command. The backdoor can also inject code into svchost to restart itself, mark its process as critical, and restart after unhandled exceptions. Kaspersky detected ValleyRAT and associated malware more than 100,000 times in 2026, affecting more than 1,500 unique users primarily in China and India, and said the geography and use of ValleyRAT point to Silver Fox as the likely operator.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky analyzed an installer initially classified as adware and found that it triggered an infection chain delivering the ValleyRAT backdoor instead of functioning as advertising software.","The installer deployed a modified version of the Chinese QN Wallpaper desktop wallpaper tool and used a malicious libcef.dll for DLL sideloading under the guise of a signed process.","The malicious libcef.dll decrypted and loaded AES-encrypted ValleyRAT payloads from either the PeLoader file or its own resources, depending on whether it was running inside QnWallpaper.exe or QnwPlayer.exe.","ValleyRAT can log keystrokes, capture clipboard contents, collect system information, take screenshots, update C2 addresses, download additional modules, and reboot or shut down the computer on command.","Kaspersky detected ValleyRAT and associated malware more than 100,000 times in 2026, affecting more than 1,500 unique users primarily in China and India, and attributed the campaign as likely linked to Silver Fox."],"insights":["The adware disguise was especially dangerous because the abused QN Wallpaper application was signed by its developer, and users often manually add such apps to security exclusions so their features are not blocked.","The advertising functionality in the modified QN Wallpaper package did not work, indicating that the adware behavior was used as cover rather than as a secondary monetization feature.","The malicious libcef.dll contained both automatic execution through DllMain and a separate RunDLL function that QnWallpaper did not call, showing that the same component could support more than one launch method.","ValleyRAT’s payload source changed depending on the host process, with one encrypted backdoor loaded from PeLoader under QnWallpaper.exe and another loaded from libcef.dll resources under QnwPlayer.exe, differing only in C2 configuration.","The campaign demonstrates that software treated as merely unwanted or annoying can conceal a full backdoor capable of spying on users and delivering additional malicious modules."],"referencedReports":[],"body":"\u003cp\u003eKaspersky analyzed a file submitted by a client and initially classified it as adware, but suspicious network activity led to a deeper investigation. The sample turned out to be an installer that deployed a modified version of the Chinese QN Wallpaper desktop wallpaper tool and triggered an infection chain delivering the ValleyRAT backdoor. The article says the advertising functionality did not work and instead the package was used to run malicious code under the guise of a signed process.\u003c/p\u003e\n\n\u003cp\u003eThe installer unpacked QN Wallpaper modules and malicious components into a Program Files directory, disabled Windows Defender using the DisableAntiSpyware registry key, and launched QnWallpaper.exe. A malicious libcef.dll was loaded by QnWallpaper.exe and QnwPlayer.exe, enabling DLL sideloading and loading AES-encrypted ValleyRAT payloads from either the PeLoader file or libcef.dll resources depending on the host process. ValleyRAT then parsed a reversed configuration string containing settings such as C2 addresses, protocol, sleep timings, and options for process protection and analysis-tool checks.\u003c/p\u003e\n\n\u003cp\u003eValleyRAT can track keystrokes, capture clipboard contents, collect system information, take screenshots, wipe logs, update C2 addresses, download additional modules, and reboot or shut down the computer on command. The backdoor can also inject code into svchost to restart itself, mark its process as critical, and restart after unhandled exceptions. Kaspersky detected ValleyRAT and associated malware more than 100,000 times in 2026, affecting more than 1,500 unique users primarily in China and India, and said the geography and use of ValleyRAT point to Silver Fox as the likely operator.\u003c/p\u003e\n"},{"n":4,"title":"Breaking the Seal: Static Deobfuscation of JSCeal’s Compiled V8 Bytecode","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/breaking-the-seal-static-deobfuscation-of-jsceals-compiled-v8-bytecode/","time":"13:38","priority":"SHOULD READ","score":82,"tldr":"Check Point researchers built and released a fully static pipeline to deobfuscate JSCeal’s compiled V8 bytecode payloads, turning heavily obfuscated Node.js malware into analyzable pseudocode without executing it. The recovered code shows JSCeal is a broad crypto-focused stealer with browser credential theft, keylogging, screenshots, Telegram theft, and local HTTPS interception capabilities.","briefOverview":"\u003cp\u003eCheck Point Research describes a static deobfuscation effort for JSCeal, a cryptocurrency-focused stealer delivered as compiled V8 bytecode and executed by a bundled Node.js runtime. The payloads arrive as JSC files, are Brotli-compressed, and are protected with javascript-obfuscator techniques such as RC4-protected strings, control-flow flattening, proxy functions, and operation wrappers. The researchers built a pipeline based on View8 to transform V8 bytecode pseudocode into code that can be inspected without executing the malware.\u003c/p\u003e\n\n\u003cp\u003eThe work matters because JSCeal combines a version-specific compiled format with source-level obfuscation, making ordinary JavaScript analysis workflows ineffective. The deobfuscation pipeline reconstructs strings, unflattens control flow, resolves proxy and operation wrappers, propagates values through scopes and dictionaries, and optionally uses LLM-assisted function renaming as a navigation aid. The toolkit, jsc_deobfuscator, was released publicly, and the researchers applied it successfully to 23 JSCeal payloads from their evaluation corpus.\u003c/p\u003e\n\n\u003cp\u003eThe recovered code exposed a broad capability set, including browser and credential theft, Telegram session theft, keylogging, screenshot capture, cryptocurrency account and balance collection, and HTTPS traffic interception through a local proxy. The article shows that JSCeal can collect browser cookies, passwords, OAuth tokens, wallet mnemonic data, and cryptocurrency platform information, and can install an attacker-controlled certificate for local traffic interception. It also notes more recent JSCeal changes, including a newer Node.js and V8 version, an AES-256-CBC payload-encryption layer supplied through an environment variable, payload renaming, and macOS targeting.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research has tracked JSCeal since early 2025 as a cryptocurrency-focused stealer delivered as compiled V8 bytecode and executed by a bundled Node.js runtime.","The analyzed JSCeal payloads were protected with javascript-obfuscator techniques including RC4-protected strings, control-flow flattening, proxy functions, and operation wrappers.","Check Point Research developed and released a fully static deobfuscation toolkit that transforms View8 pseudocode without executing the malware.","The deobfuscated output exposed JSCeal capabilities including browser credential theft, keylogging, screenshot capture, Telegram session theft, cryptocurrency-focused collection, and HTTPS traffic interception through a local proxy.","More recent JSCeal developments include V8 code caches generated for a newer Node.js and V8 version, an AES-256-CBC payload-encryption layer, and macOS targeting."],"insights":["JSCeal’s use of compiled V8 code caches creates an analysis burden even when the malware’s higher-level obfuscation patterns remain unchanged, because each new Node.js and V8 runtime generation can require renewed work at the disassembly layer.","The deobfuscation pipeline depends on the order of its passes: recovered strings reveal dictionary keys and control-flow order values, which then enable control-flow unflattening, proxy resolution, and operation-wrapper cleanup.","The article shows that JSCeal goes beyond passive browser data theft by using recovered cookies and passwords with Puppeteer automation to replay Google sessions and obtain fresh Android-scoped OAuth tokens.","JSCeal’s local HTTPS interception proxy is used not only to observe traffic but also to modify service-specific responses, including replacing Binance QR-login values, altering Bybit verification responses, and substituting Ledger web content.","The later AES-256-CBC layer is especially effective for isolated-sample analysis because the decryption key is supplied by an earlier deployment stage through an environment variable rather than stored in the malware bundle itself."],"referencedReports":[{"title":"Threat actors misuse Node.js to deliver malware and other malicious payloads","url":"https://www.microsoft.com/en-us/security/blog/2025/04/15/threat-actors-misuse-node-js-to-deliver-malware-and-other-malicious-payloads/","publisher":"Microsoft Security","context":"The article says Microsoft’s post provides details of the campaign that delivered the selected JSCeal payload used as a case study.","category":"research","primary":false},{"title":"A Deep Dive into a New JSCEAL Infostealer Campaign","url":"https://www.catonetworks.com/blog/cato-ctrl-deep-dive-into-new-jsceal-infostealer-campaign/","publisher":"Cato CTRL Threat Research","context":"The article cites Cato’s analysis as another source for details about the campaign delivering the selected JSCeal payload.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research describes a static deobfuscation effort for JSCeal, a cryptocurrency-focused stealer delivered as compiled V8 bytecode and executed by a bundled Node.js runtime. The payloads arrive as JSC files, are Brotli-compressed, and are protected with javascript-obfuscator techniques such as RC4-protected strings, control-flow flattening, proxy functions, and operation wrappers. The researchers built a pipeline based on View8 to transform V8 bytecode pseudocode into code that can be inspected without executing the malware.\u003c/p\u003e\n\n\u003cp\u003eThe work matters because JSCeal combines a version-specific compiled format with source-level obfuscation, making ordinary JavaScript analysis workflows ineffective. The deobfuscation pipeline reconstructs strings, unflattens control flow, resolves proxy and operation wrappers, propagates values through scopes and dictionaries, and optionally uses LLM-assisted function renaming as a navigation aid. The toolkit, jsc_deobfuscator, was released publicly, and the researchers applied it successfully to 23 JSCeal payloads from their evaluation corpus.\u003c/p\u003e\n\n\u003cp\u003eThe recovered code exposed a broad capability set, including browser and credential theft, Telegram session theft, keylogging, screenshot capture, cryptocurrency account and balance collection, and HTTPS traffic interception through a local proxy. The article shows that JSCeal can collect browser cookies, passwords, OAuth tokens, wallet mnemonic data, and cryptocurrency platform information, and can install an attacker-controlled certificate for local traffic interception. It also notes more recent JSCeal changes, including a newer Node.js and V8 version, an AES-256-CBC payload-encryption layer supplied through an environment variable, payload renaming, and macOS targeting.\u003c/p\u003e\n"},{"n":1,"title":"One Target List, Six Weeks of Conference Invites","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/conference-brochure-lure-sustained-personalized-mail-merge-campaign","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A patient phishing operator used an aged, properly authenticated attacker-owned domain to repeatedly target named employees at one pharmaceutical CDMO with personalized conference-invitation emails carrying a malicious PDF. The key lesson is that SPF, DKIM, DMARC, domain age, and sender familiarity can all look normal, so defenders need payload analysis and per-recipient behavioral detection to catch these campaigns.","briefOverview":"\u003cp\u003eA senior commercial leader at a pharmaceutical contract development and manufacturing organization received a personalized industry-summit invitation on July 9, 2026, with a brochure PDF attached. The subject line named a plausible facility-engineering conference in a specific host city and used a conversational “Re:” prefix. The attachment scanner returned a malicious verdict, and the PDF was about 1.5 MB, roughly the size of a real event prospectus.\u003c/p\u003e\n\n\u003cp\u003eThe campaign did not stop with the first reported message. Six weeks later, on August 20, 2026, four more individually named mailboxes at the same organization were targeted with similar personalized conference invitations and matching brochure attachments. The article describes this as a curated target list rather than a spray campaign, with the operator rotating conference names and host cities while keeping the delivery mechanism in place.\u003c/p\u003e\n\n\u003cp\u003eThe messages passed SPF, DKIM, DMARC, and Microsoft composite authentication because the sending domain belonged to the attacker and was correctly configured. The domain, nexora-summits[.]com, had been created on December 5, 2025, making it roughly seven months old at the first recorded send, so domain-age heuristics did not help. Themis scored the message at 90 percent confidence, tagged it against a high-value recipient, and mitigated it across the affected mailboxes before any recipient acted on it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On July 9, 2026, a senior commercial leader at a pharmaceutical contract development and manufacturing organization received a personalized industry-summit invitation with a malicious brochure PDF attached.","Six weeks later, on August 20, 2026, four more individually named mailboxes at the same organization were targeted with similar personalized conference invitations and matching brochure attachments.","The emails passed SPF, DKIM, DMARC, and Microsoft composite authentication because the attacker owned and correctly configured the sending domain.","The attacker’s sending domain, nexora-summits[.]com, was created on December 5, 2025, making it roughly seven months old at the first recorded send.","The attachment scanner returned a malicious verdict on the PDF, and Themis scored the message at 90 percent confidence before mitigating it across the affected mailboxes."],"insights":["Clean SPF, DKIM, and DMARC results did not reduce risk in this case because the attacker used their own correctly configured domain rather than spoofing someone else’s domain.","Domain-age checks were ineffective because the attacker registered the sending domain roughly seven months before the first observed message, aging it past common newly registered domain thresholds.","The campaign’s rotation of conference names and host cities meant blocking a single subject line would only stop one version of the mail-merge template, not the broader campaign.","The sender was recorded as an established correspondent by the time of the reported message, showing that repeated contact can erode the usefulness of first-time-sender novelty as a warning signal.","The article recommends sweeping the whole tenant for the same subject template and sending domain after one malicious attachment is confirmed, because the reported message may be only one part of a broader mail-merge campaign."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics that 16 percent of breaches involved phishing as the initial access vector and 62 percent involved the human element overall.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA phishing guidance as framing phishing as social deception where technical controls reduce how often people must be the last line of defense.","category":"guide","primary":false}],"body":"\u003cp\u003eA senior commercial leader at a pharmaceutical contract development and manufacturing organization received a personalized industry-summit invitation on July 9, 2026, with a brochure PDF attached. The subject line named a plausible facility-engineering conference in a specific host city and used a conversational “Re:” prefix. The attachment scanner returned a malicious verdict, and the PDF was about 1.5 MB, roughly the size of a real event prospectus.\u003c/p\u003e\n\n\u003cp\u003eThe campaign did not stop with the first reported message. Six weeks later, on August 20, 2026, four more individually named mailboxes at the same organization were targeted with similar personalized conference invitations and matching brochure attachments. The article describes this as a curated target list rather than a spray campaign, with the operator rotating conference names and host cities while keeping the delivery mechanism in place.\u003c/p\u003e\n\n\u003cp\u003eThe messages passed SPF, DKIM, DMARC, and Microsoft composite authentication because the sending domain belonged to the attacker and was correctly configured. The domain, nexora-summits[.]com, had been created on December 5, 2025, making it roughly seven months old at the first recorded send, so domain-age heuristics did not help. Themis scored the message at 90 percent confidence, tagged it against a high-value recipient, and mitigated it across the affected mailboxes before any recipient acted on it.\u003c/p\u003e\n"},{"n":3,"title":"31th August – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/31th-august-threat-intelligence-report/","time":"12:58","priority":"MAY READ","score":40,"tldr":"This weekly threat intelligence roundup highlights major breaches affecting airports, healthcare, and government systems, alongside emerging AI-enabled abuse and prompt-injection risks. Organizations should prioritize patching critical flaws in PaperCut, Ubiquiti, Next.js, and ServiceNow while monitoring activity from ransomware, phishing, and state-linked threat groups.","briefOverview":"\u003cp\u003eCheck Point Research’s 31st August Threat Intelligence Report summarizes major cyber incidents, AI-related threats, software vulnerabilities, and threat intelligence findings from the week. Reported incidents include Manchester Airports Group disclosing exposure of data for about 8.7 million customers, the U.S. Bureau of Alcohol, Tobacco, Firearms and Explosives confirming a compromise of a standalone computer, Boston Scientific experiencing worldwide operational disruption, and McKesson disclosing data theft involving third-party applications. ShinyHunters claimed it used vishing to compromise Okta accounts and access Salesforce and Snowflake, exfiltrating about 1TB of data containing approximately 284 million patient-related records.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI-related risks including Cryptographic Context Injection, a technique that hides malicious instructions inside encrypted content to bypass AI assistant safeguards. Researchers also detailed a prompt injection vulnerability in Amazon Kiro that could allow malicious workspace files to manipulate the agent and transmit local information, with Amazon addressing the issue in version 0.8.140. Another AI-enabled threat, AnonyMousKIT, was described as a phishing-as-a-service operation using email, text messages, WhatsApp, and AI-generated voice calls to steal Apple IDs, passcodes, and two-factor authentication codes.\u003c/p\u003e\n\n\u003cp\u003eSeveral critical vulnerabilities and patches are also covered, including actively exploited PaperCut NG and MF flaws that can be chained for unauthenticated remote code execution, 21 Ubiquiti UniFi vulnerabilities, two critical Next.js issues, and three CVSS 10.0 ServiceNow AI Platform flaws. The intelligence section reports a large-scale debt-relief phishing campaign targeting more than 9,000 organizations and the U.S. disruption of QScan and QTRouter, platforms operated by the China-linked group QTFY. It also describes activity by the Iran-linked Nimbus Manticore group and a Chinese threat actor compromising sensitive organizations in the Philippines through known ownCloud and WordPress vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Manchester Airports Group disclosed a cyberattack that exposed data belonging to about 8.7 million customers, including contact details, vehicle registration numbers, and information collected through car park, lounge, fast-track, and Wi-Fi registrations.","McKesson disclosed a data breach involving unauthorized access to third-party applications and data theft, and ShinyHunters claimed it exfiltrated about 1TB of data containing approximately 284 million patient-related records.","Researchers described Cryptographic Context Injection, a technique that conceals malicious instructions inside encrypted content to bypass safeguards in AI assistants with browsing and code capabilities.","PaperCut released emergency fixes for two actively exploited vulnerabilities affecting PaperCut NG and MF that attackers can chain to achieve unauthenticated remote code execution on affected servers.","U.S. authorities announced the disruption of QScan and QTRouter, two platforms operated by the China-linked group QTFY to target U.S. critical infrastructure and government networks."],"insights":["Several of the most urgent software issues in the report can lead to unauthenticated remote code execution, making the PaperCut, Next.js, and ServiceNow fixes especially time-sensitive for affected organizations.","The article shows that voice-based social engineering remains a major path into business systems, with ShinyHunters claiming vishing was used to compromise Okta accounts and Check Point reporting a separate campaign that pushed victims to call attacker-controlled phone numbers.","AI-related risk in the report is not limited to fake content generation, because the described techniques involve AI assistants being manipulated through encrypted instructions, malicious workspace files, and AI-generated voice calls.","The reported China-linked activity combines broad targeting of U.S. critical infrastructure and government networks with separate exploitation of known ownCloud and WordPress vulnerabilities against sensitive Philippine organizations."],"referencedReports":[{"title":"Encrypted instructions can fool AI assistants like Grok and Gemini","url":"https://www.malwarebytes.com/blog/ai/2026/08/encrypted-instructions-can-fool-ai-assistants-like-grok-and-gemini","publisher":"Malwarebytes","context":"The article references Malwarebytes research describing Cryptographic Context Injection, a technique for hiding malicious instructions inside encrypted content to bypass AI assistant safeguards.","category":"research","primary":false},{"title":"AnonyMousKIT: AI PhaaS Supply Chain","url":"https://socradar.io/blog/anonymouskit-ai-phaas-supply-chain/","publisher":"SOCRadar","context":"The article cites SOCRadar research profiling AnonyMousKIT, an AI-enabled phishing-as-a-service operation targeting owners of stolen iPhones.","category":"research","primary":false},{"title":"Tortoiseshell APT Toolset Infrastructure","url":"https://www.group-ib.com/blog/tortoiseshell-apt-toolset-infrastructure/","publisher":"Group-IB","context":"The article references Group-IB research on an expanded toolset used by the Iran-linked Nimbus Manticore threat group against organizations in the Middle East and Europe.","category":"research","primary":false},{"title":"Chinese-speaking operator targets Philippine nuclear and naval contractor","url":"https://hunt.io/blog/chinese-speaking-operator-philippine-nuclear-naval-contractor","publisher":"Hunt.io","context":"The article cites Hunt.io research about a Chinese threat actor exploiting known ownCloud and WordPress vulnerabilities to compromise sensitive organizations in the Philippines.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research’s 31st August Threat Intelligence Report summarizes major cyber incidents, AI-related threats, software vulnerabilities, and threat intelligence findings from the week. Reported incidents include Manchester Airports Group disclosing exposure of data for about 8.7 million customers, the U.S. Bureau of Alcohol, Tobacco, Firearms and Explosives confirming a compromise of a standalone computer, Boston Scientific experiencing worldwide operational disruption, and McKesson disclosing data theft involving third-party applications. ShinyHunters claimed it used vishing to compromise Okta accounts and access Salesforce and Snowflake, exfiltrating about 1TB of data containing approximately 284 million patient-related records.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI-related risks including Cryptographic Context Injection, a technique that hides malicious instructions inside encrypted content to bypass AI assistant safeguards. Researchers also detailed a prompt injection vulnerability in Amazon Kiro that could allow malicious workspace files to manipulate the agent and transmit local information, with Amazon addressing the issue in version 0.8.140. Another AI-enabled threat, AnonyMousKIT, was described as a phishing-as-a-service operation using email, text messages, WhatsApp, and AI-generated voice calls to steal Apple IDs, passcodes, and two-factor authentication codes.\u003c/p\u003e\n\n\u003cp\u003eSeveral critical vulnerabilities and patches are also covered, including actively exploited PaperCut NG and MF flaws that can be chained for unauthenticated remote code execution, 21 Ubiquiti UniFi vulnerabilities, two critical Next.js issues, and three CVSS 10.0 ServiceNow AI Platform flaws. The intelligence section reports a large-scale debt-relief phishing campaign targeting more than 9,000 organizations and the U.S. disruption of QScan and QTRouter, platforms operated by the China-linked group QTFY. It also describes activity by the Iran-linked Nimbus Manticore group and a Chinese threat actor compromising sensitive organizations in the Philippines through known ownCloud and WordPress vulnerabilities.\u003c/p\u003e\n"}]</script>
