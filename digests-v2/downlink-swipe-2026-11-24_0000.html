<script type="application/json" id="dl-articles">[{"n":35,"title":"Patching vCenter Zero-Day Is Only Step One","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/cve-2026-123890-vcenter-zero-day-patching/","time":"08:06","priority":"MUST READ","score":98,"tldr":"Broadcom’s patch for the actively exploited CVE-2026-123890 vCenter authentication bypass must be installed immediately, but organizations should also assume possible compromise if vCenter was reachable since September 2026. Hunt for attacker persistence and rotate vCenter SAML signing keys, privileged credentials, ESXi access, and potentially Active Directory secrets.","briefOverview":"\u003cp\u003eCVE-2026-123890 is a critical authentication bypass in VMware vCenter’s Directory Service that can allow a network-reachable attacker to obtain an \u003ccode\u003eadministrator@vsphere.local\u003c/code\u003e session without a password. Google Threat Intelligence Group and Mandiant reported that the suspected China-nexus group ARMORY CASTLE exploited the flaw as a zero-day from early September 2026. Broadcom released fixes on November 19, 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog with a November 23 deadline for U.S. federal agencies.\u003c/p\u003e\n\n\u003cp\u003eIn the investigated intrusion, attackers entered through a BeyondTrust Remote Support zero-day, moved through internal Linux appliances, and used a custom tool called BONESAW to take over vCenter through TCP port 2012. They copied vCenter’s directory database and SAML token-signing key, enabled SSH on the vCenter appliance, accessed ESXi hosts, and extracted Active Directory data from a virtual machine disk. The article stresses that patching is necessary but does not undo prior compromise, so affected organizations should hunt for unauthorized accounts and persistence, replace the SAML signing certificate, reset relevant vSphere and ESXi credentials, and consider Active Directory passwords exposed where domain-controller disks may have been accessed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123890 is a critical VMware vCenter Directory Service authentication bypass that can let a network-reachable attacker obtain an administrator@vsphere.local session without a password.","Google Threat Intelligence Group and Mandiant reported that the suspected China-nexus group ARMORY CASTLE exploited the flaw as a zero-day from early September 2026.","Broadcom released fixes on November 19, 2026, for vCenter 9.1, 9.0, and 8.0 product lines, while vCenter 7.0 has no public fix.","Attackers in the investigated intrusion stole vCenter’s SAML token-signing key, master encryption key, PostgreSQL password, and Active Directory data extracted from virtual-machine disks.","Patching prevents use of the login flaw but does not invalidate stolen signing keys, remove unauthorized accounts, or reverse credential theft, so the article recommends hunting for compromise and rotating affected secrets."],"insights":["Keeping vCenter off the public internet did not prevent the reported intrusion, because the attackers first compromised a remote-support appliance and then reached vCenter from inside the network.","Replacing the vCenter SAML signing certificate is essential after suspected compromise because someone holding the stolen key can continue creating administrator login tokens even after the authentication flaw is patched.","An organization may need to treat its entire Active Directory environment as exposed if a domain controller’s virtual disk was accessible through compromised VMware hosts, since attackers extracted the directory database and registry files from a virtual machine disk.","The article says vCenter’s built-in appliance firewall cannot restrict access by individual port, meaning access controls managed through that interface may not adequately protect port 2012 or separate management services.","vCenter 7.0, as well as presumed-affected 6.5 and 6.7 systems, present a particularly difficult risk because there is no public fix for vCenter 7.0 and network restriction is the main protection until an upgrade or supported fix is available."],"referencedReports":[{"title":"ARMORY CASTLE Exploits vSphere","url":"https://cloud.google.com/blog/topics/threat-intelligence/armory-castle-exploits-vsphere","publisher":"Google Threat Intelligence Group and Mandiant","context":"The article relies on this technical analysis for details of ARMORY CASTLE’s exploitation path, tools, persistence, indicators, and defensive recommendations.","category":"research","primary":true},{"title":"VMSA-2026-0009","url":"https://www.rapid7.com/blog/post/etr-cve-2026-123890-critical-authentication-bypass-vmware-vcenter/","publisher":"Broadcom","context":"The article identifies Broadcom’s advisory as the disclosure covering CVE-2026-123890 and the associated fixed versions.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog Entry for CVE-2026-123890","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-123890","publisher":"CISA","context":"The article cites CISA’s KEV catalog entry for the vulnerability’s active exploitation status and federal remediation deadline.","category":"advisory","primary":false}],"body":"\u003cp\u003eCVE-2026-123890 is a critical authentication bypass in VMware vCenter’s Directory Service that can allow a network-reachable attacker to obtain an \u003ccode\u003eadministrator@vsphere.local\u003c/code\u003e session without a password. Google Threat Intelligence Group and Mandiant reported that the suspected China-nexus group ARMORY CASTLE exploited the flaw as a zero-day from early September 2026. Broadcom released fixes on November 19, 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog with a November 23 deadline for U.S. federal agencies.\u003c/p\u003e\n\n\u003cp\u003eIn the investigated intrusion, attackers entered through a BeyondTrust Remote Support zero-day, moved through internal Linux appliances, and used a custom tool called BONESAW to take over vCenter through TCP port 2012. They copied vCenter’s directory database and SAML token-signing key, enabled SSH on the vCenter appliance, accessed ESXi hosts, and extracted Active Directory data from a virtual machine disk. The article stresses that patching is necessary but does not undo prior compromise, so affected organizations should hunt for unauthorized accounts and persistence, replace the SAML signing certificate, reset relevant vSphere and ESXi credentials, and consider Active Directory passwords exposed where domain-controller disks may have been accessed.\u003c/p\u003e\n"},{"n":24,"title":"Hackers Exploit N-able MailAssure Flaw While AI Agents Exploit MONAI Label Zero-Day","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-n-able-mailassure-flaw.html","time":"06:02","priority":"MUST READ","score":96,"tldr":"CISA added actively exploited flaws in N-able MailAssure and MONAI Label to its KEV catalog, including a MONAI Label zero-day reportedly exploited by AI agents to gain root-level reverse-shell access. Organizations should urgently patch CVE-2026-134624 and CVE-2026-133968.","briefOverview":"\u003cp\u003eCISA added two actively exploited vulnerabilities to its Known Exploited Vulnerabilities catalog: CVE-2026-134624 in N-able MailAssure and CVE-2026-133968 in MONAI Label. The MailAssure flaw is a server-side request forgery issue that allows an authenticated API user to reach arbitrary internal hosts and ports and send crafted data to internal services. N-able linked its exploitation to a November 16 security incident that disrupted Mail Assure and SpamExperts Hosted Cloud, although the company said affected functions were restored and its investigation found exploitation confined to one hosted server.\u003c/p\u003e\n\n\u003cp\u003eThe MONAI Label flaw lets an unauthenticated remote attacker write files outside the intended data directory and could result in remote code execution. A suspected China-linked actor reportedly used CAIRN AI agents to identify and exploit the zero-day in about 11 minutes, then wrote a Python reverse-shell payload to sitecustomize.py and triggered a training endpoint to obtain a root shell. The article places this activity within a broader set of AI-driven campaigns involving ARTEX, AntiFox, and CyberStrikeAI, which have targeted organizations, payment services, cloud environments, and cryptocurrency exchanges. Federal Civilian Executive Branch agencies were advised to apply fixes for both vulnerabilities by November 26, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-134624 in N-able MailAssure and CVE-2026-133968 in MONAI Label to its Known Exploited Vulnerabilities catalog after finding evidence of active exploitation.","CVE-2026-134624 is a critical MailAssure flaw that lets an authenticated API user reach arbitrary internal hosts and ports and send crafted data to internal services.","CVE-2026-133968 is a critical MONAI Label path traversal flaw that allows an unauthenticated remote attacker to write files outside the intended directory and could lead to remote code execution.","A suspected China-linked actor reportedly used CAIRN AI agents to identify and exploit the MONAI Label zero-day, then used a Python startup file and a training API endpoint to establish a root reverse shell.","Federal Civilian Executive Branch agencies were advised to apply fixes for both vulnerabilities by November 26, 2026."],"insights":["The MONAI Label zero-day was reportedly identified and exploited by AI agents in about 11 minutes, showing that the agents could discover and use an unknown flaw with minimal human direction.","The attackers reportedly gained persistent root-level access by writing a payload to Python’s automatically imported sitecustomize.py file and then triggering a training endpoint to start a new Python process.","AWS described an ARTEX campaign in which stolen AI-model access keys funded the AI processing used to find additional credentials, creating a self-sustaining operation.","ARTEX activity against AWS environments used both compromised long-term access keys and public Cognito user pools, including account registration and account enumeration through collected tokens.","Previdian observed ARTEX-related traffic attempting several high-impact techniques, including application discovery, authentication probing, remote code execution attempts, path traversal, and retrieval of sensitive configuration data."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/23/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA’s advisory is cited for adding the N-able MailAssure and MONAI Label flaws to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Amazon Threat Intelligence Observes Threat Actors Running Cybercrime Campaigns with ARTEX AI Agents","url":"https://aws.amazon.com/blogs/security/amazon-threat-intelligence-observes-threat-actors-running-cybercrime-campaigns-with-artex-ai-agents/","publisher":"amazon-web-services","context":"The article cites AWS research describing ARTEX-linked campaigns involving AI-model credential theft and cryptocurrency exchange KYC bypass attempts.","category":"research","primary":false},{"title":"ARTEX Agentic Attacks in AWS Environments","url":"https://securitylabs.datadoghq.com/articles/artex-agentic-attacks-aws-environments/","publisher":"datadog-security-labs","context":"Datadog Security Labs is cited for analysis of ARTEX activity in AWS environments, including use of valid long-term access keys to search for financial data.","category":"research","primary":false},{"title":"ARTEX Traffic: Previdian Threat Intelligence Report — November 2026","url":"https://blog.previdian.com/artex-traffic-previdian-threat-intelligence-report-november-2026/","publisher":"previdian","context":"Previdian’s threat-intelligence report is cited for sensor telemetry documenting ARTEX-marked traffic and related discovery, authentication, code-execution, and path-traversal attempts.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added two actively exploited vulnerabilities to its Known Exploited Vulnerabilities catalog: CVE-2026-134624 in N-able MailAssure and CVE-2026-133968 in MONAI Label. The MailAssure flaw is a server-side request forgery issue that allows an authenticated API user to reach arbitrary internal hosts and ports and send crafted data to internal services. N-able linked its exploitation to a November 16 security incident that disrupted Mail Assure and SpamExperts Hosted Cloud, although the company said affected functions were restored and its investigation found exploitation confined to one hosted server.\u003c/p\u003e\n\n\u003cp\u003eThe MONAI Label flaw lets an unauthenticated remote attacker write files outside the intended data directory and could result in remote code execution. A suspected China-linked actor reportedly used CAIRN AI agents to identify and exploit the zero-day in about 11 minutes, then wrote a Python reverse-shell payload to sitecustomize.py and triggered a training endpoint to obtain a root shell. The article places this activity within a broader set of AI-driven campaigns involving ARTEX, AntiFox, and CyberStrikeAI, which have targeted organizations, payment services, cloud environments, and cryptocurrency exchanges. Federal Civilian Executive Branch agencies were advised to apply fixes for both vulnerabilities by November 26, 2026.\u003c/p\u003e\n"},{"n":11,"title":"Hackers compromise Check Point Servers in 22 organizations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-compromise-check-point-servers-in-22-organizations/","time":"16:15","priority":"MUST READ","score":94,"tldr":"GreyNoise says a suspected cyberespionage campaign compromised 24 Check Point Security Management servers across 22 organizations in 17 countries, stealing sensitive firewall data and disabling security policies. The attackers used persistent access and exploited Check Point SmartConsole's CVE-2026-16232 during post-compromise activity; the initial access vector remains unknown.","briefOverview":"\u003cp\u003eGreyNoise identified an intrusion campaign tracked as GT13 that compromised 24 Check Point Security Management servers at 22 organizations in 17 countries. Victims include government entities, financial services providers, and organizations in the energy, transportation, mining, and manufacturing sectors. The activity was observed from October 17 through November 2, and GreyNoise believes it may still be active because the attackers retained persistent access to Check Point devices.\u003c/p\u003e\n\n\u003cp\u003eThe attackers stole firewall databases, credentials, configuration data, and internal certificate authority files, and they unloaded security policies that disabled firewall protections. GreyNoise observed post-compromise exploitation of CVE-2026-16232, a Check Point SmartConsole authentication bypass that can provide an administrator login token, but could not determine the initial access method. The campaign used 99 IP addresses associated with compromised Check Point devices and ExpressVPN exit nodes, while a Rejetto HTTP File Server compromised through CVE-2026-61500 served as a relay for managing intrusions and collecting stolen data. The attackers also conducted internal reconnaissance and attempted to target Citrix, Ivanti, VMware vCenter, Microsoft Exchange, and Microsoft Netlogon systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GreyNoise tracked an ongoing campaign called GT13 that compromised 24 Check Point Security Management servers belonging to 22 organizations across 17 countries.","The affected organizations include government entities, financial services providers, and companies in the energy, transportation, mining, and manufacturing sectors.","GreyNoise observed post-compromise exploitation of CVE-2026-16232, a Check Point SmartConsole authentication bypass that can provide administrator-level access.","The attackers stole firewall databases, credentials, configuration data, and internal certificate authority files, and they unloaded security policies in compromised environments.","The initial method used to breach the Check Point servers remains unknown, and GreyNoise believes the campaign may still be active despite losing visibility on November 2."],"insights":["A failed bulk certificate-management operation across all 24 compromised Check Point servers on October 26 helped GreyNoise identify the victims.","The attackers used a compromised Rejetto HTTP File Server as a relay to manage intrusions and collect stolen data from affected environments.","The campaign’s 99 source IP addresses appeared to include compromised Check Point devices and ExpressVPN exit nodes, rather than a single fixed attack infrastructure.","Beyond the Check Point systems, the attackers attempted to reach Citrix, Ivanti, VMware vCenter, Microsoft Exchange, and Microsoft Netlogon systems within victim environments.","GreyNoise assessed that the activity may have used an AI-powered offensive tool based on automation and custom tooling, but stated that AI use was not confirmed."],"referencedReports":[{"title":"Check Point Security Management Servers Intrusion Campaign","url":"https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign","publisher":"GreyNoise","context":"The article relies on GreyNoise's technical analysis for details of the GT13 campaign, victim identification, observed activity, and indicators of compromise.","category":"research","primary":true}],"body":"\u003cp\u003eGreyNoise identified an intrusion campaign tracked as GT13 that compromised 24 Check Point Security Management servers at 22 organizations in 17 countries. Victims include government entities, financial services providers, and organizations in the energy, transportation, mining, and manufacturing sectors. The activity was observed from October 17 through November 2, and GreyNoise believes it may still be active because the attackers retained persistent access to Check Point devices.\u003c/p\u003e\n\n\u003cp\u003eThe attackers stole firewall databases, credentials, configuration data, and internal certificate authority files, and they unloaded security policies that disabled firewall protections. GreyNoise observed post-compromise exploitation of CVE-2026-16232, a Check Point SmartConsole authentication bypass that can provide an administrator login token, but could not determine the initial access method. The campaign used 99 IP addresses associated with compromised Check Point devices and ExpressVPN exit nodes, while a Rejetto HTTP File Server compromised through CVE-2026-61500 served as a relay for managing intrusions and collecting stolen data. The attackers also conducted internal reconnaissance and attempted to target Citrix, Ivanti, VMware vCenter, Microsoft Exchange, and Microsoft Netlogon systems.\u003c/p\u003e\n"},{"n":12,"title":"CISA warns of exploited N-able bug as company restores email platform","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cisa-nable-cybersecurity-bug","time":"15:00","priority":"MUST READ","score":94,"tldr":"CISA added a critical N-able Mail Assure flaw, CVE-2026-134624, to its exploited-vulnerabilities catalog after attackers used it to breach one hosted server and disrupt Mail Assure and SpamExperts services. N-able says it patched the issue, restored customer dashboards, and found no evidence of broader exploitation.","briefOverview":"\u003cp\u003eCISA added CVE-2026-134624, a 9.3-severity flaw affecting N-able’s Mail Assure email-security platform, to its catalog of known exploited vulnerabilities. The agency gave U.S. federal departments until Thanksgiving to patch the issue. Mail Assure is used to block spam, malware, and other email threats.\u003c/p\u003e\n\n\u003cp\u003eN-able said attackers breached one company-hosted server through the flaw, causing a week of service issues affecting Mail Assure and SpamExperts. The company said it remediated the issue, restored customer access to internal dashboards, and that inbound and outbound email flow and spam filtering continued throughout the incident. N-able said it found no evidence of exploitation beyond the initially identified server, engaged incident responders to validate its findings, and plans to publish a root-cause analysis within two weeks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-134624, a critical 9.3-rated flaw in N-able Mail Assure, to its catalog of vulnerabilities known to be exploited and gave U.S. federal agencies until Thanksgiving to patch it.","N-able said attackers used the flaw to breach one company-hosted server, causing a week of outages affecting its Mail Assure and SpamExperts services.","N-able said it remediated the flaw over the weekend and restored customers' access to internal dashboards, while inbound and outbound email flow and spam filtering continued operating during the incident.","The company said continued scanning and monitoring found no evidence of exploitation beyond the single hosted server identified in its initial investigation, and it engaged incident responders to validate that finding.","N-able said it will publish a root-cause analysis within two weeks and that the Mail Assure incident is unrelated to recently publicized vulnerabilities in its N-central platform."],"insights":["The incident disrupted customer dashboards and related services, but N-able said core inbound and outbound email delivery and spam filtering continued throughout the event.","CISA’s addition of the flaw to its exploited-vulnerabilities catalog makes patching an urgent requirement for U.S. federal agencies, with a deadline set for Thanksgiving.","N-able stated that this Mail Assure incident is separate from the recently disclosed N-central issues, despite both involving the same company and occurring within weeks of each other."],"referencedReports":[{"title":"CVE-2026-134624: Mail Assure LDAP Sync Connection Check SSRF","url":"https://me.n-able.com/s/security-advisory/aArVy0000002mrlKAA/cve2026134624-mailassure-ldap-sync-connection-check-ssrf","publisher":"n-able","context":"The article links to N-able’s security advisory for the exploited Mail Assure vulnerability CVE-2026-134624.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-134624, a 9.3-severity flaw affecting N-able’s Mail Assure email-security platform, to its catalog of known exploited vulnerabilities. The agency gave U.S. federal departments until Thanksgiving to patch the issue. Mail Assure is used to block spam, malware, and other email threats.\u003c/p\u003e\n\n\u003cp\u003eN-able said attackers breached one company-hosted server through the flaw, causing a week of service issues affecting Mail Assure and SpamExperts. The company said it remediated the issue, restored customer access to internal dashboards, and that inbound and outbound email flow and spam filtering continued throughout the incident. N-able said it found no evidence of exploitation beyond the initially identified server, engaged incident responders to validate its findings, and plans to publish a root-cause analysis within two weeks.\u003c/p\u003e\n"},{"n":37,"title":"NGINX HTTP/2 Use-After-Free: CVE-2026-123633","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/cve-2026-123633-nginx-http2-vulnerability/","time":"23:00","priority":"MUST READ","score":93,"tldr":"CVE-2026-123633 is a critical NGINX HTTP/2 use-after-free affecting reverse proxies under worker-connection pressure, enabling unauthenticated denial of service and potentially code execution if ASLR is bypassed. Upgrade to NGINX 1.30.7 or 1.31.9 (or a vendor-backported fixed package) and review exposed HTTP/2 proxy configurations.","briefOverview":"\u003cp\u003eCVE-2026-123633 is an unauthenticated use-after-free vulnerability in NGINX HTTP/2 reverse proxies that can cause denial of service when available worker connections are low. F5 assigned it a CVSS 4.0 score of 9.2 Critical and stated that code execution may be possible if address space layout randomization (ASLR) is disabled or bypassed. NGINX lists versions 1.19.7 through 1.30.6 and 1.31.0 through 1.31.8 as affected, with fixes in 1.30.7 and 1.31.9.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs because an HTTP/2 connection that begins with a partial request-frame header can remain incorrectly marked as reusable after NGINX creates an active request stream. Under connection pressure, NGINX may reclaim that still-active connection and free DNS resolver memory that the request continues to use; the researcher reproduced a read from freed memory with AddressSanitizer on NGINX 1.31.7 and 1.31.8. The tested path involved a variable proxy upstream requiring request-time DNS resolution, a new resolver UDP socket, connection pressure, and an abortive client close. Organizations should upgrade to a fixed NGINX release or vendor package containing the fix, and should perform a full restart or live binary upgrade because a normal configuration reload retains the old binary in memory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-123633 is an HTTP/2 use-after-free flaw in NGINX that can let an unauthenticated attacker cause a denial of service when a reverse proxy is low on available worker connections.","Affected versions are NGINX 1.19.7 through 1.30.6 and 1.31.0 through 1.31.8, while NGINX 1.30.7 and 1.31.9 contain the fix.","The defect can leave an active HTTP/2 request marked as reusable, allowing NGINX to close its connection and free memory still used by the request under connection pressure.","The researcher reproduced a read from freed DNS resolver memory using AddressSanitizer on NGINX 1.31.7 and 1.31.8 in an isolated Debian test environment.","F5 states that code execution may be possible when address space layout randomization is disabled or bypassed, and recommends upgrading to a fixed release or vendor package containing the fix."],"insights":["A standard NGINX configuration reload keeps the old binary in memory, so deploying the fix requires a full restart or a live binary upgrade.","The connection-pressure warning relevant to investigation is logged at the warn level, but NGINX defaults to an error-log level that omits warnings; the warning is also not proof of exploitation because it can occur during ordinary load.","The reproduced path depended on a request-time DNS lookup opening a new resolver UDP socket, meaning cached answers or an existing in-flight lookup could avoid the specific trigger tested.","F5 rated the issue 9.2 Critical under CVSS 4.0, while the NGINX security advisories page labeled it Medium, illustrating that published severity labels differ for the same flaw."],"referencedReports":[{"title":"NGINX Security Advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"NGINX","context":"The article cites this advisory page for the affected NGINX version ranges and the fixed 1.30.7 and 1.31.9 releases.","category":"advisory","primary":true},{"title":"CVE-2026-123633","url":"https://www.cve.org/CVERecord?id=CVE-2026-123633","publisher":"CVE Program / F5","context":"The article cites the CVE record for F5's vendor description, severity scores, denial-of-service impact, and possible code-execution conditions.","category":"advisory","primary":true},{"title":"F5 Advisory for CVE-2026-123633","url":"https://my.f5.com/manage/s/article/K000163928","publisher":"F5","context":"The article links F5's advisory for affected NGINX Plus releases and the vendor's mitigation information.","category":"advisory","primary":true}],"body":"\u003cp\u003eCVE-2026-123633 is an unauthenticated use-after-free vulnerability in NGINX HTTP/2 reverse proxies that can cause denial of service when available worker connections are low. F5 assigned it a CVSS 4.0 score of 9.2 Critical and stated that code execution may be possible if address space layout randomization (ASLR) is disabled or bypassed. NGINX lists versions 1.19.7 through 1.30.6 and 1.31.0 through 1.31.8 as affected, with fixes in 1.30.7 and 1.31.9.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs because an HTTP/2 connection that begins with a partial request-frame header can remain incorrectly marked as reusable after NGINX creates an active request stream. Under connection pressure, NGINX may reclaim that still-active connection and free DNS resolver memory that the request continues to use; the researcher reproduced a read from freed memory with AddressSanitizer on NGINX 1.31.7 and 1.31.8. The tested path involved a variable proxy upstream requiring request-time DNS resolution, a new resolver UDP socket, connection pressure, and an abortive client close. Organizations should upgrade to a fixed NGINX release or vendor package containing the fix, and should perform a full restart or live binary upgrade because a normal configuration reload retains the old binary in memory.\u003c/p\u003e\n"},{"n":25,"title":"VMware vCenter Hit by Another Critical 9.8-Rated Auth Bypass Flaw After Zero-Day Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/vmware-vcenter-hit-by-another-critical.html","time":"13:28","priority":"SHOULD READ","score":89,"tldr":"Broadcom released patches for 23 VMware flaws, led by CVE-2026-123903, a critical 9.8 vCenter Directory Service authentication-bypass vulnerability that can let network-accessible attackers gain unauthorized access. Organizations should promptly update affected vCenter, Cloud Foundation, and vSphere Foundation deployments, particularly after a separate critical vCenter zero-day was recently exploited.","briefOverview":"\u003cp\u003eBroadcom released patches for 23 vulnerabilities affecting VMware ESX, vCenter, Workstation, Fusion, and Avi Load Balancer. The most severe is CVE-2026-123903, a CVSS 9.8 flaw in VMware Directory Service that could allow an attacker with network access to vCenter to bypass authentication and gain unauthorized access. Broadcom credited researchers from QiAnXin, depthfirst, VulTeam, and ThreatBook with independently reporting the issue.\u003c/p\u003e\n\n\u003cp\u003eThe updates also address CVE-2026-123904, a CVSS 7.5 arbitrary file-write issue involving certain archives that could lead to code execution on the vCenter appliance, plus three VMware Directory Service denial-of-service flaws. Fixed releases include VMware Cloud Foundation and vSphere Foundation 9.1.2 and 9.0.2.0300, vCenter 8.0 U3m, and Cloud Foundation 5.2.5; vCenter 7.0 customers on extended support are instructed to contact Broadcom. The patches were issued days after a separate critical VMware Directory Service authentication-bypass flaw, CVE-2026-123890, was exploited as a zero-day by the suspected China-nexus group Armory Castle, although Broadcom said CVE-2026-123903 is unrelated and did not report active exploitation of the newly disclosed flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Broadcom released patches for 23 vulnerabilities affecting VMware ESX, vCenter, Workstation, Fusion, and Avi Load Balancer.","The most severe issue, CVE-2026-123903, is a CVSS 9.8 VMware Directory Service flaw that a network-accessible attacker could use to bypass authentication and gain unauthorized vCenter access.","Broadcom also fixed CVE-2026-123904, a CVSS 7.5 arbitrary file-write flaw in vCenter archive processing that could lead to code execution, along with three CVSS 7.5 VMware Directory Service denial-of-service flaws.","Fixes are available for supported VMware Cloud Foundation, vSphere Foundation, and vCenter releases, while vCenter 7.0 customers on extended support must contact Broadcom Support.","Broadcom said CVE-2026-123903 is distinct from CVE-2026-123890, another critical VMware Directory Service authentication-bypass flaw that was recently exploited as a zero-day by the suspected China-nexus group Armory Castle."],"insights":["VMware Directory Service is implicated in two separate critical authentication-bypass vulnerabilities disclosed within days of each other, and Broadcom explicitly stated that CVE-2026-123903 is unrelated to the recently exploited CVE-2026-123890.","Although Broadcom did not report active exploitation of the newly disclosed issues, CVE-2026-123903 can be used by an attacker with network access to vCenter to gain access without authentication.","The patch set addresses more than unauthorized access: CVE-2026-123904 can enable code execution through specially processed archives, while three other flaws can disrupt VMware Directory Service availability.","Organizations using vCenter 7.0 cannot obtain a normal listed fixed version and must contact Broadcom Support if they have an extended support contract."],"referencedReports":[{"title":"Broadcom Security Advisory","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/39626","publisher":"broadcom","context":"The article cites this Broadcom advisory for details of CVE-2026-123903 and the related VMware patches.","category":"advisory","primary":true}],"body":"\u003cp\u003eBroadcom released patches for 23 vulnerabilities affecting VMware ESX, vCenter, Workstation, Fusion, and Avi Load Balancer. The most severe is CVE-2026-123903, a CVSS 9.8 flaw in VMware Directory Service that could allow an attacker with network access to vCenter to bypass authentication and gain unauthorized access. Broadcom credited researchers from QiAnXin, depthfirst, VulTeam, and ThreatBook with independently reporting the issue.\u003c/p\u003e\n\n\u003cp\u003eThe updates also address CVE-2026-123904, a CVSS 7.5 arbitrary file-write issue involving certain archives that could lead to code execution on the vCenter appliance, plus three VMware Directory Service denial-of-service flaws. Fixed releases include VMware Cloud Foundation and vSphere Foundation 9.1.2 and 9.0.2.0300, vCenter 8.0 U3m, and Cloud Foundation 5.2.5; vCenter 7.0 customers on extended support are instructed to contact Broadcom. The patches were issued days after a separate critical VMware Directory Service authentication-bypass flaw, CVE-2026-123890, was exploited as a zero-day by the suspected China-nexus group Armory Castle, although Broadcom said CVE-2026-123903 is unrelated and did not report active exploitation of the newly disclosed flaws.\u003c/p\u003e\n"},{"n":21,"title":"WHMCS SQL Injection Could Expose Customer Data and Admin Password Hashes without Login","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/whmcs-sql-injection-flaw-could-expose.html","time":"08:34","priority":"SHOULD READ","score":88,"tldr":"WHMCS has patched a critical unauthenticated SQL injection flaw, CVE-2026-82981, that could let internet attackers extract customer data and administrator password hashes. Self-hosted users should upgrade immediately, while the separate email-campaign flaw also requires deleting active or scheduled campaigns and clearing the template cache.","briefOverview":"\u003cp\u003eWHMCS disclosed and patched CVE-2026-82981, a CVSS 8.7 SQL injection flaw in its shopping cart that requires no login. Anyone able to load the shopping cart of a vulnerable internet-facing installation could retrieve customer records and administrator account records containing password hashes. The potentially exposed information includes clients\u0026rsquo; personal, billing, and support data. WHMCS said it has not reported attacks using this or the other two disclosed flaws.\u003c/p\u003e\n\n\u003cp\u003eFixed releases include WHMCS 9.0.10 and 8.13.8, while the advisory identifies 9.1.2 as the fix for the 9.1 series; installations on versions 8.0 through 8.12 must upgrade to a supported fixed release. WHMCS Cloud installations are updated automatically, but self-hosted administrators must install updates themselves. WHMCS also disclosed CVE-2026-82979, an SQL injection requiring a logged-in client with View \u0026amp; Manage Contacts permission, and CVE-2026-93700, an email-campaign issue that could enable a logged-in client to read sensitive configuration files and run code on the server. For CVE-2026-93700, administrators are instructed to delete planned or ongoing email campaigns, clear the template cache, and update to a fixed release.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WHMCS disclosed CVE-2026-82981, an unauthenticated SQL injection flaw in its shopping cart that could expose customer records and administrator password hashes.","WHMCS released fixes in versions 9.0.10 and 8.13.8, while the advisory identifies version 9.1.2 as the fixed release for the 9.1 series.","Installations running WHMCS 8.0 through 8.12 must upgrade to a fixed supported release, while WHMCS Cloud installations are updated automatically.","A second SQL injection flaw, CVE-2026-82979, requires a logged-in client with View \u0026 Manage Contacts permission and could expose other customers' information and administrator password hashes.","CVE-2026-93700 affects email campaigns and could allow a logged-in client to read sensitive server configuration files and run code on the server; WHMCS advises deleting planned or active campaigns, clearing the template cache, and updating."],"insights":["The most severe exposure path does not require an account: anyone able to access the shopping cart of a vulnerable WHMCS installation could retrieve customer information and administrator password hashes.","Although stolen password hashes are not usable passwords, the article notes that they can be targeted for offline cracking.","WHMCS’s advisory lists version 9.1.2 as the fix for the 9.1 series, but that build was not present on the 9.1 release-notes page when the article was published.","For the email-campaign flaw, WHMCS instructs administrators to delete every planned or active campaign and clear the template cache in addition to updating, but the advisory does not explain why those extra steps are necessary."],"referencedReports":[{"title":"CVE-2026-82981 WHMCS Security Update 2026-11-23","url":"https://help.whmcs.com/m/125386/l/2151347-cve-2026-82981-whmcs-security-update-2026-11-23","publisher":"whmcs","context":"The article cites this advisory for the unauthenticated shopping-cart SQL injection and the fixed 9.1.2 release.","category":"advisory","primary":true},{"title":"CVE-2026-82979 WHMCS Security Update 2026-11-23","url":"https://help.whmcs.com/m/125386/l/2151340-cve-2026-82979-whmcs-security-update-2026-11-23","publisher":"whmcs","context":"The article cites this advisory for details of the authenticated Client Area SQL injection flaw.","category":"advisory","primary":true},{"title":"CVE-2026-93700 WHMCS Security Update 2026-11-23","url":"https://help.whmcs.com/m/125386/l/2151351-cve-2026-93700-whmcs-security-update-2026-11-23","publisher":"whmcs","context":"The article cites this advisory for the email-campaign flaw and its required cleanup steps.","category":"advisory","primary":true},{"title":"WHMCS May advisory","url":"https://help.whmcs.com/m/125386/l/2073908","publisher":"whmcs","context":"The article references this advisory as describing a Client Area authorization flaw patched on May 12.","category":"advisory","primary":false},{"title":"CVE-2026-67399 WHMCS Security Update 2026-09-03","url":"https://help.whmcs.com/m/125386/l/2118034-cve-2026-67399-whmcs-security-update-2026-09-03","publisher":"whmcs","context":"The article references this advisory as describing an unauthenticated remote code execution flaw patched on September 3.","category":"advisory","primary":false}],"body":"\u003cp\u003eWHMCS disclosed and patched CVE-2026-82981, a CVSS 8.7 SQL injection flaw in its shopping cart that requires no login. Anyone able to load the shopping cart of a vulnerable internet-facing installation could retrieve customer records and administrator account records containing password hashes. The potentially exposed information includes clients\u0026rsquo; personal, billing, and support data. WHMCS said it has not reported attacks using this or the other two disclosed flaws.\u003c/p\u003e\n\n\u003cp\u003eFixed releases include WHMCS 9.0.10 and 8.13.8, while the advisory identifies 9.1.2 as the fix for the 9.1 series; installations on versions 8.0 through 8.12 must upgrade to a supported fixed release. WHMCS Cloud installations are updated automatically, but self-hosted administrators must install updates themselves. WHMCS also disclosed CVE-2026-82979, an SQL injection requiring a logged-in client with View \u0026amp; Manage Contacts permission, and CVE-2026-93700, an email-campaign issue that could enable a logged-in client to read sensitive configuration files and run code on the server. For CVE-2026-93700, administrators are instructed to delete planned or ongoing email campaigns, clear the template cache, and update to a fixed release.\u003c/p\u003e\n"},{"n":23,"title":"Microsoft Fixes Azure API Management Classic Flaw as Actor Targets Customer Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/microsoft-fixes-azure-api-management.html","time":"10:44","priority":"SHOULD READ","score":86,"tldr":"Microsoft fixed an Azure API Management Classic-tier flaw that may have let unauthorized actors access stored secrets, subscription keys, and management API tokens in improperly configured instances. Norway’s NSM said the issue has affected multiple organizations, including energy companies, and urged customers to identify and rotate exposed credentials.","briefOverview":"\u003cp\u003eMicrosoft fixed a security issue in Azure API Management (APIM) Classic tiers after identifying it on November 18, 2026 and closing the access path the following day. The issue could have allowed unauthorized access to certain management functions when affected services were not configured according to Microsoft’s documented security best practices. Microsoft said that an unauthorized party could have accessed secrets stored in APIM Classic instances before the issue was identified, while APIM v2 tiers were not affected.\u003c/p\u003e\n\n\u003cp\u003eNorway’s National Security Authority (NSM) said an unknown actor had actively sought access tokens, secrets, and named values in APIM, affecting multiple Norwegian businesses, including energy companies Equinor and Skagerak Energi. Potentially exposed data included Named Values secrets, client secrets for identity providers and OpenID Connect providers, subscription keys, and tokens used for direct management APIs. NSM said it had not seen evidence of impact on Norwegian businesses so far, but that the extent of exploitation remains uncertain; Microsoft released guidance on November 21, 2026 to help customers identify and rotate configured credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft identified and closed an access path affecting Azure API Management Classic tiers on November 19, 2026.","The issue could have allowed an unauthorized party to access secrets stored in Azure API Management Classic instances that were not configured according to Microsoft’s documented security best practices.","Potentially exposed information included Named Values secrets, identity-provider and OpenID Connect client secrets, subscription keys, and tokens for direct management APIs.","Norway’s National Security Authority said an unknown actor had actively sought access tokens, secrets, and Named Values in Azure API Management, affecting multiple Norwegian businesses including Equinor and Skagerak Energi.","Microsoft released guidance on November 21, 2026 to help customers identify and rotate secrets and credentials configured in their Azure API Management instances."],"insights":["The issue was limited to Azure API Management Classic tiers; Azure API Management v2 tiers were not affected.","Closing the access path does not eliminate the risk from secrets that may already have been viewed, which is why Microsoft issued guidance to identify and rotate credentials.","The practical impact of a potentially exposed credential depends on its permissions and whether it remains valid, meaning it could affect the separate service that credential protects.","Norway’s National Security Authority said the full extent of exploitation remains uncertain, despite observing an unknown actor actively seeking sensitive values in affected systems."],"referencedReports":[{"title":"NSM deler tiltak mot sårbarhet i Azure API Management","url":"https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management","publisher":"norway's-national-security-authority","context":"The article cites NSM’s advisory describing an unknown actor seeking tokens, secrets, and named values in Azure API Management.","category":"advisory","primary":true},{"title":"Critical Security Advisory Affecting APIM","url":"https://www.reddit.com/r/sysadmin/comments/1y2n689/critical_security_advisory_affecting_apim/","publisher":"microsoft","context":"The article references a non-public Microsoft advisory stating that Azure API Management Classic tiers were affected while v2 tiers were not.","category":"advisory","primary":true},{"title":"Rotating credentials in Azure API Management","url":"https://techcommunity.microsoft.com/blog/integrationsonazureblog/rotating-credentials-in-azure-api-management/4575478","publisher":"microsoft","context":"The article cites Microsoft guidance for identifying and rotating secrets and credentials configured in affected Azure API Management instances.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft fixed a security issue in Azure API Management (APIM) Classic tiers after identifying it on November 18, 2026 and closing the access path the following day. The issue could have allowed unauthorized access to certain management functions when affected services were not configured according to Microsoft’s documented security best practices. Microsoft said that an unauthorized party could have accessed secrets stored in APIM Classic instances before the issue was identified, while APIM v2 tiers were not affected.\u003c/p\u003e\n\n\u003cp\u003eNorway’s National Security Authority (NSM) said an unknown actor had actively sought access tokens, secrets, and named values in APIM, affecting multiple Norwegian businesses, including energy companies Equinor and Skagerak Energi. Potentially exposed data included Named Values secrets, client secrets for identity providers and OpenID Connect providers, subscription keys, and tokens used for direct management APIs. NSM said it had not seen evidence of impact on Norwegian businesses so far, but that the extent of exploitation remains uncertain; Microsoft released guidance on November 21, 2026 to help customers identify and rotate configured credentials.\u003c/p\u003e\n"},{"n":34,"title":"Volant Manticore: Flying Under the Radar","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/volant-manticore-flying-under-the-radar/","time":"14:13","priority":"SHOULD READ","score":86,"tldr":"Check Point Research identified Volant Manticore, a likely Iran-linked espionage group with ties to former MuddyWater operators, targeting Cyprus and recently Saudi healthcare organizations. The group uses the IPFS-based KuboShell backdoor, the Homa framework, phishing, credential harvesting, and remote-management tools to gain and maintain access.","briefOverview":"\u003cp\u003eCheck Point Research identified Volant Manticore, a previously undocumented Iran-nexus espionage group assessed to be historically linked to Iran’s Ministry of Intelligence and Security. The group primarily targeted Cyprus, including telecommunications companies, airlines, critical infrastructure, and a likely government entity, before shifting toward Saudi Arabian organizations in September 2026, particularly healthcare providers. Researchers assess with medium confidence that the cluster consists of former MuddyWater operators operating separately, based on legacy tooling, tradecraft overlaps, distinct targeting, and separate infrastructure.\u003c/p\u003e\n\n\u003cp\u003eVolant Manticore uses phishing lures such as fake CVs and healthcare-themed archives to deliver KuboShell, a Windows backdoor that uses IPFS and the Pinata pinning service for command-and-control communications. KuboShell performs basic reconnaissance and can download the Homa Framework, a multi-stage PowerShell and JavaScript framework whose final-stage client closely resembles MuddyWater’s older MuddyC2Go client. The group also used remote-management tools including NetLock RMM, N-able RMM, and MeshCentral, along with infrastructure for credential harvesting. Its Saudi campaign displayed signs of hurried deployment, including debug strings in a KuboShell sample, reused Cyprus-themed infrastructure, and an exposed directory on a Saudi-based server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research identified Volant Manticore as a previously undocumented Iran-nexus threat group that it assesses is historically linked to Iran’s Ministry of Intelligence and Security and has multiple overlaps with MuddyWater.","Volant Manticore used fake CVs and healthcare-themed phishing archives to deliver the IPFS-based KuboShell backdoor, remote-management tools, and credential-harvesting infrastructure.","KuboShell uses Pinata’s IPFS pinning service for command-and-control, identifies hosts through their MAC addresses, executes received PowerShell commands, and polls for new commands every 60 seconds.","The group’s Homa Framework uses a multi-stage PowerShell and JavaScript infection chain whose third-stage client closely resembles MuddyWater’s older MuddyC2Go framework.","The group primarily targeted Cypriot telecommunications companies, airlines, and likely government entities before shifting toward Saudi Arabian targets, including healthcare organizations, in September 2026."],"insights":["KuboShell acts as a preliminary access check: operators use it for basic system reconnaissance before deciding whether to download the more capable Homa Framework.","The operators accidentally sent framework-specific commands such as \"list,\" \"persist,\" and \"payload\" to KuboShell even though they are not valid PowerShell commands, indicating they likely operated multiple command interfaces.","Testing activity exposed separate VirtualBox and VMware environments, including machines with Fortinet SSL VPN adapters that may indicate access to victim networks through enterprise VPN connections.","The Saudi-focused campaign showed signs of rapid deployment, including debug strings left in KuboShell, reuse of Cyprus-themed infrastructure, and an exposed open directory on a newly provisioned Saudi-based server."],"referencedReports":[{"title":"Iranian Government-Sponsored Actors Conduct Cyber Operations Against Global Government and Commercial Networks","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-055a","publisher":"cisa","context":"The article cites this CISA advisory for the link between MuddyWater and Iran’s Ministry of Intelligence and Security.","category":"advisory","primary":false},{"title":"PhonyC2: Revealing a New Malicious Command \u0026 Control Framework by MuddyWater","url":"https://www.deepinstinct.com/blog/phonyc2-revealing-a-new-malicious-command-control-framework-by-muddywater","publisher":"deep-instinct","context":"The article references this technical analysis when noting that commands mistakenly sent to KuboShell are known commands in MuddyWater C2 frameworks.","category":"research","primary":false},{"title":"MuddyC2Go: Latest C2 Framework Used by Iranian APT MuddyWater Spotted in Israel","url":"https://www.deepinstinct.com/blog/muddyc2go-latest-c2-framework-used-by-iranian-apt-muddywater-spotted-in-israel","publisher":"deep-instinct","context":"The article uses this analysis to compare the Homa Framework’s JavaScript client with MuddyWater’s MuddyC2Go framework.","category":"research","primary":false},{"title":"Muddy Advanced Persistent Teacher","url":"https://www.pwc.com/gx/en/issues/cybersecurity/cyber-threat-intelligence/muddy-advanced-persistent-teacher.html","publisher":"pwc","context":"The article cites this research in its discussion of links between key MuddyWater figures and Ravin Academy.","category":"research","primary":false},{"title":"Crossed Wires: A Case Study in Iranian Espionage and Attribution","url":"https://www.proofpoint.com/us/blog/threat-insight/crossed-wires-case-study-iranian-espionage-and-attribution","publisher":"proofpoint","context":"The article references this threat research regarding shared TTPs between TA450, also known as MuddyWater, and UNK_SmudgedSerpent.","category":"research","primary":false},{"title":"MuddyWater’s Light First Stager Targetting Middle East","url":"https://lab52.io/blog/muddywaters-light-first-stager-targetting-middle-east/","publisher":"lab52","context":"The article cites this technical analysis as prior evidence associating the username \"pc\" with MuddyWater phishing activity.","category":"research","primary":false},{"title":"MuddyWater: Snakes by the Riverbank","url":"https://www.welivesecurity.com/en/eset-research/muddywater-snakes-riverbank/","publisher":"eset","context":"The article cites this technical analysis as prior evidence associating the username \"pc\" with MuddyWater malware development.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research identified Volant Manticore, a previously undocumented Iran-nexus espionage group assessed to be historically linked to Iran’s Ministry of Intelligence and Security. The group primarily targeted Cyprus, including telecommunications companies, airlines, critical infrastructure, and a likely government entity, before shifting toward Saudi Arabian organizations in September 2026, particularly healthcare providers. Researchers assess with medium confidence that the cluster consists of former MuddyWater operators operating separately, based on legacy tooling, tradecraft overlaps, distinct targeting, and separate infrastructure.\u003c/p\u003e\n\n\u003cp\u003eVolant Manticore uses phishing lures such as fake CVs and healthcare-themed archives to deliver KuboShell, a Windows backdoor that uses IPFS and the Pinata pinning service for command-and-control communications. KuboShell performs basic reconnaissance and can download the Homa Framework, a multi-stage PowerShell and JavaScript framework whose final-stage client closely resembles MuddyWater’s older MuddyC2Go client. The group also used remote-management tools including NetLock RMM, N-able RMM, and MeshCentral, along with infrastructure for credential harvesting. Its Saudi campaign displayed signs of hurried deployment, including debug strings in a KuboShell sample, reused Cyprus-themed infrastructure, and an exposed directory on a Saudi-based server.\u003c/p\u003e\n"},{"n":8,"title":"New Inception extortion gang launches large-scale vishing campaign","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-inception-extortion-gang-launches-large-scale-vishing-campaign/","time":"20:21","priority":"SHOULD READ","score":85,"tldr":"The new Inception extortion group is running a large-scale phone-based phishing campaign using fake Okta and NetIQ/OpenText login sites to steal SSO credentials from major organizations. Researchers and Okta assess it is likely a rebrand or continuation of the ShinyHunters-linked O-UNC-053 cluster, despite the group's denial.","briefOverview":"\u003cp\u003eA newly formed data-extortion group called Inception has been linked to a large-scale campaign aimed at stealing single sign-on credentials from global companies. The group appeared publicly on November 17 and listed seven alleged victims, including AMD, PepsiCo, Cigna Healthcare, AutoZone, and Lucid Motors, though none has confirmed a breach. ReversingLabs says the group had been operating since late October and identified 21 domains used for single sign-on phishing, 41 believed to support the campaign, and four additional suspected domains. The infrastructure impersonates dozens of major brands, but the existence of those domains does not prove those companies were breached or targeted.\u003c/p\u003e\n\n\u003cp\u003eThe campaign reportedly relies on phone-based social engineering and legal-themed fake sign-in sites that imitate Okta and NetIQ/OpenText Access Manager. Okta assessed that the activity is very likely connected to O-UNC-053, a cluster previously associated with ShinyHunters, citing consistent infrastructure and methods before and after Inception\u0026rsquo;s leak site appeared. Inception denied any affiliation with previous groups, saying shared targets, domain-registration services, content-delivery networks, and circulating private tools do not establish a connection. ReversingLabs recommends phishing-resistant sign-in methods such as FIDO2 security keys and passkeys, stronger help-desk identity checks, and review of DNS, proxy, and identity-provider logs dating to October 21, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The newly formed Inception data-extortion group has been linked to a large-scale campaign targeting single sign-on credentials through phone-based social engineering and fake authentication sites.","Inception appeared publicly on November 17 and listed seven alleged victims, including AMD, PepsiCo, Cigna Healthcare, AutoZone, and Lucid Motors, though none has publicly confirmed a breach.","ReversingLabs identified 21 domains used for single sign-on phishing, 41 domains believed to support the campaign, and four additional domains with suspected use.","Okta assessed that the Inception activity is very likely a rebranding of O-UNC-053, a cluster previously associated with ShinyHunters, based on consistent infrastructure and tactics.","ReversingLabs recommends phishing-resistant sign-in methods such as FIDO2 security keys and passkeys, stronger help-desk identity checks, and review of relevant logs dating back to October 21, 2026."],"insights":["The presence of phishing domains impersonating a company does not establish that the company was breached or even targeted, and the article notes that none of the many impersonated firms had recently disclosed a related incident.","Okta linked the activity to the previously ShinyHunters-associated O-UNC-053 cluster because its infrastructure and methods remained consistent before and after the new Inception leak site appeared.","The campaign relies on phone-based deception rather than email, making help-desk caller-verification procedures a central defensive control alongside stronger sign-in methods.","Inception publicly denied links to other groups and argued that shared domain-registration, content-delivery services, and circulating private tools do not by themselves prove an operational relationship."],"referencedReports":[{"title":"Threat Researchers Notebook: SSO vishing campaign associated with emerging Inception extortion group","url":"http://www.reversinglabs.com/blog/threat-researchers-notebook-sso-vishing-campaign-associated-with-emerging-inception-extortion-group","publisher":"reversinglabs","context":"The article cites ReversingLabs' threat research as the source for details on Inception's phishing infrastructure and defensive recommendations.","category":"research","primary":true},{"title":"Former ShinyHunters cluster moves to new Inception site","url":"https://www.okta.com/en-se/blog/threat-intelligence/former_shinyhunters_cluster_moves_to_new_inception-site/","publisher":"okta","context":"The article cites Okta's report linking Inception activity to the ShinyHunters-associated O-UNC-053 cluster based on consistent infrastructure and tactics.","category":"research","primary":true}],"body":"\u003cp\u003eA newly formed data-extortion group called Inception has been linked to a large-scale campaign aimed at stealing single sign-on credentials from global companies. The group appeared publicly on November 17 and listed seven alleged victims, including AMD, PepsiCo, Cigna Healthcare, AutoZone, and Lucid Motors, though none has confirmed a breach. ReversingLabs says the group had been operating since late October and identified 21 domains used for single sign-on phishing, 41 believed to support the campaign, and four additional suspected domains. The infrastructure impersonates dozens of major brands, but the existence of those domains does not prove those companies were breached or targeted.\u003c/p\u003e\n\n\u003cp\u003eThe campaign reportedly relies on phone-based social engineering and legal-themed fake sign-in sites that imitate Okta and NetIQ/OpenText Access Manager. Okta assessed that the activity is very likely connected to O-UNC-053, a cluster previously associated with ShinyHunters, citing consistent infrastructure and methods before and after Inception\u0026rsquo;s leak site appeared. Inception denied any affiliation with previous groups, saying shared targets, domain-registration services, content-delivery networks, and circulating private tools do not establish a connection. ReversingLabs recommends phishing-resistant sign-in methods such as FIDO2 security keys and passkeys, stronger help-desk identity checks, and review of DNS, proxy, and identity-provider logs dating to October 21, 2026.\u003c/p\u003e\n"},{"n":14,"title":"Lawmakers warn ID verification companies to bolster security after September hack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/idscan-data-breach-warning-congressional-letter","time":"17:49","priority":"SHOULD READ","score":85,"tldr":"U.S. lawmakers urged ID verification firms to strengthen data security after an IDScan breach exposed scans of more than 150 million identity documents for sale on the Russia-linked Nexus marketplace. The incident highlights the long-term identity-fraud and national-security risks of retaining detailed ID scans.","briefOverview":"\u003cp\u003eA bipartisan group of six federal lawmakers sent letters to identity verification companies after the September breach of IDScan exposed scans of more than 150 million driver’s licenses and other identification documents. The stolen data, stored in IDScan’s cloud platform, was offered for sale on the Russia-linked Nexus dark web marketplace and prompted an FBI investigation. The letters sought detailed answers about how companies handle sensitive customer data and protect it from increasingly capable, AI-enabled cyberattacks.\u003c/p\u003e\n\n\u003cp\u003eLawmakers warned that the data could enable identity theft and fraud and could allow foreign adversaries to infer Americans’ behavior through commercial data connected to government credentials. In addition to identification documents, the breach exposed nearly 600,000 medical cards, employment authorizations, and other sensitive records, including scans belonging to high-ranking military and intelligence officials. They urged companies to proactively look for system weaknesses, use zero-trust architecture, and reduce the collection, sharing, and storage of personally identifiable information.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A bipartisan group of six federal lawmakers sent letters to identity verification companies urging stronger data-security practices after the September IDScan breach.","The IDScan breach exposed scans of more than 150 million driver’s licenses and other identification documents, which were offered for sale on the dark web.","The stolen data included nearly 600,000 medical cards, employment authorizations, and other sensitive records, with many medical cards reportedly tied to marijuana dispensaries.","Lawmakers said the stolen records included documents belonging to high-ranking military and intelligence officials and warned that the consequences could be widespread and persistent.","The letters called on identity verification companies to seek out system weaknesses, use a model that verifies every access request, and reduce the collection, sharing, and storage of personally identifying information."],"insights":["Brian Krebs reported that more than two dozen identity verification companies retain scanned IDs, often by default, and that customers may have to pay extra to stop collection after identity checks are completed.","The Nexus marketplace reportedly began taking the data more than a year before authorities discovered it online, illustrating how stolen identity records can remain undetected for extended periods.","The leaked license scans included ultraviolet, infrared, and other detailed images, which lawmakers said intensified concerns about criminal misuse.","Lawmakers emphasized reducing the collection, sharing, and storage of personal information as a way to limit harm, rather than relying only on security controls after data has been retained."],"referencedReports":[],"body":"\u003cp\u003eA bipartisan group of six federal lawmakers sent letters to identity verification companies after the September breach of IDScan exposed scans of more than 150 million driver’s licenses and other identification documents. The stolen data, stored in IDScan’s cloud platform, was offered for sale on the Russia-linked Nexus dark web marketplace and prompted an FBI investigation. The letters sought detailed answers about how companies handle sensitive customer data and protect it from increasingly capable, AI-enabled cyberattacks.\u003c/p\u003e\n\n\u003cp\u003eLawmakers warned that the data could enable identity theft and fraud and could allow foreign adversaries to infer Americans’ behavior through commercial data connected to government credentials. In addition to identification documents, the breach exposed nearly 600,000 medical cards, employment authorizations, and other sensitive records, including scans belonging to high-ranking military and intelligence officials. They urged companies to proactively look for system weaknesses, use zero-trust architecture, and reduce the collection, sharing, and storage of personally identifiable information.\u003c/p\u003e\n"},{"n":36,"title":"Recent Trends and Tactics of Agentic AI Attacks","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/autonomous-ai-agent-threat-campaigns/","time":"15:00","priority":"SHOULD READ","score":85,"tldr":"Unit 42 reports that attackers are using autonomous AI agents in real-world campaigns to rapidly perform reconnaissance, credential theft, privilege escalation and lateral movement after gaining access through vulnerable web applications. The techniques are familiar, but AI agents dramatically increase speed and adaptability while leaving detectable fingerprints such as unusually rapid command execution, structured output delimiters and reasoning-style code comments.","briefOverview":"\u003cp\u003eUnit 42 reported tracking more than 10 global campaigns from July through September 2026 in which attackers used autonomous AI agents to accelerate intrusions. Human operators typically selected targets and obtained initial access through web shells placed on vulnerable web applications, then AI agents performed reconnaissance, credential harvesting, privilege escalation and lateral movement. The campaigns affected organizations in government, logistics, hospitality, manufacturing, agriculture and education.\u003c/p\u003e\n\n\u003cp\u003eThe observed agents executed hundreds of unique commands in minutes, reducing an attack lifecycle that could take days or weeks to hours. They adapted to target conditions, including switching to AWS IMDSv2 after IMDSv1 was blocked, trying multiple privilege-escalation approaches and moving between Linux, Windows and cloud environments. Although the agents produced unique, target-specific scripts and used open-source exploits, they also left detectable signs such as rapid command rates, structured output headers, large volumes of Base64-encoded payloads and reasoning-style comments in scripts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 identified and tracked more than 10 global campaigns between July and September 2026 in which attackers used autonomous AI agents after gaining initial access through web shells on vulnerable web applications.","The observed AI agents conducted reconnaissance, credential harvesting, privilege escalation and lateral movement at machine speed, sometimes executing hundreds of unique commands within minutes.","In one analyzed attack, the median gap between human-operated reconnaissance commands was 23.9 seconds, while it fell to 1.4 seconds after an AI agent took over.","The campaigns showed adaptive behavior, including switching from AWS IMDSv1 to IMDSv2 when the first metadata-service approach was blocked and trying multiple privilege-escalation methods when earlier attempts failed.","Researchers observed recurring signs of AI-operated activity, including structured command-output headers, large volumes of unique Base64-encoded payloads and conversational reasoning comments embedded in scripts."],"insights":["The AI agents’ speed and volume made them less stealthy: their rapid command execution, structured output headers and reasoning-style script comments created behavioral clues that human operators are less likely to leave behind.","Despite their broad reach, the observed campaigns did not rely on sophisticated custom backdoors or compiled malware; instead, agents repeatedly created short, target-specific scripts and used existing open-source tools and public exploits.","The most successful intrusions used a division of labor in which humans selected targets and strategic goals while AI agents independently carried out the detailed technical work and reported results back in machine-readable formats.","Although target-specific AI-generated payloads make signature-based attribution harder, investigators found useful attribution evidence in reused command-and-control infrastructure, exposed orchestration-platform hosting and accidental local file paths from the attackers’ environment."],"referencedReports":[{"title":"How AI Agents Turned One Exposed Endpoint into a Server Takeover","url":"https://reliaquest.com/blog/threat-spotlight-how-ai-agents-turned-one-exposed-endpoint-into-a-server-takeover/","publisher":"reliaquest","context":"The article cites ReliaQuest threat research as documenting the same IP address as a staging and reconnaissance node in a separate agent-driven attack.","category":"research","primary":false}],"body":"\u003cp\u003eUnit 42 reported tracking more than 10 global campaigns from July through September 2026 in which attackers used autonomous AI agents to accelerate intrusions. Human operators typically selected targets and obtained initial access through web shells placed on vulnerable web applications, then AI agents performed reconnaissance, credential harvesting, privilege escalation and lateral movement. The campaigns affected organizations in government, logistics, hospitality, manufacturing, agriculture and education.\u003c/p\u003e\n\n\u003cp\u003eThe observed agents executed hundreds of unique commands in minutes, reducing an attack lifecycle that could take days or weeks to hours. They adapted to target conditions, including switching to AWS IMDSv2 after IMDSv1 was blocked, trying multiple privilege-escalation approaches and moving between Linux, Windows and cloud environments. Although the agents produced unique, target-specific scripts and used open-source exploits, they also left detectable signs such as rapid command rates, structured output headers, large volumes of Base64-encoded payloads and reasoning-style comments in scripts.\u003c/p\u003e\n"},{"n":22,"title":"Okta Links ShinyHunters-Associated Vishing Group to New INCEPTION Data Leak Site","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/okta-links-shinyhunters-associated.html","time":"13:28","priority":"SHOULD READ","score":84,"tldr":"Okta says the ShinyHunters-linked O-UNC-053 vishing group appears to be using a new INCEPTION leak site after ShinyHunters went offline. The group continues to impersonate legal departments through lookalike domains, trick victims into disclosing credentials or approving MFA prompts, and steal SaaS data for extortion.","briefOverview":"\u003cp\u003eOkta says the O-UNC-053 threat cluster, previously associated with ShinyHunters data-leak-site postings, may have moved to a new leak site called INCEPTION. The group has been tracked since March 2026 and continues to target organizations with phone-based scams that lead to account takeovers, data theft, and extortion. It is unclear whether the data published on INCEPTION is authentic, whether O-UNC-053 operates the site, or what its exact relationship with ShinyHunters is.\u003c/p\u003e\n\n\u003cp\u003eThe operators call targeted users and persuade them to enter login details into phishing pages, disclose one-time codes, or approve multi-factor authentication prompts. Since October 2026, the group has used legal-themed lookalike domains, often registered shortly before a campaign, to imitate target organizations and present tailored sign-in pages. Okta said affected sectors include technology, healthcare, biotechnology, financial services, insurance, entertainment, gaming, retail, transportation, hospitality, and legal, while researchers observed more than 70 related domains targeting organizations across multiple industries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Okta assesses that the vishing cluster O-UNC-053, previously associated with ShinyHunters leak-site postings, may have shifted to the INCEPTION data leak site.","O-UNC-053 operators use phone-based social engineering to persuade targets to enter credentials on phishing pages, share one-time codes, or approve multi-factor authentication prompts.","The group has used legal-themed lookalike domains, such as legal-\u003ctarget\u003e.com and \u003ctarget\u003e-legal.com, since October 2026, with domains often registered shortly before campaigns begin.","Okta said O-UNC-053 targets spanned technology, healthcare, biotechnology, financial services, insurance, entertainment, gaming, retail, transportation, hospitality, and legal sectors.","It remains unclear whether data posted on the INCEPTION site is authentic, whether O-UNC-053 operates the site, and what its exact relationship is with ShinyHunters."],"insights":["The phishing kit described by Okta is not designed to defeat phishing-resistant login methods such as passkeys and Okta FastPass, even though it can capture passwords, one-time codes, and approved login prompts.","The legal-themed phishing sites reportedly filter visitors: intended targets receive tailored fake login content, while other visitors are sent to the organization’s real Okta or NetIQ sign-in page.","During Okta’s March-to-September 2026 tracking period, names of targeted organizations appeared on the ShinyHunters leak site from one to 28 days after the phishing infrastructure was registered.","More than 70 legal-themed domains were observed since October 2026, with domains created specifically for individual targets across several industries and often registered in rapid evening batches behind Cloudflare."],"referencedReports":[{"title":"Former ShinyHunters Cluster Moves to New INCEPTION Site","url":"https://www.okta.com/blog/threat-intelligence/former_shinyhunters_cluster_moves_to_new_inception_site/","publisher":"okta","context":"Okta’s Threat Intelligence report attributes ongoing vishing and account-takeover activity to O-UNC-053 and links the cluster to the INCEPTION data leak site.","category":"research","primary":true},{"title":"Legal-themed Vishing Activity","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-11-23-Legal-themed-vishing-activity.txt","publisher":"palo-alto-networks-unit-42","context":"The article cites this Unit 42 alert as corroborating widespread vishing activity using legal-themed lookalike domains.","category":"advisory","primary":false}],"body":"\u003cp\u003eOkta says the O-UNC-053 threat cluster, previously associated with ShinyHunters data-leak-site postings, may have moved to a new leak site called INCEPTION. The group has been tracked since March 2026 and continues to target organizations with phone-based scams that lead to account takeovers, data theft, and extortion. It is unclear whether the data published on INCEPTION is authentic, whether O-UNC-053 operates the site, or what its exact relationship with ShinyHunters is.\u003c/p\u003e\n\n\u003cp\u003eThe operators call targeted users and persuade them to enter login details into phishing pages, disclose one-time codes, or approve multi-factor authentication prompts. Since October 2026, the group has used legal-themed lookalike domains, often registered shortly before a campaign, to imitate target organizations and present tailored sign-in pages. Okta said affected sectors include technology, healthcare, biotechnology, financial services, insurance, entertainment, gaming, retail, transportation, hospitality, and legal, while researchers observed more than 70 related domains targeting organizations across multiple industries.\u003c/p\u003e\n"},{"n":1,"title":"Turnitin discloses cyberattack affecting customer-facing systems","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/turnitin-discloses-cyberattack-affecting-customer-facing-systems/","time":"18:59","priority":"SHOULD READ","score":82,"tldr":"Turnitin disclosed unauthorized activity affecting certain customer-facing systems and is investigating with external cybersecurity specialists while notifying law enforcement and regulators. The company says services remain operational, but has not confirmed whether user data was accessed or stolen.","briefOverview":"\u003cp\u003eTurnitin disclosed unauthorized activity involving certain customer-facing systems and said it activated its incident response plan. The company is investigating with external cybersecurity specialists and has notified law enforcement and cyber regulators. CEO Chris Caren said Turnitin’s systems remain fully operational and safe to use.\u003c/p\u003e\n\n\u003cp\u003eTurnitin provides AI-generated writing detection, digital grading, academic integrity checks, and examination proctoring to more than 16,000 institutions across 185 countries, serving 71 million students. The company said the affected systems do not collect government identification credentials or institutional financial information. It has not disclosed whether user data was accessed or stolen, when the incident occurred, or how many people may be affected. Its status page shows no November 2026 incidents or disruptions, while Turnitin continues monitoring for further unauthorized activity.\u0
