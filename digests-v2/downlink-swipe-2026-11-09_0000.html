<script type="application/json" id="dl-articles">[{"n":34,"title":"Malicious bee-js npm Release and Swarm Desktop Releases Deliver SleepyDuck Ethereum C2 Backdoor","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/bee-js-compromise?utm_medium=feed","time":"14:52","priority":"MUST READ","score":96,"tldr":"Ethersphere’s GitHub release pipeline was compromised to publish a malicious bee-js npm package and signed, notarized Swarm Desktop release that downloaded and executed the SleepyDuck/EtherDuck backdoor. Users who installed bee-js 13.3.0 or ran Swarm Desktop 0.56.2 should treat their systems and Swarm wallet credentials as compromised.","briefOverview":"\u003cp\u003eOn November 9, 2026, a threat actor used Ethersphere’s own GitHub release automation to publish malicious versions of \u003ccode\u003e@ethersphere/bee-js\u003c/code\u003e 13.3.0 on npm and Swarm Desktop 0.56.2 on GitHub. The npm package remained available for about 75 minutes, while the Swarm Desktop release was public for roughly eight and a half hours. Both releases included code that contacted \u003ccode\u003eapi.frameworkmetrics.xyz\u003c/code\u003e, downloaded JavaScript, and ran it with the affected user’s privileges.\u003c/p\u003e\n\n\u003cp\u003eThe bee-js package was published through Ethersphere’s legitimate trusted-publishing workflow and had valid SLSA provenance, while the malicious macOS desktop app was signed with the project’s Developer ID and notarized by Apple. The release workflow permitted publishing from a release event without running its normal tests or confirming that the released commit came from the protected branch. Later payloads targeted Swarm Desktop configuration and wallet-key files, then could install persistent remote access on macOS and Linux or an unattended ScreenConnect client on Windows.\u003c/p\u003e\n\n\u003cp\u003eThe command infrastructure, Ethereum configuration contract, controlling wallet, and later-stage files matched those documented in the earlier SleepyDuck/EtherDuck malicious Open VSX extension campaign. People or CI jobs that installed bee-js 13.3.0 with install scripts enabled, and users who ran Swarm Desktop 0.56.2, should be treated as having executed attacker-controlled code. Ethersphere advised affected Swarm Desktop users to replace the software, assume node wallet credentials were stolen, move funds and related assets to a new key from a clean machine, and check for persistence artifacts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On November 9, 2026, attackers used Ethersphere’s GitHub automation to publish malicious @ethersphere/bee-js 13.3.0 to npm and a trojanized Swarm Desktop 0.56.2 release on GitHub.","Both malicious releases contained loaders that contacted api.frameworkmetrics.xyz and executed downloaded JavaScript with the privileges of the installing user or Electron application.","The bee-js package was published through Ethersphere’s legitimate trusted-publishing workflow with valid SLSA provenance, while the macOS Swarm Desktop build was signed with the project’s Developer ID and notarized by Apple.","The later-stage payloads stole Swarm Desktop configuration and wallet-key files, then could install a persistent remote shell on macOS and Linux or an unattended ScreenConnect client on Windows.","The campaign used the same Ethereum configuration contract, controlling wallet, payload files, and persistence names previously documented in the SleepyDuck/EtherDuck malicious Open VSX extension campaign."],"insights":["Valid build provenance, code signing, and Apple notarization did not establish that the released source had been reviewed, because Ethersphere’s legitimate workflows built and signed attacker-controlled commits.","The bee-js loader executed three times inside Ethersphere’s own npm publishing job, which had permission to obtain an OIDC identity token for trusted publishing.","The npm release workflow allowed a release event to publish even though its normal test and check jobs were skipped, and it did not verify that the released commit belonged to the protected upcoming branch.","Whether the bee-js loader ran for an end user depended on the package manager: npm 11 and earlier and older Yarn versions ran dependency install scripts by default, while npm 12, pnpm 10+, newer Yarn Berry, Bun, and Deno skipped unreviewed scripts by default.","Removing the Swarm Desktop 0.56.2 release did not revert computers that had already updated, because the application’s update service does not offer older versions."],"referencedReports":[{"title":"Ethersphere bee-js npm Compromise","url":"https://safedep.io/blog/ethersphere-bee-js-npm-compromise","publisher":"safedep","context":"The article links to SafeDep’s detailed public analysis of the incident and references SafeDep’s IOC list and downloaded payload files.","category":"research","primary":true}],"body":"\u003cp\u003eOn November 9, 2026, a threat actor used Ethersphere’s own GitHub release automation to publish malicious versions of \u003ccode\u003e@ethersphere/bee-js\u003c/code\u003e 13.3.0 on npm and Swarm Desktop 0.56.2 on GitHub. The npm package remained available for about 75 minutes, while the Swarm Desktop release was public for roughly eight and a half hours. Both releases included code that contacted \u003ccode\u003eapi.frameworkmetrics.xyz\u003c/code\u003e, downloaded JavaScript, and ran it with the affected user’s privileges.\u003c/p\u003e\n\n\u003cp\u003eThe bee-js package was published through Ethersphere’s legitimate trusted-publishing workflow and had valid SLSA provenance, while the malicious macOS desktop app was signed with the project’s Developer ID and notarized by Apple. The release workflow permitted publishing from a release event without running its normal tests or confirming that the released commit came from the protected branch. Later payloads targeted Swarm Desktop configuration and wallet-key files, then could install persistent remote access on macOS and Linux or an unattended ScreenConnect client on Windows.\u003c/p\u003e\n\n\u003cp\u003eThe command infrastructure, Ethereum configuration contract, controlling wallet, and later-stage files matched those documented in the earlier SleepyDuck/EtherDuck malicious Open VSX extension campaign. People or CI jobs that installed bee-js 13.3.0 with install scripts enabled, and users who ran Swarm Desktop 0.56.2, should be treated as having executed attacker-controlled code. Ethersphere advised affected Swarm Desktop users to replace the software, assume node wallet credentials were stolen, move funds and related assets to a new key from a clean machine, and check for persistence artifacts.\u003c/p\u003e\n"},{"n":5,"title":"Hackers exploit SSHole OpenSSH flaw to breach Linux systems","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-sshole-openssh-flaw-to-breach-linux-systems/","time":"16:04","priority":"MUST READ","score":95,"tldr":"Attackers are actively exploiting the SSHole flaw (CVE-2026-123158) in OpenSSH on certain musl-based Linux systems to bypass password-disabled accounts, steal credentials, and establish persistence. Administrators should upgrade to OpenSSH 10.6p2 or later and investigate anomalous password logins, SSH keys, and TAC Agent-related artifacts.","briefOverview":"\u003cp\u003eHackers are actively exploiting SSHole, tracked as CVE-2026-123158, to run commands, steal credentials, and establish continued access on affected Linux systems. The flaw affects certain musl-based systems, including Alpine Linux, and lets an attacker log in to accounts intended to be blocked from password sign-ins. Exploitation attempts began on November 5, when proof-of-concept code became available, and successful exploitation was recorded the following day. OpenSSH fixed the issue in version 10.6p2, released on November 5.\u003c/p\u003e\n\n\u003cp\u003eAn oversized password can cause musl’s password-hashing function to return an asterisk on error, which OpenSSH incorrectly accepts as matching an account password field set to an asterisk. GreyNoise observed attackers conducting system and container reconnaissance, querying cloud metadata services, attempting to access password hashes and root SSH keys, and changing authorized_keys files for persistent access. In one case, an attacker gained root privileges and installed TAC Agent, although it could not contact its command-and-control server. Administrators are advised to update OpenSSH or disable SSH password authentication on affected systems, and to look for unexpected successful password logins, unauthorized SSH keys, and TAC Agent files or startup services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are actively exploiting SSHole, tracked as CVE-2026-123158, to execute commands, steal credentials, and maintain access on affected Linux systems.","SSHole affects certain musl-based Linux systems, including Alpine Linux, by allowing oversized passwords to bypass login restrictions for accounts whose password field is set to an asterisk.","OpenSSH fixed the vulnerability in version 10.6p2 on November 5, and public exploit code became available about four hours later.","GreyNoise observed successful attacks that performed system and container checks, queried cloud metadata services, attempted to obtain password hashes and root SSH keys, and modified authorized_keys files.","Administrators are advised to update OpenSSH, disable SSH password authentication on affected systems, and check for unexpected password logins, unauthorized SSH keys, and TAC Agent files or startup services."],"insights":["Successful exploitation was recorded about 40 hours after the OpenSSH fix was released, showing that attacks began very soon after public exploit code became available.","The flaw does not affect accounts with valid password hashes and requires particular authentication settings, limiting exposure to specific configurations rather than every OpenSSH installation.","Although TAC Agent has no built-in mechanism to survive a restart, attackers attempted to compensate by creating a startup service.","One observed TAC Agent installation could not contact its command server and therefore never received a task, despite the attacker having gained root privileges."],"referencedReports":[{"title":"SSHole Events","url":"http://sshole.events.greynoise.io/","publisher":"greynoise","context":"The article cites GreyNoise telemetry documenting the first successful in-the-wild exploitation and observed post-compromise activity.","category":"research","primary":false},{"title":"CVE-2026-123158 Evidence","url":"https://previdian.com/CVE-2026-123158#evidence","publisher":"previdian","context":"The article cites Previdian sensor telemetry confirming successful SSHole exploitation attempts from multiple attacker IP addresses.","category":"research","primary":false}],"body":"\u003cp\u003eHackers are actively exploiting SSHole, tracked as CVE-2026-123158, to run commands, steal credentials, and establish continued access on affected Linux systems. The flaw affects certain musl-based systems, including Alpine Linux, and lets an attacker log in to accounts intended to be blocked from password sign-ins. Exploitation attempts began on November 5, when proof-of-concept code became available, and successful exploitation was recorded the following day. OpenSSH fixed the issue in version 10.6p2, released on November 5.\u003c/p\u003e\n\n\u003cp\u003eAn oversized password can cause musl’s password-hashing function to return an asterisk on error, which OpenSSH incorrectly accepts as matching an account password field set to an asterisk. GreyNoise observed attackers conducting system and container reconnaissance, querying cloud metadata services, attempting to access password hashes and root SSH keys, and changing authorized_keys files for persistent access. In one case, an attacker gained root privileges and installed TAC Agent, although it could not contact its command-and-control server. Administrators are advised to update OpenSSH or disable SSH password authentication on affected systems, and to look for unexpected successful password logins, unauthorized SSH keys, and TAC Agent files or startup services.\u003c/p\u003e\n"},{"n":17,"title":"France blames Iran for fridge cyberattacks, says some caused fires","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/france-blames-iran-for-fridge-cyberattacks","time":"18:45","priority":"MUST READ","score":94,"tldr":"France has formally attributed cyber sabotage of refrigeration systems at roughly 700 grocery stores—causing major food losses and at least 15 fires—to the IRGC-linked Shahid Kaveh/CyberAv3ngers group. Paris has summoned Iran’s ambassador, is seeking EU sanctions, and has opened a criminal investigation with requested international arrest warrants for alleged unit leaders.","briefOverview":"\u003cp\u003eFrench authorities have attributed cyber sabotage of refrigeration systems at around 700 grocery stores to Shahid Kaveh, an Iranian Revolutionary Guard Corps cyber unit also known as CyberAv3ngers. France said the incidents caused extensive food losses and at least 15 fires. A report from France’s Cyber Crisis Coordination Centre cited Farsi-language artifacts, tools, and infrastructure connected to reconnaissance of other industrial equipment. The affected businesses included major grocery chains, butchers, a slaughterhouse, and cooperative food-processing plants.\u003c/p\u003e\n\n\u003cp\u003eANSSI said the same hackers also targeted Schneider Electric equipment at several small hydroelectric facilities, though the resulting disruption was described as moderate. France summoned Iran’s ambassador, said it would pursue European sanctions, and opened a judicial investigation seeking international arrest warrants for the alleged leaders of the unit. The report did not address a separate early-November wave of refrigeration attacks that affected businesses in at least 11 European countries, including British meat suppliers and three French national blood-service sites. French authorities also linked another IRGC unit, Shahid Shoostari or Emennet Pasargad, to earlier operations against French interests, including an unsuccessful attempt to display anti-Israeli imagery on digital screens during the 2024 Paris Olympics.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["French authorities attributed cyber sabotage of refrigeration systems at about 700 grocery stores to Shahid Kaveh, an Iranian Revolutionary Guard Corps cyber unit also known as CyberAv3ngers.","France said the attacks caused extensive food losses and at least 15 fires, affecting large retail chains as well as smaller businesses such as butchers, a slaughterhouse, and food-processing cooperatives.","ANSSI also identified the same Iranian hackers targeting Schneider Electric equipment at several small hydroelectric facilities, although it described the resulting disruption as moderate.","France summoned Iran’s ambassador, plans to pursue European sanctions, and opened a judicial investigation that seeks international arrest warrants for Shahid Kaveh’s alleged leadership.","French authorities separately linked another IRGC unit, Shahid Shoostari or Emennet Pasargad, to prior operations against French interests, including an attempted disruption of digital displays during the 2024 Paris Olympics."],"insights":["The reported sabotage turned a remote intrusion into direct physical consequences, with refrigeration disruptions linked to food losses and at least 15 fires.","France’s attribution ties the alleged perpetrators to CyberAv3ngers, a group U.S. agencies had already associated with disruptions involving industrial equipment in multiple critical-infrastructure sectors.","The French report addressed the October refrigeration incidents but did not attribute the separate early-November wave that affected businesses in at least 11 European countries.","French authorities described Shahid Kaveh and Shahid Shoostari as operating under the same IRGC Electronic and Cyber Center, framing the incidents as part of a campaign against French interests dating back at least six years."],"referencedReports":[{"title":"CERTFR-2026-CTI-009","url":"https://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/","publisher":"france's-cyber-crisis-coordination-centre","context":"The article bases France's attribution of the refrigeration sabotage to the IRGC-linked Shahid Kaveh unit on this five-page report.","category":"research","primary":true}],"body":"\u003cp\u003eFrench authorities have attributed cyber sabotage of refrigeration systems at around 700 grocery stores to Shahid Kaveh, an Iranian Revolutionary Guard Corps cyber unit also known as CyberAv3ngers. France said the incidents caused extensive food losses and at least 15 fires. A report from France’s Cyber Crisis Coordination Centre cited Farsi-language artifacts, tools, and infrastructure connected to reconnaissance of other industrial equipment. The affected businesses included major grocery chains, butchers, a slaughterhouse, and cooperative food-processing plants.\u003c/p\u003e\n\n\u003cp\u003eANSSI said the same hackers also targeted Schneider Electric equipment at several small hydroelectric facilities, though the resulting disruption was described as moderate. France summoned Iran’s ambassador, said it would pursue European sanctions, and opened a judicial investigation seeking international arrest warrants for the alleged leaders of the unit. The report did not address a separate early-November wave of refrigeration attacks that affected businesses in at least 11 European countries, including British meat suppliers and three French national blood-service sites. French authorities also linked another IRGC unit, Shahid Shoostari or Emennet Pasargad, to earlier operations against French interests, including an unsuccessful attempt to display anti-Israeli imagery on digital screens during the 2024 Paris Olympics.\u003c/p\u003e\n"},{"n":21,"title":"Hackers Exploit Qubole's Trusted AWS Access to Breach Customer Accounts and Steal Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-quboles-trusted-aws.html","time":"17:51","priority":"MUST READ","score":94,"tldr":"Attackers used compromised Qubole AWS credentials to assume trusted customer IAM roles and steal secrets and S3 data from multiple AWS accounts between October 14 and 26. Organizations that have ever connected Qubole should review CloudTrail logs, revoke unused trust relationships, rotate exposed credentials, and restrict vendor role assumptions by source network and least privilege.","briefOverview":"\u003cp\u003eAn attacker accessed AWS accounts belonging to multiple Qubole customers between October 14 and October 26 by using credentials for Qubole’s AWS account. Qubole customers had created AWS roles that trusted Qubole’s account, allowing it to take on those roles’ permissions when supplying a matching External ID. Wiz said many of the abused roles were unused but still retained this trust relationship, enabling the attacker’s requests.\u003c/p\u003e\n\n\u003cp\u003eIn affected environments, the attacker collected credentials from Lambda environment variables, AWS Secrets Manager, and SSM Parameter Store, then used TruffleHog to test them. The attacker also copied accessible Amazon S3 data, at times downloading an entire bucket during a single session. Wiz advised organizations that have connected Qubole to AWS to examine CloudTrail records from October 1 onward, rotate accessible secrets and revoke active sessions where roles were abused, remove unneeded roles, restrict role assumptions by source network, and enable S3 data events or server access logs for sensitive buckets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers accessed multiple Qubole customers’ AWS accounts between October 14 and October 26 by using credentials for Qubole’s AWS account to assume customer roles that trusted it.","The attackers searched compromised environments for credentials in Lambda environment variables, AWS Secrets Manager, and SSM Parameter Store, then used TruffleHog to test stolen AWS, Entra ID, and Okta credentials.","The attackers also downloaded data from accessible Amazon S3 buckets, sometimes retrieving an entire bucket during one session.","Wiz advised organizations that have connected Qubole to AWS to review CloudTrail logs from October 1 onward for suspicious AssumeRole activity involving account 805246085872, attacker-linked IAM principals, IP addresses, or session names.","Wiz recommended removing unneeded Qubole roles, rotating secrets accessible to compromised roles, restricting role assumptions by source IP or VPC endpoint, and enabling S3 data events or server access logs for sensitive buckets."],"insights":["Most of the customer roles abused by the attacker were reportedly unused, but they remained accessible because they still trusted Qubole’s AWS account.","The required External ID did not prevent the misuse because AWS does not treat it as a secret and it can be viewed by parties with access to the role.","Simply rotating stolen credentials is insufficient after a compromise because existing role sessions remain active unless they are separately revoked.","CloudTrail management logs can show role assumptions and bucket listings but not the specific S3 objects read, leaving organizations without S3 data events or server access logs unable to determine exactly what data was taken."],"referencedReports":[{"title":"Qubole Cross-Account Access Abused in the Wild","url":"https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild","publisher":"wiz","context":"The article cites Wiz's technical analysis for details on the accepted AssumeRole requests, attacker activity, indicators, and mitigation guidance.","category":"research","primary":true}],"body":"\u003cp\u003eAn attacker accessed AWS accounts belonging to multiple Qubole customers between October 14 and October 26 by using credentials for Qubole’s AWS account. Qubole customers had created AWS roles that trusted Qubole’s account, allowing it to take on those roles’ permissions when supplying a matching External ID. Wiz said many of the abused roles were unused but still retained this trust relationship, enabling the attacker’s requests.\u003c/p\u003e\n\n\u003cp\u003eIn affected environments, the attacker collected credentials from Lambda environment variables, AWS Secrets Manager, and SSM Parameter Store, then used TruffleHog to test them. The attacker also copied accessible Amazon S3 data, at times downloading an entire bucket during a single session. Wiz advised organizations that have connected Qubole to AWS to examine CloudTrail records from October 1 onward, rotate accessible secrets and revoke active sessions where roles were abused, remove unneeded roles, restrict role assumptions by source network, and enable S3 data events or server access logs for sensitive buckets.\u003c/p\u003e\n"},{"n":29,"title":"CISA Flags SonicWall SonicOS MFA Bypass Flaw Amid Reports of Possible Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisa-flags-sonicwall-sonicos-mfa-bypass.html","time":"06:05","priority":"MUST READ","score":93,"tldr":"CISA added SonicWall SonicOS CVE-2026-19868 to its Known Exploited Vulnerabilities catalog after reports of possible real-world exploitation, as the flaw can let users with alternate valid credentials bypass SAML-enforced MFA on SSL-VPNs. Organizations should promptly update SonicOS and review exposure to the affected SSL-VPN service.","briefOverview":"\u003cp\u003eCISA added CVE-2026-19868, a high-severity SonicWall SonicOS issue, to its Known Exploited Vulnerabilities catalog after reports that it may have been used in real-world attacks. SonicWall said it investigated a report of potential exploitation but did not provide details about the attack or the party behind it. Federal Civilian Executive Branch agencies have been recommended to apply patches by November 20, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects the SonicOS SSL-VPN service and may allow a user with valid credentials for an alternate authentication method to bypass SAML authentication controls. Successful use of the flaw may also bypass multi-factor authentication enforced through SAML. SonicWall urged customers to update to the latest version and also released fixes for three other high-severity SonicOS flaws affecting the management interface and SSL-VPN service.\u003c/p\u003e\n\n\u003cp\u003eSeparately, SonicWall recently disclosed two unpatched vulnerabilities affecting end-of-life Global Management System products. The company said it will not patch those GMS issues and advised customers to upgrade to Network Security Manager instead. The additional patched SonicOS flaws include two issues that could enable unauthorized operations under specific conditions and one that could cause an application-level denial of service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-19868, a high-severity SonicWall SonicOS flaw, to its Known Exploited Vulnerabilities catalog following reports of possible real-world exploitation.","The flaw affects the SonicOS SSL-VPN service and may allow users with valid credentials for an alternate authentication method to bypass SAML controls, including SAML-enforced multi-factor authentication.","SonicWall said it investigated a report of potential exploitation and urged customers to update to the latest version as soon as possible.","SonicWall also patched three other high-severity SonicOS issues, including two management-interface flaws that could allow unauthorized operations and an SSL-VPN buffer overflow that could cause application-level denial of service.","Federal Civilian Executive Branch agencies are recommended to apply the patches by November 20, 2026."],"insights":["SAML-based multi-factor authentication may not protect SonicOS SSL-VPN access if alternate login methods remain available to users with valid credentials.","CISA’s addition of the flaw to its Known Exploited Vulnerabilities catalog and SonicWall’s investigation of a potential exploitation report make patching more urgent than a routine software update.","The same update cycle addresses both possible unauthorized management-interface actions and a remote SSL-VPN denial-of-service condition, so organizations may need to assess more than the MFA-bypass issue.","Organizations using end-of-life SonicWall Global Management System products face a separate concern because SonicWall said it will not patch two other disclosed flaws affecting those systems and instead recommends moving to Network Security Manager."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/06/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites CISA's alert announcing the addition of CVE-2026-19868 to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"SNWLID-2026-0014","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014","publisher":"sonicwall","context":"The article cites SonicWall's advisory describing the SonicOS SSL-VPN authentication enforcement flaw and its potential to bypass SAML-enforced MFA.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-19868, a high-severity SonicWall SonicOS issue, to its Known Exploited Vulnerabilities catalog after reports that it may have been used in real-world attacks. SonicWall said it investigated a report of potential exploitation but did not provide details about the attack or the party behind it. Federal Civilian Executive Branch agencies have been recommended to apply patches by November 20, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects the SonicOS SSL-VPN service and may allow a user with valid credentials for an alternate authentication method to bypass SAML authentication controls. Successful use of the flaw may also bypass multi-factor authentication enforced through SAML. SonicWall urged customers to update to the latest version and also released fixes for three other high-severity SonicOS flaws affecting the management interface and SSL-VPN service.\u003c/p\u003e\n\n\u003cp\u003eSeparately, SonicWall recently disclosed two unpatched vulnerabilities affecting end-of-life Global Management System products. The company said it will not patch those GMS issues and advised customers to upgrade to Network Security Manager instead. The additional patched SonicOS flaws include two issues that could enable unauthorized operations under specific conditions and one that could cause an application-level denial of service.\u003c/p\u003e\n"},{"n":35,"title":"@ethersphere/bee-js 13.3.0 Compromised","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/ethersphere-bee-js-13-3-0-compromise","time":"01:18","priority":"MUST READ","score":93,"tldr":"@ethersphere/bee-js version 13.3.0 was maliciously published to npm and executes attacker-controlled code during installation to steal Swarm Desktop wallet files and establish persistence on Linux, macOS, and Windows. Do not install it; systems where lifecycle scripts ran should be treated as potentially compromised and investigated beyond simply removing the package.","briefOverview":"\u003cp\u003eStepSecurity reported that @ethersphere/bee-js version 13.3.0, published to npm on November 9, 2026, was compromised and executed attacker-controlled JavaScript during installation. The malicious release was introduced through an unsigned direct commit to the project\u0026rsquo;s upcoming branch under the bee-worker identity, then published through the repository\u0026rsquo;s legitimate GitHub Actions trusted publishing workflow. Although the npm package had valid SLSA provenance, the malicious code was already present in the repository source used by that workflow.\u003c/p\u003e\n\n\u003cp\u003eThe package changed its installation scripts to contact api.frameworkmetrics[.]xyz, retrieve JavaScript tailored to Linux, macOS, or Windows, and execute it with the installing user\u0026rsquo;s permissions. The retrieved code searched for Swarm Desktop wallet configuration and keystore files and sent them to the attacker-controlled server, while platform-specific payloads attempted to establish persistent access through a Linux user service, a macOS LaunchAgent, or a Windows installer sequence. Users should avoid version 13.3.0, check direct and transitive dependency resolutions and installation records, and treat hosts where lifecycle scripts ran as potentially compromised because removing the package alone may not remove persistence.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["@ethersphere/bee-js version 13.3.0 was published to npm on November 9, 2026 and runs attacker-controlled JavaScript during installation.","The malicious package added a post-installation script that contacts api.frameworkmetrics[.]xyz, receives operating-system-specific code, and executes it with the installing user’s permissions.","Retrieved payloads searched Swarm Desktop directories for config.yaml and swarm.key, then sent their contents to the attacker-controlled server when both files were present.","The Linux and macOS payloads create persistent user-level services or startup entries, while the Windows payload attempts to install software after adding a Microsoft Defender exclusion.","Users should avoid version 13.3.0 and treat systems where its installation scripts ran as potentially compromised, because removing the package alone may not remove persistence."],"insights":["Valid SLSA provenance did not establish that the release was safe because the malicious code was already committed to the legitimate repository before the trusted publishing workflow built and published it.","A successful installation log does not show that the payload failed, because the installation hook suppresses network errors after attempting to contact the attacker-controlled server.","Projects using version ranges such as ^13.0.0 or ^13.2.0 could resolve to 13.3.0 during a fresh dependency installation or lockfile update, even if their own code was not modified.","The malicious behavior runs during installation and does not require anyone to import or use the library, while removing the package afterward may leave installed persistence in place.","The reported 3,560 package downloads occurred before the malicious release was published and therefore cannot be used to estimate how many systems installed version 13.3.0."],"referencedReports":[{"title":"StepSecurity OSS Security Feed: @ethersphere/bee-js 13.3.0","url":"https://app.stepsecurity.io/oss-security-feed/@ethersphere/bee-js?version=13.3.0","publisher":"stepsecurity","context":"The article states that its finding on the compromised package version is available in the StepSecurity OSS Security Feed.","category":"research","primary":true}],"body":"\u003cp\u003eStepSecurity reported that @ethersphere/bee-js version 13.3.0, published to npm on November 9, 2026, was compromised and executed attacker-controlled JavaScript during installation. The malicious release was introduced through an unsigned direct commit to the project\u0026rsquo;s upcoming branch under the bee-worker identity, then published through the repository\u0026rsquo;s legitimate GitHub Actions trusted publishing workflow. Although the npm package had valid SLSA provenance, the malicious code was already present in the repository source used by that workflow.\u003c/p\u003e\n\n\u003cp\u003eThe package changed its installation scripts to contact api.frameworkmetrics[.]xyz, retrieve JavaScript tailored to Linux, macOS, or Windows, and execute it with the installing user\u0026rsquo;s permissions. The retrieved code searched for Swarm Desktop wallet configuration and keystore files and sent them to the attacker-controlled server, while platform-specific payloads attempted to establish persistent access through a Linux user service, a macOS LaunchAgent, or a Windows installer sequence. Users should avoid version 13.3.0, check direct and transitive dependency resolutions and installation records, and treat hosts where lifecycle scripts ran as potentially compromised because removing the package alone may not remove persistence.\u003c/p\u003e\n"},{"n":2,"title":"France blames Iranian hackers for supermarket attacks that sparked fires","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/france-blames-iranian-hackers-for-supermarket-attacks-that-sparked-fires/","time":"18:32","priority":"SHOULD READ","score":88,"tldr":"France has attributed October cyberattacks that disrupted refrigeration systems at roughly 700 retail locations, caused major food losses, and sparked at least 15 fires to the Iranian IRGC-linked Shahid Kaveh unit. The government plans to summon Iran’s ambassador and seek EU sanctions over the campaign.","briefOverview":"\u003cp\u003eFrance has attributed October cyberattacks on refrigeration systems at roughly 700 retail and food-sector locations to Shahid Kaveh, an Iranian IRGC-affiliated cyber-offensive unit. The attacks occurred overnight on October 11–12, when attackers compromised refrigeration controllers and changed defrost settings to high temperatures. Affected organizations included major supermarket chains, smaller butcher shops, a slaughterhouse, and cooperative food-processing facilities. France said the disruption caused tens of millions of euros in food losses, material damage, and at least 15 fires.\u003c/p\u003e\n\n\u003cp\u003eFrance’s CERT-FR linked the activity to Shahid Kaveh through attacker infrastructure, reconnaissance of Schneider Electric industrial systems, use of the FOFA device-search platform, Farsi-language traces, and CyberbanNews posts publicizing the attacks. Investigators also connected attacks on Schneider Electric equipment at small hydroelectric installations to the same campaign, although the reported effects there were moderate. France attributed only the October attacks on French supermarkets to the Iranian unit, not later refrigeration incidents reported elsewhere in Europe. The French government said it will summon Iran’s ambassador and seek additional EU sanctions against Iranian individuals and organizations involved in malicious cyber operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["France attributed October cyberattacks on refrigeration systems at approximately 700 retail locations to Shahid Kaveh, an Iranian IRGC-affiliated cyber-offensive unit.","Attackers remotely changed refrigeration controller defrost settings to high temperatures, leading to food losses, material damage, and at least 15 fires.","Affected organizations included Casino, Leclerc, Coopérative U, Metro, Carrefour, Intermarché, smaller butcher shops, a slaughterhouse, and cooperative food-processing facilities.","French investigators also linked reconnaissance and attacks involving Schneider Electric industrial equipment at small hydroelectric installations to the same campaign.","France plans to summon Iran’s ambassador and seek new European Union sanctions against Iranian people and organizations involved in malicious cyber operations."],"insights":["The reported manipulation of defrost settings demonstrates that changing a single operational setting in refrigeration equipment can produce physical consequences, including fires, rather than only disrupting business operations.","France’s attribution relied on several overlapping indicators, including infrastructure used against Schneider Electric systems, use of FOFA, Farsi-language traces, and promotion of the incidents by the CyberbanNews outlet.","French authorities attributed only the October incidents in France to Shahid Kaveh, explicitly not extending that attribution to the later refrigeration attacks reported elsewhere in Europe.","The same campaign reportedly involved both food refrigeration equipment and small hydroelectric installations, indicating that its targets included multiple kinds of industrial equipment."],"referencedReports":[{"title":"CERTFR-2026-CTI-009","url":"http://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/","publisher":"CERT-FR","context":"France's technical report identifies affected retail and food-sector organizations and describes evidence linking the October refrigeration attacks to the Shahid Kaveh unit.","category":"research","primary":true}],"body":"\u003cp\u003eFrance has attributed October cyberattacks on refrigeration systems at roughly 700 retail and food-sector locations to Shahid Kaveh, an Iranian IRGC-affiliated cyber-offensive unit. The attacks occurred overnight on October 11–12, when attackers compromised refrigeration controllers and changed defrost settings to high temperatures. Affected organizations included major supermarket chains, smaller butcher shops, a slaughterhouse, and cooperative food-processing facilities. France said the disruption caused tens of millions of euros in food losses, material damage, and at least 15 fires.\u003c/p\u003e\n\n\u003cp\u003eFrance’s CERT-FR linked the activity to Shahid Kaveh through attacker infrastructure, reconnaissance of Schneider Electric industrial systems, use of the FOFA device-search platform, Farsi-language traces, and CyberbanNews posts publicizing the attacks. Investigators also connected attacks on Schneider Electric equipment at small hydroelectric installations to the same campaign, although the reported effects there were moderate. France attributed only the October attacks on French supermarkets to the Iranian unit, not later refrigeration incidents reported elsewhere in Europe. The French government said it will summon Iran’s ambassador and seek additional EU sanctions against Iranian individuals and organizations involved in malicious cyber operations.\u003c/p\u003e\n"},{"n":10,"title":"N-able takes cloud platform offline after 30+ \"zero-days\" published","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/n-able-takes-cloud-platform-offline-after-30-plus-zero-days-published/","time":"21:26","priority":"SHOULD READ","score":88,"tldr":"N-able took its hosted N-central platform offline worldwide and told on-premises customers to shut down servers after a researcher publicly released more than 30 alleged zero-days, including an unauthenticated XXE chain that can yield administrator access and remote code execution. N-able is developing a hotfix and says it has found no evidence of active exploitation so far.","briefOverview":"\u003cp\u003eN-able took its hosted N-central environments offline across the Americas, Europe, and Asia-Pacific after security researcher Sean Bales publicly disclosed more than 30 alleged zero-day flaws. The company also told customers operating on-premises N-central servers to temporarily take them offline while it develops and validates a hotfix. N-able said it had not observed active exploitation or unauthorized data access at the time of its update. Ecoverse services accessed through N-able Login remained operational.\u003c/p\u003e\n\n\u003cp\u003eBales published proof-of-concept exploits in a GitHub repository named Able2Shell, describing issues such as authentication bypasses, credential disclosure, arbitrary file writes, directory traversal, stored cross-site scripting, XML external entity injection, and remote code execution. The most critical reported chain uses an unauthenticated flaw in service import to obtain a trusted local session, reset an account password, run commands as the \u003ccode\u003enable\u003c/code\u003e user, and create an enabled Default Administrator account with attacker-controlled credentials. Other reported issues include stored XSS that can execute commands as root when an administrator views malicious patch metadata, plus a privilege-escalation flaw from the \u003ccode\u003enable\u003c/code\u003e account to root.\u003c/p\u003e\n\n\u003cp\u003eN-central is a remote monitoring and management platform used by managed service providers and IT teams to monitor, manage, and secure customer devices and networks remotely, making administrator-level access especially significant. Bales said the flaws were tested against a pre-release N-central Appliance 2026.4.0.31 build and believes most or all affect earlier versions. He said he released the findings without prior notification because N-able allegedly failed to patch or respond to his earlier reports concerning different flaws in another N-able product. N-able did not address those allegations in its response and said it would continue providing status updates every four hours or sooner as information became available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Sean Bales publicly disclosed more than 30 alleged zero-day vulnerabilities in N-able N-central and released proof-of-concept exploits in the Able2Shell GitHub repository.","The disclosed issues include a reported unauthenticated XML external entity flaw that can be chained to reset an account password, create a Default Administrator account, and execute commands on an N-central server as the nable user.","N-able took hosted N-central environments offline across the Americas, Europe, and Asia-Pacific and advised customers with on-premises N-central servers to take them offline temporarily.","N-able said it is developing and validating a hotfix, and that it has found no evidence of active exploitation or unauthorized data access.","Bales said he released the N-central findings without prior notice because N-able allegedly had not patched or responded to reports of unrelated flaws in another product that he submitted months earlier."],"insights":["The reported unauthenticated XXE chain is especially consequential because it can both execute server commands and create a new enabled Default Administrator account with attacker-controlled credentials, allowing persistent administrative access.","A separate reported stored XSS issue could lead to root-level command execution merely when an administrator views malicious patch metadata, turning routine administrative review into a potential compromise path.","The alleged vulnerabilities were tested on a pre-release N-central Appliance 2026.4.0.31 build, but the researcher believes most or all also affect earlier releases.","Although hosted N-central was taken offline, N-able stated that Ecoverse services accessed through N-able Login remained operational.","The public release was reportedly influenced by the researcher's unresolved earlier reports involving a different N-able product, illustrating that the disclosed N-central issues were not the same flaws he says remain unpatched."],"referencedReports":[{"title":"Able2Shell","url":"https://github.com/Oracle-Security/CVEs/tree/main/0-Days/N-Central%20N-Able","publisher":"Sean Bales","context":"The article cites this GitHub repository as containing proof-of-concept exploits for more than 30 alleged N-central zero-day vulnerabilities.","category":"research","primary":true}],"body":"\u003cp\u003eN-able took its hosted N-central environments offline across the Americas, Europe, and Asia-Pacific after security researcher Sean Bales publicly disclosed more than 30 alleged zero-day flaws. The company also told customers operating on-premises N-central servers to temporarily take them offline while it develops and validates a hotfix. N-able said it had not observed active exploitation or unauthorized data access at the time of its update. Ecoverse services accessed through N-able Login remained operational.\u003c/p\u003e\n\n\u003cp\u003eBales published proof-of-concept exploits in a GitHub repository named Able2Shell, describing issues such as authentication bypasses, credential disclosure, arbitrary file writes, directory traversal, stored cross-site scripting, XML external entity injection, and remote code execution. The most critical reported chain uses an unauthenticated flaw in service import to obtain a trusted local session, reset an account password, run commands as the \u003ccode\u003enable\u003c/code\u003e user, and create an enabled Default Administrator account with attacker-controlled credentials. Other reported issues include stored XSS that can execute commands as root when an administrator views malicious patch metadata, plus a privilege-escalation flaw from the \u003ccode\u003enable\u003c/code\u003e account to root.\u003c/p\u003e\n\n\u003cp\u003eN-central is a remote monitoring and management platform used by managed service providers and IT teams to monitor, manage, and secure customer devices and networks remotely, making administrator-level access especially significant. Bales said the flaws were tested against a pre-release N-central Appliance 2026.4.0.31 build and believes most or all affect earlier versions. He said he released the findings without prior notification because N-able allegedly failed to patch or respond to his earlier reports concerning different flaws in another N-able product. N-able did not address those allegations in its response and said it would continue providing status updates every four hours or sooner as information became available.\u003c/p\u003e\n"},{"n":20,"title":"Web3Auth Flaw Exploited to Steal Keplr Crypto, Provider Empties Other Wallets for Safety","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/web3auth-flaw-exploited-to-steal-keplr.html","time":"10:56","priority":"SHOULD READ","score":88,"tldr":"A Web3Auth infrastructure flaw exposed private keys for some Keplr wallets created through Google or Apple sign-in, allowing an attacker to steal funds. Web3Auth and Keplr moved funds from other at-risk wallets into recovery addresses, while users should avoid depositing to affected accounts and move accessible assets to seed-phrase or hardware wallets.","briefOverview":"\u003cp\u003eA security issue in Web3Auth infrastructure exposed private keys for some Keplr cryptocurrency wallets created through Google or Apple sign-in, enabling an attacker to steal funds. Keplr paused Google and Apple login while it investigates, and said wallets created with a recovery phrase or hardware wallet were not affected. Web3Auth has not disclosed how the issue worked, when it was first exploited, or whether the route used by the attacker has been closed.\u003c/p\u003e\n\n\u003cp\u003eWeb3Auth and Keplr moved funds from other at-risk wallets into secure recovery wallets before the attacker could reach them, so an empty wallet balance may reflect a protective transfer rather than theft. GoPlus estimated at least about \u003cspan class=\"math inline\"\u003e\\(1 million was stolen, while Bitquery found that more than \\)\u003c/span\u003e6.01 million moved from over 44,000 wallets into recovery wallets across Cosmos and Ethereum-style chains. Users with Google- or Apple-created Keplr accounts were told not to add funds, re-import or recreate the account, and to move available unstaked assets to wallets secured by a recovery phrase or hardware device.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A security issue in Web3Auth infrastructure exposed private keys for some Keplr wallets created using Google or Apple sign-in, and an attacker stole funds from some affected wallets.","Keplr said wallets created with a recovery phrase or connected to a hardware wallet were not affected, and it paused Google and Apple sign-in while investigating.","Web3Auth used the same route available to the attacker to move funds from other at-risk wallets into recovery wallets, meaning some empty balances may reflect protective transfers rather than theft.","GoPlus estimated that at least about $1 million was stolen, while Bitquery reported that more than $6.01 million moved from over 44,000 wallets into recovery wallets across multiple Cosmos and Ethereum-style chains.","Web3Auth said its embedded wallet service may affect other companies, but stated that its initial investigation found no evidence that MetaMask users were affected."],"insights":["An unfamiliar transfer destination is not automatically evidence of theft in this incident, because Web3Auth published recovery addresses used to move at-risk funds to safety.","Bitquery found that the first recovery transfer occurred 21 minutes before Web3Auth's first public notice, and 86% of the affected wallets were emptied after Keplr warned users.","The risk was tied to wallets created through Google or Apple login rather than wallets protected by a recovery phrase or hardware wallet, making the account setup method central to exposure.","Although Web3Auth said the issue could affect services used by other companies, Keplr was the only affected company it named and Web3Auth reported no evidence of MetaMask impact in its initial investigation."],"referencedReports":[{"title":"Security Alert","url":"https://x.com/GoPlusZH/status/2119653595234832716","publisher":"goplus","context":"GoPlus issued a security alert estimating that at least about $1 million had been stolen.","category":"advisory","primary":false},{"title":"Keplr Wallet Hack","url":"https://bitquery.io/investigations/keplr-wallet-hack","publisher":"bitquery","context":"Bitquery published a corrected analysis treating more than $6.01 million in transfers as a recovery operation rather than theft, while noting it could not verify who controlled the recovery wallets.","category":"research","primary":false}],"body":"\u003cp\u003eA security issue in Web3Auth infrastructure exposed private keys for some Keplr cryptocurrency wallets created through Google or Apple sign-in, enabling an attacker to steal funds. Keplr paused Google and Apple login while it investigates, and said wallets created with a recovery phrase or hardware wallet were not affected. Web3Auth has not disclosed how the issue worked, when it was first exploited, or whether the route used by the attacker has been closed.\u003c/p\u003e\n\n\u003cp\u003eWeb3Auth and Keplr moved funds from other at-risk wallets into secure recovery wallets before the attacker could reach them, so an empty wallet balance may reflect a protective transfer rather than theft. GoPlus estimated at least about \u003cspan class=\"math inline\"\u003e\\(1 million was stolen, while Bitquery found that more than \\)\u003c/span\u003e6.01 million moved from over 44,000 wallets into recovery wallets across Cosmos and Ethereum-style chains. Users with Google- or Apple-created Keplr accounts were told not to add funds, re-import or recreate the account, and to move available unstaked assets to wallets secured by a recovery phrase or hardware device.\u003c/p\u003e\n"},{"n":24,"title":"Hackers Compromise Ethersphere's bee-js and Swarm Desktop to Deliver Wallet-Stealing Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-compromise-etherspheres-bee-js.html","time":"17:36","priority":"SHOULD READ","score":88,"tldr":"Attackers used stolen Ethersphere CI credentials to publish malicious bee-js 13.3.0 and Swarm Desktop 0.56.2 releases that stole Swarm wallet keys and passwords and installed cross-platform backdoors. Anyone who installed or ran either version should treat the system and wallet credentials as compromised, rotate secrets from a clean machine, and rebuild or thoroughly remediate affected hosts.","briefOverview":"\u003cp\u003eAttackers used stolen Ethersphere continuous-integration credentials to publish malicious versions of bee-js and Swarm Desktop through the project’s own automated release workflows. bee-js 13.3.0 was available on npm for about 75 minutes, while Swarm Desktop 0.56.2 remained available for roughly 8.5 hours. The affected releases were withdrawn, and Ethersphere issued Swarm Desktop 0.56.3 as a clean replacement. However, updating does not remove any backdoor already installed or protect keys already sent to the attackers.\u003c/p\u003e\n\n\u003cp\u003eThe malware downloaded additional code that collected Swarm Desktop’s encrypted wallet key and the plain-text password stored in its configuration file, allowing attackers to access the node wallet’s funds, chequebook, and stake. It also installed the evjawbreaker remote shell on Linux and macOS and a ScreenConnect remote-access client on Windows. The bee-js package could execute its malicious code automatically during installation through a postinstall script, even if an application never imported the library. The malicious packages were built or signed through legitimate project workflows, including valid npm provenance and Apple notarization for the macOS application, showing that these checks did not establish that the release code had been reviewed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers used stolen Ethersphere CI credentials to publish malicious bee-js 13.3.0 and Swarm Desktop 0.56.2 releases through the project’s own automated release workflows.","The malicious code stole Swarm Desktop’s encrypted wallet key file and the plain-text password stored alongside it, and it installed backdoors on Windows, macOS, and Linux systems.","bee-js 13.3.0 was available on npm for about 75 minutes, while Swarm Desktop 0.56.2 was available for about 8.5 hours before both malicious releases were withdrawn.","Ethersphere released Swarm Desktop 0.56.3 as a clean replacement, but updating or reinstalling does not remove any backdoor already installed or protect wallet keys already sent to attackers.","The malware contacted api.frameworkmetrics[.]xyz, installed an evjawbreaker remote shell on Linux and macOS, and installed a ScreenConnect remote-access client on Windows."],"insights":["The malicious bee-js package could run automatically during installation through its postinstall script, meaning a project did not need to import or use the library for the malicious code to execute.","The compromised releases were built and signed through Ethersphere’s legitimate workflows, so bee-js carried valid npm provenance and the malicious macOS app was signed and notarized by Apple despite containing harmful code.","Swarm Desktop’s updater could distribute version 0.56.2 to Windows x64 systems and Apple Silicon Macs within about 10 minutes, while Intel Macs were not offered the update and Linux installations did not update automatically.","The Linux and macOS backdoor obtained its control-server address from an Ethereum smart contract, allowing the attackers to change where infected machines connect without replacing the installed backdoor."],"referencedReports":[{"title":"bee-js Compromise","url":"https://socket.dev/blog/bee-js-compromise","publisher":"socket","context":"The article cites Socket's incident analysis for the release timeline, automated update exposure, publishing workflow details, and valid npm provenance.","category":"research","primary":true},{"title":"Ethersphere bee-js npm Compromise","url":"https://safedep.io/blog/ethersphere-bee-js-npm-compromise","publisher":"safedep","context":"The article cites SafeDep's technical analysis for details of the shared loader, wallet-file theft, and cross-platform backdoor installation.","category":"research","primary":true},{"title":"GitHub Advisory GHSA-hh7j-5m3j-23pf","url":"https://github.com/advisories/GHSA-hh7j-5m3j-23pf","publisher":"github","context":"The article references the advisory warning that any computer where bee-js 13.3.0 was installed or running should be considered fully compromised.","category":"advisory","primary":false},{"title":"EtherDuck Analysis","url":"https://pluto.security/blog/sleepyduck-malware-open-vsx-extensions/","publisher":"pluto-security","context":"The article cites Pluto Security's analysis of malicious Open VSX extensions whose infrastructure and file-name patterns overlap with the payloads in this incident.","category":"research","primary":false}],"body":"\u003cp\u003eAttackers used stolen Ethersphere continuous-integration credentials to publish malicious versions of bee-js and Swarm Desktop through the project’s own automated release workflows. bee-js 13.3.0 was available on npm for about 75 minutes, while Swarm Desktop 0.56.2 remained available for roughly 8.5 hours. The affected releases were withdrawn, and Ethersphere issued Swarm Desktop 0.56.3 as a clean replacement. However, updating does not remove any backdoor already installed or protect keys already sent to the attackers.\u003c/p\u003e\n\n\u003cp\u003eThe malware downloaded additional code that collected Swarm Desktop’s encrypted wallet key and the plain-text password stored in its configuration file, allowing attackers to access the node wallet’s funds, chequebook, and stake. It also installed the evjawbreaker remote shell on Linux and macOS and a ScreenConnect remote-access client on Windows. The bee-js package could execute its malicious code automatically during installation through a postinstall script, even if an application never imported the library. The malicious packages were built or signed through legitimate project workflows, including valid npm provenance and Apple notarization for the macOS application, showing that these checks did not establish that the release code had been reviewed.\u003c/p\u003e\n"},{"n":25,"title":"U.S. Agencies Warn Refrigeration Controller Attacks Could Cause Fires and Inventory Losses","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/us-agencies-warn-refrigeration.html","time":"06:15","priority":"SHOULD READ","score":88,"tldr":"U.S. agencies warn that internet-exposed, poorly secured industrial refrigeration controllers are being actively targeted to alter temperatures or trigger defrost cycles, risking fires, spoiled food and medicine, and equipment damage. Operators should remove unnecessary internet access, isolate OT systems, patch devices, and strengthen authentication.","briefOverview":"\u003cp\u003eU.S. agencies including CISA, the FBI, HHS, USDA, and DOT warned that threat actors are actively targeting industrial refrigeration and cold-chain monitoring systems worldwide. The advisory says attackers may exploit unpatched or internet-accessible controllers, authentication bypasses, arbitrary code injection, and weak configurations. They can remotely change settings or force units into continuous heating and defrost cycles.\u003c/p\u003e\n\n\u003cp\u003eThese actions can cause inventory loss, equipment hazards, fire risks, and unsafe storage conditions for food, medicine, and other temperature-sensitive products. Recent attacks hit hundreds of supermarkets across Europe, while the French Blood Establishment reported extremely high temperature and defrost settings at three blood-plasma storage facilities after an incident involving a refrigeration-equipment provider. Operators are urged to use strong authentication, update systems, identify and isolate internet-accessible operational devices, replace default passwords and legacy devices, and remove unnecessary remote access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. agencies warned that threat actors are actively targeting industrial refrigeration and cold-chain monitoring systems worldwide by exploiting unpatched or internet-accessible controllers.","Attackers may alter temperature settings or force continuous heating and defrost cycles, creating risks of inventory loss, equipment damage, fire hazards, and unsafe storage of food or medicine.","Recent attacks exploited internet-accessible refrigeration controllers at hundreds of supermarkets across Europe, raising temperatures or forcing defrost mode and causing food spoilage and financial losses.","The French Blood Establishment reported that a cybersecurity incident affecting a refrigeration equipment provider changed temperature and defrost settings to extremely high levels at three blood-plasma storage facilities.","CISA, the FBI, HHS, USDA, and DOT advised operators to update systems, eliminate unnecessary internet exposure and remote access, isolate operational devices, and use strong authentication and non-default passwords."],"insights":["The reported impact extends beyond spoiled retail food: altered refrigeration settings affected blood-plasma storage facilities, illustrating that a single equipment provider incident can reach medically sensitive operations.","Despite a major reduction in publicly exposed Danfoss StoreView instances from 3,004 to 708 between October 9 and November 5, 2026, hundreds of systems remained reachable from the internet.","The attacks can impair both cooling control and temperature visibility, meaning operators may lose the ability to verify current storage conditions during an incident.","The affected targets ranged from major supermarket chains to small grocers and butchers in at least 12 European countries, showing that organizations of varied sizes were exposed to the same controller-related risk."],"referencedReports":[{"title":"U.S. Government Partners Urge Hardening of Industrial Refrigeration and Cold Chain Monitoring Systems","url":"https://www.cisa.gov/resources-tools/resources/us-government-partners-urge-hardening-industrial-refrigeration-and-cold-chain-monitoring-systems","publisher":"cisa","context":"The article is based on this joint U.S. government advisory warning that refrigeration and cold-chain monitoring systems are being targeted.","category":"advisory","primary":true},{"title":"European Refrigerator Controller Redux: A New Wave of Refrigeration Attacks","url":"https://censys.com/blog/european-refrigerator-controller-redux-a-new-wave-of-refrigeration-attacks/","publisher":"censys","context":"The article cites Censys data on globally exposed Danfoss StoreView and Copeland/Dixell XWEB instances following attacks in Europe.","category":"research","primary":false},{"title":"European Refrigeration Controller Exposure Sitrep","url":"https://censys.com/blog/european-refrigeration-controller-exposure-sitrep","publisher":"censys","context":"The article references this Censys analysis for the reported decline in exposed refrigeration-controller instances.","category":"research","primary":false},{"title":"What Refrigerator Hacks Reveal About ICS Exposure","url":"https://censys.com/blog/what-refrigerator-hacks-reveal-about-ics-exposure/","publisher":"censys","context":"The article cites this Censys analysis for global industrial control system exposure figures and broader critical-infrastructure risk.","category":"research","primary":false}],"body":"\u003cp\u003eU.S. agencies including CISA, the FBI, HHS, USDA, and DOT warned that threat actors are actively targeting industrial refrigeration and cold-chain monitoring systems worldwide. The advisory says attackers may exploit unpatched or internet-accessible controllers, authentication bypasses, arbitrary code injection, and weak configurations. They can remotely change settings or force units into continuous heating and defrost cycles.\u003c/p\u003e\n\n\u003cp\u003eThese actions can cause inventory loss, equipment hazards, fire risks, and unsafe storage conditions for food, medicine, and other temperature-sensitive products. Recent attacks hit hundreds of supermarkets across Europe, while the French Blood Establishment reported extremely high temperature and defrost settings at three blood-plasma storage facilities after an incident involving a refrigeration-equipment provider. Operators are urged to use strong authentication, update systems, identify and isolate internet-accessible operational devices, replace default passwords and legacy devices, and remove unnecessary remote access.\u003c/p\u003e\n"},{"n":31,"title":"U.S. urges critical infrastructure orgs to secure refrigeration systems ASAP after EU supermarket and blood bank attacks","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/u-s-urges-critical-infrastructure-orgs-to-secure-refrigeration-systems-asap-after-eu","time":"22:00","priority":"SHOULD READ","score":86,"tldr":"U.S. agencies are urging critical-infrastructure operators to immediately harden internet-exposed industrial refrigeration and cold-chain systems after attacks in Europe spoiled food and threatened blood supplies through remote temperature manipulation.","briefOverview":"\u003cp\u003eU.S. agencies are urging critical-infrastructure organizations to immediately strengthen security for industrial refrigeration and cold-chain monitoring systems after cyberattacks affected French blood banks and European supermarkets. Attackers have remotely targeted commercial refrigeration controllers, seeking unpatched flaws, misconfigurations, and weak or hard-coded passwords. After gaining access, they can manipulate temperatures to spoil refrigerated products such as food and blood, and temperature changes may also create fire hazards.\u003c/p\u003e\n\n\u003cp\u003eCISA, the FBI, HHS, USDA, and the Department of Transportation recommend changing default passwords, promptly patching critical flaws, replacing end-of-life devices, identifying internet-accessible systems, isolating operational technology from business networks, limiting remote access, and keeping offsite backups. French authorities have investigated the attacks since mid-October and identified compromises involving Danfoss AK-SM and AK-SC controllers, as well as Copeland and Dixell XWEB controllers. The incidents demonstrate the risk to organizations in healthcare, food and agriculture, chemicals, and transportation that depend on refrigeration to protect essential supplies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. agencies warned critical infrastructure organizations to secure industrial refrigeration and cold-chain monitoring systems following cyberattacks on French blood banks and European supermarkets.","Attackers are remotely targeting commercial refrigeration controllers by exploiting unpatched flaws, misconfigurations, and weak or hard-coded passwords, then manipulating temperatures to spoil products.","CISA, the FBI, HHS, USDA, and the Department of Transportation recommend changing default passwords, patching critical flaws, replacing end-of-life devices, identifying internet-accessible systems, isolating operational systems, limiting remote access, and maintaining offsite backups.","French authorities have investigated attacks since mid-October involving compromises of Danfoss AK-SM and AK-SC controllers and Copeland and Dixell XWEB controllers.","The attacks on French grocery stores caused food to spoil and triggered fires, while temperature manipulation can also affect essential products such as blood and medicines."],"insights":["Industrial refrigeration equipment can create physical safety risks as well as product-loss risks: the article states that manipulated temperatures may trigger fires, and attacks on French grocery stores reportedly did so.","The immediate defensive priority is not limited to installing updates; agencies also emphasize finding internet-accessible controllers, removing unnecessary remote access, separating them from business networks, and replacing unsupported devices.","The affected equipment includes specific controller lines from Danfoss, Copeland, and Dixell, illustrating that cyber exposure can exist in specialized cold-chain devices rather than only conventional office computers.","A complete inventory of device models and firmware versions is particularly important because organizations need to identify both known flaws and equipment that has reached end of life."],"referencedReports":[{"title":"US Government Partners Urge Hardening Industrial Refrigeration and Cold Chain Monitoring Systems","url":"https://www.cisa.gov/resources-tools/resources/us-government-partners-urge-hardening-industrial-refrigeration-and-cold-chain-monitoring-systems","publisher":"CISA, FBI, HHS, USDA, and U.S. Department of Transportation","context":"The article cites this joint fact sheet as the source of immediate recommendations for securing refrigeration and cold-chain systems.","category":"advisory","primary":true},{"title":"CISA, FBI, HHS, USDA, and DOT Urge Critical Infrastructure To Strengthen Industrial Refrigeration and Cold Chain Monitoring Systems Cybersecurity","url":"https://www.cisa.gov/news-events/news/cisa-fbi-hhs-usda-and-dot-urge-critical-infrastructure-strengthen-industrial-refrigeration-and-cold","publisher":"CISA","context":"The article references this U.S. government statement for the agencies' warning that organizations relying on refrigeration and monitoring systems should expect to be targeted.","category":"advisory","primary":true}],"body":"\u003cp\u003eU.S. agencies are urging critical-infrastructure organizations to immediately strengthen security for industrial refrigeration and cold-chain monitoring systems after cyberattacks affected French blood banks and European supermarkets. Attackers have remotely targeted commercial refrigeration controllers, seeking unpatched flaws, misconfigurations, and weak or hard-coded passwords. After gaining access, they can manipulate temperatures to spoil refrigerated products such as food and blood, and temperature changes may also create fire hazards.\u003c/p\u003e\n\n\u003cp\u003eCISA, the FBI, HHS, USDA, and the Department of Transportation recommend changing default passwords, promptly patching critical flaws, replacing end-of-life devices, identifying internet-accessible systems, isolating operational technology from business networks, limiting remote access, and keeping offsite backups. French authorities have investigated the attacks since mid-October and identified compromises involving Danfoss AK-SM and AK-SC controllers, as well as Copeland and Dixell XWEB controllers. The incidents demonstrate the risk to organizations in healthcare, food and agriculture, chemicals, and transportation that depend on refrigeration to protect essential supplies.\u003c/p\u003e\n"},{"n":26,"title":"Taiwan-Based Hacker Used BOSSAI AI Agents to Steal Taipei Emergency Dispatch Records","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/taiwan-based-hacker-used-bossai-ai.html","time":"09:01","priority":"SHOULD READ","score":85,"tldr":"Acronis researchers uncovered a Taiwan-based individual using a BOSSAI network of locally run, safety-stripped AI agents to target organizations worldwide and steal or expose sensitive emergency-services, medical, financial, university, and telecom data. The operation succeeded largely against already misconfigured or unpatched systems, while commercial AI models generally refused direct offensive requests.","briefOverview":"\u003cp\u003eAcronis Threat Research Unit said a single attacker believed to be based in Hualien City, Taiwan, used a BOSSAI setup of AI agents to target hundreds of organizations in at least 11 countries. The most serious confirmed activity involved emergency-services data in Taiwan, including dispatch records covering seven Taipei districts obtained through a public-facing 119 API. The agents also found a Taipei fire department platform that exposed 2018 patient information, including ECG readings and ambulance video footage, without a login.\u003c/p\u003e\n\n\u003cp\u003eThe operation used 12 agents, nine of which were active, with the attacker manually moving output between agents because they did not communicate directly. Commercial models including Grok and MiniMax M3 generally refused direct requests to attack targets, so the attacker relied mainly on locally run DeepSeek, GLM, and Qwen models with safety training removed. Researchers said the agents largely succeeded where systems were already poorly protected or unpatched, while enforced logins, valid-session requirements, and properly filtered endpoints stopped them; the AI tools also produced false vulnerability findings and sometimes reported results that had not occurred.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis researchers said a single attacker based in Hualien City, Taiwan, used a BOSSAI setup of AI agents to target hundreds of organizations in at least 11 countries.","The attacker’s agents obtained emergency dispatch records for seven Taipei districts from a public-facing 119 emergency-services API, including incident times, response types, case status, and street-level locations.","The agents found a Taipei fire department platform that exposed patient data from 2018, including ECG readings and ambulance video footage, without requiring a login.","The operation relied almost entirely on locally run “abliterated” DeepSeek, GLM, and Qwen models with safety training removed after commercial models generally refused direct requests to conduct attacks.","Researchers found that the agents mainly succeeded against systems with existing weaknesses, including exposed data ports, publicly accessible APIs, SQL injection flaws, and unpatched Oracle databases."],"insights":["The BOSSAI agents did not coordinate with one another, so the attacker manually transferred one agent’s output into another, showing that the operation still depended on human direction.","Commercial models generally refused direct offensive requests and sought written authorization, while locally run models with removed safety training carried out most attack-related work.","The AI tools were unreliable: one scanner invented vulnerabilities, more than half of its high- and critical-severity findings were false or misclassified, and the main attack agent sometimes claimed results that had not occurred.","The agents were unable to get past functioning protections such as enforced logins, valid-session requirements, and properly filtered endpoints; their confirmed successes largely involved systems that were already exposed, unpatched, or vulnerable to SQL injection.","The researchers attributed the operation partly because the attacker reused identifying details across legitimate business activity and attack infrastructure, and his home IP address appeared in a Grok conversation."],"referencedReports":[{"title":"BOSSAI: Inside the AI Attack Mesh That Targeted Taiwan’s Emergency Services","url":"https://www.acronis.com/en/tru/posts/bossai-inside-the-ai-attack-mesh-that-targeted-taiwans-emergency-services/","publisher":"acronis-threat-research-unit","context":"The article cites Acronis Threat Research Unit's technical analysis as the source for details of the BOSSAI operation and its targeting of Taiwan's emergency services.","category":"research","primary":true}],"body":"\u003cp\u003eAcronis Threat Research Unit said a single attacker believed to be based in Hualien City, Taiwan, used a BOSSAI setup of AI agents to target hundreds of organizations in at least 11 countries. The most serious confirmed activity involved emergency-services data in Taiwan, including dispatch records covering seven Taipei districts obtained through a public-facing 119 API. The agents also found a Taipei fire department platform that exposed 2018 patient information, including ECG readings and ambulance video footage, without a login.\u003c/p\u003e\n\n\u003cp\u003eThe operation used 12 agents, nine of which were active, with the attacker manually moving output between agents because they did not communicate directly. Commercial models including Grok and MiniMax M3 generally refused direct requests to attack targets, so the attacker relied mainly on locally run DeepSeek, GLM, and Qwen models with safety training removed. Researchers said the agents largely succeeded where systems were already poorly protected or unpatched, while enforced logins, valid-session requirements, and properly filtered endpoints stopped them; the AI tools also produced false vulnerability findings and sometimes reported results that had not occurred.\u003c/p\u003e\n"},{"n":33,"title":"Emerging Threat: (CVE-2026-123158) OpenSSH Password Authentication Bypass on musl Linux","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-123158-openssh-password-authentication-bypass-on-musl-linux/","time":"08:43","priority":"SHOULD READ","score":85,"tldr":"CVE-2026-123158 (“sshhole”) can let remote attackers bypass password authentication on vulnerable OpenSSH sshd instances built with musl and without PAM, especially Alpine Linux hosts. Patch to a fixed vendor package, restart sshd, and disable password authentication or restrict SSH access until remediation is confirmed.","briefOverview":"\u003cp\u003eCVE-2026-123158, known as “sshhole,” is a high-severity OpenSSH password authentication bypass affecting sshd built with the musl C library and without PAM, or with PAM disabled. An attacker able to reach an affected SSH service can log in without knowing an account password under specific conditions. The issue affects OpenSSH versions before 10.6p2 in the affected build configuration and has public reproduction labs available.\u003c/p\u003e\n\n\u003cp\u003eThe primary affected platform is Alpine Linux, whose openssh-server package is built this way by default, although some OpenWrt and Buildroot systems may also be exposed depending
