<script type="application/json" id="dl-articles">[{"n":6,"title":"China-linked hackers turning popular cybersecurity tool into ransomware launchpad, Microsoft warns","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/china-hackers-ransomware-microsoft","time":"13:15","priority":"MUST READ","score":96,"tldr":"Microsoft warns that China-linked Storm-1175 is likely exploiting a critical N-able N-central flaw to turn MSP remote management servers into launchpads for rapid downstream ransomware attacks using the new StormEncryptor strain. Organizations running N-central should urgently apply the latest hotfixes and reduce exposure, as earlier patches were bypassed and many instances remain vulnerable.","briefOverview":"\u003cp\u003eMicrosoft Threat Intelligence warned that the China-linked Storm-1175 group began deploying a new ransomware strain called StormEncryptor on August 2. The group is believed to be exploiting CVE-2026-18577, a critical vulnerability in N-able’s N-central remote monitoring and management console. N-central is used by thousands of managed service providers to administer client endpoints, making the flaw a potential supply-chain risk.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability can give attackers unauthenticated, full administrative control of an N-central server, according to Huntress. Because managed service providers use N-central to remotely manage clients’ machines, one compromised server can become a gateway to every endpoint it controls. The article compares the potential cascading impact to earlier attacks involving Kaseya in 2021 and ConnectWise ScreenConnect in 2024.\u003c/p\u003e\n\n\u003cp\u003eN-able said the flaw was first detected in a zero-day attack on July 31 and that attackers found a way around an initial patch. The company issued an emergency hotfix on August 2 and a second emergency hotfix on August 6, warning customers that the first was not enough. Huntress said more than half of reachable N-central cloud servers across its partner base were still unpatched, while 28.6% of self-hosted instances remained exposed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Threat Intelligence warned that the China-linked Storm-1175 group began deploying a new ransomware strain called StormEncryptor on August 2.","Microsoft said Storm-1175 is likely exploiting CVE-2026-18577, a critical vulnerability in N-able’s N-central remote monitoring and management console.","Huntress said CVE-2026-18577 allows attackers with no credentials to gain full administrative control of an N-central server, which can provide access to every endpoint the server manages.","N-able said the vulnerability was first detected in a zero-day attack on July 31 and issued emergency hotfixes on August 2 and August 6 after attackers bypassed an initial patch.","Huntress found that more than half of reachable N-central cloud servers across its partner base were still unpatched, along with 28.6% of self-hosted instances."],"insights":["The biggest risk is not just one N-central server being compromised, but the cascading access it can provide to every client endpoint managed through that server.","Patching alone may be unreliable unless customers have applied the latest emergency hotfix, because N-able said attackers bypassed an initial patch before later fixes were issued.","The campaign moved faster than many organizations could patch, with StormEncryptor deployments beginning the same day CVE-2026-18577 was disclosed and many reachable servers still exposed afterward.","Taking N-central offline may reduce exposure in high-risk environments, but Huntress warned this creates a difficult tradeoff because organizations could lose central visibility, patching, and remote access when they may need them most."],"referencedReports":[{"title":"Storm-1175 focuses gaze on vulnerable web-facing assets in high-tempo Medusa ransomware operations","url":"https://www.microsoft.com/en-us/security/blog/2026/04/06/storm-1175-focuses-gaze-on-vulnerable-web-facing-assets-in-high-tempo-medusa-ransomware-operations/","publisher":"Microsoft","context":"The article cites this Microsoft analysis for background on Storm-1175’s prior Medusa ransomware activity and rapid exploitation behavior.","category":"research","primary":false},{"title":"N-able Vulnerability Exploitation","url":"https://www.huntress.com/blog/n-able-vulnerability-exploitation","publisher":"Huntress","context":"The article cites Huntress for details on the severity of CVE-2026-18577, downstream host activity, patch exposure, and mitigation considerations.","category":"research","primary":true},{"title":"N-central Security Update August 6, 2026","url":"https://www.n-able.com/blog/n-central-security-update-august-6-2026","publisher":"N-able","context":"The article cites N-able’s security update for information about the emergency hotfixes and the warning that the first fix was insufficient.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft Threat Intelligence warned that the China-linked Storm-1175 group began deploying a new ransomware strain called StormEncryptor on August 2. The group is believed to be exploiting CVE-2026-18577, a critical vulnerability in N-able’s N-central remote monitoring and management console. N-central is used by thousands of managed service providers to administer client endpoints, making the flaw a potential supply-chain risk.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability can give attackers unauthenticated, full administrative control of an N-central server, according to Huntress. Because managed service providers use N-central to remotely manage clients’ machines, one compromised server can become a gateway to every endpoint it controls. The article compares the potential cascading impact to earlier attacks involving Kaseya in 2021 and ConnectWise ScreenConnect in 2024.\u003c/p\u003e\n\n\u003cp\u003eN-able said the flaw was first detected in a zero-day attack on July 31 and that attackers found a way around an initial patch. The company issued an emergency hotfix on August 2 and a second emergency hotfix on August 6, warning customers that the first was not enough. Huntress said more than half of reachable N-central cloud servers across its partner base were still unpatched, while 28.6% of self-hosted instances remained exposed.\u003c/p\u003e\n"},{"n":8,"title":"TrueConf Server Flaws Exploited to Replace Client Installers with PhantomCore","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/head-mare-exploits-trueconf-flaws-to.html","time":"11:33","priority":"MUST READ","score":94,"tldr":"Head Mare exploited chained flaws in unpatched TrueConf Server instances to replace legitimate client installers with PhantomCore-infected versions, giving attackers SYSTEM-level access and persistent web shell control. The flaws are patched in newer TrueConf Server releases, so affected organizations should update immediately.","briefOverview":"\u003cp\u003eThe threat actor Head Mare has been observed exploiting flaws in unpatched TrueConf servers in attacks targeting Russian companies in instrumentation, electronics, transport, energy, IT, and software development. Kaspersky said it detected the attacks in July 2026. The activity used a vulnerability chain to replace legitimate TrueConf client installers with poisoned versions that delivered the PhantomCore backdoor and remote access trojan.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities, tracked as KLCERT-26-057 and KLCERT-26-058, enabled arbitrary code execution with elevated privileges on affected TrueConf Server versions. Attackers connected to TCP port 4307, used the flaws to escape an isolated environment, ran code as NT AUTHORITY\\SYSTEM, and replaced \u0026ldquo;\u0026hellip;\\public\\js\\locale.php\u0026rdquo; with a web shell. Kaspersky said the web shell was used to collect IT infrastructure data, gain privileged access to the TrueConf database, deliver PhantomGraph, launch an SSH reverse tunnel, dump lsass.exe memory, and collect system information.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a separate HelloNet campaign that Kaspersky said abused the ViPNet update mechanism against Russian government, energy, transport, education, and logistics sectors. That activity involved a malicious DLL called HelloInjector, a hidden proxy and loader called HelloProxy, and additional components named HelloExecutor, HelloCleaner, and HelloBackdoor. TrueConf patched the listed vulnerabilities in Server versions 5.3.9, 5.4.9, and 5.5.5 released on June 18, 2026, and organizations using TrueConf were advised to download the latest versions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky detected July 2026 attacks in which the threat actor Head Mare exploited chained flaws in unpatched TrueConf servers targeting Russian companies in instrumentation, electronics, transport, energy, IT, and software development sectors.","The TrueConf attack exploited KLCERT-26-057 and KLCERT-26-058 to achieve arbitrary code execution with NT AUTHORITY\\SYSTEM privileges and replace the file \"...\\public\\js\\locale.php\" with a web shell.","The attackers used the TrueConf web shell to collect information about IT infrastructure, gain privileged access to the TrueConf database, and replace the original TrueConf Client installer with an infected version containing the PhantomCore backdoor and remote access trojan.","Kaspersky said the web shell also delivered PhantomGraph, which uses SysExcSvc.dll and SysReadSvc.dll modules and Microsoft OneDrive as command-and-control storage.","Kaspersky also reported a separate HelloNet campaign abusing the ViPNet update mechanism to load HelloInjector, HelloProxy, HelloExecutor, HelloCleaner, and HelloBackdoor against Russian government, energy, transport, education, and logistics sectors."],"insights":["The TrueConf flaws were patched on June 18, 2026, before Kaspersky detected the July 2026 attacks, making delayed patching a central risk for affected organizations.","The attackers abused TrueConf’s own client distribution path, meaning users could be infected by downloading what appeared to be the legitimate TrueConf Client from a compromised server.","PhantomGraph was deliberately split into two DLL modules, which Kaspersky said was likely intended to make detection by endpoint security tools harder.","The article describes two separate campaigns against Russian organizations that abused trusted software delivery mechanisms, TrueConf client installers and the ViPNet update system, showing a repeated focus on widely used domestic software as an intrusion route.","The HelloNet activity included a cleanup component, HelloCleaner, specifically designed to erase ViPNet software log files and reduce forensic evidence."],"referencedReports":[{"title":"Head Mare targets TrueConf Server with PhantomCore","url":"https://securelist.ru/tr/head-mare-targets-trueconf-server-with-phantomcore/116557/","publisher":"Kaspersky","context":"The article cites Kaspersky’s analysis of Head Mare exploiting TrueConf Server flaws to deploy PhantomCore and PhantomGraph.","category":"research","primary":true},{"title":"HelloNet: ViPNet update mechanism hijacked to deploy HelloInjector and HelloProxy","url":"https://securelist.com/tr/hellonet-vipnet/120700/","publisher":"Kaspersky","context":"The article cites Kaspersky’s report on the HelloNet campaign abusing the ViPNet update mechanism against Russian organizations.","category":"research","primary":true}],"body":"\u003cp\u003eThe threat actor Head Mare has been observed exploiting flaws in unpatched TrueConf servers in attacks targeting Russian companies in instrumentation, electronics, transport, energy, IT, and software development. Kaspersky said it detected the attacks in July 2026. The activity used a vulnerability chain to replace legitimate TrueConf client installers with poisoned versions that delivered the PhantomCore backdoor and remote access trojan.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities, tracked as KLCERT-26-057 and KLCERT-26-058, enabled arbitrary code execution with elevated privileges on affected TrueConf Server versions. Attackers connected to TCP port 4307, used the flaws to escape an isolated environment, ran code as NT AUTHORITY\\SYSTEM, and replaced \u0026ldquo;\u0026hellip;\\public\\js\\locale.php\u0026rdquo; with a web shell. Kaspersky said the web shell was used to collect IT infrastructure data, gain privileged access to the TrueConf database, deliver PhantomGraph, launch an SSH reverse tunnel, dump lsass.exe memory, and collect system information.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a separate HelloNet campaign that Kaspersky said abused the ViPNet update mechanism against Russian government, energy, transport, education, and logistics sectors. That activity involved a malicious DLL called HelloInjector, a hidden proxy and loader called HelloProxy, and additional components named HelloExecutor, HelloCleaner, and HelloBackdoor. TrueConf patched the listed vulnerabilities in Server versions 5.3.9, 5.4.9, and 5.5.5 released on June 18, 2026, and organizations using TrueConf were advised to download the latest versions.\u003c/p\u003e\n"},{"n":7,"title":"New Passkey Attacks Can Recover Synced Private Keys or Bypass Phishing-Resistant MFA","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/new-passkey-attacks-can-recover-synced.html","time":"12:25","priority":"SHOULD READ","score":86,"tldr":"Recent research showed that passkeys can be bypassed or abused when surrounding systems expose signed authentication data, mishandle synced key protection, or allow malware in an active Windows session to use hardware-backed credentials. The core cryptography remains intact, but defenders should patch Windows, harden WebAuthn validation, and treat endpoints and passkey stores as high-value credential targets.","briefOverview":"\u003cp\u003eThree separate research efforts demonstrated ways to defeat passkey protections without breaking the cryptography they rely on. SpecterOps showed a Windows and Microsoft Entra ID chain that could impersonate privileged users while satisfying phishing-resistant multifactor authentication by reusing signed authentication material. Unit 42 showed attacks against Google Password Manager in Chrome on Windows, including a path to recover private keys for a victim\u0026rsquo;s synced passkeys. Dirk-jan Mollema showed that malware already running in a signed-in Windows session can use a hardware-bound Windows Hello for Business key without a fresh PIN or biometric check.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the impact and fixes differ across the three cases. Microsoft\u0026rsquo;s Windows logging vulnerability, CVE-2026-34348, has a vendor CVSS score of 6.5 and a Microsoft security update, and Microsoft said it also applied mitigations for the reported issue involving passkey relay assertions. Unit 42\u0026rsquo;s most damaging variant, Golden Pass-ta-key, targets the Security Domain Secret, a 32-byte master key used to protect synced passkeys, and the researchers said Google\u0026rsquo;s current implementation provides no way to rotate or revoke it. Mollema found that an Entra WebAuthn challenge is valid for five minutes and is not bound to a session, user, or tenant, allowing it to be signed on a victim machine and returned as an assertion.\u003c/p\u003e\n\n\u003cp\u003eThe findings show that neither synced passkeys nor device-bound passkeys remove risk when surrounding systems mishandle authentication material or when an endpoint is already compromised. The article says Unit 42\u0026rsquo;s and Mollema\u0026rsquo;s attacks begin with malware or access inside an existing user session, so they show what passkeys may fail to contain after endpoint compromise rather than an unauthenticated remote defeat. Recommended actions include installing Microsoft\u0026rsquo;s applicable updates for CVE-2026-34348, enforcing requested WebAuthn user-verification requirements, treating passkey stores and browser memory as credential-sensitive, and monitoring unusual Windows Hello for Business authentications without a device identifier and unexpected device registrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three separate research efforts demonstrated ways to defeat passkey protections without breaking the cryptography behind them.","SpecterOps showed a Windows and Microsoft Entra ID chain that reused signed authentication material exposed by Windows to impersonate privileged users while satisfying phishing-resistant multifactor authentication.","Unit 42 showed attacks against Google Password Manager in Chrome on Windows, including a method called Golden Pass-ta-key that can recover private keys for a victim's synced passkeys by targeting the Security Domain Secret.","Dirk-jan Mollema showed that malware already running in a signed-in Windows session can use a hardware-bound Windows Hello for Business key without prompting the user for a fresh PIN or biometric check.","Microsoft has issued a security update for CVE-2026-34348 and said it applied mitigations for the reported issue involving passkey relay assertions."],"insights":["The article emphasizes that choosing between synced and device-bound passkeys does not eliminate the broader risk, because the demonstrated attacks target different surrounding systems rather than the passkey cryptography itself.","Unit 42's findings make the Security Domain Secret especially consequential because the article says Google's current implementation provides no way to rotate or revoke it after compromise.","Mollema's research shows an actionable monitoring angle for Entra defenders: unusual Windows Hello for Business authentications without a device identifier and unexpected device registrations may indicate abuse.","The SpecterOps and Mollema findings both involved Microsoft Entra ID authentication outcomes, but the article cautions that the public material does not establish whether they come from the same underlying Entra validation issue."],"referencedReports":[{"title":"Pass-the-Passkey","url":"https://specterops.io/wp-content/uploads/sites/3/2026/08/Pass-the-Passkey_A4_v2.pdf","publisher":"SpecterOps","context":"The article cites SpecterOps' Pass-the-Passkey research presented at Black Hat USA 2026 as the source for the Windows and Microsoft Entra ID passkey impersonation chain.","category":"research","primary":true},{"title":"CVE-2026-34348","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-34348","publisher":"National Vulnerability Database","context":"The article links to the NVD entry for CVE-2026-34348, the Windows Event Logging Service information-disclosure vulnerability discussed in the SpecterOps chain.","category":"advisory","primary":false},{"title":"Microsoft Entra SMS and voice authentication retirement guidance","url":"https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sms-voice-retirement","publisher":"Microsoft","context":"The article references Microsoft Entra migration guidance that describes passkeys as resistant to replay attacks and notes upcoming SMS and voice authentication retirement timelines.","category":"guide","primary":false}],"body":"\u003cp\u003eThree separate research efforts demonstrated ways to defeat passkey protections without breaking the cryptography they rely on. SpecterOps showed a Windows and Microsoft Entra ID chain that could impersonate privileged users while satisfying phishing-resistant multifactor authentication by reusing signed authentication material. Unit 42 showed attacks against Google Password Manager in Chrome on Windows, including a path to recover private keys for a victim\u0026rsquo;s synced passkeys. Dirk-jan Mollema showed that malware already running in a signed-in Windows session can use a hardware-bound Windows Hello for Business key without a fresh PIN or biometric check.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the impact and fixes differ across the three cases. Microsoft\u0026rsquo;s Windows logging vulnerability, CVE-2026-34348, has a vendor CVSS score of 6.5 and a Microsoft security update, and Microsoft said it also applied mitigations for the reported issue involving passkey relay assertions. Unit 42\u0026rsquo;s most damaging variant, Golden Pass-ta-key, targets the Security Domain Secret, a 32-byte master key used to protect synced passkeys, and the researchers said Google\u0026rsquo;s current implementation provides no way to rotate or revoke it. Mollema found that an Entra WebAuthn challenge is valid for five minutes and is not bound to a session, user, or tenant, allowing it to be signed on a victim machine and returned as an assertion.\u003c/p\u003e\n\n\u003cp\u003eThe findings show that neither synced passkeys nor device-bound passkeys remove risk when surrounding systems mishandle authentication material or when an endpoint is already compromised. The article says Unit 42\u0026rsquo;s and Mollema\u0026rsquo;s attacks begin with malware or access inside an existing user session, so they show what passkeys may fail to contain after endpoint compromise rather than an unauthenticated remote defeat. Recommended actions include installing Microsoft\u0026rsquo;s applicable updates for CVE-2026-34348, enforcing requested WebAuthn user-verification requirements, treating passkey stores and browser memory as credential-sensitive, and monitoring unusual Windows Hello for Business authentications without a device identifier and unexpected device registrations.\u003c/p\u003e\n"},{"n":10,"title":"Known Sender, Perfect Auth, Confirmed Malicious Link","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/full-auth-salesforce-mta-confirmed-malicious-link-denied-releases","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A fully authenticated vendor CRM reply in a real healthcare service thread was quarantined because it contained a URL independently scored as malicious, showing that SPF, DKIM, DMARC, and sender familiarity do not prove message safety. Release decisions should evaluate the flagged content itself, not rely on known-sender trust.","briefOverview":"\u003cp\u003eA logistics coordinator at a regional U.S. healthcare system received a reply to a service request sent a week earlier to a long-standing equipment vendor. The message referenced the correct service case, instrument serial numbers, and a third item the service center had received. It came from the vendor’s own corporate domain through the vendor’s CRM sending stream, with SPF, DKIM, DMARC, and Microsoft composite authentication all passing.\u003c/p\u003e\n\n\u003cp\u003eDespite those trust signals, one hyperlink in ordinary paragraph text pointed to \u003ccode\u003ehxxps://process[.]to/\u003c/code\u003e and carried a recorded malicious verdict. The article says the link scanner recorded the URL as malicious, and an analyst comment cited an external sandbox analysis with a malicious threat level and a score of 66 out of 100. Microsoft Defender for Office 365 had rewritten the URL through Safe Links, but the destination still received malicious verdicts.\u003c/p\u003e\n\n\u003cp\u003eThe message was quarantined on arrival and was quarantined twice more on repeat delivery attempts. Three separate release requests were submitted on the grounds that the sender was known, and all three were denied with the malicious-content disposition unchanged. The article emphasizes that authentication confirms sender identity and message integrity, but it does not determine whether a URL inside an authenticated message is safe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A logistics coordinator at a regional U.S. healthcare system received a reply to a genuine service request from a long-standing equipment vendor, and the message included the correct case reference and instrument serial numbers.","The email came from the vendor’s own corporate domain through its CRM sending stream, with SPF, DKIM, DMARC, and Microsoft composite authentication all passing.","One hyperlink in ordinary paragraph text pointed to hxxps://process[.]to/, which was recorded as malicious by the link scanner and corroborated by an external sandbox score of 66 out of 100.","The message was quarantined on arrival and two more times on repeat delivery attempts, and three release requests based on the sender being known were all denied.","The article states that authentication confirms sender identity and message integrity but does not determine whether a URL inside the message is safe."],"insights":["The strongest reason users gave for releasing the quarantined email, that it came from a known vendor in a real thread, was unrelated to the actual reason it was blocked: a malicious URL verdict.","The article highlights that Safe Links rewriting changed the route of the URL but did not by itself settle whether the destination was safe.","The malicious link was embedded across a sentence boundary in ordinary service-desk prose, showing that dangerous links may not appear as obvious buttons or suspicious calls to action.","The sending vendor’s role was described as incidental, with no evidence of domain compromise, account compromise, or tenant tampering, which makes the case a content-verdict problem rather than a sender-authentication problem.","The article recommends that release workflows require evidence about the specific flagged URL before overturning quarantine, especially when operational pressure makes known-sender requests predictable."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article cites the 2026 Verizon Data Breach Investigations Report for statistics on the human element in breaches and phishing as an initial access vector.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance to support treating URL and payload handling separately from sender validation.","category":"guide","primary":false}],"body":"\u003cp\u003eA logistics coordinator at a regional U.S. healthcare system received a reply to a service request sent a week earlier to a long-standing equipment vendor. The message referenced the correct service case, instrument serial numbers, and a third item the service center had received. It came from the vendor’s own corporate domain through the vendor’s CRM sending stream, with SPF, DKIM, DMARC, and Microsoft composite authentication all passing.\u003c/p\u003e\n\n\u003cp\u003eDespite those trust signals, one hyperlink in ordinary paragraph text pointed to \u003ccode\u003ehxxps://process[.]to/\u003c/code\u003e and carried a recorded malicious verdict. The article says the link scanner recorded the URL as malicious, and an analyst comment cited an external sandbox analysis with a malicious threat level and a score of 66 out of 100. Microsoft Defender for Office 365 had rewritten the URL through Safe Links, but the destination still received malicious verdicts.\u003c/p\u003e\n\n\u003cp\u003eThe message was quarantined on arrival and was quarantined twice more on repeat delivery attempts. Three separate release requests were submitted on the grounds that the sender was known, and all three were denied with the malicious-content disposition unchanged. The article emphasizes that authentication confirms sender identity and message integrity, but it does not determine whether a URL inside an authenticated message is safe.\u003c/p\u003e\n"},{"n":2,"title":"LexisNexis shuts down services after suspicious activity on servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/lexisnexis-shuts-down-services-after-suspicious-activity-on-servers/","time":"12:11","priority":"SHOULD READ","score":80,"tldr":"LexisNexis took its Nexis Diligence, Metabase API, and Newsdesk services offline after detecting suspicious activity on servers hosted by a third-party vendor. The company says it is investigating with a forensic firm and rebuilding affected systems before restoring service.","briefOverview":"\u003cp\u003eLexisNexis took its Diligence, Metabase API, and Newsdesk services offline after identifying unusual activity on servers hosted and managed by an unnamed third-party vendor. The company said it disconnected from those third-party systems to protect customers and contain the issue at its source. LexisNexis is investigating the incident with help from a cybersecurity forensic firm and is rebuilding affected systems in a new environment before bringing the services back online.\u003c/p\u003e\n\n\u003cp\u003eThe affected services support several types of business work. Nexis Diligence is used by compliance professionals for due diligence and risk research, Nexis Metabase API provides news and media data feeds for enterprise systems, and Nexis Newsdesk is used by communications, public relations, and marketing teams for media monitoring and analytics. LexisNexis services are widely used by corporations, law firms, financial institutions, government agencies, consultants, and researchers.\u003c/p\u003e\n\n\u003cp\u003eTodd Larsen, president of the global Nexis Solutions division of LexisNexis, confirmed that the services were taken down due to suspicious activity on vendor servers. Larsen also said Nexis Solutions is not a Metabase Cloud customer and that the Nexis Metabase API product has no connection to Metabase Cloud or the reported Metabase Cloud SQL injection vulnerability. The article notes prior LexisNexis cybersecurity incidents, including a May 2025 disclosure affecting 364,000 individuals and a March incident involving FulcrumSec and stolen files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LexisNexis took its Diligence, Metabase API, and Newsdesk services offline after detecting unusual activity on servers hosted and managed by an unnamed third-party vendor.","The company said it disconnected from the third-party systems to protect customers and contain the issue at its source.","LexisNexis is investigating the incident with help from a cybersecurity forensic firm and is rebuilding affected systems in a new environment before restoring the services.","Todd Larsen said Nexis Solutions is not a Metabase Cloud customer and that the Nexis Metabase API product has no connection to Metabase Cloud or the reported SQL injection vulnerability.","LexisNexis previously disclosed a May 2025 incident involving the theft of personal data from 364,000 individuals after unauthorized access to private GitHub repositories."],"insights":["LexisNexis treated the vendor-hosted servers as risky enough to fully disconnect from them and rebuild affected systems in a new environment before restoring service.","The Nexis Metabase API name could be confused with Metabase Cloud, but LexisNexis explicitly said the product is unrelated to Metabase Cloud or the reported SQL injection issue.","The incident affects services used by different business functions, including compliance, enterprise data integration, and communications or marketing teams.","This is at least the third cybersecurity issue mentioned for LexisNexis since 2025, following the GitHub repository breach and the FulcrumSec incident involving AWS infrastructure."],"referencedReports":[],"body":"\u003cp\u003eLexisNexis took its Diligence, Metabase API, and Newsdesk services offline after identifying unusual activity on servers hosted and managed by an unnamed third-party vendor. The company said it disconnected from those third-party systems to protect customers and contain the issue at its source. LexisNexis is investigating the incident with help from a cybersecurity forensic firm and is rebuilding affected systems in a new environment before bringing the services back online.\u003c/p\u003e\n\n\u003cp\u003eThe affected services support several types of business work. Nexis Diligence is used by compliance professionals for due diligence and risk research, Nexis Metabase API provides news and media data feeds for enterprise systems, and Nexis Newsdesk is used by communications, public relations, and marketing teams for media monitoring and analytics. LexisNexis services are widely used by corporations, law firms, financial institutions, government agencies, consultants, and researchers.\u003c/p\u003e\n\n\u003cp\u003eTodd Larsen, president of the global Nexis Solutions division of LexisNexis, confirmed that the services were taken down due to suspicious activity on vendor servers. Larsen also said Nexis Solutions is not a Metabase Cloud customer and that the Nexis Metabase API product has no connection to Metabase Cloud or the reported Metabase Cloud SQL injection vulnerability. The article notes prior LexisNexis cybersecurity incidents, including a May 2025 disclosure affecting 364,000 individuals and a March incident involving FulcrumSec and stolen files.\u003c/p\u003e\n"},{"n":1,"title":"Valve notifies Steam hardware customers of a data breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/valve-notifies-steam-hardware-customers-of-a-data-breach/","time":"11:47","priority":"SHOULD READ","score":78,"tldr":"Valve is notifying European Steam hardware customers that their shipping details were likely stolen after a cyberattack on logistics partner CEVA Logistics. The exposed data includes names, addresses, phone numbers, emails, and order details, but not Steam passwords, payment data, or Steam Guard codes.","briefOverview":"\u003cp\u003eValve is notifying Steam hardware customers in Europe that hackers stole their data after breaching its shipping partner, CEVA Logistics. Valve said the attackers had access to CEVA Logistics\u0026rsquo; servers between July 29 and August 1, 2026. Valve learned on August 7 that certain Steam customer information was likely compromised.\u003c/p\u003e\n\n\u003cp\u003eCEVA Logistics receives delivery-related information from Steam so it can ship physical hardware to customers in Europe, and it retains that information for up to 90 days after an order. The stolen data includes names, addresses, phone numbers, email addresses, and the type and price of ordered products. Valve said no Steam account information, payment information, passwords, Steam Guard codes, or other sensitive data was impacted because CEVA does not have access to those details.\u003c/p\u003e\n\n\u003cp\u003eValve warned affected customers that they may be targeted by email, SMS, or voice phishing messages impersonating Steam, Valve, or delivery companies. The company said scammers may quote a customer\u0026rsquo;s address, ask them to confirm a delivery, pay a small customs or redelivery fee, or sign in somewhere to verify an order. Valve said it is pressing CEVA for the full scope of what was taken and is notifying data protection authorities in affected countries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Valve is notifying Steam hardware customers in Europe that their data was stolen after hackers breached its shipping partner, CEVA Logistics.","Valve said attackers had access to CEVA Logistics' servers between July 29 and August 1, 2026, and Valve learned on August 7 that some Steam customer information was likely compromised.","The stolen data includes affected customers' names, addresses, phone numbers, email addresses, and the type and price of ordered products.","Valve said CEVA Logistics did not have access to payment information, passwords, Steam Guard codes, or other sensitive Steam account data.","Valve warned affected customers that they may receive phishing emails, text messages, or phone calls impersonating Steam, Valve, or delivery companies."],"insights":["Valve says affected customers do not need to change their Steam password or account settings because CEVA Logistics did not have access to Steam account credentials, payment data, or Steam Guard codes.","Valve specifically warned that messages quoting a customer’s real address should not be trusted, because scammers may use the stolen delivery details to make phishing attempts appear legitimate.","Customers who ordered Steam hardware within CEVA Logistics’ 90-day data retention window may be included in notifications even while CEVA is still determining the full scope of the stolen data.","The breach highlights that customer exposure came through a third-party shipping provider rather than Valve’s own Steam systems."],"referencedReports":[],"body":"\u003cp\u003eValve is notifying Steam hardware customers in Europe that hackers stole their data after breaching its shipping partner, CEVA Logistics. Valve said the attackers had access to CEVA Logistics\u0026rsquo; servers between July 29 and August 1, 2026. Valve learned on August 7 that certain Steam customer information was likely compromised.\u003c/p\u003e\n\n\u003cp\u003eCEVA Logistics receives delivery-related information from Steam so it can ship physical hardware to customers in Europe, and it retains that information for up to 90 days after an order. The stolen data includes names, addresses, phone numbers, email addresses, and the type and price of ordered products. Valve said no Steam account information, payment information, passwords, Steam Guard codes, or other sensitive data was impacted because CEVA does not have access to those details.\u003c/p\u003e\n\n\u003cp\u003eValve warned affected customers that they may be targeted by email, SMS, or voice phishing messages impersonating Steam, Valve, or delivery companies. The company said scammers may quote a customer\u0026rsquo;s address, ask them to confirm a delivery, pay a small customs or redelivery fee, or sign in somewhere to verify an order. Valve said it is pressing CEVA for the full scope of what was taken and is notifying data protection authorities in affected countries.\u003c/p\u003e\n"},{"n":3,"title":"Member of The Com sent to prison for blackmail, sextortion","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/member-of-the-com-sent-to-prison-for-blackmail-sextortion/","time":"12:56","priority":"SHOULD READ","score":78,"tldr":"Justin Swaddle, a 20-year-old member of The Com cybercrime collective, was sentenced to two years in prison in the UK for blackmail and sextortion offenses involving 117 girls aged 13 to 17 worldwide. Investigators said he coerced victims into producing sexual and self-harm content, highlighting ongoing law enforcement action against The Com and its child exploitation subgroups.","briefOverview":"\u003cp\u003eJustin Swaddle, a 20-year-old from Leeds and member of The Com, was sentenced to two years in prison for blackmail and sextortion offenses against nearly 120 victims worldwide. He used aliases including “Epstein,” “Rugen,” and “Moscow” on Snapchat, Telegram, and Discord, and was first arrested by West Yorkshire Police in October 2023. Swaddle pleaded guilty at Leeds Crown Court to multiple child sexual abuse offenses and blackmail, and he will be added to the National Sex Offenders Register and subject to a Sexual Harm Prevention Order for 10 years.\u003c/p\u003e\n\n\u003cp\u003eThe UK National Crime Agency identified 117 female victims worldwide, aged 13 to 17, after taking over the investigation in January 2024. Investigators found images on seized devices showing children aged three to 17, including self-harm injuries and indecent images in Categories A to C, and recovered Telegram messages showing attempts to incite abuse. The article also describes The Com as a loose-knit online collective with subgroups involved in child exploitation, self-harm coercion, offline harm, network intrusions, and ransomware attacks, and notes recent Europol-led actions including 30 arrests and thousands of URLs flagged for removal.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Justin Swaddle, a 20-year-old from Leeds and member of The Com, was sentenced to two years in prison for blackmail and sextortion offenses against nearly 120 victims worldwide.","Swaddle pleaded guilty at Leeds Crown Court to multiple child sexual abuse offenses and blackmail, and he will be placed on the National Sex Offenders Register and subject to a Sexual Harm Prevention Order for 10 years.","The UK National Crime Agency identified 117 female victims worldwide, aged 13 to 17, after taking over the investigation in January 2024.","Investigators found images on Swaddle’s devices showing children aged three to 17, including self-harm injuries and indecent images in Categories A to C.","The Com is a loose-knit online cybercrime collective with subgroups involved in child exploitation, self-harm coercion, network intrusions, ransomware attacks, and other criminal activity."],"insights":["The Com is not a single-purpose cybercrime group; the article describes subgroups spanning child exploitation, self-harm coercion, offline violence, terrorism-related activity, network intrusions, and ransomware attacks.","Swaddle’s aliases being carved into victims’ skin shows that the group’s online coercion can produce direct physical harm, not just digital or financial harm.","The investigation highlights the importance of private messaging platforms in this case, as Swaddle used Snapchat, Telegram, and Discord aliases and investigators recovered Telegram messages from his device.","Law enforcement action against The Com is international and ongoing, with Europol’s Project Compass leading to 30 arrests, 179 suspects linked to the group, and 4,340 URLs flagged for removal."],"referencedReports":[],"body":"\u003cp\u003eJustin Swaddle, a 20-year-old from Leeds and member of The Com, was sentenced to two years in prison for blackmail and sextortion offenses against nearly 120 victims worldwide. He used aliases including “Epstein,” “Rugen,” and “Moscow” on Snapchat, Telegram, and Discord, and was first arrested by West Yorkshire Police in October 2023. Swaddle pleaded guilty at Leeds Crown Court to multiple child sexual abuse offenses and blackmail, and he will be added to the National Sex Offenders Register and subject to a Sexual Harm Prevention Order for 10 years.\u003c/p\u003e\n\n\u003cp\u003eThe UK National Crime Agency identified 117 female victims worldwide, aged 13 to 17, after taking over the investigation in January 2024. Investigators found images on seized devices showing children aged three to 17, including self-harm injuries and indecent images in Categories A to C, and recovered Telegram messages showing attempts to incite abuse. The article also describes The Com as a loose-knit online collective with subgroups involved in child exploitation, self-harm coercion, offline harm, network intrusions, and ransomware attacks, and notes recent Europol-led actions including 30 arrests and thousands of URLs flagged for removal.\u003c/p\u003e\n"},{"n":5,"title":"New Zealand sanctions Russian hackers, propaganda groups over Ukraine war","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/new-zealand-russian-hackers-sanctions","time":"12:30","priority":"SHOULD READ","score":78,"tldr":"New Zealand sanctioned 33 Russian individuals and entities tied to cyberattacks, propaganda, sanctions evasion, and support for Moscow’s war in Ukraine. The targets include pro-Russian hacktivists, a bulletproof hosting operator, GRU-linked figures, Kremlin-backed media organizations, and technology firms supporting Russia’s defense sector.","briefOverview":"\u003cp\u003eNew Zealand imposed new sanctions on 33 Russian individuals and entities over their alleged roles in supporting Moscow’s war against Ukraine. The targets include people and organizations linked to the abduction of Ukrainian children, cyberattacks, and anti-Ukraine propaganda used to justify Russia’s invasion. Foreign Minister Winston Peters said cyber actors are being used to gather intelligence, enable sanctions evasion, and disrupt those opposing Russia’s aggression.\u003c/p\u003e\n\n\u003cp\u003eSeveral of the new designations involve Russian cyber actors previously accused by the United States and other Western governments of malicious activity. They include Yuliya Pankratova and Denis Degtyarenko of Cyber Army of Russia Reborn, as well as Aleksandr Volosovik, who U.S. prosecutors accuse of helping operate the Russian bulletproof hosting provider Media Land. The sanctions also name Andrey Averyanov, a senior Russian military intelligence officer who previously commanded GRU Unit 29155, whose cyber division has been accused of targeting governments, defense organizations, think tanks, and other entities in Ukraine and NATO countries.\u003c/p\u003e\n\n\u003cp\u003eThe measures also target Russia’s Internet Development Institute, its director Alexey Goreslavsky, and Russian information technology company LANIT, which has provided services to the Russian Defense Ministry and sanctioned defense-industry companies. New Zealand has sanctioned more than 2,000 Russian individuals, entities, and vessels since Russia’s full-scale invasion of Ukraine in February 2022. The sanctions generally include asset freezes and travel bans and prohibit New Zealanders from making funds or other assets available to designated individuals and entities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["New Zealand imposed new sanctions on 33 Russian individuals and entities over alleged roles in supporting Moscow’s war against Ukraine, including cyberattacks, propaganda and the abduction of Ukrainian children.","The sanctions include Yuliya Pankratova and Denis Degtyarenko of the pro-Russian hacktivist group Cyber Army of Russia Reborn, whom the U.S. Treasury sanctioned in 2024 over alleged cyber operations targeting U.S. critical infrastructure.","New Zealand sanctioned Aleksandr Volosovik, known online as “Yalishanda,” whom U.S. prosecutors accuse of helping operate the Russian bulletproof hosting provider Media Land.","Andrey Averyanov, a senior Russian military intelligence officer who previously commanded GRU Unit 29155, was also added to New Zealand’s sanctions list.","The new sanctions also target Russia’s Internet Development Institute and its director Alexey Goreslavsky, as well as the Russian information technology company LANIT."],"insights":["New Zealand’s latest sanctions closely mirror prior U.S. and Western actions, showing coordinated pressure on the same Russian cyber and influence networks rather than isolated national measures.","The designations treat online activity as part of Russia’s broader war effort, explicitly linking cyber operations to intelligence gathering, sanctions evasion and disruption of Russia’s opponents.","The inclusion of CARR members tied to industrial control and SCADA activity highlights that pro-Russian hacktivist operations are being addressed as critical infrastructure threats, not merely website defacement or propaganda activity.","The sanctions package combines hackers, hosting providers, propaganda financiers and defense-linked technology companies, showing New Zealand is targeting several support layers behind Russia’s war rather than only direct military actors."],"referencedReports":[],"body":"\u003cp\u003eNew Zealand imposed new sanctions on 33 Russian individuals and entities over their alleged roles in supporting Moscow’s war against Ukraine. The targets include people and organizations linked to the abduction of Ukrainian children, cyberattacks, and anti-Ukraine propaganda used to justify Russia’s invasion. Foreign Minister Winston Peters said cyber actors are being used to gather intelligence, enable sanctions evasion, and disrupt those opposing Russia’s aggression.\u003c/p\u003e\n\n\u003cp\u003eSeveral of the new designations involve Russian cyber actors previously accused by the United States and other Western governments of malicious activity. They include Yuliya Pankratova and Denis Degtyarenko of Cyber Army of Russia Reborn, as well as Aleksandr Volosovik, who U.S. prosecutors accuse of helping operate the Russian bulletproof hosting provider Media Land. The sanctions also name Andrey Averyanov, a senior Russian military intelligence officer who previously commanded GRU Unit 29155, whose cyber division has been accused of targeting governments, defense organizations, think tanks, and other entities in Ukraine and NATO countries.\u003c/p\u003e\n\n\u003cp\u003eThe measures also target Russia’s Internet Development Institute, its director Alexey Goreslavsky, and Russian information technology company LANIT, which has provided services to the Russian Defense Ministry and sanctioned defense-industry companies. New Zealand has sanctioned more than 2,000 Russian individuals, entities, and vessels since Russia’s full-scale invasion of Ukraine in February 2022. The sanctions generally include asset freezes and travel bans and prohibit New Zealanders from making funds or other assets available to designated individuals and entities.\u003c/p\u003e\n"},{"n":16,"title":"AI wrote exploit scripts against 12,500 domains and found live targets","source":"itnerd.blog","sourceColorIdx":9,"link":"https://itnerd.blog/2026/07/30/ai-wrote-exploit-scripts-against-12500-domains-and-found-live-targets/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=ai-wrote-exploit-scripts-against-12500-domains-and-found-live-targets","time":"12:24","priority":"SHOULD READ","score":78,"tldr":"An AI system autonomously generated exploit scripts and tested them across 12,500 domains, successfully finding live vulnerable targets. The key takeaway is that offensive security automation is becoming capable of real-world exploitation at internet scale.","briefOverview":"\u003cp\u003eThe article is titled “AI wrote exploit scripts against 12,500 domains and found live targets.” It describes AI being used to write exploit scripts and run them against a large set of domains. The stated scale of the activity was 12,500 domains.\u003c/p\u003e\n\n\u003cp\u003eThe main impact described is that the effort found live targets. The key technical detail available from the article is that the scripts were AI-written and were used against domains. No additional readable details about affected organizations, specific vulnerabilities, vendors, or remediation steps are present in the provided article text.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports that AI wrote exploit scripts.","The AI-written exploit scripts were used against 12,500 domains.","The activity found live targets among the tested domains."],"insights":["The article indicates that the AI-generated scripts were tested against real internet domains rather than only in a lab setting.","The finding of live targets shows that the AI-written exploit scripts produced actionable results, not merely theoretical code.","The scale of 12,500 domains highlights that the activity was broad enough to test many real-world targets in one effort."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “AI wrote exploit scripts against 12,500 domains and found live targets.” It describes AI being used to write exploit scripts and run them against a large set of domains. The stated scale of the activity was 12,500 domains.\u003c/p\u003e\n\n\u003cp\u003eThe main impact described is that the effort found live targets. The key technical detail available from the article is that the scripts were AI-written and were used against domains. No additional readable details about affected organizations, specific vulnerabilities, vendors, or remediation steps are present in the provided article text.\u003c/p\u003e\n"},{"n":12,"title":"IT threat evolution in Q2 2026. Mobile statistics","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/malware-report-q2-2026-mobile-statistics/120948/","time":"10:00","priority":"MAY READ","score":74,"tldr":"Kaspersky’s Q2 2026 mobile threat data shows overall Android malware, adware, and unwanted software attacks continued to decline, but banking Trojans remained the dominant mobile malware category. Google Play loaders delivering threats like Anatsa and evolving Mamont and Creduz banking Trojan activity stood out as key concerns.","briefOverview":"\u003cp\u003eKaspersky’s Q2 2026 mobile threat statistics report covers malware, adware, and potentially unwanted software affecting Android, along with notable Android and iOS threats observed during the quarter. According to Kaspersky Security Network, more than 1.99 million attacks on mobile devices were blocked, down from 2,676,328 in the previous quarter. Kaspersky also reported 304,128 malicious Android installation packages, including 93,574 related to mobile banking Trojans and 570 related to mobile ransomware Trojans.\u003c/p\u003e\n\n\u003cp\u003eThe report says Trojan-Banker was the most prevalent mobile malware category, accounting for 30.77% of total detected applications. Although newly discovered banking Trojan variants fell sharply, banking Trojans continued to dominate the threat landscape, and Mamont variants remained prominent among users who encountered banking threats. Kaspersky also noted that Creduz samples grew significantly despite low activity in victim telemetry, which it said suggests active iteration before a broader campaign.\u003c/p\u003e\n\n\u003cp\u003eKaspersky highlighted malicious loaders hosted directly on Google Play, including a trojanized PDF reader app that used a fake update request to install the Anatsa banking malware. Another loader, detected in the Cleanova app and several others, sent installation-source telemetry from SDKs to a command-and-control server and received a malicious payload only for certain sources. Kaspersky described this as a way to bypass app store review processes while targeting victims more precisely.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky blocked 1,996,823 attacks on mobile devices involving malware, adware, or unwanted software in Q2 2026, down from 2,676,328 in the previous quarter.","Kaspersky discovered 304,128 malicious Android installation packages in Q2 2026, including 93,574 related to mobile banking Trojans and 570 related to mobile ransomware Trojans.","Trojan-Banker was the most prevalent mobile malware category in Q2 2026, accounting for 30.77% of total detected applications.","Kaspersky found malicious loaders hosted directly on Google Play, including a trojanized PDF reader that used a fake update request to install the Anatsa banking malware.","The Cleanova app contained a loader that used installation-source telemetry from SDKs to decide whether to return a malicious payload, a method Kaspersky said can help bypass app store review processes."],"insights":["The decline in mobile attacks was partly linked to reduced activity from specific pre-installed Trojans, which Kaspersky says was likely connected to vendors rolling out patched firmware.","Some malicious Google Play apps used installation-source data from analytics SDKs to stay dormant outside the attackers’ intended scope, helping them avoid detection during app store review.","Although newly discovered banking Trojan packages dropped sharply, banking Trojans still dominated detected mobile malware, showing that lower sample volume did not translate into lower prominence.","Creduz banking Trojan samples increased significantly despite low activity in victim telemetry, which Kaspersky says suggests active development and testing before a broader campaign.","Mamont variants continued to dominate real-world mobile banking Trojan encounters, with newer versions replacing older ones in the rankings."],"referencedReports":[],"body":"\u003cp\u003eKaspersky’s Q2 2026 mobile threat statistics report covers malware, adware, and potentially unwanted software affecting Android, along with notable Android and iOS threats observed during the quarter. According to Kaspersky Security Network, more than 1.99 million attacks on mobile devices were blocked, down from 2,676,328 in the previous quarter. Kaspersky also reported 304,128 malicious Android installation packages, including 93,574 related to mobile banking Trojans and 570 related to mobile ransomware Trojans.\u003c/p\u003e\n\n\u003cp\u003eThe report says Trojan-Banker was the most prevalent mobile malware category, accounting for 30.77% of total detected applications. Although newly discovered banking Trojan variants fell sharply, banking Trojans continued to dominate the threat landscape, and Mamont variants remained prominent among users who encountered banking threats. Kaspersky also noted that Creduz samples grew significantly despite low activity in victim telemetry, which it said suggests active iteration before a broader campaign.\u003c/p\u003e\n\n\u003cp\u003eKaspersky highlighted malicious loaders hosted directly on Google Play, including a trojanized PDF reader app that used a fake update request to install the Anatsa banking malware. Another loader, detected in the Cleanova app and several others, sent installation-source telemetry from SDKs to a command-and-control server and received a malicious payload only for certain sources. Kaspersky described this as a way to bypass app store review processes while targeting victims more precisely.\u003c/p\u003e\n"},{"n":4,"title":"British ‘Com’ member who abused more than 100 girls worldwide jailed for two years","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/british-com-member-abuse-jailed-two-years","time":"13:46","priority":"MAY READ","score":68,"tldr":"A 20-year-old British member of an online “Com” group was sentenced to two years in prison for coercing 117 girls worldwide into sexual abuse and self-harm to gain status among peers. Authorities say the case highlights the severe harm caused by small online groups that extort minors and share abusive content across platforms like Snapchat, Telegram and Discord.","briefOverview":"\u003cp\u003eA 20-year-old man from Leeds, Justin Swaddle, was sentenced Monday to two years in prison for coercing more than 100 girls worldwide into sexual and self-harm activity. The National Crime Agency said he targeted 117 female victims aged 13 to 17 while using platforms including Snapchat, Telegram and Discord. He was 17 at the time of the offenses and operated under aliases including “Epstein” and “Moscow.”\u003c/p\u003e\n\n\u003cp\u003eSwaddle was part of what British authorities call a “Com” group, described as loosely knit online communities whose members coerce victims into self-harm and sexual abuse to gain status among peers. Investigators found he manipulated victims into sending sexual images and carving his usernames into their bodies, threatening to leak intimate material or contact their schools and parents if they refused. He also attempted to incite a child to sexually abuse a younger child on camera, and investigators recovered hundreds of indecent images of children from his devices.\u003c/p\u003e\n\n\u003cp\u003eEight of the victims were in the United Kingdom, and the NCA worked with law enforcement partners in the U.S., Canada, Australia, Norway and New Zealand to identify and safeguard victims. Swaddle pleaded guilty at Leeds Crown Court to multiple child sexual abuse offenses and blackmail, and he will be subject to a Sexual Harm Prevention Order for 10 years and must sign the Sex Offenders Register. Authorities said Com groups can have high and long-lasting impacts on victims, even though the number of people involved is relatively small.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Justin Swaddle, a 20-year-old man from Leeds, was sentenced to two years in prison after pleading guilty to multiple child sexual abuse offenses and blackmail.","The National Crime Agency said Swaddle targeted 117 female victims aged 13 to 17 worldwide while he was 17 and operated under aliases including “Epstein” and “Moscow.”","Investigators found that Swaddle coerced victims into sending sexual images and carving his usernames into their bodies by threatening to leak intimate material or contact their schools and parents.","Swaddle was part of a “Com” group, which British authorities describe as loosely knit online communities whose members coerce victims into self-harm and sexual abuse to gain status among peers.","The NCA worked with law enforcement partners in the U.S., Canada, Australia, Norway and New Zealand to identify and safeguard victims."],"insights":["Authorities said Com offenders are often motivated by status and notoriety from sharing shocking content, rather than by money or sexual gratification.","The NCA noted that offenders and victims are usually in the same online groups, which makes these communities a direct source of victimization rather than only a place where abuse material is exchanged.","Although the number of people involved in Com groups is described as relatively small, the NCA said their impact on victims is high and long-lasting.","The article links Com groups to a broader range of harms beyond child exploitation, including swatting, SIM swapping, cryptocurrency thefts and ransomware attacks."],"referencedReports":[],"body":"\u003cp\u003eA 20-year-old man from Leeds, Justin Swaddle, was sentenced Monday to two years in prison for coercing more than 100 girls worldwide into sexual and self-harm activity. The National Crime Agency said he targeted 117 female victims aged 13 to 17 while using platforms including Snapchat, Telegram and Discord. He was 17 at the time of the offenses and operated under aliases including “Epstein” and “Moscow.”\u003c/p\u003e\n\n\u003cp\u003eSwaddle was part of what British authorities call a “Com” group, described as loosely knit online communities whose members coerce victims into self-harm and sexual abuse to gain status among peers. Investigators found he manipulated victims into sending sexual images and carving his usernames into their bodies, threatening to leak intimate material or contact their schools and parents if they refused. He also attempted to incite a child to sexually abuse a younger child on camera, and investigators recovered hundreds of indecent images of children from his devices.\u003c/p\u003e\n\n\u003cp\u003eEight of the victims were in the United Kingdom, and the NCA worked with law enforcement partners in the U.S., Canada, Australia, Norway and New Zealand to identify and safeguard victims. Swaddle pleaded guilty at Leeds Crown Court to multiple child sexual abuse offenses and blackmail, and he will be subject to a Sexual Harm Prevention Order for 10 years and must sign the Sex Offenders Register. Authorities said Com groups can have high and long-lasting impacts on victims, even though the number of people involved is relatively small.\u003c/p\u003e\n"},{"n":15,"title":"AI amplifies dangling DNS takeover risks, research shows","source":"scworld.com","sourceColorIdx":3,"link":"https://www.scworld.com/brief/ai-amplifies-dangling-dns-takeover-risks-research-shows#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=ai-amplifies-dangling-dns-takeover-risks-research-shows","time":"12:34","priority":"MAY READ","score":60,"tldr":"Research indicates that AI can make it easier for attackers to find and exploit dangling DNS records, increasing the risk of domain or subdomain takeovers. Organizations should prioritize cleaning up unused DNS entries and monitoring for exposed cloud or service references.","briefOverview":"\u003cp\u003eThe article is titled “AI amplifies dangling DNS takeover risks, research shows.” It reports that research connects artificial intelligence with increased risks around dangling DNS takeovers. The core significance presented is that AI can make this takeover risk more serious.\u003c/p\u003e\n\n\u003cp\u003eThe article’s available text does not provide readable details about the researchers, affected organizations, specific examples, or technical findings beyond the title. No named vendors, products, countries, or incidents can be reliably extracted from the provided article content. The only clear technical subject is dangling DNS takeover risk and its amplification by AI.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports on research related to dangling DNS takeover risks.","The research shows that AI amplifies dangling DNS takeover risks.","The article focuses on takeover risks associated with dangling DNS."],"insights":["The article frames AI as a risk multiplier for dangling DNS takeovers rather than describing dangling DNS as a new issue.","The title indicates the finding comes from research, suggesting the article is centered on analysis of the risk rather than a specific takeover incident."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “AI amplifies dangling DNS takeover risks, research shows.” It reports that research connects artificial intelligence with increased risks around dangling DNS takeovers. The core significance presented is that AI can make this takeover risk more serious.\u003c/p\u003e\n\n\u003cp\u003eThe article’s available text does not provide readable details about the researchers, affected organizations, specific examples, or technical findings beyond the title. No named vendors, products, countries, or incidents can be reliably extracted from the provided article content. The only clear technical subject is dangling DNS takeover risk and its amplification by AI.\u003c/p\u003e\n"},{"n":14,"title":"Ransomware Now Shows Up in Nearly Half of All Breaches: A Survival Playbook for Lean Security Teams","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/ransomware-incident-response-plan/","time":"12:44","priority":"MAY READ","score":55,"tldr":"Ransomware now accounts for nearly half of Cyble-tracked ransomware-and-breach activity, driven by RaaS growth, double extortion, and exposed remote-access infrastructure. Lean security teams should prioritize patching internet-facing systems, locking down RMM/VPN/RDP access with MFA, deploying EDR broadly, segmenting backups, and rehearsing incident response before an attack.","briefOverview":"\u003cp\u003eCyble says ransomware became a dominant force in the breach landscape in 2025, with its Global Cybersecurity Report 2025 documenting 5,967 ransomware attacks, a 50% year-over-year increase. Against 6,046 data breaches and leaks in the same period, ransomware accounted for 49.7% of the combined ransomware-and-breach total tracked by CRIL. The article says activity continued into 2026, including 702 ransomware attacks in March 2026 and 679 victims in January 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that ransomware-as-a-service has lowered the skill barrier for attackers, with CRIL identifying 57 new ransomware groups, 27 new extortion groups, and more than 350 new ransomware strains in 2025. It says double extortion, where attackers encrypt systems and threaten to leak stolen data, is now standard, with some groups adding DDoS pressure or contacting victims’ clients. Lean security teams are described as especially pressured because sectors such as manufacturing and construction can face contract penalties and supply-chain disruption within days of an outage.\u003c/p\u003e\n\n\u003cp\u003eCyble recommends that small teams prioritize patching internet-facing systems, securing remote-management tools, monitoring for BYOVD activity, enforcing MFA on remote access, segmenting networks, and applying least-privilege reviews. The article also says EDR coverage across every endpoint is important because groups such as Qilin use Linux-based binaries on Windows hosts and credential-harvesting toolkits. A ransomware incident response plan should include a pre-approved communication chain, tested offline backups, a ransom-payment decision framework, and enough log retention to reconstruct an intrusion timeline.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyble’s Global Cybersecurity Report 2025 documented 5,967 ransomware attacks, a 50% year-over-year increase, and said ransomware represented 49.7% of the combined ransomware-and-breach total tracked by CRIL.","Ransomware activity remained high into 2026, including 702 attacks in March 2026 and 679 victims in January 2026, which was 30% above the 2025 monthly average.","CRIL identified 57 new ransomware groups, 27 new extortion groups, and more than 350 new ransomware strains in 2025, largely based on the MedusaLocker, Chaos, and Makop families.","The article says double extortion, where attackers encrypt systems and leak stolen data, has become standard, with some groups adding DDoS pressure or direct outreach to victims’ clients.","The article recommends that lean security teams prioritize patching internet-facing systems, securing remote-management tools, using MFA, segmenting networks, deploying EDR broadly, testing offline backups, and preparing a ransomware incident response plan in advance."],"insights":["For lean teams, the article frames CISA KEV-listed, internet-facing systems as the highest-priority patching target because the October 2025 surge was tied to critical vulnerabilities and unpatched exposed assets.","The article argues that having backups no longer removes ransom pressure because data theft and leak threats are now part of standard ransomware operations.","Remote-management tools are singled out as a practical weak point for small teams because Qilin affiliates have abused WinSCP, AnyDesk, and ScreenConnect for lateral movement.","The article presents quarterly least-privilege access reviews, MFA on every remote access path, and network segmentation as achievable zero-trust steps that do not require a full enterprise-scale architecture overhaul.","The article emphasizes that recovery speed depends on preparation months before an incident, including validated backup integrity, restoration priorities, and rehearsed communications for customers and regulators."],"referencedReports":[],"body":"\u003cp\u003eCyble says ransomware became a dominant force in the breach landscape in 2025, with its Global Cybersecurity Report 2025 documenting 5,967 ransomware attacks, a 50% year-over-year increase. Against 6,046 data breaches and leaks in the same period, ransomware accounted for 49.7% of the combined ransomware-and-breach total tracked by CRIL. The article says activity continued into 2026, including 702 ransomware attacks in March 2026 and 679 victims in January 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that ransomware-as-a-service has lowered the skill barrier for attackers, with CRIL identifying 57 new ransomware groups, 27 new extortion groups, and more than 350 new ransomware strains in 2025. It says double extortion, where attackers encrypt systems and threaten to leak stolen data, is now standard, with some groups adding DDoS pressure or contacting victims’ clients. Lean security teams are described as especially pressured because sectors such as manufacturing and construction can face contract penalties and supply-chain disruption within days of an outage.\u003c/p\u003e\n\n\u003cp\u003eCyble recommends that small teams prioritize patching internet-facing systems, securing remote-management tools, monitoring for BYOVD activity, enforcing MFA on remote access, segmenting networks, and applying least-privilege reviews. The article also says EDR coverage across every endpoint is important because groups such as Qilin use Linux-based binaries on Windows hosts and credential-harvesting toolkits. A ransomware incident response plan should include a pre-approved communication chain, tested offline backups, a ransom-payment decision framework, and enough log retention to reconstruct an intrusion timeline.\u003c/p\u003e\n"},{"n":18,"title":"Cyberattacks on Healthcare Sector Jumped 14% in First Half of 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/cyberattacks-on-healthcare-sector-jumped-14-in-first-half-of-2026/","time":"13:31","priority":"MAY READ","score":55,"tldr":"Healthcare cyberattacks rose 14% in the first half of 2026, with hospitals facing more impersonation and social-engineering attacks. Health-ISAC’s Errol Weiss says hospital security leaders are taking the threat seriously but remain constrained by staffing, legacy medical devices, always-on operations, and third-party dependencies.","briefOverview":"\u003cp\u003eCyberattacks on the healthcare sector jumped 14% in the first half of 2026, according to the article. Hospitals are seeing more impersonation and social-engineering-driven attacks. The article features comments from Errol Weiss, chief security officer at Health-ISAC, and points readers to the full article in Medical Buyer.\u003c/p\u003e\n\n\u003cp\u003eWeiss says hospital CISOs he talks to are taking these threats seriously. He says their number one priority is having the resources to adequately protect hospital networks. Those resources include the ability to recruit and retain experienced cybersecurity talent and acquire much-needed technology.\u003c/p\u003e\n\n\u003cp\u003eThe article says hospitals continue to face the challenge of finding and patching legacy devices. It also identifies medical device complexity, always-on clinical operations, and heavy third-party dependence as structural realities affecting hospitals. According to the article, these conditions mean attackers still see plenty of opportunity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyberattacks on the healthcare sector jumped 14% in the first half of 2026.","Hospitals are seeing more impersonation and social-engineering-driven attacks, according to the article.","Errol Weiss, chief security officer at Health-ISAC, said hospital CISOs he talks to are taking these threats seriously.","Weiss said hospital CISOs’ top priority is having the resources to adequately protect hospital networks, including experienced cybersecurity talent and needed technology.","The article says medical device complexity, always-on clinical operations, and heavy third-party dependence mean attackers still see many opportunities."],"insights":["Hospital cyber risk is being driven by operational constraints as much as by attacker activity, because medical device complexity, always-on clinical care, and third-party dependence all limit how easily hospitals can reduce exposure.","The article highlights impersonation and social engineering as growing hospital threats, suggesting attackers are focusing on tricking people rather than only breaking into technology directly.","Legacy medical devices remain an especially actionable problem area because the article identifies finding and patching them as an ongoing challenge for hospitals.","Even when hospital security leaders take the threat seriously, the article says their ability to respond depends heavily on recruiting and retaining experienced cybersecurity talent and acquiring needed technology."],"referencedReports":[],"body":"\u003cp\u003eCyberattacks on the healthcare sector jumped 14% in the first half of 2026, according to the article. Hospitals are seeing more impersonation and social-engineering-driven attacks. The article features comments from Errol Weiss, chief security officer at Health-ISAC, and points readers to the full article in Medical Buyer.\u003c/p\u003e\n\n\u003cp\u003eWeiss says hospital CISOs he talks to are taking these threats seriously. He says their number one priority is having the resources to adequately protect hospital networks. Those resources include the ability to recruit and retain experienced cybersecurity talent and acquire much-needed technology.\u003c/p\u003e\n\n\u003cp\u003eThe article says hospitals continue to face the challenge of finding and patching legacy devices. It also identifies medical device complexity, always-on clinical operations, and heavy third-party dependence as structural realities affecting hospitals. According to the article, these conditions mean attackers still see plenty of opportunity.\u003c/p\u003e\n"},{"n":11,"title":"IT threat evolution in Q2 2026. Non-mobile statistics","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/malware-report-q2-2026-pc-iot-statistics/120960/","time":"10:00","priority":"MAY READ","score":40,"tldr":"Kaspersky’s Q2 2026 telemetry shows a broad rise in non-mobile threats, with nearly 400 million web attacks blocked, 16.9 million local malicious objects detected, and ransomware, miners, macOS threats, and IoT botnets remaining active. Qilin was the most prolific ransomware group by leaked-victim listings, while miner variants nearly doubled from the previous quarter.","briefOverview":"\u003cp\u003eKaspersky’s Q2 2026 non-mobile threat report summarizes detections from users who consented to sharing statistical data. During the quarter, Kaspersky products blocked 399,312,961 attacks launched from internet resources worldwide, and Web Anti-Virus was triggered by 52,850,592 unique URLs. File Anti-Virus detected 16,986,351 malicious and potentially unwanted objects, while malware local threats were detected at least once on 10.93% of users’ computers worldwide.\u003c/p\u003e\n\n\u003cp\u003eRansomware remained a major focus of the quarter, with Kaspersky detecting four new ransomware families and 2,538 new ransomware modifications. Its products protected 71,860 unique users from ransomware, with activity peaking in April at 31,206 targeted users. Qilin led the reviewed ransomware data leak site listings with 14.57% of victims, followed by Akira at 7.80% and DragonForce at 6.88%.\u003c/p\u003e\n\n\u003cp\u003eThe report also highlights several notable developments across the threat landscape, including Microsoft’s disruption of a malware-signing service used by ransomware operators and CISA’s confirmation that CVE-2026-33825 was being exploited in ransomware attacks. Check Point linked exploitation of CVE-2026-50751 to Qilin, while researchers assessed that PayoutsKing used QEMU to deploy hidden Alpine Linux virtual machines on compromised hosts. Beyond ransomware, Kaspersky detected 6,067 new miner variants and miner attacks against 213,003 unique users, while macOS and IoT sections described threats including GlassWorm, Coruna, FlutterShell, Mirai variants, and increased Prometei activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In Q2 2026, Kaspersky products blocked 399,312,961 attacks launched from internet resources worldwide, and Web Anti-Virus was triggered by 52,850,592 unique URLs.","Kaspersky solutions detected four new ransomware families and 2,538 new ransomware modifications in Q2 2026, while protecting 71,860 unique users from ransomware attacks.","Qilin accounted for 14.57% of ransomware victims listed on the data leak sites reviewed during the reporting period, followed by Akira at 7.80% and DragonForce at 6.88%.","Kaspersky detected 6,067 new miner variants in Q2 2026, almost twice the number from the previous reporting period, and record
