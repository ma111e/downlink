ed miner attacks against 213,003 unique users worldwide.","In Q2 2026, Kaspersky File Anti-Virus detected 16,986,351 malicious and potentially unwanted objects, and malware local threats were detected at least once on 10.93% of users’ computers worldwide."],"insights":["Ransomware operators are abusing trust mechanisms as well as software flaws, as Microsoft disrupted a malware-signing service that used Microsoft Artifact Signing certificates and was linked to campaigns involving Rhysida, Akira, INC, Qilin, and BlackByte.","Unpatched systems remained exposed to ransomware activity even after fixes were released, as CISA reported active exploitation of the Microsoft Defender privilege escalation flaw CVE-2026-33825 after Microsoft issued a patch on April 14.","Qilin was prominent across multiple parts of the quarter’s ransomware landscape, ranking first by data leak site victim listings and also being linked by Check Point to exploitation of the Check Point Remote Access VPN zero-day CVE-2026-50751.","Ransomware actors continue to use uncommon evasion methods, with researchers assessing that PayoutsKing deploys hidden Alpine Linux virtual machines through QEMU to reduce security visibility on compromised hosts.","Software supply chain and platform trust issues affected macOS-related threats, with GlassWorm spreading through malicious Open VSX Registry IDE extensions, art-template being compromised to inject Coruna, and FlutterShell samples passing Apple notarization."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/04/22/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites CISA’s alert confirming that CVE-2026-33825 was being actively exploited in ransomware attacks.","category":"advisory","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2026-33825","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-33825","publisher":"CISA","context":"The article references CISA’s KEV catalog update noting ongoing ransomware exploitation of CVE-2026-33825.","category":"advisory","primary":false},{"title":"QEMU abused to evade detection and enable ransomware delivery","url":"https://www.sophos.com/en-us/blog/qemu-abused-to-evade-detection-and-enable-ransomware-delivery","publisher":"Sophos","context":"The article cites Sophos researchers’ assessment that PayoutsKing uses QEMU to deploy hidden Alpine Linux virtual machines on compromised hosts.","category":"research","primary":false},{"title":"GlassWorm Zig dropper infects every IDE on your machine","url":"https://www.aikido.dev/blog/glassworm-zig-dropper-infects-every-ide-on-your-machine","publisher":"Aikido","context":"The article references Aikido researchers’ report on GlassWorm being distributed through malicious IDE extensions on the Open VSX Registry.","category":"research","primary":false},{"title":"Coruna respawned: compromised art-template npm package","url":"https://socket.dev/blog/coruna-respawned-compromised-art-template-npm-package","publisher":"Socket","context":"The article cites Socket researchers’ finding that the art-template npm package was compromised to inject the Coruna exploit kit into web applications.","category":"research","primary":false},{"title":"FlutterBridge: New FlutterShell backdoor","url":"https://unit42.paloaltonetworks.com/flutterbridge-new-fluttershell-backdoor/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s discovery of FlutterShell, a new backdoor family targeting macOS devices.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky’s Q2 2026 non-mobile threat report summarizes detections from users who consented to sharing statistical data. During the quarter, Kaspersky products blocked 399,312,961 attacks launched from internet resources worldwide, and Web Anti-Virus was triggered by 52,850,592 unique URLs. File Anti-Virus detected 16,986,351 malicious and potentially unwanted objects, while malware local threats were detected at least once on 10.93% of users’ computers worldwide.\u003c/p\u003e\n\n\u003cp\u003eRansomware remained a major focus of the quarter, with Kaspersky detecting four new ransomware families and 2,538 new ransomware modifications. Its products protected 71,860 unique users from ransomware, with activity peaking in April at 31,206 targeted users. Qilin led the reviewed ransomware data leak site listings with 14.57% of victims, followed by Akira at 7.80% and DragonForce at 6.88%.\u003c/p\u003e\n\n\u003cp\u003eThe report also highlights several notable developments across the threat landscape, including Microsoft’s disruption of a malware-signing service used by ransomware operators and CISA’s confirmation that CVE-2026-33825 was being exploited in ransomware attacks. Check Point linked exploitation of CVE-2026-50751 to Qilin, while researchers assessed that PayoutsKing used QEMU to deploy hidden Alpine Linux virtual machines on compromised hosts. Beyond ransomware, Kaspersky detected 6,067 new miner variants and miner attacks against 213,003 unique users, while macOS and IoT sections described threats including GlassWorm, Coruna, FlutterShell, Mirai variants, and increased Prometei activity.\u003c/p\u003e\n"},{"n":13,"title":"10th August – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/10th-august-threat-intelligence-report/","time":"13:53","priority":"MAY READ","score":40,"tldr":"This week’s threat intelligence highlights major breaches and theft campaigns, critical AI and software vulnerabilities, and active supply-chain attacks affecting npm, cloud tooling, routers, WordPress, Cisco, and TP-Link products. Organizations should prioritize patching exposed systems, securing developer credentials, and watching for identity-fraud and social-engineering campaigns.","briefOverview":"\u003cp\u003eCheck Point Research’s 10th August Threat Intelligence Report summarizes major cyber incidents, AI-related security issues, product vulnerabilities, and active threat campaigns. Reported attacks include a cyberattack on North Carolina Ports that forced some operations onto manual processes, a Ryde breach affecting 4.5 million customer accounts, and a Coinkite Coldcard theft campaign involving at least 1,367 bitcoin worth about $88.6 million. Beacon also disclosed a breach after attackers compromised an access key, potentially exposing database information, donation records, and stored attachments for around 1,500 nonprofit customers.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights several vulnerabilities and patches affecting widely used technologies. Cloudflare Code Mode inherited five vulnerabilities from the workerd runtime that could enable sandbox escape and cross-tenant data exposure, while Google Gemini CLI and Anthropic Claude Code flaws could expose automation environments to code execution and API key theft. Cisco, WordPress, TP-Link, and Zbtlink router products are also covered, including critical Catalyst SD-WAN and IOS XE fixes, the WordPress XSS2Shell flaw, Omada provisioning issues, and a vendor-installed Zbtlink remote-management backdoor.\u003c/p\u003e\n\n\u003cp\u003eThe threat intelligence section describes multiple campaigns targeting software ecosystems, financial firms, and macOS users. The Shai-Hulud CHAINDROP campaign backdoored more than 400 npm packages after a keyv maintainer was compromised, while another campaign uploaded nearly 800 malicious npm packages delivering cross-platform RAT and infostealer malware. Researchers also reported UNC6671 activity against large US financial firms using spoofed websites to capture passwords and multi-factor authentication codes, and a macOS ClickFix campaign using more than 250 look-alike domains to distribute MacSync and Atomic Stealer.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["North Carolina Ports suffered a cyberattack that forced some operations onto manual processes, causing delays while affected services were restored.","Ryde disclosed a data breach affecting all 4.5 million customer accounts across Norway, Sweden, Finland, and Germany, with attackers copying phone numbers, email addresses, birth dates, partial payment card numbers, and payment histories.","Coinkite disclosed a theft campaign exploiting a Coldcard firmware vulnerability, with at least 1,367 bitcoin worth about $88.6 million stolen from thousands of addresses.","Researchers disclosed vulnerabilities in Google Gemini CLI and Anthropic Claude Code that could expose automation environments to code execution and API key theft, and both vendors released patched versions.","Researchers identified the Shai-Hulud CHAINDROP supply-chain campaign, which backdoored more than 400 npm packages after attackers compromised the maintainer of the widely used keyv library."],"insights":["Several incidents show that trusted software supply chains can rapidly amplify compromise, including the Shai-Hulud CHAINDROP campaign affecting more than 400 npm packages and another campaign uploading nearly 800 malicious npm packages.","AI-related tooling created direct security exposure in multiple places, with flaws in Cloudflare Code Mode, Google Gemini CLI, and Anthropic Claude Code linked to risks such as sandbox escape, cross-tenant data exposure, code execution, and API key theft.","Remote identity checks are a growing target because AI-enabled fraud kits such as ProKYC can generate documents, selfie-with-ID images, spoofed location data, and synthetic video to bypass onboarding checks.","Some affected organizations avoided the most sensitive financial exposure even when data was accessed, as Ryde said full card numbers and ride histories were unaffected and Beacon said payment and bank details were not affected.","The Zbtlink router finding is especially actionable because researchers identified a vendor-installed remote-management component that contacted hardcoded servers and accepted unauthenticated commands with root privileges."],"referencedReports":[{"title":"Cisco security advisory for Catalyst SD-WAN and IOS XE software","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-L4XfJg8S","publisher":"Cisco","context":"The article references Cisco's release of fixes for multiple critical vulnerabilities in Catalyst SD-WAN and IOS XE software.","category":"advisory","primary":false},{"title":"Zbtlink EndlessDoors","url":"https://www.vulncheck.com/blog/zbt-endlessdoors","publisher":"VulnCheck","context":"The article cites VulnCheck research identifying a vendor-installed backdoor across at least 20 Zbtlink router models.","category":"research","primary":false},{"title":"Shai-Hulud CHAINDROP npm supply-chain campaign","url":"https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain","publisher":"Elastic Security Labs","context":"The article cites Elastic research on the Shai-Hulud CHAINDROP campaign that backdoored more than 400 npm packages.","category":"research","primary":false},{"title":"UNC6671 targets financial services and enterprise cloud environments","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc6671-targets-financial-services-and-enterprise-cloud-environments","publisher":"Google Cloud","context":"The article references Google Cloud research on UNC6671 targeting large US financial firms through impersonation and spoofed websites.","category":"research","primary":false},{"title":"macOS ClickFix campaign learned to hide","url":"https://www.microsoft.com/en-us/security/blog/2026/08/05/macos-clickfix-campaign-learned-hide/","publisher":"Microsoft","context":"The article cites Microsoft research on a macOS ClickFix campaign using look-alike domains to distribute MacSync and Atomic Stealer malware.","category":"research","primary":false},{"title":"Russian AI slopsquatting npm campaign","url":"https://opensourcemalware.com/blog/russian-ai-slopsquatting-npm-campaign","publisher":"Open Source Malware","context":"The article references research documenting nearly 800 malicious npm packages delivering cross-platform RAT and infostealer malware.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research’s 10th August Threat Intelligence Report summarizes major cyber incidents, AI-related security issues, product vulnerabilities, and active threat campaigns. Reported attacks include a cyberattack on North Carolina Ports that forced some operations onto manual processes, a Ryde breach affecting 4.5 million customer accounts, and a Coinkite Coldcard theft campaign involving at least 1,367 bitcoin worth about $88.6 million. Beacon also disclosed a breach after attackers compromised an access key, potentially exposing database information, donation records, and stored attachments for around 1,500 nonprofit customers.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights several vulnerabilities and patches affecting widely used technologies. Cloudflare Code Mode inherited five vulnerabilities from the workerd runtime that could enable sandbox escape and cross-tenant data exposure, while Google Gemini CLI and Anthropic Claude Code flaws could expose automation environments to code execution and API key theft. Cisco, WordPress, TP-Link, and Zbtlink router products are also covered, including critical Catalyst SD-WAN and IOS XE fixes, the WordPress XSS2Shell flaw, Omada provisioning issues, and a vendor-installed Zbtlink remote-management backdoor.\u003c/p\u003e\n\n\u003cp\u003eThe threat intelligence section describes multiple campaigns targeting software ecosystems, financial firms, and macOS users. The Shai-Hulud CHAINDROP campaign backdoored more than 400 npm packages after a keyv maintainer was compromised, while another campaign uploaded nearly 800 malicious npm packages delivering cross-platform RAT and infostealer malware. Researchers also reported UNC6671 activity against large US financial firms using spoofed websites to capture passwords and multi-factor authentication codes, and a macOS ClickFix campaign using more than 250 look-alike domains to distribute MacSync and Atomic Stealer.\u003c/p\u003e\n"},{"n":17,"title":"Risky Bulletin: Non-profit offers $22,000 bounty for INC ransomware group","source":"news.risky.biz","sourceColorIdx":2,"link":"https://news.risky.biz/risky-bulletin-non-profit-offers-22-000-bounty-for-inc-ransomware-group/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=risky-bulletin-non-profit-offers-22000-bounty-for-inc-ransomware-group","time":"12:27","priority":"MAY READ","score":40,"tldr":"Crime Stoppers International is offering a $22,000 bounty for information that helps identify, arrest, or disrupt members of the INC ransomware group, citing its repeated attacks on healthcare and critical infrastructure. The group remains one of the most active ransomware operations since emerging in 2023.","briefOverview":"\u003cp\u003eCrime Stoppers International is offering a $22,000 bounty for information on members of the INC ransomware group. To qualify for a payout, the information must lead to the identification, arrest, or disruption of the gang’s operations. The non-profit cited INC’s repeated attacks on healthcare and critical infrastructure organizations as the reason for the bounty.\u003c/p\u003e\n\n\u003cp\u003eCrime Stoppers International said INC “shows no restraint against hospitals, healthcare providers, or critical services” and described the group’s activity as more than a victimless financial crime. The organization is seeking details on INC members, their locations, movements, contacts, crypto-wallets, money trail, server infrastructure, internal structure, and communications. Recent reports from NCC Group and Point Wild ranked INC as the sixth most active ransomware group in June 2026 and Q2 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that INC has repeatedly ranked among the top 10 most active ransomware groups since emerging in 2023. Last year, security firm Cyber Centaurs infiltrated an INC backup server, retrieved stolen unencrypted files, and helped a dozen victims recover data without paying ransoms. The broader newsletter also summarizes other security news, including a UK Department for Education breach, Russia charging Telegram founder Pavel Durov, and an FCC ban on foreign-made robots and power inverters.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Crime Stoppers International is offering a $22,000 bounty for information that leads to the identification, arrest, or disruption of the INC ransomware group’s operations.","Crime Stoppers International said the bounty was prompted by INC ransomware’s repeated attacks on healthcare and critical infrastructure organizations, including hospitals and other critical services.","The organization is seeking information on INC members, their locations, movements, contacts, crypto-wallets, money trail, server infrastructure, internal structure, and communications.","NCC Group and Point Wild reported that INC was the sixth most active ransomware group in June 2026 and the sixth most active ransomware group in Q2 2026.","The article also reports that hackers breached the UK Department for Education, Russia charged Telegram founder Pavel Durov, and the FCC banned foreign-made robots and power inverters on national security grounds."],"insights":["Crime Stoppers International is not only asking for identities and locations of INC members, but also for operational details such as crypto-wallets, money trails, server infrastructure, internal structure, and communications, showing the bounty is aimed at disrupting the group’s entire support system.","INC remains a high-priority target because it has repeatedly ranked among the top 10 most active ransomware groups since emerging in 2023, and was ranked sixth in both June 2026 and Q2 2026 by separate reporting sources.","A prior infiltration of an INC backup server by Cyber Centaurs reportedly let a dozen victims recover stolen unencrypted data without paying ransoms, showing that direct disruption of ransomware infrastructure can reduce victim harm.","The article highlights that INC’s targeting of hospitals, healthcare providers, and critical services is being framed by Crime Stoppers International as a public-safety threat rather than merely a financial crime."],"referencedReports":[{"title":"Monthly Threat Pulse Review of June 2026","url":"https://www.nccgroup.com/newsroom/ncc-group-monthly-threat-pulse-review-of-june-2026/","publisher":"NCC Group","context":"The article cites this report for INC being the sixth most active ransomware group in June 2026.","category":"research","primary":false},{"title":"Point Wild Q2 2026 Malware Trend Analysis Report","url":"https://www.pointwild.com/threat-intelligence/point-wild-q2-2026-malware-trend-analysis-report/","publisher":"Point Wild","context":"The article cites this report for INC being the sixth most active ransomware group in Q2 2026.","category":"research","primary":false},{"title":"Agent Intrusion Technical Timeline","url":"https://huggingface.co/blog/agent-intrusion-technical-timeline","publisher":"Hugging Face","context":"The article says Hugging Face published a step-by-step technical timeline of the OpenAI-Hugging Face hack.","category":"research","primary":false},{"title":"OpenAI Hugging Face Model Evaluation Security Incident","url":"https://openai.com/index/hugging-face-model-evaluation-security-incident/","publisher":"OpenAI","context":"The article says OpenAI published more details about the OpenAI-Hugging Face hack, including that a rogue model used credentials to access other services.","category":"research","primary":false},{"title":"Shuttergap: Millions of Cloud Resources Exposed","url":"https://www.aryon.security/resource/shuttergap-millions-cloud-resources-exposed","publisher":"Aryon Security","context":"The article describes this as an interesting report on how quickly exposed cloud data is found and stolen by threat actors.","category":"research","primary":false},{"title":"Danglegeddon","url":"https://www.silentpush.com/blog/danglegeddon/","publisher":"SilentPush","context":"The article says SilentPush analyzed 12,500 domains and found 16,000 dangling subdomains, with more than 4,000 susceptible to automated takeover.","category":"research","primary":false},{"title":"Autonomous AI Cyber Attack Campaign","url":"https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/","publisher":"Palo Alto Networks Unit 42","context":"The article says Palo Alto published more details about an AI-assisted hacking campaign targeting Thailand’s Ministry of Finance.","category":"research","primary":false},{"title":"SparkKitty Malware: An Emerging Threat to Mobile Users","url":"https://cyberint.com/blog/dark-web/sparkkitty-malware-an-emerging-threat-to-mobile-users/","publisher":"Check Point CyberInt","context":"The article says Check Point CyberInt examined SparkKitty, an Android and iOS infostealer that uses OCR to extract crypto-wallet seed phrases from images.","category":"research","primary":false},{"title":"Point Wild Exclusive: Dissecting Vanta Stealer, a Python-Based Cross-Platform Information Theft Malware","url":"https://www.pointwild.com/threat-intelligence/point-wild-exclusive-dissecting-vanta-stealer-a-python-based-cross-platform-information-theft-malware/","publisher":"Point Wild","context":"The article references this technical analysis of Vanta Stealer and its use of PyArmor and PyInstaller.","category":"research","primary":false},{"title":"CastleLoader: New Campaigns, New Tooling, and the NeedleStealer Connection","url":"https://arcticwolf.com/resources/blog/castleloader-new-campaigns-new-tooling-and-the-needlestealer-connection/","publisher":"Arctic Wolf","context":"The article says Arctic Wolf reported that NeedleStealer is being deployed on systems previously infected with CastleLoader.","category":"research","primary":false},{"title":"GenieLocker Ransomware for Windows, Linux, and ESXi","url":"https://securelist.com/genielocker-ransomware-for-windows-linux-and-esxi/120843/","publisher":"Kaspersky","context":"The article says Kaspersky analyzed GenieLocker, a ransomware strain used by Toy Ghouls in attacks targeting Russia.","category":"research","primary":false},{"title":"LogoKit Phishing Service: Real-Time Deception Platform","url":"https://blog.barracuda.com/2026/07/29/logokit-phishing-service-real-time-deception-platform","publisher":"Barracuda","context":"The article says Barracuda reported on LogoKit, a phishing service used to create customized phishing pages for corporate targets.","category":"research","primary":false},{"title":"ARToken: The Device Code Phishing Platform Built for Full Microsoft 365 Takeover","url":"https://abnormal.ai/blog/artoken-the-device-code-phishing-platform-built-for-full-microsoft-365-takeover","publisher":"Abnormal AI","context":"The article says Abnormal AI examined ARToken, a phishing service focused on Microsoft 365 accounts.","category":"research","primary":false},{"title":"Amazon Identifies North Korean Hacker Group Behind Open Source Supply Chain Attacks","url":"https://aws.amazon.com/blogs/security/amazon-identifies-north-korean-hacker-group-behind-open-source-supply-chain-attacks/","publisher":"AWS","context":"The article says AWS linked several npm supply chain attacks to the North Korean group BlueNoroff.","category":"research","primary":false},{"title":"PolinRider Caused Dozens of npm and Go Compromises","url":"https://opensourcemalware.com/blog/polinrider-caused-dozens-of-npm-and-go-compromises","publisher":"OpenSourceMalware","context":"The article says researchers linked recent malicious npm and Go packages to the North Korean operation PolinRider.","category":"research","primary":false},{"title":"ClickFix, EtherHiding, DPRK Wallet","url":"https://www.allsecure.io/blog/clickfix-etherhiding-dprk-wallet/","publisher":"AllSecure","context":"The article says AllSecure reported that North Korean group UNC5342 is using fake browser updates, ClickFix, and EtherHiding to target macOS users with a Node.js RAT.","category":"research","primary":false},{"title":"Joint Cybersecurity Advisory: Watering Hole Malware Analysis","url":"https://www.enki.co.kr/en/media-center/blog/joint-cybersecurity-advisory-watering-hole-malware-analysis","publisher":"ENKI","context":"The article references this advisory as part of reporting on Operation Double Barrel, a North Korean watering hole campaign that deployed backdoors and ransomware.","category":"advisory","primary":false},{"title":"Cleaning Out Inboxes: TA488 Comes to Outlook with Another Half-Click Exploit","url":"https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit","publisher":"Proofpoint","context":"The article says Proofpoint linked Russian espionage group Laundry Bear to a Microsoft Exchange zero-day and the OWAReaper tool.","category":"research","primary":false},{"title":"Cisco Secure Firewall Management Center Static Credential Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh","publisher":"Cisco","context":"The article says Cisco released a security update for an actively exploited zero-day involving hardcoded credentials in Secure Firewall Management Center.","category":"advisory","primary":false},{"title":"ICSA-26-209-05","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-26-209-05","publisher":"CISA","context":"The article cites this CISA advisory for a MikroTik RouterOS authentication API bug that can allow brute-force attacks.","category":"advisory","primary":false},{"title":"CosmosEscape: Taking Over Every Database in Azure Cosmos DB","url":"https://www.wiz.io/blog/cosmosescape-taking-over-every-database-in-azure-cosmos-db","publisher":"Wiz","context":"The article says Wiz reported on CosmosEscape, a vulnerability that could have allowed access to every Cosmos DB database on Azure.","category":"research","primary":false},{"title":"2026 Minimum Elements for a Software Bill of Materials","url":"https://www.cisa.gov/resources-tools/resources/2026-minimum-elements-software-bill-materials-sbom","publisher":"CISA","context":"The article says cybersecurity agencies from several countries released joint guidance on basic elements for an SBOM program.","category":"guide","primary":false}],"body":"\u003cp\u003eCrime Stoppers International is offering a $22,000 bounty for information on members of the INC ransomware group. To qualify for a payout, the information must lead to the identification, arrest, or disruption of the gang’s operations. The non-profit cited INC’s repeated attacks on healthcare and critical infrastructure organizations as the reason for the bounty.\u003c/p\u003e\n\n\u003cp\u003eCrime Stoppers International said INC “shows no restraint against hospitals, healthcare providers, or critical services” and described the group’s activity as more than a victimless financial crime. The organization is seeking details on INC members, their locations, movements, contacts, crypto-wallets, money trail, server infrastructure, internal structure, and communications. Recent reports from NCC Group and Point Wild ranked INC as the sixth most active ransomware group in June 2026 and Q2 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that INC has repeatedly ranked among the top 10 most active ransomware groups since emerging in 2023. Last year, security firm Cyber Centaurs infiltrated an INC backup server, retrieved stolen unencrypted files, and helped a dozen victims recover data without paying ransoms. The broader newsletter also summarizes other security news, including a UK Department for Education breach, Russia charging Telegram founder Pavel Durov, and an FCC ban on foreign-made robots and power inverters.\u003c/p\u003e\n"},{"n":9,"title":"Shipping 10–50× More Code? Watch This Webinar on Securing AI-Speed Development","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/shipping-1050-more-code-watch-this.html","time":"11:52","priority":"MAY READ","score":35,"tldr":"Chainguard’s webinar argues that AI-driven development can multiply code output faster than security teams can review and remediate risk. The key takeaway is that organizations need secure-by-default guardrails and governance that scale with AI-speed software delivery, rather than relying on traditional CVE backlog management.","briefOverview":"\u003cp\u003eThe article announces a webinar with Chainguard experts titled “The True Cost of Building at Machine Speed.” It focuses on how AI is helping development teams produce far more code much faster, with software output described as increasing by 10 to 50 times. The article says this creates pressure for security teams that still need to review vulnerabilities, manage dependencies, prioritize fixes, and control risk at human speed.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the challenge is no longer only finding vulnerabilities, but preventing security from becoming a bottleneck or losing control of what gets shipped. It says traditional application security processes can break down when teams must manage many more components, dependencies, findings, and fixes. More scanning alone is presented as insufficient because it may simply create a larger backlog.\u003c/p\u003e\n\n\u003cp\u003eThe webinar is described as examining how AI expands the software attack surface, why existing vulnerability-management processes may struggle at machine scale, and where organizations need stronger guardrails before code reaches production. It also covers governance questions, including who owns the risk, how much exposure an organization accepts, and how those choices are explained to executives and boards. The article says the goal is not to slow developers down, but to make security work at the same speed as modern AI-driven development.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI is helping development teams produce far more code much faster, with software output potentially increasing by 10 to 50 times.","The article says traditional application security processes can come under pressure when security teams must manage many more components, dependencies, findings, and fixes.","The webinar with Chainguard experts focuses on how security teams can keep AI-driven development fast without letting risk scale with it.","The article argues that more scanning alone may only create a larger vulnerability backlog rather than solving the problem.","The webinar also addresses governance questions such as who owns AI-assisted development risk, how much exposure an organization accepts, and how to explain those choices to executives and boards."],"insights":["The article frames the main security challenge of AI-assisted development as operational scale, not simply whether AI-generated code contains flaws.","It argues that adding more vulnerability scanning can make the problem worse if organizations do not also change how they prioritize and remediate the resulting backlog.","The article identifies secure-by-default development and pre-production guardrails as ways to keep development fast without forcing security teams to review everything manually.","It treats AI-assisted development as a governance issue for executives and boards, not only an engineering or security-team concern."],"referencedReports":[],"body":"\u003cp\u003eThe article announces a webinar with Chainguard experts titled “The True Cost of Building at Machine Speed.” It focuses on how AI is helping development teams produce far more code much faster, with software output described as increasing by 10 to 50 times. The article says this creates pressure for security teams that still need to review vulnerabilities, manage dependencies, prioritize fixes, and control risk at human speed.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the challenge is no longer only finding vulnerabilities, but preventing security from becoming a bottleneck or losing control of what gets shipped. It says traditional application security processes can break down when teams must manage many more components, dependencies, findings, and fixes. More scanning alone is presented as insufficient because it may simply create a larger backlog.\u003c/p\u003e\n\n\u003cp\u003eThe webinar is described as examining how AI expands the software attack surface, why existing vulnerability-management processes may struggle at machine scale, and where organizations need stronger guardrails before code reaches production. It also covers governance questions, including who owns the risk, how much exposure an organization accepts, and how those choices are explained to executives and boards. The article says the goal is not to slow developers down, but to make security work at the same speed as modern AI-driven development.\u003c/p\u003e\n"}]</script>
