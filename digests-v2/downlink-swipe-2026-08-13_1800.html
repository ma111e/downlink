<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers breach govt webmail while running parallel crypto fraud","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-breach-govt-webmail-while-running-parallel-crypto-fraud/","time":"18:15","priority":"SHOULD READ","score":88,"tldr":"The China-linked Jewelbug group compromised shared government webmail infrastructure in the Middle East to steal cookies, credentials, and emails while also running a large-scale crypto fraud operation from the same control panel. Symantec says the group’s tooling and infrastructure show parallel espionage and financially motivated activity, including fake crypto exchange pages, malicious browser extensions, and custom implants.","briefOverview":"\u003cp\u003eThe China-based Jewelbug hacker group has been conducting espionage operations against governments and militaries while also running cryptocurrency fraud. In a recent campaign targeting a country in the Middle East, the group compromised webmail accounts belonging to 15 government tenants. Symantec found that the espionage campaign and cryptocurrency fraud were conducted from the same control panel.\u003c/p\u003e\n\n\u003cp\u003eJewelbug gained write access to a shared webmail installation and inserted a malicious script into a common template. The script ran on login pages and mailbox views, opened a WebSocket connection to the attackers’ command-and-control server, stole webmail cookies, and checked whether users belonged to targeted government domains. Selected targets received a fake Adobe Flash update prompt that installed the Antino backdoor and browser tooling.\u003c/p\u003e\n\n\u003cp\u003eSymantec said Jewelbug’s victim database contained more than one million implant check-in rows, more than 580,000 stolen browser cookies, several thousand captured credentials, and more than 2,300 exfiltrated email bodies. The group also used tools including XG-Web, a malicious PDF Viewer browser extension, and a Rust-based implant called ClientKing. Its cryptocurrency fraud operation used AI-generated articles, fake crypto exchange sites, click-fraud bots, and lookalike domains impersonating OKX and Binance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The China-based Jewelbug hacker group compromised webmail accounts belonging to 15 government tenants in a campaign targeting a country in the Middle East.","Symantec found that Jewelbug inserted a malicious script into a shared webmail template, allowing it to run on login pages and mailbox views across the affected tenants.","The malicious script connected to the attackers’ command-and-control server, stole webmail cookies, retrieved users’ email addresses, and delivered a fake Adobe Flash update prompt to selected government targets.","Symantec said Jewelbug’s victim database contained more than one million implant check-in rows, more than 580,000 stolen browser cookies, several thousand captured credentials, and more than 2,300 exfiltrated email bodies.","Symantec reported that Jewelbug also ran an industrial-scale cryptocurrency fraud operation using AI-generated articles, fake crypto exchange sites, click-fraud bots, and hundreds of lookalike domains impersonating OKX and Binance."],"insights":["Jewelbug’s espionage and cryptocurrency fraud were operated from the same control panel, linking government-targeting activity and financially motivated scams to shared infrastructure.","Compromising a shared web-hosting platform let Jewelbug affect multiple government webmail tenants by adding a single script to a common template.","The webmail script filtered users by checking whether their email addresses belonged to targeted government domains before showing selected victims a fake Adobe Flash update prompt.","Jewelbug used public Google Docs to host obfuscated payloads, allowing its malicious traffic to blend in with legitimate Google services.","Symantec attributed Jewelbug’s financially motivated activity with high confidence to a Chinese company that advertises SEO services."],"referencedReports":[{"title":"Jewelbug Dossier","url":"https://sed-cms.broadcom.com/sites/default/files/2026-08/Jewelbug%20Dossier.pdf","publisher":"Symantec","context":"The article says Symantec published a detailed technical report describing Jewelbug’s tooling, tradecraft, financial operation, and attack infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eThe China-based Jewelbug hacker group has been conducting espionage operations against governments and militaries while also running cryptocurrency fraud. In a recent campaign targeting a country in the Middle East, the group compromised webmail accounts belonging to 15 government tenants. Symantec found that the espionage campaign and cryptocurrency fraud were conducted from the same control panel.\u003c/p\u003e\n\n\u003cp\u003eJewelbug gained write access to a shared webmail installation and inserted a malicious script into a common template. The script ran on login pages and mailbox views, opened a WebSocket connection to the attackers’ command-and-control server, stole webmail cookies, and checked whether users belonged to targeted government domains. Selected targets received a fake Adobe Flash update prompt that installed the Antino backdoor and browser tooling.\u003c/p\u003e\n\n\u003cp\u003eSymantec said Jewelbug’s victim database contained more than one million implant check-in rows, more than 580,000 stolen browser cookies, several thousand captured credentials, and more than 2,300 exfiltrated email bodies. The group also used tools including XG-Web, a malicious PDF Viewer browser extension, and a Rust-based implant called ClientKing. Its cryptocurrency fraud operation used AI-generated articles, fake crypto exchange sites, click-fraud bots, and lookalike domains impersonating OKX and Binance.\u003c/p\u003e\n"},{"n":3,"title":"Akira hackers disable EDR with Safe Mode, steal data but fail to encrypt","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/akira-hackers-disable-edr-with-safe-mode-steal-data-but-fail-to-encrypt/","time":"20:47","priority":"SHOULD READ","score":82,"tldr":"An Akira ransomware affiliate used a SonicWall VPN account without MFA to breach a network, rebooted a host into Safe Mode with Networking to disable Huntress EDR and Microsoft Defender protections, and stole data. The ransomware encryption attempt failed due to system errors, but the attackers still completed credential and data theft in under five hours.","briefOverview":"\u003cp\u003eAn Akira ransomware affiliate disabled endpoint detection and response on a compromised system by rebooting it into Safe Mode with Networking. The attack began on August 4 after the attacker gained access through an exposed SonicWall VPN device that did not have multi-factor authentication. Huntress said the attacker then used RDP to access the domain controller, enumerated Active Directory users and computers, and moved to an application server.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used WinRAR to archive mapped file shares and s5cmd to upload stolen data to an attacker-controlled S3 bucket, then installed AnyDesk for remote access. Using AnyDesk, the attacker forced the host into Safe Mode with Networking and disabled both the Huntress agent and Microsoft Defender real-time protection. Huntress said that for 10 minutes in Safe Mode, the host had no working EDR and antivirus was blinded.\u003c/p\u003e\n\n\u003cp\u003eThe attacker added AnyDesk to the Windows Safe Mode registry so it would start after reboot, but the Akira ransomware payload failed to execute because of low virtual memory and related errors. A scheduled Defender scan detected the Akira executable while the system was still in Safe Mode, and Defender quarantined it only after the attacker rebooted into normal mode. Even though encryption failed, the Akira operator still stole credentials and files for data extortion in less than five hours from initial access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An Akira ransomware affiliate gained initial access through an exposed SonicWall VPN device that did not have multi-factor authentication enabled.","After logging in, the attacker used RDP to reach the domain controller, enumerated Active Directory users and computers, and moved to an application server.","The attacker used WinRAR to archive mapped file shares and s5cmd to upload stolen data to an attacker-controlled S3 bucket before installing AnyDesk for remote access.","The attacker rebooted the compromised host into Safe Mode with Networking, disabled the Huntress agent and Microsoft Defender real-time protection, and added AnyDesk to the Windows Safe Mode registry to preserve access.","The Akira ransomware payload failed to execute in Safe Mode because of low virtual memory and related errors, but the attacker still stole credentials and files in less than five hours from initial access."],"insights":["Safe Mode with Networking can create a short window where EDR and antivirus protections are not working, making boot-configuration changes a high-value detection signal.","Disabling Microsoft Defender real-time protection in Safe Mode did not fully prevent detection, because a scheduled Defender scan still detected the Akira executable.","The attack shows that failed encryption does not prevent extortion impact, since the operator still stole credentials and files before the ransomware payload failed.","Adding remote-access tools to the Windows Safe Mode service registry is an actionable persistence indicator for this type of ransomware activity.","Huntress had previously seen Safe Mode abuse in ransomware attacks by Snatch and AvosLocker, but this was its first observed Akira case using the tactic."],"referencedReports":[{"title":"Akira Hits Safe Mode: Ransomware Rebooting Around EDR","url":"https://www.huntress.com/blog/akira-hits-safe-mode-ransomware-rebooting-around-edr","publisher":"Huntress","context":"The article cites Huntress as the source of the technical findings about the Akira affiliate rebooting a host into Safe Mode with Networking to disable EDR and antivirus protections.","category":"research","primary":true}],"body":"\u003cp\u003eAn Akira ransomware affiliate disabled endpoint detection and response on a compromised system by rebooting it into Safe Mode with Networking. The attack began on August 4 after the attacker gained access through an exposed SonicWall VPN device that did not have multi-factor authentication. Huntress said the attacker then used RDP to access the domain controller, enumerated Active Directory users and computers, and moved to an application server.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used WinRAR to archive mapped file shares and s5cmd to upload stolen data to an attacker-controlled S3 bucket, then installed AnyDesk for remote access. Using AnyDesk, the attacker forced the host into Safe Mode with Networking and disabled both the Huntress agent and Microsoft Defender real-time protection. Huntress said that for 10 minutes in Safe Mode, the host had no working EDR and antivirus was blinded.\u003c/p\u003e\n\n\u003cp\u003eThe attacker added AnyDesk to the Windows Safe Mode registry so it would start after reboot, but the Akira ransomware payload failed to execute because of low virtual memory and related errors. A scheduled Defender scan detected the Akira executable while the system was still in Safe Mode, and Defender quarantined it only after the attacker rebooted into normal mode. Even though encryption failed, the Akira operator still stole credentials and files for data extortion in less than five hours from initial access.\u003c/p\u003e\n"},{"n":2,"title":"Ukraine shuts down 94 fraudulent call centers, seize millions in cash","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ukraine-shuts-down-94-fraudulent-call-centers-seize-millions-in-cash/","time":"21:12","priority":"SHOULD READ","score":78,"tldr":"Ukrainian authorities shut down 94 fraudulent call centers that ran bank impersonation, fake investment, and recovery scams targeting victims in Ukraine and the EU. Police seized thousands of devices, SIM cards, cash, crypto wallet access tools, vehicles, and gold, and identified 26 suspects who could face up to 12 years in prison.","briefOverview":"\u003cp\u003eAuthorities in Ukraine shut down 94 fraudulent call centers across the country that lured people into investment scams or tried to obtain access to bank accounts. The operation took place this week and included 411 searches following an investigation involving the National Police, Ukraine\u0026rsquo;s Security Service, the Prosecutor General’s Office, and German police. Twenty-six individuals have been formally notified that they are suspects.\u003c/p\u003e\n\n\u003cp\u003ePolice said the call centers used multiple schemes, including posing as bank officers, brokers, and law enforcement officers. Some operators told victims that suspicious transactions had been detected and threatened to block accounts unless payments were made, while others pushed fake investment platforms or promised help recovering money already lost to fraud. Some victims were persuaded to apply for loans, provide payment card details, or install remote-access tools on phones and computers.\u003c/p\u003e\n\n\u003cp\u003eDuring the raids, police seized 1,794 fully equipped workstations, 3,336 pieces of computer equipment, 1,346 phones, 5,200 SIM cards, 90 bank cards, access tools for 20 cryptocurrency wallets, 22 vehicles, cash, and gold. Police said some call centers targeted citizens in foreign countries, particularly in the European Union. Investigators are conducting forensic analysis of the seized equipment to identify victims, determine losses, and gather evidence against organizers, participants, money mules, and money launderers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian authorities shut down 94 fraudulent call centers after 411 searches conducted with involvement from the National Police, Ukraine's Security Service, the Prosecutor General’s Office, and German police.","The call centers ran schemes in which operators posed as bankers, brokers, and law enforcement officers to lure victims into fake investment platforms or gain access to their bank accounts.","Police said some call centers targeted people in foreign countries, particularly in the European Union, and tricked them into investing on fake brokerage platforms and installing remote-access software.","During the raids, police seized 1,794 fully equipped workstations, 3,336 pieces of computer equipment, 1,346 phones, 5,200 SIM cards, 90 bank cards, access tools for 20 cryptocurrency wallets, 22 vehicles, cash, and gold.","Twenty-six individuals have been formally notified that they are suspects, and the offenses under investigation carry penalties of up to 12 years in prison and confiscation of property."],"insights":["The seized infrastructure shows the scams were highly industrialized, with 1,794 fully equipped workstations, 3,336 pieces of computer equipment, 1,346 phones, and 5,200 SIM cards supporting call-center operations.","The schemes combined several fraud models, including fake investments, bank impersonation, recovery scams, and fake medical treatments, indicating the call centers were not limited to a single type of deception.","The operators used dedicated teams to identify people with genuine interest in investing, showing that some victims were selected through targeted screening rather than random calls.","The investigation is expected to use seized equipment not only to identify victims and losses, but also to find evidence against organizers, money mules, and money launderers."],"referencedReports":[],"body":"\u003cp\u003eAuthorities in Ukraine shut down 94 fraudulent call centers across the country that lured people into investment scams or tried to obtain access to bank accounts. The operation took place this week and included 411 searches following an investigation involving the National Police, Ukraine\u0026rsquo;s Security Service, the Prosecutor General’s Office, and German police. Twenty-six individuals have been formally notified that they are suspects.\u003c/p\u003e\n\n\u003cp\u003ePolice said the call centers used multiple schemes, including posing as bank officers, brokers, and law enforcement officers. Some operators told victims that suspicious transactions had been detected and threatened to block accounts unless payments were made, while others pushed fake investment platforms or promised help recovering money already lost to fraud. Some victims were persuaded to apply for loans, provide payment card details, or install remote-access tools on phones and computers.\u003c/p\u003e\n\n\u003cp\u003eDuring the raids, police seized 1,794 fully equipped workstations, 3,336 pieces of computer equipment, 1,346 phones, 5,200 SIM cards, 90 bank cards, access tools for 20 cryptocurrency wallets, 22 vehicles, cash, and gold. Police said some call centers targeted citizens in foreign countries, particularly in the European Union. Investigators are conducting forensic analysis of the seized equipment to identify victims, determine losses, and gather evidence against organizers, participants, money mules, and money launderers.\u003c/p\u003e\n"},{"n":4,"title":"Curiouser and Curiouser","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/curiouser-and-curiouser/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cisco Talos highlights JWR, a real-time phishing framework used in SMS scams that lets attackers interact with victims live to steal payment data, identity documents, device fingerprints, and MFA codes. Organizations should prioritize smishing awareness, monitor unusual logins, and adopt phishing-resistant MFA such as FIDO2 keys.","briefOverview":"\u003cp\u003eCisco Talos’ Threat Source newsletter focuses on the value of seeking multiple perspectives in security work, from threat hunting pivots to patching priorities and training choices. The author uses the “Make Hazel a Hacker” segment from the Beers with Talos podcast as an example of how different answers can all be correct. The article encourages readers to explore unfamiliar paths suggested by colleagues because security is presented as a team effort rather than a solo activity.\u003c/p\u003e\n\n\u003cp\u003eThe main security item is Cisco Talos’ discovery of “JWR,” a previously undocumented, real-time phishing framework and likely variant of “The Outsider” phishing-as-a-service platform. JWR is currently deployed through SMS lures impersonating regional toll and postal authorities. The framework uses an open WebSocket connection so attackers can monitor keystrokes live and dynamically guide victims through fake checkout and login flows.\u003c/p\u003e\n\n\u003cp\u003eThe article says JWR matters because its operator-driven approach can help attackers bypass multi-factor authentication by asking victims for 2FA codes exactly when needed. It can be used to steal payment data, 2FA codes, identity documents, device fingerprints, and session-related information that may support follow-on fraud or network compromise. Recommended actions include educating users about SMS phishing, monitoring unusual authentication attempts, and using phishing-resistant MFA such as FIDO2 hardware keys where possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos recently discovered “JWR,” a previously undocumented, real-time phishing framework and likely variant of “The Outsider” phishing-as-a-service platform.","JWR uses an open WebSocket connection that allows attackers to monitor keystrokes live and dynamically steer victims through fake checkout and login flows.","JWR is currently deployed via SMS lures impersonating regional toll and postal authorities to steal payment data, 2FA codes, identity documents, and device fingerprints.","The article says JWR can help attackers bypass multi-factor authentication by prompting victims for 2FA codes exactly when needed.","The article recommends user education around SMS-based phishing, monitoring for unusual authentication attempts, and implementing phishing-resistant MFA methods like FIDO2 hardware keys where possible."],"insights":["The article emphasizes that benign-looking indicators, such as a reference to “wallpaper.bmp,” can become useful starting points for threat hunting when examined from multiple perspectives.","JWR’s real-time, operator-driven design makes stolen one-time codes especially dangerous because attackers can ask for them at the exact moment they are needed.","The article warns that stolen device fingerprints and session tokens can undermine conditional access policies, so unusual authentication attempts remain important to monitor even when access controls are in place.","The author argues that security decisions improve when teams deliberately seek second, third, and fourth opinions, because different approaches can all be valid and reveal paths a single analyst might miss."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos’ Threat Source newsletter focuses on the value of seeking multiple perspectives in security work, from threat hunting pivots to patching priorities and training choices. The author uses the “Make Hazel a Hacker” segment from the Beers with Talos podcast as an example of how different answers can all be correct. The article encourages readers to explore unfamiliar paths suggested by colleagues because security is presented as a team effort rather than a solo activity.\u003c/p\u003e\n\n\u003cp\u003eThe main security item is Cisco Talos’ discovery of “JWR,” a previously undocumented, real-time phishing framework and likely variant of “The Outsider” phishing-as-a-service platform. JWR is currently deployed through SMS lures impersonating regional toll and postal authorities. The framework uses an open WebSocket connection so attackers can monitor keystrokes live and dynamically guide victims through fake checkout and login flows.\u003c/p\u003e\n\n\u003cp\u003eThe article says JWR matters because its operator-driven approach can help attackers bypass multi-factor authentication by asking victims for 2FA codes exactly when needed. It can be used to steal payment data, 2FA codes, identity documents, device fingerprints, and session-related information that may support follow-on fraud or network compromise. Recommended actions include educating users about SMS phishing, monitoring unusual authentication attempts, and using phishing-resistant MFA such as FIDO2 hardware keys where possible.\u003c/p\u003e\n"}]</script>
