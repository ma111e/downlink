<script type="application/json" id="dl-articles">[{"n":1,"title":"World's Largest AI Model Repository Hugging Face Breached by Autonomous AI Agent","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/worlds-largest-ai-model-repository.html","time":"05:27","priority":"MUST READ","score":92,"tldr":"Hugging Face said an autonomous AI agent breached parts of its production infrastructure via malicious dataset processing paths, accessing limited internal datasets and service credentials but not public models or its supply chain. The company remediated the intrusion, rotated secrets, and urged users to rotate access tokens and review account activity.","briefOverview":"\u003cp\u003eHugging Face said it detected and responded to a breach targeting its production infrastructure earlier last week. The company identified unauthorized access to a limited set of internal datasets and several credentials used by its services. It said it has found no evidence that the AI agent tampered with public, user-facing models, datasets, Spaces, or its software supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe attack began in the data processing pipeline with a malicious dataset that abused two code execution paths. Hugging Face said the dataset used a remote code dataset loader and a template injection in a dataset configuration to run code on a processing worker. From there, the threat actor escalated to node-level access, collected cloud and cluster credentials, and moved laterally into several internal clusters over a weekend.\u003c/p\u003e\n\n\u003cp\u003eThe exact large language model used in the attack is unclear, but Hugging Face said the campaign was executed by an autonomous agent framework performing many thousands of actions across short-lived sandboxes. The company removed the attacker’s foothold, rebuilt compromised nodes, rotated affected credentials and tokens, deployed stricter controls, and improved detection and alerting. Hugging Face also urged customers to rotate access tokens and review recent activity, and said the incident showed defenders may need a capable model they can run on their own infrastructure during investigations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hugging Face said it detected and responded to unauthorized access targeting its production infrastructure earlier last week.","The company said the intrusion accessed a limited set of internal datasets and several credentials used by its services, but it found no evidence of tampering with public models, datasets, Spaces, or its software supply chain.","Hugging Face said the attack began with a malicious dataset that abused a remote code dataset loader and a template injection in a dataset configuration to run code on a processing worker.","The campaign was described as being executed by an autonomous agent framework performing many thousands of actions across short-lived sandboxes with command-and-control staged on public services.","Hugging Face said it removed the attacker’s foothold, rebuilt compromised nodes, rotated affected credentials and tokens, added stricter cluster controls, and urged customers to rotate access tokens and review recent account activity."],"insights":["The initial access came through Hugging Face’s own data processing pipeline, showing that dataset ingestion features can become an entry point when they include code execution paths.","Hugging Face’s investigators reported that some Western frontier models blocked forensic prompts containing real attack commands and artifacts, which the company said created a practical gap for incident response work.","The company said defenders should have a capable model ready to run on their own infrastructure before an incident, both to avoid safety-filter lockout and to keep attacker data and credentials inside their environment.","The attack’s use of many short-lived sandboxes and command-and-control staged on public services made the campaign operationally distributed rather than a single static intrusion path."],"referencedReports":[],"body":"\u003cp\u003eHugging Face said it detected and responded to a breach targeting its production infrastructure earlier last week. The company identified unauthorized access to a limited set of internal datasets and several credentials used by its services. It said it has found no evidence that the AI agent tampered with public, user-facing models, datasets, Spaces, or its software supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe attack began in the data processing pipeline with a malicious dataset that abused two code execution paths. Hugging Face said the dataset used a remote code dataset loader and a template injection in a dataset configuration to run code on a processing worker. From there, the threat actor escalated to node-level access, collected cloud and cluster credentials, and moved laterally into several internal clusters over a weekend.\u003c/p\u003e\n\n\u003cp\u003eThe exact large language model used in the attack is unclear, but Hugging Face said the campaign was executed by an autonomous agent framework performing many thousands of actions across short-lived sandboxes. The company removed the attacker’s foothold, rebuilt compromised nodes, rotated affected credentials and tokens, deployed stricter controls, and improved detection and alerting. Hugging Face also urged customers to rotate access tokens and review recent activity, and said the incident showed defenders may need a capable model they can run on their own infrastructure during investigations.\u003c/p\u003e\n"},{"n":2,"title":"SleeperGem Uses Three Malicious RubyGems Packages to Target Developer Machines","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/sleepergem-uses-three-malicious.html","time":"05:15","priority":"SHOULD READ","score":84,"tldr":"Researchers found three malicious RubyGems packages used in a supply-chain attack called SleeperGem that targeted developer machines, avoided CI environments, and installed a persistent native backdoor. Users who installed the affected gems should treat their systems and credentials as compromised and rotate secrets.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a software supply chain attack called SleeperGem targeting the Ruby ecosystem through three malicious RubyGems packages. The packages are \u003ccode\u003egit_credential_manager\u003c/code\u003e, \u003ccode\u003eDendreo\u003c/code\u003e, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, with malicious releases published across old or impersonating package names. StepSecurity said each malicious release acts as a loader that fetches a second stage from an attacker-controlled Forgejo host, avoids build systems, and installs persistence on developer machines.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003egit_credential_manager\u003c/code\u003e package impersonates Microsoft Git Credential Manager, while \u003ccode\u003eDendreo\u003c/code\u003e and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e had been dormant for years before receiving malicious updates. The malicious releases were published directly to RubyGems without matching commits or tags in the source projects. The article also notes that \u003ccode\u003egit_credential_manager\u003c/code\u003e was added as a dependency to five packages, including the two dormant packages, allowing the malicious payload to spread to existing users.\u003c/p\u003e\n\n\u003cp\u003eOnce installed, the malware checks for about 30 environment variables related to services such as GitHub Actions, GitLab, CircleCI, Travis, Jenkins, and Vercel, and exits if it detects them. On developer machines, it downloads payloads from \u003ccode\u003egit.disroot[.]org/git-ecosystem\u003c/code\u003e, installs a native daemon, and establishes persistence through cron and a systemd user service. Users who installed the affected gems are advised to treat machines and associated secrets as compromised, remove the dropped daemon and persistence methods, check for a setuid shell at \u003ccode\u003e/usr/local/sbin/ping6\u003c/code\u003e, and rotate all credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers identified a software supply chain attack called SleeperGem involving three malicious RubyGems packages: git_credential_manager, Dendreo, and fastlane-plugin-run_tests_firebase_testlab.","StepSecurity said each malicious release acts as a loader that fetches a second stage from an attacker-controlled Forgejo host, skips build systems, and installs a native daemon with persistence on developer machines.","The git_credential_manager package impersonates Microsoft Git Credential Manager, while Dendreo and fastlane-plugin-run_tests_firebase_testlab had been dormant for years before receiving malicious updates.","The malware checks for about 30 environment variables associated with CI services such as GitHub Actions, GitLab, CircleCI, Travis, Jenkins, and Vercel, and exits if any are found.","Users who installed any of the affected gems are advised to treat their machines and associated secrets as compromised, remove the dropped daemon and persistence methods, check for a setuid shell at /usr/local/sbin/ping6, and rotate all credentials."],"insights":["The malicious releases were published directly to RubyGems without matching commits or tags in the source projects, making registry-to-repository consistency checks a useful warning sign for this campaign.","The attackers appear to have used both a look-alike package name and long-dormant legitimate packages, showing that inactive maintainer accounts can become a high-value takeover path.","The addition of git_credential_manager as a dependency to five packages allowed the malicious payload to reach users who did not directly install the impersonating package.","The malware’s checks for CI-related environment variables indicate it was designed to avoid temporary build systems and focus on longer-lived developer machines where credentials are more likely to be present.","A separate RubyGems abuse case described in the article shows the registry can be misused not only to distribute malicious code but also as a trusted storage location for stolen data."],"referencedReports":[{"title":"SleeperGem: Compromised RubyGems Drop Persistent Backdoor","url":"https://www.stepsecurity.io/blog/sleepergem-compromised-rubygems-drop-persistent-backdoor","publisher":"StepSecurity","context":"The article cites StepSecurity's analysis as the source describing the malicious RubyGems releases as loaders that fetch a second stage and install persistence on developer machines.","category":"research","primary":true},{"title":"SleeperGem RubyGems Supply Chain Attack","url":"https://www.aikido.dev/blog/sleepergem-rubygems-supply-chain-attack","publisher":"Aikido Security","context":"The article quotes Aikido Security researcher Charlie Eriksen on why dormant RubyGems accounts were attractive takeover targets in the SleeperGem campaign.","category":"research","primary":false},{"title":"RubyGems Supply Chain Attack: Dead Drop","url":"https://www.mend.io/blog/rubygems-supply-chain-attack-dead-drop/","publisher":"Mend.io","context":"The article references Mend.io's disclosure of a separate RubyGems supply chain attack that used packages to store stolen credential data.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have identified a software supply chain attack called SleeperGem targeting the Ruby ecosystem through three malicious RubyGems packages. The packages are \u003ccode\u003egit_credential_manager\u003c/code\u003e, \u003ccode\u003eDendreo\u003c/code\u003e, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, with malicious releases published across old or impersonating package names. StepSecurity said each malicious release acts as a loader that fetches a second stage from an attacker-controlled Forgejo host, avoids build systems, and installs persistence on developer machines.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003egit_credential_manager\u003c/code\u003e package impersonates Microsoft Git Credential Manager, while \u003ccode\u003eDendreo\u003c/code\u003e and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e had been dormant for years before receiving malicious updates. The malicious releases were published directly to RubyGems without matching commits or tags in the source projects. The article also notes that \u003ccode\u003egit_credential_manager\u003c/code\u003e was added as a dependency to five packages, including the two dormant packages, allowing the malicious payload to spread to existing users.\u003c/p\u003e\n\n\u003cp\u003eOnce installed, the malware checks for about 30 environment variables related to services such as GitHub Actions, GitLab, CircleCI, Travis, Jenkins, and Vercel, and exits if it detects them. On developer machines, it downloads payloads from \u003ccode\u003egit.disroot[.]org/git-ecosystem\u003c/code\u003e, installs a native daemon, and establishes persistence through cron and a systemd user service. Users who installed the affected gems are advised to treat machines and associated secrets as compromised, remove the dropped daemon and persistence methods, check for a setuid shell at \u003ccode\u003e/usr/local/sbin/ping6\u003c/code\u003e, and rotate all credentials.\u003c/p\u003e\n"}]</script>
