<script type="application/json" id="dl-articles">[{"n":6,"title":"CISA Flags TeamCity CVE-2026-63077 RCE Flaw Under Active Exploitation in the Wild","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/cisa-flags-teamcity-cve-2026-63077-rce.html","time":"06:51","priority":"MUST READ","score":95,"tldr":"CISA says a critical JetBrains TeamCity on-premise remote code execution flaw, CVE-2026-63077, is being actively exploited in the wild. Organizations should patch immediately, as successful exploitation can expose credentials, alter TeamCity servers, and compromise CI/CD pipelines.","briefOverview":"\u003cp\u003eCISA says a newly patched security flaw affecting on-premise versions of JetBrains TeamCity is under active exploitation in the wild. The flaw is tracked as CVE-2026-63077 and has a CVSS score of 9.8. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability involves deserialization of untrusted data and can allow an unauthenticated attacker with access to a TeamCity server to bypass authentication checks. According to CISA and JetBrains, it can be exploited through the TeamCity agent polling protocol. Successful exploitation could allow arbitrary operating system commands to run with the privileges of the TeamCity server process.\u003c/p\u003e\n\n\u003cp\u003eJetBrains says the impact depends on the privileges granted to the TeamCity server process. A successful attack can expose TeamCity data, configurations, and stored credentials, modify server state, and potentially compromise build artifacts and downstream CI/CD pipelines. The article states that the exploitation method in the wild, the threat actors involved, and the scale of activity are not currently known, and federal agencies must apply patches or mitigations by August 8, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA says CVE-2026-63077, a newly patched flaw affecting on-premise versions of JetBrains TeamCity, is under active exploitation in the wild.","CVE-2026-63077 has a CVSS score of 9.8 and involves deserialization of untrusted data that could allow an unauthenticated attacker to bypass authentication checks and execute arbitrary operating system commands.","JetBrains says the flaw can be exploited through the TeamCity agent polling protocol, with impact depending on the privileges granted to the TeamCity server process.","A successful attack can expose TeamCity data, configurations, and stored credentials, modify server state, and potentially compromise build artifacts and downstream CI/CD pipelines.","Federal Civilian Executive Branch agencies are required to apply patches or mitigations for CVE-2026-63077 by August 8, 2026."],"insights":["CISA’s listing creates a concrete federal remediation deadline of August 8, 2026, even though JetBrains had not yet updated its advisory to confirm active exploitation.","The reported impact reaches beyond the TeamCity server itself because compromised access could affect build artifacts and downstream CI/CD pipelines.","The article states that the threat actors, exploitation method in the wild, and scale of activity are not currently known, limiting the available public context for defenders.","The severity of a successful compromise depends on the privileges assigned to the TeamCity server process, making that configuration an important factor in real-world impact."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/05/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites this CISA alert as the source for the claim that CVE-2026-63077 is under active exploitation in the wild.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=CVE-2026-63077","publisher":"CISA","context":"The article links to CISA’s KEV catalog entry describing CVE-2026-63077 as a deserialization flaw that could allow unauthenticated remote code execution.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA says a newly patched security flaw affecting on-premise versions of JetBrains TeamCity is under active exploitation in the wild. The flaw is tracked as CVE-2026-63077 and has a CVSS score of 9.8. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability involves deserialization of untrusted data and can allow an unauthenticated attacker with access to a TeamCity server to bypass authentication checks. According to CISA and JetBrains, it can be exploited through the TeamCity agent polling protocol. Successful exploitation could allow arbitrary operating system commands to run with the privileges of the TeamCity server process.\u003c/p\u003e\n\n\u003cp\u003eJetBrains says the impact depends on the privileges granted to the TeamCity server process. A successful attack can expose TeamCity data, configurations, and stored credentials, modify server state, and potentially compromise build artifacts and downstream CI/CD pipelines. The article states that the exploitation method in the wild, the threat actors involved, and the scale of activity are not currently known, and federal agencies must apply patches or mitigations by August 8, 2026.\u003c/p\u003e\n"},{"n":5,"title":"Attackers Compile khunt Inside Oracle to Turn SQL Injection Into Windows SYSTEM Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/attackers-compile-khunt-inside-oracle.html","time":"09:19","priority":"MUST READ","score":92,"tldr":"Attackers exploited a SQL injection flaw in a public-facing app to install the khunt toolkit inside an Oracle database, compiling Java objects that executed Windows commands as SYSTEM without dropping a normal executable. The key defense is fixing the app’s input handling and ensuring web-app database accounts cannot create Java sources or run unnecessary stored code.","briefOverview":"\u003cp\u003eAttackers broke into an organization’s Oracle database through a SQL injection flaw in a public-facing web application. Huntress investigated after credential-theft detections fired on July 27, 2026, and tracks the post-exploitation toolkit as khunt. The chain led to SYSTEM-level code execution on the underlying Windows server.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was in an autocomplete search field that passed unvalidated input to the database over a JDBC connection. The database account behind that connection had enough privilege to create Java objects, and the attackers fed Java source code to Oracle so the database compiled it into stored schema objects. Huntress said no Oracle patch closes the application flaw or the account privilege issue, so defenders must hunt for object names beginning Khunt and SQL logs containing KHUNT%.\u003c/p\u003e\n\n\u003cp\u003eThe khunt toolkit included Java objects and khunt_* PL/SQL wrappers for running Windows commands, reading Oracle password hashes, listing and reading files, testing access, and unpacking archives. Running cmd.exe /c whoami through KhuntCmd returned SYSTEM, after which the attackers used PowerShell, reg.exe, and esentutl.exe to stage registry hives and task information under F:\\Oracle. Huntress observed the files being staged locally but did not establish that they were exfiltrated, and it traced the malicious requests to 178.162.151[.]229.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers entered an organization’s Oracle database through a SQL injection flaw in a public-facing web application’s autocomplete search field.","The compromised JDBC database account had enough privilege to create Java objects, allowing attackers to compile Java source code inside Oracle as stored schema objects.","Huntress tracks the post-exploitation toolkit as khunt and traced the incident to SYSTEM-level code execution on the underlying Windows server.","The khunt toolkit included Java objects and PL/SQL wrappers for running operating-system commands, reading Oracle password hashes, listing and reading files, testing access, and unpacking archives.","Huntress observed attackers staging Windows registry hive copies and task information locally, but did not establish that the files were exfiltrated."],"insights":["Because khunt was compiled into Oracle as stored schema objects rather than written as a normal executable file, endpoint detection tools may miss it if they do not inspect Oracle’s internal objects.","There is no Oracle patch for this chain because the root causes were the web application’s unvalidated input and the database account’s excessive privileges.","Hunting only for Khunt or KHUNT% can find this specific toolkit, but it will not detect the broader technique of using Oracle Java objects for command execution.","A public-facing application account should not have the ability to create Java sources or run unrelated stored procedures, because that privilege can turn a SQL injection flaw into operating-system command execution."],"referencedReports":[{"title":"khunt Malware: SQL Injection Oracle","url":"https://www.huntress.com/blog/khunt-malware-sql-injection-oracle","publisher":"Huntress","context":"The article relies on Huntress’s investigation of the khunt toolkit and quotes its assessment that the technique has rarely been documented in the wild.","category":"research","primary":true}],"body":"\u003cp\u003eAttackers broke into an organization’s Oracle database through a SQL injection flaw in a public-facing web application. Huntress investigated after credential-theft detections fired on July 27, 2026, and tracks the post-exploitation toolkit as khunt. The chain led to SYSTEM-level code execution on the underlying Windows server.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was in an autocomplete search field that passed unvalidated input to the database over a JDBC connection. The database account behind that connection had enough privilege to create Java objects, and the attackers fed Java source code to Oracle so the database compiled it into stored schema objects. Huntress said no Oracle patch closes the application flaw or the account privilege issue, so defenders must hunt for object names beginning Khunt and SQL logs containing KHUNT%.\u003c/p\u003e\n\n\u003cp\u003eThe khunt toolkit included Java objects and khunt_* PL/SQL wrappers for running Windows commands, reading Oracle password hashes, listing and reading files, testing access, and unpacking archives. Running cmd.exe /c whoami through KhuntCmd returned SYSTEM, after which the attackers used PowerShell, reg.exe, and esentutl.exe to stage registry hives and task information under F:\\Oracle. Huntress observed the files being staged locally but did not establish that they were exfiltrated, and it traced the malicious requests to 178.162.151[.]229.\u003c/p\u003e\n"},{"n":3,"title":"Snowflake Hacker Pleads Guilty Over Breaches Affecting at Least 100 Million People","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/snowflake-hacker-pleads-guilty-over.html","time":"06:04","priority":"SHOULD READ","score":88,"tldr":"Connor Riley Moucka pleaded guilty to hacking Snowflake customer accounts in a 2024 campaign that compromised at least 165 organizations and exposed data on at least 100 million people. The breaches were enabled by old infostealer-stolen passwords that were never rotated and accounts without MFA, not by a Snowflake platform flaw.","briefOverview":"\u003cp\u003eConnor Riley Moucka pleaded guilty in Seattle federal court to computer fraud, wire fraud, aggravated identity theft, and a related conspiracy over the 2024 breaches of Snowflake customer accounts. The intrusions reached at least 165 organizations and exposed records belonging to at least 100 million people. Moucka, 26, of Kitchener, Ontario, personally took at least $495,000 from ransoms and data sales. He is due to be sentenced on October 27 and faces a two-year mandatory minimum on the identity theft count and up to 30 years on the rest.\u003c/p\u003e\n\n\u003cp\u003eThe attackers got in using old passwords that had been harvested years earlier by infostealer malware and were never rotated, while the accounts had multi-factor authentication switched off. The article states there was no exploit and no flaw in the Snowflake platform. Mandiant, which investigated alongside Snowflake and tracks the actor as UNC5537, found that every incident it worked traced back to customer credentials stolen by infostealers. Some credentials had been harvested as far back as November 2020 and were still valid years later.\u003c/p\u003e\n\n\u003cp\u003eThe stolen data included non-content call and text history, payroll records, DEA registration numbers, passport numbers, and Social Security numbers. AT\u0026amp;T confirmed in July 2024 that records of calls and texts for nearly all its cellular customers between May 1 and October 31, 2022 were taken from its workspace on a third-party cloud platform. Victim companies suffered more than $9.5 million in actual losses, excluding losses to their own customers. Snowflake has enforced multi-factor authentication by default for human users on accounts created since October 2024, but its documentation says the final phase blocking passwords as a sole factor for every remaining human and service user is scheduled between August and October 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Connor Riley Moucka pleaded guilty in Seattle federal court to computer fraud, wire fraud, aggravated identity theft, and a related conspiracy over the 2024 breaches of Snowflake customer accounts.","The intrusions reached at least 165 organizations and exposed records belonging to at least 100 million people, while Moucka personally took at least $495,000 from ransoms and data sales.","The attackers gained access using old passwords harvested years earlier by infostealer malware, with affected accounts lacking multi-factor authentication and no exploit or platform flaw involved.","Mandiant said every incident it investigated traced back to customer credentials stolen by infostealers, with some credentials harvested as far back as November 2020 and still valid years later.","Snowflake has enforced multi-factor authentication by default for human users on accounts created since October 2024, but its final phase to block password-only sign-ins for every remaining human and service user is scheduled between August and October 2026."],"insights":["Some Snowflake customer credentials stolen as far back as November 2020 were still valid during the 2024 campaign, showing that unrotated passwords can remain exploitable for years after they are first exposed.","The campaign was broad not because of a sophisticated exploit, but because the infostealer market had supplied usable credentials and many affected accounts lacked multi-factor authentication and network allow lists.","The article notes that the meaning of the “165” figure changed over time, from organizations notified as potentially exposed in 2024 to customers prosecutors now describe as actually compromised.","Snowflake’s move to block password-only sign-ins is being phased in through August to October 2026, meaning password-only access is not yet fully eliminated across all remaining human and service users."],"referencedReports":[{"title":"UNC5537 Targets Snowflake Customer Instances for Data Theft and Extortion","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc5537-snowflake-data-theft-extortion","publisher":"Mandiant","context":"The article cites Mandiant’s technical analysis to explain that the Snowflake customer incidents traced back to credentials stolen by infostealers and accounts lacking multi-factor authentication and network allow lists.","category":"research","primary":false}],"body":"\u003cp\u003eConnor Riley Moucka pleaded guilty in Seattle federal court to computer fraud, wire fraud, aggravated identity theft, and a related conspiracy over the 2024 breaches of Snowflake customer accounts. The intrusions reached at least 165 organizations and exposed records belonging to at least 100 million people. Moucka, 26, of Kitchener, Ontario, personally took at least $495,000 from ransoms and data sales. He is due to be sentenced on October 27 and faces a two-year mandatory minimum on the identity theft count and up to 30 years on the rest.\u003c/p\u003e\n\n\u003cp\u003eThe attackers got in using old passwords that had been harvested years earlier by infostealer malware and were never rotated, while the accounts had multi-factor authentication switched off. The article states there was no exploit and no flaw in the Snowflake platform. Mandiant, which investigated alongside Snowflake and tracks the actor as UNC5537, found that every incident it worked traced back to customer credentials stolen by infostealers. Some credentials had been harvested as far back as November 2020 and were still valid years later.\u003c/p\u003e\n\n\u003cp\u003eThe stolen data included non-content call and text history, payroll records, DEA registration numbers, passport numbers, and Social Security numbers. AT\u0026amp;T confirmed in July 2024 that records of calls and texts for nearly all its cellular customers between May 1 and October 31, 2022 were taken from its workspace on a third-party cloud platform. Victim companies suffered more than $9.5 million in actual losses, excluding losses to their own customers. Snowflake has enforced multi-factor authentication by default for human users on accounts created since October 2024, but its documentation says the final phase blocking passwords as a sole factor for every remaining human and service user is scheduled between August and October 2026.\u003c/p\u003e\n"},{"n":4,"title":"Chinese-Made Zbtlink Routers Ship With Backdoor That Opens Unauthenticated Root Shells","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/chinese-made-zbtlink-routers-ship-with.html","time":"08:05","priority":"SHOULD READ","score":86,"tldr":"VulnCheck found that at least 20 Zbtlink router models shipped with a factory backdoor called ENDLESSDOORS that phones home to Chinese-controlled infrastructure and can open unauthenticated root shells. Users should check for the listed implant files/processes and block the known outbound endpoints until patched firmware is available.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed a factory-shipped backdoor implanted in at least 20 Chinese router models from Zbtlink. VulnCheck reported that the implant appears in all 21 firmware images currently available from Zbtlink, spanning more than two years. The backdoors start automatically and attempt to beacon to Chinese command-and-control infrastructure as often as every 35 seconds.\u003c/p\u003e\n\n\u003cp\u003eThe implants, codenamed ENDLESSDOORS, masquerade as a Linux kernel thread but are actually userland processes running with root privileges. VulnCheck said ENDLESSDOORS is based on rctl, a small remote-control Linux tool uploaded to GitHub in 2015. The server can send shell commands to the client or tell it to spawn a reverse bash shell.\u003c/p\u003e\n\n\u003cp\u003eVulnCheck found there is no handshake, negotiation, or authentication, and the implant can run whatever the server sends back after a hello message with the LAN MAC address. A reserved string, rctlbash, causes the implant to open another connection, spawn /bin/sh, and provide a live interactive root shell. Zbtlink temporarily removed impacted firmware from its download channels and said it is working on secured patched firmware, while customers were advised to check for listed files and block the known egress points.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["VulnCheck reported that a factory-shipped backdoor appears in all 21 Zbtlink firmware images currently available from the company, spanning more than two years.","The backdoor, codenamed ENDLESSDOORS, is based on the rctl remote control tool and is designed to start automatically and contact command-and-control infrastructure as often as every 35 seconds.","The implant runs as a root-privileged userland process that masquerades as a Linux kernel thread named kworker.","VulnCheck said the implant has no handshake, negotiation, or authentication, allowing the server to send root commands or trigger an interactive root shell.","Zbtlink temporarily removed impacted firmware from its download channels and said it is working on secured patched firmware."],"insights":["Because the implant accepts commands without authentication, anyone who can control the domain resolution or the address it contacts can take control of affected devices that phone home.","The article notes that attackers can hijack the router’s outbound communications to obtain a root shell, meaning the router does not need to be reachable from the internet to be taken over.","VulnCheck found the implant in every firmware image listed on Zbtlink’s download page, making the issue a supply-side firmware problem rather than a compromise of only individual deployed routers.","The implant can be investigated by checking for specific artifacts named in the article, including /usr/sbin/kworker, /usr/lib/librctl.so, /etc/kworker.cfg, and /etc/init.d/skworker."],"referencedReports":[{"title":"ZBT ENDLESSDOORS","url":"https://www.vulncheck.com/blog/zbt-endlessdoors","publisher":"VulnCheck","context":"The article cites a new VulnCheck report as the source for details about factory-shipped backdoors in Zbtlink router firmware.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers disclosed a factory-shipped backdoor implanted in at least 20 Chinese router models from Zbtlink. VulnCheck reported that the implant appears in all 21 firmware images currently available from Zbtlink, spanning more than two years. The backdoors start automatically and attempt to beacon to Chinese command-and-control infrastructure as often as every 35 seconds.\u003c/p\u003e\n\n\u003cp\u003eThe implants, codenamed ENDLESSDOORS, masquerade as a Linux kernel thread but are actually userland processes running with root privileges. VulnCheck said ENDLESSDOORS is based on rctl, a small remote-control Linux tool uploaded to GitHub in 2015. The server can send shell commands to the client or tell it to spawn a reverse bash shell.\u003c/p\u003e\n\n\u003cp\u003eVulnCheck found there is no handshake, negotiation, or authentication, and the implant can run whatever the server sends back after a hello message with the LAN MAC address. A reserved string, rctlbash, causes the implant to open another connection, spawn /bin/sh, and provide a live interactive root shell. Zbtlink temporarily removed impacted firmware from its download channels and said it is working on secured patched firmware, while customers were advised to check for listed files and block the known egress points.\u003c/p\u003e\n"},{"n":2,"title":"AWS, Google, and Vercel Agent Flaws Let Attackers Trigger Tools Without Running the Model","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/aws-google-and-vercel-patch-agent-flaws.html","time":"08:57","priority":"SHOULD READ","score":82,"tldr":"Researchers found flaws in AWS, Google, and Vercel agent frameworks that let attackers trigger agent tools without a legitimate model-authorized turn, bypassing prompts and model guardrails entirely. AWS, Google, and Vercel have issued fixes, but developers must still treat tool-call data and session history as untrusted and enforce authorization at tool execution time.","briefOverview":"\u003cp\u003eSecurity flaws in agent infrastructure from Amazon Web Services, Google, and Vercel allowed untrusted or forged instructions to reach agent tools without checking that a model turn had authorized them. In several attack paths, the model never ran, so system prompts, content filters, and model-level guardrails had no chance to intervene. The affected products include Amazon Bedrock AgentCore’s InvokeHarness API, Google’s Agent Development Kit for Python, and Vercel AI SDK harness packages for the Codex and OpenCode coding agents.\u003c/p\u003e\n\n\u003cp\u003eThe issues were presented by Hedi Ingber and Aviyam Ivgi, co-founders of Stealth, as a cross-platform pattern they call CoreBreak. The vulnerable paths treated data shaped like a model-generated tool call as authoritative, allowing attackers to reach dispatch or authorization paths without persuading the model to break its rules. The conditions differed by platform: AWS involved an authenticated remote request, Google required attacker-controlled session events or user-authored function calls, and Vercel required untrusted code already running inside a Linux sandbox.\u003c/p\u003e\n\n\u003cp\u003eAWS fixed the managed InvokeHarness API by rejecting caller-supplied tool-use blocks, Google addressed the ADK issues in version 2.5.0, and Vercel patched @ai-sdk/harness-codex in 1.0.29 and @ai-sdk/harness-opencode in 1.0.28. The article notes that exposure is limited to what each agent can already do, so an agent without sensitive tools gives an attacker nothing. The recommended controls include rejecting caller-authored tool calls, binding tool execution to exact model events and arguments, and reducing each agent’s inherited authority.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security flaws in agent infrastructure from AWS, Google, and Vercel allowed untrusted or forged instructions to reach an agent’s tools without verifying that a model turn had authorized them.","The affected products include Amazon Bedrock AgentCore’s InvokeHarness API, Google’s Agent Development Kit for Python, and Vercel AI SDK harness packages for the Codex and OpenCode coding agents.","AWS fixed the managed InvokeHarness service by rejecting caller-supplied tool-use blocks, while Google fixed the ADK issues in version 2.5.0 and Vercel patched @ai-sdk/harness-codex in version 1.0.29 and @ai-sdk/harness-opencode in version 1.0.28.","The attack conditions differed by vendor: AWS involved an authenticated remote request, Google required attacker-controlled session events or user-authored function calls, and Vercel required untrusted code already running inside a Linux sandbox.","The researchers said the exposure is limited to what each agent can already do, so an agent connected to no sensitive tools would not give an attacker useful access."],"insights":["The article emphasizes that these flaws are not prompt injection because the model may never run, meaning system prompts, content filters, and model-level guardrails cannot protect the tool execution path.","The common failure across the vendors was treating data that looked like a tool call as sufficient authority, rather than binding tool execution to a verified model event, exact tool name, arguments, session, and authorization state.","AWS fixed the managed AgentCore InvokeHarness service, but the article says a comparable model-skipping shortcut remains documented in the open-source Strands Python code, shifting responsibility to developers who allow untrusted callers to shape message history.","The practical impact depends heavily on the agent’s configured powers, since the article states that an agent with no sensitive tools, credentials, cloud roles, or write permissions gives an attacker nothing useful.","Vercel’s patched relay moved from trusting a process path to requiring an exact, short-lived, one-time authorization for the tool name and input observed in a model event, showing a concrete execution-layer control for this class of flaw."],"referencedReports":[{"title":"The CoreBreak Attack: Turning AI Agents into Credentials Exfiltration Vectors","url":"https://blackhat.com/us-26/briefings/schedule/#the-corebreak-attack-turning-ai-agents-into-credentials-exfiltration-vectors-53825","publisher":"Black Hat USA 2026","context":"The article says Hedi Ingber and Aviyam Ivgi presented the cross-platform CoreBreak pattern at Black Hat USA 2026.","category":"research","primary":true},{"title":"AWS Security Bulletin 2026-073: CVE-2026-18830","url":"https://aws.amazon.com/security/security-bulletins/2026-073-aws/","publisher":"Amazon Web Services","context":"The article cites AWS's security bulletin for CVE-2026-18830, which describes insufficient input validation in the Amazon Bedrock AgentCore harness.","category":"advisory","primary":true},{"title":"CVE-2026-18236","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-18236","publisher":"National Vulnerability Database","context":"The article links the NVD record for CVE-2026-18236, the Google ADK for Python continuation-forgery flaw.","category":"advisory","primary":false},{"title":"GHSA-qw9h-448j-6rph: CVE-2026-64650","url":"https://github.com/vercel/ai/security/advisories/GHSA-qw9h-448j-6rph","publisher":"Vercel","context":"The article cites Vercel's GitHub advisory for CVE-2026-64650 affecting @ai-sdk/harness-codex through version 1.0.28.","category":"advisory","primary":true},{"title":"GHSA-g48p-5rr5-8rgq: CVE-2026-64651","url":"https://github.com/vercel/ai/security/advisories/GHSA-g48p-5rr5-8rgq","publisher":"Vercel","context":"The article cites Vercel's GitHub advisory for CVE-2026-64651 affecting @ai-sdk/harness-opencode through version 1.0.27.","category":"advisory","primary":true}],"body":"\u003cp\u003eSecurity flaws in agent infrastructure from Amazon Web Services, Google, and Vercel allowed untrusted or forged instructions to reach agent tools without checking that a model turn had authorized them. In several attack paths, the model never ran, so system prompts, content filters, and model-level guardrails had no chance to intervene. The affected products include Amazon Bedrock AgentCore’s InvokeHarness API, Google’s Agent Development Kit for Python, and Vercel AI SDK harness packages for the Codex and OpenCode coding agents.\u003c/p\u003e\n\n\u003cp\u003eThe issues were presented by Hedi Ingber and Aviyam Ivgi, co-founders of Stealth, as a cross-platform pattern they call CoreBreak. The vulnerable paths treated data shaped like a model-generated tool call as authoritative, allowing attackers to reach dispatch or authorization paths without persuading the model to break its rules. The conditions differed by platform: AWS involved an authenticated remote request, Google required attacker-controlled session events or user-authored function calls, and Vercel required untrusted code already running inside a Linux sandbox.\u003c/p\u003e\n\n\u003cp\u003eAWS fixed the managed InvokeHarness API by rejecting caller-supplied tool-use blocks, Google addressed the ADK issues in version 2.5.0, and Vercel patched @ai-sdk/harness-codex in 1.0.29 and @ai-sdk/harness-opencode in 1.0.28. The article notes that exposure is limited to what each agent can already do, so an agent without sensitive tools gives an attacker nothing. The recommended controls include rejecting caller-authored tool calls, binding tool execution to exact model events and arguments, and reducing each agent’s inherited authority.\u003c/p\u003e\n"},{"n":1,"title":"Ransom Cartel Creator Gets 16 Years in Prison for Operating Ransomware-as-a-Service","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/ransom-cartel-creator-gets-16-years-in.html","time":"07:19","priority":"SHOULD READ","score":78,"tldr":"A U.S. federal judge sentenced Belarusian national Maksim Silnikau to 16 years in prison for creating and operating the Ransom Cartel ransomware-as-a-service scheme, which targeted at least 18 companies from 2021 to 2023. He still faces a separate unresolved federal case tied to the Angler Exploit Kit malvertising operation.","briefOverview":"\u003cp\u003eA federal judge in Alexandria, Virginia, sentenced Maksim Silnikau to 16 years in prison on August 5 for creating and running Ransom Cartel, a ransomware-as-a-service operation he launched in 2021. The Justice Department said Ransom Cartel conspirators attacked at least 18 companies between 2021 and 2023, including firms in California, New York, Nebraska, and other countries. Silnikau is a 40-year-old Belarusian national who used the handles “J.P. Morgan,” “lansky,” and “xxx.”\u003c/p\u003e\n\n\u003cp\u003eThe article says Silnikau did not carry out most of the intrusions himself, but built the business around them. He developed the locking software, bought stolen credentials from initial access brokers, operated a hidden panel for affiliates, ran a ratings system, and pushed ransom payments through cryptocurrency mixers. Prosecutors said his July 2023 arrest stalled Ransom Cartel’s growth, and Poland extradited him to the United States in August 2024.\u003c/p\u003e\n\n\u003cp\u003eThe indictment says Silnikau ran the operation under another name from May 2021, renamed it “Ransom Cartel” in late 2021, and tried to publicize it on security news sites. Unit 42 previously found that Ransom Cartel operators had original REvil source code but apparently lacked REvil’s obfuscation engine, while neither the indictment nor sentencing release mentions REvil. Silnikau also faces a separate unresolved New Jersey case tied to the Angler Exploit Kit malvertising scheme, and two men charged alongside him there remain at large.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A federal judge in Alexandria, Virginia, sentenced Belarusian national Maksim Silnikau to 16 years in prison on August 5 for creating and running the Ransom Cartel ransomware-as-a-service operation.","Between 2021 and 2023, Ransom Cartel conspirators attacked at least 18 companies, including firms in California, New York, Nebraska, and other countries, according to the Justice Department.","Prosecutors said Silnikau built the locking software, bought stolen credentials from initial access brokers, operated a hidden panel for affiliates, ran a ratings system, and pushed ransom payments through cryptocurrency mixers.","The indictment says Silnikau ran the operation under another name from May 2021, renamed it Ransom Cartel in late 2021, and tried to publicize it on security news sites.","Silnikau was separately charged in New Jersey alongside Volodymyr Kadariya and Andrei Tarasov over the Angler Exploit Kit malvertising scheme, and that federal prosecution remains unresolved."],"insights":["Silnikau’s 16-year sentence is longer than the 13-year-and-7-month sentence given to Yaroslav Vasinskyi for more than 2,500 REvil attacks and over $700 million in ransom demands.","The indictment explains why public reporting and prosecutors gave different start dates for Ransom Cartel: Silnikau allegedly ran the operation under another name from May 2021 before renaming it Ransom Cartel in late 2021.","The sentencing announcement leaves notable gaps because it does not list any restitution or forfeiture amount and does not say whether Silnikau pleaded guilty or was convicted at trial.","The article distinguishes Ransom Cartel from a simple REvil rebrand, noting that Unit 42 found the operators had original REvil source code but apparently lacked REvil’s obfuscation engine, while neither the indictment nor sentencing release mentions REvil.","Silnikau’s case is not fully resolved because he still faces a separate New Jersey prosecution tied to the Angler Exploit Kit scheme, and two men charged alongside him there remain at large."],"referencedReports":[{"title":"Ransom Cartel Ransomware","url":"https://unit42.paloaltonetworks.com/ransom-cartel-ransomware/","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42's 2022 analysis for findings about Ransom Cartel possessing original REvil source code but apparently lacking REvil's obfuscation engine.","category":"research","primary":false}],"body":"\u003cp\u003eA federal judge in Alexandria, Virginia, sentenced Maksim Silnikau to 16 years in prison on August 5 for creating and running Ransom Cartel, a ransomware-as-a-service operation he launched in 2021. The Justice Department said Ransom Cartel conspirators attacked at least 18 companies between 2021 and 2023, including firms in California, New York, Nebraska, and other countries. Silnikau is a 40-year-old Belarusian national who used the handles “J.P. Morgan,” “lansky,” and “xxx.”\u003c/p\u003e\n\n\u003cp\u003eThe article says Silnikau did not carry out most of the intrusions himself, but built the business around them. He developed the locking software, bought stolen credentials from initial access brokers, operated a hidden panel for affiliates, ran a ratings system, and pushed ransom payments through cryptocurrency mixers. Prosecutors said his July 2023 arrest stalled Ransom Cartel’s growth, and Poland extradited him to the United States in August 2024.\u003c/p\u003e\n\n\u003cp\u003eThe indictment says Silnikau ran the operation under another name from May 2021, renamed it “Ransom Cartel” in late 2021, and tried to publicize it on security news sites. Unit 42 previously found that Ransom Cartel operators had original REvil source code but apparently lacked REvil’s obfuscation engine, while neither the indictment nor sentencing release mentions REvil. Silnikau also faces a separate unresolved New Jersey case tied to the Angler Exploit Kit malvertising scheme, and two men charged alongside him there remain at large.\u003c/p\u003e\n"},{"n":7,"title":"CISA’s SASE Guidance Changes the TIC Compliance Calculus","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/cisas-sase-guidance-changes-the-tic-compliance-calculus","time":"07:01","priority":"MAY READ","score":58,"tldr":"CISA’s TIC 3.0 SASE guidance gives federal agencies more flexibility to move beyond centralized MTIPS gateways, but the article argues that compliance and zero trust still require strong TLS inspection to preserve payload-level visibility. Netskope positions its platform as a way to meet those visibility and logging requirements while handling modern encryption challenges.","briefOverview":"\u003cp\u003eCISA published guidance in June 2026 titled The Journey to Zero Trust: Using Secure Access Service Edge in a Modern TIC 3.0 Solution, which the article describes as a clear federal signal that the centralized MTIPS gateway model has run its course. The article says TIC 3.0 implements the policy shift begun by OMB M-19-26, which removed the mandatory routing requirement from TIC 2.0. Under TIC 3.0, agencies can distribute security enforcement across a cloud-delivered SASE architecture, but they must maintain visibility and provide telemetry to CISA’s Comprehensive Log Aggregation Warehouse at specified logging levels.\u003c/p\u003e\n\n\u003cp\u003eThe article focuses heavily on CISA’s statement that TLS/SSL break and inspect is “no longer a universally recommended solution,” while noting that certificate pinning, TLS 1.3, QUIC, and post-quantum cryptography cipher suites create real engineering complexity. It argues that the debate should be about how to inspect encrypted traffic rather than whether to inspect it, because skipping decryption removes visibility into what traffic contains. The article says that without decryption, agencies may see destinations and bytes transferred but miss details such as sensitive data uploads, AI prompts containing PII, API activity, application instances, identities, and specific user actions.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Netskope’s NewEdge architecture and Netskope One as ways to support inline inspection while addressing performance, privacy, protocol, and certificate-pinning challenges. It says NewEdge decrypts traffic once and runs policy engines in parallel, supports configurable bypass policies, handles TLS 1.3, redirects QUIC to inspectable HTTPS, and allows privacy-sensitive categories such as banking or healthcare to be exempted. The article also says Netskope can feed CISA’s CLAW at required logging levels, integrate with CISA’s Protective DNS service, and use Netskope Cloud Risk Exchange and Cloud Threat Exchange for bidirectional sharing with partner security tools.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA’s June 2026 guidance explicitly names Secure Access Service Edge as a compliant path for implementing TIC 3.0, moving agencies away from a mandatory centralized gateway model.","TIC 3.0 focuses on what security controls accomplish rather than where they reside, while still requiring agencies to maintain visibility and feed telemetry to CISA’s Comprehensive Log Aggregation Warehouse at specified logging levels.","The article argues that treating TLS/SSL break and inspect as no longer universally recommended risks eliminating visibility into traffic contents, including sensitive data movement, AI prompts, API activity, and application actions.","Without TLS decryption, agencies may only see source, destination, and bytes transferred, while decryption enables Layer-7 context such as application, activity, identity, and context.","Netskope says its NewEdge architecture decrypts traffic once, runs policy engines in parallel, supports configurable bypasses for certificate-pinned applications, redirects QUIC to inspectable HTTPS, and can feed CISA’s CLAW logging requirements."],"insights":["The article frames CISA’s shift from prescribed gateway locations to required security outcomes as increasing architectural flexibility while keeping agencies accountable for visibility and telemetry quality.","The guidance’s softer stance on TLS inspection creates a practical tension: agencies may be compliant with a SASE architecture yet still lack the payload-level detail the article says TIC 3.0 visibility is meant to achieve.","The article argues that encrypted-traffic analysis using AI or machine learning can indicate suspicious behavior, but it cannot reveal whether sensitive data, AI prompts, or unauthorized application actions actually occurred inside the encrypted session.","Certificate-pinned applications, TLS 1.3, QUIC, and post-quantum cryptography are presented not as reasons to abandon inspection, but as engineering problems that must be handled with selective bypasses, inline proxying, protocol redirection, and compensating endpoint coverage.","The article highlights that trusted cloud services such as Microsoft 365 can become blind spots when agencies bypass decryption for trusted domains, because attackers can use those services for malware hosting and command-and-control."],"referencedReports":[{"title":"The Journey to Zero Trust: Using Secure Access Service Edge in a Modern TIC 3.0 Solution","url":"https://www.cisa.gov/resources-tools/resources/using-sase-modern-tic-30-solution","publisher":"CISA","context":"The article cites CISA’s June 2026 guidance as the clearest federal signal that SASE is a compliant path for TIC 3.0 and as the foundation for its discussion of TLS inspection and telemetry requirements.","category":"guide","primary":true}],"body":"\u003cp\u003eCISA published guidance in June 2026 titled The Journey to Zero Trust: Using Secure Access Service Edge in a Modern TIC 3.0 Solution, which the article describes as a clear federal signal that the centralized MTIPS gateway model has run its course. The article says TIC 3.0 implements the policy shift begun by OMB M-19-26, which removed the mandatory routing requirement from TIC 2.0. Under TIC 3.0, agencies can distribute security enforcement across a cloud-delivered SASE architecture, but they must maintain visibility and provide telemetry to CISA’s Comprehensive Log Aggregation Warehouse at specified logging levels.\u003c/p\u003e\n\n\u003cp\u003eThe article focuses heavily on CISA’s statement that TLS/SSL break and inspect is “no longer a universally recommended solution,” while noting that certificate pinning, TLS 1.3, QUIC, and post-quantum cryptography cipher suites create real engineering complexity. It argues that the debate should be about how to inspect encrypted traffic rather than whether to inspect it, because skipping decryption removes visibility into what traffic contains. The article says that without decryption, agencies may see destinations and bytes transferred but miss details such as sensitive data uploads, AI prompts containing PII, API activity, application instances, identities, and specific user actions.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Netskope’s NewEdge architecture and Netskope One as ways to support inline inspection while addressing performance, privacy, protocol, and certificate-pinning challenges. It says NewEdge decrypts traffic once and runs policy engines in parallel, supports configurable bypass policies, handles TLS 1.3, redirects QUIC to inspectable HTTPS, and allows privacy-sensitive categories such as banking or healthcare to be exempted. The article also says Netskope can feed CISA’s CLAW at required logging levels, integrate with CISA’s Protective DNS service, and use Netskope Cloud Risk Exchange and Cloud Threat Exchange for bidirectional sharing with partner security tools.\u003c/p\u003e\n"}]</script>
