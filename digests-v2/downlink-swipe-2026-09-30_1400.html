<script type="application/json" id="dl-articles">[{"n":8,"title":"Cisco Warns of Attackers Exploiting Critical Authentication Bypass in SD-WAN Manager","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisco-warns-of-attackers-exploiting.html","time":"15:24","priority":"MUST READ","score":98,"tldr":"Cisco warns that attackers are actively exploiting CVE-2026-76504, a critical unauthenticated authentication-bypass flaw in Catalyst SD-WAN Manager that can grant administrator-level API access. Organizations should immediately upgrade to a fixed release and restrict management API exposure to trusted networks.","briefOverview":"\u003cp\u003eCisco said attackers are actively exploiting CVE-2026-76504, a critical flaw in Cisco Catalyst SD-WAN Manager, which organizations use to manage Cisco SD-WAN networks. The issue has a CVSS score of 9.8 and can let a remote attacker without credentials use the Manager API as the administrator. Cisco said the flaw affects SD-WAN Manager regardless of configuration and that there is no workaround. Systems exposed to the internet are at risk because the default administrator role can perform all device operations.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability stems from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for an API endpoint. Cisco released fixes for supported release trains and advises customers to restrict access from unsecured networks until they upgrade. Administrators can look for suspicious session-login request entries in two specified log files, particularly those from unknown IP addresses or involving accounts beginning with \u0026ldquo;viptela-reserved-\u0026rdquo;. Cisco notes that such entries can also occur during normal operation, and customers that suspect compromise can open a Severity 3 TAC case after collecting an admin-tech file.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco reported active exploitation of CVE-2026-76504, a critical authentication-bypass flaw in Cisco Catalyst SD-WAN Manager with a CVSS score of 9.8.","The flaw can allow an unauthenticated remote attacker to use the SD-WAN Manager API as the administrator because of improper URI encoding handling in HTTP requests.","Cisco released fixed versions for affected SD-WAN Manager release trains and said there is no workaround for the issue.","Until systems are upgraded, Cisco recommends restricting SD-WAN Manager access from unsecured networks and allowing internet access only from known, trusted hosts.","Cisco advises reviewing specific log files for j_security_check requests from unknown or unauthorized IP addresses and opening a Severity 3 TAC case if compromise is suspected."],"insights":["Organizations that applied Cisco’s May or June 2026 SD-WAN security updates may still be vulnerable, because the first fixed releases for CVE-2026-76504 are newer.","Detection requires careful review because any character in the login request path can be URI-encoded, and matching log entries can also result from normal activity.","Cisco does not state whether installing the update removes an attacker who already has access, while earlier SD-WAN advisories said an update alone would not resolve a confirmed compromise.","Cisco SD-WAN Cloud customers on release 20.15.605 require no action, and Cisco Catalyst SD-WAN Cloud Hosted environments already have the recommended access-control mitigation in place."],"referencedReports":[{"title":"Cisco Catalyst SD-WAN Manager Web UI Authentication Bypass Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU","publisher":"cisco","context":"Cisco's advisory reports active exploitation of CVE-2026-76504 and provides affected releases, mitigations, and detection guidance.","category":"advisory","primary":true},{"title":"Cisco Catalyst SD-WAN Hardening Guide","url":"https://sec.cloudapps.cisco.com/security/center/resources/Cisco-Catalyst-SD-WAN-HardeningGuide","publisher":"cisco","context":"The article cites Cisco's hardening guide for its recommendation not to expose SD-WAN Manager administrative interfaces directly to the internet.","category":"guide","primary":false}],"body":"\u003cp\u003eCisco said attackers are actively exploiting CVE-2026-76504, a critical flaw in Cisco Catalyst SD-WAN Manager, which organizations use to manage Cisco SD-WAN networks. The issue has a CVSS score of 9.8 and can let a remote attacker without credentials use the Manager API as the administrator. Cisco said the flaw affects SD-WAN Manager regardless of configuration and that there is no workaround. Systems exposed to the internet are at risk because the default administrator role can perform all device operations.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability stems from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for an API endpoint. Cisco released fixes for supported release trains and advises customers to restrict access from unsecured networks until they upgrade. Administrators can look for suspicious session-login request entries in two specified log files, particularly those from unknown IP addresses or involving accounts beginning with \u0026ldquo;viptela-reserved-\u0026rdquo;. Cisco notes that such entries can also occur during normal operation, and customers that suspect compromise can open a Severity 3 TAC case after collecting an admin-tech file.\u003c/p\u003e\n"},{"n":1,"title":"Cisco warns of new SD-WAN zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-new-sd-wan-authentication-bypass-zero-day-exploited-in-attacks/","time":"14:46","priority":"MUST READ","score":97,"tldr":"Cisco is urging customers to immediately patch Catalyst SD-WAN Manager for CVE-2026-76504, a critical authentication-bypass zero-day actively exploited to grant remote, unauthenticated attackers administrator access.","briefOverview":"\u003cp\u003eCisco released security updates for CVE-2026-76504, a critical zero-day in Catalyst SD-WAN Manager that it says attackers are actively exploiting. The software, formerly called SD-WAN vManage, lets administrators monitor and manage up to 6,000 SD-WAN devices from a central dashboard. Cisco said the flaw affects all deployments regardless of configuration and urged customers to upgrade to a fixed release.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for a specific API endpoint. An unauthenticated remote attacker can exploit it to gain administrator privileges on a vulnerable system. Cisco said investigators should review serviceproxy-access.log and vmanage-server.log for j_security_check entries from unknown or unauthorized IP addresses, including requests using %6a as the encoded form of \u0026ldquo;j\u0026rdquo;.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-76504 is the fifth Cisco SD-WAN zero-day reported as actively exploited in 2026. Cisco had previously disclosed exploited SD-WAN flaws in February, May, and June, including flaws attackers used to obtain administrator or root privileges. Since November 2021, CISA has listed 90 Cisco vulnerabilities as exploited in the wild, including four affecting Catalyst SD-WAN Manager.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco released fixes for CVE-2026-76504, a critical Catalyst SD-WAN Manager flaw that the company says is being actively exploited.","The flaw lets an unauthenticated remote attacker gain administrator privileges by sending a crafted HTTP request that bypasses an authentication rule through improper URI encoding.","Cisco said all Catalyst SD-WAN Manager deployments are affected regardless of configuration and recommends upgrading to a fixed software release.","Cisco advised administrators to investigate serviceproxy-access.log and vmanage-server.log for j_security_check entries from unknown or unauthorized IP addresses, including requests using %6a for the letter \"j\".","CVE-2026-76504 is the fifth Cisco SD-WAN zero-day reported as actively exploited in 2026."],"insights":["Because CVE-2026-76504 affects all deployments regardless of configuration, the article indicates that changing system settings is not presented as a workaround; upgrading to a fixed release is Cisco’s recommended remediation.","Cisco provided a concrete investigation clue: malicious requests have used \"%6a,\" the URI-encoded form of \"j,\" and defenders should look for related j_security_check entries from unfamiliar IP addresses in two specified log files.","Catalyst SD-WAN Manager can centrally monitor and manage up to 6,000 SD-WAN devices, so administrator-level access to one manager could affect a large managed network environment.","This is Cisco’s fifth SD-WAN zero-day reported as actively exploited in 2026, following flaws disclosed in February, May, and June."],"referencedReports":[{"title":"Cisco Security Advisory: Catalyst SD-WAN Manager Authentication Bypass Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU","publisher":"cisco","context":"The article cites Cisco’s advisory warning that CVE-2026-76504 is under active exploitation and urging customers to upgrade.","category":"advisory","primary":true},{"title":"CISA Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search=\u0026field_date_added_wrapper=all\u0026field_cve=\u0026sort_by=field_date_added\u0026items_per_page=All\u0026url=\u0026f%5B0%5D=vendor_project%3A801","publisher":"cybersecurity-and-infrastructure-security-agency","context":"The article references CISA’s catalog to note that 90 Cisco vulnerabilities have been listed as exploited in the wild since November 2021.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco released security updates for CVE-2026-76504, a critical zero-day in Catalyst SD-WAN Manager that it says attackers are actively exploiting. The software, formerly called SD-WAN vManage, lets administrators monitor and manage up to 6,000 SD-WAN devices from a central dashboard. Cisco said the flaw affects all deployments regardless of configuration and urged customers to upgrade to a fixed release.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for a specific API endpoint. An unauthenticated remote attacker can exploit it to gain administrator privileges on a vulnerable system. Cisco said investigators should review serviceproxy-access.log and vmanage-server.log for j_security_check entries from unknown or unauthorized IP addresses, including requests using %6a as the encoded form of \u0026ldquo;j\u0026rdquo;.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-76504 is the fifth Cisco SD-WAN zero-day reported as actively exploited in 2026. Cisco had previously disclosed exploited SD-WAN flaws in February, May, and June, including flaws attackers used to obtain administrator or root privileges. Since November 2021, CISA has listed 90 Cisco vulnerabilities as exploited in the wild, including four affecting Catalyst SD-WAN Manager.\u003c/p\u003e\n"},{"n":9,"title":"Attackers Exploit Zimbra Flaw to Deploy Web Shells and Harvest Authentication Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-exploit-zimbra-flaw-to-deploy.html","time":"16:46","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting the patched Zimbra CVE-2026-73570 command-injection flaw to install web shells, steal mailbox and authentication data, and establish persistent remote access on exposed servers. Organizations should urgently update to Zimbra 10.1.20 or mitigate by removing zimbra-snmp, disabling SNMP notifications, restricting access, and rotating Zimbra secrets.","briefOverview":"\u003cp\u003eThreat actors exploited CVE-2026-73570, a now-patched unauthenticated command-injection flaw in Zimbra Collaboration Suite that can permit remote code execution when SNMP notifications are enabled and the optional zimbra-snmp package is installed. The flaw can be triggered through a specially crafted SMTP request against exposed Zimbra servers without authentication or user interaction. Zimbra fixed the issue in version 10.1.20 in July 2026, and CISA later added it to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft observed attackers installing JSP web shells and reverse shells, escalating privileges, maintaining persistent access, and collecting email, mailbox, and authentication data from affected organizations across multiple regions and industries. The activity included extracting centralized Zimbra secrets, querying LDAP for high-value authentication attributes, using Zimbra SSH credentials and rsync to move between trusted cluster nodes, and staging collected data in archives. In one case, attackers attempted to use AzCopy and an Azure Blob Storage URL to transfer archived mailbox-backup data, though evidence did not confirm that the transfer completed. Organizations are advised to patch immediately or remove zimbra-snmp, disable SNMP notifications, limit SNMP and SMTP access, rotate Zimbra secrets, and check for web-shell persistence.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers exploited CVE-2026-73570, an unauthenticated command-injection flaw in Zimbra Collaboration Suite that can enable remote code execution when SNMP notifications are enabled and zimbra-snmp is installed.","Zimbra patched the flaw in version 10.1.20, released in July 2026, and CISA later added it to its Known Exploited Vulnerabilities catalog.","Microsoft observed attackers deploying JSP web shells and reverse shells, escalating privileges, establishing persistence, and accessing email, authentication secrets, and mailbox data on compromised servers.","The attackers used Zimbra configuration data and LDAP queries to obtain high-value authentication attributes, and used Zimbra SSH credentials and rsync to move web shells and scripts between trusted cluster nodes.","Organizations are advised to apply updates immediately; if patching is not possible, they should remove zimbra-snmp, disable SNMP notifications, restrict SNMP and SMTP access, rotate Zimbra secrets, and scan for persistent web shells."],"insights":["Microsoft identified probing activity between July 28 and August 7, 2026, before the flaw was publicly disclosed on August 13, showing that attackers were testing the command-injection path soon after the patch release.","Attackers sometimes temporarily made a public directory writable to place a web shell and then restored its permissions, which can hide evidence from simple permission reviews.","Rather than targeting individual mailbox passwords, the activity targeted Zimbra’s centralized configuration and authentication secrets, including keys used for pre-authentication, authentication tokens, and two-factor authentication.","One observed actor used Zimbra’s existing SSH identity and rsync to transfer web shells and helper scripts across trusted nodes in a Zimbra cluster, extending the compromise beyond an initially affected server.","In one case, attackers staged mailbox backup data locally and attempted to send it to an Azure Blob Storage location using AzCopy, although the available evidence did not confirm that the transfer succeeded."],"referencedReports":[{"title":"Unauthenticated command injection on internet-facing mail servers: Tracking CVE-2026-73570","url":"https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/","publisher":"microsoft","context":"The article relies on Microsoft Security Research findings describing active exploitation, post-compromise activity, persistence, credential theft, and attempted data exfiltration.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors exploited CVE-2026-73570, a now-patched unauthenticated command-injection flaw in Zimbra Collaboration Suite that can permit remote code execution when SNMP notifications are enabled and the optional zimbra-snmp package is installed. The flaw can be triggered through a specially crafted SMTP request against exposed Zimbra servers without authentication or user interaction. Zimbra fixed the issue in version 10.1.20 in July 2026, and CISA later added it to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft observed attackers installing JSP web shells and reverse shells, escalating privileges, maintaining persistent access, and collecting email, mailbox, and authentication data from affected organizations across multiple regions and industries. The activity included extracting centralized Zimbra secrets, querying LDAP for high-value authentication attributes, using Zimbra SSH credentials and rsync to move between trusted cluster nodes, and staging collected data in archives. In one case, attackers attempted to use AzCopy and an Azure Blob Storage URL to transfer archived mailbox-backup data, though evidence did not confirm that the transfer completed. Organizations are advised to patch immediately or remove zimbra-snmp, disable SNMP notifications, limit SNMP and SMTP access, rotate Zimbra secrets, and check for web-shell persistence.\u003c/p\u003e\n"},{"n":2,"title":"CISA warns of critical pre-auth RCE flaw in MikroTik RouterOS","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-critical-pre-auth-rce-flaw-in-mikrotik-routeros/","time":"15:49","priority":"SHOULD READ","score":88,"tldr":"CISA warns that CVE-2026-84411 is a critical pre-authentication flaw in MikroTik RouterOS web management that can let an unauthenticated attacker execute code as root or crash affected routers with one crafted request. Organizations should update RouterOS and ensure management interfaces are not exposed to the internet.","briefOverview":"\u003cp\u003eCISA has warned of CVE-2026-84411, a critical flaw in MikroTik RouterOS web-management HTTP request handling. The issue is an integer underflow that can be reached before authentication. According to CISA, one crafted request can allow an unauthenticated network attacker to run code with root privileges or cause a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eCISA said RouterOS versions below 7.24 are affected, but the article notes that MikroTik reportedly recommends updating to version 7.23 or later, leaving uncertainty about the exact fixed version. The latest stable release cited is RouterOS 7.24.4, while the latest long-term release is 7.23.7. CISA said it is not aware of active exploitation, but advised keeping control systems off the public internet, isolating control networks, and using updated VPNs for remote access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that CVE-2026-84411 is a critical pre-authentication integer-underflow flaw in MikroTik RouterOS web-management HTTP request handling.","A single crafted request can allow an unauthenticated network attacker to execute code with root privileges or cause a denial of service.","CISA said RouterOS versions below 7.24 are affected, while also noting that MikroTik recommends updating to version 7.23 or later, creating ambiguity about the affected versions.","CISA said it has no knowledge of active exploitation of CVE-2026-84411, but recommended keeping control systems inaccessible from the internet and using firewalls and updated VPNs for remote access.","The latest stable RouterOS release cited in the article is 7.24.4, and the latest long-term release is 7.23.7."],"insights":["The flaw is reachable before login, so an attacker would not need valid RouterOS credentials to trigger it.","The article identifies inconsistent version guidance: CISA says versions below 7.24 are affected, while MikroTik reportedly recommends version 7.23 or later as mitigation.","Although CISA has not identified active exploitation of this flaw, the article notes that MikroTik vulnerabilities are frequently targeted by hackers and botnet malware."],"referencedReports":[{"title":"ICSA-26-272-06","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-06","publisher":"cisa","context":"The article cites CISA's advisory as the source describing the pre-authentication RouterOS flaw and its potential for root-level code execution or denial of service.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has warned of CVE-2026-84411, a critical flaw in MikroTik RouterOS web-management HTTP request handling. The issue is an integer underflow that can be reached before authentication. According to CISA, one crafted request can allow an unauthenticated network attacker to run code with root privileges or cause a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eCISA said RouterOS versions below 7.24 are affected, but the article notes that MikroTik reportedly recommends updating to version 7.23 or later, leaving uncertainty about the exact fixed version. The latest stable release cited is RouterOS 7.24.4, while the latest long-term release is 7.23.7. CISA said it is not aware of active exploitation, but advised keeping control systems off the public internet, isolating control networks, and using updated VPNs for remote access.\u003c/p\u003e\n"},{"n":5,"title":"Opsec Fail Leaks a Rare Look Inside a Media-Buy-Powered Scam Operation","source":"blog.confiant.com","sourceColorIdx":8,"link":"https://blog.confiant.com/p/opsec-fail-leaks-a-rare-look-inside","time":"14:57","priority":"SHOULD READ","score":82,"tldr":"A leaked backend backup exposed a South Africa-focused investment-scam operation that used Keitaro cloaking, paid-ad attribution, fake news sites, and automated lead delivery to a CRM and Telegram. The leak reveals a likely shared scam toolkit operating across multiple domains and geographies, along with exposed infrastructure and bot credentials.","briefOverview":"\u003cp\u003eA leaked ZIP backup at the root of boroxior.pro exposed the backend of a South Africa-targeted investment-scam operation. The backup contained eight nearly identical scam pages impersonating News24, SABC News, Bloomberg, SMWX, and the South African government, using recognizable figures including Elon Musk, Cyril Ramaphosa, and Johann Rupert to promote fabricated investment opportunities. The pages used fake interviews, testimonials, profit screenshots, urgency messages, and dynamically generated dates to make the offers appear current. The article identifies boroxior.pro, lonvexo.xyz, and a CRM server at 62.60.226.45 among the operation’s infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe landers used Keitaro to separate likely victims from bots, ad reviewers, VPN users, and visitors outside the intended geography, showing decoy content to some visitors and scam pages to others. Their forms collected names, email addresses, phone numbers, IP addresses, and advertising attribution data, then sent leads to a CRM, Keitaro conversion tracking, advertising pixels, and a Telegram chat. The exposed code included a hardcoded Telegram bot token and chat ID, which the article says could allow control of the bot and access to incoming lead messages. A GitHub-hosted asset associated with the toolkit received more than 3.8 million jsDelivr requests over a year, and URLScan matches suggested the toolkit was shared across scam brands targeting audiences in Europe as well as South Africa.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A leaked ZIP backup at the root of boroxior.pro exposed eight branded investment-scam pages targeting South Africa and impersonating outlets and institutions including News24, SABC News, Bloomberg, SMWX, and the South African government.","The scam pages used Keitaro at lonvexo.xyz to decide whether visitors received a harmless decoy page or the scam content, based on factors such as location and whether the visitor appeared to be a bot, ad reviewer, or VPN user.","The lead forms collected names, email addresses, phone numbers, IP addresses, and advertising campaign data, then sent records to a CRM endpoint, Keitaro, an ad attribution pixel, and a private Telegram chat.","The exposed send.php script contained a Telegram bot token and chat ID, and the article states that possession of the token could permit control of the bot and access to incoming lead messages.","A GitHub-hosted flag-sprite asset associated with the toolkit received more than 3.8 million jsDelivr requests over a year, while URLScan matches linked the shared toolkit to scam pages targeting European audiences."],"insights":["The kit used a 14-day per-IP block list to show repeat visitors a fake success page, reducing opportunities for repeated inspection of the scam flow.","Its duplicate-phone logic was intended to prevent the operator from paying twice for the same advertising conversion, but the article found that the function was defined without being called in this build.","Dynamic date generation and translations allowed fake articles to appear newly published in more than 30 languages, regardless of when or where a visitor viewed them.","Although the GitHub-hosted flag image produced 3.8 million requests through jsDelivr, the article cautions that this measures activity for the wider toolkit rather than proving all traffic belonged to the boroxior operator."],"referencedReports":[{"title":"Inside Keitaro Abuse: A Persistent Stream of AI-Driven Investment Scams","url":"https://www.infoblox.com/blog/threat-intelligence/inside-keitaro-abuse-a-persistent-stream-of-ai-driven-investment-scams/","publisher":"infoblox","context":"The article references this three-part collaboration with Infoblox Threat Researchers as prior research on Keitaro abuse in malicious traffic-distribution systems and cloaked investment scams.","category":"research","primary":false}],"body":"\u003cp\u003eA leaked ZIP backup at the root of boroxior.pro exposed the backend of a South Africa-targeted investment-scam operation. The backup contained eight nearly identical scam pages impersonating News24, SABC News, Bloomberg, SMWX, and the South African government, using recognizable figures including Elon Musk, Cyril Ramaphosa, and Johann Rupert to promote fabricated investment opportunities. The pages used fake interviews, testimonials, profit screenshots, urgency messages, and dynamically generated dates to make the offers appear current. The article identifies boroxior.pro, lonvexo.xyz, and a CRM server at 62.60.226.45 among the operation’s infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe landers used Keitaro to separate likely victims from bots, ad reviewers, VPN users, and visitors outside the intended geography, showing decoy content to some visitors and scam pages to others. Their forms collected names, email addresses, phone numbers, IP addresses, and advertising attribution data, then sent leads to a CRM, Keitaro conversion tracking, advertising pixels, and a Telegram chat. The exposed code included a hardcoded Telegram bot token and chat ID, which the article says could allow control of the bot and access to incoming lead messages. A GitHub-hosted asset associated with the toolkit received more than 3.8 million jsDelivr requests over a year, and URLScan matches suggested the toolkit was shared across scam brands targeting audiences in Europe as well as South Africa.\u003c/p\u003e\n"},{"n":6,"title":"Attackers Abuse ChatGPT Custom GPTs to Deliver RAT via ClickFix Lures","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-abuse-chatgpt-custom-gpts-to.html","time":"15:00","priority":"SHOULD READ","score":82,"tldr":"Attackers are using malicious ChatGPT Custom GPTs promoted in Google search results to redirect users to ClickFix pages that trick them into running PowerShell and installing a feature-rich RAT. The campaign has infected at least 40 users and uses Google Sites, DLL sideloading, encrypted WAV payloads, and DNS-over-HTTPS to evade detection.","briefOverview":"\u003cp\u003eThreat actors abused ChatGPT Custom GPTs, promoted through sponsored Google search results, to pose as a service named “Plus 5.6” and redirect users to malicious Google Sites pages. The GPTs displayed a service-availability message urging users to use a backup domain, where they encountered a fake Cloudflare CAPTCHA. The ClickFix lure instructed victims to copy and run a malicious PowerShell command, which downloaded the \u003ccode\u003eISOSimple.msi\u003c/code\u003e installer. Huntress said at least 40 users were infected.\u003c/p\u003e\n\n\u003cp\u003eThe installer used Canon-signed \u003ccode\u003eCOTFileReadApp.exe\u003c/code\u003e to sideload a rogue \u003ccode\u003eceiinfolog.dll\u003c/code\u003e, which then loaded an unsigned DLL called \u003ccode\u003erdCore.dll\u003c/code\u003e. That DLL extracted an encrypted loader hidden in a WAV file, and the loader bypassed AMSI, unhooked \u003ccode\u003entdll.dll\u003c/code\u003e, and performed checks for virtual-machine environments before unpacking the RAT and persistence script from \u003ccode\u003emonitor.raw\u003c/code\u003e. The RAT can inventory security software and system details, access cameras and audio, run remote desktop sessions, search files, launch browsers, and execute additional programs and scripts. It uses DNS-over-HTTPS through Cloudflare, Google, and Quad9 to locate its command-and-control server, concealing lookups within ordinary HTTPS traffic.\u003c/p\u003e\n\n\u003cp\u003eThe campaign shows how attackers can combine trusted services including ChatGPT, Google Sites, and Cloudflare-themed verification pages to make social-engineering lures appear credible. The article also describes other ClickFix campaigns using impersonated AI installers, compromised websites, EtherHiding, and fake CAPTCHA prompts to deliver stealers, remote-access tools, and banking-focused malware. Some related ClearFake activity targeted Ukrainian government systems and was attributed to the Russia-aligned UAT-10820 cluster.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors created ChatGPT Custom GPTs named \"Plus 5.6\" that directed users to Google Sites links under the guise of a service availability notice.","The Google Sites pages displayed fake Cloudflare CAPTCHA checks that used ClickFix prompts to trick victims into copying and running a malicious PowerShell command.","The PowerShell command downloaded an MSI installer that abused Canon-signed COTFileReadApp.exe to sideload altered DLLs and ultimately launch a RAT payload.","Huntress reported that at least 40 users were infected in the campaign, and the RAT can collect system information, access cameras and microphones, search files, run remote desktop sessions, and execute additional payloads.","The RAT uses DNS-over-HTTPS through Cloudflare, Google, and Quad9 resolvers to locate its command-and-control server while blending its requests into normal HTTPS traffic."],"insights":["The campaign turns multiple trusted services into a single convincing path, using Google search advertising, ChatGPT Custom GPTs, Google Sites, and a fake Cloudflare check to make the malicious download process appear legitimate.","The malicious installer relies on a Canon-signed program and altered Canon DLL components, showing that legitimate signed software can be used to help load harmful code.","The RAT hides its command-server lookups inside encrypted web traffic sent to major DNS providers, meaning those lookups may not appear in local DNS logs.","The payload is concealed in a WAV audio file and is unpacked only after checks intended to detect virtual machines and after disabling certain security-monitoring mechanisms."],"referencedReports":[{"title":"ChatGPT Custom GPTs ClickFix RAT","url":"https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat","publisher":"huntress","context":"The article relies on Huntress's observation and analysis of the malicious Custom GPT campaign.","category":"research","primary":true},{"title":"Fake AI Installer Campaign Delivering an In-Memory Stealer via the ClickFix Technique","url":"https://blog.intellibron.io/fake-ai-installer-campaign-delivering-an-in-memory-stealer-via-the-clickfix-technique/","publisher":"intellibron","context":"The article cites this analysis of Google Sites pages impersonating OpenAI Codex and Anthropic Claude to distribute an in-memory stealer.","category":"research","primary":false},{"title":"ClearFake WebDAV Infection Chain","url":"https://blog.talosintelligence.com/clearfake-webdav-infection-chain/","publisher":"cisco talos","context":"The article references this analysis in describing ClearFake ClickFix activity targeting Ukrainian government systems and attributed to UAT-10820.","category":"research","primary":false},{"title":"Disposable Domains, Durable Hosting","url":"https://activesoc.blackhillsinfosec.com/blog/disposable-domains-durable-hosting/","publisher":"black hills information security","context":"The article cites this research on ClickFix delivery through malvertising, phishing emails, and a compromised retail website.","category":"research","primary":false},{"title":"EtherHiding: Fake CAPTCHAs, ClickFix Lures, Blockchain-Backed Payload Delivery","url":"https://censys.com/blog/etherhiding-fake-captchas-click-fix-lures-blockchain-backed-payload-delivery/","publisher":"censys","context":"The article references this analysis of a ClickFix campaign using EtherHiding and the Polygon blockchain for command-and-control discovery.","category":"research","primary":false},{"title":"EtherHiding Exposed: Deep Dive","url":"https://www.guidepointsecurity.com/blog/etherhiding-exposed-deep-dive/","publisher":"guidepoint security","context":"The article cites GuidePoint Security's finding that an EtherHiding backdoor was later used to deliver a banking trojan.","category":"research","primary":false}],"body":"\u003cp\u003eThreat actors abused ChatGPT Custom GPTs, promoted through sponsored Google search results, to pose as a service named “Plus 5.6” and redirect users to malicious Google Sites pages. The GPTs displayed a service-availability message urging users to use a backup domain, where they encountered a fake Cloudflare CAPTCHA. The ClickFix lure instructed victims to copy and run a malicious PowerShell command, which downloaded the \u003ccode\u003eISOSimple.msi\u003c/code\u003e installer. Huntress said at least 40 users were infected.\u003c/p\u003e\n\n\u003cp\u003eThe installer used Canon-signed \u003ccode\u003eCOTFileReadApp.exe\u003c/code\u003e to sideload a rogue \u003ccode\u003eceiinfolog.dll\u003c/code\u003e, which then loaded an unsigned DLL called \u003ccode\u003erdCore.dll\u003c/code\u003e. That DLL extracted an encrypted loader hidden in a WAV file, and the loader bypassed AMSI, unhooked \u003ccode\u003entdll.dll\u003c/code\u003e, and performed checks for virtual-machine environments before unpacking the RAT and persistence script from \u003ccode\u003emonitor.raw\u003c/code\u003e. The RAT can inventory security software and system details, access cameras and audio, run remote desktop sessions, search files, launch browsers, and execute additional programs and scripts. It uses DNS-over-HTTPS through Cloudflare, Google, and Quad9 to locate its command-and-control server, concealing lookups within ordinary HTTPS traffic.\u003c/p\u003e\n\n\u003cp\u003eThe campaign shows how attackers can combine trusted services including ChatGPT, Google Sites, and Cloudflare-themed verification pages to make social-engineering lures appear credible. The article also describes other ClickFix campaigns using impersonated AI installers, compromised websites, EtherHiding, and fake CAPTCHA prompts to deliver stealers, remote-access tools, and banking-focused malware. Some related ClearFake activity targeted Ukrainian government systems and was attributed to the Russia-aligned UAT-10820 cluster.\u003c/p\u003e\n"},{"n":7,"title":"Attackers Abuse MSP360 to Deploy ScreenConnect in Dual-RMM Phishing Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-abuse-msp360-to-deploy.html","time":"16:32","priority":"SHOULD READ","score":82,"tldr":"Microsoft warned that phishing campaigns are disguising legitimate MSP360 installers as meeting invites, PDFs, and software updates to establish persistent remote access. Attackers then deploy ConnectWise ScreenConnect as a second remote-management channel to transfer tools, collect data, and steal credentials while blending into normal IT activity.","briefOverview":"\u003cp\u003eMicrosoft warned of phishing campaigns that distribute a legitimate, digitally signed MSP360 Remote Monitoring and Management installer under deceptive names resembling meeting invitations, PDF readers, Zoom setup files, and government statements. The activity, detected in July 2026, uses the trusted remote-administration software to establish an initial foothold on affected devices. Microsoft has not attributed the campaign to a known threat actor or group.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, MSP360 is used to run PowerShell and install a ConnectWise ScreenConnect client, giving the attackers a second remote-access channel. The installer creates services and sign-in autorun entries for persistence, and it changes Windows Firewall settings to allow inbound UDP traffic for MSP360 on port 48678. This dual-RMM setup allows attackers to transfer and execute additional tools, collect information, and conduct credential-access activity while making their actions resemble normal IT administration.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft detected phishing campaigns in July 2026 that distributed a digitally signed MSP360 RMM installer disguised as meeting invitations, PDF-related files, software updates, and other social-engineering lures.","After MSP360 is installed, the attackers use it to run PowerShell and stealthily install ConnectWise ScreenConnect, creating a second remote-access channel on affected devices.","The MSP360 installer establishes persistence by registering Windows services and registry autorun entries, and it modifies the Windows Firewall to allow inbound UDP traffic on port 48678 for RMM.Agent.exe.","The dual use of MSP360 and ScreenConnect lets attackers transfer and run additional tools, collect information, and conduct credential-access operations while blending in with ordinary remote-administration activity.","Microsoft also observed separate July 2026 attacks that used Faronics Deploy Agent instead of MSP360 before downloading and installing ScreenConnect."],"insights":["The campaign relies on digitally signed, legitimate remote-management software, which helps malicious installers appear trustworthy while establishing access to affected devices.","Using both MSP360 and ScreenConnect gives the attackers redundant ways to remotely control a compromised computer, reducing their dependence on a single tool.","The installers are hosted across attacker-controlled infrastructure and legitimate services including Amazon S3, Cloudflare R2, Dropbox, GitLab, and Supabase.","MSP360 persistence includes Windows services, sign-in autorun entries, and a firewall rule permitting inbound UDP traffic on port 48678.","The separate use of Faronics Deploy Agent before installing ScreenConnect shows that the observed activity used more than one remote-management tool to gain initial access."],"referencedReports":[{"title":"Phishing Abuses RMM Tools for Persistent Access","url":"https://www.microsoft.com/en-us/security/blog/2026/09/29/phishing-abuses-rmm-tools-persistent-access/","publisher":"microsoft-security-research","context":"The article cites Microsoft Security Research's analysis of phishing campaigns that abuse MSP360 and other remote-management tools to establish persistent access.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft warned of phishing campaigns that distribute a legitimate, digitally signed MSP360 Remote Monitoring and Management installer under deceptive names resembling meeting invitations, PDF readers, Zoom setup files, and government statements. The activity, detected in July 2026, uses the trusted remote-administration software to establish an initial foothold on affected devices. Microsoft has not attributed the campaign to a known threat actor or group.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, MSP360 is used to run PowerShell and install a ConnectWise ScreenConnect client, giving the attackers a second remote-access channel. The installer creates services and sign-in autorun entries for persistence, and it changes Windows Firewall settings to allow inbound UDP traffic for MSP360 on port 48678. This dual-RMM setup allows attackers to transfer and execute additional tools, collect information, and conduct credential-access activity while making their actions resemble normal IT administration.\u003c/p\u003e\n"},{"n":11,"title":"2CLoader: A New Malware Loader Delivering Vidar and Remus","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/2cloader-new-malware-loader-delivering-vidar-and-remus","time":"14:28","priority":"SHOULD READ","score":78,"tldr":"Zscaler researchers identified 2CLoader, a highly configurable Windows malware loader that uses extensive anti-analysis and evasion techniques to deliver Vidar, Remus, and XWorm payloads. Its capabilities include indirect system calls, VM/debugger checks, API hooks, multiple persistence options, and in-memory payload execution.","briefOverview":"\u003cp\u003eZscaler ThreatLabz identified a new Windows malware loader called 2CLoader in August 2026. The loader has been used primarily to deliver the Vidar and Remus information stealers, as well as XWorm RAT. It is highly configurable and supports several ways to execute payloads and remain on an infected system. Stolen credentials from the delivered stealers can be used for subsequent attacks.\u003c/p\u003e\n\n\u003cp\u003e2CLoader includes multiple measures intended to evade analysis and endpoint security tools, including virtual-machine and debugger checks, indirect system calls, user-activity checks, and inline hooks in Windows API functions. Its encrypted payload and configuration are stored in a Portable Executable resource, with payload decryption using layered XOR operations, a key derived from the loader\u0026rsquo;s own code, and AES-GCM. It can establish persistence through Registry entries, the Startup folder, scheduled tasks, and Windows logon-related settings. The loader communicates with its command-and-control server using HTTP POST requests containing XOR-encrypted JSON messages that include system and configuration details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz identified 2CLoader in August 2026 as a Windows loader used to distribute Vidar, Remus, and XWorm RAT.","2CLoader uses anti-analysis and evasion features including virtual-machine and debugger checks, indirect system calls, user-activity checks, and inline hooks placed in Windows API functions.","The loader stores its configuration and encrypted payload in a PE resource, derives an AES-256 key from the SHA-256 hash of its first executable section, and decrypts the payload with AES-GCM.","2CLoader can establish persistence through Registry Run and RunOnce entries, the Startup folder, scheduled tasks, the Windows Load value, and the UserInitMprLogonScript value.","2CLoader sends XOR-encrypted JSON status messages to its command-and-control server through HTTP POST requests, beginning with a registration message containing host and configuration details."],"insights":["2CLoader derives its AES decryption key from the SHA-256 hash of its own executable code, so altering the loader can prevent successful payload decryption; its timing check can also deliberately corrupt that key material in fast emulated environments.","When configured, 2CLoader hooks network-reading functions to alter the last two octets of IPv4 addresses returned to the process, while separately spoofing usernames, computer names, volume serial numbers, registry values, and environment variables.","Its RunPE method writes the payload to a temporary file already marked for deletion, creates an executable image section from that file, maps it into a suspended process, redirects the process to the payload entry point, and resumes execution.","The loader supports several persistence methods at once, including Registry entries, Startup-folder copies, scheduled tasks, and logon-related Windows settings, because its persistence options can be combined.","2CLoader’s registration message sends the command-and-control server detailed host information including Windows version, process ID, elevation status, processor count, memory, locale, configuration flags, and the malware’s current path."],"referencedReports":[],"body":"\u003cp\u003eZscaler ThreatLabz identified a new Windows malware loader called 2CLoader in August 2026. The loader has been used primarily to deliver the Vidar and Remus information stealers, as well as XWorm RAT. It is highly configurable and supports several ways to execute payloads and remain on an infected system. Stolen credentials from the delivered stealers can be used for subsequent attacks.\u003c/p\u003e\n\n\u003cp\u003e2CLoader includes multiple measures intended to evade analysis and endpoint security tools, including virtual-machine and debugger checks, indirect system calls, user-activity checks, and inline hooks in Windows API functions. Its encrypted payload and configuration are stored in a Portable Executable resource, with payload decryption using layered XOR operations, a key derived from the loader\u0026rsquo;s own code, and AES-GCM. It can establish persistence through Registry entries, the Startup folder, scheduled tasks, and Windows logon-related settings. The loader communicates with its command-and-control server using HTTP POST requests containing XOR-encrypted JSON messages that include system and configuration details.\u003c/p\u003e\n"},{"n":3,"title":"AI's Third Wave: Coworkers Break the Security Model That Worked for Agents","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ais-third-wave-coworkers-break-the-security-model-that-worked-for-agents/","time":"14:01","priority":"MAY READ","score":38,"tldr":"Persistent AI coworkers will need dedicated, governable identities rather than borrowed human credentials, because standing access, access creep, and inaccurate audit logs make current agent access models unsafe. The sponsored article argues organizations should discover unregistered agents, assign owners and least-privilege scopes, rotate credentials, and automatically retire inactive or orphaned agents.","briefOverview":"\u003cp\u003eThe sponsored article argues that persistent AI coworkers represent a third wave of workplace AI, following chat systems focused on model output and task-scoped agents focused on actions. Unlike short-lived agents, these coworkers may operate independently over time and need continuing access to company data, cloud infrastructure, and workplace tools. The author says existing access models are inadequate because many AI systems act through OAuth grants, session handoffs, service accounts, or static tokens rather than identities designed specifically for agents.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that AI coworkers using human credentials can create inaccurate audit records, because actions may be logged as if the human performed them. Persistent agents can also accumulate permissions across projects, and separately reasonable permissions may combine into unintended reach. It recommends finding unregistered agents through authentication traffic, assigning each persistent agent its own identity and human owner, limiting access to its specific job, rotating credentials, and setting conditions for removing access when an owner leaves, a team disbands, or the agent remains idle.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes persistent AI coworkers as a third wave of work-related AI that requires access to company data, cloud infrastructure, and other workplace systems without relying on approval for every action.","The article says most deployed AI agent platforms currently use OAuth grants, in-session handoffs, service accounts, or static bearer tokens instead of identities created specifically for agents.","When an AI system uses a human’s granted permissions, audit logs commonly record the human as the actor, making it difficult to accurately attribute actions.","Persistent AI coworkers can accumulate access across projects, and several individually reasonable permissions can combine into broader access that no one intended to grant.","The article recommends finding unregistered agents through authentication activity, assigning each persistent agent its own identity and human owner, limiting its permissions, and defining when its access expires."],"insights":["The article highlights that Google demonstrated a Workspace agent called Chip in 2024 with its own account, role, permissions, and objectives, but says this model was never shipped while competitors instead released agents that inherit human authority.","The article notes that traditional consent screens assume a person approves a fixed set of permissions, whereas agents may discover and try to use new tools while working, making repeated approval requests both burdensome and risky.","When one person’s AI coworker passes work to another person’s AI coworker, the article says the action can still be executed using the credentials of the human who originally started the chain.","Microsoft, Okta, SailPoint, and CyberArk have introduced agent-identity capabilities, but the article says each offering primarily secures agents within that vendor’s own environment."],"referencedReports":[{"title":"Identity and Authority for Software Agents","url":"https://www.nist.gov/news-events/news/2026/02/new-concept-paper-identity-and-authority-software-agents","publisher":"nist","context":"The article cites NIST's new concept paper to note that identities purpose-built for AI agents are not yet the norm.","category":"research","primary":false}],"body":"\u003cp\u003eThe sponsored article argues that persistent AI coworkers represent a third wave of workplace AI, following chat systems focused on model output and task-scoped agents focused on actions. Unlike short-lived agents, these coworkers may operate independently over time and need continuing access to company data, cloud infrastructure, and workplace tools. The author says existing access models are inadequate because many AI systems act through OAuth grants, session handoffs, service accounts, or static tokens rather than identities designed specifically for agents.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that AI coworkers using human credentials can create inaccurate audit records, because actions may be logged as if the human performed them. Persistent agents can also accumulate permissions across projects, and separately reasonable permissions may combine into unintended reach. It recommends finding unregistered agents through authentication traffic, assigning each persistent agent its own identity and human owner, limiting access to its specific job, rotating credentials, and setting conditions for removing access when an owner leaves, a team disbands, or the agent remains idle.\u003c/p\u003e\n"},{"n":10,"title":"Why a global financial company replaced three data sources with one","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/why-a-global-financial-company-replaced-three-data-sources-with-one/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=why-a-global-financial-company-replaced-three-data-sources-with-one","time":"15:28","priority":"MAY READ","score":28,"tldr":"Silent Push says its unified API consolidates actively resolved DNS, WHOIS, and web-scan data, allowing a global fintech to replace three separate data integrations with one for infrastructure risk analysis.","briefOverview":"\u003cp\u003eA Security Engineer at a global fintech was building an internal graph to map risk dynamically across infrastructure. The effort required external data that could be ingested through an API and combined with internal signals. Previously, obtaining a complete view of an indicator required separate DNS, WHOIS, and web-scan sources, creating manual correlation work and multiple API integrations.\u003c/p\u003e\n\n\u003cp\u003eSilent Push says it consolidated those datasets into one platform and API, allowing the team to replace three integrations with one. The platform actively resolves domains and IPs collected from zone files and certificate transparency logs each day, rather than relying only on DNS resolutions created by user traffic. It also continuously indexes registration changes, hosting patterns, SSL certificates, favicon hashes, HTML content, and more than 150 additional metadata attributes, linking WHOIS records, scan fingerprints, and DNS history to new domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A security engineer at a global fintech was building an internal graph to map risk dynamically across the company’s infrastructure using external data combined with internal signals.","The team previously had to query separate DNS, WHOIS, and web-scan sources, each with different formats, access methods, and data gaps.","Silent Push provides DNS, WHOIS, and web-scan data through one API, replacing three separate integrations for the analyst’s team.","Silent Push says it collects domains and IP addresses from zone files and certificate transparency logs, then actively resolves the full dataset daily.","The platform continuously indexes registration changes, hosting patterns, SSL certificates, favicon hashes, HTML content, and more than 150 other metadata attributes."],"insights":["Consolidating DNS, WHOIS, and web-scan data does more than reduce the number of APIs: it provides each new domain with its registration record, scan fingerprint, and DNS history already linked together.","Silent Push’s active daily resolution model is intended to identify infrastructure as it is being created, rather than relying only on DNS lookups generated by existing user traffic.","For teams building infrastructure risk graphs, having cross-referenced external data available in a single query can eliminate the manual reconciliation otherwise required across separate systems."],"referencedReports":[],"body":"\u003cp\u003eA Security Engineer at a global fintech was building an internal graph to map risk dynamically across infrastructure. The effort required external data that could be ingested through an API and combined with internal signals. Previously, obtaining a complete view of an indicator required separate DNS, WHOIS, and web-scan sources, creating manual correlation work and multiple API integrations.\u003c/p\u003e\n\n\u003cp\u003eSilent Push says it consolidated those datasets into one platform and API, allowing the team to replace three integrations with one. The platform actively resolves domains and IPs collected from zone files and certificate transparency logs each day, rather than relying only on DNS resolutions created by user traffic. It also continuously indexes registration changes, hosting patterns, SSL certificates, favicon hashes, HTML content, and more than 150 additional metadata attributes, linking WHOIS records, scan fingerprints, and DNS history to new domains.\u003c/p\u003e\n"},{"n":4,"title":"Varonis and Cohesity: Improving Cyber Resilience with Data Security","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/varonis-and-cohesity","time":"15:04","priority":"MAY READ","score":25,"tldr":"Varonis and Cohesity promote an integrated approach to securing backup data by classifying sensitive information, enforcing least-privilege access, detecting suspicious activity, and enabling faster ransomware recovery. The partnership also aims to reduce backup storage costs by identifying and removing redundant or obsolete data.","briefOverview":"\u003cp\u003eVaronis and Cohesity describe an integration intended to improve security and recovery for backup data, which can contain sensitive personal information, intellectual property, and other critical business records. Varonis provides visibility into data stored in Cohesity Data Cloud by discovering and classifying sensitive and regulated information. The companies position the integration as connecting proactive data security with cyber resilience from data discovery through recovery.\u003c/p\u003e\n\n\u003cp\u003eVaronis maps permissions to show where data resides, who can access it, and who is using it, while supporting granular access changes to reduce unnecessary exposure. It also monitors user and non-human identity behavior for suspicious data access, lateral movement, privilege escalation, and abnormal file activity, and can automatically end sessions or change passwords. Cohesity provides AES-256 encryption, multifactor authentication, DataLock WORM and FIPS-compliant encryption, plus fully hydrated snapshots intended to enable rapid restoration of files, virtual machines, and application objects.\u003c/p\u003e\n\n\u003cp\u003eThe article also says Varonis Data Lifecycle Management identifies redundant, obsolete, and trivial data for archiving or disposal. Reducing this data can lower the amount stored and protected in Cohesity, improving storage efficiency and reducing infrastructure costs. Together, the platforms are presented as providing unified visibility, protection, and recovery across backups, virtual machines, data centers, remote sites, and multiple clouds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis integrates with Cohesity to identify and classify sensitive and regulated data stored across Cohesity Data Cloud.","Varonis maps data permissions and can automate granular access changes to reduce unnecessary exposure of backup data.","Varonis monitors user and non-human identity behavior for suspicious data access, lateral movement, privilege escalation, and abnormal file activity associated with ransomware.","Cohesity protects data with AES-256 encryption, multifactor authentication, DataLock for WORM, and FIPS-compliant encryption, and maintains fully hydrated snapshots for rapid restoration.","Varonis Data Lifecycle Management identifies redundant, obsolete, and trivial data so organizations can archive or dispose of it and reduce protected storage costs."],"insights":["Backup copies can create a major security blind spot because they may hold sensitive personal information and intellectual property without security teams having visibility into their contents.","Knowing which backup data is sensitive, stale, or overly accessible can help organizations prioritize what to restore after an incident, rather than treating all backed-up data as equally urgent.","Reducing redundant, obsolete, and trivial data can simultaneously lower Cohesity storage costs and reduce the amount of data that must be protected.","Automated actions such as ending user sessions and changing passwords can be used when suspicious activity is detected, avoiding a wait for manual review."],"referencedReports":[],"body":"\u003cp\u003eVaronis and Cohesity describe an integration intended to improve security and recovery for backup data, which can contain sensitive personal information, intellectual property, and other critical business records. Varonis provides visibility into data stored in Cohesity Data Cloud by discovering and classifying sensitive and regulated information. The companies position the integration as connecting proactive data security with cyber resilience from data discovery through recovery.\u003c/p\u003e\n\n\u003cp\u003eVaronis maps permissions to show where data resides, who can access it, and who is using it, while supporting granular access changes to reduce unnecessary exposure. It also monitors user and non-human identity behavior for suspicious data access, lateral movement, privilege escalation, and abnormal file activity, and can automatically end sessions or change passwords. Cohesity provides AES-256 encryption, multifactor authentication, DataLock WORM and FIPS-compliant encryption, plus fully hydrated snapshots intended to enable rapid restoration of files, virtual machines, and application objects.\u003c/p\u003e\n\n\u003cp\u003eThe article also says Varonis Data Lifecycle Management identifies redundant, obsolete, and trivial data for archiving or disposal. Reducing this data can lower the amount stored and protected in Cohesity, improving storage efficiency and reducing infrastructure costs. Together, the platforms are presented as providing unified visibility, protection, and recovery across backups, virtual machines, data centers, remote sites, and multiple clouds.\u003c/
