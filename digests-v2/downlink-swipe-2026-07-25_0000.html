<script type="application/json" id="dl-articles">[{"n":9,"title":"Fastjson 1.x RCE Vulnerability Targeted in Attacks With No Patched Available","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fastjson-1x-rce-vulnerability-targeted.html","time":"12:52","priority":"MUST READ","score":96,"tldr":"Attackers are exploiting a critical Fastjson 1.x RCE flaw in certain Spring Boot fat-JAR applications, and no patched Fastjson 1.x release is available yet. Organizations should enable SafeMode or use the restricted 1.2.83_noneautotype build while migrating to Fastjson2.","briefOverview":"\u003cp\u003eSecurity firms ThreatBook and Imperva say attackers are targeting CVE-2026-16723, a critical remote code execution flaw in Alibaba’s Fastjson 1.x JSON library for Java. In affected Spring Boot applications, a malicious JSON request can execute code without authentication using the privileges of the Java process. The confirmed chain affects Fastjson 1.2.68 through 1.2.83 when used in a Spring Boot executable fat-JAR with a reachable path that passes attacker-controlled JSON to an affected parser and SafeMode left disabled.\u003c/p\u003e\n\n\u003cp\u003eAlibaba published its advisory on July 21 after responsible disclosure by Kirill Firsov of FearsOff Cybersecurity, and the maintainers said the flaw requires no AutoType enablement and no classpath gadget. Firsov’s technical analysis traced the issue to Fastjson’s type-resolution path, where an attacker-controlled \u003ccode\u003e@type\u003c/code\u003e value can become a class-resource lookup and, in compatible Spring Boot fat-JARs, fetch attacker-controlled bytecode. Alibaba lists plain non-fat JARs, generic uber-JARs, and Tomcat or Jetty WAR deployments as unaffected.\u003c/p\u003e\n\n\u003cp\u003eAs of July 25, Alibaba had not released a fixed Fastjson 1.x version, and Fastjson 1.2.83 remained the latest standard 1.x release. Organizations that cannot migrate immediately are advised to enable SafeMode with \u003ccode\u003e-Dfastjson.parser.safeMode=true\u003c/code\u003e or use \u003ccode\u003ecom.alibaba:fastjson:1.2.83_noneautotype\u003c/code\u003e, while Alibaba lists migration to Fastjson2 as the long-term fix. ThreatBook and Imperva reported observed exploitation activity, but neither vendor published attack counts, raw requests, execution evidence, named victims, or confirmed compromises.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security firms ThreatBook and Imperva say attackers are targeting CVE-2026-16723, a critical remote code execution flaw in Alibaba’s Fastjson 1.x JSON library for Java.","The confirmed exploit chain requires Fastjson 1.2.68 through 1.2.83, a Spring Boot executable fat-JAR, a network-reachable path that passes attacker-controlled JSON to an affected parser, and SafeMode left disabled.","Alibaba had not released a fixed Fastjson 1.x version as of July 25, and recommended enabling SafeMode, using com.alibaba:fastjson:1.2.83_noneautotype, or migrating to Fastjson2.","Alibaba’s advisory said the flaw requires no AutoType enablement and no classpath gadget, and the maintainers verified the chain on Spring Boot 2.x, 3.x, and 4.x with JDK 8, 11, 17, and 21.","ThreatBook and Imperva reported observed exploitation activity, but neither vendor published attack counts, raw requests, execution evidence, named victims, or confirmed compromises."],"insights":["Disabling AutoType is not enough to prevent this exploit chain, because Alibaba said CVE-2026-16723 requires no AutoType enablement and can still work when SafeMode remains disabled.","Binding JSON input to a fixed class is not sufficient protection if the object contains an Object or Map field where the malicious payload can be nested.","The deployment format is a major factor in exposure, because Alibaba lists Spring Boot executable fat-JARs as affected while plain non-fat JARs, generic uber-JARs, and Tomcat or Jetty WAR deployments are listed as unaffected.","There is a mismatch between vendor-reported exploitation and official U.S. tracking, because ThreatBook and Imperva reported observed exploit activity while a July 23 CISA-ADP assessment marked exploitation as none and the flaw was absent from CISA’s Known Exploited Vulnerabilities catalog as of July 25.","The latest standard Fastjson 1.x release, version 1.2.83, was previously Alibaba’s recommended upgrade for a separate 2022 AutoType bypass but is now included in the affected range for CVE-2026-16723."],"referencedReports":[{"title":"Security Advisory: Remote Code Execution in fastjson 1.2.68–1.2.83","url":"https://github.com/alibaba/fastjson2/wiki/Security-Advisory:-Remote-Code-Execution-in-fastjson-1.2.68%E2%80%931.2.83","publisher":"Alibaba","context":"The article says Alibaba published this advisory on July 21 after responsible disclosure and described the conditions needed for the Fastjson RCE chain.","category":"","primary":false},{"title":"Fastjson 1.2.83 RCE","url":"https://fearsoff.org/research/fastjson-1-2-83-rce","publisher":"FearsOff Cybersecurity","context":"The article cites Kirill Firsov’s technical analysis to explain the type-resolution path and newer-JDK exploitation path.","category":"","primary":false},{"title":"Fastjson RCE 1.2.83 Active Exploitation Detected, Detection, Mitigation","url":"https://threatbook.io/blog/fastjson-rce-1.2.83-active-exploitation-detected-detection-mitigation","publisher":"ThreatBook","context":"The article references ThreatBook’s report that its platform observed in-the-wild exploitation and summarizes its lab reproduction results.","category":"","primary":false},{"title":"Imperva Customers Protected Against CVE-2026-16723 Critical Fastjson 1.x Zero-Day RCE","url":"https://www.imperva.com/blog/imperva-customers-protected-against-cve-2026-16723-critical-fastjson-1-x-zero-day-rce/","publisher":"Imperva","context":"The article cites Imperva’s report on activity against several sectors and geographies, including the United States, Singapore, and Canada.","category":"","primary":false},{"title":"CVE-2026-16723 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-16723","publisher":"CISA-ADP","context":"The article says a July 23 CISA-ADP assessment marked exploitation of CVE-2026-16723 as none.","category":"","primary":false}],"body":"\u003cp\u003eSecurity firms ThreatBook and Imperva say attackers are targeting CVE-2026-16723, a critical remote code execution flaw in Alibaba’s Fastjson 1.x JSON library for Java. In affected Spring Boot applications, a malicious JSON request can execute code without authentication using the privileges of the Java process. The confirmed chain affects Fastjson 1.2.68 through 1.2.83 when used in a Spring Boot executable fat-JAR with a reachable path that passes attacker-controlled JSON to an affected parser and SafeMode left disabled.\u003c/p\u003e\n\n\u003cp\u003eAlibaba published its advisory on July 21 after responsible disclosure by Kirill Firsov of FearsOff Cybersecurity, and the maintainers said the flaw requires no AutoType enablement and no classpath gadget. Firsov’s technical analysis traced the issue to Fastjson’s type-resolution path, where an attacker-controlled \u003ccode\u003e@type\u003c/code\u003e value can become a class-resource lookup and, in compatible Spring Boot fat-JARs, fetch attacker-controlled bytecode. Alibaba lists plain non-fat JARs, generic uber-JARs, and Tomcat or Jetty WAR deployments as unaffected.\u003c/p\u003e\n\n\u003cp\u003eAs of July 25, Alibaba had not released a fixed Fastjson 1.x version, and Fastjson 1.2.83 remained the latest standard 1.x release. Organizations that cannot migrate immediately are advised to enable SafeMode with \u003ccode\u003e-Dfastjson.parser.safeMode=true\u003c/code\u003e or use \u003ccode\u003ecom.alibaba:fastjson:1.2.83_noneautotype\u003c/code\u003e, while Alibaba lists migration to Fastjson2 as the long-term fix. ThreatBook and Imperva reported observed exploitation activity, but neither vendor published attack counts, raw requests, execution evidence, named victims, or confirmed compromises.\u003c/p\u003e\n"},{"n":7,"title":"Cl0p Affiliates Target Internet-Exposed PTC Windchill and FlexPLM with Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/cl0p-affiliates-target-internet-exposed.html","time":"10:14","priority":"MUST READ","score":94,"tldr":"Cl0p-linked attackers are exploiting internet-exposed PTC Windchill and FlexPLM systems by chaining a FlexPLM information disclosure flaw with a Windchill RCE to deploy JSP web shells and steal sensitive engineering and product data. Organizations using these products should urgently investigate exposure, apply mitigations, and check for the reported indicators of compromise.","briefOverview":"\u003cp\u003eThreat actors linked to the Cl0p ransomware campaign are exploiting flaws in internet-exposed PTC Windchill and FlexPLM deployments in a new data extortion campaign. The campaign targets manufacturing, automotive, aerospace, and retail sectors. After gaining access, the attackers enumerate file systems, stage engineering and design data, and carry out double extortion data theft.\u003c/p\u003e\n\n\u003cp\u003eA coordinated advisory from Ransom-ISAC, eCrime.ch, and DEFUSED says the attackers chain a pre-authentication information disclosure in the FlexPLM WSDL endpoint with a server-side flaw in the Windchill login servlet. This enables unauthenticated remote code execution and deployment of hex-named JSP web shells under /Windchill/login/. The activity is suspected to involve CVE-2026-12569, a critical PTC Windchill flaw that CISA added to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003ePTC warned customers that it has received continued reports of heightened threat activity and said unknown attackers are exploiting the vulnerability to deploy JSP web shells against susceptible systems. Ransom-ISAC shared four IP addresses as indicators of compromise, matching those shared by PTC. ReliaQuest said it observed exploitation of CVE-2026-12569 for unauthenticated remote code execution, JSP web shell deployment, remote command execution, and sensitive product data exfiltration.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors linked to the Cl0p ransomware campaign are exploiting flaws in internet-exposed PTC Windchill and FlexPLM deployments as part of a data extortion campaign.","Attackers chain a pre-authentication information disclosure in the FlexPLM WSDL endpoint with a server-side flaw in the Windchill login servlet to achieve unauthenticated remote code execution and deploy hex-named JSP web shells under /Windchill/login/.","The campaign has targeted manufacturing, automotive, aerospace, and retail sectors, with attackers enumerating file systems, staging engineering and design data, and carrying out double extortion data theft.","PTC said it has received continued reports of heightened threat activity and warned that unknown attackers are exploiting the vulnerability to deploy JSP web shells against susceptible systems.","Ransom-ISAC shared four IP addresses as indicators of compromise: 216.152.148.54, 216.152.151.204, 104.243.35.63, and 5.180.41.35."],"insights":["The attack chain depends on both Windchill and FlexPLM exposure, because the reported intrusions combine a FlexPLM WSDL information-disclosure defect with a Windchill login servlet flaw to enable unauthenticated exploitation.","The reported web shells have a specific placement pattern, with hex-named JSP files deployed under /Windchill/login/, giving defenders a concrete location and naming pattern to examine.","The extortion phase may reach far beyond security or IT contacts, because the emails are sent from previously compromised accounts to hundreds of users within an impacted organization.","Although the actor is not confirmed, ReliaQuest noted that the tradecraft resembles previous Cl0p campaigns against enterprise applications and high-value data repositories."],"referencedReports":[{"title":"Cl0p Windchill/FlexPLM Exploitation","url":"https://ransom-isac.org/blog/clop-windchill-flexplm-exploitation/","publisher":"Ransom-ISAC, eCrime.ch, and DEFUSED","context":"The article cites this as a new coordinated advisory describing attackers chaining a FlexPLM WSDL information disclosure flaw with a Windchill login servlet flaw to achieve unauthenticated remote code execution.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors linked to the Cl0p ransomware campaign are exploiting flaws in internet-exposed PTC Windchill and FlexPLM deployments in a new data extortion campaign. The campaign targets manufacturing, automotive, aerospace, and retail sectors. After gaining access, the attackers enumerate file systems, stage engineering and design data, and carry out double extortion data theft.\u003c/p\u003e\n\n\u003cp\u003eA coordinated advisory from Ransom-ISAC, eCrime.ch, and DEFUSED says the attackers chain a pre-authentication information disclosure in the FlexPLM WSDL endpoint with a server-side flaw in the Windchill login servlet. This enables unauthenticated remote code execution and deployment of hex-named JSP web shells under /Windchill/login/. The activity is suspected to involve CVE-2026-12569, a critical PTC Windchill flaw that CISA added to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003ePTC warned customers that it has received continued reports of heightened threat activity and said unknown attackers are exploiting the vulnerability to deploy JSP web shells against susceptible systems. Ransom-ISAC shared four IP addresses as indicators of compromise, matching those shared by PTC. ReliaQuest said it observed exploitation of CVE-2026-12569 for unauthenticated remote code execution, JSP web shell deployment, remote command execution, and sensitive product data exfiltration.\u003c/p\u003e\n"},{"n":6,"title":"Researcher Publishes GitLab RCE PoC Letting Authenticated Users Run Commands as Git","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-publishes-gitlab-rce-poc.html","time":"10:14","priority":"MUST READ","score":92,"tldr":"Researchers published exploit code for a GitLab remote code execution flaw that lets any authenticated user with project push access run commands as the git user on unpatched self-managed instances. Operators should urgently upgrade to GitLab 18.10.8, 18.11.5, or 19.0.2 and verify the version inside the Webservice image, since the fix was not originally labeled as a security patch.","briefOverview":"\u003cp\u003eSecurity researchers at depthfirst published working exploit code on July 24 for a GitLab flaw that GitLab patched on June 10. The exploit lets any authenticated user who can push to a project run commands as \u003ccode\u003egit\u003c/code\u003e on an unpatched self-managed GitLab \u003ccode\u003e18.11.3\u003c/code\u003e server. The article says there is no need for administrator rights, CI or runner access, victim interaction, or access to anyone else’s project.\u003c/p\u003e\n\n\u003cp\u003eThe chain works through GitLab’s notebook renderer, \u003ccode\u003eipynbdiff\u003c/code\u003e, which passes repository-controlled \u003ccode\u003e.ipynb\u003c/code\u003e JSON to \u003ccode\u003eOj::Parser.usual.parse\u003c/code\u003e inside a long-lived Puma worker. Two memory corruption bugs in the Oj Ruby JSON parser allow a heap pointer leak through a commit diff and then a payload that points execution at \u003ccode\u003esystem()\u003c/code\u003e. The affected GitLab versions include CE and EE from 15.2.0 to 18.10.7, 18.11.0 to 18.11.4, and 19.0.0 to 19.0.1, and the article says users should upgrade to 18.10.8, 18.11.5, or 19.0.2.\u003c/p\u003e\n\n\u003cp\u003eGitLab did not list the fix as a security fix, and the article says the Oj \u003ccode\u003e3.17.3\u003c/code\u003e update appeared under bug fixes with no CVE, CVSS score, or mention of the notebook-diff chain. For Helm and Operator users, the article warns to check the GitLab version inside the Webservice image running Puma, not the chart or Operator version. Commands run as the \u003ccode\u003egit\u003c/code\u003e account, which may reach source code, Rails secrets, service credentials, CI/CD data, and internal services depending on how the installation is isolated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researchers at depthfirst published working exploit code on July 24 for a GitLab flaw that GitLab patched on June 10.","The flaw lets any authenticated user who can push to a project run commands as the git account on an unpatched self-managed GitLab 18.11.3 server.","The exploit chain uses crafted Jupyter notebooks opened in a commit diff to leak a heap pointer, locate libraries in memory, and trigger a payload through two Oj memory corruption bugs.","GitLab listed the Oj 3.17.3 bump under bug fixes rather than in the security-fix table, with no CVE, CVSS score, or mention of the notebook-diff chain.","Affected users are advised to upgrade to GitLab 18.10.8, 18.11.5, or 19.0.2, and the article says neither GitLab nor depthfirst offers a workaround for those who cannot upgrade."],"insights":["Operators who relied only on GitLab’s security-fix table for the June 10 release may have missed this issue because the relevant Oj update was listed as a bug fix, with no CVE, CVSS score, or notebook-diff details.","For Helm and Operator deployments, the article says the important version to verify is the GitLab version inside the Webservice image running Puma, not the chart or Operator version.","GitLab installations on versions 15.2 through 18.9 cannot rely on a backported fix because those lines are outside GitLab’s security-maintained patch trains and must move to a supported release.","The public exploit is not described as drop-in for arbitrary targets because it was built for GitLab 18.11.3 on x86-64 and depends on image-specific offsets, register state, jemalloc behavior, and library bases that change after a Puma master restart.","Although commands run only as the git account, the article says that account may still reach source code, Rails secrets, service credentials, CI/CD data, and internal services depending on how the installation is isolated."],"referencedReports":[{"title":"Going depthfirst: Achieving GitLab RCE via two Ruby memory corruption vulnerabilities","url":"https://depthfirst.com/research/going-depthfirst-achieving-gitlab-rce-via-two-ruby-memory-corruption-vulnerabilities","publisher":"depthfirst","context":"The article says depthfirst’s writeup contains the full exploit chain for the GitLab RCE involving two Oj memory corruption bugs.","category":"","primary":false},{"title":"Patch release: GitLab 19.0.2 released","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-0-2-released/","publisher":"GitLab","context":"The article cites GitLab’s June 10 patch release to note that the Oj 3.17.3 update was listed under bug fixes rather than the security-fix table.","category":"","primary":false}],"body":"\u003cp\u003eSecurity researchers at depthfirst published working exploit code on July 24 for a GitLab flaw that GitLab patched on June 10. The exploit lets any authenticated user who can push to a project run commands as \u003ccode\u003egit\u003c/code\u003e on an unpatched self-managed GitLab \u003ccode\u003e18.11.3\u003c/code\u003e server. The article says there is no need for administrator rights, CI or runner access, victim interaction, or access to anyone else’s project.\u003c/p\u003e\n\n\u003cp\u003eThe chain works through GitLab’s notebook renderer, \u003ccode\u003eipynbdiff\u003c/code\u003e, which passes repository-controlled \u003ccode\u003e.ipynb\u003c/code\u003e JSON to \u003ccode\u003eOj::Parser.usual.parse\u003c/code\u003e inside a long-lived Puma worker. Two memory corruption bugs in the Oj Ruby JSON parser allow a heap pointer leak through a commit diff and then a payload that points execution at \u003ccode\u003esystem()\u003c/code\u003e. The affected GitLab versions include CE and EE from 15.2.0 to 18.10.7, 18.11.0 to 18.11.4, and 19.0.0 to 19.0.1, and the article says users should upgrade to 18.10.8, 18.11.5, or 19.0.2.\u003c/p\u003e\n\n\u003cp\u003eGitLab did not list the fix as a security fix, and the article says the Oj \u003ccode\u003e3.17.3\u003c/code\u003e update appeared under bug fixes with no CVE, CVSS score, or mention of the notebook-diff chain. For Helm and Operator users, the article warns to check the GitLab version inside the Webservice image running Puma, not the chart or Operator version. Commands run as the \u003ccode\u003egit\u003c/code\u003e account, which may reach source code, Rails secrets, service credentials, CI/CD data, and internal services depending on how the installation is isolated.\u003c/p\u003e\n"},{"n":4,"title":"Malicious sites use JavaScript to build malware in browser memory","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malicious-sites-use-javascript-to-build-malware-in-browser-memory/","time":"15:21","priority":"SHOULD READ","score":88,"tldr":"A large malvertising campaign is using fake Solana, Luno, and TradingView sites to make victims’ browsers assemble unique malware executables in memory, helping evade network and static detection. Crypto investors and traders should avoid sponsored downloads and only install apps from official sources after verifying signatures.","briefOverview":"\u003cp\u003eA massive malvertising campaign is using fake Solana, Luno, and TradingView webpages to deliver malware through malicious JavaScript. The operation has been active since late 2024 and is localized to 25 languages in 12 countries, primarily in Asia Pacific and Latin America. It targets retail traders and crypto investors, while redirecting researchers, scanners, and security bots to blank pages.\u003c/p\u003e\n\n\u003cp\u003eConfiant says the campaign stands out because it uses the web browser as a local assembly pipeline for the malware. The landing page registers a service worker and sets up a shared worker that helps assemble the malware from remote components and locally generated bytes. Randomized seed and size parameters are used for each session so the resulting malware file has a unique hash.\u003c/p\u003e\n\n\u003cp\u003eThe technique means no finished malware file is transmitted over the network, making detection less likely and analysis more challenging. Confiant says the final executable is handed to the service worker and downloaded from a same-origin path, so the browser sees it as coming from the landing page domain. Users involved in financial or cryptocurrency activities are advised to avoid downloads from social media ads or sponsored search results, get files from official websites, and verify installer signatures and publishers before running them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A massive malvertising campaign uses fake Solana, Luno, and TradingView webpages with malicious JavaScript that instructs browsers to assemble malware directly in memory.","The operation has been active since late 2024, is localized to 25 languages in 12 countries, and primarily targets retail traders and crypto investors in Asia Pacific and Latin America.","Confiant says the pages register a service worker and use a SharedWorker to request a randomized “/config” response so each session can build a malware file with a unique hash.","The technique avoids transmitting a finished malware file over the network, making detection less likely and analysis more challenging.","Users engaged in financial or cryptocurrency activities are advised to avoid downloading apps from social media advertisements or sponsored search results and to verify installers from official company websites."],"insights":["The campaign’s use of randomized seed and size parameters means each victim can receive a malware executable with a unique hash, reducing the usefulness of hash-based detection.","Because the final executable is assembled inside the browser rather than sent as a completed file over the network, defenders may have fewer network artifacts to inspect.","The same-origin ServiceWorker delivery method makes the download appear to come from the fake landing page domain, even though some components originate from elsewhere.","The campaign filters visitors so researchers, scanners, and security bots are redirected to blank pages, which can make discovery and analysis harder.","The shift from StreamSaver-based delivery to same-origin ServiceWorker delivery since April shows the operators are actively changing delivery methods within the same campaign."],"referencedReports":[{"title":"SourTrade: Browser-Assembled Malware","url":"http://blog.confiant.com/p/sourtrade-browser-assembled-malware","publisher":"Confiant","context":"The article relies on Confiant’s analysis to explain how the campaign uses the browser as a local assembly pipeline for malware.","category":"","primary":false},{"title":"The scam that won’t quit: Malicious TradingView Premium ads jump from Meta to Google and YouTube","url":"https://www.bitdefender.com/en-us/blog/labs/the-scam-that-wont-quit-malicious-tradingview-premium-ads-jump-from-meta-to-google-and-youtube","publisher":"Bitdefender","context":"The article cites Bitdefender’s 2025 report as supporting evidence about an earlier resilient malvertising campaign that used StreamSaver to distribute malware and described the payload’s capabilities.","category":"","primary":false}],"body":"\u003cp\u003eA massive malvertising campaign is using fake Solana, Luno, and TradingView webpages to deliver malware through malicious JavaScript. The operation has been active since late 2024 and is localized to 25 languages in 12 countries, primarily in Asia Pacific and Latin America. It targets retail traders and crypto investors, while redirecting researchers, scanners, and security bots to blank pages.\u003c/p\u003e\n\n\u003cp\u003eConfiant says the campaign stands out because it uses the web browser as a local assembly pipeline for the malware. The landing page registers a service worker and sets up a shared worker that helps assemble the malware from remote components and locally generated bytes. Randomized seed and size parameters are used for each session so the resulting malware file has a unique hash.\u003c/p\u003e\n\n\u003cp\u003eThe technique means no finished malware file is transmitted over the network, making detection less likely and analysis more challenging. Confiant says the final executable is handed to the service worker and downloaded from a same-origin path, so the browser sees it as coming from the landing page domain. Users involved in financial or cryptocurrency activities are advised to avoid downloads from social media ads or sponsored search results, get files from official websites, and verify installer signatures and publishers before running them.\u003c/p\u003e\n"},{"n":8,"title":"DevMan RaaS Portal Centralizes Payload Builds, Victim Management, and Affiliate Payouts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/devman-raas-portal-centralizes-payload.html","time":"09:53","priority":"SHOULD READ","score":84,"tldr":"PRODAFT says the DevMan ransomware group has built a centralized RaaS portal to manage payload creation, victims, affiliate teams, chats, deadlines, and payouts, showing a more formalized and tightly controlled operation. The platform supports Windows, Linux, ESXi, and alleged SCADA-focused lockers, with affiliates encouraged to target critical infrastructure outside restricted regions.","briefOverview":"\u003cp\u003ePRODAFT reported that the DevMan ransomware-as-a-service operation, tracked as Funky Mantis, maintains a dedicated web platform for affiliates. The portal combines payload build generation, finance, victim chat, support, victim records, teams, and payout functions. It also integrates access brokerage or access distribution with ransomware deployment, including country-specific “networks” and two-to-three-day completion windows.\u003c/p\u003e\n\n\u003cp\u003eDevMan first emerged in April 2025 as an affiliate for Qilin, DragonForce, Apos, and RansomHub before shifting to its own RaaS operation. The group has claimed 184 victims to date, with nearly 50 in the United States and technology, healthcare, financial services, professional services, and government among the most targeted sectors. The third version of the platform, released in January 2026, added structured victim records, lifecycle states, team creation, invitation controls, per-victim build options, deadline tracking, revenue fields, and shared operational access.\u003c/p\u003e\n\n\u003cp\u003eThe latest portal lets affiliates create lockers for Windows, ESXi, or Linux, and the Windows version includes functions for privilege checking, disabling security controls, terminating processes and services, inhibiting recovery, clearing event logs, discovering local and network shares, lateral movement, multi-threaded encryption, ransom-note creation, and optional self-deletion. The locker encrypts files with ChaCha20-Poly1305, fully encrypting files up to 3 MiB and partially encrypting larger files by processing a 1 MiB chunk every 51 MiB. DevMan’s targeting policy allows attacks outside CIS countries and Serbia, encourages attacks against critical infrastructure, and instructs affiliates to request a separate encryptor for SCADA systems, while forbidding attacks on child-related healthcare businesses and intentional leaks of personal data belonging to people under 18.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PRODAFT reported that the DevMan ransomware-as-a-service operation maintains a dedicated web portal for affiliates to build payloads, manage victim records and chats, oversee earnings, and handle payouts.","DevMan first appeared in April 2025 as an affiliate for Qilin, DragonForce, Apos, and RansomHub before moving to its own ransomware-as-a-service operation, and Vectra AI said its locker has a clear DragonForce lineage.","The third version of the DevMan platform, released in January 2026, added structured victim records, lifecycle states, team creation, invitation controls, per-victim build options, deadline tracking, revenue fields, and shared operational access.","Ransomware.Live statistics cited in the article say DevMan has claimed 184 victims, with nearly 50 in the United States and the most targeted sectors including technology, healthcare, financial services, professional services, and government.","The latest DevMan portal allows affiliates to create lockers for Windows, ESXi, or Linux, and PRODAFT found the Windows version includes functions for privilege checking, security-control impairment, recovery inhibition, event log clearing, lateral movement, and multi-threaded encryption."],"insights":["DevMan’s v3 portal shows a shift from informal chat-based coordination to a managed business workflow, with curator approval, team controls, deadlines, revenue fields, and administrator takeover rights reducing affiliate independence.","The operation combines access brokerage with ransomware deployment, since administrators offered country-specific networks, asked whether affiliates would use personal or program-supplied access, and imposed two-to-three-day completion windows.","DevMan’s targeting rules explicitly encourage attacks on critical infrastructure and instruct affiliates to request a separate SCADA encryptor, while still setting selective prohibitions around child-related healthcare businesses and data belonging to minors.","PRODAFT’s defensive guidance highlights remote access and privileged accounts as priority risks, recommending that organizations block service and backup accounts from interactive VPN login, require phishing-resistant MFA, and rotate credentials exposed through VPN appliances, LDAP integrations, scripts, and backup tooling.","The Huntress controversy shows that researcher communications with threat actors can become an operational security risk, as the reported exchange involved a Huntress employee disclosing to DevMan that law enforcement had contacted them about the threat actor."],"referencedReports":[{"title":"Funky Mantis: Platform Coordination and Locker Analysis","url":"https://catalyst.prodaft.com/public/report/funky-mantis-platform-coordination-and-locker-analysis/","publisher":"PRODAFT","context":"The article is based largely on PRODAFT's extensive report describing DevMan's centrally administered RaaS portal, affiliate workflows, roles, and locker behavior.","category":"","primary":false},{"title":"From Conti to Black Basta to DevMan: The Endless Ransomware Rebrand","url":"https://www.vectra.ai/blog/from-conti-to-black-basta-to-devman-the-endless-ransomware-rebrand","publisher":"Vectra AI","context":"The article cites Vectra AI's analysis for the assessment that DevMan's locker has unmistakable DragonForce lineage.","category":"","primary":false},{"title":"DevMan Ransomware Analysis","url":"https://any.run/cybersecurity-blog/devman-ransomware-analysis/","publisher":"ANY.RUN","context":"The article links to ANY.RUN's ransomware analysis as supporting evidence for DevMan's shared lineage with other ransomware families.","category":"","primary":false},{"title":"ALERT-CERT-IL-W-1907","url":"https://www.gov.il/BlobFolder/reports/alert_1907/he/ALERT-CERT-IL-W-1907.pdf","publisher":"Israel National Cyber Directorate","context":"The article cites an INCD bulletin describing DevMan's online presence, language use, and public claims about attacks.","category":"","primary":false}],"body":"\u003cp\u003ePRODAFT reported that the DevMan ransomware-as-a-service operation, tracked as Funky Mantis, maintains a dedicated web platform for affiliates. The portal combines payload build generation, finance, victim chat, support, victim records, teams, and payout functions. It also integrates access brokerage or access distribution with ransomware deployment, including country-specific “networks” and two-to-three-day completion windows.\u003c/p\u003e\n\n\u003cp\u003eDevMan first emerged in April 2025 as an affiliate for Qilin, DragonForce, Apos, and RansomHub before shifting to its own RaaS operation. The group has claimed 184 victims to date, with nearly 50 in the United States and technology, healthcare, financial services, professional services, and government among the most targeted sectors. The third version of the platform, released in January 2026, added structured victim records, lifecycle states, team creation, invitation controls, per-victim build options, deadline tracking, revenue fields, and shared operational access.\u003c/p\u003e\n\n\u003cp\u003eThe latest portal lets affiliates create lockers for Windows, ESXi, or Linux, and the Windows version includes functions for privilege checking, disabling security controls, terminating processes and services, inhibiting recovery, clearing event logs, discovering local and network shares, lateral movement, multi-threaded encryption, ransom-note creation, and optional self-deletion. The locker encrypts files with ChaCha20-Poly1305, fully encrypting files up to 3 MiB and partially encrypting larger files by processing a 1 MiB chunk every 51 MiB. DevMan’s targeting policy allows attacks outside CIS countries and Serbia, encourages attacks against critical infrastructure, and instructs affiliates to request a separate encryptor for SCADA systems, while forbidding attacks on child-related healthcare businesses and intentional leaks of personal data belonging to people under 18.\u003c/p\u003e\n"},{"n":11,"title":"The Phish Zoom Signed With Its Own DKIM Key","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/zoom-authenticated-dkim-paypal-billing-toad-callback","time":"11:00","priority":"SHOULD READ","score":83,"tldr":"Attackers abused Zoom’s own sign-in email template by placing a PayPal callback scam in the account name field, causing Zoom to DKIM-sign a genuine-looking phishing message that passed DMARC. The key takeaway is that valid email authentication proves origin and integrity, not that the content is safe.","briefOverview":"\u003cp\u003eAn attacker created a Zoom account and set the account name to a scam message claiming a PayPal account would be auto-debited $986.37 for a Zoom monthly renewal. When the attacker triggered a Zoom sign-in verification email, Zoom inserted that account name into its standard email template and signed the finished message with its production DKIM key. The resulting email passed DKIM and DMARC because Zoom genuinely signed the content before delivery.\u003c/p\u003e\n\n\u003cp\u003eThe message was then resent to a company chief operating officer through a brand-new privacy-protected domain, mailjetstream[.]com, which had no relationship to Zoom’s mail platform and no SPF record. The email contained Zoom’s real branding and a legitimate Zoom link, but the payload was the callback number +1-805-600-1572. There was no malicious link or attachment, which left URL sandboxes, attachment detonation, and domain-reputation engines with little to detect.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that a valid DKIM signature proves the message was signed by the domain’s key and was not modified in transit, but it does not prove the content is trustworthy. It identifies the scam as a telephone-oriented attack delivery, or TOAD, designed to move the victim from email to a phone call with a live operator. The broader takeaway is that authenticated brand email can still be hostile when user-controlled fields are echoed into transactional messages, so behavioral analysis must evaluate the message content and delivery path rather than treating authentication as a verdict.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker set a Zoom account name to a scam script about a fabricated $986.37 PayPal auto-debit and then triggered a Zoom sign-in verification email.","Zoom rendered the attacker-controlled account name into its standard sign-in-code email template and signed the finished message with its production DKIM key for zoom.us.","The resent message passed DMARC because the Zoom DKIM signature was aligned, even though the envelope domain mailjetstream.com had no SPF record and no relationship to Zoom's mail platform.","The only attack payload was the callback number +1-805-600-1572, with no malicious link or attachment for URL sandboxes, attachment detonation, or domain-reputation engines to analyze.","The article states that a valid DKIM signature proves the signing key and message integrity, but not whether the message content is safe or trustworthy."],"insights":["Email defenses that allow-list messages solely because they are signed by a trusted brand such as zoom.us can miss attacks where the brand itself was tricked into signing attacker-supplied text.","Transactional emails that echo user-controlled fields such as account names, notes, or memo lines can become a vehicle for signed scam content if those fields are not constrained or context-checked.","The presence of Resent headers and a new, unrelated envelope domain can reveal weaponization even when the visible brand assets and cryptographic signature are authentic.","Callback scams can evade common email filtering because the dangerous action is moved outside the email message and into a phone call, leaving only a phone number and social pressure in the email body.","A mismatch between the expected purpose of an email and its text, such as a Zoom sign-in code email discussing PayPal auto-debits, is an important detection signal even when the message’s technical authentication passes."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for the claim that callback-style TOAD represents roughly 5% of phishing volume hitting gateways.","category":"","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for the statement that this family of social-engineering fraud remains among the costliest by reported dollar loss.","category":"","primary":false}],"body":"\u003cp\u003eAn attacker created a Zoom account and set the account name to a scam message claiming a PayPal account would be auto-debited $986.37 for a Zoom monthly renewal. When the attacker triggered a Zoom sign-in verification email, Zoom inserted that account name into its standard email template and signed the finished message with its production DKIM key. The resulting email passed DKIM and DMARC because Zoom genuinely signed the content before delivery.\u003c/p\u003e\n\n\u003cp\u003eThe message was then resent to a company chief operating officer through a brand-new privacy-protected domain, mailjetstream[.]com, which had no relationship to Zoom’s mail platform and no SPF record. The email contained Zoom’s real branding and a legitimate Zoom link, but the payload was the callback number +1-805-600-1572. There was no malicious link or attachment, which left URL sandboxes, attachment detonation, and domain-reputation engines with little to detect.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that a valid DKIM signature proves the message was signed by the domain’s key and was not modified in transit, but it does not prove the content is trustworthy. It identifies the scam as a telephone-oriented attack delivery, or TOAD, designed to move the victim from email to a phone call with a live operator. The broader takeaway is that authenticated brand email can still be hostile when user-controlled fields are echoed into transactional messages, so behavioral analysis must evaluate the message content and delivery path rather than treating authentication as a verdict.\u003c/p\u003e\n"},{"n":5,"title":"CTM360 Research Reveals How Insurance Phishing Has Evolved Into Real-Time Account Hijacking","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ctm360-research-reveals-how-insurance.html","time":"10:14","priority":"SHOULD READ","score":82,"tldr":"CTM360 reports that insurance phishing has evolved from simple credential theft into real-time account hijacking, with attackers using Google Ads, disposable hosting, and live OTP interception to access victim accounts during the same session. The key takeaway is that defenders must look beyond phishing sites and monitor attacker infrastructure, workflows, and authentication behavior.","briefOverview":"\u003cp\u003eCTM360 reports that insurance-focused phishing campaigns have evolved from delayed credential harvesting into real-time account hijacking. Attackers synchronize their activity with victims during a single browsing session, using submitted login details and one-time passwords to authenticate against legitimate insurance portals before codes expire. The investigation found a coordinated operation targeting multiple insurance providers, with Saudi Arabia appearing to be the primary target and additional activity observed in Europe, the United States, and India.\u003c/p\u003e\n\n\u003cp\u003eThe campaign commonly used sponsored Google advertisements as the initial delivery mechanism, promoting insurance quotations, renewals, and price-comparison offers. Victims who clicked the ads were redirected to phishing sites designed to closely resemble genuine insurance providers, including copied branding, interfaces, quotation workflows, and customer portals. The attackers also used disposable infrastructure on legitimate website builders and free hosting platforms such as GitHub Pages, Netlify, Hostinger, Wix, Lovable, and other cloud services.\u003c/p\u003e\n\n\u003cp\u003eCTM360 identified a previously undocumented phishing kit called InsureOTP Kit that supports live session management, real-time data collection, backend administration, Telegram Bot integrations, direct backend API communication, and live OTP handling. Researchers also found exposed backend resources, including administrative components, source code, SQLite databases, and operational records that showed how the phishing framework functioned. The article states that defenders need to look beyond individual phishing pages and monitor paid ad abuse, lookalike domains, disposable cloud-hosted infrastructure, and authentication patterns that indicate real-time OTP interception.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CTM360 investigated insurance-focused phishing operations in which attackers synchronize their activity with victims in real time to authenticate against legitimate insurance portals during the victim’s browsing session.","The campaign used sponsored Google advertisements for insurance quotations, renewals, or price comparisons as a primary delivery mechanism, redirecting victims to phishing websites that closely resembled genuine insurance providers.","The operation reused infrastructure across multiple insurance brands and primarily targeted Saudi Arabia, with additional activity observed across Europe, the United States, and India.","CTM360 identified a previously undocumented phishing kit called InsureOTP Kit that supports live session management, real-time data collection, backend administration, Telegram Bot integrations, and live OTP handling.","The article states that defenders should monitor for paid advertisements abusing their brands, newly registered lookalike domains, disposable cloud-hosted phishing infrastructure, and authentication patterns that indicate real-time OTP interception."],"insights":["The attackers’ use of sponsored Google advertisements shows that phishing delivery is shifting beyond email and SMS into search-driven moments when users are already looking for insurance services.","Randomized domains hosted on legitimate website builders and free hosting platforms reduce the usefulness of conventional brand-monitoring that looks mainly for obvious lookalike domains.","The phishing kit’s ability to request additional OTP submissions when authentication fails indicates that operators can adapt during an active victim session rather than relying on one-time form collection.","Publicly exposed backend archives gave researchers visibility into administrative components, source code, databases, and operational records, showing that attacker infrastructure can reveal the broader campaign workflow.","The article argues that response timelines based on delayed account abuse are less effective when credential theft, OTP interception, and account access happen in one continuous session."],"referencedReports":[{"title":"InsureTrap: Fake Insurance Phishing \u0026 Account Hijacking","url":"https://www.ctm360.com/reports/insuretrap-fake-insurance-phishing-account-hijacking","publisher":"CTM360","context":"The article repeatedly directs readers to CTM360's full report as the source for the investigation into insurance phishing and real-time account hijacking.","category":"","primary":false}],"body":"\u003cp\u003eCTM360 reports that insurance-focused phishing campaigns have evolved from delayed credential harvesting into real-time account hijacking. Attackers synchronize their activity with victims during a single browsing session, using submitted login details and one-time passwords to authenticate against legitimate insurance portals before codes expire. The investigation found a coordinated operation targeting multiple insurance providers, with Saudi Arabia appearing to be the primary target and additional activity observed in Europe, the United States, and India.\u003c/p\u003e\n\n\u003cp\u003eThe campaign commonly used sponsored Google advertisements as the initial delivery mechanism, promoting insurance quotations, renewals, and price-comparison offers. Victims who clicked the ads were redirected to phishing sites designed to closely resemble genuine insurance providers, including copied branding, interfaces, quotation workflows, and customer portals. The attackers also used disposable infrastructure on legitimate website builders and free hosting platforms such as GitHub Pages, Netlify, Hostinger, Wix, Lovable, and other cloud services.\u003c/p\u003e\n\n\u003cp\u003eCTM360 identified a previously undocumented phishing kit called InsureOTP Kit that supports live session management, real-time data collection, backend administration, Telegram Bot integrations, direct backend API communication, and live OTP handling. Researchers also found exposed backend resources, including administrative components, source code, SQLite databases, and operational records that showed how the phishing framework functioned. The article states that defenders need to look beyond individual phishing pages and monitor paid ad abuse, lookalike domains, disposable cloud-hosted infrastructure, and authentication patterns that indicate real-time OTP interception.\u003c/p\u003e\n"},{"n":10,"title":"Malvertising Sends Malware in Pieces, Then Makes the Browser Build the Executable","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/malvertising-sends-malware-in-pieces.html","time":"18:48","priority":"SHOULD READ","score":82,"tldr":"The SourTrade malvertising campaign impersonates trading and crypto services and makes victims’ browsers assemble unique Windows executables from pieces, limiting simple hash-based detection. Defenders should focus on the full delivery chain, including cloaked landing pages, /config requests, secondary runtime downloads, and ServiceWorker-based file delivery.","briefOverview":"\u003cp\u003eA malvertising operation called SourTrade is making victims’ browsers assemble the final Windows executable instead of serving one complete malicious file from a fixed URL. Confiant said the campaign has operated since late 2024 and impersonated TradingView, Solana, and Luno to target retail traders and cryptocurrency investors across 12 countries in 25 languages. The landing pages fingerprint visitors, show suspected researchers and bots an empty page, and present selected targets with a convincing copy of the impersonated service.\u003c/p\u003e\n\n\u003cp\u003eThe delivery chain registers a ServiceWorker, builds a SharedWorker from JavaScript embedded in the page, requests a /config response, and retrieves a clean Bun runtime from a secondary domain. The configuration supplies executable structures and malicious JavaScriptCore bytecode, while the worker uses AES-CTR to generate pseudorandom bytes and follows a template to assemble the file from multiple sources. Confiant said each victim can receive a different assembled file because rotating values in the /config response changes the hash while retaining the payload code.\u003c/p\u003e\n\n\u003cp\u003eThe article states that the chain does not rely on a browser vulnerability or remove Mark of the Web, and Confiant’s analysis documents delivery rather than execution inside the browser. The approach limits the value of simple hash-based detections, but the attacker-controlled executable material and bytecode still cross the network. Defenders are advised to examine the full chain, including the ad referral, cloaked landing page, /config request, secondary-domain runtime fetch, and ServiceWorker download.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Confiant said the SourTrade malvertising operation has operated since late 2024 and impersonated TradingView, Solana, and Luno to target retail traders and cryptocurrency investors across 12 countries in 25 languages.","The campaign’s landing pages fingerprint visitors, show suspected researchers and bots an empty page, and serve selected targets a convincing copy of the impersonated service.","The delivery chain registers a ServiceWorker, builds a SharedWorker from JavaScript embedded in the page, requests a /config file, retrieves a clean Bun runtime from a secondary domain, and assembles a Windows executable in the browser from supplied components.","Confiant reported that rotating the seed and size in each /config response can give each victim a different assembled file hash while retaining the executable payload code.","The article states that there is no software patch to apply and that defenders should examine the full chain from ad referral and cloaked landing page through the /config request, secondary-domain runtime fetch, and ServiceWorker download."],"insights":["The campaign’s browser-built executable approach is narrower than it may first appear because the attacker-controlled PE material and bytecode still cross the network in the /config response.","Mark of the Web is not removed, but the recorded download source points to the landing page rather than the secondary domain that supplied the Bun runtime.","The campaign evolved away from loading StreamSaver.js from GitHub Pages while retaining its streaming-download architecture and message names, reducing an external dependency that previously exposed part of the download path.","The article cautions that capabilities documented in earlier related campaigns, such as credential theft and wallet theft, cannot yet be assigned to the current files based on the published evidence."],"referencedReports":[{"title":"SourTrade: Browser-Assembled Malware","url":"https://blog.confiant.com/p/sourtrade-browser-assembled-malware","publisher":"Confiant","context":"The article says Confiant detailed the SourTrade campaign and bases its description of the browser-assembled malware delivery chain on that analysis.","category":"","primary":false},{"title":"The Scam That Won’t Quit: Malicious TradingView Premium Ads Jump from Meta to Google and YouTube","url":"https://www.bitdefender.com/en-us/blog/labs/the-scam-that-wont-quit-malicious-tradingview-premium-ads-jump-from-meta-to-google-and-youtube","publisher":"Bitdefender","context":"The article cites Bitdefender as having documented a related TradingView malvertising cluster in September 2025.","category":"","primary":false},{"title":"JSCEAL Targets Crypto Apps","url":"https://research.checkpoint.com/2025/jsceal-targets-crypto-apps/","publisher":"Check Point Research","context":"The article references Check Point’s tracking of the related campaign’s final payload as the stealer JSCEAL.","category":"","primary":false},{"title":"WeevilProxy","url":"https://www.withsecure.com/en/resources-hub/w-labs/weevilproxy/","publisher":"WithSecure","context":"The article references WithSecure’s tracking of the related campaign’s final payload as WeevilProxy.","category":"","primary":false}],"body":"\u003cp\u003eA malvertising operation called SourTrade is making victims’ browsers assemble the final Windows executable instead of serving one complete malicious file from a fixed URL. Confiant said the campaign has operated since late 2024 and impersonated TradingView, Solana, and Luno to target retail traders and cryptocurrency investors across 12 countries in 25 languages. The landing pages fingerprint visitors, show suspected researchers and bots an empty page, and present selected targets with a convincing copy of the impersonated service.\u003c/p\u003e\n\n\u003cp\u003eThe delivery chain registers a ServiceWorker, builds a SharedWorker from JavaScript embedded in the page, requests a /config response, and retrieves a clean Bun runtime from a secondary domain. The configuration supplies executable structures and malicious JavaScriptCore bytecode, while the worker uses AES-CTR to generate pseudorandom bytes and follows a template to assemble the file from multiple sources. Confiant said each victim can receive a different assembled file because rotating values in the /config response changes the hash while retaining the payload code.\u003c/p\u003e\n\n\u003cp\u003eThe article states that the chain does not rely on a browser vulnerability or remove Mark of the Web, and Confiant’s analysis documents delivery rather than execution inside the browser. The approach limits the value of simple hash-based detections, but the attacker-controlled executable material and bytecode still cross the network. Defenders are advised to examine the full chain, including the ad referral, cloaked landing page, /config request, secondary-domain runtime fetch, and ServiceWorker download.\u003c/p\u003e\n"},{"n":1,"title":"Steam forum ClickFix attacks infect gamers with XMRig cryptominers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/steam-forum-clickfix-attacks-infect-gamers-with-xmrig-cryptominers/","time":"22:37","priority":"SHOULD READ","score":78,"tldr":"Attackers are abusing Steam discussion forums with fake “fixes” that tell users to run PowerShell commands, which secretly install the XMRig cryptominer with persistence and Microsoft Defender exclusions. Users should not run forum-provided commands and should check for the C:\\Windows\\Background folder, XMRig scheduled tasks, and Defender exclusions if they did.","briefOverview":"\u003cp\u003eSteam discussion forums are being abused in ClickFix attacks that present malicious PowerShell commands as fixes for game and computer problems. Threat actors are creating random Steam accounts and replying to posts about issues such as games crashing, lost inventory items, and technical problems. The replies tell users to open PowerShell as an administrator and run a command that quietly downloads and launches an XMRig miner executable.\u003c/p\u003e\n\n\u003cp\u003eThe PowerShell script masquerades as a Windows optimization utility named \u0026ldquo;msf utility \\ PC Opt\u0026rdquo; and displays messages claiming to perform maintenance tasks such as cleaning temporary files, flushing the DNS cache, updating drivers, scanning for malware, and repairing Windows. The article says most of these functions do not perform the tasks they claim, but instead show fake progress messages and pause for random periods to appear legitimate. The malicious activity is hidden in a function named \u0026ldquo;Advanced-Optimization,\u0026rdquo; which requires administrator privileges before continuing.\u003c/p\u003e\n\n\u003cp\u003eWhen run with elevated privileges, the script creates the C:\\Windows\\Background directory and adds it as an exclusion to Microsoft Defender scanning. It downloads the XMRig miner payload from msfconfig[.]icu, installs it as C:\\Windows\\Background\\system.exe, and creates a scheduled task named \u0026ldquo;XMRig-[computer name]\u0026rdquo; to run it with SYSTEM privileges at Windows startup. The article advises users not to run PowerShell commands from unknown forum users and says anyone who executed the command should check for the directory, Defender exclusion, and scheduled task, then remove the miner or consider reinstalling the operating system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are creating random Steam accounts to post replies that appear to offer fixes for game crashes, lost inventory items, and other technical issues.","The malicious replies instruct users to open PowerShell as an administrator and run a command that quietly downloads and launches an XMRig miner executable.","The PowerShell script masquerades as a Windows optimization utility named \"msf utility \\\\ PC Opt\" and displays fake maintenance progress messages to appear legitimate.","When run with administrator privileges, the script creates C:\\Windows\\Background, adds that path as a Microsoft Defender exclusion, downloads a payload from msfconfig[.]icu, and installs it as C:\\Windows\\Background\\system.exe.","The malware creates a scheduled task named \"XMRig-[computer name]\" to launch system.exe with SYSTEM privileges every time Windows starts."],"insights":["The campaign targets users at the moment they are seeking help for an existing problem, which makes the malicious PowerShell command appear like a relevant fix rather than an unsolicited download.","Because victims manually run the command, the article notes that the attack can bypass some security protections that might otherwise block automatically executed malicious code.","The script removes or stops existing XMRig-related tasks, processes, and configuration files before installing its own miner, though the article says it is unclear whether this is meant to clean up a previous version of the same malware or another miner.","The article gives specific compromise checks for affected users: look for C:\\Windows\\Background, a Microsoft Defender exclusion for that path, and a scheduled task beginning with XMRig-.","The article warns that reinstalling the operating system may be safer because there is no way to know whether the downloaded payload performed additional malicious actions while it was running."],"referencedReports":[],"body":"\u003cp\u003eSteam discussion forums are being abused in ClickFix attacks that present malicious PowerShell commands as fixes for game and computer problems. Threat actors are creating random Steam accounts and replying to posts about issues such as games crashing, lost inventory items, and technical problems. The replies tell users to open PowerShell as an administrator and run a command that quietly downloads and launches an XMRig miner executable.\u003c/p\u003e\n\n\u003cp\u003eThe PowerShell script masquerades as a Windows optimization utility named \u0026ldquo;msf utility \\ PC Opt\u0026rdquo; and displays messages claiming to perform maintenance tasks such as cleaning temporary files, flushing the DNS cache, updating drivers, scanning for malware, and repairing Windows. The article says most of these functions do not perform the tasks they claim, but instead show fake progress messages and pause for random periods to appear legitimate. The malicious activity is hidden in a function named \u0026ldquo;Advanced-Optimization,\u0026rdquo; which requires administrator privileges before continuing.\u003c/p\u003e\n\n\u003cp\u003eWhen run with elevated privileges, the script creates the C:\\Windows\\Background directory and adds it as an exclusion to Microsoft Defender scanning. It downloads the XMRig miner payload from msfconfig[.]icu, installs it as C:\\Windows\\Background\\system.exe, and creates a scheduled task named \u0026ldquo;XMRig-[computer name]\u0026rdquo; to run it with SYSTEM privileges at Windows startup. The article advises users not to run PowerShell commands from unknown forum users and says anyone who executed the command should check for the directory, Defender exclusion, and scheduled task, then remove the miner or consider reinstalling the operating system.\u003c/p\u003e\n"},{"n":3,"title":"ShinyHunters data leaks fuel $2,000 sextortion email scam","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/shinyhunters-data-leaks-fuel-2-000-sextortion-email-scam/","time":"14:16","priority":"SHOULD READ","score":78,"tldr":"Scammers are using email addresses from ShinyHunters-leaked breaches to send fake sextortion emails demanding $2,000 in Bitcoin. There is no evidence recipients’ devices were hacked, and victims should not pay or respond.","briefOverview":"\u003cp\u003eThreat actors are using email addresses exposed in data breaches leaked by the ShinyHunters extortion group to send sextortion emails demanding $2,000 in Bitcoin. The emails claim to come from ShinyHunters and say hackers compromised recipients’ devices after obtaining their email addresses from breached company databases. BleepingComputer says the messages appear to be from someone who downloaded previously leaked ShinyHunters data rather than from the extortion group itself, and ShinyHunters denied involvement.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer has seen leaked data from the Amtrak, Hallmark, Substack, Betterment, CarGurus, ADT, Panera Bread, and McGraw Hill breaches used in the campaign. In some cases, BleepingComputer confirmed that targeted email addresses were included in the associated data previously leaked by ShinyHunters. The campaign shows how leaked data can later be reused by unrelated threat actors to make threats appear more legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe emails falsely claim attackers installed an exploit on victims’ computers and phones, giving access to microphones, cameras, keyboards, photos, browsing history, conversations, and contact lists. They also claim to have recorded recipients visiting adult websites and threaten to share intimate videos unless payment is made within 48 hours. The article says there is no indication the sender compromised devices, installed malware, accessed cameras, or monitored recipients’ activity, and recipients should not pay or respond.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are using email addresses exposed in data breaches leaked by ShinyHunters to send sextortion emails demanding $2,000 in Bitcoin.","BleepingComputer saw leaked data from the Amtrak, Hallmark, Substack, Betterment, CarGurus, ADT, Panera Bread, and McGraw Hill breaches used in the campaign.","The emails claim to be from ShinyHunters and falsely state that attackers compromised recipients’ devices, accessed cameras and microphones, and recorded them visiting adult websites.","BleepingComputer contacted ShinyHunters, and the extortion group denied involvement in the sextortion email campaign.","Recipients are advised not to pay the ransom or respond to the sender, because there is no indication the sender accessed their devices or personal activity."],"insights":["The campaign shows that leaked data can continue to harm individuals after publication, even when the new abuse is carried out by actors unrelated to the original breach.","The scammers increase credibility by naming the specific breached company tied to the recipient’s leaked email address, making a generic sextortion message appear targeted.","Betterment specifically noted that knowing someone’s email address does not give an attacker the ability to install malware or access that person’s device.","The article advises recipients who interacted with the Betterment-themed message to contact Betterment’s fraud team, while others should delete the email without replying, paying, clicking links, or opening attachments."],"referencedReports":[],"body":"\u003cp\u003eThreat actors are using email addresses exposed in data breaches leaked by the ShinyHunters extortion group to send sextortion emails demanding $2,000 in Bitcoin. The emails claim to come from ShinyHunters and say hackers compromised recipients’ devices after obtaining their email addresses from breached company databases. BleepingComputer says the messages appear to be from someone who downloaded previously leaked ShinyHunters data rather than from the extortion group itself, and ShinyHunters denied involvement.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer has seen leaked data from the Amtrak, Hallmark, Substack, Betterment, CarGurus, ADT, Panera Bread, and McGraw Hill breaches used in the campaign. In some cases, BleepingComputer confirmed that targeted email addresses were included in the associated data previously leaked by ShinyHunters. The campaign shows how leaked data can later be reused by unrelated threat actors to make threats appear more legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe emails falsely claim attackers installed an exploit on victims’ computers and phones, giving access to microphones, cameras, keyboards, photos, browsing history, conversations, and contact lists. They also claim to have recorded recipients visiting adult websites and threaten to share intimate videos unless payment is made within 48 hours. The article says there is no indication the sender compromised devices, installed malware, accessed cameras, or monitored recipients’ activity, and recipients should not pay or respond.\u003c/p\u003e\n"},{"n":2,"title":"OpenAI confirms ChatGPT is down worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/openai-confirms-chatgpt-is-down-worldwide/","time":"09:31","priority":"MAY READ","score":65,"tldr":"OpenAI confirmed a worldwide outage affecting ChatGPT, Codex, and multiple API endpoints, preventing users from loading chats or sending messages. The company said it applied a fix, and services were reported fully recovered after about 50 minutes.","briefOverview":"\u003cp\u003eChatGPT experienced a major worldwide outage that prevented users from loading chats, including previous conversations. The outage started at approximately 5 AM ET and affected users worldwide, including those in the United States and Europe. Affected users saw the sidebar stuck on loading animations and were unable to send messages because of “too many concurrent requests” errors.\u003c/p\u003e\n\n\u003cp\u003eThe outage also affected OpenAI’s Codex coding platform and the OpenAI API. OpenAI acknowledged the issue on its status page at 5:30 AM ET, saying it was investigating the listed services, and the status page showed as many as 12 API endpoints with issues. OpenAI later said it had applied a fix and was monitoring the situation, and ChatGPT was reported fully recovered by 6 AM ET after almost 50 minutes of disruption.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ChatGPT experienced a major worldwide outage starting at approximately 5 AM ET, affecting users including those in the United States and Europe.","Affected users were unable to load chats, including previous conversations, and could not send messages due to \"too many concurrent requests\" errors.","The outage also affected OpenAI's Codex coding platform and the OpenAI API, with as many as 12 API endpoints listed as having issues on OpenAI's status page.","OpenAI acknowledged the issue on its status page at 5:30 AM ET and said it was investigating the affected services.","OpenAI said it applied a fix, and ChatGPT was reported fully recovered by 6 AM ET after an outage lasting almost 50 minutes."],"insights":["The incident was not limited to the ChatGPT website, because the same disruption affected Codex and as many as 12 OpenAI API endpoints listed on the status page.","OpenAI reported that it had applied a fix while BleepingComputer still observed problems in testing, showing that a vendor fix notice may not mean every user is immediately restored.","The outage lasted almost 50 minutes from its approximate start time to full recovery, giving affected users a concrete window for when ChatGPT and API services were unavailable."],"referencedReports":[],"body":"\u003cp\u003eChatGPT experienced a major worldwide outage that prevented users from loading chats, including previous conversations. The outage started at approximately 5 AM ET and affected users worldwide, including those in the United States and Europe. Affected users saw the sidebar stuck on loading animations and were unable to send messages because of “too many concurrent requests” errors.\u003c/p\u003e\n\n\u003cp\u003eThe outage also affected OpenAI’s Codex coding platform and the OpenAI API. OpenAI acknowledged the issue on its status page at 5:30 AM ET, saying it was investigating the listed services, and the status page showed as many as 12 API endpoints with issues. OpenAI later said it had applied a fix and was monitoring the situation, and ChatGPT was reported fully recovered by 6 AM ET after almost 50 minutes of disruption.\u003c/p\u003e\n"}]</script>
