<script type="application/json" id="dl-articles">[{"n":7,"title":"Gyazo server flaw exploited to steal 23.6 million user records","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/gyazo-server-flaw-exploited-to-steal-236-million-user-records/","time":"16:00","priority":"MUST READ","score":93,"tldr":"Gyazo suffered a server vulnerability breach that exposed roughly 23.6 million user records and metadata for 490 million images, potentially including credentials, session tokens, and private-image information. The service was taken offline while Helpfeel investigates, and users should reset reused passwords.","briefOverview":"\u003cp\u003eGyazo said attackers exploited a server vulnerability on September 11, 2026, gaining unauthorized access to its database and stealing approximately 23.62 million user records. The company detected suspicious activity the following day and fixed the weakness, but said the data had already been taken. Gyazo temporarily suspended its service while it conducts maintenance and investigates the incident with external experts.\u003c/p\u003e\n\n\u003cp\u003eThe exposed records may include names, email addresses, password hashes, user and device IDs, login session IDs, X integration tokens, Google SSO email addresses, profile information, subscription details, billing status, and usage statistics. Gyazo also said 490 million image metadata records were exposed, mostly tied to images uploaded before January 2019, including image IDs, upload IP addresses, location information, extracted text, titles, and source URLs. Because image IDs may enable access to associated content and attackers obtained a list of private images, Gyazo disabled access to affected files and cannot rule out that some private images were viewed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Gyazo said attackers exploited a server vulnerability on September 11, 2026, and accessed its database containing approximately 23.62 million user records.","The exposed user information may include names or nicknames, email addresses, password hashes, user and device IDs, login session IDs, X integration tokens, Google SSO email addresses, profile details, subscription information, billing status, and usage statistics.","Gyazo said 490 million image metadata records were exposed, mostly for images uploaded before January 2019, including image IDs, upload IP addresses, User-Agent strings, EXIF location data, OCR-extracted text, image titles, source URLs, and hashed passphrases for private images.","Gyazo temporarily suspended its service and disabled access to files whose records were exposed because image IDs could potentially be used to access corresponding content.","Gyazo is notifying affected users directly and advises all users to change their passwords on Gyazo and any other platforms where they reused the same credentials."],"insights":["The incident affects more than account records: exposed image IDs may be usable to reach associated files, prompting Gyazo to disable access to files linked to exposed records.","The exposed data includes both login session IDs and X integration tokens, which are distinct from passwords and increase the importance of reviewing account access after the breach.","Most of the 490 million exposed image metadata records relate to images uploaded before January 2019, indicating that older uploads are a major part of the exposure.","Gyazo cannot rule out that some private images were viewed because the attackers obtained a list identifying them, even though the company found no indication that data was deleted.","Gyazo said its investigation found no evidence that other Helpfeel or Cosense services had data stolen."],"referencedReports":[],"body":"\u003cp\u003eGyazo said attackers exploited a server vulnerability on September 11, 2026, gaining unauthorized access to its database and stealing approximately 23.62 million user records. The company detected suspicious activity the following day and fixed the weakness, but said the data had already been taken. Gyazo temporarily suspended its service while it conducts maintenance and investigates the incident with external experts.\u003c/p\u003e\n\n\u003cp\u003eThe exposed records may include names, email addresses, password hashes, user and device IDs, login session IDs, X integration tokens, Google SSO email addresses, profile information, subscription details, billing status, and usage statistics. Gyazo also said 490 million image metadata records were exposed, mostly tied to images uploaded before January 2019, including image IDs, upload IP addresses, location information, extracted text, titles, and source URLs. Because image IDs may enable access to associated content and attackers obtained a list of private images, Gyazo disabled access to affected files and cannot rule out that some private images were viewed.\u003c/p\u003e\n"},{"n":18,"title":"Transparent Tribe Deploys New Rust Backdoor Using Private GitHub Repositories for C2","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/transparent-tribe-deploys-new-rust.html","time":"15:24","priority":"MUST READ","score":92,"tldr":"Pakistan-aligned Transparent Tribe (APT36) is targeting government and defense organizations in India and Afghanistan with new Rust-based tools, including the RUSTYSHADE backdoor. The campaign uses private GitHub repositories for encrypted command-and-control, alongside USB propagation and Windows/Linux file stealers.","briefOverview":"\u003cp\u003eZscaler ThreatLabz attributed Operation RapidRust to Pakistan-aligned Transparent Tribe, also known as APT36 and Earth Karkaddan. The campaign targeted government and defense entities in India and Afghanistan and used four previously undocumented tools: RUSTYSHADE, RUSTYMOVE, PSNATCH, and BASHNATCH. The group also used typosquatted domains resembling The Print and India Today to host malicious PowerShell scripts and payloads.\u003c/p\u003e\n\n\u003cp\u003eRUSTYSHADE is a Rust-based backdoor that uses attacker-controlled private GitHub repositories and the GitHub REST API for encrypted communications, including commands, results, reconnaissance data, screenshots, webcam images, and stolen files. PSNATCH and BASHNATCH collect files from Windows and Linux systems, while RUSTYMOVE monitors removable drives and copies staged malicious files to them for USB-based spread. Zscaler observed post-compromise reconnaissance and next-stage payload deployment, with commands issued on weekdays between 4 a.m. and 11 a.m. UTC during activity recorded between August 20 and September 1, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz attributed Operation RapidRust to Pakistan-aligned Transparent Tribe (APT36), which targeted government and defense entities in India and Afghanistan.","The campaign used four previously undocumented tools: the Rust-based RUSTYSHADE backdoor, the RUSTYMOVE USB propagation utility, and the PSNATCH and BASHNATCH file stealers.","RUSTYSHADE uses attacker-controlled private GitHub repositories and the GitHub REST API to receive encrypted commands, store system information, and send collected data.","PSNATCH and BASHNATCH collect files from Windows and Linux systems, while RUSTYMOVE copies staged malicious files to detected external removable drives.","The actors also registered domains impersonating The Print and India Today to host malicious PowerShell scripts and payloads."],"insights":["The attackers used separate files in private GitHub repositories for commands, command results, system details, check-ins, screenshots, webcam images, and stolen files, creating a structured remote-control channel through a legitimate development platform.","RUSTYMOVE was designed to monitor removable drives continuously and place a ZIP archive plus a disguised PDF shortcut in the root of each drive, indicating that the campaign included a mechanism for spreading between systems via USB media.","The Windows file stealer limited collection to files modified within the previous three months and capped theft at 1 GB per file and 5 GB per run.","Observed command activity was restricted to weekdays between 4 a.m. and 11 a.m. UTC, which provides a specific operational pattern reported for this campaign."],"referencedReports":[{"title":"Operation RapidRust: APT36 Deploys RUSTYSHADE, RUSTYMOVE, PSNATCH, and BASHNATCH","url":"https://www.zscaler.com/blogs/security-research/operation-rapidrust-apt36-deploys-rustyshade-rustymove-psnatch-and","publisher":"zscaler-threatlabz","context":"The article relies on this Zscaler ThreatLabz technical report for its attribution and analysis of the Operation RapidRust campaign.","category":"research","primary":true}],"body":"\u003cp\u003eZscaler ThreatLabz attributed Operation RapidRust to Pakistan-aligned Transparent Tribe, also known as APT36 and Earth Karkaddan. The campaign targeted government and defense entities in India and Afghanistan and used four previously undocumented tools: RUSTYSHADE, RUSTYMOVE, PSNATCH, and BASHNATCH. The group also used typosquatted domains resembling The Print and India Today to host malicious PowerShell scripts and payloads.\u003c/p\u003e\n\n\u003cp\u003eRUSTYSHADE is a Rust-based backdoor that uses attacker-controlled private GitHub repositories and the GitHub REST API for encrypted communications, including commands, results, reconnaissance data, screenshots, webcam images, and stolen files. PSNATCH and BASHNATCH collect files from Windows and Linux systems, while RUSTYMOVE monitors removable drives and copies staged malicious files to them for USB-based spread. Zscaler observed post-compromise reconnaissance and next-stage payload deployment, with commands issued on weekdays between 4 a.m. and 11 a.m. UTC during activity recorded between August 20 and September 1, 2026.\u003c/p\u003e\n"},{"n":4,"title":"New Check Point flaw lets hackers execute code with root privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-warns-critical-flaw-lets-hackers-execute-code-as-root/","time":"09:34","priority":"SHOULD READ","score":88,"tldr":"Check Point patched CVE-2026-91843, a critical stack-based buffer overflow that can give unauthenticated attackers root remote code execution on Security Management Server and Log Server systems. Organizations should apply the LivePatch or restrict trusted-client access and monitor for “Username too long” failed-login alerts.","briefOverview":"\u003cp\u003eCheck Point Software released security updates for CVE-2026-91843, a critical stack-based buffer overflow in the login process of Security Management Server instances. The flaw also affects the company’s Log Server, which collects and stores logs from Check Point firewalls. An attacker without privileges can exploit it in a low-complexity attack requiring no user interaction to execute code remotely with root privileges.\u003c/p\u003e\n\n\u003cp\u003eCheck Point has not reported active exploitation of CVE-2026-91843, but says teams can look for “Administrator failed to log in: Username too long” alerts in Audit and Admin login logs. Customers unable to deploy the latest LivePatch can harden vulnerable systems and restrict SmartConsole access to trusted IP addresses or subnets. The article also notes that Check Point recently patched critical flaws CVE-2026-85102 and CVE-2026-85103, and the Dutch National Cyber Security Centre expects exploitation attempts against those two issues soon.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point released security updates for CVE-2026-91843, a critical stack-based buffer overflow in the login process for Security Management Server instances.","The flaw also affects Check Point Log Server systems and can allow attackers without privileges to execute code remotely with root privileges without user interaction.","Customers unable to deploy the latest LivePatch can harden affected systems and restrict access to trusted IP addresses or subnets through SmartConsole.","Check Point said possible CVE-2026-91843 exploitation attempts can be identified through “Administrator failed to log in: Username too long” alerts in Audit and Admin login logs.","Check Point has not reported CVE-2026-91843 as actively exploited, but the Dutch National Cyber Security Centre warned that exploitation of the recently patched CVE-2026-85102 and CVE-2026-85103 flaws is expected soon."],"insights":["CVE-2026-91843 can be detected through a highly specific log indicator: an “Administrator failed to log in: Username too long” alert in Audit and Admin login logs.","Organizations that cannot immediately install the LivePatch have a concrete interim option: limit SmartConsole trusted-client access to known IP addresses or subnets.","Check Point stated that the separate CVE-2026-85103 flaw affects every Security Management Server deployment regardless of configuration, including environments where VPN is not enabled or configured.","Although CVE-2026-91843 is not known to be exploited, the article notes that other recent Check Point authentication-bypass zero-days were exploited and that Dutch authorities expect attempts against CVE-2026-85102 and CVE-2026-85103 soon."],"referencedReports":[{"title":"Check Point Gateway and Management Hardening","url":"https://sc1.checkpoint.com/documents/Check_Point_Gateway_and_Management_Hardening/Hardening_GW_and_MGMT/Introduction.html","publisher":"check-point-software","context":"The article links to this Check Point hardening guide as a temporary mitigation resource for customers unable to deploy the latest LivePatch.","category":"guide","primary":false}],"body":"\u003cp\u003eCheck Point Software released security updates for CVE-2026-91843, a critical stack-based buffer overflow in the login process of Security Management Server instances. The flaw also affects the company’s Log Server, which collects and stores logs from Check Point firewalls. An attacker without privileges can exploit it in a low-complexity attack requiring no user interaction to execute code remotely with root privileges.\u003c/p\u003e\n\n\u003cp\u003eCheck Point has not reported active exploitation of CVE-2026-91843, but says teams can look for “Administrator failed to log in: Username too long” alerts in Audit and Admin login logs. Customers unable to deploy the latest LivePatch can harden vulnerable systems and restrict SmartConsole access to trusted IP addresses or subnets. The article also notes that Check Point recently patched critical flaws CVE-2026-85102 and CVE-2026-85103, and the Dutch National Cyber Security Centre expects exploitation attempts against those two issues soon.\u003c/p\u003e\n"},{"n":10,"title":"North Korean hackers infect thousands of devices across 100 countries as part of ‘WaterPlum’ campaign","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/north-korean-hackers-infect-thousands-of-devices-waterplum-scheme","time":"04:00","priority":"SHOULD READ","score":88,"tldr":"A North Korean campaign dubbed WaterPlum infected at least 30,000 devices in 100 countries by posing as AI and blockchain recruiters, stealing more than $10.5 million and compromising roughly 7,000 cryptocurrency wallets. The operation also supports North Korea’s IT-worker schemes by retaining access to victims’ devices and potentially using stolen identities to infiltrate technology companies.","briefOverview":"\u003cp\u003eNorth Korean cyber actors operating under the name WaterPlum allegedly infected at least 30,000 devices in 100 countries between December 2025 and July 2026. A joint advisory from the FBI, U.S. Defense Department, Japan’s National Police Agency, and authorities in Australia and Germany said the group stole more than $10.5 million and obtained funds or credentials from about 7,000 cryptocurrency wallets. Its primary targets were web designers, engineers, and cryptocurrency specialists seeking work.\u003c/p\u003e\n\n\u003cp\u003eWaterPlum posed as AI or blockchain companies and approached applicants through social media, gig-work sites, and freelance portals, then told them to download files during interviews. Japanese police identified BeaverTail, InvisibleFerret, OtterCookie, OtterCandy, and StoatWaffle malware variants on victim devices; the actors also used information-stealing software and remote-control tools to retain access. Authorities linked the campaign to North Korean IT-worker schemes, noting shared IP addresses with laptop farms and evidence that stolen identities and AI face-swapping, text-to-speech, and translation tools were used to obtain technology jobs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The WaterPlum campaign, attributed to North Korean cyber actors, infected at least 30,000 devices across 100 countries between December 2025 and July 2026.","The campaign stole more than $10.5 million and compromised funds or credentials from about 7,000 cryptocurrency wallets by targeting job seekers, particularly web designers, engineers, and cryptocurrency specialists.","WaterPlum actors posed as AI or blockchain companies and instructed applicants contacted through social media, gig-work sites, and freelance portals to download files during interviews.","Japanese police found BeaverTail, InvisibleFerret, OtterCookie, OtterCandy, and StoatWaffle malware variants on victims’ devices, along with tools used to steal information and maintain remote access.","Authorities linked WaterPlum to North Korea’s IT-worker schemes, including laptop farms and the use of stolen identities to obtain technology jobs."],"insights":["WaterPlum’s theft of personal cryptocurrency can also serve as a stepping stone for later access to employers, because the actors keep access to victim devices in case those victims are hired by technology firms.","Japanese authorities found that WaterPlum actors and North Korean IT workers used the same IP addresses when accessing laptop farms or applying to Japanese cryptocurrency companies, directly linking the two schemes.","The disruption of a laptop farm in Japan exposed the use of AI face swapping, Japanese-accent text-to-speech, and translation tools to help North Korean workers appear to be local job candidates.","The advisory documented cases in which North Korean IT workers went beyond earning income: one published a company’s proprietary source code after a payment dispute, while another defaced and disabled an employer’s website."],"referencedReports":[{"title":"WaterPlum advisory","url":"https://www.ic3.gov/CSA/2026/260918.pdf","publisher":"fbi, u.s. department of defense, japan national police agency","context":"The article relies on this joint advisory for its findings on the WaterPlum campaign targeting job seekers and cryptocurrency wallets.","category":"advisory","primary":true}],"body":"\u003cp\u003eNorth Korean cyber actors operating under the name WaterPlum allegedly infected at least 30,000 devices in 100 countries between December 2025 and July 2026. A joint advisory from the FBI, U.S. Defense Department, Japan’s National Police Agency, and authorities in Australia and Germany said the group stole more than $10.5 million and obtained funds or credentials from about 7,000 cryptocurrency wallets. Its primary targets were web designers, engineers, and cryptocurrency specialists seeking work.\u003c/p\u003e\n\n\u003cp\u003eWaterPlum posed as AI or blockchain companies and approached applicants through social media, gig-work sites, and freelance portals, then told them to download files during interviews. Japanese police identified BeaverTail, InvisibleFerret, OtterCookie, OtterCandy, and StoatWaffle malware variants on victim devices; the actors also used information-stealing software and remote-control tools to retain access. Authorities linked the campaign to North Korean IT-worker schemes, noting shared IP addresses with laptop farms and evidence that stolen identities and AI face-swapping, text-to-speech, and translation tools were used to obtain technology jobs.\u003c/p\u003e\n"},{"n":13,"title":"Public Exploits Released for Four Linux Kernel Flaws That Enable Local Root","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/public-exploits-released-for-four-linux.html","time":"18:02","priority":"SHOULD READ","score":85,"tldr":"Public proof-of-concept exploits for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—can allow local users to gain root access on unpatched systems. Organizations should install distribution updates containing all four fixes, as disabling unprivileged user namespaces only mitigates three of the flaws.","briefOverview":"\u003cp\u003eSecurity researcher Asim Manizada released working exploit code for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—that can allow a local user to gain root access. Linux kernel maintainers fixed all four flaws in recent weeks, but systems running older kernels remain at risk now that public exploit code is available. The exploits are tuned to specific kernel builds, may crash systems, and have not been reported as used in real-world attacks.\u003c/p\u003e\n\n\u003cp\u003eDirtyAH6, TUNderflow, and PPPoEject can be reached by ordinary users when unprivileged user namespaces are enabled, while DiagSpill needs no user namespaces or special privileges if the SCTP networking module is available. Two flaws can be triggered remotely only in narrow scenarios and mainly to crash a host: DirtyAH6 on certain IPv6 routers or gateways, and DiagSpill when non-default SCTP options are enabled. Users should update to kernels containing all four fixes and consult their Linux distribution\u0026rsquo;s security advisories, while disabling unprivileged user namespaces or unused affected features can reduce some exposure when patching is delayed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researcher Asim Manizada released working proof-of-concept exploits for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—that can allow a local user to gain root access.","All four flaws have been fixed by Linux kernel maintainers, but systems running older kernels remain exposed now that exploit code is public.","DirtyAH6, TUNderflow, and PPPoEject require unprivileged user namespaces for an ordinary user to reach them, while DiagSpill requires no user namespaces if the SCTP networking module is available.","The first stable Linux kernel versions stated to contain the complete set of fixes are 5.10.270, 5.15.221, 6.1.188, 6.6.157, 6.12.109, 6.18.50, and 7.2.4.","The article says there are no reports that these flaws have been used in real-world attacks, and the released exploits are tuned to specific kernel builds and may crash systems."],"insights":["Disabling unprivileged user namespaces can reduce exposure to three of the four flaws, but it does not mitigate DiagSpill or protect against processes that already have network-administration privileges.","Two flaws have narrow network-triggered crash scenarios: DirtyAH6 can affect IPv6 routers or gateways adding an Authentication Header in transport mode, while DiagSpill requires non-default SCTP options to be enabled.","Although all four bugs are in different networking components, their underlying coding mistakes are longstanding memory-safety issues ranging from 10 to 21 years old.","The public exploits were deliberately released after a coordinated hold with Linux distributions, but users must check their distribution advisories because distributions may backport fixes without using the upstream kernel version numbers."],"referencedReports":[{"title":"LPE Quartet","url":"https://heyitsas.im/posts/lpe-quartet/","publisher":"Asim Manizada","context":"The article cites Manizada's technical write-up containing working exploits and analysis of the four Linux kernel flaws.","category":"research","primary":true}],"body":"\u003cp\u003eSecurity researcher Asim Manizada released working exploit code for four Linux kernel flaws—DirtyAH6, TUNderflow, PPPoEject, and DiagSpill—that can allow a local user to gain root access. Linux kernel maintainers fixed all four flaws in recent weeks, but systems running older kernels remain at risk now that public exploit code is available. The exploits are tuned to specific kernel builds, may crash systems, and have not been reported as used in real-world attacks.\u003c/p\u003e\n\n\u003cp\u003eDirtyAH6, TUNderflow, and PPPoEject can be reached by ordinary users when unprivileged user namespaces are enabled, while DiagSpill needs no user namespaces or special privileges if the SCTP networking module is available. Two flaws can be triggered remotely only in narrow scenarios and mainly to crash a host: DirtyAH6 on certain IPv6 routers or gateways, and DiagSpill when non-default SCTP options are enabled. Users should update to kernels containing all four fixes and consult their Linux distribution\u0026rsquo;s security advisories, while disabling unprivileged user namespaces or unused affected features can reduce some exposure when patching is delayed.\u003c/p\u003e\n"},{"n":17,"title":"New WordPress Click2Shell Flaw Forces Theme Installs, Can Chain to Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/new-wordpress-click2shell-flaw-forces.html","time":"16:56","priority":"SHOULD READ","score":85,"tldr":"WordPress patched Click2Shell in version 7.1.1, a flaw that lets a crafted link cause a logged-in administrator’s browser to install and preview an inactive WordPress.org theme. While the core bug alone cannot install arbitrary code, researchers chained it with a vulnerable theme to achieve server-side code execution, so site owners should update promptly.","briefOverview":"\u003cp\u003eWordPress released security fixes for Click2Shell, a flaw that can cause a logged-in administrator who opens a crafted link to install and preview an inactive theme from the official WordPress.org directory. The fix shipped in WordPress 7.1.1 on September 17 and was also provided to supported branches back to 4.7. WordPress advised site owners to update immediately, though the article says there is no evidence the flaw has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eThe issue arises because WordPress.org and the administrator’s browser interpret parts of the same link differently, allowing attacker-added characters to make WordPress’s own script click an Install button. The administrator’s existing session supplies the permissions and security token required for installation, while the installed theme remains inactive and does not visibly change the site. Pwn.ai demonstrated that the core flaw could be combined with a separate weakness in the Mobile Repair Zone theme, whose handler could download and run code without permission or token checks, potentially allowing attacker-controlled code to run on the server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress released security updates, including WordPress 7.1.1, to fix Click2Shell, a flaw that can cause a logged-in administrator who opens a crafted link to install and preview an inactive theme from WordPress.org.","The Click2Shell core flaw does not accept an arbitrary theme ZIP, but pwn.ai demonstrated that it can be chained with a separate vulnerable theme to run attacker-controlled code on a server.","The researchers used the Mobile Repair Zone theme, whose background handler could download and run code from a supplied web address without checking permissions or a security token.","The forced-installed theme remains inactive, so the site’s appearance does not change, but WordPress can load a theme’s PHP code while creating a preview in its Customizer tool.","WordPress says supported branches back to 4.7 received fixes, and there is no indication that Click2Shell has been exploited in real-world attacks."],"insights":["The flaw works because WordPress.org and the administrator’s browser interpret the same crafted link differently, allowing added punctuation to redirect WordPress’s own page script to the Install button.","An attacker does not need to provide administrator credentials or the installation security token because the logged-in administrator’s existing session supplies both after opening the link.","Keeping the installed theme inactive does not fully prevent risk, since WordPress can load a theme’s PHP code when generating a Customizer preview before the theme is activated.","There is no separate workaround described by WordPress or pwn.ai for sites that cannot update immediately, making a core update the stated way to close the demonstrated attack chain."],"referencedReports":[{"title":"Click2Shell","url":"https://pwn.ai/blog/click2shell","publisher":"pwn.ai","context":"The article relies on pwn.ai researchers’ technical analysis of the Click2Shell flaw and its chain to server-side code execution through a vulnerable theme.","category":"research","primary":true},{"title":"WordPress 7.1.1 Maintenance and Security Release","url":"https://wordpress.org/news/2026/09/wordpress-7-1-1-maintenance-and-security-release/","publisher":"wordpress","context":"The article cites WordPress’s security-release notice for the update that fixes the Click2Shell issue.","category":"advisory","primary":false}],"body":"\u003cp\u003eWordPress released security fixes for Click2Shell, a flaw that can cause a logged-in administrator who opens a crafted link to install and preview an inactive theme from the official WordPress.org directory. The fix shipped in WordPress 7.1.1 on September 17 and was also provided to supported branches back to 4.7. WordPress advised site owners to update immediately, though the article says there is no evidence the flaw has been used in real attacks.\u003c/p\u003e\n\n\u003cp\u003eThe issue arises because WordPress.org and the administrator’s browser interpret parts of the same link differently, allowing attacker-added characters to make WordPress’s own script click an Install button. The administrator’s existing session supplies the permissions and security token required for installation, while the installed theme remains inactive and does not visibly change the site. Pwn.ai demonstrated that the core flaw could be combined with a separate weakness in the Mobile Repair Zone theme, whose handler could download and run code without permission or token checks, potentially allowing attacker-controlled code to run on the server.\u003c/p\u003e\n"},{"n":26,"title":"Happy Birthday, Shai-Hulud","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/happy-birthday-shai-hulud?utm_medium=feed","time":"18:46","priority":"SHOULD READ","score":85,"tldr":"One year after the first npm Shai-Hulud compromise, its credential-stealing, self-propagating supply-chain technique has evolved into repeated waves run by multiple actors, aided by publicly released code and CI token hijacking. Although two alleged TeamPCP members were arrested, the original worm’s authors remain unidentified and the threat persists across the npm ecosystem.","briefOverview":"\u003cp\u003eA malicious version of @ctrl/tinycolor published to npm in September 2025 launched the first known self-propagating worm in the npm ecosystem. The Shai-Hulud payload used TruffleHog to search for npm tokens, GitHub credentials, and cloud keys, sent stolen secrets to attacker-controlled locations, and used stolen npm tokens to infect and republish other packages. It also created a GitHub Actions workflow for persistence, and researchers ultimately counted compromised packages in the hundreds.\u003c/p\u003e\n\n\u003cp\u003eLater waves expanded the threat through pre-install execution, new payloads, and a destructive fallback that could attempt to wipe a user’s home directory. In 2026, TeamPCP released source code for a Shai-Hulud worm framework, while multiple operators began running similar campaigns; one May burst pushed more than 400 malicious versions across 172 packages by hijacking short-lived OIDC tokens from CI. Australian police arrested two alleged TeamPCP members in August 2026, but the original authors of the September and November 2025 attacks remain unidentified, and the publicly copied code continues to enable new campaigns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A malicious version of @ctrl/tinycolor published to npm in September 2025 initiated the first known self-propagating worm in the npm ecosystem, which spread into dozens of packages and CrowdStrike’s npm namespace.","The Shai-Hulud payload used TruffleHog to find npm tokens, GitHub credentials, and cloud keys, sent discovered secrets to attacker-controlled locations, added a GitHub Actions workflow for persistence, and republished itself using stolen npm tokens.","A November 2025 wave moved execution to the pre-install step, introduced setup_bun.js and bun_environment.js, and included a fallback that could attempt to wipe a user’s home directory.","Later 2026 campaigns used publicly released Shai-Hulud source code, including a May burst that pushed more than 400 malicious versions across 172 packages by hijacking short-lived OIDC tokens from CI.","Australian Federal Police arrested two men in Western Australia on August 26, 2026 over alleged TeamPCP involvement, but the original authors of the September and November 2025 Shai-Hulud attacks remain unidentified."],"insights":["The threat evolved beyond stolen long-lived credentials: one May 2026 wave spread through hijacked short-lived OIDC tokens from CI systems, showing that short-lived access tokens did not prevent that campaign.","Moving malicious code to the pre-install step in November 2025 expanded exposure from package users to developer machines and automated build pipelines before installation completed.","TeamPCP’s release of the worm’s source code in May 2026 lowered the barrier for other operators, and the article reports that multiple actors were running Shai-Hulud-style campaigns by mid-2026.","Arrests of alleged TeamPCP operators do not resolve attribution for the original Shai-Hulud incidents, because the September and November 2025 attacks were never definitively linked to TeamPCP."],"referencedReports":[],"body":"\u003cp\u003eA malicious version of @ctrl/tinycolor published to npm in September 2025 launched the first known self-propagating worm in the npm ecosystem. The Shai-Hulud payload used TruffleHog to search for npm tokens, GitHub credentials, and cloud keys, sent stolen secrets to attacker-controlled locations, and used stolen npm tokens to infect and republish other packages. It also created a GitHub Actions workflow for persistence, and researchers ultimately counted compromised packages in the hundreds.\u003c/p\u003e\n\n\u003cp\u003eLater waves expanded the threat through pre-install execution, new payloads, and a destructive fallback that could attempt to wipe a user’s home directory. In 2026, TeamPCP released source code for a Shai-Hulud worm framework, while multiple operators began running similar campaigns; one May burst pushed more than 400 malicious versions across 172 packages by hijacking short-lived OIDC tokens from CI. Australian police arrested two alleged TeamPCP members in August 2026, but the original authors of the September and November 2025 attacks remain unidentified, and the publicly copied code continues to enable new campaigns.\u003c/p\u003e\n"},{"n":6,"title":"Fake LastPass Authenticator GitHub repos push new Rapuncel infostealer","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fake-lastpass-authenticator-github-repos-push-new-rapuncel-infostealer/","time":"15:19","priority":"SHOULD READ","score":84,"tldr":"SEO-optimized fake GitHub repositories impersonating LastPass and dozens of other brands are distributing the Rapuncel infostealer, which uses a Microsoft-signed kernel driver to disable security products. Users should download software only from official sources and avoid promoted or dubious search results.","briefOverview":"\u003cp\u003eAn ongoing campaign uses SEO-optimized GitHub repositories impersonating LastPass and at least 39 other companies to distribute a previously undocumented information stealer called Rapuncel. Victims searching for LastPass Authenticator or other software may follow links to fake repositories, where download buttons redirect them to payload servers. The servers deliver ZIP archives inflated to as much as 148 MB, apparently to evade security scans.\u003c/p\u003e\n\n\u003cp\u003eThe archives contain a renamed copy of Microsoft Visual Studio CoreCLR Debugger, vsdbg.exe, configured to sideload a malicious DLL that installs Rapuncel and the Alinubx.sys kernel driver. The Microsoft-signed driver is disguised as an NVIDIA component and is designed to terminate 145 antivirus and endpoint detection and response processes, including products protected by Protected Process Light. Rapuncel then steals browser credentials, cryptocurrency-wallet data, messaging and gaming session credentials, Windows Credential Manager contents, selected documents, screenshots, and system details before sending compressed data to an external endpoint. The malware also persists through a Windows service so it can terminate reactivated security tools after reboot.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An ongoing campaign uses search-optimized fake GitHub repositories impersonating LastPass and at least 39 other companies to distribute the previously undocumented Rapuncel information stealer.","Victims who click download buttons on the fake repositories are redirected to servers that provide ZIP files inflated to as much as 148 MB, containing a renamed Microsoft Visual Studio CoreCLR Debugger configured to load a malicious DLL.","The payload installs Rapuncel and a Microsoft-signed Alinubx.sys kernel driver disguised as an NVIDIA component, which is designed to terminate 145 antivirus and endpoint security processes.","Rapuncel steals credentials from 25 web browsers, data from 30 cryptocurrency wallets, session credentials for Discord, Steam, and Telegram, Windows Credential Manager contents, selected documents, screenshots, and system information.","The malware sends compressed stolen data to 2.26.126[.]50 over raw TCP and maintains persistence through a Windows service that can terminate reactivated security tools after reboot."],"insights":["The campaign uses a driver signed through Microsoft’s Windows Hardware Compatibility Publisher chain that is not currently on Microsoft’s vulnerable-driver blocklist, allowing it to terminate security products despite their protected-process safeguards.","Rather than using an obviously suspicious executable, the installer is a renamed legitimate Microsoft Visual Studio CoreCLR Debugger that loads a malicious DLL alongside it.","Rapuncel is designed to bypass Google’s app-bound browser-encryption protection by placing a helper component inside Chrome, Edge, and related browsers and using their own elevation service.","The malicious ZIP archives are deliberately enlarged to up to 148 MB, an apparent attempt to evade security scanning, while the malware’s Windows service lets it disable security tools again after a reboot."],"referencedReports":[{"title":"LastPass \u0026 Delphos report Rapuncel Infostealer","url":"https://blog.lastpass.com/posts/lastpass-delphos-report-rapuncel-infostealer","publisher":"lastpass and delphos labs","context":"The article relies on this LastPass and Delphos Labs report for technical details about the Rapuncel campaign and its security-software-disabling driver.","category":"research","primary":true}],"body":"\u003cp\u003eAn ongoing campaign uses SEO-optimized GitHub repositories impersonating LastPass and at least 39 other companies to distribute a previously undocumented information stealer called Rapuncel. Victims searching for LastPass Authenticator or other software may follow links to fake repositories, where download buttons redirect them to payload servers. The servers deliver ZIP archives inflated to as much as 148 MB, apparently to evade security scans.\u003c/p\u003e\n\n\u003cp\u003eThe archives contain a renamed copy of Microsoft Visual Studio CoreCLR Debugger, vsdbg.exe, configured to sideload a malicious DLL that installs Rapuncel and the Alinubx.sys kernel driver. The Microsoft-signed driver is disguised as an NVIDIA component and is designed to terminate 145 antivirus and endpoint detection and response processes, including products protected by Protected Process Light. Rapuncel then steals browser credentials, cryptocurrency-wallet data, messaging and gaming session credentials, Windows Credential Manager contents, selected documents, screenshots, and system details before sending compressed data to an external endpoint. The malware also persists through a Windows service so it can terminate reactivated security tools after reboot.\u003c/p\u003e\n"},{"n":11,"title":"Hacking group ‘NightEagle’ targeting China’s high-tech sector expands operations to Russia","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/hacking-group-nighteagle-expands-russia-china","time":"13:24","priority":"SHOULD READ","score":84,"tldr":"NightEagle (APT-Q-95), a cyberespionage group previously focused on China’s high-tech and defense sectors, has expanded to Russian organizations. Kaspersky reports it uses stolen VPN credentials, Microsoft Exchange compromise, and the GhostContainer backdoor to persist, steal credentials, and target domain controllers.","briefOverview":"\u003cp\u003eNightEagle, also known as APT-Q-95, has expanded from targeting sensitive technology and defense organizations in China to targeting Russian businesses, according to Kaspersky. The group has been active since at least 2023, and Kaspersky investigated several Russian incidents over the past year. The company did not identify the affected organizations, disclose their number, or determine the attackers’ motivation.\u003c/p\u003e\n\n\u003cp\u003eIn most cases, the attackers used stolen VPN credentials to enter corporate networks, targeted Microsoft Exchange servers, and deployed the GhostContainer backdoor. GhostContainer enables remote control of compromised servers, can evade some Windows security and logging mechanisms, and can redirect network traffic. The group also exploited Active Directory weaknesses to elevate privileges and move across systems, ultimately attempting to compromise domain controllers, while using GitHub repositories disguised as legitimate software to store tool archives.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky reported that NightEagle, also known as APT-Q-95, expanded from targeting organizations in Asia to targeting Russian businesses over the past year.","In most Russian incidents, the group used stolen credentials to access corporate networks through VPNs, then targeted Microsoft Exchange servers and installed the GhostContainer backdoor.","GhostContainer can remotely control compromised servers, evade some Windows security and logging mechanisms, and redirect network traffic.","After obtaining access, the attackers exploited Active Directory weaknesses to gain privileges, move across systems, steal credentials, impersonate users, and attempt to compromise domain controllers.","QiAnXin said in July 2025 that NightEagle had targeted Chinese organizations in defense, semiconductor, artificial intelligence, and quantum-technology sectors since at least 2023."],"insights":["NightEagle’s shift to Russian targets coincides with updates to its methods for maintaining access and moving between systems, according to Kaspersky.","Researchers could not determine exactly how GhostContainer was initially placed on Microsoft Exchange servers, although Kaspersky noted a previously observed method involving Exchange encryption keys and in-memory execution.","The group used GitHub to host tool archives under names resembling legitimate software, including AdobeSync and TrueConf.","Despite earlier Chinese researchers associating NightEagle with North America, the article states that this attribution has not been independently confirmed."],"referencedReports":[{"title":"NightEagle APT: GhostContainer and tunneling","url":"https://securelist.ru/tr/nighteagle-apt-ghostcontainer-and-tunneling/117051/","publisher":"kaspersky","context":"The article relies on Kaspersky's research into several NightEagle incidents affecting Russian businesses.","category":"research","primary":true},{"title":"APT-Q-95 research","url":"https://www.qianxin.com/news/detail?news_id=13663","publisher":"qianxin","context":"The article cites QiAnXin's July 2025 research describing the group's earlier espionage activity against sensitive Chinese industries.","category":"research","primary":false}],"body":"\u003cp\u003eNightEagle, also known as APT-Q-95, has expanded from targeting sensitive technology and defense organizations in China to targeting Russian businesses, according to Kaspersky. The group has been active since at least 2023, and Kaspersky investigated several Russian incidents over the past year. The company did not identify the affected organizations, disclose their number, or determine the attackers’ motivation.\u003c/p\u003e\n\n\u003cp\u003eIn most cases, the attackers used stolen VPN credentials to enter corporate networks, targeted Microsoft Exchange servers, and deployed the GhostContainer backdoor. GhostContainer enables remote control of compromised servers, can evade some Windows security and logging mechanisms, and can redirect network traffic. The group also exploited Active Directory weaknesses to elevate privileges and move across systems, ultimately attempting to compromise domain controllers, while using GitHub repositories disguised as legitimate software to store tool archives.\u003c/p\u003e\n"},{"n":15,"title":"Claimed Bug Bounty Hunter Likely Used LLM to Build PhantomRaven npm Stealer","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/claimed-bug-bounty-hunter-likely-used.html","time":"09:18","priority":"SHOULD READ","score":84,"tldr":"CrowdStrike links the PhantomRaven npm campaign to a purported bug bounty hunter who likely used an LLM to create a JavaScript stealer that harvested developer credentials, CI/CD secrets, and system data. The actor allegedly used malicious npm and PyPI packages to compromise targets and identify vulnerabilities for bounty claims.","briefOverview":"\u003cp\u003eCrowdStrike linked the development and distribution of the JavaScript information stealer PhantomRaven to a financially motivated actor who claimed to be a bug bounty hunter. The company assessed with high confidence that the malware was likely created with help from a large language model, citing verbose comments, placeholder code, and token-analysis patterns. PhantomRaven was first reported by Koi Security and DCODX in late October 2025 in a campaign involving more than 100 malicious npm packages.\u003c/p\u003e\n\n\u003cp\u003eThe packages used typosquatting and slopsquatting, then retrieved code from an external server so the harmful functionality was less likely to be detected in the published packages themselves. Once installed, the code gathered authentication tokens, CI/CD secrets, GitHub credentials, public IP addresses, email addresses, Git and npm configuration details, and environment variables from GitHub Actions, GitLab CI, Jenkins, and CircleCI. CrowdStrike said the actor may have used the stolen information to identify bug bounty opportunities rather than sell it, and linked the operation to similar attempts involving the PyPI repository.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrowdStrike assessed with high confidence that the PhantomRaven JavaScript information stealer was likely written using a large language model, citing verbose comments, placeholder code, and token-analysis patterns.","Koi Security and DCODX first reported PhantomRaven in late October 2025 after identifying more than 100 malicious npm packages that used typosquatting and slopsquatting to target developers.","The malicious packages retrieved code from an external server and collected authentication tokens, CI/CD secrets, GitHub credentials, system details, and configuration information.","CrowdStrike linked the operation to a purported bug bounty hunter active since November 2022 and found no evidence that stolen information had appeared in stealer-log shops.","The actor also attempted to upload similar information-stealing code to PyPI, and two associated npm accounts that distributed PhantomRaven were no longer accessible."],"insights":["The campaign used remotely retrieved code so the published npm packages could appear less suspicious to security tools while still delivering the information stealer after installation.","PhantomRaven targeted development environments broadly, collecting data from Git and npm settings as well as automation systems including GitHub Actions, GitLab CI, Jenkins, and CircleCI.","CrowdStrike said it had not found stolen PhantomRaven data in stealer-log shops, supporting its assessment that the operator likely used the collected information to identify bug bounty opportunities rather than resell it.","The same operator was linked to attempts to distribute similar information-stealing code through both npm and PyPI, extending the activity across two major developer package repositories.","CrowdStrike’s assessment that an LLM likely helped create the malware highlights that the actor may have reduced the effort needed to develop proprietary tooling."],"referencedReports":[{"title":"PhantomRaven: LLM-Generated Information Stealer for Bug Bounty Hunting","url":"https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/","publisher":"crowdstrike","context":"The article relies on CrowdStrike Counter Adversary Operations' analysis linking PhantomRaven's development and distribution to a purported bug bounty hunter.","category":"research","primary":true}],"body":"\u003cp\u003eCrowdStrike linked the development and distribution of the JavaScript information stealer PhantomRaven to a financially motivated actor who claimed to be a bug bounty hunter. The company assessed with high confidence that the malware was likely created with help from a large language model, citing verbose comments, placeholder code, and token-analysis patterns. PhantomRaven was first reported by Koi Security and DCODX in late October 2025 in a campaign involving more than 100 malicious npm packages.\u003c/p\u003e\n\n\u003cp\u003eThe packages used typosquatting and slopsquatting, then retrieved code from an external server so the harmful functionality was less likely to be detected in the published packages themselves. Once installed, the code gathered authentication tokens, CI/CD secrets, GitHub credentials, public IP addresses, email addresses, Git and npm configuration details, and environment variables from GitHub Actions, GitLab CI, Jenkins, and CircleCI. CrowdStrike said the actor may have used the stolen information to identify bug bounty opportunities rather than sell it, and linked the operation to similar attempts involving the PyPI repository.\u003c/p\u003e\n"},{"n":12,"title":"Nations take action on North Korean IT workers after UN report","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/nations-take-action-on-north-korean-it-worker-schemes","time":"14:29","priority":"SHOULD READ","score":82,"tldr":"A UN-linked monitoring team reports that countries including Argentina, Pakistan, Vietnam and Laos have taken legal or enforcement action against North Korean IT-worker networks that use fraudulent identities, local facilitators and financial accounts to generate revenue for Pyongyang. China has also increased scrutiny of the workers, constraining new deployments amid espionage-related arrests.","briefOverview":"\u003cp\u003eThe Multilateral Sanctions Monitoring Team (MSMT) reported that Argentina, Pakistan, Vietnam and Laos took action in response to allegations involving North Korean IT workers operating abroad. Argentina opened an investigation into Antonia Doroganova, who allegedly helped launder workers’ earnings, while Pakistan opened a case against Syeda Aliya Batool Zaidi and investigated two others accused of facilitating North Korean IT work. The report also noted U.S. sanctions against companies and officials in Vietnam and Laos accused of helping workers open bank accounts and move money.\u003c/p\u003e\n\n\u003cp\u003eThe MSMT said Chinese authorities have increased surveillance of North Korean IT workers, with reported arrests including a worker allegedly detained in April 2025 for stealing Chinese military secrets. The pressure has reportedly made it harder to send new workers into China, leading one North Korean company to lease a building in Sinuiju so workers could use Chinese internet without entering the country. The report estimates that at least 17 countries still host about 100,000 North Korean workers, whose overseas work generated up to $800 million last year, much of it through the IT-worker scheme.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Multilateral Sanctions Monitoring Team reported that Argentina, Pakistan, Vietnam and Laos took meaningful steps in response to allegations involving North Korean workers operating abroad.","Argentina opened an investigation into Antonia Doroganova over allegations that she helped launder money earned by North Korean IT workers, while Pakistan opened a case against Syeda Aliya Batool Zaidi over alleged provision of fraudulent identification documents.","The report said Chinese authorities have increased surveillance of North Korean IT workers, and that a worker was reportedly arrested in April 2025 for allegedly stealing Chinese military secrets.","The MSMT estimates that at least 17 countries continue to host about 100,000 North Korean workers, with an estimated 20,000 to 70,000 in China and up to 30,000 in Russia.","North Koreans working outside the country generated up to $800 million last year, much of it from the IT worker scheme, according to the report."],"insights":["Increased Chinese surveillance appears to be disrupting new North Korean IT-worker deployments, prompting at least one company to move operations to Sinuiju so workers could use Chinese internet access without entering China.","The scheme depends on local support networks, including people who allegedly provide false identity documents, open bank accounts, translate for workers, and move earnings back to Pyongyang.","North Korean entities reportedly tried to bypass Chinese entry restrictions by presenting IT workers as staff of trading companies or as garment laborers.","The issue extends beyond remote technology work: the report describes North Korean labor in manufacturing, farming, and military industrial production across at least 17 countries, with up to 90% of workers’ earnings reportedly confiscated by North Korean officials."],"referencedReports":[{"title":"MSMT Report","url":"https://msmt.info/Publications/detail/MSMT%20Report/4232","publisher":"Multilateral Sanctions Monitoring Team","context":"The article is based on this newly released report examining North Korean nationals working abroad across multiple industries.","category":"research","primary":true},{"title":"MSMT Report","url":"https://msmt.info/Publications/detail/MSMT%20Report/4221","publisher":"Multilateral Sanctions Monitoring Team","context":"The article describes this 140-page October report as the earlier study focused specifically on North Korea's IT-worker scheme.","category":"research","primary":true},{"title":"New report reveals testimonies of North Koreans exploited across Russia in 100,000-strong global state-sponsored forced labour programme","url":"https://globalrightscompliance.org/new-report-reveals-testimonies-of-north-koreans-exploited-across-russia-in-100000-strong-global-state-sponsored-forced-labour-programme/","publisher":"Global Rights Compliance","context":"Global Rights Compliance provided testimonies from North Korean workers to the MSMT for its reporting.","category":"research","primary":false}],"body":"\u003cp\u003eThe Multilateral Sanctions Monitoring Team (MSMT) reported that Argentina, Pakistan, Vietnam and Laos took action in response to allegations involving North Korean IT workers operating abroad. Argentina opened an investigation into Antonia Doroganova, who allegedly helped launder workers’ earnings, while Pakistan opened a case against Syeda Aliya Batool Zaidi and investigated two others accused of facilitating North Korean IT work. The report also noted U.S. sanctions against companies and officials in Vietnam and Laos accused of helping workers open bank accounts and move money.\u003c/p\u003e\n\n\u003cp\u003eThe MSMT said Chinese authorities have increased surveillance of North Korean IT workers, with reported arrests including a worker allegedly detained in April 2025 for stealing Chinese military secrets. The pressure has reportedly made it harder to send new workers into China, leading one North Korean company to lease a building in Sinuiju so workers could use Chinese internet without entering the country. The report estimates that at least 17 countries still host about 100,000 North Korean workers, whose overseas work generated up to $800 million last year, much of it through the IT-worker scheme.\u003c/p\u003e\n"},{"n":19,"title":"Plugin4Shell Lets Repository Owners Swap Pinned Plugin Code Across Four AI Coding Agents","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html","time":"11:01","priority":"SHOULD READ","score":82,"tldr":"Plugin4Shell lets repository owners substitute malicious plugin code despite commit-hash pinning in Claude Code, Codex, GitHub Copilot, and Gemini CLI when plugins are hosted on Git servers that permit hash-like branch names. Claude Code and Codex have fixes, Copilot remains unpatched, and Google reportedly will not fix the retiring Gemini CLI.","briefOverview":"\u003cp\u003eAir Security reported a flaw called Plugin4Shell in Claude Code, OpenAI Codex, GitHub Copilot, and Google Gemini CLI. The flaw can let someone who controls a plugin repository replace a plugin’s code even when the agent says it is installing a specific reviewed version. The replacement can run with the user’s access, including access to files, saved credentials, and systems the user can log in to.\u003c/p\u003e\n\n\u003cp\u003eThe issue arises because the agents retrieve a commit identified by a fixed code string but do not verify that the resulting code actually matches that identifier. On Git hosts that allow a branch to be named like a commit identifier, a repository owner can redirect that branch to different code while the agent continues reporting the pinned version. GitHub blocks hash-like branch and tag names, so the article says this branch-name method does not affect GitHub-hosted plugins, including the default Claude Code and Copilot catalogs checked by The Hacker News.\u003c/p\u003e\n\n\u003cp\u003eAnthropic reportedly fixed Claude Code in version 2.1.179, and OpenAI shipped a Codex fix in version 0.146.0. Air Security said GitHub Copilot has no fix and that Google will not patch the retiring Gemini CLI, which can reportedly be targeted through a different \u003ccode\u003eFETCH_HEAD\u003c/code\u003e branch-name method. The article also notes that background plugin updates could allow a trusted plugin to be replaced without a prompt, although default auto-updating Claude Code and Codex marketplaces are GitHub-hosted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Air Security reported that Plugin4Shell can let a plugin repository owner replace code installed by AI coding agents even when the plugin is pinned to a specific reviewed commit hash.","The issue affects Claude Code, OpenAI Codex, GitHub Copilot, and Gemini CLI because their installers may accept a branch name made to resemble the pinned code identifier rather than verifying the downloaded code matches it.","GitHub blocks branch and tag names that look like commit hashes, so plugins from GitHub repositories are not exposed to the branch-name variant of the issue described by Air Security.","Anthropic reportedly fixed Claude Code in version 2.1.179 and OpenAI fixed Codex in version 0.146.0, while Air Security said GitHub Copilot has no fix and Google will not patch Gemini CLI.","A swapped plugin can run with the user’s access and could reach their files, saved credentials, and systems they can log in to."],"insights":["A plugin can appear to remain on its reviewed, locked version while the agent actually installs different code, because the agents did not verify that the retrieved code matched the pinned commit identifier.","The practical exposure depends heavily on where a plugin is hosted: the article says GitHub blocks hash-like branch names, while Bitbucket and some private Git servers permit them.","Background plugin updates could allow a previously trusted plugin to be replaced without a new prompt, but the article says default auto-updating marketplaces for Claude Code and Codex are GitHub-hosted and therefore not exposed to the hash-like branch method.","Gemini CLI can reportedly be targeted through a differently named main branch, FETCH_HEAD, so GitHub’s restriction on hash-like branch names does not clearly rule out exposure for Gemini CLI plugins.","Because verification occurs on the user’s machine, the article says marketplaces cannot correct the issue for existing users; a fix must be delivered in the coding agent itself."],"referencedReports":[{"title":"Plugin4Shell","url":"https://www.air.security/blog-posts/plugin4shell","publisher":"air-security","context":"Air Security disclosed its Plugin4Shell research describing how pinned AI coding-agent plugins could be replaced through specially named repository branches.","category":"research","primary":true}],"body":"\u003cp\u003eAir Security reported a flaw called Plugin4Shell in Claude Code, OpenAI Codex, GitHub Copilot, and Google Gemini CLI. The flaw can let someone who controls a plugin repository replace a plugin’s code even when the agent says it is installing a specific reviewed version. The replacement can run with the user’s access, including access to files, saved credentials, and systems the user can log in to.\u003c/p\u003e\n\n\u003cp\u003eThe issue arises because the agents retrieve a commit identified by a fixed code string but do not verify that the resulting code actually matches that identifier. On Git hosts that allow a branch to be named like a commit identifier, a repository owner can redirect that branch to different code while the agent continues reporting the pinned version. GitHub blocks hash-like branch and tag names, so the article says this branch-name method does not affect GitHub-hosted plugins, including the default Claude Code and Copilot catalogs checked by The Hacker News.\u003c/p\u003e\n\n\u003cp\u003eAnthropic reportedly fixed Claude Code in version 2.1.179, and OpenAI shipped a Codex fix in version 0.146.0. Air Security said GitHub Copilot has no fix and that Google will not patch the retiring Gemini CLI, which can reportedly be targeted through a different \u003ccode\u003eFETCH_HEAD\u003c/code\u003e branch-name method. The article also notes that background plugin updates could allow a trusted plugin to be replaced without a prompt, although default auto-updating Claude Code and Codex marketplaces are GitHub-hosted.\u003c/p\u003e\n"},{"n":20,"title":"RatHat Android Malware Abuses ADB to Retain Shell Access After Uninstall","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/rathat-android-malware-abuses-adb-to.html","time":"06:17","priority":"SHOULD READ","score":82,"tldr":"Researchers identified RatHat, an Android malware attributed to China-based actors that abuses Accessibility permissions and wireless ADB pairing to gain persistent shell access even after the malicious app is uninstalled. It uses AI-assisted device navigation, credential overlays, SMS interception, screen recording, and reverse tunnels for remote control.","briefOverview":"\u003cp\u003eResearchers at Zimperium have identified RatHat, an Android malware assessed to be operated by China-based threat actors. It is distributed through targeted text-message phishing, malicious advertisements, deceptive download portals, and third-party forums that prompt users to install malicious APK files. The initial app acts as a dropper and includes several anti-analysis measures intended to hinder automated inspection.\u003c/p\u003e\n\n\u003cp\u003eRatHat abuses Android Accessibility permissions to unlock Developer Options, enable Wireless Debugging, and obtain an Android Debug Bridge pairing code. It then uses local Android Debug Bridge access to run a Go-based agent with shell-level privileges and an FRP reverse tunnel that gives operators continuing access to the device. This access can remain after the malicious app is uninstalled, and the separate component can check whether the app is present and reinstall it.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use fake overlays to capture credentials, record screens, intercept SMS messages, collect files and lock-screen details, capture keystrokes, and record touches on the display. It also sends the device\u0026rsquo;s live Accessibility screen data to a generative AI assistant to identify on-screen text, find locations for automated taps, and navigate actions such as scrolling. Zimperium said the combination of independently running components, persistent device access, and real-time AI decision loops makes signature-based mobile security controls insufficient.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at Zimperium identified RatHat, an Android malware assessed to be operated by China-based threat actors and distributed through smishing, malvertising, deceptive download portals, and third-party forums.","RatHat abuses Android Accessibility permissions to unlock Developer Options, enable Wireless Debugging, and obtain a six-digit Android Debug Bridge pairing code.","After gaining local Android Debug Bridge access, RatHat can run a Go-based agent and establish a reverse tunnel through FRP, allowing attackers to retain shell access even if the malicious app is uninstalled.","The malware can display credential-stealing overlays, record the screen, intercept SMS messages, collect device data and lock-screen credentials, capture keystrokes, and log screen touches.","RatHat sends the device’s Accessibility screen data to a generative AI assistant to identify on-screen text, locate targets for automated taps, and issue navigation actions such as scrolling."],"insights":["RatHat’s use of local wireless debugging allows it to move beyond normal Android app restrictions by creating separate programs that run with device shell privileges.","Removing the visible malicious app may not remove the attacker’s access, because its independently running component can check for the app and reinstall it.","The malware is designed to hinder automated inspection through package manipulation, malformed manifest data, poisoned code instructions, and encrypted strings.","Its use of a reverse tunnel gives operators a general route to the device’s debugging service, rather than limiting them to RatHat’s built-in data-stealing features.","The malware uses a generative AI assistant to turn live screen-accessibility data into automated actions, such as locating screen elements and scrolling."],"referencedReports":[{"title":"RatHat: AI-Powered Mobile Threat Is Here for Your Credentials \u0026 Bank Accounts","url":"https://zimperium.com/blog/rathat-ai-powered-mobile-threat-is-here-for-your-credentials-bank-accounts","publisher":"zimperium","context":"The article relies on Zimperium researchers' technical analysis of RatHat's distribution, Android Debug Bridge abuse, persistence, and data-stealing capabilities.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at Zimperium have identified RatHat, an Android malware assessed to be operated by China-based threat actors. It is distributed through targeted text-message phishing, malicious advertisements, deceptive download portals, and third-party forums that prompt users to install malicious APK files. The initial app acts as a dropper and includes several anti-analysis measures intended to hinder automated inspection.\u003c/p\u003e\n\n\u003cp\u003eRatHat abuses Android Accessibility permissions to unlock Developer Options, enable Wireless Debugging, and obtain an Android Debug Bridge pairing code. It then uses local Android Debug Bridge access to run a Go-based agent with shell-level privileges and an FRP reverse tunnel that gives operators continuing access to the device. This access can remain after the malicious app is uninstalled, and the separate component can check whether the app is present and reinstall it.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use fake overlays to capture credentials, record screens, intercept SMS messages, collect files and lock-screen details, capture keystrokes, and record touches on the display. It also sends the device\u0026rsquo;s live Accessibility screen data to a generative AI assistant to identify on-screen text, find locations for automated taps, and navigate actions such as scrolling. Zimperium said the combination of independently running components, persistent device access, and real-time AI decision loops makes signature-based mobile security controls insufficient.\u003c/p\u003e\n"},{"n":21,"title":"Microsoft Patches CVSS 10.0 Azure AI Foundry Flaw Enabling Unauthorized Privilege Escalation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/microsoft-patches-cvss-100-azure-ai.html","time":"12:47","priority":"SHOULD READ","score":82,"tldr":"Microsoft has fixed a CVSS 10.0 Azure AI Foundry authentication flaw (CVE-2026-85889) that could have allowed unauthenticated network attackers to escalate privileges; the cloud service was fully mitigated and requires no customer action.","briefOverview":"\u003cp\u003eMicrosoft has patched CVE-2026-85889, a maximum-severity Azure AI Foundry flaw with a CVSS score of 10.0. Microsoft said missing authentication for a critical function could have enabled an unauthorized attacker on a network to gain elevated privileges. Researcher Rémy Marot reported the issue, and Microsoft said it has found no evidence of exploitation in the wild. Because Azure AI Foundry is a cloud service, Microsoft said the issue has already been fully mitigated and requires no customer action.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also addressed critical cloud vulnerabilities in Microsoft 365 Copilot, Azure Database for PostgreSQL, and Azure Cosmos DB, with CVSS scores ranging from 9.6 to 9.9. It separately released an out-of-band Windows 11 version 26H1 update, KB5129194, for two local privilege-escalation issues in Windows User-Mode Power Service and Windows Secure Kernel Mode. The article follows Microsoft\u0026rsquo;s patching of 974 vulnerabilities across its portfolio, including two Windows issues reported to be under active exploitation. Reports from Proofpoint and Volexity said one Windows ALPC flaw was chained with two Google Chrome flaws in the BlueMoon exploit kit by multiple espionage-aligned threat actors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft patched CVE-2026-85889, a CVSS 10.0 Azure AI Foundry flaw caused by missing authentication for a critical function that could allow an unauthorized network attacker to elevate privileges.","Microsoft credited researcher Rémy Marot for reporting CVE-2026-85889 and said there is no evidence that it has been exploited in the wild.","Microsoft also mitigated critical cloud flaws affecting Microsoft 365 Copilot, Azure Database for PostgreSQL, and Azure Cosmos DB, and said these cloud vulnerabilities require no customer action.","An out-of-band Windows 11 version 26H1 update, KB5129194, addresses CVE-2026-62721 in Windows User-Mode Power Service and CVE-2026-85921 in Windows Secure Kernel Mode.","Microsoft recently patched 974 vulnerabilities across its software portfolio, including two Windows flaws under active exploitation that reports say were used with Google Chrome flaws in the BlueMoon exploit kit."],"insights":["Despite the maximum CVSS 10.0 rating of the Azure AI Foundry flaw, Microsoft said its cloud-side mitigation is complete, so customers do not need to apply a fix themselves.","The patched cloud issues differ in who could use them: Azure AI Foundry could be targeted by an unauthorized attacker, while the Microsoft 365 Copilot and Azure Database for PostgreSQL flaws require an attacker to already be authorized.","Unlike the cloud vulnerabilities, the two Windows privilege-escalation flaws require installation of the out-of-band Windows 11 version 26H1 update KB5129194.","The article distinguishes these newly addressed flaws from two separately patched Windows issues that are reportedly being actively exploited in a BlueMoon exploit kit alongside Google Chrome flaws."],"referencedReports":[{"title":"CVE-2026-85889 Security Update Guide","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85889","publisher":"microsoft","context":"Microsoft's advisory describes the Azure AI Foundry missing-authentication flaw that could allow unauthorized privilege escalation over a network.","category":"advisory","primary":true},{"title":"CVE-2026-85885 Security Update Guide","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85885","publisher":"microsoft","context":"Microsoft's advisory covers a command-injection issue in Microsoft 365 Copilot.","category":"advisory","primary":false},{"title":"CVE-2026-85878 Security Update Guide","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85878","publisher":"microsoft","context":"Microsoft's advisory covers an improper-authorization issue in Azure Database for PostgreSQL.","category":"advisory","primary":false},{"title":"CVE-2026-87701 Security Update Guide","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-87701","publisher":"microsoft","context":"Microsoft's advisory covers an improper-neutralization issue in Azure Cosmos DB.","category":"advisory","primary":false},{"title":"CVE-2026-62721 Security Update Guide","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-62721","publisher":"microsoft","context":"Microsoft's advisory covers an access-control issue in Windows User-Mode Power Service that could grant SYSTEM privileges.","category":"advisory","primary":false},{"title":"CVE-2026-85921 Security Update Guide","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85921","publisher":"microsoft","context":"Microsoft's advisory covers a double-free issue in Windows Secure Kernel Mode that could grant Virtual Trust Level 1 privileges.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft has patched CVE-2026-85889, a maximum-severity Azure AI Foundry flaw with a CVSS score of 10.0. Microsoft said missing authentication for a critical function could have enabled an unauthorized attacker on a network to gain elevated privileges. Researcher Rémy Marot reported the issue, and Microsoft said it has found no evidence of exploitation in the wild. Because Azure AI Foundry is a cloud service, Microsoft said the issue has already been fully mitigated and requires no customer action.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also addressed critical cloud vulnerabilities in Microsoft 365 Copilot, Azure Database for PostgreSQL, and Azure Cosmos DB, with CVSS scores ranging from 9.6 to 9.9. It separately released an out-of-band Windows 11 version 26H1 update, KB5129194, for two local privilege-escalation issues in Windows User-Mode Power Service and Windows Secure Kernel Mode. The article follows Microsoft\u0026rsquo;s patching of 974 vulnerabilities across its portfolio, including two Windows issues reported to be under active exploitation. Reports from Proofpoint and Volexity said one Windows ALPC flaw was chained with two Google Chrome flaws in the BlueMoon exploit kit by multiple espionage-aligned threat actors.\u003c/p\u003e\n"},{"n":22,"title":"One Dell Order, Two Companies, One Signature","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/genuine-dell-order-confirmation-helpline-injected-into-address-fields-fanned-to-two-tenants","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"Attackers turned a genuine Dell order acknowledgement into a callback-phishing lure by placing a fraudulent order, then relaying the vendor-signed email through Microsoft 365 tenants to unrelated targets. DKIM and DMARC passed because the message was authentic, but its signed recipient field showed it was originally addressed to an attacker-controlled mailbox—not the final recipient.","briefOverview":"\u003cp\u003eAttackers submitted a Dell order using the attacker-controlled mailbox \u003ccode\u003eno-reply@Dynamic535[.]onmicrosoft[.]com\u003c/code\u003e, causing Dell to generate a genuine signed order acknowledgement and PDF. The same signed email was then relayed through different Microsoft 365 tenants to a commercial cleaning and property restoration franchise organization and an unrelated professional-services firm about two minutes apart. The delivered copies shared the same signature value, message identifier, attachment hash, purchase identifier, and outbound gateway tracking identifier. Neither recipient organization had placed the order.\u003c/p\u003e\n\n\u003cp\u003eThe messages passed sender-policy, DKIM, DMARC, and composite authentication checks because relaying changed only the SMTP delivery envelope rather than the signed headers or body. However, the signed recipient field still named the attacker-controlled tenant mailbox, not the final recipient, and the article notes that DMARC does not evaluate this mismatch. The only actionable lure was a phone number inserted into the order’s shipping and billing address fields alongside text such as “Helpline” and “Call Our Sales Team”; all links and the attached Dell PDF were clean. The article reports that two human reviewers marked the messages malicious after an automated analyst initially considered clean authentication and artifact scans more important than the recipient’s report that no order had been made.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers submitted a Dell order using an attacker-controlled Microsoft 365 mailbox, causing Dell to generate and sign a genuine order acknowledgement and PDF.","The same signed message was relayed through different second-hop Microsoft 365 tenants to two unrelated organizations about two minutes apart, while its signature, message identifier, attachment hash, and purch
