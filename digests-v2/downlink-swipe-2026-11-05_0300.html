<script type="application/json" id="dl-articles">[{"n":2,"title":"Hackers Exploit Patched Apple Flaw to Deliver Info-Stealing Malware, CISA Says","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-patched-apple-flaw-to.html","time":"05:17","priority":"MUST READ","score":94,"tldr":"CISA added Apple CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after suspected APT29 activity used patched Safari and Chrome flaws to deliver browser-data-stealing malware. Organizations and users should apply Apple security updates promptly, with U.S. federal agencies directed to remediate by November 18, 2026.","briefOverview":"\u003cp\u003eCISA added Apple CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after reports that the flaw is being actively exploited. The medium-severity issue is an improper-authentication weakness that could allow an attacker with arbitrary read and write capability to bypass Pointer Authentication. Apple fixed it in May 2024 through updates for iOS, iPadOS, macOS Sonoma, tvOS, watchOS, and Safari.\u003c/p\u003e\n\n\u003cp\u003eAccording to a Sekoia report cited by the article, actors possibly linked to Russia and attributed to APT29 with moderate to high confidence exploited previously patched Safari and Google Chrome flaws to deliver information-stealing malware. The campaign used compromised legitimate sites, fake sites posing as popular services, and a supply-chain attack involving Plerdy SEO Tracker to serve malicious JavaScript after profiling visitors’ devices. The payload was designed to steal browser cookies and device data, and CISA recommended that U.S. federal civilian agencies apply the required patches by November 18, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added Apple vulnerability CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after reports of active exploitation.","CVE-2024-27834 is an improper-authentication flaw that can let an attacker with arbitrary read and write capability bypass Pointer Authentication.","Apple addressed the flaw in May 2024 across iOS, iPadOS, macOS Sonoma, tvOS, watchOS, and Safari updates.","Sekoia reported that actors possibly linked to Russia, attributed to APT29 with moderate to high confidence, exploited patched Safari and Google Chrome flaws to deliver browser and device data-stealing malware.","CISA recommended that U.S. federal civilian agencies apply the necessary patches by November 18, 2026."],"insights":["A flaw rated medium severity was demonstrated as a zero-day at Pwn2Own before Apple released fixes, and CISA later listed it as actively exploited.","The reported campaign can reach victims through compromised legitimate websites, convincing fake websites, or a compromised Plerdy SEO Tracker supply-chain component.","The malicious code profiles a visitor’s device before delivering its information-stealing payload, which is designed to collect browser cookies and device data.","CISA’s remediation deadline applies specifically to U.S. Federal Civilian Executive Branch agencies, setting November 18, 2026 as the required patch date."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/04/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"CISA's advisory is cited for adding Apple CVE-2024-27834 to the Known Exploited Vulnerabilities catalog following active-exploitation reports.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added Apple CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after reports that the flaw is being actively exploited. The medium-severity issue is an improper-authentication weakness that could allow an attacker with arbitrary read and write capability to bypass Pointer Authentication. Apple fixed it in May 2024 through updates for iOS, iPadOS, macOS Sonoma, tvOS, watchOS, and Safari.\u003c/p\u003e\n\n\u003cp\u003eAccording to a Sekoia report cited by the article, actors possibly linked to Russia and attributed to APT29 with moderate to high confidence exploited previously patched Safari and Google Chrome flaws to deliver information-stealing malware. The campaign used compromised legitimate sites, fake sites posing as popular services, and a supply-chain attack involving Plerdy SEO Tracker to serve malicious JavaScript after profiling visitors’ devices. The payload was designed to steal browser cookies and device data, and CISA recommended that U.S. federal civilian agencies apply the required patches by November 18, 2026.\u003c/p\u003e\n"},{"n":1,"title":"OpenAI AI Pipeline Generates 948 Linux Root Escalation Exploits in 30-Hour Run","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/openai-ai-pipeline-generates-948-linux.html","time":"04:31","priority":"SHOULD READ","score":84,"tldr":"OpenAI says an agentic pipeline using an upcoming cyber model reproduced 1,724 Linux kernel flaws and generated 948 working local privilege-escalation exploits in a 30-hour run, while also producing patches for human review. The result underscores that AI is accelerating both vulnerability weaponization and defensive patching, shrinking the time organizations have to remediate exposed systems.","briefOverview":"\u003cp\u003eOpenAI said an agentic pipeline using an upcoming cyber-focused AI model analyzed 2,308 Linux kernel findings, dynamically reproduced 1,724 vulnerabilities, and generated 948 working local privilege-escalation exploits. The October 2026 run reportedly completed within 30 hours on a commonly used Linux distribution. OpenAI estimated the API-credit cost at \u003cspan class=\"math inline\"\u003e\\(1,213,430, or about \\)\u003c/span\u003e1,279 per local privilege-escalation exploit. The company said these exploits could let an unprivileged local user gain root access.\u003c/p\u003e\n\n\u003cp\u003eThe pipeline covers finding security-relevant code, reproducing suspected flaws in a sandbox, testing whether they can reveal information or grant elevated access, generating patches, and having researchers review the results before reporting them to maintainers. OpenAI said the agents used at least 10 novel Linux exploitation techniques, including kernel-cache object spraying, page-grooming methods, data-only privilege-escalation methods, and arbitrary type confusion. The article notes that AI can speed both discovery and remediation, but that the same capabilities may help bad actors find and weaponize flaws. The U.K. National Cyber Security Centre said organizations need to adapt patching and testing processes to the faster pace of vulnerability discovery.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI said its prototype analyzed 2,308 Linux kernel candidates, dynamically reproduced 1,724 vulnerabilities, and generated 948 local privilege-escalation exploits that could allow an unprivileged local user to obtain root access.","The agentic pipeline includes vulnerability discovery, sandboxed dynamic validation, exploitability assessment, patch generation, and human review before reporting findings to maintainers.","OpenAI said a mid-October 2026 run completed the validation work within 30 hours and cost $1,213,430 in API credits, or about $1,279 per local privilege-escalation exploit.","OpenAI said the agents discovered and used at least 10 novel Linux exploitation techniques, including kernel-cache object spraying, page grooming, data-only privilege escalation, and arbitrary type confusion.","The U.K. National Cyber Security Centre said AI-powered cyber tools have increased zero-day discovery and shortened patching timelines, while organizations must adapt their patching and testing processes to the faster pace."],"insights":["The reported cost of $1,279 per working local privilege-escalation exploit shows that the pipeline could produce root-access demonstrations at a measurable per-exploit cost rather than requiring entirely bespoke work for every flaw.","The pipeline paired exploit creation with patch generation and human review, indicating that OpenAI’s stated approach is to use the same automated discovery process to shorten the time between finding a flaw and preparing a fix.","OpenAI said that, for a well-resourced threat actor, having a low-privileged account on an operating system missing its latest patches should be treated as functionally equivalent to having root access.","The U.K. NCSC reported that defensive AI tools can reduce the time in which a newly discovered flaw remains unknown, but warned that systems remain exposed when organizations do not correctly and widely deploy the technology."],"referencedReports":[{"title":"Vulnerability and Exploitation Risks of AI","url":"https://www.vulncheck.com/blog/vulnerability-and-exploitation-risks-of-ai","publisher":"vulncheck","context":"The article cites a VulnCheck report that categorizes AI-assisted vulnerability discovery as a growing risk category that can lower the expertise needed to find software flaws.","category":"research","primary":false},{"title":"Artificial Intelligence and Cyber Intrusion","url":"https://www.ncsc.gov.uk/report/artificial-intelligence-and-cyber-intrusion","publisher":"uk-national-cyber-security-centre","context":"The article cites a U.K. NCSC assessment stating that widely available AI-powered cyber tools have likely increased zero-day discovery while defensive tools can speed patching.","category":"research","primary":false}],"body":"\u003cp\u003eOpenAI said an agentic pipeline using an upcoming cyber-focused AI model analyzed 2,308 Linux kernel findings, dynamically reproduced 1,724 vulnerabilities, and generated 948 working local privilege-escalation exploits. The October 2026 run reportedly completed within 30 hours on a commonly used Linux distribution. OpenAI estimated the API-credit cost at \u003cspan class=\"math inline\"\u003e\\(1,213,430, or about \\)\u003c/span\u003e1,279 per local privilege-escalation exploit. The company said these exploits could let an unprivileged local user gain root access.\u003c/p\u003e\n\n\u003cp\u003eThe pipeline covers finding security-relevant code, reproducing suspected flaws in a sandbox, testing whether they can reveal information or grant elevated access, generating patches, and having researchers review the results before reporting them to maintainers. OpenAI said the agents used at least 10 novel Linux exploitation techniques, including kernel-cache object spraying, page-grooming methods, data-only privilege-escalation methods, and arbitrary type confusion. The article notes that AI can speed both discovery and remediation, but that the same capabilities may help bad actors find and weaponize flaws. The U.K. National Cyber Security Centre said organizations need to adapt patching and testing processes to the faster pace of vulnerability discovery.\u003c/p\u003e\n"}]</script>
