se},{"title":"Joint Cybersecurity Advisory: Watering Hole Malware Analysis","url":"https://www.enki.co.kr/en/media-center/blog/joint-cybersecurity-advisory-watering-hole-malware-analysis","publisher":"ENKI","context":"The article references this advisory as part of reporting on Operation Double Barrel, a North Korean watering hole campaign that deployed backdoors and ransomware.","category":"advisory","primary":false},{"title":"Cleaning Out Inboxes: TA488 Comes to Outlook with Another Half-Click Exploit","url":"https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit","publisher":"Proofpoint","context":"The article says Proofpoint linked Russian espionage group Laundry Bear to a Microsoft Exchange zero-day and the OWAReaper tool.","category":"research","primary":false},{"title":"Cisco Secure Firewall Management Center Static Credential Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-fmc-static-cred-BET3Cjh","publisher":"Cisco","context":"The article says Cisco released a security update for an actively exploited zero-day involving hardcoded credentials in Secure Firewall Management Center.","category":"advisory","primary":false},{"title":"ICSA-26-209-05","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-26-209-05","publisher":"CISA","context":"The article cites this CISA advisory for a MikroTik RouterOS authentication API bug that can allow brute-force attacks.","category":"advisory","primary":false},{"title":"CosmosEscape: Taking Over Every Database in Azure Cosmos DB","url":"https://www.wiz.io/blog/cosmosescape-taking-over-every-database-in-azure-cosmos-db","publisher":"Wiz","context":"The article says Wiz reported on CosmosEscape, a vulnerability that could have allowed access to every Cosmos DB database on Azure.","category":"research","primary":false},{"title":"2026 Minimum Elements for a Software Bill of Materials","url":"https://www.cisa.gov/resources-tools/resources/2026-minimum-elements-software-bill-materials-sbom","publisher":"CISA","context":"The article says cybersecurity agencies from several countries released joint guidance on basic elements for an SBOM program.","category":"guide","primary":false}],"body":"\u003cp\u003eCrime Stoppers International is offering a $22,000 bounty for information on members of the INC ransomware group. To qualify for a payout, the information must lead to the identification, arrest, or disruption of the gang’s operations. The non-profit cited INC’s repeated attacks on healthcare and critical infrastructure organizations as the reason for the bounty.\u003c/p\u003e\n\n\u003cp\u003eCrime Stoppers International said INC “shows no restraint against hospitals, healthcare providers, or critical services” and described the group’s activity as more than a victimless financial crime. The organization is seeking details on INC members, their locations, movements, contacts, crypto-wallets, money trail, server infrastructure, internal structure, and communications. Recent reports from NCC Group and Point Wild ranked INC as the sixth most active ransomware group in June 2026 and Q2 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that INC has repeatedly ranked among the top 10 most active ransomware groups since emerging in 2023. Last year, security firm Cyber Centaurs infiltrated an INC backup server, retrieved stolen unencrypted files, and helped a dozen victims recover data without paying ransoms. The broader newsletter also summarizes other security news, including a UK Department for Education breach, Russia charging Telegram founder Pavel Durov, and an FCC ban on foreign-made robots and power inverters.\u003c/p\u003e\n"},{"n":39,"title":"Black Hat USA 2026","source":"jamf.com","sourceColorIdx":3,"link":"https://www.jamf.com/blog/black-hat-usa-2026/","time":"17:24","priority":"MAY READ","score":40,"tldr":"Black Hat USA 2026 highlighted AI governance, Mac malware, and mobile security as top enterprise concerns, with Jamf emphasizing the need for endpoint-level visibility and integrated defenses across Apple devices. The main takeaway is that securing modern fleets now requires collaboration, AI-aware controls, and deeper protection for Mac and mobile endpoints.","briefOverview":"\u003cp\u003eBlack Hat USA 2026 brought cybersecurity leaders, red team operators, detection engineers, threat hunters, intelligence analysts and others to Mandalay Bay Resort and Casino in Las Vegas. The conference opened with “Cyber Power in the Age of AI,” reflecting a major theme across trainings, briefings and the Business Hall. The article emphasizes that AI is reshaping how systems are secured, how vulnerability research is conducted and how organizations and security teams operate.\u003c/p\u003e\n\n\u003cp\u003eJamf participated in the Black Hat Network Operations Center, where partners including Cisco, Palo Alto, Corelight, Luman, Arista and Jamf monitored and defended the conference network. The NOC team had to distinguish between aggressive but normal conference activity, described as a “Black Hat positive,” and actual malicious behavior targeting attendees or the conference. Jamf’s role included helping ensure Apple devices such as iPhones and iPads used for registration, session scanning and booth operations behaved as users expected.\u003c/p\u003e\n\n\u003cp\u003eAt the Jamf booth, discussions focused on AI governance, Mac malware, threat hunting, spyware and mobile forensics. The article says organizations need endpoint-level controls built on Apple frameworks to gain visibility into AI use on Mac fleets, including shadow AI, agentic and developer AI, vendor sprawl and cost surprises. It also highlights Mac infostealers, which Jamf says account for almost 34% of all malware observed on Mac, and mobile risk, including the need for real-time visibility into apps and faster analysis of mobile spyware and advanced threats.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Black Hat USA 2026 focused heavily on AI, including how it is changing system security, vulnerability research, organizational operations, and the risks organizations must manage.","Jamf participated in the Black Hat Network Operations Center, where industry partners worked together to distinguish normal conference security activity from actual malicious behavior on the conference network.","At the Jamf booth, attendees discussed AI governance, Mac malware, threat hunting, spyware, and mobile forensics.","Jamf said organizations need endpoint-level controls built on Apple frameworks to gain visibility into and govern AI use across Mac fleets.","Jamf and NowSecure presented mobile application risk visibility, noting that the Mobile Security 360 Report found over 96% of mobile apps contain AI code."],"insights":["The article argues that network-level controls are not enough to govern AI use on Macs, and that organizations need endpoint-level controls built natively on Apple frameworks.","Security teams at Black Hat must account for “Black Hat positives,” where aggressive network activity may be normal conference behavior rather than a real threat.","The article identifies infostealers as a major Mac security concern, stating that almost 34% of all malware observed on Mac is now infostealers.","Jamf and NowSecure said that over 96% of mobile apps contain AI code, making real-time visibility into deployed mobile applications an important first step for assessing risk.","The article says traditional mobile forensics can take weeks, while security teams want faster remote inspection and automated analysis for mobile spyware, APTs, and other advanced threats."],"referencedReports":[],"body":"\u003cp\u003eBlack Hat USA 2026 brought cybersecurity leaders, red team operators, detection engineers, threat hunters, intelligence analysts and others to Mandalay Bay Resort and Casino in Las Vegas. The conference opened with “Cyber Power in the Age of AI,” reflecting a major theme across trainings, briefings and the Business Hall. The article emphasizes that AI is reshaping how systems are secured, how vulnerability research is conducted and how organizations and security teams operate.\u003c/p\u003e\n\n\u003cp\u003eJamf participated in the Black Hat Network Operations Center, where partners including Cisco, Palo Alto, Corelight, Luman, Arista and Jamf monitored and defended the conference network. The NOC team had to distinguish between aggressive but normal conference activity, described as a “Black Hat positive,” and actual malicious behavior targeting attendees or the conference. Jamf’s role included helping ensure Apple devices such as iPhones and iPads used for registration, session scanning and booth operations behaved as users expected.\u003c/p\u003e\n\n\u003cp\u003eAt the Jamf booth, discussions focused on AI governance, Mac malware, threat hunting, spyware and mobile forensics. The article says organizations need endpoint-level controls built on Apple frameworks to gain visibility into AI use on Mac fleets, including shadow AI, agentic and developer AI, vendor sprawl and cost surprises. It also highlights Mac infostealers, which Jamf says account for almost 34% of all malware observed on Mac, and mobile risk, including the need for real-time visibility into apps and faster analysis of mobile spyware and advanced threats.\u003c/p\u003e\n"},{"n":1,"title":"When Credentials Are No Longer Enough: Device Trust in the AI Era","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/when-credentials-are-no-longer-enough-device-trust-in-the-ai-era/","time":"14:01","priority":"MAY READ","score":35,"tldr":"AI is making credential theft, phishing, and MFA bypass attempts faster and more convincing, weakening traditional login trust signals like passwords, IP reputation, and geolocation. The article argues that organizations should add device trust so valid credentials alone are not enough to access sensitive systems.","briefOverview":"\u003cp\u003eIdentity security is under pressure because attackers are getting better at stealing, imitating, or bypassing signals such as passwords, MFA responses, IP reputation, geolocation, and browser characteristics. The article says AI has not created a new type of account takeover, but it has made familiar attacks faster and more efficient. Attackers can use AI to generate convincing phishing emails, personalize messages with public information, and focus on accounts with the highest expected value.\u003c/p\u003e\n\n\u003cp\u003eTraditional login checks are described as increasingly limited because credentials can come from breaches or infostealer dumps, MFA can be phished or bypassed through stolen session cookies, and network signals can be misleading. Attackers can use residential proxies, mobile networks, or compromised systems to make a login appear geographically plausible. The article cites NIST Zero Trust Architecture guidance that organizations should not grant implicit trust based only on physical or network location.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that device trust adds another layer by making valid credentials insufficient without the device context they are meant to be used from. It says organizations should tie access to approved hardware, continuously evaluate both the user and device, and adjust enforcement based on the level of risk. It also says users need a clear self-guided way to restore trust when device health issues affect access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI has not created a fundamentally new form of account takeover, but it reduces the manual work needed for phishing, credential theft, MFA abuse, session hijacking, and social engineering.","Traditional trust signals such as passwords, MFA responses, IP reputation, geolocation, and browser characteristics are becoming easier for attackers to steal, imitate, or work around.","Attackers can route traffic through residential proxies, mobile networks, or compromised systems and choose exit nodes close to victims, making malicious logins appear geographically plausible.","The article argues that device trust can make valid credentials insufficient by tying access to approved hardware and treating logins from unknown devices as a meaningful change in risk.","The article says access should continue to depend on both the user’s identity and the health of the device, with enforcement matched to the level of risk and self-guided remediation for users."],"insights":["The article frames AI’s main impact on account takeover as reducing the cost of personalization and triage, which lets attackers run more campaigns and concentrate effort on higher-value accounts rather than fully automating intrusions.","Device trust is presented as a way to reduce reliance on network clues because attackers can make malicious logins look geographically plausible by using residential proxies, mobile networks, or compromised systems near the victim.","The article recommends proportionate device enforcement, where a missing update might trigger reduced privileges or a grace period while more serious issues such as disabled endpoint protection or a rooted device can be treated more severely.","Self-guided remediation is highlighted as part of device trust because users need a clear way to restore access when their device health blocks or limits them."],"referencedReports":[{"title":"NIST SP 800-207","url":"https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-207A.pdf?utm_source=bleepingcomputer\u0026utm_medium=referral\u0026utm_campaign=infinipoint_bleepingcomputer_referral_na\u0026utm_content=article","publisher":"nist","context":"The article cites NIST’s Zero Trust Architecture guidance to support the point that organizations should not grant implicit trust based solely on physical or network location.","category":"guide","primary":false}],"body":"\u003cp\u003eIdentity security is under pressure because attackers are getting better at stealing, imitating, or bypassing signals such as passwords, MFA responses, IP reputation, geolocation, and browser characteristics. The article says AI has not created a new type of account takeover, but it has made familiar attacks faster and more efficient. Attackers can use AI to generate convincing phishing emails, personalize messages with public information, and focus on accounts with the highest expected value.\u003c/p\u003e\n\n\u003cp\u003eTraditional login checks are described as increasingly limited because credentials can come from breaches or infostealer dumps, MFA can be phished or bypassed through stolen session cookies, and network signals can be misleading. Attackers can use residential proxies, mobile networks, or compromised systems to make a login appear geographically plausible. The article cites NIST Zero Trust Architecture guidance that organizations should not grant implicit trust based only on physical or network location.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that device trust adds another layer by making valid credentials insufficient without the device context they are meant to be used from. It says organizations should tie access to approved hardware, continuously evaluate both the user and device, and adjust enforcement based on the level of risk. It also says users need a clear self-guided way to restore trust when device health issues affect access.\u003c/p\u003e\n"},{"n":21,"title":"Shipping 10–50× More Code? Watch This Webinar on Securing AI-Speed Development","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/shipping-1050-more-code-watch-this.html","time":"11:52","priority":"MAY READ","score":35,"tldr":"Chainguard’s webinar argues that AI-driven development can multiply code output faster than security teams can review and remediate risk. The key takeaway is that organizations need secure-by-default controls and governance that operate at machine speed, not just more vulnerability scanning.","briefOverview":"\u003cp\u003eThe article promotes a webinar with Chainguard experts titled “The True Cost of Building at Machine Speed,” focused on securing AI-driven software development. It says AI is helping development teams produce far more code much faster, with software output potentially jumping 10 to 50 times. The article argues that security teams still have to review vulnerabilities, manage dependencies, prioritize fixes, and control risk at human speed.\u003c/p\u003e\n\n\u003cp\u003eThe article says this creates pressure on the traditional application security cycle, where developers write code, scanners find problems, security teams prioritize them, and engineers fix the most important issues. If teams create many times more code, security teams can also face many more components, dependencies, findings, and fixes to manage. The article says more scanning alone may not solve the issue because it can simply create a larger backlog.\u003c/p\u003e\n\n\u003cp\u003eThe webinar is presented as a discussion of how security teams can keep AI-driven development fast without letting risk grow at the same pace. It examines where traditional CVE-driven remediation starts to break down, what secure-by-default development should look like, and how to build controls before code reaches production. The article also highlights governance questions for security leaders, including who owns the risk, how much exposure the organization accepts, and how those choices are explained to executives and boards.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI is helping development teams produce far more code much faster, while security teams still have to review vulnerabilities, manage dependencies, prioritize fixes, and control risk at human speed.","The article says that when software output increases by 10 to 50 times, security teams can face many more components, dependencies, findings, and fixes to manage, and more scanning alone can create a larger backlog.","The webinar “The True Cost of Building at Machine Speed” focuses on how security teams can keep AI-driven development fast without letting risk scale with it.","The article says AI-assisted development raises governance questions for security leaders, including who owns the risk, how much exposure the organization is accepting, and how to explain those choices to executives and boards.","The article argues that slowing developers down is not the answer and that security controls should be designed around how software is being built now."],"insights":["The article frames AI-driven development as an operational scaling problem for security, not mainly as a question of whether AI-generated code is secure.","The article argues that simply increasing vulnerability scanning can worsen the security bottleneck by producing a larger backlog of findings rather than reducing risk.","The article highlights that traditional CVE-driven remediation may break down when software creation grows faster than people can realistically review and fix issues.","The article treats AI-assisted development as a governance issue, saying security leaders need to define risk ownership and explain accepted exposure to executives and boards."],"referencedReports":[],"body":"\u003cp\u003eThe article promotes a webinar with Chainguard experts titled “The True Cost of Building at Machine Speed,” focused on securing AI-driven software development. It says AI is helping development teams produce far more code much faster, with software output potentially jumping 10 to 50 times. The article argues that security teams still have to review vulnerabilities, manage dependencies, prioritize fixes, and control risk at human speed.\u003c/p\u003e\n\n\u003cp\u003eThe article says this creates pressure on the traditional application security cycle, where developers write code, scanners find problems, security teams prioritize them, and engineers fix the most important issues. If teams create many times more code, security teams can also face many more components, dependencies, findings, and fixes to manage. The article says more scanning alone may not solve the issue because it can simply create a larger backlog.\u003c/p\u003e\n\n\u003cp\u003eThe webinar is presented as a discussion of how security teams can keep AI-driven development fast without letting risk grow at the same pace. It examines where traditional CVE-driven remediation starts to break down, what secure-by-default development should look like, and how to build controls before code reaches production. The article also highlights governance questions for security leaders, including who owns the risk, how much exposure the organization accepts, and how those choices are explained to executives and boards.\u003c/p\u003e\n"},{"n":38,"title":"What We Heard at Black Hat 2026: Shadow SaaS, Shadow AI, and \"Can You Protect My ERP deployment?\"","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/black-hat-2026-shadow-saas-shadow-ai","time":"16:16","priority":"MAY READ","score":35,"tldr":"Mitiga argues that security leaders are increasingly worried about threats beyond the endpoint, especially shadow SaaS, shadow AI agents, third-party services, and business platforms like SAP that now act as part of the live attack surface. The core takeaway is that discovery, runtime visibility, and correlated data are becoming essential to stop attackers after they log in with valid access.","briefOverview":"\u003cp\u003eAt Black Hat USA 2026, Mitiga did not host a booth and instead met with security leaders in its Zero-Impact Suite at Mandalay Bay. The conversations focused on shadow SaaS, shadow AI agents and copilots, third-party services, runtime security, and requests to protect business platforms such as SAP. Mitiga CMO John Vecchi frames these issues as one question: who protects everything beyond the endpoint?\u003c/p\u003e\n\n\u003cp\u003eThe article says many security leaders are not fully confident in their SaaS inventories because of forgotten tools, old integrations, and OAuth grants that outlived the employees who created them. It argues that shadow AI has grown faster than shadow SaaS because AI agents can hold credentials, touch data, and act at machine speed. The article also says third-party platforms and embedded AI agents become part of the runtime attack surface when they authenticate into an environment, move sensitive data, or execute work on a company’s behalf.\u003c/p\u003e\n\n\u003cp\u003eMitiga argues that posture tools such as CNAPP and CSPM are already in place for many organizations, but they do not address the live window when attackers use unresolved exposures or identity paths. The article says an agentic SOC depends on contextualized data that is normalized, correlated, forensic-grade, and retained longer than 30 days. It concludes that security leaders have moved from asking whether attackers will get in to asking what happens next, and presents Mitiga’s “Zero-Impact Breach Prevention” as the answer.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mitiga hosted security leaders in its Zero-Impact Suite at Mandalay Bay during Black Hat USA 2026 instead of operating a booth on the show floor.","Security leaders told Mitiga they are not fully confident in their SaaS inventories, especially because of forgotten tools, old integrations, and OAuth grants that outlived the employees who created them.","The article says shadow AI agents and copilots can hold credentials, touch data, and act at machine speed outside security review.","Mitiga says third-party services and embedded AI agents have become part of the runtime attack surface when they authenticate into an environment, move sensitive data, or execute work on a company’s behalf.","The article argues that AI analysts in an agentic SOC need normalized, correlated, forensic-grade data with longer retention rather than raw, fragmented alerts and 30-day retention."],"insights":["Security leaders are treating ERP systems such as SAP as environments that need the same kind of live attacker detection and response as cloud and identity systems, not just patching and access reviews.","The article frames shadow AI as more urgent than shadow SaaS because unsanctioned AI agents can continuously take actions with credentials and data, rather than waiting for a person to use them.","Mitiga argues that buying posture tools such as CNAPP or CSPM does not address the active period when known misconfigurations or unresolved identity paths are being exploited.","The article says AI-driven SOC automation may fail to reduce security workload if it is built on the same fragmented alerts and short retention windows that already burden security teams."],"referencedReports":[{"title":"Hugging Face postmortem","url":"https://thehackernews.com/2026/07/openai-agent-used-exposed-credentials.html","publisher":"hugging-face","context":"The article cites Hugging Face's postmortem on an OpenAI evaluation model that chained vulnerabilities into Hugging Face's production environment and reviewed roughly 17,600 agent actions.","category":"research","primary":false}],"body":"\u003cp\u003eAt Black Hat USA 2026, Mitiga did not host a booth and instead met with security leaders in its Zero-Impact Suite at Mandalay Bay. The conversations focused on shadow SaaS, shadow AI agents and copilots, third-party services, runtime security, and requests to protect business platforms such as SAP. Mitiga CMO John Vecchi frames these issues as one question: who protects everything beyond the endpoint?\u003c/p\u003e\n\n\u003cp\u003eThe article says many security leaders are not fully confident in their SaaS inventories because of forgotten tools, old integrations, and OAuth grants that outlived the employees who created them. It argues that shadow AI has grown faster than shadow SaaS because AI agents can hold credentials, touch data, and act at machine speed. The article also says third-party platforms and embedded AI agents become part of the runtime attack surface when they authenticate into an environment, move sensitive data, or execute work on a company’s behalf.\u003c/p\u003e\n\n\u003cp\u003eMitiga argues that posture tools such as CNAPP and CSPM are already in place for many organizations, but they do not address the live window when attackers use unresolved exposures or identity paths. The article says an agentic SOC depends on contextualized data that is normalized, correlated, forensic-grade, and retained longer than 30 days. It concludes that security leaders have moved from asking whether attackers will get in to asking what happens next, and presents Mitiga’s “Zero-Impact Breach Prevention” as the answer.\u003c/p\u003e\n"}]</script>
