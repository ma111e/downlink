<script type="application/json" id="dl-articles">[{"n":16,"title":"China-linked hackers turning popular cybersecurity tool into ransomware launchpad, Microsoft warns","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/china-hackers-ransomware-microsoft","time":"13:15","priority":"MUST READ","score":96,"tldr":"Microsoft warns that China-linked Storm-1175 is likely exploiting a critical N-able N-central flaw to turn MSP remote management servers into launchpads for rapid downstream ransomware attacks using the new StormEncryptor strain. Organizations running N-central should urgently apply the latest hotfixes and reduce exposure, as earlier patches were bypassed and many instances remain vulnerable.","briefOverview":"\u003cp\u003eMicrosoft Threat Intelligence warned that the China-linked Storm-1175 group began deploying a new ransomware strain called StormEncryptor on August 2. The group is believed to be exploiting CVE-2026-18577, a critical vulnerability in N-able’s N-central remote monitoring and management console. N-central is used by thousands of managed service providers to administer client endpoints, making the flaw a potential supply-chain risk.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability can give attackers unauthenticated, full administrative control of an N-central server, according to Huntress. Because managed service providers use N-central to remotely manage clients’ machines, one compromised server can become a gateway to every endpoint it controls. The article compares the potential cascading impact to earlier attacks involving Kaseya in 2021 and ConnectWise ScreenConnect in 2024.\u003c/p\u003e\n\n\u003cp\u003eN-able said the flaw was first detected in a zero-day attack on July 31 and that attackers found a way around an initial patch. The company issued an emergency hotfix on August 2 and a second emergency hotfix on August 6, warning customers that the first was not enough. Huntress said more than half of reachable N-central cloud servers across its partner base were still unpatched, while 28.6% of self-hosted instances remained exposed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Threat Intelligence warned that the China-linked Storm-1175 group began deploying a new ransomware strain called StormEncryptor on August 2.","Microsoft said Storm-1175 is likely exploiting CVE-2026-18577, a critical vulnerability in N-able’s N-central remote monitoring and management console.","Huntress said CVE-2026-18577 allows attackers with no credentials to gain full administrative control of an N-central server, which can provide access to every endpoint the server manages.","N-able said the vulnerability was first detected in a zero-day attack on July 31 and issued emergency hotfixes on August 2 and August 6 after attackers bypassed an initial patch.","Huntress found that more than half of reachable N-central cloud servers across its partner base were still unpatched, along with 28.6% of self-hosted instances."],"insights":["The biggest risk is not just one N-central server being compromised, but the cascading access it can provide to every client endpoint managed through that server.","Patching alone may be unreliable unless customers have applied the latest emergency hotfix, because N-able said attackers bypassed an initial patch before later fixes were issued.","The campaign moved faster than many organizations could patch, with StormEncryptor deployments beginning the same day CVE-2026-18577 was disclosed and many reachable servers still exposed afterward.","Taking N-central offline may reduce exposure in high-risk environments, but Huntress warned this creates a difficult tradeoff because organizations could lose central visibility, patching, and remote access when they may need them most."],"referencedReports":[{"title":"Storm-1175 focuses gaze on vulnerable web-facing assets in high-tempo Medusa ransomware operations","url":"https://www.microsoft.com/en-us/security/blog/2026/04/06/storm-1175-focuses-gaze-on-vulnerable-web-facing-assets-in-high-tempo-medusa-ransomware-operations/","publisher":"Microsoft","context":"The article cites this Microsoft analysis for background on Storm-1175’s prior Medusa ransomware activity and rapid exploitation behavior.","category":"research","primary":false},{"title":"N-able Vulnerability Exploitation","url":"https://www.huntress.com/blog/n-able-vulnerability-exploitation","publisher":"Huntress","context":"The article cites Huntress for details on the severity of CVE-2026-18577, downstream host activity, patch exposure, and mitigation considerations.","category":"research","primary":true},{"title":"N-central Security Update August 6, 2026","url":"https://www.n-able.com/blog/n-central-security-update-august-6-2026","publisher":"N-able","context":"The article cites N-able’s security update for information about the emergency hotfixes and the warning that the first fix was insufficient.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft Threat Intelligence warned that the China-linked Storm-1175 group began deploying a new ransomware strain called StormEncryptor on August 2. The group is believed to be exploiting CVE-2026-18577, a critical vulnerability in N-able’s N-central remote monitoring and management console. N-central is used by thousands of managed service providers to administer client endpoints, making the flaw a potential supply-chain risk.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability can give attackers unauthenticated, full administrative control of an N-central server, according to Huntress. Because managed service providers use N-central to remotely manage clients’ machines, one compromised server can become a gateway to every endpoint it controls. The article compares the potential cascading impact to earlier attacks involving Kaseya in 2021 and ConnectWise ScreenConnect in 2024.\u003c/p\u003e\n\n\u003cp\u003eN-able said the flaw was first detected in a zero-day attack on July 31 and that attackers found a way around an initial patch. The company issued an emergency hotfix on August 2 and a second emergency hotfix on August 6, warning customers that the first was not enough. Huntress said more than half of reachable N-central cloud servers across its partner base were still unpatched, while 28.6% of self-hosted instances remained exposed.\u003c/p\u003e\n"},{"n":6,"title":"Critical Progress LoadMaster flaw now actively exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-critical-progress-loadmaster-flaw-exploited-in-attacks/","time":"09:49","priority":"MUST READ","score":95,"tldr":"CISA says attackers are actively exploiting a critical unauthenticated command injection flaw in Progress Kemp LoadMaster, and federal agencies have been ordered to patch within three days. All organizations using affected LoadMaster or MOVEit WAF versions should update immediately to block remote command execution attacks.","briefOverview":"\u003cp\u003eCISA warned that hackers are exploiting CVE-2026-8037, a critical command injection vulnerability in Progress Kemp LoadMaster. Kemp LoadMaster is an Application Delivery Controller and server load balancer used by technology companies and government entities worldwide to distribute web traffic, optimize application performance, and maintain availability. Progress Software says 80% of Fortune 500 companies use its products and services, and that Kemp LoadMaster has over 100,000 deployments worldwide.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated attackers to execute arbitrary commands on unpatched LoadMaster appliances by exploiting unsanitized API inputs in multiple command endpoints. Progress released security updates in June for Kemp LoadMaster GA v7.2.63.1 or older and LTSF v7.2.54.17 or older. The company also confirmed that all MOVEit WAF versions before GA v7.2.63.2 are affected.\u003c/p\u003e\n\n\u003cp\u003eShadowserver reported nearly 300 Kemp LoadMaster instances exposed online, though the article says it is unclear how many are honeypots or already protected against CVE-2026-8037. CISA added the flaw to its catalog of actively exploited vulnerabilities and ordered U.S. Federal Civilian Executive Branch agencies to secure their servers within three days under Binding Operational Directive 26-04. CISA said this type of vulnerability is a frequent attack vector for malicious cyber actors and poses significant risks to the federal enterprise, while also urging all defenders to prioritize patching.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that hackers are exploiting CVE-2026-8037, a critical Progress Kemp LoadMaster command injection vulnerability.","CVE-2026-8037 allows unauthenticated attackers to execute arbitrary commands on unpatched LoadMaster appliances by exploiting unsanitized API inputs in multiple command endpoints.","Progress Software released security updates in June for affected Kemp LoadMaster versions and confirmed the flaw also impacts all MOVEit WAF versions before GA v7.2.63.2.","Shadowserver reported nearly 300 Kemp LoadMaster instances exposed online, though it is unknown how many are honeypots or already secured against CVE-2026-8037.","CISA added CVE-2026-8037 to its Known Exploited Vulnerabilities catalog and ordered U.S. Federal Civilian Executive Branch agencies to secure affected servers within three days."],"insights":["CISA’s three-day deadline for federal agencies indicates the agency views CVE-2026-8037 as requiring unusually urgent remediation once exploitation is confirmed.","The vulnerability affects both Kemp LoadMaster and MOVEit WAF, so organizations should not limit their checks to LoadMaster deployments alone.","Progress patched the flaw in June, but CISA’s later warning shows that systems remaining unpatched after the update became active targets.","Shadowserver’s count of nearly 300 internet-exposed LoadMaster instances may overstate or understate real risk because the article notes it is unknown how many are honeypots or already secured."],"referencedReports":[{"title":"LoadMaster Critical Security Bulletin June 2026: CVE-2026-8037, CVE-2026-33691","url":"https://community.progress.com/s/article/LoadMaster-Critical-Security-Bulletin-June-2026-CVE-2026-8037-CVE-2026-33691","publisher":"Progress Software","context":"The article says Progress released security updates in June to patch CVE-2026-8037 in affected Kemp LoadMaster versions.","category":"advisory","primary":true},{"title":"MOVEit WAF Critical Security Bulletin June 2026: CVE-2026-8037, CVE-2026-33691","url":"https://community.progress.com/s/article/MOVEit-WAF-Critical-Security-Bulletin-June-2026-CVE-2026-8037-CVE-2026-33691","publisher":"Progress Software","context":"The article says Progress confirmed that all MOVEit WAF versions before GA v7.2.63.2 are impacted by the vulnerability.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article says CISA added CVE-2026-8037 to its catalog of actively exploited vulnerabilities and ordered federal agencies to secure affected servers within three days.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog: CVE-2026-8037","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-8037","publisher":"CISA","context":"The article references CISA’s Known Exploited Vulnerabilities catalog entry for CVE-2026-8037 as evidence that the flaw is being actively exploited.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA warned that hackers are exploiting CVE-2026-8037, a critical command injection vulnerability in Progress Kemp LoadMaster. Kemp LoadMaster is an Application Delivery Controller and server load balancer used by technology companies and government entities worldwide to distribute web traffic, optimize application performance, and maintain availability. Progress Software says 80% of Fortune 500 companies use its products and services, and that Kemp LoadMaster has over 100,000 deployments worldwide.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated attackers to execute arbitrary commands on unpatched LoadMaster appliances by exploiting unsanitized API inputs in multiple command endpoints. Progress released security updates in June for Kemp LoadMaster GA v7.2.63.1 or older and LTSF v7.2.54.17 or older. The company also confirmed that all MOVEit WAF versions before GA v7.2.63.2 are affected.\u003c/p\u003e\n\n\u003cp\u003eShadowserver reported nearly 300 Kemp LoadMaster instances exposed online, though the article says it is unclear how many are honeypots or already protected against CVE-2026-8037. CISA added the flaw to its catalog of actively exploited vulnerabilities and ordered U.S. Federal Civilian Executive Branch agencies to secure their servers within three days under Binding Operational Directive 26-04. CISA said this type of vulnerability is a frequent attack vector for malicious cyber actors and poses significant risks to the federal enterprise, while also urging all defenders to prioritize patching.\u003c/p\u003e\n"},{"n":10,"title":"CISA: SonicWall SMA1000 flaws now exploited by ransomware gangs","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-sonicwall-sma1000-flaws-now-exploited-by-ransomware-gangs/","time":"14:34","priority":"MUST READ","score":95,"tldr":"CISA says ransomware gangs are now exploiting two recently patched SonicWall SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, which were previously abused as zero-days. Organizations using SMA1000 appliances should apply SonicWall’s hotfix immediately and check for signs of compromise.","briefOverview":"\u003cp\u003eCISA has confirmed that ransomware gangs have begun exploiting two recently patched SonicWall SMA1000 vulnerabilities, tracked as CVE-2026-15409 and CVE-2026-15410. SonicWall released patches for the flaws in mid July and warned at the time that threat actors had already been exploiting them in zero-day attacks. SMA1000 is an enterprise-grade secure remote access gateway used by large corporations, government agencies, and Managed Service Providers to provide VPN access to internal applications and corporate networks.\u003c/p\u003e\n\n\u003cp\u003eVolexity later reported that a threat actor tracked as UTA0533 began exploiting the vulnerabilities as early as June 22, weeks before SonicWall publicly disclosed the flaws. The actor used the flaws to deploy custom malware known as KNUCKLEBALL, Sou5, ROOTRUN, and ORANGETAIL on vulnerable VPN appliances. Shadowserver currently tracks over 380 SMA1000 appliances exposed online, although some may already have been secured against attacks.\u003c/p\u003e\n\n\u003cp\u003eCISA added the two flaws to its Known Exploited Vulnerabilities Catalog on July 14 and ordered Federal Civilian Executive Branch agencies to patch their systems within three days. CISA said this type of vulnerability is a frequent attack vector for malicious cyber actors and poses significant risks to the federal enterprise. SonicWall has not yet updated its original advisory to confirm ransomware targeting, but CISA has flagged both vulnerabilities as exploited by ransomware gangs in recent KEV Catalog updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA confirmed that ransomware gangs have begun exploiting two recently patched SonicWall SMA1000 vulnerabilities tracked as CVE-2026-15409 and CVE-2026-15410.","SonicWall released patches for CVE-2026-15409 and CVE-2026-15410 in mid July and warned at the time that threat actors had been exploiting them in zero-day attacks.","Volexity reported that a threat actor tracked as UTA0533 began exploiting the vulnerabilities as early as June 22 to deploy custom malware named KNUCKLEBALL, Sou5, ROOTRUN, and ORANGETAIL on vulnerable VPN appliances.","CISA added the two flaws to its Known Exploited Vulnerabilities Catalog on July 14 and ordered Federal Civilian Executive Branch agencies to patch their systems within three days.","Shadowserver currently tracks over 380 SonicWall SMA1000 appliances exposed online, although some may already have been secured against attacks."],"insights":["CISA’s ransomware flag raises the urgency beyond ordinary patch management because the same two SMA1000 flaws are now tied to ransomware activity as well as earlier zero-day exploitation.","The three-day patch deadline for Federal Civilian Executive Branch agencies shows CISA treated these SonicWall flaws as an immediate federal enterprise risk rather than a routine vulnerability notice.","The reported exploitation began weeks before SonicWall’s public disclosure, so organizations cannot rely only on the patch release date when deciding how far back to review systems for compromise.","The article describes repeated recent security problems involving SonicWall remote access products, including another SMA1000 flaw, exposed firewall backup files, stolen SSLVPN credentials, and OVERSTEP rootkit malware targeting SMA 100 series devices."],"referencedReports":[{"title":"SonicWall PSIRT advisory SNWLID-2026-0008","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008","publisher":"SonicWall","context":"The article cites SonicWall’s original advisory for CVE-2026-15409 and CVE-2026-15410, which warned customers to apply the hotfix release.","category":"advisory","primary":false},{"title":"CISA Known Exploited Vulnerabilities Catalog entry for CVE-2026-15409","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-15409","publisher":"CISA","context":"The article references CISA’s KEV Catalog update flagging CVE-2026-15409 as exploited by ransomware gangs.","category":"advisory","primary":true},{"title":"CISA Known Exploited Vulnerabilities Catalog entry for CVE-2026-15410","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-15410","publisher":"CISA","context":"The article references CISA’s KEV Catalog update flagging CVE-2026-15410 as exploited by ransomware gangs.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has confirmed that ransomware gangs have begun exploiting two recently patched SonicWall SMA1000 vulnerabilities, tracked as CVE-2026-15409 and CVE-2026-15410. SonicWall released patches for the flaws in mid July and warned at the time that threat actors had already been exploiting them in zero-day attacks. SMA1000 is an enterprise-grade secure remote access gateway used by large corporations, government agencies, and Managed Service Providers to provide VPN access to internal applications and corporate networks.\u003c/p\u003e\n\n\u003cp\u003eVolexity later reported that a threat actor tracked as UTA0533 began exploiting the vulnerabilities as early as June 22, weeks before SonicWall publicly disclosed the flaws. The actor used the flaws to deploy custom malware known as KNUCKLEBALL, Sou5, ROOTRUN, and ORANGETAIL on vulnerable VPN appliances. Shadowserver currently tracks over 380 SMA1000 appliances exposed online, although some may already have been secured against attacks.\u003c/p\u003e\n\n\u003cp\u003eCISA added the two flaws to its Known Exploited Vulnerabilities Catalog on July 14 and ordered Federal Civilian Executive Branch agencies to patch their systems within three days. CISA said this type of vulnerability is a frequent attack vector for malicious cyber actors and poses significant risks to the federal enterprise. SonicWall has not yet updated its original advisory to confirm ransomware targeting, but CISA has flagged both vulnerabilities as exploited by ransomware gangs in recent KEV Catalog updates.\u003c/p\u003e\n"},{"n":3,"title":"New StormEncryptor ransomware used by former Medusa affiliate","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-stormencryptor-ransomware-used-by-former-medusa-affiliate/","time":"17:42","priority":"MUST READ","score":94,"tldr":"Microsoft says China-based threat actor Storm-1175, formerly linked to Medusa ransomware, is now deploying a new ransomware strain called StormEncryptor after likely exploiting an N-able N-central authentication-bypass flaw. Admins of self-hosted N-central servers should urgently apply the August hotfix and check for compromise because the group moves from initial access to data theft and encryption within days.","briefOverview":"\u003cp\u003eA financially motivated threat actor previously associated with the Medusa ransomware operation is now deploying a new ransomware strain called StormEncryptor. Microsoft Threat Intelligence tracks the actor as Storm-1175 and says the recent attacks were likely preceded by exploitation of CVE-2026-18577, an authentication-bypass vulnerability in N-able’s N-central remote monitoring and management tool. Microsoft says Storm-1175 is believed to be China-based and was previously linked to attacks involving zero-day and n-day flaws in products including GoAnywhere MFT, SmarterTools SmarterMail, Microsoft Exchange, Ivanti Connect Secure, and JetBrains TeamCity.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says Storm-1175’s deployment of StormEncryptor is the actor’s first activity it has observed since April 2026 and represents a shift away from Medusa ransomware. StormEncryptor is described as C++ malware that appends encrypted files with the “.encrypted” extension and drops a ransom note named “!!!README_FIRST!!!.txt” into every scanned directory. The ransom note gives victims three days to contact the attacker and negotiate payment, or stolen data will be leaked online.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to target networks, the attacker used AnyDesk or SimpleHelp for remote management, Advanced IP Scanner for network discovery, and Mimikatz to dump credentials from the LSASS process. Microsoft warned that Storm-1175 can move from initial access to data exfiltration and ransomware deployment within a few days, and urged organizations to monitor for the actor’s activity and apply security patches as soon as possible. N-able released hotfix 2026.3 HF1/build 2026.3.1.7 on August 2 for CVE-2026-18577 and previously recommended checks for signs of compromise such as an svchost.exe file in users’ Documents folders, a Cloudflared service, and inbound connections from IP addresses listed in its advisory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Threat Intelligence says the financially motivated threat actor Storm-1175, previously associated with Medusa ransomware, is now deploying a new ransomware strain called StormEncryptor.","Microsoft says the recent attacks were likely preceded by exploitation of CVE-2026-18577, an authentication-bypass vulnerability in N-able’s N-central remote monitoring and management tool.","StormEncryptor is a C++ malware that appends encrypted files with the “.encrypted” extension and drops a ransom note named “!!!README_FIRST!!!.txt” into every scanned directory.","After gaining access to target networks, the attacker used AnyDesk or SimpleHelp for remote management, Advanced IP Scanner for network discovery, and Mimikatz to dump credentials from the LSASS process.","N-able released hotfix 2026.3 HF1/build 2026.3.1.7 on August 2 and urged customers to install it immediately."],"insights":["Storm-1175’s use of StormEncryptor is notable because Microsoft says it is the actor’s first observed activity since April 2026 and marks a shift away from the Medusa ransomware it previously used.","The article highlights self-hosted N-central servers as an urgent priority because Microsoft says Storm-1175 can move from initial access to data theft and ransomware deployment within a few days.","N-able’s compromise checks give defenders concrete indicators to look for, including an svchost.exe file in users’ Documents folders, a Cloudflared service, and inbound connections from IP addresses listed in its advisory.","StormEncryptor’s ransom note combines file encryption with a data-leak threat, giving victims three days to contact the attackers before stolen data is leaked online."],"referencedReports":[{"title":"N-central 2026.3 Hotfix 1 Mitigation for CVE-2026-18577","url":"https://status.n-able.com/2026/08/02/n-central-2026-3-hotfix-1-mitigation-for-cve-2026-18577/","publisher":"N-able","context":"The article cites N-able’s advisory for recommended compromise checks, including suspicious svchost.exe files, a Cloudflared service, and inbound connections from listed IP addresses.","category":"advisory","primary":false}],"body":"\u003cp\u003eA financially motivated threat actor previously associated with the Medusa ransomware operation is now deploying a new ransomware strain called StormEncryptor. Microsoft Threat Intelligence tracks the actor as Storm-1175 and says the recent attacks were likely preceded by exploitation of CVE-2026-18577, an authentication-bypass vulnerability in N-able’s N-central remote monitoring and management tool. Microsoft says Storm-1175 is believed to be China-based and was previously linked to attacks involving zero-day and n-day flaws in products including GoAnywhere MFT, SmarterTools SmarterMail, Microsoft Exchange, Ivanti Connect Secure, and JetBrains TeamCity.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says Storm-1175’s deployment of StormEncryptor is the actor’s first activity it has observed since April 2026 and represents a shift away from Medusa ransomware. StormEncryptor is described as C++ malware that appends encrypted files with the “.encrypted” extension and drops a ransom note named “!!!README_FIRST!!!.txt” into every scanned directory. The ransom note gives victims three days to contact the attacker and negotiate payment, or stolen data will be leaked online.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to target networks, the attacker used AnyDesk or SimpleHelp for remote management, Advanced IP Scanner for network discovery, and Mimikatz to dump credentials from the LSASS process. Microsoft warned that Storm-1175 can move from initial access to data exfiltration and ransomware deployment within a few days, and urged organizations to monitor for the actor’s activity and apply security patches as soon as possible. N-able released hotfix 2026.3 HF1/build 2026.3.1.7 on August 2 for CVE-2026-18577 and previously recommended checks for signs of compromise such as an svchost.exe file in users’ Documents folders, a Cloudflared service, and inbound connections from IP addresses listed in its advisory.\u003c/p\u003e\n"},{"n":7,"title":"BdThemes plugins supply-chain hack creates rogue WordPress admins","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bdthemes-plugins-supply-chain-hack-creates-rogue-wordpress-admins/","time":"21:12","priority":"MUST READ","score":94,"tldr":"BdThemes’ WordPress plugin ecosystem was hit by a supply-chain compromise where attackers poisoned a remote JSON feed to run malicious JavaScript in admin dashboards, creating hidden rogue administrator accounts. Affected plugins were pulled from WordPress.org while the issue remained under investigation.","briefOverview":"\u003cp\u003eA threat actor compromised the upstream infrastructure of BdThemes, a developer of premium WordPress web-design tools, and modified a remote JSON feed delivered to administrators’ browsers to create rogue admin accounts. BdThemes provides plugins including Element Pack, Prime Slider, Ultimate Post Kit, Pixel Gallery, and Ultimate Store Kit. Its free Element Pack plugin shows more than 100,000 active installations on WordPress.org, while BdThemes advertises more than 350,000 active installs across its portfolio.\u003c/p\u003e\n\n\u003cp\u003eDefiant said Wordfence began seeing attacks through its web application firewall on August 7, and researchers determined the earliest possible start of the campaign was June 23. The affected BdThemes products were pulled from the WordPress.org directory on August 8 pending investigation, and the article says the issue was listed as unpatched as of publication. At the time of writing, BdThemes had not published an official statement, and BleepingComputer had not received a response to its request for comment.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the attacker poisoned a static remote JSON data stream after obtaining write access to the vendor’s storage bucket. The attack exploited a cross-site scripting flaw in the Biggop Library used by the Biggopti component, allowing malicious JavaScript to run when a logged-in administrator opened a wp-admin page. The injected code used the legitimate administrator’s authenticated session to create rogue admin accounts, manipulated WordPress database queries to hide them, and used an additional payload called w2.js to establish persistence through a webshell named emer-run.php by installing a fake plugin.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor compromised BdThemes’ upstream infrastructure and modified a remote JSON feed delivered to administrators’ browsers to create rogue WordPress administrator accounts.","Wordfence researchers said the attacker poisoned a static remote JSON data stream after obtaining write access to the vendor’s storage bucket, exploiting a cross-site scripting flaw in the Biggop Library used by the Biggopti component.","The malicious JavaScript used a legitimate administrator’s authenticated session to create rogue admin accounts, and an additional payload called w2.js established persistence through a webshell named emer-run.php by installing a fake plugin.","The affected BdThemes plugins were pulled from the WordPress.org directory on August 8 pending investigation, and the issue was listed as unpatched as of publication.","Defiant said the earliest possible start of the campaign was June 23, while Wordfence began seeing attacks through its web application firewall on August 7."],"insights":["The compromise was especially stealthy because it was driven entirely through a remote API response and did not require a plugin update, file modification, or user interaction.","The malicious code executed whenever a logged-in administrator opened a WordPress admin page, meaning routine site management activity could trigger the compromise.","The injected code manipulated WordPress database queries to hide rogue administrator accounts from the user list, reducing the chance that site owners would notice the compromise through normal admin checks.","Although the issue was assigned only a medium severity score, the article describes an attack path that could create persistent hidden administrator access on impacted sites.","Defiant said reports on the command-and-control infrastructure linked the observed attacks to the same attacker associated with recent Advanced Responsive Video Embedder and OptinMonster supply-chain compromises."],"referencedReports":[{"title":"PSA: Supply Chain Compromise in BdThemes Ecosystem via Poisoned API Response","url":"https://www.wordfence.com/blog/2026/08/psa-supply-chain-compromise-in-bdthemes-ecosystem-via-poisoned-api-response/","publisher":"Defiant / Wordfence","context":"The article cites Defiant’s Wordfence report for the technical details of the poisoned API response, the XSS flaw, rogue administrator creation, and persistence mechanism.","category":"research","primary":true}],"body":"\u003cp\u003eA threat actor compromised the upstream infrastructure of BdThemes, a developer of premium WordPress web-design tools, and modified a remote JSON feed delivered to administrators’ browsers to create rogue admin accounts. BdThemes provides plugins including Element Pack, Prime Slider, Ultimate Post Kit, Pixel Gallery, and Ultimate Store Kit. Its free Element Pack plugin shows more than 100,000 active installations on WordPress.org, while BdThemes advertises more than 350,000 active installs across its portfolio.\u003c/p\u003e\n\n\u003cp\u003eDefiant said Wordfence began seeing attacks through its web application firewall on August 7, and researchers determined the earliest possible start of the campaign was June 23. The affected BdThemes products were pulled from the WordPress.org directory on August 8 pending investigation, and the article says the issue was listed as unpatched as of publication. At the time of writing, BdThemes had not published an official statement, and BleepingComputer had not received a response to its request for comment.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the attacker poisoned a static remote JSON data stream after obtaining write access to the vendor’s storage bucket. The attack exploited a cross-site scripting flaw in the Biggop Library used by the Biggopti component, allowing malicious JavaScript to run when a logged-in administrator opened a wp-admin page. The injected code used the legitimate administrator’s authenticated session to create rogue admin accounts, manipulated WordPress database queries to hide them, and used an additional payload called w2.js to establish persistence through a webshell named emer-run.php by installing a fake plugin.\u003c/p\u003e\n"},{"n":15,"title":"FBI, South Korea warn of Gunra ransomware gang targeting critical infrastructure","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ransomware-south-korea-fbi-gunra","time":"19:30","priority":"MUST READ","score":94,"tldr":"The FBI and South Korea warned that the Gunra ransomware gang is exploiting Fortinet firewall flaws to break into critical infrastructure organizations, steal and encrypt data, and demand multimillion-dollar ransoms. The group has expanded into ransomware-as-a-service and is targeting sectors including healthcare, finance, and government worldwide.","briefOverview":"\u003cp\u003eThe FBI and South Korea’s National Police Agency warned that the Gunra ransomware gang is breaching critical infrastructure organizations through vulnerabilities in Fortinet firewall products. The advisory said Gunra emerged in April 2025 and is built using source code from the Conti ransomware that was leaked in 2022. CISA described Gunra as part of an ongoing trend of ransomware attacks disrupting U.S. and international organizations.\u003c/p\u003e\n\n\u003cp\u003eThe agencies said Gunra actors have exploited CVE-2024-55591 and CVE-2025-24472 to gain privileged access, steal data, encrypt data, and extort victims. Incidents handled by the FBI and South Korea’s police agency showed the group targeting healthcare, financial services, and government sectors globally. Victims were often given ransom demands exceeding $10 million and five to seven days to pay, while the FBI also observed attempts to contact victim company management by email.\u003c/p\u003e\n\n\u003cp\u003eThe FBI said Gunra moved to a ransomware-as-a-service model and has recruited new members and initial access brokers, including under the alias “Golden Community.” The group initially focused on Windows devices but later created and used a Linux variant, which researchers found had a weakness that can allow defenders to recover files using file timestamps. The advisory comes amid industry warnings that ransomware incidents against industrial organizations continue to rise, with Dragos identifying 1,140 such incidents worldwide in the second quarter of 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI and South Korea’s National Police Agency warned that the Gunra ransomware gang is breaching critical infrastructure organizations through vulnerabilities in Fortinet firewall products.","The advisory said Gunra actors have exploited CVE-2024-55591 and CVE-2025-24472 to gain privileged access, steal and encrypt data, and extort victims.","Investigations by the FBI and South Korea’s police agency found that Gunra is targeting healthcare, financial services, and government sectors globally, with ransom demands often exceeding $10 million.","The FBI first observed Gunra and its leak site in April 2025, and the group later moved to a ransomware-as-a-service model while recruiting new members on cybercriminal forums.","Researchers found a weakness in Gunra’s Linux variant that can allow defenders to reconstruct keys from file timestamps and recover files without paying the ransom."],"insights":["Gunra’s use of leaked Conti source code shows that older ransomware code leaks continue to enable new criminal operations years later.","The advisory highlights two specific Fortinet firewall flaws, CVE-2024-55591 and CVE-2025-24472, as a practical priority for organizations trying to reduce exposure to Gunra activity.","Gunra has tried emailing victim company management directly to solicit ransom payments, but the FBI said this tactic has had limited success.","A known flaw in Gunra’s Linux variant may allow some victims to recover files without paying, because researchers found that keys can be reconstructed using file timestamps.","The reported overlap between Gunra tools and infrastructure and North Korea’s Lazarus Group activity against South Korean organizations makes Gunra’s ecosystem more complex than a standalone ransomware operation."],"referencedReports":[{"title":"Cybersecurity Advisory AA26-222A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a","publisher":"CISA, FBI, and South Korea’s National Police Agency","context":"The article is based on a cybersecurity advisory warning that Gunra actors are exploiting Fortinet firewall vulnerabilities to target critical infrastructure organizations.","category":"advisory","primary":true},{"title":"Gunra Ransomware Linux Variant","url":"https://www.trendmicro.com/en_us/research/25/g/gunra-ransomware-linux-variant.html","publisher":"Trend Micro","context":"The article cites Trend Micro research when noting that Gunra created and began using a Linux variant.","category":"research","primary":false},{"title":"Gunra Ransomware’s Linux Variant Has a Fatal Flaw: Time-Seeded rand Makes Encrypted Files Recoverable Without Paying","url":"https://intel.breakglass.tech/post/gunra-ransomware-s-linux-variant-has-a-fatal-flaw-time-seeded-rand-makes-encrypted-files-recoverable-without-paying","publisher":"Breakglass","context":"The article cites this analysis for the finding that a weakness in Gunra’s Linux variant can allow defenders to reconstruct keys using file timestamps.","category":"research","primary":false},{"title":"Dragos Industrial Ransomware Analysis Q2 2026","url":"https://www.dragos.com/blog/dragos-industrial-ransomware-analysis-q2-2026","publisher":"Dragos","context":"The article cites Dragos’ analysis for figures on ransomware incidents affecting industrial organizations in the second quarter of 2026.","category":"research","primary":false}],"body":"\u003cp\u003eThe FBI and South Korea’s National Police Agency warned that the Gunra ransomware gang is breaching critical infrastructure organizations through vulnerabilities in Fortinet firewall products. The advisory said Gunra emerged in April 2025 and is built using source code from the Conti ransomware that was leaked in 2022. CISA described Gunra as part of an ongoing trend of ransomware attacks disrupting U.S. and international organizations.\u003c/p\u003e\n\n\u003cp\u003eThe agencies said Gunra actors have exploited CVE-2024-55591 and CVE-2025-24472 to gain privileged access, steal data, encrypt data, and extort victims. Incidents handled by the FBI and South Korea’s police agency showed the group targeting healthcare, financial services, and government sectors globally. Victims were often given ransom demands exceeding $10 million and five to seven days to pay, while the FBI also observed attempts to contact victim company management by email.\u003c/p\u003e\n\n\u003cp\u003eThe FBI said Gunra moved to a ransomware-as-a-service model and has recruited new members and initial access brokers, including under the alias “Golden Community.” The group initially focused on Windows devices but later created and used a Linux variant, which researchers found had a weakness that can allow defenders to recover files using file timestamps. The advisory comes amid industry warnings that ransomware incidents against industrial organizations continue to rise, with Dragos identifying 1,140 such incidents worldwide in the second quarter of 2026.\u003c/p\u003e\n"},{"n":19,"title":"TrueConf Server Flaws Exploited to Replace Client Installers with PhantomCore","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/head-mare-exploits-trueconf-flaws-to.html","time":"11:33","priority":"MUST READ","score":94,"tldr":"Head Mare is exploiting patched TrueConf Server flaws to replace legitimate client installers with PhantomCore malware, giving attackers SYSTEM-level access and persistence on Russian organizations’ servers. Organizations running TrueConf Server should update immediately to the fixed 5.3.9, 5.4.9, or 5.5.5 releases.","briefOverview":"\u003cp\u003eKaspersky said it detected July 2026 attacks by the threat actor Head Mare that exploited unpatched TrueConf servers used by Russian companies in sectors including instrumentation, electronics, transport, energy, IT, and software development. The attackers used a vulnerability chain in TrueConf Server to replace legitimate TrueConf client installers with poisoned versions containing the PhantomCore backdoor and remote access trojan. The affected TrueConf Server versions include 5.3.x up to 5.3.9, 5.4.x up to 5.4.9, 5.5.x up to 5.5.5, and earlier.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with a connection to TCP port 4307, which is open by default, followed by exploitation of KLCERT-26-057 to run a malicious script and KLCERT-26-058 to escape an isolated environment. The attackers then execute code with NT AUTHORITY\\SYSTEM privileges and replace “\u0026hellip;\\public\\js\\locale.php” with a web shell for persistent remote access. Kaspersky said the web shell was used to collect infrastructure data, gain privileged access to the TrueConf database, and swap the original TrueConf Client distribution for the infected one.\u003c/p\u003e\n\n\u003cp\u003eThe web shell also served as a conduit for PhantomGraph, a backdoor using SysExcSvc.dll and SysReadSvc.dll, with Microsoft OneDrive used for command-and-control storage. The article also describes a separate HelloNet campaign that abuses the ViPNet product suite update mechanism to run HelloInjector, HelloProxy, and related components against Russian government, energy, transport, education, and logistics sectors. TrueConf patched the vulnerabilities in Server versions 5.3.9, 5.4.9, and 5.5.5 released on June 18, 2026, and organizations using TrueConf are advised to install the latest versions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky detected July 2026 attacks in which the Head Mare threat actor exploited unpatched TrueConf servers used by Russian companies in instrumentation, electronics, transport, energy, IT, and software development sectors.","The attackers chained KLCERT-26-057 and KLCERT-26-058 on TrueConf Server to execute arbitrary code with NT AUTHORITY\\SYSTEM privileges and replace the file \"...\\public\\js\\locale.php\" with a web shell.","The web shell was used to collect IT infrastructure data, gain privileged access to the TrueConf database, and replace the original TrueConf Client distribution with an infected version containing the PhantomCore backdoor and RAT.","Kaspersky said the same web shell also served as a conduit for PhantomGraph, a backdoor that uses SysExcSvc.dll and SysReadSvc.dll and Microsoft OneDrive as command-and-control storage.","The article also describes a separate HelloNet campaign that abuses the ViPNet product suite update mechanism to run HelloInjector, HelloProxy, HelloExecutor, HelloCleaner, and a Rust implant called HelloBackdoor against Russian government, energy, transport, education, and logistics sectors."],"insights":["The TrueConf attack turns a trusted software distribution channel into the delivery mechanism, so systems that were not directly exploited could still be infected by downloading the replaced TrueConf Client installer.","Head Mare’s TrueConf exploitation path starts through TCP port 4307, which the article says is open by default, making exposed unpatched servers especially actionable targets for remediation.","PhantomGraph was split into two DLL modules, and Kaspersky assessed that this was deliberate to make detection by EDR tools harder.","The article shows repeated targeting of Russia-focused software supply and update channels, with both TrueConf installers and the ViPNet update mechanism used as entry points in separate campaigns.","Although the TrueConf flaws were patched on June 18, 2026, Kaspersky still detected exploitation in July 2026, showing that organizations remaining on older versions were still exposed after fixes became available."],"referencedReports":[{"title":"Head Mare targets TrueConf Server with PhantomCore","url":"https://securelist.ru/tr/head-mare-targets-trueconf-server-with-phantomcore/116557/","publisher":"Kaspersky","context":"The article cites Kaspersky’s analysis as the source for the July 2026 TrueConf Server exploitation activity by Head Mare.","category":"research","primary":true},{"title":"HelloNet: ViPNet update mechanism hijacked to deploy HelloInjector and HelloProxy","url":"https://securelist.com/tr/hellonet-vipnet/120700/","publisher":"Kaspersky","context":"The article references Kaspersky’s report on an APT-style campaign abusing the ViPNet product suite update mechanism against Russian sectors.","category":"research","primary":true}],"body":"\u003cp\u003eKaspersky said it detected July 2026 attacks by the threat actor Head Mare that exploited unpatched TrueConf servers used by Russian companies in sectors including instrumentation, electronics, transport, energy, IT, and software development. The attackers used a vulnerability chain in TrueConf Server to replace legitimate TrueConf client installers with poisoned versions containing the PhantomCore backdoor and remote access trojan. The affected TrueConf Server versions include 5.3.x up to 5.3.9, 5.4.x up to 5.4.9, 5.5.x up to 5.5.5, and earlier.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with a connection to TCP port 4307, which is open by default, followed by exploitation of KLCERT-26-057 to run a malicious script and KLCERT-26-058 to escape an isolated environment. The attackers then execute code with NT AUTHORITY\\SYSTEM privileges and replace “\u0026hellip;\\public\\js\\locale.php” with a web shell for persistent remote access. Kaspersky said the web shell was used to collect infrastructure data, gain privileged access to the TrueConf database, and swap the original TrueConf Client distribution for the infected one.\u003c/p\u003e\n\n\u003cp\u003eThe web shell also served as a conduit for PhantomGraph, a backdoor using SysExcSvc.dll and SysReadSvc.dll, with Microsoft OneDrive used for command-and-control storage. The article also describes a separate HelloNet campaign that abuses the ViPNet product suite update mechanism to run HelloInjector, HelloProxy, and related components against Russian government, energy, transport, education, and logistics sectors. TrueConf patched the vulnerabilities in Server versions 5.3.9, 5.4.9, and 5.5.5 released on June 18, 2026, and organizations using TrueConf are advised to install the latest versions.\u003c/p\u003e\n"},{"n":24,"title":"China-Linked Hackers Deploy New StormEncryptor Ransomware, Likely via N-central Flaw","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/china-linked-hackers-deploy-new.html","time":"16:38","priority":"MUST READ","score":94,"tldr":"Microsoft says China-linked Storm-1175 is deploying a new ransomware strain called StormEncryptor, likely after exploiting an actively abused N-able N-central authentication bypass flaw. Organizations using N-central should patch quickly, as the group moves from initial access to data theft and ransomware deployment within days.","briefOverview":"\u003cp\u003eMicrosoft disclosed that Storm-1175, a financially motivated threat actor linked to China, has deployed a previously undocumented ransomware strain called StormEncryptor. The activity marks a shift from the group’s previous use of Medusa ransomware. Microsoft said the exact vulnerability exploited in the campaign is unclear, but the activity likely involves exploitation of CVE-2026-18577 in N-able N-central to gain initial access.\u003c/p\u003e\n\n\u003cp\u003eStormEncryptor is written in C++ and appends the \u003ccode\u003e.encrypted\u003c/code\u003e file name extension to files it encrypts. It also drops a ransom note named \u003ccode\u003e!!!README_FIRST!!!.txt\u003c/code\u003e in every scanned directory. CVE-2026-18577 is assessed as a patch bypass for CVE-2026-18556, and both flaws can allow authentication bypass and account takeover in susceptible versions.\u003c/p\u003e\n\n\u003cp\u003eThe U.S. Cybersecurity and Infrastructure Security Agency has flagged the N-central vulnerabilities as actively exploited in the wild. Microsoft said Storm-1175 has a history of exploiting flaws in products including Mirth Connect, ConnectWise ScreenConnect, JetBrains TeamCity, Fortinet FortiClient EMS, and Fortra GoAnywhere to deploy ransomware. In the new activity, Microsoft observed abuse of AnyDesk or SimpleHelp, use of Advanced IP Scanner for discovery, and LSASS dumping with Mimikatz, with the group often moving from initial access to data exfiltration and ransomware deployment within a few days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft disclosed that the China-linked, financially motivated threat actor Storm-1175 has deployed a previously undocumented ransomware strain called StormEncryptor.","StormEncryptor is written in C++, appends the .encrypted extension to encrypted files, and drops a ransom note named !!!README_FIRST!!!.txt in every scanned directory.","Microsoft said the campaign likely involves exploitation of CVE-2026-18577, a newly disclosed N-able N-central flaw that can allow authentication bypass and account takeover in susceptible versions.","CVE-2026-18577 is assessed as a patch bypass for CVE-2026-18556, and both vulnerabilities have been flagged by CISA as actively exploited in the wild.","Microsoft said Storm-1175’s post-compromise activity includes abuse of AnyDesk or SimpleHelp, use of Advanced IP Scanner for discovery, and LSASS dumping with Mimikatz."],"insights":["Storm-1175’s move from Medusa to the previously undocumented StormEncryptor strain indicates a change in its ransomware tooling rather than a one-off continuation of prior campaigns.","The suspected N-central exploitation is especially urgent because CVE-2026-18577 is described as a patch bypass for CVE-2026-18556, meaning organizations that addressed only the earlier flaw may still be exposed if they have not applied the latest fixes.","Storm-1175 repeatedly targets newly disclosed internet-facing software flaws, making the period between public disclosure and patch adoption a critical risk window for affected customers.","Microsoft’s observation that Storm-1175 can move from initial access to data exfiltration and ransomware deployment within a few days makes rapid patching and post-exposure investigation particularly actionable for N-central customers."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft disclosed that Storm-1175, a financially motivated threat actor linked to China, has deployed a previously undocumented ransomware strain called StormEncryptor. The activity marks a shift from the group’s previous use of Medusa ransomware. Microsoft said the exact vulnerability exploited in the campaign is unclear, but the activity likely involves exploitation of CVE-2026-18577 in N-able N-central to gain initial access.\u003c/p\u003e\n\n\u003cp\u003eStormEncryptor is written in C++ and appends the \u003ccode\u003e.encrypted\u003c/code\u003e file name extension to files it encrypts. It also drops a ransom note named \u003ccode\u003e!!!README_FIRST!!!.txt\u003c/code\u003e in every scanned directory. CVE-2026-18577 is assessed as a patch bypass for CVE-2026-18556, and both flaws can allow authentication bypass and account takeover in susceptible versions.\u003c/p\u003e\n\n\u003cp\u003eThe U.S. Cybersecurity and Infrastructure Security Agency has flagged the N-central vulnerabilities as actively exploited in the wild. Microsoft said Storm-1175 has a history of exploiting flaws in products including Mirth Connect, ConnectWise ScreenConnect, JetBrains TeamCity, Fortinet FortiClient EMS, and Fortra GoAnywhere to deploy ransomware. In the new activity, Microsoft observed abuse of AnyDesk or SimpleHelp, use of Advanced IP Scanner for discovery, and LSASS dumping with Mimikatz, with the group often moving from initial access to data exfiltration and ransomware deployment within a few days.\u003c/p\u003e\n"},{"n":11,"title":"Russian military hackers pose as recruiters to target Ukrainian IT workers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russian-military-hackers-pose-as-recruiters-ukraine-it-workers","time":"15:21","priority":"MUST READ","score":92,"tldr":"Russian GRU-linked Sandworm hackers are posing as recruiters on Ukrainian job sites to trick IT workers into installing a trojanized WireGuard-based VPN app. CERT-UA says the campaign targets system administrators and other IT professionals, but has not disclosed the scale or ultimate objective.","briefOverview":"\u003cp\u003eHackers linked to Russia’s GRU military intelligence agency are posing as recruiters to target Ukrainian IT workers, according to Ukraine’s CERT-UA. The campaign has been running since at least May and is linked to Sandworm, also tracked as APT44 and Seashell Blizzard. The operation mostly targets system administrators and other IT professionals found through legitimate Ukrainian job sites.\u003c/p\u003e\n\n\u003cp\u003eIn one case, the attackers claimed to represent Atlas Business Group and said they were hiring for a project involving Sopra Steria Bulgaria. They moved the conversation from a job website chat to Telegram, conducted screening questions, and arranged a Zoom interview with an English-speaking man. The candidate later received instructions for a technical interview that involved connecting to a corporate network using WireGuard.\u003c/p\u003e\n\n\u003cp\u003eWhen the provided files produced errors, the supposed recruiter directed the candidate to download a custom VPN app called SopraVPN from SourceForge through a website designed to resemble the company’s official site. CERT-UA said SopraVPN used legitimate WireGuard open-source code but was modified so malicious commands could be secretly executed on a victim’s device. CERT-UA did not disclose how many people were targeted or identify the attackers’ ultimate objective.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukraine’s CERT-UA said a campaign running since at least May is linked to Sandworm, a hacking unit associated with Russia’s GRU military intelligence agency.","The hackers search legitimate Ukrainian job sites for IT professionals, review resumes, and contact potential victims while posing as recruiters for an IT company.","In one investigated case, the attackers claimed to represent Atlas Business Group and said they were hiring for a project involving Sopra Steria Bulgaria.","Candidates were told to connect to a corporate network using WireGuard and later to download a custom VPN app called SopraVPN from SourceForge after connection errors occurred.","CERT-UA said SopraVPN was built from legitimate WireGuard open-source code but modified so malicious commands could be covertly executed on a victim’s device."],"insights":["The campaign used a multi-step hiring process across a job site chat, Telegram, email and Zoom, making the approach appear more like a normal recruitment workflow than a simple malicious message.","The attackers lowered suspicion by reusing legitimate names and tools, including Sopra Steria, WireGuard and SourceForge, while modifying the software and surrounding infrastructure for malicious use.","The malicious commands were partly hidden inside encrypted VPN configuration files, meaning a basic review of the files might not reveal the compromise mechanism.","CERT-UA noted that the Zoom interview included an English-speaking man but did not determine whether he was a real participant or an AI-generated persona, highlighting uncertainty about how the attackers staffed the social engineering operation."],"referencedReports":[{"title":"CERT-UA advisory on Sandworm recruitment-themed campaign targeting Ukrainian IT workers","url":"https://cert.gov.ua/article/6318863","publisher":"CERT-UA","context":"The article cites CERT-UA as the source that said the campaign has been running since at least May and linked it to Sandworm.","category":"advisory","primary":true}],"body":"\u003cp\u003eHackers linked to Russia’s GRU military intelligence agency are posing as recruiters to target Ukrainian IT workers, according to Ukraine’s CERT-UA. The campaign has been running since at least May and is linked to Sandworm, also tracked as APT44 and Seashell Blizzard. The operation mostly targets system administrators and other IT professionals found through legitimate Ukrainian job sites.\u003c/p\u003e\n\n\u003cp\u003eIn one case, the attackers claimed to represent Atlas Business Group and said they were hiring for a project involving Sopra Steria Bulgaria. They moved the conversation from a job website chat to Telegram, conducted screening questions, and arranged a Zoom interview with an English-speaking man. The candidate later received instructions for a technical interview that involved connecting to a corporate network using WireGuard.\u003c/p\u003e\n\n\u003cp\u003eWhen the provided files produced errors, the supposed recruiter directed the candidate to download a custom VPN app called SopraVPN from SourceForge through a website designed to resemble the company’s official site. CERT-UA said SopraVPN used legitimate WireGuard open-source code but was modified so malicious commands could be secretly executed on a victim’s device. CERT-UA did not disclose how many people were targeted or identify the attackers’ ultimate objective.\u003c/p\u003e\n"},{"n":12,"title":"Poland uncovers second heat plant cyberattack that went hidden for months","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/poland-uncovers-critical-infrastructure-attack-hidden","time":"15:52","priority":"SHOULD READ","score":89,"tldr":"Polish investigators found that a previously overlooked winter outage at a heat and power plant was actually a cyberattack that used a private cellular data network to jump from compromised wind farm infrastructure into industrial controls. CERT Polska warned that such private networks are often misconfigured and should not be treated as trusted or isolated.","briefOverview":"\u003cp\u003ePoland’s cybersecurity authorities revealed that a previously unknown cyberattack disrupted systems at a combined heat and power plant during last winter’s cold snap. The plant supplied heat to about 50,000 residents, but the disruption was caught quickly enough that customer heating was never interrupted. The incident happened on the same day as coordinated cyberattacks on more than 30 renewable energy installations and a larger heat plant, which Poland had publicly disclosed in January.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the smaller plant incident was initially treated as a contractor error after the steam turbine and water treatment system shut down during routine maintenance over Christmas. Its investigation found what it described as the first known use of a private cellular data network as a pathway into an industrial control system. Attackers moved from compromised wind farm substation firewalls to a cellular router, then to a heat plant controller using factory-default credentials, before disabling Siemens controllers and wiping network equipment configurations.\u003c/p\u003e\n\n\u003cp\u003eThe attackers spent 11 days conducting reconnaissance and were still active while plant staff began restoring systems roughly two hours after the disruption. Investigators reconstructed the attack only because one router running older software preserved logs through a factory reset. CERT Polska warned that the network misconfiguration allowing devices on private cellular networks to communicate freely was common in Poland at the time and is believed to be widespread internationally.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Poland’s cybersecurity authorities revealed that a previously unknown cyberattack disrupted systems at a combined heat and power plant serving about 50,000 residents during last winter’s cold snap.","CERT Polska said the attack was initially mistaken for a contractor error after the plant’s steam turbine and water treatment system shut down during routine maintenance over Christmas.","Investigators found that attackers moved from compromised firewalls at wind farm substations through a private cellular data network to a heat plant controller that still used factory-default login credentials.","The attackers spent 11 days conducting reconnaissance before disabling Siemens controllers, changing passwords to lock out operators, and wiping network equipment configurations to slow recovery.","CERT Polska warned that the private cellular network misconfiguration that enabled the attack was common across Poland at the time and is believed to be widespread internationally."],"insights":["The attack went unnoticed as a cyberattack for months because the outage was initially treated as a low-priority operational issue, showing that unexplained failures can hide serious intrusions even when service is restored quickly.","The incident showed that private cellular networks used by energy sites can create unintended paths between unrelated facilities when devices on the same network are allowed to communicate freely.","Investigators could reconstruct the attack only because one router’s older software preserved event logs after a factory reset, highlighting how evidence can depend on small differences in device behavior.","CERT Polska contrasted the value of reporting unexplained disruptions with the more limited reporting requirements under the European Union’s NIS2 law, indicating that compliance thresholds may miss important warning signs.","The attackers remained active while plant staff were restoring systems, demonstrating that recovery can occur under ongoing attacker activity rather than after an intrusion has ended."],"referencedReports":[{"title":"Incident follow-up report: energy sector 2025","url":"https://cert.pl/en/posts/2026/08/incident-follow-up-report-energy-sector-2025/","publisher":"CERT Polska","context":"The article says CERT Polska’s supplementary report analyzes the newly disclosed attack on a smaller combined heat and power plant and the use of a private cellular data network to reach industrial control systems.","category":"research","primary":true}],"body":"\u003cp\u003ePoland’s cybersecurity authorities revealed that a previously unknown cyberattack disrupted systems at a combined heat and power plant during last winter’s cold snap. The plant supplied heat to about 50,000 residents, but the disruption was caught quickly enough that customer heating was never interrupted. The incident happened on the same day as coordinated cyberattacks on more than 30 renewable energy installations and a larger heat plant, which Poland had publicly disclosed in January.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the smaller plant incident was initially treated as a contractor error after the steam turbine and water treatment system shut down during routine maintenance over Christmas. Its investigation found what it described as the first known use of a private cellular data network as a pathway into an industrial control system. Attackers moved from compromised wind farm substation firewalls to a cellular router, then to a heat plant controller using factory-default credentials, before disabling Siemens controllers and wiping network equipment configurations.\u003c/p\u003e\n\n\u003cp\u003eThe attackers spent 11 days conducting reconnaissance and were still active while plant staff began restoring systems roughly two hours after the disruption. Investigators reconstructed the attack only because one router running older software preserved logs through a factory reset. CERT Polska warned that the network misconfiguration allowing devices on private cellular networks to communicate freely was common in Poland at the time and is believed to be widespread internationally.\u003c/p\u003e\n"},{"n":9,"title":"Hackers breached a small Polish energy plant via private APN last year","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-breached-a-small-polish-energy-plant-via-private-apn-last-year/","time":"23:07","priority":"SHOULD READ","score":88,"tldr":"Polish CERT says hackers linked to Russia’s Electrum group breached a small Polish heat-and-power plant by moving laterally through a misconfigured private APN, then shut down PLCs controlling a steam turbine and water treatment system. The incident highlights that private APNs should be treated as untrusted networks with client isolation, strict allowlists, and hardened device access.","briefOverview":"\u003cp\u003eHackers compromised a small combined heat-and-power plant in Poland during the destructive cyberattacks that hit the country’s energy sector last year. The plant supplies heat to around 50,000 residents, and the incident shut down a steam turbine and the process-water treatment system. Staff restored the affected systems quickly, so the outage was short-lived and had no impact on the population.\u003c/p\u003e\n\n\u003cp\u003ePolish CERT said the attacker used a private Access Point Name to reach the plant’s operational technology network. Investigators determined that the attacker first compromised a FortiGate VPN/firewall at a wind farm and used a Teltonika cellular router to tunnel into a private APN managed by the distribution system operator. The APN lacked client isolation, allowing the attacker to scan for and communicate with devices at other facilities.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the attacker found a WAGO PFC200 PLC with an exposed web interface and default administrator credentials, enabled SSH, and used it as a bridge into the plant’s operational network. On December 29, the attacker accessed the SCADA interface and Siemens PLCs, switched them into STOP mode, activated password protection, and shut down key plant systems. Polish CERT said this was the first known real-world cyberattack involving access to an OT network through a private APN, and recommended treating private APNs as untrusted external networks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Polish CERT disclosed that hackers compromised a small combined heat-and-power plant in Poland by using a private Access Point Name to access its operational technology network.","The attacker switched off programmable logic controllers and protected access with a password, shutting down a steam turbine and the plant’s process-water treatment system.","Plant staff restored the impacted systems quickly, so the outage was short-lived and had no impact on the population.","Polish CERT determined that the attacker first compromised a FortiGate VPN/firewall at a wind farm and used a Teltonika cellular router to tunnel into a private APN managed by the distribution system operator.","Polish CERT said the private APN lacked client isolation, allowing the attacker to scan for and communicate with devices at other facilities."],"insights":["Polish CERT said this was the first known real-world cyberattack in which an attacker reached an operational technology network by moving laterally through a private APN.","The same private APN configuration that enabled the attack was found to be common in Poland at the time, and Polish CERT assessed that similar arrangements are likely used internationally.","The attacker was able to turn an exposed WAGO PFC200 controller with default administrator credentials into a bridge into the plant’s operational technology network.","Polish CERT recommended treating private APNs as untrusted external networks, enabling isolation between connected clients, and using allowlists for essential traffic between APN gateways and operational systems."],"referencedReports":[{"title":"Energy Sector Incident Follow-up Report 2025","url":"https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Follow_up_Report_2025.pdf","publisher":"CERT Polska","context":"The article says Polish CERT disclosed the second incident in a follow-up report and cites the report for details on the private APN attack path.","category":"research","primary":true}],"body":"\u003cp\u003eHackers compromised a small combined heat-and-power plant in Poland during the destructive cyberattacks that hit the country’s energy sector last year. The plant supplies heat to around 50,000 residents, and the incident shut down a steam turbine and the process-water treatment system. Staff restored the affected systems quickly, so the outage was short-lived and had no impact on the population.\u003c/p\u003e\n\n\u003cp\u003ePolish CERT said the attacker used a private Access Point Name to reach the plant’s operational technology network. Investigators determined that the attacker first compromised a FortiGate VPN/firewall at a wind farm and used a Teltonika cellular router to tunnel into a private APN managed by the distribution system operator. The APN lacked client isolation, allowing the attacker to scan for and communicate with devices at other facilities.\u003c/p\u003e\n\n\u003cp\u003eCERT Polska said the attacker found a WAGO PFC200 PLC with an exposed web interface and default administrator credentials, enabled SSH, and used it as a bridge into the plant’s operational network. On December 29, the attacker accessed the SCADA interface and Siemens PLCs, switched them into STOP mode, activated password protection, and shut down key plant systems. Polish CERT said this was the first known real-world cyberattack involving access to an OT network through a private APN, and recommended treating private APNs as untrusted external networks.\u003c/p\u003e\n"},{"n":18,"title":"New Passkey Attacks Can Recover Synced Private Keys or Bypass Phishing-Resistant MFA","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/new-passkey-attacks-can-recover-synced.html","time":"12:25","priority":"SHOULD READ","score":86,"tldr":"Recent research showed that passkeys can be bypassed or abused when surrounding systems expose signed authentication data, mishandle synced key protection, or allow malware in an active Windows session to use hardware-backed credentials. The core cryptography remains intact, but defenders should patch Windows, harden WebAuthn validation, and treat endpoints and passkey stores as high-value credential targets.","briefOverview":"\u003cp\u003eThree separate research efforts demonstrated ways to defeat passkey protections without breaking the cryptography they rely on. SpecterOps showed a Windows and Microsoft Entra ID chain that could impersonate privileged users while satisfying phishing-resistant multifactor authentication by reusing signed authentication material. Unit 42 showed attacks against Google Password Manager in Chrome on Windows, including a path to recover private keys for a victim\u0026rsquo;s synced passkeys. Dirk-jan Mollema showed that malware already running in a signed-in Windows session can use a hardware-bound Windows Hello for Business key without a fresh PIN or biometric check.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the impact and fixes differ across the three cases. Microsoft\u0026rsquo;s Windows logging vulnerability, CVE-2026-34348, has a vendor CVSS score of 6.5 and a Microsoft security update, and Microsoft said it also applied mitigations for the reported issue involving passkey relay assertions. Unit 42\u0026rsquo;s most damaging variant, Golden Pass-ta-key, targets the Security Domain Secret, a 32-byte master key used to protect synced passkeys, and the researchers said Google\u0026rsquo;s current implementation provides no way to rotate or revoke it. Mollema found that an Entra WebAuthn challenge is valid for five minutes and is not bound to a session, user, or tenant, allowing it to be signed on a victim machine and returned as an assertion.\u003c/p\u003e\n\n\u003cp\u003eThe findings show that neither synced passkeys nor device-bound passkeys remove risk when surrounding systems mishandle authentication material or when an endpoint is already compromised. The article says Unit 42\u0026rsquo;s and Mollema\u0026rsquo;s attacks begin with malware or access inside an existing user session, so they show what passkeys may fail to contain after endpoint compromise rather than an unauthenticated remote defeat. Recommended actions include installing Microsoft\u0026rsquo;s applicable updates for CVE-2026-34348, enforcing requested WebAuthn user-verification requirements, treating passkey stores and browser memory as credential-sensitive, and monitoring unusual Windows Hello for Business authentications without a device identifier and unexpected device registrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three separate research efforts demonstrated ways to defeat passkey protections without breaking the cryptography behind them.","SpecterOps showed a Windows and Microsoft Entra ID chain that reused signed authentication material exposed by Windows to impersonate privileged users while satisfying phishing-resistant multifactor authentication.","Unit 42 showed attacks against Google Password Manager in Chrome on Windows, including a method called Golden Pass-ta-key that can recover private keys for a victim's synced passkeys by targeting the Security Domain Secret.","Dirk-jan Mollema showed that malware already running in a signed-in Windows session can use a hardware-bound Windows Hello for Business key without prompting the user for a fresh PIN or biometric check.","Microsoft has issued a security update for CVE-2026-34348 and said it applied mitigations for the reported issue involving passkey relay assertions."],"insights":["The article emphasizes that choosing between synced and device-bound passkeys does not eliminate the broader risk, because the demonstrated attacks target different surrounding systems rather than the passkey cryptography itself.","Unit 42's findings make the Security Domain Secret especially consequential because the article says Google's current implementation provides no way to rotate or revoke it after compromise.","Mollema's research shows an actionable monitoring angle for Entra defenders: unusual Windows Hello for Business authentications without a device identifier and unexpected device registrations may indicate abuse.","The SpecterOps and Mollema findings both involved Microsoft Entra ID authentication outcomes, but the article cautions that the public material does not establish whether they come from the same underlying Entra validation issue."],"referencedReports":[{"title":"Pass-the-Passkey","url":"https://specterops.io/wp-content/uploads/sites/3/2026/08/Pass-the-Passkey_A4_v2.pdf","publisher":"SpecterOps","context":"The article cites SpecterOps' Pass-the-Passkey research presented at Black Hat USA 2026 as the source for the Windows and Microsoft Entra ID passkey impersonation chain.","category":"research","primary":true},{"title":"CVE-2026-34348","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-34348","publisher":"National Vulnerability Database","context":"The article links to the NVD entry for CVE-2026-34348, the Windows Event Logging Service information-disclosure vulnerability discussed in the SpecterOps chain.","category":"advisory","primary":false},{"title":"Microsoft Entra SMS and voice authentication retirement guidance","url":"https://learn.microsoft.com/en-us/entra/identity/authentication/concept-sms-voice-retirement","publisher":"Microsoft","context":"The article references Microsoft Entra migration guidance that describes passkeys as resistant to replay attacks and notes upcoming SMS and voice authentication retirement timelines.","category":"guide","primary":false}],"body":"\u003cp\u003eThree separate research efforts demonstrated ways to defeat passkey protections without breaking the cryptography they rely on. SpecterOps showed a Windows and Microsoft Entra ID chain that could impersonate privileged users while satisfying phishing-resistant multifactor authentication by reusing signed authentication material. Unit 42 showed attacks against Google Password Manager in Chrome on Windows, including a path to recover private keys for a victim\u0026rsquo;s synced passkeys. Dirk-jan Mollema showed that malware already running in a signed-in Windows session can use a hardware-bound Windows Hello for Business key without a fresh PIN or biometric check.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the impact and fixes differ across the three cases. Microsoft\u0026rsquo;s Windows logging vulnerability, CVE-2026-34348, has a vendor CVSS score of 6.5 and a Microsoft security update, and Microsoft said it also applied mitigations for the reported issue involving passkey relay assertions. Unit 42\u0026rsquo;s most damaging variant, Golden Pass-ta-key, targets the Security Domain Secret, a 32-byte master key used to protect synced passkeys, and the researchers said Google\u0026rsquo;s current implementation provides no way to rotate or revoke it. Mollema found that an Entra WebAuthn challenge is valid for five minutes and is not bound to a session, user, or tenant, allowing it to be signed on a victim machine and returned as an assertion.\u003c/p\u003e\n\n\u003cp\u003eThe findings show that neither synced passkeys nor device-bound passkeys remove risk when surrounding systems mishandle authentication material or when an endpoint is already compromised. The article says Unit 42\u0026rsquo;s and Mollema\u0026rsquo;s attacks begin with malware or access inside an existing user session, so they show what passkeys may fail to contain after endpoint compromise rather than an unauthenticated remote defeat. Recommended actions include installing Microsoft\u0026rsquo;s applicable updates for CVE-2026-34348, enforcing requested WebAuthn user-verification requirements, treating passkey stores and browser memory as credential-sensitive, and monitoring unusual Windows Hello for Business authentications without a device identifier and unexpected device registrations.\u003c/p\u003e\n"},{"n":20,"title":"OpenAI's Next AI Model Astra Shows Cyber Performance Strong Enough to Trigger Pause","source":"th
