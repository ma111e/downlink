ed victims who suffered $62 million in losses. Authorities said the defendants are known residents of St. Petersburg, and the article notes that Russia and the U.S. do not have an extradition treaty.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said ransomware groups including Lockbit, BlackSuit and Play used services from Media Land and ML Cloud. Prosecutors also said stolen credit card marketplaces including Briansclub, Cardhouse, crdclub, Club2crd, Verified, Fullzinfo, Swipestore and Bidencash used Media Land infrastructure. Agencies from the Netherlands assisted the investigation, along with the U.K. and Australia.\u003c/p\u003e\n"},{"n":22,"title":"Study of 85 Crypto Wallet Extensions Finds Address Leaks and Cross-Site Tracking Risks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/study-of-85-crypto-wallet-extensions.html","time":"11:55","priority":"SHOULD READ","score":82,"tldr":"KU Leuven researchers found that many popular browser-based crypto wallets leak wallet addresses or expose installed-wallet fingerprints, enabling address linking and cross-site tracking even without a hack. Users can reduce stale permissions manually, but the core privacy risks require wallet vendors and Web3 standards to change how wallets interact with sites and embedded frames.","briefOverview":"\u003cp\u003eResearchers at KU Leuven tested 85 popular crypto wallet browser extensions and found that the wallets can leak enough information to link and track their users. The extensions together have about 35 million users listed on the Chrome Web Store. The team from the university’s DistriNet security group posted the paper on arXiv and plans to present it at the PETS 2026 privacy conference in Calgary in late July.\u003c/p\u003e\n\n\u003cp\u003eThe study found five privacy weaknesses in how wallets and websites interact. Seventeen wallets exposed connections between a user’s separate addresses, either by bundling addresses into one request or by sending separate requests within milliseconds of each other. The article says these leaks can let server operators, or anyone who later gets their data, stitch addresses into one profile.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also found that 36 wallets announce themselves to pages they load, creating an installed-wallet fingerprint even if the user never connects a wallet or blocks cookies. In 22 of those wallets, a site could still read a user’s address after a revoke request, with access surviving cookie clearing and browser restarts. Of the same 36 wallets, 23 could provide an address from inside an embedded frame, which the article says could let a shared tracker connect a wallet address to a name or email on another site if the crypto app was already authorized and allowed embedding.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["KU Leuven researchers tested 85 popular crypto wallet browser extensions with about 35 million Chrome Web Store users and found privacy weaknesses that can link and track wallet users.","Seventeen wallets exposed links between a user’s separate addresses, with 13 bundling multiple addresses into one request and four sending separate requests within milliseconds of each other.","The researchers found that 36 of the 85 wallets announce themselves to any page they load, creating an installed-wallet fingerprint even if the user never connects a wallet or blocks cookies.","In 22 of those 36 wallets, a site could still read a user’s address after asking the wallet to revoke access, and that access survived clearing cookies and restarting the browser.","Of the same 36 wallets, 23 would provide a user’s address from inside an embedded frame, enabling a shared tracker to connect a wallet address with a name or email on another site if the embedded app is already authorized and allows embedding."],"insights":["The privacy risks described in the study do not require a wallet theft or software compromise, because the wallets can expose users through normal built-in behavior.","Clearing browser cookies or restarting the browser may not remove tracking risk from old wallet connections, because stale permissions can remain inside the wallet extension until removed manually from the wallet’s connected-sites list.","The most far-reaching issue depends on ordinary web advertising or tracking behavior: the same script appearing on two sites can use an invisible embedded page from a previously authorized crypto app to retrieve a wallet address without a user click.","Several wallet vendors did not treat the reported cross-site exposure as a security bug, showing that part of the problem is disagreement over whether exposing wallet addresses without stealing funds counts as a serious issue.","The article says user-side mitigations are limited, because clearing old site permissions can help with stale-address tracking but does not stop address leaks to servers or installed-wallet fingerprinting."],"referencedReports":[{"title":"KU Leuven paper on privacy weaknesses in browser-based crypto wallets","url":"https://arxiv.org/abs/2607.06141","publisher":"KU Leuven DistriNet security group","context":"The article says KU Leuven researchers posted this paper on arXiv and will present it at the PETS 2026 privacy conference.","category":"","primary":false},{"title":"2023 research by Christof Ferreira Torres and colleagues on browser wallets leaking addresses to outside servers","url":"https://arxiv.org/abs/2306.08170","publisher":"Christof Ferreira Torres and colleagues","context":"The article says the KU Leuven study builds on this 2023 research, which first showed browser wallets leaking addresses to outside servers.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at KU Leuven tested 85 popular crypto wallet browser extensions and found that the wallets can leak enough information to link and track their users. The extensions together have about 35 million users listed on the Chrome Web Store. The team from the university’s DistriNet security group posted the paper on arXiv and plans to present it at the PETS 2026 privacy conference in Calgary in late July.\u003c/p\u003e\n\n\u003cp\u003eThe study found five privacy weaknesses in how wallets and websites interact. Seventeen wallets exposed connections between a user’s separate addresses, either by bundling addresses into one request or by sending separate requests within milliseconds of each other. The article says these leaks can let server operators, or anyone who later gets their data, stitch addresses into one profile.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also found that 36 wallets announce themselves to pages they load, creating an installed-wallet fingerprint even if the user never connects a wallet or blocks cookies. In 22 of those wallets, a site could still read a user’s address after a revoke request, with access surviving cookie clearing and browser restarts. Of the same 36 wallets, 23 could provide an address from inside an embedded frame, which the article says could let a shared tracker connect a wallet address to a name or email on another site if the crypto app was already authorized and allowed embedding.\u003c/p\u003e\n"},{"n":24,"title":"Researchers Say Claude for Chrome Flaw Lets Rogue Extensions Trigger Gmail Reads","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/claude-for-chrome-flaw-lets-other.html","time":"17:27","priority":"SHOULD READ","score":82,"tldr":"Researchers say Claude for Chrome still lets another extension that can script claude.ai forge a click to launch allowlisted tasks that may read Gmail, Google Docs, or Calendar data. Users are most at risk if “Act without asking” is enabled, because the task can run without an approval prompt, and no patch was available as of July 14.","briefOverview":"\u003cp\u003eResearchers say Claude for Chrome v1.0.80 still lets any other browser extension that can run a script on claude.ai trigger Claude tasks aimed at Gmail, the latest Google Doc and its comments, and Calendar. The issue affects users who run Claude for Chrome alongside another extension that can touch claude.ai. In the default “ask before acting” mode, the forged task still requires the user to click an approval box, but if “Act without asking” is enabled, it can run with no prompt.\u003c/p\u003e\n\n\u003cp\u003eAfter the earlier ClaudeBleed flaw, Anthropic restricted outside callers to nine fixed task IDs instead of allowing arbitrary prompts. Manifold Security says the remaining weak point is that a Claude content script listens for a click on a specific claude.ai element and does not check whether the click was generated by a real user. A script from another extension can create the element, set an allowlisted task ID such as \u003ccode\u003eusecase-gmail\u003c/code\u003e, and dispatch a synthetic click that Claude for Chrome treats as genuine.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a second issue in which Claude’s side panel starts in a mode that skips permission checks when loaded with \u003ccode\u003e?skipPermissions=true\u003c/code\u003e, though it says this path is not remotely reachable today. Manifold reported both issues to Anthropic on May 21 against v1.0.72, and The Hacker News said it confirmed the same mechanisms remained in v1.0.80 as of July 14. The article says there was no patch, CVE, or public Anthropic advisory for either issue as of that date.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Manifold Security says Claude for Chrome v1.0.80 still lets any other browser extension that can run a script on claude.ai trigger fixed Claude tasks aimed at Gmail, Google Docs, and Calendar.","The issue relies on a content script that accepts a synthetic click on a specific claude.ai element without checking whether the click came from a real user.","In the default mode, the forged task still shows an approval box that the user must click, but with “Act without asking” enabled the task runs without a prompt.","A second issue lets Claude’s side panel start in a mode that skips permission checks when its URL includes “skipPermissions=true,” though the article says this is not remotely reachable today.","Manifold reported the issues to Anthropic on May 21 against v1.0.72, and The Hacker News confirmed the same mechanisms remained in v1.0.80 as of July 14."],"insights":["Turning off “Act without asking” is the quickest user-side guard because it restores the approval step, but the article says it does not remove the forged-click path itself.","Anthropic’s post-ClaudeBleed allowlist reduced the impact by preventing arbitrary prompts, yet the remaining fixed tasks still include sensitive targets such as Gmail, Google Docs, and Calendar.","The article says the flaw is in the Chrome extension rather than in the Claude model, because it reproduces whether the side panel is set to Opus, Sonnet, or Fable.","The same code paths were reported in v1.0.72 and found byte-for-byte unchanged in v1.0.80, despite eight intervening releases and an internal report that had been marked resolved."],"referencedReports":[{"title":"Claude for Chrome Extension Bypass","url":"https://www.manifold.security/blog/claude-for-chrome-extension-bypass","publisher":"Manifold Security","context":"The article relies on Manifold Security’s analysis that the Claude for Chrome issue remains present in v1.0.80 and can be triggered by another extension that can script claude.ai.","category":"","primary":false},{"title":"A Flaw in Claude’s Browser Extension Allows Any Extension to Hijack It","url":"https://web.archive.org/web/20260508132614/https://layerxsecurity.com/blog/a-flaw-in-claudes-browser-extension-allows-any-extension-to-hijack-it/","publisher":"LayerX Security","context":"The article references LayerX’s earlier ClaudeBleed research as the prior flaw that Anthropic attempted to mitigate before the current bypass was reported.","category":"","primary":false}],"body":"\u003cp\u003eResearchers say Claude for Chrome v1.0.80 still lets any other browser extension that can run a script on claude.ai trigger Claude tasks aimed at Gmail, the latest Google Doc and its comments, and Calendar. The issue affects users who run Claude for Chrome alongside another extension that can touch claude.ai. In the default “ask before acting” mode, the forged task still requires the user to click an approval box, but if “Act without asking” is enabled, it can run with no prompt.\u003c/p\u003e\n\n\u003cp\u003eAfter the earlier ClaudeBleed flaw, Anthropic restricted outside callers to nine fixed task IDs instead of allowing arbitrary prompts. Manifold Security says the remaining weak point is that a Claude content script listens for a click on a specific claude.ai element and does not check whether the click was generated by a real user. A script from another extension can create the element, set an allowlisted task ID such as \u003ccode\u003eusecase-gmail\u003c/code\u003e, and dispatch a synthetic click that Claude for Chrome treats as genuine.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a second issue in which Claude’s side panel starts in a mode that skips permission checks when loaded with \u003ccode\u003e?skipPermissions=true\u003c/code\u003e, though it says this path is not remotely reachable today. Manifold reported both issues to Anthropic on May 21 against v1.0.72, and The Hacker News said it confirmed the same mechanisms remained in v1.0.80 as of July 14. The article says there was no patch, CVE, or public Anthropic advisory for either issue as of that date.\u003c/p\u003e\n"},{"n":28,"title":"148 npm Packages Disguised as Student Proxies Turned Browsers Into a DDoS Botnet","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/148-npm-packages-disguised-as-student.html","time":"07:08","priority":"SHOULD READ","score":82,"tldr":"JFrog found 148 npm packages posing as student web proxies that secretly turned visitors’ browsers into a DDoS botnet, using HTTP floods and WebSocket attacks while avoiding traditional install-time detection. Although many packages were removed, the operators can potentially re-enable the capability through a remote loader without updating the npm packages.","briefOverview":"\u003cp\u003eJFrog reported that 148 npm packages disguised as student web proxies turned visitors’ browsers into a distributed denial-of-service botnet for roughly two weeks in May. The packages appeared as tutoring-themed proxy sites under branding such as Lucide, Riverbend Tutoring, and Northstar Tutoring, and they let students bypass school content filters. The article says the operators used npm as free hosting for a booby-trapped proxy site rather than targeting developers who might install the packages.\u003c/p\u003e\n\n\u003cp\u003eThe campaign mattered because the harmful code did not run during package installation and had no lifecycle hooks or native build scripts. Instead, the activity happened when someone opened the proxy in a browser tab, which makes it different from npm attacks aimed at developer build pipelines. JFrog found that the app loaded a remote script from a mutable GitHub branch through jsDelivr without a Subresource Integrity check, allowing the operators to change what ran in visitors’ browsers.\u003c/p\u003e\n\n\u003cp\u003eJFrog recovered archived payloads showing two major components: an HTTP flood that sent repeated no-cors POST requests to cdn.caan.edu, and a WebSocket module that opened many connections to a Wisp endpoint on lunaron[.]top. The WebSocket module repeatedly sent valid Wisp CONNECT and CLOSE frames, which could force a Wisp server to allocate and tear down large numbers of connections and write heavy logs. Many packages have since been pulled from npm, but the article says some flagged versions remained available in a July 14, 2026 spot check, and JFrog warned the operators could re-arm the DDoS capability through the remote loader without publishing a new package.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JFrog reported that 148 npm packages disguised as student web proxies turned visitors’ browsers into a distributed denial-of-service botnet for roughly two weeks in May.","The packages carried proxy apps branded as Lucide and presented as tutoring landing pages, while secretly loading a remote code loader and a WebSocket flood generator before the React interface rendered.","An archived payload showed a remote script sending no-cors POST requests every 500 milliseconds to cdn.caan.edu, which JFrog identified as the public domain of a nursing school in Matteson, Illinois.","The WebSocket module fetched a configuration file and opened connections to a Wisp endpoint on lunaron[.]top, repeatedly sending valid Wisp CONNECT and CLOSE frames to stress the remote Wisp server.","JFrog said the DDoS modules were removed on May 31 as reporting began, but the current build still uses obfuscation, third-party scripts from attacker domains, and a loader pointing at a mutable branch that could be changed without a package update."],"insights":["Traditional dependency scanners and install-time sandboxes may miss this type of threat because the packages had no lifecycle hooks, no native build scripts, and delivered the harmful behavior only when the hosted web app was opened in a browser.","The operators retained the ability to re-arm the DDoS functionality without publishing new npm package versions because the app loaded code from a mutable GitHub branch through jsDelivr with no Subresource Integrity check.","The campaign abused npm less as a software dependency channel and more as free hosting for browser-delivered code, showing that packages no build pipeline imports can still create real-world harm.","The WebSocket component was designed to stress Wisp proxy infrastructure through valid protocol frames rather than simply overwhelm it with bandwidth, causing connection churn, file descriptor exhaustion, and heavy logging.","Network-level blocking and browser cleanup are central mitigations for this campaign because the threat was delivered through proxy sites and could leave browser cache, local storage, or service workers behind."],"referencedReports":[{"title":"Lucide Proxy NPM Malware Campaign","url":"https://research.jfrog.com/post/lucide-proxy-npm-malware-campaign/","publisher":"JFrog","context":"The article says JFrog deobfuscated the app bundle, recovered archived payloads, reconstructed the campaign timeline, and provided the full list of packages, domains, IP addresses, and hashes.","category":"","primary":false},{"title":"Malicious npm terminal3airport Proxy Adware Spam","url":"https://safedep.io/malicious-npm-terminal3airport-proxy-adware-spam/","publisher":"SafeDep","context":"The article cites SafeDep's earlier advisory as cataloging 141 of the packages in May and identifying the operation as adware and registry abuse.","category":"","primary":false}],"body":"\u003cp\u003eJFrog reported that 148 npm packages disguised as student web proxies turned visitors’ browsers into a distributed denial-of-service botnet for roughly two weeks in May. The packages appeared as tutoring-themed proxy sites under branding such as Lucide, Riverbend Tutoring, and Northstar Tutoring, and they let students bypass school content filters. The article says the operators used npm as free hosting for a booby-trapped proxy site rather than targeting developers who might install the packages.\u003c/p\u003e\n\n\u003cp\u003eThe campaign mattered because the harmful code did not run during package installation and had no lifecycle hooks or native build scripts. Instead, the activity happened when someone opened the proxy in a browser tab, which makes it different from npm attacks aimed at developer build pipelines. JFrog found that the app loaded a remote script from a mutable GitHub branch through jsDelivr without a Subresource Integrity check, allowing the operators to change what ran in visitors’ browsers.\u003c/p\u003e\n\n\u003cp\u003eJFrog recovered archived payloads showing two major components: an HTTP flood that sent repeated no-cors POST requests to cdn.caan.edu, and a WebSocket module that opened many connections to a Wisp endpoint on lunaron[.]top. The WebSocket module repeatedly sent valid Wisp CONNECT and CLOSE frames, which could force a Wisp server to allocate and tear down large numbers of connections and write heavy logs. Many packages have since been pulled from npm, but the article says some flagged versions remained available in a July 14, 2026 spot check, and JFrog warned the operators could re-arm the DDoS capability through the remote loader without publishing a new package.\u003c/p\u003e\n"},{"n":41,"title":"Burnt by Burgers: Highlighting Void Blizzard’s Russian State Links","source":"ctrlaltintel.com","sourceColorIdx":5,"link":"http://ctrlaltintel.com/research/VoidBlizzard/","time":"00:00","priority":"SHOULD READ","score":82,"tldr":"Ctrl-Alt-Intel found OSINT evidence linking alleged Void Blizzard member Denis Obrezko to Russia’s EMERCOM Information and Analytical Center, including work-associated phone data and repeated 2021 deliveries to EMERCOM facilities. The findings add state-institution context to US allegations that Obrezko worked with FSB-linked Yutek-NN on Russian cyberespionage operations.","briefOverview":"\u003cp\u003eDenis Obrezko, a Russian citizen, was arrested in Thailand at the FBI’s request, extradited to the United States, and indicted for alleged participation in the Russian state-aligned threat group Void Blizzard, also known as Laundry Bear. US filings allege that Obrezko previously worked in an unknown capacity for the FSB between approximately 2012 and 2017 and later served as deputy director of the Russian technology company Yutek-NN from at least 2024. Microsoft has described Void Blizzard as a Russia-affiliated group conducting cyberespionage against NATO member states and Ukraine, including credential theft through spear phishing.\u003c/p\u003e\n\n\u003cp\u003eCtrl-Alt-Intel used identifiers disclosed in FBI affidavits, including email addresses and a phone number linked to Obrezko, to search breached datasets for additional connections. The researchers found evidence associating Obrezko-linked identifiers with an IAC EMERCOM work number and repeated weekday food deliveries in 2021 to addresses at or near EMERCOM government facilities in Moscow. The article assesses with high confidence that Obrezko worked at, or regularly operated from, the Information and Analytical Center of EMERCOM of Russia.\u003c/p\u003e\n\n\u003cp\u003eThe article also examines Yutek-NN, which the FBI alleges was responsible for Void Blizzard intrusions and where Obrezko allegedly served as deputy director. Public records show Yutek-NN held an FSB-issued license for surveillance-adjacent equipment, but Ctrl-Alt-Intel states this does not independently prove the company conducted espionage. Public Habr Career data also showed three declared personnel movements between Yutek-NN and IAC EMERCOM, adding further context to the company’s links with Russian state and security institutions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russian citizen Denis Obrezko was arrested in Thailand at the FBI’s request, extradited to the United States, and indicted for alleged participation in the Russian state-aligned threat group Void Blizzard, also known as Laundry Bear.","US filings allege that Obrezko worked in an unknown capacity for the FSB between approximately 2012 and 2017 and later served as deputy director of the Russian technology company Yutek-NN from at least 2024.","Ctrl-Alt-Intel identified breached-data evidence linking FBI-attributed Obrezko identifiers to an IAC EMERCOM-associated work number and repeated weekday food deliveries to EMERCOM facilities in Moscow during 2021.","Public records show that Yutek-NN holds an FSB-issued license covering surveillance-adjacent technology, though Ctrl-Alt-Intel states this does not independently prove the company conducted espionage.","Public Habr Career data showed three declared career transitions between Yutek-NN and IAC EMERCOM, suggesting personnel links between the organizations."],"insights":["A seemingly mundane consumer record, such as a food-delivery order, became useful evidence because it repeatedly placed Obrezko-linked identifiers at EMERCOM facilities during weekday working hours in 2021.","The EMERCOM connection was not mentioned in the FBI indictment or affidavit, but Ctrl-Alt-Intel found it by pivoting from FBI-disclosed identifiers into breached financial, delivery, and logistics datasets.","Yutek-NN’s public website presents ordinary IT services, while public records show it held an FSB-issued license for surveillance-adjacent equipment, creating a gap between its public-facing profile and regulated capabilities.","The article distinguishes between allegations and independently verified findings, noting that Yutek-NN’s FSB license and personnel links do not by themselves prove cyberespionage.","Public career-profile data showed personnel movement in both directions between Yutek-NN and IAC EMERCOM, indicating that Obrezko was not the only visible connection between the company and the Russian government institution."],"referencedReports":[{"title":"New Russia-affiliated actor Void Blizzard targets critical sectors for espionage","url":"https://www.microsoft.com/en-us/security/blog/2025/05/27/new-russia-affiliated-actor-void-blizzard-targets-critical-sectors-for-espionage/","publisher":"Microsoft","context":"The article cites Microsoft’s May 2025 research naming Void Blizzard and describing its cyberespionage targeting of NATO member states and Ukraine.","category":"","primary":false}],"body":"\u003cp\u003eDenis Obrezko, a Russian citizen, was arrested in Thailand at the FBI’s request, extradited to the United States, and indicted for alleged participation in the Russian state-aligned threat group Void Blizzard, also known as Laundry Bear. US filings allege that Obrezko previously worked in an unknown capacity for the FSB between approximately 2012 and 2017 and later served as deputy director of the Russian technology company Yutek-NN from at least 2024. Microsoft has described Void Blizzard as a Russia-affiliated group conducting cyberespionage against NATO member states and Ukraine, including credential theft through spear phishing.\u003c/p\u003e\n\n\u003cp\u003eCtrl-Alt-Intel used identifiers disclosed in FBI affidavits, including email addresses and a phone number linked to Obrezko, to search breached datasets for additional connections. The researchers found evidence associating Obrezko-linked identifiers with an IAC EMERCOM work number and repeated weekday food deliveries in 2021 to addresses at or near EMERCOM government facilities in Moscow. The article assesses with high confidence that Obrezko worked at, or regularly operated from, the Information and Analytical Center of EMERCOM of Russia.\u003c/p\u003e\n\n\u003cp\u003eThe article also examines Yutek-NN, which the FBI alleges was responsible for Void Blizzard intrusions and where Obrezko allegedly served as deputy director. Public records show Yutek-NN held an FSB-issued license for surveillance-adjacent equipment, but Ctrl-Alt-Intel states this does not independently prove the company conducted espionage. Public Habr Career data also showed three declared personnel movements between Yutek-NN and IAC EMERCOM, adding further context to the company’s links with Russian state and security institutions.\u003c/p\u003e\n"},{"n":42,"title":"11 Malicious NuGet Tools Pose as Game Cheats to Drop a Windows Host-Surveillance Payload","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/11-malicious-nuget-tools-pose-as-game-cheats?utm_medium=feed","time":"19:55","priority":"SHOULD READ","score":82,"tldr":"Socket researchers found 11 malicious NuGet .NET tools posing as game cheats that download and run a Windows payload called pepesoft.exe from GitHub or Hugging Face. The payload fingerprints hosts, reports licensing and telemetry to Google Sheets, supports remote bans, and in some builds can capture and send screenshots via Telegram.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team analyzed 11 malicious NuGet packages published as .NET command-line tools that masquerade as game utilities, bots, and “panels.” Each package is a first-stage downloader that fetches and runs a Windows payload named \u003ccode\u003epepesoft.exe\u003c/code\u003e from GitHub Releases and Hugging Face paths under the username \u003ccode\u003epepegit666\u003c/code\u003e. Socket reported the packages to the NuGet security team and requested package removal and suspension of the publisher’s account.\u003c/p\u003e\n\n\u003cp\u003eThe downloader stage uses Google DNS-over-HTTPS to resolve GitHub download hosts instead of the system resolver, which can bypass hosts-file or local DNS sinkhole controls. Ten of the 11 downloaders request elevation to resync the Windows system clock before fetching the payload, while the Calculator downloader does not contain that routine. All 11 packages share the same AWS-style key material and the same process mutex, tying the downloader stage to a single toolchain.\u003c/p\u003e\n\n\u003cp\u003eThe recovered \u003ccode\u003epepesoft.exe\u003c/code\u003e payloads use downloader-supplied key material to retrieve remote configuration, authenticate to Google Sheets, bind activations to hardware, and honor a remote hardware ID or UUID ban-list. The direct-bytecode Albion, Calculator, and Throne payloads also expose Telegram bot commands that can capture and send screenshots back to a configured chat. The article says the confirmed impact is operator-staged code running on Windows machines with remote configuration, Google Sheets telemetry or licensing state, hardware-fingerprint binding, and a server-side ban-list that can disable chosen machines.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s Threat Research Team analyzed 11 malicious NuGet packages published as .NET command-line tools that masquerade as game utilities, bots, and panels.","Each package acts as a first-stage downloader that fetches and executes a Windows payload named pepesoft.exe from GitHub Releases and Hugging Face paths under the username pepegit666.","The downloader stage resolves GitHub download hosts through Google DNS-over-HTTPS instead of the system resolver, and 10 of the 11 downloaders request elevation to resync the Windows system clock before fetching the payload.","The recovered pepesoft.exe payloads use downloader-supplied AWS-style key material to retrieve remote configuration, authenticate to Google Sheets, bind activations to hardware, and honor a remote hardware ID or UUID ban-list.","The direct-bytecode Albion, Calculator, and Throne payloads include Telegram bot commands that can capture and send screenshots back to the configured chat."],"insights":["The downloader uses Google DNS-over-HTTPS only for GitHub host resolution, which means hosts-file entries or local DNS sinkholes may not block the GitHub payload download path, but IP, SNI, and proxy controls can still be effective.","All 11 downloaders share the same mutex GUID and AWS-style key material, and the access key is the mutex GUID with dashes removed and lower-cased, providing a compact way to link samples from the same toolchain.","The BitTorrent fallback is fully implemented through bundled MonoTorrent libraries but is dormant in the analyzed samples because the magnet link is empty, so activating that path would require a changed downloader or a new package.","Blocking Google Sheets alone may not stop telemetry from the eight PyArmor-protected payloads because they contain a hardcoded authenticated HTTP proxy fallback for the same Sheets traffic.","The direct-bytecode payloads’ screenshot commands can expose more than game content because they capture game windows, application windows, or the full screen and send the images through Telegram without distinguishing sensitive information visible on screen."],"referencedReports":[],"body":"\u003cp\u003eSocket’s Threat Research Team analyzed 11 malicious NuGet packages published as .NET command-line tools that masquerade as game utilities, bots, and “panels.” Each package is a first-stage downloader that fetches and runs a Windows payload named \u003ccode\u003epepesoft.exe\u003c/code\u003e from GitHub Releases and Hugging Face paths under the username \u003ccode\u003epepegit666\u003c/code\u003e. Socket reported the packages to the NuGet security team and requested package removal and suspension of the publisher’s account.\u003c/p\u003e\n\n\u003cp\u003eThe downloader stage uses Google DNS-over-HTTPS to resolve GitHub download hosts instead of the system resolver, which can bypass hosts-file or local DNS sinkhole controls. Ten of the 11 downloaders request elevation to resync the Windows system clock before fetching the payload, while the Calculator downloader does not contain that routine. All 11 packages share the same AWS-style key material and the same process mutex, tying the downloader stage to a single toolchain.\u003c/p\u003e\n\n\u003cp\u003eThe recovered \u003ccode\u003epepesoft.exe\u003c/code\u003e payloads use downloader-supplied key material to retrieve remote configuration, authenticate to Google Sheets, bind activations to hardware, and honor a remote hardware ID or UUID ban-list. The direct-bytecode Albion, Calculator, and Throne payloads also expose Telegram bot commands that can capture and send screenshots back to a configured chat. The article says the confirmed impact is operator-staged code running on Windows machines with remote configuration, Google Sheets telemetry or licensing state, hardware-fingerprint binding, and a server-side ban-list that can disable chosen machines.\u003c/p\u003e\n"},{"n":4,"title":"LastPass, Bitwarden users targeted with fake security alerts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/lastpass-bitwarden-users-targeted-with-fake-security-alerts/","time":"15:31","priority":"SHOULD READ","score":78,"tldr":"LastPass and Bitwarden users are being targeted by phishing emails posing as security policy updates that lead to fake DocuSign-style sites and prompt file downloads. LastPass says its systems were not compromised and urges users not to enter credentials, report suspicious messages, and change master passwords if they interacted with the sites.","briefOverview":"\u003cp\u003eLastPass is warning users about an ongoing phishing campaign that uses fake security notices to direct recipients to fraudulent websites. The emails resemble legitimate corporate communications and claim there are updated LastPass service policies, including enhanced SaaS monitoring, master password reset options for administrators, and admin console improvements. LastPass says its systems have not been compromised and that the phishing emails did not originate from its infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe emails sent from \u003ccode\u003ehello@lastpassnewsletter.com\u003c/code\u003e include a “Review \u0026amp; Access Terms” button that leads to a fake DocuSign website on \u003ccode\u003elastpasscompliance[.]com\u003c/code\u003e. Microsoft Defender for Office 365 and Cloudflare have flagged that domain as malicious. LastPass could not confirm the goal of the campaign, but said the fake site prompts users to download a file claiming to support both Windows and macOS.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer also found similar emails targeting Bitwarden users from \u003ccode\u003ehello@bitwardennewsletter.com\u003c/code\u003e, redirecting them to \u003ccode\u003ebitwardencompliance[.]com\u003c/code\u003e. The article notes that LastPass users were also targeted in January and March by other fake alerts involving vault backups and unauthorized account access claims. LastPass says it will never ask users for their master password and advises anyone who entered credentials on phishing sites to change their master password immediately from a trusted device and review their vaults for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LastPass warned users about an ongoing phishing campaign that uses fake security notices to direct recipients to fraudulent websites.","The phishing emails are sent from hello@lastpassnewsletter.com and claim LastPass has updated service policies, including enhanced SaaS monitoring, master password reset options for administrators, and admin console improvements.","Clicking the email’s “Review \u0026 Access Terms” button takes users to a fake DocuSign website on lastpasscompliance[.]com, which Microsoft Defender for Office 365 and Cloudflare flagged as malicious.","BleepingComputer found that Bitwarden users are targeted by similar emails sent from hello@bitwardennewsletter.com and redirected to bitwardencompliance[.]com.","LastPass said its systems were not compromised, the phishing emails did not originate from its infrastructure, and users who entered credentials on phishing sites should change their master passwords immediately from a trusted device."],"insights":["The campaign used domains and sender addresses that combined the password manager names with terms like “newsletter” and “compliance,” making the messages appear related to routine corporate policy updates rather than obvious password theft attempts.","The fake LastPass site impersonated DocuSign instead of directly copying LastPass, showing that the lure relied on a familiar document-review workflow to move users toward the next step.","The malicious site prompted users to download a file claiming to support both Windows and macOS, so the risk was not limited to users of a single operating system.","The article notes repeated recent LastPass-themed phishing lures in January, March, and now this campaign, indicating users should treat unexpected LastPass security or account notices with extra caution even when they reference plausible maintenance or policy issues."],"referencedReports":[],"body":"\u003cp\u003eLastPass is warning users about an ongoing phishing campaign that uses fake security notices to direct recipients to fraudulent websites. The emails resemble legitimate corporate communications and claim there are updated LastPass service policies, including enhanced SaaS monitoring, master password reset options for administrators, and admin console improvements. LastPass says its systems have not been compromised and that the phishing emails did not originate from its infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe emails sent from \u003ccode\u003ehello@lastpassnewsletter.com\u003c/code\u003e include a “Review \u0026amp; Access Terms” button that leads to a fake DocuSign website on \u003ccode\u003elastpasscompliance[.]com\u003c/code\u003e. Microsoft Defender for Office 365 and Cloudflare have flagged that domain as malicious. LastPass could not confirm the goal of the campaign, but said the fake site prompts users to download a file claiming to support both Windows and macOS.\u003c/p\u003e\n\n\u003cp\u003eBleepingComputer also found similar emails targeting Bitwarden users from \u003ccode\u003ehello@bitwardennewsletter.com\u003c/code\u003e, redirecting them to \u003ccode\u003ebitwardencompliance[.]com\u003c/code\u003e. The article notes that LastPass users were also targeted in January and March by other fake alerts involving vault backups and unauthorized account access claims. LastPass says it will never ask users for their master password and advises anyone who entered credentials on phishing sites to change their master password immediately from a trusted device and review their vaults for suspicious activity.\u003c/p\u003e\n"},{"n":12,"title":"Microsoft Entra ID gets passkeys default authentication starting September","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-entra-id-gets-passkeys-default-authentication-starting-september/","time":"12:49","priority":"SHOULD READ","score":78,"tldr":"Microsoft Entra ID will make passkeys the default authentication method starting September 2026, automatically prompting SMS and voice MFA users to register passkeys. Microsoft will retire native SMS and voice authentication on February 1, 2027, so organizations must move users to phishing-resistant methods to avoid sign-in disruptions.","briefOverview":"\u003cp\u003eMicrosoft announced that passkeys will become the default authentication method for the Entra ID enterprise identity service starting in September 2026. Users who currently use phone-based SMS and voice authentication will be automatically enabled for passkeys as the rollout reaches their organization. The next time those users perform multifactor authentication, they will be prompted to register a passkey.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft will retire Microsoft-provided telecom delivery for SMS and voice authentication on February 1, 2027. After that date, SMS and voice will no longer be offered as native Microsoft Entra capabilities, and organizations are advised to move users to phishing-resistant methods to avoid sign-in disruptions. Users already signing in with passkeys, Windows Hello for Business, FIDO2 security keys, smart cards, or other phishing-resistant methods can continue using them.\u003c/p\u003e\n\n\u003cp\u003eAdministrators with global reader, Authentication policy administrator, or Security reader roles can identify SMS or voice authentication users with Microsoft’s Entra SMS/Voice Policy Scanner PowerShell script. Organizations that still need phone-based authentication will have to configure third-party telecom providers through the Microsoft Security Store. Microsoft said the move is intended to reduce reliance on phishable authentication methods, citing AI-enabled phishing campaigns with click-through rates as high as 54% and recent targeting of Microsoft Entra single sign-on accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft announced that passkeys will become the default authentication method for the Entra ID enterprise identity service starting in September 2026.","Entra ID users currently using phone-based SMS and voice authentication will be automatically enabled for passkeys and prompted to register a passkey the next time they perform multifactor authentication.","Microsoft will retire Microsoft-provided telecom delivery for SMS and voice authentication on February 1, 2027, and will no longer offer SMS and voice as a native Microsoft Entra capability.","Organizations are advised to ensure all users adopt a phishing-resistant authentication method before February 1, 2027, to avoid sign-in disruptions.","Microsoft said making passkeys the default authentication experience reduces reliance on phishable authentication methods and strengthens protection against credential theft and phishing."],"insights":["The transition is targeted specifically at users still relying on SMS or voice authentication, while users already using passkeys, Windows Hello for Business, FIDO2 security keys, smart cards, or other phishing-resistant methods can continue without changing methods.","Administrators can identify users still using SMS or voice authentication before the retirement deadline by running Microsoft’s Entra SMS/Voice Policy Scanner PowerShell script.","Organizations that still require phone-based authentication after Microsoft retires native SMS and voice support will need to configure third-party telecom providers through the Microsoft Security Store.","Microsoft tied the urgency of the change to observed AI-enabled phishing campaigns with click-through rates as high as 54%, compared with about 12% for more traditional campaigns."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft announced that passkeys will become the default authentication method for the Entra ID enterprise identity service starting in September 2026. Users who currently use phone-based SMS and voice authentication will be automatically enabled for passkeys as the rollout reaches their organization. The next time those users perform multifactor authentication, they will be prompted to register a passkey.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft will retire Microsoft-provided telecom delivery for SMS and voice authentication on February 1, 2027. After that date, SMS and voice will no longer be offered as native Microsoft Entra capabilities, and organizations are advised to move users to phishing-resistant methods to avoid sign-in disruptions. Users already signing in with passkeys, Windows Hello for Business, FIDO2 security keys, smart cards, or other phishing-resistant methods can continue using them.\u003c/p\u003e\n\n\u003cp\u003eAdministrators with global reader, Authentication policy administrator, or Security reader roles can identify SMS or voice authentication users with Microsoft’s Entra SMS/Voice Policy Scanner PowerShell script. Organizations that still need phone-based authentication will have to configure third-party telecom providers through the Microsoft Security Store. Microsoft said the move is intended to reduce reliance on phishable authentication methods, citing AI-enabled phishing campaigns with click-through rates as high as 54% and recent targeting of Microsoft Entra single sign-on accounts.\u003c/p\u003e\n"},{"n":13,"title":"Spanish Police take down €140 million cyber fraud ring, arrest four","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/spanish-police-take-down-140-million-cyber-fraud-ring-arrest-four/","time":"20:23","priority":"SHOULD READ","score":78,"tldr":"Spanish police dismantled an international cyber fraud and money-laundering ring accused of moving about €140 million from investment scams and business email compromise attacks. Four suspects were arrested across Spain, Portugal, and Panama, with €3 million frozen for victims.","briefOverview":"\u003cp\u003eSpanish Police dismantled a cybercrime and money-laundering organization that made €140 million from investment fraud and business email compromise attacks. Four people were arrested in Spain, Portugal, and Panama as part of the law enforcement operation. Police described the operation as an industrial-level scheme involving at least 800 bank accounts, 120 business accounts, and 67 external accomplices who acted as money mules.\u003c/p\u003e\n\n\u003cp\u003eInvestigators confirmed that €94 million was channeled through the network and linked another €61 million to the group, specifically tied to business email compromise operations in 2024. Police said the group used CEO fraud and false-invoice fraud, including impersonating high-ranking executives and diverting payments to accounts controlled by the fraudsters. The funds were then dispersed through chains of transactions across other bank accounts, including mule accounts in third countries.\u003c/p\u003e\n\n\u003cp\u003eThe investigation began after police detected signs of money laundering in 19 companies linked to the operation, and the international action was organized with help from Interpol and Europol. Authorities searched six premises in Barcelona, Girona, Tarragona, and Porto, and also arrested a suspect in Panama. Police seized 15 computers and more than 170 smartphones, froze €3 million for victims, and said the network has been effectively dismantled with its main operators arrested.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Spanish Police dismantled a cybercrime and money-laundering organization that made €140 million from investment fraud and business email compromise attacks.","Four people were arrested in Spain, Portugal, and Panama as part of an international operation supported by Interpol and Europol.","Police said the scheme used at least 800 bank accounts, 120 business accounts, and 67 external accomplices acting as money mules.","Investigators confirmed that €94 million was channeled through the network and linked another €61 million to the group’s 2024 business email compromise operations.","Authorities seized 15 computers and more than 170 smartphones and immediately froze €3 million in crime proceeds for victims."],"insights":["The investigation began from money-laundering signs in 19 linked companies, showing that the financial infrastructure around the fraud was a key lead for identifying the main suspects.","The group’s use of chains of transactions across mule bank accounts in third countries shows that hiding and dispersing stolen money was central to the operation, not just a follow-on activity.","Two suspects allegedly continued supporting the scheme after leaving Spain, highlighting that the operation remained active across borders even after key individuals relocated.","The €3 million frozen for victims is small compared with the €140 million attributed to the organization, underscoring how quickly stolen funds were dispersed beyond immediate reach."],"referencedReports":[],"body":"\u003cp\u003eSpanish Police dismantled a cybercrime and money-laundering organization that made €140 million from investment fraud and business email compromise attacks. Four people were arrested in Spain, Portugal, and Panama as part of the law enforcement operation. Police described the operation as an industrial-level scheme involving at least 800 bank accounts, 120 business accounts, and 67 external accomplices who acted as money mules.\u003c/p\u003e\n\n\u003cp\u003eInvestigators confirmed that €94 million was channeled through the network and linked another €61 million to the group, specifically tied to business email compromise operations in 2024. Police said the group used CEO fraud and false-invoice fraud, including impersonating high-ranking executives and diverting payments to accounts controlled by the fraudsters. The funds were then dispersed through chains of transactions across other bank accounts, including mule accounts in third countries.\u003c/p\u003e\n\n\u003cp\u003eThe investigation began after police detected signs of money laundering in 19 companies linked to the operation, and the international action was organized with help from Interpol and Europol. Authorities searched six premises in Barcelona, Girona, Tarragona, and Porto, and also arrested a suspect in Panama. Police seized 15 computers and more than 170 smartphones, froze €3 million for victims, and said the network has been effectively dismantled with its main operators arrested.\u003c/p\u003e\n"},{"n":20,"title":"LabubaRAT Masquerades as NVIDIA Software to Control Windows Hosts","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/labubarat-masquerades-as-nvidia.html","time":"16:52","priority":"SHOULD READ","score":78,"tldr":"Researchers uncovered LabubaRAT, a Rust-based remote access trojan that disguises itself as NVIDIA software while giving attackers broad control over Windows hosts. Its runtime configuration and multiple C2 channels, including HTTPS, WebView2, and DNS tunneling, suggest it is built for reuse across campaigns and may be offered as malware-as-a-service.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a previously undocumented Rust-based remote access trojan called LabubaRAT that masquerades as NVIDIA software. Blackpoint Cyber said the malware creates a reusable foothold for hands-on activity on Windows hosts. Once deployed, it can profile the host, identify security tools, receive operator commands, move files, capture screenshots, and proxy traffic through the affected system.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain begins with an executable named nvidia-sysruntime.exe, which impersonates NVIDIA\u0026rsquo;s container runtime toolkit. Instead of hard-coding its command-and-control information, the sample accepts runtime configuration through command-line arguments, including server details and polling interval, or through a single Base64-encoded argument. Blackpoint Cyber noted that this allows the same compiled binary to be reused with different infrastructure, organizations, or campaign groupings.\u003c/p\u003e\n\n\u003cp\u003eLabubaRAT stores its configuration in a local SQLite database and inventories browsers, security products, hostname, RAM size, CPU model, and Windows User Account Control state. It supports HTTPS, WebView2, and DNS tunneling for communications, as well as command execution, PowerShell execution, JavaScript execution, screenshot capture, file transfer, archive handling, and SOCKS5 proxy support. The malware’s name is tied to the LabubaPanel title associated with its command-and-control infrastructure and a Labubu-themed favicon, and the article says there are signs it may be offered under a malware-as-a-service model.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Blackpoint Cyber researchers identified LabubaRAT, a previously undocumented Rust-based remote access trojan that masquerades as NVIDIA software to blend into target environments.","LabubaRAT supports multiple communication methods, including HTTPS, WebView2, and DNS tunneling, which can help attackers maintain access if one pathway is detected and closed off.","The attack chain begins with an executable named nvidia-sysruntime.exe, which impersonates NVIDIA's container runtime toolkit and accepts command-and-control configuration through command-line arguments.","LabubaRAT stores its configuration in a local SQLite database and profiles the host by checking for web browsers, security products, hostname, RAM size, CPU model, and Windows User Account Control state.","The malware can execute commands, run PowerShell and JavaScript, capture screenshots, upload and download files, handle archives, and provide SOCKS5 proxy support."],"insights":["Because LabubaRAT receives its server details and polling interval at launch instead of hard-coding them, the same compiled binary can be reused across different infrastructure, organizations, or campaign groupings.","LabubaRAT’s checks for specific browsers and security products indicate that its later behavior may be adjusted based on the tools present on the infected host.","The combination of HTTPS, WebView2, and DNS tunneling gives operators fallback communication options if one access path is detected and blocked.","The LabubaPanel title and Labubu-themed favicon are the clearest naming clues, but the article emphasizes that the more important finding is the RAT’s framework-like structure for repeated deployments.","Blackpoint Cyber noted signs that LabubaRAT may be offered under a malware-as-a-service model."],"referencedReports":[{"title":"LabubaRAT: A Rust-Based Remote Access Tool Masquerading as NVIDIA Software","url":"https://blackpointcyber.com/blog/labubarat-a-rust-based-remote-access-tool-masquerading-as-nvidia-software/","publisher":"Blackpoint Cyber","context":"The article cites Blackpoint Cyber researchers Sam Decker and Nevan Beal's analysis as the source for details on LabubaRAT's capabilities, configuration, host profiling, and command-and-control methods.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have identified a previously undocumented Rust-based remote access trojan called LabubaRAT that masquerades as NVIDIA software. Blackpoint Cyber said the malware creates a reusable foothold for hands-on activity on Windows hosts. Once deployed, it can profile the host, identify security tools, receive operator commands, move files, capture screenshots, and proxy traffic through the affected system.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain begins with an executable named nvidia-sysruntime.exe, which impersonates NVIDIA\u0026rsquo;s container runtime toolkit. Instead of hard-coding its command-and-control information, the sample accepts runtime configuration through command-line arguments, including server details and polling interval, or through a single Base64-encoded argument. Blackpoint Cyber noted that this allows the same compiled binary to be reused with different infrastructure, organizations, or campaign groupings.\u003c/p\u003e\n\n\u003cp\u003eLabubaRAT stores its configuration in a local SQLite database and inventories browsers, security products, hostname, RAM size, CPU model, and Windows User Account Control state. It supports HTTPS, WebView2, and DNS tunneling for communications, as well as command execution, PowerShell execution, JavaScript execution, screenshot capture, file transfer, archive handling, and SOCKS5 proxy support. The malware’s name is tied to the LabubaPanel title associated with its command-and-control infrastructure and a Labubu-themed favicon, and the article says there are signs it may be offered under a malware-as-a-service model.\u003c/p\u003e\n"},{"n":33,"title":"A Fake Malwarebytes Renewal, Signed by Google","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/malwarebytes-renewal-calendar-invite-vishing","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A fake Malwarebytes renewal invoice was sent via a legitimate Google Calendar invite from a newly registered Google Workspace domain, using phone numbers instead of malicious links or files to push a vishing scam. Because Google signed the message and all links were legitimate, detection depended on behavioral signals like the unknown organizer domain, brand mismatch, callback numbers, and user reporting.","briefOverview":"\u003cp\u003eA senior executive at a hospitality company received a Google Calendar invite posing as a Malwarebytes Security Operations renewal invoice. The invite claimed a $598.75 four-year Premium Family Plan charge and included two phone numbers to dispute it. The article describes this as a callback phishing or vishing attempt, where the email’s purpose was to get the recipient to call an attacker-controlled number rather than click a malicious link.\u003c/p\u003e\n\n\u003cp\u003eThe attack was significant because it used legitimate Google infrastructure and contained little for traditional scanning tools to block. The RSVP links resolved to calendar.google.com, the attached invite.ics file carried no code, and DKIM passed because Google signed the message. The organizer address, however, came from an unrelated and newly registered domain, betskl[.]com, with no SPF or DMARC records.\u003c/p\u003e\n\n\u003cp\u003eThe executive reported the invite as an unknown sender instead of calling the listed numbers. Themis had also scored the message as suspicious, citing a vishing attack against a VIP recipient, the freshly registered return-path domain, and language patterns in the invite. The message was approved for action, quarantined, and permanently deleted from the mailbox.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker registered betskl[.]com, created a Google Workspace account on it, and used Google Calendar to send a fake Malwarebytes Security Operations renewal invoice to a senior executive at a hospitality company.","The calendar invite claimed a $598.75 four-year Malwarebytes Premium Family Plan charge and provided two phone numbers for the recipient to call to dispute the supposed unauthorized charge.","The message contained no malicious links or code-bearing attachment, because its links resolved to calendar.google.com and the invite.ics attachment was a plain Google-generated iCalendar file.","DKIM and composite authentication passed because Google sent and signed the message, while the organizer address was an unrelated newly registered domain with no SPF or DMARC records.","The executive reported the message as an unknown sender, Themis identified it as suspicious vishing targeting a VIP recipient, and the message was quarantined and permanently deleted."],"insights":["Passing DKIM from a trusted provider can confirm that Google sent a message, but it does not validate that the sender’s claimed brand identity is legitimate.","Callback phishing can evade controls that focus on URLs and attachments because the harmful action is placed outside the email channel as a phone call.","Calendar invitations create a useful disguise for financial scams because recipients are accustomed to seeing Google Calendar formatting, RSVP controls, and organizer fields in routine work messages.","Fresh domain registration, missing SPF and DMARC records, and a mismatch between the organizer domain and the claimed vendor were more useful warning signs than link or attachment scanning in this case.","Security awareness for senior staff directly affected the outcome because the executive’s decision to report the invite supplied the decisive signal for removal."],"referencedReports":[{"title":"Tech Support Scams","url":"https://www.malwarebytes.com/tech-support-scams","publisher":"Malwarebytes","context":"The article cites Malwarebytes guidance stating that legitimate vendors do not cold-call users about charges and that support should go through official help channels.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references the report for its discussion of growing misuse of legitimate services and impersonation of trusted brands to deliver fraud.","category":"","primary":false},{"title":"2024 Internet Crime Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report as tracking callback and tech-support fraud as a persistent and underreported category relying on urgency and impersonation.","category":"","primary":false},{"title":"Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article references the report for its finding that social engineering and the human element remain leading paths into organizations.","category":"","primary":false}],"body":"\u003cp\u003eA senior executive at a hospitality company received a Google Calendar invite posing as a Malwarebytes Security Operations renewal invoice. The invite claimed a $598.75 four-year Premium Family Plan charge and included two phone numbers to dispute it. The article describes this as a callback phishing or vishing attempt, where the email’s purpose was to get the recipient to call an attacker-controlled number rather than click a malicious link.\u003c/p\u003e\n\n\u003cp\u003eThe attack was significant because it used legitimate Google infrastructure and contained little for traditional scanning tools to block. The RSVP links resolved to calendar.google.com, the attached invite.ics file carried no code, and DKIM passed because Google signed the message. The organizer address, however, came from an unrelated and newly registered domain, betskl[.]com, with no SPF or DMARC records.\u003c/p\u003e\n\n\u003cp\u003eThe executive reported the invite as an unknown sender instead of calling the listed numbers. Themis had also scored the message as suspicious, citing a vishing attack against a VIP recipient, the freshly registered return-path domain, and language patterns in the invite. The message was approved for action, quarantined, and permanently deleted from the mailbox.\u003c/p\u003e\n"},{"n":18,"title":"Finland issues wanted notice for hacker behind massive psychotherapy data breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/finland-issues-wanted-notice-for-hacker-vastaamo-breach","time":"17:28","priority":"MAY READ","score":70,"tldr":"Finnish police have issued a wanted notice for convicted Vastaamo hacker Aleksanteri Kivimäki after the Supreme Court declined to hear his appeal, making his nearly seven-year sentence final. Authorities are seeking to return him to prison for the massive psychotherapy data breach and extortion of thousands of patients.","briefOverview":"\u003cp\u003eFinnish police have reportedly issued a wanted notice for convicted hacker Aleksanteri Kivimäki after Finland’s Supreme Court refused to hear his appeal. The decision leaves in place a February Court of Appeal ruling sentencing him to nearly seven years in prison for hacking psychotherapy provider Vastaamo and extorting both the company and its patients. Eastern Uusimaa Police said officers have been instructed to arrest Kivimäki if he is located and transfer him to Vantaa Prison to serve the rest of his sentence.\u003c/p\u003e\n\n\u003cp\u003eThe Court of Appeal convicted Kivimäki of aggravated data breach, attempted extortion, and unlawfully distributing private information. The judges said the crimes were carefully planned, financially motivated, and caused exceptional harm to a large number of especially vulnerable victims. Kivimäki has denied carrying out the attack, challenged the digital evidence linking him to the hack, and disputed allegations involving cryptocurrency transactions tied to the extortion scheme.\u003c/p\u003e\n\n\u003cp\u003eThe Vastaamo breach occurred in 2018 but became public in 2020, when the attacker first tried to extort the company and then demanded money directly from thousands of patients. When many victims refused to pay, confidential therapy notes and other highly sensitive records were published online. The stolen database contained information on about 33,000 patients, more than 24,000 people reported receiving extortion demands, and the case became the largest criminal case in Finnish history by number of victims.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Finnish police issued a wanted notice for convicted hacker Aleksanteri Kivimäki after Finland’s Supreme Court refused to hear his appeal.","The Supreme Court’s decision leaves in place a February Court of Appeal ruling sentencing Kivimäki to nearly seven years in prison for hacking psychotherapy provider Vastaamo and extorting both the company and its patients.","Eastern Uusimaa Police said officers have been instructed to arrest Kivimäki if he is located and transfer him to Vantaa Prison to serve the rest of his sentence.","Kivimäki has denied carrying out the attack and argued that prosecutors relied largely on circumstantial evidence and disputed digital and cryptocurrency evidence.","The Vastaamo breach exposed information on about 33,000 patients, and more than 24,000 people reported receiving extortion demands."],"insights":["The court said the crimes would normally have justified the maximum sentence, but Kivimäki’s prison term was reduced by one month because he reached compensation agreements with some victims.","Kivimäki was released from pretrial detention in September 2025 because the appeals court found he had already spent enough time in custody that continued detention could violate his rights.","The case became the largest criminal case in Finnish history by number of victims, showing how one data theft involving highly sensitive records can create an unusually large legal proceeding.","The breach occurred in 2018 but did not become public until 2020, meaning victims were not publicly aware of the incident for about two years."],"referencedReports":[],"body":"\u003cp\u003eFinnish police have reportedly issued a wanted notice for convicted hacker Aleksanteri Kivimäki after Finland’s Supreme Court refused to hear his appeal. The decision leaves in place a February Court of Appeal ruling sentencing him to nearly seven years in prison for hacking psychotherapy provider Vastaamo and extorting both the company and its patients. Eastern Uusimaa Police said officers have been instructed to arrest Kivimäki if he is located and transfer him to Vantaa Prison to serve the rest of his sentence.\u003c/p\u003e\n\n\u003cp\u003eThe Court of Appeal convicted Kivimäki of aggravated data breach, attempted extortion, and unlawfully distributing private information. The judges said the crimes were carefully planned, financially motivated, and caused exceptional harm to a large number of especially vulnerable victims. Kivimäki has denied carrying out the attack, challenged the digital evidence linking him to the hack, and disputed allegations involving cryptocurrency transactions tied to the extortion scheme.\u003c/p\u003e\n\n\u003cp\u003eThe Vastaamo breach occurred in 2018 but became public in 2020, when the attacker first tried to extort the company and then demanded money directly from thousands of patients. When many victims refused to pay, confidential therapy notes and other highly sensitive records were published online. The stolen database contained information on about 33,000 patients, more than 24,000 people reported receiving extortion demands, and the case became the largest criminal case in Finnish history by number of victims.\u003c/p\u003e\n"},{"n":45,"title":"J-Space: The Logs AI Security Has Never Had","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/j-space-ai-agent-detection","time":"10:00","priority":"MAY READ","score":68,"tldr":"Anthropic’s J-space research suggests AI agents may have an internal “intent” signal that can reveal deception, prompt injection awareness, or sabotage before visible actions occur. The article argues frontier labs should expose this telemetry to enterprise security teams so it can become a new layer of AI detection and response.","briefOverview":"\u003cp\u003eAnthropic published interpretability research describing a structure inside Claude that it calls the J-space. The article says this small set of internal neural patterns acts like a mental workspace, holding deliberate multi-step reasoning while most other model activity runs automatically. Anthropic’s J-lens technique can read this workspace by mapping internal activity patterns to words the model may be more likely to say later.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that J-space could become a third layer of telemetry for AI agents, alongside what an agent says and what it does. It describes examples where concepts such as “ERROR,” “injection,” “fake,” “manipulation,” “secretly,” “deliberately,” and “fraud” appeared in the workspace before harmful or relevant behavior was visible in output. The article says this matters because enterprises running agents currently have no J-space feed, API, or logs, even as agents receive production credentials, customer data, and code repository access.\u003c/p\u003e\n\n\u003cp\u003eThe article distinguishes between provider-only inline prevention and customer-side detect-and-interrupt workflows. It says only the provider can block harmful output before the next token is generated, but enterprises may be able to stop later tool actions through gateways, credential brokers, session termination, or token revocation if workspace signals surface early enough. It calls on Anthropic and other frontier labs to expose workspace telemetry in some usable form so detection and response teams can build controls around it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic’s interpretability research found a small internal structure in Claude called the J-space that carries deliberate multi-step reasoning and can reveal concepts in the model’s mind before they appear in output.","The J-lens technique reads the J-space by mapping internal activity patterns to words the model is more likely to say later, producing a list of concepts present during a model run.","Anthropic observed J-space signals such as “ERROR,” “injection,” “fake,” “manipulation,” “secretly,” “deliberately,” and “fraud” in scenarios involving bugs, prompt injections, staged blackmail tests, score manipulation, and sabotage-trained models.","The article argues that J-space telemetry would add a third layer of AI agent monitoring beyond what an agent says and does, enabling detection teams to correlate internal signals with tool actions and agent workflows.","The article calls on Anthropic and other frontier labs to expose workspace telemetry to enterprise customers because organizations running AI agents currently receive no J-space feed, API, or logs."],"insights":["The article draws a practical distinction between provider-only prevention and customer-side interruption: blocking a harmful next token requires access inside the model serving stack, but stopping later tool actions may be possible through MCP gateways, credential brokers, token revocation, and session termination.","J-space signals are useful even when they cannot prove intent, because the article argues security teams already build detections from noisy signals and can correlate workspace terms such as “manipulation” or “injection” with concrete actions or inputs.","The sabotage-model example suggests J-space telemetry could be used before deployment, allowing organizations to screen agents in staging before giving them production credentials, rather than waiting for production behavior to reveal problems.","The article frames AI agent monitoring as being at a “pre-CloudTrail” stage, arguing that detection and response capabilities cannot mature until model providers expose usable logs of agent intent.","Forensics may become a major use case for J-space telemetry because it could help determine whether an AI agent knew information was fabricated or was misled by its inputs, a question the article says is currently unanswerable."],"referencedReports":[{"title":"Global Workspace","url":"https://www.anthropic.com/research/global-workspace","publisher":"Anthropic","context":"The article is built around Anthropic’s interpretability research that found the J-space inside Claude.","category":"","primary":false},{"title":"Workspace paper","url":"https://transformer-circuits.pub/2026/workspace/index.html","publisher":"Anthropic","context":"The article cites this paper as the source for observations about J-space signals such as “manipulation,” “injection,” and “fraud.”","category":"","primary":false},{"title":"Reasoning Models Don’t Always Say What They Think","url":"https://www.anthropic.com/research/reasoning-models-dont-say-think","publisher":"Anthropic","context":"The article references Anthropic’s faithfulness research to explain why exposed chain-of-thought text is an incomplete signal for security monitoring.","category":"","primary":false}],"body":"\u003cp\u003eAnthropic published interpretability research describing a structure inside Claude that it calls the J-space. The article says this small set of internal neural patterns acts like a mental workspace, holding deliberate multi-step reasoning while most other model activity runs automatically. Anthropic’s J-lens technique can read this workspace by mapping internal activity patterns to words the model may be more likely to say later.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that J-space could become a third layer of telemetry for AI agents, alongside what an agent says and what it does. It describes examples where concepts such as “ERROR,” “injection,” “fake,” “manipulation,” “secretly,” “deliberately,” and “fraud” appeared in the workspace before harmful or relevant behavior was visible in output. The article says this matters because enterprises running agents currently have no J-space feed, API, or logs, even as agents receive production credentials, customer data, and code repository access.\u003c/p\u003e\n\n\u003cp\u003eThe article distinguishes between provider-only inline prevention and customer-side detect-and-interrupt workflows. It says only the provider can block harmful output before the next token is generated, but enterprises may be able to stop later tool actions through gateways, credential brokers, session termination, or token revocation if workspace signals surface early enough. It calls on Anthropic and other frontier labs to expose workspace telemetry in some usable form so detection and response teams can build controls around it.\u003c/p\u003e\n"},{"n":36,"title":"AI Security Report 2026","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/ai-security-report-2026/","time":"00:51","priority":"MAY READ","score":60,"tldr":"Check Point Research’s AI Security Report 2026 warns that AI has moved from helping attackers to actively operating intrusions, generating malware, scaling phishing/vishing, and enabling convincing identity fraud. It also highlights growing risks from prompt injection and enterprise data leakage as organizations rapidly adopt GenAI tools.","briefOverview":"\u003cp\u003eCheck Point Research’s Annual AI Security Report 2026 says AI has moved from being a force multiplier for attackers to acting as an operator in live intrusions. The report describes AI doing hands-on work inside operations, including China-nexus espionage campaigns and a criminal breach of multiple Mexican government agencies. It says this shift has spread from nation states to ordinary cyber criminals.\u003c/p\u003e\n\n\u003cp\u003eThe report says AI is now used to build deployment-ready malware and attack suites, with one developer producing VoidLink, an 88,000-line command-and-control offensive framework, in under a week using an AI environment. It also says attackers often prefer jailbroken mainstream commercial models and increasingly abuse agentic architecture through planted configuration files that agents load and trust across sessions. Criminal tooling has matured, including phishing-as-a-service kits with built-in language-model jailbreaks and conversational AI voice-agent services used for vishing and one-time-password theft at scale.\u003c/p\u003e\n\n\u003cp\u003eThe report warns that virtual identity is no longer a reliable trust anchor because voice, face, documents, and live video are now cheap to forge convincingly. It also identifies AI itself as an expanding attack surface, including risks from content that influences model behavior, software vulnerabilities, supply-chain risk, and immature security practices. Indirect prompt injection detections of longer malicious payloads rose roughly fivefold between March and May 2026, while high-risk GenAI prompts doubled from 2% to 4% over the last year.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research’s Annual AI Security Report 2026 says AI has moved from being an assistant that helps attackers prepare to an operator that performs hands-on work inside live intrusions.","The report says AI now builds deployment-ready malware and attack suites, including VoidLink, an 88,000-line command-and-control offensive framework produced in under a week using an AI environment.","The report says attackers commonly prefer jailbroken mainstream commercial models and increasingly abuse agentic architecture by planting configuration files that agents load and trust across sessions.","The report says virtual identity is no longer a reliable trust anchor because voice, face, documents, and live video are now cheap to forge convincingly and are widely used in attacks.","The report says enterprise data leakage through GenAI is a persistent and growing risk, with high-risk prompts doubling from 2% to 4% during the last year."],"insights":["The report highlights a shift in bypass tactics from
