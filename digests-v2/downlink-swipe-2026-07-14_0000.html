The U.S. Treasury Department’s Office of Foreign Assets Control designated First VPN Service, its Ukrainian administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware actors and other cybercriminals. First VPN Service was accused of providing tools to ransomware groups, while Silayev was sanctioned for selling cryptors used to disguise ransomware and other malware as safe programs. First VPN was dismantled in May 2026 through a joint European and North American law enforcement operation after allegedly helping criminal actors hide the origins of ransomware attacks, data theft, scanning, and denial-of-service attacks.\u003c/p\u003e\n\n\u003cp\u003eThe Treasury said several ransomware groups used First VPN to attack U.S. companies and institutions, deploy malware, and manage stolen data. Victims included U.S. businesses, financial services companies, hospitals, and municipal governments. U.S. officials said ransomware groups using services supplied by the sanctioned parties caused billions of dollars in losses to American businesses and critical infrastructure providers. The department also said Rashevskyi used false identities, including “Maksim Sorin” and “Roman Chabanenko,” to buy infrastructure from companies that might otherwise refuse to work with him because of abuse complaints tied to 1VPNS servers.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes U.K. and E.U. sanctions against 24 Russian individuals and entities linked to destructive cyber and hybrid operations, including GRU leadership, FSB Centre 16, and actors behind Lumma Stealer. Separately, the FBI warned that FSB Center 16 actors are exploiting poorly configured and vulnerable networking devices worldwide, especially routers with active SNMP agents accepting common or default community strings. The advisory said the actors use scans involving spoofed IP addresses and object identifiers that instruct devices to copy configurations and transfer them to attacker-controlled or compromised servers. The activity also involves Cisco vulnerabilities CVE-2018-0171 and CVE-2008-4128, with CISA adding CVE-2008-4128 to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n"},{"n":30,"title":"SAP Patches CVSS 9.9 NetWeaver ABAP Flaw That Could Expose or Modify Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/sap-patches-cvss-99-netweaver-abap-flaw.html","time":"18:17","priority":"MUST READ","score":92,"tldr":"SAP’s July 2026 patches fix several critical flaws, including a CVSS 9.9 NetWeaver ABAP out-of-bounds write bug that could let authenticated attackers access or modify data or disrupt systems. Organizations should apply the updates promptly, especially for NetWeaver ABAP, SAP Approuter, and SAP Commerce Cloud default credential exposure.","briefOverview":"\u003cp\u003eSAP released July 2026 security updates addressing multiple vulnerabilities, including a critical flaw in SAP NetWeaver Application Server ABAP. The NetWeaver issue, tracked as CVE-2026-44747, has a CVSS score of 9.9 and is described as an out-of-bounds write flaw. It allows an authenticated attacker to leverage logical errors in memory management and cause memory corruption that could lead to unauthorized data access, data modification, or system unavailability.\u003c/p\u003e\n\n\u003cp\u003eSAP also addressed two other critical vulnerabilities: CVE-2026-27690 in SAP Approuter deployments in non-Cloud Foundry environments and CVE-2026-44761 in SAP Commerce Cloud. CVE-2026-27690 is an HTTP request/response smuggling flaw that could expose user responses and trigger denial-of-service attacks. CVE-2026-44761 involves default credentials for a sample OAuth 2.0 client that could let an unauthenticated attacker obtain an access token and invoke certain APIs to read and modify data.\u003c/p\u003e\n\n\u003cp\u003eOnapsis said the temporary workaround for the NetWeaver issue involves disabling certain ICF nodes in transaction SICF, but this can disable opening transactions in SAP GUI for HTML. For the SAP Commerce Cloud issue, Onapsis said customers are not impacted if they removed the sample client or replaced the secret with a strong, unique value. The article says there is no evidence of exploitation in the wild, but customers are advised to apply the necessary updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP released July 2026 security updates addressing multiple vulnerabilities, including a critical flaw in SAP NetWeaver Application Server ABAP.","CVE-2026-44747 is a CVSS 9.9 out-of-bounds write flaw that could allow an authenticated attacker to cause memory corruption leading to unauthorized data access, data modification, or system unavailability.","SAP also fixed CVE-2026-27690, an HTTP request/response smuggling flaw in SAP Approuter deployments in non-Cloud Foundry environments that can expose user responses and trigger denial-of-service attacks.","SAP also addressed CVE-2026-44761, a SAP Commerce Cloud default credentials issue involving a sample OAuth 2.0 client that could let an unauthenticated attacker obtain an access token and read or modify data.","Onapsis said there is no evidence that the flaws have been exploited in the wild and recommended installing the necessary updates."],"insights":["The temporary workaround for CVE-2026-44747 can disrupt SAP GUI for HTML by disabling opening transactions, so Onapsis says installing the patched ABAP Kernel version is strongly recommended instead.","CVE-2026-44761 only affects SAP Commerce Cloud customers who executed the sample script and kept the resulting OAuth 2.0 client in production without replacing the hard-coded secret.","Customers who removed the sample OAuth 2.0 client or replaced its secret with a strong, unique value are not impacted by CVE-2026-44761.","SAP Commerce Cloud customers are advised to audit production environments for the affected sample OAuth 2.0 client and remove it if present."],"referencedReports":[{"title":"July 2026 Security Patch Day","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/july-2026.html","publisher":"SAP","context":"The article cites SAP's July 2026 security updates as the source for the patched vulnerabilities.","category":"","primary":false},{"title":"SAP Security Patch Day July 2026","url":"https://onapsis.com/blog/sap-security-patch-day-july-2026/","publisher":"Onapsis","context":"The article cites Onapsis for analysis of the SAP vulnerabilities, including workaround guidance and details on the SAP Commerce Cloud default credentials issue.","category":"","primary":false}],"body":"\u003cp\u003eSAP released July 2026 security updates addressing multiple vulnerabilities, including a critical flaw in SAP NetWeaver Application Server ABAP. The NetWeaver issue, tracked as CVE-2026-44747, has a CVSS score of 9.9 and is described as an out-of-bounds write flaw. It allows an authenticated attacker to leverage logical errors in memory management and cause memory corruption that could lead to unauthorized data access, data modification, or system unavailability.\u003c/p\u003e\n\n\u003cp\u003eSAP also addressed two other critical vulnerabilities: CVE-2026-27690 in SAP Approuter deployments in non-Cloud Foundry environments and CVE-2026-44761 in SAP Commerce Cloud. CVE-2026-27690 is an HTTP request/response smuggling flaw that could expose user responses and trigger denial-of-service attacks. CVE-2026-44761 involves default credentials for a sample OAuth 2.0 client that could let an unauthenticated attacker obtain an access token and invoke certain APIs to read and modify data.\u003c/p\u003e\n\n\u003cp\u003eOnapsis said the temporary workaround for the NetWeaver issue involves disabling certain ICF nodes in transaction SICF, but this can disable opening transactions in SAP GUI for HTML. For the SAP Commerce Cloud issue, Onapsis said customers are not impacted if they removed the sample client or replaced the secret with a strong, unique value. The article says there is no evidence of exploitation in the wild, but customers are advised to apply the necessary updates.\u003c/p\u003e\n"},{"n":32,"title":"Microsoft Maps Three Salesforce Attack Paths Tied to a Year of ShinyHunters Activity","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-maps-year-long-shinyhunters.html","time":"06:19","priority":"MUST READ","score":92,"tldr":"Microsoft says ShinyHunters-linked actors spent the past year breaching Salesforce environments not through Salesforce flaws, but by abusing trusted OAuth apps, stolen vendor tokens, and misconfigured guest access. The key defense is to monitor connected-app behavior and permissions, remove unused integrations, and tighten Salesforce event logging and guest access controls.","briefOverview":"\u003cp\u003eMicrosoft reported that attackers whose methods align with the data-extortion group ShinyHunters spent the past year accessing corporate Salesforce environments without exploiting a flaw in Salesforce itself. The campaigns ran from mid-2025 into mid-2026 and affected tenants in industries including retail, education, and manufacturing. Microsoft mapped the activity to three intrusion paths: vishing calls that tricked employees into approving malicious connected apps, stolen OAuth tokens from compromised software vendors, and misconfigured guest access to Salesforce sites.\u003c/p\u003e\n\n\u003cp\u003eThe first path involved callers posing as IT support and guiding employees through Salesforce’s OAuth consent screen to approve an attacker-controlled connected app disguised as Salesforce Data Loader. The second path involved compromised vendors such as Salesloft Drift, Gainsight, and Klue, where attackers used stolen OAuth tokens or secrets from trusted integrations to reach downstream Salesforce customer environments. The third path involved suspicious guest-user activity against Salesforce Aura endpoints, where misconfigured guest permissions allowed unauthenticated access to data through Aura functionality.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that these intrusions are hard to catch because approved apps and trusted integrations can make API activity look like normal use, while sign-in and authentication monitoring may show little. Microsoft worked with Salesforce to add Defender for Cloud Apps and Salesforce Shield Event Monitoring capabilities that surface connected-app attribution, OAuth scopes, session context, and API activity. Microsoft’s guidance includes inventorying connected apps, removing unused integrations, applying least privilege, monitoring Salesforce event logs, locking down Experience Cloud guest access, and revoking or rotating tokens when integrations behave unusually.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that attackers whose methods align with ShinyHunters accessed corporate Salesforce environments from mid-2025 into mid-2026 without exploiting a Salesforce platform flaw.","Microsoft grouped the activity into three intrusion paths: vishing calls that tricked employees into approving malicious connected apps, stolen OAuth tokens from compromised software vendors, and misconfigured guest access to Salesforce sites.","The vendor-token path included the Salesloft Drift compromise, the Gainsight incident, and the Klue compromise, each involving trusted integrations used to access downstream Salesforce customer environments.","Microsoft and Salesforce added new Defender for Cloud Apps and Salesforce Shield Event Monitoring capabilities to surface connected-app attribution, OAuth scopes, session context, and API activity.","Microsoft advised organizations to inventory connected apps, remove unused integrations, apply least privilege, monitor Salesforce event logs, tighten Experience Cloud guest-user access, and revoke or rotate tokens when integrations behave unusually."],"insights":["The campaigns were difficult to detect because access through an approved connected app or trusted integration can appear as ordinary Salesforce use, while sign-in and authentication logs may show little or nothing suspicious.","The attackers repeatedly searched Salesforce data for credentials and secrets that could unlock other SaaS platforms, making CRM data a stepping stone to broader compromise rather than just the final target.","Forgotten or inactive access was a recurring weakness, including unused connected apps with live permissions and Klue’s long-disused legacy credential from a test integration that was never deployed.","Salesforce activity visibility needs to focus on what an app does after access is granted, including which connected app made API calls, what scopes it holds, and whether its query volume is normal for the tenant.","Misconfigured Salesforce guest access allowed unauthenticated actors to use Aura functionality and cursor-based pagination to pull more records than the standard 2,000-record query limit would normally allow."],"referencedReports":[{"title":"Defending SaaS-based applications against ShinyHunters OAuth abuse","url":"https://www.microsoft.com/en-us/security/blog/2026/07/13/defending-saas-based-applications-against-shinyhunters-oauth-abuse/","publisher":"Microsoft","context":"The article says Microsoft published research mapping a year of Salesforce-related ShinyHunters activity to three intrusion techniques and describing new detection and governance tooling.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft reported that attackers whose methods align with the data-extortion group ShinyHunters spent the past year accessing corporate Salesforce environments without exploiting a flaw in Salesforce itself. The campaigns ran from mid-2025 into mid-2026 and affected tenants in industries including retail, education, and manufacturing. Microsoft mapped the activity to three intrusion paths: vishing calls that tricked employees into approving malicious connected apps, stolen OAuth tokens from compromised software vendors, and misconfigured guest access to Salesforce sites.\u003c/p\u003e\n\n\u003cp\u003eThe first path involved callers posing as IT support and guiding employees through Salesforce’s OAuth consent screen to approve an attacker-controlled connected app disguised as Salesforce Data Loader. The second path involved compromised vendors such as Salesloft Drift, Gainsight, and Klue, where attackers used stolen OAuth tokens or secrets from trusted integrations to reach downstream Salesforce customer environments. The third path involved suspicious guest-user activity against Salesforce Aura endpoints, where misconfigured guest permissions allowed unauthenticated access to data through Aura functionality.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that these intrusions are hard to catch because approved apps and trusted integrations can make API activity look like normal use, while sign-in and authentication monitoring may show little. Microsoft worked with Salesforce to add Defender for Cloud Apps and Salesforce Shield Event Monitoring capabilities that surface connected-app attribution, OAuth scopes, session context, and API activity. Microsoft’s guidance includes inventorying connected apps, removing unused integrations, applying least privilege, monitoring Salesforce event logs, locking down Experience Cloud guest access, and revoking or rotating tokens when integrations behave unusually.\u003c/p\u003e\n"},{"n":43,"title":"Compromised npm Packages in the AsyncAPI Namespace Deliver Miasma Botnet Loader","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/asyncapi-supply-chain-attack?utm_medium=feed","time":"08:20","priority":"SHOULD READ","score":88,"tldr":"Three compromised npm packages in the @asyncapi namespace were found delivering a multi-stage Miasma botnet loader that runs when the packages are imported and persists as a disguised NodeJS sync.js file. Users should avoid the affected versions, upgrade when patched, and review developer and CI systems while rotating exposed credentials.","briefOverview":"\u003cp\u003eSocket\u0026rsquo;s Threat Research Team identified three compromised npm packages in the \u003ccode\u003e@asyncapi\u003c/code\u003e namespace distributing a multi-stage botnet loader. The affected packages are \u003ccode\u003e@asyncapi/generator-helpers\u003c/code\u003e v1.1.1, \u003ccode\u003e@asyncapi/generator-components\u003c/code\u003e v0.7.1, and \u003ccode\u003e@asyncapi/generator\u003c/code\u003e v3.3.1. The article says users should avoid the affected versions, upgrade to patched releases when available, and review developer and CI environments for signs of compromise.\u003c/p\u003e\n\n\u003cp\u003eThe compromised AsyncAPI packages are used in tooling workflows that generate API documentation and client code from AsyncAPI definitions. Because these packages may be imported during normal development or CI execution, the malicious payload does not require a separate install hook to run. The first-stage payload was injected into \u003ccode\u003esrc/utils.js\u003c/code\u003e, hidden behind a large block of leading whitespace, and executes at \u003ccode\u003erequire()\u003c/code\u003e time.\u003c/p\u003e\n\n\u003cp\u003eStage 1 launches a detached Node.js child process that downloads an encrypted second-stage payload identified as Miasma from IPFS. The second stage persists as \u003ccode\u003esync.js\u003c/code\u003e in platform-specific directories disguised as NodeJS, including locations under macOS, Linux, and Windows user directories. Current findings indicate the decrypted second-stage payload is a botnet framework with capabilities for shell command execution, file operations, credential harvesting, evasion checks, persistence, and multi-protocol command and control.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket's Threat Research Team identified three compromised npm packages in the @asyncapi namespace distributing a multi-stage botnet loader.","The affected packages are @asyncapi/generator-helpers v1.1.1, @asyncapi/generator-components v0.7.1, and @asyncapi/generator v3.3.1.","The first-stage payload was injected into src/utils.js, hidden behind a large block of leading whitespace, and executes when the package is required.","The first stage launches a detached Node.js child process that downloads an encrypted second-stage payload identified as Miasma from IPFS.","The second-stage payload persists as sync.js in platform-specific NodeJS directories and has capabilities including shell command execution, file operations, credential harvesting, evasion checks, persistence, and multi-protocol command and control."],"insights":["The malicious code can run during normal development or CI use because it executes when the package is imported, so checking only install-time scripts would not be sufficient.","The payload was concealed behind a large block of leading whitespace inside a legitimate source file, making source-code diff review and inspection of unusual formatting especially important for these packages.","The article recommends treating exposed developer and CI environments as potentially credential-compromised, with npm tokens, GitHub tokens, cloud credentials, SSH keys, and CI secrets specifically called out for rotation.","Defenders have concrete places to look for compromise, including unexpected Node.js activity, connections to 85.137.53.71, and changes under .claude, .vscode, .cursorrules, and platform-specific NodeJS application data folders."],"referencedReports":[],"body":"\u003cp\u003eSocket\u0026rsquo;s Threat Research Team identified three compromised npm packages in the \u003ccode\u003e@asyncapi\u003c/code\u003e namespace distributing a multi-stage botnet loader. The affected packages are \u003ccode\u003e@asyncapi/generator-helpers\u003c/code\u003e v1.1.1, \u003ccode\u003e@asyncapi/generator-components\u003c/code\u003e v0.7.1, and \u003ccode\u003e@asyncapi/generator\u003c/code\u003e v3.3.1. The article says users should avoid the affected versions, upgrade to patched releases when available, and review developer and CI environments for signs of compromise.\u003c/p\u003e\n\n\u003cp\u003eThe compromised AsyncAPI packages are used in tooling workflows that generate API documentation and client code from AsyncAPI definitions. Because these packages may be imported during normal development or CI execution, the malicious payload does not require a separate install hook to run. The first-stage payload was injected into \u003ccode\u003esrc/utils.js\u003c/code\u003e, hidden behind a large block of leading whitespace, and executes at \u003ccode\u003erequire()\u003c/code\u003e time.\u003c/p\u003e\n\n\u003cp\u003eStage 1 launches a detached Node.js child process that downloads an encrypted second-stage payload identified as Miasma from IPFS. The second stage persists as \u003ccode\u003esync.js\u003c/code\u003e in platform-specific directories disguised as NodeJS, including locations under macOS, Linux, and Windows user directories. Current findings indicate the decrypted second-stage payload is a botnet framework with capabilities for shell command execution, file operations, credential harvesting, evasion checks, persistence, and multi-protocol command and control.\u003c/p\u003e\n"},{"n":19,"title":"NATO logistics, Ukrainian troops are top subjects of Russian camera hacks, advisory says","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russian-intelligence-compromising-cameras-nato-ukraine-netherlands","time":"13:55","priority":"SHOULD READ","score":86,"tldr":"Dutch intelligence agencies warned that Russian state-backed hackers are compromising internet-connected security cameras across Europe and Ukraine to monitor NATO logistics and help target Ukrainian troops. The campaign exploits weak camera security such as default passwords and outdated firmware, underscoring the military value of exposed IP cameras.","briefOverview":"\u003cp\u003eDutch intelligence agencies warned that Russian state-backed hackers are systematically compromising internet-connected security cameras across Europe and Ukraine. The Netherlands\u0026rsquo; AIVD and MIVD said at least one Russian intelligence service is targeting cameras in the Netherlands, other NATO and EU member states, and Ukraine. The goal is to gather military intelligence, including activity on military transport routes and weapons shipments destined for Ukraine.\u003c/p\u003e\n\n\u003cp\u003eIn Ukraine, the agencies said hacked cameras have in some cases been used to locate Ukrainian military personnel, with the intelligence later supporting attempts to kill soldiers and destroy equipment. The Dutch agencies also identified a small number of compromised cameras along military logistics routes in the Netherlands. The advisory said the Netherlands is an important espionage target because it is a key transit country and supports Ukraine.\u003c/p\u003e\n\n\u003cp\u003eAccording to the advisory, the attackers scan the internet for exposed cameras, identify devices using manufacturer information, and exploit weak security such as default passwords, outdated firmware, and default configurations. They then automatically analyze video feeds with image-recognition software to identify military vehicles and cargo. The advisory urged organizations operating internet-connected cameras to change default credentials, keep firmware updated, review configurations, and consider cameras\u0026rsquo; country of origin.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dutch intelligence agencies warned that at least one Russian intelligence service is compromising internet-connected security cameras in the Netherlands, other NATO and EU member states, and Ukraine.","The compromised cameras are being used to collect intelligence on military transport routes and weapons shipments destined for Ukraine.","In Ukraine, hacked cameras have in some cases been used to locate Ukrainian military personnel, with the intelligence later supporting attempts to kill soldiers and destroy equipment.","The attackers scan the internet for exposed cameras and exploit weak security such as default passwords, outdated firmware, and default configurations.","The Dutch advisory urged organizations operating internet-connected cameras to change default credentials, keep firmware updated, and review device configurations."],"insights":["The advisory shows that poorly secured security cameras can have direct battlefield consequences, including supporting attempts to kill soldiers and destroy equipment in Ukraine.","Russia is not only using compromised cameras for Ukraine-related logistics tracking; Dutch intelligence assesses that it is also collecting militarily relevant intelligence inside NATO and EU countries for potential future use.","The attackers’ use of image-recognition software means large volumes of camera footage can be automatically searched for military vehicles and cargo, increasing the intelligence value of ordinary exposed cameras.","The Netherlands is singled out as an important espionage target because its geography and support for Ukraine make it a key transit country for military logistics.","The advisory’s recommendation to consider cameras’ country of origin links camera procurement decisions to national security risk, not just device security settings."],"referencedReports":[{"title":"Cyberadvies: Russische statelijke actoren compromitteren IP-camera's in Europa voor militaire doeleinden","url":"https://www.aivd.nl/documenten/2026/07/10/cyberadvies-russische-statelijke-actoren-compromitteren-ip-cameras-in-europa-voor-militaire-doeleinden","publisher":"Netherlands General Intelligence and Security Service (AIVD) and Military Intelligence and Security Service (MIVD)","context":"The article is based on a public advisory from Dutch intelligence agencies warning that Russian state-backed actors are compromising internet-connected cameras in Europe and Ukraine for military intelligence purposes.","category":"","primary":false}],"body":"\u003cp\u003eDutch intelligence agencies warned that Russian state-backed hackers are systematically compromising internet-connected security cameras across Europe and Ukraine. The Netherlands\u0026rsquo; AIVD and MIVD said at least one Russian intelligence service is targeting cameras in the Netherlands, other NATO and EU member states, and Ukraine. The goal is to gather military intelligence, including activity on military transport routes and weapons shipments destined for Ukraine.\u003c/p\u003e\n\n\u003cp\u003eIn Ukraine, the agencies said hacked cameras have in some cases been used to locate Ukrainian military personnel, with the intelligence later supporting attempts to kill soldiers and destroy equipment. The Dutch agencies also identified a small number of compromised cameras along military logistics routes in the Netherlands. The advisory said the Netherlands is an important espionage target because it is a key transit country and supports Ukraine.\u003c/p\u003e\n\n\u003cp\u003eAccording to the advisory, the attackers scan the internet for exposed cameras, identify devices using manufacturer information, and exploit weak security such as default passwords, outdated firmware, and default configurations. They then automatically analyze video feeds with image-recognition software to identify military vehicles and cargo. The advisory urged organizations operating internet-connected cameras to change default credentials, keep firmware updated, review configurations, and consider cameras\u0026rsquo; country of origin.\u003c/p\u003e\n"},{"n":5,"title":"Progress confirms ShareFile zero-day flaw behind Storage Zone shutdown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/progress-confirms-sharefile-zero-day-flaw-behind-storage-zone-shutdown/","time":"16:08","priority":"SHOULD READ","score":85,"tldr":"Progress Software confirmed a high-severity zero-day path traversal flaw in ShareFile Storage Zone Controllers caused last week’s emergency shutdown and has released patches in versions 5.12.5 and 6.0.2. The company says it has no evidence of customer data access or active exploitation but urges customers to update before bringing servers back online.","briefOverview":"\u003cp\u003eProgress Software confirmed that a high-severity zero-day vulnerability was behind the emergency shutdown of ShareFile Storage Zone Controllers last week. The company had urged customers using the controllers to immediately shut down their Windows servers after receiving a warning about a credible external security threat. Progress also temporarily disabled access to all ShareFile accounts using Storage Zone Controllers while it investigated the incident with cybersecurity experts.\u003c/p\u003e\n\n\u003cp\u003eThe investigation identified a path traversal vulnerability affecting all 5.x and 6.x versions of ShareFile Storage Zone Controller. Progress said an authenticated administrative user could read arbitrary files accessible to the application’s service account, write threat actor-controlled content to arbitrary directories, or enumerate the server filesystem layout. A CVE identifier has been reserved for the issue and is expected to be published in two weeks.\u003c/p\u003e\n\n\u003cp\u003eProgress released ShareFile Storage Zone Controller versions 5.12.5 and 6.0.2 and urged customers to install the updates as soon as possible before bringing controllers back online. The company said it currently has no indication of unauthorized access to any ShareFile customer account or data and has not identified any active threat. Storage Zone Controllers are customer-managed Windows servers that let organizations keep files on-premises while using ShareFile’s cloud platform, making them valuable targets for data theft extortion attacks because they contain files transferred using the system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Progress Software confirmed that a high-severity zero-day vulnerability caused the emergency shutdown of ShareFile Storage Zone Controllers last week.","The vulnerability is a path traversal flaw affecting all 5.x and 6.x versions of ShareFile Storage Zone Controller.","Progress said an authenticated administrative user could read arbitrary files accessible to the application’s service account, write threat actor-controlled content to arbitrary directories, or enumerate the server filesystem layout.","Progress released ShareFile Storage Zone Controller versions 5.12.5 and 6.0.2 and urged customers to install the updates before bringing controllers back online.","Progress said it currently has no indication of unauthorized access to any ShareFile customer account or data and has not identified any active threat."],"insights":["Progress says the vulnerability requires an authenticated administrative user, yet the company still treated the threat seriously enough to disable access to all ShareFile accounts using Storage Zone Controllers during the investigation.","The flaw affects both major supported branches mentioned in the article, 5.x and 6.x, so customers cannot avoid exposure simply by being on the newer 6.x line unless they install the patched 6.0.2 release.","Progress has reserved a CVE but will not publish it for two weeks, meaning customers are being asked to patch before full public vulnerability details are available.","Storage Zone Controllers are especially sensitive targets because they hold customer-managed on-premises files while still connecting to ShareFile’s cloud platform for authentication, permissions, auditing, and collaboration."],"referencedReports":[],"body":"\u003cp\u003eProgress Software confirmed that a high-severity zero-day vulnerability was behind the emergency shutdown of ShareFile Storage Zone Controllers last week. The company had urged customers using the controllers to immediately shut down their Windows servers after receiving a warning about a credible external security threat. Progress also temporarily disabled access to all ShareFile accounts using Storage Zone Controllers while it investigated the incident with cybersecurity experts.\u003c/p\u003e\n\n\u003cp\u003eThe investigation identified a path traversal vulnerability affecting all 5.x and 6.x versions of ShareFile Storage Zone Controller. Progress said an authenticated administrative user could read arbitrary files accessible to the application’s service account, write threat actor-controlled content to arbitrary directories, or enumerate the server filesystem layout. A CVE identifier has been reserved for the issue and is expected to be published in two weeks.\u003c/p\u003e\n\n\u003cp\u003eProgress released ShareFile Storage Zone Controller versions 5.12.5 and 6.0.2 and urged customers to install the updates as soon as possible before bringing controllers back online. The company said it currently has no indication of unauthorized access to any ShareFile customer account or data and has not identified any active threat. Storage Zone Controllers are customer-managed Windows servers that let organizations keep files on-premises while using ShareFile’s cloud platform, making them valuable targets for data theft extortion attacks because they contain files transferred using the system.\u003c/p\u003e\n"},{"n":2,"title":"Nearly 300 GitHub repos pose as legit software to push malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/nearly-300-github-repos-pose-as-legit-software-to-push-malware/","time":"19:15","priority":"SHOULD READ","score":84,"tldr":"A threat actor created nearly 300 fake GitHub repositories impersonating legitimate software projects to trick users into downloading BoryptGrab infostealer malware. The malware steals browser data, crypto wallet information, messaging tokens, credentials, and files, then exfiltrates them to a Russia-based command-and-control server.","briefOverview":"\u003cp\u003eA threat actor published 292 fake GitHub repositories impersonating legitimate software and security projects to distribute infostealer malware. Arctic Wolf identified the activity after finding that one of its products was impersonated starting June 26. The campaign drew traffic from searches for security products, cryptocurrency services, financial tools, developer utilities, secure email providers, macOS utilities, and gaming software.\u003c/p\u003e\n\n\u003cp\u003eEach fake repository included a README file with a download link leading to a malicious landing page that used trustworthy wording, branding, and spoofed trust badges. Arctic Wolf found that the delivery pages reused a single templated HTML and JavaScript artifact across all impersonated brands. The page delivered a large ZIP archive whose name and payload changed roughly every minute, containing a trojanized libcurl.dll and a legitimate signed WinGUP updater.\u003c/p\u003e\n\n\u003cp\u003eWhen the user ran the executable, the renamed WinGUP updater side-loaded libcurl.dll, which decoded and reflectively executed an embedded BoryptGrab-lineage infostealer in memory. The malware targeted data from 19 web browsers, 32 cryptocurrency wallet brands, Telegram, Discord, Steam, Meta’s Max messaging application, Windows Credential Manager, and files suggesting passwords, recovery phrases, wallets, or backups. Arctic Wolf said the stolen data was compressed and sent to a Russia-based command-and-control server, and GitHub had removed many of the repositories while several dozen GitHub Pages redirectors remained active at the time of the report.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor published 292 fake GitHub repositories impersonating legitimate software and security projects to distribute infostealer malware.","Each fake repository included a README file with a download link that sent visitors to a malicious landing page using spoofed branding and trust badges.","The delivered ZIP archive contained a trojanized libcurl.dll and a legitimate signed WinGUP updater that side-loaded the DLL to execute an embedded infostealer in memory.","Arctic Wolf said the BoryptGrab variant targeted data from 19 web browsers, 32 cryptocurrency wallet brands, messaging and social media apps, Windows Credential Manager, and files suggesting passwords or wallets.","The stolen data was compressed and sent to a Russia-based command-and-control server, while the malware did not establish persistence or wipe its temporary staging directory."],"insights":["The campaign reused a single templated HTML and JavaScript delivery page across all impersonated brands, with visible branding generated from the URL path.","The malicious ZIP archive’s name and payload changed roughly every minute, which could make static blocking based only on file names or hashes less reliable.","The BoryptGrab variant included a previously undocumented capability to bypass Chrome’s App-Bound Encryption through direct code injection into the browser process.","The malware left forensic evidence behind because it did not wipe the temporary directory used to stage collected data before exfiltration.","GitHub had removed many of the fake repositories by the time of Arctic Wolf’s report, but several dozen GitHub Pages redirectors were still active."],"referencedReports":[{"title":"Fake GitHub Repositories Deliver BoryptGrab-Lineage Infostealer","url":"https://arcticwolf.com/resources/blog/fake-github-repositories-deliver-boryptgrab-lineage-infostealer/","publisher":"Arctic Wolf","context":"The article relies on Arctic Wolf's analysis of fake GitHub repositories distributing a BoryptGrab-lineage infostealer and quotes its findings about the delivery page and malware behavior.","category":"","primary":false}],"body":"\u003cp\u003eA threat actor published 292 fake GitHub repositories impersonating legitimate software and security projects to distribute infostealer malware. Arctic Wolf identified the activity after finding that one of its products was impersonated starting June 26. The campaign drew traffic from searches for security products, cryptocurrency services, financial tools, developer utilities, secure email providers, macOS utilities, and gaming software.\u003c/p\u003e\n\n\u003cp\u003eEach fake repository included a README file with a download link leading to a malicious landing page that used trustworthy wording, branding, and spoofed trust badges. Arctic Wolf found that the delivery pages reused a single templated HTML and JavaScript artifact across all impersonated brands. The page delivered a large ZIP archive whose name and payload changed roughly every minute, containing a trojanized libcurl.dll and a legitimate signed WinGUP updater.\u003c/p\u003e\n\n\u003cp\u003eWhen the user ran the executable, the renamed WinGUP updater side-loaded libcurl.dll, which decoded and reflectively executed an embedded BoryptGrab-lineage infostealer in memory. The malware targeted data from 19 web browsers, 32 cryptocurrency wallet brands, Telegram, Discord, Steam, Meta’s Max messaging application, Windows Credential Manager, and files suggesting passwords, recovery phrases, wallets, or backups. Arctic Wolf said the stolen data was compressed and sent to a Russia-based command-and-control server, and GitHub had removed many of the repositories while several dozen GitHub Pages redirectors remained active at the time of the report.\u003c/p\u003e\n"},{"n":7,"title":"New phishing kits target Microsoft 365 accounts, evade MFA","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-phishing-kits-target-microsoft-365-accounts-evade-mfa/","time":"12:49","priority":"SHOULD READ","score":84,"tldr":"Two new phishing kits, Jalisco and OmegaLord, are targeting Microsoft 365 accounts with methods designed to bypass MFA, including real-time device-code phishing and credential/phone-number theft. Defenders should restrict device registration and block or limit device-code authentication to reduce account takeover risk.","briefOverview":"\u003cp\u003eTwo new phishing kits, Jalisco and OmegaLord, have been discovered in attacks targeting Microsoft 365 accounts. ReliaQuest researchers analyzed both toolkits and said they use techniques intended to defeat multi-factor authentication. Jalisco uses device-code phishing, while OmegaLord masquerades as a PDF reader to collect account login credentials and associated phone numbers.\u003c/p\u003e\n\n\u003cp\u003eJalisco abuses the OAuth 2.0 Device Authorization Grant flow by tricking victims into authorizing an attacker-controlled device through a legitimate Microsoft login page. The toolkit generates fresh Microsoft OAuth device codes automatically when a victim opens the phishing page, bypassing Microsoft’s 15-minute validity window for device codes. ReliaQuest said attackers have registered up to five rogue devices on a single compromised account, sometimes using names containing “Microsoft” or “Windows” to lower suspicion.\u003c/p\u003e\n\n\u003cp\u003eAfter compromising an account, attackers search SharePoint and other SaaS services for valuable data and can exfiltrate it within minutes. ReliaQuest said sensitive data can include customer or employee personally identifiable information, financial records, and internal communications, with exfiltration occurring in as little as six minutes before defenders identify the breach. The researchers recommend reducing the Entra ID device-registration limit, blocking device code authentication through Microsoft Entra Conditional Access, restricting the OAuth Device Authorization grant in Okta, and auditing unnecessary app registrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ReliaQuest researchers discovered two phishing kits, Jalisco and OmegaLord, being used in attacks targeting Microsoft 365 accounts and designed to defeat multi-factor authentication.","Jalisco uses device-code phishing by generating fresh Microsoft OAuth device codes in real time when a victim opens the phishing page, bypassing Microsoft’s 15-minute code validity limit.","ReliaQuest said attackers have registered up to five rogue devices on a single compromised account, sometimes using names containing “Microsoft” or “Windows” to appear less suspicious.","After compromising an account, attackers search SharePoint and other SaaS services for sensitive data and can exfiltrate it in as little as six minutes before issuing extortion demands.","OmegaLord uses a fake PDF Reader login page to steal email addresses, passwords, and phone numbers, which ReliaQuest said could help attackers bypass MFA protections."],"insights":["Jalisco’s real-time generation of device codes specifically undermines Microsoft’s 15-minute device-code validity limit, showing that time-limited codes alone are not sufficient to stop this phishing method.","ReliaQuest’s recommendation to reduce the Entra ID device-registration limit from the default of 50 to one or two is a concrete way to limit the impact of account hijacking and speed remediation.","Attackers naming rogue devices with terms like “Microsoft” or “Windows” indicates they are trying to make unauthorized device registrations blend in with legitimate activity.","The theft of phone numbers by OmegaLord shows that attackers are targeting information beyond passwords because it may help them intercept or hijack MFA requests or codes.","ReliaQuest observed data exfiltration occurring in as little as six minutes, meaning compromised accounts may be abused before defenders have identified the breach."],"referencedReports":[{"title":"Threat Spotlight: Jalisco Toolkit and AI-Powered Phishing Surge","url":"https://reliaquest.com/blog/threat-spotlight-jalisco-toolkit-and-ai-powered-phishing-surge","publisher":"ReliaQuest","context":"The article cites ReliaQuest’s analysis of the Jalisco and OmegaLord phishing kits and quotes its findings on data theft from compromised accounts.","category":"","primary":false}],"body":"\u003cp\u003eTwo new phishing kits, Jalisco and OmegaLord, have been discovered in attacks targeting Microsoft 365 accounts. ReliaQuest researchers analyzed both toolkits and said they use techniques intended to defeat multi-factor authentication. Jalisco uses device-code phishing, while OmegaLord masquerades as a PDF reader to collect account login credentials and associated phone numbers.\u003c/p\u003e\n\n\u003cp\u003eJalisco abuses the OAuth 2.0 Device Authorization Grant flow by tricking victims into authorizing an attacker-controlled device through a legitimate Microsoft login page. The toolkit generates fresh Microsoft OAuth device codes automatically when a victim opens the phishing page, bypassing Microsoft’s 15-minute validity window for device codes. ReliaQuest said attackers have registered up to five rogue devices on a single compromised account, sometimes using names containing “Microsoft” or “Windows” to lower suspicion.\u003c/p\u003e\n\n\u003cp\u003eAfter compromising an account, attackers search SharePoint and other SaaS services for valuable data and can exfiltrate it within minutes. ReliaQuest said sensitive data can include customer or employee personally identifiable information, financial records, and internal communications, with exfiltration occurring in as little as six minutes before defenders identify the breach. The researchers recommend reducing the Entra ID device-registration limit, blocking device code authentication through Microsoft Entra Conditional Access, restricting the OAuth Device Authorization grant in Okta, and auditing unnecessary app registrations.\u003c/p\u003e\n"},{"n":26,"title":"11 Old Microsoft-Signed Linux UEFI Shims Could Let Attackers Bypass Secure Boot","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/11-old-microsoft-signed-linux-uefi.html","time":"12:46","priority":"SHOULD READ","score":84,"tldr":"Researchers found 11 old Microsoft-signed Linux UEFI shim bootloaders that remain trusted and can let attackers bypass Secure Boot to run code before the operating system loads. Microsoft has revoked the affected shims, but systems must receive the updated Secure Boot revocation list to block their abuse.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered 11 old, Microsoft-signed UEFI shim bootloaders that could be abused to bypass Secure Boot on most systems using the UEFI firmware standard. ESET said an attacker exploiting one of these vulnerable applications can execute untrusted code during system boot, enabling malicious UEFI bootkits or other malware. The issue affects UEFI-based machines that trust Microsoft’s “Microsoft Corporation UEFI CA 2011” third-party UEFI certificate authority certificate, regardless of the installed operating system.\u003c/p\u003e\n\n\u003cp\u003eThe shim is a lightweight open-source bootloader that helps Linux distributions start when Secure Boot is enabled, with firmware first validating the shim and the shim then validating later boot components. ESET said outdated but trusted shims can allow arbitrary code execution before the operating system loads, including deployment of bootkits such as Bootkitty, HybridPetya, or BlackLotus. Microsoft revoked the impacted shim bootloaders as part of its June 2026 Patch Tuesday update after responsible disclosure earlier in February.\u003c/p\u003e\n\n\u003cp\u003eCERT/CC said vendor-specific bootloaders had not been updated after upstream vulnerabilities became public and fixed, leaving vulnerable boot components signed and trusted because they had not been revoked through Microsoft’s DBX revocation list. ESET warned that the expiration of the Microsoft Corporation UEFI CA 2011 certificate does not affect Secure Boot verification unless signed bootloaders are explicitly revoked by hash. Because the code can run before the operating system and security products initialize, the article says it can evade built-in controls and endpoint detection and response tools while enabling persistence across reboots and, in some cases, reinstallation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers discovered 11 old Microsoft-signed UEFI shim bootloaders that could be abused to bypass Secure Boot on most systems using UEFI.","The vulnerable shim bootloaders affect any UEFI-based machine that trusts Microsoft’s “Microsoft Corporation UEFI CA 2011” third-party UEFI certificate authority certificate, regardless of the installed operating system.","An attacker with administrative privileges or the ability to modify the boot process could use the vulnerable bootloaders to execute arbitrary code before the operating system loads.","Microsoft revoked the affected shim bootloaders as part of its June 2026 Patch Tuesday update following responsible disclosure earlier in February.","ESET warned that the expiration of the Microsoft Corporation UEFI CA 2011 certificate does not affect Secure Boot verification unless bootloaders signed with the expired certificate are explicitly revoked by hash."],"insights":["The risk comes from old but still-trusted signed components rather than a newly discovered flaw, meaning an attacker only needs a copy of a vulnerable unrevoked shim binary and knowledge of how UEFI shims work.","The expiration of the Microsoft Corporation UEFI CA 2011 certificate does not by itself stop affected bootloaders from working under Secure Boot, because they must be explicitly revoked by hash.","The vulnerable shims can undermine newer protections such as the MOK denylist and Secure Boot Advanced Targeting by allowing older trusted boot components to be reintroduced into the boot chain.","Because the malicious code can run before the operating system and security tools start, attacks using these shims may avoid built-in security controls and endpoint detection and response products.","CERT/CC described the issue as a long-term supply chain exposure because vendor-specific bootloaders were not updated after upstream shim vulnerabilities became public and fixed."],"referencedReports":[{"title":"Forgotten UEFI shims undermining Secure Boot","url":"https://www.welivesecurity.com/en/eset-research/forgotten-uefi-shims-undermining-secure-boot/","publisher":"ESET","context":"The article cites ESET’s report as the source of the findings about old Microsoft-signed UEFI shim bootloaders that can bypass Secure Boot.","category":"","primary":false},{"title":"CERT/CC Vulnerability Note VU#616257","url":"https://www.kb.cert.org/vuls/id/616257","publisher":"CERT Coordination Center","context":"The article references a CERT/CC advisory stating that vendor-specific bootloaders were not updated after upstream shim vulnerabilities became public and fixed.","category":"","primary":false},{"title":"CVE-2026-8863","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-8863","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s vulnerability entry for one of the CVE identifiers tracking the issues.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered 11 old, Microsoft-signed UEFI shim bootloaders that could be abused to bypass Secure Boot on most systems using the UEFI firmware standard. ESET said an attacker exploiting one of these vulnerable applications can execute untrusted code during system boot, enabling malicious UEFI bootkits or other malware. The issue affects UEFI-based machines that trust Microsoft’s “Microsoft Corporation UEFI CA 2011” third-party UEFI certificate authority certificate, regardless of the installed operating system.\u003c/p\u003e\n\n\u003cp\u003eThe shim is a lightweight open-source bootloader that helps Linux distributions start when Secure Boot is enabled, with firmware first validating the shim and the shim then validating later boot components. ESET said outdated but trusted shims can allow arbitrary code execution before the operating system loads, including deployment of bootkits such as Bootkitty, HybridPetya, or BlackLotus. Microsoft revoked the impacted shim bootloaders as part of its June 2026 Patch Tuesday update after responsible disclosure earlier in February.\u003c/p\u003e\n\n\u003cp\u003eCERT/CC said vendor-specific bootloaders had not been updated after upstream vulnerabilities became public and fixed, leaving vulnerable boot components signed and trusted because they had not been revoked through Microsoft’s DBX revocation list. ESET warned that the expiration of the Microsoft Corporation UEFI CA 2011 certificate does not affect Secure Boot verification unless signed bootloaders are explicitly revoked by hash. Because the code can run before the operating system and security products initialize, the article says it can evade built-in controls and endpoint detection and response tools while enabling persistence across reboots and, in some cases, reinstallation.\u003c/p\u003e\n"},{"n":27,"title":"RabbitMQ Flaws Could Leak OAuth Secrets and Expose Cross-Tenant Queue Metadata","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/rabbitmq-flaws-could-leak-oauth-secrets.html","time":"13:48","priority":"SHOULD READ","score":84,"tldr":"RabbitMQ has patched two access control flaws that could let attackers leak OAuth client secrets for full broker takeover or let authenticated users view cross-tenant queue and exchange metadata. Organizations running RabbitMQ 3.13.0 or later should update immediately, restrict management interface access, and rotate exposed OAuth secrets.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed two access control-related flaws affecting the RabbitMQ message broker service. Miggo’s security team discovered and reported the issues, saying one flaw can leak a confidential OAuth secret to an unauthenticated attacker in a single request. The other flaw allows any logged-in user to silently read other tenants’ data.\u003c/p\u003e\n\n\u003cp\u003eThe flaws have been present in the codebase since early 2024 and affect RabbitMQ release lines from 3.13.0 and later. RabbitMQ has addressed them in versions 4.3.0, 4.2.6, 4.1.11, 4.0.20, and 3.13.15. The article says there is no evidence of active exploitation of either vulnerability before public disclosure.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-57219 involves an obsolete HTTP API endpoint, GET /api/auth, that can reveal a client secret on installations configured with the management.oauth_client_secret key, potentially allowing an attacker to exchange it for an administrator token and take control of messages, queues, users, and broker settings. CVE-2026-57221 is a missing authorization issue that lets any authenticated user connected to a virtual host enumerate queue and exchange names and read queue message and consumer counts regardless of permissions. Users are advised to patch, rotate OAuth client secrets if the management interface is internet-reachable, restrict access to port 15672, separate tenants by virtual host, and block the vulnerable endpoint on unpatched instances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers disclosed two access control-related flaws in RabbitMQ that could leak OAuth client secrets, expose messaging infrastructure to takeover risks, and bypass tenant boundaries.","Miggo reported that CVE-2026-57219 allows an unauthenticated attacker to access an obsolete HTTP API endpoint that reveals the OAuth client secret when RabbitMQ is configured with the management.oauth_client_secret key.","CVE-2026-57221 allows any authenticated user who can connect to a virtual host to enumerate all queue and exchange names and read queue message counts and consumer counts in that virtual host regardless of permissions.","The flaws have been present since early 2024 in RabbitMQ release lines from 3.13.0 and later, and they were fixed in versions 4.3.0, 4.2.6, 4.1.11, 4.0.20, and 3.13.15.","RabbitMQ users are advised to patch, rotate OAuth client secrets if the management interface is internet-reachable, restrict access to port 15672, separate tenants by virtual host, and block the vulnerable endpoint on unpatched systems."],"insights":["CVE-2026-57219 is especially actionable because an unauthenticated attacker can trigger the leak with a single request when the management port is reachable by an untrusted network.","The OAuth secret issue only applies to RabbitMQ installations that configured OAuth 2 using the management.oauth_client_secret key, so defenders can prioritize checking that specific configuration.","RabbitMQ operators may need to rotate OAuth client secrets after patching if the management interface was exposed to the internet, because updating alone would not invalidate a secret that may already have been leaked.","The second flaw shows that separating tenants only by permissions within the same virtual host may be insufficient, since RabbitMQ specifically recommends separating tenants by virtual host.","The disclosed flaws are not the only recent RabbitMQ security concern, as maintainers also addressed critical TLS client-authentication bypass and JWKS-forgery issues that could affect authentication trust."],"referencedReports":[{"title":"Full Broker Takeover, No Login Required: Miggo Discovers Critical RabbitMQ Vulnerabilities Putting Application Data at Risk","url":"https://www.miggo.io/post/full-broker-takeover-no-login-required-miggo-discovers-critical-rabbitmq-vulnerabilities-putting-application-data-at-risk","publisher":"Miggo","context":"The article says Miggo's security team discovered and reported the RabbitMQ flaws and links to its write-up.","category":"","primary":false},{"title":"CVE-2026-57219","url":"https://github.com/rabbitmq/rabbitmq-server/security/advisories/GHSA-pj24-8j6m-vq9q","publisher":"RabbitMQ","context":"The article links to the RabbitMQ security advisory for the obsolete HTTP API endpoint that can reveal an OAuth client secret.","category":"","primary":false},{"title":"CVE-2026-57221","url":"https://github.com/rabbitmq/rabbitmq-server/security/advisories/GHSA-9q2j-2hq8-22r2","publisher":"RabbitMQ","context":"The article links to the RabbitMQ security advisory for the missing authorization flaw that exposes queue and exchange metadata.","category":"","primary":false},{"title":"TLS client-authentication bypass","url":"https://github.com/rabbitmq/rabbitmq-server/security/advisories/GHSA-cw8c-4m83-9c6w","publisher":"RabbitMQ","context":"The article notes that RabbitMQ maintainers also addressed a critical TLS client-authentication bypass flaw and links to its advisory.","category":"","primary":false},{"title":"JSON Web Key Set response forgery","url":"https://github.com/rabbitmq/rabbitmq-server/security/advisories/GHSA-37wx-r6q9-6fhj","publisher":"RabbitMQ","context":"The article notes that RabbitMQ maintainers also addressed a critical flaw allowing an attacker to forge JWKS responses and links to its advisory.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed two access control-related flaws affecting the RabbitMQ message broker service. Miggo’s security team discovered and reported the issues, saying one flaw can leak a confidential OAuth secret to an unauthenticated attacker in a single request. The other flaw allows any logged-in user to silently read other tenants’ data.\u003c/p\u003e\n\n\u003cp\u003eThe flaws have been present in the codebase since early 2024 and affect RabbitMQ release lines from 3.13.0 and later. RabbitMQ has addressed them in versions 4.3.0, 4.2.6, 4.1.11, 4.0.20, and 3.13.15. The article says there is no evidence of active exploitation of either vulnerability before public disclosure.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-57219 involves an obsolete HTTP API endpoint, GET /api/auth, that can reveal a client secret on installations configured with the management.oauth_client_secret key, potentially allowing an attacker to exchange it for an administrator token and take control of messages, queues, users, and broker settings. CVE-2026-57221 is a missing authorization issue that lets any authenticated user connected to a virtual host enumerate queue and exchange names and read queue message and consumer counts regardless of permissions. Users are advised to patch, rotate OAuth client secrets if the management interface is internet-reachable, restrict access to port 15672, separate tenants by virtual host, and block the vulnerable endpoint on unpatched instances.\u003c/p\u003e\n"},{"n":31,"title":"Grok Build Uploads Entire Git Repositories to xAI Storage, Not Just Files It Reads","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/grok-build-uploads-entire-git.html","time":"09:02","priority":"SHOULD READ","score":84,"tldr":"xAI’s Grok Build CLI was found uploading entire tracked Git repositories, including commit history and files it never read, to xAI-controlled Google Cloud Storage despite the model-training opt-out being disabled. xAI appears to have shut the behavior off server-side, but users who ran the tool should rotate any credentials that may have been in read files, tracked files, or Git history.","briefOverview":"\u003cp\u003exAI’s Grok Build coding CLI was found uploading entire tracked Git repositories, including full commit history, to an xAI-run Google Cloud Storage bucket rather than only the files needed for a coding task. A researcher publishing as cereblab tested version 0.2.93, captured one of the uploads, cloned the Git bundle from the intercepted request, and recovered a file the agent had been told not to open. The article states that the captures establish transmission, acceptance, and storage, but do not show that xAI trained on the code.\u003c/p\u003e\n\n\u003cp\u003eThe technical evidence included a 12 GB repository where model-turn traffic to /v1/responses was about 192 KB, while the storage channel to /v1/storage sent 5.10 GiB in 73 chunks of about 75 MB. The destination bucket, grok-code-session-traces, appeared in the binary and in a staged metadata.json with per-file paths pointing to gs://grok-code-session-traces/. The article also says that when Grok read a tracked .env file, fake API_KEY and DB_PASSWORD values were sent unredacted in the model turn and also landed in a session_state archive bound for storage.\u003c/p\u003e\n\n\u003cp\u003eTurning off “Improve the model” did not stop the repository uploads, because that setting governed model training rather than whether code left the machine. On July 13, the same 0.2.93 client stopped making storage requests after server settings returned disable_codebase_upload: true and trace_upload_enabled: false, but xAI had not confirmed whether the change applied to every account or was permanent. The article advises anyone who already ran the tool to rotate credentials that Grok could have sent, including anything it read, anything in tracked files, and anything in Git history.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A researcher testing Grok Build version 0.2.93 found that the CLI uploaded entire tracked Git repositories, including full commit history, to an xAI-controlled Google Cloud Storage bucket rather than only files needed for a coding task.","In one test on a 12 GB repository, traffic to the model endpoint was about 192 KB while the storage channel sent 5.10 GiB to /v1/storage in 73 chunks of about 75 MB each.","The researcher recovered a file named src/_probe/never_read_canary.txt from the captured Git bundle even though the agent had been explicitly told not to open it, and the result was replicated on a second unrelated repository.","Turning off the “Improve the model” setting did not stop the repository uploads, while the server response still returned trace_upload_enabled: true.","On July 13, the same 0.2.93 client stopped making storage requests after server-side settings changed to disable_codebase_upload: true and trace_upload_enabled: false, but xAI had not confirmed whether the change applied to every account or was permanent."],"insights":["The “Improve the model” opt-out did not control whether code left the machine, showing that a training opt-out and a data-upload control were separate settings in Grok Build.","Because the captured bundle included Git history, secrets or sensitive files that had been committed and later deleted could still have been uploaded.","xAI’s apparent fix was server-side rather than a client update, and a separate analysis found the upload code still present in build 0.2.99, meaning the behavior was controlled remotely by server flags.","Users who ran Grok Build may need to rotate credentials not only from files the agent read, but also from tracked files and past commits contained in repository history.","The article distinguishes between transmission and storage versus training, noting that the captures establish code was sent to and accepted by xAI storage but do not show that it was used for model training."],"referencedReports":[{"title":"cereblab Grok Build upload analysis","url":"https://gist.github.com/cereblab/dc9a40bc26120f4540e4e09b75ffb547","publisher":"cereblab","context":"The article relies on cereblab's testing of Grok Build 0.2.93, including captured uploads showing full Git repository transfer to xAI storage.","category":"","primary":false},{"title":"Grok Build Exfil Repro Comparison","url":"https://github.com/cereblab/grok-build-exfil-repro/blob/main/COMPARISON.md","publisher":"cereblab","context":"The article cites cereblab's cross-tool comparison stating that Claude Code and Codex sent no repository bundle, while Gemini sent none in an idle test.","category":"","primary":false},{"title":"grok-network-monitor","url":"https://github.com/weklund/grok-network-monitor","publisher":"weklund","context":"The article references a separate analysis of Grok Build 0.2.99 that found the upload code still present in the binary but disabled by a server flag.","category":"","primary":false}],"body":"\u003cp\u003exAI’s Grok Build coding CLI was found uploading entire tracked Git repositories, including full commit history, to an xAI-run Google Cloud Storage bucket rather than only the files needed for a coding task. A researcher publishing as cereblab tested version 0.2.93, captured one of the uploads, cloned the Git bundle from the intercepted request, and recovered a file the agent had been told not to open. The article states that the captures establish transmission, acceptance, and storage, but do not show that xAI trained on the code.\u003c/p\u003e\n\n\u003cp\u003eThe technical evidence included a 12 GB repository where model-turn traffic to /v1/responses was about 192 KB, while the storage channel to /v1/storage sent 5.10 GiB in 73 chunks of about 75 MB. The destination bucket, grok-code-session-traces, appeared in the binary and in a staged metadata.json with per-file paths pointing to gs://grok-code-session-traces/. The article also says that when Grok read a tracked .env file, fake API_KEY and DB_PASSWORD values were sent unredacted in the model turn and also landed in a session_state archive bound for storage.\u003c/p\u003e\n\n\u003cp\u003eTurning off “Improve the model” did not stop the repository uploads, because that setting governed model training rather than whether code left the machine. On July 13, the same 0.2.93 client stopped making storage requests after server settings returned disable_codebase_upload: true and trace_upload_enabled: false, but xAI had not confirmed whether the change applied to every account or was permanent. The article advises anyone who already ran the tool to rotate credentials that Grok could have sent, including anything it read, anything in tracked files, and anything in Git history.\u003c/p\u003e\n"},{"n":3,"title":"US sanctions VPN, malware providers for enabling ransomware attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-sanctions-vpn-malware-providers-linked-to-ransomware-gangs/","time":"09:40","priority":"SHOULD READ","score":82,"tldr":"The U.S. sanctioned First VPN Service, its administrator, and a Belarusian cryptor seller for helping ransomware groups hide identities, evade detection, and attack U.S. organizations. The action follows an international law enforcement takedown of 1VPNS infrastructure tied to ransomware, fraud, and other cybercrime worldwide.","briefOverview":"\u003cp\u003eThe U.S. Treasury Department\u0026rsquo;s Office of Foreign Assets Control sanctioned First VPN Service, also known as 1VPNS, its administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware attacks against U.S. organizations. OFAC said 1VPNS sold services to ransomware groups, while Silayev sold cryptors that helped ransomware and other malware evade detection by security software. Under the sanctions, property of the designated individuals and entities within U.S. jurisdiction is blocked, and U.S. persons and businesses are barred from transactions involving them.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, 1VPNS had advertised on cybercriminal forums since 2014 that it kept no logs of user activity or identities and would not cooperate with law enforcement. Rashevskyi allegedly used false identities, including “Maksim Sorin” and “Roman Chabanenko,” to acquire infrastructure from companies that would otherwise have refused service because of abuse complaints. Victims of ransomware attacks involving 1VPNS infrastructure included U.S. businesses, hospitals, financial services firms, and municipal governments.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions followed a May law enforcement takedown of 1VPNS\u0026rsquo;s website and infrastructure during Operation Saffron, led by French and Dutch authorities with support from the FBI\u0026rsquo;s Boston Field Office. Authorities said the investigation began in December 2021 and involved infiltrating the VPN\u0026rsquo;s infrastructure and collecting its user database before dismantling it. Officials seized 33 servers across 27 countries, arrested the administrator, and exposed thousands of users associated with ransomware, fraud, and other malicious activity, while estimating that ransomware operations using 1VPNS and Silayev cryptors caused billions of dollars in losses in the United States.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Treasury Department's Office of Foreign Assets Control sanctioned First VPN Service, its administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware attacks against U.S. organizations.","First VPN Service had advertised on cybercriminal forums since 2014 that it kept no logs of user activity or identities and would not cooperate with law enforcement.","European law enforcement took down First VPN Service's website and infrastructure in May during Operation Saffron, with support from the FBI's Boston Field Office and leadership from French and Dutch authorities.","Authorities seized 33 servers linked to First VPN Service across 27 countries, arrested its administrator, and exposed thousands of users associated with ransomware, fraud, and other malicious activity.","U.S. officials estimated that ransomware operations using First VPN Service and Silayev cryptors caused billions of dollars in losses to U.S. businesses and critical infrastructure providers."],"insights":["The sanctions target not only ransomware operators but also the infrastructure and tool providers that make ransomware operations harder to trace and detect.","Law enforcement had infiltrated 1VPNS infrastructure and collected its user database before dismantling the service, showing that the takedown produced intelligence on thousands of suspected malicious users.","Rashevskyi allegedly used false identities to acquire infrastructure from companies that would otherwise have refused service because of abuse complaints, highlighting how service providers can be deceived into supporting criminal infrastructure.","Europol said 1VPNS had appeared in nearly every major cybercrime investigation it supported, indicating the service had become a recurring enabler across many separate criminal cases.","The sanctions were coordinated with the United Kingdom and followed European law enforcement action, reflecting a combined legal, financial, and operational approach against ransomware support networks."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. Treasury Department\u0026rsquo;s Office of Foreign Assets Control sanctioned First VPN Service, also known as 1VPNS, its administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware attacks against U.S. organizations. OFAC said 1VPNS sold services to ransomware groups, while Silayev sold cryptors that helped ransomware and other malware evade detection by security software. Under the sanctions, property of the designated individuals and entities within U.S. jurisdiction is blocked, and U.S. persons and businesses are barred from transactions involving them.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, 1VPNS had advertised on cybercriminal forums since 2014 that it kept no logs of user activity or identities and would not cooperate with law enforcement. Rashevskyi allegedly used false identities, including “Maksim Sorin” and “Roman Chabanenko,” to acquire infrastructure from companies that would otherwise have refused service because of abuse complaints. Victims of ransomware attacks involving 1VPNS infrastructure included U.S. businesses, hospitals, financial services firms, and municipal governments.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions followed a May law enforcement takedown of 1VPNS\u0026rsquo;s website and infrastructure during Operation Saffron, led by French and Dutch authorities with support from the FBI\u0026rsquo;s Boston Field Office. Authorities said the investigation began in December 2021 and involved infiltrating the VPN\u0026rsquo;s infrastructure and collecting its user database before dismantling it. Officials seized 33 servers across 27 countries, arrested the administrator, and exposed thousands of users associated with ransomware, fraud, and other malicious activity, while estimating that ransomware operations using 1VPNS and Silayev cryptors caused billions of dollars in losses in the United States.\u003c/p\u003e\n"},{"n":17,"title":"US unseals indictment against alleged operators of Russian bulletproof hosting service","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/us-unseals-indictment-russians-bulletproof-hosting","time":"19:26","priority":"SHOULD READ","score":82,"tldr":"The U.S. unsealed charges against three Russians accused of running Media Land and ML Cloud, bulletproof hosting services allegedly used by ransomware gangs and cybercrime markets tied to $62 million in victim losses. Authorities also offered up to $10 million for information, particularly on any foreign government links.","briefOverview":"\u003cp\u003eFederal prosecutors unsealed an indictment against three Russians associated with Media Land and ML Cloud, a St. Petersburg-based bulletproof hosting provider and sister company sanctioned by the U.S. and two allies in November. Aleksandr Volosovik, Yulia Pankova and Kirill Zatolokin are accused of providing cybercriminals with infrastructure and technical support. The U.S. government also posted a reward of up to $10 million for information in the case.\u003c/p\u003e\n\n\u003cp\u003eThe indictment, filed in December 2024, charges the defendants with conspiracy to commit and aid and abet computer fraud, conspiracy to commit wire fraud, wire fraud, and conspiracy to commit money laundering. Prosecutors said the services helped criminals evade law enforcement and cited 44 unnamed victims who suffered $62 million in losses. Authorities said the defendants are known residents of St. Petersburg, and the article notes that Russia and the U.S. do not have an extradition treaty.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said ransomware groups including Lockbit, BlackSuit and Play used services from Media Land and ML Cloud. Prosecutors also said stolen credit card marketplaces including Briansclub, Cardhouse, crdclub, Club2crd, Verified, Fullzinfo, Swipestore and Bidencash used Media Land infrastructure. Agencies from the Netherlands assisted the investigation, along with the U.K. and Australia.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Federal prosecutors unsealed an indictment against three Russians associated with Media Land and ML Cloud, a bulletproof hosting provider and sister company sanctioned by the U.S., U.K. and Australia in November.","Aleksandr Volosovik, Yulia Pankova and Kirill Zatolokin face charges including conspiracy to commit and aid and abet computer fraud, conspiracy to commit wire fraud, wire fraud, and conspiracy to commit money laundering.","The indictment cites 44 unnamed victims who suffered $62 million in losses from cybercriminal groups allegedly aided by Media Land and ML Cloud.","Authorities said ransomware groups including Lockbit, BlackSuit and Play, as well as stolen credit card marketplaces such as Briansclub and Bidencash, used Media Land infrastructure.","The U.S. State Department offered a reward of up to $10 million for information in the case, with an emphasis on information about foreign government links to Media Land and ML Cloud activities."],"insights":["The defendants are known residents of St. Petersburg, and the article notes that Russia and the U.S. do not have an extradition treaty, which makes the $10 million information reward especially significant as a pressure and intelligence-gathering tool.","The State Department’s reward announcement specifically emphasizes information about foreign government links to Media Land and ML Cloud, showing that investigators are looking beyond criminal customers to possible state connections.","Media Land’s alleged customer base spanned both ransomware groups and stolen credit card marketplaces, indicating prosecutors view the hosting service as infrastructure supporting multiple types of cybercrime rather than a single criminal operation.","Data Center Kirishi was sanctioned alongside Media Land and ML Cloud in November but is not mentioned in the indictment, suggesting the criminal case is narrower than the earlier sanctions action."],"referencedReports":[],"body":"\u003cp\u003eFederal prosecutors unsealed an indictment against three Russians associated with Media Land and ML Cloud, a St. Petersburg-based bulletproof hosting provider and sister company sanctioned by the U.S. and two allies in November. Aleksandr Volosovik, Yulia Pankova and Kirill Zatolokin are accused of providing cybercriminals with infrastructure and technical support. The U.S. government also posted a reward of up to $10 million for information in the case.\u003c/p\u003e\n\n\u003cp\u003eThe indictment, filed in December 2024, charges the defendants with conspiracy to commit and aid and abet computer fraud, conspiracy to commit wire fraud, wire fraud, and conspiracy to commit money laundering. Prosecutors said the services helped criminals evade law enforcement and cited 44 unnam
