<script type="application/json" id="dl-articles">[{"n":34,"title":"AsyncAPI npm packages backdoored via GitHub Actions","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/asyncapi-npm-packages-backdoored-via-github-actions","time":"10:00","priority":"MUST READ","score":98,"tldr":"Five AsyncAPI npm packages were backdoored after an attacker stole an npm publish token through a vulnerable GitHub Actions pull_request_target workflow. Importing the affected packages installs a persistent Node.js implant with remote shell access, so users should downgrade, hunt for indicators, and rotate exposed credentials.","briefOverview":"\u003cp\u003eFive trojanized \u003ccode\u003e@asyncapi\u003c/code\u003e npm packages were published on 2026-07-14 after an attacker stole an npm publish token by exploiting a vulnerable \u003ccode\u003epull_request_target\u003c/code\u003e GitHub Actions workflow in the AsyncAPI generator repository. The compromised releases were \u003ccode\u003e@asyncapi/specs@6.11.2\u003c/code\u003e, \u003ccode\u003e@asyncapi/specs@6.11.2-alpha.1\u003c/code\u003e, \u003ccode\u003e@asyncapi/generator@3.3.1\u003c/code\u003e, \u003ccode\u003e@asyncapi/generator-helpers@1.1.1\u003c/code\u003e, and \u003ccode\u003e@asyncapi/generator-components@0.7.1\u003c/code\u003e. The affected packages collectively receive roughly 2.9 million weekly downloads, with \u003ccode\u003e@asyncapi/specs\u003c/code\u003e accounting for about 2.7 million.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was placed in normal runtime modules rather than npm lifecycle hooks, so a plain \u003ccode\u003erequire()\u003c/code\u003e could trigger it. Importing an affected package fetched an encrypted Node.js loader from IPFS, wrote it to disk as \u003ccode\u003esync.js\u003c/code\u003e, and started it as a detached process. The recovered payload self-identifies as \u003ccode\u003eM-RED-TEAM v6.4\u003c/code\u003e, uses Miasma-branded paths and artifacts, and ultimately provides a persistent implant with a real remote shell.\u003c/p\u003e\n\n\u003cp\u003eThe implant beacons to \u003ccode\u003e85.137.53.71:8080\u003c/code\u003e about every 30 seconds and can execute shell commands, while credential harvesting and self-propagation code are present but disabled in this build. The article says misleading config fields such as \u003ccode\u003esafeMode\u003c/code\u003e, \u003ccode\u003eactualPersist\u003c/code\u003e, and \u003ccode\u003ecanaryPercent\u003c/code\u003e do not prevent persistence or remote shell capability in the actual execution path. Users are advised to downgrade to earlier versions, remove compromised versions from manifests, lockfiles, caches, mirrors, and build images, hunt for listed host and network indicators, rotate potentially exposed credentials, and rebuild compromised hosts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Five trojanized @asyncapi npm packages were published on 2026-07-14 after an attacker stole an npm publish token by exploiting a vulnerable GitHub Actions pull_request_target workflow in the AsyncAPI generator repository.","The malicious code was placed in normal runtime modules, so importing an affected package was enough to fetch an encrypted Node.js loader from IPFS, write it to disk as sync.js, and start it as a detached process.","The recovered payload identifies itself in code comments as M-RED-TEAM v6.4 and uses Miasma-branded paths and artifacts, but the article makes no definitive attribution.","The implant beacons to 85.137.53.71:8080 about every 30 seconds and includes a ShellExec command path that can run arbitrary shell commands with only killall blacklisted.","The article advises users to downgrade to earlier package versions, remove the compromised versions from manifests and caches, hunt for host and network indicators, rotate exposed credentials from a clean machine, and rebuild compromised hosts."],"insights":["The compromise can affect systems that merely imported the packages, not only systems that installed them, because the malicious code was embedded in normal runtime modules rather than npm lifecycle scripts.","The config values that appeared to indicate a limited or safe canary deployment were misleading, because the analyzed execution paths ignored safeMode, actualPersist, and canaryPercent while still enabling persistence and remote shell capability.","The C2 channel uses HTTP, and the command handler falls back to plaintext commands when encrypted commands are absent, which means an on-path attacker could inject commands through that path.","The previously reported fix for the vulnerable pull_request_target workflow had been submitted nearly two months before the attack but remained unmerged when the attacker exploited the issue.","One compromised tarball, @asyncapi/specs@6.11.2-alpha.1, was still directly downloadable despite being absent from registry metadata, so cleanup requires purging backing storage and CDN copies as well as registry listings."],"referencedReports":[],"body":"\u003cp\u003eFive trojanized \u003ccode\u003e@asyncapi\u003c/code\u003e npm packages were published on 2026-07-14 after an attacker stole an npm publish token by exploiting a vulnerable \u003ccode\u003epull_request_target\u003c/code\u003e GitHub Actions workflow in the AsyncAPI generator repository. The compromised releases were \u003ccode\u003e@asyncapi/specs@6.11.2\u003c/code\u003e, \u003ccode\u003e@asyncapi/specs@6.11.2-alpha.1\u003c/code\u003e, \u003ccode\u003e@asyncapi/generator@3.3.1\u003c/code\u003e, \u003ccode\u003e@asyncapi/generator-helpers@1.1.1\u003c/code\u003e, and \u003ccode\u003e@asyncapi/generator-components@0.7.1\u003c/code\u003e. The affected packages collectively receive roughly 2.9 million weekly downloads, with \u003ccode\u003e@asyncapi/specs\u003c/code\u003e accounting for about 2.7 million.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was placed in normal runtime modules rather than npm lifecycle hooks, so a plain \u003ccode\u003erequire()\u003c/code\u003e could trigger it. Importing an affected package fetched an encrypted Node.js loader from IPFS, wrote it to disk as \u003ccode\u003esync.js\u003c/code\u003e, and started it as a detached process. The recovered payload self-identifies as \u003ccode\u003eM-RED-TEAM v6.4\u003c/code\u003e, uses Miasma-branded paths and artifacts, and ultimately provides a persistent implant with a real remote shell.\u003c/p\u003e\n\n\u003cp\u003eThe implant beacons to \u003ccode\u003e85.137.53.71:8080\u003c/code\u003e about every 30 seconds and can execute shell commands, while credential harvesting and self-propagation code are present but disabled in this build. The article says misleading config fields such as \u003ccode\u003esafeMode\u003c/code\u003e, \u003ccode\u003eactualPersist\u003c/code\u003e, and \u003ccode\u003ecanaryPercent\u003c/code\u003e do not prevent persistence or remote shell capability in the actual execution path. Users are advised to downgrade to earlier versions, remove compromised versions from manifests, lockfiles, caches, mirrors, and build images, hunt for listed host and network indicators, rotate potentially exposed credentials, and rebuild compromised hosts.\u003c/p\u003e\n"},{"n":25,"title":"Microsoft Patches Record 622 Flaws, Including Two Zero-Days Under Active Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-patches-record-622-flaws.html","time":"20:25","priority":"MUST READ","score":96,"tldr":"Microsoft’s record July Patch Tuesday fixes 622 flaws, including two actively exploited zero-days in on-prem SharePoint Server and Active Directory Federation Services that should be prioritized over higher-scored bugs. The update also brings Kerberos RC4 hardening that may break logins if service accounts are not audited and remediated first.","briefOverview":"\u003cp\u003eMicrosoft released its largest Patch Tuesday on record, covering 622 of its own CVEs according to its Security Update Guide. Two of the fixes address zero-days already being exploited: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. Both are elevation-of-privilege flaws in identity and collaboration infrastructure, and the article says they should be patched first even though they are not headline critical remote code execution bugs.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56164 allows an unauthenticated attacker to escalate privileges over the network on SharePoint Server, and Microsoft notes that enabling AMSI in Full Mode can blunt the attack. The SharePoint issue is especially urgent because SharePoint Server 2016 and 2019 reached the end of extended support the same day, with no paid ESU program mentioned. CVE-2026-56155 affects Active Directory Federation Services and lets an already-authenticated attacker elevate privileges locally through weak access controls.\u003c/p\u003e\n\n\u003cp\u003eThe release also includes a publicly disclosed BitLocker bypass, CVE-2026-50661, which requires physical access and is not under active attack. Another SharePoint fix, CVE-2026-55040, addresses a JWT authentication bypass that Rapid7 chained with a separate remote code execution bug expected to be fixed in August. The update also completes Microsoft’s Kerberos RC4 hardening by removing a rollback switch, which can cause authentication failures if organizations have not audited and remediated service accounts that still request RC4 tickets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released its largest Patch Tuesday on record, covering 622 of its own CVEs according to the Security Update Guide.","Two actively exploited zero-days, CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services, are elevation-of-privilege flaws that Microsoft says should be prioritized despite not being headline critical remote code execution bugs.","CVE-2026-56164 allows an unauthenticated attacker to escalate privileges over the network on SharePoint Server, and Microsoft notes that enabling AMSI in Full Mode can blunt the attack.","CVE-2026-50661 is a publicly disclosed BitLocker bypass that is not under active attack and requires physical access to the device.","The July update removes the Kerberos RC4 rollback switch, meaning RC4 works only for accounts explicitly configured to allow it and some service accounts may fail authentication if administrators do not audit and remediate first."],"insights":["The two actively exploited flaws are not the highest-scored issues in the release, showing that Microsoft’s exploited flag is more useful for triage this month than severity labels alone.","The SharePoint zero-day has added urgency because SharePoint Server 2016 and 2019 reached the end of extended support on the same day, and the article says there is no paid ESU program for them.","Rapid7’s SharePoint JWT authentication bypass matters even though its severity score is disputed, because it breaks a chain Rapid7 used to reach unauthenticated remote code execution with a second bug Microsoft is expected to patch in August.","The Kerberos RC4 hardening is operationally risky rather than breach-driven, because installing the update before auditing and rotating affected service account passwords can cause authentication failures.","The record patch volume may reflect Microsoft’s growing use of AI-assisted vulnerability discovery, but the article warns that the same post-patch analysis pressure can shrink defenders’ time to act after updates ship."],"referencedReports":[{"title":"July 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Jul","publisher":"Microsoft Security Response Center","context":"The article uses Microsoft's Security Update Guide as the source for the 622 CVE count and the July Patch Tuesday release details.","category":"","primary":false},{"title":"CVE-2026-56164","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-56164","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft's advisory for the exploited SharePoint Server elevation-of-privilege zero-day and its mitigation note about AMSI Full Mode.","category":"","primary":false},{"title":"CVE-2026-56155","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-56155","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft's advisory for the exploited Active Directory Federation Services elevation-of-privilege zero-day.","category":"","primary":false},{"title":"CVE-2026-50661","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50661","publisher":"Microsoft Security Response Center","context":"The article references Microsoft's advisory for the publicly disclosed BitLocker bypass that is not reported as under active attack.","category":"","primary":false},{"title":"VE: CVE-2026-55040: Microsoft SharePoint JWT Token Authentication Bypass Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed/","publisher":"Rapid7 Labs","context":"The article cites Rapid7 Labs' disclosure and technical details for the SharePoint JWT authentication bypass used in its Pwn2Own Berlin chain.","category":"","primary":false},{"title":"The July 2026 Security Update Review","url":"https://www.zerodayinitiative.com/blog/2026/7/14/the-july-2026-security-update-review","publisher":"Zero Day Initiative","context":"The article uses ZDI's review for independent vulnerability counts, severity interpretation, and per-product-family callouts.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article notes that the two Microsoft-exploited CVEs were not listed in CISA's Known Exploited Vulnerabilities catalog at the time of writing.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released its largest Patch Tuesday on record, covering 622 of its own CVEs according to its Security Update Guide. Two of the fixes address zero-days already being exploited: CVE-2026-56164 in on-premises SharePoint Server and CVE-2026-56155 in Active Directory Federation Services. Both are elevation-of-privilege flaws in identity and collaboration infrastructure, and the article says they should be patched first even though they are not headline critical remote code execution bugs.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56164 allows an unauthenticated attacker to escalate privileges over the network on SharePoint Server, and Microsoft notes that enabling AMSI in Full Mode can blunt the attack. The SharePoint issue is especially urgent because SharePoint Server 2016 and 2019 reached the end of extended support the same day, with no paid ESU program mentioned. CVE-2026-56155 affects Active Directory Federation Services and lets an already-authenticated attacker elevate privileges locally through weak access controls.\u003c/p\u003e\n\n\u003cp\u003eThe release also includes a publicly disclosed BitLocker bypass, CVE-2026-50661, which requires physical access and is not under active attack. Another SharePoint fix, CVE-2026-55040, addresses a JWT authentication bypass that Rapid7 chained with a separate remote code execution bug expected to be fixed in August. The update also completes Microsoft’s Kerberos RC4 hardening by removing a rollback switch, which can cause authentication failures if organizations have not audited and remediated service accounts that still request RC4 tickets.\u003c/p\u003e\n"},{"n":35,"title":"Microsoft’s July 2026 Patch Tuesday Addresses 569 CVEs (CVE-2026-56155, CVE-2026-56164)","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/microsofts-july-2026-patch-tuesday-addresses-569-cves-cve-2026-56155-cve-2026-56164","time":"18:23","priority":"MUST READ","score":96,"tldr":"Microsoft’s July 2026 Patch Tuesday fixes a record 569 CVEs, including three zero-days and two vulnerabilities already exploited in the wild affecting Active Directory Federation Services and SharePoint Server. Organizations should prioritize patching the exploited zero-days and critical flaws in Dynamics, DHCP, and Windows Kernel components.","briefOverview":"\u003cp\u003eMicrosoft patched 569 CVEs in its July 2026 Patch Tuesday release, making it the largest Patch Tuesday release to date. The update includes 56 critical, 510 important, and 3 moderate vulnerabilities. Microsoft said customers should expect a higher volume of security updates as its multi-model agentic scanning harness is being used to identify vulnerabilities faster.\u003c/p\u003e\n\n\u003cp\u003eThe release includes three zero-days, two of which were exploited in the wild. CVE-2026-56155 affects Active Directory Federation Services and could allow an attacker to gain administrator privileges, while CVE-2026-56164 affects Microsoft SharePoint Server and was also exploited in the wild. Microsoft also patched CVE-2026-50661, a publicly disclosed Windows BitLocker security feature bypass vulnerability that requires physical access to exploit.\u003c/p\u003e\n\n\u003cp\u003eSeveral critical issues were highlighted, including CVE-2026-55944 in Microsoft Dynamics NAV and Microsoft Dynamics 365 Business Central, which can be exploited without authentication or user interaction through a crafted login request. Microsoft also addressed nine DHCP Server and Windows DHCP Client vulnerabilities, five of which were rated critical. Elevation of privilege vulnerabilities accounted for 43.8% of the flaws patched this month, and Windows Kernel received 20 elevation of privilege fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft patched 569 CVEs in its July 2026 Patch Tuesday release, with 56 rated critical, 510 rated important, and 3 rated moderate.","The July 2026 release includes three zero-days, two of which were exploited in the wild.","CVE-2026-56155 is an elevation of privilege vulnerability in Active Directory Federation Services that was exploited in the wild and could allow an attacker to gain administrator privileges.","CVE-2026-56164 is an elevation of privilege vulnerability in Microsoft SharePoint Server that was exploited in the wild and affects SharePoint Server 2019, SharePoint Server Subscription Edition, SharePoint Server 2016, and SharePoint Enterprise Server 2016.","Microsoft addressed multiple DHCP Server and Windows DHCP Client vulnerabilities, including five rated critical and three assessed as “Exploitation More Likely.”"],"insights":["The record-breaking number of fixes appears tied to Microsoft’s use of its multi-model agentic scanning harness, with Microsoft warning customers to expect higher volumes of security updates in each release.","The Microsoft Dynamics NAV and Dynamics 365 Business Central vulnerability is especially actionable because Microsoft says exploitation requires neither authentication nor user interaction and can be triggered with a crafted login request.","For the exploited SharePoint Server vulnerability, Microsoft specifically identifies AMSI integration as a mitigation that can scan for and detect malicious POST requests.","Although CVE-2026-50661 has a public exploit, Microsoft assesses exploitation as less likely because an attacker needs physical access to the target device.","Elevation of privilege issues made up the largest share of the release at 43.8%, and the Windows Kernel alone received 20 elevation of privilege fixes, including six assessed as more likely to be exploited."],"referencedReports":[{"title":"Microsoft's July 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/en-us/releaseNote/2026-Jul","publisher":"Microsoft","context":"The article references Microsoft’s July 2026 Security Updates as the source for the Patch Tuesday release details.","category":"","primary":false},{"title":"CVE-2026-56155","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-56155","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the Active Directory Federation Services elevation of privilege vulnerability exploited in the wild.","category":"","primary":false},{"title":"CVE-2026-56164","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-56164","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the SharePoint Server elevation of privilege vulnerability exploited in the wild.","category":"","primary":false},{"title":"CVE-2026-50661","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-50661","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the Windows BitLocker security feature bypass vulnerability that was publicly disclosed before a patch was available.","category":"","primary":false},{"title":"CVE-2026-55944","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-55944","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the critical Microsoft Dynamics NAV and Dynamics 365 Business Central remote code execution vulnerability.","category":"","primary":false},{"title":"GreatXML","url":"https://github.com/MSNightmare/GreatXML","publisher":"MSNightmare","context":"The article references GreatXML as a disclosed zero-day BitLocker bypass flaw that may relate to Microsoft’s CVE-2026-50661 patch.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft patched 569 CVEs in its July 2026 Patch Tuesday release, making it the largest Patch Tuesday release to date. The update includes 56 critical, 510 important, and 3 moderate vulnerabilities. Microsoft said customers should expect a higher volume of security updates as its multi-model agentic scanning harness is being used to identify vulnerabilities faster.\u003c/p\u003e\n\n\u003cp\u003eThe release includes three zero-days, two of which were exploited in the wild. CVE-2026-56155 affects Active Directory Federation Services and could allow an attacker to gain administrator privileges, while CVE-2026-56164 affects Microsoft SharePoint Server and was also exploited in the wild. Microsoft also patched CVE-2026-50661, a publicly disclosed Windows BitLocker security feature bypass vulnerability that requires physical access to exploit.\u003c/p\u003e\n\n\u003cp\u003eSeveral critical issues were highlighted, including CVE-2026-55944 in Microsoft Dynamics NAV and Microsoft Dynamics 365 Business Central, which can be exploited without authentication or user interaction through a crafted login request. Microsoft also addressed nine DHCP Server and Windows DHCP Client vulnerabilities, five of which were rated critical. Elevation of privilege vulnerabilities accounted for 43.8% of the flaws patched this month, and Windows Kernel received 20 elevation of privilege fixes.\u003c/p\u003e\n"},{"n":6,"title":"Microsoft July 2026 Patch Tuesday fixes massive 570 flaws, 3 zero-days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-july-2026-patch-tuesday-fixes-massive-570-flaws-3-zero-days/","time":"18:01","priority":"MUST READ","score":95,"tldr":"Microsoft’s July 2026 Patch Tuesday fixes a record 570 vulnerabilities, including 59 critical flaws and three zero-days. Two of the zero-days, affecting Active Directory Federation Services and SharePoint Server, were already exploited in attacks, making rapid patching especially urgent.","briefOverview":"\u003cp\u003eMicrosoft’s July 2026 Patch Tuesday released security updates for a record-breaking 570 flaws. The fixes include three zero-day vulnerabilities, with two exploited in attacks and one publicly disclosed. The update addresses 59 vulnerabilities rated Critical, including 48 remote code execution flaws, 9 elevation of privilege flaws, 1 security bypass flaw, and 1 spoofing flaw.\u003c/p\u003e\n\n\u003cp\u003eThe two actively exploited zero-days are CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server. The AD FS flaw allows an authorized attacker to elevate privileges locally, while the SharePoint flaw involves missing authentication for a critical function that lets an unauthorized attacker elevate privileges over a network. Microsoft said enabling AMSI on the SharePoint server and setting Request Body Scan mode to Full can help mitigate CVE-2026-56164.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also patched CVE-2026-50661, a publicly disclosed Windows BitLocker security feature bypass vulnerability. The company said an attacker with physical access to a target system could exploit it to bypass BitLocker Device Encryption and gain access to encrypted data. The article notes that the 570-flaw count excludes some Microsoft fixes released earlier in the month and excludes 468 Microsoft Edge/Chromium flaws fixed by Google this month.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s July 2026 Patch Tuesday released security updates for a record-breaking 570 flaws, including three zero-day vulnerabilities.","The updates address 59 critical vulnerabilities, including 48 remote code execution flaws, 9 elevation of privilege flaws, 1 security bypass flaw, and 1 spoofing flaw.","Two actively exploited zero-days were patched: CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server.","Microsoft also patched CVE-2026-50661, a publicly disclosed Windows BitLocker security feature bypass vulnerability that could allow an attacker with physical access to gain access to encrypted data.","Microsoft said enabling AMSI on SharePoint Server and setting Request Body Scan mode to Full can help mitigate CVE-2026-56164."],"insights":["The 570-flaw total is not the full Microsoft ecosystem patch burden for the month, because it excludes issues fixed earlier in Mariner, Azure OpenAI, Azure Synapse, M365 Copilot, Exchange Online, Edge for Android, Entra Provisioning Service, and 468 Edge/Chromium flaws fixed by Google.","Microsoft had warned that Patch Tuesday update volume would increase because it is using an AI-powered vulnerability discovery system to find more Windows flaws before attackers can exploit them.","The Active Directory Federation Services zero-day was credited to Microsoft DART, which the article says indicates it was likely uncovered while investigating active attacks.","The actively exploited SharePoint Server zero-day is listed as only Moderate severity in the vulnerability table, but Microsoft still provided a specific mitigation: enable AMSI and set Request Body Scan mode to Full."],"referencedReports":[{"title":"CVE-2026-56155 - Active Directory Federation Services Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-56155","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s advisory for an actively exploited Active Directory Federation Services zero-day fixed in the July 2026 Patch Tuesday updates.","category":"","primary":false},{"title":"CVE-2026-56164 - Microsoft SharePoint Server Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-56164","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s advisory for an actively exploited SharePoint Server zero-day fixed in the July 2026 Patch Tuesday updates.","category":"","primary":false},{"title":"CVE-2026-50661 - Windows BitLocker Security Feature Bypass Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50661","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s advisory for a publicly disclosed Windows BitLocker bypass flaw fixed in the July 2026 Patch Tuesday updates.","category":"","primary":false},{"title":"Cisco Security Advisories","url":"https://sec.cloudapps.cisco.com/security/center/publicationListing.x","publisher":"Cisco","context":"The article says Cisco released security updates for numerous products and links to Cisco’s security advisory publication listing.","category":"","primary":false},{"title":"FortiGuard PSIRT Advisories","url":"https://www.fortiguard.com/psirt","publisher":"Fortinet","context":"The article says Fortinet released security updates for numerous flaws and links to Fortinet’s PSIRT advisory page.","category":"","primary":false},{"title":"Security Advisory Ivanti Xtraction CVE-2026-14902 CVE-2026-14903","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Xtraction-CVE-2026-14902-CVE-2026-14903?language=en_US","publisher":"Ivanti","context":"The article says Ivanti released security updates for two vulnerabilities in Ivanti Xtraction and links to Ivanti’s security advisory.","category":"","primary":false},{"title":"VMware Avi Load Balancer Security Advisory","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/37926?utm_campaign=VCF_FY26_VCF_VMSA-2026-0005_MKT_CM_6254\u0026utm_content=VCF_FY26_VCF_VMSA-2026-0005_6254_SecurityAlert_MKT_TRANS_EM_12268","publisher":"Broadcom VMware","context":"The article says VMware released security updates for VMware Avi Load Balancer and links to Broadcom’s security advisory.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft’s July 2026 Patch Tuesday released security updates for a record-breaking 570 flaws. The fixes include three zero-day vulnerabilities, with two exploited in attacks and one publicly disclosed. The update addresses 59 vulnerabilities rated Critical, including 48 remote code execution flaws, 9 elevation of privilege flaws, 1 security bypass flaw, and 1 spoofing flaw.\u003c/p\u003e\n\n\u003cp\u003eThe two actively exploited zero-days are CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server. The AD FS flaw allows an authorized attacker to elevate privileges locally, while the SharePoint flaw involves missing authentication for a critical function that lets an unauthorized attacker elevate privileges over a network. Microsoft said enabling AMSI on the SharePoint server and setting Request Body Scan mode to Full can help mitigate CVE-2026-56164.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also patched CVE-2026-50661, a publicly disclosed Windows BitLocker security feature bypass vulnerability. The company said an attacker with physical access to a target system could exploit it to bypass BitLocker Device Encryption and gain access to encrypted data. The article notes that the 570-flaw count excludes some Microsoft fixes released earlier in the month and excludes 468 Microsoft Edge/Chromium flaws fixed by Google this month.\u003c/p\u003e\n"},{"n":14,"title":"SonicWall warns of SMA1000 flaws exploited in zero-day attacks, patch now","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-sma1000-flaws-exploited-in-zero-day-attacks-patch-now/","time":"21:23","priority":"MUST READ","score":95,"tldr":"SonicWall says two SMA1000 flaws, CVE-2026-15409 and CVE-2026-15410, are being actively exploited in zero-day attacks and urges customers to install the latest hotfix immediately. Compromised devices should be re-imaged or redeployed, with passwords and TOTP tokens reset.","briefOverview":"\u003cp\u003eSonicWall warned that threat actors are actively exploiting two SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, in zero-day attacks. The company investigated multiple incidents and confirmed exploitation of both flaws. SonicWall urged customers to install newly released hotfixes as soon as possible.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-15409 is a critical server-side request forgery vulnerability in the SMA1000 Appliance Work Place interface that allows a remote, unauthenticated attacker to force an appliance to make requests to unintended locations. CVE-2026-15410 is a high-severity post-authentication code injection flaw in the SMA1000 Appliance Management Console that could allow a remote authenticated administrator to execute arbitrary operating system commands. SonicWall has not disclosed whether attackers are chaining the two vulnerabilities together.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities affect SMA1000 models 6210, 7210, and 8200v running specific platform-hotfix releases, with fixes available in versions 12.4.3-03453 and 12.5.0-02835 and later. SonicWall said there are no workarounds or mitigations other than installing the hotfixes, and advised re-imaging or redeploying compromised appliances, changing user and administrator passwords, and resetting TOTP tokens. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and gave federal agencies until July 17, 2026, to secure affected systems or discontinue use if mitigations cannot be applied.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall warned that threat actors are actively exploiting two SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, in zero-day attacks.","CVE-2026-15409 is a critical server-side request forgery flaw in the SMA1000 Appliance Work Place interface that allows a remote, unauthenticated attacker to force an appliance to make requests to unintended locations.","CVE-2026-15410 is a high-severity post-authentication code injection flaw in the SMA1000 Appliance Management Console that could allow a remote authenticated administrator to execute arbitrary operating system commands.","The vulnerabilities affect SMA1000 models 6210, 7210, and 8200v running specified platform-hotfix releases, with fixes available in platform-hotfix versions 12.4.3-03453 and 12.5.0-02835 and later releases.","CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and said federal agencies have until July 17, 2026, to secure affected systems or discontinue use if mitigations cannot be applied."],"insights":["SonicWall says there are no workarounds or mitigations for these flaws other than installing the hotfixes, making patching the only stated remediation path for affected devices.","SonicWall’s compromise guidance goes beyond patching: if an appliance is found compromised, administrators are advised to re-image physical appliances or redeploy virtual appliances, change all user and administrator passwords, and reset TOTP tokens.","Although CVE-2026-15410 requires administrator privileges, SonicWall assigned the overall advisory a maximum CVSS score of 10.0.","SonicWall provided specific indicators of compromise in log files and configuration paths, including unexpected requests to /__api__/login or /__api__/logout and suspicious /wsproxy host parameters."],"referencedReports":[{"title":"SNWLID-2026-0008","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0008","publisher":"SonicWall PSIRT","context":"The article cites SonicWall’s advisory as the source warning that the SMA1000 vulnerabilities are being actively exploited and urging customers to upgrade to the hotfix release.","category":"","primary":false}],"body":"\u003cp\u003eSonicWall warned that threat actors are actively exploiting two SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, in zero-day attacks. The company investigated multiple incidents and confirmed exploitation of both flaws. SonicWall urged customers to install newly released hotfixes as soon as possible.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-15409 is a critical server-side request forgery vulnerability in the SMA1000 Appliance Work Place interface that allows a remote, unauthenticated attacker to force an appliance to make requests to unintended locations. CVE-2026-15410 is a high-severity post-authentication code injection flaw in the SMA1000 Appliance Management Console that could allow a remote authenticated administrator to execute arbitrary operating system commands. SonicWall has not disclosed whether attackers are chaining the two vulnerabilities together.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities affect SMA1000 models 6210, 7210, and 8200v running specific platform-hotfix releases, with fixes available in versions 12.4.3-03453 and 12.5.0-02835 and later. SonicWall said there are no workarounds or mitigations other than installing the hotfixes, and advised re-imaging or redeploying compromised appliances, changing user and administrator passwords, and resetting TOTP tokens. CISA added both vulnerabilities to its Known Exploited Vulnerabilities catalog and gave federal agencies until July 17, 2026, to secure affected systems or discontinue use if mitigations cannot be applied.\u003c/p\u003e\n"},{"n":38,"title":"Microsoft Patch Tuesday for July 2026 — Snort rules and prominent vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/microsoft-patch-tuesday-july-2026/","time":"20:27","priority":"MUST READ","score":95,"tldr":"Microsoft’s July 2026 Patch Tuesday fixes 622 vulnerabilities, including 57 critical issues and two flaws already exploited in the wild affecting AD FS and SharePoint Server. Cisco Talos released updated Snort rules to help detect exploitation attempts for several of these vulnerabilities.","briefOverview":"\u003cp\u003eMicrosoft released its July 2026 monthly security update, addressing 622 vulnerabilities across a wide range of products. Microsoft marked 57 of the vulnerabilities as critical, including 48 remote code execution issues, seven elevation of privilege issues, one spoofing issue and one security feature bypass issue. Microsoft also noted that two vulnerabilities disclosed this month have been exploited in the wild: CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server.\u003c/p\u003e\n\n\u003cp\u003eThe critical remote code execution vulnerabilities affect products and services including Windows Media and Media Foundation, Windows DHCP client and DHCP Server, Microsoft Office, SharePoint, SQL Server, Windows TCP/IP, Print Spooler, Active Directory Domain Services, Microsoft Defender, Copilot, Dynamics and Minecraft Bedrock Dedicated Server. Eleven of the critical remote code execution vulnerabilities are rated “more likely” to be exploited, including issues involving heap-based buffer overflows, use-after-free, race conditions and deserialization flaws. The article also highlights many important-severity vulnerabilities that Microsoft rated as more likely to be exploited, mostly involving elevation of privilege across Windows components and related services.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos is releasing a new Snort ruleset to detect attempts to exploit some of the disclosed vulnerabilities. The article states that additional rules may be released later and that current rules may change as more information becomes available. It lists Snort 2 rule ranges 1:66733–1:66743, 1:66745–1:66785, 1:66791–1:66793 and 1:66800–1:66807, along with Snort 3 rules 1:301555–1:301579 and 1:301581–1:301583.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s July 2026 security update includes 622 vulnerabilities across multiple products, with 57 marked as critical.","Microsoft said two vulnerabilities disclosed this month, CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server, have been exploited in the wild.","The 57 critical vulnerabilities include 48 remote code execution issues, seven elevation of privilege issues, one spoofing issue and one security feature bypass issue.","Eleven of the critical remote code execution vulnerabilities are rated by Microsoft as more likely to be exploited and affect products including Windows DHCP Server, Windows DHCP client, Windows Media and Media Foundation, Microsoft Message Queuing, SharePoint, Dynamics and Minecraft Bedrock Dedicated Server.","Cisco Talos is releasing a new Snort ruleset to detect attempts to exploit some of the disclosed vulnerabilities, including listed Snort 2 and Snort 3 rule ranges."],"insights":["The two vulnerabilities Microsoft says were exploited in the wild are not among the 57 critical entries, showing that the article’s most urgent issues are not limited to Microsoft’s highest severity label.","Microsoft Office, Word and PowerPoint account for many of the remaining critical remote code execution vulnerabilities, and the article notes these are typically triggered by opening a specially crafted document.","Several critical cloud-service entries, including Copilot, Azure Synapse, Azure OpenAI, Exchange Online and Entra items, do not have Microsoft exploitation-likelihood ratings, unlike many of the on-premises product vulnerabilities discussed in the article.","The article separates a large set of important-severity vulnerabilities as worth highlighting because Microsoft rates their exploitation as more likely, making exploitability a major prioritization factor alongside severity.","Cisco Talos released both Snort 2 and Snort 3 rule ranges for this Patch Tuesday, indicating detection coverage is available but may change as more information becomes available."],"referencedReports":[{"title":"Microsoft Security Update Guide Release Notes - July 2026","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Jul","publisher":"Microsoft","context":"The article points readers to Microsoft’s update page for the complete list of vulnerabilities disclosed in the July 2026 security update.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released its July 2026 monthly security update, addressing 622 vulnerabilities across a wide range of products. Microsoft marked 57 of the vulnerabilities as critical, including 48 remote code execution issues, seven elevation of privilege issues, one spoofing issue and one security feature bypass issue. Microsoft also noted that two vulnerabilities disclosed this month have been exploited in the wild: CVE-2026-56155 in Active Directory Federation Services and CVE-2026-56164 in Microsoft SharePoint Server.\u003c/p\u003e\n\n\u003cp\u003eThe critical remote code execution vulnerabilities affect products and services including Windows Media and Media Foundation, Windows DHCP client and DHCP Server, Microsoft Office, SharePoint, SQL Server, Windows TCP/IP, Print Spooler, Active Directory Domain Services, Microsoft Defender, Copilot, Dynamics and Minecraft Bedrock Dedicated Server. Eleven of the critical remote code execution vulnerabilities are rated “more likely” to be exploited, including issues involving heap-based buffer overflows, use-after-free, race conditions and deserialization flaws. The article also highlights many important-severity vulnerabilities that Microsoft rated as more likely to be exploited, mostly involving elevation of privilege across Windows components and related services.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos is releasing a new Snort ruleset to detect attempts to exploit some of the disclosed vulnerabilities. The article states that additional rules may be released later and that current rules may change as more information becomes available. It lists Snort 2 rule ranges 1:66733–1:66743, 1:66745–1:66785, 1:66791–1:66793 and 1:66800–1:66807, along with Snort 3 rules 1:301555–1:301579 and 1:301581–1:301583.\u003c/p\u003e\n"},{"n":44,"title":"Coordinated AsyncAPI Supply Chain Attack: Miasma RAT Delivered via Compromised CI/CD Pipelines in Two Repositories","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/compromised-next-branch-pushes-malicious-asyncapi-generator-generator-helpers-and-generator-components-to-npm","time":"09:55","priority":"MUST READ","score":95,"tldr":"Attackers compromised push access to two AsyncAPI GitHub repositories and used legitimate GitHub Actions release workflows with npm OIDC provenance to publish malicious package versions containing a Miasma RAT dropper. The key lesson is that valid provenance proves a trusted pipeline built the package, but it does not prove the triggering commit was legitimate.","briefOverview":"\u003cp\u003eOn July 14, 2026, a coordinated supply chain attack affected two AsyncAPI GitHub repositories and led to malicious npm releases of four packages. The affected versions were @asyncapi/generator@3.3.1, @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, and @asyncapi/specs@6.11.2, with @asyncapi/specs@6.11.2-alpha.1 also published during the incident. The attacker gained push access to the repositories and used the projects’ legitimate GitHub Actions release workflows to publish the packages via npm’s GitHub OIDC trusted-publisher integration, with no npm token stolen.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the packages carried legitimate SLSA provenance attestations, but those attestations only proved that the authorized project workflow produced them. They did not prove that the commits triggering the workflows were legitimate. Both repository compromises used the same placeholder git identity, shared the same Miasma RAT second-stage payload infrastructure, and showed the same drop behavior.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was an obfuscated dropper that ran when the poisoned library was loaded, not during package installation. It spawned a hidden detached Node.js process, fetched an IPFS-hosted sync.js payload, wrote it to an OS-specific hidden “NodeJS” directory, and launched it. Static analysis identified the decrypted payload as “Miasma v3,” with capabilities including multiple command-and-control channels, credential harvesting, AI tool poisoning, local network movement, persistence, shell execution, and self-destruct functionality.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A coordinated supply chain attack on July 14, 2026 compromised two AsyncAPI GitHub repositories and produced malicious npm package versions for @asyncapi/generator, @asyncapi/generator-helpers, @asyncapi/generator-components, and @asyncapi/specs.","The attacker gained push access to the repositories and used the projects’ legitimate GitHub Actions release pipelines with npm GitHub OIDC trusted-publisher integration, so no npm token was stolen.","The malicious packages carried an obfuscated dropper that executed when the library was loaded during normal use, not during npm installation.","Static analysis showed the dropper fetched an IPFS-hosted second-stage sync.js payload and installed it in hidden OS-specific NodeJS directories before launching it detached and hidden.","The decrypted second-stage payload was identified as Miasma v3 and included multiple command-and-control channels, credential harvesting, persistence, lateral movement, shell execution, and self-destruct capabilities."],"insights":["The packages had legitimate SLSA provenance attestations, but the article emphasizes that this only proved the authorized workflow published them and did not prove the triggering commits were legitimate.","The dropper did not use npm install scripts, so defenses focused only on install-time behavior could miss it because it ran when the poisoned library was loaded during normal use.","The malicious code was padded with roughly a thousand leading spaces to push it off-screen in GitHub’s diff view, making human review of the commit less likely to notice it.","The same placeholder git identity, second-stage infrastructure, and drop behavior across two separate repositories showed the incidents were coordinated rather than isolated package compromises.","The Miasma payload included several fallback communication methods, including HTTP, Nostr, IPFS, BitTorrent DHT, libp2p GossipSub, and Ethereum, meaning blocking only the primary C2 endpoint would not fully cut off the implant."],"referencedReports":[],"body":"\u003cp\u003eOn July 14, 2026, a coordinated supply chain attack affected two AsyncAPI GitHub repositories and led to malicious npm releases of four packages. The affected versions were @asyncapi/generator@3.3.1, @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, and @asyncapi/specs@6.11.2, with @asyncapi/specs@6.11.2-alpha.1 also published during the incident. The attacker gained push access to the repositories and used the projects’ legitimate GitHub Actions release workflows to publish the packages via npm’s GitHub OIDC trusted-publisher integration, with no npm token stolen.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the packages carried legitimate SLSA provenance attestations, but those attestations only proved that the authorized project workflow produced them. They did not prove that the commits triggering the workflows were legitimate. Both repository compromises used the same placeholder git identity, shared the same Miasma RAT second-stage payload infrastructure, and showed the same drop behavior.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code was an obfuscated dropper that ran when the poisoned library was loaded, not during package installation. It spawned a hidden detached Node.js process, fetched an IPFS-hosted sync.js payload, wrote it to an OS-specific hidden “NodeJS” directory, and launched it. Static analysis identified the decrypted payload as “Miasma v3,” with capabilities including multiple command-and-control channels, credential harvesting, AI tool poisoning, local network movement, persistence, shell execution, and self-destruct functionality.\u003c/p\u003e\n"},{"n":29,"title":"OAuth Client ID Spoofing Lets Attackers Validate Stolen Microsoft Entra Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/oauth-client-id-spoofing-lets-attackers.html","time":"11:21","priority":"MUST READ","score":94,"tldr":"Proofpoint reports that threat actors are using OAuth client ID spoofing against Microsoft Entra ID to enumerate accounts and validate stolen passwords without generating normal successful sign-in telemetry. Two large campaigns used millions of spoofed app IDs across thousands of tenants, making detection harder because activity is fragmented across fictional applications.","briefOverview":"\u003cp\u003eAt least two threat actors are using a technique called OAuth client ID spoofing in cloud campaigns against Microsoft Entra ID environments. Proofpoint said the activity lets attackers enumerate user accounts and validate stolen credentials without generating a successful sign-in event that would normally alert defenders. The technique creates a blind spot because Entra ID returns different error responses depending on whether a supplied OAuth client ID is valid.\u003c/p\u003e\n\n\u003cp\u003eThe attacks use spoofed OAuth client IDs in HTTP POST requests to Microsoft’s OAuth 2.0 token endpoint through the Resource Owner Password Credentials flow. In these cases, Entra sign-in logs record only the application ID without a corresponding application name, which can cause detections based on surges against a specific application name to miss the activity. Proofpoint said attackers can use the resulting AADSTS error codes to infer whether an account exists and whether a password is correct.\u003c/p\u003e\n\n\u003cp\u003eProofpoint identified two large campaigns that adopted the technique toward the end of December 2025. UNK_pyreq2323 used more than 700,000 spoofed client IDs from AWS infrastructure to target more than 1 million accounts across nearly 4,000 tenants, causing lockouts for roughly 28% of targeted users. UNK_OutFlareAZ used Cloudflare infrastructure to target over 2 million users with 3.7 million randomized spoofed application IDs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["At least two threat actors are using OAuth client ID spoofing in cloud campaigns to enumerate Microsoft Entra ID user accounts and validate stolen credentials without generating a successful sign-in event.","Proofpoint said the technique abuses differences in Entra ID error responses when spoofed OAuth client IDs are supplied to Microsoft’s OAuth 2.0 token endpoint using the Resource Owner Password Credentials flow.","When spoofed client IDs are used, Entra sign-in logs record the application ID without a corresponding application name, which can cause detections based on specific application names to miss the activity.","Proofpoint identified UNK_pyreq2323 as a campaign from January to March 2026 that used more than 700,000 spoofed client IDs from AWS infrastructure to target more than 1 million accounts across nearly 4,000 tenants.","Proofpoint identified UNK_OutFlareAZ as a campaign starting in December 2025 that used Cloudflare infrastructure to target over 2 million users with 3.7 million randomized spoofed application IDs."],"insights":["Detections that rely on spikes against a specific application name may fail because spoofed client IDs leave the application name field blank in Entra sign-in logs.","Conditional Access policies scoped only to commonly targeted applications may not mitigate this activity because spoofed client IDs do not trigger policies tied to a specific application.","The two campaigns used different spoofing patterns, with UNK_pyreq2323 modifying trailing digits of a known application ID and reusing IDs across up to 12 users, while UNK_OutFlareAZ generated a unique client ID per request.","The UNK_pyreq2323 campaign caused lockouts for roughly 28% of targeted users, showing that this stealth-focused technique can still create visible operational disruption."],"referencedReports":[{"title":"OAuth Client ID Spoofing: Why Fake Client IDs Are Gaining Traction in Stealthy Attacks","url":"https://www.proofpoint.com/us/blog/threat-insight/oauth-client-id-spoofing-why-fake-client-ids-are-gaining-traction-stealthy","publisher":"Proofpoint","context":"The article cites Proofpoint’s analysis as the source for the OAuth client ID spoofing technique, observed campaigns, and detection gaps in Microsoft Entra ID telemetry.","category":"","primary":false}],"body":"\u003cp\u003eAt least two threat actors are using a technique called OAuth client ID spoofing in cloud campaigns against Microsoft Entra ID environments. Proofpoint said the activity lets attackers enumerate user accounts and validate stolen credentials without generating a successful sign-in event that would normally alert defenders. The technique creates a blind spot because Entra ID returns different error responses depending on whether a supplied OAuth client ID is valid.\u003c/p\u003e\n\n\u003cp\u003eThe attacks use spoofed OAuth client IDs in HTTP POST requests to Microsoft’s OAuth 2.0 token endpoint through the Resource Owner Password Credentials flow. In these cases, Entra sign-in logs record only the application ID without a corresponding application name, which can cause detections based on surges against a specific application name to miss the activity. Proofpoint said attackers can use the resulting AADSTS error codes to infer whether an account exists and whether a password is correct.\u003c/p\u003e\n\n\u003cp\u003eProofpoint identified two large campaigns that adopted the technique toward the end of December 2025. UNK_pyreq2323 used more than 700,000 spoofed client IDs from AWS infrastructure to target more than 1 million accounts across nearly 4,000 tenants, causing lockouts for roughly 28% of targeted users. UNK_OutFlareAZ used Cloudflare infrastructure to target over 2 million users with 3.7 million randomized spoofed application IDs.\u003c/p\u003e\n"},{"n":1,"title":"SAP warns of critical flaws in NetWeaver and Commerce Cloud","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sap-warns-of-critical-flaws-in-netweaver-and-commerce-cloud/","time":"11:42","priority":"MUST READ","score":92,"tldr":"SAP’s July 2026 security updates fix 16 vulnerabilities, including critical flaws in NetWeaver AS ABAP, SAP Approuter, and SAP Commerce Cloud that could allow data access or modification, denial-of-service, or abuse of default credentials. SAP says it has not seen evidence these newly patched issues are being exploited, but customers should apply the patches promptly.","briefOverview":"\u003cp\u003eSAP addressed 16 vulnerabilities across multiple products in its July 2026 security updates. The fixes include three critical flaws affecting NetWeaver Application Server ABAP, SAP Approuter, and SAP Commerce Cloud. SAP said it has not found evidence that the vulnerabilities patched in this update have been exploited in attacks.\u003c/p\u003e\n\n\u003cp\u003eThe NetWeaver issue, CVE-2026-44747, is a memory corruption flaw caused by an out-of-bounds write weakness in Application Server ABAP. SAP said an authenticated attacker could use logical errors in memory management to cause unauthorized data access, data modification, or system unavailability. The Approuter flaw, CVE-2026-27690, is an HTTP Request Smuggling issue that unauthenticated attackers can exploit with specially crafted HTTP requests to access user responses and trigger denial-of-service attacks.\u003c/p\u003e\n\n\u003cp\u003eThe third critical flaw, CVE-2026-44761, affects SAP Commerce Cloud and stems from default credentials that can let attackers obtain valid access tokens and read or modify data through certain APIs. SAP’s July 2026 advisory also lists fixes for six high-severity flaws, seven medium-severity flaws, and one low-severity vulnerability. The article notes that CISA has added 14 SAP security flaws to its Known Exploited Vulnerabilities catalog since November 2021, including two abused by ransomware gangs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP addressed 16 vulnerabilities across multiple products in its July 2026 security updates, including three critical flaws in NetWeaver, Commerce Cloud, and AppRouter.","CVE-2026-44747 is a critical memory corruption issue in SAP NetWeaver Application Server ABAP caused by an out-of-bounds write weakness, and SAP says it could lead to unauthorized data access, data modification, or system unavailability.","CVE-2026-27690 is a critical HTTP Request Smuggling vulnerability in SAP Approuter that unauthenticated attackers can exploit with specially crafted HTTP requests to access user responses and trigger denial-of-service attacks.","CVE-2026-44761 is a critical SAP Commerce Cloud flaw involving default credentials that can allow attackers to get valid access tokens and read or modify data through certain APIs.","SAP said it has not found evidence that the vulnerabilities patched in the July 2026 updates have been exploited in attacks."],"insights":["The three critical issues affect different parts of SAP’s ecosystem—core enterprise software, cloud app middleware, and e-commerce—so organizations may need to check more than one SAP environment rather than focusing on a single product.","One of the critical flaws, CVE-2026-27690 in SAP Approuter, can be exploited by unauthenticated attackers, making it especially urgent for internet-facing cloud-based applications deployed on SAP Business Technology Platform.","The SAP Commerce Cloud issue, CVE-2026-44761, involves default credentials, which makes credential and configuration review an important part of remediation in addition to applying vendor fixes.","Although SAP has not seen exploitation of the July 2026 flaws, CISA has added 14 SAP flaws to its Known Exploited Vulnerabilities catalog since November 2021, showing that SAP vulnerabilities have repeatedly become real-world attack targets."],"referencedReports":[{"title":"July 2026 Security Patch Day","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/july-2026.html","publisher":"SAP","context":"The article cites SAP's July 2026 advisory as listing the fixed vulnerabilities and their severities.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?f%5B0%5D=vendor_project%3A835","publisher":"CISA","context":"The article references CISA's catalog to note that 14 SAP security flaws have been added since November 2021.","category":"","primary":false}],"body":"\u003cp\u003eSAP addressed 16 vulnerabilities across multiple products in its July 2026 security updates. The fixes include three critical flaws affecting NetWeaver Application Server ABAP, SAP Approuter, and SAP Commerce Cloud. SAP said it has not found evidence that the vulnerabilities patched in this update have been exploited in attacks.\u003c/p\u003e\n\n\u003cp\u003eThe NetWeaver issue, CVE-2026-44747, is a memory corruption flaw caused by an out-of-bounds write weakness in Application Server ABAP. SAP said an authenticated attacker could use logical errors in memory management to cause unauthorized data access, data modification, or system unavailability. The Approuter flaw, CVE-2026-27690, is an HTTP Request Smuggling issue that unauthenticated attackers can exploit with specially crafted HTTP requests to access user responses and trigger denial-of-service attacks.\u003c/p\u003e\n\n\u003cp\u003eThe third critical flaw, CVE-2026-44761, affects SAP Commerce Cloud and stems from default credentials that can let attackers obtain valid access tokens and read or modify data through certain APIs. SAP’s July 2026 advisory also lists fixes for six high-severity flaws, seven medium-severity flaws, and one low-severity vulnerability. The article notes that CISA has added 14 SAP security flaws to its Known Exploited Vulnerabilities catalog since November 2021, including two abused by ransomware gangs.\u003c/p\u003e\n"},{"n":8,"title":"Microsoft releases Windows 10 KB5099539 extended security update","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-windows-10-kb5099539-extended-security-update/","time":"18:49","priority":"MUST READ","score":92,"tldr":"Microsoft released the Windows 10 KB5099539 extended security update with July 2026 Patch Tuesday fixes for 570 vulnerabilities, available to Windows 10 Enterprise LTSC and ESU-enrolled devices. The update also fixes several known issues but may break legacy apps using unregistered third-party TDI transports due to new security hardening.","briefOverview":"\u003cp\u003eMicrosoft has released the Windows 10 KB5099539 extended security update for Windows 10 Enterprise LTSC and devices enrolled in the Windows 10 Extended Security Updates program. The update includes the July 2026 Patch Tuesday security updates for 570 vulnerabilities, along with additional security fixes. Microsoft previously extended its free Windows 10 ESU program for consumers by an additional year, allowing enrolled devices to receive security updates until October 12, 2027.\u003c/p\u003e\n\n\u003cp\u003eAfter installing KB5099539, Windows 10 is updated to build 19045.7548, and Windows 10 Enterprise LTSC 2021 is updated to build 19044.7548. Microsoft is no longer releasing new features for Windows 10, so this update primarily contains security updates and bug fixes. The fixes include issues affecting OLE Automation, File Explorer, the Recycle Bin, input hotkey behavior, Secure Boot, networking, and Remote Desktop security.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft warns that a security hardening change enforcing TDI transport registration requirements may cause applications using unregistered third-party TDI transports to stop working after installation. Users can check whether they are affected by looking in the Windows System event log in Event Viewer for AFD Event ID 16003 entries. Microsoft says there are otherwise no known issues with this update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the Windows 10 KB5099539 extended security update, which includes the July 2026 Patch Tuesday security updates for 570 vulnerabilities and additional security fixes.","Consumers enrolled in Microsoft’s free Windows 10 Extended Security Updates program can receive security updates until October 12, 2027, after Microsoft extended the program by an additional year.","Windows 10 Enterprise LTSC users and devices enrolled in the ESU program can install KB5099539 through Windows Update by manually checking for updates.","After installing KB5099539, Windows 10 is updated to build 19045.7548 and Windows 10 Enterprise LTSC 2021 is updated to build 19044.7548.","Microsoft warns that a security hardening change enforcing TDI transport registration requirements may cause legacy applications using unregistered third-party TDI transports to stop working."],"insights":["Organizations can proactively identify systems affected by the TDI hardening change by checking the Windows System event log for AFD Event ID 16003 entries that mention an unregistered TDI provider.","IT administrators should migrate trusted Remote Desktop publisher thumbprints to SHA-256 or a stronger algorithm because SHA-1 support is retained only for backward compatibility and is planned for future removal.","The update corrects a June 2026 security update compatibility issue in OLE Automation that could cause failures in applications using IDispatch::Invoke with BYREF parameters sharing the same underlying storage.","If certain built-in Windows keyboard shortcuts temporarily stop responding after the update, Microsoft says restarting the affected app will typically resolve the issue."],"referencedReports":[{"title":"July 14, 2026—KB5099539 (OS Builds 19045.7548 and 19044.7548)","url":"https://support.microsoft.com/en-US/servicing/os/windows-10/2026/07/july-14-2026-kb5099539-os-builds-19045-7548-and-19044-7548","publisher":"Microsoft","context":"The article cites Microsoft's KB5099539 support page as the source for the Windows 10 extended security update details and fix list.","category":"","primary":false},{"title":"Third-party TDI transports might stop working after installing Windows security updates released on or after July 14, 2026","url":"https://support.microsoft.com/en-US/servicing/os/windows/docs/2026/07/third-party-tdi-transports-might-stop-working-after-installing-windows-security-updates-released-on-or-after-july-14-2026","publisher":"Microsoft","context":"The article links to Microsoft's guidance for more information about the TDI transport registration hardening change that may affect legacy applications.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft has released the Windows 10 KB5099539 extended security update for Windows 10 Enterprise LTSC and devices enrolled in the Windows 10 Extended Security Updates program. The update includes the July 2026 Patch Tuesday security updates for 570 vulnerabilities, along with additional security fixes. Microsoft previously extended its free Windows 10 ESU program for consumers by an additional year, allowing enrolled devices to receive security updates until October 12, 2027.\u003c/p\u003e\n\n\u003cp\u003eAfter installing KB5099539, Windows 10 is updated to build 19045.7548, and Windows 10 Enterprise LTSC 2021 is updated to build 19044.7548. Microsoft is no longer releasing new features for Windows 10, so this update primarily contains security updates and bug fixes. The fixes include issues affecting OLE Automation, File Explorer, the Recycle Bin, input hotkey behavior, Secure Boot, networking, and Remote Desktop security.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft warns that a security hardening change enforcing TDI transport registration requirements may cause applications using unregistered third-party TDI transports to stop working after installation. Users can check whether they are affected by looking in the Windows System event log in Event Viewer for AFD Event ID 16003 entries. Microsoft says there are otherwise no known issues with this update.\u003c/p\u003e\n"},{"n":9,"title":"Windows 11 KB5101650 \u0026 KB5099414 cumulative updates released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5101650-and-kb5099414-cumulative-updates-released/","time":"17:41","priority":"MUST READ","score":92,"tldr":"Microsoft released mandatory Windows 11 cumulative updates KB5101650 and KB5099414 for versions 25H2/24H2 and 23H2, including July 2026 Patch Tuesday security fixes for 571 vulnerabilities. The updates also add reliability and usability improvements such as faster Bluetooth pairing for AirPods, Point-in-Time restore availability, Widgets changes, File Explorer fixes, and networking, printing, WSL, and accessibility updates.","briefOverview":"\u003cp\u003eMicrosoft released the Windows 11 KB5101650 and KB5099414 cumulative updates for versions 25H2/24H2 and 23H2. The updates are mandatory because they include the July 2026 Patch Tuesday security patches for 571 vulnerabilities discovered in previous months. Users can install the updates through Windows Update or manually from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, Windows 11 25H2 changes to build 26200.8875, Windows 11 24H2 changes to build 26100.8875, and Windows 11 23H2 changes to build 22631.7376. The release is based on 24H2, so Windows 11 25H2 receives the same update and has no exclusive changes. Microsoft says it is not aware of any new issues with this month’s Patch Tuesday release.\u003c/p\u003e\n\n\u003cp\u003eThe updates include Bluetooth-related fixes, including faster and more reliable pairing with AirPods, improved microphone reliability for Beats Studio Pro headphones, and better Bluetooth audio stability. Microsoft is also adding Point-in-Time restore for everyone, with greater control for enterprise customers. Other changes include updates for Widgets, Accessibility, File Explorer, Phone Link call audio routing, networking, printing, WSL, display and graphics, location services, Search, and touchpad input.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the Windows 11 KB5101650 and KB5099414 cumulative updates for versions 25H2/24H2 and 23H2 to fix security vulnerabilities, bugs, and add new features.","The updates are mandatory because they include the July 2026 Patch Tuesday security patches for 571 vulnerabilities discovered in previous months.","After installation, Windows 11 25H2 will be updated to build 26200.8875, Windows 11 24H2 to build 26100.8875, and Windows 11 23H2 to build 22631.7376.","The updates include Bluetooth improvements such as faster AirPods pairing, better microphone reliability for Beats Studio Pro headphones, and improved reliability for Bluetooth audio devices.","Microsoft says it is not aware of any new issues with this month’s Patch Tuesday release."],"insights":["Windows 11 25H2 and 24H2 receive the same July 2026 update because the release is based on 24H2, so there are no exclusive fixes or features for 25H2 in this Patch Tuesday release.","Microsoft is making Point-in-Time restore available to everyone, while enterprise customers will receive greater control over the feature.","New printer installations will use Internet Printing Protocol by default when supported, and Microsoft links this change to its plan to deprecate third-party printer drivers on Windows.","Some anticipated Windows 11 changes, including a movable taskbar and clutter-free Windows Search, are still only in testing and are not included in this release."],"referencedReports":[{"title":"KB5101650","url":"http://support.microsoft.com/en-us/help/5101650","publisher":"Microsoft","context":"The article links Microsoft’s KB5101650 page as the update reference for Windows 11 25H2 and 24H2 build changes and fixes.","category":"","primary":false},{"title":"KB5099414","url":"https://support.microsoft.com/help/5099414","publisher":"Microsoft","context":"The article links Microsoft’s KB5099414 page as the update reference for Windows 11 23H2 build changes and fixes.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released the Windows 11 KB5101650 and KB5099414 cumulative updates for versions 25H2/24H2 and 23H2. The updates are mandatory because they include the July 2026 Patch Tuesday security patches for 571 vulnerabilities discovered in previous months. Users can install the updates through Windows Update or manually from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, Windows 11 25H2 changes to build 26200.8875, Windows 11 24H2 changes to build 26100.8875, and Windows 11 23H2 changes to build 22631.7376. The release is based on 24H2, so Windows 11 25H2 receives the same update and has no exclusive changes. Microsoft says it is not aware of any new issues with this month’s Patch Tuesday release.\u003c/p\u003e\n\n\u003cp\u003eThe updates include Bluetooth-related fixes, including faster and more reliable pairing with AirPods, improved microphone reliability for Beats Studio Pro headphones, and better Bluetooth audio stability. Microsoft is also adding Point-in-Time restore for everyone, with greater control for enterprise customers. Other changes include updates for Widgets, Accessibility, File Explorer, Phone Link call audio routing, networking, printing, WSL, display and graphics, location services, Search, and touchpad input.\u003c/p\u003e\n"},{"n":21,"title":"U.S. Sanctions First VPN Service and Malware Cryptor Seller Over Ransomware Support","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/us-sanctions-first-vpn-service-and.html","time":"08:02","priority":"MUST READ","score":92,"tldr":"The U.S. sanctioned First VPN Service, its Ukrainian administrator, and a Belarusian cryptor seller for helping ransomware and malware operators hide their activity, while the U.K. and E.U. separately sanctioned Russian cyber networks tied to GRU and FSB operations. The actions coincide with new warnings that FSB Center 16 is exploiting poorly configured routers and Cisco vulnerabilities to target critical infrastructure worldwide.","briefOverview":"\u003cp\u003eThe U.S. Treasury Department’s Office of Foreign Assets Control designated First VPN Service, its Ukrainian administrator Dmytro Rashevskyi, and Belarusian national Yegeniy Vladimirovich Silayev for enabling ransomware actors and other cybercriminals. First VPN Service was accused of providing tools to ransomware groups, while Silayev was sanctioned for selling cryptors used to disguise ransomware and other malware as safe programs. First VPN was dismantled in May 2026 through a joint European and North American law enforcement operation after allegedly helping criminal actors hide the origins of ransomware attacks, data theft, scanning, and denial-of-service attacks.\u003c/p\u003e\n\n\u003cp\u003eThe Treasury said several ransomware groups used First VPN to attack U.S. companies and institutions, deploy malware, and manage stolen data. Victims included U.S. businesses, financial services companies, hospitals, and municipal governments. U.S. officials said ransomware groups using services supplied by the sanctioned parties caused billions of dollars in losses to American businesses and critical infrastructure providers. The department also said Rashevskyi used false identities, including “Maksim Sorin” and “Roman Chabanenko,” to buy infrastructure from companies that might otherwise refuse to work with him because of abuse complaints tied to 1VPNS servers.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes U.K. and E.U. sanctions against 24 Russian individuals and entities linked to destructive cyber and hybrid operations, including GRU leadership, FSB Centre 16, and actors behind Lumma Stealer. Separately, the FBI warned that FSB Center 16 actors are exploiting poorly configured and vulnerable networking devices worldwide, especially routers with active SNMP agents accepting common or default community strings. The advisory said the actors use scans involving spoofed IP addresses and object identifiers that instruct devices to copy configurations and transfer them to attacker-controlled or compromised servers. The activity also involves Cisco vulnerabilities CVE-2018-0171 and CVE-2008-4128, with CISA adding CVE-2008-4128 to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Treasury Department’s OFAC designated First VPN Service, its Ukrainian administrator Dmytro Rashevskyi, and Belarusian cryptor seller Yegeniy Vladimirovich Silayev for enabling ransomware actors and other cybercriminals.","First VPN Service was dismantled in May 2026 in a joint European and North American law enforcement operation after allegedly helping criminal actors obscure the origins of ransomware attacks, data theft, scanning, and denial-of-service attacks.","The Treasury said ransomware groups used First VPN infrastructure to attack U.S. businesses, financial services companies, hospitals, and municipal governments, causing billions of dollars in losses to American businesses and critical infrastructure providers.","The U.K. and E.U. sanctioned 24 Russian individuals and entities linked to destructive cyber and hybrid operations, including GRU leadership, FSB Centre 16, and actors behind Lumma Stealer.","The FBI warned that FSB Center 16 cyber actors are exploiting poorly configured and vulnerable networking devices worldwide, including through SNMP scanning and Cisco vulnerabilities CVE-2018-0171 and CVE-2008-4128."],"insights":["First VPN Service’s claim that it kept no user logs and did not cooperate with law enforcement was presented by authorities as part of why it was useful to ransomware groups and other criminal actors.","The Treasury said Dmytro Rashevskyi used false identities, including “Maksim Sorin” and “Roman Chabanenko,” to buy infrastructure from companies that might otherwise have rejected him because of abuse complaints tied to 1VPNS servers.","The FBI advisory highlights that FSB Center 16 actors are not only relying on new flaws but are also exploiting weak configurations such as SNMP agents accepting common or default community strings.","CISA’s addition of CVE-2008-4128 to the Known Exploited Vulnerabilities catalog shows that a very old Cisco vulnerability remains relevant enough in 2026 to require U.S. federal agencies to apply fixes by July 16, 2026.","The sanctions connect criminal services such as Lumma Stealer and First VPN Service with state-linked Russian cyber activity, showing that governments are targeting the support ecosystem around cyber operations rather than only the operators of attacks."],"referencedReports":[{"title":"Advisory on FSB Center 16 exploitation of poorly configured and vulnerable networking devices","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-194a","publisher":"CISA","context":"The article references this advisory as background on Russian FSB Center 16 actors exploiting poorly configured and vulnerable networking devices worldwide.","category":"","primary":false},{"title":"Advisory on FSB Center 16 exploitation of networking devices","url":"https://www.ic3.gov/CSA/2026/260713.pdf","publisher":"FBI","context":"The article says the FBI issued a new advisory about FSB Center 16 actors using scanning and vulnerable routers to access critical infrastructure networks.","category":"","primary":false}],"body":"\u003cp\u003e
