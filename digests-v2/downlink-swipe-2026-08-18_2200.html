<script type="application/json" id="dl-articles">[{"n":1,"title":"Oracle August 2026 Critical Security Patch Update Addresses 925 CVEs","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/oracle-august-2026-critical-security-patch-update-cspu-addresses-925-cves","time":"00:41","priority":"MUST READ","score":92,"tldr":"Oracle’s August 2026 Critical Security Patch Update fixes 925 CVEs with 943 patches, including 154 critical issues. Oracle Fusion Middleware and Oracle Hyperion received the most fixes, making rapid patch prioritization especially important for those environments.","briefOverview":"\u003cp\u003eOracle released its August 2026 Critical Security Patch Update on August 18. The update addresses 925 unique CVEs through 943 security updates across 23 Oracle product families. It includes 154 critical patches across 151 CVEs, with critical issues making up 16.3% of all patches.\u003c/p\u003e\n\n\u003cp\u003eThe August release is much larger than the June 2026 CSPU, which addressed 243 CVEs in 245 patches across 11 product families. It also sits well above the April 2026 quarterly CPU, which contained 481 patches across 241 CVEs, and represents roughly 65% of the July 2026 CPU’s 1,449 patches. The article notes that the expansion to 23 product families further blurs the line between CSPU and CPU in terms of scope.\u003c/p\u003e\n\n\u003cp\u003eOracle Fusion Middleware and Oracle Hyperion each received 262 patches, accounting for 27.8% of the total patches apiece. Oracle Fusion Middleware had 182 vulnerabilities that can be exploited over a network without authentication, while Oracle Hyperion had 107. Patches for all affected products are available in Oracle’s August 2026 advisory, and Tenable plugins to identify the vulnerabilities will appear as they are released.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Oracle released its August 2026 Critical Security Patch Update on August 18, addressing 925 unique CVEs in 943 security updates across 23 Oracle product families.","The update includes 154 critical patches across 151 CVEs, representing 16.3% of all patches.","High severity patches made up the largest share of the update with 556 patches across 541 CVEs, or 59% of all patches.","Oracle Fusion Middleware and Oracle Hyperion each received 262 patches, accounting for 27.8% of the total patches apiece.","Oracle Fusion Middleware had 182 vulnerabilities exploitable over a network without authentication, while Oracle Hyperion had 107 such vulnerabilities."],"insights":["The August 2026 CSPU is unusually large for a between-cycle release, with 943 patches representing roughly 65% of the July 2026 quarterly CPU’s 1,449 patches.","The CSPU’s scope expanded sharply compared with June 2026, rising from 245 patches across 11 product families to 943 patches across 23 product families.","Oracle Fusion Middleware stands out as the most urgent area for remote exposure review because 182 of its 262 patches address issues exploitable over a network without authentication.","Although Oracle Fusion Middleware and Oracle Hyperion received the same number of patches, Fusion Middleware had substantially more remotely exploitable unauthenticated issues, with 182 compared to Hyperion’s 107."],"referencedReports":[{"title":"Oracle Critical Security Patch Update Advisory - August 2026","url":"https://www.oracle.com/security-alerts/cspuaug2026.html","publisher":"Oracle","context":"The article cites Oracle’s August 2026 advisory as the source for patches across affected products.","category":"advisory","primary":true},{"title":"Oracle August 2026 Critical Security Patch Update Risk Matrices","url":"https://www.oracle.com/security-alerts/cspuaug2026verbose.html","publisher":"Oracle","context":"The article links to Oracle’s risk matrices for more detailed information about the August 2026 CSPU.","category":"advisory","primary":false},{"title":"Oracle Advisory to CVE Map","url":"https:
