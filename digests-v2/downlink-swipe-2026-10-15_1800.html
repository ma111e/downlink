<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers exploit Collabora RCE flaw to backdoor Nextcloud servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-collabora-rce-flaw-to-backdoor-nextcloud-servers/","time":"20:25","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting CVE-2026-110447, a critical command-injection flaw in Nextcloud’s optional built-in Collabora CODE Server app, to install PHP webshells and hunt for sensitive data. Administrators should upgrade richdocumentscode to version 26.4.303 or later, or remove the app if unused.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-110447, a critical command-execution flaw in Nextcloud’s optional Collabora Online Built-in CODE Server app, known as richdocumentscode. The issue affects versions before 26.4.303 and lies in the mechanism that starts the bundled Collabora server. Administrators reported attacks beginning around September 10, before the formal advisory and CVE publication on October 14.\u003c/p\u003e\n\n\u003cp\u003eAttackers can send a malicious request to the app’s proxy.php endpoint to run operating-system commands when the built-in CODE server is stopped, such as after a restart, upgrade, or crash. The article says no authentication or user interaction is required, and reported incidents involved PHP webshells used to search for password databases, password-manager artifacts, and cryptocurrency wallets. Collabora recommends upgrading to version 26.4.303 or later or removing the app if it is unnecessary, warning that disabling it alone is insufficient; standalone Collabora servers, Docker and RPM/DEB installations, and Nextcloud All-in-One are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a broader delay between fixes and formal vulnerability notices: Collabora committed a fix on September 9 and released version 26.4.303 on September 11, but the advisory and CVE appeared more than four weeks later. A Second Security study cited by the article found that the median time between public fixes and CVE publication was 39 days in August, up from 5.1 days in January. The researchers also found that public exploit code can emerge within hours of a security fix and before a corresponding CVE is published.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are actively exploiting CVE-2026-110447, a critical command-execution flaw in Nextcloud’s optional Collabora Online Built-in CODE Server app (richdocumentscode).","The flaw affects richdocumentscode versions before 26.4.303 and can be triggered through the app’s proxy.php endpoint when the built-in CODE server is stopped, without authentication or user interaction.","Administrators reported attacks dating back to September 10 in which attackers installed PHP webshells and searched for password databases, password-manager artifacts, and cryptocurrency wallets.","Collabora states that standalone Collabora Online servers, Docker and RPM/DEB installations, and Nextcloud All-in-One deployments are not affected.","Administrators should upgrade richdocumentscode to version 26.4.303 or later or remove the server app if it is not needed, because disabling the app alone is insufficient."],"insights":["Exploitation reportedly began around mid-September, while the advisory and CVE were not published until October 14, leaving administrators without a formal CVE identifier for more than four weeks after a fix was available.","The vulnerable built-in service is exploitable specifically when it is stopped, such as after a restart, upgrade, or crash, making operational downtime a relevant exposure condition.","Removing the affected app is recommended when it is not needed because Collabora warned that merely disabling it does not adequately address the risk.","Second Security found that the median delay between public fixes and CVE publication reached 39 days in August, and noted that public exploit code can appear within hours of a security fix."],"referencedReports":[{"title":"GHSA-g3vx-3m76-fghh","url":"https://github.com/CollaboraOnline/online/security/advisories/GHSA-g3vx-3m76-fghh","publisher":"collabora","context":"Collabora's security bulletin addresses the command-execution flaw affecting the built-in CODE Server app.","category":"advisory","primary":false},{"title":"GHSA-f97p-r72q-64h2","url":"https://github.com/advisories/GHSA-f97p-r72q-64h2","publisher":"github","context":"The article cites GitHub's advisory as part of the formal disclosure for CVE-2026-110447.","category":"advisory","primary":false},{"title":"The Patchless Window","url":"https://thepatchlesswindow.com/","publisher":"second-security","context":"Second Security's study is cited for its analysis of delays between public security fixes and CVE publication, as well as the timing of public exploit code.","category":"research","primary":false}],"body":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-110447, a critical command-execution flaw in Nextcloud’s optional Collabora Online Built-in CODE Server app, known as richdocumentscode. The issue affects versions before 26.4.303 and lies in the mechanism that starts the bundled Collabora server. Administrators reported attacks beginning around September 10, before the formal advisory and CVE publication on October 14.\u003c/p\u003e\n\n\u003cp\u003eAttackers can send a malicious request to the app’s proxy.php endpoint to run operating-system commands when the built-in CODE server is stopped, such as after a restart, upgrade, or crash. The article says no authentication or user interaction is required, and reported incidents involved PHP webshells used to search for password databases, password-manager artifacts, and cryptocurrency wallets. Collabora recommends upgrading to version 26.4.303 or later or removing the app if it is unnecessary, warning that disabling it alone is insufficient; standalone Collabora servers, Docker and RPM/DEB installations, and Nextcloud All-in-One are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights a broader delay between fixes and formal vulnerability notices: Collabora committed a fix on September 9 and released version 26.4.303 on September 11, but the advisory and CVE appeared more than four weeks later. A Second Security study cited by the article found that the median time between public fixes and CVE publication was 39 days in August, up from 5.1 days in January. The researchers also found that public exploit code can emerge within hours of a security fix and before a corresponding CVE is published.\u003c/p\u003e\n"},{"n":6,"title":"Zero-click spyware infecting devices through online ads, researchers say","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/spyware-citizen-lab-advertising","time":"19:00","priority":"SHOULD READ","score":88,"tldr":"Researchers found that Israeli ad-tech firm Discover-Tech allegedly helped spyware vendor Candiru use targeted online ads to fingerprint, track, and potentially zero-click infect devices, including those of Al Jazeera journalists and users on sensitive government networks. The findings show how the digital advertising supply chain can be weaponized for large-scale surveillance and spyware delivery.","briefOverview":"\u003cp\u003eCitizen Lab and Confiant reported that Israel-based advertising firm Discover-Tech allegedly helped deliver zero-click spyware through targeted online ads. Their investigations found that at least 45 Al Jazeera journalists’ devices were infected, while malicious ads were also shown on networks associated with NATO, the U.S. Department of Defense, Estonia’s Information System Authority, the International Atomic Energy Agency, and the International Criminal Court. The reports did not establish how many devices on those government and international organization networks were compromised.\u003c/p\u003e\n\n\u003cp\u003eDiscover-Tech’s Controlium platform allegedly allowed spyware clients, including Candiru, to identify devices and execute malicious JavaScript when a targeted person loaded a page displaying one of its ads, without requiring a click. Citizen Lab examined four billion ad-placement records and found the ads appeared over four months in Android and iOS applications and on nearly 200,000 websites. The researchers said the system could support surveillance capabilities such as recording calls, activating microphones, and collecting messages and emails, illustrating how advertising infrastructure can be used for large-scale tracking, deanonymization, and device infection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citizen Lab and Confiant reported that Discover-Tech allegedly used targeted digital ads to infect devices used by at least 45 Al Jazeera journalists.","The researchers said Discover-Tech’s Controlium platform could identify devices and automatically execute malicious JavaScript when a targeted person viewed a page carrying one of its ads, without requiring a click.","Confiant found evidence that the ads were displayed on networks associated with the U.S. Department of Defense, Estonia’s Information System Authority, the International Atomic Energy Agency, and the International Criminal Court.","Citizen Lab said Candiru allegedly hired Discover-Tech to deliver ads for surveillance and spyware operations, while another actor called Dark Cartographer used Discover-Tech software to link device advertising identifiers with phone numbers.","Citizen Lab examined four billion Discover-Tech ad-placement records and found that the ads appeared over four months in Android and iOS apps and on nearly 200,000 unique websites."],"insights":["The alleged ad-based delivery model let spyware operators target devices without relying on social engineering or directly exposing malicious code to the companies serving and displaying the ads.","Discover-Tech’s infrastructure allegedly acted as a bridge between mainstream advertising platforms and mercenary spyware companies, enabling access to ad platforms operated by Google and Yandex.","Researchers found that the ads were not limited to individual targets: they were rendered on national-security-sensitive networks, including NATO and networks associated with several government and international bodies.","The same company’s software was allegedly used for both device infection and mass deanonymization, including linking mobile advertising identifiers to phone numbers through mobile-carrier weaknesses."],"referencedReports":[{"title":"How Discover-Tech Turned Targeted Ads into a Pipeline for Spyware","url":"https://citizenlab.ca/research/how-discover-tech-turned-targeted-ads-into-a-pipeline-for-spyware/","publisher":"citizen-lab","context":"The article cites Citizen Lab's investigation documenting Discover-Tech's alleged role in delivering spyware through targeted advertisements.","category":"research","primary":true},{"title":"AdInt: Weaponized Ad Tech for Zero-Click Spyware and Mass Identity Vacuuming","url":"https://blog.confiant.com/p/adint-weaponized-ad-tech-for-zero-click-spyware-and-mass-identity-vacuuming","publisher":"confiant","context":"The article cites Confiant's parallel technical analysis of Discover-Tech advertising data and malicious ad activity.","category":"research","primary":true}],"body":"\u003cp\u003eCitizen Lab and Confiant reported that Israel-based advertising firm Discover-Tech allegedly helped deliver zero-click spyware through targeted online ads. Their investigations found that at least 45 Al Jazeera journalists’ devices were infected, while malicious ads were also shown on networks associated with NATO, the U.S. Department of Defense, Estonia’s Information System Authority, the International Atomic Energy Agency, and the International Criminal Court. The reports did not establish how many devices on those government and international organization networks were compromised.\u003c/p\u003e\n\n\u003cp\u003eDiscover-Tech’s Controlium platform allegedly allowed spyware clients, including Candiru, to identify devices and execute malicious JavaScript when a targeted person loaded a page displaying one of its ads, without requiring a click. Citizen Lab examined four billion ad-placement records and found the ads appeared over four months in Android and iOS applications and on nearly 200,000 websites. The researchers said the system could support surveillance capabilities such as recording calls, activating microphones, and collecting messages and emails, illustrating how advertising infrastructure can be used for large-scale tracking, deanonymization, and device infection.\u003c/p\u003e\n"},{"n":8,"title":"Critical PwnEscape Linux Kernel Vulnerability Lets Guest VMs Read Host Memory","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/critical-pwnescape-linux-kernel.html","time":"20:24","priority":"SHOULD READ","score":88,"tldr":"PwnEscape (CVE-2026-99999) is a critical Linux kernel networking flaw that can let code inside a guest VM leak host memory and potentially crash or escape the host. Cloud operators should patch and reboot host kernels to vendor-fixed builds; updating guest kernels alone does not address the issue.","briefOverview":"\u003cp\u003eA critical Linux kernel networking flaw, nicknamed PwnEscape and tracked as CVE-2026-99999, can allow code running inside a virtual machine to read memory from the host computer. Researcher Paulos Yibelo of pwn.ai demonstrated the memory leak against Vercel’s production cloud sandboxes, and Vercel confirmed the result. The flaw requires an attacker to already be able to run code inside a guest virtual machine, and the article says there is no reported real-world exploitation.\u003c/p\u003e\n\n\u003cp\u003eAccording to the research, each specially crafted outgoing packet could return about 32 bytes of host memory, and repeated packets could continue the leak. On laboratory systems configured to match Vercel’s environment, the same flaw could also crash a host or enable administrator-level control, though the researcher did not claim production code execution at any vendor. Linux maintainers have backported a fix to supported stable branches, and operators are advised to update and reboot host kernels because updating guest kernels alone does not address the issue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PwnEscape, tracked as CVE-2026-99999, is a critical Linux kernel networking flaw that can allow code inside a virtual machine to read memory from its host computer.","A researcher demonstrated host-memory leakage against Vercel’s production sandboxes, with each outgoing guest packet able to return about 32 bytes of host memory.","On lab systems configured to match Vercel’s environment, specially crafted packets could crash a host or enable administrator-level control, although the researcher did not claim production code execution.","The flaw requires an attacker to already run code inside a guest virtual machine and has no reported real-world exploitation.","Linux maintainers backported a fix to supported stable branches, and operators must update and reboot host kernels because updating only guest kernels does not fix the issue."],"insights":["The production demonstration was limited to memory leakage; the host crash and administrator-control results were observed only in laboratory systems configured to resemble Vercel’s environment.","The published kernel change is described by its author as defense in depth rather than a complete solution, with fuller validation of packets when they enter the kernel still needing work.","Two specially crafted packets were sufficient to crash a host in the researcher’s lab, potentially taking down every sandbox running on that host.","Checking only the kernel version reported by uname may be insufficient because Linux distributions can ship the fix in their own builds without changing the upstream version number.","The researchers said they found the flaw in three days using an AI-assisted research system for under $700 in API-token costs, while humans directed and validated the findings."],"referencedReports":[{"title":"PwnEscape","url":"https://pwn.ai/blog/pwnescape","publisher":"pwn.ai","context":"The article cites this technical write-up for the researcher’s explanation of how crafted packets could leak host memory, crash a host, and enable code execution in lab testing.","category":"research","primary":true},{"title":"Findings from the $1 Million Vercel Sandbox Challenge","url":"https://vercel.com/blog/findings-from-the-1-million-dollar-vercel-sandbox-challenge","publisher":"vercel","context":"The article cites Vercel’s report to confirm that the host-memory leak was demonstrated against its production sandbox environment.","category":"research","primary":true}],"body":"\u003cp\u003eA critical Linux kernel networking flaw, nicknamed PwnEscape and tracked as CVE-2026-99999, can allow code running inside a virtual machine to read memory from the host computer. Researcher Paulos Yibelo of pwn.ai demonstrated the memory leak against Vercel’s production cloud sandboxes, and Vercel confirmed the result. The flaw requires an attacker to already be able to run code inside a guest virtual machine, and the article says there is no reported real-world exploitation.\u003c/p\u003e\n\n\u003cp\u003eAccording to the research, each specially crafted outgoing packet could return about 32 bytes of host memory, and repeated packets could continue the leak. On laboratory systems configured to match Vercel’s environment, the same flaw could also crash a host or enable administrator-level control, though the researcher did not claim production code execution at any vendor. Linux maintainers have backported a fix to supported stable branches, and operators are advised to update and reboot host kernels because updating guest kernels alone does not address the issue.\u003c/p\u003e\n"},{"n":5,"title":"Federal bankruptcy courts dealing with outages after contractor cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/federal-bankruptcy-courts-dealing-with-cyberattack-outage","time":"20:46","priority":"SHOULD READ","score":84,"tldr":"A cyberattack on BAE Systems disrupted the Bankruptcy Noticing Center, taking bankruptcy-notice production and related services offline for federal bankruptcy courts across the United States. Officials are coordinating restoration efforts, while the incident's cause and any potential data theft remain undisclosed.","briefOverview":"\u003cp\u003eA cyberattack on BAE Systems disrupted the Bankruptcy Noticing Center (BNC), the platform that produces and transmits bankruptcy notices for all U.S. federal bankruptcy courts. The Administrative Office of the U.S. Courts said access to BNC systems and related websites is unavailable. The outage has also halted the production of bankruptcy notices.\u003c/p\u003e\n\n\u003cp\u003eAffected services include bnc.uscourts.gov, bankruptcynotices.uscourts.gov, notices.uscourts.gov, and the National Creditor Registration Service. The Administrative Office of the U.S. Courts is coordinating with BAE Systems, which said it is investigating the incident and working to restore operations. Officials have not disclosed the nature of the incident or whether data was stolen, while BAE said the security incident is isolated to the BNC system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A cyberattack on BAE Systems disrupted the Bankruptcy Noticing Center, which produces and transmits bankruptcy notices for all U.S. federal bankruptcy courts.","Access to BNC systems and websites, including bnc.uscourts.gov, bankruptcynotices.uscourts.gov, notices.uscourts.gov, and the National Creditor Registration Service, is unavailable.","The disruption has halted production of bankruptcy notices.","The Administrative Office of the U.S. Courts is coordinating with BAE Systems, which said it is investigating the incident and working to restore operations.","Officials have not disclosed the nature of the incident or whether any data was stolen."],"insights":["A security incident at a single contractor, BAE Systems, disrupted bankruptcy-notice operations for every federal bankruptcy court in the United States, illustrating the nationwide operational dependence on the BNC service.","The outage affects both notice production and multiple public-facing or related services, including the National Creditor Registration Service, rather than only one court website.","The incident follows recent court-system security problems, including a breach of Arizona’s state court system and earlier attacks on the federal courts’ case-filing system.","BAE Systems said the incident is isolated to the BNC system, while the Administrative Office of the U.S. Courts has not disclosed whether information was stolen."],"referencedReports":[],"body":"\u003cp\u003eA cyberattack on BAE Systems disrupted the Bankruptcy Noticing Center (BNC), the platform that produces and transmits bankruptcy notices for all U.S. federal bankruptcy courts. The Administrative Office of the U.S. Courts said access to BNC systems and related websites is unavailable. The outage has also halted the production of bankruptcy notices.\u003c/p\u003e\n\n\u003cp\u003eAffected services include bnc.uscourts.gov, bankruptcynotices.uscourts.gov, notices.uscourts.gov, and the National Creditor Registration Service. The Administrative Office of the U.S. Courts is coordinating with BAE Systems, which said it is investigating the incident and working to restore operations. Officials have not disclosed the nature of the incident or whether data was stolen, while BAE said the security incident is isolated to the BNC system.\u003c/p\u003e\n"},{"n":3,"title":"Hackers hijack D-Link, Ubiquiti devices to resell your stolen bandwidth","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-hijack-d-link-ubiquiti-devices-to-resell-your-stolen-bandwidth/","time":"18:20","priority":"SHOULD READ","score":82,"tldr":"Attackers are exploiting known flaws in D-Link, Ubiquiti, SAP, and other internet-facing devices to covertly install Pawns.app and resell victims’ bandwidth through a residential proxy network. Organizations should patch exposed systems, restrict access, and check for unauthorized software or SSH keys.","briefOverview":"\u003cp\u003eGreyNoise identified a proxyjacking campaign that compromised at least 143 devices across 34 countries. The attackers installed Pawns.app, a legitimate bandwidth-sharing application, without device owners’ consent. By using multiple compromised systems, the operator likely increased the payouts earned by routing other users’ traffic through victims’ internet connections.\u003c/p\u003e\n\n\u003cp\u003eThe campaign exploited CVE-2024-3272 and CVE-2024-3273 in D-Link ShareCenter NAS devices, CVE-2021-44228 in Ubiquiti UniFi Video NVR, and CVE-2025-31324 in SAP NetWeaver Visual Composer. Hikvision and Dahua DVR/NVR devices were also targeted, and the attackers sometimes configured SSH key authentication as backup access. Traffic through residential proxy networks can lead to IP-address blocks or allegations of involvement in illegal activity, so the article advises keeping internet-facing devices updated, using strong credentials, securing configurations, and restricting network access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GreyNoise identified a proxyjacking campaign affecting at least 143 compromised devices across 34 countries.","The attackers installed Pawns.app, a legitimate bandwidth-sharing application, on devices without their owners’ consent to monetize victims’ internet connections.","The campaign exploited CVE-2024-3272 and CVE-2024-3273 in D-Link ShareCenter NAS devices, CVE-2021-44228 in Ubiquiti UniFi Video NVR, and CVE-2025-31324 in SAP NetWeaver Visual Composer.","The attackers also targeted Hikvision and Dahua DVR/NVR devices and in some cases configured SSH key authentication for backup access.","Traffic routed through residential proxy networks can lead to IP-address blocks or allegations that participating users were involved in illegal activity."],"insights":["The campaign abused a legitimate bandwidth-sharing app rather than relying on a purpose-built malicious program, showing that legitimate services can be used without device owners’ consent.","The attackers sometimes configured SSH key authentication as a backup access method, meaning removing the visible unwanted software alone may not eliminate their access.","Even legitimate residential proxy networks can expose affected users to blocked internet addresses or allegations of illegal activity when third-party traffic passes through their connections."],"referencedReports":[{"title":"Proxyjacking Edge Devices for Residential Proxies","url":"https://www.greynoise.io/blog/proxyjacking-edge-devices-residential-proxies","publisher":"greynoise","context":"GreyNoise's technical analysis is the source that identified and described the proxyjacking campaign.","category":"research","primary":true}],"body":"\u003cp\u003eGreyNoise identified a proxyjacking campaign that compromised at least 143 devices across 34 countries. The attackers installed Pawns.app, a legitimate bandwidth-sharing application, without device owners’ consent. By using multiple compromised systems, the operator likely increased the payouts earned by routing other users’ traffic through victims’ internet connections.\u003c/p\u003e\n\n\u003cp\u003eThe campaign exploited CVE-2024-3272 and CVE-2024-3273 in D-Link ShareCenter NAS devices, CVE-2021-44228 in Ubiquiti UniFi Video NVR, and CVE-2025-31324 in SAP NetWeaver Visual Composer. Hikvision and Dahua DVR/NVR devices were also targeted, and the attackers sometimes configured SSH key authentication as backup access. Traffic through residential proxy networks can lead to IP-address blocks or allegations of involvement in illegal activity, so the article advises keeping internet-facing devices updated, using strong credentials, securing configurations, and restricting network access.\u003c/p\u003e\n"},{"n":2,"title":"Android gets AI defenses against messaging scams, fake calls","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/android-gets-ai-defenses-against-messaging-scams-fake-calls/","time":"19:48","priority":"MAY READ","score":72,"tldr":"Google is rolling out new Android scam protections that use Gemini-powered cloud and on-device analysis to detect fraudulent Messages conversations, suspicious links, fake bank calls, and call-forwarding abuse. The cloud-based Messages analysis is opt-in and currently available only on eligible devices.","briefOverview":"\u003cp\u003eGoogle announced new AI-powered Android protections against scam messages, fake calls, suspicious links, and call-forwarding abuse, rolling out to eligible devices. The company said mobile scams increasingly use spoofed numbers, fake bank alerts, and AI voice cloning. Google’s existing Phone and Messages scam detection flags more than 5 million suspected scam calls and texts each month.\u003c/p\u003e\n\n\u003cp\u003eGoogle Messages will add cloud-based Gemini analysis for complex conversations with unknown senders within its encrypted Private AI Compute environment, though the feature is disabled by default. It also uses on-device Gemini Nano checks for unfamiliar links using real-time web signals and provides clearer warnings before users open links from unsaved numbers. Android is also expanding notification scam detection, masking login and payment screens during live screen sharing in Chrome and Android WebView, and blocking apps from silently enabling call forwarding.\u003c/p\u003e\n\n\u003cp\u003eGoogle is expanding its verified bank calls system, which checks whether an incoming call originated from a real bank call center and automatically ends calls that fail verification. The company said it has blocked more than 3 million fraudulent calls for Banco do Brasil and Itaú Unibanco since June, and that Revolut and other financial institutions are supported. Google advised Android users to update their devices and apps and independently verify identities before acting on requests involving accounts or sensitive information.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google announced AI-powered Android protections against scam messages, suspicious links, call-forwarding abuse, and spoofed bank calls for eligible devices.","Google Messages will use cloud-based Gemini analysis for complex conversations with unknown senders inside the encrypted Private AI Compute environment, and this feature is disabled by default.","Google Messages also adds on-device Gemini Nano checks for unfamiliar links using real-time web signals and clearer warnings for links sent by unsaved numbers.","Android will prevent apps from silently enabling call forwarding in the background and will warn users before manually entered call-forwarding codes take effect.","Google said its verified bank-calls system has blocked more than 3 million fraudulent calls for Banco do Brasil and Itaú Unibanco since June."],"insights":["Google’s new cloud-based conversation analysis is limited to messages from unknown senders and is disabled by default, giving users a choice over whether to enable it.","Google says its existing Phone and Messages scam detection already flags more than 5 million suspected scam calls and texts each month, indicating the scale of mobile scam activity it is addressing.","The verified bank-calls system automatically ends calls when it cannot confirm that a real bank call center initiated them.","Google reported that the verified bank-calls system blocked more than 3 million fraudulent calls involving Banco do Brasil and Itaú Unibanco since June.","Android users are advised to update their devices and apps and independently confirm a caller’s or sender’s identity before responding to account-related or sensitive-information requests."],"referencedReports":[],"body":"\u003cp\u003eGoogle announced new AI-powered Android protections against scam messages, fake calls, suspicious links, and call-forwarding abuse, rolling out to eligible devices. The company said mobile scams increasingly use spoofed numbers, fake bank alerts, and AI voice cloning. Google’s existing Phone and Messages scam detection flags more than 5 million suspected scam calls and texts each month.\u003c/p\u003e\n\n\u003cp\u003eGoogle Messages will add cloud-based Gemini analysis for complex conversations with unknown senders within its encrypted Private AI Compute environment, though the feature is disabled by default. It also uses on-device Gemini Nano checks for unfamiliar links using real-time web signals and provides clearer warnings before users open links from unsaved numbers. Android is also expanding notification scam detection, masking login and payment screens during live screen sharing in Chrome and Android WebView, and blocking apps from silently enabling call forwarding.\u003c/p\u003e\n\n\u003cp\u003eGoogle is expanding its verified bank calls system, which checks whether an incoming call originated from a real bank call center and automatically ends calls that fail verification. The company said it has blocked more than 3 million fraudulent calls for Banco do Brasil and Itaú Unibanco since June, and that Revolut and other financial institutions are supported. Google advised Android users to update their devices and apps and independently verify identities before acting on requests involving accounts or sensitive information.\u003c/p\u003e\n"},{"n":4,"title":"Varonis is joining Proofpoint","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/proofpoint","time":"20:24","priority":"MAY READ","score":72,"tldr":"Varonis announced a definitive agreement to be acquired by Proofpoint, combining Proofpoint’s human and agent security capabilities with Varonis’s data security platform. The companies will operate independently until the transaction is expected to close in the first half of 2027.","briefOverview":"\u003cp\u003eVaronis announced a definitive agreement to be acquired by Proofpoint, which it describes as a leader in human and agent security. The companies expect the transaction to close in the first half of 2027, subject to stockholder approval, regulatory approvals, financing arrangements, and other conditions. Until closing, Varonis and Proofpoint will operate as separate and independent companies.\u003c/p\u003e\n\n\u003cp\u003eVaronis says the combination brings together Proofpoint’s understanding of how threats begin through people and AI agents with Varonis’s ability to identify sensitive data, access permissions, and data use across cloud, SaaS, database, and on-premises environments. The companies position the deal as a way to better protect data, AI environments, and collaboration tools while reducing the number of vendors customers need to manage. Varonis states that customers will see no immediate changes to their account teams, account numbers, support channels, existing contracts, or current solutions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis announced a definitive agreement to be acquired by Proofpoint, a company focused on human and agent security.","Varonis and Proofpoint are expected to continue operating as separate, independent companies until the transaction closes in the first half of 2027.","Varonis stated that customers’ account teams, account numbers, support channels, existing contracts, and current solutions will not change immediately.","The companies plan to combine Proofpoint’s capabilities related to how attacks begin with Varonis’s capabilities for identifying sensitive data, access, and use across cloud, SaaS, databases, and on-premises environments.","The proposed acquisition remains subject to conditions including Varonis stockholder approval, regulatory approvals, and financing arrangements."],"insights":["The proposed combination is framed around securing both how threats begin—through people and AI agents—and the sensitive information those threats seek to access.","Varonis says AI agents can reach sensitive data faster than employees, making control over data access a central part of its stated security strategy.","The companies present the deal as a way for customers to consolidate vendors while gaining broader protection for data, AI environments, and collaboration tools.","Varonis states that, after the transaction, the combined company could be positioned for a future return to the public markets."],"referencedReports":[],"body":"\u003cp\u003eVaronis announced a definitive agreement to be acquired by Proofpoint, which it describes as a leader in human and agent security. The companies expect the transaction to close in the first half of 2027, subject to stockholder approval, regulatory approvals, financing arrangements, and other conditions. Until closing, Varonis and Proofpoint will operate as separate and independent companies.\u003c/p\u003e\n\n\u003cp\u003eVaronis says the combination brings together Proofpoint’s understanding of how threats begin through people and AI agents with Varonis’s ability to identify sensitive data, access permissions, and data use across cloud, SaaS, database, and on-premises environments. The companies position the deal as a way to better protect data, AI environments, and collaboration tools while reducing the number of vendors customers need to manage. Varonis states that customers will see no immediate changes to their account teams, account numbers, support channels, existing contracts, or current solutions.\u003c/p\u003e\n"},{"n":9,"title":"Frontier AI Impacts: Lessons from Project Glasswing","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/frontier-ai-impacts-lessons-from-project-glasswing/","time":"18:55","priority":"MAY READ","score":52,"tldr":"Booz Allen Hamilton’s Project Glasswing argues that frontier-AI risk now extends beyond model outputs to full AI systems capable of executing cyberattack kill chains, with one in 18 tested models reportedly able to complete one today.","briefOverview":"\u003cp\u003eHealth-ISAC published a resource titled “Frontier AI Impacts: Lessons from Project Glasswing,” dated October 15, 2026. The resource highlights work by Vellox Labs and Booz Allen Hamilton concerning frontier AI risks. It states that one in 18 models can complete the cyberattack kill chain today.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, Vellox Labs tested what models can write and what they can attack. Booz Allen Hamilton’s frontier research examined what is required to act on the resulting output. The article says these efforts shift the risk boundary from the individual model to the complete AI system, and links to a Booz Allen Hamilton presentation for further detail.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that one in 18 models can complete the cyberattack kill chain today.","Vellox Labs tested both what AI models can write and what they can attack.","Booz Allen Hamilton’s frontier research examined what it takes to act on AI-generated results.","The article says these efforts move the risk boundary from the model itself to the full AI system.","Health-ISAC provides a Booz Allen Hamilton presentation on Project Glasswing as a Community Services Champion resource."],"insights":["The article’s reported one-in-18 figure indicates that complete cyberattack execution capability is presented as a current, measurable possibility rather than a purely future concern.","The article distinguishes between evaluating what AI models produce and evaluating whether those outputs can be acted upon, emphasizing that risk assessment must consider the complete AI system rather than the model alone."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published a resource titled “Frontier AI Impacts: Lessons from Project Glasswing,” dated October 15, 2026. The resource highlights work by Vellox Labs and Booz Allen Hamilton concerning frontier AI risks. It states that one in 18 models can complete the cyberattack kill chain today.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, Vellox Labs tested what models can write and what they can attack. Booz Allen Hamilton’s frontier research examined what is required to act on the resulting output. The article says these efforts shift the risk boundary from the individual model to the complete AI system, and links to a Booz Allen Hamilton presentation for further detail.\u003c/p\u003e\n"},{"n":12,"title":"Op-Ed: When a hospital can’t patch a machine, what’s the backup plan?","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/op-ed-when-a-hospital-cant-patch-a-machine-whats-the-backup-plan/","time":"20:00","priority":"MAY READ","score":48,"tldr":"Hospitals often cannot promptly patch vulnerable medical devices because manufacturers must validate updates and devices require downtime, making documented risk management and recovery planning essential. The growing volume of healthcare ransomware underscores the potential patient-care, privacy, and operational consequences of unmanaged device vulnerabilities.","briefOverview":"\u003cp\u003eHospitals can face delays in patching medical devices with known security weaknesses because device manufacturers must first verify that an update is safe for patients. Hospitals must also find a suitable time to take the equipment out of service to apply the update. The article argues that these constraints leave critical hospital infrastructure exposed for longer than typical office computers or servers.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC’s \u003cem\u003eMedTech Security Baselines\u003c/em\u003e paper says that hospitals should maintain a documented risk-management plan while a vulnerable device remains in use, including named responsibility owners, timelines, and a register of remaining risk. The global health sector experienced 575 ransomware attacks in 2025, up from 476 a year earlier. A compromised device could expose sensitive patient and health information, provide access to the hospital network, disrupt clinical systems and patient care, and enable fraud or extortion, making vulnerability management, incident response, and recovery planning important.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hospitals often cannot promptly patch vulnerable medical devices because manufacturers must first validate changes for patient safety and the device must be taken out of service for the update.","Health-ISAC’s MedTech Security Baselines says hospitals should maintain a documented risk-management plan, named owners and timelines, and a register of remaining risk while a device with a known weakness remains in use.","The global health sector experienced 575 ransomware attacks in 2025, compared with 476 the prior year.","A compromised medical device can expose sensitive patient information, provide access to a hospital network, disrupt clinical systems needed for care, and enable fraud or extortion.","The article emphasizes the need for a vulnerability-management program as well as incident-response and recovery plans."],"insights":["Medical-device patching is not solely an IT decision: hospitals may depend on manufacturer safety verification and a clinical window to remove equipment from service before an update can be applied.","When a known device weakness cannot yet be fixed, the article identifies accountability as a concrete control: hospitals should document the residual risk, assign named owners, and set timelines.","The consequences of a compromised device can extend beyond that device, potentially giving criminals a route into the wider hospital network and disrupting systems used to deliver patient care.","The increase from 476 healthcare ransomware attacks in 2024 to 575 in 2025 reinforces the article’s argument that hospitals need both vulnerability management and plans to respond to and recover from incidents."],"referencedReports":[{"title":"MedTech Security Baselines","url":"https://health-isac.org/medtech-security-baselines/","publisher":"health-isac","context":"The article cites this paper for its recommendation that hospitals document residual device risk, assign owners and timelines, and maintain a risk register when known weaknesses remain unpatched.","category":"research","primary":true}],"body":"\u003cp\u003eHospitals can face delays in patching medical devices with known security weaknesses because device manufacturers must first verify that an update is safe for patients. Hospitals must also find a suitable time to take the equipment out of service to apply the update. The article argues that these constraints leave critical hospital infrastructure exposed for longer than typical office computers or servers.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC’s \u003cem\u003eMedTech Security Baselines\u003c/em\u003e paper says that hospitals should maintain a documented risk-management plan while a vulnerable device remains in use, including named responsibility owners, timelines, and a register of remaining risk. The global health sector experienced 575 ransomware attacks in 2025, up from 476 a year earlier. A compromised device could expose sensitive patient and health information, provide access to the hospital network, disrupt clinical systems and patient care, and enable fraud or extortion, making vulnerability management, incident response, and recovery planning important.\u003c/p\u003e\n"},{"n":11,"title":"From Digital to Physical: The AI Threat Is Here","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/from-digital-to-physical-the-ai-threat-is-here/","time":"19:37","priority":"MAY READ","score":45,"tldr":"A Booz Allen Hamilton white paper warns that autonomous frontier AI could rapidly turn digital access to operational technology into real-world physical consequences for critical infrastructure.","briefOverview":"\u003cp\u003eHealth-ISAC published a resource titled “From Digital to Physical: The AI Threat Is Here” on October 15, 2026. The resource highlights a Booz Allen Hamilton white paper on frontier AI models in operational-technology environments. Booz Allen Hamilton is identified as a Health-ISAC Community Services Champion.\u003c/p\u003e\n\n\u003cp\u003eThe article states that autonomous AI is changing the threat landscape for critical infrastructure. It says AI can compress the path from digital access to physical consequence. The article frames the central question as how much control AI can gain over an industrial process and how quickly it can do so.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that autonomous AI is changing the threat landscape for critical infrastructure by compressing the path from digital access to physical consequence.","It says the key question is no longer whether AI can affect an industrial process, but how much control it can gain and how quickly.","The article links to a Booz Allen Hamilton white paper on frontier AI models in operational-technology environments.","Booz Allen Hamilton is identified as a Health-ISAC Community Services Champion."],"insights":["The article frames autonomous AI as reducing the distance between a compromise of a digital system and a physical outcome, rather than treating those as separate risks.","It shifts the assessment of AI risk from whether industrial processes can be affected to the degree and speed of control an AI system could obtain.","The resource specifically connects frontier AI models with operational-technology environments, highlighting critical infrastructure as the context for the discussion."],"referencedReports":[{"title":"Frontier AI Models in OT Environments","url":"https://health-isac.org/wp-content/uploads/Frontier_AI_Models_in_OT_Environments-1.pdf","publisher":"booz-allen-hamilton","context":"The article directs readers to a Booz Allen Hamilton white paper about the effects of frontier AI models in operational-technology environments.","category":"research","primary":true}],"body":"\u003cp\u003eHealth-ISAC published a resource titled “From Digital to Physical: The AI Threat Is Here” on October 15, 2026. The resource highlights a Booz Allen Hamilton white paper on frontier AI models in operational-technology environments. Booz Allen Hamilton is identified as a Health-ISAC Community Services Champion.\u003c/p\u003e\n\n\u003cp\u003eThe article states that autonomous AI is changing the threat landscape for critical infrastructure. It says AI can compress the path from digital access to physical consequence. The article frames the central question as how much control AI can gain over an industrial process and how quickly it can do so.\u003c/p\u003e\n"},{"n":7,"title":"ThreatsDay: Adobe RCE, DNS Wallet Theft, NVIDIA Container Escape, Self-Healing Backdoor + 23 More","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/threatsday-adobe-rce-dns-wallet-theft.html","time":"18:49","priority":"MAY READ","score":40,"tldr":"This week’s roundup highlights active exploitation, critical remote-code-execution flaws, and increasingly capable malware targeting credentials, cloud services, browsers, AI tools, and containers. The key takeaway is that patching alone is insufficient: organizations should also investigate existing access, rotate compromised credentials, and hunt for persistence.","briefOverview":"\u003cp\u003eThis ThreatsDay roundup covers active exploitation, newly disclosed software flaws, malware campaigns, and defensive updates affecting enterprise systems, cloud services, browsers, mobile devices, cryptocurrency users, and AI development tools. Qilin and Settra ransomware groups are actively exploiting CVE-2026-0257, an authentication-bypass flaw in PAN-OS GlobalProtect and Prisma Access, where malicious activity can resemble legitimate VPN-based remote work. The article also reports active exploitation of a SiteGuard Server Edition command-injection flaw that can run commands with root or SYSTEM privileges. Several other critical issues could enable unauthenticated remote code execution, including flaws in Adobe Experience Manager, Samsung QA-Board, Channel Software WebAlliance eCommerce, and MyReport Updater.\u003c/p\u003e\n\n\u003cp\u003eThe malware coverage includes the Noir cryptocurrency wallet drainer, which uses DNS TXT records and public DNS-over-HTTPS services to locate its active backend, and can steal funds after users grant wallet permissions rather than providing seed phrases or passwords. Other threats include CikaBika Bot, KGB RAT, BotHelper RAT, XWorm, Warden Stealer, CastleStealer, and Aoki, which target credentials, browser data, AI-tool configuration files, authenticated sessions, or live device surveillance. A self-healing WordPress must-use plugin can maintain persistence, create and conceal administrator accounts, steal passwords, alter sites remotely, exfiltrate data, and spread to other WordPress installations. NVIDIA\u0026rsquo;s Bad UVM flaw could allow Linux privilege escalation, code execution, and container escape, while a Xen grant-table race condition could potentially let an unprivileged virtual-machine guest compromise its host.\u003c/p\u003e\n\n\u003cp\u003eThe roundup emphasizes that patching does not necessarily remove attacker access established before remediation. It recommends upgrading affected PAN-OS deployments, disabling unnecessary authentication-override cookies, terminating active GlobalProtect sessions after patching, and investigating unexpected connections. Microsoft also urges organizations to inventory certificate dependencies and test certificate systems for post-quantum authentication readiness. Across the stories, stolen credentials, persistent access, and seemingly small configuration or permission weaknesses can lead to credential theft, lateral movement, data theft, ransomware deployment, or system takeover.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Qilin and Settra ransomware groups are actively exploiting CVE-2026-0257, an authentication-bypass flaw in PAN-OS GlobalProtect and Prisma Access that was disclosed in May 2026.","A cryptocurrency wallet-drainer kit called Noir uses DNS TXT records and public DNS-over-HTTPS services to locate its active attacker-controlled backend infrastructure.","A malicious WordPress must-use plugin uses self-healing mechanisms and EtherHiding to maintain access, hide attacker infrastructure, create concealed administrator accounts, and spread to other WordPress installations.","Researchers reported that an Adobe Experience Manager cloud flaw chain combining bulk import, stored cross-site scripting, unsafe XML parsing, and Groovy execution could enable unauthenticated remote code execution; the flaws have been patched.","NVIDIA's CVE-2026-47595 Linux GPU driver flaw, known as Bad UVM, could allow an unprivileged user to write to read-only memory and potentially gain root access or escape a container."],"insights":["For the PAN-OS GlobalProtect flaw, malicious access can look like ordinary remote work because it comes through an organization’s own VPN, and patching may not remove access established before remediation.","The Noir wallet drainer can steal funds without obtaining a seed phrase, password, or private key by persuading users to grant permissions that may appear less alarming than a direct transfer.","AI coding-assistant credentials and session files have become infostealer targets because they can let attackers act under a legitimate developer’s identity, use the developer’s API quota, and potentially reach connected repositories, cloud services, and CI/CD pipelines.","The WordPress backdoor’s use of a must-use plugin, self-healing behavior, hidden administrator accounts, and blockchain-hosted attacker-server information makes simple removal and infrastructure takedowns more difficult.","KGB RAT combines conventional data theft and ransomware functions with deliberate harassment features such as jump scares and forced blue-screen crashes, explicitly pairing victim intimidation with system compromise."],"referencedReports":[{"title":"Russia's Hybrid Attacks Across Europe","url":"https://www.recordedfuture.com/blog/russia-new-generation-warfare","publisher":"recorded-future","context":"The article cites Recorded Future's assessment that Russia has escalated hybrid and asymmetric warfare across Europe since its full-scale invasion of Ukraine.","category":"research","primary":false},{"title":"Noir, a Crypto Wallet Drainer Kit","url":"https://www.infoblox.com/blog/threat-intelligence/when-a-wallet-drainer-asks-dns-where-to-go/","publisher":"infoblox","context":"The article references Infoblox's analysis of the Noir wallet-drainer kit and its use of DNS TXT records to locate backend infrastructure.","category":"research","primary":false},{"title":"CikaBika Bot Uses Discord for C2 Discovered","url":"https://www.darktrace.com/blog/cikabika-bot-inside-a-discord-rat","publisher":"darktrace","context":"The article cites Darktrace's examination of the CikaBika Bot remote-access trojan and its use of Discord for command-and-control communications.","category":"research","primary":false},{"title":"New KGB RAT Malware Advertised on Cybercrime Forums","url":"https://www.group-ib.com/blog/kgb-rat-windows-fud-trojan/","publisher":"group-ib","context":"The article references Group-IB's analysis of KGB RAT, including its credential theft, ransomware, and victim-harassment features.","category":"research","primary":false},{"title":"BotHelper RAT Enables Live Screen Surveillance","url":"https://www.pointwild.com/threat-intelligence/bothelper-rat-from-encrypted-payload-to-live-screen-surveillance/","publisher":"point-wild","context":"The article cites Point Wild's technical analysis of the BotHelper RAT infection chain, persistence, and live-screen surveillance capability.","category":"research","primary":false},{"title":"A Stealthy WordPress Must-Use Plugin","url":"https://www.wordfence.com/blog/2026/09/inside-a-malicious-stealthy-wordpress-must-use-plugin/","publisher":"wordfence","context":"The article references Wordfence's analysis of a malicious WordPress must-use plugin with self-healing and EtherHiding mechanisms.","category":"research","primary":false},{"title":"XWorm Becomes a Surveillance Platform","url":"https://threatlabs.netskope.com/blog/2026/09/xworm-reborn","publisher":"netskope","context":"The article cites Netskope's research on newer XWorm versions and their expanded surveillance plugins.","category":"research","primary":false},{"title":"Warden Stealer Comes with Loader and Clipper","url":"https://www.gendigital.com/blog/insights/research/warden-stealer-rust-infostealer-analysis","publisher":"gen-digital","context":"The article references Gen Digital's analysis of Warden Stealer and its targeting of AI-assistant and coding-tool data.","category":"research","primary":false},{"title":"New CastleStealer Variants Spotted","url":"https://flashpoint.io/blog/castlestealer-an-emerging-infostealer-growing-more-sophisticated/","publisher":"flashpoint","context":"The article cites Flashpoint's research on CastleStealer variants that bypass Chromium app-bound encryption and exfiltrate data in encrypted chunks.","category":"research","primary":false},{"title":"Aoki Infostealer Adds Claude, Codex, and Cursor Credentials to Data Theft Targets","url":"https://www.security.com/threat-intelligence/aoki-infostealer-ai-targeting","publisher":"symantec-threat-hunter-team","context":"The article references the Symantec Threat Hunter team's analysis of Aoki targeting credentials and session files for AI coding assistants.","category":"research","primary":false},{"title":"A Python-Based MaaS Infostealer Builder","url":"https://labs.k7computing.com/index.php/the-stealer-factory-unpacking-a-python-based-maas-infostealer-builder/","publisher":"k7-labs","context":"The article cites K7 Labs' technical analysis of a Python-based malware-as-a-service builder used to generate customized infostealer executables.","category":"research","primary":false},{"title":"Harbor Patches High-Severity SSRF Flaw Allowing Project Admins to Access Internal Services","url":"https://www.ox.security/blog/harbor-ssrf-vulnerability-cloud-credentials/","publisher":"ox-security","context":"The article references OX Security's analysis of a Harbor SSRF flaw that could expose cloud IAM credentials through project webhooks.","category":"research","primary":false},{"title":"Adobe Experience Manager Flaw Chain Enables Unauthenticated RCE","url":"https://www.slcyber.io/research/more-critical-bugs-in-adobe-experience-manager-pre-auth-rce","publisher":"slcyber","context":"The article cites SL Cyber's research describing an Adobe Experience Manager cloud flaw chain that could lead to unauthenticated remote code execution.","category":"research","primary":false},{"title":"Bad UVM: Hijack Readonly Page Cache via NVIDIA UVM","url":"https://medium.com/@guoziyi114/bad-uvm-hijack-readonly-page-cache-via-nvidia-uvm-7accc7e3181e","publisher":"ziyi-guo","context":"The article references researcher Ziyi Guo's technical disclosure of the Bad UVM NVIDIA Linux driver vulnerability and its potential for privilege escalation and container escape.","category":"research","primary":false},{"title":"SiteGuard Server Edition Command Injection Vulnerability Alert","url":"https://www.eg-secure.co.jp/siteguard/news/alert-202610-1","publisher":"eg-secure-solutions","context":"The article cites the vendor alert warning that a SiteGuard Server Edition command-injection flaw is under active exploitation.","category":"advisory","primary":false},{"title":"Critical WebAlliance eCommerce SQL Injection Flaw Exposes Databases, No Patch Announced","url":"https://www.rapid7.com/blog/post/ve-unauthenticated-sql-injection-in-channel-software-weballiance-ecommerce/","publisher":"rapid7","context":"The article references Rapid7's disclosure of a critical unauthenticated SQL-injection flaw in Channel Software WebAlliance eCommerce.","category":"research","primary":false},{"title":"NSD Security Advisories","url":"https://www.nlnetlabs.nl/projects/nsd/security-advisories/","publisher":"nlnet-labs","context":"The article cites NSD security advisories covering four high-severity flaws that could permit arbitrary command execution.","category":"advisory","primary":false},{"title":"Xen Security Advisory for CVE-2026-79610","url":"https://www.openwall.com/lists/oss-security/2026/10/13/6","publisher":"xen-project","context":"The article references the Xen project's advisory for a grant-table race condition that could allow a guest virtual machine to compromise its host.","category":"advisory","primary":false},{"title":"MyReport Updater: From gRPC to SYSTEM","url":"https://blog.quarkslab.com/myreport-updater-from-grpc-to-system.html","publisher":"quarkslab","context":"The article cites Quarkslab's technical analysis of MyReport Updater flaws that could enable unauthenticated code execution as Windows SYSTEM.","category":"research","primary":false}],"body":"\u003cp\u003eThis ThreatsDay roundup covers active exploitation, newly disclosed software flaws, malware campaigns, and defensive updates affecting enterprise systems, cloud services, browsers, mobile devices, cryptocurrency users, and AI development tools. Qilin and Settra ransomware groups are actively exploiting CVE-2026-0257, an authentication-bypass flaw in PAN-OS GlobalProtect and Prisma Access, where malicious activity can resemble legitimate VPN-based remote work. The article also reports active exploitation of a SiteGuard Server Edition command-injection flaw that can run commands with root or SYSTEM privileges. Several other critical issues could enable unauthenticated remote code execution, including flaws in Adobe Experience Manager, Samsung QA-Board, Channel Software WebAlliance eCommerce, and MyReport Updater.\u003c/p\u003e\n\n\u003cp\u003eThe malware coverage includes the Noir cryptocurrency wallet drainer, which uses DNS TXT records and public DNS-over-HTTPS services to locate its active backend, and can steal funds after users grant wallet permissions rather than providing seed phrases or passwords. Other threats include CikaBika Bot, KGB RAT, BotHelper RAT, XWorm, Warden Stealer, CastleStealer, and Aoki, which target credentials, browser data, AI-tool configuration files, authenticated sessions, or live device surveillance. A self-healing WordPress must-use plugin can maintain persistence, create and conceal administrator accounts, steal passwords, alter sites remotely, exfiltrate data, and spread to other WordPress installations. NVIDIA\u0026rsquo;s Bad UVM flaw could allow Linux privilege escalation, code execution, and container escape, while a Xen grant-table race condition could potentially let an unprivileged virtual-machine guest compromise its host.\u003c/p\u003e\n\n\u003cp\u003eThe roundup emphasizes that patching does not necessarily remove attacker access established before remediation. It recommends upgrading affected PAN-OS deployments, disabling unnecessary authentication-override cookies, terminating active GlobalProtect sessions after patching, and investigating unexpected connections. Microsoft also urges organizations to inventory certificate dependencies and test certificate systems for post-quantum authentication readiness. Across the stories, stolen credentials, persistent access, and seemingly small configuration or permission weaknesses can lead to credential theft, lateral movement, data theft, ransomware deployment, or system takeover.\u003c/p\u003e\n"},{"n":10,"title":"Healthcare Summit 2026 On Demand","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/healthcare-summit-2026-on-demand/","time":"18:22","priority":"MAY READ","score":35,"tldr":"Rubrik’s on-demand Healthcare Summit session features AHA advisor John Riggi and investigator Nicole Perlroth discussing current threats to U.S. healthcare, including North Korean hacker operations.","briefOverview":"\u003cp\u003eHealthcare Summit 2026 On Demand is a resource dated October 15, 2026, provided by Rubrik. It promotes an on-demand video focused on threat intelligence for healthcare. The article describes healthcare as the most targeted sector in America.\u003c/p\u003e\n\n\u003cp\u003eThe video features AHA Cybersecurity Advisor John Riggi, who presents fresh national threat intelligence. It also features cybersecurity investigator Nicole Perlroth, who shares her latest findings on North Korean hacker operations. Rubrik is identified as a Health-ISAC Community Services Champion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Healthcare Summit 2026 on-demand resource is dated October 15, 2026.","The session presents national threat intelligence focused on healthcare, which the article describes as America’s most targeted sector.","AHA Cybersecurity Advisor John Riggi participates in the session.","Cybersecurity investigator Nicole Perlroth presents findings on North Korean hacker operations.","The on-demand video is provided by Rubrik, a Health-ISAC Community Services Champion."],"insights":["The resource s. Season 2, \u003cem\u003eNorth Korea On Our Payroll\u003c/em\u003e, examines cybercrime, insider operations, and financial heists used by North Korea to bypass international sanctions. The article states that these activities directly fund North Korea’s state and nuclear weapons programs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rubrik offers the “To Catch a Thief” documentary podcast series through Health-ISAC’s Community Services program.","Season 1, “China’s Rise to Cyber Supremacy,” focuses on intellectual-property theft, corporate espionage, and long-term targeting of critical infrastructure by Chinese state-sponsored hackers.","Season 2, “North Korea On Our Payroll,” examines North Korea’s use of cybercrime, insider operations, and financial heists to bypass international sanctions.","The article states that North Korea uses these activities to directly fund its state and nuclear weapons programs.","The podcast is available through a Rubrik link provided in the article."],"insights":["The podcast frames state-linked cyber activity as serving distinct strategic goals: Chinese operations emphasize intellectual property, corporate targets, and critical infrastructure, while North Korean operations emphasize generating funds and bypassing sanctions.","The North Korea season includes insider operations alongside cybercrime and financial heists, highlighting that the series covers risks involving people within organizations as well as external online activity.","The reference to long-term critical-infrastructure targeting indicates that the China-focused season addresses persistent campaigns rather than only isolated incidents."],"referencedReports":[],"body":"\u003cp\u003eRubrik, a Health-ISAC Community Services Champion, promotes its documentary podcast series, \u003cem\u003eTo Catch a Thief\u003c/em\u003e. The series focuses on state-sponsored cyber threats, digital espionage, and national-security risks. The article provides a link to listen to the podcast.\u003c/p\u003e\n\n\u003cp\u003eSeason 1, \u003cem\u003eChina’s Rise to Cyber Supremacy\u003c/em\u003e, covers intellectual-property theft, corporate espionage, and long-term targeting of critical infrastructure by Chinese state-sponsored hackers. Season 2, \u003cem\u003eNorth Korea On Our Payroll\u003c/em\u003e, examines cybercrime, insider operations, and financial heists used by North Korea to bypass international sanctions. The article states that these activities directly fund North Korea’s state and nuclear weapons programs.\u003c/p\u003e\n"}]</script>
