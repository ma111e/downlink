<script type="application/json" id="dl-articles">[{"n":7,"title":"GitLab CVSS 10 File-Read Flaw Draws In-the-Wild Probes After Disclosure","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/gitlab-cvss-10-file-read-flaw-draws-in.html","time":"16:30","priority":"MUST READ","score":98,"tldr":"GitLab patched CVE-2026-85706, a CVSS 10 unauthenticated path traversal flaw that can expose arbitrary server files and is already being probed in the wild. Self-managed GitLab instances should urgently upgrade to 19.3.2, 19.2.6, or 19.1.8, or restrict public access.","briefOverview":"\u003cp\u003eGitLab released patches for CVE-2026-85706, a maximum-severity CVSS 10.0 flaw in its repository commits API. The path traversal issue can allow an unauthenticated user to read arbitrary files from a GitLab server under certain conditions because of improper path confinement and missing authentication enforcement. It affects GitLab CE and EE versions from 18.7 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr said it observed active probes for the flaw beginning at 06:00 UTC on September 11, 2026, within hours of public disclosure. The issue can enable attackers to read log and GitLab configuration files that may contain credentials, secrets, and sensitive information, and exploitation requires at least one public project. GitLab also fixed CVE-2026-87719, a CVSS 9.9 GitLab EE insecure deserialization issue affecting Duo Chat users, while organizations with internet-exposed self-managed instances are urged to patch promptly or restrict public access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab patched CVE-2026-85706, a CVSS 10.0 path traversal flaw in the repository commits API that can allow unauthenticated users to read arbitrary files from a GitLab server under certain conditions.","The affected GitLab CE and EE versions are 18.7 through versions before 19.1.8, 19.2 through versions before 19.2.6, and 19.3 through versions before 19.3.2.","watchTowr reported observing in-the-wild probes for CVE-2026-85706 from 06:00 UTC on September 11, 2026, shortly after public disclosure.","GitLab also fixed CVE-2026-87719, a CVSS 9.9 insecure deserialization issue in GitLab EE that could allow authenticated Duo Chat users to obtain Advanced Search configurations and sensitive credentials.","GitLab advises organizations with internet-exposed self-managed instances to apply the patches promptly or restrict public access, and watchTowr recommends reviewing logs for POST requests to repository commits API URLs containing file.Path parameters."],"insights":["Exploitation of CVE-2026-85706 requires only that at least one public GitLab project exists, making externally reachable self-managed instances especially exposed.","The flaw can expose GitLab log and configuration files, which may provide attackers with credentials, secrets, and other sensitive information beyond the initially accessed file.","Access to GitLab can have downstream consequences because attackers may obtain source code and CI/CD secrets or inject code into build pipelines.","Organizations can look for possible exploitation attempts by reviewing logs for HTTP POST requests to repository commits API paths that contain file.Path parameters."],"referencedReports":[],"body":"\u003cp\u003eGitLab released patches for CVE-2026-85706, a maximum-severity CVSS 10.0 flaw in its repository commits API. The path traversal issue can allow an unauthenticated user to read arbitrary files from a GitLab server under certain conditions because of improper path confinement and missing authentication enforcement. It affects GitLab CE and EE versions from 18.7 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr said it observed active probes for the flaw beginning at 06:00 UTC on September 11, 2026, within hours of public disclosure. The issue can enable attackers to read log and GitLab configuration files that may contain credentials, secrets, and sensitive information, and exploitation requires at least one public project. GitLab also fixed CVE-2026-87719, a CVSS 9.9 GitLab EE insecure deserialization issue affecting Duo Chat users, while organizations with internet-exposed self-managed instances are urged to patch promptly or restrict public access.\u003c/p\u003e\n"},{"n":1,"title":"Artifactory flaws chained in attacks deploying backdoor malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/artifactory-flaws-chained-in-attacks-deploying-backdoor-malware/","time":"16:29","priority":"MUST READ","score":96,"tldr":"Threat actors are actively chaining critical JFrog Artifactory flaws to bypass authentication, obtain administrator access, and install persistent Rust backdoors on self-hosted servers. Organizations should immediately upgrade to patched Artifactory releases and investigate for rogue admin accounts, tokens, plugins, and webshells.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting critical and high-severity flaws in self-hosted JFrog Artifactory servers to bypass authentication, obtain administrator privileges, and deploy a Rust-based backdoor. Wiz observed multiple actors chaining CVE-2026-42018 and CVE-2026-42016 between August 15 and September 8, 2026. The activity can allow an attacker to create an administrator account in less than five minutes in some cases.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-42018 enables attackers to obtain a token for Artifactory’s internal anonymous user even where anonymous access is disabled, while CVE-2026-42016 can elevate that access to administrator level because of insufficient token validation. After gaining access, attackers created long-lived tokens and administrator accounts, installed malicious Groovy plugins, uploaded webshells, stole configuration data and cluster join keys, and added SSH keys to new accounts. Wiz estimates that 49% to 62% of reachable Artifactory instances are vulnerable to at least one of the three reported flaws, and administrators are advised to upgrade promptly and investigate exposed systems for suspicious accounts, tokens, plugins, and enumeration activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors chained CVE-2026-42018 and CVE-2026-42016 against self-hosted JFrog Artifactory instances to obtain administrator-level access.","CVE-2026-42018 lets attackers obtain a token for Artifactory’s internal anonymous user even when anonymous access is disabled, while CVE-2026-42016 can be used to elevate that access to administrator level.","After gaining administrator access, attackers created accounts and long-lived tokens, installed malicious Groovy plugins, and deployed a Rust-based backdoor with command-and-control capabilities.","Attackers also downloaded payloads to temporary directories, uploaded webshells, stole Artifactory configuration data and cluster join keys, and enumerated repositories, tokens, and users.","Wiz estimates that 49% to 62% of reachable Artifactory instances are vulnerable to at least one of the three reported flaws and recommends immediate upgrades to patched releases."],"insights":["Disabling anonymous access did not prevent attackers from obtaining a token for Artifactory’s internal anonymous user through CVE-2026-42018.","In some observed cases, attackers created an administrator account in less than five minutes after exploiting the flaws.","The intrusion activity was designed for persistence as well as initial access, using long-lived tokens, malicious Groovy plugins, newly created accounts, and added SSH keys.","The compromise could expose broader internal infrastructure because attackers stole Artifactory configuration data and cluster join keys.","Wiz estimated that 49% to 62% of reachable Artifactory instances remain vulnerable to at least one of the three flaws."],"referencedReports":[{"title":"Artifactory Under Attack in the Wild: Exploitation of CVE-2026-42016 and CVE-2026-42018","url":"https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201","publisher":"wiz","context":"The article relies on Wiz's observations of multiple threat actors chaining Artifactory vulnerabilities and deploying a Rust backdoor.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are actively exploiting critical and high-severity flaws in self-hosted JFrog Artifactory servers to bypass authentication, obtain administrator privileges, and deploy a Rust-based backdoor. Wiz observed multiple actors chaining CVE-2026-42018 and CVE-2026-42016 between August 15 and September 8, 2026. The activity can allow an attacker to create an administrator account in less than five minutes in some cases.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-42018 enables attackers to obtain a token for Artifactory’s internal anonymous user even where anonymous access is disabled, while CVE-2026-42016 can elevate that access to administrator level because of insufficient token validation. After gaining access, attackers created long-lived tokens and administrator accounts, installed malicious Groovy plugins, uploaded webshells, stole configuration data and cluster join keys, and added SSH keys to new accounts. Wiz estimates that 49% to 62% of reachable Artifactory instances are vulnerable to at least one of the three reported flaws, and administrators are advised to upgrade promptly and investigate exposed systems for suspicious accounts, tokens, plugins, and enumeration activity.\u003c/p\u003e\n"},{"n":5,"title":"Russian State-Sponsored Hackers Use Claude to Rebuild Malware After Detection","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/russian-state-sponsored-hackers-use.html","time":"14:10","priority":"MUST READ","score":94,"tldr":"Anthropic says a Russian state-linked group, likely Midnight Blizzard/APT29, used Claude to automate malware redevelopment and redeployment whenever security tools detected it. The campaign targeted government, defense, diplomatic, and other strategic organizations across Ukraine, Europe, the Middle East, and Asia using phishing, DNS hijacking, hotel Wi-Fi compromises, and credential theft.","briefOverview":"\u003cp\u003eAnthropic said it disrupted an AI-assisted cyber espionage campaign by GTG-20006, a Russian state-sponsored group aligned with broader reporting on Midnight Blizzard, also known as APT29 and Cozy Bear. The group targeted military intelligence, government, diplomatic, defense, and related organizations, primarily in Ukraine and Europe, with additional targets in the Middle East and Asia. More than 20 organizations were identified during reconnaissance and live operations.\u003c/p\u003e\n\n\u003cp\u003eAccording to Anthropic, the actor used Claude to monitor whether its tools were detected by security products and then autonomously modify and rebuild them to evade those detections. Its toolkit included Windows implants, a mobile exploitation kit, browser credential theft tooling, phishing infrastructure, and an administrative console for compromised accounts. The operation also involved compromised hotel guest Wi-Fi vendors, DNS record changes that redirected guest traffic to actor-controlled services, device-specific malicious lures, Microsoft 365 token theft, WhatsApp account takeovers, and unauthorized access to live camera streams.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic said it disrupted a campaign by the Russian state-sponsored group GTG-20006, which it links to broader reporting on Midnight Blizzard, APT29, and Cozy Bear.","GTG-20006 used Claude-driven workflows to monitor whether its tools were detected and to modify and rebuild them to evade existing security detections.","The campaign targeted more than 20 government, defense, intelligence, diplomatic, think tank, and defense-industrial organizations, primarily in Ukraine and Europe, with additional targets in the Middle East and Asia.","The group compromised at least three hotel guest Wi-Fi vendors, changed DNS records to redirect traffic to its own services, and served device-specific malicious lures to hotel guests.","Anthropic reported that the actor also used a Microsoft 365 device-code phishing framework called Embassy Kit to steal access tokens and access mail records from at least eight organizations."],"insights":["The group used AI not only to create tools but to run a feedback loop: detection of a deployed tool triggered automated modification and rebuilding intended to bypass the detection.","Compromising hotel guest Wi-Fi vendors gave the actor a way to identify connected guests through their traffic, device identifiers, and IP addresses before delivering device-specific malicious software.","Data taken from hotel management systems and guests’ devices was used to identify further targets, including Ukrainian government officials and drone manufacturers.","The operation combined access to hotel Wi-Fi, Microsoft 365 email accounts, WhatsApp conversations, and live camera streams, showing that the actor pursued multiple sources of communications and surveillance data."],"referencedReports":[{"title":"Threat Intelligence Report: September 2026","url":"https://www.anthropic.com/threat-intelligence-report-september-2026","publisher":"anthropic","context":"The article is based on Anthropic's report describing its disruption of GTG-20006's AI-assisted cyber espionage campaign.","category":"research","primary":true}],"body":"\u003cp\u003eAnthropic said it disrupted an AI-assisted cyber espionage campaign by GTG-20006, a Russian state-sponsored group aligned with broader reporting on Midnight Blizzard, also known as APT29 and Cozy Bear. The group targeted military intelligence, government, diplomatic, defense, and related organizations, primarily in Ukraine and Europe, with additional targets in the Middle East and Asia. More than 20 organizations were identified during reconnaissance and live operations.\u003c/p\u003e\n\n\u003cp\u003eAccording to Anthropic, the actor used Claude to monitor whether its tools were detected by security products and then autonomously modify and rebuild them to evade those detections. Its toolkit included Windows implants, a mobile exploitation kit, browser credential theft tooling, phishing infrastructure, and an administrative console for compromised accounts. The operation also involved compromised hotel guest Wi-Fi vendors, DNS record changes that redirected guest traffic to actor-controlled services, device-specific malicious lures, Microsoft 365 token theft, WhatsApp account takeovers, and unauthorized access to live camera streams.\u003c/p\u003e\n"},{"n":6,"title":"Claude Used to Automate Exploitation and Data Theft Across Multiple Victims","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/claude-used-to-automate-exploitation.html","time":"14:29","priority":"SHOULD READ","score":86,"tldr":"Anthropic says state-backed and criminal actors abused Claude to automate reconnaissance, exploitation, credential theft, data exfiltration, influence operations, and surveillance at scale. The report highlights campaigns linked to Russian, Chinese, Iranian, and financially motivated groups, which Anthropic says it disrupted.","briefOverview":"\u003cp\u003eAnthropic reported that cybercriminals, state-sponsored groups, commercial spyware vendors, and politically motivated actors abused Claude between December 2025 and August 2026. Its 154-page report says the activity included cyber intrusions, credential theft, data exfiltration, propaganda, mass surveillance, and weapons-related development. Anthropic described these actors as Generative Threat Groups and said it disrupted several of the operations.\u003c/p\u003e\n\n\u003cp\u003eThe company said AI use ranged from assistance with malware, phishing kits, and surveillance tools to multi-agent frameworks that performed reconnaissance, exploitation, credential harvesting, and data theft against multiple victims with minimal human supervision. Examples included GTG-50014\u0026rsquo;s use of 10 AWS EC2 workers to download 1.8 million Android apps and scan them with TruffleHog for hard-coded secrets, and GTG-50029\u0026rsquo;s alleged exploitation of a WordPress re-installation race condition to create unauthorized administrator accounts. Anthropic also identified influence and surveillance operations linked to actors in Russia, China, Iran, Bangladesh, Mali, and elsewhere, including efforts to produce political content, profile monitored individuals, and build mass-interception capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic reported that threat actors used Claude between December 2025 and August 2026 for cyber intrusions, data theft, propaganda, mass surveillance, and weapons-related development.","Anthropic said some operations used multi-agent frameworks to conduct reconnaissance, exploitation, credential harvesting, and data exfiltration against multiple victims with minimal human supervision.","A Russian state-sponsored actor tracked as GTG-20006, with overlaps to Midnight Blizzard tradecraft, used Claude in an AI-assisted workflow for cyber operations.","Chinese-speaking GTG-10007 targeted about 50 organizations globally and used Claude for intrusion attempts, foreign-government reconnaissance, exploit development, and open-source intelligence collection.","Anthropic said it identified and disrupted influence operations that used Claude to produce political content and surveillance efforts that profiled people and monitored communications."],"insights":["Anthropic described a spectrum of AI misuse ranging from conversational assistance for malware and phishing material to largely autonomous, multi-agent operations that ran against multiple victims for hours or days.","GTG-50014 reportedly used 10 AWS EC2 workers to download and scan 1.8 million Android apps for embedded secrets, then sent verified findings to Telegram.","GTG-50029 allegedly exploited a previously undocumented WordPress re-installation race condition to create administrator accounts without valid credentials and used a dedicated doxxing platform, fafsearch, to cross-reference stolen data.","Anthropic found that several influence operations could mass-produce political content but had not gained authentic engagement before they were disrupted.","One China-aligned operation used Claude to turn conversations from more than 100 monitored WhatsApp groups and dozens of Telegram channels into structured Chinese-language profiles of people considered vulnerable to targeting."],"referencedReports":[{"title":"Anthropic Threat Intelligence Report: September 2026","url":"https://www.anthropic.com/threat-intelligence-report-september-2026","publisher":"anthropic","context":"The article relies on Anthropic's 154-page threat intelligence report describing Claude misuse by cybercriminal, state-linked, influence, surveillance, and weapons-development operations.","category":"research","primary":true}],"body":"\u003cp\u003eAnthropic reported that cybercriminals, state-sponsored groups, commercial spyware vendors, and politically motivated actors abused Claude between December 2025 and August 2026. Its 154-page report says the activity included cyber intrusions, credential theft, data exfiltration, propaganda, mass surveillance, and weapons-related development. Anthropic described these actors as Generative Threat Groups and said it disrupted several of the operations.\u003c/p\u003e\n\n\u003cp\u003eThe company said AI use ranged from assistance with malware, phishing kits, and surveillance tools to multi-agent frameworks that performed reconnaissance, exploitation, credential harvesting, and data theft against multiple victims with minimal human supervision. Examples included GTG-50014\u0026rsquo;s use of 10 AWS EC2 workers to download 1.8 million Android apps and scan them with TruffleHog for hard-coded secrets, and GTG-50029\u0026rsquo;s alleged exploitation of a WordPress re-installation race condition to create unauthorized administrator accounts. Anthropic also identified influence and surveillance operations linked to actors in Russia, China, Iran, Bangladesh, Mali, and elsewhere, including efforts to produce political content, profile monitored individuals, and build mass-interception capabilities.\u003c/p\u003e\n"},{"n":8,"title":"Malicious Twitch Browser Extension Exposes 30,000 Users’ OAuth Tokens to Russian Bot Service","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/malicious-twitch-browser-extension?utm_medium=feed","time":"14:23","priority":"SHOULD READ","score":85,"tldr":"Socket researchers found that the Twitch Enhanced Viewer | JeetBot browser extension, installed by roughly 31,000 Chrome and Firefox users, forwards live Twitch OAuth session tokens to operator-controlled proxy servers. Affected users should remove the extension and revoke Twitch sessions because the exposed bearer tokens can enable account access.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team identified “Twitch Enhanced Viewer | JeetBot,” a browser extension available on the Chrome Web Store and Firefox Add-ons, as forwarding users’ live Twitch OAuth session tokens to proxy servers operated by the extension’s operator. The extension was listed with approximately 30,000 Chrome users and 552 Firefox users at the time of writing. It markets ad blocking, 1080p playback, region-unlocked streams, and automatic channel-point collection, while routing Twitch video-playlist requests through operator-controlled proxies.\u003c/p\u003e\n\n\u003cp\u003eThe extension captures the Authorization header used by Twitch’s web client, extracts the account-scoped OAuth token, and in current v85.x builds appends it as an \u003ccode\u003eauth\u003c/code\u003e query parameter during proxy redirects for watched channels. The token is omitted only for a hardcoded allowlist of ten Russian streamer channels, and earlier v4.x builds directly POSTed captured tokens to \u003ccode\u003eset-token\u003c/code\u003e endpoints. Because these bearer credentials can enable actions such as reading and sending whispers, posting in chat, spending channel points, and accessing account settings, the article recommends removing the extension and disconnecting all Twitch sessions before re-authenticating.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s Threat Research Team reported that the Twitch Enhanced Viewer | JeetBot extension forwards live Twitch OAuth session tokens from Chrome and Firefox users to proxy servers controlled by its operator.","The extension was listed as having about 30,000 Chrome users and 552 Firefox users at the time of writing.","Current version 85.x builds append the captured token as an auth query parameter when redirecting Twitch video-playlist requests through the operator’s proxy, except for ten hardcoded Russian streamer channels.","Earlier version 4.x builds POSTed captured tokens to set-token endpoints, including enhanced.jeetbot.cc and backup endpoints hosted on deno.dev and deno.net.","The article recommends that affected users remove the extension and disconnect all Twitch sessions before re-authenticating to invalidate forwarded tokens."],"insights":["The extension captures Twitch’s account-level OAuth credential from the site’s Authorization header even though video playback uses separate token and signature values, exposing more access than is needed to proxy a stream.","By placing the OAuth token in an auth URL parameter, the extension causes the credential to be recorded in cleartext in the operator proxy’s request logs.","The hardcoded token-stripping exception applies only to ten Russian-language streamer channels, while sessions for other watched channels have their tokens forwarded.","The proxy catalog and forced-proxy configuration are served from an operator-controlled API, allowing the operator to determine server-side which proxy host receives users’ tokens.","The extension’s token forwarding conflicts with its Chrome Web Store data-safety statement and linked privacy policy, both of which say that user data is not collected, stored, or processed."],"referencedReports":[],"body":"\u003cp\u003eSocket’s Threat Research Team identified “Twitch Enhanced Viewer | JeetBot,” a browser extension available on the Chrome Web Store and Firefox Add-ons, as forwarding users’ live Twitch OAuth session tokens to proxy servers operated by the extension’s operator. The extension was listed with approximately 30,000 Chrome users and 552 Firefox users at the time of writing. It markets ad blocking, 1080p playback, region-unlocked streams, and automatic channel-point collection, while routing Twitch video-playlist requests through operator-controlled proxies.\u003c/p\u003e\n\n\u003cp\u003eThe extension captures the Authorization header used by Twitch’s web client, extracts the account-scoped OAuth token, and in current v85.x builds appends it as an \u003ccode\u003eauth\u003c/code\u003e query parameter during proxy redirects for watched channels. The token is omitted only for a hardcoded allowlist of ten Russian streamer channels, and earlier v4.x builds directly POSTed captured tokens to \u003ccode\u003eset-token\u003c/code\u003e endpoints. Because these bearer credentials can enable actions such as reading and sending whispers, posting in chat, spending channel points, and accessing account settings, the article recommends removing the extension and disconnecting all Twitch sessions before re-authenticating.\u003c/p\u003e\n"},{"n":3,"title":"Passkey-themed phishing attacks lead to Microsoft 365 data theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/passkey-themed-phishing-attacks-lead-to-microsoft-365-data-theft/","time":"17:26","priority":"SHOULD READ","score":84,"tldr":"Microsoft warns that extortion-linked groups including ShinyHunters and Helix are using passkey, MFA, and SSO-themed phishing to steal Microsoft 365 sessions and data. After compromise, they add their own MFA methods, map cloud resources through Microsoft Graph, and quietly exfiltrate SharePoint, OneDrive, and Exchange data over hours or days.","briefOverview":"\u003cp\u003eMicrosoft reports that threat actors linked to ShinyHunters, Helix, and other extortion groups have used passkey-, MFA-, and SSO-themed social engineering since May 2026 to compromise corporate Microsoft accounts. They research organizations and employees, impersonate IT help desks by phone or message, and direct targets to fake Microsoft sign-in sites or device-code authentication flows. The passkey theme is a lure rather than an attempt to enroll a passkey, with attackers seeking credentials, active sessions, or authorization for attacker-controlled applications.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers map available applications, organizational information, and resources, then use Microsoft Graph to enumerate users, groups, roles, authentication methods, applications, SharePoint, OneDrive, and email. They may establish persistence by adding phone numbers, authenticator applications, or software one-time-password tokens to compromised accounts. Microsoft observed systematic, apparently automated collection of SharePoint and OneDrive data, with some intrusions also accessing Exchange email through REST APIs.\u003c/p\u003e\n\n\u003cp\u003eThe attackers reportedly avoid rapid bulk theft, instead collecting fewer than 1,000 files or emails per hour over several hours or days to blend with normal activity. Microsoft recommends monitoring unusual sign-ins followed by MFA registrations, Graph reconnaissance, and suspicious access to SharePoint, OneDrive, or Exchange. For compromised accounts, it advises revoking sessions and tokens, resetting credentials, removing attacker-added authentication methods and mailbox rules, and having users re-register authentication methods.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says threat actors linked to ShinyHunters, Helix, and other extortion groups have used passkey, MFA, and SSO-themed social engineering since May 2026 to compromise corporate Microsoft accounts.","The attackers impersonate corporate IT help desks and direct employees to fake Microsoft sign-in pages or persuade them to enter device codes on legitimate Microsoft authentication pages.","After obtaining access, attackers may register phone numbers, authenticator apps, or software one-time-password tokens under compromised accounts to maintain access.","Microsoft observed attackers using Microsoft Graph to enumerate users, groups, roles, applications, SharePoint sites, OneDrive resources, and mail data before collecting cloud data.","Data theft from SharePoint, OneDrive, and sometimes Exchange was automated and paced below 1,000 files or emails per hour to blend with normal activity."],"insights":["Although the lures mention passkeys, Microsoft says the attackers are not trying to enroll passkeys; they use the theme to convince victims to sign in through attacker-controlled pages or authorize device-code access.","Device-code phishing can give an attacker an authentication token through Microsoft’s legitimate login page, allowing access without another MFA prompt.","Microsoft says individual Microsoft Graph requests such as listing users, groups, or sites may look normal, but rapid movement across resources followed by privilege checks and access to files or email is more suspicious.","The attackers reportedly avoid rapid bulk theft and instead spread collection over hours or days, keeping activity below 1,000 files or emails per hour to blend with legitimate traffic.","A full credential and session reset removes the attackers’ MFA-based persistence, whereas merely having an attacker-controlled MFA method registered can let them satisfy later login challenges."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft reports that threat actors linked to ShinyHunters, Helix, and other extortion groups have used passkey-, MFA-, and SSO-themed social engineering since May 2026 to compromise corporate Microsoft accounts. They research organizations and employees, impersonate IT help desks by phone or message, and direct targets to fake Microsoft sign-in sites or device-code authentication flows. The passkey theme is a lure rather than an attempt to enroll a passkey, with attackers seeking credentials, active sessions, or authorization for attacker-controlled applications.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers map available applications, organizational information, and resources, then use Microsoft Graph to enumerate users, groups, roles, authentication methods, applications, SharePoint, OneDrive, and email. They may establish persistence by adding phone numbers, authenticator applications, or software one-time-password tokens to compromised accounts. Microsoft observed systematic, apparently automated collection of SharePoint and OneDrive data, with some intrusions also accessing Exchange email through REST APIs.\u003c/p\u003e\n\n\u003cp\u003eThe attackers reportedly avoid rapid bulk theft, instead collecting fewer than 1,000 files or emails per hour over several hours or days to blend with normal activity. Microsoft recommends monitoring unusual sign-ins followed by MFA registrations, Graph reconnaissance, and suspicious access to SharePoint, OneDrive, or Exchange. For compromised accounts, it advises revoking sessions and tokens, resetting credentials, removing attacker-added authentication methods and mailbox rules, and having users re-register authentication methods.\u003c/p\u003e\n"},{"n":4,"title":"Anthropic Says Seven China-Based AI Labs Ran Industrial-Scale Claude Distillation Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/anthropic-says-seven-china-based-ai.html","time":"16:15","priority":"SHOULD READ","score":84,"tldr":"Anthropic says it disrupted large-scale unauthorized efforts by seven China-based AI labs, including Alibaba, Moonshot, DeepSeek, Zhipu, Xiaomi, SenseTime, and MiniMax, to harvest Claude outputs and reasoning traces for model training. The campaigns allegedly relied on proxy networks, fraudulent accounts, stolen credentials, and rerouted user requests, raising both intellectual-property and user-data privacy concerns.","briefOverview":"\u003cp\u003eAnthropic said it identified and disrupted industrial-scale unauthorized attempts to extract Claude capabilities by seven China-based AI labs, naming Alibaba, Moonshot, DeepSeek, Z.ai, Xiaomi, SenseTime, and MiniMax. The company said the campaigns sought outputs related to agentic tasks, coding, data analysis, logical reasoning, and chain-of-thought reasoning. Anthropic described an Alibaba-affiliated operation involving 151 million exchanges as the largest distillation campaign it has measured.\u003c/p\u003e\n\n\u003cp\u003eAccording to Anthropic, the operators accessed Claude through proxy networks that created accounts using fictitious identities, fake or stolen payment cards, and illegally harvested API keys. Anthropic also alleged that Moonshot and DeepSeek redirected some customer requests to Claude without informing users, while other labs purchased saved user conversations from third-party proxy-service operators. The company said it now bans unverified reseller or unsupported-region accounts, summarizes internal reasoning before responses, and uses preserved thinking in Fable 5.1 to make captured reasoning transcripts less useful for training.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic said it identified and disrupted seven China-based AI labs that allegedly conducted unauthorized, large-scale efforts to use Claude outputs to train their own models.","Anthropic alleged that Alibaba-affiliated operators conducted its largest measured campaign, generating 151 million exchanges between May and July 2026 through more than 3,500 fraudulent accounts.","Anthropic said Moonshot AI and DeepSeek silently redirected some customer requests to Claude, then captured responses and reasoning transcripts for training.","According to Anthropic, proxy services used fake identities, stolen or fake credit cards, and illegally obtained API keys to create thousands of accounts and access Claude.","Anthropic said it changed Claude to summarize internal reasoning before answering and introduced preserved thinking in Fable 5.1 to make stolen conversation records less useful for training."],"insights":["Anthropic said the proxy services used to bypass regional access restrictions can create a secondary market for saved Claude conversations, allowing other labs to buy user exchanges without the users’ knowledge or consent.","The alleged Moonshot and DeepSeek campaigns did not merely submit automated prompts: Anthropic said they redirected some of their own customers’ requests to Claude and showed Claude’s responses back to those customers.","Anthropic said that some harvested conversations included sensitive information from individual users, multinational companies, and state-affiliated actors, making the alleged collection a privacy concern as well as a model-copying issue.","Anthropic’s mitigations target the usefulness of captured reasoning data by summarizing internal reasoning before responses and preventing new API accounts from changing the context that precedes reasoning in multi-turn conversations."],"referencedReports":[{"title":"Anthropic Threat Intelligence Report: September 2026","url":"https://www.anthropic.com/threat-intelligence-report-september-2026#illicit-distillation-sep-26","publisher":"anthropic","context":"The article relies on Anthropic's threat intelligence report for its allegations and details about illicit Claude distillation campaigns by China-based AI labs.","category":"research","primary":true}],"body":"\u003cp\u003eAnthropic said it identified and disrupted industrial-scale unauthorized attempts to extract Claude capabilities by seven China-based AI labs, naming Alibaba, Moonshot, DeepSeek, Z.ai, Xiaomi, SenseTime, and MiniMax. The company said the campaigns sought outputs related to agentic tasks, coding, data analysis, logical reasoning, and chain-of-thought reasoning. Anthropic described an Alibaba-affiliated operation involving 151 million exchanges as the largest distillation campaign it has measured.\u003c/p\u003e\n\n\u003cp\u003eAccording to Anthropic, the operators accessed Claude through proxy networks that created accounts using fictitious identities, fake or stolen payment cards, and illegally harvested API keys. Anthropic also alleged that Moonshot and DeepSeek redirected some customer requests to Claude without informing users, while other labs purchased saved user conversations from third-party proxy-service operators. The company said it now bans unverified reseller or unsupported-region accounts, summarizes internal reasoning before responses, and uses preserved thinking in Fable 5.1 to make captured reasoning transcripts less useful for training.\u003c/p\u003e\n"},{"n":10,"title":"Health-ISAC Hacking Healthcare 9-11-2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-hacking-healthcare-9-11-2026/","time":"15:18","priority":"SHOULD READ","score":78,"tldr":"The FBI’s new Cyber Division strategy prioritizes disrupting cyber adversaries, accelerating victim support and threat sharing, expanding public-private partnerships, and strengthening its cyber workforce and AI-enabled capabilities.","briefOverview":"\u003cp\u003eThe FBI released a new 17-page cyber strategy for its Cyber Division, describing a roadmap to defend the American people and the nation’s critical infrastructure in cyberspace. The strategy is organized around four pillars: disrupting cyber adversaries, supporting victims, increasing impact through partnerships, and improving FBI cyber capabilities. Health-ISAC highlights that the strategy operationalizes President Trump’s Cyber Strategy for America, particularly its focus on shaping adversary behavior.\u003c/p\u003e\n\n\u003cp\u003eThe first pillar emphasizes investigating, disrupting, and attributing malicious cyber activity, including supporting cost imposition through the FBI’s authorities and other instruments of national power. Victim-support objectives include faster automated threat-intelligence sharing, more proactive engagement with victims, expanded Industrial Control Systems Coordinators in every field office, and improved Internet Crime Complaint Center tools. The strategy also stresses that trusted relationships and steady two-way information sharing with domestic, international, public, and private partners are essential. Finally, the FBI plans to grow personnel, expertise, and tooling, including the use of artificial intelligence tools where appropriate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI released a 17-page cyber strategy for its Cyber Division that describes a roadmap for defending the American people and critical infrastructure in cyberspace.","The strategy’s first pillar focuses on investigating, disrupting, and attributing malicious cyber activity while using the FBI’s authorities to help impose costs on adversaries.","Its second pillar calls for faster automated threat-information sharing, proactive engagement with victims, expansion of the Industrial Control Systems Coordinator program to every field office, and enhanced Internet Crime Complaint Center tools.","The strategy emphasizes that trusted public-private and international partnerships, existing contacts, and steady two-way information sharing are essential to increasing the FBI’s impact.","The FBI also plans to strengthen its cyber personnel, expertise, and tools, including adopting artificial intelligence tools where appropriate."],"insights":["The strategy explicitly aligns the FBI’s cyber work with the national goal of shaping adversary behavior, signaling an emphasis on imposing costs on malicious actors rather than only responding after incidents occur.","The FBI identifies pre-existing relationships and two-way information exchange as necessary for effective partnerships, making relationship-building a stated operational requirement rather than a secondary activity.","Expanding Industrial Control Systems Coordinators to every FBI field office gives the strategy a specific nationwide support goal for organizations operating critical systems.","The strategy treats faster information sharing as a recurring priority across victim support and partnership efforts, including through automated sharing mechanisms.","The FBI’s planned use of artificial intelligence is framed as an enabling capability across processes and operations, not as a separate strategic pillar."],"referencedReports":[{"title":"FBI Cyber Strategy","url":"https://www.fbi.gov/investigate/cyber/cyber-strategy","publisher":"federal-bureau-of-investigation","context":"The article analyzes the FBI Cyber Division's newly released strategy and its four pillars.","category":"guide","primary":true},{"title":"President Trump's Cyber Strategy for America","url":"https://www.whitehouse.gov/wp-content/uploads/2026/03/President-Trumps-Cyber-Strategy-for-America.pdf","publisher":"white-house","context":"The article cites this national strategy to explain the alignment between its goal of shaping adversary behavior and the FBI strategy's first pillar.","category":"guide","primary":false}],"body":"\u003cp\u003eThe FBI released a new 17-page cyber strategy for its Cyber Division, describing a roadmap to defend the American people and the nation’s critical infrastructure in cyberspace. The strategy is organized around four pillars: disrupting cyber adversaries, supporting victims, increasing impact through partnerships, and improving FBI cyber capabilities. Health-ISAC highlights that the strategy operationalizes President Trump’s Cyber Strategy for America, particularly its focus on shaping adversary behavior.\u003c/p\u003e\n\n\u003cp\u003eThe first pillar emphasizes investigating, disrupting, and attributing malicious cyber activity, including supporting cost imposition through the FBI’s authorities and other instruments of national power. Victim-support objectives include faster automated threat-intelligence sharing, more proactive engagement with victims, expanded Industrial Control Systems Coordinators in every field office, and improved Internet Crime Complaint Center tools. The strategy also stresses that trusted relationships and steady two-way information sharing with domestic, international, public, and private partners are essential. Finally, the FBI plans to grow personnel, expertise, and tooling, including the use of artificial intelligence tools where appropriate.\u003c/p\u003e\n"},{"n":2,"title":"How Threat Actors Are Turning Trusted AI Platforms Into an Attack Surface","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/how-threat-actors-are-turning-trusted-ai-platforms-into-an-attack-surface/","time":"14:01","priority":"MAY READ","score":72,"tldr":"Attackers are abusing trusted, publicly shareable AI-platform content and search ads to host fake support pages and trick users into running malware such as SectopRAT, MacSync, and AMOS. Organizations should treat AI-hosted troubleshooting and clipboard-pasted commands as a social-engineering risk, using execution controls and rapid reporting to limit exposure.","briefOverview":"\u003cp\u003eHuntress reported that threat actors are abusing trusted AI-platform features, including Claude Artifacts, claude.ai/share links, and shared ChatGPT and Grok conversations, to distribute malware. Rather than compromising the AI providers or their models, the campaigns rely on users trusting familiar domains, branding, and AI-generated content. Attackers have also used sponsored search results and search-result manipulation to direct people seeking software downloads or troubleshooting advice to malicious pages.\u003c/p\u003e\n\n\u003cp\u003eIn the FakeAgent campaign, a fraudulent Claude Desktop download page hosted as a Claude Artifact redirected victims to SectopRAT and affected more than 29 organizations. Other campaigns used a fake Claude-on-Mac installation guide to deploy the MacSync stealer, and shared ChatGPT and Grok troubleshooting pages to deliver the AMOS stealer through ClickFix-style Terminal commands. Huntress recommends restricting clipboard-based script execution, enforcing application allow-listing, monitoring for new scheduled tasks and antivirus exclusions, training users to recognize these lures, and promptly reporting suspicious AI-hosted content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Huntress reported that attackers have abused shareable AI content, public mini-apps, and sponsored search results to deliver malware through trusted AI-platform domains.","In the FakeAgent campaign, a malicious Claude Artifact impersonating a Claude Desktop download page redirected victims to SectopRAT malware and affected more than 29 organizations.","A sponsored Google result for “Claude on Mac” led to a fake claude.ai/share installation guide that instructed a victim to run a command which deployed the MacSync stealer.","Attackers also used shared ChatGPT and Grok conversations and search-result manipulation to push ClickFix-style macOS disk-space advice that delivered the AMOS stealer.","Huntress recommends restricting clipboard-driven script execution, using application allow-listing, monitoring for new scheduled tasks and antivirus exclusions, and quickly reporting suspicious AI-hosted content."],"insights":["The campaigns do not require breaking into AI providers’ systems; they exploit the trust users assign to genuine platform domains, branding, and shared-content pages.","A legitimate-domain URL can remove common warning signs such as a lookalike address or certificate warning, even when the page contains malicious instructions.","The malicious content may remain online for only hours or days, making rapid reports to platform providers important even after a specific page is removed.","Search placement is a key part of the lure: attackers used sponsored results and search-result manipulation to reach people already seeking installation or troubleshooting help.","Clipboard-pasted commands are a practical control point because several campaigns depended on convincing victims to run Terminal commands."],"referencedReports":[],"body":"\u003cp\u003eHuntress reported that threat actors are abusing trusted AI-platform features, including Claude Artifacts, claude.ai/share links, and shared ChatGPT and Grok conversations, to distribute malware. Rather than compromising the AI providers or their models, the campaigns rely on users trusting familiar domains, branding, and AI-generated content. Attackers have also used sponsored search results and search-result manipulation to direct people seeking software downloads or troubleshooting advice to malicious pages.\u003c/p\u003e\n\n\u003cp\u003eIn the FakeAgent campaign, a fraudulent Claude Desktop download page hosted as a Claude Artifact redirected victims to SectopRAT and affected more than 29 organizations. Other campaigns used a fake Claude-on-Mac installation guide to deploy the MacSync stealer, and shared ChatGPT and Grok troubleshooting pages to deliver the AMOS stealer through ClickFix-style Terminal commands. Huntress recommends restricting clipboard-based script execution, enforcing application allow-listing, monitoring for new scheduled tasks and antivirus exclusions, training users to recognize these lures, and promptly reporting suspicious AI-hosted content.\u003c/p\u003e\n"},{"n":9,"title":"No One Inside The Machine","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/no-one-inside-the-machine/","time":"17:00","priority":"MAY READ","score":58,"tldr":"Censys research finds a growing wave of AI-built student-facing apps that collect sensitive homework, academic, camera, microphone, and admissions data without clear privacy safeguards or evidence that operators understand the infrastructure handling it. The primary risk is not conventional malware but negligent data collection enabled by low-friction app-building platforms.","briefOverview":"\u003cp\u003eCensys analyzed Internet-wide scan data to identify AI-built web applications aimed at students and children, including homework helpers, GPA calculators, scholarship matchers, essay graders, and admissions predictors. The identified sites advertise collecting academic information such as homework photos, essays, test scores, transcripts, extracurricular activities, and admissions profiles. More than 75% of the population was deployed within the prior year, and Lovable accounted for roughly 229 sites compared with 45 built with Replit.\u003c/p\u003e\n\n\u003cp\u003eCensys found direct evidence of file uploads, camera or microphone access, or storage-related capabilities in roughly 30% of its sample, while 61% of Lovable-built sites still used default Lovable social-media branding. Most sites did not show conventional malicious indicators such as phishing kits, malware delivery, or obfuscated code, but often lacked visible privacy policies while soliciting sensitive student data. One exception, Lingua AI, ran on a host with more than 30 open ports, NPS tunneling, a DERP relay endpoint, publicly displayed demo credentials, and multiple services handling student, teacher, and administrator access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys identified a population of AI-built, student-facing web applications that advertise collecting academic information such as homework, GPAs, essays, test scores, extracurricular activities, and admissions profiles.","More than 75% of the identified population was deployed within the previous year, and Lovable accounted for roughly 229 sites compared with 45 Replit sites.","Roughly 30% of the sampled sites showed direct evidence of file uploads, camera or microphone access, or storage-related features such as Supabase or Firebase.","Sixty-one percent of the Lovable-built sites still used default Lovable social-media branding, including unmodified preview images or Lovable Twitter account metadata.","Most sites showed no conventional malicious indicators, but Lingua AI was hosted on a system with more than 30 open ports, NPS tunneling, a DERP relay endpoint, and publicly displayed default demo credentials of admin / 123qwe."],"insights":["The article argues that AI app-building tools have removed the former practical barrier to creating public systems that accept strangers’ data, allowing operators to deploy authentication, uploads, and storage without necessarily understanding the resulting privacy responsibilities.","Default Lovable social-card and favicon settings appeared on many sites collecting student information, making unfinished platform branding a visible indicator that an operator may have deployed sensitive intake features with minimal customization.","Conventional threat detection produced almost no malware, phishing, or other malicious signals across the population, showing that careless collection of children’s data falls outside the threat categories those tools are designed to identify.","The article’s three-layer search method combines student-targeting language, AI-development provenance, and evidence of upload or device-access features, allowing the population to be monitored rather than treated as a one-time set of examples."],"referencedReports":[],"body":"\u003cp\u003eCensys analyzed Internet-wide scan data to identify AI-built web applications aimed at students and children, including homework helpers, GPA calculators, scholarship matchers, essay graders, and admissions predictors. The identified sites advertise collecting academic information such as homework photos, essays, test scores, transcripts, extracurricular activities, and admissions profiles. More than 75% of the population was deployed within the prior year, and Lovable accounted for roughly 229 sites compared with 45 built with Replit.\u003c/p\u003e\n\n\u003cp\u003eCensys found direct evidence of file uploads, camera or microphone access, or storage-related capabilities in roughly 30% of its sample, while 61% of Lovable-built sites still used default Lovable social-media branding. Most sites did not show conventional malicious indicators such as phishing kits, malware delivery, or obfuscated code, but often lacked visible privacy policies while soliciting sensitive student data. One exception, Lingua AI, ran on a host with more than 30 open ports, NPS tunneling, a DERP relay endpoint, publicly displayed demo credentials, and multiple services handling student, teacher, and administrator access.\u003c/p\u003e\n"},{"n":11,"title":"Hunting LDAP Injection Canaries on Port 389 | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/ldap-fuzzers-injection-canaries","time":"15:54","priority":"MAY READ","score":45,"tldr":"Corelight explains how to detect LDAP injection attempts by hunting for canary patterns in LDAP traffic on port 389, helping defenders identify potential directory-service abuse.","briefOverview":"\u003cp\u003eThe article is title
