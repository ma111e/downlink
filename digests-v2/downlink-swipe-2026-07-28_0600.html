<script type="application/json" id="dl-articles">[{"n":4,"title":"Critical TeamCity Flaw Could Let Attackers Run OS Commands Without Logging In","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/critical-teamcity-flaw-could-let.html","time":"08:11","priority":"MUST READ","score":93,"tldr":"JetBrains fixed a critical TeamCity On-Premises flaw, CVE-2026-63077, that could let unauthenticated attackers execute operating system commands via HTTP(S). Customers should upgrade to versions 2025.11.7 or 2026.1.3, or apply the security patch plugin if they cannot update immediately.","briefOverview":"\u003cp\u003eJetBrains is urging customers of on-premise versions of TeamCity to update after the discovery of a critical security issue that could lead to arbitrary code execution. The vulnerability is tracked as CVE-2026-63077 and has a CVSS score of 9.8. It affects all TeamCity On-Premises versions and has been addressed in versions 2025.11.7 and 2026.1.3. TeamCity Cloud instances have already been updated.\u003c/p\u003e\n\n\u003cp\u003eJetBrains said the flaw could allow an unauthenticated attacker with HTTP(S) access to a TeamCity server to bypass authentication checks and execute operating system commands with the privileges of the TeamCity server process. The issue involves unauthenticated remote code execution via the agent polling protocol. A successful compromise could expose TeamCity data, configurations, and stored credentials, or allow modification of server state. JetBrains has also released a security patch plugin for versions 2017.1 and later, and said there is no evidence the flaw has been exploited in the wild.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JetBrains is urging customers of on-premise versions of TeamCity to update after discovering a critical security issue that could allow arbitrary code execution.","The vulnerability, tracked as CVE-2026-63077 with a CVSS score of 9.8, affects all TeamCity On-Premises versions and has been fixed in versions 2025.11.7 and 2026.1.3.","JetBrains said an unauthenticated attacker with HTTP(S) access to a TeamCity server could bypass authentication checks and execute operating system commands with the privileges of the TeamCity server process.","JetBrains has released a security patch plugin for TeamCity versions 2017.1 and later for customers who cannot apply a full update.","JetBrains said there is no evidence that CVE-2026-63077 has been exploited in the wild."],"insights":["Customers who cannot immediately upgrade still have a mitigation path because JetBrains released a dedicated security patch plugin for TeamCity versions 2017.1 and later.","The risk depends in part on how much privilege the TeamCity server process has, because successful command execution would run with those same privileges.","JetBrains specifically warns that even exposing the TeamCity login screen or REST API can create entry points for attackers, so limiting internet-facing access is an actionable defensive step.","The security patch plugin only fixes CVE-2026-63077, so JetBrains still recommends upgrading to the latest version to receive other security updates."],"referencedReports":[{"title":"CVE-2026-63077","url":"https://blog.jetbrains.com/teamcity/2026/07/cve-2026-63077/","publisher":"JetBrains","context":"The article cites JetBrains' advisory urging TeamCity On-Premises customers to update after disclosure of CVE-2026-63077.","category":"advisory","primary":true}],"body":"\u003cp\u003eJetBrains is urging customers of on-premise versions of TeamCity to update after the discovery of a critical security issue that could lead to arbitrary code execution. The vulnerability is tracked as CVE-2026-63077 and has a CVSS score of 9.8. It affects all TeamCity On-Premises versions and has been addressed in versions 2025.11.7 and 2026.1.3. TeamCity Cloud instances have already been updated.\u003c/p\u003e\n\n\u003cp\u003eJetBrains said the flaw could allow an unauthenticated attacker with HTTP(S) access to a TeamCity server to bypass authentication checks and execute operating system commands with the privileges of the TeamCity server process. The issue involves unauthenticated remote code execution via the agent polling protocol. A successful compromise could expose TeamCity data, configurations, and stored credentials, or allow modification of server state. JetBrains has also released a security patch plugin for versions 2017.1 and later, and said there is no evidence the flaw has been exploited in the wild.\u003c/p\u003e\n"},{"n":1,"title":"Data breach at medical billing firm MCBS affects 1.26 million people","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/data-breach-at-medical-billing-firm-mcbs-affects-126-million-people/","time":"09:10","priority":"MUST READ","score":92,"tldr":"Medical billing firm MCBS disclosed that a 2025 network breach exposed sensitive personal and medical information for 1,261,464 people. The PEAR ransomware group claims it stole 3.3 TB of data, which has reportedly been leaked online.","briefOverview":"\u003cp\u003eMedical Computer Business Services disclosed that a 2025 network breach exposed sensitive information belonging to 1,261,464 people. MCBS is a regional private medical billing and practice-management company headquartered in Augusta, Georgia. The company provides billing, coding, accounts receivable, financial, and administrative services to healthcare organizations and processes patient records for healthcare providers.\u003c/p\u003e\n\n\u003cp\u003eMCBS said threat actors gained unauthorized access to its network between September 22 and 26, 2025. After investigating the incident, the company completed its review on May 28 and determined that exposed data may include names, addresses, Social Security numbers, dates of birth, health plan and insurance identifiers, medical history, medical treatment information, condition details, and diagnosis information. The exposed data varies by individual.\u003c/p\u003e\n\n\u003cp\u003eThe notice lists seven covered entities whose patient data MCBS handled as a business associate, including South Georgia Radiology Consultants, SkinPath Solutions, Stephen W. Brown, and Radiology Associates. MCBS urged potentially impacted individuals to place a fraud alert and consider a security freeze on their credit file. The PEAR ransomware group claimed the attack and alleged it exfiltrated 3.3 terabytes of data from MCBS systems, but BleepingComputer said it did not examine the leaked cache and could not validate its authenticity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Medical Computer Business Services disclosed that a 2025 network breach exposed sensitive information belonging to 1,261,464 people.","MCBS said unauthorized actors accessed its network between September 22 and 26, 2025, and the company completed its investigation on May 28 this year.","The exposed data may include full names, physical addresses, Social Security numbers, dates of birth, health insurance identifiers, medical histories, conditions, treatments, and diagnosis information, depending on the individual.","The notice lists seven covered entities whose patient data MCBS handled as a business associate, including South Georgia Radiology Consultants, SkinPath Solutions, Stephen W. Brown, and Radiology Associates.","The PEAR ransomware group claimed responsibility for the attack and alleged it exfiltrated 3.3 terabytes of data from MCBS systems."],"insights":["MCBS initially disclosed the incident without saying how many people were affected, but its filing with the U.S. Department of Health and Human Services later showed the impact was more than 1.26 million people.","The exposed information is especially sensitive because it may combine identity data, insurance identifiers, and medical details such as diagnoses, treatment information, and mental or physical condition.","People who received medical services in Georgia may be affected even if they do not directly recognize MCBS, because the company handled patient data for healthcare providers as a business associate.","The ransomware group claims to have stolen broader categories of data than MCBS listed in its public notice, including human resources data, payment information, email correspondence, and databases, although BleepingComputer said it did not validate the leaked cache."],"referencedReports":[],"body":"\u003cp\u003eMedical Computer Business Services disclosed that a 2025 network breach exposed sensitive information belonging to 1,261,464 people. MCBS is a regional private medical billing and practice-management company headquartered in Augusta, Georgia. The company provides billing, coding, accounts receivable, financial, and administrative services to healthcare organizations and processes patient records for healthcare providers.\u003c/p\u003e\n\n\u003cp\u003eMCBS said threat actors gained unauthorized access to its network between September 22 and 26, 2025. After investigating the incident, the company completed its review on May 28 and determined that exposed data may include names, addresses, Social Security numbers, dates of birth, health plan and insurance identifiers, medical history, medical treatment information, condition details, and diagnosis information. The exposed data varies by individual.\u003c/p\u003e\n\n\u003cp\u003eThe notice lists seven covered entities whose patient data MCBS handled as a business associate, including South Georgia Radiology Consultants, SkinPath Solutions, Stephen W. Brown, and Radiology Associates. MCBS urged potentially impacted individuals to place a fraud alert and consider a security freeze on their credit file. The PEAR ransomware group claimed the attack and alleged it exfiltrated 3.3 terabytes of data from MCBS systems, but BleepingComputer said it did not examine the leaked cache and could not validate its authenticity.\u003c/p\u003e\n"},{"n":5,"title":"Mirage Kitten targets Middle East and Africa region with new malware","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/mirage-kitten-new-tools/120811/","time":"08:00","priority":"SHOULD READ","score":86,"tldr":"Kaspersky researchers uncovered new Mirage Kitten malware used in targeted cyber-espionage against aerospace, aviation, defense, telecom, government, and financial organizations across the Middle East and Africa. The toolset includes the NightLedger Windows backdoor and WebSocket-based tunnelers BridgeHead and ArcBridge for persistent access, reconnaissance, command execution, file theft, and covert network tunneling.","briefOverview":"\u003cp\u003eKaspersky identified a previously undocumented malware set developed and used by Mirage Kitten, also known as UNC1549, Smoke Sandstorm, and Nimbus Manticore. The group conducts cyber-espionage operations against aerospace, aviation, defense, and telecommunications sectors across the Middle East and Africa. The newly described toolset includes NightLedger, a Windows backdoor, and two WebSocket-based tunnelers named ArcBridge and BridgeHead.\u003c/p\u003e\n\n\u003cp\u003eNightLedger masquerades as \u003ccode\u003eSspiCli.dll\u003c/code\u003e and appears designed for DLL search-order hijacking with a legitimate \u003ccode\u003eAppVShNotify.exe\u003c/code\u003e binary. It creates a mutex to ensure a single running instance, communicates with command-and-control servers over HTTPS, and supports commands for reconnaissance, process execution, file operations, screenshot capture, process listing, and collection of \u003ccode\u003eC:\\Windows\\debug\\NetSetup.log\u003c/code\u003e. BridgeHead and ArcBridge provide covert tunneling capabilities, with BridgeHead functioning as a SOCKS5 tunnel proxy over an authenticated WebSocket channel.\u003c/p\u003e\n\n\u003cp\u003eThe article says BridgeHead was deployed during post-exploitation activity in victim environments in Egypt and at a Pakistan-based aerospace and aviation organization. Kaspersky telemetry also identified victims in Jordan, Tanzania, Ethiopia, and Burkina Faso, including government, SMB, aviation, telecommunications, and financial-sector entities. The campaign shows Mirage Kitten continuing to rely on custom backdoors and tunneling tools while shifting some infrastructure away from Microsoft Azure subdomain-style hosting toward Cloudflare-backed domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified a previously undocumented malware set developed and used by Mirage Kitten, including the NightLedger Windows backdoor and the ArcBridge and BridgeHead WebSocket-based tunnelers.","NightLedger masquerades as SspiCli.dll, appears designed for DLL search-order hijacking against AppVShNotify.exe, creates the mutex A8215357-F99A-44FE-BC65-D8F0434B0C03, and contacts realhealthshop.com with tjconsultingservices.com as a fallback command-and-control domain.","NightLedger supports commands for user and host reconnaissance, process execution, directory listing, file download and upload, screenshot capture, DLL loading, process termination, logical drive enumeration, process listing, and collection of C:\\Windows\\debug\\NetSetup.log.","BridgeHead was deployed during post-exploitation activity in victim environments in Egypt and at a Pakistan-based aerospace and aviation organization, and it functions as a SOCKS5 tunnel proxy over an authenticated WebSocket channel.","Kaspersky telemetry identified victims across Egypt, Jordan, Tanzania, Pakistan, Ethiopia, and Burkina Faso, including government, SMB, aviation, telecommunication, and financial-sector entities."],"insights":["BridgeHead variants include a hardcoded username substring check before activation, showing that some deployed binaries were tailored to specific victim machines and may silently fail in generic analysis environments.","BridgeHead is built to work through corporate proxy environments by handling HTTP 407 responses and using Windows-integrated authentication with Negotiate preferred over NTLM, which makes ordinary enterprise proxy controls less likely to block its outbound channel.","NightLedger’s collection of C:\\Windows\\debug\\NetSetup.log is notable because that log can contain information from domain or workgroup join and related network setup operations, giving operators additional context about the victim’s Windows environment.","Mirage Kitten’s NightLedger command format resembles the older TWOSTROKE backdoor, while BridgeHead’s proxy traversal logic closely mirrors Retrograde, indicating continuity in the group’s custom tooling despite the introduction of new malware names.","The article notes a gradual shift away from Microsoft Azure subdomain-style infrastructure toward Cloudflare-backed domains in some malware, suggesting defenders should not rely only on previously observed Azure-hosted patterns when hunting this activity."],"referencedReports":[{"title":"Tracking Iran APT Screening Serpens","url":"https://unit42.paloaltonetworks.com/tracking-iran-apt-screening-serpens/","publisher":"Unit 42","context":"The article cites Unit 42 reporting on Mirage Kitten-related spear-phishing activity and later references the same reporting in relation to MiniUpdate tooling.","category":"research","primary":false},{"title":"Fast and Furious: Nimbus Manticore Operations During the Iranian Conflict","url":"https://research.checkpoint.com/2026/fast-and-furious-nimbus-manticore-operations-during-the-iranian-conflict/","publisher":"Check Point Research","context":"The article cites Check Point Research reporting on similar targeted social engineering activity and later references the same reporting in relation to MiniFast tooling.","category":"research","primary":false},{"title":"Analysis of UNC1549 TTPs Targeting Aerospace Defense","url":"https://cloud.google.com/blog/topics/threat-intelligence/analysis-of-unc1549-ttps-targeting-aerospace-defense","publisher":"Google Threat Intelligence Group","context":"The article references GTIG's prior documentation of TWOSTROKE, a backdoor attributed to the same APT group, when comparing NightLedger's command-and-control response format.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky identified a previously undocumented malware set developed and used by Mirage Kitten, also known as UNC1549, Smoke Sandstorm, and Nimbus Manticore. The group conducts cyber-espionage operations against aerospace, aviation, defense, and telecommunications sectors across the Middle East and Africa. The newly described toolset includes NightLedger, a Windows backdoor, and two WebSocket-based tunnelers named ArcBridge and BridgeHead.\u003c/p\u003e\n\n\u003cp\u003eNightLedger masquerades as \u003ccode\u003eSspiCli.dll\u003c/code\u003e and appears designed for DLL search-order hijacking with a legitimate \u003ccode\u003eAppVShNotify.exe\u003c/code\u003e binary. It creates a mutex to ensure a single running instance, communicates with command-and-control servers over HTTPS, and supports commands for reconnaissance, process execution, file operations, screenshot capture, process listing, and collection of \u003ccode\u003eC:\\Windows\\debug\\NetSetup.log\u003c/code\u003e. BridgeHead and ArcBridge provide covert tunneling capabilities, with BridgeHead functioning as a SOCKS5 tunnel proxy over an authenticated WebSocket channel.\u003c/p\u003e\n\n\u003cp\u003eThe article says BridgeHead was deployed during post-exploitation activity in victim environments in Egypt and at a Pakistan-based aerospace and aviation organization. Kaspersky telemetry also identified victims in Jordan, Tanzania, Ethiopia, and Burkina Faso, including government, SMB, aviation, telecommunications, and financial-sector entities. The campaign shows Mirage Kitten continuing to rely on custom backdoors and tunneling tools while shifting some infrastructure away from Microsoft Azure subdomain-style hosting toward Cloudflare-backed domains.\u003c/p\u003e\n"},{"n":2,"title":"Researcher Says AI Helped Develop Linux Traffic-Control Race Into Root Exploit","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-says-ai-helped-develop-linux.html","time":"08:04","priority":"SHOULD READ","score":82,"tldr":"STAR Labs published exploit code for CVE-2026-53264, a Linux kernel traffic-control use-after-free race that can let a local user gain root on vulnerable systems under specific conditions. Users should apply distribution kernel updates, as public exploit code increases risk even though no in-the-wild exploitation has been reported.","briefOverview":"\u003cp\u003eSTAR Labs published a Linux kernel exploit for CVE-2026-53264, a use-after-free race in the network traffic-control subsystem that can turn a local user into root on the CentOS Stream 9 build it targeted. Researcher Lee Jia Jie said AI helped him find the bug, create a Kernel Address Sanitizer proof of concept, and optimize the race window, though he said human judgment remained necessary. The issue is local privilege escalation rather than remote code execution, so an attacker needs an existing foothold on the machine.\u003c/p\u003e\n\n\u003cp\u003eThe demonstrated exploit requires unprivileged user namespaces, the CONFIG_NET_ACT_GACT and CONFIG_NET_CLS_FLOWER kernel options, and a kernel-specific return-oriented programming chain with hardcoded offsets. It creates user and network namespaces to gain namespace-local CAP_NET_ADMIN, reaches the vulnerable path through clsact and flower, and uses timerfd, epoll, and key payload allocations to help win the race and reclaim the freed object. The exploit then overwrites core_pattern and uses a memfd-backed copy of itself as the root core-dump handler in the initial namespace.\u003c/p\u003e\n\n\u003cp\u003eThe upstream fix landed on June 1, 2026, and was backported to several stable kernel branches, with fixed releases listed as 5.10.259, 5.15.210, 6.1.176, 6.6.143, 6.12.94, 6.18.36, and 7.0.13, and the mainline fix entering 7.1-rc7. The article says users should install distribution kernels carrying the fix rather than rely only on upstream version numbers, because distribution status was uneven across Debian, Ubuntu, and SUSE as of July 28. The Hacker News found no CISA Known Exploited Vulnerabilities catalog entry and no official report of exploitation in the wild as of July 28, 2026, but public exploit code raises urgency for compatible unpatched systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["STAR Labs published exploit code for CVE-2026-53264, a Linux kernel traffic-control use-after-free race that can turn a local user into root on the targeted CentOS Stream 9 build.","Researcher Lee Jia Jie said AI helped with vulnerability discovery, producing a Kernel Address Sanitizer proof of concept, and optimizing the race window, while human judgment remained necessary throughout the work.","The demonstrated exploit requires a local foothold, unprivileged user namespaces, specific kernel options, and a kernel-specific return-oriented programming chain with hardcoded offsets.","The upstream fix landed on June 1, 2026, and fixed releases include 5.10.259, 5.15.210, 6.1.176, 6.6.143, 6.12.94, 6.18.36, and 7.0.13, with the mainline fix entering 7.1-rc7.","The Hacker News found no CISA Known Exploited Vulnerabilities catalog entry and no official report of exploitation in the wild as of July 28, 2026."],"insights":["The article cautions that Lee Jia Jie's AI-assisted discovery is difficult to evaluate as a benchmark because the model, prompts, service, and interaction record were not disclosed.","The practical exposure is narrower than the phrase “Linux root exploit” suggests because the exploit depends on unprivileged user namespaces, specific kernel options, and kernel-specific hardcoded offsets.","Users are advised to rely on distribution kernel updates rather than upstream kernel version numbers alone, because distribution patch status varied across Debian, Ubuntu, and SUSE as of July 28, 2026.","The exploit’s need for rebuilding against other kernel packages may limit portability, even though Lee reported 10 successful runs on the tested CentOS Stream 9 laptop.","The public exploit demonstrates that namespace-local privileges can be enough to reach the vulnerable traffic-control path without host administrator rights when unprivileged user namespaces are enabled."],"referencedReports":[{"title":"When AI Makes 0-days Feel Like N-days","url":"https://starlabs.sg/blog/2026/07-when-ai-makes-0-days-feel-like-n-days/","publisher":"STAR Labs","context":"The article cites Lee Jia Jie’s technical write-up describing AI assistance in vulnerability discovery, KASAN proof-of-concept creation, and race-window optimization.","category":"research","primary":true},{"title":"CVE-2026-53264","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-53264","publisher":"Linux CNA / NVD","context":"The article references the Linux CNA record for the vulnerable Linux kernel ranges and fixed releases.","category":"advisory","primary":true},{"title":"Debian Security Tracker: CVE-2026-53264","url":"https://security-tracker.debian.org/tracker/CVE-2026-53264","publisher":"Debian","context":"The article cites Debian’s tracker as listing fixed kernels for supported stable releases.","category":"advisory","primary":false},{"title":"Ubuntu Security: CVE-2026-53264","url":"https://ubuntu.com/security/CVE-2026-53264","publisher":"Ubuntu","context":"The article cites Ubuntu’s security page as still marking multiple maintained kernel packages vulnerable.","category":"advisory","primary":false},{"title":"SUSE CVE-2026-53264","url":"https://www.suse.com/security/cve/CVE-2026-53264.html","publisher":"SUSE","context":"The article cites SUSE’s CVE page as listing the issue as pending across multiple products and assigning a separate 5.5 score.","category":"advisory","primary":false}],"body":"\u003cp\u003eSTAR Labs published a Linux kernel exploit for CVE-2026-53264, a use-after-free race in the network traffic-control subsystem that can turn a local user into root on the CentOS Stream 9 build it targeted. Researcher Lee Jia Jie said AI helped him find the bug, create a Kernel Address Sanitizer proof of concept, and optimize the race window, though he said human judgment remained necessary. The issue is local privilege escalation rather than remote code execution, so an attacker needs an existing foothold on the machine.\u003c/p\u003e\n\n\u003cp\u003eThe demonstrated exploit requires unprivileged user namespaces, the CONFIG_NET_ACT_GACT and CONFIG_NET_CLS_FLOWER kernel options, and a kernel-specific return-oriented programming chain with hardcoded offsets. It creates user and network namespaces to gain namespace-local CAP_NET_ADMIN, reaches the vulnerable path through clsact and flower, and uses timerfd, epoll, and key payload allocations to help win the race and reclaim the freed object. The exploit then overwrites core_pattern and uses a memfd-backed copy of itself as the root core-dump handler in the initial namespace.\u003c/p\u003e\n\n\u003cp\u003eThe upstream fix landed on June 1, 2026, and was backported to several stable kernel branches, with fixed releases listed as 5.10.259, 5.15.210, 6.1.176, 6.6.143, 6.12.94, 6.18.36, and 7.0.13, and the mainline fix entering 7.1-rc7. The article says users should install distribution kernels carrying the fix rather than rely only on upstream version numbers, because distribution status was uneven across Debian, Ubuntu, and SUSE as of July 28. The Hacker News found no CISA Known Exploited Vulnerabilities catalog entry and no official report of exploitation in the wild as of July 28, 2026, but public exploit code raises urgency for compatible unpatched systems.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft Says New Cybersecurity AI Model Helps MDASH Hit 95.95% at Half the Cost","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-says-new-cybersecurity-ai.html","time":"06:07","priority":"MAY READ","score":68,"tldr":"Microsoft launched MAI-Cyber-1-Flash inside its MDASH vulnerability-remediation system, claiming a 95.95% CyberGym score at half the cost by routing most tasks to the smaller cybersecurity model and reserving GPT-5.4 for harder cases. The result is a system-level benchmark, not a standalone score for the new model, and Microsoft has not disclosed enough details for independent cost or performance verification.","briefOverview":"\u003cp\u003eMicrosoft has launched MAI-Cyber-1-Flash, its first cybersecurity-specific model inside MDASH, a multi-model system for vulnerability identification and remediation. Microsoft says MDASH using MAI-Cyber-1-Flash and GPT-5.4 scored 95.95% on CyberGym while costing 50% less than its current best MDASH combination of GPT-5.4, GPT-5.4 mini, and GPT-5.3 Codex. Access is limited to approved MDASH customers through an Azure AI Foundry private preview.\u003c/p\u003e\n\n\u003cp\u003eThe reported CyberGym score belongs to the MDASH system running MAI-Cyber-1-Flash with GPT-5.4, not to the new model by itself. CyberGym Level 1 tests whether an agent can reproduce known vulnerabilities from a description and unpatched source code, but it does not measure blind vulnerability discovery or whether a generated patch is correct. The public CyberGym leaderboard did not list Microsoft’s 95.95% result when checked on July 28, 2026, and Microsoft’s public materials do not say whether the result was submitted for listing.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s model card describes MAI-Cyber-1-Flash as a sparse mixture-of-experts transformer with 137 billion total parameters, five billion active parameters, and a 256,000-token context window. The disclosed design centers on routing: MAI-Cyber-1-Flash is intended to handle most MDASH tasks, while GPT-5.4 is reserved for the hardest remainder. Microsoft says all benchmark testing occurred in a network-isolated environment, and the model card warns that generated text and code may be inaccurate or incomplete and should be reviewed before consequential use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft launched MAI-Cyber-1-Flash, its first cybersecurity-specific model inside MDASH, its multi-model vulnerability identification and remediation harness.","Microsoft says MDASH using MAI-Cyber-1-Flash and GPT-5.4 scored 95.95% on CyberGym and costs 50% less than its current best MDASH combination of GPT-5.4, GPT-5.4 mini, and GPT-5.3 Codex.","The 95.95% CyberGym score belongs to MDASH running MAI-Cyber-1-Flash alongside GPT-5.4, not to MAI-Cyber-1-Flash by itself.","CyberGym’s public leaderboard did not list Microsoft’s 95.95% result when checked on July 28, 2026, and Microsoft’s public materials do not say whether the result was submitted for listing.","Microsoft’s model card says MAI-Cyber-1-Flash is a sparse mixture-of-experts transformer with 137 billion total parameters, five billion active parameters, and a 256,000-token context window."],"insights":["Microsoft’s claimed 95.95% result is difficult to compare with public competitors because CyberGym’s leaderboard did not show the score when checked, and Microsoft has not said whether it submitted the result for listing.","The cost-saving claim cannot be independently reproduced from Microsoft’s disclosures because the announcement and model card do not provide token use, call volume, latency, task mix, or compute allocation.","The benchmark mainly shows performance on reproducing known vulnerabilities from descriptions and unpatched code, not on finding unknown flaws or proving that generated fixes are correct.","Microsoft’s earlier 96.55% MDASH result is not a clear performance baseline because it counted any crash, including non-target vulnerabilities, and Microsoft has not said whether the new 95.95% result used the same criterion.","The model’s zero scores across ExploitGym’s kernel, userspace, and browser categories show that its reported CyberGym performance does not imply success at turning crashes into working code-execution exploits."],"referencedReports":[{"title":"MAI-Cyber-1-Flash Model Card","url":"https://microsoft.ai/pdf/MAI-Cyber-1-Flash-Model-Card.pdf","publisher":"Microsoft","context":"The article cites Microsoft’s model card for MAI-Cyber-1-Flash to describe the model architecture, benchmark results, testing environment, and limitations.","category":"research","primary":true},{"title":"MAI-Code-1-Flash Model Card","url":"https://microsoft.ai/pdf/MAI-Code-1-Flash-Model-Card.PDF","publisher":"Microsoft","context":"The article references the MAI-Code-1-Flash model card when explaining that MAI-Cyber-1-Flash is a cybersecurity fine-tune of MAI-Code-1-Flash.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft has launched MAI-Cyber-1-Flash, its first cybersecurity-specific model inside MDASH, a multi-model system for vulnerability identification and remediation. Microsoft says MDASH using MAI-Cyber-1-Flash and GPT-5.4 scored 95.95% on CyberGym while costing 50% less than its current best MDASH combination of GPT-5.4, GPT-5.4 mini, and GPT-5.3 Codex. Access is limited to approved MDASH customers through an Azure AI Foundry private preview.\u003c/p\u003e\n\n\u003cp\u003eThe reported CyberGym score belongs to the MDASH system running MAI-Cyber-1-Flash with GPT-5.4, not to the new model by itself. CyberGym Level 1 tests whether an agent can reproduce known vulnerabilities from a description and unpatched source code, but it does not measure blind vulnerability discovery or whether a generated patch is correct. The public CyberGym leaderboard did not list Microsoft’s 95.95% result when checked on July 28, 2026, and Microsoft’s public materials do not say whether the result was submitted for listing.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s model card describes MAI-Cyber-1-Flash as a sparse mixture-of-experts transformer with 137 billion total parameters, five billion active parameters, and a 256,000-token context window. The disclosed design centers on routing: MAI-Cyber-1-Flash is intended to handle most MDASH tasks, while GPT-5.4 is reserved for the hardest remainder. Microsoft says all benchmark testing occurred in a network-isolated environment, and the model card warns that generated text and code may be inaccurate or incomplete and should be reviewed before consequential use.\u003c/p\u003e\n"}]</script>
