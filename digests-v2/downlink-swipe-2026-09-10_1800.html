<script type="application/json" id="dl-articles">[{"n":6,"title":"IDScan confirms breach after hackers offer 153 million driver’s license scans for sale ","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/idscan-data-breach-notice-drivers-licenses","time":"18:55","priority":"MUST READ","score":93,"tldr":"IDScan confirmed that an unauthorized party may have accessed and copied customer data from its cloud platform, following reports that up to 153 million U.S. and Canadian driver’s license scans were being sold on a dark-web marketplace. The FBI is investigating, and IDScan says it is notifying affected individuals and offering credit monitoring.","briefOverview":"\u003cp\u003eIDScan confirmed that an unauthorized third party may have accessed or copied customer information stored in accounts on its cloud platform. The company said it became aware of the incident on or around September 1 and published a notice on September 4. The potentially affected information includes full names and driver’s license or other government-issued identification numbers, although IDScan did not state how many customers were impacted.\u003c/p\u003e\n\n\u003cp\u003eThe incident was linked to reports that the Nexus dark-web marketplace was offering access to more than 153 million driver’s license scans from U.S. and Canadian citizens. The reported database also included 10 million identification-card scans, more than three million travel documents or international IDs, and at least 579,000 medical cards; Brian Krebs authenticated samples and tied the data to IDScan. IDScan said it would notify potentially affected people and offer free credit monitoring and identity-protection services, while the FBI said it had launched an inquiry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["IDScan said an unauthorized third party may have accessed or copied customer information stored in accounts on its cloud platform.","Reports tied data offered on the Nexus dark-web marketplace to IDScan and described more than 153 million U.S. and Canadian driver’s license scans for sale.","The reported database also contained scans of 10 million identification cards, more than three million travel documents or international IDs, and at least 579,000 medical cards.","IDScan said affected data may include full names and driver’s license or other government-issued identification numbers, but it did not disclose how many customers were affected.","The FBI has said it launched an inquiry into the incident, while IDScan said it would notify potentially affected people and offer free credit monitoring and identity-protection services."],"insights":["IDScan’s breach notice was configured to discourage search-engine indexing, which made the company’s public disclosure difficult to find despite being posted on its website.","The data was not merely claimed to be stolen: journalist Brian Krebs validated samples by locating records for himself and others, then linked the database to IDScan.","IDScan emphasized that payment was required to obtain the data, but the reported database included highly sensitive identity documents and medical cards in addition to driver’s licenses.","Because IDScan is used by businesses including banks, gun stores, and cannabis retailers, the incident potentially involves identity records collected across several unrelated industries."],"referencedReports":[],"body":"\u003cp\u003eIDScan confirmed that an unauthorized third party may have accessed or copied customer information stored in accounts on its cloud platform. The company said it became aware of the incident on or around September 1 and published a notice on September 4. The potentially affected information includes full names and driver’s license or other government-issued identification numbers, although IDScan did not state how many customers were impacted.\u003c/p\u003e\n\n\u003cp\u003eThe incident was linked to reports that the Nexus dark-web marketplace was offering access to more than 153 million driver’s license scans from U.S. and Canadian citizens. The reported database also included 10 million identification-card scans, more than three million travel documents or international IDs, and at least 579,000 medical cards; Brian Krebs authenticated samples and tied the data to IDScan. IDScan said it would notify potentially affected people and offer free credit monitoring and identity-protection services, while the FBI said it had launched an inquiry.\u003c/p\u003e\n"},{"n":1,"title":"September Windows Server updates break Remote Desktop Services","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/september-windows-server-updates-break-remote-desktop-services/","time":"20:34","priority":"SHOULD READ","score":84,"tldr":"Microsoft’s September 2026 cumulative updates for Windows Server 2019, 2022, and 2025 are reportedly causing Remote Desktop Services to hang or fail, blocking new connections and sometimes requiring hard resets. Administrators report that uninstalling the affected updates restores RDS functionality, but removes the month’s security fixes.","briefOverview":"\u003cp\u003eAdministrators report that Microsoft’s September 2026 cumulative updates are causing Remote Desktop Services failures on Windows Server 2019, 2022, and 2025. Servers may operate normally for several hours after installation before remote connections begin hanging or failing. Existing sessions may also be unable to disconnect or log off correctly.\u003c/p\u003e\n\n\u003cp\u003eReports identify KB5122876 on Windows Server 2019, KB5122882 on Windows Server 2022, and KB5122871 on Windows Server 2025 as affected updates. Some organizations said all of their Terminal Servers failed within a day, dropping sessions and preventing new connections until a hard reset was performed. One administrator’s debugging suggested a deadlock between Remote Desktop and the Local Session Manager during session closure, although Microsoft had not confirmed the cause. Administrators who rolled back the updates said Remote Desktop functionality returned, but doing so also removed the September security fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Administrators report that Microsoft’s September 2026 cumulative updates are causing Remote Desktop Services failures on Windows Server 2019, 2022, and 2025.","Affected servers may work normally for several hours after installation before existing remote sessions cannot log off properly and new connections hang or fail.","Some administrators reported that Terminal Servers required a hard reset after sessions dropped and new connections became impossible.","Reports identify the affected updates as KB5122876 for Windows Server 2019, KB5122882 for Windows Server 2022, and KB5122871 for Windows Server 2025.","Administrators who removed the September updates said Remote Desktop functionality returned, but uninstalling them also removes that month’s security fixes."],"insights":["The failures may be delayed, with servers reportedly operating normally for hours after the update before remote connections begin failing.","One administrator reported that the issue began after a user logged out, after which the service crashed and no additional users could sign in.","Restarting a server did not resolve the issue for at least one affected administrator, while uninstalling the September update did.","A reported debugging result suggested a deadlock between Remote Desktop and the Local Session Manager during session closure, but Microsoft had not confirmed that this was the cause.","Removing the updates restores remote-desktop functionality according to affected administrators, but creates a tradeoff by removing the September security fixes."],"referencedReports":[],"body":"\u003cp\u003eAdministrators report that Microsoft’s September 2026 cumulative updates are causing Remote Desktop Services failures on Windows Server 2019, 2022, and 2025. Servers may operate normally for several hours after installation before remote connections begin hanging or failing. Existing sessions may also be unable to disconnect or log off correctly.\u003c/p\u003e\n\n\u003cp\u003eReports identify KB5122876 on Windows Server 2019, KB5122882 on Windows Server 2022, and KB5122871 on Windows Server 2025 as affected updates. Some organizations said all of their Terminal Servers failed within a day, dropping sessions and preventing new connections until a hard reset was performed. One administrator’s debugging suggested a deadlock between Remote Desktop and the Local Session Manager during session closure, although Microsoft had not confirmed the cause. Administrators who rolled back the updates said Remote Desktop functionality returned, but doing so also removed the September security fixes.\u003c/p\u003e\n"},{"n":5,"title":"Treasury urges banks to file cyber scam reports, noting nearly $13 billion in losses since 2023","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/treasury-urges-banks-report-cyber-scams","time":"21:15","priority":"SHOULD READ","score":82,"tldr":"FinCEN is urging financial institutions to improve reporting of scam-center activity after analyzing more than 33,000 reports tied to $12.7 billion in suspected cryptocurrency investment-scam losses since late 2023. The scams increasingly use social-engineering personas and crypto transfers, with stolen funds commonly converted to USDT and laundered through Southeast Asian criminal networks.","briefOverview":"\u003cp\u003eThe Treasury Department’s Financial Crimes Enforcement Network (FinCEN) issued an alert urging financial institutions to better identify and report activity tied to overseas scam centers. Alongside the alert, FinCEN released a study based on more than 33,000 cyber-fraud reports submitted by roughly 1,300 financial institutions between September 2023 and December 2025. The study identified about $12.7 billion in suspected cryptocurrency investment-scam losses among victims in every U.S. state and territory.\u003c/p\u003e\n\n\u003cp\u003eScammers commonly posed as romantic partners or trusted financial advisers, convincing victims to send money through bank transfers or digital assets. Traditional banks reported about \u003cspan class=\"math inline\"\u003e\\(6.4 billion in possible fraud and cryptocurrency firms reported about \\)\u003c/span\u003e5.5 billion, while scammers almost always converted stolen funds into USDT. Victims sometimes emptied retirement or investment accounts, obtained loans or second mortgages, and were later asked to pay fees to recover their money; some were then targeted again by fake asset-recovery services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FinCEN urged financial institutions to increase vigilance and reporting for schemes operated by overseas scam centers.","A FinCEN study of more than 33,000 cyber-fraud reports filed between September 2023 and December 2025 identified about $12.7 billion in suspected cryptocurrency investment-scam losses affecting victims across all U.S. states and territories.","Traditional banks reported about $6.4 billion in potential fraud, while cryptocurrency firms identified about $5.5 billion in suspected scam activity.","Scammers commonly posed as romantic partners or financial advisers and persuaded victims to send money through bank transfers or cryptocurrency.","FinCEN found that scammers almost always exchanged stolen funds for USDT, and victims often discovered the fraud only when asked to pay a fee to recover their money."],"insights":["Adults over 60 accounted for about 25% of reports, indicating that the reported victim pool was not dominated by older adults.","FinCEN received nearly 11% more suspected scam reports each month than in the prior month, reflecting a rising rate of reported activity.","Financial institutions often saw only one stage of a scam, making reporting valuable for investigators trying to connect the full movement of funds.","Some victims were targeted a second time by people posing as services that could recover money already lost in the original scam.","Reported cases included victims liquidating retirement or investment accounts, taking personal loans, and seeking second mortgages to fund purported investments."],"referencedReports":[{"title":"FinCEN Alert on Scam Centers","url":"https://www.fincen.gov/system/files/2026-08/FinCEN-Alert-Scam-Centers.pdf","publisher":"fincen","context":"FinCEN released this alert to the financial industry urging institutions to identify and report activity associated with overseas scam centers.","category":"advisory","primary":true},{"title":"Financial Trend Analysis: Digital Asset Investment Scams","url":"https://www.fincen.gov/system/files/2026-08/FinCEN-FTA-Digital-Asset-Investment-Scams.pdf","publisher":"fincen","context":"The article relies on this FinCEN study of more than 33,000 cyber-fraud reports filed between September 2023 and December 2025.","category":"research","primary":true}],"body":"\u003cp\u003eThe Treasury Department’s Financial Crimes Enforcement Network (FinCEN) issued an alert urging financial institutions to better identify and report activity tied to overseas scam centers. Alongside the alert, FinCEN released a study based on more than 33,000 cyber-fraud reports submitted by roughly 1,300 financial institutions between September 2023 and December 2025. The study identified about $12.7 billion in suspected cryptocurrency investment-scam losses among victims in every U.S. state and territory.\u003c/p\u003e\n\n\u003cp\u003eScammers commonly posed as romantic partners or trusted financial advisers, convincing victims to send money through bank transfers or digital assets. Traditional banks reported about \u003cspan class=\"math inline\"\u003e\\(6.4 billion in possible fraud and cryptocurrency firms reported about \\)\u003c/span\u003e5.5 billion, while scammers almost always converted stolen funds into USDT. Victims sometimes emptied retirement or investment accounts, obtained loans or second mortgages, and were later asked to pay fees to recover their money; some were then targeted again by fake asset-recovery services.\u003c/p\u003e\n"},{"n":4,"title":"New Android malware encrypts files, steals data, and harasses victims","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-android-malware-encrypts-files-steals-data-and-harasses-victims/","time":"21:40","priority":"SHOULD READ","score":78,"tldr":"Mantax Otax is an Android malware spread through malicious APKs that combines file encryption on Android 9 and older with extensive spying, remote control, and harassment capabilities. Avoid sideloaded apps and granting Accessibility permissions; up-to-date devices with Google Play Protect should detect and block it.","briefOverview":"\u003cp\u003eMantax Otax is a newly identified Android malware strain that combines file encryption, data theft, remote control, and harassment functions. Indonesian operators distribute it through malicious APK files hosted outside Google Play, using phishing and social-engineering messages. After installation, it requests Accessibility permissions, giving it extensive control over the device, and sends device details to command-and-control infrastructure obtained from GitHub.\u003c/p\u003e\n\n\u003cp\u003eThe ransomware component targets Android 9 and older, where it can search shared storage, encrypt selected files with a victim-specific AES key from the command server, delete the originals, and append a \u003ccode\u003e.enc\u003c/code\u003e extension. It also replaces images with ransom notices and presents a full-screen Firebase-hosted chat for payment negotiations. Zimperium found that a Firebase server misconfiguration exposed attacker communications with victims.\u003c/p\u003e\n\n\u003cp\u003eIn addition to encrypting files, Mantax Otax can steal lock-screen PINs, SMS messages and one-time passwords, call logs, contacts, browsing history, account information, location data, WhatsApp content, and Telegram chats. It can capture screenshots, record and stream the screen, take photos with device cameras, and use repeated pop-ups, videos, image overlays, and text-to-speech messages to intimidate victims. Zimperium says up-to-date Android devices with active Google Play Protect detect and block the malware, and users are advised not to install APKs from outside Google Play or grant questionable apps Accessibility permissions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mantax Otax is an Android malware strain that combines file encryption, data theft, remote control, and victim-harassment capabilities.","Indonesian operators distribute Mantax Otax through malicious APK files hosted outside Google Play, using phishing and social-engineering messages.","The malware encrypts selected shared-storage files on Android 9 and older, deletes the originals, adds a .enc extension, and replaces local images with ransom notices.","Mantax Otax can steal lock-screen PINs, SMS messages and one-time passwords, call logs, contacts, browsing history, account details, location data, WhatsApp content, and Telegram chats.","Up-to-date Android devices with active Google Play Protect detect and block Mantax Otax, according to Zimperium."],"insights":["Mantax Otax’s file-encryption function is limited largely to Android 9 and earlier because Android 10’s storage restrictions prevent it from broadly encrypting shared files.","The malware obtains a victim-specific encryption key from its command server, meaning affected files are encrypted with a key tied to that individual victim.","Researchers accessed attacker-victim chats because the malware operators’ Firebase command server was misconfigured, exposing their communications.","Beyond stealing data, version 2 uses repeated pop-ups, full-screen videos, sudden image overlays, and device-spoken messages to intimidate victims into paying.","The malware’s ability to steal screen-lock PINs is intended to help it retain access to a compromised device."],"referencedReports":[{"title":"Mantax Otax: Indonesian Mobile Ransomware with Spyware Integration","url":"https://zimperium.com/blog/mantax-otax-indonesian-mobile-ransomware-with-spyware-integration","publisher":"zimperium","context":"The article relies on Zimperium researchers' technical analysis for details of the malware's distribution, encryption behavior, spying capabilities, and exposed Firebase communications.","category":"research","primary":true}],"body":"\u003cp\u003eMantax Otax is a newly identified Android malware strain that combines file encryption, data theft, remote control, and harassment functions. Indonesian operators distribute it through malicious APK files hosted outside Google Play, using phishing and social-engineering messages. After installation, it requests Accessibility permissions, giving it extensive control over the device, and sends device details to command-and-control infrastructure obtained from GitHub.\u003c/p\u003e\n\n\u003cp\u003eThe ransomware component targets Android 9 and older, where it can search shared storage, encrypt selected files with a victim-specific AES key from the command server, delete the originals, and append a \u003ccode\u003e.enc\u003c/code\u003e extension. It also replaces images with ransom notices and presents a full-screen Firebase-hosted chat for payment negotiations. Zimperium found that a Firebase server misconfiguration exposed attacker communications with victims.\u003c/p\u003e\n\n\u003cp\u003eIn addition to encrypting files, Mantax Otax can steal lock-screen PINs, SMS messages and one-time passwords, call logs, contacts, browsing history, account information, location data, WhatsApp content, and Telegram chats. It can capture screenshots, record and stream the screen, take photos with device cameras, and use repeated pop-ups, videos, image overlays, and text-to-speech messages to intimidate victims. Zimperium says up-to-date Android devices with active Google Play Protect detect and block the malware, and users are advised not to install APKs from outside Google Play or grant questionable apps Accessibility permissions.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft Excel KB5002914 update breaks copy and paste for some users","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-excel-kb5002914-update-breaks-copy-and-paste-for-some-users/","time":"19:07","priority":"MAY READ","score":72,"tldr":"Microsoft's KB5002914 Office security update is reportedly breaking Excel copy-and-paste, autofill, and formula dragging for some users across several Office versions. Affected users say uninstalling the update or rolling back Click-to-Run builds restores functionality, while Microsoft has not yet issued an official response.","briefOverview":"\u003cp\u003eMicrosoft\u0026rsquo;s KB5002914 Office security update, released as part of the September 2026 Patch Tuesday, is reportedly causing Excel copy-and-paste, autofill, and formula-dragging functions to fail for some users. Reports appeared on Reddit and Microsoft Q\u0026amp;A, including claims that teams were blocked after many employees installed the update. The reported impact spans Office versions from 2016 through 2024, including Office LTSC Standard 2021 and both MSI and Click-to-Run installations.\u003c/p\u003e\n\n\u003cp\u003eAffected users say removing KB5002914 from MSI-based installations restores normal Excel functionality, while Click-to-Run users reported success by downgrading their Office build through XML or Group Policy. BleepingComputer tested Excel 2019 Version 2508, Build 19127.20302 Click-to-Run and could not reproduce the issue. The publication cautioned against replacing only the updated excel.exe file with an older version because mismatched Office files could introduce stability, compatibility, or security problems, and said Microsoft had been contacted for comment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft's KB5002914 Office security update has been reported to break copy-and-paste, autofill, and formula-dragging functions in Excel for some users.","Reports appeared on Reddit and Microsoft Q\u0026A, with affected users describing problems across Office versions from 2016 through 2024, including MSI and Click-to-Run installations.","BleepingComputer tested Excel 2019 Version 2508 Build 19127.20302 Click-to-Run but could not reproduce the reported copy-and-paste or autofill issues.","Affected users report that uninstalling KB5002914 from MSI-based Office installations or downgrading Click-to-Run Office builds restores Excel functionality.","BleepingComputer advised against replacing only the updated Excel executable with an older version because mismatched Office files could create stability, compatibility, or security problems."],"insights":["The reported issue appears to span both MSI and Click-to-Run Office installations and multiple Office releases, so it is not limited to one distribution method or version.","The issue was not reproduced in BleepingComputer's test of Excel 2019 Version 2508 Build 19127.20302, indicating that the reported behavior may not affect every installation.","For MSI-based installations, affected users reported that removing KB5002914 restored normal Excel behavior; Click-to-Run users reported that rolling back to an earlier Office build did the same.","Replacing only excel.exe with an older copy is a shared workaround, but BleepingComputer cautions that it can leave Office with mismatched files and create stability, compatibility, or security issues."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft\u0026rsquo;s KB5002914 Office security update, released as part of the September 2026 Patch Tuesday, is reportedly causing Excel copy-and-paste, autofill, and formula-dragging functions to fail for some users. Reports appeared on Reddit and Microsoft Q\u0026amp;A, including claims that teams were blocked after many employees installed the update. The reported impact spans Office versions from 2016 through 2024, including Office LTSC Standard 2021 and both MSI and Click-to-Run installations.\u003c/p\u003e\n\n\u003cp\u003eAffected users say removing KB5002914 from MSI-based installations restores normal Excel functionality, while Click-to-Run users reported success by downgrading their Office build through XML or Group Policy. BleepingComputer tested Excel 2019 Version 2508, Build 19127.20302 Click-to-Run and could not reproduce the issue. The publication cautioned against replacing only the updated excel.exe file with an older version because mismatched Office files could introduce stability, compatibility, or security problems, and said Microsoft had been contacted for comment.\u003c/p\u003e\n"},{"n":3,"title":"Surfshark VPN says hackers breached internal testing, proxy servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/surfshark-vpn-says-hackers-breached-internal-testing-proxy-servers/","time":"19:15","priority":"MAY READ","score":72,"tldr":"Surfshark says hackers accessed an internet-exposed internal test server and a separate proxy server after a configuration error, exposing configurations and build-related credentials. The company says customer data, VPN traffic, and production infrastructure were not affected, and it has rotated potentially exposed credentials.","briefOverview":"\u003cp\u003eSurfshark disclosed that hackers accessed an internal test server after a configuration error made it reachable from the internet. The server contained service configurations, build-related credentials, and portions of system binaries and code history. Surfshark detected suspicious activity on August 31, contained the incident on September 2, and completed remediation three days later.\u003c/p\u003e\n\n\u003cp\u003eThe unauthorized party also accessed a separate server used for content-accessibility optimization, which acted as a proxy. Surfshark said this server had no access to customer identities, IP addresses, encryption keys, or browsing traffic, and that production VPN infrastructure and customer data were not affected. The company rotated potentially affected internal credentials, revoked exposed tokens, added detection and hardening measures, and plans an independent infrastructure audit; it says users need take no action but should remain alert for suspicious activity or unsolicited communications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Surfshark said a configuration error made an internal test server reachable from the internet, allowing an unauthorized party to access it.","The exposed test environment contained service configurations, build-related credentials, portions of system binaries, and code history.","The unauthorized party also accessed a separate content-accessibility proxy server, which Surfshark said did not contain customer identities, IP addresses, encryption keys, or browsing traffic.","Surfshark detected suspicious activity on August 31, contained the incident on September 2, and completed remediation three days later.","Surfshark rotated potentially affected internal credentials, revoked exposed tokens, and said there was no evidence that the credentials were misused or that production infrastructure and customer data were affected."],"insights":["The incident was caused by a test server being exposed to the internet, prompting Surfshark to extend production-level security controls to testing environments.","Although build-related credentials were exposed, Surfshark said it found no evidence that they were used or that the compromise spread to other systems.","Surfshark’s response included revoking exposed tokens and improving how credentials are managed during software builds, indicating that the remediation addressed both immediate access risks and the process that handled sensitive credentials.","Surfshark stated that users do not need to take action, but recommended remaining alert for suspicious activity or unsolicited communications."],"referencedReports":[{"title":"Security Update: September 2026 Incident Report","url":"https://surfshark.com/blog/security-update-september-2026-incident-report","publisher":"surfshark","context":"The article cites Surfshark's incident report for the company's account of the exposed internal test server and its response.","category":"advisory","primary":true}],"body":"\u003cp\u003eSurfshark disclosed that hackers accessed an internal test server after a configuration error made it reachable from the internet. The server contained service configurations, build-related credentials, and portions of system binaries and code history. Surfshark detected suspicious activity on August 31, contained the incident on September 2, and completed remediation three days later.\u003c/p\u003e\n\n\u003cp\u003eThe unauthorized party also accessed a separate server used for content-accessibility optimization, which acted as a proxy. Surfshark said this server had no access to customer identities, IP addresses, encryption keys, or browsing traffic, and that production VPN infrastructure and customer data were not affected. The company rotated potentially affected internal credentials, revoked exposed tokens, added detection and hardening measures, and plans an independent infrastructure audit; it says users need take no action but should remain alert for suspicious activity or unsolicited communications.\u003c/p\u003e\n"},{"n":7,"title":"Cyber Command turns to veteran of intelligence agencies for top AI role","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cyber-command-ai-leader-ronzelle-green","time":"18:25","priority":"MAY READ","score":72,"tldr":"U.S. Cyber Command appointed Rear Adm. Ronzelle Green, formerly NGA’s R\u0026D chief, as its new chief AI officer to lead the military command’s expanding use of AI in cyber operations. A key priority will be consolidating scattered AI initiatives as funding for AI-enabled cyber capabilities rises sharply.","briefOverview":"\u003cp\u003eU.S. Cyber Command has appointed Rear Adm. Ronzelle Green as its new chief artificial intelligence officer. Green replaces Brig. Gen. Reid Novotny, the first person appointed to the position after Cyber Command created it last year. Green most recently led research and development at the National Geospatial-Intelligence Agency and previously held defense intelligence and security roles.\u003c/p\u003e\n\n\u003cp\u003eThe appointment comes as Cyber Command expands its planned investment in AI for cyber operations. Its request for the AI for Cyber Operations effort rose from \u003cspan class=\"math inline\"\u003e\\(5 million in fiscal 2026 to \\)\u003c/span\u003e138 million in fiscal 2027, according to budget documents. The command says AI could help operators process large data volumes, identify harmful activity, and respond to threats faster, while officials say Green should organize AI pilots and other scattered efforts across the organization.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. Cyber Command appointed Rear Adm. Ronzelle Green as its new chief artificial intelligence officer, replacing Brig. Gen. Reid Novotny.","Green most recently led research and development at the National Geospatial-Intelligence Agency and previously held roles at the Defense Counterintelligence and Security Agency and the Office of the Under Secretary of Defense for Intelligence and Security.","Cyber Command requested $5 million for its fiscal 2026 AI for Cyber Operations effort and $138 million for fiscal 2027, according to budget documents.","Cyber Command says AI capabilities could help its cyber operators process large volumes of data, identify malicious activity, and respond to threats faster than human operators alone.","Current and former officials said Green should consolidate and organize AI pilot programs and other efforts that are spread across the command."],"insights":["Cyber Command’s planned funding for AI in cyber operations increases from $5 million in fiscal 2026 to $138 million in fiscal 2027, indicating a major near-term expansion in the effort.","Despite creating a chief AI officer role last year, Cyber Command’s AI pilots and related work remain distributed across the organization, with officials describing separate “home brew” efforts.","Green’s prior experience spans geospatial intelligence, defense security, and integrating Five Eyes partners into defense intelligence, giving him a background that crosses several parts of the U.S. intelligence and defense system."],"referencedReports":[{"title":"FY 2027 Research, Development, Test and Evaluation Budget Justification: U.S. Cyber Command","url":"https://comptroller.war.gov/Portals/45/Documents/defbudget/FY2027/budget_justification/pdfs/03_RDT_and_E/RDTE_CYBERCOM_PB_2027.pdf","publisher":"u-s-department-of-defense","context":"The article cites these budget documents for the increase in requested funding for Cyber Command’s AI for Cyber Operations effort.","category":"research","primary":false}],"body":"\u003cp\u003eU.S. Cyber Command has appointed Rear Adm. Ronzelle Green as its new chief artificial intelligence officer. Green replaces Brig. Gen. Reid Novotny, the first person appointed to the position after Cyber Command created it last year. Green most recently led research and development at the National Geospatial-Intelligence Agency and previously held defense intelligence and security roles.\u003c/p\u003e\n\n\u003cp\u003eThe appointment comes as Cyber Command expands its planned investment in AI for cyber operations. Its request for the AI for Cyber Operations effort rose from \u003cspan class=\"math inline\"\u003e\\(5 million in fiscal 2026 to \\)\u003c/span\u003e138 million in fiscal 2027, according to budget documents. The command says AI could help operators process large data volumes, identify harmful activity, and respond to threats faster, while officials say Green should organize AI pilots and other scattered efforts across the organization.\u003c/p\u003e\n"},{"n":8,"title":"We've got one word for it, and it's usually the wrong one","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/weve-got-one-word-for-it-and-its-usually-the-wrong-one/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cybersecurity’s human toll is often mislabeled as burnout: it can also include secondary traumatic stress, vicarious trauma, and moral injury, each requiring different support and responses. The article urges the industry to adopt clearer language and better peer-support practices for people exposed to sustained high-stakes work.","briefOverview":"\u003cp\u003eThe newsletter argues that “burnout” is often an insufficient label for the health effects of cybersecurity work. It distinguishes burnout, which stems from chronic workload, from secondary traumatic stress, vicarious trauma, and moral injury. The author says these are separate injuries with different remedies and that cybersecurity is comparatively immature in recognizing the consequences of this work.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos also reports a complex WebDAV infection chain identified after an incident at a Ukrainian government organization and attributed to UAT-10820. The campaign delivers the Amatera stealer, ZigCryptoStealer, and NetSupport Manager, but Talos assesses with moderate confidence that it is a broad cryptocurrency- and credential-stealing operation rather than a highly targeted one. It uses fake CAPTCHA prompts and BNB Smart Chain infrastructure, while secondary components include a vulnerable driver to terminate EDR software and unauthorized remote-access tools; defenders are advised to monitor unusual WebDAV activity, suspicious rundll32.exe ordinal calls, fake verification prompts, and memory-resident payloads.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that cybersecurity’s human toll is often incorrectly grouped under “burnout,” despite several distinct forms of work-related harm requiring different responses.","It defines burnout as exhaustion from chronic workload, secondary traumatic stress as the effect of absorbing others’ trauma, vicarious trauma as a long-term change in beliefs caused by exposure to others’ worst days, and moral injury as harm from acting against one’s values or being unable to do what is right.","The author reviewed trauma research involving first responders, doctors, social workers, and the military to develop better language for experiences in cybersecurity work.","Cisco Talos reported a WebDAV-based infection chain attributed to UAT-10820 that delivered the Amatera information stealer along with ZigCryptoStealer and NetSupport Manager after an incident at a Ukrainian government organization.","The article advises security teams to watch for unusual WebDAV activity and suspicious rundll32.exe execution, educate users about fake verification prompts, and enable strong memory scanning for Amatera."],"insights":["Reducing workload may help burnout, but the article says it does not address other harms such as secondary traumatic stress, vicarious trauma, or moral injury.","Although the infection chain was discovered during an incident at a Ukrainian government organization, Talos assesses with moderate confidence that it was a broad cryptocurrency- and credential-stealing operation rather than a highly targeted campaign.","The campaign combines fake CAPTCHA-style prompts with legitimate services, including the BNB Smart Chain, to evade traditional web filtering.","Amatera may operate entirely in memory, so endpoint defenses need effective memory scanning rather than relying only on file-based detection.","Secondary payloads include a vulnerable driver intended to terminate endpoint detection and response software, followed by an unauthorized remote-access tool that can provide persistent control."],"referencedReports":[],"body":"\u003cp\u003eThe newsletter argues that “burnout” is often an insufficient label for the health effects of cybersecurity work. It distinguishes burnout, which stems from chronic workload, from secondary traumatic stress, vicarious trauma, and moral injury. The author says these are separate injuries with different remedies and that cybersecurity is comparatively immature in recognizing the consequences of this work.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos also reports a complex WebDAV infection chain identified after an incident at a Ukrainian government organization and attributed to UAT-10820. The campaign delivers the Amatera stealer, ZigCryptoStealer, and NetSupport Manager, but Talos assesses with moderate confidence that it is a broad cryptocurrency- and credential-stealing operation rather than a highly targeted one. It uses fake CAPTCHA prompts and BNB Smart Chain infrastructure, while secondary components include a vulnerable driver to terminate EDR software and unauthorized remote-access tools; defenders are advised to monitor unusual WebDAV activity, suspicious rundll32.exe ordinal calls, fake verification prompts, and memory-resident payloads.\u003c/p\u003e\n"}]</script>
