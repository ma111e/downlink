<script type="application/json" id="dl-articles">[{"n":2,"title":"16 Malicious Firefox Extensions Pose as Rabby and OKX Wallets to Steal Recovery Phrases","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/16-malicious-firefox-extensions-pose-as.html","time":"09:46","priority":"SHOULD READ","score":82,"tldr":"Sixteen malicious Firefox extensions impersonated Rabby and OKX Wallets to steal users’ recovery phrases and private keys during wallet-import flows, exfiltrating them through attacker-controlled Cloudflare Workers. Although Mozilla removed the extensions, anyone who entered wallet credentials should treat them as compromised and move assets to a newly created wallet from a clean system.","briefOverview":"\u003cp\u003eCybersecurity researchers identified 16 malicious Mozilla Firefox extensions that impersonated Rabby Wallet and OKX Wallet. The add-ons presented themselves as wallet portals, desktop utilities, or browser tools, but intercepted wallet recovery phrases and private keys during wallet-import flows. Four were Rabby Wallet clones, while the remaining extensions targeted OKX Wallet users.\u003c/p\u003e\n\n\u003cp\u003eThe extensions attempted to send stolen wallet secrets to attacker-controlled Cloudflare Workers, and all but one contacted the \u003ccode\u003e*.icy-star-f45c.workers.dev\u003c/code\u003e domain. Socket assessed the activity as a continuation of an earlier campaign in which operators changed package names, versions, IDs, descriptions, and presentation while reusing wallet interfaces, credential-handling logic, and network infrastructure. All identified extensions had been removed as of October 5, 2026, but anyone who entered a real recovery phrase or private key was advised to assume compromise, create a new wallet from a clean system, and move their assets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers identified 16 malicious Firefox extensions that impersonated Rabby Wallet or OKX Wallet and were designed to steal wallet recovery phrases and private keys.","The extensions intercepted secrets entered during wallet-import flows and attempted to send them to attacker-controlled Cloudflare Workers, with most contacting the *.icy-star-f45c.workers.dev domain.","Four extensions were Rabby Wallet clones and the remaining extensions were clones of OKX Wallet.","As of October 5, 2026, all identified extensions had been removed, but users who entered real recovery phrases or private keys were advised to consider them compromised and move assets to a new wallet created from a clean system.","The campaign was assessed as a continuation of an earlier wave, with operators changing extension names and presentation details while reusing wallet interfaces, credential-handling code, and network infrastructure."],"insights":["The operators changed extension names, versions, IDs, descriptions, and visual presentation while reusing the same wallet interfaces, secret-handling logic, and network infrastructure, indicating that superficial store-listing changes can mask recurring campaigns.","Removing a malicious browser extension does not undo exposure: users who entered a real recovery phrase or private key must assume it was stolen and create a new wallet from a clean system before moving assets.","The article documents malicious extensions across Firefox, Chrome, and Edge that use different disguises, including productivity tools, PDF identity verification, VPN services, ad blockers, and cryptocurrency utilities, showing that the risk extends beyond obvious wallet add-ons.","Organizations are advised to audit extensions in managed environments and use behavior-based or runtime monitoring to identify suspicious extension activity rather than relying only on extension names or descriptions."],"referencedReports":[{"title":"Firefox Crypto Wallet Stealers","url":"https://socket.dev/blog/firefox-crypto-wallet-stealers","publisher":"socket","context":"Socket researcher Joseph Edwards is cited for the analysis identifying the malicious Firefox wallet extensions and their Cloudflare Workers data-exfiltration infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers identified 16 malicious Mozilla Firefox extensions that impersonated Rabby Wallet and OKX Wallet. The add-ons presented themselves as wallet portals, desktop utilities, or browser tools, but intercepted wallet recovery phrases and private keys during wallet-import flows. Four were Rabby Wallet clones, while the remaining extensions targeted OKX Wallet users.\u003c/p\u003e\n\n\u003cp\u003eThe extensions attempted to send stolen wallet secrets to attacker-controlled Cloudflare Workers, and all but one contacted the \u003ccode\u003e*.icy-star-f45c.workers.dev\u003c/code\u003e domain. Socket assessed the activity as a continuation of an earlier campaign in which operators changed package names, versions, IDs, descriptions, and presentation while reusing wallet interfaces, credential-handling logic, and network infrastructure. All identified extensions had been removed as of October 5, 2026, but anyone who entered a real recovery phrase or private key was advised to assume compromise, create a new wallet from a clean system, and move their assets.\u003c/p\u003e\n"},{"n":1,"title":"Samsung Galaxy S26 hacked three more times at Pwn2Own Ireland","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/samsung-galaxy-s26-hacked-three-more-times-at-pwn2own-ireland/","time":"06:32","priority":"SHOULD READ","score":78,"tldr":"On day two of Pwn2Own Ireland 2026, researchers earned $232,500 for demonstrating 45 zero-day vulnerabilities, including three successful exploits against Samsung's Galaxy S26. The competition exposes flaws in fully patched products, giving vendors 90 days to release fixes before public disclosure.","briefOverview":"\u003cp\u003eOn the second day of Pwn2Own Ireland 2026, security researchers earned \u003cspan class=\"math inline\"\u003e\\(232,500 after demonstrating 45 unique zero-day flaws. The Samsung Galaxy S26 was compromised three times by KAIST Hacking Lab’s Kyeongmin Kim, PetoWorks, and a team including Dimitrios Valsamaras, Ken Gannon, and CENSUS Labs’ Tenia Valsamara. Other successful demonstrations included a Sonos Era 300 exploit chain completed in under a minute and a \\)\u003c/span\u003e40,000 compromise of Dynamo in the AI Infrastructure category.\u003c/p\u003e\n\n\u003cp\u003eResearchers also targeted smart-home and AI products, with several teams compromising the Home Assistant Green hub and Ikotas Labs using a seven-zero-day chain against the Oracle Autonomous AI Database. Pwn2Own requires fully patched targets and requires contestants to demonstrate that they can run their own code on them. After flaws are disclosed during the contest, vendors have 90 days to issue fixes before Trend Micro’s Zero Day Initiative publicly releases details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On the second day of Pwn2Own Ireland 2026, researchers earned $232,500 after demonstrating 45 unique zero-day vulnerabilities.","Kyeongmin Kim of KAIST Hacking Lab, PetoWorks, and a team including Dimitrios Valsamaras, Ken Gannon, and Tenia Valsamara each hacked a Samsung Galaxy S26.","Jack Dates of RET2 Systems demonstrated an exploit chain against a Sonos Era 300 in under one minute, and HaeJung Yang of Out of Bounds earned $40,000 for hacking Dynamo.","Ikotas Labs compromised the Oracle Autonomous AI Database using a chain of seven zero-day vulnerabilities.","Under Pwn2Own rules, vendors have 90 days to patch flaws disclosed during the contest before ZDI publicly releases details."],"insights":["The Samsung Galaxy S26 was compromised three times on day two after being targeted by three successful teams on day one, although the article notes that some day-one bugs were already known to Samsung.","Oracle's Autonomous AI Database was successfully targeted with both seven-zero-day and five-zero-day exploit chains by different teams across the competition, showing that it drew multiple complex demonstrations.","Despite offering up to $300,000 for a remote compromise of the iPhone 17, no contestant registered an attempt against it.","Pwn2Own requires targets to run the latest firmware and requires contestants to demonstrate the ability to run their own code, so the demonstrated issues affected fully patched competition targets at the time of testing.","The contest spans consumer devices, smart-home equipment, printers, messaging applications, AI systems, and healthcare wellness devices, rather than being limited to traditional computers or phones."],"referencedReports":[],"body":"\u003cp\u003eOn the second day of Pwn2Own Ireland 2026, security researchers earned \u003cspan class=\"math inline\"\u003e\\(232,500 after demonstrating 45 unique zero-day flaws. The Samsung Galaxy S26 was compromised three times by KAIST Hacking Lab’s Kyeongmin Kim, PetoWorks, and a team including Dimitrios Valsamaras, Ken Gannon, and CENSUS Labs’ Tenia Valsamara. Other successful demonstrations included a Sonos Era 300 exploit chain completed in under a minute and a \\)\u003c/span\u003e40,000 compromise of Dynamo in the AI Infrastructure category.\u003c/p\u003e\n\n\u003cp\u003eResearchers also targeted smart-home and AI products, with several teams compromising the Home Assistant Green hub and Ikotas Labs using a seven-zero-day chain against the Oracle Autonomous AI Database. Pwn2Own requires fully patched targets and requires contestants to demonstrate that they can run their own code on them. After flaws are disclosed during the contest, vendors have 90 days to issue fixes before Trend Micro’s Zero Day Initiative publicly releases details.\u003c/p\u003e\n"},{"n":3,"title":"MonsterCloud Owner Accused of Billing Over $19M While Secretly Paying Ransoms to Decrypt Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/monstercloud-owner-accused-of-billing.html","time":"07:41","priority":"SHOULD READ","score":78,"tldr":"U.S. prosecutors charged MonsterCloud owner Zohar Pinhasi with allegedly misleading ransomware victims by claiming proprietary recovery capabilities while secretly paying attackers for decryptors and billing clients far more than the ransoms. He is accused of collecting over $19 million from clients while making more than $8 million in ransom payments.","briefOverview":"\u003cp\u003eThe U.S. Department of Justice charged Zohar Pinhasi, the owner of Florida-based MonsterCloud, with two counts of wire fraud and one count of wire fraud conspiracy. Prosecutors allege that Pinhasi told ransomware victims that MonsterCloud could recover their encrypted data using proprietary tools and advanced decryption techniques without paying the criminals. If convicted, he faces up to 20 years in prison on each count.\u003c/p\u003e\n\n\u003cp\u003eAccording to the allegations, MonsterCloud had no specialized decryption tools and Pinhasi instead contacted the attackers and paid them to obtain decryptors. He allegedly billed customers substantially more than the ransom amounts, including a case where approximately \u003cspan class=\"math inline\"\u003e\\(8,200 was paid to a threat actor while the client was charged about \\)\u003c/span\u003e150,000. In total, Pinhasi is accused of charging clients more than \u003cspan class=\"math inline\"\u003e\\(19 million and making more than \\)\u003c/span\u003e8 million in ransom payments, while the FBI alleged that he did not address the underlying threat behind the incidents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Department of Justice charged MonsterCloud owner Zohar Pinhasi with two counts of wire fraud and one count of wire fraud conspiracy.","Prosecutors allege that Pinhasi claimed MonsterCloud could recover ransomware-encrypted data using proprietary tools and advanced techniques without paying criminal groups.","According to the charges, Pinhasi instead contacted the attackers, paid them for decryption software, and charged clients substantially more than the ransom amounts.","In one August 2023 case, Pinhasi allegedly paid about $8,200 to a threat actor and billed the client about $150,000.","Pinhasi is accused of charging clients more than $19 million while making more than $8 million in ransom payments."],"insights":["MonsterCloud’s website publicly discouraged paying criminals, yet its own Q\u0026A said it sometimes used “other means” to resolve incidents and that terms would be disclosed in service contracts; prosecutors allege ransom payments were instead secret.","The alleged conduct went beyond obtaining data-recovery software: the FBI said Pinhasi never fixed the underlying problem that allowed the incident to occur.","The August 2023 example shows the alleged service charge was dramatically higher than the ransom payment, with roughly $8,200 paid to the criminal group and about $150,000 billed to the client."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. Department of Justice charged Zohar Pinhasi, the owner of Florida-based MonsterCloud, with two counts of wire fraud and one count of wire fraud conspiracy. Prosecutors allege that Pinhasi told ransomware victims that MonsterCloud could recover their encrypted data using proprietary tools and advanced decryption techniques without paying the criminals. If convicted, he faces up to 20 years in prison on each count.\u003c/p\u003e\n\n\u003cp\u003eAccording to the allegations, MonsterCloud had no specialized decryption tools and Pinhasi instead contacted the attackers and paid them to obtain decryptors. He allegedly billed customers substantially more than the ransom amounts, including a case where approximately \u003cspan class=\"math inline\"\u003e\\(8,200 was paid to a threat actor while the client was charged about \\)\u003c/span\u003e150,000. In total, Pinhasi is accused of charging clients more than \u003cspan class=\"math inline\"\u003e\\(19 million and making more than \\)\u003c/span\u003e8 million in ransom payments, while the FBI alleged that he did not address the underlying threat behind the incidents.\u003c/p\u003e\n"},{"n":4,"title":"U.S. Offers Up to $10 Million for Tips on Zhang Yu, Charged in HAFNIUM Hacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/us-offers-up-to-10-million-for-tips-on.html","time":"07:42","priority":"SHOULD READ","score":78,"tldr":"The U.S. State Department is offering up to $10 million for information locating Zhang Yu, a Chinese national charged over alleged involvement in the China-linked HAFNIUM exploitation of Microsoft Exchange servers. Zhang remains at large, while his alleged co-conspirator Xu Zewei was extradited to the United States in 2026.","briefOverview":"\u003cp\u003eThe U.S. State Department is offering up to $10 million for information leading to the identification or location of Zhang Yu, a Chinese national charged in connection with the 2021 Microsoft Exchange Server attacks known as HAFNIUM. Zhang remains at large, and the charges against him have not been tested in court. He and Xu Zewei were charged in a nine-count federal indictment filed in Houston in November 2023 and made public in July 2025.\u003c/p\u003e\n\n\u003cp\u003eU.S. authorities describe Zhang as a director at Shanghai Firetech Information Science and Technology who allegedly worked on tasks assigned by the Shanghai State Security Bureau and coordinated hacking with Xu. The indictment alleges that the pair targeted U.S. universities and scientists working on COVID-19 vaccines, treatments, and testing before exploiting Microsoft Exchange Server flaws in the HAFNIUM campaign. Microsoft released fixes for four actively exploited Exchange flaws in March 2021, while the FBI says the broader campaign compromised more than 12,700 U.S. organizations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. State Department is offering up to $10 million for information leading to the identification or location of Zhang Yu, who is charged in the United States over alleged involvement in the 2021 HAFNIUM Microsoft Exchange Server attacks.","Zhang Yu remains at large, and the charges against him have not been tested in court.","A federal indictment alleges that Zhang, a director at Shanghai Firetech Information Science and Technology, worked on hacking tasks assigned by the Shanghai State Security Bureau and coordinated activity with Xu Zewei.","The indictment alleges intrusions targeting U.S. universities and scientists working on COVID-19 vaccines, treatments, and testing, followed by exploitation of Microsoft Exchange Server flaws in the campaign known as HAFNIUM.","The FBI says the HAFNIUM campaign compromised more than 12,700 U.S. organizations, while Xu Zewei was arrested in Italy in July 2025 and extradited to the United States in April 2026."],"insights":["The reported reward language and amount match a broader offer that the Rewards for Justice program was already making in January 2025 for information about foreign government-directed hacking of U.S. critical infrastructure.","The indictment describes an alleged contractor model in which Shanghai companies performed hacking work for the Shanghai State Security Bureau, which U.S. authorities say can obscure the Chinese government’s role.","Although Microsoft attributed the Exchange activity to HAFNIUM in 2021, it now tracks the group as Silk Typhoon, showing that the same activity can be referred to under updated names over time.","Microsoft released fixes for four actively exploited Exchange Server flaws on March 2, 2021, but other hacking groups began using those same flaws within days, according to the article.","The case illustrates the extended international legal timeline for such allegations: the alleged activity occurred through June 2021, the indictment dates to November 2023, and Xu Zewei was extradited to the United States in April 2026."],"referencedReports":[{"title":"HAFNIUM targeting Exchange Servers with 0-day exploits","url":"https://www.microsoft.com/en-us/security/blog/2021/03/02/hafnium-targeting-exchange-servers/","publisher":"microsoft","context":"The article cites Microsoft’s analysis attributing the Exchange Server activity to HAFNIUM, a group it assessed as state-sponsored and operating from China.","category":"research","primary":true},{"title":"Detecting Post-Compromise Web Shell Activity From the HAFNIUM Exchange Server Vulnerabilities","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa21-062a","publisher":"cisa","context":"The article links to a CISA cybersecurity advisory while noting that the United States and partner governments said hackers linked to China’s Ministry of State Security carried out the campaign.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe U.S. State Department is offering up to $10 million for information leading to the identification or location of Zhang Yu, a Chinese national charged in connection with the 2021 Microsoft Exchange Server attacks known as HAFNIUM. Zhang remains at large, and the charges against him have not been tested in court. He and Xu Zewei were charged in a nine-count federal indictment filed in Houston in November 2023 and made public in July 2025.\u003c/p\u003e\n\n\u003cp\u003eU.S. authorities describe Zhang as a director at Shanghai Firetech Information Science and Technology who allegedly worked on tasks assigned by the Shanghai State Security Bureau and coordinated hacking with Xu. The indictment alleges that the pair targeted U.S. universities and scientists working on COVID-19 vaccines, treatments, and testing before exploiting Microsoft Exchange Server flaws in the HAFNIUM campaign. Microsoft released fixes for four actively exploited Exchange flaws in March 2021, while the FBI says the broader campaign compromised more than 12,700 U.S. organizations.\u003c/p\u003e\n"},{"n":5,"title":"Act Before the Incident: Process-Aware Policy in Your SWG","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/act-before-the-incident-process-aware-policy-in-your-swg","time":"07:01","priority":"MAY READ","score":35,"tldr":"Netskope says its Client now sends process and parent-process details to its Next-Gen Secure Web Gateway, enabling real-time policies and logging to identify and block suspicious application traffic before it can access the internet.","briefOverview":"\u003cp\u003eNetskope says its Client now provides process names and parent process names to the Netskope One Next-Gen Secure Web Gateway (NG-SWG). This information is available for real-time policy controls and transaction logging. The company positions the capability as a way to stop suspicious scripts and applications before they make internet requests, rather than relying only on endpoint tools that act after a process is already running.\u003c/p\u003e\n\n\u003cp\u003eThe added context can be used in Real-Time Protection and SSL do-not-decrypt policies, including rules that trigger when processes such as \u003ccode\u003ecurl.exe\u003c/code\u003e or parent processes such as \u003ccode\u003epowershell.exe\u003c/code\u003e are detected. Netskope says process data can also help investigate suspicious activity, including transfers of source code to personal cloud storage and unusual traffic that normally bypasses inspection for employee privacy. The article also highlights dedicated egress IP addresses, application instance awareness, and real-time user coaching as additional NG-SWG policy capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Client now sends process names and parent process names to the Netskope One Next-Generation Secure Web Gateway for real-time policy controls and logging.","The added process context can allow policies to act before a subsequent process runs, rather than relying solely on endpoint tools that terminate a risky process after it is already running.","Real-Time Protection and SSL do-not-decrypt policies can be configured to trigger when a specific process, such as curl.exe, or parent process, such as powershell.exe, is detected.","Process and parent process names are available in Netskope Transaction Events to help identify which application on a device generated a request.","Netskope also highlights dedicated egress IP addresses, application instance awareness, and real-time user coaching as other Next-Generation Secure Web Gateway policy capabilities."],"insights":["Web requests related to personal finances or health may be bypassed to protect employee privacy, but the article notes that this can create a covert channel that AI could exploit; process context can help identify unusual programs generating that traffic.","Process and parent-process records can support investigations into apparent data theft by helping determine whether a user may have been targeted by unknown prompts, scripts, or processes that moved data to compromised personal cloud storage.","Real-time user coaching can collect a user’s justification and permit a transaction instead of simply blocking it, creating feedback that can be used to refine security policies.","Application instance awareness can distinguish company and personal versions of cloud applications, allowing organizations to review transfers of company data to personal storage accounts, including when an employee leaves."],"referencedReports":[],"body":"\u003cp\u003eNetskope says its Client now provides process names and parent process names to the Netskope One Next-Gen Secure Web Gateway (NG-SWG). This information is available for real-time policy controls and transaction logging. The company positions the capability as a way to stop suspicious scripts and applications before they make internet requests, rather than relying only on endpoint tools that act after a process is already running.\u003c/p\u003e\n\n\u003cp\u003eThe added context can be used in Real-Time Protection and SSL do-not-decrypt policies, including rules that trigger when processes such as \u003ccode\u003ecurl.exe\u003c/code\u003e or parent processes such as \u003ccode\u003epowershell.exe\u003c/code\u003e are detected. Netskope says process data can also help investigate suspicious activity, including transfers of source code to personal cloud storage and unusual traffic that normally bypasses inspection for employee privacy. The article also highlights dedicated egress IP addresses, application instance awareness, and real-time user coaching as additional NG-SWG policy capabilities.\u003c/p\u003e\n"}]</script>
