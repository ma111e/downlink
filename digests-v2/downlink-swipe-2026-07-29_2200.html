<script type="application/json" id="dl-articles">[{"n":1,"title":"Russian hackers exploit Exchange OWA zero-day for long-term mailbox access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/russian-hackers-exploit-exchange-owa-zero-day-for-long-term-mailbox-access/","time":"23:44","priority":"MUST READ","score":96,"tldr":"Russian state-backed hackers are exploiting an Exchange Outlook Web Access zero-day to deliver OWAReaper, a sophisticated backdoor that can persist in mailboxes even after password resets or system reimaging. The campaign targets government and major industry organizations by triggering malicious JavaScript when victims simply open crafted emails in OWA.","briefOverview":"\u003cp\u003eRussian state-sponsored hacking group Laundry Bear, also known as Void Blizzard and tracked by Proofpoint as TA488, is exploiting CVE-2026-42897 in Exchange Outlook Web Access to deliver a backdoor called OWAReaper. Proofpoint observed the campaign targeting government entities in the United States and Europe, as well as organizations in telecommunications, finance, hospitality, and aerospace. Microsoft warned on May 14 that the flaw was being exploited as a zero-day, and Proofpoint said the group had created campaign infrastructure in March.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-42897 is a cross-site scripting issue caused by improper sanitization of HTML in email message bodies, allowing JavaScript to run when a user opens a specially crafted email in OWA. Proofpoint describes this as a “half-click exploit” because the user only needs to open the message, with no suspicious URL or attachment required. The emails used banal topics such as supply-chain analyses, research updates, and market performance indicators, likely to make recipients skim and dismiss them without reporting them.\u003c/p\u003e\n\n\u003cp\u003eOWAReaper executes entirely in the OWA reading pane, rewrites the email on the Exchange server to remove exploit content, and disables OWA pop-ups and right-click functionality while it runs. It collects account and Outlook settings, attempts to steal credentials, and can maintain mailbox access even after system restoration or credential rotation by abusing Outlook add-ins and server-side mailbox permissions. The malware also uses multiple command-and-control and exfiltration methods, including GitHub commit messages, specially formatted mailbox messages, HTTPS paths proxied through image CDN domains, direct attacker servers, and DNS fallback.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russian state-sponsored group Laundry Bear, also known as Void Blizzard and tracked by Proofpoint as TA488, is exploiting CVE-2026-42897 in Exchange Outlook Web Access to deliver the OWAReaper backdoor.","Proofpoint observed the campaign targeting government entities in the United States and Europe, as well as organizations in the telecommunications, financial, hospitality, and aerospace sectors.","CVE-2026-42897 is a cross-site scripting flaw caused by improper HTML sanitization that can execute JavaScript when a user opens a specially crafted email in Outlook Web Access.","OWAReaper can collect account details and Outlook settings, attempt to steal credentials, remove exploit content from the email, and disable OWA pop-ups and right-click functionality while it runs.","Proofpoint said OWAReaper can maintain mailbox access even after system restoration or credential rotation by abusing Outlook add-ins with ReadWriteMailbox permissions and modifying server-side mailbox folder permissions."],"insights":["Laundry Bear prepared OWAReaper campaign infrastructure in March, almost two months before Microsoft warned that CVE-2026-42897 was being exploited as a zero-day.","The malicious emails were designed to look unremarkable and contained no suspicious links or attachments, which Proofpoint said may make recipients more likely to dismiss them as junk instead of reporting them.","OWAReaper rewrites the malicious email on the Exchange server to remove the exploit content after execution, reducing visible evidence of the original compromise.","The backdoor’s mailbox access can survive password changes and clean system rebuilds because it modifies server-side mailbox folder permissions rather than depending only on the compromised device.","OWAReaper includes redundant command-and-control and data theft paths, including GitHub commit messages, specially formatted mailbox messages, HTTPS through image CDN domains, direct attacker servers, and DNS fallback."],"referencedReports":[{"title":"Cleaning Out Inboxes: TA488 Comes for Outlook with Another Half-Click Exploit","url":"https://www.proofpoint.com/us/blog/threat-insight/cleaning-out-inboxes-ta488-comes-outlook-another-half-click-exploit","publisher":"Proofpoint","context":"The article cites Proofpoint's report as the source for technical details on Laundry Bear’s OWAReaper campaign and its exploitation of the Exchange Outlook Web Access flaw.","category":"research","primary":true}],"body":"\u003cp\u003eRussian state-sponsored hacking group Laundry Bear, also known as Void Blizzard and tracked by Proofpoint as TA488, is exploiting CVE-2026-42897 in Exchange Outlook Web Access to deliver a backdoor called OWAReaper. Proofpoint observed the campaign targeting government entities in the United States and Europe, as well as organizations in telecommunications, finance, hospitality, and aerospace. Microsoft warned on May 14 that the flaw was being exploited as a zero-day, and Proofpoint said the group had created campaign infrastructure in March.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-42897 is a cross-site scripting issue caused by improper sanitization of HTML in email message bodies, allowing JavaScript to run when a user opens a specially crafted email in OWA. Proofpoint describes this as a “half-click exploit” because the user only needs to open the message, with no suspicious URL or attachment required. The emails used banal topics such as supply-chain analyses, research updates, and market performance indicators, likely to make recipients skim and dismiss them without reporting them.\u003c/p\u003e\n\n\u003cp\u003eOWAReaper executes entirely in the OWA reading pane, rewrites the email on the Exchange server to remove exploit content, and disables OWA pop-ups and right-click functionality while it runs. It collects account and Outlook settings, attempts to steal credentials, and can maintain mailbox access even after system restoration or credential rotation by abusing Outlook add-ins and server-side mailbox permissions. The malware also uses multiple command-and-control and exfiltration methods, including GitHub commit messages, specially formatted mailbox messages, HTTPS paths proxied through image CDN domains, direct attacker servers, and DNS fallback.\u003c/p\u003e\n"},{"n":2,"title":"Adverse cyber extortions are more common than commonly advised","source":"coveware.com","sourceColorIdx":6,"link":"https://coveware.com/2026/07/adverse-cyber-extortions-are-more-common-than-commonly-advised/","time":"00:00","priority":"MAY READ","score":58,"tldr":"Ransom payments are increasingly unreliable because criminals may retain, resell, or lose control of stolen data despite promises to delete it. The article argues that cyber extortion advice must account for volatile, low-probability outcomes that are becoming common, not just historical averages.","briefOverview":"\u003cp\u003eThe article argues that advice given to cyber extortion victims often understates how unpredictable outcomes can be after a ransom payment. It uses the 2024 law enforcement takedown of LockBit to show that the group retained victims’ stolen data despite promises to delete it. The article says this exposed a flaw in the assumption that criminals have a strong financial incentive to honor their commitments.\u003c/p\u003e\n\n\u003cp\u003eA more recent example cited is the June 2026 supply chain compromise of Klue by the ransomware group Icarus, which exposed millions of sensitive CRM records from Klue customers. After a ransom payment was purportedly made to guarantee deletion, a separate criminal group retained victim names and data samples, leaving affected victims exposed to ongoing extortion threats. The article says such volatile outcomes are becoming increasingly common, especially in mass SaaS supply chain attacks where the same enterprise customer data can be affected more than once in a year.\u003c/p\u003e\n\n\u003cp\u003eCoveware’s Q2 2026 data showed the average ransom payment rose 176% from Q1 to \u003cspan class=\"math inline\"\u003e\\(1,880,612, while the median payment fell 50% to \\)\u003c/span\u003e150,000 because a few unusually large data-exfiltration payments skewed the average. Payment rates reached a new record low, and data-exfiltration-only payment rates dropped to 15%. The article also says Q2 intrusions were heavily identity-driven, with phishing, social engineering, help desk manipulation, remote access paths, OAuth grants, delegated applications, and compromised credentials featuring prominently.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation Cronos revealed that LockBit retained victims’ stolen data despite promises to delete it after ransom payments.","The article argues that cyber extortion outcomes are more volatile than many victims and advisers expect, especially when dealing with criminal groups focused on data theft.","A June 2026 supply chain compromise of Klue by Icarus exposed millions of sensitive CRM records from Klue customers, and another criminal group later retained victim names and data samples despite a purported ransom payment.","In Q2 2026, the average ransom payment rose 176% from Q1 to $1,880,612, while the median payment fell 50% to $150,000 because a few unusually large data-theft extortion payments skewed the average.","The percentage of Coveware clients that chose to pay reached a new record low in Q2 2026, with data-exfiltration-only payment rates dropping to 15%."],"insights":["Ransomware negotiation advice based on past outcomes can be dangerously misleading because the promised result, such as deletion of stolen data, may not be independently verifiable until much later.","The article treats help desk processes, password resets, MFA resets, device enrollment, and account recovery as security controls, because attackers increasingly gain access by making their actions look like normal authentication or administration.","The sharp split between average and median ransom payments in Q2 2026 shows that a few large data-theft extortion cases can distort headline payment figures and obscure what most victims are actually paying.","Company size is described as a weak predictor of extortion risk; the article says exposure is more closely tied to identity compromise, remote access, data sensitivity, third-party dependencies, and recovery capability.","The article says qualitative conditions such as global health crises, natural disasters, and law enforcement actions should be included in cyber extortion forecasting, not just historical outcome data."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that advice given to cyber extortion victims often understates how unpredictable outcomes can be after a ransom payment. It uses the 2024 law enforcement takedown of LockBit to show that the group retained victims’ stolen data despite promises to delete it. The article says this exposed a flaw in the assumption that criminals have a strong financial incentive to honor their commitments.\u003c/p\u003e\n\n\u003cp\u003eA more recent example cited is the June 2026 supply chain compromise of Klue by the ransomware group Icarus, which exposed millions of sensitive CRM records from Klue customers. After a ransom payment was purportedly made to guarantee deletion, a separate criminal group retained victim names and data samples, leaving affected victims exposed to ongoing extortion threats. The article says such volatile outcomes are becoming increasingly common, especially in mass SaaS supply chain attacks where the same enterprise customer data can be affected more than once in a year.\u003c/p\u003e\n\n\u003cp\u003eCoveware’s Q2 2026 data showed the average ransom payment rose 176% from Q1 to \u003cspan class=\"math inline\"\u003e\\(1,880,612, while the median payment fell 50% to \\)\u003c/span\u003e150,000 because a few unusually large data-exfiltration payments skewed the average. Payment rates reached a new record low, and data-exfiltration-only payment rates dropped to 15%. The article also says Q2 intrusions were heavily identity-driven, with phishing, social engineering, help desk manipulation, remote access paths, OAuth grants, delegated applications, and compromised credentials featuring prominently.\u003c/p\u003e\n"}]</script>
