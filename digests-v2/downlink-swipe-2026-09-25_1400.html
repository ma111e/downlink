<script type="application/json" id="dl-articles">[{"n":2,"title":"CISA warns of Sharepoint, WSO2, Adobe Commerce flaws exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-sharepoint-wso2-adobe-commerce-flaws-exploited-in-attacks/","time":"17:24","priority":"MUST READ","score":96,"tldr":"CISA added actively exploited critical flaws in WSO2 products (CVE-2026-5430) and Adobe Commerce/Magento (CVE-2026-71362) to its KEV catalog, warning that attackers can gain administrative control or hijack customer accounts. It also flagged exploited Microsoft SharePoint and MikroTik RouterOS vulnerabilities and urged organizations to patch or mitigate urgently.","briefOverview":"\u003cp\u003eCISA has added two critical vulnerabilities to its Known Exploited Vulnerabilities catalog: CVE-2026-5430 in multiple WSO2 products and CVE-2026-71362 in Adobe Commerce and Magento. The agency also warned that attackers are exploiting CVE-2026-65660, a high-severity Microsoft SharePoint code-injection issue, and CVE-2026-67279, a MikroTik RouterOS pre-authentication SSH workflow bypass. Federal agencies using the affected WSO2 and Adobe products have until September 27 to apply updates or mitigations, discontinue use, while SharePoint and RouterOS fixes are due September 28.\u003c/p\u003e\n\n\u003cp\u003eThe WSO2 flaw has a maximum severity score and results from its JWT login mechanism accepting tokens signed with an unsupported algorithm. WSO2 said successful exploitation could let an attacker compromise administrator accounts and gain full control; watchTowr reproduced an attack in which a forged token exposed API endpoints and application credentials. Sansec reported that the Adobe Commerce and Magento flaw can be used to hijack customer accounts without an existing account, administrator privileges, or user interaction. CISA encouraged all organizations, not only federal agencies, to prioritize remediation of issues listed in its catalog.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added the actively exploited WSO2 authentication-bypass vulnerability CVE-2026-5430 and Adobe Commerce authorization flaw CVE-2026-71362 to its Known Exploited Vulnerabilities catalog.","CVE-2026-5430 affects several WSO2 products and can allow an attacker using a forged authentication token to compromise administrative accounts and take full control.","Security firm Sansec reported that attackers were exploiting CVE-2026-71362 in Adobe Commerce and Magento to hijack customer accounts without requiring an existing account, administrator privileges, or user interaction.","CISA also said attackers are exploiting CVE-2026-65660, a high-severity Microsoft SharePoint code-injection flaw, and CVE-2026-67279, a MikroTik RouterOS pre-authentication SSH workflow bypass.","Federal agencies using affected WSO2 and Adobe products have until September 27 to apply recommended updates or mitigations or stop using them, while the deadline for the SharePoint and RouterOS flaws is September 28."],"insights":["watchTowr observed only a limited number of WSO2 exploitation attempts from one IP address, but the attacker targeted the wrong WSO2 product for CVE-2026-5430.","When watchTowr reproduced the WSO2 attack against the correct product, a forged token exposed API endpoints and application credentials.","The Adobe Commerce flaw reportedly can be used to hijack customer accounts without an existing account, administrator privileges, or user interaction.","WSO2 technology is used by nearly 1,000 customers in sectors including banking, government, telecommunications, and logistics, increasing the importance of prompt mitigation."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"http://www.cisa.gov/news-events/alerts/2026/09/24/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's alert announcing the addition of the WSO2 and Adobe Commerce flaws to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"WSO2-2026-5328","url":"http://security.docs.wso2.com/en/latest/security-announcements/security-advisories/2026/WSO2-2026-5328/","publisher":"wso2","context":"The article references WSO2's original advisory describing the impact of CVE-2026-5430.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA has added two critical vulnerabilities to its Known Exploited Vulnerabilities catalog: CVE-2026-5430 in multiple WSO2 products and CVE-2026-71362 in Adobe Commerce and Magento. The agency also warned that attackers are exploiting CVE-2026-65660, a high-severity Microsoft SharePoint code-injection issue, and CVE-2026-67279, a MikroTik RouterOS pre-authentication SSH workflow bypass. Federal agencies using the affected WSO2 and Adobe products have until September 27 to apply updates or mitigations, discontinue use, while SharePoint and RouterOS fixes are due September 28.\u003c/p\u003e\n\n\u003cp\u003eThe WSO2 flaw has a maximum severity score and results from its JWT login mechanism accepting tokens signed with an unsupported algorithm. WSO2 said successful exploitation could let an attacker compromise administrator accounts and gain full control; watchTowr reproduced an attack in which a forged token exposed API endpoints and application credentials. Sansec reported that the Adobe Commerce and Magento flaw can be used to hijack customer accounts without an existing account, administrator privileges, or user interaction. CISA encouraged all organizations, not only federal agencies, to prioritize remediation of issues listed in its catalog.\u003c/p\u003e\n"},{"n":6,"title":"Crypto CEO accuses North Korea of stealing $387 million from Bitget platform","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/crypto-ceo-accuses-north-korea-of-387-million-theft","time":"15:15","priority":"MUST READ","score":93,"tldr":"Bitget says North Korea-linked hackers, likely associated with the Lazarus Group, stole about $387.5 million after breaching its wallet-services backend. The exchange suspended withdrawals, is working with Mandiant and SlowMist, and says its protection fund can cover customer losses.","briefOverview":"\u003cp\u003eSingapore-based cryptocurrency platform Bitget said hackers stole an estimated $387.5 million from its exchange following a breach on Thursday. CEO Gracy Chen said the company detected unauthorized transfers, activated emergency protocols, and suspended withdrawals. The stolen assets included ETH, XRP, USDC, and several other coins.\u003c/p\u003e\n\n\u003cp\u003eChen said the attackers breached a backend system for Bitget’s wallet services and exploited weaknesses that enabled unauthorized transfers. She said IP addresses, behavioral patterns, and transaction signatures linked the incident to North Korea-associated groups, while other researchers found connections to previous Lazarus Group thefts. Bitget is working with Mandiant and SlowMist, has notified law enforcement and other crypto platforms, and says its more than $464 million User Protection Fund will be used to cover losses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitget said hackers stole an estimated $387.5 million after breaching a backend system for its wallet services and enabling unauthorized transfers.","CEO Gracy Chen said evidence including IP addresses, behavioral patterns, and on-chain signatures linked the incident to North Korea-associated hacker groups, while other analysts found links to prior Lazarus Group thefts.","Bitget suspended withdrawals and said it is working with Mandiant and SlowMist, while notifying law enforcement and other cryptocurrency platforms.","Chen said Bitget’s User Protection Fund contains more than $464 million and will be used to cover the losses.","The stolen assets included ETH, XRP, USDC, and other coins, and Chen said some platforms had already frozen funds connected to the attackers’ wallets."],"insights":["Bitget’s stated $464 million User Protection Fund exceeds its estimated $387.5 million loss, which the company says will allow it to cover the stolen funds.","Bitget is offering cryptocurrency platforms 5% for voluntarily freezing attacker-linked funds and another 5% when funds are recovered, creating a financial incentive for outside platforms to assist the recovery effort.","The reported North Korea link is supported by both Bitget’s review of IP addresses, behavior, and transaction patterns and by outside researchers who identified connections to earlier Lazarus Group thefts.","The theft involved several types of cryptocurrency, including ETH, XRP, and USDC, and some attacker-linked funds had already been frozen by other platforms."],"referencedReports":[],"body":"\u003cp\u003eSingapore-based cryptocurrency platform Bitget said hackers stole an estimated $387.5 million from its exchange following a breach on Thursday. CEO Gracy Chen said the company detected unauthorized transfers, activated emergency protocols, and suspended withdrawals. The stolen assets included ETH, XRP, USDC, and several other coins.\u003c/p\u003e\n\n\u003cp\u003eChen said the attackers breached a backend system for Bitget’s wallet services and exploited weaknesses that enabled unauthorized transfers. She said IP addresses, behavioral patterns, and transaction signatures linked the incident to North Korea-associated groups, while other researchers found connections to previous Lazarus Group thefts. Bitget is working with Mandiant and SlowMist, has notified law enforcement and other crypto platforms, and says its more than $464 million User Protection Fund will be used to cover losses.\u003c/p\u003e\n"},{"n":7,"title":"Compromised GitHub Actions Came Back Online and Resumed Executing Mini Shai-Hulud Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/compromised-github-actions-came-back.html","time":"14:44","priority":"SHOULD READ","score":88,"tldr":"Previously compromised actions-cool GitHub Actions repositories were briefly re-enabled with malicious release tags intact, causing workflows using version tags to resume executing the Mini Shai-Hulud credential-stealing payload. Organizations should remove or SHA-pin the affected actions, review workflow runs, and rotate potentially exposed secrets.","briefOverview":"\u003cp\u003eGitHub disabled the actions-cool/issues-helper and actions-cool/maintain-one-comment repositories for a second time after they became accessible again on September 16, 2026. The actions had originally been compromised on May 18, 2026, to run code that collected sensitive credentials from CI/CD workflows and sent them to an attacker-controlled server. The activity was linked to the Mini Shai-Hulud cluster through the shared exfiltration domain t.m-kosche[.]com and overlaps with malicious npm packages in the @antv ecosystem.\u003c/p\u003e\n\n\u003cp\u003eAccording to Socket, the repositories\u0026rsquo; release tags had not been cleaned up and still pointed to the malicious content introduced in May. As a result, workflows that referenced either action through a version tag resumed downloading and running the payload after the repositories became available, without a new code release or changes to workflow files. Workflows pinned to a full commit SHA from before May 18, 2026, were not affected; developers are advised to remove or pin the actions to a known-clean earlier SHA, rotate exposed secrets, and review workflow runs and repository history.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub disabled the actions-cool/issues-helper and actions-cool/maintain-one-comment repositories again after they became accessible on September 16, 2026.","Their release tags still pointed to malicious code introduced on May 18, 2026, so workflows using version tags could download and run the payload when the repositories returned online.","The malicious workflows harvested sensitive CI/CD credentials and sent them to an attacker-controlled server, and the activity was linked to the Mini Shai-Hulud cluster.","Workflows pinned to a full commit SHA from before May 18, 2026, were not affected.","Developers are advised to remove or pin the affected actions to a known-clean pre-May 18 SHA, rotate exposed secrets, and review workflow and repository history."],"insights":["The threat resumed without a newly published malicious version, a newly hijacked account, or any change to affected projects' workflow files; restoring access to repositories whose version tags still referenced malicious content was sufficient.","Because the affected actions commonly run daily or when issues and pull requests are opened, most affected repositories may have run the payload within a day of the repositories being re-enabled.","A full commit-SHA reference to a version from before May 18, 2026, was not affected, illustrating that fixed commit references avoid reliance on the current state of an upstream repository and its mutable version tags."],"referencedReports":[{"title":"Mini Shai-Hulud Actions","url":"https://socket.dev/blog/mini-shai-hulud-actions","publisher":"socket","context":"Socket researcher Karlo Zanki's analysis reported that the repositories became accessible again while their release tags still pointed to malicious content.","category":"research","primary":true}],"body":"\u003cp\u003eGitHub disabled the actions-cool/issues-helper and actions-cool/maintain-one-comment repositories for a second time after they became accessible again on September 16, 2026. The actions had originally been compromised on May 18, 2026, to run code that collected sensitive credentials from CI/CD workflows and sent them to an attacker-controlled server. The activity was linked to the Mini Shai-Hulud cluster through the shared exfiltration domain t.m-kosche[.]com and overlaps with malicious npm packages in the @antv ecosystem.\u003c/p\u003e\n\n\u003cp\u003eAccording to Socket, the repositories\u0026rsquo; release tags had not been cleaned up and still pointed to the malicious content introduced in May. As a result, workflows that referenced either action through a version tag resumed downloading and running the payload after the repositories became available, without a new code release or changes to workflow files. Workflows pinned to a full commit SHA from before May 18, 2026, were not affected; developers are advised to remove or pin the actions to a known-clean earlier SHA, rotate exposed secrets, and review workflow runs and repository history.\u003c/p\u003e\n"},{"n":5,"title":"Cyberattack hits Welsh police force, may have affected staff data","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/wales-cyberattack-police-breach","time":"15:00","priority":"MAY READ","score":68,"tldr":"Dyfed-Powys Police in Wales suffered a cyberattack that disrupted non-emergency systems and may have exposed staff data, though there is no evidence that public information was affected.","briefOverview":"\u003cp\u003eDyfed-Powys Police in Wales said it identified a cyberattack earlier this month that disrupted some non-emergency systems. The force said it has found no evidence that information belonging to members of the public was affected. It is still investigating whether employee information was accessed or compromised.\u003c/p\u003e\n\n\u003cp\u003eDyfed-Powys Police covers southwest Wales and employs more than 2,000 officers and staff. Tarian, the regional organized crime unit for southern Wales, is leading the investigation with support from cybersecurity specialists. Police did not disclose how the breach occurred or what staff data may have been involved, and no group had claimed responsibility as of publication.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dyfed-Powys Police in Wales said a cyberattack identified earlier this month disrupted some of its non-emergency systems.","The force said it has found no evidence that information belonging to members of the public was affected.","Police are investigating whether employee information was accessed or compromised.","Tarian, the regional organized crime unit for southern Wales, is leading the investigation with support from cybersecurity specialists.","Police did not disclose how the breach occurred or what staff data may have been involved, and no group had claimed responsibility as of publication."],"insights":["The incident’s known impact is currently narrower than a confirmed public-data breach: disruption has been reported in non-emergency systems, while possible data exposure is limited to staff information under investigation.","The force has not identified either the entry method or the specific employee data potentially involved, so the scope of the incident remains unresolved.","Tarian’s lead role shows the response is being handled at the regional southern Wales level rather than solely by Dyfed-Powys Police."],"referencedReports":[],"body":"\u003cp\u003eDyfed-Powys Police in Wales said it identified a cyberattack earlier this month that disrupted some non-emergency systems. The force said it has found no evidence that information belonging to members of the public was affected. It is still investigating whether employee information was accessed or compromised.\u003c/p\u003e\n\n\u003cp\u003eDyfed-Powys Police covers southwest Wales and employs more than 2,000 officers and staff. Tarian, the regional organized crime unit for southern Wales, is leading the investigation with support from cybersecurity specialists. Police did not disclose how the breach occurred or what staff data may have been involved, and no group had claimed responsibility as of publication.\u003c/p\u003e\n"},{"n":8,"title":"Threat Research Roundup: September 2026","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/white-papers-and-reports/threat-research-roundup-september-2026/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=threat-research-roundup-september-2026","time":"16:33","priority":"MAY READ","score":40,"tldr":"Silent Push’s September 2026 roundup summarizes six investigations into emerging adversary infrastructure, including The Gentlemen ransomware, phishing and proxy networks, North Korean IT-worker recruitment, and dangling DNS takeover risks. The reports provide actionable defensive recommendations based on infrastructure identified before or during active campaigns.","briefOverview":"\u003cp\u003eSilent Push’s September 2026 Threat Research Roundup collects six public investigations published by its Preemptive Cyber Defense team between June and September. The edition is intended to provide defenders with exclusive recommendations they can act on. It covers adversary infrastructure across several types of activity.\u003c/p\u003e\n\n\u003cp\u003eThe roundup includes early infrastructure tied to The Gentlemen ransomware group and attacker infrastructure targeting Amgen that the team identified seven months before the company’s SEC filing. It also features Danglegeddon, a simulation of dangling DNS subdomain takeover at scale. The remaining investigations examine residential proxy bandwidth-sharing networks, North Korean IT worker recruitment, and a fast-flux phishing operation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push’s September 2026 Threat Research Roundup collects six public investigations published by its Preemptive Cyber Defense team between June and September.","The roundup includes early infrastructure associated with The Gentlemen ransomware group.","The team identified attacker infrastructure targeting Amgen seven months before the company’s SEC filing.","The edition includes Danglegeddon, a simulation of dangling DNS subdomain takeover at scale.","Other investigations cover residential proxy bandwidth-sharing networks, North Korean IT worker recruitment, and a fast-flux phishing operation."],"insights":["The investigation involving Amgen shows that attacker infrastructure was identified seven months before the company’s SEC filing, highlighting the potential value of early infrastructure tracking.","Each of the six investigations includes exclusive recommendations that defenders can act on.","The roundup addresses both criminal infrastructure, such as ransomware and phishing operations, and broader abuse risks involving residential proxy networks and dangling DNS subdomains."],"referencedReports":[],"body":"\u003cp\u003eSilent Push’s September 2026 Threat Research Roundup collects six public investigations published by its Preemptive Cyber Defense team between June and September. The edition is intended to provide defenders with exclusive recommendations they can act on. It covers adversary infrastructure across several types of activity.\u003c/p\u003e\n\n\u003cp\u003eThe roundup includes early infrastructure tied to The Gentlemen ransomware group and attacker infrastructure targeting Amgen that the team identified seven months before the company’s SEC filing. It also features Danglegeddon, a simulation of dangling DNS subdomain takeover at scale. The remaining investigations examine residential proxy bandwidth-sharing networks, North Korean IT worker recruitment, and a fast-flux phishing operation.\u003c/p\u003e\n"},{"n":1,"title":"OpenAI is preparing a $500 ChatGPT Pro Max plan with faster Codex","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/openai-is-preparing-a-500-chatgpt-pro-max-plan-with-faster-codex/","time":"14:54","priority":"MAY READ","score":35,"tldr":"OpenAI is reportedly testing a $500-per-month ChatGPT Pro Max plan with faster Work and Codex performance, 100GB of storage, maximum memory, and early feature access. The accelerated experience may use Cerebras inference hardware, but OpenAI has not confirmed pricing, availability, limits, or the underlying infrastructure.","briefOverview":"\u003cp\u003eOpenAI appears to be testing an unannounced ChatGPT Pro Max subscription priced at \u003cspan class=\"math inline\"\u003e\\(500 per month, with one interface version showing \\)\u003c/span\u003e600 after local taxes or VAT. The plan has appeared in ChatGPT’s subscription interface alongside Plus and existing Pro options, but OpenAI has not announced when it will be available. It may address requests from power users for more usage than the current $200 plan offers.\u003c/p\u003e\n\n\u003cp\u003eThe listing describes Pro Max as providing “Fastest Work and Codex,” OpenAI’s most capable frontier models, maximum memory, 100GB of file storage, and early access to new features. Its exact usage limits are not known, and it is unclear whether early access would remain available on the existing $200 Pro plan. The faster Work and Codex experience could potentially use Cerebras hardware, which OpenAI has used for high-speed inference, although neither company has confirmed a connection to Pro Max.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI is reportedly preparing a ChatGPT Pro Max subscription that appears in parts of ChatGPT’s subscription interface at $500 per month, or $600 with local taxes or VAT included.","The unannounced Pro Max plan is described as offering “Fastest Work and Codex,” access to OpenAI’s most capable frontier models, maximum memory, 100GB of file storage, and early access to new features.","OpenAI has not announced Pro Max or disclosed its availability date, exact usage limits, or whether early access will remain available with the existing $200 Pro plan.","The article says OpenAI has deployed Cerebras hardware for high-speed AI responses, including Codex-Spark at more than 1,000 tokens per second and GPT-5.6 Sol at up to 750 output tokens per second in Ultrafast mode.","ChatGPT currently offers Pro tiers priced at $100 and $200 per month, while new sign-ups and upgrades for the $200 ChatGPT Pro plan have been temporarily paused since September 10."],"insights":["The Pro Max listing appeared before a formal OpenAI announcement, so its final availability, limits, and included features remain unconfirmed.","The $500 price can rise to $600 when local taxes or VAT are included, making the effective cost dependent on a subscriber’s location.","Early access to new features may not be exclusive to Pro Max because the existing $200 Pro plan also promises early access.","New sign-ups and upgrades to the $200 ChatGPT Pro plan have been paused since September 10, while OpenAI appears to be testing the higher-priced option.","Cerebras could be involved in the faster Work and Codex experience, but neither OpenAI nor Cerebras has confirmed that connection."],"referencedReports":[],"body":"\u003cp\u003eOpenAI appears to be testing an unannounced ChatGPT Pro Max subscription priced at \u003cspan class=\"math inline\"\u003e\\(500 per month, with one interface version showing \\)\u003c/span\u003e600 after local taxes or VAT. The plan has appeared in ChatGPT’s subscription interface alongside Plus and existing Pro options, but OpenAI has not announced when it will be available. It may address requests from power users for more usage than the current $200 plan offers.\u003c/p\u003e\n\n\u003cp\u003eThe listing describes Pro Max as providing “Fastest Work and Codex,” OpenAI’s most capable frontier models, maximum memory, 100GB of file storage, and early access to new features. Its exact usage limits are not known, and it is unclear whether early access would remain available on the existing $200 Pro plan. The faster Work and Codex experience could potentially use Cerebras hardware, which OpenAI has used for high-speed inference, although neither company has confirmed a connection to Pro Max.\u003c/p\u003e\n"},{"n":3,"title":"Anthropic rolls out up to $250 in free Claude Code credits, but only for cloud sessions","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-rolls-out-up-to-250-in-free-claude-code-credits-but-only-for-cloud-sessions/","time":"16:00","priority":"MAY READ","score":35,"tldr":"Anthropic has made Claude Code cloud sessions broadly available to eligible Pro and Max subscribers, offering promotional credits of $100 and $250 respectively. The credits apply only to cloud-hosted coding sessions, must be claimed by October 7, and expire November 4.","briefOverview":"\u003cp\u003eAnthropic has made Claude Code cloud sessions available to eligible subscribers beyond the earlier research preview. Cloud sessions run on Anthropic-hosted infrastructure, allowing coding work to continue after a user’s computer is turned off. Users can start them from claude.ai/code, Claude’s mobile or desktop apps, or with the \u003ccode\u003eclaude --cloud\u003c/code\u003e command.\u003c/p\u003e\n\n\u003cp\u003eAnthropic is offering eligible Pro subscribers \u003cspan class=\"math inline\"\u003e\\(100 in promotional cloud-session credits and eligible Max subscribers \\)\u003c/span\u003e250. These credits are separate from normal Claude usage limits and are automatically applied to cloud sessions, including when a user has reached a local limit. The offer is limited to individual Pro and Max subscribers who were active when it began on September 23; it must be claimed by October 7, remaining credit expires November 4, and later cloud use counts against normal plan limits once the promotion is exhausted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic has made Claude Code cloud sessions available to eligible subscribers outside the prior research preview.","Claude Code cloud sessions run on Anthropic-hosted infrastructure, allowing work to continue when the user’s computer is not running.","Eligible Pro subscribers receive $100 in promotional cloud-session credits, while eligible Max subscribers receive $250.","The promotional credits are separate from normal Claude usage limits and are applied automatically when a cloud session starts.","The offer must be claimed by October 7, unused credits expire on November 4, and eligibility is limited to individual Pro and Max subscribers active when the promotion began on September 23."],"insights":["The promotional balance can let eligible users continue Claude Code work in cloud sessions even after reaching a local usage limit, until the credit is exhausted.","Anthropic states there is no separate charge for the cloud container; after promotional credits run out, cloud sessions instead count against the subscriber’s normal plan limits.","Users can start cloud sessions through claude.ai/code, Claude’s mobile and desktop apps, or the command line using `claude --cloud`.","The promotion is restricted to individual Pro and Max subscribers who already had an active subscription when it began on September 23."],"referencedReports":[],"body":"\u003cp\u003eAnthropic has made Claude Code cloud sessions available to eligible subscribers beyond the earlier research preview. Cloud sessions run on Anthropic-hosted infrastructure, allowing coding work to continue after a user’s computer is turned off. Users can start them from claude.ai/code, Claude’s mobile or desktop apps, or with the \u003ccode\u003eclaude --cloud\u003c/code\u003e command.\u003c/p\u003e\n\n\u003cp\u003eAnthropic is offering eligible Pro subscribers \u003cspan class=\"math inline\"\u003e\\(100 in promotional cloud-session credits and eligible Max subscribers \\)\u003c/span\u003e250. These credits are separate from normal Claude usage limits and are automatically applied to cloud sessions, including when a user has reached a local limit. The offer is limited to individual Pro and Max subscribers who were active when it began on September 23; it must be claimed by October 7, remaining credit expires November 4, and later cloud use counts against normal plan limits once the promotion is exhausted.\u003c/p\u003e\n"},{"n":4,"title":"With the Rise of AI Agents, SOC 2 Should Adapt or Risk Irrelevance","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/with-the-rise-of-ai-agents-soc-2-should-adapt-or-risk-irrelevance/","time":"14:51","priority":"MAY READ","score":35,"tldr":"The sponsored article argues that SOC 2 controls can miss risks from AI agents that use borrowed credentials, lack clear ownership, and are not covered by traditional access reviews or offboarding. It calls for treating agents as distinct identities and enforcing access based on their intended function.","briefOverview":"\u003cp\u003eThe sponsored article argues that SOC 2 compliance controls can become less meaningful when organizations deploy AI agents without treating them as a distinct type of identity. It says agents may be created through OAuth approvals, API keys, or MCP server configuration without a separate approval record, clear owner, or formal offboarding process. As a result, an organization can pass established controls while lacking visibility into what agents are running and what access they have.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that agents may operate using an employee session, developer token, or service account, causing logs and access reviews to attribute their actions to a human. It also argues that an agent’s permissions show its possible reach but do not establish what it was intended to do in a specific situation, because behavior can depend on instructions and context. It says vendor-review and separation-of-duties processes can also be weakened when MCP servers arrive through configuration files or when one agent reviews another agent’s changes.\u003c/p\u003e\n\n\u003cp\u003eAlthough the article notes that SOC 2’s technology-neutral criteria can already include agents, it says the current ambiguity lets organizations and auditors define scopes that may omit them without recording an exception. A clean SOC 2 Type 2 report, it argues, confirms that documented controls operated as described but does not show whether the environment description covered every relevant agent. The article advocates treating machine accounts as users and using intent-based access controls that align each agent’s access with the job it was created to perform.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that SOC 2 criteria can technically cover AI agents but do not explicitly require them to be treated as a separate identity class.","AI agents may be created through actions such as OAuth authorization, API-key configuration, or adding an MCP server, without a distinct approval process for the agent itself.","Agents can use borrowed employee sessions, developer tokens, or service accounts, causing logs and access reviews to identify a human rather than the agent performing the action.","Traditional SOC 2 offboarding controls may not stop agents that continue operating through OAuth grants or API keys after the associated employee leaves.","The article says a clean SOC 2 Type 2 report shows that documented controls operated as described, but does not prove that the system description fully accounts for AI agents."],"insights":["An access review can be factually accurate yet still fail to reveal that an AI agent, rather than the named employee, performed the recorded actions.","Having one AI agent review another agent’s change may satisfy a two-identity separation on paper while providing only nominal separation of duties.","MCP servers can introduce vendor-like access through configuration files rather than formal purchasing and vendor-review processes, leaving no clear organization from which to obtain compliance evidence.","An agent’s permissions show the maximum actions it can take, but not what it was actually intended to do at a particular moment, because its behavior can depend on instructions, context, and its own decisions.","The article notes that organizations and auditors may prefer an easier-to-document scope, allowing agents to remain outside review without creating a recorded control exception."],"referencedReports":[{"title":"Autonomous but Not Controlled: AI Security Data Report","url":"https://www.token.security/lp/autonomous-but-not-controlled-ai-security-data-report-csa?utm_source=bleepingcomputer\u0026utm_medium=3rd-party\u0026utm_campaign=bleepingcomputer\u0026utm_content=sept-25","publisher":"cloud-security-alliance","context":"The article cites a recent study with the Cloud Security Alliance finding that more than two-thirds of organizations cannot clearly distinguish AI agent actions from human actions.","category":"research","primary":false}],"body":"\u003cp\u003eThe sponsored article argues that SOC 2 compliance controls can become less meaningful when organizations deploy AI agents without treating them as a distinct type of identity. It says agents may be created through OAuth approvals, API keys, or MCP server configuration without a separate approval record, clear owner, or formal offboarding process. As a result, an organization can pass established controls while lacking visibility into what agents are running and what access they have.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that agents may operate using an employee session, developer token, or service account, causing logs and access reviews to attribute their actions to a human. It also argues that an agent’s permissions show its possible reach but do not establish what it was intended to do in a specific situation, because behavior can depend on instructions and context. It says vendor-review and separation-of-duties processes can also be weakened when MCP servers arrive through configuration files or when one agent reviews another agent’s changes.\u003c/p\u003e\n\n\u003cp\u003eAlthough the article notes that SOC 2’s technology-neutral criteria can already include agents, it says the current ambiguity lets organizations and auditors define scopes that may omit them without recording an exception. A clean SOC 2 Type 2 report, it argues, confirms that documented controls operated as described but does not show whether the environment description covered every relevant agent. The article advocates treating machine accounts as users and using intent-based access controls that align each agent’s access with the job it was created to perform.\u003c/p\u003e\n"}]</script>
