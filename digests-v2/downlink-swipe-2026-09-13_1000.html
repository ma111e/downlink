<script type="application/json" id="dl-articles">[{"n":1,"title":"Attackers Use Passkey Phishing to Hijack Microsoft Cloud Accounts and Exfiltrate Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-use-passkey-phishing-to.html","time":"10:11","priority":"SHOULD READ","score":88,"tldr":"Microsoft warns that attackers are using AI-assisted executive invoice scams and passkey-themed phishing/vishing to compromise Microsoft cloud accounts. The cloud intrusions establish attacker-controlled MFA methods and then abuse Microsoft Graph to persist, reconnoiter tenants, and exfiltrate SharePoint, OneDrive, and email data.","briefOverview":"\u003cp\u003eMicrosoft described two campaigns: an AI-assisted invoice fraud effort and a passkey-themed social-engineering campaign targeting cloud accounts. From August 3 to 5, 2026, attackers sent more than one million emails impersonating company CEOs and sought ACH payments for a fake ServiceNow annual subscription. The messages used trusted third-party delivery infrastructure, forged invoices and email threads, spoofed domains, and recipient-specific executive names to make the payment requests appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eSince May 2026, another campaign has used calls and texts posing as IT help desk staff to pressure users into updating passkeys, multi-factor authentication, or single sign-on settings. Victims were directed to counterfeit Microsoft sign-in sites or device-code authentication flows, enabling attackers to capture credentials or obtain account access through an approval process. After access, attackers registered their own phone numbers, authenticator apps, or software one-time-password tokens, then used Microsoft Graph to conduct reconnaissance, collect mailbox data, and download files from SharePoint Online and OneDrive for Business.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft linked the observed initial-access activity to several actors, including Storm-3121 and Storm-3032, the latter of which it identifies as UNC6671. The actors used separate IP addresses for authentication, reconnaissance, and data collection, while sustained file and email exfiltration could continue for hours or days. Microsoft said this behavior is difficult to detect from isolated Graph API calls and should instead be assessed through the broader sequence of sign-ins, new authentication methods, reconnaissance, and high-volume downloads.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that attackers sent more than one million CEO-impersonation payment scam emails from August 3 to 5, 2026, seeking ACH transfers for a fake ServiceNow annual subscription.","The invoice-fraud campaign used trusted third-party email delivery infrastructure, forged invoices and email threads, impersonation domains, and AI-assisted recipient-tailored email templates.","Since May 2026, a separate campaign has used calls, texts, and counterfeit Microsoft sign-in sites with passkey, MFA, and SSO update lures to compromise cloud accounts.","After gaining access, attackers registered authentication methods they controlled, such as phone numbers, authenticator apps, or software one-time-password tokens, to maintain access to victim accounts.","Microsoft observed the compromised accounts being used for Microsoft Graph reconnaissance, mailbox collection, and high-volume downloads from SharePoint Online and OneDrive for Business."],"insights":["The invoice fraud used a layered narrative—executive impersonation, vendor branding, fabricated invoices, and forged supporting conversations—rather than relying on a single deceptive message.","The passkey-themed lures can enable account takeover through device-code approval flows, allowing attackers to gain control without stealing a victim's password or browser session and bypassing MFA safeguards.","Attackers used victim-specific subdomains on passkey- and SSO-themed domains, such as \"\u003ccompany name\u003e.\u003cmalicious domain\u003e.com,\" to make targeted phone-based phishing more convincing.","Microsoft cautioned that individual Microsoft Graph requests may not look suspicious, so detecting this activity requires correlating the progression from unusual sign-ins and new authentication methods to reconnaissance and high-volume data downloads.","The actors rotated infrastructure and used different IP addresses for sign-in, reconnaissance, and data theft, reducing the usefulness of isolated network-based indicators."],"referencedReports":[{"title":"Protecting organizations from AI-assisted executive impersonation and invoice fraud","url":"https://www.microsoft.com/en-us/security/blog/2026/09/10/protecting-organizations-ai-assisted-executive-impersonation-invoice-fraud/","publisher":"microsoft","context":"The article relies on Microsoft's analysis of a large CEO-impersonation invoice-fraud campaign targeting accounts payable teams.","category":"research","primary":true},{"title":"Passkey-themed social engineering leads to identity and cloud compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/09/09/passkey-themed-social-engineering-leads-identity-cloud-compromise/","publisher":"microsoft","context":"The article relies on Microsoft's technical analysis of passkey-themed social engineering that led to Microsoft cloud account compromise and data collection.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft described two campaigns: an AI-assisted invoice fraud effort and a passkey-themed social-engineering campaign targeting cloud accounts. From August 3 to 5, 2026, attackers sent more than one million emails impersonating company CEOs and sought ACH payments for a fake ServiceNow annual subscription. The messages used trusted third-party delivery infrastructure, forged invoices and email threads, spoofed domains, and recipient-specific executive names to make the payment requests appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eSince May 2026, another campaign has used calls and texts posing as IT help desk staff to pressure users into updating passkeys, multi-factor authentication, or single sign-on settings. Victims were directed to counterfeit Microsoft sign-in sites or device-code authentication flows, enabling attackers to capture credentials or obtain account access through an approval process. After access, attackers registered their own phone numbers, authenticator apps, or software one-time-password tokens, then used Microsoft Graph to conduct reconnaissance, collect mailbox data, and download files from SharePoint Online and OneDrive for Business.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft linked the observed initial-access activity to several actors, including Storm-3121 and Storm-3032, the latter of which it identifies as UNC6671. The actors used separate IP addresses for authentication, reconnaissance, and data collection, while sustained file and email exfiltration could continue for hours or days. Microsoft said this behavior is difficult to detect from isolated Graph API calls and should instead be assessed through the broader sequence of sign-ins, new authentication methods, reconnaissance, and high-volume downloads.\u003c/p\u003e\n"},{"n":2,"title":"The W-9 Was Real. That Was the Point.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/authentic-irs-w9-as-trust-artifact-invoice-fraud-reply-only-payload","time":"11:00","priority":"MAY READ","score":68,"tldr":"A fraudulent LinkedIn invoice used a genuine, signed IRS W-9 to make the scam appear legitimate, demonstrating that authentic vendor paperwork does not verify the identity of the sender. Organizations should confirm payment requests and remittance changes through an out-of-band contact method using trusted vendor records.","briefOverview":"\u003cp\u003eA fraudulent email sent to the accounts-payable mailbox of a pharmaceutical CDMO’s specialty-chemistry subsidiary included a $31,471.35 invoice impersonating LinkedIn Corporation. It was accompanied by a completed, authentic IRS Form W-9 bearing LinkedIn’s real tax number, California address, and a January 2025 signature. The invoice was fabricated, but the genuine tax form made the request appear credible despite proving nothing about whether the sender was authorized to seek payment.\u003c/p\u003e\n\n\u003cp\u003eNeither attachment contained malicious code or banking information; instead, the invoice repeatedly sought a reply or confirmation so the attacker could continue the payment conversation. The message used a forged internal forward, an invented vendor persona on a newly registered LinkedIn lookalike domain, a separate newly registered reply domain, and a legitimate company’s authenticated transactional sending path that passed DMARC. Microsoft 365 initially quarantined the email for user impersonation before it was released roughly eighteen hours later, and IRONSCALES later classified it as malicious; the article reports no reply and no funds lost. The article’s central recommendation is to verify first payments and remittance changes through an out-of-band call to contact information already held for the vendor, rather than relying on paperwork or email-provided details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fake LinkedIn invoice for $31,471.35 was sent to the accounts-payable mailbox of a global pharmaceutical CDMO’s specialty-chemistry subsidiary alongside an authentic, completed LinkedIn IRS Form W-9.","The W-9 contained LinkedIn’s genuine federal tax number and California corporate address, was signed in January 2025, and contained no active content such as JavaScript, embedded files, or automatic actions.","The fabricated invoice used real LinkedIn product lines and genuine company details but contained no bank or routing information, instead seeking a reply or confirmation to begin a payment conversation.","Microsoft 365 quarantined the message as user impersonation before it was released about eighteen hours later, and IRONSCALES analysts ultimately classified it as confirmed malicious.","The article recommends verifying first payments or changes to payment details through an out-of-band callback using vendor contact information the organization already holds."],"insights":["A genuine vendor tax form can validate the company details printed on it while providing no proof that the person emailing it is authorized to request payment.","The absence of banking details was deliberate: the invoice repeatedly sought a reply, making the immediate objective to establish a conversation before sending payment instructions.","File scanning produced defensible but misleading results because the fabricated invoice was clean and the authentic W-9 was inert; the fraud depended on the relationship between the documents and the email’s claim.","The message passed DMARC through a legitimate company’s authenticated transactional sending path, showing that authentication success alone did not establish that the request was trustworthy.","A quarantine release can negate an earlier impersonation detection, so payment controls must remain effective after a suspicious message reaches a mailbox."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's findings on the human element in breaches, pretexting as an initial access vector, and generative AI increasing operational scale.","category":"research","primary":false},{"title":"2025 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites the report's figure of $3,046,598,558 in reported business email compromise losses.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article includes CISA's phishing guidance as a source relevant to preventing phishing attacks.","category":"guide","primary":false}],"body":"\u003cp\u003eA fraudulent email sent to the accounts-payable mailbox of a pharmaceutical CDMO’s specialty-chemistry subsidiary included a $31,471.35 invoice impersonating LinkedIn Corporation. It was accompanied by a completed, authentic IRS Form W-9 bearing LinkedIn’s real tax number, California address, and a January 2025 signature. The invoice was fabricated, but the genuine tax form made the request appear credible despite proving nothing about whether the sender was authorized to seek payment.\u003c/p\u003e\n\n\u003cp\u003eNeither attachment contained malicious code or banking information; instead, the invoice repeatedly sought a reply or confirmation so the attacker could continue the payment conversation. The message used a forged internal forward, an invented vendor persona on a newly registered LinkedIn lookalike domain, a separate newly registered reply domain, and a legitimate company’s authenticated transactional sending path that passed DMARC. Microsoft 365 initially quarantined the email for user impersonation before it was released roughly eighteen hours later, and IRONSCALES later classified it as malicious; the article reports no reply and no funds lost. The article’s central recommendation is to verify first payments and remittance changes through an out-of-band call to contact information already held for the vendor, rather than relying on paperwork or email-provided details.\u003c/p\u003e\n"}]</script>
