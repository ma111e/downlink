<script type="application/json" id="dl-articles">[{"n":1,"title":"The Security Vendor Hop Was on the Sender's Side","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/sender-side-security-vendor-dkim-signer-dmarc-pass-inbox","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email reached a CEO’s inbox because the sender used Trend Micro Email Security as an outbound relay to generate an aligned DKIM signature, allowing DMARC to pass despite an SPF softfail. Security-vendor hops in email headers must be interpreted directionally: a vendor may be serving the sender, not protecting the recipient.","briefOverview":"\u003cp\u003eA phishing email targeting the CEO of a French calibration and metrology company passed DKIM, DMARC, and Microsoft composite authentication checks and was delivered to the Inbox with a spam confidence level of 1. The message traveled through Trend Micro Email Security, but the service was operating as the sender’s outbound relay rather than as the recipient’s inbound protection. It contained a PDF attachment named for the CEO with “2FA-Confirmation” appended, and two executive mailboxes received personalized variants about an hour apart.\u003c/p\u003e\n\n\u003cp\u003eThe sender’s domain did not authorize the Trend Micro relay in its SPF record, so SPF softfailed, but DMARC still passed because Trend Micro signed the message with an aligned DKIM signature using the sender’s domain and the selector \u003ccode\u003eTM-DKIM-2025120882751\u003c/code\u003e. The PDF contained a raster QR code pointing to a subdomain of lunwah[.]com, with no clickable links, embedded files, forms, JavaScript, or auto-open action. The article emphasizes that a security-vendor hostname in Received headers does not indicate which side the vendor served, and that authentication passes alone cannot establish that an email is safe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email targeting the CEO of a French calibration and metrology company passed DKIM, DMARC, and Microsoft composite authentication checks and was delivered to the Inbox with an SCL of 1.","Trend Micro Email Security acted as the sender’s outbound relay and signed the message using the sending domain’s DKIM key, rather than serving as an inbound security gateway for the recipient.","SPF softfailed because the sending domain did not authorize the Trend Micro relay IP, but DMARC still passed because the aligned DKIM signature passed.","The email contained a single PDF attachment with a raster QR code directing recipients to a subdomain of lunwah.com, with no clickable links, embedded files, forms, JavaScript, or auto-open action.","IRONSCALES classified the incident as phishing, identified the PDF as malicious and the display name as company impersonation, and quarantined the messages from both targeted mailboxes."],"insights":["A recognized security-vendor hostname in an email’s delivery path does not show that the recipient’s security service inspected or approved the message; it may instead be the sender’s outbound service.","An aligned digital signature can allow a fraudulent message to pass domain-based authentication even when the sender’s authorized-server check returns a soft failure.","The combination of the sending domain in the digital-signature field and a vendor-style selector is evidence that the vendor signed mail for that sending domain as an outbound service.","A PDF containing only a QR code can avoid conventional link scanning because it provides no clickable web address for scanners to follow.","A sending domain that had no prior incident history and later disappeared can still have valid authentication records during a short-lived phishing campaign."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s findings on phishing as an initial-access vector and the role of human factors in breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA’s guidance to support the point that email authentication is only one layer of phishing defense.","category":"guide","primary":false}],"body":"\u003cp\u003eA phishing email targeting the CEO of a French calibration and metrology company passed DKIM, DMARC, and Microsoft composite authentication checks and was delivered to the Inbox with a spam confidence level of 1. The message traveled through Trend Micro Email Security, but the service was operating as the sender’s outbound relay rather than as the recipient’s inbound protection. It contained a PDF attachment named for the CEO with “2FA-Confirmation” appended, and two executive mailboxes received personalized variants about an hour apart.\u003c/p\u003e\n\n\u003cp\u003eThe sender’s domain did not authorize the Trend Micro relay in its SPF record, so SPF softfailed, but DMARC still passed because Trend Micro signed the message with an aligned DKIM signature using the sender’s domain and the selector \u003ccode\u003eTM-DKIM-2025120882751\u003c/code\u003e. The PDF contained a raster QR code pointing to a subdomain of lunwah[.]com, with no clickable links, embedded files, forms, JavaScript, or auto-open action. The article emphasizes that a security-vendor hostname in Received headers does not indicate which side the vendor served, and that authentication passes alone cannot establish that an email is safe.\u003c/p\u003e\n"}]</script>
