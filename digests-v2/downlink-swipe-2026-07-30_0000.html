romises to delete it after ransom payments.","The article argues that cyber extortion outcomes are more volatile than many victims and advisers expect, especially when dealing with criminal groups focused on data theft.","A June 2026 supply chain compromise of Klue by Icarus exposed millions of sensitive CRM records from Klue customers, and another criminal group later retained victim names and data samples despite a purported ransom payment.","In Q2 2026, the average ransom payment rose 176% from Q1 to $1,880,612, while the median payment fell 50% to $150,000 because a few unusually large data-theft extortion payments skewed the average.","The percentage of Coveware clients that chose to pay reached a new record low in Q2 2026, with data-exfiltration-only payment rates dropping to 15%."],"insights":["Ransomware negotiation advice based on past outcomes can be dangerously misleading because the promised result, such as deletion of stolen data, may not be independently verifiable until much later.","The article treats help desk processes, password resets, MFA resets, device enrollment, and account recovery as security controls, because attackers increasingly gain access by making their actions look like normal authentication or administration.","The sharp split between average and median ransom payments in Q2 2026 shows that a few large data-theft extortion cases can distort headline payment figures and obscure what most victims are actually paying.","Company size is described as a weak predictor of extortion risk; the article says exposure is more closely tied to identity compromise, remote access, data sensitivity, third-party dependencies, and recovery capability.","The article says qualitative conditions such as global health crises, natural disasters, and law enforcement actions should be included in cyber extortion forecasting, not just historical outcome data."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that advice given to cyber extortion victims often understates how unpredictable outcomes can be after a ransom payment. It uses the 2024 law enforcement takedown of LockBit to show that the group retained victims’ stolen data despite promises to delete it. The article says this exposed a flaw in the assumption that criminals have a strong financial incentive to honor their commitments.\u003c/p\u003e\n\n\u003cp\u003eA more recent example cited is the June 2026 supply chain compromise of Klue by the ransomware group Icarus, which exposed millions of sensitive CRM records from Klue customers. After a ransom payment was purportedly made to guarantee deletion, a separate criminal group retained victim names and data samples, leaving affected victims exposed to ongoing extortion threats. The article says such volatile outcomes are becoming increasingly common, especially in mass SaaS supply chain attacks where the same enterprise customer data can be affected more than once in a year.\u003c/p\u003e\n\n\u003cp\u003eCoveware’s Q2 2026 data showed the average ransom payment rose 176% from Q1 to \u003cspan class=\"math inline\"\u003e\\(1,880,612, while the median payment fell 50% to \\)\u003c/span\u003e150,000 because a few unusually large data-exfiltration payments skewed the average. Payment rates reached a new record low, and data-exfiltration-only payment rates dropped to 15%. The article also says Q2 intrusions were heavily identity-driven, with phishing, social engineering, help desk manipulation, remote access paths, OAuth grants, delegated applications, and compromised credentials featuring prominently.\u003c/p\u003e\n"},{"n":43,"title":"Two ways to scale your scripts","source":"acronis.com","sourceColorIdx":10,"link":"https://www.acronis.com/en/tru/posts/two-ways-to-scale-your-scripts/","time":"07:30","priority":"MAY READ","score":58,"tldr":"Organizations are scaling endpoint scripting either by cloning trusted templates or generating scripts with AI, and each path needs different governance. Treat every script as privileged production code: cloned scripts require source curation and review, while AI-generated scripts require rigorous output verification before use.","briefOverview":"\u003cp\u003eThe article examines two ways Acronis customers scale operational scripting: cloning trusted templates and generating scripts with AI. It argues that every script run on a customer endpoint is operational software with administrator privileges, so it should be reviewed, attributed, versioned, and retired like production code. The article ties this expectation to NIST SP 800-53 controls, CIS Critical Security Controls v8, the NIST AI Risk Management Framework, ENISA AI guidance, and OWASP secure-coding guidance.\u003c/p\u003e\n\n\u003cp\u003eAcronis platform data shows that about 38.9% of active scripts are clones of an existing source, with reuse heavily concentrated in a small number of templates. Six Acronis built-in scripts, each cloned by 500 or more distinct tenants, generate about 32.5% of all clone copies, and the top 28 templates account for about 69.5%. The article notes that all six of the most-cloned templates are Windows PowerShell scripts, all carry credentials in at least some tenant copies, and only about 63.5% to 78.8% of their clones are marked approved.\u003c/p\u003e\n\n\u003cp\u003eAI-generated scripting is described as a newer pattern, with about 15.6% of active scripts generated by AI and about 13.9% of classified script-using tenants falling into an AI-heavy cohort. Inside that cohort, about 74.4% of scripts are AI-generated, and the article says AI use appears to substitute for cloning rather than simply add to it. It reports average clone share of about 26.5% in AI-heavy tenants, 41.7% in AI-mixed tenants, and 55.9% in no-AI tenants, concluding that cloning-primary operations need source governance while AI-primary operations need output verification.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says that every script run on a customer endpoint is operational software with administrator privileges and should be reviewed, attributed, versioned, and retired like production code.","Acronis platform data shows that about 38.9% of active scripts are clones of an existing source, and six Acronis built-in scripts each cloned by 500 or more distinct tenants generate about 32.5% of all clone copies.","About 15.6% of active scripts are AI-generated, and about 13.9% of classified script-using tenants are AI-heavy, with AI-generated scripts making up about 74.4% of scripts inside that cohort.","The article reports a substitution effect in which AI-heavy tenants clone less than no-AI tenants, with average clone share at about 26.5% in AI-heavy tenants, 41.7% in AI-mixed tenants, and 55.9% in no-AI tenants.","The article recommends that SMBs, managed service providers, and users of AI-generated scripts treat scripts as code, maintain inventories or catalogs, review cloned or AI-generated scripts, and apply governance controls appropriate to their scripting strategy."],"insights":["The highest-risk reuse pattern is concentrated: a defect in one of a small number of widely cloned Acronis built-in PowerShell templates could propagate across many tenants because the top six templates account for about 32.5% of all clone copies.","Even the most widely trusted cloned templates have incomplete governance, with only about 63.5% to 78.8% of clones marked approved despite every one of the top six carrying credentials in at least some tenant copies.","AI adoption changes the required control model rather than simply adding another authoring tool, because AI-heavy tenants clone substantially less and therefore need stronger output verification rather than only stronger template curation.","Organizations in AI-augmentation markets such as Australia, Singapore, and the United Kingdom face a heavier governance burden because they combine significant AI use with continued heavy cloning, requiring controls for both generated scripts and reused templates.","The article’s practical recommendation is to choose a primary scripting strategy where possible, because few organizations are likely to manage both source-curation discipline for clones and output-verification discipline for AI-generated scripts well from the start."],"referencedReports":[{"title":"NIST SP 800-53 Rev. 5","url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","publisher":"NIST","context":"The article cites NIST SP 800-53 controls CM-7 and SI-7 as standards requiring least functionality and software integrity for scripts.","category":"guide","primary":false},{"title":"CIS Critical Security Controls v8","url":"https://www.cisecurity.org/controls","publisher":"Center for Internet Security","context":"The article cites CIS Critical Security Controls v8 as practical guidance for secure configuration and application software lifecycle discipline at SMB and MSP scale.","category":"guide","primary":false},{"title":"NIST AI Risk Management Framework 1.0","url":"https://www.nist.gov/itl/ai-risk-management-framework","publisher":"NIST","context":"The article references the NIST AI Risk Management Framework as dedicated guidance for managing risks from AI-generated operational artifacts.","category":"guide","primary":false},{"title":"OWASP Cheat Sheet Series","url":"https://cheatsheetseries.owasp.org/","publisher":"OWASP","context":"The article cites OWASP secure-coding and configuration-as-code guidance as practitioner references for validation, error handling, secrets management, and reproducibility.","category":"guide","primary":false}],"body":"\u003cp\u003eThe article examines two ways Acronis customers scale operational scripting: cloning trusted templates and generating scripts with AI. It argues that every script run on a customer endpoint is operational software with administrator privileges, so it should be reviewed, attributed, versioned, and retired like production code. The article ties this expectation to NIST SP 800-53 controls, CIS Critical Security Controls v8, the NIST AI Risk Management Framework, ENISA AI guidance, and OWASP secure-coding guidance.\u003c/p\u003e\n\n\u003cp\u003eAcronis platform data shows that about 38.9% of active scripts are clones of an existing source, with reuse heavily concentrated in a small number of templates. Six Acronis built-in scripts, each cloned by 500 or more distinct tenants, generate about 32.5% of all clone copies, and the top 28 templates account for about 69.5%. The article notes that all six of the most-cloned templates are Windows PowerShell scripts, all carry credentials in at least some tenant copies, and only about 63.5% to 78.8% of their clones are marked approved.\u003c/p\u003e\n\n\u003cp\u003eAI-generated scripting is described as a newer pattern, with about 15.6% of active scripts generated by AI and about 13.9% of classified script-using tenants falling into an AI-heavy cohort. Inside that cohort, about 74.4% of scripts are AI-generated, and the article says AI use appears to substitute for cloning rather than simply add to it. It reports average clone share of about 26.5% in AI-heavy tenants, 41.7% in AI-mixed tenants, and 55.9% in no-AI tenants, concluding that cloning-primary operations need source governance while AI-primary operations need output verification.\u003c/p\u003e\n"},{"n":26,"title":"What water utilities need to know about cybersecurity compliance","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/water-utilities-cybersecurity-regulatory-compliance","time":"20:15","priority":"MAY READ","score":55,"tldr":"Water and wastewater utilities face tightening cybersecurity compliance deadlines from existing federal requirements, emerging state mandates, and upcoming CIRCIA incident-reporting rules. The most urgent takeaway is that utilities should build cyber asset visibility, response, and reporting capabilities now rather than waiting for final regulations or grant funding.","briefOverview":"\u003cp\u003eWater and wastewater utilities are facing a growing set of cybersecurity compliance deadlines as federal enforcement tightens and states begin adding their own mandates. The article says the EPA’s attempt to add cybersecurity evaluations to state sanitary surveys stalled in court and was withdrawn, but the agency is still using existing authority, guidance, technical assistance, and enforcement alerts to inspect cyber gaps. The urgency is underscored by a coordinated cyberattack that disrupted water and wastewater operations across more than 30 Minnesota communities in late July 2026.\u003c/p\u003e\n\n\u003cp\u003eCommunity water systems serving more than 3,300 people must certify Risk and Resilience Assessments and Emergency Response Plans to the EPA on a five-year cycle, and those requirements explicitly cover cyber threats. Systems serving 3,301 to 49,999 people, described as the vast majority of U.S. water systems, must certify their RRAs by June 30, 2026, with ERPs due six months later. The EPA has also released updated tools including an Emergency Response Plan guide, a Cybersecurity Incident Response Plan template, incident-specific checklists, and a cybersecurity procurement checklist.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights New York’s March 2026 wastewater cybersecurity regulations as a template other states may follow, including mandatory incident reporting and access-control requirements. It also says CIRCIA will require covered water and wastewater utilities to report significant cyber incidents to CISA within 72 hours and ransom payments within 24 hours once updated rules are finalized. The article cites federal reports finding widespread cyber risk in water systems and says utilities need asset visibility, vulnerability management, monitoring, and documentation to support compliance and response.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The EPA’s attempt to add cybersecurity evaluations to state sanitary surveys was stayed in court and withdrawn, but the agency continues to use existing authority, guidance, technical assistance, and enforcement alerts to address cyber gaps in water systems.","Community water systems serving more than 3,300 people must certify Risk and Resilience Assessments and Emergency Response Plans to the EPA on a five-year cycle, with systems serving 3,301 to 49,999 people required to certify RRAs by June 30, 2026.","New York finalized binding cybersecurity regulations for wastewater treatment facilities in March 2026, including mandatory incident reporting and access-control requirements based on EPA cybersecurity guidance.","CIRCIA will require covered water and wastewater utilities to report significant cyber incidents to CISA within 72 hours and ransom payments within 24 hours once updated rules are finalized.","The article cites recent cyber threats to water infrastructure, including a coordinated cyberattack that disrupted water and wastewater utility operations across more than 30 Minnesota communities in late July 2026."],"insights":["Utilities should not treat the EPA’s withdrawn sanitary-survey mandate as a pause in enforcement, because the article says the agency is still using existing authority, inspections, technical guidance, and enforcement alerts to pressure utilities on cybersecurity gaps.","The article frames the RRA and ERP recertification process as the practical vehicle for cybersecurity compliance, meaning utilities can align cyber planning with documentation they are already legally required to submit.","New York’s wastewater cybersecurity rules are notable because wastewater systems are not covered by AWIA, making state regulation a likely path for requirements in an area that has largely lacked federal cyber mandates.","The article recommends that utilities operate as though CIRCIA reporting rules are already in effect, because waiting for final rules could leave them scrambling to build incident response and reporting processes.","Utilities that depend on federal cybersecurity grants or information-sharing protections should plan for uncertainty, because the article says those programs have lapsed, been reinstated, and remain tied to budget cycles."],"referencedReports":[{"title":"WWS Sector Incident Response Guide","url":"https://www.cisa.gov/sites/default/files/2024-10/WWS-Sector_Incident-Response-Guide.pdf","publisher":"CISA","context":"The article lists this as a revised Emergency Response Plan guide included in EPA’s updated package of cyber tools for utilities.","category":"guide","primary":false},{"title":"Water Critical Infrastructure: EPA and CISA Should Improve Actions to Support Water Sector Cybersecurity","url":"https://www.gao.gov/products/gao-24-106744","publisher":"U.S. Government Accountability Office","context":"The article cites the GAO’s 2024 review as finding that nearly 170,000 U.S. water systems face cyber risk and are increasingly automated.","category":"research","primary":false},{"title":"Management Implication Report: Cybersecurity Concerns Related to Drinking Water Systems","url":"https://www.epa.gov/office-inspector-general/report-management-implication-report-cybersecurity-concerns-related","publisher":"EPA Office of Inspector General","context":"The article cites this EPA Inspector General report as identifying critical- or high-severity vulnerabilities at 97 drinking water systems serving 27 million people.","category":"research","primary":false}],"body":"\u003cp\u003eWater and wastewater utilities are facing a growing set of cybersecurity compliance deadlines as federal enforcement tightens and states begin adding their own mandates. The article says the EPA’s attempt to add cybersecurity evaluations to state sanitary surveys stalled in court and was withdrawn, but the agency is still using existing authority, guidance, technical assistance, and enforcement alerts to inspect cyber gaps. The urgency is underscored by a coordinated cyberattack that disrupted water and wastewater operations across more than 30 Minnesota communities in late July 2026.\u003c/p\u003e\n\n\u003cp\u003eCommunity water systems serving more than 3,300 people must certify Risk and Resilience Assessments and Emergency Response Plans to the EPA on a five-year cycle, and those requirements explicitly cover cyber threats. Systems serving 3,301 to 49,999 people, described as the vast majority of U.S. water systems, must certify their RRAs by June 30, 2026, with ERPs due six months later. The EPA has also released updated tools including an Emergency Response Plan guide, a Cybersecurity Incident Response Plan template, incident-specific checklists, and a cybersecurity procurement checklist.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights New York’s March 2026 wastewater cybersecurity regulations as a template other states may follow, including mandatory incident reporting and access-control requirements. It also says CIRCIA will require covered water and wastewater utilities to report significant cyber incidents to CISA within 72 hours and ransom payments within 24 hours once updated rules are finalized. The article cites federal reports finding widespread cyber risk in water systems and says utilities need asset visibility, vulnerability management, monitoring, and documentation to support compliance and response.\u003c/p\u003e\n"},{"n":41,"title":"Walk, Run, Fly: A Practical Framework for SaaS Security Prioritization","source":"appomni.com","sourceColorIdx":0,"link":"https://appomni.com/blog/saas-security-prioritization-framework/","time":"12:00","priority":"MAY READ","score":50,"tldr":"SaaS security teams should prioritize the small set of business-critical apps that hold most sensitive data, rather than trying to secure every tool equally. AppOmni recommends a phased “Walk, Run, Fly” approach: lock down critical apps first, operationalize ownership and controls, then move to continuous monitoring.","briefOverview":"\u003cp\u003eThe article argues that organizations should prioritize securing the SaaS applications that hold their most valuable business-critical data. It says most SaaS risk and sensitive data are concentrated in a small number of applications, such as Salesforce, ServiceNow, Microsoft 365, and Workday. Threat actors including ShinyHunters and Scattered Spider have targeted platforms like Salesforce, Snowflake, and Okta because they contain privileged identities, sensitive data, and important business processes.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that trying to secure every SaaS application equally can drain resources, create alert overload, and leave the riskiest applications without enough attention. It cites AppOmni’s 2025 State of SaaS Security Report, which found that 89% of breached organizations believed they had appropriate visibility at the time of the incident. It also points to Snowflake-related attacks where stolen credentials, weak authentication practices, and configuration gaps were used to access sensitive environments.\u003c/p\u003e\n\n\u003cp\u003eAppOmni presents a phased “Walk, Run, Fly” framework for building a SaaS security program. The “Walk” phase focuses on securing critical applications, enforcing multi-factor authentication, inventorying service accounts and integrations, and centralizing SaaS logs. The “Run” phase adds operational ownership, procurement reviews, configuration standards, and Zero Trust principles, while the “Fly” phase emphasizes continuous monitoring of configuration drift, SaaS telemetry, and both human and non-human identities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that most SaaS security risk and sensitive data are concentrated in a small number of business-critical applications such as Salesforce, ServiceNow, Microsoft 365, and Workday.","The article says attackers have targeted major SaaS platforms such as Salesforce, Snowflake, and Okta because they contain privileged identities, sensitive data, and important business processes.","AppOmni recommends a phased “Walk, Run, Fly” SaaS security program that starts by securing critical applications, then operationalizes security processes, and finally moves toward continuous risk reduction.","The “Walk” phase focuses on identifying high-risk SaaS applications, enforcing multi-factor authentication, inventorying service accounts and third-party integrations, and centralizing SaaS logs.","The article states that mature SaaS security programs should continuously monitor configuration changes and both human and non-human identities, including service accounts, API-based identities, and AI agents."],"insights":["The article highlights that 89% of breached organizations in AppOmni’s 2025 State of SaaS Security Report believed they had appropriate visibility at the time of the incident, showing that confidence in coverage can differ sharply from actual SaaS security visibility.","The article frames SaaS prioritization as a resource-management problem, arguing that trying to secure every application equally can increase risk by draining teams, burying real threats in alert noise, and leaving the most critical apps underprotected.","The article treats procurement as part of SaaS security operations, recommending that new SaaS applications be reviewed before adoption rather than only after they are already in use.","The article says the Snowflake-related attacks showed that consistent foundational controls across critical SaaS apps can reduce risk, because attackers used stolen credentials, weak authentication practices, and configuration gaps rather than sophisticated exploits.","The article warns that AI-powered SaaS apps and autonomous agents make prioritization more important because they add new identities, integrations, and automated workflows that can expand the attack surface."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that organizations should prioritize securing the SaaS applications that hold their most valuable business-critical data. It says most SaaS risk and sensitive data are concentrated in a small number of applications, such as Salesforce, ServiceNow, Microsoft 365, and Workday. Threat actors including ShinyHunters and Scattered Spider have targeted platforms like Salesforce, Snowflake, and Okta because they contain privileged identities, sensitive data, and important business processes.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that trying to secure every SaaS application equally can drain resources, create alert overload, and leave the riskiest applications without enough attention. It cites AppOmni’s 2025 State of SaaS Security Report, which found that 89% of breached organizations believed they had appropriate visibility at the time of the incident. It also points to Snowflake-related attacks where stolen credentials, weak authentication practices, and configuration gaps were used to access sensitive environments.\u003c/p\u003e\n\n\u003cp\u003eAppOmni presents a phased “Walk, Run, Fly” framework for building a SaaS security program. The “Walk” phase focuses on securing critical applications, enforcing multi-factor authentication, inventorying service accounts and integrations, and centralizing SaaS logs. The “Run” phase adds operational ownership, procurement reviews, configuration standards, and Zero Trust principles, while the “Fly” phase emphasizes continuous monitoring of configuration drift, SaaS telemetry, and both human and non-human identities.\u003c/p\u003e\n"},{"n":21,"title":"The Network Has Become the Control Plane for AI Security","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/the-network-has-become-control-plane.html","time":"11:32","priority":"MAY READ","score":45,"tldr":"Check Point argues that AI-driven prompts, model calls, and autonomous agent activity have outgrown traditional firewall visibility, making the network a key control point for AI security. The company is promoting its AI Network Firewall as an intent-aware way to inspect and govern AI use across employees, applications, and agents.","briefOverview":"\u003cp\u003eCheck Point says AI is changing enterprise network activity in ways traditional firewalls were not designed to govern. Employees, applications, and AI agents now send prompts, call models, connect to services, trigger actions, and communicate with other systems, including autonomous agent-to-agent activity. The article argues that many firewalls can identify destinations and connections but cannot understand the context or intent behind AI interactions.\u003c/p\u003e\n\n\u003cp\u003eCheck Point is introducing its AI Network Firewall, which it describes as the industry’s first AI Network Firewall and part of its AI Defense Plane. The company says it turns the existing firewall into an intent-aware enforcement layer for detecting, inspecting, and controlling AI activity across enterprise networks, cloud environments, branches, and AI data centers. The article says this approach can inspect prompts, model interactions, file uploads, API calls, and agent behavior in real time.\u003c/p\u003e\n\n\u003cp\u003eThe article frames the network as the central control point for securing AI use at scale. It says an AI Network Firewall can help prevent prompt-injection attacks, stop data exfiltration, detect API abuse, govern MCP servers, and centralize oversight of AI usage across employees, applications, and autonomous agents. It also says AI security operations need human-language policy management, automated event analysis, agentic orchestration, centralized management, unified policy enforcement, automated lifecycle operations, and continuous monitoring.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says AI is changing network activity because employees, applications, and agents send prompts, call models, connect to services, and trigger actions that many traditional firewalls cannot see or understand.","Check Point is introducing what it calls the industry's first AI Network Firewall, integrated into its AI Defense Plane, to inspect and control AI activity across enterprise networks, clouds, branches, and AI data centers.","The article identifies a visibility gap in which conventional firewalls cannot inspect prompts, determine whether sensitive information is being exposed, govern agent-to-agent interactions, or identify malicious AI-driven activity.","Check Point says an intent-aware AI Network Firewall can help prevent prompt-injection attacks, stop data exfiltration, detect API abuse, govern MCP servers, and centralize oversight of AI usage.","The article argues that future firewalls must understand prompts, model calls, agent requests, and AI-driven workflows so organizations can adopt AI with greater visibility, accountability, and protection."],"insights":["The article frames AI security as a network-layer problem rather than a separate AI-tool problem, arguing that governance should be embedded in the firewall path where employee, application, and agent activity already passes.","Check Point’s proposed model expands firewall policy decisions from destinations and connections to the intent of prompts, model calls, file uploads, API calls, and agent behavior.","The article highlights agent-to-agent communication and MCP server governance as emerging areas that traditional firewall models were not designed to handle.","The article connects AI security with operational automation, saying human-language policy management, automated event analysis, and agentic orchestration are needed because manual policy workflows cannot keep pace with AI adoption.","The article emphasizes reusing existing labels, tags, identities, and asset classifications to enforce AI-related access control, rather than duplicating policy across separate tools."],"referencedReports":[],"body":"\u003cp\u003eCheck Point says AI is changing enterprise network activity in ways traditional firewalls were not designed to govern. Employees, applications, and AI agents now send prompts, call models, connect to services, trigger actions, and communicate with other systems, including autonomous agent-to-agent activity. The article argues that many firewalls can identify destinations and connections but cannot understand the context or intent behind AI interactions.\u003c/p\u003e\n\n\u003cp\u003eCheck Point is introducing its AI Network Firewall, which it describes as the industry’s first AI Network Firewall and part of its AI Defense Plane. The company says it turns the existing firewall into an intent-aware enforcement layer for detecting, inspecting, and controlling AI activity across enterprise networks, cloud environments, branches, and AI data centers. The article says this approach can inspect prompts, model interactions, file uploads, API calls, and agent behavior in real time.\u003c/p\u003e\n\n\u003cp\u003eThe article frames the network as the central control point for securing AI use at scale. It says an AI Network Firewall can help prevent prompt-injection attacks, stop data exfiltration, detect API abuse, govern MCP servers, and centralize oversight of AI usage across employees, applications, and autonomous agents. It also says AI security operations need human-language policy management, automated event analysis, agentic orchestration, centralized management, unified policy enforcement, automated lifecycle operations, and continuous monitoring.\u003c/p\u003e\n"},{"n":15,"title":"ThreatsDay: AI-Powered Hacking, 370 Chrome Flaws, SonicWall Attacks, DNS Hijacking + 22 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/threatsday-ai-powered-hacking-370.html","time":"15:25","priority":"MAY READ","score":40,"tldr":"This week’s threats show attackers increasingly abusing trusted interfaces and relationships, from fake AI install guides, recruiter lures, credential stuffing, and DNS hijacking to partner access and SaaS account takeovers. The biggest takeaway is that identity, edge devices, and trusted workflows remain the easiest paths into organizations, even as AI begins accelerating exploitation and phishing.","briefOverview":"\u003cp\u003eThis ThreatsDay roundup covers a wide set of security stories involving phishing, malware delivery, ransomware, credential abuse, data exposure, vulnerable products, and AI-assisted hacking. The article emphasizes that many incidents relied on misplaced trust in familiar screens, services, partners, or workflows, including fake login pages, fake install guides, recruiter lures, trusted third-party access, and SaaS account takeover paths. Notable impacts include Origin Energy reporting that data for about 900,000 current and former customers was accessed, CubePilot warning that credentials entered on its services during a DNS hijack may have been captured, and Huntress observing unauthorized SonicWall logins across 30 organizations.\u003c/p\u003e\n\n\u003cp\u003eSeveral reports describe attackers using social engineering and legitimate services to deliver malware or hide malicious activity. Examples include xplogs22 phishing campaigns delivering XWorm, Toy Ghouls using GenieLocker ransomware against Russian organizations, fake Claude install instructions leading to MacSync Stealer, fake recruiter activity delivering a malicious Relay application, and APT-C-60 spear-phishing Japanese organizations with SpyGlace through Proton Drive, jsDelivr, and GitHub-linked infrastructure. The article also describes ClickFix-style lures that trick users into running commands, including a WebDAV and rundll32.exe variant that loads a remote payload without leaving the payload on disk.\u003c/p\u003e\n\n\u003cp\u003eThe roundup also highlights defensive and vulnerability-focused developments, including Google patching 370 Chrome flaws, GitHub outlining supply chain security changes for npm and GitHub Actions, and the U.K. NCSC calling for better forensic visibility in edge network devices. Unit 42 reported that a Chinese-speaking actor using the aliases knaithe and KnYuan used DeepSeek through Hermes Agent to automate parts of attacks against vulnerabilities in products such as Langflow, n8n, Citrix NetScaler, Apache Tomcat, Marimo Notebook, PAN-OS, and Microsoft Windows IKE Extensions. VulnCheck also reported that 23.43% of known exploited vulnerabilities showed evidence of exploitation on or before the day the CVE was published, while the median time from CVE publication to known exploitation fell from 120 days in 2025 to 80 days in the first half of 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Chinese-speaking threat actor using the aliases knaithe and KnYuan has used DeepSeek through the Hermes Agent framework to autonomously enumerate targets, source exploit tools, and launch attacks against vulnerabilities in Langflow, n8n, Citrix NetScaler, Apache Tomcat, Marimo Notebook, PAN-OS, and Microsoft Windows IKE Extensions.","Google released Chrome updates on July 29, 2026, fixing 370 flaws, including seven critical vulnerabilities, with no patched flaws reported as actively exploited.","Huntress observed an active credential stuffing campaign against SonicWall VPN and firewall accounts beginning July 25, 2026, affecting 92 unique user accounts across 30 organizations.","CubePilot said attackers hijacked the cubepilot.org DNS settings on July 24, obtained TLS certificates for all cubepilot.org subdomains, and may have captured credentials entered on its services that day.","Origin Energy said information belonging to approximately 900,000 current and former customers was accessed during a July 2026 security incident."],"insights":["Several incidents in the roundup show that trusted access was the weak point: Toy Ghouls likely entered through an external partner’s OpenVPN connection, the XMRig campaign exploited a trusted third-party relationship, and ShinyHunters used helpdesk or MFA reset workflows to take over SaaS accounts.","Attackers are increasingly using legitimate services to make malicious activity look normal, including Claude shared conversations for a fake Mac install guide, Proton Drive and jsDelivr in APT-C-60 activity, and Thum.io, Clearbit, Google Favicon, ImageKit, and Microlink APIs in LogoKit phishing pages.","ClickFix-style lures are evolving from simple copy-and-paste tricks into stealthier execution chains, including a variant that runs a remote WebDAV-hosted payload through rundll32.exe without leaving the payload on disk.","The article highlights a growing need for better evidence collection from edge devices, as the U.K. NCSC specifically called for network appliance makers to provide telemetry, logs, configuration state, and memory or disk forensic collection mechanisms after compromise.","VulnCheck’s finding that 23.43% of known exploited vulnerabilities showed exploitation on or before CVE publication underscores that defenders may have little or no warning time once some flaws become public."],"referencedReports":[{"title":"Xplogs22 Targets Russia with XWorm","url":"https://www.f6.ru/blog/xplogs22/","publisher":"F6","context":"The article cites F6's report on xplogs22 phishing emails delivering XWorm in Russia and other CIS countries.","category":"research","primary":true},{"title":"LunaSpy Android Research","url":"https://www.f6.ru/blog/lunaspy-android-research/","publisher":"F6","context":"The article links F6 research on LunaSpy while noting Russian banking customers were targeted by the Android trojan.","category":"research","primary":false},{"title":"Toy Ghouls Come Back with GenieLocker Ransomware","url":"https://securelist.com/genielocker-ransomware-for-windows-linux-and-esxi/120843/","publisher":"Kaspersky","context":"The article cites Kaspersky's analysis of Toy Ghouls using the custom GenieLocker ransomware against Russian organizations.","category":"research","primary":true},{"title":"CastleLoader Delivers Needle Stealer","url":"https://arcticwolf.com/resources/blog/castleloader-new-campaigns-new-tooling-and-the-needlestealer-connection/","publisher":"Arctic Wolf","context":"The article references Arctic Wolf's research on CastleLoader distributing Needle Stealer-related payloads.","category":"research","primary":true},{"title":"ClickFix Continues to Evolve","url":"https://www.cyberproof.com/blog/clickfix-keeps-evolving-rundll32-ordinal-execution-over-webdav/","publisher":"CyberProof","context":"The article cites CyberProof's analysis of a ClickFix variant using WebDAV and rundll32.exe for fileless execution.","category":"research","primary":true},{"title":"Fake Claude Install Guide Leads to MacSync Stealer","url":"https://www.huntress.com/blog/macsync-stealer-rat-reverse-engineering","publisher":"Huntress","context":"The article references Huntress's reverse engineering of a fake Claude install guide that delivers MacSync Stealer.","category":"research","primary":true},{"title":"Cybercriminal Campaign Delivers Commodity Malware","url":"https://www.vmray.com/execution-level-analysis-of-a-russian-speaking-multi-operator-intrusion-campaign-operation-standoff/#elementor-toc__heading-anchor-8","publisher":"VMRay Labs","context":"The article cites VMRay Labs' analysis of Operation STANDOFF and its malware, intrusion, proxy-botnet, and influence capabilities.","category":"research","primary":true},{"title":"Exploiting Volvo/Eicher's Fleet Management Platform","url":"https://eaton-works.com/2026/07/27/my-eicher-hack/","publisher":"Eaton Zveare","context":"The article references Eaton Zveare's disclosure of vulnerabilities in the My Eicher fleet management platform.","category":"research","primary":true},{"title":"Chinese-Speaking Threat Actor Abuses AI Models for Autonomous Attacks","url":"https://unit42.paloaltonetworks.com/autonomous-ai-cyber-attack-campaign/","publisher":"Unit 42","context":"The article cites Unit 42's report on a Chinese-speaking actor using AI models and Hermes Agent to automate offensive activity.","category":"research","primary":true},{"title":"Cryptomining Campaign Abuses Trusted Access","url":"https://www.group-ib.com/blog/xmrig-covert-linux-pam-abuse/","publisher":"Group-IB","context":"The article references Group-IB's analysis of a covert Linux XMRig campaign abusing trusted access and PAM.","category":"research","primary":true},{"title":"Job Scam Campaign Targets Web3 Sector","url":"https://slowmist.medium.com/threat-intelligence-job-scam-alert-interview-software-used-to-deliver-an-info-stealing-malware-37f018877e4c","publisher":"SlowMist","context":"The article cites SlowMist's alert about fake recruiter lures delivering an information-stealing application disguised as an AI meeting tool.","category":"research","primary":true},{"title":"Origin Energy Says 900K Customers' Data Accessed","url":"https://www.originenergy.com.au/about/investors-media/further-update-on-data-security-incident/","publisher":"Origin Energy","context":"The article references Origin Energy's update on a security incident affecting approximately 900,000 current and former customers.","category":"advisory","primary":true},{"title":"Health-ISAC Warns of Rising ShinyHunters Attacks on Healthcare Sector","url":"https://health-isac.org/shiny-hunters-impact-to-health-sector-and-recommended-mitigation-strategies/","publisher":"Health-ISAC","context":"The article cites Health-ISAC's warning about increasing ShinyHunters attacks targeting healthcare SaaS accounts.","category":"advisory","primary":true},{"title":"GitHub Outlines Changes Made to Tackle Supply Chain Attacks","url":"https://github.blog/security/supply-chain-security/disrupting-supply-chain-attacks-on-npm-and-github-actions/","publisher":"GitHub","context":"The article references GitHub's security write-up describing measures to harden npm and GitHub Actions against supply chain attacks.","category":"advisory","primary":true},{"title":"Google Fixes 370 Chrome Bugs","url":"https://chromereleases.googleblog.com/2026/07/stable-channel-update-for-desktop_0887107924.html","publisher":"Google","context":"The article cites Google's Chrome stable channel update that patched 370 browser flaws, including seven critical vulnerabilities.","category":"advisory","primary":true},{"title":"U.K. NCSC Calls for Making Forensic Observability the Norm for Network Devices","url":"https://www.ncsc.gov.uk/blogs/making-forensic-observability-the-norm-for-network-devices","publisher":"U.K. National Cyber Security Centre","context":"The article references the NCSC's guidance urging network device makers to improve forensic data collection after compromise.","category":"advisory","primary":true},{"title":"LogoKit Phishing Kit Screenshots Victim Sites in Real-Time","url":"https://blog.barracuda.com/2026/07/29/logokit-phishing-service-real-time-deception-platform","publisher":"Barracuda","context":"The article cites Barracuda's research on LogoKit creating customized phishing pages using real-time victim-site screenshots and legitimate services.","category":"research","primary":true},{"title":"State of Exploitation H1-2026","url":"https://www.vulncheck.com/blog/state-of-exploitation-1h-2026","publisher":"VulnCheck","context":"The article references VulnCheck's analysis of exploitation trends and timing in the first half of 2026.","category":"research","primary":true},{"title":"Widespread SonicWall Credential Stuffing Campaign","url":"https://www.huntress.com/blog/sonicwall-credential-stuffing-campaign","publisher":"Huntress","context":"The article cites Huntress's report on an active credential stuffing campaign against SonicWall VPN and firewall accounts.","category":"research","primary":true},{"title":"New MedusaHVNC RAT Spotted","url":"https://www.blackfog.com/medusahvnc-a-hidden-desktop/","publisher":"BlackFog","context":"The article references BlackFog's analysis of MedusaHVNC, a malware-as-a-service RAT using a hidden desktop to access live sessions.","category":"research","primary":true},{"title":"CubePilot Hit by DNS Hijacking to Intercept Traffic","url":"https://cubepilot.com/security-notice/","publisher":"CubePilot","context":"The article cites CubePilot's security notice about a DNS hijacking incident that may have exposed credentials entered on its services.","category":"advisory","primary":true},{"title":"APT-C-60 Continues to Target Japan with SpyGlace","url":"https://blogs.jpcert.or.jp/en/2026/07/apt-c-60_2026.html","publisher":"JPCERT/CC","context":"The article references JPCERT/CC's analysis of APT-C-60 spear-phishing activity delivering SpyGlace malware to Japanese organizations.","category":"research","primary":true},{"title":"Fake games Spread Stealers with RenPy Loader","url":"https://www.malwarebytes.com/blog/threat-intel/2026/07/fake-games-spread-stealers-with-renpy-loader-msbuild-and-etherhiding","publisher":"Malwarebytes","context":"The article cites Malwarebytes' research on fake game, mod, crack, and software downloads using RenPy Loader to deliver Amatera Stealer and other payloads.","category":"research","primary":true}],"body":"\u003cp\u003eThis ThreatsDay roundup covers a wide set of security stories involving phishing, malware delivery, ransomware, credential abuse, data exposure, vulnerable products, and AI-assisted hacking. The article emphasizes that many incidents relied on misplaced trust in familiar screens, services, partners, or workflows, including fake login pages, fake install guides, recruiter lures, trusted third-party access, and SaaS account takeover paths. Notable impacts include Origin Energy reporting that data for about 900,000 current and former customers was accessed, CubePilot warning that credentials entered on its services during a DNS hijack may have been captured, and Huntress observing unauthorized SonicWall logins across 30 organizations.\u003c/p\u003e\n\n\u003cp\u003eSeveral reports describe attackers using social engineering and legitimate services to deliver malware or hide malicious activity. Examples include xplogs22 phishing campaigns delivering XWorm, Toy Ghouls using GenieLocker ransomware against Russian organizations, fake Claude install instructions leading to MacSync Stealer, fake recruiter activity delivering a malicious Relay application, and APT-C-60 spear-phishing Japanese organizations with SpyGlace through Proton Drive, jsDelivr, and GitHub-linked infrastructure. The article also describes ClickFix-style lures that trick users into running commands, including a WebDAV and rundll32.exe variant that loads a remote payload without leaving the payload on disk.\u003c/p\u003e\n\n\u003cp\u003eThe roundup also highlights defensive and vulnerability-focused developments, including Google patching 370 Chrome flaws, GitHub outlining supply chain security changes for npm and GitHub Actions, and the U.K. NCSC calling for better forensic visibility in edge network devices. Unit 42 reported that a Chinese-speaking actor using the aliases knaithe and KnYuan used DeepSeek through Hermes Agent to automate parts of attacks against vulnerabilities in products such as Langflow, n8n, Citrix NetScaler, Apache Tomcat, Marimo Notebook, PAN-OS, and Microsoft Windows IKE Extensions. VulnCheck also reported that 23.43% of known exploited vulnerabilities showed evidence of exploitation on or before the day the CVE was published, while the median time from CVE publication to known exploitation fell from 120 days in 2025 to 80 days in the first half of 2026.\u003c/p\u003e\n"},{"n":33,"title":"You were onto something with “It’s the Climb,” Miley","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/you-were-onto-something-with-its-the-climb-miley/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Talos’ Q2 2026 incident response trends show phishing and authentication abuse surging, with attackers using QR codes, MFA-bypass platforms, and legitimate remote management tools to blend in before ransomware attacks. Organizations should move to phishing-resistant MFA, monitor for unauthorized admin tools, retain centralized logs, and prioritize patching internet-facing systems.","briefOverview":"\u003cp\u003eTalos released its Q2 2026 Incident Response Trends report, which showed a major spike in authentication abuse and sophisticated phishing tactics. Phishing drove over half of all engagements, with attackers using QR codes and advanced platforms like ARToken to bypass multi-factor authentication. The report also noted that ransomware operators are increasingly using legitimate remote management tools such as MeshAgent and Zoho Assist to establish stealthy, persistent access.\u003c/p\u003e\n\n\u003cp\u003eThe article says standard email gateways and basic MFA are no longer enough to stop adversaries from bypassing traditional defenses. By abusing legitimate administrative tools and trusted cloud infrastructure, threat actors can blend malicious traffic with normal network activity and remain undetected before deploying ransomware. It also highlights the continued targeting of health care and public administration as a deliberate focus on organizations with zero tolerance for downtime.\u003c/p\u003e\n\n\u003cp\u003eTalos recommends that organizations move from push- and SMS-based MFA to phishing-resistant methods such as FIDO2 or hardware security keys. Defenders are also advised to use behavior-based monitoring to hunt for unauthorized administrative tools, configure centralized logging with at least 90 days of retention, enforce strict outbound email thresholds, and prioritize patching internet-exposed infrastructure. The newsletter also lists several related security headlines, Talos podcasts and research posts, upcoming events, and prevalent malware files from Talos telemetry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Talos released its Q2 2026 Incident Response Trends report, which showed a large spike in authentication abuse and sophisticated phishing tactics.","Phishing drove over half of Talos incident response engagements, with attackers using QR codes and advanced platforms like ARToken to bypass multi-factor authentication.","Ransomware operators are increasingly using legitimate remote management tools such as MeshAgent and Zoho Assist to establish stealthy, persistent access.","Talos said standard email gateways and basic multi-factor authentication are no longer enough because attackers can abuse legitimate administrative tools and trusted cloud infrastructure to blend in with normal network activity.","Talos recommended moving from push- and SMS-based multi-factor authentication to phishing-resistant methods like FIDO2 or hardware security keys, monitoring for unauthorized administrative tools, keeping at least 90 days of centralized logs, enforcing outbound email thresholds, and prioritizing patching of internet-exposed infrastructure."],"insights":["Attackers are not relying only on obviously malicious tools; Talos observed them using legitimate remote management software such as MeshAgent and Zoho Assist, which means defenders need to look for unauthorized use of normal administrative tools rather than only known malware.","The article specifically calls out QR code phishing and ARToken as ways attackers are bypassing multi-factor authentication, making push- and SMS-based MFA insufficient against the tactics Talos observed.","Talos recommends at least 90 days of centralized log retention, indicating that shorter logging windows may leave organizations without enough history to investigate intrusions that develop over time.","The continued targeting of health care and public administration shows attackers are focusing on organizations where downtime is least tolerable, raising the impact of ransomware beyond data loss or IT disruption."],"referencedReports":[],"body":"\u003cp\u003eTalos released its Q2 2026 Incident Response Trends report, which showed a major spike in authentication abuse and sophisticated phishing tactics. Phishing drove over half of all engagements, with attackers using QR codes and advanced platforms like ARToken to bypass multi-factor authentication. The report also noted that ransomware operators are increasingly using legitimate remote management tools such as MeshAgent and Zoho Assist to establish stealthy, persistent access.\u003c/p\u003e\n\n\u003cp\u003eThe article says standard email gateways and basic MFA are no longer enough to stop adversaries from bypassing traditional defenses. By abusing legitimate administrative tools and trusted cloud infrastructure, threat actors can blend malicious traffic with normal network activity and remain undetected before deploying ransomware. It also highlights the continued targeting of health care and public administration as a deliberate focus on organizations with zero tolerance for downtime.\u003c/p\u003e\n\n\u003cp\u003eTalos recommends that organizations move from push- and SMS-based MFA to phishing-resistant methods such as FIDO2 or hardware security keys. Defenders are also advised to use behavior-based monitoring to hunt for unauthorized administrative tools, configure centralized logging with at least 90 days of retention, enforce strict outbound email thresholds, and prioritize patching internet-exposed infrastructure. The newsletter also lists several related security headlines, Talos podcasts and research posts, upcoming events, and prevalent malware files from Talos telemetry.\u003c/p\u003e\n"}]</script>
