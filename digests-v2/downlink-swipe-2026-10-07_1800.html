<script type="application/json" id="dl-articles">[{"n":2,"title":"FBI: Ongoing FortiBleed attacks lock out FortiGate VPN admins","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fbi-ongoing-fortibleed-attacks-lock-out-fortigate-vpn-admins/","time":"21:28","priority":"MUST READ","score":92,"tldr":"The FBI warns that attackers are still using leaked FortiGate SSL VPN credentials in the FortiBleed campaign to seize administrator access, lock out defenders, and establish persistence. The access has been linked to ransomware affiliates, so affected organizations should restrict external exposure, terminate VPN sessions, reset credentials, enforce MFA, and investigate for unauthorized changes.","briefOverview":"\u003cp\u003eThe FBI warns that FortiBleed attacks are continuing against exposed Fortinet FortiGate firewalls and SSL VPN gateways. Attackers use previously leaked credentials, credentials from infostealer logs, credential stuffing, or password spraying to access devices. In some cases, they create administrator accounts, delete existing accounts, or change administrators’ passwords, locking legitimate users out.\u003c/p\u003e\n\n\u003cp\u003eThe attackers extract additional authentication data from compromised devices and use Hashcat and Hashtopolis on distributed GPU systems to crack stolen password hashes offline. The FBI says the attack chain has been used as an initial entry point for ransomware affiliates, including groups associated with INC/Lynx and Payload ransomware. It recommends restricting external access, ending active VPN sessions, enforcing MFA, reviewing logs for unauthorized changes, and using PBKDF2 for administrator password storage rather than legacy SHA-256 hashes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI warns that FortiBleed attacks continue to target exposed Fortinet FortiGate firewalls and SSL VPN gateways, using leaked, stolen, or guessed credentials to gain access.","Attackers have been observed extracting authentication data from compromised devices and using distributed GPU systems with Hashcat and Hashtopolis to crack stolen password hashes offline.","In some incidents, threat actors create administrator accounts and delete existing administrator accounts or change their passwords, locking legitimate administrators out of their devices.","The FBI says the FortiBleed attack chain has been used as an initial entry point by ransomware affiliates, including groups associated with INC/Lynx and Payload ransomware.","The FBI recommends restricting external access, terminating active VPN sessions, enforcing MFA, reviewing logs for unauthorized activity, and using PBKDF2 for administrator password storage."],"insights":["Patching Fortinet devices and resetting passwords alone may not remove the threat, because attackers can create replacement administrator accounts, maintain access, and move through the affected organization.","The exposed attacker backend indicated that compromised FortiGate access was being organized for sale, including working VPN configurations and target lists.","The operation used scripts not only to find exposed FortiGate portals but also to filter out honeypots and prioritize organizations by revenue and network structure.","The FBI specifically recommends PBKDF2 for administrator password storage because the legacy SHA-256 hashes used by some systems can be practically cracked offline after they are stolen."],"referencedReports":[{"title":"FortiBleed: Fortinet Firewalls Compromised","url":"http://socradar.io/blog/fortibleed-fortinet-firewalls-compromised/","publisher":"socradar","context":"The article cites SOCRadar's latest count that the FortiBleed campaign compromised 86,644 devices.","category":"research","primary":false}],"body":"\u003cp\u003eThe FBI warns that FortiBleed attacks are continuing against exposed Fortinet FortiGate firewalls and SSL VPN gateways. Attackers use previously leaked credentials, credentials from infostealer logs, credential stuffing, or password spraying to access devices. In some cases, they create administrator accounts, delete existing accounts, or change administrators’ passwords, locking legitimate users out.\u003c/p\u003e\n\n\u003cp\u003eThe attackers extract additional authentication data from compromised devices and use Hashcat and Hashtopolis on distributed GPU systems to crack stolen password hashes offline. The FBI says the attack chain has been used as an initial entry point for ransomware affiliates, including groups associated with INC/Lynx and Payload ransomware. It recommends restricting external access, ending active VPN sessions, enforcing MFA, reviewing logs for unauthorized changes, and using PBKDF2 for administrator password storage rather than legacy SHA-256 hashes.\u003c/p\u003e\n"},{"n":6,"title":"Arizona courts say hackers stole info on more than 1.3 million people","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/arizona-courts-say-hackers-stole-info-on-over-1-million","time":"18:31","priority":"SHOULD READ","score":88,"tldr":"Arizona’s court system says a phishing-led cyberattack exposed and copied decades of sensitive records affecting more than 1.3 million people, including Social Security numbers, foster-care reports, and protective-order data. Investigators say no ransomware demand has been made.","briefOverview":"\u003cp\u003eArizona court officials said criminal hackers accessed and copied backup court files in a cyberattack affecting the state’s court system. Investigators believe the intrusion began when a court employee clicked a malicious link in an email. The attack started on September 24 and continued until the court’s IT team shut down the system.\u003c/p\u003e\n\n\u003cp\u003eThe breach of the Fines/Fees and Restitution Enforcement Program exposed names, Social Security numbers, and case numbers for more than 1.3 million people, with records spanning 30 years. Hackers also accessed more than 150,000 Foster Care Review Board reports, including cases involving 8,000 children currently in foster care, as well as active and inactive protective-order records. Arizona courts said the file format may make the copied files difficult to read, and stated that the incident did not involve ransomware or a ransom demand as of Monday.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arizona court officials said investigators confirmed that criminals accessed and copied backup court files in a cyberattack.","The breach of Arizona’s Fines/Fees and Restitution Enforcement Program exposed names, Social Security numbers, and case numbers dating back 30 years for more than 1.3 million people.","The hackers also accessed more than 150,000 Foster Care Review Board reports dating to 2010, including reports involving 8,000 children currently in foster care.","Investigators believe the incident began when a court employee clicked a malicious link in an email.","Arizona’s court system said the incident did not involve ransomware, and no group had claimed responsibility or made a ransom demand as of Wednesday."],"insights":["The compromise involved backup court files, and Arizona court officials said the files’ format may make them difficult for the hackers to read.","Affected people in the Fines/Fees and Restitution Enforcement Program are being notified by text message and were urged to place holds on their credit lines.","The incident reached beyond financial court-debt records to include foster-care reports and active and inactive protective-order records containing sensitive information.","Although data was copied, Arizona’s court system said there had been no ransom demand and that the incident did not involve ransomware."],"referencedReports":[],"body":"\u003cp\u003eArizona court officials said criminal hackers accessed and copied backup court files in a cyberattack affecting the state’s court system. Investigators believe the intrusion began when a court employee clicked a malicious link in an email. The attack started on September 24 and continued until the court’s IT team shut down the system.\u003c/p\u003e\n\n\u003cp\u003eThe breach of the Fines/Fees and Restitution Enforcement Program exposed names, Social Security numbers, and case numbers for more than 1.3 million people, with records spanning 30 years. Hackers also accessed more than 150,000 Foster Care Review Board reports, including cases involving 8,000 children currently in foster care, as well as active and inactive protective-order records. Arizona courts said the file format may make the copied files difficult to read, and stated that the incident did not involve ransomware or a ransom demand as of Monday.\u003c/p\u003e\n"},{"n":7,"title":"Attackers Hijack .gh, .sl, and .as Registries to Obtain Certificates for Google Domains","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/attackers-hijack-gh-sl-and-as.html","time":"18:48","priority":"SHOULD READ","score":86,"tldr":"Attackers hijacked the .gh, .sl, and .as ccTLD registries to alter DNS records and obtain unauthorized TLS certificates for Google and YouTube domains. Google blocked the certificates in Chrome and worked with certificate authorities to revoke them, highlighting the risk to any domains under the affected registries.","briefOverview":"\u003cp\u003eAttackers compromised the .gh, .sl, and .as country-code top-level domain registries and changed authoritative DNS records, allowing them to obtain unauthorized HTTPS certificates for Google and YouTube domain names. Google said its own systems were not breached, but any domain under the affected registries was at risk. Such certificates could allow an attacker to impersonate a legitimate site over an encrypted connection and read private data sent to it.\u003c/p\u003e\n\n\u003cp\u003eCertificate Transparency logs showed at least 12 domain-validated certificates for seven Google and YouTube domains, issued between September 22 and 27 by Let’s Encrypt and ZeroSSL. Google blocked the known certificates in Chrome through CRLSets and worked with the issuing certificate authorities to revoke them, although it warned that Chrome’s protections do not reliably cover people using other browsers or applications. Google advised domain owners to monitor certificate logs, use strict CAA records after restoring DNS control, and report unrequested certificates to the issuing authority.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers compromised the .gh, .sl, and .as country-code domain registries, changed authoritative DNS records, and obtained unauthorized HTTPS certificates for Google and YouTube domains.","Google stated that its own systems were not breached and used Chrome CRLSets to block the unauthorized certificates, while working with certificate authorities to revoke them for broader protection.","Certificate Transparency logs showed at least 12 unauthorized domain-validated certificates issued from September 22 through September 27 for seven Google and YouTube domains under the affected country-code domains.","Let’s Encrypt issued 11 of the 12 identified certificates and ZeroSSL issued one; all 12 were shown as revoked by Cert Spotter on October 7.","Google advised domain owners to monitor Certificate Transparency logs, publish strict CAA records, and report unrequested certificates to the issuing certificate authority."],"insights":["The certificate authorities’ normal domain-control checks were defeated by altered DNS records, and Google said it had no reason to believe the issuing authorities acted improperly.","A strict CAA record cannot prevent certificate issuance while an attacker controls DNS, because the attacker can remove or replace it, but it can prevent later certificate requests based on a validation completed during the takeover.","Certificate validation may be reused for as long as 200 days under current industry rules, creating a continuing risk after a DNS takeover ends unless domain owners restore restrictive CAA records.","Chrome’s emergency certificate blocks protected Chrome users, but Google explicitly said they do not reliably protect people using other browsers or applications.","The identified certificates remained active for roughly a day and a half to nearly a week before revocation, and certificates for .as were logged after the .gh certificates had already been revoked."],"referencedReports":[{"title":"Chrome's Response to Recent ccTLD Registry Hijacks","url":"https://blog.google/security/chromes-response-to-recent-cctld-registry-hijacks/","publisher":"google","context":"Google's security post describes Chrome's response to the ccTLD registry hijacks, including certificate blocking and revocation actions.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers compromised the .gh, .sl, and .as country-code top-level domain registries and changed authoritative DNS records, allowing them to obtain unauthorized HTTPS certificates for Google and YouTube domain names. Google said its own systems were not breached, but any domain under the affected registries was at risk. Such certificates could allow an attacker to impersonate a legitimate site over an encrypted connection and read private data sent to it.\u003c/p\u003e\n\n\u003cp\u003eCertificate Transparency logs showed at least 12 domain-validated certificates for seven Google and YouTube domains, issued between September 22 and 27 by Let’s Encrypt and ZeroSSL. Google blocked the known certificates in Chrome through CRLSets and worked with the issuing certificate authorities to revoke them, although it warned that Chrome’s protections do not reliably cover people using other browsers or applications. Google advised domain owners to monitor certificate logs, use strict CAA records after restoring DNS control, and report unrequested certificates to the issuing authority.\u003c/p\u003e\n"},{"n":1,"title":"Hackers hijack Google domains after breaching ccTLD registries","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-hijack-google-domains-after-breaching-cctld-registries/","time":"20:50","priority":"SHOULD READ","score":84,"tldr":"Attackers compromised ccTLD registry DNS records for Ghana, Sierra Leone, and American Samoa, enabling them to hijack domains and obtain valid HTTPS certificates for Google and other organizations. Google says its own systems were not breached and has blocked known malicious certificates in Chrome, though other browsers and unidentified affected domains may remain at risk.","briefOverview":"\u003cp\u003eAttackers compromised third-party operators of the .GH, .SL, and .AS country-code domains for Ghana, Sierra Leone, and American Samoa. They modified authoritative DNS records, allowing them to redirect affected domains, including several Google domains, to infrastructure they controlled. Google said the incident did not involve a compromise of its own systems. Other organizations, including leading global brands and widely used online services, may also have been affected.\u003c/p\u003e\n\n\u003cp\u003eBy controlling DNS records, the attackers could add the verification records needed to obtain unauthorized HTTPS certificates for domains they did not own. Valid certificates enabled them to impersonate legitimate brands and serve arbitrary content from hijacked domains. Google blocked identified certificates in Chrome through CRLSets, worked with certificate authorities to revoke them, and used Certificate Transparency logs to identify additional suspected certificates. Google warned that it may not have found every affected domain and that Chrome’s protections do not reliably cover users of other browsers.\u003c/p\u003e\n\n\u003cp\u003eGoogle advised domain owners to monitor Certificate Transparency logs for their complete domain portfolios, including parked domains. It also recommended restrictive CAA records to limit certificate issuance to authorized accounts and validation methods. CAA records cannot stop issuance while an attacker controls DNS, but Google said they can help prevent additional certificates based on cached validation after legitimate DNS control is restored.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers compromised third-party operators of the .GH, .SL, and .AS country-code domain registries and altered authoritative DNS records for affected domains.","By controlling those DNS records, the attackers obtained unauthorized HTTPS certificates and redirected affected domains to infrastructure they controlled.","Google said its own systems were not compromised, although Google domains and domains belonging to other organizations were affected.","Google blocked known unauthorized and related certificates in Chrome using CRLSets and worked with certificate issuers to revoke them.","Google warned that it may not have identified every affected domain and that its Chrome protections do not reliably protect users of other browsers."],"insights":["Control of a domain’s authoritative DNS records can be enough to obtain a trusted HTTPS certificate, because certificate issuers commonly verify control by checking for a requested DNS text record.","Certificate Transparency logs enabled Google to find additional potentially affected organizations after its initial response, showing that publicly recorded certificate issuance can help reveal a wider incident.","CAA records cannot prevent certificate issuance while an attacker actively controls DNS, but Google says they can limit additional certificates obtained through cached validation after legitimate DNS control is restored.","Chrome’s CRLSet blocking can rapidly protect Chrome users from identified certificates, but Google cautioned that this protection does not reliably extend to people using other browsers."],"referencedReports":[],"body":"\u003cp\u003eAttackers compromised third-party operators of the .GH, .SL, and .AS country-code domains for Ghana, Sierra Leone, and American Samoa. They modified authoritative DNS records, allowing them to redirect affected domains, including several Google domains, to infrastructure they controlled. Google said the incident did not involve a compromise of its own systems. Other organizations, including leading global brands and widely used online services, may also have been affected.\u003c/p\u003e\n\n\u003cp\u003eBy controlling DNS records, the attackers could add the verification records needed to obtain unauthorized HTTPS certificates for domains they did not own. Valid certificates enabled them to impersonate legitimate brands and serve arbitrary content from hijacked domains. Google blocked identified certificates in Chrome through CRLSets, worked with certificate authorities to revoke them, and used Certificate Transparency logs to identify additional suspected certificates. Google warned that it may not have found every affected domain and that Chrome’s protections do not reliably cover users of other browsers.\u003c/p\u003e\n\n\u003cp\u003eGoogle advised domain owners to monitor Certificate Transparency logs for their complete domain portfolios, including parked domains. It also recommended restrictive CAA records to limit certificate issuance to authorized accounts and validation methods. CAA records cannot stop issuance while an attacker controls DNS, but Google said they can help prevent additional certificates based on cached validation after legitimate DNS control is restored.\u003c/p\u003e\n"},{"n":5,"title":"US posts $10 million reward for accused Chinese ‘Hafnium’ hacker","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/accused-hafnium-hacker-zhang-yu-10million-reward","time":"19:50","priority":"SHOULD READ","score":82,"tldr":"The U.S. State Department is offering up to $10 million for information leading to the location of Zhang Yu, an alleged Chinese intelligence-linked hacker accused of helping lead the Hafnium campaign that compromised thousands of organizations and stole sensitive data.","briefOverview":"\u003cp\u003eThe U.S. State Department is offering up to $10 million for information on Zhang Yu, a Chinese national accused of being a key figure in the Hafnium hacking campaign. U.S. officials allege that Zhang, director of Shanghai Firetech Information Science and Technology, worked on behalf of the Chinese government. He is accused of helping breach thousands of computers and steal documents and emails.\u003c/p\u003e\n\n\u003cp\u003eA Justice Department indictment alleges that Zhang and Xu Zewei carried out computer intrusions from February 2020 through June 2021, including the broad Hafnium campaign. Prosecutors say the men acted at the direction of China’s Ministry of State Security and Shanghai State Security Bureau, and allegedly targeted a university, a law firm, and COVID-19 research involving U.S.-based universities, immunologists, and virologists. The FBI said Hafnium targeted more than 60,000 U.S. entities and compromised more than 12,700; Xu was arrested in Italy and extradited to the United States, while Zhang remains at large.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. State Department is offering a reward of up to $10 million for information on the whereabouts of Zhang Yu, an accused key figure in the Hafnium hacking campaign.","U.S. officials allege that Zhang Yu, director of Shanghai Firetech Information Science and Technology, worked for the Chinese government to help breach thousands of computers and steal documents and emails.","Prosecutors allege Zhang and Xu Zewei conducted computer intrusions from February 2020 through June 2021, including the Hafnium campaign that compromised thousands of computers worldwide.","Xu Zewei was arrested in Italy in July 2025 and extradited to the United States in April, while Zhang remains at large.","The FBI said the Hafnium campaign targeted more than 60,000 U.S. entities and successfully victimized more than 12,700 of them."],"insights":["The allegations describe a direct reporting chain: the accused hackers allegedly received assignments from Chinese intelligence services and reported results back to supervising officers, rather than acting as independent criminals.","The Hafnium operation was described as indiscriminate and exceptionally broad, with the FBI saying it targeted more than 60,000 U.S. entities and compromised more than 12,700.","The case demonstrates an international enforcement dimension: Xu Zewei was arrested in Italy while on vacation and later extradited to the United States, while Zhang Yu remains at large and is now the subject of a $10 million reward."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. State Department is offering up to $10 million for information on Zhang Yu, a Chinese national accused of being a key figure in the Hafnium hacking campaign. U.S. officials allege that Zhang, director of Shanghai Firetech Information Science and Technology, worked on behalf of the Chinese government. He is accused of helping breach thousands of computers and steal documents and emails.\u003c/p\u003e\n\n\u003cp\u003eA Justice Department indictment alleges that Zhang and Xu Zewei carried out computer intrusions from February 2020 through June 2021, including the broad Hafnium campaign. Prosecutors say the men acted at the direction of China’s Ministry of State Security and Shanghai State Security Bureau, and allegedly targeted a university, a law firm, and COVID-19 research involving U.S.-based universities, immunologists, and virologists. The FBI said Hafnium targeted more than 60,000 U.S. entities and compromised more than 12,700; Xu was arrested in Italy and extradited to the United States, while Zhang remains at large.\u003c/p\u003e\n"},{"n":4,"title":"$11 million plan for psychological support at Cyber Command gets fresh boost from lawmakers","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cyber-command-mental-health-support-program-bipartisan-letters","time":"18:35","priority":"MAY READ","score":62,"tldr":"Bipartisan lawmakers are urging Congress to fund Cyber Command’s $11 million request for sustained psychological and performance support after several summer suicides at Fort Meade. The program would aim to reduce burnout among personnel conducting high-tempo cyber operations.","briefOverview":"\u003cp\u003eBipartisan groups of federal lawmakers are urging congressional appropriators to support an $11 million request for psychological and performance support at U.S. Cyber Command. The request follows several suicide deaths this summer at Cyber Command and the National Security Agency, which share a campus and resources at Fort Meade, Maryland. Lawmakers said the deaths have affected families, friends, and the wider community.\u003c/p\u003e\n\n\u003cp\u003eThe proposed High Performance Team Training program was Cyber Command’s second-highest unfunded priority and would provide cognitive, psychological, physiological, and spiritual support for personnel conducting high-tempo cyber operations. Members of the House Armed Services cyber subcommittee said many personnel are effectively deployed in place for two- or three-year assignments, often without the defined recovery periods associated with conventional deployments. The House approved the request in its fiscal 2027 defense spending bill, but the Senate did not advance its version; lawmakers argue the funding would create sustained prevention and care rather than only short-term crisis responses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bipartisan groups of federal lawmakers urged congressional appropriators to fund an $11 million High Performance Team Training program for U.S. Cyber Command.","The funding push follows several suicide deaths during the summer at Cyber Command and the National Security Agency, which share a campus and resources at Fort Meade, Maryland.","Cyber Command listed the $11 million program as its second unfunded priority, saying it would provide cognitive, psychological, physical, and spiritual support for personnel conducting high-tempo cyber operations.","The House approved the request in its fiscal 2027 defense spending bill, while the Senate did not advance its draft.","Lawmakers said Cyber Command personnel can be effectively deployed in place for two- or three-year assignments without the clear endpoints, recovery periods, or unit reconstitution cycles associated with conventional deployments."],"insights":["Cyber Command personnel may face a form of prolonged “deployment in place,” spending two or three years on real-world operations without the defined end dates and recovery periods associated with conventional deployments.","The classified nature of Cyber Command’s work can itself hinder timely medical support by limiting personnel’s access to appropriate professionals.","Lawmakers are framing the requested funding as a preventive, enduring care measure rather than a short-term response after deaths occur.","The requested $11 million was Cyber Command’s second-highest unfunded priority, indicating the command had already formally identified personnel sustainment as an important unmet need."],"referencedReports":[],"body":"\u003cp\u003eBipartisan groups of federal lawmakers are urging congressional appropriators to support an $11 million request for psychological and performance support at U.S. Cyber Command. The request follows several suicide deaths this summer at Cyber Command and the National Security Agency, which share a campus and resources at Fort Meade, Maryland. Lawmakers said the deaths have affected families, friends, and the wider community.\u003c/p\u003e\n\n\u003cp\u003eThe proposed High Performance Team Training program was Cyber Command’s second-highest unfunded priority and would provide cognitive, psychological, physiological, and spiritual support for personnel conducting high-tempo cyber operations. Members of the House Armed Services cyber subcommittee said many personnel are effectively deployed in place for two- or three-year assignments, often without the defined recovery periods associated with conventional deployments. The House approved the request in its fiscal 2027 defense spending bill, but the Senate did not advance its version; lawmakers argue the funding would create sustained prevention and care rather than only short-term crisis responses.\u003c/p\u003e\n"},{"n":3,"title":"Least Privilege for AI Agents: A Practical Guide for Security Leaders","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/least-privilege-for-ai-agents","time":"18:59","priority":"MAY READ","score":55,"tldr":"AI agents should receive unique identities and only task-specific, time-limited access to the data and tools they need, rather than inheriting broad user or shared service-account permissions. Effective least privilege also requires runtime monitoring and human approval for high-impact actions such as data exports, permission changes, and deletions.","briefOverview":"\u003cp\u003eAI agents can inherit broad employee permissions, run through shared service accounts, and act independently at machine speed, making excessive access a major source of risk. The article defines least privilege for agents as assigning each agent a distinct identity and granting only the data, tools, and permissions needed for a specific task. That access should expire after the task or session ends, rather than remaining as a standing permission.\u003c/p\u003e\n\n\u003cp\u003eTraditional human-focused access controls can leave agents able to reach unrelated HR, finance, customer, or legal data through overly broad accounts. OWASP identifies excessive functionality, permissions, and autonomy as root causes of excessive agency, while prompt injection can cause an attacker to use the permissions available to a manipulated agent. The article recommends discovering all agents, mapping the data each can reach, removing stale access, enforcing controls at runtime, and requiring human approval for high-impact actions such as deletions, permission changes, and sensitive-data exports.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Least privilege for AI agents means giving each agent its own identity and only the data, tools, and permissions needed for a specific task, with access expiring when the task ends.","Traditional access controls can fail for AI agents because agents may inherit broad user permissions, use shared service accounts, and act independently at machine speed.","OWASP identifies excessive functionality, excessive permissions, and excessive autonomy as root causes of excessive agency in AI systems.","Organizations should enforce access controls at runtime, compare an agent's requested task with the data and actions it attempts to use, and require human approval for high-impact actions.","The article recommends discovering all approved and unsanctioned agents, mapping the data each can access, removing stale permissions, and testing whether an agent's access can be quickly revoked."],"insights":["An agent’s risk should be measured not only by the actions it can take, but also by the sensitive data it can reach through its identity and connected tools.","Prompt injection can turn an agent’s existing permissions into an attacker’s access, as the article notes in its discussion of Copilot Enterprise operating with a user’s full graph permissions.","A shared administrative service account can unintentionally give a narrowly designed help desk agent access to unrelated HR and finance systems.","The article reports that 1 in 10 user or service accounts in Varonis’ 2025 report could freely export all data, creating a large potential blast radius if an agent uses one of those accounts.","Logging alone is not governance because logs do not stop an agent, and monitoring without sufficient context cannot determine whether its action is appropriate."],"referencedReports":[{"title":"The Rising Risk of AI Agents: Expanding the Attack Surface","url":"https://docs.sailpoint.com/pdf/en/special-report/SailPoint-The-Rising-Risk-of-AI-Agents-Expanding-the-Attack-Surface-report-SP2648%20.pdf","publisher":"sailpoint","context":"The article cites SailPoint's survey of 353 professionals, including the finding that only 44% of organizations had policies to secure AI agents and that 80% reported unintended agent actions.","category":"research","primary":false},{"title":"Deploying AI Systems Securely","url":"https://www.ic3.gov/CSA/2024/240415.pdf","publisher":"fbi-and-national-security-agency","context":"The article cites this multi-country agency guidance for its recommendation to enforce strict access controls, API security, least privilege, and defense-in-depth for AI systems.","category":"advisory","primary":false},{"title":"AI Agent Security Cheat Sheet","url":"https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html","publisher":"owasp","context":"The article references the cheat sheet's recommendations for per-tool access scoping and explicit approval of high-impact or irreversible actions.","category":"guide","primary":false}],"body":"\u003cp\u003eAI agents can inherit broad employee permissions, run through shared service accounts, and act independently at machine speed, making excessive access a major source of risk. The article defines least privilege for agents as assigning each agent a distinct identity and granting only the data, tools, and permissions needed for a specific task. That access should expire after the task or session ends, rather than remaining as a standing permission.\u003c/p\u003e\n\n\u003cp\u003eTraditional human-focused access controls can leave agents able to reach unrelated HR, finance, customer, or legal data through overly broad accounts. OWASP identifies excessive functionality, permissions, and autonomy as root causes of excessive agency, while prompt injection can cause an attacker to use the permissions available to a manipulated agent. The article recommends discovering all agents, mapping the data each can reach, removing stale access, enforcing controls at runtime, and requiring human approval for high-impact actions such as deletions, permission changes, and sensitive-data exports.\u003c/p\u003e\n"},{"n":8,"title":"Microsoft, Adobe, Apple, and Foxit vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/microsoft-adobe-apple-and-foxit-vulnerabilities/","time":"19:27","priority":"MAY READ","score":40,"tldr":"Cisco Talos disclosed patched vulnerabilities affecting Adobe Photoshop, macOS CoreWLAN, Foxit Reader, and Microsoft Windows that could enable privilege escalation, information disclosure, denial of service, or arbitrary code execution.","briefOverview":"\u003cp\u003eCisco Talos’ Vulnerability Discovery \u0026amp; Research team disclosed vulnerabilities in Adobe Photoshop, Apple macOS, Foxit Reader, and Microsoft Windows. Talos states that the vendors have patched the issues under Cisco’s third-party vulnerability disclosure policy. Snort rules for detecting exploitation attempts are available through the latest Snort rule sets.\u003c/p\u003e\n\n\u003cp\u003eThe Adobe Photoshop issue can enable privilege escalation through replacement of files with a malformed file, while the macOS CoreWLAN issue can disclose information through a sequence of API calls. Foxit Reader flaws involving JavaScript checkbox handling and an Array-object use-after-free can lead to remote or arbitrary code execution through malicious files or JavaScript in PDFs. Windows issues in NETIO.sys, the Cloud Files Mini Filter Driver, and tcpip.sys can cause sensitive-information disclosure, privilege escalation, type confusion, arbitrary out-of-bounds reads, or denial of service through crafted I/O requests or Cloud Filter API calls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos disclosed patched vulnerabilities affecting Adobe Photoshop, Apple macOS, Foxit Reader, and Microsoft Windows.","The Adobe Photoshop installation flaw, CVE-2026-48388, can allow privilege escalation when an attacker replaces files with a specially crafted malformed file.","Two Foxit Reader flaws, CVE-2026-57256 and CVE-2026-91799, can allow arbitrary code execution through a malformed file or malicious JavaScript in a PDF.","Microsoft Windows flaws in NETIO.sys, the Cloud Files Mini Filter Driver, and tcpip.sys can disclose sensitive information, cause privilege escalation or type confusion, and potentially cause denial of service.","Apple macOS CoreWLAN version 26.3.1 includes an information-disclosure flaw that can be triggered through a sequence of API calls."],"insights":["All of the disclosed issues have already been patched by their respective vendors, making software updates the immediate actionable response.","The disclosed flaws span several attack paths, including malicious files, JavaScript embedded in PDFs, crafted Windows I/O requests, and sequences of application programming interface calls.","Two Windows Cloud Files Mini Filter Driver issues specifically require a dedicated application to make specially crafted Cloud Filter API calls, rather than simply opening a document.","Cisco Talos states that Snort rules are available to help detect attempts to exploit these vulnerabilities."],"referencedReports":[{"title":"TALOS-2026-2360","url":"https://www.talosintelligence.com/vulnerability_reports/TALOS-2026-2360","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the Adobe Photoshop privilege-escalation issue CVE-2026-48388.","category":"advisory","primary":true},{"title":"TALOS-2026-2376","url":"https://talosintelligence.com/vulnerability_reports/TALOS-2026-2376","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the macOS CoreWLAN information-disclosure issue.","category":"advisory","primary":true},{"title":"TALOS-2026-2420","url":"https://talosintelligence.com/vulnerability_reports/TALOS-2026-2420","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the Foxit Reader code-execution issue CVE-2026-57256.","category":"advisory","primary":true},{"title":"TALOS-2026-2446","url":"https://talosintelligence.com/vulnerability_reports/TALOS-2026-2446","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the Foxit Reader use-after-free issue CVE-2026-91799.","category":"advisory","primary":true},{"title":"TALOS-2026-2443","url":"https://talosintelligence.com/vulnerability_reports/TALOS-2026-2443","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the Microsoft Windows NETIO.sys information-disclosure issue CVE-2026-50475.","category":"advisory","primary":true},{"title":"TALOS-2026-2426","url":"https://talosintelligence.com/vulnerability_reports/TALOS-2026-2426","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the Windows Cloud Files Mini Filter Driver privilege-escalation issue CVE-2026-58613.","category":"advisory","primary":true},{"title":"TALOS-2026-2445","url":"https://talosintelligence.com/vulnerability_reports/TALOS-2026-2445","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the Windows Cloud Files Mini Filter Driver type-confusion issue CVE-2026-80093.","category":"advisory","primary":true},{"title":"TALOS-2026-2427","url":"https://talosintelligence.com/vulnerability_reports/TALOS-2026-2427","publisher":"cisco-talos","context":"The article links to this Cisco Talos vulnerability report for the Microsoft Windows tcpip.sys out-of-bounds-read issue CVE-2026-49177.","category":"advisory","primary":true}],"body":"\u003cp\u003eCisco Talos’ Vulnerability Discovery \u0026amp; Research team disclosed vulnerabilities in Adobe Photoshop, Apple macOS, Foxit Reader, and Microsoft Windows. Talos states that the vendors have patched the issues under Cisco’s third-party vulnerability disclosure policy. Snort rules for detecting exploitation attempts are available through the latest Snort rule sets.\u003c/p\u003e\n\n\u003cp\u003eThe Adobe Photoshop issue can enable privilege escalation through replacement of files with a malformed file, while the macOS CoreWLAN issue can disclose information through a sequence of API calls. Foxit Reader flaws involving JavaScript checkbox handling and an Array-object use-after-free can lead to remote or arbitrary code execution through malicious files or JavaScript in PDFs. Windows issues in NETIO.sys, the Cloud Files Mini Filter Driver, and tcpip.sys can cause sensitive-information disclosure, privilege escalation, type confusion, arbitrary out-of-bounds reads, or denial of service through crafted I/O requests or Cloud Filter API calls.\u003c/p\u003e\n"}]</script>
