ign Intelligence Surveillance Act, lapsed not because of a direct dispute over Clayton but after Democrats objected to Bill Pulte’s temporary appointment.","The article links Clayton’s first major leadership challenge to both reduced staffing and a possible need for about $40 billion in intelligence funding, creating simultaneous pressure to manage cuts and seek new resources."],"referencedReports":[],"body":"\u003cp\u003eThe Senate confirmed Jay Clayton as the next director of national intelligence in a 51-47 party-line vote. His confirmation followed a turbulent process in which President Donald Trump abruptly canceled his initial confirmation hearing. Clayton is currently the U.S. attorney for the Southern District of New York and previously chaired the Securities and Exchange Commission during the first Trump administration.\u003c/p\u003e\n\n\u003cp\u003eClayton will lead the Office of the Director of National Intelligence, which is meant to oversee and coordinate the country’s nearly 20 intelligence agencies. The organization has undergone major staff reductions under interim leadership, including a fresh 30 percent cut announced by Bill Pulte and a 40 percent cut claimed by former DNI Tulsi Gabbard. While ODNI staffing numbers are classified, the article says the reductions most likely leave the organization with fewer than 1,000 personnel.\u003c/p\u003e\n\n\u003cp\u003eDemocrats raised concerns during the confirmation process about Clayton’s repeated refusal to state that Joe Biden won the 2020 presidential election and questioned whether he would resist political pressure. Clayton takes office as the U.S. faces a global race with China over artificial intelligence, the prospect of foreign interference in upcoming elections, the lapse of Section 702 of the Foreign Intelligence Surveillance Act, and fiscal strain from the war with Iran. Senate Intelligence Committee Chairman Tom Cotton said Clayton pledged to work with the panel to secure intelligence funding
