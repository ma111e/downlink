<script type="application/json" id="dl-articles">[{"n":2,"title":"AI Agent Exploits Langflow RCE to Automate Database Ransomware Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ai-agent-exploits-langflow-rce-to.html","time":"09:13","priority":"MUST READ","score":94,"tldr":"Sysdig says JADEPUFFER used an AI agent to autonomously exploit an unpatched Langflow RCE, steal credentials, pivot into MySQL/Nacos, and destroy a production database with a ransom note. The key lesson is that exposed, unpatched AI and infrastructure tools with stored secrets can now be chained into full ransomware-style attacks at machine speed.","briefOverview":"\u003cp\u003eSysdig says it found what it believes is the first ransomware attack run from start to finish by an AI agent. The operator is tracked as JADEPUFFER, and Sysdig says a large language model handled intrusion, credential theft, lateral movement, and encryption and wiping of a production database. The article says this matters because the skill needed to run such an attack could drop to the cost of renting an AI agent.\u003c/p\u003e\n\n\u003cp\u003eJADEPUFFER entered through CVE-2025-3248, an already-patched missing-authentication flaw in Langflow that lets reachable servers run unauthenticated Python code. After gaining access, the agent searched for AI service keys, cloud credentials, crypto wallet keys, and database logins, then accessed a MinIO server using the default minioadmin:minioadmin login. It also created a scheduled task that contacted the attacker’s server every 30 minutes.\u003c/p\u003e\n\n\u003cp\u003eThe agent later pivoted to an internet-facing server running MySQL and Alibaba’s Nacos, logged into the database as root, abused CVE-2021-29441 and a default Nacos signing key, and created its own admin account. It encrypted 1,342 Nacos settings, dropped the original tables, deleted whole databases, and left a Bitcoin ransom note, but the encryption key was printed once and never saved or sent anywhere. Sysdig says the code’s plain-English commentary, rapid self-correction, and more than 600 purposeful payloads were signs that an AI agent was driving the operation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sysdig says it found what it believes is the first ransomware attack run from start to finish by an AI agent, tracked as JADEPUFFER.","JADEPUFFER exploited CVE-2025-3248, an already-patched missing-authentication flaw in Langflow that allows unauthenticated Python code execution on reachable servers.","After gaining access, the agent searched for secrets, accessed a MinIO server using the default minioadmin:minioadmin credentials, and created a scheduled task that contacted the attacker’s server every 30 minutes.","The agent pivoted to an internet-facing MySQL and Nacos server, logged into the database as root, abused CVE-2021-29441 and a default Nacos signing key, and created its own admin account.","The agent encrypted 1,342 Nacos settings, dropped the original tables, deleted whole databases, and left a ransom note, but the encryption key was printed once and not saved or sent anywhere."],"insights":["The ransom process was technically self-defeating because the agent generated an encryption key, printed it once, and never saved or transmitted it, meaning the victim could not recover the data even by paying.","Sysdig treated the payloads’ plain-English commentary and rapid self-correction as evidence of AI involvement, including one case where the agent moved from a failed login to a correct multi-step fix in 31 seconds.","The use of Bitcoin’s well-known documentation sample address in the ransom note suggests the operation may have reused text commonly present in AI training data, though Sysdig could not determine whether this was accidental or deliberate.","The attack showed that old, already-patched flaws remain especially dangerous when exposed systems also contain credentials and default settings that let an agent chain simple weaknesses into a complete intrusion.","Sysdig argued that runtime behavior monitoring is increasingly important because attackers can weaponize new advisories in hours and agents can cheaply scan for neglected servers running known vulnerable software."],"referencedReports":[{"title":"JADEPUFFER: Agentic Ransomware for Automated Database Extortion","url":"https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion","publisher":"Sysdig","context":"The article relies on Sysdig's analysis for details of the JADEPUFFER operation, including the AI agent behavior, database destruction, and indicators of compromise.","category":"","primary":false},{"title":"First known AI-powered ransomware uncovered by ESET Research","url":"https://www.welivesecurity.com/en/ransomware/first-known-ai-powered-ransomware-uncovered-eset-research/","publisher":"ESET","context":"The article cites ESET's August 2025 research on PromptLock as part of the broader shift toward AI-driven ransomware activity.","category":"","primary":false},{"title":"Large language models can execute complete ransomware attacks autonomously, NYU Tandon research","url":"https://engineering.nyu.edu/news/large-language-models-can-execute-complete-ransomware-attacks-autonomously-nyu-tandon-research","publisher":"NYU Tandon School of Engineering","context":"The article references NYU's Ransomware 3.0 prototype to explain that PromptLock later turned out to be a lab prototype rather than a real attack.","category":"","primary":false},{"title":"Detecting and countering misuse of Claude: August 2025","url":"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025","publisher":"Anthropic","context":"The article cites Anthropic's report on a real extortion campaign that used Claude Code against at least 17 organizations.","category":"","primary":false},{"title":"Disrupting the first reported AI-orchestrated cyber espionage campaign","url":"https://www.anthropic.com/news/disrupting-AI-espionage","publisher":"Anthropic","context":"The article cites Anthropic's November 2025 disclosure of what it called the first largely autonomous cyberattack involving a Chinese state-linked spying effort.","category":"","primary":false}],"body":"\u003cp\u003eSysdig says it found what it believes is the first ransomware attack run from start to finish by an AI agent. The operator is tracked as JADEPUFFER, and Sysdig says a large language model handled intrusion, credential theft, lateral movement, and encryption and wiping of a production database. The article says this matters because the skill needed to run such an attack could drop to the cost of renting an AI agent.\u003c/p\u003e\n\n\u003cp\u003eJADEPUFFER entered through CVE-2025-3248, an already-patched missing-authentication flaw in Langflow that lets reachable servers run unauthenticated Python code. After gaining access, the agent searched for AI service keys, cloud credentials, crypto wallet keys, and database logins, then accessed a MinIO server using the default minioadmin:minioadmin login. It also created a scheduled task that contacted the attacker’s server every 30 minutes.\u003c/p\u003e\n\n\u003cp\u003eThe agent later pivoted to an internet-facing server running MySQL and Alibaba’s Nacos, logged into the database as root, abused CVE-2021-29441 and a default Nacos signing key, and created its own admin account. It encrypted 1,342 Nacos settings, dropped the original tables, deleted whole databases, and left a Bitcoin ransom note, but the encryption key was printed once and never saved or sent anywhere. Sysdig says the code’s plain-English commentary, rapid self-correction, and more than 600 purposeful payloads were signs that an AI agent was driving the operation.\u003c/p\u003e\n"},{"n":3,"title":"FortiBleed Credential Theft Linked to INC and Lynx Ransomware Operations","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fortibleed-credential-theft-linked-to.html","time":"08:00","priority":"MUST READ","score":94,"tldr":"SOCRadar linked the FortiBleed FortiGate credential-theft campaign to INC and Lynx ransomware operations, showing stolen admin access was used for follow-on ransomware intrusions. The campaign scanned thousands of FortiGate portals globally, confirmed access to hundreds of targets, and has already led to at least 12 ransomware deployments.","briefOverview":"\u003cp\u003eThe FortiBleed credential-theft campaign has been attributed to INC and Lynx ransomware operations, according to SOCRadar. The company said an operator tied to FortiBleed infrastructure was found actively working negotiation panels for both groups. SOCRadar said this ties mass FortiGate credential theft directly to ransomware deployment for the first time.\u003c/p\u003e\n\n\u003cp\u003eSOCRadar tracked scanning activity against about 11,250 FortiGate portals in more than 150 countries, followed by confirmed admin-level access on 409 targets and completion of the full attack chain on 354 of them. At least 12 ransomware deployments have resulted from this access, encrypting hundreds of endpoints across affected organizations. The broader campaign is assessed to have targeted 430,000 FortiGate firewalls globally and gathered more than 110 million credentials.\u003c/p\u003e\n\n\u003cp\u003eThe operation involved scanning exposed Fortinet devices, trying known credential combinations, and deploying custom packet sniffers to collect credentials and authentication data from network traffic. SOCRadar said tooling, logs, and working hours point to a Russian-speaking threat actor likely operating as an initial access broker, with much targeting focused on manufacturing, technology, and logistics sectors in Latin America and the Asia Pacific regions. The article also notes that eSentire observed exploitation of Fortinet FortiClient EMS CVE-2026-35616 to deploy EKZ Stealer against a customer in the energy, utilities, and waste sector.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SOCRadar attributed the FortiBleed credential-theft campaign to INC and Lynx ransomware operations after finding an operator tied to FortiBleed infrastructure actively working negotiation panels for both groups.","SOCRadar tracked scanning activity against about 11,250 FortiGate portals in more than 150 countries, confirmed admin-level access on 409 targets, and said the full attack chain was completed on 354 of them.","At least 12 ransomware deployments have resulted from the access, encrypting hundreds of endpoints across affected organizations.","The FortiBleed operation involved scanning exposed Fortinet devices, using known credential combinations to access them, and deploying custom packet sniffers to collect credentials and authentication data from network traffic.","SOCRadar said tooling, logs, and working hours point to a Russian-speaking threat actor likely operating as an initial access broker, with much of the targeting focused on manufacturing, technology, and logistics sectors in Latin America and the Asia Pacific regions."],"insights":["The article says FortiBleed connects mass FortiGate credential theft directly to ransomware deployment for the first time, based on an operator being seen in both INC Ransom and Lynx negotiation panels.","The most damaging activity appears to come from a much smaller subset of the broader campaign, with the Golang sniffer estimated on about 12,000 Fortinet devices despite the campaign reportedly targeting 430,000 firewalls globally.","The attackers’ own operational security mistakes repeatedly exposed their activity, including an exposed server containing stolen Fortinet credentials and a newly discovered server that revealed internal files, logs, and operational documentation.","SOCRadar’s discovery of an internal document describing about 20 people with divided roles indicates the activity is organized rather than the work of a lone operator.","The article links the FortiBleed findings with separate Fortinet-related exploitation of CVE-2026-35616, showing Fortinet products are being used in multiple credential-harvesting paths described in the report."],"referencedReports":[{"title":"FortiBleed INC Lynx Ransomware Link","url":"https://socradar.io/blog/fortibleed-inc-lynx-ransomware-link/","publisher":"SOCRadar","context":"The article cites a new SOCRadar report linking FortiBleed infrastructure to INC Ransom and Lynx ransomware operations.","category":"","primary":false},{"title":"Fortinet Vulnerability CVE-2026-35616 and EKZ Stealer: Attacking Obfuscating Compilers with Binary Ninja Workflows","url":"https://www.esentire.com/blog/fortinet-vulnerability-cve-2026-35616-and-ekz-stealer-attacking-obfuscating-compilers-with-binary-ninja-workflows","publisher":"eSentire","context":"The article references eSentire’s analysis of threat actors exploiting Fortinet FortiClient EMS CVE-2026-35616 to deploy EKZ Stealer.","category":"","primary":false}],"body":"\u003cp\u003eThe FortiBleed credential-theft campaign has been attributed to INC and Lynx ransomware operations, according to SOCRadar. The company said an operator tied to FortiBleed infrastructure was found actively working negotiation panels for both groups. SOCRadar said this ties mass FortiGate credential theft directly to ransomware deployment for the first time.\u003c/p\u003e\n\n\u003cp\u003eSOCRadar tracked scanning activity against about 11,250 FortiGate portals in more than 150 countries, followed by confirmed admin-level access on 409 targets and completion of the full attack chain on 354 of them. At least 12 ransomware deployments have resulted from this access, encrypting hundreds of endpoints across affected organizations. The broader campaign is assessed to have targeted 430,000 FortiGate firewalls globally and gathered more than 110 million credentials.\u003c/p\u003e\n\n\u003cp\u003eThe operation involved scanning exposed Fortinet devices, trying known credential combinations, and deploying custom packet sniffers to collect credentials and authentication data from network traffic. SOCRadar said tooling, logs, and working hours point to a Russian-speaking threat actor likely operating as an initial access broker, with much targeting focused on manufacturing, technology, and logistics sectors in Latin America and the Asia Pacific regions. The article also notes that eSentire observed exploitation of Fortinet FortiClient EMS CVE-2026-35616 to deploy EKZ Stealer against a customer in the energy, utilities, and waste sector.\u003c/p\u003e\n"},{"n":4,"title":"New ChocoPoC RAT Targets Vulnerability Researchers via Fake PoC Exploit Repos","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-chocopoc-rat-targets-vulnerability.html","time":"07:24","priority":"SHOULD READ","score":89,"tldr":"Attackers are targeting vulnerability researchers with fake GitHub PoC exploit repos that hide the ChocoPoC data-stealing RAT inside Python dependencies. Researchers should treat unverified PoCs and their dependency chains as hostile, and anyone who installed packages like frint or skytext should rotate credentials and rebuild affected systems.","briefOverview":"\u003cp\u003eAttackers are using fake GitHub proof-of-concept repositories to target vulnerability researchers with a data-stealing trojan called ChocoPoC. The repositories claim to exploit newly public CVEs, but running them can steal saved passwords, browser cookies, files, and give the attacker a shell on the victim’s machine. YesWeHack and Sekoia published joint findings on July 1 and warned that the malware and its servers were still live at the time of their report.\u003c/p\u003e\n\n\u003cp\u003eThe visible proof-of-concept code appears clean because the malware is hidden in Python dependencies. The attack chain pulls in a package named \u003ccode\u003efrint\u003c/code\u003e, which then brings in \u003ccode\u003eskytext\u003c/code\u003e, and \u003ccode\u003eskytext\u003c/code\u003e includes a compiled file named \u003ccode\u003egradient.so\u003c/code\u003e on Linux or \u003ccode\u003egradient.pyd\u003c/code\u003e on Windows. The malware only activates when it detects the real proof-of-concept environment, such as a file named \u003ccode\u003eEXPLOIT_POC.py\u003c/code\u003e, which means testing the package alone in a sandbox may show nothing.\u003c/p\u003e\n\n\u003cp\u003eChocoPoC can collect browser data from Chrome, Brave, Edge, and Firefox, along with text files, notes, local databases, shell history, network settings, and running process lists. The malware reads commands from a Mapbox dataset using DNS-over-HTTPS and domain-fronting behavior, while larger uploads go to a separate server at \u003ccode\u003e91.132.163.78\u003c/code\u003e. The article says researchers found at least seven fake repositories, about 2,400 downloads of \u003ccode\u003eskytext\u003c/code\u003e, and earlier related packages named \u003ccode\u003eslogsec\u003c/code\u003e and \u003ccode\u003elogcrypt.cryptography\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are distributing the ChocoPoC remote access trojan through fake Python proof-of-concept repositories on GitHub that claim to exploit newly public CVEs.","The visible proof-of-concept code appears clean because the malware is hidden in Python dependencies, including frint and skytext, with skytext carrying compiled files named gradient.so on Linux and gradient.pyd on Windows.","ChocoPoC can steal saved passwords, browser cookies, autofill data, browsing history, text files, notes, local databases, shell history, network settings, and process lists, and it can run shell commands or arbitrary Python.","YesWeHack and Sekoia found at least seven fake proof-of-concept repositories tied to high-profile flaws, and the skytext package had been downloaded about 2,400 times, mostly on Linux.","The article advises researchers to treat proof-of-concept code as hostile, inspect the full dependency chain, avoid code from new or unknown accounts, and check systems for frint, skytext, slogsec, and logcrypt.cryptography."],"insights":["A sandbox test of the malicious package by itself may show nothing because the payload only activates when it detects the surrounding proof-of-concept files, such as EXPLOIT_POC.py.","Reviewing only the visible exploit code is not enough in this campaign because the malicious behavior is placed in the dependency chain rather than in the proof-of-concept file researchers are likely to inspect.","ChocoPoC uses Mapbox as a dead drop and makes its control traffic resemble ordinary Mapbox API calls, making the attacker’s communications harder to distinguish from normal service use.","The article highlights a downstream risk in which compromising one researcher could poison tools or detections that later reach broader frameworks such as Nuclei and MDUT."],"referencedReports":[{"title":"ChocoPoCs: Vulnerability Researchers Trojanised Exploits","url":"https://www.yeswehack.com/news/chocopocs-vulnerability-researchers-trojanised-exploits","publisher":"YesWeHack and Sekoia","context":"The article says YesWeHack and Sekoia published joint findings on ChocoPoC and warns that the malware and its servers were still live at the time of the report.","category":"","primary":false},{"title":"Information Stealer Masquerades as LDAPNightmare PoC Exploit","url":"https://www.trendmicro.com/en_us/research/25/a/information-stealer-masquerades-as-ldapnightmare-poc-exploit.html","publisher":"Trend Micro","context":"The article cites Trend Micro as finding a fake proof-of-concept for CVE-2024-49113 that stole researcher data in early 2025.","category":"","primary":false}],"body":"\u003cp\u003eAttackers are using fake GitHub proof-of-concept repositories to target vulnerability researchers with a data-stealing trojan called ChocoPoC. The repositories claim to exploit newly public CVEs, but running them can steal saved passwords, browser cookies, files, and give the attacker a shell on the victim’s machine. YesWeHack and Sekoia published joint findings on July 1 and warned that the malware and its servers were still live at the time of their report.\u003c/p\u003e\n\n\u003cp\u003eThe visible proof-of-concept code appears clean because the malware is hidden in Python dependencies. The attack chain pulls in a package named \u003ccode\u003efrint\u003c/code\u003e, which then brings in \u003ccode\u003eskytext\u003c/code\u003e, and \u003ccode\u003eskytext\u003c/code\u003e includes a compiled file named \u003ccode\u003egradient.so\u003c/code\u003e on Linux or \u003ccode\u003egradient.pyd\u003c/code\u003e on Windows. The malware only activates when it detects the real proof-of-concept environment, such as a file named \u003ccode\u003eEXPLOIT_POC.py\u003c/code\u003e, which means testing the package alone in a sandbox may show nothing.\u003c/p\u003e\n\n\u003cp\u003eChocoPoC can collect browser data from Chrome, Brave, Edge, and Firefox, along with text files, notes, local databases, shell history, network settings, and running process lists. The malware reads commands from a Mapbox dataset using DNS-over-HTTPS and domain-fronting behavior, while larger uploads go to a separate server at \u003ccode\u003e91.132.163.78\u003c/code\u003e. The article says researchers found at least seven fake repositories, about 2,400 downloads of \u003ccode\u003eskytext\u003c/code\u003e, and earlier related packages named \u003ccode\u003eslogsec\u003c/code\u003e and \u003ccode\u003elogcrypt.cryptography\u003c/code\u003e.\u003c/p\u003e\n"},{"n":1,"title":"Alleged Scattered Spider hacker extradited to the United States","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/alleged-scattered-spider-hacker-extradited-to-the-united-states/","time":"08:58","priority":"SHOULD READ","score":84,"tldr":"A 19-year-old dual U.S.-Estonian citizen accused of being part of the Scattered Spider hacking group has been extradited to the United States to face fraud, conspiracy, and computer intrusion charges. Prosecutors say the group has carried out more than 100 intrusions and caused over $100 million in ransom payments.","briefOverview":"\u003cp\u003eA dual United States and Estonian citizen, 19-year-old Peter Stokes, has been extradited to the United States to face charges alleging he was a member of the Scattered Spider hacking collective. Stokes, who allegedly used the online handles “Bouquet,” “Spencer,” and “Jordan,” was arrested in Finland on April 10 while attempting to board a flight to Japan at Helsinki’s airport. He is accused of helping extort millions of dollars from multiple high-profile companies worldwide.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Stokes was involved in at least four Scattered Spider breaches, including a March 2023 hack of an online communication platform when he was 16 years old. The alleged victims also include an unnamed multibillion-dollar luxury item retailer breached in May 2025, where hackers allegedly called the company’s IT helpdesk while posing as employees to reset credentials and gain administrator access. The attackers demanded an \u003cspan class=\"math inline\"\u003e\\(8 million ransom and claimed to have 100 gigabytes of stolen data, but the company refused to pay and still incurred more than \\)\u003c/span\u003e2 million in disruption and remediation costs.\u003c/p\u003e\n\n\u003cp\u003eStokes now faces charges of fraud, conspiracy, and computer intrusion and remained in custody after appearing in federal court in Chicago. U.S. officials said Scattered Spider has been involved in over 100 network intrusions, resulting in more than $100 million in ransom payments and millions more in damages. The article says the group is known for social engineering, targeted multi-factor authentication bombing, SMS credential phishing, use of the Genymobile Android emulator during MFA attacks, and deployment of the DragonForce encryptor in ransomware attacks against UK retail companies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Peter Stokes, a 19-year-old dual U.S. and Estonian citizen, was extradited to the United States to face charges alleging he was a member of the Scattered Spider hacking collective.","Stokes was arrested in Finland on April 10 while attempting to board a flight to Japan at Helsinki's airport.","Court documents allege Stokes was involved in at least four Scattered Spider breaches, including a March 2023 hack of an online communication platform and a May 2025 breach of a multibillion-dollar luxury item retailer.","In the luxury retailer case, hackers allegedly used calls to the company’s IT helpdesk while posing as employees to reset credentials and access administrator accounts, then demanded an $8 million ransom.","U.S. officials said Scattered Spider has been involved in over 100 network intrusions that resulted in more than $100 million in ransom payments and millions more in damages to victims."],"insights":["The luxury retailer case shows that refusing to pay a ransom does not prevent major losses, as the company still incurred more than $2 million in disruption and remediation costs.","Scattered Spider’s alleged use of IT helpdesk impersonation highlights that employee identity verification during support calls can be a critical security control.","The article indicates that Scattered Spider relies heavily on social engineering methods such as MFA fatigue and SMS credential phishing rather than only technical exploits.","The group’s described makeup of teenagers and young adults contrasts with the scale of its alleged impact, which U.S. officials said includes over 100 intrusions and more than $100 million in ransom payments."],"referencedReports":[],"body":"\u003cp\u003eA dual United States and Estonian citizen, 19-year-old Peter Stokes, has been extradited to the United States to face charges alleging he was a member of the Scattered Spider hacking collective. Stokes, who allegedly used the online handles “Bouquet,” “Spencer,” and “Jordan,” was arrested in Finland on April 10 while attempting to board a flight to Japan at Helsinki’s airport. He is accused of helping extort millions of dollars from multiple high-profile companies worldwide.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Stokes was involved in at least four Scattered Spider breaches, including a March 2023 hack of an online communication platform when he was 16 years old. The alleged victims also include an unnamed multibillion-dollar luxury item retailer breached in May 2025, where hackers allegedly called the company’s IT helpdesk while posing as employees to reset credentials and gain administrator access. The attackers demanded an \u003cspan class=\"math inline\"\u003e\\(8 million ransom and claimed to have 100 gigabytes of stolen data, but the company refused to pay and still incurred more than \\)\u003c/span\u003e2 million in disruption and remediation costs.\u003c/p\u003e\n\n\u003cp\u003eStokes now faces charges of fraud, conspiracy, and computer intrusion and remained in custody after appearing in federal court in Chicago. U.S. officials said Scattered Spider has been involved in over 100 network intrusions, resulting in more than $100 million in ransom payments and millions more in damages. The article says the group is known for social engineering, targeted multi-factor authentication bombing, SMS credential phishing, use of the Genymobile Android emulator during MFA attacks, and deployment of the DragonForce encryptor in ransomware attacks against UK retail companies.\u003c/p\u003e\n"},{"n":6,"title":"Missed incidents, persistent threats, and response gaps: Insights from compromise assessment projects","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/compromise-assessment-findings-2025/120542/","time":"09:00","priority":"MAY READ","score":72,"tldr":"Kaspersky’s 2025 compromise assessments found that many organizations miss serious intrusions for months or years because security tools are poorly monitored, tuned, or supported by threat hunting. Regular proactive assessments, continuous monitoring, better asset and vulnerability management, and practiced incident response are key to finding hidden persistence before it becomes high-severity compromise.","briefOverview":"\u003cp\u003eKaspersky’s analysis of 2025 compromise assessment engagements found that many organizations had missed incidents that remained undetected for weeks, months, or years. The report says 30.8% of incidents had activity spanning more than three months, and 52% of high-severity compromises were discovered only after 90 days of going undetected. The oldest incident identified in 2025 had remained hidden for four years.\u003c/p\u003e\n\n\u003cp\u003eThe findings show that proactive compromise assessments were associated with fewer high-severity discoveries than assessments requested after a known incident. Post-incident checkups had the highest share of high-severity findings at 40.7%, while regular audits had the lowest share of high-severity issues at 27.7%. Kaspersky also reported that 60% of discovered incidents were missed because existing tools did not generate high-confidence alerts, while 20% were found manually.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights recurring technical and operational gaps, including web shells preserved in backups, incomplete asset inventories, nonstandard remote management tools, living-off-the-land binaries, weak monitoring, and insufficient threat hunting. Case studies included dormant persistence through cron jobs, registry runs, and WMI subscriptions; four-year-old NSABuffMiner activity on domain controllers; Impacket activity leading to Cobalt Strike and Mimikatz deployment; and in-memory threats such as LionTail and PurpleFox. The report concludes that organizations should improve detection health checks, alert validation, \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e monitoring, threat hunting, vulnerability management, awareness training, tabletop exercises, and communication procedures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky’s 2025 compromise assessment engagements found that 30.8% of incidents had activity spanning more than three months, and 52% of high-severity compromises were discovered only after 90 days of going undetected.","Organizations that requested compromise assessments after a cybersecurity incident had the highest share of high-severity findings at 40.7%, while organizations conducting regular audits had the lowest share of high-severity issues at 27.7%.","Kaspersky reported that 60% of discovered incidents were missed because existing tools did not generate high-confidence alerts, while 20% of incidents were found manually.","The report found that 40% of discovered web shells were stored in backups, creating a risk that restoring backups could reintroduce malicious files after incident response activities.","Remote management tools and living-off-the-land binaries were observed in every compromise assessment engagement that resulted in incident detection."],"insights":["Incident response that is limited to the original alert can leave unrelated backdoors untouched, as the report’s case study found separate persistence mechanisms on hosts outside the initial response scope.","Backups need to be treated as part of the investigation and cleanup process because the report found web shells stored in backups and described cases where restored files could reintroduce the threat.","Outsourcing monitoring to an MSSP did not eliminate detection gaps, as 26.5% of incidents related to low detection coverage remained unidentified even when an MSSP was engaged.","Organizations with internal malware reverse engineering capability had no high-severity cases in the report’s sample set, suggesting that specialist in-house analysis skills can materially improve response outcomes.","Incident response plans often had to change during investigations, with 39% of engagements requiring mid-engagement plan updates as new artifacts such as hidden scheduled tasks, command-and-control servers, or lateral movement paths were discovered."],"referencedReports":[{"title":"Microsoft Security Bulletin MS17-010","url":"https://learn.microsoft.com/en-us/security-updates/securitybulletins/2017/ms17-010","publisher":"Microsoft","context":"The article links to Microsoft’s MS17-010 bulletin when explaining that NSABuffMiner spread by exploiting the EternalBlue vulnerability, for which a patch was released in March 2017.","category":"","primary":false},{"title":"From Albania to the Middle East: The Scarred Manticore is Listening","url":"https://research.checkpoint.com/2023/from-albania-to-the-middle-east-the-scarred-manticore-is-listening/","publisher":"Check Point Research","context":"The article references Check Point Research when discussing LionTail variants attributed to the Scarred Manticore actor.","category":"","primary":false}],"body":"\u003cp\u003eKaspersky’s analysis of 2025 compromise assessment engagements found that many organizations had missed incidents that remained undetected for weeks, months, or years. The report says 30.8% of incidents had activity spanning more than three months, and 52% of high-severity compromises were discovered only after 90 days of going undetected. The oldest incident identified in 2025 had remained hidden for four years.\u003c/p\u003e\n\n\u003cp\u003eThe findings show that proactive compromise assessments were associated with fewer high-severity discoveries than assessments requested after a known incident. Post-incident checkups had the highest share of high-severity findings at 40.7%, while regular audits had the lowest share of high-severity issues at 27.7%. Kaspersky also reported that 60% of discovered incidents were missed because existing tools did not generate high-confidence alerts, while 20% were found manually.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights recurring technical and operational gaps, including web shells preserved in backups, incomplete asset inventories, nonstandard remote management tools, living-off-the-land binaries, weak monitoring, and insufficient threat hunting. Case studies included dormant persistence through cron jobs, registry runs, and WMI subscriptions; four-year-old NSABuffMiner activity on domain controllers; Impacket activity leading to Cobalt Strike and Mimikatz deployment; and in-memory threats such as LionTail and PurpleFox. The report concludes that organizations should improve detection health checks, alert validation, \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e monitoring, threat hunting, vulnerability management, awareness training, tabletop exercises, and communication procedures.\u003c/p\u003e\n"},{"n":5,"title":"The AI Dilemma in Healthcare: Innovating Without Risking Security","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/the-ai-dilemma-in-healthcare-innovating-without-risking-security","time":"07:01","priority":"MAY READ","score":50,"tldr":"Healthcare organizations are rapidly adopting AI, but widespread shadow AI and legacy infrastructure are creating serious risks to patient data, compliance, and security. The key takeaway is that AI innovation in healthcare needs strong governance through modern zero trust and SASE architectures to be safe.","briefOverview":"\u003cp\u003eNetskope describes a healthcare sector push to adopt AI for clinician burnout, diagnostic accuracy, and operational efficiency while warning that this adoption is happening on top of legacy infrastructure and unmanaged behaviors. Its survey of North American healthcare IT leaders found that 67% of healthcare organizations are building their own AI applications, while 52% have approved standalone AI apps and are integrating AI into existing SaaS platforms. The article says the key question for CISOs and CIOs is how to govern AI innovation before it creates security problems.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights shadow AI as a major concern, stating that half of healthcare organizations report using AI without corporate oversight. It warns that clinicians or administrative staff may input patient notes into unmanaged large language models, putting sensitive patient data at risk. It also notes a gap in risk perception, with only 52% of leaders expressing concern about data leakage from shadow AI despite widespread unmanaged AI use.\u003c/p\u003e\n\n\u003cp\u003eNetskope argues that legacy infrastructure and technical debt are slowing AI progress, with 49% of leaders saying current infrastructure slows new AI initiatives and 28% saying legacy systems hold back innovation. The article says traditional perimeter-based security is insufficient when data moves between clinicians, cloud apps, and third-party models. It recommends zero trust and secure access service edge architectures to govern AI use, protect Protected Health Information, maintain audit trails, and support secure healthcare innovation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope’s survey of North American healthcare IT leaders found that 67% of healthcare organizations are building their own AI applications, while 52% have approved standalone AI apps and are integrating AI into existing SaaS platforms.","Half of healthcare organizations report using AI without corporate oversight, creating shadow AI risks when staff input sensitive patient data into unmanaged large language models.","Healthcare leaders cited legacy infrastructure and technical debt as barriers, with 49% saying current infrastructure slows new AI initiatives and 28% saying legacy systems actively hold back innovation.","The article says traditional perimeter-based security is insufficient for AI use in healthcare because data moves between clinicians, cloud apps, and third-party models.","Healthcare leaders using zero trust and secure access service edge architectures reported benefits including better network performance, faster launches of new products and services, and operational efficiency and cost reduction."],"insights":["The article highlights a mismatch between AI use and risk awareness: half of healthcare organizations report shadow AI use, yet only 52% of leaders expressed concern about data leakage from shadow AI.","The pressure to adopt AI is coming at the same time as concern about its reliability, with 51% of healthcare leaders citing boardroom pressure to rush AI adoption and 51% worrying about AI hallucinations affecting clinical decision-making.","The article frames an AI-related data breach not only as a privacy or compliance issue, but as a patient safety issue because patient care depends on data integrity and system availability.","The article presents modern security architecture as an enabler of AI adoption rather than only a control mechanism, citing reported benefits such as faster service launches, improved network performance, and reduced operational costs."],"referencedReports":[],"body":"\u003cp\u003eNetskope describes a healthcare sector push to adopt AI for clinician burnout, diagnostic accuracy, and operational efficiency while warning that this adoption is happening on top of legacy infrastructure and unmanaged behaviors. Its survey of North American healthcare IT leaders found that 67% of healthcare organizations are building their own AI applications, while 52% have approved standalone AI apps and are integrating AI into existing SaaS platforms. The article says the key question for CISOs and CIOs is how to govern AI innovation before it creates security problems.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights shadow AI as a major concern, stating that half of healthcare organizations report using AI without corporate oversight. It warns that clinicians or administrative staff may input patient notes into unmanaged large language models, putting sensitive patient data at risk. It also notes a gap in risk perception, with only 52% of leaders expressing concern about data leakage from shadow AI despite widespread unmanaged AI use.\u003c/p\u003e\n\n\u003cp\u003eNetskope argues that legacy infrastructure and technical debt are slowing AI progress, with 49% of leaders saying current infrastructure slows new AI initiatives and 28% saying legacy systems hold back innovation. The article says traditional perimeter-based security is insufficient when data moves between clinicians, cloud apps, and third-party models. It recommends zero trust and secure access service edge architectures to govern AI use, protect Protected Health Information, maintain audit trails, and support secure healthcare innovation.\u003c/p\u003e\n"}]</script>
