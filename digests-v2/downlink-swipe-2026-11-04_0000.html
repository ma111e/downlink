rom a direct targeting of the organization. Its monitoring and alarm systems detected the anomalies quickly, and affected equipment was either brought under control or neutralized while stored products were transferred to other facilities.\u003c/p\u003e\n\n\u003cp\u003eEFS reported no health impacts and no losses of blood products, samples, or biobank materials. The case is the first reported French incident in a second wave of cyberattacks affecting refrigeration control systems, and the first reported case involving a healthcare organization. Businesses in at least 11 European countries have reportedly been affected in the latest wave, but no group has claimed responsibility and authorities have not attributed the incidents to any actor.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Temperature and defrosting thresholds were raised to very high levels at cold-storage rooms at three Établissement Français du Sang sites.","EFS said its monitoring and alarm systems detected the anomalies quickly, allowing affected equipment to be controlled or neutralized and stored products to be moved to other facilities.","EFS reported no health impacts and no losses of blood products or samples.","The incident reached EFS through a third-party refrigeration-equipment provider rather than directly targeting the organization.","Businesses in at least 11 European countries have reportedly been affected in the most recent wave, and no group or entity has claimed responsibility."],"insights":["The incident is the first reported case in France in the second wave of refrigeration-system attacks and the first reported case affecting a healthcare organization.","EFS’s monitoring and alarm systems enabled it to prevent reported losses despite temperature and defrost settings being raised to very high levels.","The attacks can affect organizations indirectly through a shared refrigeration-equipment provider rather than by directly targeting each affected organization.","Although the incidents span at least 11 European countries, authorities have not attributed them to a group, and Belgium’s cybersecurity agency said identifying those responsible may never be possible."],"referencedReports":[],"body":"\u003cp\u003eTemperature and defrosting controls were raised to very high levels at cold-storage rooms at three Établissement Français du Sang (EFS) sites in France. EFS said the incident came through a third-party provider of refrigeration equipment rather than from a direct targeting of the organization. Its monitoring and alarm systems detected the anomalies quickly, and affected equipment was either brought under control or neutralized while stored products were transferred to other facilities.\u003c/p\u003e\n\n\u003cp\u003eEFS reported no health impacts and no losses of blood products, samples, or biobank materials. The case is the first reported French incident in a second wave of cyberattacks affecting refrigeration control systems, and the first reported case involving a healthcare organization. Businesses in at least 11 European countries have reportedly been affected in the latest wave, but no group has claimed responsibility and authorities have not attributed the incidents to any actor.\u003c/p\u003e\n"},{"n":15,"title":"Cyberattack wipes cloud data at major Russian hosting provider Beget","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-cyberattack-beget-cloud","time":"14:00","priority":"SHOULD READ","score":84,"tldr":"A cyberattack on Russian hosting provider Beget wiped cloud data and virtual-server binary backups after attackers accessed infrastructure management systems, disrupting hundreds of websites and services. Beget is manually restoring more than 1,000 servers, with some customer data potentially recoverable from file-level backups.","briefOverview":"\u003cp\u003eBeget, a major Russian hosting provider and domain registrar, said a cyberattack overnight on Sunday disrupted its services and destroyed data across parts of its cloud infrastructure. The company said attackers accessed systems used to manage its infrastructure and ran scripts designed to erase data. Data tied to virtual private servers, cloud storage, and Kubernetes services was wiped, and Beget lost all binary backups of its virtual servers.\u003c/p\u003e\n\n\u003cp\u003eBeget said file-level backups remain intact and may enable recovery of some information, while nearly all websites on its shared-hosting infrastructure can likely be restored. Recovery is expected to take considerable time because more than 1,000 servers must be manually inspected, with engineers removing malicious files and checking data integrity before restoring systems. The disruption affected businesses, government agencies, research institutions, and services including the Naryan-Mar city administration website and Russia’s Chestny Znak product-labeling system; Beget also advised customers to change credentials that may have been stored on affected systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beget said attackers accessed systems used to manage its infrastructure and ran scripts that erased data.","The attack wiped data associated with Beget’s virtual private servers, cloud storage, and Kubernetes services, and the company lost all binary backups of its virtual servers.","Beget said file-level backups remained intact and may allow recovery of some information, while nearly all websites on its shared hosting infrastructure can likely be restored.","Restoring services will take considerable time because more than 1,000 servers must be manually inspected before being brought back online.","The disruption affected websites and online services in Russia used by businesses, government agencies, and research institutions, including the Naryan-Mar city administration website and the Chestny Znak system."],"insights":["The attackers’ access to Beget’s infrastructure-management systems created a broad impact: they could run data-erasing scripts across cloud services rather than affecting only a single customer environment.","Beget’s remaining file-level backups may help recover some information, but the loss of all virtual-server binary backups significantly limits straightforward restoration of affected virtual servers.","Shared-hosting websites appear more recoverable than cloud services such as virtual private servers, cloud storage, and Kubernetes, illustrating that recovery prospects differ across Beget’s service types.","Beget found no evidence that customer data was downloaded or altered, but still told customers to change passwords, access keys, and other credentials that may have been stored on affected systems.","The need to inspect more than 1,000 servers individually means recovery depends not only on available backups but also on time-consuming checks for malicious files and data integrity."],"referencedReports":[{"title":"CNews report on Beget service disruptions","url":"https://www.cnews.ru/news/top/2026-11-02_it-sboj_u_mezhdunarodnogo","publisher":"cnews","context":"The article cites local media reports, including CNews, for disruption of websites and online services across Russia.","category":"news","primary":false},{"title":"Kommersant report on Beget disruption impacts","url":"https://www.kommersant.ru/doc/9079245","publisher":"kommersant","context":"The article cites Kommersant's report that the disruption primarily affected small and medium-sized businesses using Beget for online stores and corporate websites.","category":"news","primary":false}],"body":"\u003cp\u003eBeget, a major Russian hosting provider and domain registrar, said a cyberattack overnight on Sunday disrupted its services and destroyed data across parts of its cloud infrastructure. The company said attackers accessed systems used to manage its infrastructure and ran scripts designed to erase data. Data tied to virtual private servers, cloud storage, and Kubernetes services was wiped, and Beget lost all binary backups of its virtual servers.\u003c/p\u003e\n\n\u003cp\u003eBeget said file-level backups remain intact and may enable recovery of some information, while nearly all websites on its shared-hosting infrastructure can likely be restored. Recovery is expected to take considerable time because more than 1,000 servers must be manually inspected, with engineers removing malicious files and checking data integrity before restoring systems. The disruption affected businesses, government agencies, research institutions, and services including the Naryan-Mar city administration website and Russia’s Chestny Znak product-labeling system; Beget also advised customers to change credentials that may have been stored on affected systems.\u003c/p\u003e\n"},{"n":34,"title":"UK Cybercrime Journal: Beacon CRM Breach Impacts Over 1,500 Charities","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/11/uk-cybercrime-journal-beacon-crm-breach.html","time":"10:00","priority":"SHOULD READ","score":84,"tldr":"Beacon CRM exposed database backups for more than 1,000 UK charities after an AWS access key was leaked in public JavaScript artifacts, putting donor and service-user personal data at risk. The incident underscores the supply-chain impact of poor secret management and overly broad cloud access permissions.","briefOverview":"\u003cp\u003eBeacon CRM, a UK customer relationship management platform serving more than 1,500 non-profit and charitable organisations, suffered a cyber incident in late July 2026. Attackers reportedly gained access around 27 July using an AWS access key exposed in publicly accessible JavaScript build files. Between 27 and 28 July, they downloaded full database backups containing records from more than 1,000 UK charity customers.\u003c/p\u003e\n\n\u003cp\u003eThe backups contained names, email addresses, phone numbers, home addresses, donation histories, and uploaded files such as Gift Aid declarations and user notes, although they did not contain payment card numbers or live bank details. Some charities said older records and information that people had requested be deleted were retained in backups and were therefore exposed. Beacon detected the activity on 29 July, revoked the credentials, and began notifying affected organisations from 30 July to 3 August.\u003c/p\u003e\n\n\u003cp\u003eThe article says the incident demonstrates how a security problem at a central software supplier can affect many smaller organisations that rely on it. It also warns that the exposed information could be used for targeted scams, phishing, and identity fraud against donors and vulnerable service users. Its recommended measures include automated secret scanning before software is published, limiting what cloud access keys can reach, planning for supplier incidents, and rotating connected credentials after an upstream compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beacon CRM reported that attackers used an AWS access key exposed in publicly accessible JavaScript build artifacts to gain access around 27 July 2026.","From 27 to 28 July 2026, the attackers downloaded full database backups containing records from more than 1,000 UK charity customers.","The affected backups included names, email addresses, phone numbers, home addresses, donation histories, and uploaded attachments, but did not contain payment card numbers or live bank details.","Beacon CRM detected the unauthorised activity on 29 July, revoked the exposed credentials, and began notifying affected organisations between 30 July and 3 August.","The article states that some stored backups contained historical records and data that individuals had previously requested be deleted."],"insights":["The incident shows that data retained in backups can expose people’s historical records even after they have requested deletion from the live system.","Although payment card numbers and live bank details were not stored in the affected database, the combination of contact details, home addresses, donation histories, Gift Aid declarations, and user notes can support targeted scams and identity fraud.","A publicly exposed application-layer AWS key was able to access full database backups, highlighting the importance of ensuring such credentials cannot read or export sensitive backup stores.","Because Beacon CRM served more than 1,500 non-profit and charitable organisations, one supplier credential exposure created a cascading incident for many organisations with limited in-house security resources."],"referencedReports":[{"title":"Beacon Cyber Security Incident Final Report - September 2026","url":"https://cdn.prod.website-files.com/6369f7fe243b240624080be7/6a99303116408f423ae78fe2_200e7238def89b6f82b7a023e5adb7b8_Beacon%20Cyber%20Security%20Incident%20Final%20Report%20-%20September%202026.pdf","publisher":"beacon-crm","context":"The article lists Beacon's final incident report as a relevant source for the breach details.","category":"research","primary":true},{"title":"Guidance for charities affected by the Beacon cyber security incident","url":"https://www.gov.uk/government/news/guidance-for-charities-affected-by-the-beacon-cyber-security-incident","publisher":"uk-government","context":"The article lists UK government guidance for charities affected by the Beacon CRM incident.","category":"advisory","primary":false}],"body":"\u003cp\u003eBeacon CRM, a UK customer relationship management platform serving more than 1,500 non-profit and charitable organisations, suffered a cyber incident in late July 2026. Attackers reportedly gained access around 27 July using an AWS access key exposed in publicly accessible JavaScript build files. Between 27 and 28 July, they downloaded full database backups containing records from more than 1,000 UK charity customers.\u003c/p\u003e\n\n\u003cp\u003eThe backups contained names, email addresses, phone numbers, home addresses, donation histories, and uploaded files such as Gift Aid declarations and user notes, although they did not contain payment card numbers or live bank details. Some charities said older records and information that people had requested be deleted were retained in backups and were therefore exposed. Beacon detected the activity on 29 July, revoked the credentials, and began notifying affected organisations from 30 July to 3 August.\u003c/p\u003e\n\n\u003cp\u003eThe article says the incident demonstrates how a security problem at a central software supplier can affect many smaller organisations that rely on it. It also warns that the exposed information could be used for targeted scams, phishing, and identity fraud against donors and vulnerable service users. Its recommended measures include automated secret scanning before software is published, limiting what cloud access keys can reach, planning for supplier incidents, and rotating connected credentials after an upstream compromise.\u003c/p\u003e\n"},{"n":26,"title":"SonicWall Won't Patch EoL GMS Flaws That Could Expose Files, Alter Database Records","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sonicwall-wont-patch-eol-gms-flaws-that.html","time":"17:00","priority":"SHOULD READ","score":83,"tldr":"SonicWall will not patch two serious vulnerabilities in end-of-life Global Management System versions 9.5.2 and earlier, including an unauthenticated file-read flaw and a post-authentication SQL injection issue. Organizations should migrate to SonicWall Network Security Manager to reduce exposure.","briefOverview":"\u003cp\u003eSonicWall has disclosed two vulnerabilities affecting Global Management System (GMS) version 9.5.2 and earlier. The product has reached end of life, and SonicWall said it will not issue a fix or security update for either issue. The company strongly recommends that organizations using GMS upgrade to SonicWall Network Security Manager (NSM).\u003c/p\u003e\n\n\u003cp\u003eThe more severe flaw, CVE-2026-109593, has a CVSS score of 9.1 and could let an unauthenticated person with network access read internal GMS files, potentially exposing sensitive information. CVE-2026-109594, rated 6.8, is a post-authentication SQL injection issue that could allow an authenticated attacker to access or change GMS database information under specific conditions. The article also notes active exploitation of a separate SonicWall flaw, CVE-2026-102255, for which Previdian recorded 2,541 attempts from eight IP addresses in Singapore and the United States since October 9, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall disclosed two vulnerabilities affecting Global Management System versions 9.5.2 and earlier, a product that has reached end of life.","CVE-2026-109593 has a CVSS score of 9.1 and could allow an unauthenticated network attacker to read internal GMS files.","CVE-2026-109594 has a CVSS score of 6.8 and could allow an authenticated attacker, under specific conditions, to access or modify information in the GMS database through SQL injection.","SonicWall said it will not release remediation or security updates for these flaws and urged organizations to upgrade to SonicWall Network Security Manager.","The article also notes that CVE-2026-102255, a separate critical SonicWall SSRF flaw, has been actively exploited, with Previdian recording 2,541 attempts from eight IP addresses in Singapore and the United States since October 9, 2026."],"insights":["The most severe newly disclosed GMS issue can be exploited without logging in, meaning network access alone could be enough to expose internal files.","Because GMS is end of life, the vendor’s stated response is replacement rather than a future patch, making an upgrade to Network Security Manager the only recommended path in the article.","The report places the unpatched GMS disclosures alongside active exploitation of a separate SonicWall flaw, for which 2,541 attempts were recorded from eight IP addresses since October 9, 2026."],"referencedReports":[{"title":"SNWLID-2026-0019","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0019","publisher":"sonicwall","context":"SonicWall's advisory warns of the two unpatched vulnerabilities affecting end-of-life Global Management System releases.","category":"advisory","primary":true},{"title":"CVE-2026-102255 Telemetry","url":"https://previdian.com/CVE-2026-102255#telemetry","publisher":"previdian","context":"The article cites Previdian telemetry data reporting 2,541 exploitation attempts against CVE-2026-102255.","category":"research","primary":false}],"body":"\u003cp\u003eSonicWall has disclosed two vulnerabilities affecting Global Management System (GMS) version 9.5.2 and earlier. The product has reached end of life, and SonicWall said it will not issue a fix or security update for either issue. The company strongly recommends that organizations using GMS upgrade to SonicWall Network Security Manager (NSM).\u003c/p\u003e\n\n\u003cp\u003eThe more severe flaw, CVE-2026-109593, has a CVSS score of 9.1 and could let an unauthenticated person with network access read internal GMS files, potentially exposing sensitive information. CVE-2026-109594, rated 6.8, is a post-authentication SQL injection issue that could allow an authenticated attacker to access or change GMS database information under specific conditions. The article also notes active exploitation of a separate SonicWall flaw, CVE-2026-102255, for which Previdian recorded 2,541 attempts from eight IP addresses in Singapore and the United States since October 9, 2026.\u003c/p\u003e\n"},{"n":2,"title":"Cyberattack disrupts blood storage refrigeration systems in France","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cyberattack-disrupts-blood-storage-refrigeration-systems-in-france/","time":"18:02","priority":"SHOULD READ","score":82,"tldr":"A cyberattack on a refrigeration supplier remotely altered cold-storage settings at three French Blood Establishment facilities, but monitoring systems prevented any reported loss of blood products or disruption to services.","briefOverview":"\u003cp\u003eFrance’s national blood service, Établissement français du sang (EFS), said a November 2 cyberattack on one of its refrigeration-equipment suppliers altered temperature and defrost thresholds at three facilities. The affected chambers stored blood products for hospitals and biological samples. EFS said it was not directly targeted, and Coolworld Rentals confirmed that a cybersecurity incident involving remote-monitoring software had affected a limited number of its refrigeration units.\u003c/p\u003e\n\n\u003cp\u003eEFS’s monitoring and alarm systems detected the changes quickly, allowing staff to repair equipment or move products to other refrigeration facilities. The organization reported no health impact, no loss of blood products, and no interruption to collection or distribution, including for plasma intended for transfusions and medicine manufacturing. The incident follows similar attacks on supermarket refrigeration systems in several European countries; CISA has also disclosed two flaws, CVE-2025-41450 and CVE-2025-41451, in Danfoss AK-SM 8xxA controllers that could enable authentication bypass and remote commands, although their use in these incidents has not been confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A cyberattack on November 2 affected a refrigeration supplier used by France's national blood service, raising temperature and defrost thresholds at three EFS facilities.","EFS said its monitoring and alarm systems detected the changes quickly, enabling staff to repair equipment or transfer stored products to other refrigeration facilities.","EFS reported no identified health impact, no loss of blood products, and no interruption to blood collection or distribution operations.","Coolworld Rentals said a vulnerability in a third-party component affected a limited number of its remotely monitored refrigeration units.","The incident followed attacks on refrigeration systems at supermarkets in France and other European countries, where remote settings were changed or cooling was shut down."],"insights":["The blood service itself was not directly targeted; a compromise at a refrigeration-equipment supplier was sufficient to affect systems protecting blood products and biological samples.","Rapid temperature alarms and the ability to transfer products to alternate cold storage prevented reported losses, demonstrating the operational value of independent monitoring and contingency capacity.","The reported changes included both elevated temperature thresholds and defrost settings, meaning attackers could endanger refrigerated stock without physically accessing the facilities.","Similar incidents spanning supermarkets in multiple European countries indicate that remotely managed refrigeration equipment can create widespread disruption across both food and healthcare supply chains.","CISA has disclosed two flaws in Danfoss AK-SM 8xxA controllers that could permit authentication bypass and remote command execution, though the article says their use in these incidents has not been confirmed."],"referencedReports":[{"title":"ICSA-25-140-03: Danfoss AK-SM 8xxA","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-25-140-03","publisher":"cisa","context":"The article cites CISA's advisory describing CVE-2025-41450 and CVE-2025-41451, which could allow authentication bypass and remote command execution on affected Danfoss refrigeration controllers.","category":"advisory","primary":false}],"body":"\u003cp\u003eFrance’s national blood service, Établissement français du sang (EFS), said a November 2 cyberattack on one of its refrigeration-equipment suppliers altered temperature and defrost thresholds at three facilities. The affected chambers stored blood products for hospitals and biological samples. EFS said it was not directly targeted, and Coolworld Rentals confirmed that a cybersecurity incident involving remote-monitoring software had affected a limited number of its refrigeration units.\u003c/p\u003e\n\n\u003cp\u003eEFS’s monitoring and alarm systems detected the changes quickly, allowing staff to repair equipment or move products to other refrigeration facilities. The organization reported no health impact, no loss of blood products, and no interruption to collection or distribution, including for plasma intended for transfusions and medicine manufacturing. The incident follows similar attacks on supermarket refrigeration systems in several European countries; CISA has also disclosed two flaws, CVE-2025-41450 and CVE-2025-41451, in Danfoss AK-SM 8xxA controllers that could enable authentication bypass and remote commands, although their use in these incidents has not been confirmed.\u003c/p\u003e\n"},{"n":7,"title":"Google Calendar phishing campaign hijacks sessions, bypasses MFA","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-calendar-phishing-campaign-hijacks-sessions-bypasses-mfa/","time":"15:00","priority":"SHOULD READ","score":82,"tldr":"A phishing campaign dubbed Operation CloudFire used trusted Google Calendar and Drive links to funnel victims through reverse-proxy login pages that captured live Google sessions and bypassed MFA. Material Security and Cloudflare disrupted hundreds of attacker domains, but defenders should monitor Workspace logs and rapidly revoke compromised sessions and OAuth grants.","briefOverview":"\u003cp\u003eSince mid-August 2026, a phishing campaign tracked by Material Security as Operation CloudFire has targeted corporate Google users with Google Calendar invites and, later, Google Drive sharing invitations. The messages use common pretexts including voicemail alerts, RFPs, court summonses, and missed-payment notices, often appearing to originate from organizations or contacts recipients already know. Attackers use compromised sender accounts, trusted Google redirect links, and disposable domains to make the messages appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eVictims are routed to a live reverse proxy of Google’s real sign-in page, allowing attackers to capture an active Google session while the victim enters their password and completes normal verification prompts. The operation can relay SMS codes, authenticator codes, Tap-Yes number matching, and phone-based recovery in real time, so multifactor authentication does not prevent session capture. A hijacked session can give attackers access to Workspace email and Drive data and allow OAuth access to be granted in the victim’s name.\u003c/p\u003e\n\n\u003cp\u003eMaterial reported blocking 68,676 campaign messages, analyzing 2,112 malicious URLs, and taking down 897 domains during one month of Operation CloudFire. It reported the campaign infrastructure to Cloudflare, which applied phishing warnings to reported destinations and forced the operator to rebuild affected gateways and receiving endpoints. Although Material says activity from this group appears to have dispersed, it notes that the attacker’s publicly documented Nyasher framework included an unfinished Microsoft 365 branch that could be activated later.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Since mid-August 2026, Operation CloudFire has used Google Calendar invites and later Google Drive sharing invites with ordinary pretexts such as voicemail notices, RFPs, court summonses, and missed-payment notices.","The campaign routes victims through legitimate Google redirect links to a live reverse proxy of Google’s sign-in page, allowing attackers to capture active sessions even when victims complete SMS, authenticator, Tap-Yes, or phone-based verification.","The campaign used Cloudflare Turnstile and browser-generated credential-capture pages, while relying on disposable domains and compromised sender accounts to evade reputation-based defenses.","During one month of Operation CloudFire, Material Security reported blocking 68,676 campaign messages, analyzing 2,112 malicious URLs, taking down 897 domains, and identifying 8,570 compromised sender addresses across 6,354 root domains.","A captured Google session can provide access to Workspace email and Drive data and allow OAuth access to be granted in the victim’s name, making rapid session revocation, OAuth containment, and account reset important."],"insights":["The campaign was designed so that common trust signals looked legitimate: its links often began with Google-owned redirectors, its sender accounts were compromised accounts with established histories, and some gates used genuine Cloudflare Turnstile infrastructure.","Because the fake sign-in page was assembled in the victim’s browser only after a challenge was completed, conventional crawlers and proxy logs could have little or no malicious page content to inspect.","Calendar invitations created a detection gap because they are poorly suited to email gateways that primarily inspect messages while they are being transmitted.","The most important evidence of a successful compromise may appear in Google Workspace audit logs rather than in password-reset alerts, because the attacker captures an active session instead of merely stealing a password.","Cloudflare’s phishing interstitials disrupted the operation beyond Material Security customers by warning anyone who clicked reported campaign links."],"referencedReports":[],"body":"\u003cp\u003eSince mid-August 2026, a phishing campaign tracked by Material Security as Operation CloudFire has targeted corporate Google users with Google Calendar invites and, later, Google Drive sharing invitations. The messages use common pretexts including voicemail alerts, RFPs, court summonses, and missed-payment notices, often appearing to originate from organizations or contacts recipients already know. Attackers use compromised sender accounts, trusted Google redirect links, and disposable domains to make the messages appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eVictims are routed to a live reverse proxy of Google’s real sign-in page, allowing attackers to capture an active Google session while the victim enters their password and completes normal verification prompts. The operation can relay SMS codes, authenticator codes, Tap-Yes number matching, and phone-based recovery in real time, so multifactor authentication does not prevent session capture. A hijacked session can give attackers access to Workspace email and Drive data and allow OAuth access to be granted in the victim’s name.\u003c/p\u003e\n\n\u003cp\u003eMaterial reported blocking 68,676 campaign messages, analyzing 2,112 malicious URLs, and taking down 897 domains during one month of Operation CloudFire. It reported the campaign infrastructure to Cloudflare, which applied phishing warnings to reported destinations and forced the operator to rebuild affected gateways and receiving endpoints. Although Material says activity from this group appears to have dispersed, it notes that the attacker’s publicly documented Nyasher framework included an unfinished Microsoft 365 branch that could be activated later.\u003c/p\u003e\n"},{"n":25,"title":"Russian Police Arrest 3 Suspected VasyGrek Hackers, Dismantle Criminal Infrastructure","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/russian-police-arrest-3-suspected.html","time":"08:17","priority":"SHOULD READ","score":82,"tldr":"Russian police arrested three suspected members of the financially motivated VasyGrek (Fluffy Wolf) group and dismantled infrastructure used to phish organizations and steal funds. The group has targeted organizations across Russia, Belarus, and Kazakhstan with phishing-delivered stealers, RATs, and custom backdoors.","briefOverview":"\u003cp\u003eRussian authorities arrested three suspected members of VasyGrek, also known as Fluffy Wolf, and dismantled infrastructure linked to the group’s operations. The Russian Interior Ministry said the suspects are accused of stealing funds from organizational accounts and creating, distributing, and using malicious software. Searches of their residences and office premises resulted in the seizure of computers, communications devices, and other evidence.\u003c/p\u003e\n\n\u003cp\u003eIn a September 2025 incident, the group allegedly sent an unnamed organization a fake business email directing recipients to open a reconciliation report, which ran malicious software. The incident reportedly led to the theft of 660,000 rubles, or about $8,000, from the organization’s bank account. Authorities said the operation used phishing domains impersonating finance and accounting services, foreign-hosted virtual servers, and remotely controlled tools obtained from the dark web.\u003c/p\u003e\n\n\u003cp\u003eKaspersky recorded more than 100 attempted VasyGrek attacks against organizations in Russia, Belarus, and Kazakhstan from January through September 2026. Reported targets included metallurgical companies, wholesale suppliers, government agencies, and organizations in healthcare, oil and gas, energy, finance, and agriculture. The group reportedly used multi-stage delivery methods, legitimate online services to host harmful components, commercial data-stealing and remote-control tools, legitimate remote-access software, and a Golang backdoor capable of running commands on infected devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russian authorities arrested three suspected VasyGrek members, searched their residences and office premises, and seized computer equipment and communication devices.","The Russian Interior Ministry said the group is suspected of stealing funds from organizational accounts and creating, distributing, and using malicious software.","In a September 2025 case, attackers allegedly used a phishing email disguised as business correspondence to steal 660,000 rubles from an unnamed organization.","Kaspersky recorded more than 100 attempted VasyGrek attacks against organizations in Russia, Belarus, and Kazakhstan between January and September 2026.","VasyGrek has reportedly targeted metallurgical organizations, wholesale suppliers, government agencies, and entities in healthcare, oil and gas, energy, finance, and agriculture."],"insights":["VasyGrek reportedly combined a large network of fake finance and accounting websites with servers located abroad, showing that its phishing operations relied on supporting infrastructure beyond a single malicious email.","The group reportedly used legitimate online services to host malicious components, a method Kaspersky said helped conceal activity and made analysis harder.","VasyGrek’s reported victim set expanded beyond Russia to include Belarus and Kazakhstan in 2026.","Its toolset reportedly mixed commercially available data-stealing and remote-control software with legitimate remote-access software, rather than relying solely on custom-built tools."],"referencedReports":[{"title":"VasyGrek and Mr. Burns","url":"https://www.f6.ru/blog/vasygrek-and-mr-burns/","publisher":"f6","context":"The article cites this F6 report as background on VasyGrek’s financially motivated phishing activity and tooling.","category":"research","primary":false},{"title":"VasyGrek: New Attacks in 2025","url":"https://www.f6.ru/blog/vasygrek-new-attacks-2025/","publisher":"f6","context":"The article cites this F6 analysis in describing VasyGrek’s use of phishing attachments disguised as financial documents.","category":"research","primary":false},{"title":"Kaspersky Recorded More Than 100 VasyGrek Attack Attempts Against Organizations in Russia and CIS Countries in 2026","url":"https://www.kaspersky.ru/about/press-releases/laboratoriya-kasperskogo-zafiksirovala-bolee-100-popytok-atak-gruppy-vasygrek-na-organizacii-v-rossii-i-stranah-sng-v-2026-godu","publisher":"kaspersky","context":"The article references Kaspersky’s report on more than 100 attempted VasyGrek attacks between January and September 2026.","category":"research","primary":false},{"title":"LxBase RAT First Observed in Attacks on Russian Companies","url":"https://bi.zone/eng/expertise/blog/lxbase-rat-vpervye-zamechen-v-atakakh-na-rossiyskie-kompanii/","publisher":"bi-zone","context":"The article cites BI.ZONE’s technical analysis of LxBase RAT distribution through mass phishing campaigns.","category":"research","primary":false},{"title":"Core Werewolf Changes Its Fangs: CoreRAT in Attacks on Russian Organizations","url":"https://bi.zone/eng/expertise/blog/core-werewolf-menyaet-klyki-troyan-corerat-v-atakakh-na-rossiyskie-organizatsii/","publisher":"bi-zone","context":"The article cites BI.ZONE’s analysis of CoreRAT delivery through phishing emails using 7zSFX and Rust droppers.","category":"research","primary":false}],"body":"\u003cp\u003eRussian authorities arrested three suspected members of VasyGrek, also known as Fluffy Wolf, and dismantled infrastructure linked to the group’s operations. The Russian Interior Ministry said the suspects are accused of stealing funds from organizational accounts and creating, distributing, and using malicious software. Searches of their residences and office premises resulted in the seizure of computers, communications devices, and other evidence.\u003c/p\u003e\n\n\u003cp\u003eIn a September 2025 incident, the group allegedly sent an unnamed organization a fake business email directing recipients to open a reconciliation report, which ran malicious software. The incident reportedly led to the theft of 660,000 rubles, or about $8,000, from the organization’s bank account. Authorities said the operation used phishing domains impersonating finance and accounting services, foreign-hosted virtual servers, and remotely controlled tools obtained from the dark web.\u003c/p\u003e\n\n\u003cp\u003eKaspersky recorded more than 100 attempted VasyGrek attacks against organizations in Russia, Belarus, and Kazakhstan from January through September 2026. Reported targets included metallurgical companies, wholesale suppliers, government agencies, and organizations in healthcare, oil and gas, energy, finance, and agriculture. The group reportedly used multi-stage delivery methods, legitimate online services to host harmful components, commercial data-stealing and remote-control tools, legitimate remote-access software, and a Golang backdoor capable of running commands on infected devices.\u003c/p\u003e\n"},{"n":5,"title":"mSecure password manager hack prompts password reset warnings","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/msecure-password-manager-hack-prompts-password-reset-warnings/","time":"16:00","priority":"SHOULD READ","score":79,"tldr":"mSeven Software says an attacker stole an encrypted mSecure Cloud customer database and is urging current and former users to change stored passwords, reset MFA, and remove passkeys. Although the company reports no evidence vault contents were accessed, users with weak master passwords may face offline cracking risk.","briefOverview":"\u003cp\u003emSeven Software warned current and former mSecure password-manager customers about suspicious activity involving the application. The company advised users to change passwords, reset or re-enroll two-factor authentication methods, and remove existing passkeys. Customer-shared support responses reportedly said that a hacker stole an encrypted database from mSecure Cloud containing information from customers who used cloud synchronization.\u003c/p\u003e\n\n\u003cp\u003emSeven reportedly said it has no evidence that the attacker accessed the confidential information inside the encrypted database and that the mSecure application is not currently unsafe to use. mSecure says it encrypts vault data locally on users’ devices with AES-256 before transmitting it to company servers under a zero-knowledge architecture. However, the article notes that stolen encrypted vaults can still be vulnerable to offline attempts to crack weak master passwords, citing cryptocurrency thefts later linked to the 2022 LastPass breach.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["mSeven Software notified current and former mSecure customers of suspicious activity involving its password-management application and advised them to change passwords, reset or re-enroll two-factor authentication, and remove existing passkeys.","Customer-shared support responses state that a hacker stole an encrypted database from mSecure Cloud containing information from current and former users who synchronized their databases through the service.","mSeven reportedly said it has no evidence that the attacker accessed confidential information within the encrypted database and that it has implemented additional security measures.","mSecure says its vault data is encrypted locally on users' devices with AES-256 before being sent to its servers, under a zero-knowledge design.","The article notes that stolen encrypted password vaults can still be at risk of offline cracking if users chose weak master passwords."],"insights":["The reported exposure was limited to customers who synchronized vaults through mSecure Cloud, meaning users who did not use that cloud-sync service were not identified in the shared support responses as affected.","Encryption protects vault contents from immediate reading, but the article emphasizes that a stolen encrypted vault can still be tested offline against weak master passwords.","The recommended response extends beyond changing passwords to replacing two-factor authentication methods and removing passkeys, reflecting that vaults may contain more than passwords.","The article draws a parallel to the 2022 LastPass breach, where stolen encrypted vault backups were later linked to cryptocurrency thefts involving weak master passwords."],"referencedReports":[],"body":"\u003cp\u003emSeven Software warned current and former mSecure password-manager customers about suspicious activity involving the application. The company advised users to change passwords, reset or re-enroll two-factor authentication methods, and remove existing passkeys. Customer-shared support responses reportedly said that a hacker stole an encrypted database from mSecure Cloud containing information from customers who used cloud synchronization.\u003c/p\u003e\n\n\u003cp\u003emSeven reportedly said it has no evidence that the attacker accessed the confidential information inside the encrypted database and that the mSecure application is not currently unsafe to use. mSecure says it encrypts vault data locally on users’ devices with AES-256 before transmitting it to company servers under a zero-knowledge architecture. However, the article notes that stolen encrypted vaults can still be vulnerable to offline attempts to crack weak master passwords, citing cryptocurrency thefts later linked to the 2022 LastPass breach.\u003c/p\u003e\n"},{"n":1,"title":"DreamHost confirms data breach exposed FTP logins and webmail sessions","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/dreamhost-confirms-data-breach-exposed-ftp-logins-and-webmail-sessions/","time":"19:05","priority":"SHOULD READ","score":78,"tldr":"DreamHost says attackers exploited its web-based File Manager from August through October 23, 2026, exposing FTP/SFTP credentials and possibly webmail session data for some users. The company reset affected passwords and sessions, patched the flaw, and says billing and control-panel credentials were not accessed.","briefOverview":"\u003cp\u003eDreamHost disclosed that an unauthorized third party accessed the server operating its web-based File Manager at files.dreamhost.com. The intrusion lasted from approximately August 2026 until its discovery on October 23, 2026. According to the company, the attacker exploited a flaw in the File Manager software to access FTP/SFTP usernames and passwords for users who logged in during that period.\u003c/p\u003e\n\n\u003cp\u003eDreamHost said the intruder may also have accessed webmail systems, exposing session information, including credentials, for a limited number of users. It said there is no evidence that control-panel login information or billing and payment details were accessed, with payment information handled by an external provider. The company says it blocked the attacker, fixed the exploited flaw, terminated potentially affected sessions, and invalidated passwords; it also advises recipients to inspect website files, review webmail forwarding rules and filters, and change reused passwords.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DreamHost said an unauthorized third party accessed the server running its web-based File Manager at files.dreamhost.com from approximately August 2026 until October 23, 2026.","The intruder exploited a software flaw and accessed FTP/SFTP usernames and passwords for people who logged into the File Manager during that period.","DreamHost said the intruder may also have accessed webmail systems and exposed session information, including credentials, for a limited number of users.","The company said it found no evidence that control-panel login information or customer billing and payment details were accessed.","DreamHost said it blocked the intruder, fixed the exploited flaw, ended potentially affected active sessions, and invalidated passwords."],"insights":["Affected customers should inspect their website files for unauthorized changes, because the exposed FTP/SFTP credentials could be used to access hosted site content.","Users should review webmail forwarding rules and filters, which can reveal or help prevent unwanted redirection of email.","People who reused their DreamHost credentials on other accounts should change those passwords as well, according to DreamHost's notification.","DreamHost stated that payment and billing details were handled by an external provider and that it found no evidence its control-panel login information was accessed."],"referencedReports":[{"title":"DreamHost Data Security Breach Notice Letter","url":"https://oag.ca.gov/system/files/DreamHost%20-%20Data%20Security%20Breach%20Notice%20Letter%20%28USA%20other%20than%20MA%29%20261102.1.pdf","publisher":"dreamhost","context":"The article cites DreamHost's data breach notification for details on the File Manager intrusion, exposed credentials, and affected time period.","category":"advisory","primary":true}],"body":"\u003cp\u003eDreamHost disclosed that an unauthorized third party accessed the server operating its web-based File Manager at files.dreamhost.com. The intrusion lasted from approximately August 2026 until its discovery on October 23, 2026. According to the company, the attacker exploited a flaw in the File Manager software to access FTP/SFTP usernames and passwords for users who logged in during that period.\u003c/p\u003e\n\n\u003cp\u003eDreamHost said the intruder may also have accessed webmail systems, exposing session information, including credentials, for a limited number of users. It said there is no evidence that control-panel login information or billing and payment details were accessed, with payment information handled by an external provider. The company says it blocked the attacker, fixed the exploited flaw, terminated potentially affected sessions, and invalidated passwords; it also advises recipients to inspect website files, review webmail forwarding rules and filters, and change reused passwords.\u003c/p\u003e\n"},{"n":9,"title":"SonicWall warns of unpatched flaws in end-of-life GMS software","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-unpatched-flaws-in-end-of-life-gms-software/","time":"14:42","priority":"SHOULD READ","score":78,"tldr":"SonicWall disclosed two unpatched vulnerabilities in end-of-life Global Management System (GMS) versions 9.5.2 and earlier, including unauthenticated internal file disclosure and privileged SQL injection. Customers are urged to migrate to Network Security Manager (NSM), as no fixes will be released.","briefOverview":"\u003cp\u003eSonicWall warned of two security flaws in its end-of-life Global Management System (GMS) software, affecting version 9.5.2 and earlier. GMS is used by IT administrators to deploy and manage thousands of SonicWall security appliances from a single interface. SonicWall has replaced GMS with its Network Security Manager (NSM) platform and will not issue patches for the newly disclosed issues.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109593 can allow an unauthenticated attacker with network access to read internal files and obtain sensitive information. CVE-2026-109594 can allow an attacker with high privileges to access or modify GMS database data through low-complexity SQL injection. SonicWall urged organizations still using GMS to upgrade to NSM, noting the risks associated with unsupported software; the company’s products have also been targeted in zero-day attacks, and CISA has added 19 SonicWall vulnerabilities to its actively exploited catalog over the last four years.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall disclosed two vulnerabilities affecting end-of-life Global Management System (GMS) versions 9.5.2 and earlier.","CVE-2026-109593 could allow unauthenticated attackers with network access to read internal files and obtain sensitive information.","CVE-2026-109594 could allow attackers with high privileges to access or modify GMS database information through low-complexity SQL injection.","SonicWall will not release patches for the flaws because GMS has reached end of life and recommends upgrading to Network Security Manager (NSM).","CISA added 19 SonicWall vulnerabilities to its actively exploited flaws catalog over the last four years, including 13 also abused by ransomware gangs."],"insights":["The affected GMS software centrally manages thousands of SonicWall security appliances, so organizations still using it face risk through a high-value administrative management point rather than an isolated device.","The two disclosed flaws have different access requirements: the file-reading issue can be reached by an unauthenticated attacker with network access, while the database issue requires high privileges.","Migration to SonicWall Network Security Manager is the only remediation SonicWall offers because GMS is end of life and will receive no security updates.","SonicWall products have a notable exploitation history: CISA added 19 SonicWall vulnerabilities to its actively exploited catalog over four years, 13 of which were also abused by ransomware gangs."],"referencedReports":[{"title":"SNWLID-2026-0019","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0019","publisher":"sonicwall","context":"The article cites SonicWall's advisory stating that no remediation or security update will be released because Global Management System has reached end of life.","category":"advisory","primary":true}],"body":"\u003cp\u003eSonicWall warned of two security flaws in its end-of-life Global Management System (GMS) software, affecting version 9.5.2 and earlier. GMS is used by IT administrators to deploy and manage thousands of SonicWall security appliances from a single interface. SonicWall has replaced GMS with its Network Security Manager (NSM) platform and will not issue patches for the newly disclosed issues.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109593 can allow an unauthenticated attacker with network access to read internal files and obtain sensitive information. CVE-2026-109594 can allow an attacker with high privileges to access or modify GMS database data through low-complexity SQL injection. SonicWall urged organizations still using GMS to upgrade to NSM, noting the risks associated with unsupported software; the company’s products have also been targeted in zero-day attacks, and CISA has added 19 SonicWall vulnerabilities to its actively exploited catalog over the last four years.\u003c/p\u003e\n"},{"n":13,"title":"Ukrainian news outlet Kyiv Independent hit by suspected Russian cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-kyiv-independent-cyberattack","time":"16:15","priority":"MAY READ","score":72,"tldr":"The Kyiv Independent’s website and newsletter systems were compromised to distribute false Russian- and English-language claims, including fabricated nuclear and physical attacks involving President Zelensky. The outlet suspects Russian actors but has not provided technical attribution evidence and says member and donor payment data was unaffected.","briefOverview":"\u003cp\u003eThe Kyiv Independent said a suspected Russian cyberattack disrupted its website after attackers accessed its website management system and a service used to distribute newsletters. The access allowed the attackers to post false messages on the publication’s website and send fabricated emails to subscribers in Russian and English. The outlet said it suspects Russian actors based on the content of the messages but has not provided technical evidence linking the breach to Moscow.\u003c/p\u003e\n\n\u003cp\u003eOne malicious email falsely claimed that President Volodymyr Zelensky had launched a nuclear warhead at Kyiv following a meeting with Russian President Vladimir Putin, while other messages made fabricated claims about a physical attack on Zelensky. The publication removed the website posts quickly and said its members’ and donors’ banking information was not compromised because payments are handled through secure third-party services. Staff are working with cybersecurity specialists to investigate the breach, identify weaknesses, and prevent further intrusions, and the incident followed a separate compromise of Ukraine’s air raid alert app that sent false threat warnings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Kyiv Independent said attackers accessed its website management system and newsletter distribution service, enabling them to post false content and email subscribers in Russian and English.","One fraudulent Russian-language email falsely claimed that President Volodymyr Zelensky had launched a nuclear warhead at Kyiv after meeting Russian President Vladimir Putin.","The publication suspects Russian actors based on the messages’ content but did not provide technical evidence tying the intrusion to Moscow.","The Kyiv Independent said members’ and donors’ banking information was not compromised because payments are processed by secure third-party services.","Staff are working with cybersecurity specialists to investigate the breach, identify weaknesses, and prevent additional intrusions."],"insights":["The intrusion affected both the publication’s website and subscriber email channel, allowing false claims to appear through multiple sources that readers may regard as trusted.","The fabricated messages focused on nuclear threats and harm to Ukraine’s president, illustrating how control of a news outlet’s communications can be used to create urgent public fear rather than merely disrupt publishing.","The Kyiv Independent’s use of third-party payment processing limited the incident’s impact on members and donors because the publication said their banking information was not compromised.","The attack followed a separate compromise of Ukraine’s air raid alert app that also delivered fabricated nuclear and chemical warnings, although the article says no connection between the incidents has been confirmed."],"referencedReports":[],"body":"\u003cp\u003eThe Kyiv Independent said a suspected Russian cyberattack disrupted its website after attackers accessed its website management system and a service used to distribute newsletters. The access allowed the attackers to post false messages on the publication’s website and send fabricated emails to subscribers in Russian and English. The outlet said it suspects Russian actors based on the content of the messages but has not provided technical evidence linking the breach to Moscow.\u003c/p\u003e\n\n\u003cp\u003eOne malicious email falsely claimed that President Volodymyr Zelensky had launched a nuclear warhead at Kyiv following a meeting with Russian President Vladimir Putin, while other messages made fabricated claims about a physical attack on Zelensky. The publication removed the website posts quickly and said its members’ and donors’ banking information was not compromised because payments are handled through secure third-party services. Staff are working with cybersecurity specialists to investigate the breach, identify weaknesses, and prevent further intrusions, and the incident followed a separate compromise of Ukraine’s air raid alert app that sent false threat warnings.\u003c/p\u003e\n"},{"n":28,"title":"Researchers Uncover Prompt Adware Hidden in OpenAI Codex Jailbreak Toolkit","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/researchers-uncover-prompt-adware.html","time":"16:06","priority":"MAY READ","score":72,"tldr":"Check Point researchers found a Codex jailbreak bundle called Haiou that persistently injects ads for a third-party AI gateway into OpenAI Codex responses. The case highlights how untrusted agent configurations and skills can create AI supply-chain risks through natural-language prompt manipulation.","briefOverview":"\u003cp\u003eCheck Point Research disclosed a Codex jailbreak bundle called Haiou that alters OpenAI Codex configuration files to inject advertisements for a third-party AI gateway into future agent responses. The researchers call this behavior “prompt adware,” extending unwanted advertising into AI agents through changed natural-language instructions. Haiou is presented on GitHub as haiou-codex, a local enhancement configuration package that adds a Chinese technical personality and security research workflow to Codex.\u003c/p\u003e\n\n\u003cp\u003eThe bundle persistently modifies the global agent instruction file so common words such as “Seagull,” “hi,” “hello,” “hey,” “yo,” and “are you there?” advertise zz.aiapi2025[.]top. It uses techniques including role-playing and reframing cybersecurity requests as Capture The Flag scenarios, and it installs skills for penetration testing, cracking, and reverse engineering. Check Point said the case shows that prompts, skills, and third-party components influencing AI agents are part of the trust chain and can introduce unwanted behavior in enterprise environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research identified a Codex jailbreak bundle called Haiou that modifies OpenAI Codex configuration files to insert advertisements for a third-party AI gateway into later responses.","The bundle persistently changes the agent’s global instruction file so words such as “Seagull,” “hi,” “hello,” and “hey” trigger an advertisement for zz.aiapi2025[.]top.","Haiou uses prompt-injection approaches including role-playing and presenting cybersecurity requests as Capture The Flag scenarios, and it installs skills for penetration testing, cracking, and reverse engineering.","The haiou-codex GitHub repository is presented as a local enhancement package that adds a Chinese technical personality and security-research workflow to Codex, and the jailbreak is also bundled with the Codex-X configuration tool.","Check Point said the case shows that third-party AI-agent skills and configurations can introduce unwanted behavior and become part of the trust chain in enterprise environments."],"insights":["The unwanted behavior is delivered through ordinary-language instructions and configuration rather than a conventional executable program, which Check Point notes may make it less recognizable as software behavior to users and security teams.","The bundle appears designed to use a freely distributed jailbreak package to attract users to an opaque, OpenAI-compatible AI gateway that is likely a paid service.","Because the advertisement can be triggered by routine greetings such as “hi,” “hello,” and “hey,” the promotion is embedded into normal interactions rather than limited to security-related requests.","The case demonstrates that an AI agent’s prompts, skills, and third-party configurations can become part of an organization’s trust chain and introduce persistent unwanted behavior."],"referencedReports":[{"title":"Free the Model, Sell the Gateway: Prompt Adware Hidden in Jailbreak Bundles","url":"https://research.checkpoint.com/2026/free-the-model-sell-the-gateway-prompt-adware-hidden-in-jailbreak-bundles/","publisher":"check-point-research","context":"The article relies on Check Point Research’s technical report detailing the Haiou Codex jailbreak bundle and its persistent advertisement injection behavior.","category":"research","primary":true}],"body":"\u003cp\u003eCheck Point Research disclosed a Codex jailbreak bundle called Haiou that alters OpenAI Codex configuration files to inject advertisements for a third-party AI gateway into future agent responses. The researchers call this behavior “prompt adware,” extending unwanted advertising into AI agents through changed natural-language instructions. Haiou is presented on GitHub as haiou-codex, a local enhancement configuration package that adds a Chinese technical personality and security research workflow to Codex.\u003c/p\u003e\n\n\u003cp\u003eThe bundle persistently modifies the global agent instruction file so common words such as “Seagull,” “hi,” “hello,” “hey,” “yo,” and “are you there?” advertise zz.aiapi2025[.]top. It uses techniques including role-playing and reframing cybersecurity requests as Capture The Flag scenarios, and it installs skills for penetration testing, cracking, and reverse engineering. Check Point said the case shows that prompts, skills, and third-party components influencing AI agents are part of the trust chain and can introduce unwanted behavior in enterprise environments.\u003c/p\u003e\n"},{"n":29,"title":"Leveraging Microsoft Graph API Change Notifications for Data Exfiltration","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/leveraging-microsoft-graph-api-change-notifications-for-data-exfiltration/","time":"16:22","priority":"MAY READ","score":72,"tldr":"Microsoft Graph Rich Change Notifications can be abused by attackers with compromised user tokens or privileged service principals to continuously exfiltrate Outlook email previews and Teams message content to attacker-controlled webhooks through Microsoft infrastructure. Organizations should monitor Graph subscription creation and notification activity, review active subscriptions, and strengthen controls against token abuse.","briefOverview":"\u003cp\u003eNetSPI describes how Microsoft Graph Change Notifications, particularly Rich Notifications containing encrypted resource data, can be abused for post-compromise data exfiltration. A compromised Microsoft 365 user or service principal can create a subscription that sends notifications to an external webhook controlled by an attacker. The notifications are delivered through Microsoft Graph and Microsoft infrastructure after the subscription is created, so the attacker does not need to repeatedly interact with individual messages. Rich Notifications can expose Outlook email metadata and body previews, as well as full Teams chat-message bodies.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates user-level subscriptions for Outlook messages and Teams chats using delegated Graph permissions such as Mail.Read and Chat.Read, and an application-level scenario using Chat.Read.All to receive Teams messages across an organization. Subscription lifetimes are limited—approximately one day for Rich Outlook notifications and up to three days for Teams messages—but can be extended before expiration by an attacker with persistent access. The Entra admin portal does not provide a dedicated tenant-wide subscription view; Global Administrators can use Get-MgSubscription with Subscription.Read.All to review them. The article recommends monitoring /subscriptions activity in MicrosoftGraphActivityLogs and triggered events in GraphNotificationsActivityLogs, a log table added following the MSRC disclosure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Graph Change Notifications let users and service principals subscribe to supported Microsoft 365 resources and send change alerts to external webhooks or Azure event services.","Rich Notifications can include encrypted resource data, allowing Outlook email metadata and body previews or the full content of Teams chat messages to be delivered to a webhook endpoint.","A compromised user with delegated Mail.Read, Mail.ReadWrite, Chat.Read, or Chat.ReadWrite permissions can create subscriptions for their own Outlook messages or Teams chats, while an application with Chat.Read.All can receive Teams messages across an organization.","Rich Notification subscriptions have limited lifetimes, but an attacker with persistent access can extend them before they expire.","Administrators can enumerate subscriptions with Get-MgSubscription and investigate subscription API activity in MicrosoftGraphActivityLogs and triggered notifications in GraphNotificationsActivityLogs."],"insights":["Teams Rich Notifications can deliver the full body of chat messages, whereas Outlook Rich Notifications permit only the bodyPreview field, which is limited to the first 255 characters.","The Outlook preview limit can be bypassed by placing successive 255-character chunks into a saved draft email, because each draft update generates a separate notification.","The notifications are sent by Microsoft Graph and Microsoft infrastructure after a subscription is created, so the attacker does not need to repeatedly access individual emails or Teams messages.","The Entra admin portal does not provide a dedicated view of tenant-wide Graph subscriptions; according to the article, Global Administrators need an app with Subscription.Read.All and Get-MgSubscription to list them.","GraphNotificationsActivityLogs was added following the MSRC disclosure and records each triggered notification, but administrators must correlate its subscription identifier with Get-MgSubscription to obtain fuller details about the creating principal and monitored resource."],"referencedReports":[],"body":"\u003cp\u003eNetSPI describes how Microsoft Graph Change Notifications, particularly Rich Notifications containing encrypted resource data, can be abused for post-compromise data exfiltration. A compromised Microsoft 365 user or service principal can create a subscription that sends notifications to an external webhook controlled by an attacker. The notifications are delivered through Microsoft Graph and Microsoft infrastructure after the subscription is created, so the attacker does not need to repeatedly interact with individual messages. Rich Notifications can expose Outlook email metadata and body previews, as well as full Teams chat-message bodies.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates user-level subscriptions for Outlook messages and Teams chats using delegated Graph permissions such as Mail.Read and Chat.Read, and an application-level scenario using Chat.Read.All to receive Teams messages across an organization. Subscription lifetimes are limited—approximately one day for Rich Outlook notifications and up to three days for Teams messages—but can be extended before expiration by an attacker with persistent access. The Entra admin portal does not provide a dedicated tenant-wide subscription view; Global Administrators can use Get-MgSubscription with Subscription.Read.All to review them. The article recommends monitoring /subscriptions activity in MicrosoftGraphActivityLogs and triggered events in GraphNotificationsActivityLogs, a log table added following the MSRC disclosure.\u003c/p\u003e\n"},{"n":3,"title":"US charges two Canadians accused of hacking US universities","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-charges-two-canadians-accused-of-hacking-us-universities/","time":"13:13","priority":"MAY READ","score":70,"tldr":"The U.S. has charged two Canadian men with allegedly hacking multiple American universities from 2016 to 2019, stealing credentials and data, and deploying cryptocurrency-mining software on compromised systems. One defendant has been extradited and both face up to 10 years in prison if convicted.","briefOverview":"\u003cp\u003eA U.S. federal grand jury indicted Canadian nationals Ryan James Roach, 35, and Mathiew James Stubbings, 41, over the alleged hacking of multiple U.S. universities between June 2016 and December 2019. They face charges including conspiracy to obtain information from and damage protected computers, obtaining information from protected computers, and intentionally damaging protected computers. If convicted, each could receive up to 10 years in prison and a $250,000 fine.\u003c/p\u003e\n\n\u003cp\u003eAccording to the Department of Justice, the defendants allegedly used virtual private servers in multiple countries, registered under false names, to distribute malware and cryptocurrency-mining software to institutions in New York, Tennessee, North Carolina, and Massachusetts. They allegedly stole data and login credentials, conducted reconnaissance, expanded access within victim networks, and used access to university supercomputers for vulnerability research. Prosecutors say the activity damaged at least 10 computers over one year and caused losses of at least $5,000; Roach was extradited to the United States in October, while Stubbings is expected to be arraigned after extradition.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A U.S. federal grand jury indicted Canadian nationals Ryan James Roach and Mathiew James Stubbings for allegedly hacking multiple U.S. universities between June 2016 and December 2019.","Prosecutors allege that the two used virtual private servers registered under fake names to send malware and cryptocurrency-mining software to victim systems and store stolen login credentials.","After gaining access, the defendants allegedly stole data and credentials, deployed cryptocurrency-mining malware, and accessed supercomputers for vulnerability research.","Roach was extradited from Canada to the United States on October 28 and arraigned on November 3, while Stubbings is expected to be arraigned after extradition."],"insights":["The alleged operation reportedly used servers in multiple countries under false names and previously compromised victim computers to obscure the defendants' identities.","The accused allegedly focused on educational institutions with supercomputers, using their access not only for cryptocurrency mining but also to research weaknesses within victim networks.","According to the DOJ, the defendants used reconnaissance and access-expansion methods after entering networks, indicating the alleged activity extended beyond an initial break-in.","Prosecutors allege that damage to at least 10 computers over one year caused losses of at least $5,000."],"referencedReports":[],"body":"\u003cp\u003eA U.S. federal grand jury indicted Canadian nationals Ryan James Roach, 35, and Mathiew James Stubbings, 41, over the alleged hacking of multiple U.S. universities between June 2016 and December 2019. They face charges including conspiracy to obtain information from and damage protected computers, obtaining information from protected computers, and intentionally damaging protected computers. If convicted, each could receive up to 10 years in prison and a $250,000 fine.\u003c/p\u003e\n\n\u003cp\u003eAccording to the Department of Justice, the defendants allegedly used virtual private servers in multiple countries, registered under false names, to distribute malware and cryptocurrency-mining software to institutions in New York, Tennessee, North Carolina, and Massachusetts. They allegedly stole data and login credentials, conducted reconnaissance, expanded access within victim networks, and used access to university supercomputers for vulnerability research. Prosecutors say the activity damaged at least 10 computers over one year and caused losses of at least $5,000; Roach was extradited to the United States in October, while Stubbings is expected to be arraigned after extradition.\u003c/p\u003e\n"},{"n":8,"title":"Vercel rolls out new protection against stolen session cookie attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/vercel-rolls-out-new-protection-against-stolen-session-cookie-attacks/","time":"21:31","priority":"MAY READ","score":68,"tldr":"Vercel is gradually deploying Device Bound Session Credentials for vercel.com logins, using TPM-backed private keys to prevent stolen session cookies from being reused on another device. It is also rolling out DPoP for its CLI and has launched Security Review, a code-scanning feature for Pro and Enterprise teams.","briefOverview":"\u003cp\u003eVercel is gradually rolling out Device Bound Session Credentials (DBSC) for logins to vercel.com, where developers manage projects and deployments. DBSC stores a private key in a device’s TPM and uses it to sign the login cookie, binding the session to that device. Vercel says the key cannot be retrieved by the company, the user, or malware, so a stolen session cookie cannot be reused from another device.\u003c/p\u003e\n\n\u003cp\u003eThe protection complements Chrome’s App-Bound Encryption, which makes browser cookies harder for information-stealing malware to extract. DBSC currently works in Chrome on macOS and Windows, and Vercel is introducing it gradually while handling OAuth application edge cases; it is also deploying DPoP for the Vercel CLI. Separately, Vercel has released Security Review in public beta for Pro and Enterprise teams, allowing Vercel Agent to scan GitHub code changes for issues including missing authorization checks and exposed secrets, and potentially validate and commit fixes when permissions allow.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Vercel is gradually rolling out Device Bound Session Credentials for vercel.com logins, which bind a session to a device using a private key stored in the device’s TPM.","The feature is intended to prevent stolen session cookies from being reused on another device, even if information-stealing malware obtains them.","DBSC currently works in Chrome on macOS and Windows, and Vercel is rolling it out gradually to address OAuth application edge cases.","Vercel is also deploying DPoP, a similar protective technology, for the Vercel CLI.","Vercel launched Security Review in public beta for Pro and Enterprise teams, allowing Vercel Agent to scan connected GitHub code changes for issues such as missing authorization checks and exposed secrets."],"insights":["Vercel’s new login protection addresses a different stage of cookie theft than Chrome’s App-Bound Encryption: Chrome makes cookies harder to extract, while DBSC is intended to stop a stolen cookie from working on a different device.","Vercel is delaying full deployment to account for OAuth application edge cases, showing that compatibility with connected login applications is a rollout consideration.","Security Review can go beyond finding problems because Vercel Agent may validate and commit fixes when it has the required permissions.","Security Review scans are free until November 10, 2026, but fixes generated by the agent will be billed separately."],"referencedReports":[],"body":"\u003cp\u003eVercel is gradually rolling out Device Bound Session Credentials (DBSC) for logins to vercel.com, where developers manage projects and deployments. DBSC stores a private key in a device’s TPM and uses it to sign the login cookie, binding the session to that device. Vercel says the key cannot be retrieved by the company, the user, or malware, so a stolen session cookie cannot be reused from another device.\u003c/p\u003e\n\n\u003cp\u003eThe protection complements Chrome’s App-Bound Encryption, which makes browser cookies harder for information-stealing malware to extract. DBSC currently works in Chrome on macOS and Windows, and Vercel is introducing it gradually while handling OAuth application edge cases; it is also deploying DPoP for the Vercel CLI. Separately, Vercel has released Security Review in public beta for Pro and Enterprise teams, allowing Vercel Agent to scan GitHub code changes for issues including missing authorization checks and exposed secrets, and potentially validate and commit fixes when permissions allow.\u003c/p\u003e\n"},{"n":30,"title":"Fake GitHub Token Alert: Three Links, One Pages Site","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/fake-github-token-alert-three-links-one-github-pages-site","time":"11:00","priority":"MAY READ","score":68,"tldr":"A fake GitHub personal-access-token alert targeted four UK fintech employees, impersonating GitHub while directing every recovery link to the same attacker-controlled GitHub Pages site. The campaign was caught and quarantined before any clicks or credential compromise occurred.","briefOverview":"\u003cp\u003eFour employees at a UK consumer fintech received a fake GitHub security notification claiming that a classic personal access token named \u003ccode\u003eaccesstoken\u003c/code\u003e, with \u003ccode\u003erepo\u003c/code\u003e and \u003ccode\u003edelete_repo\u003c/code\u003e permissions, had been added to their accounts. The message impersonated GitHub through its display name, subject line, and signing style, but came from \u003ccode\u003enoreply@portalsecure[.]co[.]uk\u003c/code\u003e rather than github.com. A commercial employee reported the email as suspicious, and a human analyst confirmed it was malicious before all four mailbox copies were quarantined.\u003c/p\u003e\n\n\u003cp\u003eThe email presented three apparent remedies—token settings, security log, and GitHub support—but every link led to the same attacker-controlled GitHub Pages host, \u003ccode\u003essomanager[.]github[.]io\u003c/code\u003e. The article highlights that GitHub Pages hosting does not mean GitHub authored or endorsed a site, and that GitHub account and security pages do not reside on a \u003ccode\u003egithub.io\u003c/code\u003e subdomain. The sending domain was registered in June 2026 and the message was sent through Mailgun; no clicks, credential submissions, or compromise were recorded.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Four employees at a UK consumer fintech received a fraudulent email impersonating GitHub that claimed a powerful personal access token named \"accesstoken\" had been created on their accounts.","The email's links labeled token settings, security log, and GitHub support all led to the same attacker-controlled GitHub Pages site, ssomanager[.]github[.]io.","The message used the display name \"GitHub\" but was sent from noreply@portalsecure[.]co[.]uk rather than a github.com address.","A recipient in a commercial role reported the email as suspicious, after which a hum
