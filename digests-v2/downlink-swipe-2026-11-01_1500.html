<script type="application/json" id="dl-articles">[{"n":1,"title":"Alpine Linux rebuilds GitLab after attempted RCE attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/alpine-linux-rebuilds-gitlab-after-attempted-rce-attack/","time":"15:11","priority":"MUST READ","score":92,"tldr":"Alpine Linux rebuilt its GitLab infrastructure and reset passwords after attackers attempted to exploit the critical CVE-2026-97229 GitLab RCE flaw. No compromise was confirmed, but incomplete logs meant the project could not rule out code execution or exposure of GitLab data and secrets.","briefOverview":"\u003cp\u003eAttackers attempted to exploit CVE-2026-97229 in Alpine Linux’s GitLab development infrastructure on October 20–21. The maximum-severity flaw affects GitLab’s CI/CD regular-expression compiler, Onigmo, bundled with Ruby, and can allow unauthenticated code execution through a specially crafted CI/CD configuration. The attempts caused eight GitLab worker crashes, with four described as partially successful but not apparently completing exploitation.\u003c/p\u003e\n\n\u003cp\u003eAlpine found no evidence of altered repository commits, packages, or releases through October 27, but could not rule out code execution because relevant logs and outbound-connection records were unavailable. It rebuilt the GitLab server from scratch and reset passwords because the instance hosts development repositories, code review, CI jobs, and the build recipes used for Alpine packages. Alpine initially used GitLab 19.3.4 and later 19.3.6, but its custom container image lacked the Ruby patch needed to fix the issue; it advised users to pull the October 27 alpinelinux/gitlab:19.3.6 image containing Ruby 3.3.13.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers attempted to exploit CVE-2026-97229 against Alpine Linux’s GitLab development infrastructure on October 20–21, causing eight worker-process crashes.","CVE-2026-97229 is a maximum-severity GitLab remote-code-execution flaw involving the Onigmo regular-expression compiler bundled with Ruby.","Alpine Linux initially deployed unpatched GitLab versions, and its custom container image lacked the Ruby patch required to fix the flaw even after an upgrade to GitLab 19.3.6.","Alpine found no evidence of altered commits, packages, or releases through October 27, but rebuilt its GitLab instance because missing logs prevented it from ruling out code execution.","Alpine advised GitLab users to reset their passwords and use the alpinelinux/gitlab:19.3.6 image published October 27, which includes Ruby 3.3.13 and addresses the flaw."],"insights":["Updating GitLab alone did not resolve the issue for Alpine because its custom container image lacked the required Ruby patch, unlike GitLab’s official packages.","Although Alpine found no evidence of tampering, missing logs and absent outbound-connection records prevented it from conclusively excluding a successful break-in, leading it to rebuild the server.","Alpine stated that signing keys were not stored on the GitLab server, limiting the risk that those keys were exposed during the incident.","The attackers downloaded Alpine’s GitLab container image, which Alpine said may indicate preparation for a supply-chain attack."],"referencedReports":[{"title":"GitLab security incident: CVE-2026-97229","url":"https://alpinelinux.org/posts/GitLab-security-incident-CVE-2026-97229.html","publisher":"alpine-linux","context":"Alpine Linux’s incident report explains why it rebuilt its GitLab instance after attempted exploitation of CVE-2026-97229.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers attempted to exploit CVE-2026-97229 in Alpine Linux’s GitLab development infrastructure on October 20–21. The maximum-severity flaw affects GitLab’s CI/CD regular-expression compiler, Onigmo, bundled with Ruby, and can allow unauthenticated code execution through a specially crafted CI/CD configuration. The attempts caused eight GitLab worker crashes, with four described as partially successful but not apparently completing exploitation.\u003c/p\u003e\n\n\u003cp\u003eAlpine found no evidence of altered repository commits, packages, or releases through October 27, but could not rule out code execution because relevant logs and outbound-connection records were unavailable. It rebuilt the GitLab server from scratch and reset passwords because the instance hosts development repositories, code review, CI jobs, and the build recipes used for Alpine packages. Alpine initially used GitLab 19.3.4 and later 19.3.6, but its custom container image lacked the Ruby patch needed to fix the issue; it advised users to pull the October 27 alpinelinux/gitlab:19.3.6 image containing Ruby 3.3.13.\u003c/p\u003e\n"}]</script>
