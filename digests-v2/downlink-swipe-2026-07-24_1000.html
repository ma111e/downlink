<script type="application/json" id="dl-articles">[{"n":4,"title":"Hacker Runs Hermes AI Agent Unattended for Post-Exploitation at Thai Finance Ministry","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/hacker-runs-hermes-ai-agent-unattended.html","time":"10:15","priority":"SHOULD READ","score":87,"tldr":"A hacker used the open-source Hermes AI agent in unattended “YOLO” mode to automate post-exploitation activity inside Thailand’s Ministry of Finance after already gaining access. The key lesson is that self-hosted AI agents can quietly scale routine intrusion tasks without vendor oversight, while exposed logs and misconfigured services like HiveServer2 can reveal or enable the activity.","briefOverview":"\u003cp\u003eSomeone installed the open-source Hermes AI assistant on a rented server, disabled the setting that asks for approval before risky commands, and pointed it at Thailand’s Ministry of Finance after already gaining access to the ministry’s network. The agent then worked through the network on its own, running scans, checking for ways to gain root access, searching file systems, and crawling a folder containing staff personnel records dating back to 2012. Hunt.io and researcher Bob Diachenko found the operator’s exposed logs on a web server with directory listing enabled, along with 585 files and 470 MB of attack tooling.\u003c/p\u003e\n\n\u003cp\u003eThe case is significant because the operator used Hermes in its documented YOLO mode, which removes human approval prompts, and ran it on their own machine where no vendor account could be monitored or banned. The article says Hermes is not a hacking tool and that nothing here is a flaw in it, but the recovered logs show how an AI agent can automate repetitive post-exploitation commands that a person would otherwise type. Nothing in the recovered material shows data leaving the network, and the initial route into the ministry is unknown.\u003c/p\u003e\n\n\u003cp\u003eMuch of the custom code targeted the ministry’s Hadoop cluster through HiveServer2, whose default authentication mode accepts any password according to Apache documentation. One script installed a malicious Java add-on called HiveCmd.jar as a user-defined function, allowing operating-system commands to be run through ordinary database queries as the Hive service account. The article recommends checking HiveServer2 authentication, restricting user-defined functions, watching for web servers connecting to Hadoop ports, searching web roots for hidden PHP files, and patching the named Linux kernel, sudo, polkit, and IIS 6.0 flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An operator installed the open-source Hermes AI assistant on a rented server, enabled its YOLO mode to remove approval prompts for risky commands, and pointed it at Thailand’s Ministry of Finance after already gaining access to the ministry’s network.","Hunt.io and researcher Bob Diachenko found the operator’s exposed Hermes logs on a web server with directory listing enabled, along with 585 files and 470 MB of attack tooling.","The Hermes agent performed repetitive post-exploitation tasks including kernel vulnerability scanning, LinPEAS runs, elevated-permission binary searches, filesystem listing, and recursive crawling of a ministry web root containing personnel records dating to 2012.","The recovered files included scripts targeting the ministry’s Hadoop cluster through HiveServer2, whose default authentication mode accepts any password, and a malicious Java add-on called HiveCmd.jar for running operating-system commands through database queries.","Nothing in the recovered material shows data leaving the network, and Thailand’s national CERT and cybersecurity agency were notified on July 15 but had not published anything by July 24 when The Hacker News checked."],"insights":["The case differs from previously reported AI-assisted attacks because Hermes was self-hosted by the operator, meaning there was no vendor account to monitor, suspend, or ban.","The operator did not need Hermes to discover a new vulnerability or choose the target; the recovered material shows the agent mainly automated ordinary repetitive commands that a human attacker would otherwise run manually.","A practical detection opportunity is the consistent Hermes output path, because Hunt.io found exposed results under a predictable /hermes-results/ folder with predictable filenames.","The Hadoop targeting was built around a documented default setting in HiveServer2 where authentication mode NONE accepts any password, making configuration review more important than looking only for novel exploits.","The exposed directory listing on the operator’s own server, rather than an AI safety control, is what revealed the activity and the associated tooling."],"referencedReports":[{"title":"Thailand Ministry of Finance Targeted with Hermes AI Agent","url":"https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent","publisher":"Hunt.io","context":"The article relies on Hunt.io's writeup for the ministry-specific findings about the exposed Hermes logs, tooling, target-specific scripts, and attacker infrastructure.","category":"","primary":false},{"title":"Disrupting AI Espionage","url":"https://www.anthropic.com/news/disrupting-AI-espionage","publisher":"Anthropic","context":"The article cites Anthropic's disclosure as a comparison point for earlier AI-assisted espionage activity involving Claude Code.","category":"","primary":false},{"title":"Dissecting and Exploiting Linux LPE Variant DirtyClone CVE-2026-43503","url":"https://research.jfrog.com/post/dissecting-and-exploiting-linux-lpe-variant-dirtyclone-cve-2026-43503/","publisher":"JFrog","context":"The article links to JFrog's technical analysis while describing one of the Linux kernel flaws checked by the customized linpeas.sh script.","category":"","primary":false}],"body":"\u003cp\u003eSomeone installed the open-source Hermes AI assistant on a rented server, disabled the setting that asks for approval before risky commands, and pointed it at Thailand’s Ministry of Finance after already gaining access to the ministry’s network. The agent then worked through the network on its own, running scans, checking for ways to gain root access, searching file systems, and crawling a folder containing staff personnel records dating back to 2012. Hunt.io and researcher Bob Diachenko found the operator’s exposed logs on a web server with directory listing enabled, along with 585 files and 470 MB of attack tooling.\u003c/p\u003e\n\n\u003cp\u003eThe case is significant because the operator used Hermes in its documented YOLO mode, which removes human approval prompts, and ran it on their own machine where no vendor account could be monitored or banned. The article says Hermes is not a hacking tool and that nothing here is a flaw in it, but the recovered logs show how an AI agent can automate repetitive post-exploitation commands that a person would otherwise type. Nothing in the recovered material shows data leaving the network, and the initial route into the ministry is unknown.\u003c/p\u003e\n\n\u003cp\u003eMuch of the custom code targeted the ministry’s Hadoop cluster through HiveServer2, whose default authentication mode accepts any password according to Apache documentation. One script installed a malicious Java add-on called HiveCmd.jar as a user-defined function, allowing operating-system commands to be run through ordinary database queries as the Hive service account. The article recommends checking HiveServer2 authentication, restricting user-defined functions, watching for web servers connecting to Hadoop ports, searching web roots for hidden PHP files, and patching the named Linux kernel, sudo, polkit, and IIS 6.0 flaws.\u003c/p\u003e\n"},{"n":6,"title":"Golden Chickens Resurfaces With Four New Malware Families and Modular Implants","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/golden-chickens-resurfaces-with-four.html","time":"10:09","priority":"SHOULD READ","score":86,"tldr":"Golden Chickens (TAG-195) has resurfaced with four new malware families, including TinyEgg, ChonkyChicken, a modular ChonkyChicken variant, and ChromEggscalator. The shift to modular, operator-driven implants shows the MaaS ecosystem is actively evolving to improve flexibility and evade detection.","briefOverview":"\u003cp\u003eThe threat actors behind the Golden Chickens malware-as-a-service ecosystem have resurfaced with four new malware families, according to Recorded Future’s Insikt Group, which tracks the group as TAG-195. The families are TinyEgg, ChonkyChicken, a modularized variant of ChonkyChicken, and ChromEggscalator. Recorded Future said the tools show an architectural transition and evolution in the TAG-195 malware-as-a-service ecosystem.\u003c/p\u003e\n\n\u003cp\u003eThe article says Golden Chickens, also known as Venom Spider, is actively refining its arsenal despite extensive public disclosures about its operations. TAG-195’s tooling has been linked to TAG-127 as an operator and customer, and TAG-127 has been observed deploying TinyEgg through ClickFix-style social engineering campaigns. The group’s tools have also been used by other cybercrime groups including Cobalt Group, Evilnum, and FIN6.\u003c/p\u003e\n\n\u003cp\u003eTinyEgg is described as a lightweight initial-access backdoor that provides host profiling, interactive shell access, and persistence management, while ChonkyChicken adds browser credential theft, Chrome DevTools Protocol session control, remote execution, reconnaissance, and surveillance. The modularized ChonkyChicken variant can fetch 14 capability modules from command-and-control infrastructure as needed, including modules for screen capture, command execution, keylogging, audio capture, browser theft through ChromEggscalator, and persistence management. Recorded Future said this modular shift likely reduces the base implant’s static detection exposure and supports selective capability delivery in the malware-as-a-service model.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Recorded Future’s Insikt Group says the Golden Chickens malware-as-a-service operators, tracked as TAG-195, have resurfaced with four new malware families: TinyEgg, ChonkyChicken, a modularized ChonkyChicken variant, and ChromEggscalator.","Recorded Future said the four malware families share consistent command-and-control mechanisms, a shared persistence approach, string obfuscation, and execution through the same delivery model.","TinyEgg is a lightweight initial-access backdoor that provides host profiling, interactive shell access, persistence management, and can stop running if sandbox or automated analysis environments are detected.","ChonkyChicken expands on TinyEgg with browser credential theft, live browser session control through Chrome DevTools Protocol, credential-backed remote execution, network reconnaissance, and sustained surveillance.","The modular version of ChonkyChicken can fetch 14 different components from command-and-control infrastructure as needed, including modules for process management, screen capture, file manipulation, command execution, keylogging, audio capture, browser theft through ChromEggscalator, and persistence management."],"insights":["Golden Chickens’ move from monolithic implants to a controller-and-plugin model reduces the base implant’s static detection exposure, according to Recorded Future.","The modular ChonkyChicken design lets operators request and load specific capabilities on demand, which Recorded Future says aligns with MaaS commercial incentives such as selectively provisioning features and limiting exposure if a customer is compromised.","TinyEgg appears intentionally limited to initial access and profiling, with post-exploitation activity delegated to ChonkyChicken rather than bundled into the first-stage malware.","The presence of a modular ChonkyChicken component named “wtrack,” whose purpose remains unknown, indicates that at least one capability may still be under active development.","TAG-127 has been observed deploying TinyEgg through ClickFix-style campaigns that rely on tricking users into manually executing malicious commands rather than exploiting a named software vulnerability."],"referencedReports":[{"title":"TAG-195 Evolves MaaS Ecosystem","url":"https://www.recordedfuture.com/research/tag-195-evolves-maas-ecosystem","publisher":"Recorded Future","context":"The article cites Recorded Future research as the basis for reporting that Golden Chickens, tracked as TAG-195, has resurfaced with four new malware families.","category":"","primary":false},{"title":"ClickFix Campaigns Targeting Windows and macOS","url":"https://www.recordedfuture.com/research/clickfix-campaigns-targeting-windows-and-macos","publisher":"Recorded Future","context":"The article references this Recorded Future research when describing TAG-127 deploying TinyEgg through ClickFix-style social engineering campaigns.","category":"","primary":false}],"body":"\u003cp\u003eThe threat actors behind the Golden Chickens malware-as-a-service ecosystem have resurfaced with four new malware families, according to Recorded Future’s Insikt Group, which tracks the group as TAG-195. The families are TinyEgg, ChonkyChicken, a modularized variant of ChonkyChicken, and ChromEggscalator. Recorded Future said the tools show an architectural transition and evolution in the TAG-195 malware-as-a-service ecosystem.\u003c/p\u003e\n\n\u003cp\u003eThe article says Golden Chickens, also known as Venom Spider, is actively refining its arsenal despite extensive public disclosures about its operations. TAG-195’s tooling has been linked to TAG-127 as an operator and customer, and TAG-127 has been observed deploying TinyEgg through ClickFix-style social engineering campaigns. The group’s tools have also been used by other cybercrime groups including Cobalt Group, Evilnum, and FIN6.\u003c/p\u003e\n\n\u003cp\u003eTinyEgg is described as a lightweight initial-access backdoor that provides host profiling, interactive shell access, and persistence management, while ChonkyChicken adds browser credential theft, Chrome DevTools Protocol session control, remote execution, reconnaissance, and surveillance. The modularized ChonkyChicken variant can fetch 14 capability modules from command-and-control infrastructure as needed, including modules for screen capture, command execution, keylogging, audio capture, browser theft through ChromEggscalator, and persistence management. Recorded Future said this modular shift likely reduces the base implant’s static detection exposure and supports selective capability delivery in the malware-as-a-service model.\u003c/p\u003e\n"},{"n":3,"title":"ChatGPT AgentForger Flaw Could Deploy Rogue Workspace Agents via a Phishing Link","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/chatgpt-agentforger-flaw-could-deploy.html","time":"11:53","priority":"SHOULD READ","score":85,"tldr":"Researchers disclosed AgentForger, a now-fixed ChatGPT Workspace Agents flaw that could let a phishing link silently create and deploy a rogue AI agent inside a victim’s organization using their existing app connectors. The agent could persist, run scheduled tasks, access sensitive workspace data, and act on attacker instructions without further user interaction.","briefOverview":"\u003cp\u003eCybersecurity researchers at Zenity Labs disclosed a critical vulnerability in OpenAI\u0026rsquo;s ChatGPT Workspace Agents called AgentForger. The flaw could have allowed a single phishing link to stealthily build, authorize, and deploy an attacker-controlled autonomous AI agent inside a victim\u0026rsquo;s organization. OpenAI addressed the issue on June 8, 2026, following responsible disclosure.\u003c/p\u003e\n\n\u003cp\u003eZenity said the attack worked because ChatGPT Agent Builder accepted an initialization state through URL parameters, including an agent template and an initial prompt. When the page loaded, the initial_assistant_prompt value was automatically submitted and executed, so an instruction embedded in a URL could become the first command the Builder acted on. The attack required a logged-in ChatGPT user with access to Workspace Agents and at least one authorized connector such as Outlook, Gmail, Google Calendar, Google Drive, Slack, or Teams.\u003c/p\u003e\n\n\u003cp\u003eThe malicious prompt could create an agent from the chief-of-staff template, attach available connectors, set them to \u0026ldquo;Never ask,\u0026rdquo; publish the agent, schedule it to run hourly, and invoke Preview Mode to run immediately. Zenity said the forged agent could receive tasks through emails with subjects beginning with \u0026ldquo;TASK,\u0026rdquo; execute those tasks, and report results to the attacker\u0026rsquo;s email address. The article says such an agent could conduct reconnaissance, harvest sensitive documents from cloud storage services, steal passwords mentioned in Slack messages, and impersonate the victim to send phishing links on Teams.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zenity Labs disclosed a critical vulnerability called AgentForger in OpenAI's ChatGPT Workspace Agents that could allow a phishing link to build, authorize, and deploy an attacker-controlled AI agent inside a victim's organization.","OpenAI addressed the AgentForger issue on June 8, 2026, following responsible disclosure.","The attack required a victim who was logged into ChatGPT, had access to Workspace Agents, and had at least one already authorized connector such as Outlook, Gmail, Google Calendar, Google Drive, Slack, or Teams.","The malicious link could cause ChatGPT Agent Builder to automatically execute a prompt from the URL, attach available connectors, disable approval prompts, publish the agent, schedule it to run hourly, and invoke Preview Mode to run immediately.","Zenity said the forged agent could persist inside the organization, receive tasks through emails with subjects beginning with “TASK,” access sensitive data through connected apps, report results to the attacker, and send phishing links through Teams as the victim."],"insights":["The flaw was not limited to creating an unwanted agent; Zenity said the agent could also turn off approval prompts for existing connectors, making previously authorized workplace integrations a major part of the risk.","Preview Mode became an execution path in the attack because it ran the newly created agent against the victim’s connected accounts rather than acting only as a harmless test or dry run.","The forged agent did not require the victim to keep the Builder tab open or click additional links, because scheduled runs and attacker-sent “TASK” emails could keep it operating after the initial click.","The attack used normal workplace tools such as email and Teams as both command channels and delivery paths, allowing the rogue agent to receive assignments and potentially spread phishing links while impersonating the victim.","Zenity framed AgentForger as an “agent trust failure,” where the platform treated agent creation, connector approvals, scheduling, and operation as if they were all intentional actions by the user."],"referencedReports":[{"title":"AgentForger Part 1: ChatGPT Cross-Site Agent Forgery","url":"https://labs.zenity.io/p/agentforger-part-1-chatgpt-cross-site-agent-forgery","publisher":"Zenity Labs","context":"The article cites this as part of Zenity Labs' two-part report disclosing the AgentForger flaw in ChatGPT Workspace Agents.","category":"","primary":false},{"title":"AgentForger Part 2: The Autonomous Insider","url":"https://labs.zenity.io/p/agentforger-part-2-the-autonomous-insider","publisher":"Zenity Labs","context":"The article cites this second Zenity Labs report for details on how the forged agent could persist and receive attacker instructions through the victim's mailbox.","category":"","primary":false},{"title":"Why AI Security Research Needs to Move Out of the Lab and Into the Wild","url":"https://labs.zenity.io/p/why-ai-security-research-needs-to-move-out-of-the-lab-and-into-the-wild","publisher":"Zenity Labs","context":"The article references this Zenity Labs work as prior research on real-world abuse of exposed and vulnerable AI infrastructure.","category":"","primary":false},{"title":"Scanning for AI Live Campaigns: Mapping the Internet's Exposed LLM Backends","url":"https://labs.zenity.io/p/scanning-for-ai-live-campaigns-mapping-the-internet-s-exposed-llm-backends","publisher":"Zenity Labs","context":"The article references this Zenity Labs research in connection with threat actors exploiting exposed Ollama endpoints and AI infrastructure.","category":"","primary":false},{"title":"Bring Your Own Agent: Hijacking Exposed AI Backends to Power Offensive Operations","url":"https://labs.zenity.io/p/bring-your-own-agent-hijacking-exposed-ai-backends-to-power-offensive-operations","publisher":"Zenity Labs","context":"The article cites this Zenity Labs research as related work on abusing exposed AI backends for offensive operations.","category":"","primary":false},{"title":"Threat Actors Are Trying to Turn LiteLLM's Connection Test Into a Key Exfiltration Channel","url":"https://labs.zenity.io/p/threat-actors-are-trying-to-turn-litellm-s-connection-test-into-a-key-exfiltration-channel","publisher":"Zenity Labs","context":"The article references this Zenity Labs analysis while discussing exploitation of CVE-2024-6587 in LiteLLM.","category":"","primary":false},{"title":"Threat Actors Are Trying to Use LiteLLM's Guardrail Tester to Run Code as Root","url":"https://labs.zenity.io/p/threat-actors-are-trying-to-use-litellm-s-guardrail-tester-to-run-code-as-root","publisher":"Zenity Labs","context":"The article references this Zenity Labs analysis while discussing exploitation of CVE-2026-40217 in LiteLLM.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers at Zenity Labs disclosed a critical vulnerability in OpenAI\u0026rsquo;s ChatGPT Workspace Agents called AgentForger. The flaw could have allowed a single phishing link to stealthily build, authorize, and deploy an attacker-controlled autonomous AI agent inside a victim\u0026rsquo;s organization. OpenAI addressed the issue on June 8, 2026, following responsible disclosure.\u003c/p\u003e\n\n\u003cp\u003eZenity said the attack worked because ChatGPT Agent Builder accepted an initialization state through URL parameters, including an agent template and an initial prompt. When the page loaded, the initial_assistant_prompt value was automatically submitted and executed, so an instruction embedded in a URL could become the first command the Builder acted on. The attack required a logged-in ChatGPT user with access to Workspace Agents and at least one authorized connector such as Outlook, Gmail, Google Calendar, Google Drive, Slack, or Teams.\u003c/p\u003e\n\n\u003cp\u003eThe malicious prompt could create an agent from the chief-of-staff template, attach available connectors, set them to \u0026ldquo;Never ask,\u0026rdquo; publish the agent, schedule it to run hourly, and invoke Preview Mode to run immediately. Zenity said the forged agent could receive tasks through emails with subjects beginning with \u0026ldquo;TASK,\u0026rdquo; execute those tasks, and report results to the attacker\u0026rsquo;s email address. The article says such an agent could conduct reconnaissance, harvest sensitive documents from cloud storage services, steal passwords mentioned in Slack messages, and impersonate the victim to send phishing links on Teams.\u003c/p\u003e\n"},{"n":5,"title":"Bing Images Flaws Let Crafted SVGs Run Commands as SYSTEM on Microsoft's Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/bing-images-flaws-let-crafted-svgs-run.html","time":"11:45","priority":"SHOULD READ","score":84,"tldr":"Researchers found that crafted SVG images submitted to Bing’s image search could trigger ImageMagick delegate command execution, running commands as SYSTEM on Windows workers and root on Linux servers. Microsoft fixed the two critical server-side flaws, but the case highlights the danger of letting untrusted image processing reach shell-enabled delegates or outbound network access.","briefOverview":"\u003cp\u003eXBOW found that crafted SVG files submitted to Bing’s image search could run commands on Microsoft’s production image-processing workers. The commands ran as \u003ccode\u003eNT AUTHORITY\\SYSTEM\u003c/code\u003e on Windows workers and as root on Linux machines in the same fleet. Microsoft assigned two critical CVEs, CVE-2026-32194 and CVE-2026-32191, rated both 9.8 on the CVSS scale, and fixed them server-side before the March advisories were published.\u003c/p\u003e\n\n\u003cp\u003eThe two unauthenticated routes were the public Search by Image upload to \u003ccode\u003e/images/kblob\u003c/code\u003e using the \u003ccode\u003eimageBin\u003c/code\u003e field and a crawler route where \u003ccode\u003ebingbot/2.0\u003c/code\u003e fetched an SVG supplied through the \u003ccode\u003eimgurl\u003c/code\u003e parameter. The exploit worked because the image-processing path still had a delegate-enabled layer, and an SVG image reference beginning with a pipe character was treated as a shell command rather than a filename. XBOW used benign read-only commands and out-of-band callbacks to prove execution, while the frontend could return an error even though the backend worker executed the payload.\u003c/p\u003e\n\n\u003cp\u003eThe article says the issue reflects a broader risk in image-processing stacks that pass untrusted uploads or fetched URLs through ImageMagick or compatible tools. It recommends denying delegates in \u003ccode\u003epolicy.xml\u003c/code\u003e, reducing accepted formats such as SVG, MVG, and EPS, reviewing \u003ccode\u003edelegates.xml\u003c/code\u003e, sandboxing conversion, lowering worker privileges, blocking outbound network access, and allowlisting server-side fetch destinations. It also compares the bug class to ImageTragick, noting that converter components can become part of the attack surface when they parse attacker-controlled content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["XBOW found that a crafted SVG submitted to Bing’s image search could run commands as NT AUTHORITY\\SYSTEM on Microsoft’s Windows image-processing workers and as root on Linux workers.","Microsoft assigned CVE-2026-32194 and CVE-2026-32191 to the two flaws, rated both 9.8 on the CVSS scale, and fixed them server-side before the March advisories were published.","The two unauthenticated routes were the public Search by Image upload using the imageBin field to /images/kblob and the crawler route using the imgurl parameter, which bingbot/2.0 fetched into the same processing pipeline.","The exploit path involved an SVG image reference beginning with a pipe character that reached a delegate-enabled ImageMagick-compatible layer and was treated as a shell command rather than a filename.","The article recommends denying ImageMagick delegates in policy.xml, reducing accepted formats, reviewing delegates.xml, sandboxing conversion workers, reducing privileges, blocking outbound network access, and allowlisting server-side fetch destinations."],"insights":["The frontend could return an error while the backend worker still fetched, parsed, and executed the submitted content, so a failed user-facing request did not mean the processing path was safe.","Blocking outbound network access from image-processing workers would have limited the researchers’ ability to prove command execution, because the proof relied on curling command output back to a collector they controlled.","Some ImageMagick pseudo-protocols behaved safely or failed in XBOW’s probes, but the exploitable path was specifically an image reference inside the SVG that reached a delegate-enabled layer.","The same bug shape as ImageTragick resurfaced because the converter was treated as plumbing rather than as an attacker-controlled parser in the application’s attack surface.","Microsoft’s CVE records still listed no public disclosure on July 24 even though XBOW had published exploit mechanics on July 23 after remediation had landed."],"referencedReports":[{"title":"Bing Images RCE Vulnerabilities","url":"https://xbow.com/blog/bing-images-rce-vulnerabilities","publisher":"XBOW","context":"The article says XBOW published the exploit mechanics after Microsoft remediated the Bing image-processing flaws.","category":"","primary":false},{"title":"CVE-2026-32194","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-32194","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for the Search by Image upload command injection flaw.","category":"","primary":false},{"title":"CVE-2026-32191","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-32191","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for the crawler-route OS command injection flaw.","category":"","primary":false},{"title":"ImageMagick Security Policy","url":"https://imagemagick.org/security-policy/","publisher":"ImageMagick","context":"The article references ImageMagick’s own guidance when recommending that untrusted image-processing workers deny delegates in policy.xml.","category":"","primary":false},{"title":"ImageTragick","url":"https://access.redhat.com/security/vulnerabilities/ImageTragick","publisher":"Red Hat","context":"The article links to Red Hat’s ImageTragick page as a prior example of the same delegate command injection class of failure.","category":"","primary":false}],"body":"\u003cp\u003eXBOW found that crafted SVG files submitted to Bing’s image search could run commands on Microsoft’s production image-processing workers. The commands ran as \u003ccode\u003eNT AUTHORITY\\SYSTEM\u003c/code\u003e on Windows workers and as root on Linux machines in the same fleet. Microsoft assigned two critical CVEs, CVE-2026-32194 and CVE-2026-32191, rated both 9.8 on the CVSS scale, and fixed them server-side before the March advisories were published.\u003c/p\u003e\n\n\u003cp\u003eThe two unauthenticated routes were the public Search by Image upload to \u003ccode\u003e/images/kblob\u003c/code\u003e using the \u003ccode\u003eimageBin\u003c/code\u003e field and a crawler route where \u003ccode\u003ebingbot/2.0\u003c/code\u003e fetched an SVG supplied through the \u003ccode\u003eimgurl\u003c/code\u003e parameter. The exploit worked because the image-processing path still had a delegate-enabled layer, and an SVG image reference beginning with a pipe character was treated as a shell command rather than a filename. XBOW used benign read-only commands and out-of-band callbacks to prove execution, while the frontend could return an error even though the backend worker executed the payload.\u003c/p\u003e\n\n\u003cp\u003eThe article says the issue reflects a broader risk in image-processing stacks that pass untrusted uploads or fetched URLs through ImageMagick or compatible tools. It recommends denying delegates in \u003ccode\u003epolicy.xml\u003c/code\u003e, reducing accepted formats such as SVG, MVG, and EPS, reviewing \u003ccode\u003edelegates.xml\u003c/code\u003e, sandboxing conversion, lowering worker privileges, blocking outbound network access, and allowlisting server-side fetch destinations. It also compares the bug class to ImageTragick, noting that converter components can become part of the attack surface when they parse attacker-controlled content.\u003c/p\u003e\n"},{"n":1,"title":"Europol flags 4,340 URLs for removal in 'The Com' crackdown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/europol-flags-4-340-urls-for-removal-in-the-com-crackdown/","time":"12:56","priority":"SHOULD READ","score":82,"tldr":"Europol and investigators from nine countries flagged 4,340 URLs for removal in a crackdown on The Com, a decentralized extremist network linked to violent content, child exploitation, self-harm coercion, and cybercrime. The action builds on Project Compass, which has already led to 30 arrests and identified 179 suspects tied to the network.","briefOverview":"\u003cp\u003eEuropol flagged 4,340 URLs for removal during a multi-week operation targeting online content linked to “The Com,” a loosely organized network of nihilistic violent extremist groups. Investigators from Belgium, Finland, Hungary, Ireland, Luxembourg, the Netherlands, Portugal, Spain, and Sweden took part in the Referral Action Days between June and July 2026. The action was organized by Europol’s EU Internet Referral Unit and Spain’s Intelligence Centre against Terrorism and Organised Crime, and it ties into the European Commission’s ProtectEU counterterrorism agenda.\u003c/p\u003e\n\n\u003cp\u003eEuropol said the operation aimed to disrupt The Com’s online ecosystem, limit the spread of its content, and generate new investigative leads. The content referenced included violent videos and images depicting self-harm, suicide, child sexual abuse material, animal cruelty, violent attacks, arson, and “manhunt” street attacks. Europol also said The Com produces manuals or guides on grooming, murder, improvised explosives, ideological viewpoints, doxing, and swatting.\u003c/p\u003e\n\n\u003cp\u003eThe action builds on Project Compass, a yearlong Europol-led operation launched in January 2025 that has involved law enforcement from 28 countries. That broader effort has resulted in 30 arrests and identified 179 suspects and 62 victims tied to The Com. Europol describes The Com as a decentralized network whose affiliated groups recruit and groom victims through social media, messaging apps, and gaming platforms, coercing them into self-harm, violence, and the production of child sexual abuse material, often through extortion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Europol flagged 4,340 URLs for removal during a multi-week operation targeting online content linked to The Com, a loosely organized network of nihilistic violent extremist groups.","Investigators from Belgium, Finland, Hungary, Ireland, Luxembourg, the Netherlands, Portugal, Spain, and Sweden took part in Europol’s Referral Action Days between June and July 2026.","Europol said The Com content included violent videos and images depicting self-harm, suicide, child sexual abuse material, animal cruelty, violent attacks, arson, and manuals on grooming, murder, improvised explosives, doxing, and swatting.","Project Compass, a yearlong Europol-led operation launched in January 2025, has resulted in 30 arrests and identified 179 suspects and 62 victims tied to The Com.","Europol describes The Com as a decentralized network whose affiliated groups recruit and groom victims through social media, messaging apps, and gaming platforms, coercing them into self-harm, violence, and production of child sexual abuse material."],"insights":["Europol highlighted that The Com uses coded language and emojis that adults may struggle to understand, making its harmful content harder for parents, guardians, and investigators to recognize quickly.","The Com spans both online and offline harm, with Europol describing subgroups tied to network intrusions and ransomware as well as property damage, terrorism, sextortion, and coercion of minors.","The operation aimed not only to remove harmful content but also to generate new investigative leads, showing that URL referrals were used as part of a broader law enforcement intelligence effort.","The Com’s recruitment path relies on public platforms first and then moves potential members and victims into private forums and chat rooms, where Europol says radicalisation and victimisation occur."],"referencedReports":[{"title":"The rise of online cult communities dedicated to extremely violent child abuse","url":"https://www.europol.europa.eu/cms/sites/default/files/documents/IN_The_rise_of_online_cult_communities_dedicated_to_extremely_violent_child_abuse.pdf","publisher":"Europol","context":"The article says Europol published this notification in January 2025 about online cult communities specifically targeting young people.","category":"","primary":false}],"body":"\u003cp\u003eEuropol flagged 4,340 URLs for removal during a multi-week operation targeting online content linked to “The Com,” a loosely organized network of nihilistic violent extremist groups. Investigators from Belgium, Finland, Hungary, Ireland, Luxembourg, the Netherlands, Portugal, Spain, and Sweden took part in the Referral Action Days between June and July 2026. The action was organized by Europol’s EU Internet Referral Unit and Spain’s Intelligence Centre against Terrorism and Organised Crime, and it ties into the European Commission’s ProtectEU counterterrorism agenda.\u003c/p\u003e\n\n\u003cp\u003eEuropol said the operation aimed to disrupt The Com’s online ecosystem, limit the spread of its content, and generate new investigative leads. The content referenced included violent videos and images depicting self-harm, suicide, child sexual abuse material, animal cruelty, violent attacks, arson, and “manhunt” street attacks. Europol also said The Com produces manuals or guides on grooming, murder, improvised explosives, ideological viewpoints, doxing, and swatting.\u003c/p\u003e\n\n\u003cp\u003eThe action builds on Project Compass, a yearlong Europol-led operation launched in January 2025 that has involved law enforcement from 28 countries. That broader effort has resulted in 30 arrests and identified 179 suspects and 62 victims tied to The Com. Europol describes The Com as a decentralized network whose affiliated groups recruit and groom victims through social media, messaging apps, and gaming platforms, coercing them into self-harm, violence, and the production of child sexual abuse material, often through extortion.\u003c/p\u003e\n"},{"n":8,"title":"SPF, DKIM, and DMARC Passed. The File Was Malware.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/compromised-vendor-account-malicious-excel-attachment","time":"11:00","priority":"SHOULD READ","score":80,"tldr":"A malicious spreadsheet was delivered from a genuinely compromised Microsoft 365 vendor mailbox, so SPF, DKIM, DMARC, and other authentication checks all passed. The key takeaway is that email authentication proves sender origin, not attachment safety, so trusted vendor emails still need file scanning and behavioral detection.","briefOverview":"\u003cp\u003eA hospitality and resort operator’s CEO received a short email from a real audiovisual technology vendor that had been in business since 2004. The message said “good morning,” asked the recipient to see the attachment for review, and included an embedded image of a corporate signature block. The vendor’s Microsoft 365 mailbox had been compromised, and the attached spreadsheet was flagged as malicious by file scanning.\u003c/p\u003e\n\n\u003cp\u003eEvery authentication check passed, including SPF, DKIM, DMARC, ARC, and Microsoft’s \u003ccode\u003ecompauth=pass reason=100\u003c/code\u003e, because the email genuinely came from the vendor’s legitimate Microsoft 365 tenant rather than a spoofed domain. The article emphasizes that these checks confirm who sent a message but do not determine whether an attachment is safe. The From and To headers both named the vendor’s own mailbox, while the real recipients were delivered by BCC, which the article describes as a classic sign of a compromised account blasting its contact list.\u003c/p\u003e\n\n\u003cp\u003eThe attack is mapped to MITRE techniques Spearphishing Attachment, User Execution of a Malicious File, and Valid Accounts. Themis evaluated signals that authentication does not cover, including a first-time sender reaching a VIP mailbox, an image-based signature, and the malicious file-scan verdict. It flagged the message at 90 percent confidence and quarantined every copy across the affected mailboxes before anyone opened the file.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A hospitality and resort operator’s CEO received a short “please see attached” email from a real audiovisual vendor whose Microsoft 365 mailbox had been compromised.","SPF, DKIM, DMARC, ARC, and Microsoft compauth all passed because the message genuinely originated from the vendor’s legitimate Microsoft 365 tenant rather than a spoofed domain.","The email contained a roughly 138 KB spreadsheet named after the sending company, and file scanning returned a malicious verdict on the attachment.","The From and To headers both named the vendor’s own mailbox, while the real recipients were delivered by BCC, which the article describes as a classic sign of a compromised account blasting its contact list.","Themis flagged the message at 90 percent confidence and quarantined every copy across affected mailboxes before anyone opened the file."],"insights":["A fully authenticated email should be treated as proof of origin only, because the article shows that SPF, DKIM, DMARC, ARC, and Microsoft compauth can all pass while the attachment is still malicious.","Vendor email compromise can turn a supplier’s long-standing good reputation into an attack path, since reputation-based filtering is designed to trust exactly the kind of sender used in this case.","A first-time message from a vendor account to a VIP recipient is a meaningful risk signal even when the wording is bland and there are no links, urgency, or payment requests.","Self-addressed messages with real recipients hidden in BCC can indicate a compromised mailbox sending broadly to its contact list rather than a normal one-to-one business exchange.","Attachment scanning is decisive in attacks where there is no malicious link or suspicious sending domain to evaluate, because the file itself is the entire delivery mechanism."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on malware-laden messages in the gateway attack mix and the share of breaches involving the human element.","category":"","primary":false},{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report to support the claim that business-context email attacks, including vendor and partner compromise, remain among the costliest categories organizations face.","category":"","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance to emphasize that authentication is a control against spoofing, not a clearance for email content.","category":"","primary":false}],"body":"\u003cp\u003eA hospitality and resort operator’s CEO received a short email from a real audiovisual technology vendor that had been in business since 2004. The message said “good morning,” asked the recipient to see the attachment for review, and included an embedded image of a corporate signature block. The vendor’s Microsoft 365 mailbox had been compromised, and the attached spreadsheet was flagged as malicious by file scanning.\u003c/p\u003e\n\n\u003cp\u003eEvery authentication check passed, including SPF, DKIM, DMARC, ARC, and Microsoft’s \u003ccode\u003ecompauth=pass reason=100\u003c/code\u003e, because the email genuinely came from the vendor’s legitimate Microsoft 365 tenant rather than a spoofed domain. The article emphasizes that these checks confirm who sent a message but do not determine whether an attachment is safe. The From and To headers both named the vendor’s own mailbox, while the real recipients were delivered by BCC, which the article describes as a classic sign of a compromised account blasting its contact list.\u003c/p\u003e\n\n\u003cp\u003eThe attack is mapped to MITRE techniques Spearphishing Attachment, User Execution of a Malicious File, and Valid Accounts. Themis evaluated signals that authentication does not cover, including a first-time sender reaching a VIP mailbox, an image-based signature, and the malicious file-scan verdict. It flagged the message at 90 percent confidence and quarantined every copy across the affected mailboxes before anyone opened the file.\u003c/p\u003e\n"},{"n":2,"title":"Man gets six years for hacking 750 women's Snapchat accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/man-gets-six-years-for-hacking-750-womens-snapchat-accounts/","time":"11:17","priority":"MAY READ","score":68,"tldr":"An Illinois man was sentenced to more than six years in prison for phishing access codes to hack over 750 women’s Snapchat accounts, steal nude images, and trade or sell them online. Investigators also found he collected and distributed child sexual abuse material.","briefOverview":"\u003cp\u003eAn Illinois man, 26-year-old Kyle Svara, was sentenced to 76 months in prison and three years of supervised release for hacking the Snapchat accounts of over 750 women. He admitted to using social engineering tactics to phish Snapchat access codes from victims, then stealing nude photos that he later traded or sold online. Between May 2020 and February 2021, he targeted more than 4,500 victims while posing as a Snap Inc representative and using anonymized phone numbers.\u003c/p\u003e\n\n\u003cp\u003eAfter obtaining credentials, Svara accessed approximately 517 women’s Snapchat accounts without permission to download nude or semi-nude photos. He also activated two-factor authentication to lock victims out of the compromised accounts. Investigators found approximately 530 images and 600 videos depicting child sexual abuse material in his Mega account, and the Justice Department said he collected, distributed, and solicited CSAM.\u003c/p\u003e\n\n\u003cp\u003eCourt documents said Svara advertised his services online, offering to get into girls’ Snapchat accounts and asking potential clients to contact him through Kik. Former Northeastern University track and field coach Steve Waithe hired Svara to hack Snapchat accounts belonging to students and members of women’s athletic teams, and Waithe was later sentenced to five years in prison for cyber fraud, cyberstalking, and sextortion. Svara also independently targeted women in Plainfield, Illinois, including neighbors, family friends, classmates, and personal friends, as well as students at Colby College in Waterville, Maine.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kyle Svara, a 26-year-old Illinois man, was sentenced to 76 months in prison and three years of supervised release for hacking the Snapchat accounts of over 750 women to steal nude photos that he later traded or sold online.","Between May 2020 and February 2021, Svara targeted more than 4,500 victims by posing as a Snap Inc representative and using anonymized phone numbers to phish Snapchat access codes.","After stealing credentials, Svara accessed approximately 517 women’s Snapchat accounts without permission, downloaded nude or semi-nude photos, and activated two-factor authentication to lock victims out of compromised accounts.","Investigators found approximately 530 images and 600 videos depicting child sexual abuse material in Svara’s Mega account, and the Justice Department said he collected, distributed, and solicited CSAM.","Former Northeastern University track and field coach Steve Waithe hired Svara to hack Snapchat accounts of students and women’s sports team members, and Waithe was later sentenced to five years in prison for cyber fraud, cyberstalking, and sextortion."],"insights":["Svara did not only steal content after gaining access; he also enabled two-factor authentication to lock victims out, showing how an account protection feature can be misused after an account is compromised.","The scheme combined impersonation of Snap Inc with anonymized phone numbers, indicating that victims were deceived through direct trust-based messages rather than a purely technical break-in.","Svara advertised hacking as a paid service and was hired by Steve Waithe, showing that stolen account access was being commercialized and used by others to target specific women.","The victims were not limited to strangers online; Svara also targeted neighbors, family friends, classmates, and personal friends in Plainfield, Illinois, as well as students at specific colleges."],"referencedReports":[],"body":"\u003cp\u003eAn Illinois man, 26-year-old Kyle Svara, was sentenced to 76 months in prison and three years of supervised release for hacking the Snapchat accounts of over 750 women. He admitted to using social engineering tactics to phish Snapchat access codes from victims, then stealing nude photos that he later traded or sold online. Between May 2020 and February 2021, he targeted more than 4,500 victims while posing as a Snap Inc representative and using anonymized phone numbers.\u003c/p\u003e\n\n\u003cp\u003eAfter obtaining credentials, Svara accessed approximately 517 women’s Snapchat accounts without permission to download nude or semi-nude photos. He also activated two-factor authentication to lock victims out of the compromised accounts. Investigators found approximately 530 images and 600 videos depicting child sexual abuse material in his Mega account, and the Justice Department said he collected, distributed, and solicited CSAM.\u003c/p\u003e\n\n\u003cp\u003eCourt documents said Svara advertised his services online, offering to get into girls’ Snapchat accounts and asking potential clients to contact him through Kik. Former Northeastern University track and field coach Steve Waithe hired Svara to hack Snapchat accounts belonging to students and members of women’s athletic teams, and Waithe was later sentenced to five years in prison for cyber fraud, cyberstalking, and sextortion. Svara also independently targeted women in Plainfield, Illinois, including neighbors, family friends, classmates, and personal friends, as well as students at Colby College in Waterville, Maine.\u003c/p\u003e\n"},{"n":9,"title":"The SOCI Act, explained: obligations, recent reforms, and where preemptive cyber defense fits","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/the-soci-act-obligations/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=the-soci-act-obligations","time":"12:49","priority":"MAY READ","score":55,"tldr":"Australia’s SOCI Act requires critical infrastructure operators to register assets, report cyber incidents quickly, and maintain board-approved risk programs, with obligations expanding through recent and proposed reforms. The key takeaway is that early visibility into adversary infrastructure can help regulated entities manage risk before incidents occur and better meet SOCI’s tightening expectations.","briefOverview":"\u003cp\u003eAustralia’s Security of Critical Infrastructure Act 2018, known as the SOCI Act, sets obligations for entities that own, operate, or hold a direct interest in critical infrastructure assets. The article says it applies across eleven sectors, including communications, financial services and markets, data storage or processing, defence industry, higher education and research, energy, food and grocery, healthcare and medical, space technology, transport, and water and sewerage. It explains that the law is designed around the risk that failures in one essential sector can cascade into others, such as energy disruption affecting medical supply, food, water, telecommunications, transport, and banking.\u003c/p\u003e\n\n\u003cp\u003eFor most responsible entities, the article identifies three main positive security obligations: registering the asset, reporting cyber incidents, and maintaining a written Critical Infrastructure Risk Management Program. Significant-impact critical incidents affecting asset availability must be reported to the Australian Signals Directorate within 12 hours of awareness, while lesser relevant incidents have a 72-hour reporting window. The risk management program must address cyber, physical, personnel, and supply chain hazards, be approved by the board, and be reported on annually.\u003c/p\u003e\n\n\u003cp\u003eThe article says the SOCI framework has expanded through the ERP Act 2024 and Cyber Security Act 2024, with further reforms in consultation that may extend duties to third parties such as managed service providers and tighten supply chain expectations. It argues that preemptive cyber defense fits the Act because many obligations depend on early awareness, including near real-time threat visibility for Systems of National Significance and fast incident reporting. Silent Push is presented as mapping adversary preparation across DNS, WHOIS, certificate, and hosting data and issuing Indicators of Future Attack before campaigns are launched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Australia’s Security of Critical Infrastructure Act 2018 applies to organisations that own, operate, or hold a direct interest in critical infrastructure assets across eleven sectors, including communications, financial services, data storage, defence industry, higher education, energy, food and grocery, healthcare, space technology, transport, and water.","For most responsible entities, the SOCI Act requires asset registration, cyber incident reporting within 12 hours for significant-impact critical incidents or 72 hours for lesser relevant incidents, and a board-approved Critical Infrastructure Risk Management Program covering cyber, physical, personnel, and supply chain risks.","Assets designated as Systems of National Significance carry Enhanced Cyber Security Obligations covering incident response planning, cyber security exercises, vulnerability assessments, and providing system information for a near real-time government threat picture.","The article says recent and proposed reforms have expanded the SOCI framework, including the ERP Act 2024, the Cyber Security Act 2024, and consultation on extending duties to third parties such as managed service providers and tightening supply chain expectations.","The article argues that Silent Push’s preemptive cyber defense can support SOCI obligations by mapping adversary infrastructure before attacks launch and issuing Indicators of Future Attack based on DNS, WHOIS, certificate, and hosting data."],"insights":["The article emphasizes that the SOCI Act’s incident reporting clock starts when an organisation becomes aware of an incident, not after it has determined the full scope, making early awareness operationally important.","The article highlights interconnection as a practical compliance challenge because a prolonged failure in one regulated sector, such as energy, can cascade into healthcare, food, water, telecommunications, transport, and banking.","The article frames preemptive cyber defense as useful for compliance because it targets the period when adversaries are still registering domains, aging them, setting up hosting, and staging campaigns before anything is delivered.","The article notes that proposed reforms would make supplier and partner infrastructure more relevant to SOCI compliance by pushing supply chain risk further to the front of the framework."],"referencedReports":[],"body":"\u003cp\u003eAustralia’s Security of Critical Infrastructure Act 2018, known as the SOCI Act, sets obligations for entities that own, operate, or hold a direct interest in critical infrastructure assets. The article says it applies across eleven sectors, including communications, financial services and markets, data storage or processing, defence industry, higher education and research, energy, food and grocery, healthcare and medical, space technology, transport, and water and sewerage. It explains that the law is designed around the risk that failures in one essential sector can cascade into others, such as energy disruption affecting medical supply, food, water, telecommunications, transport, and banking.\u003c/p\u003e\n\n\u003cp\u003eFor most responsible entities, the article identifies three main positive security obligations: registering the asset, reporting cyber incidents, and maintaining a written Critical Infrastructure Risk Management Program. Significant-impact critical incidents affecting asset availability must be reported to the Australian Signals Directorate within 12 hours of awareness, while lesser relevant incidents have a 72-hour reporting window. The risk management program must address cyber, physical, personnel, and supply chain hazards, be approved by the board, and be reported on annually.\u003c/p\u003e\n\n\u003cp\u003eThe article says the SOCI framework has expanded through the ERP Act 2024 and Cyber Security Act 2024, with further reforms in consultation that may extend duties to third parties such as managed service providers and tighten supply chain expectations. It argues that preemptive cyber defense fits the Act because many obligations depend on early awareness, including near real-time threat visibility for Systems of National Significance and fast incident reporting. Silent Push is presented as mapping adversary preparation across DNS, WHOIS, certificate, and hosting data and issuing Indicators of Future Attack before campaigns are launched.\u003c/p\u003e\n"},{"n":11,"title":"Benchmarking report finds healthcare CISOs prioritize IAM, resilience as AI threats accelerate","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/benchmarking-report-finds-healthcare-cisos-prioritize-iam-resilience-as-ai-threats-accelerate/","time":"12:46","priority":"MAY READ","score":55,"tldr":"Health-ISAC’s first CISO Benchmarking Report finds healthcare security leaders are prioritizing identity and access management and resilience as AI-amplified impersonation threats increasingly target help desks, finance teams, and clinical operations.","briefOverview":"\u003cp\u003eHealth-ISAC published its first CISO Benchmarking Report, based on survey responses from 76 chief information security officers across the healthcare sector. Respondents represented healthcare providers, payers, pharmaceutical companies, medical device manufacturers, and global operations. The report describes healthcare CISOs as operating in an increasingly complex threat environment where cyberattacks can disrupt clinical care, jeopardize patient safety, and erode trust in healthcare institutions.\u003c/p\u003e\n\n\u003cp\u003eThe report offers a snapshot of cybersecurity priorities, leadership responsibilities, budgets, workforce challenges, framework adoption, and the growing role of artificial intelligence in healthcare. Health-ISAC Chief Security Officer Errol Weiss said AI-amplified impersonation beyond email is still underestimated in the sector. He cited repeated incidents involving voice, video, and urgent workflow manipulation aimed at help desks, call centers, finance teams, and clinical operations.\u003c/p\u003e\n\n\u003cp\u003eWeiss said the risk is not only that someone clicks a link, but that someone is convincingly pressured into resetting MFA, changing payment details, or granting access. He described these interactions as authentic-feeling, personalized, and time-sensitive. The article directs readers to a related Industrial Cyber article for more details on the benchmarking report.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC released its first CISO Benchmarking Report based on survey responses from 76 healthcare chief information security officers.","The report found that healthcare CISOs are operating in an increasingly complex threat environment where cyberattacks can disrupt clinical care, jeopardize patient safety, and erode trust in healthcare institutions.","Survey respondents represented healthcare providers, payers, pharmaceutical companies, medical device manufacturers, and global operations.","The report covers cybersecurity priorities, leadership responsibilities, budgets, workforce challenges, framework adoption, and the growing role of artificial intelligence in the healthcare sector.","Health-ISAC Chief Security Officer Errol Weiss said AI-amplified impersonation beyond email is still underestimated in healthcare, including voice, video, and urgent workflow manipulation targeting help desks, call centers, finance teams, and clinical operations."],"insights":["The article highlights that AI-enabled impersonation risk in healthcare extends beyond email scams to real-time voice and video interactions that can pressure staff into taking harmful actions.","Help desks, call centers, finance teams, and clinical operations are presented as notable targets, showing that AI-driven social manipulation is not limited to traditional IT users.","The examples given by Errol Weiss point to specific high-risk actions healthcare organizations may need to guard against: resetting MFA, changing payment details, and granting access under urgent pressure.","The report frames cyber resilience as directly tied to patient safety and trust, indicating that healthcare cybersecurity priorities are being evaluated in terms of clinical and institutional impact, not only technical loss."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published its first CISO Benchmarking Report, based on survey responses from 76 chief information security officers across the healthcare sector. Respondents represented healthcare providers, payers, pharmaceutical companies, medical device manufacturers, and global operations. The report describes healthcare CISOs as operating in an increasingly complex threat environment where cyberattacks can disrupt clinical care, jeopardize patient safety, and erode trust in healthcare institutions.\u003c/p\u003e\n\n\u003cp\u003eThe report offers a snapshot of cybersecurity priorities, leadership responsibilities, budgets, workforce challenges, framework adoption, and the growing role of artificial intelligence in healthcare. Health-ISAC Chief Security Officer Errol Weiss said AI-amplified impersonation beyond email is still underestimated in the sector. He cited repeated incidents involving voice, video, and urgent workflow manipulation aimed at help desks, call centers, finance teams, and clinical operations.\u003c/p\u003e\n\n\u003cp\u003eWeiss said the risk is not only that someone clicks a link, but that someone is convincingly pressured into resetting MFA, changing payment details, or granting access. He described these interactions as authentic-feeling, personalized, and time-sensitive. The article directs readers to a related Industrial Cyber article for more details on the benchmarking report.\u003c/p\u003e\n"},{"n":7,"title":"Seeing AI Agents Is Not Enough. Security Teams Must Enforce What They Can Do","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/seeing-ai-agents-is-not-enough-security.html","time":"11:30","priority":"MAY READ","score":45,"tldr":"Security teams should not stop at discovering AI agents; they need identity-centric, context-aware enforcement that controls what each agent can do based on ownership, permissions, usage, and intent. The key shift is from static inventories to consistent rules that govern agent actions across platforms.","briefOverview":"\u003cp\u003eThe article argues that AI agent security is moving from adoption and visibility toward control, and that security teams must enforce what AI agents are allowed to do. It says discovery is a necessary first step because agents are appearing across SaaS platforms, developer environments, cloud workflows, customer support systems, productivity tools, and internal applications. However, discovery alone is not enough because AI agents can reason, plan, call tools, invoke APIs, access data, and take action without a human in the loop.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that traditional static access models do not fit AI agents well because agents are defined by goals rather than fixed workflows. It says security teams need to understand agent ownership, consumers, identities, intent, access, usage, origin, and lifecycle before they can define meaningful controls. Without this correlation, enforcement becomes guesswork; with it, teams can create rules that reflect how agents actually operate.\u003c/p\u003e\n\n\u003cp\u003eThe article calls for an identity-centric, context-aware, and platform-agnostic control plane for agentic AI. Such a control plane should discover agents, correlate them with context such as owners and permissions, and enforce rules governing what agents can do, when they can do it, and how access should change as conditions change. The article concludes that organizations should move from asking which agents exist to asking which agents can take which actions, under which conditions, and who is accountable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI agent security is moving from adoption to visibility and then to control, with enforcement of least privilege becoming the central challenge.","Discovery alone is insufficient because AI agents can reason, plan, call tools, invoke APIs, access data, and take action without a human in the loop.","Security teams need to correlate agent ownership, consumers, identities, intent, access, usage, origin, and lifecycle before they can define meaningful controls.","The article says enforcement should govern what agents can do before, during, and after actions, rather than only remediating risks after they are detected.","The article calls for an identity-centric, context-aware, and platform-agnostic control plane that can discover, understand, and enforce rules for AI agents across enterprise environments."],"insights":["An AI agent inventory can create a false sense of control if it is not connected to enforcement, because it may show that an agent exists without proving its access, behavior, owner, or lifecycle state are appropriate.","The article treats intent as a separate control dimension from identity and permissions, because two agents with similar access can pose different risks depending on what each is trying to accomplish.","The article argues that agent controls cannot be managed one platform at a time because enterprises will use SaaS-native agents, internal frameworks, cloud services, developer tools, and other agent platforms at the same time.","The article frames AI agents as actors with authority rather than ordinary applications with chatbot interfaces, because they can write code, manage infrastructure, move data, update systems, and execute workflows."],"referencedReports":[{"title":"Careful adoption of agentic AI services","url":"https://www.cyber.gov.au/business-government/secure-design/artificial-intelligence/careful-adoption-of-agentic-ai-services","publisher":"Australian Cyber Security Centre","context":"The article cites this guidance to support its point that agentic AI creates privilege, authentication, accountability, design, and behavioral risks that security teams must address.","category":"","primary":false},{"title":"OWASP Top 10 for Agentic Applications","url":"https://genai.owasp.org/2025/12/09/owasp-top-10-for-agentic-applications-the-benchmark-for-agentic-security-in-the-age-of-autonomous-ai/","publisher":"OWASP","context":"The article references this work as highlighting risks such as identity and privilege abuse, tool misuse, insecure inter-agent communication, cascading failures, and rogue agents.","category":"","primary":false}],"body":"\u003cp\u003eThe article argues that AI agent security is moving from adoption and visibility toward control, and that security teams must enforce what AI agents are allowed to do. It says discovery is a necessary first step because agents are appearing across SaaS platforms, developer environments, cloud workflows, customer support systems, productivity tools, and internal applications. However, discovery alone is not enough because AI agents can reason, plan, call tools, invoke APIs, access data, and take action without a human in the loop.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that traditional static access models do not fit AI agents well because agents are defined by goals rather than fixed workflows. It says security teams need to understand agent ownership, consumers, identities, intent, access, usage, origin, and lifecycle before they can define meaningful controls. Without this correlation, enforcement becomes guesswork; with it, teams can create rules that reflect how agents actually operate.\u003c/p\u003e\n\n\u003cp\u003eThe article calls for an identity-centric, context-aware, and platform-agnostic control plane for agentic AI. Such a control plane should discover agents, correlate them with context such as owners and permissions, and enforce rules governing what agents can do, when they can do it, and how access should change as conditions change. The article concludes that organizations should move from asking which agents exist to asking which agents can take which actions, under which conditions, and who is accountable.\u003c/p\u003e\n"},{"n":10,"title":"2026 Mid-Year Update: On Pace for Our Biggest Year Yet","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/2026-mid-year-update-on-pace-for-our-biggest-year-yet","time":"11:05","priority":"MAY READ","score":45,"tldr":"StepSecurity says it is on track for its biggest year yet, driven by rapid enterprise adoption and new products covering developer machines, CI/CD, package registries, and threat intelligence. The company frames this growth around AI-fueled software supply chain risk, arguing that organizations now need layered protection across the entire development pipeline.","briefOverview":"\u003cp\u003eStepSecurity’s mid-year 2026 update says the company is on pace for its biggest year yet after more than 5x ARR growth in both 2024 and 2025. The company says revenue growth accelerated in H1 2026 and that it closed roughly 7x more new customers than in H1 2025. It also says its customer base has shifted from startups and mid-sized technology companies toward publicly listed enterprises, unicorns, large-scale AI companies, cybersecurity vendors, and organizations in regulated sectors such as financial services, defense technology, healthcare, and enterprise software.\u003c/p\u003e\n\n\u003cp\u003eThe article frames this growth around a broader change in software supply chain risk caused by AI. StepSecurity says AI has increased the volume of code being produced and shipped while also making it easier for attackers to target developer machines, code repositories, package registries, and CI/CD pipelines. It says its security research team observed self-spreading worms targeting AI coding agents, malware with signs of AI-assisted development, and attack timelines compressed from months to days.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity says it shipped all major items from its 2026 roadmap in H1, including Harden-Runner for macOS and Windows, Dev Machine Guard for all three operating systems, Secure Registry, Device Policy, Secret Exfiltration Protection for GitHub Actions, and Threat Center API and threat intelligence feeds. The company describes its platform as layered protection across developer machines, repositories, package downloads, and CI/CD runtime, with tools to block compromised packages and prove whether an organization is affected. It also says its research team discovered or was among the first to publicly report major supply chain attacks including the Axios npm compromise, Shai-Hulud attack on TanStack, Nx Console VS Code extension compromise, Microsoft durabletask PyPI compromise, and Red Hat cloud services npm compromises.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity says 2026 is on track to be its biggest year yet after more than 5x ARR growth in both 2024 and 2025.","The company says it closed roughly 7x more new customers in H1 2026 than in H1 2025, including publicly listed enterprises, unicorns, large-scale AI companies, and organizations in regulated industries such as financial services, defense technology, and healthcare.","StepSecurity says AI has increased both the amount of software being shipped and attackers' ability to target developer machines, code repositories, package registries, and CI/CD pipelines.","In H1 2026, StepSecurity shipped Harden-Runner for macOS and Windows, Dev Machine Guard for all three operating systems, Secure Registry, Device Policy, Secret Exfiltration Protection for GitHub Actions, and Threat Center API and threat intelligence feeds.","StepSecurity says its research team discovered or was among the first to publicly report several supply chain attacks in H1 2026, including the Axios npm compromise, the Shai-Hulud attack on TanStack, the Nx Console VS Code extension compromise, Microsoft's durabletask PyPI compromise, and Red Hat cloud services npm compromises."],"insights":["StepSecurity highlights that many customer expansions happened before the first renewal, suggesting teams saw enough value within weeks to broaden deployment ahead of schedule.","The company presents cybersecurity vendors as an important validation signal, noting that several well-known security companies chose StepSecurity to protect their own development pipelines in H1 2026.","StepSecurity argues that incident response now requires evidence across multiple places at once, including whether a compromised package ran in CI/CD, exists on developer machines, or appears in pull requests or default branches.","The article emphasizes that StepSecurity's threat research is directly converted into automated customer protection, so public discoveries of compromised packages and tools feed back into its platform controls.","StepSecurity frames single-stage security tools as insufficient because they can only see one part of the software pipeline, while the attacks described can move across developer machines, repositories, package registries, and CI/CD systems."],"referencedReports":[{"title":"Supply Chain Compromises Impact Nx Console and GitHub Repositories","url":"https://www.cisa.gov/news-events/alerts/2026/05/28/supply-chain-compromises-impact-nx-console-and-github-repositories","publisher":"CISA","context":"The article cites this CISA alert as documentation of GitHub's disclosure about the Nx Console VS Code extension compromise and its impact on roughly 3,800 GitHub internal repositories.","category":"","primary":false}],"body":"\u003cp\u003eStepSecurity’s mid-year 2026 update says the company is on pace for its biggest year yet after more than 5x ARR growth in both 2024 and 2025. The company says revenue growth accelerated in H1 2026 and that it closed roughly 7x more new customers than in H1 2025. It also says its customer base has shifted from startups and mid-sized technology companies toward publicly listed enterprises, unicorns, large-scale AI companies, cybersecurity vendors, and organizations in regulated sectors such as financial services, defense technology, healthcare, and enterprise software.\u003c/p\u003e\n\n\u003cp\u003eThe article frames this growth around a broader change in software supply chain risk caused by AI. StepSecurity says AI has increased the volume of code being produced and shipped while also making it easier for attackers to target developer machines, code repositories, package registries, and CI/CD pipelines. It says its security research team observed self-spreading worms targeting AI coding agents, malware with signs of AI-assisted development, and attack timelines compressed from months to days.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity says it shipped all major items from its 2026 roadmap in H1, including Harden-Runner for macOS and Windows, Dev Machine Guard for all three operating systems, Secure Registry, Device Policy, Secret Exfiltration Protection for GitHub Actions, and Threat Center API and threat intelligence feeds. The company describes its platform as layered protection across developer machines, repositories, package downloads, and CI/CD runtime, with tools to block compromised packages and prove whether an organization is affected. It also says its research team discovered or was among the first to publicly report major supply chain attacks including the Axios npm compromise, Shai-Hulud attack on TanStack, Nx Console VS Code extension compromise, Microsoft durabletask PyPI compromise, and Red Hat cloud services npm compromises.\u003c/p\u003e\n"},{"n":12,"title":"N2K Cyberwire Daily – The defense against the AI arts.","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/n2k-cyberwire-daily-the-defense-against-the-ai-arts/","time":"13:05","priority":"MAY READ","score":35,"tldr":"Health-ISAC’s Errol Weiss appeared on the N2K Cyberwire Daily podcast to discuss healthcare ransomware trends and findings from recent Health-ISAC reports on CISO priorities and the sector’s threat landscape. The key takeaway is that healthcare cybersecurity depends heavily on strong information sharing, resilience, and collaboration as AI-driven threats accelerate.","briefOverview":"\u003cp\u003eHealth-ISAC published a post highlighting N2K Cyberwire Daily podcast episode 2597, titled “The defense against the AI arts.” The episode features Errol Weiss, Chief Security Officer at Health-ISAC, joining Dave Bittner to discuss ransomware trends in the healthcare industry. The guest segment begins at 15:40 after recent cyber news.\u003c/p\u003e\n\n\u003cp\u003eThe article says the episode also includes findings from the Health-ISAC 2026 CISO Benchmarking Report and Health-ISAC’s 2nd Quarter Heartbeat Report. These reports examine the current threat landscape facing the health sector. Related linked resources include items on healthcare CISO priorities, quarterly threat insights, AI in the health sector, incident response insights, and enterprise cyber crisis readiness.\u003c/p\u003e\n\n\u003cp\u003eA pulled quote from Weiss emphasizes that information sharing in the health sector is strong because healthcare organizations share a mission of helping people and saving lives. He says IT security staff in those organizations believe in that mission, creating more alignment and practicality around sharing and working together. The article directs readers to listen to the N2K Cyberwire podcast episode through a linked “Listen Here” page.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Errol Weiss, Chief Security Officer at Health-ISAC, joined Dave Bittner on N2K Cyberwire Daily episode 2597 to discuss ransomware trends in the healthcare industry.","The episode also covers findings from the Health-ISAC 2026 CISO Benchmarking Report and Health-ISAC’s 2nd Quarter Heartbeat Report, which examine the current threat landscape facing the health sector.","The podcast episode begins with recent cyber news, and the guest segment with Errol Weiss starts at section 15:40.","Errol Weiss said the spirit and level of information sharing in the health sector is even better than what he saw in the financial sector.","The article links to the N2K Cyberwire podcast episode and related Health-ISAC resources and reports."],"insights":["Health-ISAC frames healthcare information sharing as unusually strong because security teams are aligned around a shared mission of helping people and saving lives, not just protecting organizations.","The podcast ties ransomware trends to broader sector reporting, suggesting Health-ISAC is using both the CISO Benchmarking Report and the Q2 Heartbeat Report to contextualize current healthcare threats.","The article emphasizes identity and access management, resilience, and AI-driven threats through its related resources, indicating these are prominent priorities in Health-ISAC’s current healthcare security coverage."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published a post highlighting N2K Cyberwire Daily podcast episode 2597, titled “The defense against the AI arts.” The episode features Errol Weiss, Chief Security Officer at Health-ISAC, joining Dave Bittner to discuss ransomware trends in the healthcare industry. The guest segment begins at 15:40 after recent cyber news.\u003c/p\u003e\n\n\u003cp\u003eThe article says the episode also includes findings from the Health-ISAC 2026 CISO Benchmarking Report and Health-ISAC’s 2nd Quarter Heartbeat Report. These reports examine the current threat landscape facing the health sector. Related linked resources include items on healthcare CISO priorities, quarterly threat insights, AI in the health sector, incident response insights, and enterprise cyber crisis readiness.\u003c/p\u003e\n\n\u003cp\u003eA pulled quote from Weiss emphasizes that information sharing in the health sector is strong because healthcare organizations share a mission of helping people and saving lives. He says IT security staff in those organizations believe in that mission, creating more alignment and practicality around sharing and working together. The article directs readers to listen to the N2K Cyberwire podcast episode through a linked “Listen Here” page.\u003c/p\u003e\n"}]</script>
