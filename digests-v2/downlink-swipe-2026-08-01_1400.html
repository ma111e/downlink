<script type="application/json" id="dl-articles">[{"n":1,"title":"Rails patches critical Active Storage flaw with RCE potential","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/rails-patches-critical-active-storage-flaw-with-rce-potential/","time":"14:20","priority":"MUST READ","score":95,"tldr":"Rails patched a critical Active Storage vulnerability (CVE-2026-66066) that can let unauthenticated attackers read arbitrary server files via crafted image uploads when libvips is used, potentially exposing secrets that enable remote code execution. Admins should urgently update Rails and libvips, rotate exposed credentials, and investigate for compromise.","briefOverview":"\u003cp\u003eRails maintainers patched CVE-2026-66066, a critical vulnerability in the Active Storage framework. The flaw can allow an unauthenticated attacker to read arbitrary files from a Rails application and potentially escalate to remote code execution. Active Storage is the built-in Rails component used for handling file uploads and attachments.\u003c/p\u003e\n\n\u003cp\u003eAccording to the Rails security bulletin, the issue is exploitable when libvips is used and the server allows image uploads from untrusted users. An attacker could upload a specially crafted image and access application files, including the process environment. Those files may contain secret_key_base, database credentials, cloud storage credentials, and other secrets accessible to the application process.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-66066 affects Active Storage before 7.2.3.2, 8.0.x before 8.0.5.1, and 8.1.x before 8.1.3.1, while Rails 6.x is affected only if Active Storage has been configured outside its defaults. Rails recommends upgrading to libvips 8.13 or later and rotating exposed secrets, with a temporary block option available only for systems using libvips 8.13 or later. The Rails team published full technical details and forensic tooling after public proof-of-concept exploits appeared quickly, and Akamai warned that compromise of secret_key_base can translate into full remote code execution on the underlying server.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rails maintainers patched CVE-2026-66066, a critical Active Storage vulnerability that can let an unauthenticated attacker read arbitrary files from a Rails application and potentially escalate to remote code execution.","The flaw is exploitable when libvips is used and a vulnerable application allows image uploads from untrusted users, enabling attackers to upload a specially crafted image.","CVE-2026-66066 affects Active Storage before 7.2.3.2, 8.0.x before 8.0.5.1, and 8.1.x before 8.1.3.1, while Rails 6.x is affected only if Active Storage has been configured outside its defaults.","Rails recommends upgrading to libvips 8.13 or later and rotating the Rails secret_key_base, database credentials, Active Storage service credentials, and any other secrets accessible to the application process.","The Rails team initially withheld technical details but later published full details and forensic investigation tooling after public proof-of-concept exploits became available quickly."],"insights":["The risk is higher in common deployment paths because libvips is the default processor in official Rails Docker images and in Debian and Ubuntu setups, while ImageMagick users are not affected by this vector.","Credential rotation is a required recovery step because successful exploitation may expose the Rails secret_key_base, database credentials, cloud storage credentials, and other secrets available to the application process.","For systems already using libvips 8.13 or later, administrators can temporarily block the vulnerable functionality with VIPS_BLOCK_UNTRUSTED or Vips.block_untrusted(true), but there is no workaround for apps using older libvips versions.","The Rails team accelerated disclosure of technical details and forensic tooling because public proof-of-concept exploits appeared quickly, changing the risk balance from withholding details to helping defenders investigate.","Akamai warned that compromise of secret_key_base can let attackers forge session cookies, sign global IDs, and manipulate serialized data, which can translate into full remote code execution on the server."],"referencedReports":[{"title":"CVE-2026-66066 Rails Security Advisory","url":"https://github.com/rails/rails/security/advisories/GHSA-xr9x-r78c-5hrm","publisher":"Rails","context":"The article cites the Rails security bulletin describing how CVE-2026-66066 is exploitable when libvips is used with untrusted image uploads.","category":"advisory","primary":true},{"title":"CVE-2026-66066 Attack Details and Tools to Perform a Forensic Investigation","url":"https://discuss.rubyonrails.org/t/cve-2026-66066-attack-details-and-tools-to-perform-a-forensic-investigation/91441","publisher":"Rails","context":"The article says Rails published full technical details after public proof-of-concept exploits became available quickly.","category":"research","primary":true},{"title":"Rails Active Storage RCE CVE-2026-66066","url":"https://www.akamai.com/blog/security-research/rails-active-storage-rce-cve-2026-66066","publisher":"Akamai","context":"The article references Akamai's warning about CVE-2026-66066, its “KindaRails2Shell” attack-chain name, and its remote code execution potential.","category":"research","primary":false},{"title":"KindaRails2Shell: Rails RCE CVE-2026-66066","url":"https://ethiack.com/info-hub/research/kindarails2shell-rails-rce-cve-2026-66066","publisher":"Ethiack","context":"The article cites Ethiack's research noting that a WAF may buy administrators time but that attackers using AI tooling could reconstruct the attack chain from patch diffs.","category":"research","primary":false}],"body":"\u003cp\u003eRails maintainers patched CVE-2026-66066, a critical vulnerability in the Active Storage framework. The flaw can allow an unauthenticated attacker to read arbitrary files from a Rails application and potentially escalate to remote code execution. Active Storage is the built-in Rails component used for handling file uploads and attachments.\u003c/p\u003e\n\n\u003cp\u003eAccording to the Rails security bulletin, the issue is exploitable when libvips is used and the server allows image uploads from untrusted users. An attacker could upload a specially crafted image and access application files, including the process environment. Those files may contain secret_key_base, database credentials, cloud storage credentials, and other secrets accessible to the application process.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-66066 affects Active Storage before 7.2.3.2, 8.0.x before 8.0.5.1, and 8.1.x before 8.1.3.1, while Rails 6.x is affected only if Active Storage has been configured outside its defaults. Rails recommends upgrading to libvips 8.13 or later and rotating exposed secrets, with a temporary block option available only for systems using libvips 8.13 or later. The Rails team published full technical details and forensic tooling after public proof-of-concept exploits appeared quickly, and Akamai warned that compromise of secret_key_base can translate into full remote code execution on the underlying server.\u003c/p\u003e\n"},{"n":2,"title":"Coldcard Hardware Wallet Flaw Linked to $70 Million Bitcoin Theft in 41 Minutes","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/coldcard-hardware-wallet-flaw-linked-to.html","time":"17:17","priority":"SHOULD READ","score":88,"tldr":"A Coldcard hardware wallet firmware flaw caused some devices to generate weak, predictable Bitcoin seeds, and researchers linked it to a 41-minute theft of about $70 million in BTC. Updating firmware is not enough for already-created seeds; affected users must create a new seed on patched firmware and move funds.","briefOverview":"\u003cp\u003eAn attacker drained 1,196 Bitcoin addresses in 41 minutes on July 30, taking 1,082.65 BTC worth about $70.2 million at the time. Galaxy Research mapped the sweep and tied it to a firmware flaw in Coldcard, the Bitcoin-only hardware wallet made by Canadian firm Coinkite. No one has named the attacker, and Galaxy warned that the sweep pattern identifies the operator, not necessarily the theft, because such a movement can look like an owner moving coins.\u003c/p\u003e\n\n\u003cp\u003eThe flaw came from a March 2021 firmware integration error that routed seed generation to a deterministic software pseudorandom number generator instead of the STM32 hardware random number generator. Block traced the issue to Coldcard\u0026rsquo;s production configuration and said an attacker who can determine or sufficiently constrain device-specific and timing information can reproduce candidate output streams offline, then compare derived addresses with public blockchain data. Coinkite estimated effective entropy at roughly 40 bits on the Mk3 and about 72 bits on the Mk4, Mk5, and Q, while Block did not provide one practical figure or a brute-force benchmark.\u003c/p\u003e\n\n\u003cp\u003eCoinkite shipped emergency firmware for every affected model and release track on July 31, but installing it does not repair an existing seed. The company told owners with exposed seeds to generate a new one on patched firmware and move their coins, because restoring an old seed to updated firmware or another wallet carries the weakness forward. Exposure depends on the firmware running when the seed was created, and affected ranges include Mk3 versions 4.0.1 through 4.1.9 according to Coinkite, Mk2 and Mk3 versions 4.0.0 through 4.1.9 according to Block, Mk4 and Mk5 before 5.6.0, Q before 1.5.0Q, and listed edge builds before their fixed versions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker drained 1,196 Bitcoin addresses in 41 minutes on July 30, taking 1,082.65 BTC worth about $70.2 million at the time.","Galaxy Research mapped the sweep and tied it to a firmware flaw in Coldcard, the Bitcoin-only hardware wallet made by Canadian firm Coinkite.","Block traced the flaw to a March 2021 firmware integration error that routed seed generation to a deterministic software pseudorandom number generator instead of the STM32 hardware random number generator.","Coinkite shipped emergency firmware for affected Coldcard models and release tracks on July 31, but installing it does not repair an existing seed.","Coinkite advised owners with exposed seeds to generate a new seed on patched firmware and move their coins, because restoring an old seed to updated firmware or another wallet carries the weakness forward."],"insights":["Exposure depends on the firmware version running when the seed was created, not the firmware version installed on the device now.","Updating Coldcard firmware does not make an already-created weak seed safe, and restoring that old seed to another wallet carries the weakness forward.","Coinkite says seeds created with at least 50 fair, independent, private dice rolls are not at risk from this bug alone, but users should migrate if the number or privacy of rolls is uncertain.","A strong, unique BIP-39 passphrase creates a separate wallet that the seed words alone cannot reach, but Coinkite still recommends replacing the seed.","Multisig only helps when the required signing group is not made entirely from affected devices."],"referencedReports":[{"title":"Predictable RNG Fallback and 32-bit Reseed in Coldcard Firmware","url":"https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware","publisher":"Block","context":"The article cites Block's technical analysis for the root cause of the Coldcard seed-generation flaw and its practical attack considerations.","category":"research","primary":true},{"title":"Coldcard Mk3 Seed Generation Warning","url":"https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/","publisher":"Coinkite","context":"The article references Coinkite's warning advising affected Coldcard owners to generate a new seed on patched firmware and move their coins.","category":"advisory","primary":true},{"title":"Entropy Technical Backgrounder","url":"https://blog.coinkite.com/entropy-technical-backgrounder/","publisher":"Coinkite","context":"The article cites Coinkite's technical backgrounder for estimated effective entropy levels on affected Coldcard models.","category":"research","primary":false}],"body":"\u003cp\u003eAn attacker drained 1,196 Bitcoin addresses in 41 minutes on July 30, taking 1,082.65 BTC worth about $70.2 million at the time. Galaxy Research mapped the sweep and tied it to a firmware flaw in Coldcard, the Bitcoin-only hardware wallet made by Canadian firm Coinkite. No one has named the attacker, and Galaxy warned that the sweep pattern identifies the operator, not necessarily the theft, because such a movement can look like an owner moving coins.\u003c/p\u003e\n\n\u003cp\u003eThe flaw came from a March 2021 firmware integration error that routed seed generation to a deterministic software pseudorandom number generator instead of the STM32 hardware random number generator. Block traced the issue to Coldcard\u0026rsquo;s production configuration and said an attacker who can determine or sufficiently constrain device-specific and timing information can reproduce candidate output streams offline, then compare derived addresses with public blockchain data. Coinkite estimated effective entropy at roughly 40 bits on the Mk3 and about 72 bits on the Mk4, Mk5, and Q, while Block did not provide one practical figure or a brute-force benchmark.\u003c/p\u003e\n\n\u003cp\u003eCoinkite shipped emergency firmware for every affected model and release track on July 31, but installing it does not repair an existing seed. The company told owners with exposed seeds to generate a new one on patched firmware and move their coins, because restoring an old seed to updated firmware or another wallet carries the weakness forward. Exposure depends on the firmware running when the seed was created, and affected ranges include Mk3 versions 4.0.1 through 4.1.9 according to Coinkite, Mk2 and Mk3 versions 4.0.0 through 4.1.9 according to Block, Mk4 and Mk5 before 5.6.0, Q before 1.5.0Q, and listed edge builds before their fixed versions.\u003c/p\u003e\n"}]</script>
