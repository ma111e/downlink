<script type="application/json" id="dl-articles">[{"n":5,"title":"'Warlock' ransomware used in attacks on critical infrastructure in Portuguese, Spanish-speaking countries","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/warlock-ransomware-used-in-critical-infrastructure-attacks","time":"14:05","priority":"SHOULD READ","score":88,"tldr":"A China-based group is exploiting unpatched Microsoft SharePoint flaws to deploy Warlock ransomware against critical-infrastructure organizations in Portuguese- and Spanish-speaking regions. The campaign underscores the continued risk from both 2025 and newly disclosed 2026 SharePoint vulnerabilities.","briefOverview":"\u003cp\u003eA China-based group is using Warlock ransomware against critical-infrastructure organizations in Portuguese- and Spanish-speaking countries. Symantec Threat Hunter Team reported victims including a water utility, telecommunications provider, university, and regional government across Europe, Africa, and Latin America. The group is exploiting unpatched Microsoft SharePoint vulnerabilities, including 2025 flaws called ToolShell and newer SharePoint bugs highlighted by CISA in 2026.\u003c/p\u003e\n\n\u003cp\u003eIn one incident, the attackers used a tool to disable security software on dozens of systems before deploying Warlock ransomware. They also conducted extensive reconnaissance and installed tools intended to make their activity look like normal traffic from developer or administrator workstations. The campaign demonstrates that unpatched SharePoint systems remain vulnerable and that successful ransomware incidents against essential services can have real-world consequences.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A China-based group is using Warlock ransomware in attacks against critical infrastructure organizations in Portuguese- and Spanish-speaking countries.","The attackers are exploiting unpatched Microsoft SharePoint vulnerabilities, including flaws previously known as ToolShell and newer vulnerabilities highlighted by CISA in 2026.","Reported victims include a water utility, telecommunications provider, university, and regional government across Europe, Africa, and Latin America.","In one incident, the attackers used a tool to disable security software on dozens of hosts before deploying Warlock ransomware.","The attackers also conducted extensive reconnaissance and used tools intended to make their activity resemble normal traffic from developer or administrator workstations."],"insights":["The campaign is succeeding against SharePoint systems that remain unpatched for either the 2025 flaws or the newer 2026 bugs, showing that older known weaknesses continue to create exposure alongside newly disclosed ones.","Attackers disabled security software on dozens of systems before deploying ransomware in one incident, which could make recovery and containment more difficult for affected organizations.","The group used tools and traffic patterns designed to resemble activity from developer or administrator workstations, indicating that its activity can blend into normal-looking organizational behavior.","Symantec said the focus on Portuguese- and Spanish-speaking countries may reflect either opportunistic selection of exposed SharePoint servers or deliberate targeting, while critical-infrastructure victims raise the potential for real-world service disruption."],"referencedReports":[{"title":"Warlock ransomware used in attacks on critical infrastructure","url":"https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure","publisher":"symantec-threat-hunter-team","context":"The article relies on this Symantec report for details of the Warlock ransomware campaign targeting critical infrastructure organizations.","category":"research","primary":true},{"title":"CISA Urges SharePoint Hardening After New Exploitations","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations","publisher":"cisa","context":"The article cites this CISA warning about six newly exploited SharePoint vulnerabilities.","category":"advisory","primary":false}],"body":"\u003cp\u003eA China-based group is using Warlock ransomware against critical-infrastructure organizations in Portuguese- and Spanish-speaking countries. Symantec Threat Hunter Team reported victims including a water utility, telecommunications provider, university, and regional government across Europe, Africa, and Latin America. The group is exploiting unpatched Microsoft SharePoint vulnerabilities, including 2025 flaws called ToolShell and newer SharePoint bugs highlighted by CISA in 2026.\u003c/p\u003e\n\n\u003cp\u003eIn one incident, the attackers used a tool to disable security software on dozens of systems before deploying Warlock ransomware. They also conducted extensive reconnaissance and installed tools intended to make their activity look like normal traffic from developer or administrator workstations. The campaign demonstrates that unpatched SharePoint systems remain vulnerable and that successful ransomware incidents against essential services can have real-world consequences.\u003c/p\u003e\n"},{"n":6,"title":"GitLab Patches Critical 9.9 AI Gateway Flaw Allowing Command Execution on Self-Hosted Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/gitlab-patches-critical-self-hosted-ai.html","time":"17:33","priority":"SHOULD READ","score":88,"tldr":"GitLab patched CVE-2026-90970, a critical 9.9 AI Gateway flaw that could let authenticated Duo Agent Platform users execute commands through a crafted custom flow. Organizations running self-hosted GitLab AI Gateways should update immediately to versions 19.2.4, 19.3.2, or 19.4.1.","briefOverview":"\u003cp\u003eGitLab patched CVE-2026-90970, a critical 9.9-rated flaw in its AI Gateway that could allow command execution on self-hosted gateways. GitLab said a logged-in user with Duo Agent Platform access could use a specially crafted custom flow configuration to escape a prompt-template sandbox. The issue was fixed in AI Gateway versions 19.2.4, 19.3.2, and 19.4.1.\u003c/p\u003e\n\n\u003cp\u003eOnly organizations hosting their own AI Gateway need to take action; GitLab.com, GitLab Dedicated, and self-managed instances using a GitLab-hosted gateway are already covered. GitLab strongly recommends that affected customers update immediately, and the advisory provides no workaround or way to determine whether a gateway was attacked before updating. The gateway holds sensitive JSON Web Token signing keys and connects to both the GitLab instance and AI model providers, making command execution on it particularly significant.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab disclosed CVE-2026-90970, a critical AI Gateway flaw with a CVSS score of 9.9 that could allow command execution on self-hosted gateways.","The issue affects self-managed organizations that host their own GitLab AI Gateway, while GitLab.com, GitLab Dedicated, and self-managed instances using a GitLab-hosted gateway do not need to act.","GitLab fixed the flaw in AI Gateway versions 19.2.4, 19.3.2, and 19.4.1, and strongly recommends affected customers update immediately.","A logged-in user with Duo Agent Platform access could escape a custom flow prompt template sandbox using a specially crafted flow configuration, potentially leading to arbitrary command execution on the gateway.","The advisory does not state whether the flaw has been exploited, and CISA’s October 2 CVE assessment lists exploitation as none."],"insights":["Organizations running AI Gateway releases from 18.1.6 through the 19.1 line have no listed fixed version, while GitLab’s advisory does not clarify whether the 19.2.4 fix is compatible with those older GitLab versions.","GitLab provides no workaround for gateways that cannot yet be updated and no method to determine whether a gateway was compromised before patching.","Because a self-hosted AI Gateway stores sensitive JSON Web Token signing keys and connects to both the GitLab instance and AI model providers, command execution on it could affect a particularly sensitive system.","This is GitLab’s second 9.9-rated AI Gateway issue in 2026 involving crafted flow definitions and template-engine weaknesses classified as CWE-1336."],"referencedReports":[{"title":"Patch release: GitLab AI Gateway 19.4.1 released","url":"https://docs.gitlab.com/releases/patches/other-patches/patch-release-gitlab-ai-gateway-19-4-1-released/","publisher":"gitlab","context":"GitLab's advisory discloses CVE-2026-90970, describes its impact, and lists the fixed AI Gateway versions.","category":"advisory","primary":true},{"title":"Patch release: GitLab AI Gateway 18.8.1 released","url":"https://docs.gitlab.com/releases/patches/other-patches/patch-release-gitlab-ai-gateway-18-8-1-released/","publisher":"gitlab","context":"The article references this GitLab advisory for a separate February AI Gateway flaw, CVE-2026-1868.","category":"advisory","primary":false}],"body":"\u003cp\u003eGitLab patched CVE-2026-90970, a critical 9.9-rated flaw in its AI Gateway that could allow command execution on self-hosted gateways. GitLab said a logged-in user with Duo Agent Platform access could use a specially crafted custom flow configuration to escape a prompt-template sandbox. The issue was fixed in AI Gateway versions 19.2.4, 19.3.2, and 19.4.1.\u003c/p\u003e\n\n\u003cp\u003eOnly organizations hosting their own AI Gateway need to take action; GitLab.com, GitLab Dedicated, and self-managed instances using a GitLab-hosted gateway are already covered. GitLab strongly recommends that affected customers update immediately, and the advisory provides no workaround or way to determine whether a gateway was attacked before updating. The gateway holds sensitive JSON Web Token signing keys and connects to both the GitLab instance and AI model providers, making command execution on it particularly significant.\u003c/p\u003e\n"},{"n":7,"title":"Dell CSM Flaws Enable Unauthenticated Admin Access and Root on Kubernetes Nodes","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/dell-csm-flaws-enable-unauthenticated.html","time":"17:02","priority":"SHOULD READ","score":88,"tldr":"Dell patched six critical flaws in Container Storage Modules that could let unauthenticated attackers gain storage administrator access, forge tokens, or obtain root access across Kubernetes cluster nodes. Organizations using CSM versions earlier than 1.17.0 should upgrade to 1.18.0 immediately and rotate JWT signing secrets.","briefOverview":"\u003cp\u003eDell released security updates for six critical vulnerabilities in Dell Container Storage Modules (CSM). The flaws include missing authentication, hard-coded credentials or cryptographic keys, improper privilege management, and template-engine handling issues. Several of the vulnerabilities are rated 10.0 on the CVSS severity scale.\u003c/p\u003e\n\n\u003cp\u003eThe issues could allow unauthenticated attackers to obtain storage administrator credentials, bypass authorization controls, forge valid administrative tokens, and gain administrative access to storage resources across tenants. One flaw, CVE-2026-67269, could allow a low-privilege remote attacker to obtain root-level access on Kubernetes cluster nodes through a single custom resource submission. Another, CVE-2026-67273, could grant cluster-wide read access to Kubernetes Secrets and enable creation of cluster-scoped RBAC resources.\u003c/p\u003e\n\n\u003cp\u003eDell said all CSM versions before 1.17.0 are affected and that the issues are addressed in version 1.18.0. The company stated there are no workarounds or mitigations besides updating to the latest version. Dell also recommends that customers rotate JWT signing secrets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Dell released security updates for multiple critical vulnerabilities in Dell Container Storage Modules (CSM).","CVE-2026-63688 and CVE-2026-63692 have CVSS scores of 10.0 and could allow unauthenticated attackers to obtain storage administrator credentials or administrative-level privileges.","CVE-2026-67269 could allow a low-privilege remote attacker to gain root-level access on Kubernetes cluster nodes through a single custom resource submission.","Hard-coded credentials and publicly available signing secrets associated with CVE-2026-54472 and CVE-2026-61421 could enable attackers to forge administrative or authentication tokens.","All CSM versions before 1.17.0 are affected, and Dell said the issues are addressed in version 1.18.0; it recommends updating and rotating JWT signing secrets."],"insights":["A single custom resource submission exploiting CVE-2026-67269 could compromise every node in a Kubernetes cluster, making the potential impact far broader than a single affected storage component.","CVE-2026-63688 can expose administrator credentials for all registered storage arrays and affect storage infrastructure across all five Dell storage product families supported by CSM.","CVE-2026-67273 can provide cluster-wide read access to Kubernetes Secrets and allow creation of cluster-scoped access-control resources, bypassing intended Kubernetes access controls.","Dell states there are no workarounds or mitigations for the flaws other than updating to version 1.18.0, and it also recommends rotating JWT signing secrets."],"referencedReports":[{"title":"DSA-2026-448: Security Update for Dell Container Storage Modules Multiple Vulnerabilities","url":"https://www.dell.com/support/kbdoc/en-us/000515771/dsa-2026-448-security-update-for-dell-container-storage-modules-multiple-vulnerabilities","publisher":"dell","context":"The article cites Dell's security update as the source for the Container Storage Modules vulnerability details and remediation guidance.","category":"advisory","primary":true}],"body":"\u003cp\u003eDell released security updates for six critical vulnerabilities in Dell Container Storage Modules (CSM). The flaws include missing authentication, hard-coded credentials or cryptographic keys, improper privilege management, and template-engine handling issues. Several of the vulnerabilities are rated 10.0 on the CVSS severity scale.\u003c/p\u003e\n\n\u003cp\u003eThe issues could allow unauthenticated attackers to obtain storage administrator credentials, bypass authorization controls, forge valid administrative tokens, and gain administrative access to storage resources across tenants. One flaw, CVE-2026-67269, could allow a low-privilege remote attacker to obtain root-level access on Kubernetes cluster nodes through a single custom resource submission. Another, CVE-2026-67273, could grant cluster-wide read access to Kubernetes Secrets and enable creation of cluster-scoped RBAC resources.\u003c/p\u003e\n\n\u003cp\u003eDell said all CSM versions before 1.17.0 are affected and that the issues are addressed in version 1.18.0. The company stated there are no workarounds or mitigations besides updating to the latest version. Dell also recommends that customers rotate JWT signing secrets.\u003c/p\u003e\n"},{"n":2,"title":"GitLab warns of critical RCE vulnerability in AI Gateway service","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/gitlab-warns-of-critical-rce-vulnerability-in-ai-gateway-service/","time":"16:20","priority":"SHOULD READ","score":87,"tldr":"GitLab urges users of self-hosted AI Gateway installations to immediately upgrade to versions 19.2.4, 19.3.2, or 19.4.1 to fix CVE-2026-90970, a critical flaw that can allow authenticated users to escape the prompt sandbox and execute arbitrary commands. GitLab-hosted AI Gateway users are already protected.","briefOverview":"\u003cp\u003eGitLab has warned customers to immediately patch CVE-2026-90970, a critical vulnerability in its AI Gateway service. The flaw could allow an authenticated user with basic privileges and Duo Agent Platform access to run arbitrary commands on affected systems. It stems from an improper neutralization weakness that can allow a specially crafted flow configuration to escape the prompt template sandbox. The issue affects self-hosted AI Gateway deployments used through GitLab Duo Self-Hosted.\u003c/p\u003e\n\n\u003cp\u003eGitLab released AI Gateway versions 19.2.4, 19.3.2, and 19.4.1 to fix the flaw and strongly recommends affected GitLab Self-Managed customers update immediately. Customers using GitLab-hosted AI Gateway are already protected and do not need to take action. GitLab said it conducted targeted outreach to self-hosted AI Gateway customers before publishing the advisory. The warning follows GitLab\u0026rsquo;s recent patch for CVE-2026-85706, a maximum-severity path traversal flaw that CISA added to its list of actively exploited vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab disclosed CVE-2026-90970, a critical GitLab AI Gateway flaw that may allow authenticated users with Duo Agent Platform access to execute arbitrary commands through a specially crafted flow configuration.","The issue affects self-hosted AI Gateway deployments and involves escaping the prompt template sandbox under certain conditions.","GitLab released AI Gateway versions 19.2.4, 19.3.2, and 19.4.1 to address the vulnerability and urges affected customers to update immediately.","Customers using GitLab-hosted AI Gateway are already protected and do not need to take action.","GitLab previously patched CVE-2026-85706, a maximum-severity path traversal flaw that CISA subsequently added to its actively exploited vulnerabilities catalog."],"insights":["The critical flaw is not described as anonymous internet access: an attacker must have basic privileges and access to the Duo Agent Platform before they can use a specially crafted flow configuration to run commands.","The affected deployment model is narrowly defined: organizations operating their own AI Gateway through GitLab Duo Self-Hosted must patch, while GitLab’s centrally hosted AI Gateway customers are already protected.","GitLab contacted self-hosted AI Gateway customers with upgrade guidance before publicly releasing the advisory, indicating the company targeted the known affected customer group in advance.","The warning follows another recent GitLab flaw, CVE-2026-85706, that CISA added to its catalog of vulnerabilities known to be actively exploited."],"referencedReports":[{"title":"Patch Release: GitLab AI Gateway 19.4.1 released","url":"http://docs.gitlab.com/releases/patches/other-patches/patch-release-gitlab-ai-gateway-19-4-1-released/","publisher":"gitlab","context":"GitLab's advisory explains that CVE-2026-90970 could allow an authenticated user with Duo Agent Platform access to escape the prompt template sandbox and execute arbitrary commands.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/11/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites CISA's alert that added GitLab CVE-2026-85706 to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003eGitLab has warned customers to immediately patch CVE-2026-90970, a critical vulnerability in its AI Gateway service. The flaw could allow an authenticated user with basic privileges and Duo Agent Platform access to run arbitrary commands on affected systems. It stems from an improper neutralization weakness that can allow a specially crafted flow configuration to escape the prompt template sandbox. The issue affects self-hosted AI Gateway deployments used through GitLab Duo Self-Hosted.\u003c/p\u003e\n\n\u003cp\u003eGitLab released AI Gateway versions 19.2.4, 19.3.2, and 19.4.1 to fix the flaw and strongly recommends affected GitLab Self-Managed customers update immediately. Customers using GitLab-hosted AI Gateway are already protected and do not need to take action. GitLab said it conducted targeted outreach to self-hosted AI Gateway customers before publishing the advisory. The warning follows GitLab\u0026rsquo;s recent patch for CVE-2026-85706, a maximum-severity path traversal flaw that CISA added to its list of actively exploited vulnerabilities.\u003c/p\u003e\n"},{"n":8,"title":"Antino Backdoor Uses Outlook and OneDrive for C2 in China-Nexus Espionage Campaign","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/antino-backdoor-uses-outlook-and.html","time":"17:33","priority":"SHOULD READ","score":84,"tldr":"Cisco Talos uncovered a China-nexus espionage campaign targeting government and policy organizations across Asia with the new Rust-based Antino backdoor. The malware uses Microsoft 365 services—Outlook for commands and OneDrive for file transfer—to blend command-and-control traffic into legitimate cloud activity.","briefOverview":"\u003cp\u003eCisco Talos reported that a China-nexus cluster tracked as UAT-11587 has targeted government and policy organizations across Asia with a previously undocumented Windows backdoor called Antino. The activity began with spear-phishing against Taiwan’s academic, think tank, and civil-society policy community in September 2025 and later expanded to 16 entities in eight Asian countries. Talos also found evidence of targeting in Syria around May 2026, with a concentrated wave against government IT infrastructure on June 8 and 9, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used tailored email lures, spoofed trusted sender identities, and fake Gmail attachment-preview widgets that sent victims to attacker-controlled Cloudflare Pages URLs. The resulting infection chain downloads HTA or WSF files, JavaScript and .NET components, and ultimately launches Antino through DLL sideloading using the legitimate Microsoft-signed GatherOsState.exe binary. Antino is compiled in Rust and can collect host information, run shell and PowerShell commands, transfer files, load shellcode, and maintain access while using Outlook for command exchange and OneDrive for heartbeats and file transfers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos identified a China-nexus activity cluster tracked as UAT-11587 targeting government and policy organizations in Taiwan, India, the Philippines, Cambodia, Pakistan, Thailand, Myanmar, and Syria.","The campaign deploys Antino, a previously undocumented Rust-compiled Windows backdoor that can perform host reconnaissance, execute shell and PowerShell commands, transfer files, load shellcode in memory, and establish persistence.","Antino uses Microsoft Graph to communicate through Microsoft 365, retrieving commands from Outlook and using OneDrive for heartbeats and file transfers rather than a dedicated command-and-control server.","UAT-11587 used tailored spear-phishing lures, including spoofed trusted sender identities and fake Gmail attachment-preview widgets that directed recipients to attacker-controlled Cloudflare Pages URLs.","The infection chain downloads HTA or WSF files, uses a JavaScript downloader and .NET components, and launches Antino through DLL sideloading with the legitimate Microsoft-signed GatherOsState.exe binary."],"insights":["Antino’s use of Outlook and OneDrive as command-and-control channels replaces a dedicated attacker server with common Microsoft 365 activity, which can make the traffic less conspicuous.","The phishing emails recreated Gmail’s attachment-preview card inside the email itself using embedded images, while the apparent attachment actually linked to an attacker-controlled Cloudflare Pages URL.","Although UAT-11587 shows overlaps with Jewelbug and other China-aligned clusters, Cisco Talos did not find evidence connecting this espionage campaign to Jewelbug’s financially motivated operations and tracks it separately.","Antino abuses the legitimate Windows Scripted Diagnostics framework to run attacker-controlled PowerShell, but Talos noted that PowerShell, file-creation, and Registry activity can still be observed."],"referencedReports":[{"title":"China-Nexus UAT-11587 Targets Government and Policy Organizations Across Asia With Antino Backdoor","url":"https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/","publisher":"cisco-talos","context":"The article relies on Cisco Talos's technical analysis of UAT-11587, its phishing activity, and the Antino backdoor's Microsoft 365-based command-and-control.","category":"research","primary":true}],"body":"\u003cp\u003eCisco Talos reported that a China-nexus cluster tracked as UAT-11587 has targeted government and policy organizations across Asia with a previously undocumented Windows backdoor called Antino. The activity began with spear-phishing against Taiwan’s academic, think tank, and civil-society policy community in September 2025 and later expanded to 16 entities in eight Asian countries. Talos also found evidence of targeting in Syria around May 2026, with a concentrated wave against government IT infrastructure on June 8 and 9, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used tailored email lures, spoofed trusted sender identities, and fake Gmail attachment-preview widgets that sent victims to attacker-controlled Cloudflare Pages URLs. The resulting infection chain downloads HTA or WSF files, JavaScript and .NET components, and ultimately launches Antino through DLL sideloading using the legitimate Microsoft-signed GatherOsState.exe binary. Antino is compiled in Rust and can collect host information, run shell and PowerShell commands, transfer files, load shellcode, and maintain access while using Outlook for command exchange and OneDrive for heartbeats and file transfers.\u003c/p\u003e\n"},{"n":3,"title":"US sanctions Tren de Aragua gang members in ATM hacks crackdown","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-sanctions-tren-de-aragua-members-in-atm-jackpotting-crackdown/","time":"15:20","priority":"SHOULD READ","score":82,"tldr":"The U.S. Treasury sanctioned eight Tren de Aragua members, including alleged Ploutus ATM-malware developer Anibal Canelon Aguirre, over a scheme that stole an estimated $40.73 million from U.S. financial institutions through ATM jackpotting. Authorities also added seven linked TRON cryptocurrency addresses to the sanctions list as part of a broader crackdown.","briefOverview":"\u003cp\u003eThe U.S. Treasury Department sanctioned eight members of the Venezuelan Tren de Aragua (TdA) gang over their alleged involvement in ATM jackpotting attacks in the United States. The designated people include Anibal Alexander Canelon Aguirre, known as Prometheus, whom authorities allege developed the Ploutus software used in the scheme. Aguirre has been on the FBI’s Ten Most Wanted Fugitives list since March, according to the article.\u003c/p\u003e\n\n\u003cp\u003eIn ATM jackpotting, criminals use malicious software to make cash machines dispense money and can use an attached USB keyboard or the machine’s PIN pad to remove evidence. OFAC estimates that TdA members stole $40.73 million from U.S. financial institutions in more than 1,500 alleged incidents as of August 2025. The Treasury also added seven TRON cryptocurrency addresses to its blocked list, while the Justice Department has charged 98 suspects connected to TdA ATM jackpotting schemes since October 2025.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Treasury Department sanctioned eight members of Venezuela's Tren de Aragua gang for their alleged role in ATM jackpotting attacks in the United States.","The sanctions include Anibal Alexander Canelon Aguirre, also known as Prometheus, who is alleged to have developed the Ploutus software used to force ATMs to dispense cash.","OFAC estimates that Tren de Aragua members stole $40.73 million from U.S. financial institutions through more than 1,500 alleged ATM jackpotting incidents as of August 2025.","The Treasury added seven TRON cryptocurrency addresses to its blocked-persons list; according to TRM Labs, they have received about $6.1 million since March 2022.","Since October 2025, the U.S. Justice Department has charged 98 suspects linked to Tren de Aragua and ATM jackpotting schemes."],"insights":["The alleged operation was transnational: its network was based in Mexico and Venezuela, targeted U.S. cash machines, and reportedly moved stolen funds to Tren de Aragua members in multiple countries.","The Treasury’s response extends beyond individuals to seven TRON cryptocurrency addresses that, according to TRM Labs, received about $6.1 million in inflows and transferred funds to other addresses associated with the gang.","ATM jackpotting can combine malicious software with direct interaction at a machine through an attached USB keyboard or the machine’s built-in PIN pad, enabling criminals to dispense cash and remove evidence.","The enforcement campaign has combined sanctions and criminal prosecution: since October 2025, the Justice Department has charged 98 people linked to Tren de Aragua ATM jackpotting schemes, with potential maximum sentences ranging from 20 to 335 years."],"referencedReports":[{"title":"Treasury Sanctions Tren de Aragua ATM Jackpotting Network Including Seven TRON Addresses","url":"https://www.trmlabs.com/resources/blog/treasury-sanctions-tren-de-aragua-atm-jackpotting-network-including-seven-tron-addresses","publisher":"trm-labs","context":"The article cites TRM Labs for its analysis that seven sanctioned TRON addresses received approximately $6.1 million in inflows and sent funds to other Tren de Aragua-associated addresses.","category":"research","primary":false}],"body":"\u003cp\u003eThe U.S. Treasury Department sanctioned eight members of the Venezuelan Tren de Aragua (TdA) gang over their alleged involvement in ATM jackpotting attacks in the United States. The designated people include Anibal Alexander Canelon Aguirre, known as Prometheus, whom authorities allege developed the Ploutus software used in the scheme. Aguirre has been on the FBI’s Ten Most Wanted Fugitives list since March, according to the article.\u003c/p\u003e\n\n\u003cp\u003eIn ATM jackpotting, criminals use malicious software to make cash machines dispense money and can use an attached USB keyboard or the machine’s PIN pad to remove evidence. OFAC estimates that TdA members stole $40.73 million from U.S. financial institutions in more than 1,500 alleged incidents as of August 2025. The Treasury also added seven TRON cryptocurrency addresses to its blocked list, while the Justice Department has charged 98 suspects connected to TdA ATM jackpotting schemes since October 2025.\u003c/p\u003e\n"},{"n":4,"title":"Mississippi mayor says ransomware incident led city to shut down systems","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/vicksburg-mississippi-government-ransomware-attack","time":"14:06","priority":"MAY READ","score":68,"tldr":"A ransomware incident forced Vicksburg, Mississippi, to temporarily shut down city computer systems, disrupting utility payments but not emergency services. The city is working with the FBI, DHS, state officials, and cybersecurity experts to recover and determine whether personal or confidential data was accessed.","briefOverview":"\u003cp\u003eA ransomware incident prompted Vicksburg, Mississippi, to temporarily shut down its computer systems, Mayor Willis Thompson said. The disruption has affected utility payments, although emergency services have not been impacted. The city said it will not disconnect services or impose late-payment penalties while the investigation continues.\u003c/p\u003e\n\n\u003cp\u003eVicksburg is working with the FBI, Department of Homeland Security, state officials, and private cybersecurity experts on recovery. Officials are investigating whether personal or confidential data relating to current and former customers, contractors, vendors, employees, or affiliated business partners was accessed or acquired without authorization. The city has not determined what information, if any, was affected and declined to disclose technical details that could interfere with the investigation, recovery, or system security.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A ransomware incident prompted Vicksburg, Mississippi, to temporarily shut down its computer systems.","The shutdown has affected utility payments, but emergency services have not been impacted.","Mayor Willis Thompson said residents will not have services disconnected or receive late-payment penalties while the investigation continues.","Vicksburg is working with the FBI, the Department of Homeland Security, state officials, and private cybersecurity experts on recovery efforts.","The city is investigating whether personal or confidential information involving customers, contractors, vendors, employees, or business partners was accessed without authorization."],"insights":["Vicksburg kept emergency services operating despite shutting down city computer systems, indicating the disruption was concentrated in other municipal functions such as utility payments.","The city suspended service shutoffs and late-payment penalties during the outage, reducing immediate consequences for residents unable to pay through affected systems.","The investigation covers possible exposure of information not only for residents but also for former customers, contractors, vendors, employees, and affiliated business partners.","Vicksburg’s recovery involves federal, state, and private-sector assistance, including the FBI and Department of Homeland Security.","The incident follows other ransomware disruptions in Mississippi, including a recent attack on the University of Mississippi Medical Center that required weeks of recovery work."],"referencedReports":[],"body":"\u003cp\u003eA ransomware incident prompted Vicksburg, Mississippi, to temporarily shut down its computer systems, Mayor Willis Thompson said. The disruption has affected utility payments, although emergency services have not been impacted. The city said it will not disconnect services or impose late-payment penalties while the investigation continues.\u003c/p\u003e\n\n\u003cp\u003eVicksburg is working with the FBI, Department of Homeland Security, state officials, and private cybersecurity experts on recovery. Officials are investigating whether personal or confidential data relating to current and former customers, contractors, vendors, employees, or affiliated business partners was accessed or acquired without authorization. The city has not determined what information, if any, was affected and declined to disclose technical details that could interfere with the investigation, recovery, or system security.\u003c/p\u003e\n"},{"n":1,"title":"The EDR blind spot: 3 ways browser attacks evade endpoint telemetry","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-edr-blind-spot-3-ways-browser-attacks-evade-endpoint-telemetry/","time":"14:00","priority":"MAY READ","score":38,"tldr":"EDR remains effective for host-based malware and execution, but browser-based SaaS activity such as AiTM session theft, malicious extensions, unauthorized uploads, and clipboard lures can evade endpoint telemetry. Organizations should combine EDR with browser, identity, and SaaS controls to prevent and detect these actions earlier.","briefOverview":"\u003cp\u003eThe article argues that endpoint detection and response (EDR) tools remain useful for malware, persistence, and process-level activity, but may not identify harmful actions that occur entirely in browser-based SaaS sessions. It cites the 2025 Salesloft Drift incident, in which UNC6395 used OAuth tokens associated with Drift integrations to make high-volume API calls against customers’ Salesforce environments. The article says browser sessions are now a primary route to corporate SaaS applications, identity workflows, files, and administrative consoles, where actions may not create the host-level evidence EDR is designed to inspect.\u003c/p\u003e\n\n\u003cp\u003eIt highlights adversary-in-the-middle phishing, compromised browser extensions, unauthorized data transfers, and clipboard-based lures as examples of browser-centered risks. Microsoft observed Storm-2755 capture credentials, session cookies, and OAuth tokens through proxy phishing, while separate malicious AI-assistant-themed Chromium extensions collected visited URLs and ChatGPT and DeepSeek conversation content. The article also describes the TerminalFix ClickFix campaign, where fake Cloudflare CAPTCHA prompts copied a malicious PowerShell command to victims’ clipboards before endpoint-visible activity began. It recommends combining browser controls, identity and SaaS controls, and EDR, including phishing-resistant FIDO2 WebAuthn, extension policies, and restrictions on risky uploads, downloads, and clipboard actions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["EDR is designed to detect host execution, malware, persistence, and process-level behavior, but browser-based SaaS activity may not create the endpoint artifacts it analyzes.","The 2025 Salesloft Drift incident involved UNC6395 using OAuth tokens associated with Drift integrations to make high-volume API calls against customers’ Salesforce environments.","Microsoft reported that Storm-2755 used adversary-in-the-middle phishing to capture credentials, session cookies, and OAuth tokens from Canadian employees targeted through search engine poisoning and malicious ads.","Microsoft reported in March 2026 that malicious AI-assistant-themed Chromium extensions collected visited URLs and ChatGPT and DeepSeek conversation content, then sent it to attacker-controlled infrastructure.","The article recommends connected browser, identity-and-SaaS, and endpoint controls, including browser restrictions on phishing destinations, extensions, uploads, downloads, and clipboard actions."],"insights":["A stolen browser session can be reused from attacker-controlled infrastructure without a malware process running on the victim’s device; Microsoft observed Storm-2755 session IDs shift from a victim browser to an Axios user agent.","Browser extensions can collect page content and send it over HTTPS using ordinary browser APIs, leaving defenders with apparently normal browser traffic unless they also have extension-specific inventory, permissions, and policy context.","ClickFix-style campaigns can remain limited to web content, clipboard manipulation, and user interaction until the victim executes the copied command, at which point endpoint-focused detection becomes substantially more useful.","Phishing-resistant FIDO2 WebAuthn can prevent many adversary-in-the-middle phishing attempts because its authentication response is cryptographically tied to the legitimate website origin."],"referencedReports":[{"title":"Cloud Threat Horizons Report H1 2026","url":"https://cloud.google.com/security/report/resources/cloud-threat-horizons-report-h1-2026","publisher":"Google Cloud","context":"The article references this report in connection with the 2025 Salesloft Drift incident and UNC6395's use of OAuth tokens against Salesforce environments.","category":"research","primary":false},{"title":"Investigating Storm-2755 Payroll Pirate Attacks Targeting Canadian Employees","url":"https://www.microsoft.com/en-us/security/blog/2026/04/09/investigating-storm-2755-payroll-pirate-attacks-targeting-canadian-employees/","publisher":"Microsoft","context":"The article cites Microsoft's investigation of Storm-2755's adversary-in-the-middle phishing campaign targeting Canadian employees.","category":"research","primary":false},{"title":"Malicious AI Assistant Extensions Harvest LLM Chat Histories","url":"https://www.microsoft.com/en-us/security/blog/2026/03/05/malicious-ai-assistant-extensions-harvest-llm-chat-histories/","publisher":"Microsoft","context":"The article cites Microsoft's report on malicious Chromium extensions posing as AI assistants that collected browsing and AI-chat content.","category":"research","primary":false},{"title":"TerminalFix Campaign Deploys Reverse Tunnel Through Multistage Intrusion","url":"https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/","publisher":"Microsoft","context":"The article references Microsoft's observation of the TerminalFix ClickFix campaign, which used fake Cloudflare CAPTCHA prompts to copy a malicious PowerShell command.","category":"research","primary":false}],"body":"\u003cp\u003eThe article argues that endpoint detection and response (EDR) tools remain useful for malware, persistence, and process-level activity, but may not identify harmful actions that occur entirely in browser-based SaaS sessions. It cites the 2025 Salesloft Drift incident, in which UNC6395 used OAuth tokens associated with Drift integrations to make high-volume API calls against customers’ Salesforce environments. The article says browser sessions are now a primary route to corporate SaaS applications, identity workflows, files, and administrative consoles, where actions may not create the host-level evidence EDR is designed to inspect.\u003c/p\u003e\n\n\u003cp\u003eIt highlights adversary-in-the-middle phishing, compromised browser extensions, unauthorized data transfers, and clipboard-based lures as examples of browser-centered risks. Microsoft observed Storm-2755 capture credentials, session cookies, and OAuth tokens through proxy phishing, while separate malicious AI-assistant-themed Chromium extensions collected visited URLs and ChatGPT and DeepSeek conversation content. The article also describes the TerminalFix ClickFix campaign, where fake Cloudflare CAPTCHA prompts copied a malicious PowerShell command to victims’ clipboards before endpoint-visible activity began. It recommends combining browser controls, identity and SaaS controls, and EDR, including phishing-resistant FIDO2 WebAuthn, extension policies, and restrictions on risky uploads, downloads, and clipboard actions.\u003c/p\u003e\n"}]</script>
