<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA Adds Exploited N-able N-central Flaw to KEV After Customer Compromises","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/cisa-adds-exploited-n-able-n-central.html","time":"07:00","priority":"MUST READ","score":95,"tldr":"CISA added actively exploited N-able N-central flaw CVE-2026-18577 to its KEV catalog after a limited number of customers were compromised, enabling authentication bypass, admin access, and possible pivoting into managed endpoints. Organizations should upgrade to N-central 2026.3 HF1 and review Take Control activity and related indicators of compromise.","briefOverview":"\u003cp\u003eCISA added CVE-2026-18577, a high-severity flaw affecting N-able N-central, to its Known Exploited Vulnerabilities catalog after reports of active exploitation in the wild. The vulnerability has a CVSS score of 8.2 and is described as incomplete patching for CVE-2026-18556. It allows authentication bypass and account takeover in susceptible versions of N-central, and N-able addressed the issue in version 2026.3 HF1.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation can let remote attackers gain administrative access to vulnerable N-central servers. Attackers can then abuse the built-in Take Control feature to pivot into managed endpoints and deploy persistence mechanisms. N-able said a limited number of customers were compromised through CVE-2026-18577, while Huntress observed targeting across multiple organizations but no sign that the activity had become a broad, indiscriminate campaign.\u003c/p\u003e\n\n\u003cp\u003eN-able shared indicators of compromise including a file named “svchost.exe” in device users’ documents folders, a registered service named “Cloudflared,” and inbound connections from four listed IP addresses. Huntress said the IP addresses were Mullvad or NordVPN VPN exit nodes and reported post-exploitation patterns such as reconnaissance for key servers, process enumeration, and lateral movement. Federal Civilian Executive Branch agencies are being recommended to apply fixes by August 6, 2026, and review N-central Take Control activity in their environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-18577, a high-severity flaw affecting N-able N-central, to its Known Exploited Vulnerabilities catalog after reports of active exploitation in the wild.","CVE-2026-18577 is an incomplete patch for CVE-2026-18556 and can allow authentication bypass and account takeover in susceptible N-central versions, with a fix available in version 2026.3 HF1.","Successful exploitation can let remote attackers gain administrative access to vulnerable N-central servers and use the Take Control feature to pivot into managed endpoints and deploy persistence mechanisms.","N-able reported a limited number of customer compromises and shared indicators including a file named “svchost.exe,” a service named “Cloudflared,” and four IP addresses associated with Mullvad or NordVPN exit nodes.","Huntress observed threat actors targeting the flaw across multiple organizations, including reconnaissance, process enumeration, and lateral movement, but said there is no indication of a broad, indiscriminate campaign at this stage."],"insights":["The flaw is notable because it resulted from incomplete patching of an earlier vulnerability, CVE-2026-18556, meaning systems thought to be protected by the prior fix may still require the newer 2026.3 HF1 update.","N-able’s indicators focus on activity after compromise, including a suspicious “svchost.exe” in users’ documents folders and a “Cloudflared” service, which makes endpoint and service review important in addition to patching N-central itself.","The attackers used legitimate-looking paths into victim environments, including N-central Take Control sessions tied to the default “MSP Support” username and VPN exit nodes from Mullvad and NordVPN.","Huntress reported targeted post-exploitation behavior such as looking for domain controllers and moving laterally, while also stating there was no sign of a broad indiscriminate campaign at the time of reporting."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/03/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites CISA’s alert adding CVE-2026-18577 to the Known Exploited Vulnerabilities catalog after reports of active exploitation.","category":"advisory","primary":true},{"title":"N-central Security Update - August 2, 2026","url":"https://www.n-able.com/blog/n-central-security-update-august-2-2026","publisher":"N-able","context":"The article references N-able’s security update acknowledging a limited number of customer compromises and providing information about the flaw.","category":"advisory","primary":true},{"title":"N-able Vulnerability Exploitation","url":"https://www.huntress.com/blog/n-able-vulnerability-exploitation","publisher":"Huntress","context":"The article cites Huntress’s analysis describing observed targeting, post-exploitation behavior, and VPN exit-node activity tied to the N-able N-central flaw.","category":"research","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-18577, a high-severity flaw affecting N-able N-central, to its Known Exploited Vulnerabilities catalog after reports of active exploitation in the wild. The vulnerability has a CVSS score of 8.2 and is described as incomplete patching for CVE-2026-18556. It allows authentication bypass and account takeover in susceptible versions of N-central, and N-able addressed the issue in version 2026.3 HF1.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation can let remote attackers gain administrative access to vulnerable N-central servers. Attackers can then abuse the built-in Take Control feature to pivot into managed endpoints and deploy persistence mechanisms. N-able said a limited number of customers were compromised through CVE-2026-18577, while Huntress observed targeting across multiple organizations but no sign that the activity had become a broad, indiscriminate campaign.\u003c/p\u003e\n\n\u003cp\u003eN-able shared indicators of compromise including a file named “svchost.exe” in device users’ documents folders, a registered service named “Cloudflared,” and inbound connections from four listed IP addresses. Huntress said the IP addresses were Mullvad or NordVPN VPN exit nodes and reported post-exploitation patterns such as reconnaissance for key servers, process enumeration, and lateral movement. Federal Civilian Executive Branch agencies are being recommended to apply fixes by August 6, 2026, and review N-central Take Control activity in their environments.\u003c/p\u003e\n"},{"n":2,"title":"Silent Push Enables Cybersecurity Companies to Build Proactive Security Products with First-Party Infrastructure Intelligence","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/press-releases/oem-pgm/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=oem-pgm","time":"09:59","priority":"MAY READ","score":45,"tldr":"Silent Push is expanding API access to its first-party infrastructure intelligence so cybersecurity vendors can build products that detect adversary infrastructure before attacks begin. The offering includes preemptive Indicators of Future Attack, historical DNS/WHOIS data, behavioral fingerprinting, Traffic Origin data, and integrations for automated and AI-driven security workflows.","briefOverview":"\u003cp\u003eSilent Push announced expanded access to its proprietary first-party infrastructure intelligence platform for cybersecurity companies. The API-first offering allows product teams, research teams, and cyber threat intelligence organizations to integrate Silent Push data into their products and workflows. The company says this data powers its own threat detection and research capabilities.\u003c/p\u003e\n\n\u003cp\u003eSilent Push contrasts its approach with traditional threat intelligence that relies on indicators after an attack has occurred. Its Indicators of Future Attack are described as identifying adversary infrastructure while it is still being built, an average of 104 days before it is weaponized. The company says this can help cybersecurity vendors deliver earlier detection, richer context, and more proactive protection for customers.\u003c/p\u003e\n\n\u003cp\u003eKey capabilities include API access for enrichment, scoring, infrastructure context, bulk lookups, and automated workflows, along with MCP Server integration for AI-native and agentic security environments. The offering also includes historical DNS and WHOIS intelligence, behavioral fingerprinting, Traffic Origin data, and custom intelligence feeds tailored to threat categories, geographies, or infrastructure patterns. Silent Push says deployment options include direct Data API access, MCP Server integration, full platform access for research teams, and customized intelligence feeds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push is expanding access to its proprietary first-party infrastructure intelligence platform for cybersecurity companies through flexible APIs and integrations.","Silent Push says its Indicators of Future Attack identify adversary infrastructure while it is still being built, an average of 104 days before it is weaponized.","The offering is designed for cybersecurity product and research teams as well as cyber threat intelligence organizations that want to enhance detection capabilities, accelerate research, and differentiate their offerings.","Key capabilities include API-first integration, MCP Server integration, historical DNS and WHOIS intelligence, behavioral fingerprinting, Traffic Origin data, and custom intelligence feeds.","Silent Push offers deployment options including direct Data API access, MCP Server integration for AI workflows, full platform access for research teams, and customized intelligence feeds."],"insights":["Silent Push is positioning its data as first-party intelligence that is not available through third-party feeds or recycled threat intelligence, making exclusivity a central differentiator for cybersecurity vendors.","The article frames the offering as useful not only for detection products but also for customer-facing threat intelligence and published research, indicating the data is intended to support both operational and market-facing use cases.","MCP Server integration is included alongside API access, showing Silent Push is explicitly targeting AI-native and agentic security environments as part of its distribution strategy.","The ability to tailor feeds by threat category, geography, or infrastructure pattern gives vendors a way to embed more specialized intelligence into products rather than relying only on broad, general-purpose data feeds."],"referencedReports":[],"body":"\u003cp\u003eSilent Push announced expanded access to its proprietary first-party infrastructure intelligence platform for cybersecurity companies. The API-first offering allows product teams, research teams, and cyber threat intelligence organizations to integrate Silent Push data into their products and workflows. The company says this data powers its own threat detection and research capabilities.\u003c/p\u003e\n\n\u003cp\u003eSilent Push contrasts its approach with traditional threat intelligence that relies on indicators after an attack has occurred. Its Indicators of Future Attack are described as identifying adversary infrastructure while it is still being built, an average of 104 days before it is weaponized. The company says this can help cybersecurity vendors deliver earlier detection, richer context, and more proactive protection for customers.\u003c/p\u003e\n\n\u003cp\u003eKey capabilities include API access
