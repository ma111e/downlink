<script type="application/json" id="dl-articles">[{"n":1,"title":"Check Point warns of SmartConsole zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-patches-smartconsole-zero-day-exploited-in-attacks/","time":"08:13","priority":"MUST READ","score":96,"tldr":"Check Point patched an actively exploited SmartConsole zero-day, CVE-2026-16232, that lets unauthenticated attackers obtain admin tokens and change security policies on exposed management servers. Admins should patch urgently, restrict Trusted Clients and management access, and check audit logs for signs of compromise.","briefOverview":"\u003cp\u003eCheck Point Software has addressed an actively exploited zero-day flaw in its SmartConsole graphical user interface admin panel. The flaw is tracked as CVE-2026-16232 and is an authentication bypass vulnerability. It allows unauthenticated attackers to obtain an application login token that can be used to authenticate with administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to a vulnerable Security Management Server or Multi-Domain Security Management Server, attackers can change the security configuration and security policy. Check Point said successful remote exploitation requires internet access to the Management Server IP address and a configuration that does not restrict Trusted Clients. The company said it is aware the vulnerability is being exploited and has affected a very small number of customers.\u003c/p\u003e\n\n\u003cp\u003eAdmins who cannot immediately upgrade are advised to follow Check Point hardening guidance, limit Trusted Clients to trusted IP addresses or subnets, and block management access for non-authorized IP addresses. Check Point also provided a way to check SmartConsole audit logs for signs of compromise by searching for “Authentication method: application token” after running a query for listed IP addresses. CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to patch vulnerable SmartConsole instances by July 25.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point addressed an actively exploited zero-day flaw in its SmartConsole graphical user interface admin panel.","CVE-2026-16232 is an authentication bypass vulnerability that lets unauthenticated attackers obtain an application login token and authenticate with administrator privileges.","Successful exploitation can allow attackers to change the security configuration and security policy on a vulnerable Security Management Server or Multi-Domain Security Management Server.","Check Point said remote exploitation requires internet access to the Management Server IP address and a configuration that does not restrict Trusted Clients.","CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to patch vulnerable SmartConsole instances by July 25."],"insights":["Exposure is narrowed by two specific conditions: remote exploitation requires the Management Server IP to be reachable from the internet and Trusted Clients not to be restricted.","Organizations that cannot patch immediately still have concrete mitigations available: restrict Trusted Clients to trusted IP addresses or subnets and block management access from unauthorized IP addresses.","Check Point provided a specific audit-log hunting method, including the phrase “Authentication method: application token” and a set of IP addresses to query in SmartConsole.","CISA gave federal agencies an unusually short remediation window, requiring vulnerable SmartConsole instances to be patched by July 25 after adding CVE-2026-16232 to the Known Exploited Vulnerabilities catalog.","The article places this flaw in a pattern of recent Check Point issues exploited in the wild, citing separate Check Point vulnerabilities in 2026 and 2024 that were also tied to active exploitation."],"referencedReports":[{"title":"Check Point advisory for CVE-2026-16232","url":"https://support.checkpoint.com/results/sk/sk185169/","publisher":"Check Point","context":"The article cites Check Point's advisory describing the actively exploited SmartConsole authentication bypass and required exposure conditions.","category":"","primary":false},{"title":"Check Point Hardening Best Practices Guide","url":"https://sc1.checkpoint.com/documents/Check_Point_Gateway_and_Management_Hardening/CP_Check_Point_Gateway_and_Management_Hardening.pdf","publisher":"Check Point","context":"The article says admins who cannot immediately upgrade should follow this hardening guide and restrict management access.","category":"","primary":false},{"title":"CISA Known Exploited Vulnerabilities Catalog entry for CVE-2026-16232","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-16232","publisher":"CISA","context":"The article says CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to patch vulnerable instances.","category":"","primary":false},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/22/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article quotes CISA warning that this type of vulnerability is a frequent attack vector and poses significant risks to the federal enterprise.","category":"","primary":false},{"title":"Meet NailaoLocker: A ransomware distributed in Europe by ShadowPad and PlugX backdoors","url":"https://www.orangecyberdefense.com/global/blog/cert-news/meet-nailaolocker-a-ransomware-distributed-in-europe-by-shadowpad-and-plugx-backdoors","publisher":"Orange Cyberdefense CERT","context":"The article references this CERT report as linking a previous Check Point flaw to NailaoLocker ransomware attacks.","category":"","primary":false}],"body":"\u003cp\u003eCheck Point Software has addressed an actively exploited zero-day flaw in its SmartConsole graphical user interface admin panel. The flaw is tracked as CVE-2026-16232 and is an authentication bypass vulnerability. It allows unauthenticated attackers to obtain an application login token that can be used to authenticate with administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to a vulnerable Security Management Server or Multi-Domain Security Management Server, attackers can change the security configuration and security policy. Check Point said successful remote exploitation requires internet access to the Management Server IP address and a configuration that does not restrict Trusted Clients. The company said it is aware the vulnerability is being exploited and has affected a very small number of customers.\u003c/p\u003e\n\n\u003cp\u003eAdmins who cannot immediately upgrade are advised to follow Check Point hardening guidance, limit Trusted Clients to trusted IP addresses or subnets, and block management access for non-authorized IP addresses. Check Point also provided a way to check SmartConsole audit logs for signs of compromise by searching for “Authentication method: application token” after running a query for listed IP addresses. CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal agencies to patch vulnerable SmartConsole instances by July 25.\u003c/p\u003e\n"},{"n":4,"title":"Check Point Patches Exploited SmartConsole Flaw Allowing Full Admin Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/check-point-patches-exploited.html","time":"06:34","priority":"MUST READ","score":95,"tldr":"Check Point released urgent fixes for actively exploited SmartConsole and management server flaws, including a critical authentication bypass that can give remote attackers full administrative access when management interfaces are exposed to the internet without Trusted Client restrictions. Customers should apply the July 22 Jumbo hotfix and restrict management access to trusted IPs immediately.","briefOverview":"\u003cp\u003eCheck Point released security updates for multiple vulnerabilities affecting its Security Management and Multi-Domain Management products. The most severe issue, CVE-2026-16232, is a critical SmartConsole authentication bypass with a CVSS score of 9.3 that has been actively exploited in the wild. Check Point said a small number of customers were targeted and that it has already notified them.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-16232 affects the Check Point SmartConsole login process and can allow an unauthenticated remote attacker to obtain an application login token and authenticate with full administrative privileges. Successful exploitation could let an attacker modify security policies and security configurations. Check Point said the issue affects a specific configuration in which Management is exposed directly to the internet without IP restrictions.\u003c/p\u003e\n\n\u003cp\u003eThe company also patched CVE-2026-62144, an authentication bypass that can allow unauthenticated remote administrative command execution, and CVE-2026-62145, a Gaia Portal privilege management flaw that can allow a read-only user to execute commands with root privileges. Customers are advised to apply the July 22 Jumbo hotfix, limit Trusted Clients to trusted IP addresses or subnets, secure Management access with Firewall, and restrict access to trusted IP addresses. CISA added the exploited flaw to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 25, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point released security updates for vulnerabilities affecting Security Management and Multi-Domain Management products, including a critical flaw that is being actively exploited.","CVE-2026-16232 is an authentication bypass in the Check Point SmartConsole login process that can allow an unauthenticated remote attacker to obtain an application login token and authenticate with full administrative privileges.","Check Point said the exploited flaw affects a very specific configuration where Management is exposed directly to the internet without IP restrictions.","The updates also address CVE-2026-62144, which can allow unauthenticated remote attackers to execute administrative commands, and CVE-2026-62145, which can allow a read-only Gaia Portal user to execute commands with root privileges.","CISA added CVE-2026-16232 to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 25, 2026."],"insights":["The highest-risk exposure is not just running an affected version, but having the Management Server reachable from the internet without Trusted Clients limited to specific IP addresses or subnets.","CVE-2026-16232 can turn access to the SmartConsole login process into full administrative control, making management-plane exposure a direct path to changing security policies and configurations.","Check Point published specific malicious IP addresses tied to the activity, giving customers concrete indicators to check while applying the July 22 Jumbo hotfix.","CISA’s July 25, 2026 remediation deadline for federal civilian agencies shows the active exploitation is considered urgent enough to require fixes within days."],"referencedReports":[{"title":"Security Advisory: Action Required – Active Exploitation of Check Point SmartConsole Authentication Bypass (CVE-2026-16232)","url":"https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-check-point-smartconsole-authentication-bypass-cve-2026-16232/","publisher":"Check Point","context":"The article cites Check Point's security advisory as the source for the released updates addressing actively exploited vulnerabilities.","category":"","primary":false},{"title":"CVE-2026-16232","url":"https://support.checkpoint.com/results/sk/sk185169/","publisher":"Check Point","context":"The article links to Check Point's advisory page for the critical SmartConsole authentication bypass vulnerability.","category":"","primary":false},{"title":"CVE-2026-62144","url":"https://support.checkpoint.com/results/sk/sk185152/","publisher":"Check Point","context":"The article links to Check Point's advisory page for the authentication bypass flaw in Security Management and Multi-Domain Security Management.","category":"","primary":false},{"title":"CVE-2026-62145","url":"https://support.checkpoint.com/results/sk/sk185153/","publisher":"Check Point","context":"The article links to Check Point's advisory page for the Gaia Portal improper privilege management vulnerability.","category":"","primary":false},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/22/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA's alert adding the Check Point flaw to its Known Exploited Vulnerabilities catalog and setting a remediation deadline for federal agencies.","category":"","primary":false}],"body":"\u003cp\u003eCheck Point released security updates for multiple vulnerabilities affecting its Security Management and Multi-Domain Management products. The most severe issue, CVE-2026-16232, is a critical SmartConsole authentication bypass with a CVSS score of 9.3 that has been actively exploited in the wild. Check Point said a small number of customers were targeted and that it has already notified them.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-16232 affects the Check Point SmartConsole login process and can allow an unauthenticated remote attacker to obtain an application login token and authenticate with full administrative privileges. Successful exploitation could let an attacker modify security policies and security configurations. Check Point said the issue affects a specific configuration in which Management is exposed directly to the internet without IP restrictions.\u003c/p\u003e\n\n\u003cp\u003eThe company also patched CVE-2026-62144, an authentication bypass that can allow unauthenticated remote administrative command execution, and CVE-2026-62145, a Gaia Portal privilege management flaw that can allow a read-only user to execute commands with root privileges. Customers are advised to apply the July 22 Jumbo hotfix, limit Trusted Clients to trusted IP addresses or subnets, secure Management access with Firewall, and restrict access to trusted IP addresses. CISA added the exploited flaw to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 25, 2026.\u003c/p\u003e\n"},{"n":5,"title":"Nine-Year-Old RefluXFS Linux Flaw Gives Local Users Root on Default RHEL Installs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/nine-year-old-refluxfs-linux-flaw-gives.html","time":"08:04","priority":"MUST READ","score":92,"tldr":"A nine-year-old Linux kernel flaw in XFS reflink handling, CVE-2026-64600 “RefluXFS,” can let local unprivileged users overwrite root-owned files and gain persistent root on affected default RHEL-family, Fedora Server, and Amazon Linux installs. Administrators should install the fixed kernel and reboot, as there is no practical mitigation once an XFS filesystem was created with reflink enabled.","briefOverview":"\u003cp\u003eRefluXFS, tracked as \u003ccode\u003eCVE-2026-64600\u003c/code\u003e, is a Linux kernel flaw disclosed on July 22 that lets an unprivileged local user overwrite root-owned files on an XFS filesystem and gain persistent root access. Qualys said default installations of Red Hat Enterprise Linux and its derivatives, Fedora Server, and Amazon Linux can meet the conditions for exploitation. The overwrite happens at the block layer, survives reboot, and leaves ownership, permissions, timestamps, and the setuid bit unchanged.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires Linux 4.11 or later without the fix, an XFS filesystem created with \u003ccode\u003ereflink=1\u003c/code\u003e, and a readable target plus an attacker-writable directory on the same XFS filesystem. The bug is a race in XFS reflink handling where the kernel uses a stale data-fork mapping after dropping and reacquiring a lock. Qualys demonstrated the race against \u003ccode\u003e/etc/passwd\u003c/code\u003e and setuid-root binaries, and said the race usually won in under ten seconds on its test machine.\u003c/p\u003e\n\n\u003cp\u003eThe fix was merged upstream on July 16, and vendors have begun shipping backported kernels, including Red Hat advisories across affected RHEL 8, 9, and 10 streams. Debian’s tracker listed fixes for some branches while other releases were still marked vulnerable as of July 23. Qualys said there is no practical mitigation or temporary configuration change, and the article says administrators must install the vendor kernel update, reboot, and verify the fixed kernel is running.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["RefluXFS, tracked as CVE-2026-64600, is a Linux kernel flaw disclosed on July 22 that lets an unprivileged local user overwrite root-owned files on an XFS filesystem and gain persistent root access.","Qualys said default installations of Red Hat Enterprise Linux and its derivatives, Fedora Server, and Amazon Linux can meet the conditions for exploitation when XFS was created with reflink enabled.","Exploitation requires Linux 4.11 or later without the RefluXFS fix, an XFS filesystem created with reflink=1, and a readable target plus an attacker-writable directory on the same XFS filesystem.","The upstream fix was merged on July 16, and vendors including Red Hat and Debian have begun shipping backported kernel updates for affected releases.","Qualys said there is no practical mitigation or temporary configuration change, so systems must install the vendor kernel update and reboot to run the fixed kernel."],"insights":["The overwrite happens at the block layer and bypasses the target file’s normal metadata path, so ownership, permissions, timestamps, and the setuid bit can remain unchanged even after a protected file is modified.","Qualys reported that SELinux in Enforcing mode, seccomp, kernel lockdown, and container boundaries did not stop exploitation in its testing, leaving patching and rebooting as the required response.","Red Hat errata for some affected streams began landing on July 14, before the public disclosure on July 22, so organizations may already be protected if they applied those kernel updates and rebooted.","The patch fixed two XFS helper functions with the same lock-cycle pattern, including one that the article says did not appear in the Qualys advisory.","Qualys said Anthropic’s restricted-access Claude Mythos Preview model found the race, wrote a working root exploit, and drafted the advisory before researchers reproduced and validated the issue."],"referencedReports":[{"title":"RefluXFS: A Linux Kernel Local Privilege Escalation to Root in XFS (CVE-2026-64600)","url":"https://blog.qualys.com/vulnerabilities-threat-research/2026/07/22/refluxfs-a-linux-kernel-local-privilege-escalation-to-root-in-xfs-cve-2026-64600","publisher":"Qualys","context":"The article cites Qualys’s vulnerability research as the source for affected default installations, exploitation conditions, and patching priority.","category":"","primary":false},{"title":"RefluXFS Technical Advisory","url":"https://cdn2.qualys.com/advisory/2026/07/22/RefluXFS.txt","publisher":"Qualys","context":"The article references Qualys’s technical advisory for details on how the AI model was used and for exploitation steps.","category":"","primary":false},{"title":"CVE-2026-64600","url":"https://access.redhat.com/security/cve/CVE-2026-64600","publisher":"Red Hat","context":"The article cites Red Hat’s security page while describing Important-rated kernel advisories for affected RHEL streams.","category":"","primary":false},{"title":"CVE-2026-64600","url":"https://security-tracker.debian.org/tracker/CVE-2026-64600","publisher":"Debian","context":"The article cites Debian’s security tracker for the status of fixed and vulnerable kernel versions across Debian releases.","category":"","primary":false}],"body":"\u003cp\u003eRefluXFS, tracked as \u003ccode\u003eCVE-2026-64600\u003c/code\u003e, is a Linux kernel flaw disclosed on July 22 that lets an unprivileged local user overwrite root-owned files on an XFS filesystem and gain persistent root access. Qualys said default installations of Red Hat Enterprise Linux and its derivatives, Fedora Server, and Amazon Linux can meet the conditions for exploitation. The overwrite happens at the block layer, survives reboot, and leaves ownership, permissions, timestamps, and the setuid bit unchanged.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires Linux 4.11 or later without the fix, an XFS filesystem created with \u003ccode\u003ereflink=1\u003c/code\u003e, and a readable target plus an attacker-writable directory on the same XFS filesystem. The bug is a race in XFS reflink handling where the kernel uses a stale data-fork mapping after dropping and reacquiring a lock. Qualys demonstrated the race against \u003ccode\u003e/etc/passwd\u003c/code\u003e and setuid-root binaries, and said the race usually won in under ten seconds on its test machine.\u003c/p\u003e\n\n\u003cp\u003eThe fix was merged upstream on July 16, and vendors have begun shipping backported kernels, including Red Hat advisories across affected RHEL 8, 9, and 10 streams. Debian’s tracker listed fixes for some branches while other releases were still marked vulnerable as of July 23. Qualys said there is no practical mitigation or temporary configuration change, and the article says administrators must install the vendor kernel update, reboot, and verify the fixed kernel is running.\u003c/p\u003e\n"},{"n":2,"title":"New msaRAT malware uses Chrome, Edge browsers to route C2 traffic","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-msarat-malware-uses-chrome-edge-browsers-to-route-c2-traffic/","time":"09:59","priority":"SHOULD READ","score":86,"tldr":"The Chaos ransomware gang is using a new Rust backdoor called msaRAT that hides its command-and-control traffic by controlling headless Chrome or Edge through the Chrome DevTools Protocol. Its use of Cloudflare Workers, WebRTC, and Twilio TURN relays makes the attacker infrastructure harder to detect and trace.","briefOverview":"\u003cp\u003eThe Chaos ransomware gang is using a new Rust-based backdoor called msaRAT that hides command-and-control communication by routing it through Chrome or Edge. Cisco Talos observed recent Chaos ransomware attacks beginning with email or voice phishing, followed by the installation of remote management software for persistence. Once inside, the attacker downloaded an MSI installer posing as a Windows update, which loaded msaRAT directly in system memory as lib.dll.\u003c/p\u003e\n\n\u003cp\u003emsaRAT searches for Chrome or Microsoft Edge, launches the browser in headless mode, enables the remote debugging interface, and connects through the Chrome DevTools Protocol. It opens a new browser tab and injects JavaScript that builds the communication channel, bypasses Chrome’s Content Security Policy, and registers bindings that enable communications. The browser then contacts a Cloudflare Workers endpoint to obtain WebRTC connection information and establish an encrypted channel.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos says the malware uses WebRTC DTLS plus ChaCha20-Poly1305 and ECDH encryption, while relaying communications through Twilio TURN servers to avoid direct peer-to-peer connections. This design prevents the attacker’s real server IP address from appearing in network traffic and makes tracing the infrastructure significantly more difficult. The article notes that blocking the workers.dev domain broadly could disrupt legitimate Cloudflare Workers deployments, and Cisco Talos published indicators of compromise for attacks using msaRAT.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Chaos ransomware gang is using a new Rust-based backdoor called msaRAT that routes command-and-control communication through Chrome or Edge browsers.","Cisco Talos observed recent Chaos ransomware attacks that began with email or voice phishing and continued with remote management software used for persistence.","Attackers downloaded an MSI installer posing as a Windows update, which loaded msaRAT as lib.dll directly in system memory.","msaRAT launches Chrome or Microsoft Edge in headless mode, enables the browser’s remote debugging interface, and uses the Chrome DevTools Protocol to inject JavaScript into a new browser tab.","The malware uses Cloudflare Workers, WebRTC, Twilio TURN servers, and two layers of encryption to hide the attacker’s server and make the traffic look like normal web activity."],"insights":["msaRAT lowers detection risk because it does not directly connect to the attacker’s command-and-control infrastructure, instead burying its exchanges inside browser-generated web traffic.","The malware’s use of Cloudflare Workers and Twilio TURN means the attacker’s real server IP address does not appear in network traffic, making tracing the infrastructure significantly harder.","Blocking the workers.dev domain broadly would disrupt legitimate Cloudflare Workers deployments, limiting the practicality of simple domain-wide blocking as a defense.","The attackers intentionally omit normal WebRTC ICE candidates so communications are forced through TURN relays rather than direct peer-to-peer connections."],"referencedReports":[{"title":"Chaos msaRAT indicators of compromise","url":"http://github.com/Cisco-Talos/IOCs/blob/main/2026/07/chaos-msarat.txt","publisher":"Cisco Talos","context":"The article says Cisco Talos shares a complete list of indicators of compromise associated with attacks using the msaRAT backdoor.","category":"","primary":false}],"body":"\u003cp\u003eThe Chaos ransomware gang is using a new Rust-based backdoor called msaRAT that hides command-and-control communication by routing it through Chrome or Edge. Cisco Talos observed recent Chaos ransomware attacks beginning with email or voice phishing, followed by the installation of remote management software for persistence. Once inside, the attacker downloaded an MSI installer posing as a Windows update, which loaded msaRAT directly in system memory as lib.dll.\u003c/p\u003e\n\n\u003cp\u003emsaRAT searches for Chrome or Microsoft Edge, launches the browser in headless mode, enables the remote debugging interface, and connects through the Chrome DevTools Protocol. It opens a new browser tab and injects JavaScript that builds the communication channel, bypasses Chrome’s Content Security Policy, and registers bindings that enable communications. The browser then contacts a Cloudflare Workers endpoint to obtain WebRTC connection information and establish an encrypted channel.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos says the malware uses WebRTC DTLS plus ChaCha20-Poly1305 and ECDH encryption, while relaying communications through Twilio TURN servers to avoid direct peer-to-peer connections. This design prevents the attacker’s real server IP address from appearing in network traffic and makes tracing the infrastructure significantly more difficult. The article notes that blocking the workers.dev domain broadly could disrupt legitimate Cloudflare Workers deployments, and Cisco Talos published indicators of compromise for attacks using msaRAT.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft working to fix Exchange Online mailbox quarantine issue","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-working-to-fix-exchange-online-mailbox-quarantine-issue/","time":"09:20","priority":"SHOULD READ","score":78,"tldr":"Microsoft is working to fix an Exchange Online incident that has incorrectly quarantined some mailboxes, preventing affected users from sending or receiving email and accessing calendars. The issue was caused by a recent infrastructure change that led to excessive memory consumption, and Microsoft is still cleaning up indexing data to restore service.","briefOverview":"\u003cp\u003eMicrosoft is working to resolve an ongoing Exchange Online issue that has been mistakenly quarantining customers\u0026rsquo; mailboxes since Sunday. The incident is tracked as EX1436407 and began on July 19. Affected users have experienced problems receiving and sending emails and accessing their calendars.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the issue may block some users from receiving email because their mailboxes were incorrectly quarantined, and senders may receive a Non-delivery Report. The company linked the problem to a recent infrastructure change that caused excessive memory consumption from unexpected indexing data. This led to an out-of-memory condition that triggered the incorrect mailbox quarantines.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the incident is a recurrence of a previous issue tracked as EX1434354 and that additional remediation steps were needed for full restoration. Cleanup of excess indexing data progressed from 66% complete on Wednesday afternoon to 72% complete by Wednesday evening, with mailboxes gradually removed from quarantine as memory levels are validated in different regions. Microsoft has not disclosed the impacted regions or number of affected customers and has not yet provided a completion timeline.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is working to resolve an Exchange Online issue, tracked as EX1436407, that has been incorrectly quarantining some customers' mailboxes since July 19.","Affected Exchange Online users may have trouble receiving and sending emails and accessing their calendars, while senders may receive non-delivery reports when emailing quarantined mailboxes.","Microsoft said a recent infrastructure change caused excessive memory consumption from unexpected indexing data, leading to an out-of-memory condition that incorrectly quarantined mailboxes.","Microsoft identified the incident as a recurrence of a previous issue tracked as EX1434354 and said additional remediation steps were required for full restoration.","Microsoft reported that cleanup of excess indexing data had progressed from 66% to 72% complete on Wednesday, but it had not yet provided a timeline for full remediation."],"insights":["The issue is a recurrence of a previous Exchange Online incident, EX1434354, indicating Microsoft’s earlier remediation was not sufficient for full restoration.","Microsoft classified the problem as an incident, which the article notes usually means there is noticeable user impact, even though Microsoft has not disclosed affected regions or customer counts.","Recovery is tied to cleanup of excess indexing data and validation of memory levels by region, so restoration is gradual rather than an immediate global fix.","The article places this incident in a pattern of recent Microsoft email-filtering problems, including multiple cases in 2025 where legitimate emails or URLs were wrongly quarantined, blocked, or flagged."],"referencedReports":[{"title":"EX1436407","url":"http://admin.microsoft.com/#/MessageCenter/:/messages/EX1436407","publisher":"Microsoft","context":"The article says the ongoing Exchange Online mailbox quarantine incident is tracked by Microsoft under EX1436407.","category":"","primary":false},{"title":"EX1434354","url":"http://admin.microsoft.com/#/MessageCenter/:/messages/EX1434354","publisher":"Microsoft","context":"The article says the current incident is a recurrence of a previous Microsoft issue tracked as EX1434354.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft is working to resolve an ongoing Exchange Online issue that has been mistakenly quarantining customers\u0026rsquo; mailboxes since Sunday. The incident is tracked as EX1436407 and began on July 19. Affected users have experienced problems receiving and sending emails and accessing their calendars.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the issue may block some users from receiving email because their mailboxes were incorrectly quarantined, and senders may receive a Non-delivery Report. The company linked the problem to a recent infrastructure change that caused excessive memory consumption from unexpected indexing data. This led to an out-of-memory condition that triggered the incorrect mailbox quarantines.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the incident is a recurrence of a previous issue tracked as EX1434354 and that additional remediation steps were needed for full restoration. Cleanup of excess indexing data progressed from 66% complete on Wednesday afternoon to 72% complete by Wednesday evening, with mailboxes gradually removed from quarantine as memory levels are validated in different regions. Microsoft has not disclosed the impacted regions or number of affected customers and has not yet provided a completion timeline.\u003c/p\u003e\n"}]</script>
