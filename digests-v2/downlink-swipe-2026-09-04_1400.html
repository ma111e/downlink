<script type="application/json" id="dl-articles">[{"n":3,"title":"Critical Citrix NetScaler auth bypass now leveraged in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-target-critical-citrix-netscaler-auth-bypass-in-attacks/","time":"15:25","priority":"MUST READ","score":94,"tldr":"Attackers are now attempting to exploit CVE-2026-19490, a critical Citrix NetScaler authentication bypass flaw affecting certain ADC and Gateway configurations. Admins should urgently review exposure and patch vulnerable NetScaler appliances.","briefOverview":"\u003cp\u003eAttackers have begun targeting a critical Citrix NetScaler flaw tracked as CVE-2026-19490, according to vulnerability intelligence company Previdian. The flaw can allow unprivileged threat actors to bypass authentication remotely when a NetScaler appliance is configured as an AAA virtual server or as a Gateway, depending on firmware version and whether SAML Action is configured. Citrix addressed the issue in mid-August and urged customers to review its security bulletin, assess affected deployments, and upgrade impacted appliances to recommended builds as soon as possible.\u003c/p\u003e\n\n\u003cp\u003ePrevidian founder Ryan Dewhurst told BleepingComputer that attackers began targeting CVE-2026-19490 after a credible proof-of-concept exploit was published online. On September 3, one of Previdian’s NetScaler sensors received requests matching the proof of concept from three distinct source IPs geolocated to Australia, the United States, and Germany. Dewhurst said this provides evidence of exploitation attempts, but does not confirm successful compromise of real-world systems.\u003c/p\u003e\n\n\u003cp\u003eThe Centre for Cybersecurity Belgium also warned of exploitation attempts and urged administrators to prioritize patching vulnerable Citrix NetScaler appliances. Shadowserver tracks more than 22,000 NetScaler ADC appliances and nearly 1,700 Gateway instances exposed online, but the article says it is unknown how many are honeypots, vulnerable, or already patched. The article also notes that CISA has tagged 23 Citrix vulnerabilities as exploited in the wild since November 2021, including six abused by ransomware gangs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers have begun targeting CVE-2026-19490, a critical Citrix NetScaler flaw, according to vulnerability intelligence company Previdian.","CVE-2026-19490 can allow unprivileged threat actors to bypass authentication remotely when NetScaler is configured as an AAA virtual server or as a Gateway, depending on firmware version and whether SAML Action is configured.","Citrix addressed CVE-2026-19490 in mid-August and urged administrators to upgrade impacted NetScaler ADC and NetScaler Gateway appliances to recommended builds as soon as possible.","Previdian founder Ryan Dewhurst said a NetScaler sensor received requests matching a published proof-of-concept exploit from three source IPs geolocated to Australia, the United States, and Germany on September 3.","The Centre for Cybersecurity Belgium also warned of exploitation attempts targeting CVE-2026-19490 and urged administrators to prioritize patching vulnerable Citrix NetScaler appliances."],"insights":["Previdian’s evidence shows exploitation attempts matching the public proof-of-concept, but it does not confirm that any real-world systems were successfully compromised.","Citrix’s advisory had not yet marked CVE-2026-19490 as actively exploited even though Previdian and the Centre for Cybersecurity Belgium reported exploitation attempts.","Exposure counts alone are not enough to determine risk, because Shadowserver’s totals do not show how many NetScaler instances are honeypots, vulnerable configurations, or already patched.","The March NetScaler flaws show a narrow patching window, as Citrix urged admins to patch CVE-2026-3055 and CVE-2026-4368 only days before threat actors began exploiting them."],"referencedReports":[{"title":"NetScaler ADC and NetScaler Gateway Security Bulletin for CVE-2026-19490","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX696939","publisher":"Citrix","context":"The article says Citrix warned customers in its official NetScaler ADC and NetScaler Gateway security bulletin to assess affected deployments and upgrade impacted appliances.","category":"advisory","primary":false},{"title":"CVE-2026-19490","url":"https://previdian.com/CVE-2026-19490","publisher":"Previdian","context":"The article cites Previdian as reporting that attackers have begun targeting CVE-2026-19490 in the wild after a credible proof-of-concept exploit was published online.","category":"research","primary":true},{"title":"Warning: Critical authentication bypass in Citrix NetScaler ADC \u0026 NetScaler Gateway — patch now","url":"https://ccb.belgium.be/advisories/warning-critical-authentication-bypass-citrix-netscaler-adc-netscaler-gateway-patch","publisher":"Centre for Cybersecurity Belgium","context":"The article says the Centre for Cybersecurity Belgium warned of exploitation attempts targeting CVE-2026-19490 and urged administrators to prioritize patching vulnerable Citrix NetScaler appliances.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers have begun targeting a critical Citrix NetScaler flaw tracked as CVE-2026-19490, according to vulnerability intelligence company Previdian. The flaw can allow unprivileged threat actors to bypass authentication remotely when a NetScaler appliance is configured as an AAA virtual server or as a Gateway, depending on firmware version and whether SAML Action is configured. Citrix addressed the issue in mid-August and urged customers to review its security bulletin, assess affected deployments, and upgrade impacted appliances to recommended builds as soon as possible.\u003c/p\u003e\n\n\u003cp\u003ePrevidian founder Ryan Dewhurst told BleepingComputer that attackers began targeting CVE-2026-19490 after a credible proof-of-concept exploit was published online. On September 3, one of Previdian’s NetScaler sensors received requests matching the proof of concept from three distinct source IPs geolocated to Australia, the United States, and Germany. Dewhurst said this provides evidence of exploitation attempts, but does not confirm successful compromise of real-world systems.\u003c/p\u003e\n\n\u003cp\u003eThe Centre for Cybersecurity Belgium also warned of exploitation attempts and urged administrators to prioritize patching vulnerable Citrix NetScaler appliances. Shadowserver tracks more than 22,000 NetScaler ADC appliances and nearly 1,700 Gateway instances exposed online, but the article says it is unknown how many are honeypots, vulnerable, or already patched. The article also notes that CISA has tagged 23 Citrix vulnerabilities as exploited in the wild since November 2021, including six abused by ransomware gangs.\u003c/p\u003e\n"},{"n":2,"title":"IDScan sued over alleged data breach affecting 153 million drivers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/idscan-sued-over-alleged-data-breach-affecting-153-million-drivers/","time":"16:56","priority":"MUST READ","score":92,"tldr":"IDScan is facing multiple lawsuits after hackers allegedly stole and offered to sell data from more than 153 million driver’s licenses and other identity documents. The FBI is reportedly investigating, while IDScan has not publicly confirmed the breach or how many people were affected.","briefOverview":"\u003cp\u003eMultiple lawsuits have been filed against identity verification company IDScan after hackers allegedly breached the service and offered to sell more than 153 million driver’s licenses. Law firms including Markovits, Stock \u0026amp; DeMarco and Hall Attorneys have launched investigations into potential class-action litigation tied to the reported incident. The lawsuits were filed in Louisiana, where IDScan is based, and allege that IDScan failed to protect information from its clients, including global car rental company Hertz.\u003c/p\u003e\n\n\u003cp\u003eBrian Krebs reported that a dark-web identity-theft service called Nexus advertised access to more than 153 million U.S. and Canadian driver’s license scans, 10 million ID cards, 3 million travel documents, and 579,000 medical cards. Krebs verified samples by searching the database for his own records and those of other consenting individuals, and tracked the leak to IDScan. IDScan provides hardware and software used by businesses to scan, authenticate, and extract information from government-issued identity documents.\u003c/p\u003e\n\n\u003cp\u003eIDScan’s systems are used across the U.S. by car rental firms, retailers, gun shops, financial institutions, cannabis dispensaries, and hospitality establishments. The company has not published a statement or responded to BleepingComputer’s requests for comment, and it remains unclear whether IDScan’s systems were compromised or how many people were affected. The FBI’s New Orleans office has reportedly launched an investigation, and the Nexus service is no longer online, although the article states that cybercriminals still have access to the database.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Multiple lawsuits have been filed against identity verification company IDScan after hackers allegedly breached the service and offered to sell more than 153 million driver’s licenses.","Brian Krebs reported that a dark-web identity-theft service called Nexus advertised access to more than 153 million U.S. and Canadian driver’s license scans, 10 million ID cards, 3 million travel documents, and 579,000 medical cards.","IDScan provides hardware and software used by businesses including car rental firms, retailers, gun shops, financial institutions, cannabis dispensaries, and hospitality establishments to scan and authenticate government-issued identity documents.","The FBI’s New Orleans office has reportedly launched an investigation into the incident, but the agency has not issued an official statement as of publication.","IDScan has not published a statement or responded to BleepingComputer’s requests for comment, and it remains unclear whether IDScan’s systems were compromised or how many people were affected."],"insights":["The alleged exposure may extend well beyond IDScan’s direct customers because people whose IDs were scanned through any business using IDScan’s systems could be affected.","The reported data set is unusually broad for an identity-document incident because it allegedly includes driver’s license scans, ID cards, travel documents, and medical cards.","Although the Nexus service is no longer online, the article states that cybercriminals still have access to the database, so taking down the marketplace did not remove the exposed data.","The lawsuits target IDScan in Louisiana and allege failures involving client information, indicating that affected businesses such as Hertz may also be central to the legal fallout.","IDScan has reportedly begun notifying some business customers, but the company has not publicly confirmed the incident, leaving individuals without a clear official account of whether their documents were exposed."],"referencedReports":[],"body":"\u003cp\u003eMultiple lawsuits have been filed against identity verification company IDScan after hackers allegedly breached the service and offered to sell more than 153 million driver’s licenses. Law firms including Markovits, Stock \u0026amp; DeMarco and Hall Attorneys have launched investigations into potential class-action litigation tied to the reported incident. The lawsuits were filed in Louisiana, where IDScan is based, and allege that IDScan failed to protect information from its clients, including global car rental company Hertz.\u003c/p\u003e\n\n\u003cp\u003eBrian Krebs reported that a dark-web identity-theft service called Nexus advertised access to more than 153 million U.S. and Canadian driver’s license scans, 10 million ID cards, 3 million travel documents, and 579,000 medical cards. Krebs verified samples by searching the database for his own records and those of other consenting individuals, and tracked the leak to IDScan. IDScan provides hardware and software used by businesses to scan, authenticate, and extract information from government-issued identity documents.\u003c/p\u003e\n\n\u003cp\u003eIDScan’s systems are used across the U.S. by car rental firms, retailers, gun shops, financial institutions, cannabis dispensaries, and hospitality establishments. The company has not published a statement or responded to BleepingComputer’s requests for comment, and it remains unclear whether IDScan’s systems were compromised or how many people were affected. The FBI’s New Orleans office has reportedly launched an investigation, and the Nexus service is no longer online, although the article states that cybercriminals still have access to the database.\u003c/p\u003e\n"},{"n":8,"title":"PostgreSQL Fixes 12-Year-Old Logical Decoding Flaw Enabling Replication-Role Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/postgresql-fixes-12-year-old-logical.html","time":"15:20","priority":"SHOULD READ","score":88,"tldr":"PostgreSQL patched a 12-year-old logical decoding flaw, CVE-2026-6471, that could let users with the REPLICATION attribute load arbitrary libraries and execute code as the database server OS user. Administrators should update and configure the new output_plugin_libraries whitelist, especially if using third-party plugins like wal2json or decoderbufs.","briefOverview":"\u003cp\u003ePostgreSQL released updates for CVE-2026-6471, a 12-year-old flaw in logical decoding that can allow an account with the REPLICATION attribute to run arbitrary code as the operating-system user running the database server. The issue has existed since logical decoding was introduced in PostgreSQL 9.4 in 2014. Versions before PostgreSQL 18.6, 17.11, 16.15, 15.19, and 14.24 are affected.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires a replication account and a server running with wal_level set to logical, a setup used by backup tools, standby servers, change data capture pipelines, and monitoring systems. Cyera Research, which named the flaw PostGREShell, said the plugin name supplied in a CREATE_REPLICATION_SLOT command could reach the library loader directly, bypassing existing restrictions on plugin paths. On Windows, Cyera said a server could resolve a network path over SMB and fetch a library from an attacker-controlled machine, while Linux and macOS require NFS automounting for a similar result.\u003c/p\u003e\n\n\u003cp\u003eThe fix adds a new output_plugin_libraries server parameter that whitelists logical decoding output plugin libraries, defaulting to pgoutput and test_decoding. Administrators using other plugins, including wal2json and decoderbufs, must add them to the list and reload the PostgreSQL configuration after updating, or logical decoding will be refused. The article also notes a remaining issue with pg_createsubscriber checks and says CVE-2026-6471 was not in CISA’s Known Exploited Vulnerabilities catalog as of September 4.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PostgreSQL released updates for CVE-2026-6471, a flaw that allows an account with the REPLICATION attribute to run arbitrary code as the operating-system user running the database server.","The flaw has existed since logical decoding was introduced in PostgreSQL 9.4 in 2014, and versions before PostgreSQL 18.6, 17.11, 16.15, 15.19, and 14.24 are affected.","Exploitation requires an account with the REPLICATION attribute and a server running with wal_level set to logical, a configuration used by backup tools, standby servers, change data capture pipelines, and monitoring systems.","The fix adds a server parameter called output_plugin_libraries that whitelists which libraries may be loaded as logical decoding output plugins, defaulting to pgoutput and test_decoding.","Administrators using non-default output plugins such as wal2json or decoderbufs must add them to output_plugin_libraries and reload the PostgreSQL configuration after updating."],"insights":["The update can break existing logical decoding setups that use third-party output plugins such as wal2json or decoderbufs unless administrators explicitly add those plugins to the new output_plugin_libraries setting and reload the configuration.","Cyera reported that on Windows the flaw can load a library from an attacker-controlled SMB network path without writing a file to the target server, while Linux and macOS require NFS automounting for a similar network-based path.","The existing PostgreSQL restriction that limits non-superusers to administrator-controlled plugin paths was not applied on the replication path, allowing quoted plugin names with path separators and ../ traversal to reach the loader directly.","Before updating, administrators are advised to query pg_replication_slots for previously used plugins because the new whitelist may refuse logical decoding after the patch if non-default plugins are not listed.","A remaining issue noted in the article is that pg_createsubscriber can pass --dry-run while later failing during conversion if pgoutput is not allowed by the new parameter."],"referencedReports":[{"title":"PostGREShell: The Database Powering Much of the Internet Had an Open Door for 12 Years","url":"https://www.cyera.com/research/postgreshell-the-database-powering-much-of-the-internet-had-an-open-door-for-12-years","publisher":"Cyera Research","context":"The article cites Cyera Research's September 1 write-up for technical details on the flaw, which Cyera names PostGREShell.","category":"research","primary":true},{"title":"CVE-2026-6471","url":"https://www.postgresql.org/support/security/CVE-2026-6471/","publisher":"PostgreSQL Project","context":"The article references PostgreSQL's advisory covering supported branches 14 through 18.","category":"advisory","primary":true},{"title":"CVE-2026-6471","url":"https://www.suse.com/security/cve/CVE-2026-6471.html","publisher":"SUSE","context":"The article cites SUSE's assessment as reproducing PostgreSQL's Privileges Required rating of High.","category":"advisory","primary":false},{"title":"Debian advisory for CVE-2026-6471","url":"https://www.mail-archive.com/debian-lts-announce@lists.debian.org/msg04945.html","publisher":"Debian","context":"The article cites Debian's advisory warning that the upstream fix requires additional configuration changes if some extensions are used.","category":"advisory","primary":false},{"title":"USN-8653-1","url":"https://ubuntu.com/security/notices/USN-8653-1","publisher":"Ubuntu","context":"The article references Ubuntu's USN-8653-1, which shipped the fix for Ubuntu 22.04, 24.04, and 26.04 LTS.","category":"advisory","primary":false}],"body":"\u003cp\u003ePostgreSQL released updates for CVE-2026-6471, a 12-year-old flaw in logical decoding that can allow an account with the REPLICATION attribute to run arbitrary code as the operating-system user running the database server. The issue has existed since logical decoding was introduced in PostgreSQL 9.4 in 2014. Versions before PostgreSQL 18.6, 17.11, 16.15, 15.19, and 14.24 are affected.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires a replication account and a server running with wal_level set to logical, a setup used by backup tools, standby servers, change data capture pipelines, and monitoring systems. Cyera Research, which named the flaw PostGREShell, said the plugin name supplied in a CREATE_REPLICATION_SLOT command could reach the library loader directly, bypassing existing restrictions on plugin paths. On Windows, Cyera said a server could resolve a network path over SMB and fetch a library from an attacker-controlled machine, while Linux and macOS require NFS automounting for a similar result.\u003c/p\u003e\n\n\u003cp\u003eThe fix adds a new output_plugin_libraries server parameter that whitelists logical decoding output plugin libraries, defaulting to pgoutput and test_decoding. Administrators using other plugins, including wal2json and decoderbufs, must add them to the list and reload the PostgreSQL configuration after updating, or logical decoding will be refused. The article also notes a remaining issue with pg_createsubscriber checks and says CVE-2026-6471 was not in CISA’s Known Exploited Vulnerabilities catalog as of September 4.\u003c/p\u003e\n"},{"n":9,"title":"New Ted Backdoor Hides Inside Victims' Own HAProxy Builds to Intercept Web Traffic","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/new-ted-backdoor-hides-inside-victims.html","time":"14:51","priority":"SHOULD READ","score":86,"tldr":"Rapid7 found a previously undocumented Linux backdoor, “ted,” compiled into trojanized HAProxy binaries at two South Korean organizations to intercept command-and-control traffic and selectively alter web pages without appearing in backend logs. The activity is attributed with medium confidence to North Korean state-sponsored actors, but it is not an HAProxy vulnerability and requires prior host compromise to replace the binary.","briefOverview":"\u003cp\u003eA previously undocumented Linux toolkit was found compiled directly into trojanized HAProxy load balancers at two South Korean organizations in the automotive and media sectors. The attackers named the implant “ted” in debug strings left in the binary, and Rapid7 Labs attributed the toolkit with medium confidence to North Korean state-sponsored actors. Rapid7 said it is not an HAProxy vulnerability because installing it requires code execution on the host and the ability to replace the running binary.\u003c/p\u003e\n\n\u003cp\u003eThe implant can intercept web traffic, handle command-and-control requests at the load balancer, and prevent those requests from reaching backend servers or appearing in backend logs. It also erases the requests from HAProxy’s own connection counters, writes command bodies to a named pipe under /tmp, and returns output over the raw socket under a standard HTTP/1.0 200 OK header. Through this channel, an operator can beacon, upload and download files, run shell commands, and replace the implant’s configuration.\u003c/p\u003e\n\n\u003cp\u003eRapid7 said only requests passing specific checks receive a modified page, including URL and referer matching, User-Agent presence, and either client address filtering or an operator key in the Accept-Language header. The implant rewrites response details, forces a 200 status, and deletes the Accept-Ranges header so a client cannot request byte ranges and notice the size change. Rapid7 recommended independent network correlation, memory behavioral analysis, and binary integrity checks, noting that upgrading HAProxy does not clean a host where the attackers have already replaced the binary.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A previously undocumented Linux toolkit named “ted” was found compiled directly into trojanized HAProxy load balancers at two South Korean organizations in the automotive and media sectors.","Rapid7 Labs attributed the toolkit with medium confidence to North Korean state-sponsored actors, while stating that further evidence is needed for a more definitive assessment.","The implant’s command-and-control requests are handled at the load balancer, erased from HAProxy connection counters, and do not reach backend servers or appear in backend logs.","Through its command channel, the operator can beacon, upload and download files, run shell commands, and replace the implant’s configuration.","Rapid7 said the activity is not an HAProxy vulnerability because installing the implant requires code execution on the host and the ability to replace the running binary."],"insights":["Backend logs and HAProxy statistics may miss the implant’s control traffic because the toolkit terminates those requests at the load balancer and removes them from HAProxy’s live connection counters.","Version checks alone are insufficient because the trojanized HAProxy binary can report the same version string as a clean build, making binary integrity checks and memory behavioral analysis important.","Upgrading HAProxy does not remove the implant from an already compromised host because the attackers replaced the binary rather than exploiting a flaw in HAProxy itself.","The listed command-and-control domains were NXDOMAIN as of September 4, so the article says they are useful for reviewing historical logs rather than blocking live traffic.","The implant appears tightly coupled to HAProxy 2.8.12 because it reads internal structures at offsets fixed to that release, and Rapid7 did not state whether other 2.8 builds exist."],"referencedReports":[{"title":"TR DPRK APTs: Ted Backdoor, curlRAT Target South Korean Media, Automotive Sectors","url":"https://www.rapid7.com/blog/post/tr-dprk-apts-ted-backdoor-curlrat-target-south-korean-media-automotive-sectors/","publisher":"Rapid7","context":"The article is based on Rapid7’s report describing the ted implant, curlRAT, affected South Korean organizations, and indicators of compromise.","category":"research","primary":true},{"title":"Analysis of Kimsuky’s Attack on a South Korean Groupware Vendor Using a New GoMir Family Variant","url":"https://www.enki.co.kr/en/media-center/blog/analysis-of-kimsuky-s-attack-on-a-south-korean-groupware-vendor-using-a-new-gomir-family-variant","publisher":"ENKI","context":"The article says Rapid7’s initial-access hypothesis involving an exposed Groupware portal rests on ENKI research about Kimsuky compromising a groupware vendor through a mail server flaw.","category":"research","primary":false},{"title":"North Korea Cyber Structure Alignment 2023","url":"https://cloud.google.com/blog/topics/threat-intelligence/north-korea-cyber-structure-alignment-2023","publisher":"Mandiant","context":"The article cites Mandiant’s 2023 assessment to explain shared tooling and overlapping targeting across North Korean threat clusters.","category":"research","primary":false},{"title":"Operation SyncHole: Watering-Hole Attacks by Lazarus","url":"https://securelist.com/operation-synchole-watering-hole-attacks-by-lazarus/116326/","publisher":"Kaspersky","context":"The article references Kaspersky’s SyncHole report when comparing the ted delivery model to a campaign involving filtered visitors to South Korean media sites.","category":"research","primary":false}],"body":"\u003cp\u003eA previously undocumented Linux toolkit was found compiled directly into trojanized HAProxy load balancers at two South Korean organizations in the automotive and media sectors. The attackers named the implant “ted” in debug strings left in the binary, and Rapid7 Labs attributed the toolkit with medium confidence to North Korean state-sponsored actors. Rapid7 said it is not an HAProxy vulnerability because installing it requires code execution on the host and the ability to replace the running binary.\u003c/p\u003e\n\n\u003cp\u003eThe implant can intercept web traffic, handle command-and-control requests at the load balancer, and prevent those requests from reaching backend servers or appearing in backend logs. It also erases the requests from HAProxy’s own connection counters, writes command bodies to a named pipe under /tmp, and returns output over the raw socket under a standard HTTP/1.0 200 OK header. Through this channel, an operator can beacon, upload and download files, run shell commands, and replace the implant’s configuration.\u003c/p\u003e\n\n\u003cp\u003eRapid7 said only requests passing specific checks receive a modified page, including URL and referer matching, User-Agent presence, and either client address filtering or an operator key in the Accept-Language header. The implant rewrites response details, forces a 200 status, and deletes the Accept-Ranges header so a client cannot request byte ranges and notice the size change. Rapid7 recommended independent network correlation, memory behavioral analysis, and binary integrity checks, noting that upgrading HAProxy does not clean a host where the attackers have already replaced the binary.\u003c/p\u003e\n"},{"n":7,"title":"Phishing Campaign Sends Millions of Emails Using Invisible Unicode to Evade Filters","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/phishing-campaign-sends-millions-of.html","time":"15:57","priority":"SHOULD READ","score":83,"tldr":"Microsoft warns that a large phishing campaign sent millions of finance-themed emails using invisible Unicode tag characters to split words like “funding” and evade keyword-based email filters. The activity abused reputable marketing infrastructure such as ActiveCampaign, making the phishing traffic harder to distinguish from legitimate messages.","briefOverview":"\u003cp\u003eMicrosoft is warning of a high-volume phishing campaign that uses invisible Unicode tag characters to bypass email filters. The attackers inserted these non-rendering characters into financial lure words such as “funding” so the words appear normal to recipients but are split apart for detectors looking for literal keyword matches. Microsoft said this shows techniques discussed in the AI era can be adapted by threat actors for traditional phishing and spam campaigns.\u003c/p\u003e\n\n\u003cp\u003eThe activity reportedly first emerged in early February 2026 and entered a high-volume phase for about three months before dropping sharply after May 15, 2026. Microsoft estimated weekday volumes at 1 to 2.37 million messages, with a peak on February 26, 2026, and said the campaign was nearly silent on weekends before resuming on Mondays. The operation is tied to broader phishing activity that used ActiveCampaign to distribute AI-generated emails targeting Small Business Administration loan applicants.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used hundreds of disposable finance-themed sender domains with business loan, line-of-credit, and advance-funding lures associated with fraud or credential harvesting. Emails sent through ActiveCampaign routed outbound links via its click-tracking domains, including acemlnd.com and activehosted.com, which Microsoft said can complicate reputation-based filtering because the traffic comes from a reputable marketing platform. ActiveCampaign said its moderation systems give messages with invisible Unicode characters the same verdict as unobfuscated versions and treat heavy use of the technique as suspicious.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported a high-volume phishing campaign that uses invisible Unicode tag characters to bypass email filters.","The attackers inserted characters from the Unicode Tags block into financial lure words such as “funding” so the words appeared normal to recipients but did not match literal keyword detections.","Microsoft said the campaign began in early February 2026, reached weekday volumes of 1 to 2.37 million messages, and dropped sharply after May 15, 2026.","The campaign is tied to broader phishing activity that used ActiveCampaign to distribute AI-generated emails targeting Small Business Administration loan applicants.","The phishing emails used hundreds of disposable finance-themed sender domains and routed outbound links through ActiveCampaign click-tracking domains including acemlnd.com and activehosted.com."],"insights":["Defenses that rely on exact keyword matches or regular expressions can miss financial phishing lures unless they account for invisible Unicode code points inserted inside otherwise ordinary words.","Microsoft highlighted that a technique discussed in the context of AI prompt injection has been adapted for traditional phishing and spam evasion, showing that AI-era methods can move into non-AI attack workflows.","The campaign’s use of ActiveCampaign made reputation-based filtering more difficult because messages originated from a reputable marketing platform with established IP reputation and authentication.","The activity followed a weekly cadence, going nearly silent on weekends and resuming on Mondays, which gives defenders a concrete timing pattern to compare against similar high-volume phishing waves.","ActiveCampaign said heavy use of invisible Unicode characters is treated as a suspicious signal, indicating that the volume or density of these hidden characters can be useful for moderation beyond simply decoding the message text."],"referencedReports":[{"title":"ASCII smuggling crosses over from AI prompt injection to phishing evasion","url":"https://www.microsoft.com/en-us/security/blog/2026/09/03/ascii-smuggling-crosses-over-from-ai-prompt-injection-to-phishing-evasion/","publisher":"Microsoft Security Research","context":"The article cites Microsoft’s analysis as the source for the high-volume phishing campaign using invisible Unicode tag characters to evade email filters.","category":"research","primary":true},{"title":"Attackers Exploit ActiveCampaign to Deliver Thousands of AI-Generated SBA Phish","url":"https://www.fortra.com/blog/attackers-exploit-activecampaign-deliver-thousands-ai-generated-sba-phish","publisher":"Fortra Intelligence and Research Experts","context":"The article references Fortra’s earlier disclosure of a related phishing campaign that used ActiveCampaign to send AI-generated phishing emails targeting SBA loan applicants.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft is warning of a high-volume phishing campaign that uses invisible Unicode tag characters to bypass email filters. The attackers inserted these non-rendering characters into financial lure words such as “funding” so the words appear normal to recipients but are split apart for detectors looking for literal keyword matches. Microsoft said this shows techniques discussed in the AI era can be adapted by threat actors for traditional phishing and spam campaigns.\u003c/p\u003e\n\n\u003cp\u003eThe activity reportedly first emerged in early February 2026 and entered a high-volume phase for about three months before dropping sharply after May 15, 2026. Microsoft estimated weekday volumes at 1 to 2.37 million messages, with a peak on February 26, 2026, and said the campaign was nearly silent on weekends before resuming on Mondays. The operation is tied to broader phishing activity that used ActiveCampaign to distribute AI-generated emails targeting Small Business Administration loan applicants.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used hundreds of disposable finance-themed sender domains with business loan, line-of-credit, and advance-funding lures associated with fraud or credential harvesting. Emails sent through ActiveCampaign routed outbound links via its click-tracking domains, including acemlnd.com and activehosted.com, which Microsoft said can complicate reputation-based filtering because the traffic comes from a reputable marketing platform. ActiveCampaign said its moderation systems give messages with invisible Unicode characters the same verdict as unobfuscated versions and treat heavy use of the technique as suspicious.\u003c/p\u003e\n"},{"n":5,"title":"US, Britain to coordinate on scam center takedowns","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/scam-compounds-coordination-us-uk-memorandum","time":"15:42","priority":"SHOULD READ","score":78,"tldr":"The U.S. and U.K. will coordinate investigations, intelligence sharing, and case prioritization to disrupt Southeast Asia-based scam centers behind major investment and romance fraud losses. The effort targets organized crime networks, including Chinese gangs and laundering operations such as Prince Group.","briefOverview":"\u003cp\u003eThe United States and United Kingdom will work together on an initiative to shut down scam centers that steal billions of dollars through investment and romance fraud schemes. A memorandum of understanding signed on Thursday calls for parallel investigations and information sharing on organized crime syndicates behind the scam centers. U.S. Attorney Jeanine Ferris Pirro met with senior officials from the U.K.’s National Crime Agency and Crown Prosecutor to sign the agreement.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said the two countries will discuss which jurisdictions should bring specific cases of common interest and will prioritize cases to achieve mutual results. U.S. and U.K. counterparts had already identified significant overlapping cases and committed to an in-person disruption event with private industry partners in London in early October. Pirro said the goal was to “disable” the Chinese gangs that run the scam compounds.\u003c/p\u003e\n\n\u003cp\u003eThe effort is being led by the Scam Center Strike Force, launched in November to coordinate U.S. law enforcement efforts against cyber scams. The FBI said cyber-enabled fraud schemes accounted for almost 85% of all losses reported to the agency, and more than $12 billion was stolen from Americans last year in cyber scams, though that figure is likely an undercount. The article says many scams are carried out by human trafficking victims in compounds across Myanmar, Cambodia, Laos and other countries, while Chinese gangs operate the compounds with help from compromised local officials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The United States and United Kingdom signed a memorandum of understanding to coordinate efforts to shut down scam centers involved in investment and romance fraud schemes.","The agreement calls for parallel investigations, information sharing, and discussions on which jurisdictions should bring specific cases of common interest.","The Justice Department said U.S. and U.K. counterparts had identified significant overlapping cases and planned an in-person disruption event with private industry partners in London in early October.","The Scam Center Strike Force is leading the effort and includes more than 150 personnel from agencies such as the FBI, IRS, and U.S. Postal Inspection Service.","U.S. and U.K. agencies previously sanctioned Prince Group, and the Justice Department seized about $15 billion worth of bitcoin linked to its CEO Chen Zhi."],"insights":["The U.S.-U.K. agreement is not limited to sharing intelligence; it explicitly includes deciding which country should bring specific cases, suggesting a coordinated legal strategy against overlapping targets.","The planned London disruption event will include private industry partners, showing that authorities view companies outside government as necessary to dismantling scam center operations.","The FBI’s estimate that cyber-enabled fraud accounts for almost 85% of reported losses indicates these scams are a dominant driver of financial harm reported to the agency.","The article highlights that reported U.S. losses of more than $12 billion are likely a severe undercount because many victims do not report their losses.","The prior Prince Group action shows authorities are targeting the financial infrastructure behind scam centers, not only the people directly running the compounds."],"referencedReports":[],"body":"\u003cp\u003eThe United States and United Kingdom will work together on an initiative to shut down scam centers that steal billions of dollars through investment and romance fraud schemes. A memorandum of understanding signed on Thursday calls for parallel investigations and information sharing on organized crime syndicates behind the scam centers. U.S. Attorney Jeanine Ferris Pirro met with senior officials from the U.K.’s National Crime Agency and Crown Prosecutor to sign the agreement.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said the two countries will discuss which jurisdictions should bring specific cases of common interest and will prioritize cases to achieve mutual results. U.S. and U.K. counterparts had already identified significant overlapping cases and committed to an in-person disruption event with private industry partners in London in early October. Pirro said the goal was to “disable” the Chinese gangs that run the scam compounds.\u003c/p\u003e\n\n\u003cp\u003eThe effort is being led by the Scam Center Strike Force, launched in November to coordinate U.S. law enforcement efforts against cyber scams. The FBI said cyber-enabled fraud schemes accounted for almost 85% of all losses reported to the agency, and more than $12 billion was stolen from Americans last year in cyber scams, though that figure is likely an undercount. The article says many scams are carried out by human trafficking victims in compounds across Myanmar, Cambodia, Laos and other countries, while Chinese gangs operate the compounds with help from compromised local officials.\u003c/p\u003e\n"},{"n":6,"title":"UK account-hack losses surge as new reporting system exposes hidden cases","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/uk-account-hack-losses-surge-as-reporting-changes","time":"14:45","priority":"SHOULD READ","score":78,"tldr":"Reported UK losses from hacked online accounts jumped sharply to £6.3 million, but police say the rise is largely because the new Report Fraud system is capturing cases that were previously missed. The data suggests cybercrime and ransomware remain significantly underreported, complicating efforts to measure the true scale of the problem.","briefOverview":"\u003cp\u003eReported losses tied to hacked email, social media and other online accounts in Britain rose 417% over the last financial year, reaching £6.3 million in the year ending March 31. The number of victims reporting a financial loss increased from 226 to 2,325. City of London Police said much of the jump reflects changes in how incidents are reported rather than a sudden fivefold increase in attacks.\u003c/p\u003e\n\n\u003cp\u003eThe rise coincides with the rollout of Report Fraud, the national service that replaced the criticized Action Fraud system in January. Police said 92% of account-hacking reports involving a financial loss were recorded in the second half of the financial year, overlapping with the move to the new platform. The assessment said this makes direct comparisons with the previous year less straightforward because more incidents are now being identified and recorded.\u003c/p\u003e\n\n\u003cp\u003eReport Fraud received 64,608 reports of cyber-dependent crimes during 2025-26, up 34%, with account hacking accounting for 44,355 reports. Reported losses from cyber-dependent crimes rose 90% to £14.3 million, while broader fraud categories recorded £3.2 billion in reported losses. The assessment also warned that ransomware figures are difficult to interpret, with Report Fraud receiving 323 ransomware reports while police said the decline may reflect underreporting rather than fewer attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Reported UK losses tied to hacked email, social media and other online accounts rose 417% to £6.3 million in the year ending March 31, while victims reporting a financial loss rose from 226 to 2,325.","The City of London Police said much of the increase likely reflects the rollout of the new Report Fraud platform, which replaced Action Fraud and captured more incidents, rather than a sudden fivefold rise in attacks.","Police said 92% of account-hacking reports involving financial loss were recorded in the second half of the financial year, overlapping with the move to the new reporting platform.","Report Fraud received 64,608 reports of cyber-dependent crimes during 2025-26, up 34%, with account hacking accounting for 44,355 of those reports.","Report Fraud recorded 323 ransomware reports, down 25% from 430, but police warned the decline may reflect underreporting because ransomware incidents are reported through several channels."],"insights":["The 417% rise in reported account-hack losses should not be read as a clean year-over-year trend, because the article says the reporting system changed in a way that made previously hidden cases more visible.","Financial losses from a single incident may be recorded under fraud rather than hacking if the victim does not know an account was compromised, which means account-hack figures may understate the role of hacked accounts in broader fraud losses.","Ransomware reporting is especially difficult to interpret because Report Fraud showed a 25% decline while separate Information Commissioner’s Office data recorded 452 ransomware-related data breaches over part of the same period, and the two systems measure different outcomes.","Small and medium-sized businesses are a notable exposure point because they made up 62% of organization cybercrime reports where size was known, and police said they can also become routes into larger companies through supplier relationships."],"referencedReports":[{"title":"Report Fraud Annual Assessment","url":"https://www.reportfraud.police.uk/report-fraud-annual-assessment/","publisher":"City of London Police","context":"The article is based on the City of London Police's first annual assessment of reports and losses recorded through Report Fraud.","category":"research","primary":true}],"body":"\u003cp\u003eReported losses tied to hacked email, social media and other online accounts in Britain rose 417% over the last financial year, reaching £6.3 million in the year ending March 31. The number of victims reporting a financial loss increased from 226 to 2,325. City of London Police said much of the jump reflects changes in how incidents are reported rather than a sudden fivefold increase in attacks.\u003c/p\u003e\n\n\u003cp\u003eThe rise coincides with the rollout of Report Fraud, the national service that replaced the criticized Action Fraud system in January. Police said 92% of account-hacking reports involving a financial loss were recorded in the second half of the financial year, overlapping with the move to the new platform. The assessment said this makes direct comparisons with the previous year less straightforward because more incidents are now being identified and recorded.\u003c/p\u003e\n\n\u003cp\u003eReport Fraud received 64,608 reports of cyber-dependent crimes during 2025-26, up 34%, with account hacking accounting for 44,355 reports. Reported losses from cyber-dependent crimes rose 90% to £14.3 million, while broader fraud categories recorded £3.2 billion in reported losses. The assessment also warned that ransomware figures are difficult to interpret, with Report Fraud receiving 323 ransomware reports while police said the decline may reflect underreporting rather than fewer attacks.\u003c/p\u003e\n"},{"n":10,"title":"Neither Malware nor Harmless: Tracking the NPS Proxy Across the Internet","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/nps-proxy-server/","time":"17:07","priority":"MAY READ","score":74,"tldr":"NPS is a legitimate open-source tunneling proxy widely deployed in Chinese cloud infrastructure, but it is also used by China-linked threat actors as a secondary post-exploitation tool for pivoting inside victim networks. Defenders should not treat NPS alone as proof of compromise, but should prioritize investigation when it appears alongside tools like Cobalt Strike, Meterpreter, webshells, or other remote-access tooling.","briefOverview":"\u003cp\u003eNPS is a lightweight, open-source proxy and tunneling server written in Go, described by its original readme as a “powerful intranet penetration proxy server.” It uses a client-server model in which an NPS server exposes a web management panel and client bridge, while an NPC client connects back from inside a network. Censys says NPS is widely used, with about 17,500 hosts running the server component worldwide as of July 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that NPS is dual-use rather than inherently malicious. Its deployments are heavily concentrated in China and Hong Kong, especially within Chinese cloud providers such as Alibaba, Tencent, and China Telecom’s backbone. Censys states that most deployments are likely ordinary administrative uses, but the same reverse tunneling capability can also help an intruder pivot inside a compromised network.\u003c/p\u003e\n\n\u003cp\u003eThe article cites prior cases where NPS appeared in threat activity involving actors from the People’s Republic of China, including Sygnia reporting on Emperor Dragonfly and a 2023 CISA investigation involving compromised Citrix NetScaler devices. In those cases, NPS was used alongside tools such as Cobalt Strike, Meterpreter, and webshells, supporting follow-on activity after initial access. Censys recommends hunting NPS in context rather than blocking it on sight, with stronger concern when it appears next to remote access tools or infrastructure an organization does not own.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NPS is a lightweight, open-source proxy and tunneling server written in Go that uses a client-server model to create reverse network tunnels.","As of July 2026, Censys observed about 17,500 hosts running the NPS server component worldwide, with deployments concentrated in China and Hong Kong.","NPS has been observed in intrusions involving threat actors from the People’s Republic of China, including Emperor Dragonfly and a 2023 CISA investigation into compromised Citrix NetScaler devices.","The NPS client has been deployed alongside tools such as Cobalt Strike, Meterpreter, and webshells to support follow-on network pivoting after initial access was established by other tooling.","Censys states that NPS should be hunted in context rather than blocked on sight, with stronger concern when it appears alongside remote access tools or infrastructure not owned by the organization."],"insights":["NPS is more meaningful as a detection when it is correlated with other tools, because Censys reports that under 10% of observed NPS hosts also run a service it identifies as a threat.","Threat actors have used NPS even when their existing tools, such as Cobalt Strike and Meterpreter, already provide proxying features, indicating that separating pivoting traffic from primary command-and-control traffic is an observed operational pattern.","NPS lacks native command-execution or remote-shell capability, which helps explain why reported malicious use shows it being deployed after initial access rather than as the tool used to break in.","The concentration of NPS on Chinese cloud providers means broad blocking or alerting on NPS alone is likely to produce many benign results, while co-location with tools such as Cobalt Strike, Acunetix, Viper, or Supershell is a stronger investigative signal."],"referencedReports":[{"title":"Revealing Emperor Dragonfly: A Chinese Ransomware Group","url":"https://www.sygnia.co/threat-reports-and-advisories/revealing-emperor-dragonfly-a-chinese-ransomware-group/","publisher":"Sygnia","context":"The article cites this report as one of two prior cases where NPS was observed in threat actor operations, with the NPS client renamed WindowsUpdate.exe and running alongside Cobalt Strike and Meterpreter.","category":"research","primary":false},{"title":"Threat Actors Exploiting Citrix CVE-2023-3519 to Implant Webshells","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-201a","publisher":"CISA","context":"The article references this 2023 CISA advisory as a prior investigation in which an NPS tunneller was deployed after attackers placed a webshell on compromised Citrix NetScaler devices.","category":"advisory","primary":false}],"body":"\u003cp\u003eNPS is a lightweight, open-source proxy and tunneling server written in Go, described by its original readme as a “powerful intranet penetration proxy server.” It uses a client-server model in which an NPS server exposes a web management panel and client bridge, while an NPC client connects back from inside a network. Censys says NPS is widely used, with about 17,500 hosts running the server component worldwide as of July 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that NPS is dual-use rather than inherently malicious. Its deployments are heavily concentrated in China and Hong Kong, especially within Chinese cloud providers such as Alibaba, Tencent, and China Telecom’s backbone. Censys states that most deployments are likely ordinary administrative uses, but the same reverse tunneling capability can also help an intruder pivot inside a compromised network.\u003c/p\u003e\n\n\u003cp\u003eThe article cites prior cases where NPS appeared in threat activity involving actors from the People’s Republic of China, including Sygnia reporting on Emperor Dragonfly and a 2023 CISA investigation involving compromised Citrix NetScaler devices. In those cases, NPS was used alongside tools such as Cobalt Strike, Meterpreter, and webshells, supporting follow-on activity after initial access. Censys recommends hunting NPS in context rather than blocking it on sight, with stronger concern when it appears next to remote access tools or infrastructure an organization does not own.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft says some users can’t open the Teams desktop client","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-says-some-users-cant-open-the-teams-desktop-client/","time":"14:30","priority":"MAY READ","score":58,"tldr":"Microsoft is investigating a Teams issue that prevents or delays some Windows users from opening the desktop client, with web and mobile apps recommended as workarounds. The company is also looking into a separate Teams for Mac problem that can block users from joining calls or meetings.","briefOverview":"\u003cp\u003eMicrosoft is working to resolve a known issue that causes delays or blocks some users from opening the Microsoft Teams desktop client on Windows systems. The issue was acknowledged on Thursday at 16:45 EDT and is tracked as TM1466820. Microsoft said some users may initially be unable to load the client or may experience loading delays of up to two minutes when first opening Teams on Windows devices.\u003c/p\u003e\n\n\u003cp\u003eWhile remediation is underway, Microsoft advised affected users to use Microsoft Teams on the web or alternative access methods such as the Teams mobile app. The company is analyzing service logs and telemetry data and has contacted some affected users to identify the root cause and determine mitigation options. The issue matters because it can prevent affected users from accessing Teams through the Windows desktop client or slow access to the application.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is also investigating a separate issue that may prevent Mac users from joining calls or meetings in Microsoft Teams, tracked as TM1466659. The company initially blamed a code change for causing the Teams call and meeting service infrastructure to fail to process some requests, but it is now reassessing the root cause. The article also notes recent Microsoft issues affecting Teams Free chat and calls, Teams and New Outlook launches on ARM-based Windows PCs, and Exchange Online email delivery.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is working to resolve a known issue that causes delays or blocks some users from opening the Microsoft Teams desktop client on Windows systems.","Microsoft said affected Windows users may be unable to load Teams initially or may experience loading delays of up to two minutes when first opening the client.","Microsoft advised affected customers to use Microsoft Teams on the web or alternative access methods such as the Teams mobile app while remediation is underway.","Microsoft is also investigating a separate issue that may prevent Mac users from joining calls or meetings in Microsoft Teams.","Microsoft is reviewing service logs and telemetry data and has contacted some affected users to identify the root cause and determine mitigation options."],"insights":["The Windows Teams issue appears limited to the desktop client, because Microsoft recommends using Teams on the web or mobile app to avoid the impact.","Microsoft’s investigation into the Mac Teams meeting issue is still unsettled, as the company initially suspected a code change but is now reassessing that root cause.","The article describes several Microsoft service problems occurring close together, including Teams desktop loading issues, Teams for Mac meeting problems, Teams and New Outlook launch failures on ARM-based Windows PCs, and Exchange Online email delays."],"referencedReports":[{"title":"TM1466820","url":"https://admin.cloud.microsoft/#/servicehealth/:/alerts/TM1466820","publisher":"microsoft","context":"The article says Microsoft acknowledged the Windows Teams desktop client loading issue in a known-issue incident tracked as TM1466820.","category":"advisory","primary":true},{"title":"TM1466659","url":"http://admin.cloud.microsoft/#/servicehealth/:/alerts/TM1466659","publisher":"microsoft","context":"The article says Microsoft is investigating a separate issue preventing Mac users from joining Teams calls and meetings, tracked as TM1466659.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft is working to resolve a known issue that causes delays or blocks some users from opening the Microsoft Teams desktop client on Windows systems. The issue was acknowledged on Thursday at 16:45 EDT and is tracked as TM1466820. Microsoft said some users may initially be unable to load the client or may experience loading delays of up to two minutes when first opening Teams on Windows devices.\u003c/p\u003e\n\n\u003cp\u003eWhile remediation is underway, Microsoft advised affected users to use Microsoft Teams on the web or alternative access methods such as the Teams mobile app. The company is analyzing service logs and telemetry data and has contacted some affected users to identify the root cause and determine mitigation options. The issue matters because it can prevent affected users from accessing Teams through the Windows desktop client or slow access to the application.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is also investigating a separate issue that may prevent Mac users from joining calls or meetings in Microsoft Teams, tracked as TM1466659. The company initially blamed a code change for causing the Teams call and meeting service infrastructure to fail to process some requests, but it is now reassessing the root cause. The article also notes recent Microsoft issues affecting Teams Free chat and calls, Teams and New Outlook launches on ARM-based Windows PCs, and Exchange Online email delivery.\u003c/p\u003e\n"},{"n":4,"title":"39 New Methods That Compromise Passkey Authentication","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/39-new-methods-that-compromise-passkey-authentication/","time":"14:01","priority":"MAY READ","score":45,"tldr":"Passkeys’ cryptography remains strong, but accounts can still be compromised through surrounding systems like enrollment, recovery, synced vaults, browsers, operating systems, and user prompts. The article argues that high-value enterprise identities need tightly controlled enrollment and dedicated biometric hardware to reduce that broader attack surface.","briefOverview":"\u003cp\u003eThe article says there are now at least 39 publicly documented methods, attack paths, research techniques, and exploitation scenarios involving passkeys and the infrastructure around them. It emphasizes that this does not mean criminals have operationalized all 39, but that the playbook is being written publicly. The central point is that FIDO2 cryptography can remain intact while an account protected by a passkey is still compromised.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that modern passkey authentication crosses many trust boundaries, including web applications, browsers, operating systems, password managers, cloud synchronization services, mobile devices, Bluetooth transport, account recovery systems, enrollment processes, help desks, and users. It cites SpecterOps’ Pass the Passkey research showing that malware may ask legitimate WebAuthn infrastructure to generate a signed assertion after a user completes what appears to be a normal Windows authentication prompt. In that example, the private key never leaves its protected location and the cryptography is not cracked, but the authentication process is manipulated.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights attacks against prompts, synchronized passkeys, cloud recovery, password manager exports, mobile devices, browser extensions, and enrollment or recovery workflows. It argues that attackers may compromise accounts by registering new attacker-controlled passkeys or abusing weaker fallback and recovery processes instead of stealing existing credentials. The article concludes that high-value enterprise identities should use dedicated biometric hardware, approved authenticator restrictions, enforced user verification, proper challenge and session validation, and stronger enrollment and recovery controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that at least 39 publicly documented methods, attack paths, research techniques, and exploitation scenarios now involve passkeys and the infrastructure around them.","The article says attackers can compromise accounts protected by passkeys without cracking FIDO2 cryptography or extracting a private key, by manipulating surrounding systems such as browsers, operating systems, prompts, synchronization, enrollment, and recovery.","Several documented techniques target the user interface around authentication, including passkey prompt flooding, credential interface deception, application metadata spoofing, window handle spoofing, remote desktop passkey phishing, and FIDO interface overlay attacks.","The article argues that shareable or synchronized passkeys expand the attack surface because they can inherit weaknesses from phones, operating systems, password managers, cloud accounts, browsers, recovery processes, and synchronization systems.","The article says dedicated biometric hardware can reduce the surrounding attack surface when paired with correct service configuration, approved authenticator restrictions, enforced user verification, and strong enrollment and recovery controls."],"insights":["The article emphasizes that a passkey-protected account can be compromised even when the private key never leaves its protected location, because malware may be able to trigger legitimate authentication infrastructure to produce a signed assertion after the user approves a normal-looking prompt.","The article highlights enrollment as a high-impact weak point because attackers may not need to steal an existing passkey if they can use account access, help desk processes, or recovery flows to register a new attacker-controlled passkey.","The article identifies synchronized and shareable passkeys as an architectural tradeoff, because moving credentials through cloud accounts, password managers, exports, or device recovery expands the security boundary beyond the original authenticator.","The article makes service configuration a central control, stating that dedicated hardware only preserves its security model if the relying service restricts approved authenticator classes, validates authenticator identity, enforces user verification, and prevents weaker fallback methods."],"referencedReports":[{"title":"Pass the Passkey","url":"https://specterops.io/wp-content/uploads/sites/3/2026/08/Pass-the-Passkey_A4_v2.pdf","publisher":"SpecterOps","context":"The article cites SpecterOps' Pass the Passkey research as demonstrating that malware can use legitimate WebAuthn infrastructure to generate signed assertions without extracting a private key, and later references its tooling for invoking legitimate-looking Windows passkey prompts.","category":"research","primary":true}],"body":"\u003cp\u003eThe article says there are now at least 39 publicly documented methods, attack paths, research techniques, and exploitation scenarios involving passkeys and the infrastructure around them. It emphasizes that this does not mean criminals have operationalized all 39, but that the playbook is being written publicly. The central point is that FIDO2 cryptography can remain intact while an account protected by a passkey is still compromised.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that modern passkey authentication crosses many trust boundaries, including web applications, browsers, operating systems, password managers, cloud synchronization services, mobile devices, Bluetooth transport, account recovery systems, enrollment processes, help desks, and users. It cites SpecterOps’ Pass the Passkey research showing that malware may ask legitimate WebAuthn infrastructure to generate a signed assertion after a user completes what appears to be a normal Windows authentication prompt. In that example, the private key never leaves its protected location and the cryptography is not cracked, but the authentication process is manipulated.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights attacks against prompts, synchronized passkeys, cloud recovery, password manager exports, mobile devices, browser extensions, and enrollment or recovery workflows. It argues that attackers may compromise accounts by registering new attacker-controlled passkeys or abusing weaker fallback and recovery processes instead of stealing existing credentials. The article concludes that high-value enterprise identities should use dedicated biometric hardware, approved authenticator restrictions, enforced user verification, proper challenge and session validation, and stronger enrollment and recovery controls.\u003c/p\u003e\n"}]</script>
