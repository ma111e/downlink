<script type="application/json" id="dl-articles">[{"n":3,"title":"Claude Opus 5 Helped Researchers Take Over OpenAI Staff Accounts via Chained Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/claude-opus-5-helped-researchers-take.html","time":"10:01","priority":"SHOULD READ","score":83,"tldr":"Hacktron researchers used Claude Opus 5 to chain an unpatched libheif image-processing flaw in OpenAI’s Discourse forum with an OpenAI SSO weakness, gaining controlled access to employee ChatGPT, Codex, and an internal GitHub repository. OpenAI fixed the identity issue and paid a $6,500 bounty, underscoring the risk of sharing SSO between public-facing services and sensitive internal tools.","briefOverview":"\u003cp\u003eHacktron researchers used Anthropic’s Claude Opus 5 to chain flaws that let them take over the ChatGPT and Codex accounts of several OpenAI employees and reach an internal OpenAI GitHub repository. The researchers said this was controlled security research: they proved access with one harmless pull request, did not read source code or access customer data, and stopped afterward. OpenAI reportedly fixed the OpenAI-side issue about 14 hours after disclosure and paid Hacktron a $6,500 bounty. The award covered the OpenAI login finding, not testing of the Discourse forum, which was outside OpenAI’s bounty program.\u003c/p\u003e\n\n\u003cp\u003eThe chain began with a specially crafted HEIC or HEIF image uploaded to OpenAI’s Discourse-based public forum, where an old libheif version used through ImageMagick could be manipulated to gain control of the forum server. Hacktron said the shared “Sign in with OpenAI” system then allowed access to staff accounts without victims taking any action, creating potential paths to connected services such as GitHub, Slack, and email. Although libheif 1.22.0 had fixed the issue in May 2026, the forum image running Debian 12 still used unpatched libheif 1.19.7 when the researchers tested it in July. The case highlights the risk of outdated image-processing software and of allowing a lower-trust public service to share sign-in access with sensitive internal tools.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hacktron researchers chained an image-processing flaw in OpenAI’s Discourse-based public forum with an OpenAI login weakness to take over the ChatGPT and Codex accounts of several OpenAI employees.","The researchers demonstrated internal GitHub repository access by triggering a single harmless pull request and said they did not read source code, merge or ship changes, or access customer data.","Hacktron reported the findings to OpenAI, which reportedly fixed the OpenAI-side issue about 14 hours later and paid the team a $6,500 bounty on September 1.","The forum server used unpatched libheif 1.19.7 on Debian 12 even though libheif 1.22.0, which fixed the relevant issue, had been released in May 2026.","Hacktron said Claude Opus 5 produced a working exploit within hours after Claude Opus 4.8 had struggled to do so with ASLR enabled."],"insights":["A public forum compromise could affect OpenAI staff accounts without any action by the employees because the forum used the same OpenAI sign-in system as higher-value services.","The reported path to code execution depended on combining memory flaws to work around a protection that randomizes where software is placed in memory, even though the underlying public vulnerability record describes the issue more narrowly as an out-of-bounds read.","A security fix can be publicly available yet remain ineffective for deployed systems when an operating system’s packaged version has not incorporated it, as the forum image still contained libheif 1.19.7 after libheif 1.22.0 was released.","Hacktron said Claude Opus 5 reduced the time needed to create a working exploit from repeated unsuccessful sessions to hours, while the wider HEIF Heist project reportedly cost under $3,000 in AI usage."],"referencedReports":[{"title":"Hacking OpenAI","url":"https://www.hacktron.ai/blog/hacking-openai","publisher":"hacktron","context":"The article cites Hacktron's technical account for its claim that the account takeover stemmed from OpenAI's shared identity system rather than Discourse itself.","category":"research","primary":true},{"title":"GHSA-vhm9-85gw-x335","url":"https://github.com/discourse/discourse/security/advisories/GHSA-vhm9-85gw-x335","publisher":"discourse","context":"The article cites Discourse's security advisory for its assessment of the image-processing issue as remote code execution with a CVSS score of 8.8.","category":"advisory","primary":false}],"body":"\u003cp\u003eHacktron researchers used Anthropic’s Claude Opus 5 to chain flaws that let them take over the ChatGPT and Codex accounts of several OpenAI employees and reach an internal OpenAI GitHub repository. The researchers said this was controlled security research: they proved access with one harmless pull request, did not read source code or access customer data, and stopped afterward. OpenAI reportedly fixed the OpenAI-side issue about 14 hours after disclosure and paid Hacktron a $6,500 bounty. The award covered the OpenAI login finding, not testing of the Discourse forum, which was outside OpenAI’s bounty program.\u003c/p\u003e\n\n\u003cp\u003eThe chain began with a specially crafted HEIC or HEIF image uploaded to OpenAI’s Discourse-based public forum, where an old libheif version used through ImageMagick could be manipulated to gain control of the forum server. Hacktron said the shared “Sign in with OpenAI” system then allowed access to staff accounts without victims taking any action, creating potential paths to connected services such as GitHub, Slack, and email. Although libheif 1.22.0 had fixed the issue in May 2026, the forum image running Debian 12 still used unpatched libheif 1.19.7 when the researchers tested it in July. The case highlights the risk of outdated image-processing software and of allowing a lower-trust public service to share sign-in access with sensitive internal tools.\u003c/p\u003e\n"},{"n":1,"title":"ShinyHunters hacks Clop leak site, threatens to extort ransomware gang","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/shinyhunters-hacks-clop-leak-site-threatens-to-extort-ransomware-gang/","time":"13:48","priority":"SHOULD READ","score":80,"tldr":"ShinyHunters defaced Clop’s Tor leak site after allegedly exploiting an unauthenticated Grav CMS file-upload flaw, and claims it stole server data and the onion service’s private keys. The group says it will extort Clop in retaliation for alleged threats amid their dispute over Clop’s Oracle E-Business Suite campaign.","briefOverview":"\u003cp\u003eShinyHunters breached and defaced the Tor-based data leak site operated by the Clop ransomware group. The group said it exploited an unauthenticated file-upload issue in Grav CMS, initially placing a text file on Clop’s server before replacing the site with an Umbreon-themed page. BleepingComputer independently confirmed the uploaded file and the site defacement.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it gained full server access and stole source code, Grav CMS plugins, files from \u003ccode\u003e/var/log\u003c/code\u003e, and the private keys for Clop’s onion service, although BleepingComputer could not independently verify those claims. If the onion-service keys are valid, ShinyHunters said it could operate a site using Clop’s existing hidden-service address even if it lost access to Clop’s server. The group said it intends to extort Clop and give it 72 hours to make contact, describing the intrusion as retaliation for alleged threats tied to a dispute over Clop’s Oracle E-Business Suite data-theft campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ShinyHunters defaced Clop’s Tor-based data leak site after claiming to exploit an unauthenticated file-upload flaw in Grav CMS.","BleepingComputer confirmed that ShinyHunters uploaded a text file to Clop’s server and that Clop’s site was later replaced with a ShinyHunters page featuring Umbreon artwork.","ShinyHunters claims it obtained full server access and stole source code, Grav CMS plugins, system logs, and private keys for Clop’s onion service, but these claims have not been independently verified.","ShinyHunters said it plans to extort Clop and give the ransomware group 72 hours to make contact.","ShinyHunters said the intrusion was retaliation for alleged threats from a Clop representative amid a dispute connected to Clop’s Oracle E-Business Suite data-theft campaign."],"insights":["If ShinyHunters’ claim of possessing Clop’s onion-service private keys is valid, it could host a site at Clop’s existing hidden-service address even after being removed from Clop’s server.","The alleged theft of files under /var/log could expose records of system activity, authentication attempts, and potentially the IP addresses of people who connected to Clop’s infrastructure.","The reported compromise illustrates that a public-facing Grav CMS file-upload weakness can be used first to place a visible file on a site and, according to ShinyHunters, potentially lead to broader server access.","The feud reportedly stems in part from ShinyHunters publishing an Oracle E-Business Suite exploit that Oracle later said matched one used in Clop’s data-theft campaign."],"referencedReports":[],"body":"\u003cp\u003eShinyHunters breached and defaced the Tor-based data leak site operated by the Clop ransomware group. The group said it exploited an unauthenticated file-upload issue in Grav CMS, initially placing a text file on Clop’s server before replacing the site with an Umbreon-themed page. BleepingComputer independently confirmed the uploaded file and the site defacement.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it gained full server access and stole source code, Grav CMS plugins, files from \u003ccode\u003e/var/log\u003c/code\u003e, and the private keys for Clop’s onion service, although BleepingComputer could not independently verify those claims. If the onion-service keys are valid, ShinyHunters said it could operate a site using Clop’s existing hidden-service address even if it lost access to Clop’s server. The group said it intends to extort Clop and give it 72 hours to make contact, describing the intrusion as retaliation for alleged threats tied to a dispute over Clop’s Oracle E-Business Suite data-theft campaign.\u003c/p\u003e\n"},{"n":4,"title":"The Blank PDF That Signed Its Own Generator's Name","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/ato-tax-office-lure-pdf-carries-signed-provenance-manifest-naming-its-ai-generator","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email impersonating a national tax authority used a seemingly blank PDF whose ordinary metadata was anonymous, but a hidden C2PA provenance manifest identified ChatGPT/gpt-5-5 and an OpenAI certificate chain. The incident shows that attachment triage should inspect signed provenance metadata as well as conventional PDF properties, especially when DMARC passes through DKIM-only shared-hosting mail.","briefOverview":"\u003cp\u003eA phishing email impersonating a national tax authority was sent to a senior advertising-operations lead at an international advertising group. The message used a one-page, 8,692-byte PDF that appeared harmless in ordinary checks: it had no JavaScript, links, automatic actions, or meaningful visible document properties. It falsely claimed the attachment was password protected and instructed the recipient to use “2026,” although the file was not encrypted.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained a compressed C2PA provenance manifest that recorded \u003ccode\u003ec2pa.created\u003c/code\u003e, classified the document as trained-algorithmic media, named \u003ccode\u003egpt-5-5\u003c/code\u003e and ChatGPT, and included an X.509 certificate chain whose leaf subject was OpenAI OpCo, LLC. The article states that the manifest was not cryptographically validated and was likely invalidated when the file was re-saved 25 days after signing, but its readable generator information remained embedded because it was not stripped. The email passed DMARC through aligned DKIM from an unrelated shared-hosting sender domain with no SPF record, while its only download link redirected to an attacker-controlled \u003ccode\u003e.info\u003c/code\u003e domain behind a bot-verification interstitial.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email impersonating a national tax authority targeted a senior advertising-operations lead at an international advertising group and used a one-page PDF attachment.","The 8,692-byte PDF had no JavaScript, links, automatic actions, or meaningful visible document properties, but contained a compressed C2PA provenance manifest.","The manifest recorded a c2pa.created action, classified the file as trained-algorithmic media, named gpt-5-5 and ChatGPT, and contained a certificate chain with a leaf subject of OpenAI OpCo, LLC.","The article states that the provenance manifest was not cryptographically validated and was likely tampered after the PDF was re-saved 25 days after its recorded signing time.","The message passed DMARC through aligned DKIM despite having no SPF record, while its only Download PDF link redirected toward an attacker-controlled .info domain behind a bot-verification interstitial."],"insights":["The PDF’s ordinary metadata was anonymous and untitled, while its compressed provenance data retained generator details, showing that visible file properties can be far less informative than embedded provenance records.","The provenance record was likely no longer valid after the file was re-saved, but its readable contents remained in the document because the manifest was not stripped.","The attachment’s claims contradicted observable facts: it said the PDF was password protected and contained a sharing link, yet the file was unencrypted and contained no such link.","The email passed DMARC not because it represented the impersonated tax authority, but because the unrelated sending domain had aligned DKIM and a DMARC policy of p=NONE despite publishing no SPF record.","The article recommends hunting for inbound messages that pass DMARC with spf=none, a narrower signal than broadly investigating all authentication failures."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for its figures on the human element in breaches and phishing as an initial access vector.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA's guidance to support verifying a sender's claims rather than judging a document by appearance.","category":"guide","primary":false}],"body":"\u003cp\u003eA phishing email impersonating a national tax authority was sent to a senior advertising-operations lead at an international advertising group. The message used a one-page, 8,692-byte PDF that appeared harmless in ordinary checks: it had no JavaScript, links, automatic actions, or meaningful visible document properties. It falsely claimed the attachment was password protected and instructed the recipient to use “2026,” although the file was not encrypted.\u003c/p\u003e\n\n\u003cp\u003eThe PDF contained a compressed C2PA provenance manifest that recorded \u003ccode\u003ec2pa.created\u003c/code\u003e, classified the document as trained-algorithmic media, named \u003ccode\u003egpt-5-5\u003c/code\u003e and ChatGPT, and included an X.509 certificate chain whose leaf subject was OpenAI OpCo, LLC. The article states that the manifest was not cryptographically validated and was likely invalidated when the file was re-saved 25 days after signing, but its readable generator information remained embedded because it was not stripped. The email passed DMARC through aligned DKIM from an unrelated shared-hosting sender domain with no SPF record, while its only download link redirected to an attacker-controlled \u003ccode\u003e.info\u003c/code\u003e domain behind a bot-verification interstitial.\u003c/p\u003e\n"},{"n":2,"title":"Calling viral AI actress Tilly Norwood? Agree to a face scan first","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/calling-viral-ai-actress-tilly-norwood-agree-to-a-face-scan-first/","time":"11:38","priority":"MAY READ","score":63,"tldr":"Talking Tilly, an AI video-call service tied to viral AI actress Tilly Norwood, requires a facial age-estimation check and continuously analyzes callers’ video and voice for emotional cues. Calls are recorded and processed by third parties, while transcripts and conversational memory may be retained, highlighting privacy implications of AI companion-style services and UK-driven age-verification rules.","briefOverview":"\u003cp\u003eTalking Tilly, a video-call service for AI character Tilly Norwood run by UK company Xicoia, requires every caller worldwide to pass an automated age check before the first call. Didit analyzes a video selfie to estimate the caller’s age, with government photo ID as a fallback if the estimate is unclear. Xicoia says selfies are sent directly to Didit, no biometric template is created, and the company retains only an approximate age band and reference number after the check.\u003c/p\u003e\n\n\u003cp\u003eDuring calls, the service analyzes callers’ camera feeds and voice tone to infer their emotional state, and this analysis cannot be disabled for an individual call. Calls are recorded, transcribed, and processed live by U.S. providers; transcripts can be retained for up to eight weeks, while conversation memory can be deleted on request. The article notes that the service’s age gate and mood analysis rely on legitimate interests rather than consent, and that a UK regulatory direction may have resulted in face-based checks being imposed on callers globally.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Talking Tilly requires callers worldwide to complete an automated age check using a video selfie analyzed by Didit, with government photo ID as a fallback when the age estimate is unclear.","Xicoia says the age-check selfie is sent directly to Didit, that no faceprint or biometric template is made, and that the selfie and ID image are not kept after the check.","During each call, Talking Tilly analyzes the caller’s camera feed and tone of voice to infer emotional state, a process that cannot be turned off for an individual call.","Calls are recorded, transcribed, and processed live by U.S. providers, while transcripts may be retained for up to eight weeks and the character can retain conversation memory unless deletion is requested.","The service offers five free minutes before charging for additional time and is scheduled to permanently shut down on September 27, when unused purchased minutes will be forfeited."],"insights":["A UK-driven age-verification decision applies to every Talking Tilly caller worldwide, meaning users outside the UK must also complete the face-based age check.","Xicoia’s policy uses “legitimate interests,” rather than consent, as the legal basis for both age checking and mood analysis, even though the mood analysis cannot be disabled for an individual call.","The service’s automated abuse classifier withheld a weather-and-news conversation for alleged hateful or abusive language, showing that benign calls can be incorrectly flagged and made unavailable unless a human reviewer releases them.","Purchased call time is unusually time-limited: all free and paid minutes expire when the service closes permanently on September 27, and unused minutes are forfeited."],"referencedReports":[],"body":"\u003cp\u003eTalking Tilly, a video-call service for AI character Tilly Norwood run by UK company Xicoia, requires every caller worldwide to pass an automated age check before the first call. Didit analyzes a video selfie to estimate the caller’s age, with government photo ID as a fallback if the estimate is unclear. Xicoia says selfies are sent directly to Didit, no biometric template is created, and the company retains only an approximate age band and reference number after the check.\u003c/p\u003e\n\n\u003cp\u003eDuring calls, the service analyzes callers’ camera feeds and voice tone to infer their emotional state, and this analysis cannot be disabled for an individual call. Calls are recorded, transcribed, and processed live by U.S. providers; transcripts can be retained for up to eight weeks, while conversation memory can be deleted on request. The article notes that the service’s age gate and mood analysis rely on legitimate interests rather than consent, and that a UK regulatory direction may have resulted in face-based checks being imposed on callers globally.\u003c/p\u003e\n"}]</script>
