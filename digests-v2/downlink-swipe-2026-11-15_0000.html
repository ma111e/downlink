<script type="application/json" id="dl-articles">[{"n":8,"title":"litellm 1.107.0 Compromised on PyPI and Docker: Credential Stealer and Hourly Remote Code Loader","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/litellm-1-107-0-compromised-pypi-backdoored-wheels-credential-stealer","time":"20:06","priority":"MUST READ","score":98,"tldr":"LiteLLM 1.107.0 PyPI wheels and official Docker images were compromised with a Python startup-hook credential stealer and hourly remote-code loader, exposing cloud, browser, SSH, AI-tool, CI, and proxy database secrets. Anyone who installed or ran the affected artifacts on October 21, 2026 should treat the host as fully compromised, rebuild it, and rotate all reachable credentials.","briefOverview":"\u003cp\u003eLiteLLM version 1.107.0 was published on PyPI on October 21, 2026 with malware in all seven compiled wheels, and the same files were included in official LiteLLM Docker images. The affected artifacts installed Python startup files named \u003ccode\u003ecook.pth\u003c/code\u003e, \u003ccode\u003ecook.py\u003c/code\u003e, and \u003ccode\u003esitecustomize.py\u003c/code\u003e, causing malicious code to run whenever Python started, even when LiteLLM was not imported. PyPI removed the release and BerriAI removed or repointed affected Docker tags, while clean releases resumed on October 24.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003ecook.py\u003c/code\u003e payload, called privcollect, gathered browser data, SSH and GPG keys, cloud credentials, process environment variables, AI coding-tool credentials, and LiteLLM proxy database credentials, then encrypted and sent the data to \u003ccode\u003ewww.litellm.dev\u003c/code\u003e. A separate \u003ccode\u003esitecustomize.py\u003c/code\u003e payload launched a detached process on Linux and macOS that checked an attacker-controlled GitHub location every hour and could download and execute additional Python code. BerriAI reported that an unrecalled master key exposed in a public repository led to theft of a GitHub organization owner token, which was used to steal CI secrets and modify the legitimate release workflow to build malicious artifacts from a lookalike repository.\u003c/p\u003e\n\n\u003cp\u003eThe article advises organizations that installed LiteLLM 1.107.0 from wheels or ran affected images to treat the relevant hosts as fully compromised. It recommends killing the loader process, rebuilding affected environments or containers, pinning a clean LiteLLM release, blocking \u003ccode\u003elitellm.dev\u003c/code\u003e, and rotating every credential the affected host could access. The article also states that stolen AWS instance-role credentials were used later on October 21 for AWS discovery activity consistent with abuse of paid LLM services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["All seven PyPI wheels for LiteLLM 1.107.0 and the associated official Docker images contained cook.pth, cook.py, and sitecustomize.py, which ran automatically when Python started without requiring an import of LiteLLM.","The embedded privcollect payload collected browser data, SSH and GPG keys, cloud credentials, process environment variables, AI coding-tool credentials, and LiteLLM proxy database credentials, then sent an encrypted bundle to www.litellm.dev.","A second payload created a detached background process on Linux and macOS that checked an attacker-controlled GitHub location every hour and could download and execute Python code.","BerriAI reported that an unrecalled master key exposed in a public repository enabled theft of a GitHub organization owner token, which was then used to steal CI secrets and alter the release workflow to build from a lookalike repository.","Organizations that installed LiteLLM 1.107.0 from a wheel or ran affected Docker images are advised to treat the host as compromised, rebuild affected environments, and rotate every credential the host could access."],"insights":["The malicious files used standard Python startup behavior, so simply running pip, tests, notebooks, or any Python process in an infected environment could trigger them even if LiteLLM was never imported.","The package source archive did not contain the payload itself, while nearly all normal installations used compromised prebuilt wheels, illustrating why inspecting only source code or source archives would have missed the active malware.","The credential collector could read environment variables from other processes on Linux, meaning a compromised CI runner or gateway could expose secrets unrelated to the Python process that launched it.","The remote-code loader’s GitHub dead-drop account could potentially be recreated by another party in the future, so removing the LiteLLM package alone would not eliminate the risk from an already-running detached loader.","The attacker altered the legitimate release workflow rather than bypassing it, allowing malicious artifacts to be built, signed, and published through BerriAI’s normal trusted pipeline."],"referencedReports":[{"title":"The attack chain behind the v1.107.0 LiteLLM release","url":"https://docs.litellm.ai/blog/security-incident-oct-21-2026-attack-chain","publisher":"berriai","context":"The article cites BerriAI’s detailed attack-chain report as the source that corrected its initial explanation of how the release workflow was compromised.","category":"research","primary":true},{"title":"Contained: Oct 21, 2026 LiteLLM release v1.107.0 Compromised","url":"https://docs.litellm.ai/blog/security-incident-oct-21-2026","publisher":"berriai","context":"The article references this as LiteLLM’s official post-mortem for the compromised v1.107.0 release.","category":"advisory","primary":true},{"title":"litellm 1.107.0 compromised","url":"https://github.com/BerriAI/litellm/issues/47826","publisher":"lidor-machluf","context":"The article says Lidor Machluf of Upwind reported the compromise in this issue, including Docker-image and build-provenance analysis tracing the release to a lookalike repository.","category":"research","primary":true},{"title":"litellm credential stealer hidden in PyPI wheel","url":"https://www.stepsecurity.io/blog/litellm-credential-stealer-hidden-in-pypi-wheel","publisher":"stepsecurity","context":"The article links to StepSecurity’s analysis of the earlier March 2026 LiteLLM PyPI compromise.","category":"research","primary":false}],"body":"\u003cp\u003eLiteLLM version 1.107.0 was published on PyPI on October 21, 2026 with malware in all seven compiled wheels, and the same files were included in official LiteLLM Docker images. The affected artifacts installed Python startup files named \u003ccode\u003ecook.pth\u003c/code\u003e, \u003ccode\u003ecook.py\u003c/code\u003e, and \u003ccode\u003esitecustomize.py\u003c/code\u003e, causing malicious code to run whenever Python started, even when LiteLLM was not imported. PyPI removed the release and BerriAI removed or repointed affected Docker tags, while clean releases resumed on October 24.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003ecook.py\u003c/code\u003e payload, called privcollect, gathered browser data, SSH and GPG keys, cloud credentials, process environment variables, AI coding-tool credentials, and LiteLLM proxy database credentials, then encrypted and sent the data to \u003ccode\u003ewww.litellm.dev\u003c/code\u003e. A separate \u003ccode\u003esitecustomize.py\u003c/code\u003e payload launched a detached process on Linux and macOS that checked an attacker-controlled GitHub location every hour and could download and execute additional Python code. BerriAI reported that an unrecalled master key exposed in a public repository led to theft of a GitHub organization owner token, which was used to steal CI secrets and modify the legitimate release workflow to build malicious artifacts from a lookalike repository.\u003c/p\u003e\n\n\u003cp\u003eThe article advises organizations that installed LiteLLM 1.107.0 from wheels or ran affected images to treat the relevant hosts as fully compromised. It recommends killing the loader process, rebuilding affected environments or containers, pinning a clean LiteLLM release, blocking \u003ccode\u003elitellm.dev\u003c/code\u003e, and rotating every credential the affected host could access. The article also states that stolen AWS instance-role credentials were used later on October 21 for AWS discovery activity consistent with abuse of paid LLM services.\u003c/p\u003e\n"},{"n":1,"title":"FBI warns ARTEX AI hacking tool is powering global cyberattacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fbi-warns-artex-ai-hacking-tool-is-powering-global-cyberattacks/","time":"18:29","priority":"MUST READ","score":93,"tldr":"The FBI warns that threat actors are using the ARTEX AI-driven penetration-testing framework to automate global intrusions at unprecedented speed, including the ConnectWise supply-chain compromise affecting Microsoft 365 tenants. Organizations should monitor for ARTEX-related indicators and unusual automated, cloud, identity, and data-transfer activity.","briefOverview":"\u003cp\u003eThe FBI warned that multiple threat actors have used the AI-powered ARTEX penetration-testing framework since at least August 2026 to target organizations worldwide. ARTEX is an autonomous Go-based framework that uses AI agents and external large language models to perform reconnaissance, find vulnerabilities, exploit systems, raise privileges, and steal data with limited human involvement. The agency said some intrusions moved from initial targeting to privileged access in under three hours, enabling attackers to operate against multiple targets at once.\u003c/p\u003e\n\n\u003cp\u003eARTEX was linked to the October ConnectWise Cloud Backup supply-chain attack, where compromised application identities were used to access Microsoft 365 customer environments; Huntress identified at least 162 affected tenants. Microsoft attributed that campaign to Storm-0940, which used ARTEX for reconnaissance, password spraying, and abuse of cloud application permissions, while other reported campaigns affected South Korean financial institutions and organizations in 14 countries. Although the original GitHub repository was removed, ARTEX remains available through forks, archives, localized versions, and ARTEX PRO; the FBI advises organizations to monitor for automated request bursts, suspicious cloud activity, identity changes, and large data transfers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI warned that multiple threat actors have used the AI-powered ARTEX penetration-testing framework since at least August 2026 to target organizations in financial, government, technology, defense, healthcare, and other sectors.","ARTEX uses external AI models and specialized agents to automate tasks such as finding targets, identifying weaknesses, gaining access, escalating privileges, and stealing data.","The FBI said some ARTEX-enabled intrusions progressed from initial targeting to privileged access in under three hours, while allowing attackers to conduct operations against multiple targets simultaneously.","ARTEX was linked to the October ConnectWise Cloud Backup supply-chain attack, in which compromised application identities were used to access Microsoft 365 customer environments.","The FBI advisory provides ARTEX-related indicators and recommends that organizations monitor for unusual automated requests, suspicious cloud activity, unexpected credential or privilege changes, and large data transfers."],"insights":["Removing the original ARTEX repository did not stop its availability because community forks, archived copies, localized versions, and a commercial ARTEX PRO edition remain accessible.","ARTEX is described as especially effective against often-overlooked entry points such as partner portals, employee applications, legacy services, and third-party integrations.","Researchers identified more than 1,600 publicly exposed ARTEX consoles as of early November, while the FBI believes the true deployment count is significantly higher.","The article cautions that ARTEX-related IP-address indicators can become outdated or produce false positives, so defenders should also look for behavioral signs such as bursts of automated requests and unexpected identity changes."],"referencedReports":[{"title":"FBI FLASH advisory on ARTEX","url":"https://www.ic3.gov/CSA/2026/261113.pdf","publisher":"fbi","context":"The article is primarily based on this 13-page FBI advisory warning that threat actors are using ARTEX to automate cyberattacks.","category":"advisory","primary":true},{"title":"Storm-0940 uses ARTEX agentic AI in ConnectWise supply-chain compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/","publisher":"microsoft","context":"The article cites Microsoft's October investigation attributing the ConnectWise-related campaign to the China-state-aligned Storm-0940 group.","category":"research","primary":false},{"title":"MMD-072-2026 ARTEX detection signature","url":"http://blog.malwaremustdie.org/2026/11/mmd-072-2026-artex-detection-signature.html","publisher":"malwaremustdie","context":"The article references MalwareMustDie's open-source ARTEX detection signature pack and associated detection playbook for security monitoring tools.","category":"guide","primary":false}],"body":"\u003cp\u003eThe FBI warned that multiple threat actors have used the AI-powered ARTEX penetration-testing framework since at least August 2026 to target organizations worldwide. ARTEX is an autonomous Go-based framework that uses AI agents and external large language models to perform reconnaissance, find vulnerabilities, exploit systems, raise privileges, and steal data with limited human involvement. The agency said some intrusions moved from initial targeting to privileged access in under three hours, enabling attackers to operate against multiple targets at once.\u003c/p\u003e\n\n\u003cp\u003eARTEX was linked to the October ConnectWise Cloud Backup supply-chain attack, where compromised application identities were used to access Microsoft 365 customer environments; Huntress identified at least 162 affected tenants. Microsoft attributed that campaign to Storm-0940, which used ARTEX for reconnaissance, password spraying, and abuse of cloud application permissions, while other reported campaigns affected South Korean financial institutions and organizations in 14 countries. Although the original GitHub repository was removed, ARTEX remains available through forks, archives, localized versions, and ARTEX PRO; the FBI advises organizations to monitor for automated request bursts, suspicious cloud activity, identity changes, and large data transfers.\u003c/p\u003e\n"},{"n":9,"title":"OVHcloud CLI Compromised via GitHub Release Swap: Detonating the Real GlassWorm Loader and What We Found","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/ovhcloud-cli-github-release-swap-glassworm","time":"20:06","priority":"SHOULD READ","score":88,"tldr":"Attackers used a compromised OVHcloud contributor account to replace binaries for five ovhcloud-cli GitHub releases for 94 minutes, deploying the GlassWorm credential stealer to roughly 250 downloads. Anyone who ran a directly downloaded or script-installed affected binary should treat the host as compromised and rotate all accessible secrets from a separate machine.","briefOverview":"\u003cp\u003eOn October 19, 2026, an attacker using the GitHub account HassenBF replaced release binaries for OVHcloud CLI versions v0.11.0 through v0.15.0 without changing release tags or the source repository. The malicious assets were available for 94 minutes, were downloaded about 250 times, and included a credential-stealing payload. OVHcloud removed the files, released a clean immutable and attested v0.16.0, and published a security advisory. Users who ran affected binaries are advised to treat their machines as compromised and rotate every secret the machine could access from a different system.\u003c/p\u003e\n\n\u003cp\u003eThe swapped binaries were locally built from commit 5ead8ef with stripped Go build flags rather than the official release process, leaving a visible indicator: \u003ccode\u003eovhcloud version\u003c/code\u003e displayed \u003ccode\u003eundefined\u003c/code\u003e along with the build commit, while \u003ccode\u003eovhcloud upgrade\u003c/code\u003e identified the program as a development build. The stealer collected cloud, container, SSH, configuration, and AI-tool credentials, stored data under \u003ccode\u003e/tmp/envchecker-*\u003c/code\u003e, and sent an archive to the stated exfiltration endpoint. The project install script did not verify checksums, and the attacker replaced \u003ccode\u003echecksums.txt\u003c/code\u003e to match the malicious files, so repository-hosted checksum verification would not have detected the swap. Homebrew users were not exposed because its cask used pinned hashes, and arm64 Linux users relying only on \u003ccode\u003einstall.sh\u003c/code\u003e were not exposed because the script requested a nonexistent asset.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On October 19, 2026, an attacker using the GitHub account HassenBF replaced binaries on OVHcloud CLI releases v0.11.0 through v0.15.0 for 94 minutes without moving release tags or modifying the source repository.","The swapped binaries contained a credential stealer that collected AI-agent credential stores, cloud and container credentials, SSH keys, and configuration files, staged them in /tmp/envchecker-* directories, and sent an archive to 45.32.148.174/upload.","The affected release assets were locally built from commit 5ead8ef with a plain stripped Go build rather than the official release pipeline, causing ovhcloud version to report an undefined version and the attacker’s build commit.","OVHcloud removed the swapped assets, published a clean immutable and attested v0.16.0 release, and reported approximately 250 downloads.","Homebrew installations were not exposed because its cask pinned SHA-256 hashes and would reject swapped files, while arm64 Linux users relying only on install.sh were not exposed because that script’s arm64 asset request always returned a 404 error."],"insights":["The project’s install.sh never checked checksums, while the attacker replaced checksums.txt to match the malicious files, meaning only a hash pinned outside the repository could have reliably detected the swap.","Running \"ovhcloud version\" provided a simple local indicator: the swapped build displayed \"undefined\" as its version alongside commit 5ead8ef and its timestamp, and \"ovhcloud upgrade\" identified it as a development build.","Homebrew was protected not because it avoided the affected download URLs, but because its cask pinned per-architecture SHA-256 values and would reject files whose contents had been replaced.","On arm64 Linux, install.sh was not an exposure path because it requested an aarch64 asset name that did not exist; manual downloads and the CLI’s upgrade command remained possible exposure paths.","The recovered GlassWorm loader kept polling a Solana-based configuration location when the dead drop was empty, but crashed visibly when all of its Solana RPC providers were unreachable."],"referencedReports":[{"title":"OVHcloud security advisory GHSA-862f-55f-55f5-vmvw","url":"https://github.com/ovh/ovhcloud-cli/security/advisories/GHSA-862f-55f5-vmvw","publisher":"ovhcloud","context":"The article relies on OVHcloud’s advisory for the affected credential targets, malware behavior, download count, and remediation information.","category":"advisory","primary":true},{"title":"Glassworm Hacks OVH Clouds CLI tool","url":"https://opensourcemalware.com/blog/glassworm-hacks-ovh-clouds-cli-tool","publisher":"opensourcemalware","context":"The article cites this technical analysis for account-timeline work that informed recovery of the GlassWorm loader.","category":"research","primary":false},{"title":"GlassWorm staged malware behind runtime-rebuilt loaders","url":"https://checkmarx.com/zero-post/glassworm-targets-developer-ides-again-hiding-staged-malware-behind-runtime-rebuilt-loaders","publisher":"checkmarx","context":"The article references Checkmarx’s research as prior documentation of GlassWorm’s staged loader behavior.","category":"research","primary":false},{"title":"GlassWorm Self-Propagating VS Code Extension","url":"https://www.truesec.com/hub/blog/glassworm-self-propagating-vscode-extension","publisher":"truesec","context":"The article cites Truesec’s research as prior documentation of the GlassWorm IDE-extension playbook.","category":"research","primary":false},{"title":"Inside the Takedown of a Developer-Targeting Botnet","url":"https://www.crowdstrike.com/en-us/blog/inside-crowdstrike-takedown-of-a-developer-targeting-botnet","publisher":"crowdstrike","context":"The article cites CrowdStrike’s takedown report to explain why the Solana dead-drop infrastructure is currently inactive.","category":"research","primary":false}],"body":"\u003cp\u003eOn October 19, 2026, an attacker using the GitHub account HassenBF replaced release binaries for OVHcloud CLI versions v0.11.0 through v0.15.0 without changing release tags or the source repository. The malicious assets were available for 94 minutes, were downloaded about 250 times, and included a credential-stealing payload. OVHcloud removed the files, released a clean immutable and attested v0.16.0, and published a security advisory. Users who ran affected binaries are advised to treat their machines as compromised and rotate every secret the machine could access from a different system.\u003c/p\u003e\n\n\u003cp\u003eThe swapped binaries were locally built from commit 5ead8ef with stripped Go build flags rather than the official release process, leaving a visible indicator: \u003ccode\u003eovhcloud version\u003c/code\u003e displayed \u003ccode\u003eundefined\u003c/code\u003e along with the build commit, while \u003ccode\u003eovhcloud upgrade\u003c/code\u003e identified the program as a development build. The stealer collected cloud, container, SSH, configuration, and AI-tool credentials, stored data under \u003ccode\u003e/tmp/envchecker-*\u003c/code\u003e, and sent an archive to the stated exfiltration endpoint. The project install script did not verify checksums, and the attacker replaced \u003ccode\u003echecksums.txt\u003c/code\u003e to match the malicious files, so repository-hosted checksum verification would not have detected the swap. Homebrew users were not exposed because its cask used pinned hashes, and arm64 Linux users relying only on \u003ccode\u003einstall.sh\u003c/code\u003e were not exposed because the script requested a nonexistent asset.\u003c/p\u003e\n"},{"n":3,"title":"Cursor Says Stolen Fireworks AI Key Led to Trojanized Claude Code Extension Incident","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/stolen-fireworks-ai-key-led-to-cursor.html","time":"08:22","priority":"SHOULD READ","score":86,"tldr":"Cursor says a stolen Fireworks AI access key exposed limited customer and internal data, including some credentials, which an attacker later used to distribute a trojanized Claude Code extension through Cursor Marketplace. Up to 5,000 users may have received the malicious build during an 11-hour window on October 29, 2026.","briefOverview":"\u003cp\u003eCursor said the compromise of Anthropic’s Claude Code extension on its marketplace stemmed from an access key it had issued to Fireworks AI. Fireworks exposed the key, enabling an attacker to copy data from a read-only storage bucket Cursor shared with the provider. The bucket held limited coding-agent traces from sessions not using Privacy Mode, including unredacted API credentials belonging to fewer than 0.01% of customers.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used exposed credentials to access selected Cursor software services and obtain limited support data, contact details, coding conversation summaries, archived non-production source code, and some credentials sent to Cursor support. On October 29, 2026, a stolen internal credential was used to place trojanized Claude Code extension versions 2.1.312 and 2.1.313 into Cursor Marketplace, where they were available for about 11 hours and may have reached up to 5,000 users. Cursor removed the extension, took its marketplace offline, rotated credentials, ended Fireworks AI access to shared data, and said it detected no additional malicious activity after November 1, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cursor said an attacker used an access key issued to Fireworks AI, which Fireworks exposed, to copy data from a read-only storage bucket shared with the provider.","The storage bucket contained limited coding-agent session traces from users who had not enabled Privacy Mode, and fewer than 0.01% of customers had API credentials exposed in those traces.","The attacker used credentials from the exposed data to access select Cursor SaaS tools, obtaining archived non-production source-code repositories, limited support data, usage metrics, coding conversation summaries, and some credentials submitted to support.","On October 29, 2026, the attacker used a stolen internal credential to place trojanized Claude Code extension versions 2.1.312 and 2.1.313 in Cursor Marketplace, where they were available for about 11 hours.","Cursor said up to 5,000 users may have received the malicious extension build and that it found no additional malicious activity after November 1, 2026."],"insights":["The incident shows a chain of exposure: a key shared with Fireworks AI led to access to Cursor data, and credentials found there were then used to alter software distributed through Cursor Marketplace.","Cursor’s Privacy Mode was a meaningful boundary in this event, as the company said it found no evidence that users who enabled it were affected.","Data retained from coding sessions, most dating to 2025 and permitted for model training, included credentials that had not been removed, creating a later pathway into Cursor’s internal tools.","The Fireworks AI incident had effects beyond Cursor: Uber reported that compromised provider credentials exposed driver’s license information, and Notion also confirmed data theft linked to the same incident."],"referencedReports":[{"title":"Security Incident Update","url":"https://cursor.com/blog/security-incident-update","publisher":"cursor","context":"Cursor's incident update is the primary source for details on the stolen Fireworks AI key, data access, and trojanized Claude Code extension distribution.","category":"advisory","primary":true},{"title":"Security Bulletins","url":"https://fireworks.ai/security/bulletins","publisher":"fireworks-ai","context":"The article links to Fireworks AI's security bulletins regarding the exposure of the access key used in the Cursor incident.","category":"advisory","primary":false}],"body":"\u003cp\u003eCursor said the compromise of Anthropic’s Claude Code extension on its marketplace stemmed from an access key it had issued to Fireworks AI. Fireworks exposed the key, enabling an attacker to copy data from a read-only storage bucket Cursor shared with the provider. The bucket held limited coding-agent traces from sessions not using Privacy Mode, including unredacted API credentials belonging to fewer than 0.01% of customers.\u003c/p\u003e\n\n\u003cp\u003eThe attacker used exposed credentials to access selected Cursor software services and obtain limited support data, contact details, coding conversation summaries, archived non-production source code, and some credentials sent to Cursor support. On October 29, 2026, a stolen internal credential was used to place trojanized Claude Code extension versions 2.1.312 and 2.1.313 into Cursor Marketplace, where they were available for about 11 hours and may have reached up to 5,000 users. Cursor removed the extension, took its marketplace offline, rotated credentials, ended Fireworks AI access to shared data, and said it detected no additional malicious activity after November 1, 2026.\u003c/p\u003e\n"},{"n":10,"title":"eMudhra / emSign CA Compromise: What Python, pip, and CI/CD Users Need to Update","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/emudhra-emsign-ca-compromise-python-pip-ci-cd-update","time":"20:06","priority":"SHOULD READ","score":86,"tldr":"Update Python package tooling and certificate bundles immediately: compromised eMudhra/emSign intermediate CA keys could enable HTTPS impersonation of package indexes for clients that still trust affected chains. Upgrade certifi to 2026.10.19+, pip to 26.2.2+, and update uv, conda, Pixi, CI images, and any custom trust stores.","briefOverview":"\u003cp\u003eGoogle reported that eight eMudhra/emSign intermediate certificate authority private keys were generated with insufficient randomness, potentially allowing someone who recovers a key to create certificates impersonating websites. Python’s security team advised users to update packaging tools because affected certificate trust could let a dependency downloader accept an attacker’s HTTPS response if the attacker can intercept or redirect the connection. The article notes that this does not require compromise of the package registry itself, and it remains unknown whether attackers exploited the weakness against non-browser clients.\u003c/p\u003e\n\n\u003cp\u003eUsers should update certifi to 2026.10.19 or later, pip to 26.2.2 or later, and affected uv, sigstore, conda, and Pixi installations. Updating certifi in an application does not update pip’s separate bundled certificate store, while custom certificate files and selected system stores also require independent review. The article’s testing found that certifi 2026.10.19 and pip 26.2.2 rejected all fourteen published affected certificate chains, unlike the older certifi 2026.07.22 bundle, which accepted seven. Organizations should update Python installations that seed new environments, rebuild containers and CI images, and verify certificate rejection with the actual client and trust configuration in use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google reported that eight eMudhra/emSign intermediate certificate authority keys were generated with insufficient randomness, potentially allowing recovered keys to issue certificates impersonating websites.","Python users should update certifi to 2026.10.19 or later and pip to 26.2.2 or later, while also updating affected uv, sigstore, conda, and Pixi installations.","Updating a project's standalone certifi package does not update pip's separately bundled certificate store, so pip itself must be updated.","Testing described in the article found that certifi 2026.10.19 and pip 26.2.2 rejected all fourteen published affected certificate chains, while certifi 2026.07.22 accepted seven of them.","Organizations should rebuild containers and CI images, review custom certificate settings, and verify rejection using the actual client and trust configuration used by their workloads."],"insights":["A browser rejecting the affected certificate chains does not demonstrate that nearby Python tools reject them, because developer tools can use separate certificate stores and may not receive browser revocation updates.","Updating certifi inside an application environment does not replace pip’s vendored certificate bundle, so pip needs its own upgrade to version 26.2.2 or later.","Even after pip is upgraded in a virtual environment, the parent Python interpreter can still create new environments with an older pip through its bundled ensurepip wheel.","A corrected package-manager version is insufficient when an application explicitly selects an older custom certificate file or system trust store, which must be checked separately.","The article’s secure pip bootstrap uses a published SHA-256 hash for the direct wheel download, providing an integrity check when the existing pip TLS trust is considered suspect."],"referencedReports":[{"title":"Information for Python users regarding eMudhra/emSign CA certificate security incident","url":"https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576","publisher":"Python Security Team","context":"The article cites this Python security announcement for affected-tool update guidance and secure remediation steps.","category":"advisory","primary":true},{"title":"Protecting Chrome and Android users from compromised eMudhra intermediate CA certificates","url":"https://blog.google/security/protecting-chrome-and-android-users-from-compromised-emudhra-intermediate-ca-certificates/","publisher":"Google","context":"The article cites Google’s incident report for the weak intermediate-key issue and Chrome and Android blocking response.","category":"advisory","primary":true},{"title":"eMudhra / emSign coordinated disclosure","url":"https://emudhra.we-have-a-problem.com/","publisher":"Coordinated disclosure authors","context":"The article relies on the disclosure for the published affected certificate chains and client verification resources.","category":"advisory","primary":true},{"title":"Mozilla incident record for eMudhra/emSign","url":"https://bugzilla.mozilla.org/show_bug.cgi?id=2083449","publisher":"Mozilla","context":"The article cites Mozilla’s incident record for the affected TLS and code-signing intermediates and cross-signed certificate paths.","category":"advisory","primary":false},{"title":"GHSA-6q48-6c7w-9gw2: certifi advisory","url":"https://github.com/certifi/python-certifi/security/advisories/GHSA-6q48-6c7w-9gw2","publisher":"certifi","context":"The article cites this advisory for certifi’s initial 2026.10.18 fix and the later recommended 2026.10.19 version.","category":"advisory","primary":false},{"title":"GHSA-hq85-5cpj-mr62: uv advisory","url":"https://github.com/astral-sh/uv/security/advisories/GHSA-hq85-5cpj-mr62","publisher":"Astral","context":"The article cites this advisory for uv version 0.13.4 remediation and trust-store configuration considerations.","category":"advisory","primary":false}],"body":"\u003cp\u003eGoogle reported that eight eMudhra/emSign intermediate certificate authority private keys were generated with insufficient randomness, potentially allowing someone who recovers a key to create certificates impersonating websites. Python’s security team advised users to update packaging tools because affected certificate trust could let a dependency downloader accept an attacker’s HTTPS response if the attacker can intercept or redirect the connection. The article notes that this does not require compromise of the package registry itself, and it remains unknown whether attackers exploited the weakness against non-browser clients.\u003c/p\u003e\n\n\u003cp\u003eUsers should update certifi to 2026.10.19 or later, pip to 26.2.2 or later, and affected uv, sigstore, conda, and Pixi installations. Updating certifi in an application does not update pip’s separate bundled certificate store, while custom certificate files and selected system stores also require independent review. The article’s testing found that certifi 2026.10.19 and pip 26.2.2 rejected all fourteen published affected certificate chains, unlike the older certifi 2026.07.22 bundle, which accepted seven. Organizations should update Python installations that seed new environments, rebuild containers and CI images, and verify certificate rejection with the actual client and trust configuration in use.\u003c/p\u003e\n"},{"n":2,"title":"TSMC employee data breach linked to cloud provider","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/tsmc-employee-data-breach-linked-to-cloud-provider/","time":"15:23","priority":"SHOULD READ","score":82,"tldr":"TSMC confirmed that personal data belonging to current and former employees was exposed through a cloud service provider, while stating there is no evidence its own systems or customer operations were compromised. A threat actor calling itself SmithBianl is auctioning an alleged 6.9GB dataset containing roughly 46,000 employee records.","briefOverview":"\u003cp\u003eTSMC confirmed that personal data belonging to some current and former employees was made available online without authorization. The company said the information matched data stored in the system services of a cloud service provider it uses, indicating that the exposure occurred outside TSMC’s own infrastructure. TSMC said it has found no evidence that its systems were compromised and that operations and customers were not affected.\u003c/p\u003e\n\n\u003cp\u003eA threat actor using the alias SmithBianl posted a 499-row sample on November 8 and claimed to possess a 6.9GB dataset containing 46,000 employee records. The alleged information includes national ID numbers, addresses, contact details, and banking information, and the actor offered the dataset for auction starting at 3 BTC. TSMC is notifying impacted employees, providing support, and engaging a third-party cybersecurity firm to assist with the incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TSMC confirmed that unauthorized online material included personal data belonging to some current and former employees.","TSMC said the leaked data matched information stored in the system services of a cloud service provider and that it found no evidence its own systems were compromised.","A threat actor using the alias SmithBianl claimed to have a 6.9GB dataset containing 46,000 TSMC employee records and offered it for auction starting at 3 BTC.","The alleged dataset includes national ID numbers, addresses, contact information, and banking details.","TSMC is notifying affected staff, providing support, and working with a third-party cybersecurity firm."],"insights":["TSMC’s confirmation that the material matched data held in a cloud provider’s system services points to the provider environment rather than TSMC’s own infrastructure as the identified source of exposure.","The alleged records include both identity and banking information, combining several types of sensitive employee data in the claimed dataset.","The actor released a 499-row sample and set a one-week deadline before threatening a free public release if the dataset was not bought.","TSMC said the incident affects current and former employees while reporting no evidence of impact to its systems, operations, or customers."],"referencedReports":[],"body":"\u003cp\u003eTSMC confirmed that personal data belonging to some current and former employees was made available online without authorization. The company said the information matched data stored in the system services of a cloud service provider it uses, indicating that the exposure occurred outside TSMC’s own infrastructure. TSMC said it has found no evidence that its systems were compromised and that operations and customers were not affected.\u003c/p\u003e\n\n\u003cp\u003eA threat actor using the alias SmithBianl posted a 499-row sample on November 8 and claimed to possess a 6.9GB dataset containing 46,000 employee records. The alleged information includes national ID numbers, addresses, contact details, and banking information, and the actor offered the dataset for auction starting at 3 BTC. TSMC is notifying impacted employees, providing support, and engaging a third-party cybersecurity firm to assist with the incident.\u003c/p\u003e\n"},{"n":4,"title":"Italy Fines Meta €805 Million Over Facebook's Android Gallery Access Without Explicit Consent","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/italy-fines-meta-805-million-over.html","time":"11:27","priority":"SHOULD READ","score":78,"tldr":"Italy’s data protection authority fined Meta €805 million for Facebook’s Android gallery-suggestion feature, finding it accessed users’ photo libraries by default without specific, informed consent. Meta must disable the feature by default and obtain separate consent within 60 days, while it plans to appeal.","briefOverview":"\u003cp\u003eItaly’s data protection authority, the Garante, fined Meta €805 million over a Facebook for Android feature that suggests photos and videos from users’ phone galleries for posting. The authority found the feature was enabled by default and accessed photos, videos, and related metadata without users giving separate, explicit consent. The case concerns about 20 million Android users in Italy, and Meta said it plans to appeal the decision as disproportionate.\u003c/p\u003e\n\n\u003cp\u003eThe Garante found that Facebook used a single gallery permission for multiple functions without clearly explaining that it also enabled gallery suggestions. It ordered Meta to turn the feature off by default within 60 days, including for users who had previously granted gallery access, and to seek specific consent through a separate request. The authority said access to information stored on a phone requires free and informed consent under Italy’s Privacy Code, even if the information is not sent elsewhere or no harm is shown.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Italy’s data protection authority fined Meta €805 million over Facebook for Android’s gallery-suggestion feature.","The authority found that the feature was enabled by default and accessed users’ photos, videos, and related metadata without separate, explicit consent.","Meta has 60 days to disable the feature by default, including for users who previously granted gallery access, and to obtain specific consent through a separate request.","The investigation concerned roughly 20 million Android users in Italy and found that the breach remains ongoing for some users.","Meta said it will appeal the decision and maintains that users grant device permission and can change it at any time."],"insights":["The Italian authority concluded that a single broad gallery permission was insufficient because it covered several app functions and did not clearly tell users they were also enabling gallery suggestions.","Under the Italian rule applied in the case, accessing information stored on a phone requires free and informed consent even if no data is transmitted elsewhere and no harm is shown.","The order requires Meta to seek new, separate consent even from people who had already granted Facebook gallery access, rather than treating past permission as valid for this feature.","Italy’s authority rejected Meta’s argument that Ireland’s data protection authority should lead the case because the applicable ePrivacy rules do not use a one-stop-shop process.","The investigation did not assess whether gallery material was used to train AI models, and Meta denied that it had done so."],"referencedReports":[{"title":"Garante press release on Meta’s Facebook Android gallery access order","url":"https://garanteprivacy.it/home/docweb/-/docweb-display/docweb/10321080","publisher":"garante per la protezione dei dati personali","context":"The article cites the authority’s press release as setting out the order requiring Meta to obtain separate consent and disable the feature by default.","category":"advisory","primary":true},{"title":"Facebook accede foto non pubblicate","url":"https://www.consumer.bz.it/it/facebook-accede-foto-non-pubblicate","publisher":"centro tutela consumatori utenti","context":"The article says the Bolzano consumer protection group published consumer advice telling users how to disable gallery suggestions and review Facebook’s phone permissions.","category":"guide","primary":false}],"body":"\u003cp\u003eItaly’s data protection authority, the Garante, fined Meta €805 million over a Facebook for Android feature that suggests photos and videos from users’ phone galleries for posting. The authority found the feature was enabled by default and accessed photos, videos, and related metadata without users giving separate, explicit consent. The case concerns about 20 million Android users in Italy, and Meta said it plans to appeal the decision as disproportionate.\u003c/p\u003e\n\n\u003cp\u003eThe Garante found that Facebook used a single gallery permission for multiple functions without clearly explaining that it also enabled gallery suggestions. It ordered Meta to turn the feature off by default within 60 days, including for users who had previously granted gallery access, and to seek specific consent through a separate request. The authority said access to information stored on a phone requires free and informed consent under Italy’s Privacy Code, even if the information is not sent elsewhere or no harm is shown.\u003c/p\u003e\n"},{"n":5,"title":"The Bounce Was Real. The Message Inside It Was the Phish.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/genuine-bounce-passes-authentication-quoted-original-headers-fail","time":"11:00","priority":"MAY READ","score":66,"tldr":"A legitimate university bounce notice passed SPF, DKIM, DMARC, and compauth, but those results authenticated only the bounce—not the spoofed voicemail phishing email quoted inside it. Analysts must inspect authentication headers within bounced content, where the original showed SPF and DMARC failures with no DKIM signature.","briefOverview":"\u003cp\u003eA Canadian electrical engineer received an \u0026ldquo;undeliverable mail\u0026rdquo; notice from a university mailer-daemon that appeared authentic and was later quarantined as malicious. The notice passed SPF, DKIM, DMARC, and compauth checks, with two DKIM signatures carrying the same body hash. Those results accurately authenticated the university system that generated the bounce, but did not authenticate the message reproduced inside it.\u003c/p\u003e\n\n\u003cp\u003eThe quoted original message showed SPF failure, DMARC failure, no DKIM signature, a \u003ccode\u003e[127.0.0.1]\u003c/code\u003e HELO value, and Microsoft stamps identifying a UAE country code and a nonexistent PTR record. Its subject claimed a secure OneDrive document had been shared, while the body presented a voicemail card with a \u0026ldquo;Call Back\u0026rdquo; button; however, the recipient received the HTML as plain text, with no rendered button or clickable link. The article stresses that analysts must distinguish the outer bounce headers from the copied original headers, and that the route that delivered the bounce to the engineer\u0026rsquo;s mailbox—and whether the engineer was deliberately targeted—was not established.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Canadian electrical engineer received an authentic university delivery-failure notice that passed SPF, DKIM, DMARC, and compauth checks.","The authentication passes applied to the university-generated bounce notice, not to the spoofed message reproduced within its body.","The quoted original message showed SPF failure, DMARC failure, no DKIM signature, and a client-supplied loopback HELO value of [127.0.0.1].","The quoted lure used a secure-document subject and a voicemail-themed body with a Call Back button, but it reached the recipient as plain text with no rendered clickable link.","The record does not establish how the bounce was routed to the engineer's mailbox or whether the engineer was deliberately targeted."],"insights":["Passing SPF, DKIM, DMARC, and compauth checks can be misleading in a bounce scenario because they may verify only the mail system that created the delivery-failure notice, not the suspicious message copied into it.","Two DKIM signatures with the same body hash showed that the bounce text was not modified in transit, which supports treating the quoted headers as a preserved record rather than evidence that the quoted message itself was authenticated.","An ARC pass appearing inside copied message content does not establish that the attacker’s original message passed authentication, because the article says the university added that result while evaluating a copy already relayed by Microsoft.","The spoofed domain’s DMARC policy of p=none allowed an email that failed SPF and DMARC to be accepted, illustrating why domains owners should move beyond monitoring-only DMARC enforcement.","Although the lure contained a Call Back button in its quoted HTML, it was delivered to this recipient as plain text, so the article does not establish a live click path to the victim."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's statistics on the human element in breaches and phishing as an initial access vector.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA's guidance to support early reporting of suspicious email.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites the report as a reminder that attacker activity increasingly uses legitimate cloud infrastructure.","category":"research","primary":false}],"body":"\u003cp\u003eA Canadian electrical engineer received an \u0026ldquo;undeliverable mail\u0026rdquo; notice from a university mailer-daemon that appeared authentic and was later quarantined as malicious. The notice passed SPF, DKIM, DMARC, and compauth checks, with two DKIM signatures carrying the same body hash. Those results accurately authenticated the university system that generated the bounce, but did not authenticate the message reproduced inside it.\u003c/p\u003e\n\n\u003cp\u003eThe quoted original message showed SPF failure, DMARC failure, no DKIM signature, a \u003ccode\u003e[127.0.0.1]\u003c/code\u003e HELO value, and Microsoft stamps identifying a UAE country code and a nonexistent PTR record. Its subject claimed a secure OneDrive document had been shared, while the body presented a voicemail card with a \u0026ldquo;Call Back\u0026rdquo; button; however, the recipient received the HTML as plain text, with no rendered button or clickable link. The article stresses that analysts must distinguish the outer bounce headers from the copied original headers, and that the route that delivered the bounce to the engineer\u0026rsquo;s mailbox—and whether the engineer was deliberately targeted—was not established.\u003c/p\u003e\n"},{"n":7,"title":"StepSecurity Now Inventories AI Agent Plugins in Your GitHub Repositories and on Developer Machines","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/stepsecurity-now-inventories-ai-agent-plugins-in-your-github-repositories-and-on-developer-machines","time":"20:06","priority":"MAY READ","score":55,"tldr":"StepSecurity has launched inventories for Claude Code and Codex plugins installed on developer machines and published or enabled in GitHub repositories, helping organizations trace plugin sources, components, versions, and usage. The feature addresses AI agent plugins as a supply-chain risk because they can run hooks and code with developer privileges and propagate through repositories and marketplaces.","briefOverview":"\u003cp\u003eStepSecurity announced Agent Plugins inventories for both developer machines and GitHub repositories. Dev Machine Guard inventories Claude Code and Codex plugins installed across developer devices, while the GitHub view inventories plugins that organization repositories publish or enable. The two views are intended to show what extensions developers’ AI agents have and what repositories are distributing.\u003c/p\u003e\n\n\u003cp\u003eThe article describes plugins as a supply-chain surface because they can include skills, commands, hooks, tool connections, and language servers, with hooks able to run shell commands during an agent’s lifecycle. Claude Code plugins can execute code with the developer’s user privileges, potentially on machines holding SSH keys, cloud credentials, and publishing tokens. StepSecurity’s inventories distinguish self-declared plugin metadata from observed sources, display plugin components and enablement, and identify repositories that enable plugins for contributors.\u003c/p\u003e\n\n\u003cp\u003eDev Machine Guard reads agents’ installed-plugin records, configured marketplaces, manifests, and declared components without running plugins, hooks, scripts, or agent command-line tools, and without making network requests. Its inventory includes disabled plugins because they remain on devices and can be re-enabled without a new installation. The GitHub inventory identifies plugin folders from Claude Code and Codex manifests, including multiple plugins in a repository, and highlights cases where a plugin’s declared author or repository differs from its observed publishing source.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity introduced Agent Plugins inventories in Dev Machine Guard for Claude Code and Codex plugins installed on developer machines, and under GitHub for plugins that organization repositories publish or enable.","The Dev Machine Guard inventory shows a plugin’s declared publisher, marketplace and file source, observed versions, enabled or disabled status, supplied components, and devices where it is installed.","AI agent plugins can execute code with the developer’s user privileges, including hooks and locally started tool connections, and may access machines holding SSH keys, cloud credentials, and publishing tokens.","The GitHub inventory identifies plugins from their manifests, including plugins in repository subfolders, and shows the publishing repository, path, version, supplied components, and repositories that enable each plugin.","StepSecurity distinguishes self-declared manifest metadata from observed plugin sources, helping users investigate cases where a plugin’s stated author or repository differs from the repository that publishes it."],"insights":["A plugin’s claimed publisher, homepage, and repository are self-declared fields, so a mismatch between that information and the repository StepSecurity actually scanned is an immediate investigation signal.","A plugin can be installed but disabled and still remain available to be turned back on without another installation, which is why the inventory retains disabled plugins.","A GitHub-hosted marketplace can deliver plugin files from a local path inside the marketplace, meaning the marketplace location and the actual plugin-file source may differ.","Repositories can enable plugins for contributors through settings, and marketplaces configured for automatic updates can refresh those plugins in the background after changes are merged.","Dev Machine Guard reads agent records and plugin manifests without running plugins, hooks, scripts, or agent command-line tools, and without making network requests."],"referencedReports":[],"body":"\u003cp\u003eStepSecurity announced Agent Plugins inventories for both developer machines and GitHub repositories. Dev Machine Guard inventories Claude Code and Codex plugins installed across developer devices, while the GitHub view inventories plugins that organization repositories publish or enable. The two views are intended to show what extensions developers’ AI agents have and what repositories are distributing.\u003c/p\u003e\n\n\u003cp\u003eThe article describes plugins as a supply-chain surface because they can include skills, commands, hooks, tool connections, and language servers, with hooks able to run shell commands during an agent’s lifecycle. Claude Code plugins can execute code with the developer’s user privileges, potentially on machines holding SSH keys, cloud credentials, and publishing tokens. StepSecurity’s inventories distinguish self-declared plugin metadata from observed sources, display plugin components and enablement, and identify repositories that enable plugins for contributors.\u003c/p\u003e\n\n\u003cp\u003eDev Machine Guard reads agents’ installed-plugin records, configured marketplaces, manifests, and declared components without running plugins, hooks, scripts, or agent command-line tools, and without making network requests. Its inventory includes disabled plugins because they remain on devices and can be re-enabled without a new installation. The GitHub inventory identifies plugin folders from Claude Code and Codex manifests, including multiple plugins in a repository, and highlights cases where a plugin’s declared author or repository differs from its observed publishing source.\u003c/p\u003e\n"},{"n":6,"title":"GitHub Actions Native Egress Firewall vs. Harden-Runner: Five Differences That Matter","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/github-actions-native-egress-firewall-vs-harden-runner-five-differences-that-matter","time":"20:06","priority":"MAY READ","score":35,"tldr":"StepSecurity argues that Harden-Runner provides broader CI/CD runner protection than GitHub’s native egress firewall, adding cross-platform coverage, behavioral and file-write monitoring, threat-intelligence blocking, and centralized policy enforcement. The article positions it as a runtime security solution for both GitHub-hosted and self-hosted runners.","briefOverview":"\u003cp\u003eGitHub is introducing a native egress firewall for GitHub-hosted Actions runners, and StepSecurity compares that feature with its Harden-Runner runtime security agent. The article welcomes GitHub’s firewall as an expansion of network controls but argues that runners also need visibility into processes, file changes, and unexpected behavior. StepSecurity says this need applies across CI/CD platforms because runners execute third-party code, handle credentials, and produce software delivered to customers.\u003c/p\u003e\n\n\u003cp\u003eThe article says GitHub’s firewall preview supports GitHub-hosted Linux runners, while Harden-Runner supports Linux, Windows, and macOS on GitHub-hosted and self-hosted infrastructure. Harden-Runner builds network baselines from past workflow runs, flags new destinations, and correlates network, process, and file events to specific workflow steps. StepSecurity also says its Global Block List blocks known malicious endpoints even in audit mode, while Lockdown Mode can terminate suspicious processes and stop a job. The product additionally monitors writes to checked-out source files during builds and provides centralized visibility and deny policies to help organizations migrate package downloads to approved registries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub’s native egress firewall preview supports GitHub-hosted Linux runners, while StepSecurity’s Harden-Runner supports Linux, Windows, and macOS on GitHub-hosted and self-hosted runners.","Harden-Runner builds network baselines from prior workflow runs and flags new destinations, correlating network, process, and file events with the workflow step involved.","StepSecurity states that Harden-Runner blocks connections to endpoints on its Global Block List even in audit mode and can terminate processes or stop jobs through Lockdown Mode when suspicious behavior is detected.","Harden-Runner monitors file writes during jobs and flags changes to checked-out source files, which StepSecurity says can help detect build tampering that network-only controls cannot observe.","The article states that organizations can use Harden-Runner’s centralized dashboard, API, and MCP server to identify jobs that directly contact public package registries and apply deny policies to prevent bypassing approved registries."],"insights":["An approved-domain allowlist may not catch a compromise when malicious code contacts a legitimate hosting domain for the first time, as illustrated by the tj-actions/changed-files incident involving gist.githubusercontent.com.","A build can be tampered with without any new outbound network connection; the article cites SUNSPOT’s temporary source-file replacement during the SolarWinds build process as an example.","Harden-Runner’s Global Block List is intended to provide immediate protection even for teams that have not yet created their own network-blocking policies, because listed malicious endpoints are blocked in audit mode.","Organizations can use centralized network-history searches to create a concrete list of jobs still downloading directly from public registries before enforcing blocks that require approved registry use."],"referencedReports":[],"body":"\u003cp\u003eGitHub is introducing a native egress firewall for GitHub-hosted Actions runners, and StepSecurity compares that feature with its Harden-Runner runtime security agent. The article welcomes GitHub’s firewall as an expansion of network controls but argues that runners also need visibility into processes, file changes, and unexpected behavior. StepSecurity says this need applies across CI/CD platforms because runners execute third-party code, handle credentials, and produce software delivered to customers.\u003c/p\u003e\n\n\u003cp\u003eThe article says GitHub’s firewall preview supports GitHub-hosted Linux runners, while Harden-Runner supports Linux, Windows, and macOS on GitHub-hosted and self-hosted infrastructure. Harden-Runner builds network baselines from past workflow runs, flags new destinations, and correlates network, process, and file events to specific workflow steps. StepSecurity also says its Global Block List blocks known malicious endpoints even in audit mode, while Lockdown Mode can terminate suspicious processes and stop a job. The product additionally monitors writes to checked-out source files during builds and provides centralized visibility and deny policies to help organizations migrate package downloads to approved registries.\u003c/p\u003e\n"}]</script>
