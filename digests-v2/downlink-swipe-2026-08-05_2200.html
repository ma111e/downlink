<script type="application/json" id="dl-articles">[{"n":2,"title":"Shai-Hulud strikes again: CHAINDROP worm hits 400+ npm packages","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/shai-hulud-chaindrop-npm-supply-chain","time":"00:00","priority":"MUST READ","score":96,"tldr":"Elastic Security Labs found a new Shai-Hulud npm supply-chain campaign in which the CHAINDROP worm compromised 400+ packages, including the widely used keyv ecosystem, by stealing developer credentials and using npm tokens to automatically backdoor more packages. Affected teams should avoid immediate package updates, hunt for the listed indicators, and rotate npm, GitHub, cloud, CI/CD, and other secrets from impacted systems.","briefOverview":"\u003cp\u003eElastic Security Labs identified a new Shai-Hulud campaign on August 4, 2026, targeting the maintainer of \u003ccode\u003ekeyv\u003c/code\u003e, a widely used key-value storage library. The attackers trojanized the monorepo and embedded a self-propagating worm called CHAINDROP that uses stolen npm credentials to backdoor other packages the maintainer can publish. At the time of writing, more than 400 unique npm packages had been compromised, with \u003ccode\u003ekeyv\u003c/code\u003e alone receiving over 600 million downloads in the previous month.\u003c/p\u003e\n\n\u003cp\u003eCHAINDROP is triggered through a \u003ccode\u003epreinstall\u003c/code\u003e hook in \u003ccode\u003epackage.json\u003c/code\u003e, which runs commands before a package is installed. The malware uses a dropper called \u003ccode\u003esetup.mjs\u003c/code\u003e to download and run \u003ccode\u003ebun\u003c/code\u003e if needed, then execute an obfuscated payload named \u003ccode\u003eMath_Symbol.js\u003c/code\u003e or \u003ccode\u003emath_init.js\u003c/code\u003e across Linux, macOS, and Windows. The payload harvests credentials from more than 300 patterns, including AI tooling, cloud providers, GitHub, HashiCorp Vault, SSH private keys, Kubernetes service account tokens, and npm tokens.\u003c/p\u003e\n\n\u003cp\u003eThe worm retrieves its exfiltration endpoint from an Ethereum smart contract and can fall back to GitHub commit history or public GitHub repositories if other paths fail. When it finds an npm token with package write permissions and the ability to publish without two-factor authentication, it downloads writable packages, injects malicious components, patches \u003ccode\u003epackage.json\u003c/code\u003e, bumps the patch version, and republishes them. The article recommends delaying adoption of new package updates, revoking affected GitHub and npm tokens, checking repositories for unauthorized \u003ccode\u003echore: update config\u003c/code\u003e commits, rotating impacted credentials, upgrading to npm 12 or later, and enabling 2FA on npm accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs identified a new Shai-Hulud campaign on August 4, 2026, targeting the maintainer of keyv and compromising more than 400 unique npm packages.","CHAINDROP executes through a preinstall hook in package.json and uses a dropper called setup.mjs to run an obfuscated payload named Math_Symbol.js or math_init.js across Linux, macOS, and Windows.","The payload includes a credential harvester that scans more than 300 patterns for credentials related to AI tools, cloud providers, GitHub, HashiCorp Vault, SSH keys, Kubernetes service account tokens, and npm tokens.","CHAINDROP retrieves its exfiltration endpoint from an Ethereum smart contract and can fall back to GitHub commit history or public GitHub repositories for exfiltration if other methods fail.","When CHAINDROP finds an npm token with package write permissions and the ability to publish without two-factor authentication, it downloads writable packages, injects malicious components, patches package.json, bumps the patch version, and republishes them to npm."],"insights":["The filename can help distinguish the infection path: Math_Symbol.js appears in packages compromised directly from the keyv monorepo, while math_init.js appears in packages trojanized during worm propagation, even though both files share the same SHA-256 hash.","Developers can be infected without installing a package because the campaign also abuses Claude Code SessionStart hooks and VS Code folderOpen tasks to execute setup.mjs when an infected repository is opened.","The worm only propagates through npm tokens that both have package write permissions and can publish without two-factor authentication, making revocation of bypass_2fa automation tokens especially urgent.","Worm-generated GitHub commits have recognizable markers, including the author name claude and the commit message chore: update config, which gives defenders a concrete way to search repositories for unauthorized changes.","CHAINDROP’s use of an Ethereum smart contract to retrieve its exfiltration endpoint lets the attacker rotate infrastructure without modifying the payload, so blocking only the domains observed during detonation may be insufficient."],"referencedReports":[],"body":"\u003cp\u003eElastic Security Labs identified a new Shai-Hulud campaign on August 4, 2026, targeting the maintainer of \u003ccode\u003ekeyv\u003c/code\u003e, a widely used key-value storage library. The attackers trojanized the monorepo and embedded a self-propagating worm called CHAINDROP that uses stolen npm credentials to backdoor other packages the maintainer can publish. At the time of writing, more than 400 unique npm packages had been compromised, with \u003ccode\u003ekeyv\u003c/code\u003e alone receiving over 600 million downloads in the previous month.\u003c/p\u003e\n\n\u003cp\u003eCHAINDROP is triggered through a \u003ccode\u003epreinstall\u003c/code\u003e hook in \u003ccode\u003epackage.json\u003c/code\u003e, which runs commands before a package is installed. The malware uses a dropper called \u003ccode\u003esetup.mjs\u003c/code\u003e to download and run \u003ccode\u003ebun\u003c/code\u003e if needed, then execute an obfuscated payload named \u003ccode\u003eMath_Symbol.js\u003c/code\u003e or \u003ccode\u003emath_init.js\u003c/code\u003e across Linux, macOS, and Windows. The payload harvests credentials from more than 300 patterns, including AI tooling, cloud providers, GitHub, HashiCorp Vault, SSH private keys, Kubernetes service account tokens, and npm tokens.\u003c/p\u003e\n\n\u003cp\u003eThe worm retrieves its exfiltration endpoint from an Ethereum smart contract and can fall back to GitHub commit history or public GitHub repositories if other paths fail. When it finds an npm token with package write permissions and the ability to publish without two-factor authentication, it downloads writable packages, injects malicious components, patches \u003ccode\u003epackage.json\u003c/code\u003e, bumps the patch version, and republishes them. The article recommends delaying adoption of new package updates, revoking affected GitHub and npm tokens, checking repositories for unauthorized \u003ccode\u003echore: update config\u003c/code\u003e commits, rotating impacted credentials, upgrading to npm 12 or later, and enabling 2FA on npm accounts.\u003c/p\u003e\n"},{"n":1,"title":"Ransom Cartel ransomware creator sentenced to 16 years in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ransom-cartel-ransomware-creator-sentenced-to-16-years-in-prison/","time":"23:00","priority":"SHOULD READ","score":78,"tldr":"Maksim Silnikau, the Belarusian creator and administrator of the Ransom Cartel ransomware operation, was sentenced to 16 years in U.S. prison for attacks on at least 18 organizations worldwide. Prosecutors said the group attempted to extort at least $5.2 million and caused more than $6.7 million in known victim losses.","briefOverview":"\u003cp\u003eMaksim Silnikau, a 40-year-old Belarusian national, was sentenced to 16 years in prison for his role as the creator and administrator of the Ransom Cartel ransomware operation. The U.S. Department of Justice said he was sentenced for conspiracy to commit offenses against the United States, conspiracy to commit wire fraud, and aggravated identity theft. Prosecutors said Ransom Cartel affiliates attacked at least 18 companies worldwide between 2021 and 2023 and attempted to extort at least $5.2 million from victims.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Silnikau began developing Ransom Cartel in May 2021 and recruited other cybercriminals through underground forums. He supplied members with stolen credentials and software used to encrypt victims’ computers, and he operated an affiliate website used to manage attacks, communicate, negotiate ransom demands, and distribute revenue shares. The operation stole corporate data and demanded payment for decryption keys or promises not to leak stolen information.\u003c/p\u003e\n\n\u003cp\u003eThe United States identified more than \u003cspan class=\"math inline\"\u003e\\(6.7 million in losses among 18 known victims, with prosecutors saying the total was likely higher because some victims had not reported attacks. Reported incidents included a medical technology startup disrupted for two months and law firm infrastructure outages lasting from several days to multiple months, with two law firms paying ransoms of \\)\u003c/span\u003e125,000 and $300,000. Silnikau was initially arrested in Spain in July 2023, fled while awaiting extradition, was later captured while trying to return to Belarus, and was ultimately extradited from Poland to the United States.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Maksim Silnikau, the creator and administrator of the Ransom Cartel ransomware operation, was sentenced to 16 years in prison for his role in attacks against at least 18 companies worldwide.","The U.S. Department of Justice said Silnikau was sentenced for conspiracy to commit offenses against the United States, conspiracy to commit wire fraud, and aggravated identity theft.","According to court documents, Silnikau began developing Ransom Cartel in May 2021, recruited other cybercriminals through underground forums, supplied tools and stolen credentials, and operated an affiliate website for managing attacks and ransom payments.","Federal prosecutors said Ransom Cartel affiliates attempted to extort at least $5.2 million and caused more than $6.7 million in known losses among 18 victims.","Silnikau was initially arrested in Spain in July 2023, fled while awaiting extradition, was later captured while attempting to return to Belarus, and ultimately was extradited from Poland to the United States."],"insights":["Ransom Cartel’s impact extended beyond ransom demands, with one medical technology startup disrupted for two months and law firm infrastructure outages lasting from several days to multiple months.","Researchers linked Ransom Cartel to REvil through shared code similarities, but missing REvil obfuscation features suggested it may have been built by someone without access to the full REvil source code.","Silnikau’s role covered multiple parts of the operation, including recruiting affiliates, coordinating with initial access brokers, communicating with victims, handling ransom payments, and using cryptocurrency mixers to obscure funds.","The known financial harm was likely incomplete because prosecutors said some victims had not reported their attacks, even though 18 identified victims already accounted for more than $6.7 million in losses."],"referencedReports":[],"body":"\u003cp\u003eMaksim Silnikau, a 40-year-old Belarusian national, was sentenced to 16 years in prison for his role as the creator and administrator of the Ransom Cartel ransomware operation. The U.S. Department of Justice said he was sentenced for conspiracy to commit offenses against the United States, conspiracy to commit wire fraud, and aggravated identity theft. Prosecutors said Ransom Cartel affiliates attacked at least 18 companies worldwide between 2021 and 2023 and attempted to extort at least $5.2 million from victims.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Silnikau began developing Ransom Cartel in May 2021 and recruited other cybercriminals through underground forums. He supplied members with stolen credentials and software used to encrypt victims’ computers, and he operated an affiliate website used to manage attacks, communicate, negotiate ransom demands, and distribute revenue shares. The operation stole corporate data and demanded payment for decryption keys or promises not to leak stolen information.\u003c/p\u003e\n\n\u003cp\u003eThe United States identified more than \u003cspan class=\"math inline\"\u003e\\(6.7 million in losses among 18 known victims, with prosecutors saying the total was likely higher because some victims had not reported attacks. Reported incidents included a medical technology startup disrupted for two months and law firm infrastructure outages lasting from several days to multiple months, with two law firms paying ransoms of \\)\u003c/span\u003e125,000 and $300,000. Silnikau was initially arrested in Spain in July 2023, fled while awaiting extradition, was later captured while trying to return to Belarus, and was ultimately extradited from Poland to the United States.\u003c/p\u003e\n"}]</script>
