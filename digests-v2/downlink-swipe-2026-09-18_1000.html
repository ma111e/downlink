<script type="application/json" id="dl-articles">[{"n":3,"title":"Hacking group ‘NightEagle’ targeting China’s high-tech sector expands operations to Russia","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/hacking-group-nighteagle-expands-russia-china","time":"13:24","priority":"SHOULD READ","score":84,"tldr":"NightEagle (APT-Q-95), a cyberespionage group previously focused on China’s high-tech and defense sectors, has expanded to target Russian organizations. Kaspersky says the group uses stolen VPN credentials, Microsoft Exchange backdoor GhostContainer, and Active Directory abuse to persist, move laterally, and pursue domain controllers.","briefOverview":"\u003cp\u003eNightEagle, also known as APT-Q-95, has expanded from its earlier focus on organizations in China to target Russian businesses, according to Kaspersky. The group has been active since at least 2023 and was previously reported targeting Chinese defense, semiconductor, artificial-intelligence, and quantum-technology organizations. Kaspersky did not name the affected Russian companies or say how many were targeted. The group’s attribution remains uncertain, despite prior unconfirmed Chinese research associating it with North America.\u003c/p\u003e\n\n\u003cp\u003eKaspersky said the attackers commonly used stolen credentials to enter corporate networks through VPNs before targeting Microsoft Exchange servers. They installed the GhostContainer backdoor, which can remotely control compromised servers, evade some Windows security and logging mechanisms, and redirect network traffic. The group also used GitHub repositories disguised as legitimate software, including AdobeSync and TrueConf, to store archives of hacking tools. After gaining access, the attackers abused weaknesses in Active Directory to gain privileges, move across systems, steal credentials, impersonate users, and attempt to compromise domain controllers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky reported that NightEagle, also known as APT-Q-95, expanded from its previous focus in Asia to target Russian businesses over the past year.","The group commonly used stolen credentials to enter corporate networks through VPNs, then targeted Microsoft Exchange servers and deployed the GhostContainer backdoor.","GhostContainer enables remote control of compromised servers, can evade some Windows security and logging mechanisms, and can redirect network traffic.","The attackers abused weaknesses in Active Directory to obtain higher privileges, move across networks, steal credentials, impersonate users, and attempt to compromise domain controllers.","QiAnXin previously reported that the group had targeted Chinese organizations in defense, semiconductors, artificial intelligence, and quantum technology since at least 2023."],"insights":["NightEagle’s use of stolen VPN credentials means its initial access can appear to come from legitimate user accounts rather than an obviously malicious entry point.","Researchers observed the group disguising GitHub repositories and tool archives with names resembling legitimate software, including AdobeSync and TrueConf.","Kaspersky could not confirm exactly how GhostContainer was initially placed on Exchange servers, although it believes the group may use encryption-key extraction and memory-based execution techniques observed previously.","The group’s attribution remains uncertain: Chinese researchers associated it with North America, but that claim has not been independently confirmed."],"referencedReports":[{"title":"NightEagle APT: GhostContainer and tunneling","url":"https://securelist.ru/tr/nighteagle-apt-ghostcontainer-and-tunneling/117051/","publisher":"kaspersky","context":"The article relies on Kaspersky’s research into incidents affecting Russian businesses and the group’s use of GhostContainer.","category":"research","primary":true},{"title":"APT-Q-95 (NightEagle) operation research","url":"https://www.qianxin.com/news/detail?news_id=13663","publisher":"qianxin","context":"The article cites QiAnXin’s July 2025 research describing the group’s earlier targeting of sensitive Chinese industries.","category":"research","primary":false}],"body":"\u003cp\u003eNightEagle, also known as APT-Q-95, has expanded from its earlier focus on organizations in China to target Russian businesses, according to Kaspersky. The group has been active since at least 2023 and was previously reported targeting Chinese defense, semiconductor, artificial-intelligence, and quantum-technology organizations. Kaspersky did not name the affected Russian companies or say how many were targeted. The group’s attribution remains uncertain, despite prior unconfirmed Chinese research associating it with North America.\u003c/p\u003e\n\n\u003cp\u003eKaspersky said the attackers commonly used stolen credentials to enter corporate networks through VPNs before targeting Microsoft Exchange servers. They installed the GhostContainer backdoor, which can remotely control compromised servers, evade some Windows security and logging mechanisms, and redirect network traffic. The group also used GitHub repositories disguised as legitimate software, including AdobeSync and TrueConf, to store archives of hacking tools. After gaining access, the attackers abused weaknesses in Active Directory to gain privileges, move across systems, steal credentials, impersonate users, and attempt to compromise domain controllers.\u003c/p\u003e\n"},{"n":4,"title":"WeaselBiscuit Stealer Spreads via 13 npm Packages to Harvest Chrome Extension Storage","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/weaselbiscuit-stealer-spreads-via-13.html","time":"10:40","priority":"SHOULD READ","score":84,"tldr":"Researchers found 13 malicious npm packages distributing WeaselBiscuit, a lightweight JavaScript stealer that harvests Chrome extension storage across Windows, macOS, and Linux and can log keystrokes and clipboard data on Windows. The malware resembles DPRK-linked Contagious Interview tools such as BeaverTail and OtterCookie, but attribution to North Korea remains unconfirmed.","briefOverview":"\u003cp\u003eCybersecurity researchers identified 13 npm packages delivering a previously undocumented JavaScript stealer called WeaselBiscuit. The malware is triggered when an affected package is imported, causing a loader to retrieve the main code from an Npoint URL and run it directly in memory. WeaselBiscuit is described as a smaller, stripped-down tool with functional overlap with BeaverTail and OtterCookie, which are associated with the DPRK-linked Contagious Interview campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter execution, WeaselBiscuit obtains its command-and-control configuration from a separate Npoint URL, profiles the infected computer, and collects Chrome extension storage on Windows, macOS, and Linux. It uploads every readable, nonempty file in Chrome\u0026rsquo;s Local Extension Settings directory, potentially exposing cryptocurrency wallet-extension state and other sensitive extension-held information. On Windows, operators can also instruct it to record clipboard contents and keystrokes, although the malware lacks persistence, remote-access features, wallet-draining code, and secondary-payload delivery capabilities. Researchers noted several tradecraft similarities to DPRK-associated activity but said there is no definitive evidence attributing WeaselBiscuit to North Korea.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers identified 13 npm packages that distribute a previously undocumented JavaScript information stealer named WeaselBiscuit.","When an affected npm package is imported, its loader retrieves the main WeaselBiscuit code from an Npoint URL and runs it in memory.","WeaselBiscuit collects Chrome extension storage on Windows, macOS, and Linux, including readable nonempty files in the Local Extension Settings directory.","On Windows systems, commands from its control server can direct WeaselBiscuit to record clipboard contents and keystrokes.","The malware shares functional and operational similarities with DPRK-associated BeaverTail and OtterCookie tooling, but researchers said there is no definitive evidence attributing WeaselBiscuit to North Korea."],"insights":["Importing one of the affected npm packages is sufficient to trigger the loader, which retrieves and runs the main malicious code directly in memory.","Although WeaselBiscuit lacks cryptocurrency wallet-draining code, its collection of Chrome extension storage can still expose wallet-extension state and other sensitive extension-held data.","The stealer uploads every readable, nonempty file from Chrome’s Local Extension Settings directory, rather than targeting only selected data.","The malware uses separate Npoint URLs for the main payload and its command-and-control configuration, while numerical campaign IDs distinguish installations."],"referencedReports":[{"title":"Introducing WeaselBiscuit","url":"https://opensourcemalware.com/blog/introducing-weaselbiscuit","publisher":"opensourcemalware","context":"The article relies on OpenSourceMalware's research to describe the WeaselBiscuit npm package cluster, capabilities, and potential links to DPRK-associated tooling.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers identified 13 npm packages delivering a previously undocumented JavaScript stealer called WeaselBiscuit. The malware is triggered when an affected package is imported, causing a loader to retrieve the main code from an Npoint URL and run it directly in memory. WeaselBiscuit is described as a smaller, stripped-down tool with functional overlap with BeaverTail and OtterCookie, which are associated with the DPRK-linked Contagious Interview campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter execution, WeaselBiscuit obtains its command-and-control configuration from a separate Npoint URL, profiles the infected computer, and collects Chrome extension storage on Windows, macOS, and Linux. It uploads every readable, nonempty file in Chrome\u0026rsquo;s Local Extension Settings directory, potentially exposing cryptocurrency wallet-extension state and other sensitive extension-held information. On Windows, operators can also instruct it to record clipboard contents and keystrokes, although the malware lacks persistence, remote-access features, wallet-draining code, and secondary-payload delivery capabilities. Researchers noted several tradecraft similarities to DPRK-associated activity but said there is no definitive evidence attributing WeaselBiscuit to North Korea.\u003c/p\u003e\n"},{"n":7,"title":"Microsoft Patches CVSS 10.0 Azure AI Foundry Flaw Enabling Unauthorized Privilege Escalation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/microsoft-patches-cvss-100-azure-ai.html","time":"12:47","priority":"SHOULD READ","score":84,"tldr":"Microsoft fixed CVE-2026-85889, a CVSS 10.0 Azure AI Foundry authentication flaw that could have allowed remote unauthorized privilege escalation; the cloud-service fix was applied automatically with no customer action required. It also addressed several other high-severity Azure, Microsoft 365 Copilot, and Windows privilege-escalation issues.","briefOverview":"\u003cp\u003eMicrosoft patched CVE-2026-85889, a CVSS 10.0 vulnerability in Azure AI Foundry that could allow an unauthorized attacker over a network to gain elevated privileges. Microsoft described the issue as missing authentication for a critical function and credited researcher Rémy Marot for reporting it. The company said there is no evidence of exploitation in the wild and that no customer action is required because the cloud-service issue has been fully mitigated.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also fixed critical cloud flaws in Microsoft 365 Copilot, Azure Database for PostgreSQL, and Azure Cosmos DB, with CVSS scores from 9.6 to 9.9. Separately, an out-of-band Windows 11 version 26H1 update, KB5129194, addresses two local privilege-escalation vulnerabilities affecting Windows User-Mode Power Service and Windows Secure Kernel Mode. The disclosure follows Microsoft’s patching of 974 vulnerabilities, including two Windows flaws that were under active exploitation; reports from Proofpoint and Volexity said an ALPC issue was chained with two Google Chrome flaws in the BlueMoon exploit kit.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft patched CVE-2026-85889, a CVSS 10.0 Azure AI Foundry flaw caused by missing authentication that could allow an unauthorized network attacker to elevate privileges.","Microsoft credited researcher Rémy Marot with reporting CVE-2026-85889 and said there is no evidence that it has been exploited in the wild.","Microsoft also mitigated critical cloud vulnerabilities affecting Microsoft 365 Copilot, Azure Database for PostgreSQL, and Azure Cosmos DB, and said customers need take no action for these cloud-based issues.","An out-of-band Windows 11 version 26H1 update, KB5129194, addresses CVE-2026-62721 in Windows User-Mode Power Service and CVE-2026-85921 in Windows Secure Kernel Mode.","Microsoft recently patched 974 vulnerabilities across its portfolio, including actively exploited flaws affecting Windows Advanced Local Procedure Call and the Windows Update Stack."],"insights":["The most severe Azure AI Foundry issue was fixed by Microsoft at the service level, so affected customers did not need to install or configure anything themselves.","Microsoft’s recent critical cloud fixes span AI development, productivity software, PostgreSQL databases, and Cosmos DB, indicating that the patched issues affected multiple distinct hosted services.","Unlike the cloud-service issues, the two Windows privilege-escalation flaws were addressed through an out-of-band Windows 11 version 26H1 update, KB5129194.","The article distinguishes the newly disclosed Azure AI Foundry flaw, which has no known exploitation, from a separate Windows ALPC flaw that reports say was used with Chrome flaws in the BlueMoon exploit kit."],"referencedReports":[{"title":"CVE-2026-85889: Azure AI Foundry Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85889","publisher":"microsoft","context":"Microsoft's advisory describes the missing-authentication flaw in Azure AI Foundry and its potential for unauthorized network-based privilege escalation.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft patched CVE-2026-85889, a CVSS 10.0 vulnerability in Azure AI Foundry that could allow an unauthorized attacker over a network to gain elevated privileges. Microsoft described the issue as missing authentication for a critical function and credited researcher Rémy Marot for reporting it. The company said there is no evidence of exploitation in the wild and that no customer action is required because the cloud-service issue has been fully mitigated.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft also fixed critical cloud flaws in Microsoft 365 Copilot, Azure Database for PostgreSQL, and Azure Cosmos DB, with CVSS scores from 9.6 to 9.9. Separately, an out-of-band Windows 11 version 26H1 update, KB5129194, addresses two local privilege-escalation vulnerabilities affecting Windows User-Mode Power Service and Windows Secure Kernel Mode. The disclosure follows Microsoft’s patching of 974 vulnerabilities, including two Windows flaws that were under active exploitation; reports from Proofpoint and Volexity said an ALPC issue was chained with two Google Chrome flaws in the BlueMoon exploit kit.\u003c/p\u003e\n"},{"n":6,"title":"Plugin4Shell Lets Repository Owners Swap Pinned Plugin Code Across Four AI Coding Agents","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/plugin4shell-lets-repository-owners.html","time":"11:01","priority":"SHOULD READ","score":82,"tldr":"Plugin4Shell lets owners of plugin repositories on certain Git hosts replace supposedly commit-pinned AI coding-agent plugins with malicious code because the agents do not verify the checked-out commit. Claude Code and OpenAI Codex have fixes, GitHub Copilot reportedly does not, and Google’s retiring Gemini CLI will not be patched.","briefOverview":"\u003cp\u003eAir Security reported a flaw called Plugin4Shell affecting Anthropic Claude Code, OpenAI Codex, GitHub Copilot, and Google Gemini CLI. The flaw can let a plugin repository owner replace a plugin’s reviewed, commit-pinned code with different code because the agents do not verify that the installed code matches the requested commit. A malicious plugin could access the user’s files, saved credentials, and systems they can reach.\u003c/p\u003e\n\n\u003cp\u003eThe reported branch-name method works on Git hosts that allow a branch name resembling a commit hash, including Bitbucket or private Git servers, but not on GitHub. The Hacker News found that the default Claude Code and Copilot plugin catalogs pointed to GitHub repositories as of September 18, limiting exposure to that method for users of those catalogs. Air said Claude Code was fixed in version 2.1.179 and Codex in 0.146.0, while GitHub Copilot had no fix and Google reportedly will not patch the retiring Gemini CLI.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Air Security reported that Plugin4Shell can let a plugin repository owner replace an AI coding agent’s commit-pinned plugin with different code because the agents do not verify that the installed code matches the requested commit.","The reported flaw affects Anthropic Claude Code, OpenAI Codex, GitHub Copilot, and Google Gemini CLI, although the branch-name technique does not work on GitHub because GitHub blocks branch and tag names that resemble commit hashes.","A malicious swapped plugin could access the files, saved credentials, and reachable systems of the person running the AI coding agent.","Air Security said Claude Code was fixed in version 2.1.179 and OpenAI Codex in version 0.146.0, while GitHub Copilot had no fix and Google reportedly will not patch the retiring Gemini CLI.","The article says default Claude Code and Copilot plugin marketplaces were GitHub-based as of September 18, while the risk described by Air applies to supported code hosts such as Bitbucket or private Git servers that permit hash-like branch names."],"insights":["A commit hash lock alone did not protect these plugins because the affected agents fetched code without confirming that the final code actually matched the locked version.","The issue cannot be remedied only by a plugin marketplace because the version check occurs on each user’s machine, so protection requires an updated coding agent.","Automatic plugin updates could allow a previously trusted plugin to be replaced without another user prompt, but the article says default auto-updated catalogs for Claude Code and Codex are GitHub-hosted and therefore not exposed to the hash-like branch-name method.","GitHub’s restriction on hash-like branch and tag names protects GitHub-hosted plugins from the main technique, while Gemini CLI is reportedly susceptible through a different repository name, FETCH_HEAD, even on GitHub."],"referencedReports":[{"title":"Plugin4Shell","url":"https://www.air.security/blog-posts/plugin4shell","publisher":"Air Security","context":"The article relies on Air Security’s research describing how repository owners can swap commit-pinned plugin code across four AI coding agents.","category":"research","primary":true}],"body":"\u003cp\u003eAir Security reported a flaw called Plugin4Shell affecting Anthropic Claude Code, OpenAI Codex, GitHub Copilot, and Google Gemini CLI. The flaw can let a plugin repository owner replace a plugin’s reviewed, commit-pinned code with different code because the agents do not verify that the installed code matches the requested commit. A malicious plugin could access the user’s files, saved credentials, and systems they can reach.\u003c/p\u003e\n\n\u003cp\u003eThe reported branch-name method works on Git hosts that allow a branch name resembling a commit hash, including Bitbucket or private Git servers, but not on GitHub. The Hacker News found that the default Claude Code and Copilot plugin catalogs pointed to GitHub repositories as of September 18, limiting exposure to that method for users of those catalogs. Air said Claude Code was fixed in version 2.1.179 and Codex in 0.146.0, while GitHub Copilot had no fix and Google reportedly will not patch the retiring Gemini CLI.\u003c/p\u003e\n"},{"n":8,"title":"One Dell Order, Two Companies, One Signature","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/genuine-dell-order-confirmation-helpline-injected-into-address-fields-fanned-to-two-tenants","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"Attackers turned a genuine Dell order acknowledgement into a callback-phishing lure by placing a fraudulent order, then relaying the vendor-signed email through Microsoft 365 tenants to unrelated targets. DKIM and DMARC passed because the message was authentic, but its signed recipient field showed it was originally addressed to an attacker-controlled mailbox—not the final recipient.","briefOverview":"\u003cp\u003eAttackers submitted a Dell order using the attacker-controlled mailbox \u003ccode\u003eno-reply@Dynamic535[.]onmicrosoft[.]com\u003c/code\u003e, causing Dell to generate a genuine signed order acknowledgement and PDF. The same signed email was then relayed through different Microsoft 365 tenants to a commercial cleaning and property restoration franchise organization and an unrelated professional-services firm about two minutes apart. The delivered copies shared the same signature value, message identifier, attachment hash, purchase identifier, and outbound gateway tracking identifier. Neither recipient organization had placed the order.\u003c/p\u003e\n\n\u003cp\u003eThe messages passed sender-policy, DKIM, DMARC, and composite authentication checks because relaying changed only the SMTP delivery envelope rather than the signed headers or body. However, the signed recipient field still named the attacker-controlled tenant mailbox, not the final recipient, and the article notes that DMARC does not evaluate this mismatch. The only actionable lure was a phone number inserted into the order’s shipping and billing address fields alongside text such as “Helpline” and “Call Our Sales Team”; all links and the attached Dell PDF were clean. The article reports that two human reviewers marked the messages malicious after an automated analyst initially considered clean authentication and artifact scans more important than the recipient’s report that no order had been made.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers submitted a Dell order using an attacker-controlled Microsoft 365 mailbox, causing Dell to generate and sign a genuine order acknowledgement and PDF.","The same signed message was relayed through different second-hop Microsoft 365 tenants to two unrelated organizations about two minutes apart, while its signature, message identifier, attachment hash, and purchase identifier remained identical.","The final messages passed sender-policy, DKIM, DMARC, and composite authentication checks because relaying changed the delivery envelope without altering the signed message content.","The signed recipient field still named the attacker-controlled tenant rather than the final recipient, providing evidence that the message was not originally generated for the receiving mailbox.","The order’s shipping and billing address fields contained a helpline phone number and sales-language text, making the phone number the only actionable content in an otherwise genuine Dell receipt."],"insights":["A valid signature can prove that Dell generated the message while still failing to prove that Dell intended it for the person who ultimately received it, because the signed recipient field named a different mailbox and DMARC does not assess that mismatch.","The campaign needed no malicious website, attachment, or altered email content: the actionable callback lure was placed in structured shipping and billing address fields that Dell’s own order system rendered.","Using separate relay tenants for different targets allowed the same vendor-signed message to be distributed to unrelated organizations while preserving the original signed content.","Dell’s normal order, shipping, and delivery automation supplied follow-up messages across multiple lifecycle stages, giving the operation an authentic-looking cadence without attackers composing new brand-themed emails.","The article shows that an employee reporting an order they did not make and a first-time transactional message can be stronger practical warning signs than clean authentication and artifact scans."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report's contributing-vendor gateway telemetry on callback-style email blocking and its statistics on phishing as an initial-access vector and the human element in breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA guidance to support the framing of phishing as deception of the recipient rather than solely a question of technical email origin.","category":"guide","primary":false}],"body":"\u003cp\u003eAttackers submitted a Dell order using the attacker-controlled mailbox \u003ccode\u003eno-reply@Dynamic535[.]onmicrosoft[.]com\u003c/code\u003e, causing Dell to generate a genuine signed order acknowledgement and PDF. The same signed email was then relayed through different Microsoft 365 tenants to a commercial cleaning and property restoration franchise organization and an unrelated professional-services firm about two minutes apart. The delivered copies shared the same signature value, message identifier, attachment hash, purchase identifier, and outbound gateway tracking identifier. Neither recipient organization had placed the order.\u003c/p\u003e\n\n\u003cp\u003eThe messages passed sender-policy, DKIM, DMARC, and composite authentication checks because relaying changed only the SMTP delivery envelope rather than the signed headers or body. However, the signed recipient field still named the attacker-controlled tenant mailbox, not the final recipient, and the article notes that DMARC does not evaluate this mismatch. The only actionable lure was a phone number inserted into the order’s shipping and billing address fields alongside text such as “Helpline” and “Call Our Sales Team”; all links and the attached Dell PDF were clean. The article reports that two human reviewers marked the messages malicious after an automated analyst initially considered clean authentication and artifact scans more important than the recipient’s report that no order had been made.\u003c/p\u003e\n"},{"n":10,"title":"A Vault with a Heap-View: The Uncomfortable Space Between AgentCore Harness and Identity","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/securing-aws-agentcore-harness-credentials/","time":"10:00","priority":"SHOULD READ","score":78,"tldr":"Unit 42 found that AWS AgentCore Harness’s default shell tool can be abused through prompt injection to read the harness process memory and exfiltrate plaintext credentials resolved from AgentCore Identity. Operators should restrict allowed tools per invocation, minimize downstream service-account privileges, and tightly monitor or limit harness egress.","briefOverview":"\u003cp\u003eUnit 42 researchers examined AWS AgentCore Harness, a managed runtime for AI agents, and found that its default built-in shell tool could be reached through prompt injection. In their test deployment, a hidden instruction in a simulated support ticket caused an agent to download and execute a script. AWS reviewed the report and closed it as informative under the AgentCore shared-responsibility model, identifying tool scoping and outbound-network filtering as customer-side controls.\u003c/p\u003e\n\n\u003cp\u003eThe researchers found that the shell ran as root and could read the memory of the harness runtime process. Because AgentCore Identity resolves stored downstream-service credentials into plaintext when they are needed, the script extracted an Amazon Cognito JWT and an MCP server URL from that process memory and sent them to a controlled endpoint. They then replayed the stolen service-account token from a laptop to access simulated customer data through the downstream MCP server. Unit 42 recommends limiting allowedTools for each harness invocation, applying least privilege to service accounts stored in the Identity vault, and monitoring outbound traffic from harness containers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 reported that AWS AgentCore Harness sessions include built-in shell and file-operations tools by default unless operators restrict them with the allowedTools parameter.","In the researchers’ test environment, the harness shell tool ran as root and could read the memory of the harness runtime process, where AgentCore Identity had resolved a downstream service credential into plaintext.","Using an indirect prompt injection embedded in a simulated support ticket, the researchers caused the agent to run a script that extracted an Amazon Cognito JWT and an MCP server URL from runtime memory and sent them to a controlled webhook.","The exfiltrated JWT belonged to the operator’s MCP service account rather than the end user and was replayed from a laptop to access simulated customer information through the downstream MCP server.","AWS closed the disclosure as informative under its AgentCore shared-responsibility model and cited allowedTools scoping and egress filtering as customer-side controls."],"insights":["AgentCore Identity’s encryption and access controls protect credentials while stored or transmitted, but the credential must exist as readable plaintext in the harness process memory when it is used for a downstream connection.","The allowedTools setting is applied at InvokeHarness time rather than CreateHarness time, making per-session tool restriction an important control that can be easy for operators to overlook.","A credential stolen this way can have greater authority than the person who invoked the agent, because the harness uses an operator-managed service account to reach downstream services.","Restricting a general-purpose shell can reduce credential-exfiltration risk, but also limits the flexibility and efficiency that programmatic tool use is intended to provide.","Unexpected outbound traffic from a harness container to destinations outside its approved downstream integrations is presented as evidence of active prompt injection rather than ordinary configuration drift."],"referencedReports":[],"body":"\u003cp\u003eUnit 42 researchers examined AWS AgentCore Harness, a managed runtime for AI agents, and found that its default built-in shell tool could be reached through prompt injection. In their test deployment, a hidden instruction in a simulated support ticket caused an agent to download and execute a script. AWS reviewed the report and closed it as informative under the AgentCore shared-responsibility model, identifying tool scoping and outbound-network filtering as customer-side controls.\u003c/p\u003e\n\n\u003cp\u003eThe researchers found that the shell ran as root and could read the memory of the harness runtime process. Because AgentCore Identity resolves stored downstream-service credentials into plaintext when they are needed, the script extracted an Amazon Cognito JWT and an MCP server URL from that process memory and sent them to a controlled endpoint. They then replayed the stolen service-account token from a laptop to access simulated customer data through the downstream MCP server. Unit 42 recommends limiting allowedTools for each harness invocation, applying least privilege to service accounts stored in the Identity vault, and monitoring outbound traffic from harness containers.\u003c/p\u003e\n"},{"n":9,"title":"Auditing in the age of (good enough) AI","source":"blog.trailofbits.com","sourceColorIdx":6,"link":"https://blog.trailofbits.com/2026/09/18/auditing-in-the-age-of-good-enough-ai/","time":"11:00","priority":"MAY READ","score":70,"tldr":"Trail of Bits used AI agents to build MASM developer tooling, static analysis, and Lean formal models ahead of its Miden VM audit, substantially improving review coverage. The work uncovered a high-severity underconstrained prover-input flaw that could enable Falcon signature forgery, along with additional correctness bugs.","briefOverview":"\u003cp\u003eTrail of Bits prepared for an audit of the Miden zero-knowledge VM by using AI agents to create tooling for Miden assembly (MASM), including an LSP server, decompiler, static-analysis engine, and Lean model of the VM executor. The project addressed the difficulty of reviewing a new stack-based architecture with little existing developer tooling and implicit instruction inputs and outputs. The team used the resulting intermediate representation and abstract interpretation analyses to examine prover-supplied values, type constraints, and local-variable initialization.\u003c/p\u003e\n\n\u003cp\u003eDuring the audit, the analyses identified more than 400 reachable locations where type validation could be improved and found a high-severity issue in the \u003ccode\u003emod_12289\u003c/code\u003e procedure. An unvalidated prover-supplied remainder could allow a malicious prover to make the procedure return an incorrect result, potentially enabling Falcon signature forgery and theft from Miden accounts controlled by Falcon key pairs. AI-assisted formal modeling also generated 95 machine-checked correctness proofs for binary arithmetic components and exposed two further bugs, involving 64-bit right rotation and 256-bit multiplication stack handling. The Miden team adopted the static-analysis engine for future updates to its core library.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trail of Bits spent six months preparing to audit the Miden VM by using AI agents to build a MASM language server, decompiler, static-analysis engine, and Lean model of the VM executor.","The static-analysis work identified more than 400 reachable locations in the Miden core library where type validation could be improved.","A high-severity flaw in the mod_12289 procedure failed to validate a prover-supplied remainder, allowing a malicious prover to return an incorrect result and potentially forge Falcon signatures to drain Miden accounts controlled by Falcon key pairs.","AI-assisted formal modeling produced 95 machine-checked correctness proofs covering all binary arithmetic components of the Miden core library.","The formal verification work found two additional bugs: an edge case in 64-bit right rotation and a 256-bit multiplication routine that removed caller-owned stack values before returning."],"insights":["For the MASM decompiler effort, the most valuable result was not necessarily readable decompiled code but the internal representation that enabled data-flow and other static analyses.","Machine-checked Lean proofs reduced the required manual verification work to reviewing whether each theorem stated the correct property, because the Lean kernel validated the generated proof steps.","The lack of declared procedure signatures, consistent calling conventions, and stack-neutral control flow made complete MASM decompilation impractical, so the team deliberately focused on a subset it could decompile correctly.","The article argues that capable AI agents changed the economics of exploratory audit tooling because unsuccessful side projects now primarily consume tokens rather than substantial dedicated engineering time."],"referencedReports":[],"body":"\u003cp\u003eTrail of Bits prepared for an audit of the Miden zero-knowledge VM by using AI agents to create tooling for Miden assembly (MASM), including an LSP server, decompiler, static-analysis engine, and Lean model of the VM executor. The project addressed the difficulty of reviewing a new stack-based architecture with little existing developer tooling and implicit instruction inputs and outputs. The team used the resulting intermediate representation and abstract interpretation analyses to examine prover-supplied values, type constraints, and local-variable initialization.\u003c/p\u003e\n\n\u003cp\u003eDuring the audit, the analyses identified more than 400 reachable locations where type validation could be improved and found a high-severity issue in the \u003ccode\u003emod_12289\u003c/code\u003e procedure. An unvalidated prover-supplied remainder could allow a malicious prover to make the procedure return an incorrect result, potentially enabling Falcon signature forgery and theft from Miden accounts controlled by Falcon key pairs. AI-assisted formal modeling also generated 95 machine-checked correctness proofs for binary arithmetic components and exposed two further bugs, involving 64-bit right rotation and 256-bit multiplication stack handling. The Miden team adopted the static-analysis engine for future updates to its core library.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft fixes bug behind ‘Defender Antivirus is turned off’ alerts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-fixes-bug-behind-defender-antivirus-is-turned-off-alerts/","time":"12:16","priority":"MAY READ","score":68,"tldr":"Microsoft fixed a bug that falsely warned users that Defender Antivirus was turned off even when it was functioning correctly. The fix is included in Microsoft Defender Antivirus version 4.18.26080.4, released September 17.","briefOverview":"\u003cp\u003eMicrosoft has fixed a known issue that displayed incorrect Windows Security alerts saying that Microsoft Defender Antivirus was turned off when it was actually active and functioning correctly. The fix was included in Microsoft Defender Antivirus version 4.18.26080.4, released on September 17. Microsoft announced the resolution in a Windows release health dashboard update on Thursday.\u003c/p\u003e\n\n\u003cp\u003eThe issue affected all supported Windows client and server versions, including Windows 11 26H1 and Windows Server 2025. Notifications could appear when Windows started and intermittently afterward, and they persisted even if notification settings were disabled. Microsoft acknowledged the bug in late August, while users in the Windows Insider Release Preview Channel had reported the problem since at least June.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft resolved a bug that generated false notifications claiming Microsoft Defender Antivirus was turned off even when it was active and functioning correctly.","The fix was delivered in Microsoft Defender Antivirus version 4.18.26080.4, released on September 17.","The issue affected all supported Windows client and server versions, including Windows 11 26H1 and Windows Server 2025.","The incorrect notifications could appear at Windows startup and intermittently afterward, and persisted even when notification settings were disabled.","Microsoft had acknowledged the issue in late August, after reports indicated it had affected Windows Insider Release Preview users since at least June."],"insights":["The false Defender alerts could continue appearing even after users disabled notifications, so changing notification settings was not an effective workaround.","Although Microsoft publicly acknowledged the problem in late August, reports show it had affected Windows Insider Release Preview users since at least June.","The issue was not limited to consumer PCs: it also affected supported Windows Server versions, including Windows Server 2025.","Microsoft fixed the problem through a Defender Antivirus update rather than a general Windows update."],"referencedReports":[{"title":"Incorrect notifications that “Microsoft Defender Antivirus is turned off”","url":"https://learn.microsoft.com/en-au/windows/release-health/status-windows-11-25h2#incorrect-notifications-that--microsoft-defender-antivirus-is-turned-off-","publisher":"microsoft","context":"Microsoft's Windows release health advisory describes the incorrect Defender Antivirus notifications and states that the issue was fixed.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft has fixed a known issue that displayed incorrect Windows Security alerts saying that Microsoft Defender Antivirus was turned off when it was actually active and functioning correctly. The fix was included in Microsoft Defender Antivirus version 4.18.26080.4, released on September 17. Microsoft announced the resolution in a Windows release health dashboard update on Thursday.\u003c/p\u003e\n\n\u003cp\u003eThe issue affected all supported Windows client and server versions, including Windows 11 26H1 and Windows Server 2025. Notifications could appear when Windows started and intermittently afterward, and they persisted even if notification settings were disabled. Microsoft acknowledged the bug in late August, while users in the Windows Insider Release Preview Channel had reported the problem since at least June.\u003c/p\u003e\n"},{"n":5,"title":"An Abandoned CDN Domain Was Re-Registered. Thousands of Sites Still Call It.","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/an-abandoned-cdn-domain-was-re.html","time":"11:01","priority":"MAY READ","score":55,"tldr":"An expired CDN domain was re-registered while thousands of websites still referenced its subdomains, giving its new owner potential control over content loaded in visitors’ browsers. The article argues that CSP reporting can reveal and monitor third-party scripts and unauthorized client-side changes, particularly for PCI DSS compliance.","briefOverview":"\u003cp\u003eIn July 2025, an expired domain formerly used by a discontinued content delivery network was re-registered while thousands of websites, code repositories, and documentation pages still contained hard-coded references to its hostnames. The new owner controls wildcard DNS for the domain, meaning they can determine what those still-active references load without the affected sites necessarily appearing broken. The article compares this risk to the June 2024 polyfill.io ownership change, after which conditional redirects were served to mobile visitors.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that conventional server-side scanning may not detect third-party browser code that changes its behavior by geography, device, referrer, time, or session. It says third-party scripts can access page content, typed form data, cookies, and local storage, and can send requests to other destinations. It recommends using Content-Security-Policy-Report-Only to observe what a policy would block without changing site behavior, and notes that PCI DSS v4.0.1 requires payment-page script authorization, integrity assurance, inventory, and detection of unauthorized changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In July 2025, a previously expired domain used by a discontinued content delivery network was re-registered, while thousands of websites, code repositories, and documentation pages still contained hard-coded references to its hostnames.","Because the new owner has wildcard DNS control over the domain, they control what content any of its subdomains can now serve to sites that still load assets from them.","The article cites the June 2024 ownership change of polyfill.io, after which the domain served conditional redirects to mobile visitors despite being embedded on more than 110,000 sites.","Third-party scripts run in visitors’ browsers with the same access as a site’s own code and can read page content, form input, cookies, and local storage or send requests elsewhere.","The article says Content-Security-Policy-Report-Only can collect reports on code and connections that a policy would block without blocking or changing website behavior."],"insights":["A third-party script can become harmful long after a website’s last deployment, because the visitor’s browser retrieves the script live from infrastructure the website does not control.","A one-time scan can miss malicious behavior when a third-party response changes based on geography, device type, referrer, time, or session, while reports from real visitors can expose it.","A Content-Security-Policy-Report-Only header can be used as a no-disruption measurement step because it records what would be blocked without enforcing restrictions.","For payment pages, PCI DSS v4.0.1 requires organizations to authorize and maintain an inventory of scripts, assure their integrity, and detect unauthorized changes to page content and HTTP headers."],"referencedReports":[],"body":"\u003cp\u003eIn July 2025, an expired domain formerly used by a discontinued content delivery network was re-registered while thousands of websites, code repositories, and documentation pages still contained hard-coded references to its hostnames. The new owner controls wildcard DNS for the domain, meaning they can determine what those still-active references load without the affected sites necessarily appearing broken. The article compares this risk to the June 2024 polyfill.io ownership change, after which conditional redirects were served to mobile visitors.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that conventional server-side scanning may not detect third-party browser code that changes its behavior by geography, device, referrer, time, or session. It says third-party scripts can access page content, typed form data, cookies, and local storage, and can send requests to other destinations. It recommends using Content-Security-Policy-Report-Only to observe what a policy would block without changing site behavior, and notes that PCI DSS v4.0.1 requires payment-page script authorization, integrity assurance, inventory, and detection of unauthorized changes.\u003c/p\u003e\n"},{"n":1,"title":"Webinar: Which Google Workspace security controls actually matter?","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/webinar-which-google-workspace-security-controls-actually-matter/","time":"13:10","priority":"MAY READ","score":25,"tldr":"BleepingComputer and Material Security will host a September 23, 2026 webinar examining real Google Workspace breaches, including social-engineering and malicious OAuth app attacks. The session aims to help lean security teams prioritize the controls and incident-response measures with the greatest practical impact.","briefOverview":"\u003cp\u003eBleepingComputer will host a live webinar with Material Security on September 23, 2026, titled “Breach autopsy: How fast-growing companies are breached through Google Workspace.” Rajan Kapoor, Vice President of Security at Material Security, and Rick Fitzgerald, President of Fireside Consulting LLC, will examine real, publicly documented Google Workspace breaches. The session is intended to help organizations decide which security controls deserve priority when time and resources are limited.\u003c/p\u003e\n\n\u003cp\u003eThe webinar will discuss two attacks that combined social engineering with malicious OAuth applications to access Google Workspace environments. Speakers will examine overlooked weaknesses affecting users, data, and connected applications, as well as the response decisions made in the critical first hours after breaches were discovered. Attendees will receive a practical view of security improvements ranked by required effort and potential impact, including which measures may receive more attention than their real-world value warrants.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BleepingComputer will host a live webinar with Material Security on September 23, 2026, titled \"Breach autopsy: How fast-growing companies are breached through Google Workspace.\"","Rajan Kapoor of Material Security and Rick Fitzgerald of Fireside Consulting LLC will examine publicly documented Google Workspace breaches.","The webinar will discuss two incidents in which social engineering and malicious OAuth applications were used to access Google Workspace environments.","Speakers will evaluate which Google Workspace controls offer the greatest value, which may be overrated, and how to prioritize improvements by effort and potential impact.","The discussion will also cover the first hours after breach discovery and response decisions that can limit or worsen an incident's impact."],"insights":["For fast-growing companies, the article emphasizes prioritizing defenses based on both implementation effort and likely impact rather than trying to deploy every available security control.","The described Google Workspace incidents show that attackers can combine people-focused deception with malicious third-party app access to reach organizational environments.","The article highlights the first hours after a breach is discovered as a period when response choices can either reduce or potentially worsen the overall impact.","Reviewing real, documented breaches can help organizations identify overlooked weaknesses affecting users, data, and connected applications."],"referencedReports":[],"body":"\u003cp\u003eBleepingComputer will host a live webinar with Material Security on September 23, 2026, titled “Breach autopsy: How fast-growing companies are breached through Google Workspace.” Rajan Kapoor, Vice President of Security at Material Security, and Rick Fitzgerald, President of Fireside Consulting LLC, will examine real, publicly documented Google Workspace breaches. The session is intended to help organizations decide which security controls deserve priority when time and resources are limited.\u003c/p\u003e\n\n\u003cp\u003eThe webinar will discuss two attacks that combined social engineering with malicious OAuth applications to access Google Workspace environments. Speakers will examine overlooked weaknesses affecting users, data, and connected applications, as well as the response decisions made in the critical first hours after breaches were discovered. Attendees will receive a practical view of security improvements ranked by required effort and potential impact, including which measures may receive more attention than their real-world value warrants.\u003c/p\u003e\n"}]</script>
