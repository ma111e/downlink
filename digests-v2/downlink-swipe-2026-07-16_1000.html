<script type="application/json" id="dl-articles">[{"n":3,"title":"CISA orders feds to patch actively exploited Oracle flaw by Saturday","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-actively-exploited-oracle-flaw-by-saturday/","time":"10:56","priority":"MUST READ","score":94,"tldr":"CISA ordered U.S. federal agencies to patch Oracle E-Business Suite systems by July 18 after confirming active exploitation of critical flaw CVE-2026-46817, which can let unauthenticated attackers take over Oracle Payments via HTTP. Oracle patched the issue in May, but exposed and unpatched EBS instances remain at risk.","briefOverview":"\u003cp\u003eCISA has ordered U.S. federal agencies to secure their systems by Saturday, July 18, against ongoing attacks exploiting CVE-2026-46817 in Oracle E-Business Suite. The flaw affects the File Transmission component of Oracle Payments and allows unauthenticated attackers with HTTP network access to take over vulnerable systems in low-complexity attacks. Oracle released fixes in its May 2026 Critical Security Patch Update and urged customers to apply patches without delay.\u003c/p\u003e\n\n\u003cp\u003eThreat intelligence company Defused said on June 29 that it observed exploitation of CVE-2026-46817 on Oracle E-Business honeypots, even though Oracle had not flagged the flaw as exploited in the wild. Shadowserver tracks more than 1,000 internet-exposed Oracle E-Business Suite instances, with more than half in the United States, but the article says it is unknown how many are honeypots or already secured. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog and said these types of flaws are frequent attack vectors that pose significant risks to the federal enterprise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA ordered U.S. federal agencies to patch vulnerable Oracle E-Business Suite instances by Saturday, July 18, after adding CVE-2026-46817 to its Known Exploited Vulnerabilities catalog.","CVE-2026-46817 affects the File Transmission component of Oracle Payments in Oracle E-Business Suite and allows unauthenticated attackers with HTTP network access to compromise Oracle Payments.","Oracle released security updates for CVE-2026-46817 in its May 2026 Critical Security Patch Update and urged customers to apply patches without delay.","Threat intelligence company Defused reported on June 29 that it observed exploitation of CVE-2026-46817 on Oracle E-Business honeypots despite no known public proof-of-concept code.","Shadowserver tracks more than 1,000 internet-exposed Oracle E-Business Suite instances, with more than half located in the United States."],"insights":["CISA set an unusually short remediation deadline, requiring federal agencies to patch by July 18 after adding CVE-2026-46817 to the Known Exploited Vulnerabilities catalog on July 15.","Attackers were reportedly exploiting CVE-2026-46817 even though Defused said there was no public proof-of-concept code and no known previous exploitation at the time of its observation.","Oracle had already warned that some successful attacks occurred because targeted customers failed to apply available Oracle patches, making patch delay a documented factor in real-world compromise.","Shadowserver’s count of more than 1,000 internet-exposed Oracle E-Business Suite instances shows that many potentially targetable systems remain reachable online, but the article notes it is unknown how many are honeypots or already patched.","CISA has flagged 43 exploited security issues across Oracle products over several years, including 12 abused by ransomware gangs, indicating Oracle products have repeatedly appeared in CISA’s exploited-vulnerability tracking."],"referencedReports":[{"title":"May 2026 Critical Security Patch Update","url":"https://www.oracle.com/security-alerts/cspumay2026.html","publisher":"Oracle","context":"The article says Oracle released security updates for CVE-2026-46817 in its May 2026 Critical Security Patch Update and urged customers to patch immediately.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/15/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA’s alert confirming active exploitation of CVE-2026-46817 and adding it to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog: CVE-2026-46817","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-46817","publisher":"CISA","context":"The article cites CISA’s Known Exploited Vulnerabilities catalog entry for CVE-2026-46817 as the basis for the federal patching deadline.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has ordered U.S. federal agencies to secure their systems by Saturday, July 18, against ongoing attacks exploiting CVE-2026-46817 in Oracle E-Business Suite. The flaw affects the File Transmission component of Oracle Payments and allows unauthenticated attackers with HTTP network access to take over vulnerable systems in low-complexity attacks. Oracle released fixes in its May 2026 Critical Security Patch Update and urged customers to apply patches without delay.\u003c/p\u003e\n\n\u003cp\u003eThreat intelligence company Defused said on June 29 that it observed exploitation of CVE-2026-46817 on Oracle E-Business honeypots, even though Oracle had not flagged the flaw as exploited in the wild. Shadowserver tracks more than 1,000 internet-exposed Oracle E-Business Suite instances, with more than half in the United States, but the article says it is unknown how many are honeypots or already secured. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog and said these types of flaws are frequent attack vectors that pose significant risks to the federal enterprise.\u003c/p\u003e\n"},{"n":6,"title":"Sandworm hackers have a CAPTCHA trick for Ukrainians","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-sandworm-hacks-captcha-powershell","time":"13:50","priority":"MUST READ","score":93,"tldr":"Ukraine’s CERT says Russia-linked Sandworm hackers are using fake CAPTCHA prompts on compromised websites to trick Ukrainian targets into pasting PowerShell commands that install malware. The group is also continuing older social-engineering tactics, including bogus Android security apps, pirated software installers and fake antivirus files shared via Signal.","briefOverview":"\u003cp\u003eRussian military intelligence hackers known as Sandworm have begun using fake CAPTCHA prompts on compromised websites to trick Ukrainian targets into infecting their own computers. Ukraine’s CERT-UA said the group increasingly adopted the ClickFix technique during the spring and summer to gain initial access to target systems. CERT-UA observed the technique on more than 10 compromised websites during June and July, but did not report the number of compromised devices.\u003c/p\u003e\n\n\u003cp\u003eThe fake CAPTCHA prompts tell users to copy and paste a PowerShell command into their Windows computers instead of verifying that they are human. That command downloads malware called GhettoVibe, which can be followed by ScoutCurl, a reconnaissance tool that collects system details, installed software, files and browser data. Researchers also observed two malware loaders called FluidLeech, disguised as antivirus removal software, and LoadLoop.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA said Sandworm continues to use other social engineering methods, including Android malware disguised as security applications and distributed through messaging apps. The agency also described the group’s long-running use of backdoored Windows and Office installers on torrent sites, including one case that enabled access to a Ukrainian government network before a destructive cyberattack. Sandworm has also targeted victims through Signal by convincing them to install bogus antivirus software, sometimes after spending weeks building trust or offering cash payments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukraine's CERT-UA said Russian military intelligence hackers known as Sandworm have increasingly used fake CAPTCHA prompts on compromised websites to trick Ukrainian targets into infecting their own Windows computers.","The fake CAPTCHA prompts instruct users to copy and paste a PowerShell command that downloads malware, giving hackers access to the computer and the ability to deploy additional tools later.","CERT-UA observed the ClickFix technique on more than 10 compromised websites during June and July but did not report the number of compromised devices.","Researchers identified malware and tools called GhettoVibe, ScoutCurl, FluidLeech and LoadLoop in connection with the activity.","CERT-UA said Sandworm also continues to use older tactics, including fake Android security apps distributed through messaging apps, backdoored Windows and Office installers on torrent sites, and bogus antivirus files shared through Signal."],"insights":["Sandworm’s fake CAPTCHA tactic turns a familiar trust signal on websites into a direct infection path by making the victim manually run the command that installs malware.","The article shows Sandworm using multiple entry routes at once, including compromised websites, messaging apps, torrent-distributed software, and Signal-based trust-building, rather than relying on a single delivery method.","CERT-UA’s report highlights that Sandworm may use an initial low-profile infection to decide whether a victim is valuable before deploying additional tools or launching more damaging activity.","The group’s social engineering can involve prolonged interaction with targets, with CERT-UA saying hackers sometimes spent weeks building trust and even offered cash payments to get victims to run malicious files."],"referencedReports":[{"title":"CERT-UA report on Sandworm ClickFix activity","url":"https://cert.gov.ua/article/6318437","publisher":"CERT-UA","context":"The article is based on a CERT-UA report describing Sandworm's use of fake CAPTCHA prompts and related malware against Ukrainian targets.","category":"advisory","primary":true}],"body":"\u003cp\u003eRussian military intelligence hackers known as Sandworm have begun using fake CAPTCHA prompts on compromised websites to trick Ukrainian targets into infecting their own computers. Ukraine’s CERT-UA said the group increasingly adopted the ClickFix technique during the spring and summer to gain initial access to target systems. CERT-UA observed the technique on more than 10 compromised websites during June and July, but did not report the number of compromised devices.\u003c/p\u003e\n\n\u003cp\u003eThe fake CAPTCHA prompts tell users to copy and paste a PowerShell command into their Windows computers instead of verifying that they are human. That command downloads malware called GhettoVibe, which can be followed by ScoutCurl, a reconnaissance tool that collects system details, installed software, files and browser data. Researchers also observed two malware loaders called FluidLeech, disguised as antivirus removal software, and LoadLoop.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA said Sandworm continues to use other social engineering methods, including Android malware disguised as security applications and distributed through messaging apps. The agency also described the group’s long-running use of backdoored Windows and Office installers on torrent sites, including one case that enabled access to a Ukrainian government network before a destructive cyberattack. Sandworm has also targeted victims through Signal by convincing them to install bogus antivirus software, sometimes after spending weeks building trust or offering cash payments.\u003c/p\u003e\n"},{"n":5,"title":"Russian hackers trojanize WebEx, Zoom apps to push Starland malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/russian-hackers-trojanize-webex-zoom-apps-to-push-starland-malware/","time":"10:19","priority":"MUST READ","score":92,"tldr":"Russian threat actor UAT-11795 is distributing trojanized installers for apps like WebEx, Zoom, MobaXterm, DBeaver, and FaceIT to deploy the new Starland RAT, which steals credentials, crypto wallet data, and system information. Users should only download software from official sources and avoid running unfamiliar commands found online.","briefOverview":"\u003cp\u003eA financially motivated Russian threat actor tracked as UAT-11795 is using trojanized installers for legitimate software to deploy a new backdoor called Starland RAT. Cisco Talos says the attacks have been occurring since at least June 2025 and have focused on users in the U.S., with victims also observed in Germany, Romania, and Venezuela. The malicious installers impersonate software such as MobaXterm, WebEx, Zoom, DBeaver, and FaceIT.\u003c/p\u003e\n\n\u003cp\u003eAccording to Cisco Talos, the attack begins with an HTA file that retrieves a trojanized NSIS installer containing a Python loader disguised as LICENSE.txt. The loader modifies the Windows Registry for persistence, then decrypts and loads Starland RAT. When launched, Starland checks for sandbox environments, adds scheduled tasks and Startup folder items for persistence, and attempts to increase its privileges.\u003c/p\u003e\n\n\u003cp\u003eStarland RAT can collect browser data, cryptocurrency wallet assets, system details, and Active Directory information, and it can capture screenshots, execute shell commands, inject shellcode, and download additional payloads. In observed attacks, a 64-bit shellcode chain delivers CastleStealer, while a 32-bit chain delivers Remcos RAT. Cisco Talos also reported that UAT-11795 uses a previously undocumented PowerShell C2 framework called WLDR and a fallback command-and-control mechanism involving a Polygon smart contract with an XOR-encrypted fallback domain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A financially motivated Russian threat actor tracked as UAT-11795 is using trojanized installers for legitimate software including MobaXterm, WebEx, Zoom, DBeaver, and FaceIT to deploy a new backdoor called Starland RAT.","Cisco Talos said the attacks have been occurring since at least June 2025 and have mainly targeted users in the United States, with victims also observed in Germany, Romania, and Venezuela.","The attack chain starts with an HTA file that retrieves a trojanized NSIS installer containing a Python loader disguised as LICENSE.txt, which establishes persistence and decrypts and loads Starland RAT.","Starland RAT can collect browser data, cryptocurrency wallet assets, system details, and Active Directory information, and it can also capture screenshots, execute shell commands, inject shellcode, and download additional payloads.","Cisco Talos reported that UAT-11795 also uses a previously undocumented PowerShell C2 framework called WLDR and a fallback command-and-control mechanism involving a Polygon smart contract with an XOR-encrypted fallback domain."],"insights":["The campaign uses trojanized installers for widely used legitimate tools, making software download source verification especially important for users seeking apps such as WebEx, Zoom, MobaXterm, DBeaver, and FaceIT.","Starland RAT includes multiple persistence mechanisms, including Windows Registry changes, scheduled tasks, and Startup folder items, which gives defenders several places to check for signs of compromise.","The malware’s fallback command-and-control method queries a Polygon smart contract for an encrypted backup domain, showing that blocking only the hardcoded server address may not disrupt communications.","UAT-11795’s WLDR framework ties payload delivery to each victim’s hardware identifier, which may complicate attempts to analyze or reproduce infections outside the original victim environment."],"referencedReports":[{"title":"UAT-11795 deploys novel Starland RAT and bespoke WLDR C2 implant in financially motivated campaign","url":"https://blog.talosintelligence.com/uat-11795-deploys-novel-starland-rat-and-bespoke-wldr-c2-implant-in-financially-motivated-campaign/","publisher":"Cisco Talos","context":"The article cites Cisco Talos research as the source for the attack chain, malware capabilities, command-and-control details, and defensive indicators.","category":"research","primary":true}],"body":"\u003cp\u003eA financially motivated Russian threat actor tracked as UAT-11795 is using trojanized installers for legitimate software to deploy a new backdoor called Starland RAT. Cisco Talos says the attacks have been occurring since at least June 2025 and have focused on users in the U.S., with victims also observed in Germany, Romania, and Venezuela. The malicious installers impersonate software such as MobaXterm, WebEx, Zoom, DBeaver, and FaceIT.\u003c/p\u003e\n\n\u003cp\u003eAccording to Cisco Talos, the attack begins with an HTA file that retrieves a trojanized NSIS installer containing a Python loader disguised as LICENSE.txt. The loader modifies the Windows Registry for persistence, then decrypts and loads Starland RAT. When launched, Starland checks for sandbox environments, adds scheduled tasks and Startup folder items for persistence, and attempts to increase its privileges.\u003c/p\u003e\n\n\u003cp\u003eStarland RAT can collect browser data, cryptocurrency wallet assets, system details, and Active Directory information, and it can capture screenshots, execute shell commands, inject shellcode, and download additional payloads. In observed attacks, a 64-bit shellcode chain delivers CastleStealer, while a 32-bit chain delivers Remcos RAT. Cisco Talos also reported that UAT-11795 uses a previously undocumented PowerShell C2 framework called WLDR and a fallback command-and-control mechanism involving a Polygon smart contract with an XOR-encrypted fallback domain.\u003c/p\u003e\n"},{"n":12,"title":"Daxin Resurfaces in Taiwan Alongside Stupig Pre-Login SYSTEM Backdoor","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/daxin-resurfaces-in-taiwan-alongside.html","time":"11:17","priority":"SHOULD READ","score":89,"tldr":"Symantec found the China-linked Daxin rootkit active again on a Taiwan manufacturing host, alongside a newly reported Stupig backdoor that gives attackers SYSTEM-level command execution from the Windows logon screen before any user signs in. The discovery suggests a highly stealthy espionage operation may have persisted undetected for years.","briefOverview":"\u003cp\u003eAn advanced malware called Daxin, previously attributed to a China-linked threat actor, has resurfaced inside a Taiwan manufacturing firm after more than four years. Symantec and Carbon Black researchers found Daxin running on a compromised host in Taiwan in 2026, alongside a previously unreported backdoor called Stupig. The machine belonged to a Taiwan-based subsidiary of a multinational high-tech manufacturer, and both artifacts carried compilation timestamps from early 2013.\u003c/p\u003e\n\n\u003cp\u003eDaxin is a Windows kernel-mode rootkit that avoids direct outbound command-and-control by monitoring incoming TCP traffic for specific patterns and hijacking existing legitimate connections for encrypted communications. It also supports multi-hop communications through chains of infected hosts, which can allow operators to reach isolated network segments. Stupig persists as a trojanized keyboard-layout DLL loaded by winlogon.exe, letting an attacker execute commands with SYSTEM privileges from the Windows logon screen before anyone signs in and without raising a logon audit event.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Symantec and Carbon Black researchers found the Daxin kernel-mode rootkit running on a compromised host in Taiwan in 2026 after more than four years without public reporting of the malware.","The same host, belonging to a Taiwan-based subsidiary of a multinational high-tech manufacturer, was also infected with a previously unreported backdoor called Stupig.","Stupig persists by registering as a keyboard-layout provider, causing Windows to load it into winlogon.exe at startup and allowing commands entered with the username prefix “stupig” to run with SYSTEM privileges from the logon screen.","Daxin avoids conventional outbound command-and-control by monitoring incoming TCP traffic for specific patterns and hijacking existing legitimate connections for encrypted communications.","Broadcom said the compromised machine may have been exposed through an outdated Digiwin single sign-on portal that used end-of-life Java Development Kit 1.5 and 1.6 installations from 2009 to 2011."],"insights":["Stupig’s use of a trojanized keyboard-layout DLL shows that Windows logon components can provide attacker access before sign-in, an access method the researchers said most defenders are not aware of or monitoring.","Because Stupig can execute commands from the logon screen without raising a logon audit event, normal sign-in monitoring may miss attacker activity even when commands run with SYSTEM privileges.","The shared 2013 compilation timestamps on both Daxin and Stupig, despite telemetry appearing only in 2026, highlight how long-lived artifacts can remain operational in targeted environments without being detected.","Daxin’s ability to hijack legitimate TCP connections and support multi-hop communication through infected hosts makes network detection especially difficult, including in environments with isolated network segments.","The suspected role of an outdated Digiwin single sign-on portal using end-of-life JDK versions underscores how legacy enterprise software can remain relevant to major intrusions years after its components are obsolete."],"referencedReports":[{"title":"Daxin Returns Alongside Stupig","url":"https://www.security.com/threat-intelligence/daxin-returns-stupig","publisher":"Broadcom","context":"The article relies on findings from the Symantec and Carbon Black Threat Hunter Team about Daxin resurfacing in Taiwan and the newly reported Stupig backdoor.","category":"research","primary":true},{"title":"Chinese Operators Use Claude and DeepSeek in Government Intrusion Activity","url":"https://hunt.io/blog/chinese-operators-claude-deepseek-government-intrusion","publisher":"Hunt.io","context":"The article cites Hunt.io research on a suspected China-linked threat actor using Anthropic Claude Code and DeepSeek models to automate intrusions against government and financial systems.","category":"research","primary":false}],"body":"\u003cp\u003eAn advanced malware called Daxin, previously attributed to a China-linked threat actor, has resurfaced inside a Taiwan manufacturing firm after more than four years. Symantec and Carbon Black researchers found Daxin running on a compromised host in Taiwan in 2026, alongside a previously unreported backdoor called Stupig. The machine belonged to a Taiwan-based subsidiary of a multinational high-tech manufacturer, and both artifacts carried compilation timestamps from early 2013.\u003c/p\u003e\n\n\u003cp\u003eDaxin is a Windows kernel-mode rootkit that avoids direct outbound command-and-control by monitoring incoming TCP traffic for specific patterns and hijacking existing legitimate connections for encrypted communications. It also supports multi-hop communications through chains of infected hosts, which can allow operators to reach isolated network segments. Stupig persists as a trojanized keyboard-layout DLL loaded by winlogon.exe, letting an attacker execute commands with SYSTEM privileges from the Windows logon screen before anyone signs in and without raising a logon audit event.\u003c/p\u003e\n"},{"n":8,"title":"20+ Hijacked Government Websites Became\u2028an Attack Channel","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/20-hijacked-government-websites.html","time":"11:58","priority":"SHOULD READ","score":88,"tldr":"ANY.RUN researchers found that the PhantomEnigma campaign hijacked more than 20 Brazilian government websites and compromised email accounts to deliver malware through trusted-looking police and government lures. The operation uses a modular Node.js/Electron backdoor that can persist, execute commands, and deploy additional payloads, raising risk for banks and public agencies.","briefOverview":"\u003cp\u003eANY.RUN researchers uncovered an active PhantomEnigma campaign in which more than 20 Brazilian government websites were hijacked and used as malware delivery channels. The campaign used fake police-themed or official-document lures, including “Ofício Polícia Civil” and “Procuração Digital” notices. Some messages were sent through compromised mailboxes and passed SPF, DKIM, and DMARC checks, making them appear more legitimate than ordinary spoofed phishing emails.\u003c/p\u003e\n\n\u003cp\u003eVictims were redirected through compromised .gov.br hosts or police-themed lookalike domains before reaching a malicious installer. The article says legitimate municipal, public-security, and judicial portals were used at different stages of the delivery chain, with some government hosts appearing across more than one PhantomEnigma attack arm. The campaign evolved from banking-focused activity in 2025 to abusing compromised .gov.br websites and email accounts in 2026.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain included an Inno Setup, MSI, or other installer, followed by a patched Electron application that loaded a malicious index.js backdoor. The backdoor collected system and user details, created a persistent machine ID, established persistence, checked for commands every 180 seconds, executed JavaScript through eval(), and downloaded executable payloads. The article warns that banks and public-sector organizations face risks including credential compromise, unauthorized access, fraud, data exposure, and operational disruption.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ANY.RUN researchers uncovered an active PhantomEnigma campaign that hijacked more than 20 Brazilian government websites and used them as malware delivery channels.","The campaign used fake police-themed or official-document lures, compromised mailboxes that passed SPF, DKIM, and DMARC checks, and redirects through compromised .gov.br hosts or police-themed lookalike domains.","The observed infection chain included a malicious installer, a patched Electron application, activation of a Node.js backdoor, rotating command-and-control infrastructure, and delivery of additional payloads such as stealers, loaders, remote management software, and other malware.","The PhantomEnigma backdoor collected system and user details, created a persistent machine ID, established persistence, checked for commands every 180 seconds, executed JavaScript through eval(), and downloaded executable payloads.","The article states that the campaign creates risks for banks and public-sector organizations, including credential compromise, unauthorized access, fraud, data exposure, and operational disruption."],"insights":["The campaign’s use of authenticated compromised mailboxes meant some phishing emails passed SPF, DKIM, and DMARC checks, so email authentication alone would not reliably identify the messages as malicious.","Several compromised government hosts appeared across more than one PhantomEnigma attack arm, which helped researchers connect activity that initially looked unrelated.","PhantomEnigma’s modular backdoor lets operators change the final payload after infection, so two victims exposed through the same installer could later receive different malware.","The article emphasizes that static blocklists are less reliable against this campaign because the command-and-control domains rotate quickly and the payloads can change after infection.","A clean initial file verdict or a legitimate government domain may reduce suspicion even while the infection chain is already active, making early reporting of official-looking suspicious messages important."],"referencedReports":[{"title":"PhantomEnigma investigation report","url":"https://any.run/cybersecurity-blog/phantomenigma-research/?utm_source=the%20hacker%20news\u0026utm_medium=article\u0026utm_campaign=hijacked%20websites\u0026utm_content=blog\u0026utm_term=160726","publisher":"ANY.RUN","context":"The article directs readers to ANY.RUN's full PhantomEnigma investigation report for technical analysis, infrastructure details, indicators, and detection guidance.","category":"research","primary":true}],"body":"\u003cp\u003eANY.RUN researchers uncovered an active PhantomEnigma campaign in which more than 20 Brazilian government websites were hijacked and used as malware delivery channels. The campaign used fake police-themed or official-document lures, including “Ofício Polícia Civil” and “Procuração Digital” notices. Some messages were sent through compromised mailboxes and passed SPF, DKIM, and DMARC checks, making them appear more legitimate than ordinary spoofed phishing emails.\u003c/p\u003e\n\n\u003cp\u003eVictims were redirected through compromised .gov.br hosts or police-themed lookalike domains before reaching a malicious installer. The article says legitimate municipal, public-security, and judicial portals were used at different stages of the delivery chain, with some government hosts appearing across more than one PhantomEnigma attack arm. The campaign evolved from banking-focused activity in 2025 to abusing compromised .gov.br websites and email accounts in 2026.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain included an Inno Setup, MSI, or other installer, followed by a patched Electron application that loaded a malicious index.js backdoor. The backdoor collected system and user details, created a persistent machine ID, established persistence, checked for commands every 180 seconds, executed JavaScript through eval(), and downloaded executable payloads. The article warns that banks and public-sector organizations face risks including credential compromise, unauthorized access, fraud, data exposure, and operational disruption.\u003c/p\u003e\n"},{"n":13,"title":"New ClickLock macOS Stealer Kills Apps Every 210ms Until Victims Type Their Password","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-clicklock-macos-stealer-kills-apps.html","time":"12:33","priority":"SHOULD READ","score":88,"tldr":"ClickLock Stealer is a new macOS infostealer that coerces victims into entering their login password by repeatedly killing key apps until they comply. Once entered, it steals Keychain data, Chrome encryption keys, browser credentials, cookies, crypto wallets, and other sensitive files, with persistence and a reverse shell potentially left behind.","briefOverview":"\u003cp\u003eClickLock Stealer is a new macOS infostealer that arrives as a command pasted into Terminal and asks for the victim’s login password behind a fake system dialog. If the victim cancels, it installs two LaunchAgents and exits, then at the next login repeatedly kills Finder, the Dock, Spotlight, Terminal, Activity Monitor, and major browsers every 210 milliseconds. Group-IB’s telemetry counts at least 100 targets across 33 countries since May, with over half in Europe.\u003c/p\u003e\n\n\u003cp\u003eThe malware is designed to force interaction by leaving one password box on an otherwise disrupted desktop. Once the victim enters a valid password, the operator can obtain the macOS login password, Chrome’s Safe Storage AES key, browser credentials and cookies, crypto wallet data, password manager vaults, the Keychain, shell history, and FileZilla saved server credentials. Group-IB says the Safe Storage key allows Chrome’s saved passwords and cookies to be decrypted offline later on the attacker’s machine.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB found the payload chain but not the lure pages, leaving the landing page design, domains serving it, and traffic source unconfirmed. The article says the campaign uses ClickFix-style delivery, fake Cloudflare CAPTCHA visuals, compromised payload hosts, Telegram bots for exfiltration, and a backdoor named goyim that is largely copied from the public GSocket deploy script. The backdoor can remain after the desktop appears normal, running as SystemUIServerl from ~/Library/Application Support/iCloudsync.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ClickLock Stealer is a new macOS infostealer that arrives as a command pasted into Terminal and uses a fake system dialog to request the victim’s login password.","If the victim cancels the initial password prompt, ClickLock installs LaunchAgents that repeatedly kill Finder, Dock, Spotlight, Terminal, Activity Monitor, and major browsers every 210 milliseconds at the next login until a password is entered.","Group-IB observed at least 100 ClickLock targets across 33 countries since May, with more than half of the targets in Europe.","After a successful run, ClickLock can exfiltrate the validated macOS login password, Chrome’s Safe Storage AES key, browser credentials and cookies, crypto wallet data, password manager vaults, the Keychain, shell history, and FileZilla saved server credentials.","Group-IB reported that the backdoor component named goyim is largely copied from the public GSocket deploy script and uses a relay at gsnc[.]eu:67, while the stolen data is sent through Telegram bots."],"insights":["ClickLock’s most durable theft is Chrome’s Safe Storage key, because it allows attackers to decrypt copied Chrome passwords and cookies offline later on the attacker’s own machine.","The article notes that Group-IB found the payload chain but not the lure pages, meaning the landing pages, domains serving them, and traffic-driving method remain unconfirmed.","Apple’s macOS 26.4 paste warning leaves room for ClickFix-style attacks because it only appears for users who do not regularly use Terminal and still includes a “Paste Anyway” option.","Typing the password may make the desktop appear normal again while leaving the goyim reverse shell behind as a process named SystemUIServerl in ~/Library/Application Support/iCloudsync.","Group-IB described the repeated killing of Finder, Dock, SystemUIServer, and NotificationCenter as behavior with no legitimate use case and unique to forced-interaction malware."],"referencedReports":[{"title":"ClickLock Stealer macOS Malware","url":"https://www.group-ib.com/blog/clicklock-stealer-macos-malware/","publisher":"Group-IB","context":"The article relies on Group-IB’s telemetry and analysis of ClickLock Stealer’s payload chain, behavior, targets, and infrastructure.","category":"research","primary":true},{"title":"ClickFix campaign uses fake macOS utilities lures to deliver infostealers","url":"https://www.microsoft.com/en-us/security/blog/2026/05/06/clickfix-campaign-uses-fake-macos-utilities-lures-deliver-infostealers/","publisher":"Microsoft","context":"The article cites Microsoft’s analysis as documenting similar dscl password validation in SHub Stealer and related macOS ClickFix campaigns.","category":"research","primary":false},{"title":"ClickFix macOS Script Editor Atomic Stealer","url":"https://www.jamf.com/blog/clickfix-macos-script-editor-atomic-stealer/","publisher":"Jamf Threat Labs","context":"The article references Jamf Threat Labs’ April analysis of a ClickFix campaign that used an applescript:// URL to open Script Editor with the payload preloaded.","category":"research","primary":false}],"body":"\u003cp\u003eClickLock Stealer is a new macOS infostealer that arrives as a command pasted into Terminal and asks for the victim’s login password behind a fake system dialog. If the victim cancels, it installs two LaunchAgents and exits, then at the next login repeatedly kills Finder, the Dock, Spotlight, Terminal, Activity Monitor, and major browsers every 210 milliseconds. Group-IB’s telemetry counts at least 100 targets across 33 countries since May, with over half in Europe.\u003c/p\u003e\n\n\u003cp\u003eThe malware is designed to force interaction by leaving one password box on an otherwise disrupted desktop. Once the victim enters a valid password, the operator can obtain the macOS login password, Chrome’s Safe Storage AES key, browser credentials and cookies, crypto wallet data, password manager vaults, the Keychain, shell history, and FileZilla saved server credentials. Group-IB says the Safe Storage key allows Chrome’s saved passwords and cookies to be decrypted offline later on the attacker’s machine.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB found the payload chain but not the lure pages, leaving the landing page design, domains serving it, and traffic source unconfirmed. The article says the campaign uses ClickFix-style delivery, fake Cloudflare CAPTCHA visuals, compromised payload hosts, Telegram bots for exfiltration, and a backdoor named goyim that is largely copied from the public GSocket deploy script. The backdoor can remain after the desktop appears normal, running as SystemUIServerl from ~/Library/Application Support/iCloudsync.\u003c/p\u003e\n"},{"n":17,"title":"GoSerpent: a persistent threat evolves with sophisticated data collection and exfiltration","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/goserpent-backdoor-in-southeast-asia/120687/","time":"12:00","priority":"SHOULD READ","score":88,"tldr":"Kaspersky reports that GoSerpent, a Go-based RAT targeting government and diplomatic entities in Southeast Asia, has evolved into a coordinated toolset for long-term espionage. The attackers use GoSerpent, Stowaway, ThumbcacheService, credential dumpers, and TmcLoader/TmcPayload together to collect sensitive files, steal credentials, and later exfiltrate the data through network shares.","briefOverview":"\u003cp\u003eKaspersky discovered malicious activity in February 2026 that had been ongoing since late 2025 and targeted government and diplomatic entities in Southeast Asia. The main malware, dubbed GoSerpent, is a Go-based remote access Trojan with proxy capabilities and was used to deploy additional tools for sensitive data collection and credential dumping. The article also states that earlier versions of GoSerpent have been used since 2021 against victims in Southeast Asia.\u003c/p\u003e\n\n\u003cp\u003eThe initial phase used GoSerpent to deploy ThumbcacheService, a malicious Windows service that collected documents and stored them in \u003ccode\u003eC:\\Users\\Public\\thumbcache_605a.db\u003c/code\u003e. ThumbcacheService targeted files with extensions including \u003ccode\u003e.doc\u003c/code\u003e, \u003ccode\u003e.docx\u003c/code\u003e, \u003ccode\u003e.pdf\u003c/code\u003e, \u003ccode\u003e.xls\u003c/code\u003e, and \u003ccode\u003e.xlsx\u003c/code\u003e, archived them with 7-Zip, and also monitored the \u003ccode\u003e$Recycle.Bin\u003c/code\u003e directory for deleted files of interest. The attackers also deployed Mimikatz and QuarksDumpLocalHash to steal credentials for later use in data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eIn May 2026, the threat actor returned with Stowaway and a two-stage exfiltration tool called TmcLoader/TmcPayload. Stowaway was used to deliver TmcLoader and an encrypted configuration file containing network share credentials and destination paths for exfiltrating the same \u003ccode\u003ethumbcache_605a.db\u003c/code\u003e file created earlier. The article highlights the deliberate integration of the toolset and notes that attribution remains uncertain, though there are indications of a possible link to TetrisPhantom.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky discovered malicious activity in February 2026 that had been ongoing since late 2025 and targeted government and diplomatic entities in Southeast Asia.","The main malware, GoSerpent, is a Go-based remote access Trojan with proxy capabilities that receives encrypted command-line arguments and communicates with command-and-control servers using ChaCha20 encryption.","The attackers used GoSerpent to deploy ThumbcacheService to collect sensitive files and credential dumping tools including Mimikatz and QuarksDumpLocalHash.","In May 2026, the threat actor returned with Stowaway and a two-stage exfiltration tool called TmcLoader/TmcPayload to move previously collected data through network shares.","The article states that GoSerpent has been used since at least 2021 and that there are indications of a possible link to the TetrisPhantom threat actor, though attribution remains uncertain."],"insights":["The attackers separated data collection from exfiltration by letting ThumbcacheService gather files for weeks before returning with TmcLoader/TmcPayload to move the stored database file out through network shares.","The toolchain was deliberately integrated: ThumbcacheService created the exact thumbcache_605a.db file later referenced by the encrypted TmcPayload configuration for exfiltration.","The threat actor continued using a simpler plain-text-argument variant of GoSerpent alongside the newer encrypted-argument variant, showing that older versions of the tool remain relevant for detection.","ThumbcacheService monitored the $Recycle.Bin directory for deleted documents, indicating that deleted files were still part of the actor’s collection strategy.","The use of legitimate hosting providers such as Alibaba Cloud and UCLOUD HK for command-and-control infrastructure made detection more challenging, according to the article."],"referencedReports":[],"body":"\u003cp\u003eKaspersky discovered malicious activity in February 2026 that had been ongoing since late 2025 and targeted government and diplomatic entities in Southeast Asia. The main malware, dubbed GoSerpent, is a Go-based remote access Trojan with proxy capabilities and was used to deploy additional tools for sensitive data collection and credential dumping. The article also states that earlier versions of GoSerpent have been used since 2021 against victims in Southeast Asia.\u003c/p\u003e\n\n\u003cp\u003eThe initial phase used GoSerpent to deploy ThumbcacheService, a malicious Windows service that collected documents and stored them in \u003ccode\u003eC:\\Users\\Public\\thumbcache_605a.db\u003c/code\u003e. ThumbcacheService targeted files with extensions including \u003ccode\u003e.doc\u003c/code\u003e, \u003ccode\u003e.docx\u003c/code\u003e, \u003ccode\u003e.pdf\u003c/code\u003e, \u003ccode\u003e.xls\u003c/code\u003e, and \u003ccode\u003e.xlsx\u003c/code\u003e, archived them with 7-Zip, and also monitored the \u003ccode\u003e$Recycle.Bin\u003c/code\u003e directory for deleted files of interest. The attackers also deployed Mimikatz and QuarksDumpLocalHash to steal credentials for later use in data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eIn May 2026, the threat actor returned with Stowaway and a two-stage exfiltration tool called TmcLoader/TmcPayload. Stowaway was used to deliver TmcLoader and an encrypted configuration file containing network share credentials and destination paths for exfiltrating the same \u003ccode\u003ethumbcache_605a.db\u003c/code\u003e file created earlier. The article highlights the deliberate integration of the toolset and notes that attribution remains uncertain, though there are indications of a possible link to TetrisPhantom.\u003c/p\u003e\n"},{"n":9,"title":"New TELEPUZ Malware Spreads via ClickFix to Steal Data and Run Commands","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-telepuz-malware-spreads-via.html","time":"12:50","priority":"SHOULD READ","score":84,"tldr":"A new modular malware called TELEPUZ is spreading through ClickFix lures that trick users into running malicious PowerShell commands, enabling data theft, command execution, persistence, and browser cookie theft. Researchers say its active development and daily builds suggest an emerging malware-as-a-service operation.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a new modular malware called \u003cstrong\u003eTELEPUZ\u003c/strong\u003e that has been spreading through websites infected with ClickFix lures since late April 2026. ClickFix tricks users into manually running malicious commands by presenting them as fixes for fake browser errors, software updates, or CAPTCHA verifications. Elastic Security Labs said the malware is full-featured, lightweight, and modular, with signs of active development and likely growth.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain executes PowerShell, which downloads a second-stage payload from a remote URL and runs it. That payload is a Go variant of Vidar Stealer, which harvests sensitive data and deploys a stager that launches TELEPUZ as \u003ccode\u003etelepuz.dll\u003c/code\u003e using \u003ccode\u003erundll32.exe\u003c/code\u003e. TELEPUZ includes obfuscation, anti-virtual-machine and geolocation checks, sandbox identifier checks, and defenses that disable or bypass several Windows security monitoring mechanisms.\u003c/p\u003e\n\n\u003cp\u003eAfter passing its checks, TELEPUZ can elevate privileges, attempt to gain SYSTEM privileges by stealing tokens from selected Windows processes, and register itself as a service loaded through a new \u003ccode\u003esvchost.exe\u003c/code\u003e instance. It communicates with command-and-control servers over WebSockets and can perform file enumeration, file operations, keystroke logging, command execution, process management, screenshot capture, web injection, Chromium cookie extraction, and downloading and running executables and DLL modules. The malware also uses fallback methods involving Telegram, Steam Community, DNS, and a Polygon blockchain smart contract to retrieve command-and-control addresses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs reported that a new modular malware called TELEPUZ has been spreading through websites infected with ClickFix lures since late April 2026.","The TELEPUZ infection chain uses PowerShell to download a second-stage payload, a Go variant of Vidar Stealer, which harvests sensitive data and deploys a stager that launches telepuz.dll with rundll32.exe.","TELEPUZ uses obfuscation, anti-virtual-machine checks, geolocation checks, sandbox identifier checks, NTDLL unhooking, AMSI and ETW disabling, debugger detection, and validation of its parent process before continuing execution.","After identifying a victim session, TELEPUZ can elevate privileges, attempt to gain SYSTEM privileges by stealing a token from selected Windows processes, and register itself as a service loaded through a new svchost.exe instance.","TELEPUZ communicates with its command-and-control server over WebSockets and can perform file operations, keystroke logging, command execution, process management, screenshot capture, web injection, Chromium cookie extraction, and downloading and running executables and DLL modules."],"insights":["TELEPUZ uses four separate fallback methods to recover its command-and-control address, including Telegram, Steam Community, DNS records, and a Polygon blockchain smart contract, making its infrastructure more resilient than a single hard-coded server address.","The malware avoids running in certain environments by checking hardware limits, usernames, computer names, and locale identifiers, including a hard-coded list of Commonwealth of Independent States countries.","Elastic observed a small number of command-and-control domains but a high daily volume of VirusTotal build submissions, indicating active development despite limited visible infrastructure.","TELEPUZ can target browsers through Chrome DevTools Protocol and WebDriver BiDi, allowing it to extract cookies and run arbitrary JavaScript in Chromium-based browsers and Mozilla Firefox.","The malware’s persistence method includes elevating through the COM elevation moniker technique, attempting to steal tokens from specific Windows processes, and registering itself as a service loaded in a new svchost.exe instance."],"referencedReports":[{"title":"TELEPUZ MaaS Malware ClickFix","url":"https://www.elastic.co/security-labs/telepuz-maas-malware-clickfix","publisher":"Elastic Security Labs","context":"The article cites an Elastic Security Labs technical report by Cyril François as the source of the TELEPUZ malware analysis.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers have identified a new modular malware called \u003cstrong\u003eTELEPUZ\u003c/strong\u003e that has been spreading through websites infected with ClickFix lures since late April 2026. ClickFix tricks users into manually running malicious commands by presenting them as fixes for fake browser errors, software updates, or CAPTCHA verifications. Elastic Security Labs said the malware is full-featured, lightweight, and modular, with signs of active development and likely growth.\u003c/p\u003e\n\n\u003cp\u003eThe attack chain executes PowerShell, which downloads a second-stage payload from a remote URL and runs it. That payload is a Go variant of Vidar Stealer, which harvests sensitive data and deploys a stager that launches TELEPUZ as \u003ccode\u003etelepuz.dll\u003c/code\u003e using \u003ccode\u003erundll32.exe\u003c/code\u003e. TELEPUZ includes obfuscation, anti-virtual-machine and geolocation checks, sandbox identifier checks, and defenses that disable or bypass several Windows security monitoring mechanisms.\u003c/p\u003e\n\n\u003cp\u003eAfter passing its checks, TELEPUZ can elevate privileges, attempt to gain SYSTEM privileges by stealing tokens from selected Windows processes, and register itself as a service loaded through a new \u003ccode\u003esvchost.exe\u003c/code\u003e instance. It communicates with command-and-control servers over WebSockets and can perform file enumeration, file operations, keystroke logging, command execution, process management, screenshot capture, web injection, Chromium cookie extraction, and downloading and running executables and DLL modules. The malware also uses fallback methods involving Telegram, Steam Community, DNS, and a Polygon blockchain smart contract to retrieve command-and-control addresses.\u003c/p\u003e\n"},{"n":10,"title":"New Agent Data Injection Attack Can Make AI Agents Misclick or Run Attacker Commands","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-agent-data-injection-attack-can.html","time":"11:32","priority":"SHOULD READ","score":84,"tldr":"Researchers described a new “agent data injection” technique that can trick AI agents by corrupting trusted-looking data fields, causing actions like misclicks, command execution, or unsafe code merges without using obvious malicious instructions. Existing prompt-injection defenses often miss it, while randomized element or field identifiers and stronger data provenance controls appear more effective.","briefOverview":"\u003cp\u003eResearchers from Seoul National University, the University of Illinois Urbana-Champaign, and Largosoft described a new class of attack called agent data injection, or ADI, in a paper posted July 6. The attack corrupts data that AI agents already trust, such as a sender name, button ID, or tool-result record, rather than hiding a direct malicious command in content. The article says this can make an agent misclick, run an attacker’s command, or approve unsafe code while still appearing to carry out the user’s original task.\u003c/p\u003e\n\n\u003cp\u003eThe researchers built proof-of-concept attacks against real tools, including Claude in Chrome, Google Antigravity, Nanobrowser, Claude Code, OpenAI Codex, and Google Gemini CLI. One web-agent attack used a planted product review to reuse a real button ID so an agent intending to click “Read More” could click “Buy Now” instead. Coding-assistant attacks used forged GitHub comment or pull-request data to make a command look like it came from a maintainer or to fake a clean check result.\u003c/p\u003e\n\n\u003cp\u003eThe article says existing defenses that block classic prompt injection worked well against hidden-order attacks but did not stop ADI reliably, with ADI succeeding up to 50% of the time against tested agent defenses. User approval prompts also helped little because they did not always show what the agent was actually clicking or because the agent’s reasoning was based on fake facts. Random, unguessable IDs helped ChatGPT Atlas avoid the click attack, while stronger data-origin tracking stopped the tested attacks but reduced ordinary task completion to about one third.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers from Seoul National University, the University of Illinois Urbana-Champaign, and Largosoft described a new class of attack called agent data injection, where attacker-controlled input is presented as trusted data rather than as an explicit malicious instruction.","The researchers built working attacks against web agents including Claude in Chrome, Google Antigravity, and Nanobrowser, as well as coding assistants including Claude Code, OpenAI Codex, and Google Gemini CLI.","In the demonstrated web-agent attack, a planted product review reused the ID of a real button so an agent intending to click “Read More” could instead click “Buy Now.”","In the demonstrated coding-assistant attacks, a GitHub comment could forge a maintainer author line to get an agent to run an attacker’s command, and a malicious pull request could fake a clean check result to influence an agent’s review.","The article says purpose-built agent defenses blocked classic instruction-smuggling attacks almost entirely in tests, but agent data injection still succeeded up to 50% of the time."],"insights":["User approval prompts were not very effective in the tested tools because the prompts often did not show enough detail about the action, and the agent’s visible reasoning could appear sensible while being based on forged facts.","The fake punctuation used in agent data injection did not need to be syntactically correct, because models treated escaped quotes, curly quotes, and even dollar signs as if they were real structure in some tests.","Random, unguessable identifiers reduced or prevented some attacks, as shown by ChatGPT Atlas resisting the click attack and by short random tags roughly halving success rates in the researchers’ tests.","A stronger defense that tracked the origin of every piece of data stopped the attacks entirely in testing, but it also reduced normal task completion to about one third, showing a major usability tradeoff.","The researchers said cloud-service data formats may still be recoverable through multi-turn jailbreaks, and that formats shared between larger and smaller models can let attackers learn from the easier-to-break smaller model."],"referencedReports":[{"title":"Agent Data Injection","url":"https://arxiv.org/abs/2607.05120","publisher":"Seoul National University, University of Illinois Urbana-Champaign, and Largosoft","context":"The article is based on a paper posted July 6 that introduces agent data injection and evaluates attacks against real AI agent tools.","category":"research","primary":true},{"title":"MCP GitHub Vulnerability","url":"https://invariantlabs.ai/blog/mcp-github-vulnerability","publisher":"Invariant Labs","context":"The article references Invariant Labs’ May 2025 analysis showing that a public GitHub issue could steer an agent into reading and leaking a private repository.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers from Seoul National University, the University of Illinois Urbana-Champaign, and Largosoft described a new class of attack called agent data injection, or ADI, in a paper posted July 6. The attack corrupts data that AI agents already trust, such as a sender name, button ID, or tool-result record, rather than hiding a direct malicious command in content. The article says this can make an agent misclick, run an attacker’s command, or approve unsafe code while still appearing to carry out the user’s original task.\u003c/p\u003e\n\n\u003cp\u003eThe researchers built proof-of-concept attacks against real tools, including Claude in Chrome, Google Antigravity, Nanobrowser, Claude Code, OpenAI Codex, and Google Gemini CLI. One web-agent attack used a planted product review to reuse a real button ID so an agent intending to click “Read More” could click “Buy Now” instead. Coding-assistant attacks used forged GitHub comment or pull-request data to make a command look like it came from a maintainer or to fake a clean check result.\u003c/p\u003e\n\n\u003cp\u003eThe article says existing defenses that block classic prompt injection worked well against hidden-order attacks but did not stop ADI reliably, with ADI succeeding up to 50% of the time against tested agent defenses. User approval prompts also helped little because they did not always show what the agent was actually clicking or because the agent’s reasoning was based on fake facts. Random, unguessable IDs helped ChatGPT Atlas avoid the click attack, while stronger data-origin tracking stopped the tested attacks but reduced ordinary task completion to about one third.\u003c/p\u003e\n"},{"n":1,"title":"Scattered Spider members behind TfL hack get five years in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/scattered-spider-members-behind-transport-for-london-hack-get-five-years-in-prison/","time":"12:31","priority":"SHOULD READ","score":82,"tldr":"Two leading Scattered Spider members, Thalha Jubair and Owen Flowers, were sentenced to five years and six months in prison each for the 2024 Transport for London hack, which disrupted major systems and exposed customer data. Authorities said TfL’s early cooperation with law enforcement was key to securing the convictions.","briefOverview":"\u003cp\u003eTwo leading members of the Scattered Spider cybercrime collective, 20-year-old Thalha Jubair and 18-year-old Owen Flowers, were sentenced to five years and six months in prison each for hacking Transport for London in 2024. TfL disclosed on September 2, 2024, that its network had been breached in August, disrupting internal systems and online services. Both defendants pleaded guilty under the Computer Misuse Act before being sentenced.\u003c/p\u003e\n\n\u003cp\u003eThe attack affected services and platforms including Dial-a-Ride, concessionary travel cards, digital payments, contactless ticketing rollout, and refund processing. TfL said 148 systems became inoperable, and all 27,000 employees had to reset their passwords in person after the breach. The agency later confirmed that attackers stole customer data including names, addresses, and contact details.\u003c/p\u003e\n\n\u003cp\u003eTfL reported £29 million in losses and recovery costs, while officials estimated that the UK economy could have lost up to £56 billion if the transport network had been shut down. NCA Deputy Director Paul Foster described Scattered Spider as “the most significant cybercrime threat to the UK in recent years” and credited TfL’s early cooperation with law enforcement for enabling the convictions. The article also notes that Jubair was charged by the U.S. Department of Justice in September 2025 over alleged involvement in at least 120 network breaches, and that four other suspected Scattered Spider members were arrested in July 2025 over attacks on major UK retailers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Thalha Jubair and Owen Flowers, described as leading members of Scattered Spider, were each sentenced to five years and six months in prison for hacking Transport for London in 2024.","Transport for London disclosed in September 2024 that its network had been breached, causing disruptions to internal systems, online services, Dial-a-Ride, concessionary travel cards, digital payments, contactless ticketing rollout, and refund processing.","The breach made 148 Transport for London systems inoperable and required all 27,000 employees to reset their passwords in person.","Transport for London said attackers stole customer data including names, addresses, and contact details, and reported £29 million in losses and recovery costs.","The U.S. Department of Justice charged Thalha Jubair in September 2025 in connection with at least 120 network breaches and alleged that Jubair and accomplices extorted over $115 million from victims worldwide between August 2024 and July 2025."],"insights":["Transport for London’s early engagement with law enforcement was specifically credited by the NCA as a likely reason the convictions were possible, making rapid reporting a concrete lesson from the case.","The incident’s actual reported cost to TfL was £29 million, but officials estimated the potential UK economic impact could have reached £56 billion if the attackers had shut down the transport network, showing how transport disruptions can create losses far beyond the breached organization.","The operational recovery burden was unusually physical and large-scale, with all 27,000 TfL employees required to reset passwords in person after the breach.","The case connected a UK public transport hack to a broader international cybercrime picture, with Jubair later charged by the U.S. Department of Justice over at least 120 alleged network breaches affecting organizations including critical infrastructure entities and U.S. courts."],"referencedReports":[],"body":"\u003cp\u003eTwo leading members of the Scattered Spider cybercrime collective, 20-year-old Thalha Jubair and 18-year-old Owen Flowers, were sentenced to five years and six months in prison each for hacking Transport for London in 2024. TfL disclosed on September 2, 2024, that its network had been breached in August, disrupting internal systems and online services. Both defendants pleaded guilty under the Computer Misuse Act before being sentenced.\u003c/p\u003e\n\n\u003cp\u003eThe attack affected services and platforms including Dial-a-Ride, concessionary travel cards, digital payments, contactless ticketing rollout, and refund processing. TfL said 148 systems became inoperable, and all 27,000 employees had to reset their passwords in person after the breach. The agency later confirmed that attackers stole customer data including names, addresses, and contact details.\u003c/p\u003e\n\n\u003cp\u003eTfL reported £29 million in losses and recovery costs, while officials estimated that the UK economy could have lost up to £56 billion if the transport network had been shut down. NCA Deputy Director Paul Foster described Scattered Spider as “the most significant cybercrime threat to the UK in recent years” and credited TfL’s early cooperation with law enforcement for enabling the convictions. The article also notes that Jubair was charged by the U.S. Department of Justice in September 2025 over alleged involvement in at least 120 network breaches, and that four other suspected Scattered Spider members were arrested in July 2025 over attacks on major UK retailers.\u003c/p\u003e\n"},{"n":2,"title":"23andMe to pay $18 million in new genetics data breach settlement","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/23andme-to-pay-18-million-in-new-genetics-data-breach-settlement/","time":"13:47","priority":"SHOULD READ","score":82,"tldr":"23andMe will pay $18 million to settle claims by 43 attorneys general that weak security allowed a 2023 credential-stuffing breach exposing genetic ancestry data from 6.9 million customers. The settlement also imposes stricter security requirements and preserves consumers’ rights to delete their data.","briefOverview":"\u003cp\u003e23andMe, now Chrome Holding Co., agreed to pay $18 million to settle claims from a coalition of 43 attorneys general that it failed to protect customers\u0026rsquo; genetic data. The settlement follows a 2023 breach disclosed in October 2023, after credential-stuffing attacks went unnoticed from April 2023 to September 2023. During the incident, attackers stole data from 6.9 million customers, including genetic ancestry information, and some of the data was later offered for sale on the dark web.\u003c/p\u003e\n\n\u003cp\u003eNew York Attorney General Letitia James said a multistate investigation found that 23andMe lacked basic safeguards against credential-based cyberattacks. The cited gaps included password blocklisting, multifactor authentication, adequate rate limiting, intrusion prevention, and breach-detection monitoring. Investigators also found that the company failed to address unusual login activity and fix known vulnerabilities, and James said the company initially denied a breach before blaming customers\u0026rsquo; account and password practices.\u003c/p\u003e\n\n\u003cp\u003eThe settlement requires new security measures at TTAM, including a data security advisory board, risk analysis protocols, and continued consumer rights to delete their data. The 2023 breach also led to multiple class-action lawsuits, a \u003cspan class=\"math inline\"\u003e\\(30 million proposed class action settlement in September 2024, and a £2.31 million UK Information Commissioner's Office fine in June 2025. 23andMe filed for Chapter 11 bankruptcy in March 2025, and TTAM Research Institute, now reregistered as 23andMe Research Institute, completed its acquisition of the company after agreeing to pay \\)\u003c/span\u003e305 million for its assets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["23andMe, now Chrome Holding Co., agreed to pay $18 million to settle claims from 43 attorneys general that it failed to protect customers' genetic data.","The company disclosed in October 2023 that credential-stuffing attacks went unnoticed from April 2023 to September 2023 and led to the theft of data belonging to 6.9 million customers.","New York Attorney General Letitia James said investigators found that 23andMe lacked basic safeguards such as password blocklisting, multifactor authentication, adequate rate limiting, intrusion prevention, and breach-detection monitoring.","The settlement requires new security measures at TTAM, including a data security advisory board, risk analysis protocols, and continued consumer rights to delete their data.","The 2023 breach also led to class-action lawsuits, a $30 million class action settlement, Chapter 11 bankruptcy proceedings, and a £2.31 million fine from the UK Information Commissioner's Office."],"insights":["The investigation highlighted that the breach was not tied to a single missing control, but to several absent or inadequate safeguards at once, including multifactor authentication, password blocklisting, rate limiting, intrusion prevention, and breach-detection monitoring.","The credential-stuffing activity reportedly went unnoticed for five months, showing that the length of undetected activity was a central issue in the attorneys general's case against 23andMe.","23andMe’s initial response became part of the regulatory criticism because investigators said the company first denied a breach and then blamed customers' account and password practices.","The legal and regulatory fallout continued well beyond the original disclosure, with state settlements, class-action litigation, bankruptcy-related actions, and a UK fine all stemming from the same 2023 incident."],"referencedReports":[],"body":"\u003cp\u003e23andMe, now Chrome Holding Co., agreed to pay $18 million to settle claims from a coalition of 43 attorneys general that it failed to protect customers\u0026rsquo; genetic data. The settlement follows a 2023 breach disclosed in October 2023, after credential-stuffing attacks went unnoticed from April 2023 to September 2023. During the incident, attackers stole data from 6.9 million customers, including genetic ancestry information, and some of the data was later offered for sale on the dark web.\u003c/p\u003e\n\n\u003cp\u003eNew York Attorney General Letitia James said a multistate investigation found that 23andMe lacked basic safeguards against credential-based cyberattacks. The cited gaps included password blocklisting, multifactor authentication, adequate rate limiting, intrusion prevention, and breach-detection monitoring. Investigators also found that the company failed to address unusual login activity and fix known vulnerabilities, and James said the company initially denied a breach before blaming customers\u0026rsquo; account and password practices.\u003c/p\u003e\n\n\u003cp\u003eThe settlement requires new security measures at TTAM, including a data security advisory board, risk analysis protocols, and continued consumer rights to delete their data. The 2023 breach also led to multiple class-action lawsuits, a \u003cspan class=\"math inline\"\u003e\\(30 million proposed class action settlement in September 2024, and a £2.31 million UK Information Commissioner's Office fine in June 2025. 23andMe filed for Chapter 11 bankruptcy in March 2025, and TTAM Research Institute, now reregistered as 23andMe Research Institute, completed its acquisition of the company after agreeing to pay \\)\u003c/span\u003e305 million for its assets.\u003c/p\u003e\n"},{"n":7,"title":"Scattered Spider hackers sentenced to 5.5 years over £29 million Transport for London hack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/scattered-spider-hackers-tfl-sentenced","time":"12:00","priority":"SHOULD READ","score":82,"tldr":"Two leading Scattered Spider members were sentenced to 5.5 years in prison for the 2024 Transport for London hack, which disrupted critical systems, exposed customer data, and cost £29 million to recover. UK authorities said the case significantly disrupted one of the country’s most serious cybercrime threats.","briefOverview":"\u003cp\u003eTwo leading members of the Scattered Spider cybercrime collective, Thalha Jubair and Owen Flowers, were sentenced to five years and six months in prison for the 2024 cyberattack against Transport for London. Both pleaded guilty to offenses under Section 3ZA of the Computer Misuse Act after admitting to infiltrating TfL’s network. British authorities described the case as the largest cybercrime prosecution ever brought before a U.K. court and only the second brought under the U.K.’s most serious Computer Misuse Act offense.\u003c/p\u003e\n\n\u003cp\u003eThe attack disrupted public services, exposed customer data and cost Transport for London £29 million in recovery expenses. It forced all 27,000 TfL employees to attend offices for in-person password resets, and 148 internal systems became unavailable, including critical operational platforms that required manual workarounds. The breach also affected the Oyster refund system, delayed some passenger refunds and temporarily suspended applications for Oyster photocards used by children and young people.\u003c/p\u003e\n\n\u003cp\u003eInvestigators said Jubair and Flowers coordinated the attack through Telegram and an online collaborative workspace, and searches recovered devices containing evidence connected to TfL’s infrastructure. The National Crime Agency said arrests in September 2024 significantly disrupted Scattered Spider’s operations, and Microsoft concluded the arrests materially degraded the group’s ability to continue cybercriminal operations. Officials also said the estimated economic impact could have reached £56 billion if the attackers had succeeded in disabling London’s transport network.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Thalha Jubair and Owen Flowers were each sentenced to five years and six months in prison after pleading guilty to offenses under Section 3ZA of the Computer Misuse Act for the 2024 Transport for London cyberattack.","The attack disrupted Transport for London operations, made 148 internal systems unavailable, forced 27,000 employees to complete in-person password resets, exposed customer data, and cost £29 million in recovery expenses.","The breach affected Transport for London’s Oyster refund system, delaying some passenger refunds, and temporarily suspended applications for Oyster photocards used by children and young people.","The National Crime Agency identified Jubair and Flowers as leading members of Scattered Spider, an English-speaking cybercriminal network linked to attacks on airlines, retailers, insurers, and technology companies in the U.K. and United States.","British authorities said the case was the largest cybercrime prosecution ever brought before a U.K. court and only the second prosecution under the U.K.’s most serious Computer Misuse Act offense."],"insights":["Transport for London’s prompt engagement with law enforcement was described as critical to securing the convictions, underscoring the practical value of early victim reporting in major cybercrime cases.","The attack did not shut down London’s transport network, but officials estimated that a successful shutdown could have caused £56 billion in economic impact, showing how cyber incidents against transport systems can carry far greater public costs than recovery expenses alone.","Evidence recovered from seized devices included a screenshot connected to TfL infrastructure and videos allegedly showing live access to TfL systems, illustrating how attackers’ own records can become central evidence in prosecutions.","The sentencing prompted City of London Police to advocate for Cyber Crime Risk Orders that could restrict convicted offenders’ access to devices and online services after release, indicating a push toward technology-based controls to reduce reoffending."],"referencedReports":[],"body":"\u003cp\u003eTwo leading members of the Scattered Spider cybercrime collective, Thalha Jubair and Owen Flowers, were sentenced to five years and six months in prison for the 2024 cyberattack against Transport for London. Both pleaded guilty to offenses under Section 3ZA of the Computer Misuse Act after admitting to infiltrating TfL’s network. British authorities described the case as the largest cybercrime prosecution ever brought before a U.K. court and only the second brought under the U.K.’s most serious Computer Misuse Act offense.\u003c/p\u003e\n\n\u003cp\u003eThe attack disrupted public services, exposed customer data and cost Transport for London £29 million in recovery expenses. It forced all 27,000 TfL employees to attend offices for in-person password resets, and 148 internal systems became unavailable, including critical operational platforms that required manual workarounds. The breach also affected the Oyster refund system, delayed some passenger refunds and temporarily suspended applications for Oyster photocards used by children and young people.\u003c/p\u003e\n\n\u003cp\u003eInvestigators said Jubair and Flowers coordinated the attack through Telegram and an online collaborative workspace, and searches recovered devices containing evidence connected to TfL’s infrastructure. The National Crime Agency said arrests in September 2024 significantly disrupted Scattered Spider’s operations, and Microsoft concluded the arrests materially degraded the group’s ability to continue cybercriminal operations. Officials also said the estimated economic impact could have reached £56 billion if the attackers had succeeded in disabling London’s transport network.\u003c/p\u003e\n"},{"n":14,"title":"A Trusted Domain, a Voicemail, and a Windows .EXE","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/trusted-nonprofit-domain-voicemail-exe-malware","time":"11:00","priority":"SHOULD READ","score":80,"tldr":"A phishing email sent from a legitimately authenticated nonprofit domain used a voicemail lure to deliver a malicious Windows executable from a newly registered domain. The key takeaway is that SPF, DKIM, DMARC, and sender reputation do not prove an email is safe when a real account or trusted domain is abused.","briefOverview":"\u003cp\u003eA phishing message posing as a voicemail notification arrived from a legitimate nonprofit domain and passed SPF, DKIM, and DMARC. The message was not spoofed and was sent through the nonprofit’s actual mail infrastructure, including its commercial gateway and Microsoft 365. Six of the seven links in the email pointed to the real organization’s website or social pages and were clean.\u003c/p\u003e\n\n\u003cp\u003eThe malicious link was labeled \u003cem\u003eMailbox\u003c/em\u003e and led directly to a Windows executable named \u003ccode\u003ehmlineea.exe\u003c/code\u003e hosted at \u003ccode\u003ehxxps://db2000[.]net/v25/hmlineea.exe\u003c/code\u003e. The payload domain was 26 days old, registered through NameSilo, privacy-protected with PrivacyGuardian, and used Cloudflare name servers. Public sandbox analysis found malicious behavior, and automated link analysis scored the URL at 0.95 on a 0-to-1 risk scale.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that authentication confirms who sent a message but does not prove the message is safe. IRONSCALES Themis flagged the email based on behavior, including the first-time external sender, the malicious payload host, and phishing-like language and structure. The attack maps to MITRE ATT\u0026amp;CK T1566.002 for spearphishing links and T1204.002 for user execution of a malicious file.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email posing as a voicemail notification was sent from a legitimate nonprofit domain and passed SPF, DKIM, and DMARC authentication.","Six of the seven links in the message pointed to the real nonprofit organization’s website or social pages and were clean.","The link labeled “Mailbox” downloaded a Windows executable named hmlineea.exe from db2000.net, a domain registered 26 days before delivery with privacy-protected registration.","Public sandbox analysis of hmlineea.exe returned malicious behavior, and automated link analysis scored the URL at 0.95 on a 0-to-1 risk scale.","IRONSCALES Themis flagged the message based on behavior, including a first-time external sender, a malicious payload host, and language and structure matching prior phishing patterns."],"insights":["Email authentication should be treated as proof of origin rather than proof of safety, because a compromised or misused authorized mailbox can still pass SPF, DKIM, and DMARC.","A message can appear overwhelmingly legitimate when most links point to real clean sites, so each action link needs to be evaluated independently rather than relying on the overall sender or message reputation.","The mismatch between the lure and the delivered file type was a decisive signal: a voicemail notification leading directly to a Windows .exe is not consistent with legitimate voicemail delivery.","First-time sender relationships and newly registered payload domains can provide detection value even when the sender’s domain is legitimate and authenticated.","Blocking or removing executable delivery paths can reduce the chance that a simple link in an email becomes a running malicious program."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/
