2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics that roughly 10 percent of attacks reaching email gateways carry malware and phishing remains an initial access vector in 16 percent of breaches.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article cites the report as documenting a shift toward abusing legitimate services and identities to bypass reputation controls.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references this CISA phishing advisory for network-defender guidance on removing executable delivery paths.","category":"advisory","primary":false}],"body":"\u003cp\u003eA phishing message posing as a voicemail notification arrived from a legitimate nonprofit domain and passed SPF, DKIM, and DMARC. The message was not spoofed and was sent through the nonprofit’s actual mail infrastructure, including its commercial gateway and Microsoft 365. Six of the seven links in the email pointed to the real organization’s website or social pages and were clean.\u003c/p\u003e\n\n\u003cp\u003eThe malicious link was labeled \u003cem\u003eMailbox\u003c/em\u003e and led directly to a Windows executable named \u003ccode\u003ehmlineea.exe\u003c/code\u003e hosted at \u003ccode\u003ehxxps://db2000[.]net/v25/hmlineea.exe\u003c/code\u003e. The payload domain was 26 days old, registered through NameSilo, privacy-protected with PrivacyGuardian, and used Cloudflare name servers. Public sandbox analysis found malicious behavior, and automated link analysis scored the URL at 0.95 on a 0-to-1 risk scale.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that authentication confirms who sent a message but does not prove the message is safe. IRONSCALES Themis flagged the email based on behavior, including the first-time external sender, the malicious payload host, and phishing-like language and structure. The attack maps to MITRE ATT\u0026amp;CK T1566.002 for spearphishing links and T1204.002 for user execution of a malicious file.\u003c/p\u003e\n"},{"n":4,"title":"Windows 11 24H2 Home and Pro reach end of support in 90 days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-24h2-home-and-pro-reach-end-of-support-in-90-days/","time":"11:59","priority":"SHOULD READ","score":78,"tldr":"Microsoft says Windows 11 24H2 Home and Pro, along with Windows 10 Enterprise LTSB 2016, will stop receiving security and preview updates on October 13, 2026. Users should upgrade to Windows 11 25H2 to remain protected.","briefOverview":"\u003cp\u003eMicrosoft announced that Windows 11 version 24H2 Home and Pro editions and Windows 10 Enterprise LTSB 2016 will reach end of updates on October 13, 2026. After that date, devices running these editions will no longer receive monthly security and non-security preview updates. Microsoft said those updates contain protections from the latest security threats.\u003c/p\u003e\n\n\u003cp\u003eWindows 11 version 24H2 Enterprise and Education editions are on a different timeline and will remain under mainstream support until October 12, 2027. Microsoft is advising customers to upgrade to Windows 11 version 25H2, also known as the Windows 11 2025 Update. The article says Windows 11 25H2 became generally available in September 2024 as a minor update installed on version 24H2 through an enablement package.\u003c/p\u003e\n\n\u003cp\u003eDevices running Windows 11 24H2 Home and Pro that are not managed by IT departments will receive the Windows 11 25H2 update automatically. Users can still postpone the update or choose when to restart. Microsoft also said eligible Windows 10 or Windows 11 users can check for the update in Settings under Windows Update by selecting Check for updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft announced that Windows 11 version 24H2 Home and Pro editions and Windows 10 Enterprise LTSB 2016 will reach end of updates on October 13, 2026.","After October 13, 2026, devices running those editions will no longer receive monthly security and non-security preview updates containing protections from the latest security threats.","Windows 11 version 24H2 Enterprise and Education editions will remain under mainstream support until October 12, 2027.","Microsoft advises customers to upgrade to Windows 11 version 25H2, also known as the Windows 11 2025 Update.","Devices running Windows 11 24H2 Home and Pro that are not managed by IT departments will receive the Windows 11 25H2 update automatically, but users can postpone the update or choose when to restart."],"insights":["Support timelines differ by edition, so organizations cannot assume all Windows 11 24H2 systems have the same deadline: Home and Pro end updates on October 13, 2026, while Enterprise and Education continue until October 12, 2027.","The recommended move to Windows 11 25H2 may be relatively small for Windows 11 24H2 systems because the article says it is installed through an enablement package rather than as a larger feature upgrade.","Unmanaged Windows 11 24H2 Home and Pro devices will receive Windows 11 25H2 automatically, but users still retain control over postponing the update or choosing when to restart.","Microsoft’s consumer Windows 10 Extended Security Updates program now runs until October 12, 2027 for enrolled devices, which is later than the October 13, 2026 end-of-updates date for Windows 10 Enterprise LTSB 2016 mentioned in the article."],"referencedReports":[{"title":"Windows 11, version 24H2 Home and Pro editions, and Windows 10 Enterprise LTSB 2016 will reach end of updates","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#4901","publisher":"Microsoft","context":"The article cites Microsoft’s message center update warning that these Windows editions will stop receiving updates on October 13, 2026.","category":"advisory","primary":true},{"title":"Windows 11 Enterprise and Education lifecycle","url":"https://learn.microsoft.com/en-us/lifecycle/products/windows-11-enterprise-and-education","publisher":"Microsoft","context":"The article references Microsoft’s support website to note that Windows 11 Enterprise and Education editions remain under mainstream support until October 12, 2027.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft announced that Windows 11 version 24H2 Home and Pro editions and Windows 10 Enterprise LTSB 2016 will reach end of updates on October 13, 2026. After that date, devices running these editions will no longer receive monthly security and non-security preview updates. Microsoft said those updates contain protections from the latest security threats.\u003c/p\u003e\n\n\u003cp\u003eWindows 11 version 24H2 Enterprise and Education editions are on a different timeline and will remain under mainstream support until October 12, 2027. Microsoft is advising customers to upgrade to Windows 11 version 25H2, also known as the Windows 11 2025 Update. The article says Windows 11 25H2 became generally available in September 2024 as a minor update installed on version 24H2 through an enablement package.\u003c/p\u003e\n\n\u003cp\u003eDevices running Windows 11 24H2 Home and Pro that are not managed by IT departments will receive the Windows 11 25H2 update automatically. Users can still postpone the update or choose when to restart. Microsoft also said eligible Windows 10 or Windows 11 users can check for the update in Settings under Windows Update by selecting Check for updates.\u003c/p\u003e\n"},{"n":15,"title":"Benchmarking 13 AI models on rediscovering known CVEs","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/benchmarking-ai-models-known-cves","time":"11:24","priority":"MAY READ","score":68,"tldr":"A benchmark of 13 AI models found GPT-5.6 had the best CVE rediscovery recall, but repeated runs of cheaper mid-tier models often matched or beat a single flagship run at much lower cost. The biggest remaining challenge is finding vulnerabilities that require deeper reasoning across complex code paths rather than obvious dangerous sinks.","briefOverview":"\u003cp\u003eThe article reports on a benchmark of 13 AI models tested against 26 known vulnerabilities from the GitHub advisory database. The models were run inside Aikido’s AI Code Analysis harness, which was designed to make the models navigate repositories and reason about code like an auditor. Each model was run three times, and a vulnerability counted as found if it appeared in any run.\u003c/p\u003e\n\n\u003cp\u003eGPT-5.6 achieved the highest recall, rediscovering 23 of 26 CVEs, ahead of grok-4.5 at 20 and Claude Opus models at 15 to 18. Every model found both critical CVEs, while the main differences appeared in high- and medium-severity issues. The article says obvious dangerous code patterns, such as deserialization, shell execution, HTML sinks, and broken signature checks, are effectively solved, while harder bugs involve missing checks or longer chains across code.\u003c/p\u003e\n\n\u003cp\u003eA major finding is that repeated runs of cheaper models can rival or beat a single run of a more expensive flagship model. For example, three runs of gpt-5.4-nano reached 18 of 26 findings, and three runs of gpt-5.4-mini reached 20, because different runs found different bugs. The article concludes that the most expensive model tier rarely earns its price, and that the auditing harness is still important for aiming model reasoning at the right parts of a codebase.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The benchmark tested 13 AI models against 26 known vulnerabilities from the GitHub advisory database using an AI Code Analysis harness built for code auditing.","GPT-5.6 achieved the highest recall score, rediscovering 23 of 26 CVEs, while grok-4.5 found 20 and the Claude Opus models found between 15 and 18.","Every model rediscovered both critical CVEs, and the largest performance differences appeared on high- and medium-severity findings.","Pooling three runs of the same model improved results because different runs found different subsets of bugs, with gpt-5.4-nano rising from no more than 14 in a single run to 18 of 26 across three runs.","The article concludes that running cheaper models multiple times can find more vulnerabilities for less money than a single pass of a more expensive flagship model."],"insights":["Pooling multiple runs is more valuable than relying on one stronger model because the same model can miss a vulnerability in one run and find it in another on the same task.","The benchmark suggests that obvious dangerous code patterns are no longer where leading models differentiate, since every model found the critical bugs and short-flow issues involving well-known risky operations.","The meaningful capability gap appears in vulnerabilities that require reasoning about missing checks or following indirect chains across code, such as the SQL injection through an unescaped ORM column alias.","Higher reasoning settings did not consistently justify their extra cost, with gpt-5.6-terra showing the same 23 findings at 2.2 times the cost and some models even scoring one finding lower within run-to-run noise.","Open-weight models are becoming competitive in this use case, with GLM-5.2 rediscovering 16 of 26 vulnerabilities and landing mid-pack among proprietary models."],"referencedReports":[],"body":"\u003cp\u003eThe article reports on a benchmark of 13 AI models tested against 26 known vulnerabilities from the GitHub advisory database. The models were run inside Aikido’s AI Code Analysis harness, which was designed to make the models navigate repositories and reason about code like an auditor. Each model was run three times, and a vulnerability counted as found if it appeared in any run.\u003c/p\u003e\n\n\u003cp\u003eGPT-5.6 achieved the highest recall, rediscovering 23 of 26 CVEs, ahead of grok-4.5 at 20 and Claude Opus models at 15 to 18. Every model found both critical CVEs, while the main differences appeared in high- and medium-severity issues. The article says obvious dangerous code patterns, such as deserialization, shell execution, HTML sinks, and broken signature checks, are effectively solved, while harder bugs involve missing checks or longer chains across code.\u003c/p\u003e\n\n\u003cp\u003eA major finding is that repeated runs of cheaper models can rival or beat a single run of a more expensive flagship model. For example, three runs of gpt-5.4-nano reached 18 of 26 findings, and three runs of gpt-5.4-mini reached 20, because different runs found different bugs. The article concludes that the most expensive model tier rarely earns its price, and that the auditing harness is still important for aiming model reasoning at the right parts of a codebase.\u003c/p\u003e\n"},{"n":11,"title":"AI Can Find Bugs, But Human Knowledge Still Proves Them","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ai-can-find-bugs-but-human-knowledge.html","time":"10:10","priority":"MAY READ","score":55,"tldr":"AI can speed up offensive security testing by generating leads, payloads, and reports, but it cannot replace human validation. Security teams should treat AI output as hypotheses until a skilled tester proves reachability, exploitability, impact, and the fix.","briefOverview":"\u003cp\u003eThe article argues that AI is changing offensive security by helping testers read code, generate payloads, summarize attack surfaces, explain APIs, and automate repetitive workflows. It emphasizes that these outputs are only useful when the underlying finding is proven in the target environment. A polished report, severity rating, or plausible proof-of-concept does not by itself prove exploitability, impact, or risk.\u003c/p\u003e\n\n\u003cp\u003eThe article says bug bounty programs, maintainers, and security teams are already seeing the cost of shallow AI-generated submissions and alerts. It cites Bugcrowd’s policy changes around AI-generated submissions as an example of polished but low-quality reports creating triage burden. It warns that adding AI-generated speculation to existing scanner output, dependency alerts, cloud issues, and compliance findings can create larger queues instead of better security.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main technical standard is validation: testers must prove what happened, what attacker-controlled input or identity was required, what boundary was crossed, how to reproduce the behavior, and what impact was demonstrated. It stresses that AI should generate leads, suggest test ideas, and reduce mechanical work, while humans remain responsible for judging reachability, exploitability, severity, and fixes. The article concludes that the strongest teams will combine automation with technical judgment rather than treating AI output as final.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI-assisted tools can quickly read code, generate payloads, summarize attack surfaces, explain unfamiliar APIs, and run repetitive testing workflows, but their output is not evidence that a vulnerability exists in a deployed environment.","Bug bounty programs and maintainers are already seeing more low-quality AI-generated reports with polished language but thin evidence, creating unnecessary triage burden.","The article argues that testers must prove reachability, attacker control, boundary crossing, reproducible steps, demonstrated impact, and relevance in the deployed configuration before promoting a lead to a finding.","Experienced offensive security practitioners remain valuable because they understand systems well enough to interpret tool output, adapt when first attempts fail, and avoid overstating severity.","The article says AI should be used to generate leads, suggest tests, and reduce repetitive work, while skilled humans retain responsibility for validation and final judgment."],"insights":["Teams should explicitly separate AI-generated leads from validated findings, because mixing those categories turns speculation into engineering workload.","A convincing AI-written report with a severity score and proof-of-concept can still be worthless if it does not show that the issue exists in the deployed environment.","Validation should prevent both exaggerated and understated risk by tying severity to demonstrated impact rather than theoretical worst cases.","Security leaders can reduce AI-driven noise by rewarding signal quality and validated impact instead of counting the number of findings produced.","AI can weaken practitioner skill if it answers questions, writes scripts, and explains code paths before testers build their own understanding."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that AI is changing offensive security by helping testers read code, generate payloads, summarize attack surfaces, explain APIs, and automate repetitive workflows. It emphasizes that these outputs are only useful when the underlying finding is proven in the target environment. A polished report, severity rating, or plausible proof-of-concept does not by itself prove exploitability, impact, or risk.\u003c/p\u003e\n\n\u003cp\u003eThe article says bug bounty programs, maintainers, and security teams are already seeing the cost of shallow AI-generated submissions and alerts. It cites Bugcrowd’s policy changes around AI-generated submissions as an example of polished but low-quality reports creating triage burden. It warns that adding AI-generated speculation to existing scanner output, dependency alerts, cloud issues, and compliance findings can create larger queues instead of better security.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main technical standard is validation: testers must prove what happened, what attacker-controlled input or identity was required, what boundary was crossed, how to reproduce the behavior, and what impact was demonstrated. It stresses that AI should generate leads, suggest test ideas, and reduce mechanical work, while humans remain responsible for judging reachability, exploitability, severity, and fixes. The article concludes that the strongest teams will combine automation with technical judgment rather than treating AI output as final.\u003c/p\u003e\n"},{"n":18,"title":"The Hunter's Paradox: Is it time to embrace automated threat hunting?","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/the-hunters-paradox-is-it-time-to-embrace-automated-threat-hunting/","time":"10:00","priority":"MAY READ","score":55,"tldr":"The author argues that threat hunting should shift from being strictly human-driven to reasoning-driven, allowing AI to execute narrowly scoped hunts because humans can no longer keep pace with security data volume and speed. But AI must be constrained with tight focus, strict access controls, graduated autonomy, and human ownership of strategy and novel hunting ideas.","briefOverview":"\u003cp\u003eThe article argues that threat hunting is facing what the author calls the “Hunter’s Paradox.” Humans can no longer keep up with the volume and speed of security data, so automation is necessary. At the same time, the most capable automation available, AI, cannot be fully trusted because attackers routinely use deception and AI may take misleading data at face value.\u003c/p\u003e\n\n\u003cp\u003eThe author revisits his earlier definition of threat hunting as a “manual or machine-assisted” process and proposes reframing it as a “reasoning-driven” process for identifying security incidents missed by automated detection systems. This shift matters because humans were once the only practical source of reasoning, but the author now says AI can reason in ways older tools could not. Under this framing, the key question becomes whether real reasoning is involved, not whether the hunter is human or machine.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends letting AI drive some hunts only under tight limits. Suggested guardrails include choosing narrowly scoped hunts, applying strict access controls and auditability, and increasing autonomy gradually from advisor to assistant to limited operator. The author says humans should remain responsible for hunt strategy and analytic novelty, while AI executes hunts within human-defined boundaries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The author describes the “Hunter’s Paradox” as the need to use AI for threat hunting because humans cannot keep up with security data volume and speed, while also recognizing that AI cannot be fully trusted.","The article says AI struggles with deception because attackers routinely create misleading data and AI systems tend to take the information they receive at face value.","The author proposes redefining threat hunting from a “manual or machine-assisted” process to a “reasoning-driven” process for finding security incidents missed by automated detection systems.","The article recommends limiting AI-driven hunting with tight focus, strict access controls and rules, and gradual increases in autonomy rather than giving AI broad independence.","The author argues that humans should remain responsible for deciding what is worth hunting for and for creating novel analysis approaches, while AI executes hunts within those human-defined boundaries."],"insights":["The author’s change in position is notable because he previously helped define threat hunting in a way that placed humans at the center, but now argues that reasoning, not human control, was the essential ingredient all along.","The article treats prompt injection as only a secondary AI risk and identifies ordinary attacker deception in security data as the deeper problem for AI-driven hunting.","A practical starting point for AI-driven hunting is the backlog of hunts teams have already run before but could not fully automate, because those hunts have clearer procedures while still requiring reasoning.","The author draws a firm boundary between execution and direction: AI may run hunts inside predefined limits, but it should not choose the hunt strategy or decide which threats matter most.","The article warns that excessive AI autonomy can create incidents rather than find them, because defenders must care about collateral damage in a way attackers do not."],"referencedReports":[{"title":"Open Model Vulnerability Analysis","url":"https://blogs.cisco.com/ai/open-model-vulnerability-analysis","publisher":"Cisco","context":"The article links to this as support for the claim that pervasive deception is a real issue for AI systems.","category":"research","primary":false},{"title":"arXiv paper 2601.05478","url":"https://arxiv.org/abs/2601.05478","publisher":"arXiv","context":"The article links to this paper as another source supporting the claim that pervasive deception is a real issue for AI.","category":"research","primary":false},{"title":"SSRN paper abstract 6130766","url":"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6130766","publisher":"SSRN","context":"The article links to this paper as additional support for the claim that pervasive deception is a real issue for AI.","category":"research","primary":false}],"body":"\u003cp\u003eThe article argues that threat hunting is facing what the author calls the “Hunter’s Paradox.” Humans can no longer keep up with the volume and speed of security data, so automation is necessary. At the same time, the most capable automation available, AI, cannot be fully trusted because attackers routinely use deception and AI may take misleading data at face value.\u003c/p\u003e\n\n\u003cp\u003eThe author revisits his earlier definition of threat hunting as a “manual or machine-assisted” process and proposes reframing it as a “reasoning-driven” process for identifying security incidents missed by automated detection systems. This shift matters because humans were once the only practical source of reasoning, but the author now says AI can reason in ways older tools could not. Under this framing, the key question becomes whether real reasoning is involved, not whether the hunter is human or machine.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends letting AI drive some hunts only under tight limits. Suggested guardrails include choosing narrowly scoped hunts, applying strict access controls and auditability, and increasing autonomy gradually from advisor to assistant to limited operator. The author says humans should remain responsible for hunt strategy and analytic novelty, while AI executes hunts within human-defined boundaries.\u003c/p\u003e\n"},{"n":16,"title":"The best defenders build AI agents together: Join Tenable for Swarm at Black Hat ’26","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/black-hat-2026-swarm-event-build-AI-security-agents","time":"13:00","priority":"MAY READ","score":35,"tldr":"Tenable is hosting Swarm at Black Hat USA 2026, a hands-on event for security practitioners to collaboratively build open-source agentic AI tools, skills, and MCP servers. The goal is to move AI security automation out of isolated efforts and into shared tooling for collective defense.","briefOverview":"\u003cp\u003eTenable is hosting Swarm, a hands-on agentic AI build event at Black Hat USA 2026 from Aug. 4-6. The event is sponsored by AWS and presented with support from Anthropic, whose technical staff will serve on the judging panel and provide coaching. Security practitioners are invited to collaborate on open-source AI security agents, skills, model context protocol servers, and playbooks.\u003c/p\u003e\n\n\u003cp\u003eThe article says agentic AI use is expanding rapidly, citing Gartner’s forecast that an average global Fortune 500 enterprise will have more than 150,000 AI agents in use by 2028, up from fewer than 15 in 2025. Tenable argues that security teams are already using agents to triage alerts, hunt threats, and automate work that previously took days. However, it says much of this work is happening in isolation, causing teams to solve the same problems separately instead of sharing results.\u003c/p\u003e\n\n\u003cp\u003eExamples in the article include an agent-powered n8n workflow for phishing email analysis, Tenable’s SOC-Hunter Claude Code skill for threat hunting, and a partner’s AI Analyst skills backed by MCP servers for SOC work. Tenable says these tools can reduce manual review, compress threat hunting from four to six hours to 45 to 90 minutes, and let analysts use plain-language prompts for tasks such as triage, detections, and automation. Swarm is positioned as a way for practitioners to build reusable open-source tools for workflows including triage, remediation, orchestration, and executive reporting.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Tenable is hosting Swarm, a hands-on agentic AI build event at Black Hat USA 2026 sponsored by AWS and presented with support from Anthropic.","The event is intended for security practitioners to collaborate on open-source AI security agents, MCP servers, skills, and playbooks for workflows such as triage, remediation, orchestration, and executive reporting.","The article says security teams are already building agentic AI tools to reduce manual work in areas such as phishing email triage, proactive threat hunting, alert triage, detection writing, and security automation.","Tenable argues that many practitioners currently build agentic AI tools in isolation, causing teams to duplicate work and miss the benefits of shared results.","The article cites Gartner as saying that by 2028 an average global Fortune 500 enterprise will have more than 150,000 AI agents in use, up from fewer than 15 in 2025."],"insights":["The article frames agent sprawl as a near-term security operations issue, citing Gartner’s forecast that Fortune 500 enterprises will grow from fewer than 15 AI agents in 2025 to more than 150,000 by 2028.","Tenable’s examples suggest that agentic AI tools are already being used to compress security work from hours into minutes, including reducing proactive threat hunting from four to six hours to 45 to 90 minutes.","The article emphasizes that some agentic AI security tools are being designed so analysts can drive senior-level tasks through plain-language prompts rather than specialized expertise.","Swarm is positioned not just as a conference activity but as an attempt to turn isolated security automation work into reusable open-source agents, skills, MCP servers, and playbooks shared across practitioners."],"referencedReports":[{"title":"Gartner Identifies Six Steps to Manage AI Agent Sprawl","url":"https://www.gartner.com/en/newsroom/press-releases/2026-04-28-gartner-identifies-six-steps-to-manage-artificial-intelligence-agent-sprawl","publisher":"Gartner","context":"The article cites this Gartner press release for the forecast that an average global Fortune 500 enterprise will have more than 150,000 AI agents in use by 2028.","category":"news","primary":true},{"title":"2026 SANS AI Survey Insights","url":"https://www.sans.org/white-papers/2026-sans-ai-survey-insights","publisher":"SANS","context":"The article cites this survey for the finding that only 27% of security practitioners believe their agentic AI deployments are mature.","category":"research","primary":false}],"body":"\u003cp\u003eTenable is hosting Swarm, a hands-on agentic AI build event at Black Hat USA 2026 from Aug. 4-6. The event is sponsored by AWS and presented with support from Anthropic, whose technical staff will serve on the judging panel and provide coaching. Security practitioners are invited to collaborate on open-source AI security agents, skills, model context protocol servers, and playbooks.\u003c/p\u003e\n\n\u003cp\u003eThe article says agentic AI use is expanding rapidly, citing Gartner’s forecast that an average global Fortune 500 enterprise will have more than 150,000 AI agents in use by 2028, up from fewer than 15 in 2025. Tenable argues that security teams are already using agents to triage alerts, hunt threats, and automate work that previously took days. However, it says much of this work is happening in isolation, causing teams to solve the same problems separately instead of sharing results.\u003c/p\u003e\n\n\u003cp\u003eExamples in the article include an agent-powered n8n workflow for phishing email analysis, Tenable’s SOC-Hunter Claude Code skill for threat hunting, and a partner’s AI Analyst skills backed by MCP servers for SOC work. Tenable says these tools can reduce manual review, compress threat hunting from four to six hours to 45 to 90 minutes, and let analysts use plain-language prompts for tasks such as triage, detections, and automation. Swarm is positioned as a way for practitioners to build reusable open-source tools for workflows including triage, remediation, orchestration, and executive reporting.\u003c/p\u003e\n"}]</script>
