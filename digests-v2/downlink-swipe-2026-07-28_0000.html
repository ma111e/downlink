future hardware."],"referencedReports":[{"title":"BMC Exposure Alert","url":"https://lavahq.io/research/bmc-exposure-alert","publisher":"Lava","context":"The article relies on Lava researchers' findings about internet-exposed BMCs leaking password-derived authentication material and cites their research page for details on exposure and impact.","category":"research","primary":true}],"body":"\u003cp\u003eMore than 24,000 internet-exposed servers are leaking authentication password hashes through their Baseboard Management Controller interfaces because of CVE-2013-4786. The issue affects IPMI 2.0 authentication and is rooted in a protocol introduced in 2004. Lava researchers found 36,872 publicly accessible IPMI services on UDP port 623, with 24,650 exposing password-derived authentication material that could be used for offline password-cracking attacks.\u003c/p\u003e\n\n\u003cp\u003eBMCs let administrators remotely manage servers independently of the operating system, including powering systems on or off, updating firmware, and mounting virtual media. Access to these interfaces can let attackers control physical servers, change low-level configurations, apply malicious firmware updates, and compromise systems at a layer not monitored by security tools. Lava warned that recovered credentials may work across multiple management interfaces in the same environment and that one compromised BMC could become a pivot point into the broader management plane.\u003c/p\u003e\n\n\u003cp\u003eLava said 6,240 hosts accepted an empty username during authentication and that later testing confirmed weak passwords, while 2,340 instances used weak administrator passwords matching public dictionaries. A live exposure map seen by BleepingComputer showed the United States with 39% of the vulnerable servers. The researchers recommended keeping IPMI and Redfish off the public internet, rotating factory BMC passwords, restricting access to isolated management networks, and turning off legacy IPMI authentication.\u003c/p\u003e\n"},{"n":16,"title":"24,650 Internet-Exposed BMCs Disclose IPMI Password Hashes Before Login","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/24650-internet-exposed-bmcs-disclose.html","time":"14:41","priority":"SHOULD READ","score":85,"tldr":"Researchers found 24,650 internet-exposed BMC/IPMI interfaces leaking password-derived hashes before login due to a long-known IPMI 2.0 flaw, enabling attackers to crack weak or factory passwords offline. Organizations should remove BMCs from the public internet, block UDP 623, and rotate default credentials.","briefOverview":"\u003cp\u003eCybersecurity researchers reported that 36,872 internet-exposed server-management interfaces are running IPMI, and 24,650 of them disclose password-derived authentication hashes before login. The issue is tied to CVE-2013-4786, a high-severity information disclosure flaw in the IPMI v2.0 specification. Dell has described the problem as inherent to the IPMI v2.0 specification and said there is no patch.\u003c/p\u003e\n\n\u003cp\u003eThe exposed systems include modern Supermicro and HPE servers operated by GPU providers, with some still using factory-issued passwords. Lava said more than 30% of returned hashes were associated with passwords recoverable using common wordlists and predictable factory chassis-sticker formats. In its tests, HPE iLO factory passwords were recoverable within a minute using modern GPU hardware, while Supermicro factory passwords were recoverable in about one hour.\u003c/p\u003e\n\n\u003cp\u003eBMCs are embedded server-management processors that control functions such as power, firmware, remote console access, operating system installation, and recovery. Because they run independently of the host operating system, a compromised exposed BMC can bypass traditional security controls, survive operating system reinstalls, and maintain access. Recommended mitigations include blocking UDP port 623, rotating factory-issued passwords, disabling weak legacy options, restricting BMC access to private management networks, and applying network access controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found 36,872 internet-exposed server-management interfaces running IPMI, with 24,650 disclosing password-derived authentication hashes before login.","The exposure stems from CVE-2013-4786, an information disclosure flaw in the IPMI v2.0 specification that allows remote attackers to obtain HMAC data from a BMC and conduct offline password guessing attacks.","Lava reported that more than 30% of returned hashes were tied to passwords recoverable with common wordlists and predictable factory chassis-sticker formats, including affected modern Supermicro and HPE servers operated by GPU providers.","As of May 6, 2026, more than 14,000 of the exposed IPMI hosts were located in the United States, with additional concentrations in Germany, China, the Netherlands, and the United Kingdom.","Recommended mitigations include blocking UDP port 623 at the network edge, rotating factory-issued passwords during provisioning, disabling legacy or weak IPMI options, restricting BMC access to private management networks, and applying network access controls."],"insights":["The flaw has no patch because Dell describes it as an inherent problem in the IPMI v2.0 specification, making exposure reduction and credential hygiene the practical defenses.","Factory-issued BMC passwords remain a major risk even when they are unique, as Lava said HPE iLO factory passwords were recoverable within a minute and Supermicro factory passwords in about one hour using modern GPU hardware.","Offline cracking makes the exposure especially dangerous because attackers do not need repeated login attempts against the BMC for each password guess, reducing reliance on visible failed-login activity.","The risk has grown since CVE-2013-4786 was identified because GPU cracking has become faster and AI and bare-metal environments make each exposed server more valuable.","A compromised BMC can persist below normal operating-system security controls and survive operating system reinstalls, making public BMC exposure more serious than a typical exposed management login."],"referencedReports":[{"title":"BMC Exposure Alert","url":"https://lavahq.io/research/bmc-exposure-alert","publisher":"Lava","context":"The article says Lava shared a new report finding that 24,650 internet-exposed IPMI interfaces disclose password-derived authentication hashes before login.","category":"research","primary":true},{"title":"Data Domain: IPMI v2.0 Password Hash Disclosure","url":"https://www.dell.com/support/kbdoc/en-us/000222162/data-domain-ipmi-v2-0-password-hash-disclosure","publisher":"Dell","context":"The article cites a Dell advisory stating that the issue is inherent to the IPMI v2.0 specification and has no patch.","category":"advisory","primary":false}],"body":"\u003cp\u003eCybersecurity researchers reported that 36,872 internet-exposed server-management interfaces are running IPMI, and 24,650 of them disclose password-derived authentication hashes before login. The issue is tied to CVE-2013-4786, a high-severity information disclosure flaw in the IPMI v2.0 specification. Dell has described the problem as inherent to the IPMI v2.0 specification and said there is no patch.\u003c/p\u003e\n\n\u003cp\u003eThe exposed systems include modern Supermicro and HPE servers operated by GPU providers, with some still using factory-issued passwords. Lava said more than 30% of returned hashes were associated with passwords recoverable using common wordlists and predictable factory chassis-sticker formats. In its tests, HPE iLO factory passwords were recoverable within a minute using modern GPU hardware, while Supermicro factory passwords were recoverable in about one hour.\u003c/p\u003e\n\n\u003cp\u003eBMCs are embedded server-management processors that control functions such as power, firmware, remote console access, operating system installation, and recovery. Because they run independently of the host operating system, a compromised exposed BMC can bypass traditional security controls, survive operating system reinstalls, and maintain access. Recommended mitigations include blocking UDP port 623, rotating factory-issued passwords, disabling weak legacy options, restricting BMC access to private management networks, and applying network access controls.\u003c/p\u003e\n"},{"n":6,"title":"CubePilot drone software dev hit by DNS hijacking to intercept traffic","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cubepilot-drone-software-dev-hit-by-dns-hijacking-to-intercept-traffic/","time":"21:17","priority":"SHOULD READ","score":82,"tldr":"CubePilot says a DNS hijacking attack on cubepilot.org let attackers intercept traffic and obtain valid TLS certificates for all subdomains, potentially capturing credentials entered on July 24. The company has regained control, revoked the certificates, taken key services offline, and warned users to change reused passwords and avoid firmware downloaded July 24–25 until verified.","briefOverview":"\u003cp\u003eCubePilot, an Australian firm that designs flight controllers for drones, announced a severe operational disruption caused by a DNS hijacking attack. The company said an attacker gained control of the cubepilot.org domain DNS settings on July 24, allowing traffic intended for internal systems to be intercepted. The attacker also obtained TLS certificates covering all cubepilot.org subdomains, so users may have seen valid HTTPS connections while reaching attacker-controlled infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCubePilot warned that credentials entered on any of its services on July 24, including the portal and forum, may have been captured, and urged users to change reused passwords elsewhere. The company said it regained control of its domains on July 24, revoked the fraudulently issued certificates, preserved evidence, notified relevant providers, and reported the incident to the Australian Cyber Security Centre and law enforcement. OEM services, the community forum, the documentation portal, and the ERP portal are offline while the investigation continues.\u003c/p\u003e\n\n\u003cp\u003eCubePilot’s hardware is used in UAVs for surveying, search and rescue, agriculture, and defense and government applications. The company is evaluating the integrity of published firmware images and advised users not to flash images downloaded on July 24-25 until safety checks are completed. Firmware obtained before July 24 is currently considered safe, and clients were advised to confirm any payment requests claiming to be from CubePilot by phone with their usual contact.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CubePilot announced a severe operational disruption after an attacker gained control of the cubepilot.org domain DNS settings on July 24.","The attacker obtained TLS certificates covering all cubepilot.org subdomains, so credentials entered on CubePilot services on July 24 may have been captured.","CubePilot said it regained control of its domains on July 24, revoked the fraudulently issued certificates, preserved evidence, notified relevant providers, and reported the incident to the Australian Cyber Security Centre and law enforcement.","CubePilot has taken OEM services, the community forum, the documentation portal, and its ERP portal offline while the investigation continues.","CubePilot is evaluating the integrity of published firmware images and advised users not to flash images downloaded on July 24-25 until safety checks are completed."],"insights":["Because the attacker obtained certificates for every cubepilot.org subdomain, users could have seen normal-looking secure web connections while being sent to attacker-controlled systems.","CubePilot’s warning covers credentials entered on any of its services on July 24, including both the portal and the forum, making password reuse on other sites an immediate risk.","CubePilot singled out firmware downloaded on July 24-25 as needing verification before use, while firmware obtained before July 24 is currently considered safe.","CubePilot advised customers to confirm payment requests by phone with their usual contact, indicating the incident could also be used to support fraudulent payment attempts."],"referencedReports":[{"title":"CubePilot Security Notice","url":"https://cubepilot.com/security-notice/","publisher":"CubePilot","context":"The article cites CubePilot’s security notice as the source for details that attackers obtained certificates for all cubepilot.org subdomains and may have captured credentials entered on July 24.","category":"advisory","primary":true}],"body":"\u003cp\u003eCubePilot, an Australian firm that designs flight controllers for drones, announced a severe operational disruption caused by a DNS hijacking attack. The company said an attacker gained control of the cubepilot.org domain DNS settings on July 24, allowing traffic intended for internal systems to be intercepted. The attacker also obtained TLS certificates covering all cubepilot.org subdomains, so users may have seen valid HTTPS connections while reaching attacker-controlled infrastructure.\u003c/p\u003e\n\n\u003cp\u003eCubePilot warned that credentials entered on any of its services on July 24, including the portal and forum, may have been captured, and urged users to change reused passwords elsewhere. The company said it regained control of its domains on July 24, revoked the fraudulently issued certificates, preserved evidence, notified relevant providers, and reported the incident to the Australian Cyber Security Centre and law enforcement. OEM services, the community forum, the documentation portal, and the ERP portal are offline while the investigation continues.\u003c/p\u003e\n\n\u003cp\u003eCubePilot’s hardware is used in UAVs for surveying, search and rescue, agriculture, and defense and government applications. The company is evaluating the integrity of published firmware images and advised users not to flash images downloaded on July 24-25 until safety checks are completed. Firmware obtained before July 24 is currently considered safe, and clients were advised to confirm any payment requests claiming to be from CubePilot by phone with their usual contact.\u003c/p\u003e\n"},{"n":8,"title":"India’s Bank of Baroda confirms cyber incident after hackers claim data theft","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/india-bank-of-baroda-reports-cybersecurity-incident","time":"14:45","priority":"SHOULD READ","score":82,"tldr":"Bank of Baroda confirmed a cyber incident involving a compromised employee email account after hackers claimed to have stolen and leaked sensitive banking data. The bank said its core banking systems were not affected, but it has not confirmed whether customer data was exfiltrated.","briefOverview":"\u003cp\u003eBank of Baroda, one of India’s largest state-owned banks, confirmed a cybersecurity incident after a threat actor claimed to have stolen and published sensitive banking data. The bank said an employee’s email account was compromised, allowing unauthorized access to “certain data.” It said the incident was detected and contained immediately, and that its core banking systems were not accessed or affected.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure followed claims by cybersecurity researchers tracking dark web activity that an unidentified hacker had breached the bank and leaked customer information, corporate banking records, internal emails, loan documents and audit files on a darknet forum. The authenticity of the purportedly leaked data could not be independently verified. Bank of Baroda did not comment on the hackers’ claims, say whether customer data had been exfiltrated, or attribute the incident to any specific hacking group.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the threat actor, using the name “leak-king-F,” advertised the data for sale on a darknet marketplace and directed prospective buyers to a Telegram channel. The article places the incident among recent cyber incidents affecting major financial institutions and companies across Asia. It also cites recent data theft claims involving Thailand Securities Depository, contractors for India’s Kudankulam nuclear power project, and Tata Electronics.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bank of Baroda said an employee's email account was compromised, allowing unauthorized access to certain data.","The bank said it detected and contained the incident immediately and that its core banking systems were not accessed or affected.","Cybersecurity researchers reported that an unidentified hacker claimed to have breached the bank and leaked customer information, corporate banking records, internal emails, loan documents and audit files on a darknet forum.","Bank of Baroda did not comment on the hackers' claims, did not say whether customer data was exfiltrated, and did not attribute the incident to any specific hacking group.","Researchers said the threat actor using the name \"leak-king-F\" advertised the data for sale on a darknet marketplace and directed prospective buyers to a Telegram channel."],"insights":["The bank’s confirmation is narrower than the hackers’ claims: it acknowledges a compromised employee email account and access to “certain data,” but does not confirm the broader alleged leak of customer records, loan documents, audit files, and internal emails.","Bank of Baroda emphasized that its core banking systems were not accessed or affected, mirroring similar statements in the Thailand Securities Depository incident where key trading, settlement, and depository systems were also said to be unaffected.","The alleged data sale involved both a darknet marketplace and a Telegram channel, showing that the reported actor used multiple channels to advertise and route prospective buyers.","The incident is part of a wider cluster of recent cyber claims affecting major Asian financial and industrial organizations, including Thailand Securities Depository, India’s Kudankulam nuclear power project contractors, and Tata Electronics."],"referencedReports":[],"body":"\u003cp\u003eBank of Baroda, one of India’s largest state-owned banks, confirmed a cybersecurity incident after a threat actor claimed to have stolen and published sensitive banking data. The bank said an employee’s email account was compromised, allowing unauthorized access to “certain data.” It said the incident was detected and contained immediately, and that its core banking systems were not accessed or affected.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure followed claims by cybersecurity researchers tracking dark web activity that an unidentified hacker had breached the bank and leaked customer information, corporate banking records, internal emails, loan documents and audit files on a darknet forum. The authenticity of the purportedly leaked data could not be independently verified. Bank of Baroda did not comment on the hackers’ claims, say whether customer data had been exfiltrated, or attribute the incident to any specific hacking group.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the threat actor, using the name “leak-king-F,” advertised the data for sale on a darknet marketplace and directed prospective buyers to a Telegram channel. The article places the incident among recent cyber incidents affecting major financial institutions and companies across Asia. It also cites recent data theft claims involving Thailand Securities Depository, contractors for India’s Kudankulam nuclear power project, and Tata Electronics.\u003c/p\u003e\n"},{"n":10,"title":"Researcher Says AI Helped Develop Linux Traffic-Control Race Into Root Exploit","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-says-ai-helped-develop-linux.html","time":"08:04","priority":"SHOULD READ","score":82,"tldr":"STAR Labs published a working local root exploit for CVE-2026-53264, a Linux kernel traffic-control use-after-free race, with the researcher saying AI helped find and develop it. Exposure is limited by required kernel options, namespaces, and kernel-specific offsets, but affected systems should install distribution kernel fixes promptly.","briefOverview":"\u003cp\u003eSTAR Labs published a Linux kernel exploit that turns an ordinary local user into root on the CentOS Stream 9 build it targeted. The flaw is tracked as CVE-2026-53264 and is a use-after-free race in the kernel\u0026rsquo;s network traffic-control subsystem. Researcher Lee Jia Jie said AI helped him find the bug and speed up exploit development, including vulnerability discovery, a KASAN proof of concept, and race-window optimization.\u003c/p\u003e\n\n\u003cp\u003eThe issue is local privilege escalation, not remote code execution, so an attacker needs a foothold on the machine first. The demonstrated exploit also requires unprivileged user namespaces, CONFIG_NET_ACT_GACT and CONFIG_NET_CLS_FLOWER kernel options, and a kernel-specific ROP chain with hardcoded offsets. The exploit creates its own user and network namespaces, reaches the vulnerable path through a clsact qdisc and flower filter, and ultimately overwrites core_pattern to run a memfd-backed copy of itself as the root core-dump handler.\u003c/p\u003e\n\n\u003cp\u003eThe upstream fix landed on June 1, 2026, and has been backported to several stable kernel branches, with fixed releases listed across multiple Linux versions. The article says Linux users should install a distribution kernel carrying the fix rather than rely only on upstream version numbers. As of July 28, 2026, The Hacker News found no CISA Known Exploited Vulnerabilities entry and no official report of exploitation in the wild, while distribution status remained uneven across Debian, Ubuntu, and SUSE.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["STAR Labs published a Linux kernel exploit for CVE-2026-53264 that turns an ordinary local user into root on the targeted CentOS Stream 9 build.","The flaw is a use-after-free race in the Linux kernel's network traffic-control subsystem, and researcher Lee Jia Jie said AI helped with vulnerability discovery, a KASAN proof of concept, and race-window optimization.","The exploit requires a prior foothold on the machine, unprivileged user namespaces, CONFIG_NET_ACT_GACT and CONFIG_NET_CLS_FLOWER kernel options, and a kernel-specific ROP chain with hardcoded offsets.","The upstream fix landed on June 1, 2026, has been backported to several stable kernel branches, and users are advised to install a distribution kernel carrying the fix rather than rely on upstream version numbers alone.","As of July 28, 2026, The Hacker News found no CISA Known Exploited Vulnerabilities entry for the flaw and no official report of exploitation in the wild."],"insights":["The public exploit’s hardcoded kernel gadget offsets mean defenders should not treat the released code as universally portable, but compatible unpatched builds face greater urgency because the source is available.","The article cautions that Lee Jia Jie’s AI-assisted process is hard to evaluate as a benchmark because the model, prompts, service, and interaction record were not disclosed.","Distribution status was uneven as of July 28, 2026, so checking only the upstream Linux fixed versions is less useful than checking whether a specific distribution kernel package contains the backported fix.","The exploit gains namespace-local CAP_NET_ADMIN by creating its own user and network namespaces, making unprivileged user namespaces an important exposure condition for this flaw.","The patch credits Kyle Zeng as the reporter, while Lee Jia Jie said he independently found the flaw and later published the technical analysis and exploit code."],"referencedReports":[{"title":"When AI Makes 0-days Feel Like N-days","url":"https://starlabs.sg/blog/2026/07-when-ai-makes-0-days-feel-like-n-days/","publisher":"STAR Labs","context":"The article cites Lee Jia Jie’s technical write-up describing AI assistance in vulnerability discovery, KASAN proof-of-concept creation, and race-window optimization.","category":"research","primary":true},{"title":"CVE-2026-53264","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-53264","publisher":"Linux CNA","context":"The article references the Linux CNA record for vulnerable Linux kernel ranges and fixed releases.","category":"advisory","primary":false},{"title":"Debian Security Tracker: CVE-2026-53264","url":"https://security-tracker.debian.org/tracker/CVE-2026-53264","publisher":"Debian","context":"The article cites Debian’s tracker as showing fixed kernels for supported stable releases.","category":"advisory","primary":false},{"title":"Ubuntu Security: CVE-2026-53264","url":"https://ubuntu.com/security/CVE-2026-53264","publisher":"Ubuntu","context":"The article cites Ubuntu’s security page as still marking multiple maintained kernel packages vulnerable.","category":"advisory","primary":false},{"title":"SUSE Security CVE-2026-53264","url":"https://www.suse.com/security/cve/CVE-2026-53264.html","publisher":"SUSE","context":"The article cites SUSE’s CVE page as listing the issue as pending across multiple products and assigning a separate score.","category":"advisory","primary":false}],"body":"\u003cp\u003eSTAR Labs published a Linux kernel exploit that turns an ordinary local user into root on the CentOS Stream 9 build it targeted. The flaw is tracked as CVE-2026-53264 and is a use-after-free race in the kernel\u0026rsquo;s network traffic-control subsystem. Researcher Lee Jia Jie said AI helped him find the bug and speed up exploit development, including vulnerability discovery, a KASAN proof of concept, and race-window optimization.\u003c/p\u003e\n\n\u003cp\u003eThe issue is local privilege escalation, not remote code execution, so an attacker needs a foothold on the machine first. The demonstrated exploit also requires unprivileged user namespaces, CONFIG_NET_ACT_GACT and CONFIG_NET_CLS_FLOWER kernel options, and a kernel-specific ROP chain with hardcoded offsets. The exploit creates its own user and network namespaces, reaches the vulnerable path through a clsact qdisc and flower filter, and ultimately overwrites core_pattern to run a memfd-backed copy of itself as the root core-dump handler.\u003c/p\u003e\n\n\u003cp\u003eThe upstream fix landed on June 1, 2026, and has been backported to several stable kernel branches, with fixed releases listed across multiple Linux versions. The article says Linux users should install a distribution kernel carrying the fix rather than rely only on upstream version numbers. As of July 28, 2026, The Hacker News found no CISA Known Exploited Vulnerabilities entry and no official report of exploitation in the wild, while distribution status remained uneven across Debian, Ubuntu, and SUSE.\u003c/p\u003e\n"},{"n":9,"title":"Senate confirms Clayton as intel chief after delays","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/jay-clayton-confirmed-dni-senate","time":"23:18","priority":"SHOULD READ","score":78,"tldr":"The Senate confirmed Jay Clayton as director of national intelligence in a 51-47 party-line vote after a contentious process marked by concerns over political independence. He takes over amid major ODNI staffing cuts, the lapse of Section 702 surveillance authority, and budget pressures on the intelligence community.","briefOverview":"\u003cp\u003eThe Senate confirmed Jay Clayton as the next director of national intelligence in a 51-47 party-line vote. His confirmation followed a turbulent process in which President Donald Trump abruptly canceled his initial confirmation hearing. Clayton is currently the U.S. attorney for the Southern District of New York and previously chaired the Securities and Exchange Commission during the first Trump administration.\u003c/p\u003e\n\n\u003cp\u003eClayton will lead the Office of the Director of National Intelligence, which is meant to oversee and coordinate the country’s nearly 20 intelligence agencies. The organization has undergone major staff reductions under interim leadership, including a fresh 30 percent cut announced by Bill Pulte and a 40 percent cut claimed by former DNI Tulsi Gabbard. While ODNI staffing numbers are classified, the article says the reductions most likely leave the organization with fewer than 1,000 personnel.\u003c/p\u003e\n\n\u003cp\u003eDemocrats raised concerns during the confirmation process about Clayton’s repeated refusal to state that Joe Biden won the 2020 presidential election and questioned whether he would resist political pressure. Clayton takes office as the U.S. faces a global race with China over artificial intelligence, the prospect of foreign interference in upcoming elections, the lapse of Section 702 of the Foreign Intelligence Surveillance Act, and fiscal strain from the war with Iran. Senate Intelligence Committee Chairman Tom Cotton said Clayton pledged to work with the panel to secure intelligence funding and projected that about $40 billion would be needed for intelligence agencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Senate confirmed Jay Clayton as the next director of national intelligence in a 51-47 party-line vote after President Donald Trump had abruptly canceled his initial confirmation hearing.","Clayton will lead the Office of the Director of National Intelligence after interim chief Bill Pulte announced a fresh 30 percent personnel cut, following a 40 percent cut claimed by former DNI Tulsi Gabbard.","Democrats criticized Clayton during the confirmation process for repeatedly refusing to state that Joe Biden won the 2020 presidential election and questioned whether he would resist political pressure as the nation’s top intelligence official.","Clayton takes over as the United States faces a global race with China over artificial intelligence, possible foreign interference in upcoming elections, the lapse of Section 702 of the Foreign Intelligence Surveillance Act, and fiscal strain from the war with Iran.","Senate Intelligence Committee Chairman Tom Cotton said Clayton pledged to work with the panel to secure intelligence funding and projected that about $40 billion would be needed for U.S. intelligence agencies."],"insights":["ODNI may now have fewer than 1,000 personnel after successive claimed cuts of 40 percent and 30 percent, even though it is responsible for overseeing and coordinating nearly 20 intelligence agencies.","Clayton’s nomination initially drew some bipartisan praise, but his refusal to say Joe Biden won the 2020 election turned the confirmation process into a debate over whether he would resist political pressure.","A major intelligence-gathering authority, Section 702 of the Foreign Intelligence Surveillance Act, lapsed not because of a direct dispute over Clayton but after Democrats objected to Bill Pulte’s temporary appointment.","The article links Clayton’s first major leadership challenge to both reduced staffing and a possible need for about $40 billion in intelligence funding, creating simultaneous pressure to manage cuts and seek new resources."],"referencedReports":[],"body":"\u003cp\u003eThe Senate confirmed Jay Clayton as the next director of national intelligence in a 51-47 party-line vote. His confirmation followed a turbulent process in which President Donald Trump abruptly canceled his initial confirmation hearing. Clayton is currently the U.S. attorney for the Southern District of New York and previously chaired the Securities and Exchange Commission during the first Trump administration.\u003c/p\u003e\n\n\u003cp\u003eClayton will lead the Office of the Director of National Intelligence, which is meant to oversee and coordinate the country’s nearly 20 intelligence agencies. The organization has undergone major staff reductions under interim leadership, including a fresh 30 percent cut announced by Bill Pulte and a 40 percent cut claimed by former DNI Tulsi Gabbard. While ODNI staffing numbers are classified, the article says the reductions most likely leave the organization with fewer than 1,000 personnel.\u003c/p\u003e\n\n\u003cp\u003eDemocrats raised concerns during the confirmation process about Clayton’s repeated refusal to state that Joe Biden won the 2020 presidential election and questioned whether he would resist political pressure. Clayton takes office as the U.S. faces a global race with China over artificial intelligence, the prospect of foreign interference in upcoming elections, the lapse of Section 702 of the Foreign Intelligence Surveillance Act, and fiscal strain from the war with Iran. Senate Intelligence Committee Chairman Tom Cotton said Clayton pledged to work with the panel to secure intelligence funding and projected that about $40 billion would be needed for intelligence agencies.\u003c/p\u003e\n"},{"n":11,"title":"Claude AI Just Cracked a Post-Quantum Test Scheme and Found a Faster 7-Round AES Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/claude-ai-just-cracked-post-quantum.html","time":"18:59","priority":"SHOULD READ","score":78,"tldr":"Anthropic says Claude Mythos Preview found a practical key-recovery attack on the small HAWK-256 test parameter and a faster but still impractical attack on reduced-round AES-128. The findings do not affect production systems, but they show AI can help uncover meaningful cryptographic weaknesses while human verification remains a major bottleneck.","briefOverview":"\u003cp\u003eAnthropic says Claude Mythos Preview helped derive an end-to-end key-recovery attack against HAWK-256 and a 200- to 800-fold speedup for an attack on seven-round AES-128. The company published the findings with two technical papers and reproducibility artifacts. Anthropic said neither result affects production systems, because the HAWK recovery targets a smaller challenge parameter and the AES result applies only to seven of AES-128’s ten rounds while still requiring an impractical number of chosen plaintexts.\u003c/p\u003e\n\n\u003cp\u003eThe HAWK attack exploits a previously unused symmetry in the lattice behind the signature scheme. Anthropic’s released implementation targets only HAWK-256, rejects non-HAWK-256 inputs, and produces functionally equivalent signing material rather than the original secret-key seed. The company estimates the expected HAWK-256 key-recovery work factor falls from 2^64 to 2^38, while larger HAWK-512 and HAWK-1024 parameters remain impractical to attack.\u003c/p\u003e\n\n\u003cp\u003eThe AES result improves an existing meet-in-the-middle attack on seven-round AES-128 by removing a 256-way guessing step using an invariant fingerprint Anthropic calls the Möbius Bridge. Anthropic’s artifact includes experiments and component tests, but it does not execute a full seven-round AES-128 recovery from end to end. The company said the AI runs cost about $100,000 in API usage, while human verification remained a major bottleneck, with researchers spending several hundred hours checking the AES method.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic said Claude Mythos Preview helped derive an end-to-end key-recovery attack against HAWK-256 and a 200- to 800-fold speedup for an attack on seven-round AES-128.","The HAWK-256 attack exploits a previously unused symmetry in the lattice behind the signature scheme and has an expected end-to-end runtime of about three hours and 42 minutes on a 96-core server, according to Anthropic.","Anthropic said neither result affects production systems because HAWK-256 is a challenge parameter and the AES result applies only to seven of AES-128's ten rounds while requiring an impractical number of chosen plaintexts.","Anthropic's released HAWK implementation recovers functionally equivalent signing material for HAWK-256, verifies it by signing a message, and rejects every non-HAWK-256 input.","Anthropic said verification was a bottleneck, with two researchers spending nearly a month checking the AES method after the model generated roughly one billion output tokens."],"insights":["The HAWK result is narrower than the headline may suggest because Anthropic’s public recovery code only supports HAWK-256, a challenge parameter, and explicitly rejects HAWK-512 and HAWK-1024 inputs.","The HAWK attack does not need to recover the original secret-key seed; it produces different but functionally equivalent signing material that can still create signatures accepted by the public key.","The AES improvement was validated through component measurements and smaller-cipher experiments rather than a full end-to-end seven-round AES-128 key recovery run.","Anthropic emphasized that the main bottleneck was not model generation cost alone but human verification, with researchers spending several hundred hours checking the AES result.","The article shows that a model initially refused to pursue the AES work because it considered improvement impossible, and only continued after blunt human prompting pushed it to keep searching."],"referencedReports":[{"title":"Discovering cryptographic weaknesses","url":"https://www.anthropic.com/research/discovering-cryptographic-weaknesses","publisher":"Anthropic","context":"The article says Anthropic published the HAWK and AES findings alongside two technical papers and reproducibility artifacts.","category":"research","primary":true},{"title":"HAWK-n attack","url":"https://www.anthropic.com/document/hawk_key_recovery.pdf","publisher":"Anthropic","context":"The article references this paper as describing the HAWK attack that constructs a τ-cocycle lattice from the public key to recover signing material.","category":"research","primary":true},{"title":"AES Möbius Bridge paper","url":"https://www.anthropic.com/document/aes_mobius_bridge.pdf","publisher":"Anthropic","context":"The article says this paper presents the mathematical construction behind the faster seven-round AES-128 attack.","category":"research","primary":true},{"title":"Paper by Daniël van Gent and Ludo Pulles","url":"https://eprint.iacr.org/2025/928","publisher":"Daniël van Gent and Ludo Pulles","context":"The article says this paper showed that a nontrivial automorphism would reduce HAWK key recovery to finding a short vector in a lattice of roughly half the original dimension.","category":"research","primary":false},{"title":"CryptanalysisBench","url":"https://arxiv.org/abs/2607.18538","publisher":"ETH Zurich, Anthropic, University of Haifa, Technische Universität Berlin, and Tel Aviv University researchers","context":"The article references CryptanalysisBench as a 191-task benchmark that evaluated several models on cryptanalysis tasks.","category":"research","primary":false}],"body":"\u003cp\u003eAnthropic says Claude Mythos Preview helped derive an end-to-end key-recovery attack against HAWK-256 and a 200- to 800-fold speedup for an attack on seven-round AES-128. The company published the findings with two technical papers and reproducibility artifacts. Anthropic said neither result affects production systems, because the HAWK recovery targets a smaller challenge parameter and the AES result applies only to seven of AES-128’s ten rounds while still requiring an impractical number of chosen plaintexts.\u003c/p\u003e\n\n\u003cp\u003eThe HAWK attack exploits a previously unused symmetry in the lattice behind the signature scheme. Anthropic’s released implementation targets only HAWK-256, rejects non-HAWK-256 inputs, and produces functionally equivalent signing material rather than the original secret-key seed. The company estimates the expected HAWK-256 key-recovery work factor falls from 2^64 to 2^38, while larger HAWK-512 and HAWK-1024 parameters remain impractical to attack.\u003c/p\u003e\n\n\u003cp\u003eThe AES result improves an existing meet-in-the-middle attack on seven-round AES-128 by removing a 256-way guessing step using an invariant fingerprint Anthropic calls the Möbius Bridge. Anthropic’s artifact includes experiments and component tests, but it does not execute a full seven-round AES-128 recovery from end to end. The company said the AI runs cost about $100,000 in API usage, while human verification remained a major bottleneck, with researchers spending several hundred hours checking the AES method.\u003c/p\u003e\n"},{"n":14,"title":"Tengu Botnet Reboots Compromised Linux Devices When Defenders Kill Its Process","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/tengu-botnet-reboots-compromised-linux.html","time":"15:01","priority":"SHOULD READ","score":78,"tldr":"Nozomi researchers analyzed Tengu, a Mirai-derived Linux botnet that uses Telnet brute force and unusual self-defense mechanisms, including abusing hardware watchdogs to reboot devices when its process is killed so persistence can relaunch it. Defenders should remove exposed Telnet/admin services, change default credentials, update firmware, and thoroughly check persistence locations before returning devices to service.","briefOverview":"\u003cp\u003eNozomi Networks Labs analyzed Tengu, a Mirai-derived botnet that targets compromised Linux devices and can trigger a reboot when defenders kill its main process. Nozomi observed the dropper reaching its honeypots through Telnet credential brute force. The report does not identify a specific vendor, device model, operator, infection count, or real-world DDoS victims.\u003c/p\u003e\n\n\u003cp\u003eTengu supports 25 distributed denial-of-service methods and can also run a SOCKS5 proxy, execute shell commands, collect system and network data, update itself, and retrieve additional ELF or APK payloads. Its persistence and self-defense features include a detached guardian process, fake systemd service creation, init and RC scripts, shell startup file changes, immutable file marking, and a cron-based routine that Nozomi said appears unfinished or broken. It can also abuse a device’s hardware watchdog by sending keepalive signals only while the main malware process is alive, allowing the device to reboot if that process is killed.\u003c/p\u003e\n\n\u003cp\u003eThe analyzed sample was configured to communicate with a command-and-control server at 64[.]89.163.8 over TCP port 9931, and it could obtain additional payloads through an IPFS gateway on the same server. URLhaus independently recorded 17 malware URLs at that IP address beginning June 17, 2026, including a shell script, multiple ELF files tagged as Mirai, and an APK, but those records did not identify the files as Tengu. Nozomi recommended removing internet exposure for Telnet and other unnecessary administrative services, replacing default credentials, updating firmware, segmenting IoT networks, and reviewing persistence locations before returning suspected devices to service.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nozomi Networks Labs analyzed Tengu, a Mirai-derived botnet that can use a compromised Linux device’s hardware watchdog to reboot the device when defenders kill its main process.","Nozomi observed the Tengu dropper reaching its honeypots through Telnet credential brute force, but the report did not identify a specific vendor, device model, operator, infection count, or real-world DDoS victims.","Tengu supports 25 distributed denial-of-service methods and can also run a SOCKS5 proxy, execute shell commands, collect system and network data, update itself, and retrieve additional ELF or APK payloads.","Tengu includes multiple persistence and self-defense mechanisms, including a detached guardian process, fake systemd service creation, init and RC scripts, shell startup file changes, immutable file marking, and interference with reboot and shutdown utilities.","The analyzed sample was configured to communicate with a command-and-control server at 64[.]89.163.8 over TCP port 9931, while URLhaus independently recorded malicious Mirai-related hosting at the same address beginning June 17, 2026."],"insights":["Killing Tengu’s main process can be counterproductive because the malware is designed to stop feeding the hardware watchdog, causing a reboot that gives its persistence mechanisms another chance to relaunch it.","Routine recovery steps may fail on infected devices because Tengu overwrites the ELF headers of hardcoded reboot and shutdown utilities, interfering with normal commands used to restart or safely power down the system.","Nozomi’s findings show Tengu’s capabilities, but not its real-world scale, since the report names no specific affected vendor, device model, operator, infection count, or confirmed DDoS victims.","Before returning a suspected device to service, defenders need to check several persistence locations beyond the malware binary itself, including systemd services, init scripts, shell startup files, and cron-related paths.","The URLhaus data confirms malicious Mirai-related hosting at the same IP address, but it does not prove that those files were Tengu because the listed hashes did not match Nozomi’s published sample hash."],"referencedReports":[{"title":"Tengu: A Modernized Mirai That Doesn’t Want to Leave","url":"https://www.nozominetworks.com/blog/tengu-a-modernized-mirai-that-doesnt-want-to-leave","publisher":"Nozomi Networks Labs","context":"The article says Nozomi Networks Labs published its analysis of Tengu and relies on that research for the malware’s capabilities and behavior.","category":"research","primary":true}],"body":"\u003cp\u003eNozomi Networks Labs analyzed Tengu, a Mirai-derived botnet that targets compromised Linux devices and can trigger a reboot when defenders kill its main process. Nozomi observed the dropper reaching its honeypots through Telnet credential brute force. The report does not identify a specific vendor, device model, operator, infection count, or real-world DDoS victims.\u003c/p\u003e\n\n\u003cp\u003eTengu supports 25 distributed denial-of-service methods and can also run a SOCKS5 proxy, execute shell commands, collect system and network data, update itself, and retrieve additional ELF or APK payloads. Its persistence and self-defense features include a detached guardian process, fake systemd service creation, init and RC scripts, shell startup file changes, immutable file marking, and a cron-based routine that Nozomi said appears unfinished or broken. It can also abuse a device’s hardware watchdog by sending keepalive signals only while the main malware process is alive, allowing the device to reboot if that process is killed.\u003c/p\u003e\n\n\u003cp\u003eThe analyzed sample was configured to communicate with a command-and-control server at 64[.]89.163.8 over TCP port 9931, and it could obtain additional payloads through an IPFS gateway on the same server. URLhaus independently recorded 17 malware URLs at that IP address beginning June 17, 2026, including a shell script, multiple ELF files tagged as Mirai, and an APK, but those records did not identify the files as Tengu. Nozomi recommended removing internet exposure for Telnet and other unnecessary administrative services, replacing default credentials, updating firmware, segmenting IoT networks, and reviewing persistence locations before returning suspected devices to service.\u003c/p\u003e\n"},{"n":20,"title":"A Real Vendor RFQ, a Fake Google Login Page","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/authenticated-vendor-rfq-google-sites-credential-laundering","time":"11:00","priority":"MAY READ","score":72,"tldr":"A compromised real vendor mailbox sent a legitimate-looking RFQ that passed SPF, DKIM, and DMARC, but its spreadsheet link redirected through a new throwaway domain to a fake Google login for credential theft. The key takeaway is that email authentication and URL reputation alone can miss trusted-infrastructure phishing, while behavioral checks like link-destination mismatch and redirect analysis can catch it.","briefOverview":"\u003cp\u003eA request-for-quote email arrived from a real industrial-equipment vendor whose own account had been compromised. The message passed SPF, DKIM, and DMARC, with a Microsoft compauth score of 100, because it genuinely came from the vendor’s mailbox. It targeted a VP recipient and presented a link labeled “Agreement Terms.xlsx” as if it were a contract-terms spreadsheet from SharePoint.\u003c/p\u003e\n\n\u003cp\u003eThe visible filename did not match the actual destination, which pointed to \u003ccode\u003ejinqyemetals[.]com/home\u003c/code\u003e, a domain unrelated to the vendor, recipient, or SharePoint. That domain had been registered on October 31, 2025 and acted as a disposable first hop in a redirect chain. The link triggered three consecutive 302 redirects that ended at a Google Sites page and a Google sign-in flow staged to harvest credentials.\u003c/p\u003e\n\n\u003cp\u003eA per-URL reputation scan rated the malicious link as clean, while Themis flagged the message at 59 percent as credential theft against a VIP recipient. The article says the score was moderate because genuine authentication, a real business sender, and other reputational signals made the message ambiguous. The email was quarantined before any password was entered, and the article’s takeaway is that authentication and reputation checks alone do not answer whether a message should be trusted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An RFQ email came from a real industrial-equipment vendor’s compromised mailbox and passed SPF, DKIM, and DMARC checks with a Microsoft compauth score of 100.","The message displayed a link as “Agreement Terms.xlsx,” but the underlying href pointed to jinqyemetals[.]com/home, a domain unrelated to the vendor, recipient, or SharePoint.","The jinqyemetals[.]com domain was registered on October 31, 2025 and served as the first hop in a redirect chain rather than a mature business site.","The link triggered three consecutive 302 redirects that ended at a Google Sites page and a Google sign-in flow staged to harvest credentials.","Themis flagged the message at 59 percent as credential theft against a VIP recipient and quarantined it before any password was entered."],"insights":["Passing SPF, DKIM, and DMARC did not indicate the message was safe, because those checks only showed the compromised vendor mailbox was authorized to send email.","The per-URL reputation scan rated the malicious link clean because it judged the first-hop domain in isolation and did not account for the full redirect path to the credential-harvest page.","The visible filename-to-destination mismatch was a critical signal, because the email’s apparent spreadsheet label did not match the unrelated href beneath it.","The article highlights that trusted infrastructure can launder risk at both ends of an attack: the sender was a real vendor mailbox and the final login surface used Google-hosted services.","The moderate 59 percent Themis score reflected the attack’s ambiguity, where legitimate authentication and a real sender reduced suspicion while behavioral signals such as redirects, a new intermediary domain, and a login-page destination raised it."],"referencedReports":[{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article cites it as documenting attackers’ migration toward abusing legitimate cloud and collaboration services as delivery and hosting infrastructure.","category":"research","primary":false},{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites its statistics on credentials appearing in breach kill chains and phishing as an initial access vector.","category":"research","primary":false},{"title":"2024 Internet Crime Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI","context":"The article cites it as ranking phishing as the most-reported cybercrime by complaint volume.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references it to emphasize that email authentication proves authorization to send, not whether a message should be trusted.","category":"guide","primary":false}],"body":"\u003cp\u003eA request-for-quote email arrived from a real industrial-equipment vendor whose own account had been compromised. The message passed SPF, DKIM, and DMARC, with a Microsoft compauth score of 100, because it genuinely came from the vendor’s mailbox. It targeted a VP recipient and presented a link labeled “Agreement Terms.xlsx” as if it were a contract-terms spreadsheet from SharePoint.\u003c/p\u003e\n\n\u003cp\u003eThe visible filename did not match the actual destination, which pointed to \u003ccode\u003ejinqyemetals[.]com/home\u003c/code\u003e, a domain unrelated to the vendor, recipient, or SharePoint. That domain had been registered on October 31, 2025 and acted as a disposable first hop in a redirect chain. The link triggered three consecutive 302 redirects that ended at a Google Sites page and a Google sign-in flow staged to harvest credentials.\u003c/p\u003e\n\n\u003cp\u003eA per-URL reputation scan rated the malicious link as clean, while Themis flagged the message at 59 percent as credential theft against a VIP recipient. The article says the score was moderate because genuine authentication, a real business sender, and other reputational signals made the message ambiguous. The email was quarantined before any password was entered, and the article’s takeaway is that authentication and reputation checks alone do not answer whether a message should be trusted.\u003c/p\u003e\n"},{"n":18,"title":"Microsoft Says New Cybersecurity AI Model Helps MDASH Hit 95.95% at Half the Cost","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/microsoft-says-new-cybersecurity-ai.html","time":"06:07","priority":"MAY READ","score":65,"tldr":"Microsoft launched MAI-Cyber-1-Flash inside its MDASH vulnerability-remediation system, claiming MDASH reaches 95.95% on CyberGym at about half the cost by routing most tasks to the smaller security model and the hardest ones to GPT-5.4. The score is a system-level benchmark result, not a standalone model score, and key cost and leaderboard details remain independently unverified.","briefOverview":"\u003cp\u003eMicrosoft has launched MAI-Cyber-1-Flash, its first cybersecurity-specific model inside MDASH, the company’s multi-model vulnerability identification and remediation harness. Microsoft says MDASH running MAI-Cyber-1-Flash with GPT-5.4 scored 95.95% on CyberGym. The company also says this configuration costs 50% less than its current best MDASH combination of GPT-5.4, GPT-5.4 mini, and GPT-5.3 Codex.\u003c/p\u003e\n\n\u003cp\u003eMAI-Cyber-1-Flash is designed to handle up to 90% of MDASH tasks, while GPT-5.4 is reserved for the hardest 10%. The model is available only inside MDASH through an Azure AI Foundry private preview for approved customers, not as a standalone public model or general-purpose API. The article emphasizes that the headline CyberGym score belongs to the MDASH system using both MAI-Cyber-1-Flash and GPT-5.4, not to the new model by itself.\u003c/p\u003e\n\n\u003cp\u003eCyberGym Level 1 tests whether an agent can reproduce a known vulnerability from a description and unpatched source code, but it does not measure blind vulnerability discovery or whether a generated patch is correct. Microsoft’s 95.95% result was not listed on CyberGym’s public leaderboard when checked on July 28, 2026, and the article says the cost claim cannot yet be independently reproduced because Microsoft did not disclose token use, call volume, latency, task mix, or compute allocation. The model card describes MAI-Cyber-1-Flash as a sparse mixture-of-experts transformer with 137 billion total parameters, five billion active parameters, and a 256,000-token context window.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft launched MAI-Cyber-1-Flash, its first cybersecurity-specific model inside MDASH, its multi-model vulnerability identification and remediation harness.","Microsoft says MDASH using MAI-Cyber-1-Flash and GPT-5.4 scored 95.95% on CyberGym and costs 50% less than its current best MDASH combination of GPT-5.4, GPT-5.4 mini, and GPT-5.3 Codex.","MAI-Cyber-1-Flash is designed to handle up to 90% of MDASH tasks, with GPT-5.4 reserved for the hardest 10%, and it is available only inside MDASH through an Azure AI Foundry private preview for approved customers.","The reported 95.95% CyberGym score belongs to MDASH running MAI-Cyber-1-Flash alongside GPT-5.4, not to MAI-Cyber-1-Flash by itself.","CyberGym Level 1 tests whether an agent can reproduce a known vulnerability from a description and unpatched source code, but it does not measure blind vulnerability discovery or whether a generated patch is correct."],"insights":["Microsoft’s headline benchmark is not directly comparable with its earlier 96.55% MDASH result because the earlier score counted any crash, including non-target vulnerabilities, while the July materials do not say whether the 95.95% result used the same criterion.","The reported 95.95% result was not listed on CyberGym’s public leaderboard when checked on July 28, 2026, so the article treats Microsoft’s claim as not publicly leaderboard-verified at that time.","The 50% cost-saving claim cannot be independently reproduced from the disclosed materials because Microsoft did not publish the token use, call volume, latency, task mix, or compute allocation behind the comparison.","The model’s zero scores across ExploitGym’s kernel, userspace, and browser categories show that its disclosed benchmark strengths do not extend to turning supplied vulnerabilities and crashes into working code-execution exploits under that test.","The article distinguishes two different Microsoft claims that could be confused: replacing 80% of MDASH’s existing models is not the same as MAI-Cyber-1-Flash handling up to 90% of MDASH tasks."],"referencedReports":[{"title":"MAI-Cyber-1-Flash Model Card","url":"https://microsoft.ai/pdf/MAI-Cyber-1-Flash-Model-Card.pdf","publisher":"Microsoft","context":"The article cites Microsoft’s model card for MAI-Cyber-1-Flash to describe the model architecture, benchmark results, testing environment, and limitations.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft has launched MAI-Cyber-1-Flash, its first cybersecurity-specific model inside MDASH, the company’s multi-model vulnerability identification and remediation harness. Microsoft says MDASH running MAI-Cyber-1-Flash with GPT-5.4 scored 95.95% on CyberGym. The company also says this configuration costs 50% less than its current best MDASH combination of GPT-5.4, GPT-5.4 mini, and GPT-5.3 Codex.\u003c/p\u003e\n\n\u003cp\u003eMAI-Cyber-1-Flash is designed to handle up to 90% of MDASH tasks, while GPT-5.4 is reserved for the hardest 10%. The model is available only inside MDASH through an Azure AI Foundry private preview for approved customers, not as a standalone public model or general-purpose API. The article emphasizes that the headline CyberGym score belongs to the MDASH system using both MAI-Cyber-1-Flash and GPT-5.4, not to the new model by itself.\u003c/p\u003e\n\n\u003cp\u003eCyberGym Level 1 tests whether an agent can reproduce a known vulnerability from a description and unpatched source code, but it does not measure blind vulnerability discovery or whether a generated patch is correct. Microsoft’s 95.95% result was not listed on CyberGym’s public leaderboard when checked on July 28, 2026, and the article says the cost claim cannot yet be independently reproduced because Microsoft did not disclose token use, call volume, latency, task mix, or compute allocation. The model card describes MAI-Cyber-1-Flash as a sparse mixture-of-experts transformer with 137 billion total parameters, five billion active parameters, and a 256,000-token context window.\u003c/p\u003e\n"},{"n":21,"title":"Beyond Shadow AI: The Netskope AI Report","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/beyond-shadow-ai-the-netskope-ai-report","time":"04:15","priority":"MAY READ","score":60,"tldr":"Netskope’s 2026 AI report says enterprise AI risk is shifting from users leaking data in prompts to architectural issues such as MCP-connected systems exposing unauthorized internal data, agentic coding tools creating code-execution paths, and attackers weaponizing AI-related developer supply chains.","briefOverview":"\u003cp\u003eNetskope published its latest AI report, covering analysis from June 2025 through July 2026. The report says security risks have shifted significantly since the prior report. It highlights architectural changes behind that shift and focuses on downstream policy violations, agentic coding apps, and the AI supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe report says downstream policy violations are now the primary architectural risk, rather than upstream data leakage from users pasting sensitive data into prompts. Netskope observed a fourfold increase in Model Context Protocol traffic in the past 10 weeks. The article says MCP bridges internal data stores with external models, creating a direct path for AI services to return sensitive data that users or agents are not authorized to access.\u003c/p\u003e\n\n\u003cp\u003eNetskope also says agentic coding tools have created new execution vectors, with Claude Code and Codex adoption rising to 75% and 58% of organizations, respectively. The article says every agentic interaction is now a potential execution vector for malicious code. It also says attackers are weaponizing the AI supply chain through trojanized developer tools, fake AI installers, and attempts to trick AI apps into surfacing malicious code and links to malicious web resources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope published its latest AI report covering analysis from June 2025 through July 2026.","The report says downstream policy violations are now the primary architectural risk, replacing the prior focus on upstream data leakage from users pasting sensitive data into prompts.","Netskope observed a fourfold increase in Model Context Protocol traffic in the past 10 weeks, creating a path for AI services to return sensitive data that users or agents are not authorized to access.","The report says adoption of agentic coding tools has grown sharply, with Claude Code used by 75% of organizations and Codex used by 58% of organizations.","Netskope says attackers are weaponizing the AI supply chain through trojanized developer tools, fake AI installers, and attempts to make AI apps surface malicious code and links."],"insights":["Controls focused only on stopping users from pasting sensitive data into AI prompts are no longer enough, because Netskope says the dominant risk now comes from AI services being connected to internal data sources and returning unauthorized information.","The rapid fourfold increase in Model Context Protocol traffic over just 10 weeks makes MCP a priority area for granular downstream inspection rather than a secondary AI integration detail.","The adoption rates cited for Claude Code and Codex show that agentic coding tools have quickly become mainstream in organizations, which makes code execution risk a broad enterprise issue rather than a niche developer concern.","Attackers are not only using AI as bait but are also targeting the AI development ecosystem itself through trojanized tools, fake installers, and manipulation of AI apps into surfacing malicious code or links."],"referencedReports":[],"body":"\u003cp\u003eNetskope published its latest AI report, covering analysis from June 2025 through July 2026. The report says security risks have shifted significantly since the prior report. It highlights architectural changes behind that shift and focuses on downstream policy violations, agentic coding apps, and the AI supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe report says downstream policy violations are now the primary architectural risk, rather than upstream data leakage from users pasting sensitive data into prompts. Netskope observed a fourfold increase in Model Context Protocol traffic in the past 10 weeks. The article says MCP bridges internal data stores with external models, creating a direct path for AI services to return sensitive data that users or agents are not authorized to access.\u003c/p\u003e\n\n\u003cp\u003eNetskope also says agentic coding tools have created new execution vectors, with Claude Code and Codex adoption rising to 75% and 58% of organizations, respectively. The article says every agentic interaction is now a potential execution vector for malicious code. It also says attackers are weaponizing the AI supply chain through trojanized developer tools, fake AI installers, and attempts to trick AI apps into surfacing malicious code and links to malicious web resources.\u003c/p\u003e\n"},{"n":5,"title":"CISA shares advice on isolating vital systems during cyberattacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-shares-advice-on-isolating-vital-systems-during-cyberattacks/","time":"18:41","priority":"MAY READ","score":58,"tldr":"CISA, Australia’s ACSC, the FBI, and partners are urging critical infrastructure operators to pre-plan and regularly test how they would isolate essential OT systems during cyberattacks while still maintaining core services. The guidance emphasizes identifying vital systems, documenting dependencies, and preparing for physical or graduated isolation before an incident occurs.","briefOverview":"\u003cp\u003eThe U.S. and Australian governments released new guidance urging critical infrastructure organizations to prepare to isolate vital operational technology systems during cyberattacks or other major disruptions. The guidance, titled \u0026ldquo;CI Fortify – Advice for isolating vital systems,\u0026rdquo; was developed by CISA, the Australian Signals Directorate\u0026rsquo;s Australian Cyber Security Centre, the FBI, and international partners. It recommends ways to disconnect critical systems from corporate, Internet-facing, and other less-trusted networks while continuing to provide essential services for an extended period.\u003c/p\u003e\n\n\u003cp\u003eThe agencies say state-sponsored threat actors routinely target critical infrastructure for espionage and to establish access that could later be used for disruptive or destructive attacks during a crisis or military conflict. The article cites Chinese hacking groups Volt Typhoon and Salt Typhoon, as well as incidents affecting water facilities and major U.S. telecommunications providers. It also notes warnings about pro-Russian hacktivists seeking out unsecured operational technology systems used by water facilities and other critical infrastructure organizations.\u003c/p\u003e\n\n\u003cp\u003eThe guidance recommends that organizations identify the minimum systems needed to provide a critical service, document all connections to less-trusted networks and external dependencies, and determine where those connections can be disabled or physically disconnected. It describes physical isolation as the most effective protection, while also discussing graduated isolation, administrative network controls, data diodes, and post-isolation monitoring. Organizations are urged to regularly test complete isolation plans, keep offline or printed copies, and prepare for risks such as delayed security updates, reduced monitoring, and increased removable media use.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA, Australia’s ACSC, the FBI, and international partners released CI Fortify guidance urging critical infrastructure organizations to prepare to isolate vital operational technology systems during cyberattacks or major disruptions.","The guidance recommends identifying the minimum systems and networks needed to deliver critical services and documenting every connection to corporate networks, remote access services, cloud environments, Internet-facing infrastructure, vendors, contractors, and other operators.","The agencies say physical isolation is the most effective protection, but organizations may need graduated isolation or stronger network boundaries when they depend on Internet-facing services, carrier networks, cloud services, or distributed facilities.","Organizations are urged to regularly test complete isolation of vital systems and keep secure offline or printed copies of isolation plans so they remain available if corporate systems are disrupted.","The agencies warn that isolation can introduce risks such as delayed security updates, reduced monitoring, and increased use of removable media, so organizations must prepare to operate, monitor, and update systems manually until reconnection."],"insights":["The guidance emphasizes planning isolation before an incident because trying to determine what can be disconnected during an active attack may be too late for critical infrastructure operators.","Testing only individual systems is insufficient because hidden shared infrastructure and dependencies may only appear during a full isolation test.","Network-based controls such as VLAN changes, access-control lists, and routing changes are treated as temporary protections, while the guidance presents physical disconnection as the preferred end state.","Isolation planning must include business and operational details, such as who can authorize each step, what conditions trigger it, which systems must remain available, and how services continue without normal connectivity.","After isolation, operators still need to verify that accidental or unauthorized reconnections have not restored paths between critical and non-critical networks."],"referencedReports":[{"title":"CI Fortify – Advice for isolating vital systems","url":"http://www.cyber.gov.au/business-government/secure-design/operational-technology-environments/ci-fortify/ci-fortify-advice-for-isolating-vital-systems","publisher":"CISA, Australian Signals Directorate’s Australian Cyber Security Centre, FBI, and international partners","context":"The article is based on this new guidance advising critical infrastructure organizations how to isolate vital operational technology systems during cyberattacks or major disruptions.","category":"advisory","primary":true}],"body":"\u003cp\u003eThe U.S. and Australian governments released new guidance urging critical infrastructure organizations to prepare to isolate vital operational technology systems during cyberattacks or other major disruptions. The guidance, titled \u0026ldquo;CI Fortify – Advice for isolating vital systems,\u0026rdquo; was developed by CISA, the Australian Signals Directorate\u0026rsquo;s Australian Cyber Security Centre, the FBI, and international partners. It recommends ways to disconnect critical systems from corporate, Internet-facing, and other less-trusted networks while continuing to provide essential services for an extended period.\u003c/p\u003e\n\n\u003cp\u003eThe agencies say state-sponsored threat actors routinely target critical infrastructure for espionage and to establish access that could later be used for disruptive or destructive attacks during a crisis or military conflict. The article cites Chinese hacking groups Volt Typhoon and Salt Typhoon, as well as incidents affecting water facilities and major U.S. telecommunications providers. It also notes warnings about pro-Russian hacktivists seeking out unsecured operational technology systems used by water facilities and other critical infrastructure organizations.\u003c/p\u003e\n\n\u003cp\u003eThe guidance recommends that organizations identify the minimum systems needed to provide a critical service, document all connections to less-trusted networks and external dependencies, and determine where those connections can be disabled or physically disconnected. It describes physical isolation as the most effective protection, while also discussing graduated isolation, administrative network controls, data diodes, and post-isolation monitoring. Organizations are urged to regularly test complete isolation plans, keep offline or printed copies, and prepare for risks such as delayed security updates, reduced monitoring, and increased removable media use.\u003c/p\u003e\n"},{"n":26,"title":"How we use /goal to find bugs in Patch the Planet","source":"blog.trailofbits.com","sourceColorIdx":6,"link":"https://blog.trailofbits.com/2026/07/28/how-we-use-goal-to-find-bugs-in-patch-the-planet/","time":"11:00","priority":"MAY READ","score":58,"tldr":"Trail of Bits found that Codex’s /goal is most effective for bug hunting when prompts define a precise security outcome, let the model choose the path, and assign one outcome per agent. In Patch the Planet, this approach helped uncover and validate real bugs across major open-source projects including Rust, zlib, and Keycloak.","briefOverview":"\u003cp\u003eTrail of Bits describes how its engineers used Codex’s \u003ccode\u003e/goal\u003c/code\u003e feature during Patch the Planet, a joint initiative with OpenAI to find and fix bugs in open-source software. They applied it to widely used and heavily audited projects including Rust, curl, zlib, and Keycloak. The article says \u003ccode\u003e/goal\u003c/code\u003e found every Rust bug they submitted, helped turn past CVEs into Semgrep rules that found 11 variant hits, and uncovered two potential high-severity privilege-escalation bugs in Keycloak’s SAML component.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that successful \u003ccode\u003e/goal\u003c/code\u003e use depends on defining specific success criteria rather than giving detailed instructions. Trail of Bits found that Codex can help write stronger goal prompts for itself, especially when asked to identify ways a future run might take shortcuts and revise the prompt to avoid them. They also built aicov to track which lines of code Codex had actually read, because they observed that Codex sometimes skipped reading the whole codebase even when asked.\u003c/p\u003e\n\n\u003cp\u003eTrail of Bits recommends defining the desired outcome while leaving Codex free to choose the path, using threat model files to clarify what counts as a valid bug. The article also says each agent should receive one outcome, because combining goals such as finding bugs and achieving coverage led to uneven results. In the Rust workflow, an orchestrator created separate Codex sessions for P-critical issues, applied security and false-positive checks, and sent only validated findings through a final human and duplicate-review process.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trail of Bits used Codex’s `/goal` feature during Patch the Planet to find bugs in widely used open-source projects including Rust, curl, zlib, and Keycloak.","The article says effective `/goal` use depends on defining precise success criteria and outcomes rather than giving the model detailed instructions for how to search.","Trail of Bits found that asking Codex to help write and refine its own goal prompts produced tighter prompts and helped remove easy shortcuts before a run started.","The team recommends assigning one outcome per agent because combining goals such as finding bugs and achieving coverage led to uneven results.","A Rust variant-analysis pipeline using `/goal` downloaded P-critical issues, spawned one agent per issue, applied security and false-positive checks, and produced every Rust bug submitted through Patch the Planet."],"insights":["Trail of Bits found that Codex often writes better `/goal` prompts for itself than engineers write from scratch, especially when it is also asked to red-team the prompt for ways a future run might take shortcuts.","The article highlights that narrowing a goal too much can make autonomous bug hunting worse: giving Codex an exact root cause of a known bug found nothing, while describing only the broader bug class surfaced multiple reportable issues.","Adding coverage requirements directly to a bug-hunting goal degraded results because Codex optimized for coverage instead of vulnerability discovery, so the team split coverage planning and bug hunting into separate sessions.","Trail of Bits treated “no bugs found” as an intermediate result rather than a valid completion condition, showing that persistence had to be explicitly built into goals for heavily audited projects.","A `THREAT_MODEL.md` file became one of the most useful inputs because it defined what counted as a valid bug without constraining how Codex should search for it."],"referencedReports":[],"body":"\u003cp\u003eTrail of Bits describes how its engineers used Codex’s \u003ccode\u003e/goal\u003c/code\u003e feature during Patch the Planet, a joint initiative with OpenAI to find and fix bugs in open-source software. They applied it to widely used and heavily audited projects including Rust, curl, zlib, and Keycloak. The article says \u003ccode\u003e/goal\u003c/code\u003e found every Rust bug they submitted, helped turn past CVEs into Semgrep rules that found 11 variant hits, and uncovered two potential high-severity privilege-escalation bugs in Keycloak’s SAML component.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that successful \u003ccode\u003e/goal\u003c/code\u003e use depends on defining specific success criteria rather than giving detailed instructions. Trail of Bits found that Codex can help write stronger goal prompts for itself, especially when asked to identify ways a future run might take shortcuts and revise the prompt to avoid them. They also built aicov to track which lines of code Codex had actually read, because they observed that Codex sometimes skipped reading the whole codebase even when asked.\u003c/p\u003e\n\n\u003cp\u003eTrail of Bits recommends defining the desired outcome while leaving Codex free to choose the path, using threat model files to clarify what counts as a valid bug. The article also says each agent should receive one outcome, because combining goals such as finding bugs and achieving coverage led to uneven results. In the Rust workflow, an orchestrator created separate Codex sessions for P-critical issues, applied security and false-positive checks, and sent only validated findings through a final human and duplicate-review process.\u003c/p\u003e\n"},{"n":22,"title":"Attack Path Management Comes to AWS","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/28/attack-path-management-comes-to-aws/","time":"11:50","priority":"MAY READ","score":55,"tldr":"SpecterOps is adding AWS attack path management to BloodHound Enterprise, modeling IAM permissions, trust relationships, AWS Organizations, and key services to show who can actually access sensitive roles, d
