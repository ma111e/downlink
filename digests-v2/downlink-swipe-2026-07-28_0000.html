ata, keys, and secrets. The goal is to reveal real privilege escalation and cross-account attack paths that are difficult to understand from AWS policy documents alone.","briefOverview":"\u003cp\u003eSpecterOps announced a new AWS extension for BloodHound Enterprise that brings attack path management to AWS identities, permissions, trust relationships, organization structure, and resources. The article says the extension is intended to answer who really has access to a resource and what an AWS role can actually do. SpecterOps frames AWS as a critical cloud resource provider used by enterprise organizations, with large environments often containing hundreds or thousands of AWS accounts.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that AWS authorization can be difficult to reason about manually because identity policies, resource policies, service control policies, permission boundaries, resource control policies, and trust policies interact with complex conditions. BloodHound Enterprise evaluates these policy types together and renders the results as traversable attack paths. At launch, the AWS collector supports IAM, AWS Organizations, STS, S3, KMS, Lambda, EC2, CloudFormation, EKS, and SSM, spanning more than 20 AWS resource types and over 150 relationships.\u003c/p\u003e\n\n\u003cp\u003eThe extension models role assumption, external role trusts, privilege escalation paths, and access to sensitive resources such as KMS keys, S3 buckets, and SSM parameters. The article highlights that certain permissions, such as attaching a policy, creating an access key for another user, editing an inline policy, or creating and passing a role to a controlled service, can effectively provide administrator access. SpecterOps also says it is working to add additional AWS services such as Bedrock, RDS, and ECR.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps announced an AWS extension for BloodHound Enterprise that models AWS identities, permissions, trust relationships, organization structure, and resources as attack paths.","The article says AWS environments can contain hundreds or thousands of accounts, each with IAM users, roles, and policies, making manual analysis of access paths difficult.","BloodHound Enterprise evaluates AWS identity, resource, trust, permission boundary, service control, and resource control policies together to show traversable attack paths.","At launch, the AWS collector supports services including IAM, AWS Organizations, STS, S3, KMS, Lambda, EC2, CloudFormation, EKS, and SSM.","The AWS collector can identify role assumption chains, external third-party trusts, privilege escalation paths, and access paths to sensitive resources such as KMS keys, S3 buckets, and SSM parameters."],"insights":["A trust policy that names an AWS account can effectively trust every principal in that account, including principals that did not exist when the policy was originally written.","The article highlights that permissions such as attaching a policy, creating another user’s access key, editing an inline policy, or creating and passing a role to a controlled service can function as administrator access even when they are not labeled that way.","BloodHound Enterprise’s AWS analysis is designed to show not just direct access to a resource, but access gained through combinations of role chaining and privilege abuse across accounts.","The AWS collector treats third-party and contractor role trusts as part of the attack path picture, making vendor compromise a mapped part of an organization’s AWS exposure."],"referencedReports":[],"body":"\u003cp\u003eSpecterOps announced a new AWS extension for BloodHound Enterprise that brings attack path management to AWS identities, permissions, trust relationships, organization structure, and resources. The article says the extension is intended to answer who really has access to a resource and what an AWS role can actually do. SpecterOps frames AWS as a critical cloud resource provider used by enterprise organizations, with large environments often containing hundreds or thousands of AWS accounts.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that AWS authorization can be difficult to reason about manually because identity policies, resource policies, service control policies, permission boundaries, resource control policies, and trust policies interact with complex conditions. BloodHound Enterprise evaluates these policy types together and renders the results as traversable attack paths. At launch, the AWS collector supports IAM, AWS Organizations, STS, S3, KMS, Lambda, EC2, CloudFormation, EKS, and SSM, spanning more than 20 AWS resource types and over 150 relationships.\u003c/p\u003e\n\n\u003cp\u003eThe extension models role assumption, external role trusts, privilege escalation paths, and access to sensitive resources such as KMS keys, S3 buckets, and SSM parameters. The article highlights that certain permissions, such as attaching a policy, creating an access key for another user, editing an inline policy, or creating and passing a role to a controlled service, can effectively provide administrator access. SpecterOps also says it is working to add additional AWS services such as Bedrock, RDS, and ECR.\u003c/p\u003e\n"},{"n":23,"title":"Introducing Attack Path Management for Entra Agents in BloodHound Enterprise","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/28/introducing-attack-path-management-for-entra-agents-in-bloodhound-enterprise/","time":"11:56","priority":"MAY READ","score":55,"tldr":"SpecterOps announced a BloodHound Enterprise extension that models Microsoft Entra agents, Copilot Studio, Power Automate, and Azure AI Foundry as attack paths rather than isolated configurations. The key takeaway is that AI agents can silently bridge users or anonymous callers to privileged identities and downstream resources, so defenders need graph-based analysis to see who can make an agent act, under whose identity, and where that access leads.","briefOverview":"\u003cp\u003eSpecterOps introduced Attack Path Management for Entra agents in BloodHound Enterprise through an Entra Agents extension. The extension brings Microsoft agent platforms into the BloodHound Enterprise attack graph via OpenGraph, including Entra Agent ID, Copilot Studio, Power Automate, selected Azure AI Foundry relationships, and links to the existing Entra and Azure graph. The article says the goal is not simply to inventory AI agents, but to understand what an attacker can do through interconnected agents, identities, users, flows, credentials, cloud resources, and external systems.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that AI agents create a new identity problem because the identity that invokes an agent is not necessarily the identity the agent ultimately uses. A low-privileged user may invoke a Copilot Studio agent that uses maker-provided credentials, or a public agent may allow anonymous interaction while still using an authenticated identity for outbound actions. BloodHound Enterprise models these transitions to show paths such as users invoking agents that act as someone else, public agents bridging anonymous callers to authenticated resources, and agent identity blueprints exposing multiple child identities.\u003c/p\u003e\n\n\u003cp\u003eThe extension models Entra Agent ID blueprints, tenant-local blueprint principals, agent identities, ownership and administrative control, Copilot agent owners and invocation access, maker-credential identity transitions, Power Automate flows and flow-to-flow delegation, and selected Azure AI Foundry control-plane relationships. It also connects agent identities to corresponding Entra service principals so attack paths can continue into the broader Azure environment. The collector is designed to use read-only Microsoft Graph and Azure permissions and does not read credential material or Key Vault secrets from the data plane.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps introduced an Entra Agents extension for BloodHound Enterprise that models Microsoft Entra Agent ID, Copilot Studio, Power Automate, selected Azure AI Foundry control-plane relationships, and related identity connections in the broader attack graph.","The article states that AI agents create an identity problem because the identity that invokes an agent is not necessarily the identity the agent ultimately uses to access downstream services.","BloodHound Enterprise models relationships such as agent invocation access, maker-credential identity transitions, Power Automate flow delegation, agent identity blueprints, and mappings from agent identities to Entra service principals.","The extension is designed to identify paths such as low-privileged users invoking agents that act with maker-provided credentials, public agents bridging anonymous callers to authenticated resources, and compromised blueprints exposing multiple child agent identities.","The collector is designed to use read-only Microsoft Graph and Azure permissions and does not read credential material or Key Vault secrets from the data plane."],"insights":["A public Copilot Studio agent is not necessarily the core risk by itself; the article emphasizes that the danger emerges when public invocation is combined with a privileged outbound identity, creating an anonymous-to-authenticated bridge.","The article highlights that a harmless-looking permission such as being able to use or edit an agent can become powerful when the agent continues to operate with another person’s credentials.","A compromised Entra Agent ID blueprint can have a broader blast radius than a single identity because one blueprint may control multiple child agent identities that each have their own Entra ID or Azure access.","The extension intentionally omits some relationships, such as connection sharing and run-only flow access, until they can be reliably collected and validated, showing that the graph prioritizes defensible attack paths over maximum coverage.","Power Automate flow delegation can remove the original user from later authorization decisions, meaning the meaningful access path may depend on embedded connections rather than the person who triggered the workflow."],"referencedReports":[{"title":"Agent ID Blueprint Blast Radius","url":"https://securitylabs.datadoghq.com/articles/agent-id-blueprint-blast-radius","publisher":"Datadog Security Labs","context":"The article cites this research as demonstrating how compromising an Entra Agent ID blueprint could let an attacker authenticate as identities associated with that blueprint and expand impact across multiple identities, tenants, and permission contexts.","category":"research","primary":false}],"body":"\u003cp\u003eSpecterOps introduced Attack Path Management for Entra agents in BloodHound Enterprise through an Entra Agents extension. The extension brings Microsoft agent platforms into the BloodHound Enterprise attack graph via OpenGraph, including Entra Agent ID, Copilot Studio, Power Automate, selected Azure AI Foundry relationships, and links to the existing Entra and Azure graph. The article says the goal is not simply to inventory AI agents, but to understand what an attacker can do through interconnected agents, identities, users, flows, credentials, cloud resources, and external systems.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that AI agents create a new identity problem because the identity that invokes an agent is not necessarily the identity the agent ultimately uses. A low-privileged user may invoke a Copilot Studio agent that uses maker-provided credentials, or a public agent may allow anonymous interaction while still using an authenticated identity for outbound actions. BloodHound Enterprise models these transitions to show paths such as users invoking agents that act as someone else, public agents bridging anonymous callers to authenticated resources, and agent identity blueprints exposing multiple child identities.\u003c/p\u003e\n\n\u003cp\u003eThe extension models Entra Agent ID blueprints, tenant-local blueprint principals, agent identities, ownership and administrative control, Copilot agent owners and invocation access, maker-credential identity transitions, Power Automate flows and flow-to-flow delegation, and selected Azure AI Foundry control-plane relationships. It also connects agent identities to corresponding Entra service principals so attack paths can continue into the broader Azure environment. The collector is designed to use read-only Microsoft Graph and Azure permissions and does not read credential material or Key Vault secrets from the data plane.\u003c/p\u003e\n"},{"n":24,"title":"Designing an MCP Server for AI Agents: Why Wrapping Your API Is the Wrong Abstraction","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/28/designing-an-mcp-server-for-ai-agents-bloodhound-hunter/","time":"11:50","priority":"MAY READ","score":55,"tldr":"An MCP server for AI agents should not simply wrap existing API endpoints; it should be designed around the agent’s intent and workflow. The key is to guide agents toward the right next action by hiding implementation complexity and exposing purpose-built tools, resources, and prompts.","briefOverview":"\u003cp\u003eThe article argues that an MCP server for AI agents should not be built as a simple wrapper around an existing REST API. SpecterOps initially expected that exposing BloodHound’s mature API endpoints with good descriptions would be enough, but experiments with OpenAI’s agent showed a recurring problem: the agent needed to know which tool it should use, not just which tools it could use. The author says this changed the design focus from backend implementation to agent intent.\u003c/p\u003e\n\n\u003cp\u003eThe article presents AI agents as a new kind of user that is different from both humans and traditional software clients. Traditional API callers already know what they want, while agents often begin by exploring and trying to orient themselves. Because of that, MCP tools should reduce cognitive load, hide unnecessary complexity, organize around workflows, and guide the agent toward the right next action.\u003c/p\u003e\n\n\u003cp\u003eIn rebuilding BloodHound Hunter, SpecterOps reduced the tool surface, then added tools back when the agent’s workflow showed a clear need. Examples include adding an Explore URL tool so the agent did not have to reconstruct product-specific link behavior, keeping Cypher as a read-only bounded escape hatch, and adding more opinionated graph tools for common questions. The article concludes that the best MCP interface is not the one exposing the most capability, but the one that removes enough ambiguity for a human or agent to move through a task with confidence and accuracy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that an MCP server for AI agents should be designed around agent intent rather than simply wrapping existing REST API endpoints.","The author says AI agents are a new kind of user because they often begin with exploration and need help orienting themselves before acting.","SpecterOps reduced and reshaped the BloodHound MCP tool surface by removing, combining, and hiding implementation-focused tools to make the interface easier for the agent to use.","The article says raw Cypher queries should remain as a read-only, bounded escape hatch, while more common graph tasks should be handled by semantic tools such as object lookup, neighborhood expansion, reachability, summaries, attack paths, and capability discovery.","The author argues that if a user or agent has to leave the interface and reconstruct product knowledge, the interface is incomplete."],"insights":["Shrinking the initial MCP server by removing and combining tools improved agent usability, even though it felt counterintuitive because it exposed less of the product.","Watching where the agent used the wrong tools, misunderstood intent, or reconstructed product knowledge became a practical way to decide which tools to add back.","A tool can be valuable even when it is not an important backend API endpoint, as shown by the Explore URL tool that translated the agent’s intent to share a BloodHound path into a safe, valid link.","The article treats MCP prompts as workflow guidance rather than a way to make the model smarter, using them to direct the agent’s attention toward the right order of analysis steps.","Raw graph queries were kept available but deliberately made less convenient than safer, more specific graph tools so the common path would be clearer than the powerful escape hatch."],"referencedReports":[{"title":"MCP Servers Failing Agents","url":"https://tengli.dev/posts/mcp-servers-failing-agents.html","publisher":"Teng Li","context":"The article cites Teng Li’s blog post to support the point that the MCP specification defines how to transport tools but not whether models can actually use them effectively.","category":"opinion","primary":false}],"body":"\u003cp\u003eThe article argues that an MCP server for AI agents should not be built as a simple wrapper around an existing REST API. SpecterOps initially expected that exposing BloodHound’s mature API endpoints with good descriptions would be enough, but experiments with OpenAI’s agent showed a recurring problem: the agent needed to know which tool it should use, not just which tools it could use. The author says this changed the design focus from backend implementation to agent intent.\u003c/p\u003e\n\n\u003cp\u003eThe article presents AI agents as a new kind of user that is different from both humans and traditional software clients. Traditional API callers already know what they want, while agents often begin by exploring and trying to orient themselves. Because of that, MCP tools should reduce cognitive load, hide unnecessary complexity, organize around workflows, and guide the agent toward the right next action.\u003c/p\u003e\n\n\u003cp\u003eIn rebuilding BloodHound Hunter, SpecterOps reduced the tool surface, then added tools back when the agent’s workflow showed a clear need. Examples include adding an Explore URL tool so the agent did not have to reconstruct product-specific link behavior, keeping Cypher as a read-only bounded escape hatch, and adding more opinionated graph tools for common questions. The article concludes that the best MCP interface is not the one exposing the most capability, but the one that removes enough ambiguity for a human or agent to move through a task with confidence and accuracy.\u003c/p\u003e\n"},{"n":25,"title":"Expanding attack path management to the AI frontier","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/28/bloodhound-enterprise-aws-attack-path-management/","time":"11:50","priority":"MAY READ","score":55,"tldr":"SpecterOps announced new BloodHound Enterprise capabilities for mapping attack paths across AWS and Microsoft Entra Agent ID, plus BloodHound Hunter to let approved AI agents use BloodHound graph context. The key takeaway is that identity and trust relationships across cloud and AI agents are expanding attackers’ paths, so defenders need a unified graph to find and break them.","briefOverview":"\u003cp\u003eSpecterOps announced new BloodHound Enterprise features for Amazon Web Services and Microsoft Entra Agent ID, expanding attack path management across hybrid enterprise environments and agentic identity platforms. The article says identity is no longer concentrated in Active Directory and is now spread across systems such as Okta, GitHub, Jamf-managed Mac environments, and AWS. It also says AI agents and other non-human identities now outnumber human identities by orders of magnitude, increasing the trust relationships defenders must secure.\u003c/p\u003e\n\n\u003cp\u003eThe AWS extension evaluates supported AWS policies, trust relationships, organization controls, and service permissions together, then renders effective relationships as traversable attack paths. At launch, the AWS collector models IAM, AWS Organizations, STS, S3, KMS, Lambda, EC2, CloudFormation, EKS, and SSM, covering more than 20 AWS resource types and over 150 distinct relationships. The article frames AWS attack path management as a way to show how conditions combine into chains from an initial foothold to privileged roles, production credentials, keys, secrets, and data.\u003c/p\u003e\n\n\u003cp\u003eSpecterOps also announced a BloodHound Enterprise extension for Microsoft Entra Agent ID, currently in preview, that maps agent identities, Copilot Studio, and Power Automate relationships into the same attack graph. The article describes risks such as a low-privileged employee invoking a Copilot Studio agent that reaches sensitive Azure resources using its maker’s credentials, or a public agent becoming an anonymous-to-authenticated bridge. SpecterOps additionally announced BloodHound Hunter, an MCP interface built into BloodHound Enterprise that lets approved AI clients access BloodHound analytics and graph context for investigation and remediation workflows.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps announced new BloodHound Enterprise extensions for Amazon Web Services and Microsoft Entra Agent ID to support attack path management across hybrid enterprise environments and agentic identity platforms.","The AWS extension evaluates supported AWS policies, trust relationships, organization controls, and service permissions together, then renders their effective relationships as traversable attack paths.","At launch, the AWS collector models IAM, AWS Organizations, STS, S3, KMS, Lambda, EC2, CloudFormation, EKS, and SSM, covering more than 20 AWS resource types and over 150 distinct relationships.","The Microsoft Entra Agent ID extension, currently in preview, maps agent identities, Copilot Studio, and Power Automate relationships into the same attack graph.","SpecterOps also announced BloodHound Hunter, an MCP interface built into BloodHound Enterprise that lets approved AI clients access BloodHound analytics and graph context."],"insights":["The article emphasizes that apparently valid configurations owned by different teams can combine into dangerous attack paths, even when no single policy or setting explicitly grants broad access.","In AWS, the practical risk is not just whether a policy is permissive, but whether identities can chain through services such as Lambda, STS, PassRole, and cross-account trust to reach privileged roles or production resources.","The article highlights external vendors and development accounts as important starting points for analysis because their compromise can create a measurable blast radius across an AWS organization.","For Entra Agent ID, the article points out that a low-privileged employee or public agent can become a route to sensitive resources when agent behavior relies on another identity’s credentials or inherited child identities.","BloodHound Hunter is positioned as more than a simple API wrapper because it is intended to let approved AI clients combine BloodHound graph context with an organization’s own knowledge, controls, and priorities."],"referencedReports":[],"body":"\u003cp\u003eSpecterOps announced new BloodHound Enterprise features for Amazon Web Services and Microsoft Entra Agent ID, expanding attack path management across hybrid enterprise environments and agentic identity platforms. The article says identity is no longer concentrated in Active Directory and is now spread across systems such as Okta, GitHub, Jamf-managed Mac environments, and AWS. It also says AI agents and other non-human identities now outnumber human identities by orders of magnitude, increasing the trust relationships defenders must secure.\u003c/p\u003e\n\n\u003cp\u003eThe AWS extension evaluates supported AWS policies, trust relationships, organization controls, and service permissions together, then renders effective relationships as traversable attack paths. At launch, the AWS collector models IAM, AWS Organizations, STS, S3, KMS, Lambda, EC2, CloudFormation, EKS, and SSM, covering more than 20 AWS resource types and over 150 distinct relationships. The article frames AWS attack path management as a way to show how conditions combine into chains from an initial foothold to privileged roles, production credentials, keys, secrets, and data.\u003c/p\u003e\n\n\u003cp\u003eSpecterOps also announced a BloodHound Enterprise extension for Microsoft Entra Agent ID, currently in preview, that maps agent identities, Copilot Studio, and Power Automate relationships into the same attack graph. The article describes risks such as a low-privileged employee invoking a Copilot Studio agent that reaches sensitive Azure resources using its maker’s credentials, or a public agent becoming an anonymous-to-authenticated bridge. SpecterOps additionally announced BloodHound Hunter, an MCP interface built into BloodHound Enterprise that lets approved AI clients access BloodHound analytics and graph context for investigation and remediation workflows.\u003c/p\u003e\n"},{"n":33,"title":"Top 10 Data Security Risks in Microsoft 365","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/top-10-data-security-risks-in-microsoft-365","time":"12:40","priority":"MAY READ","score":55,"tldr":"Cyera’s 2025 analysis highlights Microsoft 365 as a major data exposure surface and identifies the top 10 risks CISOs should monitor and remediate. The key takeaway is that organizations need active, ongoing visibility and controls around Microsoft 365 data security.","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft 365 has over 300 million users.","Microsoft 365 is essential to modern collaboration.","Microsoft 365 is also a growing surface for data exposure.","Cyera’s 2025 analysis across enterprise environments identified the top 10 notable Microsoft 365 risks.","The article says CISOs and data leaders should actively monitor and remediate these Microsoft 365 risks."],"insights":["The article frames Microsoft 365 data security as both a CISO concern and a data leader concern, indicating that remediation is not limited to traditional security teams.","The risks are based on Cyera’s 2025 analysis across enterprise environments, so the article presents them as observed enterprise issues rather than purely theoretical concerns.","The article emphasizes active monitoring and remediation, making the top 10 risks a practical checklist for organizations using Microsoft 365."],"referencedReports":[],"body":""},{"n":64,"title":"You Can't Out-Patch AI. You Can Out-Reduce It.","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/you-cant-out-patch-ai/","time":"19:54","priority":"MAY READ","score":55,"tldr":"AI is making it faster and cheaper for attackers to find and exploit Internet-facing vulnerabilities, so organizations cannot rely on patching alone. The key defense is to reduce external exposure through better asset discovery, segmentation, identity-based access controls, and strict exposure hygiene.","briefOverview":"\u003cp\u003eThe article argues that recent AI advances have broken the long-standing defensive assumption that organizations can patch disclosed vulnerabilities fast enough. It says Anthropic Mythos showed that large language models can make it much easier to find software vulnerabilities and build working exploits, and that open source models have historically lagged frontier models by only 4–6 months. As attackers gain similar capabilities, the article says enterprises will face more vulnerabilities on Internet-facing systems, less time to patch them, and less time to contain breaches after initial access.\u003c/p\u003e\n\n\u003cp\u003eThe article cites the 2026 Verizon DBIR as finding that vulnerability exploitation became the top initial access vector into enterprises, accounting for roughly 31% of breaches. It also says median time-to-patch rose from 32 days to 43 days, while only 26% of CISA Known Exploited Vulnerabilities were fully remediated in 2025. The author argues that AI-driven defensive systems may eventually help block attacks in real time, but that current advances benefit attackers more than defenders.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main recommendation is to reduce what attackers can reach instead of trying only to patch faster. It calls for asset management, network segmentation, exposure hygiene, and a default of exposing nothing unless there is a strong reason and a commitment to maintain and monitor it. It describes approaches such as identity-aware proxies, zero trust network access, single-packet authorization, and just-in-time allowlisting, and says Censys ASM helps by discovering more external assets and prioritizing risky exposed services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that recent AI advances have broken the traditional defensive model that assumes organizations can patch systems quickly enough after vulnerabilities are disclosed.","Anthropic Mythos showed that large language models can make it much easier to uncover software vulnerabilities and build working exploits, and the article says open source models have historically lagged frontier models by only 4–6 months.","The article cites the 2026 Verizon DBIR as finding that vulnerability exploitation became the top initial access vector into enterprises, accounting for roughly 31% of breaches.","The article says defenders are falling behind, with median time-to-patch rising from 32 days to 43 days and only 26% of CISA Known Exploited Vulnerabilities fully remediated in 2025.","The article argues that organizations should focus on reducing Internet exposure through asset management, network segmentation, exposure hygiene, identity-aware proxies, zero trust network access, and just-in-time allowlisting."],"insights":["The article frames attack surface reduction as a more durable response to AI-enabled exploitation than faster patching, because AI is expected to increase the number of exploitable flaws while reducing defenders’ response time.","The author argues that the default exposure model should be reversed: systems should not be Internet-facing unless there is a strong business reason and a commitment to maintain and monitor them in real time.","The article highlights legacy systems, management interfaces, OT and ICS networks, and contractor access as especially suitable for just-in-time allowlisting because they are often hard to patch and have long histories of software bugs.","The article emphasizes that attack surface reduction depends on complete discovery, warning that organizations may be unaware of up to 80% of their external attack surface."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that recent AI advances have broken the long-standing defensive assumption that organizations can patch disclosed vulnerabilities fast enough. It says Anthropic Mythos showed that large language models can make it much easier to find software vulnerabilities and build working exploits, and that open source models have historically lagged frontier models by only 4–6 months. As attackers gain similar capabilities, the article says enterprises will face more vulnerabilities on Internet-facing systems, less time to patch them, and less time to contain breaches after initial access.\u003c/p\u003e\n\n\u003cp\u003eThe article cites the 2026 Verizon DBIR as finding that vulnerability exploitation became the top initial access vector into enterprises, accounting for roughly 31% of breaches. It also says median time-to-patch rose from 32 days to 43 days, while only 26% of CISA Known Exploited Vulnerabilities were fully remediated in 2025. The author argues that AI-driven defensive systems may eventually help block attacks in real time, but that current advances benefit attackers more than defenders.\u003c/p\u003e\n\n\u003cp\u003eThe article’s main recommendation is to reduce what attackers can reach instead of trying only to patch faster. It calls for asset management, network segmentation, exposure hygiene, and a default of exposing nothing unless there is a strong reason and a commitment to maintain and monitor it. It describes approaches such as identity-aware proxies, zero trust network access, single-packet authorization, and just-in-time allowlisting, and says Censys ASM helps by discovering more external assets and prioritizing risky exposed services.\u003c/p\u003e\n"},{"n":4,"title":"Is Your SSO Protected Against Modern Credential Attacks?","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/is-your-sso-protected-against-modern-credential-attacks/","time":"14:00","priority":"MAY READ","score":45,"tldr":"SSO can reduce password sprawl and centralize access control, but it becomes a high-value target if not hardened. Organizations should protect SSO with strong password policies, phishing-resistant MFA, and tight controls over identity provider admin accounts, keys, secrets, and app permissions.","briefOverview":"\u003cp\u003eThe article explains that single sign-on, or SSO, simplifies access by allowing users to log into multiple systems with one set of credentials. It says this convenience can also concentrate risk, using the 2025 University of Pennsylvania breach as an example. According to reports cited in the article, attackers compromised a PennKey SSO account and used it to access internal systems including VPN, Salesforce, Qlik, SAP, and SharePoint. The breach resulted in the theft of data on 1.2 million individuals.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that SSO is not inherently insecure and can improve security when configured and protected properly. It says organizations should treat SSO as a critical security control because one login can open access to many systems. Recommended protections include strong passwords based on current NIST guidance, screening new passwords against blocklists of commonly used or compromised passwords, and avoiding legacy rules such as mandatory complexity requirements and routine password resets. The article also says MFA should be enforced consistently across users, applications, and access scenarios.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that MFA should be strong enough to withstand modern credential attacks, noting that SMS codes and basic one-time passwords are less strong than phishing-resistant methods such as FIDO2 security keys, WebAuthn, or passkeys. It also says organizations should secure the systems and assets behind SSO, including identity provider administrator accounts, signing certificates, token-signing keys, OAuth secrets, refresh tokens, consent grants, and delegated permissions. The article promotes Specops Password Policy and Specops Secure Access as products for enforcing password policies and adding MFA to SAML and OIDC-based applications. It concludes that properly hardened SSO can reduce password exposure, support centralized access management, improve auditing, reduce helpdesk pressure, and make access easier to govern.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Single sign-on simplifies access by letting users log into multiple systems with one set of credentials, but that convenience can concentrate risk if the login is compromised.","Reports said attackers compromised a University of Pennsylvania PennKey SSO account and used it to access internal systems including VPN, Salesforce, Qlik, SAP, and SharePoint, resulting in theft of data on 1.2 million individuals.","The article says SSO can improve security when configured properly by reducing password sprawl, centralizing access policies, and making it easier to enforce multi-factor authentication.","The article recommends strong SSO passwords aligned with NIST guidance, including longer passwords and screening new passwords against blocklists of commonly used, expected, or previously compromised passwords.","The article recommends enforcing MFA consistently for SSO and moving toward phishing-resistant methods such as FIDO2 security keys, WebAuthn, or passkeys, especially for privileged users and sensitive systems."],"insights":["NIST guidance cited in the article emphasizes password length, usability, and compromised-password screening rather than older rules such as mandatory complexity and routine resets, which can drive predictable user behavior.","The article highlights that MFA strength matters: SMS codes and basic one-time passwords are described as better than passwords alone, but organizations are urged to prioritize phishing-resistant options for privileged users and sensitive systems.","The article treats identity provider administrator accounts, signing certificates, token-signing keys, OAuth secrets, refresh tokens, and consent grants as core SSO security assets that need protection alongside user logins.","The article notes that attackers may maintain access through risky third-party app permissions, so organizations should restrict user consent, require admin approval for sensitive permissions, and remove stale or overprivileged grants."],"referencedReports":[],"body":"\u003cp\u003eThe article explains that single sign-on, or SSO, simplifies access by allowing users to log into multiple systems with one set of credentials. It says this convenience can also concentrate risk, using the 2025 University of Pennsylvania breach as an example. According to reports cited in the article, attackers compromised a PennKey SSO account and used it to access internal systems including VPN, Salesforce, Qlik, SAP, and SharePoint. The breach resulted in the theft of data on 1.2 million individuals.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that SSO is not inherently insecure and can improve security when configured and protected properly. It says organizations should treat SSO as a critical security control because one login can open access to many systems. Recommended protections include strong passwords based on current NIST guidance, screening new passwords against blocklists of commonly used or compromised passwords, and avoiding legacy rules such as mandatory complexity requirements and routine password resets. The article also says MFA should be enforced consistently across users, applications, and access scenarios.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that MFA should be strong enough to withstand modern credential attacks, noting that SMS codes and basic one-time passwords are less strong than phishing-resistant methods such as FIDO2 security keys, WebAuthn, or passkeys. It also says organizations should secure the systems and assets behind SSO, including identity provider administrator accounts, signing certificates, token-signing keys, OAuth secrets, refresh tokens, consent grants, and delegated permissions. The article promotes Specops Password Policy and Specops Secure Access as products for enforcing password policies and adding MFA to SAML and OIDC-based applications. It concludes that properly hardened SSO can reduce password exposure, support centralized access management, improve auditing, reduce helpdesk pressure, and make access easier to govern.\u003c/p\u003e\n"},{"n":29,"title":"Why File-Level Classification Is the Missing Layer in Data Security","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/seeing-the-forest-why-file-level-classification-is-the-missing-layer-in-data-security","time":"12:40","priority":"MAY READ","score":45,"tldr":"Cyera argues that file-level classification fills a key data security gap by identifying a document’s overall intent and sensitivity even when it lacks obvious PII or regulated data patterns. The takeaway is that combining file-level context with data-element and structured classification can make security controls like DLP, encryption, retention, and access policies more accurate and scalable.","briefOverview":"\u003cp\u003eThe article argues that data security programs often begin by identifying specific data elements such as Social Security numbers, credit cards, and national IDs, but that this approach leaves important blind spots. It says some highly sensitive files, including product roadmaps, board decks, proprietary algorithm descriptions, patient documents, payroll exports, and M\u0026amp;A target lists, may not contain an obvious data class. Cyera presents file-level classification as a missing layer that determines what a file is, what it is intended for, and how sensitive it is to a specific organization at a given time.\u003c/p\u003e\n\n\u003cp\u003eCyera describes its file-level classification model as generative, open-world, format-aware, and able to operate without a per-tenant learning period. The article says the model can describe documents and propose new labels based on semantics, structure, and context, while using guardrails to fall back to safer parent classes or say “unknown” when confidence is low. It also emphasizes tenant-aware sensitivity, where the same document may receive different protection levels depending on industry, geography, ownership, location, sharing patterns, and policy definitions.\u003c/p\u003e\n\n\u003cp\u003eThe article positions file-level classification as a policy handle that can drive encryption, DLP, retention, access controls, and incident response without requiring humans to review every document. It also says file-level classification should work alongside unstructured data-element classification and structured learned classification to reduce blind spots across an organization’s data estate. Cyera further argues that its purpose-built approach is more scalable and cost-effective than using general commercial LLMs, because it reads only the most informative parts of each file, produces short structured labels, batches requests, and runs in customer-controlled environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that data-element classification alone is insufficient because sensitive documents such as product roadmaps, board decks, proprietary algorithm descriptions, and M\u0026A target lists may not contain obvious data classes like credit card numbers or national IDs.","Cyera describes file-level classification as a way to determine a document’s intent, context, purpose, and current sensitivity to an organization, rather than only identifying individual data elements inside it.","Cyera’s model is presented as a generative, open-world classifier that can propose labels it has not seen before, operate without a per-tenant learning period, and work across common file formats such as DOCX and PDF.","The article says tenant-aware sensitivity lets the same file receive different protection levels depending on factors such as industry, function, geography, file location, ownership, sharing patterns, and policy definitions.","Cyera positions file-level classification as one layer alongside unstructured data-element classification and structured learned classification to drive controls such as encryption, DLP, retention, access, and incident response."],"insights":["A sensitive document can require stricter controls even when no single obvious data type is present, because the risk may come from the document’s purpose or from combinations of otherwise manageable information.","The article highlights that overly specific labels from general-purpose LLMs can make enforcement harder by fragmenting taxonomies into many near-duplicate tags, so normalized parent classes are more useful for policies.","Cyera’s model is designed to return “unknown” when confidence is low, which the article frames as preferable to producing a confident but unreliable classification.","The article treats classification labels as operational policy handles, meaning the practical value of a label depends on whether it can directly drive controls such as encryption, DLP, retention, access restrictions, and incident response.","The cost argument is central: the article says enterprise-scale file classification becomes economically difficult with token-heavy commercial chat models, while a purpose-built classifier can reduce cost by reading only the most informative parts of each file."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that data security programs often begin by identifying specific data elements such as Social Security numbers, credit cards, and national IDs, but that this approach leaves important blind spots. It says some highly sensitive files, including product roadmaps, board decks, proprietary algorithm descriptions, patient documents, payroll exports, and M\u0026amp;A target lists, may not contain an obvious data class. Cyera presents file-level classification as a missing layer that determines what a file is, what it is intended for, and how sensitive it is to a specific organization at a given time.\u003c/p\u003e\n\n\u003cp\u003eCyera describes its file-level classification model as generative, open-world, format-aware, and able to operate without a per-tenant learning period. The article says the model can describe documents and propose new labels based on semantics, structure, and context, while using guardrails to fall back to safer parent classes or say “unknown” when confidence is low. It also emphasizes tenant-aware sensitivity, where the same document may receive different protection levels depending on industry, geography, ownership, location, sharing patterns, and policy definitions.\u003c/p\u003e\n\n\u003cp\u003eThe article positions file-level classification as a policy handle that can drive encryption, DLP, retention, access controls, and incident response without requiring humans to review every document. It also says file-level classification should work alongside unstructured data-element classification and structured learned classification to reduce blind spots across an organization’s data estate. Cyera further argues that its purpose-built approach is more scalable and cost-effective than using general commercial LLMs, because it reads only the most informative parts of each file, produces short structured labels, batches requests, and runs in customer-controlled environments.\u003c/p\u003e\n"},{"n":28,"title":"IR Trends Q2 2026: Phishing and weaponized remote management tools drive attack chains","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/ir-trends-q2-2026/","time":"10:00","priority":"MAY READ","score":0,"tldr":"","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":[],"insights":[],"referencedReports":[],"body":""},{"n":30,"title":"Teams File Sharing Risk: Insider Threat Exposure","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/that-file-in-teams-your-entire-organization-might-be-able-to-access-it","time":"12:40","priority":"MAY READ","score":0,"tldr":"","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":[],"insights":[],"referencedReports":[],"body":""},{"n":31,"title":"AWS Data Security: Top Risks \u0026 Fixes | Cyera Research","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/assessing-the-top-data-security-risks-in-aws-environments","time":"12:40","priority":"MAY READ","score":0,"tldr":"","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":[],"insights":[],"referencedReports":[],"body":""},{"n":32,"title":"Are Your Salesforce Permissions Protect
