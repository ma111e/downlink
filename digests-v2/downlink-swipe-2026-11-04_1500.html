<script type="application/json" id="dl-articles">[{"n":6,"title":"Debian and Ubuntu APT Flaw Lets MitM Attackers Swap Verified Packages and Run Code as Root","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/debian-and-ubuntu-apt-flaw-lets-mitm.html","time":"17:00","priority":"SHOULD READ","score":88,"tldr":"A critical APT flaw, CVE-2026-109518, lets man-in-the-middle attackers who can alter HTTP package traffic abuse download retries to replace verified Debian or Ubuntu packages with malicious code that executes as root. Debian and Ubuntu have issued APT updates, and systems using default retry settings on Debian 12 or Ubuntu 22.04 and later are particularly exposed.","briefOverview":"\u003cp\u003eA critical flaw in APT, the package manager used by Debian and Ubuntu, can allow an attacker who modifies package-download traffic to replace a checked package with a malicious one. The malicious package can then run code as root when installed. The issue is tracked as CVE-2026-109518, and Debian, Ubuntu, and APT developers published advisories on November 4.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires APT to retry failed downloads, a behavior enabled by default in Debian 12 and Ubuntu 22.04 and later. According to the advisories, an attacker who can alter HTTP traffic, including through a malicious mirror or proxy, can use redirects and temporary server errors to trigger retries and swap the download. Debian released fixed APT versions, while Ubuntu published updated APT builds for Ubuntu 22.04 LTS, 24.04 LTS, 26.04 LTS, and 26.10; older releases may also be affected if the Acquire::Retries setting was enabled.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-109518 is a critical APT flaw that can allow an attacker who modifies package-download traffic to swap a checked package for a malicious one and run code as root.","The attack relies on APT retrying failed downloads, which is enabled by default in Debian 12 and Ubuntu 22.04 and later.","An attacker can use HTTP redirects and temporary server errors to trigger retries when a system installs a package.","Debian has released fixed APT versions, while Ubuntu published updated APT builds for Ubuntu 22.04 LTS, 24.04 LTS, 26.04 LTS, and 26.10.","Older releases such as Debian 11 and Ubuntu 20.04 are not exposed by default, but may be affected if the Acquire::Retries setting was enabled."],"insights":["Systems on older Debian and Ubuntu releases may still be exposed if scripts enabled the Acquire::Retries setting, even though those releases are not vulnerable by default.","The advisories describe the attack over HTTP but do not state whether package sources accessed through HTTPS are affected.","At the time reported, Debian's testing branch was still using vulnerable APT version 3.3.5 despite fixed versions being released elsewhere.","The published advisories did not provide a workaround for systems that cannot install an update immediately."],"referencedReports":[{"title":"CVE-2026-109518 security advisory","url":"https://lists.debian.org/debian-security-announce/2026/msg00526.html","publisher":"debian","context":"The article cites Debian's advisory as one of the notices published about the APT flaw.","category":"advisory","primary":true},{"title":"CVE-2026-109518","url":"https://ubuntu.com/security/CVE-2026-109518","publisher":"ubuntu","context":"The article cites Ubuntu's security advisory for affected releases, severity, and attack conditions.","category":"advisory","primary":true},{"title":"APT developer advisory for CVE-2026-109518","url":"https://lists.debian.org/deity/2026/11/msg00005.html","publisher":"apt developers","context":"The article cites APT developers' advisory for the flaw's critical rating and retry-based attack details.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical flaw in APT, the package manager used by Debian and Ubuntu, can allow an attacker who modifies package-download traffic to replace a checked package with a malicious one. The malicious package can then run code as root when installed. The issue is tracked as CVE-2026-109518, and Debian, Ubuntu, and APT developers published advisories on November 4.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires APT to retry failed downloads, a behavior enabled by default in Debian 12 and Ubuntu 22.04 and later. According to the advisories, an attacker who can alter HTTP traffic, including through a malicious mirror or proxy, can use redirects and temporary server errors to trigger retries and swap the download. Debian released fixed APT versions, while Ubuntu published updated APT builds for Ubuntu 22.04 LTS, 24.04 LTS, 26.04 LTS, and 26.10; older releases may also be affected if the Acquire::Retries setting was enabled.\u003c/p\u003e\n"},{"n":7,"title":"SonicWall Won't Patch EoL GMS Flaws That Could Expose Files, Alter Database Records","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sonicwall-wont-patch-eol-gms-flaws-that.html","time":"17:00","priority":"SHOULD READ","score":84,"tldr":"SonicWall will not patch two serious vulnerabilities in end-of-life Global Management System (GMS) versions 9.5.2 and earlier, including an unauthenticated file-read flaw and a post-authentication SQL injection issue. Organizations are urged to migrate to SonicWall Network Security Manager (NSM).","briefOverview":"\u003cp\u003eSonicWall warned of two vulnerabilities affecting end-of-life Global Management System (GMS) version 9.5.2 and earlier. The company said it will not provide remediation or security updates because the affected product has reached end of life. It strongly encouraged organizations still using GMS to upgrade to SonicWall Network Security Manager (NSM).\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109593, rated 9.1, is an unauthenticated file-read issue that could allow a network-based attacker to read internal GMS files and potentially obtain sensitive information. CVE-2026-109594, rated 6.8, is a post-authentication SQL injection issue that could enable an authenticated attacker to access or alter GMS database information under specific conditions. The article also notes that a separate SonicWall flaw, CVE-2026-102255, has been actively exploited, with Previdian recording 2,541 attack attempts from eight IP addresses since October 9, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall disclosed two vulnerabilities affecting end-of-life Global Management System (GMS) version 9.5.2 and earlier, and said it will not release fixes for them.","CVE-2026-109593 has a CVSS score of 9.1 and could let an unauthenticated network-based attacker read internal GMS files.","CVE-2026-109594 has a CVSS score of 6.8 and could allow an authenticated attacker, under specific conditions, to access or modify information in the GMS database through SQL injection.","SonicWall strongly recommends that organizations using GMS upgrade to SonicWall Network Security Manager (NSM).","The article also notes active exploitation of the separate SonicWall CVE-2026-102255 SSRF flaw, with Previdian recording 2,541 attempts from eight IP addresses since October 9, 2026."],"insights":["Because GMS has reached end of life, organizations cannot wait for a vendor patch for either newly disclosed issue; SonicWall identifies upgrading to Network Security Manager as the available risk-reduction path.","The more severe GMS issue, CVE-2026-109593, does not require an attacker to log in, while the lower-severity database issue requires authenticated access.","The disclosure follows recent active exploitation of a separate critical SonicWall flaw, CVE-2026-102255, for which Previdian recorded 2,541 attack attempts from eight IP addresses."],"referencedReports":[{"title":"SNWLID-2026-0019","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0019","publisher":"sonicwall","context":"The article cites SonicWall's security advisory warning of two unpatched vulnerabilities in end-of-life Global Management System releases.","category":"advisory","primary":true}],"body":"\u003cp\u003eSonicWall warned of two vulnerabilities affecting end-of-life Global Management System (GMS) version 9.5.2 and earlier. The company said it will not provide remediation or security updates because the affected product has reached end of life. It strongly encouraged organizations still using GMS to upgrade to SonicWall Network Security Manager (NSM).\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109593, rated 9.1, is an unauthenticated file-read issue that could allow a network-based attacker to read internal GMS files and potentially obtain sensitive information. CVE-2026-109594, rated 6.8, is a post-authentication SQL injection issue that could enable an authenticated attacker to access or alter GMS database information under specific conditions. The article also notes that a separate SonicWall flaw, CVE-2026-102255, has been actively exploited, with Previdian recording 2,541 attack attempts from eight IP addresses since October 9, 2026.\u003c/p\u003e\n"},{"n":1,"title":"Cyberattack disrupts blood storage refrigeration systems in France","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cyberattack-disrupts-blood-storage-refrigeration-systems-in-france/","time":"18:02","priority":"SHOULD READ","score":82,"tldr":"A cyberattack on a refrigeration supplier altered temperature and defrost settings at three French Blood Establishment facilities, putting stored blood products at risk. Monitoring systems enabled staff to secure or transfer the products, with no reported losses or disruption to blood services.","briefOverview":"\u003cp\u003eFrance’s national blood service, the Établissement français du sang (EFS), said a November 2 cyberattack on a refrigeration equipment supplier affected systems at three of its facilities. The incident raised temperature and defrost thresholds in cold-storage chambers used for blood products and biological samples. EFS said it was not directly targeted and that its monitoring and alarm systems detected the changes quickly. Staff repaired affected equipment or transferred products to other refrigerated facilities, and EFS reported no health impact, no product losses, and no disruption to collection or distribution.\u003c/p\u003e\n\n\u003cp\u003eCoolworld Rentals said a limited number of its refrigeration units were affected through a vulnerability in a third-party component, though it did not comment on individual cases. EFS is working with France’s ANSSI and the Ministry of Health and has increased monitoring of refrigeration equipment and temperatures. The event follows attacks on supermarket refrigeration systems in France and other European countries that remotely changed temperature settings or activated defrost functions. CISA previously disclosed CVE-2025-41450 and CVE-2025-41451 in Danfoss AK-SM 8xxA controllers, which could enable authentication bypass and remote command execution, but the article says their use in these incidents has not been confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A cyberattack on November 2 affected remote monitoring and control systems for refrigeration equipment at three French Blood Establishment facilities, raising temperature and defrost thresholds in cold-storage chambers.","The French Blood Establishment said it was not directly targeted; its refrigeration supplier was affected, and Coolworld Rentals confirmed that a third-party component vulnerability affected a limited number of its units.","The organization’s monitoring and alarm systems detected the temperature changes, enabling staff to repair affected equipment or transfer blood products and biological samples to other refrigerated facilities.","The French Blood Establishment reported no health impact, no loss of blood products, and no interruption to blood collection or distribution.","The incident followed attacks on refrigeration systems at supermarkets in France and several other European countries, where temperature settings or defrost functions were remotely altered."],"insights":["The blood service was affected indirectly through a refrigeration supplier, illustrating that a disruption at an equipment provider can create risks for critical health operations even when the health organization itself is not the direct target.","Temperature monitoring and alarms limited the incident’s impact by allowing staff to repair equipment or move blood products before damage was reported.","The same type of remote refrigeration disruption has affected supermarkets in multiple European countries, extending the consequences beyond food spoilage to potentially critical medical supplies.","Although two Danfoss controller flaws can allow authentication bypass and remote command execution, the article says it has not been confirmed that they were used in these incidents."],"referencedReports":[{"title":"ICSA-25-140-03","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-25-140-03","publisher":"cisa","context":"The article cites this CISA industrial control systems advisory as disclosing CVE-2025-41450 and CVE-2025-41451 in Danfoss AK-SM 8xxA controllers.","category":"advisory","primary":false}],"body":"\u003cp\u003eFrance’s national blood service, the Établissement français du sang (EFS), said a November 2 cyberattack on a refrigeration equipment supplier affected systems at three of its facilities. The incident raised temperature and defrost thresholds in cold-storage chambers used for blood products and biological samples. EFS said it was not directly targeted and that its monitoring and alarm systems detected the changes quickly. Staff repaired affected equipment or transferred products to other refrigerated facilities, and EFS reported no health impact, no product losses, and no disruption to collection or distribution.\u003c/p\u003e\n\n\u003cp\u003eCoolworld Rentals said a limited number of its refrigeration units were affected through a vulnerability in a third-party component, though it did not comment on individual cases. EFS is working with France’s ANSSI and the Ministry of Health and has increased monitoring of refrigeration equipment and temperatures. The event follows attacks on supermarket refrigeration systems in France and other European countries that remotely changed temperature settings or activated defrost functions. CISA previously disclosed CVE-2025-41450 and CVE-2025-41451 in Danfoss AK-SM 8xxA controllers, which could enable authentication bypass and remote command execution, but the article says their use in these incidents has not been confirmed.\u003c/p\u003e\n"},{"n":2,"title":"mSecure password manager hack prompts password reset warnings","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/msecure-password-manager-hack-prompts-password-reset-warnings/","time":"16:00","priority":"SHOULD READ","score":82,"tldr":"mSeven Software says an attacker stole an encrypted mSecure Cloud customer database and is urging current and former users to change stored passwords, reset MFA, and remove passkeys. Although the company says it has no evidence vault contents were accessed, stolen encrypted vaults may be vulnerable to offline cracking if master passwords were weak.","briefOverview":"\u003cp\u003emSeven Software warned current and former mSecure password-manager customers after discovering suspicious activity associated with the application. The company advised customers to change passwords, reset or re-enroll two-factor authentication methods, and remove existing passkeys. Its initial notification did not say what systems were compromised, whether customer data was stolen, or how many people were affected.\u003c/p\u003e\n\n\u003cp\u003eCustomers shared support responses stating that a hacker stole an encrypted mSecure Cloud database containing information from current and former users. The reported incident applies only to users who synchronized their password databases through mSecure Cloud, and mSeven reportedly said it had no evidence that the attacker accessed the confidential information within the encrypted database. mSecure says it uses AES-256 encryption and encrypts vault data locally before uploading it, under a design in which the company says it cannot view decrypted vault contents.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that stolen encrypted password vaults can still present risks if attackers can crack weak master passwords through offline attempts. It cites the 2022 LastPass breach, where stolen encrypted vault backups were later linked by researchers to cryptocurrency thefts involving reportedly cracked weak master passwords. Customers have criticized the lack of detail about how the mSecure breach occurred and its possible impact.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["mSeven Software notified current and former mSecure customers of suspicious activity involving the mSecure password-management application.","Customers who synchronized their data through mSecure Cloud were reportedly affected after a hacker stole an encrypted database containing information for current and former users.","mSeven advised customers to change stored passwords, reset or re-enroll two-factor authentication methods, and remove existing passkeys.","The company reportedly said it has no evidence that the attacker accessed confidential information inside the encrypted database.","mSecure says its vault data is encrypted locally using AES-256 before being sent to company servers under a zero-knowledge design."],"insights":["The reported exposure was limited to people who synchronized vaults with mSecure Cloud, meaning users who did not use that cloud-sync service were not included in the reported scope.","Encryption does not eliminate risk after a vault database is stolen: the article notes that attackers can attempt to crack vaults offline when users have weak master passwords.","The recommended response extends beyond changing passwords because existing two-factor authentication methods and passkeys associated with stored accounts may also need to be replaced or removed.","The article cites the 2022 LastPass breach as an example in which stolen encrypted vault backups were later linked by researchers to cryptocurrency theft involving cracked weak master passwords."],"referencedReports":[],"body":"\u003cp\u003emSeven Software warned current and former mSecure password-manager customers after discovering suspicious activity associated with the application. The company advised customers to change passwords, reset or re-enroll two-factor authentication methods, and remove existing passkeys. Its initial notification did not say what systems were compromised, whether customer data was stolen, or how many people were affected.\u003c/p\u003e\n\n\u003cp\u003eCustomers shared support responses stating that a hacker stole an encrypted mSecure Cloud database containing information from current and former users. The reported incident applies only to users who synchronized their password databases through mSecure Cloud, and mSeven reportedly said it had no evidence that the attacker accessed the confidential information within the encrypted database. mSecure says it uses AES-256 encryption and encrypts vault data locally before uploading it, under a design in which the company says it cannot view decrypted vault contents.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that stolen encrypted password vaults can still present risks if attackers can crack weak master passwords through offline attempts. It cites the 2022 LastPass breach, where stolen encrypted vault backups were later linked by researchers to cryptocurrency thefts involving reportedly cracked weak master passwords. Customers have criticized the lack of detail about how the mSecure breach occurred and its possible impact.\u003c/p\u003e\n"},{"n":3,"title":"Google Calendar phishing campaign hijacks sessions, bypasses MFA","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-calendar-phishing-campaign-hijacks-sessions-bypasses-mfa/","time":"15:00","priority":"SHOULD READ","score":82,"tldr":"Material Security says its Operation CloudFire disrupted a phishing campaign that used Google Calendar and Drive lures, trusted Google redirects, and reverse-proxy sign-in pages to steal live Google Workspace sessions and bypass MFA. The campaign relied on compromised sender accounts and rapidly rotated infrastructure, highlighting the need to monitor Workspace sessions and OAuth grants rather than relying solely on link reputation.","briefOverview":"\u003cp\u003eMaterial Security reported a phishing operation, dubbed Operation CloudFire, that has targeted corporate Google users since mid-August 2026. The campaign delivered Google Calendar invitations and later Google Drive sharing lures, often from compromised accounts associated with organizations recipients had previously contacted. The messages used trusted Google redirect links or related Google services, causing domain, certificate, and reputation checks to appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe attackers placed a live reverse proxy in front of Google’s genuine sign-in flow, allowing them to capture active sessions as victims entered passwords and completed real MFA prompts. The infrastructure used Cloudflare Turnstile and browser-generated pages to hinder scanning, while disposable domains and certificates were rotated frequently. A captured Google session can provide access to mail, Drive, and the ability to grant OAuth access in the victim’s name.\u003c/p\u003e\n\n\u003cp\u003eMaterial reported malicious gateway and backend URLs to Cloudflare, which validated the phishing content and applied warning interstitials to reported destinations. Over one month, Material recorded 68,676 blocked messages, 2,112 malicious URLs, 897 domains taken down, and 8,570 compromised sender addresses across 6,354 root domains. Although activity from this group appears to have dispersed, the article says the operator has an unfinished Microsoft 365 branch and may pivot to a different brand.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Since mid-August 2026, a phishing operation has used Google Calendar invitations and later Google Drive file and document-share invitations to target corporate users.","The campaign used Google redirect links, Cloudflare Turnstile challenges, and a live reverse proxy of Google’s sign-in page to capture active Google sessions while victims completed real MFA prompts.","Captured sessions can provide access to Gmail, Google Drive, and the ability to grant OAuth access in the victim’s name.","Material Security’s Operation CloudFire reported malicious gateway and backend URLs to Cloudflare, which applied phishing warning pages to validated destinations.","Over one month, Material recorded 68,676 blocked campaign messages, 2,112 malicious URLs analyzed, 897 domains taken down, and 8,570 compromised sender addresses across 6,354 root domains."],"insights":["The campaign was designed so conventional reputation checks appeared reassuring: recipients saw legitimate Google links, clean sender histories, and often a known contact or organization.","Multi-factor authentication did not prevent account takeover because the attackers relayed real-time codes and approval prompts to Google while capturing the resulting active session.","Calendar invitations were a key delivery path, making them difficult for security tools focused primarily on inspecting email in transit.","The article emphasizes that organizations need to be able to review Workspace logs, revoke active sessions, remove unauthorized app permissions, and reset accounts within an hour because a stolen live session can quickly reach email and files.","Reporting the attacker’s gateway and receiving sites to Cloudflare forced the operator to replace domains, routing, and certificates, raising the cost of each new phishing wave."],"referencedReports":[],"body":"\u003cp\u003eMaterial Security reported a phishing operation, dubbed Operation CloudFire, that has targeted corporate Google users since mid-August 2026. The campaign delivered Google Calendar invitations and later Google Drive sharing lures, often from compromised accounts associated with organizations recipients had previously contacted. The messages used trusted Google redirect links or related Google services, causing domain, certificate, and reputation checks to appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe attackers placed a live reverse proxy in front of Google’s genuine sign-in flow, allowing them to capture active sessions as victims entered passwords and completed real MFA prompts. The infrastructure used Cloudflare Turnstile and browser-generated pages to hinder scanning, while disposable domains and certificates were rotated frequently. A captured Google session can provide access to mail, Drive, and the ability to grant OAuth access in the victim’s name.\u003c/p\u003e\n\n\u003cp\u003eMaterial reported malicious gateway and backend URLs to Cloudflare, which validated the phishing content and applied warning interstitials to reported destinations. Over one month, Material recorded 68,676 blocked messages, 2,112 malicious URLs, 897 domains taken down, and 8,570 compromised sender addresses across 6,354 root domains. Although activity from this group appears to have dispersed, the article says the operator has an unfinished Microsoft 365 branch and may pivot to a different brand.\u003c/p\u003e\n"},{"n":4,"title":"NIKKE PC game launcher hacked to spread remote access, data-stealing malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/nikke-pc-game-launcher-hacked-to-spread-remote-access-data-stealing-malware/","time":"16:58","priority":"SHOULD READ","score":82,"tldr":"Hackers tampered with Goddess of Victory: NIKKE’s PC launcher scripts in a supply-chain compromise, potentially deploying a K2F remote-access backdoor and tools to steal browser credentials and cryptocurrency wallet data. Players should update the launcher, scan affected systems, and reset sensitive credentials from a clean device if compromise is suspected.","briefOverview":"\u003cp\u003eDevelopers of Goddess of Victory: NIKKE confirmed that the game’s PC launcher scripts may have been tampered with by a third party. Level Infinite issued a client update on November 4 at approximately 02:30 UTC+9 and said it was investigating the scope of the incident. The game, developed by South Korean firm Shift Up and published by Level Infinite, has reportedly surpassed 45 million downloads since launching in 2022.\u003c/p\u003e\n\n\u003cp\u003eIndependent researcher MotherSphere reported that four JavaScript files on Level Infinite’s official CDN were modified to load additional code from the \u003ccode\u003einsightjs[.]com\u003c/code\u003e and \u003ccode\u003einsightjs[.]org\u003c/code\u003e domains. The downloaded code reportedly used launcher functionality to run a LuaJIT payload, \u003ccode\u003einsight.bundle\u003c/code\u003e, which installed a remote-access agent called K2F. The agent could execute commands, access and download local files, take screenshots, collect NIKKE account credentials, and collect browser data; an associated DLL also contained code for stealing cryptocurrency wallet recovery phrases and private keys. Potentially affected players are advised to scan their systems with updated antivirus software, while compromised users should reinstall Windows and change sensitive credentials from a clean device.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Goddess of Victory: NIKKE developers confirmed that third parties may have tampered with PC launcher script files and issued a client update on November 4 at approximately 02:30 UTC+9.","Researcher MotherSphere reported that four JavaScript files on Level Infinite’s official CDN were modified to download additional code from the attacker-controlled insightjs[.]com and insightjs[.]org domains.","The downloaded code reportedly used the launcher to execute a LuaJIT payload named insight.bundle that installed a remote-access agent called K2F.","K2F could execute commands, access local files, capture screenshots, collect NIKKE account credentials, and steal information stored in web browsers.","A malicious Windows DLL associated with the incident contained code to collect cryptocurrency wallet recovery phrases and private keys from browser extensions including MetaMask, Phantom, and Coinbase Wallet."],"insights":["At least one tampered launcher script may have remained accessible after Level Infinite deployed its client update, according to the researcher’s report that a fourth modified file was still being served on November 3.","Players can check for the string \"k2f_chan registered\" in the launcher’s debug.log file to determine whether the malicious Lua agent ran, although this does not establish whether the persistent DLL was loaded.","The attackers’ backup domain later displayed a multilingual warning telling players to close the launcher, but the article notes it is unclear who controlled the domain when that warning appeared.","The article advises potentially affected players to run an updated antivirus scan, while those confirmed compromised should reinstall Windows and change sensitive credentials from a clean device."],"referencedReports":[{"title":"MotherSphere's NIKKE launcher compromise report","url":"https://gist.github.com/MotherSphere/d6c049a09ba8ac3085c51ee9df24a4e5","publisher":"mothersphere","context":"The article cites this independent researcher’s GitHub report for details on the four modified JavaScript files, the malicious payload delivery, and K2F capabilities.","category":"research","primary":true}],"body":"\u003cp\u003eDevelopers of Goddess of Victory: NIKKE confirmed that the game’s PC launcher scripts may have been tampered with by a third party. Level Infinite issued a client update on November 4 at approximately 02:30 UTC+9 and said it was investigating the scope of the incident. The game, developed by South Korean firm Shift Up and published by Level Infinite, has reportedly surpassed 45 million downloads since launching in 2022.\u003c/p\u003e\n\n\u003cp\u003eIndependent researcher MotherSphere reported that four JavaScript files on Level Infinite’s official CDN were modified to load additional code from the \u003ccode\u003einsightjs[.]com\u003c/code\u003e and \u003ccode\u003einsightjs[.]org\u003c/code\u003e domains. The downloaded code reportedly used launcher functionality to run a LuaJIT payload, \u003ccode\u003einsight.bundle\u003c/code\u003e, which installed a remote-access agent called K2F. The agent could execute commands, access and download local files, take screenshots, collect NIKKE account credentials, and collect browser data; an associated DLL also contained code for stealing cryptocurrency wallet recovery phrases and private keys. Potentially affected players are advised to scan their systems with updated antivirus software, while compromised users should reinstall Windows and change sensitive credentials from a clean device.\u003c/p\u003e\n"},{"n":8,"title":"Researchers Uncover Prompt Adware Hidden in OpenAI Codex Jailbreak Toolkit","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/researchers-uncover-prompt-adware.html","time":"16:06","priority":"MAY READ","score":74,"tldr":"Check Point found that the Haiou OpenAI Codex jailbreak bundle persistently alters agent instructions to display ads for a third-party LLM gateway, illustrating a new \"prompt adware\" supply-chain risk from untrusted AI configurations and skills.","briefOverview":"\u003cp\u003eCheck Point Research disclosed a jailbreak bundle called Haiou that alters OpenAI Codex configuration and global instructions to insert advertisements for a third-party AI gateway into later agent responses. The researchers call this behavior \u0026ldquo;prompt adware,\u0026rdquo; extending unwanted advertising from conventional software into AI-agent instructions. The advertised service, zz.aiapi2025[.]top, is described as an opaque, OpenAI-compatible LLM gateway. Check Point said the free jailbreak bundle likely serves as an acquisition channel for the gateway’s paid service.\u003c/p\u003e\n\n\u003cp\u003eHaiou uses prompt-injection methods such as role-playing and reframing cybersecurity requests as Capture The Flag scenarios, while also installing skills for penetration testing, cracking, and reverse engineering. Its persistent instruction changes can make greetings including \u0026ldquo;Seagull,\u0026rdquo; \u0026ldquo;hi,\u0026rdquo; \u0026ldquo;hello,\u0026rdquo; and \u0026ldquo;hey\u0026rdquo; trigger advertisements. The haiou-codex GitHub repository is presented as a Chinese technical-personality and security-workflow enhancement package for Codex, and the jailbreak is also included in the Codex-X graphical configuration tool. Check Point warned that prompts, skills, and third-party components influencing enterprise AI agents become part of the trust chain and can introduce undesirable behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research identified the Haiou OpenAI Codex jailbreak bundle as \"prompt adware\" because it modifies an AI agent’s instructions to insert advertisements into later responses.","Haiou changes Codex configuration and global instruction files so greetings such as \"hi,\" \"hello,\" and \"Seagull\" can trigger advertisements for zz.aiapi2025[.]top, an OpenAI-compatible LLM gateway.","The bundle uses prompt-injection approaches including role-playing and presenting cybersecurity requests as Capture The Flag scenarios, and it installs skills focused on penetration testing, cracking, and reverse engineering.","The haiou-codex GitHub repository presents itself as a local enhancement package for Codex, and the jailbreak is also bundled with the Codex-X graphical configuration tool.","Check Point said that third-party prompts, skills, and components can become part of the trust chain as AI agents are adopted in enterprise environments."],"insights":["The unwanted behavior is delivered through natural-language instructions and configuration files rather than a conventional executable program, which Check Point noted may make it less recognizable to users and security teams.","Haiou’s advertising instructions are persistent because they are inserted into the agent’s global instruction file, allowing ordinary greetings to trigger promotions in future responses.","The package combines a jailbreak with promotion of an opaque, OpenAI-compatible LLM gateway, which Check Point said is likely intended to use the free bundle to attract users to a paid service.","Although Codex is not officially available in mainland China, the package’s Chinese-focused branding and related Codex-X tool indicate it may be aimed at people or organizations seeking access to Western AI coding assistants."],"referencedReports":[{"title":"Free the Model, Sell the Gateway: Prompt Adware Hidden in Jailbreak Bundles","url":"https://research.checkpoint.com/2026/free-the-model-sell-the-gateway-prompt-adware-hidden-in-jailbreak-bundles/","publisher":"check-point-research","context":"The article relies on Check Point Research's technical report for its analysis of the Haiou Codex jailbreak bundle and its persistent advertising behavior.","category":"research","primary":true}],"body":"\u003cp\u003eCheck Point Research disclosed a jailbreak bundle called Haiou that alters OpenAI Codex configuration and global instructions to insert advertisements for a third-party AI gateway into later agent responses. The researchers call this behavior \u0026ldquo;prompt adware,\u0026rdquo; extending unwanted advertising from conventional software into AI-agent instructions. The advertised service, zz.aiapi2025[.]top, is described as an opaque, OpenAI-compatible LLM gateway. Check Point said the free jailbreak bundle likely serves as an acquisition channel for the gateway’s paid service.\u003c/p\u003e\n\n\u003cp\u003eHaiou uses prompt-injection methods such as role-playing and reframing cybersecurity requests as Capture The Flag scenarios, while also installing skills for penetration testing, cracking, and reverse engineering. Its persistent instruction changes can make greetings including \u0026ldquo;Seagull,\u0026rdquo; \u0026ldquo;hi,\u0026rdquo; \u0026ldquo;hello,\u0026rdquo; and \u0026ldquo;hey\u0026rdquo; trigger advertisements. The haiou-codex GitHub repository is presented as a Chinese technical-personality and security-workflow enhancement package for Codex, and the jailbreak is also included in the Codex-X graphical configuration tool. Check Point warned that prompts, skills, and third-party components influencing enterprise AI agents become part of the trust chain and can introduce undesirable behavior.\u003c/p\u003e\n"},{"n":5,"title":"Ukrainian news outlet Kyiv Independent hit by suspected Russian cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-kyiv-independent-cyberattack","time":"16:15","priority":"MAY READ","score":72,"tldr":"The Kyiv Independent’s website and newsletter systems were compromised to distribute false Russian- and English-language claims, including fabricated nuclear and physical attacks involving President Zelensky. The outlet suspects Russian actors but has not provided technical attribution evidence and says member and donor payment data was unaffected.","briefOverview":"\u003cp\u003eThe Kyiv Independent said a suspected Russian cyberattack disrupted its website after attackers accessed its website management system and a service used to distribute newsletters. The access allowed the attackers to post false messages on the publication’s website and send fabricated emails to subscribers in Russian and English. The outlet said it suspects Russian actors based on the content of the messages but has not provided technical evidence linking the breach to Moscow.\u003c/p\u003e\n\n\u003cp\u003eOne malicious email falsely claimed that President Volodymyr Zelensky had launched a nuclear warhead at Kyiv following a meeting with Russian President Vladimir Putin, while other messages made fabricated claims about a physical attack on Zelensky. The publication removed the website posts quickly and said its members’ and donors’ banking information was not compromised because payments are handled through secure third-party services. Staff are working with cybersecurity specialists to investigate the breach, identify weaknesses, and prevent further intrusions, and the incident followed a separate compromise of Ukraine’s air raid alert app that sent false threat warnings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Kyiv Independent said attackers accessed its website management system and newsletter distribution service, enabling them to post false content and email subscribers in Russian and English.","One fraudulent Russian-language email falsely claimed that President Volodymyr Zelensky had launched a nuclear warhead at Kyiv after meeting Russian President Vladimir Putin.","The publication suspects Russian actors based on the messages’ content but did not provide technical evidence tying the intrusion to Moscow.","The Kyiv Independent said members’ and donors’ banking information was not compromised because payments are processed by secure third-party services.","Staff are working with cybersecurity specialists to investigate the breach, identify weaknesses, and prevent additional intrusions."],"insights":["The intrusion affected both the publication’s website and subscriber email channel, allowing false claims to appear through multiple sources that readers may regard as trusted.","The fabricated messages focused on nuclear threats and harm to Ukraine’s president, illustrating how control of a news outlet’s communications can be used to create urgent public fear rather than merely disrupt publishing.","The Kyiv Independent’s use of third-party payment processing limited the incident’s impact on members and donors because the publication said their banking information was not compromised.","The attack followed a separate compromise of Ukraine’s air raid alert app that also delivered fabricated nuclear and chemical warnings, although the article says no connection between the incidents has been confirmed."],"referencedReports":[],"body":"\u003cp\u003eThe Kyiv Independent said a suspected Russian cyberattack disrupted its website after attackers accessed its website management system and a service used to distribute newsletters. The access allowed the attackers to post false messages on the publication’s website and send fabricated emails to subscribers in Russian and English. The outlet said it suspects Russian actors based on the content of the messages but has not provided technical evidence linking the breach to Moscow.\u003c/p\u003e\n\n\u003cp\u003eOne malicious email falsely claimed that President Volodymyr Zelensky had launched a nuclear warhead at Kyiv following a meeting with Russian President Vladimir Putin, while other messages made fabricated claims about a physical attack on Zelensky. The publication removed the website posts quickly and said its members’ and donors’ banking information was not compromised because payments are handled through secure third-party services. Staff are working with cybersecurity specialists to investigate the breach, identify weaknesses, and prevent further intrusions, and the incident followed a separate compromise of Ukraine’s air raid alert app that sent false threat warnings.\u003c/p\u003e\n"},{"n":9,"title":"Leveraging Microsoft Graph API Change Notifications for Data Exfiltration","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/leveraging-microsoft-graph-api-change-notifications-for-data-exfiltration/","time":"16:22","priority":"MAY READ","score":70,"tldr":"Microsoft Graph Rich Change Notifications can be abused by attackers with compromised user tokens or privileged app permissions to continuously exfiltrate Teams messages and Outlook email previews to attacker-controlled webhooks through Microsoft infrastructure. Organizations should inventory Graph subscriptions and monitor MicrosoftGraphActivityLogs and GraphNotificationsActivityLogs for suspicious subscription creation and activity.","briefOverview":"\u003cp\u003eNetSPI describes how Microsoft Graph Change Notifications, particularly Rich Notifications that include encrypted resource data, can be used for data exfiltration after a user account or service principal has been compromised. An attacker can create a subscription that sends notifications to an external webhook, where the attacker can decrypt and store the received content. The article demonstrates subscriptions for Outlook email and Microsoft Teams messages, with Microsoft infrastructure delivering the notifications.\u003c/p\u003e\n\n\u003cp\u003eIn user scenarios, delegated Graph permissions such as Mail.Read and Chat.Read can support subscriptions scoped to the compromised user’s mailbox or chats. Teams notifications can contain full message bodies, while Outlook notifications can return a bodyPreview limited to 255 characters; the article shows that draft-email updates can be used to send content in chunks. A compromised application with Chat.Read.All can subscribe to /chats/getAllMessages and receive Teams messages across the organization. Administrators can use Get-MgSubscription to review subscriptions and query MicrosoftGraphActivityLogs and GraphNotificationsActivityLogs for subscription activity and triggered notifications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Graph Change Notifications let users and service principals subscribe to supported Microsoft 365 resources and receive updates at external webhooks or Azure Event Hubs and Event Grids.","Rich Notifications can include encrypted resource data, allowing a compromised user with delegated Mail.Read, Mail.ReadWrite, Chat.Read, or Chat.ReadWrite permissions to receive Outlook email previews or Teams message content at an attacker-controlled webhook.","Teams message Rich Notifications can return full message bodies, while Outlook message subscriptions allow the bodyPreview property, which is limited to the first 255 characters of an email body.","A compromised service principal with the application permission Chat.Read.All can create a Rich Notification subscription for /chats/getAllMessages and receive Teams messages across the organization.","Administrators can list tenant subscriptions with Get-MgSubscription and monitor MicrosoftGraphActivityLogs for subscription API activity and GraphNotificationsActivityLogs for triggered notification events."],"insights":["A compromised user can obtain the delegated permissions needed for Rich Notifications through well-documented pre-consented Microsoft first-party applications, including the Microsoft Office application used in the article's device-code example.","Although Outlook Rich Notifications limit email content to a 255-character body preview, the article demonstrates that content can be split across saved draft-email updates to send multiple chunks through separate notifications.","Rich Notification subscriptions are short-lived—about one day for Outlook messages and three days for Teams messages in the described scenarios—but can be extended before expiration by an attacker with persistent access.","The Entra Admin Portal does not provide a dedicated view of tenant Graph subscriptions; a Global Administrator using an app with Subscription.Read.All must use Get-MgSubscription to list all user and application subscriptions.","MicrosoftGraphActivityLogs records subscription API operations but not webhook deliveries, while the newer GraphNotificationsActivityLogs records each triggered notification and can be correlated to its parent subscription using the subscription identifier."],"referencedReports":[],"body":"\u003cp\u003eNetSPI describes how Microsoft Graph Change Notifications, particularly Rich Notifications that include encrypted resource data, can be used for data exfiltration after a user account or service principal has been compromised. An attacker can create a subscription that sends notifications to an external webhook, where the attacker can decrypt and store the received content. The article demonstrates subscriptions for Outlook email and Microsoft Teams messages, with Microsoft infrastructure delivering the notifications.\u003c/p\u003e\n\n\u003cp\u003eIn user scenarios, delegated Graph permissions such as Mail.Read and Chat.Read can support subscriptions scoped to the compromised user’s mailbox or chats. Teams notifications can contain full message bodies, while Outlook notifications can return a bodyPreview limited to 255 characters; the article shows that draft-email updates can be used to send content in chunks. A compromised application with Chat.Read.All can subscribe to /chats/getAllMessages and receive Teams messages across the organization. Administrators can use Get-MgSubscription to review subscriptions and query MicrosoftGraphActivityLogs and GraphNotificationsActivityLogs for subscription activity and triggered notifications.\u003c/p\u003e\n"},{"n":10,"title":"Mi Scusi, My SCSI: Abusing iSCSI Target Server","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/11/04/unauthenticated-iscsi-target-server/","time":"17:00","priority":"MAY READ","score":58,"tldr":"Windows iSCSI targets configured without CHAP authentication can be accessed by impersonating authorized initiator IQNs, allowing attackers to enumerate and read shared virtual disks. This can expose sensitive clustered workloads such as Hyper-V VM disks and, potentially, Active Directory credential data unless iSCSI is authenticated, segmented, and protected.","briefOverview":"\u003cp\u003eThe article examines how Windows iSCSI Target Server configurations without CHAP authentication can allow a party to impersonate an authorized iSCSI initiator and access shared virtual disks. iSCSI provides block-level storage over TCP, and Windows can identify permitted initiators by IP address, DNS name, MAC address, or an iSCSI Qualified Name (IQN). When CHAP is not configured, the article states that establishing a connection requires knowledge of the target server, target IQN, and an accepted initiator IQN. This can bypass NTFS file permissions because access occurs directly at the virtual-disk level.\u003c/p\u003e\n\n\u003cp\u003eThe author explains that iSCSI target servers can be identified through Active Directory SPN enumeration, while Windows initiator IQNs are predictably constructed from host DNS names. An iSCSI discovery session using a candidate initiator IQN can return target IQNs available to that identity, and the author reports observing no rate limiting or brute-force protection during this process. In the demonstrated path, the retrieved disk contained Hyper-V virtual-machine files, enabling extraction of registry hives and NTDS.dit from a virtualized domain controller and subsequent credential-material recovery. The article recommends enabling CHAP, considering IPsec to reduce network-sniffing risk, and using network segmentation and host-based firewalls to isolate iSCSI storage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Windows iSCSI Target Server can be configured to permit initiator connections without CHAP authentication.","An unauthenticated iSCSI discovery session can return target names when presented with an initiator name that is listed as authorized.","Microsoft iSCSI initiator names are predictably built from a host's DNS name, allowing potential initiator names to be generated from Active Directory or DNS enumeration.","An attacker who can impersonate an authorized iSCSI initiator can access shared block storage without NTFS permission checks and may retrieve virtual hard-disk files.","The article recommends enabling CHAP, using IPsec where appropriate, and isolating iSCSI storage with network segmentation and host-based firewalls."],"insights":["Windows iSCSI Target Server registers an SPN on its Active Directory computer account when the target service starts, which can make target servers discoverable through LDAP queries.","The article reports that iSCSI initiator names are constructed from a server's DNS hostname, allowing a list of Active Directory computer names to be turned into candidate initiator identities.","The author observed no rate limiting or brute-force protection on the service, enabling repeated discovery attempts using potential initiator identities.","Accessible shared disks may expose the $RECYCLE.BIN directory, which can reveal the security identifiers of users who previously logged on interactively to systems that mounted the volume.","In the author's BloodHound Enterprise customer-tenant data, about half of tenants had at least one computer with the iSCSI target SPN, and one tenant had nearly 700."],"referencedReports":[{"title":"An Interesting Route to Domain Admin - iSCSI","url":"https://www.pentestpartners.com/security-blog/an-interesting-route-to-domain-admin-iscsi/","publisher":"Pentest Partners","context":"The article acknowledges Andrew Tierney's blog as prior work describing abuse of unauthenticated iSCSI.","category":"research","primary":false},{"title":"Setting up a Windows failover cluster","url":"https://wiki.samba.org/index.php/Setting_up_a_Windows_failover_cluster#Setup_the_iSCSI_target_server","publisher":"Samba","context":"The article references this guide for configuring iSCSI storage during Windows Server Failover Cluster setup.","category":"guide","primary":false}],"body":"\u003cp\u003eThe article examines how Windows iSCSI Target Server configurations without CHAP authentication can allow a party to impersonate an authorized iSCSI initiator and access shared virtual disks. iSCSI provides block-level storage over TCP, and Windows can identify permitted initiators by IP address, DNS name, MAC address, or an iSCSI Qualified Name (IQN). When CHAP is not configured, the article states that establishing a connection requires knowledge of the target server, target IQN, and an accepted initiator IQN. This can bypass NTFS file permissions because access occurs directly at the virtual-disk level.\u003c/p\u003e\n\n\u003cp\u003eThe author explains that iSCSI target servers can be identified through Active Directory SPN enumeration, while Windows initiator IQNs are predictably constructed from host DNS names. An iSCSI discovery session using a candidate initiator IQN can return target IQNs available to that identity, and the author reports observing no rate limiting or brute-force protection during this process. In the demonstrated path, the retrieved disk contained Hyper-V virtual-machine files, enabling extraction of registry hives and NTDS.dit from a virtualized domain controller and subsequent credential-material recovery. The article recommends enabling CHAP, considering IPsec to reduce network-sniffing risk, and using network segmentation and host-based firewalls to isolate iSCSI storage.\u003c/p\u003e\n"},{"n":11,"title":"Your AI Agent Has an Owner. Does it Have an Expiration date?","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/your-ai-agent-has-an-owner-does-it-have-an-expiration-date/","time":"16:17","priority":"MAY READ","score":42,"tldr":"Health-ISAC leaders warn that AI agents and other non-human identities can become a major healthcare breach risk unless organizations enforce ownership, expiration, vendor oversight, and stronger identity and data governance.","briefOverview":"\u003cp\u003eHealth-ISAC’s Dallas Executive Forum brought together health-sector cybersecurity leaders to discuss the realities of artificial intelligence, automation, and identity. The forum’s central view was that AI is not creating entirely new problems, but is exposing longstanding gaps in identity hygiene, vendor oversight, and data governance. The discussion focused on the need to address these weaknesses as AI use expands.\u003c/p\u003e\n\n\u003cp\u003eA key concern was the scale of non-human identities, which the article says can outnumber human users by more than 100 to 1. Healthcare organizations must prevent uncontrolled growth of AI agents from becoming a critical future breach path. The article points readers to a LinkedIn blog by Michael Hiskey for the full forum insights.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s Dallas Executive Forum brought together health sector cybersecurity leaders to discuss AI, automation, and identity.","Participants said AI is exposing longstanding gaps in identity hygiene, vendor oversight, and data governance rather than creating entirely new problems.","The article states that non-human identities can outnumber human users by more than 100 to 1.","The forum highlighted the risk that unmanaged AI agents could create agent sprawl and become a critical breach vector for healthcare organizations."],"insights":["Assigning each AI agent a clear owner and an expiration date is presented as a way to limit uncontrolled growth of non-human accounts.","The scale of non-human identities—more than 100 for every human user—means that traditional user-management weaknesses can become much harder to control.","The discussion frames AI less as a wholly new security problem than as a force that exposes existing shortcomings in access management, vendor oversight, and data governance."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Dallas Executive Forum brought together health-sector cybersecurity leaders to discuss the realities of artificial intelligence, automation, and identity. The forum’s central view was that AI is not creating entirely new problems, but is exposing longstanding gaps in identity hygiene, vendor oversight, and data governance. The discussion focused on the need to address these weaknesses as AI use expands.\u003c/p\u003e\n\n\u003cp\u003eA key concern was the scale of non-human identities, which the article says can outnumber human users by more than 100 to 1. Healthcare organizations must prevent uncontrolled growth of AI agents from becoming a critical future breach path. The article points readers to a LinkedIn blog by Michael Hiskey for the full forum insights.\u003c/p\u003e\n"}]</script>
