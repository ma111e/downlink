<script type="application/json" id="dl-articles">[{"n":6,"title":"Senate Democrats introduce bill to distribute $300 million annually to shore up water system cybersecurity","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/senate-water-cybersecurity-legislation","time":"15:45","priority":"SHOULD READ","score":78,"tldr":"Sens. Adam Schiff and Amy Klobuchar introduced the Water Cyber Shield Act to provide $300 million annually for cybersecurity upgrades to U.S. water and wastewater systems. The bill would expand EPA authority to assess vulnerabilities, require fixes and incident reporting, and coordinate standards with CISA after a wave of attacks on water utilities.","briefOverview":"\u003cp\u003eSens. Adam Schiff and Amy Klobuchar introduced the Water Cyber Shield Act, a bill that would allocate $300 million each year for cybersecurity improvements in the water and wastewater sector. The legislation would give the Environmental Protection Agency increased authority to regulate cybersecurity protections for water and wastewater systems across the U.S. It follows recent cyberattacks on at least 30 water and wastewater systems in about 12 states, which experts believe were launched by groups connected to Iran’s military.\u003c/p\u003e\n\n\u003cp\u003eThe bill would authorize dedicated cybersecurity funding through Drinking Water and Clean Water State Revolving Funds, and it would amend the Safe Drinking Water Act and the Clean Water Act. The EPA would be authorized to conduct cybersecurity assessments and require corrective actions when vulnerabilities are found. Water and wastewater systems would also need to assess cybersecurity risk as part of resilience planning and comply with incident reporting requirements under the forthcoming Cyber Incident Reporting for Critical Infrastructure Act.\u003c/p\u003e\n\n\u003cp\u003eThe act would set different rules based on water system size and allow states to decide whether to manage the cybersecurity regulations themselves or ask the EPA to help. The EPA would coordinate with the Cybersecurity and Infrastructure Security Agency on threat information and cybersecurity standards, with a technical advisory committee created to develop those standards. The article notes that earlier Biden administration efforts to add cybersecurity checks to annual water system assessments were abandoned after lawsuits from water industry groups and several states.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sens. Adam Schiff and Amy Klobuchar introduced the Water Cyber Shield Act, which would allocate $300 million annually for cybersecurity improvements in the water and wastewater sector.","The bill would give the Environmental Protection Agency authority to conduct cybersecurity assessments of water and wastewater systems and require corrective actions when vulnerabilities are found.","The legislation follows recent cyberattacks on at least 30 water and wastewater systems in about 12 states, which experts believe were launched by groups connected to Iran’s military.","Water and wastewater systems would need to assess cybersecurity risk as part of resilience planning and comply with incident reporting requirements under the forthcoming Cyber Incident Reporting for Critical Infrastructure Act.","The EPA would coordinate with the Cybersecurity and Infrastructure Security Agency on threat information and cybersecurity standards, and a technical advisory committee would be created to develop those standards."],"insights":["The bill attempts to address a major barrier that derailed the Biden administration’s earlier EPA cybersecurity effort by pairing new requirements with dedicated federal funding meant to avoid passing costs to ratepayers.","The legislation is structured to reduce likely resistance from states and utilities by letting states choose whether to manage cybersecurity regulations themselves or have the EPA help.","Smaller water systems would receive both flexibility and priority for federal financial assistance, suggesting the bill recognizes that the least-resourced utilities may be among the hardest to secure.","Cybersecurity information submitted by utilities would be exempt from public disclosure, which could encourage more candid reporting of weaknesses while limiting public visibility into specific risks."],"referencedReports":[],"body":"\u003cp\u003eSens. Adam Schiff and Amy Klobuchar introduced the Water Cyber Shield Act, a bill that would allocate $300 million each year for cybersecurity improvements in the water and wastewater sector. The legislation would give the Environmental Protection Agency increased authority to regulate cybersecurity protections for water and wastewater systems across the U.S. It follows recent cyberattacks on at least 30 water and wastewater systems in about 12 states, which experts believe were launched by groups connected to Iran’s military.\u003c/p\u003e\n\n\u003cp\u003eThe bill would authorize dedicated cybersecurity funding through Drinking Water and Clean Water State Revolving Funds, and it would amend the Safe Drinking Water Act and the Clean Water Act. The EPA would be authorized to conduct cybersecurity assessments and require corrective actions when vulnerabilities are found. Water and wastewater systems would also need to assess cybersecurity risk as part of resilience planning and comply with incident reporting requirements under the forthcoming Cyber Incident Reporting for Critical Infrastructure Act.\u003c/p\u003e\n\n\u003cp\u003eThe act would set different rules based on water system size and allow states to decide whether to manage the cybersecurity regulations themselves or ask the EPA to help. The EPA would coordinate with the Cybersecurity and Infrastructure Security Agency on threat information and cybersecurity standards, with a technical advisory committee created to develop those standards. The article notes that earlier Biden administ
