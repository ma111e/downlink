<script type="application/json" id="dl-articles">[{"n":1,"title":"The Encrypted PDF Your Scanner Trusts Is Hiding the Link It Cannot Read","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/encrypted-pdf-obfuscated-uri-authenticated-brand-domain-scanner-evasion","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing email sent through a real insurer’s authenticated Microsoft 365 mail infrastructure passed SPF, DKIM, DMARC, and ARC, but hid malicious links inside an RC4-encrypted PDF that scanners could not inspect. The key lesson is that authenticated sender signals and clean static scans are not enough when encrypted attachments can conceal unreadable payloads.","briefOverview":"\u003cp\u003eAn eligibility specialist at a state health and human services agency received a phishing email that appeared to come from a national insurance carrier through the carrier’s own authenticated mail infrastructure. SPF, DKIM, DMARC, and ARC all passed, and Microsoft’s composite authentication scored the message at 100. The email included a professionally written body, a case-specific PDF attachment, and callback contact details that did not match the brand’s published support contacts.\u003c/p\u003e\n\n\u003cp\u003eThe attached ten-page PDF was encrypted with RC4 and contained five clickable link annotations in PDF objects 18, 20, 22, 26, and 28. Static analysis could identify that links existed, but the encrypted and obfuscated non-ASCII URI strings prevented the scanner from resolving their destinations. The article maps the delivery to MITRE ATT\u0026amp;CK T1566.001 and the encrypted, scrambled URIs to T1027.\u003c/p\u003e\n\n\u003cp\u003eThe article’s central significance is that email authentication confirmed the message came from the claimed domain but did not prove the content was safe. No automated engine raised a strong verdict because the payload was hidden inside content the scanner could not inspect. A human analyst ultimately quarantined the message three days after delivery, leaving the attachment in the inbox during that period.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker delivered an encrypted PDF through a national insurance carrier's own authenticated mail infrastructure to an eligibility specialist at a state health and human services agency.","SPF, DKIM, DMARC, and ARC all passed under the brand's own reject policy, and Microsoft's composite authentication scored the message at 100.","The attached ten-page RC4-encrypted PDF contained five clickable link annotations with obfuscated, non-ASCII URI strings that static analysis could not resolve.","The email body supplied a callback phone number and email address that did not match the insurance carrier's primary published customer service line.","No automated engine flagged the message, and a human analyst quarantined it three days after delivery."],"insights":["A clean verdict on an encrypted attachment was misleading in this case because the scanner could confirm clickable PDF links existed but could not determine where they led.","The attack turned a normally positive trust signal, document encryption, into the mechanism that prevented automated inspection of the payload.","Email authentication proved insufficient because it confirmed the message came from the real brand domain, not that the message content was safe.","The alternate callback number in the email body created a trap for cautious users who might try to verify the message using the contact details provided in the lure.","The article recommends treating unreadable or unresolvable attachment content as suspicious rather than allowing it to pass simply because no readable malicious content was found."],"referencedReports":[{"title":"Verizon 2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites it for statistics on phishing as an initial access method and credentials involved in incidents.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references it to support the point that trusted cloud mail paths are abused by attackers.","category":"","primary":false},{"title":"FBI IC3 2024 report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites it for reported losses tied to brand impersonation and business email fraud.","category":"","primary":false},{"title":"IBM Cost of a Data Breach 2024 report","url":"https://www.ibm.com/reports/data-breach","publisher":"IBM","context":"The article references it to connect longer threat dwell time with higher breach containment costs.","category":"","primary":false}],"body":"\u003cp\u003eAn eligibility specialist at a state health and human services agency received a phishing email that appeared to come from a national insurance carrier through the carrier’s own authenticated mail infrastructure. SPF, DKIM, DMARC, and ARC all passed, and Microsoft’s composite authentication scored the message at 100. The email included a professionally written body, a case-specific PDF attachment, and callback contact details that did not match the brand’s published support contacts.\u003c/p\u003e\n\n\u003cp\u003eThe attached ten-page PDF was encrypted with RC4 and contained five clickable link annotations in PDF objects 18, 20, 22, 26, and 28. Static analysis could identify that links existed, but the encrypted and obfuscated non-ASCII URI strings prevented the scanner from resolving their destinations. The article maps the delivery to MITRE ATT\u0026amp;CK T1566.001 and the encrypted, scrambled URIs to T1027.\u003c/p\u003e\n\n\u003cp\u003eThe article’s central significance is that email authentication confirmed the message came from the claimed domain but did not prove the content was safe. No automated engine raised a strong verdict because the payload was hidden inside content the scanner could not inspect. A human analyst ultimately quarantined the message three days after delivery, leaving the attachment in the inbox during that period.\u003c/p\u003e\n"}]</script>
