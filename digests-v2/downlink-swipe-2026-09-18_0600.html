<script type="application/json" id="dl-articles">[{"n":1,"title":"New Check Point flaw lets hackers execute code with root privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-warns-critical-flaw-lets-hackers-execute-code-as-root/","time":"09:34","priority":"SHOULD READ","score":88,"tldr":"Check Point patched CVE-2026-91843, a critical stack-based buffer overflow in Security Management Server and Log Server login handling that can give unauthenticated attackers root-level remote code execution. Organizations should apply the LivePatch promptly or restrict trusted clients and monitor for \"Username too long\" failed-login alerts.","briefOverview":"\u003cp\u003eCheck Point released security updates for CVE-2026-91843, a critical stack-based buffer overflow in the login process for Security Management Server instances. The issue also affects Check Point Log Server systems, which collect and store firewall logs. Successful exploitation can let an attacker without privileges execute code remotely with root-level access in a low-complexity attack requiring no user interaction.\u003c/p\u003e\n\n\u003cp\u003eCheck Point said organizations unable to deploy the latest LivePatch can harden affected systems and restrict SmartConsole access to trusted IP addresses or subnets. Teams can look for the alert \u0026ldquo;Administrator failed to log in: Username too long\u0026rdquo; in Audit and Admin login logs to identify possible attempts. Although Check Point has not marked CVE-2026-91843 as exploited in the wild, the company recently patched other critical flaws affecting its firewalls and management systems, and the Dutch NCSC warned exploitation of two of those flaws may occur soon.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point released security updates for CVE-2026-91843, a critical stack-based buffer overflow in the login process of Security Management Server instances and Log Server systems.","CVE-2026-91843 can allow unprivileged attackers to execute code remotely with root privileges through a low-complexity attack that requires no user interaction.","Check Point said customers unable to deploy the LivePatch can harden vulnerable systems and restrict SmartConsole trusted-client access to approved IP addresses or subnets.","Check Point said potential CVE-2026-91843 attempts can be identified through \"Administrator failed to log in: Username too long\" alerts in Audit and Admin login logs.","The company has not flagged CVE-2026-91843 as actively exploited, but the Dutch NCSC warned that exploitation of the separate CVE-2026-85102 and CVE-2026-85103 flaws is expected soon."],"insights":["A specific failed-login message, \"Administrator failed to log in: Username too long,\" provides a concrete indicator that security teams can search for in Audit and Admin login logs.","Organizations that cannot immediately install the LivePatch can reduce exposure by limiting SmartConsole trusted-client access to approved IP addresses or subnets.","The related CVE-2026-85103 flaw affects all Security Management Server deployments regardless of configuration, including systems where VPN functionality is not used or configured.","Check Point has recently faced multiple critical flaws affecting firewalls and management systems, while two earlier authentication-bypass zero-days were already exploited in attacks."],"referencedReports":[{"title":"Check Point Gateway and Management Hardening","url":"https://sc1.checkpoint.com/documents/Check_Point_Gateway_and_Management_Hardening/Hardening_GW_and_MGMT/Introduction.html","publisher":"check-point","context":"The article links to Check Point hardening guidance as a temporary mitigation for customers unable to deploy the LivePatch.","category":"guide","primary":false}],"body":"\u003cp\u003eCheck Point released security updates for CVE-2026-91843, a critical stack-based buffer overflow in the login process for Security Management Server instances. The issue also affects Check Point Log Server systems, which collect and store firewall logs. Successful exploitation can let an attacker without privileges execute code remotely with root-level access in a low-complexity attack requiring no user interaction.\u003c/p\u003e\n\n\u003cp\u003eCheck Point said organizations unable to deploy the latest LivePatch can harden affected systems and restrict SmartConsole access to trusted IP addresses or subnets. Teams can look for the alert \u0026ldquo;Administrator failed to log in: Username too long\u0026rdquo; in Audit and Admin login logs to identify possible attempts. Although Check Point has not marked CVE-2026-91843 as exploited in the wild, the company recently patched other critical flaws affecting its firewalls and management systems, and the Dutch NCSC warned exploitation of two of those flaws may occur soon.\u003c/p\u003e\n"},{"n":3,"title":"Claimed Bug Bounty Hunter Likely Used LLM to Build PhantomRaven npm Stealer","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/claimed-bug-bounty-hunter-likely-used.html","time":"09:18","priority":"SHOULD READ","score":84,"tldr":"CrowdStrike links the PhantomRaven npm campaign to a purported bug bounty hunter who likely used an LLM to create a JavaScript stealer that harvested developer credentials, CI/CD secrets, and system data. The actor allegedly used malicious npm and PyPI packages to compromise targets and identify vulnerabilities for bounty claims.","briefOverview":"\u003cp\u003eCrowdStrike linked the development and distribution of the JavaScript information stealer PhantomRaven to a financially motivated actor who claimed to be a bug bounty hunter. The company assessed with high confidence that the malware was likely created with help from a large language model, citing verbose comments, placeholder code, and token-analysis patterns. PhantomRaven was first reported by Koi Security and DCODX in late October 2025 in a campaign involving more than 100 malicious npm packages.\u003c/p\u003e\n\n\u003cp\u003eThe packages used typosquatting and slopsquatting, then retrieved code from an external server so the harmful functionality was less likely to be detected in the published packages themselves. Once installed, the code gathered authentication tokens, CI/CD secrets, GitHub credentials, public IP addresses, email addresses, Git and npm configuration details, and environment variables from GitHub Actions, GitLab CI, Jenkins, and CircleCI. CrowdStrike said the actor may have used the stolen information to identify bug bounty opportunities rather than sell it, and linked the operation to similar attempts involving the PyPI repository.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrowdStrike assessed with high confidence that the PhantomRaven JavaScript information stealer was likely written using a large language model, citing verbose comments, placeholder code, and token-analysis patterns.","Koi Security and DCODX first reported PhantomRaven in late October 2025 after identifying more than 100 malicious npm packages that used typosquatting and slopsquatting to target developers.","The malicious packages retrieved code from an external server and collected authentication tokens, CI/CD secrets, GitHub credentials, system details, and configuration information.","CrowdStrike linked the operation to a purported bug bounty hunter active since November 2022 and found no evidence that stolen information had appeared in stealer-log shops.","The actor also attempted to upload similar information-stealing code to PyPI, and two associated npm accounts that distributed PhantomRaven were no longer accessible."],"insights":["The campaign used remotely retrieved code so the published npm packages could appear less suspicious to security tools while still delivering the information stealer after installation.","PhantomRaven targeted development environments broadly, collecting data from Git and npm settings as well as automation systems including GitHub Actions, GitLab CI, Jenkins, and CircleCI.","CrowdStrike said it had not found stolen PhantomRaven data in stealer-log shops, supporting its assessment that the operator likely used the collected information to identify bug bounty opportunities rather than resell it.","The same operator was linked to attempts to distribute similar information-stealing code through both npm and PyPI, extending the activity across two major developer package repositories.","CrowdStrike’s assessment that an LLM likely helped create the malware highlights that the actor may have reduced the effort needed to develop proprietary tooling."],"referencedReports":[{"title":"PhantomRaven: LLM-Generated Information Stealer for Bug Bounty Hunting","url":"https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/","publisher":"crowdstrike","context":"The article relies on CrowdStrike Counter Adversary Operations' analysis linking PhantomRaven's development and distribution to a purported bug bounty hunter.","category":"research","primary":true}],"body":"\u003cp\u003eCrowdStrike linked the development and distribution of the JavaScript information stealer PhantomRaven to a financially motivated actor who claimed to be a bug bounty hunter. The company assessed with high confidence that the malware was likely created with help from a large language model, citing verbose comments, placeholder code, and token-analysis patterns. PhantomRaven was first reported by Koi Security and DCODX in late October 2025 in a campaign involving more than 100 malicious npm packages.\u003c/p\u003e\n\n\u003cp\u003eThe packages used typosquatting and slopsquatting, then retrieved code from an external server so the harmful functionality was less likely to be detected in the published packages themselves. Once installed, the code gathered authentication tokens, CI/CD secrets, GitHub credentials, public IP addresses, email addresses, Git and npm configuration details, and environment variables from GitHub Actions, GitLab CI, Jenkins, and CircleCI. CrowdStrike said the actor may have used the stolen information to identify bug bounty opportunities rather than sell it, and linked the operation to similar attempts involving the PyPI repository.\u003c/p\u003e\n"},{"n":4,"title":"RatHat Android Malware Abuses ADB to Retain Shell Access After Uninstall","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/rathat-android-malware-abuses-adb-to.html","time":"06:17","priority":"SHOULD READ","score":82,"tldr":"Researchers identified RatHat, an Android malware attributed to China-based actors that abuses Accessibility permissions and wireless ADB pairing to gain persistent shell access even after the malicious app is uninstalled. It uses AI-assisted device navigation, credential overlays, SMS interception, screen recording, and reverse tunnels for remote control.","briefOverview":"\u003cp\u003eResearchers at Zimperium have identified RatHat, an Android malware assessed to be operated by China-based threat actors. It is distributed through targeted text-message phishing, malicious advertisements, deceptive download portals, and third-party forums that prompt users to install malicious APK files. The initial app acts as a dropper and includes several anti-analysis measures intended to hinder automated inspection.\u003c/p\u003e\n\n\u003cp\u003eRatHat abuses Android Accessibility permissions to unlock Developer Options, enable Wireless Debugging, and obtain an Android Debug Bridge pairing code. It then uses local Android Debug Bridge access to run a Go-based agent with shell-level privileges and an FRP reverse tunnel that gives operators continuing access to the device. This access can remain after the malicious app is uninstalled, and the separate component can check whether the app is present and reinstall it.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use fake overlays to capture credentials, record screens, intercept SMS messages, collect files and lock-screen details, capture keystrokes, and record touches on the display. It also sends the device\u0026rsquo;s live Accessibility screen data to a generative AI assistant to identify on-screen text, find locations for automated taps, and navigate actions such as scrolling. Zimperium said the combination of independently running components, persistent device access, and real-time AI decision loops makes signature-based mobile security controls insufficient.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at Zimperium identified RatHat, an Android malware assessed to be operated by China-based threat actors and distributed through smishing, malvertising, deceptive download portals, and third-party forums.","RatHat abuses Android Accessibility permissions to unlock Developer Options, enable Wireless Debugging, and obtain a six-digit Android Debug Bridge pairing code.","After gaining local Android Debug Bridge access, RatHat can run a Go-based agent and establish a reverse tunnel through FRP, allowing attackers to retain shell access even if the malicious app is uninstalled.","The malware can display credential-stealing overlays, record the screen, intercept SMS messages, collect device data and lock-screen credentials, capture keystrokes, and log screen touches.","RatHat sends the device’s Accessibility screen data to a generative AI assistant to identify on-screen text, locate targets for automated taps, and issue navigation actions such as scrolling."],"insights":["RatHat’s use of local wireless debugging allows it to move beyond normal Android app restrictions by creating separate programs that run with device shell privileges.","Removing the visible malicious app may not remove the attacker’s access, because its independently running component can check for the app and reinstall it.","The malware is designed to hinder automated inspection through package manipulation, malformed manifest data, poisoned code instructions, and encrypted strings.","Its use of a reverse tunnel gives operators a general route to the device’s debugging service, rather than limiting them to RatHat’s built-in data-stealing features.","The malware uses a generative AI assistant to turn live screen-accessibility data into automated actions, such as locating screen elements and scrolling."],"referencedReports":[{"title":"RatHat: AI-Powered Mobile Threat Is Here for Your Credentials \u0026 Bank Accounts","url":"https://zimperium.com/blog/rathat-ai-powered-mobile-threat-is-here-for-your-credentials-bank-accounts","publisher":"zimperium","context":"The article relies on Zimperium researchers' technical analysis of RatHat's distribution, Android Debug Bridge abuse, persistence, and data-stealing capabilities.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at Zimperium have identified RatHat, an Android malware assessed to be operated by China-based threat actors. It is distributed through targeted text-message phishing, malicious advertisements, deceptive download portals, and third-party forums that prompt users to install malicious APK files. The initial app acts as a dropper and includes several anti-analysis measures intended to hinder automated inspection.\u003c/p\u003e\n\n\u003cp\u003eRatHat abuses Android Accessibility permissions to unlock Developer Options, enable Wireless Debugging, and obtain an Android Debug Bridge pairing code. It then uses local Android Debug Bridge access to run a Go-based agent with shell-level privileges and an FRP reverse tunnel that gives operators continuing access to the device. This access can remain after the malicious app is uninstalled, and the separate component can check whether the app is present and reinstall it.\u003c/p\u003e\n\n\u003cp\u003eThe malware can use fake overlays to capture credentials, record screens, intercept SMS messages, collect files and lock-screen details, capture keystrokes, and record touches on the display. It also sends the device\u0026rsquo;s live Accessibility screen data to a generative AI assistant to identify on-screen text, find locations for automated taps, and navigate actions such as scrolling. Zimperium said the combination of independently running components, persistent device access, and real-time AI decision loops makes signature-based mobile security controls insufficient.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft fixes broken copy and paste for Excel 2016 users","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-fixes-broken-copy-and-paste-for-excel-2016-users/","time":"07:35","priority":"MAY READ","score":72,"tldr":"Microsoft released KB5002665 to fix silent copy-and-paste, autofill, and formula-dragging failures caused by the KB5002914 security update, but only for MSI-based Office 2016 installations. Users of other affected Excel versions should use Paste Special until a broader fix is available.","briefOverview":"\u003cp\u003eMicrosoft released KB5002665 to address a problem caused by the September 2026 KB5002914 security update, which made some Excel copy-and-paste operations fail silently. The issue also affected autofill and formula dragging, with users receiving no error message or other indication that the destination cell was unchanged. Microsoft attributed the problem to a code regression.\u003c/p\u003e\n\n\u003cp\u003eThe new update fixes the issue only for Microsoft Installer-based Office 2016 installations and does not apply to Office 2016 Click-to-Run editions such as Microsoft Office 365 Home. Excel Online and Excel 2019, 2021, 2024, and 2016 users remain affected, and Microsoft recommends using Paste Special, including the Ctrl+Alt+V shortcut, as a temporary workaround. Although uninstalling KB5002914 can restore normal copy-and-paste behavior, doing so also removes patches for remote code execution and information disclosure vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that the September 2026 KB5002914 security update can cause certain Excel copy-and-paste operations, autofill, and formula dragging to fail silently because of a code regression.","Microsoft released KB5002665 to mitigate the issue for Microsoft Installer-based Office 2016 installations.","The KB5002665 fix does not apply to Office 2016 Click-to-Run editions, including Microsoft Office 365 Home.","Excel Online and Excel 2024, 2021, 2019, and 2016 are affected, and Microsoft recommends using Paste Special as a workaround until a permanent fix is available for all affected versions.","Uninstalling KB5002914 can restore copy-and-paste functionality but removes patches for remote code execution and information disclosure vulnerabilities."],"insights":["The failure can be difficult to detect because Excel leaves the source selected and provides no beep or error message while making no change at the destination.","Microsoft's released fix is limited to MSI-based Office 2016, so even some Office 2016 users on Click-to-Run editions do not receive the remedy.","Using Paste Special with Ctrl+Alt+V provides a temporary way to paste formulas, values, formats, or links without removing the security update.","Rolling back KB5002914 may restore normal copy-and-paste behavior, but it also removes numerous fixes for remote code execution and information disclosure issues."],"referencedReports":[{"title":"Excel KB5002914 servicing advisory","url":"https://support.microsoft.com/en-us/servicing/office/hotfix/excel/5002914","publisher":"microsoft","context":"Microsoft used this support advisory to confirm that KB5002914 caused certain Excel paste operations to fail silently due to a code regression.","category":"advisory","primary":true},{"title":"Excel KB5002665 servicing advisory","url":"https://support.microsoft.com/en-us/servicing/office/hotfix/excel/5002665","publisher":"microsoft","context":"Microsoft's support advisory states that KB5002665 fixes the known KB5002914 issue affecting certain paste operations in MSI-based Office 2016.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft released KB5002665 to address a problem caused by the September 2026 KB5002914 security update, which made some Excel copy-and-paste operations fail silently. The issue also affected autofill and formula dragging, with users receiving no error message or other indication that the destination cell was unchanged. Microsoft attributed the problem to a code regression.\u003c/p\u003e\n\n\u003cp\u003eThe new update fixes the issue only for Microsoft Installer-based Office 2016 installations and does not apply to Office 2016 Click-to-Run editions such as Microsoft Office 365 Home. Excel Online and Excel 2019, 2021, 2024, and 2016 users remain affected, and Microsoft recommends using Paste Special, including the Ctrl+Alt+V shortcut, as a temporary workaround. Although uninstalling KB5002914 can restore normal copy-and-paste behavior, doing so also removes patches for remote code execution and information disclosure vulnerabilities.\u003c/p\u003e\n"}]</script>
