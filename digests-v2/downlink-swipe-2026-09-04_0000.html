he activity reportedly first emerged in early February 2026 and entered a high-volume phase for about three months before dropping sharply after May 15, 2026. Microsoft estimated weekday volumes at 1 to 2.37 million messages, with a peak on February 26, 2026, and said the campaign was nearly silent on weekends before resuming on Mondays. The operation is tied to broader phishing activity that used ActiveCampaign to distribute AI-generated emails targeting Small Business Administration loan applicants.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used hundreds of disposable finance-themed sender domains with business loan, line-of-credit, and advance-funding lures associated with fraud or credential harvesting. Emails sent through ActiveCampaign routed outbound links via its click-tracking domains, including acemlnd.com and activehosted.com, which Microsoft said can complicate reputation-based filtering because the traffic comes from a reputable marketing platform. ActiveCampaign said its moderation systems give messages with invisible Unicode characters the same verdict as unobfuscated versions and treat heavy use of the technique as suspicious.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported a high-volume phishing campaign that uses invisible Unicode tag characters to bypass email filters.","The attackers inserted characters from the Unicode Tags block into financial lure words such as “funding” so the words appeared normal to recipients but did not match literal keyword detections.","Microsoft said the campaign began in early February 2026, reached weekday volumes of 1 to 2.37 million messages, and dropped sharply after May 15, 2026.","The campaign is tied to broader phishing activity that used ActiveCampaign to distribute AI-generated emails targeting Small Business Administration loan applicants.","The phishing emails used hundreds of disposable finance-themed sender domains and routed outbound links through ActiveCampaign click-tracking domains including acemlnd.com and activehosted.com."],"insights":["Defenses that rely on exact keyword matches or regular expressions can miss financial phishing lures unless they account for invisible Unicode code points inserted inside otherwise ordinary words.","Microsoft highlighted that a technique discussed in the context of AI prompt injection has been adapted for traditional phishing and spam evasion, showing that AI-era methods can move into non-AI attack workflows.","The campaign’s use of ActiveCampaign made reputation-based filtering more difficult because messages originated from a reputable marketing platform with established IP reputation and authentication.","The activity followed a weekly cadence, going nearly silent on weekends and resuming on Mondays, which gives defenders a concrete timing pattern to compare against similar high-volume phishing waves.","ActiveCampaign said heavy use of invisible Unicode characters is treated as a suspicious signal, indicating that the volume or density of these hidden characters can be useful for moderation beyond simply decoding the message text."],"referencedReports":[{"title":"ASCII smuggling crosses over from AI prompt injection to phishing evasion","url":"https://www.microsoft.com/en-us/security/blog/2026/09/03/ascii-smuggling-crosses-over-from-ai-prompt-injection-to-phishing-evasion/","publisher":"Microsoft Security Research","context":"The article cites Microsoft’s analysis as the source for the high-volume phishing campaign using invisible Unicode tag characters to evade email filters.","category":"research","primary":true},{"title":"Attackers Exploit ActiveCampaign to Deliver Thousands of AI-Generated SBA Phish","url":"https://www.fortra.com/blog/attackers-exploit-activecampaign-deliver-thousands-ai-generated-sba-phish","publisher":"Fortra Intelligence and Research Experts","context":"The article references Fortra’s earlier disclosure of a related phishing campaign that used ActiveCampaign to send AI-generated phishing emails targeting SBA loan applicants.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft is warning of a high-volume phishing campaign that uses invisible Unicode tag characters to bypass email filters. The attackers inserted these non-rendering characters into financial lure words such as “funding” so the words appear normal to recipients but are split apart for detectors looking for literal keyword matches. Microsoft said this shows techniques discussed in the AI era can be adapted by threat actors for traditional phishing and spam campaigns.\u003c/p\u003e\n\n\u003cp\u003eThe activity reportedly first emerged in early February 2026 and entered a high-volume phase for about three months before dropping sharply after May 15, 2026. Microsoft estimated weekday volumes at 1 to 2.37 million messages, with a peak on February 26, 2026, and said the campaign was nearly silent on weekends before resuming on Mondays. The operation is tied to broader phishing activity that used ActiveCampaign to distribute AI-generated emails targeting Small Business Administration loan applicants.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used hundreds of disposable finance-themed sender domains with business loan, line-of-credit, and advance-funding lures associated with fraud or credential harvesting. Emails sent through ActiveCampaign routed outbound links via its click-tracking domains, including acemlnd.com and activehosted.com, which Microsoft said can complicate reputation-based filtering because the traffic comes from a reputable marketing platform. ActiveCampaign said its moderation systems give messages with invisible Unicode characters the same verdict as unobfuscated versions and treat heavy use of the technique as suspicious.\u003c/p\u003e\n"},{"n":14,"title":"Plex Urges Immediate Updates After Patching Multiple Undisclosed Security Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/plex-urges-immediate-updates-after.html","time":"07:35","priority":"SHOULD READ","score":82,"tldr":"Plex is urging users to immediately update Plex Media Server to 1.43.3 and Plex Desktop to 1.115.0 after patching multiple undisclosed security flaws. The company has not shared technical details yet, but CVEs have been requested and exposed Plex servers have been targeted in past attacks.","briefOverview":"\u003cp\u003ePlex is urging users to update their instances after releasing fixes for multiple security flaws. The fixes are available in Plex Media Server 1.43.3 and Plex Desktop 1.115.0. Plex did not provide details about the issues, but said CVE identifiers have been requested. The company recommends that all server owners and Desktop users update to the latest version as soon as possible.\u003c/p\u003e\n\n\u003cp\u003ePlex said users running Plex Media Server on NAS devices may not yet see the update in their package manager, but can install the package manually. The update follows an August 2025 fix for CVE-2025-34158, a high-severity authentication bug affecting the “/myplex/account” endpoint. That earlier flaw could expose the server owner’s account details, including an administrative access token, to authenticated non-owner or lower-privileged users. A subsequent “/api/resources” API call could reveal other servers accessible by the owner, potentially exposing the owner’s Plex infrastructure to unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eCensys data shows more than 360,000 devices exposing the Plex Media Server web interface, though the article notes that not all of them are vulnerable. The article also notes that Plex Media Server vulnerabilities have been exploited by threat actors in the past. In February 2021, Plex fixed an issue that allowed affected servers to reflect UDP packets to amplify denial-of-service attacks. The article further states that the August 2022 LastPass breach was driven by attackers compromising an employee’s home computer through a Plex Media Server vulnerability, CVE-2020-5741.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Plex is urging users to update to Plex Media Server 1.43.3 and Plex Desktop 1.115.0 after releasing fixes for multiple security flaws.","Plex did not provide details about the newly patched issues but said CVE identifiers have been requested for them.","Plex said NAS users may need to install the updated Plex Media Server package manually if it is not yet available through their package manager.","In August 2025, Plex addressed CVE-2025-34158, a high-severity authentication bug that could expose a server owner’s account details and administrative access token to lower-privileged authenticated users.","Censys data shows more than 360,000 devices exposing the Plex Media Server web interface, although not all of them are vulnerable."],"insights":["Plex’s recommendation to update before publishing CVE details makes the update time-sensitive even though the exact flaws remain undisclosed.","NAS users may face a delay through normal package managers, so Plex specifically points them to manual installation as the faster update path.","The previously fixed CVE-2025-34158 showed that a lower-privileged authenticated Plex user could obtain an owner’s administrative access token and then discover other servers tied to that owner.","Plex Media Server vulnerabilities have had real-world consequences beyond media servers, including the LastPass incident where attackers compromised an employee’s home computer through a Plex flaw."],"referencedReports":[{"title":"Important Security Update for Plex Media Server v1.43.2 and Earlier","url":"https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319","publisher":"Plex","context":"The article cites Plex’s announcement urging server owners and Desktop users to update to the latest versions as soon as possible.","category":"advisory","primary":true},{"title":"CVE-2025-34158 Vulnerability Research","url":"https://github.com/lufinkey/vulnerability-research/blob/main/CVE-2025-34158/README.md","publisher":"lufinkey","context":"The article references this technical analysis when describing the earlier Plex authentication bug involving the /myplex/account endpoint.","category":"research","primary":false},{"title":"Security Regarding SSDP Reflection Amplification DDoS","url":"https://forums.plex.tv/t/security-regarding-ssdp-reflection-amplification-ddos/687162","publisher":"Plex","context":"The article cites this Plex hotfix notice while discussing a 2021 issue that allowed affected servers to reflect UDP packets in denial-of-service attacks.","category":"advisory","primary":false}],"body":"\u003cp\u003ePlex is urging users to update their instances after releasing fixes for multiple security flaws. The fixes are available in Plex Media Server 1.43.3 and Plex Desktop 1.115.0. Plex did not provide details about the issues, but said CVE identifiers have been requested. The company recommends that all server owners and Desktop users update to the latest version as soon as possible.\u003c/p\u003e\n\n\u003cp\u003ePlex said users running Plex Media Server on NAS devices may not yet see the update in their package manager, but can install the package manually. The update follows an August 2025 fix for CVE-2025-34158, a high-severity authentication bug affecting the “/myplex/account” endpoint. That earlier flaw could expose the server owner’s account details, including an administrative access token, to authenticated non-owner or lower-privileged users. A subsequent “/api/resources” API call could reveal other servers accessible by the owner, potentially exposing the owner’s Plex infrastructure to unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eCensys data shows more than 360,000 devices exposing the Plex Media Server web interface, though the article notes that not all of them are vulnerable. The article also notes that Plex Media Server vulnerabilities have been exploited by threat actors in the past. In February 2021, Plex fixed an issue that allowed affected servers to reflect UDP packets to amplify denial-of-service attacks. The article further states that the August 2022 LastPass breach was driven by attackers compromising an employee’s home computer through a Plex Media Server vulnerability, CVE-2020-5741.\u003c/p\u003e\n"},{"n":19,"title":"GPT-6 Astra Scores 100% on ExploitBench as OpenAI Blocks PoC Exploit Requests","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/gpt-6-astra-scores-100-on-exploitbench.html","time":"06:47","priority":"SHOULD READ","score":82,"tldr":"OpenAI launched GPT-6 Astra, a frontier AI model that scored 100% on ExploitBench but is being released with safeguards that block proof-of-concept exploit generation. The company says it will initially focus access on defensive uses like secure code review and patching, with expanded capabilities planned through its Daybreak program.","briefOverview":"\u003cp\u003eOpenAI officially unveiled GPT-6 Astra, describing it as the “world\u0026rsquo;s most intelligent and aligned model.” The company said the model reached the “Critical” cybersecurity capability threshold under its Preparedness Framework. Astra is rolling out first to a small set of organizations and is expected to become available to ChatGPT Plus, Pro, Business, and Enterprise users, as well as through the OpenAI API, Microsoft Azure, and AWS Bedrock.\u003c/p\u003e\n\n\u003cp\u003eOpenAI said Astra scored 100% on ExploitBench, compared with 78.5% for GPT-5.6 Sol, and also reported very high scores on FrontierMath Tier 4 and ARC-AGI-3. The company said the model achieved substantially higher arbitrary code-execution rates than GPT-5.6 Sol in tests using flaws from July and August 2026, including two zero-day vulnerabilities in unspecified software. OpenAI also said Astra could use previously unknown vulnerabilities to achieve code execution in hardened browsers and develop privilege-escalation exploits for hardened operating systems if allowed to run without safeguards.\u003c/p\u003e\n\n\u003cp\u003eBecause of these dual-use capabilities, OpenAI said the released version of Astra is limited to secure code review and patching and refuses prompts for creating proof-of-concept exploits. The company plans to expand access through OpenAI Daybreak for additional defensive workflows, including vulnerability and proof-of-concept validation, malware analysis, and detection engineering. OpenAI also launched Daybreak for Frontline Defenders, a $1 billion project to help critical infrastructure sectors and organizations with limited security resources use frontier AI cyber capabilities to protect essential services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI officially unveiled GPT-6 Astra, describing it as the world's most intelligent and aligned model.","OpenAI said GPT-6 Astra reached the Critical cybersecurity capability threshold under its Preparedness Framework and scored 100% on ExploitBench, compared with 78.5% for GPT-5.6 Sol.","OpenAI said the released version of Astra is limited to secure code review and patching and refuses prompts related to creating proof-of-concept exploits for vulnerabilities.","OpenAI plans to expand access through OpenAI Daybreak to enable more defensive workflows, including vulnerability and proof-of-concept validation, malware analysis, and detection engineering.","OpenAI launched Daybreak for Frontline Defenders, a $1 billion global project to help critical infrastructure sectors and resource-limited organizations use frontier AI cyber capabilities to protect essential services."],"insights":["OpenAI is releasing Astra with narrower cybersecurity permissions than its demonstrated capabilities, because the model can achieve code execution in hardened browsers and develop privilege-escalation exploits for hardened operating systems if safeguards are removed.","The model’s exploit-development capability was tested not only on known benchmark cases but also on flaws from the previous three months, including two zero-day vulnerabilities in unspecified software.","OpenAI expects some legitimate defensive work to be interrupted by safety checks, requiring users to review certain actions before continuing.","OpenAI is pairing the model release with subsidized access and hands-on support for frontline defenders, indicating that access to advanced AI cyber capabilities is being treated as a security resource for critical infrastructure and organizations with limited security capacity."],"referencedReports":[],"body":"\u003cp\u003eOpenAI officially unveiled GPT-6 Astra, describing it as the “world\u0026rsquo;s most intelligent and aligned model.” The company said the model reached the “Critical” cybersecurity capability threshold under its Preparedness Framework. Astra is rolling out first to a small set of organizations and is expected to become available to ChatGPT Plus, Pro, Business, and Enterprise users, as well as through the OpenAI API, Microsoft Azure, and AWS Bedrock.\u003c/p\u003e\n\n\u003cp\u003eOpenAI said Astra scored 100% on ExploitBench, compared with 78.5% for GPT-5.6 Sol, and also reported very high scores on FrontierMath Tier 4 and ARC-AGI-3. The company said the model achieved substantially higher arbitrary code-execution rates than GPT-5.6 Sol in tests using flaws from July and August 2026, including two zero-day vulnerabilities in unspecified software. OpenAI also said Astra could use previously unknown vulnerabilities to achieve code execution in hardened browsers and develop privilege-escalation exploits for hardened operating systems if allowed to run without safeguards.\u003c/p\u003e\n\n\u003cp\u003eBecause of these dual-use capabilities, OpenAI said the released version of Astra is limited to secure code review and patching and refuses prompts for creating proof-of-concept exploits. The company plans to expand access through OpenAI Daybreak for additional defensive workflows, including vulnerability and proof-of-concept validation, malware analysis, and detection engineering. OpenAI also launched Daybreak for Frontline Defenders, a $1 billion project to help critical infrastructure sectors and organizations with limited security resources use frontier AI cyber capabilities to protect essential services.\u003c/p\u003e\n"},{"n":20,"title":"A Phishing Kit Padded Its Payload With Someone Else's Mail","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/settlement-lure-esp-tracker-laundering-padded-with-stolen-newsletter","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A credential-phishing email passed SPF, DKIM, DMARC, and Microsoft composite authentication by using controlled or repurposed infrastructure, then hid a malicious settlement-agreement link behind an ESP tracker. Its key evasion tactic was padding the short lure with a stolen legitimate commercial email to make the message look statistically normal to scanners while keeping the real phish visible to the victim.","briefOverview":"\u003cp\u003eA fully authenticated phishing email reached two mailboxes at a food service packaging manufacturer with an empty subject, a four-line settlement approval lure, and a single link. SPF, DKIM, DMARC, and Microsoft composite authentication all passed, but the sender alias asserted the recipient organization’s own name from an unrelated sending domain. Themis scored the message at 89% confidence for credential theft, and both affected mailboxes were quarantined and mitigated.\u003c/p\u003e\n\n\u003cp\u003eThe link was labeled as a signer approval settlement agreement PDF using the recipient company’s name, but no attachment was present. Its hover text advertised one unrelated commercial domain, while the actual link went through a Mandrill click tracking URL to a credential page on secure.individual-elegance.co.za. The article says the tracker received a mixed verdict and the terminal page was scored as malicious.\u003c/p\u003e\n\n\u003cp\u003eThe most notable technique was padding: after roughly seventy blank line breaks, the email reproduced a complete, unrelated legitimate commercial email that had been sent to a different person at a different organization. This stolen filler changed the message’s link ratios, text volume, and boilerplate profile while pushing the borrowed content below what a reader would likely see. The article recommends normalizing messages before scoring them, detecting unrelated appended markup, resolving tracking links to their final destination, and checking for display-name impersonation, malformed sender local parts, and mismatched anchor titles and destinations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fully authenticated phishing email reached two mailboxes at a food service packaging manufacturer with SPF, DKIM, DMARC, and Microsoft composite authentication all passing.","The visible lure was a four-line settlement approval message using the recipient’s first name, full email address, and company name, with a single link disguised as a signer approval settlement agreement PDF.","The link used a Mandrill click tracking URL that relayed to a credential page on secure.individual-elegance.co.za, which the platform scored as malicious.","The email’s HTML contained roughly seventy blank line breaks followed by a complete, unrelated legitimate commercial email that had been sent to a different person at a different organization.","Themis flagged the message as credential theft with 89% confidence, and both affected mailboxes were quarantined and mitigated."],"insights":["The strongest available authentication result did not reduce the phishing risk in this case because the sending domain authenticated itself, not the organization named in the sender alias.","The stolen legitimate email padding changed measurable content ratios such as link count, text volume, and boilerplate presence, making the message appear more like normal commercial mail to automated analysis.","Long runs of blank line breaks served a dual purpose: they hid the borrowed content from the reader while still allowing parsers to count it as part of the message.","The malformed sender local part containing marketing tracking parameters was an actionable signal that the kit had likely pasted a scraped tracking string into an email address field.","Comparing an anchor’s visible hover title with its actual destination and resolving ESP tracking links to their final landing page were decisive checks that did not depend on sender authentication."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics that phishing accounts for 16% of breach initial access vectors and credentials appear in 39% of breaches across the kill chain.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references the guidance as supporting layered behavioral controls for phishing defense.","category":"guide","primary":false}],"body":"\u003cp\u003eA fully authenticated phishing email reached two mailboxes at a food service packaging manufacturer with an empty subject, a four-line settlement approval lure, and a single link. SPF, DKIM, DMARC, and Microsoft composite authentication all passed, but the sender alias asserted the recipient organization’s own name from an unrelated sending domain. Themis scored the message at 89% confidence for credential theft, and both affected mailboxes were quarantined and mitigated.\u003c/p\u003e\n\n\u003cp\u003eThe link was labeled as a signer approval settlement agreement PDF using the recipient company’s name, but no attachment was present. Its hover text advertised one unrelated commercial domain, while the actual link went through a Mandrill click tracking URL to a credential page on secure.individual-elegance.co.za. The article says the tracker received a mixed verdict and the terminal page was scored as malicious.\u003c/p\u003e\n\n\u003cp\u003eThe most notable technique was padding: after roughly seventy blank line breaks, the email reproduced a complete, unrelated legitimate commercial email that had been sent to a different person at a different organization. This stolen filler changed the message’s link ratios, text volume, and boilerplate profile while pushing the borrowed content below what a reader would likely see. The article recommends normalizing messages before scoring them, detecting unrelated appended markup, resolving tracking links to their final destination, and checking for display-name impersonation, malformed sender local parts, and mismatched anchor titles and destinations.\u003c/p\u003e\n"},{"n":8,"title":"US, Britain to coordinate on scam center takedowns","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/scam-compounds-coordination-us-uk-memorandum","time":"15:42","priority":"SHOULD READ","score":78,"tldr":"The U.S. and U.K. will coordinate investigations, intelligence sharing, and case prioritization to disrupt Southeast Asia-based scam centers behind major investment and romance fraud losses. The effort targets organized crime networks, including Chinese gangs and laundering operations such as Prince Group.","briefOverview":"\u003cp\u003eThe United States and United Kingdom will work together on an initiative to shut down scam centers that steal billions of dollars through investment and romance fraud schemes. A memorandum of understanding signed on Thursday calls for parallel investigations and information sharing on organized crime syndicates behind the scam centers. U.S. Attorney Jeanine Ferris Pirro met with senior officials from the U.K.’s National Crime Agency and Crown Prosecutor to sign the agreement.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said the two countries will discuss which jurisdictions should bring specific cases of common interest and will prioritize cases to achieve mutual results. U.S. and U.K. counterparts had already identified significant overlapping cases and committed to an in-person disruption event with private industry partners in London in early October. Pirro said the goal was to “disable” the Chinese gangs that run the scam compounds.\u003c/p\u003e\n\n\u003cp\u003eThe effort is being led by the Scam Center Strike Force, launched in November to coordinate U.S. law enforcement efforts against cyber scams. The FBI said cyber-enabled fraud schemes accounted for almost 85% of all losses reported to the agency, and more than $12 billion was stolen from Americans last year in cyber scams, though that figure is likely an undercount. The article says many scams are carried out by human trafficking victims in compounds across Myanmar, Cambodia, Laos and other countries, while Chinese gangs operate the compounds with help from compromised local officials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The United States and United Kingdom signed a memorandum of understanding to coordinate efforts to shut down scam centers involved in investment and romance fraud schemes.","The agreement calls for parallel investigations, information sharing, and discussions on which jurisdictions should bring specific cases of common interest.","The Justice Department said U.S. and U.K. counterparts had identified significant overlapping cases and planned an in-person disruption event with private industry partners in London in early October.","The Scam Center Strike Force is leading the effort and includes more than 150 personnel from agencies such as the FBI, IRS, and U.S. Postal Inspection Service.","U.S. and U.K. agencies previously sanctioned Prince Group, and the Justice Department seized about $15 billion worth of bitcoin linked to its CEO Chen Zhi."],"insights":["The U.S.-U.K. agreement is not limited to sharing intelligence; it explicitly includes deciding which country should bring specific cases, suggesting a coordinated legal strategy against overlapping targets.","The planned London disruption event will include private industry partners, showing that authorities view companies outside government as necessary to dismantling scam center operations.","The FBI’s estimate that cyber-enabled fraud accounts for almost 85% of reported losses indicates these scams are a dominant driver of financial harm reported to the agency.","The article highlights that reported U.S. losses of more than $12 billion are likely a severe undercount because many victims do not report their losses.","The prior Prince Group action shows authorities are targeting the financial infrastructure behind scam centers, not only the people directly running the compounds."],"referencedReports":[],"body":"\u003cp\u003eThe United States and United Kingdom will work together on an initiative to shut down scam centers that steal billions of dollars through investment and romance fraud schemes. A memorandum of understanding signed on Thursday calls for parallel investigations and information sharing on organized crime syndicates behind the scam centers. U.S. Attorney Jeanine Ferris Pirro met with senior officials from the U.K.’s National Crime Agency and Crown Prosecutor to sign the agreement.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said the two countries will discuss which jurisdictions should bring specific cases of common interest and will prioritize cases to achieve mutual results. U.S. and U.K. counterparts had already identified significant overlapping cases and committed to an in-person disruption event with private industry partners in London in early October. Pirro said the goal was to “disable” the Chinese gangs that run the scam compounds.\u003c/p\u003e\n\n\u003cp\u003eThe effort is being led by the Scam Center Strike Force, launched in November to coordinate U.S. law enforcement efforts against cyber scams. The FBI said cyber-enabled fraud schemes accounted for almost 85% of all losses reported to the agency, and more than $12 billion was stolen from Americans last year in cyber scams, though that figure is likely an undercount. The article says many scams are carried out by human trafficking victims in compounds across Myanmar, Cambodia, Laos and other countries, while Chinese gangs operate the compounds with help from compromised local officials.\u003c/p\u003e\n"},{"n":9,"title":"UK account-hack losses surge as new reporting system exposes hidden cases","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/uk-account-hack-losses-surge-as-reporting-changes","time":"14:45","priority":"SHOULD READ","score":78,"tldr":"Reported UK losses from hacked online accounts jumped sharply to £6.3 million, but police say the rise is largely because the new Report Fraud system is capturing cases that were previously missed. The data suggests cybercrime and ransomware remain significantly underreported, complicating efforts to measure the true scale of the problem.","briefOverview":"\u003cp\u003eReported losses tied to hacked email, social media and other online accounts in Britain rose 417% over the last financial year, reaching £6.3 million in the year ending March 31. The number of victims reporting a financial loss increased from 226 to 2,325. City of London Police said much of the jump reflects changes in how incidents are reported rather than a sudden fivefold increase in attacks.\u003c/p\u003e\n\n\u003cp\u003eThe rise coincides with the rollout of Report Fraud, the national service that replaced the criticized Action Fraud system in January. Police said 92% of account-hacking reports involving a financial loss were recorded in the second half of the financial year, overlapping with the move to the new platform. The assessment said this makes direct comparisons with the previous year less straightforward because more incidents are now being identified and recorded.\u003c/p\u003e\n\n\u003cp\u003eReport Fraud received 64,608 reports of cyber-dependent crimes during 2025-26, up 34%, with account hacking accounting for 44,355 reports. Reported losses from cyber-dependent crimes rose 90% to £14.3 million, while broader fraud categories recorded £3.2 billion in reported losses. The assessment also warned that ransomware figures are difficult to interpret, with Report Fraud receiving 323 ransomware reports while police said the decline may reflect underreporting rather than fewer attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Reported UK losses tied to hacked email, social media and other online accounts rose 417% to £6.3 million in the year ending March 31, while victims reporting a financial loss rose from 226 to 2,325.","The City of London Police said much of the increase likely reflects the rollout of the new Report Fraud platform, which replaced Action Fraud and captured more incidents, rather than a sudden fivefold rise in attacks.","Police said 92% of account-hacking reports involving financial loss were recorded in the second half of the financial year, overlapping with the move to the new reporting platform.","Report Fraud received 64,608 reports of cyber-dependent crimes during 2025-26, up 34%, with account hacking accounting for 44,355 of those reports.","Report Fraud recorded 323 ransomware reports, down 25% from 430, but police warned the decline may reflect underreporting because ransomware incidents are reported through several channels."],"insights":["The 417% rise in reported account-hack losses should not be read as a clean year-over-year trend, because the article says the reporting system changed in a way that made previously hidden cases more visible.","Financial losses from a single incident may be recorded under fraud rather than hacking if the victim does not know an account was compromised, which means account-hack figures may understate the role of hacked accounts in broader fraud losses.","Ransomware reporting is especially difficult to interpret because Report Fraud showed a 25% decline while separate Information Commissioner’s Office data recorded 452 ransomware-related data breaches over part of the same period, and the two systems measure different outcomes.","Small and medium-sized businesses are a notable exposure point because they made up 62% of organization cybercrime reports where size was known, and police said they can also become routes into larger companies through supplier relationships."],"referencedReports":[{"title":"Report Fraud Annual Assessment","url":"https://www.reportfraud.police.uk/report-fraud-annual-assessment/","publisher":"City of London Police","context":"The article is based on the City of London Police's first annual assessment of reports and losses recorded through Report Fraud.","category":"research","primary":true}],"body":"\u003cp\u003eReported losses tied to hacked email, social media and other online accounts in Britain rose 417% over the last financial year, reaching £6.3 million in the year ending March 31. The number of victims reporting a financial loss increased from 226 to 2,325. City of London Police said much of the jump reflects changes in how incidents are reported rather than a sudden fivefold increase in attacks.\u003c/p\u003e\n\n\u003cp\u003eThe rise coincides with the rollout of Report Fraud, the national service that replaced the criticized Action Fraud system in January. Police said 92% of account-hacking reports involving a financial loss were recorded in the second half of the financial year, overlapping with the move to the new platform. The assessment said this makes direct comparisons with the previous year less straightforward because more incidents are now being identified and recorded.\u003c/p\u003e\n\n\u003cp\u003eReport Fraud received 64,608 reports of cyber-dependent crimes during 2025-26, up 34%, with account hacking accounting for 44,355 reports. Reported losses from cyber-dependent crimes rose 90% to £14.3 million, while broader fraud categories recorded £3.2 billion in reported losses. The assessment also warned that ransomware figures are difficult to interpret, with Report Fraud receiving 323 ransomware reports while police said the decline may reflect underreporting rather than fewer attacks.\u003c/p\u003e\n"},{"n":11,"title":"G7 urges organizations to prepare for quantum cyber threats","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/g7-urges-organizations-to-prepare-for-quantum-threats","time":"12:34","priority":"SHOULD READ","score":78,"tldr":"The G7 and CISA are urging governments and companies to start migrating to post-quantum cryptography now because attackers may already be stealing encrypted data to decrypt later with future quantum computers. Organizations should prioritize their most sensitive systems and build quantum-resistant protections into routine upgrades to reduce future risk and disruption.","briefOverview":"\u003cp\u003eThe G7 Cyber Security Working Group and the U.S. Cybersecurity and Infrastructure Security Agency released a joint advisory urging governments and companies to prepare for quantum-related cyber threats. They said organizations should begin moving to post-quantum cryptography now rather than waiting for sufficiently powerful quantum computers to become available. The advisory said the exact timeline is uncertain, but recent advances suggest organizations should anticipate the development of quantum computers.\u003c/p\u003e\n\n\u003cp\u003eThe advisory warned that organizations may already be exposed because hackers can steal encrypted information now and store it for later decryption when more powerful quantum computers exist. This “harvest now, decrypt later” threat is especially relevant for information that must remain secret for many years, including government records, sensitive personal information and corporate trade secrets. The G7 and CISA said organizations should identify systems containing their most sensitive information and critical assets, prioritize them for migration, and incorporate quantum-resistant technology into routine upgrades to reduce cost and disruption.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The G7 Cyber Security Working Group and CISA issued a joint advisory urging governments and companies to begin moving to post-quantum cryptography before powerful quantum computers become available.","The advisory warned that attackers can steal encrypted information now and store it to decrypt later when more powerful quantum computers exist.","The G7 and CISA said organizations should identify systems containing their most sensitive information and critical assets and prioritize them for migration.","The advisory recommended incorporating quantum-resistant technology into routine upgrades rather than replacing systems all at once to make the transition cheaper and less disruptive.","The article said companies that fail to adopt quantum-resistant technology could lose a competitive advantage or eventually be shut out of contracts, including government procurement."],"insights":["The advisory frames quantum risk as a present-day exposure, not only a future problem, because encrypted data stolen now may become readable later.","The article highlights long-lived sensitive data, such as government records, personal information and trade secrets, as the most urgent migration priority rather than treating all systems equally.","The G7 and CISA recommend using normal technology refresh cycles to add quantum-resistant protections, which makes the transition an incremental planning issue instead of a single large replacement project.","The article connects post-quantum readiness to commercial risk, noting that companies may eventually lose competitive advantage or access to contracts if they do not adopt quantum-resistant technology.","The U.K. roadmap’s 2035 transition target and the G7’s earlier financial-sector warning indicate that some sectors, including banking, finance and telecommunications, are expected to move earlier than others."],"referencedReports":[{"title":"Preparing for a Post-Quantum Era: A Call to Action","url":"https://www.cisa.gov/resources-tools/resources/preparing-post-quantum-era-call-action","publisher":"G7 Cyber Security Working Group and CISA","context":"The article is based on a joint advisory urging organizations to begin moving to post-quantum cryptography before powerful quantum computers become available.","category":"advisory","primary":true}],"body":"\u003cp\u003eThe G7 Cyber Security Working Group and the U.S. Cybersecurity and Infrastructure Security Agency released a joint advisory urging governments and companies to prepare for quantum-related cyber threats. They said organizations should begin moving to post-quantum cryptography now rather than waiting for sufficiently powerful quantum computers to become available. The advisory said the exact timeline is uncertain, but recent advances suggest organizations should anticipate the development of quantum computers.\u003c/p\u003e\n\n\u003cp\u003eThe advisory warned that organizations may already be exposed because hackers can steal encrypted information now and store it for later decryption when more powerful quantum computers exist. This “harvest now, decrypt later” threat is especially relevant for information that must remain secret for many years, including government records, sensitive personal information and corporate trade secrets. The G7 and CISA said organizations should identify systems containing their most sensitive information and critical assets, prioritize them for migration, and incorporate quantum-resistant technology into routine upgrades to reduce cost and disruption.\u003c/p\u003e\n"},{"n":6,"title":"Exchange Online outage causes email delays, 'Server busy' errors","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/exchange-online-outage-causes-email-delays-server-busy-errors/","time":"12:22","priority":"MAY READ","score":74,"tldr":"Microsoft is investigating an ongoing Exchange Online outage causing delays for email sent to and from external domains, with some users seeing intermittent “Server busy” errors. The company says anti-spam protections may be worsening the impact for some accounts, but it has not yet provided a fix timeline.","briefOverview":"\u003cp\u003eMicrosoft is working to resolve an ongoing Exchange Online outage that is delaying email sent to and received from external domains. The incident is tracked as EX1467029 and was first acknowledged by Microsoft at 02:19 AM EDT. Microsoft said users may experience intermittent “Server busy” errors affecting multiple mailboxes.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said its initial investigation found that anti-spam protections may be contributing to the impact for a subset of users. The company said these protections may further delay affected accounts, and it is continuing to analyze service behavior and telemetry to understand the cause. Microsoft has not provided a timeline for full remediation.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has not disclosed which regions are impacted or how many users are affected, but it has flagged the issue as an incident, which the article says usually involves noticeable user impact. The article notes that Microsoft resolved other Exchange Online and Microsoft 365 service issues earlier in the year, including mailbox access problems, mail flow delays and failures, and a recent outage involving authentication issues, connection problems, service delays, and failures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is working to resolve an ongoing Exchange Online outage that is delaying email sent to and received from external domains.","Microsoft first acknowledged the incident, tracked as EX1467029, at 02:19 AM EDT after investigating reports of intermittent “Server busy” errors.","The company said affected users may experience intermittent “Server busy” errors affecting multiple mailboxes.","Microsoft said anti-spam protections may be contributing to the impact for a subset of users and causing further delays.","Microsoft has not disclosed which regions are impacted, how many users are affected, or a timeline for full remediation."],"insights":["Microsoft flagged the problem as an incident, which the article notes usually indicates noticeable user impact, even though Microsoft has not disclosed the affected regions or user count.","The outage affects mail sent to and received from external domains, so the impact is specifically on communication outside affected organizations rather than only internal mailbox access.","Microsoft’s initial investigation found that protections meant to block spam may be worsening delays for some users, making a defensive control part of the service impact.","The article places this outage in a pattern of recent Exchange Online disruptions, including separate incidents in April, June, and earlier the same week."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is working to resolve an ongoing Exchange Online outage that is delaying email sent to and received from external domains. The incident is tracked as EX1467029 and was first acknowledged by Microsoft at 02:19 AM EDT. Microsoft said users may experience intermittent “Server busy” errors affecting multiple mailboxes.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said its initial investigation found that anti-spam protections may be contributing to the impact for a subset of users. The company said these protections may further delay affected accounts, and it is continuing to analyze service behavior and telemetry to understand the cause. Microsoft has not provided a timeline for full remediation.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has not disclosed which regions are impacted or how many users are affected, but it has flagged the issue as an incident, which the article says usually involves noticeable user impact. The article notes that Microsoft resolved other Exchange Online and Microsoft 365 service issues earlier in the year, including mailbox access problems, mail flow delays and failures, and a recent outage involving authentication issues, connection problems, service delays, and failures.\u003c/p\u003e\n"},{"n":28,"title":"Neither Malware nor Harmless: Tracking the NPS Proxy Across the Internet","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/nps-proxy-server/","time":"17:07","priority":"MAY READ","score":74,"tldr":"NPS is a legitimate open-source tunneling proxy widely deployed in Chinese cloud infrastructure, but it is also used by China-linked threat actors as a secondary post-exploitation tool for pivoting inside victim networks. Defenders should not treat NPS alone as proof of compromise, but should prioritize investigation when it appears alongside tools like Cobalt Strike, Meterpreter, webshells, or other remote-access tooling.","briefOverview":"\u003cp\u003eNPS is a lightweight, open-source proxy and tunneling server written in Go, described by its original readme as a “powerful intranet penetration proxy server.” It uses a client-server model in which an NPS server exposes a web management panel and client bridge, while an NPC client connects back from inside a network. Censys says NPS is widely used, with about 17,500 hosts running the server component worldwide as of July 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that NPS is dual-use rather than inherently malicious. Its deployments are heavily concentrated in China and Hong Kong, especially within Chinese cloud providers such as Alibaba, Tencent, and China Telecom’s backbone. Censys states that most deployments are likely ordinary administrative uses, but the same reverse tunneling capability can also help an intruder pivot inside a compromised network.\u003c/p\u003e\n\n\u003cp\u003eThe article cites prior cases where NPS appeared in threat activity involving actors from the People’s Republic of China, including Sygnia reporting on Emperor Dragonfly and a 2023 CISA investigation involving compromised Citrix NetScaler devices. In those cases, NPS was used alongside tools such as Cobalt Strike, Meterpreter, and webshells, supporting follow-on activity after initial access. Censys recommends hunting NPS in context rather than blocking it on sight, with stronger concern when it appears next to remote access tools or infrastructure an organization does not own.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NPS is a lightweight, open-source proxy and tunneling server written in Go that uses a client-server model to create reverse network tunnels.","As of July 2026, Censys observed about 17,500 hosts running the NPS server component worldwide, with deployments concentrated in China and Hong Kong.","NPS has been observed in intrusions involving threat actors from the People’s Republic of China, including Emperor Dragonfly and a 2023 CISA investigation into compromised Citrix NetScaler devices.","The NPS client has been deployed alongside tools such as Cobalt Strike, Meterpreter, and webshells to support follow-on network pivoting after initial access was established by other tooling.","Censys states that NPS should be hunted in context rather than blocked on sight, with stronger concern when it appears alongside remote access tools or infrastructure not owned by the organization."],"insights":["NPS is more meaningful as a detection when it is correlated with other tools, because Censys reports that under 10% of observed NPS hosts also run a service it identifies as a threat.","Threat actors have used NPS even when their existing tools, such as Cobalt Strike and Meterpreter, already provide proxying features, indicating that separating pivoting traffic from primary command-and-control traffic is an observed operational pattern.","NPS lacks native command-execution or remote-shell capability, which helps explain why reported malicious use shows it being deployed after initial access rather than as the tool used to break in.","The concentration of NPS on Chinese cloud providers means broad blocking or alerting on NPS alone is likely to produce many benign results, while co-location with tools such as Cobalt Strike, Acunetix, Viper, or Supershell is a stronger investigative signal."],"referencedReports":[{"title":"Revealing Emperor Dragonfly: A Chinese Ransomware Group","url":"https://www.sygnia.co/threat-reports-and-advisories/revealing-emperor-dragonfly-a-chinese-ransomware-group/","publisher":"Sygnia","context":"The article cites this report as one of two prior cases where NPS was observed in threat actor operations, with the NPS client renamed WindowsUpdate.exe and running alongside Cobalt Strike and Meterpreter.","category":"research","primary":false},{"title":"Threat Actors Exploiting Citrix CVE-2023-3519 to Implant Webshells","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-201a","publisher":"CISA","context":"The article references this 2023 CISA advisory as a prior investigation in which an NPS tunneller was deployed after attackers placed a webshell on compromised Citrix NetScaler devices.","category":"advisory","primary":false}],"body":"\u003cp\u003eNPS is a lightweight, open-source proxy and tunneling server written in Go, described by its original readme as a “powerful intranet penetration proxy server.” It uses a client-server model in which an NPS server exposes a web management panel and client bridge, while an NPC client connects back from inside a network. Censys says NPS is widely used, with about 17,500 hosts running the server component worldwide as of July 2026.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that NPS is dual-use rather than inherently malicious. Its deployments are heavily concentrated in China and Hong Kong, especially within Chinese cloud providers such as Alibaba, Tencent, and China Telecom’s backbone. Censys states that most deployments are likely ordinary administrative uses, but the same reverse tunneling capability can also help an intruder pivot inside a compromised network.\u003c/p\u003e\n\n\u003cp\u003eThe article cites prior cases where NPS appeared in threat activity involving actors from the People’s Republic of China, including Sygnia reporting on Emperor Dragonfly and a 2023 CISA investigation involving compromised Citrix NetScaler devices. In those cases, NPS was used alongside tools such as Cobalt Strike, Meterpreter, and webshells, supporting follow-on activity after initial access. Censys recommends hunting NPS in context rather than blocking it on sight, with stronger concern when it appears next to remote access tools or infrastructure an organization does not own.\u003c/p\u003e\n"},{"n":12,"title":"Russian data centers face new security requirements amid Ukraine's drone threats","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-data-centers-ukraine-drone-threats","time":"13:39","priority":"MAY READ","score":72,"tldr":"Russia is tightening security requirements for critical infrastructure, including data centers, as Ukrainian drone attacks increasingly threaten facilities around Moscow and St. Petersburg. Operators expect higher spending on physical defenses and cybersecurity, costs that may be passed on to customers.","briefOverview":"\u003cp\u003eRussian data center operators are preparing to spend more on physical defenses as Moscow tightens security requirements for critical infrastructure amid continued Ukrainian drone attacks. A decree signed by President Vladimir Putin in late August allows the government to temporarily take control of critical infrastructure if operators fail to adequately protect their facilities, including from drone attacks. The rules cover sectors such as energy, telecommunications, transportation and utilities, and Russian media reports say they are also affecting data centers hosting systems used by government agencies, banks and major service providers.\u003c/p\u003e\n\n\u003cp\u003eThe article says the requirements are challenging because much of Russia’s data center capacity is concentrated around Moscow and St. Petersburg, areas increasingly exposed to Ukrainian drone operations. Russia had 181 data centers as of February, according to data from Russian brokerage BCS. Some companies were reportedly considering moving data from Moscow-area facilities to locations east of the Ural Mountains as early as 2023 because of drone attacks on the capital.\u003c/p\u003e\n\n\u003cp\u003eOperators are also planning cybersecurity improvements, including backup communications, stronger protection against DDoS attacks and better management of software vulnerabilities. Some data centers have already started strengthening defenses around external engineering equipment, according to RUVDS chief executive Nikita Tsaplin. These physical and digital security investments are expected to raise operating costs, which could ultimately be passed on to customers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A decree signed by President Vladimir Putin in late August allows the Russian government to temporarily take control of critical infrastructure if operators fail to adequately protect their facilities, including from drone attacks.","Russian media reports say the new rules are affecting data centers, especially those hosting systems used by government agencies, banks, and major service providers.","Some Russian data centers have begun strengthening defenses around external engineering equipment, according to RUVDS chief executive Nikita Tsaplin.","Russia’s data center capacity is concentrated around Moscow and St. Petersburg, areas increasingly exposed to Ukrainian drone operations.","Russian data center operators told Kommersant they plan to strengthen cybersecurity by setting up backup communications, improving DDoS protection, and better managing software vulnerabilities."],"insights":["The decree links physical protection failures at privately operated critical infrastructure to a potential state takeover, making drone defense a governance and control issue rather than only a facility-security cost.","Russian data centers face a combined risk profile: operators are investing in both physical defenses against drones and digital measures such as backup communications, DDoS protection, and vulnerability management.","The concentration of Russian data center capacity around Moscow and St. Petersburg creates a location-specific exposure because those areas are increasingly within reach of Ukrainian drone operations.","Earlier consideration of moving data from Moscow-area facilities to locations east of the Ural Mountains shows that drone threats were already influencing Russian data center location strategy as early as 2023.","The leaked Rosneft document’s warning that defenses such as nets, barriers, and smoke screens cannot guarantee safety highlights the limits of physical hardening against explosions or debris."],"referencedReports":[{"title":"Kommersant report on new security requirements for Russian critical infrastructure","url":"https://www.kommersant.ru/doc/8923600","publisher":"Kommersant","context":"The article cites this Kommersant report as the source for the claim that Putin’s decree allows temporary government control of critical infrastructure if operators fail to protect facilities, including from drone attacks.","category":"news","primary":true}],"body":"\u003cp\u003eRussian data center operators are preparing to spend more on physical defenses as Moscow tightens security requirements for critical infrastructure amid continued Ukrainian drone attacks. A decree signed by President Vladimir Putin in late August allows the government to temporarily take control of critical infrastructure if operators fail to adequately protect their facilities, including from drone attacks. The rules cover sectors such as energy, telecommunications, transportation and utilities, and Russian media reports say they are also affecting data centers hosting systems used by government agencies, banks and major service providers.\u003c/p\u003e\n\n\u003cp\u003eThe article says the requirements are challenging because much of Russia’s data center capacity is concentrated around Moscow and St. Petersburg, areas increasingly exposed to Ukrainian drone operations. Russia had 181 data centers as of February, according to data from Russian brokerage BCS. Some companies were reportedly considering moving data from Moscow-area facilities to locations east of the Ural Mountains as early as 2023 because of drone attacks on the capital.\u003c/p\u003e\n\n\u003cp\u003eOperators are also planning cybersecurity improvements, including backup communications, stronger protection against DDoS attacks and better management of software vulnerabilities. Some data centers have already started strengthening defenses around external engineering equipment, according to RUVDS chief executive Nikita Tsaplin. These physical and digital security investments are expected to raise operating costs, which could ultimately be passed on to customers.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft says some users can’t open the Teams desktop client","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-says-some-users-cant-open-the-teams-desktop-client/","time":"14:30","priority":"MAY READ","score":58,"tldr":"Microsoft is investigating a Teams issue that prevents or delays some Windows users from opening the desktop client, with web and mobile apps recommended as workarounds. The company is also looking into a separate Teams for Mac problem that can block users from joining calls or meetings.","briefOverview":"\u003cp\u003eMicrosoft is working to resolve a known issue that causes delays or blocks some users from opening the Microsoft Teams desktop client on Windows systems. The issue was acknowledged on Thursday at 16:45 EDT and is tracked as TM1466820. Microsoft said some users may initially be unable to load the client or may experience loading delays of up to two minutes when first opening Teams on Windows devices.\u003c/p\u003e\n\n\u003cp\u003eWhile remediation is underway, Microsoft advised affected users to use Microsoft Teams on the web or alternative access methods such as the Teams mobile app. The company is analyzing service logs and telemetry data and has contacted some affected users to identify the root cause and determine mitigation options. The issue matters because it can prevent affected users from accessing Teams through the Windows desktop client or slow access to the application.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is also investigating a separate issue that may prevent Mac users from joining calls or meetings in Microsoft Teams, tracked as TM1466659. The company initially blamed a code change for causing the Teams call and meeting service infrastructure to fail to process some requests, but it is now reassessing the root cause. The article also notes recent Microsoft issues affecting Teams Free chat and calls, Teams and New Outlook launches on ARM-based Windows PCs, and Exchange Online email delivery.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is working to resolve a known issue that causes delays or blocks some users from opening the Microsoft Teams desktop client on Windows systems.","Microsoft said affected Windows users may be unable to load Teams initially or may experience loading delays of up to two minutes when first opening the client.","Microsoft advised affected customers to use Microsoft Teams on the web or alternative access methods such as the Teams mobile app while remediation is underway.","Microsoft is also investigating a separate issue that may prevent Mac users from joining calls or meetings in Microsoft Teams.","Microsoft is reviewing service logs and telemetry data and has contacted some affected users to identify the root cause and determine mitigation options."],"insights":["The Windows Teams issue appears limited to the desktop client, because Microsoft recommends using Teams on the web or mobile app to avoid the impact.","Microsoft’s investigation into the Mac Teams meeting issue is still unsettled, as the company initially suspected a code change but is now reassessing that root cause.","The article describes several Microsoft service problems occurring close together, including Teams desktop loading issues, Teams for Mac meeting problems, Teams and New Outlook launch failures on ARM-based Windows PCs, and Exchange Online email delays."],"referencedReports":[{"title":"TM1466820","url":"https://admin.cloud.microsoft/#/servicehealth/:/alerts/TM1466820","publisher":"microsoft","context":"The article says Microsoft acknowledged the Windows Teams desktop client loading issue in a known-issue incident tracked as TM1466820.","category":"advisory","primary":true},{"title":"TM1466659","url":"http://admin.cloud.microsoft/#/servicehealth/:/alerts/TM1466659","publisher":"microsoft","context":"The article says Microsoft is investigating a separate issue preventing Mac users from joining Teams calls and meetings, tracked as TM1466659.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft is working to resolve a known issue that causes delays or blocks some users from opening the Microsoft Teams desktop client on Windows systems. The issue was acknowledged on Thursday at 16:45 EDT and is tracked as TM1466820. Microsoft said some users may initially be unable to load the client or may experience loading delays of up to two minutes when first opening Teams on Windows devices.\u003c/p\u003e\n\n\u003cp\u003eWhile remediation is underway, Microsoft advised affected users to use Microsoft Teams on the web or alternative access methods such as the Teams mobile app. The company is analyzing service logs and telemetry data and has contacted some affected users to identify the root cause and determine mitigation options. The issue matters because it can prevent affected users from accessing Teams through the Windows desktop client or slow access to the application.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is also investigating a separate issue that may prevent Mac users from joining calls or meetings in Microsoft Teams, tracked as TM1466659. The company initially blamed a code change for causing the Teams call and meeting service infrastructure to fail to process some requests, but it is now reassessing the root cause. The article also notes recent Microsoft issues affecting Teams Free chat and calls, Teams and New Outlook launches on ARM-based Windows PCs, and Exchange Online email delivery.\u003c/p\u003e\n"},{"n":26,"title":"Data access: the hidden cost of security vendor lock-in","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/blog/siem-data-export-comparison","time":"00:00","priority":"MAY READ","score":55,"tldr":"The article argues that security vendors often create lock-in by charging for, delaying, or limiting access to customers’ own telemetry. It urges buyers to evaluate SIEM and endpoint vendors based on whether they provide full-fidelity, real-time data access without extra licensing costs.","briefOverview":"\u003cp\u003eThe article argues that security data is the most important asset in a SOC and that many vendors make customers pay, wait, or license their way to getting it back out. It defines open data as data that belongs to the customer at no additional cost, includes all telemetry rather than summaries or selected tables, and is available in real time. The author says this matters because investigations, models, and agents are only as good as the telemetry underneath them.\u003c/p\u003e\n\n\u003cp\u003eThe article compares public documentation from CrowdStrike, Palo Alto Networks, Microsoft, Google, Splunk, and Elastic on how customers can export or query their security data. It rates CrowdStrike and Palo Alto Networks as restricted, Microsoft as partially open, Google as limited, and Splunk and Elastic as open based on cost, freshness, fidelity, and openness. It highlights that delayed batch exports can leave a gap during an incident, while attackers may move quickly enough that evidence arrives too late to help stop damage.\u003c/p\u003e\n\n\u003cp\u003eThe article urges buyers to put data portability into RFPs and ask vendors whether all telemetry can be exported continuously without a separate license, how long events take to become usable in another chosen system, and what breaks when a new analytics engine, data lake, or AI model is added. It argues that making telemetry expensive or slow to share fragments the security picture across tools. The broader point is that organizations should retain the freedom to add, change, or leave security platforms without paying a toll or waiting on delayed access to their own data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that security data is the most important asset in a SOC and that many vendors make customers pay, wait, or license their way to getting that data back out.","The article defines open data as customer-owned data available at no additional cost, in full fidelity, and in real time.","The article says delayed telemetry is increasingly dangerous because CrowdStrike’s 2026 Global Threat Report reported an average eCrime breakout time of 29 minutes, a fastest breakout time of 27 seconds, and one intrusion where exfiltration began four minutes after initial access.","The article compares public documentation from CrowdStrike, Palo Alto Networks, Microsoft, Google, Splunk, and Elastic and rates their data access models from restricted to open.","The article recommends that buyers put data portability on security vendor RFPs and score vendors based on the cost and delay involved in moving telemetry somewhere else."],"insights":["The article separates support for an open schema or API from true openness, arguing that a standard only describes data format and does not prove customers can access all of their data without cost or delay.","The article frames data export restrictions as a purchasing decision made before an incident, because delays and licensing barriers are inherited from vendor selection rather than created during an emergency.","The article argues that all-in-one security platforms can appear to solve data fragmentation while benefiting from the same vendor-controlled data movement limits that helped create the fragmentation.","The article recommends asking vendors in writing what happens when a customer adds a different analytics engine, data lake, or AI model, making future tool choice a concrete test of lock-in.","The article gives Microsoft partial credit for a true streaming path while still criticizing its limits, showing that the author’s openness rating depends on data freshness, field coverage, destination flexibility, and cost rather than on a single feature."],"referencedReports":[{"title":"2026 Global Threat Report","url":"https://www.crowdstrike.com/en-us/global-threat-report/","publisher":"CrowdStrike","context":"The article cites CrowdStrike’s report for breakout-time figures, including an average eCrime breakout time of 29 minutes, a fastest time of 27 seconds, and one intrusion where exfiltration began four minutes after initial access.","category":"research","primary":false}],"body":"\u003cp\u003eThe article argues that security data is the most important asset in a SOC and that many vendors make customers pay, wait, or license their way to getting it back out. It defines open data as data that belongs to the customer at no additional cost, includes all telemetry rather than summaries or selected tables, and is available in real time. The author says this matters because investigations, models, and agents are only as good as the telemetry underneath them.\u003c/p\u003e\n\n\u003cp\u003eThe article compares public documentation from CrowdStrike, Palo Alto Networks, Microsoft, Google, Splunk, and Elastic on how customers can export or query their security data. It rates CrowdStrike and Palo Alto Networks as restricted, Microsoft as partially open, Google as limited, and Splunk and Elastic as open based on cost, freshness, fidelity, and openness. It highlights that delayed batch exports can leave a gap during an incident, while attackers may move quickly enough that evidence arrives too late to help stop damage.\u003c/p\u003e\n\n\u003cp\u003eThe article urges buyers to put data portability into RFPs and ask vendors whether all telemetry can be exported continuously without a separate license, how long events take to become usable in another chosen system, and what breaks when a new analytics engine, data lake, or AI model is added. It argues that making telemetry expensive or slow to share fragments the security picture across tools. The broader point is that organizations should retain the freedom to add, change, or leave security platforms without paying a toll or waiting on delayed access to their own data.\u003c/p\u003e\n"},{"n":5,"title":"39 New Methods That Compromise Passkey Authentication","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/39-new-methods-that-compromise-passkey-authentication/","time":"14:01","priority":"MAY READ","score":45,"tldr":"Passkeys’ cryptography remains strong, but accounts can still be compromised through surrounding systems like enrollment, recovery, synced vaults, browsers, operating systems, and user prompts. The article argues that high-value enterprise identities need tightly controlled enrollment and dedicated biometric hardware to reduce that broader attack surface.","briefOverview":"\u003cp\u003eThe article says there are now at least 39 publicly documented methods, attack paths, research techniques, and exploitation scenarios involving passkeys and the infrastructure around them. It emphasizes that this does not mean criminals have operationalized all 39, but that the playbook is being written publicly. The central point is that FIDO2 cryptography can remain intact while an account protected by a passkey is still compromised.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that modern passkey authentication crosses many trust boundaries, including web applications, browsers, operating systems, password managers, cloud synchronization services, mobile devices, Bluetooth transport, account recovery systems, enrollment processes, help desks, and users. It cites SpecterOps’ Pass the Passkey research showing that malware may ask legitimate WebAuthn infrastructure to generate a signed assertion after a user completes what appears to be a normal Windows authentication prompt. In that example, the private key never leaves its protected location and the cryptography is not cracked, but the authentication process is manipulated.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights attacks against prompts, synchronized passkeys, cloud recovery, password manager exports, mobile devices, browser extensions, and enrollment or recovery workflows. It argues that attackers may compromise accounts by registering new attacker-controlled passkeys or abusing weaker fallback and recovery processes instead of stealing existing credentials. The article concludes that high-value enterprise identities should use dedicated biometric hardware, approved authenticator restrictions, enforced user verification, proper challenge and session validation, and stronger enrollment and recovery controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that at least 39 publicly documented methods, attack paths, research techniques, and exploitation scenarios now involve passkeys and the infrastructure around them.","The article says attackers can compromise accounts protected by passkeys without cracking FIDO2 cryptography or extracting a private key, by manipulating surrounding systems such as browsers, operating systems, prompts, synchronization, enrollment, and recovery.","Several documented techniques target the user interface around authentication, including passkey prompt flooding, credential interface deception, application metadata spoofing, window handle spoofing, remote desktop passkey phishing, and FIDO interface overlay attacks.","The article argues that shareable or synchronized passkeys expand the attack surface because they can inherit weaknesses from phones, operating systems, password managers, cloud accounts, browsers, recovery processes, and synchronization systems.","The article says dedicated biometric hardware can reduce the surrounding attack surface when paired with correct service configuration, approved authenticator restrictions, enforced user verification, and strong enrollment and recovery controls."],"insights":["The article emphasizes that a passkey-protected account can be compromised even when the private key never leaves its protected location, because malware may be able to trigger legitimate authentication infrastructure to produce a signed assertion after the user approves a normal-looking prompt.","The article highlights enrollment as a high-impact weak point because attackers may not need to steal an existing passkey if they can use account access, help desk processes, or recovery flows to register a new attacker-controlled passkey.","The article identifies synchronized and shareable passkeys as an architectural tradeoff, because moving credentials through cloud accounts, password managers, exports, or device recovery expands the security boundary beyond the original authenticator.","The article makes service configuration a central control, stating that dedicated hardware only preserves its security model if the relying service restricts approved authenticator classes, validates authenticator identity, enforces user verification, and prevents weaker fallback methods."],"referencedReports":[{"title":"Pass the Passkey","url":"https://specterops.io/wp-content/uploads/sites/3/2026/08/Pass-the-Passkey_A4_v2.pdf","publisher":"SpecterOps","context":"The article cites SpecterOps' Pass the Passkey research as demonstrating that malware can use legitimate WebAuthn infrastructure to generate signed assertions without extracting a private key, and later references its tooling for invoking legitimate-looking Windows passkey prompts.","category":"research","primary":true}],"body":"\u003cp\u003eThe article says there are now at least 39 publicly documented methods, attack paths, research techniques, and exploitation scenarios involving passkeys and the infrastructure around them. It emphasizes that this does not mean criminals have operationalized all 39, but that the playbook is being written publicly. The central point is that FIDO2 cryptography can remain intact while an account protected by a passkey is still compromised.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that modern passkey authentication crosses many trust boundaries, including web applications, browsers, operating systems, password managers, cloud synchronization services, mobile devices, Bluetooth transport, account recovery systems, enrollment processes, help desks, and users. It cites SpecterOps’ Pass the Passkey research showing that malware may ask legitimate WebAuthn infrastructure to generate a signed assertion after a user completes what appears to be a normal Windows authentication prompt. In that example, the private key never leaves its protected location and the cryptography is not cracked, but the authentication process is manipulated.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights attacks against prompts, synchronized passkeys, cloud recovery, password manager exports, mobile devices, browser extensions, and enrollment or recovery workflows. It argues that attackers may compromise accounts by registering new attacker-controlled passkeys or abusing weaker fallback and recovery processes instead of stealing existing credentials. The article concludes that high-value enterprise identities should use dedicated biometric hardware, approved authenticator restrictions, enforced user verification, proper challenge and session validation, and stronger enrollment and recovery controls.\u003c/p\u003e\n"},{"n":25,"title":"AI-Driven Threat Intelligence for Gulf Enterprises: Why Detection Speed Is Now a Regulatory Requirement","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/ai-powered-threat-intelligence-gcc/","time":"13:23","priority":"MAY READ","score":45,"tldr":"Gulf cybersecurity regulations are making fast breach detection a compliance requirement, with reporting clocks as short as six hours after detection. The article argues that AI-driven threat intelligence is becoming necessary for enterprises in the UAE and Saudi Arabia to find threats quickly enough and prove they met regulatory timelines.","briefOverview":"\u003cp\u003eThe article argues that Gulf enterprises are facing cybersecurity rules where detection speed is becoming a regulatory requirement. It cites the UAE Information Assurance Standard v2 as requiring incident notifications w
