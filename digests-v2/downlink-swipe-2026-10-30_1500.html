<script type="application/json" id="dl-articles">[{"n":7,"title":"4 real? Tracking exploitation and patching of eMudhra’s weak keys","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/emudhra-patching/","time":"17:38","priority":"MUST READ","score":96,"tldr":"Cloudflare found that eMudhra’s publicly recoverable intermediate CA keys were used to forge certificates within hours of disclosure, though it has seen no evidence of interception against its network. Most modern browsers are patched, but many bots, legacy clients, and Android WebView instances still accept the compromised certificate chain and need updates.","briefOverview":"\u003cp\u003eeMudhra’s eight affected intermediate certificate-signing keys were so weak that they could be recovered almost immediately from public certificates. Anyone with those keys could create certificates for any domain that unpatched clients not enforcing Certificate Transparency would accept. Cloudflare describes this as fundamentally different from prior certificate-authority compromises because the keys were publicly recoverable by anyone rather than limited to a particular attacker or organization.\u003c/p\u003e\n\n\u003cp\u003eCloudflare began patching high-impact systems on October 19, including Pingora-based customer origin-facing proxies, and deployed logging to identify connections presenting certificates signed by the weak keys. The company recorded about 22,000 attempted handshakes using the keys and observed forged certificates made within hours of the weakness becoming public, but found no evidence of interception of Cloudflare connections. Its probes indicate that most current browsers are patched, while bots, older browsers, and 30–40% of embedded Android WebView clients still accept the compromised certificate chain; Cloudflare urges affected users and customers to patch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["eMudhra’s eight affected intermediate private keys could be recovered almost instantly from public certificates, enabling anyone to create certificates for any domain that unpatched clients without Certificate Transparency enforcement would accept.","Cloudflare patched its high-priority systems, including Pingora-based customer origin-facing proxies, beginning on October 19 and completed a source-code analysis within four hours to identify other affected systems.","After deploying logging on October 21, Cloudflare recorded about 22,000 attempted TLS handshakes using the weak eMudhra keys, including approximately 160 certificates whose listed domain names were unrelated to the requested site.","Cloudflare found no evidence that the weak keys had been used to intercept its connections, but observed forged certificates dated less than an hour after Mozilla’s bug report became public.","Probe results indicated that most up-to-date modern browsers were patched, while bots, older browsers, and 30–40% of embedded Android WebView clients continued to accept the compromised certificate chain."],"insights":["Cloudflare’s logging suggests the observed forged certificates were likely servers’ default certificates rather than active interception attempts, because their domain names did not match the requested sites and identical certificates were presented from multiple Cloudflare locations.","The probe data is difficult to interpret because challenge-page traffic is heavily skewed toward unconfirmed bots, and a change in bot classification created an apparent patching trend for Chrome-on-macOS traffic.","After an initial period of patching over the first weekend, acceptance of the compromised chain showed little further movement across most measured client groups and large networks.","The incident demonstrates that relying on a static list of trusted certificate authorities can delay emergency response, which is why Cloudflare highlights mechanisms that can quickly distribute revocation and certificate-transparency updates."],"referencedReports":[{"title":"eMudhra: We Have a Problem","url":"https://emudhra.we-have-a-problem.com/","publisher":"Dennis Jackson","context":"The article recommends this crowdsourced website for instructions on patching systems affected by eMudhra’s weak keys.","category":"guide","primary":false},{"title":"Apple Instructions","url":"https://emudhra.we-have-a-problem.com/apple.html","publisher":"Dennis Jackson","context":"The article specifically directs macOS developers to these patching instructions.","category":"guide","primary":false}],"body":"\u003cp\u003eeMudhra’s eight affected intermediate certificate-signing keys were so weak that they could be recovered almost immediately from public certificates. Anyone with those keys could create certificates for any domain that unpatched clients not enforcing Certificate Transparency would accept. Cloudflare describes this as fundamentally different from prior certificate-authority compromises because the keys were publicly recoverable by anyone rather than limited to a particular attacker or organization.\u003c/p\u003e\n\n\u003cp\u003eCloudflare began patching high-impact systems on October 19, including Pingora-based customer origin-facing proxies, and deployed logging to identify connections presenting certificates signed by the weak keys. The company recorded about 22,000 attempted handshakes using the keys and observed forged certificates made within hours of the weakness becoming public, but found no evidence of interception of Cloudflare connections. Its probes indicate that most current browsers are patched, while bots, older browsers, and 30–40% of embedded Android WebView clients still accept the compromised certificate chain; Cloudflare urges affected users and customers to patch.\u003c/p\u003e\n"},{"n":6,"title":"Trojanized Claude Code Extension Delivered Persistent SSH Backdoor to Developer Machines","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/claude-code-extension-trojanized","time":"18:08","priority":"MUST READ","score":94,"tldr":"A trojanized Anthropic Claude Code VS Code extension version 2.1.313 was distributed through Open-VSX and Cursor for about 11 hours, installing SSH backdoor persistence and a reverse tunnel on affected developer machines. Anyone who installed it should treat the host as compromised, remove persistence artifacts, reinstall a clean version, and rotate accessible credentials.","briefOverview":"\u003cp\u003eOn October 29, 2026, a trojanized version 2.1.313 of Anthropic\u0026rsquo;s Claude Code VS Code extension was published to Open-VSX and distributed through Cursor\u0026rsquo;s mirrored marketplace. The build appeared under Anthropic\u0026rsquo;s legitimate Open-VSX publisher identity but contained a malicious loader embedded in its \u003ccode\u003eextension.js\u003c/code\u003e bundle. Cursor reported that up to 5,000 users received the compromised version during an approximately 11-hour exposure window.\u003c/p\u003e\n\n\u003cp\u003eWhen the extension module loaded, the malicious code ran under Node.js without requiring a Claude conversation, VS Code API use, or package-manager lifecycle hooks. It added an attacker SSH key, created operating-system-specific persistence, opened a reverse SSH tunnel to \u003ccode\u003e134.209.82.225\u003c/code\u003e, and sent machine reconnaissance data to an HTTP beacon. The persistence could remain after the extension was uninstalled, including through a macOS LaunchAgent, a Windows scheduled task or Startup script, and Linux cron entries.\u003c/p\u003e\n\n\u003cp\u003eThe malicious version was removed from Open-VSX, Cursor\u0026rsquo;s marketplace, and the Microsoft Marketplace, while clean neighboring releases 2.1.312 and 2.1.314 were verified to contain none of the listed indicators. Users who installed version 2.1.313 are advised to treat their machines as compromised, check for the \u003ccode\u003esvc-telemetry\u003c/code\u003e SSH key, collect and remove persistence artifacts, and reinstall version 2.1.314 or later. The article also recommends rotating source-control, cloud, SSH, CI/CD, and package-registry credentials reachable from the affected machine, and states that rebuilding the host is safer if the reverse tunnel is confirmed to have connected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Open-VSX release of Anthropic Claude Code extension version 2.1.313 contained a malicious loader in extension.js and was also distributed through Cursor's mirrored extension marketplace.","The malicious extension added an attacker-controlled SSH key, set up operating-system-specific persistence, opened a reverse SSH tunnel to 134.209.82.225, and sent host reconnaissance data over HTTP.","Cursor reported that up to 5,000 of its users received the trojanized version during an approximately 11-hour exposure window on October 29, 2026.","Removing the extension alone does not remove the persistence artifacts, so affected users should check for the svc-telemetry SSH key, remove persistence, and rotate credentials reachable from the machine.","Clean versions 2.1.312 and 2.1.314 were verified to contain none of the listed malicious indicators."],"insights":["The malicious code ran simply when the extension module loaded under Node.js, so no Claude conversation, VS Code API use, or package-install script was required for the payload to execute.","Because the compromised build was published under Anthropic’s legitimate Open-VSX publisher identity, users could not have identified it as a simple lookalike or typosquatted extension.","A single malicious Open-VSX publication automatically reached downstream consumers such as Cursor’s marketplace, expanding the impact beyond the original registry.","The loader collected names of environment variables matching terms such as KEY, TOKEN, SECRET, PASS, AWS, and GCP, which could reveal what credentials were present even without collecting their values.","The backdoor could survive extension removal through separate startup mechanisms, meaning uninstalling version 2.1.313 alone was not a complete cleanup."],"referencedReports":[{"title":"Security Notice on Anthropic.claude-code 2.1.313","url":"https://cursor.com/blog/claude-code-extension-security-notice","publisher":"cursor","context":"The article cites Cursor's security notice for the exposure window, affected-user estimate, remediation guidance, and cleanup scripts.","category":"advisory","primary":true}],"body":"\u003cp\u003eOn October 29, 2026, a trojanized version 2.1.313 of Anthropic\u0026rsquo;s Claude Code VS Code extension was published to Open-VSX and distributed through Cursor\u0026rsquo;s mirrored marketplace. The build appeared under Anthropic\u0026rsquo;s legitimate Open-VSX publisher identity but contained a malicious loader embedded in its \u003ccode\u003eextension.js\u003c/code\u003e bundle. Cursor reported that up to 5,000 users received the compromised version during an approximately 11-hour exposure window.\u003c/p\u003e\n\n\u003cp\u003eWhen the extension module loaded, the malicious code ran under Node.js without requiring a Claude conversation, VS Code API use, or package-manager lifecycle hooks. It added an attacker SSH key, created operating-system-specific persistence, opened a reverse SSH tunnel to \u003ccode\u003e134.209.82.225\u003c/code\u003e, and sent machine reconnaissance data to an HTTP beacon. The persistence could remain after the extension was uninstalled, including through a macOS LaunchAgent, a Windows scheduled task or Startup script, and Linux cron entries.\u003c/p\u003e\n\n\u003cp\u003eThe malicious version was removed from Open-VSX, Cursor\u0026rsquo;s marketplace, and the Microsoft Marketplace, while clean neighboring releases 2.1.312 and 2.1.314 were verified to contain none of the listed indicators. Users who installed version 2.1.313 are advised to treat their machines as compromised, check for the \u003ccode\u003esvc-telemetry\u003c/code\u003e SSH key, collect and remove persistence artifacts, and reinstall version 2.1.314 or later. The article also recommends rotating source-control, cloud, SSH, CI/CD, and package-registry credentials reachable from the affected machine, and states that rebuilding the host is safer if the reverse tunnel is confirmed to have connected.\u003c/p\u003e\n"},{"n":2,"title":"Florida warns that 4.9 million people had Social Security numbers leaked in financial aid site breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/florida-warns-5-million-affected-financial-aid-site-breach","time":"15:54","priority":"MUST READ","score":93,"tldr":"Florida’s Department of Education says a breach of its Student Financial Aid website exposed personal data, including Social Security numbers, for nearly 4.9 million financial-aid applicants. The site was taken offline while officials investigate, though aid disbursements and student financial assistance are not expected to be affected.","briefOverview":"\u003cp\u003eFlorida’s Department of Education said an unauthorized party accessed a system or database connected to the Florida Student Financial Aid website. The department became aware of the breach on October 19 and said nearly 5 million people who applied for financial aid in the state were affected. Exposed information includes names, addresses, phone numbers, genders, email addresses, Social Security numbers, and dates of birth.\u003c/p\u003e\n\n\u003cp\u003eFlorida took the financial-aid website offline and warned that other department sites and services could have temporary disruptions. It said financial aid disbursements, tuition payments, scholarships, grants, and student loans would not be affected or delayed. The department said the incident had been contained, is working with the Florida Digital Service and Florida Department of Law Enforcement, and advised affected people to monitor their credit reports and financial accounts for irregular activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Florida’s Department of Education said it became aware on October 19 of a breach involving the Florida Student Financial Aid website.","The breach exposed information on nearly 5 million people who applied for financial aid in Florida, including names, addresses, phone numbers, email addresses, dates of birth, and Social Security numbers.","Florida took the financial aid website offline and said some other department websites and services could face temporary disruptions.","The department said student aid disbursements, tuition payments, scholarships, grants, and student loans would not be affected or delayed.","Florida said it is working with the Florida Digital Service and the Florida Department of Law Enforcement, and urged affected people to monitor their credit reports and financial accounts."],"insights":["The exposed combination of Social Security numbers, dates of birth, contact details, and addresses makes the incident more consequential than a breach involving only email addresses or names.","Florida took the affected site offline while stating that aid disbursements, tuition payments, scholarships, grants, and loans would continue without delay.","The department did not disclose how the unauthorized party gained access or identify the attackers, despite saying the incident had been contained.","The breach follows other recent education and government-related incidents cited in the article, including California’s education department breach and Florida’s DMV breach."],"referencedReports":[{"title":"Florida Department of Education Data Breach Notice","url":"https://www.fldoe.org/databreach.stml","publisher":"florida-department-of-education","context":"The article cites the department's statement describing the unauthorized access, exposed data types, and response to the financial-aid website breach.","category":"advisory","primary":true}],"body":"\u003cp\u003eFlorida’s Department of Education said an unauthorized party accessed a system or database connected to the Florida Student Financial Aid website. The department became aware of the breach on October 19 and said nearly 5 million people who applied for financial aid in the state were affected. Exposed information includes names, addresses, phone numbers, genders, email addresses, Social Security numbers, and dates of birth.\u003c/p\u003e\n\n\u003cp\u003eFlorida took the financial-aid website offline and warned that other department sites and services could have temporary disruptions. It said financial aid disbursements, tuition payments, scholarships, grants, and student loans would not be affected or delayed. The department said the incident had been contained, is working with the Florida Digital Service and Florida Department of Law Enforcement, and advised affected people to monitor their credit reports and financial accounts for irregular activity.\u003c/p\u003e\n"},{"n":3,"title":"Chinese Hackers Use AI-Powered ARTEX to Target Over 200 Organizations Worldwide","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/chinese-hackers-use-ai-powered-artex-to.html","time":"16:58","priority":"MUST READ","score":92,"tldr":"CrowdStrike says China-linked Vapor Panda used the AI-powered ARTEX framework to scale intrusions against more than 200 organizations worldwide, including government, telecom, defense, semiconductor, and financial targets. The campaign combined autonomous agent-driven reconnaissance and lateral movement with established techniques to deploy malware, steal credentials, and compromise cloud, Active Directory, email, and VPN environments.","briefOverview":"\u003cp\u003eCrowdStrike attributed a global intrusion campaign to the China-based group Vapor Panda, which used the Go-based, AI-powered ARTEX penetration-testing framework. Beginning October 17, 2026, the group targeted more than 200 organizations, including foreign ministries, U.S. organizations in pharmaceutical, semiconductor, defense, nuclear, and financial sectors, and telecommunications providers in several countries. CrowdStrike confirmed post-exploitation activity at nine organizations, where the attackers deployed the ShadowPad derivative BLOODALCHEMY and conducted credential spraying, network scanning, and reconnaissance.\u003c/p\u003e\n\n\u003cp\u003eARTEX uses planner and worker agents, supported by DeepSeek and an unidentified subscription-based commercial large language model, to coordinate reconnaissance and movement through victim environments while a human operator guides key actions. CrowdStrike said agents could try multiple paths across web applications, cloud services, containers, Active Directory, email, and VPN infrastructure, moving to alternatives when an approach failed. The article also describes additional China-linked groups, including Overcast Panda, which uses the FlowCloud backdoor following physical-access intrusions, and Titan Panda, which exploited hard-coded IIS machine keys in Intapp Time Server to compromise legal organizations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrowdStrike attributed a campaign using the AI-powered ARTEX penetration-testing framework to the China-based intrusion group Vapor Panda, also known as VexatiousTemper and overlapping with Earth Estries.","Starting October 17, 2026, Vapor Panda used ARTEX to target more than 200 organizations globally, including foreign ministries, U.S. pharmaceutical, semiconductor, defense, nuclear, and financial organizations, and telecommunications providers.","CrowdStrike confirmed post-exploitation activity at nine organizations, where the attackers deployed BLOODALCHEMY, a ShadowPad derivative, and conducted credential spraying, network scanning, and reconnaissance.","ARTEX coordinated planner and worker agents using DeepSeek and an unidentified subscription-based commercial large language model, while a human operator directed activities such as writing web shells and extracting domain administrator passwords.","CrowdStrike also described newly documented China-linked groups Hollow Panda, Overcast Panda, Titan Panda, and Veiled Panda, including Overcast Panda's use of the FlowCloud backdoor and Titan Panda's exploitation of hard-coded IIS machine keys in Intapp Time Server."],"insights":["ARTEX enabled agents to pursue several paths at once across web applications, cloud services, containers, Active Directory, email, and remote-access infrastructure, switching approaches when one path failed.","CrowdStrike reported that planning agents consumed roughly 1.4 billion input tokens during a single intrusion, illustrating the scale of automated activity involved.","One intrusion path relied on authentication keys that had not been rotated since 2022; the agents used them to forge an administrator token, read mailboxes, and recover VPN configuration details from sent email.","Overcast Panda has been linked to incidents in which victims' devices were physically accessed while the victims were traveling in China, after which the FlowCloud backdoor was installed for persistent remote monitoring and credential collection."],"referencedReports":[{"title":"Vapor Panda Uses ARTEX to Scale Global Campaign","url":"https://www.crowdstrike.com/en-us/blog/vapor-panda-uses-artex-to-scale-global-campaign/","publisher":"crowdstrike","context":"The article relies on CrowdStrike's analysis attributing ARTEX-enabled global targeting activity to Vapor Panda.","category":"research","primary":true},{"title":"Threat Actor Abuses Agentic AI Pentesting Framework to Target South Korean Organizations","url":"https://www.zscaler.com/blogs/security-research/threat-actor-abuses-agentic-ai-pentesting-framework-target-south-korean","publisher":"zscaler-threatlabz","context":"The article cites a Zscaler ThreatLabz report describing ARTEX as a framework that automates reconnaissance, vulnerability identification, and exploitation through multiple LLM backends.","category":"research","primary":false},{"title":"CrowdStrike 2026 Threat Hunting Report","url":"https://www.crowdstrike.com/en-us/blog/crowdstrike-2026-threat-hunting-report/","publisher":"crowdstrike","context":"The article references this CrowdStrike report in connection with the emergence of previously undocumented China-linked threat groups.","category":"research","primary":false},{"title":"CrowdStrike 2026 Legal Threat Landscape Report","url":"https://www.crowdstrike.com/en-us/blog/crowdstrike-2026-legal-threat-landscape-report/","publisher":"crowdstrike","context":"The article references this CrowdStrike report in connection with China-linked state-sponsored groups targeting organizations for intelligence gathering and intellectual-property theft.","category":"research","primary":false}],"body":"\u003cp\u003eCrowdStrike attributed a global intrusion campaign to the China-based group Vapor Panda, which used the Go-based, AI-powered ARTEX penetration-testing framework. Beginning October 17, 2026, the group targeted more than 200 organizations, including foreign ministries, U.S. organizations in pharmaceutical, semiconductor, defense, nuclear, and financial sectors, and telecommunications providers in several countries. CrowdStrike confirmed post-exploitation activity at nine organizations, where the attackers deployed the ShadowPad derivative BLOODALCHEMY and conducted credential spraying, network scanning, and reconnaissance.\u003c/p\u003e\n\n\u003cp\u003eARTEX uses planner and worker agents, supported by DeepSeek and an unidentified subscription-based commercial large language model, to coordinate reconnaissance and movement through victim environments while a human operator guides key actions. CrowdStrike said agents could try multiple paths across web applications, cloud services, containers, Active Directory, email, and VPN infrastructure, moving to alternatives when an approach failed. The article also describes additional China-linked groups, including Overcast Panda, which uses the FlowCloud backdoor following physical-access intrusions, and Titan Panda, which exploited hard-coded IIS machine keys in Intapp Time Server to compromise legal organizations.\u003c/p\u003e\n"},{"n":4,"title":"TeamViewer Flaw Lets Remote Computers Attack Users Who Connect to Control Them","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/teamviewer-flaw-lets-remote-computers.html","time":"15:17","priority":"SHOULD READ","score":85,"tldr":"TeamViewer fixed CVE-2026-111585 in version 15.83, a high-severity flaw that lets a malicious remote host crash—and potentially execute code on—the computer connecting to control it. Users should update TeamViewer clients, Portable, Android Remote Control, and Host installations immediately.","briefOverview":"\u003cp\u003eTeamViewer released version 15.83 to fix CVE-2026-111585, a high-severity flaw scored 8.8 that allows the computer being remotely controlled to attack the computer connecting to it. The issue affects TeamViewer Full Client on Windows, Linux, and macOS, Windows Portable, and the Android Remote Control app in versions before 15.83. TeamViewer said it was not aware of exploitation in the wild when it published the fix.\u003c/p\u003e\n\n\u003cp\u003eDuring a remote session, the host supplies screen-size information that the viewer uses to allocate memory, but an arithmetic error can cause the viewer to reserve too little space. Later screen data can then be written beyond that space, crashing the viewer’s TeamViewer session and allowing the host to repeat the crash. Remedio demonstrated running chosen code on Windows after bypassing built-in operating-system defenses, although the demonstration used a host-side stand-in for some attack data and was not entirely network-based.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires a user to start and accept a remote-control session to the malicious or compromised host, but it needs no password or further click and works in TeamViewer’s default configuration. TeamViewer provides no workaround other than updating to version 15.83 or later; users who had updated to version 15.82 remain affected. The same update also fixes two other high-severity issues, while a separate bulletin addresses six flaws in TeamViewer Remote Management add-ons.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TeamViewer version 15.83 fixes CVE-2026-111585, a high-severity flaw affecting TeamViewer clients before that version.","A malicious or compromised computer being remotely controlled can crash the TeamViewer application on the computer used to connect to it.","The affected products include the TeamViewer Full Client on Windows, Linux, and macOS, TeamViewer Portable for Windows, and the Android Remote Control app.","Remedio demonstrated code execution on Windows by bypassing operating-system defenses, although its demonstration used a host-side stand-in to provide some attack data.","TeamViewer said it was unaware of attacks exploiting the flaw when the fix was published, and it provides no workaround other than updating."],"insights":["The security direction is reversed from a typical remote-control concern: the computer being controlled can target the computer of the person connecting to control it after the session begins.","The attack requires no password or additional user action beyond accepting a remote-control session and works in TeamViewer’s default configuration.","Users who installed TeamViewer’s September 15.82 security update remain affected, because the flaw persists in every version before 15.83.","Although TeamViewer lists code execution as platform-dependent, Remedio’s reported demonstration of running chosen code was limited to Windows and was not performed entirely over the network.","The same 15.83 release fixes two additional high-severity issues, including a separate code-execution flaw that affects Linux and macOS."],"referencedReports":[{"title":"TV-2026-1011 Security Bulletin","url":"https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1011/","publisher":"teamviewer","context":"TeamViewer's bulletin documents CVE-2026-111585 and the additional flaws fixed in version 15.83.","category":"advisory","primary":true},{"title":"Remote Code Execution in TeamViewer","url":"https://remedio.io/research/vulnerability-disclosures/remote-code-execution-in-teamviewer/","publisher":"remedio","context":"Remedio researcher Omri Dar's technical analysis explains how a malicious remote host can target the viewer and describes the Windows demonstration.","category":"research","primary":true},{"title":"TV-2026-1012 Security Bulletin","url":"https://www.teamviewer.com/en/resources/trust-center/security-bulletins/tv-2026-1012/","publisher":"teamviewer","context":"A companion TeamViewer bulletin covers six additional flaws in Remote Management add-ons that were fixed through automatic updates.","category":"advisory","primary":false}],"body":"\u003cp\u003eTeamViewer released version 15.83 to fix CVE-2026-111585, a high-severity flaw scored 8.8 that allows the computer being remotely controlled to attack the computer connecting to it. The issue affects TeamViewer Full Client on Windows, Linux, and macOS, Windows Portable, and the Android Remote Control app in versions before 15.83. TeamViewer said it was not aware of exploitation in the wild when it published the fix.\u003c/p\u003e\n\n\u003cp\u003eDuring a remote session, the host supplies screen-size information that the viewer uses to allocate memory, but an arithmetic error can cause the viewer to reserve too little space. Later screen data can then be written beyond that space, crashing the viewer’s TeamViewer session and allowing the host to repeat the crash. Remedio demonstrated running chosen code on Windows after bypassing built-in operating-system defenses, although the demonstration used a host-side stand-in for some attack data and was not entirely network-based.\u003c/p\u003e\n\n\u003cp\u003eThe attack requires a user to start and accept a remote-control session to the malicious or compromised host, but it needs no password or further click and works in TeamViewer’s default configuration. TeamViewer provides no workaround other than updating to version 15.83 or later; users who had updated to version 15.82 remain affected. The same update also fixes two other high-severity issues, while a separate bulletin addresses six flaws in TeamViewer Remote Management add-ons.\u003c/p\u003e\n"},{"n":1,"title":"Trezor warns of suspected crypto-theft implant in hardware wallet","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/trezor-warns-of-suspected-crypto-theft-implant-in-hardware-wallet/","time":"15:58","priority":"SHOULD READ","score":84,"tldr":"Trezor warned that a Safe 5 wallet sold by Southeast Asian reseller CryptoBilis may contain a cellular-enabled hardware implant capable of capturing and transmitting recovery phrases. Users who bought devices from CryptoBilis since March 2026 should stop using them and move funds to a newly created wallet with a new recovery phrase.","briefOverview":"\u003cp\u003eTrezor has warned of a suspected hardware implant in a Trezor Safe 5 wallet sold by CryptoBilis through Tokopedia in Indonesia. A customer reported finding an extra circuit board placed between the main board and screen, containing a cellular module and antenna. Trezor has not yet received the device for examination and has not confirmed that it is malicious.\u003c/p\u003e\n\n\u003cp\u003eAccording to unconfirmed information from the customer, the added component may read information displayed on the wallet screen, including the recovery phrase, and transmit it through a mobile network when the device is plugged in. CryptoBilis was also implicated in a recent Ledger implant incident, and Trezor says the two reported implants appear similar in form and function. Trezor advises customers not to set up or use devices bought through CryptoBilis from March 2026 onward; those who already have should move funds to a newly created wallet with a new recovery phrase.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trezor received a report that a Safe 5 wallet purchased from CryptoBilis through Tokopedia in Indonesia contained an extra circuit board with a cellular module and antenna.","Trezor has not yet received and examined the reported device, so it has not confirmed whether it contains a malicious implant.","The customer’s unconfirmed information indicates that the implant may be able to read information displayed on the wallet screen, including the recovery phrase, and transmit it over a mobile network.","Trezor stopped sales through CryptoBilis on October 9, 2026, after the reseller was implicated in a similar Ledger device implant incident.","Trezor advises customers not to use devices bought through CryptoBilis from March 2026 onward and to move funds to a newly created wallet with a new recovery phrase if they have already used one."],"insights":["The suspected Trezor implant resembles implants found in a recent Ledger incident involving the same reseller, CryptoBilis, indicating that concern extends beyond a single wallet brand.","Trezor advises replacing both the wallet and its recovery phrase, because moving funds without creating new recovery words would not address exposure of the original phrase.","Trezor explicitly says device weight cannot reliably show whether a wallet has been altered, so a simple physical check is not sufficient.","Although Trezor has reported no known stolen funds from this suspected supply-chain issue, it halted CryptoBilis sales before receiving the reported Safe 5 device for examination."],"referencedReports":[{"title":"Implant reported in a Trezor sold by CryptoBilis","url":"http://trezor.io/blog/news/implant-reported-in-a-trezor-sold-by-cryptobilis","publisher":"trezor","context":"Trezor's warning describes the reported suspected implant in a Safe 5 wallet sold by CryptoBilis and provides guidance for potentially affected users.","category":"advisory","primary":true},{"title":"Police advisory on tampered cryptocurrency hardware wallets","url":"https://www.police.gov.sg/Media-Hub/News/2026/10/20261028_police_advisory_on_tampered_cryptocurrency_hardware_wallets","publisher":"singapore-police-force","context":"The article cites a Singapore police advisory that added $3.5 million to the reported losses associated with tampered Ledger wallets.","category":"advisory","primary":false}],"body":"\u003cp\u003eTrezor has warned of a suspected hardware implant in a Trezor Safe 5 wallet sold by CryptoBilis through Tokopedia in Indonesia. A customer reported finding an extra circuit board placed between the main board and screen, containing a cellular module and antenna. Trezor has not yet received the device for examination and has not confirmed that it is malicious.\u003c/p\u003e\n\n\u003cp\u003eAccording to unconfirmed information from the customer, the added component may read information displayed on the wallet screen, including the recovery phrase, and transmit it through a mobile network when the device is plugged in. CryptoBilis was also implicated in a recent Ledger implant incident, and Trezor says the two reported implants appear similar in form and function. Trezor advises customers not to set up or use devices bought through CryptoBilis from March 2026 onward; those who already have should move funds to a newly created wallet with a new recovery phrase.\u003c/p\u003e\n"},{"n":5,"title":"Introducing Censys Starter Subscriptions","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/introducing-censys-starter-subscriptions/","time":"17:44","priority":"MAY READ","score":25,"tldr":"Censys has launched revamped Starter subscriptions with a simplified one-credit-per-action model, increasing search value by roughly fourfold. Plans start at $79 per month and include daily free searches, rollover credits, collections, and expanded asset-tag limits.","briefOverview":"\u003cp\u003eCensys has introduced revised Starter subscriptions and replaced its former tiered credit costs with a single-credit model. Lookups, standard searches, and advanced regex queries now each use one credit, rather than the previous one, five, or eight credits depending on query type. Censys says this change, combined with the new pricing, provides roughly four times more actions per dollar for a typical Starter workflow.\u003c/p\u003e\n\n\u003cp\u003eThe \u003cspan class=\"math inline\"\u003e\\(79-per-month Starter plan includes 500 monthly credits, two Collections, and 10 asset tags, while Starter Pro costs \\)\u003c/span\u003e599 per month for 4,000 credits, four Collections, and 25 tags. Every registered user also receives five free searches each day that do not reduce subscription credits. Monthly credits refill at the start of each billing cycle, and unused credits roll over into the following month.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys has changed its usage model so that lookups, standard searches, and advanced regex queries each cost one credit.","The Starter plan costs $79 per month and includes 500 monthly credits, two Collections, and 10 asset tags.","Starter Pro costs $599 per month and includes 4,000 monthly credits, four Collections, and 25 asset tags.","Every registered Censys user receives five free searches per day that do not use subscription credits.","Unused subscription credits roll over to the next monthly billing cycle."],"insights":["The simplified pricing removes the previous cost difference between basic lookups, standard searches, and advanced regex queries, so the most expensive former query type now uses the same one-credit amount as a basic lookup.","Censys states that the new credit model and Starter pricing provide roughly four times more actions per dollar for a typical Starter workflow.","The five daily free searches are separate from subscription allowances, allowing registered users to perform routine checks without reducing their monthly credits.","Credit rollover means a user’s unused subscription capacity is not automatically lost at the end of a billing month."],"referencedReports":[],"body":"\u003cp\u003eCensys has introduced revised Starter subscriptions and replaced its former tiered credit costs with a single-credit model. Lookups, standard searches, and advanced regex queries now each use one credit, rather than the previous one, five, or eight credits depending on query type. Censys says this change, combined with the new pricing, provides roughly four times more actions per dollar for a typical Starter workflow.\u003c/p\u003e\n\n\u003cp\u003eThe \u003cspan class=\"math inline\"\u003e\\(79-per-month Starter plan includes 500 monthly credits, two Collections, and 10 asset tags, while Starter Pro costs \\)\u003c/span\u003e599 per month for 4,000 credits, four Collections, and 25 tags. Every registered user also receives five free searches each day that do not reduce subscription credits. Monthly credits refill at the start of each billing cycle, and unused credits roll over into the following month.\u003c/p\u003e\n"}]</script>
