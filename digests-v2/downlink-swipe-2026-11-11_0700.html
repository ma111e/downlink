<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA flags Cisco BroadWorks flaw as actively exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-flags-cisco-broadworks-flaw-as-actively-exploited-in-attacks/","time":"10:12","priority":"MUST READ","score":95,"tldr":"CISA has added Cisco BroadWorks XXE flaw CVE-2026-20320 to its Known Exploited Vulnerabilities catalog after active attacks, reportedly including a campaign against a European telecom provider that exposed sensitive keys and credentials. Organizations should urgently apply Cisco’s patches, especially where the BroadWorks OCI-P service is exposed.","briefOverview":"\u003cp\u003eCISA has added CVE-2026-20320, a high-severity Cisco BroadWorks vulnerability, to its Known Exploited Vulnerabilities Catalog after confirming that attackers are exploiting it. Cisco BroadWorks is used by telecom carriers and managed service providers to deliver cloud-based business phone, voice, and collaboration services. Federal Civilian Executive Branch agencies must secure affected systems by November 24 under Binding Operational Directive 26-04, and CISA urged all organizations to prioritize remediation.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects the BroadWorks Open Client Interface XML parser and allows unauthenticated remote attackers to send crafted XML messages that can read sensitive configuration information. Cisco said the issue occurs because external XML references are allowed by default, enabling improper parsing of XML entries in the OCI-P service. Malbear Labs reported that a Chinese-speaking threat actor used a jailbroken DeepSeek Flash model to target a European telecommunications provider and 13 organizations using its infrastructure, reportedly obtaining private keys and SSL credentials that could enable impersonation between BroadWorks components.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-20320, a high-severity Cisco BroadWorks flaw, to its Known Exploited Vulnerabilities Catalog after confirming active exploitation.","The flaw is an unauthenticated XML external entity issue in the BroadWorks Open Client Interface XML parser that can allow attackers to read sensitive configuration information using crafted XML messages.","Federal Civilian Executive Branch agencies must secure affected systems by November 24 under Binding Operational Directive 26-04, while CISA urged all organizations to prioritize remediation.","Malbear Labs reported that a Chinese-speaking threat actor used a jailbroken DeepSeek Flash model to exploit the flaw against a European telecommunications provider and 13 organizations using its infrastructure.","According to Malbear Labs, the reported campaign obtained system identity and SSL private keys from a BroadWorks XSP host, potentially enabling impersonation in communications between BroadWorks components."],"insights":["The affected BroadWorks OCI-P service can be abused without prior authentication because its XML parser allows external-entity resolution by default, making exposed instances especially consequential.","The reported intrusion was not limited to reading configuration data: attackers reportedly recovered a system identity private key and multiple SSL credential sets, and the identity key can enable impersonation between BroadWorks components.","The telecom provider’s BroadWorks Provisioning Server, which stores subscriber configuration for all users, was reportedly exposed through an unauthenticated directory listing in the same campaign.","CISA’s addition of the flaw to the KEV Catalog triggers a two-week remediation deadline for U.S. federal civilian agencies, but CISA explicitly recommends that private-sector organizations treat it as a priority as well.","Malbear Labs attributed the reported campaign to a Chinese-speaking actor that used a jailbroken DeepSeek Flash AI model, illustrating the article’s claim that the intrusion involved autonomous AI-assisted activity."],"referencedReports":[{"title":"Cisco BroadWorks XXE Vulnerability Advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-bworks-xxe-uwUd7CEt","publisher":"Cisco","context":"Cisco’s security advisory explains that improper XML parsing in the OCI-P service can allow unauthenticated attackers to read files using crafted XML messages.","category":"advisory","primary":true},{"title":"CISA Adds Six Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"CISA’s alert identifies CVE-2026-20320 as actively exploited and adds it to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":true},{"title":"Operation Snowball: Inside an Autonomous AI Intrusion Campaign","url":"https://malbearlabs.com/posts/operation-snowball-inside-an-autonomous-ai-intrusion-campaign#:~:text=Target%3A%20Cisco%20BroadWorks%20Voice%20Platform","publisher":"Malbear Labs","context":"Malbear Labs’ technical analysis describes a reported campaign against a European telecommunications provider that allegedly exploited the BroadWorks flaw with a jailbroken DeepSeek Flash model.","category":"research","primary":true}],"body":"\u003cp\u003eCISA has added CVE-2026-20320, a high-severity Cisco BroadWorks vulnerability, to its Known Exploited Vulnerabilities Catalog after confirming that attackers are exploiting it. Cisco BroadWorks is used by telecom carriers and managed service providers to deliver cloud-based business phone, voice, and collaboration services. Federal Civilian Executive Branch agencies must secure affected systems by November 24 under Binding Operational Directive 26-04, and CISA urged all organizations to prioritize remediation.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects the BroadWorks Open Client Interface XML parser and allows unauthenticated remote attackers to send crafted XML messages that can read sensitive configuration information. Cisco said the issue occurs because external XML references are allowed by default, enabling improper parsing of XML entries in the OCI-P service. Malbear Labs reported that a Chinese-speaking threat actor used a jailbroken DeepSeek Flash model to target a European telecommunications provider and 13 organizations using its infrastructure, reportedly obtaining private keys and SSL credentials that could enable impersonation between BroadWorks components.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft Patches 1,259 Flaws, Including Exploited Outlook Bug That May Expose NTLMv2 Hashes","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/microsoft-patches-1259-flaws-including.html","time":"08:17","priority":"MUST READ","score":95,"tldr":"Microsoft released patches for 1,259 vulnerabilities, including CVE-2026-124194, an actively exploited Outlook flaw that can expose NTLMv2 hashes when a user opens a crafted message file. Organizations should prioritize patching Outlook and internet-exposed systems, with U.S. federal agencies required to remediate the flaw by November 24, 2026.","briefOverview":"\u003cp\u003eMicrosoft released patches for 1,259 vulnerabilities across its software portfolio, following another month in which it fixed more than 1,000 flaws. The release includes 726 Windows flaws, 174 Office flaws, 59 SQL Server flaws, 27 SharePoint Server flaws, and 165 CVEs not issued by Microsoft. Tenable researcher Satnam Narang said Microsoft has addressed more than 5,100 CVEs in 2026 so far.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft flagged CVE-2026-124194, a Moderate-severity Microsoft Outlook flaw, as actively exploited. An unauthenticated attacker can send a specially crafted message file and convince a target to open it, causing Outlook to connect to an attacker-controlled network location without its usual external-content warning and potentially expose an NTLMv2 hash. CISA added the flaw to its Known Exploited Vulnerabilities catalog and directed U.S. federal agencies to apply the fix by November 24, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released patches for 1,259 vulnerabilities across its software portfolio, marking the second consecutive month with more than 1,000 flaws addressed.","Microsoft said CVE-2026-124194 is an actively exploited, moderate-severity Outlook flaw that can cause Outlook to connect to an attacker-controlled network location when a user opens a specially crafted message file.","The Outlook flaw could expose NTLMv2 authentication information, which could potentially be used to impersonate the affected user.","CISA added CVE-2026-124194 to its Known Exploited Vulnerabilities catalog and required U.S. federal agencies to apply the fix by November 24, 2026.","The patch release also includes remote code execution fixes affecting Windows Search, LDAP, Windows Schannel, Windows Virtual Filtering Platform, and Windows Xbox Live Networking Service."],"insights":["Although Microsoft rated the Outlook issue as Moderate severity, it is already being actively exploited and can expose credentials that may be used to impersonate a user.","Exploitation of the Outlook flaw requires both network connectivity and user interaction, specifically persuading a target to open a specially crafted message file.","The November release continues an unusually high patch volume, following another month with more than 1,000 fixes and bringing Microsoft’s 2026 total to more than 5,100 CVEs.","CISA’s addition of the Outlook flaw to its Known Exploited Vulnerabilities catalog makes it an immediate remediation priority for U.S. federal agencies, which must patch by November 24, 2026.","The article recommends prioritizing systems exposed to the internet and flaws already exploited in the wild before addressing vulnerabilities in components an organization does not use."],"referencedReports":[{"title":"Microsoft Security Update Guide — November 2026","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Nov","publisher":"microsoft","context":"The article cites Microsoft's November 2026 Security Update Guide as the source for the 1,259 patched vulnerabilities.","category":"advisory","primary":true},{"title":"CVE-2026-124194 Security Update Guide Advisory","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-124194","publisher":"microsoft","context":"The article cites Microsoft's advisory for the actively exploited Outlook spoofing flaw that may expose NTLMv2 hashes.","category":"advisory","primary":true},{"title":"CISA Adds Six Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/10/cisa-adds-six-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article references CISA's notice adding the Outlook flaw to the Known Exploited Vulnerabilities catalog and setting a federal remediation deadline.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft released patches for 1,259 vulnerabilities across its software portfolio, following another month in which it fixed more than 1,000 flaws. The release includes 726 Windows flaws, 174 Office flaws, 59 SQL Server flaws, 27 SharePoint Server flaws, and 165 CVEs not issued by Microsoft. Tenable researcher Satnam Narang said Microsoft has addressed more than 5,100 CVEs in 2026 so far.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft flagged CVE-2026-124194, a Moderate-severity Microsoft Outlook flaw, as actively exploited. An unauthenticated attacker can send a specially crafted message file and convince a target to open it, causing Outlook to connect to an attacker-controlled network location without its usual external-content warning and potentially expose an NTLMv2 hash. CISA added the flaw to its Known Exploited Vulnerabilities catalog and directed U.S. federal agencies to apply the fix by November 24, 2026.\u003c/p\u003e\n"},{"n":4,"title":"Railway Says Stolen Customer AI Keys Led to $740,000 in Estimated Unauthorized Usage Charges","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/railway-says-stolen-customer-ai-keys.html","time":"07:49","priority":"SHOULD READ","score":87,"tldr":"Railway says attackers exploited its build infrastructure in October, stole and decrypted customer AI API keys from up to roughly 100,000 workspaces, and generated an estimated $740,000 in unauthorized usage charges. The company has rotated affected credentials, hardened its build system, and says it will cover fraud costs where AI providers do not refund customers.","briefOverview":"\u003cp\u003eRailway says an October security incident exposed customer-stored AI provider keys that were used for an estimated $740,000 in unauthorized usage. The company estimates that encrypted variables in at most 1.85% of workspaces, or about 100,000 workspaces, were exposed, although it cannot determine exactly which variables were decrypted. Railway says it will cover breach-related AI costs when providers do not issue refunds, including for Anthropic and OpenRouter keys.\u003c/p\u003e\n\n\u003cp\u003eThe attacker initially exploited a previously unknown flaw to partly escape filesystem isolation in Railway’s build system and obtain a credential used by build servers. That credential was trusted by an internal Temporal system, enabling the attacker to read build histories and obtain cached code snapshots; after examining Railway’s internal monorepo, the attacker found and exploited a misconfigured cloud identity binding. The attacker then acquired credentials that allowed access to encrypted customer variables and the ability to decrypt some of them, while Railway says no customer databases were accessed and no customer code repositories were downloaded. Railway has moved builds into separate short-lived virtual machines, restricted build credentials, reset affected linked-account tokens, and says all weaknesses used in the incident have been closed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Railway says AI provider keys stored by customers were stolen during an October breach and used for an estimated $740,000 in unauthorized usage charges.","The attacker exploited a previously unknown flaw in Railway’s build system, obtained internal credentials, and decrypted customer environment variables containing AI provider keys.","Railway estimates that variables in at most 1.85% of workspaces, or about 100,000 workspaces, may have been exposed, although its logs do not show exactly which variables were decrypted.","Railway reset linked-account tokens for 1,852 users, notified affected users, and said it found no evidence of logins to customer accounts using the stolen credentials.","Railway says it will cover breach-related charges for Anthropic and OpenRouter keys when providers do not issue refunds, while other providers have different claim and refund processes."],"insights":["Railway’s logs can identify exposed environments but not the specific variables accessed, so the estimated 100,000 affected workspaces is an upper limit rather than a confirmed count of stolen AI keys.","The compromise moved from a build-system isolation escape to broader access because a build credential was accepted by an internal system as trusted and later enabled access to cloud credentials and customer-secret decryption capabilities.","Railway sent some providers every key it held for their services as a precaution, meaning more than 100,000 users received reset requests even though a provider revocation notice does not prove that a particular key was exposed.","The financial outcome for affected customers depends heavily on the AI provider: AWS Bedrock and Google Gemini have fraud refund policies, OpenAI and SpaceXSI review claims individually, and Railway says it will cover Anthropic and OpenRouter costs when refunds are unavailable.","Railway replaced its prior build isolation approach with separate short-lived virtual machines and credentials limited to pushing one specific image after its hardening team reproduced a variation of the original escape."],"referencedReports":[{"title":"Black October for AI Developer Platforms","url":"https://www.wiz.io/blog/black-october-for-ai-developer-platforms","publisher":"wiz","context":"Wiz researchers list the Railway breach among at least nine AI developer platform incidents disclosed in October and note that public reports describe attackers seeking stored environment variables, particularly AI access keys.","category":"research","primary":false}],"body":"\u003cp\u003eRailway says an October security incident exposed customer-stored AI provider keys that were used for an estimated $740,000 in unauthorized usage. The company estimates that encrypted variables in at most 1.85% of workspaces, or about 100,000 workspaces, were exposed, although it cannot determine exactly which variables were decrypted. Railway says it will cover breach-related AI costs when providers do not issue refunds, including for Anthropic and OpenRouter keys.\u003c/p\u003e\n\n\u003cp\u003eThe attacker initially exploited a previously unknown flaw to partly escape filesystem isolation in Railway’s build system and obtain a credential used by build servers. That credential was trusted by an internal Temporal system, enabling the attacker to read build histories and obtain cached code snapshots; after examining Railway’s internal monorepo, the attacker found and exploited a misconfigured cloud identity binding. The attacker then acquired credentials that allowed access to encrypted customer variables and the ability to decrypt some of them, while Railway says no customer databases were accessed and no customer code repositories were downloaded. Railway has moved builds into separate short-lived virtual machines, restricted build credentials, reset affected linked-account tokens, and says all weaknesses used in the incident have been closed.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft fixes Exchange sign-ins broken by Windows Server updates","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-fixes-exchange-sign-ins-broken-by-october-windows-server-updates/","time":"09:07","priority":"SHOULD READ","score":82,"tldr":"Microsoft’s November 2026 Windows Server updates fix an issue that caused some on-premises Exchange servers to fail Outlook web sign-ins and mail delivery after October security patches. Organizations that cannot patch immediately can temporarily raise the Endpoint Mapper memory limit through a registry change and reboot.","briefOverview":"\u003cp\u003eMicrosoft said its November 2026 Patch Tuesday updates fix Outlook sign-in and mail delivery problems affecting some on-premises Exchange Server systems after October 2026 Windows Server security updates. The issue affected Exchange servers on Windows Server 2019 and later, with users potentially unable to sign in to Outlook on the web, send messages that leave the Outbox, or access mailboxes during replication. Microsoft said the pace and severity of the problem vary according to Exchange server load, and some servers may not encounter it.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft attributed the issue to a new default limit on the memory Endpoint Mapper can use while handling Endpoint Lookup calls, introduced by the October Windows updates. It advised affected organizations to install KB5131080 and KB5131090 on all affected systems, and said the problem is not related to October 2026 Exchange Server security updates, which customers should not uninstall. For systems that cannot immediately receive the November updates, Microsoft provided a registry command to raise the Endpoint Mapper limit, followed by a reboot and monitoring for any need to raise the limit again.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft said November 2026 Patch Tuesday updates KB5131080 and KB5131090 fix Outlook sign-in and mail delivery issues affecting some on-premises Exchange servers after October Windows Server security updates.","The issue affected Exchange servers running Windows Server 2019 and later, where users could be unable to sign in to Outlook on the web, sent messages could remain in the Outbox, and mailbox replication could have problems.","Microsoft attributed the issue to a new default limit on memory used by Endpoint Mapper for Endpoint Lookup calls, introduced in the October 2026 updates.","Microsoft said the Outlook on the web issue was not connected to October 2026 Exchange Server security updates and advised customers not to uninstall those Exchange updates.","For organizations unable to deploy the November cumulative updates immediately, Microsoft provided a temporary registry-based workaround to raise the Endpoint Mapper limits and advised administrators to restart and monitor affected servers."],"insights":["The impact is load-dependent: Microsoft said some Exchange servers may become affected quickly, while others may never experience the problem after the same Windows updates.","The problem was caused by a changed default resource limit in Windows rather than by the October 2026 Exchange Server security updates, which Microsoft said customers should not remove.","Administrators who cannot install the permanent updates can use Microsoft’s registry workaround to raise the Endpoint Mapper limit to 65,536, then restart the server and monitor whether a further increase is needed."],"referencedReports":[{"title":"Exchange Servers may become unstable after installation of October 2026 Windows Server updates","url":"https://techcommunity.microsoft.com/blog/exchange/exchange-servers-may-become-unstable-after-installation-of-october-2026-windows-/4565382","publisher":"microsoft","context":"The article cites Microsoft’s Exchange team blog for its explanation that the issue’s severity and timing vary based on Exchange server load.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft said its November 2026 Patch Tuesday updates fix Outlook sign-in and mail delivery problems affecting some on-premises Exchange Server systems after October 2026 Windows Server security updates. The issue affected Exchange servers on Windows Server 2019 and later, with users potentially unable to sign in to Outlook on the web, send messages that leave the Outbox, or access mailboxes during replication. Microsoft said the pace and severity of the problem vary according to Exchange server load, and some servers may not encounter it.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft attributed the issue to a new default limit on the memory Endpoint Mapper can use while handling Endpoint Lookup calls, introduced by the October Windows updates. It advised affected organizations to install KB5131080 and KB5131090 on all affected systems, and said the problem is not related to October 2026 Exchange Server security updates, which customers should not uninstall. For systems that cannot immediately receive the November updates, Microsoft provided a registry command to raise the Endpoint Mapper limit, followed by a reboot and monitoring for any need to raise the limit again.\u003c/p\u003e\n"},{"n":5,"title":"Microsoft Researchers Show AI Agents Can Be Backdoored by Editing Fewer Than 10 Neurons","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/microsoft-researchers-show-ai-agents.html","time":"07:21","priority":"SHOULD READ","score":82,"tldr":"Microsoft researchers demonstrated that attackers with access to an AI model’s weights can implant a stealthy agent backdoor by directly modifying fewer than 10 rarely used neurons, causing malicious commands to be emitted when a trigger appears. The finding underscores the need to verify model provenance and weight integrity, sandbox agent actions, and apply least-privilege controls.","briefOverview":"\u003cp\u003eMicrosoft researchers demonstrated Lazarus, a technique for placing a hidden backdoor in an AI model by directly changing fewer than 10 rarely used neurons, without retraining the full model. When a selected trigger appears in a user request or a tool’s output, the altered model can emit an attacker-chosen command for an AI agent to run with its existing permissions. The researchers tested the method on Nemotron-Terminal-8B, Qwen3.6-27B, and Gemma-4-31B-IT, and Microsoft said it has not observed threat actors using the technique.\u003c/p\u003e\n\n\u003cp\u003eOn Nemotron-Terminal-8B, the team edited and tuned seven neurons in the final feed-forward layer using 23 example sessions, with the test command appearing in at least 98.8% of triggered sessions and none of the checked trigger-free sessions. The models could still pass ordinary evaluations, while the potential damage depends on what an affected agent is allowed to access or execute. Microsoft recommends verifying checkpoints against their declared base models, using trusted model sources and private registries, restricting agent permissions and network access, sandboxing generated code, and requiring approval for high-impact actions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft researchers developed Lazarus, a method that can implant a hidden AI-agent backdoor by directly editing fewer than 10 rarely used neurons in a model without retraining the full model.","When a chosen trigger appears in a user request or a tool’s output, the edited neurons cause the model to emit an attacker-selected command that an agent could run with its own permissions.","In tests on Nemotron-Terminal-8B, editing and tuning seven neurons produced the harmless test command in at least 98.8% of triggered sessions and none of the checked trigger-free sessions.","The researchers said anyone able to alter a model checkpoint before deployment, including insiders or attackers with build-pipeline access, could plant this type of backdoor.","Microsoft recommends verifying checkpoints against their declared base models, using trusted model sources, limiting agent permissions, isolating agent-generated code, restricting outbound network access, and requiring approval for high-impact actions."],"insights":["A command can require roughly one edited neuron per output token, meaning a short command can be implanted with only a handful of targeted changes.","The impact of the backdoor depends on the permissions granted to the AI agent rather than on the small size of the model edit.","A detector trained on Lazarus-style edits identified 91.4% of edited checkpoints without an original model for comparison, but falsely flagged 9.7% of clean checkpoints in a small test set.","Even with direct model changes, backdoored Qwen models retained most math-test performance, while their Terminal-Bench pass rate declined from 46.59% to 42.05%.","Comparing a checkpoint with its original base model is presented as the most reliable defense because Lazarus changes a small number of weight vectors substantially, unlike broad changes from ordinary fine-tuning or quantization."],"referencedReports":[{"title":"Lazare Veni Foras: Reprogramming Dormant Neurons to Backdoor AI Agents","url":"https://github.com/anadim/anadim.github.io/blob/master/papers/Lazarus.pdf","publisher":"microsoft-research","context":"The article relies on this research paper for Lazarus methodology, testing results, detection findings, and limitations.","category":"research","primary":true},{"title":"Lazare Veni Foras: Reprogramming Dormant Neurons to Backdoor AI Agents","url":"https://www.microsoft.com/en-us/research/blog/lazare-veni-foras-reprogramming-dormant-neurons-to-backdoor-ai-agents/","publisher":"microsoft-research","context":"The article cites Microsoft’s research summary for its discussion of checkpoint comparison and weight-level backdoor detection.","category":"research","primary":true},{"title":"Detecting Sleeper Agents Hiding in AI Model Neurons","url":"https://www.microsoft.com/en-us/security/blog/2026/11/10/detecting-sleeper-agents-hiding-in-ai-model-neurons/","publisher":"microsoft","context":"The article cites this Microsoft mitigation guidance for recommendations on model verification, sandboxing, access restrictions, and behavioral scanning.","category":"advisory","primary":false},{"title":"How Abliterated Models Can Get You Pwned","url":"https://projectdiscovery.io/research/how-abliterated-models-can-get-you-pwned","publisher":"projectdiscovery","context":"The article references this earlier proof of concept, which used poisoned fine-tuning to make an open Qwen model respond to a trigger phrase.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft researchers demonstrated Lazarus, a technique for placing a hidden backdoor in an AI model by directly changing fewer than 10 rarely used neurons, without retraining the full model. When a selected trigger appears in a user request or a tool’s output, the altered model can emit an attacker-chosen command for an AI agent to run with its existing permissions. The researchers tested the method on Nemotron-Terminal-8B, Qwen3.6-27B, and Gemma-4-31B-IT, and Microsoft said it has not observed threat actors using the technique.\u003c/p\u003e\n\n\u003cp\u003eOn Nemotron-Terminal-8B, the team edited and tuned seven neurons in the final feed-forward layer using 23 example sessions, with the test command appearing in at least 98.8% of triggered sessions and none of the checked trigger-free sessions. The models could still pass ordinary evaluations, while the potential damage depends on what an affected agent is allowed to access or execute. Microsoft recommends verifying checkpoints against their declared base models, using trusted model sources and private registries, restricting agent permissions and network access, sandboxing generated code, and requiring approval for high-impact actions.\u003c/p\u003e\n"},{"n":6,"title":"Citrus Ransomware: VLESS for traffic, Sn00py for encryption, and LLMs lending a hand","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/citrus-ransomware/121879/","time":"10:00","priority":"SHOULD READ","score":82,"tldr":"Citrus Ransomware targets Russian organizations by abusing compromised contractor accounts, escalating privileges, and spreading Sn00py ransomware through malicious Group Policy Objects. The group combines familiar tools with VLESS/Xray tunnels and apparent LLM-generated scripts, making tight control of third-party access and early detection critical.","briefOverview":"\u003cp\u003eCitrus Ransomware is a previously undocumented group that targeted Russian companies by using stolen contractor credentials to access corporate VPNs or internet-facing Remote Desktop servers. The group then tried to gain higher privileges, move between systems, collect credentials and messaging-app data, and disable security protections. Its activity combines widely available tools with VLESS tunnels intended to make its communications resemble ordinary HTTPS traffic and apparent LLM-generated commands and scripts.\u003c/p\u003e\n\n\u003cp\u003eCitrus attempted to exploit CVE-2026-54121 (Certighost) to obtain certificates that could let it authenticate as a domain controller, and it also targeted insecurely configured 1C:Enterprise servers. It used Xray reverse VLESS tunnels over port 443, AnyDesk for remote control, and tools including mimikatz, Snaffler, ADRecon, SharpHound, and fscan. Before encryption, it archived data associated with Telegram Desktop sessions and uploaded it to an external web service.\u003c/p\u003e\n\n\u003cp\u003eFor impact, the group deployed Go-based Sn00py ransomware through malicious Group Policy Objects, encrypting user files with the .citrus extension and leaving CITRUS_README.txt ransom notes. The malicious policy disabled Windows Defender and the Volume Shadow Copy service, enabled WinRM, created a scheduled task to launch the ransomware, and excluded selected domain controllers from encryption so distribution could continue. The incidents highlight the importance of tightly controlling and restricting contractor access, which Citrus used for initial entry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrus Ransomware gained initial access through contractor employee credentials stolen to connect to corporate VPNs or internet-facing RDP terminal servers.","The group attempted to escalate privileges by exploiting CVE-2026-54121 (Certighost), which could allow it to authenticate as a domain controller after obtaining a forged certificate.","Citrus used Xray reverse VLESS tunnels over port 443 with REALITY settings designed to disguise its traffic as requests to legitimate Yandex sites.","Before encryption, the attackers collected Telegram Desktop session-related data, archived it with 7-Zip, and uploaded it to an external web service through Google Chrome.","Citrus deployed Go-based Sn00py ransomware through malicious Group Policy Objects, encrypting user files with a .citrus extension and disabling Windows Defender and Volume Shadow Copy as part of the deployment."],"insights":["Comments embedded in otherwise routine commands and PowerShell scripts were unusual for the attackers and were assessed as likely evidence of LLM-generated or LLM-edited content.","The ransomware configuration excluded specific domain controllers from encryption, allowing the malicious Group Policy used to distribute the ransomware to continue propagating across the network.","Citrus did not only disable security software on individual hosts; after gaining sufficient privileges, it also targeted centralized security-management consoles to disable protection at scale.","Xray configuration files were sometimes deleted immediately after the tunnel started, reducing the evidence available to defenders while retaining remote access.","Citrus and Toy Ghouls were observed compromising the same infrastructure in several incidents, while sharing Russian-language targeting, tools, directories, and several operating methods."],"referencedReports":[{"title":"Detecting CVE-2026-54121 Certighost with Microsoft Defender","url":"https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861","publisher":"microsoft","context":"The article links to Microsoft’s analysis of the Certighost authentication-bypass vulnerability that Citrus attempted to exploit for privilege escalation.","category":"advisory","primary":false},{"title":"How 1C compromise could have been avoided","url":"https://securelist.ru/how-1c-compromise-could-have-been-avoided/114764/","publisher":"kaspersky","context":"The article references this Russian-language analysis when discussing insecure 1C:Enterprise server configurations targeted by Citrus.","category":"research","primary":false}],"body":"\u003cp\u003eCitrus Ransomware is a previously undocumented group that targeted Russian companies by using stolen contractor credentials to access corporate VPNs or internet-facing Remote Desktop servers. The group then tried to gain higher privileges, move between systems, collect credentials and messaging-app data, and disable security protections. Its activity combines widely available tools with VLESS tunnels intended to make its communications resemble ordinary HTTPS traffic and apparent LLM-generated commands and scripts.\u003c/p\u003e\n\n\u003cp\u003eCitrus attempted to exploit CVE-2026-54121 (Certighost) to obtain certificates that could let it authenticate as a domain controller, and it also targeted insecurely configured 1C:Enterprise servers. It used Xray reverse VLESS tunnels over port 443, AnyDesk for remote control, and tools including mimikatz, Snaffler, ADRecon, SharpHound, and fscan. Before encryption, it archived data associated with Telegram Desktop sessions and uploaded it to an external web service.\u003c/p\u003e\n\n\u003cp\u003eFor impact, the group deployed Go-based Sn00py ransomware through malicious Group Policy Objects, encrypting user files with the .citrus extension and leaving CITRUS_README.txt ransom notes. The malicious policy disabled Windows Defender and the Volume Shadow Copy service, enabled WinRM, created a scheduled task to launch the ransomware, and excluded selected domain controllers from encryption so distribution could continue. The incidents highlight the importance of tightly controlling and restricting contractor access, which Citrus used for initial entry.\u003c/p\u003e\n"},{"n":7,"title":"Health-ISAC Daily Cyber Headlines – November 11, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-11-2026/","time":"09:19","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 11, 2026 daily briefing highlights security updates and active threats affecting healthcare and critical services, including Ivanti and Barracuda flaws, an Amplifon patient-data breach, China-linked espionage, and AI-enabled fraud.","briefOverview":"\u003cp\u003eHealth-ISAC’s November 11, 2026 daily cyber headlines briefing covers multiple security developments. Topics include Ivanti security updates, an Amplifon patient-data breach, China-linked espionage, and AI-assisted financial fraud. The briefing also highlights Barracuda flaws that are being actively exploited.\u003c/p\u003e\n\n\u003cp\u003eAdditional topics include a vulnerability involving Git cloning and Malaysia’s warning about threats to critical services. The collection spans patient data, financial fraud, espionage, software development activity, and essential services. The article also links to related Health-ISAC resources and recent daily cyber-headlines briefings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 11, 2026 daily briefing covers Ivanti security updates and actively exploited Barracuda flaws.","The briefing includes an Amplifon patient-data breach.","The briefing examines China-linked espionage and AI-assisted financial fraud.","The briefing also addresses a Git cloning vulnerability and Malaysia’s warning about threats to critical services."],"insights":["The briefing explicitly identifies Barracuda flaws as actively exploited, distinguishing them from the other issues listed and signaling an immediate real-world threat.","The topics span patient data, financial fraud, software code cloning, and critical services, showing that the briefing covers risks beyond healthcare organizations alone.","The inclusion of both Ivanti security updates and actively exploited Barracuda flaws highlights the importance of tracking vendor-specific security issues alongside broader threat activity."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s November 11, 2026 daily cyber headlines briefing covers multiple security developments. Topics include Ivanti security updates, an Amplifon patient-data breach, China-linked espionage, and AI-assisted financial fraud. The briefing also highlights Barracuda flaws that are being actively exploited.\u003c/p\u003e\n\n\u003cp\u003eAdditional topics include a vulnerability involving Git cloning and Malaysia’s warning about threats to critical services. The collection spans patient data, financial fraud, espionage, software development activity, and essential services. The article also links to related Health-ISAC resources and recent daily cyber-headlines briefings.\u003c/p\u003e\n"}]</script>
