<script type="application/json" id="dl-articles">[{"n":25,"title":"Lazarus Exploits Windows Zero-Day to Gain SYSTEM Access and Deploy Backdoor","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/lazarus-exploits-windows-zero-day-to.html","time":"17:39","priority":"MUST READ","score":96,"tldr":"Lazarus Group exploited a newly patched Windows zero-day to gain SYSTEM privileges and deploy backdoors against defense and aerospace targets in multiple countries. The campaign used fake job offers, trojanized PDF tools, and compromised legitimate infrastructure to make the attacks appear trustworthy and evade detection.","briefOverview":"\u003cp\u003eThe Lazarus Group has been attributed by Check Point Research to the zero-day exploitation of CVE-2026-68820, a Windows Ancillary Function Driver for WinSock privilege escalation flaw patched by Microsoft in August 2026. The campaign targeted defense and aerospace companies in France, Germany, Brazil, and India. The activity is part of Operation Dream Job, a long-running campaign that uses fake recruiter messages and job offers to trick professionals into opening malicious files or installing malware.\u003c/p\u003e\n\n\u003cp\u003eThe attacks used two parallel infection sequences. One used DLL side-loading with a malicious libmupdf.dll to display a bogus job description while stealthily downloading and executing MISTPEN, which communicated through Microsoft Graph API and OneDrive before triggering the AFD.sys exploit and deploying ForestTiger. The other used a trojanized SecurityPDF viewer impersonating Enveil software, which launched the Troy backdoor when a specially marked PDF was opened.\u003c/p\u003e\n\n\u003cp\u003eAfter exploiting the Windows flaw, the attackers obtained SYSTEM privileges and injected another instance of MISTPEN into a SYSTEM process. The campaign also used an updated FudModule 3.1 rootkit that could tamper with Windows Smart App Control, along with compromised WordPress, SharePoint, and vulnerable Roundcube servers as command-and-control infrastructure. Check Point said the campaign was dangerous because Lazarus combined the zero-day with trusted-looking websites, real vendor branding, search-visible fake portals, and compromised legitimate infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research attributed a Lazarus Group campaign to the zero-day exploitation of CVE-2026-68820, a Windows Ancillary Function Driver for WinSock privilege escalation flaw patched by Microsoft in August 2026.","The campaign is part of Operation Dream Job and targets defense and aerospace companies in France, Germany, Brazil, and India using fake recruiter messages and job offers.","One infection chain uses DLL side-loading with a malicious libmupdf.dll to run MISTPEN, which retrieves modules through Microsoft Graph API and OneDrive before deploying ForestTiger.","A second infection chain uses a trojanized SecurityPDF viewer that decrypts and launches an embedded payload when a specially marked PDF is opened, loading the Troy backdoor into memory.","The attackers used compromised WordPress, SharePoint, and vulnerable Roundcube servers as ForestTiger command-and-control infrastructure, and some Roundcube servers were infected with the RelayShell PHP web shell."],"insights":["The campaign shows that checking whether a site or download appears legitimate is not enough, because Lazarus used real vendor branding, search-visible fake sites, and compromised legitimate infrastructure to make the infection chain look trustworthy.","The attackers reduced the effectiveness of reputation-based defenses by using already compromised WordPress, SharePoint, and Roundcube servers instead of relying only on newly created attacker infrastructure.","The trojanized SecurityPDF viewer only activated its embedded payload when opening a PDF with a specific marker, which could help the malware avoid revealing malicious behavior during ordinary use or basic inspection.","The updated FudModule 3.1 rootkit specifically tampered with Windows Smart App Control after gaining SYSTEM privileges, showing that the campaign targeted built-in Windows trust and application-safety mechanisms as part of evasion.","At least one breached France-based organization was used to send phishing messages to new victims, highlighting that trusted senders can become part of the attack chain once compromised."],"referencedReports":[{"title":"State-sponsored hackers use fake job offers to deliver new zero-day exploit","url":"https://blog.checkpoint.com/research/state-sponsored-hackers-use-fake-job-offers-to-deliver-new-zero-day-exploit/","publisher":"check-point-research","context":"The article cites Check Point Research as the source attributing the Lazarus campaign and links to its research on the attacks.","category":"research","primary":true},{"title":"Shattering the Dream: When a Job Offer Becomes a Zero-Day Attack","url":"https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/","publisher":"check-point-research","context":"The article quotes Check Point's technical analysis describing how the attackers tampered with Windows Smart App Control after gaining SYSTEM-level access.","category":"research","primary":true},{"title":"CVE-2026-68820","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-68820","publisher":"microsoft-security-response-center","context":"The article links to Microsoft’s vulnerability entry for the Windows Ancillary Function Driver for WinSock privilege escalation flaw patched in August 2026.","category":"advisory","primary":false},{"title":"CVE-2025-49113 Detail","url":"https://nvd.nist.gov/vuln/detail/cve-2025-49113","publisher":"national-vulnerability-database","context":"The article links to the NVD entry for CVE-2025-49113 while discussing vulnerable Roundcube servers abused by the attackers.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe Lazarus Group has been attributed by Check Point Research to the zero-day exploitation of CVE-2026-68820, a Windows Ancillary Function Driver for WinSock privilege escalation flaw patched by Microsoft in August 2026. The campaign targeted defense and aerospace companies in France, Germany, Brazil, and India. The activity is part of Operation Dream Job, a long-running campaign that uses fake recruiter messages and job offers to trick professionals into opening malicious files or installing malware.\u003c/p\u003e\n\n\u003cp\u003eThe attacks used two parallel infection sequences. One used DLL side-loading with a malicious libmupdf.dll to display a bogus job description while stealthily downloading and executing MISTPEN, which communicated through Microsoft Graph API and OneDrive before triggering the AFD.sys exploit and deploying ForestTiger. The other used a trojanized SecurityPDF viewer impersonating Enveil software, which launched the Troy backdoor when a specially marked PDF was opened.\u003c/p\u003e\n\n\u003cp\u003eAfter exploiting the Windows flaw, the attackers obtained SYSTEM privileges and injected another instance of MISTPEN into a SYSTEM process. The campaign also used an updated FudModule 3.1 rootkit that could tamper with Windows Smart App Control, along with compromised WordPress, SharePoint, and vulnerable Roundcube servers as command-and-control infrastructure. Check Point said the campaign was dangerous because Lazarus combined the zero-day with trusted-looking websites, real vendor branding, search-visible fake portals, and compromised legitimate infrastructure.\u003c/p\u003e\n"},{"n":8,"title":"Lazarus hackers exploited Windows zero-day to target defense firms","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/lazarus-hackers-exploited-windows-zero-day-to-target-defense-firms/","time":"15:38","priority":"MUST READ","score":95,"tldr":"North Korean Lazarus hackers exploited a Windows zero-day to gain SYSTEM privileges and target defense, aerospace, and aviation organizations through the Operation Dream Job campaign. The attacks also used updated FudModule rootkit capabilities, a new Troy backdoor, and compromised Roundcube servers to hide malicious activity.","briefOverview":"\u003cp\u003eNorth Korean Lazarus hackers exploited a Windows zero-day vulnerability, CVE-2026-68820, to target defense-sector companies as part of the Operation Dream Job campaign. Microsoft patched the flaw in its August 2026 Patch Tuesday updates and marked it as actively exploited in the wild. Researchers found Lazarus had been using the vulnerability since early July.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft described CVE-2026-68820 as a use-after-free in the Windows Ancillary Function Driver for WinSock, AFD.sys, that can allow a locally authenticated attacker to gain SYSTEM privileges. Check Point found Lazarus incorporated an exploit for the flaw into a new version of the FudModule kernel-mode rootkit, specifically supporting Windows 11 builds 26100 and 26200. The updated rootkit includes previously documented capabilities such as disabling EDR telemetry and interfering with security products, and it adds Smart App Control tampering.\u003c/p\u003e\n\n\u003cp\u003eThe latest Operation Dream Job activity targeted defense, aerospace, and aviation organizations in Europe and India using fraudulent recruitment offers, with successful targeting observed in France and Germany and activity extending into South America, including Brazil. Check Point said Lazarus also deployed a new backdoor called Troy and compromised vulnerable Roundcube installations with a PHP web shell called RelayShell. The researchers said the campaign focused heavily on organizations involved in military technologies such as surveillance sensors, drones, and robotics.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["North Korean Lazarus hackers exploited Windows zero-day vulnerability CVE-2026-68820 to target defense-sector companies as part of the Operation Dream Job campaign.","Microsoft patched CVE-2026-68820 in its August 2026 Patch Tuesday updates and said the flaw is a use-after-free in Windows Ancillary Function Driver for WinSock that can allow local privilege escalation to SYSTEM.","Check Point found that Lazarus used an exploit for CVE-2026-68820 in a new version of the FudModule kernel-mode rootkit that specifically supported Windows 11 builds 26100 and 26200.","The latest Operation Dream Job activity targeted defense, aerospace, and aviation organizations in Europe and India using fraudulent recruitment offers, and Check Point said successful targeting was observed in France and Germany.","Check Point reported that Lazarus deployed a new Troy backdoor and compromised vulnerable Roundcube installations with a PHP web shell called RelayShell after likely using leaked credentials and exploiting CVE-2025-49113."],"insights":["Lazarus has now exploited more than one zero-day flaw in AFD.sys to elevate privileges and install the FudModule rootkit, showing repeated operational focus on the same Windows driver area.","The CVE-2026-68820 exploit used in the latest FudModule version was tailored to Windows 11 builds 26100 and 26200, making those builds especially relevant for defenders reviewing exposure and patch status.","The updated FudModule rootkit added Smart App Control tampering on top of previously documented abilities to disable EDR telemetry and interfere with security products.","Lazarus used compromised Roundcube infrastructure to hide malicious communications, meaning organizations investigating this campaign should not treat legitimate-looking webmail servers as automatically benign.","Check Point identified at least 17 RelayShell-infected servers from retrieved identifiers, indicating the Roundcube compromise activity extended beyond a single isolated server."],"referencedReports":[{"title":"CVE-2026-68820 | Windows Ancillary Function Driver for WinSock Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-68820","publisher":"microsoft","context":"The article references Microsoft’s vulnerability entry for CVE-2026-68820 as the source marking the Windows flaw as actively exploited in the wild.","category":"advisory","primary":true},{"title":"Shattering the Dream: When a Job Offer Becomes a Zero-Day Attack","url":"http://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/","publisher":"check-point","context":"The article cites Check Point’s research as the basis for details on Lazarus’ latest Operation Dream Job activity, the FudModule rootkit, the Troy backdoor, and RelayShell web shell.","category":"research","primary":true}],"body":"\u003cp\u003eNorth Korean Lazarus hackers exploited a Windows zero-day vulnerability, CVE-2026-68820, to target defense-sector companies as part of the Operation Dream Job campaign. Microsoft patched the flaw in its August 2026 Patch Tuesday updates and marked it as actively exploited in the wild. Researchers found Lazarus had been using the vulnerability since early July.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft described CVE-2026-68820 as a use-after-free in the Windows Ancillary Function Driver for WinSock, AFD.sys, that can allow a locally authenticated attacker to gain SYSTEM privileges. Check Point found Lazarus incorporated an exploit for the flaw into a new version of the FudModule kernel-mode rootkit, specifically supporting Windows 11 builds 26100 and 26200. The updated rootkit includes previously documented capabilities such as disabling EDR telemetry and interfering with security products, and it adds Smart App Control tampering.\u003c/p\u003e\n\n\u003cp\u003eThe latest Operation Dream Job activity targeted defense, aerospace, and aviation organizations in Europe and India using fraudulent recruitment offers, with successful targeting observed in France and Germany and activity extending into South America, including Brazil. Check Point said Lazarus also deployed a new backdoor called Troy and compromised vulnerable Roundcube installations with a PHP web shell called RelayShell. The researchers said the campaign focused heavily on organizations involved in military technologies such as surveillance sensors, drones, and robotics.\u003c/p\u003e\n"},{"n":9,"title":"Hackers leverage new Microsoft SharePoint exploit in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/hackers-leverage-new-microsoft-sharepoint-exploit-in-attacks/","time":"12:25","priority":"MUST READ","score":95,"tldr":"A public Rapid7 proof-of-concept for critical Microsoft SharePoint auth bypass CVE-2026-55040 is already being used against exposed servers. Organizations should urgently apply Microsoft’s July 2026 patches and avoid directly exposing SharePoint to the internet.","briefOverview":"\u003cp\u003eA proof-of-concept exploit for CVE-2026-55040, a critical Microsoft SharePoint vulnerability, was published by Rapid7 on Tuesday and is already being used in attacks. The flaw is an authentication bypass in the JWT token validation pipeline that can be exploited by attackers without privileges. Microsoft patched it in the July 2026 Patch Tuesday updates for SharePoint Enterprise Server 2016 and SharePoint Server 2019.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the vulnerability allows impersonation and could let an attacker disclose files and modify data, but not affect system availability. Rapid7 researcher Stephen Fewer published a detailed technical write-up and proof-of-concept exploit, and Defused later reported that attackers were using the Rapid7 code against its SharePoint honeypots. Shadowserver currently tracks more than 8,500 Microsoft SharePoint servers exposed online, though it is unknown how many are honeypots or already patched.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has labeled the flaw as an attractive target for attackers, but has not yet flagged it as successfully exploited in the wild. CISA warned defenders on July 15 to secure SharePoint servers against potential CVE-2026-55040 attacks and urged organizations to avoid direct internet exposure unless necessary. CISA also recommended blocking external access to SharePoint Central Administration, restricting farm and database communication, and placing internet-exposed servers behind a Layer 7 reverse proxy or similar application-layer security control.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A proof-of-concept exploit for CVE-2026-55040, a critical Microsoft SharePoint authentication bypass vulnerability, was published by Rapid7 on Tuesday and is already being used in attacks.","CVE-2026-55040 affects SharePoint Enterprise Server 2016 and SharePoint Server 2019 and can allow an unauthenticated attacker to impersonate a SharePoint site user or administrator.","Microsoft patched CVE-2026-55040 in its July 2026 Patch Tuesday updates and said exploitation could allow attackers to disclose files and modify data.","Threat intelligence company Defused reported that attackers are using Rapid7’s proof-of-concept code against its SharePoint honeypots.","CISA urged security teams to avoid directly exposing SharePoint servers to the internet unless necessary and to restrict access to SharePoint Central Administration."],"insights":["The exploit was weaponized within about a day of Rapid7 publishing its technical write-up and proof-of-concept code, showing a very short window between public disclosure and observed attack activity.","Microsoft has described CVE-2026-55040 as an attractive target for attackers, but it has not yet marked the flaw as successfully exploited in the wild despite Defused reporting attacks against honeypots.","CISA’s recommended mitigations go beyond patching and emphasize reducing internet exposure, blocking external access to SharePoint Central Administration, and placing exposed servers behind application-layer protections.","SharePoint remains a recurring high-impact target, with CISA having listed 14 actively exploited Microsoft SharePoint vulnerabilities since November 2021, eight of which were also used in ransomware attacks."],"referencedReports":[{"title":"Microsoft SharePoint Server Authentication Bypass Vulnerability CVE-2026-55040","url":"http://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-55040","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for its description of the SharePoint authentication bypass vulnerability and its potential impact.","category":"advisory","primary":true},{"title":"Microsoft SharePoint JWT Token Authentication Bypass CVE-2026-55040","url":"https://www.rapid7.com/blog/post/ra-microsoft-sharepoint-jwt-token-authentication-bypass-cve-2026-55040/","publisher":"Rapid7","context":"The article says Rapid7 published a detailed technical write-up on CVE-2026-55040 along with proof-of-concept exploit code.","category":"research","primary":true}],"body":"\u003cp\u003eA proof-of-concept exploit for CVE-2026-55040, a critical Microsoft SharePoint vulnerability, was published by Rapid7 on Tuesday and is already being used in attacks. The flaw is an authentication bypass in the JWT token validation pipeline that can be exploited by attackers without privileges. Microsoft patched it in the July 2026 Patch Tuesday updates for SharePoint Enterprise Server 2016 and SharePoint Server 2019.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the vulnerability allows impersonation and could let an attacker disclose files and modify data, but not affect system availability. Rapid7 researcher Stephen Fewer published a detailed technical write-up and proof-of-concept exploit, and Defused later reported that attackers were using the Rapid7 code against its SharePoint honeypots. Shadowserver currently tracks more than 8,500 Microsoft SharePoint servers exposed online, though it is unknown how many are honeypots or already patched.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has labeled the flaw as an attractive target for attackers, but has not yet flagged it as successfully exploited in the wild. CISA warned defenders on July 15 to secure SharePoint servers against potential CVE-2026-55040 attacks and urged organizations to avoid direct internet exposure unless necessary. CISA also recommended blocking external access to SharePoint Central Administration, restricting farm and database communication, and placing internet-exposed servers behind a Layer 7 reverse proxy or similar application-layer security control.\u003c/p\u003e\n"},{"n":16,"title":"Microsoft’s massive Patch Tuesday releases continue as AI reshapes bug discovery","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/microsoft-massive-patch-tuesday-releases-continue-ai","time":"12:38","priority":"MUST READ","score":95,"tldr":"Microsoft patched 419 vulnerabilities in its August Patch Tuesday release, continuing a record surge in bug volumes linked to AI-assisted discovery. Three flaws are zero-days, including one exploited by Lazarus Group, raising pressure on defenders to triage and patch quickly despite Microsoft’s less detailed advisory format.","briefOverview":"\u003cp\u003eMicrosoft released fixes for 419 security vulnerabilities in its August Patch Tuesday update, one of the largest monthly totals on record. The release includes 62 critical and 357 important-rated issues, according to Microsoft’s August release notes. The article presents the volume as part of a continuing surge in vulnerabilities linked to AI-assisted bug discovery.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has seen successive high-volume Patch Tuesday releases, including 137 vulnerabilities in May, 206 in June, 622 in July, and 419 in August. The article says this month’s patch volume is about five times what Microsoft typically shipped before AI-assisted vulnerability discovery took hold. Britain’s National Cyber Security Centre previously warned that organizations needed to prepare for a new tempo in mitigating vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThree of the August flaws are zero-days, including CVE-2026-68820, a Windows network-connection component issue that has been exploited in the wild. Microsoft tied those attacks to Lazarus Group, which targeted applicants for defense, aerospace, and aviation jobs using PDFs and a trojanised reader to secretly control machines. The article also notes that Microsoft’s newer clustered Security Updates format may make triage more complex because defenders and third-party trackers must piece together details from underlying advisory feeds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released fixes for 419 security vulnerabilities, including 62 critical and 357 important-rated issues, in its August Patch Tuesday update.","The article says Microsoft’s recent patch volumes have surged since May, with 137 vulnerabilities in May, 206 in June, 622 in July, and 419 in August, as AI-assisted vulnerability discovery reshapes bug finding.","Three of the August flaws are zero-days, including CVE-2026-68820, a Windows network-connection component issue that has been exploited in the wild.","Microsoft attributed exploitation of CVE-2026-68820 to Lazarus Group, which targeted applicants for jobs in the defense, aerospace, and aviation industries using PDFs and a trojanised reader.","Microsoft’s newer Security Updates format no longer lists individual CVEs in the main release notes, which the article says may make triage more complex for defenders and third-party trackers."],"insights":["Microsoft’s August patch volume is about five times higher than a typical pre-AI-assisted-discovery month, indicating that organizations may need to adjust patch planning around a much larger regular workload rather than treating this as a one-off spike.","Microsoft’s move from itemized CVE listings to a clustered summary format may shift more triage burden onto defenders and third-party trackers, who now have to reconstruct patch priority from underlying advisory feeds.","The exploited Windows flaw shows that patch urgency is not only about servers or enterprise systems, because the Lazarus campaign targeted individual job applicants through PDFs and a trojanised reader.","The article highlights a mismatch between the rising number of discovered flaws and the lack of observed widespread exploitation so far, while noting that intelligence agencies expect AI to transform offensive and defensive cyber capabilities on a timeline of months."],"referencedReports":[{"title":"August 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Aug","publisher":"microsoft","context":"The article cites Microsoft’s August release notes as the source for the counts of critical and important-rated vulnerabilities in the latest Patch Tuesday update.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft released fixes for 419 security vulnerabilities in its August Patch Tuesday update, one of the largest monthly totals on record. The release includes 62 critical and 357 important-rated issues, according to Microsoft’s August release notes. The article presents the volume as part of a continuing surge in vulnerabilities linked to AI-assisted bug discovery.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has seen successive high-volume Patch Tuesday releases, including 137 vulnerabilities in May, 206 in June, 622 in July, and 419 in August. The article says this month’s patch volume is about five times what Microsoft typically shipped before AI-assisted vulnerability discovery took hold. Britain’s National Cyber Security Centre previously warned that organizations needed to prepare for a new tempo in mitigating vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThree of the August flaws are zero-days, including CVE-2026-68820, a Windows network-connection component issue that has been exploited in the wild. Microsoft tied those attacks to Lazarus Group, which targeted applicants for defense, aerospace, and aviation jobs using PDFs and a trojanised reader to secretly control machines. The article also notes that Microsoft’s newer clustered Security Updates format may make triage more complex because defenders and third-party trackers must piece together details from underlying advisory feeds.\u003c/p\u003e\n"},{"n":23,"title":"Attackers Exploit VMware vCenter Vulnerability to Gain Persistent Remote Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/attackers-exploit-vmware-vcenter.html","time":"09:01","priority":"MUST READ","score":95,"tldr":"Attackers are actively exploiting the critical VMware vCenter flaw CVE-2026-59310 to compromise servers and install reverse_ssh for persistent remote access. QUIRSO found 361 victim IPs across 47 countries, making urgent patching and investigation of suspicious outbound connections essential.","briefOverview":"\u003cp\u003eThreat actors have begun actively exploiting CVE-2026-59310, a recently patched critical security flaw in Broadcom VMware vCenter. The vulnerability is a directory-traversal issue in VMware vCenter Server with a CVSS score of 9.8, and a malicious actor with network access can exploit it to execute arbitrary code. Broadcom released patches for the flaw late last month.\u003c/p\u003e\n\n\u003cp\u003eQUIRSO discovered the activity during an incident response engagement and said the attack chain showed path traversal activity consistent with CVE-2026-59310. The attackers then deployed a malicious cron job to establish persistence on the host using reverse_ssh, an open-source tool for setting up SSH connections to attacker-controlled infrastructure. QUIRSO said compromised systems first contacted the attacker’s domains on August 3, five days after Broadcom publicly disclosed the flaws.\u003c/p\u003e\n\n\u003cp\u003eQUIRSO identified 361 unique victim IP addresses across 47 countries, with most located in Germany, the U.S., Turkey, Iran, and France. The actor behind the campaign is not known, but the article says it is believed to be the work of a suspected advanced persistent threat actor. Separately, Defused Cyber reported increased scanning against VMware vCenter that may indicate exploitation efforts targeting CVE-2026-59309, though QUIRSO said there is not enough evidence to link that activity to the intrusion set or infrastructure associated with CVE-2026-59310.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors have begun actively exploiting CVE-2026-59310, a critical directory-traversal vulnerability in Broadcom VMware vCenter with a CVSS score of 9.8.","QUIRSO said the attack chain showed path traversal activity followed by deployment of a malicious cron job using reverse_ssh to establish persistence on the host.","QUIRSO identified 361 unique victim IP addresses across 47 countries, with most located in Germany, the U.S., Turkey, Iran, and France.","Compromised systems first contacted the attacker’s domains on August 3, five days after Broadcom publicly disclosed the flaws.","Defused Cyber reported increased scanning against VMware vCenter that may indicate exploitation efforts targeting CVE-2026-59309, but QUIRSO said there is not enough evidence to link that activity to the CVE-2026-59310 intrusions."],"insights":["The timing of the first attacker-domain contacts, five days after Broadcom disclosed the flaws, makes the public disclosure window a key period for defenders reviewing vCenter logs and outbound network activity.","The use of reverse_ssh is especially important for detection because it creates outbound connections to attacker-controlled infrastructure, which can bypass controls focused on blocking suspicious inbound access.","QUIRSO cautioned that reverse_ssh alone is not proof of compromise, but its unauthorized installation on a vulnerable vCenter appliance with unexpected outbound connections should be treated as a high-priority indicator.","The article distinguishes confirmed compromise activity tied to CVE-2026-59310 from separate vCenter scanning activity around CVE-2026-59309, warning against assuming the two are connected without evidence."],"referencedReports":[{"title":"Active Exploitation of CVE-2026-59310 - 361 Victim IPs Across 47 Countries","url":"https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff","publisher":"QUIRSO","context":"The article says its reporting is based on new findings from QUIRSO about active exploitation of CVE-2026-59310 in VMware vCenter.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors have begun actively exploiting CVE-2026-59310, a recently patched critical security flaw in Broadcom VMware vCenter. The vulnerability is a directory-traversal issue in VMware vCenter Server with a CVSS score of 9.8, and a malicious actor with network access can exploit it to execute arbitrary code. Broadcom released patches for the flaw late last month.\u003c/p\u003e\n\n\u003cp\u003eQUIRSO discovered the activity during an incident response engagement and said the attack chain showed path traversal activity consistent with CVE-2026-59310. The attackers then deployed a malicious cron job to establish persistence on the host using reverse_ssh, an open-source tool for setting up SSH connections to attacker-controlled infrastructure. QUIRSO said compromised systems first contacted the attacker’s domains on August 3, five days after Broadcom publicly disclosed the flaws.\u003c/p\u003e\n\n\u003cp\u003eQUIRSO identified 361 unique victim IP addresses across 47 countries, with most located in Germany, the U.S., Turkey, Iran, and France. The actor behind the campaign is not known, but the article says it is believed to be the work of a suspected advanced persistent threat actor. Separately, Defused Cyber reported increased scanning against VMware vCenter that may indicate exploitation efforts targeting CVE-2026-59309, though QUIRSO said there is not enough evidence to link that activity to the intrusion set or infrastructure associated with CVE-2026-59310.\u003c/p\u003e\n"},{"n":35,"title":"Emerging Threat: (CVE-2026-20349) Cisco ASA and FTD Denial of Service via Remote Access SSL VPN","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-20349-cisco-asa-and-ftd-denial-of-service-via-remote-access-ssl-vpn/","time":"08:32","priority":"MUST READ","score":95,"tldr":"Cisco ASA and FTD devices with Remote Access SSL VPN–related services enabled are vulnerable to actively exploited CVE-2026-20349, an unauthenticated denial-of-service flaw that can force device reloads. Cisco has released hot fixes and says there are no workarounds, so exposed firewalls and VPN gateways should be identified and patched urgently.","briefOverview":"\u003cp\u003eCVE-2026-20349 is a high-severity denial of service vulnerability in the Remote Access SSL VPN service of Cisco Secure Firewall ASA Software and Cisco Secure Firewall FTD Software. The flaw is caused by insufficient error checking when the service processes HTTP requests and has a CVSS v3.1 base score of 8.6. Exploitation requires no authentication and no user interaction, and an attacker with network access to the service can send a crafted HTTP request that causes the device to reload unexpectedly.\u003c/p\u003e\n\n\u003cp\u003eCisco published its advisory on August 11, 2026, and said its Product Security Incident Response Team became aware of active exploitation in August 2026. CISA added CVE-2026-20349 to the Known Exploited Vulnerabilities catalog on the same day. Affected assets are Cisco ASA or FTD devices running vulnerable releases with SSL listen sockets enabled through SSL VPN, IKEv2 remote access VPN with client services, or Zero Trust Network Access on Cisco Secure FTD Software. Cisco has released hot fixes for affected ASA and FTD releases, and the article states there are no workarounds, making upgrade to a fixed release the only remediation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-20349 is a high-severity denial of service vulnerability in the Remote Access SSL VPN service of Cisco Secure Firewall ASA Software and Cisco Secure Firewall FTD Software, caused by insufficient error checking when processing HTTP requests.","The vulnerability requires no authentication or user interaction and can allow an attacker with network access to the Remote Access SSL VPN service to send a crafted HTTP request that causes the device to reload unexpectedly.","Cisco published its advisory on August 11, 2026, said its Product Security Incident Response Team was aware of active exploitation in August 2026, and CISA added the vulnerability to the Known Exploited Vulnerabilities catalog the same day.","Affected devices are Cisco ASA or FTD systems running vulnerable releases with SSL listen sockets enabled through SSL VPN, IKEv2 remote access VPN with client services, or Zero Trust Network Access on Cisco Secure FTD Software.","Cisco has released hot fixes for affected ASA and FTD releases, and the article states there are no workarounds, making upgrading to a fixed release the only remediation."],"insights":["Because there are no workarounds, organizations that cannot take affected devices out of service remain exposed until they can complete an upgrade to a fixed release.","High availability deployments require special attention because patching only the active member of a pair can leave the standby member vulnerable.","Older or leftover remote access gateways may still be reachable, listening, and configured for VPN use even after a migration is considered complete, so decommissioning unused gateways is part of reducing exposure.","Cisco ASA hot fixes whose versions begin with 89 require ASDM Release 7.24.1.374 because earlier ASDM releases do not recognize that ASA Software release numbering format.","The article’s exposure data shows Industrials account for 27.0% of observed impacted assets, which it links to geographically distributed sites, acquisitions, and uneven patch windows."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-20349 is a high-severity denial of service vulnerability in the Remote Access SSL VPN service of Cisco Secure Firewall ASA Software and Cisco Secure Firewall FTD Software. The flaw is caused by insufficient error checking when the service processes HTTP requests and has a CVSS v3.1 base score of 8.6. Exploitation requires no authentication and no user interaction, and an attacker with network access to the service can send a crafted HTTP request that causes the device to reload unexpectedly.\u003c/p\u003e\n\n\u003cp\u003eCisco published its advisory on August 11, 2026, and said its Product Security Incident Response Team became aware of active exploitation in August 2026. CISA added CVE-2026-20349 to the Known Exploited Vulnerabilities catalog on the same day. Affected assets are Cisco ASA or FTD devices running vulnerable releases with SSL listen sockets enabled through SSL VPN, IKEv2 remote access VPN with client services, or Zero Trust Network Access on Cisco Secure FTD Software. Cisco has released hot fixes for affected ASA and FTD releases, and the article states there are no workarounds, making upgrade to a fixed release the only remediation.\u003c/p\u003e\n"},{"n":10,"title":"Hackers exploit critical Adobe Commerce flaw to hijack customer accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-adobe-commerce-flaw-to-hijack-customer-accounts/","time":"20:54","priority":"MUST READ","score":94,"tldr":"Attackers are already trying to exploit a critical Adobe Commerce and Magento flaw, CVE-2026-71362, that can let them hijack customer accounts without authentication. Site administrators should urgently apply Adobe’s August 2026 isolated security patches after updating to the latest supported -p release.","briefOverview":"\u003cp\u003eAttempts to exploit a critical vulnerability, CVE-2026-71362, in Adobe Commerce and Magento have been detected. The flaw could potentially allow attackers to hijack customer accounts. Adobe described it as an incorrect authorization vulnerability that could be used to gain elevated access to sensitive resources without authentication.\u003c/p\u003e\n\n\u003cp\u003eAdobe fixed CVE-2026-71362 as part of a security update that addressed seven issues in Commerce and Magento. Although Adobe said it was not aware of exploits in the wild for any of the fixed flaws, Sansec said its Shield web application firewall is already blocking exploitation attempts. Sansec said exploitation requires no existing account, administrator privileges, or user interaction.\u003c/p\u003e\n\n\u003cp\u003eAfter reviewing Adobe’s patch, Sansec said the issue involved Magento improperly handling customer identity in an account session. The company said the vulnerability lets attackers switch a customer session to another customer account, giving access to the victim’s account and private customer data. Website administrators are advised to apply the August 2026 security update for supported Commerce, Commerce B2B, and Magento release lines as soon as possible, after ensuring they are running the latest -p release for their supported branch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attempts to exploit CVE-2026-71362 in Adobe Commerce and Magento have been detected, potentially allowing attackers to hijack customer accounts.","Adobe described CVE-2026-71362 as an incorrect authorization vulnerability that could allow elevated access to sensitive resources without authentication.","Sansec said its Shield web application firewall is already blocking exploitation attempts, despite Adobe saying it was not aware of exploits in the wild for the fixed flaws.","Sansec’s analysis of Adobe’s patch found that the flaw lets attackers switch a customer session to another customer account, giving access to the victim’s account and private customer data.","Website administrators are advised to apply the August 2026 security update for supported Commerce, Commerce B2B, and Magento release lines as soon as possible."],"insights":["There is a discrepancy between Adobe’s advisory and Sansec’s observations: Adobe said it was not aware of in-the-wild exploitation, while Sansec said its WAF is already blocking attempts targeting CVE-2026-71362.","The flaw is especially actionable for defenders because Sansec says exploitation requires no existing account, administrator privileges, or user interaction.","Applying the fix may require more than a routine package update, because Sansec says the monthly fixes are distributed as isolated patch files rather than a new security release or updated Composer packages.","Administrators must first confirm they are on the latest -p release for their supported branch before applying the corresponding isolated patch."],"referencedReports":[{"title":"Adobe Security Bulletin APSB26-92","url":"http://helpx.adobe.com/security/products/magento/apsb26-92.html","publisher":"Adobe","context":"The article cites Adobe’s advisory for the fixed Adobe Commerce and Magento vulnerabilities and Adobe’s statement that it was not aware of exploitation in the wild.","category":"advisory","primary":true},{"title":"Adobe Commerce Account Takeover APSB26-92","url":"https://sansec.io/research/adobe-commerce-account-takeover-apsb26-92","publisher":"Sansec","context":"The article cites Sansec’s analysis of Adobe’s patch, which says CVE-2026-71362 can let attackers switch a customer session to another customer account.","category":"research","primary":true}],"body":"\u003cp\u003eAttempts to exploit a critical vulnerability, CVE-2026-71362, in Adobe Commerce and Magento have been detected. The flaw could potentially allow attackers to hijack customer accounts. Adobe described it as an incorrect authorization vulnerability that could be used to gain elevated access to sensitive resources without authentication.\u003c/p\u003e\n\n\u003cp\u003eAdobe fixed CVE-2026-71362 as part of a security update that addressed seven issues in Commerce and Magento. Although Adobe said it was not aware of exploits in the wild for any of the fixed flaws, Sansec said its Shield web application firewall is already blocking exploitation attempts. Sansec said exploitation requires no existing account, administrator privileges, or user interaction.\u003c/p\u003e\n\n\u003cp\u003eAfter reviewing Adobe’s patch, Sansec said the issue involved Magento improperly handling customer identity in an account session. The company said the vulnerability lets attackers switch a customer session to another customer account, giving access to the victim’s account and private customer data. Website administrators are advised to apply the August 2026 security update for supported Commerce, Commerce B2B, and Magento release lines as soon as possible, after ensuring they are running the latest -p release for their supported branch.\u003c/p\u003e\n"},{"n":17,"title":"CISA gives federal agencies two weeks to patch Microsoft bug exploited in DPRK campaign","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cisa-gives-federal-agencies-two-weeks-to-patch-dprk-microsoft-bug","time":"12:06","priority":"MUST READ","score":94,"tldr":"CISA ordered federal agencies to patch a Windows Winsock vulnerability, CVE-2026-68820, by August 25 after Microsoft and researchers confirmed it is being exploited by North Korea’s Lazarus Group. The bug is being used in Operation Dream Job attacks where fake recruiters send malicious PDFs to defense and aerospace job seekers to gain long-term access and escalate privileges.","briefOverview":"\u003cp\u003eCISA ordered federal agencies to patch Windows vulnerability CVE-2026-68820 by August 25 after CISA and Microsoft confirmed it is being exploited. The bug affects Winsock, which the article describes as a tool that acts as a bridge allowing web browsers to connect to the internet. Microsoft said it was the only vulnerability in its Patch Tuesday release confirmed to be used in real-world attacks.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is tied to a North Korean hacking campaign targeting people applying for jobs in the defense and aerospace industry. Check Point said it disclosed the bug to Microsoft after finding it during research into the latest wave of Operation “Dream Job,” a long-running campaign by North Korean hackers to exploit the job application process. Lazarus Group hackers allegedly impersonated recruiters for Lockheed Martin and Enveil, contacted people on LinkedIn and other sites, and sent malicious PDF files that enabled a backdoor for long-term remote access.\u003c/p\u003e\n\n\u003cp\u003eCheck Point researchers said the malware first collects information about the infected device before deploying an exploit for CVE-2026-68820. The flaw allows an attacker who already placed malware on a machine to escalate from limited access to complete control normally reserved for the operating system itself. Researchers found targets across defense-related sectors including surveillance sensors, drones, and robotics in France, Germany, Brazil, and India.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA ordered federal agencies to patch Windows vulnerability CVE-2026-68820 by August 25 after CISA and Microsoft confirmed it is being exploited in real-world attacks.","The vulnerability affects Winsock, requires a device restart to fix, has no workaround, and was the only Microsoft Patch Tuesday bug that Microsoft confirmed was being used in real-world attacks.","Check Point said it disclosed the bug to Microsoft after finding it during research into a Lazarus Group Operation Dream Job campaign targeting job applicants in the defense and aerospace industry.","Lazarus Group hackers impersonated recruiters for Lockheed Martin and Enveil and sent malicious PDF files that enabled a backdoor providing long-term remote access.","Check Point researchers found targets in defense-related sectors including surveillance sensors, drones, and robotics in France, Germany, Brazil, and India."],"insights":["The article says there is no workaround for CVE-2026-68820 and a restart is required, making patch deployment the only stated remediation path for affected Windows endpoints.","Jason Kikta noted that exploitation requires an attacker to first gain a low-privileged foothold through phishing, so blocking or detecting the initial fake recruiting activity is part of reducing exposure to the Windows flaw.","Check Point said Lazarus made the campaign harder to detect by using trusted infrastructure, real vendor branding, and already-compromised organizations rather than relying only on obviously suspicious links.","Check Point initially believed the issue was related to a vulnerability fixed last year, but testing showed it was a new bug, highlighting that similar-looking exploit activity may still involve a distinct vulnerability."],"referencedReports":[{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites this CISA alert as confirmation that CVE-2026-68820 is being exploited and as the basis for the federal patch deadline.","category":"advisory","primary":true},{"title":"State-Sponsored Hackers Use Fake Job Offers to Deliver New Zero-Day Exploit","url":"https://blog.checkpoint.com/research/state-sponsored-hackers-use-fake-job-offers-to-deliver-new-zero-day-exploit/","publisher":"Check Point","context":"The article references this Check Point report for details on the Lazarus Group Operation Dream Job campaign and the discovery of CVE-2026-68820.","category":"research","primary":true}],"body":"\u003cp\u003eCISA ordered federal agencies to patch Windows vulnerability CVE-2026-68820 by August 25 after CISA and Microsoft confirmed it is being exploited. The bug affects Winsock, which the article describes as a tool that acts as a bridge allowing web browsers to connect to the internet. Microsoft said it was the only vulnerability in its Patch Tuesday release confirmed to be used in real-world attacks.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is tied to a North Korean hacking campaign targeting people applying for jobs in the defense and aerospace industry. Check Point said it disclosed the bug to Microsoft after finding it during research into the latest wave of Operation “Dream Job,” a long-running campaign by North Korean hackers to exploit the job application process. Lazarus Group hackers allegedly impersonated recruiters for Lockheed Martin and Enveil, contacted people on LinkedIn and other sites, and sent malicious PDF files that enabled a backdoor for long-term remote access.\u003c/p\u003e\n\n\u003cp\u003eCheck Point researchers said the malware first collects information about the infected device before deploying an exploit for CVE-2026-68820. The flaw allows an attacker who already placed malware on a machine to escalate from limited access to complete control normally reserved for the operating system itself. Researchers found targets across defense-related sectors including surveillance sensors, drones, and robotics in France, Germany, Brazil, and India.\u003c/p\u003e\n"},{"n":18,"title":"Malicious LiteLLM Releases Tied to Trivy Hack May Have Exposed 2,100+ Organizations","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/malicious-litellm-releases-tied-to.html","time":"08:04","priority":"MUST READ","score":94,"tldr":"Two malicious LiteLLM versions briefly published to PyPI in March may have exposed secrets from over 2,500 organizations, with attackers stealing cloud keys, CI/CD credentials, SSH keys, Kubernetes tokens, and other sensitive data. Organizations that installed LiteLLM 1.82.7 or 1.82.8 during the exposure window should rotate all accessible secrets immediately rather than wait for proof of misuse.","briefOverview":"\u003cp\u003eTwo malicious LiteLLM releases, versions 1.82.7 and 1.82.8, were published on PyPI in March and carried code capable of stealing cloud keys, SSH keys, Kubernetes tokens, database passwords, and other secrets. LiteLLM said the versions were live on March 24 from 10:39 UTC for about 40 minutes before PyPI quarantined them, but it advises treating any install that day up to 16:00 UTC as suspect. CloudSEK said a dataset built from roughly 434,000 files captured by the attackers maps potential exposure to more than 2,500 organizations, though the article states this is not a confirmed victim count.\u003c/p\u003e\n\n\u003cp\u003eThe compromised packages were designed to collect secrets and send stolen data to models.litellm[.]cloud, an attacker-controlled domain unrelated to the LiteLLM project. Version 1.82.8 included a litellm_init.pth file that Python processes at interpreter startup, meaning it ran whenever a Python process started in that environment even if LiteLLM was not imported. The article notes that an unpinned transitive dependency, including one pulled in by an agent framework or orchestration tool, could have delivered the compromised package without a team knowingly choosing LiteLLM.\u003c/p\u003e\n\n\u003cp\u003eThe incident is tied to the wider TeamPCP supply-chain campaign linked to Aqua Security’s Trivy scanner, and Google tracks TeamPCP as UNC6780. The FBI warned that affiliated actors are likely to weaponize credentials stolen during the campaign long after the initial compromise and advised organizations to rotate CI/CD secrets, publishing tokens, and cloud credentials. Organizations assessing exposure are told to check for LiteLLM 1.82.7 or 1.82.8 installations during the March 24 audit window, rotate any secrets those systems could access, and search GitHub organizations for related campaign indicators.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Two malicious LiteLLM releases, versions 1.82.7 and 1.82.8, were live on PyPI for about 40 minutes on March 24 and contained code capable of stealing cloud keys, SSH keys, Kubernetes tokens, database passwords, and other secrets.","CloudSEK said a dataset built from roughly 434,000 files captured by the attackers maps potential exposure to more than 2,500 organizations, but the article states these totals are not a confirmed victim count.","The compromised packages sent stolen data to models.litellm[.]cloud, an attacker-controlled domain unrelated to the LiteLLM project.","The FBI warned that actors affiliated with the TeamPCP campaign are likely to use credentials stolen during the incident long after the initial compromise and advised organizations to rotate CI/CD secrets, publishing tokens, and cloud credentials.","Organizations assessing exposure are advised to check for LiteLLM 1.82.7 or 1.82.8 installations during the March 24 audit window, rotate accessible secrets, and search GitHub organizations for repositories named tpcp-docs or docs-tpcp."],"insights":["Teams cannot limit their review to systems that intentionally used LiteLLM, because the article says an unpinned transitive dependency from an agent framework or orchestration tool could have installed the compromised package without anyone deliberately choosing it.","LiteLLM 1.82.8 was especially risky because its litellm_init.pth file ran when any Python process started in the environment, even if LiteLLM was never imported by an application.","CloudSEK’s public exposure dataset should be treated as a triage aid rather than a definitive victim list, because the article says it is based on stolen files and log data and does not prove that any stolen credentials were used.","Organizations searching GitHub for FBI-listed indicators may miss evidence if they only look for exact repository names, because Aqua’s advisory says the malware used a tpcp-docs- prefix and uploaded stolen data as release assets tagged data-\u003ctimestamp\u003e.","The article frames credential rotation as urgent because long-lived secrets copied during the short exposure window can remain usable unless they have since been rotated or revoked."],"referencedReports":[{"title":"AI Supply Chain Breach: 2,500 Companies, 434,000 CI/CD Pipelines","url":"https://www.cloudsek.com/blog/ai-supply-chain-breach-2500-companies-434000-cicd-pipelines","publisher":"CloudSEK","context":"The article cites CloudSEK’s report as the source of the dataset mapping potential exposure to more than 2,500 organizations from roughly 434,000 captured files.","category":"research","primary":true},{"title":"Security Update March 2026","url":"https://docs.litellm.ai/blog/security-update-march-2026","publisher":"LiteLLM","context":"The article references LiteLLM’s own advisory for the compromised versions, the exposure window, and the warning that transitive dependencies could have installed the package.","category":"advisory","primary":true},{"title":"FLASH-20260702-01","url":"https://www.ic3.gov/CSA/2026/260702.pdf","publisher":"FBI","context":"The article cites the FBI advisory warning that actors affiliated with TeamPCP may weaponize stolen credentials long after the initial compromise and listing campaign indicators.","category":"advisory","primary":false},{"title":"TeamPCP Supply Chain Attacks","url":"https://unit42.paloaltonetworks.com/teampcp-supply-chain-attacks/","publisher":"Unit 42","context":"The article cites Unit 42’s campaign analysis for details on the payload stealing model API keys and the attackers targeting PyPI publishing tokens after the Trivy breach.","category":"research","primary":false},{"title":"Trivy Supply Chain Attack: What You Need to Know","url":"https://www.aquasec.com/blog/trivy-supply-chain-attack-what-you-need-to-know/","publisher":"Aqua Security","context":"The article references Aqua’s analysis for details on the Trivy compromise, including retained attacker access and malicious commits to Trivy-related tags.","category":"research","primary":false},{"title":"CVE-2026-33634","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-33634","publisher":"NVD","context":"The article links the CVE record tracking the ecosystem compromise and notes that it lists BerriAI LiteLLM 1.82.7 through 1.82.8 as affected alongside Trivy components.","category":"advisory","primary":false},{"title":"PYSEC-2026-2","url":"https://github.com/pypa/advisory-database/tree/main/vulns/litellm/PYSEC-2026-2.yaml","publisher":"PyPA","context":"The article cites PyPA’s advisory for the malicious LiteLLM releases as describing an exposed API token that was used to upload the two compromised versions.","category":"advisory","primary":false},{"title":"GHSA-69fq-xp46-6x23","url":"https://github.com/advisories/GHSA-69fq-xp46-6x23","publisher":"Aqua Security","context":"The article cites Aqua’s GitHub advisory for CVE-2026-33634 as noting that the malware created repositories with a tpcp-docs- prefix and uploaded stolen data as release assets.","category":"advisory","primary":false},{"title":"European Commission Cloud Breach Trivy Supply Chain","url":"https://cert.europa.eu/blog/european-commission-cloud-breach-trivy-supply-chain","publisher":"CERT-EU","context":"The article references CERT-EU’s assessment that a European Commission AWS account was compromised through the Trivy supply-chain attack and that about 91.7 GB of compressed data was exfiltrated.","category":"research","primary":false}],"body":"\u003cp\u003eTwo malicious LiteLLM releases, versions 1.82.7 and 1.82.8, were published on PyPI in March and carried code capable of stealing cloud keys, SSH keys, Kubernetes tokens, database passwords, and other secrets. LiteLLM said the versions were live on March 24 from 10:39 UTC for about 40 minutes before PyPI quarantined them, but it advises treating any install that day up to 16:00 UTC as suspect. CloudSEK said a dataset built from roughly 434,000 files captured by the attackers maps potential exposure to more than 2,500 organizations, though the article states this is not a confirmed victim count.\u003c/p\u003e\n\n\u003cp\u003eThe compromised packages were designed to collect secrets and send stolen data to models.litellm[.]cloud, an attacker-controlled domain unrelated to the LiteLLM project. Version 1.82.8 included a litellm_init.pth file that Python processes at interpreter startup, meaning it ran whenever a Python process started in that environment even if LiteLLM was not imported. The article notes that an unpinned transitive dependency, including one pulled in by an agent framework or orchestration tool, could have delivered the compromised package without a team knowingly choosing LiteLLM.\u003c/p\u003e\n\n\u003cp\u003eThe incident is tied to the wider TeamPCP supply-chain campaign linked to Aqua Security’s Trivy scanner, and Google tracks TeamPCP as UNC6780. The FBI warned that affiliated actors are likely to weaponize credentials stolen during the campaign long after the initial compromise and advised organizations to rotate CI/CD secrets, publishing tokens, and cloud credentials. Organizations assessing exposure are told to check for LiteLLM 1.82.7 or 1.82.8 installations during the March 24 audit window, rotate any secrets those systems could access, and search GitHub organizations for related campaign indicators.\u003c/p\u003e\n"},{"n":20,"title":"SAP Commerce Cloud Flaw Could Let Unauthenticated Attackers Execute Arbitrary Code","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/sap-commerce-cloud-flaw-could-let.html","time":"07:31","priority":"MUST READ","score":94,"tldr":"SAP patched a critical SAP Commerce Cloud flaw (CVE-2026-58231) that could let unauthenticated attackers execute arbitrary code via insufficient authorization checks and input validation. Customers should update and redeploy fixed Commerce Cloud releases, or temporarily restrict access to the vulnerable endpoint with IP filtering.","briefOverview":"\u003cp\u003eSAP released patches for a maximum-severity security flaw in SAP Commerce Cloud Data Hub Adapter that could allow arbitrary code execution. The vulnerability is tracked as CVE-2026-58231 and has a CVSS score of 10.0. It is described as involving insufficient authorization checks and input validation.\u003c/p\u003e\n\n\u003cp\u003eAccording to the CVE description, SAP Commerce Cloud allows an unauthenticated attacker to abuse a default authentication client and submit specially crafted input to certain functions that lack sufficient validation. Successful exploitation could compromise internal components and have a high impact on the application’s confidentiality, integrity, and availability. Onapsis urged customers to patch to a fixed Commerce Cloud release and redeploy the updated SAP Commerce Cloud version.\u003c/p\u003e\n\n\u003cp\u003eSAP’s August 2026 update also addressed three other critical vulnerabilities: CVE-2026-44772, CVE-2026-34265, and CVE-2026-44758. These affect Manufacturing Integration and Intelligence, Application Server ABAP for SAP NetWeaver, and ABAP Platform. Onapsis said temporary exposure to the Commerce Cloud flaw can be reduced by configuring an IP Filter Set, and it also described post-patch requirements for CVE-2026-44772 involving the new “Secure Transformer” system property and allowed hosts for XSL files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP released patches for CVE-2026-58231, a maximum-severity flaw in SAP Commerce Cloud Data Hub Adapter rated 10.0 on the CVSS scale.","CVE-2026-58231 allows an unauthenticated attacker to abuse a default authentication client and submit specially crafted input to functions lacking sufficient validation, potentially enabling arbitrary code execution.","Onapsis urged customers to patch to a fixed SAP Commerce Cloud release and redeploy the updated version, with IP Filter Set restrictions suggested as a temporary workaround.","SAP’s August 2026 update also addressed critical flaws CVE-2026-44772, CVE-2026-34265, and CVE-2026-44758 affecting Manufacturing Integration and Intelligence, Application Server ABAP for SAP NetWeaver, and ABAP Platform.","Onapsis said SAP’s patch for CVE-2026-44758 removes a vulnerable servlet component, while the patch for CVE-2026-44772 requires maintaining the new 'Secure Transformer' system property with allowed hosts for XSL files."],"insights":["For CVE-2026-58231, applying the fix is not just a patching step; Onapsis says customers must patch to a fixed SAP Commerce Cloud release and then redeploy the updated version.","Organizations that cannot immediately fix CVE-2026-58231 can reduce exposure by using an IP Filter Set to restrict access to the vulnerable endpoint.","SAP’s fix for CVE-2026-44758 removes the vulnerable servlet component entirely, indicating the remediation is a component removal rather than only input filtering or configuration hardening.","After patching CVE-2026-44772, customers must configure the new 'Secure Transformer' system property with allowed hosts for XSL files, or the post-patch control described by Onapsis is not in place."],"referencedReports":[{"title":"August 2026 Security Patch Day","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/august-2026.html","publisher":"SAP","context":"The article says SAP released patches in its August 2026 update to address CVE-2026-58231 and other critical flaws.","category":"advisory","primary":true},{"title":"SAP Security Patch Day August 2026","url":"https://onapsis.com/blog/sap-security-patch-day-august-2026/","publisher":"Onapsis","context":"The article cites Onapsis for patching guidance, workaround advice, and technical details about the SAP flaws and fixes.","category":"advisory","primary":true}],"body":"\u003cp\u003eSAP released patches for a maximum-severity security flaw in SAP Commerce Cloud Data Hub Adapter that could allow arbitrary code execution. The vulnerability is tracked as CVE-2026-58231 and has a CVSS score of 10.0. It is described as involving insufficient authorization checks and input validation.\u003c/p\u003e\n\n\u003cp\u003eAccording to the CVE description, SAP Commerce Cloud allows an unauthenticated attacker to abuse a default authentication client and submit specially crafted input to certain functions that lack sufficient validation. Successful exploitation could compromise internal components and have a high impact on the application’s confidentiality, integrity, and availability. Onapsis urged customers to patch to a fixed Commerce Cloud release and redeploy the updated SAP Commerce Cloud version.\u003c/p\u003e\n\n\u003cp\u003eSAP’s August 2026 update also addressed three other critical vulnerabilities: CVE-2026-44772, CVE-2026-34265, and CVE-2026-44758. These affect Manufacturing Integration and Intelligence, Application Server ABAP for SAP NetWeaver, and ABAP Platform. Onapsis said temporary exposure to the Commerce Cloud flaw can be reduced by configuring an IP Filter Set, and it also described post-patch requirements for CVE-2026-44772 involving the new “Secure Transformer” system property and allowed hosts for XSL files.\u003c/p\u003e\n"},{"n":26,"title":"Cisco ASA and FTD Flaw Exploited in the Wild Can Trigger Remote DoS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/cisco-asa-and-ftd-flaw-exploited-in.html","time":"06:15","priority":"MUST READ","score":94,"tldr":"Cisco warned that a high-severity flaw in ASA and FTD software, CVE-2026-20349, is being exploited in the wild to remotely crash affected devices with crafted HTTP requests to Remote Access SSL VPN services. There are no workarounds, so affected organizations should apply Cisco’s fixes urgently.","briefOverview":"\u003cp\u003eCisco warned that a new vulnerability affecting Secure Firewall Adaptive Security Appliance Software and Secure Firewall Threat Defense Software has been exploited in the wild. The high-severity flaw is tracked as CVE-2026-20349 and has a CVSS score of 8.6. Cisco said the issue involves insufficient error checking when processing HTTP requests and could allow an unauthenticated remote attacker to trigger a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eAccording to Cisco, an attacker could exploit the flaw by sending a crafted HTTP request to the Remote Access SSL VPN service on an affected device. A successful exploit could cause the affected device to reload, resulting in a denial-of-service condition. Affected devices are those running vulnerable ASA or FTD software versions with IKEv2 Remote Access VPN with client services, SSL-VPN, or Zero Trust Network Access enabled.\u003c/p\u003e\n\n\u003cp\u003eCisco said there are no workarounds that address the flaw and listed fixed ASA releases and FTD hotfixes for affected versions. The company said it became aware of active exploitation earlier this month and that the issue was found during internal security testing, with Valerio Brussani separately credited for discovering and reporting it. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by August 14, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco warned that CVE-2026-20349, a high-severity vulnerability affecting Secure Firewall ASA Software and Secure Firewall Threat Defense Software, has been exploited in the wild.","The flaw is caused by insufficient error checking when processing HTTP requests and can allow an unauthenticated remote attacker to trigger a denial-of-service condition.","Cisco said an attacker could exploit the vulnerability by sending a crafted HTTP request to the Remote Access SSL VPN service on an affected device, causing the device to reload.","Affected devices are those running vulnerable versions of ASA or FTD software with IKEv2 Remote Access VPN with client services, SSL-VPN, or Zero Trust Network Access enabled.","Cisco said there are no workarounds for the flaw, and CISA added it to the Known Exploited Vulnerabilities catalog with a fix deadline of August 14, 2026, for U.S. federal civilian agencies."],"insights":["The risk is configuration-dependent: only devices running vulnerable ASA or FTD versions with IKEv2 Remote Access VPN client services, SSL-VPN, or Zero Trust Network Access enabled are described as affected.","Cisco says there are no workarounds, making installation of the listed fixed releases or hotfixes the only remediation identified in the article.","CISA set an August 14, 2026 deadline for U.S. federal civilian agencies, indicating a short required remediation window after the flaw was added to the Known Exploited Vulnerabilities catalog.","Although Cisco confirmed active exploitation, the article states that there are no public details about the attackers, targets, origins, or whether any exploitation attempts succeeded."],"referencedReports":[{"title":"Cisco Secure Firewall ASA and FTD Software Remote Access VPN Denial of Service Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-asaftd-vpn-dos-dzv4mQFF","publisher":"Cisco","context":"The article cites Cisco's Tuesday advisory as the source for details on CVE-2026-20349, affected configurations, exploitation conditions, and fixes.","category":"advisory","primary":true},{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA's alert adding the Cisco flaw to the Known Exploited Vulnerabilities catalog and setting a remediation deadline for federal civilian agencies.","category":"advisory","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article links to CISA's Known Exploited Vulnerabilities catalog when noting that CVE-2026-20349 was added due to active exploitation.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco warned that a new vulnerability affecting Secure Firewall Adaptive Security Appliance Software and Secure Firewall Threat Defense Software has been exploited in the wild. The high-severity flaw is tracked as CVE-2026-20349 and has a CVSS score of 8.6. Cisco said the issue involves insufficient error checking when processing HTTP requests and could allow an unauthenticated remote attacker to trigger a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eAccording to Cisco, an attacker could exploit the flaw by sending a crafted HTTP request to the Remote Access SSL VPN service on an affected device. A successful exploit could cause the affected device to reload, resulting in a denial-of-service condition. Affected devices are those running vulnerable ASA or FTD software versions with IKEv2 Remote Access VPN with client services, SSL-VPN, or Zero Trust Network Access enabled.\u003c/p\u003e\n\n\u003cp\u003eCisco said there are no workarounds that address the flaw and listed fixed ASA releases and FTD hotfixes for affected versions. The company said it became aware of active exploitation earlier this month and that the issue was found during internal security testing, with Valerio Brussani separately credited for discovering and reporting it. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by August 14, 2026.\u003c/p\u003e\n"},{"n":3,"title":"\"City-Forum\" data-theft attacks target Salesforce, ServiceNow portals","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/city-forum-data-theft-attacks-target-salesforce-servicenow-portals/","time":"23:07","priority":"MUST READ","score":92,"tldr":"A campaign dubbed City-Forum is stealing data from misconfigured Salesforce Experience Cloud and ServiceNow customer portals that expose records to unauthenticated guest users. The activity is ongoing and appears to come from a single long-running Contabo-hosted IP, with defenders urged to lock down guest access, public APIs, self-registration, and portal search sources.","briefOverview":"\u003cp\u003eAn ongoing data theft campaign dubbed City-Forum is using custom tools to steal data exposed to anonymous users through Salesforce Experience Cloud and ServiceNow customer portals. SaaS security firm Reco traced the campaign to a single server that has targeted organizations worldwide, including telecommunications companies, banks and financial services firms, enterprise software vendors, security and data privacy companies, and public-sector portals. Reco says the attacks are ongoing and that activity continues to increase.\u003c/p\u003e\n\n\u003cp\u003eReco says the attacks originate from the IP address \u003ccode\u003e158.220.87.79\u003c/code\u003e, hosted by German VPS provider Contabo, and usually use the default \u003ccode\u003eGo-http-client/1.1\u003c/code\u003e user agent when downloading data. The campaign is not exploiting a vulnerability in Salesforce or ServiceNow, but is abusing data that organizations have mistakenly exposed to unauthenticated guest users through overly permissive sharing rules, permissions, or portal configurations. The same infrastructure and fingerprint have been observed against both Salesforce and ServiceNow environments across multiple organizations.\u003c/p\u003e\n\n\u003cp\u003eOn Salesforce, the attacker targets older Aura endpoints such as \u003ccode\u003e/aura\u003c/code\u003e or \u003ccode\u003e/s/sfsites/aura\u003c/code\u003e, invokes \u003ccode\u003eHostConfigController.getConfigData\u003c/code\u003e to enumerate objects, and uses \u003ccode\u003eSelectableListDataProviderController.getItems\u003c/code\u003e to retrieve records. The attacker also targets newer Lightning Web Runtime sites through GraphQL requests to \u003ccode\u003e/webruntime/api/services/data/{version}/graphql\u003c/code\u003e, and checks \u003ccode\u003e/SiteRegister\u003c/code\u003e and \u003ccode\u003e/CommunitiesSelfReg\u003c/code\u003e for self-registration. On ServiceNow, the attacker targets \u003ccode\u003ePOST /api/now/sp/search?sysparm_cancelable=true\u003c/code\u003e, and Reco advises administrators to review guest access, public APIs, self-registration, and exposed portal search sources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Reco says an ongoing data theft campaign dubbed City-Forum is using custom tools to steal data exposed to anonymous users through Salesforce Experience Cloud and ServiceNow customer portals.","The attacks have been traced to the IP address 158.220.87.79, hosted by German VPS provider Contabo and associated with the city-forum.com domain since at least March 2025.","Reco says the campaign is not exploiting vulnerabilities in Salesforce or ServiceNow, but is abusing overly permissive guest-user sharing rules, permissions, or portal configurations.","On Salesforce, the attacker targets Aura endpoints and newer Lightning Web Runtime sites to enumerate and retrieve records exposed to guest accounts.","On ServiceNow, the attacker targets the POST /api/now/sp/search?sysparm_cancelable=true endpoint to search Service Portals that allow guest access to data."],"insights":["Reco observed the same fingerprint across both Salesforce and ServiceNow environments, suggesting defenders can look for the combination of IP address 158.220.87.79 and the default Go-http-client/1.1 user agent across multiple portal platforms.","The campaign includes Salesforce Lightning Web Runtime sites through GraphQL requests to the webruntime API, a technique Reco says it has not seen in public attack tools such as AuraInspector, S-RET, or CirrusGo.","Disabling the Experience Builder option that allows guest users to access public APIs can block several Salesforce API endpoints used for data enumeration and theft when guest API access is not required.","ServiceNow transaction logs do not record the POST body for the targeted portal search endpoint, so defenders may be able to see that automated searches occurred and how much data was returned but not the exact search terms used."],"referencedReports":[{"title":"City-Forum campaign targeting Salesforce and ServiceNow","url":"https://www.reco.ai/blog/city-forum-campaign-salesforce-servicenow","publisher":"Reco","context":"The article cites Reco's research as the source for details on the City-Forum data theft campaign targeting Salesforce and ServiceNow portals.","category":"research","primary":true}],"body":"\u003cp\u003eAn ongoing data theft campaign dubbed City-Forum is using custom tools to steal data exposed to anonymous users through Salesforce Experience Cloud and ServiceNow customer portals. SaaS security firm Reco traced the campaign to a single server that has targeted organizations worldwide, including telecommunications companies, banks and financial services firms, enterprise software vendors, security and data privacy companies, and public-sector portals. Reco says the attacks are ongoing and that activity continues to increase.\u003c/p\u003e\n\n\u003cp\u003eReco says the attacks originate from the IP address \u003ccode\u003e158.220.87.79\u003c/code\u003e, hosted by German VPS provider Contabo, and usually use the default \u003ccode\u003eGo-http-client/1.1\u003c/code\u003e user agent when downloading data. The campaign is not exploiting a vulnerability in Salesforce or ServiceNow, but is abusing data that organizations have mistakenly exposed to unauthenticated guest users through overly permissive sharing rules, permissions, or portal configurations. The same infrastructure and fingerprint have been observed against both Salesforce and ServiceNow environments across multiple organizations.\u003c/p\u003e\n\n\u003cp\u003eOn Salesforce, the attacker targets older Aura endpoints such as \u003ccode\u003e/aura\u003c/code\u003e or \u003ccode\u003e/s/sfsites/aura\u003c/code\u003e, invokes \u003ccode\u003eHostConfigController.getConfigData\u003c/code\u003e to enumerate objects, and uses \u003ccode\u003eSelectableListDataProviderController.getItems\u003c/code\u003e to retrieve records. The attacker also targets newer Lightning Web Runtime sites through GraphQL requests to \u003ccode\u003e/webruntime/api/services/data/{version}/graphql\u003c/code\u003e, and checks \u003ccode\u003e/SiteRegister\u003c/code\u003e and \u003ccode\u003e/CommunitiesSelfReg\u003c/code\u003e for self-registration. On ServiceNow, the attacker targets \u003ccode\u003ePOST /api/now/sp/search?sysparm_cancelable=true\u003c/code\u003e, and Reco advises administrators to review guest access, public APIs, self-registration, and exposed portal search sources.\u003c/p\u003e\n"},{"n":21,"title":"Adobe Patches Three CVSS 10.0 ColdFusion and Campaign Classic Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/adobe-patches-three-cvss-100-coldfusion.html","time":"11:13","priority":"MUST READ","score":92,"tldr":"Adobe released urgent patches for critical ColdFusion, Commerce, and Campaign Classic vulnerabilities, including three CVSS 10.0 flaws that could allow arbitrary code execution. Administ
