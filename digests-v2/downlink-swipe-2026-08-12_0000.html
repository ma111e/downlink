rators should apply the updates quickly, especially for ColdFusion and on-prem or hybrid Campaign Classic deployments.","briefOverview":"\u003cp\u003eAdobe shipped updates to address multiple critical security vulnerabilities affecting ColdFusion, Commerce, and Campaign Classic. The flaws could allow arbitrary code execution, privilege escalation, or application denial-of-service if successfully exploited. The most severe issues include three CVSS 10.0 vulnerabilities across ColdFusion and Campaign Classic.\u003c/p\u003e\n\n\u003cp\u003eColdFusion fixes are included in versions 2025.0.12 and 2023.0.23, while Campaign Classic fixes are included in ACC v7 7.4.4 build 9400. The listed issues include operating system command injection, eval injection, incorrect authorization, and SQL injection vulnerabilities. Adobe assigned the ColdFusion and Campaign Classic updates a Priority 1 rating, meaning they are considered at higher risk of being targeted by malicious cyber attacks.\u003c/p\u003e\n\n\u003cp\u003eThe Campaign Classic updates apply only to fully on-premise deployments and to the on-premise components of hybrid deployments. Adobe-hosted instances have already been remediated and require no customer action. Adobe said there is no evidence that the flaws have been exploited in the wild, but administrators are advised to install the updates as soon as possible, preferably within 72 hours.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adobe shipped updates for critical vulnerabilities affecting ColdFusion, Commerce, and Campaign Classic that could lead to arbitrary code execution or privilege escalation.","The most severe issues include CVE-2026-48362 in ColdFusion and CVE-2026-71398 and CVE-2026-27302 in Campaign Classic, each rated CVSS 10.0.","ColdFusion fixes are included in versions 2025.0.12 and 2023.0.23, while Campaign Classic fixes are included in ACC v7 7.4.4 build 9400.","The ColdFusion and Campaign Classic updates have a Priority 1 rating, meaning Adobe considers them at higher risk of being targeted by malicious cyber attacks.","Adobe said there is no evidence that the flaws are being exploited in the wild, but administrators are advised to install the updates as soon as possible, preferably within 72 hours."],"insights":["Adobe’s 72-hour remediation guidance is especially urgent for ColdFusion and Campaign Classic because those updates carry a Priority 1 rating, indicating Adobe sees a higher risk of malicious targeting even though no exploitation has been observed.","Campaign Classic customers do not all need to take the same action: Adobe-hosted instances have already been remediated, while fully on-premise deployments and on-premise components of hybrid deployments require customer updates.","Campaign Classic has now received patches for maximum-severity arbitrary code execution flaws twice in less than two weeks, following the earlier fix for CVE-2026-48449."],"referencedReports":[{"title":"Adobe ColdFusion Security Update (APSB26-90)","url":"https://helpx.adobe.com/security/products/coldfusion/apsb26-90.html","publisher":"Adobe","context":"The article cites Adobe's ColdFusion advisory for CVE-2026-48362, CVE-2026-48273, and CVE-2026-71384 fixes.","category":"advisory","primary":true},{"title":"Adobe Commerce Security Update (APSB26-92)","url":"https://helpx.adobe.com/security/products/magento/apsb26-92.html","publisher":"Adobe","context":"The article cites Adobe's Commerce advisory for CVE-2026-71362, an incorrect authorization flaw that could lead to privilege escalation.","category":"advisory","primary":true},{"title":"Adobe Campaign Classic Security Update (APSB26-123)","url":"https://helpx.adobe.com/security/products/campaign/apsb26-123.html","publisher":"Adobe","context":"The article cites Adobe's Campaign Classic advisory for CVE-2026-71398, CVE-2026-27302, and CVE-2026-48381 fixes.","category":"advisory","primary":true}],"body":"\u003cp\u003eAdobe shipped updates to address multiple critical security vulnerabilities affecting ColdFusion, Commerce, and Campaign Classic. The flaws could allow arbitrary code execution, privilege escalation, or application denial-of-service if successfully exploited. The most severe issues include three CVSS 10.0 vulnerabilities across ColdFusion and Campaign Classic.\u003c/p\u003e\n\n\u003cp\u003eColdFusion fixes are included in versions 2025.0.12 and 2023.0.23, while Campaign Classic fixes are included in ACC v7 7.4.4 build 9400. The listed issues include operating system command injection, eval injection, incorrect authorization, and SQL injection vulnerabilities. Adobe assigned the ColdFusion and Campaign Classic updates a Priority 1 rating, meaning they are considered at higher risk of being targeted by malicious cyber attacks.\u003c/p\u003e\n\n\u003cp\u003eThe Campaign Classic updates apply only to fully on-premise deployments and to the on-premise components of hybrid deployments. Adobe-hosted instances have already been remediated and require no customer action. Adobe said there is no evidence that the flaws have been exploited in the wild, but administrators are advised to install the updates as soon as possible, preferably within 72 hours.\u003c/p\u003e\n"},{"n":11,"title":"New Microsoft Defender 'ShieldBreak' zero-day grants SYSTEM privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-microsoft-defender-shieldbreak-zero-day-grants-system-privileges/","time":"10:15","priority":"MUST READ","score":90,"tldr":"A researcher released a new Microsoft Defender zero-day exploit, ShieldBreak, that can reportedly give attackers SYSTEM privileges on fully patched Windows systems when Defender is enabled. The exploit is described as a bypass of Microsoft’s RoguePlanet patch, and Microsoft has not yet issued a fix.","briefOverview":"\u003cp\u003eSecurity researcher Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldBreak after Microsoft issued the August 2026 Patch Tuesday security updates. The vulnerability is described as a bypass for RoguePlanet, another Defender privilege escalation flaw disclosed in June and patched by Microsoft one month later. Nightmare Eclipse said ShieldBreak can be used to gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems.\u003c/p\u003e\n\n\u003cp\u003eCybersecurity expert Kevin Beaumont said ShieldBreak and RoguePlanet work very differently. Beaumont described RoguePlanet as a filesystem race condition involving virtual disks and NT native file manipulation, while ShieldBreak uses a user-mode callback hook to change file contents during a Defender cloud-hydration scan via the Cloud Filter API. Will Dormann confirmed that the exploit works and said Microsoft Defender must be enabled for ShieldBreak to escalate attackers’ privileges.\u003c/p\u003e\n\n\u003cp\u003eThe ShieldBreak exploit is part of an ongoing dispute between Microsoft and Nightmare Eclipse over vulnerability disclosure and bug bounty practices. Since April 2026, the researcher has disclosed multiple zero-day exploits targeting Microsoft Defender, BitLocker, and other Windows components. Microsoft has patched some of the previously disclosed flaws, but the article says other vulnerabilities disclosed by Nightmare Eclipse are still waiting for an official patch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldBreak after Microsoft released the August 2026 Patch Tuesday security updates.","Nightmare Eclipse says ShieldBreak can gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems.","Kevin Beaumont said ShieldBreak works differently from RoguePlanet by using a user-mode callback hook to change file contents during a Defender cloud-hydration scan via the Cloud Filter API.","Will Dormann confirmed that the exploit works and said Microsoft Defender must be enabled for ShieldBreak to escalate attackers' privileges.","The ShieldBreak release is part of an ongoing dispute between Microsoft and Nightmare Eclipse over vulnerability disclosure and bug bounty practices."],"insights":["ShieldBreak reportedly works on fully patched Windows systems, which means applying the August 2026 Patch Tuesday updates does not protect against this specific Defender issue as described in the article.","The exploit depends on Microsoft Defender being enabled, according to Will Dormann, making the affected security product itself a condition for privilege escalation.","Although Nightmare Eclipse describes ShieldBreak as a RoguePlanet patch bypass, Kevin Beaumont said the underlying method is different from RoguePlanet’s earlier filesystem race condition.","Nightmare Eclipse claims the proof of concept had a 100% success rate in tests on Windows 11 25H2, the Canary channel, and Windows Server 2025."],"referencedReports":[],"body":"\u003cp\u003eSecurity researcher Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldBreak after Microsoft issued the August 2026 Patch Tuesday security updates. The vulnerability is described as a bypass for RoguePlanet, another Defender privilege escalation flaw disclosed in June and patched by Microsoft one month later. Nightmare Eclipse said ShieldBreak can be used to gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems.\u003c/p\u003e\n\n\u003cp\u003eCybersecurity expert Kevin Beaumont said ShieldBreak and RoguePlanet work very differently. Beaumont described RoguePlanet as a filesystem race condition involving virtual disks and NT native file manipulation, while ShieldBreak uses a user-mode callback hook to change file contents during a Defender cloud-hydration scan via the Cloud Filter API. Will Dormann confirmed that the exploit works and said Microsoft Defender must be enabled for ShieldBreak to escalate attackers’ privileges.\u003c/p\u003e\n\n\u003cp\u003eThe ShieldBreak exploit is part of an ongoing dispute between Microsoft and Nightmare Eclipse over vulnerability disclosure and bug bounty practices. Since April 2026, the researcher has disclosed multiple zero-day exploits targeting Microsoft Defender, BitLocker, and other Windows components. Microsoft has patched some of the previously disclosed flaws, but the article says other vulnerabilities disclosed by Nightmare Eclipse are still waiting for an official patch.\u003c/p\u003e\n"},{"n":34,"title":"Emerging Threat: (CVE-2026-10579) JBoss EAP Authentication Bypass via PicketLink SAML","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-10579-jboss-eap-authentication-bypass-via-picketlink-saml/","time":"08:30","priority":"MUST READ","score":90,"tldr":"CVE-2026-10579 is a critical pre-authentication authentication bypass in Red Hat JBoss EAP’s PicketLink SAML federation that could let attackers forge identities, including admin roles, via exposed SAML response endpoints. No fix was available at publication, so affected organizations should inventory JBoss EAP deployments, restrict SAML endpoints, and disable unsolicited response handling where possible.","briefOverview":"\u003cp\u003eCVE-2026-10579 is a critical authentication bypass in PicketLink Federation, the SAML identity federation component shipped with Red Hat JBoss Enterprise Application Platform. Red Hat published the record on August 11, 2026 and rated the security impact as Critical, with a CVSS v3.1 base score of 9.8. The vulnerability affects Red Hat JBoss Enterprise Application Platform 7 and 8, but specific vulnerable or fixed version ranges had not been named at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is in the handler that processes unsolicited SAML responses, which accepts forged assertions without verification or validation. Exploitation is pre-authentication and requires only network access to the endpoint that consumes SAML responses, with no credentials, user interaction, or prior foothold required. An attacker can construct a SAML assertion naming any principal and role, including administrator accounts, and the application behind the federation layer receives a session that appears authenticated and authorized.\u003c/p\u003e\n\n\u003cp\u003eThe article says exposed assets are Java application servers acting as SAML service providers where PicketLink federation is configured and the SAML response endpoint is reachable from an untrusted network. No fixed version had been published at the time of writing, so every JBoss EAP instance with PicketLink federation configured should be treated as vulnerable until Red Hat states otherwise. Recommended actions include inventorying JBoss EAP instances, restricting access to SAML service provider endpoints, disabling unsolicited response handling where it is not required, monitoring authentication logs, auditing recent privileged sessions, and rotating SAML signing certificates and session secrets on instances showing anomalous assertions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-10579 is a critical authentication bypass in PicketLink Federation, the SAML identity federation component shipped with Red Hat JBoss Enterprise Application Platform.","The flaw allows a pre-authentication attacker with network access to the SAML response endpoint to submit forged assertions naming any principal and role, including administrator accounts.","Red Hat lists JBoss Enterprise Application Platform 7 and 8 as affected, but the advisory did not name specific vulnerable or fixed version ranges at the time of writing.","No fixed version had been published at the time of writing, so every JBoss EAP instance with PicketLink federation configured should be treated as vulnerable until Red Hat states otherwise.","The article recommends inventorying JBoss EAP instances, restricting access to SAML service provider endpoints, disabling unsolicited response handling where it is not required, and monitoring authentication logs for suspicious sessions."],"insights":["Scoping exposure by JBoss EAP version alone is insufficient because the advisory does not provide fixed or vulnerable version ranges and the relevant risk depends on whether the deployed picketlink-federation component is configured.","The article frames the exposure as an inventory gap because organizations may know their JBoss EAP versions but not whether PicketLink federation is enabled or which endpoints accept unsolicited responses.","SAML service provider endpoints are often intentionally reachable from broad external sources because federated login must support users coming from different locations, which makes access restriction operationally harder.","Consumer Discretionary, Financials, and Information Technology account for most observed exposed assets in the article’s dataset, with Consumer Discretionary leading at 32.7%.","Disabling unsolicited response handling is a targeted mitigation for deployments that do not require identity-provider-initiated login, rather than a broad shutdown of SAML federation."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-10579 is a critical authentication bypass in PicketLink Federation, the SAML identity federation component shipped with Red Hat JBoss Enterprise Application Platform. Red Hat published the record on August 11, 2026 and rated the security impact as Critical, with a CVSS v3.1 base score of 9.8. The vulnerability affects Red Hat JBoss Enterprise Application Platform 7 and 8, but specific vulnerable or fixed version ranges had not been named at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is in the handler that processes unsolicited SAML responses, which accepts forged assertions without verification or validation. Exploitation is pre-authentication and requires only network access to the endpoint that consumes SAML responses, with no credentials, user interaction, or prior foothold required. An attacker can construct a SAML assertion naming any principal and role, including administrator accounts, and the application behind the federation layer receives a session that appears authenticated and authorized.\u003c/p\u003e\n\n\u003cp\u003eThe article says exposed assets are Java application servers acting as SAML service providers where PicketLink federation is configured and the SAML response endpoint is reachable from an untrusted network. No fixed version had been published at the time of writing, so every JBoss EAP instance with PicketLink federation configured should be treated as vulnerable until Red Hat states otherwise. Recommended actions include inventorying JBoss EAP instances, restricting access to SAML service provider endpoints, disabling unsolicited response handling where it is not required, monitoring authentication logs, auditing recent privileged sessions, and rotating SAML signing certificates and session secrets on instances showing anomalous assertions.\u003c/p\u003e\n"},{"n":19,"title":"ShieldBreak Zero-Day PoC Claims Microsoft Defender Patch Bypass With SYSTEM Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/shieldbreak-zero-day-poc-claims.html","time":"06:41","priority":"SHOULD READ","score":88,"tldr":"A researcher released a PoC for ShieldBreak, a claimed Microsoft Defender zero-day that bypasses Microsoft’s patch for the earlier RoguePlanet flaw and can achieve SYSTEM-level privileges on current Windows versions. Microsoft has been contacted, while related Windows privilege-escalation flaws were addressed in the latest Patch Tuesday updates.","briefOverview":"\u003cp\u003eSecurity researcher Chaotic Eclipse, also known as INFINITE NIGHTMARE, MSNightmare, and Nightmare-Eclipse, released a proof-of-concept for a new Microsoft zero-day called ShieldBreak. The issue is rooted in Microsoft Defender for Windows and is described as a patch bypass for CVE-2026-50656, also known as RoguePlanet. RoguePlanet was previously described as a race condition that could allow an attacker to spawn a shell with SYSTEM-level privileges and run arbitrary code or perform unauthorized actions.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft patched RoguePlanet almost a month after its June 2026 disclosure, describing it as a privilege escalation issue in the Microsoft Malware Protection Engine, mpengine.dll. Chaotic Eclipse later said Microsoft’s defense-in-depth updates could cause Defender to leak 8 bytes of data in certain scenarios on Windows 11 25H2 and Windows Server 2025. The researcher now claims ShieldBreak is a full patch bypass, saying the proof-of-concept was tested on the latest Windows 11 25H2 Canary channel and Windows Server 2025 with a 100% success rate, while Windows 10 and related server editions are also described as vulnerable but not currently supported by the PoC.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that Microsoft shipped patches for 421 security flaws, including 236 in Windows. These fixes include CVE-2026-62832, a Windows User Profile Service privilege escalation issue disclosed by Chaotic Eclipse as LegacyHive, as well as CVE-2026-68820, an actively exploited Windows Ancillary Function Driver for WinSock zero-day that grants SYSTEM privileges. CISA added CVE-2026-68820 to its Known Exploited Vulnerabilities catalog and required federal agencies to apply fixes by August 25, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Chaotic Eclipse released a proof-of-concept for ShieldBreak, a Microsoft Defender for Windows zero-day described as a patch bypass for CVE-2026-50656, also known as RoguePlanet.","RoguePlanet is a race condition that Microsoft described as a privilege escalation issue in the Microsoft Malware Protection Engine and that could allow an attacker to spawn a shell with SYSTEM-level privileges.","Chaotic Eclipse claimed the ShieldBreak proof-of-concept had a 100% success rate on the latest Windows 11 25H2 Canary channel and Windows Server 2025, and said Windows 10 and related server editions are also vulnerable but not currently supported by the PoC.","Microsoft’s August 2026 updates addressed 421 security flaws, including CVE-2026-62832, a Windows User Profile Service privilege escalation vulnerability disclosed by Chaotic Eclipse as LegacyHive.","Microsoft also patched CVE-2026-68820, an actively exploited Windows Ancillary Function Driver for WinSock zero-day that grants SYSTEM privileges, and CISA added it to the Known Exploited Vulnerabilities catalog with a required federal remediation date of August 25, 2026."],"insights":["Microsoft’s prior fix for RoguePlanet is being challenged on two fronts: the researcher first reported an 8-byte data leak after the defense-in-depth updates, and now claims ShieldBreak is a full patch bypass.","The ShieldBreak PoC was claimed to work even on the latest Windows 11 25H2 Canary channel, indicating the researcher says pre-release builds with the newest changes are still affected.","Windows 10 and related server editions are described as vulnerable to ShieldBreak even though the released PoC does not currently support them, so lack of PoC support is not presented as lack of exposure.","The same researcher is tied to multiple recent Windows privilege escalation disclosures in the article, including RoguePlanet, ShieldBreak, and LegacyHive.","CISA’s action applies to CVE-2026-68820, not ShieldBreak, because the article says CVE-2026-68820 is actively exploited while Microsoft had not yet provided a response on ShieldBreak."],"referencedReports":[{"title":"ShieldBreak August 2026 Disclosure","url":"https://blog.projectnightcrawler.dev/posts/2026-08-11-shieldbreak-august-2026-disclosure/","publisher":"Project Nightcrawler / Chaotic Eclipse","context":"The article says Chaotic Eclipse released a proof-of-concept for the ShieldBreak Microsoft Defender zero-day in this disclosure.","category":"research","primary":true},{"title":"Microsoft Security Update Guide: August 2026","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Aug","publisher":"Microsoft Security Response Center","context":"The article references Microsoft’s August 2026 security updates that shipped patches for 421 security flaws.","category":"advisory","primary":false},{"title":"CVE-2026-62832","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-62832","publisher":"Microsoft Security Response Center","context":"The article links Microsoft’s advisory for the Windows User Profile Service privilege escalation vulnerability disclosed as LegacyHive.","category":"advisory","primary":false},{"title":"CVE-2026-68820","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-68820","publisher":"Microsoft Security Response Center","context":"The article links Microsoft’s advisory for an actively exploited Windows Ancillary Function Driver for WinSock zero-day that grants SYSTEM privileges.","category":"advisory","primary":false},{"title":"CVE-2026-72971","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-72971","publisher":"Microsoft Security Response Center","context":"The article links Microsoft’s advisory for a publicly disclosed Windows Container Isolation FS Filter Driver tampering vulnerability.","category":"advisory","primary":false},{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/11/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"Cybersecurity and Infrastructure Security Agency","context":"The article says CISA added CVE-2026-68820 to its Known Exploited Vulnerabilities catalog and required federal agencies to apply fixes by August 25, 2026.","category":"advisory","primary":false}],"body":"\u003cp\u003eSecurity researcher Chaotic Eclipse, also known as INFINITE NIGHTMARE, MSNightmare, and Nightmare-Eclipse, released a proof-of-concept for a new Microsoft zero-day called ShieldBreak. The issue is rooted in Microsoft Defender for Windows and is described as a patch bypass for CVE-2026-50656, also known as RoguePlanet. RoguePlanet was previously described as a race condition that could allow an attacker to spawn a shell with SYSTEM-level privileges and run arbitrary code or perform unauthorized actions.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft patched RoguePlanet almost a month after its June 2026 disclosure, describing it as a privilege escalation issue in the Microsoft Malware Protection Engine, mpengine.dll. Chaotic Eclipse later said Microsoft’s defense-in-depth updates could cause Defender to leak 8 bytes of data in certain scenarios on Windows 11 25H2 and Windows Server 2025. The researcher now claims ShieldBreak is a full patch bypass, saying the proof-of-concept was tested on the latest Windows 11 25H2 Canary channel and Windows Server 2025 with a 100% success rate, while Windows 10 and related server editions are also described as vulnerable but not currently supported by the PoC.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes that Microsoft shipped patches for 421 security flaws, including 236 in Windows. These fixes include CVE-2026-62832, a Windows User Profile Service privilege escalation issue disclosed by Chaotic Eclipse as LegacyHive, as well as CVE-2026-68820, an actively exploited Windows Ancillary Function Driver for WinSock zero-day that grants SYSTEM privileges. CISA added CVE-2026-68820 to its Known Exploited Vulnerabilities catalog and required federal agencies to apply fixes by August 25, 2026.\u003c/p\u003e\n"},{"n":13,"title":"WS-Trust Autologon Endpoint: Password Spray Without Smart Lockout Blocking","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/ws-trust-autologon-endpoint","time":"13:00","priority":"SHOULD READ","score":86,"tldr":"A legacy Microsoft Entra ID WS-Trust autologon endpoint can let attackers password-spray accounts without triggering Smart Lockout or standard sign-in logs, while still revealing when a password is valid even if MFA or Conditional Access blocks access. Defenders should disable WS-Trust/usernamemixed where possible, block legacy authentication, and monitor Unified Audit Log activity for the endpoint.","briefOverview":"\u003cp\u003eThe article describes a legacy Microsoft Entra ID WS-Trust autologon endpoint used by Entra Seamless SSO that can be reached directly from the internet with username and password requests. In testing, this path allowed password spraying without triggering the expected Smart Lockout response and without failed attempts appearing in standard Entra ID sign-in logs. The endpoint also returned AADSTS error codes that could distinguish wrong passwords from valid passwords blocked later by MFA or Conditional Access.\u003c/p\u003e\n\n\u003cp\u003eThe author says this makes the endpoint a quieter and more informative password spray path than normal sign-in flows. Responses such as AADSTS50055, AADSTS50076, and AADSTS53003 indicated that a password was accepted before another control stopped the flow, which can confirm valid credentials even for MFA-protected accounts. The article notes that confirmed passwords can still support follow-on techniques such as adversary-in-the-middle phishing, device code flow abuse, session theft workflows, primary refresh token theft, helpdesk pretexting, and password reuse attacks.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends disabling the usernamemixed endpoint at the tenant level, blocking legacy authentication through Conditional Access, monitoring the Unified Audit Log for requests to autologon.microsoftazuread-sso.com, and moving toward passwordless authentication. It says the main reason to keep the endpoint enabled is support for Office 2013 clients older than the May 2015 update. The research builds on earlier work by Dr. Nestori Syynimaa, Secureworks Counter Threat Unit, and tools such as AADInternals and MSOLSpray, while focusing on current behavior around Smart Lockout, logging, and response leakage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The WS-Trust autologon endpoint used by Entra Seamless SSO accepts direct username and password requests from the internet and returns structured responses about authentication results.","The endpoint can return AADSTS50055, AADSTS50076, and AADSTS53003 responses that indicate a password was accepted before MFA or Conditional Access stopped the sign-in flow.","In testing, more than 1,000 failed attempts against the same account from one unfamiliar IP through the username mixed endpoint did not produce an AADSTS50053 locked-account response or block a later legitimate sign-in.","Failed authentication attempts against the autologon endpoint did not appear in standard Entra ID sign-in logs, although the article says the Unified Audit Log can capture requests to autologon.microsoftazuread-sso.com.","The article recommends disabling the usernamemixed endpoint, blocking legacy authentication through Conditional Access, enabling Unified Audit Log alerts for the autologon endpoint, and moving accounts toward passwordless sign-in."],"insights":["MFA does not eliminate the value of a guessed password in this case, because the endpoint can confirm valid passwords that attackers can later use in phishing, device-code social engineering, session theft workflows, primary refresh token theft, helpdesk pretexting, or password reuse attacks.","The article says the only reason to keep the usernamemixed endpoint enabled is support for Office 2013 clients older than the May 2015 update, making full disablement a practical one-policy fix for most tenants.","The endpoint is especially problematic because it combines several weaknesses at once: internet reachability, missing standard sign-in log visibility, unexpected Smart Lockout behavior, and responses detailed enough to distinguish wrong passwords from valid passwords blocked later.","Blocking legacy authentication through Conditional Access is described as the highest-leverage mitigation because Microsoft’s standard policy template covers WS-Trust as well as ROPC, ActiveSync, and other legacy authentication paths.","The article frames the issue as more than a logging gap, because the same legacy path that reduces defender visibility also changes the outcome of password spraying by making each failed-looking attempt more informative to the attacker."],"referencedReports":[{"title":"Seamless SSO user-enumeration research","url":"https://aadinternals.com/post/desktopsso/","publisher":"Dr. Nestori Syynimaa / AADInternals","context":"The article says Dr. Nestori Syynimaa documented the Entra Seamless SSO user-enumeration angle in 2019 and that this work provided a starting point for the current research.","category":"research","primary":true},{"title":"Undetected Azure Active Directory Brute-Force Attacks","url":"https://www.secureworks.com/research/undetected-azure-active-directory-brute-force-attacks","publisher":"Secureworks Counter Threat Unit","context":"The article says Secureworks Counter Threat Unit documented the autologon logging gap in 2021 and that this prior work helped form the starting point for the current research.","category":"research","primary":true}],"body":"\u003cp\u003eThe article describes a legacy Microsoft Entra ID WS-Trust autologon endpoint used by Entra Seamless SSO that can be reached directly from the internet with username and password requests. In testing, this path allowed password spraying without triggering the expected Smart Lockout response and without failed attempts appearing in standard Entra ID sign-in logs. The endpoint also returned AADSTS error codes that could distinguish wrong passwords from valid passwords blocked later by MFA or Conditional Access.\u003c/p\u003e\n\n\u003cp\u003eThe author says this makes the endpoint a quieter and more informative password spray path than normal sign-in flows. Responses such as AADSTS50055, AADSTS50076, and AADSTS53003 indicated that a password was accepted before another control stopped the flow, which can confirm valid credentials even for MFA-protected accounts. The article notes that confirmed passwords can still support follow-on techniques such as adversary-in-the-middle phishing, device code flow abuse, session theft workflows, primary refresh token theft, helpdesk pretexting, and password reuse attacks.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends disabling the usernamemixed endpoint at the tenant level, blocking legacy authentication through Conditional Access, monitoring the Unified Audit Log for requests to autologon.microsoftazuread-sso.com, and moving toward passwordless authentication. It says the main reason to keep the endpoint enabled is support for Office 2013 clients older than the May 2015 update. The research builds on earlier work by Dr. Nestori Syynimaa, Secureworks Counter Threat Unit, and tools such as AADInternals and MSOLSpray, while focusing on current behavior around Smart Lockout, logging, and response leakage.\u003c/p\u003e\n"},{"n":2,"title":"Plug and Pwn attack uses fake USB devices for Windows SYSTEM access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/plug-and-pwn-attack-uses-fake-usb-devices-for-windows-system-access/","time":"16:05","priority":"SHOULD READ","score":84,"tldr":"Researchers demonstrated “Plug and Pwn” attacks that abuse Windows Plug and Play to make fake USB devices trigger automatic vendor driver/software installs running as SYSTEM, enabling privilege escalation even with no logged-in user. Some variants can also be launched remotely through RDP USB redirection, and mitigations like disabling co-installers help but do not fully remove the attack surface.","briefOverview":"\u003cp\u003eSecurity researchers Alejandro Hernando and Borja Martínez disclosed new “Plug and Pwn” attacks at DEF CON 34 that abuse Windows Plug and Play. The attacks can cause Windows to install signed vendor packages that contain exploitable components or weaknesses and run them as NT AUTHORITY\\SYSTEM. Some demonstrated chains require no user interaction or logged-in user, and one can be performed remotely over RDP without physical USB hardware connected to the target.\u003c/p\u003e\n\n\u003cp\u003eThe researchers used FaceDancer with Cynthion and GreatFET hardware to emulate USB devices and make Windows identify them as specific hardware. In one zero-click physical demonstration, they impersonated Sierra Wireless and Sony FeliCa devices to change DNS settings, redirect unencrypted downloads, place a malicious file on the system, and later load it to open a reverse shell with SYSTEM privileges. They said this worked against a fully updated Windows 11 computer with nobody logged in and took about five minutes.\u003c/p\u003e\n\n\u003cp\u003eThey also demonstrated “NoPlug \u0026amp; Pwn,” which abuses RDP USB redirection by sending fake USB descriptors through a Python RDP client. The remote Windows host treats the descriptors as a legitimate USB device and installs the matching driver and vendor software as SYSTEM, including an Intel RealSense camera package that can be abused through DLL hijacking. The article says setting the DisableCoInstallers registry value can break some demonstrated chains, but Hernando said it does not remove the broader attack surface and recommended pairing it with device installation restrictions or hardware-ID allow-lists and disabling Plug and Play device redirection where it is not needed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researchers Alejandro Hernando and Borja Martínez disclosed “Plug and Pwn” attacks at DEF CON 34 that abuse Windows Plug and Play to install vulnerable or insecure vendor software as NT AUTHORITY\\SYSTEM.","The researchers used FaceDancer with Cynthion and GreatFET hardware to emulate USB devices, causing Windows to recognize fake hardware and install associated vendor driver packages.","A zero-click physical demonstration impersonated Sierra Wireless and Sony FeliCa devices to change DNS settings, redirect unencrypted downloads, place a malicious file on the system, and open a reverse shell with SYSTEM privileges on a fully updated Windows 11 computer with nobody logged in.","The researchers also demonstrated “NoPlug \u0026 Pwn,” which uses RDP USB redirection and a custom Python RDP client to make a remote Windows host treat fake USB descriptors as a legitimate device and install vendor software as SYSTEM.","Setting the DisableCoInstallers registry value can disrupt some demonstrated attacks, including the Sony FeliCa and Intel RealSense RDP chains, but Hernando said it does not stop the broader attack class."],"insights":["Disabling co-installers is only a partial mitigation because Plug and Pwn can still use Plug and Play enumeration, Windows Update driver resolution, driver staging, INF processing, and INF-installed services.","RDP USB redirection expands the risk beyond physical access because a custom RDP client can send fake USB descriptors to a remote Windows host when that feature is enabled.","Composite USB device presentation is important to some attack chains because it causes Windows to load usbccgp.sys and enumerate interfaces separately, making Windows match vendor packages instead of inbox drivers.","The demonstrated chains rely on legitimate signed vendor packages and normal Windows device installation behavior, so the researchers said not all scenarios were reported as standalone vendor vulnerabilities.","For sensitive systems, Hernando recommended combining DisableCoInstallers with device installation restrictions or hardware-ID allow-lists and disabling Plug and Play device redirection on RDP and VDI hosts that do not need it."],"referencedReports":[{"title":"Plug and Pwn","url":"https://plugandpwn.com/","publisher":"Alejandro Hernando and Borja Martínez","context":"The article references the researchers' Plug and Pwn site as the source for details on the physical and RDP-based attack demonstrations.","category":"research","primary":true},{"title":"CVE-2019-10617 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2019-10617","publisher":"National Vulnerability Database","context":"The article links to the NVD entry for CVE-2019-10617 when describing an Atheros driver service vulnerability used in one demonstrated chain.","category":"advisory","primary":false}],"body":"\u003cp\u003eSecurity researchers Alejandro Hernando and Borja Martínez disclosed new “Plug and Pwn” attacks at DEF CON 34 that abuse Windows Plug and Play. The attacks can cause Windows to install signed vendor packages that contain exploitable components or weaknesses and run them as NT AUTHORITY\\SYSTEM. Some demonstrated chains require no user interaction or logged-in user, and one can be performed remotely over RDP without physical USB hardware connected to the target.\u003c/p\u003e\n\n\u003cp\u003eThe researchers used FaceDancer with Cynthion and GreatFET hardware to emulate USB devices and make Windows identify them as specific hardware. In one zero-click physical demonstration, they impersonated Sierra Wireless and Sony FeliCa devices to change DNS settings, redirect unencrypted downloads, place a malicious file on the system, and later load it to open a reverse shell with SYSTEM privileges. They said this worked against a fully updated Windows 11 computer with nobody logged in and took about five minutes.\u003c/p\u003e\n\n\u003cp\u003eThey also demonstrated “NoPlug \u0026amp; Pwn,” which abuses RDP USB redirection by sending fake USB descriptors through a Python RDP client. The remote Windows host treats the descriptors as a legitimate USB device and installs the matching driver and vendor software as SYSTEM, including an Intel RealSense camera package that can be abused through DLL hijacking. The article says setting the DisableCoInstallers registry value can break some demonstrated chains, but Hernando said it does not remove the broader attack surface and recommended pairing it with device installation restrictions or hardware-ID allow-lists and disabling Plug and Play device redirection where it is not needed.\u003c/p\u003e\n"},{"n":4,"title":"Android malware combo takes out loans and relays victims' credit cards","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/android-malware-combo-takes-out-loans-and-relays-victims-credit-cards/","time":"22:22","priority":"SHOULD READ","score":82,"tldr":"Attackers are combining the SpyNote Android RAT with new WindRelay NFC malware to remotely control victims’ phones, take out loans, and relay live payment card data for fraudulent transactions. The attack relies heavily on phone-based social engineering, including convincing victims to sideload an app, grant permissions, tap their card to the phone, and enter their PIN.","briefOverview":"\u003cp\u003eA new Android NFC relay malware called WindRelay is being used together with the SpyNote remote administration tool to steal card data and send it to attackers in real time. In an incident investigated by Group-IB, a fraudster impersonated a bank employee and convinced the victim to sideload SpyNote disguised as a legitimate app. The attacker also had the victim grant Accessibility Service permissions, giving remote access to the Android device.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access through SpyNote, the attacker installed WindRelay without further interaction from the victim and used the banking app to take out a loan in the victim’s name. The victim was then instructed to tap their payment card on the phone and enter their PIN. WindRelay turned the phone into a fraudulent contactless reader and relayed the live NFC exchange, including transaction-specific authentication data, to the attacker’s device for purchases at a genuine payment terminal.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB said the entire activity occurred during a 13-minute phone call, and transactions were approved using the PIN provided by the victim. The researchers said the combination may indicate a toolkit that provides both access to a victim’s device for banking transactions and a direct cash-out channel. Group-IB identified almost two dozen WindRelay samples submitted to VirusTotal between November 2025 and July 2026, with apparent targeting focused on Czechia, Slovakia, and Slovenia.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new Android NFC relay malware called WindRelay is being used with the SpyNote remote administration tool to steal card data and send it to attackers in real time.","In an incident investigated by Group-IB, a fraudster impersonated a bank employee, convinced the victim to sideload SpyNote disguised as a legitimate app, and obtained Accessibility Service permissions for remote access to the Android device.","After gaining remote access, the attacker installed WindRelay, used the victim’s banking app to take out a loan in the victim’s name, and instructed the victim to tap their payment card on the phone and enter their PIN.","Group-IB said the activity occurred during a 13-minute phone call, and the transactions were approved using the PIN provided by the victim.","Group-IB identified almost two dozen WindRelay samples submitted to VirusTotal between November 2025 and July 2026, with targeting appearing focused on Czechia, Slovakia, and Slovenia."],"insights":["The combination of SpyNote and WindRelay gives attackers both remote access to a victim’s banking app and a direct way to cash out through relayed card transactions.","The attack did not require the victim to interact with WindRelay directly after SpyNote was installed, because the attacker used remote access to install WindRelay without further victim interaction.","The fraud succeeded without relying on modern malware features such as live screen sharing or VNC, showing that phone-based social engineering alone was enough to guide the victim through the theft.","Personalizing the malicious app label with the victim’s name was used to make the fake app appear more credible during the social engineering call.","A practical defensive step from the article is to hang up on urgent bank calls and call the official number from the organization’s website before taking any requested action."],"referencedReports":[],"body":"\u003cp\u003eA new Android NFC relay malware called WindRelay is being used together with the SpyNote remote administration tool to steal card data and send it to attackers in real time. In an incident investigated by Group-IB, a fraudster impersonated a bank employee and convinced the victim to sideload SpyNote disguised as a legitimate app. The attacker also had the victim grant Accessibility Service permissions, giving remote access to the Android device.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access through SpyNote, the attacker installed WindRelay without further interaction from the victim and used the banking app to take out a loan in the victim’s name. The victim was then instructed to tap their payment card on the phone and enter their PIN. WindRelay turned the phone into a fraudulent contactless reader and relayed the live NFC exchange, including transaction-specific authentication data, to the attacker’s device for purchases at a genuine payment terminal.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB said the entire activity occurred during a 13-minute phone call, and transactions were approved using the PIN provided by the victim. The researchers said the combination may indicate a toolkit that provides both access to a victim’s device for banking transactions and a direct cash-out channel. Group-IB identified almost two dozen WindRelay samples submitted to VirusTotal between November 2025 and July 2026, with apparent targeting focused on Czechia, Slovakia, and Slovenia.\u003c/p\u003e\n"},{"n":12,"title":"Hundreds of fake Chrome VPN extensions route traffic through a proxy","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hundreds-of-fake-chrome-vpn-extensions-route-traffic-through-a-proxy/","time":"18:54","priority":"SHOULD READ","score":82,"tldr":"Researchers found 737 fake Chrome VPN/proxy extensions impersonating major brands and routing users’ browser traffic through a single operator’s SOCKS5 proxies, potentially exposing destinations, source IPs, and plaintext HTTP data. Google has removed some, but Socket says more than 500 remain available, so users should check for the listed extension IDs and reset Chrome proxy settings if needed.","briefOverview":"\u003cp\u003eMore than 737 browser extensions on the Chrome Web Store impersonated well-known VPN and proxy services while routing users’ traffic through SOCKS5 proxies operated by a single provider. The extensions impersonated brands including Proton VPN, NordVPN, Surfshark, ExpressVPN, and Cloudflare’s 1.1.1.1 DNS resolver. Socket researchers said the campaign used 40 publisher accounts and a shared analytics account.\u003c/p\u003e\n\n\u003cp\u003eThe extensions were downloaded nearly 75,000 times, mainly by Russian users looking for tools to bypass blocked services in the country. Socket said that with all browser traffic forced through the relay, the operator’s server could read every destination, every TLS SNI value, the victim’s source IP, and any request body sent over plain HTTP. Based on strings found in the extensions, the campaign appears to have been an attempt to funnel customers to a subscription-based VPN service in Russia.\u003c/p\u003e\n\n\u003cp\u003eSocket identified several behaviors, including 520 extensions routing all browser traffic through SOCKS5 proxies on port 1082 and 104 extensions resolving proxy hostnames through Cloudflare or Google DNS-over-HTTPS. Some extensions advertised nonexistent premium servers in Japan, Singapore, Canada, Australia, and Turkey for subscription fraud. Google removed more than 200 related extensions, but Socket said over 500 were still available and recommended that users check for the listed extension IDs, remove any matches, and confirm Chrome’s proxy configuration is back to normal.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket researchers found more than 737 Chrome Web Store extensions that impersonated well-known VPN and proxy services while routing users’ traffic through SOCKS5 proxies operated by a single provider.","The extensions impersonated brands including Proton VPN, NordVPN, Surfshark, ExpressVPN, and Cloudflare’s 1.1.1.1 DNS resolver.","The extensions were downloaded nearly 75,000 times, mainly by Russian users looking for tools to bypass blocked services in the country.","Socket identified behaviors including routing all browser traffic through SOCKS5 proxies on port 1082, resolving proxy hostnames through Cloudflare or Google DNS-over-HTTPS, and advertising nonexistent premium server locations for subscription fraud.","Google removed more than 200 related extensions, but Socket said over 500 were still available in the Chrome Web Store and recommended users remove any listed extensions and confirm Chrome’s proxy configuration is normal."],"insights":["The campaign’s scale was obscured by fragmentation across 40 publisher accounts, but Socket linked the extensions through shared infrastructure, including a shared analytics account.","Even though the extensions used a proxy mechanism similar to legitimate services, Socket identified deception indicators such as brand impersonation, nonexistent premium locations, misleading reviewer disclosures, and remote configuration added after approval.","Some extensions used Cloudflare or Google DNS-over-HTTPS to resolve proxy hostnames, which Socket said helped protect the operator’s domain from scrutiny.","Because all browser traffic was forced through the relay, the operator could observe every destination, TLS SNI value, victim source IP, and any request body sent over plain HTTP.","The campaign appears to have targeted demand from Russian users seeking ways around blocked services, while strings in the extensions suggested an attempt to funnel customers to a subscription-based VPN service in Russia."],"referencedReports":[{"title":"Chrome VPN Extension Impersonation","url":"https://socket.dev/blog/chrome-vpn-extension-impersonation","publisher":"Socket","context":"The article cites Socket’s research explaining that the Chrome extensions forced browser traffic through a relay that could expose destinations, TLS SNI values, source IPs, and plaintext HTTP request bodies.","category":"research","primary":true}],"body":"\u003cp\u003eMore than 737 browser extensions on the Chrome Web Store impersonated well-known VPN and proxy services while routing users’ traffic through SOCKS5 proxies operated by a single provider. The extensions impersonated brands including Proton VPN, NordVPN, Surfshark, ExpressVPN, and Cloudflare’s 1.1.1.1 DNS resolver. Socket researchers said the campaign used 40 publisher accounts and a shared analytics account.\u003c/p\u003e\n\n\u003cp\u003eThe extensions were downloaded nearly 75,000 times, mainly by Russian users looking for tools to bypass blocked services in the country. Socket said that with all browser traffic forced through the relay, the operator’s server could read every destination, every TLS SNI value, the victim’s source IP, and any request body sent over plain HTTP. Based on strings found in the extensions, the campaign appears to have been an attempt to funnel customers to a subscription-based VPN service in Russia.\u003c/p\u003e\n\n\u003cp\u003eSocket identified several behaviors, including 520 extensions routing all browser traffic through SOCKS5 proxies on port 1082 and 104 extensions resolving proxy hostnames through Cloudflare or Google DNS-over-HTTPS. Some extensions advertised nonexistent premium servers in Japan, Singapore, Canada, Australia, and Turkey for subscription fraud. Google removed more than 200 related extensions, but Socket said over 500 were still available and recommended that users check for the listed extension IDs, remove any matches, and confirm Chrome’s proxy configuration is back to normal.\u003c/p\u003e\n"},{"n":15,"title":"Three intrusions at UK criminal records office went undetected for two years","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/uk-criminal-records-office-acro-data-breaches","time":"13:00","priority":"SHOULD READ","score":82,"tldr":"The UK’s ACRO Criminal Records Office was reprimanded after three intrusions went undetected for nearly two years due to unpatched Kentico vulnerabilities, ignored antivirus alerts, and unclear security responsibilities. Attackers staged sensitive data on nearly 11,000 people for possible theft, though ACRO could not confirm exfiltration because of insufficient logs.","briefOverview":"\u003cp\u003eBritain’s ACRO Criminal Records Office has been reprimanded by the Information Commissioner’s Office after three intrusions went undetected over nearly two years. The breaches exposed personal data belonging to thousands of people, including victims of domestic violence. ACRO is a national policing unit that handles sensitive data stored on the Police National Computer.\u003c/p\u003e\n\n\u003cp\u003eThe ICO said all three attacks exploited ACRO’s public-facing customer portal, which was built on the Kentico content management system. The system had been running the same version since September 2019 despite multiple known and publicly documented vulnerabilities, and available security fixes had not been applied. ACRO, its managed service provider, and its web development supplier did not know who was responsible for monitoring and applying those patches.\u003c/p\u003e\n\n\u003cp\u003eThe most serious incident involved an attacker maintaining access to ACRO’s website and content management system for about seven months and staging sensitive data of just under 11,000 people for exfiltration. ACRO could not confirm whether that data was actually exfiltrated because it had not retained sufficient logs. The ICO said network segmentation prevented the attacker from moving beyond the compromised web environment into the core policing system, and ACRO has since decommissioned the compromised infrastructure and implemented a new security information and event management system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Information Commissioner’s Office reprimanded ACRO Criminal Records Office after three intrusions between July 2021 and June 2023 exposed personal data belonging to thousands of people, including victims of domestic violence.","All three attacks exploited ACRO’s public-facing customer portal, which used the Kentico content management system and had not received available security fixes since running the same version from September 2019.","Trend Micro security alerts during the attack period, including four detections of attempts to install the Mimikatz credential-harvesting tool, went unread or unhandled because ACRO could not identify a process or responsible roles for reviewing them.","The most serious incident involved an attacker maintaining persistent access to ACRO’s website and content management system for about seven months and staging sensitive data of just under 11,000 people for exfiltration in February 2023.","ACRO notified more than 84,000 people as a precaution in April 2023, and the ICO said network segmentation prevented the attacker from moving beyond the compromised web environment into the core policing system."],"insights":["ACRO’s failures were not limited to missing patches or alerts; the ICO found that ACRO, its managed service provider, and its web development supplier did not know who was responsible for monitoring and applying Kentico security fixes.","The lack of sufficient logging meant ACRO could not confirm whether the staged data of just under 11,000 people was actually exfiltrated, limiting its ability to determine the true impact of the incident.","Security tooling was present and generated relevant warnings, including detections tied to Mimikatz, but those warnings did not reduce the damage because ACRO could not establish a business process for reviewing or escalating them.","The ICO issued only a reprimand with no financial penalty, citing network segmentation that prevented movement from the compromised web environment into the core policing system as a mitigating factor."],"referencedReports":[{"title":"ACRO reprimand notice","url":"https://ico.org.uk/media2/njrjayzm/acro-reprimand-202608.pdf","publisher":"Information Commissioner’s Office","context":"The article cites the ICO reprimand notice as the source for its findings on ACRO’s security shortcomings and the regulator’s censure.","category":"advisory","primary":true}],"body":"\u003cp\u003eBritain’s ACRO Criminal Records Office has been reprimanded by the Information Commissioner’s Office after three intrusions went undetected over nearly two years. The breaches exposed personal data belonging to thousands of people, including victims of domestic violence. ACRO is a national policing unit that handles sensitive data stored on the Police National Computer.\u003c/p\u003e\n\n\u003cp\u003eThe ICO said all three attacks exploited ACRO’s public-facing customer portal, which was built on the Kentico content management system. The system had been running the same version since September 2019 despite multiple known and publicly documented vulnerabilities, and available security fixes had not been applied. ACRO, its managed service provider, and its web development supplier did not know who was responsible for monitoring and applying those patches.\u003c/p\u003e\n\n\u003cp\u003eThe most serious incident involved an attacker maintaining access to ACRO’s website and content management system for about seven months and staging sensitive data of just under 11,000 people for exfiltration. ACRO could not confirm whether that data was actually exfiltrated because it had not retained sufficient logs. The ICO said network segmentation prevented the attacker from moving beyond the compromised web environment into the core policing system, and ACRO has since decommissioned the compromised infrastructure and implemented a new security information and event management system.\u003c/p\u003e\n"},{"n":22,"title":"737 Chrome VPN Extensions Caught Routing Traffic Through Proxies. Check If You Have One","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/737-chrome-vpn-extensions-caught.html","time":"14:09","priority":"SHOULD READ","score":82,"tldr":"Researchers found 737 Chrome VPN/proxy extensions, many impersonating major VPN brands, that routed users’ browser traffic through SOCKS5 proxies controlled by a single operator, exposing browsing destinations and some unencrypted data. Users should check for and remove suspicious or brand-impersonating Chrome VPN extensions.","briefOverview":"\u003cp\u003eA set of 737 free VPN and proxy Chrome extensions was found to mainly target Russian-speaking users seeking access to blocked services. The extensions were published across at least 40 Chrome Web Store developer accounts and had 75,486 installs. Socket reported that 274 of them impersonated 66 established VPN and privacy brands, including Proton VPN, NordVPN, Surfshark, AdGuard VPN, ExpressVPN, Cloudflare’s 1.1.1.1, and Google’s Outline.\u003c/p\u003e\n\n\u003cp\u003eThe extensions routed users’ browser sessions through SOCKS5 proxies, with 520 of 522 in the bulk corpus using the same SOCKS5 infrastructure. Most configured Chrome’s proxy settings to a fixed SOCKS5 server on port 1082, putting the operator in a position to observe browser destinations, source IP addresses, TLS SNI values, and any request body sent over plain HTTP. Each proxy-configuring extension used a bypass list limited to loopback addresses, so other browser requests were funneled through the relay once the user connected.\u003c/p\u003e\n\n\u003cp\u003eThe article says 221 of the add-ons have been removed from the Chrome Web Store, while 516 remained active. Red flags included non-existent paid tiers, fake interfaces, DNS-over-HTTPS blocklist evasion, internal instructions in Russian, comments indicating attempts to evade Chrome Web Store policies, and false statements to reviewers. The article also describes Netskope Threat Labs’ finding that the “AI Sidebar with Deepseek, ChatGPT, Claude, and more.” extension returned with a monetization payload that opens an affiliate link whenever the extension updates or uninstalls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found 737 free VPN and proxy Chrome extensions that mainly targeted Russian-speaking users seeking access to blocked services and routed browser traffic through proxy infrastructure.","The extensions were published across at least 40 Chrome Web Store developer accounts and accumulated 75,486 installs.","Socket reported that 274 of the extensions impersonated 66 established VPN and privacy brands, including Proton VPN, NordVPN, Surfshark, AdGuard VPN, Browsec, ExpressVPN, CyberGhost, Windscribe, TunnelBear, Cloudflare’s 1.1.1.1, and Google’s Outline.","Most of the extensions set Chrome’s proxy settings to a fixed SOCKS5 server on port 1082, allowing the operator to observe browser destinations, source IP addresses, TLS SNI values, and any request body sent over plain HTTP.","Netskope Threat Labs also reported that the Chrome extension “AI Sidebar with Deepseek, ChatGPT, Claude, and more.” returned with a monetization payload that opens an affiliate link every time the extension updates or uninstalls."],"insights":["The main warning sign was not VPN-like behavior itself, since the article says the functionality can resemble a legitimate VPN or proxy service, but the combination of brand impersonation, undisclosed proxy settings, fake premium servers, and false Chrome Web Store review statements.","Many extensions used a bypass list limited only to loopback addresses, meaning nearly every normal browser request would be sent through the proxy once the user connected to the supposed VPN service.","The extensions’ own package contents exposed operational clues, including a Russian taxpayer number, leaked Windows build paths, an internal Russian-language manual, and comments suggesting deliberate attempts to evade Chrome Web Store policies.","Chrome Web Store approval did not guarantee that an extension would remain benign, because the article describes extensions adding a remote-configuration layer or substituting code after approval.","The “AI Sidebar with Deepseek, ChatGPT, Claude, and more.” case shows that even an extension that removes earlier data-theft behavior can later return with a different unwanted payload through an update."],"referencedReports":[{"title":"Chrome VPN Extension Impersonation","url":"https://socket.dev/blog/chrome-vpn-extension-impersonation","publisher":"Socket","context":"The article cites Socket research by Kush Pandya as the source for findings about hundreds of Chrome VPN and proxy extensions impersonating established brands and routing traffic through SOCKS5 proxies.","category":"research","primary":true},{"title":"AI Sidebar Extension Monetizes Its Own Updates","url":"https://www.netskope.com/blog/ai-sidebar-extension-monetizes-its-own-updates","publisher":"Netskope Threat Labs","context":"The article references Netskope Threat Labs’ analysis of the Chrome extension “AI Sidebar with Deepseek, ChatGPT, Claude, and more.” returning with a monetization payload after an earlier removal.","category":"research","primary":false}],"body":"\u003cp\u003eA set of 737 free VPN and proxy Chrome extensions was found to mainly target Russian-speaking users seeking access to blocked services. The extensions were published across at least 40 Chrome Web Store developer accounts and had 75,486 installs. Socket reported that 274 of them impersonated 66 established VPN and privacy brands, including Proton VPN, NordVPN, Surfshark, AdGuard VPN, ExpressVPN, Cloudflare’s 1.1.1.1, and Google’s Outline.\u003c/p\u003e\n\n\u003cp\u003eThe extensions routed users’ browser sessions through SOCKS5 proxies, with 520 of 522 in the bulk corpus using the same SOCKS5 infrastructure. Most configured Chrome’s proxy settings to a fixed SOCKS5 server on port 1082, putting the operator in a position to observe browser destinations, source IP addresses, TLS SNI values, and any request body sent over plain HTTP. Each proxy-configuring extension used a bypass list limited to loopback addresses, so other browser requests were funneled through the relay once the user connected.\u003c/p\u003e\n\n\u003cp\u003eThe article says 221 of the add-ons have been removed from the Chrome Web Store, while 516 remained active. Red flags included non-existent paid tiers, fake interfaces, DNS-over-HTTPS blocklist evasion, internal instructions in Russian, comments indicating attempts to evade Chrome Web Store policies, and false statements to reviewers. The article also describes Netskope Threat Labs’ finding that the “AI Sidebar with Deepseek, ChatGPT, Claude, and more.” extension returned with a monetization payload that opens an affiliate link whenever the extension updates or uninstalls.\u003c/p\u003e\n"},{"n":27,"title":"OpenAI, Anthropic, Google API Flaw Let Weaker AI Models Decode Stronger Models' Reasoning","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/openai-anthropic-google-api-flaw-let.html","time":"11:47","priority":"SHOULD READ","score":82,"tldr":"Researchers found that encrypted reasoning blocks in OpenAI, Anthropic, and Google APIs could be replayed across sessions and decoded by compatible weaker models, exposing hidden reasoning and secrets from published agent logs. The providers reportedly mitigated the demonstrated attacks, but developers should strip opaque reasoning fields before sharing or committing API traces.","briefOverview":"\u003cp\u003eResearchers disclosed a flaw in how OpenAI, Anthropic, and Google carried hidden AI reasoning between API calls. The weakness affected encrypted reasoning objects used by reasoning APIs, where a block created in one session could be replayed into another and, in testing, handed to a weaker model in the same provider family to reveal hidden content. The encryption itself was not cracked, and the attack relied on intact opaque blocks being accepted and processed by the provider.\u003c/p\u003e\n\n\u003cp\u003eThe team behind the paper “Stealing Reasoning Traces from Proprietary LLM APIs” demonstrated abuse paths including stealing proprietary reasoning for model distillation, extracting private data from published traces, recovering harmful content concealed behind safe visible answers, and hiding prompt injections inside opaque reasoning blocks. Across 6,708 public agent trajectories, the team decoded 315,320 thinking blocks and counted 704 distinct privacy artifacts from genuine user sessions after excluding benchmark sources. These included 62 API keys, 33 passwords, 24 access tokens, and seven private keys.\u003c/p\u003e\n\n\u003cp\u003eThe cross-user attack required obtaining an encrypted reasoning block, such as one published in an agent log, and API access to a compatible model from the same provider; it did not provide arbitrary access to private chats. The researchers disclosed the findings to affected model providers, Microsoft, and Hugging Face, and said the demonstrated attacks stopped working after mitigations, with the main extraction attack no longer reproducible as of August 2026. The article advises developers to strip reasoning blocks and opaque reasoning fields from shared traces and avoid committing raw API transcripts even when visible text has been sanitized.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers disclosed a flaw in how OpenAI, Anthropic, and Google carried hidden AI reasoning between API calls, allowing internal reasoning and secrets from session logs to be recovered without cracking the encryption.","The attack required obtaining an encrypted reasoning block, such as one published in an agent log, and API access to a compatible model from the same provider, rather than providing arbitrary access to private chats.","Across 6,708 public agent trajectories, the researchers decoded 315,320 thinking blocks and counted 704 distinct privacy artifacts from genuine user sessions after excluding benchmark sources.","The recovered artifacts included 62 API keys, 33 passwords, 24 access tokens, and seven private keys, with 64 artifacts appearing only in hidden reasoning and not in the visible trace.","The researchers disclosed the findings to affected providers and others, and said the demonstrated attacks stopped working after mitigations, with the main extraction attack no longer reproducible as of August 2026."],"insights":["Sanitizing only the visible text of shared API transcripts was insufficient, because 64 recovered secrets appeared only inside hidden reasoning blocks and nowhere in the readable conversation.","The weakness was not a cryptographic break; it came from providers accepting intact opaque reasoning objects across sessions, users, and models.","Published agent logs were the central real-world exposure point, meaning the risk was concentrated among developers who shared raw traces with reasoning objects still attached rather than all API users equally.","The same portability that enabled secret recovery also allowed an invisible prompt-injection proof of concept, where a malicious instruction was hidden in an opaque reasoning block and later affected an unrelated task.","The public record leaves unresolved whether already-published reasoning blocks remain decodable, even though the researchers say fresh versions of the demonstrated attacks no longer work."],"referencedReports":[{"title":"Stealing Reasoning Traces from Proprietary LLM APIs","url":"https://arxiv.org/abs/2608.09867","publisher":"arxiv","context":"The article centers on this paper, which demonstrated methods for recovering hidden reasoning and secrets from proprietary LLM API reasoning objects.","category":"research","primary":true},{"title":"Fooling Around with Encrypted Reasoning Blobs","url":"https://blog.cryptographyengineering.com/2026/05/29/fooling-around-with-encrypted-reasoning-blobs/","publisher":"matthew-green","context":"The article says the new work builds on May research by Johns Hopkins cryptographer Matthew Green about replaying encrypted reasoning blocks across sessions and accounts.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers disclosed a flaw in how OpenAI, Anthropic, and Google carried hidden AI reasoning between API calls. The weakness affected encrypted reasoning objects used by reasoning APIs, where a block created in one session could be replayed into another and, in testing, handed to a weaker model in the same provider family to reveal hidden content. The encryption itself was not cracked, and the attack relied on intact opaque blocks being accepted and processed by the provider.\u003c/p\u003e\n\n\u003cp\u003eThe team behind the paper “Stealing Reasoning Traces from Proprietary LLM APIs” demonstrated abuse paths including stealing proprietary reasoning for model distillation, extracting private data from published traces, recovering harmful content concealed behind safe visible answers, and hiding prompt injections inside opaque reasoning blocks. Across 6,708 public agent trajectories, the team decoded 315,320 thinking blocks and counted 704 distinct privacy artifacts from genuine user sessions after excluding benchmark sources. These included 62 API keys, 33 passwords, 24 access tokens, and seven private keys.\u003c/p\u003e\n\n\u003cp\u003eThe cross-user attack required obtaining an encrypted reasoning block, such as one published in an agent log, and API access to a compatible model from the same provider; it did not provide arbitrary access to private chats. The researchers disclosed the findings to affected model providers, Microsoft, and Hugging Face, and said the demonstrated attacks stopped working after mitigations, with the main extraction attack no longer reproducible as of August 2026. The article advises developers to strip reasoning blocks and opaque reasoning fields from shared traces and avoid committing raw API transcripts even when visible text has been sanitized.\u003c/p\u003e\n"},{"n":36,"title":"Emerging Threat: (CVE-2026-72766) n8n Arbitrary File Read and SSRF via Send Email Node","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-72766-n8n-arbitrary-file-read-and-ssrf-via-send-email-node/","time":"08:41","priority":"SHOULD READ","score":82,"tldr":"CVE-2026-72766 is a high-severity n8n Send Email node flaw that can let attackers read local files or perform SSRF when exposed unauthenticated webhooks pass untrusted input into email body fields. Organizations should upgrade to fixed n8n versions and audit externally reachable instances and workflows.","briefOverview":"\u003cp\u003eCVE-2026-72766 is a high-severity type confusion vulnerability in the Send Email node of n8n, an open-source workflow automation platform. The node does not enforce that message fields contain string values, allowing a non-string value from a workflow expression to reach Nodemailer. Nodemailer can then interpret the value as a file path or URL rather than message text. The issue has a CVSS v3.1 score of 7.5 and a CVSS v4.0 score of 8.2.\u003c/p\u003e\n\n\u003cp\u003eExploitation does not require authentication to the n8n instance itself, but the article states that three configuration conditions must already exist. An active workflow must expose an unauthenticated webhook, valid SMTP credentials must be configured on the Send Email node, and untrusted input must be mapped directly into the \u003ccode\u003etext\u003c/code\u003e or \u003ccode\u003ehtml\u003c/code\u003e body field. Where those conditions are met, an attacker who can reach the webhook can cause disclosure of local files on the n8n host and server-side request forgery from inside the network segment where n8n runs. The article notes that n8n instances often hold configuration files, environment variables, and stored credentials for systems they automate.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects n8n versions before 1.123.67, 2.x versions before 2.31.5, and 2.32.x versions before 2.32.1. Patches are available in versions 1.123.67, 2.31.5, and 2.32.1, and organizations are advised to upgrade to the fixed release matching their current branch. The article also recommends inventorying externally reachable n8n instances, auditing workflows for Send Email nodes fed by webhook data, restricting public webhook access, limiting workflow creation and editing permissions, monitoring outbound connections, and rotating SMTP credentials on externally reachable instances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-72766 is a type confusion vulnerability in the n8n Send Email node that can cause Nodemailer to interpret non-string workflow expression values as a file path or URL instead of message text.","Exploitation requires an active unauthenticated webhook, valid SMTP credentials configured on the Send Email node, and untrusted input mapped directly into the text or html body field.","If exploited, the vulnerability can disclose local files on the n8n host and enable server-side request forgery from inside the network segment where n8n runs.","The vulnerability affects n8n versions before 1.123.67, 2.x versions before 2.31.5, and 2.32.x versions before 2.32.1.","n8n patched the issue in versions 1.123.67, 2.31.5, and 2.32.1, and defenders are advised to inventory externally reachable n8n instances, audit workflows, restrict public webhook access, monitor outbound connections, and rotate SMTP credentials where needed."],"insights":["The article emphasizes that the highest-risk n8n instances are often created for experiments, proofs of concept, or departmental workflows because they are more likely to expose unauthenticated webhooks and less likely to be patched.","The practical impact of the file-read issue is amplified because n8n commonly stores configuration files, environment variables, and credentials for the many systems it automates.","The exposure pattern is described as a visibility and ownership problem rather than an industry-specific problem, with affected-looking assets appearing under subsidiary domains, single-project cloud accounts, and inconsistent hostnames.","The article notes that recently published CVE coverage may vary across vulnerability databases, so defenders should verify n8n versions directly against the vendor advisory instead of relying only on scanner results.","Remediation requires matching the correct fixed release line, because organizations running n8n 2.31.x are advised to move to 2.31.5 rather than simply jumping to a 2.32.x release."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-72766 is a high-severity type confusion vulnerability in the Send Email node of n8n, an open-source workflow automation platform. The node does not enforce that message fields contain string values, allowing a non-string value from a workflow expression to reach Nodemailer. Nodemailer can then interpret the value as a file path or URL rather than message text. The issue has a CVSS v3.1 score of 7.5 and a CVSS v4.0 score of 8.2.\u003c/p\u003e\n\n\u003cp\u003eExploitation does not require authentication to the n8n instance itself, but the article states that three configuration conditions must already exist. An active workflow must expose an unauthenticated webhook, valid SMTP credentials must be configured on the Send Email node, and untrusted input must be mapped directly into the \u003ccode\u003etext\u003c/code\u003e or \u003ccode\u003ehtml\u003c/code\u003e body field. Where those conditions are met, an attacker who can reach the webhook can cause disclosure of local files on the n8n host and server-side request forgery from inside the network segment where n8n runs. The article notes that n8n instances often hold configuration files, environment variables, and stored credentials for systems they automate.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects n8n versions before 1.123.67, 2.x versions before 2.31.5, and 2.32.x versions before 2.32.1. Patches are available in versions 1.123.67, 2.31.5, and 2.32.1, and organizations are advised to upgrade to the fixed release matching their current branch. The article also recommends inventorying externally reachable n8n instances, auditing workflows for Send Email nodes fed by webhook data, restricting public webhook access, limiting workflow creation and editing permissions, monitoring outbound connections, and rotating SMTP credentials on externally reachable instances.\u003c/p\u003e\n"},{"n":1,"title":"Google says Chrome cuts 7 billion unwanted Android notifications a day to fight abuse","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-says-chrome-cuts-7-billion-unwanted-android-notifications-a-day-to-fight-abuse/","time":"01:15","priority":"SHOULD READ","score":78,"tldr":"Google says Chrome’s la
