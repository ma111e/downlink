<script type="application/json" id="dl-articles">[{"n":2,"title":"The invisible passenger in your car","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/android-head-unit-malware/121106/","time":"08:00","priority":"MUST READ","score":92,"tldr":"Kaspersky found Android malware being delivered through the legitimate update mechanism of DoFun automotive head units, turning car infotainment systems into ad-fraud and proxy-botnet nodes. The campaign is attributed with high confidence to MoYu Group, a BADBOX-linked threat actor.","briefOverview":"\u003cp\u003eKaspersky discovered a new Android malware in June 2026 that installed like an ordinary user app but had no user interface. The malware was a multi-stage downloader used for ad fraud and for creating a proxy botnet. It spread through the built-in updaters of Android-based automotive head unit firmware, which the article describes as the first documented malware case on a car head unit with an infection chain specific to that type of device.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain involved TWCore, a legitimate system application responsible for analytics collection and head unit software updates. TWCore received update instructions through an MQTT message broker on a cardoor.cn subdomain, and its update logic included an installNotExists flag that allowed apps not originally present on the device to be installed. Kaspersky telemetry showed previously unknown malware at TWCore download paths and indicated that the malware was installed by the com.tw.core package.\u003c/p\u003e\n\n\u003cp\u003eThe first stage, JarService, decrypted embedded data and loaded a second-stage malicious loader, which contacted attacker servers to download a third-stage payload. The third stage could retrieve commands, update its configuration, display ads, perform ad fraud, and download additional code, including the zhima reverse proxy module. Kaspersky attributed the activity with high confidence to MoYu Group, an actor linked to the BADBOX botnet, based on naming patterns and infrastructure overlap.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky discovered a new Android multi-stage downloader in June 2026 whose ultimate purpose is ad fraud and creation of a proxy botnet.","The malware spread through the built-in updaters of Android-based automotive head unit firmware, using the legitimate TWCore system application to install APK files on affected devices.","The first-stage JarService dropper had no user interface and decrypted embedded data to load a second-stage malicious loader, which then contacted attacker servers to download a third-stage payload.","The third-stage payload could receive commands to make HTTP requests, open links in WebView, execute JavaScript, download additional code, and load the zhima reverse proxy module.","Kaspersky attributed the activity with high confidence to MoYu Group, an actor linked to the BADBOX botnet, based on naming patterns and infrastructure overlap."],"insights":["The TWCore updater’s `installNotExists` flag allowed apps that were not originally present on the head unit to be installed, making legitimate update functionality a direct distribution path for malware.","JarService’s lack of any user interface was itself a clue that the app was likely being installed without user awareness rather than through normal user-driven installation.","The attackers used only a small subset of the third-stage malware’s available commands in observed attacks, mainly `loadlib2` and `http`, despite the malware supporting broader capabilities such as WebView-based JavaScript execution and clipboard manipulation.","Version numbers embedded in payload download links allowed researchers to retrieve multiple historical variants of both the stage 3 payload and the zhima module.","The zhima infrastructure overlapped with residential proxy service branding and authentication patterns, including `admin.*` login pages and `/proxy/u/login` paths, which the researchers used as supporting evidence linking the services to MoYu Group."],"referencedReports":[{"title":"IPMoYu report","url":"https://github.com/deepfield/public-research/blob/main/ipmoyu/report.md","publisher":"Nokia Deepfield Emergency Response Team","context":"The article says Nokia Deepfield researchers independently discovered the zhima reverse proxy module in TV set-top boxes and described it in their report.","category":"research","primary":false},{"title":"Satori Threat Intelligence Disruption: BADBOX 2.0","url":"https://www.humansecurity.com/learn/blog/satori-threat-intelligence-disruption-badbox-2-0/","publisher":"HUMAN","context":"The article cites HUMAN researchers as having described MoYu Group as one of the actors linked to the BADBOX malware platform.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky discovered a new Android malware in June 2026 that installed like an ordinary user app but had no user interface. The malware was a multi-stage downloader used for ad fraud and for creating a proxy botnet. It spread through the built-in updaters of Android-based automotive head unit firmware, which the article describes as the first documented malware case on a car head unit with an infection chain specific to that type of device.\u003c/p\u003e\n\n\u003cp\u003eThe infection chain involved TWCore, a legitimate system application responsible for analytics collection and head unit software updates. TWCore received update instructions through an MQTT message broker on a cardoor.cn subdomain, and its update logic included an installNotExists flag that allowed apps not originally present on the device to be installed. Kaspersky telemetry showed previously unknown malware at TWCore download paths and indicated that the malware was installed by the com.tw.core package.\u003c/p\u003e\n\n\u003cp\u003eThe first stage, JarService, decrypted embedded data and loaded a second-stage malicious loader, which contacted attacker servers to download a third-stage payload. The third stage could retrieve commands, update its configuration, display ads, perform ad fraud, and download additional code, including the zhima reverse proxy module. Kaspersky attributed the activity with high confidence to MoYu Group, an actor linked to the BADBOX botnet, based on naming patterns and infrastructure overlap.\u003c/p\u003e\n"},{"n":1,"title":"We burned 11.7bn tokens to find the best cyber AI model","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/ai-model-benchmarks-aug-21-2026","time":"09:06","priority":"MAY READ","score":72,"tldr":"Aikido benchmarked 10 AI models on rediscovering 32 fresh vulnerabilities and found that repeated runs of cheaper open-weight models, especially DeepSeek V4 Pro, achieved the best recall. The key trade-off is that these models found more bugs for less money but generated more false leads, making strong harnessing and triage essential.","briefOverview":"\u003cp\u003eAikido benchmarked the cybersecurity capabilities of 10 AI models by asking them to rediscover 32 recently disclosed vulnerabilities from source code. Each model ran the full dataset three times, for 96 runs per model, with a 30-turn maximum and no internet access. The benchmark used fresh vulnerabilities to reduce the chance that models were relying on memorized write-ups or patches.\u003c/p\u003e\n\n\u003cp\u003eDeepSeek V4 Pro 0813 had the highest pooled recall, finding 28 of 32 vulnerabilities across three runs, while Grok 4.6 was the most consistent, finding 21 CVEs in all three runs. The article emphasizes that repeated runs improved coverage because different runs often explored different useful paths. For example, DeepSeek Pro found 17 vulnerabilities on its first pass but reached 28 when three runs were pooled.\u003c/p\u003e\n\n\u003cp\u003eThe benchmark found that open-weight models could match or beat public closed frontier models in pooled recall when used with the right harness. DeepSeek Pro, Qwen, Kimi, and GLM-5.3 showed strong results, but open models also produced more false leads that the pipeline had to reject. The article concludes that the best choice depends on how a model fits into a system, balancing cost, recall, consistency, precision, and later triage work.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido benchmarked 10 AI models on 32 recently disclosed vulnerabilities, running each model across the full dataset three times without internet access.","DeepSeek V4 Pro 0813 achieved the highest pooled recall, finding 28 of 32 vulnerabilities across three runs.","Pooling repeated runs improved coverage for several models, with DeepSeek Pro rising from 17 vulnerabilities in its first pass to 28 across three, Qwen from 19 to 26, Kimi from 17 to 25, and Grok from 24 to 26.","Grok 4.6 was the most consistent model tested, finding 21 vulnerabilities in all three runs, while Opus 5 and GPT Sol each consistently found 19.","The article says cheaper open models can match or beat public closed frontier models in pooled recall, but they also produced more false leads that the pipeline had to reject."],"insights":["For vulnerability discovery, model output variance can be useful rather than harmful because separate runs explore different paths and their findings can be pooled for higher coverage.","The benchmark suggests that repeating cheaper models can deliver more vulnerability coverage than a single expensive model run, but the savings shift work to later triage because cheaper open models produced more false leads.","High pooled recall and high consistency did not always come together: DeepSeek V4 Pro found the most vulnerabilities overall, while Grok found fewer but repeated its findings more reliably across runs.","Qwen’s tendency to revisit older patched CVEs from memory often wasted investigation budget, but the article says it sometimes acted like autonomous variant analysis and still helped Qwen reach strong pooled recall.","GLM-5.3 improved from its preview checkpoint by using more turns and exploring more deeply, raising both recall and consistency while remaining much cheaper than several closed frontier models."],"referencedReports":[],"body":"\u003cp\u003eAikido benchmarked the cybersecurity capabilities of 10 AI models by asking them to rediscover 32 recently disclosed vulnerabilities from source code. Each model ran the full dataset three times, for 96 runs per model, with a 30-turn maximum and no internet access. The benchmark used fresh vulnerabilities to reduce the chance that models were relying on memorized write-ups or patches.\u003c/p\u003e\n\n\u003cp\u003eDeepSeek V4 Pro 0813 had the highest pooled recall, finding 28 of 32 vulnerabilities across three runs, while Grok 4.6 was the most consistent, finding 21 CVEs in all three runs. The article emphasizes that repeated runs improved coverage because different runs often explored different useful paths. For example, DeepSeek Pro found 17 vulnerabilities on its first pass but reached 28 when three runs were pooled.\u003c/p\u003e\n\n\u003cp\u003eThe benchmark found that open-weight models could match or beat public closed frontier models in pooled recall when used with the right harness. DeepSeek Pro, Qwen, Kimi, and GLM-5.3 showed strong results, but open models also produced more false leads that the pipeline had to reject. The article concludes that the best choice depends on how a model fits into a system, balancing cost, recall, consistency, precision, and later triage work.\u003c/p\u003e\n"},{"n":3,"title":"Endpoint Blind Spots: The 5 Places Ransomware Hides Before It Detonates","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/ransomware-attack-vectors-endpoint-blind-spots/","time":"07:51","priority":"MAY READ","score":45,"tldr":"Ransomware often hides in endpoint blind spots such as remote access tools, stolen credentials, vendor connections, OT systems, and compromised business email before encryption begins. Organizations should focus on early detection with MFA, least privilege, segmentation, patching, backups, and broad endpoint monitoring.","briefOverview":"\u003cp\u003eThe article explains that ransomware activity often begins before encryption, extortion, or data theft, during a pre-execution phase where attackers establish access, steal credentials, move laterally, and identify valuable systems. It highlights five endpoint blind spots where this activity can remain hidden: remote access tools, compromised endpoints and credential stores, vendor connections, operational technology, and phishing or business email accounts. These areas matter because malicious activity can resemble legitimate administration, especially when attackers use valid credentials or trusted tools.\u003c/p\u003e\n\n\u003cp\u003eRemote access tools such as WinSCP, AnyDesk, and ScreenConnect have been abused by Qilin affiliates to support lateral movement, while credential-harvesting techniques associated with NirSoft and Mimikatz can help attackers expand access from a compromised workstation. Vendor and supply chain connections can also become ransomware entry points through shared credentials, remote connections, vulnerable integrations, or compromised software updates. In manufacturing environments, operational technology and industrial control systems may be difficult to patch, and attacks can disrupt production systems while also exposing intellectual property such as product designs, supplier contracts, and pricing information.\u003c/p\u003e\n\n\u003cp\u003eThe article says ransomware-as-a-service has increased the danger of these blind spots, citing Cyble’s identification of 57 new ransomware groups, 27 new extortion groups, and more than 350 new ransomware strains in 2025. It also states that global ransomware incidents rose 86% between January and April 2025, with Cl0P accounting for 28% of activity during that period. Recommended defenses include MFA, patching, least-privilege access, network segmentation, tested backups, endpoint detection and response, and continuous monitoring for unusual authentication, account behavior, processes, and credential access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ransomware attackers often spend time before encryption establishing access, stealing credentials, moving laterally, and identifying valuable systems.","Legitimate remote access tools such as WinSCP, AnyDesk, and ScreenConnect have been abused by Qilin affiliates to facilitate lateral movement.","Compromised endpoints can expose credential stores, and ransomware operators have used credential-harvesting techniques associated with tools such as NirSoft and Mimikatz.","Vendor connections and supply chain access can let attackers compromise a smaller vendor and use a trusted relationship to reach a larger target.","Operational technology and industrial control systems in manufacturing environments can be difficult to patch and may create endpoint security blind spots."],"insights":["Ransomware evasion is not limited to bypassing antivirus because attackers can use valid credentials and legitimate remote-access software that resembles normal administrative activity.","Monitoring only servers can leave a major gap because employee workstations may be the starting point for credential theft and movement toward backups, servers, and privileged accounts.","Vendor access should be treated as a recurring risk rather than a one-time setup because shared credentials, remote connections, integrations, and software updates can all become entry paths.","Manufacturing environments need security controls that account for uptime constraints because OT and ICS systems often cannot be patched as easily as conventional computers.","Business email compromise can support ransomware preparation because attackers may quietly monitor legitimate conversations after stealing credentials before attempting fraud or further access."],"referencedReports":[],"body":"\u003cp\u003eThe article explains that ransomware activity often begins before encryption, extortion, or data theft, during a pre-execution phase where attackers establish access, steal credentials, move laterally, and identify valuable systems. It highlights five endpoint blind spots where this activity can remain hidden: remote access tools, compromised endpoints and credential stores, vendor connections, operational technology, and phishing or business email accounts. These areas matter because malicious activity can resemble legitimate administration, especially when attackers use valid credentials or trusted tools.\u003c/p\u003e\n\n\u003cp\u003eRemote access tools such as WinSCP, AnyDesk, and ScreenConnect have been abused by Qilin affiliates to support lateral movement, while credential-harvesting techniques associated with NirSoft and Mimikatz can help attackers expand access from a compromised workstation. Vendor and supply chain connections can also become ransomware entry points through shared credentials, remote connections, vulnerable integrations, or compromised software updates. In manufacturing environments, operational technology and industrial control systems may be difficult to patch, and attacks can disrupt production systems while also exposing intellectual property such as product designs, supplier contracts, and pricing information.\u003c/p\u003e\n\n\u003cp\u003eThe article says ransomware-as-a-service has increased the danger of these blind spots, citing Cyble’s identification of 57 new ransomware groups, 27 new extortion groups, and more than 350 new ransomware strains in 2025. It also states that global ransomware incidents rose 86% between January and April 2025, with Cl0P accounting for 28% of activity during that period. Recommended defenses include MFA, patching, least-privilege access, network segmentation, tested backups, endpoint detection and response, and continuous monitoring for unusual authentication, account behavior, processes, and credential access.\u003c/p\u003e\n"}]</script>
