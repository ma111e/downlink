<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA Warns of Active Exploitation of OpenSSH, GPUStack, FreeSWITCH, and IBM Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisa-warns-of-active-exploitation-of.html","time":"06:31","priority":"MUST READ","score":96,"tldr":"CISA added critical flaws in OpenSSH, GPUStack, FreeSWITCH, and IBM Aspera Faspex to its KEV catalog after evidence of active exploitation. Organizations should urgently apply available patches, particularly for OpenSSH’s SSHole authentication-bypass flaw, which attackers are using for reconnaissance, persistence, botnet activity, and cryptomining.","briefOverview":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting IBM Aspera Faspex, SignalWire FreeSWITCH, OpenBSD OpenSSH, and GPUStack to its Known Exploited Vulnerabilities catalog. The flaws include authorization bypass, code injection, authentication bypass, and improper authentication issues, with CVSS scores ranging from 8.1 to 9.8. U.S. Federal Civilian Executive Branch agencies are recommended to apply fixes by November 12, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe OpenSSH issue, CVE-2026-123158 or SSHole, has faced exploitation attempts since November 6, 2026, and GreyNoise identified confirmed post-exploitation activity from six source IP addresses across 18 attack chains. Observed activity included reconnaissance, cloud metadata queries, attempts to obtain password hashes and root SSH keys, and changes to SSH authorized_keys files for persistent access. Attackers were also seen deploying TAC Agent, while watchTowr reported the flaw being used for botnet and cryptocurrency-mining activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added four actively exploited vulnerabilities affecting IBM Aspera Faspex, SignalWire FreeSWITCH, OpenBSD OpenSSH, and GPUStack to its Known Exploited Vulnerabilities catalog.","The OpenSSH flaw, CVE-2026-123158 or SSHole, is an authentication-bypass issue on Linux that was fixed in November 2026 and has faced exploitation attempts since November 6, 2026.","GreyNoise reported confirmed post-exploitation activity from six source IP addresses involving reconnaissance, cloud metadata queries, attempts to read password hashes and root SSH keys, and modification of SSH authorized_keys files.","Attackers were observed deploying TAC Agent, a Python-based remote-control tool that can execute shell commands, perform system reconnaissance, enumerate directories, transfer files, and update itself.","Federal Civilian Executive Branch agencies are recommended to apply fixes for the four vulnerabilities by November 12, 2026."],"insights":["The OpenSSH SSHole flaw was added to CISA’s catalog shortly after exploitation attempts began, with the article reporting activity from November 6 and a first GreyNoise honeypot observation on November 7.","Although Defused Cyber described SSHole activity as limited rather than widespread, GreyNoise had already confirmed 18 distinct post-exploitation attack chains from six source IP addresses.","Observed SSHole activity progressed beyond attempted access to persistence and credential collection, including changes to SSH authorized_keys files and attempts to obtain password hashes and root SSH keys.","GPUStack’s flaw can expose worker and cloud-provider secrets while also allowing persistent administrator API-key creation and code execution, creating several forms of lasting control from one issue.","The article reports active exploitation of all four flaws but provides public exploitation details only for OpenSSH and GPUStack, leaving the methods and scale affecting IBM Aspera Faspex and FreeSWITCH unknown."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/09/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA's alert announced the addition of four actively exploited flaws to its Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"GHSA-gj9m-f8ph-pmhr","url":"https://github.com/gpustack/gpustack/security/advisories/GHSA-gj9m-f8ph-pmhr","publisher":"gpustack","context":"GPUStack's advisory describes CVE-2026-102895 and notes that active in-the-wild exploitation was reported.","category":"advisory","primary":false}],"body":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting IBM Aspera Faspex, SignalWire FreeSWITCH, OpenBSD OpenSSH, and GPUStack to its Known Exploited Vulnerabilities catalog. The flaws include authorization bypass, code injection, authentication bypass, and improper authentication issues, with CVSS scores ranging from 8.1 to 9.8. U.S. Federal Civilian Executive Branch agencies are recommended to apply fixes by November 12, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe OpenSSH issue, CVE-2026-123158 or SSHole, has faced exploitation attempts since November 6, 2026, and GreyNoise identified confirmed post-exploitation activity from six source IP addresses across 18 attack chains. Observed activity included reconnaissance, cloud metadata queries, attempts to obtain password hashes and root SSH keys, and changes to SSH authorized_keys files for persistent access. Attackers were also seen deploying TAC Agent, while watchTowr reported the flaw being used for botnet and cryptocurrency-mining activity.\u003c/p\u003e\n"}]</script>
