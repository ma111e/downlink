<script type="application/json" id="dl-articles">[{"n":1,"title":"New RefluXFS Linux flaw lets attackers gain root privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/linux/new-refluxfs-linux-flaw-lets-attackers-gain-root-privileges/","time":"11:40","priority":"MUST READ","score":93,"tldr":"A nine-year-old Linux XFS filesystem flaw dubbed RefluXFS lets local attackers reliably overwrite protected files and gain root privileges on many major distributions. Organizations should apply vendor-fixed kernels and reboot, as there are no practical mitigations.","briefOverview":"\u003cp\u003eA nine-year-old race condition vulnerability in the Linux kernel\u0026rsquo;s XFS filesystem, tracked as CVE-2026-64600 and dubbed RefluXFS, allows local attackers to overwrite protected files and gain root privileges. Qualys Threat Research Unit found and reported the flaw, which affects systems using XFS with reflink enabled, running Linux kernel v4.11 or later, with a directory writable by an unprivileged local user and a high-value root-owned target file or SUID-root binary. Qualys estimates the issue could potentially affect more than 16.4 million systems based on analysis using its Cybersecurity Asset Management software.\u003c/p\u003e\n\n\u003cp\u003eQualys said attackers can reflink-clone a target file such as /etc/passwd or a SUID-root binary into a scratch file they own, then race concurrent O_DIRECT writes on that scratch file. A lock-drop window in the kernel\u0026rsquo;s copy-on-write allocation path can cause one write to land in the physical block still backing the original protected file. The change is made directly on disk, persists across reboot, produces no kernel log output, and does not touch the target file\u0026rsquo;s inode, so a modified SUID-root binary keeps its SUID bit.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability has existed since kernel version 4.11 after a February 2017 commit and was patched on July 16 after a fix was merged into the Linux kernel source tree. Affected distributions listed in the article include Red Hat Enterprise Linux, Oracle Linux, Amazon Linux, Fedora, CentOS Stream, Rocky Linux, AlmaLinux, and CloudLinux. Qualys said standard protections including SELinux, kernel lockdown, container isolation mechanisms, KASLR, SMEP, and SMAP do not block the attack, and recommended immediate kernel patching and a reboot because there are no reliable or practical mitigations or temporary configuration changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-64600, dubbed RefluXFS by the Qualys Threat Research Unit, is a nine-year-old race condition in the Linux kernel's XFS filesystem that allows local attackers to overwrite protected files and gain root privileges.","The flaw affects systems using XFS with reflink enabled, running Linux kernel version 4.11 or later, with a directory writable by an unprivileged local user and a high-value root-owned target file or SUID-root binary.","Qualys said standard defenses such as SELinux, kernel lockdown, container isolation mechanisms, KASLR, SMEP, and SMAP do not block RefluXFS attacks because the flaw operates at the filesystem allocation layer.","RefluXFS has existed since a February 2017 kernel commit and was patched on July 16 after a fix was merged into the Linux kernel source tree.","Qualys recommended immediate kernel patching and a reboot, stating that vendor-fixed kernels are available and that there are no reliable or practical mitigations or temporary configuration changes."],"insights":["RefluXFS can modify the physical disk blocks backing a protected file without touching that file's inode, which means a changed SUID-root binary can keep its SUID bit.","Qualys said exploitation leaves no kernel log output and survives reboot, making successful attacks harder to notice through ordinary system logging or by simply restarting the system.","The vulnerability affects default XFS reflink configurations on major enterprise Linux distributions, increasing the urgency for organizations using standard deployments rather than only unusual setups.","Qualys said the flaw was identified during a research effort that integrated Anthropic's Claude Mythos Preview into a manual audit workflow, with researchers later reproducing and independently verifying the exploit.","Qualys stated there are no reliable temporary configuration changes or practical mitigations, so the actionable response is to install vendor-fixed kernels and reboot."],"referencedReports":[{"title":"RefluXFS","url":"https://cdn2.qualys.com/advisory/2026/07/22/RefluXFS.txt","publisher":"Qualys Threat Research Unit","context":"The article cites this as Qualys TRU's detailed technical write-up explaining how attackers can exploit the RefluXFS flaw.","category":"research","primary":true},{"title":"RefluXFS: A Linux Kernel Local Privilege Escalation to Root in XFS (CVE-2026-64600)","url":"https://blog.qualys.com/vulnerabilities-threat-research/2026/07/22/refluxfs-a-linux-kernel-local-privilege-escalation-to-root-in-xfs-cve-2026-64600#executive-summary","publisher":"Qualys Threat Research Unit","context":"The article links to Qualys' executive summary for the vulnerability and quotes its recommendation to immediately patch and reboot affected systems.","category":"research","primary":true}],"body":"\u003cp\u003eA nine-year-old race condition vulnerability in the Linux kernel\u0026rsquo;s XFS filesystem, tracked as CVE-2026-64600 and dubbed RefluXFS, allows local attackers to overwrite protected files and gain root privileges. Qualys Threat Research Unit found and reported the flaw, which affects systems using XFS with reflink enabled, running Linux kernel v4.11 or later, with a directory writable by an unprivileged local user and a high-value root-owned target file or SUID-root binary. Qualys estimates the issue could potentially affect more than 16.4 million systems based on analysis using its Cybersecurity Asset Management software.\u003c/p\u003e\n\n\u003cp\u003eQualys said attackers can reflink-clone a target file such as /etc/passwd or a SUID-root binary into a scratch file they own, then race concurrent O_DIRECT writes on that scratch file. A lock-drop window in the kernel\u0026rsquo;s copy-on-write allocation path can cause one write to land in the physical block still backing the original protected file. The change is made directly on disk, persists across reboot, produces no kernel log output, and does not touch the target file\u0026rsquo;s inode, so a modified SUID-root binary keeps its SUID bit.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability has existed since kernel version 4.11 after a February 2017 commit and was patched on July 16 after a fix was merged into the Linux kernel source tree. Affected distributions listed in the article include Red Hat Enterprise Linux, Oracle Linux, Amazon Linux, Fedora, CentOS Stream, Rocky Linux, AlmaLinux, and CloudLinux. Qualys said standard protections including SELinux, kernel lockdown, container isolation mechanisms, KASLR, SMEP, and SMAP do not block the attack, and recommended immediate kernel patching and a reboot because there are no reliable or practical mitigations or temporary configuration changes.\u003c/p\u003e\n"},{"n":5,"title":"Attackers Weaponize GitHub Actions Runners to Target cPanel and WHM Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/attackers-weaponize-github-actions.html","time":"11:28","priority":"MUST READ","score":92,"tldr":"Attackers compromised GitHub repositories tied to a PHP maintainer and abused GitHub Actions runners as distributed infrastructure to scan for and exploit vulnerable cPanel and WHM servers via CVE-2026-41940. The campaign focused on harvesting credentials and secrets from targeted servers rather than infecting users who installed the affected packages.","briefOverview":"\u003cp\u003eCybersecurity researchers reported a large-scale campaign that turned compromised GitHub repositories into distributed attack infrastructure targeting cPanel and WebHost Manager instances. The activity involved malicious Packagist development versions across 10 packages associated with the legitimate PHP and DevOps developer dinushchathurya between July 12 and 13, 2026. Socket said the PHP libraries themselves were not the execution path, because attackers had added dozens of malicious GitHub Actions workflows to the compromised source repositories.\u003c/p\u003e\n\n\u003cp\u003eThe malicious workflows launched GitHub-hosted runners when a repository received a push or when the workflow was manually run. Those runners downloaded compatible Linux scanning and exploitation payloads from attacker-controlled infrastructure and scanned for cPanel and WHM servers vulnerable to CVE-2026-41940, an authentication bypass issue. The payload attempted the bypass and then harvested credentials, configuration files, environment variables, database access, SSH material, Git tokens, cloud keys, payment service credentials, and other secrets.\u003c/p\u003e\n\n\u003cp\u003eSocket said the affected development versions contained 55 to 62 malicious GitHub Actions workflow files each, totaling 583 files across all 10 package versions. The workflows reported execution status and uploaded collected results through HTTP POST requests, including outputs for AWS credentials, GitHub and GitLab tokens, OpenAI and Google API credentials, Stripe keys, SendGrid and Mailgun credentials, database information, SSH data, Git remotes, and remote code execution results. The article also said signs point to a broader campaign beyond one PHP maintainer, with roughly 6,100 workflow files on GitHub containing the same unique DNSHook identifier.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers reported a large-scale campaign that turned compromised GitHub repositories into distributed attack infrastructure targeting cPanel and WebHost Manager instances.","Between July 12 and 13, 2026, malicious Packagist development versions appeared across 10 packages associated with the legitimate PHP and DevOps developer dinushchathurya.","The attackers added dozens of malicious GitHub Actions workflows to the compromised source repositories, and those workflows launched GitHub-hosted runners to download Linux payloads from attacker-controlled infrastructure.","The payload scanned for cPanel and WHM servers vulnerable to CVE-2026-41940, attempted authentication bypass, and harvested credentials, configuration files, environment variables, database access, SSH material, Git tokens, cloud keys, and payment service credentials.","Socket said the campaign appears broader than one PHP maintainer, with roughly 6,100 GitHub workflow files containing the same unique DNSHook identifier."],"insights":["The affected PHP libraries were not the execution path; the malicious activity ran through GitHub Actions workflows added to the compromised repositories.","Package users’ systems were not the primary target, because the scanning and exploitation were performed on GitHub-hosted runners rather than on machines that installed the packages.","The malicious workflows were highly repetitive and large in volume, with 55 to 62 workflow files per affected development version and 583 total files across the 10 package versions.","A unique DNSHook identifier appeared in roughly 6,100 GitHub workflow files, indicating the campaign likely extended beyond the single compromised PHP maintainer.","The workflows monitored and uploaded outputs for many high-value secrets, including AWS credentials, GitHub and GitLab tokens, OpenAI and Google API credentials, Stripe keys, SendGrid and Mailgun credentials, database information, SSH data, Git remotes, and remote code execution results."],"referencedReports":[{"title":"GitHub Actions Abuse Powers cPanel and WHM Exploitation","url":"https://socket.dev/blog/github-actions-abuse-powers-cpanel-and-whm-exploitation","publisher":"Socket","context":"The article cites Socket’s research as the source that shed light on the campaign abusing compromised GitHub repositories and GitHub Actions runners to target cPanel and WHM servers.","category":"research","primary":true},{"title":"Malicious Go Module Exposes GitHub Malware Lure Network","url":"https://socket.dev/blog/malicious-go-module-exposes-github-malware-lure-network","publisher":"Socket","context":"The article references Socket’s separate analysis of Operation Muck and Load, a campaign abusing GitHub repositories to deliver Windows-based malware.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers reported a large-scale campaign that turned compromised GitHub repositories into distributed attack infrastructure targeting cPanel and WebHost Manager instances. The activity involved malicious Packagist development versions across 10 packages associated with the legitimate PHP and DevOps developer dinushchathurya between July 12 and 13, 2026. Socket said the PHP libraries themselves were not the execution path, because attackers had added dozens of malicious GitHub Actions workflows to the compromised source repositories.\u003c/p\u003e\n\n\u003cp\u003eThe malicious workflows launched GitHub-hosted runners when a repository received a push or when the workflow was manually run. Those runners downloaded compatible Linux scanning and exploitation payloads from attacker-controlled infrastructure and scanned for cPanel and WHM servers vulnerable to CVE-2026-41940, an authentication bypass issue. The payload attempted the bypass and then harvested credentials, configuration files, environment variables, database access, SSH material, Git tokens, cloud keys, payment service credentials, and other secrets.\u003c/p\u003e\n\n\u003cp\u003eSocket said the affected development versions contained 55 to 62 malicious GitHub Actions workflow files each, totaling 583 files across all 10 package versions. The workflows reported execution status and uploaded collected results through HTTP POST requests, including outputs for AWS credentials, GitHub and GitLab tokens, OpenAI and Google API credentials, Stripe keys, SendGrid and Mailgun credentials, database information, SSH data, Git remotes, and remote code execution results. The article also said signs point to a broader campaign beyond one PHP maintainer, with roughly 6,100 workflow files on GitHub containing the same unique DNSHook identifier.\u003c/p\u003e\n"},{"n":8,"title":"Chaos ransomware's msaRAT: Living off the browser to build a covert C2 channel","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/chaos-msarat-living-off-the-browser-to-build-covert-c2-channel/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Cisco Talos uncovered msaRAT, a new Rust-based RAT used by the Chaos ransomware group that hides C2 communications by controlling Chrome or Edge through the Chrome DevTools Protocol and routing traffic over browser-based WebRTC via Cloudflare Workers and Twilio TURN. The design makes external traffic appear to come from a legitimate browser while adding double encryption, complicating detection and attribution.","briefOverview":"\u003cp\u003eCisco Talos discovered a new Rust-based remote access trojan called msaRAT, attributed to the Chaos ransomware group. Chaos is a ransomware-as-a-service group first confirmed in February 2025 that targets large organizations and uses double extortion tactics. The malware is delivered through an MSI file named “update_ms.msi,” which is downloaded to the victim machine and configured to impersonate a Windows update.\u003c/p\u003e\n\n\u003cp\u003emsaRAT uses the Tokio asynchronous runtime and is designed for browser-leveraged remote code execution and covert tunneling to establish command-and-control communications. Instead of making external network connections itself, the RAT launches Chrome or Edge in headless mode, enables the Chrome DevTools Protocol, and injects JavaScript into the browser. It uses Cloudflare Workers for WebRTC signaling and then establishes a WebRTC DataChannel between the browser and the C2 server using Twilio TURN as a relay.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that msaRAT’s design causes external communications to appear as normal browser traffic while the RAT process itself only communicates with 127.0.0.1. After the WebRTC connection is established, Cloudflare Workers drops out of the communication path and C2 commands are exchanged over the WebRTC DataChannel. The communication is protected by WebRTC’s DTLS and also by msaRAT’s ChaCha-Poly1305-based encryption scheme derived through an ECDH key exchange.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos discovered a new Rust-based remote access trojan called msaRAT that is attributed to the Chaos ransomware group.","msaRAT uses the Tokio asynchronous runtime and provides browser-leveraged remote code execution and covert tunneling for command-and-control communications.","The malware does not make external network connections directly and instead controls Chrome or Edge through the Chrome DevTools Protocol to handle its communication channel.","msaRAT uses Cloudflare Workers for WebRTC signaling and establishes a WebRTC DataChannel between the browser and the C2 server using Twilio TURN as a relay.","The RAT encrypts its data with a ChaCha-Poly1305-based scheme derived through an ECDH key exchange, in addition to the DTLS protection already used by WebRTC DataChannel communication."],"insights":["msaRAT’s use of Chrome DevTools Protocol means the RAT process only communicates with 127.0.0.1, while all external traffic appears to originate from a legitimate browser process.","The attacker’s SDP Answer intentionally omits ICE candidates and uses 0.0.0.0 as the connection address, forcing communications through Twilio TURN rather than allowing a direct peer-to-peer WebRTC connection.","The malware disguises its Cloudflare Workers requests with Origin and Referer headers pointing to Microsoft’s official website, while the browser’s headless User-Agent remains visible as HeadlessChrome.","The initial downloader uses plain HTTP on port 443, which the article notes may bypass environments that allow traffic based only on port number without inspecting the protocol.","The injected JavaScript includes send queue and flow control logic that waits for the WebRTC DataChannel buffer to fall below 24KB, likely supporting reliable transfer of larger data such as screenshots or files."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos discovered a new Rust-based remote access trojan called msaRAT, attributed to the Chaos ransomware group. Chaos is a ransomware-as-a-service group first confirmed in February 2025 that targets large organizations and uses double extortion tactics. The malware is delivered through an MSI file named “update_ms.msi,” which is downloaded to the victim machine and configured to impersonate a Windows update.\u003c/p\u003e\n\n\u003cp\u003emsaRAT uses the Tokio asynchronous runtime and is designed for browser-leveraged remote code execution and covert tunneling to establish command-and-control communications. Instead of making external network connections itself, the RAT launches Chrome or Edge in headless mode, enables the Chrome DevTools Protocol, and injects JavaScript into the browser. It uses Cloudflare Workers for WebRTC signaling and then establishes a WebRTC DataChannel between the browser and the C2 server using Twilio TURN as a relay.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that msaRAT’s design causes external communications to appear as normal browser traffic while the RAT process itself only communicates with 127.0.0.1. After the WebRTC connection is established, Cloudflare Workers drops out of the communication path and C2 commands are exchanged over the WebRTC DataChannel. The communication is protected by WebRTC’s DTLS and also by msaRAT’s ChaCha-Poly1305-based encryption scheme derived through an ECDH key exchange.\u003c/p\u003e\n"},{"n":3,"title":"Major Australian energy supplier confirms customer data compromised","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/australia-origin-energy-data-breach","time":"13:20","priority":"SHOULD READ","score":82,"tldr":"Origin Energy, Australia’s largest electricity and gas retailer, confirmed customer data was compromised in a breach affecting an as-yet unknown number of people. Exposed data may include names, addresses, dates of birth, account information, and partial payment details.","briefOverview":"\u003cp\u003eOrigin Energy, an Australian energy company serving nearly 5 million customers, confirmed that customer data was compromised in a data breach. The Sydney-based company had first said it was investigating a potential security incident after The Australian reported that a purported hacker had sent what they claimed was a sample of stolen company records. Origin said it is working with federal agencies to investigate and is still determining the total number of impacted customers.\u003c/p\u003e\n\n\u003cp\u003eThe data that may have been compromised includes account information, names, addresses, dates of birth, the last four digits of credit card numbers, and the last three digits of bank account numbers. Origin CEO Frank Calabria apologized to customers and said one of the company’s key priorities is securing its systems and ensuring no further unauthorized access. He also said Origin is working with independent cyber experts alongside authorities.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Origin is Australia’s largest electricity and gas retailer, making the breach significant because of the size of its customer base. It also places the incident alongside a recent compromise at Partnered Health, which confirmed that patients who visited at least 21 Australian clinics may have had medical records stolen in a cyberattack.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Origin Energy, an Australian energy company serving nearly 5 million customers, announced that it suffered a data breach and is working with federal agencies to investigate.","Origin confirmed that customer data had been compromised and said it is working to understand the total number of impacted customers.","The compromised data may include account information, the last four digits of credit card numbers, the last three digits of bank account numbers, names, addresses, and dates of birth.","Origin CEO Frank Calabria apologized to customers and said the company is working with independent cyber experts and authorities to secure its systems and prevent further unauthorized access.","The breach follows a recent cyberattack on Partnered Health, which confirmed that patients at least 21 Australian clinics may have had medical records stolen."],"insights":["Origin’s public position changed from investigating a potential incident to confirming compromised customer data within about a day of a media report that a purported hacker had shared a sample of stolen records.","The company has not yet determined how many customers are affected, so the real-world scale remains unresolved despite Origin serving nearly 5 million customers.","The exposed information may combine personal identifiers with partial payment and bank account details, making the breach relevant beyond simple account contact information.","The incident is part of a recent pattern in the article of Australian organizations handling sensitive personal information, including energy and healthcare providers, reporting stolen or compromised customer or patient data."],"referencedReports":[],"body":"\u003cp\u003eOrigin Energy, an Australian energy company serving nearly 5 million customers, confirmed that customer data was compromised in a data breach. The Sydney-based company had first said it was investigating a potential security incident after The Australian reported that a purported hacker had sent what they claimed was a sample of stolen company records. Origin said it is working with federal agencies to investigate and is still determining the total number of impacted customers.\u003c/p\u003e\n\n\u003cp\u003eThe data that may have been compromised includes account information, names, addresses, dates of birth, the last four digits of credit card numbers, and the last three digits of bank account numbers. Origin CEO Frank Calabria apologized to customers and said one of the company’s key priorities is securing its systems and ensuring no further unauthorized access. He also said Origin is working with independent cyber experts alongside authorities.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Origin is Australia’s largest electricity and gas retailer, making the breach significant because of the size of its customer base. It also places the incident alongside a recent compromise at Partnered Health, which confirmed that patients who visited at least 21 Australian clinics may have had medical records stolen in a cyberattack.\u003c/p\u003e\n"},{"n":6,"title":"Fake Microsoft Quarantine Hides a DocuSign NDA Trap","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/fake-microsoft-quarantine-nested-docusign-malicious-redirect","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email impersonated both Microsoft quarantine alerts and DocuSign, using a compromised Amazon SES account and legitimate URL-rewriting services to pass email authentication and hide a malicious credential-harvesting link. The key lesson is that SPF, DKIM, and DMARC can validate the sender path but cannot determine whether a message’s content and behavior are malicious.","briefOverview":"\u003cp\u003eAn attacker cloned a Microsoft Outlook quarantine notification and placed a fake DocuSign NDA renewal notice inside it. The email was sent to an IT project manager at a large engineering consultancy and used the subject line “Entry Limitations MSG ID:#061bc\u0026hellip;” followed by a long hex string. The message combined a Microsoft-style “Review These Messages” layout with a DocuSign-style “Confidential Message” card and a “Review Message” button.\u003c/p\u003e\n\n\u003cp\u003eThe button led to a long, multi-stage encoded URL that passed through legitimate URL-rewriting services, including observed references to Cisco, Sophos, and Barracuda link-protection domains. The redirect chain ultimately resolved to scale.kusbilisim[.]com, which the article says was independently flagged malicious, while signatureforemail[.]com was used for an email-signature element and had a mixed verdict. The message passed SPF, DKIM, DMARC best-guess, and Microsoft composite authentication because it was sent through a compromised Amazon SES account belonging to a real company.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft assigned the email a spam confidence level of 1, so the tenant’s filters treated it as legitimate mail. IRONSCALES says its Adaptive AI quarantined the message within a minute and also quarantined two follow-up waves from the same account that evening. The article says the detection relied on combined signals such as first-time sender behavior, a pipe-delimited junk display name, double-brand nesting, and a redirect chain ending at a flagged domain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The phishing email impersonated a Microsoft Outlook quarantine notification and embedded a fake DocuSign NDA renewal notice inside it.","The message’s “Review Message” button used a multi-stage encoded redirect chain through legitimate URL-rewriting services before resolving to scale.kusbilisim[.]com, which the article says was independently flagged malicious.","The email passed SPF, DKIM, DMARC best-guess, and Microsoft composite authentication because it was sent from a compromised Amazon SES account belonging to a real company.","Microsoft assigned the message a spam confidence level of 1, meaning the tenant’s own filters delivered it as legitimate mail.","IRONSCALES says its Adaptive AI quarantined the message and two follow-up waves within a minute based on sender behavior, double-brand nesting, a noisy display name, and the redirect chain ending at a flagged domain."],"insights":["Clean SPF, DKIM, DMARC, and composite authentication results did not make the email safe, because they verified the legitimate delivery path from a compromised Amazon SES account rather than the intent of the message.","The attacker increased trust pressure by nesting two familiar transactional templates in one email, making Microsoft appear to be holding a message while DocuSign appeared to require action on an NDA.","Legitimate link-protection services can be abused as camouflage when attackers chain several rewritten URLs in front of a flagged final destination.","The article identifies first-time sender status and a pipe-delimited junk display name as behavioral clues that remained suspicious even though the email authentication checks passed.","The recommended user behavior is to treat emailed “review your quarantine” buttons as hostile by default and access the quarantine portal only through a known login."],"referencedReports":[{"title":"2024 IC3 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for the number of phishing and spoofing complaints logged in 2024.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references the report to support the point that identity and infrastructure abuse have become prominent initial access methods.","category":"research","primary":false},{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on phishing as an initial access method and credentials appearing in breach chains.","category":"research","primary":false}],"body":"\u003cp\u003eAn attacker cloned a Microsoft Outlook quarantine notification and placed a fake DocuSign NDA renewal notice inside it. The email was sent to an IT project manager at a large engineering consultancy and used the subject line “Entry Limitations MSG ID:#061bc\u0026hellip;” followed by a long hex string. The message combined a Microsoft-style “Review These Messages” layout with a DocuSign-style “Confidential Message” card and a “Review Message” button.\u003c/p\u003e\n\n\u003cp\u003eThe button led to a long, multi-stage encoded URL that passed through legitimate URL-rewriting services, including observed references to Cisco, Sophos, and Barracuda link-protection domains. The redirect chain ultimately resolved to scale.kusbilisim[.]com, which the article says was independently flagged malicious, while signatureforemail[.]com was used for an email-signature element and had a mixed verdict. The message passed SPF, DKIM, DMARC best-guess, and Microsoft composite authentication because it was sent through a compromised Amazon SES account belonging to a real company.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft assigned the email a spam confidence level of 1, so the tenant’s filters treated it as legitimate mail. IRONSCALES says its Adaptive AI quarantined the message within a minute and also quarantined two follow-up waves from the same account that evening. The article says the detection relied on combined signals such as first-time sender behavior, a pipe-delimited junk display name, double-brand nesting, and a redirect chain ending at a flagged domain.\u003c/p\u003e\n"},{"n":9,"title":"The State of the Internet Is Changing: AI Exposures Surge While Global ICS Trends Shift","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/state-of-the-internet-2026-preview/","time":"12:02","priority":"MAY READ","score":58,"tldr":"Censys reports that public Internet exposure of AI/LLM tools has surged more than 60% in nine months, including fast-growing high-risk products like Langflow and LiteLLM with serious vulnerabilities. It also finds Internet-exposed industrial control systems continue shifting geographically, with Asia’s share rising while Europe’s declines.","briefOverview":"\u003cp\u003eCensys published a preview of findings from its upcoming 2026 State of the Internet Report, which will be released in the fall. The article says the report expands on Censys Internet Map observations and Censys ARC research into technologies, infrastructure, and security trends shaping the Internet. The preview focuses on rapid growth in Internet-exposed AI infrastructure and changing global patterns in Internet-exposed industrial control systems.\u003c/p\u003e\n\n\u003cp\u003eCensys says AI/LLM tool exposures have risen more than 60% in the past nine months, with over 294,000 distinct IPs now exposing one of 43 detected AI/LLM tools to the public Internet, up from about 183,000 in October 2025. The article highlights Langflow, which grew 169% in nine months and has accumulated 18 CVEs from 2024 to 2026, including 14 with CVSS scores above 8.0 and 4 CISA KEV entries. It also highlights LiteLLM, which nearly doubled and has an actively exploited pre-auth SQL injection, CVE-2026-42208, listed in CISA KEV.\u003c/p\u003e\n\n\u003cp\u003eFor industrial control systems, Censys observes an average of 138,000 distinct hosts running ICS services and tooling exposed on the Internet in early 2026, up from about 129,000 in 2024. North America represents roughly 38% of global ICS exposures, Asia has expanded from 22.9% in 2024 to 27% in 2026, and Europe has declined from 36.1% to 31.1%. The article also says roughly 70% of hosts running ICS devices and services globally have consistently been found on consumer and mobile networks for the last 2.5 years.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys reports that AI/LLM tool exposures have risen over 60% in the past nine months, with more than 294,000 distinct IPs now exposing one of 43 detected AI/LLM tools to the public Internet, up from about 183,000 in October 2025.","The article says some of the highest-risk AI/LLM products are among the fastest growing, including Langflow, which grew 169% in nine months and has accumulated 18 CVEs from 2024 to 2026.","Censys states that LiteLLM nearly doubled in the same nine-month period and has an actively exploited pre-auth SQL injection vulnerability, CVE-2026-42208, listed in CISA KEV.","Censys observes an average of 138,000 distinct hosts running ICS services and tooling exposed on the Internet in early 2026, up from about 129,000 in 2024.","The article says North America represents roughly 38% of global Internet-exposed ICS exposures in 2026, while Asia rose from 22.9% in 2024 to 27% in 2026 and Europe declined from 36.1% to 31.1%."],"insights":["The article highlights that AI exposure growth is not limited to low-risk experimentation; the fastest-growing products include tools with severe and actively exploited vulnerabilities, making exposure reduction especially urgent for Langflow and LiteLLM instances.","LiteLLM’s role as a unified LLM proxy makes a single exposed compromise especially consequential because the article says it can expose API keys for every upstream model provider.","The geography of Internet-exposed ICS is changing even though the types of networks hosting them are not, with consumer and mobile networks consistently accounting for roughly 70% of exposed ICS hosts over the last 2.5 years.","The increase in Asia’s share of global ICS exposure alongside Europe’s decline suggests that regional risk prioritization based on older exposure distributions may no longer match the current Internet landscape."],"referencedReports":[],"body":"\u003cp\u003eCensys published a preview of findings from its upcoming 2026 State of the Internet Report, which will be released in the fall. The article says the report expands on Censys Internet Map observations and Censys ARC research into technologies, infrastructure, and security trends shaping the Internet. The preview focuses on rapid growth in Internet-exposed AI infrastructure and changing global patterns in Internet-exposed industrial control systems.\u003c/p\u003e\n\n\u003cp\u003eCensys says AI/LLM tool exposures have risen more than 60% in the past nine months, with over 294,000 distinct IPs now exposing one of 43 detected AI/LLM tools to the public Internet, up from about 183,000 in October 2025. The article highlights Langflow, which grew 169% in nine months and has accumulated 18 CVEs from 2024 to 2026, including 14 with CVSS scores above 8.0 and 4 CISA KEV entries. It also highlights LiteLLM, which nearly doubled and has an actively exploited pre-auth SQL injection, CVE-2026-42208, listed in CISA KEV.\u003c/p\u003e\n\n\u003cp\u003eFor industrial control systems, Censys observes an average of 138,000 distinct hosts running ICS services and tooling exposed on the Internet in early 2026, up from about 129,000 in 2024. North America represents roughly 38% of global ICS exposures, Asia has expanded from 22.9% in 2024 to 27% in 2026, and Europe has declined from 36.1% to 31.1%. The article also says roughly 70% of hosts running ICS devices and services globally have consistently been found on consumer and mobile networks for the last 2.5 years.\u003c/p\u003e\n"},{"n":4,"title":"How Synthetic Identity Fraud is Coming for Machine Identities","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/how-synthetic-identity-fraud-is-coming.html","time":"11:45","priority":"MAY READ","score":55,"tldr":"Attackers can fabricate machine identities that look legitimate, rather than stealing existing ones, allowing them to quietly gain and retain access in environments with weak non-human identity governance. Organizations should require ownership, short-lived secrets, least privilege, and continuous behavior verification for every machine identity.","briefOverview":"\u003cp\u003eThe article explains a machine-side parallel to synthetic identity fraud, where attackers create non-human identities that were never legitimately provisioned rather than stealing existing ones. These fabricated machine identities can blend into enterprise environments by using plausible naming conventions, metadata, domains, and permissions. Because there is no real owner or compromised user to notice misuse, such identities may persist quietly and accumulate access over time.\u003c/p\u003e\n\n\u003cp\u003eThe article describes rogue service accounts, DCShadow, and shadow credentials as examples of how illegitimate identities or trusted authentication paths can be accepted by an environment. A rogue service account may look like an existing account, DCShadow can make malicious changes appear as legitimate domain replication traffic, and shadow credentials can add attacker-controlled authentication material to an existing object. The article also notes that agentic AI makes the issue more timely because AI agents can acquire credentials dynamically and increasingly create other agents with identities of their own.\u003c/p\u003e\n\n\u003cp\u003eTo defend against fabricated machine identities, the article recommends strong governance rather than relying on manual discovery. It says every non-human identity should have a human owner, documented purpose, and expiration date, while secrets should be centrally managed and rotated. It also recommends least-privilege and Just-in-Time access, along with continuous verification of behavior, so trust is based on what an identity does over time rather than only how it was created.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that attackers may fabricate non-human identities rather than steal existing service accounts, allowing fake machine identities to appear legitimate from the start.","Fabricated machine identities can blend into enterprise environments by using real naming conventions, plausible metadata, the correct domain, and permissions similar to other non-human identities.","The article identifies rogue service accounts, DCShadow, and shadow credentials as ways attackers can create or forge illegitimate machine identities that systems may accept as trusted.","Agentic AI may make the issue more urgent because AI agents can dynamically acquire credentials and increasingly spin up other agents with identities of their own.","The article recommends assigning every non-human identity a human owner, documented purpose, and expiration date, while also rotating secrets, enforcing least privilege, and continuously verifying behavior."],"insights":["Detection approaches focused on stolen credentials may miss fabricated machine identities because there is no legitimate owner or compromised user to notice unusual activity or receive alerts.","A fabricated machine identity can gain credibility by copying ordinary environmental details, such as naming conventions, domain placement, metadata, and typical permission requests, rather than by using advanced new techniques.","DCShadow is framed as a way to fabricate a trusted source of authority, not just an account, because malicious changes can appear as legitimate replication traffic from a rogue domain controller.","Agentic AI makes identity governance more difficult because automated agents can acquire credentials at runtime and create other agents with their own identities, making legitimate and fabricated identity creation harder to distinguish.","The article treats expiration dates for machine identities as a practical control because identities that are permanent by default give fabricated accounts more time to persist and accumulate access."],"referencedReports":[],"body":"\u003cp\u003eThe article explains a machine-side parallel to synthetic identity fraud, where attackers create non-human identities that were never legitimately provisioned rather than stealing existing ones. These fabricated machine identities can blend into enterprise environments by using plausible naming conventions, metadata, domains, and permissions. Because there is no real owner or compromised user to notice misuse, such identities may persist quietly and accumulate access over time.\u003c/p\u003e\n\n\u003cp\u003eThe article describes rogue service accounts, DCShadow, and shadow credentials as examples of how illegitimate identities or trusted authentication paths can be accepted by an environment. A rogue service account may look like an existing account, DCShadow can make malicious changes appear as legitimate domain replication traffic, and shadow credentials can add attacker-controlled authentication material to an existing object. The article also notes that agentic AI makes the issue more timely because AI agents can acquire credentials dynamically and increasingly create other agents with identities of their own.\u003c/p\u003e\n\n\u003cp\u003eTo defend against fabricated machine identities, the article recommends strong governance rather than relying on manual discovery. It says every non-human identity should have a human owner, documented purpose, and expiration date, while secrets should be centrally managed and rotated. It also recommends least-privilege and Just-in-Time access, along with continuous verification of behavior, so trust is based on what an identity does over time rather than only how it was created.\u003c/p\u003e\n"},{"n":2,"title":"EU fines Google $1 billion for search, app store antitrust violations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/google/eu-fines-google-1-billion-for-digital-markets-act-breaches-in-search-and-play-store/","time":"12:33","priority":"MAY READ","score":45,"tldr":"The European Commission fined Google €890 million ($1 billion) for violating the EU Digital Markets Act by favoring its own services in search results and limiting app developers’ ability to steer users to cheaper offers outside Google Play. Google must end the practices within 60 days or face additional penalties.","briefOverview":"\u003cp\u003eThe European Commission fined Google €890 million ($1 billion) after finding that the company violated the European Union\u0026rsquo;s Digital Markets Act. The Commission said Google favored its own services in Google Search and restricted how app developers could direct customers to cheaper purchase options through channels of their choice. Google was fined €460 million for boosting its services in search results and €430 million for its app store steering practices.\u003c/p\u003e\n\n\u003cp\u003eThe Commission said Google gave preferential treatment to its own shopping, hotels, transport, and sports results over third-party services in Google Search. It also said Google prevented app developers from freely communicating and promoting offers and concluding contracts with users through channels including third-party app stores. Google was ordered to end the violations within 60 days or risk penalty payments of up to 5% of its worldwide turnover.\u003c/p\u003e\n\n\u003cp\u003eThe Commission noted that Google has begun testing changes to how its own services are placed in search results and has rolled out changes to its steering terms, describing this as substantial progress toward compliance. Executive Vice-President Teresa Ribera said the best products should succeed because they are better, not because they are owned by the company running the search engine. The article also notes other recent European penalties and decisions involving Google, including fines related to adtech, cookie regulations, Gmail ads, and Android.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Commission fined Google €890 million ($1 billion) after finding that the company violated the European Union’s Digital Markets Act.","The Commission said Google favored its own services, including shopping, hotels, transport, and sports results, over third-party services in Google Search.","The Commission said Google restricted app developers from freely communicating and promoting offers and concluding contracts with users through distribution channels of their choice, including third-party app stores.","Google was fined €460 million for boosting its services in search results and €430 million for its app store steering practices.","Google was ordered to end the violations within 60 days or risk penalty payments of up to 5% of its worldwide turnover."],"insights":["The Commission described Google’s recent changes to search placement and app store steering terms as “substantial progress towards compliance,” but still concluded they were not enough to avoid penalties.","The search-related fine and the app store-related fine were nearly equal in size, showing that the Commission treated both Google Search ranking practices and Google Play steering restrictions as major violations.","The 60-day deadline creates an immediate compliance window for Google, with potential ongoing penalties tied to up to 5% of worldwide turnover if the violations continue.","The article places the fine within a broader pattern of recent European enforcement against Google, including penalties tied to adtech practices, cookie rules, Gmail ads, and Android-related competition issues."],"referencedReports":[],"body":"\u003cp\u003eThe European Commission fined Google €890 million ($1 billion) after finding that the company violated the European Union\u0026rsquo;s Digital Markets Act. The Commission said Google favored its own services in Google Search and restricted how app developers could direct customers to cheaper purchase options through channels of their choice. Google was fined €460 million for boosting its services in search results and €430 million for its app store steering practices.\u003c/p\u003e\n\n\u003cp\u003eThe Commission said Google gave preferential treatment to its own shopping, hotels, transport, and sports results over third-party services in Google Search. It also said Google prevented app developers from freely communicating and promoting offers and concluding contracts with users through channels including third-party app stores. Google was ordered to end the violations within 60 days or risk penalty payments of up to 5% of its worldwide turnover.\u003c/p\u003e\n\n\u003cp\u003eThe Commission noted that Google has begun testing changes to how its own services are placed in search results and has rolled out changes to its steering terms, describing this as substantial progress toward compliance. Executive Vice-President Teresa Ribera said the best products should succeed because they are better, not because they are owned by the company running the search engine. The article also notes other recent European penalties and decisions involving Google, including fines related to adtech, cookie regulations, Gmail ads, and Android.\u003c/p\u003e\n"},{"n":7,"title":"Preview: Cisco Talos at Black Hat USA 2026","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/preview-cisco-talos-at-black-hat-usa-2026/","time":"10:00","priority":"MAY READ","score":35,"tldr":"Cisco Talos will be at Black Hat USA 2026 with booth talks, workshops, and a keynote focused heavily on securing enterprises as AI agents become more capable and privileged. The team will also showcase how Talos threat intelligence is embedded across Cisco’s security portfolio.","briefOverview":"\u003cp\u003eCisco Talos will be at Black Hat USA 2026 in Las Vegas as part of the Cisco and Splunk booth, number 2633. The team will be available to discuss its latest threat research, incident response work, and how Talos intelligence supports the Cisco portfolio. The article previews several ways Talos, Cisco, and Splunk will appear at the event, including booth talks, keynote sessions, and workshops.\u003c/p\u003e\n\n\u003cp\u003eTalos researchers will present 15-minute booth lightning talks on Wednesday and Thursday covering topics such as threat actor prompting, adversary use of agents and tools, Warlock ransomware, zero trust for agent identity, cybersecurity fraud prediction, and vulnerability discovery trends. Cisco’s David Dalling and Rick Miles will also deliver a Main Stage keynote on August 5 about protecting enterprises as AI agents become more capable and more privileged. The keynote will address the security challenges organizations face as autonomous systems become part of everyday business operations.\u003c/p\u003e\n\n\u003cp\u003eTalos’ Nick Biasini and Cisco’s Omar Santos will lead a workshop on August 5 about what happens when AI finds vulnerabilities faster than humans can patch. The workshop will cover the Foundry Security Spec, Project CodeGuard, adversarial AI tactics, and ways to integrate defensive AI strategies into SOC workflows. A separate Splunk workshop will examine how autonomous agents using valid credentials and delegated authority could move data, distribute brute-force attempts, and manipulate internal systems without triggering traditional SIEM or UEBA alerts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos will be present in the Cisco and Splunk booth 2633 at Black Hat USA 2026 to discuss threat research, incident response, and how Talos intelligence powers the Cisco portfolio.","Talos researchers will give 15-minute booth lightning talks on topics including adversary use of prompts, agents, skills, and tools, Warlock ransomware, zero trust for agent identity, cybersecurity fraud prediction, and vulnerability discovery trends.","Cisco’s David Dalling and Rick Miles will deliver a Main Stage keynote on August 5 about protecting enterprises as AI agents become more capable and more privileged inside business environments.","Talos’ Nick Biasini and Cisco’s Omar Santos will lead a workshop on August 5 about using AI in SOC workflows, including the Foundry Security Spec, Project CodeGuard, adversarial AI tactics, and AI-assisted threat hunting.","A Splunk workshop on August 5 will examine how autonomous agents using valid credentials and delegated authority could act as insider threats without triggering traditional SIEM or UEBA alerts."],"insights":["Cisco Talos is framing AI agents as both a defensive opportunity and a security risk, with separate sessions covering AI-assisted threat hunting, autonomous vulnerability discovery, and agents acting as insider threats.","The article emphasizes that agent security is becoming an identity and access problem, since AI agents may operate with valid credentials, delegated authority, and increasing privilege inside enterprise environments.","Talos’ workshop is positioned around turning autonomous security testing findings into reusable secure-coding rules through Project CodeGuard, making prevention a stated goal rather than only detection.","Cisco presents Talos as embedded across its security portfolio rather than as a separate product or threat intelligence feed, which affects how customers are expected to consume Talos intelligence."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos will be at Black Hat USA 2026 in Las Vegas as part of the Cisco and Splunk booth, number 2633. The team will be available to discuss its latest threat research, incident response work, and how Talos intelligence supports the Cisco portfolio. The article previews several ways Talos, Cisco, and Splunk will appear at the event, including booth talks, keynote sessions, and workshops.\u003c/p\u003e\n\n\u003cp\u003eTalos researchers will present 15-minute booth lightning talks on Wednesday and Thursday covering topics such as threat actor prompting, adversary use of agents and tools, Warlock ransomware, zero trust for agent identity, cybersecurity fraud prediction, and vulnerability discovery trends. Cisco’s David Dalling and Rick Miles will also deliver a Main Stage keynote on August 5 about protecting enterprises as AI agents become more capable and more privileged. The keynote will address the security challenges organizations face as autonomous systems become part of everyday business operations.\u003c/p\u003e\n\n\u003cp\u003eTalos’ Nick Biasini and Cisco’s Omar Santos will lead a workshop on August 5 about what happens when AI finds vulnerabilities faster than humans can patch. The workshop will cover the Foundry Security Spec, Project CodeGuard, adversarial AI tactics, and ways to integrate defensive AI strategies into SOC workflows. A separate Splunk workshop will examine how autonomous agents using valid credentials and delegated authority could move data, distribute brute-force attempts, and manipulate internal systems without triggering traditional SIEM or UEBA alerts.\u003c/p\u003e\n"}]</script>
