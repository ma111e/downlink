 representative at a medical device manufacturer received a document notification impersonating Fifth Third Bank that was labeled credential theft and automatically resolved as phishing.","The email passed DKIM, DMARC, and Microsoft composite authentication even though SPF returned None for the Amazon SES sending host, because one DKIM signature aligned with the From domain.","The sending domain belonged to a real media business in Botswana, and the landing page was hosted on an unrelated Malaysian corporate domain, making both businesses bystanders rather than attacker-owned infrastructure.","The call-to-action text looked normal to a human reader but contained seven hidden ASCII letters inside inline HTML elements styled to near-zero width, causing scanners that read raw text to see a garbled phrase.","The email hotlinked four real Fifth Third Bank pages, including the bank’s phishing-awareness page, while using a blank subject line and no attachment."],"insights":["A DMARC pass should be treated as an alignment fact rather than a trust verdict, because the article shows that DKIM alone can produce a clean pass even when SPF returns None for the sending host.","An aligned DKIM signature on an aged domain paired with SPF None is a suspicious pattern because it suggests someone could verify the domain with a sending platform without maintaining consistent control of the whole DNS zone.","The mismatch between rendered button text and raw extracted text is itself a stronger indicator than the hidden words, since legitimate bulk senders do not normally hide individual letters inside visible words with near-zero-width styling.","Blocklisting an entire compromised or abused third-party domain can punish uninvolved businesses, so the article recommends focusing on the specific URL path and sender pattern instead.","URL reputation and authentication checks were insufficient in this case because the email used genuine bank links, a security-product link wrapper, legitimate d message text against the underlying content.\u003c/p\u003e\n"},{"n":2,"title":"The Anatomy of a Pentest: Where Does AI Change the Game?","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/the-anatomy-of-a-pentest-where-does-ai-change-the-game/","time":"13:00","priority":"MAY READ","score":52,"tldr":"AI does not change the core phases of pentesting, but it should be used selectively where reasoning matters most: exploitation and evidence-based reporting. Broad discovery, recon, and baseline testing are better handled by deterministic automation so organizations can afford to test far more assets more often.","briefOverview":"\u003cp\u003eThe article examines how AI changes pentesting by looking at the process phase by phase. It argues that the pentest itself has not changed, only who or what performs each part of it. The five phases used are discovery and scoping, recon and enumeration, testing for security weaknesses, exploitation, and reporting with validation and learning.\u003c/p\u003e\n\n\u003cp\u003eA central point is that AI should not be applied equally across every phase because model usage is metered by tokens and can become expensive at scale. The article says discovery, recon, and baseline testing are largely mechanical tasks that deterministic automation and existing tools can handle broadly and cheaply. It contrasts this with model-driven orchestration, where repeated model calls around standard scanner output can produce the same results at much higher cost.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies exploitation as the phase where AI reasoning can change what is possible because it requires forming hypotheses, sending requests, interpreting responses, and adapting to prove a weakness is real. It gives the example of a leaked production signing key that could be used to forge a valid token and bypass authorization. It also stresses that real exploitation must remain within approved scope and avoid corrupting data or disrupting availability, while reporting should be grounded in reproduced evidence rather than inferred findings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that the structure of pentesting has not changed, but AI is becoming a new executor for parts of the existing process.","Discovery, recon, and baseline security testing are described as mechanical tasks that deterministic automation can already handle at scale without model-based reasoning.","The article says using large language models across every phase can become costly because model use is metered by tokens, which can reduce coverage across large attack surfaces.","AI is presented as most valuable during exploitation, where a tester must form hypotheses, send requests, interpret responses, and adapt to prove that a weakness is real.","The article emphasizes that real exploitation must stay within approved scope and avoid destructive actions because it runs against live production systems."],"insights":["The article frames AI pentesting economics as a coverage problem: using models for routine steps can make testing so expensive that organizations again test only a small set of assets.","The article identifies discovery and scoping as the point where the coverage gap begins, because unknown or forgotten assets are excluded before any testing starts.","The article argues that model-based orchestration of standard recon tools can produce the same map as deterministic workflows while costing one to two orders of magnitude more per asset.","The article suggests that evidence-backed exploitation can make remediation more immediately actionable because it points to the exact failed link, such as a leaked signing key, unauthenticated endpoint, or missing authorization check."],"referencedReports":[],"body":"\u003cp\u003eThe article examines how AI changes pentesting by looking at the process phase by phase. It argues that the pentest itself has not changed, only who or what performs each part of it. The five phases used are discovery and scoping, recon and enumeration, testing for security weaknesses, exploitation, and reporting with validation and learning.\u003c/p\u003e\n\n\u003cp\u003eA central point is that AI should not be applied equally across every phase because model usage is metered by tokens and can become expensive at scale. The article says discovery, recon, and baseline testing are largely mechanical tasks that deterministic automation and existing tools can handle broadly and cheaply. It contrasts this with model-driven orchestration, where repeated model calls around standard scanner output can produce the same results at much higher cost.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies exploitation as the phase where AI reasoning can change what is possible because it requires forming hypotheses, sending requests, interpreting responses, and adapting to prove a weakness is real. It gives the example of a leaked production signing key that could be used to forge a valid token and bypass authorization. It also stresses that real exploitation must remain within approved scope and avoid corrupting data or disrupting availability, while reporting should be grounded in reproduced evidence rather than inferred findings.\u003c/p\u003e\n"}]</script>
