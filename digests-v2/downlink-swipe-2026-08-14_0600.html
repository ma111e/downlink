<script type="application/json" id="dl-articles">[{"n":2,"title":"You’re Back In The Room (Citrix NetScaler Pre-Auth RCE CVE-2026-8452(?))","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/","time":"07:08","priority":"MUST READ","score":92,"tldr":"watchTowr Labs details a pre-auth heap overflow in Citrix NetScaler ADC/Gateway SAML handling, likely CVE-2026-8452, that can be turned into remote code execution on vulnerable builds. The key takeaway is to patch NetScaler 14.1 to 14.1-72.61 or 13.1 to 13.1-63.18 or later, especially if SAML is enabled.","briefOverview":"\u003cp\u003ewatchTowr Labs analyzed a heap overflow vulnerability resolved in a recent Citrix NetScaler ADC and NetScaler Gateway security bulletin, and the researchers believe it is likely CVE-2026-8452. The issue is reachable when a vulnerable NetScaler appliance is configured to use SAML as either a Service Provider or an Identity Provider. Citrix lists NetScaler ADC and NetScaler Gateway 14.1 before 14.1-72.61 and 13.1 before 13.1-63.18 as affected.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability occurs during SAML signature canonicalization, where earlier NetScaler versions copied attacker-controlled data from the \u003ccode\u003eds:SignedInfo\u003c/code\u003e element into a fixed-size global buffer without checking whether it fit. The researchers found that an oversized \u003ccode\u003ePrefixList\u003c/code\u003e attribute could overflow NetScaler network buffer metadata, corrupt a neighboring chunk, and later influence a trusted \u003ccode\u003ememcpy\u003c/code\u003e operation. By controlling both the source and destination of that copy, they obtained a write-what-where primitive.\u003c/p\u003e\n\n\u003cp\u003eThe researchers used that primitive to overwrite the \u003ccode\u003etx_pkt_complete_fptr\u003c/code\u003e function pointer and gain control of execution flow in \u003ccode\u003ensppe\u003c/code\u003e. Because the tested binary was non-PIE, ASLR was absent, and the heap was executable, they jumped to shellcode placed on the heap, dropped a PHP webshell, and later used shellcode to set the SUID bit on \u003ccode\u003e/bin/sh\u003c/code\u003e. They also addressed the problem of NetScaler rebooting after \u003ccode\u003ensppe\u003c/code\u003e crashes by neutralizing signal handlers so \u003ccode\u003epitboss\u003c/code\u003e respawned \u003ccode\u003ensppe\u003c/code\u003e instead of rebooting the whole appliance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["watchTowr Labs analyzed a heap overflow vulnerability patched in Citrix’s NetScaler ADC and NetScaler Gateway security bulletin and believes it is likely CVE-2026-8452 based on the bulletin’s “Memory Overflow” description.","The vulnerability is reachable when a NetScaler appliance is configured to use SAML as either a Service Provider or an Identity Provider, and Citrix lists NetScaler ADC and NetScaler Gateway 14.1 before 14.1-72.61 and 13.1 before 13.1-63.18 as affected.","During SAML signature canonicalization, earlier NetScaler versions copied attacker-controlled data from the ds:SignedInfo element into a fixed-size global buffer without checking whether it fit.","The researchers found that an oversized PrefixList attribute in the SignedInfo structure could overflow NetScaler network buffer metadata and produce a write-what-where primitive.","The researchers demonstrated remote code execution by overwriting a NetScaler function pointer, jumping to shellcode on the executable heap, dropping a PHP webshell, and setting the SUID bit on /bin/sh."],"insights":["The patched build added explicit size checks around SAML SignedInfo canonicalization, and that change is what led the researchers to the vulnerable copy operation during binary diffing.","The exploitable input was not a large repeated string, because PrefixList values had to be unique; the researchers used unique marker tokens to both trigger the overflow and map which exact payload bytes controlled specific heap metadata fields.","The exploit did not require an information leak in the researchers’ test setup because the nsppe binary was non-PIE, ASLR was absent, and the heap was executable with predictable addresses after forcing nsppe to respawn.","Simply dropping a webshell was not enough because a crashing nsppe process caused pitboss to reboot the appliance and wipe the dropped file; the researchers avoided this by using shellcode to neutralize nsppe signal handlers so pitboss respawned nsppe instead of rebooting the whole system.","Although the initial shellcode ran as root inside nsppe, commands run through the PHP webshell executed as nobody, so the researchers used shellcode to set the SUID bit on /bin/sh to obtain root effective privileges through the webshell."],"referencedReports":[{"title":"NetScaler ADC and NetScaler Gateway Security Bulletin","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX696604\u0026ref=labs.watchtowr.com","publisher":"citrix","context":"The article says the heap overflow vulnerability was resolved as part of this recent NetScaler ADC and NetScaler Gateway security bulletin.","category":"advisory","primary":true},{"title":"Analysis \u0026 Exploitation of CVE-2023-3519","url":"https://bishopfox.com/blog/analysis-exploitation-cve-2023-3519?ref=labs.watchtowr.com","publisher":"bishop-fox","context":"The article cites this as the last publicly documented NetScaler remote code execution writeup before the vulnerability discussed in the article.","category":"research","primary":false},{"title":"Citrix ADC and Gateway RCE CVE-2023-3519","url":"https://bishopfox.com/blog/citrix-adc-gateway-rce-cve-2023-3519?ref=labs.watchtowr.com","publisher":"bishop-fox","context":"The article says the researchers followed the shellcode strategy from this Bishop Fox work when dropping a PHP webshell on NetScaler.","category":"research","primary":false}],"body":"\u003cp\u003ewatchTowr Labs analyzed a heap overflow vulnerability resolved in a recent Citrix NetScaler ADC and NetScaler Gateway security bulletin, and the researchers believe it is likely CVE-2026-8452. The issue is reachable when a vulnerable NetScaler appliance is configured to use SAML as either a Service Provider or an Identity Provider. Citrix lists NetScaler ADC and NetScaler Gateway 14.1 before 14.1-72.61 and 13.1 before 13.1-63.18 as affected.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability occurs during SAML signature canonicalization, where earlier NetScaler versions copied attacker-controlled data from the \u003ccode\u003eds:SignedInfo\u003c/code\u003e element into a fixed-size global buffer without checking whether it fit. The researchers found that an oversized \u003ccode\u003ePrefixList\u003c/code\u003e attribute could overflow NetScaler network buffer metadata, corrupt a neighboring chunk, and later influence a trusted \u003ccode\u003ememcpy\u003c/code\u003e operation. By controlling both the source and destination of that copy, they obtained a write-what-where primitive.\u003c/p\u003e\n\n\u003cp\u003eThe researchers used that primitive to overwrite the \u003ccode\u003etx_pkt_complete_fptr\u003c/code\u003e function pointer and gain control of execution flow in \u003ccode\u003ensppe\u003c/code\u003e. Because the tested binary was non-PIE, ASLR was absent, and the heap was executable, they jumped to shellcode placed on the heap, dropped a PHP webshell, and later used shellcode to set the SUID bit on \u003ccode\u003e/bin/sh\u003c/code\u003e. They also addressed the problem of NetScaler rebooting after \u003ccode\u003ensppe\u003c/code\u003e crashes by neutralizing signal handlers so \u003ccode\u003epitboss\u003c/code\u003e respawned \u003ccode\u003ensppe\u003c/code\u003e instead of rebooting the whole appliance.\u003c/p\u003e\n"},{"n":3,"title":"APT group HoneyMyte upgrades CoolClient: the backdoor gets a kernel-level Windows rootkit","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/honeymyte-coolclient-driver-rootkit/121028/","time":"09:00","priority":"MUST READ","score":92,"tldr":"HoneyMyte’s CoolClient backdoor has evolved to deploy a signed Windows kernel-mode rootkit that hides and protects its processes, files, registry entries, and some network activity. The updated variant was seen in PlugX-led intrusions against organizations in Asia and Russia, including government targets.","briefOverview":"\u003cp\u003eHoneyMyte, also known as Mustang Panda, has upgraded the CoolClient backdoor with a signed Windows kernel-mode driver that adds rootkit capabilities. The new variant can deploy the driver as a Windows service and communicate with it through IOCTL requests. Kaspersky observed this updated CoolClient variant and its driver in intrusions across multiple countries in Asia, including Pakistan, Mongolia, and Myanmar, and later notes victims in Myanmar, Mongolia, Pakistan, and Russia, including confirmed government entities.\u003c/p\u003e\n\n\u003cp\u003eIn the observed Myanmar campaign, HoneyMyte used PlugX as the initial post-compromise implant before deploying CoolClient. The actor added Microsoft Defender exclusions for a fake Windows Defender installation directory and a renamed sideloader executable, then used a legitimate Sangfor application renamed as defender.exe to sideload the malicious libngs.dll. CoolClient’s execution chain includes libngs.dll as the first-stage loader, loadcert.ini as the second-stage component, and cert.ini as the final-stage implant responsible for C2 communication and backdoor functionality.\u003c/p\u003e\n\n\u003cp\u003eThe new msagent.sys driver hides and protects the CoolClient process, related files, registry entries, and selected network information. It loads configuration from HKLM\\SYSTEM\\RNG, registers process, object, image load, filesystem minifilter, and registry callbacks, and exposes 33 IOCTL handlers, although the analyzed CoolClient sample used only three during normal execution. The article concludes that adding kernel-mode functionality significantly expands CoolClient’s stealth, persistence, and defense-evasion capabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky analyzed a new CoolClient variant attributed to HoneyMyte, also known as Mustang Panda, that can deploy a signed Windows kernel-mode driver as a service and communicate with it through IOCTL requests.","The driver, named msagent.sys, enhances stealth by hiding and protecting the CoolClient process, related files, registry entries, and selected network information such as configured C2 IPv4 addresses.","In observed intrusions, HoneyMyte used PlugX as the initial post-compromise implant before deploying CoolClient components through DLL sideloading with a legitimate Sangfor executable renamed as defender.exe.","The updated CoolClient execution chain includes libngs.dll as a first-stage loader, loadcert.ini as a second-stage component responsible for setup, injection, driver deployment, and persistence, and cert.ini as the final-stage implant for C2 communication and backdoor functionality.","Researchers identified victims in Myanmar, Mongolia, Pakistan, and Russia, including confirmed government entities."],"insights":["The actor added Microsoft Defender exclusions for both the fake Windows Defender directory and the renamed sideloader executable before copying CoolClient components there, making those specific exclusion entries a useful detection lead.","The driver stores and loads its hiding configuration from HKLM\\SYSTEM\\RNG, including values such as Wid_H1deF5Dirs, Wid_H1deRegKeys, Hid_ProtectedImages, Hid_State, and Hid_StealthMode, giving defenders concrete registry locations and names to inspect.","Although the analyzed CoolClient sample normally used only three driver IOCTLs, the driver exposes 33 handlers, including capabilities to hide kernel modules, terminate processes, remove Protected Process Light protection, inject shellcode, and write to arbitrary kernel memory.","The msagent.sys driver was signed with an old certificate issued to Nanjing Ranyi Technology Co., Ltd., and Kaspersky found older malicious drivers signed with the same certificate, but the article states there is no direct evidence linking those older samples to this CoolClient activity.","CoolClient’s driver dynamically finds Windows kernel structure offsets and dynamically assigns a filesystem minifilter altitude, indicating the rootkit was built to operate across different Windows versions and avoid filter registration conflicts."],"referencedReports":[{"title":"A family tree of DLL sideloading cases may be related","url":"https://www.sophos.com/en-us/blog/family-tree-dll-sideloading-cases-may-be-related","publisher":"Sophos","context":"The article cites Sophos as the first public disclosure of CoolClient in 2022.","category":"research","primary":false},{"title":"Earth Preta’s Updated Stealthy Strategies","url":"https://www.trendmicro.com/en_gb/research/23/c/earth-preta-updated-stealthy-strategies.html","publisher":"Trend Micro","context":"The article cites Trend Micro’s 2023 analysis as subsequent research on CoolClient activity.","category":"research","primary":false},{"title":"Calling Local Windows RPC Servers from .NET","url":"https://projectzero.google/2019/12/calling-local-windows-rpc-servers-from.html","publisher":"Google Project Zero","context":"The article references a Google Project Zero write-up when describing CoolClient’s RPC-based process creation technique used during UAC bypass.","category":"research","primary":false}],"body":"\u003cp\u003eHoneyMyte, also known as Mustang Panda, has upgraded the CoolClient backdoor with a signed Windows kernel-mode driver that adds rootkit capabilities. The new variant can deploy the driver as a Windows service and communicate with it through IOCTL requests. Kaspersky observed this updated CoolClient variant and its driver in intrusions across multiple countries in Asia, including Pakistan, Mongolia, and Myanmar, and later notes victims in Myanmar, Mongolia, Pakistan, and Russia, including confirmed government entities.\u003c/p\u003e\n\n\u003cp\u003eIn the observed Myanmar campaign, HoneyMyte used PlugX as the initial post-compromise implant before deploying CoolClient. The actor added Microsoft Defender exclusions for a fake Windows Defender installation directory and a renamed sideloader executable, then used a legitimate Sangfor application renamed as defender.exe to sideload the malicious libngs.dll. CoolClient’s execution chain includes libngs.dll as the first-stage loader, loadcert.ini as the second-stage component, and cert.ini as the final-stage implant responsible for C2 communication and backdoor functionality.\u003c/p\u003e\n\n\u003cp\u003eThe new msagent.sys driver hides and protects the CoolClient process, related files, registry entries, and selected network information. It loads configuration from HKLM\\SYSTEM\\RNG, registers process, object, image load, filesystem minifilter, and registry callbacks, and exposes 33 IOCTL handlers, although the analyzed CoolClient sample used only three during normal execution. The article concludes that adding kernel-mode functionality significantly expands CoolClient’s stealth, persistence, and defense-evasion capabilities.\u003c/p\u003e\n"},{"n":1,"title":"Data analyst sent to prison for stealing data, extorting employer","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/data-analyst-sent-to-prison-for-stealing-data-extorting-employer/","time":"08:27","priority":"MAY READ","score":68,"tldr":"A former Brightly Software contractor was sentenced to two years in prison for stealing employee payroll and personal data, then trying to extort the company for $2.5 million in cryptocurrency. Brightly paid a small Bitcoin amount before the FBI traced the scheme to him and seized evidence from his home.","briefOverview":"\u003cp\u003eA former data analyst contractor for Brightly Software, 27-year-old North Carolina man Cameron Curry, also known as “Loot,” was sentenced to two years in prison for targeting his employer in a $2.5 million extortion scheme. Brightly is a Software-as-a-Service company formerly known as SchoolDude, acquired by Siemens in August 2022, and provides asset management and maintenance software to more than 12,000 clients worldwide. Curry was found guilty in March of orchestrating what prosecutors described as an extensive cyber extortion scheme against the company.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Curry stole sensitive documents after gaining access to Brightly’s payroll information and corporate data, then used the information to extort the company after learning his six-month contract would not be extended. One day after his contract ended on December 10, he began emailing dozens of Brightly employees under the Loot alias and using the lootsoftware@outlook.com address. Between December 11, 2023, and January 24, 2024, the emails threatened to leak the stolen information unless Brightly paid a $2.5 million ransom in cryptocurrency.\u003c/p\u003e\n\n\u003cp\u003eThe extortion messages included screenshots of employees’ personally identifiable information, including names, dates of birth, home addresses, and compensation information. Curry also threatened to report Brightly to the U.S. Securities and Exchange Commission for not reporting the breach, and Brightly paid $7,540 in Bitcoin to a wallet controlled by him. After Brightly reported the incident to law enforcement, the FBI searched Curry’s residence on January 24 and seized electronic devices containing evidence linking him to the scheme.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former Brightly Software data analyst contractor Cameron Curry was sentenced to two years in prison for targeting the company in a $2.5 million extortion scheme.","Curry stole sensitive documents after gaining access to Brightly’s payroll information and corporate data, then used the alias “Loot” to email employees with threats to leak the data.","The extortion emails included screenshots of employees’ personally identifiable information, including names, dates of birth, home addresses, and compensation information.","Brightly paid $7,540 in Bitcoin to a cryptocurrency wallet controlled by Curry after receiving multiple extortion emails.","The FBI searched Curry’s residence on January 24 and seized electronic devices containing evidence that linked him to the extortion scheme."],"insights":["The extortion began one day after Curry’s contract ended, making the end of his contractor relationship a central timing detail in the case.","Curry’s threats combined employee privacy exposure with regulatory pressure, including a threat to report Brightly to the SEC for allegedly failing to disclose the breach.","Brightly paid only $7,540 in Bitcoin despite the $2.5 million ransom demand, and the article says the wallet was controlled by Curry.","The article distinguishes this case from Brightly’s May 2023 SchoolDude data breach, stating that the earlier incident was unrelated."],"referencedReports":[],"body":"\u003cp\u003eA former data analyst contractor for Brightly Software, 27-year-old North Carolina man Cameron Curry, also known as “Loot,” was sentenced to two years in prison for targeting his employer in a $2.5 million extortion scheme. Brightly is a Software-as-a-Service company formerly known as SchoolDude, acquired by Siemens in August 2022, and provides asset management and maintenance software to more than 12,000 clients worldwide. Curry was found guilty in March of orchestrating what prosecutors described as an extensive cyber extortion scheme against the company.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Curry stole sensitive documents after gaining access to Brightly’s payroll information and corporate data, then used the information to extort the company after learning his six-month contract would not be extended. One day after his contract ended on December 10, he began emailing dozens of Brightly employees under the Loot alias and using the lootsoftware@outlook.com address. Between December 11, 2023, and January 24, 2024, the emails threatened to leak the stolen information unless Brightly paid a $2.5 million ransom in cryptocurrency.\u003c/p\u003e\n\n\u003cp\u003eThe extortion messages included screenshots of employees’ personally identifiable information, including names, dates of birth, home addresses, and compensation information. Curry also threatened to report Brightly to the U.S. Securities and Exchange Commission for not reporting the breach, and Brightly paid $7,540 in Bitcoin to a wallet controlled by him. After Brightly reported the incident to law enforcement, the FBI searched Curry’s residence on January 24 and seized electronic devices containing evidence linking him to the scheme.\u003c/p\u003e\n"}]</script>
