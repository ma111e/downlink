<script type="application/json" id="dl-articles">[{"n":1,"title":"21st September – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/21st-september-threat-intelligence-report/","time":"23:13","priority":"MAY READ","score":40,"tldr":"This weekly threat intelligence report highlights major breaches, active cyber campaigns, AI-enabled threats, and critical vulnerabilities requiring urgent patching, including actively exploited Cisco ISE flaws. Key developments include North Korea-linked WaterPlum activity, supply-chain compromise affecting Brevo websites, and large-scale data exposure incidents in Japan.","briefOverview":"\u003cp\u003eThe 21 September threat intelligence report covers major breaches, cyber campaigns, AI-related threats, and security updates. Japan’s Digital Agency said a VPN appliance flaw exposed about 246,000 records, while Helpfeel reported that a vulnerable Gyazo image-upload server exposed more than 23 million user records and 490 million image-metadata records. Cyberattacks also disrupted onboard systems on two oil tankers traveling to Texas, and Brevo reported that a compromised Cloudflare API key was used to place malicious ClickFix scripts on roughly 100,000 websites. These incidents affected government-related systems, online services, websites, and maritime operations.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI as both a tool used by attackers and a target for attack, citing AI-assisted ransomware activity, criminal markets for stolen model access, and flaws affecting coding agents and enterprise copilots. It also describes Luciferus, an underground AI service capable of generating simple remote-access trojan code, and BragJack, which used malicious browser extensions to hijack AI assistants. Several major patches are covered, including Cisco fixes for CVE-2026-76460 and CVE-2026-76461, with Cisco aware of active exploitation of the former. Threat research also identified North Korea-linked WaterPlum activity, FamousSparrow espionage using the SparroWocky backdoor, Handala-linked HEAVYGRAM surveillance malware, and GhostCode phishing that abuses Microsoft’s device authorization flow to gain persistent account access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Japan’s Digital Agency confirmed that attackers exploited a VPN appliance flaw, exposing approximately 246,000 records containing names and contact details of government officials and contractors.","Brevo said a compromised Cloudflare API key was used to inject malicious ClickFix scripts into about 100,000 websites that use Brevo components.","US, Japanese, Australian, and German authorities warned that the North Korea-linked WaterPlum campaign infected at least 30,000 devices in more than 100 countries and stole funds or credentials from over 7,000 cryptocurrency wallets.","Cisco addressed CVE-2026-76460 and CVE-2026-76461, critical flaws in Cisco ISE and Secure Email Gateway, and stated that CVE-2026-76460 is under active exploitation.","Researchers identified GhostCode as a phishing kit that abuses Microsoft’s device authorization process to capture tokens and obtain persistent Microsoft 365 account access without stealing passwords or directly bypassing multi-factor authentication."],"insights":["A compromised Cloudflare API key enabled attackers to affect about 100,000 websites through Brevo components, showing how access to one service-provider credential can spread harmful content across many unrelated sites.","GhostCode can give attackers lasting Microsoft 365 access by capturing authorization tokens through the legitimate device sign-in process, without needing the victim’s password or directly defeating multi-factor authentication.","Cisco reported active exploitation of CVE-2026-76460, making its patch especially time-sensitive compared with vulnerabilities that are only known to exist.","The report describes AI as both an attacker tool and a target: it is being used to support intrusions while coding assistants and enterprise copilots are also subject to security weaknesses."],"referencedReports":[{"title":"Uncensored Luciferus AI Service Advertised Underground","url":"https://www.sophos.com/en-us/blog/uncensored-luciferus-ai-service-advertised-underground","publisher":"sophos","context":"Sophos researchers examined the Luciferus uncensored AI service and found it could generate code for a simple remote-access trojan.","category":"research","primary":false},{"title":"BragJack: Hijacking 5 Browsers via Built-in AI Assistants","url":"https://forever.security/blog/bragjack-hijacking-5-browsers-via-built-in-ai-assistants?utm_source=gemini","publisher":"forever-security","context":"Researchers presented BragJack, an attack using malicious browser extensions to force prompts through trusted browser channels and hijack AI assistants.","category":"research","primary":false},{"title":"WaterPlum (Contagious Interview) Cybersecurity Advisory","url":"https://www.ic3.gov/CSA/2026/260918.pdf","publisher":"us-japanese-australian-and-german-authorities","context":"Authorities warned about the North Korea-linked WaterPlum campaign, which infected at least 30,000 devices across more than 100 countries.","category":"advisory","primary":false},{"title":"Beware SparroWocky: Backdoor Bites Commands, Catch","url":"https://www.welivesecurity.com/en/eset-research/beware-sparrowock-backdoor-bites-commands-catch/","publisher":"eset","context":"ESET researchers outlined a FamousSparrow espionage campaign using the SparroWocky backdoor against government entities in Latin America and a telecommunications organization in Puerto Rico.","category":"research","primary":false},{"title":"HEAVYGRAM: Handala Hack Telegram C2","url":"https://www.group-ib.com/blog/heavygram-handala-hack-telegram-c2/","publisher":"group-ib","context":"Group-IB researchers revealed the HEAVYGRAM Windows surveillance backdoor, l
