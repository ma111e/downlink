<script type="application/json" id="dl-articles">[{"n":2,"title":"New AmnesiaStealer macOS malware hijacks browser sessions via remote control","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-amnesiastealer-macos-malware-hijacks-browser-sessions-via-remote-control/","time":"15:07","priority":"SHOULD READ","score":82,"tldr":"AmnesiaStealer is a new macOS infostealer spread through ClickFix lures that can copy victims’ Chromium browser profiles and let attackers remotely control hidden, authenticated browser sessions. This gives hackers live access to accounts using the victim’s existing cookies, device, and network context, going beyond ordinary data theft.","briefOverview":"\u003cp\u003eA new information-stealing malware called AmnesiaStealer is targeting macOS users through ClickFix campaigns that use a fake GitHub download page. The lure drops a password-protected ZIP archive containing the AmnesiaStealer Mach-O payload. Jamf researchers found that the campaign used the same template previously used to spread the Atomic and MacSync infostealers.\u003c/p\u003e\n\n\u003cp\u003eAmnesiaStealer can capture the victim’s macOS password and use it to collect keychain data, browser profiles, Apple Notes, Telegram sessions, documents, system information, and cryptocurrency wallet data. It can exfiltrate cookies, saved logins, browsing history, bookmarks, extensions, local state, and other profile data from 16 Chromium-based browsers. The malware also identifies cryptocurrency wallet details by enumerating extensions and IndexedDB data.\u003c/p\u003e\n\n\u003cp\u003eA notable feature is its stream_module, retrieved through the remote_stream command, which lets an operator remotely control authenticated browser sessions from a hidden headless browser instance. The module can duplicate user profiles from Google Chrome, Microsoft Edge, Vivaldi, Arc, Opera, Brave, and Chromium, then connect to the operator through WebSocket channels and the Chrome DevTools Protocol. Jamf said this turns an infected host into a live, operator-driven browser using the victim’s authenticated sessions, and users are advised not to run terminal commands found online unless they fully understand them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AmnesiaStealer is a new macOS information-stealing malware distributed through ClickFix campaigns that use a fake GitHub download page to deliver a password-protected ZIP archive.","The malware can collect data from 16 Chromium-based browsers, as well as passwords, cryptocurrency wallets, Apple Notes, documents, keychain data, Telegram sessions, system information, and browser profiles.","Jamf researchers found that AmnesiaStealer includes a stream_module retrieved with the remote_stream command that gives operators remote control over authenticated sessions from a headless browser instance.","The stream_module can duplicate user profiles from Google Chrome, Microsoft Edge, Vivaldi, Arc, Opera, Brave, and Chromium because they share the same DevTools Protocol, launch flags, and cookie encryption.","Jamf said AmnesiaStealer appears to be the first documented macOS malware to combine a cloned Chromium profile with Chrome DevTools Protocol-based live remote control through a hidden browser running on the infected computer."],"insights":["AmnesiaStealer’s live browser control is materially more dangerous than ordinary file theft because it lets the attacker use the victim’s existing logged-in sessions while preserving the victim’s browser, host, and network identifiers.","The malware’s browser-control feature works across multiple Chromium-based browsers because they share the Chrome DevTools Protocol, launch flags, and cookie encryption, so switching among those browsers does not avoid this technique.","On macOS 26, AmnesiaStealer has a fallback that can replace Chrome’s Safe Storage key with an attacker-supplied value, making previously stored cookies and passwords permanently unreadable while allowing the attacker to decrypt data later.","The campaign’s fake GitHub ClickFix lure reused a template previously used to spread Atomic and MacSync infostealers, showing that familiar-looking download pages and copied campaign templates remain a practical delivery method.","The article’s clearest user-facing mitigation is to avoid running terminal commands found online unless the user fully understands them, because the ClickFix command is what executes the loader that installs the malware."],"referencedReports":[{"title":"Amnesia Stealer: macOS Infostealer ClickFix","url":"https://www.jamf.com/blog/amnesia-stealer-macos-infostealer-clickfix/","publisher":"Jamf","context":"The article cites Jamf researchers’ analysis of AmnesiaStealer’s distribution and stream_module capabilities, including its remote control of authenticated browser sessions.","category":"research","primary":true}],"body":"\u003cp\u003eA new information-stealing malware called AmnesiaStealer is targeting macOS users through ClickFix campaigns that use a fake GitHub download page. The lure drops a password-protected ZIP archive containing the AmnesiaStealer Mach-O payload. Jamf researchers found that the campaign used the same template previously used to spread the Atomic and MacSync infostealers.\u003c/p\u003e\n\n\u003cp\u003eAmnesiaStealer can capture the victim’s macOS password and use it to collect keychain data, browser profiles, Apple Notes, Telegram sessions, documents, system information, and cryptocurrency wallet data. It can exfiltrate cookies, saved logins, browsing history, bookmarks, extensions, local state, and other profile data from 16 Chromium-based browsers. The malware also identifies cryptocurrency wallet details by enumerating extensions and IndexedDB data.\u003c/p\u003e\n\n\u003cp\u003eA notable feature is its stream_module, retrieved through the remote_stream command, which lets an operator remotely control authenticated browser sessions from a hidden headless browser instance. The module can duplicate user profiles from Google Chrome, Microsoft Edge, Vivaldi, Arc, Opera, Brave, and Chromium, then connect to the operator through WebSocket channels and the Chrome DevTools Protocol. Jamf said this turns an infected host into a live, operator-driven browser using the victim’s authenticated sessions, and users are advised not to run terminal commands found online unless they fully understand them.\u003c/p\u003e\n"},{"n":1,"title":"Large-scale DDoS attacks disrupted Threema secure messaging service","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/large-scale-ddos-attacks-disrupted-threema-secure-messaging-service/","time":"17:29","priority":"MAY READ","score":72,"tldr":"Threema suffered severe service disruptions after large-scale DDoS attacks hit its infrastructure and colocation partner, with attackers repeatedly changing tactics to evade mitigation. The company has added specialized upstream DDoS protection to reduce the risk of similar outages.","briefOverview":"\u003cp\u003eMultiple distributed denial-of-service attacks targeted the Threema secure messaging service earlier this week, causing severe disruptions to communications. Users began reporting service interruptions on Tuesday around 6 PM UTC, and Threema initially said the cause appeared to be a network outage at its colocation partner. Users in Switzerland, India, and China continued to report problems the next day, and Threema later confirmed it was facing a series of DDoS attacks.\u003c/p\u003e\n\n\u003cp\u003eThreema said the attacks were large-scale and targeted both its own service and its colocation partner, Nine. The company said it was not entirely clear whether Threema was the primary target or whether the attacks were directed at multiple targets. Organizations using Threema On-Prem did not experience issues because they rely on their own infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe company said the attacks were difficult to defend against because they persisted for an extended period and the threat actor continually changed tactics to circumvent mitigation measures. An unrelated technical issue also prevented Threema from updating its current system status page, leading the company to take it offline until the problem was fixed. To reduce the chance of similar incidents, Threema implemented specialized DDoS protection to filter attack traffic upstream and reduce load on its infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Multiple distributed denial-of-service attacks targeted the Threema secure messaging service earlier this week, causing severe disruptions to communications.","Threema said the attacks were difficult to defend against because the threat actor persisted for an extended period and continually changed tactics to circumvent mitigation measures.","The attacks targeted both Threema and its colocation partner, Nine, and Threema said it was not entirely clear whether it was the primary target or one of multiple targets.","Organizations using Threema On-Prem did not experience issues because they rely on their own infrastructure.","Threema implemented specialized DDoS protection to filter attack traffic upstream and reduce the load on its infrastructure."],"insights":["Threema’s status page showed no problems while users were still reporting outages because an unrelated technical issue prevented the company from updating the current system status page.","Organizations using Threema On-Prem avoided the disruption because their service depended on their own infrastructure rather than Threema’s affected infrastructure.","The attacks against both Threema and its colocation partner Nine made it unclear whether Threema was the primary target or affected as part of a broader campaign.","Threema added specialized upstream DDoS protection after the incident, indicating its existing defenses were not sufficient for this large-scale, shifting attack pattern."],"referencedReports":[],"body":"\u003cp\u003eMultiple distributed denial-of-service attacks targeted the Threema secure messaging service earlier this week, causing severe disruptions to communications. Users began reporting service interruptions on Tuesday around 6 PM UTC, and Threema initially said the cause appeared to be a network outage at its colocation partner. Users in Switzerland, India, and China continued to report problems the next day, and Threema later confirmed it was facing a series of DDoS attacks.\u003c/p\u003e\n\n\u003cp\u003eThreema said the attacks were large-scale and targeted both its own service and its colocation partner, Nine. The company said it was not entirely clear whether Threema was the primary target or whether the attacks were directed at multiple targets. Organizations using Threema On-Prem did not experience issues because they rely on their own infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe company said the attacks were difficult to defend against because they persisted for an extended period and the threat actor continually changed tactics to circumvent mitigation measures. An unrelated technical issue also prevented Threema from updating its current system status page, leading the company to take it offline until the problem was fixed. To reduce the chance of similar incidents, Threema implemented specialized DDoS protection to filter attack traffic upstream and reduce load on its infrastructure.\u003c/p\u003e\n"}]</script>
