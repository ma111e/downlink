<script type="application/json" id="dl-articles">[{"n":6,"title":"Compromised npm Packages: @joyfill/components and @joyfill/layouts Ship an Obfuscated Remote Access Trojan","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/joyfill-npm-supply-chain-compromise","time":"17:03","priority":"MUST READ","score":95,"tldr":"Malicious beta releases of @joyfill/components and @joyfill/layouts on npm contained an obfuscated import-time remote access trojan that could steal developer credentials and persist in common developer tools. Anyone who installed the affected 2773 prerelease versions should treat the environment as compromised, remove them, reinstall clean dependencies, and rotate exposed credentials.","briefOverview":"\u003cp\u003eOn July 28, 2026, malicious beta versions of the Joyfill npm packages \u003ccode\u003e@joyfill/components\u003c/code\u003e and \u003ccode\u003e@joyfill/layouts\u003c/code\u003e were published to the npm registry. The affected versions were \u003ccode\u003e@joyfill/components\u003c/code\u003e 4.0.0-rc24-2773-beta.4, beta.5, and beta.6, and \u003ccode\u003e@joyfill/layouts\u003c/code\u003e 0.1.2-2773.beta.0, beta.1, and beta.2. StepSecurity says the packages are legitimate projects that were hijacked, and that the malicious code appears only in the published tarballs. The article rates the issue as Critical and says any repositories, CI/CD pipelines, or developer machines that installed the 2773 prereleases should be treated as compromised.\u003c/p\u003e\n\n\u003cp\u003eThe payload was injected into built distribution bundles and runs when an application imports the package, rather than during installation, so \u003ccode\u003enpm install --ignore-scripts\u003c/code\u003e does not stop it. The code exposes Node.js \u003ccode\u003erequire\u003c/code\u003e and \u003ccode\u003emodule\u003c/code\u003e on the global object, uses obfuscation, resolves a command and control server through public blockchain transactions, opens a Socket.IO remote access channel, and stages a Python credential stealer. The trojan includes commands for host information, file upload and download, directory listing, and arbitrary code execution, and it attempts persistence by modifying files used by developer tools such as VS Code, Cursor, Discord, GitHub Desktop, and the global npm CLI. The article recommends removing the compromised versions, pinning to known good releases, reinstalling from a clean lockfile, inspecting affected developer tool files, reviewing network logs, and rotating credentials that were present on affected machines.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On July 28, 2026, malicious beta versions of the Joyfill npm packages @joyfill/components and @joyfill/layouts were published to the npm registry.","The malicious code was injected into built distribution bundles and runs when an application imports the package, so npm install --ignore-scripts does not prevent execution.","The payload exposes Node.js require and module on the global object, resolves a command and control server through a public blockchain transaction, opens a Socket.IO remote access channel, and stages a Python credential stealer.","Affected versions include @joyfill/components 4.0.0-rc24-2773-beta.4 through beta.6 and @joyfill/layouts 0.1.2-2773.beta.0 through beta.2.","The article advises anyone who installed the affected 2773 prerelease versions to treat those environments as compromised, remove the versions, pin to known good releases, reinstall from a clean lockfile, and rotate exposed credentials."],"insights":["Using npm install --ignore-scripts would not have stopped this compromise because the payload was embedded in the package entry bundles and triggered only when the package was imported.","The malicious code appeared only in the published tarballs and not in matching source changes, making comparison against clean sibling releases an important way to confirm the injection.","The payload used blockchain transactions to discover its live command and control server, allowing the operator to avoid placing the real server address directly in the package.","The campaign specifically targeted developer workstations by inserting persistence into tools such as VS Code, Cursor, Discord, GitHub Desktop, and the global npm CLI.","StepSecurity’s sandbox detonation did not observe live C2 traffic, but the article attributes this to the likely takedown of the operator’s C2 and on-chain configuration after public disclosure."],"referencedReports":[{"title":"Joyfill npm Beta Releases Compromised","url":"https://socket.dev/blog/joyfill-npm-beta-releases-compromised","publisher":"Socket","context":"The article credits Socket’s research team for the initial analysis of the Joyfill npm package compromise and links to their writeup in the references.","category":"research","primary":true}],"body":"\u003cp\u003eOn July 28, 2026, malicious beta versions of the Joyfill npm packages \u003ccode\u003e@joyfill/components\u003c/code\u003e and \u003ccode\u003e@joyfill/layouts\u003c/code\u003e were published to the npm registry. The affected versions were \u003ccode\u003e@joyfill/components\u003c/code\u003e 4.0.0-rc24-2773-beta.4, beta.5, and beta.6, and \u003ccode\u003e@joyfill/layouts\u003c/code\u003e 0.1.2-2773.beta.0, beta.1, and beta.2. StepSecurity says the packages are legitimate projects that were hijacked, and that the malicious code appears only in the published tarballs. The article rates the issue as Critical and says any repositories, CI/CD pipelines, or developer machines that installed the 2773 prereleases should be treated as compromised.\u003c/p\u003e\n\n\u003cp\u003eThe payload was injected into built distribution bundles and runs when an application imports the package, rather than during installation, so \u003ccode\u003enpm install --ignore-scripts\u003c/code\u003e does not stop it. The code exposes Node.js \u003ccode\u003erequire\u003c/code\u003e and \u003ccode\u003emodule\u003c/code\u003e on the global object, uses obfuscation, resolves a command and control server through public blockchain transactions, opens a Socket.IO remote access channel, and stages a Python credential stealer. The trojan includes commands for host information, file upload and download, directory listing, and arbitrary code execution, and it attempts persistence by modifying files used by developer tools such as VS Code, Cursor, Discord, GitHub Desktop, and the global npm CLI. The article recommends removing the compromised versions, pinning to known good releases, reinstalling from a clean lockfile, inspecting affected developer tool files, reviewing network logs, and rotating credentials that were present on affected machines.\u003c/p\u003e\n"},{"n":5,"title":"Two Joyfill npm Beta Releases Compromised to Deliver DEV#POPPER Remote Access Trojan","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/joyfill-npm-beta-releases-compromised?utm_medium=feed","time":"14:34","priority":"MUST READ","score":92,"tldr":"Two beta releases of Joyfill npm packages were compromised with an import-time implant that uses blockchain transactions to retrieve payloads and ultimately deploys a DEV#POPPER remote access trojan. Any system that imported the affected versions should be treated as potentially compromised, with credentials rotated and hosts investigated for persistence and C2 activity.","briefOverview":"\u003cp\u003eTwo beta releases in the \u003ccode\u003e@joyfill\u003c/code\u003e npm namespace, \u003ccode\u003e@joyfill/layouts@0.1.2-2773.beta.0\u003c/code\u003e and \u003ccode\u003e@joyfill/components@4.0.0-rc24-2773-beta.4\u003c/code\u003e, contained a malicious JavaScript implant. The implant runs when the package is loaded, not through an npm install lifecycle hook, so \u003ccode\u003enpm install --ignore-scripts\u003c/code\u003e does not prevent execution after import. Joyfill packages are used for embedding forms, documents, and PDFs into web and mobile applications, and the affected releases were beta versions.\u003c/p\u003e\n\n\u003cp\u003eStatic analysis found that the primary branch of the implant resolves encrypted code through Tron, Aptos, and BNB Smart Chain transactions and reaches a recovered 77 KB Node.js remote-access trojan. A parallel branch launches a detached Node.js process, requests a boot payload from \u003ccode\u003e23[.]27[.]13[.]43/$/boot\u003c/code\u003e, sends the marker header \u003ccode\u003eSec-V: A9-0135-3\u003c/code\u003e, decrypts the response, and evaluates it. The loader has PolinRider-family indicators, while the recovered final JavaScript matches DEV#POPPER malware-family behaviors and command patterns described in the article.\u003c/p\u003e\n\n\u003cp\u003eThe recovered payload can collect host information, establish a Socket.IO remote-control channel, execute supplied JavaScript or shell commands, upload files, read clipboard data, and modify developer-tool files for persistence. The article says any machine that imported the affected versions should be treated as potentially compromised, including development environments, CI runners, test tooling, server-side rendering systems, and build systems. Recommended actions include removing the affected versions from lockfiles, caches, mirrors, build images, and deployment artifacts; pinning to verified earlier versions; isolating affected hosts; preserving logs and dependency artifacts; and rotating reachable credentials from a separate uncompromised machine.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Two beta releases, @joyfill/layouts@0.1.2-2773.beta.0 and @joyfill/components@4.0.0-rc24-2773-beta.4, contained a malicious JavaScript implant that runs when the package is loaded rather than during installation.","The @joyfill/layouts implant can retrieve encrypted code through Tron, Aptos, and BNB Smart Chain transactions and reaches a recovered 77 KB Node.js remote-access trojan.","The recovered final payload can collect host information, open a Socket.IO remote-control channel, execute supplied JavaScript or shell commands, upload files, read clipboard data, and modify developer-tool files for persistence.","The @joyfill/components release contained the same malicious injection in multiple bundled files, but its published Rollup bundle limited normal execution by preventing the loader from resolving network dependencies.","The article recommends treating any machine that imported the affected versions as potentially compromised, isolating the host, preserving logs and dependency artifacts, and rotating reachable credentials from a separate uncompromised machine."],"insights":["The compromise bypasses the common protection of using npm install --ignore-scripts because the implant runs when the module is imported, not during package installation.","The payload selection can be changed without publishing a new npm package because the loader retrieves pointers and encrypted code through public blockchain transactions.","The two affected packages’ weekly download counts overlap because @joyfill/components depends on @joyfill/layouts, and the affected versions were beta releases, so overall package popularity does not indicate how many users installed the compromised versions.","Source maps attribute the injected code to bundled source files, showing the implant was present at build time rather than added only to the final npm tarball.","The detached Node.js branch can keep running after the importing build, test, or command exits, making short-lived development or CI activity still capable of leaving an active malicious process behind."],"referencedReports":[],"body":"\u003cp\u003eTwo beta releases in the \u003ccode\u003e@joyfill\u003c/code\u003e npm namespace, \u003ccode\u003e@joyfill/layouts@0.1.2-2773.beta.0\u003c/code\u003e and \u003ccode\u003e@joyfill/components@4.0.0-rc24-2773-beta.4\u003c/code\u003e, contained a malicious JavaScript implant. The implant runs when the package is loaded, not through an npm install lifecycle hook, so \u003ccode\u003enpm install --ignore-scripts\u003c/code\u003e does not prevent execution after import. Joyfill packages are used for embedding forms, documents, and PDFs into web and mobile applications, and the affected releases were beta versions.\u003c/p\u003e\n\n\u003cp\u003eStatic analysis found that the primary branch of the implant resolves encrypted code through Tron, Aptos, and BNB Smart Chain transactions and reaches a recovered 77 KB Node.js remote-access trojan. A parallel branch launches a detached Node.js process, requests a boot payload from \u003ccode\u003e23[.]27[.]13[.]43/$/boot\u003c/code\u003e, sends the marker header \u003ccode\u003eSec-V: A9-0135-3\u003c/code\u003e, decrypts the response, and evaluates it. The loader has PolinRider-family indicators, while the recovered final JavaScript matches DEV#POPPER malware-family behaviors and command patterns described in the article.\u003c/p\u003e\n\n\u003cp\u003eThe recovered payload can collect host information, establish a Socket.IO remote-control channel, execute supplied JavaScript or shell commands, upload files, read clipboard data, and modify developer-tool files for persistence. The article says any machine that imported the affected versions should be treated as potentially compromised, including development environments, CI runners, test tooling, server-side rendering systems, and build systems. Recommended actions include removing the affected versions from lockfiles, caches, mirrors, build images, and deployment artifacts; pinning to verified earlier versions; isolating affected hosts; preserving logs and dependency artifacts; and rotating reachable credentials from a separate uncompromised machine.\u003c/p\u003e\n"},{"n":4,"title":"24,650 Internet-Exposed BMCs Disclose IPMI Password Hashes Before Login","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/24650-internet-exposed-bmcs-disclose.html","time":"14:41","priority":"SHOULD READ","score":88,"tldr":"Researchers found 24,650 internet-exposed BMC/IPMI interfaces leaking password-derived hashes before login due to the unpatchable IPMI v2.0 flaw CVE-2013-4786, enabling fast offline password cracking. Organizations should remove IPMI from the public internet, block UDP 623, and rotate factory/default BMC passwords.","briefOverview":"\u003cp\u003eCybersecurity researchers at Lava found 36,872 internet-exposed server-management interfaces running IPMI, with 24,650 disclosing password-derived authentication hashes before login. The issue is tied to CVE-2013-4786, a high-severity information disclosure flaw in the IPMI v2.0 specification. Dell has said the problem is inherent to IPMI v2.0 and has no patch.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows an unauthenticated remote party that can reach UDP port 623 to request an authentication response and test password guesses offline. Lava said more than 30% of returned hashes were associated with passwords recoverable using common wordlists and predictable factory chassis-sticker formats. The exposure affected modern Supermicro and HPE servers operated by GPU providers, including systems still using factory-issued passwords.\u003c/p\u003e\n\n\u003cp\u003eBMCs can control power, firmware, remote console access, operating system installation, and system recovery, and they run independently of the host operating system. Lava warned that in modern AI data centers, a single exposed BMC could potentially put multiple organizations’ workloads at risk through shared infrastructure or lateral movement. Recommended mitigations include blocking UDP port 623, rotating factory-issued passwords, disabling legacy or weak IPMI options, restricting BMC access to a private management network, and applying network access controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lava found 36,872 internet-exposed server-management interfaces running IPMI, and 24,650 of them disclosed password-derived authentication hashes before login.","The exposure is tied to CVE-2013-4786, an information disclosure flaw in the IPMI v2.0 specification that allows remote attackers to obtain password hashes and perform offline password guessing attacks.","More than 30% of the returned hashes were associated with passwords recoverable using common wordlists and predictable factory chassis-sticker formats, according to researcher Michael Katchinskiy.","Lava said the exposure affected modern Supermicro and HPE servers operated by GPU providers, including systems still using factory-issued passwords.","Recommended mitigations include blocking UDP port 623 at the network edge, rotating factory-issued passwords during provisioning, restricting BMC access to a private management network, and disabling legacy or weak options such as IPMI 1.5."],"insights":["Dell’s advisory says the hash disclosure issue is inherent to the IPMI v2.0 specification and has no patch, making exposure reduction and access control more important than waiting for a software fix.","Lava’s tests found that HPE iLO factory passwords could be recovered within a minute on modern GPU hardware, while Supermicro factory passwords could be recovered in about an hour despite being uniquely assigned.","A significant subset of exposed BMCs returned authentication material even for an empty username, with 6,240 matching a weak password candidate.","The risk is amplified in modern AI data centers because a single exposed BMC in a shared bare-metal environment can potentially put multiple tenants’ workloads at risk.","The article notes evidence that threat actors are already targeting exposed BMC interfaces, including ransomware operators leaving an extortion note on an HPE iLO 4 login page."],"referencedReports":[{"title":"BMC Exposure Alert","url":"https://lavahq.io/research/bmc-exposure-alert","publisher":"Lava","context":"The article is based on Lava’s report finding 36,872 internet-exposed IPMI interfaces, including 24,650 that disclose password-derived authentication hashes before login.","category":"research","primary":true},{"title":"Data Domain: IPMI v2.0 Password Hash Disclosure","url":"https://www.dell.com/support/kbdoc/en-us/000222162/data-domain-ipmi-v2-0-password-hash-disclosure","publisher":"Dell","context":"The article cites Dell’s advisory stating that the IPMI v2.0 password hash disclosure is inherent to the specification and has no patch.","category":"advisory","primary":false}],"body":"\u003cp\u003eCybersecurity researchers at Lava found 36,872 internet-exposed server-management interfaces running IPMI, with 24,650 disclosing password-derived authentication hashes before login. The issue is tied to CVE-2013-4786, a high-severity information disclosure flaw in the IPMI v2.0 specification. Dell has said the problem is inherent to IPMI v2.0 and has no patch.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows an unauthenticated remote party that can reach UDP port 623 to request an authentication response and test password guesses offline. Lava said more than 30% of returned hashes were associated with passwords recoverable using common wordlists and predictable factory chassis-sticker formats. The exposure affected modern Supermicro and HPE servers operated by GPU providers, including systems still using factory-issued passwords.\u003c/p\u003e\n\n\u003cp\u003eBMCs can control power, firmware, remote console access, operating system installation, and system recovery, and they run independently of the host operating system. Lava warned that in modern AI data centers, a single exposed BMC could potentially put multiple organizations’ workloads at risk through shared infrastructure or lateral movement. Recommended mitigations include blocking UDP port 623, rotating factory-issued passwords, disabling legacy or weak IPMI options, restricting BMC access to a private management network, and applying network access controls.\u003c/p\u003e\n"},{"n":2,"title":"India’s Bank of Baroda confirms cyber incident after hackers claim data theft","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/india-bank-of-baroda-reports-cybersecurity-incident","time":"14:45","priority":"SHOULD READ","score":82,"tldr":"India’s Bank of Baroda confirmed a cyber incident involving a compromised employee email account after hackers claimed to have stolen and leaked sensitive banking data. The bank says its core banking systems were not affected, but it has not confirmed whether customer data was exfiltrated.","briefOverview":"\u003cp\u003eIndia’s Bank of Baroda reported a cybersecurity incident after a threat actor claimed to have stolen and published sensitive banking data. The bank said an employee’s email account was compromised, allowing unauthorized access to “certain data.” It said the incident was detected and contained immediately, and that its core banking systems were not accessed or affected.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure followed claims from cybersecurity researchers tracking dark web activity that an unidentified hacker had breached the bank and leaked customer information, corporate banking records, internal emails, loan documents, and audit files on a darknet forum. The authenticity of the purported leaked data could not be independently verified. Bank of Baroda did not comment on the hackers’ claims, did not say whether customer data had been exfiltrated, and did not attribute the incident to any specific hacking group.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the threat actor, using the name “leak-king-F,” advertised the data for sale on a darknet marketplace and directed prospective buyers to a Telegram channel. The article describes the incident as the latest in a series affecting major financial institutions and companies across Asia. It also cites recent incidents involving Thailand’s Securities Depository, contractors working on India’s largest nuclear power project, and Tata Electronics.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bank of Baroda said an employee's email account was compromised, allowing unauthorized access to certain data.","The bank said it detected and contained the incident immediately and that its core banking systems were not accessed or affected.","Multiple cybersecurity researchers said an unidentified hacker claimed to have breached the bank and leaked customer information, corporate banking records, internal emails, loan documents, and audit files on a darknet forum.","Bank of Baroda did not comment on the hackers' claims, did not say whether customer data was exfiltrated, and did not attribute the incident to any specific hacking group.","Researchers said the threat actor using the name \"leak-king-F\" advertised the data for sale on a darknet marketplace and directed prospective buyers to a Telegram channel."],"insights":["The bank’s confirmed scope is narrower than the hacker’s claim: Bank of Baroda only acknowledged compromise of an employee email account and access to certain data, while researchers reported claims involving customer information, corporate banking records, internal emails, loan documents, and audit files.","Bank of Baroda’s statement leaves a major unresolved issue for customers because it says core banking systems were unaffected but does not say whether any customer data was taken.","The reported sale of the alleged data on a darknet marketplace with buyers directed to Telegram shows the incident is not only a data exposure claim but also an attempted monetization of the alleged stolen files.","The article places the Bank of Baroda incident within a broader regional pattern, citing recent claimed or confirmed data incidents affecting Thailand’s Securities Depository, India’s nuclear project contractors, and Tata Electronics."],"referencedReports":[],"body":"\u003cp\u003eIndia’s Bank of Baroda reported a cybersecurity incident after a threat actor claimed to have stolen and published sensitive banking data. The bank said an employee’s email account was compromised, allowing unauthorized access to “certain data.” It said the incident was detected and contained immediately, and that its core banking systems were not accessed or affected.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure followed claims from cybersecurity researchers tracking dark web activity that an unidentified hacker had breached the bank and leaked customer information, corporate banking records, internal emails, loan documents, and audit files on a darknet forum. The authenticity of the purported leaked data could not be independently verified. Bank of Baroda did not comment on the hackers’ claims, did not say whether customer data had been exfiltrated, and did not attribute the incident to any specific hacking group.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the threat actor, using the name “leak-king-F,” advertised the data for sale on a darknet marketplace and directed prospective buyers to a Telegram channel. The article describes the incident as the latest in a series affecting major financial institutions and companies across Asia. It also cites recent incidents involving Thailand’s Securities Depository, contractors working on India’s largest nuclear power project, and Tata Electronics.\u003c/p\u003e\n"},{"n":3,"title":"Tengu Botnet Reboots Compromised Linux Devices When Defenders Kill Its Process","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/tengu-botnet-reboots-compromised-linux.html","time":"15:01","priority":"MAY READ","score":72,"tldr":"Nozomi Networks analyzed Tengu, a Mirai-derived Linux botnet that persists through multiple startup mechanisms and can abuse hardware watchdogs to reboot devices when its main process is killed, giving it another chance to relaunch. The malware spreads via Telnet credential brute force and supports DDoS, proxying, command execution, updates, and additional ELF or APK payloads.","briefOverview":"\u003cp\u003eNozomi Networks Labs analyzed a new Mirai-derived botnet called \u003cstrong\u003eTengu\u003c/strong\u003e that can use a compromised Linux device’s hardware watchdog to trigger a reboot when defenders kill its main process. The reboot gives Tengu’s other persistence mechanisms another chance to relaunch the malware. Nozomi observed the dropper reaching its honeypots through Telnet credential brute force.\u003c/p\u003e\n\n\u003cp\u003eTengu supports 25 distributed denial-of-service methods and can also run a SOCKS5 proxy, execute shell commands, collect system and network data, update itself, and retrieve additional ELF or Android APK payloads. Nozomi listed architecture-specific samples for i386, amd64, MIPS, ARM, PowerPC, and m68k, but did not identify a specific vendor, device model, operator, infection count, or real-world DDoS victims. The report shows what Tengu can do, not how widely it has spread.\u003c/p\u003e\n\n\u003cp\u003eThe malware uses several persistence and self-defense techniques, including a detached guardian process, a fake systemd service, init and RC scripts, shell startup file changes, and marking its installed binary immutable. It can also overwrite ELF headers of reboot and shutdown utilities with the string ELFOOD, which may interfere with normal restart or shutdown commands. The analyzed sample was configured to communicate with 64[.]89.163.8 over TCP port 9931, and URLhaus independently recorded malicious Mirai-related hosting at that address, though it did not identify those files as Tengu.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nozomi Networks Labs analyzed Tengu, a Mirai-derived botnet that can use a compromised Linux device's hardware watchdog to trigger a reboot when defenders kill its main process.","Tengu was observed reaching Nozomi honeypots through Telnet credential brute force and includes samples for i386, amd64, MIPS, ARM, PowerPC, and m68k architectures.","The botnet supports 25 DDoS methods and can run a SOCKS5 proxy, execute shell commands, collect system and network data, update itself, and retrieve additional ELF or APK payloads.","Tengu uses multiple persistence mechanisms, including a detached guardian process, fake systemd service, init and RC scripts, shell startup file changes, an immutable installed binary, and a cron-based routine that Nozomi said appears unfinished or broken.","The analyzed sample was configured to communicate with a C2 server at 64[.]89.163.8 over TCP port 9931, while URLhaus independently recorded malicious Mirai-related hosting at that address but did not identify the files as Tengu."],"insights":["Tengu’s watchdog abuse turns a common defensive action—killing the malware process—into a recovery opportunity for the botnet because the device may reboot and allow other persistence mechanisms to relaunch it.","The article stresses that Tengu’s capabilities are well documented, but its real-world footprint is not: Nozomi names no device model, operator, infection count, or DDoS victims.","Defenders may not be able to rely on normal reboot or shutdown commands on infected devices because Tengu overwrites the ELF headers of hardcoded reboot and shutdown utilities.","URLhaus data supports that 64[.]89.163.8 hosted Mirai-related malicious files, but it does not prove those files were Tengu or that the C2 service and IPFS gateway were reachable.","Nozomi’s cleanup guidance implies that simply removing the visible malware process is insufficient; suspected devices should be checked across systemd services, init scripts, shell startup files, and cron-related paths before being returned to service."],"referencedReports":[{"title":"Tengu: A Modernized Mirai That Doesn’t Want to Leave","url":"https://www.nozominetworks.com/blog/tengu-a-modernized-mirai-that-doesnt-want-to-leave","publisher":"Nozomi Networks Labs","context":"The article says Nozomi Networks Labs published its analysis of Tengu on July 27, 2026, and relies on that analysis for the malware’s capabilities and behavior.","category":"research","primary":true}],"body":"\u003cp\u003eNozomi Networks Labs analyzed a new Mirai-derived botnet called \u003cstrong\u003eTengu\u003c/strong\u003e that can use a compromised Linux device’s hardware watchdog to trigger a reboot when defenders kill its main process. The reboot gives Tengu’s other persistence mechanisms another chance to relaunch the malware. Nozomi observed the dropper reaching its honeypots through Telnet credential brute force.\u003c/p\u003e\n\n\u003cp\u003eTengu supports 25 distributed denial-of-service methods and can also run a SOCKS5 proxy, execute shell commands, collect system and network data, update itself, and retrieve additional ELF or Android APK payloads. Nozomi listed architecture-specific samples for i386, amd64, MIPS, ARM, PowerPC, and m68k, but did not identify a specific vendor, device model, operator, infection count, or real-world DDoS victims. The report shows what Tengu can do, not how widely it has spread.\u003c/p\u003e\n\n\u003cp\u003eThe malware uses several persistence and self-defense techniques, including a detached guardian process, a fake systemd service, init and RC scripts, shell startup file changes, and marking its installed binary immutable. It can also overwrite ELF headers of reboot and shutdown utilities with the string ELFOOD, which may interfere with normal restart or shutdown commands. The analyzed sample was configured to communicate with 64[.]89.163.8 over TCP port 9931, and URLhaus independently recorded malicious Mirai-related hosting at that address, though it did not identify those files as Tengu.\u003c/p\u003e\n"},{"n":1,"title":"Is Your SSO Protected Against Modern Credential Attacks?","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/is-your-sso-protected-against-modern-credential-attacks/","time":"14:00","priority":"MAY READ","score":45,"tldr":"SSO can reduce password sprawl and centralize access control, but it becomes a high-value target if not hardened. Organizations should protect SSO with strong password policies, phishing-resistant MFA, and tight controls over identity provider admin accounts, keys, secrets, and app permissions.","briefOverview":"\u003cp\u003eThe article explains that single sign-on, or SSO, simplifies access by allowing users to log into multiple systems with one set of credentials. It says this convenience can also concentrate risk, using the 2025 University of Pennsylvania breach as an example. According to reports cited in the article, attackers compromised a PennKey SSO account and used it to access internal systems including VPN, Salesforce, Qlik, SAP, and SharePoint. The breach resulted in the theft of data on 1.2 million individuals.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that SSO is not inherently insecure and can improve security when configured and protected properly. It says organizations should treat SSO as a critical security control because one login can open access to many systems. Recommended protections include strong passwords based on current NIST guidance, screening new passwords against blocklists of commonly used or compromised passwords, and avoiding legacy rules such as mandatory complexity requirements and routine password resets. The article also says MFA should be enforced consistently across users, applications, and access scenarios.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that MFA should be strong enough to withstand modern credential attacks, noting that SMS codes and basic one-time passwords are less strong than phishing-resistant methods such as FIDO2 security keys, WebAuthn, or passkeys. It also says organizations should secure the systems and assets behind SSO, including identity provider administrator accounts, signing certificates, token-signing keys, OAuth secrets, refresh tokens, consent grants, and delegated permissions. The article promotes Specops Password Policy and Specops Secure Access as products for enforcing password policies and adding MFA to SAML and OIDC-based applications. It concludes that properly hardened SSO can reduce password exposure, support centralized access management, improve auditing, reduce helpdesk pressure, and make access easier to govern.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Single sign-on simplifies access by letting users log into multiple systems with one set of credentials, but that convenience can concentrate risk if the login is compromised.","Reports said attackers compromised a University of Pennsylvania PennKey SSO account and used it to access internal systems including VPN, Salesforce, Qlik, SAP, and SharePoint, resulting in theft of data on 1.2 million individuals.","The article says SSO can improve security when configured properly by reducing password sprawl, centralizing access policies, and making it easier to enforce multi-factor authentication.","The article recommends strong SSO passwords aligned with NIST guidance, including longer passwords and screening new passwords against blocklists of commonly used, expected, or previously compromised passwords.","The article recommends enforcing MFA consistently for SSO and moving toward phishing-resistant methods such as FIDO2 security keys, WebAuthn, or passkeys, especially for privileged users and sensitive systems."],"insights":["NIST guidance cited in the article emphasizes password length, usability, and compromised-password screening rather than older rules such as mandatory complexity and routine resets, which can drive predictable user behavior.","The article highlights that MFA strength matters: SMS codes and basic one-time passwords are described as better than passwords alone, but organizations are urged to prioritize phishing-resistant options for privileged users and sensitive systems.","The article treats identity provider administrator accounts, signing certificates, token-signing keys, OAuth secrets, refresh tokens, and consent grants as core SSO security assets that need protection alongside user logins.","The article notes that attackers may maintain access through risky third-party app permissions, so organizations should restrict user consent, require admin approval for sensitive permissions, and remove stale or overprivileged grants."],"referencedReports":[],"body":"\u003cp\u003eThe article explains that single sign-on, or SSO, simplifies access by allowing users to log into multiple systems with one set of credentials. It says this convenience can also concentrate risk, using the 2025 University of Pennsylvania breach as an example. According to reports cited in the article, attackers compromised a PennKey SSO account and used it to access internal systems including VPN, Salesforce, Qlik, SAP, and SharePoint. The breach resulted in the theft of data on 1.2 million individuals.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that SSO is not inherently insecure and can improve security when configured and protected properly. It says organizations should treat SSO as a critical security control because one login can open access to many systems. Recommended protections include strong passwords based on current NIST guidance, screening new passwords against blocklists of commonly used or compromised passwords, and avoiding legacy rules such as mandatory complexity requirements and routine password resets. The article also says MFA should be enforced consistently across users, applications, and access scenarios.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that MFA should be strong enough to withstand modern credential attacks, noting that SMS codes and basic one-time passwords are less strong than phishing-resistant methods such as FIDO2 security keys, WebAuthn, or passkeys. It also says organizations should secure the systems and assets behind SSO, including identity provider administrator accounts, signing certificates, token-signing keys, OAuth secrets, refresh tokens, consent grants, and delegated permissions. The article promotes Specops Password Policy and Specops Secure Access as products for enforcing password policies and adding MFA to SAML and OIDC-based applications. It concludes that properly hardened SSO can reduce password exposure, support centralized access management, improve auditing, reduce helpdesk pressure, and make access easier to govern.\u003c/p\u003e\n"}]</script>
