<script type="application/json" id="dl-articles">[{"n":1,"title":"ShinyHunters uses WAF bypass trick in Oracle PeopleSoft attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/shinyhunters-uses-waf-bypass-trick-in-oracle-peoplesoft-attacks/","time":"19:03","priority":"MUST READ","score":96,"tldr":"ShinyHunters is bypassing WAF rules that block Oracle PeopleSoft’s vulnerable /PSEMHUB/ endpoint by percent-encoding the “P,” enabling continued exploitation of CVE-2026-35273. Organizations should apply Oracle’s security update rather than rely on path-based WAF blocking and review logs for encoded endpoint requests.","briefOverview":"\u003cp\u003eShinyHunters is using a URL-encoding technique to bypass web application firewall rules intended to block access to Oracle PeopleSoft’s vulnerable \u003ccode\u003e/PSEMHUB/\u003c/code\u003e endpoint. Instead of requesting the literal path, the group sends requests to \u003ccode\u003e/%50SEMHUB/\u003c/code\u003e, where \u003ccode\u003e%50\u003c/code\u003e represents the letter P. Some WAFs and reverse proxies check the path before decoding it, while Oracle WebLogic decodes it and routes the request to the vulnerable endpoint. This can leave servers exposed even when operators believed their WAF rule mitigated CVE-2026-35273.\u003c/p\u003e\n\n\u003cp\u003eGoogle reported that the renewed campaign has deployed web shells on dozens of systems worldwide in higher education, technology, IT services, healthcare, agriculture, transportation, and government. Attackers commonly send five to 15 POST requests containing serialized Java objects to assess whether a system can be exploited quietly, then execute commands in memory or deploy JSP web shells. On compromised systems, the group has used the SIDEEYE backdoor, Neo-reGeorg tunneling toolkit, and MeshAgent remote-management software. Mandiant recommends applying Oracle’s latest security update and reviewing WebLogic logs for both literal and encoded \u003ccode\u003e/PSEMHUB/\u003c/code\u003e requests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ShinyHunters is using the percent-encoded path /%50SEMHUB/ to bypass web application firewall rules that only block the literal /PSEMHUB/ path on Oracle PeopleSoft servers vulnerable to CVE-2026-35273.","Oracle fixed CVE-2026-35273 on June 11 and described it as an unauthenticated remote code execution flaw in PeopleSoft.","Google reported that the renewed campaign has deployed web shells on dozens of systems worldwide across higher education, technology, IT services, healthcare, agriculture, transportation, and government organizations.","After identifying a vulnerable server, the attackers execute commands in memory or deploy JSP web shells, including x.jsp for command execution and u.jsp or u2.jsp for larger file uploads.","Mandiant recommends installing the latest security update and reviewing WebLogic access logs for both /PSEMHUB/ and encoded variants such as /%50SEMHUB/."],"insights":["A WAF rule that appears to block the vulnerable PeopleSoft path can fail because some WAFs compare the request before decoding it, while Oracle WebLogic decodes the path and still sends it to the vulnerable endpoint.","ShinyHunters typically sends five to 15 serialized-object requests before attempting full compromise, using the responses to determine whether a server can be exploited without writing files or disrupting service.","The group uses separate JSP web shells for command execution and for uploading larger files, then can use Neo-reGeorg to turn a compromised PeopleSoft server into a route into an organization’s internal network.","Searching logs only for the literal /PSEMHUB/ path may miss evidence of compromise; Mandiant specifically advises checking for encoded forms such as /%50SEMHUB/ as well."],"referencedReports":[{"title":"ShinyHunters’ renewed mass exploitation campaign targeting Oracle PeopleSoft","url":"https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-renewed-mass-exploitation-campaign-targeting-oracle-peoplesoft","publisher":"google-mandiant","context":"The article cites Google’s new report describing ShinyHunters’ percent-encoding bypass of PeopleSoft WAF rules and the group’s renewed exploitation activity.","category":"research","primary":true}],"body":"\u003cp\u003eShinyHunters is using a URL-encoding technique to bypass web application firewall rules intended to block access to Oracle PeopleSoft’s vulnerable \u003ccode\u003e/PSEMHUB/\u003c/code\u003e endpoint. Instead of requesting the literal path, the group sends requests to \u003ccode\u003e/%50SEMHUB/\u003c/code\u003e, where \u003ccode\u003e%50\u003c/code\u003e represents the letter P. Some WAFs and reverse proxies check the path before decoding it, while Oracle WebLogic decodes it and routes the request to the vulnerable endpoint. This can leave servers exposed even when operators believed their WAF rule mitigated CVE-2026-35273.\u003c/p\u003e\n\n\u003cp\u003eGoogle reported that the renewed campaign has deployed web shells on dozens of systems worldwide in higher education, technology, IT services, healthcare, agriculture, transportation, and government. Attackers commonly send five to 15 POST requests containing serialized Java objects to assess whether a system can be exploited quietly, then execute commands in memory or deploy JSP web shells. On compromised systems, the group has used the SIDEEYE backdoor, Neo-reGeorg tunneling toolkit, and MeshAgent remote-management software. Mandiant recommends applying Oracle’s latest security update and reviewing WebLogic logs for both literal and encoded \u003ccode\u003e/PSEMHUB/\u003c/code\u003e requests.\u003c/p\u003e\n"},{"n":2,"title":"Lunex Stealer Abuses AMD Driver to Disable Security Monitoring and Steal Browser Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/lunex-stealer-abuses-amd-driver-to.html","time":"18:22","priority":"SHOULD READ","score":88,"tldr":"Lunex, a malware-as-a-service platform targeting Ukrainian users through ClickFix lures on compromised websites, uses a vulnerable AMD driver to quietly disable security monitoring before deploying its Psychedelic Stealer payload. The malware steals browser credentials and cryptocurrency-wallet data, adds persistence, and can maintain remote filesystem control through Chrome Native Messaging.","briefOverview":"\u003cp\u003eLunex is a malware-as-a-service platform linked to Psychedelic Stealer, which was distributed through compromised Ukrainian websites using fake Cloudflare verification pages designed to trick users into running bogus MSI installers. Ontinue described a four-stage attack chain targeting Ukrainian-speaking users that culminates in a command-and-control agent capable of stealing browser and cryptocurrency-wallet data. LunexLoader bypasses Windows User Account Control through the CMSTPLUA COM object, loads a vulnerable AMD Radeon Software driver, and then downloads the information-stealing payload.\u003c/p\u003e\n\n\u003cp\u003eThe campaign abuses the AMD PDFWKRNL.sys kernel driver affected by CVE-2023-20598 to raise privileges and disable security monitoring while leaving security processes running. LunexStealer targets credentials in Chrome, Edge, Brave, Yandex Browser, Opera, Opera GX, and Vivaldi, and it can collect data from several desktop and browser-extension cryptocurrency wallets. It also persists through a Registry Run key, a hidden scheduled task, and a Chrome Native Messaging Host that can read, write, download, and execute files; Ontinue identified 28 Lunex panels across 13 countries and said the panel analysis points to a Russian-speaking developer or team.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lunex is a malware-as-a-service platform whose Psychedelic Stealer component was delivered through ClickFix-style fake Cloudflare verification pages on compromised Ukrainian websites.","The infection chain uses bogus MSI installers and LunexLoader to bypass Windows User Account Control, load the vulnerable AMD Radeon Software driver PDFWKRNL.sys, and disable security monitoring before downloading the stealer.","LunexStealer steals credentials from seven Chromium-based browsers and collects data from desktop and browser-extension cryptocurrency wallets.","The malware establishes persistence through a Registry Run key, a hidden scheduled task named psychedelicloveUtils, and a Chrome Native Messaging Host backed by an embedded PowerShell script.","Ontinue identified 28 Lunex panels across 13 countries and reported that the panel analysis points to a Russian-speaking developer or development team."],"insights":["Lunex uses the AMD PDFWKRNL.sys driver to leave security products running while preventing them from monitoring activity, rather than visibly terminating those products.","Ontinue reported that the specific PDFWKRNL.sys variant could still load despite HVCI and Microsoft’s Vulnerable Driver Blocklist, even though its hash had been catalogued by LOLDrivers.","Its Chrome Native Messaging Host remains available after the stealer binary is deleted, the system restarts, or Chrome restarts, and can list drives, read and write files, download files, and run programs.","The Lunex platform appears to extend beyond information theft: one Turkey-hosted panel resolved to five phishing domains associated with brand impersonation.","The number of identified Lunex command-and-control panels grew from six in June 2026 to 28 across 13 countries, indicating rapid expansion of the platform."],"referencedReports":[{"title":"Lunex Unmasked: A New Information Stealer Deployed Through BYOVD","url":"https://www.ontinue.com/resource/lunex-unmasked-a-new-information-stealer-deployed-through-byovd/","publisher":"ontinue","context":"The article relies on Ontinue's technical report for its analysis of the Lunex four-stage infection chain, driver abuse, persistence, and data theft capabilities.","category":"research","primary":true},{"title":"AMD Security Bulletin AMD-SB-6009","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-6009.html","publisher":"amd","context":"The article cites AMD's advisory for CVE-2023-20598, the flaw affecting the PDFWKRNL.sys driver abused by Lunex.","category":"advisory","primary":false}],"body":"\u003cp\u003eLunex is a malware-as-a-service platform linked to Psychedelic Stealer, which was distributed through compromised Ukrainian websites using fake Cloudflare verification pages designed to trick users into running bogus MSI installers. Ontinue described a four-stage attack chain targeting Ukrainian-speaking users that culminates in a command-and-control agent capable of stealing browser and cryptocurrency-wallet data. LunexLoader bypasses Windows User Account Control through the CMSTPLUA COM object, loads a vulnerable AMD Radeon Software driver, and then downloads the information-stealing payload.\u003c/p\u003e\n\n\u003cp\u003eThe campaign abuses the AMD PDFWKRNL.sys kernel driver affected by CVE-2023-20598 to raise privileges and disable security monitoring while leaving security processes running. LunexStealer targets credentials in Chrome, Edge, Brave, Yandex Browser, Opera, Opera GX, and Vivaldi, and it can collect data from several desktop and browser-extension cryptocurrency wallets. It also persists through a Registry Run key, a hidden scheduled task, and a Chrome Native Messaging Host that can read, write, download, and execute files; Ontinue identified 28 Lunex panels across 13 countries and said the panel analysis points to a Russian-speaking developer or team.\u003c/p\u003e\n"}]</script>
