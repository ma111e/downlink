machines had a connection configured or used; Acronis could identify the connection method but not the destination service. MSPs represented 78.2% of adopting customers and had a 7.9% adoption rate, compared with 4.7% for direct partners without confirmed MSP tooling. The report concludes that organizations need ongoing visibility into installed AI tools and the external connections users enable, since these connections can be configured quickly without administrator rights or approval.\u003c/p\u003e\n"},{"n":29,"title":"How to mitigate the risk from AI-generated apps built by your 'citizen coder' employees","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/how-to-secure-mitigate-ai-risk-vibe-coding-ai-apps-citizen-coders","time":"15:00","priority":"MAY READ","score":48,"tldr":"AI-enabled citizen development can create shadow applications with untested code, excessive permissions, sensitive-data exposure, and unmanaged lifecycle risks. Tenable recommends governance rather than blanket bans, combining approved tools, departmental AI leaders, mandatory training, and centralized security oversight.","briefOverview":"\u003cp\u003eAI tools are allowing non-technical employees to build workplace applications from natural-language prompts, improving productivity and reducing demands on professional developers. However, applications created without IT and security oversight can become shadow AI assets with security and compliance problems. They may contain untested vulnerabilities, dangerous configurations, risky open-source components, insecure connections to critical systems, or weak protection for sensitive data. Such applications may also lack patching, monitoring, logging, backups, disaster-recovery coverage, and appropriate access controls.\u003c/p\u003e\n\n\u003cp\u003eTenable argues that blanket bans on AI-aided application development are likely to drive the activity underground rather than eliminate it. The company uses a five-tier AI governance model spanning executive strategy, governance bodies, departmental execution, training and enablement, and employee communities. Departmental AI Functional Leaders oversee AI use cases, requests for skills, connectors, and data access, helping identify unvetted external AI components before production. Tenable also links AI-tool access to mandatory security and responsible-use training, supplemented with webinars, courses, tool-specific instruction, and weekly show-and-tell sessions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Generative AI tools enable non-technical employees to create workplace applications quickly, but unsanctioned apps can become shadow AI assets with security and compliance risks.","Citizen-built applications may contain untested vulnerabilities, unsafe configurations, risky open-source components, insecure access to critical systems, and poorly protected sensitive data.","These applications may not be patched, monitored, logged, backed up, or covered by disaster-recovery plans, and may receive excessive permissions outside the organization’s identity and access controls.","Tenable states that blanket bans on AI-aided development can backfire by encouraging employees to conceal their activities, and instead advocates structured governance.","Tenable’s five-tier AI governance model combines executive strategy, governance bodies, departmental AI Functional Leaders, training and enablement, and employee communities to oversee AI use."],"insights":["The operational problem is not limited to unauthorized apps: even applications submitted through company processes can overwhelm IT and security teams because of the volume requiring review, approval, and long-term maintenance.","Citizen coders may use legitimate access to business applications to create local data lakes for AI-built apps, creating both AI-token costs and data sprawl.","Tenable gives departmental AI Functional Leaders direct responsibility for approving AI capabilities, managing requests for connectors and data access, and identifying unvetted external AI components before production.","Tenable ties access to AI tools to mandatory security and responsible-use training, then reinforces it with webinars, tool-specific instruction, and regular employee show-and-tell sessions."],"referencedReports":[{"title":"OWASP Citizen Development Top 10","url":"https://owasp.github.io/www-project-citizen-development-top10-security-risks/#div-main","publisher":"Open Worldwide Application Security Project","context":"The article cites this OWASP list as documentation of security and compliance risks associated with applications built by citizen developers.","category":"guide","primary":false}],"body":"\u003cp\u003eAI tools are allowing non-technical employees to build workplace applications from natural-language prompts, improving productivity and reducing demands on professional developers. However, applications created without IT and security oversight can become shadow AI assets with security and compliance problems. They may contain untested vulnerabilities, dangerous configurations, risky open-source components, insecure connections to critical systems, or weak protection for sensitive data. Such applications may also lack patching, monitoring, logging, backups, disaster-recovery coverage, and appropriate access controls.\u003c/p\u003e\n\n\u003cp\u003eTenable argues that blanket bans on AI-aided application development are likely to drive the activity underground rather than eliminate it. The company uses a five-tier AI governance model spanning executive strategy, governance bodies, departmental execution, training and enablement, and employee communities. Departmental AI Functional Leaders oversee AI use cases, requests for skills, connectors, and data access, helping identify unvetted external AI components before production. Tenable also links AI-tool access to mandatory security and responsible-use training, supplemented with webinars, courses, tool-specific instruction, and weekly show-and-tell sessions.\u003c/p\u003e\n"},{"n":31,"title":"Gaining Greater Control and Access Management with Preemptive Cyber Defense","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/platform-6-2/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=platform-6-2","time":"10:02","priority":"MAY READ","score":48,"tldr":"Silent Push 6.2 adds centralized organization, team, role, and per-user API access controls, while integrating its preemptive threat intelligence into ThreatConnect, Microsoft Sentinel, and Palo Alto Cortex XSOAR. The release aims to give administrators tighter governance and let analysts investigate indicators without switching consoles.","briefOverview":"\u003cp\u003eSilent Push released version 6.2, adding centralized organization management controls for administrators, teams, managers, and members. Administrators can create teams, assign users, control module access, set daily and monthly API usage caps, and onboard users in bulk through a CSV template. The release is intended to provide access and usage governance as more security organizations adopt the platform.\u003c/p\u003e\n\n\u003cp\u003eThe platform’s access model limits managers to their own team’s users and API keys, while members can see only their own keys. Permission changes make content unavailable but do not delete it, and removing a user who shared content prompts administrators to transfer ownership. On limited-tier plans, API caps are soft limits that display actual usage against configured limits, while limit flags can be disabled through the user interface or API.\u003c/p\u003e\n\n\u003cp\u003eSilent Push 6.2 also brings IOFA Threat Check and Traffic Origin Threat Check into ThreatConnect, Microsoft Sentinel through Microsoft Logic Apps, and Palo Alto Cortex XSOAR. IOFA Threat Check identifies IP addresses or domains connected to infrastructure flagged as a potential future threat, while Traffic Origin adds source IP, geographic, and traffic-pattern context. The Cortex XSOAR integration additionally includes Traffic Origin support and a TLP Amber Reports API for listing available restricted intelligence reports.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push 6.2 introduces a rebuilt Organization Management page where administrators can create teams, assign users, grant module access, and set daily and monthly API limits per user.","The platform uses organization, team, and role tiers: administrators manage the organization, managers can view only their team’s users and API keys, and members can view only their own keys.","On limited-tier plans, per-user API caps act as soft limits that show actual usage against the configured limit, and administrators can disable limit flags through the interface or API for unlimited access.","Silent Push 6.2 adds IOFA Threat Check and Traffic Origin Threat Check capabilities to ThreatConnect, Microsoft Sentinel through Microsoft Logic Apps, and Palo Alto Cortex XSOAR.","The Cortex XSOAR integration adds Traffic Origin support and a TLP Amber Reports API for listing and retrieving restricted intelligence reports available to an organization."],"insights":["The access model is designed to scale from small organizations that manage users directly to larger organizations that need teams, delegated managers, and role-based visibility.","Configured API limits are described as soft controls on limited-tier plans, meaning they provide usage visibility rather than necessarily interrupting an analyst’s work.","Permission changes make content unavailable without deleting it, and removing a user triggers an ownership-transfer prompt for shared content, reducing the risk of losing investigation material.","The integrations combine an early-warning signal about potentially threatening infrastructure with source, geographic, and traffic-pattern context, allowing analysts to assess both whether an indicator may be dangerous and what it may be connected to.","Bulk CSV onboarding can assign per-user API limits during user creation, linking access provisioning with usage governance in one process."],"referencedReports":[],"body":"\u003cp\u003eSilent Push released version 6.2, adding centralized organization management controls for administrators, teams, managers, and members. Administrators can create teams, assign users, control module access, set daily and monthly API usage caps, and onboard users in bulk through a CSV template. The release is intended to provide access and usage governance as more security organizations adopt the platform.\u003c/p\u003e\n\n\u003cp\u003eThe platform’s access model limits managers to their own team’s users and API keys, while members can see only their own keys. Permission changes make content unavailable but do not delete it, and removing a user who shared content prompts administrators to transfer ownership. On limited-tier plans, API caps are soft limits that display actual usage against configured limits, while limit flags can be disabled through the user interface or API.\u003c/p\u003e\n\n\u003cp\u003eSilent Push 6.2 also brings IOFA Threat Check and Traffic Origin Threat Check into ThreatConnect, Microsoft Sentinel through Microsoft Logic Apps, and Palo Alto Cortex XSOAR. IOFA Threat Check identifies IP addresses or domains connected to infrastructure flagged as a potential future threat, while Traffic Origin adds source IP, geographic, and traffic-pattern context. The Cortex XSOAR integration additionally includes Traffic Origin support and a TLP Amber Reports API for listing available restricted intelligence reports.\u003c/p\u003e\n"},{"n":30,"title":"AgentSkope Marketplace: AI Agents the Easy Way","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/agentskope-marketplace-ai-agents-the-easy-way","time":"12:59","priority":"MAY READ","score":45,"tldr":"Netskope has launched the AgentSkope Marketplace, a console-based catalog and capacity-credit system for sizing, activating, reallocating, and monitoring its AI agents. The offering centralizes agent governance and usage management to reduce procurement and operational overhead.","briefOverview":"\u003cp\u003eNetskope introduced the AgentSkope Marketplace, a new area in the Netskope management console for finding, sizing, activating, and tracking Netskope AI agents. The Marketplace is intended to address procurement and administration burdens associated with deploying agents individually. It provides one catalog, one shared pool of capacity credits, and one view of agent usage. Netskope cites its 2026 State of AI Agents in Security and Network Operations report, which found that 56% of SOC and NOC teams are considering agents while only 9% of teams that have deployed them consider them highly integrated.\u003c/p\u003e\n\n\u003cp\u003eCustomers can estimate credit needs using expected work volumes in recognizable units, such as case investigations, and can view each agent’s recommended and minimum capacity. Capacity credits are committed monthly for the contract term, but can be reallocated between agents as needs change without a new purchase order. A utilization dashboard displays usage by agent, trends, and projected credit duration to identify likely shortages before capacity is exhausted. The Marketplace is available across management planes except KSA and Netskope’s Fed and PBMM compliance environments, and customers with agents bought under individual SKUs can optionally convert them to capacity credits.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope introduced the AgentSkope Marketplace as an area in its management console for finding, sizing, activating, and tracking Netskope AI agents.","The Marketplace uses a single pool of capacity credits that customers can allocate among agents and reallocate as operational priorities change.","Its catalog includes agent descriptions, recommended and minimum capacity levels, and a calculator that estimates credit needs based on expected usage.","A utilization dashboard shows per-agent usage trends and projects how long allocated credits are expected to last.","AgentSkope Marketplace is available across management planes except KSA and Netskope’s Fed and PBMM compliance environments."],"insights":["The article identifies agent procurement and administration as a major adoption bottleneck: although 56% of SOC and NOC teams are considering agents for capacity pressure, only 9% of teams that have deployed them consider the agents highly integrated.","Capacity credits are designed to be reassigned rather than permanently tied to the first agent selected, allowing a team to shift capacity from a quiet network diagnostics agent to a busier incident-triage agent without raising a new purchase order.","The Marketplace presents usage in each agent’s familiar work units, such as case investigations, alongside credit estimates, helping teams compare projected credit needs with their actual workload volumes.","The unified capacity view applies to agents once they are converted to capacity credits, while customers using individually purchased agent SKUs can choose whether and when to convert."],"referencedReports":[],"body":"\u003cp\u003eNetskope introduced the AgentSkope Marketplace, a new area in the Netskope management console for finding, sizing, activating, and tracking Netskope AI agents. The Marketplace is intended to address procurement and administration burdens associated with deploying agents individually. It provides one catalog, one shared pool of capacity credits, and one view of agent usage. Netskope cites its 2026 State of AI Agents in Security and Network Operations report, which found that 56% of SOC and NOC teams are considering agents while only 9% of teams that have deployed them consider them highly integrated.\u003c/p\u003e\n\n\u003cp\u003eCustomers can estimate credit needs using expected work volumes in recognizable units, such as case investigations, and can view each agent’s recommended and minimum capacity. Capacity credits are committed monthly for the contract term, but can be reallocated between agents as needs change without a new purchase order. A utilization dashboard displays usage by agent, trends, and projected credit duration to identify likely shortages before capacity is exhausted. The Marketplace is available across management planes except KSA and Netskope’s Fed and PBMM compliance environments, and customers with agents bought under individual SKUs can optionally convert them to capacity credits.\u003c/p\u003e\n"},{"n":2,"title":"How to secure RMM software: 8 controls MSPs should test","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/how-to-secure-rmm-software-8-controls-msps-should-test/","time":"14:00","priority":"MAY READ","score":30,"tldr":"Sponsored by Acronis, the article advises MSPs to test eight RMM security controls—including discovery, patching, privileged access, automation, recovery, and tenant isolation—to reduce management-plane risk. It promotes Acronis RMM as an integrated platform for combining endpoint management, security, backup, and recovery.","briefOverview":"\u003cp\u003eThis sponsored Acronis article argues that remote monitoring and management (RMM) software is a major attack surface for managed service providers because it gives technicians unattended administrative access across many customer devices. It cites N-able’s September 2026 emergency hotfix for CVE-2026-86218, a maximum-severity pre-authentication remote-code-execution flaw in N-central, and Microsoft SharePoint “ToolShell” zero-days exploited before a patch was available. The article also references a CISA warning that ransomware actors can abuse legitimate RMM software to reach downstream customer networks.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends testing eight RMM control areas: device discovery, risk-based patching, privileged-access restrictions, alert handling, secure scripting, security-operations integration, recovery readiness, and tenant separation with audit records. It advises MSPs to use difficult test cases, including unmanaged devices, failed patches, unauthorized scripts, restricted technician accounts, compromised test devices, and restores that still require updates. Acronis promotes its RMM offering as part of Acronis Cyber Platform, with shared management, cybersecurity, backup, and recovery capabilities, while noting that available functions and licensing vary by service package.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["RMM platforms give technicians unattended administrative access to many customer devices, so a compromised privileged account or management server can affect far more than one endpoint.","The article recommends that MSPs test eight control areas: discovery and inventory, risk-based patching, privileged access, alert handling, scripting governance, security-operations integration, recovery readiness, and tenant separation with audit trails.","The article cites N-able’s September 2026 emergency hotfix for CVE-2026-86218, described as a maximum-severity pre-authentication remote-code-execution flaw in N-central amid ongoing attacks.","It says MSPs should use realistic tests such as introducing an unmanaged device, deploying a patch that fails, attempting an unauthorized script, restricting a technician account, and restoring a system that still needs updates.","The sponsored article promotes Acronis RMM as an integrated platform combining remote monitoring and management with cybersecurity, backup, and recovery capabilities."],"insights":["The article frames an RMM platform as a high-value management plane: compromising one technician account or server can extend access across thousands of customer devices, making tenant boundaries and least-privilege roles operationally important.","It recommends evaluating RMM products through deliberately difficult exercises rather than feature lists or demonstrations, such as testing a failed patch rollback, an unauthorized script attempt, and a restored device that still needs updates.","Recovery is presented as a security control rather than only a continuity function, because restored systems should be checked for integrity and outstanding vulnerabilities before returning online.","A unified platform should be judged by workflow continuity—whether staff can move from device discovery through containment and recovery while retaining customer, device, and incident context—not simply by having fewer agents or consoles.","The article notes that available Acronis capabilities depend on the service package, so MSPs should validate exact licensing and configuration instead of assuming that EDR, XDR, backup, or disaster-recovery functions are included."],"referencedReports":[{"title":"Protecting Against Cyber Threats to Managed Service Providers and Their Customers","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a","publisher":"cisa","context":"The article cites this CISA advisory to note that ransomware actors abuse legitimate RMM software to access downstream customer networks.","category":"advisory","primary":false}],"body":"\u003cp\u003eThis sponsored Acronis article argues that remote monitoring and management (RMM) software is a major attack surface for managed service providers because it gives technicians unattended administrative access across many customer devices. It cites N-able’s September 2026 emergency hotfix for CVE-2026-86218, a maximum-severity pre-authentication remote-code-execution flaw in N-central, and Microsoft SharePoint “ToolShell” zero-days exploited before a patch was available. The article also references a CISA warning that ransomware actors can abuse legitimate RMM software to reach downstream customer networks.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends testing eight RMM control areas: device discovery, risk-based patching, privileged-access restrictions, alert handling, secure scripting, security-operations integration, recovery readiness, and tenant separation with audit records. It advises MSPs to use difficult test cases, including unmanaged devices, failed patches, unauthorized scripts, restricted technician accounts, compromised test devices, and restores that still require updates. Acronis promotes its RMM offering as part of Acronis Cyber Platform, with shared management, cybersecurity, backup, and recovery capabilities, while noting that available functions and licensing vary by service package.\u003c/p\u003e\n"},{"n":27,"title":"How Aikido helps you meet SOC 2 Type 1 and Type 2","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/soc-2-compliance-type-1-and-type-2","time":"00:00","priority":"MAY READ","score":25,"tldr":"Aikido Security positions its continuous scanning, remediation tracking, CI/CD gates, and cloud posture checks as a way to generate audit evidence for SOC 2 controls. It emphasizes setting up these controls early for SOC 2 Type 2, which requires proof that controls operated effectively over time.","briefOverview":"\u003cp\u003eThe article explains how Aikido Security can help organizations collect evidence for SOC 2 audits through its application and cloud-security platform. SOC 2 Type 1 evaluates whether controls are properly designed at a specific point in time, while Type 2 evaluates whether those controls worked effectively over a period, typically three to 12 months. The article emphasizes that Type 2 requires sustained records such as logs, timestamps, and remediation history rather than one-time configuration screenshots.\u003c/p\u003e\n\n\u003cp\u003eAikido combines code, dependency, secret, container, infrastructure, cloud, malware, and application testing capabilities with remediation workflows and SLA tracking. It maps these capabilities to SOC 2 areas including access controls, boundary protection, encryption, software integrity, monitoring, vulnerability management, change management, risk assessment, and availability. The article says CI/CD gates can block pull requests or releases based on defined issue-severity thresholds and retain auditable records of gate decisions, overrides, and exceptions.\u003c/p\u003e\n\n\u003cp\u003eThe article advises teams pursuing Type 1 with a near-term Type 2 goal to enable continuous scanning and SLA tracking before the formal audit period starts. It notes that Aikido alone cannot pass an audit, because auditors also require policies, procedures, risk assessments, access reviews, and incident-response processes. Its central claim is that a unified platform can reduce the effort of producing exportable evidence showing that security controls continuously detected and addressed issues during the audit window.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SOC 2 Type 1 assesses whether controls are appropriately designed at a specific point in time, while Type 2 evaluates whether controls operated effectively over a period typically lasting three to 12 months.","Aikido Security combines code, dependency, secret, container, infrastructure, cloud, malware, and application testing capabilities in one platform with remediation workflows and SLA tracking.","Continuous scanning and dated remediation records can provide Type 2 audit evidence showing that vulnerability-management controls operated throughout the audit period.","Aikido's CI/CD and source-control checks can block pull requests, builds, or releases when newly introduced issues meet an organization-defined severity threshold.","The article states that Aikido alone cannot pass a SOC 2 audit, because auditors also require policies, procedures, risk assessments, access reviews, and incident-response processes."],"insights":["Teams preparing first for SOC 2 Type 1 should enable continuous scanning and remediation tracking before the Type 2 audit period begins, because evidence not captured during that period cannot be recreated later.","A vulnerability-management program can prioritize issues using whether vulnerable code is reachable or demonstrably exploitable in the company’s environment, rather than treating every dependency finding equally.","Pull-request and release gates can serve as change-management evidence when their decisions, exceptions, and overrides are retained in an auditable record.","Availability requirements are separate from the common criteria in SOC 2, so cloud backup-integrity checks can support availability evidence specifically."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how Aikido Security can help organizations collect evidence for SOC 2 audits through its application and cloud-security platform. SOC 2 Type 1 evaluates whether controls are properly designed at a specific point in time, while Type 2 evaluates whether those controls worked effectively over a period, typically three to 12 months. The article emphasizes that Type 2 requires sustained records such as logs, timestamps, and remediation history rather than one-time configuration screenshots.\u003c/p\u003e\n\n\u003cp\u003eAikido combines code, dependency, secret, container, infrastructure, cloud, malware, and application testing capabilities with remediation workflows and SLA tracking. It maps these capabilities to SOC 2 areas including access controls, boundary protection, encryption, software integrity, monitoring, vulnerability management, change management, risk assessment, and availability. The article says CI/CD gates can block pull requests or releases based on defined issue-severity thresholds and retain auditable records of gate decisions, overrides, and exceptions.\u003c/p\u003e\n\n\u003cp\u003eThe article advises teams pursuing Type 1 with a near-term Type 2 goal to enable continuous scanning and SLA tracking before the formal audit period starts. It notes that Aikido alone cannot pass an audit, because auditors also require policies, procedures, risk assessments, access reviews, and incident-response processes. Its central claim is that a unified platform can reduce the effort of producing exportable evidence showing that security controls continuously detected and addressed issues during the audit window.\u003c/p\u003e\n"}]</script>
