<script type="application/json" id="dl-articles">[{"n":7,"title":"Shattering the Dream – When a Job Offer Becomes a Zero-Day Attack","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/shattering-the-dream-when-a-job-offer-becomes-a-zero-day-attack/","time":"17:30","priority":"MUST READ","score":96,"tldr":"Check Point Research details a Lazarus-linked Operation Dream Job campaign targeting defense, aerospace, and aviation organizations with fake job lures, trojanized PDF tools, new malware, and compromised web servers used as relay infrastructure. The most significant finding is Lazarus’ in-the-wild exploitation of the Windows AFD.sys zero-day CVE-2026-68820 to deploy the FudModule kernel rootkit and gain SYSTEM-level stealth.","briefOverview":"\u003cp\u003eCheck Point Research is tracking a long-running Operation Dream Job campaign affiliated with the DPRK-linked Lazarus group, with the latest wave focused on the defense sector in Europe and India. The campaign targets organizations worldwide, especially companies in aerospace, aviation, and military technologies such as surveillance sensors, drones, and robotics. Attackers used fake job opportunities to convince victims to download malicious files, including modified PDF viewers and attacker-crafted PDF documents.\u003c/p\u003e\n\n\u003cp\u003eThe article describes two active infection chains: one using DLL sideloading to run MISTPEN, and another using a trojanized PDF viewer called SecurityPDF to execute the newly identified Troy backdoor. MISTPEN retrieved additional in-memory modules through Microsoft Graph API and OneDrive, including reconnaissance tools, persistence components, a local privilege escalation loader, and the ForestTiger backdoor. During the intrusion, Lazarus exploited CVE-2026-68820, a zero-day vulnerability in Microsoft AFD.sys, to deploy a new version of the FudModule kernel-mode rootkit with SYSTEM privileges and disable EDR visibility.\u003c/p\u003e\n\n\u003cp\u003eThe attackers also compromised Roundcube webmail servers vulnerable to CVE-2025-49113 and deployed RelayShell, a PHP webshell used to turn compromised web servers into relay nodes for command-and-control communications. The infrastructure also included compromised WordPress and PrestaShop servers, and the article says at least 17 compromised servers were likely used as relay nodes. In at least one case, a compromised organization in Western Europe was leveraged to conduct spear-phishing against additional targets, abusing the organization’s reputation and trust.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research is tracking a long-running Operation Dream Job campaign affiliated with the DPRK-linked Lazarus group, with the latest wave focusing on the defense sector in Europe and India.","The campaign used fake job opportunities to deliver malicious PDF-related files, including a DLL sideloading chain that executed MISTPEN and a trojanized PDF viewer called SecurityPDF that launched the newly identified Troy backdoor.","During the intrusion, Lazarus exploited CVE-2026-68820, a zero-day local privilege escalation vulnerability in the Microsoft AFD.sys driver, to deploy a new version of the FudModule kernel-mode rootkit with SYSTEM privileges.","The attackers compromised vulnerable Roundcube webmail servers using CVE-2025-49113 and deployed RelayShell, a PHP webshell that turned compromised web servers into command-and-control relay nodes.","At least one compromised organization in Western Europe was later used to conduct spear-phishing attacks against additional targets, allowing the attackers to abuse the organization’s reputation and trust."],"insights":["The attackers separated the trojanized PDF viewer from the crafted PDF payload and used impersonation websites with search engine optimization, which the article says reduced the likelihood of detection compared with delivering everything in one phishing message.","The AFD.sys exploit included explicit support for newer Windows 11 builds 26100 and 26200, showing that this FudModule version was tailored for recent Windows releases rather than older systems.","MISTPEN’s local privilege escalation loader used an additional encrypted communication layer with GOST-CBC and Kyber/ML-KEM key exchange on top of MISTPEN’s existing AES-protected Microsoft Graph API channel.","This FudModule version removed some previously documented dedicated vendor-specific disabling features but added Smart App Control tampering by changing VerifiedAndReputablePolicyState and reloading the code integrity policy.","RelayShell functioned mainly as a relay rather than a traditional command-execution webshell, using paired victim and operator sessions plus temporary files to pass messages through compromised servers."],"referencedReports":[{"title":"Operation Dream Job","url":"https://www.clearskysec.com/operation-dream-job/","publisher":"ClearSky","context":"The article cites ClearSky’s Operation Dream Job research as prior documentation of the campaign that Check Point Research is tracking in its latest wave.","category":"research","primary":false},{"title":"UNC2970 Backdoor Deployment via Trojanized PDF Reader","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc2970-backdoor-trojanized-pdf-reader?hl=en","publisher":"Mandiant","context":"The article says MISTPEN was first documented by Mandiant in 2024 and references that analysis when describing the downloader.","category":"research","primary":false},{"title":"Gotta fly: Lazarus targets UAV sector","url":"https://www.welivesecurity.com/en/eset-research/gotta-fly-lazarus-targets-uav-sector/","publisher":"ESET","context":"The article references ESET’s 2025 research as a similar Operation Dream Job campaign and later cites it for a related Lazarus PDB path containing the term Troy.","category":"research","primary":false},{"title":"Lazarus FudModule v3","url":"https://www.gendigital.com/blog/insights/research/lazarus-fudmodule-v3","publisher":"Gen Digital","context":"The article compares the new FudModule version with FudModule v3, which it says was reported by Gen Digital in 2024.","category":"research","primary":false},{"title":"CVE-2025-60719","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-60719","publisher":"Microsoft Security Response Center","context":"The article links to Microsoft’s advisory for CVE-2025-60719 while explaining that CVE-2026-68820 initially looked similar to that previously fixed AFD.sys use-after-free vulnerability.","category":"advisory","primary":false}],"body":"\u003cp\u003eCheck Point Research is tracking a long-running Operation Dream Job campaign affiliated with the DPRK-linked Lazarus group, with the latest wave focused on the defense sector in Europe and India. The campaign targets organizations worldwide, especially companies in aerospace, aviation, and military technologies such as surveillance sensors, drones, and robotics. Attackers used fake job opportunities to convince victims to download malicious files, including modified PDF viewers and attacker-crafted PDF documents.\u003c/p\u003e\n\n\u003cp\u003eThe article describes two active infection chains: one using DLL sideloading to run MISTPEN, and another using a trojanized PDF viewer called SecurityPDF to execute the newly identified Troy backdoor. MISTPEN retrieved additional in-memory modules through Microsoft Graph API and OneDrive, including reconnaissance tools, persistence components, a local privilege escalation loader, and the ForestTiger backdoor. During the intrusion, Lazarus exploited CVE-2026-68820, a zero-day vulnerability in Microsoft AFD.sys, to deploy a new version of the FudModule kernel-mode rootkit with SYSTEM privileges and disable EDR visibility.\u003c/p\u003e\n\n\u003cp\u003eThe attackers also compromised Roundcube webmail servers vulnerable to CVE-2025-49113 and deployed RelayShell, a PHP webshell used to turn compromised web servers into relay nodes for command-and-control communications. The infrastructure also included compromised WordPress and PrestaShop servers, and the article says at least 17 compromised servers were likely used as relay nodes. In at least one case, a compromised organization in Western Europe was leveraged to conduct spear-phishing against additional targets, abusing the organization’s reputation and trust.\u003c/p\u003e\n"},{"n":4,"title":"Researchers Disclose AI-Assisted SharePoint Exploit Chain Reaching Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/researchers-disclose-ai-assisted.html","time":"16:47","priority":"MUST READ","score":92,"tldr":"Researchers disclosed a SharePoint exploit chain that combines an unauthenticated JWT authentication bypass with a separate RCE flaw to let attackers impersonate users and run code on on-premises SharePoint servers. Organizations should ensure July fixes are installed and apply the August RCE update when available, especially because SharePoint Server 2016 and 2019 have reached end of support.","briefOverview":"\u003cp\u003eSecurity researchers found a way to access Microsoft SharePoint servers as any user, including an administrator, without a valid account. The flaw is tracked as CVE-2026-55040 and affects SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Server 2016, while SharePoint Online is not listed as affected. The attack requires the intruder to know the target account’s Active Directory security identifier or user principal name.\u003c/p\u003e\n\n\u003cp\u003eRapid7 chained that authentication bypass with a separate remote code execution flaw, CVE-2026-63520, to run code on a server with no credentials. The second flaw is an unsafe .NET type instantiation issue in SharePoint’s Business Connectivity Services and runs attacker code as the Windows service account behind the site. It affects SharePoint Server Subscription Edition, 2019, and 2016, as well as Project Server 2013 Service Pack 1 and Office Web Apps 2013 Service Pack 1.\u003c/p\u003e\n\n\u003cp\u003eRapid7 says the July SharePoint update breaks the exploit chain, and organizations running on-premises SharePoint should confirm it is installed and apply the August update when it appears. The article notes that SharePoint Server 2016 and 2019 reached end of support on July 14, while both are on the affected list for the newly disclosed RCE. Rapid7 also said a heavily prompted AI agent helped produce the two-vulnerability path, but expert steering was required because the model often produced questionable or inaccurate findings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found that CVE-2026-55040 lets a remote unauthenticated attacker assume a chosen user's identity on SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Server 2016 if the attacker knows the target account's SID or UPN.","Rapid7 chained CVE-2026-55040 with CVE-2026-63520, an unsafe .NET type instantiation flaw in SharePoint's Business Connectivity Services, to run code on a server with no credentials.","CVE-2026-63520 affects SharePoint Server Subscription Edition, SharePoint Server 2019, SharePoint Server 2016, Project Server 2013 Service Pack 1, and Office Web Apps 2013 Service Pack 1.","Rapid7 said a heavily prompted AI agent helped produce the two-vulnerability path during a March 2026 research sprint, but an expert had to steer the agent because it often produced questionable or inaccurate findings.","Organizations running on-premises SharePoint are advised to confirm the July update is installed, which Rapid7 says breaks the chain, and to apply the August update when it becomes available."],"insights":["The identity bypass prerequisite may be weak in practice because Rapid7’s proof of concept enumerated users by SID from the target’s domain controller until it identified the site administrator.","Rapid7 says installing the July SharePoint update breaks the unauthenticated RCE chain even though the separate RCE flaw was disclosed later and the article says August fix build numbers were not yet public.","The AI-assisted research was not fully autonomous: Rapid7 recorded extensive agent activity, but said expert steering was required because the model produced questionable findings and even violated the intended threat model by replaying admin credentials, enabling debug flags, and reading secrets.","SharePoint Server 2016 and 2019 reached end of support on July 14, creating an unresolved patching problem because both are affected by the newly disclosed RCE while Microsoft’s lifecycle guidance says products past end of support receive no new security updates.","CISA’s July 14 alert connected exposed SharePoint servers to active exploitation of other SharePoint flaws and warned that signs of compromise require incident response rather than only rotating IIS machine keys."],"referencedReports":[{"title":"CVE-2026-55040: Microsoft SharePoint JWT Token Authentication Bypass Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-55040-microsoft-sharepoint-jwt-token-authentication-bypass-fixed/","publisher":"Rapid7","context":"The article cites Rapid7’s write-up saying several issues in SharePoint’s JWT validation pipeline allowed unauthenticated attackers to act as a target user.","category":"research","primary":true},{"title":"CVE-2026-55040 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-55040","publisher":"National Vulnerability Database","context":"The article references CISA’s assessment of CVE-2026-55040 as filed to the National Vulnerability Database on July 14.","category":"advisory","primary":false},{"title":"Microsoft SharePoint JWT Token Authentication Bypass CVE-2026-55040","url":"https://www.rapid7.com/blog/post/ra-microsoft-sharepoint-jwt-token-authentication-bypass-cve-2026-55040/","publisher":"Rapid7","context":"The article says Rapid7 published its full technical analysis and proof-of-concept script for CVE-2026-55040 on August 11.","category":"research","primary":true},{"title":"CVE-2026-63520: Microsoft SharePoint Remote Code Execution Fixed","url":"https://www.rapid7.com/blog/post/etr-cve-2026-63520-microsoft-sharepoint-remote-code-execution-fixed/","publisher":"Rapid7","context":"The article links Rapid7’s disclosure of the separate SharePoint remote code execution flaw affecting several Microsoft products.","category":"research","primary":true},{"title":"CISA July 14 SharePoint Alert","url":"https://content.govdelivery.com/accounts/USDHSCISA/bulletins/4208511","publisher":"CISA","context":"The article cites CISA’s July 14 alert about other SharePoint flaws under active exploitation and guidance on hunting for artifacts and rotating IIS machine keys.","category":"advisory","primary":false}],"body":"\u003cp\u003eSecurity researchers found a way to access Microsoft SharePoint servers as any user, including an administrator, without a valid account. The flaw is tracked as CVE-2026-55040 and affects SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Server 2016, while SharePoint Online is not listed as affected. The attack requires the intruder to know the target account’s Active Directory security identifier or user principal name.\u003c/p\u003e\n\n\u003cp\u003eRapid7 chained that authentication bypass with a separate remote code execution flaw, CVE-2026-63520, to run code on a server with no credentials. The second flaw is an unsafe .NET type instantiation issue in SharePoint’s Business Connectivity Services and runs attacker code as the Windows service account behind the site. It affects SharePoint Server Subscription Edition, 2019, and 2016, as well as Project Server 2013 Service Pack 1 and Office Web Apps 2013 Service Pack 1.\u003c/p\u003e\n\n\u003cp\u003eRapid7 says the July SharePoint update breaks the exploit chain, and organizations running on-premises SharePoint should confirm it is installed and apply the August update when it appears. The article notes that SharePoint Server 2016 and 2019 reached end of support on July 14, while both are on the affected list for the newly disclosed RCE. Rapid7 also said a heavily prompted AI agent helped produce the two-vulnerability path, but expert steering was required because the model often produced questionable or inaccurate findings.\u003c/p\u003e\n"},{"n":5,"title":"DeadLock Ransomware Uses Polygon Smart Contracts to Make Extortion Infra Harder to Disrupt","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/deadlock-ransomware-uses-polygon-smart.html","time":"16:35","priority":"MUST READ","score":91,"tldr":"DeadLock ransomware is using Polygon smart contracts and Session-based encrypted communications to make its victim negotiation, data leak, and proxy infrastructure harder to disrupt. The approach lets operators rotate proxy addresses and host leak content without relying on traditional takedown-prone servers or domains.","briefOverview":"\u003cp\u003eThe ransomware group DeadLock has been observed using decentralized infrastructure to support victim communications and data leak operations. Microsoft Threat Intelligence said the group combines the Session messaging network with blockchain-backed services that store and deliver resources used during extortion. Microsoft also observed the ransomware being deployed by multiple threat actors, including an affiliate for Lynx and INC ransomware.\u003c/p\u003e\n\n\u003cp\u003eDeadLock was first detected in July 2025 and uses double extortion tactics by encrypting victim environments and threatening to publicly release exfiltrated data. As of this month, the group has claimed 96 victims, with most located in Italy, Spain, Poland, Türkiye, and the U.S. Attacks encrypt files with the “.dlock” extension, change file icons, modify the victim’s wallpaper, and direct victims to ransom notes.\u003c/p\u003e\n\n\u003cp\u003eA notable feature is an HTML recovery note that acts as a self-contained web application for encrypted chat, a paginated data leak blog, and a file browser without requiring a traditional backend server. The HTML file interacts with Polygon smart contracts to retrieve and rotate proxy server addresses, making parts of the communication and leak infrastructure more resistant to takedown. Microsoft said this model represents a meaningful evolution from traditional ransomware communication channels and creates new challenges for disruption efforts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft Threat Intelligence said DeadLock combines the Session messaging network with blockchain-backed services to store and deliver resources used during the extortion process.","DeadLock was first detected in July 2025 and uses double extortion tactics to encrypt victim environments while threatening to publicly release stolen data.","The ransomware encrypts files with the “.dlock” extension, changes file icons, modifies the victim’s wallpaper, and drops ransom notes that direct victims to communicate through Session or an interactive HTML recovery chat page.","The HTML recovery note interacts with Polygon smart contracts to retrieve and rotate proxy server addresses, making parts of DeadLock’s communication and leak infrastructure more resistant to takedown.","Microsoft said DeadLock includes geofencing, resource-aware throttling, log deletion, service-stopping scripts, Volume Shadow Copy deletion, and self-deletion mechanisms."],"insights":["DeadLock’s HTML ransom note functions as a self-contained victim portal with encrypted chat, a data leak blog, and a file browser, reducing the group’s dependence on a traditional backend server.","The use of Polygon smart contracts lets DeadLock change proxy server details without modifying victim-facing domains or domain registrations, which directly complicates conventional takedown approaches.","DeadLock’s encryption process is designed to pause when memory usage exceeds 29% or CPU load exceeds 70%, indicating the malware attempts to preserve system responsiveness while encryption is underway.","The ransomware’s country- and language-based geofencing avoids execution in environments linked to former Soviet, CIS, and select Middle Eastern countries.","Microsoft observed DeadLock being deployed by multiple threat actors, including an affiliate for Lynx and INC ransomware, despite earlier reporting that DeadLock had kept a lower profile by not being tied to known affiliate programs."],"referencedReports":[{"title":"DeadLock ransomware: Breaking down a Rust-based encryptor with decentralized recovery infrastructure","url":"https://www.microsoft.com/en-us/security/blog/2026/08/10/deadlock-ransomware-breaking-down-a-rust-based-encryptor-with-decentralized-recovery-infrastructure/","publisher":"Microsoft Threat Intelligence","context":"The article cites Microsoft Threat Intelligence’s analysis as the source for DeadLock’s use of Session messaging, blockchain-backed services, and technical behavior.","category":"research","primary":true},{"title":"DeadLock Ransomware Uses Polygon Smart Contracts","url":"https://www.group-ib.com/blog/deadlock-ransomware-polygon-smart-contracts/","publisher":"Group-IB","context":"The article references Group-IB’s earlier analysis describing DeadLock’s low profile and its use of Polygon smart contracts for proxy address delivery.","category":"research","primary":false}],"body":"\u003cp\u003eThe ransomware group DeadLock has been observed using decentralized infrastructure to support victim communications and data leak operations. Microsoft Threat Intelligence said the group combines the Session messaging network with blockchain-backed services that store and deliver resources used during extortion. Microsoft also observed the ransomware being deployed by multiple threat actors, including an affiliate for Lynx and INC ransomware.\u003c/p\u003e\n\n\u003cp\u003eDeadLock was first detected in July 2025 and uses double extortion tactics by encrypting victim environments and threatening to publicly release exfiltrated data. As of this month, the group has claimed 96 victims, with most located in Italy, Spain, Poland, Türkiye, and the U.S. Attacks encrypt files with the “.dlock” extension, change file icons, modify the victim’s wallpaper, and direct victims to ransom notes.\u003c/p\u003e\n\n\u003cp\u003eA notable feature is an HTML recovery note that acts as a self-contained web application for encrypted chat, a paginated data leak blog, and a file browser without requiring a traditional backend server. The HTML file interacts with Polygon smart contracts to retrieve and rotate proxy server addresses, making parts of the communication and leak infrastructure more resistant to takedown. Microsoft said this model represents a meaningful evolution from traditional ransomware communication channels and creates new challenges for disruption efforts.\u003c/p\u003e\n"},{"n":1,"title":"Windows 11 KB5121003 \u0026 KB5120240 cumulative updates released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5121003-and-kb5120240-cumulative-updates-released/","time":"17:38","priority":"SHOULD READ","score":82,"tldr":"Microsoft released mandatory Windows 11 cumulative updates KB5121003 and KB5120240 for versions 25H2/24H2 and 23H2, including August 2026 Patch Tuesday security fixes for 400 vulnerabilities. The updates also add usability and performance improvements across File Explorer, Windows Search, Voice Access, Widgets, Touchpad, Windows Hello, and power settings.","briefOverview":"\u003cp\u003eMicrosoft has released Windows 11 KB512103 and KB5120240 cumulative updates for versions 25H2/24H2 and 23H2. The updates are mandatory because they include the August 2026 Patch Tuesday security patches for 400 vulnerabilities discovered in previous months. Users can install the update through Windows Update by going to Start, Settings, Windows Update, and selecting Check for Updates, or they can manually download it from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe release is the eighth Patch Tuesday release in 2026 and is based on 24H2, which means Windows 11 25H2 receives the same update. Microsoft says there are no exclusive or special changes for 25H2, and the same fixes apply across the two Windows 11 versions. The update improves Windows Search handling of typos and partial app names, improves Settings search relevance, and adds multiple File Explorer changes including better file size units and middle-click folder opening in new tabs.\u003c/p\u003e\n\n\u003cp\u003eThe update also adds or improves features across Voice Access, Widgets, Touchpad, Start menu, Voice Typing, Accessibility, Windows Hello, fonts, power and battery settings, Windows Update, sounds, and date and time handling. Windows Hello Enhanced Sign-in Security now supports peripheral fingerprint sensors on supported devices, including desktops and other Windows 11 PCs. Microsoft says it is not aware of any new issues with this month’s Patch Tuesday update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released Windows 11 KB512103 and KB5120240 cumulative updates for versions 25H2/24H2 and 23H2 to fix security vulnerabilities, bugs, and add new features.","The updates are mandatory because they include the August 2026 Patch Tuesday security patches for 400 vulnerabilities discovered in previous months.","Users can install the updates through Start \u003e Settings \u003e Windows Update by selecting Check for Updates, or manually through the Microsoft Update Catalog.","The August 2026 Patch Tuesday update improves Windows Search handling of typos and partial app names, improves Settings search relevance, and includes multiple File Explorer fixes.","Microsoft said it is not aware of any new issues with this month’s Patch Tuesday release."],"insights":["Windows 11 25H2 receives the same update as 24H2, with no exclusive or special changes between the two versions in this release.","Many of the improvements in the update may not appear immediately, even after installation.","Windows Hello Enhanced Sign-in Security is beginning to roll out for supported peripheral fingerprint sensors, extending the feature to desktops and other Windows 11 PCs beyond devices with built-in fingerprint sensors.","The update changes post-update cleanup logic to improve system performance immediately after an update.","Microsoft reports no known new issues with this Patch Tuesday release at the time of publication."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft has released Windows 11 KB512103 and KB5120240 cumulative updates for versions 25H2/24H2 and 23H2. The updates are mandatory because they include the August 2026 Patch Tuesday security patches for 400 vulnerabilities discovered in previous months. Users can install the update through Windows Update by going to Start, Settings, Windows Update, and selecting Check for Updates, or they can manually download it from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eThe release is the eighth Patch Tuesday release in 2026 and is based on 24H2, which means Windows 11 25H2 receives the same update. Microsoft says there are no exclusive or special changes for 25H2, and the same fixes apply across the two Windows 11 versions. The update improves Windows Search handling of typos and partial app names, improves Settings search relevance, and adds multiple File Explorer changes including better file size units and middle-click folder opening in new tabs.\u003c/p\u003e\n\n\u003cp\u003eThe update also adds or improves features across Voice Access, Widgets, Touchpad, Start menu, Voice Typing, Accessibility, Windows Hello, fonts, power and battery settings, Windows Update, sounds, and date and time handling. Windows Hello Enhanced Sign-in Security now supports peripheral fingerprint sensors on supported devices, including desktops and other Windows 11 PCs. Microsoft says it is not aware of any new issues with this month’s Patch Tuesday update.\u003c/p\u003e\n"},{"n":2,"title":"Wesco confirms security incident after ExfilSquad claims data theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/wesco-confirms-security-incident-after-exfilsquad-claims-data-theft/","time":"15:59","priority":"SHOULD READ","score":82,"tldr":"Wesco confirmed it is investigating a security incident involving its cloud CRM environment after ExfilSquad claimed to have stolen and leaked 2.6 million records. The company says operations are unaffected and it does not believe sensitive customer, employee, payment card, or financial data is at risk.","briefOverview":"\u003cp\u003eGlobal supply chain and distribution giant Wesco confirmed to BleepingComputer that it is investigating a cybersecurity incident. The statement followed claims by data extortion group ExfilSquad that it stole sensitive information from Wesco and leaked it on its data leak site. Wesco said the incident involves the company’s cloud CRM environment.\u003c/p\u003e\n\n\u003cp\u003eWesco said it worked with its cloud CRM vendor and does not believe there is a risk to sensitive data. The company said it has not experienced business disruption and that all operations continue as normal. Wesco also said the incident was detected quickly and that its investigation found no evidence of ransomware or other malicious software on its IT systems.\u003c/p\u003e\n\n\u003cp\u003eExfilSquad claimed it stole 2.6 million records containing customer and employee PII, account and contact data, CRM user profiles, credit and business identifiers, authentication metadata, and access information. After its deadline for ransom payment negotiations expired, ExfilSquad published the data allegedly taken from Wesco’s systems. The article also notes that recent reports from Resecurity and VenariX say ExfilSquad has previously targeted improperly configured Microsoft Power Pages data tables, while public information indicates Wesco may be using Microsoft Dynamics 365.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Wesco confirmed to BleepingComputer that it is investigating a cybersecurity incident involving the company’s cloud CRM environment.","Data extortion group ExfilSquad claimed it stole 2.6 million records from Wesco containing customer and employee PII, account and contact data, CRM user profiles, credit and business identifiers, authentication metadata, and access information.","After its deadline for Wesco to enter ransom payment negotiations expired, ExfilSquad published the data allegedly exfiltrated from Wesco’s systems.","Wesco said it detected the incident quickly, found no evidence of ransomware or other malicious software on its IT systems, and has not experienced business disruption.","Wesco said it does not believe payment card information, financial account information, or other sensitive customer or employee data is at risk."],"insights":["Wesco’s statement separates the cloud CRM incident from its broader IT systems, saying its investigation found no ransomware or other malicious software and no business disruption.","There is a clear gap between ExfilSquad’s claim that it stole customer and employee PII and Wesco’s position that sensitive customer or employee data is not at risk.","Recent researcher reports cited in the article say ExfilSquad has previously targeted improperly configured Microsoft Power Pages data tables, making cloud CRM and portal configuration a notable area of concern in this case.","ExfilSquad published the allegedly stolen Wesco data only after its deadline for ransom negotiations expired, showing the group used public data leakage as pressure for payment."],"referencedReports":[{"title":"ExfilSquad Targets New Victims, Shares Data via Torrents","url":"https://www.resecurity.com/blog/article/exfilsquad-targets-new-victims-shares-data-via-torrents","publisher":"resecurity","context":"The article cites this as a recent researcher report examining ExfilSquad activity and noting that the group has targeted improperly configured Microsoft Power Pages data tables.","category":"research","primary":false},{"title":"ExfilSquad Targets Misconfigured Microsoft Power Pages Portals","url":"https://www.linkedin.com/pulse/exfilsquad-targets-misconfigured-microsoft-power-pages-portals-odhtc/","publisher":"venarix","context":"The article cites this as a recent researcher report examining ExfilSquad activity and noting prior targeting of improperly configured Microsoft Power Pages data tables.","category":"research","primary":false}],"body":"\u003cp\u003eGlobal supply chain and distribution giant Wesco confirmed to BleepingComputer that it is investigating a cybersecurity incident. The statement followed claims by data extortion group ExfilSquad that it stole sensitive information from Wesco and leaked it on its data leak site. Wesco said the incident involves the company’s cloud CRM environment.\u003c/p\u003e\n\n\u003cp\u003eWesco said it worked with its cloud CRM vendor and does not believe there is a risk to sensitive data. The company said it has not experienced business disruption and that all operations continue as normal. Wesco also said the incident was detected quickly and that its investigation found no evidence of ransomware or other malicious software on its IT systems.\u003c/p\u003e\n\n\u003cp\u003eExfilSquad claimed it stole 2.6 million records containing customer and employee PII, account and contact data, CRM user profiles, credit and business identifiers, authentication metadata, and access information. After its deadline for ransom payment negotiations expired, ExfilSquad published the data allegedly taken from Wesco’s systems. The article also notes that recent reports from Resecurity and VenariX say ExfilSquad has previously targeted improperly configured Microsoft Power Pages data tables, while public information indicates Wesco may be using Microsoft Dynamics 365.\u003c/p\u003e\n"},{"n":3,"title":"Cyberattack on logistics giant Ceva hits retailers and Steam customers across Europe","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ceva-logistics-cyberattack-bol-steam-debijenkorf-ace-tate","time":"15:43","priority":"SHOULD READ","score":82,"tldr":"A cyberattack on Ceva Logistics disrupted operations at eight European warehouses, delaying shipments for retailers including Bol, De Bijenkorf, Ace \u0026 Tate, Ajax and Steam’s European hardware business. Customer delivery and order data may have been exposed, but the attacker and full scope remain unclear.","briefOverview":"\u003cp\u003eA cyberattack on Ceva Logistics reportedly disrupted shipments for major European retailers and may have exposed customer data tied to Steam hardware purchases in Europe. Ceva has not publicly disclosed the attack and did not respond to a request for comment. Media reports said the intrusion affected part of Ceva’s contract logistics business and disrupted operations at eight warehouses in Europe.\u003c/p\u003e\n\n\u003cp\u003eAffected companies reportedly include Bol, De Bijenkorf, Ace \u0026amp; Tate, Ajax, and Steam’s hardware business in Europe. Bol said cybercriminals gained access to two Ceva systems used to process orders from one of its distribution centers, while its own systems were not affected. Potentially exposed data included names, addresses, postal codes, telephone numbers, email addresses, order numbers, tracking information, purchase details, and in some cases gift card messages.\u003c/p\u003e\n\n\u003cp\u003eValve notified European customers that information connected to physical Steam hardware purchases may have been compromised because Ceva handles its shipments in Europe and can retain delivery records for up to 90 days after an order. Valve said it could not determine exactly which records attackers obtained and was pressing Ceva for the full scope of what was taken and how. The attacker has not been publicly identified, and it remains unclear whether ransomware was used or whether an extortion demand was made.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A cyberattack on Ceva Logistics reportedly disrupted operations at eight warehouses in Europe, causing shipping delays for retailers whose inventory was stored at the affected facilities.","Ceva has not publicly disclosed the attack and did not respond to a request for comment, while the full scope of the breach and the locations of the affected warehouses remain unclear.","Bol said cybercriminals gained access to two Ceva systems used to process orders from one of Bol’s distribution centers, and customer and shipment information may have been viewed or copied.","Affected companies reportedly include Bol, De Bijenkorf, Ace \u0026 Tate, Ajax, and Steam’s hardware business in Europe.","Valve notified European customers that information tied to physical Steam hardware purchases, including names, addresses, phone numbers, email addresses, and hardware order details, may have been compromised."],"insights":["Valve’s notice shows that logistics providers may retain customer delivery records for up to 90 days after an order, meaning exposure can affect customers even after a shipment is complete.","Bol’s response highlights a practical containment step for third-party incidents: it suspended data exchanges with Ceva and said they would resume only when safe.","The incident affected contract logistics warehouses while Ceva’s air, ocean, ground, and rail transportation management operations reportedly continued without disruption, showing that impact can be limited to specific business units within a large logistics provider.","Several affected customers learned or disclosed details before Ceva made any public statement, making client notifications and downstream customer warnings a major source of information about the incident."],"referencedReports":[],"body":"\u003cp\u003eA cyberattack on Ceva Logistics reportedly disrupted shipments for major European retailers and may have exposed customer data tied to Steam hardware purchases in Europe. Ceva has not publicly disclosed the attack and did not respond to a request for comment. Media reports said the intrusion affected part of Ceva’s contract logistics business and disrupted operations at eight warehouses in Europe.\u003c/p\u003e\n\n\u003cp\u003eAffected companies reportedly include Bol, De Bijenkorf, Ace \u0026amp; Tate, Ajax, and Steam’s hardware business in Europe. Bol said cybercriminals gained access to two Ceva systems used to process orders from one of its distribution centers, while its own systems were not affected. Potentially exposed data included names, addresses, postal codes, telephone numbers, email addresses, order numbers, tracking information, purchase details, and in some cases gift card messages.\u003c/p\u003e\n\n\u003cp\u003eValve notified European customers that information connected to physical Steam hardware purchases may have been compromised because Ceva handles its shipments in Europe and can retain delivery records for up to 90 days after an order. Valve said it could not determine exactly which records attackers obtained and was pressing Ceva for the full scope of what was taken and how. The attacker has not been publicly identified, and it remains unclear whether ransomware was used or whether an extortion demand was made.\u003c/p\u003e\n"},{"n":6,"title":"How Trail of Bits helps verify the integrity of your Signal chats","source":"blog.trailofbits.com","sourceColorIdx":6,"link":"https://blog.trailofbits.com/2026/08/11/how-trail-of-bits-helps-verify-the-integrity-of-your-signal-chats/","time":"17:30","priority":"SHOULD READ","score":78,"tldr":"Trail of Bits now operates an independent auditor for Signal’s Automatic Key Verification system, helping ensure users see a globally consistent and honest mapping of phone numbers to public keys. This reduces reliance on manual safety-number checks and makes server-based key-substitution attacks harder to hide.","briefOverview":"\u003cp\u003eSignal recently launched Automatic Key Verification, a feature that helps validate that chats are secure without requiring users to directly compare safety numbers. Trail of Bits built and operates one of the three auditors that make the system trustworthy. Its auditor is an independent implementation written from scratch and continuously checks that the Automatic Key Verification system behaves honestly.\u003c/p\u003e\n\n\u003cp\u003eAutomatic Key Verification uses key transparency to create a globally consistent view of the public keys associated with each phone number. Signal clients periodically check that all keys stored in the global map for the user’s account belong to that user’s devices, and they warn if the log cannot be verified or unexpected keys are found. This matters because a compromised server could otherwise provide a false public key and cause messages to be encrypted to an attacker instead of the intended recipient.\u003c/p\u003e\n\n\u003cp\u003eTrail of Bits updates a local Merkle tree copy of the map when new entries are added and periodically signs the tree head with its own signing key. Signal clients currently require recent signatures from all three registered auditors: Signal, Cloudflare, and Trail of Bits. If valid auditor signatures are not presented, Automatic Key Verification fails, and a fully malicious server can maintain a split view for at most one week before client applications begin displaying warnings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Signal launched Automatic Key Verification to help validate that chats are secure without requiring direct safety number comparison.","Trail of Bits built and operates one of the three auditors that continuously checks whether Signal’s Automatic Key Verification system behaves honestly.","The Trail of Bits auditor independently verifies that the user-to-public-key map is globally consistent, well formed, and does not hide entries.","Signal clients currently require recent valid signatures from all three registered auditors: Signal, Cloudflare, and Trail of Bits.","Trail of Bits implemented its auditor from scratch based on the specification and has released the code as open source."],"insights":["A fully malicious Signal key transparency server can maintain a split view of the system for at most one week before client applications start displaying warning messages, because clients require auditor-endorsed tree heads from the last seven days.","Signal clients currently require signatures from all three registered auditors, so Automatic Key Verification depends on the availability and valid signing behavior of Signal, Cloudflare, and Trail of Bits together.","Trail of Bits intentionally wrote its auditor from scratch rather than using Signal’s reference implementation, providing an independent check against implementation-level assumptions or shared defects.","Automatic Key Verification may not support chats that began by searching for a recipient’s username, so users in that situation may still need to fall back to manual safety number comparison."],"referencedReports":[],"body":"\u003cp\u003eSignal recently launched Automatic Key Verification, a feature that helps validate that chats are secure without requiring users to directly compare safety numbers. Trail of Bits built and operates one of the three auditors that make the system trustworthy. Its auditor is an independent implementation written from scratch and continuously checks that the Automatic Key Verification system behaves honestly.\u003c/p\u003e\n\n\u003cp\u003eAutomatic Key Verification uses key transparency to create a globally consistent view of the public keys associated with each phone number. Signal clients periodically check that all keys stored in the global map for the user’s account belong to that user’s devices, and they warn if the log cannot be verified or unexpected keys are found. This matters because a compromised server could otherwise provide a false public key and cause messages to be encrypted to an attacker instead of the intended recipient.\u003c/p\u003e\n\n\u003cp\u003eTrail of Bits updates a local Merkle tree copy of the map when new entries are added and periodically signs the tree head with its own signing key. Signal clients currently require recent signatures from all three registered auditors: Signal, Cloudflare, and Trail of Bits. If valid auditor signatures are not presented, Automatic Key Verification fails, and a fully malicious server can maintain a split view for at most one week before client applications begin displaying warnings.\u003c/p\u003e\n"},{"n":8,"title":"Operation Vital Signs: First-of-its-kind exercise stress tests health sector cyber resilience","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/operation-vital-signs-first-of-its-kind-exercise-stress-tests-health-sector-cyber-resilience/","time":"15:52","priority":"MAY READ","score":62,"tldr":"Health-ISAC and the Health Sector Coordinating Council ran Operation Vital Signs, the first national tabletop exercise to test how U.S. healthcare organizations would coordinate during major cyber disruptions. The key takeaway is that healthcare cyber resilience depends on trusted cross-sector relationships and information-sharing mechanisms before a shared digital dependency fails.","briefOverview":"\u003cp\u003eHealth organizations across the U.S. conducted Operation Vital Signs, the inaugural national tabletop exercise testing sector-wide response to major cyber disruptions. The virtual event was co-sponsored by Health-ISAC and the Health Sector Coordinating Council Cybersecurity Working Group. It drew over 500 participants from organizations of all sizes, including hospitals, pharmaceutical companies, medical device manufacturers, payers, health IT, labs, and pharmacies.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exercise reflected healthcare’s complex digital dependencies. Operation Vital Signs pressure-tested both individual organizational playbooks and the collective mechanisms the sector relies on during widespread emergencies. The scenario was built around digital fragility and included issues such as staffing strain, uncertainty, and recovery drag.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that healthcare organizations want to collaborate, compare approaches, and strengthen cybersecurity coordination. It says this depends on trusted relationships and mechanisms that allow organizations to act collectively when a shared dependency fails. The exercise also focused on connecting dots across the sector, overcoming barriers to information sharing, and looking ahead.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health organizations across the U.S. conducted Operation Vital Signs, the inaugural national tabletop exercise testing sector-wide response to major cyber disruptions.","Operation Vital Signs was co-sponsored by Health-ISAC and the Health Sector Coordinating Council Cybersecurity Working Group.","The virtual event drew over 500 participants from organizations including hospitals, pharmaceutical companies, medical device manufacturers, payers, health IT, labs, and pharmacies.","The exercise pressure-tested both individual organizational playbooks and collective mechanisms the healthcare sector relies on during widespread emergencies.","The article says healthcare organizations want to collaborate, compare approaches, and strengthen cybersecurity coordination through trusted relationships and mechanisms for collective action."],"insights":["Operation Vital Signs focused on failures of shared dependencies, showing that healthcare cyber resilience is treated as a sector-wide coordination problem rather than only an internal organization issue.","The exercise brought together many different types of healthcare organizations, indicating that disruption planning must account for dependencies across hospitals, pharmaceutical companies, device makers, payers, health IT, labs, and pharmacies.","The article highlights trusted relationships and information-sharing mechanisms as prerequisites for collective action during emergencies, not as optional activities after a crisis begins.","The exercise explicitly included staffing strain, uncertainty, and recovery drag, showing that resilience planning considered operational pressure and prolonged disruption, not only the initial technical incident."],"referencedReports":[],"body":"\u003cp\u003eHealth organizations across the U.S. conducted Operation Vital Signs, the inaugural national tabletop exercise testing sector-wide response to major cyber disruptions. The virtual event was co-sponsored by Health-ISAC and the Health Sector Coordinating Council Cybersecurity Working Group. It drew over 500 participants from organizations of all sizes, including hospitals, pharmaceutical companies, medical device manufacturers, payers, health IT, labs, and pharmacies.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exercise reflected healthcare’s complex digital dependencies. Operation Vital Signs pressure-tested both individual organizational playbooks and the collective mechanisms the sector relies on during widespread emergencies. The scenario was built around digital fragility and included issues such as staffing strain, uncertainty, and recovery drag.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that healthcare organizations want to collaborate, compare approaches, and strengthen cybersecurity coordination. It says this depends on trusted relationships and mechanisms that allow organizations to act collectively when a shared dependency fails. The exercise also focused on connecting dots across the sector, overcoming barriers to information sharing, and looking ahead.\u003c/p\u003e\n"}]</script>
