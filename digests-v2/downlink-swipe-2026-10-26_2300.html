<script type="application/json" id="dl-articles">[{"n":1,"title":"Brotli2Shell: Frequently asked questions for Google Brotli decoder vulnerability (CVE-2026-111497)","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/brotli2shell-frequently-asked-questions-for-google-brotli-decoder-cve-2026-111497","time":"01:19","priority":"MUST READ","score":95,"tldr":"CVE-2026-111497 (Brotli2Shell) is a critical out-of-bounds write in the Google Brotli decoder that can enable remote code execution when applications decompress attacker-controlled data. Organizations should update affected Brotli-dependent software, including Node.js, .NET, Bun, Envoy, Istio, Python packages, and PHP Windows builds, then restart or redeploy affected workloads.","briefOverview":"\u003cp\u003eCVE-2026-111497, also called Brotli2Shell, is an out-of-bounds write flaw in Google’s Brotli C decoder library that Google scored 9.2 under CVSSv4.0. An attacker can trigger it by causing an application to decompress crafted Brotli data, including through compressed HTTP responses or request bodies. The possible impact ranges from application crashes and process-memory disclosure to potential remote code execution, and public proof-of-concept code is available.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects software that uses a vulnerable Brotli decoder, including Google Brotli, Node.js, Bun, Envoy Proxy, Istio, supported Microsoft .NET releases, Python Brotli packages, and PHP Windows builds. JFrog research also identified reachable paths in FFmpeg, Apache Arrow, and ClickHouse, while Python HTTP clients may be affected when Brotli or brotlicffi is installed. Fixed releases are available for major affected projects, but embedded Brotli copies require updating the application itself, and patched processes, containers, and scheduled jobs must be restarted or redeployed for the fix to take effect.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-111497, also called Brotli2Shell, is an out-of-bounds write flaw in Google’s Brotli decoder that Google scored 9.2 under CVSSv4.0.","An attacker can trigger the flaw by causing an application to unpack crafted Brotli data, including through compressed HTTP responses or compressed request bodies.","Affected software includes Google Brotli, Node.js, Bun, Envoy Proxy, Istio, supported Microsoft .NET releases, Python Brotli packages, and PHP Windows builds, with fixed versions listed in the article.","The possible effects range from a program crash and memory disclosure to potential remote code execution, and public proof-of-concept code is available.","Organizations should install fixed application releases and restart or redeploy affected processes, containers, and scheduled jobs because updating only a system Brotli library does not fix software that includes its own copy."],"insights":["Updating a system-installed Brotli library alone may not resolve the issue because applications such as Node.js and Bun can ship with their own embedded decoder copy.","Removing \"br\" from an HTTP client’s Accept-Encoding header is not a complete mitigation, because a hostile server can still send Brotli-compressed data.","Microsoft states that affected .NET packages alone do not make an application exposed: ASP.NET Core request decompression and HttpClient automatic response decompression are disabled by default.","Node.js versions that have reached end of support, including versions 20, 23, and 25, will not receive fixed releases.","Patches take effect only after affected processes or scheduled jobs are restarted, and containers must be rebuilt and redeployed."],"referencedReports":[{"title":"Wednesday, October 21, 2026 Security Releases","url":"https://nodejs.org/en/blog/vulnerability/october-2026-security-releases","publisher":"Node.js","context":"The article cites this security advisory as Node.js's public disclosure of CVE-2026-111497 and source for its fixed releases.","category":"advisory","primary":true},{"title":"GHSA-3wvj-j6qm-62mr","url":"https://github.com/envoyproxy/envoy/security/advisories/GHSA-3wvj-j6qm-62mr","publisher":"Envoy Proxy","context":"The article cites Envoy Proxy's security advisory for fixed releases that addressed the flaw before it was named publicly.","category":"advisory","primary":false},{"title":"Istio Security 2026-007","url":"https://istio.io/latest/news/security/istio-security-2026-007/","publisher":"Istio","context":"The article cites this Istio security advisory for releases that fixed the Brotli decoder issue.","category":"advisory","primary":false},{"title":"Brotli2Shell: Beyond Node(2Shell) and HTTP(2Shell)","url":"https://research.jfrog.com/post/brotli2shell-beyond-node2shell-and-http2shell/","publisher":"JFrog Security Research","context":"The article references JFrog's research showing impacts in FFmpeg, Apache Arrow, and ClickHouse through crafted Brotli-compressed inputs.","category":"research","primary":false},{"title":"CVE-2026-111497: .NET Brotli Decoder Out-of-bounds Write Vulnerability","url":"https://github.com/dotnet/announcements/issues/494","publisher":"Microsoft","context":"The article cites Microsoft's security advisory for .NET exposure conditions, severity rating, and fixed updates.","category":"advisory","primary":false},{"title":"Node2Shell: From Brotli Data to Remote Code Execution","url":"https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/","publisher":"Imperva Red Team","context":"The article references Imperva's technical demonstration of code execution against an official Node.js 24.22.0 Linux arm64 image.","category":"research","primary":false},{"title":"Node2Shell: remote code execution on stock Node.js builds (CVE-2026-111497)","url":"https://ellio.tech/en/blog/node2shell-cve-2026-111497-rce-on-stock-nodejs-builds/","publisher":"ELLIO","context":"The article cites ELLIO's report of an observed exploitation attempt and its reproduction of code execution against an official Node.js build.","category":"research","primary":false},{"title":"Inside Node2Shell: A Closer Look at CVE-2026-111497","url":"https://www.akamai.com/blog/security-research/inside-node2shell-closer-look-cve-2026-111497","publisher":"Akamai","context":"The article references Akamai's analysis reporting telemetry that 61% of networks were running affected Node.js versions.","category":"research","primary":false},{"title":"Brotli decoder vulnerability","url":"https://patchtheplanet.org/brotli","publisher":"Patch the Planet","context":"The article references this mitigation guide for temporary steps to reduce exposure while patching is delayed.","category":"guide","primary":false}],"body":"\u003cp\u003eCVE-2026-111497, also called Brotli2Shell, is an out-of-bounds write flaw in Google’s Brotli C decoder library that Google scored 9.2 under CVSSv4.0. An attacker can trigger it by causing an application to decompress crafted Brotli data, including through compressed HTTP responses or request bodies. The possible impact ranges from application crashes and process-memory disclosure to potential remote code execution, and public proof-of-concept code is available.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects software that uses a vulnerable Brotli decoder, including Google Brotli, Node.js, Bun, Envoy Proxy, Istio, supported Microsoft .NET releases, Python Brotli packages, and PHP Windows builds. JFrog research also identified reachable paths in FFmpeg, Apache Arrow, and ClickHouse, while Python HTTP clients may be affected when Brotli or brotlicffi is installed. Fixed releases are available for major affected projects, but embedded Brotli copies require updating the application itself, and patched processes, containers, and scheduled jobs must be restarted or redeployed for the fix to take effect.\u003c/p\u003e\n"}]</script>
