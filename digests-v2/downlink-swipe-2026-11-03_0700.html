<script type="application/json" id="dl-articles">[{"n":1,"title":"Synology NAS Devices Targeted in Ransomware Attacks Exploiting Patched DSM Flaw","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/synology-nas-devices-targeted-in.html","time":"07:43","priority":"MUST READ","score":93,"tldr":"Synology warns that attackers are exploiting an already patched DSM flaw to deploy C3RB3R ransomware on NAS devices running outdated software. Users should immediately update DSM to the fixed version for their release and enable automatic updates.","briefOverview":"\u003cp\u003eSynology is warning that threat actors are targeting Network Attached Storage devices running outdated versions of DiskStation Manager (DSM) with ransomware. The attackers are exploiting a flaw patched in December 2024 to encrypt data and demand payment. Customer reports associate the incidents with C3RB3R ransomware, which has been observed adding the \u0026ldquo;.L0CK3D\u0026rdquo; extension to locked files.\u003c/p\u003e\n\n\u003cp\u003eSynology did not name the exact vulnerability used in the attacks, but it linked to a November 2024 advisory covering three DSM issues: CVE-2024-10441, CVE-2024-50629, and CVE-2024-10445. The most severe, CVE-2024-10441, has a CVSS score of 9.8 and could allow remote code execution in DSM\u0026rsquo;s system plugin daemon. Synology recommends users update to the fixed DSM release for their version and enable automatic updates to keep their devices protected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Synology says threat actors are exploiting a DSM vulnerability patched in December 2024 to target NAS devices running outdated software.","The attacks encrypt data and demand a ransom, and customer reports identify the ransomware as C3RB3R, which appends the .L0CK3D extension to files.","Synology linked the attacks to an advisory covering CVE-2024-10441, CVE-2024-50629, and CVE-2024-10445.","CVE-2024-10441 has a CVSS score of 9.8 and can enable remote code execution in DSM's system plugin daemon through unspecified vectors.","Synology urges users to update DSM to fixed releases and enable automatic updates."],"insights":["Synology did not identify the exact flaw being used in the current attacks, but it directed users to an advisory containing three DSM issues, including CVE-2024-10441, a 9.8-rated remote code execution flaw.","The fixes are available across multiple DSM release branches, including DSM 6.2 through DSM 7.2.2, so users do not necessarily need to move to the newest major release to apply a security update.","Customer reports associate the current incidents with C3RB3R ransomware and the \".L0CK3D\" file extension, giving affected users a concrete indicator of the reported activity.","Synology NAS devices have faced prior ransomware-related threats through both software weaknesses and attempts to guess commonly used administrator credentials, showing that keeping software updated addresses only one of the risks described in the article."],"referencedReports":[{"title":"Synology SA-24:20","url":"https://www.synology.com/zh-tw/security/advisory/Synology_SA_24_20","publisher":"synology","context":"The article links to this November 2024 security advisory, which lists three DSM vulnerabilities associated with the patched updates.","category":"advisory","primary":false},{"title":"eCh0raix Ransomware Targets QNAP and Synology NAS Devices","url":"https://unit42.paloaltonetworks.com/ech0raix-ransomware-soho/","publisher":"palo-alto-networks-unit-42","context":"The article cites Unit 42's analysis of an eCh0raix variant targeting QNAP and Synology NAS devices through vulnerabilities or commonly used administrator credentials.","category":"research","primary":false}],"body":"\u003cp\u003eSynology is warning that threat actors are targeting Network Attached Storage devices running outdated versions of DiskStation Manager (DSM) with ransomware. The attackers are exploiting a flaw patched in December 2024 to encrypt data and demand payment. Customer reports associate the incidents with C3RB3R ransomware, which has been observed adding the \u0026ldquo;.L0CK3D\u0026rdquo; extension to locked files.\u003c/p\u003e\n\n\u003cp\u003eSynology did not name the exact vulnerability used in the attacks, but it linked to a November 2024 advisory covering three DSM issues: CVE-2024-10441, CVE-2024-50629, and CVE-2024-10445. The most severe, CVE-2024-10441, has a CVSS score of 9.8 and could allow remote code execution in DSM\u0026rsquo;s system plugin daemon. Synology recommends users update to the fixed DSM release for their version and enable automatic updates to keep their devices protected.\u003c/p\u003e\n"},{"n":2,"title":"Hackers Exploit BTCPay Server Flaw to Steal Bitcoin and Litecoin From Hot Wallets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-btcpay-server-flaw-to.html","time":"08:31","priority":"MUST READ","score":92,"tldr":"Attackers are draining Bitcoin and Litecoin hot wallets from BTCPay Server instances running version 2.4.1 or earlier by exploiting a flaw patched in 2.4.2. Users should upgrade to 2.4.7 and treat affected servers and their wallet secrets as compromised, migrating to a fresh server and new wallet.","briefOverview":"\u003cp\u003eBTCPay Server warned that attackers stole Bitcoin and Litecoin from hot wallets on instances running version 2.4.1 or earlier. The self-hosted cryptocurrency payment processor said the attackers used a different method to exploit the vulnerability fixed in version 2.4.2. Reports of the campaign began appearing around November 1, 2026, although BTCPay Server said it is unknown when exploitation first started.\u003c/p\u003e\n\n\u003cp\u003eUsers of version 2.4.1 or earlier are advised to move to a fresh server with a new wallet, including those who have not identified any theft. BTCPay Server said suspected affected systems and all secrets stored on them should be treated as compromised. Version 2.4.7 addresses one critical and several medium-severity issues, and BTCPay Server said it had received no credible reports of hot-wallet drains involving that current release. An earlier advisory said an unauthenticated remote attacker could obtain LND credential files and use them to take control of an LND node and move funds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers stole Bitcoin and Litecoin from hot wallets on BTCPay Server instances running version 2.4.1 or earlier.","BTCPay Server said the attackers used a different method to exploit the vulnerability fixed in version 2.4.2, released on August 7, 2026.","BTCPay Server recommends that users of version 2.4.1 or earlier move to a fresh server with a new wallet and treat the machine and all stored secrets as compromised.","BTCPay Server said it has received no credible reports of hot-wallet drains from users running version 2.4.7.","Mercado Bitcoin temporarily paused deposits and withdrawals after a security breach that it said involved approximately $38 million in assets, with $11 million already blocked."],"insights":["BTCPay Server advises users of version 2.4.1 or earlier to rebuild on a fresh server with a new wallet even when no theft has been detected, indicating that an apparently unaffected instance may still contain exposed secrets.","The earlier disclosed flaw could let an unauthenticated remote party obtain LND credential files and use them to take control of an LND node and move funds.","BTCPay Server recommends retaining only the funds required for daily operations in an internet-connected wallet and keeping the remaining spending keys off the server.","Some hosting providers may have automatically shut down BTCPay Server instances running older versions to prevent further exploitation."],"referencedReports":[{"title":"BTCPay Server Security Incident: 2.4.1 and Earlier","url":"https://blog.btcpayserver.org/btcpay-server-security-incident-2-4-1-and-earlier/","publisher":"btcpay-server","context":"BTCPay Server's incident post states that attacks targeted version 2.4.1 and earlier through a different method involving the flaw patched in 2.4.2.","category":"advisory","primary":true},{"title":"BTCPay Server Security Incident Response and Next Steps","url":"https://blog.btcpayserver.org/btcpay-server-security-incident-response-and-next-steps/","publisher":"btcpay-server","context":"The article references this August 2026 incident-response disclosure concerning a critical flaw used to steal funds from some BTCPay Server users.","category":"advisory","primary":false},{"title":"Security Advisory: BTCPay Server 2.4.2","url":"https://blog.btcpayserver.org/security-advisory-btcpay-server-2-4-2/","publisher":"btcpay-server","context":"The article cites this advisory for details that the flaw could expose LND credential files and enable movement of funds.","category":"advisory","primary":false}],"body":"\u003cp\u003eBTCPay Server warned that attackers stole Bitcoin and Litecoin from hot wallets on instances running version 2.4.1 or earlier. The self-hosted cryptocurrency payment processor said the attackers used a different method to exploit the vulnerability fixed in version 2.4.2. Reports of the campaign began appearing around November 1, 2026, although BTCPay Server said it is unknown when exploitation first started.\u003c/p\u003e\n\n\u003cp\u003eUsers of version 2.4.1 or earlier are advised to move to a fresh server with a new wallet, including those who have not identified any theft. BTCPay Server said suspected affected systems and all secrets stored on them should be treated as compromised. Version 2.4.7 addresses one critical and several medium-severity issues, and BTCPay Server said it had received no credible reports of hot-wallet drains involving that current release. An earlier advisory said an unauthenticated remote attacker could obtain LND credential files and use them to take control of an LND node and move funds.\u003c/p\u003e\n"},{"n":3,"title":"New Wave of Refrigeration Cyberattacks Hits Supermarkets Across Europe, Forcing Stores to Pull Food","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/second-wave-of-cyberattacks-hits.html","time":"07:27","priority":"SHOULD READ","score":84,"tldr":"Cyberattacks on internet-connected refrigeration controllers disrupted supermarkets and small food retailers across several European countries, causing some stores to remove or discard chilled and frozen goods. The incidents appear to target outdated, internet-exposed Danfoss and possibly Copeland systems with default credentials or unpatched software, prompting calls to isolate controllers and use secure remote access.","briefOverview":"\u003cp\u003eAttackers remotely changed refrigeration settings at supermarkets and food retailers in Belgium, Sweden, Estonia, and other European countries overnight into November 2. The changes placed units into defrost mode or raised temperature settings, including reported settings of 50°C at stores in Sweden and Estonia. Some retailers removed chilled and frozen products from sale or discarded spoiled goods, while others contained the problem before products were damaged.\u003c/p\u003e\n\n\u003cp\u003eThe incidents affected a limited number of stores at chains including Delhaize, Carrefour, ICA, Coop, SuperValu, Selver, and Intermarché, as well as smaller businesses. Several affected systems used Danfoss refrigeration controls, and a Belgian butcher reported that Copeland equipment was also targeted. Reports cited older, unpatched systems, direct internet exposure, and default passwords as contributing weaknesses, while authorities had not identified those responsible or confirmed links to the earlier French incidents.\u003c/p\u003e\n\n\u003cp\u003eCERT-FR advised operators to prevent direct internet access to affected controllers, review configurations and defrost schedules, use secure remote connections, change default passwords, and update firmware. It warned that end-of-life devices without security updates are highly likely to be compromised if left connected to the internet, and that a factory reset alone does not prevent reinfection. Danfoss said most units affected in France in October were older AK-SM 800 and AK-SC 355 models that it no longer updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers remotely changed refrigeration settings at supermarkets and food retailers in multiple European countries, warming fridges and freezers and prompting some businesses to remove or discard food.","Belgian, Swedish, Estonian, Irish, Dutch, Finnish, Portuguese, and Italian businesses reported affected refrigeration systems, although the reported number of stores and impact varied by company.","Several affected systems were made by Danfoss, while a Belgian butcher reported that Copeland equipment was also targeted; some incidents involved older systems, outdated software, internet exposure, or default passwords.","No group had claimed responsibility, and authorities had not determined whether the incidents were linked to the earlier attacks on French supermarkets.","CERT-FR advised operators to remove affected refrigeration controllers from direct internet access, review configurations and defrost schedules, use secure remote connections, change default passwords, and update firmware."],"insights":["The reported incidents could cause immediate physical and financial consequences: one Belgian butcher estimated €15,000 in spoiled meat, while stores in several countries removed chilled or frozen goods as a precaution.","A commanded temperature of 50°C did not always mean equipment reached that temperature; at the affected Estonian Selver store, the freezer rose only about 2–3°C before the issue was resolved in roughly 10 minutes.","Some affected stores were connected through refrigeration systems outside retailers’ central networks, meaning corporate protections did not necessarily cover the equipment controlling food storage.","CERT-FR warned that factory-resetting an end-of-life controller is not a lasting remedy if it remains internet-accessible, because devices without security fixes can be compromised again.","The article indicates that securing these installations may require physical changes as well as software updates, according to Sabcobel’s chief executive."],"referencedReports":[{"title":"CERTFR-2026-ALE-012","url":"https://cert.cyber.gouv.fr/alerte/CERTFR-2026-ALE-012/","publisher":"CERT-FR","context":"The article cites this October alert as the most detailed guidance for operators of affected Danfoss and Copeland refrigeration controllers.","category":"advisory","primary":false},{"title":"Cyberattacks Against Refrigeration Systems","url":"https://www.ncsc.se/sv/aktuellt/cyberangrepp-mot-kylsystem/","publisher":"Sweden's National Cybersecurity Centre","context":"The article references this notice for its advice to identify internet-connected refrigeration devices and keep necessary connections updated and protected.","category":"advisory","primary":false}],"body":"\u003cp\u003eAttackers remotely changed refrigeration settings at supermarkets and food retailers in Belgium, Sweden, Estonia, and other European countries overnight into November 2. The changes placed units into defrost mode or raised temperature settings, including reported settings of 50°C at stores in Sweden and Estonia. Some retailers removed chilled and frozen products from sale or discarded spoiled goods, while others contained the problem before products were damaged.\u003c/p\u003e\n\n\u003cp\u003eThe incidents affected a limited number of stores at chains including Delhaize, Carrefour, ICA, Coop, SuperValu, Selver, and Intermarché, as well as smaller businesses. Several affected systems used Danfoss refrigeration controls, and a Belgian butcher reported that Copeland equipment was also targeted. Reports cited older, unpatched systems, direct internet exposure, and default passwords as contributing weaknesses, while authorities had not identified those responsible or confirmed links to the earlier French incidents.\u003c/p\u003e\n\n\u003cp\u003eCERT-FR advised operators to prevent direct internet access to affected controllers, review configurations and defrost schedules, use secure remote connections, change default passwords, and update firmware. It warned that end-of-life devices without security updates are highly likely to be compromised if left connected to the internet, and that a factory reset alone does not prevent reinfection. Danfoss said most units affected in France in October were older AK-SM 800 and AK-SC 355 models that it no longer updates.\u003c/p\u003e\n"},{"n":4,"title":"MLEP in KICS for Networks 5.0: how machine learning helps track network behavior of OT devices","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/machine-learning-event-processor-in-kics-for-networks/121794/","time":"10:00","priority":"MAY READ","score":42,"tldr":"Kaspersky Industrial CyberSecurity for Networks 5.0 introduces MLEP, a machine-learning component that analyzes industrial network behavior to improve OT asset categorization and flag deviations such as new hosts, protocols, scanning activity, unusual transfer volumes, and atypical operating times.","briefOverview":"\u003cp\u003eKaspersky Industrial CyberSecurity for Networks 5.0 includes the Machine Learning Event Processor (MLEP), a service designed to refine industrial-device categories and detect unusual network behavior. The article describes how incomplete or outdated asset inventories can make it difficult to distinguish expected industrial communications from suspicious ones. MLEP uses recurring communication patterns to help identify a device’s likely role when direct device information is unavailable.\u003c/p\u003e\n\n\u003cp\u003eMLEP converts network sessions into 15-second event fragments that record endpoints, ports, traffic direction, protocols, packet counts, and packet sizes. It compares a device’s current behavior with its observed history and includes preconfigured detections for new external hosts, new destination-and-port combinations, unusually large data transfers, atypical activity times, new protocols, and activity resembling scanning. The resulting alerts are intended to help analysts investigate changes, correlate them with other events and device context, and reconstruct activity around an incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky Industrial CyberSecurity for Networks 5.0 includes the Machine Learning Event Processor (MLEP), which can refine industrial device categories and detect unusual network behavior.","MLEP represents network sessions as 15-second event fragments containing endpoint, port, direction, protocol, packet-count, and packet-size information rather than storing every packet separately.","MLEP can use similar recurring communication patterns among known and uncategorized assets to suggest a category for devices whose roles are not identified directly.","The initial MLEP release includes six preconfigured anomaly monitors for new external hosts, new destination-address-and-port combinations, unusually large outbound data volumes, atypical activity times, new protocols, and activity resembling scanning.","MLEP alerts are intended to help analysts correlate behavior changes with other events and reconstruct activity around an already detected incident."],"insights":["MLEP can improve an incomplete industrial asset inventory by comparing an unknown device’s recurring communication patterns with devices whose categories are already known, even when direct identifying traffic is unavailable.","The system deliberately analyzes 15-second traffic summaries rather than individual packets, which reduces storage and processing needs but prevents it from reconstructing the exact packet order or command contents.","MLEP’s anomaly alerts identify changes worth investigating rather than proving malicious activity, so analysts must correlate them with device roles, protocol information, other events, and operational context.","Category suggestions are constrained by existing device metadata and rules, but their quality still depends on how much network traffic is visible and how often the device communicates."],"referencedReports":[{"title":"Foundations of OT Cybersecurity Asset Inventory Guidance for Owners and Operators","url":"https://www.cisa.gov/resources-tools/resources/foundations-ot-cybersecurity-asset-inventory-guidance-owners-and-operators","publisher":"cisa and partners","context":"The article cites this 2025 joint guidance to note that OT device inventorying and role classification are part of asset management.","category":"guide","primary":false},{"title":"State of ICS/OT Security 2025","url":"https://www.sans.org/white-papers/state-of-ics-ot-security-2025","publisher":"sans institute","context":"The article cites this survey for figures on organizations expanding ICS inventory and visibility tools and prioritizing further investment.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky Industrial CyberSecurity for Networks 5.0 includes the Machine Learning Event Processor (MLEP), a service designed to refine industrial-device categories and detect unusual network behavior. The article describes how incomplete or outdated asset inventories can make it difficult to distinguish expected industrial communications from suspicious ones. MLEP uses recurring communication patterns to help identify a device’s likely role when direct device information is unavailable.\u003c/p\u003e\n\n\u003cp\u003eMLEP converts network sessions into 15-second event fragments that record endpoints, ports, traffic direction, protocols, packet counts, and packet sizes. It compares a device’s current behavior with its observed history and includes preconfigured detections for new external hosts, new destination-and-port combinations, unusually large data transfers, atypical activity times, new protocols, and activity resembling scanning. The resulting alerts are intended to help analysts investigate changes, correlate them with other events and device context, and reconstruct activity around an incident.\u003c/p\u003e\n"},{"n":5,"title":"Monthly Newsletter – November 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/monthly-newsletter-november-2026/","time":"07:00","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 2026 newsletter highlights upcoming regional summits, new sector reports and white papers, an exercise after-action report, community resources, and November events.","briefOverview":"\u003cp\u003eHealth-ISAC published its Monthly Newsletter for November 2026 on November 3, 2026. The newsletter highlights materials from the European Summit, including photos, feedback, and the Securitas Award winner. It also provides Fall Americas Summit keynote information, workshops, and deadlines.\u003c/p\u003e\n\n\u003cp\u003eThe update includes the Health Sector Heartbeat Report for Q3 2026, a MedTech Security Baselines white paper, and the 2026 Americas Hobby Exercise After Action report. It lists Community Services resources addressing data prioritization, AI agents, and human risk management. The newsletter also covers APAC Summit 2027 deadlines and a networking event, a Security Forum and Tabletop Exercise in São Paulo, Brazil, and November events.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC published its Monthly Newsletter for November 2026 on November 3, 2026.","The newsletter includes photos, feedback, and a Securitas Award winner from the European Summit.","The newsletter announces Fall Americas Summit keynote information, workshops, and deadlines.","The newsletter highlights the Health Sector Heartbeat Report for Q3 2026 and a MedTech Security Baselines white paper.","The newsletter includes the 2026 Americas Hobby Exercise After Action report and information about an APAC Summit 2027 networking event."],"insights":["The newsletter combines forward-looking event deadlines with retrospective materials, including European Summit feedback and the 2026 Americas Hobby Exercise After Action report.","Health-ISAC is making resources available across several practical areas, including data prioritization, AI agents, human risk management, and medical-technology security baselines.","The November update reflects a global community schedule, with activities referenced in Europe, the Americas, Asia-Pacific, and São Paulo, Brazil."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published its Monthly Newsletter for November 2026 on November 3, 2026. The newsletter highlights materials from the European Summit, including photos, feedback, and the Securitas Award winner. It also provides Fall Americas Summit keynote information, workshops, and deadlines.\u003c/p\u003e\n\n\u003cp\u003eThe update includes the Health Sector Heartbeat Report for Q3 2026, a MedTech Security Baselines white paper, and the 2026 Americas Hobby Exercise After Action report. It lists Community Services resources addressing data prioritization, AI agents, and human risk management. The newsletter also covers APAC Summit 2027 deadlines and a networking event, a Security Forum and Tabletop Exercise in São Paulo, Brazil, and November events.\u003c/p\u003e\n"}]</script>
