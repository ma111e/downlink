<script type="application/json" id="dl-articles">[{"n":11,"title":"Death By A Thousand PaperCuts (PaperCut Pre-Auth RCE Chain and Patch Bypasses WT-2026-0141-0144/CVE-2026-82077/CVE-2026-82078/CVE-2026-81578)","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/death-by-a-thousand-papercuts-papercut-pre-auth-rce-chain-and-patch-bypasses-wt-2026-0141-0144-cve-2026-82077-cve-2026-82078-cve-2026-81578/","time":"17:31","priority":"MUST READ","score":95,"tldr":"watchTowr found that successive PaperCut patches could be bypassed, culminating in an unauthenticated RCE chain against PaperCut NG 26.0.4-PO build 76508 by abusing setup-wizard authorization flaws and a Scan to Fax path traversal. Organizations should update to the later fixed releases, including 26.0.5 for CVE-2026-82077.","briefOverview":"\u003cp\u003ePaperCut disclosed on 27 August 2026 that flaws affecting PaperCut NG 26.0.3 were being exploited in the wild, initially publishing indicators of compromise and mitigations without a patch. The reported chain combined CVE-2026-81578, an authentication bypass, and CVE-2026-82078, a post-authentication remote-code-execution issue. Researchers at watchTowr subsequently analyzed the fixes and found multiple patch bypasses, as well as a separate post-authentication RCE tracked as WT-2026-0144 and later assigned CVE-2026-82077.\u003c/p\u003e\n\n\u003cp\u003eThe authentication bypasses involved PaperCut\u0026rsquo;s use of Apache Tapestry 3 service paths, where authorization checks could be applied to an accessible root page while allowing access to forms on pages that should require authentication. In the bypass affecting 26.0.4-PO build 76508, requests routed through the Home page could reach Setup Wizard forms and reset the administrator password even after setup had already been completed. The new Scan to Fax RCE used a relative path traversal in a fax connector value together with configurable command arguments to execute an operating-system command. PaperCut released build 76530 on 1 September 2026 to fix WT-2026-0143 and version 26.0.5 on 10 September 2026 to fix WT-2026-0144/CVE-2026-82077.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PaperCut disclosed on 27 August 2026 that a vulnerability affecting version 26.0.3 was being exploited in the wild, initially providing indicators of compromise and mitigations but no patch.","The in-the-wild chain combined CVE-2026-81578, an authentication bypass, with CVE-2026-82078, a post-authentication remote-code-execution issue.","watchTowr found that the 26.0.4-PO build 76508 patch could be bypassed through Setup Wizard forms, allowing an unauthenticated user to reset the administrator password via requests routed through the Home page.","watchTowr identified CVE-2026-82077 in Scan to Fax functionality, where an attacker-controlled connector path could traverse to an executable and run it using administrator-configurable command arguments.","PaperCut released build 76530 on 1 September 2026 to fix WT-2026-0143 and released version 26.0.5 on 10 September 2026 to fix WT-2026-0144/CVE-2026-82077."],"insights":["PaperCut’s authorization logic checked only the root page selected in an Apache Tapestry service request, allowing an unauthenticated page such as Home to be used as a route into protected Setup Wizard forms.","The Setup Wizard bypass remained usable even after a deployment was completed because routing through Home prevented the Setup Wizard’s check for the system.setup-completed setting from running.","The successive fixes relied in part on adding checks to selected sensitive pages, but the Setup Wizard forms had been omitted, illustrating why page-by-page protections left another reachable path.","The Scan to Fax issue combined two independently dangerous controls: a connector name that accepted relative path traversal and configurable command arguments that determined what the selected executable would run.","Although the article’s Detection Artefact Generator did not run the full remote-code-execution chain, it was designed to help organizations determine whether they were exposed to the authentication-bypass behavior."],"referencedReports":[{"title":"Security Bulletin: 27 August 2026 Urgent Security Advisory","url":"https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/?ref=labs.watchtowr.com","publisher":"papercut","context":"The article cites PaperCut's advisory as the initial disclosure that a vulnerability affecting version 26.0.3 was being exploited in the wild.","category":"advisory","primary":false},{"title":"From Patch to Exploit: Using Claude Code to Reverse Engineer a Zero-Day in PaperCut NG","url":"https://www.techanarchy.net/from-patch-to-exploit-using-claude-code-to-reverse-engineer-a-zero-day-in-papercut-ng/?ref=labs.watchtowr.com","publisher":"techanarchy","context":"The article references this technical analysis for background on the original CVE-2026-81578 authentication bypass.","category":"research","primary":false}],"body":"\u003cp\u003ePaperCut disclosed on 27 August 2026 that flaws affecting PaperCut NG 26.0.3 were being exploited in the wild, initially publishing indicators of compromise and mitigations without a patch. The reported chain combined CVE-2026-81578, an authentication bypass, and CVE-2026-82078, a post-authentication remote-code-execution issue. Researchers at watchTowr subsequently analyzed the fixes and found multiple patch bypasses, as well as a separate post-authentication RCE tracked as WT-2026-0144 and later assigned CVE-2026-82077.\u003c/p\u003e\n\n\u003cp\u003eThe authentication bypasses involved PaperCut\u0026rsquo;s use of Apache Tapestry 3 service paths, where authorization checks could be applied to an accessible root page while allowing access to forms on pages that should require authentication. In the bypass affecting 26.0.4-PO build 76508, requests routed through the Home page could reach Setup Wizard forms and reset the administrator password even after setup had already been completed. The new Scan to Fax RCE used a relative path traversal in a fax connector value together with configurable command arguments to execute an operating-system command. PaperCut released build 76530 on 1 September 2026 to fix WT-2026-0143 and version 26.0.5 on 10 September 2026 to fix WT-2026-0144/CVE-2026-82077.\u003c/p\u003e\n"},{"n":24,"title":"Credential-Stealing GitHub Actions Workflows Planted in Tens of Thousands of Repositories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/credential-stealing-github-actions.html","time":"19:14","priority":"MUST READ","score":95,"tldr":"The GhostAction campaign compromised hundreds of GitHub maintainer accounts to inject malicious GitHub Actions workflows into tens of thousands of repositories, harvesting secrets from repositories and their full commit histories. Developers should locate and remove the workflows, revoke compromised GitHub credentials, rotate exposed secrets, and inspect forks and mirrors.","briefOverview":"\u003cp\u003eResearchers reported that the GhostAction credential-theft campaign compromised high-profile GitHub maintainer accounts and used them to add malicious GitHub Actions workflows to hundreds of repositories. StepSecurity said the accounts of pyxel author Takashi Kitao and athenadriver author Henry Wu were used to push the same workflow to 27 and 318 repositories, respectively. Socket said it identified more than 500 GitHub accounts that committed the malicious workflow to tens of thousands of repositories since October 7, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe workflows, named \u0026ldquo;Security Audit\u0026rdquo; or \u0026ldquo;GitHub Actions Security,\u0026rdquo; run on manual dispatches and unfiltered pushes, check out the full repository history, and send collected data to 193.32.204[.]199 over plain HTTP. They search named GitHub Actions secrets, current repository files, and past commits for 13 credential patterns, including AWS keys, AI-provider keys, GitHub and GitLab tokens, and cloud or SaaS credentials. Developers are advised to treat repositories containing the workflows as compromised, revoke affected GitHub credentials, rotate exposed secrets, remove the workflows from all branches, and examine forks because they may continue triggering credential harvesting.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The GhostAction campaign used compromised GitHub maintainer accounts to add credential-stealing GitHub Actions workflows to thousands of repositories.","Socket identified more than 500 GitHub accounts that committed the malicious workflow to tens of thousands of repositories between October 7 and October 9, 2026.","The workflows, named \"Security Audit\" or \"GitHub Actions Security,\" send collected data to the hard-coded IP address 193.32.204[.]199 over plain HTTP.","The malicious code searches repository files and the full Git history for secrets including AWS keys, AI-service keys, GitHub and GitLab tokens, and other cloud or SaaS credentials.","Developers are advised to remove the malicious workflows from every branch, revoke compromised GitHub credentials, rotate exposed secrets, and inspect affected forks."],"insights":["The workflows use a full repository checkout, allowing them to search not only current files but also deleted credentials preserved in the complete Git history.","Forks can retain and continue running the malicious workflow after the upstream repository is cleaned; Socket identified 279 affected forks in the henrywoo namespace alone.","Each workflow run reports a repository identifier even when no credentials are found, giving the operator visibility into reachable repositories beyond successful credential theft.","In one observed case, attackers also modified the kuafuai/DevOpsGPT repository to include an XMRig cryptocurrency miner in its Docker image."],"referencedReports":[{"title":"GhostAction Returns","url":"https://www.stepsecurity.io/blog/ghostaction-returns","publisher":"stepsecurity","context":"StepSecurity documented compromised maintainer accounts pushing the malicious workflows and described their behavior.","category":"research","primary":true},{"title":"GhostAction: Cloud Credentials","url":"https://socket.dev/blog/ghostaction-cloud-credentials","publisher":"socket","context":"Socket reported identifying more than 500 GitHub accounts that committed the workflow to tens of thousands of repositories.","category":"research","primary":true},{"title":"GhostAction Campaign: Over 3,000 Secrets Stolen Through Malicious GitHub Workflows","url":"https://www.stepsecurity.io/blog/ghostaction-campaign-over-3-000-secrets-stolen-through-malicious-github-workflows","publisher":"stepsecurity","context":"The article cites this StepSecurity analysis as the report that first exposed the earlier GhostAction campaign.","category":"research","primary":false},{"title":"GhostAction GitHub Actions Supply Chain Attack Returns","url":"https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/","publisher":"gitguardian","context":"GitGuardian reported that the campaign pushed malicious workflows to 772 public repositories between August 31 and September 30, 2026.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers reported that the GhostAction credential-theft campaign compromised high-profile GitHub maintainer accounts and used them to add malicious GitHub Actions workflows to hundreds of repositories. StepSecurity said the accounts of pyxel author Takashi Kitao and athenadriver author Henry Wu were used to push the same workflow to 27 and 318 repositories, respectively. Socket said it identified more than 500 GitHub accounts that committed the malicious workflow to tens of thousands of repositories since October 7, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe workflows, named \u0026ldquo;Security Audit\u0026rdquo; or \u0026ldquo;GitHub Actions Security,\u0026rdquo; run on manual dispatches and unfiltered pushes, check out the full repository history, and send collected data to 193.32.204[.]199 over plain HTTP. They search named GitHub Actions secrets, current repository files, and past commits for 13 credential patterns, including AWS keys, AI-provider keys, GitHub and GitLab tokens, and cloud or SaaS credentials. Developers are advised to treat repositories containing the workflows as compromised, revoke affected GitHub credentials, rotate exposed secrets, remove the workflows from all branches, and examine forks because they may continue triggering credential harvesting.\u003c/p\u003e\n"},{"n":1,"title":"Unpatched AhsayCBS flaws exploited to deploy webshells, mine crypto","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/unpatched-ahsaycbs-flaws-exploited-to-deploy-webshells-mine-crypto/","time":"17:17","priority":"MUST READ","score":94,"tldr":"Attackers are actively chaining two unpatched AhsayCBS flaws, CVE-2026-105133 and CVE-2026-105134, to bypass authentication, deploy JSP webshells, and install XMRig cryptocurrency miners. Organizations should restrict AhsayCBS management access to trusted IPs and investigate for compromise until a reliable patch is available.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting two unpatched AhsayCBS flaws to install webshells and cryptocurrency-mining software. The activity was observed on October 7 and targeted at least five organizations. AhsayCBS is a backup management platform commonly used by managed service providers and system integrators.\u003c/p\u003e\n\n\u003cp\u003eThe attackers chained CVE-2026-105133, an authentication-bypass flaw with a public exploit, with CVE-2026-105134, an operating-system command-injection flaw. Huntress observed reconnaissance activity, JSP webshell deployment, and an XMRig miner disguised as edge.exe; the miner persisted through a MicrosoftEdgeUpdateSvc service. Although the flaws were reported fixed in AhsayCBS 10.3.2, Huntress says version 10.3.4, the latest release, is also affected, and recommends restricting management-interface access to trusted IP addresses and fully restoring confirmed compromised hosts from safe backups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors exploited CVE-2026-105133 to bypass AhsayCBS authentication and CVE-2026-105134 to execute operating-system commands on targeted systems.","Huntress observed the activity on October 7, affecting at least five organizations that use the AhsayCBS backup management platform.","After gaining access, the attackers performed reconnaissance, installed JSP webshells, and downloaded the XMRig cryptocurrency miner disguised as edge.exe.","The miner persisted through a service named MicrosoftEdgeUpdateSvc that ran msedge.exe, which Huntress identified as a modified copy of the NSSM utility.","Huntress says AhsayCBS 10.3.4, the latest version, remains affected despite the vulnerabilities being reported as fixed in version 10.3.2."],"insights":["The flaws were reported fixed in AhsayCBS 10.3.2, yet Huntress determined that the newer 10.3.4 release is also vulnerable, meaning upgrading to the latest version does not eliminate the risk described.","The mining operation used a PowerShell script that stops its service when Task Manager opens and starts it again when Task Manager closes, specifically attempting to hide its resource use from someone inspecting the system.","Huntress recommends a full restoration from a known-safe backup after a confirmed compromise, rather than only removing the observed miner, because the intruder may have added other ways to retain access.","In one incident, the attacker deployed the vulnerable WinRing0x64.sys driver, likely to gain access to additional hardware resources for cryptocurrency mining."],"referencedReports":[{"title":"Huntress analysis of AhsayCBS flaw exploitation","url":"https://www.huntress.com/blog/ahsaycbs-flaws-exploit","publisher":"huntress","context":"The article cites Huntress's observations of attackers chaining the AhsayCBS flaws to deploy JSP webshells and an XMRig miner.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are actively exploiting two unpatched AhsayCBS flaws to install webshells and cryptocurrency-mining software. The activity was observed on October 7 and targeted at least five organizations. AhsayCBS is a backup management platform commonly used by managed service providers and system integrators.\u003c/p\u003e\n\n\u003cp\u003eThe attackers chained CVE-2026-105133, an authentication-bypass flaw with a public exploit, with CVE-2026-105134, an operating-system command-injection flaw. Huntress observed reconnaissance activity, JSP webshell deployment, and an XMRig miner disguised as edge.exe; the miner persisted through a MicrosoftEdgeUpdateSvc service. Although the flaws were reported fixed in AhsayCBS 10.3.2, Huntress says version 10.3.4, the latest release, is also affected, and recommends restricting management-interface access to trusted IP addresses and fully restoring confirmed compromised hosts from safe backups.\u003c/p\u003e\n"},{"n":19,"title":"Flax Typhoon Exploits Five Flaws as CISA Sets October 11 Deadline for Federal Agencies","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/flax-typhoon-exploits-five-flaws-as.html","time":"12:21","priority":"MUST READ","score":94,"tldr":"CISA added five actively exploited flaws tied to China-linked Flax Typhoon to its KEV catalog, including vulnerabilities in ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND. U.S. federal agencies must patch or discontinue affected products by October 11, 2026.","briefOverview":"\u003cp\u003eCISA added five vulnerabilities to its Known Exploited Vulnerabilities catalog after their abuse by the China-linked threat actor Flax Typhoon. The affected products are ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND. The flaws include issues that can enable arbitrary file access, remote code execution, disclosure of sensitive user details, command execution, or denial of service.\u003c/p\u003e\n\n\u003cp\u003eThe additions coincide with a joint advisory from Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States concerning operations enabled by China-based Integrity Technology Group. The operations targeted eight vulnerabilities in total, with the other three—Shellshock, Ivanti Pulse Connect Secure, and GitLab flaws—already listed in the KEV catalog. The activity reportedly used scanning tools, cross-site scripting, and password spraying against Microsoft Exchange servers, then used VPN software for persistence and scripts to take emails and credentials.\u003c/p\u003e\n\n\u003cp\u003eCISA said Chinese government-affiliated actors continue to position themselves in critical infrastructure networks, including operational technology systems, for possible future disruption. Federal agencies are required to patch the five newly added vulnerabilities or stop using the affected products by October 11, 2026. The deadline reflects the active exploitation of these issues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added five vulnerabilities associated with Flax Typhoon activity to its Known Exploited Vulnerabilities catalog.","The newly added flaws affect ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND.","A joint advisory from Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States said a China-based company called Integrity Technology Group enabled operations targeting eight vulnerabilities.","The reported activity used scanning tools, cross-site scripting, and password spraying against Microsoft Exchange servers to gain access, while scripts were used to steal emails and credentials.","U.S. federal agencies must patch the affected vulnerabilities or stop using the affected products by October 11, 2026."],"insights":["The activity combined newly highlighted flaws with three long-standing KEV entries—Shellshock, Ivanti Pulse Connect Secure, and GitLab—showing that all eight targeted weaknesses were already recognized as actively exploited or were added to that status.","Several of the affected flaws date back to 2015 and 2016, including ProFTPD, Apache Struts, and ISC BIND issues, rather than being limited to recently disclosed software problems.","The reported operations did not stop at initial access: they also established continued access through VPN software and used scripts to collect emails and credentials.","The joint warning linked the activity to a China-based cybersecurity company, Integrity Technology Group, and involved authorities from seven countries.","CISA's deadline gives U.S. federal agencies a specific required action: apply patches or discontinue use of affected products by October 11, 2026."],"referencedReports":[],"body":"\u003cp\u003eCISA added five vulnerabilities to its Known Exploited Vulnerabilities catalog after their abuse by the China-linked threat actor Flax Typhoon. The affected products are ProFTPD, ONLYOFFICE Docs, Strapi, Apache Struts, and ISC BIND. The flaws include issues that can enable arbitrary file access, remote code execution, disclosure of sensitive user details, command execution, or denial of service.\u003c/p\u003e\n\n\u003cp\u003eThe additions coincide with a joint advisory from Australia, Canada, Japan, New Zealand, Spain, the United Kingdom, and the United States concerning operations enabled by China-based Integrity Technology Group. The operations targeted eight vulnerabilities in total, with the other three—Shellshock, Ivanti Pulse Connect Secure, and GitLab flaws—already listed in the KEV catalog. The activity reportedly used scanning tools, cross-site scripting, and password spraying against Microsoft Exchange servers, then used VPN software for persistence and scripts to take emails and credentials.\u003c/p\u003e\n\n\u003cp\u003eCISA said Chinese government-affiliated actors continue to position themselves in critical infrastructure networks, including operational technology systems, for possible future disruption. Federal agencies are required to patch the five newly added vulnerabilities or stop using the affected products by October 11, 2026. The deadline reflects the active exploitation of these issues.\u003c/p\u003e\n"},{"n":26,"title":"Attackers Exploit AhsayCBS Flaws to Deploy XMRig Miners Disguised as Microsoft Edge","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/attackers-exploit-ahsaycbs-flaws-to.html","time":"12:47","priority":"MUST READ","score":94,"tldr":"Attackers are actively chaining two AhsayCBS flaws, including an authentication bypass and command injection, to gain remote code execution and deploy web shells and XMRig miners disguised as Microsoft Edge. Even AhsayCBS 10.3.4 may be affected, so organizations should restrict management-interface access to trusted IPs or a VPN and investigate for compromise.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting two AhsayCBS backup utility flaws to take control of affected devices, deploy web shells, and install XMRig cryptocurrency miners. The issues are CVE-2026-105133, an improper-authentication flaw, and CVE-2026-105134, an operating-system command-injection flaw in the Replication Receiver component. Chaining the vulnerabilities allows remote attackers to bypass authentication and run arbitrary commands. Huntress said exploitation began on October 7, 2026, and estimated that five organizations had been affected as of October 8.\u003c/p\u003e\n\n\u003cp\u003eFollowing compromise, the attackers conduct reconnaissance and deploy XMRig miners disguised as Microsoft Edge by naming them edge.exe. A PowerShell script called Taskgmr.ps1 supports mining activity and includes checks that stop mining when Windows Task Manager is opened; it can also terminate Task Manager at 6 p.m. if it has remained open for more than one hour overnight. In at least one case, attackers used certutil.exe to download the legitimate-but-vulnerable WinRing0x64.sys driver, likely to obtain kernel-level access and improve mining performance. Although NVD advisories stated that version 10.3.4 addressed the flaws, Huntress reported that version is also affected, so users are advised to restrict AhsayCBS management-interface access to trusted IP addresses or require VPN access and look for signs of compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors chained CVE-2026-105133, an improper-authentication flaw, with CVE-2026-105134, an operating-system command-injection flaw in AhsayCBS to execute arbitrary commands on affected systems.","Huntress observed exploitation beginning on October 7, 2026, and estimated that five organizations had been affected as of October 8, 2026.","After gaining access, the attackers conducted reconnaissance, deployed web shells, and installed XMRig cryptocurrency miners named edge.exe to impersonate Microsoft Edge.","The attackers also used a PowerShell script called Taskgmr.ps1 that stops mining when Windows Task Manager is opened and can terminate Task Manager at 6 p.m. if it has stayed open for more than an hour overnight.","Huntress said that AhsayCBS version 10.3.4, despite being identified in NVD advisories as fixed, is also affected, and recommended limiting management-interface access to trusted IP addresses or a VPN."],"insights":["The flaws were reportedly exploited only days after their CVE identifiers were published, showing that affected AhsayCBS systems faced active abuse soon after public disclosure.","AhsayCBS 10.3.4 was reported as affected despite NVD advisories identifying it as a fixed version, so upgrading to that release alone may not prevent compromise.","The mining operation is designed to evade casual discovery by naming its executable edge.exe and pausing activity when Windows Task Manager is opened.","Attackers used the legitimate Windows certutil.exe utility to download the vulnerable WinRing0x64.sys driver, which Huntress said was likely intended to obtain kernel-level hardware access and improve mining performance."],"referencedReports":[{"title":"AhsayCBS Flaws Exploit","url":"https://www.huntress.com/blog/ahsaycbs-flaws-exploit","publisher":"huntress","context":"The article relies on Huntress's analysis of active exploitation, post-compromise activity, affected organizations, and mitigation recommendations.","category":"research","primary":true},{"title":"CVE-2026-105133","url":"https://nvd.nist.gov/vuln/detail/cve-2026-105133","publisher":"national-vulnerability-database","context":"The article cites this NVD advisory for the AhsayCBS improper-authentication vulnerability.","category":"advisory","primary":false},{"title":"CVE-2026-105134","url":"https://nvd.nist.gov/vuln/detail/cve-2026-105134","publisher":"national-vulnerability-database","context":"The article cites this NVD advisory for the AhsayCBS operating-system command-injection vulnerability.","category":"advisory","primary":false}],"body":"\u003cp\u003eThreat actors are actively exploiting two AhsayCBS backup utility flaws to take control of affected devices, deploy web shells, and install XMRig cryptocurrency miners. The issues are CVE-2026-105133, an improper-authentication flaw, and CVE-2026-105134, an operating-system command-injection flaw in the Replication Receiver component. Chaining the vulnerabilities allows remote attackers to bypass authentication and run arbitrary commands. Huntress said exploitation began on October 7, 2026, and estimated that five organizations had been affected as of October 8.\u003c/p\u003e\n\n\u003cp\u003eFollowing compromise, the attackers conduct reconnaissance and deploy XMRig miners disguised as Microsoft Edge by naming them edge.exe. A PowerShell script called Taskgmr.ps1 supports mining activity and includes checks that stop mining when Windows Task Manager is opened; it can also terminate Task Manager at 6 p.m. if it has remained open for more than one hour overnight. In at least one case, attackers used certutil.exe to download the legitimate-but-vulnerable WinRing0x64.sys driver, likely to obtain kernel-level access and improve mining performance. Although NVD advisories stated that version 10.3.4 addressed the flaws, Huntress reported that version is also affected, so users are advised to restrict AhsayCBS management-interface access to trusted IP addresses or require VPN access and look for signs of compromise.\u003c/p\u003e\n"},{"n":36,"title":"New GhostAction Wave Hits Hundreds of Repos, Expanding Beyond CI/CD Secrets to Cloud Credentials","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/ghostaction-cloud-credentials?utm_medium=feed","time":"12:07","priority":"MUST READ","score":94,"tldr":"A new GhostAction campaign used compromised GitHub maintainer accounts to plant malicious “security-audit” workflows in 346 repositories, stealing GitHub Actions secrets and scanning current files and full Git history for cloud and AI credentials. Affected maintainers should remove the workflow, revoke exposed credentials, investigate workflow runs and network connections to the hardcoded exfiltration IP, and secure compromised accounts.","briefOverview":"\u003cp\u003eOn October 8, 2026, compromised GitHub accounts \u003ccode\u003ehenrywoo\u003c/code\u003e and \u003ccode\u003ekitao\u003c/code\u003e added a malicious workflow named \u003ccode\u003e.github/workflows/security-audit.yml\u003c/code\u003e to 346 repositories. The affected repositories included \u003ccode\u003euber/athenadriver\u003c/code\u003e, where henrywoo had write access, and the popular \u003ccode\u003ekitao/pyxel\u003c/code\u003e project. Socket reported that the workflow had run successfully in affected repositories and remained on the default branches it checked as of October 9, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe fake security workflow collected GitHub Actions secrets named in existing repository workflows and sent them to \u003ccode\u003e193.32.204[.]199\u003c/code\u003e. It also performed a new scan of checked-out files and full available Git history for AWS, AI-service, source-control, SaaS, and cloud API credentials, including credentials that may have been removed from the current project files. The campaign could expose package-publishing credentials, cloud access keys, and other service tokens; Socket reported no malicious PyPI or crates.io packages had been published as a result at the time of writing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On October 8, 2026, compromised GitHub accounts henrywoo and kitao added a malicious .github/workflows/security-audit.yml file to 346 repositories, including uber/athenadriver and kitao/pyxel.","The workflow runs on pushes and manually triggered runs, collects selected GitHub Actions secrets, scans the checked-out files and available Git history for credential patterns, and sends the results to 193.32.204[.]199.","The added credential scanning targets AWS keys and tokens, Anthropic, OpenAI, and OpenRouter keys, GitHub and GitLab tokens, Google API keys, Slack tokens, and SendGrid API keys.","Socket reported that the malicious workflow had run successfully in affected repositories and remained on the default branches it checked as of October 9, 2026.","Socket reported no malicious package versions published to PyPI or crates.io as a result of this activity at the time of writing."],"insights":["The workflow’s use of a full repository checkout lets it search every available branch and tag for credentials that may have been removed from the current version of a project.","Before committing the malicious file, the operators appear to identify the exact GitHub Actions secret names used by each repository and insert those names into the workflow, allowing it to target publishing credentials directly.","The workflow captures lines surrounding AWS key identifiers because an identifier alone is not sufficient for access; nearby text may contain the matching secret key needed to form a usable pair.","The compromise of a maintainer account affected not only personal repositories but also organization-owned repositories where that person had write access, as shown by uber/athenadriver.","The 279 affected forks can execute the malicious workflow against their own files and history if their owners enable Actions and push changes, extending exposure beyond the initially compromised accounts."],"referencedReports":[{"title":"GhostAction Campaign: 3,325 Secrets Stolen","url":"https://blog.gitguardian.com/ghostaction-campaign-3-325-secrets-stolen/","publisher":"gitguardian","context":"The article cites GitGuardian’s September 2025 documentation of an earlier GhostAction campaign wave.","category":"research","primary":false},{"title":"GhostAction GitHub Actions Supply Chain Attack Returns","url":"https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/","publisher":"gitguardian","context":"The article cites GitGuardian’s 2026 reporting on the return of the GhostAction campaign.","category":"research","primary":false}],"body":"\u003cp\u003eOn October 8, 2026, compromised GitHub accounts \u003ccode\u003ehenrywoo\u003c/code\u003e and \u003ccode\u003ekitao\u003c/code\u003e added a malicious workflow named \u003ccode\u003e.github/workflows/security-audit.yml\u003c/code\u003e to 346 repositories. The affected repositories included \u003ccode\u003euber/athenadriver\u003c/code\u003e, where henrywoo had write access, and the popular \u003ccode\u003ekitao/pyxel\u003c/code\u003e project. Socket reported that the workflow had run successfully in affected repositories and remained on the default branches it checked as of October 9, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe fake security workflow collected GitHub Actions secrets named in existing repository workflows and sent them to \u003ccode\u003e193.32.204[.]199\u003c/code\u003e. It also performed a new scan of checked-out files and full available Git history for AWS, AI-service, source-control, SaaS, and cloud API credentials, including credentials that may have been removed from the current project files. The campaign could expose package-publishing credentials, cloud access keys, and other service tokens; Socket reported no malicious PyPI or crates.io packages had been published as a result at the time of writing.\u003c/p\u003e\n"},{"n":38,"title":"GhostAction Returns: Malicious “Security Audit” Workflows Now Mine Credentials from Entire Git Histories","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/ghostaction-returns","time":"14:53","priority":"MUST READ","score":94,"tldr":"GhostAction attackers compromised prominent GitHub maintainer accounts to inject malicious “Security Audit” workflows that exfiltrate Actions secrets and credentials found across entire Git histories to 193.32.204.199. Organizations should treat any affected repository as breached, remove the workflows, revoke compromised GitHub access, and rotate all current and historical credentials.","briefOverview":"\u003cp\u003eOn October 8, 2026, GhostAction operators used compromised GitHub accounts belonging to Takashi Kitao and Henry Wu to push malicious workflows to 345 repositories in two rapid sweeps. The affected projects included Kitao’s pyxel and Uber’s athenadriver, where Henry Wu retained write access. The injected workflows were disguised as security improvements and committed directly to default branches under the victims’ legitimate identities.\u003c/p\u003e\n\n\u003cp\u003eThe newer “Security Audit” workflow sends configured GitHub Actions secrets and credentials found in both the working tree and the repository’s complete Git history to 193.32.204.199 over plain HTTP. It checks out all branches and tags, searches for AWS, AI-provider, GitHub, GitLab, Slack, SendGrid, and Google/Firebase credentials, and captures context around AWS key IDs to help pair them with secret keys. A run log from uber/athenadriver confirmed that the attacker’s server acknowledged a submitted request four seconds after the malicious workflow began, while an approval requirement prevented re-triggered runs from executing in typecho-fans/plugins.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On October 8, 2026, GhostAction operators used compromised GitHub accounts belonging to Takashi Kitao and Henry Wu to add malicious workflows to 345 repositories.","The malicious “Security Audit” workflow sends GitHub Actions secrets and credentials found in the working tree and complete Git history to 193.32.204.199 over unencrypted HTTP.","A run log from Uber’s athenadriver repository showed that the attacker’s server acknowledged the workflow’s data submission four seconds after the run started.","The upgraded workflow checks out all repository history, allowing it to search every branch and tag for AWS, AI-provider, GitHub, GitLab, Slack, SendGrid, and Google/Firebase credentials.","Affected organizations are advised to delete the workflows, revoke the compromised GitHub credential, and rotate all current and historically committed credentials."],"insights":["The workflow’s full-history scan means credentials deleted years earlier can still be collected, so rotating only currently configured GitHub Actions secrets does not address the exposure.","The attackers used different URL markers to distinguish repositories containing named secrets from those yielding only history-scan results, allowing them to sort victims by expected value without inspecting each submitted data body.","In Uber’s athenadriver run, the workflow fetched all branches and tags before scanning, including a branch named “s3-bucket-compromised-2023-03,” illustrating that non-default and historical repository content was included in the collection scope.","An approval requirement for workflow runs prevented two re-triggered malicious workflows in typecho-fans/plugins from executing, providing a documented example of a single control breaking the exfiltration chain.","The exfiltration used a raw IP address over plain HTTP, which avoided DNS lookups and reduced the usefulness of defenses that depend only on domain-based detection."],"referencedReports":[],"body":"\u003cp\u003eOn October 8, 2026, GhostAction operators used compromised GitHub accounts belonging to Takashi Kitao and Henry Wu to push malicious workflows to 345 repositories in two rapid sweeps. The affected projects included Kitao’s pyxel and Uber’s athenadriver, where Henry Wu retained write access. The injected workflows were disguised as security improvements and committed directly to default branches under the victims’ legitimate identities.\u003c/p\u003e\n\n\u003cp\u003eThe newer “Security Audit” workflow sends configured GitHub Actions secrets and credentials found in both the working tree and the repository’s complete Git history to 193.32.204.199 over plain HTTP. It checks out all branches and tags, searches for AWS, AI-provider, GitHub, GitLab, Slack, SendGrid, and Google/Firebase credentials, and captures context around AWS key IDs to help pair them with secret keys. A run log from uber/athenadriver confirmed that the attacker’s server acknowledged a submitted request four seconds after the malicious workflow began, while an approval requirement prevented re-triggered runs from executing in typecho-fans/plugins.\u003c/p\u003e\n"},{"n":20,"title":"P7 DarkSword iOS Exploit Kit Adds Crypto Wallet Data Theft and Remote Commands","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/p7-darksword-ios-exploit-kit-adds.html","time":"16:29","priority":"MUST READ","score":93,"tldr":"A new P7 DarkSword iOS exploit-kit variant adds on-device iCloud Keychain and cryptocurrency-wallet theft plus remote command execution after compromising iPhones. Researchers say the leaked commercial kit is spreading among financially motivated operators, including Chinese-speaking actors targeting crypto assets.","briefOverview":"\u003cp\u003eResearchers at iVerify disclosed P7 DarkSword, a previously unseen variant of the DarkSword iOS exploit kit. The new version reduces its footprint on affected devices, steals keychain and cryptocurrency-wallet data directly on the phone, and supports two-way communication with attacker-controlled infrastructure. DarkSword was first documented in March after being seen in the wild in November 2025, and it targets iPhones running iOS versions from 18.4 through 18.7.\u003c/p\u003e\n\n\u003cp\u003eP7 DarkSword injects an implant into SpringBoard, the iOS process that manages app launches and the home screen, then polls for instructions every 15 seconds. It can collect device information, installed-app lists, iCloud Keychain data, Apple Notes databases, photos, cryptocurrency-wallet information, and selected application files, while also executing commands and scanning the filesystem. Censys separately identified exposed DarkSword and Coruna infrastructure, including a Chinese-speaking exploitation-as-a-service platform whose recovered production-server copy contained 11 victim recovery phrases, 179 device-loot directories, and a 75-account control-plane roster.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers identified P7 DarkSword, a previously unseen DarkSword iOS exploit-kit variant that reduces its device footprint, steals keychain and cryptocurrency-wallet data on the device, and supports two-way communications with attacker infrastructure.","P7 DarkSword injects its implant into the iPhone SpringBoard process and can collect installed-app lists, iCloud Keychain information, Apple Notes data, photos, and cryptocurrency-wallet data.","The implant polls for instructions every 15 seconds and can execute operating-system commands, upload files and photos, scan the filesystem, enumerate app containers, and run arbitrary JavaScript.","DarkSword has been used in attacks targeting Saudi Arabia, Turkey, Malaysia, and Ukraine by multiple threat actors, including PARS Defense and Star Blizzard.","Censys found exposed infrastructure associated with DarkSword and Coruna, including a Chinese-speaking exploitation-as-a-service platform whose recovered production-server copy contained 11 victim recovery phrases, 179 device-loot directories, and a 75-account control-plane roster."],"insights":["P7 DarkSword processes keychain data into JSON directly on the compromised phone before sending it out, whereas earlier variants copied the keychain database for processing on attacker-controlled infrastructure.","The variant uses browser local storage to avoid exploiting the same device again and removes debug logging over HTTP and the system log, changes that emphasize stealth and reduced visibility.","Censys found that DarkSword and its companion Coruna kit were available through exposed infrastructure, including a combined DS-Fusion package and a Chinese-speaking platform with an agent and reseller model.","The exposed production-server copy contained 11 victim cryptocurrency recovery phrases, 179 device-loot directories, and 75 control-plane accounts, showing that the infrastructure had collected real victim data."],"referencedReports":[{"title":"P7 DarkSword Variant Threat Research","url":"https://www.iverify.com/blog/darksword-variant-threat-research","publisher":"iverify","context":"iVerify's newly published report disclosed the P7 DarkSword variant and described its reduced footprint, data theft capabilities, and two-way command-and-control communications.","category":"research","primary":true},{"title":"DarkSword and Coruna Open Directory Finding Report","url":"https://censys.com/blog/darksword-coruna-open-directory-finding-report/","publisher":"censys","context":"Censys' technical findings describe exposed DarkSword and Coruna infrastructure, including a combined package, command-and-control servers, and a Chinese-speaking exploitation-as-a-service platform.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at iVerify disclosed P7 DarkSword, a previously unseen variant of the DarkSword iOS exploit kit. The new version reduces its footprint on affected devices, steals keychain and cryptocurrency-wallet data directly on the phone, and supports two-way communication with attacker-controlled infrastructure. DarkSword was first documented in March after being seen in the wild in November 2025, and it targets iPhones running iOS versions from 18.4 through 18.7.\u003c/p\u003e\n\n\u003cp\u003eP7 DarkSword injects an implant into SpringBoard, the iOS process that manages app launches and the home screen, then polls for instructions every 15 seconds. It can collect device information, installed-app lists, iCloud Keychain data, Apple Notes databases, photos, cryptocurrency-wallet information, and selected application files, while also executing commands and scanning the filesystem. Censys separately identified exposed DarkSword and Coruna infrastructure, including a Chinese-speaking exploitation-as-a-service platform whose recovered production-server copy contained 11 victim recovery phrases, 179 device-loot directories, and a 75-account control-plane roster.\u003c/p\u003e\n"},{"n":10,"title":"Max severity SonicWall SMA1000 flaw now exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/max-severity-sonicwall-sma1000-flaw-now-exploited-in-attacks/","time":"12:32","priority":"MUST READ","score":92,"tldr":"Attackers are attempting to exploit the newly patched maximum-severity SonicWall SMA1000 flaw CVE-2026-102255, using crafted requests against the WorkPlace interface to access internal CouchDB functionality. Organizations with SMA1000 appliances should apply SonicWall’s patch immediately.","briefOverview":"\u003cp\u003eAttackers are attempting to exploit CVE-2026-102255, a maximum-severity vulnerability in SonicWall SMA1000 appliances that SonicWall patched three days earlier. The issue affects the Appliance WorkPlace interface on SMA1000 6210, 7210, and 8200v models. SonicWall said an unauthenticated remote attacker could cause an affected appliance to make requests on their behalf, reach internal functions, and perform unauthorized operations.\u003c/p\u003e\n\n\u003cp\u003ePrevidian’s honeypot network observed crafted OPTIONS requests aimed at the WorkPlace Extraweb interface and the appliance’s internal CouchDB service at 127.0.0.1:5984. The requests attempted to access a CouchDB design document’s \u003ccode\u003e_rewrite\u003c/code\u003e function and included an HTTP Basic Authorization header with \u003ccode\u003eadmin:admin\u003c/code\u003e, although Previdian has not confirmed that any systems were successfully compromised. Shadowserver tracks more than 400 SMA1000 appliances exposed online, while the article notes that it is unknown how many are honeypots or already patched. SMA1000 gateways are used by managed service providers, large companies, and government agencies for access to internal applications and networks, and previous SMA1000 flaws were linked to malware deployment and ransomware-related activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers have been observed attempting to exploit CVE-2026-102255, a maximum-severity flaw in SonicWall SMA1000 appliances that SonicWall patched three days earlier.","The flaw affects the Appliance WorkPlace interface on SMA1000 6210, 7210, and 8200v models, but not the SMA 100 Series or SSL-VPN services on SonicWall firewalls.","Previdian’s honeypot network observed crafted OPTIONS requests targeting the WorkPlace Extraweb interface and attempting to reach the appliance’s internal CouchDB service at 127.0.0.1:5984.","Previdian said it has not determined whether the observed exploitation attempts successfully compromised any systems.","Shadowserver tracks more than 400 SMA1000 appliances exposed online, although it is unknown how many are honeypots or already patched."],"insights":["Exploitation attempts appeared within three days of SonicWall issuing a patch, even though SonicWall’s original advisory had not identified the flaw as actively exploited.","The observed activity uses a different method from the SSRF issues reported against the same WorkPlace interface in July and September 2026.","The attempted requests included the default-looking credentials \"admin:admin\" while trying to access an internal CouchDB function.","SMA1000 appliances have recently been a recurring target: earlier 2026 zero-days were used to deploy Sou5, OrangeTail, and RootRun malware, and CISA linked some related activity to ransomware gangs.","More than 400 SMA1000 devices are visible online, but the article notes that it is unknown how many are real deployments or have already been patched."],"referencedReports":[{"title":"SNWLID-2026-0017","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0017","publisher":"sonicwall","context":"SonicWall’s advisory describes how the SMA1000 Appliance WorkPlace flaw could let an unauthenticated remote attacker cause the appliance to access internal functionality and perform unauthorized operations.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers are attempting to exploit CVE-2026-102255, a maximum-severity vulnerability in SonicWall SMA1000 appliances that SonicWall patched three days earlier. The issue affects the Appliance WorkPlace interface on SMA1000 6210, 7210, and 8200v models. SonicWall said an unauthenticated remote attacker could cause an affected appliance to make requests on their behalf, reach internal functions, and perform unauthorized operations.\u003c/p\u003e\n\n\u003cp\u003ePrevidian’s honeypot network observed crafted OPTIONS requests aimed at the WorkPlace Extraweb interface and the appliance’s internal CouchDB service at 127.0.0.1:5984. The requests attempted to access a CouchDB design document’s \u003ccode\u003e_rewrite\u003c/code\u003e function and included an HTTP Basic Authorization header with \u003ccode\u003eadmin:admin\u003c/code\u003e, although Previdian has not confirmed that any systems were successfully compromised. Shadowserver tracks more than 400 SMA1000 appliances exposed online, while the article notes that it is unknown how many are honeypots or already patched. SMA1000 gateways are used by managed service providers, large companies, and government agencies for access to internal applications and networks, and previous SMA1000 flaws were linked to malware deployment and ransomware-related activity.\u003c/p\u003e\n"},{"n":25,"title":"Citrix Patches Critical NetScaler Flaw That Could Enable RCE in SAML Deployments","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/citrix-patches-critical-netscaler-flaw.html","time":"08:11","priority":"MUST READ","score":92,"tldr":"Citrix patched CVE-2026-107406, a critical NetScaler ADC and Gateway memory-overflow flaw that can enable remote code execution or denial of service when SAML IdP or SP functionality is configured. Organizations should upgrade affected NetScaler appliances to the latest fixed releases; no active exploitation has been reported.","briefOverview":"\u003cp\u003eCitrix released patches for CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC and NetScaler Gateway. The vulnerability has a CVSS score of 9.5 and may allow remote code execution or denial of service under specific configuration conditions. Citrix said there is no evidence that the flaw has been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects NetScaler deployments configured as a SAML identity provider or service provider. Customers can check for relevant SAML configuration entries, including \u0026ldquo;add authentication samlAction\u0026rdquo; for SAML service-provider configurations and \u0026ldquo;add authentication samlIdPProfile\u0026rdquo; for identity-provider configurations. Secure Private Access Hybrid deployments using NetScaler instances are also affected.\u003c/p\u003e\n\n\u003cp\u003eCitrix addressed the flaw in NetScaler ADC and Gateway 14.1-73.46 and later, 13.1-64.29 and later, and corresponding fixed FIPS and NDcPP releases. The company recommends that affected customers upgrade their NetScaler instances to the recommended versions. The article also notes that three separate NetScaler ADC and Gateway flaws have recently been actively exploited in the wild.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix released patches for CVE-2026-107406, a critical memory-overflow flaw in NetScaler ADC and NetScaler Gateway with a CVSS score of 9.5.","Under specific configurations, CVE-2026-107406 may allow remote code execution or denial of service.","The flaw affects NetScaler deployments configured as a SAML identity provider or service provider, including Secure Private Access Hybrid deployments that use NetScaler instances.","Citrix recommends upgrading to NetScaler ADC and Gateway 14.1-73.46 or later, 13.1-64.29 or later, or the corresponding fixed FIPS and NDcPP releases.","Citrix said there is no evidence that CVE-2026-107406 has been exploited in the wild."],"insights":["Exposure is configuration-dependent: NetScaler instances are affected only when configured as a SAML identity provider or service provider, which customers can check through specific SAML configuration entries.","The fixed releases skip beyond some affected version ranges, so organizations should upgrade to the explicitly recommended versions rather than relying on being near the upper end of an affected range.","Secure Private Access Hybrid deployments that use NetScaler instances are also affected and require upgrades to the recommended NetScaler versions.","Although Citrix reported no known exploitation of CVE-2026-107406, the article notes that three separate NetScaler flaws have recently been actively exploited in the wild."],"referencedReports":[{"title":"Citrix NetScaler ADC and Citrix NetScaler Gateway Security Bulletin for CVE-2026-107406","url":"https://support.citrix.com/external/article/CTX697191/citrix-netscaler-adc-and-citrix-netscale.html","publisher":"citrix","context":"The article cites Citrix's security bulletin for affected versions and the releases that fix CVE-2026-107406.","category":"advisory","primary":true},{"title":"Protecting Customers: Immediate Guidance for CVE-2026-107406 in NetScaler ADC and NetScaler Gateway","url":"https://community.citrix.com/techzone-blogs/110_security-updates/protecting-customers-immediate-guidance-for-cve-2026-107406-in-netscaler-adc-and-netscaler-gateway-r1631/","publisher":"citrix","context":"The article cites Citrix guidance stating that Secure Private Access Hybrid deployments using NetScaler instances are also affected and should be upgraded.","category":"advisory","primary":false}],"body":"\u003cp\u003eCitrix released patches for CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC and NetScaler Gateway. The vulnerability has a CVSS score of 9.5 and may allow remote code execution or denial of service under specific configuration conditions. Citrix said there is no evidence that the flaw has been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects NetScaler deployments configured as a SAML identity provider or service provider. Customers can check for relevant SAML configuration entries, including \u0026ldquo;add authentication samlAction\u0026rdquo; for SAML service-provider configurations and \u0026ldquo;add authentication samlIdPProfile\u0026rdquo; for identity-provider configurations. Secure Private Access Hybrid deployments using NetScaler instances are also affected.\u003c/p\u003e\n\n\u003cp\u003eCitrix addressed the flaw in NetScaler ADC and Gateway 14.1-73.46 and later, 13.1-64.29 and later, and corresponding fixed FIPS and NDcPP releases. The company recommends that affected customers upgrade their NetScaler instances to the recommended versions. The article also notes that three separate NetScaler ADC and Gateway flaws have recently been actively exploited in the wild.\u003c/p\u003e\n"},{"n":17,"title":"FBI touts another ShinyHunters arrest in response to data breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/shinyhunters-arrest-fbi-data-breach-investigation","time":"15:41","priority":"MUST READ","score":91,"tldr":"The FBI has arrested another alleged ShinyHunters associate following the group’s breach of FBIjobs.gov, which exposed sensitive personnel data on FBI employees and task-force officers. The arrest is part of a wider international effort to dismantle the group after recent detentions in Jordan and the Netherlands.","briefOverview":"\u003cp\u003eThe FBI said it arrested another suspected co-conspirator of the ShinyHunters group in an operation conducted this week. The New York Times reported that the arrest occurred in Pennsylvania and involved a Canadian national, though the FBI did not provide details. The detention follows recent arrests of alleged group members, including Saif al-Din Khader in Jordan and Pepijn van der Stap in an operation announced by the FBI and Dutch National Police. The FBI said it is continuing to pursue leads and work with partners to disrupt the group.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters allegedly took over and defaced FBIjobs.gov, then stole sensitive data about nearly every FBI employee. The records reportedly included medical information, home addresses, phone numbers, and FBI work areas, while thousands of records concerning local police officers assigned to FBI task forces were also exposed. The FBI warned employees that the breach could create risks for them and their families. Reuters reported that the FBI traced the breach to an Accenture contractor who failed to patch a vulnerable system and was fired, while the group had said it used an Oracle software vulnerability highlighted by security researchers in June.\u003c/p\u003e\n\n\u003cp\u003eThe group shared samples of the stolen data with news outlets but told several outlets that it did not intend to release the information or escalate its conflict with the FBI. According to the article, law enforcement has taken down much of ShinyHunters\u0026rsquo; infrastructure and hindered efforts to restore its platforms. The group returned to Telegram but said it did not plan to remain there for long because several members had reportedly been arrested.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI said it arrested another suspected ShinyHunters co-conspirator this week, reportedly in Pennsylvania and involving a Canadian national.","ShinyHunters took over and defaced FBIjobs.gov and stole sensitive records concerning nearly every FBI employee, including medical records, home addresses, phone numbers, and work areas.","The breach also exposed thousands of records about local police officers who work with the FBI on task forces.","Saif al-Din Khader was arrested in Jordan on September 28 and reportedly agreed to cooperate with U.S. and other law-enforcement agencies to identify other ShinyHunters members.","The FBI reportedly linked the breach to an Accenture contractor who failed to patch a vulnerable system and was fired this week."],"insights":["The incident’s impact extends beyond FBI personnel: it also exposed thousands of records on local police officers assigned to FBI task forces.","The FBI reportedly attributed the initial access to an unpatched system used by an Accenture contractor, who was removed after the breach.","Law-enforcement pressure appears to have disrupted ShinyHunters’ operations, with the FBI taking down much of its infrastructure and the group saying it planned to leave Telegram after members were reportedly arrested.","Although ShinyHunters shared sample records to prove it had the data, the group told news outlets it did not plan to publish the stolen information."],"referencedReports":[{"title":"PSA260515","url":"https://www.ic3.gov/PSA/2026/PSA260515","publisher":"fbi-internet-crime-complaint-center","context":"The article says ShinyHunters claimed its dispute with the FBI began over this FBI advisory about the group’s actions.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe FBI said it arrested another suspected co-conspirator of the ShinyHunters group in an operation conducted this week. The New York Times reported that the arrest occurred in Pennsylvania and involved a Canadian national, though the FBI did not provide details. The detention follows recent arrests of alleged group members, including Saif al-Din Khader in Jordan and Pepijn van der Stap in an operation announced by the FBI and Dutch National Police. The FBI said it is continuing to pursue leads and work with partners to disrupt the group.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters allegedly took over and defaced FBIjobs.gov, then stole sensitive data about nearly every FBI employee. The records reportedly included medical information, home addresses, phone numbers, and FBI work areas, while thousands of records concerning local police officers assigned to FBI task forces were also exposed. The FBI warned employees that the breach could create risks for them and their families. Reuters reported that the FBI traced the breach to an Accenture contractor who failed to patch a vulnerable system and was fired, while the group had said it used an Oracle software vulnerability highlighted by security researchers in June.\u003c/p\u003e\n\n\u003cp\u003eThe group shared samples of the stolen data with news outlets but told several outlets that it did not intend to release the information or escalate its conflict with the FBI. According to the article, law enforcement has taken down much of ShinyHunters\u0026rsquo; infrastructure and hindered efforts to restore its platforms. The group returned to Telegram but said it did not plan to remain there for long because several members had reportedly been arrested.\u003c/p\u003e\n"},{"n":2,"title":"FBI arrests another suspected ShinyHunters hacker after agency breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fbi-arrests-another-suspected-shinyhunters-hacker-after-agency-breach/","time":"17:02","priority":"SHOULD READ","score":88,"tldr":"The FBI arrested another suspected ShinyHunters co-conspirator, reportedly a Canadian citizen detained in Pennsylvania, over the group’s breach of an FBI contractor-managed platform. The arrest is part of a broader international crackdown on the data-extortion group following the exposure of sensitive FBI employee data.","briefOverview":"\u003cp\u003eThe FBI has arrested another suspected ShinyHunters co-conspirator in connection with the recent FBIJobs.gov incident, FBI Director Kash Patel said. The New York Times reported that the suspect is a Canadian citizen arrested in Pennsylvania and viewed as a primary co-conspirator, although authorities have not publicly named the person or disclosed charges. The FBI said the incident involved a platform managed by a third-party vendor.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it accessed FBI systems by exploiting an alleged Oracle PeopleSoft zero-day vulnerability and then moved into FBI-managed AWS GovCloud infrastructure. The group said it stole 2TB to 3TB of data, and samples reportedly included employee home addresses, Social Security numbers, sensitive job assignments, family information, and medical and psychiatric records; an internal FBI memo reportedly assumed all employees were affected. The arrest follows other recent actions against alleged members or affiliates in the Netherlands and Jordan, while the FBI says it will continue working with partners to disrupt the group.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FBI Director Kash Patel said the FBI arrested another suspected ShinyHunters co-conspirator connected to the recent FBIJobs.gov incident on a third-party vendor-managed platform.","The New York Times reported that the suspect is a Canadian citizen arrested in Pennsylvania and considered a primary co-conspirator, though authorities have not publicly named the person or announced specific charges.","ShinyHunters claimed it exploited an alleged Oracle PeopleSoft zero-day flaw to access FBI systems and later move into FBI-managed AWS GovCloud infrastructure.","The group claimed to have stolen 2TB to 3TB of data, and shared samples reportedly included FBI employee home addresses, Social Security numbers, job assignments, family information, and other personal data.","The FBI said the incident resulted from a contractor-managed platform that had not installed a security update, while law enforcement actions have also included an arrest in the Netherlands and a reported detention in Jordan."],"insights":["The FBI breach was attributed to a third-party contractor-managed platform that had not installed a security update, highlighting that a government agency’s exposure can stem from systems operated by an outside provider.","The reported breach potentially affected all FBI employees, according to an internal FBI memo cited by The New York Times, rather than only users of a narrowly limited system.","Recent arrests and detentions coincided with the disappearance of ShinyHunters’ main Telegram representative, another affiliate’s messaging account, and its original leak site, although the article says the connection is unclear.","ShinyHunters has used several routes to obtain access, including alleged Oracle PeopleSoft exploitation, theft of integration tokens, impersonated IT-support calls, and Microsoft device-code scams that capture account access tokens."],"referencedReports":[],"body":"\u003cp\u003eThe FBI has arrested another suspected ShinyHunters co-conspirator in connection with the recent FBIJobs.gov incident, FBI Director Kash Patel said. The New York Times reported that the suspect is a Canadian citizen arrested in Pennsylvania and viewed as a primary co-conspirator, although authorities have not publicly named the person or disclosed charges. The FBI said the incident involved a platform managed by a third-party vendor.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it accessed FBI systems by exploiting an alleged Oracle PeopleSoft zero-day vulnerability and then moved into FBI-managed AWS GovCloud infrastructure. The group said it stole 2TB to 3TB of data, and samples reportedly included employee home addresses, Social Security numbers, sensitive job assignments, family information, and medical and psychiatric records; an internal FBI memo reportedly assumed all employees were affected. The arrest follows other recent actions against alleged members or affiliates in the Netherlands and Jordan, while the FBI says it will continue working with partners to disrupt the group.\u003c/p\u003e\n"},{"n":8,"title":"Citrix warns admins to patch new NetScaler RCE flaw immediately","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/citrix-warns-admins-to-patch-new-netscaler-rce-flaw-immediately/","time":"08:27","priority":"SHOULD READ","score":88,"tldr":"Citrix is urging immediate patching of NetScaler ADC and Gateway appliances configured for SAML, as CVE-2026-107406 can enable remote code execution or denial of service. Citrix says it has not yet seen active exploitation, but NetScaler flaws have frequently been exploited soon after disclosure.","briefOverview":"\u003cp\u003eCitrix has urged administrators to immediately patch CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC appliances and NetScaler Gateway secure remote-access solutions. An attacker could use the issue to run code remotely on a targeted device or cause it to crash. The flaw affects appliances configured as a SAML identity provider or service provider.\u003c/p\u003e\n\n\u003cp\u003eCitrix recommends upgrading to NetScaler ADC and Gateway 14.1-73.46, 13.1-64.29, or later applicable releases, including specified FIPS and NDcPP versions. The company said it was not aware of any unmitigated exploitation when it published the bulletin, but noted that attackers have abused other NetScaler flaws this year. Shadowserver tracks more than 21,000 Internet-exposed IP addresses with NetScaler fingerprints, although it is unclear how many systems are patched, vulnerable, or honeypots.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix has urged administrators to immediately patch CVE-2026-107406, a critical memory-overflow flaw in NetScaler ADC and NetScaler Gateway appliances.","The flaw can be exploited for remote code execution or to cause a denial-of-service condition, and it affects appliances configured as a SAML identity provider or service provider.","Citrix recommends upgrading affected systems to NetScaler ADC and Gateway 14.1-73.46 or 13.1-64.29, or later applicable releases, including specified FIPS and NDcPP versions.","Citrix said it was not aware of any unmitigated exploitation of CVE-2026-107406 when it published the advisory.","Shadowserver tracks more than 21,000 Internet-exposed IP addresses with NetScaler fingerprints, though it is unknown how many are vulnerable, patched, or honeypots."],"insights":["The issue is configuration-dependent: only NetScaler ADC and Gateway appliances acting as a SAML identity provider or service provider are affected.","Citrix’s urgency is notable because it reported no known unmitigated exploitation of this flaw at publication, while also citing earlier 2026 NetScaler issues that were abused shortly after patch guidance was issued.","More than 21,000 Internet-exposed IP addresses have NetScaler fingerprints, but the article notes that this count does not establish how many systems are vulnerable or unpatched.","CISA has recorded 27 actively exploited Citrix vulnerabilities since November 2021, including seven linked to ransomware attacks."],"referencedReports":[{"title":"CVE-2026-107406","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697191","publisher":"citrix","context":"Citrix's advisory identifies the NetScaler memory-overflow flaw, affected configurations, and recommended fixed versions.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search=\u0026field_date_added_wrapper=all\u0026field_cve=\u0026sort_by=field_date_added\u0026items_per_page=All\u0026url=\u0026f%5B0%5D=vendor_project%3A802","publisher":"cisa","context":"The article cites CISA's catalog to state that 27 Citrix vulnerabilities have been actively exploited since November 2021.","category":"advisory","primary":false}],"body":"\u003cp\u003eCitrix has urged administrators to immediately patch CVE-2026-107406, a critical memory-overflow flaw affecting NetScaler ADC appliances and NetScaler Gateway secure remote-access solutions. An attacker could use the issue to run code remotely on a targeted device or cause it to crash. The flaw affects appliances configured as a SAML identity provider or service provider.\u003c/p\u003e\n\n\u003cp\u003eCitrix recommends upgrading to NetScaler ADC and Gateway 14.1-73.46, 13.1-64.29, or later applicable releases, including specified FIPS and NDcPP versions. The company said it was not aware of any unmitigated exploitation when it published the bulletin, but noted that attackers have abused other NetScaler flaws this year. Shadowserver tracks more than 21,000 Internet-exposed IP addresses with NetScaler fingerprints, although it is unclear how many systems are patched, vulnerable, or honeypots.\u003c/p\u003e\n"},{"n":27,"title":"FBI Seizes 7 Domains, Disrupts Flax Typhoon Tools Used in Critical Infrastructure Intrusions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/fbi-seizes-7-domains-disrupts-flax.html","time":"06:39","priority":"SHOULD READ","score":88,"tldr":"The FBI and DOJ seized seven domains used by China-linked Flax Typhoon and Integrity Technology Group to operate reconnaissance and spear-phishing tools targeting U.S. and foreign critical infrastructure. The action follows disruption of the group’s Raptor Train IoT botnet and highlights its continued use of large-scale scanning, botnets, and credential theft.","briefOverview":"\u003cp\u003eThe FBI and U.S. Department of Justice seized seven domains and blocked access to platforms allegedly used by China-linked Flax Typhoon to scan for weaknesses and, in some cases, infiltrate U.S. critical infrastructure. Flax Typhoon, also tracked as Ethereal Panda and RedJuliett, is associated with Beijing-based Integrity Technology Group, which authorities say contracts with the Chinese government. The seized domains included c0cc[.]cc, 98aiblog[.]com, outlook3650[.]com, and linkedinns[.]net.\u003c/p\u003e\n\n\u003cp\u003eCourt documents allege that Integrity Technology Group operated the Raptor Train botnet using a Mirai variant and managed it through an application called Sparrow. A server associated with the botnet held records for more than 1.2 million infected devices as of June 5, 2024, including more than 385,000 unique U.S. devices, while more than 260,000 devices were actively infected. The group also allegedly used MicroScan, a tool with more than 1,300 penetration-testing scripts, and FishHub for spear-phishing, remote access, and collecting selected files from victim networks.\u003c/p\u003e\n\n\u003cp\u003eReported targets included a U.S. power company, airports in Japan and Poland, Taiwanese natural-gas and power organizations, and Taiwanese universities. Authorities said the actors also used cross-site scripting for credential harvesting, SoftEther VPN clients for persistence, EBurst to target Microsoft 365 accounts, and office-cli to access mailbox data. A joint advisory from agencies in several countries said Integrity Technology Group enabled China-linked actors to target organizations worldwide by acquiring or developing cyber tools and compromising networks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI and U.S. Department of Justice seized seven domains used by China-linked Flax Typhoon to support vulnerability scanning, spear-phishing, and, in some cases, intrusions targeting critical infrastructure.","Flax Typhoon, also known as Ethereal Panda and RedJuliett, is associated with Beijing-based Integrity Technology Group, which U.S. authorities say contracted with the Chinese government.","Integrity Technology Group allegedly operated the Raptor Train IoT botnet using a Mirai variant; as of June 5, 2024, records showed more than 1.2 million infected devices, including more than 385,000 unique U.S. devices.","The group’s MicroScan tool included more than 1,300 penetration-testing scripts and was used alongside other tools to identify weaknesses in networks and web applications.","Authorities said the group targeted organizations including a U.S. power company, airports in Japan and Poland, Taiwanese natural-gas and power companies, and Taiwanese universities."],"insights":["Integrity Technology Group’s infrastructure reportedly tracked more than 1.2 million infected devices, including over 385,000 unique U.S. devices, showing the scale available to support its operations.","MicroScan was reportedly in use as early as 2017 and contained more than 1,300 scripts for checking specific software weaknesses, indicating a long-running and broad reconnaissance capability.","The article describes both automated scanning through botnets and hands-on methods such as credential harvesting and Microsoft 365 account brute-forcing, rather than reliance on a single intrusion method.","Although the Raptor Train botnet was disrupted in September 2024, authorities said related scanning infrastructure remained accessible through at least September 9, 2026.","FishHub-related activity was confirmed at 20 Taiwanese universities, where the tool could provide remote access or search for and send selected files to Integrity Technology Group-controlled servers."],"referencedReports":[{"title":"Joint Cybersecurity Advisory AA26-281A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-281a","publisher":"cisa and international cybersecurity and intelligence agencies","context":"The article cites a joint advisory from agencies in the United States, United Kingdom, Australia, Canada, Japan, New Zealand, and Spain that identifies Integrity Technology Group as enabling malicious cyber activity worldwide.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe FBI and U.S. Department of Justice seized seven domains and blocked access to platforms allegedly used by China-linked Flax Typhoon to scan for weaknesses and, in some cases, infiltrate U.S. critical infrastructure. Flax Typhoon, also tracked as Ethereal Panda and RedJuliett, is associated with Beijing-based Integrity Technology Group, which authorities say contracts with the Chinese government. The seized domains included c0cc[.]cc, 98aiblog[.]com, outlook3650[.]com, and linkedinns[.]net.\u003c/p\u003e\n\n\u003cp\u003eCourt documents allege that Integrity Technology Group operated the Raptor Train botnet using a Mirai variant and managed it through an application called Sparrow. A server associated with the botnet held records for more than 1.2 million infected devices as of June 5, 2024, including more than 385,000 unique U.S. devices, while more than 260,000 devices were actively infected. The group also allegedly used MicroScan, a tool with more than 1,300 penetration-testing scripts, and FishHub for spear-phishing, remote access, and collecting selected files from victim networks.\u003c/p\u003e\n\n\u003cp\u003eReported targets included a U.S. power company, airports in Japan and Poland, Taiwanese natural-gas and power organizations, and Taiwanese universities. Authorities said the actors also used cross-site scripting for credential harvesting, SoftEther VPN clients for persistence, EBurst to target Microsoft 365 accounts, and office-cli to access mailbox data. A joint advisory from agencies in several countries said Integrity Technology Group enabled China-linked actors to target organizations worldwide by acquiring or developing cyber tools and compromising networks.\u003c/p\u003e\n"},{"n":18,"title":"Researchers Publish Working Exploit for Pre-Auth AnyDesk Linux Flaw That Gives Root Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/researchers-publish-working-exploit-for.html","time":"12:59","priority":"SHOULD READ","score":86,"tldr":"A public exploit dubbed AnyPwn can give unauthenticated attackers root-level remote code execution on unpatched AnyDesk Linux 8.0.2 via direct TCP connections on port 7070. Administrators should upgrade to AnyDesk 8.0.3 or later and restrict port 7070 if patching is delayed.","briefOverview":"\u003cp\u003eSecurity researchers published a working exploit, called AnyPwn, for a pre-authentication remote code execution flaw in AnyDesk Linux that can give an attacker root access before a connection is approved. The proof of concept targets AnyDesk Linux 8.0.2 over direct TCP c
