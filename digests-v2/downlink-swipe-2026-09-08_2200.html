<script type="application/json" id="dl-articles">[{"n":3,"title":"“StyleSmuggler” – Adobe Commerce, Adobe Commerce B2B, and Magento RCE (CVE-2026-75650): Overview and Takeaways","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/stylesmuggler-adobe-commerce-adobe-commerce-b2b-and-magento-rce-cve-2026-75650/","time":"22:15","priority":"MUST READ","score":98,"tldr":"Adobe disclosed a critical unauthenticated RCE flaw, CVE-2026-75650 “StyleSmuggler,” affecting Adobe Commerce, Adobe Commerce B2B, and Magento Open Source, with confirmed in-the-wild exploitation. Organizations should immediately apply Adobe’s VULN-39341 hotfix and treat any internet-exposed unpatched instance since September 4, 2026 as potentially compromised.","briefOverview":"\u003cp\u003eAdobe disclosed CVE-2026-75650, dubbed “StyleSmuggler,” on September 7, 2026. The vulnerability received a maximal initial CVSS score of 10.0 and affects Adobe Commerce, Adobe Commerce B2B, and Magento Open Source. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog on September 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows an unauthenticated network-based attacker to execute arbitrary code by injecting PHP through Magento’s email template engine. The article identifies the root cause as improper neutralization of special elements used in a template engine, tracked as CWE-1336. It says attackers can trigger execution through a “Payment Transaction Failed Reminder” email.\u003c/p\u003e\n\n\u003cp\u003eExploitation has been confirmed in the wild since at least September 4, 2026, with threat actors deploying a Rust-based Linux backdoor and PHP web shells on compromised storefronts. The article recommends identifying all Adobe Commerce and Magento deployments, applying Adobe’s VULN-39341 Composer hotfix from bulletin APSB26-146, and following Adobe’s verification workflow. It also advises treating any unpatched internet-exposed instance as potentially compromised, checking Sansec’s indicators of compromise, deploying WAF rules, and monitoring for unusual PHP process spawning and unexpected outbound connections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adobe disclosed CVE-2026-75650, dubbed “StyleSmuggler,” on September 7, 2026, and assigned it an initial CVSS score of 10.0.","The vulnerability affects Adobe Commerce, Adobe Commerce B2B, and Magento Open Source and allows unauthenticated remote code execution through PHP injection in Magento’s email template engine.","Exploitation has been confirmed in the wild since at least September 4, 2026, with attackers deploying a Rust-based Linux backdoor and PHP web shells on compromised storefronts.","CISA added CVE-2026-75650 to its Known Exploited Vulnerabilities catalog on September 8, 2026.","The article recommends applying Adobe’s VULN-39341 Composer hotfix, verifying successful installation, checking Sansec’s indicators of compromise, and treating unpatched internet-exposed instances as potentially compromised."],"insights":["Any internet-exposed affected instance that remained unpatched on or after September 4, 2026 requires investigation, because exploitation was observed before Adobe’s September 7 disclosure.","Remediation depends on applying the VULN-39341 Composer hotfix from Adobe bulletin APSB26-146, which the article emphasizes is an emergency hotfix rather than a full minor release.","Defensive monitoring should focus on Magento email generation behavior because the described execution path involves injected PHP being triggered through a “Payment Transaction Failed Reminder” email.","Compromise checks should include Sansec’s host, network, and media-directory indicators of compromise in addition to monitoring for unusual PHP process spawning and unexpected outbound connections."],"referencedReports":[{"title":"Adobe Security Advisory APSB26-146","url":"https://experienceleague.adobe.com/en/docs/commerce-knowledge-base/kb/announcements/commerce-apsb26-146","publisher":"Adobe","context":"The article cites Adobe bulletin APSB26-146 as the source for the VULN-39341 Composer hotfix and links it as the Adobe Security Advisory.","category":"","primary":false}],"body":"\u003cp\u003eAdobe disclosed CVE-2026-75650, dubbed “StyleSmuggler,” on September 7, 2026. The vulnerability received a maximal initial CVSS score of 10.0 and affects Adobe Commerce, Adobe Commerce B2B, and Magento Open Source. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog on September 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows an unauthenticated network-based attacker to execute arbitrary code by injecting PHP through Magento’s email template engine. The article identifies the root cause as improper neutralization of special elements used in a template engine, tracked as CWE-1336. It says attackers can trigger execution through a “Payment Transaction Failed Reminder” email.\u003c/p\u003e\n\n\u003cp\u003eExploitation has been confirmed in the wild since at least September 4, 2026, with threat actors deploying a Rust-based Linux backdoor and PHP web shells on compromised storefronts. The article recommends identifying all Adobe Commerce and Magento deployments, applying Adobe’s VULN-39341 Composer hotfix from bulletin APSB26-146, and following Adobe’s verification workflow. It also advises treating any unpatched internet-exposed instance as potentially compromised, checking Sansec’s indicators of compromise, deploying WAF rules, and monitoring for unusual PHP process spawning and unexpected outbound connections.\u003c/p\u003e\n"},{"n":4,"title":"Microsoft Patch Tuesday for September 2026 — Snort rules and prominent vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/microsoft-patch-tuesday-for-september-2026/","time":"22:16","priority":"MUST READ","score":95,"tldr":"Microsoft’s September 2026 Patch Tuesday fixes 973 vulnerabilities, including 113 critical issues and two Windows elevation-of-privilege flaws already exploited in the wild. Organizations should prioritize applying the updates, especially for the exploited and more-likely-to-be-exploited vulnerabilities, while Talos has released Snort coverage for some exploit attempts.","briefOverview":"\u003cp\u003eMicrosoft released its September 2026 monthly security update addressing 973 vulnerabilities across a range of products. Microsoft marked 113 of the vulnerabilities as critical, including 82 remote code execution vulnerabilities. The article states that two vulnerabilities disclosed this month have been exploited in the wild: CVE-2026-81963 in Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified several critical vulnerabilities as more likely to be exploited, including issues affecting Windows Kerberos, Windows Routing and Remote Access Service, Windows Deployment Services, Spring Cloud Azure, Windows Virtualization-Based Security, Windows Services for NFS ONCRPC XDR Driver, Windows DNS Server, and Azure Cosmos DB. The article also lists many vulnerabilities Microsoft considers less likely or unlikely to be exploited, covering products such as Windows DHCP Server, SQL Server, Windows Imaging Component, Microsoft Office, Windows Hyper-V, Windows Hello, and others. Other critical vulnerabilities highlighted include issues in Microsoft Entra ID, Power Automate, Copilot Studio, Azure Active Directory B2C, Microsoft Fabric, Azure AI Language, and Microsoft Discovery Studio.\u003c/p\u003e\n\n\u003cp\u003eTalos also highlighted numerous important vulnerabilities that Microsoft considers more likely to be exploited, including issues in Windows Kernel, Windows Win32k, LSA Server, Windows Search Component, Print Spooler Components, Remote Desktop Services, Windows SMB Client, Windows Schannel, and other Windows components. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article lists Snort 2 coverage as SIDs 67011-67032 and 67036-67084, and Snort 3 coverage as SIDs 301619-301629, 301632-301655, and 67046.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released its September 2026 monthly security update addressing 973 vulnerabilities across multiple products, including 113 marked as critical.","Microsoft stated that two vulnerabilities, CVE-2026-81963 in Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call, have been exploited in the wild.","Out of the 113 critical vulnerabilities, 82 are remote code execution vulnerabilities.","Microsoft assessed several vulnerabilities as more likely to be exploited, including issues affecting Windows Kerberos, Windows Routing and Remote Access Service, Windows Deployment Services, Spring Cloud Azure, Windows DNS Server, Azure Cosmos DB, and other products.","Talos released a new Snort ruleset to detect attempts to exploit some of the disclosed vulnerabilities, with coverage listed for both Snort 2 and Snort 3 rules."],"insights":["The two vulnerabilities already exploited in the wild are both elevation-of-privilege issues with CVSS scores of 7.8, showing that active exploitation is not limited to the highest-scoring critical flaws.","Windows DNS Server stands out because CVE-2026-69730 is both rated 9.8 and considered more likely to be exploited, while additional Windows DNS Server remote code execution flaws are listed as less likely or unlikely.","Several cloud and identity-related services have very high-severity elevation-of-privilege issues, including Microsoft Azure Active Directory B2C and Azure AI Language vulnerabilities with CVSS scores of 10.0.","Talos highlights many “important” vulnerabilities, not only critical ones, because Microsoft considers their exploitation more likely, indicating that prioritization should not rely on severity labels alone.","Snort coverage is available for only some of the disclosed vulnerabilities, and Talos notes that additional rules may be released later and current rules may change as more information becomes available."],"referencedReports":[{"title":"Microsoft Security Update Guide","url":"https://msrc.microsoft.com/update-guide/","publisher":"Microsoft","context":"The article says a complete list of all vulnerabilities Microsoft disclosed this month is available on Microsoft’s update page.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft released its September 2026 monthly security update addressing 973 vulnerabilities across a range of products. Microsoft marked 113 of the vulnerabilities as critical, including 82 remote code execution vulnerabilities. The article states that two vulnerabilities disclosed this month have been exploited in the wild: CVE-2026-81963 in Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified several critical vulnerabilities as more likely to be exploited, including issues affecting Windows Kerberos, Windows Routing and Remote Access Service, Windows Deployment Services, Spring Cloud Azure, Windows Virtualization-Based Security, Windows Services for NFS ONCRPC XDR Driver, Windows DNS Server, and Azure Cosmos DB. The article also lists many vulnerabilities Microsoft considers less likely or unlikely to be exploited, covering products such as Windows DHCP Server, SQL Server, Windows Imaging Component, Microsoft Office, Windows Hyper-V, Windows Hello, and others. Other critical vulnerabilities highlighted include issues in Microsoft Entra ID, Power Automate, Copilot Studio, Azure Active Directory B2C, Microsoft Fabric, Azure AI Language, and Microsoft Discovery Studio.\u003c/p\u003e\n\n\u003cp\u003eTalos also highlighted numerous important vulnerabilities that Microsoft considers more likely to be exploited, including issues in Windows Kernel, Windows Win32k, LSA Server, Windows Search Component, Print Spooler Components, Remote Desktop Services, Windows SMB Client, Windows Schannel, and other Windows components. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article lists Snort 2 coverage as SIDs 67011-67032 and 67036-67084, and Snort 3 coverage as SIDs 301619-301629, 301632-301655, and 67046.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft posts nearly 1,000 bugs for Patch Tuesday as CISA warns two being exploited","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/microsoft-patch-tuesday-september-2026","time":"22:40","priority":"MUST READ","score":94,"tldr":"Microsoft disclosed a record 973 vulnerabilities in its September Patch Tuesday release, with CISA warning that two Windows flaws are already being exploited and ordering federal agencies to patch by September 22. Researchers say the bugs could enable privilege escalation and broader attack chains, adding to a record-breaking year for Microsoft vulnerability disclosures.","briefOverview":"\u003cp\u003eMicrosoft’s latest Patch Tuesday release disclosed 973 bugs, surpassing 900 vulnerabilities for the first time. CISA confirmed that two of them, CVE-2026-81963 and CVE-2026-85880, are being exploited by hackers. Federal agencies have until September 22 to patch those two vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eTenable’s Satnam Narang said CVE-2026-81963 relates to a component used to install Windows updates, while CVE-2026-85880 affects a messaging system in Windows. Nightwing cybersecurity expert Nick Carroll said more than 22,000 corporate Exchange servers are unpatched against weaponized exploit code. Other experts said bugs like CVE-2026-81963 can be an early step in a ransomware chain where attackers phish one user and use that access to gain escalated privileges.\u003c/p\u003e\n\n\u003cp\u003eThe release continues a record-setting year for Microsoft vulnerability disclosures, bringing the year’s total to more than 2,600 bugs, according to Narang. The article notes that cybersecurity researchers and defenders have warned that artificial intelligence code-review tools could lead to many minor vulnerabilities that attackers might chain together. Qualys expert Diksha Ojha also noted that Adobe announced a separate critical-severity bug in Adobe Commerce this month.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft disclosed 973 bugs in its latest Patch Tuesday release, surpassing 900 vulnerabilities for the first time.","CISA confirmed that CVE-2026-81963 and CVE-2026-85880 are being exploited by hackers and gave federal agencies until September 22 to patch them.","Tenable’s Satnam Narang said CVE-2026-81963 relates to a component used to install Windows updates, while CVE-2026-85880 affects a messaging system in Windows.","Nightwing cybersecurity expert Nick Carroll said more than 22,000 corporate Exchange servers are unpatched against weaponized exploit code.","Narang said the latest Patch Tuesday release brings the year’s total disclosed bugs to more than 2,600, already more than double the previous record-setting year of 2020."],"insights":["The patch volume is accelerating sharply, with Microsoft setting a record in June, tripling it in July, and then surpassing 900 vulnerabilities in the latest Patch Tuesday.","Researchers linked the surge in disclosed bugs to the use of artificial intelligence code-review tools, warning that many minor flaws could still become dangerous when combined.","CVE-2026-81963 is especially operationally sensitive because it affects the Windows update stack, meaning attackers who control it may interfere with the same mechanism defenders rely on to remove them.","Automox’s Serena DiPenti said organizations that cannot confirm when the update stack last ran also cannot confirm whether the system is actually patched."],"referencedReports":[{"title":"Microsoft Security Update Guide release notes for September 2026","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Sep","publisher":"Microsoft","context":"The article cites Microsoft’s Patch Tuesday release notes as the source for the 973 disclosed bugs.","category":"","primary":false},{"title":"Adobe Commerce security update APSB26-146","url":"https://helpx.adobe.com/security/products/magento/apsb26-146.html","publisher":"Adobe","context":"The article says Adobe announced another critical-severity vulnerability this month in Adobe Commerce.","category":"","primary":false},{"title":"StyleSmuggler 0day","url":"https://sansec.io/research/stylesmuggler-0day","publisher":"Sansec","context":"The article links to Sansec’s analysis when referring to a critical-severity bug in Adobe Commerce.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft’s latest Patch Tuesday release disclosed 973 bugs, surpassing 900 vulnerabilities for the first time. CISA confirmed that two of them, CVE-2026-81963 and CVE-2026-85880, are being exploited by hackers. Federal agencies have until September 22 to patch those two vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eTenable’s Satnam Narang said CVE-2026-81963 relates to a component used to install Windows updates, while CVE-2026-85880 affects a messaging system in Windows. Nightwing cybersecurity expert Nick Carroll said more than 22,000 corporate Exchange servers are unpatched against weaponized exploit code. Other experts said bugs like CVE-2026-81963 can be an early step in a ransomware chain where attackers phish one user and use that access to gain escalated privileges.\u003c/p\u003e\n\n\u003cp\u003eThe release continues a record-setting year for Microsoft vulnerability disclosures, bringing the year’s total to more than 2,600 bugs, according to Narang. The article notes that cybersecurity researchers and defenders have warned that artificial intelligence code-review tools could lead to many minor vulnerabilities that attackers might chain together. Qualys expert Diksha Ojha also noted that Adobe announced a separate critical-severity bug in Adobe Commerce this month.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft adds age-awareness APIs that can tell if users are children, teens, or adults","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-adds-age-awareness-apis-that-can-tell-if-users-are-children-teens-or-adults/","time":"01:16","priority":"MAY READ","score":62,"tldr":"Microsoft is adding Windows 11 APIs that let apps determine whether a user is a child, teen, or adult without exposing their exact birthdate. The system ties into Microsoft Age Verification so users can verify once and let apps apply age-appropriate safeguards, including for AI experiences.","briefOverview":"\u003cp\u003eMicrosoft is adding new age-awareness APIs to Windows 11 that allow apps to determine whether a user is a child, teenager, or adult without exposing the user\u0026rsquo;s exact date of birth. The Windows Age API uses information associated with a Microsoft account and can return age ranges such as under 10, 10-12, 13-15, 16-17, and 18+. Microsoft says apps receive only the age-related signal needed for the experience, not sensitive personal data such as a full date of birth.\u003c/p\u003e\n\n\u003cp\u003eDevelopers will be able to use GetUserAgeRangeAsync to retrieve age groups and GetAgeVerificationStatusAsync to determine whether a user\u0026rsquo;s age has been verified rather than self-reported. Microsoft says the APIs could let apps automatically adjust features and safeguards for younger users without requiring parents to configure every app individually, including in AI experiences. The APIs will work alongside Microsoft Age Verification, which stores a verified age status with a Microsoft account under a “verify once → use everywhere” model.\u003c/p\u003e\n\n\u003cp\u003eAge verification is already available through Microsoft storefronts in Singapore, Brazil, and Australia, with more regions planned as regulatory requirements expand. Microsoft is also increasing the visibility of parental controls during Windows setup in regions including France. The Windows Age APIs are broadly available to Windows Insiders now and will roll out to all Windows users soon.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is adding new age-awareness APIs to Windows 11 that let apps determine whether a user is a child, teenager, or adult without exposing the user's exact date of birth.","The Windows Age API can return age ranges including under 10, 10-12, 13-15, 16-17, and 18+ using information associated with a Microsoft account.","Developers can use GetUserAgeRangeAsync to retrieve age groups and GetAgeVerificationStatusAsync to check whether a user's age has been verified rather than self-reported.","Microsoft says the APIs could let apps automatically adjust features and safeguards for younger users, including in AI experiences, without requiring parents to configure every app individually.","Microsoft Age Verification stores a verified age status with a Microsoft account and is already available through Microsoft storefronts in Singapore, Brazil, and Australia, with more regions planned."],"insights":["Microsoft is separating age range from age verification, so an app can distinguish between a user’s stated age category and whether that age has actually been verified.","The “verify once → use everywhere” model shifts repeated age checks away from individual apps and toward a Microsoft account-level status that apps can query through Windows.","The rollout is being tied to regional regulatory pressure, with age verification already available in Singapore, Brazil, and Australia and parental control visibility increasing during Windows setup in regions including France.","Microsoft explicitly connects the new APIs to AI experiences, indicating that age-based safeguards are expected to apply beyond traditional app settings and content controls."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is adding new age-awareness APIs to Windows 11 that allow apps to determine whether a user is a child, teenager, or adult without exposing the user\u0026rsquo;s exact date of birth. The Windows Age API uses information associated with a Microsoft account and can return age ranges such as under 10, 10-12, 13-15, 16-17, and 18+. Microsoft says apps receive only the age-related signal needed for the experience, not sensitive personal data such as a full date of birth.\u003c/p\u003e\n\n\u003cp\u003eDevelopers will be able to use GetUserAgeRangeAsync to retrieve age groups and GetAgeVerificationStatusAsync to determine whether a user\u0026rsquo;s age has been verified rather than self-reported. Microsoft says the APIs could let apps automatically adjust features and safeguards for younger users without requiring parents to configure every app individually, including in AI experiences. The APIs will work alongside Microsoft Age Verification, which stores a verified age status with a Microsoft account under a “verify once → use everywhere” model.\u003c/p\u003e\n\n\u003cp\u003eAge verification is already available through Microsoft storefronts in Singapore, Brazil, and Australia, with more regions planned as regulatory requirements expand. Microsoft is also increasing the visibility of parental controls during Windows setup in regions including France. The Windows Age APIs are broadly available to Windows Insiders now and will roll out to all Windows users soon.\u003c/p\u003e\n"}]</script>
