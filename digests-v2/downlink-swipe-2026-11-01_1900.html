<script type="application/json" id="dl-articles">[{"n":1,"title":"FBI links $6.3 billion Binance crypto heist to North Korean hackers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fbi-links-63-billion-binance-crypto-heist-to-north-korean-hackers/","time":"19:57","priority":"MUST READ","score":98,"tldr":"The FBI attributed the record $6.3 billion Binance cryptocurrency theft to North Korean TraderTraitor/Lazarus hackers, who allegedly gained access through a compromised DevOps engineer’s laptop. Binance says it has covered about 95% of affected assets and plans to resume withdrawals while authorities seek to block laundering addresses.","briefOverview":"\u003cp\u003eThe FBI has attributed the theft of more than \u003cspan class=\"math inline\"\u003e\\(6 billion in virtual assets from Binance on October 29, 2026, to North Korean state-sponsored hackers known as TraderTraitor. The group is also tracked as Lazarus Group, Jade Sleet, and APT38. The theft, estimated at approximately \\)\u003c/span\u003e6.36 billion across ten blockchains, is described as the largest cryptocurrency heist on record.\u003c/p\u003e\n\n\u003cp\u003eBinance said the attackers compromised a DevOps engineer’s laptop, accessed a service container, and submitted unauthorized withdrawal transactions, with most funds transferred within 20 minutes. The FBI has observed the group converting stolen assets primarily into Ethereum and warned that the funds may be laundered through decentralized finance platforms and instant swap services; it published 628 addresses associated with the theft and asked relevant providers to block linked transactions. Binance said it has covered about 95% of the affected amount, will bear the losses rather than pass them to users, and intends to resume an initial phase of withdrawals on November 1.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI attributed the theft of more than $6 billion in virtual assets from Binance on October 29, 2026, to North Korean state-sponsored hackers known as TraderTraitor, also tracked as Lazarus Group, Jade Sleet, and APT38.","Binance said attackers used a compromised DevOps engineer’s laptop to access a service container and submit unauthorized withdrawal transactions, stealing approximately $6.36 billion across ten blockchains.","The FBI reported that the group has primarily converted the stolen assets into Ethereum and may further launder them through decentralized finance platforms and instant cryptocurrency swap services.","The FBI published 628 cryptocurrency addresses associated with the theft and asked exchanges, blockchain operators, and virtual asset service providers to block transactions linked to those addresses.","Binance said it had covered approximately 95% of the affected amount, would bear the financial losses rather than pass them to users, and planned to resume the first phase of withdrawals on November 1."],"insights":["The theft illustrates how compromising one employee device with access to operational systems can enable unauthorized withdrawals at exchange-wide scale.","Most of the approximately $6.36 billion was moved across ten blockchains within 20 minutes, highlighting the limited time available for exchanges and blockchain-service providers to respond after suspicious withdrawals begin.","The FBI’s publication of 628 laundering addresses gives cryptocurrency exchanges and related providers concrete indicators they can use to block transactions tied to the theft.","The group’s documented use of fake recruiting offers, malicious coding tests, and in-person relationship building shows that its operations rely heavily on deceiving employees rather than only targeting technical systems.","Binance said the final 5% of the affected amount is harder to replace because it consists of less-liquid tokens, indicating that recovery can depend on whether stolen assets can be acquired without readily available markets."],"referencedReports":[{"title":"North Korea Responsible for $6 Billion Binance Attack","url":"http://www.fbi.gov/investigate/cyber/alerts/2026/north-korea-responsible-for-6-billion-binance-attack","publisher":"fbi","context":"The article cites the FBI security alert attributing the Binance theft to North Korean TraderTraitor hackers and listing cryptocurrency addresses tied to laundering activity.","category":"advisory","primary":true}],"body":"\u003cp\u003eThe FBI has attributed the theft of more than \u003cspan class=\"math inline\"\u003e\\(6 billion in virtual assets from Binance on October 29, 2026, to North Korean state-sponsored hackers known as TraderTraitor. The group is also tracked as Lazarus Group, Jade Sleet, and APT38. The theft, estimated at approximately \\)\u003c/span\u003e6.36 billion across ten blockchains, is described as the largest cryptocurrency heist on record.\u003c/p\u003e\n\n\u003cp\u003eBinance said the attackers compromised a DevOps engineer’s laptop, accessed a service container, and submitted unauthorized withdrawal transactions, with most funds transferred within 20 minutes. The FBI has observed the group converting stolen assets primarily into Ethereum and warned that the funds may be laundered through decentralized finance platforms and instant swap services; it published 628 addresses associated with the theft and asked relevant providers to block linked transactions. Binance said it has covered about 95% of the affected amount, will bear the losses rather than pass them to users, and intends to resume an initial phase of withdrawals on November 1.\u003c/p\u003e\n"}]</script>
