<script type="application/json" id="dl-articles">[{"n":1,"title":"Searchjacked: Hidden Browser Extensions Hijack Searches for 13 Million Users","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/searchjacked?utm_medium=feed","time":"02:01","priority":"SHOULD READ","score":84,"tldr":"Researchers identified 319 mostly hidden Chrome extensions, installed by roughly 13.4 million users over a decade, that replace default search engines and route queries through operator-controlled proxies to monetize Yahoo or Bing referral traffic. This gives operators visibility into users’ searches and the ability to dynamically redirect them to potentially malicious destinations.","briefOverview":"\u003cp\u003eResearchers identified 319 browser extensions installed by roughly 13.4 million users over a decade that replace the browser’s default search engine and route queries through operator-controlled servers. Most are unlisted from Chrome Web Store search and are promoted through advertisements for apparent utilities such as manual finders, PDF converters, safe search, and AI search tools. The investigation adds 264 newly identified extensions to earlier research and attributes some campaigns to organizations including Intango LTD, Tightrope Interactive, System1, Perion Network, and ValidClick/Inuvo, while other large groups remain unknown.\u003c/p\u003e\n\n\u003cp\u003eThe extensions commonly use the browser manifest’s built-in search-provider setting and may contain no permissions, background code, page-injected code, or user interface beyond icon files. Their proxy servers can record complete search queries, attach Yahoo or Bing syndication partner identifiers, and select redirects separately for each request. In one example, six identical Predator Search queries reached four different destinations, including Yahoo results, intermediary landing pages, a Bing-related results path, and a Cloudflare error page; the article warns that this server-side control could be used to direct selected users to phishing pages or malware lures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The investigation identified 319 browser extensions that changed users’ default search providers and were installed by roughly 13.4 million users over a decade.","Many of the extensions are unlisted in the Chrome Web Store and are promoted through advertisements for tools such as PDF search, manual finding, safe search, and AI search.","The extensions route search queries through operator-controlled proxy servers before redirecting users to Yahoo or Bing results with search-syndication partner tracking IDs.","The proxy servers allow operators to record search referrals and can choose destinations separately for each request; one tested extension sent identical searches to several different destinations.","Identified operators include Intango LTD, Tightrope Interactive, System1, Perion Network, and ValidClick/Inuvo, while two large groups called SecuryBrowse and Bing-Search remain unattributed."],"insights":["Some of the identified hijacking extensions consist only of a manifest and icon files, with no requested permissions, background logic, injected page code, or user interface, because the browser’s built-in search-provider override is sufficient to redirect searches.","A test of the Predator Search extension showed that six identical searches were sent to four different destinations, demonstrating that its server selected the redirect path separately for each request.","The article found that extensions can be unlisted from Chrome Web Store search and indexing while remaining publicly accessible through direct links, allowing advertising campaigns to drive installations without making the listings easy to discover normally.","Google Ads Transparency, privacy-policy pages, landing pages, Censys, Urlscan, and advertising-supply-chain records can be combined to connect extension-install campaigns to advertisers and related domains.","Intango LTD’s 111 identified extensions used roughly 279 domains, with separate domains and admin email addresses making listings appear to originate from independent small publishers."],"referencedReports":[{"title":"Searching for Something Unknown","url":"https://secureannex.com/blog/searching-for-something-unknow","publisher":"Secure Annex","context":"The article states that its investigation expands on this previous research into browser extensions that capture and redirect search queries.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers identified 319 browser extensions installed by roughly 13.4 million users over a decade that replace the browser’s default search engine and route queries through operator-controlled servers. Most are unlisted from Chrome Web Store search and are promoted through advertisements for apparent utilities such as manual finders, PDF converters, safe search, and AI search tools. The investigation adds 264 newly identified extensions to earlier research and attributes some campaigns to organizations including Intango LTD, Tightrope Interactive, System1, Perion Network, and ValidClick/Inuvo, while other large groups remain unknown.\u003c/p\u003e\n\n\u003cp\u003eThe extensions commonly use the browser manifest’s built-in search-provider setting and may contain no permissions, background code, page-injected code, or user interface beyond icon files. Their proxy servers can record complete search queries, attach Yahoo or Bing syndication partner identifiers, and select redirects separately for each request. In one example, six identical Predator Search queries reached four different destinations, including Yahoo results, intermediary landing pages, a Bing-related results path, and a Cloudflare error page; the article warns that this server-side control could be used to direct selected users to phishing pages or malware lures.\u003c/p\u003e\n"}]</script>
