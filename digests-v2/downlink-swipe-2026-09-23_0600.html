<script type="application/json" id="dl-articles">[{"n":1,"title":"F5 patches BIG-IP APM zero-day flaw exploited in RCE attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/f5-warns-of-big-ip-apm-remote-code-execution-zero-day-exploited-in-attacks/","time":"07:17","priority":"MUST READ","score":98,"tldr":"F5 patched CVE-2026-94127, a critical BIG-IP Access Policy Manager flaw that is actively being exploited for remote code execution on deployments configured as OAuth authorization servers. Organizations should apply the updates immediately or use F5’s iRule mitigation and check for compromise indicators.","briefOverview":"\u003cp\u003eF5 released security updates for CVE-2026-94127, a critical zero-day flaw in BIG-IP Access Policy Manager (APM) that has been exploited in remote code execution attacks. The issue affects BIG-IP APM instances configured as OAuth Authorization Servers when both an APM access policy and an OAuth profile are configured on a virtual server. Deployments that use APM only as an OAuth Client or Resource Server, without OAuth authorization-server profiles, are not affected.\u003c/p\u003e\n\n\u003cp\u003eF5 advises customers to investigate for possible compromise when multiple OAuth authentication failures and suspicious commands are followed shortly by a TMM SIGABRT. Organizations unable to install the updates immediately can apply an F5-provided iRule to the affected virtual server as a mitigation. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected networks by Friday; Shadowserver tracks more than 14,700 IP addresses with BIG-IP APM fingerprints, although that number may include patched devices and honeypots.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 released security updates for CVE-2026-94127, a critical BIG-IP Access Policy Manager flaw that the company says has been exploited in remote code execution attacks.","The flaw affects BIG-IP APM deployments configured as OAuth Authorization Servers when an APM access policy and OAuth profile are set on a virtual server.","Deployments that use APM strictly as an OAuth Client or Resource Server without OAuth authorization server profiles are not affected, according to F5.","F5 advises customers to review systems for signs of compromise and provides an iRule mitigation for affected virtual servers when patches cannot be installed immediately.","CISA added CVE-2026-94127 to its Known Exploited Vulnerabilities Catalog and directed U.S. federal agencies to secure affected networks by Friday."],"insights":["A practical sign of possible compromise is a sequence of multiple OAuth authentication failures and suspicious commands followed shortly by a TMM SIGABRT crash.","The affected population is narrower than all BIG-IP APM users: risk depends on the specific combination of an OAuth authorization-server profile and an APM access policy on a virtual server.","Shadowserver identifies more than 14,700 internet-facing IP addresses with BIG-IP APM fingerprints, although the article notes that this total may include patched systems and honeypots.","Organizations unable to patch immediately can apply an F5-provided iRule to the affected virtual server as a temporary mitigation."],"referencedReports":[{"title":"F5 Security Advisory K000162605: CVE-2026-94127","url":"https://my.f5.com/manage/s/article/K000162605","publisher":"f5","context":"The article cites F5's security advisory as the source warning that CVE-2026-94127 has been exploited and describing affected configurations and compromise indicators.","category":"advisory","primary":true},{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/22/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites this CISA alert to report that CVE-2026-94127 was added to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2026-94127","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-94127","publisher":"cisa","context":"The article references CISA's catalog entry for the federal remediation deadline for this actively exploited flaw.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 released security updates for CVE-2026-94127, a critical zero-day flaw in BIG-IP Access Policy Manager (APM) that has been exploited in remote code execution attacks. The issue affects BIG-IP APM instances configured as OAuth Authorization Servers when both an APM access policy and an OAuth profile are configured on a virtual server. Deployments that use APM only as an OAuth Client or Resource Server, without OAuth authorization-server profiles, are not affected.\u003c/p\u003e\n\n\u003cp\u003eF5 advises customers to investigate for possible compromise when multiple OAuth authentication failures and suspicious commands are followed shortly by a TMM SIGABRT. Organizations unable to install the updates immediately can apply an F5-provided iRule to the affected virtual server as a mitigation. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected networks by Friday; Shadowserver tracks more than 14,700 IP addresses with BIG-IP APM fingerprints, although that number may include patched devices and honeypots.\u003c/p\u003e\n"},{"n":3,"title":"F5 Patches Critical BIG-IP APM Zero-Day Exploited for Unauthenticated RCE on OAuth Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/f5-patches-critical-big-ip-apm-zero-day.html","time":"08:29","priority":"MUST READ","score":96,"tldr":"F5 has issued emergency hotfixes for CVE-2026-94127, a critical actively exploited BIG-IP APM flaw that enables unauthenticated remote code execution when APM is configured as an OAuth authorization server. Organizations should apply the branch-specific hotfix or F5’s temporary iRule mitigation immediately and investigate affected systems for compromise indicators.","briefOverview":"\u003cp\u003eF5 has disclosed and patched CVE-2026-94127, a critical heap-based buffer overflow in BIG-IP Access Policy Manager that attackers are actively exploiting for remote code execution without authentication. The issue affects deployments where APM acts as an OAuth authorization server, issuing access tokens, and where an APM access policy and OAuth authorization-server profile are configured on the same virtual server. F5 rates the flaw 9.8 out of 10 under CVSS v3.1, and CISA added it to the Known Exploited Vulnerabilities catalog on September 22.\u003c/p\u003e\n\n\u003cp\u003eRestricting the BIG-IP management interface does not protect against the flaw because malicious traffic is sent to the OAuth-facing virtual server; systems in Appliance mode are also vulnerable. F5 released engineering hotfixes for affected BIG-IP 17.1, 17.5, and 21.1 branches, and offers an iRule mitigation through support when patching cannot happen immediately. Organizations should also check for repeated invalid OAuth token requests, suspicious audit-log commands, and TMM crashes, while recognizing that F5 has not stated whether the hotfix removes any attacker access already established.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 reports that CVE-2026-94127 is being actively exploited and can allow unauthenticated remote code execution on affected BIG-IP Access Policy Manager systems.","The flaw affects BIG-IP deployments where Access Policy Manager acts as an OAuth authorization server and has an access policy and authorization-server profile on the same virtual server.","F5 rates the heap-based buffer overflow at 9.8 out of 10 under CVSS v3.1 and has released engineering hotfixes for BIG-IP 17.1, 17.5, and 21.1.","CISA added CVE-2026-94127 to its Known Exploited Vulnerabilities catalog and directed U.S. federal civilian agencies to apply mitigations by September 25.","F5 advises using a branch-specific hotfix or, when that cannot be installed immediately, an iRule mitigation available through F5 support."],"insights":["Restricting access to the BIG-IP management interface does not mitigate this issue because the malicious traffic is sent to the OAuth-facing virtual server, and Appliance mode systems are also vulnerable.","The affected condition is narrower than some early advisories indicated: F5 says only APM deployments acting as OAuth authorization servers are affected, while APM OAuth clients and resource servers without authorization-server profiles are not.","Organizations already running fixes for the earlier APM issue CVE-2025-53521 may still be exposed, because the relevant 17.1 and 17.5 fixed builds remain within the affected ranges for CVE-2026-94127.","F5’s reported compromise pattern is a sequence rather than a single signal: repeated invalid-token UserInfo failures, suspicious audit-log commands, and then a TMM SIGABRT shortly afterward should prompt human review.","F5 did not assess BIG-IP versions that have reached End of Technical Support, so those versions should be treated as having an unknown status rather than as unaffected."],"referencedReports":[{"title":"F5 Security Advisory K000162605","url":"https://my.f5.com/manage/s/article/K000162605","publisher":"f5","context":"F5 disclosed CVE-2026-94127 in this advisory and provided affected-version and hotfix information.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog Entry for CVE-2026-94127","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article says CISA added the actively exploited flaw to its KEV catalog and set a mitigation deadline for U.S. federal civilian agencies.","category":"advisory","primary":false},{"title":"CERT-EU Security Advisory 2026-013","url":"https://cert.europa.eu/publications/security-advisories/2026-013","publisher":"cert-eu","context":"The article cites this advisory for compromise indicators and its recommendation to preserve evidence, patch, and begin incident response if compromise is found.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 has disclosed and patched CVE-2026-94127, a critical heap-based buffer overflow in BIG-IP Access Policy Manager that attackers are actively exploiting for remote code execution without authentication. The issue affects deployments where APM acts as an OAuth authorization server, issuing access tokens, and where an APM access policy and OAuth authorization-server profile are configured on the same virtual server. F5 rates the flaw 9.8 out of 10 under CVSS v3.1, and CISA added it to the Known Exploited Vulnerabilities catalog on September 22.\u003c/p\u003e\n\n\u003cp\u003eRestricting the BIG-IP management interface does not protect against the flaw because malicious traffic is sent to the OAuth-facing virtual server; systems in Appliance mode are also vulnerable. F5 released engineering hotfixes for affected BIG-IP 17.1, 17.5, and 21.1 branches, and offers an iRule mitigation through support when patching cannot happen immediately. Organizations should also check for repeated invalid OAuth token requests, suspicious audit-log commands, and TMM crashes, while recognizing that F5 has not stated whether the hotfix removes any attacker access already established.\u003c/p\u003e\n"},{"n":4,"title":"Chinese Hackers Exploit Chrome-Windows Zero-Day Chain to Deploy CLEANGULP Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/chinese-hackers-exploit-chrome-windows.html","time":"08:29","priority":"MUST READ","score":95,"tldr":"Chinese-linked UTA0565 used a zero-day chain in Google Chrome and Windows to escape the browser sandbox and deploy CLEANGULP malware through phishing emails and fake websites targeting Asian government entities.","briefOverview":"\u003cp\u003eChinese threat actor UTA0565 exploited a chain of previously undisclosed flaws in Google Chrome and Microsoft Windows through fake websites on September 3 and 4, 2026. The chain combined CVE-2026-85046, CVE-2026-87491, and CVE-2026-85880 to bypass Chrome’s protective boundary and run code on victims’ computers. Volexity said the group posed as media organizations and an NGO, using multiple fake sites to deceive targets.\u003c/p\u003e\n\n\u003cp\u003eOne campaign sent Chinese- and English-language phishing emails to Asian government entities while impersonating the Center for American Progress and promoting support for Hong Kong activist Chow Hang-tung. The messages linked to imitation China Digital Times and CAP websites, which silently loaded the BlueMoon exploit kit and downloaded CLEANGULP as chrome_cleanup.exe. CLEANGULP can run commands, list processes, transfer files, and execute beacon object files, while communicating with the lookalike command-and-control domain thecovnresation[.]com. Volexity said BlueMoon’s use by multiple Chinese-linked groups suggests its core kit was shared, customized, and weaponized across the Chinese cyber-espionage community.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Chinese threat actor UTA0565 exploited a chain of Chrome and Windows zero-day vulnerabilities through fake websites on September 3 and 4, 2026.","The exploit chain combined CVE-2026-85046, CVE-2026-87491, and CVE-2026-85880 to escape Chrome’s sandbox and execute code on affected Windows systems.","Asian government entities received Chinese- and English-language phishing emails impersonating the Center for American Progress and urging support for Hong Kong activist Chow Hang-tung.","The fake sites chinadigitaltimes[.]top and americanprgoress[.]top loaded the BlueMoon exploit kit and downloaded the CLEANGULP malware as chrome_cleanup.exe.","CLEANGULP can run commands, list processes, upload and download files, and execute beacon object files, and it communicates with the hard-coded domain thecovnresation[.]com."],"insights":["UTA0565 used multiple impersonated websites rather than a single lure, a departure from previously documented attacks attributed to the group.","The campaign hid its exploit-delivery page in an invisible embedded webpage, allowing the visible fake sites to resemble legitimate China Digital Times and Center for American Progress pages.","CLEANGULP’s command-and-control domain, thecovnresation[.]com, was deliberately styled to resemble the legitimate media outlet theconversation[.]com.","Volexity reported that the same BlueMoon exploit kit has been adopted by multiple Chinese-linked threat actors, indicating that its core components were shared and customized across groups."],"referencedReports":[{"title":"Mind the Patch Gap Part 2: Fake Websites Used to Deploy Chrome \u0026 Windows 0-Day Exploits","url":"https://www.volexity.com/blog/2026/09/21/mind-the-patch-gap-part-2-fake-websites-used-to-deploy-chrome-windows-0-day-exploits/","publisher":"volexity","context":"The article relies on Volexity's technical analysis for details of UTA0565's fake websites, exploit chain, and CLEANGULP deployment.","category":"research","primary":true}],"body":"\u003cp\u003eChinese threat actor UTA0565 exploited a chain of previously undisclosed flaws in Google Chrome and Microsoft Windows through fake websites on September 3 and 4, 2026. The chain combined CVE-2026-85046, CVE-2026-87491, and CVE-2026-85880 to bypass Chrome’s protective boundary and run code on victims’ computers. Volexity said the group posed as media organizations and an NGO, using multiple fake sites to deceive targets.\u003c/p\u003e\n\n\u003cp\u003eOne campaign sent Chinese- and English-language phishing emails to Asian government entities while impersonating the Center for American Progress and promoting support for Hong Kong activist Chow Hang-tung. The messages linked to imitation China Digital Times and CAP websites, which silently loaded the BlueMoon exploit kit and downloaded CLEANGULP as chrome_cleanup.exe. CLEANGULP can run commands, list processes, transfer files, and execute beacon object files, while communicating with the lookalike command-and-control domain thecovnresation[.]com. Volexity said BlueMoon’s use by multiple Chinese-linked groups suggests its core kit was shared, customized, and weaponized across the Chinese cyber-espionage community.\u003c/p\u003e\n"},{"n":6,"title":"Novel supplychain.local Go worm appears","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/supplychain-local-memtensor-npm-pypi","time":"07:41","priority":"MUST READ","score":94,"tldr":"Compromised npm and PyPI packages are distributing supplychain.local, a cross-platform Go worm that runs when the packages are invoked, searches for publishing credentials and other secrets, and attempts to spread through npm/PyPI publishing and GitHub Actions workflows.","briefOverview":"\u003cp\u003eOn 23 September 2026, a threat actor published a novel supply-chain worm to npm package \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e version 0.1.21 and later and PyPI package \u003ccode\u003eMemoryOS\u003c/code\u003e version 2.0.34 and later. The article says both packages had substantial benign publishing histories and appear to have been compromised. The multiplatform Golang worm is tracked as \u003ccode\u003esupplychain.local\u003c/code\u003e, based on the threat actor’s name for its core Go module.\u003c/p\u003e\n\n\u003cp\u003eThe affected packages contain language-specific loaders that run a platform-specific binary named \u003ccode\u003esckit\u003c/code\u003e whenever the package is invoked, rather than at installation time. The binary supports Windows, Linux, and macOS on x86 and ARM systems, and the embedded configuration includes several \u003ccode\u003eskyleen.fr\u003c/code\u003e command-and-control domains. The malware searches for package-publishing credentials and other secrets, and contains functionality intended to spread through direct npm and PyPI publishing as well as GitHub Actions workflows that run after repository pushes.\u003c/p\u003e\n\n\u003cp\u003eThe malware includes JavaScript and Python stubs intended to make itself execute from additional infected repositories, including a JavaScript stub likely used through a post-installation script. It appears able to use \u003ccode\u003enpm publish\u003c/code\u003e, \u003ccode\u003enpm version patch\u003c/code\u003e, and \u003ccode\u003etwine upload\u003c/code\u003e with credentials taken from infected workstations or CI environments. At the time of writing, the article had not identified compromised public GitHub workflow files or public repositories containing the self-execution stubs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Versions 0.1.21 and later of the npm package @memtensor/memos-cloud-openclaw-plugin and versions 2.0.34 and later of the PyPI package MemoryOS were reported as containing a novel supply-chain worm tracked as supplychain.local.","The affected packages include loaders that run a platform-specific Golang binary named sckit whenever the package is invoked, rather than attempting execution during installation.","The malware includes code and templates intended to spread through direct npm and PyPI publishing and by adding GitHub Actions workflows that execute on repository pushes.","The malware searches for credentials and secrets including GitHub, GitLab, npm, PyPI, AWS, Hugging Face, Slack, Stripe, SendGrid, and HashiCorp Vault tokens.","Known command-and-control domains are skyleen.fr subdomains that resolved to 139.84.223.178."],"insights":["The malicious code is designed to execute when an affected package is used, not when it is installed, which means installation-only checks may not observe its execution behavior.","Both affected packages reportedly had substantial benign publishing histories, indicating the threat actor appears to have compromised existing packages rather than publishing newly created malicious ones.","The bundled sckit binary supports Windows, Linux, and macOS on both x86 and ARM systems, allowing the same package-based campaign to run across a broad range of developer and CI environments.","Although the malware contains templates for GitHub Actions workflows and package post-installation stubs, the article states that no compromised public GitHub workflow files or repositories containing those stubs had been identified at the time of writing.","The configuration embedded in the npm loader identifies multiple skyleen.fr command-and-control endpoints and sets its inventory root to the user’s home directory."],"referencedReports":[],"body":"\u003cp\u003eOn 23 September 2026, a threat actor published a novel supply-chain worm to npm package \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e version 0.1.21 and later and PyPI package \u003ccode\u003eMemoryOS\u003c/code\u003e version 2.0.34 and later. The article says both packages had substantial benign publishing histories and appear to have been compromised. The multiplatform Golang worm is tracked as \u003ccode\u003esupplychain.local\u003c/code\u003e, based on the threat actor’s name for its core Go module.\u003c/p\u003e\n\n\u003cp\u003eThe affected packages contain language-specific loaders that run a platform-specific binary named \u003ccode\u003esckit\u003c/code\u003e whenever the package is invoked, rather than at installation time. The binary supports Windows, Linux, and macOS on x86 and ARM systems, and the embedded configuration includes several \u003ccode\u003eskyleen.fr\u003c/code\u003e command-and-control domains. The malware searches for package-publishing credentials and other secrets, and contains functionality intended to spread through direct npm and PyPI publishing as well as GitHub Actions workflows that run after repository pushes.\u003c/p\u003e\n\n\u003cp\u003eThe malware includes JavaScript and Python stubs intended to make itself execute from additional infected repositories, including a JavaScript stub likely used through a post-installation script. It appears able to use \u003ccode\u003enpm publish\u003c/code\u003e, \u003ccode\u003enpm version patch\u003c/code\u003e, and \u003ccode\u003etwine upload\u003c/code\u003e with credentials taken from infected workstations or CI environments. At the time of writing, the article had not identified compromised public GitHub workflow files or public repositories containing the self-execution stubs.\u003c/p\u003e\n"},{"n":5,"title":"Critical Next.js ImageResponse Flaw Can Lead to Server Code Execution via Crafted SVG Input","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/critical-nextjs-imageresponse-flaw-can.html","time":"07:04","priority":"MUST READ","score":92,"tldr":"Next.js 16.2.0 through 16.3.5 has a critical ImageResponse flaw (CVE-2026-94545) that can enable server-side code execution when attacker-controlled input reaches generated SVG content on the Node.js runtime. Developers should upgrade to Next.js 16.3.6 immediately and prevent untrusted values from entering SVG content, attributes, or styles.","briefOverview":"\u003cp\u003eA critical vulnerability in Next.js ImageResponse, tracked as CVE-2026-94545, could allow attackers to run code on a server through specially crafted SVG-related input. It affects Next.js versions 16.2.0 through 16.3.5 when ImageResponse runs on the Node.js runtime, which is the default. The Edge version of ImageResponse and Next.js 15 are not affected.\u003c/p\u003e\n\n\u003cp\u003eImageResponse uses Vercel\u0026rsquo;s Satori library to turn image layouts into SVG before producing PNG social-preview images. Certain attacker-controlled values could reach Satori\u0026rsquo;s SVG output without proper escaping and be interpreted as SVG code rather than ordinary text, potentially reaching flaws in other unnamed dependencies and leading to code execution. Vercel fixed the issue in Next.js 16.3.6, while developers unable to upgrade are advised to keep untrusted values out of SVG content, attributes, and styles; as of September 23, no public exploitation or exploit code had been reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-94545 is a critical Next.js ImageResponse flaw that could allow server code execution when attacker-controlled values are included in generated SVG content, attributes, or styles.","The issue affects Next.js 16.2.0 through 16.3.5 when ImageResponse runs on the default Node.js runtime, while Next.js 15 and the Edge version of ImageResponse are not affected.","Vercel fixed the vulnerability in Next.js 16.3.6 and advises applications on the 16.2 line to upgrade to that version because no fixed 16.2 release was listed.","The underlying Satori issue allowed certain values to reach SVG output without proper escaping, so specially crafted input could be interpreted as SVG code rather than plain text.","As of September 23, The Hacker News found no public reports of active exploitation or public exploit code for the flaw."],"insights":["Standard dependency checks may miss this issue: npm audit did not flag the affected Next.js 16.3.5 version as of September 23, and the advisory was not yet in the GitHub Advisory Database or published as a CVE record.","The vulnerable Satori component is bundled inside Next.js, so checking a lockfile alone will not show it as a Next.js dependency; applications need to verify their installed Next.js version directly.","Vercel did not state whether applications hosted on its platform are protected, unlike its messaging for two critical Next.js flaws fixed in August.","The advisory provides no method to determine whether an affected image-generation route was abused before patching, and recommends keeping untrusted values out of SVG output if an upgrade must wait."],"referencedReports":[{"title":"Next.js Security Update: September 22, 2026","url":"https://nextjs.org/blog/nextjs-security-update-september-22-2026","publisher":"vercel","context":"Vercel's security update announces the fix for the critical Next.js ImageResponse issue in version 16.3.6.","category":"advisory","primary":true},{"title":"GHSA-vcvr-r3jv-pc5j","url":"https://github.com/vercel/next.js/security/advisories/GHSA-vcvr-r3jv-pc5j","publisher":"vercel","context":"The Next.js security advisory describes the affected versions, impact, and workaround for CVE-2026-94545.","category":"advisory","primary":true},{"title":"GHSA-wx4j-mvgx-mqwp","url":"https://github.com/vercel/satori/security/advisories/GHSA-wx4j-mvgx-mqwp","publisher":"satori","context":"Satori's advisory explains that improperly escaped values could be emitted as SVG code and recommends updating to Satori 0.33.5.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical vulnerability in Next.js ImageResponse, tracked as CVE-2026-94545, could allow attackers to run code on a server through specially crafted SVG-related input. It affects Next.js versions 16.2.0 through 16.3.5 when ImageResponse runs on the Node.js runtime, which is the default. The Edge version of ImageResponse and Next.js 15 are not affected.\u003c/p\u003e\n\n\u003cp\u003eImageResponse uses Vercel\u0026rsquo;s Satori library to turn image layouts into SVG before producing PNG social-preview images. Certain attacker-controlled values could reach Satori\u0026rsquo;s SVG output without proper escaping and be interpreted as SVG code rather than ordinary text, potentially reaching flaws in other unnamed dependencies and leading to code execution. Vercel fixed the issue in Next.js 16.3.6, while developers unable to upgrade are advised to keep untrusted values out of SVG content, attributes, and styles; as of September 23, no public exploitation or exploit code had been reported.\u003c/p\u003e\n"},{"n":8,"title":"UK Cybercrime Journal: Manchester Airport Group Breached by FulcrumSec","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/09/uk-cybercrime-journal-manchester.html","time":"09:00","priority":"SHOULD READ","score":85,"tldr":"Manchester Airports Group reportedly suffered a data-extortion breach affecting about 8.7 million customers after FulcrumSec allegedly used exposed Iterable API credentials in client-side JavaScript to steal 86 GB of data. Core aviation operations were unaffected, but the exposed customer information could enable targeted phishing and fraud.","briefOverview":"\u003cp\u003eManchester Airports Group (MAG), which operates Manchester Airport, London Stansted Airport, and East Midlands Airport, reported a data breach on 25 August 2026. The incident reportedly affected personal information belonging to about 8.7 million customers, largely from airport Wi-Fi sign-ups, parking, lounge, and Fast Track security booking services. MAG temporarily suspended its online Manage My Booking service, while stating that passenger safety, aviation security, and flight operations continued normally.\u003c/p\u003e\n\n\u003cp\u003eFulcrumSec claimed the breach on 30 August and told BleepingComputer it had stolen about 86 GB of data. The group alleged that it accessed airport-specific Iterable API credentials exposed in client-side JavaScript and obtained nearly 200,000 records concerning travel planned for the rest of 2026. The article says that although payment-card information was not taken, information such as email addresses, phone numbers, postcodes, and vehicle registrations could be used for targeted email and text-message scams or identity fraud. It also highlights that separating customer-facing platforms from core operational systems limited disruption to airport operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Manchester Airports Group reported on 25 August 2026 that it had suffered a data breach affecting personal information from approximately 8.7 million customers.","The affected information was primarily collected through airport Wi-Fi sign-ups, car parking, airport lounge, and Fast Track security booking services.","MAG temporarily suspended its online \"Manage My Booking\" service, while stating that passenger safety, aviation security, and flight operations were not compromised.","FulcrumSec claimed responsibility on 30 August and said it stole approximately 86 GB of data by using airport-specific Iterable API credentials exposed in client-side JavaScript.","The article says the stolen information could support targeted phishing text and email scams as well as identity theft fraud."],"insights":["Customer-facing services such as Wi-Fi portals, parking, lounge bookings, and Fast Track reservations can hold substantial personal data even when they are separate from core airport operations.","Segregating ancillary web platforms from aviation and operational systems allowed MAG to suspend its booking portal without disrupting flight operations, passenger safety, or aviation security.","The alleged exposure of Iterable API credentials in client-side JavaScript reflects a technique the article says FulcrumSec also used against Arup Group, making continuous reviews of web application code especially important.","MAG’s public guidance about what information was and was not taken may reduce fraud risk by warning customers before criminals use the data for scams."],"referencedReports":[],"body":"\u003cp\u003eManchester Airports Group (MAG), which operates Manchester Airport, London Stansted Airport, and East Midlands Airport, reported a data breach on 25 August 2026. The incident reportedly affected personal information belonging to about 8.7 million customers, largely from airport Wi-Fi sign-ups, parking, lounge, and Fast Track security booking services. MAG temporarily suspended its online Manage My Booking service, while stating that passenger safety, aviation security, and flight operations continued normally.\u003c/p\u003e\n\n\u003cp\u003eFulcrumSec claimed the breach on 30 August and told BleepingComputer it had stolen about 86 GB of data. The group alleged that it accessed airport-specific Iterable API credentials exposed in client-side JavaScript and obtained nearly 200,000 records concerning travel planned for the rest of 2026. The article says that although payment-card information was not taken, information such as email addresses, phone numbers, postcodes, and vehicle registrations could be used for targeted email and text-message scams or identity fraud. It also highlights that separating customer-facing platforms from core operational systems limited disruption to airport operations.\u003c/p\u003e\n"},{"n":2,"title":"Ryuk ransomware member sentenced to 24 months in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ryuk-ransomware-member-sentenced-to-24-months-in-prison/","time":"08:20","priority":"MAY READ","score":72,"tldr":"Armenian national Karen Serobovich Vardanyan, an initial-access specialist for the Ryuk ransomware operation, was sentenced in the United States to 24 months in prison and three years of supervised release. He helped compromise U.S. organizations in 2019–2020, with the group receiving roughly 1,610 BTC in ransom payments.","briefOverview":"\u003cp\u003eArmenian national Karen Serobovich Vardanyan, also known online as “Maneeken” and “Karl Lagerfeld,” was sentenced to 24 months in prison and three years of supervised release for his role in Ryuk ransomware attacks against U.S. organizations. Vardanyan, who specialized in gaining initial access to corporate networks, pleaded guilty in July after his extradition from Kyiv, Ukraine, following an April 2025 arrest. Court documents say he and accomplices compromised multiple U.S. organizations between March 2019 and about June 2020, deploying ransomware on hundreds of servers and workstations.\u003c/p\u003e\n\n\u003cp\u003eOne targeted Michigan company paid 200 BTC, worth more than \u003cspan class=\"math inline\"\u003e\\(1.1 million at the time, and prosecutors also cited breaches of a Texas school and a technology company in Wilsonville, Oregon. The group allegedly received about 1,610 BTC in ransom payments from victims, valued at more than \\)\u003c/span\u003e15 million when paid. Ryuk was active from August 2018 to mid-2020 and became especially known for attacks against healthcare organizations during the COVID-19 pandemic; after it shut down, the Wizard Spider group behind it shifted to Conti ransomware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Karen Serobovich Vardanyan, an Armenian national linked to the Ryuk ransomware operation, was sentenced to 24 months in prison and three years of supervised release in the United States.","Vardanyan pleaded guilty in July after being extradited from Kyiv, Ukraine, following his April 2025 arrest.","Court documents state that Vardanyan and accomplices compromised multiple U.S. organizations between March 2019 and about June 2020 and deployed ransomware on hundreds of servers and workstations.","One Michigan company paid 200 BTC, worth more than $1.1 million at the time, while a Texas school and a technology company in Wilsonville, Oregon, were also breached.","Prosecutors said Vardanyan and his co-conspirators received approximately 1,610 BTC in ransom payments, valued at more than $15 million when paid."],"insights":["Vardanyan’s stated role was gaining initial access to corporate networks, underscoring that the Ryuk operation involved specialized roles rather than a single actor conducting every stage.","Although Ryuk operated from August 2018 to mid-2020, its operators reportedly collected more than $150 million in ransoms at their peak while compromising about 20 victims each week.","Ryuk’s shutdown did not end the associated criminal activity: the Wizard Spider group moved to Conti, which later fragmented into smaller units after its chats and source code leaked in 2022.","The reported victims included both private companies and a school, while Ryuk also became known for targeting healthcare organizations during the COVID-19 pandemic."],"referencedReports":[],"body":"\u003cp\u003eArmenian national Karen Serobovich Vardanyan, also known online as “Maneeken” and “Karl Lagerfeld,” was sentenced to 24 months in prison and three years of supervised release for his role in Ryuk ransomware attacks against U.S. organizations. Vardanyan, who specialized in gaining initial access to corporate networks, pleaded guilty in July after his extradition from Kyiv, Ukraine, following an April 2025 arrest. Court documents say he and accomplices compromised multiple U.S. organizations between March 2019 and about June 2020, deploying ransomware on hundreds of servers and workstations.\u003c/p\u003e\n\n\u003cp\u003eOne targeted Michigan company paid 200 BTC, worth more than \u003cspan class=\"math inline\"\u003e\\(1.1 million at the time, and prosecutors also cited breaches of a Texas school and a technology company in Wilsonville, Oregon. The group allegedly received about 1,610 BTC in ransom payments from victims, valued at more than \\)\u003c/span\u003e15 million when paid. Ryuk was active from August 2018 to mid-2020 and became especially known for attacks against healthcare organizations during the COVID-19 pandemic; after it shut down, the Wizard Spider group behind it shifted to Conti ransomware.\u003c/p\u003e\n"},{"n":7,"title":"Gemini’s Breakout Is a Reminder the Basics Still Matter","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/geminis-breakout-is-a-reminder-the-basics-still-matter","time":"08:12","priority":"MAY READ","score":56,"tldr":"Gemini’s accidental access to real organizations during a security test shows that agentic AI can rapidly exploit ordinary security gaps such as guessable passwords and exposed credentials. Organizations need strong credential hygiene, least-privilege access, and real-time controls that can stop risky agent actions before they execute.","briefOverview":"\u003cp\u003eDuring a May capture-the-flag exercise conducted by Israeli security firm Irregular, Google’s Gemini reached three real organizations through an unintended connection to the open internet. Google said the model accessed one organization by guessing a password and the other two using credentials exposed in a public repository. Gemini stopped when it recognized the targets were real, and Google said there was no lasting damage; it has since worked with Irregular to strengthen the test environment.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the incident did not require novel forms of access, but instead relied on familiar weaknesses such as weak passwords, exposed secrets, credentials that do not expire, and access that was not revoked. Agentic AI can find and act on these weaknesses continuously and at machine speed, reducing the time between exposure and misuse. The article recommends expiring credentials, multi-factor authentication, secret rotation, least-privilege access, real-time monitoring of agent actions, and the ability to stop an agent or a specific action immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["During a capture-the-flag exercise run by Israeli security firm Irregular, Google’s Gemini reached three real organizations through an unintended connection to the open internet.","Google said Gemini accessed one organization by guessing a password and the other two using credentials found in a public repository, then stopped when it recognized the targets were real.","The article argues that the incident relied on familiar security weaknesses, including weak passwords, exposed secrets, and overly broad or unrevoked access.","The article says organizations should use expiring credentials, multi-factor authentication, secret rotation, least-privilege access, real-time monitoring, and the ability to stop risky agent actions.","Netskope’s AI Risk and Readiness Report states that 91% of organizations cannot stop a risky agent action before it executes."],"insights":["The Gemini incident suggests that agentic AI can turn security weaknesses that might once have remained unnoticed until an audit into near-immediate exposure because it can continuously test what it can access.","A leaked credential does not need to appear unusual or valuable to an agent; the article says the agent only needs to find that it works and can try it as soon as it is available.","The article distinguishes written policies from controls that operate at the moment an agent acts, emphasizing that organizations need the ability to observe and halt a specific action in real time.","The examples cited in the article point to a shared pattern across different AI agents: credentials with more access than intended can be discovered and used by systems that do not stop searching."],"referencedReports":[{"title":"AI Risk and Readiness Report","url":"https://www.netskope.com/resources/reports-guides/ai-risk-and-readiness-report","publisher":"netskope","context":"The article cites the report’s finding that 91% of organizations cannot stop a risky agent action before it executes.","category":"research","primary":false}],"body":"\u003cp\u003eDuring a May capture-the-flag exercise conducted by Israeli security firm Irregular, Google’s Gemini reached three real organizations through an unintended connection to the open internet. Google said the model accessed one organization by guessing a password and the other two using credentials exposed in a public repository. Gemini stopped when it recognized the targets were real, and Google said there was no lasting damage; it has since worked with Irregular to strengthen the test environment.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the incident did not require novel forms of access, but instead relied on familiar weaknesses such as weak passwords, exposed secrets, credentials that do not expire, and access that was not revoked. Agentic AI can find and act on these weaknesses continuously and at machine speed, reducing the time between exposure and misuse. The article recommends expiring credentials, multi-factor authentication, secret rotation, least-privilege access, real-time monitoring of agent actions, and the ability to stop an agent or a specific action immediately.\u003c/p\u003e\n"}]</script>
