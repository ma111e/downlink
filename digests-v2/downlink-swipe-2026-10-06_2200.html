<script type="application/json" id="dl-articles">[{"n":2,"title":"Threat groups ramp up social-engineering attacks against healthcare sector","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/threat-groups-ramp-up-social-engineering-attacks-against-healthcare-sector/","time":"22:13","priority":"SHOULD READ","score":78,"tldr":"Healthcare and pharmaceutical organizations face increased social-engineering risk as ShinyHunters and related cybercrime actors use aggressive voice-phishing and medical-themed impersonation domains to steal employee credentials.","briefOverview":"\u003cp\u003eHealthcare and pharmaceutical organizations are facing a heightened risk of social-engineering attacks, according to cybersecurity researchers and threat intelligence experts. Health-ISAC warned that ShinyHunters has been using voice-phishing campaigns against the healthcare sector. The group used medical-themed impersonation domains to trick healthcare employees into exposing credentials.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, said that more than a dozen member organizations had been targeted by social-engineering attacks over the past couple of months. The actors are described as aggressive and persistent in trying to get someone on the phone. They seek to convince employees to click on password-reset or multifactor-authentication reset requests, potentially compromising targeted companies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Healthcare and pharmaceutical organizations face an elevated risk of social-engineering attacks, according to cybersecurity researchers and threat intelligence experts.","Health-ISAC warned that ShinyHunters has used voice-phishing campaigns and medical-themed impersonation domains to target healthcare employees.","The attackers aim to trick employees into disclosing their credentials, including through password-reset or multifactor-authentication reset requests.","Errol Weiss, Health-ISAC’s chief security officer, said that more than a dozen member organizations had been targeted by social-engineering attacks over the previous couple of months.","The actors use aggressive tactics to persuade targeted employees to take actions that could compromise their organizations."],"insights":["The campaign relies on phone calls rather than only deceptive websites or messages, with callers pressing employees to approve password or multifactor-authentication resets.","Medical-themed impersonation domains make the credential-theft effort more tailored to healthcare workers.","The activity appears broad within the Health-ISAC community, as more than a dozen member organizations were targeted over a period of months."],"referencedReports":[{"title":"Urgent Threat Alert: ShinyHunters Vishing Campaigns and Domain Impersonation","url":"https://health-isac.org/urgent-threat-alert-shinyhunters-vishing-campaigns-and-domain-impersonation/","publisher":"health-isac","context":"The article cites this Health-ISAC warning about ShinyHunters using voice-phishing and medical-themed impersonation domains against healthcare organizations.","category":"advisory","primary":true}],"body":"\u003cp\u003eHealthcare and pharmaceutical organizations are facing a heightened risk of social-engineering attacks, according to cybersecurity researchers and threat intelligence experts. Health-ISAC warned that ShinyHunters has been using voice-phishing campaigns against the healthcare sector. The group used medical-themed impersonation domains to trick healthcare employees into exposing credentials.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, said that more than a dozen member organizations had been targeted by social-engineering attacks over the past couple of months. The actors are described as aggressive and persistent in trying to get someone on the phone. They seek to convince employees to click on password-reset or multifactor-authentication reset requests, potentially compromising targeted companies.\u003c/p\u003e\n"},{"n":1,"title":"How Aikido helps you meet SOC 2 Type 1 and Type 2","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/soc-2-compliance-type-1-and-type-2","time":"00:00","priority":"MAY READ","score":25,"tldr":"Aikido Security positions its continuous scanning, remediation tracking, CI/CD gates, and cloud posture checks as a way to generate audit evidence for SOC 2 controls. It emphasizes setting up these controls early for SOC 2 Type 2, which requires proof that controls operated effectively over time.","briefOverview":"\u003cp\u003eThe article explains how Aikido Security can help organizations collect evidence for SOC 2 audits through its application and cloud-security platform. SOC 2 Type 1 evaluates whether controls are properly designed at a specific point in time, while Type 2 evaluates whether those controls worked effectively over a period, typically three to 12 months. The article emphasizes that Type 2 requires sustained records such as logs, timestamps, and remediation history rather than one-time configuration screenshots.\u003c/p\u003e\n\n\u003cp\u003eAikido combines code, dependency, secret, container, infrastructure, cloud, malware, and application testing capabilities with remediation workflows and SLA tracking. It maps these capabilities to SOC 2 areas including access controls, boundary protection, encryption, software integrity, monitoring, vulnerability management, change management, risk assessment, and availability. The article says CI/CD gates can block pull requests or releases based on defined issue-severity thresholds and retain auditable records of gate decisions, overrides, and exceptions.\u003c/p\u003e\n\n\u003cp\u003eThe article advises teams pursuing Type 1 with a near-term Type 2 goal to enable continuous scanning and SLA tracking before the formal audit period starts. It notes that Aikido alone cannot pass an audit, because auditors also require policies, procedures, risk assessments, access reviews, and incident-response processes. Its central claim is that a unified platform can reduce the effort of producing exportable evidence showing that security controls continuously detected and addressed issues during the audit window.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SOC 2 Type 1 assesses whether controls are appropriately designed at a specific point in time, while Type 2 evaluates whether controls operated effectively over a period typically lasting three to 12 months.","Aikido Security combines code, dependency, secret, container, infrastructure, cloud, malware, and application testing capabilities in one platform with remediation workflows and SLA tracking.","Continuous scanning and dated remediation records can provide Type 2 audit evidence showing that vulnerability-management controls operated throughout the audit period.","Aikido's CI/CD and source-control checks can block pull requests, builds, or releases when newly introduced issues meet an organization-defined severity threshold.","The article states that Aikido alone cannot pass a SOC 2 audit, because auditors also require policies, procedures, risk assessments, access reviews, and incident-response processes."],"insights":["Teams preparing first for SOC 2 Type 1 should enable continuous scanning and remediation tracking before the Type 2 audit period begins, because evidence not captured during that period cannot be recreated later.","A vulnerability-management program can prioritize issues using whether vulnerable code is reachable or demonstrably exploitable in the company’s environment, rather than treating every dependency finding equally.","Pull-request and release gates can serve as change-management evidence when their decisions, exceptions, and overrides are retained in an auditable record.","Availability requirements are separate from the common criteria in SOC 2, so cloud backup-integrity checks can support availability evidence specifically."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how Aikido Security can help organizations collect evidence for SOC 2 audits through its application and cloud-security platform. SOC 2 Type 1 evaluates whether controls are properly designed at a specific point in time, while Type 2 evaluates whether those controls worked effectively over a period, typically three to 12 months. The article emphasizes that Type 2 requires sustained records such as logs, timestamps, and remediation history rather than one-time configuration screenshots.\u003c/p\u003e\n\n\u003cp\u003eAikido combines code, dependency, secret, container, infrastructure, cloud, malware, and application testing capabilities with remediation workflows and SLA tracking. It maps these capabilities to SOC 2 areas including access controls, boundary protection, encryption, software integrity, monitoring, vulnerability management, change management, risk assessment, and availability. The article says CI/CD gates can block pull requests or releases based on defined issue-severity thresholds and retain auditable records of gate decisions, overrides, and exceptions.\u003c/p\u003e\n\n\u003cp\u003eThe article advises teams pursuing Type 1 with a near-term Type 2 goal to enable continuous scanning and SLA tracking before the formal audit period starts. It notes that Aikido alone cannot pass an audit, because auditors also require policies, procedures, risk assessments, access reviews, and incident-response processes. Its central claim is that a unified platform can reduce the effort of producing exportable evidence showing that security controls continuously detected and addressed issues during the audit window.\u003c/p\u003e\n"}]</script>
