<script type="application/json" id="dl-articles">[{"n":1,"title":"\"City-Forum\" data-theft attacks target Salesforce, ServiceNow portals","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/city-forum-data-theft-attacks-target-salesforce-servicenow-portals/","time":"23:07","priority":"MUST READ","score":92,"tldr":"A campaign dubbed City-Forum is stealing data from misconfigured Salesforce Experience Cloud and ServiceNow customer portals that expose records to unauthenticated guest users. The activity is ongoing and appears to come from a single long-running Contabo-hosted IP, with defenders urged to lock down guest access, public APIs, self-registration, and portal search sources.","briefOverview":"\u003cp\u003eAn ongoing data theft campaign dubbed City-Forum is using custom tools to steal data exposed to anonymous users through Salesforce Experience Cloud and ServiceNow customer portals. SaaS security firm Reco traced the campaign to a single server that has targeted organizations worldwide, including telecommunications companies, banks and financial services firms, enterprise software vendors, security and data privacy companies, and public-sector portals. Reco says the attacks are ongoing and that activity continues to increase.\u003c/p\u003e\n\n\u003cp\u003eReco says the attacks originate from the IP address \u003ccode\u003e158.220.87.79\u003c/code\u003e, hosted by German VPS provider Contabo, and usually use the default \u003ccode\u003eGo-http-client/1.1\u003c/code\u003e user agent when downloading data. The campaign is not exploiting a vulnerability in Salesforce or ServiceNow, but is abusing data that organizations have mistakenly exposed to unauthenticated guest users through overly permissive sharing rules, permissions, or portal configurations. The same infrastructure and fingerprint have been observed against both Salesforce and ServiceNow environments across multiple organizations.\u003c/p\u003e\n\n\u003cp\u003eOn Salesforce, the attacker targets older Aura endpoints such as \u003ccode\u003e/aura\u003c/code\u003e or \u003ccode\u003e/s/sfsites/aura\u003c/code\u003e, invokes \u003ccode\u003eHostConfigController.getConfigData\u003c/code\u003e to enumerate objects, and uses \u003ccode\u003eSelectableListDataProviderController.getItems\u003c/code\u003e to retrieve records. The attacker also targets newer Lightning Web Runtime sites through GraphQL requests to \u003ccode\u003e/webruntime/api/services/data/{version}/graphql\u003c/code\u003e, and checks \u003ccode\u003e/SiteRegister\u003c/code\u003e and \u003ccode\u003e/CommunitiesSelfReg\u003c/code\u003e for self-registration. On ServiceNow, the attacker targets \u003ccode\u003ePOST /api/now/sp/search?sysparm_cancelable=true\u003c/code\u003e, and Reco advises administrators to review guest access, public APIs, self-registration, and exposed portal search sources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Reco says an ongoing data theft campaign dubbed City-Forum is using custom tools to steal data exposed to anonymous users through Salesforce Experience Cloud and ServiceNow customer portals.","The attacks have been traced to the IP address 158.220.87.79, hosted by German VPS provider Contabo and associated with the city-forum.com domain since at least March 2025.","Reco says the campaign is not exploiting vulnerabilities in Salesforce or ServiceNow, but is abusing overly permissive guest-user sharing rules, permissions, or portal configurations.","On Salesforce, the attacker targets Aura endpoints and newer Lightning Web Runtime sites to enumerate and retrieve records exposed to guest accounts.","On ServiceNow, the attacker targets the POST /api/now/sp/search?sysparm_cancelable=true endpoint to search Service Portals that allow guest access to data."],"insights":["Reco observed the same fingerprint across both Salesforce and ServiceNow environments, suggesting defenders can look for the combination of IP address 158.220.87.79 and the default Go-http-client/1.1 user agent across multiple portal platforms.","The campaign includes Salesforce Lightning Web Runtime sites through GraphQL requests to the webruntime API, a technique Reco says it has not seen in public attack tools such as AuraInspector, S-RET, or CirrusGo.","Disabling the Experience Builder option that allows guest users to access public APIs can block several Salesforce API endpoints used for data enumeration and theft when guest API access is not required.","ServiceNow transaction logs do not record the POST body for the targeted portal search endpoint, so defenders may be able to see that automated searches occurred and how much data was returned but not the exact search terms used."],"referencedReports":[{"title":"City-Forum campaign targeting Salesforce and ServiceNow","url":"https://www.reco.ai/blog/city-forum-campaign-salesforce-servicenow","publisher":"Reco","context":"The article cites Reco's research as the source for details on the City-Forum data theft campaign targeting Salesforce and ServiceNow portals.","category":"research","primary":true}],"body":"\u003cp\u003eAn ongoing data theft campaign dubbed City-Forum is using custom tools to steal data exposed to anonymous users through Salesforce Experience Cloud and ServiceNow customer portals. SaaS security firm Reco traced the campaign to a single server that has targeted organizations worldwide, including telecommunications companies, banks and financial services firms, enterprise software vendors, security and data privacy companies, and public-sector portals. Reco says the attacks are ongoing and that activity continues to increase.\u003c/p\u003e\n\n\u003cp\u003eReco says the attacks originate from the IP address \u003ccode\u003e158.220.87.79\u003c/code\u003e, hosted by German VPS provider Contabo, and usually use the default \u003ccode\u003eGo-http-client/1.1\u003c/code\u003e user agent when downloading data. The campaign is not exploiting a vulnerability in Salesforce or ServiceNow, but is abusing data that organizations have mistakenly exposed to unauthenticated guest users through overly permissive sharing rules, permissions, or portal configurations. The same infrastructure and fingerprint have been observed against both Salesforce and ServiceNow environments across multiple organizations.\u003c/p\u003e\n\n\u003cp\u003eOn Salesforce, the attacker targets older Aura endpoints such as \u003ccode\u003e/aura\u003c/code\u003e or \u003ccode\u003e/s/sfsites/aura\u003c/code\u003e, invokes \u003ccode\u003eHostConfigController.getConfigData\u003c/code\u003e to enumerate objects, and uses \u003ccode\u003eSelectableListDataProviderController.getItems\u003c/code\u003e to retrieve records. The attacker also targets newer Lightning Web Runtime sites through GraphQL requests to \u003ccode\u003e/webruntime/api/services/data/{version}/graphql\u003c/code\u003e, and checks \u003ccode\u003e/SiteRegister\u003c/code\u003e and \u003ccode\u003e/CommunitiesSelfReg\u003c/code\u003e for self-registration. On ServiceNow, the attacker targets \u003ccode\u003ePOST /api/now/sp/search?sysparm_cancelable=true\u003c/code\u003e, and Reco advises administrators to review guest access, public APIs, self-registration, and exposed portal search sources.\u003c/p\u003e\n"},{"n":2,"title":"Android malware combo takes out loans and relays victims' credit cards","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/android-malware-combo-takes-out-loans-and-relays-victims-credit-cards/","time":"22:22","priority":"SHOULD READ","score":82,"tldr":"Attackers are combining the SpyNote Android RAT with new WindRelay NFC malware to remotely control victims’ phones, take out loans, and relay live payment card data for fraudulent transactions. The attack relies heavily on phone-based social engineering, including convincing victims to sideload an app, grant permissions, tap their card to the phone, and enter their PIN.","briefOverview":"\u003cp\u003eA new Android NFC relay malware called WindRelay is being used together with the SpyNote remote administration tool to steal card data and send it to attackers in real time. In an incident investigated by Group-IB, a fraudster impersonated a bank employee and convinced the victim to sideload SpyNote disguised as a legitimate app. The attacker also had the victim grant Accessibility Service permissions, giving remote access to the Android device.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access through SpyNote, the attacker installed WindRelay without further interaction from the victim and used the banking app to take out a loan in the victim’s name. The victim was then instructed to tap their payment card on the phone and enter their PIN. WindRelay turned the phone into a fraudulent contactless reader and relayed the live NFC exchange, including transaction-specific authentication data, to the attacker’s device for purchases at a genuine payment terminal.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB said the entire activity occurred during a 13-minute phone call, and transactions were approved using the PIN provided by the victim. The researchers said the combination may indicate a toolkit that provides both access to a victim’s device for banking transactions and a direct cash-out channel. Group-IB identified almost two dozen WindRelay samples submitted to VirusTotal between November 2025 and July 2026, with apparent targeting focused on Czechia, Slovakia, and Slovenia.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new Android NFC relay malware called WindRelay is being used with the SpyNote remote administration tool to steal card data and send it to attackers in real time.","In an incident investigated by Group-IB, a fraudster impersonated a bank employee, convinced the victim to sideload SpyNote disguised as a legitimate app, and obtained Accessibility Service permissions for remote access to the Android device.","After gaining remote access, the attacker installed WindRelay, used the victim’s banking app to take out a loan in the victim’s name, and instructed the victim to tap their payment card on the phone and enter their PIN.","Group-IB said the activity occurred during a 13-minute phone call, and the transactions were approved using the PIN provided by the victim.","Group-IB identified almost two dozen WindRelay samples submitted to VirusTotal between November 2025 and July 2026, with targeting appearing focused on Czechia, Slovakia, and Slovenia."],"insights":["The combination of SpyNote and WindRelay gives attackers both remote access to a victim’s banking app and a direct way to cash out through relayed card transactions.","The attack did not require the victim to interact with WindRelay directly after SpyNote was installed, because the attacker used remote access to install WindRelay without further victim interaction.","The fraud succeeded without relying on modern malware features such as live screen sharing or VNC, showing that phone-based social engineering alone was enough to guide the victim through the theft.","Personalizing the malicious app label with the victim’s name was used to make the fake app appear more credible during the social engineering call.","A practical defensive step from the article is to hang up on urgent bank calls and call the official number from the organization’s website before taking any requested action."],"referencedReports":[],"body":"\u003cp\u003eA new Android NFC relay malware called WindRelay is being used together with the SpyNote remote administration tool to steal card data and send it to attackers in real time. In an incident investigated by Group-IB, a fraudster impersonated a bank employee and convinced the victim to sideload SpyNote disguised as a legitimate app. The attacker also had the victim grant Accessibility Service permissions, giving remote access to the Android device.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access through SpyNote, the attacker installed WindRelay without further interaction from the victim and used the banking app to take out a loan in the victim’s name. The victim was then instructed to tap their payment card on the phone and enter their PIN. WindRelay turned the phone into a fraudulent contactless reader and relayed the live NFC exchange, including transaction-specific authentication data, to the attacker’s device for purchases at a genuine payment terminal.\u003c/p\u003e\n\n\u003cp\u003eGroup-IB said the entire activity occurred during a 13-minute phone call, and transactions were approved using the PIN provided by the victim. The researchers said the combination may indicate a toolkit that provides both access to a victim’s device for banking transactions and a direct cash-out channel. Group-IB identified almost two dozen WindRelay samples submitted to VirusTotal between November 2025 and July 2026, with apparent targeting focused on Czechia, Slovakia, and Slovenia.\u003c/p\u003e\n"},{"n":3,"title":"What Does Preemptive Defense Look Like Inside an AI SOC?","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/blog/preemptive-defense-ai-soc/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=preemptive-defense-ai-soc","time":"22:31","priority":"MAY READ","score":35,"tldr":"Silent Push argues that AI-driven SOC workflows are only useful if they enrich alerts with preemptive infrastructure intelligence, not just reactive IOC feeds. Its pitch is that feeding agents IOFA and Context Graph data can help defenders identify staged adversary infrastructure before attacks launch.","briefOverview":"\u003cp\u003eSilent Push argues that AI-assisted SOC workflows can move quickly but risk producing faster wrong answers if they rely on stale or reactive data. The article says many SOCs are using copilots and agents to triage alerts, pull context, enrich indicators, and draft investigation summaries. Its central point is that these tools need intelligence about adversary preparation activity, not only evidence of compromise after an attack has happened.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Silent Push Indicators of Future Attack as a way to map adversary infrastructure across DNS, IP ranges, behavioral fingerprints, and web content before a campaign deploys. It says the Silent Push MCP Server brings this intelligence into tools such as Claude and Cursor, allowing analysts or agents to ask plain-language questions without writing SPQL or using a separate console. The article also says the Context Graph provides clear data provenance and a queryable structure, with more than 200 API endpoints for automated enrichment.\u003c/p\u003e\n\n\u003cp\u003eSilent Push says its platform can feed existing SOC workflows through integrations with Splunk, Palo Alto XSOAR, Swimlane, Tines, ThreatConnect, Torq, and Sumo Logic. The article describes role-specific benefits for SOC managers, CTI analysts, IR leads, and CISOs, including earlier triage, infrastructure clustering, campaign scoping, and clearer explanations of what AI tools are reasoning over. It cites Silent Push’s identification of staging domains tied to Salt Typhoon in May 2025, before public reporting on the first intrusions emerged in July 2025, as an example of a two-month early-warning window.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI-assisted SOC workflows can produce faster wrong answers if they rely on stale or reactive data.","Silent Push says its Indicators of Future Attack map adversary infrastructure across DNS, IP ranges, behavioral fingerprints, and web content to surface staging infrastructure before campaigns deploy.","The Silent Push MCP Server lets analysts or agents ask plain-language questions about indicators, domains, or infrastructure patterns inside tools such as Claude and Cursor without writing SPQL or using a separate console.","Silent Push says its platform integrates with Splunk, Palo Alto XSOAR, Swimlane, Tines, ThreatConnect, Torq, and Sumo Logic so preemptive context can feed existing SIEM and SOAR workflows.","Silent Push says it identified staging domains tied to Salt Typhoon in May 2025, two months before public reporting on the first intrusions emerged in July 2025."],"insights":["The article’s central warning is that agentic SOC tools can amplify data-quality problems: automation does not just speed up analysis, it can also speed up incorrect conclusions when the underlying source is reactive or stale.","Silent Push frames the most important difference between IOC feeds and IOFA data as a timeline issue, arguing that the same enrichment workflow becomes more useful when it reasons over infrastructure before a campaign launches rather than after compromise evidence appears.","The MCP Server is positioned as a way to make preemptive threat intelligence usable by both analysts and AI agents without requiring them to learn Silent Push Query Language or leave tools such as Claude and Cursor.","The role-based section implies that the same preemptive infrastructure data can serve different SOC needs at once, from manager-level triage and CTI pivoting to incident scoping and CISO-level explainability of what AI tools are reasoning over.","The Salt Typhoon example is used to show that the practical value of preemptive defense is measured in lead time, with Silent Push claiming a two-month warning window before public reporting on the intrusions emerged."],"referencedReports":[],"body":"\u003cp\u003eSilent Push argues that AI-assisted SOC workflows can move quickly but risk producing faster wrong answers if they rely on stale or reactive data. The article says many SOCs are using copilots and agents to triage alerts, pull context, enrich indicators, and draft investigation summaries. Its central point is that these tools need intelligence about adversary preparation activity, not only evidence of compromise after an attack has happened.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Silent Push Indicators of Future Attack as a way to map adversary infrastructure across DNS, IP ranges, behavioral fingerprints, and web content before a campaign deploys. It says the Silent Push MCP Server brings this intelligence into tools such as Claude and Cursor, allowing analysts or agents to ask plain-language questions without writing SPQL or using a separate console. The article also says the Context Graph provides clear data provenance and a queryable structure, with more than 200 API endpoints for automated enrichment.\u003c/p\u003e\n\n\u003cp\u003eSilent Push says its platform can feed existing SOC workflows through integrations with Splunk, Palo Alto XSOAR, Swimlane, Tines, ThreatConnect, Torq, and Sumo Logic. The article describes role-specific benefits for SOC managers, CTI analysts, IR leads, and CISOs, including earlier triage, infrastructure clustering, campaign scoping, and clearer explanations of what AI tools are reasoning over. It cites Silent Push’s identification of staging domains tied to Salt Typhoon in May 2025, before public reporting on the first intrusions emerged in July 2025, as an example of a two-month early-warning window.\u003c/p\u003e\n"}]</script>
