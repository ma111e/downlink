 Next Gen SWG.","The new support covers both client-to-Netskope traffic and Netskope-to-destination-server traffic.","The feature is a tenant-level flag designed for controlled testing rather than a forced rollout.","Transaction events show post-quantum cryptography use so customers can verify when it is working.","The feature is available in commercial environments today, with support for FedRAMP (US), PBMM (Canada), Data Plane on-Premises, and Virtual Private Edge planned for future releases."],"insights":["Netskope is using a hybrid approach that keeps today’s elliptic-curve cryptography alongside a post-quantum method, so protection does not depend entirely on either method remaining unbroken.","The feature is positioned for gradual adoption because customers can enable it at the tenant level for controlled testing rather than being forced into an immediate migration.","The article treats post-quantum migration as especially urgent for organizations with long-lived sensitive data, because copied encrypted data could become readable later if quantum computers advance.","Netskope’s implementation is tied to its OpenSSL 3.5 upgrade, indicating the company is relying on native cryptographic library support rather than a separate add-on."],"referencedReports":[],"body":"\u003cp\u003eNetskope has added support for X25519MLKEM768 to Netskope One Next Gen SWG. The article says this is a hybrid key-exchange algorithm that pairs elliptic-curve cryptography with a post-quantum method. Netskope says this helps keep a connection protected even if one of the two approaches is broken in the future.\u003c/p\u003e\n\n\u003cp\u003eThe change is presented in the context of concerns that encrypted data captured today could be stored and decrypted later once capable quantum computers exist. The article highlights data with a long shelf life, such as health records, financial history, government communications, and trade secrets. It also notes that NIST finalized its first set of post-quantum cryptography standards in 2024, including ML-KEM.\u003c/p\u003e\n\n\u003cp\u003eThe new support covers both client-to-Netskope traffic and Netskope-to-destination-server traffic. Netskope says the feature is available in commercial environments today as a tenant-level feature flag for controlled testing, with transaction events showing post-quantum cryptography use. Support for FedRAMP (US), PBMM (Canada), Data Plane on-Premises, and Virtual Private Edge is planned for future releases.\u003c/p\u003e\n"}]</script>
