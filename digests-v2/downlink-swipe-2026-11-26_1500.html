<script type="application/json" id="dl-articles">[{"n":4,"title":"North Korea-Linked PolinRider Poisons Over 7,600 GitHub Repositories to Spread Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/north-korea-linked-polinrider-poisons.html","time":"15:13","priority":"MUST READ","score":93,"tldr":"North Korea-linked PolinRider has poisoned thousands of GitHub repositories with a Python loader that retrieves its payload and C2 details from Ethereum transactions, making takedowns difficult. The campaign uses stolen developer credentials and fake job-interview lures to compromise developer machines, silently alter repositories, and distribute infostealers and backdoors.","briefOverview":"\u003cp\u003eNorth Korea-linked PolinRider operators have planted a Python loader in GitHub repositories, with SafeDep identifying it in 375 public repositories across 260 accounts and Apiiro estimating at least 7,609 affected repositories owned by 2,330 accounts. The campaign uses stolen developer access, fake recruitment schemes, malicious packages, and compromised developer systems to inject harmful code into open-source projects. Some victims include Neutralinojs, InstaWP Connect, and fxhash. The activity may date back to February 2025.\u003c/p\u003e\n\n\u003cp\u003eThe loader hides in files such as small utils packages, conftest.py, build configuration, or VS Code auto-run tasks, and can run when a project is built, tested, or opened in Visual Studio Code. It reads Ethereum wallet transaction data, decodes it as JavaScript, and uses another wallet address to obtain the command-and-control server location, allowing attackers to redirect infected loaders through new blockchain transactions. Prior waves installed tools that collect environment secrets, browser passwords, cookies, and wallet data, while related npm package compromises delivered JADESNOW, InvisibleFerret, a Socket.IO RAT, and a Python-based stealer. Attackers also reportedly used force-pushes to remove visible malicious changes after 30 to 40 minutes, making the final repository history appear clean.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PolinRider operators planted a Python loader in GitHub repositories that reads Ethereum transaction data, runs the decoded JavaScript with Node.js, and obtains command-server information from another wallet.","Apiiro estimated that PolinRider was present in at least 7,609 GitHub repositories owned by 2,330 accounts, with the loader pushed to 2,040 repositories between October 27 and November 6, 2026.","The campaign is linked to North Korean threat actors and uses fake recruitment sites, malicious packages, compromised developer machines, and stolen GitHub tokens to distribute harmful code.","The loader can be concealed in files such as a small utils package, conftest.py, build configuration, or VS Code auto-run tasks, and it may execute when a project is built or simply opened in VS Code.","Researchers found evidence of related PolinRider activity dating to February 2025, including poisoned npm packages that delivered JADESNOW, InvisibleFerret, a Socket.IO RAT, and a Python-based stealer."],"insights":["PolinRider uses Ethereum wallet transactions to store both code and server-location information, allowing operators to redirect already-infected loaders by making a new blockchain transaction rather than replacing code in every repository.","Attackers reportedly force-pushed malicious commits away after only 30 to 40 minutes, leaving the final visible code changes clean while preserving the chance that developers had already run the harmful code.","In the newest wave, merely opening an infected project folder in Visual Studio Code can trigger the loader, rather than requiring a developer to explicitly run a build command.","The campaign’s fabricated wallet addresses include the repeated text \"helloipbot!!,\" which is used to encode the command server’s IP address in the beginning of the address.","Evidence from blockchain records and poisoned npm packages indicates related activity began as early as February 2025, months before the earliest previously documented victims."],"referencedReports":[{"title":"PolinRider Python Loader Uses Ethereum Calldata","url":"https://safedep.io/blog/polinrider-python-loader-ethereum-calldata","publisher":"safedep","context":"SafeDep’s report describes a Python loader hidden in GitHub repositories that retrieves JavaScript and command-server details through Ethereum transactions.","category":"research","primary":true},{"title":"Web3 Cloud Supply Chain Attacks","url":"https://unit42.paloaltonetworks.com/web3-cloud-supply-chain-attacks/","publisher":"palo-alto-networks-unit-42","context":"The article cites Unit 42’s report for its assessment that North Korean actors use open-source registries as an initial access route into corporate environments.","category":"research","primary":false},{"title":"PolinRider Ethereum C2 GitHub Repositories","url":"https://safedep.io/polinrider-ethereum-c2-github-repositories/","publisher":"safedep","context":"SafeDep’s technical analysis explains the NullReceiver method and the wallet-address marker used to encode command-server information.","category":"research","primary":true},{"title":"PolinRider North Korea Worm Forged GitHub Commits","url":"https://apiiro.com/blog/polinrider-north-korea-worm-forged-github-commits","publisher":"apiiro","context":"Apiiro’s analysis provides estimates of affected GitHub repositories and describes forged commits, hidden loaders, and force-push behavior.","category":"research","primary":true},{"title":"PolinRider Malware Found in 2025 npm Packages","url":"https://opensourcemalware.com/blog/polinrider-malware-found-in-2025-npm-packages","publisher":"opensourcemalware","context":"OpenSourceMalware’s analysis documents related poisoned npm packages from 2025 and traces blockchain evidence of activity back to February 2025.","category":"research","primary":true}],"body":"\u003cp\u003eNorth Korea-linked PolinRider operators have planted a Python loader in GitHub repositories, with SafeDep identifying it in 375 public repositories across 260 accounts and Apiiro estimating at least 7,609 affected repositories owned by 2,330 accounts. The campaign uses stolen developer access, fake recruitment schemes, malicious packages, and compromised developer systems to inject harmful code into open-source projects. Some victims include Neutralinojs, InstaWP Connect, and fxhash. The activity may date back to February 2025.\u003c/p\u003e\n\n\u003cp\u003eThe loader hides in files such as small utils packages, conftest.py, build configuration, or VS Code auto-run tasks, and can run when a project is built, tested, or opened in Visual Studio Code. It reads Ethereum wallet transaction data, decodes it as JavaScript, and uses another wallet address to obtain the command-and-control server location, allowing attackers to redirect infected loaders through new blockchain transactions. Prior waves installed tools that collect environment secrets, browser passwords, cookies, and wallet data, while related npm package compromises delivered JADESNOW, InvisibleFerret, a Socket.IO RAT, and a Python-based stealer. Attackers also reportedly used force-pushes to remove visible malicious changes after 30 to 40 minutes, making the final repository history appear clean.\u003c/p\u003e\n"},{"n":1,"title":"Fake paid expert interviews impersonate brands to steal Google logins","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/apple/fake-paid-expert-interviews-impersonate-brands-to-steal-google-logins/","time":"17:15","priority":"SHOULD READ","score":84,"tldr":"The GoodGuys phishing campaign impersonates major brands with fake paid interview and webinar invitations to steal corporate Google and Okta credentials, then relays victims' MFA challenges to enable account takeover.","briefOverview":"\u003cp\u003ePush Security has tracked an ongoing phishing campaign called GoodGuys since October 13 that impersonates companies including Google Cloud, Nvidia, Accenture, SpaceX, Spotify, Coca-Cola, American Express, and Culver’s. The attackers send fake invitations to paid interviews, research studies, and webinars, offering as much as $600 for a 45-minute session. They distribute links through legitimate email and event platforms such as HireVue, SendGrid, Mandrill, and Cvent, using brand-themed domains and customized fake websites.\u003c/p\u003e\n\n\u003cp\u003eVictims are sent through a CAPTCHA challenge before reaching pages that request Google account sign-in details to validate an invitation. The kit targets corporate accounts, rejects Gmail, Yahoo, and Outlook addresses, and can display requests for SMS codes, authenticator codes, Google number-matching prompts, and Okta Verify approvals. Push Security believes the operators manually attempt logins with stolen credentials and direct the pages to show the verification challenges returned by Google or Okta; the kit also contains hidden labels that led researchers to suggest it may have been built using an AI coding assistant.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Push Security tracked the GoodGuys phishing campaign from October 13 and found it impersonating Accenture, American Express, Coca-Cola, Culver's, Google Cloud, Nvidia, SpaceX, and Spotify.","The campaign uses fake paid expert interviews, research studies, and webinars offering up to $600 to persuade recipients to sign in with work accounts.","Attackers distribute phishing links through legitimate email and event platforms including HireVue, SendGrid, Mandrill, and Cvent.","The phishing sites use attacker-controlled Google and Okta sign-in forms, reject consumer email addresses, and can request SMS codes, authenticator codes, Google number-matching prompts, or Okta Verify approvals.","Push Security believes the operators may manually use stolen credentials while directing the phishing pages to display the multifactor authentication challenges encountered during login."],"insights":["The campaign deliberately filters out Gmail, Yahoo, and Outlook addresses, indicating that its fake sign-in pages are designed to focus on corporate accounts rather than consumer accounts.","Rather than relaying a real login page through a proxy, GoodGuys uses attacker-controlled fake forms and appears to have operators manually attempt account access while showing victims the exact additional verification requests encountered.","The phishing emails are delivered through legitimate services such as HireVue, SendGrid, Mandrill, and Cvent, which can make invitations appear more credible to recipients.","Hidden accessibility labels calling the page a “sign-in simulation” and “GoodGuys sign-in simulation” appeared in every analyzed kit version, leading Push Security to suggest the kit may have been developed with an AI coding assistant."],"referencedReports":[{"title":"GoodGuys phishing campaign teardown","url":"https://pushsecurity.com/blog/goodguys-phishing-campaign-teardown","publisher":"push-security","context":"The article relies on Push Security's analysis of the GoodGuys phishing campaign, including its lures, credential collection pages, and MFA challenge handling.","category":"research","primary":true}],"body":"\u003cp\u003ePush Security has tracked an ongoing phishing campaign called GoodGuys since October 13 that impersonates companies including Google Cloud, Nvidia, Accenture, SpaceX, Spotify, Coca-Cola, American Express, and Culver’s. The attackers send fake invitations to paid interviews, research studies, and webinars, offering as much as $600 for a 45-minute session. They distribute links through legitimate email and event platforms such as HireVue, SendGrid, Mandrill, and Cvent, using brand-themed domains and customized fake websites.\u003c/p\u003e\n\n\u003cp\u003eVictims are sent through a CAPTCHA challenge before reaching pages that request Google account sign-in details to validate an invitation. The kit targets corporate accounts, rejects Gmail, Yahoo, and Outlook addresses, and can display requests for SMS codes, authenticator codes, Google number-matching prompts, and Okta Verify approvals. Push Security believes the operators manually attempt logins with stolen credentials and direct the pages to show the verification challenges returned by Google or Okta; the kit also contains hidden labels that led researchers to suggest it may have been built using an AI coding assistant.\u003c/p\u003e\n"},{"n":2,"title":"Remus malware steals Gmail messages via fake Google Sheets extension","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/remus-malware-steals-gmail-messages-via-fake-google-sheets-extension/","time":"15:23","priority":"SHOULD READ","score":84,"tldr":"Remus infostealer does not exploit a Gmail zero-day; it installs a fake Google Sheets Chrome extension that repeatedly steals unread emails from signed-in Gmail accounts. The extension can persist through password changes and session revocations until the active browser session ends.","briefOverview":"\u003cp\u003eThe Remus infostealer was marketed as having a Gmail zero-day that could collect messages even after victims changed passwords and revoked sessions. Hudson Rock investigated the claim but found the evidence inconclusive and no technical proof of a Gmail vulnerability. GenDigital and Invoke RE later determined that the capability was delivered through a malicious Chrome extension rather than a demonstrated Gmail flaw.\u003c/p\u003e\n\n\u003cp\u003eThe extension masquerades as “Google Sheets,” uses a copied Google Docs Offline description, and requests access to all websites. Remus installs it by modifying the victim’s Chrome profile and enabling Developer Mode, bypassing the removal of a Chrome command-line option for loading extensions in version 137 and later. It checks up to 10 signed-in Gmail accounts every minute for unread emails and sends the messages’ subjects, bodies, senders, and victims’ email addresses to its command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eThe extension remains installed through password changes and session revocations, though its access stops when the active browser session ends and resumes when the victim signs in again. Failed uploads are queued for retry, and a local record prevents successful messages from being sent again. Users are advised to install software only from trusted sources and review chrome://extensions for unexpected extensions or Developer Mode activation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found that Remus’s claimed Gmail zero-day capability is implemented through a malicious Chrome extension rather than a demonstrated flaw in Gmail.","The extension masquerades as Google Sheets, alters the Chrome profile to register itself, and enables Developer Mode to run as an unpacked extension.","Once installed, it checks up to 10 signed-in Gmail accounts every minute for unread messages and sends message content, subject lines, senders, and victims’ email addresses to its command-and-control server.","The extension can remain installed after password changes and session revocations, but its Gmail access stops when the active browser session ends and resumes when the victim signs in again.","Users are advised to obtain software only from trusted sources and review chrome://extensions for unexpected extensions or Developer Mode activation."],"insights":["The alleged Gmail zero-day was marketed as a way to retain access after password changes and session revocations, but researchers found no technical proof of a Gmail vulnerability and traced the persistence to the browser extension instead.","Remus specifically targets Google Chrome, and its installer works around Chrome 137’s removal of a command-line extension-loading option by modifying the browser profile and turning on Developer Mode.","The extension avoids repeatedly sending the same messages by maintaining a local record of successful uploads and retrying failed uploads.","Although the extension parses attachment filenames, the article states that it does not send those filenames to operators, suggesting that capability may not yet be fully implemented."],"referencedReports":[{"title":"Remus Stealer Markets Persistent Gmail Access: Hudson Rock Investigates","url":"http://www.infostealers.com/article/remus-stealer-markets-persistent-gmail-access-hudson-rock-investigates/","publisher":"hudson-rock","context":"Hudson Rock investigated Remus operators’ claimed Gmail zero-day and found the available evidence inconclusive.","category":"research","primary":false},{"title":"Remus Stealer Email Interception Analysis","url":"https://www.gendigital.com/blog/insights/research/remus-stealer-email-interception-analysis","publisher":"gendigital","context":"GenDigital’s technical analysis found that Remus’s Gmail-stealing capability relies on a malicious Chrome extension embedded in a native DLL.","category":"research","primary":true}],"body":"\u003cp\u003eThe Remus infostealer was marketed as having a Gmail zero-day that could collect messages even after victims changed passwords and revoked sessions. Hudson Rock investigated the claim but found the evidence inconclusive and no technical proof of a Gmail vulnerability. GenDigital and Invoke RE later determined that the capability was delivered through a malicious Chrome extension rather than a demonstrated Gmail flaw.\u003c/p\u003e\n\n\u003cp\u003eThe extension masquerades as “Google Sheets,” uses a copied Google Docs Offline description, and requests access to all websites. Remus installs it by modifying the victim’s Chrome profile and enabling Developer Mode, bypassing the removal of a Chrome command-line option for loading extensions in version 137 and later. It checks up to 10 signed-in Gmail accounts every minute for unread emails and sends the messages’ subjects, bodies, senders, and victims’ email addresses to its command-and-control server.\u003c/p\u003e\n\n\u003cp\u003eThe extension remains installed through password changes and session revocations, though its access stops when the active browser session ends and resumes when the victim signs in again. Failed uploads are queued for retry, and a local record prevents successful messages from being sent again. Users are advised to install software only from trusted sources and review chrome://extensions for unexpected extensions or Developer Mode activation.\u003c/p\u003e\n"},{"n":3,"title":"NordVPN Black Friday Deal: Get 78% off VPN plans in 2026","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/nordvpn-black-friday-deal-get-78-percent-off-vpn-plans-in-2026/","time":"17:58","priority":"MAY READ","score":15,"tldr":"NordVPN is promoting a 2026 Black Friday/Cyber Monday offer of up to 78% off select two-year plans, including three extra months and a 30-day money-back guarantee.","briefOverview":"\u003cp\u003eNordVPN\u0026rsquo;s 2026 Black Friday and Cyber Monday promotion offers discounts of up to 78% on subscriptions, along with three additional months on two-year plans. The two-year offer provides 27 months of coverage, while actual savings vary by plan and introductory term. The advertised 78% figure is based on comparing the introductory monthly price of the highest-tier two-year plan, including the extra months, against the current monthly price of an annual renewal.\u003c/p\u003e\n\n\u003cp\u003eNordVPN says its network includes more than 6,900 servers across 225 locations, with unlimited bandwidth and high-speed connections through its NordLynx protocol. A single account can cover up to 10 devices and can be installed on a compatible router. Depending on the plan, the service also includes malware scanning, phishing protection, ad and tracker blocking, Dark Web Monitor alerts, password management, application vulnerability scanning, and encrypted cloud storage. NordVPN provides a 30-day money-back guarantee and \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e customer support.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NordVPN's 2026 Black Friday and Cyber Monday promotion advertises savings of up to 78% and three extra months of protection on two-year subscriptions.","The advertised 78% saving compares the introductory monthly price of NordVPN's highest-tier two-year plan, including the extra months, with the current monthly price of its annual renewal.","NordVPN states that its network has more than 6,900 servers across 225 locations and offers unlimited bandwidth.","A NordVPN account supports up to 10 devices, and the service can also be installed on a compatible router.","Depending on the subscription tier, NordVPN includes features such as malware scanning, phishing protection, ad and tracker blocking, a password manager, and encrypted cloud storage."],"insights":["The headline 78% discount is calculated against the current monthly cost of an annual renewal, rather than representing a uniform discount across every available plan.","The highest discounts require a two-year commitment, and the promotion adds three months for a total of 27 months of coverage.","NordVPN's higher-priced tiers combine VPN access with services such as password management and encrypted cloud storage, so buyers can choose between a basic privacy service and a broader security bundle.","One subscription can protect up to 10 devices and may also be installed on a compatible router, potentially extending protection across a home network."],"referencedReports":[],"body":"\u003cp\u003eNordVPN\u0026rsquo;s 2026 Black Friday and Cyber Monday promotion offers discounts of up to 78% on subscriptions, along with three additional months on two-year plans. The two-year offer provides 27 months of coverage, while actual savings vary by plan and introductory term. The advertised 78% figure is based on comparing the introductory monthly price of the highest-tier two-year plan, including the extra months, against the current monthly price of an annual renewal.\u003c/p\u003e\n\n\u003cp\u003eNordVPN says its network includes more than 6,900 servers across 225 locations, with unlimited bandwidth and high-speed connections through its NordLynx protocol. A single account can cover up to 10 devices and can be installed on a compatible router. Depending on the plan, the service also includes malware scanning, phishing protection, ad and tracker blocking, Dark Web Monitor alerts, password management, application vulnerability scanning, and encrypted cloud storage. NordVPN provides a 30-day money-back guarantee and \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e customer support.\u003c/p\u003e\n"}]</script>
