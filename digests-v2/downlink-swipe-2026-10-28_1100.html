<script type="application/json" id="dl-articles">[{"n":1,"title":"Emerging Threat: (CVE-2026-111497) .NET and ASP.NET Core Memory Corruption","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-111497-net-and-asp-net-core-memory-corruption/","time":"11:10","priority":"MUST READ","score":96,"tldr":"CVE-2026-111497 is a critical out-of-bounds write in the Google Brotli decoder that can corrupt memory when untrusted Brotli data is decompressed, affecting unpatched .NET, Node.js, and other runtimes. Organizations should urgently update .NET to 8.0.33, 9.0.22, 10.0.14, or 11 RC3 and disable Brotli decompression paths where patching is not yet complete.","briefOverview":"\u003cp\u003eCVE-2026-111497 is an out-of-bounds write flaw in the Google Brotli decoder used by .NET, Node.js, and other runtimes. A crafted Brotli stream can cause an unpatched decoder to write beyond its buffer and corrupt adjacent memory. The resulting impact can include information disclosure, denial of service, or potentially code execution, and CISA added the issue to its Known Exploited Vulnerabilities catalog on 27 October 2026.\u003c/p\u003e\n\n\u003cp\u003eIn .NET, an attacker must be able to make an application decompress Brotli data they control, such as through ASP.NET Core request decompression, HttpClient automatic response decompression, or direct use of BrotliStream or BrotliDecoder. These paths are not enabled by default, and .NET Framework is not affected. Microsoft released updates for .NET 8.0.33, 9.0.22, 10.0.14, and 11 RC3; until updates are fully deployed, organizations can remove Brotli decompression settings or reject \u003ccode\u003eContent-Encoding: br\u003c/code\u003e requests at a reverse proxy or load balancer.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-111497 is an out-of-bounds write flaw in the Google Brotli decompression library that can allow memory reading or corruption through a crafted Brotli stream.","The issue affects unpatched .NET 8, 9, 10, and pre-RC3 .NET 11 releases when applications decompress attacker-controlled Brotli data, while .NET Framework is not affected.","Microsoft released fixes in .NET 8.0.33, 9.0.22, 10.0.14, and 11 RC3 on 25 October 2026.","CISA added CVE-2026-111497 to its Known Exploited Vulnerabilities catalog on 27 October 2026, with reported exploitation so far focused on Node.js.","Organizations should update affected runtimes and, until patching is complete, remove or block Brotli decompression for untrusted requests, HTTP responses, and application inputs."],"insights":["In .NET, exposure depends on configuration rather than default behavior: request decompression, HttpClient Brotli response decompression, and direct Brotli decoding are not enabled by default.","External scans can identify ASP.NET Core or Kestrel systems but cannot determine whether Brotli request decompression is enabled, so organizations must verify the relevant settings internally.","Self-contained, NativeAOT, and containerized .NET applications require rebuilding and redeploying with patched runtime components, rather than relying only on a host runtime update.","Although reliable code execution has been demonstrated against Node.js in a controlled environment, no .NET-specific exploitation has been published, and crashes remain reproducible on unpatched decoders.","A temporary mitigation is to reject Brotli-compressed HTTP request bodies at a reverse proxy or load balancer while updates are being deployed."],"referencedReports":[{"title":"Microsoft .NET advisory for CVE-2026-111497","url":"https://github.com/dotnet/announcements/issues/494","publisher":"microsoft","context":"The article references Microsoft's advisory announcing out-of-band .NET security updates for the Brotli decoder flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eCVE-2026-111497 is an out-of-bounds write flaw in the Google Brotli decoder used by .NET, Node.js, and other runtimes. A crafted Brotli stream can cause an unpatched decoder to write beyond its buffer and corrupt adjacent memory. The resulting impact can include information disclosure, denial of service, or potentially code execution, and CISA added the issue to its Known Exploited Vulnerabilities catalog on 27 October 2026.\u003c/p\u003e\n\n\u003cp\u003eIn .NET, an attacker must be able to make an application decompress Brotli data they control, such as through ASP.NET Core request decompression, HttpClient automatic response decompression, or direct use of BrotliStream or BrotliDecoder. These paths are not enabled by default, and .NET Framework is not affected. Microsoft released updates for .NET 8.0.33, 9.0.22, 10.0.14, and 11 RC3; until updates are fully deployed, organizations can remove Brotli decompression settings or reject \u003ccode\u003eContent-Encoding: br\u003c/code\u003e requests at a reverse proxy or load balancer.\u003c/p\u003e\n"}]</script>
