<script type="application/json" id="dl-articles">[{"n":2,"title":"Gaming the system: how a Chinese-speaking actor turned Brazilian government sites into an SEO weapon","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/gaming-the-system-how-a-chinese-speaking-actor-turned-brazilian-government-sites-into-an-seo-weapon/","time":"10:16","priority":"MUST READ","score":92,"tldr":"Check Point Research says a Chinese-speaking cybercrime group linked to Earth Berberoka is compromising Brazilian government and education web servers, installing malicious Apache modules that turn trusted domains into stealth proxies for gambling-themed fake app-store pages and SEO manipulation. The same scalable infrastructure and Linux malware toolkit could be quickly repurposed from search fraud to direct malware delivery.","briefOverview":"\u003cp\u003eCheck Point Research tracked a sustained campaign since mid-2025 against Brazilian organizations, primarily government and educational institutions. The activity is attributed to a Chinese-speaking cybercrime cluster dubbed Gambling Goblin, which the researchers connect to Earth Berberoka, a group previously documented targeting gambling sites across Asia. The campaign marks a shift from Brazil’s usual home-grown banking-trojan threats toward a foreign operator abusing trusted Brazilian infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe attackers compromise web servers and install malicious Apache modules that silently reverse-proxy selected visitors to attacker-controlled phishing pages while the traffic still appears to come from legitimate domains. Those pages impersonate app-distribution platforms such as Google Play, Microsoft Store, and Amazon, but promote online gambling and sports betting aimed at Brazilian users. Many linked pages are served through high-reputation Brazilian domains, including numerous government sites, to manipulate search rankings and hijack traffic at scale.\u003c/p\u003e\n\n\u003cp\u003eOnce inside a host, the group deploys a broad Linux toolkit that includes the DownPro downloader, AlphaAgent, oRAT, a 3snake-based credential stealer, an SSH brute-forcer, and reconnaissance scripts. The tools include heavy obfuscation, encrypted communications, process masquerading, tunneling, credential collection, and features meant to support lateral movement. Check Point Research also found related phishing networks localized in Vietnamese, Spanish, and English, plus domain-generation infrastructure that suggests the model is built to scale beyond Brazil.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research tracked a sustained campaign since mid-2025 against Brazilian organizations, primarily government and educational institutions, by a Chinese-speaking cybercrime cluster it calls Gambling Goblin.","The attackers install malicious Apache modules on compromised web servers to reverse-proxy selected visitors to attacker-controlled phishing pages while the traffic appears to come from the legitimate domain.","The phishing pages impersonate trusted app-distribution platforms such as Google Play, Microsoft Store, and Amazon while promoting online gambling and sports betting to Brazilian users.","The group deploys a heavily obfuscated Linux toolkit that includes DownPro, AlphaAgent, oRAT, a 3snake-based credential stealer, an SSH brute-forcer, and reconnaissance tools.","Check Point Research found related phishing networks localized in Vietnamese, Spanish, and English, as well as infrastructure that generates fresh domains daily."],"insights":["The attackers compile the malicious Apache module directly on victim servers, then delete build artifacts and timestomp the installed files to resemble legitimate Apache modules such as mod_ssl or mod_suexec.","The proxy module deliberately removes existing Content-Security-Policy headers and replaces them with a permissive policy so externally hosted or injected scripts can run freely on pages served through trusted domains.","The campaign abuses the search reputation of compromised .gov.br domains rather than relying only on attacker-owned domains, making legitimate public-sector websites part of the traffic-hijacking infrastructure.","AlphaAgent includes multiple network camouflage features, including Chrome-like TLS fingerprints, Google-themed server names and cookies, Cloudflare-style parameters, and a second layer of AES-GCM encryption inside TLS.","The group’s reconnaissance scripts are tailored to identify hosted domains, web roots, proxy rules, SSH keys, command histories, network mounts, and adjacent hosts, showing that compromised servers are assessed for both web abuse and lateral movement opportunities."],"referencedReports":[{"title":"New APT Group Earth Berberoka Targets Gambling Websites With Old and New Malware","url":"https://www.trendmicro.com/en_us/research/22/d/new-apt-group-earth-berberoka-targets-gambling-websites-with-old.html","publisher":"Trend Micro","context":"The article cites Trend Micro’s 2022 research as the first documentation of Earth Berberoka and uses it to support links between Gambling Goblin and that threat cluster.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research tracked a sustained campaign since mid-2025 against Brazilian organizations, primarily government and educational institutions. The activity is attributed to a Chinese-speaking cybercrime cluster dubbed Gambling Goblin, which the researchers connect to Earth Berberoka, a group previously documented targeting gambling sites across Asia. The campaign marks a shift from Brazil’s usual home-grown banking-trojan threats toward a foreign operator abusing trusted Brazilian infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe attackers compromise web servers and install malicious Apache modules that silently reverse-proxy selected visitors to attacker-controlled phishing pages while the traffic still appears to come from legitimate domains. Those pages impersonate app-distribution platforms such as Google Play, Microsoft Store, and Amazon, but promote online gambling and sports betting aimed at Brazilian users. Many linked pages are served through high-reputation Brazilian domains, including numerous government sites, to manipulate search rankings and hijack traffic at scale.\u003c/p\u003e\n\n\u003cp\u003eOnce inside a host, the group deploys a broad Linux toolkit that includes the DownPro downloader, AlphaAgent, oRAT, a 3snake-based credential stealer, an SSH brute-forcer, and reconnaissance scripts. The tools include heavy obfuscation, encrypted communications, process masquerading, tunneling, credential collection, and features meant to support lateral movement. Check Point Research also found related phishing networks localized in Vietnamese, Spanish, and English, plus domain-generation infrastructure that suggests the model is built to scale beyond Brazil.\u003c/p\u003e\n"},{"n":1,"title":"Fully Signed, Fully Passed: The Reply-To Was the Payload","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/government-mailbox-dual-dkim-covert-reply-to-diversion","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A genuine European government mailbox sent a fully authenticated phishing email whose only payload was a hidden Reply-To diversion to an attacker-controlled address. Because DKIM, DMARC, and ARC all passed, the key lesson is that email authentication proves origin and integrity, not whether the reply path is safe.","briefOverview":"\u003cp\u003eA senior executive at a professional certification and credentialing organization received a one-line RFQ follow-up email from a genuine mailbox at a European regional government body. The message had no link, no attachment, and no malicious sending infrastructure to block. Its payload was a redirected reply path: the Reply-To field listed an attacker-controlled address, infodesk@frontdesk-investment[.]com, ahead of the genuine government mailbox.\u003c/p\u003e\n\n\u003cp\u003eThe message passed DKIM twice, DMARC, ARC, and Microsoft’s composite authentication verdict, because it was not forged and was signed by the sending organization’s own mail flow. The government domain’s DKIM signature explicitly covered the Reply-To header, showing the covert reply address was present before the outbound gateway signed the message. The article emphasizes that authentication can prove a message is authentic and unmodified, but it does not prove that a signed header is safe.\u003c/p\u003e\n\n\u003cp\u003eThe final-hop SPF failure was described as an outbound relay artifact rather than the attack signal, because an earlier Received-SPF record showed a pass upstream. IRONSCALES said its Adaptive AI analyst Themis flagged the message under a vip-recipient label based on phrasing and structure, while Microsoft recorded both a clean authentication verdict and spam-related signals. The practical control highlighted by the article is to surface reply-path divergence during triage, especially when the reply domain differs from the From domain or the Reply-To field contains multiple addresses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A senior executive at a professional certification and credentialing organization received a one-line RFQ follow-up email from a genuine mailbox at a European regional government body.","The message had no link or attachment and used a Reply-To field containing both an attacker-controlled address, infodesk@frontdesk-investment[.]com, and the genuine government mailbox.","The government domain’s valid DKIM signature explicitly covered the Reply-To header, showing the covert reply address was present before the sending organization’s outbound gateway signed the message.","The email passed DKIM twice, DMARC, ARC, and Microsoft’s composite authentication verdict, demonstrating that the message was not forged even though its reply path was redirected.","The article says the practical control is to surface reply-path divergence during triage, especially when an inbound message’s reply domain does not match the From domain or contains multiple reply addresses."],"insights":["A valid DKIM signature covering the Reply-To header can prove that a malicious reply address was already present inside the sender’s outbound mail flow, rather than added later in transit.","Clean DKIM, DMARC, ARC, and composite authentication results can coexist with a dangerous message because those controls verify origin and integrity, not whether a signed reply path is safe.","A final-hop SPF failure was not useful as the attack signal in this case because an earlier Received-SPF record showed a pass upstream and DKIM preserved authentication through the outbound relay.","The only attacker-controlled element was a Reply-To address, so blocking the legitimate sender domain would punish a victim organization while missing the actual mechanism of the scam.","Triage workflows should show Reply-To domain divergence next to the From domain because analysts may otherwise overlook the only meaningful indicator in a payload-free business email compromise attempt."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics that the human element is involved in 62% of breaches and phishing accounts for 16% of initial access vectors.","category":"research","primary":false},{"title":"2025 FBI IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for the figure of $3,046,598,558 in reported business email compromise losses.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance to frame phishing as deception of the recipient rather than malicious code.","category":"guide","primary":false}],"body":"\u003cp\u003eA senior executive at a professional certification and credentialing organization received a one-line RFQ follow-up email from a genuine mailbox at a European regional government body. The message had no link, no attachment, and no malicious sending infrastructure to block. Its payload was a redirected reply path: the Reply-To field listed an attacker-controlled address, infodesk@frontdesk-investment[.]com, ahead of the genuine government mailbox.\u003c/p\u003e\n\n\u003cp\u003eThe message passed DKIM twice, DMARC, ARC, and Microsoft’s composite authentication verdict, because it was not forged and was signed by the sending organization’s own mail flow. The government domain’s DKIM signature explicitly covered the Reply-To header, showing the covert reply address was present before the outbound gateway signed the message. The article emphasizes that authentication can prove a message is authentic and unmodified, but it does not prove that a signed header is safe.\u003c/p\u003e\n\n\u003cp\u003eThe final-hop SPF failure was described as an outbound relay artifact rather than the attack signal, because an earlier Received-SPF record showed a pass upstream. IRONSCALES said its Adaptive AI analyst Themis flagged the message under a vip-recipient label based on phrasing and structure, while Microsoft recorded both a clean authentication verdict and spam-related signals. The practical control highlighted by the article is to surface reply-path divergence during triage, especially when the reply domain differs from the From domain or the Reply-To field contains multiple addresses.\u003c/p\u003e\n"},{"n":3,"title":"When Everyone Can Find Your Bugs: Medical Device Security After AI","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/when-everyone-can-find-your-bugs-medical-device-security-after-ai/","time":"13:26","priority":"MAY READ","score":35,"tldr":"Health-ISAC and ELTON Cyber are offering an on-demand webinar on how AI-driven pentesting is dramatically increasing medical device vulnerability findings, creating new triage and evidence requirements for manufacturers under FDA expectations.","briefOverview":"\u003cp\u003eHealth-ISAC and ELTON Medical Device AI-Pentesting discuss how AI has collapsed the cost of vulnerability discovery to nearly zero. The article says manufacturers now face more findings per product and per release than any team can triage by hand. Each finding requires an evidence-based disposition under FDA premarket 524B and postmarket expectations.\u003c/p\u003e\n\n\u003cp\u003eELTON, a company specializing in AI pentesting and vulnerability management for medical devices, shares its pipeline and solution in the recorded webinar. The initiative draws on industry practitioners’ experience to raise awareness of emerging trends in medical device cybersecurity. The discussion also covers the OpenAI and HuggingFace incident as an example of the transformative power of AI pentesting.\u003c/p\u003e\n\n\u003cp\u003eThe article provides a link to watch the recorded webinar by Elton, described as a Health-ISAC Community Services Champion. It also links to resources discussed in the webinar. The page identifies Elton Cyber as the resource provider.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC and ELTON Medical Device AI-Pentesting discuss how AI has collapsed the cost of vulnerability discovery to nearly zero.","The article says manufacturers now face more findings per product and per release than any team can triage by hand.","Each finding requires an evidence-based disposition under FDA premarket 524B and postmarket expectations.","ELTON, a company specializing in AI pentesting and vulnerability management for medical devices, shares its pipeline and solution in the webinar.","The discussion covers the OpenAI and HuggingFace incident as an example of the transformative power of AI pentesting."],"insights":["The article frames the main challenge for medical device manufacturers as no longer just finding vulnerabilities, but producing evidence-based decisions for a volume of findings that may exceed manual review capacity.","AI pentesting is presented as a regulatory burden as well as a technical change, because each finding must be handled in the context of FDA premarket 524B and postmarket expectations.","The OpenAI and HuggingFace incident is used as an example to show that AI-enabled vulnerability discovery is relevant beyond general software and is being applied to medical device security discussions."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC and ELTON Medical Device AI-Pentesting discuss how AI has collapsed the cost of vulnerability discovery to nearly zero. The article says manufacturers now face more findings per product and per release than any team can triage by hand. Each finding requires an evidence-based disposition under FDA premarket 524B and postmarket expectations.\u003c/p\u003e\n\n\u003cp\u003eELTON, a company specializing in AI pentesting and vulnerability management for medical devices, shares its pipeline and solution in the recorded webinar. The initiative draws on industry practitioners’ experience to raise awareness of emerging trends in medical device cybersecurity. The discussion also covers the OpenAI and HuggingFace incident as an example of the transformative power of AI pentesting.\u003c/p\u003e\n\n\u003cp\u003eThe article provides a link to watch the recorded webinar by Elton, described as a Health-ISAC Community Services Champion. It also links to resources discussed in the webinar. The page identifies Elton Cyber as the resource provider.\u003c/p\u003e\n"}]</script>
