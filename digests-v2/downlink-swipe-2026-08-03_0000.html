<script type="application/json" id="dl-articles">[{"n":3,"title":"N-able warns of N-central auth bypass flaw exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/n-able-warns-of-n-central-auth-bypass-flaw-exploited-in-attacks/","time":"17:00","priority":"MUST READ","score":94,"tldr":"N-able says attackers are actively exploiting an authentication bypass flaw in N-central that can enable administrative account takeover. Hosted systems have been patched, but on-premises customers should urgently install hotfix 2026.3.1.7 and check for the provided indicators of compromise.","briefOverview":"\u003cp\u003eN-able is warning customers that hackers are exploiting an authentication bypass vulnerability, CVE-2026-18577, affecting hosted and on-premises N-central servers. The company released hotfix 2026.3.1.7 to address the issue, which affects all N-central versions before 2026.3. Hosted deployments have already received the update, while on-premises customers need to install it manually.\u003c/p\u003e\n\n\u003cp\u003eN-central is N-able’s Remote Monitoring and Management platform, used by managed service providers and corporate IT departments to manage large groups of systems and network devices. Because of this role, a compromise of N-central servers can allow attackers to extend activity beyond N-able’s direct customers. The product was also targeted last year in zero-day attacks that prompted CISA to issue an urgent alert.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-18577 resulted from an incomplete patch for CVE-2026-18576, and both vulnerabilities could be exploited for administrative account takeover. N-able has not shared technical details or the number of customers targeted or compromised through CVE-2026-18577. The company provided indicators of compromise, including four IP addresses, a registered service named “Cloudflared,” and “svchost.exe” in users’ documents folders, and advised affected customers to contact N-able support and engage their security teams.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able warned that hackers are exploiting an authentication bypass vulnerability, CVE-2026-18577, affecting hosted and on-premises N-central servers.","N-able released hotfix 2026.3.1.7 to address the issue, which affects all N-central versions before 2026.3.","Hosted N-central deployments have already received the update, while on-premises customers must install it manually.","CVE-2026-18577 resulted from an incomplete patch for CVE-2026-18576, and both vulnerabilities could be exploited for administrative account takeover.","N-able provided indicators of compromise including four IP addresses, a registered service named “Cloudflared,” and “svchost.exe” in users’ documents folders."],"insights":["On-premises N-central customers carry the immediate remediation burden because hosted deployments have already been updated, but self-managed instances require manual installation of the hotfix.","The new flaw is especially concerning because it resulted from an incomplete fix for a prior authentication bypass issue, meaning customers who addressed the earlier vulnerability may still remain exposed without the latest hotfix.","N-able’s indicators of compromise highlight abuse of legitimate-looking components, including Cloudflared and a file named “svchost.exe” placed in users’ documents folders, so customers should not treat familiar names as automatically benign.","The risk extends beyond N-able’s direct customers because N-central is used by managed service providers and IT teams to manage large numbers of systems and network devices."],"referencedReports":[{"title":"N-central 2026.3 Hotfix 1 Mitigation for CVE-2026-18577","url":"https://status.n-able.com/2026/08/02/n-central-2026-3-hotfix-1-mitigation-for-cve-2026-18577/","publisher":"N-able","context":"The article cites N-able’s hotfix page as the source for indicators of compromise and mitigation guidance for CVE-2026-18577.","category":"advisory","primary":true},{"title":"CVE-2026-18556","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-18556","publisher":"National Vulnerability Database","context":"The article links to the NVD entry when describing the earlier authentication bypass issue that CVE-2026-18577 resulted from incompletely patching.","category":"advisory","primary":false},{"title":"CVE-2026-18577","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-18577","publisher":"National Vulnerability Database","context":"The article links to the NVD entry for CVE-2026-18577 while noting that N-able has not shared technical details or customer impact figures.","category":"advisory","primary":false}],"body":"\u003cp\u003eN-able is warning customers that hackers are exploiting an authentication bypass vulnerability, CVE-2026-18577, affecting hosted and on-premises N-central servers. The company released hotfix 2026.3.1.7 to address the issue, which affects all N-central versions before 2026.3. Hosted deployments have already received the update, while on-premises customers need to install it manually.\u003c/p\u003e\n\n\u003cp\u003eN-central is N-able’s Remote Monitoring and Management platform, used by managed service providers and corporate IT departments to manage large groups of systems and network devices. Because of this role, a compromise of N-central servers can allow attackers to extend activity beyond N-able’s direct customers. The product was also targeted last year in zero-day attacks that prompted CISA to issue an urgent alert.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-18577 resulted from an incomplete patch for CVE-2026-18576, and both vulnerabilities could be exploited for administrative account takeover. N-able has not shared technical details or the number of customers targeted or compromised through CVE-2026-18577. The company provided indicators of compromise, including four IP addresses, a registered service named “Cloudflared,” and “svchost.exe” in users’ documents folders, and advised affected customers to contact N-able support and engage their security teams.\u003c/p\u003e\n"},{"n":8,"title":"Russian hackers hijack hotel Wi-Fi networks to spy on travelers, Microsoft says","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russian-wifi-hackers-hotels","time":"12:00","priority":"MUST READ","score":94,"tldr":"Microsoft says Russian state-backed hackers tied to Midnight Blizzard are compromising hotel and hospitality Wi-Fi captive portals to steal travelers’ Microsoft 365 credentials and deliver espionage malware. The campaign targets corporate travelers globally and may affect other shared venues such as conference centers, airports, and co-working spaces.","briefOverview":"\u003cp\u003eRussian state-sponsored hackers have been compromising hotel Wi-Fi networks around the world to steal travelers’ login credentials and infect devices with espionage malware, according to Microsoft. The company linked the activity to Storm-2945, a sub-cluster of Midnight Blizzard that Western intelligence agencies believe is connected to Russia’s Foreign Intelligence Service. The campaign, first observed by Microsoft in early May, targets hotels and other hospitality venues that require guests to log into Wi-Fi through captive portals.\u003c/p\u003e\n\n\u003cp\u003eThe attackers manipulate internet traffic on compromised networks to redirect victims to fake Microsoft login pages or fraudulent browser and operating system update screens. Microsoft said one technique allows attackers to intercept credentials and gain access to Microsoft 365 accounts, while another uses ClickFix social engineering to trick users into installing malware themselves. ReliaQuest, which first disclosed the activity in July, said hotels and other hospitality organizations in multiple U.S. cities, India, and Saudi Arabia have been affected, with corporate travelers appearing to be the primary targets.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified two malware families used in the campaign: CornFlake and ChocoShell. CornFlake is a remote access trojan that can maintain control of infected Windows computers, collect files, record keystrokes, steal passwords and tokens, capture audio and video, detect USB drives, and allow remote control. ChocoShell is designed to quickly harvest browser cookies, saved passwords, Microsoft 365 single sign-on tokens, and Wi-Fi credentials, and Microsoft said some fake update pages also direct Android users to install a malicious application.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft said Russian state-sponsored hackers linked to Storm-2945, a sub-cluster of Midnight Blizzard, have been compromising hotel Wi-Fi networks to steal travelers’ login credentials and infect devices with espionage malware.","The campaign targets hotels and other hospitality venues that use captive portals, redirecting victims to fake Microsoft login pages or fraudulent browser and operating system update screens.","ReliaQuest said the activity has affected hotels and other hospitality organizations across multiple U.S. cities, as well as in India and Saudi Arabia, with corporate travelers appearing to be the primary targets.","Microsoft identified two malware families used in the campaign: CornFlake, a remote access trojan for persistent control of Windows computers, and ChocoShell, an information stealer for harvesting credentials and tokens.","ReliaQuest warned that organizations operating captive portal networks, including airports, conference centers, co-working spaces, universities, healthcare facilities, and event venues, could become targets."],"insights":["The campaign turns trusted shared Wi-Fi login pages into a credential-theft and malware-delivery channel, meaning the risk begins before travelers fully connect to the internet.","The attackers use different paths depending on the victim interaction: fake Microsoft sign-in pages to capture Microsoft 365 credentials and fake update prompts to persuade users to install malware themselves.","Microsoft’s attribution to Storm-2945 differs from ReliaQuest’s earlier assessment pointing to APT28-like tactics, showing that similar router or traffic-hijacking methods can complicate attribution.","The use of ChocoShell to steal Microsoft 365 single sign-on tokens and browser cookies means attackers may be able to access cloud services without relying only on stolen passwords.","Microsoft noted that some fake update pages include instructions for Android users, indicating the operation may be moving beyond Windows computers."],"referencedReports":[{"title":"CaptiveCrunch: Midnight Blizzard targets travelers worldwide for malware delivery and credential theft","url":"https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/","publisher":"Microsoft","context":"The article says Microsoft published a report linking the hotel Wi-Fi campaign to Storm-2945, a sub-cluster of Midnight Blizzard.","category":"research","primary":true},{"title":"Threat Spotlight: DNS Poisoning Tactics Expand to Hospitality","url":"https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/","publisher":"ReliaQuest","context":"The article says ReliaQuest first disclosed the activity and described affected hospitality organizations in the United States, India, and Saudi Arabia.","category":"research","primary":false}],"body":"\u003cp\u003eRussian state-sponsored hackers have been compromising hotel Wi-Fi networks around the world to steal travelers’ login credentials and infect devices with espionage malware, according to Microsoft. The company linked the activity to Storm-2945, a sub-cluster of Midnight Blizzard that Western intelligence agencies believe is connected to Russia’s Foreign Intelligence Service. The campaign, first observed by Microsoft in early May, targets hotels and other hospitality venues that require guests to log into Wi-Fi through captive portals.\u003c/p\u003e\n\n\u003cp\u003eThe attackers manipulate internet traffic on compromised networks to redirect victims to fake Microsoft login pages or fraudulent browser and operating system update screens. Microsoft said one technique allows attackers to intercept credentials and gain access to Microsoft 365 accounts, while another uses ClickFix social engineering to trick users into installing malware themselves. ReliaQuest, which first disclosed the activity in July, said hotels and other hospitality organizations in multiple U.S. cities, India, and Saudi Arabia have been affected, with corporate travelers appearing to be the primary targets.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified two malware families used in the campaign: CornFlake and ChocoShell. CornFlake is a remote access trojan that can maintain control of infected Windows computers, collect files, record keystrokes, steal passwords and tokens, capture audio and video, detect USB drives, and allow remote control. ChocoShell is designed to quickly harvest browser cookies, saved passwords, Microsoft 365 single sign-on tokens, and Wi-Fi credentials, and Microsoft said some fake update pages also direct Android users to install a malicious application.\u003c/p\u003e\n"},{"n":15,"title":"N-able Says Attackers Take Over N-central Servers After Initial Fix Proves Incomplete","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/n-able-says-attackers-take-over-n.html","time":"06:41","priority":"MUST READ","score":94,"tldr":"Attackers exploited an authentication bypass in N-able N-central to take over servers and access managed customer endpoints, and N-able says its initial fix was incomplete. Customers must upgrade to 2026.3.1.7 and check endpoints for persistent Cloudflare tunnel services or other signs of compromise.","briefOverview":"\u003cp\u003eN-able said attackers exploited an authentication bypass in N-central to gain remote administrative access and reach customer systems managed through those servers. The company said its first fix was incomplete, and CVE-2026-18577 affects N-central builds prior to 2026.3.1.7. N-able shipped build 2026.3.1.7 on August 2 as the first unaffected version.\u003c/p\u003e\n\n\u003cp\u003eAfter compromising an N-central server, the attackers used Take Control to reach managed endpoints and registered Cloudflare tunnels as services on the devices. N-able said the tunnels preserved access after the route through the N-central server was revoked, and the disclosure does not suggest Cloudflare was compromised. Customers that find evidence of compromise must hunt for and remove malicious tunnel services from managed endpoints because upgrading N-central does not remove persistence installed on another machine.\u003c/p\u003e\n\n\u003cp\u003eN-able began investigating on July 31 after an unusual volume of licensing errors from on-premises customers and said it contacted a limited number of affected customers. Huntress said it observed exploitation involving one self-hosted N-central instance within one partner account, with attackers accessing nine organizations under that account and reaching one endpoint in each. N-able has not disclosed the number or identities of affected customers, how many downstream devices were reached, when exploitation began, who is behind it, or whether any data was taken.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able said attackers exploited an authentication bypass in N-central to gain remote administrative access and reach customer systems managed through those servers.","N-able said its initial fix was incomplete, and CVE-2026-18577 affects N-central builds prior to 2026.3.1.7, which was shipped on August 2 as the first unaffected version.","After compromising an N-central server, the attackers used Take Control to reach managed endpoints and registered Cloudflare tunnels as services on the devices to preserve access after the N-central route was revoked.","N-able told all N-central customers to upgrade to 2026.3.1.7 and said customers with evidence of compromise must also hunt for and remove malicious tunnel services from managed endpoints.","Huntress said it observed exploitation involving one self-hosted N-central instance in one partner account, with attackers accessing nine organizations under that account and reaching one endpoint in each."],"insights":["Upgrading only to N-central 2026.3 is not sufficient because N-able’s first instruction was superseded by the 2026.3.1.7 hotfix as the first unaffected build.","Remediation cannot stop at patching N-central because the attackers allegedly placed Cloudflare tunnel services on managed endpoints that could keep access alive independently of the compromised server.","Matches against N-able’s published attacker IP addresses need careful correlation because Huntress identified several of the initially listed addresses as Mullvad or NordVPN exit nodes.","Logs showing Take Control activity are not automatically proof of compromise because Huntress said the same logs also appear during legitimate Take Control use.","N-able’s CVE records do not identify the vulnerable endpoint or request sequence, and the company has not published code-level root-cause details."],"referencedReports":[{"title":"N-central Security Update – August 2, 2026","url":"https://www.n-able.com/blog/n-central-security-update-august-2-2026","publisher":"N-able","context":"The article cites N-able’s initial instruction to upgrade to N-central 2026, which it says is no longer sufficient after the incomplete fix was identified.","category":"advisory","primary":true},{"title":"N-central 2026.3 Hotfix 1 Mitigation for CVE-2026-18577","url":"https://status.n-able.com/2026/08/02/n-central-2026-3-hotfix-1-mitigation-for-cve-2026-18577/","publisher":"N-able","context":"The article cites N-able’s hotfix notice explaining that hosted NCOD instances will be upgraded on a schedule and self-hosted servers must be upgraded by customers.","category":"advisory","primary":true},{"title":"Haavoittuvuus 2026-21","url":"https://www.kyberturvallisuuskeskus.fi/fi/haavoittuvuudet/haavoittuvuus-2026-21","publisher":"Finland National Cyber Security Centre","context":"The article cites Finland’s national cyber security centre advisory stating that all versions available before the emergency hotfix were vulnerable.","category":"advisory","primary":false},{"title":"N-able Vulnerability Exploitation","url":"https://www.huntress.com/blog/n-able-vulnerability-exploitation","publisher":"Huntress","context":"The article cites Huntress’s rapid response about observed exploitation involving a self-hosted N-central instance and related attacker domains and log review guidance.","category":"research","primary":true}],"body":"\u003cp\u003eN-able said attackers exploited an authentication bypass in N-central to gain remote administrative access and reach customer systems managed through those servers. The company said its first fix was incomplete, and CVE-2026-18577 affects N-central builds prior to 2026.3.1.7. N-able shipped build 2026.3.1.7 on August 2 as the first unaffected version.\u003c/p\u003e\n\n\u003cp\u003eAfter compromising an N-central server, the attackers used Take Control to reach managed endpoints and registered Cloudflare tunnels as services on the devices. N-able said the tunnels preserved access after the route through the N-central server was revoked, and the disclosure does not suggest Cloudflare was compromised. Customers that find evidence of compromise must hunt for and remove malicious tunnel services from managed endpoints because upgrading N-central does not remove persistence installed on another machine.\u003c/p\u003e\n\n\u003cp\u003eN-able began investigating on July 31 after an unusual volume of licensing errors from on-premises customers and said it contacted a limited number of affected customers. Huntress said it observed exploitation involving one self-hosted N-central instance within one partner account, with attackers accessing nine organizations under that account and reaching one endpoint in each. N-able has not disclosed the number or identities of affected customers, how many downstream devices were reached, when exploitation began, who is behind it, or whether any data was taken.\u003c/p\u003e\n"},{"n":17,"title":"INC Ransomware Emerges as Dominant Actor Exploiting SonicWall SMA 1000 Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/inc-ransomware-emerges-as-dominant.html","time":"16:15","priority":"MUST READ","score":94,"tldr":"INC Ransomware has become the main group exploiting patched SonicWall SMA 1000 zero-day flaws to steal credentials, MFA seeds, and session data for persistent access and lateral movement. Organizations using SMA 1000 appliances should patch immediately and perform threat hunting, credential rotation, and integrity checks.","briefOverview":"\u003cp\u003eINC Ransomware has emerged as the “dominant threat actor” exploiting recently disclosed flaws in SonicWall Secure Mobile Access 1000 series VPN appliances. Resecurity reported that the group accelerated activity from the beginning of August 2026 and listed multiple victims on its data leak site. Ransomware.Live statistics cited in the article say the group has claimed 885 victims to date, with the most recent listed on August 2, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe attacks are suspected to involve chaining CVE-2026-15409 and CVE-2026-15410 to enable arbitrary command execution and takeover of vulnerable devices. SonicWall released fixes for the two flaws in mid-July 2026, and the flaws are assessed to have been weaponized as zero-days. Rapid7 said attackers used access to extract high-value credentials, active session databases, and Time-Based One-Time Password multi-factor authentication seed configurations to support persistent access and lateral movement.\u003c/p\u003e\n\n\u003cp\u003eVolexity attributed pre-disclosure exploitation starting June 22, 2026, to a threat cluster it tracks as UTA0533, involving KNUCKLEBALL, Suo5, and ORANGETAIL. Resecurity said INC Ransomware victims listed between July 17 and August 1, 2026, included private sector and government organizations from Australia, the U.S., the U.A.E., Colombia, Switzerland, and other countries. Customers are advised to patch SMA 1000 appliances, conduct threat hunting, rotate credentials, and verify integrity, including reviewing external sources that interacted with /wsproxy or used unusual parameters.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Resecurity reported that INC Ransomware has emerged as the dominant threat actor exploiting recently disclosed flaws in SonicWall SMA 1000 series VPN appliances.","The attacks are suspected to chain CVE-2026-15409 and CVE-2026-15410 to enable arbitrary command execution and takeover of susceptible devices, with fixes released by SonicWall in mid-July 2026.","Rapid7 said the zero-day attacks were used to extract high-value credentials, active session databases, and Time-Based One-Time Password multi-factor authentication seed configurations to support persistent access and lateral movement.","Volexity attributed pre-disclosure exploitation starting June 22, 2026, to a threat cluster it tracks as UTA0533, involving the Python script KNUCKLEBALL, the Suo5 HTTP proxy, and the ORANGETAIL Java web shell.","Resecurity said new victims listed by INC Ransomware between July 17 and August 1, 2026, included private sector and government organizations in Australia, the U.S., the U.A.E., Colombia, Switzerland, and other countries."],"insights":["Patching alone may not be sufficient for already-exposed SonicWall SMA 1000 appliances because the article says attackers extracted credentials, active session databases, and TOTP MFA seed configurations that could support long-term access.","Threat hunting should specifically examine external source addresses that interacted with the /wsproxy path or used unusual parameters, then correlate those events with internal authentication and lateral-movement activity.","Victim organizations should treat unsolicited ransomware “help” calls or emails as part of the extortion pressure campaign, as Resecurity reported contacts from unknown organizations and an individual using the name “Andrew” and the email address info@helprans[.]com.","The overlap between Rapid7 and Volexity findings suggests defenders can connect activity involving KNUCKLEBALL, Suo5, ORANGETAIL, and the SonicWall SMA flaw chain when investigating possible compromises."],"referencedReports":[{"title":"From WSProxy to Root: INC Ransomware and SonicWall SMA Exploit Chain","url":"https://www.resecurity.com/blog/article/from-wsproxy-to-root-inc-ransomware-and-sonicwall-sma-exploit-chain","publisher":"Resecurity","context":"The article cites Resecurity’s report as the source for its finding that INC Ransomware has accelerated activity exploiting SonicWall SMA 1000 flaws.","category":"research","primary":true}],"body":"\u003cp\u003eINC Ransomware has emerged as the “dominant threat actor” exploiting recently disclosed flaws in SonicWall Secure Mobile Access 1000 series VPN appliances. Resecurity reported that the group accelerated activity from the beginning of August 2026 and listed multiple victims on its data leak site. Ransomware.Live statistics cited in the article say the group has claimed 885 victims to date, with the most recent listed on August 2, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe attacks are suspected to involve chaining CVE-2026-15409 and CVE-2026-15410 to enable arbitrary command execution and takeover of vulnerable devices. SonicWall released fixes for the two flaws in mid-July 2026, and the flaws are assessed to have been weaponized as zero-days. Rapid7 said attackers used access to extract high-value credentials, active session databases, and Time-Based One-Time Password multi-factor authentication seed configurations to support persistent access and lateral movement.\u003c/p\u003e\n\n\u003cp\u003eVolexity attributed pre-disclosure exploitation starting June 22, 2026, to a threat cluster it tracks as UTA0533, involving KNUCKLEBALL, Suo5, and ORANGETAIL. Resecurity said INC Ransomware victims listed between July 17 and August 1, 2026, included private sector and government organizations from Australia, the U.S., the U.A.E., Colombia, Switzerland, and other countries. Customers are advised to patch SMA 1000 appliances, conduct threat hunting, rotate credentials, and verify integrity, including reviewing external sources that interacted with /wsproxy or used unusual parameters.\u003c/p\u003e\n"},{"n":11,"title":"Bitcoin hardware wallet maker destroys some inventory after more than $88 million stolen","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/bitcoin-theft-coldcard-cyberattack","time":"20:15","priority":"MUST READ","score":92,"tldr":"Coinkite destroyed remaining Coldcard hardware wallet inventory running vulnerable firmware after hackers exploited an old seed-generation flaw to steal at least 1,367 BTC, worth about $88.6 million, from thousands of addresses. The company has released patched firmware and is urging affected users not to discard devices as recovery and law enforcement efforts continue.","briefOverview":"\u003cp\u003eCoinkite, the Canadian company behind the Coldcard bitcoin hardware wallet, said it destroyed remaining inventory made with vulnerable firmware after customers reported bitcoin thefts. The devices are used to store bitcoin offline instead of on an exchange. The company confirmed that a vulnerability previously discovered in March 2021 is now being used to breach accounts.\u003c/p\u003e\n\n\u003cp\u003eGalaxy Research said the hackers behind the campaign stole at least 1,367.05 BTC, worth about \u003cspan class=\"math inline\"\u003e\\(88.6 million, from 4,585 addresses. Chainalysis said two of the biggest victims lost a combined \\)\u003c/span\u003e4 million and that the attacker appeared to target high-value wallets early. According to Chainalysis, the cumulative value stolen reached roughly $30 million in the first 10 minutes.\u003c/p\u003e\n\n\u003cp\u003eColdcard said it has been working with customers to move funds and told affected users not to dispose of their devices because they may become important if funds are recovered. The company released patched firmware that it says prevents the issue going forward, and said it halted shipments and destroyed affected inventory because devices could not be upgraded until users initialized them. The FBI declined to comment on whether it is investigating, and Coinkite did not respond to questions about whether it will compensate victims.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Coinkite said it destroyed its remaining Coldcard inventory manufactured with vulnerable firmware after reports that customers were being robbed of bitcoin.","Galaxy Research said the hackers behind the campaign stole at least 1,367.05 BTC, worth about $88.6 million, from 4,585 addresses.","Coldcard released patched firmware that it says prevents the issue going forward and said it has been working with customers to move funds.","Chainalysis said the attacker prioritized high-value wallets, causing the cumulative stolen value to reach roughly $30 million in the first 10 minutes.","The FBI declined to comment on whether it is investigating the campaign, and Coinkite did not respond to questions about whether it will compensate victims."],"insights":["Coldcard told affected users not to dispose of their devices because the hardware may become important if stolen funds are recovered and legal teams coordinate with law enforcement.","The company said affected devices could not simply be upgraded before shipment because their high-security locks prevent firmware upgrades until a user initializes the device.","Chainalysis said the attacker appeared to study the victim wallet population before the theft, based on the early targeting of high-value wallets.","A Coinkite senior official blamed the incident partly on AI-assisted code reviews, saying they may help criminals find old bugs faster than experts can address them."],"referencedReports":[{"title":"Predictable RNG Fallback and 32-bit Reseed in Coldcard Firmware","url":"https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware","publisher":"Block","context":"The article cites this technical write-up as the prior March 2021 discovery of the Coldcard firmware vulnerability now being exploited.","category":"research","primary":false}],"body":"\u003cp\u003eCoinkite, the Canadian company behind the Coldcard bitcoin hardware wallet, said it destroyed remaining inventory made with vulnerable firmware after customers reported bitcoin thefts. The devices are used to store bitcoin offline instead of on an exchange. The company confirmed that a vulnerability previously discovered in March 2021 is now being used to breach accounts.\u003c/p\u003e\n\n\u003cp\u003eGalaxy Research said the hackers behind the campaign stole at least 1,367.05 BTC, worth about \u003cspan class=\"math inline\"\u003e\\(88.6 million, from 4,585 addresses. Chainalysis said two of the biggest victims lost a combined \\)\u003c/span\u003e4 million and that the attacker appeared to target high-value wallets early. According to Chainalysis, the cumulative value stolen reached roughly $30 million in the first 10 minutes.\u003c/p\u003e\n\n\u003cp\u003eColdcard said it has been working with customers to move funds and told affected users not to dispose of their devices because they may become important if funds are recovered. The company released patched firmware that it says prevents the issue going forward, and said it halted shipments and destroyed affected inventory because devices could not be upgraded until users initialized them. The FBI declined to comment on whether it is investigating, and Coinkite did not respond to questions about whether it will compensate victims.\u003c/p\u003e\n"},{"n":21,"title":"Chinese Threat Actor Uses Leaked DarkSword Kit to Deploy GHOSTBLADE on iOS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/chinese-threat-actor-uses-leaked.html","time":"10:49","priority":"MUST READ","score":92,"tldr":"A Chinese-speaking threat actor is using the leaked DarkSword iOS exploit kit through fake AWS and Apple ID pages to compromise iPhones and deploy the GHOSTBLADE data-stealing implant. The campaign includes multiple exposed admin panels and infrastructure across several countries, showing that the leaked kit is being actively reused beyond its original operators.","briefOverview":"\u003cp\u003eAn unknown Chinese-speaking threat actor has been observed targeting Apple iOS devices by using a publicly leaked version of the DarkSword exploit kit. Censys identified the actor operating more than 100 web properties, most of them fake AWS sign-in pages on a domain that also hosts the exploit toolkit. The hosting is concentrated in Hong Kong but also extends into Japan, the United States, and Europe.\u003c/p\u003e\n\n\u003cp\u003eDarkSword is a full-chain exploit kit that targets iOS versions 18.4 through 18.7 and has been linked to campaigns affecting Saudi Arabia, Turkey, Malaysia, and Ukraine since at least November 2025. The kit uses watering-hole pages to trigger now-patched Apple vulnerabilities, run JavaScript, and deploy the GHOSTBLADE information-stealing malware. Its use has expanded after the public leak of its source code, allowing additional threat actors to adopt it.\u003c/p\u003e\n\n\u003cp\u003eCensys found multiple related panels, including DarkSword Admin, Decode Dashboard, and C2 Control Panel, as well as hosts tied to fake AWS and Apple ID sign-in pages. The attack flow begins when a victim reaches an operator-controlled domain, which loads a malicious iframe that runs the DarkSword chain and deploys GHOSTBLADE modules. After successful exploitation, the implant dumps keychain, iCloud, and Wi-Fi credentials, exfiltrates files, and sends the collected data to attacker-controlled endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys identified an unknown Chinese-speaking threat actor running more than 100 web properties, most of them fake AWS sign-in pages, on a domain that also hosts the leaked DarkSword exploit toolkit.","DarkSword targets iOS versions 18.4 through 18.7 and uses watering-hole pages to trigger patched Apple vulnerabilities that lead to deployment of the GHOSTBLADE information-stealing malware.","The observed attack flow begins when a victim reaches an operator-controlled AWS-console impersonation subdomain or Apple ID sign-in page, which loads a malicious iframe that fires the DarkSword chain and deploys GHOSTBLADE modules.","After successful exploitation, GHOSTBLADE delivers modules for dumping keychain, iCloud, and Wi-Fi credentials and begins exfiltrating files to attacker-controlled endpoints.","Censys found multiple related panels and infrastructure, including DarkSword Admin, Decode Dashboard, C2 Control Panel, a formerly active Coruna panel, and an open Frankfurt directory exposing operator tooling and references to Thorn C2."],"insights":["The campaign appears to use the publicly leaked DarkSword kit rather than a custom reimplementation, based on a shared staging-page hash and Russian-language code comments preserved from the leaked source.","The same infrastructure cluster blends credential-harvesting decoys, exploit delivery, malware control panels, and data-extraction dashboards, indicating the operator can manage multiple stages of the operation from related hosts.","A Singapore-based host linked to this activity also hosted a Coruna administration panel, showing that the operator’s infrastructure is not limited to DarkSword and overlaps with another iOS exploit kit.","The C2 Control Panel exposed unusually direct attribution clues, including the group name “Asia-Pacific Group” in Chinese and a visible Telegram contact link.","An open directory in Frankfurt exposed operational tooling, including an SSH key comment, a web-content fuzzer, and references to the previously undocumented Thorn C2 malware family."],"referencedReports":[{"title":"DarkSword’s Panel Sprawl","url":"https://censys.com/blog/darkswords-panel-sprawl/","publisher":"Censys","context":"The article is based on Censys researcher Aidan Holland’s analysis of infrastructure tied to a Chinese-speaking operator using the leaked DarkSword iOS exploit kit.","category":"research","primary":true}],"body":"\u003cp\u003eAn unknown Chinese-speaking threat actor has been observed targeting Apple iOS devices by using a publicly leaked version of the DarkSword exploit kit. Censys identified the actor operating more than 100 web properties, most of them fake AWS sign-in pages on a domain that also hosts the exploit toolkit. The hosting is concentrated in Hong Kong but also extends into Japan, the United States, and Europe.\u003c/p\u003e\n\n\u003cp\u003eDarkSword is a full-chain exploit kit that targets iOS versions 18.4 through 18.7 and has been linked to campaigns affecting Saudi Arabia, Turkey, Malaysia, and Ukraine since at least November 2025. The kit uses watering-hole pages to trigger now-patched Apple vulnerabilities, run JavaScript, and deploy the GHOSTBLADE information-stealing malware. Its use has expanded after the public leak of its source code, allowing additional threat actors to adopt it.\u003c/p\u003e\n\n\u003cp\u003eCensys found multiple related panels, including DarkSword Admin, Decode Dashboard, and C2 Control Panel, as well as hosts tied to fake AWS and Apple ID sign-in pages. The attack flow begins when a victim reaches an operator-controlled domain, which loads a malicious iframe that runs the DarkSword chain and deploys GHOSTBLADE modules. After successful exploitation, the implant dumps keychain, iCloud, and Wi-Fi credentials, exfiltrates files, and sends the collected data to attacker-controlled endpoints.\u003c/p\u003e\n"},{"n":35,"title":"Targeted Attack on Government Entities in the Middle East | Part 2","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2","time":"18:47","priority":"MUST READ","score":92,"tldr":"ThreatLabz analyzed BINDCLOAK, a newly documented modular Windows backdoor used in targeted attacks on Middle Eastern government entities and assessed with high confidence to be a variant of OctLurk. The malware uses encrypted TLS-based C2, reflective plugin loading, token abuse, and EDR-evasion techniques, showing a sophisticated East Asia-linked actor expanding operations beyond Central Asia.","briefOverview":"\u003cp\u003eThreatLabz published a technical analysis of BINDCLOAK, a previously undocumented 64-bit modular Windows backdoor written in C++. The backdoor was deployed on victims’ machines during post-compromise activity in a multi-stage attack chain targeting government entities in the Middle East. BINDCLOAK was decrypted and reflectively loaded by the MIXEDKEY loader, which was covered in Part 1 of the research.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz assesses with high confidence that BINDCLOAK is a variant of OctLurk. The assessment is based on key code similarities between BINDCLOAK and OctLurk, as well as shared command-and-control infrastructure. The article also states that the campaign represents an expansion of victimology from Central Asia to the Middle East, with a key focus on the energy vertical.\u003c/p\u003e\n\n\u003cp\u003eBINDCLOAK uses a complex message routing mechanism to manage communication with its command-and-control server over TLS on TCP connections. It generates a host identifier from the computer name and C:\\ volume serial number, sends a beacon containing host information, and encrypts messages using zlib compression and two layers of rolling XOR encoding. The backdoor supports commands for collecting user tokens, starting and stopping modules with user or process tokens, loading plugin DLLs reflectively, and calling SetThreadExecutionState to help prevent the infected machine from entering sleep mode.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BINDCLOAK is a previously undocumented 64-bit modular Windows backdoor written in C++ and deployed on victim machines during post-compromise activity.","BINDCLOAK was decrypted and reflectively loaded by the MIXEDKEY loader in a multi-stage attack chain targeting government entities in the Middle East.","ThreatLabz assesses with high confidence that BINDCLOAK is a variant of OctLurk based on code similarities and shared command-and-control infrastructure.","BINDCLOAK uses a complex message routing mechanism and encrypted TLS-over-TCP communication to manage its command-and-control channel.","The backdoor supports commands for collecting user tokens, starting and stopping modules with user or process tokens, reflectively loading plugin DLLs, and preventing the infected machine from entering sleep mode."],"insights":["BINDCLOAK’s C2 encryption sends the randomly generated second XOR key in cleartext, meaning the confidentiality of its traffic depends mainly on obscurity and the hardcoded first XOR key rather than keeping all encryption material secret.","The plugin loader deliberately routes LoadLibraryW calls through RtlQueueWorkItem to avoid suspicious API calls from unbacked executable memory regions, showing the malware was designed with specific EDR detection logic in mind.","The threat actor’s reuse of the same SSL certificate across cert.hypersnet[.]com and the OctLurk domain about.blsouqs[.]com provides a concrete infrastructure link between BINDCLOAK and previous OctLurk activity.","BINDCLOAK’s GET_STATUS command collects process ownership and token permission details, giving the operator a built-in way to choose processes or credentials for privilege elevation before starting modules.","The campaign’s observed move from Central Asia to Middle Eastern targets, with a focus on the energy vertical, marks an expansion in victimology attributed to the same actor behind OctLurk."],"referencedReports":[],"body":"\u003cp\u003eThreatLabz published a technical analysis of BINDCLOAK, a previously undocumented 64-bit modular Windows backdoor written in C++. The backdoor was deployed on victims’ machines during post-compromise activity in a multi-stage attack chain targeting government entities in the Middle East. BINDCLOAK was decrypted and reflectively loaded by the MIXEDKEY loader, which was covered in Part 1 of the research.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz assesses with high confidence that BINDCLOAK is a variant of OctLurk. The assessment is based on key code similarities between BINDCLOAK and OctLurk, as well as shared command-and-control infrastructure. The article also states that the campaign represents an expansion of victimology from Central Asia to the Middle East, with a key focus on the energy vertical.\u003c/p\u003e\n\n\u003cp\u003eBINDCLOAK uses a complex message routing mechanism to manage communication with its command-and-control server over TLS on TCP connections. It generates a host identifier from the computer name and C:\\ volume serial number, sends a beacon containing host information, and encrypts messages using zlib compression and two layers of rolling XOR encoding. The backdoor supports commands for collecting user tokens, starting and stopping modules with user or process tokens, loading plugin DLLs reflectively, and calling SetThreadExecutionState to help prevent the infected machine from entering sleep mode.\u003c/p\u003e\n"},{"n":6,"title":"ExfilSquad hackers leak info of over 100,000 UK police officers, staff","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/exfilsquad-hackers-leak-info-of-over-100-000-uk-police-officers-staff/","time":"15:04","priority":"MUST READ","score":91,"tldr":"The UK’s Police National Legal Database confirmed a breach exposing names, organizations, and email addresses of over 100,000 police and criminal justice contacts, with ExfilSquad claiming it stole 135,000 records. PNLD says no passwords, credentials, or confidential victim, witness, or offender data were affected.","briefOverview":"\u003cp\u003eA cyberattack on the U.K.\u0026rsquo;s Police National Legal Database compromised contact data of more than 100,000 police officers and other criminal justice professionals. The intrusion was detected on Sunday, July 26, and was later claimed by the ExfilSquad data extortion group. PNLD is an online legal resource service used by the 43 Home Office police forces in England and Wales, as well as the British Transport Police.\u003c/p\u003e\n\n\u003cp\u003ePNLD said the exposed data includes full names, organizations, and email addresses of police officers, staff, criminal justice professionals, and government partners. Names and email addresses of Ask the Police users who submitted a question through the platform are also considered compromised. PNLD said it has found no evidence that passwords or other security credentials were compromised, and that it does not hold confidential information relating to victims, witnesses, or offenders.\u003c/p\u003e\n\n\u003cp\u003eExfilSquad claimed it stole 1.9 GB of data from PNLD, including approximately 135,000 records belonging to 114,000 PNLD subscribers and 21,000 Ask the Police users. The group published sample data to support its claims and demanded a ransom in exchange for not releasing the remaining stolen data. The incident is being investigated with assistance from cybersecurity experts and the National Crime Agency, and the Information Commissioner’s Office has been notified.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A cyberattack on the U.K.'s Police National Legal Database compromised contact data of more than 100,000 police officers and other criminal justice professionals.","PNLD said the exposed data includes full names, organizations, and email addresses of police officers, staff, criminal justice professionals, government partners, and Ask the Police users who submitted questions.","The ExfilSquad data extortion group claimed responsibility for the attack and said it stole 1.9 GB of data containing approximately 135,000 records.","PNLD said it has found no evidence that passwords or other security credentials were compromised and that it does not hold confidential information relating to victims, witnesses, or offenders.","The incident is being investigated with assistance from cybersecurity experts and the National Crime Agency, and the Information Commissioner’s Office has been notified."],"insights":["The breach affected both a police-facing legal resource and the public-facing Ask the Police service, showing that a single PNLD incident exposed contact details from internal professional users and members of the public who submitted questions.","Although PNLD says no passwords or confidential victim, witness, or offender data were affected, the exposed names, organizations, and email addresses still identify police and criminal justice personnel at large scale.","The affected PNLD user base is broad because the service is used by the 43 Home Office police forces in England and Wales as well as the British Transport Police.","ExfilSquad’s claim that it stole 135,000 records is higher than PNLD’s statement that more than 100,000 people were affected, indicating that the attacker’s claimed dataset includes both PNLD subscribers and Ask the Police users."],"referencedReports":[],"body":"\u003cp\u003eA cyberattack on the U.K.\u0026rsquo;s Police National Legal Database compromised contact data of more than 100,000 police officers and other criminal justice professionals. The intrusion was detected on Sunday, July 26, and was later claimed by the ExfilSquad data extortion group. PNLD is an online legal resource service used by the 43 Home Office police forces in England and Wales, as well as the British Transport Police.\u003c/p\u003e\n\n\u003cp\u003ePNLD said the exposed data includes full names, organizations, and email addresses of police officers, staff, criminal justice professionals, and government partners. Names and email addresses of Ask the Police users who submitted a question through the platform are also considered compromised. PNLD said it has found no evidence that passwords or other security credentials were compromised, and that it does not hold confidential information relating to victims, witnesses, or offenders.\u003c/p\u003e\n\n\u003cp\u003eExfilSquad claimed it stole 1.9 GB of data from PNLD, including approximately 135,000 records belonging to 114,000 PNLD subscribers and 21,000 Ask the Police users. The group published sample data to support its claims and demanded a ransom in exchange for not releasing the remaining stolen data. The incident is being investigated with assistance from cybersecurity experts and the National Crime Agency, and the Information Commissioner’s Office has been notified.\u003c/p\u003e\n"},{"n":20,"title":"Hugging Face Diffusers Flaws Could Let Model Repositories Execute Arbitrary Code","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/hugging-face-diffusers-flaws-could-let.html","time":"06:40","priority":"SHOULD READ","score":86,"tldr":"Three high-severity flaws in Hugging Face’s Diffusers library, dubbed FaceHugger, could let malicious model repositories bypass trust_remote_code protections and execute arbitrary code when loaded. Users should upgrade to Diffusers 0.38.0 or only load audited, trusted model snapshots and custom pipelines.","briefOverview":"\u003cp\u003eThree high-severity flaws have been disclosed in Hugging Face’s Diffusers library that could allow crafted model repositories to execute arbitrary code on machines that load them. Zafran Labs researchers Gal Zaban and Ido Shani said the vulnerabilities bypass \u003ccode\u003etrust_remote_code\u003c/code\u003e, a safeguard meant to stop unreviewed code from running during custom pipeline loading. The issues have been collectively named FaceHugger.\u003c/p\u003e\n\n\u003cp\u003eDiffusers is a Python package for pretrained diffusion models used to generate videos, images, and audio, and the article says it was downloaded more than 8.1 million times in July 2026. The article notes that Hugging Face libraries and repositories are prevalent in enterprise environments, including production pipelines, CI/CD systems, and container images. Because of that reach, the researchers warned that routine model loading can become an initial-access vector when repository artifacts are treated as passive data.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities are CVE-2026-44827, CVE-2026-45804, and CVE-2026-44513, involving code injection and a race condition in the \u003ccode\u003eDiffusionPipeline.from_pretrained\u003c/code\u003e loading process. Zafran said the root cause is that the trust check occurs only in the first phase, while model download behavior uses two sequential, non-atomic HTTP requests instead of a single atomic operation. The flaws were addressed in Diffusers version 0.38.0, and maintainers recommended using only trusted and audited sources, avoiding certain cross-repository \u003ccode\u003ecustom_pipeline\u003c/code\u003e use, and inspecting local snapshots for unexpected Python files if patching is not immediately possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three high-severity flaws in Hugging Face’s Diffusers library, collectively named FaceHugger, could allow crafted model repositories to execute arbitrary code on machines that load them.","Zafran Labs researchers said the vulnerabilities bypass the trust_remote_code safeguard that is intended to stop unreviewed code from running during custom pipeline loading.","The flaws are tracked as CVE-2026-44827, CVE-2026-45804, and CVE-2026-44513, and include code injection and race condition issues tied to the DiffusionPipeline.from_pretrained loading process.","The vulnerabilities were addressed in Diffusers version 0.38.0, released in early May 2026, and any user who invokes DiffusionPipeline.from_pretrained with custom pipelines is impacted.","Project maintainers recommended that users who cannot immediately patch only use trusted and audited sources, avoid pointing custom_pipeline to a different Hub repository before reading its pipeline.py, and inspect local snapshots for unexpected Python files."],"insights":["The trust_remote_code safeguard failed because the trust check occurred only in the first phase of loading, while later loading steps could still encounter custom code that had not been checked.","The vulnerabilities stemmed from model downloads being handled as two sequential, non-atomic HTTP requests, which created a window for repository contents or configuration to differ between check and use.","A model repository should not be treated as passive data, because configuration files, loaders, and custom pipeline code can turn a routine model load into code execution.","One workaround specifically targets hidden code placement by requiring inspection for unexpected Python files not only at the snapshot root but also inside component subdirectories such as unet and scheduler.","The affected Diffusers package had more than 8.1 million downloads in July 2026, showing that a flaw in this library can have broad reach across enterprise AI pipelines, CI/CD systems, and container images."],"referencedReports":[{"title":"FaceHugger: Vulnerabilities in Hugging Face Diffusers Open Door to Supply Chain Attacks on Enterprise AI","url":"https://www.zafran.io/resources/facehugger-vulnerabilities-in-hugging-face-diffusers-open-door-to-supply-chain-attacks-on-enterprise-ai","publisher":"Zafran Labs","context":"The article cites Zafran Labs researchers' analysis as the source that disclosed and explained the FaceHugger vulnerabilities in Hugging Face Diffusers.","category":"research","primary":true},{"title":"CVE-2026-44827 / GHSA-j7w6-vpvq-j3gm","url":"https://github.com/advisories/GHSA-j7w6-vpvq-j3gm","publisher":"GitHub Advisory Database","context":"The article links this advisory while listing CVE-2026-44827 as a Diffusers code injection vulnerability with a CVSS score of 8.8.","category":"advisory","primary":false},{"title":"CVE-2026-45804 / GHSA-7wx4-6vff-v64p","url":"https://github.com/advisories/GHSA-7wx4-6vff-v64p","publisher":"GitHub Advisory Database","context":"The article links this advisory while listing CVE-2026-45804 as a Diffusers race condition vulnerability with a CVSS score of 7.5.","category":"advisory","primary":false},{"title":"CVE-2026-44513 / GHSA-98h9-4798-4q5v","url":"https://github.com/advisories/GHSA-98h9-4798-4q5v","publisher":"GitHub Advisory Database","context":"The article links this advisory while listing CVE-2026-44513 as a Diffusers code injection vulnerability with a CVSS score of 8.8.","category":"advisory","primary":false}],"body":"\u003cp\u003eThree high-severity flaws have been disclosed in Hugging Face’s Diffusers library that could allow crafted model repositories to execute arbitrary code on machines that load them. Zafran Labs researchers Gal Zaban and Ido Shani said the vulnerabilities bypass \u003ccode\u003etrust_remote_code\u003c/code\u003e, a safeguard meant to stop unreviewed code from running during custom pipeline loading. The issues have been collectively named FaceHugger.\u003c/p\u003e\n\n\u003cp\u003eDiffusers is a Python package for pretrained diffusion models used to generate videos, images, and audio, and the article says it was downloaded more than 8.1 million times in July 2026. The article notes that Hugging Face libraries and repositories are prevalent in enterprise environments, including production pipelines, CI/CD systems, and container images. Because of that reach, the researchers warned that routine model loading can become an initial-access vector when repository artifacts are treated as passive data.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities are CVE-2026-44827, CVE-2026-45804, and CVE-2026-44513, involving code injection and a race condition in the \u003ccode\u003eDiffusionPipeline.from_pretrained\u003c/code\u003e loading process. Zafran said the root cause is that the trust check occurs only in the first phase, while model download behavior uses two sequential, non-atomic HTTP requests instead of a single atomic operation. The flaws were addressed in Diffusers version 0.38.0, and maintainers recommended using only trusted and audited sources, avoiding certain cross-repository \u003ccode\u003ecustom_pipeline\u003c/code\u003e use, and inspecting local snapshots for unexpected Python files if patching is not immediately possible.\u003c/p\u003e\n"},{"n":25,"title":"Developers in the Crosshairs: Fake AI Tools Deliver Infostealer","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/developers-in-the-crosshairs-fake-ai-tools-deliver-infostealer","time":"18:57","priority":"SHOULD READ","score":86,"tldr":"Attackers are cloning popular AI and developer GitHub repositories to trick users into running a multi-stage SmartLoader chain that delivers infostealers. Both loader stages use Polygon blockchain-based EtherHiding to dynamically resolve C2 infrastructure, making takedowns and blocklisting harder.","briefOverview":"\u003cp\u003eNetskope Threat Labs reports that attackers behind a previously analyzed Malware-as-a-Service NodeJS infostealer have shifted delivery methods from ClickFix-style social engineering to cloned and impersonated GitHub repositories. The repositories imitate popular AI resources and developer tools, including lures related to Claude, ComfyUI, AI coding assistants, Python security guides, and Rust frameworks. The campaign mainly targets AI users and developers in North America, Asia, and Southern Europe, with financial services, banking, and technology sectors leading among affected segments.\u003c/p\u003e\n\n\u003cp\u003eThe malicious download arrives as a four-file zip archive containing a LuaJIT runtime DLL, a renamed LuaJIT interpreter, a batch script, and a text file containing obfuscated Lua code. The first-stage Lua script is identified as Prometheus-obfuscated, while the second-stage script shows structural indicators consistent with MoonSec V3. The payload design makes the harmful behavior appear only when all files are present and launched together, while the text file and interpreter may appear harmless when inspected separately.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses SmartLoader twice in a redundant multi-stage chain, and both loader stages resolve their command-and-control server address from a Polygon smart contract at runtime using EtherHiding. SmartLoader collects geolocation data, captures a screenshot, sends an encrypted beacon, receives tasking, establishes persistence through a scheduled task, and downloads additional payloads from GitHub-hosted files. Netskope states that compromising developer environments is significant because developers often have access to source code, cloud credentials, API keys, code-signing certificates, and CI/CD pipelines, creating the potential for software supply chain attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Threat Labs found ongoing campaigns in which attackers clone and impersonate known GitHub repositories for AI resources and developer tools to deliver a previously analyzed Malware-as-a-Service infostealer.","The campaign targets AI users and developers, with victims mainly in North America, Asia, and Southern Europe and the financial services, banking, and technology sectors leading.","The malicious payload is delivered as a four-file zip archive containing lua51.dll, compiler.exe, Application.bat, and gc.txt, where compiler.exe runs the obfuscated Lua code stored in the text file.","The loader chain uses SmartLoader twice, with the first Lua script obfuscated using Prometheus and the second-stage Lua script showing indicators consistent with MoonSec V3.","Both SmartLoader stages resolve their command-and-control server address at runtime from a Polygon smart contract using EtherHiding, allowing operators to redirect implants by updating the smart contract value."],"insights":["The campaign’s loader chain is intentionally redundant: SmartLoader is deployed twice, and both stages use the same Polygon smart contract to resolve infrastructure, so blocking only one stage may not stop the full infection flow.","The malicious Lua code is stored in a plain text file and only becomes active when executed with the bundled LuaJIT interpreter and DLL, which can evade security checks that inspect files individually rather than as a combined package.","The use of EtherHiding lets the attackers change the command-and-control IP address by updating a smart contract value, allowing them to redirect deployed malware without changing the payload itself.","The first and second loader stages use different Lua obfuscators, Prometheus and likely MoonSec V3, which increases analysis complexity across an otherwise similar attack flow.","The GitHub lures rely on cloned repositories that still appear authentic at the root level and may list the original contributor, making installation instructions and download URLs especially important places to verify."],"referencedReports":[],"body":"\u003cp\u003eNetskope Threat Labs reports that attackers behind a previously analyzed Malware-as-a-Service NodeJS infostealer have shifted delivery methods from ClickFix-style social engineering to cloned and impersonated GitHub repositories. The repositories imitate popular AI resources and developer tools, including lures related to Claude, ComfyUI, AI coding assistants, Python security guides, and Rust frameworks. The campaign mainly targets AI users and developers in North America, Asia, and Southern Europe, with financial services, banking, and technology sectors leading among affected segments.\u003c/p\u003e\n\n\u003cp\u003eThe malicious download arrives as a four-file zip archive containing a LuaJIT runtime DLL, a renamed LuaJIT interpreter, a batch script, and a text file containing obfuscated Lua code. The first-stage Lua script is identified as Prometheus-obfuscated, while the second-stage script shows structural indicators consistent with MoonSec V3. The payload design makes the harmful behavior appear only when all files are present and launched together, while the text file and interpreter may appear harmless when inspected separately.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses SmartLoader twice in a redundant multi-stage chain, and both loader stages resolve their command-and-control server address from a Polygon smart contract at runtime using EtherHiding. SmartLoader collects geolocation data, captures a screenshot, sends an encrypted beacon, receives tasking, establishes persistence through a scheduled task, and downloads additional payloads from GitHub-hosted files. Netskope states that compromising developer environments is significant because developers often have access to source code, cloud credentials, API keys, code-signing certificates, and CI/CD pipelines, creating the potential for software supply chain attacks.\u003c/p\u003e\n"},{"n":2,"title":"New DOUBLECUP ClickFix service hides malware in browser cache images","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-doublecup-clickfix-service-hides-malware-in-browser-cache-images/","time":"20:01","priority":"SHOULD READ","score":84,"tldr":"A new Russian loader-as-a-service called DOUBLECUP is using ClickFix lures to make victims run commands that extract malware hidden in cached PNG images. The campaigns deliver CountLoader on Windows and macOS and a new Windows RAT called DeviceManager, which uses smart contracts and DNS records for resilient command-and-control.","briefOverview":"\u003cp\u003eA new Russian loader-as-a-service named DOUBLECUP uses ClickFix attacks to hide malicious code in PNG images cached by victims’ browsers. SOCRadar says the service has operated since early June 2026 and provides customers with licenses and a Go-based Windows tool for creating malicious campaigns. The attacks ultimately deliver CountLoader to Windows and macOS devices and a new remote access trojan named DeviceManager to Windows systems.\u003c/p\u003e\n\n\u003cp\u003eDOUBLECUP handles infrastructure such as hosting steganographic PNG images, managing session and signal endpoints, providing encryption keys, and automatically rebuilding payloads. Customers create and host the websites that display fake ClickFix prompts, add generated frontend code, and implement any extra obfuscation or anti-analysis measures. SOCRadar observed fake CAPTCHA prompts on login pages impersonating NetSuite, Odoo, HubSpot, and Salesforce, with malicious code loaded through embedded iframes.\u003c/p\u003e\n\n\u003cp\u003eWhen a victim visits one of these sites, DOUBLECUP registers the session, determines the victim’s public IP address, and forces the browser to download and cache a malicious PNG image. If the victim runs the copied command, it searches the browser cache for the PNG by exact file size and uses \u003ccode\u003efindstr\u003c/code\u003e or \u003ccode\u003ecertutil\u003c/code\u003e to recover and execute the hidden first-stage payload. The final payloads include CountLoader, which harvests system information and can download and execute files, and DeviceManager, a Python-based Windows RAT that uses blockchain smart contracts and DNS records for command-and-control activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new Russian loader-as-a-service named DOUBLECUP uses ClickFix attacks to hide malicious code in PNG images cached by victims' browsers.","SOCRadar says DOUBLECUP has operated since early June 2026 and provides customers with licenses and a Go-based Windows tool for creating malicious campaigns.","DOUBLECUP campaigns observed by SOCRadar used fake CAPTCHA prompts on login pages impersonating NetSuite, Odoo, HubSpot, and Salesforce.","When victims run the copied command, it searches the browser cache for the malicious PNG by exact file size and uses findstr or certutil to recover and execute the hidden first-stage payload.","SOCRadar identified DOUBLECUP delivering CountLoader for Windows and macOS and a previously undocumented Python-based Windows RAT called DeviceManager."],"insights":["DOUBLECUP reduces the operational burden for its customers by hosting steganographic PNG images, managing session and signal endpoints, providing encryption keys, and automatically rebuilding payloads, while customers only need to host the lure sites and add the generated code.","The malicious command is customized for the victim’s specific browser, with DOUBLECUP generating commands for Chrome, Edge, Firefox, Brave, and Opera.","The attack ties payload decryption to the victim’s public IPv4 address, which the second-stage dropper uses to create the decryption key for the final encrypted payload.","DeviceManager avoids using a fixed command-and-control address by retrieving its current server IP from Ethereum or Polygon smart contracts through a technique called EtherHiding.","DeviceManager uses DNS A and TXT records not only to steal system information but also to retrieve commands, download payloads, and return command output to attackers."],"referencedReports":[{"title":"DOUBLECUP ClickFix Loader \u0026 DeviceManager RATs","url":"https://socradar.io/blog/doublecup-clickfix-loader-devicemanager-rats/","publisher":"SOCRadar","context":"The article cites a new SOCRadar report as the source for details on DOUBLECUP ClickFix campaigns, steganographic PNG payloads, CountLoader, and DeviceManager RAT.","category":"research","primary":true}],"body":"\u003cp\u003eA new Russian loader-as-a-service named DOUBLECUP uses ClickFix attacks to hide malicious code in PNG images cached by victims’ browsers. SOCRadar says the service has operated since early June 2026 and provides customers with licenses and a Go-based Windows tool for creating malicious campaigns. The attacks ultimately deliver CountLoader to Windows and macOS devices and a new remote access trojan named DeviceManager to Windows systems.\u003c/p\u003e\n\n\u003cp\u003eDOUBLECUP handles infrastructure such as hosting steganographic PNG images, managing session and signal endpoints, providing encryption keys, and automatically rebuilding payloads. Customers create and host the websites that display fake ClickFix prompts, add generated frontend code, and implement any extra obfuscation or anti-analysis measures. SOCRadar observed fake CAPTCHA prompts on login pages impersonating NetSuite, Odoo, HubSpot, and Salesforce, with malicious code loaded through embedded iframes.\u003c/p\u003e\n\n\u003cp\u003eWhen a victim visits one of these sites, DOUBLECUP registers the session, determines the victim’s public IP address, and forces the browser to download and cache a malicious PNG image. If the victim runs the copied command, it searches the browser cache for the PNG by exact file size and uses \u003ccode\u003efindstr\u003c/code\u003e or \u003ccode\u003ecertutil\u003c/code\u003e to recover and execute the hidden first-stage payload. The final payloads include CountLoader, which harvests system information and can download and execute files, and DeviceManager, a Python-based Windows RAT that uses blockchain smart contracts and DNS records for command-and-control activity.\u003c/p\u003e\n"},{"n":19,"title":"18 Malicious npm Packages Deliver Cross-Platform RAT to Alibaba Tool Users","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/18-malicious-npm-packages-deliver-cross.html","time":"18:43","priority":"SHOULD READ","score":84,"tldr":"Researchers found 18 malicious npm packages targeting Alibaba tool users with a cross-platform RAT, using dependency chains that impersonate private Alibaba packages to infect Chinese-speaking developer environments. Anyone who installed the packages should assume compromise, rotate credentials from a clean machine, and audit systems for suspicious activity.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered 18 malicious npm packages targeting users of Alibaba developer tools with a cross-platform remote access trojan. The campaign impersonated private Alibaba-related packages and appears aimed at Chinese-speaking developer environments. One package, lib-mtop, was first published in November 2023 without functionality, but later versions added a loader that fetched and executed a remote JavaScript payload.\u003c/p\u003e\n\n\u003cp\u003eThe attack split malicious functionality across multiple packages in the same dependency tree, with lure packages depending on smart-config-manager as a bridge to lower-layer packages containing loader logic. A rule engine used the vm module to choose payload behavior based on the victim’s operating system, and the payload was retrieved from a domain made to resemble Alibaba infrastructure. On Windows it targeted Alilang, on Linux it downloaded and ran a binary from /tmp, and on macOS it modified ~/.zshrc and created a Launch Agent.\u003c/p\u003e\n\n\u003cp\u003eThe final payload is described as a complex backdoor with command execution, file upload and download, host reconnaissance, payload staging, and lateral movement capabilities. It can also persist by injecting malicious code into enterprise collaboration applications such as DingTalk, Wukong, and Qoder. Users who installed any listed package are advised to assume compromise, rotate sensitive credentials from a clean machine, and audit developer systems for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers discovered 18 malicious npm packages targeting users of Alibaba developer tools with a cross-platform remote access trojan in a targeted software supply chain campaign against Chinese-speaking environments.","The package lib-mtop was published under the same unscoped name as a private Alibaba package, and later versions added a loader that fetches and executes a remote JavaScript payload using curl.","The campaign split malicious loader functionality across multiple packages in the same dependency tree, with top-layer packages impersonating private @ali-scoped packages and smart-config-manager acting as a middle-layer bridge.","The payload behaves differently by operating system, including trojanizing Alilang on Windows, downloading and running a temporary binary on Linux, and adding a background script and Launch Agent on macOS.","Users who installed any of the listed packages are advised to assume compromise, rotate sensitive credentials from a clean machine, and audit developer systems for suspicious activity."],"insights":["The attack hid its malicious loader across several otherwise separate npm packages, meaning a single package may appear harmless unless the full dependency tree is examined together.","The lure packages were designed to work normally in environments that had access to the real private Alibaba packages, while also installing extra malicious dependencies.","The payload download domain was made to resemble Alibaba infrastructure, which could help the activity blend into normal developer network traffic.","The final backdoor included lateral-spread capabilities and persistence through enterprise collaboration applications, so the risk extends beyond the initial developer machine.","The campaign’s low download counts do not necessarily indicate low impact because the packages appear to have been aimed at a narrow set of Alibaba-related developer environments."],"referencedReports":[{"title":"npm RAT Targets Alibaba","url":"https://socket.dev/blog/npm-rat-targets-alibaba","publisher":"Socket","context":"The article cites Socket security researcher Karlo Zanki's analysis as the source for details on the malicious npm packages targeting Alibaba tool users.","category":"research","primary":true},{"title":"Compromised PyPI mrmustard 0.7.4 Credential Stealer","url":"https://www.stepsecurity.io/blog/compromised-pypi-mrmustard-0-7-4-credential-stealer","publisher":"StepSecurity","context":"The article cites StepSecurity's analysis of a poisoned mrmustard Python package that stole credentials and publishing secrets.","category":"research","primary":false},{"title":"mrmustard Malicious PyPI Package","url":"https://safedep.io/mrmustard-malicious-pypi-package/","publisher":"SafeDep","context":"The article references SafeDep's analysis describing persistence mechanisms and credential theft behavior in the malicious mrmustard package.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered 18 malicious npm packages targeting users of Alibaba developer tools with a cross-platform remote access trojan. The campaign impersonated private Alibaba-related packages and appears aimed at Chinese-speaking developer environments. One package, lib-mtop, was first published in November 2023 without functionality, but later versions added a loader that fetched and executed a remote JavaScript payload.\u003c/p\u003e\n\n\u003cp\u003eThe attack split malicious functionality across multiple packages in the same dependency tree, with lure packages depending on smart-config-manager as a bridge to lower-layer packages containing loader logic. A rule engine used the vm module to choose payload behavior based on the victim’s operating system, and the payload was retrieved from a domain made to resemble Alibaba infrastructure. On Windows it targeted Alilang, on Linux it downloaded and ran a binary from /tmp, and on macOS it modified ~/.zshrc and created a Launch Agent.\u003c/p\u003e\n\n\u003cp\u003eThe final payload is described as a complex backdoor with command execution, file upload and download, host reconnaissance, payload staging, and lateral movement capabilities. It can also persist by injecting malicious code into enterprise collaboration applications such as DingTalk, Wukong, and Qoder. Users who installed any listed package are advised to assume compromise, rotate sensitive credentials from a clean machine, and audit developer systems for suspicious activity.\u003c/p\u003e\n"},{"n":1,"title":"New Pass-ta-key attacks let malware hijack Google-synced passkeys","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-pass-ta-key-attacks-let-malware-hijack-google-synced-passkeys/","time":"23:58","priority":"SHOULD READ","score":82,"tldr":"Researchers found three “Pass-ta-key” attacks that let malware already running on a Windows device abuse Google Password Manager’s synced passkeys to bypass verification or extract private keys. The findings show passkeys are still vulnerable when the user’s device is compromised, especially if services fail to properly validate user verification.","briefOverview":"\u003cp\u003eSecurity researchers at Palo Alto Networks\u0026rsquo; Unit 42 discovered three attacks, collectively called \u003cstrong\u003ePass-ta-key\u003c/strong\u003e, that target Google Password Manager in Chrome on already-compromised Windows devices with a Trusted Platform Module. The attacks can abuse Google-synced passkeys to take over accounts, bypass user verification, or extract passkey private keys. The researchers said the attacks do not break passkey cryptography, but instead exploit weaknesses in how Chrome and Google\u0026rsquo;s cloud authenticator handle device trust, onboarding, recovery, and synced credentials.\u003c/p\u003e\n\n\u003cp\u003eThe first Pass-ta-key technique lets unprivileged malware impersonate a trusted device and request a valid authentication response from Google\u0026rsquo;s cloud authenticator without administrator privileges, user interaction, biometrics, or unlocking the device. This can fail when a service properly checks the User Verified flag, as GitHub did, but Unit 42 said it succeeded against eBay because eBay did not properly validate that flag despite requiring user verification. eBay fixed the issue after the researchers reported it.\u003c/p\u003e\n\n\u003cp\u003eThe Silver Pass-ta-key technique allows attackers to register their own user-verification key with Google\u0026rsquo;s cloud authenticator, while the Golden Pass-ta-key technique allows malware to obtain the security domain secret used to encrypt synced passkeys. Unit 42 said Google removed the secret from Chrome\u0026rsquo;s FIDO logs after disclosure, but the secret is still sent to Chrome and remains temporarily accessible in browser process memory. The researchers warned that the stolen master key could decrypt current and future synced passkeys, and recommended that websites properly validate user verification and that credential managers harden device registration, recovery, and master key handling.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks' Unit 42 discovered three attacks, collectively called \"Pass-ta-key,\" that target Google Password Manager in Chrome on already-compromised Windows devi
