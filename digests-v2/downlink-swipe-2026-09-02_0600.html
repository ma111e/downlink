<script type="application/json" id="dl-articles">[{"n":3,"title":"UK Cybercrime Journal: ExfilSquad Emerges","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/09/uk-cybercrime-journal-exfilsquad-emerges.html","time":"09:00","priority":"MUST READ","score":93,"tldr":"ExfilSquad is targeting UK public sector, education, and law enforcement organizations with data-theft-only extortion, exploiting exposed SaaS, CRM, and Microsoft Power Pages configurations rather than deploying ransomware. The key risk is that misconfigured cloud-facing business portals can leak large volumes of sensitive contact and administrative data, which the group then distributes via torrents to increase pressure on victims.","briefOverview":"\u003cp\u003eIn mid-2026, an emerging cybercriminal group called ExfilSquad launched a high-profile extortion campaign against prominent UK organisations in the public sector, education, and law enforcement, as well as other firms worldwide. The group does not use encryptors or destructive malware, but instead steals data and threatens to publish it on an onion-based Data Leak Site if victims do not pay. Confirmed UK victims include the Department for Education, the Police National Legal Database, and Newcastle University.\u003c/p\u003e\n\n\u003cp\u003eThe Department for Education had approximately 600,000 Help Portal records stolen, including parent and staff contact details, along with around 7,000 records from the Turing Portal. The Police National Legal Database lost 1.9 GB of data, including around 135,000 records with contact information for over 100,000 serving police officers, staff, and criminal justice professionals, plus around 21,000 “Ask the Police” public inquiry records. Newcastle University reported approximately 440,000 compromised records involving applicant and student contact information, personally identifiable information, and admissions database records, caused by a technical configuration flaw connected to an admissions system.\u003c/p\u003e\n\n\u003cp\u003eAnalysis of the group’s leak site details indicated that ExfilSquad’s main attack vector involves exploiting misconfigurations in cloud portals, CRM platforms, internal case management systems, and Microsoft Power Pages data tables left publicly accessible without proper authentication. To prove its claims and pressure victims, ExfilSquad uploaded multi-gigabyte torrent files for each victim to its TOR leak site, with Resecurity noting that the group assigns a distinct Torrent Tracker and initial Web Seed per victim. The article says this approach makes leaked files distribute rapidly across peer-to-peer networks and creates lasting risks such as social engineering, spear-phishing, and physical security concerns for affected organisations and individuals.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In mid-2026, the cybercriminal group ExfilSquad launched an extortion campaign targeting prominent UK organizations across the public sector, education, and law enforcement, as well as other firms worldwide.","ExfilSquad operates as a pure data extortion group that steals data and threatens to publish it on its onion-based Data Leak Site if a ransom is not paid, rather than deploying encryptors or destructive malware.","The UK Department for Education, the Police National Legal Database, and Newcastle University confirmed breaches linked to ExfilSquad involving hundreds of thousands of records and, in the PNLD case, data affecting over 100,000 police officers, staff, and criminal justice professionals.","Analysis of ExfilSquad’s leak site details indicated that its primary attack vector involves exploiting misconfigurations in cloud portals, CRM platforms, internal case management systems, and publicly accessible Microsoft Power Pages data tables.","ExfilSquad uploaded multi-gigabyte torrent files for each victim to its TOR leak site and assigned distinct Torrent Trackers and initial Web Seeds per victim."],"insights":["ExfilSquad’s activity shows that organizations can face ransomware-style extortion even when no files are encrypted and no malware is deployed, because exposed cloud and SaaS data can be enough to support a public leak threat.","The article highlights Microsoft Power Pages, CRM databases, helpdesks, admissions portals, and case management systems as high-risk data stores because they often contain large volumes of sensitive contact and interaction records while being internet-facing.","ExfilSquad’s use of separate Torrent Trackers and Web Seeds for each victim makes leaked data harder to contain because distribution can spread rapidly across peer-to-peer networks.","Contact-directory breaches can create lasting real-world risk even when the stolen data is not described as highly sensitive, because exposed names, work emails, and organizational structures can support social engineering, spear-phishing, and physical security threats.","Incident response plans need to account for data-theft-only extortion and torrent-based leak distribution, not just endpoint malware or file-encrypting ransomware scenarios."],"referencedReports":[{"title":"ExfilSquad Targets New Victims, Shares Data via Torrents","url":"https://www.resecurity.com/blog/article/exfilsquad-targets-new-victims-shares-data-via-torrents","publisher":"Resecurity","context":"The article cites Resecurity for the finding that ExfilSquad assigns a distinct Torrent Tracker and initial Web Seed per victim.","category":"research","primary":false},{"title":"Dark Web Profile: ExfilSquad","url":"https://socradar.io/blog/dark-web-profile-exfilsquad/","publisher":"SOCRadar","context":"The article lists this SOCRadar ExfilSquad profile as a relevant CTI source.","category":"research","primary":false},{"title":"Hunting SaaS Threats: Insights for FOR589 Course Cybercriminal Campaigns","url":"https://www.sans.org/blog/hunting-saas-threats-insights-for589-course-cybercriminal-campaigns","publisher":"SANS Institute","context":"The article cites this SANS blog while discussing SaaS platforms as primary targets of English-speaking cybercrime communities.","category":"research","primary":false}],"body":"\u003cp\u003eIn mid-2026, an emerging cybercriminal group called ExfilSquad launched a high-profile extortion campaign against prominent UK organisations in the public sector, education, and law enforcement, as well as other firms worldwide. The group does not use encryptors or destructive malware, but instead steals data and threatens to publish it on an onion-based Data Leak Site if victims do not pay. Confirmed UK victims include the Department for Education, the Police National Legal Database, and Newcastle University.\u003c/p\u003e\n\n\u003cp\u003eThe Department for Education had approximately 600,000 Help Portal records stolen, including parent and staff contact details, along with around 7,000 records from the Turing Portal. The Police National Legal Database lost 1.9 GB of data, including around 135,000 records with contact information for over 100,000 serving police officers, staff, and criminal justice professionals, plus around 21,000 “Ask the Police” public inquiry records. Newcastle University reported approximately 440,000 compromised records involving applicant and student contact information, personally identifiable information, and admissions database records, caused by a technical configuration flaw connected to an admissions system.\u003c/p\u003e\n\n\u003cp\u003eAnalysis of the group’s leak site details indicated that ExfilSquad’s main attack vector involves exploiting misconfigurations in cloud portals, CRM platforms, internal case management systems, and Microsoft Power Pages data tables left publicly accessible without proper authentication. To prove its claims and pressure victims, ExfilSquad uploaded multi-gigabyte torrent files for each victim to its TOR leak site, with Resecurity noting that the group assigns a distinct Torrent Tracker and initial Web Seed per victim. The article says this approach makes leaked files distribute rapidly across peer-to-peer networks and creates lasting risks such as social engineering, spear-phishing, and physical security concerns for affected organisations and individuals.\u003c/p\u003e\n"},{"n":1,"title":"Policy on Paper, Risk in Practice","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/policy-on-paper-risk-in-practice","time":"07:01","priority":"MAY READ","score":55,"tldr":"Most organizations have AI data security policies, but fewer than one in 10 can enforce them consistently in real time across AI tools. The key risk is that sensitive data now moves through prompts, copy-paste, and AI-generated outputs faster than traditional file-based controls can track or block.","briefOverview":"\u003cp\u003eThe article argues that many organizations have AI policies on paper but lack consistent technical enforcement in practice. According to the 2026 Unified Data Security Report, nearly half of surveyed organizations still rely on written policies, post-event monitoring, or inconsistently enforced controls. Only 11% enforce data protection policies in real time across most environments, and for AI tools specifically that figure drops to 8%.\u003c/p\u003e\n\n\u003cp\u003eThe article says this gap matters because AI is becoming embedded in business-critical workflows such as procurement, financial analysis, and customer support, where it can access sensitive operational and customer data. Traditional data protection systems were largely built for files, while sensitive information now often moves through prompts, AI-generated summaries, and copy-pasted excerpts. The article notes that 53% of organizations can consistently govern file uploads to cloud services, but only one in five can apply consistent policy to prompt and text submissions into AI tools.\u003c/p\u003e\n\n\u003cp\u003eThe article says closing the gap requires inline enforcement at the point of action and data protection that still works after AI changes the format of sensitive information. It describes Netskope One Data Security and Netskope One AI Security as connecting discovery, classification, data loss prevention, lineage, and policy enforcement across environments including email, web, SaaS, cloud storage, private applications, and AI tools. It also cites Netskope’s DLP On Demand integration with Claude Enterprise inference hooks, which inspects prompts and tool-call data before they reach the model and returns an allow or deny verdict based on existing DLP profiles.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nearly half of surveyed organizations still rely on written policies, post-event monitoring, or inconsistently enforced controls as their primary approach to data security enforcement.","Only 11% of organizations enforce data protection policies in real time across most environments, and only 8% do so for AI tools specifically.","Although 67% of organizations maintain a formal AI policy, fewer than one in 10 enforce it consistently in AI environments.","Most data protection architectures were built for files, while sensitive information increasingly moves through prompts, AI-generated summaries, and copy-pasted excerpts.","Only one in five organizations can apply consistent policy to prompt and text submissions into AI tools, and fewer than one in ten can recognize sensitive data once it has been modified, reformatted, or partially copied."],"insights":["The article frames AI data risk less as a lack of policy and more as a timing problem: controls that act only after an event are ineffective when sensitive data can be exposed at the moment a prompt is submitted or a response is generated.","AI adoption is moving fastest into business-critical workflows such as procurement, financial analysis, and customer support, while enforcement coverage is weakest in AI environments, creating a mismatch between where sensitive data is used and where controls are applied.","File-focused data protection can give organizations a false sense of coverage because the original file may never move while its sensitive contents still spread through pasted text, summaries, or rewritten AI outputs.","The article suggests that effective AI governance requires recognizing sensitive data even after it changes form, not merely tracking known files or exact content matches.","Netskope’s Claude Enterprise integration is presented as an example of moving enforcement directly into the AI interaction path by checking prompts and tool-call data before they reach the model."],"referencedReports":[{"title":"2026 Unified Data Security Report","url":"https://www.netskope.com/resources/reports-guides/cybersecurity-insiders-2026-unified-data-security-report","publisher":"Cybersecurity Insiders / Netskope","context":"The article cites the report as the source for survey findings about AI policy enforcement and data security governance gaps.","category":"research","primary":true}],"body":"\u003cp\u003eThe article argues that many organizations have AI policies on paper but lack consistent technical enforcement in practice. According to the 2026 Unified Data Security Report, nearly half of surveyed organizations still rely on written policies, post-event monitoring, or inconsistently enforced controls. Only 11% enforce data protection policies in real time across most environments, and for AI tools specifically that figure drops to 8%.\u003c/p\u003e\n\n\u003cp\u003eThe article says this gap matters because AI is becoming embedded in business-critical workflows such as procurement, financial analysis, and customer support, where it can access sensitive operational and customer data. Traditional data protection systems were largely built for files, while sensitive information now often moves through prompts, AI-generated summaries, and copy-pasted excerpts. The article notes that 53% of organizations can consistently govern file uploads to cloud services, but only one in five can apply consistent policy to prompt and text submissions into AI tools.\u003c/p\u003e\n\n\u003cp\u003eThe article says closing the gap requires inline enforcement at the point of action and data protection that still works after AI changes the format of sensitive information. It describes Netskope One Data Security and Netskope One AI Security as connecting discovery, classification, data loss prevention, lineage, and policy enforcement across environments including email, web, SaaS, cloud storage, private applications, and AI tools. It also cites Netskope’s DLP On Demand integration with Claude Enterprise inference hooks, which inspects prompts and tool-call data before they reach the model and returns an allow or deny verdict based on existing DLP profiles.\u003c/p\u003e\n"},{"n":2,"title":"Machinery Cybersecurity Compliance EU Regulation (EU) 2023/1230","source":"radiflow.com","sourceColorIdx":2,"link":"https://www.radiflow.com/ot-cyber-knowledge/machinery-cybersecurity-compliance-eu-regulation-eu-2023-1230/","time":"07:54","priority":"MAY READ","score":45,"tldr":"Radiflow is promoting services to help machinery manufacturers and integrators prepare for the EU Machinery Regulation, which will make cybersecurity part of CE marking requirements from 20 January 2027. The key takeaway is to begin assessment, remediation, and documentation early to avoid compliance delays.","briefOverview":"\u003cp\u003eRadiflow is working with certified security and systems integration partners to help machinery manufacturers, system integrators, and end-users meet new cybersecurity requirements introduced by the EU Machinery Regulation. The article says these requirements apply under Regulation (EU) \u003csup\u003e2023\u003c/sup\u003e\u0026frasl;\u003csub\u003e1230\u003c/sub\u003e. It directs readers to a full brief and invites them to contact Radiflow about OT cybersecurity services.\u003c/p\u003e\n\n\u003cp\u003eThe key date highlighted is 20 January 2027, when cybersecurity becomes part of the Essential Health and Safety Requirements for industrial machinery for the first time. The article says this changes cybersecurity from a best practice into a legal precondition for CE marking and market access across Europe. It emphasizes that assessment, remediation, and documentation take time to complete properly, so starting early can help prevent the deadline from becoming a bottleneck.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Radiflow is working with certified security and systems integration partners to help machinery manufacturers, system integrators, and end-users meet new cybersecurity requirements introduced by the EU Machinery Regulation.","From 20 January 2027, cybersecurity becomes part of the Essential Health and Safety Requirements for industrial machinery for the first time.","The new cybersecurity requirements will make cybersecurity a legal precondition for CE marking and market access across Europe.","Regulation (EU) 2023/1230 enters into force on 20 January 2027.","Radiflow says assessment, remediation, and documentation take time to complete properly, so starting early can help prevent the deadline from becoming a bottleneck."],"insights":["Machinery companies should treat the 20 January 2027 date as a project deadline rather than a paperwork deadline because assessment, remediation, and documentation all need time to complete properly.","The regulation changes cybersecurity from a voluntary best practice into a requirement that can affect whether industrial machinery receives CE marking and can be sold across Europe.","The article frames compliance as relevant not only to machinery manufacturers but also to system integrators and end-users, so multiple parties in the machinery supply chain may need to prepare."],"referencedReports":[],"body":"\u003cp\u003eRadiflow is working with certified security and systems integration partners to help machinery manufacturers, system integrators, and end-users meet new cybersecurity requirements introduced by the EU Machinery Regulation. The article says these requirements apply under Regulation (EU) \u003csup\u003e2023\u003c/sup\u003e\u0026frasl;\u003csub\u003e1230\u003c/sub\u003e. It directs readers to a full brief and invites them to contact Radiflow about OT cybersecurity services.\u003c/p\u003e\n\n\u003cp\u003eThe key date highlighted is 20 January 2027, when cybersecurity becomes part of the Essential Health and Safety Requirements for industrial machinery for the first time. The article says this changes cybersecurity from a best practice into a legal precondition for CE marking and market access across Europe. It emphasizes that assessment, remediation, and documentation take time to complete properly, so starting early can help prevent the deadline from becoming a bottleneck.\u003c/p\u003e\n"}]</script>
