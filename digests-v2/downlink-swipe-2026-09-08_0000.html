if also said it confirmed on 28 August that the exploit was blocked on Tencent’s servers, so the block did not require users to install anything. Neither Calif nor Tencent has published the affected WeChat versions, and there was no CVE identifier or Tencent advisory listed as of 8 September. Calif is withholding technical details and plans to present the full analysis at a conference.\u003c/p\u003e\n"},{"n":21,"title":"French prosecutors confirm arrest of suspected ZeroBytes hacker behind tax cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/france-hacker-arrest-zerobytes","time":"12:30","priority":"SHOULD READ","score":82,"tldr":"French prosecutors confirmed the arrest of an 18-year-old suspected ZeroBytes member accused of participating in cyberattacks on France’s tax authority and other organizations. The suspect, reportedly known as “ChatNoir,” was already under investigation for prior major cyberattacks and now faces charges carrying up to 10 years in prison.","briefOverview":"\u003cp\u003eFrench authorities detained an 18-year-old suspected member of the ZeroBytes hacking group over cyberattacks targeting France’s tax authority and other organizations. The suspect was arrested in the Paris region on August 18 and placed in pretrial detention two days later. A second suspect, who is under 16, was arrested on August 26 and later released while investigators examine his devices.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said the 18-year-old is suspected of participating in attacks against the Directorate General of Public Finances, or DGFiP, which disclosed a data breach in August. The tax authority said an attacker gained unauthorized access in late June by stealing or misusing someone’s identity, allowing them to view and extract information belonging to individuals and businesses. A hacker using the ZeroBytes name later claimed to have stolen information on more than 600,000 people, including names, tax identification numbers, email addresses, family circumstances and tax status details.\u003c/p\u003e\n\n\u003cp\u003eThe suspect was already known to French authorities and had been formally placed under investigation in June 2024 and January 2025 in two separate cyberattack cases allegedly carried out while he was a minor. In the ZeroBytes case, prosecutors are investigating alleged offenses including organized unauthorized access to computer systems containing personal data, stealing and modifying data, participating in a criminal conspiracy and refusing to provide a decryption key. The alleged offenses carry penalties of up to 10 years in prison and a €300,000 fine, and the group is also suspected of targeting several French educational institutions, France Travail, SFR, Intermarché, the French Handball Federation and other organizations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["French authorities detained an 18-year-old suspected member of the ZeroBytes hacking group in the Paris region on August 18, and he was placed in pretrial detention two days later.","The suspect is accused of participating in attacks against France’s Directorate General of Public Finances, which disclosed in August that an attacker had accessed and extracted information from its systems.","A hacker using the ZeroBytes name claimed to have stolen information on more than 600,000 people, including names, tax identification numbers, email addresses, family circumstances, and tax status details.","Prosecutors said the 18-year-old had already been formally placed under investigation in June 2024 and January 2025 in separate cyberattack cases allegedly carried out while he was a minor.","ZeroBytes has claimed or is suspected of attacks against French government agencies, schools, companies, France Travail, SFR, Intermarché, and the French Handball Federation since mid-July."],"insights":["The 18-year-old suspect was already under judicial supervision in two separate cyberattack cases when he was arrested in the ZeroBytes investigation, showing that the new allegations involve someone authorities were already monitoring.","The tax authority breach was described as stemming from stolen or misused identity rather than a disclosed software flaw, making identity misuse a central issue in the incident.","Prosecutors included refusal to provide a decryption key among the alleged offenses, indicating investigators believe access to locked digital evidence is important to the case.","The ZeroBytes investigation involves suspects aged 18 and under 16, while the article also notes other recent French cyber cases involving very young suspects, underscoring the youth of some alleged actors in these incidents."],"referencedReports":[],"body":"\u003cp\u003eFrench authorities detained an 18-year-old suspected member of the ZeroBytes hacking group over cyberattacks targeting France’s tax authority and other organizations. The suspect was arrested in the Paris region on August 18 and placed in pretrial detention two days later. A second suspect, who is under 16, was arrested on August 26 and later released while investigators examine his devices.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said the 18-year-old is suspected of participating in attacks against the Directorate General of Public Finances, or DGFiP, which disclosed a data breach in August. The tax authority said an attacker gained unauthorized access in late June by stealing or misusing someone’s identity, allowing them to view and extract information belonging to individuals and businesses. A hacker using the ZeroBytes name later claimed to have stolen information on more than 600,000 people, including names, tax identification numbers, email addresses, family circumstances and tax status details.\u003c/p\u003e\n\n\u003cp\u003eThe suspect was already known to French authorities and had been formally placed under investigation in June 2024 and January 2025 in two separate cyberattack cases allegedly carried out while he was a minor. In the ZeroBytes case, prosecutors are investigating alleged offenses including organized unauthorized access to computer systems containing personal data, stealing and modifying data, participating in a criminal conspiracy and refusing to provide a decryption key. The alleged offenses carry penalties of up to 10 years in prison and a €300,000 fine, and the group is also suspected of targeting several French educational institutions, France Travail, SFR, Intermarché, the French Handball Federation and other organizations.\u003c/p\u003e\n"},{"n":23,"title":"CIA official touts agency’s Cyber Mission Center in capture of Venezuela’s Maduro","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cia-cyber-operations-maduro-capture-venezuela","time":"19:46","priority":"SHOULD READ","score":82,"tldr":"A CIA official said the agency’s Cyber Mission Center enabled cyber operations that built the intelligence picture used to locate and capture Venezuelan President Nicolás Maduro. He also said AI is expected to increasingly shape CIA cyber, collection, operations, and analysis work.","briefOverview":"\u003cp\u003eCIA Deputy Director Michael Ellis said CIA cyber operators created a “flawless intelligence picture” that led to the capture of Venezuelan President Nicolás Maduro earlier this year. He said Operation Absolute Resolve, in which the U.S. plucked Maduro and his wife from their bunker in Caracas in January, was made possible by cyber operations enabled by the CIA’s Cyber Mission Center. Ellis said that cyber-driven operational picture helped U.S. special forces identify Maduro’s location and apprehend him within four minutes of landing on the ground.\u003c/p\u003e\n\n\u003cp\u003eThe article describes Ellis’ remarks as the most public acknowledgement to date of the role digital resources played in one of the major military operations of the second Trump administration. It also notes that public recognition of CIA cyber activities is rare because they are traditionally among the agency’s most closely held secrets. The U.S. has since unsealed narcoterrorism charges against Maduro and his wife, which they are seeking to dismiss under immunity claims.\u003c/p\u003e\n\n\u003cp\u003eEllis said CIA Director John Ratcliffe elevated the agency’s Center for Cyber Intelligence into its own mission center late last year. According to Ellis, that change focused priority on the cyber mission, better aligned resources, smoothed reporting chains, and helped the agency move more agilely. Ellis also said AI brings speed and scale to cyber operations and is expected to permeate CIA work, with safeguards such as keeping a human in the information loop and avoiding dependence on one model or vendor.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CIA Deputy Director Michael Ellis said CIA cyber operators created a “flawless intelligence picture” that enabled the capture of Venezuelan President Nicolás Maduro earlier this year.","Ellis said Operation Absolute Resolve used cyber-enabled intelligence to help U.S. special forces identify Maduro’s location and apprehend him within four minutes of landing in Caracas.","Ellis’ remarks were described as the most public acknowledgement to date of the role digital resources played in the operation.","CIA Director John Ratcliffe elevated the agency’s Center for Cyber Intelligence into a standalone Cyber Mission Center late last year.","Ellis said AI will bring speed and scale to CIA cyber operations and is expected to change every aspect of intelligence work at the agency."],"insights":["The CIA’s public discussion of cyber’s role in the Maduro operation is notable because the article says the agency’s cyber activities are traditionally among its most closely held secrets.","The elevation of the Center for Cyber Intelligence into a standalone Cyber Mission Center indicates the CIA is reorganizing reporting chains and resources specifically to make cyber operations more agile.","Ellis tied cyber operations directly to a physical special forces mission, showing that digital intelligence was presented as operationally decisive rather than merely supportive.","The CIA is trying to avoid dependence on a single AI model or vendor while still moving quickly to put AI tools in officers’ hands."],"referencedReports":[],"body":"\u003cp\u003eCIA Deputy Director Michael Ellis said CIA cyber operators created a “flawless intelligence picture” that led to the capture of Venezuelan President Nicolás Maduro earlier this year. He said Operation Absolute Resolve, in which the U.S. plucked Maduro and his wife from their bunker in Caracas in January, was made possible by cyber operations enabled by the CIA’s Cyber Mission Center. Ellis said that cyber-driven operational picture helped U.S. special forces identify Maduro’s location and apprehend him within four minutes of landing on the ground.\u003c/p\u003e\n\n\u003cp\u003eThe article describes Ellis’ remarks as the most public acknowledgement to date of the role digital resources played in one of the major military operations of the second Trump administration. It also notes that public recognition of CIA cyber activities is rare because they are traditionally among the agency’s most closely held secrets. The U.S. has since unsealed narcoterrorism charges against Maduro and his wife, which they are seeking to dismiss under immunity claims.\u003c/p\u003e\n\n\u003cp\u003eEllis said CIA Director John Ratcliffe elevated the agency’s Center for Cyber Intelligence into its own mission center late last year. According to Ellis, that change focused priority on the cyber mission, better aligned resources, smoothed reporting chains, and helped the agency move more agilely. Ellis also said AI brings speed and scale to cyber operations and is expected to permeate CIA work, with safeguards such as keeping a human in the information loop and avoiding dependence on one model or vendor.\u003c/p\u003e\n"},{"n":28,"title":"ChatGPT Flaw Let a Planted Prompt Send a Victim's Gmail Data to Another Account","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/chatgpt-flaw-let-planted-prompt-send.html","time":"14:19","priority":"SHOULD READ","score":82,"tldr":"Check Point found that a hidden prompt in a ChatGPT conversation could make the model quietly access a user’s connected Gmail data and pass it to another ChatGPT account through an internal Artifactory-based channel while showing a normal reply. OpenAI reportedly took the internal service behind the channel offline, with no user update required.","briefOverview":"\u003cp\u003eCheck Point Research reported that a single hidden instruction planted in a ChatGPT conversation could make ChatGPT quietly perform work for an attacker while still answering the user normally. In its proof of concept, the hidden work read data from the user’s connected Gmail account and passed it to a second ChatGPT account through a hidden channel between the two. Check Point said the same channel could also copy out the chat history and files in that conversation.\u003c/p\u003e\n\n\u003cp\u003eThe instruction had to be present in the conversation first, through a pasted prompt, a shared ChatGPT conversation, or a custom GPT that stored it in builder instructions not shown to the user. Once present, one ordinary message could start the behavior in Thinking mode, where ChatGPT answered the user while separately checking a hidden mailbox for an attacker’s task and returning the result. The only visible sign was a small “Talked to Gmail” label above the answer, which appeared after the read had already happened.\u003c/p\u003e\n\n\u003cp\u003eThe channel ran between the containers where ChatGPT runs code and used an internal JFrog Artifactory instance that containers could reach to fetch packages. Check Point found that containers could attach and read named properties on stored files, and that those properties were not separated by account, making them act like a shared clipboard between containers. Check Point said it disclosed the finding to OpenAI, and OpenAI confirmed that the internal service behind the channel had been taken offline.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research said a single hidden instruction planted in a ChatGPT conversation could make ChatGPT perform attacker-directed work while still answering the user normally.","In Check Point’s proof of concept, ChatGPT read data from the user’s connected Gmail account and passed it to a second ChatGPT account through a hidden channel, without revealing this in the visible reply.","The planted instruction could be introduced through a prompt the user pastes, a shared ChatGPT conversation the user opens, or a custom GPT that contains it in hidden builder instructions.","The hidden channel used an internal JFrog Artifactory instance whose file properties could be written and read by containers from different ChatGPT accounts.","Check Point said it disclosed the finding to OpenAI and that OpenAI confirmed the internal service behind the channel had been taken offline."],"insights":["The attack did not require stealing a separate secret or escalating privileges because the container’s existing read-access credentials, stored in environment variables, were also enough to write Artifactory file properties.","ChatGPT’s default connected-app permission model allowed Gmail reads without asking the user first, so the only visible indication was a small “Talked to Gmail” label after the read had already occurred.","The hidden instruction could be placed in custom GPT builder instructions that are not shown to the user, making custom GPTs a potential way to deliver the planted prompt without obvious warning.","The cross-account channel worked because Artifactory properties were not separated by account, allowing a value written from one account’s container to be read from another account’s container.","Users who want a prompt before every connected-app use can switch app permissions to “Always ask,” while Business, Enterprise, and Edu admins can control which app actions are allowed and who may use them."],"referencedReports":[{"title":"The Shared Clipboard inside the Sandbox: Cross-Account Data Leakage in ChatGPT","url":"https://research.checkpoint.com/2026/the-shared-clipboard-inside-the-sandbox-cross-account-data-leakage-in-chatgpt/","publisher":"Check Point Research","context":"The article is based on Check Point Research’s report describing how a planted ChatGPT instruction could leak Gmail data and other conversation data across accounts through an internal channel.","category":"research","primary":true}],"body":"\u003cp\u003eCheck Point Research reported that a single hidden instruction planted in a ChatGPT conversation could make ChatGPT quietly perform work for an attacker while still answering the user normally. In its proof of concept, the hidden work read data from the user’s connected Gmail account and passed it to a second ChatGPT account through a hidden channel between the two. Check Point said the same channel could also copy out the chat history and files in that conversation.\u003c/p\u003e\n\n\u003cp\u003eThe instruction had to be present in the conversation first, through a pasted prompt, a shared ChatGPT conversation, or a custom GPT that stored it in builder instructions not shown to the user. Once present, one ordinary message could start the behavior in Thinking mode, where ChatGPT answered the user while separately checking a hidden mailbox for an attacker’s task and returning the result. The only visible sign was a small “Talked to Gmail” label above the answer, which appeared after the read had already happened.\u003c/p\u003e\n\n\u003cp\u003eThe channel ran between the containers where ChatGPT runs code and used an internal JFrog Artifactory instance that containers could reach to fetch packages. Check Point found that containers could attach and read named properties on stored files, and that those properties were not separated by account, making them act like a shared clipboard between containers. Check Point said it disclosed the finding to OpenAI, and OpenAI confirmed that the internal service behind the channel had been taken offline.\u003c/p\u003e\n"},{"n":37,"title":"Compromised Flutter package on pub.dev contains XCSSET malware","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/compromised-flutter-package-on-pub-dev-contains-xcsset-malware","time":"16:12","priority":"SHOULD READ","score":82,"tldr":"A Flutter package on pub.dev, universal_file_viewer version 0.1.5, was accidentally published with XCSSET malware after the maintainer’s Mac was infected. The malicious code sits in the example project build files and mainly threatens developers who clone and build the example, not typical users who add the package as a dependency.","briefOverview":"\u003cp\u003eAikido detected a variant of XCSSET inside universal_file_viewer version 0.1.5, a Flutter file preview package on pub.dev with around 500 downloads. The article says this is the first compromised package Aikido has detected on pub.dev, the official package repository for Dart and Flutter. The maintainer’s machine was infected, and when they published a new version of the package, infected files were included with it.\u003c/p\u003e\n\n\u003cp\u003eThe package’s Dart library code in lib/ is clean, and the infected files are all inside the example/ directory. Simply adding universal_file_viewer to a pubspec.yaml and building an app does not trigger the malware, because the example app is not compiled when the package is used as a dependency. The risk is to someone who clones the repository and explicitly builds the example app locally.\u003c/p\u003e\n\n\u003cp\u003eThe infected example project contains malicious build hooks in Android Gradle and iOS/macOS Xcode project files. These hooks contact command-and-control domains and trigger the XCSSET infection chain during builds. The article describes XCSSET modules that spread through Android Gradle projects, git pre-commit hooks, and Xcode projects, as well as modules for persistence and theft of browser, Telegram, Notes, clipboard, and local file data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido detected a variant of XCSSET inside universal_file_viewer version 0.1.5, a Flutter file preview package on pub.dev with around 500 downloads.","The package’s Dart library code in lib/ is clean, and the infected files are in the example/ directory, so simply adding universal_file_viewer as a dependency does not trigger the malware.","The infection came from the maintainer’s compromised machine, where XCSSET had inserted malicious build hooks into projects that were later published to pub.dev and traced back to a compromised GitHub repository.","The infected example project contains malicious hooks in Android Gradle and iOS/macOS Xcode build files that contact command-and-control domains when the example app is built.","XCSSET includes modules for spreading through Android Gradle projects, git pre-commit hooks, and Xcode projects, as well as modules for persistence and stealing browser, Telegram, Notes, clipboard, and local file data."],"insights":["The practical exposure for most consumers is limited because pub.dev shipped the infected example directory, but dependency builds do not compile that directory unless someone explicitly clones and builds the example app.","XCSSET can contaminate otherwise clean projects indirectly because it injects build hooks into projects already present on an infected developer machine, meaning a later legitimate package release can carry the infection without the maintainer targeting users.","Checking only source library code is insufficient in this case, because the malicious content was hidden in auxiliary build configuration files under Android, iOS, and macOS example projects.","The article provides concrete local hunting targets: Gradle files reconstructing xxd with printf xAxd | tr -d A, Xcode project files containing a PBXBuildRule with sh -c \"${A3EA261}\", and git pre-commit hooks with double base64 or xxd decoding.","The persistence method may evade standard startup-item checks because it replaces the Dock’s Launchpad tile with a fake bundle that runs when the user clicks Launchpad rather than using common persistence locations."],"referencedReports":[{"title":"The Xcode Assassin Returns","url":"https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/","publisher":"Unit 42","context":"The article cites this Unit 42 report for broader context on XCSSET.","category":"research","primary":false},{"title":"New XCSSET malware adds new obfuscation, persistence techniques to infect Xcode projects","url":"https://www.microsoft.com/en-us/security/blog/2025/03/11/new-xcsset-malware-adds-new-obfuscation-persistence-techniques-to-infect-xcode-projects/","publisher":"Microsoft","context":"The article references this Microsoft post as broader context on XCSSET.","category":"research","primary":false},{"title":"XCSSET evolves again: analyzing the latest updates to XCSSET’s inventory","url":"https://www.microsoft.com/en-us/security/blog/2025/09/25/xcsset-evolves-again-analyzing-the-latest-updates-to-xcssets-inventory/","publisher":"Microsoft","context":"The article references this Microsoft post as broader context on XCSSET.","category":"research","primary":false}],"body":"\u003cp\u003eAikido detected a variant of XCSSET inside universal_file_viewer version 0.1.5, a Flutter file preview package on pub.dev with around 500 downloads. The article says this is the first compromised package Aikido has detected on pub.dev, the official package repository for Dart and Flutter. The maintainer’s machine was infected, and when they published a new version of the package, infected files were included with it.\u003c/p\u003e\n\n\u003cp\u003eThe package’s Dart library code in lib/ is clean, and the infected files are all inside the example/ directory. Simply adding universal_file_viewer to a pubspec.yaml and building an app does not trigger the malware, because the example app is not compiled when the package is used as a dependency. The risk is to someone who clones the repository and explicitly builds the example app locally.\u003c/p\u003e\n\n\u003cp\u003eThe infected example project contains malicious build hooks in Android Gradle and iOS/macOS Xcode project files. These hooks contact command-and-control domains and trigger the XCSSET infection chain during builds. The article describes XCSSET modules that spread through Android Gradle projects, git pre-commit hooks, and Xcode projects, as well as modules for persistence and theft of browser, Telegram, Notes, clipboard, and local file data.\u003c/p\u003e\n"},{"n":18,"title":"Scammer behind $245 million crypto heist pleads guilty to RICO charges","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/scammer-behind-245-million-crypto-heist-pleads-guilty-rico","time":"20:52","priority":"SHOULD READ","score":78,"tldr":"Singaporean national Malone Lam pleaded guilty to RICO conspiracy charges for leading the Social Engineering Enterprise, a group accused of stealing more than $245 million in cryptocurrency through social engineering, remote access scams, and physical thefts. He faces a potential 7 to 20 years in prison.","briefOverview":"\u003cp\u003eA Singaporean national, 22-year-old Malone Lam, pleaded guilty to racketeering charges for his role leading a group of scammers who stole more than $245 million in cryptocurrency. Lam is scheduled to appear in U.S. District Court in Washington, D.C., on December 8 for more information on sentencing. Participating in a RICO conspiracy carries a sentence ranging from 7 to 20 years.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Lam, known as “Anne Hathaway” or “$$$,” ran an operation in which he and others used social engineering scams to steal cryptocurrency. In several incidents, group members called cryptocurrency holders while pretending to be customer service or representatives from Apple and Google, eventually convincing victims to provide account details that enabled thefts. The group also gained access to databases of people with large cryptocurrency holdings and either scammed them into providing access to funds or broke into their homes to physically steal devices.\u003c/p\u003e\n\n\u003cp\u003eMembers of the group were previously charged with stealing more than $263 million worth of cryptocurrency from one victim in Washington, D.C., after convincing the victim to download a remote desktop program and using that access to steal account information. At least nine other people have pleaded guilty as part of the Justice Department’s takedown of the group, known as the Social Engineering Enterprise. Prosecutors said the group divided responsibilities among database hackers, target identifiers, callers, money launderers, and residential burglars who targeted hardware cryptocurrency wallets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Singaporean national Malone Lam, 22, pleaded guilty to racketeering charges for his role leading a group of scammers who stole more than $245 million in cryptocurrency.","Lam is scheduled to appear in U.S. District Court in Washington, D.C. on December 8 for more information on sentencing, and participating in a RICO conspiracy carries a sentence ranging from 7 to 20 years.","Prosecutors said Lam, known as “Anne Hathaway” or “$$$,” ran an operation where members conducted social engineering scams by pretending to be customer service or representatives from Apple and Google to obtain victims’ account details.","The group also gained access to databases of people with large cryptocurrency holdings and either scammed them into providing access to funds or broke into homes to physically steal devices.","At least nine other people have pleaded guilty as part of the Justice Department’s takedown of the group known as the Social Engineering Enterprise."],"insights":["The group combined online deception with physical home burglaries, showing that its cryptocurrency theft operation was not limited to remote account takeovers.","Prosecutors described a structured division of labor inside the Social Engineering Enterprise, with separate roles for database hackers, target identifiers, callers, money launderers and residential burglars.","Lam drew law enforcement scrutiny partly because prosecutors said he converted stolen cryptocurrency into highly visible luxury spending, including Hamptons vacations, cars and private jets.","Members of the group reportedly became concerned about Lam’s attempts to launder large portions of the $263 million theft and his public boasting about it, suggesting internal behavior helped expose the operation."],"referencedReports":[],"body":"\u003cp\u003eA Singaporean national, 22-year-old Malone Lam, pleaded guilty to racketeering charges for his role leading a group of scammers who stole more than $245 million in cryptocurrency. Lam is scheduled to appear in U.S. District Court in Washington, D.C., on December 8 for more information on sentencing. Participating in a RICO conspiracy carries a sentence ranging from 7 to 20 years.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Lam, known as “Anne Hathaway” or “$$$,” ran an operation in which he and others used social engineering scams to steal cryptocurrency. In several incidents, group members called cryptocurrency holders while pretending to be customer service or representatives from Apple and Google, eventually convincing victims to provide account details that enabled thefts. The group also gained access to databases of people with large cryptocurrency holdings and either scammed them into providing access to funds or broke into their homes to physically steal devices.\u003c/p\u003e\n\n\u003cp\u003eMembers of the group were previously charged with stealing more than $263 million worth of cryptocurrency from one victim in Washington, D.C., after convincing the victim to download a remote desktop program and using that access to steal account information. At least nine other people have pleaded guilty as part of the Justice Department’s takedown of the group, known as the Social Engineering Enterprise. Prosecutors said the group divided responsibilities among database hackers, target identifiers, callers, money launderers, and residential burglars who targeted hardware cryptocurrency wallets.\u003c/p\u003e\n"},{"n":20,"title":"Where the backlash against Flock Safety is having the biggest impact","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/flock-safety-backlash-places-with-biggest-impact","time":"14:03","priority":"SHOULD READ","score":78,"tldr":"Backlash against Flock Safety’s license plate reader surveillance is accelerating, with Florida and Texas imposing major restrictions and more than 90 local governments ending contracts in August alone. Privacy concerns, alleged police misuse, and faulty vehicle flags are driving reviews, protests, and contract terminations across the U.S.","briefOverview":"\u003cp\u003eA growing number of jurisdictions are cutting ties with Flock Safety amid community protests and reports of police abuse involving its automated license plate reader cameras. Secure Justice found that more than 90 cities and counties terminated Flock contracts in August alone, and it has tracked more than 200 municipal terminations since 2021. The article says the backlash has been building for more than a year and has recently reached a tipping point with major restrictions in Texas and Florida.\u003c/p\u003e\n\n\u003cp\u003eFlorida’s Department of Transportation barred automated license plate readers, including Flock cameras, from state highways after Gov. Ron DeSantis criticized the technology as a privacy threat. In Texas, Gov. Greg Abbott blocked state agencies from using public funds for Flock cameras after a report said a state agency secretly used $30 million from a car insurance tax to pay for a Flock camera network. Several Florida sheriffs and Texas local governments have since ended Flock contracts.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights local flashpoints in Los Angeles and Atlanta. The Los Angeles Police Department said it would not renew its Flock contract, citing concerns including data ownership terms and an audit alleging 161 car owners were probed after mistaken stolen-vehicle flags. In Atlanta, Mayor Andre Dickens ordered a 30-day review of Flock camera use after reports of abuse, protests outside Flock’s annual conference, and concerns in a metro area reportedly operating about 5,000 cameras.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["More than 90 cities and counties nationwide terminated Flock Safety contracts in August, according to an analysis by Secure Justice.","The Florida Department of Transportation announced on August 31 that it is barring automated license plate readers, including Flock Safety cameras, from state highways.","Texas Gov. Greg Abbott blocked state agencies from using public money to fund Flock cameras after a report said a state agency had secretly used $30 million from a car insurance tax for a Flock camera network.","The Los Angeles Police Department said in July that it would not renew its Flock contract, citing concerns including contract terms giving Flock ownership of collected data.","Atlanta Mayor Andre Dickens ordered a 30-day review of Flock cameras after reports of police abuse of the system and protests outside Flock Safety’s annual conference."],"insights":["The backlash has expanded beyond traditionally privacy-focused large cities to Republican-led states such as Florida and Texas, showing that opposition to Flock Safety is crossing usual political lines.","State-level restrictions appear to be accelerating local action, as several Florida sheriffs and Texas cities or counties ended Flock contracts shortly after DeSantis’s comments and Abbott’s order.","Concerns about Flock are not limited to privacy in principle; the article cites alleged misuse by police officers, mistaken stolen-vehicle flags in Los Angeles, and disputes over who owns collected data.","Atlanta is a focal point for both Flock’s business presence and public opposition, with the company based there, about 5,000 cameras reportedly operating in the metro area, and protests held during its annual conference."],"referencedReports":[{"title":"Secure Justice analysis of Flock contract terminations","url":"https://docs.google.com/spreadsheets/d/1qgmQYKZKVMPU5mxcP3wGYAW9zR-I6Cfe/edit?gid=696227748#gid=696227748","publisher":"Secure Justice","context":"The article cites Secure Justice’s analysis showing that more than 90 cities and counties terminated Flock contracts in August and more than 200 municipal terminations have been tracked since 2021.","category":"research","primary":true},{"title":"Los Angeles city inspector general audit of LAPD Flock use","url":"https://www.lapdpolicecom.lacity.org/071426/BPC_26-184x.pdf","publisher":"Los Angeles city inspector general","context":"The article references an audit alleging that the LAPD probed 161 car owners in a two-month period after Flock mistakenly flagged their vehicles as stolen.","category":"research","primary":false}],"body":"\u003cp\u003eA growing number of jurisdictions are cutting ties with Flock Safety amid community protests and reports of police abuse involving its automated license plate reader cameras. Secure Justice found that more than 90 cities and counties terminated Flock contracts in August alone, and it has tracked more than 200 municipal terminations since 2021. The article says the backlash has been building for more than a year and has recently reached a tipping point with major restrictions in Texas and Florida.\u003c/p\u003e\n\n\u003cp\u003eFlorida’s Department of Transportation barred automated license plate readers, including Flock cameras, from state highways after Gov. Ron DeSantis criticized the technology as a privacy threat. In Texas, Gov. Greg Abbott blocked state agencies from using public funds for Flock cameras after a report said a state agency secretly used $30 million from a car insurance tax to pay for a Flock camera network. Several Florida sheriffs and Texas local governments have since ended Flock contracts.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights local flashpoints in Los Angeles and Atlanta. The Los Angeles Police Department said it would not renew its Flock contract, citing concerns including data ownership terms and an audit alleging 161 car owners were probed after mistaken stolen-vehicle flags. In Atlanta, Mayor Andre Dickens ordered a 30-day review of Flock camera use after reports of abuse, protests outside Flock’s annual conference, and concerns in a metro area reportedly operating about 5,000 cameras.\u003c/p\u003e\n"},{"n":24,"title":"Italian tech collective Autistici/Inventati shuts down after US terrorist designation","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/autistici-inventati-shuts-down-after-us-terrorist-designation","time":"19:12","priority":"SHOULD READ","score":78,"tldr":"Italian privacy-focused tech collective Autistici/Inventati says it will shut down after the U.S. designated it a terrorist organization, triggering sanctions risks, domain suspension, and loss of banking access. The move raises broader concerns in Europe about U.S. control over internet infrastructure and the vulnerability of non-commercial privacy services to political sanctions.","briefOverview":"\u003cp\u003eItalian technology collective Autistici/Inventati announced Sunday that it will shut down operations after the U.S. government declared it a terrorist organization and imposed sanctions. The volunteer-run collective, founded in 2001, provided free privacy-focused services including about 16,000 email addresses, 1,500 websites, 5,500 mailing lists, and a network of around 10,000 blogs. The State Department labeled A/I an “extremist group” operating infrastructure for “far-left militants across the world,” while the collective said the designation was unjust and arbitrary.\u003c/p\u003e\n\n\u003cp\u003eThe designation had immediate operational effects on the collective’s infrastructure and finances. The U.S.-based Public Interest Registry suspended the group’s .org domain on August 28, and the Italian bank Banca Etica suspended its account over sanctions risks while saying it condemned the use of OFAC listings for political purposes. A/I said it would instruct users on how to back up content from blogs, mailboxes, and websites because it could no longer maintain its mission of offering secure and non-commercial digital tools under the circumstances.\u003c/p\u003e\n\n\u003cp\u003eThe shutdown affects users who relied on A/I as an online home, including people with long-running blogs on the Noblogs platform. Digital rights advocates and supporters said the case raises concerns about European sovereignty, U.S. influence over internet infrastructure, and the precedent for non-commercial hosts, registrars, and privacy-preserving services. Anne Roth, a digital policy advisor in the German Parliament, said the response showed how internet governance structures can fall apart after a U.S. designation made without a judicial procedure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Italian technology collective Autistici/Inventati announced it will shut down after the U.S. government declared it a terrorist organization and imposed sanctions.","The U.S. State Department labeled Autistici/Inventati an extremist group that provided digital infrastructure for far-left militants, but did not accuse the collective itself of organizing violent activity.","The designation quickly led the U.S.-based Public Interest Registry to suspend the group’s .org domain and Banca Etica to suspend its bank account over sanctions risks.","Autistici/Inventati said it could no longer maintain its mission of offering secure, non-commercial digital tools because its work could create legal and financial consequences for people connected to it.","Supporters and digital rights advocates said the case raises concerns about European digital sovereignty and the precedent it sets for non-commercial hosts, registrars, and privacy-preserving services."],"insights":["The sanctions had practical effects almost immediately through private infrastructure providers, with the .org domain operator and the collective’s bank taking action within two days of the State Department designation.","The State Department’s action affected a large user base beyond the accused political groups, including about 16,000 email addresses, 1,500 websites, 5,500 mailing lists, and 10,000 blogs hosted by the collective.","The case shows how dependence on U.S.-linked internet governance can affect European services, since a U.S.-based domain registry suspension helped disrupt an Italian collective’s operations.","Banca Etica’s response highlighted the pressure sanctions create for service providers, as it suspended the account over risk while publicly condemning the political use of OFAC listings.","Long-running user content became difficult to manage even when still readable, as Anne Roth said her nearly two decades of Noblogs posts remained online but she could not access the administration tools."],"referencedReports":[],"body":"\u003cp\u003eItalian technology collective Autistici/Inventati announced Sunday that it will shut down operations after the U.S. government declared it a terrorist organization and imposed sanctions. The volunteer-run collective, founded in 2001, provided free privacy-focused services including about 16,000 email addresses, 1,500 websites, 5,500 mailing lists, and a network of around 10,000 blogs. The State Department labeled A/I an “extremist group” operating infrastructure for “far-left militants across the world,” while the collective said the designation was unjust and arbitrary.\u003c/p\u003e\n\n\u003cp\u003eThe designation had immediate operational effects on the collective’s infrastructure and finances. The U.S.-based Public Interest Registry suspended the group’s .org domain on August 28, and the Italian bank Banca Etica suspended its account over sanctions risks while saying it condemned the use of OFAC listings for political purposes. A/I said it would instruct users on how to back up content from blogs, mailboxes, and websites because it could no longer maintain its mission of offering secure and non-commercial digital tools under the circumstances.\u003c/p\u003e\n\n\u003cp\u003eThe shutdown affects users who relied on A/I as an online home, including people with long-running blogs on the Noblogs platform. Digital rights advocates and supporters said the case raises concerns about European sovereignty, U.S. influence over internet infrastructure, and the precedent for non-commercial hosts, registrars, and privacy-preserving services. Anne Roth, a digital policy advisor in the German Parliament, said the response showed how internet governance structures can fall apart after a U.S. designation made without a judicial procedure.\u003c/p\u003e\n"},{"n":36,"title":"A Salary Portal Phish With No Attacker Domain In It","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/fake-salary-portal-four-hop-google-redirect-autodiscover-landing","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A targeted salary-increase phishing email used only trusted infrastructure, chaining Microsoft SafeLinks and Google open redirects to an abused third-party host while hiding the victim’s email address in a split base64 URL path. The key takeaway is that clean link scans and email authentication passes can still miss credential-harvesting attacks when attackers borrow legitimate services and reputation.","briefOverview":"\u003cp\u003eA national sales director at a fresh produce and food manufacturing company received a fake internal HR email about a salary increase. The visible message was sparse, using the company name, the recipient’s full name, and a single “Visit Portal” button to imply a legitimate salary portal notice. The message was sent from a real mailbox at a small law firm unrelated to the recipient’s company, and the landing page was hosted on a British production company’s domain that was also unrelated to the lure.\u003c/p\u003e\n\n\u003cp\u003eThe button led through four hops: an Outlook SafeLinks rewrite, a Google Meet \u003ccode\u003elinkredirect\u003c/code\u003e endpoint, a Google URL redirector, and then a final host on the unrelated production company’s domain. No attacker-registered domain appeared anywhere in the chain, and all five extracted links returned scanner verdicts of clean or not applicable. The final host used \u003ccode\u003eautodiscover\u003c/code\u003e as both a subdomain label and path segment, making the destination look like Microsoft mail configuration plumbing while serving a salary-themed phishing lure.\u003c/p\u003e\n\n\u003cp\u003eThe final URL path included the recipient’s own email address encoded in base64 and split across tilde-separated chunks, allowing per-victim tracking and personalization while avoiding simple checks for plaintext addresses or obvious base64 blobs. The message initially failed SPF and DMARC from a Lithuania-geolocated hosting IP, but a later hop passed authentication through Microsoft 365 even though DKIM was absent and the sending domain’s DMARC policy was \u003ccode\u003enone\u003c/code\u003e. The article says the decisive detection came from the recipient reporting the message himself, after which an analyst confirmed it as phishing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A national sales director at a fresh produce and food manufacturing company received a fake internal HR salary increase email with a single “Visit Portal” button.","The button led through four hops: an Outlook SafeLinks rewrite, a Google Meet open redirector, a Google URL redirector, and a final host on an unrelated British production company’s domain.","The final URL used an `autodiscover` subdomain and path segment and included the recipient’s own email address encoded in base64 and split across tilde-separated chunks.","The message was sent from a real mailbox at a small law firm, and the article says no attacker-registered domain appeared anywhere in the link chain.","All five extracted links returned clean or not applicable scanner verdicts, and the recipient himself reported the message before an analyst confirmed it as phishing."],"insights":["The absence of any attacker-owned domain made domain age and reputation checks largely ineffective, because every visible host in the chain belonged to Microsoft, Google, or an unrelated legitimate business.","Splitting the base64-encoded recipient address across separator characters can evade simple detections that look for either plaintext email addresses or continuous base64 strings in URLs.","A delivery-time authentication pass did not prove the message content was trustworthy, because DKIM was absent and the sending domain’s DMARC policy was set to take no action on failures.","Near-invisible filler text was used to dilute the message’s statistical fingerprint while remaining hidden from the recipient, showing why the visible email body alone may not reflect what filters evaluate.","The recipient’s manual report was decisive even though link scanners marked the extracted links clean or not applicable, highlighting the value of user reporting when trusted infrastructure is abused."],"referencedReports":[{"title":"User Execution: Malicious Link","url":"https://attack.mitre.org/techniques/T1204/001/","publisher":"MITRE ATT\u0026CK","context":"The article cites this MITRE ATT\u0026CK technique when describing the four-hop redirect chain that required the recipient to click a link.","category":"research","primary":false},{"title":"Phishing: Spearphishing Link","url":"https://attack.mitre.org/techniques/T1566/002/","publisher":"MITRE ATT\u0026CK","context":"The article maps the fake salary portal email to this MITRE ATT\u0026CK technique because the payload was a spearphishing link.","category":"research","primary":false},{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article references the report for statistics attributing 16% of breaches to phishing as the initial access vector and 39% to credentials somewhere in the kill chain.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article points to this guidance for running the phishing reporting loop after noting that the recipient reported the message himself.","category":"guide","primary":false}],"body":"\u003cp\u003eA national sales director at a fresh produce and food manufacturing company received a fake internal HR email about a salary increase. The visible message was sparse, using the company name, the recipient’s full name, and a single “Visit Portal” button to imply a legitimate salary portal notice. The message was sent from a real mailbox at a small law firm unrelated to the recipient’s company, and the landing page was hosted on a British production company’s domain that was also unrelated to the lure.\u003c/p\u003e\n\n\u003cp\u003eThe button led through four hops: an Outlook SafeLinks rewrite, a Google Meet \u003ccode\u003elinkredirect\u003c/code\u003e endpoint, a Google URL redirector, and then a final host on the unrelated production company’s domain. No attacker-registered domain appeared anywhere in the chain, and all five extracted links returned scanner verdicts of clean or not applicable. The final host used \u003ccode\u003eautodiscover\u003c/code\u003e as both a subdomain label and path segment, making the destination look like Microsoft mail configuration plumbing while serving a salary-themed phishing lure.\u003c/p\u003e\n\n\u003cp\u003eThe final URL path included the recipient’s own email address encoded in base64 and split across tilde-separated chunks, allowing per-victim tracking and personalization while avoiding simple checks for plaintext addresses or obvious base64 blobs. The message initially failed SPF and DMARC from a Lithuania-geolocated hosting IP, but a later hop passed authentication through Microsoft 365 even though DKIM was absent and the sending domain’s DMARC policy was \u003ccode\u003enone\u003c/code\u003e. The article says the decisive detection came from the recipient reporting the message himself, after which an analyst confirmed it as phishing.\u003c/p\u003e\n"},{"n":42,"title":"Token Analysis and Tracking System (TATS)","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/09/08/token-analysis-and-tracking-system-tats/","time":"17:30","priority":"SHOULD READ","score":78,"tldr":"TATS is an open-source tool for collecting, decoding, and visualizing OAuth token exchanges, with special support for Microsoft cloud behaviors like brokered client IDs and FOCI. Early use revealed Microsoft token audience mismatches and a Conditional Access gap where pre-MFA tokens can sometimes be exchanged for access to nested services that lack explicit MFA policies.","briefOverview":"\u003cp\u003eThe article introduces Token Analysis and Tracking System, or TATS, a tool for collecting, storing, decoding, analyzing, and visually tracking OAuth token exchanges. The author built it after finding manual token tracking in Burp slow, tedious, and difficult to scale during research into Microsoft cloud token behavior. TATS is intended for research and education, and it was designed to account for known OAuth deviations in the Microsoft ecosystem while also working with any OAuth implementation.\u003c/p\u003e\n\n\u003cp\u003eTATS can ingest data from Burp exports, live Chrome DevTools Protocol browser tracking, and mitmproxy files, then display token activity in a database-backed web GUI. The interface includes a summary dashboard, token inventory, refresh token exchange view, Microsoft-specific FOCI and BroCI sections, and graph and sequence visualizations. It can also enrich token information with application data from entrascopes, redact selected claims, and optionally store full token values for export and command generation.\u003c/p\u003e\n\n\u003cp\u003eUsing TATS, the author found cases where tokens with an audience claim for management.core.windows.net were presented to resources such as management.azure.com or portal.azure.com. The author also found that refresh and access tokens were issued before MFA was completed, and that an Azure Portal token without MFA in its authentication method claim could be exchanged for a key vault token when the key vault did not have an explicit Conditional Access Policy requiring MFA. When the author created a new Conditional Access Policy and repeated the exchange, the policy blocked access, showing that relying only on Microsoft’s MFA requirement for admin portals can leave gaps for nested applications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TATS is a tool that collects, stores, decodes, analyzes, and visually tracks OAuth token exchanges, with support for known OAuth deviations in the Microsoft ecosystem and other OAuth implementations.","TATS can ingest token data from Burp exports, live Chrome DevTools Protocol browser tracking, and mitmproxy files, then display the results in a web GUI backed by a database.","The TATS web interface includes a summary dashboard, token inventory, refresh token exchange tracking, Microsoft-specific FOCI and BroCI views, and graph and sequence visualizations of token exchanges.","Using TATS, the author observed tokens with the audience claim management.core.windows.net being presented to resources such as management.azure.com or portal.azure.com.","The author found that tokens could be issued before MFA was completed and that an Azure Portal token without an MFA authentication method could be exchanged for a key vault token when the key vault lacked an explicit Conditional Access Policy requiring MFA."],"insights":["TATS became significantly more useful when it moved from static Burp exports to live Chrome DevTools Protocol and mitmproxy capture, because this allowed token information to appear nearly live and better handled browser and web socket activity.","The article shows that relying on Microsoft’s mandatory MFA requirement for admin portals can still leave gaps, because related nested applications such as key vault may need their own explicit Conditional Access Policies requiring MFA.","The audience mismatch tracking in TATS exposed cases where tokens appeared to be used against hosts that did not match the token’s stated audience, which the author describes as contrary to expected OAuth behavior.","The `--store-tokens` option is intentionally disabled by default because storing full token values improves export and command generation but increases the sensitivity of the collected database."],"referencedReports":[],"body":"\u003cp\u003eThe article introduces Token Analysis and Tracking System, or TATS, a tool for collecting, storing, decoding, analyzing, and visually tracking OAuth token exchanges. The author built it after finding manual token tracking in Burp slow, tedious, and difficult to scale during research into Microsoft cloud token behavior. TATS is intended for research and education, and it was designed to account for known OAuth deviations in the Microsoft ecosystem while also working with any OAuth implementation.\u003c/p\u003e\n\n\u003cp\u003eTATS can ingest data from Burp exports, live Chrome DevTools Protocol browser tracking, and mitmproxy files, then display token activity in a database-backed web GUI. The interface includes a summary dashboard, token inventory, refresh token exchange view, Microsoft-specific FOCI and BroCI sections, and graph and sequence visualizations. It can also enrich token information with application data from entrascopes, redact selected claims, and optionally store full token values for export and command generation.\u003c/p\u003e\n\n\u003cp\u003eUsing TATS, the author found cases where tokens with an audience claim for management.core.windows.net were presented to resources such as management.azure.com or portal.azure.com. The author also found that refresh and access tokens were issued before MFA was completed, and that an Azure Portal token without MFA in its authentication method claim could be exchanged for a key vault token when the key vault did not have an explicit Conditional Access Policy requiring MFA. When the author created a new Conditional Access Policy and repeated the exchange, the policy blocked access, showing that relying only on Microsoft’s MFA requirement for admin portals can leave gaps for nested applications.\u003c/p\u003e\n"},{"n":46,"title":"ClickFix moves into the browser: Cryptocurrency theft with Google-hosted C2","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/clickfix-moves-into-the-browser/","time":"10:00","priority":"SHOULD READ","score":78,"tldr":"Cisco Talos uncovered a ClickFix-style cryptocurrency theft campaign that tricks users into pasting malicious JavaScript into Chrome or Tampermonkey, then uses Google Sheets’ Visualization API as C2 to inject a web skimmer. The script replaces legitimate crypto deposit addresses and clipboard contents with attacker-controlled wallets while displaying fake bonus offers.","briefOverview":"\u003cp\u003eCisco Talos tracked a cryptocurrency-stealing campaign that used ClickFix-style social engineering to persuade targets to run malicious JavaScript in their own browser sessions. The lures posed as leaked reports of nonexistent API flaws at cryptocurrency swap services that would supposedly increase trade payouts. Early versions instructed users to paste code into Chrome’s address bar, while later versions instructed them to install the Tampermonkey extension and add a script that persisted when visiting SimpleSwap.\u003c/p\u003e\n\n\u003cp\u003eThe first-stage script retrieved obfuscated payload components from a publicly published Google Sheets document through Google’s Visualization API, then assembled and injected them into the targeted site. The resulting web-skimming script altered transaction interfaces, replaced legitimate deposit addresses in browser responses and copied clipboard data with attacker-controlled Bitcoin addresses, and displayed fake bonus-related interface elements. Talos identified 49 Bitcoin wallets associated with the campaign; 24 of 30 commonly used addresses received a combined 0.159 BTC, approximately $10,000 at early August 2026 valuations, and the actors repeatedly restored components after disruption by changing Google Sheets, Google Docs, or paste.sh content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos tracked a cryptocurrency-stealing campaign that used Google Sheets’ Visualization API to retrieve obfuscated JavaScript and inject it into victims’ browser sessions.","The campaign used ClickFix-style lures claiming nonexistent cryptocurrency exchange API flaws and instructed targets to paste JavaScript into Chrome or install a script through the Tampermonkey extension.","The injected scripts modified cryptocurrency trading pages by replacing legitimate deposit addresses in page responses and copied clipboard contents with attacker-controlled Bitcoin wallet addresses.","Talos collected 21 unique second-stage payloads and identified 49 Bitcoin wallet addresses associated with the campaign.","Twenty-four of 30 commonly used wallet addresses received a combined 0.159 BTC from victims between the observed samples, valued at approximately $10,000 in early August 2026."],"insights":["The campaign shifted from asking users to run code once in Chrome’s address bar to using Tampermonkey, allowing the malicious script to run again whenever the victim visited the targeted trading site.","Google Sheets’ publicly accessible Visualization API let the attackers deliver changing payloads through normal browser requests to docs.google.com, making the activity resemble legitimate web traffic.","The attackers concealed payloads in the spreadsheet by formatting text as white on a white background and moving hidden cells farther down as they added revisions.","After reported campaign components were blocked, the operators restored the operation within about a week by switching to a new Google Sheet and paste.sh script."],"referencedReports":[{"title":"Swapzone Profit Trick: Web Inject From Lure to Live DOM Hijack","url":"https://bolster.ai/blog/swapzone-profit-trick-web-inject-from-lure-to-live-dom-hijack","publisher":"bolster","context":"The article cites this researcher-documented analysis as evidence that early versions of the campaign began in October 2025.","category":"research","primary":false}],"body":"\u003cp\u003eCisco Talos tracked a cryptocurrency-stealing campaign that used ClickFix-style social engineering to persuade targets to run malicious JavaScript in their own browser sessions. The lures posed as leaked reports of nonexistent API flaws at cryptocurrency swap services that would supposedly increase trade payouts. Early versions instructed users to paste code into Chrome’s address bar, while later versions instructed them to install the Tampermonkey extension and add a script that persisted when visiting SimpleSwap.\u003c/p\u003e\n\n\u003cp\u003eThe first-stage script retrieved obfuscated payload components from a publicly published Google Sheets document through Google’s Visualization API, then assembled and injected them into the targeted site. The resulting web-skimming script altered transaction interfaces, replaced legitimate deposit addresses in browser responses and copied clipboard data with attacker-controlled Bitcoin addresses, and displayed fake bonus-related interface elements. Talos identified 49 Bitcoin wallets associated with the campaign; 24 of 30 commonly used addresses received a combined 0.159 BTC, approximately $10,000 at early August 2026 valuations, and the actors repeatedly restored components after disruption by changing Google Sheets, Google Docs, or paste.sh content.\u003c/p\u003e\n"},{"n":19,"title":"Cyberattack encrypts systems at Bavarian municipal utility","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cyberattack-bavaria-germany-utility","time":"12:00","priority":"MAY READ","score":72,"tldr":"Stadtwerke Landsberg, a Bavarian municipal utility, said hackers encrypted parts of its central IT network, disrupting office systems but not electricity, water, or other essential services. The utility is investigating whether customer personal and bank data may have been accessed or stolen.","briefOverview":"\u003cp\u003eStadtwerke Landsberg, a city-owned municipal utility in Bavaria, said hackers encrypted its central IT network in a cyberattack that began overnight on September 1. The utility said the incident disrupted office systems, but electricity, water, and other essential services are not affected. After detecting the incident, it disconnected affected systems from the internet, activated its crisis team, and brought in external cybersecurity specialists.\u003c/p\u003e\n\n\u003cp\u003eThe utility said staff are currently only available to a limited extent by phone and email while the forensic investigation continues. It did not identify a specific ransomware group and did not say whether it received an extortion demand. Stadtwerke Landsberg warned customers that it could not rule out whether attackers accessed or stole personal data, including names, addresses, phone numbers, email addresses, and bank details.\u003c/p\u003e\n\n\u003cp\u003eThe article places the incident amid ongoing ransomware and disruptive cyberattack concerns affecting German companies and public-sector organizations. It notes that Germany’s federal cybersecurity agency, the BSI, has repeatedly identified ransomware as one of the country’s most serious cyber threats. The article also says the Landsberg attack occurred during a tense day for German critical infrastructure operators, but states there is no indication the hack is connected to any other incident.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Stadtwerke Landsberg said hackers encrypted its central IT network in a cyberattack that began overnight on September 1.","The Bavarian municipal utility said the attack disrupted office systems but is not affecting electricity, water, or other essential services.","Stadtwerke Landsberg disconnected affected systems from the internet, activated its crisis team, and brought in external cybersecurity specialists.","The utility said it cannot rule out that attackers accessed or stole customer personal data, including names, addresses, phone numbers, email addresses, and bank details.","The article states there is no indication the Landsberg hack is connected to other incidents affecting German critical infrastructure operators that occurred around the same time."],"insights":["The attack affected the utility’s central IT network and office systems, but the article specifically says electricity, water, and other essential services were not affected, showing a separation between administrative disruption and service delivery in this case.","Stadtwerke Landsberg described an encryption event but did not name a ransomware group or say whether it received an extortion demand, leaving the incident publicly unclaimed and unattributed in the article.","The utility warned that customer bank details may have been exposed even though the forensic investigation is still ongoing, indicating customer data risk was significant enough to disclose before the investigation was complete.","The article explicitly separates the Landsberg hack from other tense critical-infrastructure events in Germany that day, stating there is no indication it is connected to the drone-related accusation against Russia or the power substation sabotage incidents."],"referencedReports":[],"body":"\u003cp\u003eStadtwerke Landsberg, a city-owned municipal utility in Bavaria, said hackers encrypted its central IT network in a cyberattack that began overnight on September 1. The utility said the incident disrupted office systems, but electricity, water, and other essential services are not affected. After detecting the incident, it disconnected affected systems from the internet, activated its crisis team, and brought in external cybersecurity specialists.\u003c/p\u003e\n\n\u003cp\u003eThe utility said staff are currently only available to a limited extent by phone and email while the forensic investigation continues. It did not identify a specific ransomware group and did not say whether it received an extortion demand. Stadtwerke Landsberg warned customers that it could not rule out whether attackers accessed or stole personal data, including names, addresses, phone numbers, email addresses, and bank details.\u003c/p\u003e\n\n\u003cp\u003eThe article places the incident amid ongoing ransomware and disruptive cyberattack concerns affecting German companies and public-sector organizations. It notes that Germany’s federal cybersecurity agency, the BSI, has repeatedly identified ransomware as one of the country’s most serious cyber threats. The article also says the Landsberg attack occurred during a tense day for German critical infrastructure operators, but states there is no indication the hack is connected to any other incident.\u003c/p\u003e\n"},{"n":6,"title":"August updates trigger 0xc0000409 errors on Windows Server 2016","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/august-updates-trigger-0xc0000409-errors-on-windows-server-2016/","time":"15:22","priority":"MAY READ","score":68,"tldr":"Microsoft says the August 2026 security update can cause recurring 0xc0000409 crashes of CompatTelRunner.exe on Windows Server 2016 systems with Compatibility Appraiser enabled. The errors affect logs only and do not impact device functionality while Microsoft works on a fix.","briefOverview":"\u003cp\u003eMicrosoft says the August 2026 security update may trigger 0xc0000409 errors on Windows Server 2016 systems where the Compatibility Appraiser diagnostic service is enabled. On affected systems, the CompatTelRunner.exe process may crash and generate recurring Application Error events with Event ID 1000. Microsoft says the issue affects both physical devices and virtual machines, including VMware and Azure environments.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says the recurring CompatTelRunner.exe failures do not affect device functionality. The associated event log warnings can be safely dismissed temporarily until a resolution is released. Microsoft is working on a fix for a future Windows update, but it has not shared a timeline for a permanent solution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says the August 2026 security update may trigger 0xc0000409 errors on Windows Server 2016 systems where the Compatibility Appraiser diagnostic service is enabled.","Affected systems may show recurring Application Error events with Event ID 1000 and crashes of the CompatTelRunner.exe process.","Microsoft says the issue affects both physical devices and virtual machines, including VMware and Azure environments.","Microsoft says the recurring CompatTelRunner.exe failures do not affect device functionality and the associated event log warnings can be safely dismissed temporarily.","Microsoft is working on a fix that will be released in a future Windows update, but it has not provided a timeline."],"insights":["The crashes are tied to the Compatibility Appraiser component, a background readiness-checking task, rather than to a core server function, which is why Microsoft says device functionality is not affected.","Administrators investigating repeated Event ID 1000 application errors after the August 2026 update can narrow their checks to CompatTelRunner.exe failures with exception code 0xc0000409.","The issue is not limited to a specific deployment model because Microsoft says it can appear on both physical Windows Server 2016 devices and virtual machines in VMware and Azure environments.","Microsoft has not provided a timeline for the fix, so affected organizations may need to tolerate the event log noise until a future Windows update is released."],"referencedReports":[{"title":"Windows release health service alert WI1467310","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1467310","publisher":"microsoft","context":"The article cites a Microsoft service alert explaining that August 2026 Windows security updates can cause recurring CompatTelRunner.exe Application Error events on Windows Server 2016.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft says the August 2026 security update may trigger 0xc0000409 errors on Windows Server 2016 systems where the Compatibility Appraiser diagnostic service is enabled. On affected systems, the CompatTelRunner.exe process may crash and generate recurring Application Error events with Event ID 1000. Microsoft says the issue affects both physical devices and virtual machines, including VMware and Azure environments.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says the recurring CompatTelRunner.exe failures do not affect device functionality. The associated event log warnings can be safely dismissed temporarily until a resolution is released. Microsoft is working on a fix for a future Windows update, but it has not shared a timeline for a permanent solution.\u003c/p\u003e\n"},{"n":8,"title":"Microsoft: Windows Server 2025 changes causing app crashes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-windows-server-2025-changes-may-cause-app-crashes/","time":"11:57","priority":"MAY READ","score":68,"tldr":"Microsoft warns that Windows Server 2025 memory-management changes can crash or corrupt apps using Address Windowing Extensions, including SQL Server with Lock Pages in Memory enabled. Until a Windows update fixes it, admins can mitigate SQL Server impact by disabling LPIM, though this may affect performance.","briefOverview":"\u003cp\u003eMicrosoft warned customers that recent memory management changes in Windows Server 2025 may cause application crashes on some systems. The known issue affects applications that use Address Windowing Extensions, which let an application use more than 4GB of physical memory within a 32-bit virtual address space. Microsoft said affected applications might experience access violations, memory corruption, or unexpected termination.\u003c/p\u003e\n\n\u003cp\u003eThe affected applications include SQL Server when it runs with the Lock Pages in Memory Windows policy enabled to improve performance in scenarios where paging memory to disk is expected. Impacted systems may show memory corruption errors, access violation exceptions with 0xC0000005 error codes, failures during database maintenance operations such as DBCC CHECKDB, SQL Server crash dumps, and SQL Server services stopping or restarting unexpectedly. Affected users are also seeing “Using locked pages in the memory manager.” alerts in the error log during system startup.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said a permanent fix is not yet available, but it shared a temporary workaround that requires administrators to disable the Lock Pages in Memory policy for the SQL Server service account. The company warned that disabling this setting can affect SQL Server performance and memory-management behavior, and said other affected applications should be checked to see whether Address Windowing Extensions can be disabled. Microsoft said it is working on a resolution for a future Windows update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft warned that recent memory management changes in Windows Server 2025 may cause application crashes on some systems.","The issue affects applications that use Address Windowing Extensions, including SQL Server when the Lock Pages in Memory Windows policy is enabled.","Impacted systems may experience access violations, memory corruption, unexpected application termination, SQL Server crash dumps, and SQL Server services stopping or restarting unexpectedly.","Microsoft's temporary workaround is to disable the Lock Pages in Memory policy for the SQL Server service account, while noting that this can affect SQL Server performance and memory-management behavior.","Microsoft said it is working on a resolution for the issue in a future Windows update."],"insights":["A performance setting meant to improve SQL Server behavior, Lock Pages in Memory, can become the trigger for crashes or memory corruption on Windows Server 2025 systems affected by this issue.","Administrators can look for the \"Using locked pages in the memory manager.\" message in SQL Server error logs during startup as a sign that the affected configuration is present.","Microsoft's workaround requires a tradeoff because disabling Lock Pages in Memory may reduce SQL Server performance or change how it manages memory.","The issue is not limited to SQL Server; Microsoft advises checking whether Address Windowing Extensions can be disabled for other affected applications."],"referencedReports":[{"title":"Windows Server 2025 service alert WI1466267","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1466267","publisher":"Microsoft","context":"The article cites a Microsoft service alert warning that Windows Server 2025 memory-management changes can cause access violations, memory corruption, or unexpected termination in applications using Address Windowing Extensions.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft warned customers that recent memory management changes in Windows Server 2025 may cause application crashes on some systems. The known issue affects applications that use Address Windowing Extensions, which let an application use more than 4GB of physical memory within a 32-bit virtual address space. Microsoft said affected applications might experience access violations, memory corruption, or unexpected termination.\u003c/p\u003e\n\n\u003cp\u003eThe affected applications include SQL Server when it runs with the Lock Pages in Memory Windows policy enabled to improve performance in scenarios where paging memory to disk is expected. Impacted systems may show memory corruption errors, access violation exceptions with 0xC0000005 error codes, failures during database maintenance operations such as DBCC CHECKDB, SQL Server crash dumps, and SQL Server services stopping or restarting unexpectedly. Affected users are also seeing “Using locked pages in the memory manager.” alerts in the error log during system startup.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said a permanent fix is not yet available, but it shared a temporary workaround that requires administrators to disable the Lock Pages in Memory policy for the SQL Server service account. The company warned that disabling this setting can affect SQL Server performance and memory-management behavior, and said other affected applications should be checked to see whether Address Windowing Extensions can be disabled. Microsoft said it is working on a resolution for a future Windows update.\u003c/p\u003e\n"},{"n":17,"title":"Russian suspect in bank account takeovers is extradited to US","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russian-cybercrime-bank-extradition","time":"19:37","priority":"MAY READ","score":68,"tldr":"Russian national Sergei Filimonov was extradited to the U.S. to face fraud and identity theft charges over an alleged bank account takeover scheme that used spoofed banking pages and sponsored search links to steal credentials. Authorities say the operation caused about $14.6 million in confirmed losses and attempted losses of about $28 million.","briefOverview":"\u003cp\u003eRussian web developer Sergei Anatolyevich Filimonov was extradited from the Republic of Georgia to the United States to face an indictment tied to a multimillion-dollar bank account takeover scheme. He appeared in an Atlanta federal court on September 4 and pleaded not guilty to fraud and identity theft charges. U.S. authorities said he remains in custody.\u003c/p\u003e\n\n\u003cp\u003eProsecutors allege that from November 2023 through October 2025, Filimonov and others used spoofed domains and fraudulent login pages to target online banking customers. They allegedly bought sponsored search-engine links to divert customers to fake login pages and steal their credentials. Authorities said the stolen credentials were then used to access bank accounts, review balances, and initiate unauthorized wire transfers.\u003c/p\u003e\n\n\u003cp\u
