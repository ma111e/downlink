<script type="application/json" id="dl-articles">[{"n":26,"title":"Adobe Patches Magento Zero-Day Exploited to Deploy Rust Backdoor and PHP Web Shell","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/adobe-patches-magento-zero-day.html","time":"09:13","priority":"MUST READ","score":98,"tldr":"Adobe released an emergency hotfix for a critical Adobe Commerce and Magento Open Source zero-day, CVE-2026-75650, that is already being exploited to achieve unauthenticated remote code execution. Attackers have used the flaw to deploy a Rust-based Linux backdoor and PHP web shells, so affected merchants should apply the VULN-39341 patch and rotate encryption keys immediately.","briefOverview":"\u003cp\u003eAdobe released security patches for a maximum-severity flaw affecting Adobe Commerce and Magento Open Source that is being actively exploited in the wild. The vulnerability is tracked as CVE-2026-75650, has a CVSS score of 10.0, and has been codenamed StyleSmuggler by Sansec. Adobe said the flaw could result in arbitrary code execution and that it is aware of exploitation targeting Adobe Commerce merchants.\u003c/p\u003e\n\n\u003cp\u003eThe flaw abuses Magento\u0026rsquo;s template system through PHP code injection to generate a \u0026ldquo;Payment Transaction Failed Reminder\u0026rdquo; email, which triggers code execution. Affected products include multiple versions of Adobe Commerce, Adobe Commerce B2B, and Magento Open Source up to the listed August 2026 releases. Adobe said affected users must apply the VULN-39341 patch for their version and rotate their encryption keys.\u003c/p\u003e\n\n\u003cp\u003eSansec reported zero-day exploitation beginning on September 4, 2026, and said attackers used the vulnerability to deploy a Rust-based Linux backdoor that connects to an external server and waits for instructions. The issue has also been used to deliver a PHP dropper on vulnerable sites that writes a web shell capable of executing arbitrary PHP code. Disrex said a Magento server it managed was compromised 50 minutes after the first confirmed StyleSmuggler exploitation was reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adobe released security patches for a maximum-severity flaw in Adobe Commerce and Magento Open Source that is being actively exploited in the wild.","The vulnerability is tracked as CVE-2026-75650, has a CVSS score of 10.0, and was codenamed StyleSmuggler by Sansec.","The flaw abuses Magento's template system through PHP code injection to generate a \"Payment Transaction Failed Reminder\" email, triggering code execution.","Adobe said affected users must apply the VULN-39341 patch for their version and rotate their encryption keys.","Sansec reported that attackers exploited CVE-2026-75650 to deploy a Rust-based Linux backdoor, and the issue has also been used to deliver a PHP dropper that writes a web shell."],"insights":["Applying the hotfix alone is not the full remediation Adobe recommends; affected merchants must also rotate their encryption keys.","Systems that had already installed the August 2026 releases are still listed as affected, so being recently patched does not rule out exposure.","The reported compromise of a Magento server 50 minutes after the first confirmed StyleSmuggler exploitation shows that vulnerable sites may have been targeted very quickly once exploitation began.","Attackers used more than one follow-on payload, including a Rust-based Linux backdoor and a PHP web shell, so defenders may need to look for multiple signs of compromise rather than a single malware artifact."],"referencedReports":[{"title":"Adobe Security Bulletin APSB26-146","url":"https://helpx.adobe.com/security/products/magento/apsb26-146.html","publisher":"Adobe","context":"The article cites Adobe's security bulletin stating that CVE-2026-75650 could result in arbitrary code execution and has been exploited in the wild against Adobe Commerce merchants.","category":"advisory","primary":true},{"title":"Commerce APSB26-146","url":"https://experienceleague.adobe.com/en/docs/commerce-knowledge-base/kb/announcements/commerce-apsb26-146","publisher":"Adobe","context":"The article cites Adobe's Commerce knowledge base notice saying affected users must apply the VULN-39341 patch and rotate encryption keys.","category":"advisory","primary":true}],"body":"\u003cp\u003eAdobe released security patches for a maximum-severity flaw affecting Adobe Commerce and Magento Open Source that is being actively exploited in the wild. The vulnerability is tracked as CVE-2026-75650, has a CVSS score of 10.0, and has been codenamed StyleSmuggler by Sansec. Adobe said the flaw could result in arbitrary code execution and that it is aware of exploitation targeting Adobe Commerce merchants.\u003c/p\u003e\n\n\u003cp\u003eThe flaw abuses Magento\u0026rsquo;s template system through PHP code injection to generate a \u0026ldquo;Payment Transaction Failed Reminder\u0026rdquo; email, which triggers code execution. Affected products include multiple versions of Adobe Commerce, Adobe Commerce B2B, and Magento Open Source up to the listed August 2026 releases. Adobe said affected users must apply the VULN-39341 patch for their version and rotate their encryption keys.\u003c/p\u003e\n\n\u003cp\u003eSansec reported zero-day exploitation beginning on September 4, 2026, and said attackers used the vulnerability to deploy a Rust-based Linux backdoor that connects to an external server and waits for instructions. The issue has also been used to deliver a PHP dropper on vulnerable sites that writes a web shell capable of executing arbitrary PHP code. Disrex said a Magento server it managed was compromised 50 minutes after the first confirmed StyleSmuggler exploitation was reported.\u003c/p\u003e\n"},{"n":35,"title":"“StyleSmuggler” – Adobe Commerce, Adobe Commerce B2B, and Magento RCE (CVE-2026-75650): Overview and Takeaways","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/stylesmuggler-adobe-commerce-adobe-commerce-b2b-and-magento-rce-cve-2026-75650/","time":"22:15","priority":"MUST READ","score":98,"tldr":"Adobe disclosed a critical unauthenticated RCE flaw, CVE-2026-75650 “StyleSmuggler,” affecting Adobe Commerce, Adobe Commerce B2B, and Magento Open Source, with confirmed in-the-wild exploitation. Organizations should immediately apply Adobe’s VULN-39341 hotfix and treat any internet-exposed unpatched instance since September 4, 2026 as potentially compromised.","briefOverview":"\u003cp\u003eAdobe disclosed CVE-2026-75650, dubbed “StyleSmuggler,” on September 7, 2026. The vulnerability received a maximal initial CVSS score of 10.0 and affects Adobe Commerce, Adobe Commerce B2B, and Magento Open Source. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog on September 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows an unauthenticated network-based attacker to execute arbitrary code by injecting PHP through Magento’s email template engine. The article identifies the root cause as improper neutralization of special elements used in a template engine, tracked as CWE-1336. It says attackers can trigger execution through a “Payment Transaction Failed Reminder” email.\u003c/p\u003e\n\n\u003cp\u003eExploitation has been confirmed in the wild since at least September 4, 2026, with threat actors deploying a Rust-based Linux backdoor and PHP web shells on compromised storefronts. The article recommends identifying all Adobe Commerce and Magento deployments, applying Adobe’s VULN-39341 Composer hotfix from bulletin APSB26-146, and following Adobe’s verification workflow. It also advises treating any unpatched internet-exposed instance as potentially compromised, checking Sansec’s indicators of compromise, deploying WAF rules, and monitoring for unusual PHP process spawning and unexpected outbound connections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adobe disclosed CVE-2026-75650, dubbed “StyleSmuggler,” on September 7, 2026, and assigned it an initial CVSS score of 10.0.","The vulnerability affects Adobe Commerce, Adobe Commerce B2B, and Magento Open Source and allows unauthenticated remote code execution through PHP injection in Magento’s email template engine.","Exploitation has been confirmed in the wild since at least September 4, 2026, with attackers deploying a Rust-based Linux backdoor and PHP web shells on compromised storefronts.","CISA added CVE-2026-75650 to its Known Exploited Vulnerabilities catalog on September 8, 2026.","The article recommends applying Adobe’s VULN-39341 Composer hotfix, verifying successful installation, checking Sansec’s indicators of compromise, and treating unpatched internet-exposed instances as potentially compromised."],"insights":["Any internet-exposed affected instance that remained unpatched on or after September 4, 2026 requires investigation, because exploitation was observed before Adobe’s September 7 disclosure.","Remediation depends on applying the VULN-39341 Composer hotfix from Adobe bulletin APSB26-146, which the article emphasizes is an emergency hotfix rather than a full minor release.","Defensive monitoring should focus on Magento email generation behavior because the described execution path involves injected PHP being triggered through a “Payment Transaction Failed Reminder” email.","Compromise checks should include Sansec’s host, network, and media-directory indicators of compromise in addition to monitoring for unusual PHP process spawning and unexpected outbound connections."],"referencedReports":[{"title":"Adobe Security Advisory APSB26-146","url":"https://experienceleague.adobe.com/en/docs/commerce-knowledge-base/kb/announcements/commerce-apsb26-146","publisher":"Adobe","context":"The article cites Adobe bulletin APSB26-146 as the source for the VULN-39341 Composer hotfix and links it as the Adobe Security Advisory.","category":"advisory","primary":true}],"body":"\u003cp\u003eAdobe disclosed CVE-2026-75650, dubbed “StyleSmuggler,” on September 7, 2026. The vulnerability received a maximal initial CVSS score of 10.0 and affects Adobe Commerce, Adobe Commerce B2B, and Magento Open Source. CISA added the vulnerability to its Known Exploited Vulnerabilities catalog on September 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows an unauthenticated network-based attacker to execute arbitrary code by injecting PHP through Magento’s email template engine. The article identifies the root cause as improper neutralization of special elements used in a template engine, tracked as CWE-1336. It says attackers can trigger execution through a “Payment Transaction Failed Reminder” email.\u003c/p\u003e\n\n\u003cp\u003eExploitation has been confirmed in the wild since at least September 4, 2026, with threat actors deploying a Rust-based Linux backdoor and PHP web shells on compromised storefronts. The article recommends identifying all Adobe Commerce and Magento deployments, applying Adobe’s VULN-39341 Composer hotfix from bulletin APSB26-146, and following Adobe’s verification workflow. It also advises treating any unpatched internet-exposed instance as potentially compromised, checking Sansec’s indicators of compromise, deploying WAF rules, and monitoring for unusual PHP process spawning and unexpected outbound connections.\u003c/p\u003e\n"},{"n":4,"title":"Adobe fixes critical Magento zero-day exploited to backdoor servers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/adobe-fixes-critical-magento-zero-day-exploited-to-backdoor-servers/","time":"13:34","priority":"MUST READ","score":96,"tldr":"Adobe released an emergency hotfix for CVE-2026-75650, a critical Magento and Adobe Commerce zero-day actively exploited to backdoor vulnerable e-commerce servers. Administrators should apply the fix immediately and rotate secrets because exploitation is increasing.","briefOverview":"\u003cp\u003eAdobe released an emergency fix for CVE-2026-75650, a max-severity zero-day vulnerability dubbed StyleSmuggler that affects multiple versions of Magento and Adobe Commerce. Adobe said the flaw could allow arbitrary code execution and confirmed that it is being exploited in the wild. Sansec reported that attackers have used the flaw since at least September 4 to plant a backdoor on vulnerable websites.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Adobe Commerce versions 2.4.4 through 2.4.9, Adobe Commerce B2B versions 1.3.3 through 1.5.3, and Magento Open Source versions 2.4.6 through 2.4.9, including August 2026 releases and earlier versions in each branch. Adobe assigned the update its highest priority rating and urged administrators to install the VULN-39341 hotfix immediately. After applying the fix, Adobe recommends enabling maintenance mode, suspending cron jobs, and rotating secrets such as administrator passwords, tokens, payment gateway credentials, database credentials, SSH keys, and API keys.\u003c/p\u003e\n\n\u003cp\u003eSansec said the backdoor disguised its command-and-control host as a regular NTP server, but compromised hosts may show signs such as “Payment Transaction Failed Reminder” emails. Sansec also observed a second attacker using unrelated tooling to exploit the flaw and deploy a 485-byte PHP web shell. That malware collects basic server details, checks whether the pub/media location is writable, and exfiltrates data through requests to an oast.site subdomain.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adobe released an emergency security fix for CVE-2026-75650, a critical zero-day vulnerability dubbed StyleSmuggler that affects multiple versions of Magento and Adobe Commerce.","Sansec reported that attackers have exploited the flaw since at least September 4 to plant a backdoor on vulnerable websites.","Adobe says the vulnerability could allow arbitrary code execution and affects Adobe Commerce 2.4.4 through 2.4.9, Adobe Commerce B2B 1.3.3 through 1.5.3, and Magento Open Source 2.4.6 through 2.4.9, including August 2026 releases and earlier versions in each branch.","Adobe recommends installing the VULN-39341 hotfix immediately and then rotating secrets such as administrator passwords, tokens, API credentials, database credentials, SSH keys, and API keys.","Sansec observed a second attacker exploiting the same flaw to deploy a 485-byte PHP web shell that collects server details and exfiltrates data through requests to an oast.site subdomain."],"insights":["The backdoor’s command-and-control host was disguised as a normal NTP server, but compromised hosts may still show distinct signs such as “Payment Transaction Failed Reminder” emails.","Adobe recommends rotating a broad set of secrets after applying the hotfix, indicating that patching alone is not considered sufficient for systems that may have been exposed.","The VULN-39341 hotfix has only been tested against the August 2026 releases of the affected branches, so Adobe has not confirmed compatibility with other releases even though they may be affected.","Sansec observed a second attacker using unrelated tooling against the same flaw, showing that exploitation is not limited to a single campaign.","The second observed payload exfiltrates data through an oast.site subdomain, which Sansec notes is typically associated with security testing using the Interactsh open-source tool."],"referencedReports":[{"title":"Adobe Security Advisory APSB26-146","url":"http://helpx.adobe.com/security/products/magento/apsb26-146.html","publisher":"Adobe","context":"The article cites Adobe's security advisory stating that CVE-2026-75650 is being exploited in the wild and that the update fixes arbitrary code execution.","category":"advisory","primary":true},{"title":"StyleSmuggler 0day","url":"http://sansec.io/research/stylesmuggler-0day","publisher":"Sansec","context":"The article references Sansec's original report and update describing exploitation of the StyleSmuggler zero-day and a second attacker deploying a PHP web shell.","category":"research","primary":true}],"body":"\u003cp\u003eAdobe released an emergency fix for CVE-2026-75650, a max-severity zero-day vulnerability dubbed StyleSmuggler that affects multiple versions of Magento and Adobe Commerce. Adobe said the flaw could allow arbitrary code execution and confirmed that it is being exploited in the wild. Sansec reported that attackers have used the flaw since at least September 4 to plant a backdoor on vulnerable websites.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Adobe Commerce versions 2.4.4 through 2.4.9, Adobe Commerce B2B versions 1.3.3 through 1.5.3, and Magento Open Source versions 2.4.6 through 2.4.9, including August 2026 releases and earlier versions in each branch. Adobe assigned the update its highest priority rating and urged administrators to install the VULN-39341 hotfix immediately. After applying the fix, Adobe recommends enabling maintenance mode, suspending cron jobs, and rotating secrets such as administrator passwords, tokens, payment gateway credentials, database credentials, SSH keys, and API keys.\u003c/p\u003e\n\n\u003cp\u003eSansec said the backdoor disguised its command-and-control host as a regular NTP server, but compromised hosts may show signs such as “Payment Transaction Failed Reminder” emails. Sansec also observed a second attacker using unrelated tooling to exploit the flaw and deploy a 485-byte PHP web shell. That malware collects basic server details, checks whether the pub/media location is writable, and exfiltrates data through requests to an oast.site subdomain.\u003c/p\u003e\n"},{"n":13,"title":"Microsoft September 2026 Patch Tuesday fixes 966 flaws, 2 zero-days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-september-2026-patch-tuesday-fixes-966-flaws-2-zero-days/","time":"18:18","priority":"MUST READ","score":96,"tldr":"Microsoft’s September 2026 Patch Tuesday fixes a record 966 vulnerabilities, including two actively exploited Windows zero-days that allow local attackers to gain SYSTEM privileges. Organizations should prioritize applying the latest Windows and Microsoft product security updates.","briefOverview":"\u003cp\u003eMicrosoft’s September 2026 Patch Tuesday released security updates for a record-breaking 966 flaws, including two actively exploited zero-day vulnerabilities. The release addresses 105 Critical vulnerabilities, including 81 remote code execution flaws, 20 elevation of privilege flaws, two information disclosure flaws, and one security feature bypass flaw. BleepingComputer says this is Microsoft’s largest security update ever, exceeding recent large releases that fixed 570 flaws in July and 400 flaws in August.\u003c/p\u003e\n\n\u003cp\u003eThe article says the Patch Tuesday total does not include 204 flaws Microsoft fixed earlier in the month across products including Azure AI Language, Azure Cosmos DB, Copilot Studio, Entra ID, Microsoft Edge, Microsoft Fabric, and Power Automate. It also notes that the increase in Patch Tuesday security updates comes after Microsoft began using an AI-powered vulnerability discovery system to identify more security flaws across its software products. The broader set of affected products in the September updates includes Windows, Microsoft Office, Exchange Server, SQL Server, Visual Studio Code, Azure services, and many Windows components.\u003c/p\u003e\n\n\u003cp\u003eThe two actively exploited zero-days are CVE-2026-81963 in the Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call. CVE-2026-81963 is described as an improper link resolution issue that allows an authorized attacker to elevate privileges locally and gain SYSTEM privileges. CVE-2026-85880 is described as a heap-based buffer overflow in Windows ALPC that also allows an authorized attacker to elevate privileges locally and gain SYSTEM privileges. Microsoft did not share details on how either flaw was exploited in attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s September 2026 Patch Tuesday released security updates for a record-breaking 966 flaws, including two actively exploited zero-day vulnerabilities.","The update addresses 105 Critical vulnerabilities, including 81 remote code execution flaws, 20 elevation of privilege flaws, two information disclosure flaws, and one security feature bypass flaw.","The total does not include 204 flaws fixed earlier in the month across products including Azure AI Language, Azure Cosmos DB, Copilot Studio, Entra ID, Microsoft Edge, Microsoft Fabric, and Power Automate.","Microsoft patched CVE-2026-81963, an actively exploited Windows Update Stack elevation of privilege vulnerability that can allow attackers to gain SYSTEM privileges.","Microsoft also fixed CVE-2026-85880, an actively exploited Windows Advanced Local Procedure Call elevation of privilege flaw that can allow attackers to gain SYSTEM privileges."],"insights":["This Patch Tuesday is unusually large even compared with Microsoft’s other recent massive releases, exceeding July’s 570 fixes and August’s 400 fixes by a wide margin.","Microsoft’s use of an AI-powered vulnerability discovery system is directly linked in the article to the increase in security updates across its software products.","The two actively exploited zero-days both require an authorized attacker and lead to local privilege escalation, making them especially relevant after an attacker has already gained some level of access.","The article’s 966-flaw Patch Tuesday count excludes 204 additional Microsoft flaws fixed earlier in the same month, so the broader September Microsoft security workload is larger than the headline number."],"referencedReports":[{"title":"CVE-2026-81963 - Windows Update Stack Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-81963","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the actively exploited Windows Update Stack zero-day fixed in the September 2026 Patch Tuesday release.","category":"advisory","primary":true},{"title":"CVE-2026-85880 - Windows Advanced Local Procedure Call (ALPC) Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-85880","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the actively exploited Windows ALPC zero-day fixed in the September 2026 Patch Tuesday release.","category":"advisory","primary":true},{"title":"Cisco Security Advisories","url":"https://sec.cloudapps.cisco.com/security/center/publicationListing.x","publisher":"Cisco","context":"The article notes that Cisco released security updates for numerous products and links to Cisco’s security publication listing.","category":"advisory","primary":false},{"title":"SAP Security Patch Day - September 2026","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/september-2026.html?isu_page=1","publisher":"SAP","context":"The article notes that SAP released September security updates for numerous products and links to SAP’s security notes page.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft’s September 2026 Patch Tuesday released security updates for a record-breaking 966 flaws, including two actively exploited zero-day vulnerabilities. The release addresses 105 Critical vulnerabilities, including 81 remote code execution flaws, 20 elevation of privilege flaws, two information disclosure flaws, and one security feature bypass flaw. BleepingComputer says this is Microsoft’s largest security update ever, exceeding recent large releases that fixed 570 flaws in July and 400 flaws in August.\u003c/p\u003e\n\n\u003cp\u003eThe article says the Patch Tuesday total does not include 204 flaws Microsoft fixed earlier in the month across products including Azure AI Language, Azure Cosmos DB, Copilot Studio, Entra ID, Microsoft Edge, Microsoft Fabric, and Power Automate. It also notes that the increase in Patch Tuesday security updates comes after Microsoft began using an AI-powered vulnerability discovery system to identify more security flaws across its software products. The broader set of affected products in the September updates includes Windows, Microsoft Office, Exchange Server, SQL Server, Visual Studio Code, Azure services, and many Windows components.\u003c/p\u003e\n\n\u003cp\u003eThe two actively exploited zero-days are CVE-2026-81963 in the Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call. CVE-2026-81963 is described as an improper link resolution issue that allows an authorized attacker to elevate privileges locally and gain SYSTEM privileges. CVE-2026-85880 is described as a heap-based buffer overflow in Windows ALPC that also allows an authorized attacker to elevate privileges locally and gain SYSTEM privileges. Microsoft did not share details on how either flaw was exploited in attacks.\u003c/p\u003e\n"},{"n":38,"title":"Microsoft’s September 2026 Patch Tuesday addresses 964 CVEs (CVE-2026-81963, CVE-2026-85880)","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/microsofts-september-2026-patch-tuesday-addresses-964-cves-cve-2026-81963-cve-2026-85880","time":"18:07","priority":"MUST READ","score":96,"tldr":"Microsoft's September 2026 Patch Tuesday fixes a record 964 CVEs, including two actively exploited Windows elevation-of-privilege zero-days. Organizations should prioritize updates for Windows, especially exposed DNS Server and Remote Desktop Services systems, due to multiple high-severity RCE flaws assessed as more likely to be exploited.","briefOverview":"\u003cp\u003eMicrosoft’s September 2026 Patch Tuesday addressed a record 964 CVEs, with 104 rated Critical and 860 rated Important. The release includes patches across a broad range of Microsoft products and Windows components. Elevation-of-privilege issues accounted for 44.7% of the vulnerabilities fixed, while remote code execution issues accounted for 26.8%. The update addresses two zero-day vulnerabilities that Microsoft said had been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-81963 in the Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call (ALPC) can allow attackers to gain SYSTEM-level privileges. Microsoft also fixed several serious remote code execution flaws, including CVE-2026-69525 in Remote Desktop Services and CVE-2026-69730 in Windows DNS Server, both rated 9.8 and assessed as more likely to be exploited. CVE-2026-69676 in Windows Kerberos, rated 8.8, could allow an attacker with low-level access to execute arbitrary code through an authentication bypass. Tenable recommends applying patches as soon as possible and scanning environments to identify systems that remain unpatched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s September 2026 Patch Tuesday addressed 964 CVEs, including 104 rated Critical and 860 rated Important.","Microsoft said two elevation-of-privilege vulnerabilities, CVE-2026-81963 in the Windows Update Stack and CVE-2026-85880 in Windows ALPC, were exploited in the wild before patches were released.","CVE-2026-69525 is a Remote Desktop Services remote code execution vulnerability rated 9.8 that Microsoft assessed as exploitation more likely.","CVE-2026-69730 is a Critical Windows DNS Server remote code execution vulnerability rated 9.8 that an unauthenticated remote attacker could exploit with a crafted packet.","CVE-2026-69676 is a Critical Windows Kerberos remote code execution vulnerability rated 8.8 that Microsoft assessed as exploitation more likely."],"insights":["Although 964 CVEs were patched, elevation-of-privilege flaws made up the largest share at 44.7%, exceeding remote code execution flaws at 26.8%.","CVE-2026-81963 is the first Windows Update Stack elevation-of-privilege flaw exploited as a zero-day among seven such flaws patched since 2022.","CVE-2026-85880 marks the first ALPC vulnerability included in Patch Tuesday in more than three years and the second ALPC zero-day since January 2023.","Windows DNS Server received nine remote-code-execution fixes, but CVE-2026-69730 was the only one rated 9.8 and assessed by Microsoft as more likely to be exploited.","Despite its 8.1 score, the Exchange Server flaw CVE-2026-69380 requires an authenticated low-privilege mailbox user and was assessed as less likely to be exploited."],"referencedReports":[{"title":"Microsoft's September 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/en-us/releaseNote/2026-sep","publisher":"microsoft","context":"The article links to Microsoft's release notes for the September 2026 security updates as additional information on the patches.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft’s September 2026 Patch Tuesday addressed a record 964 CVEs, with 104 rated Critical and 860 rated Important. The release includes patches across a broad range of Microsoft products and Windows components. Elevation-of-privilege issues accounted for 44.7% of the vulnerabilities fixed, while remote code execution issues accounted for 26.8%. The update addresses two zero-day vulnerabilities that Microsoft said had been exploited in the wild.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-81963 in the Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call (ALPC) can allow attackers to gain SYSTEM-level privileges. Microsoft also fixed several serious remote code execution flaws, including CVE-2026-69525 in Remote Desktop Services and CVE-2026-69730 in Windows DNS Server, both rated 9.8 and assessed as more likely to be exploited. CVE-2026-69676 in Windows Kerberos, rated 8.8, could allow an attacker with low-level access to execute arbitrary code through an authentication bypass. Tenable recommends applying patches as soon as possible and scanning environments to identify systems that remain unpatched.\u003c/p\u003e\n"},{"n":39,"title":"StyleSmuggler (CVE-2026-75650): Frequently asked questions about Adobe Commerce and Magento zero-day","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/stylesmuggler-cve-2026-75650-frequently-asked-questions-about-adobe-commerce-and-magento-zero","time":"14:00","priority":"MUST READ","score":95,"tldr":"CVE-2026-75650, a critical unauthenticated RCE zero-day in Adobe Commerce and Magento Open Source dubbed StyleSmuggler, has been actively exploited since September 4 before Adobe released a hotfix on September 7. Affected stores should apply the hotfix immediately and perform incident response because patching alone will not remove existing compromises.","briefOverview":"\u003cp\u003eCVE-2026-75650, dubbed StyleSmuggler, is a critical unauthenticated remote code execution vulnerability in Adobe Commerce, Adobe Commerce B2B, and Magento Open Source. Tenable states that active exploitation began on September 4, 2026, three days before Adobe released a hotfix on September 7, 2026. The vulnerability has a CVSSv3 score of 10.0 and successful exploitation allows an unauthenticated attacker to execute arbitrary code on a vulnerable server.\u003c/p\u003e\n\n\u003cp\u003eThe affected products are Adobe Commerce versions 2.4.4 through 2.4.9, Adobe Commerce B2B versions 1.3.3 through 1.5.3, and Magento Open Source versions 2.4.6 through 2.4.9. StyleSmuggler exploits how Magento’s template engine processes style-related properties by injecting malicious PHP code through styles properties, which is later executed when the platform renders the “Payment Transaction Failed Reminder” transactional email template. Sansec reported multiple victim stores across different attack campaigns, and Disrex reported first-hand experience with at least two compromised stores.\u003c/p\u003e\n\n\u003cp\u003eAfter compromise, attackers deploy a persistent implant at \u003ccode\u003e~/.local/share/.gvfsd/gvfsd-user\u003c/code\u003e, disguise it with process names including \u003ccode\u003e[kworker/u:8:0]\u003c/code\u003e, \u003ccode\u003efc-cache\u003c/code\u003e, and \u003ccode\u003echronyd\u003c/code\u003e, and use a cron job to restart it. Adobe released Hotfix VULN-39341 and recommends rotating the encryption key and protected credentials after a compromise. The article emphasizes that patching alone does not remediate an existing compromise, so stores active during the three-day pre-hotfix window require incident response in addition to applying the fix.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-75650, dubbed StyleSmuggler, is a critical unauthenticated remote code execution vulnerability affecting Adobe Commerce, Adobe Commerce B2B, and Magento Open Source.","Active exploitation of CVE-2026-75650 began on September 4, 2026, three days before Adobe released a hotfix on September 7, 2026.","StyleSmuggler works by injecting malicious PHP code through style properties in Magento’s template system, which is then executed when the platform renders the “Payment Transaction Failed Reminder” transactional email template.","Sansec reported multiple victim stores across different attack campaigns, and Disrex reported first-hand experience with at least two compromised stores.","Adobe released Hotfix VULN-39341 for CVE-2026-75650 and recommends credential and encryption key rotation following a compromise."],"insights":["Patching alone is insufficient for stores that were active during the three-day period before Adobe’s hotfix, because the article states those stores require incident response in addition to applying the fix.","The exploitation technique is notable because it works without authentication and regardless of which session storage backend is configured, widening the set of exposed deployments.","Sansec observed at least two distinct operators on the same victim stores, including one deploying a persistent implant and another dropping a PHP web shell into the product image cache.","The attacker implant used multiple disguises, including the process names “[kworker/u:8:0],” “fc-cache,” and “chronyd,” and was kept alive through a recurring cron job.","Adobe recommends rotating not only admin passwords but also encryption keys and protected credentials such as integration tokens, OAuth client secrets, payment gateway API credentials, database credentials, SSH and deploy keys, and extension API keys after a compromise."],"referencedReports":[{"title":"StyleSmuggler 0day Research","url":"https://sansec.io/research/stylesmuggler-0day","publisher":"Sansec","context":"The article cites Sansec’s research as the initial public disclosure of the actively exploited StyleSmuggler zero-day and as the source for exploitation details and indicators of compromise.","category":"research","primary":true},{"title":"Adobe Security Bulletin APSB26-146","url":"https://helpx.adobe.com/security/products/magento/apsb26-146.html","publisher":"Adobe","context":"The article references Adobe’s security bulletin for additional details about the hotfix addressing CVE-2026-75650.","category":"advisory","primary":true},{"title":"StyleSmuggler incident response and mitigations","url":"https://www.disrex.nl/blogs/stylesmuggler-magento-zero-day","publisher":"Disrex","context":"The article links to Disrex’s incident response and mitigation material and notes that Disrex had first-hand experience with at least two compromised stores.","category":"guide","primary":false}],"body":"\u003cp\u003eCVE-2026-75650, dubbed StyleSmuggler, is a critical unauthenticated remote code execution vulnerability in Adobe Commerce, Adobe Commerce B2B, and Magento Open Source. Tenable states that active exploitation began on September 4, 2026, three days before Adobe released a hotfix on September 7, 2026. The vulnerability has a CVSSv3 score of 10.0 and successful exploitation allows an unauthenticated attacker to execute arbitrary code on a vulnerable server.\u003c/p\u003e\n\n\u003cp\u003eThe affected products are Adobe Commerce versions 2.4.4 through 2.4.9, Adobe Commerce B2B versions 1.3.3 through 1.5.3, and Magento Open Source versions 2.4.6 through 2.4.9. StyleSmuggler exploits how Magento’s template engine processes style-related properties by injecting malicious PHP code through styles properties, which is later executed when the platform renders the “Payment Transaction Failed Reminder” transactional email template. Sansec reported multiple victim stores across different attack campaigns, and Disrex reported first-hand experience with at least two compromised stores.\u003c/p\u003e\n\n\u003cp\u003eAfter compromise, attackers deploy a persistent implant at \u003ccode\u003e~/.local/share/.gvfsd/gvfsd-user\u003c/code\u003e, disguise it with process names including \u003ccode\u003e[kworker/u:8:0]\u003c/code\u003e, \u003ccode\u003efc-cache\u003c/code\u003e, and \u003ccode\u003echronyd\u003c/code\u003e, and use a cron job to restart it. Adobe released Hotfix VULN-39341 and recommends rotating the encryption key and protected credentials after a compromise. The article emphasizes that patching alone does not remediate an existing compromise, so stores active during the three-day pre-hotfix window require incident response in addition to applying the fix.\u003c/p\u003e\n"},{"n":44,"title":"Microsoft Patch Tuesday for September 2026 — Snort rules and prominent vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/microsoft-patch-tuesday-for-september-2026/","time":"22:16","priority":"MUST READ","score":95,"tldr":"Microsoft’s September 2026 Patch Tuesday fixes 973 vulnerabilities, including 113 critical issues and two Windows elevation-of-privilege flaws already exploited in the wild. Organizations should prioritize applying the updates, especially for the exploited and more-likely-to-be-exploited vulnerabilities, while Talos has released Snort coverage for some exploit attempts.","briefOverview":"\u003cp\u003eMicrosoft released its September 2026 monthly security update addressing 973 vulnerabilities across a range of products. Microsoft marked 113 of the vulnerabilities as critical, including 82 remote code execution vulnerabilities. The article states that two vulnerabilities disclosed this month have been exploited in the wild: CVE-2026-81963 in Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified several critical vulnerabilities as more likely to be exploited, including issues affecting Windows Kerberos, Windows Routing and Remote Access Service, Windows Deployment Services, Spring Cloud Azure, Windows Virtualization-Based Security, Windows Services for NFS ONCRPC XDR Driver, Windows DNS Server, and Azure Cosmos DB. The article also lists many vulnerabilities Microsoft considers less likely or unlikely to be exploited, covering products such as Windows DHCP Server, SQL Server, Windows Imaging Component, Microsoft Office, Windows Hyper-V, Windows Hello, and others. Other critical vulnerabilities highlighted include issues in Microsoft Entra ID, Power Automate, Copilot Studio, Azure Active Directory B2C, Microsoft Fabric, Azure AI Language, and Microsoft Discovery Studio.\u003c/p\u003e\n\n\u003cp\u003eTalos also highlighted numerous important vulnerabilities that Microsoft considers more likely to be exploited, including issues in Windows Kernel, Windows Win32k, LSA Server, Windows Search Component, Print Spooler Components, Remote Desktop Services, Windows SMB Client, Windows Schannel, and other Windows components. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article lists Snort 2 coverage as SIDs 67011-67032 and 67036-67084, and Snort 3 coverage as SIDs 301619-301629, 301632-301655, and 67046.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released its September 2026 monthly security update addressing 973 vulnerabilities across multiple products, including 113 marked as critical.","Microsoft stated that two vulnerabilities, CVE-2026-81963 in Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call, have been exploited in the wild.","Out of the 113 critical vulnerabilities, 82 are remote code execution vulnerabilities.","Microsoft assessed several vulnerabilities as more likely to be exploited, including issues affecting Windows Kerberos, Windows Routing and Remote Access Service, Windows Deployment Services, Spring Cloud Azure, Windows DNS Server, Azure Cosmos DB, and other products.","Talos released a new Snort ruleset to detect attempts to exploit some of the disclosed vulnerabilities, with coverage listed for both Snort 2 and Snort 3 rules."],"insights":["The two vulnerabilities already exploited in the wild are both elevation-of-privilege issues with CVSS scores of 7.8, showing that active exploitation is not limited to the highest-scoring critical flaws.","Windows DNS Server stands out because CVE-2026-69730 is both rated 9.8 and considered more likely to be exploited, while additional Windows DNS Server remote code execution flaws are listed as less likely or unlikely.","Several cloud and identity-related services have very high-severity elevation-of-privilege issues, including Microsoft Azure Active Directory B2C and Azure AI Language vulnerabilities with CVSS scores of 10.0.","Talos highlights many “important” vulnerabilities, not only critical ones, because Microsoft considers their exploitation more likely, indicating that prioritization should not rely on severity labels alone.","Snort coverage is available for only some of the disclosed vulnerabilities, and Talos notes that additional rules may be released later and current rules may change as more information becomes available."],"referencedReports":[{"title":"Microsoft Security Update Guide","url":"https://msrc.microsoft.com/update-guide/","publisher":"Microsoft","context":"The article says a complete list of all vulnerabilities Microsoft disclosed this month is available on Microsoft’s update page.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft released its September 2026 monthly security update addressing 973 vulnerabilities across a range of products. Microsoft marked 113 of the vulnerabilities as critical, including 82 remote code execution vulnerabilities. The article states that two vulnerabilities disclosed this month have been exploited in the wild: CVE-2026-81963 in Windows Update Stack and CVE-2026-85880 in Windows Advanced Local Procedure Call.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified several critical vulnerabilities as more likely to be exploited, including issues affecting Windows Kerberos, Windows Routing and Remote Access Service, Windows Deployment Services, Spring Cloud Azure, Windows Virtualization-Based Security, Windows Services for NFS ONCRPC XDR Driver, Windows DNS Server, and Azure Cosmos DB. The article also lists many vulnerabilities Microsoft considers less likely or unlikely to be exploited, covering products such as Windows DHCP Server, SQL Server, Windows Imaging Component, Microsoft Office, Windows Hyper-V, Windows Hello, and others. Other critical vulnerabilities highlighted include issues in Microsoft Entra ID, Power Automate, Copilot Studio, Azure Active Directory B2C, Microsoft Fabric, Azure AI Language, and Microsoft Discovery Studio.\u003c/p\u003e\n\n\u003cp\u003eTalos also highlighted numerous important vulnerabilities that Microsoft considers more likely to be exploited, including issues in Windows Kernel, Windows Win32k, LSA Server, Windows Search Component, Print Spooler Components, Remote Desktop Services, Windows SMB Client, Windows Schannel, and other Windows components. In response to the disclosures, Talos released a new Snort ruleset to detect attempts to exploit some of the vulnerabilities. The article lists Snort 2 coverage as SIDs 67011-67032 and 67036-67084, and Snort 3 coverage as SIDs 301619-301629, 301632-301655, and 67046.\u003c/p\u003e\n"},{"n":9,"title":"SAP warns of maximum severity 'OVERPASS' kernel vulnerability","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sap-warns-of-maximum-severity-overpass-kernel-vulnerability/","time":"14:55","priority":"MUST READ","score":94,"tldr":"SAP patched two critical vulnerabilities, including the maximum-severity OVERPASS flaw in SAP Kernel that could let unauthenticated or low-privileged attackers remotely execute commands and fully compromise exposed SAP systems. Onapsis estimates more than 10,000 Internet-facing SAP systems may be at risk, making rapid patching urgent.","briefOverview":"\u003cp\u003eSAP addressed 20 vulnerabilities across multiple products in its September 2026 security updates, including a maximum-severity memory corruption flaw in SAP Kernel code. The flaw is tracked as CVE-2026-44756 and was dubbed OVERPASS by Onapsis security researchers who reported it. It stems from a classic buffer overflow weakness in the Extended Passport Protocol processing library.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation of OVERPASS lets unprivileged threat actors run arbitrary commands on vulnerable SAP hosts with administrative privileges. The article says this can lead to full compromise of underlying SAP processes and business data. The flaw can be exploited over SAP Internet Communication Manager, the networking component of SAP Application Server that connects SAP systems to the Internet via HTTP, HTTPS, and SMTP.\u003c/p\u003e\n\n\u003cp\u003eOnapsis estimates that more than 10,000 Internet-facing SAP systems use the vulnerable component and are potentially exposed to attacks exploiting CVE-2026-44756. SAP also addressed CVE-2026-58240, a critical missing authentication vulnerability in SAP NetWeaver Message Server named S4GET by Onapsis Research Labs. After successful exploitation, unauthenticated attackers can access the entire SAP system cluster and execute malicious payloads and arbitrary commands remotely across the network.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP addressed 20 vulnerabilities across multiple products in its September 2026 security updates, including a maximum-severity memory corruption flaw in SAP Kernel code.","The SAP Kernel flaw, tracked as CVE-2026-44756 and dubbed OVERPASS by Onapsis, stems from a classic buffer overflow weakness in the Extended Passport Protocol processing library.","Successful exploitation of OVERPASS can allow unprivileged threat actors to run arbitrary commands on vulnerable SAP hosts with administrative privileges, leading to full compromise of underlying SAP processes and business data.","Onapsis estimates that more than 10,000 Internet-facing SAP systems use the vulnerable component and are potentially exposed to attacks exploiting CVE-2026-44756.","SAP also addressed CVE-2026-58240, a critical missing authentication vulnerability in the SAP NetWeaver Message Server named S4GET, which can allow unauthenticated attackers to access the entire SAP system cluster and execute arbitrary commands remotely."],"insights":["S4GET cannot simply be blocked by firewalling the affected public port because the article says the same port is used by every SAP GUI client for end-user logon.","Onapsis said its estimate of more than 10,000 exposed SAP systems is conservative because it only counts HTTP-reachable systems and undercounts SAP Web Dispatcher deployments that do not return a distinguishing SAP banner.","OVERPASS is especially high impact because exploitation through SAP Internet Communication Manager can give unprivileged attackers administrative privileges on vulnerable SAP hosts.","SAP vulnerabilities have a documented history of real-world abuse, with CISA adding 14 SAP flaws to its known exploited vulnerabilities list since November 2021, including three abused by ransomware gangs."],"referencedReports":[{"title":"September 2026 Security Updates","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/september-2026.html","publisher":"SAP","context":"The article says SAP addressed 20 vulnerabilities across multiple products in its September 2026 security updates.","category":"advisory","primary":true},{"title":"SAP OVERPASS Remediation","url":"https://onapsis.com/blog/sap-overpass-remediation/","publisher":"Onapsis","context":"The article cites Onapsis researchers who reported the OVERPASS vulnerability and links to their remediation analysis.","category":"advisory","primary":true},{"title":"S4GET CVE-2026-58240 SAP Message Server Threat Advisory","url":"https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/","publisher":"Onapsis Research Labs","context":"The article says Onapsis Research Labs named and analyzed the S4GET vulnerability in SAP NetWeaver Message Server.","category":"advisory","primary":true}],"body":"\u003cp\u003eSAP addressed 20 vulnerabilities across multiple products in its September 2026 security updates, including a maximum-severity memory corruption flaw in SAP Kernel code. The flaw is tracked as CVE-2026-44756 and was dubbed OVERPASS by Onapsis security researchers who reported it. It stems from a classic buffer overflow weakness in the Extended Passport Protocol processing library.\u003c/p\u003e\n\n\u003cp\u003eSuccessful exploitation of OVERPASS lets unprivileged threat actors run arbitrary commands on vulnerable SAP hosts with administrative privileges. The article says this can lead to full compromise of underlying SAP processes and business data. The flaw can be exploited over SAP Internet Communication Manager, the networking component of SAP Application Server that connects SAP systems to the Internet via HTTP, HTTPS, and SMTP.\u003c/p\u003e\n\n\u003cp\u003eOnapsis estimates that more than 10,000 Internet-facing SAP systems use the vulnerable component and are potentially exposed to attacks exploiting CVE-2026-44756. SAP also addressed CVE-2026-58240, a critical missing authentication vulnerability in SAP NetWeaver Message Server named S4GET by Onapsis Research Labs. After successful exploitation, unauthenticated attackers can access the entire SAP system cluster and execute malicious payloads and arbitrary commands remotely across the network.\u003c/p\u003e\n"},{"n":15,"title":"Hackers breach F5 BIG-IP APM devices to deploy Linux rootkit","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-breach-f5-big-ip-apm-devices-to-deploy-linux-rootkit/","time":"20:08","priority":"MUST READ","score":94,"tldr":"Attackers are compromising F5 BIG-IP APM devices, likely via CVE-2025-53521, to deploy a Linux rootkit that injects a fileless PHP web shell into memory and avoids leaving malicious files on disk. Defenders should patch affected systems and look for signs such as unusual POST requests to targeted .php3 files, HTTP 201 CSS-like responses, and Apache processes altering libphp memory or spawning bash.","briefOverview":"\u003cp\u003eA Linux rootkit targeting F5 BIG-IP APM environments can intercept PHP file loading and inject a fileless web shell directly into memory. Sophos researchers said the malware appears to be a second-stage payload likely deployed after exploitation of CVE-2025-53521, a critical remote code execution flaw that F5 Networks reclassified from a DoS issue in March. ESET has also analyzed the same malware and identifies it as PoisonedRefresh.\u003c/p\u003e\n\n\u003cp\u003eSophos said the payload was deployed by a distinct installer or propagation component that infected the Apache /usr/sbin/httpd executable used on BIG-IP APM systems. The installer also modified SELinux configurations and achieved persistence across BIG-IP upgrade images. The second-stage implant hides key operational strings with RC4, intercepts __libc_start_main, hooks the Apache Portable Runtime module loader apr_dso_load, and injects a PHP web shell into memory.\u003c/p\u003e\n\n\u003cp\u003eThe rootkit targets Apache PHP behavior and modifies in-memory copies of legitimate BIG-IP APM webtop scripts such as apm_css.php3, full_wt.php3, and webtop_popup_css.php3 while leaving the files on disk unchanged. The injected web shell accepts specially formatted requests, decrypts their contents, executes them through PHP’s eval() function, and returns an HTTP 201 response disguised as CSS content. Sophos also noted a password-protected local UNIX socket backdoor that can launch an interactive Bash shell, and advised defenders to investigate signals such as Apache workers reading /proc/self/maps, changes to libphp memory protections, creation of /run/bigtlog.pipe, launches of /bin/bash, and unusual POST requests to the targeted .php3 endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Linux rootkit targeting F5 BIG-IP APM environments can intercept PHP file loading and inject a fileless web shell directly into memory without writing malicious code to disk.","Sophos researchers said the malware appears to be a second-stage payload likely deployed after exploitation of CVE-2025-53521, a critical remote code execution flaw in F5 BIG-IP.","The implant hooks Apache and PHP-related loading mechanisms, targets BIG-IP APM webtop PHP files such as apm_css.php3, full_wt.php3, and webtop_popup_css.php3, and leaves the PHP files on disk unchanged.","The injected web shell accepts specially formatted requests, decrypts their contents, executes them through PHP’s eval() function, and returns an HTTP 201 response disguised as CSS content.","Sophos said defenders should look for signs such as Apache workers reading /proc/self/maps, changes to libphp memory protections, creation of /run/bigtlog.pipe, launches of /bin/bash, and unusual POST requests to the targeted .php3 endpoints."],"insights":["Because the malicious PHP web shell is injected only into memory and the PHP files on disk remain unchanged, file integrity checks of the targeted scripts alone may not reveal the compromise.","The implant targets legitimate BIG-IP APM webtop PHP files such as apm_css.php3, full_wt.php3, and webtop_popup_css.php3 because Sophos says they are common in those environments and less likely to trigger security alerts.","The local UNIX socket backdoor does not open an internet-exposed TCP listening port, so network scans looking only for new listening ports may miss this access mechanism.","The malware delays creation of its local backdoor until Apache begins routine time calls, a behavior Sophos says reduces the risk of service disruption and helps it blend into normal runtime activity.","Unusual combinations such as POST requests to specific .php3 endpoints and HTTP 201 responses with a text/css content type are concrete detection leads tied to this malware’s web shell behavior."],"referencedReports":[{"title":"Dissecting a PHP web server rootkit","url":"https://www.sophos.com/en-us/blog/dissecting-a-php-web-server-rootkit","publisher":"Sophos","context":"The article cites Sophos technical analysis explaining how the rootkit hooks Apache and PHP behavior, injects an in-memory web shell, and creates a local UNIX socket backdoor.","category":"research","primary":true}],"body":"\u003cp\u003eA Linux rootkit targeting F5 BIG-IP APM environments can intercept PHP file loading and inject a fileless web shell directly into memory. Sophos researchers said the malware appears to be a second-stage payload likely deployed after exploitation of CVE-2025-53521, a critical remote code execution flaw that F5 Networks reclassified from a DoS issue in March. ESET has also analyzed the same malware and identifies it as PoisonedRefresh.\u003c/p\u003e\n\n\u003cp\u003eSophos said the payload was deployed by a distinct installer or propagation component that infected the Apache /usr/sbin/httpd executable used on BIG-IP APM systems. The installer also modified SELinux configurations and achieved persistence across BIG-IP upgrade images. The second-stage implant hides key operational strings with RC4, intercepts __libc_start_main, hooks the Apache Portable Runtime module loader apr_dso_load, and injects a PHP web shell into memory.\u003c/p\u003e\n\n\u003cp\u003eThe rootkit targets Apache PHP behavior and modifies in-memory copies of legitimate BIG-IP APM webtop scripts such as apm_css.php3, full_wt.php3, and webtop_popup_css.php3 while leaving the files on disk unchanged. The injected web shell accepts specially formatted requests, decrypts their contents, executes them through PHP’s eval() function, and returns an HTTP 201 response disguised as CSS content. Sophos also noted a password-protected local UNIX socket backdoor that can launch an interactive Bash shell, and advised defenders to investigate signals such as Apache workers reading /proc/self/maps, changes to libphp memory protections, creation of /run/bigtlog.pipe, launches of /bin/bash, and unusual POST requests to the targeted .php3 endpoints.\u003c/p\u003e\n"},{"n":22,"title":"Microsoft posts nearly 1,000 bugs for Patch Tuesday as CISA warns two being exploited","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/microsoft-patch-tuesday-september-2026","time":"22:40","priority":"MUST READ","score":94,"tldr":"Microsoft disclosed a record 973 vulnerabilities in its September Patch Tuesday release, with CISA warning that two Windows flaws are already being exploited and ordering federal agencies to patch by September 22. Researchers say the bugs could enable privilege escalation and broader attack chains, adding to a record-breaking year for Microsoft vulnerability disclosures.","briefOverview":"\u003cp\u003eMicrosoft’s latest Patch Tuesday release disclosed 973 bugs, surpassing 900 vulnerabilities for the first time. CISA confirmed that two of them, CVE-2026-81963 and CVE-2026-85880, are being exploited by hackers. Federal agencies have until September 22 to patch those two vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eTenable’s Satnam Narang said CVE-2026-81963 relates to a component used to install Windows updates, while CVE-2026-85880 affects a messaging system in Windows. Nightwing cybersecurity expert Nick Carroll said more than 22,000 corporate Exchange servers are unpatched against weaponized exploit code. Other experts said bugs like CVE-2026-81963 can be an early step in a ransomware chain where attackers phish one user and use that access to gain escalated privileges.\u003c/p\u003e\n\n\u003cp\u003eThe release continues a record-setting year for Microsoft vulnerability disclosures, bringing the year’s total to more than 2,600 bugs, according to Narang. The article notes that cybersecurity researchers and defenders have warned that artificial intelligence code-review tools could lead to many minor vulnerabilities that attackers might chain together. Qualys expert Diksha Ojha also noted that Adobe announced a separate critical-severity bug in Adobe Commerce this month.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft disclosed 973 bugs in its latest Patch Tuesday release, surpassing 900 vulnerabilities for the first time.","CISA confirmed that CVE-2026-81963 and CVE-2026-85880 are being exploited by hackers and gave federal agencies until September 22 to patch them.","Tenable’s Satnam Narang said CVE-2026-81963 relates to a component used to install Windows updates, while CVE-2026-85880 affects a messaging system in Windows.","Nightwing cybersecurity expert Nick Carroll said more than 22,000 corporate Exchange servers are unpatched against weaponized exploit code.","Narang said the latest Patch Tuesday release brings the year’s total disclosed bugs to more than 2,600, already more than double the previous record-setting year of 2020."],"insights":["The patch volume is accelerating sharply, with Microsoft setting a record in June, tripling it in July, and then surpassing 900 vulnerabilities in the latest Patch Tuesday.","Researchers linked the surge in disclosed bugs to the use of artificial intelligence code-review tools, warning that many minor flaws could still become dangerous when combined.","CVE-2026-81963 is especially operationally sensitive because it affects the Windows update stack, meaning attackers who control it may interfere with the same mechanism defenders rely on to remove them.","Automox’s Serena DiPenti said organizations that cannot confirm when the update stack last ran also cannot confirm whether the system is actually patched."],"referencedReports":[{"title":"Microsoft Security Update Guide release notes for September 2026","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Sep","publisher":"Microsoft","context":"The article cites Microsoft’s Patch Tuesday release notes as the source for the 973 disclosed bugs.","category":"advisory","primary":true},{"title":"Adobe Commerce security update APSB26-146","url":"https://helpx.adobe.com/security/products/magento/apsb26-146.html","publisher":"Adobe","context":"The article says Adobe announced another critical-severity vulnerability this month in Adobe Commerce.","category":"advisory","primary":false},{"title":"StyleSmuggler 0day","url":"https://sansec.io/research/stylesmuggler-0day","publisher":"Sansec","context":"The article links to Sansec’s analysis when referring to a critical-severity bug in Adobe Commerce.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft’s latest Patch Tuesday release disclosed 973 bugs, surpassing 900 vulnerabilities for the first time. CISA confirmed that two of them, CVE-2026-81963 and CVE-2026-85880, are being exploited by hackers. Federal agencies have until September 22 to patch those two vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eTenable’s Satnam Narang said CVE-2026-81963 relates to a component used to install Windows updates, while CVE-2026-85880 affects a messaging system in Windows. Nightwing cybersecurity expert Nick Carroll said more than 22,000 corporate Exchange servers are unpatched against weaponized exploit code. Other experts said bugs like CVE-2026-81963 can be an early step in a ransomware chain where attackers phish one user and use that access to gain escalated privileges.\u003c/p\u003e\n\n\u003cp\u003eThe release continues a record-setting year for Microsoft vulnerability disclosures, bringing the year’s total to more than 2,600 bugs, according to Narang. The article notes that cybersecurity researchers and defenders have warned that artificial intelligence code-review tools could lead to many minor vulnerabilities that attackers might chain together. Qualys expert Diksha Ojha also noted that Adobe announced a separate critical-severity bug in Adobe Commerce this month.\u003c/p\u003e\n"},{"n":25,"title":"Slim Spider Steals Crypto Custody Secrets From Brazilian Financial Institution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/slim-spider-steals-crypto-custody.html","time":"16:20","priority":"MUST READ","score":92,"tldr":"CrowdStrike says a previously undocumented Brazil-based threat actor, Slim Spider, has been targeting Brazilian financial institutions to steal cloud credentials and cryptocurrency custody secrets, with a focus on Pix and digital asset infrastructure. The activity highlights a shift toward sophisticated intrusions against core financial payment systems rather than traditional retail banking fraud.","briefOverview":"\u003cp\u003eCrowdStrike has linked attacks on Brazilian financial institutions since at least March 2026 to a previously undocumented, financially motivated threat actor it calls \u003cstrong\u003eSlim Spider\u003c/strong\u003e. The Brazil-based activity cluster has demonstrated deep knowledge of Brazilian financial infrastructure, including Pix, digital asset platforms, and cloud environments used by financial entities. In a late March 2026 intrusion at a Brazil-based financial institution, the group targeted cryptocurrency assets and instant payment accounts.\u003c/p\u003e\n\n\u003cp\u003eSlim Spider used custom Bash scripts to query cloud instance metadata and steal temporary cloud credentials over socket connections. After gaining access to the organization’s cloud environment, the actor enumerated secrets in the cloud credential manager and modified secret-extracting scripts with \u003ccode\u003esed\u003c/code\u003e, focusing on credentials tied to digital financial assets. CrowdStrike said the group also used \u003ccode\u003ecast\u003c/code\u003e from the Foundry Ethereum developer toolkit to derive an Ethereum wallet address from a stolen private key, and implemented cloud-native cryptographic signing directly through OpenSSL in Bash scripts.\u003c/p\u003e\n\n\u003cp\u003eThe actor also accessed nodes in a cloud container service cluster and deployed backdoors designed to look like infrastructure-related binaries. It then pivoted to Azure DevOps, likely with compromised credentials, to run malicious pipelines that deployed implants across a managed Kubernetes cluster, including one named \u003ccode\u003espi\u003c/code\u003e to mimic Brazil’s Sistema de Pagamentos Instantâneos. The article also notes that another group, Breeze Comet, has targeted Brazilian financial systems to abuse Pix, Boleto, and STR payment infrastructure, showing that Brazil’s widely used payment systems have become lucrative targets for financially motivated actors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrowdStrike is tracking a previously undocumented Brazil-based financially motivated threat actor named Slim Spider that has targeted Brazilian financial institutions since at least March 2026.","Slim Spider carried out a multi-stage intrusion at a Brazil-based financial institution in late March 2026, targeting the organization’s cryptocurrency assets and instant payment accounts.","The group used custom Bash scripts to query cloud instance metadata, steal temporary cloud credentials, enumerate cloud-stored secrets, and focus on credentials tied to digital financial assets.","Slim Spider also pivoted to Azure DevOps to run malicious pipelines that deployed implants across a managed Kubernetes cluster, including one named “spi” to mimic Brazil’s Pix payment infrastructure.","The article says another group, Breeze Comet, has also infiltrated Brazilian financial systems to abuse Pix, Boleto, and STR payment infrastructure for fraudulent transactions."],"insights":["Slim Spider avoided third-party cryptographic libraries and instead used OpenSSL directly inside Bash scripts, which CrowdStrike described as a deliberate operational security choice to reduce detection risk.","The group’s tooling shows specialization in Brazilian finance, including panels for categorizing financial API endpoints, searching compromised Microsoft 365 mailboxes by finance-related roles, and executing bulk unauthorized Pix transfers.","Slim Spider attempted to blend malicious implants into the target environment by naming one “spi,” imitating the Brazilian instant payments infrastructure acronym Sistema de Pagamentos Instantâneos.","The article highlights that separate groups, Slim Spider and Breeze Comet, are both targeting Pix and related payment infrastructure, indicating that Brazil’s widely used instant payment ecosystem has become a repeated target for financially motivated actors."],"referencedReports":[{"title":"CrowdStrike 2026 Threat Hunting Report","url":"https://go.crowdstrike.com/rs/281-OBQ-266/images/CrowdStrike-2026-Threat-Hunting-Report.pdf","publisher":"CrowdStrike","context":"The article cites CrowdStrike’s report as the source for details on Slim Spider’s targeting of Brazilian financial infrastructure and cloud environments.","category":"research","primary":true},{"title":"Slim Spider Adversary Profile","url":"https://www.crowdstrike.com/en-us/adversaries/slim-spider/","publisher":"CrowdStrike","context":"The article references CrowdStrike’s adversary profile for additional details on Slim Spider’s tools, including the MikeDor backdoor, and its targeting of cryptocurrency custody credentials.","category":"research","primary":true}],"body":"\u003cp\u003eCrowdStrike has linked attacks on Brazilian financial institutions since at least March 2026 to a previously undocumented, financially motivated threat actor it calls \u003cstrong\u003eSlim Spider\u003c/strong\u003e. The Brazil-based activity cluster has demonstrated deep knowledge of Brazilian financial infrastructure, including Pix, digital asset platforms, and cloud environments used by financial entities. In a late March 2026 intrusion at a Brazil-based financial institution, the group targeted cryptocurrency assets and instant payment accounts.\u003c/p\u003e\n\n\u003cp\u003eSlim Spider used custom Bash scripts to query cloud instance metadata and steal temporary cloud credentials over socket connections. After gaining access to the organization’s cloud environment, the actor enumerated secrets in the cloud credential manager and modified secret-extracting scripts with \u003ccode\u003esed\u003c/code\u003e, focusing on credentials tied to digital financial assets. CrowdStrike said the group also used \u003ccode\u003ecast\u003c/code\u003e from the Foundry Ethereum developer toolkit to derive an Ethereum wallet address from a stolen private key, and implemented cloud-native cryptographic signing directly through OpenSSL in Bash scripts.\u003c/p\u003e\n\n\u003cp\u003eThe actor also accessed nodes in a cloud container service cluster and deployed backdoors designed to look like infrastructure-related binaries. It then pivoted to Azure DevOps, likely with compromised credentials, to run malicious pipelines that deployed implants across a managed Kubernetes cluster, including one named \u003ccode\u003espi\u003c/code\u003e to mimic Brazil’s Sistema de Pagamentos Instantâneos. The article also notes that another group, Breeze Comet, has targeted Brazilian financial systems to abuse Pix, Boleto, and STR payment infrastructure, showing that Brazil’s widely used payment systems have become lucrative targets for financially motivated actors.\u003c/p\u003e\n"},{"n":29,"title":"FreeIPA Flaw Chain Lets Anonymous Clients Create Reusable Administrator Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/freeipa-flaw-chain-lets-anonymous.html","time":"11:22","priority":"MUST READ","score":92,"tldr":"Red Hat disclosed a critical FreeIPA flaw chain that can let anonymous clients create reusable administrator credentials on default installs by abusing a 389 Directory Server access-control bug. FreeIPA 4.13.4 and related 389-ds updates address the issue, while admins without fixes should restrict LDAP access or disable anonymous binds where possible.","briefOverview":"\u003cp\u003eRed Hat disclosed a critical FreeIPA flaw, CVE-2026-76578, that can let a client that has never logged in create a Kerberos identity of its own choosing and end up in the administrators group. The attack depends on a second flaw in 389 Directory Server, CVE-2026-76560, involving an access-control rule that can treat an unauthenticated client with an empty name as the owner of an entry with an empty stored owner value. Red Hat says it reproduced the chain twice on a default FreeIPA installation, including on a machine with no access at all.\u003c/p\u003e\n\n\u003cp\u003eThe FreeIPA project fixed its side in version 4.13.4, while Red Hat published multiple 389-ds advisories and noted that fixed \u003ccode\u003eipa\u003c/code\u003e packages for Red Hat Enterprise Linux were not listed when checked on 8 September. Red Hat recommends restricting LDAP access to trusted hosts or disabling anonymous LDAP binds until a fixed package is available, if the deployment can tolerate that change. The article also notes that the published material does not say whether fixes remove any attacker-created identity or what administrators should look for to detect one.\u003c/p\u003e\n\n\u003cp\u003eRed Hat also disclosed a separate FreeIPA flaw, CVE-2026-79678, in the \u003ccode\u003eidp-add\u003c/code\u003e command, where user-supplied values reach a Python \u003ccode\u003eeval()\u003c/code\u003e call before the permission check. Red Hat says the flaw does not allow code execution, but any account on the server can read environment variables one at a time through returned errors or consume server memory with a short arithmetic expression. Container installs may be more affected if Directory Manager or administrator passwords remain in the running process environment after first boot.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Red Hat disclosed a critical FreeIPA flaw tracked as CVE-2026-76578 that can let a client that has never logged in create a Kerberos identity of its own choosing in the directory and end up in the administrators group.","The FreeIPA issue becomes exploitable through a second flaw in 389 Directory Server, CVE-2026-76560, where an unauthenticated client with an empty name can match an empty stored owner value in an access-control rule.","The FreeIPA project fixed its side of the issue in version 4.13.4, while Red Hat published multiple 389-ds advisories on 8 September and had not yet listed fixed ipa packages for Red Hat Enterprise Linux when checked.","Red Hat also disclosed a separate FreeIPA flaw, CVE-2026-79678, in which the idp-add command passes user-supplied values into a Python eval() call before the permission check, allowing any account on the server to read environment variables one at a time or consume server memory.","Red Hat recommends temporarily restricting LDAP access or disabling anonymous LDAP binds for the FreeIPA chain until fixed packages are available, and says a fixed package is required for the idp-add flaw."],"insights":["The chain is especially severe because FreeIPA’s default access-control rule is the exact shape needed to trigger the 389 Directory Server flaw, so Red Hat reproduced it on an untouched FreeIPA installation rather than only on a custom deployment.","An earlier FreeIPA fix for CVE-2026-13097 blocked impersonation of an existing admin name but did not remove the underlying unauthenticated write path, allowing attackers to use a new name and still reach the same practical outcome.","Red Hat says Red Hat Directory Server does not ship the vulnerable access-control rule by default, which means the 389 Directory Server flaw is broadly relevant but only becomes dangerous on its own where deployments have created such a rule.","For container-based FreeIPA installs, the separate idp-add flaw may be more sensitive because Directory Manager and administrator passwords are often provided as environment variables at first boot and could be exposed if they remain in the running process environment.","The published material does not say whether patching removes identities an attacker may already have created or what administrators should look for, leaving a gap in post-fix validation and incident checking."],"referencedReports":[{"title":"FreeIPA 4.13.4 Release Notes","url":"https://www.freeipa.org/release-notes/4-13-4.html","publisher":"FreeIPA Project","context":"The article cites this release as the FreeIPA project fix for both FreeIPA flaws.","category":"advisory","primary":true},{"title":"CVE-2026-76578","url":"https://access.redhat.com/security/cve/CVE-2026-76578","publisher":"Red Hat","context":"The article cites Red Hat's CVE page for the critical FreeIPA flaw and its preliminary CVSS score.","category":"advisory","primary":true},{"title":"CVE-2026-76560","url":"https://access.redhat.com/security/cve/CVE-2026-76560","publisher":"Red Hat","context":"The article cites Red Hat's CVE page for the 389 Directory Server access-control flaw used in the FreeIPA chain.","category":"advisory","primary":true},{"title":"FreeIPA 4.13.3 Release Notes","url":"https://www.freeipa.org/release-notes/4-13-3.html","publisher":"FreeIPA Project","context":"The article cites this release as the earlier fix for CVE-2026-13097, which blocked a prior Kerberos-name collision issue.","category":"advisory","primary":false},{"title":"Bug 2519522","url":"https://bugzilla.redhat.com/show_bug.cgi?id=2519522","publisher":"Red Hat Bugzilla","context":"The article links this bug report while noting that advisories and bug reports do not describe real-world exploitation.","category":"advisory","primary":true},{"title":"CVE-2026-79678","url":"https://access.redhat.com/security/cve/CVE-2026-79678","publisher":"Red Hat","context":"The article cites Red Hat's CVE page for the separate FreeIPA idp-add flaw involving Python eval().","category":"advisory","primary":true},{"title":"Bug 2519521","url":"https://bugzilla.redhat.com/show_bug.cgi?id=2519521","publisher":"Red Hat Bugzilla","context":"The article cites this 389-ds bug record as listing Red Hat advisories published on 8 September.","category":"advisory","primary":true},{"title":"RHSA-2026:64785","url":"https://access.redhat.com/errata/RHSA-2026:64785","publisher":"Red Hat","context":"The article cites this Red Hat security advisory as covering Red Hat Enterprise Linux 10 with a fixed 389-ds-base package.","category":"advisory","primary":false}],"body":"\u003cp\u003eRed Hat disclosed a critical FreeIPA flaw, CVE-2026-76578, that can let a client that has never logged in create a Kerberos identity of its own choosing and end up in the administrators group. The attack depends on a second flaw in 389 Directory Server, CVE-2026-76560, involving an access-control rule that can treat an unauthenticated client with an empty name as the owner of an entry with an empty stored owner value. Red Hat says it reproduced the chain twice on a default FreeIPA installation, including on a machine with no access at all.\u003c/p\u003e\n\n\u003cp\u003eThe FreeIPA project fixed its side in version 4.13.4, while Red Hat published multiple 389-ds advisories and noted that fixed \u003ccode\u003eipa\u003c/code\u003e packages for Red Hat Enterprise Linux were not listed when checked on 8 September. Red Hat recommends restricting LDAP access to trusted hosts or disabling anonymous LDAP binds until a fixed package is available, if the deployment can tolerate that change. The article also notes that the published material does not say whether fixes remove any attacker-created identity or what administrators should look for to detect one.\u003c/p\u003e\n\n\u003cp\u003eRed Hat also disclosed a separate FreeIPA flaw, CVE-2026-79678, in the \u003ccode\u003eidp-add\u003c/code\u003e command, where user-supplied values reach a Python \u003ccode\u003eeval()\u003c/code\u003e call before the permission check. Red Hat says the flaw does not allow code execution, but any account on the server can read environment variables one at a time through returned errors or consume server memory with a short arithmetic expression. Container installs may be more affected if Directory Manager or administrator passwords remain in the running process environment after first boot.\u003c/p\u003e\n"},{"n":11,"title":"Windows 11 cumulative updates KB5124008 \u0026 KB5122880 released","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-cumulative-updates-kb5124008-and-kb5122880-released/","time":"17:57","priority":"SHOULD READ","score":88,"tldr":"Microsoft release
