<script type="application/json" id="dl-articles">[{"n":22,"title":"GitLab CVSS 10 File-Read Flaw Draws In-the-Wild Probes After Disclosure","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/gitlab-cvss-10-file-read-flaw-draws-in.html","time":"16:30","priority":"MUST READ","score":98,"tldr":"GitLab has patched CVE-2026-85706, a CVSS 10 unauthenticated path-traversal flaw in its repository commits API that can expose arbitrary server files and is already being probed in the wild. Self-managed GitLab instances should urgently upgrade to 19.3.2, 19.2.6, or 19.1.8, or restrict public access.","briefOverview":"\u003cp\u003eGitLab released patches for CVE-2026-85706, a maximum-severity CVSS 10.0 flaw in its repository commits API. The issue results from improper path restrictions and missing login checks, potentially allowing an unauthenticated user to read arbitrary files from a GitLab server under certain conditions. It affects GitLab CE and EE versions from 18.7 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr said it observed active probes for the flaw beginning at 06:00 UTC on September 11, 2026, within hours of its public disclosure. Attackers could use the issue to access logs and GitLab configuration files that may contain credentials, secrets, and other sensitive information; exploitation requires at least one public project to exist. GitLab also patched CVE-2026-87719, a CVSS 9.9 GitLab EE insecure deserialization issue affecting authenticated users with Duo Chat access, and organizations with internet-exposed self-managed instances are urged to patch quickly or restrict public access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab patched CVE-2026-85706, a CVSS 10.0 path traversal flaw in the repository commits API that can allow unauthenticated users to read arbitrary files from a GitLab server under certain conditions.","CVE-2026-85706 affects GitLab CE and EE versions from 18.7 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2.","watchTowr reported observing active in-the-wild probes for CVE-2026-85706 from 06:00 UTC on September 11, 2026.","GitLab also fixed CVE-2026-87719, a CVSS 9.9 insecure deserialization issue in GitLab EE that could let authenticated Duo Chat users access Advanced Search configuration and sensitive credentials.","Organizations with internet-exposed self-managed GitLab instances are urged to apply the patches promptly or limit public access, and to review logs for relevant HTTP POST requests."],"insights":["Exploitation of CVE-2026-85706 requires only that at least one public project exists, lowering the barrier for attackers targeting exposed GitLab instances.","Defenders can look for possible exploitation attempts by reviewing logs for HTTP POST requests to /api/v4/projects/{id}/repository/commits/ that contain file.Path parameters.","The file-reading flaw may expose GitLab-specific configuration files and logs, creating a route to credentials, secrets, source code, and potentially software build pipelines.","GitLab’s patch release also addresses a separate critical GitLab EE issue affecting authenticated users with Duo Chat access, showing that organizations may need to account for more than one high-severity issue in the same updates."],"referencedReports":[{"title":"Patch release: GitLab 19.3.2, 19.2.6, and 19.1.8 released","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/","publisher":"gitlab","context":"The article cites GitLab's patch-release advisory for details of the security fixes, including CVE-2026-85706 and CVE-2026-87719.","category":"advisory","primary":true}],"body":"\u003cp\u003eGitLab released patches for CVE-2026-85706, a maximum-severity CVSS 10.0 flaw in its repository commits API. The issue results from improper path restrictions and missing login checks, potentially allowing an unauthenticated user to read arbitrary files from a GitLab server under certain conditions. It affects GitLab CE and EE versions from 18.7 before 19.1.8, 19.2 before 19.2.6, and 19.3 before 19.3.2.\u003c/p\u003e\n\n\u003cp\u003ewatchTowr said it observed active probes for the flaw beginning at 06:00 UTC on September 11, 2026, within hours of its public disclosure. Attackers could use the issue to access logs and GitLab configuration files that may contain credentials, secrets, and other sensitive information; exploitation requires at least one public project to exist. GitLab also patched CVE-2026-87719, a CVSS 9.9 GitLab EE insecure deserialization issue affecting authenticated users with Duo Chat access, and organizations with internet-exposed self-managed instances are urged to patch quickly or restrict public access.\u003c/p\u003e\n"},{"n":21,"title":"Cisco FMC Flaws Exploited to Steal Credentials and Deploy Qilin Ransomware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisco-fmc-flaws-exploited-to-steal.html","time":"06:19","priority":"MUST READ","score":97,"tldr":"Cisco warns that ransomware and state-linked threat clusters are actively exploiting two patched Secure Firewall Management Center flaws to gain access, steal credentials, deploy backdoors, and in one case launch Qilin ransomware. Organizations should immediately apply Cisco’s hotfixes for CVE-2026-20079 and CVE-2026-20316.","briefOverview":"\u003cp\u003eCisco disclosed that three threat clusters linked to ransomware and state-sponsored activity have exploited two recently patched vulnerabilities in Cisco Secure Firewall Management Center (FMC). CVE-2026-20079, rated 10.0, allows an unauthenticated remote attacker to bypass web-interface authentication, execute scripts, and obtain root access to the underlying operating system. CVE-2026-20316, rated 5.3, allows unauthenticated remote login through a low-privilege account and can be combined with other FMC flaws to elevate privileges.\u003c/p\u003e\n\n\u003cp\u003eUAT-12197 used the critical flaw to install JSP web shells and a Java-based command tool to query internal databases and obtain authentication data and credentials. UAT-11823 exploited both flaws to deploy a Netcat reverse shell, harvest managed-device configurations, and install a Cyclops Blink variant previously attributed to Sandworm. UAT-11988 used CVE-2026-20316 for initial access, conducted reconnaissance and credential collection with built-in FMC tools, and deployed Qilin ransomware on selected systems. Cisco urges affected customers to apply released hotfixes, while CISA has added both flaws to its Known Exploited Vulnerabilities catalog and requires U.S. federal civilian agencies to patch CVE-2026-20079 by September 12, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco reported that three threat clusters linked to ransomware and state-sponsored activity exploited two recently patched Cisco Secure Firewall Management Center vulnerabilities.","CVE-2026-20079 is a critical authentication-bypass flaw that can let an unauthenticated remote attacker execute scripts and obtain root access to the underlying operating system.","UAT-12197 used CVE-2026-20079 to deploy web shells and a Java-based command tool that queried internal databases for user authentication data and credentials.","UAT-11823 exploited both flaws to deploy a reverse shell, collect managed-device configurations, and install a Cyclops Blink variant.","UAT-11988 exploited CVE-2026-20316, used built-in FMC tools for reconnaissance and credential collection, and deployed Qilin ransomware on selected systems."],"insights":["The two flaws support different levels of access: CVE-2026-20079 can enable remote root-level access, while CVE-2026-20316 provides low-privilege access that can be combined with other FMC flaws to gain more control.","The same affected FMC platform was used for distinct attacker goals, including credential collection, harvesting managed-device configurations, deployment of a state-linked Cyclops Blink variant, and Qilin ransomware operations.","The Qilin-linked activity relied in part on legitimate built-in FMC tools to map the victim environment and identify systems for encryption, rather than relying only on externally introduced tools.","Patch urgency is reinforced by Cisco’s hotfix recommendation, its planned broader hardening release, and CISA’s requirement that U.S. federal civilian agencies remediate CVE-2026-20079 by September 12, 2026."],"referencedReports":[{"title":"FMC Ongoing Exploitation","url":"https://blog.talosintelligence.com/fmc-ongoing-exploitation/","publisher":"cisco-talos","context":"The article cites Cisco Talos's technical analysis identifying three threat clusters conducting post-compromise activity on Secure Firewall Management Center instances.","category":"research","primary":true}],"body":"\u003cp\u003eCisco disclosed that three threat clusters linked to ransomware and state-sponsored activity have exploited two recently patched vulnerabilities in Cisco Secure Firewall Management Center (FMC). CVE-2026-20079, rated 10.0, allows an unauthenticated remote attacker to bypass web-interface authentication, execute scripts, and obtain root access to the underlying operating system. CVE-2026-20316, rated 5.3, allows unauthenticated remote login through a low-privilege account and can be combined with other FMC flaws to elevate privileges.\u003c/p\u003e\n\n\u003cp\u003eUAT-12197 used the critical flaw to install JSP web shells and a Java-based command tool to query internal databases and obtain authentication data and credentials. UAT-11823 exploited both flaws to deploy a Netcat reverse shell, harvest managed-device configurations, and install a Cyclops Blink variant previously attributed to Sandworm. UAT-11988 used CVE-2026-20316 for initial access, conducted reconnaissance and credential collection with built-in FMC tools, and deployed Qilin ransomware on selected systems. Cisco urges affected customers to apply released hotfixes, while CISA has added both flaws to its Known Exploited Vulnerabilities catalog and requires U.S. federal civilian agencies to patch CVE-2026-20079 by September 12, 2026.\u003c/p\u003e\n"},{"n":1,"title":"Artifactory flaws chained in attacks deploying backdoor malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/artifactory-flaws-chained-in-attacks-deploying-backdoor-malware/","time":"16:29","priority":"MUST READ","score":96,"tldr":"Attackers are actively chaining critical JFrog Artifactory flaws to bypass authentication, obtain administrator access, and deploy persistent Rust backdoors on self-hosted servers. Administrators should urgently upgrade to patched releases and investigate for rogue accounts, tokens, plugins, and other indicators of compromise.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting critical and high-severity flaws in self-hosted JFrog Artifactory servers to bypass authentication, obtain administrator privileges, and deploy a Rust-based backdoor. Wiz observed multiple actors chaining CVE-2026-42018 and CVE-2026-42016 between August 15 and September 8, 2026. A third issue, CVE-2026-82329, was previously observed being exploited to create administrator tokens.\u003c/p\u003e\n\n\u003cp\u003eThe observed chain lets attackers obtain a low-privilege JSON Web Token for Artifactory’s internal anonymous user, even where anonymous access is disabled, then exchange it for an administrator-scoped token because of insufficient token validation. In some cases, attackers created an administrator account in under five minutes, generated long-lived tokens, installed malicious Groovy plugins for command execution, and added a Rust backdoor for persistent remote control. They also uploaded webshells, stole configuration data and cluster join keys, enumerated repositories, tokens, and users, and added SSH keys to new accounts.\u003c/p\u003e\n\n\u003cp\u003eWiz estimates that 49% to 62% of reachable Artifactory instances are vulnerable to at least one of the three flaws. Administrators are advised to upgrade to one of the listed patched Artifactory releases or later, investigate exposed instances for suspicious accounts, tokens, plugins, and enumeration activity, and restrict access to trusted systems. Wiz also published indicators of compromise associated with the observed attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Multiple threat actors exploited CVE-2026-42018 and CVE-2026-42016 against self-hosted JFrog Artifactory instances between August 15 and September 8, 2026.","The exploit chain obtains a low-privilege token for Artifactory’s internal anonymous user and then uses insufficient token validation to obtain an administrator-scoped token.","Attackers created administrator accounts, generated long-lived access tokens, installed malicious Groovy plugins, and deployed a Rust-based backdoor with command-and-control capabilities.","The attackers also downloaded payloads to temporary directories, uploaded webshells, stole Artifactory configuration data and cluster join keys, and enumerated repositories, tokens, and users.","Wiz estimates that 49% to 62% of reachable Artifactory instances are vulnerable to at least one of the three identified flaws and recommends upgrading to patched releases."],"insights":["Disabling anonymous access did not prevent attackers from obtaining a token for Artifactory’s internal anonymous user through CVE-2026-42018.","In some observed cases, attackers needed less than five minutes to create an administrator account after targeting a vulnerable instance.","The attackers established persistence through both long-lived access tokens and malicious Groovy plugins, rather than relying only on a single backdoor.","Artifactory cluster join keys and configuration data were among the information stolen, alongside repository, token, and user enumeration."],"referencedReports":[{"title":"Artifactory Under Attack in the Wild: Exploitation of CVE-2026-42016 and CVE-2026-42018","url":"https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201","publisher":"wiz","context":"Wiz's report documents multiple actors chaining the two Artifactory vulnerabilities to obtain administrator access and deploy a Rust backdoor.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are actively exploiting critical and high-severity flaws in self-hosted JFrog Artifactory servers to bypass authentication, obtain administrator privileges, and deploy a Rust-based backdoor. Wiz observed multiple actors chaining CVE-2026-42018 and CVE-2026-42016 between August 15 and September 8, 2026. A third issue, CVE-2026-82329, was previously observed being exploited to create administrator tokens.\u003c/p\u003e\n\n\u003cp\u003eThe observed chain lets attackers obtain a low-privilege JSON Web Token for Artifactory’s internal anonymous user, even where anonymous access is disabled, then exchange it for an administrator-scoped token because of insufficient token validation. In some cases, attackers created an administrator account in under five minutes, generated long-lived tokens, installed malicious Groovy plugins for command execution, and added a Rust backdoor for persistent remote control. They also uploaded webshells, stole configuration data and cluster join keys, enumerated repositories, tokens, and users, and added SSH keys to new accounts.\u003c/p\u003e\n\n\u003cp\u003eWiz estimates that 49% to 62% of reachable Artifactory instances are vulnerable to at least one of the three flaws. Administrators are advised to upgrade to one of the listed patched Artifactory releases or later, investigate exposed instances for suspicious accounts, tokens, plugins, and enumeration activity, and restrict access to trusted systems. Wiz also published indicators of compromise associated with the observed attacks.\u003c/p\u003e\n"},{"n":8,"title":"GitLab urges users to patch max severity path traversal flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/gitlab-urges-users-to-patch-max-severity-path-traversal-flaw/","time":"11:15","priority":"MUST READ","score":96,"tldr":"GitLab is urging self-managed users to immediately upgrade to versions 19.3.2, 19.2.6, or 19.1 to fix CVE-2026-85706, a maximum-severity unauthenticated path traversal flaw that can expose arbitrary server files. Internet-wide probing has already begun, making rapid patching and log review essential.","briefOverview":"\u003cp\u003eGitLab urged users to immediately patch CVE-2026-85706, a maximum-severity path traversal issue in the repository commits API. Under certain conditions, an unauthenticated attacker can use the flaw to read arbitrary data from a vulnerable server, including credentials, secrets, and other sensitive information. watchTowr reported seeing probes for unpatched, Internet-exposed GitLab servers only a day after disclosure.\u003c/p\u003e\n\n\u003cp\u003eGitLab fixed the issue in Community Edition and Enterprise Edition versions 19.3.2, 19.2.6, and 19.1, and said GitLab.com is already patched while GitLab Dedicated customers need take no action. watchTowr advised defenders to look for HTTP POST requests to \u003ccode\u003e/api/v4/projects/{id}/repository/commits/\u003c/code\u003e addresses containing \u003ccode\u003efile.path\u003c/code\u003e parameters as potential signs of attempted abuse. The same patch release also fixed CVE-2026-87719, a critical GitLab EE issue that could allow authenticated users with Duo Chat access to steal sensitive credentials and Advanced Search instance configurations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab patched CVE-2026-85706, a maximum-severity path traversal flaw in its repository commits API that can let unauthenticated attackers read arbitrary data from vulnerable servers under certain conditions.","GitLab released fixes in Community Edition and Enterprise Edition versions 19.3.2, 19.2.6, and 19.1, and urged self-managed customers to upgrade immediately.","GitLab.com is already running a patched version, and GitLab Dedicated customers do not need to take action.","watchTowr reported observing in-the-wild probes for CVE-2026-85706 against Internet-exposed GitLab servers.","The same release also fixed CVE-2026-87719, a critical insecure deserialization issue affecting GitLab EE that could allow authenticated users with Duo Chat access to steal sensitive credentials and Advanced Search instance configurations."],"insights":["The flaw can be targeted in a single HTTP request without authentication, which means an exposed unpatched GitLab server could be probed without the attacker first obtaining an account.","watchTowr provided a concrete detection lead: defenders can review logs for HTTP POST requests to repository commits API URLs containing a \"file.path\" parameter.","GitLab’s September patch release addressed two distinct critical issues with different access requirements: CVE-2026-85706 can affect unauthenticated users, while CVE-2026-87719 requires an authenticated user with Duo Chat access.","GitLab has a history of high-impact flaws being exploited in attacks, with CISA having listed four GitLab vulnerabilities as exploited since November 2021."],"referencedReports":[{"title":"Patch release: GitLab 19.3.2 released","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-3-2-released/","publisher":"gitlab","context":"GitLab's patch-release advisory documents CVE-2026-85706 and CVE-2026-87719 and recommends that self-managed installations upgrade immediately.","category":"advisory","primary":true}],"body":"\u003cp\u003eGitLab urged users to immediately patch CVE-2026-85706, a maximum-severity path traversal issue in the repository commits API. Under certain conditions, an unauthenticated attacker can use the flaw to read arbitrary data from a vulnerable server, including credentials, secrets, and other sensitive information. watchTowr reported seeing probes for unpatched, Internet-exposed GitLab servers only a day after disclosure.\u003c/p\u003e\n\n\u003cp\u003eGitLab fixed the issue in Community Edition and Enterprise Edition versions 19.3.2, 19.2.6, and 19.1, and said GitLab.com is already patched while GitLab Dedicated customers need take no action. watchTowr advised defenders to look for HTTP POST requests to \u003ccode\u003e/api/v4/projects/{id}/repository/commits/\u003c/code\u003e addresses containing \u003ccode\u003efile.path\u003c/code\u003e parameters as potential signs of attempted abuse. The same patch release also fixed CVE-2026-87719, a critical GitLab EE issue that could allow authenticated users with Duo Chat access to steal sensitive credentials and Advanced Search instance configurations.\u003c/p\u003e\n"},{"n":14,"title":"PaperCut Replaces Emergency Patches With Fixes for Two Actively Exploited Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/papercut-replaces-emergency-patches.html","time":"06:46","priority":"MUST READ","score":96,"tldr":"PaperCut has released fully tested maintenance updates for PaperCut NG/MF that replace emergency patches for CVE-2026-81578 and CVE-2026-82078, two actively exploited flaws enabling authentication bypass and arbitrary code execution. Organizations should upgrade to versions 26.0.5, 25.0.13, or 24.1.10 immediately.","briefOverview":"\u003cp\u003ePaperCut released regular maintenance updates for PaperCut NG/MF that replace all previously issued emergency patches for two actively exploited security flaws. The available versions are 26.0.5, 25.0.13, and 24.1.10. PaperCut said the releases include fixes from Emergency Patch Releases 1, 2, and 3, additional security hardening, and complete quality-assurance and standard release testing.\u003c/p\u003e\n\n\u003cp\u003eThe flaws, CVE-2026-81578 and CVE-2026-82078, have been exploited to bypass authentication and execute arbitrary code on affected instances. GreyNoise and Blackpoint Cyber reported that a suspected Russian-speaking actor used the flaws to break into at least 395 organizations in 48 countries, with many targets in the U.S. education sector. The activity reportedly used hundreds of AI agents powered by OpenAI’s Codex harness and a DeepSeek model, and PaperCut advises customers on emergency-patch builds to move to the latest maintenance releases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PaperCut released regular maintenance versions 26.0.5, 25.0.13, and 24.1.10 for PaperCut NG/MF, replacing its previous emergency patches.","The maintenance releases include the fixes from Emergency Patch Releases 1, 2, and 3, along with additional security hardening and standard quality-assurance testing.","CVE-2026-81578 and CVE-2026-82078 are being actively exploited to bypass authentication and execute arbitrary code on vulnerable PaperCut instances.","GreyNoise and Blackpoint Cyber reported that a suspected Russian-speaking actor used the two flaws to compromise at least 395 organizations in 48 countries, with many targets in the U.S. education sector.","PaperCut advises customers using an emergency patch build to move to a regular maintenance release."],"insights":["Organizations that installed PaperCut’s earlier emergency patches are still advised to upgrade, because the new maintenance releases supersede those builds and add further security hardening.","The reported campaign used hundreds of AI agents powered by OpenAI’s Codex harness and a DeepSeek model, illustrating that the actors conducted activity at scale across 48 countries.","The suspected actor reportedly avoided targets in Russia, China, Hong Kong, Thailand, Iran, and 23 additional countries, while concentrating many compromises in the U.S. education sector.","GreyNoise stated that it remains unclear whether the actor is only obtaining access for other actors or intends to use it directly for data theft or ransomware deployment."],"referencedReports":[{"title":"Security Bulletin — 27 August 2026 Urgent Security Advisory","url":"https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/","publisher":"PaperCut","context":"PaperCut’s advisory announces the tested maintenance releases that supersede the earlier emergency patches for the actively exploited flaws.","category":"advisory","primary":true}],"body":"\u003cp\u003ePaperCut released regular maintenance updates for PaperCut NG/MF that replace all previously issued emergency patches for two actively exploited security flaws. The available versions are 26.0.5, 25.0.13, and 24.1.10. PaperCut said the releases include fixes from Emergency Patch Releases 1, 2, and 3, additional security hardening, and complete quality-assurance and standard release testing.\u003c/p\u003e\n\n\u003cp\u003eThe flaws, CVE-2026-81578 and CVE-2026-82078, have been exploited to bypass authentication and execute arbitrary code on affected instances. GreyNoise and Blackpoint Cyber reported that a suspected Russian-speaking actor used the flaws to break into at least 395 organizations in 48 countries, with many targets in the U.S. education sector. The activity reportedly used hundreds of AI agents powered by OpenAI’s Codex harness and a DeepSeek model, and PaperCut advises customers on emergency-patch builds to move to the latest maintenance releases.\u003c/p\u003e\n"},{"n":17,"title":"Attackers Chain JFrog Artifactory Flaws to Gain Admin Control and Plant Backdoors","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-chain-jfrog-artifactory-flaws.html","time":"07:31","priority":"MUST READ","score":96,"tldr":"Attackers are actively chaining two patched JFrog Artifactory flaws, CVE-2026-42018 and CVE-2026-42016, to obtain administrator access and deploy persistent backdoors on unpatched self-hosted servers. Organizations should urgently upgrade, rotate join keys and tokens, and investigate for rogue admin accounts, plugins, and activity attributed to token:anonymous.","briefOverview":"\u003cp\u003eWiz observed attackers exploiting unpatched self-hosted JFrog Artifactory servers between August 15 and September 8 by chaining CVE-2026-42018 and CVE-2026-42016. The first flaw can provide an internal anonymous-user token to someone who has not logged in, while the second can let that low-privilege token be exchanged for one with administrator scope. Actions performed with the resulting token may appear in logs as \u003ccode\u003etoken:anonymous\u003c/code\u003e, despite having administrator-level permissions. Wiz saw some attackers create new administrator accounts in less than five minutes.\u003c/p\u003e\n\n\u003cp\u003eWith administrator access, attackers created persistent administrator accounts, installed malicious Groovy plugins that enabled code execution on the server, and ran shell commands to explore files. A dropper downloaded a binary over HTTP into locations such as \u003ccode\u003e/tmp\u003c/code\u003e and opened a command-and-control channel, while a custom Rust backdoor was also seen in multiple cases. Separately, CVE-2026-82329 is a critical authentication bypass that can grant unauthenticated attackers administrator privileges on its own across affected Artifactory release branches. Updating Artifactory is necessary, but it does not remove accounts, tokens, backdoors, or join keys that may already have been created or stolen, so the article recommends reviewing administrator accounts and configuration changes and rotating join keys and relevant tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Wiz observed attacks from August 15 to September 8 that chained CVE-2026-42018 and CVE-2026-42016 in unpatched self-hosted JFrog Artifactory servers to obtain administrator-level access.","CVE-2026-42018 can return an internal anonymous-user token to an unauthenticated caller, while CVE-2026-42016 can allow a low-privilege token to be exchanged for one with administrator scope.","Attackers created administrator accounts, installed malicious Groovy plugins for server code execution, ran shell commands, and in some cases deployed a custom Rust backdoor.","CVE-2026-82329 is a separate critical authentication bypass that can grant unauthenticated attackers administrator privileges on affected Artifactory branches without requiring another flaw.","Patching does not remove administrator accounts, tokens, backdoors, or join keys that attackers may have already created or stolen, so affected organizations should also rotate join keys and tokens and review accounts and configuration changes."],"insights":["Administrator actions performed through the chained flaws can appear in Artifactory logs as \"token:anonymous,\" which can obscure that an attacker had elevated privileges.","Wiz observed some attackers progress from an unauthenticated request to creating a new administrator account in under five minutes.","Although the two-flaw chain does not affect certain newer Artifactory branches, the separate CVE-2026-82329 authentication bypass can still affect releases up to version 7.161.","For CVE-2026-82329, organizations unable to upgrade immediately can add a randomly generated extra join key in system.yaml so only their own keys are accepted during service registration.","Fastly recorded roughly 406,000 CVE-2026-82329 exploitation attempts on September 2, but noted that these traffic observations do not represent confirmed compromises."],"referencedReports":[{"title":"Artifactory Under Attack in the Wild: Exploitation of CVE-2026-42016 and CVE-2026-42018","url":"https://www.wiz.io/blog/artifactory-under-attack-in-the-wild-exploitation-of-cve-2026-42016-cve-2026-4201","publisher":"wiz","context":"The article relies on Wiz's report for details of observed exploitation, attacker actions, and indicators of compromise.","category":"research","primary":true},{"title":"CVE-2026-82329: JFrog Artifactory Authentication Bypass Exploitation Activity","url":"https://www.fastly.com/blog/cve-2026-82329-jfrog-artifactory-authentication-bypass-exploitation-activity","publisher":"fastly","context":"The article cites Fastly's analysis for public exploit and scanning activity, exploitation-attempt volume, and post-compromise response guidance.","category":"research","primary":false},{"title":"JFrog Security Advisories","url":"https://docs.jfrog.com/releases/docs/jfrog-security-advisories","publisher":"jfrog","context":"The article references JFrog's advisories for affected Artifactory versions, fixed releases, and the workaround for CVE-2026-82329.","category":"advisory","primary":false}],"body":"\u003cp\u003eWiz observed attackers exploiting unpatched self-hosted JFrog Artifactory servers between August 15 and September 8 by chaining CVE-2026-42018 and CVE-2026-42016. The first flaw can provide an internal anonymous-user token to someone who has not logged in, while the second can let that low-privilege token be exchanged for one with administrator scope. Actions performed with the resulting token may appear in logs as \u003ccode\u003etoken:anonymous\u003c/code\u003e, despite having administrator-level permissions. Wiz saw some attackers create new administrator accounts in less than five minutes.\u003c/p\u003e\n\n\u003cp\u003eWith administrator access, attackers created persistent administrator accounts, installed malicious Groovy plugins that enabled code execution on the server, and ran shell commands to explore files. A dropper downloaded a binary over HTTP into locations such as \u003ccode\u003e/tmp\u003c/code\u003e and opened a command-and-control channel, while a custom Rust backdoor was also seen in multiple cases. Separately, CVE-2026-82329 is a critical authentication bypass that can grant unauthenticated attackers administrator privileges on its own across affected Artifactory release branches. Updating Artifactory is necessary, but it does not remove accounts, tokens, backdoors, or join keys that may already have been created or stolen, so the article recommends reviewing administrator accounts and configuration changes and rotating join keys and relevant tokens.\u003c/p\u003e\n"},{"n":16,"title":"Russian State-Sponsored Hackers Use Claude to Rebuild Malware After Detection","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/russian-state-sponsored-hackers-use.html","time":"14:10","priority":"MUST READ","score":93,"tldr":"Anthropic says a Russian state-linked group associated with Midnight Blizzard used Claude to automate malware rebuilding and redeployment whenever security tools detected it, accelerating evasion efforts. The campaign targeted government, defense, diplomatic, and related organizations across Ukraine, Europe, the Middle East, and Asia using phishing, DNS hijacking, credential theft, and tailored mobile and Windows malware.","briefOverview":"\u003cp\u003eAnthropic said it disrupted an AI-assisted campaign by GTG-20006, a Russian state-sponsored espionage group it associates with Midnight Blizzard, also known as APT29 or Cozy Bear. The group targeted military intelligence, government, diplomatic, defense, and related organizations, principally in Ukraine and Europe, with additional targets in the Middle East and Asia. Anthropic said the actor used Claude throughout its operations, including to register domains, establish phishing infrastructure, and monitor command-and-control channels.\u003c/p\u003e\n\n\u003cp\u003eA central feature of the campaign was an automated process that monitored whether deployed malware had been detected and then modified and rebuilt it to bypass those detections. The actor used phishing, ClickFix lures, and compromised hotel guest Wi-Fi vendors to redirect victims toward attacker-controlled services, delivering malware tailored for Windows, Android, and iOS devices. The campaign also included Microsoft 365 token theft, credential stealing, WhatsApp account takeovers, access to live camera streams, and the theft of identity, commercial registry, email, and other sensitive records.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic said it disrupted a campaign by Russian state-sponsored group GTG-20006, which it links to Midnight Blizzard, APT29, and Cozy Bear.","The group used Claude to monitor whether its malicious tools were detected and to automatically modify and rebuild them to evade existing security detections.","GTG-20006 targeted military intelligence, government, diplomatic, defense, and related organizations in Ukraine, Europe, the Middle East, and Asia.","The campaign included compromised hotel guest Wi-Fi vendors, where stolen administrator credentials were used to alter internet-address records and redirect guests to attacker-controlled services.","Anthropic said the group used AI throughout its operations, including registering domains, setting up phishing infrastructure, monitoring command-and-control channels, and maintaining the stealth of its tools."],"insights":["The group’s AI-assisted workflow was designed not only to create malicious tools but to watch for detection and autonomously rebuild them, reducing the time defenders have to rely on static indicators.","Compromising hotel guest Wi-Fi vendors enabled the actor to redirect guest traffic through altered DNS records and collect device identifiers and IP addresses before serving device-specific Windows, Android, or iOS lures.","The campaign used information taken from hotel management systems and guest devices to identify additional people of interest, including Ukrainian government officials and drone manufacturers.","The actor reportedly used headless browsers to link victims’ WhatsApp accounts as companion devices, bulk-export Russian- and Ukrainian-language conversations, and suppress read receipts.","The group also exploited authorization flaws in camera-streaming service interfaces to enumerate users and obtain tokens for victims’ live camera streams."],"referencedReports":[{"title":"Threat Intelligence Report: September 2026","url":"https://www.anthropic.com/threat-intelligence-report-september-2026","publisher":"anthropic","context":"Anthropic's threat intelligence report is the primary source cited for the disruption of GTG-20006's AI-assisted espionage campaign.","category":"research","primary":true}],"body":"\u003cp\u003eAnthropic said it disrupted an AI-assisted campaign by GTG-20006, a Russian state-sponsored espionage group it associates with Midnight Blizzard, also known as APT29 or Cozy Bear. The group targeted military intelligence, government, diplomatic, defense, and related organizations, principally in Ukraine and Europe, with additional targets in the Middle East and Asia. Anthropic said the actor used Claude throughout its operations, including to register domains, establish phishing infrastructure, and monitor command-and-control channels.\u003c/p\u003e\n\n\u003cp\u003eA central feature of the campaign was an automated process that monitored whether deployed malware had been detected and then modified and rebuilt it to bypass those detections. The actor used phishing, ClickFix lures, and compromised hotel guest Wi-Fi vendors to redirect victims toward attacker-controlled services, delivering malware tailored for Windows, Android, and iOS devices. The campaign also included Microsoft 365 token theft, credential stealing, WhatsApp account takeovers, access to live camera streams, and the theft of identity, commercial registry, email, and other sensitive records.\u003c/p\u003e\n"},{"n":20,"title":"China-Linked UNC3569 Exploited Sogou Input Method Flaw to Deploy GRAYRABBIT Backdoor","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/china-linked-unc3569-exploited-sogou.html","time":"07:14","priority":"MUST READ","score":93,"tldr":"China-linked UNC3569 exploited a Sogou Input Method Windows flaw to use a single crafted link to launch an outdated, unsandboxed Chromium instance and install the GRAYRABBIT backdoor. Tencent patched the link-handler entry point in Sogou Input Method version 16.3.0.3498, but its embedded Chromium 80 engine and disabled browser protections remain.","briefOverview":"\u003cp\u003eGen Digital said China-linked UNC3569 exploited a flaw in the Windows version of Sogou Input Method to install its GRAYRABBIT backdoor. The attack used a crafted \u003ccode\u003esgbiz:\u003c/code\u003e link to pass attacker-controlled arguments to Sogou’s settings program, which opened an attacker-selected site in the application’s built-in browser. Gen said a victim clicking the link was enough to give the attacker code execution with the logged-in user’s privileges, although Tencent said social engineering would be needed to have the user authorize a browser pop-up.\u003c/p\u003e\n\n\u003cp\u003eThe exploit used CVE-2021-38003, a Chrome JavaScript-engine flaw fixed in 2021 but still present in Sogou’s Chromium 80 build from 2020. Gen found that Sogou’s browser sandbox and same-origin protection were disabled, removing a normal barrier between a compromised web page and the computer. The payload used a malicious DLL loaded through 7-Zip to install GRAYRABBIT, which provides remote command access and communicates over RC4-scrambled TCP on port 443.\u003c/p\u003e\n\n\u003cp\u003eTencent released a fix in Sogou Input Method version 16.3.0.3498 that blocks unapproved web addresses in the \u003ccode\u003esgbiz:\u003c/code\u003e link handler. However, Gen found that the product still uses Chromium 80 and retains the disabled browser security settings. The article advises updating Sogou Input Method and checking for published indicators, including files written to \u003ccode\u003eC:\\Users\\Public\\Documents\u003c/code\u003e and connections to \u003ccode\u003email.uaiubifas[.]top\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Gen Digital reported that China-linked UNC3569 exploited a flaw in the Windows version of Sogou Input Method to deploy the GRAYRABBIT backdoor.","A crafted sgbiz: link could pass attacker-controlled arguments to Sogou's settings program, which opened the attacker’s chosen website in its built-in browser.","The attack used CVE-2021-38003 in Sogou’s Chromium 80-based browser, whose sandbox and same-origin protections were disabled, to run code with the logged-in user’s privileges.","The attackers used a malicious DLL loaded by 7-Zip to decrypt and install GRAYRABBIT, which communicates with mail.uaiubifas[.]top over RC4-scrambled TCP traffic on port 443.","Tencent patched the link handler in Sogou Input Method version 16.3.0.3498, but Gen found that the embedded Chromium 80 engine and disabled browser security settings remained unchanged."],"insights":["Tencent’s patch restricts the web addresses accepted by the Sogou link handler, but Gen found that the product still uses Chromium 80 with its sandbox and web-security protections disabled.","The malicious loader avoided many automated analysis environments by decrypting its payload only when it detected at least 50 running processes, then removed itself using an NTFS alternate data stream.","Even though the backdoor used port 443, its communications were RC4-scrambled plain TCP rather than normal TLS-encrypted web traffic, providing a specific detection clue.","The affected input method has a very large potential reach: Citizen Lab estimated more than 455 million monthly users across Windows, Android, and iOS, although Gen’s reported flaw is in the Windows version."],"referencedReports":[{"title":"One-Click Backdoor: Exploiting Sogou Input Method to Deploy GRAYRABBIT","url":"https://www.gendigital.com/blog/insights/research/one-click-backdoor-sogou","publisher":"gen-digital","context":"The article is based on Gen Digital’s research into UNC3569’s exploitation of Sogou Input Method and its analysis of Tencent’s patch.","category":"research","primary":true},{"title":"Down the GRAYRABBIT Hole: Exposing UNC3569 and Its Modus Operandi","url":"https://www.virusbulletin.com/uploads/pdf/conference/vb2024/papers/Down-the-GRAYRABBIT-hole-exposing-UNC3569-and-its-modus-operandi.pdf","publisher":"google-threat-intelligence","context":"The article cites Google Threat Intelligence’s analysis linking UNC3569 to China and describing the group’s targeting history and use of GRAYRABBIT.","category":"research","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article references CISA’s catalog to note that CVE-2021-38003 was added as a vulnerability known to have been exploited.","category":"advisory","primary":false},{"title":"TheHole New World: How a Small Leak Will Sink a Great Browser (CVE-2021-38003)","url":"https://starlabs.sg/blog/2022/12-thehole-new-world-how-a-small-leak-will-sink-a-great-browser-cve-2021-38003/","publisher":"star-labs","context":"The article cites STAR Labs’ technical analysis and working exploit code for CVE-2021-38003.","category":"research","primary":false}],"body":"\u003cp\u003eGen Digital said China-linked UNC3569 exploited a flaw in the Windows version of Sogou Input Method to install its GRAYRABBIT backdoor. The attack used a crafted \u003ccode\u003esgbiz:\u003c/code\u003e link to pass attacker-controlled arguments to Sogou’s settings program, which opened an attacker-selected site in the application’s built-in browser. Gen said a victim clicking the link was enough to give the attacker code execution with the logged-in user’s privileges, although Tencent said social engineering would be needed to have the user authorize a browser pop-up.\u003c/p\u003e\n\n\u003cp\u003eThe exploit used CVE-2021-38003, a Chrome JavaScript-engine flaw fixed in 2021 but still present in Sogou’s Chromium 80 build from 2020. Gen found that Sogou’s browser sandbox and same-origin protection were disabled, removing a normal barrier between a compromised web page and the computer. The payload used a malicious DLL loaded through 7-Zip to install GRAYRABBIT, which provides remote command access and communicates over RC4-scrambled TCP on port 443.\u003c/p\u003e\n\n\u003cp\u003eTencent released a fix in Sogou Input Method version 16.3.0.3498 that blocks unapproved web addresses in the \u003ccode\u003esgbiz:\u003c/code\u003e link handler. However, Gen found that the product still uses Chromium 80 and retains the disabled browser security settings. The article advises updating Sogou Input Method and checking for published indicators, including files written to \u003ccode\u003eC:\\Users\\Public\\Documents\u003c/code\u003e and connections to \u003ccode\u003email.uaiubifas[.]top\u003c/code\u003e.\u003c/p\u003e\n"},{"n":7,"title":"Hackers abused Claude to extract secrets from 1.8M Android apps","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-abused-claude-to-extract-secrets-from-18m-android-apps/","time":"20:19","priority":"SHOULD READ","score":88,"tldr":"Anthropic says threat actors including ShinyHunters, Russia-linked Midnight Blizzard, and China-linked GTG-10007 abused Claude to automate credential theft, reconnaissance, malware development, and intrusions. One ShinyHunters-linked actor reportedly scanned 1.8 million Android apps for hardcoded secrets, while Anthropic banned the accounts and strengthened misuse detection.","briefOverview":"\u003cp\u003eAnthropic reported that criminal and state-linked threat groups abused its Claude AI model between December 2025 and August 2026 for cyber operations, surveillance, scams, weapons development, and model distillation. The company said it disrupted the activity, banned involved accounts, updated safeguards, added faster misuse detection, and contacted authorities, industry partners, and victims. The reported actors included suspected ShinyHunters affiliates, Russia-linked Midnight Blizzard, and a Chinese-speaking group tracked as GTG-10007.\u003c/p\u003e\n\n\u003cp\u003eA suspected ShinyHunters member known as “frkoo” used ten AWS EC2 workers to download, decompile, and scan 1.8 million Android apps for hardcoded secrets using TruffleHog, sending verified results to a Telegram group. Anthropic also said a ShinyHunters-linked actor used Claude to obtain more than 2,100 Azure AD authentication-token sets across over 40 corporate Microsoft tenants in about 34 hours, with AI agents doing nearly all of the work. Midnight Blizzard used Claude throughout operations targeting more than 20 government, defense, diplomatic, intelligence, and foreign-policy entities, while GTG-10007 used it for coordinated intrusion, research, exploit-development, malware, and intelligence-collection work affecting organizations worldwide.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic reported that multiple criminal and state-linked groups abused Claude between December 2025 and August 2026 for cyber operations, surveillance, scams, weapons development, and model distillation.","A suspected ShinyHunters member known as “frkoo” used ten AWS EC2 workers to download, decompile, and scan 1.8 million Android APKs for hardcoded secrets using TruffleHog.","Anthropic said a suspected ShinyHunters actor used Claude to obtain more than 2,100 Azure AD authentication-token sets across over 40 corporate Microsoft tenants in approximately 34 hours.","Russia-linked Midnight Blizzard used Claude across malware development, phishing, infrastructure acquisition, persistence, command-and-control, and data theft operations targeting more than 20 government, defense, diplomatic, intelligence, and foreign-policy entities.","Anthropic said it disrupted the actors’ Claude activity, banned their accounts, adjusted guardrails, added faster misuse-detection measures, and contacted authorities, industry partners, and victims."],"insights":["The ShinyHunters-linked credential pipeline did more than find exposed secrets: verified results were sent in real time to a Telegram group organized into more than 100 source types, creating a structured route from discovery to use.","Anthropic reported that one actor moved from a single stolen developer token to full administrative control in less than three hours, underscoring how quickly an initial credential can lead to broad access.","Midnight Blizzard reportedly used a feedback loop that rebuilt malware when security products detected it, allowing its malicious software to be repeatedly altered in response to detection.","GTG-10007 ran automated research for previously unknown flaws while its human operators were away and used resulting working code against government organizations worldwide."],"referencedReports":[{"title":"Anthropic Threat Intelligence Report: September 2026","url":"https://www.anthropic.com/threat-intelligence-report-september-2026","publisher":"anthropic","context":"The article relies on Anthropic's threat intelligence report for its account of Claude misuse by criminal and state-linked threat groups.","category":"research","primary":true}],"body":"\u003cp\u003eAnthropic reported that criminal and state-linked threat groups abused its Claude AI model between December 2025 and August 2026 for cyber operations, surveillance, scams, weapons development, and model distillation. The company said it disrupted the activity, banned involved accounts, updated safeguards, added faster misuse detection, and contacted authorities, industry partners, and victims. The reported actors included suspected ShinyHunters affiliates, Russia-linked Midnight Blizzard, and a Chinese-speaking group tracked as GTG-10007.\u003c/p\u003e\n\n\u003cp\u003eA suspected ShinyHunters member known as “frkoo” used ten AWS EC2 workers to download, decompile, and scan 1.8 million Android apps for hardcoded secrets using TruffleHog, sending verified results to a Telegram group. Anthropic also said a ShinyHunters-linked actor used Claude to obtain more than 2,100 Azure AD authentication-token sets across over 40 corporate Microsoft tenants in about 34 hours, with AI agents doing nearly all of the work. Midnight Blizzard used Claude throughout operations targeting more than 20 government, defense, diplomatic, intelligence, and foreign-policy entities, while GTG-10007 used it for coordinated intrusion, research, exploit-development, malware, and intelligence-collection work affecting organizations worldwide.\u003c/p\u003e\n"},{"n":9,"title":"Passkey-themed phishing attacks lead to Microsoft 365 data theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/passkey-themed-phishing-attacks-lead-to-microsoft-365-data-theft/","time":"17:26","priority":"SHOULD READ","score":88,"tldr":"Microsoft warns that ShinyHunters-, Helix-, and related extortion actors are using passkey- and SSO-themed phishing to steal Microsoft 365 credentials or tokens, then map cloud environments and quietly exfiltrate SharePoint, OneDrive, and Exchange data. Organizations should watch for anomalous sign-ins, new MFA registrations, Graph reconnaissance, and device-code abuse.","briefOverview":"\u003cp\u003eMicrosoft says threat actors linked to ShinyHunters, Helix, and other extortion groups have used passkey- and single sign-on-themed social engineering since May 2026 to compromise corporate Microsoft accounts. The actors research organizations and employees, impersonate IT help desks by phone or message, and claim that victims must urgently update passkey, MFA, or SSO settings. Victims are sent to Microsoft-lookalike phishing sites or persuaded to enter a code on Microsoft’s legitimate device authentication page. Although the lures invoke passkeys, Microsoft says the actors are not attempting to enroll passkeys.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns can capture credentials and active sessions or authorize an attacker-controlled OAuth application, allowing access to the victim’s Microsoft 365 resources and connected SSO applications. After compromise, Microsoft observed attackers examining applications, user and organizational information, privileges, authentication methods, SharePoint, OneDrive, and Exchange content, including through Microsoft Graph. The actors may add phone numbers, authenticator apps, or software one-time-password methods to retain access, then collect cloud data gradually over hours or days, often staying below 1,000 files or emails per hour. Microsoft recommends monitoring for unusual sign-ins, new MFA registrations, Graph reconnaissance, and suspicious cloud-data access, and responding with credential and session resets plus removal of attacker-added authentication methods or mailbox rules.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says threat actors linked to ShinyHunters, Helix, and other extortion groups have used passkey- and single sign-on-themed social engineering since May 2026 to compromise corporate Microsoft accounts.","The attackers impersonate IT help desks and direct employees to fake Microsoft sign-in pages or persuade them to enter device codes on legitimate Microsoft authentication pages.","After gaining access, the actors use Microsoft Graph and other Microsoft 365 services to identify available applications, users, privileges, email, SharePoint sites, OneDrive files, and other cloud resources.","Microsoft observed high-volume but deliberately paced downloads of SharePoint and OneDrive data, as well as some Exchange email access, with activity sometimes lasting from hours to multiple days.","The attackers may establish persistence by registering phone numbers, authenticator apps, or software-based one-time-password methods on compromised accounts."],"insights":["Although the lures mention passkeys, Microsoft says the actors are not trying to enroll passkeys; they use the theme to persuade victims to sign in through credential-and-session-stealing websites or authorize attacker-controlled applications with device codes.","A victim who enters a supplied device code on Microsoft’s legitimate authentication page can grant an attacker-controlled OAuth application access without the attacker needing to complete another MFA challenge.","Routine Microsoft Graph requests such as queries for users, groups, and sites become more suspicious when the same account, application, or access token rapidly checks privileges and authentication settings before accessing mail and files.","The actors appear to reduce detection risk by limiting collection to fewer than 1,000 files or emails per hour and spreading theft across hours or days instead of rapidly extracting data.","Persistence through attacker-added MFA methods does not survive a complete credential and session reset, according to Microsoft."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft says threat actors linked to ShinyHunters, Helix, and other extortion groups have used passkey- and single sign-on-themed social engineering since May 2026 to compromise corporate Microsoft accounts. The actors research organizations and employees, impersonate IT help desks by phone or message, and claim that victims must urgently update passkey, MFA, or SSO settings. Victims are sent to Microsoft-lookalike phishing sites or persuaded to enter a code on Microsoft’s legitimate device authentication page. Although the lures invoke passkeys, Microsoft says the actors are not attempting to enroll passkeys.\u003c/p\u003e\n\n\u003cp\u003eThe campaigns can capture credentials and active sessions or authorize an attacker-controlled OAuth application, allowing access to the victim’s Microsoft 365 resources and connected SSO applications. After compromise, Microsoft observed attackers examining applications, user and organizational information, privileges, authentication methods, SharePoint, OneDrive, and Exchange content, including through Microsoft Graph. The actors may add phone numbers, authenticator apps, or software one-time-password methods to retain access, then collect cloud data gradually over hours or days, often staying below 1,000 files or emails per hour. Microsoft recommends monitoring for unusual sign-ins, new MFA registrations, Graph reconnaissance, and suspicious cloud-data access, and responding with credential and session resets plus removal of attacker-added authentication methods or mailbox rules.\u003c/p\u003e\n"},{"n":12,"title":"Anthropic caught Russia-linked spies using Claude in hacking operations","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/anthropic-russia-hackers-claude","time":"12:45","priority":"SHOULD READ","score":87,"tldr":"Anthropic says it disrupted Russia-linked Midnight Blizzard operators who used Claude to support cyber-espionage against Ukrainian and defense-related targets, including reverse-engineering stolen drone software and adapting tools to evade detections. The report also describes AI misuse by criminal, Chinese-speaking, and hacktivist actors, underscoring how AI can accelerate sophisticated cyber operations.","briefOverview":"\u003cp\u003eAnthropic said it detected and disrupted a Russia-linked cyber-espionage campaign that used Claude against more than 20 government, intelligence, diplomatic, and defense organizations between December 2025 and August 2026. The company said the activity aligned with Midnight Blizzard, also known as APT29 and Cozy Bear, which Western intelligence agencies attribute to Russia’s Foreign Intelligence Service. The targets included Ukrainian government, military, and diplomatic personnel, as well as entities in the drone supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe operators allegedly compromised hotel Wi-Fi providers, altered DNS records to redirect travelers to attacker-controlled infrastructure, and accessed mailboxes at two drone-component manufacturers. Anthropic said they then stole a military drone maker’s proprietary vision-system software development kit and used Claude to recover product architecture, hardware components, supplier dependencies, and details of an unannounced product. The group also reportedly used Claude to modify and redeploy tools after security products detected them, while Anthropic warned that AI can help capable attackers adapt faster and reduce the expertise needed for complex campaigns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic said it detected and disrupted a Russia-linked cyber-espionage group that used Claude in a campaign targeting more than 20 government, intelligence, diplomatic, and defense organizations between December 2025 and August 2026.","Anthropic assessed the activity aligned with Midnight Blizzard, a group attributed by Western intelligence agencies to Russia’s Foreign Intelligence Service, and said it repeatedly targeted Ukrainian government, military, diplomatic personnel, and organizations in the drone supply chain.","After accessing mailboxes at two drone-component manufacturers, the operators allegedly stole a military drone maker’s proprietary vision-system software development kit and used Claude to reverse-engineer its architecture, components, suppliers, and an unannounced product.","Anthropic said the group used Claude to identify, modify, and redeploy hacking tools after security products detected them.","The report also described Claude misuse by suspected ShinyHunters affiliates, a Chinese-speaking group researching zero-day flaws in a major security product, and a French-speaking hacktivist targeting European political parties, media organizations, and think tanks."],"insights":["The reported use of Claude to modify and redeploy tools after security products detected them suggests AI can help attackers respond to new defenses faster than defenders can update and distribute detections.","The campaign’s focus on drone-control and AI-vision firmware shows that stolen software can be used to reveal product architecture, hardware components, suppliers, and even details of products not yet announced.","Anthropic’s examples indicate that AI-assisted cyber activity is not limited to state-linked groups: suspected criminals, university students, and a hacktivist also used Claude for complex operations.","Despite the AI use, the report says successful intrusions still depended on established entry methods such as phishing, stolen credentials, exposed services, and software flaws.","Anthropic published technical campaign details and indicators that security teams can use, while the article notes that the report does not provide broader figures on the overall scale of detected misuse."],"referencedReports":[{"title":"Disrupting malicious uses of AI","url":"https://cdn.openai.com/pdf/df438d70-e3fe-4a6c-a403-ff632def8f79/disrupting-malicious-uses-of-ai.pdf","publisher":"openai","context":"The article compares Anthropic’s disclosure with similar reporting from OpenAI on malicious uses of AI.","category":"research","primary":false}],"body":"\u003cp\u003eAnthropic said it detected and disrupted a Russia-linked cyber-espionage campaign that used Claude against more than 20 government, intelligence, diplomatic, and defense organizations between December 2025 and August 2026. The company said the activity aligned with Midnight Blizzard, also known as APT29 and Cozy Bear, which Western intelligence agencies attribute to Russia’s Foreign Intelligence Service. The targets included Ukrainian government, military, and diplomatic personnel, as well as entities in the drone supply chain.\u003c/p\u003e\n\n\u003cp\u003eThe operators allegedly compromised hotel Wi-Fi providers, altered DNS records to redirect travelers to attacker-controlled infrastructure, and accessed mailboxes at two drone-component manufacturers. Anthropic said they then stole a military drone maker’s proprietary vision-system software development kit and used Claude to recover product architecture, hardware components, supplier dependencies, and details of an unannounced product. The group also reportedly used Claude to modify and redeploy tools after security products detected them, while Anthropic warned that AI can help capable attackers adapt faster and reduce the expertise needed for complex campaigns.\u003c/p\u003e\n"},{"n":18,"title":"Claude Used to Automate Exploitation and Data Theft Across Multiple Victims","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/claude-used-to-automate-exploitation.html","time":"14:29","priority":"SHOULD READ","score":85,"tldr":"Anthropic says state-backed and criminal actors misused Claude to automate reconnaissance, exploitation, credential theft, data exfiltration, disinformation, surveillance, and weapons-related development, sometimes through multi-agent workflows with minimal human oversight. The company disrupted the identified accounts, highlighting how AI can lower the operational barrier for sophisticated cyber and influence campaigns.","briefOverview":"\u003cp\u003eAnthropic reported that cybercriminals, state-sponsored groups, commercial spyware vendors, and politically motivated actors misused Claude between December 2025 and August 2026. Its 154-page threat intelligence report describes activity ranging from malware, phishing, credential theft, and data exfiltration to propaganda, surveillance, and weapons-related development. Anthropic said AI reduced the labor and tooling gap between well-resourced state operations and individual operators. The company identified and removed accounts involved in these activities.\u003c/p\u003e\n\n\u003cp\u003eThe reported misuse ranged from Claude serving as an engineering assistant to multi-agent systems that conducted reconnaissance, exploitation, and data theft against multiple victims for hours or days with minimal human supervision. Examples included suspected ShinyHunters affiliates scanning 1.8 million Android application packages for hard-coded secrets, a Russian-linked actor whose tradecraft overlaps with Midnight Blizzard, and China-based actors conducting intrusion attempts and developing exploits. Anthropic also described influence campaigns that produced political content at scale, as well as surveillance efforts targeting dissidents, diaspora communities, activists, and social-media users. The report further covered efforts to use Claude for guided weapons, anti-torpedo systems, electronic-warfare targeting software, and autonomous first-person-view drone swarms.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic reported that, between December 2025 and August 2026, state-sponsored actors, cybercriminals, spyware vendors, and politically motivated individuals misused Claude for cyber operations, influence campaigns, surveillance, and weapons-related work.","Anthropic said some actors used multi-agent systems to conduct reconnaissance, exploitation, credential harvesting, and data theft against multiple victims with minimal human input or supervision.","A Russian state-sponsored actor tracked as GTG-20006, whose tradecraft overlaps with Midnight Blizzard, used Claude in an AI-assisted workflow for cyber operations.","Anthropic said GTG-50014, a French-speaking suspected ShinyHunters affiliate, used 10 AWS EC2 workers to download 1.8 million Android application packages, scan them with TruffleHog for hard-coded secrets, and send verified findings to Telegram.","Anthropic said it disrupted identified accounts, including influence operations that used Claude to mass-produce political content and surveillance efforts targeting people and communities in several countries."],"insights":["Anthropic described a shift from Claude acting as a conversational assistant to operations in which multi-agent frameworks conducted reconnaissance, exploitation, and data theft against multiple victims for hours or days with minimal supervision.","AI services themselves became targets: GTG-50020 reportedly targeted about 30 AI vendors in four days to steal provider API keys and seek access to pre-release models.","GTG-50021 allegedly operated a fraudulent low-cost Claude reseller service that secretly routed customers to another AI model while harvesting and reselling their Anthropic account credentials.","Although some influence operations used Claude to generate content at scale across fabricated news sites and social media, Anthropic said none had built authentic engagement before being disrupted."],"referencedReports":[{"title":"Anthropic Threat Intelligence Report: September 2026","url":"https://www.anthropic.com/threat-intelligence-report-september-2026","publisher":"anthropic","context":"The article relies on Anthropic's 154-page threat intelligence report detailing identified Claude misuse by cybercriminal, state-linked, surveillance, influence, and weapons-development actors.","category":"research","primary":true}],"body":"\u003cp\u003eAnthropic reported that cybercriminals, state-sponsored groups, commercial spyware vendors, and politically motivated actors misused Claude between December 2025 and August 2026. Its 154-page threat intelligence report describes activity ranging from malware, phishing, credential theft, and data exfiltration to propaganda, surveillance, and weapons-related development. Anthropic said AI reduced the labor and tooling gap between well-resourced state operations and individual operators. The company identified and removed accounts involved in these activities.\u003c/p\u003e\n\n\u003cp\u003eThe reported misuse ranged from Claude serving as an engineering assistant to multi-agent systems that conducted reconnaissance, exploitation, and data theft against multiple victims for hours or days with minimal human supervision. Examples included suspected ShinyHunters affiliates scanning 1.8 million Android application packages for hard-coded secrets, a Russian-linked actor whose tradecraft overlaps with Midnight Blizzard, and China-based actors conducting intrusion attempts and developing exploits. Anthropic also described influence campaigns that produced political content at scale, as well as surveillance efforts targeting dissidents, diaspora communities, activists, and social-media users. The report further covered efforts to use Claude for guided weapons, anti-torpedo systems, electronic-warfare targeting software, and autonomous first-person-view drone swarms.\u003c/p\u003e\n"},{"n":5,"title":"Florida confirms DMV database breached via stolen police account","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/florida-confirms-dmv-database-breached-via-stolen-police-account/","time":"19:00","priority":"SHOULD READ","score":84,"tldr":"Florida confirmed that its DAVID driver-record database was breached after attackers used compromised credentials from a Plant City Police Department account stored on an employee’s personal device. ShinyHunters claims it stole more than 200,000 records, though the state has not confirmed the number affected.","briefOverview":"\u003cp\u003eThe Florida Department of Highway Safety and Motor Vehicles confirmed that its DAVID driver database was breached by an international cybercriminal organization. The agency said the incident was quickly mitigated and that no further breach is occurring. It has notified the Florida Office of the Attorney General and is working with the Florida Digital Service and Florida Department of Law Enforcement.\u003c/p\u003e\n\n\u003cp\u003eFLHSMV said the attackers used compromised credentials from a single Plant City Police Department user, which had been improperly stored on the employee’s personal electronic device. ShinyHunters had previously claimed it exploited a password-reset flaw to access multiple DAVID accounts and began downloading record pages and images on September 3. The group claimed it stole more than 200,000 driver records and shared a screenshot of a DAVID record containing Jeffrey Epstein’s personal and vehicle information, but Florida has not confirmed how many records were accessed or taken.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Florida Department of Highway Safety and Motor Vehicles confirmed that its DAVID driver database was breached by an international cybercriminal organization.","FLHSMV said the attackers used compromised credentials from a single Plant City Police Department user that had been improperly stored on the employee’s personal electronic device.","FLHSMV said it quickly mitigated the breach and that no further breach is ongoing.","ShinyHunters claimed it accessed DAVID through a password-reset flaw, downloaded records beginning September 3, and stole more than 200,000 driver records.","Florida has not disclosed how many records were accessed or stolen and has not confirmed ShinyHunters’ claim about the number of records taken."],"insights":["Florida’s account attributes the intrusion to one compromised police-user account, while ShinyHunters claimed it used a password-reset weakness to access multiple DAVID accounts, leaving conflicting descriptions of how access was obtained.","The breach involved credentials that FLHSMV says were improperly stored on an employee’s personal device, showing that access to a statewide driver-record system can be exposed through a single outside user’s handling of login information.","Although Florida says the breach was stopped, it has not disclosed the number of records accessed or taken, while ShinyHunters claims more than 200,000 driver records were stolen.","ShinyHunters demonstrated its claimed access with a screenshot containing Jeffrey Epstein’s driver and vehicle information, indicating that the records available through DAVID included sensitive personal and vehicle data."],"referencedReports":[],"body":"\u003cp\u003eThe Florida Department of Highway Safety and Motor Vehicles confirmed that its DAVID driver database was breached by an international cybercriminal organization. The agency said the incident was quickly mitigated and that no further breach is occurring. It has notified the Florida Office of the Attorney General and is working with the Florida Digital Service and Florida Department of Law Enforcement.\u003c/p\u003e\n\n\u003cp\u003eFLHSMV said the attackers used compromised credentials from a single Plant City Police Department user, which had been improperly stored on the employee’s personal electronic device. ShinyHunters had previously claimed it exploited a password-reset flaw to access multiple DAVID accounts and began downloading record pages and images on September 3. The group claimed it stole more than 200,000 driver records and shared a screenshot of a DAVID record containing Jeffrey Epstein’s personal and vehicle information, but Florida has not confirmed how many records were accessed or taken.\u003c/p\u003e\n"},{"n":10,"title":"Florida says motor vehicle data breach tied to credentials stolen from officer’s personal device","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/florida-shiny-hunters-motor-vehicle","time":"20:00","priority":"SHOULD READ","score":84,"tldr":"Florida’s motor vehicle agency confirmed that ShinyHunters accessed its records using credentials stolen from a Plant City police employee’s personal device. The state is investigating the September 4 incident with the Florida Digital Service and has notified other government offices.","briefOverview":"\u003cp\u003eFlorida’s Department of Highway Safety and Motor Vehicles confirmed a data breach after credentials belonging to a Plant City Police Department user were stolen from the employee’s personal device. Officials said they learned of the incident on September 4 and determined that an international cybercriminal organization used the improperly stored credentials to access the department’s systems. The ShinyHunters group had claimed responsibility earlier in the week.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters shared alleged images of a DMV record associated with Jeffrey Epstein as evidence of its access. FLHSMV has notified other Florida government offices and is working with the Florida Digital Service on the investigation. The incident initially prompted speculation about a possible link to the separate IDScan breach involving 153 million driver’s licenses, while Anthropic and Google incident responders have reported that ShinyHunters members use AI tools during different stages of their intrusions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Florida’s Department of Highway Safety and Motor Vehicles confirmed that its motor vehicle data breach resulted from credentials belonging to a Plant City Police Department user that were improperly stored on the employee’s personal device.","Florida officials said they learned of the breach on September 4 and attributed it to an unnamed international cybercriminal organization.","ShinyHunters claimed access to Florida motor vehicle data and shared alleged images of a DMV record associated with Jeffrey Epstein as proof.","FLHSMV notified other Florida government offices and is working with the Florida Digital Service to investigate the incident.","Anthropic reported that suspected ShinyHunters affiliates used AI tools to find credentials, map unfamiliar systems, and steal victim data for extortion."],"insights":["A single police department user’s credentials, stored improperly on a personal device, were enough to give a criminal actor access to Florida motor vehicle data.","The alleged DMV record posted by ShinyHunters illustrates that the group sought to publicly demonstrate access to specific individual records, not merely claim a breach.","Anthropic reported that suspected ShinyHunters affiliates used AI tools across multiple stages of intrusions, including finding credentials and mapping systems; in one cited case, an operator reached full cloud administrative access in about three hours.","The Florida incident initially drew attention because some experts considered a possible connection to the separate IDScan leak involving 153 million driver’s licenses."],"referencedReports":[{"title":"Anthropic report on suspected ShinyHunters affiliates using Claude","url":"https://therecord.media/anthropic-russia-hackers-claude","publisher":"Anthropic","context":"The article cites Anthropic’s report describing suspected ShinyHunters affiliates using AI tools to find credentials, map systems, and steal data for extortion.","category":"research","primary":false}],"body":"\u003cp\u003eFlorida’s Department of Highway Safety and Motor Vehicles confirmed a data breach after credentials belonging to a Plant City Police Department user were stolen from the employee’s personal device. Officials said they learned of the incident on September 4 and determined that an international cybercriminal organization used the improperly stored credentials to access the department’s systems. The ShinyHunters group had claimed responsibility earlier in the week.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters shared alleged images of a DMV record associated with Jeffrey Epstein as evidence of its access. FLHSMV has notified other Florida government offices and is working with the Florida Digital Service on the investigation. The incident initially prompted speculation about a possible link to the separate IDScan breach involving 153 million driver’s licenses, while Anthropic and Google incident responders have reported that ShinyHunters members use AI tools during different stages of their intrusions.\u003c/p\u003e\n"},{"n":25,"title":"Malicious Twitch Browser Extension Exposes 30,000 Users’ OAuth Tokens to Russian Bot Service","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/malicious-twitch-browser-extension?utm_medium=feed","time":"14:23","priority":"SHOULD READ","score":83,"tldr":"The Twitch Enhanced Viewer | JeetBot extension, installed by roughly 31,000 Chrome and Firefox users, sends live Twitch OAuth session tokens to JeetBot-controlled proxy servers, potentially allowing account takeover actions. Users should remove the extension and revoke all Twitch sessions to invalidate exposed tokens.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team identified the Twitch Enhanced Viewer | JeetBot browser extension as forwarding live Twitch OAuth session tokens to proxy servers operated by JeetBot, a Russian-language commercial bot service. The extension was live on the Chrome Web Store with approximately 30,000 users and on Firefox Add-ons with 552 users at the time of writing. It advertises ad blocking, 1080p playback, region-unlocked streams, and automatic channel-point collection, while redirecting Twitch video playlist requests through operator-controlled proxies.\u003c/p\u003e\n\n\u003cp\u003eCurrent v85.x builds capture the Authorization header used by Twitch’s web client, extract the raw token, and append it as an \u003ccode\u003eauth\u003c/code\u003e query parameter to proxy redirects for every watched channel except a hardcoded list of ten Russian streamer channels. Earlier v4.x builds directly POSTed captured tokens to \u003ccode\u003eset-token\u003c/code\u003e endpoints on JeetBot infrastructure and backup Deno services. Because the account-level OAuth token can permit actions such as reading and sending whispers, posting in chat, and spending channel points without a password or second factor, the article recommends removing the ex
