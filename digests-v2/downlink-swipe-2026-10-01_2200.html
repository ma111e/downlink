<script type="application/json" id="dl-articles">[{"n":1,"title":"Fortinet warns of critical FortiMail flaw exploited in zero-day attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/","time":"22:42","priority":"MUST READ","score":98,"tldr":"Fortinet says attackers are actively exploiting the critical FortiMail path traversal and null-byte flaw CVE-2026-104286 to write arbitrary files and execute unauthorized code on exposed management interfaces. Administrators should immediately disable IBE or restrict management access and conduct forensic triage until fixed releases are available.","briefOverview":"\u003cp\u003eFortinet warned that CVE-2026-104286, a critical FortiMail vulnerability with a CVSS score of 9.8, is being actively exploited in zero-day attacks. The flaw affects the FortiMail management interface and can allow an unauthenticated attacker to write arbitrary files to the underlying system using crafted HTTP or HTTPS requests. Fortinet said the issue involves path traversal and improper handling of NULL characters, which could enable unauthorized code or command execution.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include FortiMail 8.0.0 through 8.0.1, 7.6.0 through 7.6.6, 7.4.0 through 7.4.8, and 7.2.0 through 7.2.9. Fortinet advised customers to disable IBE support or restrict management-interface access to trusted private networks until fixes are available; fixed versions for the 7.4, 7.6, and 8.0 branches were listed as upcoming. The company also published file, IP address, and log indicators for forensic checks, while CISA added the flaw to its Known Exploited Vulnerabilities catalog and required U.S. federal agencies to perform forensic triage and mitigate it by October 4.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fortinet warned that CVE-2026-104286, a critical FortiMail flaw with a CVSS score of 9.8, is being actively exploited in zero-day attacks.","The flaw affects the FortiMail management interface and can allow an unauthenticated attacker to write arbitrary files through crafted HTTP or HTTPS requests.","Affected versions include FortiMail 8.0.0–8.0.1, 7.6.0–7.6.6, 7.4.0–7.4.8, and 7.2.0–7.2.9.","Fortinet recommends disabling IBE support or restricting Internet access to the FortiMail management interface until fixed versions are available.","CISA added CVE-2026-104286 to its Known Exploited Vulnerabilities catalog and required U.S. federal agencies to perform forensic triage and mitigate it by October 4."],"insights":["Security updates were not yet available for affected FortiMail 7.4, 7.6, and 8.0 installations at the time of the advisory, so Fortinet directed customers to use temporary mitigations instead.","Fortinet’s indicators include an archive account configured to send data to remote IP address 79.141.169.187 in an /uploads directory, which the article says could indicate that archived data was being transferred from a compromised appliance.","The published compromise indicators include added or modified system files, including /data/etc/ld.so.preload and /data/lib/liblog.so, giving administrators concrete artifacts to check during forensic triage.","Fortinet provided log examples involving an IBE decoding error, a cron job related to /migadmin, and failed login attempts that administrators can use to identify potentially affected appliances."],"referencedReports":[{"title":"FG-IR-26-175: FortiMail Improper Limitation of a Pathname to a Restricted Directory and Improper Neutralization of NULL Byte Vulnerability","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-175","publisher":"fortinet","context":"The article cites Fortinet's advisory for technical details, affected versions, mitigations, indicators of compromise, and relevant log entries for CVE-2026-104286.","category":"advisory","primary":true}],"body":"\u003cp\u003eFortinet warned that CVE-2026-104286, a critical FortiMail vulnerability with a CVSS score of 9.8, is being actively exploited in zero-day attacks. The flaw affects the FortiMail management interface and can allow an unauthenticated attacker to write arbitrary files to the underlying system using crafted HTTP or HTTPS requests. Fortinet said the issue involves path traversal and improper handling of NULL characters, which could enable unauthorized code or command execution.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include FortiMail 8.0.0 through 8.0.1, 7.6.0 through 7.6.6, 7.4.0 through 7.4.8, and 7.2.0 through 7.2.9. Fortinet advised customers to disable IBE support or restrict management-interface access to trusted private networks until fixes are available; fixed versions for the 7.4, 7.6, and 8.0 branches were listed as upcoming. The company also published file, IP address, and log indicators for forensic checks, while CISA added the flaw to its Known Exploited Vulnerabilities catalog and required U.S. federal agencies to perform forensic triage and mitigate it by October 4.\u003c/p\u003e\n"}]</script>
