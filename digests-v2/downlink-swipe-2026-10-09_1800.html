<script type="application/json" id="dl-articles">[{"n":3,"title":"Credential-Stealing GitHub Actions Workflows Planted in Tens of Thousands of Repositories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/credential-stealing-github-actions.html","time":"19:14","priority":"MUST READ","score":94,"tldr":"The GhostAction campaign compromised hundreds of GitHub accounts and planted credential-stealing GitHub Actions workflows across tens of thousands of repositories, harvesting CI/CD secrets and credentials from source code and git history. Maintainers should immediately audit for the malicious Security Audit or GitHub Actions Security workflows, revoke compromised GitHub tokens, rotate exposed secrets, and inspect forks.","briefOverview":"\u003cp\u003eThe GhostAction campaign compromised high-profile GitHub maintainer accounts and used them to add credential-stealing GitHub Actions workflows to repositories. StepSecurity said the account of Pyxel author Takashi Kitao was used against 27 repositories, while Henry Wu’s account was used to push the same workflow to 318 repositories in 16 minutes. Socket reported that, since October 7, 2026, more than 500 GitHub accounts had committed the malicious workflow to tens of thousands of repositories. The campaign previously affected 817 repositories across 327 GitHub users and resulted in the theft of 3,325 secrets.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files are named \u003ccode\u003esecurity-audit.yml\u003c/code\u003e or \u003ccode\u003egithub_actions_security.yml\u003c/code\u003e and pose as security audits while sending collected data to the hard-coded IP address \u003ccode\u003e193.32.204.199\u003c/code\u003e over plain HTTP. They run on manual activation and on any push, check out the full repository history, collect named GitHub Actions secrets, and search current files and past commits for 13 types of credentials, including AWS, GitHub, GitLab, AI-service, cloud, and SaaS keys. The workflows can also pair AWS access key IDs with matching secret access keys, and each run sends a repository identifier even if it finds no credentials. Developers are advised to remove the workflows from every branch, revoke compromised GitHub credentials, rotate exposed secrets, and check forks, which may retain or inherit the malicious files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The GhostAction campaign used compromised GitHub maintainer accounts to add malicious credential-stealing workflows to hundreds of repositories, with more than 500 accounts linked to tens of thousands of affected repositories since October 7, 2026.","The malicious workflows, named Security Audit or GitHub Actions Security, send collected data to the hard-coded IP address 193.32.204.199 over unencrypted HTTP.","The workflows can collect named GitHub Actions secrets and scan both project files and the full git history for AWS, AI-service, source-control, SaaS, and cloud credentials.","StepSecurity reported that the attacker used Takashi Kitao’s account to modify 27 repositories and Henry Wu’s account to modify 318 repositories.","Developers are advised to remove the malicious workflows from every branch, revoke compromised GitHub credentials, rotate exposed credentials, and inspect forks of infected repositories."],"insights":["The workflows use a full repository checkout, allowing them to search old commit history for credentials that may have been deleted from current project files.","Because the workflows run on any push, including pushes to any branch or tag, a single later change can trigger credential collection.","Forks can retain or inherit the malicious workflow, meaning removing it only from the original repository may not eliminate the risk.","Even when no credentials are found, each workflow run sends the attacker a repository identifier, giving the operator visibility into reachable code-project environments."],"referencedReports":[{"title":"GhostAction Returns","url":"https://www.stepsecurity.io/blog/ghostaction-returns","publisher":"stepsecurity","context":"StepSecurity reported that compromised maintainer accounts were used to push the malicious workflow into hundreds of repositories and described its behavior.","category":"research","primary":true},{"title":"GhostAction Cloud Credentials","url":"https://socket.dev/blog/ghostaction-cloud-credentials","publisher":"socket","context":"Socket reported identifying more than 500 GitHub accounts that committed the malicious workflow to tens of thousands of repositories.","category":"research","primary":false},{"title":"GhostAction Campaign: Over 3,000 Secrets Stolen Through Malicious GitHub Workflows","url":"https://www.stepsecurity.io/blog/ghostaction-campaign-over-3-000-secrets-stolen-through-malicious-github-workflows","publisher":"stepsecurity","context":"The article cites this StepSecurity analysis as the report that first brought the GhostAction supply-chain campaign to light in September 2025.","category":"research","primary":false},{"title":"GhostAction GitHub Actions Supply Chain Attack Returns","url":"https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/","publisher":"gitguardian","context":"GitGuardian reported malicious workflow injections into 772 public repositories belonging to 373 GitHub users and organizations between August 31 and September 30, 2026.","category":"research","primary":false}],"body":"\u003cp\u003eThe GhostAction campaign compromised high-profile GitHub maintainer accounts and used them to add credential-stealing GitHub Actions workflows to repositories. StepSecurity said the account of Pyxel author Takashi Kitao was used against 27 repositories, while Henry Wu’s account was used to push the same workflow to 318 repositories in 16 minutes. Socket reported that, since October 7, 2026, more than 500 GitHub accounts had committed the malicious workflow to tens of thousands of repositories. The campaign previously affected 817 repositories across 327 GitHub users and resulted in the theft of 3,325 secrets.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files are named \u003ccode\u003esecurity-audit.yml\u003c/code\u003e or \u003ccode\u003egithub_actions_security.yml\u003c/code\u003e and pose as security audits while sending collected data to the hard-coded IP address \u003ccode\u003e193.32.204.199\u003c/code\u003e over plain HTTP. They run on manual activation and on any push, check out the full repository history, collect named GitHub Actions secrets, and search current files and past commits for 13 types of credentials, including AWS, GitHub, GitLab, AI-service, cloud, and SaaS keys. The workflows can also pair AWS access key IDs with matching secret access keys, and each run sends a repository identifier even if it finds no credentials. Developers are advised to remove the workflows from every branch, revoke compromised GitHub credentials, rotate exposed secrets, and check forks, which may retain or inherit the malicious files.\u003c/p\u003e\n"},{"n":1,"title":"Hackers abuse Google Ads, Bing redirects to push Claude ClickFix attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-abuse-google-ads-bing-redirects-to-push-claude-clickfix-attacks/","time":"20:31","priority":"SHOULD READ","score":82,"tldr":"Attackers are using Google Ads that appear to lead to Bing, then chaining Bing click-tracking redirects and compromised WordPress sites to deliver fake Claude for macOS pages. The pages use a ClickFix-style clipboard swap to replace Anthropic’s legitimate install command with a hidden script that downloads and executes attacker-controlled code.","briefOverview":"\u003cp\u003eHackers are abusing Google Ads and Bing search-result redirects to send users searching for “claude mac” to a fake Claude download page. The ad displays the legitimate bing.com domain, then passes through Google’s advertising redirect, Bing’s click-tracking endpoint, and a compromised WordPress site belonging to a South American retailer. Push Security calls the technique “Adception” and says it is designed to evade ad security checks by using Bing’s trusted domain as the destination.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses checks for Bing or Google referrers and specific browser headers, while direct visits to the malicious site are sent to a 404 page. The fake macOS installer page displays Anthropic’s legitimate Claude installation command, but its copy button secretly puts a different command in the clipboard. That command downloads a file from an attacker-controlled server and sends it directly to the macOS Z shell for execution; the final payload is unknown.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Push Security identified a malicious Google ad targeting searches for “claude mac” that displayed the legitimate bing.com domain before leading to a fake Claude download page.","The ad route passed through Google’s advertising redirect, Bing’s click-tracking endpoint, and a compromised South American retailer’s WordPress site before reaching the malicious site.","The compromised website and fake Claude page used referrer and browser checks to prevent direct visitors and automated scanners from seeing the malicious content.","The fake macOS installer page displayed Anthropic’s legitimate Claude installation command, but its copy button placed a different command in the clipboard that downloaded and executed content from an attacker-controlled server.","The final payload delivered by the campaign is unknown, and Push Security linked several domains using the same ClickFix toolkit, which it tracks as AcSig."],"insights":["Using Bing’s legitimate click-tracking address as the visible Google Ads destination makes the advertisement appear less suspicious while still enabling a redirect to attacker-controlled content.","The fake installer presents Anthropic’s real installation command on the page and in the Terminal message, while silently placing a different command in the clipboard, so users may execute code they never visibly reviewed.","The campaign’s layered checks for Bing, Google, browser headers, and direct access mean that simply opening the malicious URL may show only a 404 page rather than the harmful content.","Push Security found multiple domains with the same installer interface, command structure, and payload URL pattern, indicating that the AcSig-tracked toolkit is reused across related sites."],"referencedReports":[{"title":"Adception: Malvertising via another search engine's search results","url":"http://pushsecurity.com/blog/adception-malvertising-another-search-engines-search-results","publisher":"push-security","context":"The article relies on Push Security's report for its analysis of the Google Ads, Bing redirect, and fake Claude ClickFix campaign.","category":"research","primary":true}],"body":"\u003cp\u003eHackers are abusing Google Ads and Bing search-result redirects to send users searching for “claude mac” to a fake Claude download page. The ad displays the legitimate bing.com domain, then passes through Google’s advertising redirect, Bing’s click-tracking endpoint, and a compromised WordPress site belonging to a South American retailer. Push Security calls the technique “Adception” and says it is designed to evade ad security checks by using Bing’s trusted domain as the destination.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses checks for Bing or Google referrers and specific browser headers, while direct visits to the malicious site are sent to a 404 page. The fake macOS installer page displays Anthropic’s legitimate Claude installation command, but its copy button secretly puts a different command in the clipboard. That command downloads a file from an attacker-controlled server and sends it directly to the macOS Z shell for execution; the final payload is unknown.\u003c/p\u003e\n"},{"n":2,"title":"Japan confirms arrest of Russian Qilin operative, extradition to Germany","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/japan-germany-ransomware-arrest","time":"18:45","priority":"SHOULD READ","score":82,"tldr":"Japan arrested a 28-year-old Russian national allegedly linked to the Qilin ransomware gang while he was visiting Osaka and extradited him to Germany over a ransomware attack on a German company. The case marks heightened international law-enforcement action against Qilin, one of the most active ransomware groups.","briefOverview":"\u003cp\u003eJapan’s National Police Agency confirmed the arrest and extradition to Germany of a 28-year-old Russian national accused of involvement with the Qilin ransomware group. Japanese authorities acted on a German arrest warrant tied to an alleged ransomware attack on a German company, and the Ministry of Justice assisted with the detention and extradition. Nippon reported that officials learned in May the suspect planned to vacation in Japan, arrested him at a hotel in Osaka, and sent him to Germany in June.\u003c/p\u003e\n\n\u003cp\u003eQilin has been linked to numerous high-profile incidents in Germany, Japan, and elsewhere. Its alleged attack on Japanese beverage company Asahi disrupted order processing, shipping, and customer services for weeks, and attackers leaked financial records, employee data, contracts, and development forecasts. The group was described as the second most active ransomware gang in July 2026, with 127 reported attacks, and it has also claimed attacks involving Die Linke, Kuala Lumpur International Airport, Stade Français Paris, and the U.S. Bureau of Alcohol, Tobacco, Firearms and Explosives.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Japan’s National Police Agency confirmed the arrest and extradition to Germany of a 28-year-old Russian national accused of involvement in the Qilin ransomware group.","Japanese authorities acted on a German arrest warrant related to an alleged ransomware attack against a German company.","According to Nippon, the suspect was arrested at a hotel in Osaka in May after authorities learned he planned to vacation in Japan, and he was extradited to Germany in June.","Qilin has claimed responsibility for attacks including one against German political party Die Linke and an incident that disrupted operations at Japanese beverage company Asahi.","Researchers said Qilin was the second most active ransomware group in July 2026, with 127 reported attacks."],"insights":["The suspect’s planned vacation in Japan created an opportunity for authorities to act on Germany’s arrest warrant, leading to his arrest in Osaka and later extradition.","Qilin continued carrying out high-profile incidents after increased law-enforcement scrutiny following its attack on a British healthcare company in 2024.","The group’s reported victims span private companies, healthcare-related services, political organizations, airports, municipal government, sports organizations, and a U.S. federal agency, illustrating its broad targeting range.","The Asahi incident shows that the group’s activity can disrupt everyday business operations for weeks, including order processing, shipping, and customer services, while also exposing sensitive company information."],"referencedReports":[],"body":"\u003cp\u003eJapan’s National Police Agency confirmed the arrest and extradition to Germany of a 28-year-old Russian national accused of involvement with the Qilin ransomware group. Japanese authorities acted on a German arrest warrant tied to an alleged ransomware attack on a German company, and the Ministry of Justice assisted with the detention and extradition. Nippon reported that officials learned in May the suspect planned to vacation in Japan, arrested him at a hotel in Osaka, and sent him to Germany in June.\u003c/p\u003e\n\n\u003cp\u003eQilin has been linked to numerous high-profile incidents in Germany, Japan, and elsewhere. Its alleged attack on Japanese beverage company Asahi disrupted order processing, shipping, and customer services for weeks, and attackers leaked financial records, employee data, contracts, and development forecasts. The group was described as the second most active ransomware gang in July 2026, with 127 reported attacks, and it has also claimed attacks involving Die Linke, Kuala Lumpur International Airport, Stade Français Paris, and the U.S. Bureau of Alcohol, Tobacco, Firearms and Explosives.\u003c/p\u003e\n"},{"n":4,"title":"The Ultimate Guide to Brand Protection with Censys","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/the-ultimate-guide-to-brand-protection-with-censys/","time":"19:21","priority":"MAY READ","score":55,"tldr":"Brand protection is an infrastructure-monitoring problem: defenders can use Censys to detect lookalike domains, certificates, cloned web assets, and related phishing infrastructure before and after campaigns go live. Combining continuous monitoring, historical pivots, and evidence-rich takedown requests helps identify entire impersonation operations rather than removing only one malicious domain.","briefOverview":"\u003cp\u003eThe article presents a Censys-based guide to protecting brands from impersonation infrastructure, including lookalike domains, fake login pages, copied assets, and phishing operations. It opens with an August 2026 campaign in which a PowerShell dropper fetched an encrypted 16.8 MB script disguised as an MP4 file from \u003ccode\u003ebinance-idexchange[.]com\u003c/code\u003e, despite Binance having no connection to it. The example illustrates that attackers may use brand names not only for fake websites but also to disguise malicious network traffic.\u003c/p\u003e\n\n\u003cp\u003eThe guide explains how public certificate records, domain-name patterns, page titles, copied web assets, analytics IDs, and favicon hashes can reveal impersonation sites. It also describes using host reputation, historical DNS and certificate records, and shared infrastructure attributes to expand a single finding into a larger cluster of related domains and servers. For takedowns, it advises identifying whether an IP address is the true hosting server, a content-delivery edge, or a relay, then submitting evidence such as the URL, first-seen time, screenshot, certificate fingerprint, and copied brand artifact to the appropriate provider.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Brand impersonation relies on internet infrastructure such as domains, certificates, servers, and web pages, which Censys indexes and retains in historical records.","Certificate Transparency records can expose newly issued public certificates for lookalike domains before a phishing page is fully deployed, but they do not cover plain-HTTP infrastructure or self-signed certificates.","Attackers may use typosquatted domains, brand-prefixed hostnames on attacker-controlled domains, flattened versions of legitimate domain names, or product names to impersonate organizations.","Copied page titles, hotlinked or locally copied assets, analytics identifiers, and favicon hashes can help identify phishing sites even when their hostnames do not contain the targeted brand.","Historical DNS, host, and certificate data can help investigators pivot from one phishing link to related infrastructure and provide evidence for targeted takedown requests."],"insights":["A phishing kit that reuses a company’s real analytics tag can send victim visits into the legitimate company’s marketing data, making unexpected referrer hostnames a potential real-time signal of cloned sites.","A certificate found only on an origin server behind Cloudflare can reveal a phishing hostname that is not visible through ordinary scans of the CDN-facing site.","A favicon hash can identify copied sites even when attackers host the icon locally, omit a visible page body, or use a bare IP address instead of a recognizable domain.","The USPS investigation expanded from one SMS lure to 682 unique lookalike hostnames through historical DNS data, showing that inactive domains can still expose a campaign’s prior infrastructure.","For takedowns, the IP address behind a malicious hostname may belong to a CDN edge or relay rather than the actual hosting server, so complaints must be directed differently depending on the infrastructure role."],"referencedReports":[],"body":"\u003cp\u003eThe article presents a Censys-based guide to protecting brands from impersonation infrastructure, including lookalike domains, fake login pages, copied assets, and phishing operations. It opens with an August 2026 campaign in which a PowerShell dropper fetched an encrypted 16.8 MB script disguised as an MP4 file from \u003ccode\u003ebinance-idexchange[.]com\u003c/code\u003e, despite Binance having no connection to it. The example illustrates that attackers may use brand names not only for fake websites but also to disguise malicious network traffic.\u003c/p\u003e\n\n\u003cp\u003eThe guide explains how public certificate records, domain-name patterns, page titles, copied web assets, analytics IDs, and favicon hashes can reveal impersonation sites. It also describes using host reputation, historical DNS and certificate records, and shared infrastructure attributes to expand a single finding into a larger cluster of related domains and servers. For takedowns, it advises identifying whether an IP address is the true hosting server, a content-delivery edge, or a relay, then submitting evidence such as the URL, first-seen time, screenshot, certificate fingerprint, and copied brand artifact to the appropriate provider.\u003c/p\u003e\n"},{"n":5,"title":"Black Hat USA 2026 NOC: Cleartext, Leaky Apps, AI Mistakes | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/black-hat-usa-2026-noc-cleartext-apps-ai-mistakes","time":"18:30","priority":"MAY READ","score":35,"tldr":"Corelight’s Black Hat USA 2026 network operations coverage highlights security risks from cleartext traffic, data-leaking applications, and mistakes introduced by AI-enabled systems.","briefOverview":"\u003cp\u003eThe article is titled “Black Hat USA 2026 NOC: Cleartext, Leaky Apps, AI Mistakes.” It is associated with Corelight and Black Hat USA 2026. The title identifies cleartext, leaky applications, and AI mistakes as its central subjects.\u003c/p\u003e\n\n\u003cp\u003eThe available article content does not provide readable details about a specific incident, affected organizations, or technical findings. It also does not describe the impact, causes, or remediation for the issues named in the title. As a result, the article can only be summarized as covering those topics in the context of the Black Hat USA 2026 NOC.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"Black Hat USA 2026 NOC: Cleartext, Leaky Apps, AI Mistakes.\"","The article is associated with Corelight.","The title identifies cleartext, leaky applications, and AI mistakes as topics covered in relation to Black Hat USA 2026 NOC."],"insights":["The article’s title groups cleartext traffic, data-leaking applications, and AI-related mistakes together, indicating that the Black Hat USA 2026 NOC observed concerns across several different sources of exposure.","The title specifically calls out cleartext, which means some information was visible without encryption rather than being protected in transit."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Black Hat USA 2026 NOC: Cleartext, Leaky Apps, AI Mistakes.” It is associated with Corelight and Black Hat USA 2026. The title identifies cleartext, leaky applications, and AI mistakes as its central subjects.\u003c/p\u003e\n\n\u003cp\u003eThe available article content does not provide readable details about a specif
