<script type="application/json" id="dl-articles">[{"n":2,"title":"New Inception extortion gang launches large-scale vishing campaign","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-inception-extortion-gang-launches-large-scale-vishing-campaign/","time":"20:21","priority":"SHOULD READ","score":85,"tldr":"The new Inception extortion group is running a large-scale phone-based phishing campaign using fake Okta and OpenText authentication sites to steal corporate SSO credentials. Researchers and Okta assess it is likely a rebrand of a ShinyHunters-linked cluster, though Inception denies the connection.","briefOverview":"\u003cp\u003eA newly formed data-extortion group called Inception has been linked to a large campaign aimed at stealing single sign-on credentials from global companies. The group appeared publicly on November 17, claiming seven victims including AMD, PepsiCo, Cigna Healthcare, AutoZone, and Lucid Motors, although none has confirmed a breach. ReversingLabs says it has tracked the group since late October.\u003c/p\u003e\n\n\u003cp\u003eResearchers found 21 domains used for single sign-on phishing, 41 believed to support the campaign, and four additional suspicious domains. The infrastructure impersonates many organizations and uses legal-themed websites that imitate Okta and OpenText Access Manager sign-in services. The operation reportedly relies on phone-based social engineering rather than email phishing.\u003c/p\u003e\n\n\u003cp\u003eOkta linked Inception to O-UNC-053, a cluster previously associated with ShinyHunters, citing continuing domain registrations, consistent infrastructure, and similar tactics before and after Inception\u0026rsquo;s leak site launched. Inception denied any affiliation with prior groups. ReversingLabs recommends phishing-resistant sign-in methods, stronger help desk identity checks, and review of DNS, proxy, and identity-provider logs dating back to October 21, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The newly formed Inception extortion group has been linked to a large-scale campaign targeting single sign-on credentials through phone-based social engineering and fake authentication websites.","Inception appeared publicly on November 17 and claimed seven victims, including AMD, PepsiCo, Cigna Healthcare, AutoZone, and Lucid Motors, although none has publicly confirmed a data breach.","ReversingLabs identified 21 domains used for single sign-on phishing, 41 domains believed to support the campaign infrastructure, and four additional suspicious domains.","Okta assessed that Inception is very likely a rebranding of O-UNC-053, a threat cluster previously associated with ShinyHunters, based on consistent infrastructure and tactics.","ReversingLabs recommends phishing-resistant sign-in methods such as FIDO2 security keys and passkeys, stronger help desk identity checks, and review of relevant logs dating to October 21, 2026."],"insights":["The presence of phishing domains impersonating dozens of companies does not establish that those companies were breached or had necessarily even been targeted.","Okta reported that the suspected ShinyHunters-linked cluster continued registering phishing domains after law-enforcement disruption and before the Inception leak site appeared, indicating continuity despite the public brand change.","The campaign relies on phone-based deception rather than email, making help desk identity-verification procedures a specific defensive focus.","ReversingLabs identified activity dating back to October 21, 2026, giving organizations a defined starting point for reviewing DNS, proxy, and identity-provider logs."],"referencedReports":[{"title":"Threat Researchers Notebook: SSO Vishing Campaign Associated With Emerging Inception Extortion Group","url":"http://www.reversinglabs.com/blog/threat-researchers-notebook-sso-vishing-campaign-associated-with-emerging-inception-extortion-group","publisher":"reversinglabs","context":"The article cites ReversingLabs' technical analysis of the Inception campaign's phishing infrastructure and phone-based credential theft tactics.","category":"research","primary":true},{"title":"Former ShinyHunters Cluster Moves to New Inception Site","url":"https://www.okta.com/en-se/blog/threat-intelligence/former_shinyhunters_cluster_moves_to_new_inception_site/","publisher":"okta","context":"The article cites Okta's report assessing that the O-UNC-053 cluster previously associated with ShinyHunters likely adopted the Inception brand.","category":"research","primary":true}],"body":"\u003cp\u003eA newly formed data-extortion group called Inception has been linked to a large campaign aimed at stealing single sign-on credentials from global companies. The group appeared publicly on November 17, claiming seven victims including AMD, PepsiCo, Cigna Healthcare, AutoZone, and Lucid Motors, although none has confirmed a breach. ReversingLabs says it has tracked the group since late October.\u003c/p\u003e\n\n\u003cp\u003eResearchers found 21 domains used for single sign-on phishing, 41 believed to support the campaign, and four additional suspicious domains. The infrastructure impersonates many organizations and uses legal-themed websites that imitate Okta and OpenText Access Manager sign-in services. The operation reportedly relies on phone-based social engineering rather than email phishing.\u003c/p\u003e\n\n\u003cp\u003eOkta linked Inception to O-UNC-053, a cluster previously associated with ShinyHunters, citing continuing domain registrations, consistent infrastructure, and similar tactics before and after Inception\u0026rsquo;s leak site launched. Inception denied any affiliation with prior groups. ReversingLabs recommends phishing-resistant sign-in methods, stronger help desk identity checks, and review of DNS, proxy, and identity-provider logs dating back to October 21, 2026.\u003c/p\u003e\n"},{"n":1,"title":"Rackspace shuts down Spot cloud platform after security breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/rackspace-shuts-down-spot-cloud-platform-after-security-breach/","time":"21:37","priority":"SHOULD READ","score":82,"tldr":"Rackspace will permanently shut down its Rackspace Spot cloud platform on December 8, 2026, after compromised credentials let attackers access customer Kubernetes clusters, secrets, and storage files. Customers must migrate workloads and rotate potentially exposed tokens, kubeconfigs, and Kubernetes Secrets.","briefOverview":"\u003cp\u003eRackspace will permanently discontinue its Rackspace Spot cloud platform on December 8, 2026, at 5 PM Central Time. All remaining workloads will be terminated at that time, and customer data will no longer be accessible. The company told customers to retrieve data and move their workloads to other platforms before the deadline.\u003c/p\u003e\n\n\u003cp\u003eThe decision followed a November 17 intrusion in which attackers used compromised credentials to access the Spot platform. They were able to create unauthorized pods in customer Kubernetes clusters, read Kubernetes Secrets, and list nodes and volumes; Rackspace said they may also have read files on storage volumes. Rackspace discovered the incident after a customer report on November 18, disabled the administration console, and restored service on November 21.\u003c/p\u003e\n\n\u003cp\u003eRackspace advises all Spot customers to treat API tokens, refresh tokens, kubeconfigs, and Kubernetes Secrets as potentially compromised, even if they did not receive an earlier breach notice. Customers are also advised to review access logs from November 16 onward and search for activity associated with IP address 23.224.79.106, the 23.224.0.0/15 range, and object prefixes including i1, glm-, and probe. Rackspace says the Spot environment is segmented from its core infrastructure and that it found no evidence of access to core systems or other Rackspace customer environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rackspace will permanently discontinue its Rackspace Spot cloud platform on December 8, 2026, at 5 PM Central Time, after which remaining workloads will be terminated and customer data will no longer be accessible.","The company decided to wind down Rackspace Spot after attackers used compromised credentials on November 17 to access customer Kubernetes clusters and potentially read secrets and files on storage volumes.","Rackspace discovered the intrusion on November 18 after a customer report, disabled the platform administration console, and restored service on November 21.","Rackspace advises all Spot customers to treat API tokens, refresh tokens, kubeconfigs, and Kubernetes Secrets as potentially compromised and to review access logs beginning November 16.","Rackspace says the affected Spot environment is segmented from its core infrastructure and that it found no evidence of unauthorized access to its core systems or other Rackspace customer environments."],"insights":["Rackspace is telling every Spot customer to treat credentials as potentially exposed, including customers who did not previously receive an individual breach notification.","Customers can use the listed IP address, IP range, and Kubernetes object prefixes—23.224.79.106, 23.224.0.0/15, i1, glm-, and probe—to review activity dating back to November 16.","Although Rackspace restored Spot service on November 21, it later chose to retire the platform entirely rather than continue operating it.","Some customers said Spot’s affordability was a major reason they used it and expressed concern that alternatives would cost more."],"referencedReports":[],"body":"\u003cp\u003eRackspace will permanently discontinue its Rackspace Spot cloud platform on December 8, 2026, at 5 PM Central Time. All remaining workloads will be terminated at that time, and customer data will no longer be accessible. The company told customers to retrieve data and move their workloads to other platforms before the deadline.\u003c/p\u003e\n\n\u003cp\u003eThe decision followed a November 17 intrusion in which attackers used compromised credentials to access the Spot platform. They were able to create unauthorized pods in customer Kubernetes clusters, read Kubernetes Secrets, and list nodes and volumes; Rackspace said they may also have read files on storage volumes. Rackspace discovered the incident after a customer report on November 18, disabled the administration console, and restored service on November 21.\u003c/p\u003e\n\n\u003cp\u003eRackspace advises all Spot customers to treat API tokens, refresh tokens, kubeconfigs, and Kubernetes Secrets as potentially compromised, even if they did not receive an earlier breach notice. Customers are also advised to review access logs from November 16 onward and search for activity associated with IP address 23.224.79.106, the 23.224.0.0/15 range, and object prefixes including i1, glm-, and probe. Rackspace says the Spot environment is segmented from its core infrastructure and that it found no evidence of access to core systems or other Rackspace customer environments.\u003c/p\u003e\n"},{"n":3,"title":"Colorado says cyberattack took down myColorado app, warns 150,000 had data stolen","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/mycolorado-app-down-data-breach","time":"20:52","priority":"SHOULD READ","score":78,"tldr":"Colorado’s myColorado app was taken offline after a cyberattack discovered November 18, with state officials warning that data linked to nearly 150,000 of its 2.1 million users may have been stolen. Residents must use physical IDs and agency websites while the state investigates and restores the service.","briefOverview":"\u003cp\u003eColorado’s Governor’s Office of Information Technology said it discovered a cyberattack involving the myColorado app on the evening of November 18. The state shut down the app, which remained unavailable as of Tuesday afternoon, and began an investigation. myColorado is used by Colorado residents for digital identification, document storage, and access to state government services. The state said the app has 2.1 million users.\u003c/p\u003e\n\n\u003cp\u003eColorado warned that the incident likely involved the theft of data tied to nearly 150,000 people, but investigators did not disclose what data may have been taken. Residents were advised to bring physical IDs when traveling for Thanksgiving, while state services remained available through individual agency websites. The Gentlemen ransomware group claimed the attack on Sunday. The article also notes that public entities in New York, Mississippi, California, and West Virginia were dealing with other cyber incidents or ransomware-related disruptions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Colorado’s Governor’s Office of Information Technology said it discovered a cyberattack involving the myColorado app on the evening of November 18 and shut the app down.","The state said data connected to nearly 150,000 people may have been stolen, though investigators did not specify what information was involved.","myColorado has 2.1 million users and provides digital identification, document storage, and access to state government services.","Colorado advised residents traveling for Thanksgiving to carry physical identification, while state services remain available through agency websites.","The Gentlemen ransomware group claimed responsibility for the incident on Sunday."],"insights":["Although myColorado was unavailable, Colorado said residents could still access state services through individual agency websites, providing an alternative route for essential services.","The potential data exposure affected nearly 150,000 people, while the app has 2.1 million users, meaning the reported potential exposure was smaller than the app’s total user base.","The outage had an immediate practical effect on travel, prompting the state to advise residents to carry physical identification for Thanksgiving trips.","The group that claimed the incident, The Gentlemen, also claimed 398 attacks in the prior quarter, according to Halcyon researchers, and the article describes other recent disruptions affecting public institutions in several U.S. states."],"referencedReports":[{"title":"Ransomware Evolution Report: Q3 2026","url":"https://www.halcyon.ai/ransomware-evolution-report/q3-2026","publisher":"halcyon","context":"The article cites Halcyon researchers’ report to support the claim that The Gentlemen ransomware group led other groups in claimed victims during the prior quarter.","category":"research","primary":false}],"body":"\u003cp\u003eColorado’s Governor’s Office of Information Technology said it discovered a cyberattack involving the myColorado app on the evening of November 18. The state shut down the app, which remained unavailable as of Tuesday afternoon, and began an investigation. myColorado is used by Colorado residents for digital identification, document storage, and access to state government services. The state said the app has 2.1 million users.\u003c/p\u003e\n\n\u003cp\u003eColorado warned that the incident likely involved the theft of data tied to nearly 150,000 people, but investigators did not disclose what data may have been taken. Residents were advised to bring physical IDs when traveling for Thanksgiving, while state services remained available through individual agency websites. The Gentlemen ransomware group claimed the attack on Sunday. The article also notes that public entities in New York, Mississippi, California, and West Virginia were dealing with other cyber incidents or ransomware-related disruptions.\u003c/p\u003e\n"},{"n":4,"title":"California privacy agency director Kemp to leave after two-year tenure","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/california-privacy-agency-kemp","time":"19:30","priority":"MAY READ","score":68,"tldr":"California Privacy Protection Agency Executive Director Tom Kemp will depart after nearly two years, during which the agency launched its consumer data-deletion and opt-out platform used by more than 600,000 Californians.","briefOverview":"\u003cp\u003eTom Kemp, executive director of the California Privacy Protection Agency, announced that he will leave after nearly two years leading the agency. He will start a new position in January but did not disclose the role. Kemp said he is proud of the agency’s progress in making privacy rights easier for Californians to exercise.\u003c/p\u003e\n\n\u003cp\u003eDuring his tenure, the agency launched the Delete Request and Opt-Out Platform, which allows consumers to block data sharing and request deletion of their information from data brokers. More than 600,000 Californians use the platform, and Kemp said each user has prompted more than 200 data deletions on average. The platform debuted in January, while penalties for companies that disregard consumer privacy choices took effect in August.\u003c/p\u003e\n\n\u003cp\u003eThe agency also supported two laws expanding consumer privacy, opposed federal preemption of California privacy laws, and issued its largest-ever fine. It adopted regulations addressing cybersecurity audits, risk assessments, and automated decision-making technology that uses personal data for significant decisions, including employment-related decisions. These actions expanded the agency’s role in enforcing privacy rules and overseeing how organizations use personal information.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["California Privacy Protection Agency Executive Director Tom Kemp announced that he will leave the agency after nearly two years leading it.","Kemp highlighted the Delete Request and Opt-Out Platform, which launched in January and is used by more than 600,000 Californians to block data sharing and request deletions from data brokers.","According to Kemp, each user of the platform has prompted more than 200 data deletions by data brokers on average.","Penalties for companies that violate consumers’ privacy choices through the platform took effect in August.","During Kemp’s tenure, the agency issued its largest fine, promoted two privacy-expansion laws, and adopted regulations for cybersecurity audits, risk assessments, and automated decision-making technology."],"insights":["With more than 600,000 users each prompting more than 200 data deletions on average, the platform has resulted in more than 120 million deletion requests from data brokers.","The platform was available from January, but companies did not face penalties for ignoring consumer privacy choices until August.","The agency’s work under Kemp extended beyond data-broker deletion requests to rules requiring cybersecurity audits, risk assessments, and oversight of software that makes significant decisions about people.","CalPrivacy’s enforcement activity included its largest-ever fine, requiring Federal Express to change practices and pay close to $3 million over California Consumer Privacy Act violations."],"referencedReports":[],"body":"\u003cp\u003eTom Kemp, executive director of the California Privacy Protection Agency, announced that he will leave after nearly two years leading the agency. He will start a new position in January but did not disclose the role. Kemp said he is proud of the agency’s progress in making privacy rights easier for Californians to exercise.\u003c/p\u003e\n\n\u003cp\u003eDuring his tenure, the agency launched the Delete Request and Opt-Out Platform, which allows consumers to block data sharing and request deletion of their information from data brokers. More than 600,000 Californians use the platform, and Kemp said each user has prompted more than 200 data deletions on average. The platform debuted in January, while penalties for companies that disregard consumer privacy choices took effect in August.\u003c/p\u003e\n\n\u003cp\u003eThe agency also supported two laws expanding consumer privacy, opposed federal preemption of California privacy laws, and issued its largest-ever fine. It adopted regulations addressing cybersecurity audits, risk assessments, and automated decision-making technology that uses personal data for significant decisions, including employment-related decisions. These actions expanded the agency’s role in enforcing privacy rules and overseeing how organizations use personal information.\u003c/p\u003e\n"}]</script>
