<script type="application/json" id="dl-articles">[{"n":3,"title":"Hackers target WordPress sites via third-party WooCommerce plugin","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-target-wordpress-sites-via-third-party-woocommerce-plugin/","time":"14:45","priority":"SHOULD READ","score":88,"tldr":"Attackers are actively exploiting CVE-2026-27540 in WooCommerce Wholesale Lead Capture versions 2.0.3.1 and earlier to upload PHP webshells and potentially take over WordPress sites. Administrators should upgrade to version 2.0.3.2 or later and check for suspicious PHP files, AJAX requests, and unknown admin accounts.","briefOverview":"\u003cp\u003eHackers are actively exploiting CVE-2026-27540, a critical flaw in the WooCommerce Wholesale Lead Capture premium plugin for WordPress. The issue affects versions 2.0.3.1 and earlier and allows attackers to upload PHP webshells without logging in. Such uploads can enable code execution and potentially result in full compromise of an affected website.\u003c/p\u003e\n\n\u003cp\u003eThe plugin exposed an AJAX upload action that accepted its allowed file types from a user-controlled request setting, allowing attackers to add PHP to the permitted extensions. Wordfence said its web application firewall blocked more than 100,000 attacks linked to the flaw, with several reported activity spikes. Version 2.0.3.2, released on February 20, fixes the issue; administrators are advised to update, check for unexpected PHP files and unknown administrator accounts, and restore from a safe backup if compromise is confirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-27540 is an unauthenticated file-upload flaw affecting WooCommerce Wholesale Lead Capture plugin versions 2.0.3.1 and earlier for WordPress.","The flaw lets attackers alter a user-controlled upload setting to allow PHP files, enabling them to upload webshells that can execute code on the affected site.","WooCommerce Wholesale Lead Capture version 2.0.3.2, released on February 20, fixes the vulnerability.","Wordfence said its web application firewall blocked more than 100,000 attacks associated with CVE-2026-27540, with activity spiking between June 4 and June 17 and again on July 1 and August 30.","Administrators are advised to update the plugin, inspect upload directories and logs for suspicious activity, remove unknown administrator accounts, and restore from a safe backup if compromise is confirmed."],"insights":["The upload restriction could be bypassed because the plugin relied on a file-type allowlist supplied by the person making the request, allowing attackers to add PHP as an accepted type.","The uploaded shell is not limited to gathering information about the server; it also provides a browser-based form for placing additional malicious files on the site.","Cleaning up an affected site may be unreliable because attackers can establish persistence mechanisms and create accounts or backdoors, so the article recommends restoring from a known-safe backup when compromise is confirmed."],"referencedReports":[{"title":"Attackers Actively Exploiting Critical Vulnerability in WooCommerce Wholesale Lead Capture Plugin","url":"https://www.wordfence.com/blog/2026/09/attackers-actively-exploiting-critical-vulnerability-in-woocommerce-wholesale-lead-capture-plugin/","publisher":"wordfence","context":"The article cites Wordfence's technical analysis of active exploitation, including the forged upload setting and PHP webshell behavior.","category":"research","primary":true}],"body":"\u003cp\u003eHackers are actively exploiting CVE-2026-27540, a critical flaw in the WooCommerce Wholesale Lead Capture premium plugin for WordPress. The issue affects versions 2.0.3.1 and earlier and allows attackers to upload PHP webshells without logging in. Such uploads can enable code execution and potentially result in full compromise of an affected website.\u003c/p\u003e\n\n\u003cp\u003eThe plugin exposed an AJAX upload action that accepted its allowed file types from a user-controlled request setting, allowing attackers to add PHP to the permitted extensions. Wordfence said its web application firewall blocked more than 100,000 attacks linked to the flaw, with several reported activity spikes. Version 2.0.3.2, released on February 20, fixes the issue; administrators are advised to update, check for unexpected PHP files and unknown administrator accounts, and restore from a safe backup if compromise is confirmed.\u003c/p\u003e\n"},{"n":9,"title":"Iranian Hackers Use Telegram-Controlled Malware to Spy on Dissidents and Journalists","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/iranian-hackers-use-telegram-controlled.html","time":"16:29","priority":"SHOULD READ","score":88,"tldr":"U.S., U.K., and Dutch agencies say Iran’s MOIS is using Telegram-controlled Windows malware, tracked as HEAVYGRAM/CHOSEN BRICK, to spy on dissidents, journalists, and activists. The malware is delivered through impersonated apps and can steal messages and credentials, record audio, capture screenshots, evade Defender, and potentially wipe infected systems.","briefOverview":"\u003cp\u003eU.S., U.K., and Dutch agencies say Iran’s Ministry of Intelligence and Security has used a Windows malware family tracked as HEAVYGRAM by the FBI and CHOSEN BRICK by the U.K. National Cyber Security Centre. The campaign has targeted Iranian dissidents, opposition journalists, activists, and others viewed as conflicting with the Iranian government, including people in the United States, United Kingdom, and Netherlands. Agencies say the wider campaign dates to autumn 2023 and that CHOSEN BRICK has been used since at least 2025.\u003c/p\u003e\n\n\u003cp\u003eAttackers pose as trusted contacts or messaging-app support and send files disguised as programs such as Pictory, KeePass, Telegram, RunwayML, Norton Antivirus, Adobe Flash Player, or MRI scan results. After a victim opens a file, the malware shows a convincing fake screen while installing in the background, then connects to a dedicated Telegram bot used for control and data theft. It can take screenshots, record audio through the microphone, collect emails, chat data, saved passwords, and email addresses, download further tools, delete files, and in at least one version wipe the computer.\u003c/p\u003e\n\n\u003cp\u003eThe malware persists through Windows registry Run-key entries and can tell Microsoft Defender to skip certain folders, while stolen data can be sent through Telegram and cloud-storage services including Vultr and Storj. Agencies warn that stolen screenshots and other information may expose victims’ contacts, locations, and daily routines, and that some victims’ personal details have appeared on pro-Iranian leak sites. They advise people to avoid opening files received through messages, obtain software only from official sources, keep software updated, and not disregard SmartScreen warnings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S., U.K., and Dutch agencies say Iran’s Ministry of Intelligence and Security uses Windows malware tracked as HEAVYGRAM by the FBI and CHOSEN BRICK by the U.K. National Cyber Security Centre.","The campaign has targeted Iranian dissidents, opposition journalists, activists, and other people whose views conflict with the Iranian government, including people in the United States, United Kingdom, and Netherlands.","Attackers impersonate trusted contacts or messaging-app support and send files disguised as legitimate software, including Pictory, KeePass, Telegram, RunwayML, Norton Antivirus, Adobe Flash Player, and MRI scan results.","After installation, the malware uses a dedicated Telegram bot for each infected computer and can collect emails, chat data, saved passwords, screenshots, microphone recordings, and additional files.","The malware establishes persistence through a Windows registry Run key, can exclude folders from Microsoft Defender scanning, and may send stolen data through Telegram and cloud-storage services such as Vultr and Storj."],"insights":["The attackers reportedly give each infected computer its own Telegram bot, a design that keeps one victim’s activity separate from another’s.","The campaign may move from a protected work computer to a personal device if the first attempt fails, potentially bypassing company security controls.","Collected screenshots and personal information can reveal a victim’s contacts, location, and routine, and some victims’ details have appeared on pro-Iranian leak sites, increasing potential safety risks.","Defenders should not rely only on listed file names and folders because the agencies warn these can change; they should also monitor suspicious connections to Telegram, cloud-storage, and proxy services."],"referencedReports":[{"title":"Joint Advisory on Iranian Cyber Targeting of Dissidents, Activists, and Journalists","url":"https://www.ic3.gov/CSA/2026/260915-2.pdf","publisher":"fbi, national-cyber-security-centre, aivd","context":"The article relies on this joint advisory for details of the CHOSEN BRICK malware campaign, targeting, capabilities, and indicators of compromise.","category":"advisory","primary":true},{"title":"FBI Updated Analysis of HEAVYGRAM Malware","url":"https://www.ic3.gov/CSA/2026/260915.pdf","publisher":"fbi","context":"The article says this updated FBI malware analysis adds technical detail and new indicators of compromise to the earlier FBI alert.","category":"advisory","primary":true},{"title":"Government of Iran Cyber Actors Deploy Telegram C2 to Push Malware to Identified Targets","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/government-of-iran-cyber-actors-deploy-telegram-c2-to-push-malware-to-identified-targets","publisher":"fbi","context":"The article identifies this March 2026 FBI alert as the first public description of the campaign.","category":"advisory","primary":false}],"body":"\u003cp\u003eU.S., U.K., and Dutch agencies say Iran’s Ministry of Intelligence and Security has used a Windows malware family tracked as HEAVYGRAM by the FBI and CHOSEN BRICK by the U.K. National Cyber Security Centre. The campaign has targeted Iranian dissidents, opposition journalists, activists, and others viewed as conflicting with the Iranian government, including people in the United States, United Kingdom, and Netherlands. Agencies say the wider campaign dates to autumn 2023 and that CHOSEN BRICK has been used since at least 2025.\u003c/p\u003e\n\n\u003cp\u003eAttackers pose as trusted contacts or messaging-app support and send files disguised as programs such as Pictory, KeePass, Telegram, RunwayML, Norton Antivirus, Adobe Flash Player, or MRI scan results. After a victim opens a file, the malware shows a convincing fake screen while installing in the background, then connects to a dedicated Telegram bot used for control and data theft. It can take screenshots, record audio through the microphone, collect emails, chat data, saved passwords, and email addresses, download further tools, delete files, and in at least one version wipe the computer.\u003c/p\u003e\n\n\u003cp\u003eThe malware persists through Windows registry Run-key entries and can tell Microsoft Defender to skip certain folders, while stolen data can be sent through Telegram and cloud-storage services including Vultr and Storj. Agencies warn that stolen screenshots and other information may expose victims’ contacts, locations, and daily routines, and that some victims’ personal details have appeared on pro-Iranian leak sites. They advise people to avoid opening files received through messages, obtain software only from official sources, keep software updated, and not disregard SmartScreen warnings.\u003c/p\u003e\n"},{"n":7,"title":"Iranian cyber spies used fake MRI scan results to hack ‘enemy of regime’","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/iran-cyber-spies-use-fake-mri-scans-as-lure","time":"16:28","priority":"SHOULD READ","score":86,"tldr":"UK, U.S. and Dutch agencies warn that Iranian state-linked operators are using the CHOSEN BRICK Windows spyware, often delivered through tailored social-engineering lures such as fake MRI results, to surveil dissidents, activists and journalists. The malware steals communications and location-relevant data, potentially enabling harassment and physical targeting.","briefOverview":"\u003cp\u003eBritish, U.S. and Dutch security agencies warned that Iranian state-sponsored hackers have used CHOSEN BRICK spyware against people considered threats to the Iranian regime, including dissidents, activists and journalists. The campaign has affected victims in the United Kingdom, United States and Netherlands since at least 2025. Attackers first build trust through WhatsApp or Telegram, often posing as known contacts or technical support, then send a malicious file tailored to the target, including a fake MRI scan result. Other lures have impersonated Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player and KeePass.\u003c/p\u003e\n\n\u003cp\u003eCHOSEN BRICK works on Windows and can collect contacts, email inboxes, social-media messages, screenshots and microphone audio. It persists by relaunching at login, adds Microsoft Defender exclusions, and uses separate Telegram bots for each victim to receive commands and send stolen data; recent versions also use proxies to hide their traffic. The agencies said the stolen information can create a detailed picture of a victim’s location, relationships and routine, increasing the risk of harassment and physical harm. The warning notes that Iranian intelligence services have allegedly plotted kidnappings and assassinations of perceived regime enemies, including outside Iran, and cautions that attackers may try to move targets onto personal devices to bypass workplace protections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The UK National Cyber Security Centre, the FBI, and the Netherlands’ AIVD jointly warned that Iranian state-sponsored hackers have used CHOSEN BRICK spyware against people viewed as threats to the Iranian regime, including dissidents, activists, and journalists.","The attackers build trust through WhatsApp or Telegram conversations, often posing as known contacts or technical support, before sending tailored malicious files such as a fake MRI scan result.","CHOSEN BRICK targets Windows devices and can collect contacts, email inboxes, social-media messages, screenshots, and microphone audio while using Telegram bots and cloud-storage services to send stolen data.","The agencies warned that information collected by the spyware can reveal a target’s location, contacts, and daily routine, increasing the risk of harassment and physical harm.","The FBI said related Telegram-based spyware had targeted Iranian dissidents and journalists since fall 2023 and assessed that actors operating for Iran’s Ministry of Intelligence and Security were responsible."],"insights":["The campaign combines digital surveillance with a stated risk of real-world harm, because stolen data can map a target’s location, contacts, and routine and Iranian services have allegedly plotted kidnappings and assassinations.","Attackers tailor both their personal approach and the malicious file to each target, using believable themes such as medical results or familiar software rather than relying on one standard lure.","Each victim receives a separate Telegram bot for attacker communications, a design the agencies said limits the chance that one compromised device exposes other victims.","The attackers may encourage targets to use personal devices, which can bypass protections available on workplace-managed systems.","CHOSEN BRICK adds exclusions to Microsoft Defender and relaunches when a user logs in, helping it avoid detection and remain active after a computer restart."],"referencedReports":[{"title":"FBI Flash Warning","url":"https://www.ic3.gov/CSA/2026/260320.pdf","publisher":"Federal Bureau of Investigation","context":"The article cites the FBI warning as attributing related Telegram-based malware activity to actors operating on behalf of Iran’s Ministry of Intelligence and Security.","category":"advisory","primary":false}],"body":"\u003cp\u003eBritish, U.S. and Dutch security agencies warned that Iranian state-sponsored hackers have used CHOSEN BRICK spyware against people considered threats to the Iranian regime, including dissidents, activists and journalists. The campaign has affected victims in the United Kingdom, United States and Netherlands since at least 2025. Attackers first build trust through WhatsApp or Telegram, often posing as known contacts or technical support, then send a malicious file tailored to the target, including a fake MRI scan result. Other lures have impersonated Pictory, RunwayML, Norton Antivirus, Telegram, Adobe Flash Player and KeePass.\u003c/p\u003e\n\n\u003cp\u003eCHOSEN BRICK works on Windows and can collect contacts, email inboxes, social-media messages, screenshots and microphone audio. It persists by relaunching at login, adds Microsoft Defender exclusions, and uses separate Telegram bots for each victim to receive commands and send stolen data; recent versions also use proxies to hide their traffic. The agencies said the stolen information can create a detailed picture of a victim’s location, relationships and routine, increasing the risk of harassment and physical harm. The warning notes that Iranian intelligence services have allegedly plotted kidnappings and assassinations of perceived regime enemies, including outside Iran, and cautions that attackers may try to move targets onto personal devices to bypass workplace protections.\u003c/p\u003e\n"},{"n":4,"title":"How Money Laundering, Scams, and Espionage Hide in a Web Full of Casino Garbage","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/how-money-laundering-scams-and-espionage-hide-in-a-web-full-of-casino-garbage/","time":"15:00","priority":"SHOULD READ","score":84,"tldr":"Infoblox found that millions of lookalike casino websites conceal distinct criminal operations, including illegal gambling and money laundering, scam gambling, and China-aligned PeckBirdy malware C2 infrastructure. Defenders should not dismiss casino or adult-domain activity as policy violations, because repeated queries to multiple PeckBirdy C2 domains may indicate a compromise.","briefOverview":"\u003cp\u003eInfoblox describes three kinds of malicious casino websites that can appear nearly identical in a browser: illegal Chinese-language casinos supporting gambling and money laundering, scam gambling sites that block withdrawals, and decoy sites used by China-aligned actors running the PeckBirdy command-and-control framework. The company tracks more than 1.7 million illegal Chinese-language casino domains, while the PeckBirdy population consists of dozens of decoy domains. These sites use rapidly changing domains, varied hosting providers, and customer-facing branding that can make criminal infrastructure hard to distinguish from ordinary low-quality gambling content.\u003c/p\u003e\n\n\u003cp\u003ePeckBirdy has operated since 2023 and embeds its communications infrastructure in Chinese-language casino and adult websites. Infoblox identified domains including cache-mcp[.]com and mcp-source[.]online; the latter had zero VirusTotal detections as of August 2026 despite being used for WebSocket connections. Just over 3% of Infoblox enterprise customers resolved at least one PeckBirdy command-and-control domain, with education, IT, banking, financial services, and government among the observed industries. Infoblox advises defenders not to dismiss casino or adult-domain alerts automatically, especially when a network contacts several distinct PeckBirdy domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox separates malicious casino websites into three groups: illegal Chinese-language gambling sites used for gambling and money laundering, scam gambling sites that prevent victims from withdrawing funds, and PeckBirdy decoy sites used for malware command-and-control communications.","Infoblox tracks more than 1.7 million illegal Chinese-language casino domains, with the FUNNULL and Vigorish Viper networks accounting for roughly 81% of that population.","China-aligned APT groups have used the PeckBirdy framework since 2023 to embed command-and-control domains in low-quality Chinese-language casino and adult websites.","The PeckBirdy domain mcp-source[.]online had zero VirusTotal detections as of August 2026, despite being used for WebSocket connections from some PeckBirdy decoy sites.","Infoblox found that just over 3% of its enterprise customers resolved at least one PeckBirdy command-and-control domain, and repeated resolution of three to ten distinct such domains may indicate a potential compromise."],"insights":["The casino decoys used by PeckBirdy are visually indistinguishable from illegal gambling and scam sites, so dismissing a casino-domain alert as employee browsing can overlook malicious activity.","A single query to githubassets[.]net is weak evidence because the domain also receives accidental typo-related traffic, while queries to three to ten distinct PeckBirdy domains are a more meaningful compromise signal.","The four largest Chinese-language casino clusters account for roughly 99.5% of the domains Infoblox tracks, suggesting that a small number of operators underpin most of this very large ecosystem.","Domain blocking alone has limited effect against illegal casino networks because operators maintain thousands of domains and rapidly rotate to replacements when a site is blocked.","Many domains are registered through U.S. registrars while being hosted in China or Hong Kong, creating potential disruption opportunities through the registration providers even when the hosting is outside U.S. reach."],"referencedReports":[{"title":"An Interconnected Criminal Ecosystem: Transnational Organized Crime Threat Assessment for Southeast Asia 2026","url":"https://www.unodc.org/unodc/en/press/releases/2026/July/new-unodc-report-reveals-scale-of-south-east-asias-ever-more-interconnected-criminal-economy.html","publisher":"united-nations-office-on-drugs-and-crime","context":"The article cites this UNODC regional threat assessment for estimates on illegal betting, online-scam losses, and the convergence of gambling, fraud, underground banking, and trafficking.","category":"research","primary":false},{"title":"PeckBirdy Script Framework","url":"https://www.trendmicro.com/en_us/research/26/a/peckbirdy-script-framework.html","publisher":"trend-micro","context":"The article references Trend Micro's January 2026 report as prior documentation of PeckBirdy indicators and hunting guidance.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox describes three kinds of malicious casino websites that can appear nearly identical in a browser: illegal Chinese-language casinos supporting gambling and money laundering, scam gambling sites that block withdrawals, and decoy sites used by China-aligned actors running the PeckBirdy command-and-control framework. The company tracks more than 1.7 million illegal Chinese-language casino domains, while the PeckBirdy population consists of dozens of decoy domains. These sites use rapidly changing domains, varied hosting providers, and customer-facing branding that can make criminal infrastructure hard to distinguish from ordinary low-quality gambling content.\u003c/p\u003e\n\n\u003cp\u003ePeckBirdy has operated since 2023 and embeds its communications infrastructure in Chinese-language casino and adult websites. Infoblox identified domains including cache-mcp[.]com and mcp-source[.]online; the latter had zero VirusTotal detections as of August 2026 despite being used for WebSocket connections. Just over 3% of Infoblox enterprise customers resolved at least one PeckBirdy command-and-control domain, with education, IT, banking, financial services, and government among the observed industries. Infoblox advises defenders not to dismiss casino or adult-domain alerts automatically, especially when a network contacts several distinct PeckBirdy domains.\u003c/p\u003e\n"},{"n":6,"title":"Electric and gas utility CenterPoint Energy warns of data breach after dark web post","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/centerpoint-energy-data-breach","time":"14:22","priority":"SHOULD READ","score":84,"tldr":"CenterPoint Energy confirmed that hackers accessed customer personal information through an internet-facing system after stolen data was advertised on the dark web, though electric and gas operations were not disrupted. The utility is investigating the scope, notifying authorities, and plans to alert affected customers as required.","briefOverview":"\u003cp\u003eCenterPoint Energy disclosed in an SEC filing that it became aware of a dark web post claiming to offer data stolen from the company. Its investigation found that hackers obtained personal information relating to some customers through an external-facing system. The company said electricity and natural-gas delivery has not been affected.\u003c/p\u003e\n\n\u003cp\u003eThe post claimed that roughly 7.5 million records included customer names, account information, billing information, and the last four digits of Social Security numbers, though CenterPoint is still determining the scope of affected people and data. CenterPoint said it is working with third-party experts, has reported the incident to law enforcement, and intends to notify affected customers and regulators as required. The company expects investigation-related costs but does not believe the incident will materially affect its finances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CenterPoint Energy said it learned of a dark web post claiming to offer data stolen from the company and confirmed that personal information from some customers was obtained through an external-facing system.","The company said its electric and gas services have not been affected by the incident.","The cybercriminal post claimed that about 7.5 million records included customer names, account information, billing information, and the last four digits of Social Security numbers.","CenterPoint Energy is working with third-party experts to determine the affected customers and information, and it plans to provide notifications as required by law.","The company reported the incident to law enforcement and said investigation-related costs are not expected to materially affect its finances."],"insights":["The incident appears limited to customer information rather than service delivery, as CenterPoint Energy said electric and gas operations were not impacted.","The alleged 7.5 million-record figure comes from the dark web post, while CenterPoint Energy is still determining the actual number of affected customers and types of information involved.","This is not CenterPoint Energy’s first recent customer-data investigation: the company previously examined a separate leak connected to the 2023 MOVEit incident.","CenterPoint Energy disclosed the incident in an SEC filing and said it does not expect the investigation-related costs to materially affect its finances."],"referencedReports":[],"body":"\u003cp\u003eCenterPoint Energy disclosed in an SEC filing that it became aware of a dark web post claiming to offer data stolen from the company. Its investigation found that hackers obtained personal information relating to some customers through an external-facing system. The company said electricity and natural-gas delivery has not been affected.\u003c/p\u003e\n\n\u003cp\u003eThe post claimed that roughly 7.5 million records included customer names, account information, billing information, and the last four digits of Social Security numbers, though CenterPoint is still determining the scope of affected people and data. CenterPoint said it is working with third-party experts, has reported the incident to law enforcement, and intends to notify affected customers and regulators as required. The company expects investigation-related costs but does not believe the incident will materially affect its finances.\u003c/p\u003e\n"},{"n":2,"title":"CenterPoint Energy confirms customer data stolen in cyberattack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/centerpoint-energy-confirms-customer-data-stolen-in-cyberattack/","time":"16:40","priority":"SHOULD READ","score":82,"tldr":"CenterPoint Energy confirmed that an unauthorized party accessed personal information for an undetermined number of customers through an external-facing system, following claims that 7.49 million records were stolen via an inadequately protected public API. The company says utility operations were unaffected and is investigating, strengthening defenses, and preparing required notifications.","briefOverview":"\u003cp\u003eCenterPoint Energy confirmed that an unauthorized third party obtained personal information related to some customers through one of its external-facing systems. The company began investigating after finding an online post from a threat actor claiming to have stolen 7.49 million records. CenterPoint has not disclosed how many customers were affected or the specific types of data compromised.\u003c/p\u003e\n\n\u003cp\u003eThe threat actor, using the alias “4d722e4d656f77,” alleged that the records included customer names, phone numbers, service and billing addresses, account numbers, billing amounts, and partial Social Security numbers. They claimed the data was obtained by repeatedly querying millions of IDs through CenterPoint’s public API, which they said lacked limits on repeated requests and protections against automated access. CenterPoint said electric and gas operations were unaffected, has engaged third-party cybersecurity experts and notified authorities, and faces multiple proposed federal class-action lawsuits.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CenterPoint Energy confirmed that an unauthorized third party obtained personal information related to some customers through an external-facing system.","A threat actor using the alias “4d722e4d656f77” claimed to have stolen 7.49 million CenterPoint customer records and leaked the data after alleging the company ignored its messages.","The alleged stolen records included names, phone numbers, service and billing addresses, account numbers, billing amounts, and partial Social Security numbers.","CenterPoint Energy said its electric and gas services were not affected and that it does not expect the incident to materially affect its business or financial condition.","The company has engaged third-party cybersecurity experts, strengthened system protections, and reported the incident to law enforcement and regulators while it investigates the scope of affected data and customers."],"insights":["The incident was identified after CenterPoint found an online post claiming stolen data, rather than through a disclosed internal detection event.","The alleged method involved cycling through millions of identifiers on a public-facing interface that the threat actor said lacked limits on repeated requests and protections against automated access.","CenterPoint’s SEC filing confirms unauthorized access to customer information but does not state the number of affected customers or the specific types of data involved.","Proposed federal class-action lawsuits have already been filed alleging that the breach occurred between August 17 and September 1."],"referencedReports":[],"body":"\u003cp\u003eCenterPoint Energy confirmed that an unauthorized third party obtained personal information related to some customers through one of its external-facing systems. The company began investigating after finding an online post from a threat actor claiming to have stolen 7.49 million records. CenterPoint has not disclosed how many customers were affected or the specific types of data compromised.\u003c/p\u003e\n\n\u003cp\u003eThe threat actor, using the alias “4d722e4d656f77,” alleged that the records included customer names, phone numbers, service and billing addresses, account numbers, billing amounts, and partial Social Security numbers. They claimed the data was obtained by repeatedly querying millions of IDs through CenterPoint’s public API, which they said lacked limits on repeated requests and protections against automated access. CenterPoint said electric and gas operations were unaffected, has engaged third-party cybersecurity experts and notified authorities, and faces multiple proposed federal class-action lawsuits.\u003c/p\u003e\n"},{"n":8,"title":"BambooToken Malware Uses MQTT to Control Windows and Linux Systems","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/bambootoken-malware-uses-mqtt-to.html","time":"15:23","priority":"SHOULD READ","score":82,"tldr":"Researchers uncovered BambooToken, a cross-platform malware family active since 2023 that uses MQTT command-and-control and DLL sideloading through Tendyron OnKey software to compromise Windows and Linux systems. The campaign has targeted organizations across Asia and South America, likely to enable broad data collection.","briefOverview":"\u003cp\u003eResearchers at Lumen Black Lotus Labs disclosed BambooToken, a previously undocumented malware family that has targeted Windows and Linux systems since at least February 2023. The malware uses MQTT, a lightweight messaging protocol, to communicate with systems controlled by its operators. Samples were discovered on VirusTotal in early 2026, and related activity was observed as recently as July 2026. The initial method used to place the malware on targeted systems is unknown.\u003c/p\u003e\n\n\u003cp\u003eEarly BambooToken versions used a PowerShell script to start the malicious program, while later versions use DLL sideloading involving Tendyron OnKeySrv and a rogue \u003ccode\u003eOnKeyToken_KEB.dll\u003c/code\u003e file. The malware gathers host details, can load additional plugins, and includes a Windows plugin that identifies installed antivirus products through WMI and sends the information to a command server. Lumen identified affected entities in Asia and South America, including mobile-application services, a hotel in Vietnam, an Argentine biomedical company, a Chilean legal firm, a Lithuanian cryptocurrency website, and a Malaysian finance organization. The researchers said this targeting may support extensive data collection, potentially exposing information such as travel history, transaction data, and patterns of daily life.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BambooToken is a cross-platform malware family active since at least February 2023 that uses MQTT, a lightweight messaging protocol, to receive instructions for controlling Windows and Linux systems.","Lumen Black Lotus Labs found BambooToken samples on VirusTotal in early 2026, while the initial method used to gain access to affected systems remains unknown.","Later BambooToken versions use a malicious OnKeyToken_KEB.dll file alongside Tendyron OnKeySrv software to collect host details and communicate with command servers over MQTT.","BambooToken includes a Windows component that uses Windows Management Instrumentation to identify installed antivirus products and send that information to its command server.","Detected affected organizations include entities in Asia and South America, such as mobile-application services, a Hong Kong GitLab server, a Vietnamese hotel, an Argentine biomedical company, a Chilean law firm, a Lithuanian cryptocurrency website, and a Malaysian finance organization."],"insights":["BambooToken evolved from a PowerShell-based launcher to DLL sideloading through Tendyron OnKeySrv, a change Black Lotus Labs assesses was likely intended to generate fewer endpoint-detection alerts.","The campaign appears to abuse a DLL-sideloading weakness in software used with Tendyron OnKey authentication tokens, rather than a compromise of Tendyron’s code-signing certificate or build environment.","Domains tied to the campaign used Cloudflare as a proxy, and their Cloudflare Radar rankings rose into the top 500,000 and top 1 million at different points, which Black Lotus Labs said indicates widespread infection across campaigns.","Active command-and-control communication was observed from IP addresses associated with MikroTik and DrayTek routers in Singapore, Cambodia, and Vietnam, alongside compromised organizations in Asia and South America.","The mix of targets—including mobile applications, finance organizations, hotels, and connected lifestyle devices—could expose information such as transaction data, travel plans, and patterns of daily life, according to Black Lotus Labs."],"referencedReports":[{"title":"The Banana Stand: Brokering and Managing Infections Across Asia Using MQTT","url":"https://www.lumen.com/blog/en-us/the-banana-stand-brokering-and-managing-infections-across-asia-using-mqtt","publisher":"lumen-black-lotus-labs","context":"The article relies on Black Lotus Labs' report for its findings on the BambooToken malware campaign, its MQTT-based control infrastructure, and its targeting.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at Lumen Black Lotus Labs disclosed BambooToken, a previously undocumented malware family that has targeted Windows and Linux systems since at least February 2023. The malware uses MQTT, a lightweight messaging protocol, to communicate with systems controlled by its operators. Samples were discovered on VirusTotal in early 2026, and related activity was observed as recently as July 2026. The initial method used to place the malware on targeted systems is unknown.\u003c/p\u003e\n\n\u003cp\u003eEarly BambooToken versions used a PowerShell script to start the malicious program, while later versions use DLL sideloading involving Tendyron OnKeySrv and a rogue \u003ccode\u003eOnKeyToken_KEB.dll\u003c/code\u003e file. The malware gathers host details, can load additional plugins, and includes a Windows plugin that identifies installed antivirus products through WMI and sends the information to a command server. Lumen identified affected entities in Asia and South America, including mobile-application services, a hotel in Vietnam, an Argentine biomedical company, a Chilean legal firm, a Lithuanian cryptocurrency website, and a Malaysian finance organization. The researchers said this targeting may support extensive data collection, potentially exposing information such as travel history, transaction data, and patterns of daily life.\u003c/p\u003e\n"},{"n":1,"title":"BambooToken malware controls Windows and Linux systems via MQTT","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bambootoken-malware-controls-windows-and-linux-systems-via-mqtt/","time":"15:00","priority":"SHOULD READ","score":78,"tldr":"Researchers uncovered BambooToken, a cross-platform malware framework that uses MQTT broker topics for stealthy command-and-control of Windows and Linux systems. The campaign has compromised roughly a dozen organizations, largely in Asia and South America, and may be consistent with China-aligned activity.","briefOverview":"\u003cp\u003eResearchers at Lumen’s Black Lotus Labs reported on BambooToken, a previously unknown malware framework active since at least 2023 that targets Windows and Linux systems. Versions developed between 2024 and 2025 use MQTT, a messaging protocol commonly intended for internet-connected devices, for command-and-control communications. Infected machines subscribe to uniquely associated messaging topics for instructions and send status and system information through the same broker.\u003c/p\u003e\n\n\u003cp\u003eThis design avoids direct connections between infected systems and attacker infrastructure and can continue operating during temporary network disruptions. BambooToken was delivered through side-loading involving digitally signed Tendyron OnKey USB-token software or by impersonating Kingsoft Office, and a Linux 2.1 version observed in December 2025 could collect system details, open a command shell, and upload, download, or delete files. Lumen identified about a dozen compromised enterprise entities, largely in Asia and South America, including mobile app backend servers, and reported that a compromised GitLab server in Hong Kong could provide a foothold for supply-chain attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BambooToken is a previously unknown malware framework active since at least 2023 that uses MQTT to communicate with infected Windows and Linux systems.","BambooToken variants developed between 2024 and 2025 use MQTT topics tied to a unique identifier to receive attacker commands and send status and system information.","Researchers said BambooToken was delivered by side-loading through digitally signed Tendyron OnKey USB-token software or by impersonating Kingsoft Office.","A Linux BambooToken 2.1 sample observed in December 2025 can collect system information, open a command shell, and upload, download, or delete files, although researchers said it appeared to be under development.","Lumen identified about a dozen compromised enterprise entities, primarily in Asia and South America, and reported that a GitLab server in Hong Kong was also compromised."],"insights":["By using MQTT brokers rather than direct connections to attacker-controlled infrastructure, BambooToken can make its communications harder to trace and continue operating through temporary network disruptions.","The concentration of compromised servers in mobile application backend infrastructure indicates that these systems were the most affected part of the identified activity.","Strings referring to keylogging, clipboard theft, audio recording, webcam capture, and screenshots were found only in inactive code, so researchers could not confirm those capabilities were used or fully implemented.","The compromise of a GitLab server in Hong Kong created a potential route for supply-chain attacks, extending the possible impact beyond that individual server."],"referencedReports":[],"body":"\u003cp\u003eResearchers at Lumen’s Black Lotus Labs reported on BambooToken, a previously unknown malware framework active since at least 2023 that targets Windows and Linux systems. Versions developed between 2024 and 2025 use MQTT, a messaging protocol commonly intended for internet-connected devices, for command-and-control communications. Infected machines subscribe to uniquely associated messaging topics for instructions and send status and system information through the same broker.\u003c/p\u003e\n\n\u003cp\u003eThis design avoids direct connections between infected systems and attacker infrastructure and can continue operating during temporary network disruptions. BambooToken was delivered through side-loading involving digitally signed Tendyron OnKey USB-token software or by impersonating Kingsoft Office, and a Linux 2.1 version observed in December 2025 could collect system details, open a command shell, and upload, download, or delete files. Lumen identified about a dozen compromised enterprise entities, largely in Asia and South America, including mobile app backend servers, and reported that a compromised GitLab server in Hong Kong could provide a foothold for supply-chain attacks.\u003c/p\u003e\n"},{"n":5,"title":"Zelensky appoints former police chief to lead Ukraine’s cyber coordination center","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-cyber-coordination-center-ihor-klymenko","time":"15:09","priority":"MAY READ","score":63,"tldr":"Ukrainian President Volodymyr Zelensky appointed former police chief and interior minister Ihor Klymenko to lead the National Cybersecurity Coordination Center, which coordinates government responses to major cyber threats. The move is part of a broader reshuffle of Ukraine’s security leadership amid ongoing Russian cyber operations and criminal-network threats.","briefOverview":"\u003cp\u003eUkrainian President Volodymyr Zelensky appointed former law enforcement official Ihor Klymenko to lead Ukraine’s National Cybersecurity Coordination Center (NCCC). The center operates under the National Security and Defense Council and coordinates government responses to major cyber threats. Klymenko succeeds Rustem Umerov, a former secretary of the council.\u003c/p\u003e\n\n\u003cp\u003eCreated in 2016, the NCCC monitors threats facing Ukraine, coordinates government cybersecurity agencies, and oversees the country’s national cybersecurity strategy. Although Klymenko does not appear to have a technical cybersecurity background, he previously led the National Police, which includes Ukraine’s cyber police department, and served as interior minister with responsibility for law enforcement and emergency agencies. Zelensky has said Klymenko’s experience could help coordinate defense and security bodies against threats including Russian cyber operations and criminal networks.\u003c/p\u003e\n\n\u003cp\u003eThe appointment comes during a broader reshuffle of Ukraine’s security and law enforcement leadership. In July, Yevhenii Khmara became acting defense minister, and his first deputy Oleksandr Poklad later became acting head of the Security Service of Ukraine. Ukraine’s parliament also approved the dismissal of Prosecutor General Ruslan Kravchenko amid allegations that officials in his office took bribes to protect scam call centers from law enforcement.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian President Volodymyr Zelensky appointed former law enforcement official Ihor Klymenko to lead the National Cybersecurity Coordination Center.","The National Cybersecurity Coordination Center operates under Ukraine’s National Security and Defense Council and coordinates government responses to major cyber threats.","Klymenko previously headed Ukraine’s National Police, which includes the country’s cyber police department, and later served as interior minister.","The center, created in 2016, monitors cyber threats, coordinates cybersecurity agencies, and oversees Ukraine’s national cybersecurity strategy.","Klymenko’s appointment is part of a broader reshuffle of Ukraine’s security and law enforcement leadership."],"insights":["Klymenko does not appear to have a technical cybersecurity background, but his prior leadership roles included oversight of Ukraine’s cyber police department and agencies involved in fighting cybercrime.","The National Cybersecurity Coordination Center is not only a threat-monitoring body; it also coordinates multiple government agencies and oversees Ukraine’s national cybersecurity strategy.","The appointment follows several other changes in Ukraine’s senior security leadership, including acting appointments at the Defense Ministry and Security Service of Ukraine.","The article links the center’s work to both Russian cyber operations and criminal networks, showing that its remit covers state-linked and criminal threats."],"referencedReports":[],"body":"\u003cp\u003eUkrainian President Volodymyr Zelensky appointed former law enforcement official Ihor Klymenko to lead Ukraine’s National Cybersecurity Coordination Center (NCCC). The center operates under the National Security and Defense Council and coordinates government responses to major cyber threats. Klymenko succeeds Rustem Umerov, a former secretary of the council.\u003c/p\u003e\n\n\u003cp\u003eCreated in 2016, the NCCC monitors threats facing Ukraine, coordinates government cybersecurity agencies, and oversees the country’s national cybersecurity strategy. Although Klymenko does not appear to have a technical cybersecurity background, he previously led the National Police, which includes Ukraine’s cyber police department, and served as interior minister with responsibility for law enforcement and emergency agencies. Zelensky has said Klymenko’s experience could help coordinate defense and security bodies against threats including Russian cyber operations and criminal networks.\u003c/p\u003e\n\n\u003cp\u003eThe appointment comes during a broader reshuffle of Ukraine’s security and law enforcement leadership. In July, Yevhenii Khmara became acting defense minister, and his first deputy Oleksandr Poklad later became acting head of the Security Service of Ukraine. Ukraine’s parliament also approved the dismissal of Prosecutor General Ruslan Kravchenko amid allegations that officials in his office took bribes to protect scam call centers from law enforcement.\u003c/p\u003e\n"},{"n":10,"title":"HTM Workflow Tweaks to Secure Devices","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/htm-workflow-tweaks-to-secure-devices/","time":"15:37","priority":"MAY READ","score":35,"tldr":"Health-ISAC argues that healthcare technology management teams should embed cybersecurity checks, such as password and software-version verification, into routine preventive maintenance to improve medical-device safety, availability, and resilience.","briefOverview":"\u003cp\u003eHealth-ISAC’s Phil Englert argues that medical-device cybersecurity should be part of routine healthcare technology management (HTM) work. The article describes HTM professionals as focused on maintaining the reliability, safety, and performance of devices used by clinicians. It presents cyber-resilience as supporting those same goals by helping devices remain trustworthy, available, and safe for patient care.\u003c/p\u003e\n\n\u003cp\u003eRoutine maintenance activities can provide opportunities to strengthen device security, including checking passwords and verifying software versions. Preventive maintenance helps ensure equipment functions as intended, while cybersecurity activities help protect the device’s trustworthiness and availability. The article’s central recommendation is to incorporate cyber-resilience into the normal workflows HTM teams use to maintain medical devices throughout their lifecycle.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Healthcare technology management professionals are responsible for maintaining the reliability, safety, and performance of medical devices used by clinicians.","The article states that preventive maintenance helps ensure equipment functions as intended, while cybersecurity activities help ensure devices remain trustworthy, available, and safe for patient care.","Cyber-resilience should be incorporated into normal healthcare technology management workflows rather than treated as a separate activity.","Routine maintenance provides opportunities for teams to check passwords and verify software versions as part of strengthening medical-device cyber-resilience."],"insights":["Routine preventive maintenance can serve as a practical point for cybersecurity checks, including password reviews and software-version verification.","The article frames device cybersecurity as supporting the same operational goals as maintenance—reliability, safety, and performance—rather than as a separate technical discipline.","Integrating cyber-resilience into existing healthcare technology management workflows can extend security attention across a medical device's full lifecycle."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Phil Englert argues that medical-device cybersecurity should be part of routine healthcare technology management (HTM) work. The article describes HTM professionals as focused on maintaining the reliability, safety, and performance of devices used by clinicians. It presents cyber-resilience as supporting those same goals by helping devices remain trustworthy, available, and safe for patient care.\u003c/p\u003e\n\n\u003cp\u003eRoutine maintenance activities can provide opportunities to strengthen device security, including checking passwords and verifying software versions. Preventive maintenance helps ensure equipment functions as intended, while cybersecurity activities help protect the device’s trustworthiness and availability. The article’s central recommendation is to incorporate cyber-resilience into the normal workflows HTM teams use to maintain medical devices throughout their lifecycle.\u003c/p\u003e\n"}]</script>
