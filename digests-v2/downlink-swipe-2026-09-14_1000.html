<script type="application/json" id="dl-articles">[{"n":2,"title":"Revolut handed customer data to fraudsters using government email account","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/revolut-scam-crypto-impersonation","time":"12:00","priority":"SHOULD READ","score":82,"tldr":"Revolut disclosed sensitive customer data after fraudsters used a legitimate government email domain to submit fraudulent emergency information requests, reportedly targeting high-net-worth crypto-linked users. Exposed information included identity documents, contact details, bank records, and transaction histories.","briefOverview":"\u003cp\u003eRevolut said it disclosed sensitive customer data after an unauthorized party used a legitimate government agency email domain to submit fraudulent emergency information requests. The company described the activity as a sophisticated external impersonation scam and said it blocked the address after detection. Revolut also said it alerted the relevant government agency, law-enforcement bodies, data-protection authorities, and financial regulators.\u003c/p\u003e\n\n\u003cp\u003eRevolut said only a limited number of customers were affected and that it notified them directly. Reportedly exposed information included birth dates, contact details, identity-document copies, verification selfies, bank statements, IBANs, withdrawal records, and transaction histories including Bitcoin activity; the perpetrators reportedly demanded payment to avoid releasing data. The incident resembles cases in 2021 and 2022 involving compromised law-enforcement accounts or forged emergency requests, while an FBI alert has warned that access to compromised email accounts is being offered to facilitate such requests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Revolut said an unauthorized party used a legitimate government agency email domain to submit fraudulent emergency requests for customer information.","The company said only a limited number of customers were affected, that it notified them directly, and that it blocked the email address after detecting the activity.","Affected customers' exposed information reportedly included dates of birth, contact details, passport and driver's license copies, verification selfies, bank statements, IBANs, withdrawal records, and transaction histories including Bitcoin activity.","The perpetrators reportedly sought an extortion payment from Revolut to prevent customer data from being released.","The FBI has warned that compromised email accounts are being offered on criminal forums for sending fraudulent emergency data requests."],"insights":["The fraud succeeded because the requests came from a legitimate government agency email domain, illustrating that an apparently official sender address can be misused when the underlying account or domain access is compromised.","The reported data set was extensive enough to combine identity verification material, banking details, and cryptocurrency transaction information for the same affected customers.","The incident follows similar 2021 and 2022 cases in which people linked to Lapsus$ used compromised law-enforcement accounts and forged emergency requests to obtain data from major technology companies.","The FBI had already warned of an increase in criminal-forum posts offering access to compromised email accounts for sending fraudulent emergency data requests."],"referencedReports":[{"title":"FBI alert on fraudulent emergency data requests","url":"https://www.ic3.gov/CSA/2024/241104.pdf","publisher":"fbi","context":"The article cites an FBI alert warning of increased criminal-forum offers for compromised email accounts that can be used to send fraudulent emergency data requests.","category":"advisory","primary":false}],"body":"\u003cp\u003eRevolut said it disclosed sensitive customer data after an unauthorized party used a legitimate government agency email domain to submit fraudulent emergency information requests. The company described the activity as a sophisticated external impersonation scam and said it blocked the address after detection. Revolut also said it alerted the relevant government agency, law-enforcement bodies, data-protection authorities, and financial regulators.\u003c/p\u003e\n\n\u003cp\u003eRevolut said only a limited number of customers were affected and that it notified them directly. Reportedly exposed information included birth dates, contact details, identity-document copies, verification selfies, bank statements, IBANs, withdrawal records, and transaction histories including Bitcoin activity; the perpetrators reportedly demanded payment to avoid releasing data. The incident resembles cases in 2021 and 2022 involving compromised law-enforcement accounts or forged emergency requests, while an FBI alert has warned that access to compromised email accounts is being offered to facilitate such requests.\u003c/p\u003e\n"},{"n":4,"title":"Your Own Mailing List Signed the Phishing Email","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/own-google-group-resigned-inbound-forgery-internal-fanout-dmarc-fail","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email authenticated by a legitimate external provider was accepted by an externally open Google Workspace accounting group, which redistributed and DKIM-signed it internally to four recipients. Restrict external posting to internal distribution groups and investigate cases where your own domain signs a message whose visible From address is external.","briefOverview":"\u003cp\u003eAn externally authenticated phishing email was sent to a regional equipment rental company’s accounting distribution group in Google Workspace, which redistributed it to four accounting mailboxes in the same second. The message presented a shared-spreadsheet lure with a single button and displayed the accounting list’s own address as the person sharing the file. No compromised employee mailbox was required; the group’s ability to accept external posts enabled the internal fan-out.\u003c/p\u003e\n\n\u003cp\u003eGoogle Groups rewrote the envelope sender, applied a DKIM signature using the recipient company’s domain, sealed upstream authentication information in ARC, and appended a list footer that caused its own DKIM signature to fail at delivery. The resulting SPF pass, DKIM fail, DMARC fail, and ARC pass combination resembled ordinary mailing-list forwarding, even though the message had entered from outside the organization. The button redirected through a shared marketing click tracker to a compromised WordPress path on a real manufacturer’s website, while the article states that the consumer ISP, tracker, Google Workspace tenant, and manufacturer site were not attacker-owned. The recommended remediation is to restrict external posting to distribution groups that do not need it and to scrutinize messages signed by the recipient’s own domain when their visible From address is external.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An externally authenticated phishing email was accepted by a regional equipment rental company’s Google Workspace accounting group and redistributed to four accounting mailboxes in the same second.","Google Groups rewrote the message envelope, applied a DKIM signature for the recipient company’s domain, added an ARC chain, and appended a list footer that caused its own DKIM signature to fail at delivery.","The email’s button redirected through a shared marketing-platform click tracker to a compromised WordPress administrative path on a real manufacturing business’s website.","The article states that neither the consumer ISP used for sending, the marketing click tracker, the recipient’s Google Workspace tenant, nor the compromised manufacturer website belonged to the attacker.","The recommended remediation is to restrict external posting to distribution groups that do not need to receive email from outside the organization."],"insights":["A combination of SPF pass, DKIM fail, DMARC fail, and ARC pass can be normal mailing-list behavior, but it becomes suspicious when the recipient organization’s own domain signs a message whose visible From address is external.","The attacker did not need a compromised employee mailbox to reach four accounting recipients; an externally open internal group provided the fan-out mechanism.","Infrastructure-based reputation was less useful because the sender, click tracker, and compromised destination were legitimate third-party services rather than attacker-owned assets.","Both relevant domains used DMARC monitor-only policies, so authentication failures were logged but were not configured to trigger rejection.","The article attributes the phishing verdict primarily to language, sender inconsistencies, and community evidence from similar messages seen in other organizations, rather than to a single authentication or reputation signal."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for its figures that phishing accounted for 16% of breaches as an initial access vector and that the human element appeared in 62% overall.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA's guidance when emphasizing that the phishing lure is central to the control problem.","category":"guide","primary":false}],"body":"\u003cp\u003eAn externally authenticated phishing email was sent to a regional equipment rental company’s accounting distribution group in Google Workspace, which redistributed it to four accounting mailboxes in the same second. The message presented a shared-spreadsheet lure with a single button and displayed the accounting list’s own address as the person sharing the file. No compromised employee mailbox was required; the group’s ability to accept external posts enabled the internal fan-out.\u003c/p\u003e\n\n\u003cp\u003eGoogle Groups rewrote the envelope sender, applied a DKIM signature using the recipient company’s domain, sealed upstream authentication information in ARC, and appended a list footer that caused its own DKIM signature to fail at delivery. The resulting SPF pass, DKIM fail, DMARC fail, and ARC pass combination resembled ordinary mailing-list forwarding, even though the message had entered from outside the organization. The button redirected through a shared marketing click tracker to a compromised WordPress path on a real manufacturer’s website, while the article states that the consumer ISP, tracker, Google Workspace tenant, and manufacturer site were not attacker-owned. The recommended remediation is to restrict external posting to distribution groups that do not need it and to scrutinize messages signed by the recipient’s own domain when their visible From address is external.\u003c/p\u003e\n"},{"n":5,"title":"14th September – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/14th-september-threat-intelligence-report/","time":"12:22","priority":"MAY READ","score":40,"tldr":"Check Point’s September 14 threat intelligence roundup highlights major data breaches, AI security risks, and critical vulnerabilities affecting Microsoft, GitLab, MikroTik, and Metabase. Organizations should prioritize patching actively exploitable and high-severity flaws while strengthening identity and GenAI security controls.","briefOverview":"\u003cp\u003eCheck Point’s September 14 threat intelligence report summarizes recent data breaches, AI security findings, software vulnerabilities, and threat research. IDScan.net disclosed unauthorized access exposing names and government identification numbers, Mathspace reported a breach affecting more than 1 million people, and Revolut exposed sensitive customer data after employees acted on fraudulent requests from a legitimate government email domain. Florida’s Department of Motor Vehicles was also breached after criminals used credentials stolen from a police officer’s personal device to access driver records.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI risks including PuzzleMask, which concealed prohibited instructions from lightweight AI safety checks while stronger models recovered the hidden content in more than 90 percent of tests. It also describes a ChatGPT code-execution proof of concept that used a shared conversation to retrieve Gmail data from one account and send it to another, as well as Anthropic incidents where Claude accessed the internet because of configuration failures. On the patching side, Microsoft addressed 974 vulnerabilities including two exploited zero-days, GitLab fixed a critical unauthenticated file-reading flaw, and MikroTik fixed two RouterOS flaws that can be chained for passwordless SSH access and full administrator privileges.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["IDScan.net disclosed unauthorized access detected on September 1 that exposed names and government identification numbers, while a criminal marketplace advertised millions of identity documents associated with its verification services.","Mathspace reported a breach affecting more than 1 million people after attackers exploited CVE-2026-72898 in self-hosted Metabase to access an internal reporting database.","Check Point Research described PuzzleMask, a plain-language prompt technique that concealed prohibited instructions from lightweight AI safety checks while stronger target models recovered the hidden requests in more than 90 percent of trials.","Microsoft’s September 2026 Patch Tuesday addressed 974 vulnerabilities, including two actively exploited flaws that allow local attackers to gain SYSTEM-level privileges.","GitLab fixed CVE-2026-85706, a critical vulnerability that allows unauthenticated attackers to read arbitrary files through the repository commits API in affected Community and Enterprise Edition versions."],"insights":["A legitimate government email domain was sufficient for Revolut employees to fulfill fraudulent data requests, resulting in exposure of identity documents, transaction histories, and other sensitive customer records.","Florida DMV driver records were accessed using credentials stolen from a police officer’s personal device, showing that compromise of an individual account enabled access to a state system.","PuzzleMask testing found that lightweight AI safety checks classified concealed prompts as safe while stronger models recovered and acted on the hidden instructions in more than 90% of trials.","The MikroTik flaws can be chained to provide passwordless SSH access and then full administrator privileges on exposed routers.","The BlueMoon exploit chain combined browser flaws with a Windows flaw, allowing attackers to move from browser compromise to escaping browser protections and increasing privileges on vulnerable Windows devices."],"referencedReports":[{"title":"Alignment Assessment: Cybersecurity Incidents","url":"https://www.anthropic.com/research/alignment-assessment-cybersecurity-incidents","publisher":"anthropic","context":"The article cites Anthropic’s disclosure of four incidents in which Claude models accessed the real internet because of configuration failures.","category":"research","primary":false},{"title":"Passkey-Themed Social Engineering Leads to Identity and Cloud Compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/09/09/passkey-themed-social-engineering-leads-identity-cloud-compromise/","publisher":"microsoft","context":"The article references Microsoft researchers’ analysis of a passkey-themed social engineering campaign targeting Microsoft 365 accounts.","category":"research","primary":false},{"title":"Vwork App Cloning: Gigabud and GoldFactory","url":"https://www.group-ib.com/blog/vwork-app-cloning-gigabud-goldfactory/","publisher":"group-ib","context":"The article cites Group-IB researchers’ analysis of GoldFactory’s use of Vwork to clone Android banking applications and deploy Gigabud malware.","category":"research","primary":false},{"title":"Once in a BlueMoon: Multiple State-Aligned Threat Actors Rapidly Adopt Novel Exploit","url":"https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit","publisher":"proofpoint","context":"The article references Proofpoint researchers’ technical analysis of the BlueMoon exploit chain affecting Chromium and Windows.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point’s September 14 threat intelligence report summarizes recent data breaches, AI security findings, software vulnerabilities, and threat research. IDScan.net disclosed unauthorized access exposing names and government identification numbers, Mathspace reported a breach affecting more than 1 million people, and Revolut exposed sensitive customer data after employees acted on fraudulent requests from a legitimate government email domain. Florida’s Department of Motor Vehicles was also breached after criminals used credentials stolen from a police officer’s personal device to access driver records.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights AI risks including PuzzleMask, which concealed prohibited instructions from lightweight AI safety checks while stronger models recovered the hidden content in more than 90 percent of tests. It also describes a ChatGPT code-execution proof of concept that used a shared conversation to retrieve Gmail data from one account and send it to another, as well as Anthropic incidents where Claude accessed the internet because of configuration failures. On the patching side, Microsoft addressed 974 vulnerabilities including two exploited zero-days, GitLab fixed a critical unauthenticated file-reading flaw, and MikroTik fixed two RouterOS flaws that can be chained for passwordless SSH access and full administrator privileges.\u003c/p\u003e\n"},{"n":3,"title":"AI Changed the Exposure Problem. Validation Needs to Change With It.","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/ai-changed-exposure-problem-validation.html","time":"11:58","priority":"MAY READ","score":28,"tldr":"AI is dramatically increasing vulnerability discovery, making CVSS-only prioritization inadequate; organizations need evidence-based validation of exploitability, control effectiveness, and attack paths to focus remediation on exposures that truly matter.","briefOverview":"\u003cp\u003eAI is increasing the speed and scale of vulnerability discovery, while security teams still must determine which findings require immediate action. The article cites 35,853 CVEs published in the first half of 2026, with 495 catalogued as exploited in the wild and 116 already under attack on their disclosure day. It argues that treating every High or Critical CVSS finding as an emergency is impractical because severity scores do not capture an organization’s specific conditions.\u003c/p\u003e\n\n\u003cp\u003eThe same CVE can have different consequences across assets depending on reachability, existing controls, and the business importance of the affected system. The article says validation should combine exploitability checks, tests of whether security controls prevent or detect attacks, and agentic penetration testing that can safely run exploits and trace possible paths through an environment. Picus Security promotes this combined validation model and says its October 14–15 Validation Summit ’26 will demonstrate the workflow using a newly disclosed vulnerability, with speakers and enterprise participants from Chanel, Atlassian, and the NFL.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["In the first half of 2026, 35,853 CVEs were published, roughly 49% more than in the previous year, while 495 were catalogued as exploited in the wild.","CVSS provides a common severity baseline but cannot determine whether a vulnerability is exploitable, reachable, or business-critical in a specific organization’s environment.","Omdia research found that 95% of organizations rank penetration testing as a top or high priority, but only 32% of their average attack surface is tested each year.","The article says automated penetration testing cannot validate every exposure because newly disclosed CVEs may lack a working exploit and live testing may be unsafe or impossible on critical, restricted, or air-gapped assets.","Picus argues that exploitability validation, security control validation, and agentic penetration testing should be combined to prioritize remediation and revalidate fixes."],"insights":["The article highlights that 116 vulnerabilities were already being attacked on the day they became public, showing that defenders may have little time to decide which newly disclosed issues require action.","Anthropic’s disclosure data cited in the article shows a large gap between 26,153 AI-found vulnerability candidates and 421 issues patched upstream, underscoring that discovery volume does not directly translate into confirmed, remediated risk.","A single vulnerability can require different treatment on different systems because reachability, existing safeguards, and business importance can change its real-world impact.","The article’s proposed workflow makes remediation priority change as new evidence arrives, and it calls for fixes to be tested again rather than treated as resolved when a ticket is closed."],"referencedReports":[{"title":"AI Pentesting Report","url":"https://go.synack.com/ai-pentesting-report-omdia","publisher":"omdia","context":"The article cites Omdia research finding that organizations test only 32% of their average attack surface annually despite pentesting being a high priority for most respondents.","category":"research","primary":false},{"title":"Gartner May Research Note","url":"https://www.gartner.com/en/documents/7851581","publisher":"gartner","context":"The article references Gartner’s May research note as supporting integrated validated attack paths, decision-driven response, and exposure reduction workflows.","category":"research","primary":false}],"body":"\u003cp\u003eAI is increasing the speed and scale of vulnerability discovery, while security teams still must determine which findings require immediate action. The article cites 35,853 CVEs published in the first half of 2026, with 495 catalogued as exploited in the wild and 116 already under attack on their disclosure day. It argues that treating every High or Critical CVSS finding as an emergency is impractical because severity scores do not capture an organization’s specific conditions.\u003c/p\u003e\n\n\u003cp\u003eThe same CVE can have different consequences across assets depending on reachability, existing controls, and the business importance of the affected system. The article says validation should combine exploitability checks, tests of whether security controls prevent or detect attacks, and agentic penetration testing that can safely run exploits and trace possible paths through an environment. Picus Security promotes this combined validation model and says its October 14–15 Validation Summit ’26 will demonstrate the workflow using a newly disclosed vulnerability, with speakers and enterprise participants from Chanel, Atlassian, and the NFL.\u003c/p\u003e\n"},{"n":1,"title":"Webinar: How malicious OAuth apps can lead to Google Workspace breaches","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/webinar-how-malicious-oauth-apps-can-lead-to-google-workspace-breaches/","time":"12:15","priority":"MAY READ","score":25,"tldr":"BleepingComputer and Material Security will host a September 23 webinar examining how attackers use social engineering to trick Google Workspace users into authorizing malicious OAuth apps, gaining access without stealing passwords. The session will cover real breach scenarios, early incident-response decisions, and practical controls to limit third-party app access.","briefOverview":"\u003cp\u003eBleepingComputer will host a live webinar with Material Security on September 23, 2026, titled “Breach autopsy: How fast-growing companies are breached through Google Workspace.” Material Security Vice President of Security Rajan Kapoor and Fireside Consulting LLC President Rick Fitzgerald will examine two attacks involving malicious OAuth applications and social engineering. The session will cover how the incidents unfolded, the weaknesses that enabled them, and decisions made during the first hours of the breaches.\u003c/p\u003e\n\n\u003cp\u003eOAuth allows users to let applications access Google Workspace data and services without giving those applications their passwords. Attackers can abuse this process by persuading users to authorize malicious apps, with the resulting access determined by the permissions the user approves. The webinar will discuss visibility into third-party app access, high-value security controls for fast-growing organizations, and practical improvements ranked by effort and potential impact.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BleepingComputer will host a live webinar with Material Security on September 23, 2026, about Google Workspace breaches involving malicious OAuth applications.","The webinar will feature Material Security Vice President of Security Rajan Kapoor and Fireside Consulting LLC President Rick Fitzgerald examining two attacks that used malicious OAuth apps and social engineering.","OAuth lets users grant applications access to Google Workspace data and services without sharing their passwords, but attackers can abuse this process by persuading users to approve malicious applications.","The access attackers obtain depends on the permissions a user grants to a malicious app, making visibility into third-party applications important for organizations.","The webinar will discuss the first hours of a Google Workspace breach, response decisions, and security improvements ranked by effort and potential impact."],"insights":["An organization can be exposed even when passwords are not stolen, because a user’s approval of a malicious app can grant access to Google Workspace data and services.","The impact of a malicious app is tied to the specific permissions a user approves, making oversight of third-party application access a practical way to reduce exposure.","For fast-growing companies with limited security resources, the webinar emphasizes prioritizing improvements by the effort required and their potential security impact."],"referencedReports":[],"body":"\u003cp\u003eBleepingComputer will host a live webinar with Material Security on September 23, 2026, titled “Breach autopsy: How fast-growing companies are breached through Google Workspace.” Material Security Vice President of Security Rajan Kapoor and Fireside Consulting LLC President Rick Fitzgerald will examine two attacks involving malicious OAuth applications and social engineering. The session will cover how the incidents unfolded, the weaknesses that enabled them, and decisions made during the first hours of the breaches.\u003c/p\u003e\n\n\u003cp\u003eOAuth allows users to let applications access Google Workspace data and services without giving those applications their passwords. Attackers can abuse this process by persuading users to authorize malicious apps, with the resulting access determined by the permissions the user approves. The webinar will discuss visibility into third-party app access, high-value security controls for fast-growing organizations, and practical improvements ranked by effort and potential impact.\u003c/p\u003e\n"}]</script>
