confidence behind its findings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mitiga says HeliosAI Investigation is a new capability in the HeliosAI Agent and is generally available to all Mitiga customers.","HeliosAI Investigation is designed to guide Tier 2 and Tier 3 analysts through cross-cloud and SaaS investigations by surfacing leads, connecting identity activity across services, checking behavior against baselines, and showing evidence and confidence behind each verdict.","The article says HeliosAI Investigation works across AWS, GCP, Azure, Microsoft 365, Okta, and SaaS applications as one continuous investigation.","Mitiga’s latest HeliosAI Agent release also adds natural-language log search for plain-English log queries and AI Summary for Workbench Events to summarize groups of forensic events into a narrative.","Mitiga states the HeliosAI Agent is built on its full-fidelity, normalized Cloud Security Data Lake, which it says already cuts alert triage time by 90%."],"insights":["Mitiga frames data normalization as a trust requirement for AI-assisted investigations, arguing that unstructured or uncorrelated telemetry gives a model more room to produce confident but unsupported conclusions.","The product’s emphasis on showing what raised or lowered confidence suggests Mitiga is positioning explainability as a core requirement for analysts deciding whether to escalate serious cross-cloud incidents.","Mitiga separates guided investigation from natural-language log search, indicating that it sees two distinct analyst needs: help discovering the next question and fast access to raw data when the question is already known.","The article positions HeliosAI Investigation as an extension from alert triage into full investigation, meaning Mitiga is trying to move AI support deeper into the incident response workflow rather than limiting it to initial alert handling."],"referencedReports":[{"title":"State of Security","url":"https:
