<script type="application/json" id="dl-articles">[{"n":4,"title":"Hackers exploit critical auth bypass in Gitea Docker image","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-auth-bypass-in-gitea-docker-image/","time":"15:48","priority":"MUST READ","score":95,"tldr":"Hackers are actively exploiting CVE-2026-20896, a critical authentication bypass in default Gitea Docker images that lets unauthenticated attackers impersonate any user, including admins, by sending a trusted reverse-proxy header. Gitea users should upgrade to version 1.26.4 or restrict REVERSE_PROXY_TRUSTED_PROXIES to trusted IPs and review logs for compromise.","briefOverview":"\u003cp\u003eHackers are actively exploiting CVE-2026-20896, a critical authentication bypass vulnerability in the official Docker image for the Gitea self-hosted Git service. The flaw allows attackers to impersonate any user, including administrators. Michael Clark, leading security researcher at Sysdig, said exploitation began less than two weeks before the vulnerability was publicly disclosed.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects deployments using the default configuration, where reverse proxy authentication headers such as X-WEBAUTH-USER are enabled. Gitea’s official Docker image shipped with \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES=*\u003c/code\u003e, causing Gitea to trust the X-WEBAUTH-USER header from any source IP. According to Clark, an unauthenticated internet client can become whoever it claims to be with one header and without a password or token.\u003c/p\u003e\n\n\u003cp\u003eThe critical bug affects official Gitea Docker images up to and including version 1.26.2 in the default configuration. Gitea released versions 1.26.3 and 1.26.4 to address the issue and advised users to upgrade straight to the most recent release. Singapore’s cybersecurity agency also warned that the flaw is actively exploited and recommended restricting \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES\u003c/code\u003e to specific trusted IP addresses if upgrading is not possible, as well as reviewing access logs for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers are actively exploiting CVE-2026-20896, a critical authentication bypass vulnerability in the official Docker image for the Gitea self-hosted Git service.","The flaw affects official Gitea Docker images up to and including version 1.26.2 in the default configuration, where reverse proxy authentication headers such as X-WEBAUTH-USER are enabled.","Because the official Docker image ships with REVERSE_PROXY_TRUSTED_PROXIES=* , Gitea can trust the X-WEBAUTH-USER header from any source IP and allow an unauthenticated client to impersonate any user, including administrators.","Gitea released versions 1.26.3 and 1.26.4 to address CVE-2026-20896 and advised users to upgrade directly to the most recent release.","Singapore’s cybersecurity agency warned that CVE-2026-20896 is actively exploited and recommended restricting REVERSE_PROXY_TRUSTED_PROXIES to specific trusted IP addresses if upgrading is not possible."],"insights":["The maintainer warned that the risk is not limited to public internet exposure: any process that can reach the Gitea container’s HTTP port directly, instead of through the intended authenticating proxy, can impersonate users.","Attackers do not need credentials or tokens; knowing or guessing a login name is enough, making common administrator names such as admin or gitea_admin especially exposed targets.","Gitea advised users to upgrade straight to the newest release rather than stopping at version 1.26.3 because version 1.26.4 fixes an additional issue and a regression introduced in 1.26.3.","There are about 6,200 Gitea instances exposed on the public web, but the article says it is unclear how many are actually vulnerable, making exposure assessment an immediate priority."],"referencedReports":[{"title":"Gitea Security Advisory GHSA-f75j-4cw6-rmx4","url":"https://github.com/go-gitea/gitea/security/advisories/GHSA-f75j-4cw6-rmx4","publisher":"Gitea","context":"The article cites this security advisory for details on CVE-2026-20896, including affected Gitea Docker image versions and reproduction guidance.","category":"","primary":false},{"title":"CSA Alert AL-2026-083","url":"http://www.csa.gov.sg/alerts-and-advisories/alerts/al-2026-083/","publisher":"Cyber Security Agency of Singapore","context":"The article references this alert as a warning that CVE-2026-20896 is being actively exploited and as a source of mitigation guidance.","category":"","primary":false}],"body":"\u003cp\u003eHackers are actively exploiting CVE-2026-20896, a critical authentication bypass vulnerability in the official Docker image for the Gitea self-hosted Git service. The flaw allows attackers to impersonate any user, including administrators. Michael Clark, leading security researcher at Sysdig, said exploitation began less than two weeks before the vulnerability was publicly disclosed.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects deployments using the default configuration, where reverse proxy authentication headers such as X-WEBAUTH-USER are enabled. Gitea’s official Docker image shipped with \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES=*\u003c/code\u003e, causing Gitea to trust the X-WEBAUTH-USER header from any source IP. According to Clark, an unauthenticated internet client can become whoever it claims to be with one header and without a password or token.\u003c/p\u003e\n\n\u003cp\u003eThe critical bug affects official Gitea Docker images up to and including version 1.26.2 in the default configuration. Gitea released versions 1.26.3 and 1.26.4 to address the issue and advised users to upgrade straight to the most recent release. Singapore’s cybersecurity agency also warned that the flaw is actively exploited and recommended restricting \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES\u003c/code\u003e to specific trusted IP addresses if upgrading is not possible, as well as reviewing access logs for suspicious activity.\u003c/p\u003e\n"},{"n":8,"title":"Police suspects Dutch hackers were involved in Odido breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/police-suspects-dutch-hackers-were-involved-in-odido-breach/","time":"16:37","priority":"MUST READ","score":92,"tldr":"Dutch police say they have strong indications that Dutch hackers were involved in Odido’s February breach, including a Dutch-language vishing call impersonating IT support before phishing led to data theft. The breach exposed personal data of millions of customers and was claimed by the ShinyHunters extortion gang.","briefOverview":"\u003cp\u003eThe Dutch National Police said it has found strong indications that Dutch hackers were involved in a February breach at telecommunications provider Odido. Police cited a phone call made to Odido customer service shortly before the hack, in which a Dutch-speaking man posed as an Odido IT employee. The company was then misled through phishing, after which the data theft took place.\u003c/p\u003e\n\n\u003cp\u003eOdido disclosed the breach on February 12 and said attackers accessed its customer contact system on February 7. The company told local media that the breach affected 6.2 million customers and that the attackers said they had stolen millions of user records. Exposed information varied by customer and could include names, addresses, mobile numbers, customer numbers, email addresses, IBANs, dates of birth, and some passport or driver’s license details.\u003c/p\u003e\n\n\u003cp\u003eOdido said no call details, location data, billing data, identity document scans, or Mijn Odido passwords were exposed. The ShinyHunters extortion gang claimed responsibility for the breach and released an 88GB archive containing over 15 million records on its dark web leak site. The article also notes that ShinyHunters has been tied to vishing campaigns impersonating IT support staff and to breaches involving multiple major organizations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Dutch National Police said it found strong indications that Dutch hackers were involved in the February breach at telecommunications provider Odido.","Police said a Dutch-speaking man posed as an Odido IT employee in a phone call with Odido customer service shortly before the hack, after which phishing misled the company and data theft occurred.","Odido disclosed on February 12 that attackers accessed its customer contact system on February 7 and downloaded personal data affecting 6.2 million customers.","The exposed information may include names, addresses, mobile numbers, customer numbers, email addresses, IBANs, dates of birth, and some passport or driver’s license details, depending on the customer.","The ShinyHunters extortion gang claimed responsibility for the breach and released an 88GB archive containing over 15 million records on its dark web leak site."],"insights":["The reported Dutch-language impersonation call suggests the Odido breach was not only a remote technical intrusion but involved social engineering tailored to the company’s local language and support processes.","The police statement indicates investigators collected traces at multiple points during the Odido investigation, showing that even complex cybercrime cases can leave recoverable evidence over time.","Although ShinyHunters claimed the breach, Dutch police still see strong indications of Dutch hackers’ involvement, highlighting that responsibility for a data theft may involve both an extortion group and locally connected participants.","Odido’s statement that passwords, call details, location data, billing data, and identity document scans were not exposed narrows the confirmed impact while still leaving customers exposed through stolen personal and bank account information."],"referencedReports":[],"body":"\u003cp\u003eThe Dutch National Police said it has found strong indications that Dutch hackers were involved in a February breach at telecommunications provider Odido. Police cited a phone call made to Odido customer service shortly before the hack, in which a Dutch-speaking man posed as an Odido IT employee. The company was then misled through phishing, after which the data theft took place.\u003c/p\u003e\n\n\u003cp\u003eOdido disclosed the breach on February 12 and said attackers accessed its customer contact system on February 7. The company told local media that the breach affected 6.2 million customers and that the attackers said they had stolen millions of user records. Exposed information varied by customer and could include names, addresses, mobile numbers, customer numbers, email addresses, IBANs, dates of birth, and some passport or driver’s license details.\u003c/p\u003e\n\n\u003cp\u003eOdido said no call details, location data, billing data, identity document scans, or Mijn Odido passwords were exposed. The ShinyHunters extortion gang claimed responsibility for the breach and released an 88GB archive containing over 15 million records on its dark web leak site. The article also notes that ShinyHunters has been tied to vishing campaigns impersonating IT support staff and to breaches involving multiple major organizations.\u003c/p\u003e\n"},{"n":9,"title":"Zimbra urges customers to patch critical web client XSS flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/zimbra-urges-customers-to-patch-critical-web-client-xss-flaw/","time":"11:47","priority":"MUST READ","score":92,"tldr":"Zimbra is urging customers using the Classic Web Client to upgrade to ZCS 10.1.19 to fix a critical stored XSS flaw that can be triggered by malicious emails and expose session or mailbox data. The bug was reported by Google’s Threat Analysis Group, raising concern because Zimbra flaws have repeatedly been targeted by state-backed hackers.","briefOverview":"\u003cp\u003eZimbra urged customers to patch a critical vulnerability affecting the Classic Web Client used to access the Zimbra Collaboration suite. The company released Zimbra 10.1.19 to fix a stored cross-site scripting flaw that has not yet received a CVE ID. Zimbra said any customer using the Classic Web Client should upgrade to ZCS v10.1.19 as soon as possible because the issue only impacts users of that client.\u003c/p\u003e\n\n\u003cp\u003eAttackers can exploit the flaw through specially crafted emails that execute malicious code when opened. Successful exploitation could allow threat actors to steal session data, account settings, or mailbox information. Zimbra has not tagged the vulnerability as exploited in the wild, but it was reported by Google’s Threat Analysis Group.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Zimbra security issues have frequently been exploited in recent years by Russian state-sponsored hackers. It cites prior activity involving Winter Vivern, APT29, and APT28 targeting Zimbra servers or flaws, including attacks against NATO-aligned organizations, vulnerable servers at mass scale, and Ukrainian government entities. It also notes that Shadowserver warned in April that more than 10,500 Zimbra Collaboration Suite instances exposed online remained vulnerable to ongoing attacks exploiting another XSS flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zimbra released Zimbra 10.1.19 to patch a critical stored cross-site scripting flaw affecting the Classic Web Client used to access the Zimbra Collaboration suite.","Attackers can exploit the flaw through specially crafted emails that execute malicious code when opened, potentially enabling theft of session data, account settings, or mailbox information.","Zimbra said the issue only impacts users of the Classic Web Client and urged those customers to upgrade to ZCS v10.1.19 as soon as possible.","The vulnerability has not yet received a CVE ID, and Zimbra has not said it is being exploited in the wild.","The flaw was reported by Google's Threat Analysis Group, and the article notes that Zimbra security issues have frequently been exploited by Russian state-sponsored hackers in recent years."],"insights":["The flaw has not yet received a CVE ID, so teams may need to track remediation by the ZCS 10.1.19 release rather than by a standard vulnerability identifier.","The issue affects only the Classic Web Client, which the article notes is still used because it is faster than Zimbra’s modern web client when loading large email folders.","Google’s Threat Analysis Group reported the flaw, which is notable because the group often identifies zero-day exploits used by state-backed hackers against high-risk individuals.","Zimbra servers have a recent history of being targeted by multiple Russian-linked groups, including Winter Vivern, APT29, and APT28, making prompt patching especially actionable for exposed environments."],"referencedReports":[{"title":"Patch Release Update: Zimbra 10.1.19","url":"https://blog.zimbra.com/2026/07/patch-release-update-zimbra-10-1-19/","publisher":"Zimbra","context":"The article cites Zimbra’s patch release notice warning Classic Web Client users to upgrade to ZCS v10.1.19 to address the flaw.","category":"","primary":false}],"body":"\u003cp\u003eZimbra urged customers to patch a critical vulnerability affecting the Classic Web Client used to access the Zimbra Collaboration suite. The company released Zimbra 10.1.19 to fix a stored cross-site scripting flaw that has not yet received a CVE ID. Zimbra said any customer using the Classic Web Client should upgrade to ZCS v10.1.19 as soon as possible because the issue only impacts users of that client.\u003c/p\u003e\n\n\u003cp\u003eAttackers can exploit the flaw through specially crafted emails that execute malicious code when opened. Successful exploitation could allow threat actors to steal session data, account settings, or mailbox information. Zimbra has not tagged the vulnerability as exploited in the wild, but it was reported by Google’s Threat Analysis Group.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Zimbra security issues have frequently been exploited in recent years by Russian state-sponsored hackers. It cites prior activity involving Winter Vivern, APT29, and APT28 targeting Zimbra servers or flaws, including attacks against NATO-aligned organizations, vulnerable servers at mass scale, and Ukrainian government entities. It also notes that Shadowserver warned in April that more than 10,500 Zimbra Collaboration Suite instances exposed online remained vulnerable to ongoing attacks exploiting another XSS flaw.\u003c/p\u003e\n"},{"n":18,"title":"Attackers Exploit 'Ill Bloom' Vulnerability to Drain $3.1 Million From Cryptocurrency Wallets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/attackers-exploit-ill-bloom.html","time":"09:00","priority":"MUST READ","score":92,"tldr":"Coinspect says attackers exploited the “Ill Bloom” weak-randomness flaw in some older or lesser-known crypto wallets to drain about $3.1 million from 431 wallets, with more funds potentially exposed. Users should check public addresses at illbloom.org and, if matched, move funds to a brand-new wallet with a freshly generated recovery phrase.","briefOverview":"\u003cp\u003eCoinspect disclosed a crypto wallet flaw called Ill Bloom that attackers are already using to steal funds. The flaw is in how some wallet software generated recovery phrases, which are the words that control the money in a self-custody wallet. Coinspect confirmed a coordinated May 27 sweep that drained about \u003cspan class=\"math inline\"\u003e\\(3.1 million from 431 wallets, and it says roughly \\)\u003c/span\u003e2 million more has moved from exposed wallets since then.\u003c/p\u003e\n\n\u003cp\u003eThe affected wallets used weak randomness when creating recovery phrases, shrinking the possible phrase pool enough for attackers to search. Coinspect rebuilt the attack by generating the phrases the weak generator could produce, deriving the wallet addresses, and checking public blockchain records for addresses still holding funds. As of June 30, it had traced 2,114 exposed addresses with on-chain activity across Bitcoin, Ethereum, Rootstock, Tron, and Polygon.\u003c/p\u003e\n\n\u003cp\u003eCoinspect says hardware wallets are not affected and most mainstream software wallets are not either, with the main risk in older or lesser-known mobile wallets, some dating back to 2018. Users can check public wallet addresses at illbloom.org, but a clean result is not a guarantee because the list is incomplete. If an address matches, Coinspect advises treating the recovery phrase as compromised, creating a brand-new wallet with a brand-new phrase, and moving funds there.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Coinspect disclosed a crypto wallet flaw called Ill Bloom, where some wallet software generated recovery phrases with weak randomness that attackers could work out.","Coinspect confirmed a coordinated sweep on May 27 that drained about $3.1 million from 431 wallets, with roughly $2 million more moving from exposed wallets since then.","Coinspect says wallets created on hardware devices are not affected, and most mainstream software wallets are not affected, while the real risk is with older or lesser-known mobile wallets, some dating back to 2018.","The affected weak phrases can expose funds across every chain they control, including Bitcoin, Ethereum, Rootstock, Tron, and Polygon addresses traced by Coinspect.","Coinspect advises users to check public wallet addresses at illbloom.org and, if there is a match, create a brand-new wallet with a brand-new recovery phrase and move funds there."],"insights":["A clean result from the Ill Bloom checker is not a guarantee of safety because Coinspect says its list of known-vulnerable wallets is incomplete.","Reinstalling the old wallet app or importing the same recovery phrase into another app does not fix the problem, because the weakness is baked into the phrase itself.","One weak recovery phrase can expose funds across every blockchain address it controls, so users need to check every address tied to the same seed rather than only addresses that were already drained.","Coinspect has not named the affected apps because a public wallet address does not reveal which app created it, so matched users are being asked to report what they used to help identify vendors.","A real Ill Bloom checker does not need recovery phrases, private keys, signatures, approvals, or payments, so any service asking for those is inconsistent with Coinspect’s warning."],"referencedReports":[],"body":"\u003cp\u003eCoinspect disclosed a crypto wallet flaw called Ill Bloom that attackers are already using to steal funds. The flaw is in how some wallet software generated recovery phrases, which are the words that control the money in a self-custody wallet. Coinspect confirmed a coordinated May 27 sweep that drained about \u003cspan class=\"math inline\"\u003e\\(3.1 million from 431 wallets, and it says roughly \\)\u003c/span\u003e2 million more has moved from exposed wallets since then.\u003c/p\u003e\n\n\u003cp\u003eThe affected wallets used weak randomness when creating recovery phrases, shrinking the possible phrase pool enough for attackers to search. Coinspect rebuilt the attack by generating the phrases the weak generator could produce, deriving the wallet addresses, and checking public blockchain records for addresses still holding funds. As of June 30, it had traced 2,114 exposed addresses with on-chain activity across Bitcoin, Ethereum, Rootstock, Tron, and Polygon.\u003c/p\u003e\n\n\u003cp\u003eCoinspect says hardware wallets are not affected and most mainstream software wallets are not either, with the main risk in older or lesser-known mobile wallets, some dating back to 2018. Users can check public wallet addresses at illbloom.org, but a clean result is not a guarantee because the list is incomplete. If an address matches, Coinspect advises treating the recovery phrase as compromised, creating a brand-new wallet with a brand-new phrase, and moving funds there.\u003c/p\u003e\n"},{"n":20,"title":"Hackers Use Fake Microsoft Entra Passkey Enrollment to Gain Microsoft 365 Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/hackers-use-fake-microsoft-entra.html","time":"10:30","priority":"MUST READ","score":92,"tldr":"A threat actor tracked as O-UNC-066 is using vishing and a fake Microsoft Entra passkey enrollment flow to trick Microsoft 365 users into approving access and registering attacker-controlled passkeys on their accounts. The campaign abuses confusion around passkey adoption to enable account takeover and potential data extortion.","briefOverview":"\u003cp\u003eA threat actor tracked by Okta as \u003cstrong\u003eO-UNC-066\u003c/strong\u003e has been targeting organizations in multiple sectors with voice-based fake security requests. The campaign prompts Microsoft 365 users to enroll a new Microsoft Entra passkey, but the process is designed to let the attacker register their own passkey against the victim’s Microsoft account. Okta said the activity has targeted food and beverage, technology, healthcare, automotive, construction, and aviation industries.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses domains containing the word “passkey” and a panel-controlled phishing kit that imitates the Microsoft passkey enrollment process. Attackers call targeted users and persuade them that they need to register a new passkey, while the phishing kit guides the victim through username, password, and multi-factor authentication prompts. The kit is operated in real time and can adapt what the victim sees based on MFA requirements such as SMS one-time passwords, time-based codes, or push notifications with number matching.\u003c/p\u003e\n\n\u003cp\u003eAfter the victim approves the attacker’s access, the kit redirects them to fake passkey registration pages that include a recovery key made of 12 words. Okta assessed that this recovery key step is a distraction to keep the victim occupied while the attacker enrolls their own passkey in the Microsoft account. Okta also noted that a threat actor linked to O-UNC-066 has operated a data leak site called Pink since April 2026, and Palo Alto Networks Unit 42 tracks the cluster as CL-CRI-1147, affiliated with The Com.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Okta is tracking a threat actor as O-UNC-066 that is targeting organizations across food and beverage, technology, healthcare, automotive, construction, and aviation with voice-based fake security requests.","The attackers register domains containing the word “passkey” and call targeted Microsoft 365 users to persuade them that they need to register a new Microsoft Entra passkey.","The phishing kit imitates the Microsoft passkey enrollment process while enabling the threat actor to register an attacker-controlled passkey against the victim’s Microsoft account.","The operator-controlled PHP phishing kit can adapt the victim’s experience in real time to different multi-factor authentication requirements, including SMS one-time passwords, time-based codes, and push notifications with number matching.","Okta said a threat actor linked to O-UNC-066 has operated a data leak site called Pink since April 2026, and Palo Alto Networks Unit 42 tracks the cluster as CL-CRI-1147 affiliated with The Com."],"insights":["The campaign turns Microsoft’s legitimate push for passkey adoption into the lure, making routine security upgrade prompts a potential social-engineering risk for users unfamiliar with passkey enrollment.","The phishing kit does not rely on a static fake login page; an operator can change what the victim sees in real time based on the Microsoft sign-in and multi-factor prompts encountered during the session.","The fake recovery phrase step appears to be a distraction, keeping the victim occupied while the attacker enrolls their own passkey in the real Microsoft account.","Okta observed no indication that the kit redirects users to third-party identity providers like Okta, narrowing the described activity to Microsoft account access flows in this reporting."],"referencedReports":[{"title":"Vishing Actors Target Microsoft Entra Passkey Enrollment","url":"https://www.okta.com/blog/threat-intelligence/vishing-actors-target-microsoft-entra-passkey-enrollment-/","publisher":"Okta","context":"The article is based on Okta research describing O-UNC-066’s vishing campaign and phishing kit targeting Microsoft Entra passkey enrollment.","category":"","primary":false}],"body":"\u003cp\u003eA threat actor tracked by Okta as \u003cstrong\u003eO-UNC-066\u003c/strong\u003e has been targeting organizations in multiple sectors with voice-based fake security requests. The campaign prompts Microsoft 365 users to enroll a new Microsoft Entra passkey, but the process is designed to let the attacker register their own passkey against the victim’s Microsoft account. Okta said the activity has targeted food and beverage, technology, healthcare, automotive, construction, and aviation industries.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses domains containing the word “passkey” and a panel-controlled phishing kit that imitates the Microsoft passkey enrollment process. Attackers call targeted users and persuade them that they need to register a new passkey, while the phishing kit guides the victim through username, password, and multi-factor authentication prompts. The kit is operated in real time and can adapt what the victim sees based on MFA requirements such as SMS one-time passwords, time-based codes, or push notifications with number matching.\u003c/p\u003e\n\n\u003cp\u003eAfter the victim approves the attacker’s access, the kit redirects them to fake passkey registration pages that include a recovery key made of 12 words. Okta assessed that this recovery key step is a distraction to keep the victim occupied while the attacker enrolls their own passkey in the Microsoft account. Okta also noted that a threat actor linked to O-UNC-066 has operated a data leak site called Pink since April 2026, and Palo Alto Networks Unit 42 tracks the cluster as CL-CRI-1147, affiliated with The Com.\u003c/p\u003e\n"},{"n":23,"title":"New MODBEACON RAT Uses gRPC Streaming for Encrypted C2 Traffic","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-modbeacon-rat-uses-grpc-streaming.html","time":"13:15","priority":"MUST READ","score":92,"tldr":"China-linked Silver Fox is using a new Rust-based RAT called MODBEACON, delivered through fake software installers and SEO poisoning, to target organizations in Asia. The malware uses encrypted gRPC streaming via Xray/V2Ray-style transport to maintain stealthy C2 communications and load plugins for further compromise.","briefOverview":"\u003cp\u003eThe China-linked cybercrime group Silver Fox has been attributed to a new Rust-based remote access trojan called MODBEACON. QiAnXin said the group may appear to be a low-sophistication, high-activity operation using counterfeit installers and SEO poisoning, but that this masks a broader structure involving multiple distributors. A mid-June 2026 campaign delivered MODBEACON against technology, education, and state-owned enterprises, with requested command-and-control infrastructure hosted on Amazon and Cloudflare’s CDN.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses counterfeit domains advertising bogus installers for popular domestic software to trick users into downloading malicious ZIP archives. QiAnXin assessed one distributor as a hybrid actor combining roles of a cybercriminal arms dealer and traffic broker, with activity across Asia and schemes involving the Cambodian gambling sector. The malware is designed to establish long-term access while minimizing detection on infected hosts.\u003c/p\u003e\n\n\u003cp\u003eMODBEACON is described as a memory-resident implant that can fetch additional modules, run operator commands, and maintain encrypted communications with attacker infrastructure. QiAnXin said it separates the loader and beacon, supports injectable configuration, uses a plugin-based architecture, and communicates through gRPC tunnel streaming. Its reported capabilities include host fingerprinting, in-memory plugin loading, heartbeat messages, command-execution result reporting, and persistence through scheduled tasks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["QiAnXin attributed a new Rust-based remote access trojan called MODBEACON to the China-linked Silver Fox cybercrime group.","The mid-June 2026 campaign delivered MODBEACON through counterfeit software installers promoted via SEO poisoning and targeted technology, education, and state-owned enterprises.","MODBEACON is a memory-resident implant that can fetch additional modules, run operator commands, and maintain encrypted communications with attacker infrastructure.","QiAnXin said MODBEACON uses a separated loader and beacon, injectable configuration, a plugin-based architecture, and gRPC tunnel streaming reused from the Xray/V2Ray transport layer.","MODBEACON’s reported capabilities include host fingerprinting, in-memory plugin loading, heartbeat messages, command-result reporting, and scheduled-task persistence."],"insights":["Silver Fox’s apparent low-sophistication SEO-poisoning activity masks a more organized ecosystem that includes multiple distributors, access rental, and criminal-on-criminal targeting.","MODBEACON’s reuse of Xray/V2Ray transport makes its command traffic resemble anti-censorship proxy communications rather than a conventional malware channel.","The campaign’s use of Amazon and Cloudflare CDN-hosted infrastructure shows the operators are blending attacker communications into widely used cloud and content-delivery services.","The distributor’s role as both a traffic broker and cybercriminal arms dealer indicates that infections from fake installers may be monetized beyond the initial malware deployment."],"referencedReports":[{"title":"Operation Phnom Penh: SilverFox Ghost Distributor Targets Specific Victims with MODBEACON","url":"https://ti.qianxin.com/blog/articles/operation-phnom-penh-silverfox-ghost-distributor-targets-specific-victims-with-modbeacon-en/","publisher":"QiAnXin","context":"The article cites QiAnXin’s analysis as the source attributing MODBEACON to Silver Fox and describing the malware’s architecture, delivery chain, and capabilities.","category":"","primary":false}],"body":"\u003cp\u003eThe China-linked cybercrime group Silver Fox has been attributed to a new Rust-based remote access trojan called MODBEACON. QiAnXin said the group may appear to be a low-sophistication, high-activity operation using counterfeit installers and SEO poisoning, but that this masks a broader structure involving multiple distributors. A mid-June 2026 campaign delivered MODBEACON against technology, education, and state-owned enterprises, with requested command-and-control infrastructure hosted on Amazon and Cloudflare’s CDN.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses counterfeit domains advertising bogus installers for popular domestic software to trick users into downloading malicious ZIP archives. QiAnXin assessed one distributor as a hybrid actor combining roles of a cybercriminal arms dealer and traffic broker, with activity across Asia and schemes involving the Cambodian gambling sector. The malware is designed to establish long-term access while minimizing detection on infected hosts.\u003c/p\u003e\n\n\u003cp\u003eMODBEACON is described as a memory-resident implant that can fetch additional modules, run operator commands, and maintain encrypted communications with attacker infrastructure. QiAnXin said it separates the loader and beacon, supports injectable configuration, uses a plugin-based architecture, and communicates through gRPC tunnel streaming. Its reported capabilities include host fingerprinting, in-memory plugin loading, heartbeat messages, command-execution result reporting, and persistence through scheduled tasks.\u003c/p\u003e\n"},{"n":6,"title":"Progress urges ShareFile admins to shut down servers over “credible” threat","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/progress-urges-sharefile-customers-to-shut-down-servers-over-credible-threat/","time":"16:26","priority":"SHOULD READ","score":88,"tldr":"Progress Software is urging ShareFile customers using on-premises Storage Zone Controllers to immediately shut down those servers due to a credible external security threat. The company says it has temporarily disabled affected access and has no current indication that ShareFile accounts or data were accessed without authorization.","briefOverview":"\u003cp\u003eProgress Software is emailing ShareFile customers who use Storage Zone Controllers and telling them to immediately shut down their servers. The company says it has identified a “credible external security threat” targeting the on-premises secure file-sharing software. Progress also temporarily disabled access to ShareFile accounts using Storage Zone Controllers, while stating it currently has no indication of unauthorized access to any Progress ShareFile accounts or data.\u003c/p\u003e\n\n\u003cp\u003eShareFile customers can use Storage Zone Controllers on on-premises Windows servers so their files remain hosted locally while ShareFile’s cloud platform handles authentication, user management, sharing, and collaboration. In these hybrid deployments, the ShareFile cloud directs uploads and downloads to the organization’s Storage Zone Controller, which retrieves or stores files on customer-managed storage before transferring them to the user. Because these controllers handle file transfers between the cloud platform and customer-managed storage, they are typically Internet-accessible servers.\u003c/p\u003e\n\n\u003cp\u003eProgress told customers that manually shutting down the server hosting their Storage Zone Controllers is a critical additional step to help ensure data safety. The ShareFile status page says customers with Storage Zone Controllers are not operational at this time. Progress has not disclosed whether the threat involves a zero-day vulnerability or whether any Storage Zone Controllers have been compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Progress Software emailed ShareFile customers using Storage Zone Controllers and urged them to immediately shut down their servers due to a credible external security threat.","Progress temporarily disabled access to ShareFile accounts using Storage Zone Controllers and said it currently has no indication of unauthorized access to ShareFile accounts or data.","Storage Zone Controllers run on on-premises Windows servers and are typically Internet-accessible because they handle file transfers between ShareFile’s cloud platform and customer-managed storage.","Progress said manually shutting down the servers hosting Storage Zone Controllers is a critical additional step to help ensure data safety.","Progress has not disclosed whether the threat involves a zero-day vulnerability or whether any Storage Zone Controllers have been compromised."],"insights":["Progress’s instruction to manually shut down Storage Zone Controller servers shows that the company considers its cloud-side access restrictions insufficient on their own to mitigate the threat.","The affected ShareFile deployments are hybrid setups where customer files remain on local company storage, meaning the risk is concentrated among organizations that chose on-premises storage rather than fully cloud-hosted ShareFile storage.","The ShareFile status page states that customers with Storage Zone Controllers are not operational, indicating that Progress prioritized containment over service availability for this customer group.","The warning resembles prior attacks against enterprise file transfer and file sharing software, including the 2023 MOVEit Transfer zero-day campaign that led to data theft from thousands of organizations."],"referencedReports":[],"body":"\u003cp\u003eProgress Software is emailing ShareFile customers who use Storage Zone Controllers and telling them to immediately shut down their servers. The company says it has identified a “credible external security threat” targeting the on-premises secure file-sharing software. Progress also temporarily disabled access to ShareFile accounts using Storage Zone Controllers, while stating it currently has no indication of unauthorized access to any Progress ShareFile accounts or data.\u003c/p\u003e\n\n\u003cp\u003eShareFile customers can use Storage Zone Controllers on on-premises Windows servers so their files remain hosted locally while ShareFile’s cloud platform handles authentication, user management, sharing, and collaboration. In these hybrid deployments, the ShareFile cloud directs uploads and downloads to the organization’s Storage Zone Controller, which retrieves or stores files on customer-managed storage before transferring them to the user. Because these controllers handle file transfers between the cloud platform and customer-managed storage, they are typically Internet-accessible servers.\u003c/p\u003e\n\n\u003cp\u003eProgress told customers that manually shutting down the server hosting their Storage Zone Controllers is a critical additional step to help ensure data safety. The ShareFile status page says customers with Storage Zone Controllers are not operational at this time. Progress has not disclosed whether the threat involves a zero-day vulnerability or whether any Storage Zone Controllers have been compromised.\u003c/p\u003e\n"},{"n":24,"title":"Injective Labs GitHub Compromise Pushes Wallet-Key-Stealing npm Packages","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/injective-labs-github-compromise-pushes.html","time":"17:29","priority":"SHOULD READ","score":88,"tldr":"Attackers compromised Injective Labs’ GitHub/npm release process to publish malicious @injectivelabs packages that stole crypto wallet private keys and mnemonic seed phrases when used. Anyone who installed the affected 1.20.21 packages should upgrade to a clean version and treat any keys or seed phrases processed by them as compromised.","briefOverview":"\u003cp\u003eUnknown threat actors compromised the Injective Labs SDK project\u0026rsquo;s GitHub repository and used it to publish a malicious npm package. The compromised version, \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e, was released on July 8, 2026, and included fake telemetry functionality that exfiltrated cryptocurrency wallet private keys and mnemonic seed phrases. The version has since been deprecated on npm, but the article says its release artifacts were still available for download from GitHub at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eSocket said the malicious functionality was introduced through commits submitted by a GitHub account belonging to a developer with an established history of contributions to the repository. The threat actor also published version 1.20.21 across 17 additional \u003ccode\u003e@injectivelabs\u003c/code\u003e scoped packages that depended on and pinned the malicious SDK version. This meant users could be affected through transitive dependencies even if they did not directly install the SDK package.\u003c/p\u003e\n\n\u003cp\u003eThe malware avoided lifecycle scripts and did not run during installation, instead triggering when affected library functionality was used. It modified legitimate functions used to generate private keys by invoking a \u003ccode\u003etrackKeyDerivation()\u003c/code\u003e function disguised as anonymized usage metrics, while passing along sensitive material needed to regenerate private keys. The exfiltration mechanism queued multiple key derivations over a two-second window and sent them via HTTPS POST to \u003ccode\u003etestnet.archival.chain.grpc-web.injective[.]network\u003c/code\u003e, and users are advised to update to version 1.20.23, treat exposed keys or phrases as compromised, rotate them, and check transitive dependencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unknown threat actors compromised the Injective Labs SDK project's GitHub repository and used it to publish the malicious npm package @injectivelabs/sdk-ts@1.20.21.","The malicious version contained fake telemetry functionality that exfiltrated cryptocurrency wallet private keys and mnemonic seed phrases when affected library functionality was used.","The threat actor also published version 1.20.21 across 17 additional @injectivelabs scoped packages that depended on and pinned the malicious SDK version, affecting potential transitive users.","The exfiltration mechanism queued multiple key derivations over a two-second window and sent them in an HTTPS POST request to testnet.archival.chain.grpc-web.injective[.]network.","Users who installed the malicious version are advised to update to the clean version 1.20.23, treat any private key or mnemonic phrase passed through the package as compromised, rotate them, and check for transitive dependencies."],"insights":["Deprecating the malicious npm release did not fully remove exposure because the release artifacts for version 1.20.21 were still available for download from GitHub at the time of writing.","The malware avoided npm lifecycle scripts and only triggered when library functionality was used, making install-time security checks less likely to detect it.","The malicious release was pushed through the repository’s own trusted-publisher OIDC pipeline under an existing maintainer identity, showing that a trusted release path can still distribute compromised code if the source repository or maintainer account is abused.","The attacker increased downstream exposure by publishing 17 additional @injectivelabs packages that pinned the malicious SDK version, putting users at risk even if they did not directly install @injectivelabs/sdk-ts.","The fake telemetry function was designed to look like performance measurement while receiving enough sensitive wallet material for the attacker to regenerate private keys."],"referencedReports":[{"title":"Compromised Injective SDK npm Package","url":"https://socket.dev/blog/compromised-injective-sdk-npm-package","publisher":"Socket","context":"The article cites Socket’s analysis that malicious functionality was introduced through commits from a GitHub account with an established contribution history and describes the compromised npm releases.","category":"","primary":false},{"title":"InjectiveLabs NPM Package Hijacked Impacting 87 Dependent Packages","url":"https://www.ox.security/blog/injectivelabs-npm-package-hijacked-impacting-87-dependent-packages/","publisher":"OX Security","context":"The article quotes OX Security’s analysis describing how the malware reads mnemonic phrases and sends them to a remote server.","category":"","primary":false},{"title":"Injective NPM Supply Chain Attack: 18 Packages Backdoored to Steal Crypto Wallet Keys","url":"https://www.stepsecurity.io/blog/injective-npm-supply-chain-attack-18-packages-backdoored-to-steal-crypto-wallet-keys","publisher":"StepSecurity","context":"The article cites StepSecurity’s technical analysis of the exfiltration mechanism and the trusted-publisher OIDC pipeline used in the malicious release.","category":"","primary":false}],"body":"\u003cp\u003eUnknown threat actors compromised the Injective Labs SDK project\u0026rsquo;s GitHub repository and used it to publish a malicious npm package. The compromised version, \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e, was released on July 8, 2026, and included fake telemetry functionality that exfiltrated cryptocurrency wallet private keys and mnemonic seed phrases. The version has since been deprecated on npm, but the article says its release artifacts were still available for download from GitHub at the time of writing.\u003c/p\u003e\n\n\u003cp\u003eSocket said the malicious functionality was introduced through commits submitted by a GitHub account belonging to a developer with an established history of contributions to the repository. The threat actor also published version 1.20.21 across 17 additional \u003ccode\u003e@injectivelabs\u003c/code\u003e scoped packages that depended on and pinned the malicious SDK version. This meant users could be affected through transitive dependencies even if they did not directly install the SDK package.\u003c/p\u003e\n\n\u003cp\u003eThe malware avoided lifecycle scripts and did not run during installation, instead triggering when affected library functionality was used. It modified legitimate functions used to generate private keys by invoking a \u003ccode\u003etrackKeyDerivation()\u003c/code\u003e function disguised as anonymized usage metrics, while passing along sensitive material needed to regenerate private keys. The exfiltration mechanism queued multiple key derivations over a two-second window and sent them via HTTPS POST to \u003ccode\u003etestnet.archival.chain.grpc-web.injective[.]network\u003c/code\u003e, and users are advised to update to version 1.20.23, treat exposed keys or phrases as compromised, rotate them, and check transitive dependencies.\u003c/p\u003e\n"},{"n":26,"title":"Exposed Hacker Server Reveals WP-SHELLSTORM Backdooring Thousands of WordPress Sites","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/exposed-hacker-server-reveals-wp.html","time":"11:30","priority":"SHOULD READ","score":88,"tldr":"Researchers found an exposed server belonging to the WP-SHELLSTORM crew, revealing automated campaigns that used known WordPress and Joomla plugin flaws to backdoor thousands of sites for resale. Site owners should urgently patch affected plugins, especially Breeze and Joomla JCE, and hunt for webshells and VShell-style impostor processes.","briefOverview":"\u003cp\u003eA cybercrime crew tracked as WP-SHELLSTORM left one of its own servers open on the internet for 22 days, exposing about 800MB of files across 434 items. Researchers found webshells, exploit scripts, scan results, command history, command-and-control settings, and target lists naming more than 1.4 million websites. The operation is described as a webshell access brokerage that breaks into sites at scale, plants hidden backdoors, and packages that access for resale.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the 1.4 million figure refers to target lists, not confirmed compromises. Ctrl-Alt-Intel counted 25,195 sites with confirmed or validated compromise evidence, while SOCRadar counted more than 5,700 active webshells. The strongest activity involved WordPress sites with outdated plugins, especially the Breeze caching plugin flaw CVE-2026-3844, which the crew claimed produced more than 17,000 backdoors, though it only worked when a non-default Gravatars setting was enabled.\u003c/p\u003e\n\n\u003cp\u003eThe exposed toolkit covered 27 known flaws and included an obfuscated down.php webshell derived from BestShell, plus use of a SNOWLIGHT dropper to install the VShell backdoor. SOCRadar also found evidence of an earlier campaign against corporate Java systems that used the Nacos flaw CVE-2021-29441 to collect configuration files containing cloud keys, database passwords, and Alipay RSA private keys. The article recommends patching affected WordPress and Joomla components, upgrading and securing Nacos, checking for specific webshell filenames and fake kworker processes, and blocking the listed infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found an exposed server used by the WP-SHELLSTORM operation that contained about 800MB of files, including webshells, exploit scripts, scan results, command history, and command-and-control settings.","WP-SHELLSTORM targeted more than 1.4 million listed websites, but confirmed compromises were far fewer, with Ctrl-Alt-Intel counting 25,195 compromised sites and SOCRadar counting more than 5,700 active webshells.","The campaign mainly targeted WordPress sites with outdated plugins, and the Breeze caching plugin flaw CVE-2026-3844 produced the most reported backdoors, with more than 17,000 successful compromises claimed by the crew.","The exposed toolkit included 27 known flaws and used tools such as an obfuscated down.php webshell derived from BestShell, a SNOWLIGHT dropper, and the VShell backdoor.","SOCRadar also found evidence that the same crew previously targeted corporate Java systems through the Nacos flaw CVE-2021-29441 and obtained cloud keys, database passwords, and Alipay RSA private keys from 11 systems across nine companies."],"insights":["The 1.4 million figure is a target-list count rather than a compromise count, so the article cautions that being listed in an attacker’s scan data is not the same as being hacked.","The Breeze flaw was the campaign’s biggest producer of backdoors, but it only worked when the non-default “Host Files Locally – Gravatars” setting was enabled, meaning many Breeze installations were not exposed through that condition.","A process named like “[kworker/X:Y]” is suspicious if it has an executable path, command line, or network sockets, because the article states that a real kernel thread has none of those.","The same exposed server showed both high-volume website backdooring and earlier theft of corporate credentials from Nacos systems, indicating the operators used different styles of activity before the WordPress-focused campaign.","The researchers treated Chinese-language artifacts, FOFA usage, and Chinese-speaking tools as indicators of a Chinese or Chinese-speaking operator, but the article explicitly notes that VShell’s presence alone does not prove state involvement."],"referencedReports":[{"title":"WP-SHELLSTORM Expose 1.4M WordPress Sites","url":"https://socradar.io/blog/wp-shellstorm-expose-1-4m-wordpress-sites/","publisher":"SOCRadar","context":"The article cites SOCRadar’s threat intelligence writeup as a foundational analysis of the exposed WP-SHELLSTORM server and its contents.","category":"","primary":false},{"title":"Wordpress","url":"https://ctrlaltintel.com/research/Wordpress/","publisher":"Ctrl-Alt-Intel","context":"The article says Ctrl-Alt-Intel analyzed the same exposed directory and published its findings before SOCRadar.","category":"","primary":false},{"title":"UNC5174 Chinese Threat Actor VShell","url":"https://www.sysdig.com/blog/unc5174-chinese-threat-actor-vshell","publisher":"Sysdig","context":"The article references Sysdig’s prior analysis linking the SNOWLIGHT-to-VShell chain to suspected Chinese state group UNC5174.","category":"","primary":false},{"title":"Operation Roundish","url":"https://ctrlaltintel.com/research/FancyBear/","publisher":"Ctrl-Alt-Intel","context":"The article references Ctrl-Alt-Intel’s earlier research on a forgotten open directory that exposed Fancy Bear phishing tools and logs.","category":"","primary":false}],"body":"\u003cp\u003eA cybercrime crew tracked as WP-SHELLSTORM left one of its own servers open on the internet for 22 days, exposing about 800MB of files across 434 items. Researchers found webshells, exploit scripts, scan results, command history, command-and-control settings, and target lists naming more than 1.4 million websites. The operation is described as a webshell access brokerage that breaks into sites at scale, plants hidden backdoors, and packages that access for resale.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that the 1.4 million figure refers to target lists, not confirmed compromises. Ctrl-Alt-Intel counted 25,195 sites with confirmed or validated compromise evidence, while SOCRadar counted more than 5,700 active webshells. The strongest activity involved WordPress sites with outdated plugins, especially the Breeze caching plugin flaw CVE-2026-3844, which the crew claimed produced more than 17,000 backdoors, though it only worked when a non-default Gravatars setting was enabled.\u003c/p\u003e\n\n\u003cp\u003eThe exposed toolkit covered 27 known flaws and included an obfuscated down.php webshell derived from BestShell, plus use of a SNOWLIGHT dropper to install the VShell backdoor. SOCRadar also found evidence of an earlier campaign against corporate Java systems that used the Nacos flaw CVE-2021-29441 to collect configuration files containing cloud keys, database passwords, and Alipay RSA private keys. The article recommends patching affected WordPress and Joomla components, upgrading and securing Nacos, checking for specific webshell filenames and fake kworker processes, and blocking the listed infrastructure.\u003c/p\u003e\n"},{"n":19,"title":"Six New U-Boot Flaws Could Let Malicious Images Crash Devices or Run Code at Boot","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/six-new-u-boot-flaws-could-let.html","time":"15:57","priority":"SHOULD READ","score":86,"tldr":"Binarly found six U-Boot flaws in FIT image signature verification, including two that could allow code execution before a device verifies boot software. Vendors using U-Boot should pull the upstream patches now because no fixed stable release is available yet.","briefOverview":"\u003cp\u003eResearchers at Binarly found six new flaws in U-Boot, a bootloader used in devices such as home routers, smart cameras, and server management chips. Four of the bugs can crash a device, while two could let an attacker run their own code if a malicious image reaches the boot path. The flaws are reached while U-Boot is still reading an untrusted image, before it has checked the image signature.\u003c/p\u003e\n\n\u003cp\u003eThe two most serious issues are BRLY-2026-037 and BRLY-2026-038, which stem from U-Boot using unchecked values returned by fdt_get_name. One can lead to a stack buffer overflow on devices where address zero is mapped, and the other can overwrite a saved return address through negative-length pointer arithmetic. The remaining four issues can crash the bootloader through out-of-bounds reads, a null pointer dereference, or stack exhaustion.\u003c/p\u003e\n\n\u003cp\u003eBinarly published proof-of-concept images and reproduction steps for each flaw, and no exploitation in real attacks has been reported. U-Boot merged six patches in June, but the July v2026.07 release shipped without them because it had already frozen, and the next release is expected in October as v2026.10. Vendors and maintainers are advised to pull the upstream fixes now, while users of U-Boot-based products must wait for firmware updates from their product vendors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Binarly found six flaws in U-Boot, a bootloader used in devices such as home routers, smart cameras, and server management chips.","The flaws affect U-Boot’s handling of FIT images during signature verification and are reachable while U-Boot is still reading an untrusted image before checking the signature.","Two flaws, BRLY-2026-037 and BRLY-2026-038, could allow attacker-supplied code to run at boot because U-Boot uses unchecked values returned by fdt_get_name.","Four flaws, BRLY-2026-039, BRLY-2026-040, BRLY-2026-041, and BRLY-2026-042, can crash the bootloader through out-of-bounds reads, a null pointer dereference, or stack exhaustion.","U-Boot merged patches for the six flaws in June, but there is no stable release containing the fixes yet, so vendors and maintainers are advised to pull the upstream fixes now."],"insights":["The most urgent fixes are BRLY-2026-037 and BRLY-2026-038 because the article distinguishes them from the crash-only bugs as potential boot-time code execution issues that could subvert the chain of trust.","Vendors cannot rely on the latest stable U-Boot release for these fixes because v2026.07 shipped without the June patches, and the next fixed release is not expected until v2026.10 in October.","Tracking remediation may be harder than usual because the six issues currently have Binarly advisory IDs but no CVE identifiers assigned.","The risky pattern may extend beyond U-Boot because the unchecked fdt_get_name helper comes from libfdt, which is shared with the Linux kernel, barebox, and other software.","The article highlights that delivery is the main attacker constraint, but earlier Binarly work showed a remote management interface could be used to flash a malicious image through a device’s own update process."],"referencedReports":[{"title":"UnFIT to Boot: Breaking U-Boot's FIT Signature Verification","url":"https://www.binarly.io/blog/unfit-to-boot-breaking-u-boots-fit-signature-verification","publisher":"Binarly","context":"The article cites Binarly’s technical research as the source for details on six U-Boot FIT signature verification flaws and their long-standing presence across U-Boot releases.","category":"","primary":false},{"title":"BRLY-2026-037 through BRLY-2026-042 Advisories","url":"https://www.binarly.io/advisories","publisher":"Binarly","context":"The article says the six U-Boot bugs are tracked as Binarly advisories BRLY-2026-037 through BRLY-2026-042 and references the advisory page for commit links and details.","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Binarly found six new flaws in U-Boot, a bootloader used in devices such as home routers, smart cameras, and server management chips. Four of the bugs can crash a device, while two could let an attacker run their own code if a malicious image reaches the boot path. The flaws are reached while U-Boot is still reading an untrusted image, before it has checked the image signature.\u003c/p\u003e\n\n\u003cp\u003eThe two most serious issues are BRLY-2026-037 and BRLY-2026-038, which stem from U-Boot using unchecked values returned by fdt_get_name. One can lead to a stack buffer overflow on devices where address zero is mapped, and the other can overwrite a saved return address through negative-length pointer arithmetic. The remaining four issues can crash the bootloader through out-of-bounds reads, a null pointer dereference, or stack exhaustion.\u003c/p\u003e\n\n\u003cp\u003eBinarly published proof-of-concept images and reproduction steps for each flaw, and no exploitation in real attacks has been reported. U-Boot merged six patches in June, but the July v2026.07 release shipped without them because it had already frozen, and the next release is expected in October as v2026.10. Vendors and maintainers are advised to pull the upstream fixes now, while users of U-Boot-based products must wait for firmware updates from their product vendors.\u003c/p\u003e\n"},{"n":22,"title":"URGENT - Progress Tells ShareFile Customers to Shut Down Storage Zone Controllers Over Security Threat","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/urgent-progress-tells-sharefile.html","time":"16:30","priority":"SHOULD READ","score":86,"tldr":"Progress Software has told ShareFile customers to shut down self-hosted Storage Zone Controllers due to a credible external security threat, while cloud-only ShareFile accounts are not affected. The company has not disclosed the nature of the threat or when systems can safely come back online, so exposed controllers should be treated as possible incidents.","briefOverview":"\u003cp\u003eProgress Software has told ShareFile customers to shut down the Windows servers running their Storage Zone Controllers after identifying what it called a credible external security threat. The company temporarily disabled access to affected accounts out of an abundance of caution while working with internal and external security experts. Progress said it has no indication of unauthorized access to any ShareFile accounts or data, but it has not disclosed what the threat is or who is behind it.\u003c/p\u003e\n\n\u003cp\u003eOnly customers using Storage Zone Controllers are affected, while standard cloud-only ShareFile accounts are not affected. The controller is a customer-run server that lets files remain on the customer’s own storage while ShareFile’s cloud is used to share and manage them. The article notes that these controllers usually sit at the network’s edge and are reachable from the internet, which makes the shutdown order notable.\u003c/p\u003e\n\n\u003cp\u003eThe article advises affected customers to keep controllers offline until Progress says it is safe to restart them, confirm they are running version 5.12.4 or later on the 5.x line or a 6.x release, and preserve logs while checking for unfamiliar .aspx files. It also notes that ShareFile Storage Zones Controller was previously affected by CVE-2023-24489 in 2023, when CISA flagged the flaw as actively exploited. Progress has not connected the current threat to two critical Storage Zones Controller flaws disclosed by watchTowr in April and patched in March.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Progress Software told ShareFile customers to shut down Windows servers running Storage Zone Controllers in response to what it called a credible external security threat.","Progress temporarily disabled access to affected accounts and said it has no indication of unauthorized access to any ShareFile accounts or data.","Only Storage Zone Controller customers are affected, while standard cloud-only ShareFile accounts are not affected.","Progress has not disclosed what the threat is, who is behind it, or when customers can safely restart affected controllers.","The article advises customers to keep affected controllers offline, confirm they are running version 5.12.4 or later on the 5.x line or a 6.x release, and preserve logs while checking for unfamiliar .aspx files."],"insights":["Progress ordering customers to take Storage Zone Controllers fully offline, rather than simply apply a patch, is described as a notable step because the controllers are usually internet-facing and therefore exposed targets.","The article states that if a fix existed, Progress would likely be telling customers to apply it, so the shutdown order suggests there is not yet a fix for the current threat.","Progress's statement that it has no indication of unauthorized access to ShareFile accounts or data does not rule out problems on the customer-run controllers themselves.","Being on version 5.12.4 or later on the 5.x line, or on a 6.x release, addresses earlier flaws but should not be treated as permission to restart because Progress has not said those versions clear the current threat.","The article advises that internet-reachable controllers should be handled as possible incidents even if they appear clean, with logs preserved and checks made for unfamiliar .aspx files."],"referencedReports":[{"title":"watchTowr April disclosure of two critical Storage Zones Controller flaws","url":"https://thehackernews.com/2026/04/threatsday-bulletin-pre-auth-chains.html","publisher":"watchTowr","context":"The article says watchTowr disclosed two critical Storage Zones Controller flaws in April, which Progress patched in March, while noting Progress has not connected the current threat to them.","category":"","primary":false}],"body":"\u003cp\u003eProgress Software has told ShareFile customers to shut down the Windows servers running their Storage Zone Controllers after identifying what it called a credible external security threat. The company temporarily disabled access to affected accounts out of an abundance of caution while working with internal and external security experts. Progress said it has no indication of unauthorized access to any ShareFile accounts or data, but it has not disclosed what the threat is or who is behind it.\u003c/p\u003e\n\n\u003cp\u003eOnly customers using Storage Zone Controllers are affected, while standard cloud-only ShareFile accounts are not affected. The controller is a customer-run server that lets files remain on the customer’s own storage while ShareFile’s cloud is used to share and manage them. The article notes that these controllers usually sit at the network’s edge and are reachable from the internet, which makes the shutdown order notable.\u003c/p\u003e\n\n\u003cp\u003eThe article advises affected customers to keep controllers offline until Progress says it is safe to restart them, confirm they are running version 5.12.4 or later on the 5.x line or a 6.x release, and preserve logs while checking for unfamiliar .aspx files. It also notes that ShareFile Storage Zones Controller was previously affected by CVE-2023-24489 in 2023, when CISA flagged the flaw as actively exploited. Progress has not connected the current threat to two critical Storage Zones Controller flaws disclosed by watchTowr in April and patched in March.\u003c/p\u003e\n"},{"n":1,"title":"New U-Boot flaws could enable stealthy firmware attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-u-boot-flaws-could-enable-stealthy-firmware-attacks/","time":"21:59","priority":"SHOULD READ","score":85,"tldr":"Six vulnerabilities in the widely used U-Boot bootloader could let attackers crash devices or run malicious code before the operating system loads, enabling stealthy and persistent firmware compromise. Patches are upstream, but affected devices remain at risk until hardware vendors ship firmware updates, and older unsupported products may never be fixed.","briefOverview":"\u003cp\u003eBinarly disclosed six vulnerabilities in the widely used U-Boot bootloader that could allow attackers to execute malicious code during device boot or crash vulnerable devices. U-Boot is used in many embedded Linux devices, including enterprise servers\u0026rsquo; Baseboard Management Controllers, networking equipment, industrial systems, IoT devices, and other appliances. Because U-Boot loads the operating system, flaws in this component can affect a device before the operating system and its security software start.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities are in U-Boot\u0026rsquo;s FIT signature verification code, which is tied to checking firmware images during startup. Binarly said two of the flaws can potentially lead to arbitrary code execution during firmware verification, while four others can be exploited to crash vulnerable devices. The disclosed issues include BRLY-2026-037 through BRLY-2026-042, covering memory corruption, out-of-bounds read, null pointer dereference, improper validation of externally stored firmware data, and unbounded recursion.\u003c/p\u003e\n\n\u003cp\u003eBinarly said most of the vulnerable code has existed since U-Boot version 2013.07, potentially affecting more than 50 stable releases and downstream vendor forks. The company reported the vulnerabilities to U-Boot maintainers and submitted patches for all six issues, which have been accepted upstream. However, hardware manufacturers must incorporate the fixes into their own firmware updates before customers receive them, and older or unsupported devices may never be patched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Binarly disclosed six vulnerabilities in U-Boot's FIT signature verification code that range in impact from denial of service to arbitrary code execution during verification of an untrusted image.","U-Boot is widely used in embedded Linux devices, including enterprise servers' Baseboard Management Controllers, networking equipment, industrial systems, IoT devices, and other appliances.","Two of the flaws can potentially lead to arbitrary code execution during firmware verification, while the remaining four can be exploited to crash vulnerable devices.","Most of the vulnerable code has existed since U-Boot version 2013.07, potentially affecting more than 50 stable releases and downstream vendor firmware forks.","Patches for all six issues have been accepted upstream, but hardware manufacturers must incorporate the fixes into their own firmware updates before customers receive them."],"insights":["The flaws are especially difficult to remediate at scale because U-Boot fixes must pass through individual hardware vendors before reaching customers, even though patches have already been accepted upstream.","Devices that support remote firmware updates, such as BMCs, may be exposed without an attacker needing physical access if the management interface has already been compromised.","The age of the affected code means the issue is not limited to current U-Boot releases and may extend across many vendor-maintained firmware forks.","Older or unsupported devices may remain permanently vulnerable because they may never receive firmware updates containing the accepted fixes."],"referencedReports":[{"title":"UnFIT to Boot: Breaking U-Boot's FIT Signature Verification","url":"https://www.binarly.io/blog/unfit-to-boot-breaking-u-boots-fit-signature-verification","publisher":"Binarly","context":"The article says Binarly published a report disclosing six vulnerabilities in U-Boot's FIT signature verification code.","category":"","primary":false}],"body":"\u003cp\u003eBinarly disclosed six vulnerabilities in the widely used U-Boot bootloader that could allow attackers to execute malicious code during device boot or crash vulnerable devices. U-Boot is used in many embedded Linux devices, including enterprise servers\u0026rsquo; Baseboard Management Controllers, networking equipment, industrial systems, IoT devices, and other appliances. Because U-Boot loads the operating system, flaws in this component can affect a device before the operating system and its security software start.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities are in U-Boot\u0026rsquo;s FIT signature verification code, which is tied to checking firmware images during startup. Binarly said two of the flaws can potentially lead to arbitrary code execution during firmware verification, while four others can be exploited to crash vulnerable devices. The disclosed issues include BRLY-2026-037 through BRLY-2026-042, covering memory corruption, out-of-bounds read, null pointer dereference, improper validation of externally stored firmware data, and unbounded recursion.\u003c/p\u003e\n\n\u003cp\u003eBinarly said most of the vulnerable code has existed since U-Boot version 2013.07, potentially affecting more than 50 stable releases and downstream vendor forks. The company reported the vulnerabilities to U-Boot maintainers and submitted patches for all six issues, which have been accepted upstream. However, hardware manufacturers must incorporate the fixes into their own firmware updates before customers receive them, and older or unsupported devices may never be patched.\u003c/p\u003e\n"},{"n":15,"title":"Unpatched XRING Flaw in XQUIC Lets Remote Clients Crash HTTP/3 Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/unpatched-xring-flaw-in-xquic-lets.html","time":"11:47","priority":"SHOULD READ","score":85,"tldr":"A newly disclosed unpatched flaw called XRING in Alibaba’s XQUIC HTTP/3 library lets unauthenticated remote clients crash affected servers using a small amount of valid QPACK traffic. Until a fix is released, operators should disable QPACK’s dynamic table or turn off HTTP/3 support.","briefOverview":"\u003cp\u003eFoxIO researcher Sébastien Féry disclosed an unpatched flaw called XRING in Alibaba’s XQUIC QUIC and HTTP/3 library on July 8. The flaw lets any unauthenticated remote client crash an affected server with about 260 bytes of ordinary QPACK traffic. The article says no malformed packets or login are required, and every XQUIC release through v1.9.4 is affected. As of July 10, there was no fixed release and no CVE.\u003c/p\u003e\n\n\u003cp\u003eXQUIC is open-source, so the issue can affect any server that embeds it and serves HTTP/3 with default QPACK settings. The article specifically mentions Tengine, Alibaba’s Nginx-based web server, which FoxIO says fronts Alibaba’s cloud and CDN on sites including Taobao and Alipay. Until a fix is available, operators can set SETTINGS_QPACK_MAX_TABLE_CAPACITY to 0 to disable QPACK’s dynamic table or drop HTTP/3 support entirely. FoxIO also published a proof of concept.\u003c/p\u003e\n\n\u003cp\u003eThe bug is in how XQUIC resizes the ring buffer used to store QPACK dynamic-table data. In one resize case, the code compares leftover tail data against the new buffer’s capacity instead of the old buffer’s capacity, causing an overcount that leads to an unsigned size_t underflow and an out-of-bounds memory copy. In FoxIO’s Ubuntu 26.04 release build, glibc’s _FORTIFY_SOURCE=2 caught the bad length and killed the process. Féry demonstrated a crash but did not test whether the memory corruption could be exploited further.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FoxIO researcher Sébastien Féry disclosed an unpatched flaw called XRING in Alibaba’s XQUIC QUIC and HTTP/3 library on July 8.","The flaw allows an unauthenticated remote client to crash a server using about 260 bytes of valid QPACK traffic, without malformed packets or login credentials.","Every XQUIC release through v1.9.4 is affected, and there was no fixed release or CVE as of July 10.","The issue affects any server that embeds XQUIC and serves HTTP/3 with default QPACK settings, including Alibaba’s Tengine web server according to FoxIO.","Until a fix is available, operators can set SETTINGS_QPACK_MAX_TABLE_CAPACITY to 0 to disable QPACK’s dynamic table or disable HTTP/3 support entirely."],"insights":["XRING is especially dangerous because the crash is triggered by fully valid QPACK behavior, so defenses that only reject malformed packets would not address it.","The bug is caused by a one-line variable mix-up during ring-buffer resizing, showing how a small arithmetic error in header-compression handling can bring down an HTTP/3 server.","Disabling QPACK’s dynamic table by setting SETTINGS_QPACK_MAX_TABLE_CAPACITY to 0 is a targeted workaround that can reduce exposure without necessarily disabling all HTTP/3 support.","The same QPACK encoder stream was involved in a recent NGINX HTTP/3 flaw, highlighting it as a recurring crash surface in modern web server implementations.","FoxIO said it attempted to contact Alibaba five times before disclosure, despite the project’s security policy promising a reply within three working days."],"referencedReports":[{"title":"XRING: Crashing XQUIC with Spec-Compliant QPACK Instructions","url":"https://foxio.io/blog/xring-crashing-xquic-with-spec-compliant-qpack-instructions","publisher":"FoxIO","context":"The article is based on FoxIO researcher Sébastien Féry’s disclosure and technical explanation of the XRING flaw in XQUIC.","category":"","primary":false},{"title":"CVEs 2026 QUIC Denial of Service","url":"https://www.haproxy.com/blog/cves-2026-quic-denial-of-service","publisher":"HAProxy","context":"The article cites HAProxy’s write-up about two QUIC crashes patched in February as related examples of remote denial-of-service flaws.","category":"","primary":false}],"body":"\u003cp\u003eFoxIO researcher Sébastien Féry disclosed an unpatched flaw called XRING in Alibaba’s XQUIC QUIC and HTTP/3 library on July 8. The flaw lets any unauthenticated remote client crash an affected server with about 260 bytes of ordinary QPACK traffic. The article says no malformed packets or login are required, and every XQUIC release through v1.9.4 is affected. As of July 10, there was no fixed release and no CVE.\u003c/p\u003e\n\n\u003cp\u003eXQUIC is open-source, so the issue can affect any server that embeds it and serves HTTP/3 with default QPACK settings. The article specifically mentions Tengine, Alibaba’s Nginx-based web server, which FoxIO says fronts Alibaba’s cloud and CDN on sites including Taobao and Alipay. Until a fix is available, operators can set SETTINGS_QPACK_MAX_TABLE_CAPACITY to 0 to disable QPACK’s dynamic table or drop HTTP/3 support entirely. FoxIO also published a proof of concept.\u003c/p\u003e\n\n\u003cp\u003eThe bug is in how XQUIC resizes the ring buffer used to store QPACK dynamic-table data. In one resize case, the code compares leftover tail data against the new buffer’s capacity instead of the old buffer’s capacity, causing an overcount that leads to an unsigned size_t underflow and an out-of-bounds memory copy. In FoxIO’s Ubuntu 26.04 release build, glibc’s _FORTIFY_SOURCE=2 caught the bad length and killed the process. Féry demonstrated a crash but did not test whether the memory corruption could be exploited further.\u003c/p\u003e\n"},{"n":14,"title":"Study of 281 Free Android VPN Apps Finds Traffic Leaks, Unencrypted Data, and Tracking","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/study-of-281-free-android-vpn-apps.html","time":"10:56","priority":"SHOULD READ","score":84,"tldr":"A study of 281 popular free Android VPN apps found widespread security and privacy failures, including traffic leaks, plaintext data, weak encryption, tracking, and five apps that could let attackers hijack VPN tunnels. The takeaway is that many free VPN apps do not provide the privacy or security they advertise, even when distributed through Google Play.","briefOverview":"\u003cp\u003e
