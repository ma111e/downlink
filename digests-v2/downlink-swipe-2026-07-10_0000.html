ed to about 14 named analysts per tenant on average, indicating real operational use rather than token assignment.","Regional role adoption shows that delegation discipline is a practice choice rather than a function of market size, because several large markets rank only in the middle or lower parts of the country tables.","The article identifies an immediate, no-software-change improvement path: organizations can add fitted specialty roles alongside default administrator accounts and then reduce default administrator use where it is not needed for routine work."],"referencedReports":[{"title":"NIST SP 800-53 Revision 5: Security and Privacy Controls for Information Systems and Organizations","url":"https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final","publisher":"NIST","context":"The article cites NIST SP 800-53 AC-6 as the least-privilege control supporting narrow role assignments.","category":"","primary":false},{"title":"NIST SP 800-207: Zero Trust Architecture","url":"https://csrc.nist.gov/pubs/sp/800/207/final","publisher":"NIST","context":"The article references NIST SP 800-207 to describe zero trust as a posture where access is verified and privileges are kept narrow.","category":"","primary":false}],"body":"\u003cp\u003eThe article argues that role-based control is a key security practice inside Acronis Cyber Protect Cloud because it lets each technician receive only the access needed for a specific job. It cites least-privilege, separation-of-duties, and accountability expectations from frameworks such as NIST SP 800-53, NIST SP 800-207, ISO/IEC 27001:2022, CIS Controls v8, and ENISA guidance for SMEs. Acronis Cyber Protect Cloud includes built-in roles for company administration, cyber administration, protection administration, detection and response, remote monitoring and management, audit oversight, File Sync and Share, and Partner Portal access.\u003c/p\u003e\n\n\u003cp\u003eThe article’s central finding is that the role catalog is lightly used across active customer tenants. Only about 4.8% of customer tenants have granted at least one fitted specialty role alongside defaults, about 95.2% have granted none, and only about 1.15% have granted two or more. About 33.9% of customer tenants have no local administrator account at all because they are administered entirely from the managing partner level, which means many least-privilege decisions happen on the partner side rather than inside the customer tenant.\u003c/p\u003e\n\n\u003cp\u003eWhere fitted roles are used, Administrator (protection) leads at about 2.41% of customer tenants, followed by File Sync and Share roles, read-only administrator (protection), cyber administrator, and security analyst. Cyber administrator averages about 1.24 named administrators in tenants that use it, while security analyst averages about 14 named analysts per tenant when Managed Detection and Response is purchased. The article recommends that SMBs, managed service providers, and customers working with MSPs reduce routine use of default administrator roles, map work to fitted roles, and review access entitlements quarterly.\u003c/p\u003e\n"},{"n":7,"title":"The Replicant in Your Directory: AI Agents and the Identity Security Gap","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-replicant-in-your-directory-ai-agents-and-the-identity-security-gap/","time":"14:00","priority":"MAY READ","score":45,"tldr":"AI agents and other machine identities are rapidly expanding enterprise identity risk because they often lack clear ownership, lifecycle controls, and visibility. The key takeaway is that organizations must continuously track what non-human identities exist, what they can access, who owns them, and when they should be retired.","briefOverview":"\u003cp\u003eThe article argues that security programs were built around people, while AI agents and other machine identities are exposing gaps in identity governance. These non-human identities include AI agents, service accounts, OAuth applications, and workload identities, and the article says they already outnumber people in many enterprise environments. Unlike employees, they may exist only briefly or remain active for years after the application or automation that created them has been forgotten.\u003c/p\u003e\n\n\u003cp\u003eThe article uses the 2025 UNC6395 incident involving a Salesloft Drift OAuth token as an example of the risk. The token was associated with Drift’s chat integration and was used to move through Salesforce environments across hundreds of organizations. The article says attackers then reached AWS credentials, Snowflake tokens, and additional secrets stored where they should not have been, showing how one trusted machine identity can lead to several more.\u003c/p\u003e\n\n\u003cp\u003eNetwrix’s 2026 Data and Identity Security Report found that organizations where AI significantly expanded the number of identities reported a 43% breach rate over the previous year, compared with 11% where AI had not significantly changed the identity footprint. The article says many of these organizations already had stronger governance practices, including monitoring shadow AI, governing non-human identities, and maintaining visibility into sensitive data. It concludes that security teams need continuous answers about what identities exist, who owns them, what they can access, and when they should no longer exist.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Machine identities such as AI agents, service accounts, OAuth applications, and workload identities already outnumber people in many enterprise environments and can remain active after the applications or automation that created them are forgotten.","The article says identity security programs were built around human lifecycle events, while AI agents and other machine identities can be created automatically, inherit permissions, interact across systems, and create additional identities.","In 2025, threat actor UNC6395 obtained an OAuth token associated with Salesloft's Drift chat integration and used it to move through Salesforce environments across hundreds of organizations.","Netwrix's 2026 Data and Identity Security Report found that organizations where AI significantly expanded the number of identities reported a 43% breach rate over the previous year, compared with 11% where AI had not significantly changed the identity footprint.","The article argues security teams need continuous answers about what identities exist, who owns them, what they can access, and when they should no longer exist."],"insights":["The Salesloft Drift example shows that a trusted machine credential can be dangerous even without exploiting a software flaw, because its existing access can become a path into other systems and secrets.","The article highlights that organizations with stronger AI and identity governance practices still reported higher breach rates when AI rapidly expanded their number of identities, suggesting that visibility and monitoring alone may not keep pace with identity growth.","A practical accountability gap emerges when AI agents create or use other identities at machine speed, because the link back to a human owner, approver, or reviewer can quickly become unclear.","The article frames sensitive data protection as inseparable from identity ownership: knowing where data lives is insufficient unless the organization also knows every identity that can reach it and who is responsible for each one."],"referencedReports":[{"title":"The Ultimate Guide to Non-Human Identities","url":"https://nhimg.org/the-ultimate-guide-to-non-human-identities#key-research-and-survey-results","publisher":"Non-Human Identity Management Group","context":"The article cites it for the claim that machine identities can outnumber human users by as much as 50 to one in many environments.","category":"","primary":false}],"body":"\u003cp\u003eThe article argues that security programs were built around people, while AI agents and other machine identities are exposing gaps in identity governance. These non-human identities include AI agents, service accounts, OAuth applications, and workload identities, and the article says they already outnumber people in many enterprise environments. Unlike employees, they may exist only briefly or remain active for years after the application or automation that created them has been forgotten.\u003c/p\u003e\n\n\u003cp\u003eThe article uses the 2025 UNC6395 incident involving a Salesloft Drift OAuth token as an example of the risk. The token was associated with Drift’s chat integration and was used to move through Salesforce environments across hundreds of organizations. The article says attackers then reached AWS credentials, Snowflake tokens, and additional secrets stored where they should not have been, showing how one trusted machine identity can lead to several more.\u003c/p\u003e\n\n\u003cp\u003eNetwrix’s 2026 Data and Identity Security Report found that organizations where AI significantly expanded the number of identities reported a 43% breach rate over the previous year, compared with 11% where AI had not significantly changed the identity footprint. The article says many of these organizations already had stronger governance practices, including monitoring shadow AI, governing non-human identities, and maintaining visibility into sensitive data. It concludes that security teams need continuous answers about what identities exist, who owns them, what they can access, and when they should no longer exist.\u003c/p\u003e\n"},{"n":17,"title":"From 17,000 to 1.1 Million Assets: How Lumen Technologies Rebuilt Exposure Management at Scale","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/from-17000-to-11-million-assets-how.html","time":"11:39","priority":"MAY READ","score":45,"tldr":"Lumen Technologies used Axonius to consolidate data from 40+ systems and discovered its asset inventory was vastly understated, growing from about 17,000 known assets to 1.1 million devices. The key takeaway is that trusted asset visibility is foundational to effective exposure management, faster zero-day response, and risk-based remediation.","briefOverview":"\u003cp\u003eLumen Technologies used the Axonius asset intelligence platform to reconcile data from more than 40 disconnected IT and security systems into one trusted view. The company started with about 17,000 known cyber assets across existing inventories, identified 500,000 devices after initial reconciliation, and now tracks approximately 1.1 million devices. Geoff Krahn, Director of Product and Platform Security at Lumen, said the process showed the organization how large its responsibilities were and helped highlight gaps in controls.\u003c/p\u003e\n\n\u003cp\u003eThe article says trusted asset data changed how Lumen handles exposure management and vulnerability response. When a critical vulnerability appears, Krahn’s team can identify affected systems, confirm whether they are externally exposed, establish ownership within minutes, and push alerts to engineers through a chatbot built on Axonius. Lumen also built an Application Posture Dashboard in Axonius by correlating CMDB relationships with control coverage, vulnerability data, and end-of-life status.\u003c/p\u003e\n\n\u003cp\u003eLumen used this visibility to move beyond what Krahn called “scan and spam,” where teams scan systems, distribute results, and hope the right issues are fixed first. Axonius Exposures allowed the team to combine technical findings with asset context, business criticality, and control coverage to prioritize remediations that deliver the greatest risk reduction. The article says Axonius visibility into end-of-life issues contributed to Lumen’s decision to migrate most of its infrastructure to the cloud, reducing overall risk by 40%, and that leadership increased security spending to roughly 10 times its previous level.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lumen Technologies used Axonius to reconcile data from more than 40 disconnected IT and security systems into one trusted asset view.","Lumen’s known cyber assets increased from about 17,000 across existing inventories to 500,000 after initial reconciliation and approximately 1.1 million devices currently.","With Axonius, Lumen can identify systems affected by a critical vulnerability, determine whether they are externally exposed, and establish ownership within minutes.","Lumen built an Application Posture Dashboard in Axonius by correlating CMDB relationships with control coverage, vulnerability data, and end-of-life status.","Lumen said Axonius visibility into end-of-life systems contributed to a decision to migrate most infrastructure to the cloud, reducing overall risk by 40%."],"insights":["A mature organization with more than 40 inventory-related systems can still have a radically inaccurate asset picture, as Lumen found 60 times more devices than it initially knew about.","Asset visibility changed executive decision-making at Lumen, contributing to roughly 10 times higher security investment and board-level reporting based on Axonius-generated data.","Lumen’s move from device-level visibility to application-level posture shows that knowing whether a server is patched is not enough without also knowing what application it supports, who owns it, and what business impact is tied to it.","The article argues that vulnerability prioritization based mainly on CVSS can bury the most important fixes, while combining findings with asset context, business criticality, and control coverage can focus remediation on the largest risk reduction.","Lumen’s experience shows that better exposure management and better asset data reinforce each other, because remediation outcomes can also reveal where the underlying inventory still needs improvement."],"referencedReports":[],"body":"\u003cp\u003eLumen Technologies used the Axonius asset intelligence platform to reconcile data from more than 40 disconnected IT and security systems into one trusted view. The company started with about 17,000 known cyber assets across existing inventories, identified 500,000 devices after initial reconciliation, and now tracks approximately 1.1 million devices. Geoff Krahn, Director of Product and Platform Security at Lumen, said the process showed the organization how large its responsibilities were and helped highlight gaps in controls.\u003c/p\u003e\n\n\u003cp\u003eThe article says trusted asset data changed how Lumen handles exposure management and vulnerability response. When a critical vulnerability appears, Krahn’s team can identify affected systems, confirm whether they are externally exposed, establish ownership within minutes, and push alerts to engineers through a chatbot built on Axonius. Lumen also built an Application Posture Dashboard in Axonius by correlating CMDB relationships with control coverage, vulnerability data, and end-of-life status.\u003c/p\u003e\n\n\u003cp\u003eLumen used this visibility to move beyond what Krahn called “scan and spam,” where teams scan systems, distribute results, and hope the right issues are fixed first. Axonius Exposures allowed the team to combine technical findings with asset context, business criticality, and control coverage to prioritize remediations that deliver the greatest risk reduction. The article says Axonius visibility into end-of-life issues contributed to Lumen’s decision to migrate most of its infrastructure to the cloud, reducing overall risk by 40%, and that leadership increased security spending to roughly 10 times its previous level.\u003c/p\u003e\n"},{"n":28,"title":"NIST Elevated DNS Security. Censys Active DNS Connects Names to Live Internet Infrastructure.","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/nist-dns-security/","time":"18:21","priority":"MAY READ","score":35,"tldr":"Censys is promoting Active DNS as a way to connect domain names to live internet infrastructure, DNS history, exposed services, certificates, vulnerabilities, and threat context. The key takeaway is that DNS visibility is increasingly positioned as evidence for exposure management and incident response under NIST CSF 2.0 alignment.","briefOverview":"\u003cp\u003eThe article says DNS has become harder to ignore in security operations because NIST SP 800-81r3 is mapped to the NIST Cybersecurity Framework 2.0. It argues that DNS security now has a clearer place in a framework many organizations use for risk, governance, and security operations. It presents DNS intelligence as useful for CTI and exposure management teams working to identify assets, monitor change, investigate incidents, respond to threats, and prove progress.\u003c/p\u003e\n\n\u003cp\u003eCensys has launched Active DNS, which actively resolves names by querying authoritative infrastructure and connects those results to the broader Censys Internet Map. The article says this lets defenders move from a domain name into related hosts, services, certificates, threats, software, and exposure. Security teams can view current and historical A, AAAA, CNAME, MX, NS, SOA, and TXT records, including when records were first and last observed by Censys.\u003c/p\u003e\n\n\u003cp\u003eThe article describes Active DNS as supporting the Identify, Detect, Respond, and Recover functions of the NIST Cybersecurity Framework. Analysts can use it to examine DNS history, resolved hosts, open ports, running services, certificates, CVEs, host reputation, Censys threat context, and other evidence. The article argues that DNS security cannot stop at resolvers, firewalls, or SIEM logs because defenders need to understand how names connect to the live Internet.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NIST SP 800-81r3 is mapped to the NIST Cybersecurity Framework 2.0, giving DNS security a clearer place in a framework used for risk, governance, and security operations.","Censys Active DNS actively resolves domain names by querying authoritative infrastructure and connects those results to the broader Censys Internet Map.","Censys Active DNS provides current and historical DNS records across A, AAAA, CNAME, MX, NS, SOA, and TXT records, including when records were first and last observed by Censys.","Security teams can pivot from a domain to resolved hosts, open ports, running services, TLS certificates, HTTP content, vulnerabilities, screenshots, host reputation, and Censys threat context.","The article says Censys Active DNS can support exposure management, threat hunting, detection engineering, incident response, and SOC triage for teams aligning to CSF 2.0."],"insights":["The article frames DNS intelligence as evidence for cybersecurity governance and risk work, not just as a technical lookup capability.","Censys distinguishes Active DNS from passive DNS by emphasizing active resolution through authoritative infrastructure and direct linkage to its Internet Map.","The article positions a domain name as a starting point for broader investigation into hosts, services, certificates, vulnerabilities, screenshots, reputation, and threat labels.","Censys claims its historical visibility across hosts, DNS, threats, and certificates can help analysts reconstruct what was visible during a relevant incident window."],"referencedReports":[],"body":"\u003cp\u003eThe article says DNS has become harder to ignore in security operations because NIST SP 800-81r3 is mapped to the NIST Cybersecurity Framework 2.0. It argues that DNS security now has a clearer place in a framework many organizations use for risk, governance, and security operations. It presents DNS intelligence as useful for CTI and exposure management teams working to identify assets, monitor change, investigate incidents, respond to threats, and prove progress.\u003c/p\u003e\n\n\u003cp\u003eCensys has launched Active DNS, which actively resolves names by querying authoritative infrastructure and connects those results to the broader Censys Internet Map. The article says this lets defenders move from a domain name into related hosts, services, certificates, threats, software, and exposure. Security teams can view current and historical A, AAAA, CNAME, MX, NS, SOA, and TXT records, including when records were first and last observed by Censys.\u003c/p\u003e\n\n\u003cp\u003eThe article describes Active DNS as supporting the Identify, Detect, Respond, and Recover functions of the NIST Cybersecurity Framework. Analysts can use it to examine DNS history, resolved hosts, open ports, running services, certificates, CVEs, host reputation, Censys threat context, and other evidence. The article argues that DNS security cannot stop at resolvers, firewalls, or SIEM logs because defenders need to understand how names connect to the live Internet.\u003c/p\u003e\n"}]</script>
