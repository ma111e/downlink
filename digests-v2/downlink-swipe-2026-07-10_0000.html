Researchers from the University of Michigan, the University of New Mexico, and IIT Delhi tested 281 popular free Android VPN apps from the Google Play Store using a framework called MVPNalyzer. They found that many apps failed to keep user traffic private and secure, with apps flagged for at least one issue accounting for more than 2.4 billion installs. The system was presented at the NDSS security conference in February 2026 and is described as the first framework built to systematically and repeatedly audit Android VPN apps.\u003c/p\u003e\n\n\u003cp\u003eThe most serious finding involved five apps that downloaded configuration files without encryption, allowing an attacker on the same network to rewrite the file and redirect the VPN connection to a server they controlled. The researchers also found that 29 apps leaked user traffic outside the encrypted tunnel, including DNS lookups, and 61 apps sent some data in plain text. Separately, 169 apps made no attempt to disguise their traffic as VPN traffic, even though many advertised that they could beat blocking or unlock restricted content.\u003c/p\u003e\n\n\u003cp\u003eThe study also found privacy and configuration weaknesses beyond traffic leaks. Seventy-six apps sent the device’s Advertising ID, and 246 apps contacted known advertising and tracking servers. In a separate review of OpenVPN configuration files from 108 apps, only one followed every security best practice measured, while many used single-factor authentication, weak or outdated encryption, or settings that disabled encryption entirely.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers tested 281 popular free Android VPN apps from the Google Play Store with a framework called MVPNalyzer and found that apps flagged with at least one problem had more than 2.4 billion installs.","The study found that 29 apps leaked user traffic outside the encrypted tunnel, including 24 that leaked DNS traffic and six that leaked full browsing traffic.","Five apps downloaded configuration files without encryption, allowing an attacker on the same network to rewrite the file and redirect the VPN connection to a server they controlled.","The researchers found that 76 apps sent the device’s Advertising ID and that 246 apps contacted known advertising and tracking servers.","In a separate review of OpenVPN configuration files from 108 apps, only one followed every security best practice measured by the study."],"insights":["The most severe issues, such as cleartext configuration downloads and weak tunnel settings, are invisible to users, so the article says choosing a VPN depends more on trusting the provider than on what the app visibly advertises.","Some apps marketed for bypassing blocking or restricted content made VPN use easy to detect, which the article notes can be especially dangerous for users in countries where using a VPN is itself risky.","Google Play safety labels and the “Verified” badge are described by the study as functioning more like marketing signals than real security guarantees.","The article ties the MVPNalyzer findings to separate 2025 studies, showing that weak engineering, excessive permissions, hidden links between apps, and outdated vulnerable libraries are recurring problems in popular free Android VPN apps."],"referencedReports":[{"title":"MVPNalyzer","url":"https://www.ndss-symposium.org/wp-content/uploads/2026-s1573-paper.pdf","publisher":"University of Michigan, University of New Mexico, and IIT Delhi","context":"The article is based on this NDSS 2026 study describing MVPNalyzer and its findings from testing 281 free Android VPN apps.","category":"","primary":false},{"title":"Hidden Links: Analyzing Secret Families of VPN Apps","url":"https://citizenlab.ca/2025/08/hidden-links-analyzing-secret-families-of-vpn-apps/","publisher":"Citizen Lab and Arizona State University","context":"The article cites this August 2025 research as related evidence that popular Android VPN apps were secretly linked, shared hard-coded passwords, and collected location data.","category":"","primary":false},{"title":"Insecure Mobile VPNs: The Hidden Danger","url":"https://zimperium.com/blog/insecure-mobile-vpns-the-hidden-danger","publisher":"Zimperium","context":"The article cites this October 2025 mobile security analysis as related evidence that some free VPN apps bundled a Heartbleed-vulnerable OpenSSL version and requested excessive permissions.","category":"","primary":false}],"body":"\u003cp\u003eResearchers from the University of Michigan, the University of New Mexico, and IIT Delhi tested 281 popular free Android VPN apps from the Google Play Store using a framework called MVPNalyzer. They found that many apps failed to keep user traffic private and secure, with apps flagged for at least one issue accounting for more than 2.4 billion installs. The system was presented at the NDSS security conference in February 2026 and is described as the first framework built to systematically and repeatedly audit Android VPN apps.\u003c/p\u003e\n\n\u003cp\u003eThe most serious finding involved five apps that downloaded configuration files without encryption, allowing an attacker on the same network to rewrite the file and redirect the VPN connection to a server they controlled. The researchers also found that 29 apps leaked user traffic outside the encrypted tunnel, including DNS lookups, and 61 apps sent some data in plain text. Separately, 169 apps made no attempt to disguise their traffic as VPN traffic, even though many advertised that they could beat blocking or unlock restricted content.\u003c/p\u003e\n\n\u003cp\u003eThe study also found privacy and configuration weaknesses beyond traffic leaks. Seventy-six apps sent the device’s Advertising ID, and 246 apps contacted known advertising and tracking servers. In a separate review of OpenVPN configuration files from 108 apps, only one followed every security best practice measured, while many used single-factor authentication, weak or outdated encryption, or settings that disabled encryption entirely.\u003c/p\u003e\n"},{"n":2,"title":"Former ransomware negotiator gets 4 years for BlackCat attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-ransomware-negotiator-gets-4-years-in-prison-for-blackcat-attacks/","time":"08:17","priority":"SHOULD READ","score":82,"tldr":"Former DigitalMint ransomware negotiator Angelo Martino was sentenced to 70 months in prison for helping carry out BlackCat ransomware attacks against U.S. organizations and sharing victims’ confidential negotiation details to maximize extortion payments.","briefOverview":"\u003cp\u003eFormer DigitalMint employee Angelo Martino was sentenced to 70 months in prison for targeting U.S. companies in BlackCat, also known as ALPHV, ransomware attacks. He was charged and pleaded guilty alongside former Sygnia and DigitalMint ransomware negotiators Kevin Tyler Martin and Ryan Clifford Goldberg. Martin and Goldberg pleaded guilty in December to conspiracy to obstruct commerce by extortion and were sentenced to four years in prison each in May.\u003c/p\u003e\n\n\u003cp\u003eCourt documents said Martino was directly involved in BlackCat ransomware attacks with Goldberg and Martin between April 2023 and April 2025. While operating as BlackCat affiliates, the three demanded ransom payments, threatened to leak stolen data, and encrypted victims’ systems. They paid BlackCat administrators a 20% share of ransom proceeds for access to the ransomware and extortion portal.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Martino also shared confidential information about victims’ insurance policy limits and negotiation positions with BlackCat operators while working as a negotiator for five victims. The victims included at least five U.S. organizations, including a financial services firm that paid \u003cspan class=\"math inline\"\u003e\\(25,660,000 and a nonprofit that paid \\)\u003c/span\u003e26,793,000, as well as school districts, medical facilities, law firms, and other financial services companies. DigitalMint CEO Jonathan Solomon said the company condemned Martin and Martino’s conduct and fired them immediately after their actions were discovered.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former DigitalMint employee Angelo Martino was sentenced to 70 months in prison for targeting U.S. companies in BlackCat ransomware attacks.","Martino pleaded guilty to his role in the attacks along with former Sygnia and DigitalMint ransomware negotiators Kevin Tyler Martin and Ryan Clifford Goldberg.","Court documents said Martino was directly involved in BlackCat ransomware attacks with Goldberg and Martin between April 2023 and April 2025.","Prosecutors said Martino shared confidential information about victims' insurance policy limits and negotiation positions with BlackCat operators while working as a negotiator for five victims.","The victims included at least five U.S. organizations, including a financial services firm that paid $25,660,000 and a nonprofit that paid $26,793,000."],"insights":["The case shows that ransomware negotiators can become especially damaging insiders because they may have access to victims' insurance limits and negotiation positions during active extortion cases.","The three former Sygnia and DigitalMint employees allegedly used BlackCat as affiliates rather than operating the entire ransomware infrastructure themselves, paying the gang's administrators a 20% share of ransom proceeds.","The reported ransom payments from two victims exceeded $25 million each, showing that the attacks described in the case involved unusually high-value extortion outcomes.","Martino was initially identified only as “Co-Conspirator 1” in the indictment before later being named in unsealed court documents, indicating that public attribution of participants unfolded over time through court filings."],"referencedReports":[],"body":"\u003cp\u003eFormer DigitalMint employee Angelo Martino was sentenced to 70 months in prison for targeting U.S. companies in BlackCat, also known as ALPHV, ransomware attacks. He was charged and pleaded guilty alongside former Sygnia and DigitalMint ransomware negotiators Kevin Tyler Martin and Ryan Clifford Goldberg. Martin and Goldberg pleaded guilty in December to conspiracy to obstruct commerce by extortion and were sentenced to four years in prison each in May.\u003c/p\u003e\n\n\u003cp\u003eCourt documents said Martino was directly involved in BlackCat ransomware attacks with Goldberg and Martin between April 2023 and April 2025. While operating as BlackCat affiliates, the three demanded ransom payments, threatened to leak stolen data, and encrypted victims’ systems. They paid BlackCat administrators a 20% share of ransom proceeds for access to the ransomware and extortion portal.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Martino also shared confidential information about victims’ insurance policy limits and negotiation positions with BlackCat operators while working as a negotiator for five victims. The victims included at least five U.S. organizations, including a financial services firm that paid \u003cspan class=\"math inline\"\u003e\\(25,660,000 and a nonprofit that paid \\)\u003c/span\u003e26,793,000, as well as school districts, medical facilities, law firms, and other financial services companies. DigitalMint CEO Jonathan Solomon said the company condemned Martin and Martino’s conduct and fired them immediately after their actions were discovered.\u003c/p\u003e\n"},{"n":13,"title":"China, India ran separate spying campaigns against same Pakistani police force","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/china-india-ran-separate-spy-campaigns-against-same-police-force","time":"13:20","priority":"SHOULD READ","score":82,"tldr":"SentinelOne says China- and India-linked hackers ran separate espionage campaigns against Pakistan’s Balochistan Police for more than two years, in some cases compromising the same systems. The operations targeted sensitive law enforcement data, likely to monitor security threats tied to Chinese interests in Pakistan and the India-Pakistan rivalry.","briefOverview":"\u003cp\u003eSentinelOne reported that hacking groups linked to China and India conducted separate, unconnected espionage operations against Pakistan’s Balochistan Police over more than two years. The activity ran between February 2024 and April 2026 and, in some cases, breached the exact same systems. SentinelLabs said police networks concentrate internal-security data in one place, making them valuable targets.\u003c/p\u003e\n\n\u003cp\u003eThe compromised systems reportedly held criminal records, biometric and fingerprint data, personnel files, hotel and tenant registrations linked to national identity records, and citizen complaints. SentinelLabs assessed that the China-linked activity was mainly driven by Beijing’s interest in protecting Chinese nationals in Pakistan tied to the China-Pakistan Economic Corridor. The India-linked activity was assessed as likely connected to the rivalry between India and Pakistan, including visibility into the conflict around Balochistan.\u003c/p\u003e\n\n\u003cp\u003eThe report described a compromise of the Balochistan Police Complaint Management System, a portal used by officers and citizens checking complaint status. A China-linked operator allegedly planted malware disguised as a portal update, showing a fake “update complete” message while infecting the visitor’s device. SentinelLabs associated the China-nexus activity with tools including PlugX and ShadowPad, while the India-nexus intrusions were tied with lower confidence to TAG-179, overlapping with clusters called Bitter and Mysterious Elephant.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SentinelOne reported that hacking groups linked to China and India conducted separate, unconnected espionage operations against the Balochistan Police in Pakistan between February 2024 and April 2026.","The compromised police systems held sensitive data including criminal records, biometric and fingerprint data, personnel files, hotel and tenant registrations linked to national identity records, and citizen complaints.","SentinelLabs assessed that the China-linked activity was primarily driven by Beijing’s interest in protecting Chinese nationals in Pakistan connected to the China-Pakistan Economic Corridor.","SentinelLabs said the India-linked activity was likely connected to the rivalry between India and Pakistan, including accusations related to the Baloch insurgency and Kashmir.","The report said a China-linked operator planted malware disguised as an update on the Balochistan Police Complaint Management System, exposing both police users and citizens who used the portal."],"insights":["The same police systems were breached by separate China- and India-linked operations, showing that one high-value government database can become a shared target for multiple geopolitical rivals at the same time.","A public-facing complaint portal created risk beyond police staff because citizens checking complaint status could also be exposed to the disguised malware update.","SentinelLabs avoided naming specific Chinese groups and instead grouped activity by toolsets, indicating that shared malware such as PlugX and ShadowPad can support attribution but may not be enough to cleanly separate individual operators.","The article highlights that digitizing and centralizing police records can increase intelligence value for adversaries because many types of internal-security and citizen data become concentrated in one place."],"referencedReports":[{"title":"One Target: China-India Espionage Converge on Pakistani Law Enforcement","url":"https://www.sentinelone.com/labs/one-target-china-india-espionage-converge-on-pakistani-law-enforcement/","publisher":"SentinelOne SentinelLabs","context":"The article is based on SentinelOne research describing separate China- and India-linked espionage operations against the Balochistan Police.","category":"","primary":false}],"body":"\u003cp\u003eSentinelOne reported that hacking groups linked to China and India conducted separate, unconnected espionage operations against Pakistan’s Balochistan Police over more than two years. The activity ran between February 2024 and April 2026 and, in some cases, breached the exact same systems. SentinelLabs said police networks concentrate internal-security data in one place, making them valuable targets.\u003c/p\u003e\n\n\u003cp\u003eThe compromised systems reportedly held criminal records, biometric and fingerprint data, personnel files, hotel and tenant registrations linked to national identity records, and citizen complaints. SentinelLabs assessed that the China-linked activity was mainly driven by Beijing’s interest in protecting Chinese nationals in Pakistan tied to the China-Pakistan Economic Corridor. The India-linked activity was assessed as likely connected to the rivalry between India and Pakistan, including visibility into the conflict around Balochistan.\u003c/p\u003e\n\n\u003cp\u003eThe report described a compromise of the Balochistan Police Complaint Management System, a portal used by officers and citizens checking complaint status. A China-linked operator allegedly planted malware disguised as a portal update, showing a fake “update complete” message while infecting the visitor’s device. SentinelLabs associated the China-nexus activity with tools including PlugX and ShadowPad, while the India-nexus intrusions were tied with lower confidence to TAG-179, overlapping with clusters called Bitter and Mysterious Elephant.\u003c/p\u003e\n"},{"n":21,"title":"Researcher Details WhatsApp-to-Host Attack Chain Using Three OpenClaw Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researcher-details-whatsapp-to-host.html","time":"14:19","priority":"SHOULD READ","score":80,"tldr":"Three now-patched OpenClaw flaws could let attackers trigger credential theft, privilege escalation, sandbox escape, and host code execution, reportedly even from an external WhatsApp message. Users should upgrade to OpenClaw 2026.6.6 and restrict risky tool access such as exec for untrusted or channel-facing agents.","briefOverview":"\u003cp\u003eDetails have emerged about three now-patched security flaws in the OpenClaw personal AI assistant. If successfully exploited, the flaws could enable credential theft, privilege escalation, and arbitrary code execution on the host. The vulnerabilities are tracked as GHSA-hjr6-g723-hmfm, GHSA-9969-8g9h-rxwm, and GHSA-575v-8hfq-m3mc, with CVSS scores of 8.8, 8.8, and 8.4 respectively. All three issues were addressed in OpenClaw version 2026.6.6.\u003c/p\u003e\n\n\u003cp\u003eOpenClaw maintainers said the practical impact depends on the operator\u0026rsquo;s configuration and whether lower-trust input can reach the affected path. Security researcher Chinmohan Nayak, who discovered and reported the issues, said they can be used to trigger host code execution from an external message sent via WhatsApp. The article says these newly identified bugs differ from the earlier Claw Chain vulnerabilities because they do not require an attacker to establish a prior foothold. Potential outcomes include extracting sensitive data, dropping a persistent backdoor, obtaining arbitrary remote code execution, and escaping to the host.\u003c/p\u003e\n\n\u003cp\u003eOne flaw, GHSA-575v-8hfq-m3mc, involves path traversal and link following that could allow sandbox bind mounts to bypass parent-directory denylist checks. Nayak said the bind mount denylist blocks directories such as \u0026ldquo;\u003cem\u003e/.ssh,\u0026rdquo; \u0026ldquo;\u003c/em\u003e/.aws,\u0026rdquo; and \u0026ldquo;~/.gnupg,\u0026rdquo; but allows mounting parent directories such as \u0026ldquo;/home\u0026rdquo; or \u0026ldquo;/var,\u0026rdquo; undermining those blocks. The article recommends updating OpenClaw, enabling sandbox mode for all non-main sessions, removing \u0026ldquo;exec\u0026rdquo; from the tool allowlist for channel-facing agents, and monitoring for git clone commands containing the \u0026ldquo;ext::\u0026rdquo; external protocol helper.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three now-patched high-severity flaws in the OpenClaw personal AI assistant could enable credential theft, privilege escalation, and arbitrary code execution on the host.","The vulnerabilities are tracked as GHSA-hjr6-g723-hmfm, GHSA-9969-8g9h-rxwm, and GHSA-575v-8hfq-m3mc, and all three were fixed in OpenClaw version 2026.6.6.","Security researcher Chinmohan Nayak said the flaws can be used to trigger host code execution from an external message sent via WhatsApp.","GHSA-575v-8hfq-m3mc involves a path traversal and link following issue that could allow sandbox bind mounts to bypass parent-directory denylist checks.","The article recommends upgrading OpenClaw, enabling sandbox mode for all non-main sessions, removing exec from the tool allowlist for channel-facing agents, and monitoring for git clone commands using the ext:: external protocol helper."],"insights":["The researcher’s reported WhatsApp-to-host chain shows that lower-trust external messages can become dangerous when they are allowed to reach AI agent paths with host execution capabilities.","The bind mount issue was not just about blocked sensitive folders, because mounting a broader parent directory such as /home or /var could undermine blocks on specific paths like ~/.ssh, ~/.aws, and ~/.gnupg.","The article highlights Docker socket exposure through /var as especially consequential, because it could allow a full host escape from inside the sandbox.","The recommended mitigations focus on limiting what channel-facing agents can do, showing that OpenClaw risk depends heavily on tool allowlists, shared Gateway use, and whether untrusted users can reach affected features."],"referencedReports":[{"title":"GHSA-hjr6-g723-hmfm","url":"https://github.com/openclaw/openclaw/security/advisories/GHSA-hjr6-g723-hmfm","publisher":"OpenClaw","context":"The article cites this OpenClaw security advisory as one of three high-severity flaws fixed in OpenClaw version 2026.6.6.","category":"","primary":false},{"title":"GHSA-9969-8g9h-rxwm","url":"https://github.com/openclaw/openclaw/security/advisories/GHSA-9969-8g9h-rxwm","publisher":"OpenClaw","context":"The article cites this OpenClaw security advisory as one of three high-severity flaws affecting the host execution environment filtering mechanism.","category":"","primary":false},{"title":"GHSA-575v-8hfq-m3mc","url":"https://github.com/openclaw/openclaw/security/advisories/GHSA-575v-8hfq-m3mc","publisher":"OpenClaw","context":"The article cites this OpenClaw security advisory for a path traversal and link following issue involving sandbox bind mounts.","category":"","primary":false},{"title":"I Sent a WhatsApp Message to an AI Agent. It Ran My Code on the Host.","url":"https://medium.com/@chinmohannayak/i-sent-a-whatsapp-message-to-an-ai-agent-it-ran-my-code-on-the-host-adbbcbb0e0ad","publisher":"Chinmohan Nayak","context":"The article says researcher Chinmohan Nayak shared this report detailing how the flaws can trigger host code execution from an external WhatsApp message.","category":"","primary":false}],"body":"\u003cp\u003eDetails have emerged about three now-patched security flaws in the OpenClaw personal AI assistant. If successfully exploited, the flaws could enable credential theft, privilege escalation, and arbitrary code execution on the host. The vulnerabilities are tracked as GHSA-hjr6-g723-hmfm, GHSA-9969-8g9h-rxwm, and GHSA-575v-8hfq-m3mc, with CVSS scores of 8.8, 8.8, and 8.4 respectively. All three issues were addressed in OpenClaw version 2026.6.6.\u003c/p\u003e\n\n\u003cp\u003eOpenClaw maintainers said the practical impact depends on the operator\u0026rsquo;s configuration and whether lower-trust input can reach the affected path. Security researcher Chinmohan Nayak, who discovered and reported the issues, said they can be used to trigger host code execution from an external message sent via WhatsApp. The article says these newly identified bugs differ from the earlier Claw Chain vulnerabilities because they do not require an attacker to establish a prior foothold. Potential outcomes include extracting sensitive data, dropping a persistent backdoor, obtaining arbitrary remote code execution, and escaping to the host.\u003c/p\u003e\n\n\u003cp\u003eOne flaw, GHSA-575v-8hfq-m3mc, involves path traversal and link following that could allow sandbox bind mounts to bypass parent-directory denylist checks. Nayak said the bind mount denylist blocks directories such as \u0026ldquo;\u003cem\u003e/.ssh,\u0026rdquo; \u0026ldquo;\u003c/em\u003e/.aws,\u0026rdquo; and \u0026ldquo;~/.gnupg,\u0026rdquo; but allows mounting parent directories such as \u0026ldquo;/home\u0026rdquo; or \u0026ldquo;/var,\u0026rdquo; undermining those blocks. The article recommends updating OpenClaw, enabling sandbox mode for all non-main sessions, removing \u0026ldquo;exec\u0026rdquo; from the tool allowlist for channel-facing agents, and monitoring for git clone commands containing the \u0026ldquo;ext::\u0026rdquo; external protocol helper.\u003c/p\u003e\n"},{"n":3,"title":"Ryuk ransomware member pleads guilty in the US, faces 15 years in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ryuk-ransomware-member-pleads-guilty-in-the-us-faces-15-years-in-prison/","time":"17:46","priority":"SHOULD READ","score":78,"tldr":"Karen Serobovich Vardanyan, an Armenian man accused of helping deploy Ryuk ransomware against U.S. organizations, has pleaded guilty after extradition and faces up to 15 years in prison. Prosecutors say the group received about 1,610 BTC in ransom payments, while Vardanyan agreed to pay more than $1.1 million in restitution.","briefOverview":"\u003cp\u003eKaren Serobovich Vardanyan, a 34-year-old Armenian man, has pleaded guilty in the United States to hacking U.S. companies and deploying Ryuk ransomware to encrypt their systems. He was extradited to the United States after being arrested in Kyiv in April 2025 for providing initial access to corporate networks. Court documents say he helped deploy Ryuk on multiple U.S. organizations between November 2019 and April 2020 after illegally accessing their systems.\u003c/p\u003e\n\n\u003cp\u003eThe U.S. Department of Justice said Vardanyan and his co-conspirators accessed victim networks and deployed ransomware on hundreds of compromised servers and workstations. In one attack, a Michigan company paid 200 BTC, worth more than \u003cspan class=\"math inline\"\u003e\\(1.1 million at the time, and prosecutors also noted attacks on a technology company in Wilsonville, Oregon, and a school in Texas. The DoJ said the group received about 1,610 bitcoins in ransom payments, valued at around \\)\u003c/span\u003e15 million at the time.\u003c/p\u003e\n\n\u003cp\u003eRyuk operated from 2018 until mid-2020 and carried out high-profile attacks across nearly every sector, including healthcare providers during the COVID-19 pandemic. The article says the group was estimated at its peak to have hacked around 20 organizations every week and made more than \u003cspan class=\"math inline\"\u003e\\(150 million. Vardanyan is scheduled to be sentenced in September 2026 and faces up to 15 years in prison, two fines of \\)\u003c/span\u003e250,000, and more than $1.1 million in restitution under his plea agreement.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Karen Serobovich Vardanyan, a 34-year-old Armenian man, pleaded guilty to hacking U.S. companies and deploying Ryuk ransomware to encrypt their systems.","Vardanyan was arrested in Kyiv in April 2025, extradited to the United States, and had been indicted by a federal grand jury in Portland in February 2024.","Court documents say Vardanyan helped deploy Ryuk ransomware on multiple U.S. organizations between November 2019 and April 2020 after illegally accessing their systems.","The U.S. Department of Justice said Vardanyan and his co-conspirators received about 1,610 bitcoins in ransom payments, valued at around $15 million at the time.","Vardanyan is scheduled to be sentenced in September 2026 and faces a maximum sentence of 15 years in prison, fines of $250,000 for each of two charges, and more than $1.1 million in restitution."],"insights":["The case highlights that people accused of providing initial access to corporate networks can face prosecution years after the ransomware operation itself shuts down.","The article links Ryuk’s shutdown to members moving into Conti and later splintering into other cybercrime groups, showing how ransomware activity can persist even after a named group disappears.","The cited ransom totals show a large gap between the broader group’s alleged receipts of about 1,610 bitcoins and Vardanyan’s agreed restitution of more than $1.1 million.","Ryuk’s targeting of healthcare providers during the COVID-19 pandemic shows that the group’s activity affected sectors where disruption could have serious real-world consequences."],"referencedReports":[],"body":"\u003cp\u003eKaren Serobovich Vardanyan, a 34-year-old Armenian man, has pleaded guilty in the United States to hacking U.S. companies and deploying Ryuk ransomware to encrypt their systems. He was extradited to the United States after being arrested in Kyiv in April 2025 for providing initial access to corporate networks. Court documents say he helped deploy Ryuk on multiple U.S. organizations between November 2019 and April 2020 after illegally accessing their systems.\u003c/p\u003e\n\n\u003cp\u003eThe U.S. Department of Justice said Vardanyan and his co-conspirators accessed victim networks and deployed ransomware on hundreds of compromised servers and workstations. In one attack, a Michigan company paid 200 BTC, worth more than \u003cspan class=\"math inline\"\u003e\\(1.1 million at the time, and prosecutors also noted attacks on a technology company in Wilsonville, Oregon, and a school in Texas. The DoJ said the group received about 1,610 bitcoins in ransom payments, valued at around \\)\u003c/span\u003e15 million at the time.\u003c/p\u003e\n\n\u003cp\u003eRyuk operated from 2018 until mid-2020 and carried out high-profile attacks across nearly every sector, including healthcare providers during the COVID-19 pandemic. The article says the group was estimated at its peak to have hacked around 20 organizations every week and made more than \u003cspan class=\"math inline\"\u003e\\(150 million. Vardanyan is scheduled to be sentenced in September 2026 and faces up to 15 years in prison, two fines of \\)\u003c/span\u003e250,000, and more than $1.1 million in restitution under his plea agreement.\u003c/p\u003e\n"},{"n":10,"title":"License plate cameras may be next target after Supreme Court reins in location tracking","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/license-plate-cameras-may-be-next-target-after-supreme-court-reins-in-location-tracking","time":"16:50","priority":"SHOULD READ","score":78,"tldr":"A recent Supreme Court ruling requiring warrants for cell phone geofence searches could strengthen legal challenges against police use of automated license plate reader databases. Experts say the decision may reshape how law enforcement can access large-scale retrospective location data, though ALPR vendor Flock Safety argues the ruling does not apply to license plate cameras.","briefOverview":"\u003cp\u003eA recent Supreme Court ruling in Chatrie v. United States found that searches of cell phone location history require a warrant. The case involved Google providing police with a list of phones inside a geofence near a crime scene during a particular time period. Legal scholars and opponents of automated license plate readers say the ruling could affect how police use ALPR data.\u003c/p\u003e\n\n\u003cp\u003eFlock Safety, described as the country’s leading ALPR vendor, says it has between 90,000 and 100,000 cameras installed on public roadways and collects data on about 20 billion license plates a month. Michael Soyfer of the Institute for Justice said the ruling focused on the retrospective and indiscriminate nature of location surveillance, which he said also applies to ALPR data. He also said the court emphasized the overall capabilities of a database, not only what police accessed in a specific instance.\u003c/p\u003e\n\n\u003cp\u003eFlock Safety said the ruling is not relevant to its technology because Google location history comes from a person’s mobile device and reveals continuous movements across public and private places, while Flock’s ALPR system captures point-in-time images of vehicles in public view. Andrew Guthrie Ferguson said modern ALPRs connect to larger police and public databases containing information such as social media activity, surveillance video, body camera footage, drone footage, gunshot sensor data, and dashboard camera footage. He said Chatrie strengthens the Fourth Amendment case against warrantless collection of ALPR data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Supreme Court’s Chatrie v. United States ruling found that searches of cell phone location history require a warrant and could affect the use of automated license plate readers.","Flock Safety says it has between 90,000 and 100,000 license plate reader cameras on public roadways and collects data on about 20 billion license plates each month.","Michael Soyfer of the Institute for Justice said the ruling emphasized the retrospective and indiscriminate nature of location surveillance, which he said also applies to automated license plate reader data.","Flock Safety said the Supreme Court decision is not relevant to its technology because Google location history comes from a person’s mobile device while its license plate readers capture point-in-time images of vehicles in public view.","Andrew Guthrie Ferguson said modern license plate readers connect to larger police and public databases that can contain social media activity, surveillance video, body camera footage, drone footage, gunshot sensor data, and dashboard camera footage."],"insights":["The ruling’s focus on what police could access across an entire database, rather than only what they actually viewed in a specific case, may make the overall capabilities of surveillance systems legally important.","Even short time windows of location data were treated as potentially sensitive because they can reveal visits to places such as psychiatrists, abortion clinics, AIDS treatment centers, strip clubs, or by-the-hour motels.","Legal challenges to automated license plate readers may depend less on the cameras alone and more on how their data is combined with other police and public databases to build detailed records about people.","Flock Safety’s defense rests on a distinction between continuous phone-based tracking across public and private places and point-in-time vehicle images captured in public view."],"referencedReports":[],"body":"\u003cp\u003eA recent Supreme Court ruling in Chatrie v. United States found that searches of cell phone location history require a warrant. The case involved Google providing police with a list of phones inside a geofence near a crime scene during a particular time period. Legal scholars and opponents of automated license plate readers say the ruling could affect how police use ALPR data.\u003c/p\u003e\n\n\u003cp\u003eFlock Safety, described as the country’s leading ALPR vendor, says it has between 90,000 and 100,000 cameras installed on public roadways and collects data on about 20 billion license plates a month. Michael Soyfer of the Institute for Justice said the ruling focused on the retrospective and indiscriminate nature of location surveillance, which he said also applies to ALPR data. He also said the court emphasized the overall capabilities of a database, not only what police accessed in a specific instance.\u003c/p\u003e\n\n\u003cp\u003eFlock Safety said the ruling is not relevant to its technology because Google location history comes from a person’s mobile device and reveals continuous movements across public and private places, while Flock’s ALPR system captures point-in-time images of vehicles in public view. Andrew Guthrie Ferguson said modern ALPRs connect to larger police and public databases containing information such as social media activity, surveillance video, body camera footage, drone footage, gunshot sensor data, and dashboard camera footage. He said Chatrie strengthens the Fourth Amendment case against warrantless collection of ALPR data.\u003c/p\u003e\n"},{"n":11,"title":"Europe revives law allowing big tech to scan for CSAM","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/chat-control-2-csam-scans-european-parliament-passage","time":"19:30","priority":"SHOULD READ","score":78,"tldr":"The European Parliament revived a legal exemption allowing major tech companies like Google, Microsoft and Meta to voluntarily scan users’ messages for child sexual abuse material until 2028. Critics say the procedural vote undermined privacy protections and foreshadows a larger fight over “Chat Control 2.0,” which could mandate scanning even in encrypted services.","briefOverview":"\u003cp\u003eThe European Parliament voted to revive a rule allowing big tech companies to voluntarily scan users’ messages for child sexual abuse material. The rule dates to 2021 and had expired in April after lawmakers could not agree on how to proceed amid privacy objections. The renewed legal cover allows companies such as Google, Microsoft, and Meta to continue these scans until 2028.\u003c/p\u003e\n\n\u003cp\u003eThe vote took place the day before summer recess under an unusual procedure that required an absolute majority to block the provision, meaning absent lawmakers counted in practice as support for it. Critics said this was especially concerning because Parliament had rejected the same measure three months earlier under normal circumstances. A larger debate continues over a proposed permanent framework called Chat Control 2.0, which in its most extreme form could require providers to scan conversations and hosted content, including in end-to-end encrypted communications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Parliament voted to revive a 2021 rule allowing big tech companies to voluntarily scan users’ messages for child sexual abuse material.","The revived rule gives companies such as Google, Microsoft, and Meta legal cover to continue CSAM scanning until 2028.","The vote used an unusual procedure requiring an absolute majority to kill the provision, meaning absent lawmakers were effectively counted in favor of the measure.","Critics said the procedural move was disturbing because Parliament had rejected the same measure three months earlier under normal circumstances.","A larger dispute continues over a proposed permanent framework called Chat Control 2.0, which could force service providers to scan conversations and hosted content, including end-to-end encrypted communications."],"insights":["The measure passed despite more present lawmakers opposing it than supporting it because the procedure treated absent lawmakers as votes in favor unless an absolute majority voted to kill the provision.","The revived rule does not authorize scanning on encrypted platforms like Signal, while the separate proposed Chat Control 2.0 framework could extend scanning obligations to end-to-end encrypted communications.","Big tech companies continued CSAM scanning after the prior legal basis expired in April, but European officials warned that doing so without renewed legal protection was risky.","Critics described the procedural strategy as especially notable because Parliament had rejected the same measure three months earlier under normal voting conditions."],"referencedReports":[],"body":"\u003cp\u003eThe European Parliament voted to revive a rule allowing big tech companies to voluntarily scan users’ messages for child sexual abuse material. The rule dates to 2021 and had expired in April after lawmakers could not agree on how to proceed amid privacy objections. The renewed legal cover allows companies such as Google, Microsoft, and Meta to continue these scans until 2028.\u003c/p\u003e\n\n\u003cp\u003eThe vote took place the day before summer recess under an unusual procedure that required an absolute majority to block the provision, meaning absent lawmakers counted in practice as support for it. Critics said this was especially concerning because Parliament had rejected the same measure three months earlier under normal circumstances. A larger debate continues over a proposed permanent framework called Chat Control 2.0, which in its most extreme form could require providers to scan conversations and hosted content, including in end-to-end encrypted communications.\u003c/p\u003e\n"},{"n":12,"title":"Ryuk operator pleads guilty; Blackcat/AlphV conspirator gets nearly 6-year sentence","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ryuk-operator-pleads-guilty-alphv-conspirator-sentenced","time":"17:01","priority":"SHOULD READ","score":78,"tldr":"U.S. prosecutors advanced major ransomware cases as a Ryuk operator pleaded guilty to deploying ransomware against organizations, while a former ransomware negotiator was sentenced to 70 months for helping BlackCat/AlphV extort victims. The cases highlight continued law enforcement pressure on ransomware crews and insiders who aid them.","briefOverview":"\u003cp\u003eU.S. prosecutors announced two milestones in cases involving major ransomware groups. Karen Serobovich Vardanyan, a 34-year-old Armenian national, pleaded guilty in an Oregon federal court to conspiracy and computer fraud tied to Ryuk ransomware. Angelo Martino, 41, of Land O’Lakes, Florida, received a 70-month federal prison sentence for helping the BlackCat/AlphV gang extort multiple victims beginning in April 2023.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Vardanyan accessed companies’ computer networks for about six months beginning in November 2019 to deploy Ryuk ransomware. They said he and co-conspirators attacked a Michigan company that paid 200 bitcoin, worth more than $1.1 million at the time, as well as a company in Wilsonville, Oregon, and a school in Texas. Vardanyan was extradited from Ukraine to the United States in June 2025 after his arrest in Kyiv in April, and his sentencing is scheduled for September 22.\u003c/p\u003e\n\n\u003cp\u003eMartino pleaded guilty in April to an extortion charge after surrendering to U.S. Marshals in March. Prosecutors said he was paid by BlackCat attackers to provide confidential information about the negotiating positions and strategies of his employer’s clients so the attackers could maximize ransom payments. Two other men connected to the same case, Ryan Goldberg and Kevin Martin, pleaded guilty to extortion charges earlier this year and received four-year prison sentences in May.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Karen Serobovich Vardanyan, a 34-year-old Armenian national, pleaded guilty in an Oregon federal court to conspiracy and computer fraud for accessing company networks to deploy Ryuk ransomware beginning in November 2019.","Vardanyan was extradited from Ukraine to the United States in June 2025 after being arrested in Kyiv in April, and he faces up to 15 years in prison, up to $500,000 in fines, and more than $1.1 million in restitution.","Prosecutors said Vardanyan and co-conspirators attacked a Michigan company that paid 200 bitcoin, an Oregon company in Wilsonville, and a school in Texas.","Angelo Martino of Land O’Lakes, Florida, received a 70-month federal prison sentence for helping the BlackCat/AlphV gang extort multiple victims beginning in April 2023.","Prosecutors said Martino was paid by BlackCat attackers to provide confidential information about his employer’s clients’ negotiating positions and strategies so the attackers could maximize ransom payments."],"insights":["The Martino case shows that ransomware response roles can create a serious insider risk, because prosecutors said he used confidential negotiation information from his employer’s clients to help attackers increase ransom payments.","DigitalMint’s response points to a concrete control lesson: the company now requires negotiations to happen on cloud-based platforms that can be audited and logged, with a founder personally overseeing negotiations.","The Ryuk case shows how long ransomware prosecutions can take, with conduct beginning in November 2019, an arrest in Kyiv in April 2025, extradition in June 2025, and sentencing scheduled for September 2025.","The article links Ryuk enforcement to a broader international effort, including prior prosecution of a money launderer, sanctions against alleged members, and related charges against suspects in France and outside custody."],"referencedReports":[],"body":"\u003cp\u003eU.S. prosecutors announced two milestones in cases involving major ransomware groups. Karen Serobovich Vardanyan, a 34-year-old Armenian national, pleaded guilty in an Oregon federal court to conspiracy and computer fraud tied to Ryuk ransomware. Angelo Martino, 41, of Land O’Lakes, Florida, received a 70-month federal prison sentence for helping the BlackCat/AlphV gang extort multiple victims beginning in April 2023.\u003c/p\u003e\n\n\u003cp\u003eProsecutors said Vardanyan accessed companies’ computer networks for about six months beginning in November 2019 to deploy Ryuk ransomware. They said he and co-conspirators attacked a Michigan company that paid 200 bitcoin, worth more than $1.1 million at the time, as well as a company in Wilsonville, Oregon, and a school in Texas. Vardanyan was extradited from Ukraine to the United States in June 2025 after his arrest in Kyiv in April, and his sentencing is scheduled for September 22.\u003c/p\u003e\n\n\u003cp\u003eMartino pleaded guilty in April to an extortion charge after surrendering to U.S. Marshals in March. Prosecutors said he was paid by BlackCat attackers to provide confidential information about the negotiating positions and strategies of his employer’s clients so the attackers could maximize ransom payments. Two other men connected to the same case, Ryan Goldberg and Kevin Martin, pleaded guilty to extortion charges earlier this year and received four-year prison sentences in May.\u003c/p\u003e\n"},{"n":16,"title":"Ransomware Negotiator Gets 70 Months in Prison for Aiding BlackCat Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ransomware-negotiator-gets-70-months-in.html","time":"08:10","priority":"SHOULD READ","score":78,"tldr":"Former ransomware negotiator Angelo Martino was sentenced to 70 months in U.S. prison for secretly helping BlackCat operators extort his own clients by sharing their confidential negotiation and insurance details. Prosecutors said he also helped target additional victims with two other cybersecurity professionals, while authorities have seized $10 million in illicit assets.","briefOverview":"\u003cp\u003eAngelo Martino, a 41-year-old former ransomware negotiator from Land O\u0026rsquo;Lakes, Florida, was sentenced to 70 months in U.S. prison for conspiring with the now-defunct BlackCat ransomware operators. He pleaded guilty in April to one count of conspiring to interfere with interstate commerce through extortion. Federal prosecutors described him as a “double agent” who worked to maximize harm to his clients and financial gain for the cybercriminals who paid him part of the ransom.\u003c/p\u003e\n\n\u003cp\u003eMartino worked as a negotiator for five ransomware victims while secretly giving BlackCat attackers confidential information about those victims’ negotiating positions and strategies. The information included details about victims’ insurance policy limits and internal negotiation positions, which prosecutors said allowed the operators to maximize the ransom amounts victims were required to pay. Justice Department officials said victims described how their businesses were nearly destroyed after hiring people they expected to help them.\u003c/p\u003e\n\n\u003cp\u003eMartino was also accused of colluding with Ryan Goldberg of Georgia and Kevin Martin of Texas to deploy BlackCat ransomware against multiple U.S. victims between April 2023 and November 2023. Martino and Martin were employed at DigitalMint, while Goldberg worked as an incident response manager for Sygnia, and both Goldberg and Martin were sentenced to four years in prison in May 2026. The Justice Department said law enforcement has seized $10 million in assets from Martino, including digital currency, vehicles, a food truck, and a luxury fishing boat, and a court hearing is scheduled for September 17, 2026, to determine restitution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Angelo Martino, a 41-year-old former ransomware negotiator from Land O'Lakes, Florida, was sentenced to 70 months in U.S. prison for conspiring with BlackCat ransomware operators to extort multiple victims.","Federal prosecutors said Martino worked as a negotiator for five ransomware victims while secretly giving BlackCat attackers confidential information about the victims' negotiation positions, strategies, and insurance policy limits.","Martino pleaded guilty in April to one count of conspiring to interfere with interstate commerce through extortion.","Martino was also accused of colluding with Ryan Goldberg and Kevin Martin to deploy BlackCat ransomware against multiple U.S. victims between April 2023 and November 2023.","The Justice Department said law enforcement has seized $10 million in assets from Martino, including digital currency, vehicles, a food truck, and a luxury fishing boat."],"insights":["The case shows that sensitive details shared during ransom negotiations, such as insurance policy limits and internal negotiating positions, can directly increase the amount victims are pressured to pay if exposed to the attackers.","The people accused or convicted in the scheme were not only outside criminals but cybersecurity professionals working in negotiation and incident response roles, highlighting that trusted crisis advisers can become part of the harm to victims.","Federal prosecutors treated Martino’s conduct as more than passive information sharing, describing him as a “double agent” who maximized both victim harm and criminal financial gain.","The Justice Department’s seizure of digital currency, vehicles, a food truck, and a luxury fishing boat shows that authorities pursued proceeds converted into both crypto assets and physical property."],"referencedReports":[],"body":"\u003cp\u003eAngelo Martino, a 41-year-old former ransomware negotiator from Land O\u0026rsquo;Lakes, Florida, was sentenced to 70 months in U.S. prison for conspiring with the now-defunct BlackCat ransomware operators. He pleaded guilty in April to one count of conspiring to interfere with interstate commerce through extortion. Federal prosecutors described him as a “double agent” who worked to maximize harm to his clients and financial gain for the cybercriminals who paid him part of the ransom.\u003c/p\u003e\n\n\u003cp\u003eMartino worked as a negotiator for five ransomware victims while secretly giving BlackCat attackers confidential information about those victims’ negotiating positions and strategies. The information included details about victims’ insurance policy limits and internal negotiation positions, which prosecutors said allowed the operators to maximize the ransom amounts victims were required to pay. Justice Department officials said victims described how their businesses were nearly destroyed after hiring people they expected to help them.\u003c/p\u003e\n\n\u003cp\u003eMartino was also accused of colluding with Ryan Goldberg of Georgia and Kevin Martin of Texas to deploy BlackCat ransomware against multiple U.S. victims between April 2023 and November 2023. Martino and Martin were employed at DigitalMint, while Goldberg worked as an incident response manager for Sygnia, and both Goldberg and Martin were sentenced to four years in prison in May 2026. The Justice Department said law enforcement has seized $10 million in assets from Martino, including digital currency, vehicles, a food truck, and a luxury fishing boat, and a court hearing is scheduled for September 17, 2026, to determine restitution.\u003c/p\u003e\n"},{"n":27,"title":"The Email With Nothing to Scan: A 1 MB HTML Attachment That Renders Its Own Phishing Page","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/html-attachment-local-render-no-url-to-scan","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing email from an authenticated first-time Gmail sender used a large self-contained HTML attachment that rendered the credential-harvesting page locally, leaving no URL for gateways to reputation-check and exceeding deep inspection limits. The key defense is behavioral and post-delivery detection, not relying on SPF/DKIM/DMARC or static scanning alone.","briefOverview":"\u003cp\u003eAn external first-time Gmail sender delivered a short email with the body text “Full report” and a 1 MB HTML attachment named like a completed report. SPF, DKIM, DMARC, and ARC all passed because the message was genuinely sent through Gmail and signed by a gmail.com key. The article classifies the activity as high-severity phishing for credential harvesting and maps it to MITRE ATT\u0026amp;CK T1566.001 and T1027.\u003c/p\u003e\n\n\u003cp\u003eThe attachment rendered its phishing page locally in the recipient’s browser, so there was no malicious URL in the message for a Secure Email Gateway to extract and reputation-check. A static scan returned clean, and deeper content-level analysis failed because the file exceeded the analyzer’s processing limit. The article says the important detection signals were behavioral and contextual, including a first-time external sender, no prior correspondence, a high-risk flag, and a one-line body pushing a large attachment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An external first-time Gmail sender delivered a one-line email with a 1 MB HTML attachment named like a full report.","SPF, DKIM, DMARC, and ARC all passed because the message was genuinely sent through Gmail and signed by a gmail.com key.","The HTML attachment rendered its phishing page locally in the browser, so no malicious URL appeared in the message for a Secure Email Gateway to reputation-check.","The static scan returned a clean verdict, and deeper content-level inspection failed because the file exceeded the analyzer’s processing limit.","The article says the useful detection signals were behavioral indicators such as a first-time external sender, no prior correspondence, a high-risk flag, and a one-line body pushing a large attachment."],"insights":["Passing SPF, DKIM, DMARC, and ARC did not reduce the risk in this case, because those checks only showed the message really came through Gmail and did not prove the sender’s intent was legitimate.","The attachment’s size was part of the evasion technique, since it prevented the deeper analyzer from completing the very inspection needed to reveal embedded forms, scripts, redirects, or remote resource calls.","A clean static scan was only provisional in this scenario, because the article says the malicious behavior may become confirmable only after delivery, in a sandbox, or after a user report.","The most useful pre-open signals were relational and contextual rather than signature-based: first-time external sender, no prior correspondence, high-risk sender flag, and a minimal body whose only purpose was to push a large attachment."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites it for statistics attributing 16% of breaches to phishing as the initial-access vector and 39% to stolen credentials.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references it as documenting a steady shift toward identity-based and evasive delivery.","category":"","primary":false},{"title":"FBI IC3 2024 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites it for ranking phishing as the most-reported crime type by complaint volume.","category":"","primary":false},{"title":"IBM Cost of a Data Breach 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"IBM","context":"The article references it to emphasize that the cost of a single breach makes one missed attachment significant.","category":"","primary":false}],"body":"\u003cp\u003eAn external first-time Gmail sender delivered a short email with the body text “Full report” and a 1 MB HTML attachment named like a completed report. SPF, DKIM, DMARC, and ARC all passed because the message was genuinely sent through Gmail and signed by a gmail.com key. The article classifies the activity as high-severity phishing for credential harvesting and maps it to MITRE ATT\u0026amp;CK T1566.001 and T1027.\u003c/p\u003e\n\n\u003cp\u003eThe attachment rendered its phishing page locally in the recipient’s browser, so there was no malicious URL in the message for a Secure Email Gateway to extract and reputation-check. A static scan returned clean, and deeper content-level analysis failed because the file exceeded the analyzer’s processing limit. The article says the important detection signals were behavioral and contextual, including a first-time external sender, no prior correspondence, a high-risk flag, and a one-line body pushing a large attachment.\u003c/p\u003e\n"},{"n":25,"title":"Laser Attack Resets Tangem Wallet Passwords on Cards That Can't Be Patched","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/laser-attack-resets-tangem-wallet.html","time":"14:51","priority":"MAY READ","score":72,"tldr":"Ledger Donjon researchers showed that a costly, invasive laser fault-injection attack can reset passwords on Tangem wallet cards without the old password or backup card, potentially letting someone with physical possession move funds. The risk is low for most users because it requires a specialized lab and visibly destroys the card, but lost or stolen cards holding significant value should be treated as unsafe.","briefOverview":"\u003cp\u003eLedger’s Donjon security team showed that a precisely timed laser pulse aimed at the chip inside a Tangem crypto wallet card can reset the card’s password to a value chosen by an attacker. Once reset, the attacker can control the wallet and move the coins out without knowing the old password or using a backup card. The attack requires physical possession of the card, cutting it open, specialized equipment estimated at about $250,000, and cannot be done over the internet.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is tied to Tangem’s password reset process, where the card checks whether it is in recovery mode before accepting a new password. Donjon found that a laser pulse can disturb the chip at the exact moment of that check, making the card behave as if it were in recovery mode when it is not. Turning recovery off does not help because the same check still runs on every card.\u003c/p\u003e\n\n\u003cp\u003eThe issue cannot be patched because Tangem cards do not support firmware updates, a design Tangem presents as protection against remote tampering. Tangem said the practical risk is virtually non-existent for everyday users because the method is lab-only, costly, invasive, and gives an attacker no easy way to know whether a stolen card holds significant value. The article says the main affected group is anyone whose Tangem card is lost or stolen and holds serious value, and advises moving funds using another card in the set or a seed phrase if one was set up.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ledger's Donjon security team demonstrated that a precisely timed laser pulse aimed at the chip inside a Tangem crypto wallet card can reset the card's password to an attacker-chosen value.","The attack requires physical possession of the card, cutting it open to expose the chip, specialized equipment estimated at about $250,000, and cannot be performed over the internet.","Tangem cards cannot receive firmware updates, so cards already sold cannot be patched against this flaw.","Tangem said the method is a lab-only physical attack, noted that Donjon belongs to rival Ledger, and argued that the practical risk for everyday users is virtually non-existent.","The article advises users whose Tangem card is lost or stolen and holds serious value to move their funds using another card in the set or a seed phrase if available."],"insights":["Turning off Tangem’s recovery feature does not mitigate the issue, because the same recovery-mode check still runs on every card.","Tangem’s no-update design prevents remote tampering, but it also means firmware-level flaws such as this laser-reset issue cannot be corrected after cards are sold.","The practical danger is concentrated in a narrow scenario: a lost, stolen, or seized Tangem card that an attacker already has reason to believe holds enough value to justify an expensive invasive attack.","The attack targets wallet-maker code layered on top of a certified secure chip, showing that the chip’s EAL6+ certification does not cover all security decisions in the finished wallet product.","Unlike Tangem, Trezor and Tropic Square were able to respond to a related laser fault-injection finding with a stopgap for current chips and hardening for the next silicon version."],"referencedReports":[{"title":"Bypassing Tangem Card Security with Laser Attack","url":"https://donjon.ledger.com/blog/bypassing-tangem-card-security-with-laser-attack/","publisher":"Ledger Donjon","context":"The article relies on Donjon’s report describing the laser fault-injection method used to reset Tangem card passwords.","category":"","primary":false},{"title":"Trezor response: TROPIC01 chip disclosure, no impact to your funds","url":"https://trezor.io/blog/news/Trezor-response-TROPIC01-chip-disclosure-no-impact-to-your-funds","publisher":"Trezor","context":"The article cites this disclosure as a related laser fault-injection finding involving the TROPIC01 chip in the Trezor Safe 7.","category":"","primary":false},{"title":"Unfixable Key Extraction Attack on Trezor","url":"https://www.ledger.com/blog/unfixable-key-extraction-attack-on-trezor","publisher":"Ledger","context":"The article references this earlier Ledger work as an example of cheaper physical attacks against older Trezor wallets.","category":"","primary":false},{"title":"Tangem Genuine Check Bypass on Android Application","url":"https://www.ledger.com/tangem-genuine-check-bypass-on-android-application","publisher":"Ledger","context":"The article cites this as a prior Ledger finding on Tangem’s Android app that could be patched in software.","category":"","primary":false},{"title":"Brute Force Attack: Tangem","url":"https://www.ledger.com/blog-brute-force-attack-tangem","publisher":"Ledger","context":"The article cites this as an earlier Tangem password brute-force method that sits in the card firmware and cannot be changed.","category":"","primary":false}],"body":"\u003cp\u003eLedger’s Donjon security team showed that a precisely timed laser pulse aimed at the chip inside a Tangem crypto wallet card can reset the card’s password to a value chosen by an attacker. Once reset, the attacker can control the wallet and move the coins out without knowing the old password or using a backup card. The attack requires physical possession of the card, cutting it open, specialized equipment estimated at about $250,000, and cannot be done over the internet.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is tied to Tangem’s password reset process, where the card checks whether it is in recovery mode before accepting a new password. Donjon found that a laser pulse can disturb the chip at the exact moment of that check, making the card behave as if it were in recovery mode when it is not. Turning recovery off does not help because the same check still runs on every card.\u003c/p\u003e\n\n\u003cp\u003eThe issue cannot be patched because Tangem cards do not support firmware updates, a design Tangem presents as protection against remote tampering. Tangem said the practical risk is virtually non-existent for everyday users because the method is lab-only, costly, invasive, and gives an attacker no easy way to know whether a stolen card holds significant value. The article says the main affected group is anyone whose Tangem card is lost or stolen and holds serious value, and advises moving funds using another card in the set or a seed phrase if one was set up.\u003c/p\u003e\n"},{"n":5,"title":"Money launderer accused of stealing seized crypto while in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/money-launderer-accused-of-stealing-seized-crypto-while-in-prison/","time":"15:30","priority":"MAY READ","score":65,"tldr":"Bulgarian money launderer Rossen Iossifov has been charged with allegedly stealing and laundering $290,000 in government-seized cryptocurrency while already serving a federal prison sentence. Prosecutors say the funds were tied to his earlier role laundering millions for an online auction fraud network that victimized Americans.","briefOverview":"\u003cp\u003eBulgarian national Rossen G. Iossifov has been charged with stealing $290,000 in government-seized cryptocurrency while serving a 121-month prison sentence. He appeared in federal court in the Eastern District of Kentucky on charges of removal of property to prevent seizure and conspiracy to commit money laundering. Prosecutors said he allegedly conspired with others in January 2024 to move cryptocurrency from a seized account and keep it out of the government’s hands.\u003c/p\u003e\n\n\u003cp\u003eThe case follows Iossifov’s 2021 conviction tied to RG Coins, a cryptocurrency exchange he owned and operated in Sofia, Bulgaria. Prosecutors said RG Coins served Romanian members of the Alexandria Online Auction Fraud Network, which victimized at least 900 Americans through fake Craigslist and eBay ads for high-value goods, typically vehicles. The article says Iossifov allegedly helped convert victims’ payments into cryptocurrency and transfer the funds to foreign money launderers.\u003c/p\u003e\n\n\u003cp\u003eCourt documents cited in the article say Iossifov collected more than \u003cspan class=\"math inline\"\u003e\\(184,000 after laundering nearly \\)\u003c/span\u003e5 million for four network members in under three years. Evidence showed he tailored his business to criminal clients by offering favorable exchange rates and allowing cash-for-cryptocurrency trades without identification or documentation of the source of funds. The court ordered him to pay more than $2.6 million in restitution to victims and to forfeit the cryptocurrency at issue in the new case, and he faces up to 25 years in prison if convicted of the new charges.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bulgarian national Rossen G. Iossifov has been charged in the Eastern District of Kentucky with stealing $290,000 in government-seized cryptocurrency while serving a 121-month prison sentence.","Prosecutors allege that in January 2024 Iossifov conspired with others to move the cryptocurrency from a seized account through multiple crypto exchanges and mixing services to keep it from the government.","Iossifov’s earlier conviction stemmed from his ownership and operation of RG Coins, a cryptocurrency exchange in Sofia, Bulgaria, used by Romanian members of the Alexandria Online Auction Fraud Network.","The fraud network posted fake Craigslist and eBay ads for high-value goods, typically vehicles, and victimized at least 900 Americans before converting payments into cryptocurrency.","Court documents say Iossifov collected more than $184,000 after laundering nearly $5 million for four network members, and he faces up to 25 years in prison if convicted of the new charges."],"insights":["The alleged theft occurred while Iossifov was already incarcerated, showing that imprisonment did not prevent prosecutors from alleging continued involvement in moving cryptocurrency through outside collaborators.","The case highlights that seized cryptocurrency can remain a target after court action, especially when access or control over accounts is not fully neutralized.","Iossifov’s prior exchange business allegedly enabled fraud by allowing cash-to-cryptocurrency trades without identification or documentation of where the money came from.","The earlier fraud operation combined ordinary consumer platforms, including Craigslist and eBay, with cryptocurrency conversion to move proceeds from fake vehicle sales to foreign money launderers."],"referencedReports":[],"body":"\u003cp\u003eBulgarian national Rossen G. Iossifov has been charged with stealing $290,000 in government-seized cryptocurrency while serving a 121-month prison sentence. He appeared in federal court in the Eastern District of Kentucky on charges of removal of property to prevent seizure and conspiracy to commit money laundering. Prosecutors said he allegedly conspired with others in January 2024 to move cryptocurrency from a seized account and keep it out of the government’s hands.\u003c/p\u003e\n\n\u003cp\u003eThe case follows Iossifov’s 2021 conviction tied to RG Coins, a cryptocurrency exchange he owned and operated in Sofia, Bulgaria. Prosecutors said RG Coins served Romanian members of the Alexandria Online Auction Fraud Network, which victimized at least 900 Americans through fake Craigslist and eBay ads for high-value goods, typically vehicles. The article says Iossifov allegedly helped convert victims’ payments into cryptocurrency and transfer the funds to foreign money launderers.\u003c/p\u003e\n\n\u003cp\u003eCourt documents cited in the article say Iossifov collected more than \u003cspan class=\"math inline\"\u003e\\(184,000 after laundering nearly \\)\u003c/span\u003e5 million for four network members in under three years. Evidence showed he tailored his business to criminal clients by offering favorable exchange rates and allowing cash-for-cryptocurrency trades without identification or documentation of the source of funds. The court ordered him to pay more than $2.6 million in restitution to victims and to forfeit the cryptocurrency at issue in the new case, and he faces up to 25 years in prison if convicted of the new charges.\u003c/p\u003e\n"},{"n":29,"title":"Cybercriminals Flock to Healthcare Businesses as Attacks Surge","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/cybercriminals-flock-to-healthcare-businesses-as-attacks-surge/","time":"18:17","priority":"MAY READ","score":55,"tldr":"Healthcare cyberattacks are rising fastest against service providers and other healthcare businesses, more than doubling in early 2026, while hospitals continue to face social engineering, impersonation, legacy device, staffing, and third-party risk challenges.","briefOverview":"\u003cp\u003eCyberattacks against hospitals and clinics grew modestly in the first half of 2026, while attacks on service providers and other healthcare businesses more than doubled. The article says cybercriminals are increasingly focusing on healthcare businesses beyond hospitals and clinics. It also notes that hospitals are seeing more impersonation and social engineering-driven attacks.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, said hospital CISOs he talks to are taking these threats seriously. He described their top challenge as having enough resources to protect hospital networks, including budget for experienced cybersecurity talent and needed technology. Weiss also said legacy medical device complexity, always-on clinical operations, and heavy third-party dependence mean attackers still see many opportunities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyberattacks against hospitals and clinics grew modestly in the first half of 2026.","Attacks on service providers and other healthcare businesses more than doubled in the first half of 2026.","Hospitals are seeing more impersonation and social engineering-driven attacks, according to Health-ISAC chief security officer Errol Weiss.","Errol Weiss said hospital CISOs are taking these threats seriously but face resource challenges in protecting hospital networks.","Errol Weiss cited legacy medical device complexity, always-on clinical operations, and heavy third-party dependence as structural realities that give attackers opportunities."],"insights":["The article frames healthcare service providers and other healthcare businesses as a faster-growing target than hospitals and clinics, suggesting attackers are shifting attention toward the broader healthcare ecosystem.","Errol Weiss identifies resource limits as hospital CISOs’ top challenge, indicating that awareness of the threat is not the main problem described in the article.","The article highlights that healthcare security risk is shaped by practical operating constraints, including legacy medical devices, nonstop clinical operations, and reliance on third parties."],"referencedReports":[],"body":"\u003cp\u003eCyberattacks against hospitals and clinics grew modestly in the first half of 2026, while attacks on service providers and other healthcare businesses more than doubled. The article says cybercriminals are increasingly focusing on healthcare businesses beyond hospitals and clinics. It also notes that hospitals are seeing more impersonation and social engineering-driven attacks.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, said hospital CISOs he talks to are taking these threats seriously. He described their top challenge as having enough resources to protect hospital networks, including budget for experienced cybersecurity talent and needed technology. Weiss also said legacy medical device complexity, always-on clinical operations, and heavy third-party dependence mean attackers still see many opportunities.\u003c/p\u003e\n"},{"n":30,"title":"One admin equals one risk: Why cyber protection needs role-based control","source":"acronis.com","sourceColorIdx":10,"link":"https://www.acronis.com/en/tru/posts/one-admin-equals-one-risk-why-cyber-protection-needs-role-based-control/","time":"06:03","priority":"MAY READ","score":55,"tldr":"Acronis Cyber Protect Cloud includes built-in roles for least-privilege access, but only about 4.8% of active customer tenants use any fitted specialty role, leaving most organizations over-reliant on default admin privileges. The key recommendation is for customers and MSPs to narrow access now by assigning role-based permissions such as cyber administrator, protection administrator, read-only, restore operator, or security analyst instead of broad administrator rights.","briefOverview":"\u003cp\u003eThe article argues that role-based control is a key security practice inside Acronis Cyber Protect Cloud because it lets each technician receive only the access needed for a specific job. It cites least-privilege, separation-of-duties, and accountability expectations from frameworks such as NIST SP 800-53, NIST SP 800-207, ISO/IEC 27001:2022, CIS Controls v8, and ENISA guidance for SMEs. Acronis Cyber Protect Cloud includes built-in roles for company administration, cyber administration, protection administration, detection and response, remote monitoring and management, audit oversight, File Sync and Share, and Partner Portal access.\u003c/p\u003e\n\n\u003cp\u003eThe article’s central finding is that the role catalog is lightly used across active customer tenants. Only about 4.8% of customer tenants have granted at least one fitted specialty role alongside defaults, about 95.2% have granted none, and only about 1.15% have granted two or more. About 33.9% of customer tenants have no local administrator account at all because they are administered entirely from the managing partner level, which means many least-privilege decisions happen on the partner side rather than inside the customer tenant.\u003c/p\u003e\n\n\u003cp\u003eWhere fitted roles are used, Administrator (protection) leads at about 2.41% of customer tenants, followed by File Sync and Share roles, read-only administrator (protection), cyber administrator, and security analyst. Cyber administrator averages about 1.24 named administrators in tenants that use it, while security analyst averages about 14 named analysts per tenant when Managed Detection and Response is purchased. The article recommends that SMBs, managed service providers, and customers working with MSPs reduce routine use of default administrator roles, map work to fitted roles, and review access entitlements quarterly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Across all active Acronis Cyber Protect Cloud customer tenants, only about 4.8% have granted at least one fitted specialty role alongside the defaults, while roughly 95.2% have granted none.","About 33.9% of customer tenants have no local administrator account because they are administered entirely from the managing partner level.","The most adopted fitted customer role is Administrator (protection) at about 2.41% of customer tenants, followed by File Sync and Share user at 1.11%, File Sync and Share administrator at 0.94%, read-only administrator (protection) at 0.77%, cyber administrator at 0.58%, and security analyst at 0.10%.","About 3.35% of partner tenants have granted at least one Partner Portal role, and Partner Portal Administrator is the most adopted partner role at 2%.","The article recommends that SMBs, MSPs, and customers working with MSPs reduce routine use of default administrator roles and use fitted roles such as cyber administrator, administrator (protection), read-only administrator (protection), restore operator, and security analyst."],"insights":["The adoption gap is not only a customer-side problem because about one-third of customer tenants have no local administrator at all, meaning many least-privilege decisions are actually made by managing partners.","Using two or more fitted roles is a practical signal of real separation of duties, but only about 1.15% of customer tenants reach that threshold, and only about 0.2% do so when limited to administrative and security roles.","Security analyst is rare at the platform-wide tenant level, but when Managed Detection and Response is purchased it is delegat
