other issues, including 12 remote-code-execution flaws and 89 privilege-escalation flaws rated critical or high severity.","Pixel users can install the update through Settings, then Security \u0026 privacy, System \u0026 updates, and Security update."],"insights":["The actively exploited flaw is in the cellular modem, meaning the described attacker position is on a nearby or adjacent network rather than requiring the phone owner to interact with a malicious link or app.","Google’s description says the flaw requires an attacker to already have basic privileges on the targeted device, but it can then provide higher privileges through a low-complexity logic error.","Pixel devices receive their own security bulletins and updates separately from the standard monthly Android patches because Google directly controls their hardware platform and exclusive features.","Beyond the actively exploited modem issue, the update includes 12 remote-code-execution flaws and 89 privilege-escalation flaws rated critical or high severity."],"referencedReports":[{"title":"Pixel Update Bulletin—September 2026","url":"https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01","publisher":"google","context":"The article directs readers to Google’s security bulletin for more information on the September 2026 Pixel device updates.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle released its September 2026 security patches for Pixel devices, fixing 110 vulnerabilities. The update includes CVE-2026-58704, a high-severity cellular modem flaw that Google says may be under limited, targeted exploitation. Google urged owners of supported devices to install the 2026-09-05 patch level.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-58704 is caused by authorization and protection failures, including a logic error that can bypass permissions in the cellular modem. An attacker on an adjacent network who already has basic privileges on a targeted device could gain higher privileges without user interaction. The bulletin also covers 109 additional issues, including 12 remote-code-execution vulnerabilities and 89 privilege-escalation vulnerabilities rated critical or high severity.\u003c/p\u003e\n"},{"n":1,"title":"Windows Server 2022 reaches end of mainstream support next month","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-server-2022-reaches-end-of-mainstream-support-next-month/","time":"09:10","priority":"MAY READ","score":72,"tldr":"Windows Server 2022 will leave mainstream support on October 13, 2026, but will continue receiving free monthly security updates under extended support through October 14, 2031. Microsoft advises organizations to begin planning and testing upgrades to Windows Server 2025.","briefOverview":"\u003cp\u003eMicrosoft has reminded customers that Windows Server 2022 will reach the end of mainstream support on October 13, 2026. The October 2026 security update will be the final update issued during mainstream support. The operating system will then move to extended support, with monthly security updates at no additional cost through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has extended hotpatching for Windows Server 2022 Datacenter: Azure Edition through October 2027. The company recommends that administrators plan and test upgrades to Windows Server 2025 before Windows Server 2022 reaches the end of support. Windows Server 2025 is the latest Long-Term Servicing Channel release, with mainstream support ending on November 13, 2029, and extended support continuing until November 14, 2034.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Windows Server 2022 will reach the end of mainstream support on October 13, 2026, and its October 2026 security update will be the final update in that support phase.","Windows Server 2022 will receive monthly security updates at no additional cost during extended support through October 14, 2031.","Hotpatching for Windows Server 2022 Datacenter: Azure Edition has been extended through October 2027.","Microsoft advises administrators to evaluate and test an upgrade to Windows Server 2025 before Windows Server 2022 reaches the end of support.","Windows Server 2025 will reach the end of mainstream support on November 13, 2029, followed by extended support through November 14, 2034."],"insights":["Organizations using Windows Server 2022 do not need to immediately lose security updates when mainstream support ends, because free monthly security updates continue through October 2031 under extended support.","The hotpatching extension applies only to Windows Server 2022 Datacenter: Azure Edition and ends in October 2027, earlier than the overall extended-support end date.","Microsoft provides a free 180-day Windows Server 2025 trial, allowing organizations to test upgrades before deployment."],"referencedReports":[{"title":"Windows Server 2022 reaches end of mainstream support on October 13, 2026","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#4939","publisher":"microsoft","context":"The article cites Microsoft's Windows Message Center notice for the October 2026 mainstream-support end date and the transition to extended support through October 2031.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft has reminded customers that Windows Server 2022 will reach the end of mainstream support on October 13, 2026. The October 2026 security update will be the final update issued during mainstream support. The operating system will then move to extended support, with monthly security updates at no additional cost through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft has extended hotpatching for Windows Server 2022 Datacenter: Azure Edition through October 2027. The company recommends that administrators plan and test upgrades to Windows Server 2025 before Windows Server 2022 reaches the end of support. Windows Server 2025 is the latest Long-Term Servicing Channel release, with mainstream support ending on November 13, 2029, and extended support continuing until November 14, 2034.\u003c/p\u003e\n"},{"n":3,"title":"How to Mitigate the Lethal Trifecta That Infects 98% of Agents","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/how-to-mitigate-the-lethal-trifecta-that-infects-98-of-agents","time":"07:01","priority":"MAY READ","score":45,"tldr":"AI agents become highly vulnerable to prompt-injection-driven data theft when they combine access to sensitive data, untrusted content, and outbound actions. Reduce the risk by separating these capabilities across agents and enforcing least privilege, content inspection, DLP, and action controls.","briefOverview":"\u003cp\u003eThe article discusses the “lethal trifecta” for AI agents: access to private data, exposure to untrusted content, and the ability to communicate externally or take consequential actions. It states that when all three capabilities coexist, malicious instructions embedded in documents, emails, web pages, images, or third-party responses can trick an agent into accessing sensitive information and sending it to an attacker. The article distinguishes prompt injection, which targets applications built on language models, from jailbreaking, which attempts to bypass protections built into the models themselves.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends designing workflows so that no single agent has all three capabilities, such as separating a document-reading agent from an action-taking agent that cannot directly access untrusted material. For existing agents that cannot immediately be redesigned, it recommends identifying agent capabilities, inspecting incoming content, converting documents to flat PDFs, restricting privileges and approved tools, applying data-loss-prevention policies, and governing outbound actions. It also recommends analyzing prompts and responses for jailbreaks, prompt injections, and multi-turn attacks, while noting that employees may create personal agents without knowing how to secure them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes the AI-agent “lethal trifecta” as the combination of access to private data, exposure to untrusted content, and the ability to communicate or act externally.","When an agent has all three capabilities, malicious instructions in untrusted content can trick it into accessing private data and sending it to an attacker.","The article distinguishes prompt injection, which attacks applications built on language models, from jailbreaking, which attempts to bypass protections built into the models themselves.","The article recommends designing automation as multiple agents, such as separating a document-reading agent from an action-taking agent that does not directly receive untrusted content.","For agents that cannot immediately be redesigned, the article recommends discovering agent capabilities, inspecting incoming content, enforcing least-privilege access and data-loss controls, governing agent actions, and analyzing prompts and responses for malicious instructions."],"insights":["The article argues that the most effective architectural safeguard is to ensure no single AI agent simultaneously handles untrusted material, sensitive data, and external actions.","An action-taking agent can be constrained to accept instructions only from authenticated internal orchestrators, rather than directly from arbitrary external content.","Converting common document formats to flat PDFs before AI agents consume them is proposed as a way to reduce risk from documents that may contain executable code or malicious instructions.","Controlling outbound actions is presented as particularly significant because it can break the path that allows an agent’s access to private data and untrusted input to result in data theft.","The article notes that personal agents created by employees may lack security safeguards because people may not know how to build them more safely."],"referencedReports":[{"title":"The AI Agent Lethal Trifecta","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-ai-agent-lethal-trifecta-capability-securi/","publisher":"cloud-security-alliance","context":"The article cites this Cloud Security Alliance research note as the source for the claim that 98% of agents possess the lethal trifecta and uses its architectural framing and agent-separation examples.","category":"research","primary":true}],"body":"\u003cp\u003eThe article discusses the “lethal trifecta” for AI agents: access to private data, exposure to untrusted content, and the ability to communicate externally or take consequential actions. It states that when all three capabilities coexist, malicious instructions embedded in documents, emails, web pages, images, or third-party responses can trick an agent into accessing sensitive information and sending it to an attacker. The article distinguishes prompt injection, which targets applications built on language models, from jailbreaking, which attempts to bypass protections built into the models themselves.\u003c/p\u003e\n\n\u003cp\u003eThe article recommends designing workflows so that no single agent has all three capabilities, such as separating a document-reading agent from an action-taking agent that cannot directly access untrusted material. For existing agents that cannot immediately be redesigned, it recommends identifying agent capabilities, inspecting incoming content, converting documents to flat PDFs, restricting privileges and approved tools, applying data-loss-prevention policies, and governing outbound actions. It also recommends analyzing prompts and responses for jailbreaks, prompt injections, and multi-turn attacks, while noting that employees may create personal agents without knowing how to secure them.\u003c/p\u003e\n"}]</script>
