<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers use n-day exploits in zero-click attacks on iOS, Android devices","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-use-n-day-exploits-in-zero-click-attacks-on-ios-android-devices/","time":"09:39","priority":"MUST READ","score":94,"tldr":"APT29-linked attackers used compromised and spoofed websites to silently profile iOS and Android visitors and deliver device-specific exploit chains that stole cookies, credentials, messaging data, and other sensitive information. Apple and Google have patched the exploited flaws, so users should install the latest available updates.","briefOverview":"\u003cp\u003eSekoia linked a large-scale watering-hole campaign to the Russian APT29 group with moderate-to-high confidence. The operation targeted iOS and Android users who visited compromised legitimate websites or lookalike domains impersonating real portals in the United States, Ukraine, the Czech Republic, and Bulgaria. The attackers also compromised Plerdy’s SEO tracker, which was loaded by thousands of websites, mostly in Ukraine, from August 27 through September 3.\u003c/p\u003e\n\n\u003cp\u003eInjected JavaScript first profiled visitors’ devices and browser versions, then a command-and-control server delivered a matching exploit chain without requiring the victim to interact. The iOS chains could steal Safari cookies, WhatsApp and Telegram databases, Keychain credentials, location data, and photos, while the Android chain used AndroSnitch to collect Chrome cookies, login data, browsing history, and saved Wi-Fi credentials. Apple and Google have patched all flaws used in the campaign, and Sekoia said the payloads did not establish persistence, meaning a reboot stops the malicious activity unless the user visits a compromised site again.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sekoia attributed a large-scale watering-hole campaign to APT29 with moderate-to-high confidence, targeting iOS and Android users through compromised websites and lookalike domains.","Injected JavaScript profiled visitors’ devices and browser versions, after which a command-and-control server delivered platform-specific exploit chains without requiring user interaction.","The iOS exploit chains targeted Safari cookies and, on iOS 18.5, could collect WhatsApp and Telegram databases, Keychain credentials, location data, and photos.","The Android chain targeted Chrome versions 139 through 145 except 143 and used AndroSnitch to collect Chrome cookies, login data, browsing history, and saved Wi-Fi credentials.","Apple and Google have patched the vulnerabilities used in the campaign, and Sekoia said the payloads did not establish persistence, so rebooting ends the malicious activity until the victim revisits a compromised site."],"insights":["The compromise of Plerdy’s SEO tracker exposed visitors across thousands of sites, mostly in Ukraine, between August 27 and September 3 rather than relying only on individually compromised websites.","The lookalike America250 and Raffles London at The OWO domains relayed content from the genuine sites, making the fraudulent sites appear more convincing while enabling attackers to intercept visitors.","The campaign used already-known flaws with available fixes rather than undisclosed flaws, making timely Apple and Google updates a direct protective measure.","The analyzed payloads did not remain active after a reboot, but a device could be targeted again if its user revisited a compromised site."],"referencedReports":[{"title":"Poisoned Source: APT29 watering holes targets mobile devices with n-day exploits","url":"https://www.sekoia.com/blog/poisoned-source-apt29-watering-holes-targets-mobile-devices-with-n-day-exploits","publisher":"sekoia","context":"The article relies on Sekoia's analysis for attribution of the watering-hole campaign to APT29, the exploit chains used, and the lack of persistence in the payloads.","category":"research","primary":true}],"body":"\u003cp\u003eSekoia linked a large-scale watering-hole campaign to the Russian APT29 group with moderate-to-high confidence. The operation targeted iOS and Android users who visited compromised legitimate websites or lookalike domains impersonating real portals in the United States, Ukraine, the Czech Republic, and Bulgaria. The attackers also compromised Plerdy’s SEO tracker, which was loaded by thousands of websites, mostly in Ukraine, from August 27 through September 3.\u003c/p\u003e\n\n\u003cp\u003eInjected JavaScript first profiled visitors’ devices and browser versions, then a command-and-control server delivered a matching exploit chain without requiring the victim to interact. The iOS chains could steal Safari cookies, WhatsApp and Telegram databases, Keychain credentials, location data, and photos, while the Android chain used AndroSnitch to collect Chrome cookies, login data, browsing history, and saved Wi-Fi credentials. Apple and Google have patched all flaws used in the campaign, and Sekoia said the payloads did not establish persistence, meaning a reboot stops the malicious activity unless the user visits a compromised site again.\u003c/p\u003e\n"},{"n":2,"title":"Google Issues Patches for Critical Android Flaw That Could Allow RCE Without User Interaction","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/google-patches-critical-android-flaw.html","time":"07:46","priority":"MUST READ","score":92,"tldr":"Google’s November 2026 Android security update fixes CVE-2026-58868, a critical heap buffer overflow affecting Android 14–17 that could enable remote code execution without user interaction. Users should install the 2026-11-01 patch level or later, while the 2026-11-05 level includes all November fixes.","briefOverview":"\u003cp\u003eGoogle’s November 2026 Android security bulletin fixes CVE-2026-58868, a Critical flaw that could allow remote code execution without any user interaction. The issue affects Android 14 through 17 and is fixed by the 2026-11-01 security patch level or later. As of November 4, Google had not reported known exploitation of the bulletin’s vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-58868 is an out-of-bounds write caused by a heap buffer overflow in the \u003ccode\u003eonOutputReceived\u003c/code\u003e function of \u003ccode\u003eFrameDecoder.cpp\u003c/code\u003e. Google’s bulletin and the CVE record do not explain how an attacker could reach the affected code, and Google’s Critical rating assumes built-in Android and Google-service protections are disabled or bypassed. The 2026-11-05 patch level includes all November fixes, including issues in the kernel and components from Arm, Imagination Technologies, MediaTek, Unisoc, and Qualcomm.\u003c/p\u003e\n\n\u003cp\u003eThe bulletin also includes CVE-2026-58882, a Critical issue in Android’s WAP Push text-message code that could enable a remote denial-of-service attack without user interaction. A related researcher write-up says a malformed WAP Push message can crash the phone service, terminate active calls including emergency calls, and trigger repeated crashes during startup because the device retries the message. Google’s November bulletin lists 216 vulnerabilities in total, including 23 rated Critical.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google’s November 2026 Android security bulletin fixes CVE-2026-58868, a critical flaw affecting Android 14 through 17 that could allow remote code execution without user interaction.","CVE-2026-58868 is an out-of-bounds write caused by a heap buffer overflow in the onOutputReceived function in FrameDecoder.cpp.","Android devices need the 2026-11-01 security patch level or later for fixes covering CVE-2026-58868, while the 2026-11-05 patch level covers every flaw in the November bulletin.","Another critical flaw, CVE-2026-58882, could allow a remote denial-of-service attack through Android’s WAP Push SMS message code without user interaction.","Google’s November bulletin lists 216 vulnerabilities, including 23 rated Critical, and reported no known exploitation as of November 4."],"insights":["The Android security update date, rather than the Google Play system update date, is the one users must check for CVE-2026-58868 because that flaw is not included in this month’s Google Play system update list.","Google uses two November patch levels: 2026-11-01 delivers fixes common across Android devices sooner, while 2026-11-05 includes additional fixes for the kernel and components from hardware vendors.","A malformed WAP Push text message described in the article can crash the phone service without appearing in the recipient’s inbox, and the phone may crash again at startup as it retries processing the message.","The reported WAP Push issue can end an active call, including an emergency call, and requires an attacker to know only the target’s phone number."],"referencedReports":[{"title":"Android Security Bulletin—November 2026","url":"https://source.android.com/docs/security/bulletin/2026/2026-11-01","publisher":"google","context":"The article relies on Google’s November security bulletin for details on CVE-2026-58868, affected Android versions, patch levels, and other vulnerabilities.","category":"advisory","primary":true},{"title":"SMS of Death","url":"https://smsofdeath.com/","publisher":"mark-b","context":"The article cites this researcher write-up about a malformed WAP Push message that can crash Android’s phone service, while noting it does not confirm whether it is CVE-2026-58882.","category":"research","primary":false},{"title":"MediaTek Product Security Bulletin—November 2026","url":"https://www.mediatek.com/product-security-bulletin/November-2026","publisher":"mediatek","context":"The article references MediaTek’s November bulletin for its description of critical modem flaws as out-of-bounds writes and its statement that it was unaware of active exploitation.","category":"advisory","primary":false}],"body":"\u003cp\u003eGoogle’s November 2026 Android security bulletin fixes CVE-2026-58868, a Critical flaw that could allow remote code execution without any user interaction. The issue affects Android 14 through 17 and is fixed by the 2026-11-01 security patch level or later. As of November 4, Google had not reported known exploitation of the bulletin’s vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-58868 is an out-of-bounds write caused by a heap buffer overflow in the \u003ccode\u003eonOutputReceived\u003c/code\u003e function of \u003ccode\u003eFrameDecoder.cpp\u003c/code\u003e. Google’s bulletin and the CVE record do not explain how an attacker could reach the affected code, and Google’s Critical rating assumes built-in Android and Google-service protections are disabled or bypassed. The 2026-11-05 patch level includes all November fixes, including issues in the kernel and components from Arm, Imagination Technologies, MediaTek, Unisoc, and Qualcomm.\u003c/p\u003e\n\n\u003cp\u003eThe bulletin also includes CVE-2026-58882, a Critical issue in Android’s WAP Push text-message code that could enable a remote denial-of-service attack without user interaction. A related researcher write-up says a malformed WAP Push message can crash the phone service, terminate active calls including emergency calls, and trigger repeated crashes during startup because the device retries the message. Google’s November bulletin lists 216 vulnerabilities in total, including 23 rated Critical.\u003c/p\u003e\n"},{"n":4,"title":"UK Cybercrime Journal: Beacon CRM Breach Impacts Over 1,500 Charities","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/11/uk-cybercrime-journal-beacon-crm-breach.html","time":"10:00","priority":"SHOULD READ","score":84,"tldr":"Beacon CRM exposed database backups for more than 1,000 UK charities after an AWS access key was leaked in public JavaScript artifacts, putting donor and service-user personal data at risk. The incident underscores the supply-chain impact of poor secret management and overly broad cloud access permissions.","briefOverview":"\u003cp\u003eBeacon CRM, a UK customer relationship management platform serving more than 1,500 non-profit and charitable organisations, suffered a cyber incident in late July 2026. Attackers reportedly gained access around 27 July using an AWS access key exposed in publicly accessible JavaScript build files. Between 27 and 28 July, they downloaded full database backups containing records from more than 1,000 UK charity customers.\u003c/p\u003e\n\n\u003cp\u003eThe backups contained names, email addresses, phone numbers, home addresses, donation histories, and uploaded files such as Gift Aid declarations and user notes, although they did not contain payment card numbers or live bank details. Some charities said older records and information that people had requested be deleted were retained in backups and were therefore exposed. Beacon detected the activity on 29 July, revoked the credentials, and began notifying affected organisations from 30 July to 3 August.\u003c/p\u003e\n\n\u003cp\u003eThe article says the incident demonstrates how a security problem at a central software supplier can affect many smaller organisations that rely on it. It also warns that the exposed information could be used for targeted scams, phishing, and identity fraud against donors and vulnerable service users. Its recommended measures include automated secret scanning before software is published, limiting what cloud access keys can reach, planning for supplier incidents, and rotating connected credentials after an upstream compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beacon CRM reported that attackers used an AWS access key exposed in publicly accessible JavaScript build artifacts to gain access around 27 July 2026.","From 27 to 28 July 2026, the attackers downloaded full database backups containing records from more than 1,000 UK charity customers.","The affected backups included names, email addresses, phone numbers, home addresses, donation histories, and uploaded attachments, but did not contain payment card numbers or live bank details.","Beacon CRM detected the unauthorised activity on 29 July, revoked the exposed credentials, and began notifying affected organisations between 30 July and 3 August.","The article states that some stored backups contained historical records and data that individuals had previously requested be deleted."],"insights":["The incident shows that data retained in backups can expose people’s historical records even after they have requested deletion from the live system.","Although payment card numbers and live bank details were not stored in the affected database, the combination of contact details, home addresses, donation histories, Gift Aid declarations, and user notes can support targeted scams and identity fraud.","A publicly exposed application-layer AWS key was able to access full database backups, highlighting the importance of ensuring such credentials cannot read or export sensitive backup stores.","Because Beacon CRM served more than 1,500 non-profit and charitable organisations, one supplier credential exposure created a cascading incident for many organisations with limited in-house security resources."],"referencedReports":[{"title":"Beacon Cyber Security Incident Final Report - September 2026","url":"https://cdn.prod.website-files.com/6369f7fe243b240624080be7/6a99303116408f423ae78fe2_200e7238def89b6f82b7a023e5adb7b8_Beacon%20Cyber%20Security%20Incident%20Final%20Report%20-%20September%202026.pdf","publisher":"beacon-crm","context":"The article lists Beacon's final incident report as a relevant source for the breach details.","category":"research","primary":true},{"title":"Guidance for charities affected by the Beacon cyber security incident","url":"https://www.gov.uk/government/news/guidance-for-charities-affected-by-the-beacon-cyber-security-incident","publisher":"uk-government","context":"The article lists UK government guidance for charities affected by the Beacon CRM incident.","category":"advisory","primary":false}],"body":"\u003cp\u003eBeacon CRM, a UK customer relationship management platform serving more than 1,500 non-profit and charitable organisations, suffered a cyber incident in late July 2026. Attackers reportedly gained access around 27 July using an AWS access key exposed in publicly accessible JavaScript build files. Between 27 and 28 July, they downloaded full database backups containing records from more than 1,000 UK charity customers.\u003c/p\u003e\n\n\u003cp\u003eThe backups contained names, email addresses, phone numbers, home addresses, donation histories, and uploaded files such as Gift Aid declarations and user notes, although they did not contain payment card numbers or live bank details. Some charities said older records and information that people had requested be deleted were retained in backups and were therefore exposed. Beacon detected the activity on 29 July, revoked the credentials, and began notifying affected organisations from 30 July to 3 August.\u003c/p\u003e\n\n\u003cp\u003eThe article says the incident demonstrates how a security problem at a central software supplier can affect many smaller organisations that rely on it. It also warns that the exposed information could be used for targeted scams, phishing, and identity fraud against donors and vulnerable service users. Its recommended measures include automated secret scanning before software is published, limiting what cloud access keys can reach, planning for supplier incidents, and rotating connected credentials after an upstream compromise.\u003c/p\u003e\n"},{"n":3,"title":"Russian Police Arrest 3 Suspected VasyGrek Hackers, Dismantle Criminal Infrastructure","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/russian-police-arrest-3-suspected.html","time":"08:17","priority":"SHOULD READ","score":82,"tldr":"Russian police arrested three suspected members of the financially motivated VasyGrek (Fluffy Wolf) hacking group and dismantled infrastructure used to phish organizations and steal funds. The group has targeted organizations across Russia, Belarus, and Kazakhstan using phishing-delivered malware and remote-access tools.","briefOverview":"\u003cp\u003eRussian authorities arrested three suspected members of the VasyGrek, or Fluffy Wolf, threat group and said they dismantled its criminal infrastructure. The Russian Interior Ministry said the suspects are accused of stealing money from organizational accounts and creating, distributing, and using malicious software. Searches of residences and offices resulted in the seizure of computers, communication devices, and other evidence.\u003c/p\u003e\n\n\u003cp\u003eIn one September 2025 case, the attackers allegedly sent a phishing email disguised as business correspondence with a supposed reconciliation report, which led to malware execution and the theft of 660,000 rubles from an organization\u0026rsquo;s bank account. Authorities said the group used phishing domains imitating financial and accounting services, foreign-hosted virtual servers, and covert remote-administration tools obtained from the dark web. Kaspersky recorded more than 100 attempted VasyGrek attacks against organizations in Russia, Belarus, and Kazakhstan from January through September 2026, primarily affecting metallurgical organizations, wholesale suppliers, government agencies, and several other sectors.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russian authorities arrested three suspected VasyGrek members, searched their residences and offices, and seized computers, communication devices, and other evidence.","The Russian Interior Ministry said the group is suspected of stealing funds from organizational accounts and creating, distributing, and using malicious software.","In a September 2025 case, attackers allegedly sent a fake business email carrying a supposed reconciliation report, leading to the theft of 660,000 rubles from an unnamed organization.","Kaspersky recorded more than 100 attempted VasyGrek attacks against organizations in Russia, Belarus, and Kazakhstan between January and September 2026.","The group primarily targeted metallurgical organizations, wholesale suppliers, and government agencies, while healthcare, oil and gas, energy, finance, and agriculture organizations were also affected."],"insights":["VasyGrek reportedly combined a large network of fake financial and accounting websites with servers located abroad, making its phishing operations harder to trace and disrupt.","The group expanded beyond its earlier focus on Russian organizations to include potential victims in Belarus and Kazakhstan during 2026.","Its use of legitimate online services to host harmful components and multi-stage delivery methods was specifically intended to conceal activity and complicate investigation.","The alleged September 2025 theft of 660,000 rubles shows that a phishing email disguised as routine financial correspondence could directly lead to money being transferred from an organization’s bank account."],"referencedReports":[{"title":"VasyGrek and Mr. Burns","url":"https://www.f6.ru/blog/vasygrek-and-mr-burns/","publisher":"f6","context":"The article cites this F6 report as background on VasyGrek's financially motivated phishing activity and malware toolkit.","category":"research","primary":false},{"title":"VasyGrek: New Attacks in 2025","url":"https://www.f6.ru/blog/vasygrek-new-attacks-2025/","publisher":"f6","context":"The article references this F6 analysis when describing VasyGrek's initial-access methods and targeting.","category":"research","primary":false},{"title":"Kaspersky Recorded More Than 100 Attempted VasyGrek Attacks Against Organizations in Russia and CIS Countries in 2026","url":"https://www.kaspersky.ru/about/press-releases/laboratoriya-kasperskogo-zafiksirovala-bolee-100-popytok-atak-gruppy-vasygrek-na-organizatsii-v-rossii-i-stranah-sng-v-2026-godu","publisher":"kaspersky","context":"The article cites Kaspersky's report for its observation of more than 100 attempted VasyGrek attacks between January and September 2026.","category":"research","primary":false}],"body":"\u003cp\u003eRussian authorities arrested three suspected members of the VasyGrek, or Fluffy Wolf, threat group and said they dismantled its criminal infrastructure. The Russian Interior Ministry said the suspects are accused of stealing money from organizational accounts and creating, distributing, and using malicious software. Searches of residences and offices resulted in the seizure of computers, communication devices, and other evidence.\u003c/p\u003e\n\n\u003cp\u003eIn one September 2025 case, the attackers allegedly sent a phishing email disguised as business correspondence with a supposed reconciliation report, which led to malware execution and the theft of 660,000 rubles from an organization\u0026rsquo;s bank account. Authorities said the group used phishing domains imitating financial and accounting services, foreign-hosted virtual servers, and covert remote-administration tools obtained from the dark web. Kaspersky recorded more than 100 attempted VasyGrek attacks against organizations in Russia, Belarus, and Kazakhstan from January through September 2026, primarily affecting metallurgical organizations, wholesale suppliers, government agencies, and several other sectors.\u003c/p\u003e\n"}]</script>
