<script type="application/json" id="dl-articles">[{"n":2,"title":"Critical SharePoint RCE flaw exploited to steal machine keys","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-sharepoint-rce-flaw-exploited-to-steal-machine-keys/","time":"20:06","priority":"MUST READ","score":95,"tldr":"Attackers are actively exploiting the critical Microsoft SharePoint RCE flaw CVE-2026-50522 to steal machine keys, enabling them to forge authentication tokens and maintain access even after servers are patched. Organizations should apply the July security updates and rotate exposed credentials or keys.","briefOverview":"\u003cp\u003eHackers are actively exploiting the critical CVE-2026-50522 vulnerability in Microsoft SharePoint against on-premise vulnerable deployments. Microsoft describes the issue as a deserialization-of-untrusted-data flaw that allows a remote attacker to execute code over a network without authentication. The flaw was addressed in Microsoft’s July security updates, but it was not marked as actively exploited at the time.\u003c/p\u003e\n\n\u003cp\u003eThe attacks are significant because researchers say attackers are stealing machine keys that can let them maintain long-term access on breached systems. An attacker with these keys can create valid authentication tokens to impersonate users and access SharePoint sites and documents with the privileges of the forged identity. watchTowr said it saw exploitation attempts within hours after proof-of-concept exploit code for the vulnerability became public.\u003c/p\u003e\n\n\u003cp\u003eAt least one PowerShell demonstrative exploit for CVE-2026-50522 is available on GitHub from security researcher Janggggg. The proof of concept attempts to trigger remote code execution by delivering a malicious .NET BinaryFormatter payload as the cookie of a forged SecurityContextToken within a WS-Federation sign-in response posted to SharePoint’s \u0026lsquo;/_trust/default.aspx\u0026rsquo; endpoint. While applying the latest SharePoint security updates removes the vulnerability, watchTowr advises defenders to also rotate credentials on any asset that may have been exposed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers are actively exploiting the critical CVE-2026-50522 vulnerability in Microsoft SharePoint to steal machine keys and maintain access even after affected servers are patched.","Microsoft describes CVE-2026-50522 as a deserialization-of-untrusted-data flaw that allows a remote attacker to execute code over a network without authentication.","Microsoft addressed the flaw in its July security updates, but the advisory did not mark it as actively exploited and noted an increased likelihood of exploitation.","watchTowr observed exploitation attempts against on-premise vulnerable SharePoint deployments shortly after proof-of-concept exploit code became public.","At least one PowerShell demonstrative exploit for CVE-2026-50522 is available on GitHub and attempts to trigger remote code execution through SharePoint's '/_trust/default.aspx' endpoint."],"insights":["Applying the SharePoint security updates may not fully remove attacker access if machine keys were stolen, because those keys can be used to create valid authentication tokens after patching.","watchTowr reported that exploitation attempts appeared within hours of public proof-of-concept code being identified, showing that defenders had very little time between public exploit availability and real-world attacks.","Defused detected an undocumented SharePoint deserialization vector being used in attacks as early as July 17, before the activity was later linked to CVE-2026-50522.","The public exploit targets SharePoint's '/_trust/default.aspx' endpoint by sending a forged WS-Federation sign-in response, giving defenders a concrete request path and authentication flow to review for signs of attempted exploitation."],"referencedReports":[{"title":"CVE-2026-50522","url":"http://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-50522","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the description of the SharePoint deserialization flaw and notes that it warned of an increased likelihood of exploitation.","category":"advisory","primary":true}],"body":"\u003cp\u003eHackers are actively exploiting the critical CVE-2026-50522 vulnerability in Microsoft SharePoint against on-premise vulnerable deployments. Microsoft describes the issue as a deserialization-of-untrusted-data flaw that allows a remote attacker to execute code over a network without authentication. The flaw was addressed in Microsoft’s July security updates, but it was not marked as actively exploited at the time.\u003c/p\u003e\n\n\u003cp\u003eThe attacks are significant because researchers say attackers are stealing machine keys that can let them maintain long-term access on breached systems. An attacker with these keys can create valid authentication tokens to impersonate users and access SharePoint sites and documents with the privileges of the forged identity. watchTowr said it saw exploitation attempts within hours after proof-of-concept exploit code for the vulnerability became public.\u003c/p\u003e\n\n\u003cp\u003eAt least one PowerShell demonstrative exploit for CVE-2026-50522 is available on GitHub from security researcher Janggggg. The proof of concept attempts to trigger remote code execution by delivering a malicious .NET BinaryFormatter payload as the cookie of a forged SecurityContextToken within a WS-Federation sign-in response posted to SharePoint’s \u0026lsquo;/_trust/default.aspx\u0026rsquo; endpoint. While applying the latest SharePoint security updates removes the vulnerability, watchTowr advises defenders to also rotate credentials on any asset that may have been exposed.\u003c/p\u003e\n"},{"n":8,"title":"Oracle July 2026 Critical Patch Update Addresses 1235 CVEs","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/oracle-july-2026-critical-patch-update-addresses-1235-cves","time":"21:07","priority":"MUST READ","score":94,"tldr":"Oracle’s July 2026 Critical Patch Update fixes 1,235 CVEs across 32 product families with 1,449 security patches, including 261 critical updates. Oracle E-Business Suite and Fusion Middleware received the most fixes, so affected customers should prioritize applying the relevant patches.","briefOverview":"\u003cp\u003eOracle released its July 2026 Critical Patch Update on July 21, marking the third quarterly update of 2026. The release contains fixes for 1,235 unique CVEs in 1,449 security updates across 32 Oracle product families. The article describes this as the largest CPU release.\u003c/p\u003e\n\n\u003cp\u003eOut of the 1,449 security updates, 261 patches were rated critical, accounting for 18% of all patches. High severity patches made up 52.7% of the total, while medium severity patches accounted for 24.7%. This quarter’s update includes 261 critical patches across 228 CVEs.\u003c/p\u003e\n\n\u003cp\u003eOracle E-Business Suite received the highest number of patches, with 410 fixes, or 28.3% of all patches. Oracle Fusion Middleware followed with 355 patches, or 24.5% of the total, and had 219 vulnerabilities listed as remotely exploitable without authentication. Customers are advised to apply all relevant patches and consult Oracle’s July 2026 advisory for full details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Oracle’s July 2026 Critical Patch Update contains fixes for 1,235 unique CVEs in 1,449 security updates across 32 Oracle product families.","The update includes 261 critical patches across 228 CVEs, representing 18% of all patches in the release.","High severity patches accounted for 52.7% of the security patches, followed by medium severity patches at 24.7%.","Oracle E-Business Suite received the highest number of patches with 410, accounting for 28.3% of all patches.","Oracle Fusion Middleware received 355 patches, accounting for 24.5% of all patches."],"insights":["This is described as Oracle’s largest Critical Patch Update release, making it an unusually broad patching event for Oracle customers.","Oracle Fusion Middleware has 219 patches for issues that can be exploited remotely without authentication, the highest such count listed in the article.","Oracle Communications has 122 patches for issues that can be exploited remotely without authentication, despite having fewer total patches than Oracle E-Business Suite or Oracle Fusion Middleware.","Oracle E-Business Suite and Oracle Fusion Middleware together account for more than half of all patches in the July 2026 update."],"referencedReports":[{"title":"Oracle Critical Patch Update Advisory - July 2026","url":"https://www.oracle.com/security-alerts/cpujul2026.html","publisher":"Oracle","context":"The article states that Oracle released its July 2026 Critical Patch Update and advises customers to refer to this advisory for full details.","category":"advisory","primary":true},{"title":"Oracle July 2026 Critical Patch Update Risk Matrices","url":"https://www.oracle.com/security-alerts/cpujul2026verbose.html","publisher":"Oracle","context":"The article links to Oracle’s risk matrices as additional information for the July 2026 Critical Patch Update.","category":"advisory","primary":false},{"title":"Oracle Advisory to CVE Map","url":"https://www.oracle.com/security-alerts/public-vuln-to-advisory-mapping.html","publisher":"Oracle","context":"The article links to Oracle’s advisory-to-CVE mapping as additional information related to the patched vulnerabilities.","category":"advisory","primary":false}],"body":"\u003cp\u003eOracle released its July 2026 Critical Patch Update on July 21, marking the third quarterly update of 2026. The release contains fixes for 1,235 unique CVEs in 1,449 security updates across 32 Oracle product families. The article describes this as the largest CPU release.\u003c/p\u003e\n\n\u003cp\u003eOut of the 1,449 security updates, 261 patches were rated critical, accounting for 18% of all patches. High severity patches made up 52.7% of the total, while medium severity patches accounted for 24.7%. This quarter’s update includes 261 critical patches across 228 CVEs.\u003c/p\u003e\n\n\u003cp\u003eOracle E-Business Suite received the highest number of patches, with 410 fixes, or 28.3% of all patches. Oracle Fusion Middleware followed with 355 patches, or 24.5% of the total, and had 219 vulnerabilities listed as remotely exploitable without authentication. Customers are advised to apply all relevant patches and consult Oracle’s July 2026 advisory for full details.\u003c/p\u003e\n"},{"n":1,"title":"Anubis ransomware claims Coca-Cola Fairlife attack, threatens data leak","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/anubis-ransomware-claims-coca-cola-fairlife-attack-threatens-data-leak/","time":"18:50","priority":"MUST READ","score":92,"tldr":"The Anubis ransomware gang claims it attacked Coca-Cola’s Fairlife subsidiary, encrypted its Nutanix systems, and stole about 1 TB of corporate data. The group is threatening to leak the data unless Fairlife negotiates, while Coca-Cola has declined to comment on the claims.","briefOverview":"\u003cp\u003eThe Anubis ransomware gang has claimed responsibility for the cyberattack on Fairlife, Coca-Cola’s dairy subsidiary. The group threatened to publish allegedly stolen corporate data unless the company pays a ransom. Fairlife produces ultra-filtered milk products, protein shakes, and nutrition drinks sold throughout the United States.\u003c/p\u003e\n\n\u003cp\u003eCoca-Cola disclosed on July 16 that a ransomware attack disrupted Fairlife’s operations and forced the company to suspend production at its U.S. facilities. The company said attackers gained unauthorized access to part of Fairlife’s systems, including production-related systems, and that it activated incident response and business continuity plans. Coca-Cola said product quality and safety were not affected, and Canadian production operations continued as normal.\u003c/p\u003e\n\n\u003cp\u003eAnubis claimed it attacked Fairlife about a week before the public disclosure, encrypted the company’s Nutanix infrastructure, and stole approximately one terabyte of corporate data. BleepingComputer could not independently verify the claims about data theft, encryption, or the amount of data allegedly stolen. Coca-Cola declined to comment when contacted about the claims.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Anubis ransomware gang claimed responsibility for the cyberattack on Coca-Cola’s Fairlife dairy subsidiary and threatened to publish allegedly stolen corporate data unless the company pays a ransom.","Coca-Cola disclosed on July 16 that a ransomware attack disrupted Fairlife’s operations and forced the company to suspend production at its U.S. facilities.","Coca-Cola said attackers gained unauthorized access to part of Fairlife’s systems, including production-related systems, but product quality and safety were not affected and Canadian production continued normally.","Anubis claimed it encrypted Fairlife’s Nutanix infrastructure and stole approximately one terabyte of corporate data during the attack.","BleepingComputer could not independently verify Anubis’s claims about data theft, system encryption, or the amount of data allegedly stolen, and Coca-Cola declined to comment on the claims."],"insights":["Coca-Cola publicly disclosed the Fairlife incident before the ransomware group identified itself, and Anubis complained that the company reported the attack without following the instructions left on its network.","The incident affected Fairlife’s U.S. production while Canadian production continued normally, showing the operational disruption described by Coca-Cola was not global across the brand.","Anubis’s claim that it encrypted Nutanix infrastructure is especially significant because the article says the disruption involved production-related systems, linking the alleged encryption to Fairlife’s ability to operate U.S. facilities.","The article emphasizes that Anubis’s claims about stealing 1 TB of data and encrypting systems were not independently verified, so the public evidence remains limited to the gang’s assertions and Coca-Cola’s earlier disclosure."],"referencedReports":[],"body":"\u003cp\u003eThe Anubis ransomware gang has claimed responsibility for the cyberattack on Fairlife, Coca-Cola’s dairy subsidiary. The group threatened to publish allegedly stolen corporate data unless the company pays a ransom. Fairlife produces ultra-filtered milk products, protein shakes, and nutrition drinks sold throughout the United States.\u003c/p\u003e\n\n\u003cp\u003eCoca-Cola disclosed on July 16 that a ransomware attack disrupted Fairlife’s operations and forced the company to suspend production at its U.S. facilities. The company said attackers gained unauthorized access to part of Fairlife’s systems, including production-related systems, and that it activated incident response and business continuity plans. Coca-Cola said product quality and safety were not affected, and Canadian production operations continued as normal.\u003c/p\u003e\n\n\u003cp\u003eAnubis claimed it attacked Fairlife about a week before the public disclosure, encrypted the company’s Nutanix infrastructure, and stole approximately one terabyte of corporate data. BleepingComputer could not independently verify the claims about data theft, encryption, or the amount of data allegedly stolen. Coca-Cola declined to comment when contacted about the claims.\u003c/p\u003e\n"},{"n":3,"title":"The Procurement Trap: Inside an AiTM Campaign Targeting Global Institutions","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/the-procurement-trap-inside-an-aitm-campaign-targeting-global-institutions/","time":"19:10","priority":"SHOULD READ","score":86,"tldr":"Infoblox uncovered a sophisticated adversary-in-the-middle phishing campaign using compromised aged domains, fake procurement/document portals, CAPTCHAs, and cloned Microsoft login pages to steal MFA-protected session tokens from universities, enterprises, and global institutions. The key takeaway is that MFA alone is not enough when attackers can proxy legitimate authentication flows and hijack authenticated sessions.","briefOverview":"\u003cp\u003eInfoblox analyzed a sophisticated adversary-in-the-middle phishing campaign targeting universities, enterprises, and multinational institutions, including European Union and United Nations agencies. The campaign uses project-themed lures such as requests for information, bid invitations, and shared project documentation. Emails are sent from compromised organizational accounts, which helps the lures appear credible and allows the actor to spread them more broadly across organizations.\u003c/p\u003e\n\n\u003cp\u003eVictims who click the links are guided through fake document download pages, email prompts, CAPTCHA checks, and cloned authentication pages impersonating trusted services such as Microsoft, OpenGov, ConstructConnect, and European financial institutions. The actor uses multiple AiTM phishing kits, including EvilProxy, FlowerStorm/Storm-1167, and Kali365, to intercept credentials, session cookies, authentication tokens, and MFA-protected access in real time. This allows the attacker to establish authenticated sessions without directly bypassing MFA protections.\u003c/p\u003e\n\n\u003cp\u003eThe campaign relies on aged, often dormant domains that are likely compromised and used to host fake document download pages through injected PHP files. Infoblox identified domains such as testserveren.com and barifurniture.net, along with broader infrastructure patterns tied to FlowerStorm/Storm-1167, EvilProxy, and Kali365. The article concludes that MFA alone is not enough against attacks that hijack trusted sessions, and that DNS-based threat intelligence can expose patterns such as RDGA domains, subdomain conventions, and infrastructure reuse before users enter credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Infoblox analyzed an adversary-in-the-middle phishing campaign that targets universities, enterprises, multinational institutions, and European Union and United Nations agencies with project-themed lures.","The campaign uses emails sent from compromised organizational accounts and themes such as requests for information, bid invitations, and shared project documentation to increase credibility.","Victims are led through fake document download pages, email prompts, CAPTCHA or Cloudflare Turnstile checks, and cloned authentication pages impersonating services such as Microsoft, OpenGov, ConstructConnect, and European financial institutions.","The actor uses multiple adversary-in-the-middle phishing kits, including EvilProxy, FlowerStorm/Storm-1167, and Kali365, to capture credentials, session cookies, authentication tokens, and MFA-protected access in real time.","The campaign relies on aged and likely compromised domains, including examples such as testserveren.com and barifurniture.net, to host fake document download pages and evade reputation-based detection."],"insights":["The campaign’s use of aged, dormant, and likely compromised domains means domain age and reputation alone may not reliably distinguish malicious infrastructure from legitimate sites.","The phishing flow deliberately adds intermediate steps such as fake file access, email verification, and CAPTCHA checks, which may reduce user suspicion compared with a direct jump to a login page.","The actor’s rotation across EvilProxy, FlowerStorm/Storm-1167, and Kali365 shows operational resilience because the campaign does not depend on a single phishing kit.","The article highlights DNS patterns, including RDGA-style domains and subdomain conventions, as persistent indicators that can remain useful even after individual phishing URLs expire."],"referencedReports":[{"title":"Evil Proxy Phishing Campaign","url":"https://www.okta.com/es-es/blog/threat-intelligence/evil-proxy-phishing-campaign/","publisher":"Okta","context":"The article links to Okta’s analysis as a reference for the EvilProxy phishing-as-a-service kit used in the campaign.","category":"research","primary":false},{"title":"FlowerStorm","url":"https://any.run/malware-trends/flowerstorm/","publisher":"ANY.RUN","context":"The article links to ANY.RUN’s FlowerStorm material as a reference for the FlowerStorm phishing kit observed in the campaign.","category":"research","primary":false},{"title":"Token Bingo: Don’t Let Your Code Be the Winner","url":"https://arcticwolf.com/resources/blog/token-bingo-dont-let-your-code-be-the-winner/","publisher":"Arctic Wolf","context":"The article links to Arctic Wolf’s Kali365 analysis as a reference for the Kali365 phishing-as-a-service kit observed in the campaign.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox analyzed a sophisticated adversary-in-the-middle phishing campaign targeting universities, enterprises, and multinational institutions, including European Union and United Nations agencies. The campaign uses project-themed lures such as requests for information, bid invitations, and shared project documentation. Emails are sent from compromised organizational accounts, which helps the lures appear credible and allows the actor to spread them more broadly across organizations.\u003c/p\u003e\n\n\u003cp\u003eVictims who click the links are guided through fake document download pages, email prompts, CAPTCHA checks, and cloned authentication pages impersonating trusted services such as Microsoft, OpenGov, ConstructConnect, and European financial institutions. The actor uses multiple AiTM phishing kits, including EvilProxy, FlowerStorm/Storm-1167, and Kali365, to intercept credentials, session cookies, authentication tokens, and MFA-protected access in real time. This allows the attacker to establish authenticated sessions without directly bypassing MFA protections.\u003c/p\u003e\n\n\u003cp\u003eThe campaign relies on aged, often dormant domains that are likely compromised and used to host fake document download pages through injected PHP files. Infoblox identified domains such as testserveren.com and barifurniture.net, along with broader infrastructure patterns tied to FlowerStorm/Storm-1167, EvilProxy, and Kali365. The article concludes that MFA alone is not enough against attacks that hijack trusted sessions, and that DNS-based threat intelligence can expose patterns such as RDGA domains, subdomain conventions, and infrastructure reuse before users enter credentials.\u003c/p\u003e\n"},{"n":5,"title":"Apple Fixes Hide My Email Bug That Exposed Real Addresses in Mail Logs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/apple-fixes-hide-my-email-bug-that.html","time":"18:46","priority":"SHOULD READ","score":78,"tldr":"Apple fixed a Hide My Email flaw that could expose users’ real email addresses in mail server logs when messages to their masked addresses were rejected as spam. The bug had been reported over a year earlier and may have leaked addresses tied to Hide My Email aliases created before July 2026.","briefOverview":"\u003cp\u003eApple has fixed a security flaw in its Hide My Email service that could expose users’ real email addresses, weakening the privacy protections the feature is meant to provide. 404 Media reported that Apple deployed the fix on July 3, 2026, after the issue had been disclosed more than a year earlier by Tyler Murphy, co-founder of EasyOptOuts. Hide My Email creates random email addresses that forward messages to a user’s personal inbox and is available through a paid iCloud+ subscription.\u003c/p\u003e\n\n\u003cp\u003eThe problem allowed a user’s real email address to appear in email logs when a message sent to a Hide My Email address was rejected as spam. Murphy and EasyOptOuts co-founder Ben Weiner said the leak could be triggered by automatic spam rejection at many major email hosts, even for legitimate messages. They also said affected users may not be able to check their inbox or spam folder to determine whether they were impacted, because the rejected emails likely never arrived.\u003c/p\u003e\n\n\u003cp\u003eThe issue was first reported to Apple on June 13, 2025, and Apple made unsuccessful patch attempts in March 2026 and again on June 30, 2026. Although the bug has been resolved, real email addresses linked to Hide My Email addresses created before July 7, 2026 may have been captured in mail transfer logs when non-malicious emails bounced. Apple is also facing a class action lawsuit alleging that it misled customers about Hide My Email’s privacy while charging for the feature and did not warn users or change its privacy representations during the period described in the complaint.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Apple deployed a fix on July 3, 2026 for a flaw in its Hide My Email service that could expose users’ real email addresses.","The issue was reported to Apple on June 13, 2025 by Tyler Murphy, co-founder of EasyOptOuts, and Apple’s earlier patch attempts in March 2026 and June 30, 2026 were unsuccessful.","The flaw could cause a user’s real email address to appear in email logs when a message sent to their Hide My Email address was rejected as spam.","Real email addresses linked to Hide My Email addresses created before July 7, 2026 may have been captured in mail transfer logs when non-malicious emails bounced.","Apple is facing a class action lawsuit alleging it misled customers about the privacy of Hide My Email while charging for the feature."],"insights":["The leak could be triggered even by legitimate emails that were automatically rejected as spam, meaning affected users may have no message in their inbox or spam folder to help determine whether they were exposed.","The privacy failure involved mail transfer logs rather than visible email content, so the exposure could occur in backend records that ordinary users would not normally see or review.","Apple’s fix came only after multiple failed patch attempts and more than a year after the issue was first reported, according to the article.","The lawsuit highlights that Apple allegedly continued offering Hide My Email without pausing the service, warning customers, or changing its privacy claims during the period the flaw was known."],"referencedReports":[{"title":"Apple Hide My Email is leaking email addresses","url":"https://easyoptouts.com/guides/apple-hide-my-email-is-leaking-email-addresses","publisher":"EasyOptOuts","context":"The article says the flaw was disclosed to Apple by Tyler Murphy, co-founder of EasyOptOuts, and links to EasyOptOuts’ write-up about the Hide My Email leak.","category":"research","primary":true}],"body":"\u003cp\u003eApple has fixed a security flaw in its Hide My Email service that could expose users’ real email addresses, weakening the privacy protections the feature is meant to provide. 404 Media reported that Apple deployed the fix on July 3, 2026, after the issue had been disclosed more than a year earlier by Tyler Murphy, co-founder of EasyOptOuts. Hide My Email creates random email addresses that forward messages to a user’s personal inbox and is available through a paid iCloud+ subscription.\u003c/p\u003e\n\n\u003cp\u003eThe problem allowed a user’s real email address to appear in email logs when a message sent to a Hide My Email address was rejected as spam. Murphy and EasyOptOuts co-founder Ben Weiner said the leak could be triggered by automatic spam rejection at many major email hosts, even for legitimate messages. They also said affected users may not be able to check their inbox or spam folder to determine whether they were impacted, because the rejected emails likely never arrived.\u003c/p\u003e\n\n\u003cp\u003eThe issue was first reported to Apple on June 13, 2025, and Apple made unsuccessful patch attempts in March 2026 and again on June 30, 2026. Although the bug has been resolved, real email addresses linked to Hide My Email addresses created before July 7, 2026 may have been captured in mail transfer logs when non-malicious emails bounced. Apple is also facing a class action lawsuit alleging that it misled customers about Hide My Email’s privacy while charging for the feature and did not warn users or change its privacy representations during the period described in the complaint.\u003c/p\u003e\n"},{"n":4,"title":"DNI nominee Clayton wins Senate panel’s approval","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/jay-clayton-dni-nomination-senate-committee-approval","time":"19:00","priority":"MAY READ","score":65,"tldr":"The Senate Intelligence Committee approved Jay Clayton’s nomination for director of national intelligence in a party-line vote, sending it to the full Senate. His confirmation could affect stalled efforts to renew Section 702 surveillance authority, which lapsed amid Democratic objections to the acting intelligence chief.","briefOverview":"\u003cp\u003eThe Senate Intelligence Committee voted 9-8 along party lines to support President Donald Trump’s nominee for director of national intelligence, Jay Clayton. The vote clears an important hurdle and allows the full Senate to decide whether Clayton should be confirmed as the country’s latest spy chief. That vote is likely to occur before senators leave for their August recess.\u003c/p\u003e\n\n\u003cp\u003eCommittee Chairman Tom Cotton said Clayton is highly qualified and has deep experience combating national security threats. Democrats on the panel raised concerns during Clayton’s confirmation hearing that he would politicize the role on Trump’s behalf, especially after he refused to acknowledge that Joe Biden defeated Trump in the 2020 election and said only that Biden was “certified.” Clayton was also questioned about former director of national intelligence Tulsi Gabbard’s visit to a Georgia election office during an FBI search related to the 2020 election.\u003c/p\u003e\n\n\u003cp\u003eClayton’s confirmation could potentially clear the way for bipartisan legislation to renew Section 702 of the Foreign Intelligence Surveillance Act. The article says Section 702 allows the National Security Agency to collect certain foreign intelligence information from international phone calls and emails involving hackers, foreign spies and other perceived overseas security threats, while also intercepting Americans’ data. The statute expired last month after Democrats said they would not support the bill while acting intelligence director Bill Pulte remained in office.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Senate Intelligence Committee voted 9-8 along party lines to support President Donald Trump’s nominee for director of national intelligence, Jay Clayton.","The vote clears the way for the full Senate to decide whether to confirm Clayton, likely before senators leave for the August recess.","Committee Democrats raised concerns during Clayton’s confirmation hearing that he would politicize the position on Trump’s behalf after he refused to acknowledge that Joe Biden defeated Trump in the 2020 election, saying only that Biden was “certified.”","Clayton testified that he had no involvement with Trump’s national primetime address accusing some foreign countries, particularly China, of trying to interfere in American elections.","Clayton’s confirmation could potentially clear the way for bipartisan legislation to renew Section 702 of the Foreign Intelligence Surveillance Act, which expired last month."],"insights":["The path to renewing Section 702 is tied not only to the surveillance law itself but also to who is leading the intelligence community, since Democrats opposed renewal while acting intelligence director Bill Pulte remained in office.","Election-related concerns dominated Clayton’s nomination despite his prior role at the Securities and Exchange Commission, showing that questions about the 2020 election are directly affecting oversight of U.S. intelligence leadership.","The article notes a gap between the White House’s release of newly declassified documents and the evidence described, saying the administration still appears not to have found hard proof of foreign intervention in voting machines or flipped votes.","Clayton’s hearing occurred immediately before Trump’s primetime speech alleging foreign election interference, but Clayton testified that he had no involvement with that address."],"referencedReports":[],"body":"\u003cp\u003eThe Senate Intelligence Committee voted 9-8 along party lines to support President Donald Trump’s nominee for director of national intelligence, Jay Clayton. The vote clears an important hurdle and allows the full Senate to decide whether Clayton should be confirmed as the country’s latest spy chief. That vote is likely to occur before senators leave for their August recess.\u003c/p\u003e\n\n\u003cp\u003eCommittee Chairman Tom Cotton said Clayton is highly qualified and has deep experience combating national security threats. Democrats on the panel raised concerns during Clayton’s confirmation hearing that he would politicize the role on Trump’s behalf, especially after he refused to acknowledge that Joe Biden defeated Trump in the 2020 election and said only that Biden was “certified.” Clayton was also questioned about former director of national intelligence Tulsi Gabbard’s visit to a Georgia election office during an FBI search related to the 2020 election.\u003c/p\u003e\n\n\u003cp\u003eClayton’s confirmation could potentially clear the way for bipartisan legislation to renew Section 702 of the Foreign Intelligence Surveillance Act. The article says Section 702 allows the National Security Agency to collect certain foreign intelligence information from international phone calls and emails involving hackers, foreign spies and other perceived overseas security threats, while also intercepting Americans’ data. The statute expired last month after Democrats said they would not support the bill while acting intelligence director Bill Pulte remained in office.\u003c/p\u003e\n"},{"n":6,"title":"Azure VM Command Execution using Third-Party Extensions – Chef","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/azure-vm-command-execution-using-third-party-extensions/","time":"20:07","priority":"MAY READ","score":58,"tldr":"The article shows how an attacker with Azure VM extension write permissions can abuse the legitimate Chef extension to connect a VM to a rogue Chef server and execute arbitrary code, including stealing managed identity tokens. Defenders should tightly restrict VM extension permissions and monitor Azure Activity Logs and Chef-related host logs for unexpected Chef installations or unknown Chef server URLs.","briefOverview":"\u003cp\u003eThe article explains how legitimate third-party Azure VM extensions can be abused to execute commands on Azure virtual machines. It focuses on the Chef extension, which is available through the Azure marketplace and is normally used to install and configure the Chef client on virtual machines. An attacker with Microsoft.Compute/virtualMachines/extensions/write permission could deploy the extension and configure it to connect a target VM to a rogue Chef server.\u003c/p\u003e\n\n\u003cp\u003eThe demonstrated attack uses chef-zero as a simple attacker-controlled Chef server and uploads a malicious cookbook with a Ruby recipe. The example payload queries the Azure Managed Identity metadata endpoint from the VM and sends the resulting access token to an out-of-band interaction service. The article provides Azure CLI examples for deploying the Chef extension on Windows and Linux targets so the VM pulls and runs the malicious cookbook.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that multiple built-in Azure roles have the VM extension write permission needed for this technique, including Owner, Contributor, Log Analytics Contributor, and Virtual Machine Contributor, as well as several less common roles. It recommends monitoring Azure Activity Log events for Microsoft.Compute/virtualMachines/extensions/write and reviewing Chef-related host logs for Chef server URLs, run lists, cookbook activity, and executed commands. The broader significance is that VM extensions are legitimate administrative tools, so defenders should not eliminate them outright but should build detections around sensitive actions and assets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker with Microsoft.Compute/virtualMachines/extensions/write permission can deploy legitimate third-party Azure VM extensions and configure them to achieve arbitrary code execution on virtual machines.","The article demonstrates a rogue Chef server attack in which a target Azure VM installs the Chef extension, registers with an attacker-controlled Chef server, pulls a malicious cookbook, and executes the payload as root.","The demonstration cookbook captures an access token for the Managed Identity attached to the VM and sends it to an out-of-band interaction tool.","Built-in Azure roles with the permissions needed for this attack include Owner, Contributor, Log Analytics Contributor, Virtual Machine Contributor, and several less commonly used roles such as VM Restore Operator and Defender Servers P1 and P2.","Detection opportunities include monitoring Azure Activity Log events for Microsoft.Compute/virtualMachines/extensions/write and reviewing Chef-related log files to identify the Chef server URL and cookbook activity."],"insights":["Several Azure roles that are not obviously highly privileged, including Log Analytics Contributor, VM Restore Operator, and Defender-related server roles, can write VM extensions and therefore have the permissions needed for this technique.","The Chef extension can make malicious activity blend in with normal administration because Chef is a legitimate marketplace extension used for configuration management.","The Chef server URL is stored in local extension settings files on both Linux and Windows VMs, giving defenders a concrete way to compare observed servers against known approved Chef servers.","Chef client logs can expose the exact cookbook, recipe, and command that ran, including whether the payload executed successfully.","The article emphasizes that sensitive Azure VMs such as domain controllers are especially high impact because anyone able to execute commands on them through extensions is effectively a Domain Administrator."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how legitimate third-party Azure VM extensions can be abused to execute commands on Azure virtual machines. It focuses on the Chef extension, which is available through the Azure marketplace and is normally used to install and configure the Chef client on virtual machines. An attacker with Microsoft.Compute/virtualMachines/extensions/write permission could deploy the extension and configure it to connect a target VM to a rogue Chef server.\u003c/p\u003e\n\n\u003cp\u003eThe demonstrated attack uses chef-zero as a simple attacker-controlled Chef server and uploads a malicious cookbook with a Ruby recipe. The example payload queries the Azure Managed Identity metadata endpoint from the VM and sends the resulting access token to an out-of-band interaction service. The article provides Azure CLI examples for deploying the Chef extension on Windows and Linux targets so the VM pulls and runs the malicious cookbook.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that multiple built-in Azure roles have the VM extension write permission needed for this technique, including Owner, Contributor, Log Analytics Contributor, and Virtual Machine Contributor, as well as several less common roles. It recommends monitoring Azure Activity Log events for Microsoft.Compute/virtualMachines/extensions/write and reviewing Chef-related host logs for Chef server URLs, run lists, cookbook activity, and executed commands. The broader significance is that VM extensions are legitimate administrative tools, so defenders should not eliminate them outright but should build detections around sensitive actions and assets.\u003c/p\u003e\n"},{"n":7,"title":"Tyro's CISO:  Being the \"Einstein of cybersecurity\" isn't enough if developers don't trust you","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/security-controls-developer-trust","time":"19:50","priority":"MAY READ","score":45,"tldr":"Tyro CISO Arun Singh argues that security teams must protect developer workflows without burning trust, because even technically sound controls can fail if developers see them as productivity blockers. He highlights supply chain defenses like delaying new package updates and using in-IDE/device protection tools that reduce friction.","briefOverview":"\u003cp\u003eThe article is based on Mackenzie’s conversation with Arun Singh on The Secure Disclosure podcast about the importance of developer trust in cybersecurity. Singh says that a security leader can be technically excellent, but “no good” if they cannot influence the business. He describes an early career decision to remove local administrator rights across all workstations, which worked for most users but severely disrupted software engineers who needed deeper system access.\u003c/p\u003e\n\n\u003cp\u003eSingh says his team found a compromise within days, but the damaged trust took a year to rebuild. The article argues that this problem becomes harder at scale, citing Mike Wilkes of Aikido Security, who says many enterprise security rollouts fail because they are treated like software deployments rather than cultural changes. It frames developer trust as a limited resource that security teams must preserve when introducing new controls.\u003c/p\u003e\n\n\u003cp\u003eAt Tyro, Singh’s recent board conversations have focused on supply chain attacks, where attackers exploit the long-standing advice to keep packages and dependencies up to date. His team now recommends a 7-day cooldown period before adopting new package versions and held workshops to explain this change to engineering teams. Singh also emphasizes tools that fit developer workflows, including in-IDE vulnerability detection and device protection that can block malicious packages, browser extensions, and IDE plugins at install time without harming productivity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arun Singh says that being highly skilled in cybersecurity is not enough if a security leader cannot influence the business and earn developer trust.","Singh’s earlier removal of local administrator rights across all workstations disrupted software engineers’ productivity and took about a year of trust-building to recover from.","Tyro’s recent board conversations have focused on supply chain attacks, where attackers can exploit the long-standing advice for developers to keep packages and dependencies up to date.","Singh’s team now advocates a 7-day cooldown period before adopting any new package version, and they held workshops with engineering teams to explain the reasoning.","Singh says security tools should fit developer workflows, including in-IDE vulnerability detection and device protection that can block malicious packages, browser extensions, and IDE plugins at install time."],"insights":["A technically valid security control can create long-term resistance if it blocks a small but critical developer group, as Singh’s local administrator rights rollout damaged trust for a year despite working for most users.","Security guidance may need to reverse or qualify earlier advice when attackers adapt, as Tyro now tells developers to delay new package versions after years of encouraging fast dependency updates.","Developer trust functions like a limited resource for security teams, because a poorly handled rollout can make later nuanced requests such as “patch, but wait a week” harder to enforce.","Singh’s preferred controls reduce the need for developer behavior changes by acting inside existing workflows, such as scanning in the IDE or blocking unsafe installs at install time while allowing safe ones through silently."],"referencedReports":[],"body":"\u003cp\u003eThe article is based on Mackenzie’s conversation with Arun Singh on The Secure Disclosure podcast about the importance of developer trust in cybersecurity. Singh says that a security leader can be technically excellent, but “no good” if they cannot influence the business. He describes an early career decision to remove local administrator rights across all workstations, which worked for most users but severely disrupted software engineers who needed deeper system access.\u003c/p\u003e\n\n\u003cp\u003eSingh says his team found a compromise within days, but the damaged trust took a year to rebuild. The article argues that this problem becomes harder at scale, citing Mike Wilkes of Aikido Security, who says many enterprise security rollouts fail because they are treated like software deployments rather than cultural changes. It frames developer trust as a limited resource that security teams must preserve when introducing new controls.\u003c/p\u003e\n\n\u003cp\u003eAt Tyro, Singh’s recent board conversations have focused on supply chain attacks, where attackers exploit the long-standing advice to keep packages and dependencies up to date. His team now recommends a 7-day cooldown period before adopting new package versions and held workshops to explain this change to engineering teams. Singh also emphasizes tools that fit developer workflows, including in-IDE vulnerability detection and device protection that can block malicious packages, browser extensions, and IDE plugins at install time without harming productivity.\u003c/p\u003e\n"}]</script>
