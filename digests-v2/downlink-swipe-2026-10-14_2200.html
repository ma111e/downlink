<script type="application/json" id="dl-articles">[{"n":1,"title":"Palo Alto Networks warns of PAN-OS RCE flaw exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/palo-alto-networks-warns-of-pan-os-rce-flaw-exploited-in-attacks/","time":"22:56","priority":"MUST READ","score":95,"tldr":"Palo Alto Networks patched CVE-2026-0322, a high-severity PAN-OS management-interface flaw that allows authenticated attackers with network access to execute code as root and has already seen limited exploitation. Organizations should urgently update affected firewalls and restrict management-interface access to trusted internal IP addresses.","briefOverview":"\u003cp\u003ePalo Alto Networks released security updates for CVE-2026-0322, a high-severity PAN-OS flaw affecting the management interface of certain firewalls and management appliances. The company said it has observed very limited exploitation targeting that interface. The vulnerability has a severity score of 8.6 and can allow authenticated attackers with network access to execute code as root on vulnerable devices.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include PA-Series and VM-Series firewalls, as well as Panorama virtual and M-Series appliances; Cloud NGFW and Prisma Access are not affected. Palo Alto Networks recommends restricting management-interface access to trusted internal IP addresses and upgrading to an unaffected version, as no known workaround exists. Threat Prevention signatures can provide limited detection of known attack patterns, while CISA has added the flaw to its Known Exploited Vulnerabilities catalog and set an October 17 mitigation deadline for U.S. federal civilian agencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks released security updates for CVE-2026-0322, a PAN-OS management-interface flaw with a severity score of 8.6 that can allow authenticated attackers with network access to run code as root.","Palo Alto Networks said it has observed very limited exploitation of CVE-2026-0322 targeting management interfaces.","Affected products include PA-Series and VM-Series firewalls and Panorama virtual and M-Series appliances, while Cloud NGFW and Prisma Access are not affected.","Palo Alto Networks recommends restricting management-interface access to trusted internal IP addresses and upgrading to an unaffected PAN-OS version, as there are no known workarounds.","CISA added CVE-2026-0322 to its Known Exploited Vulnerabilities catalog and requires U.S. federal civilian agencies to mitigate it by October 17."],"insights":["The flaw requires both valid credentials and network access to the management interface, making restricted management access a meaningful immediate risk-reduction step.","Threat Prevention signatures offer only limited protection because they can detect known attack patterns but may miss variations.","Organizations on unsupported PAN-OS releases cannot simply apply a fix in place and must first move to a supported version.","Although fixes are available for several PAN-OS versions, the update for PAN-OS 11.2.16 was not expected until October 15.","CISA’s addition of the flaw to its Known Exploited Vulnerabilities catalog creates an October 17 mitigation deadline for U.S. federal civilian agencies."],"referencedReports":[{"title":"CVE-2026-0322","url":"https://security.paloaltonetworks.com/CVE-2026-0322","publisher":"palo-alto-networks","context":"The article cites Palo Alto Networks' security advisory confirming limited exploitation and providing remediation guidance for the PAN-OS flaw.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog","url":"http://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article states that CISA added CVE-2026-0322 to this catalog and set a mitigation deadline for U.S. federal civilian agencies.","category":"advisory","primary":false}],"body":"\u003cp\u003ePalo Alto Networks released security updates for CVE-2026-0322, a high-severity PAN-OS flaw affecting the management interface of certain firewalls and management appliances. The company said it has observed very limited exploitation targeting that interface. The vulnerability has a severity score of 8.6 and can allow authenticated attackers with network access to execute code as root on vulnerable devices.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include PA-Series and VM-Series firewalls, as well as Panorama virtual and M-Series appliances; Cloud NGFW and Prisma Access are not affected. Palo Alto Networks recommends restricting management-interface access to trusted internal IP addresses and upgrading to an unaffected version, as no known workaround exists. Threat Prevention signatures can provide limited detection of known attack patterns, while CISA has added the flaw to its Known Exploited Vulnerabilities catalog and set an October 17 mitigation deadline for U.S. federal civilian agencies.\u003c/p\u003e\n"},{"n":2,"title":"Unit 42 Uncovers PEERSTITCH, a Stealthy FortiGate Implant","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/","time":"22:00","priority":"MUST READ","score":92,"tldr":"Unit 42 found that attackers exploited a FortiManager flaw to steal configurations, credentials, and trust material for more than 500 managed FortiGate firewalls, then used that access for traffic sniffing, VPN access, and management impersonation. They also deployed PEERSTITCH, a memory-resident FortiOS implant that patches core processes and evades conventional disk- and network-based detection.","briefOverview":"\u003cp\u003eUnit 42 investigated a September 2024 intrusion at a telecommunications managed service provider, tracked as CL-STA-0954 (also known as UNC5820). Attackers exploited CVE-2024-47575 on the provider’s FortiManager appliance, then exfiltrated an archive containing configurations, encrypted credentials, cryptographic trust material, and information for more than 500 managed FortiGate firewalls. The affected firewalls protected both the provider’s infrastructure and client networks, although the investigation did not confirm compromise of those client networks. The article emphasizes that centralized management platforms can expose a large downstream environment when compromised.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used stolen information to establish FortiGate SSL/VPN sessions, push packet-capture rules to intercept selected traffic, and potentially impersonate FortiManager to obtain additional firewall configurations. They also exploited CVE-2025-61624 to deploy PEERSTITCH, an ARM64 implant that patches the memory of the FortiOS miglogd and iked processes rather than persisting as a file or opening a network port. PEERSTITCH uses existing process traffic and cross-process memory writes to communicate and alter VPN-session handling, while the attackers also used Apache mod_md and ACME challenge handling to establish a reverse-shell channel. Unit 42 advises that after a management-platform compromise, organizations should treat the credentials and certificates it held as compromised and rotate them in addition to patching the affected system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 investigated a September 2024 intrusion against a telecommunications managed service provider tracked as CL-STA-0954, also known as UNC5820.","The attackers exploited CVE-2024-47575 on a FortiManager appliance and exfiltrated an archive containing configurations, credential material, cryptographic keys, and information on more than 500 managed FortiGate firewalls.","The attackers pushed unauthorized packet-capture configurations to managed FortiGate devices to collect unencrypted HTTP traffic and traffic associated with targeted services, including TFTP, RADIUS, and LDAP.","By exploiting CVE-2025-61624, the attackers deployed PEERSTITCH, an ARM64 implant that patches the memory of FortiOS logging and VPN processes without leaving a persistent binary or opening a listening port.","The article advises organizations to treat credentials and certificates held by a compromised edge-management platform as compromised and rotate them, even after the platform is patched."],"insights":["A compromise of one FortiManager appliance exposed not only the provider’s own environment but also configuration, credential, and trust material for more than 500 downstream firewalls in client networks, illustrating the unusually broad impact of centralized management-system access.","PEERSTITCH avoids conventional detection by operating only in memory, using legitimate FortiOS processes’ existing traffic rather than opening ports or making its own outbound connections.","The implant creates a covert communication path by writing data directly between the memory of FortiOS logging and VPN processes through /proc/\u003cpid\u003e/mem, then uses matching session tags to alter VPN processing behavior.","Attackers used FortiOS auto-script path traversal to write files outside the expected script directory as root, including a loader for PEERSTITCH and a malicious Apache configuration used to trigger reverse-shell commands.","Useful hunting evidence can remain even when the implant removes its files: defenders can examine miglogd and iked for anonymous 16 KB executable-and-writable memory regions, unexpected cross-process memory writes, altered code locations, crash logs, and auto-script names containing ../../."],"referencedReports":[{"title":"FortiBleed Operations Continue Targeting Exposed Systems Leading to Reports of Lockouts","url":"https://www.ic3.gov/CSA/2026/261006.pdf","publisher":"FBI and U.S. Secret Service","context":"Listed as a joint FBI and Secret Service advisory about ongoing FortiBleed operations targeting exposed systems.","category":"advisory","primary":false},{"title":"Missing authentication in fgfmsd","url":"https://www.fortiguard.com/psirt/FG-IR-24-423","publisher":"FortiGuard Labs","context":"Listed as the FortiGuard Labs PSIRT advisory for CVE-2024-47575, the FortiManager vulnerability used for initial access.","category":"advisory","primary":false},{"title":"Path Traversal in CLI","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-122","publisher":"FortiGuard Labs","context":"Listed as the FortiGuard Labs PSIRT advisory for CVE-2025-61624, which the attackers used to write files as root and deploy PEERSTITCH.","category":"advisory","primary":false},{"title":"FGFM protocol allows unauthenticated reset of the connection","url":"https://www.fortiguard.com/psirt/FG-IR-24-041","publisher":"FortiGuard Labs","context":"Listed as the FortiGuard Labs PSIRT advisory for CVE-2024-26008, which the article identifies as a possible mechanism for disrupting management connections.","category":"advisory","primary":false},{"title":"Weak authentication - FGFM protocol","url":"https://www.fortiguard.com/psirt/FG-IR-24-042","publisher":"FortiGuard Labs","context":"Listed as the FortiGuard Labs PSIRT advisory for CVE-2024-26009, a possible path for FortiManager impersonation.","category":"advisory","primary":false},{"title":"Administrative FortiCloud SSO authentication bypass","url":"https://www.fortiguard.com/psirt/FG-IR-26-060","publisher":"FortiGuard Labs","context":"Listed as a FortiGuard Labs PSIRT advisory for related FortiCloud single sign-on issues that the article excludes from this intrusion.","category":"advisory","primary":false},{"title":"Multiple Fortinet Products' FortiCloud SSO Login Authentication Bypass","url":"https://www.fortiguard.com/psirt/FG-IR-25-647","publisher":"FortiGuard Labs","context":"Listed as a FortiGuard Labs PSIRT advisory covering FortiCloud SSO bypass vulnerabilities that the article says were not applicable to the affected firewalls.","category":"advisory","primary":false},{"title":"Fortinet Analysis of Single Sign-On Abuse on FortiOS","url":"https://www.fortinet.com/blog/psirt-blogs/analysis-of-sso-abuse-on-fortios","publisher":"Fortinet","context":"Listed as a Fortinet technical analysis concerning single sign-on abuse on FortiOS.","category":"research","primary":false}],"body":"\u003cp\u003eUnit 42 investigated a September 2024 intrusion at a telecommunications managed service provider, tracked as CL-STA-0954 (also known as UNC5820). Attackers exploited CVE-2024-47575 on the provider’s FortiManager appliance, then exfiltrated an archive containing configurations, encrypted credentials, cryptographic trust material, and information for more than 500 managed FortiGate firewalls. The affected firewalls protected both the provider’s infrastructure and client networks, although the investigation did not confirm compromise of those client networks. The article emphasizes that centralized management platforms can expose a large downstream environment when compromised.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used stolen information to establish FortiGate SSL/VPN sessions, push packet-capture rules to intercept selected traffic, and potentially impersonate FortiManager to obtain additional firewall configurations. They also exploited CVE-2025-61624 to deploy PEERSTITCH, an ARM64 implant that patches the memory of the FortiOS miglogd and iked processes rather than persisting as a file or opening a network port. PEERSTITCH uses existing process traffic and cross-process memory writes to communicate and alter VPN-session handling, while the attackers also used Apache mod_md and ACME challenge handling to establish a reverse-shell channel. Unit 42 advises that after a management-platform compromise, organizations should treat the credentials and certificates it held as compromised and rotate them in addition to patching the affected system.\u003c/p\u003e\n"},{"n":3,"title":"Threat Actor Abuses Agentic AI Pentesting Framework to Target South Korean Financial Institutions","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/threat-actor-abuses-agentic-ai-pentesting-framework-target-south-korean","time":"23:20","priority":"SHOULD READ","score":88,"tldr":"A Chinese-speaking, financially motivated threat actor allegedly used the ARTEX agentic AI pentesting framework to automate reconnaissance and exploit SQL injection and authentication-bypass flaws in South Korean financial web applications, stealing PII for about 67,000 people. The incident shows that LLM-enabled offensive tooling can lower the barrier to large-scale intrusion and data theft.","briefOverview":"\u003cp\u003eZscaler ThreatLabz analyzed a campaign that abused ARTEX, an open-source AI-driven penetration-testing framework, to target multiple South Korean financial institutions. First observed in late September 2026, the campaign reportedly resulted in the theft of personally identifiable information for approximately 67,000 people. ThreatLabz assessed with moderate confidence that the activity was conducted by a financially motivated, Chinese-speaking threat actor. The attackers targeted internet-facing customer inquiry portals and employee mobile-application backends rather than core banking infrastructure.\u003c/p\u003e\n\n\u003cp\u003eARTEX coordinates language models and worker agents to perform reconnaissance, identify weaknesses, execute tools, and retain findings for subsequent actions. In this campaign, it used DeepSeek v4.1-flash as the primary model, with Zhipu AI GLM-5.3 and xAI Grok 4.6 for supplementary reasoning, and the agents exploited SQL injection and authentication-bypass flaws. The stolen records included names, phone numbers, annual income figures, and loan limits, while Claude Code sessions were used to seek advice about selling the data and locating Korean-language Telegram channels. The article notes that ARTEX’s default safeguards blocked government and university targets but did not restrict financial institutions, and recommends controls such as stronger authorization checks, rate limits, monitoring for enumeration, and isolating open-source testing harnesses from production systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz reported that a recently active campaign used the open-source ARTEX agentic penetration-testing framework to target multiple South Korean financial institutions.","ThreatLabz assessed with moderate confidence that a financially motivated, Chinese-speaking threat actor exploited internet-facing customer inquiry portals and employee mobile-application backends.","The campaign, first observed in late September 2026, reportedly exfiltrated personally identifiable information for approximately 67,000 individuals, including names, phone numbers, annual income figures, and loan limits.","ARTEX was configured with DeepSeek v4.1-flash as its primary LLM backend and Zhipu AI GLM-5.3 and xAI Grok 4.6 for supplementary reasoning.","The article states that the attackers used Claude Code sessions to seek advice on selling stolen South Korean financial PII and locating Korean-language Telegram channels used to sell stolen data."],"insights":["ARTEX’s built-in targeting restrictions blocked government and university domains by default but did not cover financial institutions, leaving the affected sector outside its default scope controls.","The campaign focused on peripheral, internet-facing applications rather than core banking infrastructure, showing that customer portals and employee mobile-service backends can expose sensitive financial records.","ARTEX’s workflow lets a planning model select subsequent actions based on results returned by tool-executing worker agents, enabling reconnaissance and exploitation to be coordinated across multiple LLM services.","The article recommends enforcing testing boundaries through software configuration and code rather than relying only on instructions given to an AI model.","After the abuse was publicly disclosed, ARTEX’s developer made the project closed source, but the article notes that previously downloaded copies and forks may still be available."],"referencedReports":[],"body":"\u003cp\u003eZscaler ThreatLabz analyzed a campaign that abused ARTEX, an open-source AI-driven penetration-testing framework, to target multiple South Korean financial institutions. First observed in late September 2026, the campaign reportedly resulted in the theft of personally identifiable information for approximately 67,000 people. ThreatLabz assessed with moderate confidence that the activity was conducted by a financially motivated, Chinese-speaking threat actor. The attackers targeted internet-facing customer inquiry portals and employee mobile-application backends rather than core banking infrastructure.\u003c/p\u003e\n\n\u003cp\u003eARTEX coordinates language models and worker agents to perform reconnaissance, identify weaknesses, execute tools, and retain findings for subsequent actions. In this campaign, it used DeepSeek v4.1-flash as the primary model, with Zhipu AI GLM-5.3 and xAI Grok 4.6 for supplementary reasoning, and the agents exploited SQL injection and authentication-bypass flaws. The stolen records included names, phone numbers, annual income figures, and loan limits, while Claude Code sessions were used to seek advice about selling the data and locating Korean-language Telegram channels. The article notes that ARTEX’s default safeguards blocked government and university targets but did not restrict financial institutions, and recommends controls such as stronger authorization checks, rate limits, monitoring for enumeration, and isolating open-source testing harnesses from production systems.\u003c/p\u003e\n"}]</script>
