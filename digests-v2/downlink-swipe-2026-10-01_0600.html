<script type="application/json" id="dl-articles">[{"n":2,"title":"Hackers stole Pentagon personnel records of over 3 million people","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-breach-pentagon-human-resources-management-system-steal-data-of-nearly-3-million-people/","time":"09:44","priority":"MUST READ","score":94,"tldr":"The Pentagon’s Defense Manpower Data Center says a file-sharing-system breach exposed sensitive personnel data, including Social Security numbers, for more than 3 million military-related individuals between October 2025 and July 2026.","briefOverview":"\u003cp\u003eThe Pentagon’s Defense Manpower Data Center (DMDC) is notifying millions of military service members that unauthorized users accessed sensitive personnel data after exploiting a vulnerability in its file-sharing systems. According to notification letters, the access occurred between October 2025 and July 2026. The data involved varies by individual and may include names, Social Security numbers, dates of birth, contact information, sex, race, and military personnel information.\u003c/p\u003e\n\n\u003cp\u003ePentagon officials said more than 3 million people were affected, including nearly 2.8 million living individuals and 294,000 deceased individuals. DMDC said it began privacy and cybersecurity incident-response actions after discovering the issue and is assessing ways to improve the system’s security. The Pentagon is offering affected individuals 12 months of free credit monitoring through IDX, with enrollment required by August 19, 2027.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Pentagon’s Defense Manpower Data Center (DMDC) is notifying affected military personnel after unauthorized users accessed its human-resources management system between October 2025 and July 2026.","Pentagon officials said the incident affected more than 3 million people, including nearly 2.8 million living individuals and 294,000 deceased individuals.","The data taken varies by person and may include Social Security numbers, names, dates of birth, contact information, sex, race, and military personnel information.","DMDC said the unauthorized access resulted from a vulnerability in its file-sharing systems and that it initiated incident-response actions after discovering it.","The Pentagon is offering affected individuals 12 months of free credit monitoring through IDX, with enrollment available until August 19, 2027."],"insights":["The reported exposure period lasted from October 2025 through July 2026, indicating that unauthorized access persisted for months before the issue was addressed.","Although the incident affects more than 3 million people, DMDC holds more than 60 million records and supports benefits, financial, healthcare, veterans affairs, and other government functions, underscoring the system’s broad operational role.","The affected population includes 294,000 deceased individuals, showing that the compromised records were not limited to current service members.","Affected individuals must enroll in the offered IDX credit-monitoring service by August 19, 2027, making the support time-limited rather than automatic."],"referencedReports":[],"body":"\u003cp\u003eThe Pentagon’s Defense Manpower Data Center (DMDC) is notifying millions of military service members that unauthorized users accessed sensitive personnel data after exploiting a vulnerability in its file-sharing systems. According to notification letters, the access occurred between October 2025 and July 2026. The data involved varies by individual and may include names, Social Security numbers, dates of birth, contact information, sex, race, and military personnel information.\u003c/p\u003e\n\n\u003cp\u003ePentagon officials said more than 3 million people were affected, including nearly 2.8 million living individuals and 294,000 deceased individuals. DMDC said it began privacy and cybersecurity incident-response actions after discovering the issue and is assessing ways to improve the system’s security. The Pentagon is offering affected individuals 12 months of free credit monitoring through IDX, with enrollment required by August 19, 2027.\u003c/p\u003e\n"},{"n":4,"title":"Emerging Threat: (CVE-2026-86858) ServiceNow AI Platform Unauthenticated Privilege Escalation via GraphQL","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-86858-servicenow-ai-platform-unauthenticated-privilege-escalation-via-graphql/","time":"09:19","priority":"SHOULD READ","score":84,"tldr":"CVE-2026-86858 is a high-severity unauthenticated GraphQL flaw in the ServiceNow AI Platform that can let attackers alter instance data, including access and approval records. ServiceNow patched its hosted instances before disclosure, but self-hosted, partner-operated, deferred-patch, and forgotten sub-production instances should be identified and verified immediately.","briefOverview":"\u003cp\u003eCVE-2026-86858 is an improper access-control flaw in the ServiceNow AI Platform that ServiceNow describes as an unauthenticated privilege escalation through GraphQL. Under certain circumstances, an unauthenticated user can create, modify, or delete instance data beyond intended permissions. The vulnerability has a CVSS v4.0 base score of 8.7 and affects integrity, while ServiceNow rates confidentiality and availability impact as none.\u003c/p\u003e\n\n\u003cp\u003eThe risk is the ability to alter records governing access requests, approvals, incidents, change records, and CMDB entries without authentication. ServiceNow deployed the security update to hosted instances in August 2026, before publishing its advisory on September 24, 2026, and said it was not aware of malicious exploitation. Remaining work is concentrated among self-hosted, partner-operated, patch-deferred, and overlooked development, test, or sandbox instances; organizations should inventory these systems, verify their patch status and hosting arrangements, limit unnecessary internet access, and review relevant records and GraphQL logs for unauthorized writes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-86858 is an improper access-control flaw in the ServiceNow AI Platform that can allow an unauthenticated user to create, modify, or delete instance data through GraphQL.","ServiceNow assigned the flaw a CVSS v4.0 score of 8.7 and reported high integrity impact, with no confidentiality or availability impact.","ServiceNow deployed the security update to its hosted instances in August 2026, before the advisory was published on September 24, 2026.","Organizations with self-hosted, partner-operated, deferred-patch, development, test, or sandbox instances should verify patch levels and hosting arrangements.","Until patching is confirmed, defenders should review access-control and approval-record changes and inspect GraphQL logs for unauthenticated requests that resulted in writes."],"insights":["The flaw is especially concerning because it enables unauthorized changes rather than data theft, allowing quiet modification of access, approval, and workflow records that may create a durable foothold.","Most ServiceNow customers using standard vendor-hosted instances were already remediated before public disclosure, so the remaining risk is concentrated in self-hosted, partner-operated, deferred-patch, and overlooked sub-production environments.","An externally visible ServiceNow login page cannot reveal whether an instance is vendor-hosted, partner-hosted, self-hosted, or patched, making internal inventory and owner confirmation essential.","ServiceNow instance sprawl across business units, acquisitions, and development or sandbox environments is the practical exposure pattern highlighted by the article, rather than any particular industry-specific weakness."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-86858 is an improper access-control flaw in the ServiceNow AI Platform that ServiceNow describes as an unauthenticated privilege escalation through GraphQL. Under certain circumstances, an unauthenticated user can create, modify, or delete instance data beyond intended permissions. The vulnerability has a CVSS v4.0 base score of 8.7 and affects integrity, while ServiceNow rates confidentiality and availability impact as none.\u003c/p\u003e\n\n\u003cp\u003eThe risk is the ability to alter records governing access requests, approvals, incidents, change records, and CMDB entries without authentication. ServiceNow deployed the security update to hosted instances in August 2026, before publishing its advisory on September 24, 2026, and said it was not aware of malicious exploitation. Remaining work is concentrated among self-hosted, partner-operated, patch-deferred, and overlooked development, test, or sandbox instances; organizations should inventory these systems, verify their patch status and hosting arrangements, limit unnecessary internet access, and review relevant records and GraphQL logs for unauthorized writes.\u003c/p\u003e\n"},{"n":1,"title":"Metamask discloses security incident affecting its infrastructure","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/metamask-discloses-security-incident-affecting-its-infrastructure/","time":"07:33","priority":"SHOULD READ","score":78,"tldr":"MetaMask disclosed an ongoing infrastructure security incident but says there is no immediate threat to user wallets. As a precaution, it is exiting affected non-custodial Ethereum staking validators with support from external security partners.","briefOverview":"\u003cp\u003eMetaMask disclosed an ongoing security incident affecting some of its infrastructure. The company said it is addressing the issue internally with external partners and security advisers. MetaMask stated there is no immediate threat to MetaMask wallets, but did not specify which infrastructure was affected or whether systems or data were accessed or compromised.\u003c/p\u003e\n\n\u003cp\u003eAs a precaution, MetaMask is exiting affected validators from its non-custodial staking operations in coordination with clients and partners. It said it does not manage withdrawal keys for clients’ staked assets, while Lido Finance reported that MetaMask Staking is exiting Ethereum validators in the Lido protocol. Lido said the action could result in foregone rewards and possible downtime penalties, and that the final validators are expected to exit, though not be fully withdrawn, by the end of October 7, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["MetaMask disclosed an ongoing security incident affecting some of its infrastructure and said it is working with external partners and security advisers to address it.","MetaMask stated that there is no immediate threat to MetaMask wallets.","As a precaution, MetaMask is exiting affected validators in its non-custodial staking operations in coordination with clients and partners.","Lido Finance said MetaMask Staking is exiting Ethereum validators in the Lido protocol, a process expected to finish exiting the final validators by October 7, 2026, although they will not yet be fully withdrawn.","Lido Finance said the precautionary exits may result in foregone rewards and possible downtime penalties if validators are taken offline."],"insights":["MetaMask’s response focuses on withdrawing affected staking validators rather than restricting wallet access, consistent with its statement that there is no immediate threat to wallets.","Because MetaMask’s staking operation is non-custodial and does not control customers’ withdrawal keys, the company says it cannot directly manage clients’ staked-asset withdrawal keys.","The precautionary validator exits can create financial costs even without a confirmed wallet impact, including lost staking rewards and possible downtime penalties.","The final validators are expected to have exited by October 7, 2026, but Lido noted that exiting does not mean the assets will be fully withdrawn by that date."],"referencedReports":[{"title":"Security Disclosure: MetaMask Staking Precautionary Out-of-Order Exits","url":"https://research.lido.fi/t/security-disclosure-metamask-staking-precautionary-out-of-order-exits/11961","publisher":"lido-finance","context":"Lido Finance disclosed that MetaMask Staking was precautionarily exiting Ethereum validators in the Lido protocol and described potential reward losses and downtime penalties.","category":"advisory","primary":false}],"body":"\u003cp\u003eMetaMask disclosed an ongoing security incident affecting some of its infrastructure. The company said it is addressing the issue internally with external partners and security advisers. MetaMask stated there is no immediate threat to MetaMask wallets, but did not specify which infrastructure was affected or whether systems or data were accessed or compromised.\u003c/p\u003e\n\n\u003cp\u003eAs a precaution, MetaMask is exiting affected validators from its non-custodial staking operations in coordination with clients and partners. It said it does not manage withdrawal keys for clients’ staked assets, while Lido Finance reported that MetaMask Staking is exiting Ethereum validators in the Lido protocol. Lido said the action could result in foregone rewards and possible downtime penalties, and that the final validators are expected to exit, though not be fully withdrawn, by the end of October 7, 2026.\u003c/p\u003e\n"},{"n":3,"title":"Google Rolls Out Gemini 4 Argon to Trusted Cyber Defenders, Plans Guardrail-Free Version","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/google-rolls-out-gemini-4-argon-to.html","time":"07:49","priority":"SHOULD READ","score":78,"tldr":"Google has launched Gemini 4 Argon for trusted cyber defenders, claiming major improvements in autonomous vulnerability discovery, validation, and patching. The company plans a guardrail-free version for vetted users while strengthening controls against misuse, misalignment, and indirect prompt injection.","briefOverview":"\u003cp\u003eGoogle has announced Gemini 4 Argon, a frontier AI model being made available to selected trusted cyber defenders through its Fairwind Program. The company says the model supports complex software engineering, enterprise work, and cybersecurity defense. Google describes Argon as highly capable of autonomously finding, validating, and patching critical software vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eGoogle said Argon improves on Gemini 3.8 Flash Cyber in attack-surface discovery and in generating proof-of-concept code to validate findings. It reportedly identified an unknown critical issue affecting healthcare software used by hospitals worldwide that exposed sensitive personal information, although Google did not identify the software. Google plans to give trusted defenders and internal teams a version without cyber guardrails, while strengthening protections against misuse, misalignment, and indirect prompt injection before a broader rollout.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google has announced Gemini 4 Argon and is rolling it out to a set of trusted cyber defenders through its Fairwind Program.","Google says Gemini 4 Argon can autonomously find, validate, and patch critical software vulnerabilities and shows improvements over Gemini 3.8 Flash Cyber in discovering attack surfaces and generating proof-of-concept code.","Google said Argon identified a previously unknown critical flaw that exposed sensitive personal information in healthcare software used by hospitals worldwide, but did not name the affected software.","Google plans to provide a version of Argon without cyber guardrails to trusted defenders and internal teams.","Before a broader rollout, Google is strengthening safeguards against misuse, misalignment, and indirect prompt injections, including monitoring the model's reasoning and actions and stopping execution when necessary."],"insights":["Google is limiting Gemini 4 Argon’s initial access to trusted defenders while separately planning a less-restricted version for vetted defenders and internal teams, indicating that access controls are part of its deployment approach.","The model’s reported discovery of an unknown critical issue in healthcare software connects its capabilities to systems handling sensitive personal data at hospitals worldwide.","Google identifies indirect prompt injection—where outside content can influence an AI system—as a specific risk it is addressing before broader availability.","Google says it will monitor Argon’s internal reasoning and actions and halt execution when needed as a mitigation for unsafe or misaligned behavior."],"referencedReports":[{"title":"Gemini 4 Argon Model Evaluation","url":"https://storage.googleapis.com/deepmind-media/gemini/gemini_4_argon_model_evaluation.pdf","publisher":"google-deepmind","context":"Google released this model evaluation, which states that Argon ranks first on Gray Swan's indirect prompt injection benchmark.","category":"research","primary":true}],"body":"\u003cp\u003eGoogle has announced Gemini 4 Argon, a frontier AI model being made available to selected trusted cyber defenders through its Fairwind Program. The company says the model supports complex software engineering, enterprise work, and cybersecurity defense. Google describes Argon as highly capable of autonomously finding, validating, and patching critical software vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eGoogle said Argon improves on Gemini 3.8 Flash Cyber in attack-surface discovery and in generating proof-of-concept code to validate findings. It reportedly identified an unknown critical issue affecting healthcare software used by hospitals worldwide that exposed sensitive personal information, although Google did not identify the software. Google plans to give trusted defenders and internal teams a version without cyber guardrails, while strengthening protections against misuse, misalignment, and indirect prompt injection before a broader rollout.\u003c/p\u003e\n"}]</script>
