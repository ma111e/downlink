<script type="application/json" id="dl-articles">[{"n":2,"title":"In 2025, Japan Warned Microsoft of a ‘Message Scam’, Software Giant Traced it to China…","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/in-2025-japan-warned-microsoft-of-a-message-scam-software-giant-traced-it-to-china/","time":"17:31","priority":"SHOULD READ","score":82,"tldr":"Microsoft and Health-ISAC disrupted three Chinese-language cybercrime stores—YAM Store, CoGui, and IronMan—by seizing and redirecting their online infrastructure after the operations reportedly targeted 75,000 companies worldwide.","briefOverview":"\u003cp\u003eMicrosoft and Health-ISAC conducted a coordinated action against three Chinese-language cybercrime stores: YAM Store, CoGui, and IronMan. They seized and redirected the online infrastructure used to support the stores. The article describes the effort as an offensive against transnational cybercrime.\u003c/p\u003e\n\n\u003cp\u003eAccording to the headline, Japan warned Microsoft of a message scam in 2025, and Microsoft traced it to China months later. The three stores reportedly affected 75,000 companies around the world. The action blocked the stores’ online infrastructure, targeting services said to have supported this broad impact.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft and Health-ISAC seized and redirected online infrastructure used by three Chinese-language cybercrime stores: YAM Store, CoGui, and IronMan.","Japan warned Microsoft of a message scam in 2025, according to the article headline.","Microsoft traced the operation to China months later, according to the article headline.","The three stores reportedly affected 75,000 companies around the world.","The action was described as a coordinated offensive against transnational cybercrime."],"insights":["The reported timeline shows that Japan’s 2025 warning about a message scam was linked to the Chinese-based operations only months later.","The response went beyond identifying the stores: Microsoft and Health-ISAC reportedly seized and redirected the online infrastructure supporting them.","Although the stores were described as Chinese-language, the article says they affected 75,000 companies worldwide, underscoring the cross-border reach of the activity."],"referencedReports":[{"title":"2026 Censys State of the Internet Report","url":"https://health-isac.org/2026-censys-state-of-the-internet-report/","publisher":"censys","context":"The article lists this report in its Related Resources \u0026 News section.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft and Health-ISAC conducted a coordinated action against three Chinese-language cybercrime stores: YAM Store, CoGui, and IronMan. They seized and redirected the online infrastructure used to support the stores. The article describes the effort as an offensive against transnational cybercrime.\u003c/p\u003e\n\n\u003cp\u003eAccording to the headline, Japan warned Microsoft of a message scam in 2025, and Microsoft traced it to China months later. The three stores reportedly affected 75,000 companies around the world. The action blocked the stores’ online infrastructure, targeting services said to have supported this broad impact.\u003c/p\u003e\n"},{"n":1,"title":"A Fake China Domain Registry Warns Your CEO About .cn Names","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/fake-china-domain-registry-defensive-cn-registration-pretext-reply-only-phish","time":"11:00","priority":"MAY READ","score":65,"tldr":"A phishing scam posing as a Chinese domain registry used an urgent .cn registration warning to lure a UK manufacturer into replying, despite passing SPF, DKIM, and DMARC and containing no malicious links or attachments. The case shows that reply-only social engineering requires behavioral and language-based detection beyond authentication and payload scanning.","briefOverview":"\u003cp\u003eA UK industrial equipment manufacturer received an urgent email that claimed to come from a China domain registration center. It warned that a third party was about to register the company’s name under .cn, .com.cn, .net.cn, and .org.cn domains and asked whether that party was an authorized distributor. The message was directed to a shared partnership-inquiry mailbox as “Dear CEO,” with the intended first-stage outcome being a reply rather than an immediate payment or download.\u003c/p\u003e\n\n\u003cp\u003eThe sender’s technical details did not support its claimed identity: its .net domain was registered through Name.com behind a privacy proxy, its sending server was geolocated by Microsoft to the United States, and the message used a Foxmail client header despite claiming to be based in Shanghai. SPF, DKIM, and DMARC all passed because the sender authenticated a domain it controlled, and the email included no attachments, QR codes, or meaningful links for scanners to assess. Microsoft routed it to Junk, while IRONSCALES quarantined and automatically resolved it as phishing based on language, community, and first-time-sender signals; no one replied and no harm was recorded.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A UK industrial equipment manufacturer received an urgent email posing as a China domain registration center and claiming that a third party sought to register the company’s name under four .cn-related domains.","The email contained no links, attachments, or QR codes beyond a hotlinked signature image, and its intended payload was to induce the recipient to reply.","The message passed SPF, DKIM, and DMARC because the sender controlled and authenticated its own domain, while Microsoft routed it to Junk with a spam verdict.","The sender’s claimed Shanghai registry identity conflicted with records showing a privacy-protected Name.com .net domain, a sending server geolocated to the United States, and a Foxmail client header.","IRONSCALES quarantined and automatically resolved the incident as phishing after matching its language and signature pattern to known China domain-registration scam templates."],"insights":["Passing sender-authentication checks does not establish that an email is trustworthy, because the scammer used a domain they controlled and authenticated it correctly.","The scam’s first-stage objective was not a payment or a malicious download but a reply, meaning file and link scanning alone had little to inspect.","The article shows that checking whether the sender’s technical records match its claimed identity can expose a false business pretext, such as a supposed Shanghai registry using a privacy-protected .net domain and a U.S.-geolocated sending server.","The message targeted a shared partnership mailbox with an appeal to the CEO, illustrating how urgency and brand-protection concerns can be used to prompt internal escalation."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for phishing and pretexting initial-access statistics and for its observation that AI-assisted malicious email text doubled year over year.","category":"research","primary":false}],"body":"\u003cp\u003eA UK industrial equipment manufacturer received an urgent email that claimed to come from a China domain registration center. It warned that a third party was about to register the company’s name under .cn, .com.cn, .net.cn, and .org.cn domains and asked whether that party was an authorized distributor. The message was directed to a shared partnership-inquiry mailbox as “Dear CEO,” with the intended first-stage outcome being a reply rather than an immediate payment or download.\u003c/p\u003e\n\n\u003cp\u003eThe sender’s technical details did not support its claimed identity: its .net domain was registered through Name.com behind a privacy proxy, its sending server was geolocated by Microsoft to the United States, and the message used a Foxmail client header despite claiming to be based in Shanghai. SPF, DKIM, and DMARC all passed because the sender authenticated a domain it controlled, and the email included no attachments, QR codes, or meaningful links for scanners to assess. Microsoft routed it to Junk, while IRONSCALES quarantined and automatically resolved it as phishing based on language, community, and first-time-sender signals; no one replied and no harm was recorded.\u003c/p\u003e\n"}]</script>
