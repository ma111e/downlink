<script type="application/json" id="dl-articles">[{"n":2,"title":"Attackers' AI Agents Found a Zero-Day in Medical-Imaging Software and Gained Root Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/attackers-ai-agents-found-zero-day-in.html","time":"11:03","priority":"SHOULD READ","score":88,"tldr":"China-linked operators reportedly used Cairn AI agents to discover and exploit a critical path-traversal zero-day in exposed MONAI Label servers, achieving root access on at least one university system. No patched release is available yet, so organizations should restrict network exposure, enable authentication, and run MONAI Label with minimal privileges.","briefOverview":"\u003cp\u003eSuspected China-linked operators used Cairn, an open-source framework for automated AI penetration-testing agents, to find a previously unknown flaw in MONAI Label. Amazon Threat Intelligence said the agents mapped the application\u0026rsquo;s interface and obtained the ability to write files on a university server in roughly 11 minutes. The operator reportedly selected targets and set the goal of gaining shell access, while the agents chose methods independently.\u003c/p\u003e\n\n\u003cp\u003eThe issue, CVE-2026-133968, is a critical path-traversal flaw affecting MONAI Label 0.8.5 and earlier in the default configuration, where authentication is disabled. It allows a network-reachable, unauthenticated caller to write files outside the intended storage folder; on one university server, the attackers later used this capability to place a Python startup file and gain root access when a training feature launched a new Python process. Project MONAI has merged a source-code fix but has not released a patched package, so affected users are advised to restrict network access, enable authentication, limit service-account permissions, and check exposed systems for unexpected Python startup files or unusual training jobs.\u003c/p\u003e\n\n\u003cp\u003eAmazon based its account on a reconstruction aided by an exposed, unprotected Cairn control panel belonging to the operators, which revealed prompts, settings, and run history. The company linked the activity to a China-related actor with moderate confidence based on Simplified Chinese prompts, China Standard Time settings, and target selection, but did not name a group or establish government involvement. The report does not show that patient records were taken or that clinical systems were reached, and it notes that root access on one server does not mean every MONAI Label deployment would be affected in the same way.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Suspected China-linked operators used Cairn, an open-source AI-agent framework, to discover and exploit a previously unknown path-traversal flaw in MONAI Label.","The flaw affects MONAI Label 0.8.5 and earlier default installations, where authentication is disabled and user-provided file identifiers can cause files to be written outside the intended storage folder.","Amazon Threat Intelligence reported that the agents reached the ability to write files to a university server in roughly 11 minutes and later obtained root access on one server by placing a Python startup file and triggering a training feature.","Project MONAI merged a source-code fix on October 19, but its advisory says no patched release is yet available; the CVE record identifies the issue as CVE-2026-133968 with a critical 9.8 score.","Organizations running MONAI Label should restrict untrusted network access, enable authentication, use limited service accounts, confirm source builds include the fix, and inspect exposed systems for unexpected Python startup files or unusual training jobs."],"insights":["Amazon reconstructed the campaign because the attackers exposed their own Cairn control panel without a password, revealing agent prompts, task settings, and run history.","The reported root compromise was not an automatic result of the file-writing flaw: it depended on placing a Python startup file and triggering a feature that launched a new Python process, and would vary with each server's configuration and permissions.","Although the fix has been merged into MONAI Label’s source code, the latest published package remains version 0.8.5, so users cannot assume an ordinary package installation contains the correction.","The operator reportedly provided the targets and a goal of obtaining shell access, while the AI agents independently mapped the application and selected methods to pursue that goal."],"referencedReports":[{"title":"Chinese Nexus Actors Used Cairn AI Agents to Find a Zero-Day on Their Own","url":"https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/","publisher":"amazon-threat-intelligence","context":"The article cites Amazon's incident report for its reconstruction of the campaign, including the agents' activity and the reported root compromise.","category":"research","primary":true},{"title":"GHSA-qc22-rmgc-vg94","url":"https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94","publisher":"project-monai","context":"The article cites Project MONAI's security advisory to confirm that no patched MONAI Label release was available at publication time.","category":"advisory","primary":false}],"body":"\u003cp\u003eSuspected China-linked operators used Cairn, an open-source framework for automated AI penetration-testing agents, to find a previously unknown flaw in MONAI Label. Amazon Threat Intelligence said the agents mapped the application\u0026rsquo;s interface and obtained the ability to write files on a university server in roughly 11 minutes. The operator reportedly selected targets and set the goal of gaining shell access, while the agents chose methods independently.\u003c/p\u003e\n\n\u003cp\u003eThe issue, CVE-2026-133968, is a critical path-traversal flaw affecting MONAI Label 0.8.5 and earlier in the default configuration, where authentication is disabled. It allows a network-reachable, unauthenticated caller to write files outside the intended storage folder; on one university server, the attackers later used this capability to place a Python startup file and gain root access when a training feature launched a new Python process. Project MONAI has merged a source-code fix but has not released a patched package, so affected users are advised to restrict network access, enable authentication, limit service-account permissions, and check exposed systems for unexpected Python startup files or unusual training jobs.\u003c/p\u003e\n\n\u003cp\u003eAmazon based its account on a reconstruction aided by an exposed, unprotected Cairn control panel belonging to the operators, which revealed prompts, settings, and run history. The company linked the activity to a China-related actor with moderate confidence based on Simplified Chinese prompts, China Standard Time settings, and target selection, but did not name a group or establish government involvement. The report does not show that patient records were taken or that clinical systems were reached, and it notes that root access on one server does not mean every MONAI Label deployment would be affected in the same way.\u003c/p\u003e\n"},{"n":3,"title":"GnuPG Warns Critical GPGME Flaw Could Expose App Data via Malicious OpenPGP Keys","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/gnupg-warns-critical-gpgme-flaw-could.html","time":"11:05","priority":"SHOULD READ","score":88,"tldr":"GnuPG has patched a critical double-free flaw (CVE-2026-129975) in GPGME that malicious OpenPGP keys could use to expose application data and potentially enable remote code execution. Users should update to GPGME 2.3.1, Gpg4win 5.1.2, or rebuild applications with bundled or statically linked vulnerable copies.","briefOverview":"\u003cp\u003eGnuPG warned of CVE-2026-129975, a critical flaw in GPGME that can be triggered by a malicious OpenPGP key with an unusually long user ID. The issue affects software using GPGME versions before 2.3.0, including programs that load it as a shared library, Windows DLL, or statically linked component. GnuPG said the flaw could expose data from affected applications, and remote code execution cannot be ruled out.\u003c/p\u003e\n\n\u003cp\u003eThe problem is a double-free memory error in the read_status() and read_colon_line() routines, which process status lines and key listings from GnuPG. When long input causes buffer expansion and an error occurs before the new buffer address is saved, cleanup can attempt to release already freed memory again. GnuPG released GPGME 2.3.1 and Gpg4win 5.1.2, while legacy users can use version 1.24.4 or the advisory\u0026rsquo;s patch; bundled and statically linked copies require rebuilt application releases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GnuPG warned that CVE-2026-129975 is a critical double-free flaw in GPGME triggered by malicious OpenPGP keys with unusually long user IDs.","The flaw affects software using GPGME versions before 2.3.0, including shared, Windows DLL, and statically linked installations.","Affected software can include many mail and XMPP clients, Samba, Gpg4win, GnuPG Desktop, and GnuPG VS-Desktop.","GnuPG has released GPGME 2.3.1 and Gpg4win 5.1.2 to address the issue, while the legacy branch received version 1.24.4.","The project reported no known exploitation, but said the flaw could expose application data and that remote code execution cannot be ruled out."],"insights":["Updating only a system-installed GPGME library will not protect applications that include their own bundled or statically linked copy; those applications require rebuilt releases from their developers.","The advisory provides no temporary workaround for software that cannot yet update, making installation of a fixed release or patch the stated remediation path.","The bug can be reached through signed data sent to an application, rather than necessarily requiring a user to manually import a malicious key.","The double-free occurs when an error interrupts buffer resizing, leaving the program with a reference to memory that has already been released.","GnuPG moved disclosure forward because GitLab needed to update earlier in response to the separate Ruby2Shell issue."],"referencedReports":[{"title":"GnuPG Security Advisory 000517","url":"https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html","publisher":"gnupg-project","context":"The article links GnuPG's security advisory for details on the fixed GPGME release and available remediation options.","category":"advisory","primary":true},{"title":"T8557","url":"https://static.dev.gnupg.org/T8557.html","publisher":"gnupg-project","context":"The article cites this GnuPG tracker entry for technical details of the double-free condition in the affected routines.","category":"research","primary":true}],"body":"\u003cp\u003eGnuPG warned of CVE-2026-129975, a critical flaw in GPGME that can be triggered by a malicious OpenPGP key with an unusually long user ID. The issue affects software using GPGME versions before 2.3.0, including programs that load it as a shared library, Windows DLL, or statically linked component. GnuPG said the flaw could expose data from affected applications, and remote code execution cannot be ruled out.\u003c/p\u003e\n\n\u003cp\u003eThe problem is a double-free memory error in the read_status() and read_colon_line() routines, which process status lines and key listings from GnuPG. When long input causes buffer expansion and an error occurs before the new buffer address is saved, cleanup can attempt to release already freed memory again. GnuPG released GPGME 2.3.1 and Gpg4win 5.1.2, while legacy users can use version 1.24.4 or the advisory\u0026rsquo;s patch; bundled and statically linked copies require rebuilt application releases.\u003c/p\u003e\n"},{"n":1,"title":"A Single Malicious Webpage Let Researchers Hijack Meta Muse and Access Private Chats","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/a-single-malicious-webpage-let.html","time":"11:53","priority":"SHOULD READ","score":82,"tldr":"Researchers showed that a malicious webpage could hijack Meta Muse’s cloud environment to access and alter private chats, memories, and potentially connected-account credentials, though the attack was contained to one user’s machine. NebuSec said Meta fixed the reported flaws before disclosure.","briefOverview":"\u003cp\u003eNebuSec researchers demonstrated in a laboratory that a malicious webpage could extract and alter a Meta Muse user’s private conversations and stored memories without an approval prompt. The same approach could potentially reach credentials Muse keeps for connected accounts. The demonstration did not target real users and remained inside the individual user’s cloud machine.\u003c/p\u003e\n\n\u003cp\u003eThe researchers chained a flaw in Muse’s built-in browser with a Linux kernel flaw to gain full control of that cloud machine. This access reached the credential store, saved files, and Sentinel, the monitoring layer intended to control outbound actions and isolate sensitive data from the agent. The compromise did not extend to the shared server beneath the machine or to other users’ machines, and NebuSec said all reported exploits were fixed before publication.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NebuSec researchers demonstrated that a malicious webpage could extract and alter Meta Muse users’ private conversations and stored memories without showing an approval prompt.","The researchers chained a flaw in Muse’s built-in browser with a Linux kernel flaw to take full control of an individual user’s cloud machine.","Full control of the cloud machine could reach Muse’s credential store, saved files, and Sentinel monitoring layer, although the test did not escape to the underlying shared server or other users’ machines.","The demonstration was conducted in a laboratory and did not target real users, according to the article.","NebuSec said it reported the findings to Meta Muse’s team and that all described exploits were fixed before publication."],"insights":["Muse’s protections were designed on the assumption that the AI agent itself could be manipulated, yet the researchers found a path that reached protected components by taking over the user’s cloud machine rather than relying on the agent alone.","The reported issue was not limited to reading private information: the malicious webpage could also alter a user’s stored conversations and memories without an approval prompt.","Although connected-account passwords and tokens were intended to be inaccessible to the agent, the researchers said full control of the cloud machine could reach the credential store.","The demonstrated compromise remained confined to a single user’s cloud machine and did not extend to the shared underlying server or other users’ machines."],"referencedReports":[{"title":"Meta Muse Credential Exposure","url":"https://nebusec.ai/research/meta-muse-credential-exposure/","publisher":"nebusec","context":"The article cites NebuSec's research write-up describing how a malicious webpage could access and alter Muse conversations and stored memories without user approval.","category":"research","primary":true},{"title":"Inside Meta Muse","url":"https://nebusec.ai/research/inside-meta-muse/","publisher":"nebusec","context":"The article cites this NebuSec technical breakdown for the browser and Linux kernel flaw chain used to take control of a user's Muse cloud machine.","category":"research","primary":true}],"body":"\u003cp\u003eNebuSec researchers demonstrated in a laboratory that a malicious webpage could extract and alter a Meta Muse user’s private conversations and stored memories without an approval prompt. The same approach could potentially reach credentials Muse keeps for connected accounts. The demonstration did not target real users and remained inside the individual user’s cloud machine.\u003c/p\u003e\n\n\u003cp\u003eThe researchers chained a flaw in Muse’s built-in browser with a Linux kernel flaw to gain full control of that cloud machine. This access reached the credential store, saved files, and Sentinel, the monitoring layer intended to control outbound actions and isolate sensitive data from the agent. The compromise did not extend to the shared server beneath the machine or to other users’ machines, and NebuSec said all reported exploits were fixed before publication.\u003c/p\u003e\n"}]</script>
