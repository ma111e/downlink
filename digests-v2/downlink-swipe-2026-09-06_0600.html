<script type="application/json" id="dl-articles">[{"n":2,"title":"Attackers Hijack MikroTik Routers Through Internet-Exposed SSH Without Authentication","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-hijack-mikrotik-routers.html","time":"09:32","priority":"MUST READ","score":94,"tldr":"Attackers are actively exploiting internet-exposed MikroTik RouterOS SSH services to gain unauthenticated administrative control. MikroTik users should immediately install the fixed RouterOS releases, restrict management access, and check for unauthorized users, scripts, logs, or suspicious device status.","briefOverview":"\u003cp\u003eAttackers are exploiting MikroTik routers that have their SSH remote-access service reachable from the internet, according to a September 5 warning from CERT Polska. The attacks can give full administrative control without authentication, and successful attacks date to at least September 2. The article says no victim count or attacker identity was available in The Hacker News’s September 6 review.\u003c/p\u003e\n\n\u003cp\u003eMikroTik has published fixed RouterOS releases, and CERT Polska says the fixes prevent the observed attacks. CERT recommends immediate installation of the updates, followed by checks for unauthorized configuration changes. Until updates can be installed, CERT advises turning off exposed services or limiting access to trusted management networks, especially for SSH, WWW/WWW-SSL, and bandwidth-test.\u003c/p\u003e\n\n\u003cp\u003eThe affected RouterOS ranges reported by CERT include versions from 6.0.0 below 6.49.21, from 7.0.0 below 7.23.4, and from 7.24 below 7.24.2, with a development-channel fix in 7.25beta3. After updating, users are told to inspect logs, run /system/device-mode/print, and look for unknown users, scripts, and other unrecognized changes. CERT also points to unexpected highly privileged ops accounts and account-creation logs containing ssh:-2@ as signs to investigate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT Polska warned on September 5 that attackers are exploiting MikroTik routers with internet-reachable SSH service to gain full administrative control without authentication.","Successful attacks have been observed since at least September 2, but the warning did not include a victim count or identify the attackers.","MikroTik has listed fixed RouterOS releases, and CERT Polska says the fixes prevent the observed attacks and should be installed immediately.","CERT Polska recommends turning off exposed services or restricting access to trusted management networks until updates can be installed, especially for SSH, WWW/WWW-SSL, and bandwidth-test.","After updating, users should check logs, inspect device status with /system/device-mode/print, and look for unauthorized configuration changes such as unknown users or scripts."],"insights":["Home MikroTik devices should block public access to management ports if their default firewall rules remain intact, so exposed management services may indicate non-default or altered configuration.","CERT Polska specifically warns not to clear RouterOS “Flagged” status before preserving evidence and completing analysis, because that status may indicate suspicious startup-detected configuration.","CERT Polska identifies unexpected highly privileged “ops” accounts and account-creation logs containing “ssh:-2@” as concrete signs that require investigation.","The article notes that although CERT calls the observed two-flaw combination “MikroTrick,” the public disclosures do not explicitly identify which two vulnerabilities are chained or how they combine to provide administrative control.","The article states that the available dates do not prove whether a fix was public before attacks began, so the zero-day status remains unverified."],"referencedReports":[{"title":"CERT Polska attack warning on vulnerabilities in MikroTik RouterOS actively exploited","url":"https://cert.pl/en/posts/2026/09/vulnerabilities-in-mikrotik-routeros-actively-exploited/","publisher":"CERT Polska","context":"The article cites CERT Polska's September 5 warning that attackers are exploiting internet-exposed MikroTik SSH services to gain administrative control without authentication.","category":"advisory","primary":true},{"title":"MikroTik September 2026 vulnerability security update","url":"https://mikrotik.com/supportsec/september-2026-vulnerability/","publisher":"MikroTik","context":"The article cites MikroTik's security update for the fixed RouterOS releases that address the observed attacks.","category":"advisory","primary":true},{"title":"CERT Polska affected RouterOS versions disclosure","url":"https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve/","publisher":"CERT Polska","context":"The article references CERT Polska's affected RouterOS version ranges and compares them with MikroTik's listed fixes.","category":"advisory","primary":true},{"title":"CERT Polska guide for preserving MikroTik logs and configuration","url":"https://wiedza.cert.pl/obsluga-incydentow/zabezpieczanie-danych/urzadzenia-sieciowe/zabezpieczanie-logow-i-konfiguracji-mikrotik/","publisher":"CERT Polska","context":"The article points to CERT Polska's Polish guide explaining how to export and download MikroTik logs and configuration before resetting a suspected compromised router.","category":"guide","primary":false},{"title":"MikroTik Flagged status guidance","url":"https://manual.mikrotik.com/docs/system-information-and-utilities/device-mode","publisher":"MikroTik","context":"The article cites MikroTik guidance explaining that RouterOS flags a device when startup checks detect suspicious configuration.","category":"guide","primary":false}],"body":"\u003cp\u003eAttackers are exploiting MikroTik routers that have their SSH remote-access service reachable from the internet, according to a September 5 warning from CERT Polska. The attacks can give full administrative control without authentication, and successful attacks date to at least September 2. The article says no victim count or attacker identity was available in The Hacker News’s September 6 review.\u003c/p\u003e\n\n\u003cp\u003eMikroTik has published fixed RouterOS releases, and CERT Polska says the fixes prevent the observed attacks. CERT recommends immediate installation of the updates, followed by checks for unauthorized configuration changes. Until updates can be installed, CERT advises turning off exposed services or limiting access to trusted management networks, especially for SSH, WWW/WWW-SSL, and bandwidth-test.\u003c/p\u003e\n\n\u003cp\u003eThe affected RouterOS ranges reported by CERT include versions from 6.0.0 below 6.49.21, from 7.0.0 below 7.23.4, and from 7.24 below 7.24.2, with a development-channel fix in 7.25beta3. After updating, users are told to inspect logs, run /system/device-mode/print, and look for unknown users, scripts, and other unrecognized changes. CERT also points to unexpected highly privileged ops accounts and account-creation logs containing ssh:-2@ as signs to investigate.\u003c/p\u003e\n"},{"n":1,"title":"Four REVSTEALER-Linked Modules Disable Windows Update and Defender to Run a Crypto Miner","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/four-revstealer-linked-modules-disable.html","time":"08:34","priority":"SHOULD READ","score":82,"tldr":"Elastic researchers found four persistent REVSTEALER-linked Windows modules that remain after the main infostealer deletes itself, including LockAppHost, which disables Windows Update and weakens Microsoft Defender before running a crypto miner. Victims should not assume cleanup is complete after removing the stealer, because the modules can keep stealing wallets, hijacking crypto transactions, proxying traffic, or mining in the background.","briefOverview":"\u003cp\u003eElastic Security Labs documented four previously unreported programs associated with REVSTEALER, an emerging Windows information stealer. The programs are named ProManager, WinUpdate, SoftManager, and LockAppHost, and they remain on an infected machine after the core stealer reports completion and deletes itself. Elastic said the programs share REVSTEALER’s build tradecraft, including the same packer, runtime function resolution, and use of Polygon smart contracts for backup configuration.\u003c/p\u003e\n\n\u003cp\u003eThe modules have different roles that extend the impact of an infection beyond the initial theft of data. ProManager targets desktop cryptocurrency wallets, WinUpdate replaces copied cryptocurrency addresses and collects likely recovery phrases, SoftManager turns the machine into a reverse proxy, and LockAppHost runs a cryptocurrency miner. LockAppHost is the most disruptive because it gains administrator rights, disables Windows Update services and scheduled tasks, adds Microsoft Defender exclusions, and hides a miner within legitimate Windows processes.\u003c/p\u003e\n\n\u003cp\u003eREVSTEALER itself steals browser passwords and cookies, cryptocurrency wallets, gaming accounts, messaging data, VPN and FTP configuration, Windows Credential Manager data, password manager data, and selected documents. It has been spread mainly through game-cheat lures promoted on YouTube channels, and it has also been packaged as pirated or impersonated software, including a fake “Claude Opus 5 Free Desktop” application. Elastic warned that responders should look for surviving modules after the core stealer disappears, re-enable Windows Update components and remove Defender exclusions where LockAppHost has run, and affected users should change passwords and end active account sessions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs documented four previously unreported programs associated with REVSTEALER named ProManager, WinUpdate, SoftManager, and LockAppHost that install themselves in the user’s profile and remain after the core stealer deletes itself.","LockAppHost gains administrator rights, disables Windows Update services and scheduled update tasks, adds Microsoft Defender exclusions, and runs a cryptocurrency miner hidden within legitimate Windows processes.","ProManager targets desktop cryptocurrency wallets by overlaying attacker-controlled content on wallet windows and recording passwords or passphrases typed or pasted into identified fields.","WinUpdate watches the clipboard, replaces copied cryptocurrency addresses with the attacker’s addresses, and collects text that looks like a wallet recovery phrase.","REVSTEALER is distributed mainly through game-cheat lures on YouTube channels and has also been packaged as pirated or impersonated software, including a fake “Claude Opus 5 Free Desktop” application."],"insights":["A REVSTEALER infection can appear resolved because the core stealer reports completion and deletes itself, but separate persistent modules may continue operating on the machine afterward.","Elastic did not observe the four modules being delivered onto a live REVSTEALER host, so their connection to REVSTEALER is based on shared build tradecraft and investigative context rather than a captured delivery chain.","Systems affected by LockAppHost require more than miner removal because the module leaves behind weakened defenses, including disabled Windows Update components and Microsoft Defender exclusions.","Password resets alone may be insufficient for affected users because REVSTEALER steals session cookies and the Chrome App-Bound Encryption key, so active account sessions should also be ended.","Elastic’s public YARA coverage includes the core stealer and three modules but does not include a rule for LockAppHost, the module that disables updates and runs the miner."],"referencedReports":[{"title":"REVSTEALER Credential Harvesting Infostealer","url":"https://www.elastic.co/security-labs/threat-command/revstealer-credential-harvesting-infostealer","publisher":"elastic-security-labs","context":"The article says Elastic Security Labs published findings on REVSTEALER and four associated programs on September 2, and the article relies on those findings throughout.","category":"research","primary":true},{"title":"REVSTEALER - White Paper","url":"https://assets.contentstack.io/v3/assets/bltefdd0b53724fa2ce/blt9cd59668ba5a104d/6a97978bd04dac6f166ca8ce/REVSTEALER_-_White_paper.pdf","publisher":"elastic-security-labs","context":"The article identifies this as Elastic’s technical white paper accompanying its findings on REVSTEALER and the related modules.","category":"research","primary":true},{"title":"REVSTEALER: Silence Is Its Greatest Weapon","url":"https://www.morphisec.com/blog/revstealer-silence-is-its-greatest-weapon/","publisher":"morphisec","context":"The article says Morphisec documented a fake “Claude Opus 5 Free Desktop” application used to package REVSTEALER on August 31.","category":"research","primary":false}],"body":"\u003cp\u003eElastic Security Labs documented four previously unreported programs associated with REVSTEALER, an emerging Windows information stealer. The programs are named ProManager, WinUpdate, SoftManager, and LockAppHost, and they remain on an infected machine after the core stealer reports completion and deletes itself. Elastic said the programs share REVSTEALER’s build tradecraft, including the same packer, runtime function resolution, and use of Polygon smart contracts for backup configuration.\u003c/p\u003e\n\n\u003cp\u003eThe modules have different roles that extend the impact of an infection beyond the initial theft of data. ProManager targets desktop cryptocurrency wallets, WinUpdate replaces copied cryptocurrency addresses and collects likely recovery phrases, SoftManager turns the machine into a reverse proxy, and LockAppHost runs a cryptocurrency miner. LockAppHost is the most disruptive because it gains administrator rights, disables Windows Update services and scheduled tasks, adds Microsoft Defender exclusions, and hides a miner within legitimate Windows processes.\u003c/p\u003e\n\n\u003cp\u003eREVSTEALER itself steals browser passwords and cookies, cryptocurrency wallets, gaming accounts, messaging data, VPN and FTP configuration, Windows Credential Manager data, password manager data, and selected documents. It has been spread mainly through game-cheat lures promoted on YouTube channels, and it has also been packaged as pirated or impersonated software, including a fake “Claude Opus 5 Free Desktop” application. Elastic warned that responders should look for surviving modules after the core stealer disappears, re-enable Windows Update components and remove Defender exclusions where LockAppHost has run, and affected users should change passwords and end active account sessions.\u003c/p\u003e\n"}]</script>
