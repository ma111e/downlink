<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers Exploit N-central Flaws to Infect 21 Servers, Including 19 Running Hotfix 2","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-n-central-flaws-to.html","time":"05:43","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting the 4EverAble2Shell chain in N-able N-central to gain root access and deploy XMRig miners, including against servers already running Hotfix 2. Organizations should upgrade both N-central Agents and Probes to 2026.4 HF1 or later, disable Legacy API access, and investigate any suspected compromise as a full server breach.","briefOverview":"\u003cp\u003eN-able has restricted certain N-central features after disclosure of the 4EverAble2Shell and Agent2Shell flaws. In hosted environments, the company turned off the Legacy API by default and temporarily disabled Intune integration while it implements and validates additional protections. It advised customers to upgrade both N-central Agents and Probes to version 2026.4 HF1 or later; on-premises customers should also ensure Legacy API access is disabled.\u003c/p\u003e\n\n\u003cp\u003eThe 4EverAble2Shell chain combines Apache Axis vulnerability CVE-2026-90436 with an N-central privilege-escalation weakness, allowing unauthenticated attackers to execute operating-system commands with root privileges. Researchers observed attackers using a shell script hosted at 157.20.241[.]16 to install XMRig Monero miners on 21 N-central servers across the United States, South Africa, Canada, the United Kingdom, Germany, France, and Sweden. Huntback reported that 19 of the affected servers were already running Hotfix 2 and warned that a successful intrusion should be handled as a full compromise because the server manages customer endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able restricted certain N-central features and integrations after disclosure of the 4EverAble2Shell and Agent2Shell flaws, including disabling the Legacy API by default and temporarily turning off Intune integration in hosted environments.","The 4EverAble2Shell exploit chain combines Apache Axis flaw CVE-2026-90436 with an N-central privilege-escalation weakness to let unauthenticated attackers run operating-system commands with root privileges.","Threat actors have actively exploited 4EverAble2Shell to download a shell script from 157.20.241[.]16 and deploy XMRig Monero miners on 21 N-central servers.","Huntback reported that 19 of the 21 compromised N-central servers were already running Hotfix 2, and warned that applying the hotfix alone is insufficient.","N-able advised hosted and on-premises customers to upgrade both N-central Agents and Probes to version 2026.4 HF1 or later, while on-premises customers should also ensure Legacy API access is disabled."],"insights":["Installing Hotfix 2 alone did not stop the observed intrusions: 19 of the 21 affected servers were already running it, making the additional Agent and Probe upgrade guidance particularly important.","The observed cryptocurrency miner deliberately uses only half of a server’s available CPU cores, apparently to make its activity less noticeable.","N-able temporarily disabled its Intune integration and turned off the Legacy API by default in hosted environments while it develops and validates further protections.","Because a compromised N-central server manages customer endpoints, Huntback says an intrusion should be treated as a full compromise rather than simply removing the miner."],"referencedReports":[{"title":"VULN-2026-0009","url":"https://previdian.com/VULN-2026-0009","publisher":"previdian","context":"Previdian's technical analysis describes the 4EverAble2Shell chain as an unauthenticated route to root-level command execution through Apache Axis SOAP fault processing.","category":"research","primary":false},{"title":"N-central 4EverAble2Shell Miners on Live Servers","url":"https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers","publisher":"huntback","context":"Huntback reported active exploitation that used the flaw to deploy XMRig Monero miners on 21 N-central servers, including systems running Hotfix 2.","category":"research","primary":false}],"body":"\u003cp\u003eN-able has restricted certain N-central features after disclosure of the 4EverAble2Shell and Agent2Shell flaws. In hosted environments, the company turned off the Legacy API by default and temporarily disabled Intune integration while it implements and validates additional protections. It advised customers to upgrade both N-central Agents and Probes to version 2026.4 HF1 or later; on-premises customers should also ensure Legacy API access is disabled.\u003c/p\u003e\n\n\u003cp\u003eThe 4EverAble2Shell chain combines Apache Axis vulnerability CVE-2026-90436 with an N-central privilege-escalation weakness, allowing unauthenticated attackers to execute operating-system commands with root privileges. Researchers observed attackers using a shell script hosted at 157.20.241[.]16 to install XMRig Monero miners on 21 N-central servers across the United States, South Africa, Canada, the United Kingdom, Germany, France, and Sweden. Huntback reported that 19 of the affected servers were already running Hotfix 2 and warned that a successful intrusion should be handled as a full compromise because the server manages customer endpoints.\u003c/p\u003e\n"}]</script>
