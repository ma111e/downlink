<script type="application/json" id="dl-articles">[{"n":3,"title":"New wp2shell WordPress Core Flaw Lets Unauthenticated Attackers Run Code","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-wp2shell-wordpress-core-flaw-lets.html","time":"21:20","priority":"MUST READ","score":96,"tldr":"WordPress patched a critical core flaw dubbed wp2shell that allowed unauthenticated remote code execution on default 6.9 and 7.0 installations via the REST API batch endpoint. Site owners should verify they are running 6.9.5 or 7.0.2, because there is no CVE yet and scanners may not detect vulnerable versions.","briefOverview":"\u003cp\u003eWordPress released versions 6.9.5 and 7.0.2 on July 17, 2026, to fix a pre-authentication remote code execution flaw in core. The issue, named wp2shell by Searchlight Cyber, could be triggered by an anonymous HTTP request against a default WordPress install with no plugins. The affected ranges are WordPress 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1.\u003c/p\u003e\n\n\u003cp\u003eAdam Kues at Assetnote, Searchlight Cyber’s attack surface management arm, found the flaw and reported it through WordPress’s HackerOne program. WordPress described the finding as a REST API batch-route confusion and SQL injection issue leading to remote code execution, but neither advisory had a CVE ID or CVSS score by July 18. Because CVE-keyed scanners and inventories will not flag the issue, the article says site owners should track it by version number instead.\u003c/p\u003e\n\n\u003cp\u003eSearchlight is withholding technical details for now and has provided a checker for site owners at wp2shell.com. For sites that cannot update immediately, its stopgap mitigations focus on keeping anonymous callers off the batch endpoint, including blocking both /wp-json/batch/v1 and rest_route=/batch/v1, disabling unauthenticated REST API access, or using a drop-in plugin. The article notes that no exploitation attempt had been reported as of July 18, but public access to WordPress release code means the fix can be compared against vulnerable versions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress released versions 6.9.5 and 7.0.2 on July 17, 2026 to fix a pre-authentication remote code execution flaw in core that could be triggered by an anonymous request against a default install with no plugins.","The affected WordPress versions are 6.9.0 through 6.9.4, fixed in 6.9.5, and 7.0.0 through 7.0.1, fixed in 7.0.2.","Adam Kues at Assetnote, Searchlight Cyber’s attack surface management arm, reported the flaw through WordPress’s HackerOne program, and Searchlight published a writeup under the name wp2shell while withholding technical details.","WordPress described the issue as a REST API batch-route confusion and SQL injection issue leading to remote code execution, but neither advisory had a CVE ID or CVSS score by July 18.","Searchlight’s temporary mitigation advice is to block anonymous access to the batch endpoint by blocking both /wp-json/batch/v1 and rest_route=/batch/v1, disabling unauthenticated REST API access, or using a drop-in plugin until the site is updated."],"insights":["Because there is no CVE ID yet, CVE-based scanners, inventories, and CISA’s KEV catalog will not reliably identify this issue, so defenders must track exposure by WordPress version instead.","WordPress’s forced update push may not have reached sites with auto-updates disabled, making it important to verify the installed version rather than assume the fix was applied.","A WAF rule that blocks only /wp-json/batch/v1 is incomplete because the same batch endpoint can also be reached through the rest_route=/batch/v1 query-string route.","The widely cited figure of more than 500 million WordPress websites is not the vulnerable population, because the flawed code only exists in releases from 6.9 onward.","The public availability of both vulnerable and fixed WordPress releases means attackers can compare the code changes, so the practical race is whether sites update before the fix is reverse-engineered."],"referencedReports":[{"title":"wp2shell: Pre-Authentication RCE in WordPress Core","url":"https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core","publisher":"Searchlight Cyber","context":"The article cites Searchlight Cyber’s wp2shell writeup as the researcher’s published description of the WordPress core flaw, while noting that technical details are being withheld for now.","category":"research","primary":true},{"title":"WordPress 7.0.2 Release","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article cites WordPress’s release post for its description of the issue as a REST API batch-route confusion and SQL injection issue leading to remote code execution.","category":"advisory","primary":true},{"title":"WordPress 7.0.2 Version Page","url":"https://wordpress.org/documentation/wordpress-version/version-7-0-2/","publisher":"WordPress","context":"The article cites the WordPress 7.0.2 version page for the list of files changed by the release covering both fixes.","category":"advisory","primary":true},{"title":"Keys to the Kingdom: Anonymous SQL Injection in Drupal Core CVE-2026-9082","url":"https://slcyber.io/research-center/keys-to-the-kingdom-anonymous-sql-injection-in-drupal-core-cve-2026-9082/","publisher":"Searchlight Cyber","context":"The article references Searchlight Cyber’s prior same-day technical teardown of a Drupal core SQL injection fix as context for how quickly open-source patches can be analyzed.","category":"research","primary":false}],"body":"\u003cp\u003eWordPress released versions 6.9.5 and 7.0.2 on July 17, 2026, to fix a pre-authentication remote code execution flaw in core. The issue, named wp2shell by Searchlight Cyber, could be triggered by an anonymous HTTP request against a default WordPress install with no plugins. The affected ranges are WordPress 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1.\u003c/p\u003e\n\n\u003cp\u003eAdam Kues at Assetnote, Searchlight Cyber’s attack surface management arm, found the flaw and reported it through WordPress’s HackerOne program. WordPress described the finding as a REST API batch-route confusion and SQL injection issue leading to remote code execution, but neither advisory had a CVE ID or CVSS score by July 18. Because CVE-keyed scanners and inventories will not flag the issue, the article says site owners should track it by version number instead.\u003c/p\u003e\n\n\u003cp\u003eSearchlight is withholding technical details for now and has provided a checker for site owners at wp2shell.com. For sites that cannot update immediately, its stopgap mitigations focus on keeping anonymous callers off the batch endpoint, including blocking both /wp-json/batch/v1 and rest_route=/batch/v1, disabling unauthenticated REST API access, or using a drop-in plugin. The article notes that no exploitation attempt had been reported as of July 18, but public access to WordPress release code means the fix can be compared against vulnerable versions.\u003c/p\u003e\n"},{"n":5,"title":"Unauthenticated RCE in WordPress core (wp2shell)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/unauthenticated-rce-in-wordpress-wp2shell","time":"21:19","priority":"MUST READ","score":96,"tldr":"WordPress released emergency updates for an unauthenticated RCE in core affecting versions 6.9.0–6.9.4 and 7.0.0–7.0.1, with fixes in 6.9.5 and 7.0.2. Site owners should patch immediately or temporarily block the vulnerable REST batch endpoint until updated.","briefOverview":"\u003cp\u003eWordPress released an emergency security update on July 17 for an unauthenticated remote code execution flaw in WordPress core. The article says an anonymous attacker can trigger the issue against a stock WordPress install with no plugins involved. WordPress.org has turned on forced auto-updates for affected sites because of the severity, but the article urges site owners to confirm their installed version.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is described as a REST API batch-route confusion and SQL injection issue that chains into remote code execution. The entry point is the batch endpoint at \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e, and the vulnerability is tracked in Aikido Intel as \u003ccode\u003eAIKIDO-2026-696183\u003c/code\u003e. Adam Kues at Searchlight Cyber reported the flaw and published a checker at \u003ccode\u003ewp2shell.com\u003c/code\u003e, though the article notes the site has been going offline occasionally.\u003c/p\u003e\n\n\u003cp\u003eThe remote code execution issue affects WordPress 6.9.0 through 6.9.4, WordPress 7.0.0 through 7.0.1, and WordPress 7.1 beta, with fixes in 6.9.5, 7.0.2, and 7.1 beta2. WordPress 6.8 is exposed to a separate SQL injection issue patched in the same round, while versions before 6.8 are unaffected by either issue. If immediate updating is not possible, the article lists temporary measures such as blocking unauthenticated REST API access or the vulnerable batch route, while warning these may interfere with legitimate REST API traffic.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress released emergency security update 7.0.2 on July 17 to fix an unauthenticated remote code execution flaw in WordPress core that can affect stock installs with no plugins involved.","The flaw is described as a REST API batch-route confusion and SQL injection issue that chains into remote code execution through the `/wp-json/batch/v1` endpoint.","The remote code execution flaw affects WordPress 6.9.0 through 6.9.4, WordPress 7.0.0 through 7.0.1, and WordPress 7.1 beta, with fixes in 6.9.5, 7.0.2, and 7.1 beta2.","WordPress.org has turned on forced auto-updates for affected sites, but the article says site owners should still confirm their version in the dashboard.","If immediate updating is not possible, the article lists temporary mitigations such as blocking unauthenticated REST API access, blocking `/wp-json/batch/v1` and `rest_route=/batch/v1`, or requiring authentication on the REST batch route."],"insights":["Sites older than WordPress 6.9.0 are not affected by the remote code execution flaw, but WordPress 6.8 sites still need 6.8.6 because they are exposed to a separate SQL injection issue patched in the same round.","The article cautions that forced auto-updates are enabled for affected WordPress sites, but administrators should still confirm the installed version rather than assuming the update succeeded.","The suggested short-term workarounds can disrupt legitimate REST API traffic, so the article frames them only as temporary protection until patching is completed.","The public checker at wp2shell.com may not be consistently available because the article says it has been going offline occasionally.","The article notes that this is the second SQL injection issue in a single WordPress core release, highlighting that this class of flaw is still appearing in core software despite often being treated as solved."],"referencedReports":[{"title":"WordPress 7.0.2 Release","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article cites WordPress's emergency security update and says WordPress core's own advisory describes the REST API batch-route confusion and SQL injection issue.","category":"advisory","primary":true}],"body":"\u003cp\u003eWordPress released an emergency security update on July 17 for an unauthenticated remote code execution flaw in WordPress core. The article says an anonymous attacker can trigger the issue against a stock WordPress install with no plugins involved. WordPress.org has turned on forced auto-updates for affected sites because of the severity, but the article urges site owners to confirm their installed version.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is described as a REST API batch-route confusion and SQL injection issue that chains into remote code execution. The entry point is the batch endpoint at \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e, and the vulnerability is tracked in Aikido Intel as \u003ccode\u003eAIKIDO-2026-696183\u003c/code\u003e. Adam Kues at Searchlight Cyber reported the flaw and published a checker at \u003ccode\u003ewp2shell.com\u003c/code\u003e, though the article notes the site has been going offline occasionally.\u003c/p\u003e\n\n\u003cp\u003eThe remote code execution issue affects WordPress 6.9.0 through 6.9.4, WordPress 7.0.0 through 7.0.1, and WordPress 7.1 beta, with fixes in 6.9.5, 7.0.2, and 7.1 beta2. WordPress 6.8 is exposed to a separate SQL injection issue patched in the same round, while versions before 6.8 are unaffected by either issue. If immediate updating is not possible, the article lists temporary measures such as blocking unauthenticated REST API access or the vulnerable batch route, while warning these may interfere with legitimate REST API traffic.\u003c/p\u003e\n"},{"n":1,"title":"Abbott Laboratories probes two cyber incidents amid extortion claims","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/abbott-laboratories-probes-two-cyber-incidents-amid-extortion-claims/","time":"20:45","priority":"SHOULD READ","score":88,"tldr":"Abbott Laboratories is investigating two cyber incidents: confirmed unauthorized access to legacy Exact Sciences systems in its Cancer Diagnostics business claimed by ShinyHunters, and a separate alleged LabCentral portal breach. Abbott says operations, product availability, and patient services are unaffected, while the attackers claim they stole large amounts of sensitive data that has not been independently verified.","briefOverview":"\u003cp\u003eAbbott Laboratories is investigating two separate cybersecurity incidents involving its diagnostics businesses. The company confirmed unauthorized access to a limited number of internal legacy Exact Sciences systems in its Cancer Diagnostics business after ShinyHunters listed Abbott on its extortion site. Abbott said the incident does not affect business operations, product or product availability, manufacturing or lab operations, or its ability to serve patients.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it gained access through a mid-June vishing attack targeting Abbott employees, which allegedly compromised a Microsoft Entra single sign-on account. The group claimed it exfiltrated data from Microsoft Entra, ServiceNow, SharePoint, Databricks, and Coupa, including internal documents, contracts, customer information, and large datasets containing personal and medical-related information. BleepingComputer said it has not independently verified the threat actor’s claims about the stolen data.\u003c/p\u003e\n\n\u003cp\u003eA second threat actor, ShadowByt3\u003cspan class=\"math inline\"\u003e\\(, claimed to have breached Abbott’s Core Laboratory diagnostics business through the LabCentral customer portal using compromised customer credentials. Abbott said it is aware of the potential incident but disputed the actor’s characterization of the data, stating that LabCentral contains publicly available technical product reference documents and no proprietary, sensitive customer, or business information. At the time of the article, neither ShinyHunters nor ShadowByt3\\)\u003c/span\u003e had publicly released the data they claimed to have stolen.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Abbott Laboratories is investigating unauthorized access to a limited number of internal legacy Exact Sciences systems in its Cancer Diagnostics business.","Abbott said the Cancer Diagnostics incident does not affect business operations, product availability, manufacturing or lab operations, its ability to serve patients, or other Abbott businesses and systems.","ShinyHunters claimed it accessed Abbott through a mid-June vishing attack that compromised a Microsoft Entra single sign-on account and allowed access to internal systems.","ShinyHunters claimed it stole data from Microsoft Entra, ServiceNow, SharePoint, Databricks, and Coupa, including internal documents, contracts, customer information, and large datasets containing personal and medical-related information, but BleepingComputer has not independently verified those claims.","Abbott is also investigating a separate potential incident involving its LabCentral customer portal, but said the portal contains publicly available technical product reference documents and does not contain proprietary, sensitive customer, or business information."],"insights":["Abbott is handling the two claims as separate incidents affecting different parts of its diagnostics business, with one tied to legacy Exact Sciences systems and the other to a third-party hosted LabCentral portal.","ShinyHunters’ claimed access path fits the group’s broader pattern described in the article: targeting employees’ single sign-on accounts and then using that access to reach connected business applications.","The article highlights a major gap between attacker claims and confirmed facts, as ShinyHunters alleges theft of highly sensitive personal and medical-related data while BleepingComputer says those claims have not been independently verified.","The LabCentral claim is disputed not only on whether access occurred but on the value of the data itself, with the threat actor describing sensitive business documents and Abbott saying the portal stores only publicly available technical product reference materials.","Neither threat actor had publicly released the data they claimed to have stolen at the time of the article, despite ShinyHunters setting and extending a publication deadline on its leak site."],"referencedReports":[],"body":"\u003cp\u003eAbbott Laboratories is investigating two separate cybersecurity incidents involving its diagnostics businesses. The company confirmed unauthorized access to a limited number of internal legacy Exact Sciences systems in its Cancer Diagnostics business after ShinyHunters listed Abbott on its extortion site. Abbott said the incident does not affect business operations, product or product availability, manufacturing or lab operations, or its ability to serve patients.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it gained access through a mid-June vishing attack targeting Abbott employees, which allegedly compromised a Microsoft Entra single sign-on account. The group claimed it exfiltrated data from Microsoft Entra, ServiceNow, SharePoint, Databricks, and Coupa, including internal documents, contracts, customer information, and large datasets containing personal and medical-related information. BleepingComputer said it has not independently verified the threat actor’s claims about the stolen data.\u003c/p\u003e\n\n\u003cp\u003eA second threat actor, ShadowByt3\u003cspan class=\"math inline\"\u003e\\(, claimed to have breached Abbott’s Core Laboratory diagnostics business through the LabCentral customer portal using compromised customer credentials. Abbott said it is aware of the potential incident but disputed the actor’s characterization of the data, stating that LabCentral contains publicly available technical product reference documents and no proprietary, sensitive customer, or business information. At the time of the article, neither ShinyHunters nor ShadowByt3\\)\u003c/span\u003e had publicly released the data they claimed to have stolen.\u003c/p\u003e\n"},{"n":2,"title":"Seven Malicious Vite npm Packages Use Blockchain C2 to Deliver a RAT","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/seven-malicious-vite-npm-packages-use.html","time":"18:54","priority":"SHOULD READ","score":88,"tldr":"Researchers found seven malicious npm packages impersonating Vite ecosystem tooling that use blockchain-based command-and-control infrastructure to fetch and run a RAT. Developers who installed them should remove the packages, audit dependencies, rotate credentials, and check shell profile files for persistence changes.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered seven malicious npm packages targeting the Vite frontend tooling ecosystem in a software supply chain attack. Checkmarx named the campaign ViteVenom and described it as an expansion of ChainVeil. The activity has been attributed to a threat actor named SuccessKey, with evidence of malicious activity dating back to February 27, 2026, when cryptocurrency wallets linked to ViteVenom were activated.\u003c/p\u003e\n\n\u003cp\u003eThe packages were published between June 29 and July 3, 2026, and used scoped package names intended to impersonate the @vitejs/* namespace. The article says this differs from ChainVeil’s earlier unscoped typosquats and was likely meant to make the packages appear legitimate. The identified packages had download counts ranging from 176 to 1,070.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code executes at import time rather than install time and acts as a loader that retrieves later-stage payloads through blockchain infrastructure. It uses Tron, Aptos, and Binance Smart Chain transactions to obtain encrypted payload data, with fallback methods including Aptos and direct HTTP retrieval from the C2 server. Users who installed the packages are advised to remove them immediately, audit dependencies, rotate all credentials, and check .bashrc, .zshrc, and .profile files for unauthorized modifications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Checkmarx researchers discovered seven malicious npm packages targeting developers using the Vite JavaScript and frontend build tool ecosystem.","The campaign, called ViteVenom, is linked to the threat actor SuccessKey and is described as an expansion of the earlier ChainVeil campaign.","The malicious packages use blockchain-based command-and-control infrastructure involving Tron, Aptos, and Binance Smart Chain to retrieve payloads and deliver a remote access trojan.","Unlike ChainVeil’s unscoped typosquats, ViteVenom uses scoped package names that impersonate the @vitejs/* namespace to appear more legitimate.","Users who installed the packages are advised to remove them immediately, audit dependencies, rotate credentials, and check .bashrc, .zshrc, and .profile files for unauthorized changes."],"insights":["The malware executes when the package is imported rather than when it is installed, which the article says limits endpoint security detections.","The campaign uses public blockchain transaction data to store payload pointers instead of relying on domain names that can be seized, making its command-and-control infrastructure extremely difficult to disable.","ViteVenom uses scoped npm package names to impersonate the @vitejs/* namespace, a shift from ChainVeil’s earlier unscoped typosquats that makes the packages appear more legitimate.","The overlap in Tron wallet and Aptos account infrastructure with ChainVeil links the new Vite-focused packages to the same broader operation despite different package names, maintainer accounts, wallets, and file paths.","The malware includes both an Aptos fallback if Tron retrieval fails and an HTTP fallback that can fetch the RAT directly from the C2 server, showing multiple built-in recovery paths for payload delivery."],"referencedReports":[{"title":"Sequel to ChainVeil: npm Malware Targets Vite Ecosystem","url":"https://checkmarx.com/zero-post/sequel-to-chainveil-npm-malware-targets-vite-ecosystem/","publisher":"Checkmarx","context":"The article cites Checkmarx’s analysis as the source for the ViteVenom campaign targeting the Vite npm ecosystem.","category":"research","primary":true},{"title":"ChainVeil: A Malicious npm Supply Chain Attack by SuccessKey","url":"https://checkmarx.com/zero-post/chainveil-a-malicious-npm-supply-chain-attack-by-successkey/","publisher":"Checkmarx","context":"The article references Checkmarx’s earlier ChainVeil research to explain ViteVenom as an expansion of that campaign.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered seven malicious npm packages targeting the Vite frontend tooling ecosystem in a software supply chain attack. Checkmarx named the campaign ViteVenom and described it as an expansion of ChainVeil. The activity has been attributed to a threat actor named SuccessKey, with evidence of malicious activity dating back to February 27, 2026, when cryptocurrency wallets linked to ViteVenom were activated.\u003c/p\u003e\n\n\u003cp\u003eThe packages were published between June 29 and July 3, 2026, and used scoped package names intended to impersonate the @vitejs/* namespace. The article says this differs from ChainVeil’s earlier unscoped typosquats and was likely meant to make the packages appear legitimate. The identified packages had download counts ranging from 176 to 1,070.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code executes at import time rather than install time and acts as a loader that retrieves later-stage payloads through blockchain infrastructure. It uses Tron, Aptos, and Binance Smart Chain transactions to obtain encrypted payload data, with fallback methods including Aptos and direct HTTP retrieval from the C2 server. Users who installed the packages are advised to remove them immediately, audit dependencies, rotate all credentials, and check .bashrc, .zshrc, and .profile files for unauthorized modifications.\u003c/p\u003e\n"},{"n":4,"title":"OpenSSL HollowByte Flaw Could Freeze Server Memory with 11-Byte TLS Requests","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/openssl-hollowbyte-flaw-could-freeze.html","time":"20:20","priority":"SHOULD READ","score":86,"tldr":"OpenSSL quietly fixed a denial-of-service flaw dubbed HollowByte that lets an attacker trigger persistent server memory growth with tiny malformed TLS handshake requests, potentially exhausting memory on glibc-based systems. Because the fix received no CVE or advisory, organizations may need to verify manually that they have upgraded or backported the June 9 OpenSSL patches.","briefOverview":"\u003cp\u003eOkta\u0026rsquo;s Red Team reported an OpenSSL denial-of-service flaw named HollowByte that can make an unpatched server allocate up to 131 KB of memory from an 11-byte TLS request for a message body that never arrives. OpenSSL fixed the issue in releases 4.0.1, 3.6.3, 3.5.7, 3.4.6, and 3.0.21 dated June 9. The fix shipped without a CVE, advisory, or changelog entry, leaving no normal scanner identifier or advisory trail for patch pipelines to follow.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurred because older OpenSSL versions grew the receive buffer to the attacker-declared TLS handshake message length as soon as the header arrived, before any body bytes were received and before handshake checks ran. For an inbound ClientHello, the ceiling was 131 KB, after which the worker thread waited for a body that never came. On glibc systems tested by Okta, freed buffers were retained for reuse rather than returned to the kernel, and varying the claimed size caused fragmentation that kept resident memory elevated.\u003c/p\u003e\n\n\u003cp\u003eOkta reported that a 1 GB NGINX server was OOM-killed with 547 MB frozen in fragments, and that a 16 GB server had 25% of system memory locked up without crossing the connection ceiling. The article says this makes standard connection-limiting defenses insufficient in Okta\u0026rsquo;s tests. It also notes that the fix covers TLS only, while the DTLS handshake path still sizes its buffer from the peer-declared length and has not been classified or committed for fixing by OpenSSL.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Okta's Red Team reported an OpenSSL denial-of-service flaw named HollowByte that can make an unpatched server allocate up to 131 KB of memory from an 11-byte TLS request for a message body that never arrives.","OpenSSL fixed HollowByte in releases 4.0.1, 3.6.3, 3.5.7, 3.4.6, and 3.0.21 dated June 9, but assigned no CVE, advisory, or changelog entry to the fix.","The flaw occurs because older OpenSSL versions grew the TLS receive buffer to the peer-declared handshake message length as soon as the header arrived, before the body appeared and before handshake checks ran.","In Okta's tests on glibc systems, freed buffers were not returned to the kernel, heap fragmentation caused resident memory to remain elevated, and an NGINX server with 1 GB of memory was OOM-killed with 547 MB frozen in fragments.","The fix covers TLS only, while the article says the DTLS handshake path still sizes its buffer from the length declared by the peer and has not been classified or committed for fixing by OpenSSL."],"insights":["Normal vulnerability scanners and CVE-based patch workflows may not detect exposure to HollowByte because OpenSSL shipped the fix without a CVE, advisory, or release-note reference.","For downstream Linux distributions that backport fixes while keeping the same OpenSSL version string, teams may need to check package changelogs or ask maintainers whether pull requests 30792, 30793, or 30794 were applied.","Connection limits alone may not be enough to mitigate HollowByte, because Okta reported memory exhaustion without crossing the connection ceiling.","The issue creates a patch-verification gap because systems running upstream OpenSSL releases may already be fixed, while systems on vendor-maintained packages may appear unchanged unless the maintainer explicitly backported the patch.","The DTLS path remains a separate concern because the OpenSSL TLS fix did not modify DTLS, and the article says OpenSSL has not classified that path or committed to fixing it."],"referencedReports":[{"title":"OpenSSL HollowByte: A DoS Hiding in 11 Bytes","url":"https://sec.okta.com/articles/2026/06/openssl-hollowbtye-a-dos-hiding-in-11-bytes/","publisher":"Okta","context":"The article says Okta's Red Team reported the flaw, named it HollowByte, and published technical details about the denial-of-service issue.","category":"research","primary":true},{"title":"CVE-2025-66199","url":"https://openssl-library.org/news/vulnerabilities-3.6/#CVE-2025-66199","publisher":"OpenSSL","context":"The article cites this OpenSSL vulnerability entry as a comparison to HollowByte because it also involved peer-supplied length causing heap buffer growth before validation.","category":"advisory","primary":false},{"title":"CVE-2026-34183","url":"https://openssl-library.org/news/vulnerabilities-3.6/#CVE-2026-34183","publisher":"OpenSSL","context":"The article cites this OpenSSL vulnerability entry as a comparison because it involved unbounded memory growth in the QUIC PATH_CHALLENGE handler and received a CVE.","category":"advisory","primary":false}],"body":"\u003cp\u003eOkta\u0026rsquo;s Red Team reported an OpenSSL denial-of-service flaw named HollowByte that can make an unpatched server allocate up to 131 KB of memory from an 11-byte TLS request for a message body that never arrives. OpenSSL fixed the issue in releases 4.0.1, 3.6.3, 3.5.7, 3.4.6, and 3.0.21 dated June 9. The fix shipped without a CVE, advisory, or changelog entry, leaving no normal scanner identifier or advisory trail for patch pipelines to follow.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurred because older OpenSSL versions grew the receive buffer to the attacker-declared TLS handshake message length as soon as the header arrived, before any body bytes were received and before handshake checks ran. For an inbound ClientHello, the ceiling was 131 KB, after which the worker thread waited for a body that never came. On glibc systems tested by Okta, freed buffers were retained for reuse rather than returned to the kernel, and varying the claimed size caused fragmentation that kept resident memory elevated.\u003c/p\u003e\n\n\u003cp\u003eOkta reported that a 1 GB NGINX server was OOM-killed with 547 MB frozen in fragments, and that a 16 GB server had 25% of system memory locked up without crossing the connection ceiling. The article says this makes standard connection-limiting defenses insufficient in Okta\u0026rsquo;s tests. It also notes that the fix covers TLS only, while the DTLS handshake path still sizes its buffer from the peer-declared length and has not been classified or committed for fixing by OpenSSL.\u003c/p\u003e\n"},{"n":6,"title":"June Incident Response Insights","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/june-incident-response-insights/","time":"20:03","priority":"MAY READ","score":35,"tldr":"Booz Allen is promoting its June Incident Response Insights Report, which summarizes intelligence from more than 1,000 real-world incident response engagements to help organizations understand current threat actor activity and improve resilience.","briefOverview":"\u003cp\u003eThe article presents “June Incident Response Insights,” dated July 17, 2026. It highlights Booz Allen’s Incident Response Insights Report as a source of threat intelligence based on more than 1,000 real-world engagements annually. The article describes the report as focused on real incidents, real intelligence, and real resilience.\u003c/p\u003e\n\n\u003cp\u003eThe article says the report is intended to show what threat actors are doing, where the threat landscape is headed, and what Booz Allen encountered on the frontlines during the month. It emphasizes that the report is based on real-world engagements rather than theoretical risks. The article directs readers to read the report by Booz Allen, which it identifies as a Health-ISAC Community Services Champion.\u003c/p\u003e\n\n\u003cp\u003eThe article does not describe a specific incident, named threat actor, malware family, or vulnerability. Its significance is framed around helping readers access threat intelligence they can count on when cyber threats strike. It also lists related Health-ISAC resources and news items on cybersecurity, healthcare, critical infrastructure, artificial intelligence, and incident response topics.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article announces the June Incident Response Insights Report dated July 17, 2026.","Booz Allen’s Incident Response Insights Report is based on intelligence from more than 1,000 real-world engagements annually.","The report aims to show what threat actors are doing, where the threat landscape is headed, and what Booz Allen has encountered on the frontlines this month.","The report is presented by Booz Allen, identified as a Health-ISAC Community Services Champion."],"insights":["The report’s value proposition is that it is based on real-world incident response engagements rather than theoretical risk analysis, making it positioned as a practical source for understanding current attacker behavior.","Because the article says the report covers what Booz Allen encountered “this month,” it frames the report as timely intelligence rather than a static annual overview.","The report is promoted through Health-ISAC and tied to a Health-ISAC Community Services Champion, indicating that the intended audience includes organizations connected to the health sector."],"referencedReports":[],"body":"\u003cp\u003eThe article presents “June Incident Response Insights,” dated July 17, 2026. It highlights Booz Allen’s Incident Response Insights Report as a source of threat intelligence based on more than 1,000 real-world engagements annually. The article describes the report as focused on real incidents, real intelligence, and real resilience.\u003c/p\u003e\n\n\u003cp\u003eThe article says the report is intended to show what threat actors are doing, where the threat landscape is headed, and what Booz Allen encountered on the frontlines during the month. It emphasizes that the report is based on real-world engagements rather than theoretical risks. The article directs readers to read the report by Booz Allen, which it identifies as a Health-ISAC Community Services Champion.\u003c/p\u003e\n\n\u003cp\u003eThe article does not describe a specific incident, named threat actor, malware family, or vulnerability. Its significance is framed around helping readers access threat intelligence they can count on when cyber threats strike. It also lists related Health-ISAC resources and news items on cybersecurity, healthcare, critical infrastructure, artificial intelligence, and incident response topics.\u003c/p\u003e\n"}]</script>
