<script type="application/json" id="dl-articles">[{"n":9,"title":"Russian state-linked hackers target iPhone, Android devices in zero-click espionage campaign","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-hackers-smartphone-cyberattacks","time":"17:00","priority":"MUST READ","score":94,"tldr":"Russia-linked APT29 used compromised and spoofed websites, including Ukraine’s Plerdy analytics service, to deliver zero-click attacks against unpatched iPhone and Android devices. The campaign relied on already-patched flaws to steal sensitive mobile data, so fully updated devices were not vulnerable.","briefOverview":"\u003cp\u003eFrench cybersecurity firm Sekoia attributed a campaign targeting iPhone and Android users in Ukraine, the United States, and Europe to APT29, a Russia-linked group also known as Cozy Bear or Midnight Blizzard. The group placed malicious code on legitimate websites, created fake versions of the America250 and Raffles London at The OWO websites, and compromised Plerdy, a Ukrainian web analytics service. The campaign was intended to steal sensitive information from vulnerable phones, in some cases without users needing to click anything or download a file.\u003c/p\u003e\n\n\u003cp\u003eBetween late August and early September, attackers inserted malicious code into a Plerdy tracking script used by thousands of websites, potentially exposing visitors to hundreds of sites, including Ukrainian military, special forces, and defense-manufacturing-related organizations. The code identified visitors’ devices and software versions before attempting to exploit known flaws. On vulnerable iPhones, the attacks could obtain cookies, messages, emails, passwords, contacts, photos, location history, and data from WhatsApp and Telegram; on Android, they could steal browsing data, cookies, and saved Wi-Fi passwords.\u003c/p\u003e\n\n\u003cp\u003eThe more advanced iPhone attack used the DarkSword toolkit, which can extract large amounts of information from iPhones. Sekoia said the operation did not use previously unknown flaws: Apple and Google had patched all of the vulnerabilities before the campaign began, and fully updated devices would not be affected. Researchers did not determine how many phones were compromised or how much data was collected, and said they were working with emergency response teams in affected countries to identify victims and disrupt the attackers’ infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sekoia attributed a campaign targeting iPhone and Android users in Ukraine, the United States, and Europe to the Russia-linked APT29 group, also known as Cozy Bear or Midnight Blizzard.","The attackers compromised legitimate websites, created fake versions of America250 and Raffles London at The OWO, and inserted malicious code into Plerdy’s web analytics script.","The compromised Plerdy script was distributed between late August and early September and potentially exposed visitors to hundreds of websites, including Ukrainian military, special forces, and defense-manufacturing-related sites.","The attacks could steal browser data, passwords, messages, emails, photos, contacts, location history, and saved Wi-Fi passwords from vulnerable devices, depending on the device and operating system.","All identified attack methods used previously known vulnerabilities already patched by Apple and Google, and would not work against fully updated devices."],"insights":["Compromising a single web analytics provider, Plerdy, potentially gave the attackers exposure to visitors across hundreds of separate websites, including sites connected to Ukrainian military and defense organizations.","The malicious code first identified a visitor’s device and software version before attempting an attack, allowing the attackers to focus on devices that remained vulnerable to known flaws.","The operation was designed to collect information from compromised phones without retaining long-term access, distinguishing it from spyware campaigns intended to continuously monitor a device.","The campaign relied on vulnerabilities already fixed by Apple and Google rather than previously unknown flaws, making device updates a direct protection against the identified methods."],"referencedReports":[{"title":"Poisoned source: APT29 watering holes target mobile devices with n-day exploits","url":"https://www.sekoia.com/blog/poisoned-source-apt29-watering-holes-targets-mobile-devices-with-n-day-exploits","publisher":"sekoia","context":"The article relies on Sekoia's report for its attribution of the campaign to APT29 and its analysis of the compromised websites, Plerdy script, and mobile-device exploits.","category":"research","primary":true}],"body":"\u003cp\u003eFrench cybersecurity firm Sekoia attributed a campaign targeting iPhone and Android users in Ukraine, the United States, and Europe to APT29, a Russia-linked group also known as Cozy Bear or Midnight Blizzard. The group placed malicious code on legitimate websites, created fake versions of the America250 and Raffles London at The OWO websites, and compromised Plerdy, a Ukrainian web analytics service. The campaign was intended to steal sensitive information from vulnerable phones, in some cases without users needing to click anything or download a file.\u003c/p\u003e\n\n\u003cp\u003eBetween late August and early September, attackers inserted malicious code into a Plerdy tracking script used by thousands of websites, potentially exposing visitors to hundreds of sites, including Ukrainian military, special forces, and defense-manufacturing-related organizations. The code identified visitors’ devices and software versions before attempting to exploit known flaws. On vulnerable iPhones, the attacks could obtain cookies, messages, emails, passwords, contacts, photos, location history, and data from WhatsApp and Telegram; on Android, they could steal browsing data, cookies, and saved Wi-Fi passwords.\u003c/p\u003e\n\n\u003cp\u003eThe more advanced iPhone attack used the DarkSword toolkit, which can extract large amounts of information from iPhones. Sekoia said the operation did not use previously unknown flaws: Apple and Google had patched all of the vulnerabilities before the campaign began, and fully updated devices would not be affected. Researchers did not determine how many phones were compromised or how much data was collected, and said they were working with emergency response teams in affected countries to identify victims and disrupt the attackers’ infrastructure.\u003c/p\u003e\n"},{"n":12,"title":"CERT-In Flags AI-Driven Attacks as Backdoored ARTEX Exposes 62 Consoles to Root Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/backdoored-docker-image-for-artex-ai.html","time":"08:42","priority":"MUST READ","score":94,"tldr":"CERT-In warns that AI-assisted attackers are actively targeting India’s financial sector using automated offensive tools to steal credentials, bypass payment controls, and move funds. Separately, a trojanized ARTEX Docker image has exposed dozens of internet-facing consoles to an unauthenticated root-shell backdoor.","briefOverview":"\u003cp\u003eCERT-In warned that an AI-assisted threat actor it calls Crafty Falcon is actively targeting India’s banking, financial services, insurance, cryptocurrency exchange, and digital-asset sectors. The group uses publicly available tools including ARTEX, PentAGI, Cairn, and CyberStrikeAI to automate attack chains, rapidly create tailored scripts, and adapt payloads to target responses. CERT-In said the attackers exploit internet-facing applications, exposed APIs, hard-coded tokens, plaintext credentials, source-code repository compromises, and remote services without multi-factor authentication.\u003c/p\u003e\n\n\u003cp\u003eThe attackers have used stolen credentials and organizations’ own allow-listed infrastructure to make unauthorized fund-transfer API calls, bypassing controls such as beneficiary verification and transaction limits. They reportedly validate fraudulent flows with micro-value transactions before moving larger sums to mule accounts, while deleting logs and tampering with endpoint security tools. Separately, a copied ARTEX repository pointed users to a backdoored Docker image that enabled unauthenticated command execution as root through a hidden login-handler function. Researchers identified 62 internet-facing ARTEX consoles serving the backdoored build between November 2 and 4, 2026, and Docker Hub showed approximately 9,000 downloads of the affected image.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-In said the AI-assisted threat actor Crafty Falcon is actively targeting India’s banking, financial services, insurance, cryptocurrency exchange, and digital-asset sectors using tools including ARTEX, PentAGI, Cairn, and CyberStrikeAI.","The campaigns exploit internet-facing applications, exposed APIs, stolen or hard-coded API tokens, plaintext credentials, and services without multi-factor authentication to obtain credentials and initiate fraudulent fund transfers.","CERT-In reported that attackers use small test transfers, such as Rs. 1, before larger transfers to mule accounts, and may delete logs or tamper with endpoint security tools to hinder detection and response.","A copied ARTEX repository was modified to pull a Docker image containing a hidden login routine that lets an unauthenticated requester run commands as root before credential checks.","Researchers found 62 internet-facing ARTEX consoles serving the backdoored build between November 2 and 4, 2026, while Docker Hub reported approximately 9,000 downloads of the affected tomicdd/artex image."],"insights":["The fraud campaigns can bypass normal payment checks by using stolen credentials from within the affected organizations’ own allow-listed infrastructure, rather than attacking the transfer process directly.","Publicly accessible non-production environments can provide shared credentials, tokens, or network routes that attackers then use to reach production systems.","The modified ARTEX source changed only its Docker image reference, allowing the root-shell backdoor to remain outside the visible repository code that a reviewer might inspect.","A compromised ARTEX console can expose unpatched findings, live credentials, captured sessions, and network access collected by the tool, and its operators could alter what the agents do in future runs.","CERT-In’s AI security guidance specifically calls for human approval of consequential AI-agent actions and emergency measures such as credential revocation and preventing automatic restarts for high-risk systems."],"referencedReports":[{"title":"CERT-In Advisory CIAD-2026-0058","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02\u0026VLCODE=CIAD-2026-0058","publisher":"cert-in","context":"The article cites this CERT-In advisory as the source for its warning on Crafty Falcon’s AI-assisted targeting of Indian financial organizations.","category":"advisory","primary":true},{"title":"CERT-In Advisory CIAD-2026-0046","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02\u0026VLCODE=CIAD-2026-0046","publisher":"cert-in","context":"The article references this October 2026 CERT-In alert about campaigns targeting NBFCs, fintech firms, payment providers, and cryptocurrency wallet operators.","category":"advisory","primary":false},{"title":"Artificial Intelligence Security Auditing Guidelines","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=GUIDLNVIEW02\u0026refcode=CISG-2026-04","publisher":"cert-in","context":"The article cites these CERT-In guidelines for requirements covering AI governance, security, human oversight, emergency interruption, and auditability.","category":"guide","primary":false}],"body":"\u003cp\u003eCERT-In warned that an AI-assisted threat actor it calls Crafty Falcon is actively targeting India’s banking, financial services, insurance, cryptocurrency exchange, and digital-asset sectors. The group uses publicly available tools including ARTEX, PentAGI, Cairn, and CyberStrikeAI to automate attack chains, rapidly create tailored scripts, and adapt payloads to target responses. CERT-In said the attackers exploit internet-facing applications, exposed APIs, hard-coded tokens, plaintext credentials, source-code repository compromises, and remote services without multi-factor authentication.\u003c/p\u003e\n\n\u003cp\u003eThe attackers have used stolen credentials and organizations’ own allow-listed infrastructure to make unauthorized fund-transfer API calls, bypassing controls such as beneficiary verification and transaction limits. They reportedly validate fraudulent flows with micro-value transactions before moving larger sums to mule accounts, while deleting logs and tampering with endpoint security tools. Separately, a copied ARTEX repository pointed users to a backdoored Docker image that enabled unauthenticated command execution as root through a hidden login-handler function. Researchers identified 62 internet-facing ARTEX consoles serving the backdoored build between November 2 and 4, 2026, and Docker Hub showed approximately 9,000 downloads of the affected image.\u003c/p\u003e\n"},{"n":20,"title":"Hackers Exploit Patched Apple Flaw to Deliver Info-Stealing Malware, CISA Says","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-patched-apple-flaw-to.html","time":"05:17","priority":"MUST READ","score":94,"tldr":"CISA added Apple CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after suspected APT29 activity used patched Safari and Chrome flaws to deliver browser-data-stealing malware. Organizations and users should apply Apple security updates promptly, with U.S. federal agencies directed to remediate by November 18, 2026.","briefOverview":"\u003cp\u003eCISA added Apple CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after reports that the flaw is being actively exploited. The medium-severity issue is an improper-authentication weakness that could allow an attacker with arbitrary read and write capability to bypass Pointer Authentication. Apple fixed it in May 2024 through updates for iOS, iPadOS, macOS Sonoma, tvOS, watchOS, and Safari.\u003c/p\u003e\n\n\u003cp\u003eAccording to a Sekoia report cited by the article, actors possibly linked to Russia and attributed to APT29 with moderate to high confidence exploited previously patched Safari and Google Chrome flaws to deliver information-stealing malware. The campaign used compromised legitimate sites, fake sites posing as popular services, and a supply-chain attack involving Plerdy SEO Tracker to serve malicious JavaScript after profiling visitors’ devices. The payload was designed to steal browser cookies and device data, and CISA recommended that U.S. federal civilian agencies apply the required patches by November 18, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added Apple vulnerability CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after reports of active exploitation.","CVE-2024-27834 is an improper-authentication flaw that can let an attacker with arbitrary read and write capability bypass Pointer Authentication.","Apple addressed the flaw in May 2024 across iOS, iPadOS, macOS Sonoma, tvOS, watchOS, and Safari updates.","Sekoia reported that actors possibly linked to Russia, attributed to APT29 with moderate to high confidence, exploited patched Safari and Google Chrome flaws to deliver browser and device data-stealing malware.","CISA recommended that U.S. federal civilian agencies apply the necessary patches by November 18, 2026."],"insights":["A flaw rated medium severity was demonstrated as a zero-day at Pwn2Own before Apple released fixes, and CISA later listed it as actively exploited.","The reported campaign can reach victims through compromised legitimate websites, convincing fake websites, or a compromised Plerdy SEO Tracker supply-chain component.","The malicious code profiles a visitor’s device before delivering its information-stealing payload, which is designed to collect browser cookies and device data.","CISA’s remediation deadline applies specifically to U.S. Federal Civilian Executive Branch agencies, setting November 18, 2026 as the required patch date."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/04/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"CISA's advisory is cited for adding Apple CVE-2024-27834 to the Known Exploited Vulnerabilities catalog following active-exploitation reports.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added Apple CVE-2024-27834 to its Known Exploited Vulnerabilities catalog after reports that the flaw is being actively exploited. The medium-severity issue is an improper-authentication weakness that could allow an attacker with arbitrary read and write capability to bypass Pointer Authentication. Apple fixed it in May 2024 through updates for iOS, iPadOS, macOS Sonoma, tvOS, watchOS, and Safari.\u003c/p\u003e\n\n\u003cp\u003eAccording to a Sekoia report cited by the article, actors possibly linked to Russia and attributed to APT29 with moderate to high confidence exploited previously patched Safari and Google Chrome flaws to deliver information-stealing malware. The campaign used compromised legitimate sites, fake sites posing as popular services, and a supply-chain attack involving Plerdy SEO Tracker to serve malicious JavaScript after profiling visitors’ devices. The payload was designed to steal browser cookies and device data, and CISA recommended that U.S. federal civilian agencies apply the required patches by November 18, 2026.\u003c/p\u003e\n"},{"n":35,"title":"CVE-2026-109518: apt Flaw Lets Attackers Swap Packages After Verification and Run Code as Root","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/cve-2026-109518-apt-package-swap-root","time":"11:49","priority":"MUST READ","score":94,"tldr":"CVE-2026-109518 lets an on-path attacker abuse APT download retries to replace a package after signature and hash verification, resulting in root code execution. Update APT immediately and disable Acquire::Retries during the upgrade, especially on CI runners, Docker builds, and systems using HTTP mirrors or proxies.","briefOverview":"\u003cp\u003eCVE-2026-109518 is a flaw in APT, the package manager used by Debian, Ubuntu, and many related systems, that can let an attacker replace a package after it has passed APT’s signature and hash checks. Debian and Ubuntu released fixes on November 4, 2026. An attacker must be able to tamper with HTTP traffic between a machine and its package source, such as through a compromised network, mirror, proxy, or cache.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs when APT retries interrupted downloads, merges package downloads through redirects, and mishandles hard links used for the shared download. After the package hash is verified, a resumed transfer can overwrite the checked file with an attacker-controlled package, which APT then installs. Because package installation runs as root and can execute package installation scripts, the result can be full control of a developer machine, CI runner, build environment, or container image.\u003c/p\u003e\n\n\u003cp\u003eThe article advises upgrading APT to the fixed version and disabling download retries with \u003ccode\u003eAcquire::Retries=0\u003c/code\u003e while performing the upgrade, because the upgrade itself otherwise uses the vulnerable client. Organizations should rebuild runner and container images, check APT versions on GitHub-hosted runners, and patch every client that installs packages through mirrors or proxies. Using HTTPS for APT sources blocks on-path exploitation, but the article notes that patching remains necessary because HTTPS does not protect against a malicious mirror or a TLS-terminating proxy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-109518 is an APT flaw that can allow an attacker able to tamper with HTTP package traffic to replace a package after APT has verified it and execute code as root during installation.","The issue affects Debian 12 and later and Ubuntu 22.04 and later by default because APT retries failed downloads three times, while older releases are affected if Acquire::Retries is set above zero.","The attack abuses interrupted-download retries, redirects that merge two package downloads, and mishandled hard links to overwrite a verified package before APT installs it.","Self-hosted CI runners, Docker builds, developer machines, package mirrors and proxies, and potentially GitHub-hosted runners can be exposed when affected APT clients download packages through an attacker-controlled path.","Organizations should upgrade APT to the fixed version and set Acquire::Retries to 0 during the upgrade, while rebuilding runner and container images that include the vulnerable version."],"insights":["APT’s signature and hash verification can still succeed in this flaw because the package is replaced after verification but before installation, making it a check-then-use timing issue rather than a broken signature system.","The command used to install the APT fix can itself be exposed, so the article recommends disabling download retries with Acquire::Retries=0 before upgrading.","Updating a package mirror or proxy host alone does not protect the APT clients that use it; every runner, build container, and other client must be patched.","Switching package sources from HTTP to HTTPS blocks an attacker who intercepts network traffic, but it does not remove the need to patch APT if the mirror is malicious or a proxy decrypts and re-encrypts the connection.","A compromised package can execute commands through its installation scripts, so process monitoring should focus on package scripts that launch tools such as curl, wget, bash, or base64 during an APT install."],"referencedReports":[{"title":"APT-2026-11-01","url":"https://lists.debian.org/deity/2026/11/msg00005.html","publisher":"APT team","context":"The article lists this as the APT team security announcement for the flaw.","category":"advisory","primary":true},{"title":"Canonical: CVE-2026-109518 APT vulnerability fixes available","url":"https://ubuntu.com/blog/apt-vulnerability-fixes-available","publisher":"Canonical","context":"The article cites Canonical’s vulnerability-fix notice to support disabling retries during the upgrade and using HTTPS.","category":"advisory","primary":true},{"title":"DSA-6607-1","url":"https://lists.debian.org/debian-security-announce/2026/msg00526.html","publisher":"Debian","context":"The article cites this Debian Security Advisory for attack details and the fixed APT version for Debian 13.","category":"advisory","primary":true},{"title":"DLA-4880-1","url":"https://security-tracker.debian.org/tracker/DLA-4880-1","publisher":"Debian","context":"The article identifies this Debian advisory as the reference for the Debian 12 fixed APT version.","category":"advisory","primary":false},{"title":"USN-8996-1","url":"https://ubuntu.com/security/notices/USN-8996-1","publisher":"Canonical","context":"The article cites this Ubuntu Security Notice for attack details and fixed APT versions across Ubuntu releases.","category":"advisory","primary":true}],"body":"\u003cp\u003eCVE-2026-109518 is a flaw in APT, the package manager used by Debian, Ubuntu, and many related systems, that can let an attacker replace a package after it has passed APT’s signature and hash checks. Debian and Ubuntu released fixes on November 4, 2026. An attacker must be able to tamper with HTTP traffic between a machine and its package source, such as through a compromised network, mirror, proxy, or cache.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs when APT retries interrupted downloads, merges package downloads through redirects, and mishandles hard links used for the shared download. After the package hash is verified, a resumed transfer can overwrite the checked file with an attacker-controlled package, which APT then installs. Because package installation runs as root and can execute package installation scripts, the result can be full control of a developer machine, CI runner, build environment, or container image.\u003c/p\u003e\n\n\u003cp\u003eThe article advises upgrading APT to the fixed version and disabling download retries with \u003ccode\u003eAcquire::Retries=0\u003c/code\u003e while performing the upgrade, because the upgrade itself otherwise uses the vulnerable client. Organizations should rebuild runner and container images, check APT versions on GitHub-hosted runners, and patch every client that installs packages through mirrors or proxies. Using HTTPS for APT sources blocks on-path exploitation, but the article notes that patching remains necessary because HTTPS does not protect against a malicious mirror or a TLS-terminating proxy.\u003c/p\u003e\n"},{"n":14,"title":"Zyxel GS1900 Patch Fails to Block Zero-Day Exploit Allowing Root Command Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/zyxel-gs1900-patch-fails-to-block-zero.html","time":"07:06","priority":"MUST READ","score":91,"tldr":"Zyxel GS1900 switches running the earlier 2.90 Patch 2 firmware remain vulnerable to an unauthenticated remote root command-execution exploit because the patch did not fully fix the underlying out-of-bounds write. Owners of affected models should upgrade to the newly released 2.90 Patch 3 firmware immediately.","briefOverview":"\u003cp\u003eZyxel GS1900 switches running the vendor’s earlier 2.90 Patch 2 update remain vulnerable to an unauthenticated command-execution exploit, according to Binarly researchers. Zyxel released 2.90 Patch 3 firmware for 10 GS1900 models to fix the newly tracked CVE-2026-107441 flaw. The issue allows anyone with network access to the switch’s web management service to run commands as root without logging in.\u003c/p\u003e\n\n\u003cp\u003eBinarly found that Patch 2 added a parameter-count check only after an oversized request parameter had already been copied, allowing an attacker to overwrite the counter and bypass the safeguard. Patch 3 checks the counter before copying the parameter and limits the size of copied data. GreyNoise reported that attackers collected data from 996 GS1900 switches around August 17, including configurations, hashed root credentials, and network information, while 564 of those devices still used factory-default credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zyxel GS1900 switches running 2.90 Patch 2 remain susceptible to unauthenticated command execution through a separate out-of-bounds write flaw tracked as CVE-2026-107441.","Zyxel released 2.90 Patch 3 firmware for 10 affected GS1900 models, and the update adds checks before copying request parameters and limits their size.","Binarly reported that the exploit requires only network access to the switch’s web management service and can run attacker commands with root privileges.","GreyNoise reported that attackers collected data from 996 GS1900 switches around August 17, including switch configurations, hashed root credentials, and network information.","CISA added the earlier GS1900 flaw, CVE-2026-7273, to its Known Exploited Vulnerabilities catalog, but CVE-2026-107441 was not listed in the catalog data cited by the article."],"insights":["The Patch 2 safeguard was ineffective because it checked the number of request parameters only after an oversized parameter had already overwritten the counter it relied upon.","Organizations that met CISA’s Patch 2 remediation deadline could still have remained exposed to the exploit, since Binarly found the same exploit worked against Patch 2 without changes.","Of the 996 switches reportedly accessed by attackers, 564 still had factory-default credentials, highlighting that many exposed devices also lacked a basic access-control change.","Zyxel’s advisory provides no workaround for owners unable to install Patch 3 and does not state whether updating removes attacker access that may already have been established."],"referencedReports":[{"title":"Zyxel Security Advisory for Out-of-Bounds Write Vulnerability in GS1900 Series Switches","url":"https://www.zyxel.com/global/en/support/security-advisories/zyxel-security-advisory-for-out-of-bounds-write-vulnerability-in-gs1900-series-switches-11-03-2026","publisher":"zyxel","context":"Zyxel’s advisory identifies the affected GS1900 models and the Patch 3 firmware versions that fix CVE-2026-107441.","category":"advisory","primary":true},{"title":"BRLY-2026-057","url":"https://www.binarly.io/advisories/brly-2026-057","publisher":"binarly","context":"Binarly’s vulnerability advisory says the flaw affects all listed Patch 2 builds and can allow unauthenticated root-level command execution.","category":"advisory","primary":true},{"title":"Zyxel GS1900 RCE: CVE-2026-107441","url":"https://www.binarly.io/blog/zyxel-gs1900-rce-cve-2026-107441","publisher":"binarly","context":"Binarly’s technical analysis explains why Patch 2 did not stop the exploit and how Patch 3 addresses the issue.","category":"research","primary":true},{"title":"Open Season on Kapibala: Attacker Steals Government Records, WordPress Exploitation","url":"https://www.greynoise.io/blog/open-season-on-kapibala-attacker-steals-government-records-wordpress-exploitation","publisher":"greynoise","context":"GreyNoise’s attack report describes attackers collecting configuration, credential-hash, and network data from 996 GS1900 switches.","category":"research","primary":true}],"body":"\u003cp\u003eZyxel GS1900 switches running the vendor’s earlier 2.90 Patch 2 update remain vulnerable to an unauthenticated command-execution exploit, according to Binarly researchers. Zyxel released 2.90 Patch 3 firmware for 10 GS1900 models to fix the newly tracked CVE-2026-107441 flaw. The issue allows anyone with network access to the switch’s web management service to run commands as root without logging in.\u003c/p\u003e\n\n\u003cp\u003eBinarly found that Patch 2 added a parameter-count check only after an oversized request parameter had already been copied, allowing an attacker to overwrite the counter and bypass the safeguard. Patch 3 checks the counter before copying the parameter and limits the size of copied data. GreyNoise reported that attackers collected data from 996 GS1900 switches around August 17, including configurations, hashed root credentials, and network information, while 564 of those devices still used factory-default credentials.\u003c/p\u003e\n"},{"n":5,"title":"Barracuda Networks is your new best friend (Barracuda Email Security Gateway Pre-Auth Remote Root RCE CVE-2026-116606 / CVE-2026-111560)","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/","time":"21:19","priority":"SHOULD READ","score":89,"tldr":"watchTowr Labs found that chaining CVE-2026-116606, a pre-authentication authorization bypass, with CVE-2026-111560, a root OS command injection, enables unauthenticated remote root code execution on vulnerable Barracuda Email Security Gateway appliances. Organizations should update to Barracuda ESG 9.4.0.029 or later and assess exposure using the published detection artifact.","briefOverview":"\u003cp\u003ewatchTowr Labs analyzed two Barracuda Email Security Gateway flaws: CVE-2026-116606, a pre-authentication authorization bypass, and CVE-2026-111560, an OS command injection issue. The research compared ESG 9.4.0.027 with 9.4.0.029 and found that the vulnerabilities could be chained for unauthenticated remote command execution as root. Barracuda’s advisory lists ESG as affected by both flaws, while the command-injection issue also affects several other Barracuda products.\u003c/p\u003e\n\n\u003cp\u003eThe authorization issue occurred when a failed password-change request returned a login-screen role object rather than stopping request processing, allowing module handlers to continue. A backup upload handler could then restore a crafted Spam_Config backup that changed the system_timezone database value, which was later inserted into shell-backed time-zone update commands. Although backup files required an MD5 checksum, the article found that the checksum used a hard-coded secret, allowing an attacker to create an accepted malicious backup; Barracuda fixed the issues in version 9.4.0.029, and watchTowr published a detection artifact generator.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["watchTowr Labs analyzed Barracuda Email Security Gateway versions 9.4.0.027 and 9.4.0.029 to examine CVE-2026-116606 and CVE-2026-111560.","CVE-2026-116606 allowed a failed password-change request to continue processing under the unauthenticated login-screen role instead of stopping the request.","CVE-2026-111560 arose because the system_timezone value was inserted into shell commands used during backup restoration and time-zone configuration.","An unauthenticated upload handler could restore a crafted Spam_Config backup that sets system_timezone to a command-injection payload, leading to command execution as root.","Barracuda fixed both issues in version 9.4.0.029, and watchTowr Labs published a detection artifact generator on GitHub."],"insights":["The authorization bypass was caused by error handling that returned a low-privilege role object but did not terminate request processing, allowing later module handlers to run.","The backup integrity check was not a meaningful barrier because its MD5 checksum used a hard-coded secret, allowing a crafted backup archive to carry a valid checksum.","The injected time-zone value reached two command-execution paths, including fix_tz.pl, which the appliance ran with sudo and therefore executed commands as root.","The vulnerable backup-upload handler explicitly accepted requests under a permission rule of perm { 1 }, making it reachable once the password-change error path allowed request handling to continue."],"referencedReports":[{"title":"Pre-Authentication Authorization Bypass and Command Injection","url":"https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection?ref=labs.watchtowr.com","publisher":"barracuda-networks","context":"The article cites Barracuda’s advisory for its descriptions, severity scores, affected products, and fixed version for CVE-2026-116606 and CVE-2026-111560.","category":"advisory","primary":false}],"body":"\u003cp\u003ewatchTowr Labs analyzed two Barracuda Email Security Gateway flaws: CVE-2026-116606, a pre-authentication authorization bypass, and CVE-2026-111560, an OS command injection issue. The research compared ESG 9.4.0.027 with 9.4.0.029 and found that the vulnerabilities could be chained for unauthenticated remote command execution as root. Barracuda’s advisory lists ESG as affected by both flaws, while the command-injection issue also affects several other Barracuda products.\u003c/p\u003e\n\n\u003cp\u003eThe authorization issue occurred when a failed password-change request returned a login-screen role object rather than stopping request processing, allowing module handlers to continue. A backup upload handler could then restore a crafted Spam_Config backup that changed the system_timezone database value, which was later inserted into shell-backed time-zone update commands. Although backup files required an MD5 checksum, the article found that the checksum used a hard-coded secret, allowing an attacker to create an accepted malicious backup; Barracuda fixed the issues in version 9.4.0.029, and watchTowr published a detection artifact generator.\u003c/p\u003e\n"},{"n":3,"title":"Hackers backdoor Linux servers using trojanized CWP web server","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-backdoor-linux-servers-using-trojanized-cwp-web-server/","time":"16:24","priority":"SHOULD READ","score":88,"tldr":"Researchers found CWPdoor, a stealthy backdoor distributed through trojanized cwpsrv binaries for Control Web Panel, which lets attackers execute encrypted commands while suppressing access-log evidence. Administrators should check affected CWP servers for the listed indicators, replace compromised binaries, update, rotate credentials, and investigate for further compromise.","briefOverview":"\u003cp\u003eResearchers at XLab discovered CWPdoor, a Linux backdoor distributed through a trojanized version of cwpsrv, the web server used by Control Web Panel (CWP). The malware was found after XLab captured a fake updater script on June 29 that replaced legitimate cwpsrv binaries for versions 1.15.10 and 1.24.0. CWP is a web-hosting administration platform for managing services including email, DNS, and databases, and XLab observed more than 340,000 publicly exposed CWP instances in the previous month.\u003c/p\u003e\n\n\u003cp\u003eCWPdoor remains dormant until its operators send a specially crafted HTTP request containing encrypted command data, a timestamp, and an RSA signature. It verifies that the request is recent, decrypts the command, sends it to a helper process for execution, and suppresses the triggering request from access logs. The infection script also restores file timestamps, deletes temporary files, and clears command history to hide its activity. XLab recommends checking for the ngx_http_integrity_helper Unix socket, suspicious cwpsrv helper processes, and X-Ngx-Integrity strings, then replacing compromised binaries, updating CWP, rotating control-panel credentials, and investigating for additional malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at XLab discovered CWPdoor, a Linux backdoor distributed through a trojanized cwpsrv web-server binary used by Control Web Panel.","The malware is activated by encrypted HTTP headers, validates a timestamp and RSA signature, and executes decrypted commands through a helper process.","CWPdoor suppresses logging for its triggering requests, while the infection script also restores timestamps, removes temporary files, and clears command-history logs to conceal changes.","XLab reported that more than 340,000 Control Web Panel instances were exposed to the public internet over the past month.","Administrators are advised to check for the ngx_http_integrity_helper Unix socket, suspicious cwpsrv helper processes, and X-Ngx-Integrity strings, then replace compromised binaries, update CWP, rotate credentials, and investigate for additional malware."],"insights":["CWPdoor is designed to remain inactive until it receives a specially crafted request, making it less visible than a backdoor that actively contacts its operators.","Its command mechanism ties the encrypted command, timestamp, and signature together and accepts only a five-minute time window, which XLab says provides authorization control and protection against replayed requests.","The malware hides both the initial replacement of cwpsrv and later backdoor use by restoring file timestamps, clearing command history, deleting temporary files, and preventing triggering requests from appearing in access logs.","A malicious cwpsrv sample connected to the campaign had zero VirusTotal detections when it was found in an archive with Ebury, and XLab said this indicated real victims already existed in the wild.","The article provides concrete indicators for checking systems, including the ngx_http_integrity_helper Unix socket, unexpected cwpsrv helper processes, and X-Ngx-Integrity strings embedded in the server binary."],"referencedReports":[{"title":"CWPdoor: The Invisible Backdoor Living Inside Control Web Panel","url":"https://blog.xlab.qianxin.com/cwpdoor-the-invisible-backdoor-living-inside-control-web-panel/","publisher":"xlab","context":"The article relies on XLab's technical analysis for details of CWPdoor's encrypted command mechanism, signature validation, replay protection, and log suppression.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at XLab discovered CWPdoor, a Linux backdoor distributed through a trojanized version of cwpsrv, the web server used by Control Web Panel (CWP). The malware was found after XLab captured a fake updater script on June 29 that replaced legitimate cwpsrv binaries for versions 1.15.10 and 1.24.0. CWP is a web-hosting administration platform for managing services including email, DNS, and databases, and XLab observed more than 340,000 publicly exposed CWP instances in the previous month.\u003c/p\u003e\n\n\u003cp\u003eCWPdoor remains dormant until its operators send a specially crafted HTTP request containing encrypted command data, a timestamp, and an RSA signature. It verifies that the request is recent, decrypts the command, sends it to a helper process for execution, and suppresses the triggering request from access logs. The infection script also restores file timestamps, deletes temporary files, and clears command history to hide its activity. XLab recommends checking for the ngx_http_integrity_helper Unix socket, suspicious cwpsrv helper processes, and X-Ngx-Integrity strings, then replacing compromised binaries, updating CWP, rotating control-panel credentials, and investigating for additional malware.\u003c/p\u003e\n"},{"n":26,"title":"The SOC Files 5: Ghost in the pipeline, or a fileless SharePoint breach by Storm-2603","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/storm-2603-fileless-toolshell-attack/121467/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Kaspersky analyzed a Storm-2603 intrusion in which attackers exploited SharePoint ToolShell flaws to implant a fileless webshell inside IIS w3wp.exe, enabling covert tunneling, privilege escalation, and lateral movement. Defenders should treat SharePoint RCE as a host-level incident and hunt runtime and memory artifacts, anomalous IIS behavior, and follow-on remote-access tooling rather than relying only on file-based webshell detection.","briefOverview":"\u003cp\u003eKaspersky’s retrospective analysis identified activity consistent with Storm-2603 targeting an on-premises Microsoft SharePoint server through CVE-2025-53770 and CVE-2025-53771, known as ToolShell vulnerabilities. The intrusion began with a SharePoint vulnerability probe on December 20, followed by three days of silence and full exploitation on December 24. The attackers executed a webshell inside the IIS worker process, w3wp.exe, without writing the main access mechanism to disk. This allowed them to maintain a memory-resident control layer that would disappear if IIS restarted or the application pool recycled.\u003c/p\u003e\n\n\u003cp\u003eThe webshell used an ASP.NET VirtualPathProvider hook and a specific User-Agent trigger to intercept requests, communicate with the attackers, and create proxy connections to internal systems. Its modules supported discovery, file downloading, MSI installation, account creation through SAM RPC, and SYSTEM-level privilege escalation through EFSRPC-based named-pipe impersonation. Afterward, the attackers installed Velociraptor and several tunneling tools, including Zoho Assist, VS Code CLI tunneling, and Cloudflare Tunnel, while also attempting to disable endpoint security and launch Warlock ransomware. Kaspersky Endpoint Security blocked the ransomware attempt, and the article emphasizes preserving memory and IIS telemetry and investigating confirmed SharePoint exploitation as a full host-level compromise rather than only patching the initial flaw.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The intrusion began with a December 20 probe of a SharePoint ToolPane endpoint for CVE-2025-53770, followed by exploitation on December 24 after a three-day period of inactivity.","The attackers injected a fileless, memory-resident webshell into the IIS worker process, w3wp.exe, using it to intercept specially marked HTTP requests and proxy traffic to internal systems.","The webshell included capabilities for system discovery, downloading and installing files, creating administrative accounts through SAM RPC, and elevating privileges to SYSTEM through EFSRPC-based named-pipe impersonation.","After compromising the SharePoint server, the attackers installed Velociraptor and deployed multiple tunneling tools, including Zoho Assist, VS Code CLI tunneling, Cloudflare Tunnel, and a reverse proxy utility.","The attackers attempted to use a vulnerable driver and a DLL sideloading technique to disable endpoint security, then attempted to launch Warlock ransomware, which Kaspersky Endpoint Security blocked."],"insights":["A low-priority SharePoint vulnerability probe became meaningful only after retrospective correlation with exploitation three days later, showing that delayed attacker activity can defeat simple time-window-based alert correlation.","The in-memory implant depended on the IIS application domain remaining alive, so an application-pool recycle or IIS restart would remove that specific runtime-resident access mechanism.","A custom ASP.NET VirtualPathProvider can be detected through an IIS telemetry mismatch: events mapping a virtual resource to a physical path without a corresponding file on disk or the normal file-change monitoring events.","The attackers used legitimate administrative and tunneling tools, including Velociraptor, Zoho Assist, VS Code CLI, and Cloudflare Tunnel, to establish several separate access paths after the initial SharePoint compromise.","The article advises that a confirmed SharePoint remote-code-execution incident should prompt host containment, memory and IIS telemetry preservation, persistence hunting, and credential and MachineKey rotation rather than only patching the initial flaw."],"referencedReports":[{"title":"Disrupting active exploitation of on-premises SharePoint vulnerabilities","url":"https://www.microsoft.com/en-us/security/blog/2025/07/22/disrupting-active-exploitation-of-on-premises-sharepoint-vulnerabilities/","publisher":"microsoft","context":"The article cites Microsoft’s attribution of ransomware-related ToolShell exploitation activity to Storm-2603 and its reporting that the actor deployed Warlock and LockBit ransomware.","category":"news","primary":false},{"title":"Velociraptor leveraged in ransomware attacks","url":"https://blog.talosintelligence.com/velociraptor-leveraged-in-ransomware-attacks/","publisher":"cisco-talos","context":"The article references Cisco Talos reporting that Storm-2603 used Velociraptor as a post-compromise execution framework in ransomware activity.","category":"research","primary":false},{"title":"Open-source toolset of an Ivanti CSA attacker","url":"https://www.synacktiv.com/en/publications/open-source-toolset-of-an-ivanti-csa-attacker#suo5","publisher":"synacktiv","context":"The article cites Synacktiv’s technical analysis when identifying suo5 as the tool used by the attackers for traffic proxying.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky’s retrospective analysis identified activity consistent with Storm-2603 targeting an on-premises Microsoft SharePoint server through CVE-2025-53770 and CVE-2025-53771, known as ToolShell vulnerabilities. The intrusion began with a SharePoint vulnerability probe on December 20, followed by three days of silence and full exploitation on December 24. The attackers executed a webshell inside the IIS worker process, w3wp.exe, without writing the main access mechanism to disk. This allowed them to maintain a memory-resident control layer that would disappear if IIS restarted or the application pool recycled.\u003c/p\u003e\n\n\u003cp\u003eThe webshell used an ASP.NET VirtualPathProvider hook and a specific User-Agent trigger to intercept requests, communicate with the attackers, and create proxy connections to internal systems. Its modules supported discovery, file downloading, MSI installation, account creation through SAM RPC, and SYSTEM-level privilege escalation through EFSRPC-based named-pipe impersonation. Afterward, the attackers installed Velociraptor and several tunneling tools, including Zoho Assist, VS Code CLI tunneling, and Cloudflare Tunnel, while also attempting to disable endpoint security and launch Warlock ransomware. Kaspersky Endpoint Security blocked the ransomware attempt, and the article emphasizes preserving memory and IIS telemetry and investigating confirmed SharePoint exploitation as a full host-level compromise rather than only patching the initial flaw.\u003c/p\u003e\n"},{"n":18,"title":"OpenSSH Issues Emergency Fix for Flaw Letting Long Passwords Bypass SSH Auth on Alpine Linux","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/openssh-issues-emergency-fix-for-flaw.html","time":"16:42","priority":"SHOULD READ","score":86,"tldr":"OpenSSH 10.6p2 and patched Alpine packages fix a critical authentication bypass that can let attackers log into passwordless accounts on affected Alpine SSH servers using 257–1,024-byte passwords. Administrators should update and restart sshd immediately or disable PasswordAuthentication after confirming key-based access works.","briefOverview":"\u003cp\u003eOpenSSH released version 10.6p2 to fix a critical authentication bypass affecting some Alpine Linux servers running the standard \u003ccode\u003eopenssh-server\u003c/code\u003e package. An attacker with network access, a passwordless account name, and a password between 257 and 1,024 bytes long can log in when password authentication is enabled. Alpine released fixed packages for supported and several end-of-support releases, and no exploitation has been reported.\u003c/p\u003e\n\n\u003cp\u003eThe issue requires OpenSSH to run without PAM, an account with \u003ccode\u003e*\u003c/code\u003e as its password field, and at least one other account using a \u003ccode\u003e$5$\u003c/code\u003e or \u003ccode\u003e$6$\u003c/code\u003e password hash. On musl-based Alpine systems, the password-processing function returns \u003ccode\u003e*\u003c/code\u003e for excessively long passwords of those hash types, which can match the \u003ccode\u003e*\u003c/code\u003e stored for an account with no password. Administrators should update packages and restart sshd, or disable password authentication after confirming that key-based access works; potentially affected systems should also review login and privilege-escalation activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenSSH 10.6p2 and fixed Alpine Linux packages address a critical flaw that can allow logins to passwordless accounts on affected Alpine SSH servers using passwords between 257 and 1,024 bytes long.","The issue affects Alpine systems running OpenSSH without PAM, with password authentication enabled, at least one account whose password field is '*', and another account with a $5$ or $6$ password hash.","The flaw occurs because musl's crypt() returns '*' for overly long passwords with certain hash types, which can match the '*' stored for an account that has no password.","Alpine administrators should update packages and restart sshd, or disable password authentication after confirming SSH key login works.","The advisory says that systems with password authentication disabled, accounts locked with '!', or no accounts using $-style password hashes are not affected."],"insights":["A single local account with a $5$ or $6$ password hash can expose every account whose password field is '*', provided password authentication is enabled.","Alpine's default root setting normally blocks direct password login as root, but that safeguard does not prevent escalation when an exposed account has access to doas.","Affected tiny-cloud images can become vulnerable only after a real $6$ password hash is added, such as when an administrator sets a console password.","Updating the OpenSSH package alone is insufficient because the running sshd process must also be restarted for the fix to take effect.","Administrators can look for possible abuse in /var/log/messages by checking for 'Accepted password for' entries involving accounts that should not have passwords."],"referencedReports":[{"title":"Alpine Linux Security Advisory: OpenSSH Password Authentication Bypass","url":"https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/","publisher":"alpine-linux","context":"The article cites Alpine's advisory for the exposure conditions, affected accounts, mitigations, and incident-review guidance.","category":"advisory","primary":true},{"title":"SSH Hole","url":"https://sshhole.com/","publisher":"özgün-kültekin","context":"The article cites Kültekin's technical write-up for analysis of the flaw and identification of other musl-based systems to review.","category":"research","primary":true}],"body":"\u003cp\u003eOpenSSH released version 10.6p2 to fix a critical authentication bypass affecting some Alpine Linux servers running the standard \u003ccode\u003eopenssh-server\u003c/code\u003e package. An attacker with network access, a passwordless account name, and a password between 257 and 1,024 bytes long can log in when password authentication is enabled. Alpine released fixed packages for supported and several end-of-support releases, and no exploitation has been reported.\u003c/p\u003e\n\n\u003cp\u003eThe issue requires OpenSSH to run without PAM, an account with \u003ccode\u003e*\u003c/code\u003e as its password field, and at least one other account using a \u003ccode\u003e$5$\u003c/code\u003e or \u003ccode\u003e$6$\u003c/code\u003e password hash. On musl-based Alpine systems, the password-processing function returns \u003ccode\u003e*\u003c/code\u003e for excessively long passwords of those hash types, which can match the \u003ccode\u003e*\u003c/code\u003e stored for an account with no password. Administrators should update packages and restart sshd, or disable password authentication after confirming that key-based access works; potentially affected systems should also review login and privilege-escalation activity.\u003c/p\u003e\n"},{"n":34,"title":"ARTEX: Agentic Asbestos","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/artex-agentic-asbestos/","time":"21:38","priority":"SHOULD READ","score":86,"tldr":"Censys found 1,465 publicly exposed ARTEX AI-driven penetration-testing consoles, with many co-hosting C2, tunneling, LLM proxy, and other offensive tools; some exposed open directories containing implants, exploits, and operator data. ARTEX has been linked by CrowdStrike and Microsoft to attacks on South Korean financial institutions and the Storm-0940 ConnectWise compromise.","briefOverview":"\u003cp\u003eARTEX is an open-source, LLM-driven autonomous penetration-testing framework released in July 2026 that combines a Go backend, Next.js console, PostgreSQL, mitmproxy, and ScopeSentry asset discovery. Users define testing tasks, then planner and worker agents break goals into steps, run tools such as nmap, and record results in asset and exploration graphs. CrowdStrike reported that an unattributed, likely financially motivated Chinese-speaking actor used ARTEX against South Korean financial organizations, while Microsoft attributed ARTEX use in the ConnectWise Cloud Backup supply-chain compromise to the China state-aligned Storm-0940 group. The project was taken down after its author said it would become closed-source, but archived copies, translations, and rebrands continue to circulate.\u003c/p\u003e\n\n\u003cp\u003eAs of November 3, 2026, Censys identified 1,465 hosts with publicly exposed ARTEX consoles, although two identically configured hosting blocks account for roughly 650 hosts and leave about 815 distinct-looking deployments. Censys found 155 ARTEX hosts also running other detected tools, including CyberStrikeAI, PentAGI, Cobalt Strike, Adaptix C2, Vshell, FRP, and self-hosted LLM gateway or reseller software. It also observed 32 ARTEX hosts with open directories exposing exploit binaries, post-exploitation kits, stagers, implants, private keys, and operator files. The article notes that these exposed directories can be short-lived, but Censys scan history retains file listings after they are removed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ARTEX is an open-source, LLM-driven autonomous penetration-testing framework released in July 2026 that uses planner and worker agents to perform tasks ranging from reconnaissance to testing targets.","CrowdStrike reported that an unattributed, likely financially motivated Chinese-speaking actor used ARTEX against South Korean financial organizations, while Microsoft linked ARTEX use in the ConnectWise Cloud Backup supply-chain compromise to Storm-0940.","As of November 3, 2026, Censys identified 1,465 hosts with exposed ARTEX consoles, although two identically configured hosting blocks accounted for about 650 of those hosts.","Censys found that 155 ARTEX hosts also ran other detected threat-related tools, including CyberStrikeAI, Cobalt Strike, Adaptix C2, Vshell, FRP, and LLM gateway or reseller software.","Censys observed 32 ARTEX hosts with open directories exposing materials such as post-exploitation kits, stagers, implants, exploit binaries, and operator files."],"insights":["The apparent scale of exposed ARTEX may be substantially inflated by hosting templates: two netblocks account for about 650 of 1,465 observed hosts, leaving roughly 815 distinct-looking deployments.","Open directories on ARTEX hosts are often short-lived, but Censys scan history can preserve their file listings after operators remove them, making historical exposure useful for investigation.","Short-lived Python SimpleHTTP servers on high ports and mitmproxy banners can appear before an ARTEX console, providing potential earlier indicators for hunting.","Forty-three ARTEX hosts also ran self-hosted LLM gateway or reseller software, and CrowdStrike observed one actor using reseller-provided DeepSeek access, making unfamiliar LLM proxy services a relevant investigative pivot."],"referencedReports":[{"title":"Unknown Threat Actor Uses AI-Driven ARTEX to Target South Korean Finance","url":"https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/","publisher":"crowdstrike","context":"The article cites CrowdStrike's report on an actor using ARTEX to target South Korean financial organizations and exposing operational files through an open directory.","category":"research","primary":true},{"title":"AI-driven, large-scale nation-state campaign using ARTEX enables supply chain compromise","url":"https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/","publisher":"microsoft","context":"The article cites Microsoft's report attributing the ConnectWise Cloud Backup supply-chain compromise to Storm-0940 and describing its use of ARTEX.","category":"research","primary":true}],"body":"\u003cp\u003eARTEX is an open-source, LLM-driven autonomous penetration-testing framework released in July 2026 that combines a Go backend, Next.js console, PostgreSQL, mitmproxy, and ScopeSentry asset discovery. Users define testing tasks, then planner and worker agents break goals into steps, run tools such as nmap, and record results in asset and exploration graphs. CrowdStrike reported that an unattributed, likely financially motivated Chinese-speaking actor used ARTEX against South Korean financial organizations, while Microsoft attributed ARTEX use in the ConnectWise Cloud Backup supply-chain compromise to the China state-aligned Storm-0940 group. The project was taken down after its author said it would become closed-source, but archived copies, translations, and rebrands continue to circulate.\u003c/p\u003e\n\n\u003cp\u003eAs of November 3, 2026, Censys identified 1,465 hosts with publicly exposed ARTEX consoles, although two identically configured hosting blocks account for roughly 650 hosts and leave about 815 distinct-looking deployments. Censys found 155 ARTEX hosts also running other detected tools, including CyberStrikeAI, PentAGI, Cobalt Strike, Adaptix C2, Vshell, FRP, and self-hosted LLM gateway or reseller software. It also observed 32 ARTEX hosts with open directories exposing exploit binaries, post-exploitation kits, stagers, implants, private keys, and operator files. The article notes that these exposed directories can be short-lived, but Censys scan history retains file listings after they are removed.\u003c/p\u003e\n"},{"n":28,"title":"Hacking on Autopilot: Inside ARTEX Cybercrime Campaigns","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/","time":"17:22","priority":"SHOULD READ","score":85,"tldr":"Check Point Research found that cybercriminals are using the ARTEX AI-powered penetration-testing platform to autonomously conduct large-scale opportunistic attacks, with operators often providing only an initial goal and checking progress. Exposed ARTEX consoles revealed campaigns targeting Apple signing certificates, cryptocurrency services, and gaming accounts, demonstrating how agentic tools can scale exploitation and supply-chain compromise.","briefOverview":"\u003cp\u003eCheck Point Research analyzed criminal use of ARTEX, a Chinese open-source AI-powered penetration-testing platform that can coordinate agents to find and exploit weaknesses after an operator sets an objective. The researchers identified 2,557 systems that hosted or had hosted ARTEX panels, including 1,608 live publicly available instances, and found 10 misconfigured instances that exposed complete databases. These databases showed operators’ prompts, selected AI models, and the actions taken by agents, with Chinese models—especially DeepSeek Flash—most commonly configured.\u003c/p\u003e\n\n\u003cp\u003eThe observed campaigns were largely autonomous and focused on opportunistic financial crime, including theft of Apple code-signing certificates, cryptocurrency-related operations, and gaming-account credentials. Agents exploited issues including hardcoded administrative passwords, unauthenticated web APIs, command injection, insecure direct object references, and server-side template injection; one operation also used leaked AWS S3 credentials to overwrite public iOS app delivery content. The research found that these tools can let operators conduct persistent, broad attacks with minimal interaction, increasing the volume and speed of attempts against exposed systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research identified 2,557 systems hosting or having hosted ARTEX panels, including 1,608 that were live and publicly accessible at the time of research.","Ten misconfigured ARTEX instances exposed their full databases, revealing operators' prompts, model selections, and the actions their AI agents performed.","The reviewed ARTEX campaigns were largely autonomous after an operator set an initial objective, with operators mostly checking progress rather than directing individual actions.","Observed campaigns targeted Apple code-signing certificate shops, cryptocurrency-related services, and gaming-account credential servers, using issues such as exposed credentials, missing authentication, command injection, and server-side template injection.","In one gaming-account campaign, agents recovered more than 190,000 credential sets for Honor of Kings accounts, and sampling estimated that about 6,000 remained valid."],"insights":["The observed operators often needed little more than an initial objective: one certificate-theft operator’s subsequent messages were largely progress checks, while two other campaigns had no operator prompts beyond task setup.","The crypto campaign shows that agent-reported success was not always reliable: agents claimed USDT cashout paths based on API “success” responses, but the attacker wallet had no transactions or balance.","A supply-chain risk emerged when agents used leaked AWS S3 credentials to overwrite public iOS app landing-page content and package-delivery files, although the bucket owners later restored the original manifest.","The certificate-theft operation processed 36 billion tokens over roughly two weeks at an estimated cost of $700 to $1,500, illustrating that sustained automated campaigns could be run for a relatively limited stated cost.","Anthropic Opus 5.5 was the only American model observed hitting guardrails in the analyzed instances, after which the operator switched to more permissive Chinese models."],"referencedReports":[{"title":"2026 study on gray-market Apple code-signing certificate marketplaces and signing services","url":"https://www.usenix.org/system/files/conference/usenixsecurity26/sec26_prepub_liu-yijing.pdf","publisher":"usenix","context":"The article cites this study to support its description of the gray market for Apple .p12 code-signing certificates and provisioning profiles.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research analyzed criminal use of ARTEX, a Chinese open-source AI-powered penetration-testing platform that can coordinate agents to find and exploit weaknesses after an operator sets an objective. The researchers identified 2,557 systems that hosted or had hosted ARTEX panels, including 1,608 live publicly available instances, and found 10 misconfigured instances that exposed complete databases. These databases showed operators’ prompts, selected AI models, and the actions taken by agents, with Chinese models—especially DeepSeek Flash—most commonly configured.\u003c/p\u003e\n\n\u003cp\u003eThe observed campaigns were largely autonomous and focused on opportunistic financial crime, including theft of Apple code-signing certificates, cryptocurrency-related operations, and gaming-account credentials. Agents exploited issues including hardcoded administrative passwords, unauthenticated web APIs, command injection, insecure direct object references, and server-side template injection; one operation also used leaked AWS S3 credentials to overwrite public iOS app delivery content. The research found that these tools can let operators conduct persistent, broad attacks with minimal interaction, increasing the volume and speed of attempts against exposed systems.\u003c/p\u003e\n"},{"n":4,"title":"OpenSSH flaw lets attackers log into password-disabled Linux accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/openssh-flaw-lets-attackers-log-into-password-disabled-linux-accounts/","time":"17:45","priority":"SHOULD READ","score":84,"tldr":"A flaw dubbed “sshole” in OpenSSH on musl-based systems can let attackers log into accounts whose /etc/shadow password field is “*” by submitting an oversized password, if PAM is disabled and SSH password authentication is enabled. Update to OpenSSH 10.6p2 or disable SSH password authentication immediately.","briefOverview":"\u003cp\u003eA newly disclosed flaw dubbed “*sshole” affects certain OpenSSH servers on musl-based Linux distributions, including Alpine Linux, OpenWrt, Buildroot, and Yocto. It can allow an attacker to log in to an account configured to reject password authentication by submitting an oversized password. The issue requires PAM authentication to be disabled, SSH password authentication to be enabled, and an account to have an asterisk (\u003ccode\u003e*\u003c/code\u003e) in its password field.\u003c/p\u003e\n\n\u003cp\u003eThe problem stems from OpenSSH behavior introduced in 2016 to reduce username-enumeration timing differences. On musl systems, the \u003ccode\u003ecrypt()\u003c/code\u003e function returns \u003ccode\u003e*\u003c/code\u003e when password hashing fails, including for passwords over its 256-byte limit; OpenSSH can then match that result to an account whose stored password field is also \u003ccode\u003e*\u003c/code\u003e. The flaw does not bypass valid password hashes, but affected Alpine AWS and Azure images may expose an \u003ccode\u003ealpine\u003c/code\u003e account with passwordless \u003ccode\u003edoas\u003c/code\u003e privileges, potentially enabling root access. OpenSSH 10.6p2 fixes the flaw, while disabling SSH password authentication is a temporary mitigation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A flaw dubbed \"sshole\" can allow logins to certain password-disabled accounts on musl-based Linux systems when an attacker submits an oversized password.","The issue affects OpenSSH configurations with PAM disabled, SSH password authentication enabled, an account whose password field is an asterisk, and another account with a valid password hash.","The flaw results from musl's crypt() function returning an asterisk when hashing fails for passwords longer than 256 bytes, which OpenSSH can then match against an account's stored asterisk.","Alpine Linux's official AWS and Azure cloud images reportedly include an affected alpine account with passwordless doas privileges, which could allow root access.","OpenSSH 10.6p2 fixes the issue, and administrators who cannot update can disable SSH password authentication as a mitigation."],"insights":["A 2016 OpenSSH change intended to prevent username guessing introduced the relevant behavior by forcing password hashing even for accounts with unusable password entries.","The weakness does not bypass normal account passwords; it specifically arises when musl returns the same asterisk character used to deliberately disable an account password.","Debian, Ubuntu, and Fedora are not affected because they use glibc rather than musl, and systems using PAM authentication are also not vulnerable under the described conditions.","Administrators can look for possible exploitation by checking logs for “Accepted password” entries for accounts whose /etc/shadow password field is an asterisk."],"referencedReports":[{"title":"*sshole","url":"https://sshhole.com/","publisher":"ozgun-kultekin","context":"Security researcher Ozgun Kultekin released technical details of the newly disclosed OpenSSH and musl authentication flaw.","category":"research","primary":true}],"body":"\u003cp\u003eA newly disclosed flaw dubbed “*sshole” affects certain OpenSSH servers on musl-based Linux distributions, including Alpine Linux, OpenWrt, Buildroot, and Yocto. It can allow an attacker to log in to an account configured to reject password authentication by submitting an oversized password. The issue requires PAM authentication to be disabled, SSH password authentication to be enabled, and an account to have an asterisk (\u003ccode\u003e*\u003c/code\u003e) in its password field.\u003c/p\u003e\n\n\u003cp\u003eThe problem stems from OpenSSH behavior introduced in 2016 to reduce username-enumeration timing differences. On musl systems, the \u003ccode\u003ecrypt()\u003c/code\u003e function returns \u003ccode\u003e*\u003c/code\u003e when password hashing fails, including for passwords over its 256-byte limit; OpenSSH can then match that result to an account whose stored password field is also \u003ccode\u003e*\u003c/code\u003e. The flaw does not bypass valid password hashes, but affected Alpine AWS and Azure images may expose an \u003ccode\u003ealpine\u003c/code\u003e account with passwordless \u003ccode\u003edoas\u003c/code\u003e privileges, potentially enabling root access. OpenSSH 10.6p2 fixes the flaw, while disabling SSH password authentication is a temporary mitigation.\u003c/p\u003e\n"},{"n":11,"title":"GhostMap: The Android flaw that crashes your phone before you open the app","source":"bitdefender.com","sourceColorIdx":7,"link":"https://www.bitdefender.com/en-us/blog/labs/ghostmap-android","time":"09:00","priority":"SHOULD READ","score":84,"tldr":"Bitdefender researchers found GhostMap, an Android 10+ ZIP/APK parsing flaw that can let a specially crafted app crash system_server in a persistent boot loop without being opened or granted permissions, potentially requiring a factory reset. Google reportedly declined to issue a security update, while Bitdefender says its mobile security product detects affected APKs before installation.","briefOverview":"\u003cp\u003eBitdefender Labs reported GhostMap, an Android flaw in which a specially crafted APK can cause a phone to enter a repeated crash loop after installation, without the app being opened or granted permissions. The researchers reproduced the persistent failure on Android 10 and later, including a Pixel 10 running Android 17 with the August 2026 security patch. They said the affected phone may require a factory reset, erasing local data, unless USB debugging was enabled in advance and ADB can be used in limited conditions.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from inconsistent ZIP-entry handling in Android\u0026rsquo;s libziparchive and libandroidfw libraries. An entry assigned a compression method that is neither stored nor deflated can bypass one library\u0026rsquo;s size check, while another maps it using an attacker-declared uncompressed size that extends beyond the actual file. When Android reads beyond the real end of that mapped file, the process receives a SIGBUS crash; targeting resources read by system_server can make the operating system restart and crash repeatedly. Google reportedly considered the finding outside the scope of a security-update fix, while Bitdefender said its Mobile Security product detects the malformed files before they are read.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitdefender researchers identified GhostMap, an Android ZIP/APK parsing flaw in which a malformed file entry can trigger a SIGBUS crash when Android reads beyond the actual end of the file.","A crafted APK can cause a persistent system_server crash loop after installation without being opened, containing executable code, or requesting permissions, potentially leaving recovery to a factory reset.","Bitdefender reproduced the issue on Android 10 and later, including a Pixel 10 running Android 17 with the August 5, 2026 security patch.","The flaw results from inconsistent handling of ZIP compression methods and declared uncompressed sizes between Android's libziparchive and libandroidfw libraries.","Google reportedly classified the reports as outside the scope of a security update, although it forwarded the finding to a feature team for possible future consideration."],"insights":["The APK that prompted the investigation was a banking dropper whose malformed structure appeared unintended: it failed during installation and did not demonstrate the persistent crash-loop technique that Bitdefender later developed.","Safe mode does not stop the persistent crash loop because the affected system service reads the malformed file before safe mode takes effect.","Apps that inspect APK files can be terminated by the flaw even when they wrap the parsing call in standard error handling, because the native SIGBUS crash is not a normal application-level exception.","The same malformed-file behavior could target an app’s icon, causing the launcher and Settings screens to crash when displaying it and potentially preventing users from reaching normal uninstall controls."],"referencedReports":[{"title":"Leaving our ZIP undone: How to abuse zip to deliver malware apps","url":"https://virusbulletin.com/uploads/pdf/conference/vb2014/VB2014-Panakkal.pdf","publisher":"Virus Bulletin","context":"The article cites this 2014 research paper as prior work on APK ZIP-file malformations that can bypass typical antivirus unarchiving.","category":"research","primary":false},{"title":"APK BadPack: Malware Tampered Headers","url":"https://unit42.paloaltonetworks.com/apk-badpack-malware-tampered-headers/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42's technical analysis of BadPack samples that use corrupted APK ZIP headers to impede analysis tools.","category":"research","primary":false}],"body":"\u003cp\u003eBitdefender Labs reported GhostMap, an Android flaw in which a specially crafted APK can cause a phone to enter a repeated crash loop after installation, without the app being opened or granted permissions. The researchers reproduced the persistent failure on Android 10 and later, including a Pixel 10 running Android 17 with the August 2026 security patch. They said the affected phone may require a factory reset, erasing local data, unless USB debugging was enabled in advance and ADB can be used in limited conditions.\u003c/p\u003e\n\n\u003cp\u003eThe issue stems from inconsistent ZIP-entry handling in Android\u0026rsquo;s libziparchive and libandroidfw libraries. An entry assigned a compression method that is neither stored nor deflated can bypass one library\u0026rsquo;s size check, while another maps it using an attacker-declared uncompressed size that extends beyond the actual file. When Android reads beyond the real end of that mapped file, the process receives a SIGBUS crash; targeting resources read by system_server can make the operating system restart and crash repeatedly. Google reportedly considered the finding outside the scope of a security-update fix, while Bitdefender said its Mobile Security product detects the malformed files before they are read.\u003c/p\u003e\n"},{"n":15,"title":"OpenAI AI Pipeline Generates 948 Linux Root Escalation Exploits in 30-Hour Run","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/openai-ai-pipeline-generates-948-linux.html","time":"04:31","priority":"SHOULD READ","score":84,"tldr":"OpenAI says an agentic pipeline using an upcoming cyber model reproduced 1,724 Linux kernel flaws and generated 948 working local privilege-escalation exploits in a 30-hour run, while also producing patches for human review. The result underscores that AI is accelerating both vulnerability weaponization and defensive patching, shrinking the time organizations have to remediate exposed systems.","briefOverview":"\u003cp\u003eOpenAI said an agentic pipeline using an upcoming cyber-focused AI model analyzed 2,308 Linux kernel findings, dynamically reproduced 1,724 vulnerabilities, and generated 948 working local privilege-escalation exploits. The October 2026 run reportedly completed within 30 hours on a commonly used Linux distribution. OpenAI estimated the API-credit cost at \u003cspan class=\"math inline\"\u003e\\(1,213,430, or about \\)\u003c/span\u003e1,279 per local privilege-escalation exploit. The company said these exploits could let an unprivileged local user gain root access.\u003c/p\u003e\n\n\u003cp\u003eThe pipeline covers finding security-relevant code, reproducing suspected flaws in a sandbox, testing whether they can reveal information or grant elevated access, generating patches, and having researchers review the results before reporting them to maintainers. OpenAI said the agents used at least 10 novel Linux exploitation techniques, including kernel-cache object spraying, page-grooming methods, data-only privilege-escalation methods, and arbitrary type confusion. The article not
