<script type="application/json" id="dl-articles">[{"n":2,"title":"Hotel Wi-Fi attacks use custom malware to breach Microsoft 365 accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hotel-wi-fi-attacks-use-custom-malware-to-breach-microsoft-365-accounts/","time":"00:17","priority":"MUST READ","score":94,"tldr":"Microsoft says Russia-linked Midnight Blizzard is hijacking hotel and conference Wi-Fi networks to redirect travelers to fake Microsoft 365 login or update pages, stealing credentials and deploying custom malware. Users should treat public captive-portal Wi-Fi as untrusted and avoid entering corporate credentials or installing updates prompted through these networks.","briefOverview":"\u003cp\u003eMicrosoft has linked a global campaign targeting hospitality Wi-Fi networks to the Russian threat actor Midnight Blizzard, also known as APT29. Microsoft tracks the activity as CaptiveCrunch and attributes it to Storm-2945, a sub-cluster of Midnight Blizzard. The campaign targets travelers using hotel and conference center Wi-Fi networks and has been active since at least early May, while related device and OAuth code phishing operations have been running since February.\u003c/p\u003e\n\n\u003cp\u003eThe attackers manipulate DNS and HTTP traffic on networks served by captive portal equipment, allowing them to intercept user connections. After changing DNS settings, they can redirect victims to fake Microsoft 365 login pages, device code phishing pages that abuse Microsoft Entra ID authentication flows, or fake browser and operating system update pages. Microsoft also found evidence on some ClickFix landing pages suggesting Android devices may be targeted with an APK file.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified two Windows malware families used in the campaign, CornFlake and ChocoShell. CornFlake is a Go-based remote access trojan with capabilities including remote shell access, keylogging, screenshot capture, microphone and webcam surveillance, Microsoft 365 session token theft, and file exfiltration. ChocoShell is an in-memory PowerShell credential stealer that targets browser cookies, saved passwords, Microsoft 365 and Azure AD tokens, and Wi-Fi credentials. Microsoft recommends treating hotel and conference Wi-Fi as untrusted, using private cellular or managed connections when possible, adopting phishing-resistant authentication, and disabling Microsoft Entra device code authentication when it is not needed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft linked a global campaign targeting hospitality Wi-Fi networks to the Russian threat actor Midnight Blizzard, also known as APT29, and tracks the sub-cluster as Storm-2945.","The attackers manipulate DNS and HTTP traffic on captive portal equipment to redirect hotel and conference center Wi-Fi users to Microsoft 365 phishing pages, device code phishing pages, or fake update pages that deliver malware.","Microsoft identified two Windows malware families, CornFlake and ChocoShell, with capabilities for persistent access, credential theft, surveillance, and data exfiltration.","CornFlake is a Go-based remote access trojan that can steal Microsoft 365 session tokens, capture screenshots, monitor the clipboard, log keystrokes, access the microphone and webcam, and exfiltrate files.","Microsoft recommends treating hotel and conference Wi-Fi as untrusted, using private cellular or managed connections when possible, adopting phishing-resistant authentication, and disabling Microsoft Entra device code authentication when it is not needed."],"insights":["Microsoft said it could not determine the exact initial compromise, but observed signs of breaches in shared infrastructure rather than isolated Wi-Fi devices.","The campaign gives the attackers multiple paths from the same captive portal manipulation, including Microsoft 365 phishing, device code phishing, and fake update pages that deliver malware.","Microsoft found evidence on some ClickFix landing pages that the attackers may also be targeting Android devices by attempting to deliver an APK file.","CornFlake uses fake progress windows such as Windows update, Defender scan, browser update, or network diagnostics screens to distract users while it installs persistence in the background.","Microsoft assessed that AI tools were likely used to develop CornFlake and ChocoShell because of extensive comments found in the code."],"referencedReports":[{"title":"CaptiveCrunch: Midnight Blizzard targets travelers worldwide for malware delivery and credential theft","url":"https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/","publisher":"Microsoft","context":"The article cites Microsoft’s analysis linking the CaptiveCrunch campaign to Storm-2945 and describing the CornFlake and ChocoShell malware families.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft has linked a global campaign targeting hospitality Wi-Fi networks to the Russian threat actor Midnight Blizzard, also known as APT29. Microsoft tracks the activity as CaptiveCrunch and attributes it to Storm-2945, a sub-cluster of Midnight Blizzard. The campaign targets travelers using hotel and conference center Wi-Fi networks and has been active since at least early May, while related device and OAuth code phishing operations have been running since February.\u003c/p\u003e\n\n\u003cp\u003eThe attackers manipulate DNS and HTTP traffic on networks served by captive portal equipment, allowing them to intercept user connections. After changing DNS settings, they can redirect victims to fake Microsoft 365 login pages, device code phishing pages that abuse Microsoft Entra ID authentication flows, or fake browser and operating system update pages. Microsoft also found evidence on some ClickFix landing pages suggesting Android devices may be targeted with an APK file.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified two Windows malware families used in the campaign, CornFlake and ChocoShell. CornFlake is a Go-based remote access trojan with capabilities including remote shell access, keylogging, screenshot capture, microphone and webcam surveillance, Microsoft 365 session token theft, and file exfiltration. ChocoShell is an in-memory PowerShell credential stealer that targets browser cookies, saved passwords, Microsoft 365 and Azure AD tokens, and Wi-Fi credentials. Microsoft recommends treating hotel and conference Wi-Fi as untrusted, using private cellular or managed connections when possible, adopting phishing-resistant authentication, and disabling Microsoft Entra device code authentication when it is not needed.\u003c/p\u003e\n"},{"n":1,"title":"New Pass-ta-key attacks let malware hijack Google-synced passkeys","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-pass-ta-key-attacks-let-malware-hijack-google-synced-passkeys/","time":"23:58","priority":"SHOULD READ","score":82,"tldr":"Researchers found three “Pass-ta-key” attacks that let malware already running on a Windows device abuse Google Password Manager’s synced passkeys to bypass verification or extract private keys. The findings show passkeys are still vulnerable when the user’s device is compromised, especially if services fail to properly validate user verification.","briefOverview":"\u003cp\u003eSecurity researchers at Palo Alto Networks\u0026rsquo; Unit 42 discovered three attacks, collectively called \u003cstrong\u003ePass-ta-key\u003c/strong\u003e, that target Google Password Manager in Chrome on already-compromised Windows devices with a Trusted Platform Module. The attacks can abuse Google-synced passkeys to take over accounts, bypass user verification, or extract passkey private keys. The researchers said the attacks do not break passkey cryptography, but instead exploit weaknesses in how Chrome and Google\u0026rsquo;s cloud authenticator handle device trust, onboarding, recovery, and synced credentials.\u003c/p\u003e\n\n\u003cp\u003eThe first Pass-ta-key technique lets unprivileged malware impersonate a trusted device and request a valid authentication response from Google\u0026rsquo;s cloud authenticator without administrator privileges, user interaction, biometrics, or unlocking the device. This can fail when a service properly checks the User Verified flag, as GitHub did, but Unit 42 said it succeeded against eBay because eBay did not properly validate that flag despite requiring user verification. eBay fixed the issue after the researchers reported it.\u003c/p\u003e\n\n\u003cp\u003eThe Silver Pass-ta-key technique allows attackers to register their own user-verification key with Google\u0026rsquo;s cloud authenticator, while the Golden Pass-ta-key technique allows malware to obtain the security domain secret used to encrypt synced passkeys. Unit 42 said Google removed the secret from Chrome\u0026rsquo;s FIDO logs after disclosure, but the secret is still sent to Chrome and remains temporarily accessible in browser process memory. The researchers warned that the stolen master key could decrypt current and future synced passkeys, and recommended that websites properly validate user verification and that credential managers harden device registration, recovery, and master key handling.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Palo Alto Networks' Unit 42 discovered three attacks, collectively called \"Pass-ta-key,\" that target Google Password Manager in Chrome on already-compromised Windows devices with a Trusted Platform Module.","The first Pass-ta-key technique lets unprivileged malware impersonate a trusted device and request a valid passkey authentication response from Google's cloud authenticator without administrator privileges, user interaction, biometrics, or unlocking the device.","The Silver Pass-ta-key technique allows attackers to register their own user-verification key with Google's cloud authenticator, enabling access to accounts that properly require and validate user verification.","The Golden Pass-ta-key technique allows malware to obtain the security domain secret used to encrypt synced passkeys, which can then be used to decrypt passkey records and recover private keys.","Unit 42 said passkeys remain significantly safer than traditional passwords, but the attacks show they do not eliminate the risks posed by malware already running on a compromised device."],"insights":["A service can require user verification and still be vulnerable if it does not properly validate the User Verified flag, as Unit 42 demonstrated with eBay before the issue was fixed.","The first Pass-ta-key attack does not require administrator privileges, user interaction, biometrics, or unlocking the device, which makes local malware more dangerous than many users may assume.","Google removed the security domain secret from Chrome's FIDO logs after disclosure, but Unit 42 said the secret is still sent to Chrome and remains temporarily accessible in browser process memory.","Unit 42 said Google's current implementation provides no way to rotate or revoke the stolen security domain secret, meaning current and future synced passkeys remain protected by the same secret.","The researchers' recommendations place responsibility not only on Google Password Manager but also on websites, which need to require and properly validate user verification for passkey logins."],"referencedReports":[{"title":"Passwordless Authentication Security Risks","url":"https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42's research explaining the Pass-ta-key attacks against Google Password Manager and quotes its analysis of the security domain secret remaining accessible in Chrome process memory.","category":"research","primary":true}],"body":"\u003cp\u003eSecurity researchers at Palo Alto Networks\u0026rsquo; Unit 42 discovered three attacks, collectively called \u003cstrong\u003ePass-ta-key\u003c/strong\u003e, that target Google Password Manager in Chrome on already-compromised Windows devices with a Trusted Platform Module. The attacks can abuse Google-synced passkeys to take over accounts, bypass user verification, or extract passkey private keys. The researchers said the attacks do not break passkey cryptography, but instead exploit weaknesses in how Chrome and Google\u0026rsquo;s cloud authenticator handle device trust, onboarding, recovery, and synced credentials.\u003c/p\u003e\n\n\u003cp\u003eThe first Pass-ta-key technique lets unprivileged malware impersonate a trusted device and request a valid authentication response from Google\u0026rsquo;s cloud authenticator without administrator privileges, user interaction, biometrics, or unlocking the device. This can fail when a service properly checks the User Verified flag, as GitHub did, but Unit 42 said it succeeded against eBay because eBay did not properly validate that flag despite requiring user verification. eBay fixed the issue after the researchers reported it.\u003c/p\u003e\n\n\u003cp\u003eThe Silver Pass-ta-key technique allows attackers to register their own user-verification key with Google\u0026rsquo;s cloud authenticator, while the Golden Pass-ta-key technique allows malware to obtain the security domain secret used to encrypt synced passkeys. Unit 42 said Google removed the secret from Chrome\u0026rsquo;s FIDO logs after disclosure, but the secret is still sent to Chrome and remains temporarily accessible in browser process memory. The researchers warned that the stolen master key could decrypt current and future synced passkeys, and recommended that websites properly validate user verification and that credential managers harden device registration, recovery, and master key handling.\u003c/p\u003e\n"}]</script>
