<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers pull off $133 million French bank heist via service provider","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-pull-off-133-million-french-bank-heist-via-service-provider/","time":"15:25","priority":"SHOULD READ","score":86,"tldr":"Crédit Mutuel Arkéa said attackers accessed its network through a service-provider platform and used the bank’s own account to move and convert funds, in a theft reportedly worth up to €118 million ($133 million). The bank says customer assets were not affected, some funds were blocked, and the incident is under investigation.","briefOverview":"\u003cp\u003eCrédit Mutuel Arkéa, a French cooperative bank, disclosed that it was hit by a cyberattack that enabled fraudulent transactions from the bank’s own account to other banking organizations. The attacker gained direct access to Arkéa’s network through a service provider’s platform, though the bank said Fortuneo was not involved. Arkéa characterized the intrusion as sophisticated and ruled out human error at the bank. It is working with police and judicial authorities to establish the attack’s origin and method.\u003c/p\u003e\n\n\u003cp\u003eBlockchain investigator ZachXBT reported that up to €118 million ($133 million) may have been stolen and withdrawn as the USDC and USDT stablecoins, while Arkéa confirmed only that the amount was of that general scale. The bank said some funds were blocked, but did not specify how much was recovered. It also said customer assets were unaffected, although certain transfers were delayed as systems were suspended and operations were restored. Arkéa warned customers to expect increased phishing attempts and to verify suspicious communications by contacting their adviser directly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Crédit Mutuel Arkéa said attackers entered its network through a service provider’s platform and used the bank’s own account to initiate transactions with other banking institutions.","Blockchain investigator ZachXBT estimated that up to €118 million ($133 million) may have been stolen and converted into USDC and USDT stablecoins.","Crédit Mutuel Arkéa said customer assets were not affected, although certain transfers were delayed while it suspended systems and responded to the incident.","The bank said the incident was closed and under control, that some funds had been blocked, and that it was working with police and judicial authorities to determine the attack’s origin and method."],"insights":["The alleged theft did not require compromising customer accounts: the attacker used Crédit Mutuel Arkéa’s own account to send funds to other banking organizations.","ZachXBT said the absence of an early public disclosure allowed the attacker to launder $30 million by November 3 that European law enforcement might otherwise have frozen.","The bank identified a service provider’s platform as the entry point, showing that disruption and financial loss can stem from access obtained through an external provider.","Crédit Mutuel Arkéa warned customers of elevated phishing risk after the incident and advised independently calling their bank adviser to verify suspicious communications."],"referencedReports":[],"body":"\u003cp\u003eCrédit Mutuel Arkéa, a French cooperative bank, disclosed that it was hit by a cyberattack that enabled fraudulent transactions from the bank’s own account to other banking organizations. The attacker gained direct access to Arkéa’s network through a service provider’s platform, though the bank said Fortuneo was not involved. Arkéa characterized the intrusion as sophisticated and ruled out human error at the bank. It is working with police and judicial authorities to establish the attack’s origin and method.\u003c/p\u003e\n\n\u003cp\u003eBlockchain investigator ZachXBT reported that up to €118 million ($133 million) may have been stolen and withdrawn as the USDC and USDT stablecoins, while Arkéa confirmed only that the amount was of that general scale. The bank said some funds were blocked, but did not specify how much was recovered. It also said customer assets were unaffected, although certain transfers were delayed as systems were suspended and operations were restored. Arkéa warned customers to expect increased phishing attempts and to verify suspicious communications by contacting their adviser directly.\u003c/p\u003e\n"}]</script>
