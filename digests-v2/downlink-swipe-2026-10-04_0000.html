<script type="application/json" id="dl-articles">[{"n":1,"title":"Citrix patches NetScaler SAML zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/citrix-patches-netscaler-saml-zero-day-exploited-in-attacks/","time":"21:58","priority":"MUST READ","score":97,"tldr":"Citrix released emergency patches for actively exploited CVE-2026-88779, a NetScaler SAML authentication flaw that causes denial of service and may also enable remote code execution. Organizations using affected NetScaler ADC or Gateway SAML configurations should immediately upgrade to the fixed releases.","briefOverview":"\u003cp\u003eCitrix released emergency updates for CVE-2026-88779, an actively exploited memory buffer flaw in NetScaler ADC and NetScaler Gateway appliances that use SAML authentication with Gateway or AAA functionality. Citrix assigned the issue a CVSS score of 8.7 and said targeted attacks against unpatched deployments can cause denial-of-service conditions. The company released versions 14.1-73.41 and 13.1-64.28, plus separate FIPS and NDcPP updates, and recommends that affected customers install them as soon as possible.\u003c/p\u003e\n\n\u003cp\u003eCitrix says potentially affected appliances can be identified by SAML service-provider or identity-provider settings, including \u003ccode\u003eadd authentication samlAction\u003c/code\u003e or \u003ccode\u003eadd authentication samlIdPProfile\u003c/code\u003e. Administrators and researchers reported repeated nsaaad crashes, appliance reboots, and crafted authentication usernames containing shell commands intended to download and run a file, although successful execution was not confirmed in one administrator\u0026rsquo;s investigation. Kevin Beaumont reported that a patched honeypot ran a downloaded malware binary, while watchTowr Labs said it reproduced the flaw; CISA added CVE-2026-88779 to its Known Exploited Vulnerabilities catalog and gave FCEB agencies until October 7 to mitigate it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrix released emergency updates for CVE-2026-88779, an actively exploited NetScaler flaw affecting SAML authentication configurations in NetScaler ADC and NetScaler Gateway appliances.","Citrix rates the memory buffer flaw at CVSS 8.7 and says targeted attacks against unpatched deployments can cause denial-of-service conditions.","Citrix released NetScaler ADC and Gateway versions 14.1-73.41 and 13.1-64.28 to address the flaw, with separate fixed releases for FIPS and NDcPP deployments.","Administrators and researchers observed appliance crashes and activity suggesting possible remote code execution, although Citrix describes the issue as a denial-of-service vulnerability and one administrator did not confirm that observed shell commands executed successfully.","CISA added CVE-2026-88779 to its Known Exploited Vulnerabilities catalog and gave FCEB agencies until October 7 to mitigate it."],"insights":["Organizations that recently updated NetScaler devices for CVE-2026-88771 through CVE-2026-88778 may still need to update again if they use the affected SAML configurations.","Administrators can identify potentially affected setups by checking for the `add authentication samlAction` or `add authentication samlIdPProfile` configuration entries.","Citrix is supplying IP-based Global Deny Lists, but it explicitly recommends installing the software updates rather than relying on those lists alone.","Observed crash activity was linked to crafted usernames containing commands to download and run a file, while the administrator who found them could confirm attempted exploitation and correlated crashes but not successful command execution.","The reported behavior affected appliances rebuilt from fresh images and systems already running the then-current 14.1-73.37 release, indicating that earlier updates did not address the newly observed issue."],"referencedReports":[{"title":"Citrix Security Advisory for CVE-2026-88779","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697174","publisher":"citrix","context":"The article cites this Citrix security advisory for the CVSS score, affected NetScaler SAML configurations, and evidence of targeted denial-of-service attacks.","category":"advisory","primary":true},{"title":"Understanding and Addressing CVE-2026-88779 in Citrix NetScaler ADC and Citrix NetScaler Gateway","url":"https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/","publisher":"citrix","context":"The article references this Citrix security update post for the vendor's statement that repeated triggering can keep services unavailable without an identified customer-data integrity impact.","category":"advisory","primary":false},{"title":"Security Update Guidance for NetScaler SAML Authentication Deployments","url":"http://community.citrix.com/techzone-blogs/110_security-updates/security-update-guidance-for-netscaler-saml-authentication-deployments/","publisher":"citrix","context":"The article cites this Citrix security notice describing a newly observed SAML authentication issue and the affected configuration settings.","category":"advisory","primary":false}],"body":"\u003cp\u003eCitrix released emergency updates for CVE-2026-88779, an actively exploited memory buffer flaw in NetScaler ADC and NetScaler Gateway appliances that use SAML authentication with Gateway or AAA functionality. Citrix assigned the issue a CVSS score of 8.7 and said targeted attacks against unpatched deployments can cause denial-of-service conditions. The company released versions 14.1-73.41 and 13.1-64.28, plus separate FIPS and NDcPP updates, and recommends that affected customers install them as soon as possible.\u003c/p\u003e\n\n\u003cp\u003eCitrix says potentially affected appliances can be identified by SAML service-provider or identity-provider settings, including \u003ccode\u003eadd authentication samlAction\u003c/code\u003e or \u003ccode\u003eadd authentication samlIdPProfile\u003c/code\u003e. Administrators and researchers reported repeated nsaaad crashes, appliance reboots, and crafted authentication usernames containing shell commands intended to download and run a file, although successful execution was not confirmed in one administrator\u0026rsquo;s investigation. Kevin Beaumont reported that a patched honeypot ran a downloaded malware binary, while watchTowr Labs said it reproduced the flaw; CISA added CVE-2026-88779 to its Known Exploited Vulnerabilities catalog and gave FCEB agencies until October 7 to mitigate it.\u003c/p\u003e\n"},{"n":6,"title":"Emerging Threat: (CVE-2026-84411) MikroTik RouterOS Unauthenticated Root RCE via Web Management","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-84411-mikrotik-routeros-unauthenticated-root-rce-via-web-management/","time":"19:26","priority":"MUST READ","score":93,"tldr":"CVE-2026-84411 is a critical, unauthenticated root remote-code-execution flaw in MikroTik RouterOS WebFig affecting all versions before 7.24. Organizations should urgently upgrade to RouterOS 7.24 or disable and restrict internet access to the www and www-ssl management services, especially for unsupported 6.x devices.","briefOverview":"\u003cp\u003eCVE-2026-84411 is a critical integer-underflow flaw in MikroTik RouterOS web management that can be reached before authentication. A crafted HTTP request can allow a network attacker to run arbitrary code as root or crash the device, without credentials, a session, or a second exploit stage. The affected WebFig services use TCP/80 for \u003ccode\u003ewww\u003c/code\u003e and TCP/443 for \u003ccode\u003ewww-ssl\u003c/code\u003e, and the issue has a CVSS v3.1 score of 9.8.\u003c/p\u003e\n\n\u003cp\u003eAll RouterOS versions below 7.24 are affected, including the entire 6.x line and 7.x releases through 7.23.x; MikroTik fixed the flaw in RouterOS 7.24. Internet-facing routers, switches, and wireless access points are particularly exposed because the web-management services are enabled by default, and these devices are often deployed at branches, retail sites, hotels, industrial locations, and service-provider networks. The article recommends upgrading where possible, disabling or restricting \u003ccode\u003ewww\u003c/code\u003e and \u003ccode\u003ewww-ssl\u003c/code\u003e until patching is confirmed, and auditing previously exposed devices for unauthorized scripts, scheduled tasks, accounts, and firewall-rule changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-84411 is a critical integer-underflow flaw in MikroTik RouterOS web management that can allow an unauthenticated network attacker to execute code as root or crash an affected device.","All RouterOS versions below 7.24, including the entire 6.x line and 7.x releases through 7.23.x, are affected; MikroTik fixed the issue in RouterOS 7.24.","The vulnerable WebFig management services listen on TCP/80 for www and TCP/443 for www-ssl and are enabled by default.","CISA published an ICS advisory on October 2, 2026, and neither CISA nor MikroTik had reported confirmed exploitation in the wild or a confirmed public proof of concept at the time of writing.","Until updates are confirmed, the article recommends disabling or restricting the www and www-ssl management services, blocking their public access, and reviewing exposed devices for unauthorized scripts, scheduled tasks, accounts, and firewall-rule changes."],"insights":["RouterOS devices can expose their running version through several services, allowing both defenders and attackers to distinguish affected devices from patched ones without logging in.","For the roughly two-fifths of observed assets with a confirmed version, every identified device was running a version below 7.24; no patched device appeared in that subset.","Organizations using RouterOS 6.x cannot apply a same-version fix, so they must migrate to 7.x, replace unsupported hardware, or remove web management from internet access.","MikroTik devices are often managed by local integrators or ISPs rather than the organizations relying on them, so remediation should be requested and verified per device instead of assumed from a completed ticket.","The article attributes concentrated exposure in large retail, hospitality, logistics, and similar estates to operating models with many small physical sites and locally acquired networking hardware."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-84411 is a critical integer-underflow flaw in MikroTik RouterOS web management that can be reached before authentication. A crafted HTTP request can allow a network attacker to run arbitrary code as root or crash the device, without credentials, a session, or a second exploit stage. The affected WebFig services use TCP/80 for \u003ccode\u003ewww\u003c/code\u003e and TCP/443 for \u003ccode\u003ewww-ssl\u003c/code\u003e, and the issue has a CVSS v3.1 score of 9.8.\u003c/p\u003e\n\n\u003cp\u003eAll RouterOS versions below 7.24 are affected, including the entire 6.x line and 7.x releases through 7.23.x; MikroTik fixed the flaw in RouterOS 7.24. Internet-facing routers, switches, and wireless access points are particularly exposed because the web-management services are enabled by default, and these devices are often deployed at branches, retail sites, hotels, industrial locations, and service-provider networks. The article recommends upgrading where possible, disabling or restricting \u003ccode\u003ewww\u003c/code\u003e and \u003ccode\u003ewww-ssl\u003c/code\u003e until patching is confirmed, and auditing previously exposed devices for unauthorized scripts, scheduled tasks, accounts, and firewall-rule changes.\u003c/p\u003e\n"},{"n":3,"title":"ShinyHunters Suspect Rey Reportedly Detained in Jordan, Helping FBI Identify Group Members","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/shinyhunters-suspect-rey-reportedly.html","time":"07:22","priority":"SHOULD READ","score":84,"tldr":"Jordanian authorities reportedly detained alleged ShinyHunters member Saif al-Din Khader (“Rey”), who is said to be cooperating with the FBI to identify other members of the extortion group. The arrest may generate further leads and arrests amid an ongoing international investigation into ShinyHunters’ large-scale breaches and extortion activity.","briefOverview":"\u003cp\u003eJordanian authorities reportedly detained Saif al-Din Khader, an alleged ShinyHunters member known online as “Rey” or “ReyXBF,” on September 29, 2026. Reuters, citing sources familiar with the matter, reported that he is cooperating with the FBI and other law-enforcement agencies to identify additional group members. Khader had previously been identified as an administrator associated with Hellcat’s data-leak site, BreachForums, and Scattered LAPSUS\u003cspan class=\"math inline\"\u003e\\( Hunters, an alleged combination of Scattered Spider, LAPSUS\\)\u003c/span\u003e, and ShinyHunters.\u003c/p\u003e\n\n\u003cp\u003eThe detention follows the recent arrest of a 24-year-old man in Amsterdam in connection with ShinyHunters’ operations, and the FBI has said more arrests may follow. The FBI alleges that the group and its co-conspirators breached more than 140 organizations since the prior year and received at least $70 million in extortion payments, often by targeting third-party cloud-platform providers and threatening to publish stolen data. Recent allegations involving the group include taking over Cl0p’s darknet site through an unpatched Grav CMS flaw and stealing roughly three terabytes of data from the FBI’s apply.fbijobs[.]gov portal.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jordanian authorities reportedly detained Saif al-Din Khader, an alleged ShinyHunters member known online as “Rey,” on September 29, 2026.","Reuters reported that Khader is cooperating with the FBI and other law-enforcement agencies to identify other members of ShinyHunters.","ShinyHunters has been linked to the Scattered LAPSUS$ Hunters group, described as an amalgamation of Scattered Spider, LAPSUS$, and ShinyHunters.","The FBI said the group and its alleged co-conspirators breached more than 140 organizations since the previous year and received at least $70 million in extortion payments.","The case follows the recent arrest in Amsterdam of a 24-year-old man in connection with ShinyHunters’ cyber operations."],"insights":["ShinyHunters is described by researchers as a durable brand and operating model rather than a single fixed group, allowing it to persist through arrests, indictments, and seized online forums.","The group allegedly relies on a division of labor in which social engineers obtain initial access, adjacent actors help recruit and amplify activity, and a shared brand is used to monetize stolen data.","According to the FBI, the group often targets third-party providers of cloud-based platforms, meaning a compromise at one provider can expose sensitive data belonging to multiple organizations.","ShinyHunters said its alleged theft of roughly three terabytes of data from an FBI jobs portal was intended to pressure the FBI to change what it called false claims about the group, rather than to obtain money.","Khader reportedly told journalist Brian Krebs that he had been cooperating with law enforcement since at least June 2025, before his reported detention in Jordan."],"referencedReports":[{"title":"Gainsight Expands Impacted Customer List","url":"https://thehackernews.com/2025/11/gainsight-expands-impacted-customer.html","publisher":"the-hacker-news","context":"The article cites this November 2025 report as the source in which journalist Brian Krebs identified Rey as one of three administrators of Scattered LAPSUS$ Hunters.","category":"news","primary":false},{"title":"Gotta Breach ’Em All: The Journey of ShinyHunters","url":"https://www.sekoia.com/blog/gotta-breach-em-all-the-journey-of-shinyhunters","publisher":"sekoia-and-beazley-security","context":"The article cites this deep-dive analysis for its account of ShinyHunters’ origins, evolution, and modular operating model.","category":"research","primary":false}],"body":"\u003cp\u003eJordanian authorities reportedly detained Saif al-Din Khader, an alleged ShinyHunters member known online as “Rey” or “ReyXBF,” on September 29, 2026. Reuters, citing sources familiar with the matter, reported that he is cooperating with the FBI and other law-enforcement agencies to identify additional group members. Khader had previously been identified as an administrator associated with Hellcat’s data-leak site, BreachForums, and Scattered LAPSUS\u003cspan class=\"math inline\"\u003e\\( Hunters, an alleged combination of Scattered Spider, LAPSUS\\)\u003c/span\u003e, and ShinyHunters.\u003c/p\u003e\n\n\u003cp\u003eThe detention follows the recent arrest of a 24-year-old man in Amsterdam in connection with ShinyHunters’ operations, and the FBI has said more arrests may follow. The FBI alleges that the group and its co-conspirators breached more than 140 organizations since the prior year and received at least $70 million in extortion payments, often by targeting third-party cloud-platform providers and threatening to publish stolen data. Recent allegations involving the group include taking over Cl0p’s darknet site through an unpatched Grav CMS flaw and stealing roughly three terabytes of data from the FBI’s apply.fbijobs[.]gov portal.\u003c/p\u003e\n"},{"n":4,"title":"China-Aligned TA419 Targets U.S. AI Policy Experts With Microsoft AitM Phishing","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/china-aligned-ta419-targets-us-ai.html","time":"07:20","priority":"SHOULD READ","score":82,"tldr":"China-aligned espionage group TA419 is targeting U.S. AI policy experts with convincing Microsoft credential-phishing campaigns that use adversary-in-the-middle proxies and Frameless Browser-in-the-Browser pages to steal session cookies. Organizations should deploy phishing-resistant authentication such as passkeys and verify unsolicited professional outreach.","briefOverview":"\u003cp\u003eProofpoint attributed several credential-phishing campaigns against U.S. artificial-intelligence policy experts to the China-aligned, espionage-motivated group TA419. The group has targeted individuals at U.S. think tanks, universities, and legal organizations, impersonating prominent economists, AI policymakers, an Anthropic employee, and a former White House science and technology policy official. One February 2026 message used the subject line “Request for Feedback on Military Integration of Claude.” Proofpoint said the activity likely supports Chinese intelligence objectives to understand developments in U.S. AI policy and regulation.\u003c/p\u003e\n\n\u003cp\u003eTA419 begins with seemingly harmless invitations intended to establish trust and sends a shortened link only after a recipient responds. The link redirects through a Cloudflare Turnstile check to a fake OneDrive sign-in page that uses a frameless Browser-in-the-Browser technique to mimic a trusted login window. A customized adversary-in-the-middle proxy tracks the Microsoft sign-in process, relays it to real Microsoft infrastructure, and captures credentials and session cookies while making the login appear successful. Proofpoint recommends phishing-resistant authentication such as passkeys and advises recipients to verify unsolicited subject-matter outreach before proceeding.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Proofpoint attributed credential-phishing campaigns targeting U.S. AI policy experts to the China-aligned, espionage-motivated threat actor TA419.","TA419 impersonated economists, AI policymakers, an Anthropic employee, and a former White House science and technology policy official to build trust with targets.","After a target responds to an initial outreach email, TA419 sends a shortened link that redirects through a Cloudflare Turnstile check to a fake OneDrive sign-in page.","The phishing pages use a frameless Browser-in-the-Browser technique and an adversary-in-the-middle proxy to capture Microsoft credentials and session cookies while relaying the login to legitimate Microsoft infrastructure.","Proofpoint recommends phishing-resistant authentication methods such as passkeys and cautions targets to verify unsolicited subject-matter outreach before proceeding."],"insights":["TA419 waits for a recipient to respond to a seemingly harmless invitation before sending the phishing link, using the interaction to establish trust before attempting credential theft.","The fake sign-in process can appear successful to the victim because the attackers relay the login to real Microsoft infrastructure while secretly capturing session cookies.","TA419’s use of Frameless Browser-in-the-Browser pages avoids the iframe-based approach normally associated with this type of fake login window.","The campaign’s focus on AI policy specialists is described as an expansion of TA419’s existing interest in defense, national security, energy, international relations, and foreign policy targets connected to the United States and Japan."],"referencedReports":[{"title":"Hallucinating Credibility: China-Aligned TA419 Impersonates Its Way into U.S. AI Policy","url":"https://www.proofpoint.com/us/blog/threat-insight/hallucinating-credibility-china-aligned-ta419-impersonates-its-way-us-ai-policy","publisher":"proofpoint","context":"The article relies on Proofpoint's technical analysis attributing the credential-phishing campaigns against U.S. AI policy experts to TA419.","category":"research","primary":true}],"body":"\u003cp\u003eProofpoint attributed several credential-phishing campaigns against U.S. artificial-intelligence policy experts to the China-aligned, espionage-motivated group TA419. The group has targeted individuals at U.S. think tanks, universities, and legal organizations, impersonating prominent economists, AI policymakers, an Anthropic employee, and a former White House science and technology policy official. One February 2026 message used the subject line “Request for Feedback on Military Integration of Claude.” Proofpoint said the activity likely supports Chinese intelligence objectives to understand developments in U.S. AI policy and regulation.\u003c/p\u003e\n\n\u003cp\u003eTA419 begins with seemingly harmless invitations intended to establish trust and sends a shortened link only after a recipient responds. The link redirects through a Cloudflare Turnstile check to a fake OneDrive sign-in page that uses a frameless Browser-in-the-Browser technique to mimic a trusted login window. A customized adversary-in-the-middle proxy tracks the Microsoft sign-in process, relays it to real Microsoft infrastructure, and captures credentials and session cookies while making the login appear successful. Proofpoint recommends phishing-resistant authentication such as passkeys and advises recipients to verify unsolicited subject-matter outreach before proceeding.\u003c/p\u003e\n"},{"n":5,"title":"The Sender Domain You Never Audit Is Your Own","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/own-domain-sender-history-reveals-self-spoof-identity-rotation","time":"11:00","priority":"MAY READ","score":68,"tldr":"A UK property consultancy was targeted by a sustained self-spoofing phishing campaign that rotated through employees’ identities and used bodyless Word attachments containing QR codes to evade conventional email inspection. The key defensive lesson is to audit your own domain’s sender history and correlate structural signals—such as external self-addressed mail and attachment-only MIME messages—rather than relying on individual sender blocks, payload verdicts, or authentication alone.","briefOverview":"\u003cp\u003eA UK property consultancy found 15 incidents when it queried its own domain as though it were an external sender. Ten were automatically resolved phishing incidents involving self-spoofed employee identities between May and August 2026, rotating across eight mailboxes. The messages used varied HR and payroll pretexts, so each individual impersonated sender appeared to be a first occurrence.\u003c/p\u003e\n\n\u003cp\u003eThe worked example was a self-addressed spoof email with no message body, where the entire top-level MIME entity was a Word document attachment. The document contained two QR codes that decoded to the same URL on a Brazilian website path, ending with the recipient’s corporate email address in cleartext. SPF, DKIM, and DMARC checks failed at the real sending hop, but the message still reached the mailbox, while the attachment and QR-derived links received clean automated verdicts. The article argues that grouping messages by claimed domain and examining structural signals, including externally originated self-addressed mail and attachment-only messages, can reveal campaigns that sender blocks, content checks, and reputation scoring may not aggregate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A sender-history query for the UK property consultancy’s own domain found 15 incidents, including 10 automatically resolved phishing incidents involving self-spoofed employee identities between May and August 2026.","The worked example was a self-addressed spoofed email with no message body; its top-level MIME entity was a Word document containing two QR codes that both decoded to the same URL.","The email failed SPF, had no DKIM signature, and failed DMARC at the real sending hop, yet it was still delivered to the recipient’s mailbox.","The campaign rotated through eight distinct real employee mailboxes and used varying HR and payroll-themed subjects, limiting the usefulness of blocking a single spoofed sender or matching one subject line.","The article recommends querying and grouping an organization’s own sender domain by claimed domain and counting distinct impersonated mailboxes to identify aggregate self-spoofing patterns."],"insights":["A message can evade body-focused inspection entirely when the email itself is a Word attachment with no text or HTML message body, making the absence of a body a useful warning sign.","The QR-code destination used a legitimate Brazilian website and was graded clean, illustrating that reputation at a site’s main address may not identify a phishing kit hosted deeper in its directories.","The claimed HELO name of [127.0.0.1] was not evidence of a local sender because the actual peer was a routable ColoCrossing host; the distinction between a claimed hostname and the real connecting IP is important.","Grouping suspicious messages by the claimed company domain, rather than by individual spoofed employee addresses, exposed identity rotation across eight mailboxes that would otherwise appear as unrelated first-time spoofs.","The tenant also had legitimate internal service messages reported as impersonation attempts, showing that real self-spoofs and mistaken reports can coexist within the same internal email namespace without evidence that one caused the other."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s statistics on phishing as an initial access vector and the overall human element in breaches.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references Microsoft’s report as supporting email authentication as a structural phishing defense.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA’s phishing guidance alongside Microsoft’s report in discussing authentication-based defenses.","category":"guide","primary":false}],"body":"\u003cp\u003eA UK property consultancy found 15 incidents when it queried its own domain as though it were an external sender. Ten were automatically resolved phishing incidents involving self-spoofed employee identities between May and August 2026, rotating across eight mailboxes. The messages used varied HR and payroll pretexts, so each individual impersonated sender appeared to be a first occurrence.\u003c/p\u003e\n\n\u003cp\u003eThe worked example was a self-addressed spoof email with no message body, where the entire top-level MIME entity was a Word document attachment. The document contained two QR codes that decoded to the same URL on a Brazilian website path, ending with the recipient’s corporate email address in cleartext. SPF, DKIM, and DMARC checks failed at the real sending hop, but the message still reached the mailbox, while the attachment and QR-derived links received clean automated verdicts. The article argues that grouping messages by claimed domain and examining structural signals, including externally originated self-addressed mail and attachment-only messages, can reveal campaigns that sender blocks, content checks, and reputation scoring may not aggregate.\u003c/p\u003e\n"},{"n":2,"title":"Anthropic asks Claude users to share voice data for AI model training","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-asks-claude-users-to-share-voice-data-for-ai-model-training/","time":"10:53","priority":"MAY READ","score":55,"tldr":"Anthropic is asking Claude voice-feature users to optionally permit use of their audio recordings and voice-chat data for AI training. The setting is off by default and can be changed or deleted later in Claude’s Privacy settings.","briefOverview":"\u003cp\u003eAnthropic has started showing Claude voice-feature users a prompt asking permission to use their voice data to improve its AI models. The prompt says that audio recordings and voice-chat data help Anthropic AI models understand and respond to speech. Users can select either “Allow” or “Not now.”\u003c/p\u003e\n\n\u003cp\u003eVoice-data training is controlled separately from Anthropic’s existing option to use regular chats and Claude Code sessions for model training. This means users can approve voice data while excluding chats and coding sessions, or make the opposite choice. The relevant Settings \u0026gt; Privacy option is described as allowing the use of audio recordings and voice-chat data for approved sessions, is disabled by default in the interface shown, and can later be turned off or deleted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic has started asking Claude voice-feature users for permission to use voice recordings and voice chat data to improve its AI models.","Users can choose “Allow” or “Not now,” and Claude includes a separate voice-data option in Settings \u003e Privacy.","The voice-data training option is separate from Anthropic’s existing settings for using chats and Claude Code sessions for model training.","The voice-data setting shown in the article is disabled by default, and Anthropic says users can turn it off or delete voice data later in settings."],"insights":["Claude treats voice-data training as a separate consent choice from training on text chats and Claude Code sessions, allowing users to permit one type of data use while declining the other.","The voice-data prompt states that both audio recordings and voice-chat data may be used for model improvement, rather than limiting the setting to recordings alone.","Users who previously allow voice-data use can later revoke the setting and delete the related voice data through Claude’s settings."],"referencedReports":[],"body":"\u003cp\u003eAnthropic has started showing Claude voice-feature users a prompt asking permission to use their voice data to improve its AI models. The prompt says that audio recordings and voice-chat data help Anthropic AI models understand and respond to speech. Users can select either “Allow” or “Not now.”\u003c/p\u003e\n\n\u003cp\u003eVoice-data training is controlled separately from Anthropic’s existing option to use regular chats and Claude Code sessions for model training. This means users can approve voice data while excluding chats and coding sessions, or make the opposite choice. The relevant Settings \u0026gt; Privacy option is described as allowing the use of audio recordings and voice-chat data for approved sessions, is disabled by default in the interface shown, and can later be turned off or deleted.\u003c/p\u003e\n"}]</script>
