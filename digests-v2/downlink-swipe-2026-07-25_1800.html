<script type="application/json" id="dl-articles">[{"n":1,"title":"Malvertising Sends Malware in Pieces, Then Makes the Browser Build the Executable","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/malvertising-sends-malware-in-pieces.html","time":"18:48","priority":"SHOULD READ","score":82,"tldr":"The SourTrade malvertising campaign impersonates trading and crypto services and makes victims’ browsers assemble unique Windows executables from pieces, limiting simple hash-based detection. Defenders should focus on the full delivery chain, including cloaked landing pages, /config requests, secondary runtime downloads, and ServiceWorker-based file delivery.","briefOverview":"\u003cp\u003eA malvertising operation called SourTrade is making victims’ browsers assemble the final Windows executable instead of serving one complete malicious file from a fixed URL. Confiant said the campaign has operated since late 2024 and impersonated TradingView, Solana, and Luno to target retail traders and cryptocurrency investors across 12 countries in 25 languages. The landing pages fingerprint visitors, show suspected researchers and bots an empty page, and present selected targets with a convincing copy of the impersonated service.\u003c/p\u003e\n\n\u003cp\u003eThe delivery chain registers a ServiceWorker, builds a SharedWorker from JavaScript embedded in the page, requests a /config response, and retrieves a clean Bun runtime from a secondary domain. The configuration supplies executable structures and malicious JavaScriptCore bytecode, while the worker uses AES-CTR to generate pseudorandom bytes and follows a template to assemble the file from multiple sources. Confiant said each victim can receive a different assembled file because rotating values in the /config response changes the hash while retaining the payload code.\u003c/p\u003e\n\n\u003cp\u003eThe article states that the chain does not rely on a browser vulnerability or remove Mark of the Web, and Confiant’s analysis documents delivery rather than execution inside the browser. The approach limits the value of simple hash-based detections, but the attacker-controlled executable material and bytecode still cross the network. Defenders are advised to examine the full chain, including the ad referral, cloaked landing page, /config request, secondary-domain runtime fetch, and ServiceWorker download.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Confiant said the SourTrade malvertising operation has operated since late 2024 and impersonated TradingView, Solana, and Luno to target retail traders and cryptocurrency investors across 12 countries in 25 languages.","The campaign’s landing pages fingerprint visitors, show suspected researchers and bots an empty page, and serve selected targets a convincing copy of the impersonated service.","The delivery chain registers a ServiceWorker, builds a SharedWorker from JavaScript embedded in the page, requests a /config file, retrieves a clean Bun runtime from a secondary domain, and assembles a Windows executable in the browser from supplied components.","Confiant reported that rotating the seed and size in each /config response can give each victim a different assembled file hash while retaining the executable payload code.","The article states that there is no software patch to apply and that defenders should examine the full chain from ad referral and cloaked landing page through the /config request, secondary-domain runtime fetch, and ServiceWorker download."],"insights":["The campaign’s browser-built executable approach is narrower than it may first appear because the attacker-controlled PE material and bytecode still cross the network in the /config response.","Mark of the Web is not removed, but the recorded download source points to the landing page rather than the secondary domain that supplied the Bun runtime.","The campaign evolved away from loading StreamSaver.js from GitHub Pages while retaining its streaming-download architecture and message names, reducing an external dependency that previously exposed part of the download path.","The article cautions that capabilities documented in earlier related campaigns, such as credential theft and wallet theft, cannot yet be assigned to the current files based on the published evidence."],"referencedReports":[{"title":"SourTrade: Browser-Assembled Malware","url":"https://blog.confiant.com/p/sourtrade-browser-assembled-malware","publisher":"Confiant","context":"The article says Confiant detailed the SourTrade campaign and bases its description of the browser-assembled malware delivery chain on that analysis.","category":"","primary":false},{"title":"The Scam That Won’t Quit: Malicious TradingView Premium Ads Jump from Meta to Google and YouTube","url":"https://www.bitdefender.com/en-us/blog/labs/the-scam-that-wont-quit-malicious-tradingview-premium-ads-jump-from-meta-to-google-and-youtube","publisher":"Bitdefender","context":"The article cites Bitdefender as having documented a related TradingView malvertising cluster in September 2025.","category":"","primary":false},{"title":"JSCEAL Targets Crypto Apps","url":"https://research.checkpoint.com/2025/jsceal-targets-crypto-apps/","publisher":"Check Point Research","context":"The article references Check Point’s tracking of the related campaign’s final payload as the stealer JSCEAL.","category":"","primary":false},{"title":"WeevilProxy","url":"https://www.withsecure.com/en/resources-hub/w-labs/weevilproxy/","publisher":"WithSecure","context":"The article references WithSecure’s tracking of the related campaign’s final payload as WeevilProxy.","category":"","primary":false}],"body":"\u003cp\u003eA malvertising operation called SourTrade is making victims’ browsers assemble the final Windows executable instead of serving one complete malicious file from a fixed URL. Confiant said the campaign has operated since late 2024 and impersonated TradingView, Solana, and Luno to target retail traders and cryptocurrency investors across 12 countries in 25 languages. The landing pages fingerprint visitors, show suspected researchers and bots an empty page, and present selected targets with a convincing copy of the impersonated service.\u003c/p\u003e\n\n\u003cp\u003eThe delivery chain registers a ServiceWorker, builds a SharedWorker from JavaScript embedded in the page, requests a /config response, and retrieves a clean Bun runtime from a secondary domain. The configuration supplies executable structures and malicious JavaScriptCore bytecode, while the worker uses AES-CTR to generate pseudorandom bytes and follows a template to assemble the file from multiple sources. Confiant said each victim can receive a different assembled file because rotating values in the /config response changes the hash while retaining the payload code.\u003c/p\u003e\n\n\u003cp\u003eThe article states that the chain does not rely on a browser vulnerability or remove Mark of the Web, and Confiant’s analysis documents delivery rather than execution inside the browser. The approach limits the value of simple hash-based detections, but the attacker-controlled executable material and bytecode still cross the network. Defenders are advised to examine the full chain, including the ad referral, cloaked landing page, /config request, secondary-domain runtime fetch, and ServiceWorker download.\u003c/p\u003e\n"}]</script>
