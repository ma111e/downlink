<script type="application/json" id="dl-articles">[{"n":1,"title":"CTM360 Exposes Fake Gift Card Scams Exploiting Trusted Brands","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ctm360-exposes-fake-gift-card-scams-exploiting-trusted-brands/","time":"14:10","priority":"MAY READ","score":48,"tldr":"CTM360 reports more than 1,000 fake gift-card campaigns impersonating trusted brands and celebrities to funnel victims through endless “human verification” offers. The scams monetize survey completions, app installs, personal-data collection, and recurring mobile subscriptions while never delivering the promised reward.","briefOverview":"\u003cp\u003eCTM360 identified more than 1,000 incidents involving fake gift-card campaigns that impersonate brands including PlayStation, Sephora, SHEIN, Walmart, and Amazon. The campaigns are distributed through sponsored social-media advertisements, viral giveaway posts, and fabricated endorsements from celebrities or influencers such as MrBeast and Alix Earle. Victims are directed to fraudulent reward portals that use cloned branding, fake participant counts, countdowns, and testimonials to appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eAfter users choose a gift-card amount, the sites simulate generating a card and show a partially masked code before requiring a supposed security or human-verification check. Instead of providing a reward, the process sends victims through repeated surveys, promotional offers, app or browser-extension installations, and paid mobile-subscription flows; CTM360 said no reward was delivered in any tested flow. The operators use affiliate tracking links to tie registrations and completed mobile subscription verifications to their accounts, while victims risk personal-information exposure, unexpected mobile charges, and spam, and impersonated brands face reputational harm.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CTM360 identified more than 1,000 incidents involving fake gift-card campaigns that impersonate brands including PlayStation, Sephora, SHEIN, Walmart, and Amazon.","The campaigns use sponsored social-media ads, viral giveaway posts, and fabricated celebrity or influencer endorsements to lure users to fraudulent reward portals.","The fraudulent sites display cloned branding, fake participant counts, countdown timers, testimonials, and partially masked gift-card codes to make the offers appear legitimate.","Instead of delivering a gift card, the sites send victims through repeated surveys, promotional offers, app or browser-extension installs, and paid mobile-subscription flows.","CTM360 observed affiliate tracking links that connect victim registrations and completed mobile subscription verification to the operators’ affiliate-network accounts, generating commissions for the threat actors."],"insights":["The campaign is designed as an affiliate-revenue operation rather than a traditional credential-stealing scheme, with tracking parameters linking completed victim actions to the operators’ affiliate accounts.","Its modular setup allows operators to rapidly change the impersonated brand, celebrity lure, and domain name without rebuilding the underlying scam process.","The partial gift-card code and scripted “generation” animation are used to create the impression that a reward already exists, making victims more likely to continue to the verification stage.","CTM360 found that completing a requested verification task does not unlock the reward; the site instead marks it incomplete and redirects the victim to another offer."],"referencedReports":[],"body":"\u003cp\u003eCTM360 identified more than 1,000 incidents involving fake gift-card campaigns that impersonate brands including PlayStation, Sephora, SHEIN, Walmart, and Amazon. The campaigns are distributed through sponsored social-media advertisements, viral giveaway posts, and fabricated endorsements from celebrities or influencers such as MrBeast and Alix Earle. Victims are directed to fraudulent reward portals that use cloned branding, fake participant counts, countdowns, and testimonials to appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eAfter users choose a gift-card amount, the sites simulate generating a card and show a partially masked code before requiring a supposed security or human-verification check. Instead of providing a reward, the process sends victims through repeated surveys, promotional offers, app or browser-extension installations, and paid mobile-subscription flows; CTM360 said no reward was delivered in any tested flow. The operators use affiliate tracking links to tie registrations and completed mobile subscription verifications to their accounts, while victims risk personal-information exposure, unexpected mobile charges, and spam, and impersonated brands face reputational harm.\u003c/p\u003e\n"}]</script>
