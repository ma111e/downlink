<script type="application/json" id="dl-articles">[{"n":4,"title":"Urgent Threat Alert: ShinyHunters Vishing Campaigns and Domain Impersonation","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/urgent-threat-alert-shinyhunters-vishing-campaigns-and-domain-impersonation/","time":"16:58","priority":"MUST READ","score":95,"tldr":"Health-ISAC warns that ShinyHunters is actively targeting global healthcare organizations with vishing and lookalike domains to steal SSO credentials and bypass MFA. Organizations should urgently block suspicious .claim/.claims domains, harden MFA and helpdesk workflows, monitor impersonation infrastructure, and restrict access to verified corporate devices.","briefOverview":"\u003cp\u003eHealth-ISAC warns that ShinyHunters is actively targeting the global health sector with persistent, highly targeted vishing campaigns and medical-themed impersonation domains. The campaigns try to trick enterprise personnel into exposing credentials on fake sites that mimic legitimate login pages. Health-ISAC says the group has been successful in several recent cases by bypassing MFA and gaining unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eThe article says the most identifiable domain pattern is the use of company-claims.com or company.claims to impersonate a target company. Actors have contacted employees on personal mobile devices through calls and voicemails, and have also emailed users en masse from multiple random accounts. Recent registrations of medical-themed domains indicate an expanding scope targeting health operations and specialized business units.\u003c/p\u003e\n\n\u003cp\u003eOnce an identity is compromised, ShinyHunters rapidly pivots from the SSO platform into connected SaaS applications such as Microsoft 365, SharePoint, and Salesforce. The article says this enables large-scale data exfiltration and access to internal communications, which supports later extortion demands. Health-ISAC recommends blocking .claim and .claims domains unless legitimate, improving employee training, enforcing device-context verification, adopting phishing-resistant MFA, hardening helpdesk and MFA reset workflows, monitoring lookalike infrastructure, and improving session management.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC warns that ShinyHunters is actively targeting the global health sector with persistent, highly targeted voice phishing campaigns using malicious medical-themed impersonation domains.","The campaigns attempt to trick employees into entering credentials on fake login pages and have succeeded in some recent cases by bypassing multi-factor authentication.","After compromising an identity, the actors rapidly pivot from single sign-on platforms into connected SaaS applications such as Microsoft 365, SharePoint, and Salesforce to exfiltrate data and internal communications.","Observed impersonation domains commonly use the target company’s name followed by patterns such as company-claims.com or company.claims.","Health-ISAC recommends blocking .claim and .claims domains unless legitimate, improving employee awareness, enforcing device-context verification, adopting phishing-resistant MFA, hardening helpdesk and MFA reset workflows, and monitoring lookalike infrastructure."],"insights":["Health-ISAC characterizes ShinyHunters as behaving less like a traditional ransomware group and more like an identity- and SaaS-access extortion operation.","The article identifies the SSO platform as the attackers’ main control point, because one compromised identity can give them access to multiple connected cloud applications.","The campaign’s domain pattern is highly actionable for defenders because impersonation sites often use the target company name followed by endings such as company-claims.com or company.claims.","The actors are instructing victims to use personal devices to navigate to malicious links, which is why the article emphasizes restricting access to corporate-managed devices rather than relying on identity checks alone.","The article says attackers use reverse-proxy phishing kits to relay stolen credentials to the real login portal in real time, then pressure the victim by phone to provide or approve an active MFA step."],"referencedReports":[{"title":"Health Industry Cybersecurity Practices (HICP): Managing Threats and Protecting Patients","url":"https://405d.hhs.gov/cornerstone/hicp","publisher":"405(d) Program / HHS","context":"The article points readers to HICP for more information on managing threats and protecting patients.","category":"guide","primary":false},{"title":"TLP WHITE: ShinyHunters-Linked Social Engineering and Identity Targeting","url":"https://www.aha.org/h-isac-white-reports/2026-08-24-cyber-incidents-tlp-white-shinyhunters-linked-social-engineering-and-identity-targeting","publisher":"American Hospital Association","context":"The article lists this TLP:WHITE report as a reference related to ShinyHunters-linked social engineering and identity targeting.","category":"advisory","primary":false},{"title":"Tracking the Expansion of ShinyHunters-Branded SaaS Data Theft","url":"https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft","publisher":"Google Cloud Threat Intelligence","context":"The article cites this Google Cloud Threat Intelligence analysis as a reference on ShinyHunters-branded SaaS data theft.","category":"research","primary":false}],"body":"\u003cp\u003eHealth-ISAC warns that ShinyHunters is actively targeting the global health sector with persistent, highly targeted vishing campaigns and medical-themed impersonation domains. The campaigns try to trick enterprise personnel into exposing credentials on fake sites that mimic legitimate login pages. Health-ISAC says the group has been successful in several recent cases by bypassing MFA and gaining unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eThe article says the most identifiable domain pattern is the use of company-claims.com or company.claims to impersonate a target company. Actors have contacted employees on personal mobile devices through calls and voicemails, and have also emailed users en masse from multiple random accounts. Recent registrations of medical-themed domains indicate an expanding scope targeting health operations and specialized business units.\u003c/p\u003e\n\n\u003cp\u003eOnce an identity is compromised, ShinyHunters rapidly pivots from the SSO platform into connected SaaS applications such as Microsoft 365, SharePoint, and Salesforce. The article says this enables large-scale data exfiltration and access to internal communications, which supports later extortion demands. Health-ISAC recommends blocking .claim and .claims domains unless legitimate, improving employee training, enforcing device-context verification, adopting phishing-resistant MFA, hardening helpdesk and MFA reset workflows, monitoring lookalike infrastructure, and improving session management.\u003c/p\u003e\n"},{"n":3,"title":"Malware on the Blockchain: An Ongoing Campaign’s New WebRTC Twist","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/malware-on-the-blockchain-an-ongoing-campaigns-new-webrtc-twist","time":"14:05","priority":"MUST READ","score":92,"tldr":"Netskope found an ongoing EtherHiding campaign using BNB Smart Chain testnet contracts to deliver payloads through more than 5,400 compromised small-business websites. A newer variant replaces the usual ClickFix lure with a covert WebRTC data-channel stager that bypasses normal signaling and pulls executable code directly from attacker-controlled infrastructure.","briefOverview":"\u003cp\u003eNetskope observed an EtherHiding campaign affecting more than 5,400 compromised small-business websites across more than 2,200 organizations worldwide. The compromised sites include businesses such as clinics, plumbers, and e-commerce shops, and were most often WordPress and sometimes PrestaShop where individual sites were examined. Each site carried an injected loader, either as an inline script or spoofed package, that called a BNB Smart Chain testnet endpoint and retrieved the next payload from a smart contract.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses the BSC testnet as takedown-resistant payload storage because it behaves like mainnet but uses free testnet BNB from faucets. This lets the operator update a single contract and change what all compromised sites deliver to visitors on the next page load. The common chain delivers a ClickFix overlay that blurs the page behind a fake CAPTCHA and instructs visitors to paste and run a command that downloads and runs the final payload.\u003c/p\u003e\n\n\u003cp\u003eNetskope also found a newer variant that delivers a WebRTC data-channel stager instead of the ClickFix overlay. This script hand-writes its own WebRTC answer using hardcoded connection values, opening an encrypted UDP channel to the cyberattacker without the normal signaling handshake. Once the channel opens, the stager buffers code sent over it and executes the reassembled result in the browser by injecting a script into the page, reusing an existing Content Security Policy nonce when available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope observed more than 5,400 compromised small-business websites making JSON-RPC calls to BNB Smart Chain testnet endpoints to retrieve payloads from a smart contract.","The compromised sites, often WordPress and sometimes PrestaShop, carried an injected loader as either an inline script or a spoofed package, but the initial compromise method is unknown.","The common delivery chain retrieves a second-stage script from the blockchain that displays a ClickFix lure instructing visitors to paste and run a command that downloads the final payload.","A newer variant delivers a WebRTC data-channel stager that hand-writes its own session answer to open an encrypted UDP channel to the attacker without normal signaling traffic.","The WebRTC stager buffers code received from the command channel and executes it in the browser by injecting a script into the page, reusing an existing Content Security Policy nonce when available."],"insights":["Blocking only the primary BSC testnet endpoint is insufficient because Netskope recommends blocking the full BSC-testnet RPC pool for this campaign.","The use of BSC testnet gives the operators mainnet-like smart-contract hosting and takedown resistance without transaction cost because testnet BNB is free from faucets.","The operator can change what all compromised sites deliver by updating a single smart contract, so the same compromised website network can rapidly shift payloads for future visitors.","The WebRTC variant reduces visibility for defenders because it avoids the normal signaling-server exchange while still opening an encrypted channel that HTTP inspection may not see.","Site owners can look for the loader by integrity-checking CMS assets, since Netskope observed it appended to legitimate JavaScript files or placed in fake plugin directories."],"referencedReports":[],"body":"\u003cp\u003eNetskope observed an EtherHiding campaign affecting more than 5,400 compromised small-business websites across more than 2,200 organizations worldwide. The compromised sites include businesses such as clinics, plumbers, and e-commerce shops, and were most often WordPress and sometimes PrestaShop where individual sites were examined. Each site carried an injected loader, either as an inline script or spoofed package, that called a BNB Smart Chain testnet endpoint and retrieved the next payload from a smart contract.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses the BSC testnet as takedown-resistant payload storage because it behaves like mainnet but uses free testnet BNB from faucets. This lets the operator update a single contract and change what all compromised sites deliver to visitors on the next page load. The common chain delivers a ClickFix overlay that blurs the page behind a fake CAPTCHA and instructs visitors to paste and run a command that downloads and runs the final payload.\u003c/p\u003e\n\n\u003cp\u003eNetskope also found a newer variant that delivers a WebRTC data-channel stager instead of the ClickFix overlay. This script hand-writes its own WebRTC answer using hardcoded connection values, opening an encrypted UDP channel to the cyberattacker without the normal signaling handshake. Once the channel opens, the stager buffers code sent over it and executes the reassembled result in the browser by injecting a script into the page, reusing an existing Content Security Policy nonce when available.\u003c/p\u003e\n"},{"n":1,"title":"Modern Adventures in Azure Privilege Escalation","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/modern-adventures-in-azure-privilege-escalation/","time":"16:00","priority":"SHOULD READ","score":82,"tldr":"Azure privilege escalation analysis should focus on individual RBAC permissions and ABAC conditions, not just role names, because built-in and custom roles can hide dangerous paths. Using this approach, the researchers found and Microsoft fixed a built-in Anyscale role that could allow escalation to Owner via unconstrained role assignments.","briefOverview":"\u003cp\u003eThe article examines Azure privilege escalation by focusing on Azure RBAC permissions, ABAC conditions, and how individual permissions can reveal attack paths in built-in and custom roles. It notes that Azure had grown to more than 200 services, 897 built-in RBAC roles, and 22,018 permissions as of June 2026, increasing the attack surface. The author argues that reviewing permissions directly provides a more complete view than reviewing only role names.\u003c/p\u003e\n\n\u003cp\u003eA major focus is Azure ABAC, which Microsoft uses in built-in roles to constrain sensitive actions such as \u003ccode\u003eMicrosoft.Authorization/roleAssignments/write\u003c/code\u003e. The article explains that these conditions can limit which roles may be assigned, but also shows that a portal-recommended condition for Owner or User Access Administrator can be bypassed by creating and assigning a custom role because it does not constrain \u003ccode\u003eMicrosoft.Authorization/roleDefinitions/write\u003c/code\u003e. The article also describes privilege escalation categories such as direct RBAC escalation, managed identity access, secrets access, and dependent service control.\u003c/p\u003e\n\n\u003cp\u003eThe researchers used the 2023-07-01-preview version of the Azure Role Definitions List API to map specific permissions to roles, including permissions such as \u003ccode\u003eMicrosoft.Storage/storageAccounts/listkeys/action\u003c/code\u003e. This process led them to identify the built-in Anyscale Platform Administrator Role as allowing unconstrained role assignment write and delete permissions, making it equivalent in that respect to highly privileged roles like Owner, User Access Administrator, and Role Based Access Control Administrator. Microsoft removed those role assignment permissions after the issue was reported to MSRC.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Azure’s growth to more than 200 services, 897 built-in RBAC roles, and 22,018 permissions has expanded the Azure attack surface and made privilege escalation mapping more complex.","The article argues that reviewing individual Azure RBAC permissions, along with ABAC conditions, gives a more thorough view of privilege escalation paths than reviewing role names alone.","Azure ABAC conditions are used heavily in built-in roles, especially around Microsoft.Authorization/roleAssignments/write, to constrain which role assignments a principal can create or delete.","The 2023-07-01-preview version of the Azure Role Definitions List API can filter roles by specified permissions and help map dangerous permissions to built-in and custom roles.","The researchers found that the built-in Anyscale Platform Administrator Role had unconstrained role assignment write and delete permissions, and Microsoft later removed those permissions after the issue was reported to MSRC."],"insights":["Microsoft’s portal-recommended condition for limiting Owner or User Access Administrator role assignment can still be bypassed because it blocks only specific privileged role IDs and does not constrain permissions such as Microsoft.Authorization/roleDefinitions/write.","A role that appears service-specific can have tenant-wide security impact if it includes Microsoft.Authorization/roleAssignments/write without ABAC constraints, as shown by the Anyscale Platform Administrator Role.","Control-plane permissions can sometimes provide data-plane access, such as Microsoft.Storage/storageAccounts/listkeys/action granting access to Storage Account shared access keys and therefore full data access to Blob Storage and File Shares.","Roles that administrators may not expect to grant Storage Account data access, including Azure AI Administrator, Log Analytics Contributor, and Virtual Machine Contributor, contain Microsoft.Storage/storageAccounts/listkeys/action.","The undocumented 2023-07-01-preview Role Definitions List API reduces the need for manual wildcard and NotActions resolution when identifying roles that contain specific permissions."],"referencedReports":[{"title":"Abusing Azure Container Registry Tasks","url":"https://medium.com/specter-ops-posts/abusing-azure-container-registry-tasks-1f407bfaa465","publisher":"SpecterOps","context":"The article lists this as prior Azure privilege escalation research by Andy Robbins.","category":"research","primary":false},{"title":"Managed Identity Attack Paths, Part 1: Automation Accounts","url":"https://medium.com/specter-ops-posts/managed-identity-attack-paths-part-1-automation-accounts-82667d17187a","publisher":"SpecterOps","context":"The article lists this as prior research on Azure managed identity attack paths by Andy Robbins.","category":"research","primary":false},{"title":"Managed Identity Attack Paths, Part 2: Logic Apps","url":"https://medium.com/specter-ops-posts/managed-identity-attack-paths-part-2-logic-apps-52b29354fc54","publisher":"SpecterOps","context":"The article lists this as prior research on Azure managed identity attack paths by Andy Robbins.","category":"research","primary":false},{"title":"Managed Identity Attack Paths, Part 3: Function Apps","url":"https://medium.com/specter-ops-posts/managed-identity-attack-paths-part-3-function-apps-300065251cbe","publisher":"SpecterOps","context":"The article lists this as prior research on Azure managed identity attack paths by Andy Robbins.","category":"research","primary":false},{"title":"Abusing Azure App Service Managed Identity Assignments","url":"https://medium.com/specter-ops-posts/abusing-azure-app-service-managed-identity-assignments-c3adefccff95","publisher":"SpecterOps","context":"The article cites this as previous research on managed identity abuse in Azure App Service.","category":"research","primary":false},{"title":"Azure Key Vault Tradecraft with BARK","url":"https://medium.com/specter-ops-posts/azure-key-vault-tradecraft-with-bark-24163abc8de3","publisher":"SpecterOps","context":"The article lists this as prior Azure Key Vault research by Andy Robbins.","category":"research","primary":false},{"title":"Azure Storage Account Attack and Detection","url":"https://hausec.com/2025/12/15/azure-storage-account-attack-and-detection/","publisher":"Hausec","context":"The article lists this as previous Azure Storage Account attack and detection research by Ryan Hausknecht.","category":"research","primary":false},{"title":"Azure Threat Research Matrix","url":"https://microsoft.github.io/Azure-Threat-Research-Matrix/","publisher":"Microsoft","context":"The article references this as Ryan Hausknecht’s matrix mapping Azure-specific techniques to MITRE ATT\u0026CK-like categories.","category":"research","primary":false},{"title":"Azure Virtual Machine Execution Techniques","url":"https://hausec.com/2022/05/04/azure-virtual-machine-execution-techniques/","publisher":"Hausec","context":"The article lists this as prior research on Azure virtual machine execution techniques by Ryan Hausknecht.","category":"research","primary":false},{"title":"Escalating Privileges to Read Secrets with Azure Key Vault Access Policies","url":"https://securitylabs.datadoghq.com/articles/escalating-privileges-to-read-secrets-with-azure-key-vault-access-policies/","publisher":"Datadog Security Labs","context":"The article lists this as prior research by Katie Knowles on Azure secrets access and Key Vault access policy abuse.","category":"research","primary":false},{"title":"Introducing Pathfinding Labs","url":"https://securitylabs.datadoghq.com/articles/introducing-pathfinding-labs/","publisher":"Datadog Security Labs","context":"The article references Seth Art’s pathfinding.cloud work and links this related Datadog Security Labs article.","category":"research","primary":false},{"title":"Identifying Novel Privilege Escalation Vectors in AWS with AI","url":"https://www.youtube.com/watch?v=y7ANSpQYD-g","publisher":"fwd:cloudsec NA","context":"The article says its privilege escalation categories were inspired by Seth Art’s talk at fwd:cloudsec NA.","category":"research","primary":false}],"body":"\u003cp\u003eThe article examines Azure privilege escalation by focusing on Azure RBAC permissions, ABAC conditions, and how individual permissions can reveal attack paths in built-in and custom roles. It notes that Azure had grown to more than 200 services, 897 built-in RBAC roles, and 22,018 permissions as of June 2026, increasing the attack surface. The author argues that reviewing permissions directly provides a more complete view than reviewing only role names.\u003c/p\u003e\n\n\u003cp\u003eA major focus is Azure ABAC, which Microsoft uses in built-in roles to constrain sensitive actions such as \u003ccode\u003eMicrosoft.Authorization/roleAssignments/write\u003c/code\u003e. The article explains that these conditions can limit which roles may be assigned, but also shows that a portal-recommended condition for Owner or User Access Administrator can be bypassed by creating and assigning a custom role because it does not constrain \u003ccode\u003eMicrosoft.Authorization/roleDefinitions/write\u003c/code\u003e. The article also describes privilege escalation categories such as direct RBAC escalation, managed identity access, secrets access, and dependent service control.\u003c/p\u003e\n\n\u003cp\u003eThe researchers used the 2023-07-01-preview version of the Azure Role Definitions List API to map specific permissions to roles, including permissions such as \u003ccode\u003eMicrosoft.Storage/storageAccounts/listkeys/action\u003c/code\u003e. This process led them to identify the built-in Anyscale Platform Administrator Role as allowing unconstrained role assignment write and delete permissions, making it equivalent in that respect to highly privileged roles like Owner, User Access Administrator, and Role Based Access Control Administrator. Microsoft removed those role assignment permissions after the issue was reported to MSRC.\u003c/p\u003e\n"},{"n":2,"title":"MECCHA CHAMELEON can't hide from the RCE","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/meccha-chameleon-rce","time":"18:00","priority":"MAY READ","score":72,"tldr":"Researchers found that malicious MECCHA CHAMELEON custom maps could abuse Unreal Engine audio recording functions to write attacker-controlled files to a victim’s Windows Startup folder, enabling delayed remote code execution after reboot. The issue was reported to the developers and patched in version 4.0.0.","briefOverview":"\u003cp\u003eResearchers found a delayed remote code execution issue in MECCHA CHAMELEON involving attacker-made custom maps. When a victim played on an attacker’s map, the map could abuse an exposed Unreal Engine function to write files to arbitrary locations on the victim’s system. The issue was reported to the game’s maintainers and fixed in the 4.0.0 update, which is automatically installed before launching the game.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that MECCHA CHAMELEON maps can contain Unreal Engine Blueprints, which are visual scripts that run inside the game process when a map loads. Because lobby hosts can pick a custom map and prompt other players to download it, community maps became an important attack surface. The researchers searched Blueprint-callable functions and focused on ones that interacted with the operating system, eventually identifying the audio recording function Finish Recording Output.\u003c/p\u003e\n\n\u003cp\u003eThe proof of concept used audio recording to create a file in the Windows Startup folder, then used a null character in the filename to bypass Unreal Engine’s automatic .wav suffix. Because the written file contained WAV data rather than a normal executable, the researchers embedded an HTA payload inside uncompressed PCM audio samples so mshta.exe would run the script despite the WAV header. The patched version prevents StopRecordingOutput from creating files, and the researchers said they found no Steam Workshop maps already exploiting the issue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found that MECCHA CHAMELEON custom maps could abuse the exposed Unreal Engine function StopRecordingOutput to write files to arbitrary locations on a victim’s filesystem.","The attack worked because maps can contain Unreal Engine Blueprints that run inside the MECCHA CHAMELEON process when a map is loaded.","The proof of concept wrote a file into the Windows Startup folder so it would execute after the victim’s system restarted.","The researchers used a null character in the filename to bypass Unreal Engine’s automatic .wav suffix and created an HTA payload inside an uncompressed PCM WAV recording.","The developers fixed the vulnerability in MECCHA CHAMELEON 4.0.0 by preventing StopRecordingOutput from creating files, and the update is installed automatically before launching the game."],"insights":["The attack surface came from a legitimate convenience feature: lobby hosts can pressure all players to download the selected community map before a match starts.","A function intended for saving audio became dangerous because it accepted attacker-controlled paths and ran with the player’s normal filesystem permissions.","The proof of concept depended on a mismatch between Unreal Engine’s simple string handling and Windows path interpretation, where a null character could cause the added .wav suffix to be ignored.","The researchers avoided needing a normal Windows executable by using an HTA file, because mshta.exe would ignore the WAV header bytes and still run the embedded script.","The patch removed file creation from StopRecordingOutput entirely, showing that the maintainers chose to eliminate the risky capability rather than only filter specific malicious paths or filenames."],"referencedReports":[{"title":"Prior MECCHA CHAMELEON RCE upon map load","url":"https://khaelkugler.com/blogs/meccha_chameleon.html","publisher":"khaelkugler.com","context":"The article says MECCHA CHAMELEON previously had an RCE upon map load, as detailed in this linked blog post.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers found a delayed remote code execution issue in MECCHA CHAMELEON involving attacker-made custom maps. When a victim played on an attacker’s map, the map could abuse an exposed Unreal Engine function to write files to arbitrary locations on the victim’s system. The issue was reported to the game’s maintainers and fixed in the 4.0.0 update, which is automatically installed before launching the game.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that MECCHA CHAMELEON maps can contain Unreal Engine Blueprints, which are visual scripts that run inside the game process when a map loads. Because lobby hosts can pick a custom map and prompt other players to download it, community maps became an important attack surface. The researchers searched Blueprint-callable functions and focused on ones that interacted with the operating system, eventually identifying the audio recording function Finish Recording Output.\u003c/p\u003e\n\n\u003cp\u003eThe proof of concept used audio recording to create a file in the Windows Startup folder, then used a null character in the filename to bypass Unreal Engine’s automatic .wav suffix. Because the written file contained WAV data rather than a normal executable, the researchers embedded an HTA payload inside uncompressed PCM audio samples so mshta.exe would run the script despite the WAV header. The patched version prevents StopRecordingOutput from creating files, and the researchers said they found no Steam Workshop maps already exploiting the issue.\u003c/p\u003e\n"}]</script>
