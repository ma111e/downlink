MONAI Label that threat actors used to gain root access.","The briefing includes a report that two people were arrested in connection with a business email compromise scheme that defrauded a hospital of $196,000.","Microsoft Entra Connect Health is included in the briefing because a flaw was exploited to steal tenant data.","The briefing reports that threat actors exploited a GL.iNet Cloud flaw to infect routers and KVM devices.","WhatsApp patched three security flaws, including an Android issue suspected of being used in scams."],"insights":["The briefing groups threats to identity accounts, cloud-connected infrastructure, mobile messaging, and healthcare operations in a single health-sector-focused update, showing that the reported risks span several different kinds of systems.","The reported hospital email-fraud case resulted in a stated loss of $196,000 and arrests of two people, making it a concrete example of financial harm linked to compromised business communications.","The MONAI Label issue is especially notable because the article describes it as a zero-day that was used to obtain root access, meaning the reported outcome was full administrative control rather than limited access.","The GL.iNet report involves both routers and KVM devices, indicating that the cited cloud flaw was associated with infection of more than one device type."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 23, 2026, compiles open-source reporting on several security issues relevant to health-sector defenders. The briefing includes the GoodGuys phishing campaign, a business email compromise case involving a hospital, and exploitation of a MONAI Label zero-day. It also covers Microsoft tenant-data exposure, compromised GL.iNet devices, WhatsApp security fixes, and proposed U.S. Internet-of-Things labeling rules.\u003c/p\u003e\n\n\u003cp\u003eThe MONAI Label item reports that threat actors used AI agents to find and exploit a zero-day to gain root access. Another linked report says two people were arrested over a business email compromise scheme that defrauded a North Carolina hospital of $196,000. The briefing further highlights exploitation of a Microsoft Entra Connect Health flaw to steal tenant data and a GL.iNet Cloud flaw used to infect routers and KVM devices.\u003c/p\u003e\n\n\u003cp\u003eWhatsApp patched three security flaws, including an Android issue suspected of use in scams. The Federal Communications Commission is also considering regulations for its Cyber Trust Mark Internet-of-Things labeling program. Health-ISAC states that its daily headlines are produced by its Threat Operations Center to provide rapid threat intelligence and situational awareness for health-sector defenders.\u003c/p\u003e\n"},{"n":30,"title":"OMB M-26-14: Network Evidence for Federal Agencies | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/slug-omb-m-26-14-network-evidence","time":"17:50","priority":"MAY READ","score":35,"tldr":"Corelight promotes network evidence capabilities as a way for U.S. federal agencies to meet OMB M-26-14 requirements for improved cyber incident detection, investigation, and response.","briefOverview":"\u003cp\u003eThe article is titled “OMB M-26-14: Network Evidence for Federal Agencies” and is associated with Corelight. Its available content identifies OMB M-26-14, network evidence, and federal agencies as the central subjects. The article text provided does not contain readable details about a specific event or implementation.\u003c/p\u003e\n\n\u003cp\u003eBased on the title, the article concerns network evidence in the context of federal agencies and OMB M-26-14. No readable technical details, affected organizations, outcomes, or impacts are present in the supplied article content. As a result, the article’s specific significance cannot be summarized further from the available text.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"OMB M-26-14: Network Evidence for Federal Agencies.\"","The article concerns OMB M-26-14.","The article associates network evidence with federal agencies.","Corelight is identified in the article title."],"insights":["The article explicitly connects network evidence to OMB M-26-14, indicating that the subject is framed around a specific federal directive rather than general security practices.","Corelight is named in the article title, indicating that the company is central to the article’s presentation of network evidence for federal agencies."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “OMB M-26-14: Network Evidence for Federal Agencies” and is associated with Corelight. Its available content identifies OMB M-26-14, network evidence, and federal agencies as the central subjects. The article text provided does not contain readable details about a specific event or implementation.\u003c/p\u003e\n\n\u003cp\u003eBased on the title, the article concerns network evidence in the context of federal agencies and OMB M-26-14. No readable technical details, affected organizations, outcomes, or impacts are present in the supplied article content. As a result, the article’s specific significance cannot be summarized further from the available text.\u003c/p\u003e\n"},{"n":5,"title":"Microsoft testing fix for Windows 11 Bluetooth audio quality drops","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-testing-fix-for-windows-11-bluetooth-audio-quality-drops/","time":"13:28","priority":"MAY READ","score":28,"tldr":"Microsoft is testing a Windows 11 fix that lets compatible Bluetooth LE Audio headsets maintain full-quality stereo sound while their microphone is active, addressing the long-standing drop to low-quality hands-free audio.","briefOverview":"\u003cp\u003eMicrosoft is testing a Windows 11 fix for Bluetooth audio quality drops that occur when a headset microphone becomes active. The problem happens when Windows switches from the high-quality stereo headphone mode to a lower-quality hands-free mode for two-way audio. The new capability is available in preview builds released to Windows Insiders in the Beta and Experimental channels.\u003c/p\u003e\n\n\u003cp\u003eCompatible Bluetooth LE Audio devices can retain full-range stereo audio while their microphone is in use for game chat, voice calls, voice typing, or Copilot Chat. On PCs that support Super Wideband Stereo, users can select a new 2-channel, 16-bit, 48 kHz format in Windows sound settings when the microphone is active. Microsoft says the feature applies to Bluetooth LE Audio headphones, earbuds, and speakers that support 48 kHz playback.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is testing a Windows 11 fix for Bluetooth audio quality drops that occur when an app or game activates a headset microphone.","The issue occurs when Windows switches from the stereo headphone profile to a hands-free profile with lower audio quality because two-way Bluetooth audio has limited bandwidth.","Windows 11 Insiders using compatible Bluetooth LE Audio devices can now retain full-range stereo playback while using the device microphone.","Users with a PC supporting Super Wideband Stereo can select a 2-channel, 16-bit, 48 kHz audio format while the microphone is active.","The feature is available in preview builds for the Beta and Experimental channels and requires Bluetooth LE Audio devices that support 48 kHz playback."],"insights":["The improved experience depends on both a compatible Bluetooth LE Audio device and a PC that supports Super Wideband Stereo, so not every Windows 11 Bluetooth headset setup will gain the new format option.","Compatible users can manually select a 2-channel, 16-bit, 48 kHz format in Windows sound settings for use while the microphone is active.","The feature is being tested in Windows 11 Beta and Experimental preview builds rather than being described as generally available.","Microsoft says the capability applies to Bluetooth LE Audio headphones, earbuds, and speakers that support 48 kHz playback."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is testing a Windows 11 fix for Bluetooth audio quality drops that occur when a headset microphone becomes active. The problem happens when Windows switches from the high-quality stereo headphone mode to a lower-quality hands-free mode for two-way audio. The new capability is available in preview builds released to Windows Insiders in the Beta and Experimental channels.\u003c/p\u003e\n\n\u003cp\u003eCompatible Bluetooth LE Audio devices can retain full-range stereo audio while their microphone is in use for game chat, voice calls, voice typing, or Copilot Chat. On PCs that support Super Wideband Stereo, users can select a new 2-channel, 16-bit, 48 kHz format in Windows sound settings when the microphone is active. Microsoft says the feature applies to Bluetooth LE Audio headphones, earbuds, and speakers that support 48 kHz playback.\u003c/p\u003e\n"}]</script>
