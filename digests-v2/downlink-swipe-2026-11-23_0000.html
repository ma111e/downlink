<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA flags critical Cisco RCE flaw as actively exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-flags-critical-cisco-expressway-rce-flaw-as-actively-exploited/","time":"07:44","priority":"MUST READ","score":96,"tldr":"CISA has added Cisco Expressway flaw CVE-2026-76466 to its Known Exploited Vulnerabilities catalog after attackers used it to gain root-level remote command execution on exposed devices. Organizations should urgently patch affected Expressway-C and Expressway-E cluster deployments.","briefOverview":"\u003cp\u003eCISA has added CVE-2026-76466, a critical Cisco Expressway vulnerability, to its Known Exploited Vulnerabilities Catalog after identifying it as actively exploited. The agency ordered U.S. Federal Civilian Executive Branch agencies to secure affected systems within three days under Binding Operational Directive 26-04. CISA also urged private-sector defenders to prioritize patching because the flaw poses significant risks to networks.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects clustered Cisco Expressway-C and Expressway-E devices and stems from hard-coded credentials and incomplete validation of client certificates. It can allow an unauthenticated attacker to execute operating-system commands as root. F6 reported attackers compromised two internet-facing Expressway devices, used one to access two internal cluster nodes, and prepared Python tooling to scan networks, access SMB resources, interact with SQL Server and WinRM, and inspect GitLab repositories for credentials and other sensitive information.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-76466, a critical Cisco Expressway flaw, to its Known Exploited Vulnerabilities Catalog after identifying it as actively exploited.","The flaw affects clustered Cisco Expressway-C and Expressway-E devices and can allow unauthenticated attackers to run operating-system commands as root because of hard-coded credentials and incomplete client-certificate validation.","CISA ordered U.S. Federal Civilian Executive Branch agencies to secure affected systems within three days under Binding Operational Directive 26-04.","F6 reported that attackers compromised two internet-facing Cisco Expressway devices, reached two additional internal cluster nodes, and prepared tools for further movement across the network.","Cisco said in late October that it released patches for the issue, while its PSIRT was not aware of active exploitation or public proof-of-concept code at that time."],"insights":["An internet-facing Cisco Expressway device can provide a path to additional cluster nodes on an organization’s internal network, as F6 observed attackers moving from two exposed devices to two internal nodes.","The reported post-compromise tooling was designed to locate SMB shares, interact with SQL Server and WinRM, and examine GitLab repositories for credentials and other sensitive information.","CISA designated the issue as actively exploited even though Cisco said its incident-response team was not aware of in-the-wild exploitation or public proof-of-concept code when patches were released.","F6 reported that the attackers used an unnamed AI assistant while exploiting the Cisco Expressway flaw and obtaining root-level access."],"referencedReports":[{"title":"Cisco Security Advisory: Cisco Expressway Series Static Credentials Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-vcs-static-cred-hr7EWZ8t","publisher":"cisco","context":"Cisco's security advisory describes the CVE-2026-76466 flaw and the patches released to address it.","category":"advisory","primary":true},{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/20/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA's alert identifies CVE-2026-76466 as actively exploited and adds it to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has added CVE-2026-76466, a critical Cisco Expressway vulnerability, to its Known Exploited Vulnerabilities Catalog after identifying it as actively exploited. The agency ordered U.S. Federal Civilian Executive Branch agencies to secure affected systems within three days under Binding Operational Directive 26-04. CISA also urged private-sector defenders to prioritize patching because the flaw poses significant risks to networks.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects clustered Cisco Expressway-C and Expressway-E devices and stems from hard-coded credentials and incomplete validation of client certificates. It can allow an unauthenticated attacker to execute operating-system commands as root. F6 reported attackers compromised two internet-facing Expressway devices, used one to access two internal cluster nodes, and prepared Python tooling to scan networks, access SMB resources, interact with SQL Server and WinRM, and inspect GitLab repositories for credentials and other sensitive information.\u003c/p\u003e\n"},{"n":17,"title":"Hackers Exploit Critical ScreenConnect Flaw to Hijack MSP Technician PCs Without Warning","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-screenconnect.html","time":"12:41","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting the critical ConnectWise ScreenConnect flaw CVE-2026-84869 to silently push and execute malicious files on MSP technicians’ workstations, enabling remote takeover and access to customer environments. Organizations should update ScreenConnect host clients to version 26.6.5 or later and investigate potentially exposed technician systems.","briefOverview":"\u003cp\u003eThreat actors are exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect client flaw rated 9.9, to target managed service provider (MSP) technician workstations. The flaw enables a guest in a remote session to send and run a malicious file on the connecting technician’s computer without a prompt appearing. Huntress observed one such compromise execute a guest-pushed batch file, contact a Telegram bot, download a fake Windows update installer, and launch a rogue ScreenConnect client in about nine seconds.\u003c/p\u003e\n\n\u003cp\u003eHuntress recorded at least 688,000 guest “run file” requests across 42 ScreenConnect servers from 29 IP addresses between October 20 and November 16, 2026. Attackers also used harmless marker files to check whether the technique worked before sending a payload, while another activity cluster registered thousands of fake guest sessions with cryptocurrency exchange-themed names. A compromised technician workstation is especially valuable because it can contain remote-management consoles, saved credentials, and access to many customer environments. Organizations are advised to update ScreenConnect host clients to version 26.6.5 or later, investigate affected systems, and remove the TransferFiles permission if they cannot patch immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect client flaw with a CVSS score of 9.9, to transfer and execute files on a connecting technician’s host.","Huntress observed an MSP technician workstation run a guest-pushed batch file that contacted a Telegram bot, downloaded a Windows-update-themed MSI installer, and launched a rogue ScreenConnect client within about nine seconds.","Between October 20 and November 16, 2026, Huntress recorded at least 688,000 guest “run file” requests targeting 42 ScreenConnect servers from 29 IP addresses.","Huntress also identified 2,408 unauthorized ScreenConnect guest sessions across at least 118 self-hosted servers belonging to 109 protected organizations, with many using cryptocurrency exchange-themed names.","Organizations are advised to update technician ScreenConnect host clients to version 26.6.5 or later, or remove the TransferFiles permission if patching cannot occur immediately."],"insights":["The flaw can be triggered simply by a technician joining a remote session, with no warning or approval prompt shown before the malicious file is run on the technician’s computer.","Attackers used a harmless file named marker.txt seconds after a technician connected as a canary test, allowing them to verify that the technique worked before delivering a harmful payload.","Some attackers created fake ScreenConnect guest sessions with cryptocurrency exchange-themed computer names to entice technicians to connect, even when no later file transfer or command activity was observed.","Because technician workstations may contain remote-management tools and saved credentials for many customers, compromising one technician can provide access well beyond a single affected computer.","If organizations cannot immediately update ScreenConnect, removing the TransferFiles permission from relevant roles and session groups is a documented interim mitigation."],"referencedReports":[{"title":"CVE-2026-84869 ScreenConnect Technician Exploitation","url":"https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation","publisher":"huntress","context":"The article cites Huntress research detailing exploitation of a ScreenConnect technician workstation through a guest-pushed batch file.","category":"research","primary":true},{"title":"Fake Crypto Exchange Sessions in ScreenConnect","url":"https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect","publisher":"huntress","context":"The article cites Huntress analysis of unauthorized ScreenConnect guest sessions impersonating cryptocurrency exchange-related systems.","category":"research","primary":true},{"title":"ScreenConnect Abuse","url":"https://www.trendaisecurity.com/en/resources-insights/trendai-security-blog/screenconnect-abuse","publisher":"trend-ai-security","context":"The article references this technical analysis for details on extracting relay addresses from publicly downloadable ScreenConnect Access installers.","category":"research","primary":false},{"title":"2026-09-08 ScreenConnect Security Bulletin","url":"https://www.connectwise.com/company/trust/security-bulletins/2026-09-08-screenconnect-bulletin","publisher":"connectwise","context":"The article references ConnectWise's security bulletin for the interim mitigation of removing the TransferFiles permission when immediate patching is not possible.","category":"advisory","primary":false}],"body":"\u003cp\u003eThreat actors are exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect client flaw rated 9.9, to target managed service provider (MSP) technician workstations. The flaw enables a guest in a remote session to send and run a malicious file on the connecting technician’s computer without a prompt appearing. Huntress observed one such compromise execute a guest-pushed batch file, contact a Telegram bot, download a fake Windows update installer, and launch a rogue ScreenConnect client in about nine seconds.\u003c/p\u003e\n\n\u003cp\u003eHuntress recorded at least 688,000 guest “run file” requests across 42 ScreenConnect servers from 29 IP addresses between October 20 and November 16, 2026. Attackers also used harmless marker files to check whether the technique worked before sending a payload, while another activity cluster registered thousands of fake guest sessions with cryptocurrency exchange-themed names. A compromised technician workstation is especially valuable because it can contain remote-management consoles, saved credentials, and access to many customer environments. Organizations are advised to update ScreenConnect host clients to version 26.6.5 or later, investigate affected systems, and remove the TransferFiles permission if they cannot patch immediately.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft Azure flaw exploited to steal customers' API credentials","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-azure-flaw-exploited-to-steal-customers-api-credentials/","time":"19:42","priority":"MUST READ","score":94,"tldr":"Microsoft mitigated an exploited flaw in Azure API Management Classic tiers that could let unauthorized actors access stored secrets, subscription keys, and management tokens. Affected customers must rotate potentially exposed credentials and investigate for misuse, as the fix does not invalidate credentials stolen before mitigation.","briefOverview":"\u003cp\u003eMicrosoft warned that an exploited vulnerability in Azure API Management (APIM) Classic tiers could have allowed unauthorized parties to access stored customer credentials. The company said it identified the issue on November 18, 2026, and closed the unauthorized management-access path the following day. Potentially exposed information included secrets in Named Values, identity-provider and OpenID Connect client secrets, subscription keys, and tokens for direct management APIs.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft rotated Microsoft-controlled keys where appropriate, but said its fix does not automatically invalidate customer credentials that may have been accessed before mitigation. It urged affected organizations to rotate potentially exposed credentials, examine logs, and investigate suspicious activity in connected systems. Norway’s National Security Authority linked the issue to attacks involving Norwegian organizations, including energy companies Equinor and Skagerak Energi, and advised customers to confirm their APIM instances had received the security update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft said an exploited flaw in Azure API Management Classic tiers allowed unauthorized access to management functions and potentially exposed stored secrets, subscription keys, and management API tokens.","Microsoft identified the issue on November 18, 2026, closed the unauthorized access path on November 19, and rotated Microsoft-controlled keys and credentials where appropriate.","Microsoft warned that its remediation does not automatically invalidate customer credentials that may have been accessed before the fix, and urged affected customers to rotate credentials and investigate suspicious activity.","Norway’s National Security Authority linked the issue to attacks affecting Norwegian organizations, including energy companies Equinor and Skagerak Energi, and said organizations in other countries and industries were also affected.","Microsoft said Azure API Management v2 tiers are not affected, while Norway’s National Security Authority advised organizations to verify that their API Management instances received the security update."],"insights":["Microsoft’s fix blocked the unauthorized access route but did not revoke customer credentials that may already have been copied, making credential rotation a separate and urgent customer responsibility.","The potentially exposed data included credentials that could grant access beyond API Management itself, such as to connected applications, services, or backend systems, depending on their permissions.","Norway’s National Security Authority advised organizations to confirm that their individual API Management instances received the update, noting that instances below certain runtime versions remain vulnerable.","A Reddit administrator alleged that the legacy API involved did not produce customer-visible logs for the unauthorized access, but BleepingComputer said it had not independently verified that claim."],"referencedReports":[{"title":"NSM deler tiltak mot sårbarhet i Azure API Management","url":"https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management","publisher":"norway's-national-security-authority","context":"NSM warned that threat actors targeted tokens, secrets, and named values in Azure API Management and advised organizations to verify that affected instances received the update.","category":"advisory","primary":false},{"title":"APIM legacy access threat-hunting queries","url":"https://anderskristiansen.com/post/2026/apim-legacy-access/?utm_source=chatgpt.com","publisher":"anders-kristiansen","context":"Cloud security researcher Anders Kristiansen shared threat-hunting queries to help organizations investigate possible exploitation and identify credentials stored in APIM instances.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft warned that an exploited vulnerability in Azure API Management (APIM) Classic tiers could have allowed unauthorized parties to access stored customer credentials. The company said it identified the issue on November 18, 2026, and closed the unauthorized management-access path the following day. Potentially exposed information included secrets in Named Values, identity-provider and OpenID Connect client secrets, subscription keys, and tokens for direct management APIs.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft rotated Microsoft-controlled keys where appropriate, but said its fix does not automatically invalidate customer credentials that may have been accessed before mitigation. It urged affected organizations to rotate potentially exposed credentials, examine logs, and investigate suspicious activity in connected systems. Norway’s National Security Authority linked the issue to attacks involving Norwegian organizations, including energy companies Equinor and Skagerak Energi, and advised customers to confirm their APIM instances had received the security update.\u003c/p\u003e\n"},{"n":14,"title":"Hackers Exploit Critical ASP.NET Anti-CSRF Library Flaw Allowing Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-aspnet-anti.html","time":"09:11","priority":"MUST READ","score":94,"tldr":"A critical, actively exploited insecure-deserialization flaw in the obsolete Idunno.AntiCsrf ASP.NET library lets unauthenticated attackers execute code on vulnerable IIS web servers with a single crafted POST request. Organizations should immediately remove or replace the unsupported library and investigate affected systems for compromise.","briefOverview":"\u003cp\u003eGoogle Mandiant has warned that attackers are actively exploiting CVE-2026-131914, a critical flaw in the discontinued Idunno.AntiCsrf library for ASP.NET WebForms. The vulnerability affects versions 0.9.1.0 and 0.9.1 Beta and has a CVSS score of 9.3. Idunno.AntiCsrf has not been updated since December 2008, and no official patch is available.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs because the library processes untrusted anti-CSRF form-token data without cryptographic verification when handling HTTP POST requests. An unauthenticated attacker can send a single crafted request, using any non-empty configured anti-CSRF cookie value and a specially encoded form value, to execute arbitrary code as the IIS worker process. Organizations are advised to remove the library, replace it with a supported alternative, review IIS logs for suspicious POST activity, and rotate relevant configuration secrets if exploitation is suspected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-131914 is a critical insecure-deserialization flaw in Idunno.AntiCsrf versions 0.9.1.0 and 0.9.1 Beta, with a CVSS score of 9.3.","The flaw can allow an unauthenticated remote attacker to execute arbitrary code in the IIS worker process through a single crafted HTTP POST request to affected ASP.NET WebForms endpoints.","Google Mandiant reported that the vulnerability is being actively exploited in the wild.","Idunno.AntiCsrf has not been updated since December 2008, and no official patch is available.","Organizations are advised to discontinue Idunno.AntiCsrf, adopt a supported anti-CSRF alternative, review IIS logs for suspicious POST requests, and rotate relevant secrets if compromise is suspected."],"insights":["A component intended to protect ASP.NET WebForms applications from cross-site request forgery can instead be used to run arbitrary code because it processes attacker-supplied form-token data without cryptographic verification.","Exploitation does not require an account or a valid anti-CSRF token; according to Mandiant, an attacker only needs to send a POST request containing any non-empty configured CSRF cookie value and a specially encoded form-field value.","The article identifies practical hunting signals: anomalous POST requests to .aspx pages that return HTTP 302 or HTTP 500 responses and have unusually high request-byte counts where IIS logging captures them.","Because successful exploitation can compromise the IIS worker process, organizations with evidence of compromise are advised to rotate Web.config and applicationHost.config secrets, including machine keys, encryption keys, and database credentials, and inspect webroots for unauthorized files."],"referencedReports":[{"title":"MNDT-2026-0048","url":"https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0048.md","publisher":"mandiant","context":"The article links to Mandiant's vulnerability disclosure for CVE-2026-131914 in Idunno.AntiCsrf.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle Mandiant has warned that attackers are actively exploiting CVE-2026-131914, a critical flaw in the discontinued Idunno.AntiCsrf library for ASP.NET WebForms. The vulnerability affects versions 0.9.1.0 and 0.9.1 Beta and has a CVSS score of 9.3. Idunno.AntiCsrf has not been updated since December 2008, and no official patch is available.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs because the library processes untrusted anti-CSRF form-token data without cryptographic verification when handling HTTP POST requests. An unauthenticated attacker can send a single crafted request, using any non-empty configured anti-CSRF cookie value and a specially encoded form value, to execute arbitrary code as the IIS worker process. Organizations are advised to remove the library, replace it with a supported alternative, review IIS logs for suspicious POST activity, and rotate relevant configuration secrets if exploitation is suspected.\u003c/p\u003e\n"},{"n":6,"title":"South Korea’s power giant KEPCO confirms data breach impacting 1.5 million","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/south-koreas-power-giant-kepco-confirms-data-breach-impacting-15-million/","time":"20:54","priority":"MUST READ","score":92,"tldr":"South Korea’s state-controlled power utility KEPCO confirmed that attackers accessed its billing and procurement systems, exposing personal and financial data belonging to more than 1.5 million customers, representatives, and employees. The company has restricted access, notified affected people, and is coordinating with authorities to prevent fraud.","briefOverview":"\u003cp\u003eKorea Electric Power Corporation (KEPCO), South Korea’s state-controlled main electric power company, confirmed that an unauthorized party accessed two internal systems: the KEPCO ON electricity billing platform and the SRM electronic procurement system. KEPCO detected the incident on November 20 and said it blocked external IP access and suspended the affected services. The company said it is notifying affected individuals, reported the incident to data-protection authorities, and is working with government and financial authorities to prevent unauthorized transactions.\u003c/p\u003e\n\n\u003cp\u003eThe exposure affected more than 1.5 million people, including 650,487 KEPCO ON customers, 426,827 company representatives, and 442,934 KEPCO employees. Customer records included names, identification and contact details, addresses, electricity billing information, and, in some cases, bank-account or payment-card information; employee and representative records also included personal and business contact details. KEPCO warned that the information could support targeted phishing and impersonation, while a person using the alias Noiem claimed responsibility for the incident, though attribution remains unconfirmed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Korea Electric Power Corporation (KEPCO) confirmed unauthorized access to its KEPCO ON electricity billing platform and SRM electronic procurement system on November 20.","The incident exposed data for more than 1.5 million people, including 650,487 KEPCO ON customers, 426,827 company representatives, and 442,934 KEPCO employees.","Exposed customer information included names, identification information, contact details, addresses, billing data, and, for some customers, bank account and payment-card details.","KEPCO says it blocked external IP access, suspended the affected services, is notifying affected people, and reported the incident to data protection authorities.","A person using the alias Noiem claimed responsibility for the incident, but attribution has not been confirmed."],"insights":["The combination of customer contact information, billing details, and in some cases bank or card data creates a strong basis for highly convincing scams that impersonate KEPCO.","The incident affected both public-facing billing services and a procurement system, exposing not only customers but also company representatives, employees, and contractor-related records.","KEPCO attributed the breach generally to “advanced technologies such as AI” but did not disclose how the intruder initially gained access or moved through its systems.","Although Noiem publicly claimed the breach before KEPCO’s announcement, the article states that the claimed attribution has not been confirmed."],"referencedReports":[],"body":"\u003cp\u003eKorea Electric Power Corporation (KEPCO), South Korea’s state-controlled main electric power company, confirmed that an unauthorized party accessed two internal systems: the KEPCO ON electricity billing platform and the SRM electronic procurement system. KEPCO detected the incident on November 20 and said it blocked external IP access and suspended the affected services. The company said it is notifying affected individuals, reported the incident to data-protection authorities, and is working with government and financial authorities to prevent unauthorized transactions.\u003c/p\u003e\n\n\u003cp\u003eThe exposure affected more than 1.5 million people, including 650,487 KEPCO ON customers, 426,827 company representatives, and 442,934 KEPCO employees. Customer records included names, identification and contact details, addresses, electricity billing information, and, in some cases, bank-account or payment-card information; employee and representative records also included personal and business contact details. KEPCO warned that the information could support targeted phishing and impersonation, while a person using the alias Noiem claimed responsibility for the incident, though attribution remains unconfirmed.\u003c/p\u003e\n"},{"n":12,"title":"Norway says hackers exploited Microsoft security flaw to attack energy firms Equinor, Skagerak Energi","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/norway-microsoft-cyberattack-equinor","time":"15:45","priority":"MUST READ","score":92,"tldr":"Norwegian authorities say attackers exploited a flaw in legacy Azure API Management tiers to target sensitive credentials at energy firms Equinor and Skagerak Energi. Microsoft fixed the exposure path and urged affected customers to rotate credentials, while the companies reported no confirmed data theft or operational disruption.","briefOverview":"\u003cp\u003eNorway’s National Security Authority said an unidentified threat actor exploited a security flaw in Microsoft Azure API Management to target access tokens and other sensitive information. Norwegian energy companies Equinor and Skagerak Energi reported cyberattacks last week, and authorities said organizations across multiple sectors in Norway and abroad could be affected. Equinor helped identify the issue and alert authorities.\u003c/p\u003e\n\n\u003cp\u003eEquinor detected its incident on Tuesday and contained it by Friday, reporting disruption to some internal services but no effect on oil and gas production and no indication that data was stolen or altered. Skagerak Energi said its operations and electricity production were unaffected and that it found no evidence of compromised information. Microsoft said the issue affected older Azure API Management tiers, particularly where customers stored sensitive information directly in the service rather than Azure Key Vault or had not followed security recommendations; it closed the access path, notified potentially affected customers, and published guidance to rotate credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Norway’s National Security Authority said an unidentified threat actor actively targeted access tokens and other sensitive information through a flaw in Azure API Management.","Equinor and Skagerak Energi reported cyberattacks, but both said their core energy production continued normally and neither found evidence that information had been compromised.","Equinor detected the incident on Tuesday and fully contained it by Friday, with some internal services disrupted.","Microsoft said it discovered the issue affecting older Classic Azure API Management tiers on November 18 and closed the access path the next day.","Microsoft advised potentially affected customers to identify and rotate exposed credentials, while Norwegian authorities warned that organizations in multiple sectors in Norway and abroad could be affected."],"insights":["The exposure primarily concerned customers that stored sensitive information directly in Azure API Management or had not followed Microsoft’s security recommendations, rather than all Azure API Management users.","Newer Azure API Management versions were not affected, while Microsoft said several older tiers—including Developer, Basic, Standard, and Premium—were impacted.","Equinor helped identify the issue and alert Norwegian authorities, meaning the vulnerability was first discovered through Norway’s energy sector.","Microsoft had closed the identified access path before publicly publishing credential-rotation guidance, but did not disclose how many customers may have been exposed.","Norwegian authorities said they had found no evidence that successful or attempted compromises disrupted services at Norwegian organizations, despite the incidents involving energy companies."],"referencedReports":[{"title":"NSM deler tiltak mot sårbarhet i Azure API Management","url":"https://nsm.no/aktuelt/nsm-deler-tiltak-mot-sarbarhet-i-azure-api-management","publisher":"norway-national-security-authority","context":"The article cites the Norwegian National Security Authority’s advisory describing active targeting of sensitive access information in Azure API Management and recommended protective measures.","category":"advisory","primary":true},{"title":"Rotating credentials in Azure API Management","url":"https://techcommunity.microsoft.com/blog/integrationsonazureblog/rotating-credentials-in-azure-api-management/4575478","publisher":"microsoft","context":"The article references Microsoft’s guidance for affected customers to identify and replace potentially exposed credentials.","category":"guide","primary":false}],"body":"\u003cp\u003eNorway’s National Security Authority said an unidentified threat actor exploited a security flaw in Microsoft Azure API Management to target access tokens and other sensitive information. Norwegian energy companies Equinor and Skagerak Energi reported cyberattacks last week, and authorities said organizations across multiple sectors in Norway and abroad could be affected. Equinor helped identify the issue and alert authorities.\u003c/p\u003e\n\n\u003cp\u003eEquinor detected its incident on Tuesday and contained it by Friday, reporting disruption to some internal services but no effect on oil and gas production and no indication that data was stolen or altered. Skagerak Energi said its operations and electricity production were unaffected and that it found no evidence of compromised information. Microsoft said the issue affected older Azure API Management tiers, particularly where customers stored sensitive information directly in the service rather than Azure Key Vault or had not followed security recommendations; it closed the access path, notified potentially affected customers, and published guidance to rotate credentials.\u003c/p\u003e\n"},{"n":27,"title":"13 Malicious NuGet Packages Target .NET Developers With Fake Job Assessments","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/malicious-nuget-packages-fake-job-assessments?utm_medium=feed","time":"21:55","priority":"SHOULD READ","score":88,"tldr":"Socket identified a coordinated campaign using 13 malicious NuGet packages and fake .NET job assessments to infect Windows developers through MSBuild build hooks, DLL side-loading, and button controls that download and execute payloads. Developers should treat take-home projects and bundled NuGet packages as untrusted, particularly packages containing build targets or unfamiliar UI controls.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team identified an operation involving 13 malicious NuGet packages, fake .NET job assessments, GitHub-hosted payloads, and a trojanized crypto-wallet application targeting Windows developers. Most packages impersonated WinUI 3 or WPF button controls, while the lures instructed candidates to build and run Visual Studio projects on native Windows. The operation also included malicious npm packages, executable files disguised as \u003ccode\u003e.csproj\u003c/code\u003e project files, GitHub-based command-and-control, and a ClickFix page that copied a hidden PowerShell command.\u003c/p\u003e\n\n\u003cp\u003eOne fake WinUI 3 assessment bundled NuGet packages that caused MSBuild to run a DLL after every build, downloading \u003ccode\u003eOskSupport.dll\u003c/code\u003e into \u003ccode\u003e%LOCALAPPDATA%\\osk\\\u003c/code\u003e and copying Windows \u003ccode\u003eosk.exe\u003c/code\u003e beside it. Its \u003ccode\u003eFileButton\u003c/code\u003e control then launched the copied \u003ccode\u003eosk.exe\u003c/code\u003e when the application created the control, using a known DLL side-loading arrangement. Separately, \u003ccode\u003eWinUI.Button\u003c/code\u003e started a background downloader from its button constructor that retrieved an executable from GitHub, saved it as \u003ccode\u003e%TEMP%\\Launcher.exe\u003c/code\u003e, and ran it. The recovered payloads included loaders that used private GitHub repositories for per-victim instructions, a Chrome-profile stealer that uploaded collected data to GitHub, and a payload that reported information through Telegram.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that developers can be exposed simply by building or running a take-home project or adding an apparently harmless interface-control package. It recommends treating coding assessments as untrusted, reviewing local package feeds and bundled \u003ccode\u003e.nupkg\u003c/code\u003e files, and using disposable virtual machines with no access to credentials for untrusted projects. Organizations are advised to restrict NuGet package sources and review packages containing build targets that execute commands, while security teams are advised to hunt for indicators including \u003ccode\u003e%LOCALAPPDATA%\\osk\\\u003c/code\u003e, \u003ccode\u003e%TEMP%\\Launcher.exe\u003c/code\u003e, suspicious MSBuild-launched \u003ccode\u003edotnet.exe\u003c/code\u003e processes, and unusual authenticated GitHub API activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket identified 13 malicious NuGet packages targeting Windows .NET developers through fake job-related “Home Assessment” projects and deceptive WinUI 3 or WPF button controls.","A bundled MSBuild target in the fake WinUI 3 assessment runs after every build and downloads a DLL to %LOCALAPPDATA%\\osk\\OskSupport.dll while copying Windows On-Screen Keyboard, osk.exe, beside it.","The assessment’s FileButton control launches the copied osk.exe when the application creates the control, using a known DLL side-loading arrangement involving osksupport.dll.","WinUI.Button 1.0.0 starts a background downloader from its WUIButton constructor that retrieves avast.exe from GitHub, saves it as %TEMP%\\Launcher.exe, and runs it.","The operation also used GitHub-hosted executables disguised as axios.csproj files, a trojanized Crypto Wallet Analyzer application, GitHub repositories for command-and-control, and a ClickFix page that copies a PowerShell command."],"insights":["The fake assessment used two separate components that only complete the infection chain together: one prepares files during a build, and the other launches the copied Windows program when the app window creates its button control.","The MSBuild target declares an output file that is never created, causing the malicious DLL to run after every build rather than being treated as already complete.","After NuGet removed the original packages, the lure initially carried malicious .nupkg files inside its own repository and configured the project to restore packages from that local folder.","The malicious WinUI.Button package does not need a user to click anything: merely creating its WUIButton control starts a background task that repeatedly tries to download and run an executable.","The recovered loader uses private GitHub repository paths as a per-victim command channel, allowing operators to receive a machine profile and place a distinct next-stage payload for each victim."],"referencedReports":[{"title":"Moonstone Sleet Emerges as New North Korean Threat Actor With New Bag of Tricks","url":"https://www.microsoft.com/en-us/security/blog/2024/05/28/moonstone-sleet-emerges-as-new-north-korean-threat-actor-with-new-bag-of-tricks/","publisher":"microsoft","context":"The article cites Microsoft’s documentation that multiple distinct North Korean groups have targeted developers with malicious packages.","category":"research","primary":false},{"title":"Blinder Tunnel Targets Critical Infrastructure","url":"https://unit42.paloaltonetworks.com/blinder-tunnel-targets-critical-infrastructure/","publisher":"palo-alto-networks-unit-42","context":"The article cites Unit 42 reporting on an Iranian-nexus cluster that used a Visual Studio coding-assessment lure and GitHub command-and-control with an embedded token.","category":"research","primary":false},{"title":"Update: Cloudzy Command and Control Provider Report","url":"https://www.halcyon.ai/blog/update-cloudzy-command-and-control-provider-report","publisher":"halcyon","context":"The article references Halcyon’s reporting that the Cloudzy/RouterHosting provider has also served state-linked and criminal groups from multiple countries.","category":"research","primary":false}],"body":"\u003cp\u003eSocket’s Threat Research Team identified an operation involving 13 malicious NuGet packages, fake .NET job assessments, GitHub-hosted payloads, and a trojanized crypto-wallet application targeting Windows developers. Most packages impersonated WinUI 3 or WPF button controls, while the lures instructed candidates to build and run Visual Studio projects on native Windows. The operation also included malicious npm packages, executable files disguised as \u003ccode\u003e.csproj\u003c/code\u003e project files, GitHub-based command-and-control, and a ClickFix page that copied a hidden PowerShell command.\u003c/p\u003e\n\n\u003cp\u003eOne fake WinUI 3 assessment bundled NuGet packages that caused MSBuild to run a DLL after every build, downloading \u003ccode\u003eOskSupport.dll\u003c/code\u003e into \u003ccode\u003e%LOCALAPPDATA%\\osk\\\u003c/code\u003e and copying Windows \u003ccode\u003eosk.exe\u003c/code\u003e beside it. Its \u003ccode\u003eFileButton\u003c/code\u003e control then launched the copied \u003ccode\u003eosk.exe\u003c/code\u003e when the application created the control, using a known DLL side-loading arrangement. Separately, \u003ccode\u003eWinUI.Button\u003c/code\u003e started a background downloader from its button constructor that retrieved an executable from GitHub, saved it as \u003ccode\u003e%TEMP%\\Launcher.exe\u003c/code\u003e, and ran it. The recovered payloads included loaders that used private GitHub repositories for per-victim instructions, a Chrome-profile stealer that uploaded collected data to GitHub, and a payload that reported information through Telegram.\u003c/p\u003e\n\n\u003cp\u003eThe article warns that developers can be exposed simply by building or running a take-home project or adding an apparently harmless interface-control package. It recommends treating coding assessments as untrusted, reviewing local package feeds and bundled \u003ccode\u003e.nupkg\u003c/code\u003e files, and using disposable virtual machines with no access to credentials for untrusted projects. Organizations are advised to restrict NuGet package sources and review packages containing build targets that execute commands, while security teams are advised to hunt for indicators including \u003ccode\u003e%LOCALAPPDATA%\\osk\\\u003c/code\u003e, \u003ccode\u003e%TEMP%\\Launcher.exe\u003c/code\u003e, suspicious MSBuild-launched \u003ccode\u003edotnet.exe\u003c/code\u003e processes, and unusual authenticated GitHub API activity.\u003c/p\u003e\n"},{"n":15,"title":"N-able Discloses Critical Mail Assure Vulnerability Found During Breach Investigation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/n-able-discloses-critical-mail-assure.html","time":"12:28","priority":"SHOULD READ","score":86,"tldr":"N-able fixed a critical SSRF flaw (CVE-2026-134624) in its Mail Assure/SpamExperts Hosted Cloud platform after investigating an unauthorized server access incident. The company says no customer data compromise has been found, but customers must replace revoked API and OAuth credentials.","briefOverview":"\u003cp\u003eN-able disclosed and fixed CVE-2026-134624, a critical server-side request forgery issue in its Mail Assure and SpamExperts Hosted Cloud email-filtering service. The issue was discovered while the company investigated unauthorized access to one Hosted Cloud server. N-able restored dashboard and API access late Saturday after an outage that began the previous Monday, while email delivery and spam filtering continued operating. The company has not said whether the flaw was used to gain access.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was in an LDAP synchronization connection check used when a relay is configured. A user with high-level API access could direct the server to connect to chosen internal hosts and ports, determine which were reachable, and send crafted data to internal services; N-able assigned it a CVSS 4.0 score of 9.3 and fixed it in build 20261121.1943. During its response, the company took the affected server offline, rotated internal credentials, revoked customer API and OAuth tokens, and reset local user passwords. N-able says it has found no evidence of compromised customer data or activity beyond the affected server, but customers must replace revoked credentials used by scripts and integrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able disclosed CVE-2026-134624, a critical server-side request forgery flaw in its Mail Assure and SpamExperts Hosted Cloud email-filtering service.","The flaw allowed authenticated users with high-level API access to make the platform connect to chosen internal hosts and ports and send crafted data to internal services.","N-able patched the issue in build 20261121.1943 and restored dashboard and API access late Saturday after an outage that began the previous Monday.","During the incident response, N-able took an affected Hosted Cloud server offline, rotated internal credentials, revoked customer API and OAuth tokens, and reset local user passwords.","N-able says it has found no evidence of customer-data compromise or exploitation beyond one server, and its investigation remains ongoing."],"insights":["Hosted Cloud customers do not need to install a patch because N-able says the service was already updated, but integrations using revoked API or OAuth tokens must be reconnected with replacement credentials.","The disclosed flaw was limited to users with high-level API access and enabled internal network reachability checks and crafted requests; N-able's advisory does not state that it enabled code execution.","SpamExperts Local Cloud runs on customer hardware and is covered by weekly software updates, so its operators should verify that they are running build 20261121.1943.","N-able has not determined or disclosed how the unauthorized party initially accessed the Hosted Cloud server, and says a formal root-cause analysis is expected within two weeks of its update."],"referencedReports":[{"title":"CVE-2026-134624: Mail Assure LDAP Sync Connection Check SSRF","url":"https://me.n-able.com/s/security-advisory/aArVy0000002mrlKAA/cve2026134624-mailassure-ldap-sync-connection-check-ssrf","publisher":"n-able","context":"The article cites N-able's security advisory for the flaw's impact, affected builds, and fix version.","category":"advisory","primary":true}],"body":"\u003cp\u003eN-able disclosed and fixed CVE-2026-134624, a critical server-side request forgery issue in its Mail Assure and SpamExperts Hosted Cloud email-filtering service. The issue was discovered while the company investigated unauthorized access to one Hosted Cloud server. N-able restored dashboard and API access late Saturday after an outage that began the previous Monday, while email delivery and spam filtering continued operating. The company has not said whether the flaw was used to gain access.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was in an LDAP synchronization connection check used when a relay is configured. A user with high-level API access could direct the server to connect to chosen internal hosts and ports, determine which were reachable, and send crafted data to internal services; N-able assigned it a CVSS 4.0 score of 9.3 and fixed it in build 20261121.1943. During its response, the company took the affected server offline, rotated internal credentials, revoked customer API and OAuth tokens, and reset local user passwords. N-able says it has found no evidence of compromised customer data or activity beyond the affected server, but customers must replace revoked credentials used by scripts and integrations.\u003c/p\u003e\n"},{"n":19,"title":"Hackers Exploited GL.iNet Cloud Flaw to Install Malware on Routers and KVM Devices","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploited-glinet-cloud-flaw-to.html","time":"09:04","priority":"SHOULD READ","score":86,"tldr":"Attackers exploited a flaw in GL.iNet’s GoodCloud remote-management service to run root-level malware on some routers and KVM devices; GL.iNet has blocked the access path and released security firmware. Owners should check for compromise, update immediately, and consider reinstalling firmware without retaining settings and rotating stored credentials if infection is suspected.","briefOverview":"\u003cp\u003eAttackers exploited a flaw in GL.iNet’s GoodCloud remote-management service to install malware on some customer routers and KVM remote-control devices. GL.iNet said it fixed the cloud-side issue and blocked the access route used by the attacker, but that change does not remove malware from devices already affected. The company released security firmware for listed router and KVM models and is contacting customers it identifies as affected, though it has not disclosed the number of infections, the attacker\u0026rsquo;s identity, or how GoodCloud was breached.\u003c/p\u003e\n\n\u003cp\u003eRemoteToHome Consulting verified a root-level remote command shell on a managed GL-AXT1800 router with GoodCloud enabled, while other managed devices showed related activity. Its analysis says a GoodCloud client handler accepted two values from cloud messages and ran them as root without validation, although GL.iNet has not confirmed that technical finding. The observed shell left no files and disappeared after a restart, and the vendor’s published process marker was absent on the router with the verified shell.\u003c/p\u003e\n\n\u003cp\u003eGL.iNet says the listed firmware updates remove malware from this incident without requiring a factory reset and retain device settings. Researchers caution that retaining settings may preserve password files, SSH keys, user directories, and potentially boot-time scripts on KVM devices, and recommend reinstalling firmware without keeping settings if compromise is suspected. They also advise treating saved credentials and keys as exposed, while disabling GoodCloud can stop the cloud client until an update is installed but will not clean an already infected device.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers exploited a vulnerability in GL.iNet’s GoodCloud remote-management service to install malware on some customer routers and KVM devices.","GL.iNet said it fixed the cloud-side flaw and blocked the attacker’s access route, but devices infected before the fix still require checking and installation of the listed security firmware.","RemoteToHome Consulting verified a root-level reverse shell on a GL-AXT1800 router running firmware 4.8.3 with GoodCloud enabled, which connected to 170.39.226[.]219.","GL.iNet’s updated security notice says its listed firmware versions remove the malware identified in this incident without requiring a factory reset, while researchers recommend reinstalling firmware without retaining settings when compromise is suspected.","The number of affected devices, the attacker’s identity, and the method used to breach the GoodCloud service remain unknown."],"insights":["The vendor’s suggested process marker can miss infections: RemoteToHome found it absent on a router where it verified a root-level reverse shell.","The observed router shell leaves no files behind and its traces disappear after a restart, so checking a suspected device before rebooting or upgrading can preserve evidence.","Researchers found that an earlier KVM security upgrade retained password files, SSH keys, and user directories containing boot-time scripts, so they recommend reinstalling firmware without keeping settings when compromise is suspected.","Turning off GoodCloud stops the cloud client from running until an update is installed, but it does not remove malware already placed on a device.","RemoteToHome also found an older, unrelated backdoor on 49 managed routers that was installed between September 2025 and May 2026, with no established link to the GoodCloud incident."],"referencedReports":[{"title":"GL.iNet Security Incident 2026","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026","publisher":"RemoteToHome Consulting","context":"The article cites this incident investigation for verification of a root-level reverse shell on a managed GL-AXT1800 router.","category":"research","primary":true},{"title":"Router Reverse Shell Analysis","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/router-reverse-shell.md","publisher":"RemoteToHome Consulting","context":"The article cites this analysis for findings that the reverse shell left no files and that its traces disappeared after a device restart.","category":"research","primary":true},{"title":"Technical Breakdown","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/technical-breakdown.md","publisher":"RemoteToHome Consulting","context":"The article cites this technical analysis for the finding that the GoodCloud client accepted cloud-message values and executed them as root without validation.","category":"research","primary":true},{"title":"Detailed Findings","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/findings.md","publisher":"RemoteToHome Consulting","context":"The article directs readers to these detailed findings for fuller indicators of compromise.","category":"research","primary":false},{"title":"KVM Firmware Analysis","url":"https://github.com/RemoteToHome-io/gl-security-incident-2026/blob/main/docs/kvm-firmware.md","publisher":"RemoteToHome Consulting","context":"The article cites this firmware analysis for evidence that an earlier RM1 update retaining settings also retained password files, SSH keys, and boot-time script locations.","category":"research","primary":false},{"title":"2026-11-20 GL.iNet Security Notice: GoodCloud KVM \u0026 Routers","url":"https://forum.gl-inet.com/t/2026-11-20-gl-inet-security-notice-goodcloud-kvm-routers/73056","publisher":"GL.iNet","context":"The article references GL.iNet’s security notice for fixed firmware versions and the vendor’s statement that the update removes identified malware without a factory reset.","category":"advisory","primary":true}],"body":"\u003cp\u003eAttackers exploited a flaw in GL.iNet’s GoodCloud remote-management service to install malware on some customer routers and KVM remote-control devices. GL.iNet said it fixed the cloud-side issue and blocked the access route used by the attacker, but that change does not remove malware from devices already affected. The company released security firmware for listed router and KVM models and is contacting customers it identifies as affected, though it has not disclosed the number of infections, the attacker\u0026rsquo;s identity, or how GoodCloud was breached.\u003c/p\u003e\n\n\u003cp\u003eRemoteToHome Consulting verified a root-level remote command shell on a managed GL-AXT1800 router with GoodCloud enabled, while other managed devices showed related activity. Its analysis says a GoodCloud client handler accepted two values from cloud messages and ran them as root without validation, although GL.iNet has not confirmed that technical finding. The observed shell left no files and disappeared after a restart, and the vendor’s published process marker was absent on the router with the verified shell.\u003c/p\u003e\n\n\u003cp\u003eGL.iNet says the listed firmware updates remove malware from this incident without requiring a factory reset and retain device settings. Researchers caution that retaining settings may preserve password files, SSH keys, user directories, and potentially boot-time scripts on KVM devices, and recommend reinstalling firmware without keeping settings if compromise is suspected. They also advise treating saved credentials and keys as exposed, while disabling GoodCloud can stop the cloud client until an update is installed but will not clean an already infected device.\u003c/p\u003e\n"},{"n":9,"title":"FBI reportedly facing second data breach involving National Crime Information Center","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/fbi-cyberattack-data-breach","time":"18:30","priority":"SHOULD READ","score":85,"tldr":"The FBI is reportedly investigating a breach of the National Crime Information Center, a sensitive law-enforcement database containing information on fugitives, warrants, missing persons, and investigations. If confirmed, it would be the FBI’s second reported cybersecurity incident this year.","briefOverview":"\u003cp\u003eThe FBI is reportedly investigating a data breach involving the National Crime Information Center (NCIC), according to sources cited by CNN and the Associated Press. The FBI did not respond to requests for comment, and the sources said the cyberattack occurred on Thursday. President Donald Trump said he had been briefed and described the incident as “not good.”\u003c/p\u003e\n\n\u003cp\u003eNCIC is used by local, state, and federal law-enforcement agencies to share information about criminals, fugitives, missing people, outstanding warrants, and investigations. The database contains sensitive information that could be valuable to criminals and others, and Trump said the incident may allow public access to investigative files related to him. If confirmed, this would be the FBI’s second cybersecurity incident this year, following the reported ShinyHunters breach of the FBI’s job site in September.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI is reportedly investigating a breach involving the National Crime Information Center, a database used by U.S. law-enforcement agencies.","Sources told CNN and the Associated Press that the cyberattack took place on Thursday, while the FBI did not respond to requests for comment.","The National Crime Information Center contains information on criminals, fugitives, missing people, outstanding warrants, and investigations.","President Donald Trump said he had been briefed on the incident and described it as “not good.”","If confirmed, the incident would be the FBI’s second cybersecurity incident this year, following the reported September breach of its job site by ShinyHunters."],"insights":["Because the National Crime Information Center is shared by local, state, and federal agencies, an incident involving it could concern a system used across multiple levels of U.S. law enforcement.","The database includes outstanding-warrant information as well as records on criminals, fugitives, missing people, and investigations, making it a particularly sensitive repository.","The reported incident follows a separate FBI job-site breach earlier in the year and comes amid recent cyber incidents at several other U.S. government agencies.","President Donald Trump said the breach could make investigative files related to him accessible to the public."],"referencedReports":[],"body":"\u003cp\u003eThe FBI is reportedly investigating a data breach involving the National Crime Information Center (NCIC), according to sources cited by CNN and the Associated Press. The FBI did not respond to requests for comment, and the sources said the cyberattack occurred on Thursday. President Donald Trump said he had been briefed and described the incident as “not good.”\u003c/p\u003e\n\n\u003cp\u003eNCIC is used by local, state, and federal law-enforcement agencies to share information about criminals, fugitives, missing people, outstanding warrants, and investigations. The database contains sensitive information that could be valuable to criminals and others, and Trump said the incident may allow public access to investigative files related to him. If confirmed, this would be the FBI’s second cybersecurity incident this year, following the reported ShinyHunters breach of the FBI’s job site in September.\u003c/p\u003e\n"},{"n":4,"title":"OpenRouter drops AI providers over leaked prompts and secrets","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/openrouter-drops-ai-providers-over-leaked-prompts-and-secrets/","time":"20:00","priority":"SHOULD READ","score":84,"tldr":"OpenRouter removed Together AI, Phala, and Novita after tests revealed that sensitive prompts and decoy credentials could leak from their inference systems, and it revoked Zero Data Retention status for 125 endpoints. Affected users are advised to rotate any secrets included in AI requests.","briefOverview":"\u003cp\u003eOpenRouter removed Together AI, Phala, and Novita from its platform after Dragos found indications that data handled by at least three AI providers had been exposed. Dragos sent two million test prompts containing unique tracking links or decoy credentials and observed attempts to use those credentials against controlled systems and canary AWS accounts. OpenRouter said its own systems were not breached and that the exposure occurred at the provider level.\u003c/p\u003e\n\n\u003cp\u003eAs a precaution, OpenRouter revoked Zero Data Retention eligibility for 125 endpoints and notified potentially affected customers. Together AI attributed the issue to a GitHub repository credential exposed by an AI coding agent, Phala reported a compromised request-processing server, and Novita reported a routing error that sent some MiniMax requests to MiniMax\u0026rsquo;s official API. Atlas Cloud also withdrew its models from OpenRouter while it conducts security testing, and the providers advised affected users to rotate any secrets included in leaked requests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenRouter removed Together AI, Phala, and Novita after Dragos found evidence that data from at least three AI providers had been exposed.","Dragos sent two million test prompts containing unique tracking links or decoy credentials and observed attempts to access its controlled systems and canary AWS accounts.","OpenRouter revoked Zero Data Retention eligibility for 125 endpoints, notified potentially affected customers, and said its own systems were not breached.","Together AI attributed leaked prompt samples to an exposed GitHub repository credential, Phala reported a compromised request-processing server, and Novita reported a routing misconfiguration that sent some requests to MiniMax's official API.","OpenRouter plans to use adapted Dragos tests to continuously check whether providers forward or leak user requests and responses before restoring Zero Data Retention eligibility."],"insights":["A single OpenRouter request can pass through a separate inference provider, meaning data-handling risk depends not only on the broker but also on the company selected to run the model.","Dragos demonstrated possible prompt exposure by embedding unique links and decoy credentials in two million test requests, then detecting their use against controlled systems.","The affected providers described different paths to exposure: a leaked source-code repository credential, a compromised processing server, and an incorrect routing configuration.","OpenRouter revoked Zero Data Retention eligibility from 125 endpoints as a precaution and will require validation testing before restoring that status."],"referencedReports":[{"title":"AI Supply Chain Security Canary Tokens","url":"https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens","publisher":"dragos","context":"Dragos reported results from two million seeded test prompts that indicated data from at least three AI providers was exposed.","category":"research","primary":true},{"title":"Phala November Preliminary Incident Report","url":"https://phala.com/posts/phala-november-preliminary-incident-report","publisher":"phala","context":"Phala's preliminary incident report describes a compromised server that processed certain OpenRouter-routed requests.","category":"advisory","primary":false}],"body":"\u003cp\u003eOpenRouter removed Together AI, Phala, and Novita from its platform after Dragos found indications that data handled by at least three AI providers had been exposed. Dragos sent two million test prompts containing unique tracking links or decoy credentials and observed attempts to use those credentials against controlled systems and canary AWS accounts. OpenRouter said its own systems were not breached and that the exposure occurred at the provider level.\u003c/p\u003e\n\n\u003cp\u003eAs a precaution, OpenRouter revoked Zero Data Retention eligibility for 125 endpoints and notified potentially affected customers. Together AI attributed the issue to a GitHub repository credential exposed by an AI coding agent, Phala reported a compromised request-processing server, and Novita reported a routing error that sent some MiniMax requests to MiniMax\u0026rsquo;s official API. Atlas Cloud also withdrew its models from OpenRouter while it conducts security testing, and the providers advised affected users to rotate any secrets included in leaked requests.\u003c/p\u003e\n"},{"n":16,"title":"AI-Assisted Cyberattacks Trigger Unauthorized Payments at Indian Banks and Fintech Firms","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/ai-assisted-cyberattacks-trigger.html","time":"08:24","priority":"SHOULD READ","score":84,"tldr":"CERT-In warns that AI-assisted attackers are abusing legitimate business workflows, records, and approval processes to trigger unauthorized payments at Indian banks, fintechs, and government-linked service providers. Agentic offensive tools are accelerating reconnaissance, exploitation, and lateral movement, shrinking financially motivated intrusions from days to hours.","briefOverview":"\u003cp\u003eCERT-In warned that AI-assisted attackers are targeting Indian information and communication technology assets, causing unauthorized financial transactions at banks, financial services firms, technology providers, and government-linked payment platforms. The agency said attackers altered business records or approval relationships and then used otherwise legitimate payment processes rather than directly exploiting payment APIs. It did not identify the actors involved or disclose the amount improperly paid out.\u003c/p\u003e\n\n\u003cp\u003eThe Indian Cybercrime Coordination Centre said campaigns against banks, non-banking financial companies, and fintechs led to multi-crore unauthorized transactions through fund-disbursement systems and payment-transfer interfaces. It said attackers compromise unpatched or misconfigured internet-facing systems, move funds into mule accounts, and quickly transfer or withdraw the money through IMPS and NEFT. CERT-In advised organizations to review the security of business applications, critical records, identities, and third-party interfaces, and to account for abuse of trusted processes in monitoring and incident response.\u003c/p\u003e\n\n\u003cp\u003eCERT-In also reported that agentic offensive frameworks can automate reconnaissance, create and modify exploits, conduct intrusion tasks in parallel, and adapt when blocked. In financially motivated Indian campaigns, the agency said such tooling compressed the period from initial access to final impact from days to a few hours. The article describes broader global use of tools including ARTEX, CAIRN, CyberStrikeAI, and exploit_agent, underscoring that AI-driven tools can speed up multi-stage intrusions and can themselves become targets when connected to sensitive code, credentials, data, or applications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-In warned that AI-assisted attackers are targeting Indian ICT assets and causing unauthorized financial transactions at banks, financial services firms, technology providers, and government-linked payment platforms.","The observed incidents involved altering business records or approval relationships and then using legitimate payment processes, rather than directly exploiting payment APIs.","CERT-In said agentic offensive frameworks can automate reconnaissance, generate and modify exploits, run intrusion tasks in parallel, and adapt their actions when attempts are blocked.","The Indian Cybercrime Coordination Centre said attacks on banks, non-banking financial companies, and fintech firms have resulted in multi-crore unauthorized transactions through fund-disbursement systems and payment-transfer APIs.","CERT-In said financially motivated AI-assisted campaigns compressed the period from initial access to final impact from days to a few hours."],"insights":["The Indian payment incidents relied on trusted business systems and established approval procedures, meaning unauthorized transfers could be processed without alerts when independent review and reconciliation controls were weak.","CERT-In reported that AI-driven operations reduced the time from initial access to financial impact from days to only a few hours, while multiple AI agents could work in parallel for hours or days.","Check Point found more than 1,800 publicly exposed ARTEX instances and observed that operators often provided only an initial goal while agent fleets carried out most activity autonomously.","Amazon described one ARTEX campaign as self-sustaining because stolen AI-service credentials funded the model usage needed to continue searching for more credentials.","The article notes that AI-enabled enterprise tools are themselves becoming targets when they have access to code, credentials, data, or connected applications."],"referencedReports":[{"title":"CERT-In Advisory CIAD-2026-0062","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02\u0026VLCODE=CIAD-2026-0062","publisher":"cert-in","context":"CERT-In used this advisory to warn that attackers abused business records and approval processes to conduct unauthorized financial transactions in India.","category":"advisory","primary":true},{"title":"CERT-In Advisory CIAD-2026-0046","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02\u0026VLCODE=CIAD-2026-0046","publisher":"cert-in","context":"The article cites this CERT-In advisory regarding AI-assisted attacks on Indian financial entities and AI agents exceeding authorization.","category":"advisory","primary":false},{"title":"CERT-In Advisory CIAD-2026-0049","url":"https://www.cert-in.org.in/s2cMainServlet?pageid=PUBVLNOTES02\u0026VLCODE=CIAD-2026-0049","publisher":"cert-in","context":"CERT-In cited this advisory for its assessment that agentic tooling reduced the time from initial access to financial impact to hours.","category":"advisory","primary":false},{"title":"AI-Assisted Cyber Attack on Banks, NBFCs","url":"https://i4c.mha.gov.in/theme/resources/advisories/AI-Assisted-Cyber-Attack-on-Banks-NBFCs.pdf","publisher":"indian-cybercrime-coordination-centre","context":"I4C described attacks against banks, non-banking financial companies, and fintechs that resulted in multi-crore unauthorized transactions.","category":"advisory","primary":true},{"title":"FBI Cybersecurity Advisory 261113","url":"https://www.ic3.gov/CSA/2026/261113.pdf","publisher":"federal-bureau-of-investigation","context":"The FBI alert states that ARTEX can accelerate chained attack techniques and enable less-skilled actors to conduct complex operations at scale.","category":"advisory","primary":false},{"title":"Hacking on Autopilot: Inside ARTEX Cybercrime Campaigns","url":"https://research.checkpoint.com/2026/hacking-on-autopilot-inside-artex-cybercrime-campaigns/","publisher":"check-point","context":"Check Point reported finding more than 1,800 publicly exposed ARTEX instances and observed largely autonomous agent operations.","category":"research","primary":false},{"title":"Agentic Threat Activity Crosses a Significant Threshold","url":"https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold","publisher":"google-mandiant-and-threat-intelligence-group","context":"Mandiant and Google Threat Intelligence Group described exploit_agent, an autonomous framework used to analyze patches, develop exploits, and execute them.","category":"research","primary":false},{"title":"ARTEX Is Evidence AI Is Compressing the Cyberattack Timeline","url":"https://www.cohesity.com/blogs/artex-is-evidence-ai-is-compressing-the-cyberattack-timeline/","publisher":"cohesity","context":"Cohesity described an AI framework being used to rapidly rewrite tools in response to obstacles during activity linked to Rhysida.","category":"research","primary":false},{"title":"AI Cyber Threat Trends 2026","url":"https://www.recordedfuture.com/research/ai-cyber-threat-trends-2026","publisher":"recorded-future","context":"Recorded Future reported that AI-enabled enterprise tools with access to code, credentials, data, or connected applications create new attack surfaces.","category":"research","primary":false},{"title":"CAIRN Framework: AI Autonomous Attacks","url":"https://unit42.paloaltonetworks.com/cairn-framework-ai-autonomous-attacks/","publisher":"palo-alto-networks-unit-42","context":"Unit 42 analyzed CAIRN activity attributed to CL-STA-1238 and described its shared blackboard mechanism for coordinating agents.","category":"research","primary":false}],"body":"\u003cp\u003eCERT-In warned that AI-assisted attackers are targeting Indian information and communication technology assets, causing unauthorized financial transactions at banks, financial services firms, technology providers, and government-linked payment platforms. The agency said attackers altered business records or approval relationships and then used otherwise legitimate payment processes rather than directly exploiting payment APIs. It did not identify the actors involved or disclose the amount improperly paid out.\u003c/p\u003e\n\n\u003cp\u003eThe Indian Cybercrime Coordination Centre said campaigns against banks, non-banking financial companies, and fintechs led to multi-crore unauthorized transactions through fund-disbursement systems and payment-transfer interfaces. It said attackers compromise unpatched or misconfigured internet-facing systems, move funds into mule accounts, and quickly transfer or withdraw the money through IMPS and NEFT. CERT-In advised organizations to review the security of business applications, critical records, identities, and third-party interfaces, and to account for abuse of trusted processes in monitoring and incident response.\u003c/p\u003e\n\n\u003cp\u003eCERT-In also reported that agentic offensive frameworks can automate reconnaissance, create and modify exploits, conduct intrusion tasks in parallel, and adapt when blocked. In financially motivated Indian campaigns, the agency said such tooling compressed the period from initial access to final impact from days to a few hours. The article describes broader global use of tools including ARTEX, CAIRN, CyberStrikeAI, and exploit_agent, underscoring that AI-driven tools can speed up multi-stage intrusions and can themselves become targets when connected to sensitive code, credentials, data, or applications.\u003c/p\u003e\n"},{"n":18,"title":"Critical binary-parser Flaw Enables JavaScript Injection via Malicious Parser Definitions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-binary-parser-flaw-enables.html","time":"13:22","priority":"SHOULD READ","score":84,"tldr":"Binary-parser versions before 2.3.1 have a critical code-injection flaw (CVE-2026-134814) that can let attackers who control parser definitions execute arbitrary JavaScript in Node.js during parser compilation. Users should upgrade to version 2.3.1 or later.","briefOverview":"\u003cp\u003eA critical code-injection flaw, CVE-2026-134814, affects binary-parser versions before 2.3.1. The issue can allow attackers who control parser definitions to execute arbitrary JavaScript in the Node.js process when a parser is compiled. The vulnerability has been assigned CVSS scores of 9.2 and 8.1.\u003c/p\u003e\n\n\u003cp\u003eThe problem arose because certain user-controlled string options were inserted into generated JavaScript without sufficient validation. Affected options include length, lengthInBytes, key, tag, offset, and aliases supplied through namely(). Parsing untrusted binary data with a trusted parser definition is not affected, according to the maintainer. Version 2.3.1 validates these values as identifier paths and rejects expressions such as \u0026ldquo;len - 1,\u0026rdquo; while CVE-2026-134814 is also described as an incomplete fix for the earlier CVE-2026-1245.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Binary-parser versions before 2.3.1 contain CVE-2026-134814, a code-injection flaw that can allow arbitrary JavaScript execution when an attacker controls parser definitions.","The flaw stems from string options such as length, lengthInBytes, key, tag, offset, and aliases passed to namely() being inserted into generated JavaScript without adequate validation.","The vulnerability is triggered when a crafted parser definition is compiled in a Node.js process, not simply by parsing untrusted binary data with a trusted parser definition.","The binary-parser maintainer stated that version 2.3.1 validates these options as identifier paths and rejects expressions such as \"len - 1.\"","CVE-2026-134814 is described as an incomplete fix for CVE-2026-1245, an earlier code-injection issue involving insufficient validation of field names and encoding parameters."],"insights":["The risk depends on who controls the parser definition: processing untrusted binary data alone is not affected when the parser definition is trusted.","The patch deliberately disallows expression-style option values such as \"len - 1\" and requires a function instead, which may require application changes beyond simply updating the package.","The issue was identified as an incomplete fix for CVE-2026-1245, showing that earlier validation improvements did not cover all user-controlled parser options.","The malicious code executes when the parser is compiled, meaning the dangerous input is the parser setup information rather than the binary data being parsed."],"referencedReports":[{"title":"GHSA-xmxc-6c22-m377: Code injection in binary-parser","url":"https://github.com/keichi/binary-parser/security/advisories/GHSA-xmxc-6c22-m377","publisher":"binary-parser project maintainer","context":"The article cites the project maintainer's advisory explaining that trusted parser definitions are not affected and that affected options are now validated as identifier paths.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical code-injection flaw, CVE-2026-134814, affects binary-parser versions before 2.3.1. The issue can allow attackers who control parser definitions to execute arbitrary JavaScript in the Node.js process when a parser is compiled. The vulnerability has been assigned CVSS scores of 9.2 and 8.1.\u003c/p\u003e\n\n\u003cp\u003eThe problem arose because certain user-controlled string options were inserted into generated JavaScript without sufficient validation. Affected options include length, lengthInBytes, key, tag, offset, and aliases supplied through namely(). Parsing untrusted binary data with a trusted parser definition is not affected, according to the maintainer. Version 2.3.1 validates these values as identifier paths and rejects expressions such as \u0026ldquo;len - 1,\u0026rdquo; while CVE-2026-134814 is also described as an incomplete fix for the earlier CVE-2026-1245.\u003c/p\u003e\n"},{"n":26,"title":"Dragos Canary Research: AI Data Security Risks | Cyera","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/2-million-prompts-3-breaches-what-the-dragos-canary-research-means-for-your-data","time":"22:24","priority":"SHOULD READ","score":84,"tldr":"Dragos researchers found that AI prompts sent through hosting providers and marketplaces—including requests marked zero data retention—were exposed through provider breaches, reseller logging, and undisclosed routing. Organizations should treat prompts as sensitive outbound data, restrict AI routing, scan agent inputs for secrets, and maintain records of what agents send.","briefOverview":"\u003cp\u003eDragos researchers placed unique, trackable secrets in about 2 million prompts sent through widely used AI services and reported three major
