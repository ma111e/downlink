<script type="application/json" id="dl-articles">[{"n":1,"title":"Massive ChainDrop npm supply-chain attack infects hundreds of packages","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/massive-chaindrop-npm-supply-chain-attack-infects-hundreds-of-packages/","time":"15:24","priority":"MUST READ","score":98,"tldr":"A self-propagating npm worm called ChainDrop compromised more than 1,300 packages, including popular utilities like Keyv and Cacheable, by abusing legitimate GitHub Actions releases to steal developer, cloud, and CI/CD credentials. Anyone who installed affected versions should treat their workstation or runner as compromised, rebuild systems, rotate exposed secrets, and check repositories and logs for unauthorized activity.","briefOverview":"\u003cp\u003eSelf-propagating malware named ChainDrop has compromised more than 1,300 npm packages with a combined 2 billion monthly downloads. Infected packages include popular caching utilities such as Keyv, Cacheable, flat-cache, and file-entry-cache. The attack started after a threat actor compromised the GitHub account of Keyv’s maintainer and then spread to packages associated with organizations including Deliveroo, Ornikar, OneReach, Picsart, Qlik, and ServiceTitan.\u003c/p\u003e\n\n\u003cp\u003eSecurity companies found that the attack deployed a Shai-Hulud-based worm that pushed malicious files directly to project main branches and generated new package releases. Because the packages were built and published through legitimate GitHub Actions workflows, the compromised npm releases carried valid provenance information. The poisoned packages included a setup.mjs dropper, a Math_Symbol.js or math_init.js infostealer script, and a package.json preinstall entry that automatically ran the dropper during npm install.\u003c/p\u003e\n\n\u003cp\u003eThe malware downloads the Bun JavaScript runtime from the official GitHub release to execute the infostealer, which collects developer and cloud credentials from compromised environments. The article says it can gather environment data, local credential files, GitHub and npm tokens, AWS credentials, Kubernetes secrets, Vault tokens, database credentials, private keys, and credentials for services such as Stripe, Slack, Twilio, Azure, and GCP. Administrators who installed an affected package version are advised to treat the workstation or CI/CD runner as compromised, rebuild systems, rotate accessible tokens, and review logs and repositories for unauthorized access or changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Self-propagating malware named ChainDrop has compromised more than 1,300 npm packages with a combined 2 billion monthly downloads.","The attack began after a threat actor compromised the GitHub account of Keyv’s maintainer and spread to packages associated with organizations including Deliveroo, Ornikar, OneReach, Picsart, Qlik, and ServiceTitan.","The compromised packages contain a setup.mjs dropper, an infostealing script named Math_Symbol.js or math_init.js, and a package.json preinstall entry that runs the dropper during npm install.","The malware collects developer and cloud credentials, including GitHub and npm tokens, AWS credentials, Kubernetes secrets, Vault tokens, database credentials, private keys, and credentials for Stripe, Slack, Twilio, Azure, and GCP.","Administrators who installed affected package versions are advised to treat workstations or CI/CD runners as compromised, rebuild systems, rotate accessible tokens, and review logs and repositories for unauthorized activity."],"insights":["Because the malicious releases were built and published through legitimate GitHub Actions workflows, they carried valid provenance information despite being compromised.","The malware validates npm tokens in real time against registry.npmjs.org/-/whoami before stealing them, indicating that exposed tokens should be assumed usable if they were present in an affected environment.","Removing an affected package after installation is not sufficient, because the article says impacted developer workstations or CI/CD runners should still be treated as compromised.","The npm-cache.com domain is identified by Wiz as a strong indicator of compromise for data exfiltration and should be investigated in network logs.","The use of Bun downloaded from the official GitHub release means defenders should not treat the Bun executable alone as suspicious without also checking the surrounding setup.mjs and Math_Symbol.js or math_init.js activity."],"referencedReports":[{"title":"Keyv and friends compromised in npm supply chain attack","url":"https://www.aikido.dev/blog/keyv-and-friends-compromised-in-npm-supply-chain-attack","publisher":"Aikido","context":"The article cites Aikido’s report for the number of compromised packages, how malicious files were pushed and released, and how the payload executed and stole credentials.","category":"research","primary":true},{"title":"Keyv and Cacheable npm supply-chain attack","url":"https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack","publisher":"Wiz","context":"The article links Wiz as a source for compromised package lists and indicators of compromise, and cites Wiz on the npm-cache.com exfiltration domain.","category":"research","primary":false},{"title":"ChainDrop npm Worm","url":"https://www.stepsecurity.io/blog/chaindrop-npm-worm","publisher":"StepSecurity","context":"The article links StepSecurity as a source for compromised package lists and indicators of compromise related to the ChainDrop npm worm.","category":"research","primary":false},{"title":"Keyv and Cacheable Compromise","url":"https://socket.dev/supply-chain-attacks/keyv-and-cacheable-compromise","publisher":"Socket","context":"The article links Socket as a source for compromised package lists and indicators of compromise related to the Keyv and Cacheable compromise.","category":"research","primary":false},{"title":"A New Infostealer Worm Hits NPM Affecting Keyv and Cacheable","url":"https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable","publisher":"Ox Security","context":"The article links Ox Security as a source for compromised package lists and indicators of compromise for the npm infostealer worm.","category":"research","primary":false}],"body":"\u003cp\u003eSelf-propagating malware named ChainDrop has compromised more than 1,300 npm packages with a combined 2 billion monthly downloads. Infected packages include popular caching utilities such as Keyv, Cacheable, flat-cache, and file-entry-cache. The attack started after a threat actor compromised the GitHub account of Keyv’s maintainer and then spread to packages associated with organizations including Deliveroo, Ornikar, OneReach, Picsart, Qlik, and ServiceTitan.\u003c/p\u003e\n\n\u003cp\u003eSecurity companies found that the attack deployed a Shai-Hulud-based worm that pushed malicious files directly to project main branches and generated new package releases. Because the packages were built and published through legitimate GitHub Actions workflows, the compromised npm releases carried valid provenance information. The poisoned packages included a setup.mjs dropper, a Math_Symbol.js or math_init.js infostealer script, and a package.json preinstall entry that automatically ran the dropper during npm install.\u003c/p\u003e\n\n\u003cp\u003eThe malware downloads the Bun JavaScript runtime from the official GitHub release to execute the infostealer, which collects developer and cloud credentials from compromised environments. The article says it can gather environment data, local credential files, GitHub and npm tokens, AWS credentials, Kubernetes secrets, Vault tokens, database credentials, private keys, and credentials for services such as Stripe, Slack, Twilio, Azure, and GCP. Administrators who installed an affected package version are advised to treat the workstation or CI/CD runner as compromised, rebuild systems, rotate accessible tokens, and review logs and repositories for unauthorized access or changes.\u003c/p\u003e\n"},{"n":9,"title":"Mini Shai-Hulud Hits keyv: Trojanized Release Exfiltrates CI Secrets via GitHub","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/keyv-malicious-packages/","time":"15:46","priority":"MUST READ","score":93,"tldr":"A trojanized npm release, keyv@6.0.0, used a preinstall hook to run an obfuscated Bun-based payload that harvested CI, cloud, npm, GitHub, Vault, and Kubernetes secrets while exfiltrating through trusted GitHub APIs. The key defense is to treat any installation of the affected version as credential exposure, remove persistence artifacts, rotate reachable secrets, and disable install-time lifecycle scripts by default.","briefOverview":"\u003cp\u003eOn August 4, 2026, a malicious version of \u003ccode\u003ekeyv\u003c/code\u003e was published to npm as \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, affecting packages across the Keyv and Cacheable ecosystem. The release followed the Mini Shai-Hulud pattern: a heavily depended-on package was trojanized with an install-time hook aimed at cloud and CI credentials. The compiled library under \u003ccode\u003edist/\u003c/code\u003e was unchanged, while \u003ccode\u003epackage.json\u003c/code\u003e added a \u003ccode\u003epreinstall\u003c/code\u003e hook and the tarball included \u003ccode\u003esetup.mjs\u003c/code\u003e and \u003ccode\u003eMath_Symbol.js\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attack mattered because it did not require any application code to import or run \u003ccode\u003ekeyv\u003c/code\u003e; the malicious code executed before installation completed. \u003ccode\u003esetup.mjs\u003c/code\u003e downloaded a Bun runtime and used it to run the obfuscated \u003ccode\u003eMath_Symbol.js\u003c/code\u003e bundle, which contained references to AWS, HashiCorp Vault, Kubernetes, Google Cloud, Azure, npm, and GitHub Actions credentials. The bundle also included batching logic, CI runner environment variables, and strings tied to GitHub repository creation and commits.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that no attacker-controlled domain appeared in the payload, with exfiltration and repository creation relying on trusted services such as GitHub’s own API. It also notes that the bundle contained npm provenance components, meaning a package republished with stolen registry and Actions tokens could carry a legitimate-looking provenance badge. Recommended remediation includes removing persistence artifacts, checking lockfiles for \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, reviewing GitHub accounts for unexpected repositories, rotating reachable credentials and stored secrets, pinning a known-good replacement, and using \u003ccode\u003e--ignore-scripts\u003c/code\u003e in CI by default.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On August 4, 2026, a malicious version of keyv was published to npm as keyv@6.0.0, affecting packages across the Keyv and Cacheable ecosystem.","The malicious release left the compiled library under dist unchanged but added setup.mjs, Math_Symbol.js, and a package.json preinstall hook that runs before installation completes.","The obfuscated payload targeted credentials and tokens for AWS, HashiCorp Vault, Kubernetes, Google Cloud, Azure, npm, and GitHub Actions.","The bundle used GitHub’s own API, including the authenticated-user repository creation endpoint, so defenders would not see an attacker-controlled exfiltration domain in network logs.","The article recommends removing persistence artifacts, checking lockfiles for exposure, reviewing GitHub accounts for unexpected repositories, rotating reachable credentials and stored secrets, pinning a known-good replacement version, and using --ignore-scripts in CI."],"insights":["A source or library-code review could miss the compromise because the compiled dist/ directory was identical to the prior release; the malicious behavior was introduced only through packaging metadata and extra files included in the npm tarball.","Network blocklists are ineffective for this incident because the payload did not rely on an attacker-controlled domain and instead used trusted services such as GitHub’s own API.","Signed provenance cannot be treated as proof of legitimacy in this case because the payload included npm provenance components that could allow a package republished with stolen registry and GitHub Actions tokens to carry a legitimate-looking provenance badge.","Credential rotation alone may be incomplete because the payload included functions for retrieving secrets from AWS Secrets Manager, SSM Parameter Store, and Vault KV, meaning the stored secrets themselves may also need to be re-keyed.","Lockfiles are the most reliable way to distinguish actual exposure from general dependency use because they record the exact package artifact or version that was installed."],"referencedReports":[],"body":"\u003cp\u003eOn August 4, 2026, a malicious version of \u003ccode\u003ekeyv\u003c/code\u003e was published to npm as \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, affecting packages across the Keyv and Cacheable ecosystem. The release followed the Mini Shai-Hulud pattern: a heavily depended-on package was trojanized with an install-time hook aimed at cloud and CI credentials. The compiled library under \u003ccode\u003edist/\u003c/code\u003e was unchanged, while \u003ccode\u003epackage.json\u003c/code\u003e added a \u003ccode\u003epreinstall\u003c/code\u003e hook and the tarball included \u003ccode\u003esetup.mjs\u003c/code\u003e and \u003ccode\u003eMath_Symbol.js\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attack mattered because it did not require any application code to import or run \u003ccode\u003ekeyv\u003c/code\u003e; the malicious code executed before installation completed. \u003ccode\u003esetup.mjs\u003c/code\u003e downloaded a Bun runtime and used it to run the obfuscated \u003ccode\u003eMath_Symbol.js\u003c/code\u003e bundle, which contained references to AWS, HashiCorp Vault, Kubernetes, Google Cloud, Azure, npm, and GitHub Actions credentials. The bundle also included batching logic, CI runner environment variables, and strings tied to GitHub repository creation and commits.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that no attacker-controlled domain appeared in the payload, with exfiltration and repository creation relying on trusted services such as GitHub’s own API. It also notes that the bundle contained npm provenance components, meaning a package republished with stolen registry and Actions tokens could carry a legitimate-looking provenance badge. Recommended remediation includes removing persistence artifacts, checking lockfiles for \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, reviewing GitHub accounts for unexpected repositories, rotating reachable credentials and stored secrets, pinning a known-good replacement, and using \u003ccode\u003e--ignore-scripts\u003c/code\u003e in CI by default.\u003c/p\u003e\n"},{"n":12,"title":"DentaQuest Data Theft Hack Affects 15M Patients","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/dentaquest-data-theft-hack-affects-15m-patients/","time":"17:26","priority":"MUST READ","score":92,"tldr":"DentaQuest is notifying 15 million people that sensitive data was compromised in a May breach, far more than the ShinyHunters extortion group initially claimed. Health-ISAC warned that ShinyHunters’ pay-or-leak data theft campaigns are increasingly targeting healthcare organizations at scale.","briefOverview":"\u003cp\u003eDentaQuest, one of the largest dental and vision benefits administrators in the United States, is notifying 15 million people that their sensitive information was compromised in a May hack. The article says the number of victims is five times higher than the claims made by the ShinyHunters ransomware gang. Health-ISAC highlighted that company notification numbers may include a broader set of data that was potentially accessible during an intrusion window.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at the Health Information Sharing and Analysis Center, said attacker claims can reflect what attackers think they stole or choose to claim. He also said confirmed affected counts can rise as forensic investigations continue. Health-ISAC has warned the healthcare sector about ShinyHunters’ evolving and persistent threats.\u003c/p\u003e\n\n\u003cp\u003eWeiss described ShinyHunters as using a pure “pay-or-leak” data extortion model rather than a traditional malware-encrypting scheme. He said the group represents a massive wave of cloud-scale data exfiltration and is a prolific and dominant threat right now. According to Weiss, ShinyHunters has recently targeted major medical device manufacturers, dental administrators, and primary care networks, exposing millions of sensitive records.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DentaQuest is notifying 15 million people that their sensitive information was compromised in a May hack.","The reported number of victims is five times higher than the claims made by the ShinyHunters ransomware gang.","Health-ISAC Chief Security Officer Errol Weiss said attacker claims may reflect what attackers think they stole or choose to claim, while company notification numbers account for data potentially accessible during the intrusion window.","Health-ISAC warned the healthcare sector about ShinyHunters’ evolving and persistent threats.","Errol Weiss said ShinyHunters uses a pay-or-leak data extortion model rather than a traditional malware encryption scheme."],"insights":["The gap between ShinyHunters’ claimed victim count and DentaQuest’s 15 million notifications shows that attacker claims may significantly understate the population a company must treat as potentially affected.","Health-ISAC’s comments indicate that confirmed affected counts can rise during a forensic investigation, so initial breach figures may not represent the final scope.","ShinyHunters’ focus on data theft and public leak pressure means organizations may face extortion even when attackers do not encrypt systems.","Health-ISAC described ShinyHunters as a current dominant threat because the group has recently hit multiple types of healthcare-related organizations, including medical device manufacturers, dental administrators, and primary care networks."],"referencedReports":[],"body":"\u003cp\u003eDentaQuest, one of the largest dental and vision benefits administrators in the United States, is notifying 15 million people that their sensitive information was compromised in a May hack. The article says the number of victims is five times higher than the claims made by the ShinyHunters ransomware gang. Health-ISAC highlighted that company notification numbers may include a broader set of data that was potentially accessible during an intrusion window.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at the Health Information Sharing and Analysis Center, said attacker claims can reflect what attackers think they stole or choose to claim. He also said confirmed affected counts can rise as forensic investigations continue. Health-ISAC has warned the healthcare sector about ShinyHunters’ evolving and persistent threats.\u003c/p\u003e\n\n\u003cp\u003eWeiss described ShinyHunters as using a pure “pay-or-leak” data extortion model rather than a traditional malware-encrypting scheme. He said the group represents a massive wave of cloud-scale data exfiltration and is a prolific and dominant threat right now. According to Weiss, ShinyHunters has recently targeted major medical device manufacturers, dental administrators, and primary care networks, exposing millions of sensitive records.\u003c/p\u003e\n"},{"n":6,"title":"Greatness PhaaS Adds Device Code Phishing to Bypass MFA and Steal Tokens","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/greatness-phaas-adds-device-code.html","time":"17:27","priority":"SHOULD READ","score":84,"tldr":"The Greatness phishing-as-a-service kit now supports device code phishing, letting attackers abuse legitimate Microsoft OAuth flows to bypass MFA and steal long-lived tokens without a fake login page. Defenders should block device code authentication where possible, tighten Conditional Access and vendor safe-sender rules, and move users to phishing-resistant MFA.","briefOverview":"\u003cp\u003eThe commercial phishing-as-a-service toolkit Greatness has added support for device code phishing, which abuses the legitimate OAuth 2.0 Device Authorization Grant to bypass MFA and seize control of user accounts. ZeroBEC said the platform now supports adversary-in-the-middle credential and token theft, device code phishing, OAuth consent abuse, and targeting of platforms including Microsoft 365, iCloud, Yahoo, and Google Workspace. Greatness is sold through a public Telegram channel with more than 3,250 subscribers, with subscriptions starting at $289 per month and access to an operator dashboard, campaign statistics, domain configuration, CAPTCHA selection, and phishing lure templates.\u003c/p\u003e\n\n\u003cp\u003eVictims who click Greatness phishing links are sent through a five-stage redirect chain with anti-analysis protections, User-Agent fingerprinting, and a CAPTCHA gate before reaching either an adversary-in-the-middle proxy or a device code endpoint. Recent campaigns used spoofed RingCentral voicemail lures that reached inboxes by exploiting safe sender exclusions even though the emails failed SPF, DKIM, and DMARC checks. ZeroBEC observed harvested authentication tokens being replayed within minutes from proxy infrastructure and used to enumerate Microsoft 365 resources through the Microsoft Graph API, including Outlook, Teams, SharePoint, Exchange, OneDrive, contacts, calendars, and registered applications. The article says device code phishing can be prevented by blocking the authentication method globally in Conditional Access Policies, moving to phishing-resistant MFA, and teaching employees to distrust unexpected codes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Greatness phishing-as-a-service toolkit now supports device code phishing, adversary-in-the-middle credential and token theft, OAuth consent abuse, and targeting of platforms including Microsoft 365, iCloud, Yahoo, and Google Workspace.","Greatness is sold through a public Telegram channel with more than 3,250 subscribers, with subscriptions starting at $289 per month and access to an operator dashboard for campaign statistics, domain configuration, CAPTCHA selection, and phishing lure templates.","Victims who click Greatness phishing links pass through a five-stage redirect chain with anti-analysis protections, User-Agent fingerprinting, and a CAPTCHA gate before reaching either an adversary-in-the-middle proxy or a device code endpoint.","Recent Greatness campaigns used spoofed RingCentral voicemail lures that reached victims’ inboxes by exploiting safe sender exclusions even though the emails failed SPF, DKIM, and DMARC checks.","ZeroBEC observed stolen authentication tokens being replayed within minutes from proxy infrastructure and used to enumerate Microsoft 365 resources such as Outlook, Teams, SharePoint, Exchange, OneDrive, contacts, calendars, and registered applications through the Microsoft Graph API."],"insights":["Device code phishing is especially difficult for users to recognize because the password is entered on a real Microsoft page, with the only unusual element being a short code and a plausible reason to enter it.","Safe sender exclusions can undermine email authentication controls, as recent Greatness campaigns reached inboxes despite failing SPF, DKIM, and DMARC checks by exploiting trust tied to legitimate RingCentral customers.","Vendor breach disclosures should trigger reviews of email exclusion rules, because exposed customer lists can reveal which organizations are likely to trust a vendor’s domains.","Stolen tokens can remain useful well after the initial compromise, with ZeroBEC observing an AiTM proxy IP authenticating against a victim Microsoft 365 account more than two weeks after the phishing campaign.","Blocking the OAuth device code authentication flow globally in Conditional Access Policies is a direct mitigation, with narrow exclusions only where the flow is explicitly required and continuously audited."],"referencedReports":[{"title":"Greatness PhaaS: AiTM and Device Code Phishing","url":"https://zerobec.com/blog/greatness-phaas-aitm-and-device-code-phishing","publisher":"ZeroBEC","context":"The article cites ZeroBEC's report as the source detailing Greatness PhaaS's latest support for AiTM token theft, device code phishing, OAuth consent abuse, and expanded target platforms.","category":"research","primary":true},{"title":"Device Code Phishing","url":"https://www.trendmicro.com/en_us/research/26/g/device-code-phishing.html","publisher":"Trend Micro","context":"The article quotes Trend Micro's analysis explaining how device code phishing differs from adversary-in-the-middle phishing and why it is cleaner for attackers.","category":"research","primary":false},{"title":"AI-enabled device code phishing campaign – April 2026","url":"https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/","publisher":"Microsoft","context":"The article cites Microsoft for observed post-compromise activity in device code phishing attacks, including device registration for Primary Refresh Token persistence and delayed inbox-rule creation or email exfiltration.","category":"research","primary":false},{"title":"Tycoon 2FA phishing actors scatter","url":"https://www.okta.com/blog/threat-intelligence/tycoon_2fa_phishing_actors_scatter/","publisher":"Okta","context":"The article quotes Okta's May 2026 reporting on Tycoon 2FA-related device code phishing pages using CAPTCHAs, multi-hop redirect chains, and anti-analysis techniques.","category":"research","primary":false},{"title":"Go with the Flow: Abusing OAuth Device Code Flow","url":"https://www.levelblue.com/blogs/spiderlabs-blog/go-with-the-flow-abusing-oauth-device-code-flow","publisher":"LevelBlue","context":"The article cites LevelBlue for guidance that device code flow usage should be tightly limited, audited, and revoked when no longer necessary.","category":"guide","primary":false}],"body":"\u003cp\u003eThe commercial phishing-as-a-service toolkit Greatness has added support for device code phishing, which abuses the legitimate OAuth 2.0 Device Authorization Grant to bypass MFA and seize control of user accounts. ZeroBEC said the platform now supports adversary-in-the-middle credential and token theft, device code phishing, OAuth consent abuse, and targeting of platforms including Microsoft 365, iCloud, Yahoo, and Google Workspace. Greatness is sold through a public Telegram channel with more than 3,250 subscribers, with subscriptions starting at $289 per month and access to an operator dashboard, campaign statistics, domain configuration, CAPTCHA selection, and phishing lure templates.\u003c/p\u003e\n\n\u003cp\u003eVictims who click Greatness phishing links are sent through a five-stage redirect chain with anti-analysis protections, User-Agent fingerprinting, and a CAPTCHA gate before reaching either an adversary-in-the-middle proxy or a device code endpoint. Recent campaigns used spoofed RingCentral voicemail lures that reached inboxes by exploiting safe sender exclusions even though the emails failed SPF, DKIM, and DMARC checks. ZeroBEC observed harvested authentication tokens being replayed within minutes from proxy infrastructure and used to enumerate Microsoft 365 resources through the Microsoft Graph API, including Outlook, Teams, SharePoint, Exchange, OneDrive, contacts, calendars, and registered applications. The article says device code phishing can be prevented by blocking the authentication method globally in Conditional Access Policies, moving to phishing-resistant MFA, and teaching employees to distrust unexpected codes.\u003c/p\u003e\n"},{"n":7,"title":"Fake CAPTCHA, Real Business: Traffic Distribution for Hire","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/fake-captcha-real-business-traffic-distribution-for-hire","time":"15:00","priority":"SHOULD READ","score":84,"tldr":"Researchers found a large, active Fake CAPTCHA PDF factory hosted on Webflow’s CDN and indexed by Google, using SEO-poisoned PDFs to funnel victims into a custom traffic distribution system. The TDS filters visitors and monetizes them by routing qualified users to malware such as Legion Loader or scams, while sending others to ad landers.","briefOverview":"\u003cp\u003eNetskope found a large FakeCaptcha PDF operation that has produced more than 12,700 structurally similar documents and hosted them on Webflow’s content delivery network, where Google indexes them as ordinary “upgrade guides.” Each PDF contains a fake “I’m not a robot” panel that sends users into a traffic distribution system when clicked. Netskope says the operation has been active for more than 14 months and remains active, with exposure observed across 26 countries.\u003c/p\u003e\n\n\u003cp\u003eThe traffic distribution system filters visitors through IP and autonomous-system checks, a Cloudflare Turnstile challenge, JSON Web Tokens, and geo and device rules before deciding where to send them. Qualifying traffic is routed to downstream destinations including Legion Loader malware infrastructure, TDS reseller gates, and a premium-SMS subscription scam, while non-qualifying traffic is sent to search-arbitrage ad landers. The article emphasizes that the shared CDN host is difficult to block wholesale and that longer-lived detection points include the PDF structure and recurring wwNN router subdomain pattern rather than rotating lure domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope found more than 12,700 structurally similar FakeCaptcha PDF documents hosted on Webflow’s content delivery network and indexed by Google as ordinary “upgrade guides.”","Clicking the fake CAPTCHA in the PDFs sends visitors to a traffic distribution system that filters users by IP, bot challenge, geography, and device before routing them onward.","The operation routes qualifying traffic to downstream destinations including Legion Loader malware infrastructure, TDS reseller gates, and a premium-SMS subscription scam, while non-qualifying traffic is sent to search-arbitrage ad landers.","Netskope telemetry showed the downloads came overwhelmingly from search, with Google accounting for about 98% of the referrer mix across 26 countries.","The article says defenders should focus on longer-lived indicators such as the PDF structure and the recurring wwNN router subdomain pattern rather than only on lure domains that rotate within months."],"insights":["The use of Webflow’s shared CDN makes simple host-based blocking impractical because the same delivery host also serves legitimate Webflow customer content.","The campaign is optimized for both search engines and retrieval-based AI assistants by combining plausible titles, a clean CDN host, and thousands of words of on-topic SEO text inside each PDF.","The TDS monetizes even rejected visitors by sending non-qualifying traffic to search-arbitrage ad landers, so blocking only malware payloads misses part of the operator’s revenue model.","The article identifies longer-lived detection opportunities in the PDF structure and recurring wwNN router subdomain pattern, while noting that lure domains are the most perishable indicators.","Some 2025 intermediary domains were reused as 2026 front-door lure domains, showing infrastructure rotation without changing the underlying PDF factory and routing architecture."],"referencedReports":[],"body":"\u003cp\u003eNetskope found a large FakeCaptcha PDF operation that has produced more than 12,700 structurally similar documents and hosted them on Webflow’s content delivery network, where Google indexes them as ordinary “upgrade guides.” Each PDF contains a fake “I’m not a robot” panel that sends users into a traffic distribution system when clicked. Netskope says the operation has been active for more than 14 months and remains active, with exposure observed across 26 countries.\u003c/p\u003e\n\n\u003cp\u003eThe traffic distribution system filters visitors through IP and autonomous-system checks, a Cloudflare Turnstile challenge, JSON Web Tokens, and geo and device rules before deciding where to send them. Qualifying traffic is routed to downstream destinations including Legion Loader malware infrastructure, TDS reseller gates, and a premium-SMS subscription scam, while non-qualifying traffic is sent to search-arbitrage ad landers. The article emphasizes that the shared CDN host is difficult to block wholesale and that longer-lived detection points include the PDF structure and recurring wwNN router subdomain pattern rather than rotating lure domains.\u003c/p\u003e\n"},{"n":11,"title":"Health-ISAC warns of rising ShinyHunters data theft attacks on healthcare","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-warns-of-rising-shinyhunters-data-theft-attacks-on-healthcare/","time":"16:36","priority":"SHOULD READ","score":82,"tldr":"Health-ISAC warns that ShinyHunters is increasingly targeting healthcare and medical technology organizations through supply-chain and identity attacks that steal data from cloud SaaS and storage platforms. The group often abuses OAuth tokens obtained from third-party integration partners to access services such as Salesforce and Snowflake.","briefOverview":"\u003cp\u003eHealth-ISAC is warning healthcare and medical technology organizations about an observed increase in successful attacks by ShinyHunters. The article describes ShinyHunters as an extortion gang focused on data theft attacks. The warning is presented as a media mention linking to coverage in BleepingComputer.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, ShinyHunters primarily conducts supply chain and identity attacks to breach cloud SaaS and storage platforms. Over the past two years, the group has become known for numerous supply chain attacks on third-party integration partners. These breaches can give the attackers access to OAuth tokens used to integrate with SaaS providers such as Salesforce and Snowflake.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC is warning healthcare and medical technology organizations about an observed increase in successful attacks by ShinyHunters.","ShinyHunters is described as an extortion gang that primarily conducts supply chain and identity attacks to breach cloud SaaS and storage platforms in data theft attacks.","Over the past two years, ShinyHunters has become known for conducting numerous supply chain attacks on third-party integration partners.","Breaches of third-party integration partners give ShinyHunters access to OAuth tokens used to integrate with SaaS providers such as Salesforce and Snowflake."],"insights":["The warning points to third-party integration partners as a critical exposure point for healthcare organizations, because breaches there can provide access to connected SaaS environments.","OAuth tokens are a notable target in these attacks because the article says they are used to integrate with SaaS providers such as Salesforce and Snowflake.","The article highlights that ShinyHunters’ activity is not limited to direct intrusions into healthcare organizations, but also involves cloud SaaS and storage platforms connected through external partners."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC is warning healthcare and medical technology organizations about an observed increase in successful attacks by ShinyHunters. The article describes ShinyHunters as an extortion gang focused on data theft attacks. The warning is presented as a media mention linking to coverage in BleepingComputer.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, ShinyHunters primarily conducts supply chain and identity attacks to breach cloud SaaS and storage platforms. Over the past two years, the group has become known for numerous supply chain attacks on third-party integration partners. These breaches can give the attackers access to OAuth tokens used to integrate with SaaS providers such as Salesforce and Snowflake.\u003c/p\u003e\n"},{"n":3,"title":"Polish convenience store chain Żabka hacked through third-party account","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/poland-convenience-store-chain-zabka-cyberattack","time":"15:55","priority":"SHOULD READ","score":78,"tldr":"Żabka, Poland’s largest convenience store chain, said attackers accessed internal technical systems via a compromised third-party contractor account, but customer data, payments, the Żappka app, and store operations were not affected. Hackers are allegedly selling stolen internal data, including Jira-related materials and possible source code and credentials, though Żabka has not confirmed the scope.","briefOverview":"\u003cp\u003eŻabka, Poland\u0026rsquo;s largest convenience store chain, confirmed that it detected unauthorized access to technical systems used to communicate with its franchise network late last week. The company said it immediately blocked the intrusion and that the attackers gained access by compromising an account belonging to an unspecified external service provider. Żabka said payment systems, transaction data, the Żappka loyalty app, and day-to-day store operations were unaffected.\u003c/p\u003e\n\n\u003cp\u003eThe incident became public after previously unknown hackers advertised what they claimed was stolen Żabka data for sale on a cybercrime forum for €5,000. Żabka notified Poland\u0026rsquo;s data protection authority and law enforcement agencies, but did not attribute the attack to a specific threat actor or say whether a ransom demand was made. Poland\u0026rsquo;s Minister of Digital Affairs, Krzysztof Gawkowski, said authorities were informed promptly and that, based on information provided to the government, customer data, payment information, and retail operations were not affected.\u003c/p\u003e\n\n\u003cp\u003ePolish cybersecurity outlet Niebezpiecznik reported that samples of the allegedly stolen data appeared to show access to Żabka\u0026rsquo;s Jira environment, which is used for software development projects, technical support tickets, and operational workflows. The hackers also claimed to possess employee and contractor information, internal documentation, passwords, authentication tokens, API keys, and source code from multiple GitLab repositories. Żabka has not confirmed the nature or volume of any stolen data, and the claims reported by Niebezpiecznik have not been independently verified.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Żabka confirmed that it detected unauthorized access to technical systems used to communicate with its franchise network and blocked the intrusion late last week.","Żabka said the attackers gained access by compromising an account belonging to an unspecified external service provider rather than by directly breaching Żabka's own infrastructure.","The company said payment systems, transaction data, the Żappka loyalty app, and day-to-day store operations were unaffected.","Previously unknown hackers advertised what they claimed was stolen Żabka data for sale on a cybercrime forum for €5,000.","Niebezpiecznik reported that samples posted online indicated access to Żabka's Jira environment and that the hackers claimed to possess employee and contractor information, internal documentation, passwords, authentication tokens, API keys, and source code from multiple GitLab repositories."],"insights":["The incident appears to have exposed internal technical and operational systems while leaving consumer-facing services and payment processing unaffected, showing a clear separation between Żabka’s internal collaboration systems and its retail transaction environment.","A single compromised external service provider account was enough to access systems used for communication with Żabka’s franchise network, making third-party account access a central security concern in this incident.","The alleged stolen data was offered for €5,000, a relatively low price for material claimed to include internal documentation, credentials, authentication tokens, API keys, and source code.","The attackers reportedly contacted journalists and companies working with Żabka before advertising the data for sale, indicating that publicity around the breach was part of their activity as described by Niebezpiecznik."],"referencedReports":[],"body":"\u003cp\u003eŻabka, Poland\u0026rsquo;s largest convenience store chain, confirmed that it detected unauthorized access to technical systems used to communicate with its franchise network late last week. The company said it immediately blocked the intrusion and that the attackers gained access by compromising an account belonging to an unspecified external service provider. Żabka said payment systems, transaction data, the Żappka loyalty app, and day-to-day store operations were unaffected.\u003c/p\u003e\n\n\u003cp\u003eThe incident became public after previously unknown hackers advertised what they claimed was stolen Żabka data for sale on a cybercrime forum for €5,000. Żabka notified Poland\u0026rsquo;s data protection authority and law enforcement agencies, but did not attribute the attack to a specific threat actor or say whether a ransom demand was made. Poland\u0026rsquo;s Minister of Digital Affairs, Krzysztof Gawkowski, said authorities were informed promptly and that, based on information provided to the government, customer data, payment information, and retail operations were not affected.\u003c/p\u003e\n\n\u003cp\u003ePolish cybersecurity outlet Niebezpiecznik reported that samples of the allegedly stolen data appeared to show access to Żabka\u0026rsquo;s Jira environment, which is used for software development projects, technical support tickets, and operational workflows. The hackers also claimed to possess employee and contractor information, internal documentation, passwords, authentication tokens, API keys, and source code from multiple GitLab repositories. Żabka has not confirmed the nature or volume of any stolen data, and the claims reported by Niebezpiecznik have not been independently verified.\u003c/p\u003e\n"},{"n":4,"title":"Russian businesses erase Durov-linked products after 'terrorist' designation","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russian-businesses-erase-durov-linked-products-terrorist-designation","time":"14:11","priority":"MAY READ","score":72,"tldr":"Russia’s designation of Telegram founder Pavel Durov as a terrorist and extremist has prompted Russian businesses to remove Durov-linked books, films, merchandise and services, even though Telegram itself remains accessible and widely used by state institutions. The move targets Durov personally amid accusations that Telegram aided terrorist activity, allegations he denies as retaliation for resisting surveillance and censorship.","briefOverview":"\u003cp\u003eRussia’s decision to designate Telegram founder Pavel Durov as a terrorist and extremist has prompted businesses across the country to remove products associated with him. The designation followed FSB charges accusing Durov of aiding terrorist activity and alleging that Telegram failed to remove channels and bots used by Ukrainian intelligence, terrorist groups and extremist groups. Durov rejected the accusations and said Moscow was retaliating for his refusal to comply with demands for mass surveillance and censorship on Telegram.\u003c/p\u003e\n\n\u003cp\u003eThe clearest impact has fallen on businesses handling Durov-linked books, films, merchandise and services rather than on Telegram itself. LitRes withdrew two Durov biographies, Ozon said it planned to remove books and merchandise featuring him, Kion removed a 2021 documentary, and a publication called Durov’s Code rebranded as Kod.ru. Rosfinmonitoring said Russians can continue using Telegram and paying for Telegram Premium because the restrictions apply to Durov as an individual, not Telegram as a company.\u003c/p\u003e\n\n\u003cp\u003eTelegram remains accessible in Russia, and state institutions including the central bank, Defense Ministry and Foreign Ministry continue posting daily updates on official Telegram channels. The article also notes growing international scrutiny of Telegram, including Apple’s brief removal of the app from the App Store after a child sexual abuse material report, a U.K. regulator investigation, and an ongoing French investigation involving Durov. Durov’s whereabouts are unclear, and Russian lawyers cited by TASS said France and the United Arab Emirates are highly unlikely to surrender him because he holds citizenship in both countries.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russia designated Telegram founder Pavel Durov as a terrorist and extremist after the FSB charged him with aiding terrorist activity and accused Telegram of failing to remove channels and bots allegedly used by Ukrainian intelligence, terrorist groups and extremist groups.","Russian businesses including LitRes, Ozon, Kion and a technology publication formerly called Durov's Code have removed, reviewed or rebranded products and content associated with Durov following the designation.","Telegram remains accessible in Russia, and Russian state institutions including the central bank, the Defense Ministry and the Foreign Ministry continue to publish daily updates through official Telegram channels.","Rosfinmonitoring said Russians can continue using Telegram and paying for Telegram Premium because the restrictions apply to Durov as an individual rather than to Telegram as a company.","Telegram is also facing scrutiny outside Russia, including an Apple App Store removal that was reversed after Telegram removed child sexual abuse material and banned an account, a U.K. regulator investigation, and an ongoing French investigation into Durov."],"insights":["Russia’s restrictions are producing more visible consequences for businesses selling Durov-linked media and merchandise than for Telegram itself, which remains available and is still used by Russian government institutions.","Rosfinmonitoring’s distinction between Durov as an individual and Telegram as a company creates a narrow compliance path where Russians can keep using and paying for Telegram Premium while businesses avoid products directly associated with Durov.","The article shows that Durov-linked businesses and cultural products are reacting quickly to the designation even before any apparent technical blocking of Telegram occurs.","Telegram is under simultaneous pressure from Russia, Apple, the U.K. regulator and French authorities, but the specific concerns differ across jurisdictions, ranging from alleged Ukrainian intelligence use to child sexual abuse material and organized crime."],"referencedReports":[],"body":"\u003cp\u003eRussia’s decision to designate Telegram founder Pavel Durov as a terrorist and extremist has prompted businesses across the country to remove products associated with him. The designation followed FSB charges accusing Durov of aiding terrorist activity and alleging that Telegram failed to remove channels and bots used by Ukrainian intelligence, terrorist groups and extremist groups. Durov rejected the accusations and said Moscow was retaliating for his refusal to comply with demands for mass surveillance and censorship on Telegram.\u003c/p\u003e\n\n\u003cp\u003eThe clearest impact has fallen on businesses handling Durov-linked books, films, merchandise and services rather than on Telegram itself. LitRes withdrew two Durov biographies, Ozon said it planned to remove books and merchandise featuring him, Kion removed a 2021 documentary, and a publication called Durov’s Code rebranded as Kod.ru. Rosfinmonitoring said Russians can continue using Telegram and paying for Telegram Premium because the restrictions apply to Durov as an individual, not Telegram as a company.\u003c/p\u003e\n\n\u003cp\u003eTelegram remains accessible in Russia, and state institutions including the central bank, Defense Ministry and Foreign Ministry continue posting daily updates on official Telegram channels. The article also notes growing international scrutiny of Telegram, including Apple’s brief removal of the app from the App Store after a child sexual abuse material report, a U.K. regulator investigation, and an ongoing French investigation involving Durov. Durov’s whereabouts are unclear, and Russian lawyers cited by TASS said France and the United Arab Emirates are highly unlikely to surrender him because he holds citizenship in both countries.\u003c/p\u003e\n"},{"n":5,"title":"Britain’s next war won’t be an away game: Q\u0026A with former head of Defence Intelligence","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/interview-jim-hockenhull-uk-defence-intelligence-russia-ukraine","time":"16:19","priority":"MAY READ","score":55,"tldr":"Former UK Defence Intelligence chief Jim Hockenhull argues Britain must treat cyber and information conflict as a continuous campaign, not a future “away game,” because adversaries are already targeting the UK through cyberattacks, sabotage, espionage and information operations. He says the government must better explain these threats to the public if it expects support for sustained defence investment.","briefOverview":"\u003cp\u003eFormer Chief of Defence Intelligence General Sir Jim Hockenhull discussed the UK’s decision to declassify and publish intelligence about Russia’s plans to invade Ukraine, including a map of invasion routes. He said then-Defence Secretary Ben Wallace was the only senior figure who backed the proposal, despite resistance within government and the intelligence community. Hockenhull said the releases were meant to expose the Kremlin’s intentions before false narratives and pretexts could take hold.\u003c/p\u003e\n\n\u003cp\u003eHockenhull argued that modern deterrence should not rely only on Cold War-era nuclear theory, but should also consider the effect of showing adversaries that their actions are visible. He said public intelligence disclosures were only one part of a wider effort that also included sharing information with Ukraine. He also emphasized that intelligence can change the situation it assesses, because those who receive it may act on it.\u003c/p\u003e\n\n\u003cp\u003eOn cyber operations, Hockenhull said cyber capabilities cannot be stored like conventional weapons because changing systems and software updates can quickly remove opportunities. He described cyber tools as more like Lego bricks that must be assembled for a specific target and moment, and said cyber activity needs to be part of broader campaigns rather than isolated actions. He warned that the UK public may face cyberattacks, information operations, sabotage, espionage, assassination, attacks on undersea fiber-optic cables and contest in space before any major war, making it important for government and others to better explain the threat to the public.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Former Chief of Defence Intelligence Jim Hockenhull said then-Defence Secretary Ben Wallace was the only senior figure who agreed with his proposal to publicly release intelligence about Russia’s planned invasion of Ukraine.","Hockenhull said the UK’s February 17, 2022 intelligence release showed the axes of Russia’s invasion plan and was intended to expose Moscow’s intentions before false narratives could take hold.","Hockenhull argued that cyber capabilities cannot be stockpiled like conventional weapons because software updates and changing networks can quickly remove opportunities.","Hockenhull said Britain needs a sustained campaigning approach across government because adversaries continuously use many tools of statecraft, while UK efforts are disrupted by reorganizations, short budget cycles and leadership changes.","Hockenhull warned that the UK public may face cyberattacks, information operations, sabotage, espionage, assassination, attacks on undersea fiber-optic cables and contest in space before any major war."],"insights":["Hockenhull said the decision to release intelligence on Russia’s invasion plans required creating a dedicated team to convert classified products into public material without exposing sources, methods, or operational advantages.","Hockenhull framed public intelligence disclosure as a form of deterrence based on showing an adversary that they are being seen, rather than relying on Cold War-style deterrence models.","Hockenhull said offensive cyber activity does not always need public attribution; a state can conduct a covert operation and then privately signal responsibility through diplomatic or intelligence channels.","Hockenhull argued that cyber operations are most useful when combined with other instruments of power, because a standalone cyber campaign may achieve technical effects without producing meaningful strategic outcomes.","Hockenhull warned that the Digital Targeting Web’s success depends on protecting and controlling data wherever it moves, rather than simply protecting individual networks."],"referencedReports":[],"body":"\u003cp\u003eFormer Chief of Defence Intelligence General Sir Jim Hockenhull discussed the UK’s decision to declassify and publish intelligence about Russia’s plans to invade Ukraine, including a map of invasion routes. He said then-Defence Secretary Ben Wallace was the only senior figure who backed the proposal, despite resistance within government and the intelligence community. Hockenhull said the releases were meant to expose the Kremlin’s intentions before false narratives and pretexts could take hold.\u003c/p\u003e\n\n\u003cp\u003eHockenhull argued that modern deterrence should not rely only on Cold War-era nuclear theory, but should also consider the effect of showing adversaries that their actions are visible. He said public intelligence disclosures were only one part of a wider effort that also included sharing information with Ukraine. He also emphasized that intelligence can change the situation it assesses, because those who receive it may act on it.\u003c/p\u003e\n\n\u003cp\u003eOn cyber operations, Hockenhull said cyber capabilities cannot be stored like conventional weapons because changing systems and software updates can quickly remove opportunities. He described cyber tools as more like Lego bricks that must be assembled for a specific target and moment, and said cyber activity needs to be part of broader campaigns rather than isolated actions. He warned that the UK public may face cyberattacks, information operations, sabotage, espionage, assassination, attacks on undersea fiber-optic cables and contest in space before any major war, making it important for government and others to better explain the threat to the public.\u003c/p\u003e\n"},{"n":10,"title":"Op-Ed: Calphishing is challenging how we think about phishing","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/op-ed-calphishing-is-challenging-how-we-think-about-phishing/","time":"17:53","priority":"MAY READ","score":55,"tldr":"Calendar phishing, or “calphishing,” is a growing phishing tactic that abuses employees’ calendars to deliver malicious links, fake login prompts, authentication scams, or attacker phone numbers. The article warns that overworked healthcare staff are especially vulnerable because these invites can steal credentials, session tokens, or money while bypassing normal defenses like MFA.","briefOverview":"\u003cp\u003eThe article discusses calendar phishing, or calphishing, as an evolution of phishing that takes advantage of employees’ busy work lives through their calendars. It says phishing remains the most common and damaging cyber threat, with 3.4 billion phishing emails sent daily. In calphishing, malicious content is delivered directly into an employee’s calendar.\u003c/p\u003e\n\n\u003cp\u003eThe article says calphishing aims to trick victims into visiting fake login pages, approving authentication requests, or phoning hackers directly and falling for a social engineering scam. The end goal is to capture login credentials, obtain authenticated access, or steal money directly from the victim. Some campaigns also target session tokens, which maintain a user’s logged-in state, to bypass multifactor authentication and access internal systems without triggering additional verification protocols.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights the healthcare sector as particularly at risk because employees are overburdened and may not have time to vet every calendar event. It warns that this new evolution of phishing could prove catastrophic for healthcare employees. The piece is an op-ed by Errol Weiss, Chief Security Officer at Health ISAC, and points readers to the full article in Cyber Daily AU.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Phishing remains the most common and damaging cyber threat, with 3.4 billion phishing emails sent daily.","Calendar phishing, or calphishing, delivers malicious content directly into an employee’s calendar.","Calphishing aims to trick victims into visiting fake login pages, approving authentication requests, or phoning hackers directly.","The goal of calphishing is to capture login credentials, obtain authenticated access, or steal money directly from the victim.","Some calphishing campaigns target session tokens to bypass multifactor authentication and access internal systems without triggering additional verification protocols."],"insights":["Calendar entries can become a phishing delivery channel, so suspicious activity may appear outside the email inbox where people usually expect phishing attempts.","A calphishing message may try to make the victim call the attacker directly, showing that the scam does not have to rely only on links or fake login pages.","Stealing session tokens is especially dangerous because it can let attackers stay logged in as the user without triggering additional multifactor authentication checks.","Healthcare employees are highlighted as a high-risk audience because heavy workloads can make it harder to carefully vet every calendar event."],"referencedReports":[],"body":"\u003cp\u003eThe article discusses calendar phishing, or calphishing, as an evolution of phishing that takes advantage of employees’ busy work lives through their calendars. It says phishing remains the most common and damaging cyber threat, with 3.4 billion phishing emails sent daily. In calphishing, malicious content is delivered directly into an employee’s calendar.\u003c/p\u003e\n\n\u003cp\u003eThe article says calphishing aims to trick victims into visiting fake login pages, approving authentication requests, or phoning hackers directly and falling for a social engineering scam. The end goal is to capture login credentials, obtain authenticated access, or steal money directly from the victim. Some campaigns also target session tokens, which maintain a user’s logged-in state, to bypass multifactor authentication and access internal systems without triggering additional verification protocols.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights the healthcare sector as particularly at risk because employees are overburdened and may not have time to vet every calendar event. It warns that this new evolution of phishing could prove catastrophic for healthcare employees. The piece is an op-ed by Errol Weiss, Chief Security Officer at Health ISAC, and points readers to the full article in Cyber Daily AU.\u003c/p\u003e\n"},{"n":8,"title":"Silent Push 6.0 adds AI workflows and unified cyber platform","source":"securitybrief.news","sourceColorIdx":0,"link":"https://securitybrief.news/story/silent-push-6-0-adds-ai-workflows-and-unified-cyber-platform#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=silent-push-6-0-adds-ai-workflows-and-unified-cyber-platform","time":"14:07","priority":"MAY READ","score":45,"tldr":"Silent Push 6.0 introduces AI-driven workflows and a unified cyber intelligence platform intended to help security teams investigate threats and act faster from a single environment.","briefOverview":"\u003cp\u003eThe article reports on Silent Push 6.0. The release adds AI workflows. It also adds a unified cyber platform.\u003c/p\u003e\n\n\u003cp\u003eThe core significance presented in the article is the combination of AI workflows with a unified platform. The named vendor is Silent Push. The named product version is Silent Push 6.0.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports on Silent Push 6.0.","Silent Push 6.0 adds AI workflows.","Silent Push 6.0 includes a unified cyber platform."],"insights":["The article frames Silent Push 6.0 around two separate changes: AI workflows and a unified cyber platform.","The recoverable article text identifies Silent Push 6.0 as a product-focused release rather than an incident report or threat analysis."],"referencedReports":[],"body":"\u003cp\u003eThe article reports on Silent Push 6.0. The release adds AI workflows. It also adds a unified cyber platform.\u003c/p\u003e\n\n\u003cp\u003eThe core significance presented in the article is the combination of AI workflows with a unified platform. The named vendor is Silent Push. The named product version is Silent Push 6.0.\u003c/p\u003e\n"},{"n":2,"title":"Varonis Agent IBAC keeps AI agents within their intended boundaries","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/varonis-agent-ibac-keeps-ai-agents-within-their-intended-boundaries/","time":"14:00","priority":"MAY READ","score":35,"tldr":"Varonis announced Agent IBAC for Varonis Atlas, a sponsored product capability that monitors AI agents’ intent in real time and can alert, block, require approval, or quarantine identities when agent actions drift from the original request. The key takeaway is that it aims to let enterprises connect AI agents to sensitive data and tools while enforcing runtime guardrails against out-of-scope or risky behavior.","briefOverview":"\u003cp\u003eVaronis announced Agent Intent-Based Access Control, a new capability in Varonis Atlas for businesses connecting AI agents to enterprise data. The feature is designed to stop dangerous or out-of-policy behavior by comparing an agent’s instruction with its reasoning, tools, and data access. When actions do not align, Atlas can respond in real time by alerting, blocking, modifying, logging, requiring human approval, or quarantining the identity behind the session.\u003c/p\u003e\n\n\u003cp\u003eThe article says agents need broad access to data and tools to be useful, but that access also makes them risky. Varonis argues that role-based access control was not built to judge what a non-human identity does with the access it already has. Agent IBAC is presented as a way to enforce agent permissions at runtime and keep agents within their intended scope without unnecessarily slowing productivity.\u003c/p\u003e\n\n\u003cp\u003eAgent IBAC evaluates every prompt, response, and tool call across a session to detect intent drift, including gradual drift and multi-turn jailbreak attempts. Atlas sits inline between the agent and the model, so prompts, model responses, and tool calls pass through Atlas before reaching their destination. The system also keeps an audit trail showing what the agent did, whether each action followed from the request, and which guardrails fired.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis announced Agent Intent-Based Access Control, a new capability in Varonis Atlas designed to connect AI agents to enterprise data while stopping dangerous or out-of-policy behavior.","Agent IBAC compares an agent’s original instruction with its reasoning, tool use, and data access, then can alert, block, modify, log, or route actions for human approval in real time.","Atlas sits inline between the agent and the model, so every prompt, model response, and tool call passes through Atlas before reaching its destination.","Agent IBAC evaluates full sessions, including every prompt, response, and tool call, to detect gradual intent drift and multi-turn jailbreak attempts.","Varonis says Atlas can quarantine the identity behind a violating agent session for a customer-defined time window, with administrators able to lift, extend, or make the quarantine permanent."],"insights":["The article frames agent security as a runtime problem rather than a permissions problem, arguing that role-based access control cannot judge whether a non-human identity should take a specific action in a specific context.","Agent IBAC’s response can be calibrated by risk, allowing minor intent drift to be logged while blocking or requiring approval for actions that touch sensitive data or expand scope.","Full-session evaluation is presented as necessary because harmful behavior may emerge gradually across multiple prompts, even when each individual prompt appears harmless.","Quarantine applies to the identity behind the session, not just a single tool call, so Atlas can stop follow-on attempts for a customer-defined period after a serious violation."],"referencedReports":[],"body":"\u003cp\u003eVaronis announced Agent Intent-Based Access Control, a new capability in Varonis Atlas for businesses connecting AI agents to enterprise data. The feature is designed to stop dangerous or out-of-policy behavior by comparing an agent’s instruction with its reasoning, tools, and data access. When actions do not align, Atlas can respond in real time by alerting, blocking, modifying, logging, requiring human approval, or quarantining the identity behind the session.\u003c/p\u003e\n\n\u003cp\u003eThe article says agents need broad access to data and tools to be useful, but that access also makes them risky. Varonis argues that role-based access control was not built to judge what a non-human identity does with the access it already has. Agent IBAC is presented as a way to enforce agent permissions at runtime and keep agents within their intended scope without unnecessarily slowing productivity.\u003c/p\u003e\n\n\u003cp\u003eAgent IBAC evaluates every prompt, response, and tool call across a session to detect intent drift, including gradual drift and multi-turn jailbreak attempts. Atlas sits inline between the agent and the model, so prompts, model responses, and tool calls pass through Atlas before reaching their destination. The system also keeps an audit trail showing what the agent did, whether each action followed from the request, and which guardrails fired.\u003c/p\u003e\n"}]</script>
