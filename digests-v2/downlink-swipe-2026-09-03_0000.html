<script type="application/json" id="dl-articles">[{"n":11,"title":"Urgent Threat Alert: ShinyHunters Vishing Campaigns and Domain Impersonation","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/urgent-threat-alert-shinyhunters-vishing-campaigns-and-domain-impersonation/","time":"16:58","priority":"MUST READ","score":94,"tldr":"Health-ISAC warns that ShinyHunters is actively targeting healthcare organizations with vishing and lookalike domains to steal SSO credentials, bypass MFA, and exfiltrate data from SaaS platforms. Organizations should urgently block suspicious .claim/.claims domains, harden MFA and helpdesk workflows, and monitor impersonation infrastructure.","briefOverview":"\u003cp\u003eHealth-ISAC warns that the ShinyHunters cybercrime gang is actively targeting the global health sector with persistent, highly targeted voice phishing campaigns and medical-themed impersonation domains. The campaigns attempt to trick enterprise personnel into entering credentials on malicious sites that mimic legitimate login pages. Health-ISAC says the activity poses a severe risk of compromised credentials, multi-factor authentication bypass, and unauthorized access to corporate infrastructure and cloud or SaaS platforms.\u003c/p\u003e\n\n\u003cp\u003eThe article says attackers have contacted employees directly on personal mobile devices through calls and voicemails, and have also emailed users en masse from multiple random accounts. A key pattern is the use of newly registered domains that impersonate target companies, including formats such as company-claims[.]com or company[.]claims. Once an identity is compromised, the actors rapidly pivot from single sign-on platforms into connected SaaS applications such as Microsoft 365, SharePoint, and Salesforce to exfiltrate sensitive data and internal communications for extortion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC warns that ShinyHunters is actively targeting the global health sector with persistent, highly targeted voice phishing campaigns and medical-themed impersonation domains.","The campaigns attempt to trick employees into exposing credentials on malicious sites that mimic legitimate login pages, enabling unauthorized initial access.","ShinyHunters has bypassed multi-factor authentication in recent cases and rapidly pivoted from single sign-on platforms to connected SaaS applications such as Microsoft 365, SharePoint, and Salesforce for large-scale data exfiltration and extortion.","Threat actors are contacting employees directly on personal mobile devices through calls and voicemails and are also emailing users en masse from multiple random accounts.","Health-ISAC recommends blocking .claim and .claims top-level domains unless legitimate, using phishing-resistant MFA, hardening helpdesk and MFA reset workflows, enforcing device-context verification, and monitoring lookalike infrastructure."],"insights":["The most identifiable infrastructure pattern is the use of domains that combine the target company name with “claims,” such as company-claims[.]com or company[.]claims, making lookalike-domain monitoring and blocking of .claim and .claims especially actionable.","The article characterizes ShinyHunters as shifting away from a traditional ransomware model toward an identity- and SaaS-access extortion operation, where the single sign-on platform functions as the main control point for broader data theft.","The vishing flow relies on real-time interaction: after victims enter credentials on a phishing page, attackers use reverse-proxy phishing kits and phone pressure to obtain an active MFA token or push approval immediately.","The actors are specifically instructing users to use personal devices to reach malicious links, which shows why Health-ISAC emphasizes device-context verification rather than relying on identity checks alone.","Health-ISAC’s recommendation that employees be trained that IT will “not reset MFA on inbound calls” highlights helpdesk and MFA reset workflows as a specific social-engineering pressure point in these campaigns."],"referencedReports":[{"title":"Health Industry Cybersecurity Practices (HICP): Managing Threats and Protecting Patients","url":"https://405d.hhs.gov/cornerstone/hicp","publisher":"HHS 405(d) Program","context":"The article points readers to HICP for more information on managing threats and protecting patients.","category":"guide","primary":false},{"title":"TLP WHITE: ShinyHunters-Linked Social Engineering and Identity Targeting","url":"https://www.aha.org/h-isac-white-reports/2026-08-24-cyber-incidents-tlp-white-shinyhunters-linked-social-engineering-and-identity-targeting","publisher":"American Hospital Association","context":"The article lists this TLP:WHITE report as a reference related to ShinyHunters-linked social engineering and identity targeting.","category":"advisory","primary":false},{"title":"Tracking the Expansion of ShinyHunters-Branded SaaS Data Theft","url":"https://cloud.google.com/blog/topics/threat-intelligence/expansion-shinyhunters-saas-data-theft","publisher":"Google Cloud","context":"The article cites this Google Cloud threat intelligence analysis as a reference on ShinyHunters-branded SaaS data theft.","category":"research","primary":false}],"body":"\u003cp\u003eHealth-ISAC warns that the ShinyHunters cybercrime gang is actively targeting the global health sector with persistent, highly targeted voice phishing campaigns and medical-themed impersonation domains. The campaigns attempt to trick enterprise personnel into entering credentials on malicious sites that mimic legitimate login pages. Health-ISAC says the activity poses a severe risk of compromised credentials, multi-factor authentication bypass, and unauthorized access to corporate infrastructure and cloud or SaaS platforms.\u003c/p\u003e\n\n\u003cp\u003eThe article says attackers have contacted employees directly on personal mobile devices through calls and voicemails, and have also emailed users en masse from multiple random accounts. A key pattern is the use of newly registered domains that impersonate target companies, including formats such as company-claims[.]com or company[.]claims. Once an identity is compromised, the actors rapidly pivot from single sign-on platforms into connected SaaS applications such as Microsoft 365, SharePoint, and Salesforce to exfiltrate sensitive data and internal communications for extortion.\u003c/p\u003e\n"},{"n":5,"title":"Malware on the Blockchain: An Ongoing Campaign’s New WebRTC Twist","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/malware-on-the-blockchain-an-ongoing-campaigns-new-webrtc-twist","time":"14:05","priority":"MUST READ","score":92,"tldr":"Netskope found an ongoing EtherHiding campaign using BNB Smart Chain testnet contracts to deliver payloads through more than 5,400 compromised small-business websites. A newer variant replaces the usual ClickFix lure with a covert WebRTC data-channel stager that bypasses normal signaling and pulls executable code directly from attacker-controlled infrastructure.","briefOverview":"\u003cp\u003eNetskope observed an EtherHiding campaign affecting more than 5,400 compromised small-business websites across more than 2,200 organizations worldwide. The compromised sites include businesses such as clinics, plumbers, and e-commerce shops, and were most often WordPress and sometimes PrestaShop where individual sites were examined. Each site carried an injected loader, either as an inline script or spoofed package, that called a BNB Smart Chain testnet endpoint and retrieved the next payload from a smart contract.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses the BSC testnet as takedown-resistant payload storage because it behaves like mainnet but uses free testnet BNB from faucets. This lets the operator update a single contract and change what all compromised sites deliver to visitors on the next page load. The common chain delivers a ClickFix overlay that blurs the page behind a fake CAPTCHA and instructs visitors to paste and run a command that downloads and runs the final payload.\u003c/p\u003e\n\n\u003cp\u003eNetskope also found a newer variant that delivers a WebRTC data-channel stager instead of the ClickFix overlay. This script hand-writes its own WebRTC answer using hardcoded connection values, opening an encrypted UDP channel to the cyberattacker without the normal signaling handshake. Once the channel opens, the stager buffers code sent over it and executes the reassembled result in the browser by injecting a script into the page, reusing an existing Content Security Policy nonce when available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope observed more than 5,400 compromised small-business websites making JSON-RPC calls to BNB Smart Chain testnet endpoints to retrieve payloads from a smart contract.","The compromised sites, often WordPress and sometimes PrestaShop, carried an injected loader as either an inline script or a spoofed package, but the initial compromise method is unknown.","The common delivery chain retrieves a second-stage script from the blockchain that displays a ClickFix lure instructing visitors to paste and run a command that downloads the final payload.","A newer variant delivers a WebRTC data-channel stager that hand-writes its own session answer to open an encrypted UDP channel to the attacker without normal signaling traffic.","The WebRTC stager buffers code received from the command channel and executes it in the browser by injecting a script into the page, reusing an existing Content Security Policy nonce when available."],"insights":["Blocking only the primary BSC testnet endpoint is insufficient because Netskope recommends blocking the full BSC-testnet RPC pool for this campaign.","The use of BSC testnet gives the operators mainnet-like smart-contract hosting and takedown resistance without transaction cost because testnet BNB is free from faucets.","The operator can change what all compromised sites deliver by updating a single smart contract, so the same compromised website network can rapidly shift payloads for future visitors.","The WebRTC variant reduces visibility for defenders because it avoids the normal signaling-server exchange while still opening an encrypted channel that HTTP inspection may not see.","Site owners can look for the loader by integrity-checking CMS assets, since Netskope observed it appended to legitimate JavaScript files or placed in fake plugin directories."],"referencedReports":[],"body":"\u003cp\u003eNetskope observed an EtherHiding campaign affecting more than 5,400 compromised small-business websites across more than 2,200 organizations worldwide. The compromised sites include businesses such as clinics, plumbers, and e-commerce shops, and were most often WordPress and sometimes PrestaShop where individual sites were examined. Each site carried an injected loader, either as an inline script or spoofed package, that called a BNB Smart Chain testnet endpoint and retrieved the next payload from a smart contract.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses the BSC testnet as takedown-resistant payload storage because it behaves like mainnet but uses free testnet BNB from faucets. This lets the operator update a single contract and change what all compromised sites deliver to visitors on the next page load. The common chain delivers a ClickFix overlay that blurs the page behind a fake CAPTCHA and instructs visitors to paste and run a command that downloads and runs the final payload.\u003c/p\u003e\n\n\u003cp\u003eNetskope also found a newer variant that delivers a WebRTC data-channel stager instead of the ClickFix overlay. This script hand-writes its own WebRTC answer using hardcoded connection values, opening an encrypted UDP channel to the cyberattacker without the normal signaling handshake. Once the channel opens, the stager buffers code sent over it and executes the reassembled result in the browser by injecting a script into the page, reusing an existing Content Security Policy nonce when available.\u003c/p\u003e\n"},{"n":10,"title":"Microsoft Exchange Vulnerability CVE-2026-62911: What Administrators Should Do and How Zscaler Can Help","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/microsoft-exchange-vulnerability-cve-2026-62911-what-administrators-should","time":"20:19","priority":"SHOULD READ","score":88,"tldr":"Microsoft patched CVE-2026-62911, a high-severity Exchange Server authentication bypass that can let a low-privileged attacker take over all mailboxes, but thousands of internet-exposed servers remain unpatched and public exploit code exists. Administrators should patch immediately or remove Exchange from direct internet access, with the article recommending Zscaler’s zero-trust access controls as a way to reduce exposure.","briefOverview":"\u003cp\u003eMicrosoft’s August 2026 Patch Tuesday included a fix for CVE-2026-62911, a high-severity authentication bypass vulnerability affecting Exchange Server 2016, 2019, and Subscription Edition. Microsoft gave the vulnerability a CVSS score of 8.0. According to Microsoft, successful exploitation allows an attacker with basic privileges to take over all mailboxes on the targeted server, including reading and sending email and downloading attachments.\u003c/p\u003e\n\n\u003cp\u003eAs of September 1, Shadowserver identified around 22,000 Exchange servers that remained unpatched and exposed to the internet, including roughly 6,200 in the United States and 5,100 in Germany. The Netherlands National Cyber Security Centre confirmed that working exploit code is already publicly available. The article says administrators should apply the August 2026 update immediately, and if patching is not immediately possible, ensure the Exchange server is not reachable from the open internet.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the broader issue is internet exposure for private application servers such as on-premises Exchange, because Outlook Web App is commonly reachable from the public internet. It recommends using Zscaler Private Access to keep Exchange accessible to users while making it invisible from the internet, and describes options for managed and unmanaged devices. It also discusses additional Zscaler controls for suspected compromise, lateral movement containment, and exploit protection, and suggests evaluating Microsoft 365 migration as a longer-term way to remove the on-premises Exchange attack surface.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s August 2026 Patch Tuesday included a fix for CVE-2026-62911, a high-severity authentication bypass vulnerability affecting Exchange Server 2016, 2019, and Subscription Edition.","Shadowserver identified around 22,000 Exchange servers that remained unpatched and exposed to the internet as of September 1, including roughly 6,200 in the United States and 5,100 in Germany.","Microsoft said successful exploitation of CVE-2026-62911 allows an attacker with basic privileges to take over all mailboxes on the targeted server, including reading and sending email and downloading attachments.","The Netherlands National Cyber Security Centre confirmed that working exploit code for CVE-2026-62911 is already publicly available.","The article recommends applying the August 2026 update immediately, and if patching is delayed, ensuring the Exchange server is not reachable from the open internet."],"insights":["The article frames internet exposure, not just missing patches, as the recurring structural problem for on-premises Exchange because Outlook Web App is typically reachable from the public internet.","NCSC-NL’s recommendation to make Exchange accessible only internally creates an operational challenge for organizations that still need remote access, which the article positions as a reason to use an access broker rather than direct public exposure.","The article argues that patching alone is becoming less reliable for internet-facing systems because public exploit code and frontier AI models can sharply compress the time between disclosure and exploitation.","Exchange 2016 and 2019 users face a near-term planning deadline because their Extended Security Update support ends in October 2026, after which they will no longer receive security fixes.","The article presents Microsoft 365 migration as a strategic way to remove the on-premises Exchange attack surface, while noting that private applications will still remain necessary for confidentiality, restricted access, and compliance."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft’s August 2026 Patch Tuesday included a fix for CVE-2026-62911, a high-severity authentication bypass vulnerability affecting Exchange Server 2016, 2019, and Subscription Edition. Microsoft gave the vulnerability a CVSS score of 8.0. According to Microsoft, successful exploitation allows an attacker with basic privileges to take over all mailboxes on the targeted server, including reading and sending email and downloading attachments.\u003c/p\u003e\n\n\u003cp\u003eAs of September 1, Shadowserver identified around 22,000 Exchange servers that remained unpatched and exposed to the internet, including roughly 6,200 in the United States and 5,100 in Germany. The Netherlands National Cyber Security Centre confirmed that working exploit code is already publicly available. The article says administrators should apply the August 2026 update immediately, and if patching is not immediately possible, ensure the Exchange server is not reachable from the open internet.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the broader issue is internet exposure for private application servers such as on-premises Exchange, because Outlook Web App is commonly reachable from the public internet. It recommends using Zscaler Private Access to keep Exchange accessible to users while making it invisible from the internet, and describes options for managed and unmanaged devices. It also discusses additional Zscaler controls for suspected compromise, lateral movement containment, and exploit protection, and suggests evaluating Microsoft 365 migration as a longer-term way to remove the on-premises Exchange attack surface.\u003c/p\u003e\n"},{"n":2,"title":"Modern Adventures in Azure Privilege Escalation","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/modern-adventures-in-azure-privilege-escalation/","time":"16:00","priority":"SHOULD READ","score":82,"tldr":"NetSPI shows that Azure privilege escalation mapping should focus on individual RBAC permissions and ABAC conditions, not just role names, because built-in and custom roles can hide powerful escalation paths. Using this approach, researchers found and reported an Azure built-in Anyscale Platform Administrator role that could assign arbitrary roles and escalate to Owner before Microsoft removed the dangerous permissions.","briefOverview":"\u003cp\u003eAzure has grown to more than 200 services, 897 built-in Azure RBAC roles, and 22,018 permissions as of June 2026, increasing the cloud attack surface. The article explains Azure RBAC fundamentals, Attribute Based Access Control, and why privilege escalation mapping should focus on individual permissions rather than only role names. It argues that reviewing permissions alongside ABAC conditions gives a more accurate view of effective access and real escalation paths.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that ABAC is used heavily in built-in Azure roles, especially around \u003ccode\u003eMicrosoft.Authorization/roleAssignments/write\u003c/code\u003e, to constrain which roles can be assigned. It also describes a bypass of a Microsoft Portal recommended condition, where a principal with constrained Owner or User Access Administrator access could create and assign a custom role because \u003ccode\u003eMicrosoft.Authorization/roleDefinitions/write\u003c/code\u003e was not covered by the condition. The article notes that Microsoft closed this reported behavior as “by design.”\u003c/p\u003e\n\n\u003cp\u003eUsing a permission-focused methodology and the \u003ccode\u003e2023-07-01-preview\u003c/code\u003e Role Definitions List API, NetSPI identified that the built-in “Anyscale Platform Administrator Role” included \u003ccode\u003eMicrosoft.Authorization/roleAssignments/write\u003c/code\u003e and \u003ccode\u003eMicrosoft.Authorization/roleAssignments/delete\u003c/code\u003e without ABAC conditions. The article states this could allow arbitrary privilege escalation to Owner and made the role equivalent to highly privileged Azure roles such as Owner, User Access Administrator, and Role Based Access Control Administrator. Microsoft later removed those role assignment permissions from the Anyscale role after the issue was reported to MSRC.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Azure’s attack surface has grown with more than 200 services, 897 built-in Azure RBAC roles, and 22,018 different permissions as of June 2026.","The article argues that mapping privilege escalation techniques to individual Azure RBAC permissions provides a more thorough review of escalation paths than focusing only on roles.","Azure ABAC conditions are increasingly used in built-in roles to constrain privileged actions such as Microsoft.Authorization/roleAssignments/write, but those conditions must be reviewed alongside RBAC role assignments to understand effective permissions.","NetSPI found that the built-in Anyscale Platform Administrator Role contained Microsoft.Authorization/roleAssignments/write and Microsoft.Authorization/roleAssignments/delete without ABAC conditions, allowing arbitrary privilege escalation to Owner before Microsoft removed those permissions.","The article recommends that Azure administrators review every role for unexpected permissions, follow least privilege, reduce use of highly privileged roles, and assign roles at the narrowest possible scope."],"insights":["Microsoft’s portal-recommended condition for limiting Owner or User Access Administrator role assignments can be bypassed because it blocks only specific privileged role IDs and does not constrain Microsoft.Authorization/roleDefinitions/write.","A control-plane permission such as Microsoft.Storage/storageAccounts/listkeys/action can effectively grant full data access to Storage Account contents through shared access keys, blurring the expected separation between management actions and data access.","The undocumented 2023-07-01-preview version of the Azure Role Definitions List API can map specific permissions to built-in and custom roles while handling Actions versus NotActions, making permission-level privilege escalation reviews more practical.","Roles that administrators may not expect to expose Storage Account data, including Azure AI Administrator, Log Analytics Contributor, and Virtual Machine Contributor, include Microsoft.Storage/storageAccounts/listkeys/action.","Among 28 built-in roles with Microsoft.Authorization/roleAssignments/write, only four lacked ABAC conditions before Microsoft changed the Anyscale Platform Administrator Role, making the absence of conditions a high-signal review target."],"referencedReports":[{"title":"Abusing Azure Container Registry Tasks","url":"https://medium.com/specter-ops-posts/abusing-azure-container-registry-tasks-1f407bfaa465","publisher":"SpecterOps","context":"The article lists this as prior Azure privilege escalation research by Andy Robbins.","category":"research","primary":false},{"title":"Managed Identity Attack Paths, Part 1: Automation Accounts","url":"https://medium.com/specter-ops-posts/managed-identity-attack-paths-part-1-automation-accounts-82667d17187a","publisher":"SpecterOps","context":"The article lists this as prior research on Azure managed identity attack paths by Andy Robbins.","category":"research","primary":false},{"title":"Managed Identity Attack Paths, Part 2: Logic Apps","url":"https://medium.com/specter-ops-posts/managed-identity-attack-paths-part-2-logic-apps-52b29354fc54","publisher":"SpecterOps","context":"The article lists this as prior research on Azure managed identity attack paths by Andy Robbins.","category":"research","primary":false},{"title":"Managed Identity Attack Paths, Part 3: Function Apps","url":"https://medium.com/specter-ops-posts/managed-identity-attack-paths-part-3-function-apps-300065251cbe","publisher":"SpecterOps","context":"The article lists this as prior research on Azure managed identity attack paths by Andy Robbins.","category":"research","primary":false},{"title":"Abusing Azure App Service Managed Identity Assignments","url":"https://medium.com/specter-ops-posts/abusing-azure-app-service-managed-identity-assignments-c3adefccff95","publisher":"SpecterOps","context":"The article lists this as prior research on Azure managed identity abuse by Andy Robbins.","category":"research","primary":false},{"title":"Microsoft Breach: What Happened? What Should Azure Admins Do?","url":"https://medium.com/specter-ops-posts/microsoft-breach-what-happened-what-should-azure-admins-do-da2b7e674ebc","publisher":"SpecterOps","context":"The article lists this as prior Azure security research by Andy Robbins.","category":"research","primary":false},{"title":"Azure Key Vault Tradecraft with BARK","url":"https://medium.com/specter-ops-posts/azure-key-vault-tradecraft-with-bark-24163abc8de3","publisher":"SpecterOps","context":"The article lists this as prior Azure Key Vault security research by Andy Robbins.","category":"research","primary":false},{"title":"Azure Storage Account Attack and Detection","url":"https://hausec.com/2025/12/15/azure-storage-account-attack-and-detection/","publisher":"Hausec","context":"The article lists this as prior Azure Storage Account attack and detection research by Ryan Hausknecht.","category":"research","primary":false},{"title":"Azure Threat Research Matrix","url":"https://microsoft.github.io/Azure-Threat-Research-Matrix/","publisher":"Microsoft","context":"The article says Ryan Hausknecht created this matrix to map Azure-specific techniques to MITRE ATT\u0026CK-like categories.","category":"research","primary":false},{"title":"Azure Virtual Machine Execution Techniques","url":"https://hausec.com/2022/05/04/azure-virtual-machine-execution-techniques/","publisher":"Hausec","context":"The article lists this as prior Azure virtual machine attack research by Ryan Hausknecht.","category":"research","primary":false},{"title":"Escalating Privileges to Read Secrets with Azure Key Vault Access Policies","url":"https://securitylabs.datadoghq.com/articles/escalating-privileges-to-read-secrets-with-azure-key-vault-access-policies/","publisher":"Datadog Security Labs","context":"The article lists this as prior Azure secrets access and Key Vault access policy abuse research by Katie Knowles.","category":"research","primary":false},{"title":"Introducing Pathfinding Labs","url":"https://securitylabs.datadoghq.com/articles/introducing-pathfinding-labs/","publisher":"Datadog Security Labs","context":"The article references Seth Art’s pathfinding.cloud work and related research on identifying novel privilege escalation vectors.","category":"research","primary":false}],"body":"\u003cp\u003eAzure has grown to more than 200 services, 897 built-in Azure RBAC roles, and 22,018 permissions as of June 2026, increasing the cloud attack surface. The article explains Azure RBAC fundamentals, Attribute Based Access Control, and why privilege escalation mapping should focus on individual permissions rather than only role names. It argues that reviewing permissions alongside ABAC conditions gives a more accurate view of effective access and real escalation paths.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that ABAC is used heavily in built-in Azure roles, especially around \u003ccode\u003eMicrosoft.Authorization/roleAssignments/write\u003c/code\u003e, to constrain which roles can be assigned. It also describes a bypass of a Microsoft Portal recommended condition, where a principal with constrained Owner or User Access Administrator access could create and assign a custom role because \u003ccode\u003eMicrosoft.Authorization/roleDefinitions/write\u003c/code\u003e was not covered by the condition. The article notes that Microsoft closed this reported behavior as “by design.”\u003c/p\u003e\n\n\u003cp\u003eUsing a permission-focused methodology and the \u003ccode\u003e2023-07-01-preview\u003c/code\u003e Role Definitions List API, NetSPI identified that the built-in “Anyscale Platform Administrator Role” included \u003ccode\u003eMicrosoft.Authorization/roleAssignments/write\u003c/code\u003e and \u003ccode\u003eMicrosoft.Authorization/roleAssignments/delete\u003c/code\u003e without ABAC conditions. The article states this could allow arbitrary privilege escalation to Owner and made the role equivalent to highly privileged Azure roles such as Owner, User Access Administrator, and Role Based Access Control Administrator. Microsoft later removed those role assignment permissions from the Anyscale role after the issue was reported to MSRC.\u003c/p\u003e\n"},{"n":3,"title":"The Invoice Scam That Came With an Unsubscribe Link","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/fabricated-invoice-thread-hijacked-esp-list-account-unsubscribe-footer","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"Attackers used a legitimate company’s compromised bulk-mail account to send an invoice-fraud email that passed SPF, DKIM, and DMARC and included a real unsubscribe link, making it look like normal compliant marketing mail. The key warning is that authentication and bulk-mail compliance prove the sending route, not that a payment request is legitimate, so money-transfer instructions still need out-of-band verification.","briefOverview":"\u003cp\u003eAn invoice-fraud email reached a regional financial-advisory firm through an unrelated company’s genuine marketing-list account. The message passed SPF, DKIM, and DMARC, carried a working one-click unsubscribe footer, and included other markers of routine bulk mail. The article says the compliance signals were not bypassed or spoofed, but instead became the disguise for the fraud.\u003c/p\u003e\n\n\u003cp\u003eInside the message was a fabricated email thread impersonating a named advisor at the recipient’s firm and urging a payment approver to settle an invoice without delay. The visible sender name matched the internal advisor, while the actual sending address belonged to the unrelated company. The article says the most likely explanation is that the attacker got into the bulk-mail account, making the domain-owning company a bystander rather than the attacker.\u003c/p\u003e\n\n\u003cp\u003eA U+200C zero-width non-joiner was inserted between every letter of the body, causing the text to appear normal on screen while defeating literal keyword and phrase matching. The message also used two reply addresses on unrelated domains, including management@azurecloudemailus[.]com on a freshly registered attacker-owned domain. IRONSCALES Themis flagged the message based on relationship context, and four more near-identical variants were later quarantined at the same organization.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An invoice-fraud email reached a regional financial-advisory firm through an unrelated company’s legitimate marketing-list account, with passing SPF, DKIM, and DMARC and a working one-click unsubscribe footer.","The message used a fabricated email thread impersonating a named advisor at the recipient’s firm to pressure a payment approver to settle an invoice without delay.","The email body contained a U+200C zero-width non-joiner between every letter, making the text render normally while defeating literal keyword and phrase matching.","The message included two divergent reply addresses on unrelated domains, including one on the attacker-registered domain azurecloudemailus[.]com.","IRONSCALES Themis flagged the message based on relationship context, including a visible sender name matching a known internal contact whose real address was on a different domain."],"insights":["Passing authentication and a real unsubscribe footer were part of the disguise, because they only showed that the domain owner’s mailing infrastructure sent the message, not that the invoice request was truthful.","Blocklisting the established sending domain would punish a likely second victim, since the article says the unrelated company’s legitimate bulk-mail account was most likely abused rather than the company being the attacker.","The only obvious forgery was the sender display name matching an internal advisor while the actual sending address belonged to an unrelated company, making address expansion a critical check in this case.","Relationship context detected the fraud when normal delivery signals were clean, showing that comparing the visible sender name against known internal contacts exposed a mismatch that authentication checks could not.","The article’s recommended control is procedural rather than technical: any request to move money should be verified out of band against an existing contact record before payment processing begins."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on pretexting, phishing as an initial access vector, and the human element in breaches.","category":"research","primary":false},{"title":"2025 FBI IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for reported business email compromise losses of $3,046,598,558.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA guidance to support the point that phishing defenses should focus on the person and process, not only the transport.","category":"guide","primary":false}],"body":"\u003cp\u003eAn invoice-fraud email reached a regional financial-advisory firm through an unrelated company’s genuine marketing-list account. The message passed SPF, DKIM, and DMARC, carried a working one-click unsubscribe footer, and included other markers of routine bulk mail. The article says the compliance signals were not bypassed or spoofed, but instead became the disguise for the fraud.\u003c/p\u003e\n\n\u003cp\u003eInside the message was a fabricated email thread impersonating a named advisor at the recipient’s firm and urging a payment approver to settle an invoice without delay. The visible sender name matched the internal advisor, while the actual sending address belonged to the unrelated company. The article says the most likely explanation is that the attacker got into the bulk-mail account, making the domain-owning company a bystander rather than the attacker.\u003c/p\u003e\n\n\u003cp\u003eA U+200C zero-width non-joiner was inserted between every letter of the body, causing the text to appear normal on screen while defeating literal keyword and phrase matching. The message also used two reply addresses on unrelated domains, including management@azurecloudemailus[.]com on a freshly registered attacker-owned domain. IRONSCALES Themis flagged the message based on relationship context, and four more near-identical variants were later quarantined at the same organization.\u003c/p\u003e\n"},{"n":4,"title":"MECCHA CHAMELEON can't hide from the RCE","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/meccha-chameleon-rce","time":"18:00","priority":"SHOULD READ","score":82,"tldr":"Researchers found a patched MECCHA CHAMELEON custom-map vulnerability that let malicious Steam Workshop maps write arbitrary files to a player’s Windows system, enabling delayed code execution on restart. The issue was fixed in version 4.0.0, and players are advised to be cautious with unofficial maps.","briefOverview":"\u003cp\u003eResearchers found a delayed remote code execution issue in MECCHA CHAMELEON involving attacker-made custom maps. The game lets players create and share maps through Steam Workshop, and lobby hosts can prompt other players to download the selected map. Because MECCHA CHAMELEON maps can contain Unreal Engine Blueprints, a downloaded map can run graph logic inside the game process and call functions exposed to Blueprint.\u003c/p\u003e\n\n\u003cp\u003eThe researchers focused on exposed functions that interacted with the operating system and identified \u003ccode\u003eFinish Recording Output\u003c/code\u003e / \u003ccode\u003eStopRecordingOutput\u003c/code\u003e as a way to create files on the filesystem. By supplying absolute or relative paths, they could write files outside the default recording directory and target locations such as the Windows Startup folder. They also used a null character in the filename to bypass Unreal Engine appending a \u003ccode\u003e.wav\u003c/code\u003e suffix, allowing arbitrary filenames.\u003c/p\u003e\n\n\u003cp\u003eTo make the written file useful for code execution, the researchers controlled bytes in an uncompressed 16-bit PCM WAV recording and embedded a Windows HTML Application payload in the audio data. Their proof of concept wrote the file to the Startup folder so it would run after the victim restarted the device. The maintainers patched the issue in MECCHA CHAMELEON 4.0.0 by preventing \u003ccode\u003eStopRecordingOutput\u003c/code\u003e from creating files, and the researchers said they found no Steam Workshop maps already exploiting the issue.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers found a delayed remote code execution vulnerability in MECCHA CHAMELEON that could be triggered when a victim played on an attacker’s custom map.","MECCHA CHAMELEON custom maps can contain Unreal Engine Blueprints, allowing map graphs to call exposed functions inside the game process when the map runs.","The exposed Unreal Engine audio recording function could be abused to write files to arbitrary locations on the victim’s filesystem by supplying absolute or relative paths.","The researchers bypassed Unreal Engine’s added .wav suffix by using a null character in the filename, then used controlled PCM WAV audio data to create a Windows HTML Application payload.","The game’s maintainers fixed the reported vulnerability in MECCHA CHAMELEON 4.0.0 by preventing the StopRecordingOutput function from creating files."],"insights":["The exploit chain depended on differences between how Unreal Engine appended “.wav” to a filename and how lower-level Windows APIs treated a null character as the end of the path.","A file did not need to be a valid Windows executable to achieve code execution, because Windows HTML Applications could still run script even when WAV metadata appeared before the HTML content.","The researchers avoided interference from normal game audio by recording through a private submix before writing the malicious audio-derived file.","The fixed issue removed even intended file creation through StopRecordingOutput, showing the maintainers chose to eliminate that file-writing capability rather than only restrict malicious paths.","The researchers reviewed existing Steam Workshop maps and reported that they found none already exploiting the issue."],"referencedReports":[{"title":"MECCHA CHAMELEON","url":"https://khaelkugler.com/blogs/meccha_chameleon.html","publisher":"Khael Kugler","context":"The article cites this prior blog post as detailing an earlier remote code execution issue in MECCHA CHAMELEON upon map load.","category":"research","primary":false}],"body":"\u003cp\u003eResearchers found a delayed remote code execution issue in MECCHA CHAMELEON involving attacker-made custom maps. The game lets players create and share maps through Steam Workshop, and lobby hosts can prompt other players to download the selected map. Because MECCHA CHAMELEON maps can contain Unreal Engine Blueprints, a downloaded map can run graph logic inside the game process and call functions exposed to Blueprint.\u003c/p\u003e\n\n\u003cp\u003eThe researchers focused on exposed functions that interacted with the operating system and identified \u003ccode\u003eFinish Recording Output\u003c/code\u003e / \u003ccode\u003eStopRecordingOutput\u003c/code\u003e as a way to create files on the filesystem. By supplying absolute or relative paths, they could write files outside the default recording directory and target locations such as the Windows Startup folder. They also used a null character in the filename to bypass Unreal Engine appending a \u003ccode\u003e.wav\u003c/code\u003e suffix, allowing arbitrary filenames.\u003c/p\u003e\n\n\u003cp\u003eTo make the written file useful for code execution, the researchers controlled bytes in an uncompressed 16-bit PCM WAV recording and embedded a Windows HTML Application payload in the audio data. Their proof of concept wrote the file to the Startup folder so it would run after the victim restarted the device. The maintainers patched the issue in MECCHA CHAMELEON 4.0.0 by preventing \u003ccode\u003eStopRecordingOutput\u003c/code\u003e from creating files, and the researchers said they found no Steam Workshop maps already exploiting the issue.\u003c/p\u003e\n"},{"n":12,"title":"Remote access hardening playbook: Reducing RMM tool risk for SMBs","source":"acronis.com","sourceColorIdx":10,"link":"https://www.acronis.com/en/tru/posts/remote-access-hardening-playbook-reducing-rmm-tool-risk-for-smbs/","time":"03:00","priority":"MAY READ","score":58,"tldr":"SMBs and MSPs should reduce remote access risk by inventorying and consolidating RMM tools, blocking attacker-favored tools like MeshAgent and Ammyy Admin unless explicitly authorized, and hardening legitimate tools with MFA, patching, application control, and monitoring for unauthorized installs or suspicious lateral movement.","briefOverview":"\u003cp\u003eAcronis presents a hardening playbook for reducing remote monitoring and management tool risk among SMBs and MSPs. The article builds on prior telemetry from over 1.8 million managed endpoints, which showed that 63% of endpoints run more than one remote access tool. It argues that tool sprawl increases attack surface and makes attacker activity harder to distinguish from legitimate IT work.\u003c/p\u003e\n\n\u003cp\u003eThe playbook focuses on remote access technologies and tools commonly abused in the dataset, including RDP, ConnectWise ScreenConnect, MeshAgent, and VNC. For RDP, Acronis observed attackers enabling Remote Desktop through registry changes, disabling Network Level Authentication, using RDPWrap for concurrent sessions, and extracting saved RDP passwords. For ScreenConnect, the article highlights exploitation of CVE-2024-1709 and trojanized installers that connect victims to attacker-controlled infrastructure.\u003c/p\u003e\n\n\u003cp\u003eAcronis recommends a tiered control model: block tools such as MeshAgent and Ammyy Admin unless explicitly authorized, monitor and harden tools such as VNC, RDP, Tactical RMM, and Action1, and audit and maintain mainstream tools such as ScreenConnect, AnyDesk, TeamViewer, and Splashtop. The article also recommends inventorying remote access tools, investigating newly installed agents without deployment records, watching for lateral movement, patching internet-facing RMM infrastructure immediately, and reducing redundant tools. It states that remote access tool activity combined with command-line, command-and-control, or lateral movement behavior was malicious 99% of the time in its data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis telemetry from over 1.8 million managed endpoints showed that 63% of endpoints run more than one remote access tool, which can unnecessarily increase a company’s attack surface.","RDP was the most commonly abused remote access protocol in the dataset, with attackers enabling it through registry changes, disabling Network Level Authentication, using RDPWrap for concurrent sessions, and extracting saved RDP passwords.","ConnectWise ScreenConnect has been targeted through vulnerability exploitation such as CVE-2024-1709 and through trojanized installers that connect victims to attacker-controlled infrastructure.","MeshAgent was the single most frequently attacker-deployed tool in the dataset, and organizations that do not use MeshCentral are advised to treat any MeshAgent presence as a confirmed indicator of compromise.","The article recommends a tiered control approach: block tools such as MeshAgent and Ammyy Admin unless explicitly authorized, monitor and harden tools such as VNC, RDP, Tactical RMM, and Action1, and audit and maintain mainstream tools such as ScreenConnect, AnyDesk, TeamViewer, and Splashtop."],"insights":["The article says the strongest malicious signal is not merely the presence of a remote access tool, but the combination of such a tool with command-line activity, command-and-control behavior, or lateral movement, which was malicious 99% of the time in Acronis data.","VNC detections were rarely ambiguous in the dataset: 95.8% of hundreds of EDR incidents involving VNC variants, primarily UltraVNC, were classified as malicious rather than merely suspicious.","ScreenConnect risk is not limited to unpatched servers, because attackers have also distributed trojanized ScreenConnect installers that connect victims to attacker-controlled infrastructure even when the legitimate product has a patch available.","MeshAgent can be difficult to remove through automated quarantine because it can install as a Windows service, lock its binary files, and restart after termination, so the article recommends manual incident response when quarantine fails.","The article treats any ScreenConnect agent connected to a server URL the organization does not control as a compromise, making server ownership a practical way to distinguish authorized remote access from attacker-deployed access."],"referencedReports":[],"body":"\u003cp\u003eAcronis presents a hardening playbook for reducing remote monitoring and management tool risk among SMBs and MSPs. The article builds on prior telemetry from over 1.8 million managed endpoints, which showed that 63% of endpoints run more than one remote access tool. It argues that tool sprawl increases attack surface and makes attacker activity harder to distinguish from legitimate IT work.\u003c/p\u003e\n\n\u003cp\u003eThe playbook focuses on remote access technologies and tools commonly abused in the dataset, including RDP, ConnectWise ScreenConnect, MeshAgent, and VNC. For RDP, Acronis observed attackers enabling Remote Desktop through registry changes, disabling Network Level Authentication, using RDPWrap for concurrent sessions, and extracting saved RDP passwords. For ScreenConnect, the article highlights exploitation of CVE-2024-1709 and trojanized installers that connect victims to attacker-controlled infrastructure.\u003c/p\u003e\n\n\u003cp\u003eAcronis recommends a tiered control model: block tools such as MeshAgent and Ammyy Admin unless explicitly authorized, monitor and harden tools such as VNC, RDP, Tactical RMM, and Action1, and audit and maintain mainstream tools such as ScreenConnect, AnyDesk, TeamViewer, and Splashtop. The article also recommends inventorying remote access tools, investigating newly installed agents without deployment records, watching for lateral movement, patching internet-facing RMM infrastructure immediately, and reducing redundant tools. It states that remote access tool activity combined with command-line, command-and-control, or lateral movement behavior was malicious 99% of the time in its data.\u003c/p\u003e\n"},{"n":1,"title":"A New Era for Offensive Security","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/netspi-updates/a-new-era-for-offensive-security/","time":"12:00","priority":"MAY READ","score":55,"tldr":"NetSPI and Synack are merging, backed by KKR, to create a larger offensive security platform combining expert human testing with AI-enabled capabilities. The key message is that effective modern pentesting requires both automation and skilled judgment, not fully autonomous tools alone.","briefOverview":"\u003cp\u003eNetSPI and Synack announced a definitive agreement to merge, backed by KKR, to form what they describe as the industry’s leading offensive cybersecurity platform. The companies cite nearly 40 years of combined operating history and more than 13 million hours of real-world offensive testing experience. The article presents the merger as a response to expanding attack surfaces, faster vulnerability disclosures, and the limits of annual or surface-level security testing.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that fully autonomous security testing falls short because complex vulnerabilities often depend on business logic, infrastructure choices, and attacker creativity. It says skilled testers bring judgment and intuition that help identify issues tools miss and determine whether flagged vulnerabilities matter in a specific environment. NetSPI and Synack position their combined approach as using AI to accelerate discovery, analysis, and validation while relying on expert judgment to separate meaningful findings from noise.\u003c/p\u003e\n\n\u003cp\u003eThe combined company says it plans to deliver continuous security testing and validation across the full attack surface. Its stated future offerings include a deep bench of vetted offensive security talent amplified by agentic AI, purpose-built AI capabilities, expanded service offerings with flexible delivery models, and greater operational scale and efficiency. The article emphasizes that the future of pentesting is not a choice between humans and machines, but the use of both together.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NetSPI and Synack announced a definitive agreement to merge, backed by KKR, to form an offensive cybersecurity platform.","The companies cite nearly 40 years of combined operating history and more than 13 million hours of real-world offensive testing experience.","The article argues that fully autonomous testing falls short because complex vulnerabilities often require human judgment to identify, validate, and prioritize.","NetSPI and Synack say their combined approach will pair security talent with AI-enabled capabilities to deliver more sophisticated testing at greater scale.","The merged company plans to offer continuous security testing and validation across the full attack surface, expanded service offerings, and greater operational scale."],"insights":["The article frames AI’s main value in offensive security as amplifying expert judgment rather than replacing testers, especially when findings must be validated for a specific organization and architecture.","NetSPI and Synack emphasize that the biggest risk of fully autonomous testing is not just false positives, but missed issues that tools never flag and that can hide behind security noise.","The merger’s stated strategy is to combine continuous testing with human prioritization, suggesting that speed alone is insufficient unless findings are also actionable.","The article positions business logic and system interconnections as areas where checklist-style testing is most likely to fail."],"referencedReports":[],"body":"\u003cp\u003eNetSPI and Synack announced a definitive agreement to merge, backed by KKR, to form what they describe as the industry’s leading offensive cybersecurity platform. The companies cite nearly 40 years of combined operating history and more than 13 million hours of real-world offensive testing experience. The article presents the merger as a response to expanding attack surfaces, faster vulnerability disclosures, and the limits of annual or surface-level security testing.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that fully autonomous security testing falls short because complex vulnerabilities often depend on business logic, infrastructure choices, and attacker creativity. It says skilled testers bring judgment and intuition that help identify issues tools miss and determine whether flagged vulnerabilities matter in a specific environment. NetSPI and Synack position their combined approach as using AI to accelerate discovery, analysis, and validation while relying on expert judgment to separate meaningful findings from noise.\u003c/p\u003e\n\n\u003cp\u003eThe combined company says it plans to deliver continuous security testing and validation across the full attack surface. Its stated future offerings include a deep bench of vetted offensive security talent amplified by agentic AI, purpose-built AI capabilities, expanded service offerings with flexible delivery models, and greater operational scale and efficiency. The article emphasizes that the future of pentesting is not a choice between humans and machines, but the use of both together.\u003c/p\u003e\n"},{"n":6,"title":"While anti-bot vendors talk about AI agents, classical bots are getting the bypasses","source":"blog.castle.io","sourceColorIdx":8,"link":"https://blog.castle.io/while-anti-bot-vendors-talk-about-ai-agents-classical-bots-are-getting-the-bypasses/","time":"10:14","priority":"MAY READ","score":55,"tldr":"The article argues that the security industry is over-focusing on AI agent management while traditional bots are still successfully bypassing anti-bot systems. AI’s more immediate impact is helping attackers reverse engineer defenses and build faster, more scalable automation, so vendors should be judged on whether they can still detect purpose-built bots.","briefOverview":"\u003cp\u003eThe article argues that the anti-bot industry is increasingly focused on AI agent management while traditional bot detection problems remain unresolved. It says websites will need ways to decide which AI agents are acceptable and what they are allowed to do, but this is not the same problem as anti-abuse or fraud prevention. The author points to Forrester renaming its “Bot Management Software” category to “Bot and Agent Trust Management Software” as an example of the shift in industry language.\u003c/p\u003e\n\n\u003cp\u003eThe article says bot developers are actively reverse engineering and bypassing major anti-bot systems in Discord servers, Telegram groups, Reddit communities, and GitHub repositories. These bypasses include generating valid anti-bot payloads without executing protected JavaScript in a real browser, using browserless solvers that reproduce expected backend signals, and returning valid CAPTCHA answers at scale in well under a second. The author argues that AI is helping attackers analyze undocumented public APIs, inspect and deobfuscate client-side bot fingerprinting code, debug automation, reproduce expected signals, and maintain tooling when targets change.\u003c/p\u003e\n\n\u003cp\u003eThe author says the result of this AI-assisted work is usually still a bot, whether it uses Playwright, Camoufox, Cloakbrowser, RoxyBrowser, an anti-detect browser, a custom browser stack, or a browserless HTTP client. The article argues that anti-bot vendors should be judged by measurable outcomes such as fraudulent accounts created, credential stuffing reaching login endpoints, emergency rules deployed, and automated traffic that bypasses defenses. Its central claim is that understanding the supposed intent of an AI shopping agent is less important if a platform cannot identify purpose-built automation that has reverse engineered its defenses.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI agent management is not the same problem as traditional bot detection, anti-abuse, or fraud prevention.","The author says many major anti-bot systems are actively reverse engineered and bypassed by bot developers in Discord servers, Telegram groups, Reddit communities, and GitHub repositories.","The article states that attackers can generate valid anti-bot payloads without running protected JavaScript in a real browser, use browserless solvers, and solve CAPTCHAs at scale in well under a second.","The author argues that AI is helping attackers analyze undocumented public APIs, inspect and deobfuscate anti-bot JavaScript, debug automation, reproduce expected signals, and maintain their tools when targets change.","The article says anti-bot products should be judged by measurable outcomes such as fraudulent accounts created, credential stuffing that reaches login endpoints, emergency rules deployed, and automated traffic that bypasses defenses."],"insights":["The article draws a practical distinction between AI agents as a new kind of website visitor and AI as a tool that helps attackers improve conventional bots without any AI agent ever touching the target site.","A central warning is that claims about understanding an agent’s intent can distract from the more measurable question of whether a product stops automated abuse that reaches logins, signups, and fraud workflows.","The author suggests customers can evaluate anti-bot vendors by operational pain signals such as middle-of-the-night pages, cleanup of fake accounts, emergency fraud rules, and automated traffic that still gets through.","The article highlights that the strongest bypasses are not merely bots pretending to move like humans, but systems that reproduce the anti-bot backend’s expected signals without executing the protected JavaScript in a real browser."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that the anti-bot industry is increasingly focused on AI agent management while traditional bot detection problems remain unresolved. It says websites will need ways to decide which AI agents are acceptable and what they are allowed to do, but this is not the same problem as anti-abuse or fraud prevention. The author points to Forrester renaming its “Bot Management Software” category to “Bot and Agent Trust Management Software” as an example of the shift in industry language.\u003c/p\u003e\n\n\u003cp\u003eThe article says bot developers are actively reverse engineering and bypassing major anti-bot systems in Discord servers, Telegram groups, Reddit communities, and GitHub repositories. These bypasses include generating valid anti-bot payloads without executing protected JavaScript in a real browser, using browserless solvers that reproduce expected backend signals, and returning valid CAPTCHA answers at scale in well under a second. The author argues that AI is helping attackers analyze undocumented public APIs, inspect and deobfuscate client-side bot fingerprinting code, debug automation, reproduce expected signals, and maintain tooling when targets change.\u003c/p\u003e\n\n\u003cp\u003eThe author says the result of this AI-assisted work is usually still a bot, whether it uses Playwright, Camoufox, Cloakbrowser, RoxyBrowser, an anti-detect browser, a custom browser stack, or a browserless HTTP client. The article argues that anti-bot vendors should be judged by measurable outcomes such as fraudulent accounts created, credential stuffing reaching login endpoints, emergency rules deployed, and automated traffic that bypasses defenses. Its central claim is that understanding the supposed intent of an AI shopping agent is less important if a platform cannot identify purpose-built automation that has reverse engineered its defenses.\u003c/p\u003e\n"},{"n":9,"title":"Introducing context-aware vulnerability discovery and remediation with Cloudflare Managed Defense and OpenAI Daybreak models","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/vulnerability-discovery-remediation/","time":"21:03","priority":"MAY READ","score":55,"tldr":"Cloudflare is launching early access to Vulnerability Discovery and Remediation, a Managed Defense service that uses OpenAI Daybreak models to find, validate, prioritize, and propose fixes for vulnerabilities in customer-authorized code. The key value is combining source-code analysis with Cloudflare production traffic, WAF, and security-event context so teams can focus first on exposed, actively targeted issues while retaining control over any patches or rules.","briefOverview":"\u003cp\u003eCloudflare announced early access to Vulnerability Discovery and Remediation, an invitation-only service that is now part of Cloudflare Managed Defense. The service helps selected customers detect and mitigate vulnerabilities in codebases they authorize Cloudflare to access. Cloudflare says the service uses OpenAI Daybreak models, including GPT-5.6 Cyber, for reconnaissance, hunting, and validation, while customers remain responsible for deciding whether proposed patches or mitigations are implemented.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that vulnerability prioritization is becoming harder because scanners and large language models can surface many findings quickly, while attackers can also use AI to accelerate parts of discovery and exploitation. Cloudflare says its approach adds production context by using Web Assets, WAF data, Workers Observability, and traffic and security snapshots to determine which routes are active, heavily used, or showing recent security activity. Findings can be paired with recommended code patches and, when evidence supports it, Cloudflare WAF Custom rules scoped around the request details needed to reach vulnerable code.\u003c/p\u003e\n\n\u003cp\u003eCloudflare says the harness runs on Cloudflare and sends model prompts from Workers through Cloudflare AI Gateway to OpenAI Daybreak models on OpenAI servers, with no model inference running at Cloudflare’s edge. The service limits investigations to authorized source code and evidence, applies configured redaction controls, logs and checks tool calls, and validates proposed patches or rules outside the model before customer review. During early access, each engagement starts with one authorized application and uses approved read access to relevant Web Assets, WAF controls, and Workers Trace Events Logpush where available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare announced early access to Vulnerability Discovery and Remediation, an invitation-only service within Cloudflare Managed Defense that helps customers detect and mitigate vulnerabilities in authorized codebases.","The service uses OpenAI Daybreak models, including GPT-5.6 Cyber, for reconnaissance, hunting, and validation, while customers decide whether proposed code patches or mitigations are implemented.","Vulnerability Discovery and Remediation combines source code analysis with Cloudflare Web Assets, WAF, Workers Observability, and traffic and security data to prioritize findings based on production exposure and security activity.","The system can recommend code patches and, when evidence supports it, Cloudflare WAF Custom rules scoped around the method, path, and request details needed to reach vulnerable code.","Model prompts are sent from Cloudflare Workers through Cloudflare AI Gateway to OpenAI servers, and no model inference runs at Cloudflare's edge or can directly apply patches or rules."],"insights":["Cloudflare’s prioritization approach explicitly separates proof of a code vulnerability from evidence of real-world exposure, using traffic and security signals only to raise urgency after source-code evidence supports the finding.","The service is designed to avoid overbroad temporary defenses: if a route pattern contains only variables and wildcards, Cloudflare says it will not suggest a WAF rule rather than claim a connection the evidence cannot support.","Proposed WAF rules are validated against synthetic fixtures representing expected requests instead of being tested against customer traffic before review.","The workflow treats source code, logs, and request metadata as evidence to inspect rather than instructions to follow, and tool calls are logged and checked against the investigation’s access policy.","Network context can change the practical priority of a finding by showing whether the affected code is deployed on an active route, receives significant traffic, has recent security activity, or already has WAF protections blocking related attacks."],"referencedReports":[],"body":"\u003cp\u003eCloudflare announced early access to Vulnerability Discovery and Remediation, an invitation-only service that is now part of Cloudflare Managed Defense. The service helps selected customers detect and mitigate vulnerabilities in codebases they authorize Cloudflare to access. Cloudflare says the service uses OpenAI Daybreak models, including GPT-5.6 Cyber, for reconnaissance, hunting, and validation, while customers remain responsible for deciding whether proposed patches or mitigations are implemented.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that vulnerability prioritization is becoming harder because scanners and large language models can surface many findings quickly, while attackers can also use AI to accelerate parts of discovery and exploitation. Cloudflare says its approach adds production context by using Web Assets, WAF data, Workers Observability, and traffic and security snapshots to determine which routes are active, heavily used, or showing recent security activity. Findings can be paired with recommended code patches and, when evidence supports it, Cloudflare WAF Custom rules scoped around the request details needed to reach vulnerable code.\u003c/p\u003e\n\n\u003cp\u003eCloudflare says the harness runs on Cloudflare and sends model prompts from Workers through Cloudflare AI Gateway to OpenAI Daybreak models on OpenAI servers, with no model inference running at Cloudflare’s edge. The service limits investigations to authorized source code and evidence, applies configured redaction controls, logs and checks tool calls, and validates proposed patches or rules outside the model before customer review. During early access, each engagement starts with one authorized application and uses approved read access to relevant Web Assets, WAF controls, and Workers Trace Events Logpush where available.\u003c/p\u003e\n"},{"n":7,"title":"Supply Chain Attacks in 2026: Why Threat Intelligence Is the Only Early Warning System That Works","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/supply-chain-attacks-in-2026-vendor-risk/","time":"08:21","priority":"MAY READ","score":50,"tldr":"Supply chain attacks are now a major breach vector because trusted vendors, software components, and managed platforms can be compromised outside an organization’s direct visibility. The article argues that continuous external threat intelligence and vendor monitoring are necessary to detect these risks before they become public breaches.","briefOverview":"\u003cp\u003eThe article argues that supply chain attacks in 2026 have become a primary breach vector rather than an edge-case risk. It cites Verizon\u0026rsquo;s 2026 Data Breach Investigations Report, which found third-party involvement in 48% of breaches, up 60% year over year. The article says the core problem is that organizations depend on vendors, open-source components, and managed tools that expand an attack surface they do not directly control.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights Cl0p campaigns against Progress Software\u0026rsquo;s MOVEit Transfer and Fortra\u0026rsquo;s GoAnywhere MFT as examples of this structural blind spot. CISA and the FBI documented Cl0p exploitation of CVE-2023-34362 in MOVEit Transfer beginning on May 27, 2023, and an earlier campaign against CVE-2023-0669 in GoAnywhere MFT. By January 2024, MOVEit-related breaches or downstream exposures at more than 2,700 organizations had compromised personal data of more than 93 million people, according to tracking by Emsisoft and KonBriefing Research.\u003c/p\u003e\n\n\u003cp\u003eThe article says traditional vulnerability scanning cannot fully address these risks because vulnerable assets may belong to vendors and sit outside an organization\u0026rsquo;s scan scope. It points to government SBOM guidance from CISA, the NSA, the FBI, and international partners as evidence that organizations are expected to understand what is inside vendors\u0026rsquo; software stacks before deployment. It concludes that continuous visibility into vendors, software components, exposed credentials, dark web chatter, and third-party breach signals is needed before a vendor breach notification arrives.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Verizon's 2026 Data Breach Investigations Report found third-party involvement in 48% of breaches, up 60% year over year.","The article says supply chain attacks target vendors, software components, and build pipelines that an organization depends on, rather than attacking the organization directly.","CISA and the FBI documented that the Cl0p ransomware group exploited CVE-2023-34362 in Progress Software's MOVEit Transfer platform beginning on May 27, 2023.","By January 2024, breaches or downstream exposures linked to MOVEit affected more than 2,700 organizations and compromised personal data of more than 93 million people, according to tracking by Emsisoft and KonBriefing Research.","The article argues that continuous monitoring of vendor infrastructure, exposed credentials, dark web chatter, and third-party breach signals is needed because traditional vulnerability management does not cover those external risks."],"insights":["In the GoAnywhere campaign, CISA and the FBI did not identify lateral movement into victim networks, showing that attackers can cause major harm without moving beyond a vendor platform when that platform already holds sensitive data.","The article frames vendor risk as a visibility problem rather than only a patching problem, because vulnerable assets may sit outside an organization’s scanning scope entirely.","The MOVEit timeline shows how quickly exposure can outpace public response, with exploitation beginning before Progress published its advisory and before CISA added the flaw to its Known Exploited Vulnerabilities catalog.","The article treats Software Bills of Materials as part of a broader regulatory shift toward requiring organizations to understand the components inside vendor software before deployment, not after an incident."],"referencedReports":[{"title":"#StopRansomware: CL0P Ransomware Gang: Exploits CVE-2023-34362 MOVEit Vulnerability","url":"https://www.cisa.gov/sites/default/files/2023-06/aa23-158a-stopransomware-cl0p-ransomware-gang-exploits-moveit-vulnerability_7.pdf","publisher":"CISA and FBI","context":"The article cites this advisory for details on Cl0p exploitation of MOVEit Transfer and GoAnywhere MFT vulnerabilities.","category":"advisory","primary":true},{"title":"CISA, NSA, and 19 International Partners Release Shared Vision of Software Bill of Materials for Cybersecurity Guide","url":"https://www.cisa.gov/news-events/news/cisa-nsa-and-19-international-partners-release-shared-vision-software-bill-materials-cybersecurity","publisher":"CISA, NSA, and international partners","context":"The article references this joint guidance as evidence that governments are treating software component transparency as a baseline security expectation.","category":"guide","primary":false}],"body":"\u003cp\u003eThe article argues that supply chain attacks in 2026 have become a primary breach vector rather than an edge-case risk. It cites Verizon\u0026rsquo;s 2026 Data Breach Investigations Report, which found third-party involvement in 48% of breaches, up 60% year over year. The article says the core problem is that organizations depend on vendors, open-source components, and managed tools that expand an attack surface they do not directly control.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights Cl0p campaigns against Progress Software\u0026rsquo;s MOVEit Transfer and Fortra\u0026rsquo;s GoAnywhere MFT as examples of this structural blind spot. CISA and the FBI documented Cl0p exploitation of CVE-2023-34362 in MOVEit Transfer beginning on May 27, 2023, and an earlier campaign against CVE-2023-0669 in GoAnywhere MFT. By January 2024, MOVEit-related breaches or downstream exposures at more than 2,700 organizations had compromised personal data of more than 93 million people, according to tracking by Emsisoft and KonBriefing Research.\u003c/p\u003e\n\n\u003cp\u003eThe article says traditional vulnerability scanning cannot fully address these risks because vulnerable assets may belong to vendors and sit outside an organization\u0026rsquo;s scan scope. It points to government SBOM guidance from CISA, the NSA, the FBI, and international partners as evidence that organizations are expected to understand what is inside vendors\u0026rsquo; software stacks before deployment. It concludes that continuous visibility into vendors, software components, exposed credentials, dark web chatter, and third-party breach signals is needed before a vendor breach notification arrives.\u003c/p\u003e\n"},{"n":8,"title":"The story behind the intelligence","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/the-story-behind-the-intelligence/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cisco Talos warns that AI model guardrails are increasingly blocking legitimate security work, creating a “safety penalty” that slows defenders while attackers use less-restricted tools. Security teams should measure AI refusal rates and plan fallback or private AI options to preserve incident-response capability.","briefOverview":"\u003cp\u003eThis Threat Source newsletter looks behind the scenes at how Cisco Talos produces threat intelligence, emphasizing that the finished assessments hide a messy process of dead ends, conversations, evidence gathering, and careful writing for defenders. It highlights a Beers with Talos episode featuring Azim Khodjibaev, whose adversary engagement work includes building deep- and dark-web personas, directly engaging threat actors, and maintaining relationships with people who may openly threaten him. The article says Khodjibaev once maintained eight separate personas, some interacting with one another, and that his work helped Talos identify prolific cybercriminals and contribute to wider disruption efforts.\u003c/p\u003e\n\n\u003cp\u003eThe newsletter’s main security focus is Cisco Talos’ warning about an AI “safety penalty,” where built-in guardrails in frontier AI models increasingly block legitimate defensive tasks. Talos says this was evident in July 2026, when Hugging Face’s primary cloud LLM refused to analyze forensic data during a breach, delaying the response. The article argues this creates an asymmetry because defenders can be slowed by refusals while adversaries can use unconstrained models to attack at machine speed.\u003c/p\u003e\n\n\u003cp\u003eTalos recommends that security leaders reclaim operational sovereignty by measuring AI refusal rates and ensuring they have the final say over their AI capabilities. Suggested approaches include private infrastructure, Model-as-a-Service platforms, or hybrid fallback systems that reroute refused prompts to an unconstrained local model. The newsletter also summarizes weekly security headlines, links to other Talos content, lists upcoming Talos events, and provides prevalent malware file hashes from Talos telemetry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The newsletter emphasizes that producing usable threat intelligence involves messy investigative work, including dead ends, conversations, and evidence-gathering that are usually abstracted away from the final product.","Talos researcher Azim Khodjibaev’s adversary engagement work includes developing deep- and dark-web personas, directly engaging threat actors, and maintaining relationships with people who have openly threatened him.","Khodjibaev has maintained eight separate personas at once, some of which interacted with one another, and his engagements have helped Talos identify prolific cybercriminals and support wider disruption efforts.","Cisco Talos describes an AI “safety penalty,” where built-in guardrails in frontier AI models increasingly block legitimate defensive tasks and can delay incident response.","Talos recommends that security leaders audit AI refusal rates and evaluate alternatives such as private infrastructure, Model-as-a-Service platforms, or hybrid fallback systems that reroute refused prompts to an unconstrained local model."],"insights":["Threat actors’ behavior is not uniformly professional or highly skilled; Talos’ adversary engagement work shows a mix of technically capable operators, impulsive actors, ego-driven individuals, one-trick ponies, and less-experienced people in loose online collectives.","Direct engagement can provoke unusually personal reactions from criminals, including ransomware operators putting “Azim sucks” in their code and accusing the researcher of belonging to the groups he was investigating.","AI guardrails can become an operational dependency risk because a vendor policy change could quietly break defensive workflows overnight.","Talos frames the AI issue as an asymmetry: defenders may be blocked by cloud AI safety rules during legitimate investigations, while adversaries can use unconstrained models to move faster."],"referencedReports":[],"body":"\u003cp\u003eThis Threat Source newsletter looks behind the scenes at how Cisco Talos produces threat intelligence, emphasizing that the finished assessments hide a messy process of dead ends, conversations, evidence gathering, and careful writing for defenders. It highlights a Beers with Talos episode featuring Azim Khodjibaev, whose adversary engagement work includes building deep- and dark-web personas, directly engaging threat actors, and maintaining relationships with people who may openly threaten him. The article says Khodjibaev once maintained eight separate personas, some interacting with one another, and that his work helped Talos identify prolific cybercriminals and contribute to wider disruption efforts.\u003c/p\u003e\n\n\u003cp\u003eThe newsletter’s main security focus is Cisco Talos’ warning about an AI “safety penalty,” where built-in guardrails in frontier AI models increasingly block legitimate defensive tasks. Talos says this was evident in July 2026, when Hugging Face’s primary cloud LLM refused to analyze forensic data during a breach, delaying the response. The article argues this creates an asymmetry because defenders can be slowed by refusals while adversaries can use unconstrained models to attack at machine speed.\u003c/p\u003e\n\n\u003cp\u003eTalos recommends that security leaders reclaim operational sovereignty by measuring AI refusal rates and ensuring they have the final say over their AI capabilities. Suggested approaches include private infrastructure, Model-as-a-Service platforms, or hybrid fallback systems that reroute refused prompts to an unconstrained local model. The newsletter also summarizes weekly security headlines, links to other Talos content, lists upcoming Talos events, and provides prevalent malware file hashes from Talos telemetry.\u003c/p\u003e\n"}]</script>
