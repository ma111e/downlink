\n\n\u003cp\u003eThe release is expected to include CVE-2026-115560, a remote code execution issue that requires a particular combination of session serialization settings and enabled session upload progress. As an interim measure, PHP urged users to set \u003ccode\u003esession.upload_progress.enabled=0\u003c/code\u003e and restart PHP workers. The advisory follows recently patched PHP2Shell flaws, CVE-2026-109618 and CVE-2026-109619, which have seen limited active exploitation against publicly accessible Palo Alto Networks management interfaces and Check Point Security Gateways.\u003c/p\u003e\n"}]</script>
