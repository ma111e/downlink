<script type="application/json" id="dl-articles">[{"n":1,"title":"One RFQ Number, Two Real Suppliers, 17 Minutes Apart","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/two-authentic-suppliers-one-rfq-number-cross-sender-campaign-correlation","time":"11:00","priority":"MAY READ","score":68,"tldr":"Two legitimate aviation suppliers sent near-identical RFQ phishing emails from authenticated Microsoft 365 accounts, revealing a cross-sender campaign only when analysts correlated the shared reference number, template, and landing-page path. Organizations should detect vendor-email compromise by clustering message content and destinations across senders rather than relying solely on sender authentication or reputation.","briefOverview":"\u003cp\u003eA UK charter airline received two nearly identical request-for-quotation emails, both using RFQ number 68453, from two different aviation suppliers 17 minutes apart. The messages originated from the suppliers’ own Microsoft 365 tenants, passed authentication at the airline’s gateway, and came from first-time senders. Eight mailboxes across two airline domains received the pair, including a fleet support engineer and an engineering director. A human analyst ultimately resolved both messages as malicious and the copies were removed.\u003c/p\u003e\n\n\u003cp\u003eEach email used the same one-line template and a bold, PDF-named link, \u003ccode\u003eView_RFQ68453_.pdf\u003c/code\u003e, rather than including an attachment. The subject line, \u003ccode\u003eRequest for Quotation 68453_\u003c/code\u003e, and link text used a supplier-specific suffix, while both links led to the same \u003ccode\u003e/aerosupply/technic/aviation.html\u003c/code\u003e path on an unrelated web-design site. Considered separately, each message looked like an unusual but authenticated vendor email; considered together, the reused reference number, shared template, and identical destination path exposed a coordinated pattern. The article’s practical recommendation is to correlate inbound vendor messages by reference number, template shape, and destination path across senders, because sender authentication alone cannot establish that two legitimate accounts are being used independently.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A UK charter airline received two nearly identical RFQ emails numbered 68453 from two different aviation suppliers 17 minutes apart.","Both messages were sent from within the suppliers’ Microsoft 365 tenants, passed authentication at the airline’s gateway, and came from first-time senders.","Each email used the same template and a bold PDF-named link, while both links resolved to the same aviation-themed path on an unrelated web-design site.","Eight mailboxes across two airline domains received the messages, including a fleet support engineer and an engineering director.","A human analyst resolved both emails as malicious, and the copies were removed, although the record did not establish whether anyone clicked."],"insights":["Email authentication confirmed that each message came from the supplier account it claimed to use, but it did not establish that the supplier account was being used legitimately.","The campaign became apparent only by correlating content across unrelated senders: the reused RFQ number, matching template, and identical destination path provided the stable links between the emails.","The supplier-specific suffix added to the shared RFQ number and PDF-style link made each copy appear tailored while preserving a detectable template pattern.","Two first-time supplier emails could appear unremarkable when reviewed separately, but their arrival within 17 minutes and shared content created a materially different signal."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites this report for statistics on phishing as initial access, the human element in breaches, and the email gateway attack mix.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references this report as support for the continuing risk of supplier-borne lures.","category":"research","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references the FBI IC3 report as support for the standing risk posed by supplier-borne lures.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA's phishing guidance in discussing supplier-borne lures as an ongoing risk.","category":"guide","primary":false}],"body":"\u003cp\u003eA UK charter airline received two nearly identical request-for-quotation emails, both using RFQ number 68453, from two different aviation suppliers 17 minutes apart. The messages originated from the suppliers’ own Microsoft 365 tenants, passed authentication at the airline’s gateway, and came from first-time senders. Eight mailboxes across two airline domains received the pair, including a fleet support engineer and an engineering director. A human analyst ultimately resolved both messages as malicious and the copies were removed.\u003c/p\u003e\n\n\u003cp\u003eEach email used the same one-line template and a bold, PDF-named link, \u003ccode\u003eView_RFQ68453_.pdf\u003c/code\u003e, rather than including an attachment. The subject line, \u003ccode\u003eRequest for Quotation 68453_\u003c/code\u003e, and link text used a supplier-specific suffix, while both links led to the same \u003ccode\u003e/aerosupply/technic/aviation.html\u003c/code\u003e path on an unrelated web-design site. Considered separately, each message looked like an unusual but authenticated vendor email; considered together, the reused reference number, shared template, and identical destination path exposed a coordinated pattern. The article’s practical recommendation is to correlate inbound vendor messages by reference number, template shape, and destination path across senders, because sender authentication alone cannot establish that two legitimate accounts are being used independently.\u003c/p\u003e\n"}]</script>
