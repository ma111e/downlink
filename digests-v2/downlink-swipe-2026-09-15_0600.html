<script type="application/json" id="dl-articles">[{"n":4,"title":"Cisco Secure Email Gateway Flaw Exploited in the Wild, Enables Root Command Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisco-secure-email-gateway-flaw.html","time":"06:11","priority":"MUST READ","score":98,"tldr":"Cisco Secure Email Gateway AsyncOS has a critically rated, actively exploited SQL injection flaw (CVE-2026-76461) that lets unauthenticated attackers send crafted emails and execute commands as root. Organizations should immediately update to Cisco’s fixed releases and investigate mail and external network logs for signs of compromise.","briefOverview":"\u003cp\u003eCisco warned that CVE-2026-76461, a critical flaw in AsyncOS Software for Cisco Secure Email Gateway, is being actively exploited. The vulnerability has a CVSS score of 9.8 and affects physical and virtual Secure Email Gateway devices regardless of configuration. Cisco said Secure Email and Web Manager and Secure Web Appliance are not affected.\u003c/p\u003e\n\n\u003cp\u003eAn unauthenticated attacker can send a crafted email containing malicious SQL statements to an affected device, potentially executing commands with root privileges on its underlying operating system. Cisco released fixes in AsyncOS versions 15.5.5-0141, 16.0.4-302, and 16.5.0-780, and said there are no workarounds besides updating. Administrators should inspect mail logs for suspicious SQL statements, including \u003ccode\u003eCOPY.*TO PROGRAM\u003c/code\u003e, and review external network and firewall logs because attackers with root access may remove or hide evidence.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-76461 to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to patch by September 17, 2026. Separately, Arctic Wolf reported large-scale credential attacks against internet-facing Fortinet VPN appliances in late August 2026, generating tens of millions of authentication failures across multiple U.S. customer environments. In one observed case, a successful Fortinet VPN login from IP address 158.94.211[.]14 was followed by malicious activity in the affected environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco reported active exploitation of CVE-2026-76461, a critical vulnerability in AsyncOS Software for Cisco Secure Email Gateway with a CVSS score of 9.8.","An unauthenticated remote attacker can send a crafted email containing malicious SQL statements to execute commands with root privileges on an affected Secure Email Gateway device.","Cisco released fixes in AsyncOS versions 15.5.5-0141, 16.0.4-302, and 16.5.0-780, with no workaround available other than updating.","Cisco recommends reviewing mail logs for suspicious SQL statements, including entries matching \"COPY.*TO PROGRAM,\" and checking external network and firewall logs because attackers with root access may remove evidence.","CISA added CVE-2026-76461 to its Known Exploited Vulnerabilities catalog and directed Federal Civilian Executive Branch agencies to apply patches by September 17, 2026."],"insights":["The flaw affects both physical and virtual Cisco Secure Email Gateway appliances regardless of configuration, so changing device settings is not presented as a way to reduce exposure.","Cisco’s suggested log search for \"COPY.*TO PROGRAM\" provides a concrete indicator of potentially malicious SQL activity, and each device’s logs must be reviewed separately when the gateway is clustered.","Because successful exploitation gives attackers root-level control, Cisco warns that evidence on the affected device may be removed or concealed; network and firewall records outside the device are therefore important for investigation.","Cisco said it directly contacted Secure Email Cloud customers where it detected malicious activity, indicating that observed exploitation included cloud-hosted devices."],"referencedReports":[{"title":"Cisco Secure Email Gateway SQL Injection Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX","publisher":"Cisco","context":"Cisco's advisory describes CVE-2026-76461, its active exploitation, affected AsyncOS releases, fixes, and detection guidance.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/14/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites CISA's notice adding CVE-2026-76461 to the Known Exploited Vulnerabilities catalog and setting a federal patch deadline.","category":"advisory","primary":false},{"title":"Large-Scale Fortinet VPN Credential Attacks","url":"https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202609-large-scale-fortinet-vpn-cred-attacks","publisher":"Arctic Wolf","context":"The article references Arctic Wolf research on high-volume credential attacks against internet-facing Fortinet VPN appliances in late August 2026.","category":"research","primary":false}],"body":"\u003cp\u003eCisco warned that CVE-2026-76461, a critical flaw in AsyncOS Software for Cisco Secure Email Gateway, is being actively exploited. The vulnerability has a CVSS score of 9.8 and affects physical and virtual Secure Email Gateway devices regardless of configuration. Cisco said Secure Email and Web Manager and Secure Web Appliance are not affected.\u003c/p\u003e\n\n\u003cp\u003eAn unauthenticated attacker can send a crafted email containing malicious SQL statements to an affected device, potentially executing commands with root privileges on its underlying operating system. Cisco released fixes in AsyncOS versions 15.5.5-0141, 16.0.4-302, and 16.5.0-780, and said there are no workarounds besides updating. Administrators should inspect mail logs for suspicious SQL statements, including \u003ccode\u003eCOPY.*TO PROGRAM\u003c/code\u003e, and review external network and firewall logs because attackers with root access may remove or hide evidence.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-76461 to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to patch by September 17, 2026. Separately, Arctic Wolf reported large-scale credential attacks against internet-facing Fortinet VPN appliances in late August 2026, generating tens of millions of authentication failures across multiple U.S. customer environments. In one observed case, a successful Fortinet VPN login from IP address 158.94.211[.]14 was followed by malicious activity in the affected environment.\u003c/p\u003e\n"},{"n":6,"title":"Emerging Threat: (CVE-2026-76461) Cisco Secure Email Gateway Root RCE via Email Parsing","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-76461-cisco-secure-email-gateway-root-rce-via-email-parsing/","time":"09:55","priority":"MUST READ","score":98,"tldr":"Cisco Secure Email Gateway appliances running vulnerable AsyncOS releases can be remotely compromised as root by sending a crafted email, with exploitation reportedly active in the wild. Organizations should immediately upgrade to Cisco’s fixed builds and investigate any previously exposed appliances for compromise.","briefOverview":"\u003cp\u003eCVE-2026-76461 is a critical SQL injection vulnerability in the email parsing logic of Cisco AsyncOS Software for Cisco Secure Email Gateway. An attacker can send a crafted email containing SQL statements that are executed while the appliance processes the message, without credentials, user interaction, or management-interface access. Successful exploitation can result in arbitrary operating-system command execution with root privileges.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects physical and virtual Cisco Secure Email Gateway deployments running releases 15.5 and earlier, 16.0, and 16.5. Cisco reported awareness of exploitation in the wild in September 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog. Cisco released fixed AsyncOS builds, states there are no configuration workarounds, and recommends organizations patch promptly, review mail logs for \u003ccode\u003eCOPY\u003c/code\u003e statements paired with \u003ccode\u003eTO PROGRAM\u003c/code\u003e, and treat exposed unpatched appliances as potentially compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-76461 is a critical SQL injection flaw in Cisco AsyncOS email parsing that allows an attacker to send a crafted email and execute commands with root privileges without authentication or user interaction.","The issue affects Cisco Secure Email Gateway appliances and virtual deployments running AsyncOS 15.5 and earlier, 16.0, or 16.5, while Cisco Secure Email and Web Manager and Cisco Secure Web Appliance are reported as unaffected.","Cisco reported awareness of exploitation in the wild in September 2026, and CISA added the vulnerability to its Known Exploited Vulnerabilities catalog.","Cisco released fixed AsyncOS builds for affected release trains, and the article states that patching is the only remediation because no configuration workaround exists.","Organizations should review IronPort text mail logs for COPY statements paired with TO PROGRAM, check every member of clustered deployments, and monitor unexpected outbound connections from mail appliances."],"insights":["The initial attack path uses normal inbound email traffic, so limiting management-interface access or segmenting interfaces does not prevent exploitation of this flaw.","Because successful exploitation gives root-level control, an appliance that was reachable while unpatched should be treated as potentially compromised even after it is updated.","Exposure estimates based on service fingerprints identify systems that may be running affected software, not confirmed vulnerable versions, so organizations need to verify their exact AsyncOS build numbers.","Clustered email gateway deployments require investigation and patching of every member, since each appliance may be individually reachable and a partial update can leave exposure behind."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-76461 is a critical SQL injection vulnerability in the email parsing logic of Cisco AsyncOS Software for Cisco Secure Email Gateway. An attacker can send a crafted email containing SQL statements that are executed while the appliance processes the message, without credentials, user interaction, or management-interface access. Successful exploitation can result in arbitrary operating-system command execution with root privileges.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability affects physical and virtual Cisco Secure Email Gateway deployments running releases 15.5 and earlier, 16.0, and 16.5. Cisco reported awareness of exploitation in the wild in September 2026, and CISA added the issue to its Known Exploited Vulnerabilities catalog. Cisco released fixed AsyncOS builds, states there are no configuration workarounds, and recommends organizations patch promptly, review mail logs for \u003ccode\u003eCOPY\u003c/code\u003e statements paired with \u003ccode\u003eTO PROGRAM\u003c/code\u003e, and treat exposed unpatched appliances as potentially compromised.\u003c/p\u003e\n"},{"n":1,"title":"Cisco patches Secure Email Gateway zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-cisco-secure-email-zero-day-exploited-to-execute-commands-as-root/","time":"07:31","priority":"MUST READ","score":97,"tldr":"Cisco has patched CVE-2026-76461, a critical zero-day in Secure Email Gateway email parsing that is actively exploited to execute root-level commands remotely. Organizations should apply updates immediately and review mail, network, and firewall logs for signs of malicious SQL statements or suspicious external transfers.","briefOverview":"\u003cp\u003eCisco has patched CVE-2026-76461, a critical zero-day in Cisco AsyncOS Software for Secure Email Gateway that the company says has been actively exploited since September 2026. The flaw affects both physical and virtual Secure Email Gateway appliances regardless of configuration. CISA added the issue to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to patch by September 17.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is caused by insufficient validation in email-parsing logic. An unauthenticated remote attacker can send a crafted email containing malicious SQL statements, execute arbitrary SQL commands, and ultimately run commands with root privileges on the underlying operating system. Cisco provided indicators of compromise and advised administrators to check mail_logs for suspicious SQL statements, while also reviewing network and firewall logs because attackers may remove evidence. Cisco also addressed four other critical Secure Email Gateway and Secure Email and Web Manager flaws, though it said it had no evidence that those additional issues were exploited.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco patched CVE-2026-76461, a critical Cisco Secure Email Gateway zero-day that it says threat actors have actively exploited since at least September 2026.","The flaw affects Cisco AsyncOS Software on physical and virtual Secure Email Gateway appliances regardless of configuration and can let an unauthenticated remote attacker execute commands with root privileges.","Cisco said the issue stems from insufficient validation in email parsing, allowing a crafted email containing malicious SQL statements to trigger arbitrary SQL execution and operating-system command execution.","Cisco provided indicators of compromise and advised administrators to inspect mail_logs for suspicious SQL statements and review network and firewall logs for suspicious transfers to or from external or malicious IP addresses.","CISA added CVE-2026-76461 to its Known Exploited Vulnerabilities Catalog and directed U.S. federal agencies to patch affected systems by September 17."],"insights":["Because the affected appliances are vulnerable regardless of configuration, changing settings alone does not address the risk; Cisco’s patch is required.","Cisco warned that attackers may remove evidence of compromise, making it important to review network and firewall activity in addition to the appliances’ mail logs.","CISA’s three-day patch deadline for U.S. federal agencies reflects that the flaw is already being exploited and can lead to full system-level control.","Cisco also patched four other critical flaws affecting Secure Email Gateway and Secure Email and Web Manager appliances, although it said it had no evidence those additional issues were being exploited."],"referencedReports":[{"title":"Cisco Security Advisory: Cisco Secure Email Gateway Email Parsing Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX","publisher":"cisco","context":"Cisco's security advisory warns that CVE-2026-76461 is actively exploited and provides mitigation and indicator-of-compromise guidance.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/14/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"cisa","context":"The article cites CISA's alert announcing the addition of CVE-2026-76461 to the Known Exploited Vulnerabilities Catalog and the federal patch deadline.","category":"advisory","primary":false},{"title":"Cisco Secure Email Gateway and Secure Email and Web Manager Hardening Advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-esa-dfCrfXkm","publisher":"cisco","context":"Cisco's advisory covers four additional critical vulnerabilities affecting Secure Email Gateway and Secure Email and Web Manager appliances.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco has patched CVE-2026-76461, a critical zero-day in Cisco AsyncOS Software for Secure Email Gateway that the company says has been actively exploited since September 2026. The flaw affects both physical and virtual Secure Email Gateway appliances regardless of configuration. CISA added the issue to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to patch by September 17.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is caused by insufficient validation in email-parsing logic. An unauthenticated remote attacker can send a crafted email containing malicious SQL statements, execute arbitrary SQL commands, and ultimately run commands with root privileges on the underlying operating system. Cisco provided indicators of compromise and advised administrators to check mail_logs for suspicious SQL statements, while also reviewing network and firewall logs because attackers may remove evidence. Cisco also addressed four other critical Secure Email Gateway and Secure Email and Web Manager flaws, though it said it had no evidence that those additional issues were exploited.\u003c/p\u003e\n"},{"n":5,"title":"LiteSpeed Enterprise Flaw Could Let One Hosting Account Gain Root Access on a Shared Server","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/litespeed-enterprise-flaw-could-let-one.html","time":"06:52","priority":"MUST READ","score":92,"tldr":"LiteSpeed Web Server Enterprise versions before 6.3.7 contain a critical flaw that could allow a low-privilege shared-hosting account to gain root access and bypass account isolation controls. Administrators should manually update to version 6.3.7 immediately, as auto-update availability may be delayed.","briefOverview":"\u003cp\u003eA critical flaw in LiteSpeed Web Server Enterprise versions before 6.3.7 could allow a low-privilege user on a shared-hosting server to obtain root-level control, according to a cPanel advisory. An attacker with one hosting account could potentially access or modify other customers’ sites and the server itself. cPanel said the issue can bypass isolation controls including CloudLinux CageFS, which is designed to restrict each account’s view of the server.\u003c/p\u003e\n\n\u003cp\u003eLiteSpeed released version 6.3.7 on September 11, and both LiteSpeed and cPanel advised administrators to install it manually with \u003ccode\u003e/usr/local/lsws/admin/misc/lsup.sh -f -v 6.3.7\u003c/code\u003e. LiteSpeed warned that automatic delivery of the update could be delayed, while its download page still listed version 6.3.6 as stable as of September 15. Neither company publicly described the flaw’s mechanism, assigned a CVE or severity score, stated whether it had been exploited, or offered a workaround or indicators for checking whether systems had already been attacked.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LiteSpeed Web Server Enterprise versions before 6.3.7 contain a critical flaw that could allow a low-privilege shared-hosting account to gain root access on the server.","cPanel warned that the issue can bypass account-separation controls, including CloudLinux CageFS, potentially allowing access to or alteration of other hosted sites and server files.","LiteSpeed released version 6.3.7 on September 11, and cPanel advised administrators to install it using /usr/local/lsws/admin/misc/lsup.sh -f -v 6.3.7.","Neither cPanel nor LiteSpeed publicly described the flaw’s mechanism, assigned it a CVE identifier or severity score, or provided indicators of compromise or a workaround.","LiteSpeed said automatic delivery of version 6.3.7 may be delayed, while its download page still listed version 6.3.6 as the stable release as of September 15."],"insights":["Administrators who force-install version 6.3.7 should restore normal stable-release tracking afterward by running touch /usr/local/lsws/autoupdate/follow_stable, because forcing a specific version stops that update behavior.","The status of LiteSpeed 6.4.0 release candidates is unclear: cPanel did not say whether they are affected, and their changelog does not list the security changes cited for 6.3.7.","This is the third LiteSpeed-related root-access issue on cPanel servers reported since May; the two earlier issues affected the LiteSpeed cPanel plugin and were reported as actively exploited.","Neither vendor provided a workaround for systems that cannot immediately update or signs that administrators can use to determine whether a server was already compromised."],"referencedReports":[{"title":"Security: LiteSpeed Enterprise security advisory - September 14, 2026","url":"https://support.cpanel.net/hc/en-us/articles/43483286674583-Security-LiteSpeed-Enterprise-security-advisory-September-14-2026","publisher":"cpanel","context":"The article relies on this cPanel advisory for its warning that LiteSpeed Web Server Enterprise versions before 6.3.7 could allow a shared-hosting user to gain root access.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical flaw in LiteSpeed Web Server Enterprise versions before 6.3.7 could allow a low-privilege user on a shared-hosting server to obtain root-level control, according to a cPanel advisory. An attacker with one hosting account could potentially access or modify other customers’ sites and the server itself. cPanel said the issue can bypass isolation controls including CloudLinux CageFS, which is designed to restrict each account’s view of the server.\u003c/p\u003e\n\n\u003cp\u003eLiteSpeed released version 6.3.7 on September 11, and both LiteSpeed and cPanel advised administrators to install it manually with \u003ccode\u003e/usr/local/lsws/admin/misc/lsup.sh -f -v 6.3.7\u003c/code\u003e. LiteSpeed warned that automatic delivery of the update could be delayed, while its download page still listed version 6.3.6 as stable as of September 15. Neither company publicly described the flaw’s mechanism, assigned a CVE or severity score, stated whether it had been exploited, or offered a workaround or indicators for checking whether systems had already been attacked.\u003c/p\u003e\n"},{"n":2,"title":"Suspected Black Axe gang leaders face cybercrime charges in the US","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/black-axe-gang-members-extradited-to-us-face-cybercrime-charges/","time":"09:50","priority":"SHOULD READ","score":78,"tldr":"Five alleged Black Axe leaders were extradited from South Africa to the United States to face wire fraud, money laundering, and identity theft charges over a decade-long romance-scam and advance-fee fraud operation.","briefOverview":"\u003cp\u003eFive alleged leaders of the Black Axe cybercrime syndicate were extradited from South Africa to the United States to face wire fraud, money laundering, and aggravated identity theft charges. Prosecutors accuse Perry Osagiede, Franklyn Osagiede, Osariemen Clement, Collins Otughwor, and Musa Mudashiru of coordinating online fraud from Cape Town between 2011 and 2021. They were arrested in South Africa in 2021 at the United States’ request and extradited on September 11, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe alleged operation used aliases, social-media and dating websites, and internet-based phone numbers to contact U.S. victims through romance and advance-fee schemes. Prosecutors say victims were persuaded to send money and, in some cases, threatened with publication of sensitive photos when they refused. If convicted, the defendants face maximum penalties of 20 years for wire fraud, 20 years for money laundering, and an additional two years for aggravated identity theft.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Five alleged leaders of the Black Axe cybercrime syndicate were extradited from South Africa to the United States to face wire fraud and money laundering charges.","Prosecutors allege that the defendants coordinated advance-fee and romance fraud schemes from Cape Town between 2011 and 2021.","The alleged scheme used aliases, social media, dating websites, and internet-based phone numbers to persuade U.S. victims to send money.","The defendants were arrested in South Africa in 2021 at the United States' request and extradited on September 11, 2026.","If convicted, they face up to 20 years for wire fraud, up to 20 years for money laundering, and an additional two years for aggravated identity theft."],"insights":["The alleged fraud did not rely only on false romantic relationships; prosecutors say victims who resisted payment were sometimes pressured with threats to publish sensitive photos online.","The case illustrates cross-border enforcement: the defendants were arrested in South Africa at the United States’ request and later extradited to face charges there.","Black Axe is described as both a violent transnational criminal organization and a group involved in online financial fraud, with an alleged network of money mules and facilitators.","Recent enforcement activity against networks linked to Black Axe spans multiple countries, including Operation Jackal IV, which involved agencies from 22 countries and led to 58 arrests."],"referencedReports":[],"body":"\u003cp\u003eFive alleged leaders of the Black Axe cybercrime syndicate were extradited from South Africa to the United States to face wire fraud, money laundering, and aggravated identity theft charges. Prosecutors accuse Perry Osagiede, Franklyn Osagiede, Osariemen Clement, Collins Otughwor, and Musa Mudashiru of coordinating online fraud from Cape Town between 2011 and 2021. They were arrested in South Africa in 2021 at the United States’ request and extradited on September 11, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe alleged operation used aliases, social-media and dating websites, and internet-based phone numbers to contact U.S. victims through romance and advance-fee schemes. Prosecutors say victims were persuaded to send money and, in some cases, threatened with publication of sensitive photos when they refused. If convicted, the defendants face maximum penalties of 20 years for wire fraud, 20 years for money laundering, and an additional two years for aggravated identity theft.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft confirms KB5002914 Excel update breaks copy and paste","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-september-kb5002914-security-update-breaks-excel-copy-and-paste/","time":"08:40","priority":"SHOULD READ","score":78,"tldr":"Microsoft confirmed that the September 2026 KB5002914 Office security update can silently break copy, paste, autofill, and formula dragging in Excel versions 2016 through 2024. Microsoft is investigating, while affected users report that uninstalling or rolling back the update restores functionality.","briefOverview":"\u003cp\u003eMicrosoft confirmed that the September 2026 KB5002914 Office security update can silently break copy-and-paste functions in Excel. The issue affects Excel 2016, 2019, 2021, and 2024, with user reports also describing failures in autofill and formula dragging. When the problem occurs, the copied source remains selected but the destination cell is not changed, and Excel provides no beep or error message.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says it is researching the issue and will update its support document when more information is available. Users affected by the problem have reported that uninstalling KB5002914 restores copy-and-paste functionality, with separate command-line rollback instructions provided for Office 2016, Office 2019, and Office 2021 or 2024. KB5002914 was released as part of September 2026 Patch Tuesday to address remote code execution and information disclosure vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that the September 2026 KB5002914 security update can cause copy and paste to silently fail in Excel.","The issue affects Microsoft Excel 2016, 2019, 2021, and 2024, and reports also cite problems with autofill and formula dragging.","When the failure occurs, the copied source remains selected while the target location is unchanged, with no beep or error message shown to the user.","Microsoft is investigating the issue and says it will provide more information in its support article when available.","Affected users have reported that uninstalling KB5002914 or rolling back to specified earlier Office versions restores copy-and-paste functionality."],"insights":["The Excel failure is silent: users receive neither an error nor a sound, while the destination remains unchanged, making missed spreadsheet updates harder to notice.","KB5002914 was released to address remote code execution and information disclosure flaws, so affected users must weigh the reported functionality workaround of removing or rolling back the update against losing its security fixes.","Microsoft’s provided rollback paths differ by Office release: Office 2016 uses a patch-removal command, while Office 2019, 2021, and 2024 use Click-to-Run version rollbacks.","The KB5002914 issue follows other recent Microsoft update-related problems affecting Office application launches, Office web-file access, Office installation on Windows 365, and Remote Desktop Services."],"referencedReports":[{"title":"KB5002914","url":"https://support.microsoft.com/en-us/servicing/office/hotfix/excel/5002914","publisher":"microsoft","context":"Microsoft’s updated support document confirms that KB5002914 can cause Excel copy-and-paste operations to fail silently and states that the company is investigating.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that the September 2026 KB5002914 Office security update can silently break copy-and-paste functions in Excel. The issue affects Excel 2016, 2019, 2021, and 2024, with user reports also describing failures in autofill and formula dragging. When the problem occurs, the copied source remains selected but the destination cell is not changed, and Excel provides no beep or error message.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says it is researching the issue and will update its support document when more information is available. Users affected by the problem have reported that uninstalling KB5002914 restores copy-and-paste functionality, with separate command-line rollback instructions provided for Office 2016, Office 2019, and Office 2021 or 2024. KB5002914 was released as part of September 2026 Patch Tuesday to address remote code execution and information disclosure vulnerabilities.\u003c/p\u003e\n"}]</script>
