<script type="application/json" id="dl-articles">[{"n":2,"title":"Unpatched Cacti Zero-Day Enables RCE in Just Four HTTP Requests via Guest Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/unpatched-cacti-zero-day-enables-rce-in.html","time":"05:48","priority":"SHOULD READ","score":86,"tldr":"An unpatched zero-day in Cacti Core 1.2.31 lets unauthenticated guest users achieve remote code execution in four HTTP requests by chaining stored SQL injection with unsafe poller command execution. Until a fix is released, disable guest access, restrict web-interface exposure, and inspect poller configurations for suspicious commands.","briefOverview":"\u003cp\u003eA newly disclosed, unpatched zero-day in Cacti Core 1.2.31 can allow unauthenticated remote code execution when the guest account is enabled. The proof-of-concept, tracked as 4HTTP2SHELL and 4HTTP2ROOT, reportedly reaches command execution as the Cacti server user in four HTTP requests. It does not require a login, valid API key, or phishing.\u003c/p\u003e\n\n\u003cp\u003eThe issue begins when guest access is used to write non-numeric text into the \u003ccode\u003epreview_graphs_per_page\u003c/code\u003e setting, which controls graph pagination in Preview Mode. When the graph preview page is loaded with default filters, the stored value can be used for arbitrary SQL queries, including modification of a Cacti poller-table record. Calling the realtime poller endpoint then causes the modified command string to be passed to PHP\u0026rsquo;s \u003ccode\u003epopen()\u003c/code\u003e without allowlist or sanitization checks. Because Cacti can store credentials and connection details for network devices and servers, a compromised Cacti server could provide wider network access or enable suppression of alerts; users are advised to disable guest access, restrict web-interface access, and review poller entries for unexpected commands.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A proof-of-concept zero-day, tracked as 4HTTP2SHELL and 4HTTP2ROOT, can enable unauthenticated remote code execution in Cacti Core 1.2.31 when the guest account is enabled.","The attack uses guest access to store non-numeric text in the preview_graphs_per_page setting, which is later used to execute arbitrary database queries when the graph preview page is loaded.","The demonstrated attack modifies a Cacti poller-table record and then invokes the realtime poller endpoint, causing the stored command string to be passed to PHP's popen() function without allowlist or sanitization checks.","The researcher identified four contributing failures: guest users can write arbitrary strings to a numeric setting, stored defaults bypass validation, the PDO driver permits stacked statements through a SQL LIMIT clause, and the poller executes database-stored command strings.","Until a fix is available, users are advised to disable the guest account, limit access to the Cacti web interface, and review poller configuration entries for unexpected commands."],"insights":["The flaw turns a seemingly minor graph-display preference into a path for server command execution because the value is stored first and only becomes dangerous later when Cacti loads the graph preview page.","An attacker does not need a Cacti login, valid API key, or phishing step if the default guest surface is enabled, making exposure of the web interface particularly consequential.","Compromise of a Cacti server could extend beyond the monitoring system because it may contain credentials and connection details for network devices and servers.","The same poller-table manipulation that enables command execution could also be used to suppress alerts, potentially reducing visibility into malicious activity."],"referencedReports":[{"title":"4HTTP2SHELL","url":"https://github.com/ekomsSavior/Sad-Girls-0day-Club/tree/main/4http2shell","publisher":"ek0ms savi0r","context":"The article cites the researcher's proof-of-concept material describing an unauthenticated four-request path to command execution in Cacti.","category":"research","primary":true},{"title":"4HTTP2ROOT Cacti Zero-Day FAQ","url":"https://watchtowr.com/intelligence/4http2root-cacti-zero-day-faq/","publisher":"watchTowr","context":"The article cites watchTowr's advisory on the potential for Cacti server compromise to provide access to broader network credentials and systems.","category":"advisory","primary":false}],"body":"\u003cp\u003eA newly disclosed, unpatched zero-day in Cacti Core 1.2.31 can allow unauthenticated remote code execution when the guest account is enabled. The proof-of-concept, tracked as 4HTTP2SHELL and 4HTTP2ROOT, reportedly reaches command execution as the Cacti server user in four HTTP requests. It does not require a login, valid API key, or phishing.\u003c/p\u003e\n\n\u003cp\u003eThe issue begins when guest access is used to write non-numeric text into the \u003ccode\u003epreview_graphs_per_page\u003c/code\u003e setting, which controls graph pagination in Preview Mode. When the graph preview page is loaded with default filters, the stored value can be used for arbitrary SQL queries, including modification of a Cacti poller-table record. Calling the realtime poller endpoint then causes the modified command string to be passed to PHP\u0026rsquo;s \u003ccode\u003epopen()\u003c/code\u003e without allowlist or sanitization checks. Because Cacti can store credentials and connection details for network devices and servers, a compromised Cacti server could provide wider network access or enable suppression of alerts; users are advised to disable guest access, restrict web-interface access, and review poller entries for unexpected commands.\u003c/p\u003e\n"},{"n":1,"title":"Switzerland Confirms AI-Assisted Cyberattacks Breached Critical Infrastructure Operators","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/switzerland-confirms-ai-assisted.html","time":"06:04","priority":"SHOULD READ","score":84,"tldr":"Switzerland confirmed its first AI-agent-assisted intrusions, including successful breaches of critical-infrastructure operators, reflecting a wider European rise in autonomous attacks that exploit familiar weaknesses at far greater speed and scale. Authorities urge rapid patching, reduced internet exposure, strong authentication, and behavior-based monitoring.","briefOverview":"\u003cp\u003eSwitzerland’s National Cyber Security Centre said attackers using AI agents breached systems at four of five Swiss organizations in recently reported cases. Three incidents targeted critical-infrastructure operators, with two successful intrusions, though no major disruptions were reported. The victims, which were not named, also included small and medium-sized companies. The agency described the cases as a shift in the cyber-threat landscape.\u003c/p\u003e\n\n\u003cp\u003eThe agency said agentic offensive frameworks can scan for known unpatched weaknesses, conduct many attempts in parallel, and change methods when defenses react. Italy’s CSIRT Italia similarly reported campaigns in which autonomous AI agents compromised many systems within hours by combining security flaws, configuration errors, and stolen credentials. The UK National Cyber Security Centre said it has seen a marked rise in AI-assisted attacks since September 2026, including incidents causing downtime on internet-facing services and footholds for further activity.\u003c/p\u003e\n\n\u003cp\u003eAuthorities emphasized that the attacks commonly rely on familiar weaknesses, including credentials committed to code repositories, poorly configured infrastructure, missing or default authentication, and API weaknesses. They recommended prioritizing patches for exposed systems, isolating systems that cannot be patched quickly, reducing internet exposure, using MFA or passkeys, and monitoring for unusual behavior, request bursts, error rates, and data volumes. The article also notes that attackers using ARTEX previously breached European Commission human-resources, medical-reimbursement, and translation systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Switzerland’s National Cyber Security Centre said AI agents breached systems in four of five confirmed recent attacks on Swiss organizations.","Three attacks targeted critical-infrastructure operators, and two succeeded without causing major reported disruptions.","Swiss authorities said agentic offensive frameworks can scan for known unpatched weaknesses, run attacks in parallel, and switch methods when defenses respond.","Italy’s CSIRT Italia reported that AI-directed autonomous agents compromised many systems within hours by combining vulnerabilities, configuration errors, and compromised credentials.","Swiss, Italian, and UK authorities recommended rapid patching, limiting internet exposure, strong authentication, and monitoring for unusual activity."],"insights":["The Swiss agency’s initial advisory said every known case involved a successful compromise, while a subsequent interview reported compromises in four of five confirmed cases without explaining the changed count.","The reported AI-agent activity often exploits long-standing problems such as exposed credentials, weak API security, default or missing authentication, and infrastructure configuration errors rather than requiring novel flaws.","Individual agent actions can resemble ordinary user or API activity, so identifying them depends on recognizing patterns such as request bursts, high error rates, unusual data transfers, and the sequence of actions.","The UK agency noted that these automated frameworks are noisy despite being fast and persistent, which can make them easier to detect when organizations correlate their logs.","Switzerland said the number of AI attack tools freely available online has nearly doubled since October, while emphasizing that this figure measures available tools rather than attacks or victims."],"referencedReports":[{"title":"Security advisory on AI agents","url":"https://www.bacs.admin.ch/en/26-ki-agenten-1-en","publisher":"Switzerland's National Cyber Security Centre","context":"The article cites this advisory as the agency's first notice of AI-agent attacks compromising Swiss organizations' IT systems.","category":"advisory","primary":true},{"title":"Impiego di agenti di IA in campagne di compromissione automatizzate (BL01-261123 CSIRT-ITA)","url":"https://csirt.regione.toscana.it/impiego-di-agenti-di-ia-in-campagne-di-compromissione-automatizzate-bl01-261123-csirt-ita/","publisher":"CSIRT Italia","context":"The article cites this official bulletin describing mass compromise campaigns in which AI-directed agents breached many systems within hours.","category":"advisory","primary":false},{"title":"Familiar weaknesses exploited faster: Defending against agentic cyber attacks","url":"https://www.ncsc.gov.uk/blogs/familiar-weaknesses-exploited-faster-defending-against-agentic-cyber-attacks","publisher":"UK National Cyber Security Centre","context":"The article cites this agency guidance on the rise of AI-assisted attacks and recommended detection and defensive measures.","category":"guide","primary":false}],"body":"\u003cp\u003eSwitzerland’s National Cyber Security Centre said attackers using AI agents breached systems at four of five Swiss organizations in recently reported cases. Three incidents targeted critical-infrastructure operators, with two successful intrusions, though no major disruptions were reported. The victims, which were not named, also included small and medium-sized companies. The agency described the cases as a shift in the cyber-threat landscape.\u003c/p\u003e\n\n\u003cp\u003eThe agency said agentic offensive frameworks can scan for known unpatched weaknesses, conduct many attempts in parallel, and change methods when defenses react. Italy’s CSIRT Italia similarly reported campaigns in which autonomous AI agents compromised many systems within hours by combining security flaws, configuration errors, and stolen credentials. The UK National Cyber Security Centre said it has seen a marked rise in AI-assisted attacks since September 2026, including incidents causing downtime on internet-facing services and footholds for further activity.\u003c/p\u003e\n\n\u003cp\u003eAuthorities emphasized that the attacks commonly rely on familiar weaknesses, including credentials committed to code repositories, poorly configured infrastructure, missing or default authentication, and API weaknesses. They recommended prioritizing patches for exposed systems, isolating systems that cannot be patched quickly, reducing internet exposure, using MFA or passkeys, and monitoring for unusual behavior, request bursts, error rates, and data volumes. The article also notes that attackers using ARTEX previously breached European Commission human-resources, medical-reimbursement, and translation systems.\u003c/p\u003e\n"}]</script>
