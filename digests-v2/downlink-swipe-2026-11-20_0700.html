<script type="application/json" id="dl-articles">[{"n":1,"title":"F5 releases emergency patches for critical BIG-IP RCE flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/f5-releases-emergency-patches-for-critical-big-ip-rce-flaws/","time":"10:57","priority":"MUST READ","score":93,"tldr":"F5 released emergency patches for five critical BIG-IP flaws that unauthenticated attackers could exploit for remote code execution, plus a high-severity APM denial-of-service bug. With no mitigations available and thousands of BIG-IP systems exposed online, administrators should apply the out-of-band hotfixes immediately.","briefOverview":"\u003cp\u003eF5 released out-of-band hotfixes for five critical BIG-IP vulnerabilities affecting the Access Policy Manager (APM) and the iRules scripting feature. The flaws, tracked as CVE-2026-121805, CVE-2026-120292, CVE-2026-120285, CVE-2026-116953, and CVE-2026-123637, are stack-based buffer overflows that unauthenticated remote attackers can exploit to execute arbitrary code. F5 also issued engineering hotfixes for CVE-2026-126822, a high-severity BIG-IP APM integer-underflow issue that can be used to cause denial of service. The company said there are no mitigation measures for these issues and advised customers to install the hotfixes.\u003c/p\u003e\n\n\u003cp\u003eShadowserver tracks more than 177,000 internet-exposed BIG-IP instances and over 14,600 IP addresses with BIG-IP APM fingerprints, although the figures may include honeypots and already patched devices. F5 has not said that the newly disclosed vulnerabilities are being exploited, but the article notes that threat groups have previously used F5 flaws to breach networks, map internal servers, take over devices, deploy data-wiping malware, and steal files. CISA has identified seven F5 vulnerabilities as actively exploited since November 2021, including four used by ransomware groups. F5 also patched a separate critical BIG-IP APM flaw, CVE-2026-94127, in September that was being exploited in zero-day remote-code-execution attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 released out-of-band hotfixes for five critical BIG-IP flaws that unauthenticated remote attackers can exploit to execute arbitrary code on vulnerable systems.","The affected flaws involve BIG-IP Access Policy Manager and the BIG-IP iRules feature, and F5 said no mitigation measures are available beyond installing the released hotfixes.","F5 also issued engineering hotfixes for CVE-2026-126822, a high-severity BIG-IP APM issue that unauthenticated attackers can use to cause denial of service.","Shadowserver tracks more than 177,000 internet-exposed BIG-IP instances and over 14,600 IP addresses with BIG-IP APM fingerprints.","F5 has not reported these newly disclosed flaws as exploited, but CISA has listed seven F5 vulnerabilities as actively exploited since November 2021."],"insights":["The absence of any stated workaround means organizations with vulnerable BIG-IP systems must rely on F5’s out-of-band hotfixes rather than compensating controls described in the article.","The reported internet exposure figures do not establish how many systems remain vulnerable, because Shadowserver’s counts may include honeypots and already patched devices.","Although F5 has not identified exploitation of these newly disclosed flaws, the company’s recent history includes a BIG-IP APM remote-code-execution flaw that was actively exploited as a zero-day.","CISA has recorded seven actively exploited F5 vulnerabilities since November 2021, including four that ransomware groups used."],"referencedReports":[{"title":"F5 Security Advisory K000163946: CVE-2026-121805","url":"https://my.f5.com/manage/s/article/K000163946","publisher":"f5","context":"The article cites this F5 advisory for one of the critical BIG-IP flaws that can allow unauthenticated remote code execution.","category":"advisory","primary":true},{"title":"F5 Security Advisory K000163940: CVE-2026-120292","url":"https://my.f5.com/manage/s/article/K000163940","publisher":"f5","context":"The article cites this F5 advisory for one of the critical BIG-IP flaws affecting BIG-IP APM or iRules.","category":"advisory","primary":true},{"title":"F5 Security Advisory K000163939: CVE-2026-120285","url":"https://my.f5.com/manage/s/article/K000163939","publisher":"f5","context":"The article cites this F5 advisory for one of the critical BIG-IP flaws that unauthenticated attackers can exploit for remote code execution.","category":"advisory","primary":true},{"title":"F5 Security Advisory K000163941: CVE-2026-116953","url":"https://my.f5.com/manage/s/article/K000163941","publisher":"f5","context":"The article cites this F5 advisory for one of the critical BIG-IP security issues addressed by the emergency hotfixes.","category":"advisory","primary":true},{"title":"F5 Security Advisory K000163937: CVE-2026-123637","url":"https://my.f5.com/manage/s/article/K000163937","publisher":"f5","context":"The article cites this F5 advisory for one of the critical BIG-IP flaws covered by the out-of-band patches.","category":"advisory","primary":true},{"title":"F5 Security Advisory K000163942: CVE-2026-126822","url":"https://my.f5.com/manage/s/article/K000163942","publisher":"f5","context":"The article cites this F5 advisory for a high-severity BIG-IP APM issue that can be used to cause denial of service.","category":"advisory","primary":true}],"body":"\u003cp\u003eF5 released out-of-band hotfixes for five critical BIG-IP vulnerabilities affecting the Access Policy Manager (APM) and the iRules scripting feature. The flaws, tracked as CVE-2026-121805, CVE-2026-120292, CVE-2026-120285, CVE-2026-116953, and CVE-2026-123637, are stack-based buffer overflows that unauthenticated remote attackers can exploit to execute arbitrary code. F5 also issued engineering hotfixes for CVE-2026-126822, a high-severity BIG-IP APM integer-underflow issue that can be used to cause denial of service. The company said there are no mitigation measures for these issues and advised customers to install the hotfixes.\u003c/p\u003e\n\n\u003cp\u003eShadowserver tracks more than 177,000 internet-exposed BIG-IP instances and over 14,600 IP addresses with BIG-IP APM fingerprints, although the figures may include honeypots and already patched devices. F5 has not said that the newly disclosed vulnerabilities are being exploited, but the article notes that threat groups have previously used F5 flaws to breach networks, map internal servers, take over devices, deploy data-wiping malware, and steal files. CISA has identified seven F5 vulnerabilities as actively exploited since November 2021, including four used by ransomware groups. F5 also patched a separate critical BIG-IP APM flaw, CVE-2026-94127, in September that was being exploited in zero-day remote-code-execution attacks.\u003c/p\u003e\n"},{"n":3,"title":"ROMULUS ClickFix Attacks Deliver RAT That Can Spy on Users and Control PCs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/romulus-clickfix-attacks-deliver-rat.html","time":"07:11","priority":"SHOULD READ","score":84,"tldr":"ROMULUS is using ClickFix lures and DLL sideloading to deliver CNCMachineRMS, a newly documented RAT that can remotely control infected PCs, capture screens, microphones and cameras, and steal files. The campaign reflects the growing sophistication and breadth of ClickFix operations, which increasingly use fake verification prompts to trick users into running malicious commands.","briefOverview":"\u003cp\u003eBlackpoint Cyber reported that the ROMULUS malware delivery platform is using ClickFix-style lures to distribute a previously undocumented remote-access trojan called CNCMachineRMS, as well as Legion Loader through separate infection chains. ROMULUS retains ClickFix techniques and signed-binary DLL sideloading while changing the applications and loaders used to deliver its payloads. The same CNCMachineRMS implant was also previously delivered through malicious ChatGPT Custom GPT lures.\u003c/p\u003e\n\n\u003cp\u003eOne ROMULUS chain uses a malicious MSI installer named \u003ccode\u003eIconEdit2Turb.msi\u003c/code\u003e, executed with \u003ccode\u003emsiexec.exe\u003c/code\u003e through PowerShell and disguised as Stardock Smart DeElevation Tool. The installer launches a DLL sideloading chain involving a malicious DLL, \u003ccode\u003eI++u.dll\u003c/code\u003e, which decodes embedded shellcode to run CNCMachineRMS. The RAT can remotely control desktops, stream screens, capture microphone and camera data, manage files, perform system reconnaissance, and run additional payloads, communicating with attacker-controlled infrastructure using DNS over HTTPS. The report comes amid numerous ClickFix campaigns using fake verification prompts, compromised websites, deceptive ads, and impersonated pages to deliver remote-access tools and information-stealing malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Blackpoint Cyber reported that the ROMULUS malware delivery platform uses ClickFix-style lures to distribute CNCMachineRMS and Legion Loader through separate infection chains.","One ROMULUS chain uses a malicious MSI installer masquerading as Stardock Smart DeElevation Tool to launch a DLL sideloading sequence that executes CNCMachineRMS.","CNCMachineRMS can provide remote desktop control, screen streaming, microphone and camera capture, file management, system reconnaissance, and on-demand execution of additional payloads.","CNCMachineRMS communicates with attacker-controlled infrastructure using DNS over HTTPS.","The article describes multiple other ClickFix campaigns that use fake verification prompts, deceptive ads, compromised websites, and impersonated pages to deliver remote-access tools and information-stealing malware."],"insights":["ROMULUS appears to function as a delivery service rather than being tied to one payload, using separate chains to distribute both CNCMachineRMS and Legion Loader while retaining ClickFix and signed-binary sideloading techniques.","The same CNCMachineRMS implant has been delivered through both ROMULUS activity and malicious ChatGPT Custom GPT lures, linking otherwise different victim-entry paths to a common final payload.","ClickFix campaigns have expanded beyond simple command execution into multi-stage operations that can establish persistence, support movement within environments, conduct reconnaissance, and steal credentials.","Some campaigns combine deceptive verification prompts with unusual delivery methods, including code retrieved through a Polygon smart contract, payloads retrieved through DNS TXT records, and malware reconstructed from data hidden in PNG files.","The article notes that changing the applications and loaders used for delivery can obscure campaign tracking, while the underlying malware architecture can provide a more consistent way to identify related activity."],"referencedReports":[{"title":"ROMULUS and CNCMachineRMS","url":"https://blackpointcyber.com/blog/romulus-cncmachinerms/","publisher":"blackpoint-cyber","context":"Blackpoint Cyber's report is the primary basis for the article's findings on ROMULUS delivering CNCMachineRMS through ClickFix and DLL sideloading.","category":"research","primary":true},{"title":"The Evolving Tradecraft of ClickFix","url":"https://www.huntress.com/blog/the-evolving-tradecraft-of-clickfix","publisher":"huntress","context":"The article cites Huntress' report on ClickFix expanding into more elaborate multi-stage chains involving persistence, lateral movement, reconnaissance, credential theft, and steganography.","category":"research","primary":false}],"body":"\u003cp\u003eBlackpoint Cyber reported that the ROMULUS malware delivery platform is using ClickFix-style lures to distribute a previously undocumented remote-access trojan called CNCMachineRMS, as well as Legion Loader through separate infection chains. ROMULUS retains ClickFix techniques and signed-binary DLL sideloading while changing the applications and loaders used to deliver its payloads. The same CNCMachineRMS implant was also previously delivered through malicious ChatGPT Custom GPT lures.\u003c/p\u003e\n\n\u003cp\u003eOne ROMULUS chain uses a malicious MSI installer named \u003ccode\u003eIconEdit2Turb.msi\u003c/code\u003e, executed with \u003ccode\u003emsiexec.exe\u003c/code\u003e through PowerShell and disguised as Stardock Smart DeElevation Tool. The installer launches a DLL sideloading chain involving a malicious DLL, \u003ccode\u003eI++u.dll\u003c/code\u003e, which decodes embedded shellcode to run CNCMachineRMS. The RAT can remotely control desktops, stream screens, capture microphone and camera data, manage files, perform system reconnaissance, and run additional payloads, communicating with attacker-controlled infrastructure using DNS over HTTPS. The report comes amid numerous ClickFix campaigns using fake verification prompts, compromised websites, deceptive ads, and impersonated pages to deliver remote-access tools and information-stealing malware.\u003c/p\u003e\n"},{"n":2,"title":"Windows 11 KB5132057 update released with 28 changes and fixes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5132057-update-released-with-28-changes-and-fixes/","time":"09:25","priority":"MAY READ","score":64,"tldr":"Microsoft released the optional Windows 11 KB5132057 preview update for versions 25H2 and 26H2, adding 28 non-security improvements including a redesigned Windows Search, improved Windows Hello facial recognition in dark rooms, and a new Run dialog. As a preview update, it is intended for testing before broader rollout in the next Patch Tuesday release.","briefOverview":"\u003cp\u003eMicrosoft released the optional KB5132057 cumulative preview update for Windows 11 versions 25H2 and 26H2. The non-security update contains 28 changes and fixes, allowing IT administrators to test improvements before they are expected to reach general availability in the next Patch Tuesday release. It updates the two versions to builds 26200.10075 and 26300.10075, respectively.\u003c/p\u003e\n\n\u003cp\u003eKey additions include a WinUI 3-based Windows Search experience with promotional web content removed, faster indexer-based “Search from This PC” searches in File Explorer, and inline Windows Search actions for settings and Phone Link tasks. Windows Hello facial recognition can work in dark rooms when users enable automatic screen-brightness adjustment, and a redesigned Run dialog can be enabled in Settings. The update also fixes a File History restore issue, adds passwordless web sign-in support for Microsoft Entra hybrid-joined devices, and may cause a limited number of devices to restart once more during installation because of a Secure Boot certificate update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the optional KB5132057 cumulative preview update for Windows 11 versions 25H2 and 26H2, with 28 changes and fixes but no security updates.","The update introduces a WinUI 3-based Windows Search experience that removes promotional content from web results and adds direct actions such as changing dark mode, Bluetooth, brightness, and volume settings.","KB5132057 improves Windows Hello facial recognition in dark rooms when users enable automatic screen-brightness adjustment during face recognition.","The update adds a redesigned Run dialog that users can enable under Settings \u003e System \u003e Advanced, and it fixes a File History issue that could prevent the restore interface from finding backups.","Microsoft said a limited number of consumer and business devices may experience one extra restart during installation as part of a Secure Boot certificate update process."],"insights":["IT administrators can use KB5132057 to test upcoming Windows changes before they are included in the next month’s Patch Tuesday release, but the update does not provide security fixes.","Microsoft Entra hybrid-joined devices can now use passwordless web sign-in at the lock screen with FIDO2 security keys, phone passkeys, or Temporary Access Passes while retaining access to on-premises resources through a Kerberos ticket.","Users who do not enable Windows Update’s option to receive the latest updates early must manually select “Download and install” to receive this optional preview update.","A limited number of devices may restart an additional time during installation because a Secure Boot certificate update is being applied."],"referencedReports":[{"title":"Windows Message Center","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#5084","publisher":"microsoft","context":"The article cites a Microsoft message center update warning that some devices may undergo one additional restart during installation due to a Secure Boot certificate update.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft released the optional KB5132057 cumulative preview update for Windows 11 versions 25H2 and 26H2. The non-security update contains 28 changes and fixes, allowing IT administrators to test improvements before they are expected to reach general availability in the next Patch Tuesday release. It updates the two versions to builds 26200.10075 and 26300.10075, respectively.\u003c/p\u003e\n\n\u003cp\u003eKey additions include a WinUI 3-based Windows Search experience with promotional web content removed, faster indexer-based “Search from This PC” searches in File Explorer, and inline Windows Search actions for settings and Phone Link tasks. Windows Hello facial recognition can work in dark rooms when users enable automatic screen-brightness adjustment, and a redesigned Run dialog can be enabled in Settings. The update also fixes a File History restore issue, adds passwordless web sign-in support for Microsoft Entra hybrid-joined devices, and may cause a limited number of devices to restart once more during installation because of a Secure Boot certificate update.\u003c/p\u003e\n"},{"n":4,"title":"Health-ISAC Daily Cyber Headlines – November 20, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-20-2026/","time":"10:11","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 20 briefing highlights several urgent health-sector risks, led by a critical VMware vCenter authentication-bypass flaw and the reported theft of data belonging to 1.6 million SBC Medical Group customers. It also flags shadow AI, Windows physical-access bypasses, UPS software abuse, and network-segmentation gaps involving consumer devices.","briefOverview":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 20, 2026, summarizes several cybersecurity developments relevant to the health sector. The briefing highlights an urgent VMware vCenter flaw that reportedly allows threat actors with network access to bypass authentication. It also includes reporting that threat actors stole data from 1.6 million SBC Medical Group customers.\u003c/p\u003e\n\n\u003cp\u003eOther topics include health organizations’ difficulty monitoring AI tools amid shadow AI incidents, an unpatched Windows issue called FastUnlock, and alleged abuse of CyberPower UPS management software to run malicious scripts on a domain controller. The roundup also covers consumer devices slipping past operational-technology network segmentation at hospitals and industrial organizations. In addition, it links to a Quad leaders’ announcement on enhanced cybersecurity cooperation in the Indo-Pacific.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 20, 2026 daily briefing covers an urgent VMware vCenter authentication-bypass issue.","The briefing includes reporting that threat actors stole data belonging to 1.6 million SBC Medical Group customers.","It highlights concerns about health-sector organizations struggling to monitor AI tools amid shadow AI incidents.","The roundup includes an unpatched Windows issue, called FastUnlock, that lets threat actors run programs on locked PCs.","It also covers alleged abuse of CyberPower UPS management software to run malicious scripts on a domain controller and consumer devices bypassing OT network segmentation."],"insights":["The briefing spans both data theft and risks to systems that support real-world operations, including hospital and industrial network segmentation and UPS management software.","Several highlighted issues involve trusted or routine technologies—VMware vCenter, Windows, AI tools, UPS management software, and consumer devices—rather than a single specialized security product.","The VMware vCenter issue is described as particularly urgent because threat actors with network access can bypass authentication.","The roundup pairs technical risks with a policy-level development: enhanced cybersecurity cooperation among Quad leaders in the Indo-Pacific."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s Daily Cyber Headlines for November 20, 2026, summarizes several cybersecurity developments relevant to the health sector. The briefing highlights an urgent VMware vCenter flaw that reportedly allows threat actors with network access to bypass authentication. It also includes reporting that threat actors stole data from 1.6 million SBC Medical Group customers.\u003c/p\u003e\n\n\u003cp\u003eOther topics include health organizations’ difficulty monitoring AI tools amid shadow AI incidents, an unpatched Windows issue called FastUnlock, and alleged abuse of CyberPower UPS management software to run malicious scripts on a domain controller. The roundup also covers consumer devices slipping past operational-technology network segmentation at hospitals and industrial organizations. In addition, it links to a Quad leaders’ announcement on enhanced cybersecurity cooperation in the Indo-Pacific.\u003c/p\u003e\n"}]</script>
