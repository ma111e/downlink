<script type="application/json" id="dl-articles">[{"n":2,"title":"SonicWall SMA1000 flaws exploited as zero-days to push custom malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sonicwall-sma1000-flaws-exploited-as-zero-days-to-push-custom-malware/","time":"22:23","priority":"MUST READ","score":95,"tldr":"SonicWall SMA1000 vulnerabilities CVE-2026-15409 and CVE-2026-15410 were exploited as zero-days for weeks to gain root access and deploy custom malware on VPN appliances. Customers should urgently apply SonicWall’s patches to versions 12.4.3-03453 or 12.5.0-02835.","briefOverview":"\u003cp\u003eTwo recently disclosed SonicWall SMA1000 vulnerabilities were exploited as zero-days for weeks, allowing threat actors to install custom malware on vulnerable VPN appliances. The flaws are CVE-2026-15409, a critical server-side request forgery vulnerability, and CVE-2026-15410, a high-severity command injection flaw. They affect SMA1000 6210, 7210, and 8200v appliances, and SonicWall released patches in versions 12.4.3-03453 and 12.5.0-02835.\u003c/p\u003e\n\n\u003cp\u003eVolexity, which assisted SonicWall in investigating the attacks, said a previously unknown threat actor it tracks as UTA0533 began exploiting the vulnerabilities as early as June 22. In two compromised appliances, Volexity found the attackers abused the SMA1000 /wsproxy endpoint to establish unauthenticated WebSocket tunnels to services that should only have been accessible from the appliance itself. The attackers then obtained the appliance product_uuid from CouchDB and exploited the sysCtrl.execRemoveHotfix RPC method to execute commands as root.\u003c/p\u003e\n\n\u003cp\u003eWith root access, UTA0533 installed a custom malware dropper called KNUCKLEBALL under the file name deploy_new.py. KNUCKLEBALL deployed two Java-based malware families, Sou5 and ORANGETAIL, designed for SonicWall SMA1000 appliances. Volexity said Sou5 acts as a reverse proxy, while ORANGETAIL is a custom Java webshell, and the attackers also modified nginx configuration to expose ORANGETAIL remotely and installed a privilege-escalation tool called ROOTRUN.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Two recently disclosed SonicWall SMA1000 vulnerabilities, CVE-2026-15409 and CVE-2026-15410, were exploited as zero-days for weeks to install custom malware on vulnerable VPN appliances.","The flaws affect SonicWall SMA1000 6210, 7210, and 8200v appliances, and SonicWall released patches in versions 12.4.3-03453 and 12.5.0-02835.","Volexity found that threat actor UTA0533 abused the SMA1000 /wsproxy endpoint to create unauthenticated WebSocket tunnels to internal services, including CouchDB and the appliance management service.","After obtaining the appliance product_uuid, the attackers exploited the sysCtrl.execRemoveHotfix RPC method to execute commands as root and take full control of the appliance.","UTA0533 installed KNUCKLEBALL to deploy the Java-based malware families Sou5 and ORANGETAIL, and also modified nginx configuration to expose the ORANGETAIL webshell remotely."],"insights":["The initial compromise path abused the SMA1000 /wsproxy endpoint to reach services that should only have been accessible from the appliance itself, making internal-only services such as CouchDB and the management service part of the attack surface.","The attackers needed the appliance product_uuid from CouchDB before exploiting the second flaw, showing that incident responders should review CouchDB access and queries when investigating these compromises.","The malware was built specifically for SonicWall SMA1000 appliances, including Java-based components named Sou5 and ORANGETAIL, indicating the campaign was tailored rather than using only generic post-compromise tools.","Volexity observed the earliest compromise on June 22, weeks before SonicWall publicly disclosed the flaws, so organizations should investigate activity predating the patch announcement rather than only checking events after disclosure.","Although the campaign and malware showed significant technical sophistication, Volexity said the threat actor was less successful at spreading into victims’ internal networks."],"referencedReports":[{"title":"Proxying to Compromise: SonicWall Secure Mobile Access 0-Day Exploitation","url":"http://www.volexity.com/blog/2026/07/17/proxying-to-compromise-sonicwall-secure-mobile-access-0-day-exploitation/","publisher":"Volexity","context":"The article cites Volexity's report as the source detailing the full exploitation chain and custom malware used against SonicWall SMA1000 appliances.","category":"research","primary":true}],"body":"\u003cp\u003eTwo recently disclosed SonicWall SMA1000 vulnerabilities were exploited as zero-days for weeks, allowing threat actors to install custom malware on vulnerable VPN appliances. The flaws are CVE-2026-15409, a critical server-side request forgery vulnerability, and CVE-2026-15410, a high-severity command injection flaw. They affect SMA1000 6210, 7210, and 8200v appliances, and SonicWall released patches in versions 12.4.3-03453 and 12.5.0-02835.\u003c/p\u003e\n\n\u003cp\u003eVolexity, which assisted SonicWall in investigating the attacks, said a previously unknown threat actor it tracks as UTA0533 began exploiting the vulnerabilities as early as June 22. In two compromised appliances, Volexity found the attackers abused the SMA1000 /wsproxy endpoint to establish unauthenticated WebSocket tunnels to services that should only have been accessible from the appliance itself. The attackers then obtained the appliance product_uuid from CouchDB and exploited the sysCtrl.execRemoveHotfix RPC method to execute commands as root.\u003c/p\u003e\n\n\u003cp\u003eWith root access, UTA0533 installed a custom malware dropper called KNUCKLEBALL under the file name deploy_new.py. KNUCKLEBALL deployed two Java-based malware families, Sou5 and ORANGETAIL, designed for SonicWall SMA1000 appliances. Volexity said Sou5 acts as a reverse proxy, while ORANGETAIL is a custom Java webshell, and the attackers also modified nginx configuration to expose ORANGETAIL remotely and installed a privilege-escalation tool called ROOTRUN.\u003c/p\u003e\n"},{"n":3,"title":"Estée Lauder discloses data breach via Oracle E-Business flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/est-e-lauder-discloses-data-breach-via-oracle-e-business-flaw/","time":"22:39","priority":"MUST READ","score":92,"tldr":"Estée Lauder is notifying affected individuals after attackers exploited an Oracle E-Business Suite HR system flaw to steal sensitive personal, financial, health, and employment data. The incident appears tied to the Clop mass-exploitation campaign using CVE-2025-61882.","briefOverview":"\u003cp\u003eEstée Lauder is notifying customers of a data breach after hackers exploited a flaw in Oracle E-Business Suite, which the company used for human resources operations. The company said it became aware of a cybersecurity issue involving the Oracle E-Business Suite system and determined on June 19, 2026, that an unauthorized third party had accessed it on or around August 9, 2025. The attackers obtained personal information of certain individuals.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data includes full names, postal addresses, email addresses, dates of birth, Social Security numbers, passport numbers, financial account information, health information, and employment information such as payroll and performance reports. Estée Lauder is advising recipients of the notification letter to remain vigilant for signs of identity theft and fraud. The company is also offering 24 months of complimentary identity monitoring services through Kroll.\u003c/p\u003e\n\n\u003cp\u003eAlthough Estée Lauder did not disclose the specific vulnerability exploited, the breach date correlates with a mass-exploitation campaign targeting Oracle E-Business Suite through CVE-2025-61882. The flaw affected EBS versions 12.2.3 through 12.2.14 and enabled attackers to bypass authentication and remotely execute code through the BI Publisher Integration component. Oracle released fixes for CVE-2025-61882 on October 4, 2025, and CrowdStrike later confirmed that Clop had been exploiting the flaw since early August 2025.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Estée Lauder is notifying customers of a data breach after hackers exploited a flaw in Oracle E-Business Suite used by the company for human resources operations.","The company determined on June 19, 2026, that an unauthorized third party had accessed the Oracle E-Business Suite system on or around August 9, 2025, and obtained personal information of certain individuals.","The exposed data includes full names, postal addresses, email addresses, dates of birth, Social Security numbers, passport numbers, financial account information, health information, and employment information such as payroll and performance reports.","The breach date correlates with a mass-exploitation campaign targeting Oracle E-Business Suite through CVE-2025-61882, which Google and Mandiant linked to the Clop ransomware gang in October 2025.","Estée Lauder is advising recipients to watch for signs of identity theft and fraud and is offering 24 months of complimentary identity monitoring services through Kroll."],"insights":["Estée Lauder identified the intrusion in 2026 even though the unauthorized access occurred around August 9, 2025, showing a long gap between compromise and confirmed determination.","The affected Oracle E-Business Suite system was used for HR management, which explains why the exposed information spans identity, financial, health, payroll, and performance records rather than only customer contact details.","Oracle released fixes for CVE-2025-61882 on October 4, 2025, after the article says Clop had already been exploiting the flaw since early August 2025.","Estée Lauder had previously been compromised by Clop in 2023 through a different zero-day in MOVEit Transfer, making this at least the second Clop-linked incident involving the company mentioned in the article."],"referencedReports":[],"body":"\u003cp\u003eEstée Lauder is notifying customers of a data breach after hackers exploited a flaw in Oracle E-Business Suite, which the company used for human resources operations. The company said it became aware of a cybersecurity issue involving the Oracle E-Business Suite system and determined on June 19, 2026, that an unauthorized third party had accessed it on or around August 9, 2025. The attackers obtained personal information of certain individuals.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data includes full names, postal addresses, email addresses, dates of birth, Social Security numbers, passport numbers, financial account information, health information, and employment information such as payroll and performance reports. Estée Lauder is advising recipients of the notification letter to remain vigilant for signs of identity theft and fraud. The company is also offering 24 months of complimentary identity monitoring services through Kroll.\u003c/p\u003e\n\n\u003cp\u003eAlthough Estée Lauder did not disclose the specific vulnerability exploited, the breach date correlates with a mass-exploitation campaign targeting Oracle E-Business Suite through CVE-2025-61882. The flaw affected EBS versions 12.2.3 through 12.2.14 and enabled attackers to bypass authentication and remotely execute code through the BI Publisher Integration component. Oracle released fixes for CVE-2025-61882 on October 4, 2025, and CrowdStrike later confirmed that Clop had been exploiting the flaw since early August 2025.\u003c/p\u003e\n"},{"n":1,"title":"Hackers steal $23.7 million in crypto from Ostium in off-chain attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-steal-237-million-in-crypto-from-ostium-in-off-chain-attack/","time":"22:22","priority":"SHOULD READ","score":82,"tldr":"Ostium says hackers stole $23.75 million from its liquidity provider vault by compromising off-chain price-feed infrastructure and submitting fake price reports to generate artificial trading profits. Trader collateral and existing positions were not stolen, but trading remains paused while Ostium secures systems and investigates.","briefOverview":"\u003cp\u003eOstium said an attacker stole $23.75 million from its liquidity provider vault after compromising off-chain infrastructure used to feed prices into the protocol. The attacker submitted illegitimate price reports disguised as valid ones, then rapidly opened and closed large positions to generate artificial profits. Ostium first notified its community on July 16 and paused trading due to the security incident.\u003c/p\u003e\n\n\u003cp\u003eThe company said trader collateral was held in a separate contract and was not affected. Existing long and short positions were not closed or liquidated, but they are effectively frozen because all trading was paused within 60 minutes of the first exploit transaction. Ostium said it is working to secure the affected infrastructure and determine a path forward for liquidity providers.\u003c/p\u003e\n\n\u003cp\u003eAccording to PeckShieldAlert, the exploiter swapped the stolen USDC for 12,080 Ethereum and deposited 10,540 Ethereum to TornadoCash. Five days after the incident, trading on Ostium was still paused, and the company said it would provide at least 24 hours\u0026rsquo; notice before operations resume. Ostium also said positions will be marked to the reopening price and that it plans to publish a post-mortem with technical details in the coming days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ostium said an attacker stole $23.75 million from its liquidity provider vault after compromising off-chain infrastructure used to feed prices into the protocol.","The attacker submitted illegitimate price reports disguised as valid ones and rapidly opened and closed large positions to generate artificial profits.","Ostium said trader collateral was held in a separate contract, was not stolen, and existing long and short positions were not closed or liquidated.","According to PeckShieldAlert, the exploiter swapped the stolen USDC for 12,080 Ethereum and deposited 10,540 Ethereum to TornadoCash.","Trading on Ostium was paused within 60 minutes of the first exploit transaction and remained paused five days after the incident."],"insights":["The incident shows that a decentralized trading platform can lose funds through compromised off-chain price infrastructure even when the affected funds are held in on-chain contracts.","Ostium’s separation of trader collateral from the liquidity provider vault limited the stated impact, leaving ordinary traders’ collateral unstolen while liquidity providers faced the loss.","Pausing trading within 60 minutes did not prevent the attacker from extracting $23.75 million, indicating the exploit unfolded quickly once false price reports were accepted.","Ostium plans to mark frozen positions to the reopening price when trading resumes, so the pause affects not only stolen funds but also how existing open positions will be handled."],"referencedReports":[],"body":"\u003cp\u003eOstium said an attacker stole $23.75 million from its liquidity provider vault after compromising off-chain infrastructure used to feed prices into the protocol. The attacker submitted illegitimate price reports disguised as valid ones, then rapidly opened and closed large positions to generate artificial profits. Ostium first notified its community on July 16 and paused trading due to the security incident.\u003c/p\u003e\n\n\u003cp\u003eThe company said trader collateral was held in a separate contract and was not affected. Existing long and short positions were not closed or liquidated, but they are effectively frozen because all trading was paused within 60 minutes of the first exploit transaction. Ostium said it is working to secure the affected infrastructure and determine a path forward for liquidity providers.\u003c/p\u003e\n\n\u003cp\u003eAccording to PeckShieldAlert, the exploiter swapped the stolen USDC for 12,080 Ethereum and deposited 10,540 Ethereum to TornadoCash. Five days after the incident, trading on Ostium was still paused, and the company said it would provide at least 24 hours\u0026rsquo; notice before operations resume. Ostium also said positions will be marked to the reopening price and that it plans to publish a post-mortem with technical details in the coming days.\u003c/p\u003e\n"}]</script>
