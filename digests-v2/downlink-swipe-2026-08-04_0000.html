<script type="application/json" id="dl-articles">[{"n":24,"title":"Keyv and friends compromised in active Shai-Hulud supply chain attack","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/keyv-and-friends-compromised-in-npm-supply-chain-attack","time":"10:37","priority":"MUST READ","score":98,"tldr":"Attackers compromised the maintainer of keyv and related npm packages, publishing malicious versions with a preinstall worm that steals developer, cloud, GitHub, npm, Kubernetes, Vault, Stripe, and Slack secrets. The campaign has rapidly spread across hundreds of packages with billions of monthly installs, making any installation of affected versions an urgent incident-response priority.","briefOverview":"\u003cp\u003eOn August 4, 2026, attackers compromised the GitHub account of the maintainer behind \u003ccode\u003ekeyv\u003c/code\u003e and used that access to inject a credential-stealing worm across the package family. The affected packages include \u003ccode\u003ekeyv\u003c/code\u003e, \u003ccode\u003ecacheable\u003c/code\u003e, \u003ccode\u003eflat-cache\u003c/code\u003e, \u003ccode\u003efile-entry-cache\u003c/code\u003e, \u003ccode\u003ecacheable-request\u003c/code\u003e, \u003ccode\u003ecache-manager\u003c/code\u003e, and several related utilities. The article says the poisoned versions were published to npm with valid provenance signed by GitHub Actions because malicious files were pushed directly to the \u003ccode\u003emain\u003c/code\u003e branch and new releases were cut immediately.\u003c/p\u003e\n\n\u003cp\u003eThe attack added \u003ccode\u003esetup.mjs\u003c/code\u003e and \u003ccode\u003eMath_Symbol.js\u003c/code\u003e to each package, along with a \u003ccode\u003epreinstall\u003c/code\u003e command in \u003ccode\u003epackage.json\u003c/code\u003e so the code would run automatically during installation. \u003ccode\u003esetup.mjs\u003c/code\u003e downloaded the Bun JavaScript runtime and used it to execute the real payload, \u003ccode\u003eMath_Symbol.js\u003c/code\u003e, a heavily obfuscated 728 KB JavaScript file. The payload harvested secrets, encrypted the findings, and exfiltrated them to a public GitHub repository whose description read “Shai-Hulud: Here We Go Again.”\u003c/p\u003e\n\n\u003cp\u003eThe malware targeted npm tokens, GitHub tokens, AWS credentials, Kubernetes secrets, HashiCorp Vault tokens, Stripe and Slack tokens, and many files likely to contain credentials. It also included worm-like propagation functionality to infect packages belonging to other maintainers who installed one of the compromised packages. By the August 4, 2026 13:37 CEST update, at least 868 packages across 1,381 versions had been compromised, with a combined total of more than 2 billion monthly installs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On August 4, 2026, attackers compromised the GitHub account of the maintainer behind keyv and used it to inject a credential-stealing worm across the package family.","The compromised packages included keyv 6.0.0, flat-cache 6.1.24, file-entry-cache 11.1.6, cacheable-request 13.0.20, cacheable 2.5.1, @cacheable/memory 2.2.1, cache-manager 7.2.10, and several others.","The attackers added setup.mjs and Math_Symbol.js to each package and added a preinstall command so setup.mjs would run automatically during npm install.","The Math_Symbol.js payload harvested secrets including npm tokens, GitHub tokens, AWS credentials, Kubernetes secrets, HashiCorp Vault tokens, Stripe keys, Slack tokens, and secrets found in scanned files.","By the August 4, 2026 13:37 CEST update, at least 868 packages across 1,381 versions had been compromised, totaling more than 2 billion monthly installs."],"insights":["The poisoned npm releases had valid GitHub Actions provenance because the attackers pushed directly to the main branch and immediately cut new releases, so provenance alone would not have proved the packages were safe.","The dropper downloaded the Bun runtime and used it to run the real payload, meaning the malicious code did not rely only on the victim already having the expected JavaScript tooling installed.","The payload specifically targeted GitHub Actions runners by reading runner process memory and stealing OIDC tokens used for npm publishing, making build systems a central target rather than only developer laptops.","The worm validated stolen npm tokens against the npm whoami endpoint before exfiltration, showing that it filtered for usable credentials during the theft process.","The malware attempted to turn one exposed environment into many more by using stolen Kubernetes, AWS, and Vault access to enumerate and retrieve additional stored secrets."],"referencedReports":[],"body":"\u003cp\u003eOn August 4, 2026, attackers compromised the GitHub account of the maintainer behind \u003ccode\u003ekeyv\u003c/code\u003e and used that access to inject a credential-stealing worm across the package family. The affected packages include \u003ccode\u003ekeyv\u003c/code\u003e, \u003ccode\u003ecacheable\u003c/code\u003e, \u003ccode\u003eflat-cache\u003c/code\u003e, \u003ccode\u003efile-entry-cache\u003c/code\u003e, \u003ccode\u003ecacheable-request\u003c/code\u003e, \u003ccode\u003ecache-manager\u003c/code\u003e, and several related utilities. The article says the poisoned versions were published to npm with valid provenance signed by GitHub Actions because malicious files were pushed directly to the \u003ccode\u003emain\u003c/code\u003e branch and new releases were cut immediately.\u003c/p\u003e\n\n\u003cp\u003eThe attack added \u003ccode\u003esetup.mjs\u003c/code\u003e and \u003ccode\u003eMath_Symbol.js\u003c/code\u003e to each package, along with a \u003ccode\u003epreinstall\u003c/code\u003e command in \u003ccode\u003epackage.json\u003c/code\u003e so the code would run automatically during installation. \u003ccode\u003esetup.mjs\u003c/code\u003e downloaded the Bun JavaScript runtime and used it to execute the real payload, \u003ccode\u003eMath_Symbol.js\u003c/code\u003e, a heavily obfuscated 728 KB JavaScript file. The payload harvested secrets, encrypted the findings, and exfiltrated them to a public GitHub repository whose description read “Shai-Hulud: Here We Go Again.”\u003c/p\u003e\n\n\u003cp\u003eThe malware targeted npm tokens, GitHub tokens, AWS credentials, Kubernetes secrets, HashiCorp Vault tokens, Stripe and Slack tokens, and many files likely to contain credentials. It also included worm-like propagation functionality to infect packages belonging to other maintainers who installed one of the compromised packages. By the August 4, 2026 13:37 CEST update, at least 868 packages across 1,381 versions had been compromised, with a combined total of more than 2 billion monthly installs.\u003c/p\u003e\n"},{"n":35,"title":"Popular npm Packages in the keyv and Cacheable Namespaces Compromised in Active Supply Chain Attack","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-active-supply-chain?utm_medium=feed","time":"10:36","priority":"MUST READ","score":98,"tldr":"Several widely used keyv and cacheable npm packages were compromised with a malicious preinstall hook that steals cloud, CI, GitHub, and npm credentials and can republish trojanized packages to spread further. Anyone who installed affected versions should treat systems as compromised, remove persistence mechanisms before rotating credentials, and pin or block the impacted packages.","briefOverview":"\u003cp\u003eSocket’s Threat Research Team is tracking an active supply chain compromise affecting widely used \u003ccode\u003ekeyv\u003c/code\u003e and \u003ccode\u003ecacheable\u003c/code\u003e npm packages. On August 4, 2026, at least ten packages in those namespaces and additional packages owned by other maintainers were published with a malicious \u003ccode\u003epreinstall\u003c/code\u003e hook. The affected packages collectively account for tens of millions of weekly downloads, and Socket says new packages are appearing in real time.\u003c/p\u003e\n\n\u003cp\u003eThe evidence indicates the maintainer account \u003ccode\u003eJaredwray\u003c/code\u003e was compromised and used to publish across the \u003ccode\u003ekeyv\u003c/code\u003e and \u003ccode\u003ecacheable\u003c/code\u003e package families. The malicious \u003ccode\u003esetup.mjs\u003c/code\u003e loader downloads a standalone Bun runtime and uses it to execute an obfuscated second-stage payload called \u003ccode\u003eMath_Symbol.js\u003c/code\u003e. That payload harvests cloud and CI credentials, npm tokens, GitHub-related secrets, Vault tokens, Kubernetes service account tokens, and other secrets found on disk.\u003c/p\u003e\n\n\u003cp\u003eThe payload can also propagate by using stolen npm tokens to discover packages, inject the same hook and payload files, bump versions, and republish trojanized releases through npm OIDC trusted publishing. Stolen data is committed to threat actor GitHub repositories and delivered to DNS-resolved destinations, while persistence is planted through \u003ccode\u003e.claude\u003c/code\u003e, \u003ccode\u003e.vscode\u003c/code\u003e, and a host-level GitHub token monitor. Socket recommends treating any environment that installed an affected version and ran install scripts as compromised, removing the dead-man’s switch and implant artifacts before rotating reachable credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s Threat Research Team is tracking an active supply chain compromise affecting widely used keyv and cacheable npm packages, with at least ten packages published on August 4, 2026 containing a malicious preinstall hook.","The malicious setup.mjs hook downloads a standalone Bun runtime, executes the obfuscated Math_Symbol.js second stage, harvests cloud and CI credentials, and can republish trojanized versions of other npm packages reachable with stolen npm tokens.","The evidence indicates the Jaredwray maintainer account was compromised and used to publish across the keyv and cacheable package families before the campaign spread to packages outside those namespaces.","The payload targets credentials including AWS, GCP, Azure, HashiCorp Vault, Kubernetes service account tokens, GitHub Actions OIDC data, and npm tokens, and exfiltrates collected data through threat actor GitHub repositories and DNS-resolved destinations.","Socket recommends treating any environment that installed an affected version and ran install scripts as compromised, removing the dead-man’s switch and implant artifacts before rotating reachable credentials."],"insights":["The malicious package code was byte-identical to a clean release candidate except for package.json and two added lifecycle files, so file comparisons of the normal library output alone would not reveal the compromise.","The article warns that rotating or revoking stolen GitHub tokens before removing the installed monitor can trigger its dead-man’s switch, which evaluates a remote-supplied command when the token starts returning HTTP 4xx responses.","The compromised keyv release had valid provenance because the legitimate release workflow built already-trojanized source, showing that provenance can confirm how software was built without proving the source was safe.","The loader downloads and runs a standalone Bun runtime from GitHub, which may bypass defenses focused only on Node processes even though the compromise starts through an npm preinstall script.","The source repository persistence in .claude and .vscode can execute the same loader when a developer or AI coding agent opens the cloned repository, meaning infection does not require running npm install in that scenario."],"referencedReports":[],"body":"\u003cp\u003eSocket’s Threat Research Team is tracking an active supply chain compromise affecting widely used \u003ccode\u003ekeyv\u003c/code\u003e and \u003ccode\u003ecacheable\u003c/code\u003e npm packages. On August 4, 2026, at least ten packages in those namespaces and additional packages owned by other maintainers were published with a malicious \u003ccode\u003epreinstall\u003c/code\u003e hook. The affected packages collectively account for tens of millions of weekly downloads, and Socket says new packages are appearing in real time.\u003c/p\u003e\n\n\u003cp\u003eThe evidence indicates the maintainer account \u003ccode\u003eJaredwray\u003c/code\u003e was compromised and used to publish across the \u003ccode\u003ekeyv\u003c/code\u003e and \u003ccode\u003ecacheable\u003c/code\u003e package families. The malicious \u003ccode\u003esetup.mjs\u003c/code\u003e loader downloads a standalone Bun runtime and uses it to execute an obfuscated second-stage payload called \u003ccode\u003eMath_Symbol.js\u003c/code\u003e. That payload harvests cloud and CI credentials, npm tokens, GitHub-related secrets, Vault tokens, Kubernetes service account tokens, and other secrets found on disk.\u003c/p\u003e\n\n\u003cp\u003eThe payload can also propagate by using stolen npm tokens to discover packages, inject the same hook and payload files, bump versions, and republish trojanized releases through npm OIDC trusted publishing. Stolen data is committed to threat actor GitHub repositories and delivered to DNS-resolved destinations, while persistence is planted through \u003ccode\u003e.claude\u003c/code\u003e, \u003ccode\u003e.vscode\u003c/code\u003e, and a host-level GitHub token monitor. Socket recommends treating any environment that installed an affected version and ran install scripts as compromised, removing the dead-man’s switch and implant artifacts before rotating reachable credentials.\u003c/p\u003e\n"},{"n":3,"title":"Massive ChainDrop npm supply-chain attack infects hundreds of packages","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/massive-chaindrop-npm-supply-chain-attack-infects-hundreds-of-packages/","time":"15:24","priority":"MUST READ","score":96,"tldr":"The ChainDrop npm worm compromised over 1,300 packages with billions of monthly downloads by abusing legitimate GitHub Actions releases to run credential-stealing preinstall scripts. Anyone who installed affected versions should treat their workstation or CI/CD runner as compromised, rebuild if needed, and rotate all exposed secrets and tokens.","briefOverview":"\u003cp\u003eSelf-propagating malware named ChainDrop has compromised more than 1,300 npm packages with a combined 2 billion monthly downloads. Infected packages include popular caching utilities such as Keyv, Cacheable, flat-cache, and file-entry-cache. The attack began after the threat actor compromised the GitHub account of Keyv’s maintainer and then spread to packages associated with organizations including Deliveroo, Ornikar, OneReach, Picsart, Qlik, and ServiceTitan.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned packages included a setup.mjs payload dropper, a Math_Symbol.js or math_init.js credential-stealing script, and a package.json preinstall entry that ran the dropper during npm install. Because the packages were built and published through legitimate GitHub Actions workflows, the compromised npm releases carried valid provenance information. The malware collects developer and cloud credentials from compromised environments, validates npm tokens in real time, and can exfiltrate data to a public GitHub repository and the npm-cache.com domain.\u003c/p\u003e\n\n\u003cp\u003eThe article says administrators should treat any developer workstation or CI/CD runner that installed an affected package version as compromised, even if the package was later removed. Recommended actions include rebuilding systems from safe backups or from scratch, rotating all accessible tokens, and reviewing logs and repositories for unauthorized access or unexpected changes. The number of affected packages and malicious versions is expected to grow as the attack continues to unfold.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Self-propagating malware named ChainDrop has compromised more than 1,300 npm packages with a combined 2 billion monthly downloads.","The attack began after a threat actor compromised the GitHub account of Keyv’s maintainer and then spread to packages associated with organizations including Deliveroo, Ornikar, OneReach, Picsart, Qlik, and ServiceTitan.","The poisoned packages contain a setup.mjs payload dropper, a Math_Symbol.js or math_init.js credential-stealing script, and a package.json preinstall entry that runs the dropper during npm install.","Aikido reported that the infostealer collects developer and cloud credentials, encrypts them, and sends them to a public GitHub repository described as “Shai-Hulud: Here We Go Again.”","Administrators who installed an affected package version are advised to treat the workstation or CI/CD runner as compromised, rebuild systems from safe backups or from scratch, rotate accessible tokens, and review logs and repositories for unauthorized changes."],"insights":["Valid provenance information on the compromised npm releases should not be treated as proof of safety, because the attacker used the projects’ legitimate GitHub Actions workflows to build and publish the poisoned packages.","Removing an affected package after installation is not enough, because the article says systems that installed impacted versions should still be treated as compromised.","The malware validates npm tokens against registry.npmjs.org/-/whoami before stealing them, showing that stolen tokens were checked for usefulness in real time.","The npm-cache.com domain is highlighted by Wiz as a strong indicator of compromise and should be treated as suspicious in investigations.","The malware targets not only npm and GitHub credentials but also cloud, Kubernetes, Vault, database, private key, Stripe, Slack, Twilio, Azure, and GCP secrets, so incident response must cover more than package registry accounts."],"referencedReports":[{"title":"Keyv and friends compromised in npm supply chain attack","url":"https://www.aikido.dev/blog/keyv-and-friends-compromised-in-npm-supply-chain-attack","publisher":"Aikido","context":"The article cites Aikido’s report for the number of compromised packages, details on the malicious files, and warnings about preinstall execution.","category":"research","primary":true},{"title":"Keyv and Cacheable npm Supply Chain Attack","url":"https://www.wiz.io/blog/keyv-and-cacheable-npm-supply-chain-attack","publisher":"Wiz","context":"The article links Wiz as one of the security companies providing compromised package lists and indicators of compromise, and cites Wiz on the npm-cache.com exfiltration domain.","category":"research","primary":false},{"title":"ChainDrop npm worm","url":"https://www.stepsecurity.io/blog/chaindrop-npm-worm","publisher":"StepSecurity","context":"The article links StepSecurity as one of the security companies providing a list of compromised npm packages and indicators of compromise.","category":"research","primary":false},{"title":"Keyv and Cacheable compromise","url":"https://socket.dev/supply-chain-attacks/keyv-and-cacheable-compromise","publisher":"Socket","context":"The article links Socket as one of the security companies providing a list of compromised npm packages and indicators of compromise.","category":"research","primary":false},{"title":"A New Infostealer Worm Hits npm, Affecting Keyv and Cacheable","url":"https://www.ox.security/blog/a-new-infostealer-worm-hits-npm-affecting-keyv-and-cacheable","publisher":"Ox Security","context":"The article links Ox Security as one of the security companies providing a list of compromised npm packages and indicators of compromise.","category":"research","primary":false}],"body":"\u003cp\u003eSelf-propagating malware named ChainDrop has compromised more than 1,300 npm packages with a combined 2 billion monthly downloads. Infected packages include popular caching utilities such as Keyv, Cacheable, flat-cache, and file-entry-cache. The attack began after the threat actor compromised the GitHub account of Keyv’s maintainer and then spread to packages associated with organizations including Deliveroo, Ornikar, OneReach, Picsart, Qlik, and ServiceTitan.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned packages included a setup.mjs payload dropper, a Math_Symbol.js or math_init.js credential-stealing script, and a package.json preinstall entry that ran the dropper during npm install. Because the packages were built and published through legitimate GitHub Actions workflows, the compromised npm releases carried valid provenance information. The malware collects developer and cloud credentials from compromised environments, validates npm tokens in real time, and can exfiltrate data to a public GitHub repository and the npm-cache.com domain.\u003c/p\u003e\n\n\u003cp\u003eThe article says administrators should treat any developer workstation or CI/CD runner that installed an affected package version as compromised, even if the package was later removed. Recommended actions include rebuilding systems from safe backups or from scratch, rotating all accessible tokens, and reviewing logs and repositories for unauthorized access or unexpected changes. The number of affected packages and malicious versions is expected to grow as the attack continues to unfold.\u003c/p\u003e\n"},{"n":37,"title":"ChainDrop npm Worm: Bun-loaded CI/CD credential harvester with Ethereum dead-drop C2","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/chaindrop-npm-worm","time":"12:51","priority":"MUST READ","score":96,"tldr":"A self-propagating npm worm called ChainDrop is rapidly compromising hundreds of packages by using install-time scripts to harvest CI/CD credentials and spread with stolen maintainer tokens. Anyone who installed the affected versions should assume compromise, rotate exposed secrets, and roll back to known-good releases.","briefOverview":"\u003cp\u003eStepSecurity says a self-propagating worm called ChainDrop is spreading rapidly through the npm ecosystem. The post describes the investigation as active and says 435 packages and more than 1,550 compromised versions have been flagged so far. The campaign started with keyv@6.0.0, and the listed packages should be treated as compromised if they appear in a direct or transitive dependency tree.\u003c/p\u003e\n\n\u003cp\u003eThe compromised versions follow a consistent pattern involving heavily obfuscated files such as setup.mjs and math_init.js. These files execute automatically during npm install through a preinstall script, download a runtime, and run a second-stage obfuscated payload. StepSecurity says the speed and breadth of releases across unrelated maintainer scopes indicates worm-like automated propagation using stolen maintainer credentials or tokens.\u003c/p\u003e\n\n\u003cp\u003eThe article advises affected users to check lockfiles, assume compromise if listed versions are present, and treat any machine or CI runner that installed them as compromised. It recommends rotating credentials, tokens, and secrets that were present in those environments, including npm tokens, cloud credentials, SSH keys, and CI secrets. It also recommends pinning or rolling back to known-good previous versions and auditing build artifacts, developer machines, and CI caches.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["StepSecurity says a self-propagating worm called ChainDrop is spreading rapidly through the npm ecosystem.","The campaign has flagged 435 packages and more than 1,550 compromised versions so far, starting with keyv@6.0.0.","The compromised package versions introduce heavily obfuscated files such as setup.mjs and math_init.js that run automatically during npm install through a preinstall script.","The payload downloads a runtime and executes a second-stage obfuscated payload, and the breadth of affected maintainer scopes indicates automated propagation using stolen maintainer credentials or tokens.","StepSecurity advises users with affected packages in their dependency tree to assume compromise, rotate credentials and secrets, roll back to known-good versions, and audit machines, CI runners, caches, and build artifacts."],"insights":["The article treats both direct and transitive dependencies as risky, meaning a project can be affected even if it did not intentionally add one of the listed packages.","The install-time execution means systems may be compromised simply by running npm install or npm update, before any application code from the package is used.","The campaign was still active when reported, so the listed 435 packages and 1,557 compromised versions are explicitly described as likely incomplete.","The recommended response extends beyond removing the package: any secrets present on machines or CI runners that installed the affected versions should be rotated."],"referencedReports":[],"body":"\u003cp\u003eStepSecurity says a self-propagating worm called ChainDrop is spreading rapidly through the npm ecosystem. The post describes the investigation as active and says 435 packages and more than 1,550 compromised versions have been flagged so far. The campaign started with keyv@6.0.0, and the listed packages should be treated as compromised if they appear in a direct or transitive dependency tree.\u003c/p\u003e\n\n\u003cp\u003eThe compromised versions follow a consistent pattern involving heavily obfuscated files such as setup.mjs and math_init.js. These files execute automatically during npm install through a preinstall script, download a runtime, and run a second-stage obfuscated payload. StepSecurity says the speed and breadth of releases across unrelated maintainer scopes indicates worm-like automated propagation using stolen maintainer credentials or tokens.\u003c/p\u003e\n\n\u003cp\u003eThe article advises affected users to check lockfiles, assume compromise if listed versions are present, and treat any machine or CI runner that installed them as compromised. It recommends rotating credentials, tokens, and secrets that were present in those environments, including npm tokens, cloud credentials, SSH keys, and CI secrets. It also recommends pinning or rolling back to known-good previous versions and auditing build artifacts, developer machines, and CI caches.\u003c/p\u003e\n"},{"n":7,"title":"Hotel Wi-Fi attacks use custom malware to breach Microsoft 365 accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hotel-wi-fi-attacks-use-custom-malware-to-breach-microsoft-365-accounts/","time":"00:17","priority":"MUST READ","score":94,"tldr":"Microsoft says Russia-linked Midnight Blizzard is hijacking hotel and conference Wi-Fi networks to redirect travelers to fake Microsoft 365 login or update pages, stealing credentials and deploying custom malware. Users should treat public captive-portal Wi-Fi as untrusted and avoid entering corporate credentials or installing updates prompted through these networks.","briefOverview":"\u003cp\u003eMicrosoft has linked a global campaign targeting hospitality Wi-Fi networks to the Russian threat actor Midnight Blizzard, also known as APT29. Microsoft tracks the activity as CaptiveCrunch and attributes it to Storm-2945, a sub-cluster of Midnight Blizzard. The campaign targets travelers using hotel and conference center Wi-Fi networks and has been active since at least early May, while related device and OAuth code phishing operations have been running since February.\u003c/p\u003e\n\n\u003cp\u003eThe attackers manipulate DNS and HTTP traffic on networks served by captive portal equipment, allowing them to intercept user connections. After changing DNS settings, they can redirect victims to fake Microsoft 365 login pages, device code phishing pages that abuse Microsoft Entra ID authentication flows, or fake browser and operating system update pages. Microsoft also found evidence on some ClickFix landing pages suggesting Android devices may be targeted with an APK file.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified two Windows malware families used in the campaign, CornFlake and ChocoShell. CornFlake is a Go-based remote access trojan with capabilities including remote shell access, keylogging, screenshot capture, microphone and webcam surveillance, Microsoft 365 session token theft, and file exfiltration. ChocoShell is an in-memory PowerShell credential stealer that targets browser cookies, saved passwords, Microsoft 365 and Azure AD tokens, and Wi-Fi credentials. Microsoft recommends treating hotel and conference Wi-Fi as untrusted, using private cellular or managed connections when possible, adopting phishing-resistant authentication, and disabling Microsoft Entra device code authentication when it is not needed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft linked a global campaign targeting hospitality Wi-Fi networks to the Russian threat actor Midnight Blizzard, also known as APT29, and tracks the sub-cluster as Storm-2945.","The attackers manipulate DNS and HTTP traffic on captive portal equipment to redirect hotel and conference center Wi-Fi users to Microsoft 365 phishing pages, device code phishing pages, or fake update pages that deliver malware.","Microsoft identified two Windows malware families, CornFlake and ChocoShell, with capabilities for persistent access, credential theft, surveillance, and data exfiltration.","CornFlake is a Go-based remote access trojan that can steal Microsoft 365 session tokens, capture screenshots, monitor the clipboard, log keystrokes, access the microphone and webcam, and exfiltrate files.","Microsoft recommends treating hotel and conference Wi-Fi as untrusted, using private cellular or managed connections when possible, adopting phishing-resistant authentication, and disabling Microsoft Entra device code authentication when it is not needed."],"insights":["Microsoft said it could not determine the exact initial compromise, but observed signs of breaches in shared infrastructure rather than isolated Wi-Fi devices.","The campaign gives the attackers multiple paths from the same captive portal manipulation, including Microsoft 365 phishing, device code phishing, and fake update pages that deliver malware.","Microsoft found evidence on some ClickFix landing pages that the attackers may also be targeting Android devices by attempting to deliver an APK file.","CornFlake uses fake progress windows such as Windows update, Defender scan, browser update, or network diagnostics screens to distract users while it installs persistence in the background.","Microsoft assessed that AI tools were likely used to develop CornFlake and ChocoShell because of extensive comments found in the code."],"referencedReports":[{"title":"CaptiveCrunch: Midnight Blizzard targets travelers worldwide for malware delivery and credential theft","url":"https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/","publisher":"Microsoft","context":"The article cites Microsoft’s analysis linking the CaptiveCrunch campaign to Storm-2945 and describing the CornFlake and ChocoShell malware families.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft has linked a global campaign targeting hospitality Wi-Fi networks to the Russian threat actor Midnight Blizzard, also known as APT29. Microsoft tracks the activity as CaptiveCrunch and attributes it to Storm-2945, a sub-cluster of Midnight Blizzard. The campaign targets travelers using hotel and conference center Wi-Fi networks and has been active since at least early May, while related device and OAuth code phishing operations have been running since February.\u003c/p\u003e\n\n\u003cp\u003eThe attackers manipulate DNS and HTTP traffic on networks served by captive portal equipment, allowing them to intercept user connections. After changing DNS settings, they can redirect victims to fake Microsoft 365 login pages, device code phishing pages that abuse Microsoft Entra ID authentication flows, or fake browser and operating system update pages. Microsoft also found evidence on some ClickFix landing pages suggesting Android devices may be targeted with an APK file.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft identified two Windows malware families used in the campaign, CornFlake and ChocoShell. CornFlake is a Go-based remote access trojan with capabilities including remote shell access, keylogging, screenshot capture, microphone and webcam surveillance, Microsoft 365 session token theft, and file exfiltration. ChocoShell is an in-memory PowerShell credential stealer that targets browser cookies, saved passwords, Microsoft 365 and Azure AD tokens, and Wi-Fi credentials. Microsoft recommends treating hotel and conference Wi-Fi as untrusted, using private cellular or managed connections when possible, adopting phishing-resistant authentication, and disabling Microsoft Entra device code authentication when it is not needed.\u003c/p\u003e\n"},{"n":15,"title":"CISA Adds Exploited N-able N-central Flaw to KEV After Customer Compromises","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/cisa-adds-exploited-n-able-n-central.html","time":"07:00","priority":"MUST READ","score":94,"tldr":"CISA added CVE-2026-18577 in N-able N-central to its Known Exploited Vulnerabilities catalog after attackers used the authentication-bypass flaw to compromise a limited number of customers. Organizations should urgently update to N-central 2026.3 HF1 and review Take Control activity and listed indicators of compromise.","briefOverview":"\u003cp\u003eCISA added CVE-2026-18577, a high-severity flaw in N-able N-central, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The vulnerability has a CVSS score of 8.2 and is described as incomplete patching for CVE-2026-18556. N-able said a limited number of customers were compromised through the flaw, which has been addressed in version 2026.3 HF1.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows authentication bypass and account takeover in susceptible versions of N-central. Successful exploitation can let remote attackers gain administrative access to vulnerable N-central servers and abuse the built-in Take Control feature to pivot into managed endpoints and deploy persistence mechanisms. Huntress observed threat actors targeting the flaw across multiple organizations, though it said there was no indication of a broad, indiscriminate campaign at this stage.\u003c/p\u003e\n\n\u003cp\u003eN-able shared indicators of compromise including a file named “svchost.exe” in device users’ documents folders, a registered service named “Cloudflared,” and inbound connections from four listed IP addresses. Huntress said those IP addresses are Mullvad or NordVPN VPN exit nodes and reported activity involving the default “MSP Support” username tied to legitimate N-central Take Control sessions. CISA recommended Federal Civilian Executive Branch agencies apply fixes by August 6, 2026, and review N-central Take Control activity in their environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-18577, a high-severity flaw affecting N-able N-central, to its Known Exploited Vulnerabilities catalog after reports of active exploitation.","CVE-2026-18577 is an incomplete patch for CVE-2026-18556 and allows authentication bypass and account takeover in susceptible versions of N-able N-central.","Successful exploitation can allow remote attackers to gain administrative access to vulnerable N-central servers and use the Take Control feature to pivot into managed endpoints and deploy persistence mechanisms.","N-able said a limited number of customers were compromised through CVE-2026-18577 and fixed the issue in version 2026.3 HF1.","CISA recommended Federal Civilian Executive Branch agencies apply the fixes by August 6, 2026, and review N-central Take Control activity in their environments."],"insights":["The flaw is described as incomplete patching of CVE-2026-18556, making it especially important for organizations to verify they are on N-central 2026.3 HF1 rather than assuming the earlier fix fully addressed the issue.","N-able’s indicators focus on specific post-compromise traces, including a suspicious “svchost.exe” file in device users’ documents folders and a registered service named “Cloudflared.”","Huntress observed attackers using the legitimate default “MSP Support” username tied to N-central Take Control sessions, so malicious activity may appear to come through normal remote support workflows.","All four IP addresses shared as indicators are Mullvad or NordVPN exit nodes, meaning the source addresses may indicate attacker routing infrastructure rather than a fixed attacker location.","Huntress reported targeting across multiple organizations but said there was no indication at the time that the activity had become a broad, indiscriminate campaign."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/03/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites CISA’s alert adding CVE-2026-18577 in N-able N-central to the Known Exploited Vulnerabilities catalog after active exploitation reports.","category":"advisory","primary":true},{"title":"N-able Vulnerability Exploitation","url":"https://www.huntress.com/blog/n-able-vulnerability-exploitation","publisher":"Huntress","context":"The article cites Huntress for observations about exploitation across multiple organizations, attacker behavior, and VPN exit-node IP addresses tied to the activity.","category":"research","primary":true},{"title":"N-central Security Update - August 2, 2026","url":"https://www.n-able.com/blog/n-central-security-update-august-2-2026","publisher":"N-able","context":"The article cites N-able’s security update acknowledging that a limited number of customers were compromised through CVE-2026-18577.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-18577, a high-severity flaw in N-able N-central, to its Known Exploited Vulnerabilities catalog after reports of active exploitation. The vulnerability has a CVSS score of 8.2 and is described as incomplete patching for CVE-2026-18556. N-able said a limited number of customers were compromised through the flaw, which has been addressed in version 2026.3 HF1.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows authentication bypass and account takeover in susceptible versions of N-central. Successful exploitation can let remote attackers gain administrative access to vulnerable N-central servers and abuse the built-in Take Control feature to pivot into managed endpoints and deploy persistence mechanisms. Huntress observed threat actors targeting the flaw across multiple organizations, though it said there was no indication of a broad, indiscriminate campaign at this stage.\u003c/p\u003e\n\n\u003cp\u003eN-able shared indicators of compromise including a file named “svchost.exe” in device users’ documents folders, a registered service named “Cloudflared,” and inbound connections from four listed IP addresses. Huntress said those IP addresses are Mullvad or NordVPN VPN exit nodes and reported activity involving the default “MSP Support” username tied to legitimate N-central Take Control sessions. CISA recommended Federal Civilian Executive Branch agencies apply fixes by August 6, 2026, and review N-central Take Control activity in their environments.\u003c/p\u003e\n"},{"n":20,"title":"Keyv-Linked npm Worm Poisons Hundreds of Packages, Plants Claude Code and VS Code Hooks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/keyv-linked-npm-worm-poisons-hundreds.html","time":"13:30","priority":"MUST READ","score":94,"tldr":"A credential-stealing npm worm that began with keyv@6.0.0 spread to hundreds of packages, using install scripts and developer-tool hooks to harvest secrets and republish poisoned packages. Any developer machine or CI runner that installed an affected version should be treated as compromised, with malware removed before rotating credentials.","briefOverview":"\u003cp\u003eA credential-stealing npm worm first appeared in \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e and spread beyond the Keyv and Cacheable namespaces into hundreds of packages across multiple organizations on August 4, 2026. SafeDep initially verified 353 poisoned versions across 79 package names, and later expanded its registry-backed count to 1,684 poisoned versions across 420 package names tied to nine organizations. Aikido separately reported broader counts, but the article notes that the different figures should not be combined.\u003c/p\u003e\n\n\u003cp\u003eThe malicious Keyv release used a \u003ccode\u003epreinstall\u003c/code\u003e script to run a credential-stealing bundle in developer and CI environments. SafeDep and Socket said the payload can harvest repository, npm, cloud, Vault, Kubernetes, database, and private-key material, and Socket decoded code for modifying, versioning, and republishing packages using stolen npm publishing access. Socket said any workstation or runner that executed an affected version should be treated as credential-exposed, while SafeDep advised removing the malware’s credential-revocation watcher before rotating exposed tokens and keys.\u003c/p\u003e\n\n\u003cp\u003eThe Keyv repository also retained separate Claude Code and Visual Studio Code hooks that could execute the payload after a user trusts the workspace or permits the project configuration. The poisoned Keyv release carried valid OIDC and SLSA provenance because it passed through the project’s legitimate GitHub Actions release workflow, but the article says this did not prove the source entering the workflow was safe. Because npm tags changed quickly and some related packages remained clean, the article says exposure checks must use exact package names, resolved versions, and lockfiles rather than relying on current \u003ccode\u003elatest\u003c/code\u003e tags or namespace-level blocklists.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A credential-stealing npm worm first appeared in keyv@6.0.0 and spread beyond the Keyv and Cacheable namespaces into hundreds of packages across multiple organizations on August 4, 2026.","The malicious release used a preinstall script to run a bundle that SafeDep and Socket said can harvest repository, package registry, cloud, private-key, and other credential material from developer and CI environments.","SafeDep’s updated registry-backed count reported 1,684 poisoned versions across 420 package names tied to nine organizations, while Aikido reported a separate count that should not be combined with SafeDep’s figures.","The Keyv repository also contained Claude Code and Visual Studio Code hooks that could execute the payload after a user trusts the workspace or allows the project configuration.","Socket said any workstation or runner that executed an affected version should be treated as credential-exposed, and SafeDep advised removing the malware’s credential-revocation watcher before rotating exposed tokens and keys."],"insights":["Responders should remove the malware’s credential-revocation watcher before rotating exposed tokens and keys, because revocation itself can trigger an attacker-supplied local handler.","Valid OIDC and SLSA provenance did not prevent the poisoned Keyv release from appearing legitimate, because the compromised package passed through the project’s normal GitHub Actions release workflow.","Exposure cannot be reliably determined from current npm latest tags or broad namespace blocklists, because tags changed quickly, some related packages stayed clean, and the full campaign list was incomplete.","The Claude Code and VS Code hooks in the Keyv repository created a separate execution path from npm installation, but they depended on workspace trust or user permission rather than running unconditionally in every default environment.","Upgrading alone may preserve exposure because SafeDep reported that latest still resolved to a malicious version for most other affected package names at the time of its update."],"referencedReports":[{"title":"Keyv npm supply chain compromise","url":"https://safedep.io/keyv-npm-supply-chain-compromise/","publisher":"SafeDep","context":"The article cites SafeDep's payload analysis for details on the bundle's credential harvesting, token-revocation watcher, npm publishing machinery, and registry-backed poisoned-package counts.","category":"research","primary":true},{"title":"Popular npm packages in the Keyv and Cacheable namespaces compromised in active supply chain","url":"https://socket.dev/blog/popular-npm-packages-in-the-keyv-and-cacheable-namespaces-compromised-in-active-supply-chain","publisher":"Socket","context":"The article cites Socket's analysis for claims that affected workstations or runners should be treated as credential-exposed and for decoded code that modified, versioned, and republished packages.","category":"research","primary":true},{"title":"Keyv and friends compromised in npm supply chain attack","url":"https://www.aikido.dev/blog/keyv-and-friends-compromised-in-npm-supply-chain-attack","publisher":"Aikido","context":"The article cites Aikido for a higher count of affected packages and for placing the August activity in the Shai-Hulud family.","category":"research","primary":true},{"title":"Malicious dependency in PyTorch Lightning used for AI training","url":"https://semgrep.dev/blog/2026/malicious-dependency-in-pytorch-lightning-used-for-ai-training/","publisher":"Semgrep","context":"The article references Semgrep's documentation of similar Claude Code and VS Code hooks, setup.mjs filename, and Bun 1.3.13 download in an earlier PyPI package compromise.","category":"research","primary":false}],"body":"\u003cp\u003eA credential-stealing npm worm first appeared in \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e and spread beyond the Keyv and Cacheable namespaces into hundreds of packages across multiple organizations on August 4, 2026. SafeDep initially verified 353 poisoned versions across 79 package names, and later expanded its registry-backed count to 1,684 poisoned versions across 420 package names tied to nine organizations. Aikido separately reported broader counts, but the article notes that the different figures should not be combined.\u003c/p\u003e\n\n\u003cp\u003eThe malicious Keyv release used a \u003ccode\u003epreinstall\u003c/code\u003e script to run a credential-stealing bundle in developer and CI environments. SafeDep and Socket said the payload can harvest repository, npm, cloud, Vault, Kubernetes, database, and private-key material, and Socket decoded code for modifying, versioning, and republishing packages using stolen npm publishing access. Socket said any workstation or runner that executed an affected version should be treated as credential-exposed, while SafeDep advised removing the malware’s credential-revocation watcher before rotating exposed tokens and keys.\u003c/p\u003e\n\n\u003cp\u003eThe Keyv repository also retained separate Claude Code and Visual Studio Code hooks that could execute the payload after a user trusts the workspace or permits the project configuration. The poisoned Keyv release carried valid OIDC and SLSA provenance because it passed through the project’s legitimate GitHub Actions release workflow, but the article says this did not prove the source entering the workflow was safe. Because npm tags changed quickly and some related packages remained clean, the article says exposure checks must use exact package names, resolved versions, and lockfiles rather than relying on current \u003ccode\u003elatest\u003c/code\u003e tags or namespace-level blocklists.\u003c/p\u003e\n"},{"n":32,"title":"Mini Shai-Hulud Hits keyv: Trojanized Release Exfiltrates CI Secrets via GitHub","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/keyv-malicious-packages/","time":"15:46","priority":"MUST READ","score":94,"tldr":"A malicious npm release of keyv@6.0.0 used a preinstall hook to run an obfuscated Bun-based payload that stole CI, cloud, npm, GitHub, Vault, and Kubernetes secrets while hiding exfiltration through legitimate GitHub APIs. The main defense is to identify affected lockfiles, remove persistence artifacts, rotate all reachable secrets, and disable npm lifecycle scripts by default in CI.","briefOverview":"\u003cp\u003eOn August 4, 2026, a malicious version of \u003ccode\u003ekeyv\u003c/code\u003e was published to npm as \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, affecting packages across the Keyv and Cacheable ecosystem. The release followed the Mini Shai-Hulud pattern, using a trojanized version of a heavily depended-on package with an install-time hook that targeted cloud and CI credentials. The version was later removed from the registry, and the \u003ccode\u003elatest\u003c/code\u003e tag now resolves to \u003ccode\u003e5.6.0\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malicious release did not change the compiled library under \u003ccode\u003edist/\u003c/code\u003e, making the imported library identical to the previous release candidate. Instead, it added \u003ccode\u003esetup.mjs\u003c/code\u003e, \u003ccode\u003eMath_Symbol.js\u003c/code\u003e, and a \u003ccode\u003epreinstall\u003c/code\u003e script in \u003ccode\u003epackage.json\u003c/code\u003e, causing code to run before installation completed. \u003ccode\u003esetup.mjs\u003c/code\u003e downloaded and ran the Bun runtime to execute the bundled \u003ccode\u003eMath_Symbol.js\u003c/code\u003e file, which was heavily obfuscated and contained no readable hostnames, paths, or environment variable names.\u003c/p\u003e\n\n\u003cp\u003e\u003ccode\u003eMath_Symbol.js\u003c/code\u003e contained logic and strings for collecting credentials from AWS, HashiCorp Vault, Kubernetes, Google Cloud, Azure, npm, and GitHub Actions. The article says the exfiltration path used GitHub’s own API, including authenticated-user repository creation, rather than an attacker-controlled domain. Recommended remediation includes removing persistence artifacts in \u003ccode\u003e.vscode\u003c/code\u003e and \u003ccode\u003e.claude\u003c/code\u003e paths before rotating credentials, checking lockfiles for \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, rotating reachable credentials and stored secrets, pinning a known-good replacement version, and using \u003ccode\u003e--ignore-scripts\u003c/code\u003e in CI.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On August 4, 2026, a malicious version of keyv was published to npm as keyv@6.0.0, affecting packages across the Keyv and Cacheable ecosystem.","The malicious release left the compiled library under dist unchanged but added setup.mjs, Math_Symbol.js, and a package.json preinstall hook that runs before installation completes.","The payload targeted credentials and secrets for AWS, HashiCorp Vault, Kubernetes, Google Cloud, Azure, npm, and GitHub Actions, including CI runner environment variables.","The exfiltration design used GitHub’s own API, including the authenticated-user repository creation endpoint, so there was no attacker-controlled domain to blocklist.","The article recommends checking lockfiles for keyv@6.0.0 exposure, removing persistence artifacts in .vscode and .claude paths, rotating reachable credentials and stored secrets, pinning a known-good replacement version, and using --ignore-scripts in CI."],"insights":["A source or compiled-library review alone could miss this compromise because nothing under dist changed; the malicious behavior was introduced only through package metadata and added files included in the npm tarball.","Network blocklists are unlikely to help in this case because the payload used GitHub’s own API rather than an attacker-controlled domain, making the traffic look like normal developer tooling activity.","Signed npm provenance is not sufficient proof of legitimacy for affected accounts because the bundle contained components for npm’s provenance attestation flow and could republish packages using stolen registry and GitHub Actions OIDC tokens.","Credential rotation should happen only after removing persistence artifacts, because the article warns that setup.mjs files may be planted in .vscode and .claude tool configurations.","Rotating only access keys is incomplete because the payload included routines for retrieving secrets from AWS Secrets Manager, SSM Parameter Store, and Vault KV, so the secrets stored inside those systems may also need to be re-keyed."],"referencedReports":[],"body":"\u003cp\u003eOn August 4, 2026, a malicious version of \u003ccode\u003ekeyv\u003c/code\u003e was published to npm as \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, affecting packages across the Keyv and Cacheable ecosystem. The release followed the Mini Shai-Hulud pattern, using a trojanized version of a heavily depended-on package with an install-time hook that targeted cloud and CI credentials. The version was later removed from the registry, and the \u003ccode\u003elatest\u003c/code\u003e tag now resolves to \u003ccode\u003e5.6.0\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malicious release did not change the compiled library under \u003ccode\u003edist/\u003c/code\u003e, making the imported library identical to the previous release candidate. Instead, it added \u003ccode\u003esetup.mjs\u003c/code\u003e, \u003ccode\u003eMath_Symbol.js\u003c/code\u003e, and a \u003ccode\u003epreinstall\u003c/code\u003e script in \u003ccode\u003epackage.json\u003c/code\u003e, causing code to run before installation completed. \u003ccode\u003esetup.mjs\u003c/code\u003e downloaded and ran the Bun runtime to execute the bundled \u003ccode\u003eMath_Symbol.js\u003c/code\u003e file, which was heavily obfuscated and contained no readable hostnames, paths, or environment variable names.\u003c/p\u003e\n\n\u003cp\u003e\u003ccode\u003eMath_Symbol.js\u003c/code\u003e contained logic and strings for collecting credentials from AWS, HashiCorp Vault, Kubernetes, Google Cloud, Azure, npm, and GitHub Actions. The article says the exfiltration path used GitHub’s own API, including authenticated-user repository creation, rather than an attacker-controlled domain. Recommended remediation includes removing persistence artifacts in \u003ccode\u003e.vscode\u003c/code\u003e and \u003ccode\u003e.claude\u003c/code\u003e paths before rotating credentials, checking lockfiles for \u003ccode\u003ekeyv@6.0.0\u003c/code\u003e, rotating reachable credentials and stored secrets, pinning a known-good replacement version, and using \u003ccode\u003e--ignore-scripts\u003c/code\u003e in CI.\u003c/p\u003e\n"},{"n":40,"title":"DentaQuest Data Theft Hack Affects 15M Patients","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/dentaquest-data-theft-hack-affects-15m-patients/","time":"17:26","priority":"MUST READ","score":94,"tldr":"DentaQuest is notifying 15 million people that sensitive data was compromised in a May hack, far exceeding ShinyHunters’ own claimed victim count. Health-ISAC warned that ShinyHunters’ cloud-scale pay-or-leak data extortion campaigns are increasingly threatening healthcare organizations.","briefOverview":"\u003cp\u003eDentaQuest, described as one of the largest dental and vision benefits administrators in the United States, is notifying 15 million people that their sensitive information was compromised in a May hack. The article says this victim count is five times higher than the claims made by the ShinyHunters ransomware gang. It cites Data Breach Today as the source for the full article.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC Chief Security Officer Errol Weiss said attacker claims may reflect what attackers think they stole or what they choose to claim. He said a company’s notification numbers must account for a broader set of data that was potentially accessible during the intrusion window. Weiss also said the confirmed affected count can rise as a forensic investigation continues.\u003c/p\u003e\n\n\u003cp\u003eThe article says a flurry of ShinyHunters data thefts has prompted Health-ISAC and other industry groups to warn the healthcare sector about the gang’s evolving and persistent threats. Weiss said ShinyHunters uses a pure “pay-or-leak” data extortion model rather than traditional malware encryption. He described the group as a prolific and dominant threat representing a massive wave of cloud-scale data exfiltration affecting major medical device manufacturers, dental administrators, and primary care networks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DentaQuest is notifying 15 million people that their sensitive information was compromised in a May hack.","The article states that the number of victims is five times higher than the claims made by the ShinyHunters ransomware gang.","Errol Weiss of Health-ISAC said attacker claims may reflect what attackers think they stole or choose to claim, while company notification numbers must account for data potentially accessible during the intrusion window.","Health-ISAC warned the healthcare sector about ShinyHunters’ evolving and persistent threats after a flurry of data thefts.","Health-ISAC’s Errol Weiss said ShinyHunters uses a pay-or-leak data extortion model rather than traditional malware encryption."],"insights":["The confirmed affected population can substantially exceed a threat actor’s public claim because company notifications account for all data that may have been accessible during the intrusion window.","The article highlights that victim counts may rise over time as forensic investigations continue, so early figures may not represent the final scope of exposure.","ShinyHunters’ activity is described as a cloud-scale data exfiltration wave, indicating that the group’s impact is not limited to isolated organizations.","Health-ISAC’s warning names multiple healthcare-related targets, including medical device manufacturers, dental administrators, and primary care networks, showing the threat spans several parts of the healthcare ecosystem."],"referencedReports":[{"title":"Shiny Hunters Impact to Health Sector and Recommended Mitigation Strategies","url":"https://health-isac.org/shiny-hunters-impact-to-health-sector-and-recommended-mitigation-strategies/","publisher":"Health-ISAC","context":"The article says Health-ISAC warned the healthcare sector about ShinyHunters’ evolving and persistent threats and links to its recommended mitigation strategies.","category":"advisory","primary":false}],"body":"\u003cp\u003eDentaQuest, described as one of the largest dental and vision benefits administrators in the United States, is notifying 15 million people that their sensitive information was compromised in a May hack. The article says this victim count is five times higher than the claims made by the ShinyHunters ransomware gang. It cites Data Breach Today as the source for the full article.\u003c/p\u003e\n\n\u003cp\u003eHealth-ISAC Chief Security Officer Errol Weiss said attacker claims may reflect what attackers think they stole or what they choose to claim. He said a company’s notification numbers must account for a broader set of data that was potentially accessible during the intrusion window. Weiss also said the confirmed affected count can rise as a forensic investigation continues.\u003c/p\u003e\n\n\u003cp\u003eThe article says a flurry of ShinyHunters data thefts has prompted Health-ISAC and other industry groups to warn the healthcare sector about the gang’s evolving and persistent threats. Weiss said ShinyHunters uses a pure “pay-or-leak” data extortion model rather than traditional malware encryption. He described the group as a prolific and dominant threat representing a massive wave of cloud-scale data exfiltration affecting major medical device manufacturers, dental administrators, and primary care networks.\u003c/p\u003e\n"},{"n":19,"title":"New cPanel Critical Flaw Could Let Hosting Customers Run SQL as Database Root","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/new-cpanel-critical-flaw-could-let.html","time":"10:36","priority":"MUST READ","score":93,"tldr":"cPanel released critical security updates for a flaw that lets authenticated hosting customers run SQL commands with database root privileges, potentially leading to full server compromise in some configurations. Admins should update immediately or temporarily revoke users’ MySQL access if patching must wait.","briefOverview":"\u003cp\u003ecPanel has patched CVE-2026-58048, a critical database privilege escalation flaw affecting all supported versions of cPanel \u0026amp; WHM and WP Squared. The bug allows an authenticated cPanel account holder with access to the MySQL or MariaDB feature to execute arbitrary database commands with full administrative privileges. cPanel says that, depending on the operating system and database engine configuration, the issue may extend to operating-system-level compromise.\u003c/p\u003e\n\n\u003cp\u003eThe flaw sits in cPanel’s database-renaming process, where the HackerOne CNA record says SQL mode is not preserved when a database is renamed, causing SQL to execute in root context. cPanel’s advisory describes the issue as privilege escalation, while the CNA classifies it as CWE-89 SQL injection. CISA’s August 4 enrichment recorded no known exploitation, assessed the issue as non-automatable, and rated its technical impact as total.\u003c/p\u003e\n\n\u003cp\u003eThe targeted security release also fixes CVE-2026-58047, an HTTP request-smuggling issue in cpsrvd that may allow an unauthenticated remote attacker to manipulate responses delivered to other users on the same server. A third advisory covers GCVE-25-2026-07-45-3 in Exim, where a local user’s .forward file can trigger unsafe string expansion under certain pipe-transport configurations. cPanel says administrators who cannot immediately update for CVE-2026-58048 can temporarily revoke the MySQL feature from cPanel users, while the request-smuggling workaround disables backend connection reuse in cpsrvd.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["cPanel patched CVE-2026-58048, a critical flaw that lets an authenticated cPanel account holder with MySQL or MariaDB feature access execute arbitrary database commands with full administrative privileges.","The issue affects all supported versions of cPanel \u0026 WHM and WP Squared, and cPanel says that depending on the operating system and database engine configuration it may extend to operating-system-level compromise.","cPanel says servers that cannot update immediately can temporarily revoke the MySQL feature from cPanel users, leaving existing databases running but preventing users from adding or removing databases.","The same targeted security release also fixes CVE-2026-58047, an HTTP request-smuggling issue in cpsrvd, and GCVE-25-2026-07-45-3, an Exim .forward privilege-escalation issue.","CISA’s August 4 enrichment recorded no known exploitation for CVE-2026-58048, assessed it as non-automatable, and rated its technical impact as total."],"insights":["The highest-risk environments are multi-tenant hosting servers where accounts are sold to unrelated customers, because the flaw crosses the boundary between a normal cPanel account and the server’s administrative database identity.","The temporary mitigation for CVE-2026-58048 is narrow but disruptive: revoking the MySQL feature leaves existing databases running while blocking users from adding or removing databases.","CISA’s note that there was no known exploitation is only an August 4 snapshot, and the article explicitly warns that it says nothing about whether exploitation occurred afterward.","The vendor advisory calls CVE-2026-58048 a privilege escalation while the CNA classifies it as SQL injection, showing that the same bug is being described from different technical angles.","cPanel’s advisories disagree on whether the 11.118 branch is included in the fixed builds, so administrators on that branch are told to verify their installed point release against the database advisory rather than relying on the shorter lists."],"referencedReports":[{"title":"CVE-2026-58048 Vulnerability Enrichment","url":"https://github.com/cisagov/vulnrichment/blob/develop/2026/58xxx/CVE-2026-58048.json","publisher":"CISA","context":"The article cites CISA’s August 4 enrichment as recording no known exploitation, assessing the flaw as non-automatable, and rating its technical impact as total.","category":"advisory","primary":false},{"title":"Security CVE-2026-58048 Database Privilege Escalation","url":"https://support.cpanel.net/hc/en-us/articles/42285745783703-Security-CVE-2026-58048-Database-Privilege-Escalation","publisher":"cPanel","context":"The article references cPanel’s vendor advisory for the database privilege-escalation flaw and its characterization of the issue.","category":"advisory","primary":true},{"title":"CVE-2026-58048","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-58048","publisher":"HackerOne CNA","context":"The article cites the CNA record as saying SQL mode is not preserved when a database is renamed, causing SQL to execute in root context.","category":"advisory","primary":true},{"title":"Security CVE-2026-58047 HTTP Request Smuggling","url":"https://support.cpanel.net/hc/en-us/articles/42285024734743-Security-CVE-2026-58047-HTTP-Request-Smuggling","publisher":"cPanel","context":"The article cites cPanel’s advisory for the cpsrvd HTTP request-smuggling issue fixed in the same release.","category":"advisory","primary":true},{"title":"CVE-2026-58047","url":"https://nvd.nist.gov/vuln/detail/CVE-2026-58047","publisher":"HackerOne CNA","context":"The article cites the CNA record as saying credentials could leak from the request-smuggling issue.","category":"advisory","primary":false},{"title":"Security GCVE-25-2026-07-45-3 Exim .forward Privilege Escalation","url":"https://support.cpanel.net/hc/en-us/articles/42285884685207-Security-GCVE-25-2026-07-45-3-Exim-forward-Privilege-Escalation","publisher":"cPanel","context":"The article references cPanel’s advisory for the Exim .forward privilege-escalation issue in the same release.","category":"advisory","primary":true},{"title":"EXIM Security Advisory 2026-06-22.3","url":"https://www.exim.org/static/doc/security/EXIM-Security-2026-06-22.3/EXIM-Security-2026-06-22.3.txt","publisher":"Exim","context":"The article cites Exim’s advisory for the conditions required to exploit the .forward pipe-transport issue and notes that Exim 4.99.5 removes the vulnerable expansion.","category":"advisory","primary":true},{"title":"EXIM Security Advisory 2026-06-22.1","url":"https://www.exim.org/static/doc/security/EXIM-Security-2026-06-22.1/EXIM-Security-2026-06-22.1.txt","publisher":"Exim","context":"The article cites Exim’s advisory for a high-severity local directory traversal through queue-name command-line arguments fixed in Exim 4.99.5.","category":"advisory","primary":false}],"body":"\u003cp\u003ecPanel has patched CVE-2026-58048, a critical database privilege escalation flaw affecting all supported versions of cPanel \u0026amp; WHM and WP Squared. The bug allows an authenticated cPanel account holder with access to the MySQL or MariaDB feature to execute arbitrary database commands with full administrative privileges. cPanel says that, depending on the operating system and database engine configuration, the issue may extend to operating-system-level compromise.\u003c/p\u003e\n\n\u003cp\u003eThe flaw sits in cPanel’s database-renaming process, where the HackerOne CNA record says SQL mode is not preserved when a database is renamed, causing SQL to execute in root context. cPanel’s advisory describes the issue as privilege escalation, while the CNA classifies it as CWE-89 SQL injection. CISA’s August 4 enrichment recorded no known exploitation, assessed the issue as non-automatable, and rated its technical impact as total.\u003c/p\u003e\n\n\u003cp\u003eThe targeted security release also fixes CVE-2026-58047, an HTTP request-smuggling issue in cpsrvd that may allow an unauthenticated remote attacker to manipulate responses delivered to other users on the same server. A third advisory covers GCVE-25-2026-07-45-3 in Exim, where a local user’s .forward file can trigger unsafe string expansion under certain pipe-transport configurations. cPanel says administrators who cannot immediately update for CVE-2026-58048 can temporarily revoke the MySQL feature from cPanel users, while the request-smuggling workaround disables backend connection reuse in cpsrvd.\u003c/p\u003e\n"},{"n":27,"title":"npm Stealer Reads Its C2 From an Ethereum Contract","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/npm-stealer-reads-its-c2-from-an-ethereum-contract","time":"18:45","priority":"MUST READ","score":93,"tldr":"Netskope found 28 malicious npm package versions across four enterprise namespaces using the same Shai-Hulud stealer payload, which harvests developer and CI/CD secrets during install. The payload hides its command-and-control by resolving the exfiltration domain from an Ethereum smart contract at runtime, allowing the operator to rotate infrastructure without republishing packages.","briefOverview":"\u003cp\u003eNetskope Threat Labs identified 28 malicious npm package versions published on 2026-08-04 across four unrelated enterprise namespaces: \u003ccode\u003e@servicetitan\u003c/code\u003e, \u003ccode\u003e@or-sdk\u003c/code\u003e, \u003ccode\u003e@onereach\u003c/code\u003e, and \u003ccode\u003e@umacloud\u003c/code\u003e. The packages were published in rapid bursts, with \u003ccode\u003e@or-sdk\u003c/code\u003e and \u003ccode\u003e@onereach\u003c/code\u003e at 10:39 UTC, \u003ccode\u003e@servicetitan\u003c/code\u003e at 10:41 UTC, and \u003ccode\u003e@umacloud/knowledge\u003c/code\u003e at 13:18 UTC. All 28 packages carried an identical or functionally equivalent payload, and the operator behind the campaign calls it Shai-Hulud.\u003c/p\u003e\n\n\u003cp\u003eAt install time, the packages fetched a signed Bun runtime release from GitHub, executed an obfuscated JavaScript stealer under it, and then deleted the runtime. In sandbox testing of \u003ccode\u003e@or-sdk/accounts@2.3.5\u003c/code\u003e, the payload read SSH private keys, AWS credentials, Docker registry authentication, Jenkins secrets, and \u003ccode\u003e/etc/shadow\u003c/code\u003e, requested a GitHub CLI token, enumerated AWS Systems Manager Parameter Store and Secrets Manager across 17 regions, queried EC2 instance metadata, attempted a HashiCorp Vault AWS login against localhost, and posted an encrypted 4.8 KB bundle to \u003ccode\u003enpm-cache.com/router\u003c/code\u003e. The same payload was designed to collect from both developer workstations and CI/CD environments.\u003c/p\u003e\n\n\u003cp\u003eThe exfiltration domain was not hardcoded in the payload and was instead resolved at runtime through an \u003ccode\u003eeth_call\u003c/code\u003e to an Ethereum smart contract, with three public Ethereum RPC providers tried until one responded. Netskope said this lets the operator redirect exfiltration infrastructure by updating contract state without republishing packages. The recovered payload from \u003ccode\u003e@umacloud/knowledge@1.0.74\u003c/code\u003e had the same SHA256 hash as the sample used against the \u003ccode\u003ekeyv\u003c/code\u003e package family the same day, confirming a single campaign toolset.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Threat Labs identified 28 malicious npm package versions published on 2026-08-04 across the @servicetitan, @or-sdk, @onereach, and @umacloud namespaces.","The packages used an install-time payload that downloaded Bun v1.3.13 from the official oven-sh/bun GitHub release URL, ran an obfuscated JavaScript stealer, and then deleted the runtime.","In sandbox testing of @or-sdk/accounts@2.3.5, the payload read SSH private keys, AWS credentials, Docker registry authentication, Jenkins secrets, and /etc/shadow, requested a GitHub CLI token, and attempted to collect cloud and Vault secrets.","The exfiltration host was not hardcoded in the payload and was resolved at runtime through an eth_call to an Ethereum smart contract, with three public Ethereum RPC providers tried until one responded.","The recovered payload from @umacloud/knowledge@1.0.74 matched the sample used against the keyv package family the same day, confirming a single campaign toolset."],"insights":["Detection based only on package contents or hardcoded domains is likely to miss this campaign because the tarballs ship no malicious binary, use a legitimately signed Bun runtime downloaded at install time, and retrieve the exfiltration domain dynamically.","The Ethereum call selector 0x02d1e413 is a more durable detection indicator than npm-cache.com because the article notes that the domain can be rotated by changing smart contract state.","The same payload is designed to extract value from both developer workstations and build agents, combining local targets such as SSH keys and GitHub CLI tokens with CI/CD-oriented targets such as Jenkins secrets, EC2 metadata, Vault AWS login, and AWS secrets enumeration.","The near-simultaneous publishing of packages across separate namespaces shows the campaign could move very quickly once publishing access was available, with 27 of the 28 documented malicious versions appearing within about two minutes."],"referencedReports":[{"title":"Keyv and Friends Compromised in npm Supply Chain Attack","url":"https://www.aikido.dev/blog/keyv-and-friends-compromised-in-npm-supply-chain-attack","publisher":"Aikido Security","context":"The article cites Aikido Security's reporting that the same payload was used against the keyv package family on the same day, confirming a single campaign toolset.","category":"research","primary":false}],"body":"\u003cp\u003eNetskope Threat Labs identified 28 malicious npm package versions published on 2026-08-04 across four unrelated enterprise namespaces: \u003ccode\u003e@servicetitan\u003c/code\u003e, \u003ccode\u003e@or-sdk\u003c/code\u003e, \u003ccode\u003e@onereach\u003c/code\u003e, and \u003ccode\u003e@umacloud\u003c/code\u003e. The packages were published in rapid bursts, with \u003ccode\u003e@or-sdk\u003c/code\u003e and \u003ccode\u003e@onereach\u003c/code\u003e at 10:39 UTC, \u003ccode\u003e@servicetitan\u003c/code\u003e at 10:41 UTC, and \u003ccode\u003e@umacloud/knowledge\u003c/code\u003e at 13:18 UTC. All 28 packages carried an identical or functionally equivalent payload, and the operator behind the campaign calls it Shai-Hulud.\u003c/p\u003e\n\n\u003cp\u003eAt install time, the packages fetched a signed Bun runtime release from GitHub, executed an obfuscated JavaScript stealer under it, and then deleted the runtime. In sandbox testing of \u003ccode\u003e@or-sdk/accounts@2.3.5\u003c/code\u003e, the payload read SSH private keys, AWS credentials, Docker registry authentication, Jenkins secrets, and \u003ccode\u003e/etc/shadow\u003c/code\u003e, requested a GitHub CLI token, enumerated AWS Systems Manager Parameter Store and Secrets Manager across 17 regions, queried EC2 instance metadata, attempted a HashiCorp Vault AWS login against localhost, and posted an encrypted 4.8 KB bundle to \u003ccode\u003enpm-cache.com/router\u003c/code\u003e. The same payload was designed to collect from both developer workstations and CI/CD environments.\u003c/p\u003e\n\n\u003cp\u003eThe exfiltration domain was not hardcoded in the payload and was instead resolved at runtime through an \u003ccode\u003eeth_call\u003c/code\u003e to an Ethereum smart contract, with three public Ethereum RPC providers tried until one responded. Netskope said this lets the operator redirect exfiltration infrastructure by updating contract state without republishing packages. The recovered payload from \u003ccode\u003e@umacloud/knowledge@1.0.74\u003c/code\u003e had the same SHA256 hash as the sample used against the \u003ccode\u003ekeyv\u003c/code\u003e package family the same day, confirming a single campaign toolset.\u003c/p\u003e\n"},{"n":11,"title":"Swiss IT agency hacked, 200 accounts compromised, SharePoint vulns suspected","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/swiss-bit-foitt-hacked-possibly-sharepoint-vulnerabilities","time":"12:45","priority":"MUST READ","score":92,"tldr":"Switzerland’s federal IT agency says about 200 accounts were compromised on its on-premises SharePoint servers, likely through recently patched SharePoint vulnerabilities. Officials found no evidence so far of broader data access, but are reinstalling servers and rotating mitigations because stolen IIS machine keys can let attackers maintain access even after patching.","briefOverview":"\u003cp\u003eSwitzerland’s Federal Office for Information Technology and Communications disclosed that hackers compromised approximately 200 accounts on its on-premises SharePoint servers. Security specialists first detected anomalies on the Microsoft servers a week before the announcement. The agency did not confirm the initial entry point, but said the attack was presumably carried out by previously unknown actors exploiting SharePoint vulnerabilities identified in Microsoft’s July Patch Tuesday release.\u003c/p\u003e\n\n\u003cp\u003eThe agency said initial analysis found no indication that data beyond the compromised login credentials was accessed, though the investigation is ongoing. It also said confidential information or particularly sensitive personal data may not be stored on the SharePoint platform. Both user and technical accounts were compromised, and the agency blocked internet access to SharePoint and patched the vulnerabilities on the same day anomalous access was detected.\u003c/p\u003e\n\n\u003cp\u003eCISA warned that attackers exploiting the SharePoint flaws were extracting machine keys from Microsoft’s Internet Information Services, the web server underpinning SharePoint. Stolen machine keys can let attackers forge legitimate-looking requests that a fully patched server will still accept, meaning a credential leak can outlive the patch. CISA, CERT-EU, and other national CERTs stressed rotating machine keys and restarting IIS rather than simply applying patches, while the Swiss agency said it was reinstalling the affected SharePoint servers as a preventative measure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Switzerland’s Federal Office for Information Technology and Communications disclosed that hackers compromised approximately 200 accounts on its on-premises SharePoint servers.","The agency said the attackers were previously unknown and presumably exploited SharePoint vulnerabilities identified in Microsoft’s July Patch Tuesday release.","Initial analysis found no indication that data beyond the compromised login credentials was accessed, but the agency said the analysis is ongoing.","On the day anomalous access was detected, the agency blocked internet access to SharePoint and patched the vulnerabilities.","CISA, CERT-EU and other national CERTs stressed the need to rotate
