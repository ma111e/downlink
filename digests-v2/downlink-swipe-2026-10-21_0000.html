<script type="application/json" id="dl-articles">[{"n":1,"title":"PHP2Shell Unauthenticated RCE on PHP: CVE-2026-109618 \u0026 CVE-2026-109619","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/php2shell-unauthenticated-rce-on-php-cve-2026-109618-cve-2026-109619/","time":"16:25","priority":"MUST READ","score":98,"tldr":"PHP has disclosed two critical, actively exploited unauthenticated RCE vulnerabilities, CVE-2026-109618 and CVE-2026-109619, affecting PHP web deployments including PHP-FPM, mod_php, CGI, FrankenPHP, and LiteSpeed. Update immediately to PHP 8.5.12, 8.4.27, 8.3.36, or 8.2.35 and restart workers, as no complete workaround exists.","briefOverview":"\u003cp\u003eThe PHP project disclosed two critical vulnerabilities, CVE-2026-109618 and CVE-2026-109619, that can let an unauthenticated remote attacker execute code on PHP web servers. Both have a CVSS 4.0 score of 9.2 and affect PHP installations serving web requests through PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP, and LiteSpeed. Exploitation has been confirmed in the wild since at least October 21, 2026, and the article identifies Apache with mod_php as the highest-risk configuration because exploitation can occur before application code runs.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 involves out-of-memory handling that can leave internal request data partially initialized, while CVE-2026-109619 can leave request state available after its backing memory has been freed and then used by a later request. PHP released fixed versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35 on October 21, 2026, and says updating is the only complete remediation. Organizations should identify all PHP deployments, patch and restart PHP workers and web server processes, and treat exposed unpatched systems as potentially compromised if they show signs such as worker crashes, memory errors, fatal errors, or unexpected child processes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-109618 and CVE-2026-109619 are critical PHP vulnerabilities with CVSS 4.0 scores of 9.2 that can allow an unauthenticated remote attacker to execute code.","The vulnerabilities affect PHP installations serving web requests, including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP, and LiteSpeed, when running versions earlier than PHP 8.5.12, 8.4.27, 8.3.36, or 8.2.35.","The PHP project released fixed versions on October 21, 2026 and states that updating is the only complete remediation.","Exploitation has been confirmed in the wild since at least October 21, 2026, although the vulnerabilities were not listed in the CISA KEV catalog at the time of the notice.","Organizations should restart PHP workers and web server processes after updating, and should treat unpatched internet-facing PHP systems showing possible signs of exploitation as potentially compromised."],"insights":["The article says an unauthenticated request can trigger the issue in Apache with mod_php before any application code runs, meaning application-level protections may not prevent this attack path.","For the out-of-memory flaw, the suggested exposure-reduction step is to set PHP's memory limit to unlimited while using container or cgroup limits as the availability boundary; address-space and data-size limits should not be used because they can trigger the vulnerable allocation failure.","The stale-state flaw can involve a later request handled by the same worker, so disabling session upload progress and restarting every worker are specifically recommended when patching is delayed.","The article advises treating any internet-reachable, unpatched PHP installation as potentially compromised pending both an update and an investigation, especially if it shows worker crashes, out-of-memory errors, fatal errors, or unexpected child processes."],"referencedReports":[{"title":"PHP Security Advisory — Critical remote code execution vulnerabilities","url":"https://www.php.net/index.php","publisher":"PHP Project","context":"The article cites the PHP security advisory as the source for the critical RCE disclosures and fixed releases.","category":"advisory","primary":true},{"title":"GHSA-w8hw-w9fx-j79w (CVE-2026-109618)","url":"https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w","publisher":"PHP Project","context":"The article links to the GitHub security advisory for CVE-2026-109618.","category":"advisory","primary":false},{"title":"GHSA-6wmf-4rv5-p3rp (CVE-2026-109619)","url":"https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp","publisher":"PHP Project","context":"The article links to the GitHub security advisory for CVE-2026-109619.","category":"advisory","primary":false}],"body":"\u003cp\u003eThe PHP project disclosed two critical vulnerabilities, CVE-2026-109618 and CVE-2026-109619, that can let an unauthenticated remote attacker execute code on PHP web servers. Both have a CVSS 4.0 score of 9.2 and affect PHP installations serving web requests through PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP, and LiteSpeed. Exploitation has been confirmed in the wild since at least October 21, 2026, and the article identifies Apache with mod_php as the highest-risk configuration because exploitation can occur before application code runs.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 involves out-of-memory handling that can leave internal request data partially initialized, while CVE-2026-109619 can leave request state available after its backing memory has been freed and then used by a later request. PHP released fixed versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35 on October 21, 2026, and says updating is the only complete remediation. Organizations should identify all PHP deployments, patch and restart PHP workers and web server processes, and treat exposed unpatched systems as potentially compromised if they show signs such as worker crashes, memory errors, fatal errors, or unexpected child processes.\u003c/p\u003e\n"},{"n":4,"title":"LiteLLM compromised again: infostealer and RAT found in version 1.107.0","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/litellm-compromised-infostealer-rat","time":"13:05","priority":"MUST READ","score":98,"tldr":"LiteLLM version 1.107.0 PyPI wheels and its official Docker image were compromised to install an infostealer and a persistent Python RAT that can exfiltrate credentials and execute attacker commands. Anyone who installed or ran the affected version should treat all accessible secrets as compromised, investigate for the listed indicators, rotate credentials, and rebuild affected systems.","briefOverview":"\u003cp\u003eLiteLLM version 1.107.0 was compromised in Python wheels published on PyPI, and the official \u003ccode\u003elitellm/litellm:1.107.0\u003c/code\u003e Docker image was also affected. The package contained an information-stealing program and a remote-control component that could execute attacker-provided code on infected systems. The article says users who installed the package version or ran the affected image, including through \u003ccode\u003elatest\u003c/code\u003e, \u003ccode\u003emain-latest\u003c/code\u003e, or \u003ccode\u003emain-stable\u003c/code\u003e tags, should assume their credentials were compromised.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were injected during the build process through a maturin configuration that included a \u003ccode\u003ecook/\u003c/code\u003e directory not present in the source repository or source archive. Python startup files named \u003ccode\u003ecook.pth\u003c/code\u003e and \u003ccode\u003esitecustomize.py\u003c/code\u003e caused the malicious code to run automatically whenever Python started, rather than requiring LiteLLM itself to be launched. The information stealer collected browser passwords, SSH keys, cloud credentials, environment variables, LiteLLM database data, and other secrets, while the background component checked hourly for commands to run. PyPI quarantined version 1.107.0, but the article states that the compromised Docker image remained available on Docker Hub.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LiteLLM version 1.107.0 Python wheels on PyPI and the official Docker image were compromised with an infostealer and a remote-access component.","The malicious files were inserted during the wheel build through a maturin configuration that bundled a directory absent from the source repository and source archive.","A startup file caused the infostealer to run automatically whenever Python started, collecting browser passwords, private keys, cloud credentials, environment variables, LiteLLM database contents, and other secrets.","A separate startup file launched a background process that checked for attacker instructions every hour and could run arbitrary Python code with the privileges of the affected Python process.","PyPI quarantined version 1.107.0, while the article states that the compromised litellm/litellm:1.107.0 Docker image remained live on Docker Hub."],"insights":["The malicious content was added in the build environment rather than the LiteLLM source repository or source archive, showing that reviewing source code alone would not have revealed the injected files.","The compromise could activate simply when any Python interpreter started because the installed files used Python startup mechanisms, not only when LiteLLM itself was run.","The infostealer’s one-time marker file can indicate that data collection already occurred, while the separate lock file can indicate that the command-fetching background process ran or remains active.","Users could receive the compromised Docker image through floating tags such as latest, main-latest, and main-stable, rather than explicitly selecting version 1.107.0.","The malicious collector targeted both locally stored credentials and credentials available from cloud-instance metadata services, expanding exposure beyond files saved on the machine."],"referencedReports":[],"body":"\u003cp\u003eLiteLLM version 1.107.0 was compromised in Python wheels published on PyPI, and the official \u003ccode\u003elitellm/litellm:1.107.0\u003c/code\u003e Docker image was also affected. The package contained an information-stealing program and a remote-control component that could execute attacker-provided code on infected systems. The article says users who installed the package version or ran the affected image, including through \u003ccode\u003elatest\u003c/code\u003e, \u003ccode\u003emain-latest\u003c/code\u003e, or \u003ccode\u003emain-stable\u003c/code\u003e tags, should assume their credentials were compromised.\u003c/p\u003e\n\n\u003cp\u003eThe malicious files were injected during the build process through a maturin configuration that included a \u003ccode\u003ecook/\u003c/code\u003e directory not present in the source repository or source archive. Python startup files named \u003ccode\u003ecook.pth\u003c/code\u003e and \u003ccode\u003esitecustomize.py\u003c/code\u003e caused the malicious code to run automatically whenever Python started, rather than requiring LiteLLM itself to be launched. The information stealer collected browser passwords, SSH keys, cloud credentials, environment variables, LiteLLM database data, and other secrets, while the background component checked hourly for commands to run. PyPI quarantined version 1.107.0, but the article states that the compromised Docker image remained available on Docker Hub.\u003c/p\u003e\n"},{"n":5,"title":"What you need to know about PHP2shell. Critical vulnerabilities in PHP (CVE-2026-109618, CVE-2026-109619)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/critical-vulnerabilities-in-php-php2shell","time":"01:54","priority":"MUST READ","score":98,"tldr":"Two critical PHP remote code execution flaws, CVE-2026-109618 and CVE-2026-109619, are reportedly being exploited in the wild and affect all unpatched PHP releases. Upgrade immediately to PHP 8.5.12, 8.4.27, 8.3.36, or 8.2.35, restart PHP workers, and investigate systems for compromise.","briefOverview":"\u003cp\u003eTwo critical remote code execution vulnerabilities in PHP, CVE-2026-109618 and CVE-2026-109619, have CVSS v4.0 scores of 9.2 and are reported to be exploited in the wild. The article states that every unpatched PHP version is affected, with mod_php deployments considered the highest risk. PHP released fixes in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should update PHP, restart PHP processes, and rebuild affected container images. Systems running PHP 8.1 or older need to upgrade to a supported release or obtain a vendor backport, while operating-system package users should check vendor changelogs for the CVE IDs because fixes may be backported without a version-number change. If updates cannot happen immediately, the article recommends applying both temporary settings, disabling session upload progress and setting the memory limit to unlimited, while noting that these measures do not make an installation safe.\u003c/p\u003e\n\n\u003cp\u003eBoth flaws involve PHP\u0026rsquo;s handling of out-of-memory errors during request processing. One can corrupt internal request data that PHP later treats as valid, while the other can leave stale request state available for use by a later request on the same worker. Because the flaws can expose worker memory, the article advises checking for compromise indicators and considering rotation of passwords, API keys, and tokens on internet-facing PHP systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP vulnerabilities CVE-2026-109618 and CVE-2026-109619 are critical remote code execution flaws with CVSS v4.0 scores of 9.2, and exploitation has been reported in the wild.","PHP released fixes in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35; organizations should update, restart PHP processes, and rebuild container images.","The article states that every unpatched PHP version is affected, while PHP 8.1 and older no longer receive updates from the PHP project.","Temporary mitigation requires disabling session upload progress and setting the PHP memory limit to unlimited in an effective configuration that applications cannot override, but these steps do not make an installation safe.","After patching, organizations should check for unusual multipart requests, memory-limit errors, malformed PHPSESSID cookies, unexpected files or users, modified PHP files, and unusual outbound connections."],"insights":["The two temporary mitigations must be applied together because each addresses a different flaw; applying only one does not provide sufficient protection.","The article warns that the most definitive public exposure check can crash a PHP worker and interrupt requests, so it should be run outside peak hours.","PHP’s security team rates systems using mod_php as the highest-risk deployments for these flaws.","Because the flaws can expose PHP worker memory, the article recommends considering rotation of passwords, API keys, and tokens on internet-facing PHP systems even after patching.","Operating-system vendors may backport fixes without changing the displayed PHP version, so administrators should verify the CVE IDs in vendor package changelogs rather than relying only on version numbers."],"referencedReports":[{"title":"PHP2Shell Detection Before Disclosure","url":"https://corelight.com/blog/php2shell-detection-before-disclosure","publisher":"corelight","context":"The article cites Corelight for additional technical information about the vulnerabilities.","category":"research","primary":false}],"body":"\u003cp\u003eTwo critical remote code execution vulnerabilities in PHP, CVE-2026-109618 and CVE-2026-109619, have CVSS v4.0 scores of 9.2 and are reported to be exploited in the wild. The article states that every unpatched PHP version is affected, with mod_php deployments considered the highest risk. PHP released fixes in versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35.\u003c/p\u003e\n\n\u003cp\u003eOrganizations should update PHP, restart PHP processes, and rebuild affected container images. Systems running PHP 8.1 or older need to upgrade to a supported release or obtain a vendor backport, while operating-system package users should check vendor changelogs for the CVE IDs because fixes may be backported without a version-number change. If updates cannot happen immediately, the article recommends applying both temporary settings, disabling session upload progress and setting the memory limit to unlimited, while noting that these measures do not make an installation safe.\u003c/p\u003e\n\n\u003cp\u003eBoth flaws involve PHP\u0026rsquo;s handling of out-of-memory errors during request processing. One can corrupt internal request data that PHP later treats as valid, while the other can leave stale request state available for use by a later request on the same worker. Because the flaws can expose worker memory, the article advises checking for compromise indicators and considering rotation of passwords, API keys, and tokens on internet-facing PHP systems.\u003c/p\u003e\n"},{"n":6,"title":"php2shell (CVE-2026-109618, CVE-2026-109619): Frequently asked questions about critical PHP remote code execution vulnerabilities","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/php2shell-cve-2026-109618-cve-2026-109619-frequently-asked-questions-about-critical-php-remote","time":"09:01","priority":"MUST READ","score":98,"tldr":"PHP is preparing an emergency October 21, 2026 release to fix two critical RCE flaws, CVE-2026-109618 and CVE-2026-109619, with early exploitation reportedly emerging. Organizations should urgently update supported PHP 8.x versions when patches arrive, as end-of-life branches may not receive fixes.","briefOverview":"\u003cp\u003ePHP announced an emergency security release for October 21, 2026, to address two critical vulnerabilities, CVE-2026-109618 and CVE-2026-109619. The PHP security team rated both flaws 9.2 under CVSSv4.0, while public reporting described them as remote code execution issues that could allow remote control of affected systems. Technical details had not been published before the planned patch release, although a php2shell exploit demonstration video and unverified public exploit code were circulating.\u003c/p\u003e\n\n\u003cp\u003eCERT-EU said the flaws could affect PHP versions from PHP 5 onward, and expected fixes were reported for PHP 8.5.12, 8.4.27, 8.3.36, and 8.2.35. End-of-life branches from PHP 5.x through 8.1.x were not expected to receive official fixes, though Linux distributors may backport patches. Cloudflare said it was seeing early attacks and had deployed web application firewall rules for known exploit paths, but PHP developers emphasized that only patching or upgrading PHP is an effective mitigation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-109618 and CVE-2026-109619 are critical PHP vulnerabilities rated 9.2 under CVSSv4.0 by the PHP security team, and public reports describe both as remote code execution flaws.","PHP scheduled an emergency security release for October 21, 2026 at 14:00 UTC, with expected fixes for PHP 8.5.12, 8.4.27, 8.3.36, and 8.2.35.","CERT-EU said the vulnerabilities could affect PHP versions from PHP 5 onward, while end-of-life PHP 5.x through 8.1.x branches are not expected to receive official fixes.","Cloudflare said it was seeing early attacks emerge and deployed web application firewall rules for known exploit paths, while emphasizing that these rules are only a temporary measure.","PHP developers stated that changing configuration settings would not mitigate the issue and that patching or upgrading PHP is the only mitigation."],"insights":["Organizations running end-of-life PHP versions from 5.x through 8.1.x may need to rely on Linux distribution backports or isolate internet-facing applications, because official fixes are not expected for those branches.","Cloudflare’s protections apply only to traffic routed through Cloudflare and cover known exploit paths, so they are explicitly a temporary layer rather than a substitute for updating PHP.","Public exploit code is already circulating but has not been verified for either CVE, and the article warns that unverified exploit code can contain malware.","The PHP team indicated that configuration changes, including disabling session upload progress, will not protect affected installations; patching or upgrading is described as the only mitigation."],"referencedReports":[{"title":"Security Advisory 2026-018","url":"https://cert.europa.eu/publications/security-advisories/2026-018/","publisher":"cert-eu","context":"The article cites this advisory as naming both CVE-2026-109618 and CVE-2026-109619 and stating that PHP versions from PHP 5 onward could be affected.","category":"advisory","primary":false}],"body":"\u003cp\u003ePHP announced an emergency security release for October 21, 2026, to address two critical vulnerabilities, CVE-2026-109618 and CVE-2026-109619. The PHP security team rated both flaws 9.2 under CVSSv4.0, while public reporting described them as remote code execution issues that could allow remote control of affected systems. Technical details had not been published before the planned patch release, although a php2shell exploit demonstration video and unverified public exploit code were circulating.\u003c/p\u003e\n\n\u003cp\u003eCERT-EU said the flaws could affect PHP versions from PHP 5 onward, and expected fixes were reported for PHP 8.5.12, 8.4.27, 8.3.36, and 8.2.35. End-of-life branches from PHP 5.x through 8.1.x were not expected to receive official fixes, though Linux distributors may backport patches. Cloudflare said it was seeing early attacks and had deployed web application firewall rules for known exploit paths, but PHP developers emphasized that only patching or upgrading PHP is an effective mitigation.\u003c/p\u003e\n"},{"n":12,"title":"Compromised LiteLLM 1.107.0 on PyPI Ships a Credential Stealer and Code Loader","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/litellm-1-107-0-compromised/","time":"16:40","priority":"MUST READ","score":98,"tldr":"LiteLLM version 1.107.0 on PyPI and associated container images were compromised with startup hooks that stole credentials and could fetch and execute remote Python code. Organizations that installed or ran the affected release should remove the payload without starting Python, rebuild from a known-good pinned version, and rotate all accessible credentials.","briefOverview":"\u003cp\u003eOn October 21, 2026, a malicious \u003ccode\u003elitellm\u003c/code\u003e version 1.107.0 was published to PyPI, and related Docker images also carried the payload. PyPI stopped serving the release in under two hours, while maintainers removed the malicious images by 14:32 UTC. The affected version was significant because LiteLLM had more than 92 million downloads in the preceding month and is used to call LLM provider APIs.\u003c/p\u003e\n\n\u003cp\u003eAll seven compiled wheels installed \u003ccode\u003ecook.pth\u003c/code\u003e, \u003ccode\u003ecook.py\u003c/code\u003e, and \u003ccode\u003esitecustomize.py\u003c/code\u003e into the top level of Python’s \u003ccode\u003esite-packages\u003c/code\u003e, causing the payload to run whenever Python started, including when \u003ccode\u003epip\u003c/code\u003e ran. The credential stealer collected browser data, cloud credentials, SSH keys, CI secrets, AI development tool tokens, process environment variables, and LiteLLM proxy credentials stored in a database when \u003ccode\u003eDATABASE_URL\u003c/code\u003e was configured. A separate loader could poll a GitHub-hosted file each hour, retrieve Python code from an attacker-controlled host, and execute it with the permissions of the process that launched Python.\u003c/p\u003e\n\n\u003cp\u003eThe article advises affected users to remove the startup files before running Python again, stop the detached loader process, block the listed network infrastructure, and identify every host, virtual environment, cache, or container image that used the release. It recommends treating credentials accessible to an affected host as exposed, rotating them, reviewing cloud activity, and rebuilding environments from a pinned clean release such as \u003ccode\u003elitellm==1.106.2\u003c/code\u003e. It also notes that mutable image tags including \u003ccode\u003elatest\u003c/code\u003e, \u003ccode\u003emain-latest\u003c/code\u003e, and \u003ccode\u003emain-stable\u003c/code\u003e pointed to the malicious images before their removal.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A malicious LiteLLM 1.107.0 release was uploaded to PyPI on October 21, 2026, and PyPI quarantined it in under two hours.","All seven malicious wheels installed a .pth startup hook, cook.py credential stealer, and sitecustomize.py remote code loader into the root of Python’s site-packages directory.","The credential stealer targeted browser data, SSH keys, cloud and container credentials, CI secrets, AI development tool tokens, process environment variables, and LiteLLM proxy database credentials when DATABASE_URL was set.","The loader polled a GitHub-hosted file hourly for a domain and could download and execute Python code from that domain with the permissions of the process that started Python.","The affected v1.107.0 Docker images and tags including latest, main-latest, and main-stable were removed after the maintainers confirmed the incident."],"insights":["The malicious files ran whenever Python started, even if LiteLLM was never imported, and this included running pip inside an affected environment.","Reinstalling a clean package from an infected Python environment could trigger the malicious startup hooks again, so the startup files needed to be removed before running Python.","The PyPI source distribution contained the altered build configuration but not the payload files, while every compiled wheel included them, making wheel inspection especially important.","A missing /tmp once-marker does not show that a host was unaffected because the marker was written only after a successful upload and temporary storage can disappear when a container restarts.","The malicious container payload was also reachable through mutable tags such as latest, main-latest, and main-stable, not only the explicit v1.107.0 tag."],"referencedReports":[{"title":"LiteLLM GitHub issue #47826","url":"https://github.com/BerriAI/litellm/issues/47826","publisher":"berriai","context":"The article cites this incident report for its detailed walkthrough of the credential stealer and remote code loader.","category":"advisory","primary":true}],"body":"\u003cp\u003eOn October 21, 2026, a malicious \u003ccode\u003elitellm\u003c/code\u003e version 1.107.0 was published to PyPI, and related Docker images also carried the payload. PyPI stopped serving the release in under two hours, while maintainers removed the malicious images by 14:32 UTC. The affected version was significant because LiteLLM had more than 92 million downloads in the preceding month and is used to call LLM provider APIs.\u003c/p\u003e\n\n\u003cp\u003eAll seven compiled wheels installed \u003ccode\u003ecook.pth\u003c/code\u003e, \u003ccode\u003ecook.py\u003c/code\u003e, and \u003ccode\u003esitecustomize.py\u003c/code\u003e into the top level of Python’s \u003ccode\u003esite-packages\u003c/code\u003e, causing the payload to run whenever Python started, including when \u003ccode\u003epip\u003c/code\u003e ran. The credential stealer collected browser data, cloud credentials, SSH keys, CI secrets, AI development tool tokens, process environment variables, and LiteLLM proxy credentials stored in a database when \u003ccode\u003eDATABASE_URL\u003c/code\u003e was configured. A separate loader could poll a GitHub-hosted file each hour, retrieve Python code from an attacker-controlled host, and execute it with the permissions of the process that launched Python.\u003c/p\u003e\n\n\u003cp\u003eThe article advises affected users to remove the startup files before running Python again, stop the detached loader process, block the listed network infrastructure, and identify every host, virtual environment, cache, or container image that used the release. It recommends treating credentials accessible to an affected host as exposed, rotating them, reviewing cloud activity, and rebuilding environments from a pinned clean release such as \u003ccode\u003elitellm==1.106.2\u003c/code\u003e. It also notes that mutable image tags including \u003ccode\u003elatest\u003c/code\u003e, \u003ccode\u003emain-latest\u003c/code\u003e, and \u003ccode\u003emain-stable\u003c/code\u003e pointed to the malicious images before their removal.\u003c/p\u003e\n"},{"n":22,"title":"PHP Patches Critical RCE Vulnerabilities, Organizations Urged to Take Unpatched Sites Offline","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/php-critical-rce-patches?utm_medium=feed","time":"15:28","priority":"MUST READ","score":98,"tldr":"PHP has released emergency patches for two critical PHP2Shell vulnerabilities (CVE-2026-109618 and CVE-2026-109619) that can enable unauthenticated remote code execution on web servers, with attacks already observed. Organizations should upgrade the PHP runtime to fixed releases immediately or isolate internet-facing applications until patching is complete.","briefOverview":"\u003cp\u003ePHP issued emergency updates on October 21 for two critical vulnerabilities collectively called PHP2Shell: CVE-2026-109618 and CVE-2026-109619. Both flaws are rated 9.2 on the CVSS v4.0 scale and can allow attackers to execute code on web servers without logging in. Fixed versions are PHP 8.5.12, 8.4.27, 8.3.36, and 8.2.35. The NSA advised organizations unable to patch to take affected internet-facing systems offline, while CERT-EU recommended isolating applications from public networks.\u003c/p\u003e\n\n\u003cp\u003eThe issues affect PHP installations serving web requests, including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP, and LiteSpeed, with affected paths reaching back to PHP 5.4. The demonstrated Apache mod_php path can be triggered before application code runs, and researchers also confirmed a PHP-FPM code-execution path during application execution. Cloudflare said it had already observed attack traffic and warned that its web application firewall rules are only a temporary stopgap. Updating WordPress, plugins, or frameworks alone is insufficient: organizations must update the PHP runtime and restart relevant services and long-running workers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP released emergency updates on October 21 for CVE-2026-109618 and CVE-2026-109619, two PHP2Shell flaws rated 9.2 under CVSS v4.0 that can allow unauthenticated code execution on web servers.","The fixed PHP releases are 8.5.12, 8.4.27, 8.3.36, and 8.2.35, and organizations unable to patch were advised by the NSA and CERT-EU to take affected applications offline or isolate them from public networks.","Cloudflare reported observing attack traffic, including modified payloads intended to evade its protections, before the public release of the patches.","The vulnerabilities affect installations serving web requests through PHP-FPM, Apache mod_php, php-cgi, FrankenPHP, and LiteSpeed, with affected code paths dating back to PHP 5.4.","Updating a website application, framework, or plugin alone does not fix PHP2Shell; administrators must update the PHP runtime and restart relevant services and long-running workers."],"insights":["The highest-risk demonstrated attack path can be triggered through Apache mod_php before any website application code runs, meaning a well-maintained application can still be exposed through its underlying PHP runtime.","Nearly 48.5% of PHP websites in the cited W3Techs survey run PHP branches that no longer receive routine upstream security updates, although some may receive fixes from Linux distributions or long-term-support vendors.","PHP-FPM blocks the demonstrated mod_php startup sequence by exiting a worker after certain failures, but researchers confirmed a separate PHP-FPM path to code execution during application execution.","PHP published minimal source backports for PHP 7.4, 8.0, and 8.1 despite those versions being out of regular support, while emphasizing that this does not restore ongoing support.","Cloudflare made initial protective web-filtering rules available even to free-plan customers, but described them as a temporary stopgap rather than a complete fix."],"referencedReports":[{"title":"Security Advisory 2026-018","url":"https://cert.europa.eu/publications/security-advisories/2026-018/","publisher":"cert-eu","context":"CERT-EU advised organizations that cannot patch to consider isolating affected PHP applications from public networks.","category":"advisory","primary":false},{"title":"PHP 8.5.12, 8.4.27, 8.3.36 and 8.2.35 Released","url":"https://www.php.net/archive/2026.php#2026-10-21-5","publisher":"php-project","context":"PHP's advisory describes the fixed releases, affected web-serving configurations, temporary mitigations, and source backports for older branches.","category":"advisory","primary":true},{"title":"PHP Vulnerabilities: WAF Protection","url":"https://blog.cloudflare.com/php-vulnerabilities-waf-protection/","publisher":"cloudflare","context":"Cloudflare reported observing attack traffic and described temporary web application firewall protections for the PHP flaws.","category":"research","primary":false},{"title":"PHP2Shell: PHP RCE","url":"https://www.wiz.io/blog/php2shell-php-rce","publisher":"wiz","context":"Wiz's research describes remote memory disclosure that may expose secrets and discusses exploit development for the flaws.","category":"research","primary":false},{"title":"PHP2Shell","url":"https://calif.io/php2shell/","publisher":"calif","context":"Calif's technical account provides history of related weaknesses and discusses researchers' investigation of the vulnerabilities.","category":"research","primary":false}],"body":"\u003cp\u003ePHP issued emergency updates on October 21 for two critical vulnerabilities collectively called PHP2Shell: CVE-2026-109618 and CVE-2026-109619. Both flaws are rated 9.2 on the CVSS v4.0 scale and can allow attackers to execute code on web servers without logging in. Fixed versions are PHP 8.5.12, 8.4.27, 8.3.36, and 8.2.35. The NSA advised organizations unable to patch to take affected internet-facing systems offline, while CERT-EU recommended isolating applications from public networks.\u003c/p\u003e\n\n\u003cp\u003eThe issues affect PHP installations serving web requests, including PHP-FPM, Apache with mod_php, php-cgi, FrankenPHP, and LiteSpeed, with affected paths reaching back to PHP 5.4. The demonstrated Apache mod_php path can be triggered before application code runs, and researchers also confirmed a PHP-FPM code-execution path during application execution. Cloudflare said it had already observed attack traffic and warned that its web application firewall rules are only a temporary stopgap. Updating WordPress, plugins, or frameworks alone is insufficient: organizations must update the PHP runtime and restart relevant services and long-running workers.\u003c/p\u003e\n"},{"n":23,"title":"LiteLLM PyPI Package and Docker Images Compromised to Steal Cloud and AI Credentials","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/litellm-compromise?utm_medium=feed","time":"13:41","priority":"MUST READ","score":98,"tldr":"LiteLLM version 1.107.0 and related container images were compromised with Python startup-hook malware that steals cloud, AI-tool, browser, and private-key credentials and can fetch unauthenticated remote code. Organizations that installed or ran it should immediately isolate affected environments, rebuild from a trusted version or image digest, and rotate all potentially exposed secrets.","briefOverview":"\u003cp\u003eLiteLLM version \u003ccode\u003e1.107.0\u003c/code\u003e was published with malicious Python startup files in all seven distributed PyPI wheels, and related LiteLLM container images were also reported as affected. The files can run during normal Python startup without an application importing LiteLLM, allowing them to collect cloud credentials, private keys, browser data, AI-tool authentication files, environment variables, and other accessible secrets. Because LiteLLM receives approximately 23 million weekly downloads, affected installations may coexist with provider API keys, cloud identities, database credentials, and deployment secrets.\u003c/p\u003e\n\n\u003cp\u003eThe malicious wheel used \u003ccode\u003ecook.pth\u003c/code\u003e to import \u003ccode\u003ecook\u003c/code\u003e at Python startup and \u003ccode\u003esitecustomize.py\u003c/code\u003e as another startup path, meaning launching Python or pip in an affected environment can activate the payload. The collector encrypts gathered data and sends it to \u003ccode\u003ehxxp://www[.]litellm[.]dev/healthcheck\u003c/code\u003e, while a separate loader can retrieve a destination from a GitHub file and download and execute Python code without signature or hash verification. Container provenance for the affected build recorded the lookalike repository \u003ccode\u003eBerri-AI/litellm\u003c/code\u003e, rather than the legitimate \u003ccode\u003eBerriAI/litellm\u003c/code\u003e, and floating tags including \u003ccode\u003elatest\u003c/code\u003e, \u003ccode\u003emain-latest\u003c/code\u003e, and \u003ccode\u003emain-stable\u003c/code\u003e resolved to the affected image index at the time observed.\u003c/p\u003e\n\n\u003cp\u003eThe article advises organizations to block LiteLLM \u003ccode\u003e1.107.0\u003c/code\u003e, stop deploying affected container tags or digests, and investigate systems where Python ran after installation. It recommends isolating affected hosts or containers, preserving useful evidence, rebuilding from reviewed artifacts, and replacing credentials that the process could have read. It also notes that removing the LiteLLM package alone may not remove top-level startup files or stop an already-running loader.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["LiteLLM version 1.107.0 distributed malicious Python startup files in all seven published PyPI wheels, allowing the payload to run during normal Python startup without importing LiteLLM.","The payload collects cloud credentials, private keys, browser data, AI development-tool authentication files, environment variables, and LiteLLM proxy database records where accessible.","The collector sends encrypted archives to hxxp://www[.]litellm[.]dev/healthcheck and includes the fixed HTTP header X-Token: XWiA8gZNa7NcX2XRoAEb.","A separate sitecustomize.py component can retrieve a domain from a GitHub repository and download and execute Python code without signature or hash verification.","Published LiteLLM container tags including v1.107.0, latest, main-latest, and main-stable resolved to the same affected image index at the time of observation."],"insights":["The malicious files were installed outside the main LiteLLM package directory, so simply removing the LiteLLM directory may leave Python startup hooks and an already-running background loader behind.","Starting Python or pip in an affected environment to investigate or remove the package can trigger the malware again; inspecting the wheel archive as data does not execute the startup hooks.","The release provenance recorded a nearly identical but different source repository, Berri-AI/litellm rather than BerriAI/litellm, and the malicious packaging configuration was absent from the tagged release, meaning a tag-only review could miss the change.","Floating container tags including latest, main-latest, and main-stable pointed to the affected image, so users could receive the compromised release without deliberately choosing version 1.107.0.","An empty remote-loader pointer prevents that component from downloading code at that moment, but it does not stop the separate credential collector or prevent a later pointer update from providing a download destination."],"referencedReports":[{"title":"Upwind Public Investigation of LiteLLM 1.107.0","url":"https://github.com/BerriAI/litellm/issues/47826#issuecomment-6316601885","publisher":"upwind","context":"The article cites Upwind’s public investigation as reporting the malicious payload in a published LiteLLM container image and identifying additional affected images.","category":"research","primary":false},{"title":"Upwind Original Report on the LiteLLM Compromise","url":"https://github.com/BerriAI/litellm/issues/47826","publisher":"upwind","context":"The article cites Upwind’s original report for identifying all seven affected LiteLLM 1.107.0 wheels and a modified source distribution.","category":"research","primary":false}],"body":"\u003cp\u003eLiteLLM version \u003ccode\u003e1.107.0\u003c/code\u003e was published with malicious Python startup files in all seven distributed PyPI wheels, and related LiteLLM container images were also reported as affected. The files can run during normal Python startup without an application importing LiteLLM, allowing them to collect cloud credentials, private keys, browser data, AI-tool authentication files, environment variables, and other accessible secrets. Because LiteLLM receives approximately 23 million weekly downloads, affected installations may coexist with provider API keys, cloud identities, database credentials, and deployment secrets.\u003c/p\u003e\n\n\u003cp\u003eThe malicious wheel used \u003ccode\u003ecook.pth\u003c/code\u003e to import \u003ccode\u003ecook\u003c/code\u003e at Python startup and \u003ccode\u003esitecustomize.py\u003c/code\u003e as another startup path, meaning launching Python or pip in an affected environment can activate the payload. The collector encrypts gathered data and sends it to \u003ccode\u003ehxxp://www[.]litellm[.]dev/healthcheck\u003c/code\u003e, while a separate loader can retrieve a destination from a GitHub file and download and execute Python code without signature or hash verification. Container provenance for the affected build recorded the lookalike repository \u003ccode\u003eBerri-AI/litellm\u003c/code\u003e, rather than the legitimate \u003ccode\u003eBerriAI/litellm\u003c/code\u003e, and floating tags including \u003ccode\u003elatest\u003c/code\u003e, \u003ccode\u003emain-latest\u003c/code\u003e, and \u003ccode\u003emain-stable\u003c/code\u003e resolved to the affected image index at the time observed.\u003c/p\u003e\n\n\u003cp\u003eThe article advises organizations to block LiteLLM \u003ccode\u003e1.107.0\u003c/code\u003e, stop deploying affected container tags or digests, and investigate systems where Python ran after installation. It recommends isolating affected hosts or containers, preserving useful evidence, rebuilding from reviewed artifacts, and replacing credentials that the process could have read. It also notes that removing the LiteLLM package alone may not remove top-level startup files or stop an already-running loader.\u003c/p\u003e\n"},{"n":10,"title":"Critical RCE vulnerabilities in PHP (CVE-2026-109618, CVE-2026-109619)","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/php2shell-critical-vulnerabilities-in-php/121596/","time":"15:18","priority":"MUST READ","score":97,"tldr":"Two critical unauthenticated PHP remote-code-execution flaws, CVE-2026-109618 and CVE-2026-109619, affect PHP versions 5 through 8 via multipart/form-data upload-progress handling and require server-side PHP updates to fix. Administrators should urgently patch affected systems or temporarily disable session upload progress and block multipart requests.","briefOverview":"\u003cp\u003ePHP issued an emergency release on October 21, 2026, to address CVE-2026-109618 and CVE-2026-109619, two critical flaws rated 9.2 on the CVSS scale. Information about the flaws was leaked before the scheduled disclosure embargo ended, and an unofficial exploit called PHP2Shell appeared online. The article says the alleged exploit was demonstrated against servers running major PHP-based platforms including WordPress, MediaWiki, phpBB, Magento, Joomla, Laravel, Symfony, Drupal, and WHMCS, although its exact behavior had not been independently verified at publication.\u003c/p\u003e\n\n\u003cp\u003eAccording to the reported proof of concept and PHP’s October 21 advisories, the flaws involve multipart/form-data handling and the session upload-progress mechanism in PHP’s core. An attacker with network access to a PHP application could execute arbitrary code as the PHP process without authentication, and application code cannot fix the underlying memory-corruption issues. The vulnerabilities affect PHP versions 5 through 8; PHP released backported patches for 7.4, 8.0, and 8.1, while administrators were advised to patch promptly and use temporary measures such as disabling upload progress, blocking multipart requests, or isolating internet-facing PHP applications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP released emergency patches on October 21, 2026, for CVE-2026-109618 and CVE-2026-109619, two critical vulnerabilities each rated 9.2 on the CVSS scale.","The flaws involve PHP handling of multipart/form-data and the session upload-progress feature, and can allow an attacker with network access to execute arbitrary code as the PHP process without authentication.","The vulnerabilities affect PHP versions 5, 6, 7, and 8; patches were also backported for PHP 7.4, 8.0, and 8.1 despite those branches being unsupported.","Administrators were advised to inventory PHP systems, disable session upload progress, block multipart requests, isolate internet-facing PHP applications if necessary, and install the patches promptly.","Kaspersky states that its EDR, network detection, and endpoint products can detect attempted exploitation and related post-exploitation activity."],"insights":["Because the flaws are in PHP’s core memory handling, the article states that application-level code changes cannot fix them; updating the PHP installation is the only permanent remedy.","Details and an alleged exploit appeared publicly before the planned disclosure embargo ended, increasing urgency ahead of the emergency patch release.","Sansec estimated that widespread exploitation could begin within 15 minutes of the update release, making pre-patch mitigations such as disabling upload progress and blocking multipart requests particularly time-sensitive.","Although several PHP branches are no longer supported, patches were backported for PHP 7.4, 8.0, and 8.1 because of the vulnerabilities’ critical severity.","The article describes detection coverage across endpoint, network-traffic, and behavior-monitoring products, indicating that defenders can look for both exploit attempts and actions taken after a compromise."],"referencedReports":[{"title":"PHP preliminary notice (October 20, 2026)","url":"https://www.php.net/archive/2026.php#2026-10-20-1","publisher":"php-project","context":"The article cites this preliminary notice announcing an upcoming emergency release for two critical PHP vulnerabilities.","category":"advisory","primary":true},{"title":"PHP security advisories (October 21, 2026)","url":"https://www.php.net/index.php#2026-10-20-5","publisher":"php-project","context":"The article states that these PHP security advisories confirm the vulnerabilities' unauthenticated remote-code-execution impact and affected functionality.","category":"advisory","primary":true},{"title":"PHP2Shell","url":"https://sansec.io/research/php2shell","publisher":"sansec","context":"The article references Sansec's research for its estimate that widespread exploitation could begin within 15 minutes of the update release.","category":"research","primary":false}],"body":"\u003cp\u003ePHP issued an emergency release on October 21, 2026, to address CVE-2026-109618 and CVE-2026-109619, two critical flaws rated 9.2 on the CVSS scale. Information about the flaws was leaked before the scheduled disclosure embargo ended, and an unofficial exploit called PHP2Shell appeared online. The article says the alleged exploit was demonstrated against servers running major PHP-based platforms including WordPress, MediaWiki, phpBB, Magento, Joomla, Laravel, Symfony, Drupal, and WHMCS, although its exact behavior had not been independently verified at publication.\u003c/p\u003e\n\n\u003cp\u003eAccording to the reported proof of concept and PHP’s October 21 advisories, the flaws involve multipart/form-data handling and the session upload-progress mechanism in PHP’s core. An attacker with network access to a PHP application could execute arbitrary code as the PHP process without authentication, and application code cannot fix the underlying memory-corruption issues. The vulnerabilities affect PHP versions 5 through 8; PHP released backported patches for 7.4, 8.0, and 8.1, while administrators were advised to patch promptly and use temporary measures such as disabling upload progress, blocking multipart requests, or isolating internet-facing PHP applications.\u003c/p\u003e\n"},{"n":11,"title":"PHP2Shell: the fix is a runtime upgrade, not a code change","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/php2shell-php-rce-cve-2026-109618/","time":"20:31","priority":"MUST READ","score":97,"tldr":"PHP2Shell comprises two critical unauthenticated RCE flaws affecting PHP web runtimes below the October 2026 patched releases, with exploitation attempts already observed. Organizations should inventory all host and container PHP installations, upgrade to a fixed vendor package or PHP release, and restart PHP services immediately.","briefOverview":"\u003cp\u003ePHP released emergency updates on October 21, 2026—versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35—to address two critical remote code execution flaws collectively called PHP2Shell. The issues, CVE-2026-109618 and CVE-2026-109619, involve out-of-memory corruption and stale global state. An unauthenticated attacker could run code as the web worker account, while memory disclosure could expose tokens, keys, and session data from other requests. Exploitation attempts were observed through watchTowr’s honeypot network, though the article states that no confirmed compromise had been reported.\u003c/p\u003e\n\n\u003cp\u003eThe flaws affect PHP itself rather than individual applications, meaning updating WordPress or Laravel alone does not resolve the exposure. PHP installations serving web requests through PHP-FPM, Apache mod_php, php-cgi, FrankenPHP, and LiteSpeed are affected when running below the fixed releases, with mod_php described as the highest-risk configuration. Organizations must inventory PHP across hosts, virtual machines, containers, internal tools, and provider-managed services, then update to a fixed PHP runtime or a distribution package containing the CVE fixes. They should rebuild patched container images, restart Apache, PHP-FPM, and long-running workers, review memory settings after patching, and investigate prior exposure through signs such as unusual multipart requests, memory-limit errors, repeated HTTP 500 responses, and unexplained PHP worker restarts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP released versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35 on October 21, 2026, to fix two critical remote-code-execution flaws known as PHP2Shell.","The flaws, CVE-2026-109618 and CVE-2026-109619, can allow an unauthenticated attacker to run code as the web worker account and may disclose memory from the worker process.","Every PHP installation serving web requests is affected, including PHP-FPM, Apache mod_php, php-cgi, FrankenPHP, and LiteSpeed, when running versions below the fixed releases.","Attack attempts were observed through watchTowr’s honeypot network as of October 21, while the article states that no confirmed compromise had been reported.","Organizations should inventory PHP on hosts, containers, and provider-managed services, upgrade to a fixed runtime or patched distribution package, and restart PHP services after updating."],"insights":["Updating WordPress, Laravel, or other PHP applications does not address PHP2Shell because the flaws are in the underlying PHP runtime rather than application code.","A Linux distribution package can be patched even when its visible PHP version appears older than the upstream fixed release, so organizations should check package changelogs for the CVE IDs.","Container base images can contain affected PHP runtimes that are not listed as application dependencies, making container-image inventory especially important.","Beyond allowing code execution, the flaws may expose memory from PHP worker processes, potentially revealing tokens, keys, or session data from other requests.","The patch adds a hard memory limit that terminates a process when reached, so organizations should verify that their memory_limit and post_max_size settings still support their applications after updating."],"referencedReports":[{"title":"CVE-2026-109618 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w","publisher":"php-project","context":"The article links this PHP source security advisory for the out-of-memory corruption remote code execution flaw.","category":"advisory","primary":true},{"title":"CVE-2026-109619 Security Advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp","publisher":"php-project","context":"The article links this PHP source security advisory for the stale global state remote code execution flaw.","category":"advisory","primary":true},{"title":"PHP Security Advisory, October 21, 2026","url":"https://www.php.net/archive/2026.php#2026-10-21-5","publisher":"php-project","context":"The article cites the PHP security advisory for the scope of affected web-serving PHP installations and patching guidance.","category":"advisory","primary":true},{"title":"PHP CVE-2026-109618 FAQ","url":"https://watchtowr.com/intelligence/php-cve-2026-109618-faq/","publisher":"watchtowr","context":"The article cites watchTowr's report that exploitation attempts were observed through its honeypot network as of October 21.","category":"research","primary":false}],"body":"\u003cp\u003ePHP released emergency updates on October 21, 2026—versions 8.5.12, 8.4.27, 8.3.36, and 8.2.35—to address two critical remote code execution flaws collectively called PHP2Shell. The issues, CVE-2026-109618 and CVE-2026-109619, involve out-of-memory corruption and stale global state. An unauthenticated attacker could run code as the web worker account, while memory disclosure could expose tokens, keys, and session data from other requests. Exploitation attempts were observed through watchTowr’s honeypot network, though the article states that no confirmed compromise had been reported.\u003c/p\u003e\n\n\u003cp\u003eThe flaws affect PHP itself rather than individual applications, meaning updating WordPress or Laravel alone does not resolve the exposure. PHP installations serving web requests through PHP-FPM, Apache mod_php, php-cgi, FrankenPHP, and LiteSpeed are affected when running below the fixed releases, with mod_php described as the highest-risk configuration. Organizations must inventory PHP across hosts, virtual machines, containers, internal tools, and provider-managed services, then update to a fixed PHP runtime or a distribution package containing the CVE fixes. They should rebuild patched container images, restart Apache, PHP-FPM, and long-running workers, review memory settings after patching, and investigate prior exposure through signs such as unusual multipart requests, memory-limit errors, repeated HTTP 500 responses, and unexplained PHP worker restarts.\u003c/p\u003e\n"},{"n":18,"title":"Emerging Threat: php2shell (CVE-2026-109618, 109619) Critical PHP Remote Code Execution","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-php2shell-cve-2026-109618-109619/","time":"15:17","priority":"MUST READ","score":97,"tldr":"Two critical PHP interpreter flaws, CVE-2026-109618 and CVE-2026-109619 (php2shell), can enable remote code execution across broadly deployed PHP environments, with reported attack traffic already targeting exposed systems. Organizations should urgently update supported PHP branches, prioritize Apache mod_php and applicable PHP-FPM deployments, and use WAF rules and configuration hardening only as interim defenses.","briefOverview":"\u003cp\u003ePHP disclosed two critical remote code execution vulnerabilities, CVE-2026-109618 and CVE-2026-109619, collectively referred to as php2shell, on 21 October 2026. Both received a CVSS v4.0 score of 9.2 from the PHP project and affect every currently supported PHP branch before fixed releases. Because PHP underpins a large share of public websites and commonly supports WordPress, Magento, Drupal, and bespoke applications, the potential exposure is broad. Cloudflare reported observing attack traffic against customers, while public repositories have published code claiming to implement a working exploit.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 stems from memory corruption after an out-of-memory condition, including conditions reachable through specially formed multipart requests. CVE-2026-109619 involves stale global state in persistent PHP workers after failures such as parse errors, failed requires, timeouts, or out-of-memory events, with confirmed paths involving fatal error backtraces and session upload progress handling. PHP released fixes in versions 8.2.35, 8.3.36, 8.4.27, and 8.5.12, and states that updating is the only complete mitigation. Organizations should prioritize Apache mod_php deployments, assess relevant PHP-FPM configurations, rebuild container images, confirm managed WAF rules are blocking, and treat end-of-life PHP installations as urgent migration cases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP disclosed two critical remote code execution vulnerabilities, CVE-2026-109618 and CVE-2026-109619, on 21 October 2026, each rated CVSS v4.0 9.2 by the PHP project.","CVE-2026-109618 involves memory corruption following an out-of-memory condition, while CVE-2026-109619 involves stale global state in persistent PHP worker processes.","PHP released fixes in versions 8.2.35, 8.3.36, 8.4.27, and 8.5.12, and the advisories state that updating is the only complete mitigation.","Cloudflare reported observing attack traffic targeting customers and said attackers were changing payloads to evade detections.","Apache mod_php is the highest-priority deployment model because remote code execution was validated there under default settings, while certain PHP-FPM configurations are also exposed through a confirmed session upload progress path."],"insights":["External scans can identify where PHP is reachable but generally cannot determine the server mode or configuration settings that govern exploitability, so organizations need configuration-management data to prioritize risk accurately.","Older, unsupported PHP installations should be treated as urgent even though they fall outside the PHP project’s listed supported-version ranges, because they may be affected without receiving a fix and already contain years of unpatched issues.","A system can be patched even if it still reports an older upstream PHP version because operating-system vendors may backport fixes, while rebuilt containers can remain vulnerable if they use stale image layers.","Cloudflare’s WAF protections provide useful temporary coverage, but attackers were already modifying their request payloads to evade detection, making software updates necessary rather than optional."],"referencedReports":[],"body":"\u003cp\u003ePHP disclosed two critical remote code execution vulnerabilities, CVE-2026-109618 and CVE-2026-109619, collectively referred to as php2shell, on 21 October 2026. Both received a CVSS v4.0 score of 9.2 from the PHP project and affect every currently supported PHP branch before fixed releases. Because PHP underpins a large share of public websites and commonly supports WordPress, Magento, Drupal, and bespoke applications, the potential exposure is broad. Cloudflare reported observing attack traffic against customers, while public repositories have published code claiming to implement a working exploit.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 stems from memory corruption after an out-of-memory condition, including conditions reachable through specially formed multipart requests. CVE-2026-109619 involves stale global state in persistent PHP workers after failures such as parse errors, failed requires, timeouts, or out-of-memory events, with confirmed paths involving fatal error backtraces and session upload progress handling. PHP released fixes in versions 8.2.35, 8.3.36, 8.4.27, and 8.5.12, and states that updating is the only complete mitigation. Organizations should prioritize Apache mod_php deployments, assess relevant PHP-FPM configurations, rebuild container images, confirm managed WAF rules are blocking, and treat end-of-life PHP installations as urgent migration cases.\u003c/p\u003e\n"},{"n":24,"title":"Cloudflare deploys protections against php2shell vulnerability","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/php-vulnerabilities-waf-protection/","time":"13:56","priority":"MUST READ","score":96,"tldr":"Cloudflare automatically deployed WAF protections for all customers against the critical php2shell flaws (CVE-2026-109618 and CVE-2026-109619), which can enable PHP denial of service, data exposure, or remote code execution. Organizations should still urgently patch their PHP runtime and keep WAF protections enabled.","briefOverview":"\u003cp\u003eCloudflare reported that php2shell, comprising CVE-2026-109618 and CVE-2026-109619, affects web servers running PHP 5.4 or later. The flaws can be triggered through specially crafted HTTP traffic and may cause service disruption, data exposure, or remote code execution. Cloudflare deployed WAF protections roughly nine hours before public disclosure, and customers using its free or paid WAF were protected by default beginning October 21 at 3:02 am UTC.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities stem from unsafe handling of memory after PHP runs out of memory or encounters a fatal error during request processing. In one case, PHP may use internal data that was not fully initialized; in the other, a later request handled by the same PHP process may access memory released after an earlier request. Cloudflare said it observed attack traffic after the vulnerability leaked and introduced full transaction detection, which uses both request and origin-response signals to identify high-confidence exploit attempts and block matching responses. Administrators should apply PHP\u0026rsquo;s vendor update while keeping WAF protections enabled, because changes to application code or plugins alone do not remediate flaws in the PHP runtime.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The php2shell vulnerabilities, CVE-2026-109618 and CVE-2026-109619, affect PHP 5.4 and later and may allow denial of service, remote code execution, or data exposure through specially crafted HTTP traffic.","Cloudflare deployed WAF protections about nine hours before public disclosure, and customers using its free or paid WAF were protected by default beginning October 21 at 3:02 am UTC.","Cloudflare observed attack traffic targeting customers after the vulnerability leaked and saw attackers modify payloads in attempts to bypass protections.","Cloudflare introduced full transaction detection, which evaluates request and response signals from the same HTTP transaction and can block a matching origin response before it reaches the requester.","Cloudflare recommends that administrators apply the PHP vendor update while keeping WAF protections enabled, because updating application code or plugins alone does not fix the PHP runtime flaws."],"insights":["One of the flaws can leave outdated memory references after a fatal error, allowing a later request handled by the same PHP process to access memory that should no longer be available.","Cloudflare states that request data alone was not always sufficient to reliably distinguish an exploit from legitimate traffic, so its new detection method also evaluates the website’s response before blocking it from reaching the requester.","The vulnerability was leaked before its planned public release, and Cloudflare observed attackers altering their request patterns in attempts to evade protections.","Cloudflare’s protections were deployed automatically even for free-plan WAF users, but the article emphasizes that these controls are only an additional safeguard and do not replace updating PHP."],"referencedReports":[{"title":"PHP security advisory for CVE-2026-109618 and CVE-2026-109619","url":"https://www.php.net/archive/2026.php#2026-10-21-5","publisher":"php","context":"The article directs administrators to the PHP advisory for affected versions and remediation instructions.","category":"advisory","primary":true}],"body":"\u003cp\u003eCloudflare reported that php2shell, comprising CVE-2026-109618 and CVE-2026-109619, affects web servers running PHP 5.4 or later. The flaws can be triggered through specially crafted HTTP traffic and may cause service disruption, data exposure, or remote code execution. Cloudflare deployed WAF protections roughly nine hours before public disclosure, and customers using its free or paid WAF were protected by default beginning October 21 at 3:02 am UTC.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities stem from unsafe handling of memory after PHP runs out of memory or encounters a fatal error during request processing. In one case, PHP may use internal data that was not fully initialized; in the other, a later request handled by the same PHP process may access memory released after an earlier request. Cloudflare said it observed attack traffic after the vulnerability leaked and introduced full transaction detection, which uses both request and origin-response signals to identify high-confidence exploit attempts and block matching responses. Administrators should apply PHP\u0026rsquo;s vendor update while keeping WAF protections enabled, because changes to application code or plugins alone do not remediate flaws in the PHP runtime.\u003c/p\u003e\n"},{"n":28,"title":"CVE-2026-109618 and CVE-2026-109619: PHP Vulnerable to Unauthenticated RCE Attacks","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/cve-2026-109618-and-cve-2026-109619-php-vulnerable-unauthenticated-rce","time":"22:21","priority":"MUST READ","score":96,"tldr":"Two critical PHP core flaws, CVE-2026-109618 and CVE-2026-109619 (PHP2Shell), reportedly enable unauthenticated remote code execution on PHP 5.4+ systems. Organizations should urgently upgrade to patched supported releases or disable/isolate unpatchable PHP instances.","briefOverview":"\u003cp\u003eOn October 21, 2026, two critical PHP vulnerabilities, CVE-2026-109618 and CVE-2026-109619, collectively called PHP2Shell, were publicly disclosed. Both have a CVSS v4.0 score of 9.2 and can allow an unauthenticated remote attacker to execute code on vulnerable servers. The article states that PHP versions from 5.4 onward are affected, including systems supporting applications such as WordPress, Drupal, Joomla, and Magento.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 involves an out-of-memory condition that can leave PHP request data incompletely initialized, while CVE-2026-109619 involves stale internal pointers accessing memory that has already been freed. The flaws can be chained to make remote code execution more reliable and may also expose process memory containing passwords, tokens, API keys, and certificates. Organizations are advised to upgrade to PHP 8.5.12, 8.4.27, 8.3.36, or 8.2.35 where applicable, disable unpatched services when possible, and isolate end-of-life PHP deployments that cannot be promptly migrated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-109618 and CVE-2026-109619, collectively called PHP2Shell, were publicly disclosed on October 21, 2026 and are rated 9.2 out of 10 under CVSS v4.0.","The article states that all PHP versions from 5.4 onward are affected, while fixes are available for PHP 8.5.12, 8.4.27, 8.3.36, and 8.2.35.","The flaws can allow an unauthenticated remote attacker to execute code on a vulnerable PHP server and potentially access sensitive memory containing passwords, tokens, API keys, or certificates.","The article describes CVE-2026-109618 as an out-of-memory error condition that can leave request data partially initialized, and CVE-2026-109619 as stale memory being accessed by a later request in the same PHP worker.","Organizations are advised to patch immediately, disable unpatched PHP services where possible, inventory PHP deployments, and isolate end-of-life instances that cannot yet be migrated."],"insights":["Application-level security controls do not remove the risk because the article says both flaws are in PHP's core request-handling runtime, affecting every PHP application on a vulnerable installation.","The two flaws can be chained: the first can help shape memory contents, while the second can access stale memory in a later request handled by the same worker, making code execution more reliable.","A PHP version number alone may not determine exposure, because Linux distribution maintainers may have already backported the patches to older package versions.","For systems that cannot be patched immediately, the article identifies disabling the PHP service as the only way to ensure that instance is secure; configuration changes and network isolation are only interim risk-reduction measures.","Possible signs of attempted exploitation include unusual web-server segmentation faults, crash dumps, and abnormal memory use, which the article recommends reviewing in Apache, Nginx, and other server logs."],"referencedReports":[],"body":"\u003cp\u003eOn October 21, 2026, two critical PHP vulnerabilities, CVE-2026-109618 and CVE-2026-109619, collectively called PHP2Shell, were publicly disclosed. Both have a CVSS v4.0 score of 9.2 and can allow an unauthenticated remote attacker to execute code on vulnerable servers. The article states that PHP versions from 5.4 onward are affected, including systems supporting applications such as WordPress, Drupal, Joomla, and Magento.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 involves an out-of-memory condition that can leave PHP request data incompletely initialized, while CVE-2026-109619 involves stale internal pointers accessing memory that has already been freed. The flaws can be chained to make remote code execution more reliable and may also expose process memory containing passwords, tokens, API keys, and certificates. Organizations are advised to upgrade to PHP 8.5.12, 8.4.27, 8.3.36, or 8.2.35 where applicable, disable unpatched services when possible, and isolate end-of-life PHP deployments that cannot be promptly migrated.\u003c/p\u003e\n"},{"n":15,"title":"Two critical RCEs in PHP core","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/two-critical-rces-in-php-core/","time":"15:10","priority":"MUST READ","score":94,"tldr":"Cisco Talos warns that two critical unauthenticated PHP core RCE flaws, CVE-2026-109618 and CVE-2026-109619, affect PHP versions since 5.4 and can be triggered before application code runs. Organizations should immediately upgrade to fixed supported PHP releases, as older EOL branches have no patches.","briefOverview":"\u003cp\u003eCisco Talos reported two critical unauthenticated remote code execution flaws in PHP core, CVE-2026-109618 and CVE-2026-109619, collectively referred to as “php2shell.” Both have CVSS v4.0 scores of 9.2 and can be triggered through a plain HTTP request before application code runs. The issues affect PHP builds since version 5.4, and Talos had not observed exploitation in the wild as of October 21, 2026.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 involves request cleanup treating partially initialized internal data as valid after an out-of-memory interruption, while CVE-2026-109619 involves reuse of stale internal state after its backing memory was freed. The broad PHP ecosystem may be exposed, including applications such as WordPress, Drupal, Magento, Shopware, WooCommerce, and Laravel, as well as sites hosted through cPanel or Plesk. Talos urges users to upgrade to available fixed releases, noting that PHP 8.1 and older are end of life and have no patch; partial mitigation measures exist, but no temporary control offers comprehensive protection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-109618 and CVE-2026-109619 are unauthenticated remote code execution flaws in PHP core with CVSS v4.0 scores of 9.2.","The flaws can be triggered by a plain HTTP request before application code runs and affect PHP builds since version 5.4.","Applications using affected PHP versions, including WordPress, Drupal, Magento, Shopware, WooCommerce, Laravel, cPanel, and Plesk-hosted sites, may be exposed.","PHP 8.1 and older are end of life and will not receive patches, so Talos strongly advises users of those versions to update to PHP 8.2 or later.","Cisco Talos had not observed exploitation in the wild as of October 21, 2026, and recommends upgrading to available fixed PHP releases."],"insights":["The suggested mitigations are incomplete: PHP and Talos state that no temporary control provides comprehensive protection, making an upgrade to a fixed release the primary response.","For CVE-2026-109618, setting PHP's memory limit to unlimited can remove a controllable failure path, but an underlying memory-allocation failure can still reach the vulnerable code.","For CVE-2026-109619, disabling upload-progress sessions must be configured before request parsing and followed by restarting every worker; application-level settings cannot be relied upon.","Roughly half of PHP systems may not receive a patch because PHP 8.1 and earlier are end of life, creating a substantial upgrade requirement rather than a simple patching task.","Cisco Talos provides detection coverage through Snort signatures 67359 and 67360, including free Community Ruleset coverage."],"referencedReports":[{"title":"CVE-2026-109618 security advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w","publisher":"php","context":"The article links this PHP source security advisory for mitigation guidance on CVE-2026-109618.","category":"advisory","primary":true},{"title":"CVE-2026-109619 security advisory","url":"https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp","publisher":"php","context":"The article links this PHP source security advisory for mitigation guidance on CVE-2026-109619.","category":"advisory","primary":true},{"title":"PHP archive advisory, October 21, 2026","url":"https://www.php.net/archive/2026.php#2026-10-21-5","publisher":"php","context":"The article cites PHP's advisory as the source of measures that may reduce exposure to specific attack paths.","category":"advisory","primary":true}],"body":"\u003cp\u003eCisco Talos reported two critical unauthenticated remote code execution flaws in PHP core, CVE-2026-109618 and CVE-2026-109619, collectively referred to as “php2shell.” Both have CVSS v4.0 scores of 9.2 and can be triggered through a plain HTTP request before application code runs. The issues affect PHP builds since version 5.4, and Talos had not observed exploitation in the wild as of October 21, 2026.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-109618 involves request cleanup treating partially initialized internal data as valid after an out-of-memory interruption, while CVE-2026-109619 involves reuse of stale internal state after its backing memory was freed. The broad PHP ecosystem may be exposed, including applications such as WordPress, Drupal, Magento, Shopware, WooCommerce, and Laravel, as well as sites hosted through cPanel or Plesk. Talos urges users to upgrade to available fixed releases, noting that PHP 8.1 and older are end of life and have no patch; partial mitigation measures exist, but no temporary control offers comprehensive protection.\u003c/p\u003e\n"},{"n":19,"title":"Software Supply Chain Attack on LiteLLM: Overview and Response Guidance","source":"flatt.tech","sourceColorIdx":0,"link":"https://flatt.tech/research/posts/litellm-pypi-supply-chain-attack/","time":"00:00","priority":"MUST READ","score":94,"tldr":"LiteLLM version 1.107.0 on PyPI was compromised with an infostealer that steals and exfiltrates extensive credentials and establishes persistent remote code execution. Anyone who installed this version should treat their environment as compromised, rotate affected secrets immediately, and use the safe version 1.106.2.","briefOverview":"\u003cp\u003eOn October 21, 2026, malicious code was injected into the PyPI package \u003ccode\u003elitellm\u003c/code\u003e. The article analyzes the malicious package using observations from the analysis infrastructure behind Takumi Guard. It warns that environments where \u003ccode\u003epip install litellm==1.107.0\u003c/code\u003e was run may be compromised, while \u003ccode\u003e1.106.2\u003c/code\u003e is identified as safe.\u003c/p\u003e\n\n\u003cp\u003eThe payload is an information-stealing program that collects secrets across 16 categories, including SSH private keys, cloud credentials, browser-stored passwords, AI development tool credentials, environment variables, Kubernetes service-account tokens, and LiteLLM database credentials. It encrypts the collected data with AES-256-CBC and RSA-OAEP before sending it via HTTP POST to \u003ccode\u003ehttp://www[.]litellm[.]dev/healthcheck\u003c/code\u003e. It also installs a persistent daemon that retrieves and executes remote code from a GitHub-configured command-and-control domain.\u003c/p\u003e\n\n\u003cp\u003eThe article advises potentially affected users to immediately rotate a broad range of credentials and private keys. These include SSH keys, AWS, GCP, and Azure credentials, Kubernetes and Docker configuration, npm and PyPI tokens, GitHub CLI tokens, browser passwords, AI-tool credentials, GPG private keys, and TLS private keys. The stated purpose is to help readers understand the incident and respond, although the article notes that some details may be inaccurate because speed was prioritized.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Malicious code was injected into the PyPI package LiteLLM on October 21, 2026.","Systems where `pip install litellm==1.107.0` was run may be compromised, while version 1.106.2 is identified as safe.","The malicious payload collects secrets from 16 categories, including SSH keys, cloud credentials, browser-stored passwords, environment variables, Kubernetes service account tokens, and LiteLLM database credentials.","The payload encrypts collected data and sends it by HTTP POST to a Lit
