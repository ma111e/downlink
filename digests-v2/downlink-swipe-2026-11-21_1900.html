<script type="application/json" id="dl-articles">[{"n":1,"title":"Rackspace Spot breach let hackers access customer Kubernetes secrets","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/rackspace-spot-breach-let-hackers-access-customer-kubernetes-secrets/","time":"22:59","priority":"SHOULD READ","score":82,"tldr":"Rackspace Spot was breached using leaked credentials, allowing attackers to impersonate users, deploy unauthorized Kubernetes pods, and access secrets that may contain passwords, API keys, and tokens. Affected customers should rotate exposed credentials and review logs from November 17 for misuse.","briefOverview":"\u003cp\u003eRackspace said attackers used leaked credentials to access parts of its Rackspace Spot cloud platform on November 17, 2026. The intruders could act as legitimate users in some customer organizations, create Kubernetes pods, read Kubernetes Secrets, and list nodes and volumes. Rackspace learned of the incident on November 18 after a customer report and confirmed that organization was affected the same day.\u003c/p\u003e\n\n\u003cp\u003eThe exposure could extend beyond the platform because Kubernetes Secrets may contain passwords, authentication tokens, and API keys for databases, cloud services, and other systems. Rackspace revoked affected tokens and sessions, removed unauthorized pods, rotated keys, strengthened controls and monitoring, and restored service on November 21 after disabling access during containment. Affected customers were instructed to replace API and refresh tokens, download new Kubernetes configuration files, rotate credentials in Secrets, review relevant logs from November 17, and check for the listed indicators, including IP address 23.224.79.106 and object prefixes i1, glm-, and probe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rackspace said an unauthorized party used leaked credentials to access parts of its Rackspace Spot cloud platform on November 17, 2026.","The attackers could act as legitimate users in some customer organizations, create Kubernetes pods, read Kubernetes Secrets, and list nodes and volumes.","Rackspace warned that any Secret in an affected user’s clusters, along with that user’s Spot API and refresh tokens, could have been exposed.","Rackspace revoked affected tokens and sessions, removed unauthorized pods, rotated keys, and restored the Spot service on November 21 after temporarily disabling access.","Affected customers were told to reissue tokens, replace automation refresh tokens, obtain new Kubernetes configuration files, rotate stored credentials, and examine relevant logs dating from November 17."],"insights":["The potential impact extended beyond the Rackspace Spot platform because Kubernetes Secrets can contain credentials for databases, cloud services, code repositories, storage, and third-party services.","Rackspace’s response required customers to replace several different forms of access material, including Spot API tokens, automation refresh tokens, Kubernetes configuration files, and credentials held in cluster Secrets.","The administration-console outage temporarily prevented customers from managing clusters and rotating potentially compromised credentials, illustrating the operational disruption caused by the containment effort.","Customers can use the reported IP address 23.224.79.106 and the suspicious Kubernetes object prefixes i1, glm-, and probe when reviewing activity associated with the incident."],"referencedReports":[],"body":"\u003cp\u003eRackspace said attackers used leaked credentials to access parts of its Rackspace Spot cloud platform on November 17, 2026. The intruders could act as legitimate users in some customer organizations, create Kubernetes pods, read Kubernetes Secrets, and list nodes and volumes. Rackspace learned of the incident on November 18 after a customer report and confirmed that organization was affected the same day.\u003c/p\u003e\n\n\u003cp\u003eThe exposure could extend beyond the platform because Kubernetes Secrets may contain passwords, authentication tokens, and API keys for databases, cloud services, and other systems. Rackspace revoked affected tokens and sessions, removed unauthorized pods, rotated keys, strengthened controls and monitoring, and restored service on November 21 after disabling access during containment. Affected customers were instructed to replace API and refresh tokens, download new Kubernetes configuration files, rotate credentials in Secrets, review relevant logs from November 17, and check for the listed indicators, including IP address 23.224.79.106 and object prefixes i1, glm-, and probe.\u003c/p\u003e\n"}]</script>
