<script type="application/json" id="dl-articles">[{"n":14,"title":"Authentication Bypass in the default configuration phpBB","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/authentication-bypass-phpbb-technical-writeup","time":"23:45","priority":"MUST READ","score":94,"tldr":"phpBB patched a critical default-configuration authentication bypass in version 3.3.17 that let unauthenticated attackers log in as any user, including admins, by abusing the login-link flow with the Apache auth provider. Site operators should update immediately and check logs for suspicious login_link requests using auth_provider=apache.","briefOverview":"\u003cp\u003eAikido found and reported a critical authentication bypass in phpBB, now known as CVE-2026-48611. The vulnerability works in phpBB’s default configuration and requires only a single unauthenticated request to log in to an arbitrary account. The article says that logging in to an administrator account could give an attacker control over the whole forum.\u003c/p\u003e\n\n\u003cp\u003eThe issue is tied to phpBB’s login-link feature, which is used when connecting external services like Google or GitHub OAuth to an existing forum account. An attacker can provide dummy \u003ccode\u003elogin_link_*\u003c/code\u003e data and control the \u003ccode\u003eauth_provider\u003c/code\u003e parameter so that phpBB uses the \u003ccode\u003eapache\u003c/code\u003e authentication provider. That provider trusts the Basic authentication username and returns a successful login for an existing active user without checking the password, because it is intended for setups where Apache handles authentication first.\u003c/p\u003e\n\n\u003cp\u003eAikido reported the issue through HackerOne on June 2, 2026, and phpBB staff triaged it in under 9 minutes. phpBB released version 3.3.17 with a patch four days later, and the article urges forum managers to update if they have not already. The article also recommends checking request logs for POST requests involving \u003ccode\u003emode=login_link\u003c/code\u003e, \u003ccode\u003eauth_provider=apache\u003c/code\u003e, and \u003ccode\u003elogin_link_*\u003c/code\u003e, including cases where key parameters are supplied in the POST body rather than the URL.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido reported a critical phpBB authentication bypass, now identified as CVE-2026-48611, that works in the default configuration and requires only a single unauthenticated request to log in to an arbitrary account.","The vulnerability is in phpBB’s login-link flow, where an attacker can provide dummy login_link data and control the auth_provider parameter to select the apache provider.","The apache authentication provider trusts the Basic authentication username and returns a successful login for an existing active user without checking the submitted password, because it is intended for deployments where Apache handles authentication first.","phpBB triaged the HackerOne report in under 9 minutes and released a patch in version 3.3.17 four days after the report.","The article recommends checking request logs for POST requests combining mode=login_link, auth_provider=apache, and login_link_* parameters, including cases where mode and auth_provider are supplied in the POST body."],"insights":["The bypass did not require a rare deployment choice or misconfiguration; the article emphasizes that it worked against phpBB’s default configuration by reaching an authentication provider that was not meant to be exposed through the login-link feature.","The vulnerable apache provider was not simply missing a password check by accident; it was designed to trust Apache-provided Basic authentication, but the login-link flow let the client supply that trusted identity directly.","Log detection based only on the URL query string can miss exploit attempts because phpBB lets mode and auth_provider values in the POST body take priority over GET parameters.","A single suspicious login_link_* query parameter can be an important detection clue even when the visible URL appears to show a normal login mode."],"referencedReports":[{"title":"phpBB 3.3.17 Release","url":"https://www.phpbb.com/community/viewtopic.php?t=2672170","publisher":"phpBB","context":"The article cites phpBB’s version 3.3.17 release as the patch that addressed the authentication bypass vulnerability.","category":"","primary":false}],"body":"\u003cp\u003eAikido found and reported a critical authentication bypass in phpBB, now known as CVE-2026-48611. The vulnerability works in phpBB’s default configuration and requires only a single unauthenticated request to log in to an arbitrary account. The article says that logging in to an administrator account could give an attacker control over the whole forum.\u003c/p\u003e\n\n\u003cp\u003eThe issue is tied to phpBB’s login-link feature, which is used when connecting external services like Google or GitHub OAuth to an existing forum account. An attacker can provide dummy \u003ccode\u003elogin_link_*\u003c/code\u003e data and control the \u003ccode\u003eauth_provider\u003c/code\u003e parameter so that phpBB uses the \u003ccode\u003eapache\u003c/code\u003e authentication provider. That provider trusts the Basic authentication username and returns a successful login for an existing active user without checking the password, because it is intended for setups where Apache handles authentication first.\u003c/p\u003e\n\n\u003cp\u003eAikido reported the issue through HackerOne on June 2, 2026, and phpBB staff triaged it in under 9 minutes. phpBB released version 3.3.17 with a patch four days later, and the article urges forum managers to update if they have not already. The article also recommends checking request logs for POST requests involving \u003ccode\u003emode=login_link\u003c/code\u003e, \u003ccode\u003eauth_provider=apache\u003c/code\u003e, and \u003ccode\u003elogin_link_*\u003c/code\u003e, including cases where key parameters are supplied in the POST body rather than the URL.\u003c/p\u003e\n"},{"n":15,"title":"Armored Likho digging a snake pit: inside the covert BusySnake Stealer campaign","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/","time":"10:00","priority":"MUST READ","score":94,"tldr":"Kaspersky uncovered an active Armored Likho phishing campaign targeting government and electric power organizations in Russia, Brazil, and Kazakhstan with a new Python infostealer called BusySnake Stealer. The malware uses AI-generated loaders, PyArmor obfuscation, browser credential and cookie theft, persistence via scheduled tasks, and built-in reverse SSH tunneling for stealthy access and data exfiltration.","briefOverview":"\u003cp\u003eKaspersky uncovered a new phishing campaign tied to a previously unknown APT group dubbed Armored Likho, also known as Eagle Werewolf based on circumstantial evidence. The campaign targets government agencies and the electric power sector, with confirmed victims in Russia, Kazakhstan, and Brazil. The attackers use spear-phishing emails with archive attachments themed as government notices, social programs, psychological tests, humanitarian aid applications, and similar lures.\u003c/p\u003e\n\n\u003cp\u003eThe campaign deploys a previously undocumented Python-based Windows infostealer named BusySnake Stealer. Initial infection uses EXE droppers or LNK files, including LNK files that leverage ZDI-CAN-25373 to conceal command-line content and trigger PowerShell-based downloaders. The first-stage malicious payloads contain traits that the researchers say strongly indicate LLM-generated code, including verbose comments and bullet-point emojis.\u003c/p\u003e\n\n\u003cp\u003eBusySnake Stealer is protected with PyArmor Pro 9.2.0 and can steal clipboard data, documents, screenshots, browser passwords, browser cookies, 2FA secrets, cryptocurrency wallet JSON files, and Telegram session data. It can also establish reverse SSH tunnels and use RustDesk-related remote control workflows, while maintaining persistence through scheduled tasks. A newer version uses the Windows Schedule.Service COM object for scheduled tasks, adds delayed execution, introduces task status tracking, and can execute Python scripts received from the C2 server directly in memory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky uncovered an active phishing campaign tied to the previously unknown APT group Armored Likho, also known as Eagle Werewolf based on circumstantial evidence, targeting government agencies and the electric power sector in Russia, Brazil, and Kazakhstan.","The campaign uses malicious archive attachments containing EXE droppers or LNK files, including LNK files that abuse ZDI-CAN-25373 to hide command-line content and execute PowerShell-based downloaders.","The primary payload is BusySnake Stealer, a previously undocumented Python-based infostealer protected with PyArmor Pro 9.2.0 and designed to run on Windows without opening a console window.","BusySnake Stealer can steal clipboard data, documents, screenshots, browser passwords, browser cookies, 2FA secrets, cryptocurrency wallet JSON files, and Telegram session data, and it can establish reverse SSH tunnels and interact with RustDesk for remote control.","A newer BusySnake Stealer version creates scheduled tasks through the Windows Schedule.Service COM object, adds delayed execution to bypass dynamic analysis, and introduces a task-management framework for commands and in-memory execution of Python scripts from the C2 server."],"insights":["Armored Likho’s first-stage payloads appear to be AI-generated, with verbose comments and emoji-style formatting that the researchers say blur the group’s usual tactics and complicate attribution.","BusySnake Stealer shows the group consolidating capabilities by integrating reverse SSH tunneling directly into the stealer, replacing functionality that was previously handled by the standalone Go2Tunnel tool.","The newer BusySnake Stealer version shifts persistence from direct schtasks usage to the Schedule.Service COM object, indicating an effort to make scheduled-task creation less detectable.","The malware’s ability to fetch and execute arbitrary Python scripts in memory after installing needed dependencies gives the operators a flexible way to add capabilities without writing script files to disk.","The campaign’s infrastructure included GitHub repositories used for payload hosting and rapid rotation, and researchers found early development builds and test samples in those repositories."],"referencedReports":[],"body":"\u003cp\u003eKaspersky uncovered a new phishing campaign tied to a previously unknown APT group dubbed Armored Likho, also known as Eagle Werewolf based on circumstantial evidence. The campaign targets government agencies and the electric power sector, with confirmed victims in Russia, Kazakhstan, and Brazil. The attackers use spear-phishing emails with archive attachments themed as government notices, social programs, psychological tests, humanitarian aid applications, and similar lures.\u003c/p\u003e\n\n\u003cp\u003eThe campaign deploys a previously undocumented Python-based Windows infostealer named BusySnake Stealer. Initial infection uses EXE droppers or LNK files, including LNK files that leverage ZDI-CAN-25373 to conceal command-line content and trigger PowerShell-based downloaders. The first-stage malicious payloads contain traits that the researchers say strongly indicate LLM-generated code, including verbose comments and bullet-point emojis.\u003c/p\u003e\n\n\u003cp\u003eBusySnake Stealer is protected with PyArmor Pro 9.2.0 and can steal clipboard data, documents, screenshots, browser passwords, browser cookies, 2FA secrets, cryptocurrency wallet JSON files, and Telegram session data. It can also establish reverse SSH tunnels and use RustDesk-related remote control workflows, while maintaining persistence through scheduled tasks. A newer version uses the Windows Schedule.Service COM object for scheduled tasks, adds delayed execution, introduces task status tracking, and can execute Python scripts received from the C2 server directly in memory.\u003c/p\u003e\n"},{"n":8,"title":"North Korea-Linked npm Packages Mimic Rollup Polyfills to Steal Developer Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/north-korea-linked-npm-packages-mimic.html","time":"16:07","priority":"MUST READ","score":92,"tldr":"North Korea-linked actors published malicious npm packages that impersonate Rollup polyfill tooling to infect developer machines, enable remote access, and steal credentials, browser data, crypto wallets, and project secrets. Developers who installed the named packages should remove them, assume compromise, and rotate exposed credentials.","briefOverview":"\u003cp\u003eThreat actors tied to North Korea have been linked by JFrog to malicious npm packages that masqueraded as Rollup polyfill tooling. The packages rollup-packages-polyfill-core and rollup-runtime-polyfill-core mimicked the legitimate rollup-plugin-polyfill-node project, including its description, repository metadata, and package shape. The campaign also involved quirky-token, react-icon-svgs, rollup-plugin-polyfill-connect, and swift-parse-stream, all of which have been removed from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe attack used a layered structure in which the lookalike packages installed second-stage packages that posed as SVG utilities. Those second-stage packages fetched a JSON object from JSONKeeper and executed JavaScript from its model field. The malware checked for cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure before contacting 216.126.236[.]244 to fetch an encrypted JavaScript payload.\u003c/p\u003e\n\n\u003cp\u003eLater payload stages enabled remote access, interactive terminal sessions, command execution, screenshot capture, process termination, mouse and keyboard control on Windows, browser and cryptocurrency wallet data theft, file collection, and periodic clipboard capture. JFrog said Rollup plugins are often loaded on developer workstations and CI jobs, where source code, npm tokens, Git credentials, cloud keys, SSH keys, browser data, and project secrets may be present. Users who installed the named packages were advised to remove them, assume compromise, rotate credentials, block malicious egress channels, and enable dependency scanning in CI/CD pipelines.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["JFrog linked North Korea-tied threat actors to malicious npm packages named rollup-packages-polyfill-core and rollup-runtime-polyfill-core that mimic the legitimate rollup-plugin-polyfill-node project.","The campaign also involved quirky-token, react-icon-svgs, rollup-plugin-polyfill-connect, and swift-parse-stream, all of which have been removed from the npm registry.","The first-stage packages concealed Base64-encoded npm install commands for second-stage packages, which fetched a JSON object from JSONKeeper and executed JavaScript from its model field.","The malware checked for cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure before fetching an encrypted JavaScript payload from 216.126.236[.]244.","Later payload stages enabled remote terminal sessions, command execution, screenshot capture, input control, browser and cryptocurrency wallet data theft, file collection, and periodic clipboard capture."],"insights":["The campaign used a layered package structure in which plausible-looking first-stage packages installed separate second-stage packages, which can make quick dependency reviews and registry-side scanning less likely to reveal the full behavior.","The malware specifically avoided cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure, indicating that testing suspicious packages only in such environments may miss the payload described in the article.","The file collector targeted editor history and configurations for tools including Visual Studio Code, Windsurf, Cursor, AWS, Azure, Google Gemini, Anthropic Claude, Foundry, SSH, and Zsh, showing that developer and AI tool artifacts were explicit collection targets.","The article notes repeated North Korea-linked use of Rollup polyfill impersonation, including a prior package named rollup-plugin-polyfill-route, making similarly named Rollup polyfill packages a particularly important area for scrutiny.","Several unrelated supply-chain campaigns in the article harvested overlapping secrets such as SSH keys, cloud credentials, npm tokens, Docker configurations, shell history, and wallet data, so affected users are advised to assume compromise and rotate credentials rather than only uninstall packages."],"referencedReports":[{"title":"Rollup Polyfill Masquerading","url":"https://research.jfrog.com/post/rollup-polyfill-masquerading/","publisher":"JFrog","context":"The article cites JFrog's technical write-up as the basis for details about malicious npm packages mimicking Rollup polyfill tooling.","category":"","primary":false},{"title":"Operation Navy Ghost: Pyrogram Telegram Supply Chain Attack","url":"https://checkmarx.com/zero-post/operation-navy-ghost-pyrogram-telegram-supplychain-attack/","publisher":"Checkmarx","context":"The article references Checkmarx's report on trojanized pyrogram forks that contained a hidden backdoor and exfiltrated command results via Telegram.","category":"","primary":false},{"title":"DeFi Infostealer: Fake Arbitrage Bot npm","url":"https://safedep.io/defi-infostealer-fake-arbitrage-bot-npm/","publisher":"SafeDep","context":"The article cites SafeDep's research on npm packages mimicking Polymarket tooling and mathematics libraries to deliver a JavaScript infostealer targeting DeFi developers.","category":"","primary":false},{"title":"MarketFront Dependency Confusion Campaign","url":"https://safedep.io/marketfront-dependency-confusion-campaign/","publisher":"SafeDep","context":"The article references SafeDep's analysis of @marketfront npm packages containing a postinstall credential harvester.","category":"","primary":false},{"title":"Credential Stealer \u0026 C2 Backdoor Disguised as Security Monitoring","url":"https://www.linkedin.com/pulse/credential-stealer-c2-backdoor-disguised-security-monitoring-chi-tran-opx2c/","publisher":"Chi Tran","context":"The article cites Chi Tran's analysis of the security-alerts-sdk Python package, which posed as a breach-monitoring tool while running a backdoor and stealing credentials.","category":"","primary":false},{"title":"Operation Friday Harvest: Coordinated npm Campaign Delivering Rust-Compiled ELF Binary","url":"https://www.linkedin.com/pulse/operation-friday-harvest-coordinated-npm-campaign-delivering-tran-lmjlc/","publisher":"Chi Tran","context":"The article references Chi Tran's report on 15 npm packages that used postinstall JavaScript to download and execute a Rust-compiled ELF binary hosted on GitHub.","category":"","primary":false},{"title":"Emitting More Than Events: 125K Downloads Malicious npm","url":"https://www.linkedin.com/pulse/emitting-more-than-events-125k-downloads-malicious-npm-chi-tran-h0bff/","publisher":"Chi Tran","context":"The article cites Chi Tran's analysis of the events-runtime npm package, which typosquatted events and conditionally spawned a cryptocurrency wallet stealer and command channel.","category":"","primary":false},{"title":"Clean npm, Dirty GitHub: Sneaky New Supply Chain Pattern","url":"https://www.linkedin.com/pulse/clean-npm-dirty-github-sneaky-new-supply-chain-pattern-chi-tran-l3sic/","publisher":"Chi Tran","context":"The article references Chi Tran's analysis of o3forms, which split malicious behavior between a benign npm package and a GitHub-pinned sub-dependency.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors tied to North Korea have been linked by JFrog to malicious npm packages that masqueraded as Rollup polyfill tooling. The packages rollup-packages-polyfill-core and rollup-runtime-polyfill-core mimicked the legitimate rollup-plugin-polyfill-node project, including its description, repository metadata, and package shape. The campaign also involved quirky-token, react-icon-svgs, rollup-plugin-polyfill-connect, and swift-parse-stream, all of which have been removed from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe attack used a layered structure in which the lookalike packages installed second-stage packages that posed as SVG utilities. Those second-stage packages fetched a JSON object from JSONKeeper and executed JavaScript from its model field. The malware checked for cloud development environments, sandboxes, serverless runtimes, and analysis infrastructure before contacting 216.126.236[.]244 to fetch an encrypted JavaScript payload.\u003c/p\u003e\n\n\u003cp\u003eLater payload stages enabled remote access, interactive terminal sessions, command execution, screenshot capture, process termination, mouse and keyboard control on Windows, browser and cryptocurrency wallet data theft, file collection, and periodic clipboard capture. JFrog said Rollup plugins are often loaded on developer workstations and CI jobs, where source code, npm tokens, Git credentials, cloud keys, SSH keys, browser data, and project secrets may be present. Users who installed the named packages were advised to remove them, assume compromise, rotate credentials, block malicious egress channels, and enable dependency scanning in CI/CD pipelines.\u003c/p\u003e\n"},{"n":12,"title":"Armored Likho Targets Government Agencies, Power Sector with BusySnake Stealer","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/armored-likho-targets-government.html","time":"13:36","priority":"MUST READ","score":92,"tldr":"Kaspersky says the previously undocumented Armored Likho threat actor is targeting government agencies and the electric power sector in Russia, Brazil, and Kazakhstan with BusySnake Stealer, a Python-based infostealer capable of credential theft, screenshots, browser cookie extraction, Telegram data theft, and reverse tunneling. The group’s tactics overlap with Eagle Werewolf and show growing sophistication through obfuscation, scheduled-task persistence, and integrated Go2Tunnel functionality.","briefOverview":"\u003cp\u003eA previously undocumented threat actor known as \u003cstrong\u003eArmored Likho\u003c/strong\u003e has been attributed to cyber attacks targeting government agencies and the electric power sector across Russia, Brazil, and Kazakhstan. Kaspersky said the group combines financially motivated activity against private individuals with targeted cyber espionage against organizations. The group’s toolkit includes obfuscated, modular remote access tools and information stealers designed to bypass dynamic analysis.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses spear-phishing emails with lures related to official government notices or social programs to distribute RAR archives containing EXE droppers. These droppers retrieve additional payloads from a GitHub repository, including a Python-based Windows information stealer called \u003cstrong\u003eBusySnake Stealer\u003c/strong\u003e. Alternate attack chains use Windows shortcut files that exploit \u003cstrong\u003eCVE-2025-9491\u003c/strong\u003e, a now-patched Windows LNK vulnerability, to trigger obfuscated PowerShell execution and launch the stealer.\u003c/p\u003e\n\n\u003cp\u003eBusySnake Stealer can communicate with a command-and-control server, steal clipboard data, enumerate files, upload documents, capture screenshots, log keystrokes, collect cryptocurrency wallet files, gather Telegram session and credential data, extract browser cookies and passwords, and establish reverse SSH tunnels using Go2Tunnel. Kaspersky also identified a newer BusySnake version with task-management features for tracking command status. The article says Armored Likho shows possible overlaps with BI.ZONE’s \u003cstrong\u003eEagle Werewolf\u003c/strong\u003e cluster, including similarities between BusySnake Stealer and AquilaRAT in task handling, scheduled-task persistence, and command-and-control communication endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky attributed cyber attacks targeting government agencies and the electric power sector in Russia, Brazil, and Kazakhstan to a previously undocumented threat actor called Armored Likho.","Armored Likho uses spear-phishing emails with government notice or social program lures to deliver RAR archives containing droppers that retrieve additional payloads, including BusySnake Stealer, from a GitHub repository.","BusySnake Stealer is a Python-based Windows information stealer that can steal clipboard data, enumerate files, upload user documents, capture screenshots, log keystrokes, collect cryptocurrency wallet files, gather Telegram data, extract browser cookies and passwords, and establish reverse SSH tunnels using Go2Tunnel.","Alternate attack chains use Windows shortcut files to exploit CVE-2025-9491, a now-patched Windows LNK vulnerability, to run an obfuscated PowerShell command and launch the Python stealer.","Kaspersky reported overlaps between Armored Likho and BI.ZONE’s Eagle Werewolf cluster, including similarities between BusySnake Stealer and AquilaRAT in command handling, scheduled-task persistence, and C2 communication endpoints."],"insights":["BusySnake’s reverse-tunneling capability has moved from the separate Go2Tunnel utility into the stealer itself, reducing the attacker’s dependence on standalone tools and making the malware more self-contained.","The newer BusySnake version includes a task-management framework that tracks command states such as SCHEDULED, IN_PROGRESS, SUCCEEDED, and FAILED, indicating the operators are improving control and reporting during intrusions.","The malware attempts to capture RustDesk credentials by prompting the victim to enter them and then taking a screenshot, showing that credential theft extends beyond browsers and files to remote-access software workflows.","Kaspersky noted signs that first-stage loaders and stagers may have been generated with assistance from AI tools, based on redundant comments and code blocks in the payloads.","The campaigns combine espionage against organizations with financially motivated theft from individuals, making Armored Likho’s activity broader than a single-purpose government-targeting operation."],"referencedReports":[{"title":"Armored Likho: APT with BusySnake stealer","url":"https://securelist.com/tr/armored-likho-apt-with-busysnake-stealer/120292/","publisher":"Kaspersky","context":"The article cites Kaspersky’s technical analysis as the main source for attribution, attack-chain details, and BusySnake Stealer capabilities.","category":"","primary":false}],"body":"\u003cp\u003eA previously undocumented threat actor known as \u003cstrong\u003eArmored Likho\u003c/strong\u003e has been attributed to cyber attacks targeting government agencies and the electric power sector across Russia, Brazil, and Kazakhstan. Kaspersky said the group combines financially motivated activity against private individuals with targeted cyber espionage against organizations. The group’s toolkit includes obfuscated, modular remote access tools and information stealers designed to bypass dynamic analysis.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses spear-phishing emails with lures related to official government notices or social programs to distribute RAR archives containing EXE droppers. These droppers retrieve additional payloads from a GitHub repository, including a Python-based Windows information stealer called \u003cstrong\u003eBusySnake Stealer\u003c/strong\u003e. Alternate attack chains use Windows shortcut files that exploit \u003cstrong\u003eCVE-2025-9491\u003c/strong\u003e, a now-patched Windows LNK vulnerability, to trigger obfuscated PowerShell execution and launch the stealer.\u003c/p\u003e\n\n\u003cp\u003eBusySnake Stealer can communicate with a command-and-control server, steal clipboard data, enumerate files, upload documents, capture screenshots, log keystrokes, collect cryptocurrency wallet files, gather Telegram session and credential data, extract browser cookies and passwords, and establish reverse SSH tunnels using Go2Tunnel. Kaspersky also identified a newer BusySnake version with task-management features for tracking command status. The article says Armored Likho shows possible overlaps with BI.ZONE’s \u003cstrong\u003eEagle Werewolf\u003c/strong\u003e cluster, including similarities between BusySnake Stealer and AquilaRAT in task handling, scheduled-task persistence, and command-and-control communication endpoints.\u003c/p\u003e\n"},{"n":10,"title":"New \"Bad Epoll\" Linux Kernel Flaw Lets Unprivileged Users Gain Root, Hits Android","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-bad-epoll-linux-kernel-flaw-lets.html","time":"19:40","priority":"SHOULD READ","score":88,"tldr":"A new Linux kernel flaw called Bad Epoll lets unprivileged users gain root on affected Linux 6.4+ systems and may also impact Android, with a fix now available. There is no workaround, so users and admins should apply the upstream patch or distribution backport as soon as possible.","briefOverview":"\u003cp\u003eA newly disclosed Linux kernel flaw called \u003cstrong\u003eBad Epoll\u003c/strong\u003e (CVE-2026-46242) can let an ordinary unprivileged user gain root access on affected systems. The article says it affects Linux desktops, servers, and Android, and that a fix is available. There is no sign it has been used in real attacks, and as of the article’s writing it is not on CISA’s Known Exploited Vulnerabilities list.\u003c/p\u003e\n\n\u003cp\u003eBad Epoll is a use-after-free bug in epoll, a standard Linux feature used by servers, network services, and web browsers to watch many files or network connections at once. The flaw occurs when two kernel cleanup paths try to clean up the same internal object at the same time, allowing memory corruption. Researcher Jaeyoung Chung found the bug, built a working exploit, and reported it through Google’s kernelCTF program.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exploit is difficult because the timing window is only about six machine instructions wide, but Chung’s exploit widens that window and reached root about 99% of the time on tested systems. Bad Epoll is notable because Chung says it can be triggered from inside Chrome’s renderer sandbox and can reach Android, which most Linux privilege bugs cannot. Epoll cannot be turned off, so the article advises applying upstream commit \u003cstrong\u003ea6dc643c6931\u003c/strong\u003e or installing distribution backports when available; kernels built on 6.4 or newer are affected unless fixed, while older 6.1-based kernels such as some Android phones including the Pixel 8 are not affected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bad Epoll, tracked as CVE-2026-46242, is a newly disclosed Linux kernel flaw that can let an unprivileged user gain root access on affected systems.","The flaw is a use-after-free bug in epoll where two kernel cleanup paths can collide, allowing memory corruption if an attacker wins a very small timing window.","Jaeyoung Chung found the flaw, built a working exploit, and reported it through Google's kernelCTF program, with tested systems reaching root about 99% of the time.","Kernels built on Linux 6.4 or newer are affected unless they already include the fix, while older 6.1-based kernels such as some Android phones including the Pixel 8 are not affected.","There is no workaround because epoll cannot be turned off, so users must apply upstream commit a6dc643c6931 or install their distribution's backport when available."],"insights":["Bad Epoll is especially concerning because Chung says it can be triggered from inside Chrome's renderer sandbox, which the article says blocks almost every other kernel bug.","The flaw demonstrates a detection gap because, after the related first bug is patched, Bad Epoll's memory error usually does not trigger KASAN, the kernel's main bug detector.","The article highlights that AI-assisted vulnerability discovery remains incomplete: Anthropic's Mythos reportedly found a nearby sibling flaw in the same code area but missed Bad Epoll.","Bad Epoll is harder to exploit than several recent Linux privilege flaws because it requires winning a race through a timing window of only about six machine instructions, rather than abusing a deterministic bug.","The affected epoll code is widely used by servers, network services, and web browsers, so the article says it cannot simply be disabled as a workaround."],"referencedReports":[{"title":"Bad Epoll","url":"https://github.com/J-jaeyoung/bad-epoll","publisher":"Jaeyoung Chung","context":"The article says full technical details of Bad Epoll are available in Chung's public writeup.","category":"","primary":false}],"body":"\u003cp\u003eA newly disclosed Linux kernel flaw called \u003cstrong\u003eBad Epoll\u003c/strong\u003e (CVE-2026-46242) can let an ordinary unprivileged user gain root access on affected systems. The article says it affects Linux desktops, servers, and Android, and that a fix is available. There is no sign it has been used in real attacks, and as of the article’s writing it is not on CISA’s Known Exploited Vulnerabilities list.\u003c/p\u003e\n\n\u003cp\u003eBad Epoll is a use-after-free bug in epoll, a standard Linux feature used by servers, network services, and web browsers to watch many files or network connections at once. The flaw occurs when two kernel cleanup paths try to clean up the same internal object at the same time, allowing memory corruption. Researcher Jaeyoung Chung found the bug, built a working exploit, and reported it through Google’s kernelCTF program.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exploit is difficult because the timing window is only about six machine instructions wide, but Chung’s exploit widens that window and reached root about 99% of the time on tested systems. Bad Epoll is notable because Chung says it can be triggered from inside Chrome’s renderer sandbox and can reach Android, which most Linux privilege bugs cannot. Epoll cannot be turned off, so the article advises applying upstream commit \u003cstrong\u003ea6dc643c6931\u003c/strong\u003e or installing distribution backports when available; kernels built on 6.4 or newer are affected unless fixed, while older 6.1-based kernels such as some Android phones including the Pixel 8 are not affected.\u003c/p\u003e\n"},{"n":6,"title":"Unpatched Flaws Disclosed in Filesystem Bundled Into Millions of Embedded Devices","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/unpatched-flaws-disclosed-in-filesystem.html","time":"20:19","priority":"SHOULD READ","score":85,"tldr":"runZero disclosed seven mostly unpatched FatFs vulnerabilities affecting millions of embedded devices that read FAT/exFAT media, with some flaws enabling memory corruption and possible code execution via malicious USB drives, SD cards, or update files. With no upstream fixes for the most serious bugs, device vendors must patch downstream and users should treat physical media ports and firmware update channels as exposed attack surfaces.","briefOverview":"\u003cp\u003eSecurity firm runZero disclosed seven vulnerabilities in FatFs, a small filesystem library that lets devices read and write FAT and exFAT formats used on USB drives and SD cards. FatFs is widely bundled into firmware for embedded devices such as security cameras, drones, industrial controllers, hardware crypto wallets, and devices built on real-time operating systems. On the worst-affected systems, a malicious USB drive, SD card, or update file can cause memory corruption and allow code execution.\u003c/p\u003e\n\n\u003cp\u003eThe highest-rated issues include CVE-2026-6682, an integer overflow during FAT32 mounting, CVE-2026-6687, an exFAT volume-label buffer overflow, and CVE-2026-6688, a long-filename issue affecting wrapper code around FatFs. Other flaws can corrupt data, crash or brick devices in update flows, leak leftover data from deleted files, or hang a device during mount. Only CVE-2026-6684, the malformed GPT partition table hang, is fixed upstream in FatFs R0.16.\u003c/p\u003e\n\n\u003cp\u003erunZero said it repeatedly tried to contact the FatFs maintainer and involved Japan\u0026rsquo;s JPCERT/CC coordination center, but received no response. The firm named affected platforms including Espressif ESP-IDF, STMicroelectronics STM32Cube, Zephyr, MicroPython, ArduPilot, RT-Thread, Mbed, Samsung TizenRT, and SWUpdate. As of runZero\u0026rsquo;s July 1 disclosure, no attacks using the bugs had been reported, but proof-of-concept disk images, a test harness, and a QEMU-based exploit example were publicly released.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["runZero disclosed seven vulnerabilities in FatFs, a small filesystem library used by embedded devices to read and write FAT and exFAT formats on USB drives and SD cards.","The most severe flaws can allow an attacker to use a malformed USB drive, SD card, or update file to corrupt memory and potentially run code on affected devices.","FatFs is bundled in firmware for devices including security cameras, drones, industrial controllers, hardware crypto wallets, and products built on real-time operating systems.","Only CVE-2026-6684, a malformed GPT partition table issue that can hang a device during mount, is fixed upstream in FatFs R0.16.","runZero said it could not reach the FatFs maintainer despite repeated attempts and named affected platforms including Espressif ESP-IDF, STMicroelectronics STM32Cube, Zephyr, MicroPython, ArduPilot, RT-Thread, Mbed, Samsung TizenRT, and SWUpdate."],"insights":["Some of the FatFs flaws can be reached through firmware update flows, so the risk is not limited to someone physically inserting a USB drive or SD card.","The long-filename issue may require fixes in wrapper code around FatFs rather than in FatFs itself, because many projects copy FatFs filename fields into fixed buffers.","Updating to FatFs R0.16 only addresses the malformed GPT partition table hang, leaving the memory-corruption issues for downstream vendors to patch independently.","runZero found these bugs in 2026 using an off-the-shelf AI-assisted fuzzing setup after a 2017 manual audit found little worth reporting, highlighting how easier bug discovery changes the disclosure risk.","runZero released proof-of-concept disk images, a test harness, and a QEMU-based exploit example even though no attacks had been reported as of the disclosure."],"referencedReports":[{"title":"FatFs vulnerabilities disclosure","url":"https://www.runzero.com/blog/fatfs-bugs/","publisher":"runZero","context":"The article is based on runZero's disclosure of seven FatFs vulnerabilities and cites the runZero write-up for details about impact and exploitability.","category":"","primary":false}],"body":"\u003cp\u003eSecurity firm runZero disclosed seven vulnerabilities in FatFs, a small filesystem library that lets devices read and write FAT and exFAT formats used on USB drives and SD cards. FatFs is widely bundled into firmware for embedded devices such as security cameras, drones, industrial controllers, hardware crypto wallets, and devices built on real-time operating systems. On the worst-affected systems, a malicious USB drive, SD card, or update file can cause memory corruption and allow code execution.\u003c/p\u003e\n\n\u003cp\u003eThe highest-rated issues include CVE-2026-6682, an integer overflow during FAT32 mounting, CVE-2026-6687, an exFAT volume-label buffer overflow, and CVE-2026-6688, a long-filename issue affecting wrapper code around FatFs. Other flaws can corrupt data, crash or brick devices in update flows, leak leftover data from deleted files, or hang a device during mount. Only CVE-2026-6684, the malformed GPT partition table hang, is fixed upstream in FatFs R0.16.\u003c/p\u003e\n\n\u003cp\u003erunZero said it repeatedly tried to contact the FatFs maintainer and involved Japan\u0026rsquo;s JPCERT/CC coordination center, but received no response. The firm named affected platforms including Espressif ESP-IDF, STMicroelectronics STM32Cube, Zephyr, MicroPython, ArduPilot, RT-Thread, Mbed, Samsung TizenRT, and SWUpdate. As of runZero\u0026rsquo;s July 1 disclosure, no attacks using the bugs had been reported, but proof-of-concept disk images, a test harness, and a QEMU-based exploit example were publicly released.\u003c/p\u003e\n"},{"n":2,"title":"ARToken PhaaS exposes EvilTokens' Microsoft 365 phishing toolkit","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/artoken-phaas-exposes-eviltokens-microsoft-365-phishing-toolkit/","time":"14:12","priority":"SHOULD READ","score":84,"tldr":"Cisco Talos uncovered ARToken, a phishing-as-a-service panel linked to EvilTokens that helps attackers compromise Microsoft 365 accounts through device code phishing, steal tokens, maintain persistent access, and automate BEC activity. The findings show EvilTokens affiliates have a broad toolkit for bypassing MFA and abusing Outlook, SharePoint, and OneDrive after account takeover.","briefOverview":"\u003cp\u003eCisco Talos researchers discovered a phishing-as-a-service platform called ARToken while investigating phishing infrastructure used in an incident response engagement. The platform includes a React-based management panel called ARToken Panel that exposed more than 80 API endpoints. Talos found multiple technical similarities suggesting ARToken is tied to the EvilTokens phishing platform, including identical Microsoft device code authentication API calls and the same primary refresh token endpoints documented in prior EvilTokens research.\u003c/p\u003e\n\n\u003cp\u003eARToken is designed to compromise Microsoft 365 accounts by stealing authentication tokens, establishing persistent access using Primary Refresh Tokens, and accessing Outlook mailboxes, SharePoint sites, and OneDrive files. The platform supports business email compromise activity by allowing attackers to send emails as compromised users, create inbox rules that forward or hide messages, monitor mailboxes for keywords, and download attachments. It also includes tools to deploy phishing infrastructure through Cloudflare Workers and operate as a multi-tenant service where affiliates manage campaigns through dedicated workspaces.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that EvilTokens focuses on Microsoft’s device code authentication workflow, where victims enter a legitimate Microsoft-issued code on Microsoft’s official device login page and authentication tokens are issued to the attacker. Because victims authenticate through Microsoft’s legitimate infrastructure, the attacks can bypass multi-factor authentication protections. Talos also found phishing emails tied to the platform that impersonated legitimate vendors in invoice-themed lures targeting accounts payable employees and displayed what appeared to be a legitimate SharePoint address while redirecting victims to an attacker-controlled Microsoft 365 workspace.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos researchers discovered a React-based management panel called ARToken Panel that exposed more than 80 API endpoints while investigating phishing infrastructure used in an incident response engagement.","Talos found multiple technical similarities suggesting ARToken is tied to the EvilTokens phishing platform, including identical Microsoft device code authentication API calls and the same primary refresh token API endpoints documented in prior EvilTokens research.","ARToken allows attackers to steal Microsoft 365 authentication tokens, establish persistent access using Primary Refresh Tokens, and access Outlook mailboxes, SharePoint sites, and OneDrive files.","The platform includes tools for business email compromise operations, such as sending emails as compromised users, creating inbox rules to forward or hide messages, monitoring mailboxes for keywords, and downloading email attachments.","Phishing emails associated with the platform impersonated legitimate vendors in invoice-themed lures targeting accounts payable employees and displayed what appeared to be a legitimate SharePoint address while redirecting victims to an attacker-controlled Microsoft 365 tenant."],"insights":["ARToken shows that EvilTokens-related activity is not limited to initial credential theft, because the affiliate panel includes post-compromise tools for mailbox monitoring, inbox rule manipulation, file access, and BEC automation.","The use of Microsoft’s legitimate device login page makes these phishing attacks harder to recognize, because victims enter the code on real Microsoft infrastructure while the resulting tokens are issued to the attacker.","The platform’s ability to refresh stolen tokens and elevate access to Primary Refresh Tokens indicates that a single successful device code phishing event can lead to persistent Microsoft 365 access beyond the initial login session.","Attackers using ARToken can make phishing links appear more trustworthy by showing what looks like a legitimate SharePoint address while actually sending victims to a look-alike tenant inside the attacker’s Microsoft 365 workspace.","ARToken’s Cloudflare Workers deployment model and multi-tenant workspace design suggest EvilTokens-style phishing is being operationalized for affiliates who can manage separate campaigns through a service-like platform."],"referencedReports":[{"title":"ARToken: Inside an EvilTokens affiliate panel targeting Microsoft 365","url":"https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/","publisher":"Cisco Talos","context":"The article is based on Talos' report analyzing the ARToken phishing-as-a-service panel and its links to EvilTokens.","category":"","primary":false},{"title":"New widespread EvilTokens kit: Device Code phishing-as-a-Service – Part 1","url":"https://www.sekoia.com/blog/new-widespread-eviltokens-kit-device-code-phishing-as-a-service-part-1","publisher":"Sekoia","context":"The article cites Sekoia's EvilTokens research as prior documentation of the platform's primary refresh token API endpoints and device code phishing activity.","category":"","primary":false},{"title":"EvilTokens: An AI-augmented phishing-as-a-service for automating BEC fraud – Part 2","url":"https://www.sekoia.com/blog/eviltokens-an-ai-augmented-phishing-as-a-service-for-automating-bec-fraud-part-2","publisher":"Sekoia","context":"The article references Sekoia's follow-up report describing EvilTokens' AI-driven workflow for mailbox ingestion and BEC campaign drafting.","category":"","primary":false},{"title":"AI-enabled device code phishing campaign – April 2026","url":"https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/","publisher":"Microsoft","context":"The article says Microsoft later warned about EvilTokens as device code phishing attacks increased.","category":"","primary":false}],"body":"\u003cp\u003eCisco Talos researchers discovered a phishing-as-a-service platform called ARToken while investigating phishing infrastructure used in an incident response engagement. The platform includes a React-based management panel called ARToken Panel that exposed more than 80 API endpoints. Talos found multiple technical similarities suggesting ARToken is tied to the EvilTokens phishing platform, including identical Microsoft device code authentication API calls and the same primary refresh token endpoints documented in prior EvilTokens research.\u003c/p\u003e\n\n\u003cp\u003eARToken is designed to compromise Microsoft 365 accounts by stealing authentication tokens, establishing persistent access using Primary Refresh Tokens, and accessing Outlook mailboxes, SharePoint sites, and OneDrive files. The platform supports business email compromise activity by allowing attackers to send emails as compromised users, create inbox rules that forward or hide messages, monitor mailboxes for keywords, and download attachments. It also includes tools to deploy phishing infrastructure through Cloudflare Workers and operate as a multi-tenant service where affiliates manage campaigns through dedicated workspaces.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that EvilTokens focuses on Microsoft’s device code authentication workflow, where victims enter a legitimate Microsoft-issued code on Microsoft’s official device login page and authentication tokens are issued to the attacker. Because victims authenticate through Microsoft’s legitimate infrastructure, the attacks can bypass multi-factor authentication protections. Talos also found phishing emails tied to the platform that impersonated legitimate vendors in invoice-themed lures targeting accounts payable employees and displayed what appeared to be a legitimate SharePoint address while redirecting victims to an attacker-controlled Microsoft 365 workspace.\u003c/p\u003e\n"},{"n":4,"title":"NetNut proxy network disrupted, 2 million infected devices cut off","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/netnut-proxy-network-disrupted-2-million-infected-devices-cut-off/","time":"17:50","priority":"SHOULD READ","score":84,"tldr":"Google, the FBI, and industry partners disrupted NetNut, a major residential proxy botnet that routed malicious traffic through at least 2 million compromised Android devices, smart TVs, and streaming boxes. The operation seized domains, cut off command-and-control infrastructure, and disabled infected apps via Google Play Protect.","briefOverview":"\u003cp\u003eA joint operation involving Google disrupted NetNut, also known as Popa, a residential proxy network that gave access to millions of compromised Android devices, smart TVs, and streaming boxes. Google Threat Intelligence Group estimated that NetNut controlled at least 2 million infected devices globally. The operation included Google, the FBI, Lumen Technologies, The Shadowserver Foundation, and other industry partners.\u003c/p\u003e\n\n\u003cp\u003eNetNut allowed cybercriminals and espionage groups to hide behind legitimate home internet addresses when launching attacks. Google said it observed 316 distinct threat clusters using suspected NetNut exit nodes in one week last month, including cybercriminal and espionage groups. Threat actors used NetNut to access their own infrastructure, conduct password-spraying attacks, and reach victim environments.\u003c/p\u003e\n\n\u003cp\u003eGoogle disabled accounts and services on its infrastructure that NetNut operators used for malware command-and-control, blocking access to critical backend infrastructure. The FBI took down domains used by the service, including netnut.com. Google also warned users and disabled infected applications using Google Play Protect, and shared technical details about NetNut SDKs and backend infrastructure with platform providers, law enforcement agencies, and cybersecurity researchers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A joint operation involving Google disrupted NetNut, also known as Popa, a residential proxy network estimated to control at least 2 million compromised devices globally, including Android devices, smart TVs, and streaming boxes.","Google said NetNut was powered by trojanized applications and botnets such as Badbox 2.0 that package proxy plugins.","The disruption involved Google, the FBI, Lumen Technologies, The Shadowserver Foundation, and other industry partners, and the FBI took down domains including netnut.com.","Google observed 316 distinct threat clusters using suspected NetNut exit nodes in one week last month, including cybercriminal and espionage groups.","Google disabled accounts and services used by NetNut operators for command-and-control infrastructure and protected users by warning them and disabling infected applications through Google Play Protect."],"insights":["NetNut’s disruption could affect many other residential proxy services because Google said the network has a reseller program that allows whitelabeling and fuels many popular proxy offerings.","Taking down one residential proxy service may not fully remove the capacity from the ecosystem because operators often buy replacement capacity from competing providers and become resellers themselves.","Consumer devices can become part of these networks not only through apps users install, but also through malware that is pre-installed before purchase.","The real-world impact on infected users can include their home internet addresses being flagged as suspicious or blocked by internet service providers or online services, even if they were unaware their devices were being used."],"referencedReports":[{"title":"Google continued disruption of residential proxy networks","url":"http://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks","publisher":"Google Threat Intelligence Group","context":"The article cites GTIG’s linked analysis for observations about threat clusters using suspected NetNut exit nodes and details of the disruption effort.","category":"","primary":false}],"body":"\u003cp\u003eA joint operation involving Google disrupted NetNut, also known as Popa, a residential proxy network that gave access to millions of compromised Android devices, smart TVs, and streaming boxes. Google Threat Intelligence Group estimated that NetNut controlled at least 2 million infected devices globally. The operation included Google, the FBI, Lumen Technologies, The Shadowserver Foundation, and other industry partners.\u003c/p\u003e\n\n\u003cp\u003eNetNut allowed cybercriminals and espionage groups to hide behind legitimate home internet addresses when launching attacks. Google said it observed 316 distinct threat clusters using suspected NetNut exit nodes in one week last month, including cybercriminal and espionage groups. Threat actors used NetNut to access their own infrastructure, conduct password-spraying attacks, and reach victim environments.\u003c/p\u003e\n\n\u003cp\u003eGoogle disabled accounts and services on its infrastructure that NetNut operators used for malware command-and-control, blocking access to critical backend infrastructure. The FBI took down domains used by the service, including netnut.com. Google also warned users and disabled infected applications using Google Play Protect, and shared technical details about NetNut SDKs and backend infrastructure with platform providers, law enforcement agencies, and cybersecurity researchers.\u003c/p\u003e\n"},{"n":9,"title":"European Parliament Member Investigating Spyware Was Hacked With Pegasus","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/european-parliament-member.html","time":"11:05","priority":"SHOULD READ","score":84,"tldr":"Citizen Lab found that former European Parliament member Stelios Kouloglou was repeatedly infected with NSO Group’s Pegasus spyware while serving on the PEGA committee investigating spyware abuse. The attacks may have exposed confidential committee work and suggest a Pegasus operator licensed to target across multiple EU countries.","briefOverview":"\u003cp\u003eCitizen Lab reported that former Member of the European Parliament Stelios Kouloglou had his mobile device repeatedly hacked with Pegasus spyware while he served on the PEGA Committee, which was tasked with investigating the use of Pegasus and similar surveillance tools in the European Union. The infections have not been attributed to a particular government, and Citizen Lab said there is no evidence that the Greek government was behind the activity. Researchers said attackers could have had access to confidential documents and committee deliberations.\u003c/p\u003e\n\n\u003cp\u003eForensic analysis of Kouloglou’s iPhone found compromises on or around October 21, 2022, and again on March 6 and 7, 2023, while the device was running iOS 15.5. Citizen Lab assessed that the attacks used PWNYOURHOME, a zero-click exploit in Apple’s HomeKit software that Apple addressed in iOS 16.3.1. The first infection overlapped with a previous campaign targeting Russian and Belarusian-speaking exiled journalists and activists in Europe, and Citizen Lab linked the cases through the same email address, rauharepo888@gmail.com.\u003c/p\u003e\n\n\u003cp\u003eThe March 2023 activity coincided with intense discussions around the PEGA Committee’s final drafting process and hearings, two months before the adoption of the first PEGA Committee report. Citizen Lab said the overlap suggests a Pegasus customer with authorization to spy in multiple European countries was likely responsible, based on its understanding of NSO Group licensing. The findings add to concerns that commercial surveillance tools marketed for fighting serious crimes are being used to monitor journalists, lawmakers, dissidents, and critics.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citizen Lab reported that former Member of the European Parliament Stelios Kouloglou had his mobile device repeatedly hacked with Pegasus spyware while serving on the PEGA Committee investigating the use of Pegasus and similar surveillance tools.","Forensic analysis found Pegasus compromises on or around October 21, 2022, and again on March 6 and 7, 2023, while Kouloglou’s device was running iOS 15.5.","Citizen Lab assessed that the attacks used the PWNYOURHOME zero-click exploit in Apple’s HomeKit software, which Apple addressed in iOS 16.3.1.","Citizen Lab said the infections have not been attributed to a particular government and that there is no evidence the Greek government was behind the activity.","Citizen Lab identified an overlap between the first infection and a previous campaign targeting Russian and Belarusian-speaking exiled journalists and activists in Europe through the same email address, rauharepo888@gmail.com."],"insights":["The same HomeKit-related Pegasus exploit was observed in both the October 2022 and March 2023 infections, and Kouloglou’s phone was still running iOS 15.5 even though Apple later addressed the issue in iOS 16.3.1.","The October 2022 infection overlapped with a Pegasus campaign against Russian and Belarusian-speaking exiled journalists and activists in Europe, linked by the same HomeKit email address used in the infection infrastructure.","Citizen Lab said the shared infrastructure likely points to a Pegasus customer authorized to conduct infections in multiple European Union jurisdictions, which narrows the set of possible operators under NSO Group licensing practices.","The March 2023 infection occurred during the PEGA Committee’s final drafting process and hearings, making the timing especially sensitive because confidential committee deliberations may have been exposed.","Kouloglou received Apple threat notifications on three separate dates after the identified infections, showing that mercenary spyware targeting alerts can continue well beyond the first confirmed compromise."],"referencedReports":[{"title":"Member of Committee Investigating Spyware Hacked with Pegasus","url":"https://citizenlab.ca/research/member-of-committee-investigating-spyware-hacked-with-pegasus/","publisher":"Citizen Lab","context":"The article is based on Citizen Lab’s forensic analysis finding that Stelios Kouloglou’s device was repeatedly compromised with Pegasus while he served on the PEGA Committee.","category":"","primary":false},{"title":"First PEGA Committee report","url":"https://www.europarl.europa.eu/RegData/etudes/ATAG/2023/747923/EPRS_ATA%282023%29747923_EN.pdf","publisher":"European Parliament","context":"The article references the report to note that the March 2023 infection occurred two months before its adoption.","category":"","primary":false},{"title":"Uncovering Global Telecom Exploitation by Covert Surveillance Actors","url":"https://citizenlab.ca/research/uncovering-global-telecom-exploitation-by-covert-surveillance-actors/","publisher":"Citizen Lab","context":"The article cites this Citizen Lab research as a recent example of surveillance campaigns abusing global telecom infrastructure to track people’s locations.","category":"","primary":false}],"body":"\u003cp\u003eCitizen Lab reported that former Member of the European Parliament Stelios Kouloglou had his mobile device repeatedly hacked with Pegasus spyware while he served on the PEGA Committee, which was tasked with investigating the use of Pegasus and similar surveillance tools in the European Union. The infections have not been attributed to a particular government, and Citizen Lab said there is no evidence that the Greek government was behind the activity. Researchers said attackers could have had access to confidential documents and committee deliberations.\u003c/p\u003e\n\n\u003cp\u003eForensic analysis of Kouloglou’s iPhone found compromises on or around October 21, 2022, and again on March 6 and 7, 2023, while the device was running iOS 15.5. Citizen Lab assessed that the attacks used PWNYOURHOME, a zero-click exploit in Apple’s HomeKit software that Apple addressed in iOS 16.3.1. The first infection overlapped with a previous campaign targeting Russian and Belarusian-speaking exiled journalists and activists in Europe, and Citizen Lab linked the cases through the same email address, rauharepo888@gmail.com.\u003c/p\u003e\n\n\u003cp\u003eThe March 2023 activity coincided with intense discussions around the PEGA Committee’s final drafting process and hearings, two months before the adoption of the first PEGA Committee report. Citizen Lab said the overlap suggests a Pegasus customer with authorization to spy in multiple European countries was likely responsible, based on its understanding of NSO Group licensing. The findings add to concerns that commercial surveillance tools marketed for fighting serious crimes are being used to monitor journalists, lawmakers, dissidents, and critics.\u003c/p\u003e\n"},{"n":11,"title":"New Avalon Malware Framework Packs CrownX Ransomware Capabilities","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-avalon-malware-framework-packs.html","time":"18:55","priority":"SHOULD READ","score":84,"tldr":"Researchers found a new modular malware framework called Avalon that uses a phishing chain to steal credentials, evade defenses, move laterally, disrupt recovery, and deploy its CrownX ransomware component. The report also highlights a broader trend of AI lowering the barrier for ransomware and malware development, including agentic and LLM-assisted attacks.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered a previously undocumented modular malware framework called \u003cstrong\u003eAvalon\u003c/strong\u003e that is distributed through a multi-stage phishing chain. The attack begins with a spoofed legal document email that directs recipients to a password-protected Proton Drive archive. Avalon combines credential collection, lateral movement, remote access, recovery disruption, and ransomware execution, with its ransomware component internally named \u003cstrong\u003eCrownX\u003c/strong\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe phishing chain uses malicious content embedded inside an ISO image rather than attached directly to the email, which the researchers said reduces the likelihood of detection at the email layer. A document-themed Windows Shortcut inside the mounted image launches an MSBuild project, which loads an embedded .NET assembly, interferes with Event Tracing for Windows, and downloads a next-stage payload over HTTPS to launch Avalon. The framework includes defense evasion methods aimed at tools associated with Microsoft Defender, SentinelOne, CrowdStrike, Sophos, Elastic Endpoint, FortiEDR, ESET, McAfee, and Bitdefender.\u003c/p\u003e\n\n\u003cp\u003eAvalon can harvest browser data, cryptocurrency wallet information, communications app data, Windows Credential Manager data, SSH known hosts, saved RDP connections, Wi-Fi profiles, and Group Policy Preferences cpassword artifacts. It can exfiltrate data to a remote server, poll that server for commands, encrypt business and infrastructure-related files, delete shadow copies, terminate recovery services, remove artifacts, and interact directly with disk structures. The article says Avalon shows signs of AI-assisted development and connects the findings to other reports of LLM-driven ransomware and malware operations that lower the skill required to conduct attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers discovered a previously undocumented modular malware framework called Avalon that is distributed through a multi-stage phishing chain using a spoofed legal document email and a password-protected Proton Drive archive.","Avalon combines credential collection, lateral movement, remote access, recovery disruption, and ransomware execution, with its ransomware component internally named CrownX.","The attack chain uses a Windows Shortcut inside an ISO image to launch an MSBuild project, which loads an embedded .NET assembly, interferes with Event Tracing for Windows, and downloads a next-stage payload over HTTPS to launch Avalon.","Avalon includes defense evasion capabilities aimed at security tools associated with Microsoft Defender, SentinelOne, CrowdStrike, Sophos, Elastic Endpoint, FortiEDR, ESET, McAfee, and Bitdefender.","The article says Avalon shows signs of AI-assisted development and presents this as evidence that AI can lower the barrier to creating malware and ransomware tools."],"insights":["Avalon’s use of a password-protected Proton Drive archive, an ISO image, a Windows Shortcut, MSBuild, and in-memory payload retrieval shows that the campaign is designed to avoid detection at multiple stages rather than relying only on the final ransomware payload.","The article emphasizes that Avalon’s broad feature set should not be treated as proof of a highly mature operator, because researchers observed signs of AI-assisted development and poor operational security.","CrownX appears only after Avalon has already stolen credentials, established command-and-control communications, prepared lateral movement paths, and weakened local recovery, meaning the ransom note may represent a late-stage symptom rather than the full scope of compromise.","The reported agentic ransomware case involving JADEPUFFER shows an LLM-driven operation adapting and retrying actions in real time after exploiting CVE-2025-3248 in an internet-facing Langflow instance.","The Telegram-and-LLM malware described by Unit 42 replaces shell-command knowledge with plain-language operator instructions, showing how public LLM APIs can turn natural language messages into commands executed on a victim system."],"referencedReports":[{"title":"Avalon’s Path: From Legal Lure to CrownX Ransom Capabilities","url":"https://blackpointcyber.com/blog/avalons-path-from-legal-lure-to-crownx-ransom-capabilities/","publisher":"Blackpoint Cyber","context":"The article cites Blackpoint Cyber researchers as the source for the technical findings on Avalon’s phishing chain, defense evasion, credential theft, and CrownX ransomware capabilities.","category":"","primary":false},{"title":"Codeless attack in LLM-driven operations via Telegram","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-06-17-Codeless-attack-in-LLM-driven-operations-via-Telegram.txt","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42’s analysis of malware that uses a Telegram bot and a public LLM API to translate plain-language operator instructions into shell commands.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered a previously undocumented modular malware framework called \u003cstrong\u003eAvalon\u003c/strong\u003e that is distributed through a multi-stage phishing chain. The attack begins with a spoofed legal document email that directs recipients to a password-protected Proton Drive archive. Avalon combines credential collection, lateral movement, remote access, recovery disruption, and ransomware execution, with its ransomware component internally named \u003cstrong\u003eCrownX\u003c/strong\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe phishing chain uses malicious content embedded inside an ISO image rather than attached directly to the email, which the researchers said reduces the likelihood of detection at the email layer. A document-themed Windows Shortcut inside the mounted image launches an MSBuild project, which loads an embedded .NET assembly, interferes with Event Tracing for Windows, and downloads a next-stage payload over HTTPS to launch Avalon. The framework includes defense evasion methods aimed at tools associated with Microsoft Defender, SentinelOne, CrowdStrike, Sophos, Elastic Endpoint, FortiEDR, ESET, McAfee, and Bitdefender.\u003c/p\u003e\n\n\u003cp\u003eAvalon can harvest browser data, cryptocurrency wallet information, communications app data, Windows Credential Manager data, SSH known hosts, saved RDP connections, Wi-Fi profiles, and Group Policy Preferences cpassword artifacts. It can exfiltrate data to a remote server, poll that server for commands, encrypt business and infrastructure-related files, delete shadow copies, terminate recovery services, remove artifacts, and interact directly with disk structures. The article says Avalon shows signs of AI-assisted development and connects the findings to other reports of LLM-driven ransomware and malware operations that lower the skill required to conduct attacks.\u003c/p\u003e\n"},{"n":5,"title":"Spyware found on phone of European Parliament member probing it","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/pegasus-spyware-european-parliament-pega-committee-member","time":"05:00","priority":"SHOULD READ","score":82,"tldr":"Citizen Lab says former European Parliament member Stelios Kouloglou was infected with Pegasus spyware while serving on the committee investigating spyware abuse, including during key periods of its work. Researchers linked the targeting to the same Pegasus operator behind attacks on Russian and Belarusian journalists and opposition figures, underscoring concerns that commercial spyware is being used against democratic oversight.","briefOverview":"\u003cp\u003eCitizen Lab reported that the phone of former European Parliament member Stelios Kouloglou was infected with Pegasus spyware in October 2022 and again in March 2023. At the time, Kouloglou was serving on the PEGA Committee, which was investigating misuse of commercial spyware and preparing recommendations for addressing abuse in Europe. Kouloglou, also a longtime investigative reporter, told Recorded Future News he believes the Greek government was responsible, but Citizen Lab said it has no indications that this is true.\u003c/p\u003e\n\n\u003cp\u003eThe infections occurred during sensitive periods for the PEGA Committee, including less than a week before hearings and as members prepared a draft report, and later during intense discussions about the final report. Hannah Neumann, a German Green Party representative and PEGA Committee negotiator, said the incident showed disregard for parliamentarians’ scrutiny role and for European democracy. The committee released recommendations in May 2023, but the article says the European Commission has largely ignored them.\u003c/p\u003e\n\n\u003cp\u003ePegasus is described in the article as powerful zero-click spyware, and Citizen Lab linked the Kouloglou incidents to attacks on seven Russian and Belarusian-speaking journalists and opposition figures between August 2020 and January 2023. Citizen Lab said the same email used against Kouloglou was also deployed in those attacks, and that targeting emails are unique to specific operators. Kouloglou brought his phone to Citizen Lab in May 2026, and researchers found evidence that he had received three Apple threat notifications about potential spyware, though he said he never saw them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citizen Lab reported that former European Parliament member Stelios Kouloglou’s phone was infected with Pegasus spyware in October 2022 and again in March 2023 while he served on the PEGA Committee investigating spyware misuse.","The PEGA Committee was working on recommendations to address abuse of commercial spyware in Europe when the infections occurred, and it released those recommendations in May 2023.","Citizen Lab believes the same Pegasus customer was responsible for the Kouloglou infections and for attacks on seven Russian and Belarusian-speaking journalists and opposition figures between August 2020 and January 2023.","Kouloglou told Recorded Future News he believes the Greek government is responsible for the hacks, but Citizen Lab said it has no indications that this is true.","Hannah Neumann, a Green Party representative from Germany and PEGA Committee negotiator, said spying on a member of the European Parliament while he was investigating spyware abuse showed disregard for European democracy."],"insights":["The timing of both infections was especially sensitive because they occurred shortly before major PEGA Committee hearings and during intense discussions over the committee’s draft and final spyware reports.","Citizen Lab’s finding that the same targeting email was used in both Kouloglou’s case and the Russian and Belarusian cases provides a concrete operational link between otherwise separate spyware campaigns.","Kouloglou had received three Apple threat notifications about possible spyware in recent years but said he never saw them, showing that even official warnings may fail to reach or alert intended targets.","The reported operator appears to have had Pegasus licensing that allowed targeting in multiple countries, which Citizen Lab said narrows the pool of possible government customers.","The European Commission’s lack of action on the PEGA Committee’s May 2023 recommendations is presented by multiple cited experts and politicians as a continuing policy failure despite direct evidence of spyware use against a committee member."],"referencedReports":[{"title":"Member of Committee Investigating Spyware Hacked with Pegasus","url":"https://citizenlab.ca/research/member-of-committee-investigating-spyware-hacked-with-pegasus/","publisher":"Citizen Lab","context":"The article is based on Citizen Lab’s report asserting that Stelios Kouloglou’s phone was infected with Pegasus spyware in October 2022 and March 2023.","category":"","primary":false},{"title":"Pegasus Spyware Targeted Russian and Belarusian-speaking Opposition and Media in Europe","url":"https://citizenlab.ca/research/pegasus-russian-belarusian-speaking-opposition-media-europe/","publisher":"Citizen Lab","context":"The article cites this May 2024 Citizen Lab report to link the Kouloglou infections to earlier spyware attacks on Russian and Belarusian-speaking journalists and opposition figures.","category":"","primary":false}],"body":"\u003cp\u003eCitizen Lab reported that the phone of former European Parliament member Stelios Kouloglou was infected with Pegasus spyware in October 2022 and again in March 2023. At the time, Kouloglou was serving on the PEGA Committee, which was investigating misuse of commercial spyware and preparing recommendations for addressing abuse in Europe. Kouloglou, also a longtime investigative reporter, told Recorded Future News he believes the Greek government was responsible, but Citizen Lab said it has no indications that this is true.\u003c/p\u003e\n\n\u003cp\u003eThe infections occurred during sensitive periods for the PEGA Committee, including less than a week before hearings and as members prepared a draft report, and later during intense discussions about the final report. Hannah Neumann, a German Green Party representative and PEGA Committee negotiator, said the incident showed disregard for parliamentarians’ scrutiny role and for European democracy. The committee released recommendations in May 2023, but the article says the European Commission has largely ignored them.\u003c/p\u003e\n\n\u003cp\u003ePegasus is described in the article as powerful zero-click spyware, and Citizen Lab linked the Kouloglou incidents to attacks on seven Russian and Belarusian-speaking journalists and opposition figures between August 2020 and January 2023. Citizen Lab said the same email used against Kouloglou was also deployed in those attacks, and that targeting emails are unique to specific operators. Kouloglou brought his phone to Citizen Lab in May 2026, and researchers found evidence that he had received three Apple threat notifications about potential spyware, though he said he never saw them.\u003c/p\u003e\n"},{"n":7,"title":"PamStealer Uses Fake Maccy Sites and PAM Checks to Steal Mac Login Passwords","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/pamstealer-uses-fake-maccy-sites-and.html","time":"08:03","priority":"SHOULD READ","score":82,"tldr":"Researchers found a new macOS infostealer, PamStealer, spread through fake Maccy websites that tricks users into running a malicious AppleScript and then steals passwords, browser data, crypto wallet data, iCloud Keychain content, and clipboard contents. Its key tactic is validating the victim’s macOS login password locally through PAM before exfiltrating data, making the credential theft more reliable and stealthy.","briefOverview":"\u003cp\u003eCybersecurity researchers at Jamf Threat Labs have identified a new macOS information stealer called \u003cstrong\u003ePamStealer\u003c/strong\u003e. The malware is distributed as a compiled AppleScript file that impersonates Maccy, a legitimate open-source clipboard manager. It is delivered through a lookalike website, \u003ccode\u003emaccyapp[.]com\u003c/code\u003e, that mimics the official Maccy site, \u003ccode\u003emaccy[.]app\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003ePamStealer uses a two-stage infection chain in which an AppleScript inside a disk image downloads a Rust-based second-stage payload. The AppleScript includes environment checks and only continues after fingerprinting the host, including CPU architecture, locale, keyboard layout, and time zone. It avoids Intel-based Macs, sandboxed or analysis environments, and systems whose regional settings resolve to several Eastern European countries.\u003c/p\u003e\n\n\u003cp\u003eThe Rust-based payload can steal data from web browsers, cryptocurrency wallet extensions, iCloud Keychain, and clipboard content, and it exfiltrates encrypted data to attacker-controlled infrastructure. It also shows a native password prompt to capture the victim’s macOS login password and validates the entered password through the PAM API, repeating the prompt until the correct password is supplied. After stealing the password and setting up persistence, it displays a fake message claiming Maccy is damaged a
