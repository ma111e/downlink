<script type="application/json" id="dl-articles">[{"n":3,"title":"SonicWall warns of new SSL-VPN MFA bypass flaw exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sonicwall-warns-of-new-ssl-vpn-mfa-bypass-flaw-exploited-in-attacks/","time":"00:00","priority":"MUST READ","score":94,"tldr":"SonicWall has patched an actively exploited SonicOS SSL-VPN flaw, CVE-2026-19868, that can let attackers with alternate valid credentials bypass SAML-enforced MFA. Organizations using affected Gen7 or Gen8 firewalls should upgrade immediately, as no workaround is available.","briefOverview":"\u003cp\u003eSonicWall released updates for seven SonicOS vulnerabilities, including CVE-2026-19868, an SSL-VPN authentication-bypass issue reported as exploited in attacks. The flaw affects SSL-VPN services configured to use SAML authentication and has a CVSS score of 7.1. SonicWall urged customers to upgrade promptly, and CISA added the flaw to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-19868 can allow someone with valid credentials for an alternate authentication method to bypass SAML controls, potentially including SAML-enforced multi-factor authentication. The affected releases are SonicOS Gen7 7.3.3-7015 and earlier and Gen8 8.2.2-8015 and earlier; fixes are available in versions 7.3.4-7013 and 8.2.3-8015. The update also addresses six other flaws, including two management-interface issues rated 8.8 and pre-authentication buffer overflows that could cause denial-of-service conditions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SonicWall released updates for seven SonicOS vulnerabilities, including CVE-2026-19868, an SSL-VPN flaw reported as exploited in attacks.","CVE-2026-19868 can allow attackers with valid credentials for an alternate authentication method to bypass SAML controls, including SAML-enforced multi-factor authentication.","CISA added CVE-2026-19868 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal civilian executive branch agencies to secure affected systems by November 20, 2026.","The issues affect SonicOS Gen7 versions 7.3.3-7015 and earlier and Gen8 versions 8.2.2-8015 and earlier; SonicWall fixed them in versions 7.3.4-7013 and 8.2.3-8015.","SonicWall said no workarounds are available and urged customers to upgrade as soon as possible."],"insights":["The actively exploited flaw is limited to SonicOS SSL-VPN deployments configured for SAML authentication, so this configuration is the relevant exposure condition rather than SSL-VPN use alone.","The bypass requires valid credentials through an alternate authentication method, meaning the reported issue circumvents SAML protections rather than providing unauthenticated access.","The same update also addresses two 8.8-severity management-interface flaws that can permit unauthorized operations by unauthenticated attackers under specific conditions.","SonicWall provides no workaround, making upgrades to SonicOS 7.3.4-7013 or 8.2.3-8015 the stated mitigation path.","The alert follows multiple reported 2026 exploitation campaigns targeting SonicWall SMA1000 remote-access appliances, including incidents involving zero-days and remote code execution."],"referencedReports":[{"title":"SonicWall Security Advisory SNWLID-2026-0014","url":"https://psirt.global.sonicwall.com/vuln-detail/SNWLID-2026-0014","publisher":"sonicwall","context":"SonicWall's advisory warns that CVE-2026-19868 may have been exploited and urges customers to upgrade affected SonicOS systems.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article says CISA added CVE-2026-19868 to this catalog, confirming exploitation in the wild and setting a remediation deadline for federal agencies.","category":"advisory","primary":false}],"body":"\u003cp\u003eSonicWall released updates for seven SonicOS vulnerabilities, including CVE-2026-19868, an SSL-VPN authentication-bypass issue reported as exploited in attacks. The flaw affects SSL-VPN services configured to use SAML authentication and has a CVSS score of 7.1. SonicWall urged customers to upgrade promptly, and CISA added the flaw to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-19868 can allow someone with valid credentials for an alternate authentication method to bypass SAML controls, potentially including SAML-enforced multi-factor authentication. The affected releases are SonicOS Gen7 7.3.3-7015 and earlier and Gen8 8.2.2-8015 and earlier; fixes are available in versions 7.3.4-7013 and 8.2.3-8015. The update also addresses six other flaws, including two management-interface issues rated 8.8 and pre-authentication buffer overflows that could cause denial-of-service conditions.\u003c/p\u003e\n"},{"n":2,"title":"Hackers pull off $133 million French bank heist via service provider","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-pull-off-133-million-french-bank-heist-via-service-provider/","time":"15:25","priority":"SHOULD READ","score":86,"tldr":"Crédit Mutuel Arkéa said attackers accessed its network through a service-provider platform and used the bank’s own account to move and convert funds, in a theft reportedly worth up to €118 million ($133 million). The bank says customer assets were not affected, some funds were blocked, and the incident is under investigation.","briefOverview":"\u003cp\u003eCrédit Mutuel Arkéa, a French cooperative bank, disclosed that it was hit by a cyberattack that enabled fraudulent transactions from the bank’s own account to other banking organizations. The attacker gained direct access to Arkéa’s network through a service provider’s platform, though the bank said Fortuneo was not involved. Arkéa characterized the intrusion as sophisticated and ruled out human error at the bank. It is working with police and judicial authorities to establish the attack’s origin and method.\u003c/p\u003e\n\n\u003cp\u003eBlockchain investigator ZachXBT reported that up to €118 million ($133 million) may have been stolen and withdrawn as the USDC and USDT stablecoins, while Arkéa confirmed only that the amount was of that general scale. The bank said some funds were blocked, but did not specify how much was recovered. It also said customer assets were unaffected, although certain transfers were delayed as systems were suspended and operations were restored. Arkéa warned customers to expect increased phishing attempts and to verify suspicious communications by contacting their adviser directly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Crédit Mutuel Arkéa said attackers entered its network through a service provider’s platform and used the bank’s own account to initiate transactions with other banking institutions.","Blockchain investigator ZachXBT estimated that up to €118 million ($133 million) may have been stolen and converted into USDC and USDT stablecoins.","Crédit Mutuel Arkéa said customer assets were not affected, although certain transfers were delayed while it suspended systems and responded to the incident.","The bank said the incident was closed and under control, that some funds had been blocked, and that it was working with police and judicial authorities to determine the attack’s origin and method."],"insights":["The alleged theft did not require compromising customer accounts: the attacker used Crédit Mutuel Arkéa’s own account to send funds to other banking organizations.","ZachXBT said the absence of an early public disclosure allowed the attacker to launder $30 million by November 3 that European law enforcement might otherwise have frozen.","The bank identified a service provider’s platform as the entry point, showing that disruption and financial loss can stem from access obtained through an external provider.","Crédit Mutuel Arkéa warned customers of elevated phishing risk after the incident and advised independently calling their bank adviser to verify suspicious communications."],"referencedReports":[],"body":"\u003cp\u003eCrédit Mutuel Arkéa, a French cooperative bank, disclosed that it was hit by a cyberattack that enabled fraudulent transactions from the bank’s own account to other banking organizations. The attacker gained direct access to Arkéa’s network through a service provider’s platform, though the bank said Fortuneo was not involved. Arkéa characterized the intrusion as sophisticated and ruled out human error at the bank. It is working with police and judicial authorities to establish the attack’s origin and method.\u003c/p\u003e\n\n\u003cp\u003eBlockchain investigator ZachXBT reported that up to €118 million ($133 million) may have been stolen and withdrawn as the USDC and USDT stablecoins, while Arkéa confirmed only that the amount was of that general scale. The bank said some funds were blocked, but did not specify how much was recovered. It also said customer assets were unaffected, although certain transfers were delayed as systems were suspended and operations were restored. Arkéa warned customers to expect increased phishing attempts and to verify suspicious communications by contacting their adviser directly.\u003c/p\u003e\n"},{"n":4,"title":"Claude Code's “Don't Ask Again” File Exposes Passwords and Keys in 1,122 Public Copies on GitHub","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/claude-codes-dont-ask-again-file.html","time":"06:44","priority":"SHOULD READ","score":82,"tldr":"Claude Code can save secrets embedded in approved shell commands to .claude/settings.local.json, leading Apiiro to find 1,379 exposed credentials across 1,122 public GitHub copies. Organizations should immediately rotate any exposed credentials, audit repository history and forks, and ensure these local settings files are ignored and scanned.","briefOverview":"\u003cp\u003eApiiro found that Claude Code can store passwords, tokens, and API keys in plain text within \u003ccode\u003e.claude/settings.local.json\u003c/code\u003e when users approve a command with “Yes, and don’t ask again.” The file can save the exact command offered for approval, including any secret typed into it. Apiiro identified 1,122 public copies containing at least one secret, with 1,379 different secrets across those files.\u003c/p\u003e\n\n\u003cp\u003eThe exposed material included 379 database passwords, 43 SSH logins for public servers, 42 GitHub, GitLab, and npm tokens, and 23 AWS keys. Removing a file does not eliminate the exposure from git history or forks; Apiiro found 734 additional secrets in older versions and matching secrets in 211 forks. The researchers advise organizations to rotate all credentials ever stored in these files, search current and historical repositories, stop tracking the local settings file, add it to project \u003ccode\u003e.gitignore\u003c/code\u003e files, and avoid placing secrets directly in commands.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Claude Code can store a full approved shell command, including passwords or access keys entered in it, in .claude/settings.local.json when a user selects “Yes, and don’t ask again.”","Apiiro found 1,122 public copies of .claude/settings.local.json containing at least one secret, with 1,379 distinct secrets identified across those files.","The exposed secrets included 379 database passwords, 43 SSH logins for public servers, 42 GitHub, GitLab, and npm tokens, and 23 AWS keys.","Removing a settings file from a repository does not remove secrets from git history or repository forks, where Apiiro found 734 additional secrets in older file versions and matching secrets in 211 forks.","Apiiro recommends rotating every password, token, and key a settings file has held before removing the file from tracking and adding it to the project’s .gitignore."],"insights":["Claude Code’s automatic exclusion is stored only in one user’s global Git settings, so it does not protect collaborators or prevent a file already committed to a project from being shared.","Common secret-scanning tools missed a substantial portion of the exposed files: gitleaks and TruffleHog together failed to flag 215 of the 1,122 files containing secrets, largely because passwords embedded in command lines do not match known key formats.","The scope grows beyond currently visible files: historical versions, forks, shared Claude settings files, and saved agent chat logs brought Apiiro’s total to 2,539 secrets across 1,994 repositories.","Using an approval pattern such as “npm run:*” or referring to a secret through a variable such as “$DB_URL” can avoid saving the actual secret in an approved command rule."],"referencedReports":[{"title":"Coding Agents Leaking Secrets to GitHub","url":"https://apiiro.com/blog/coding-agents-leaking-secrets-github-dont-ask-again","publisher":"apiiro","context":"The article relies on Apiiro’s research write-up for its findings on secrets stored in public Claude Code settings files.","category":"research","primary":true}],"body":"\u003cp\u003eApiiro found that Claude Code can store passwords, tokens, and API keys in plain text within \u003ccode\u003e.claude/settings.local.json\u003c/code\u003e when users approve a command with “Yes, and don’t ask again.” The file can save the exact command offered for approval, including any secret typed into it. Apiiro identified 1,122 public copies containing at least one secret, with 1,379 different secrets across those files.\u003c/p\u003e\n\n\u003cp\u003eThe exposed material included 379 database passwords, 43 SSH logins for public servers, 42 GitHub, GitLab, and npm tokens, and 23 AWS keys. Removing a file does not eliminate the exposure from git history or forks; Apiiro found 734 additional secrets in older versions and matching secrets in 211 forks. The researchers advise organizations to rotate all credentials ever stored in these files, search current and historical repositories, stop tracking the local settings file, add it to project \u003ccode\u003e.gitignore\u003c/code\u003e files, and avoid placing secrets directly in commands.\u003c/p\u003e\n"},{"n":5,"title":"The Lure Knew His Legal Name, Not His Card Number","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/club-miles-lure-full-legal-name-blank-card-number-field","time":"11:00","priority":"MAY READ","score":65,"tldr":"A phishing email impersonating Ecuador’s Diners Club Club Miles used the recipient’s full legal name and work email but left the card-number field blank, revealing that attackers had identity-list data rather than account information. The case shows why personalized details and passing email authentication do not establish legitimacy.","briefOverview":"\u003cp\u003eA Spanish-language phishing email impersonating Diners Club del Ecuador’s Club Miles program was delivered to a distribution manager at the Latin American subsidiary of a global construction chemicals manufacturer. The message used the recipient’s four-part uppercase legal name and work email address, although his employer’s directory only held a shorter two-part name. It claimed that 9,447 miles were expiring, but left the field labeled “Número de Tarjeta” blank.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the filled name and email fields, alongside the missing card number, show the sender had identity data rather than demonstrated card-account data. The sender domain, \u003ccode\u003eclubsmiles.org\u003c/code\u003e, was registered on 17 October 2026, used SendGrid infrastructure, and linked to \u003ccode\u003eclubmiles.lat\u003c/code\u003e, which had a malicious verdict. Although the email passed SPF, DKIM, and DMARC at the recipient-side gateway because the attacker controlled its own domain, IRONSCALES quarantined it after Themis scored it at 90 confidence; a later request to release the message did not change the malicious verdict.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A Spanish-language email impersonating Diners Club del Ecuador’s Club Miles program targeted a distribution manager at a Latin American subsidiary of a global construction chemicals manufacturer.","The lure used the recipient’s four-part uppercase legal name and work email address but left its “Número de Tarjeta” field empty.","The sender domain clubsmiles.org was registered on 17 October 2026, used SendGrid infrastructure, and linked to clubmiles.lat, which had a malicious verdict.","The message passed SPF, DKIM, and DMARC at the recipient-side gateway because the attacker controlled the sending domain, while later Exchange Online failures resulted from gateway re-injection.","IRONSCALES quarantined the message from the affected mailbox after Themis scored the case at 90 confidence, and a later request to release it did not change the malicious verdict."],"insights":["A personalized lure can reveal the limits of an attacker’s data: in this case, the filled legal-name and email fields contrasted with an empty card-number field, indicating the sender had identity details but not demonstrated card-account details.","Passing SPF, DKIM, and DMARC only established that clubsmiles.org was authorized to send its own email; it did not establish that the domain had any legitimate connection to Diners Club.","Authentication failures observed after the recipient gateway re-injected the message into Exchange Online were described as a mail-routing artifact, so treating them as evidence of attacker tampering would misdirect the investigation.","A genuine brand’s real callback number and an anti-fraud warning can be copied into a fraudulent message to make it appear safer, so verification should use contact details independently looked up by the recipient.","The later request to release the quarantined email showed that the use of a full legal name made the impersonation convincing enough for someone to believe it was legitimate."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s findings on the human element and credentials in breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA guidance recommending that users verify suspicious messages through a known channel.","category":"guide","primary":false},{"title":"Cost of a Data Breach Report","url":"https://www.ibm.com/reports/data-breach","publisher":"ibm","context":"The article cites the report in support of the potential losses caused by phishing lures.","category":"research","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites the FBI IC3 report alongside IBM’s report to describe how phishing lures can lead to losses.","category":"research","primary":false}],"body":"\u003cp\u003eA Spanish-language phishing email impersonating Diners Club del Ecuador’s Club Miles program was delivered to a distribution manager at the Latin American subsidiary of a global construction chemicals manufacturer. The message used the recipient’s four-part uppercase legal name and work email address, although his employer’s directory only held a shorter two-part name. It claimed that 9,447 miles were expiring, but left the field labeled “Número de Tarjeta” blank.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that the filled name and email fields, alongside the missing card number, show the sender had identity data rather than demonstrated card-account data. The sender domain, \u003ccode\u003eclubsmiles.org\u003c/code\u003e, was registered on 17 October 2026, used SendGrid infrastructure, and linked to \u003ccode\u003eclubmiles.lat\u003c/code\u003e, which had a malicious verdict. Although the email passed SPF, DKIM, and DMARC at the recipient-side gateway because the attacker controlled its own domain, IRONSCALES quarantined it after Themis scored it at 90 confidence; a later request to release the message did not change the malicious verdict.\u003c/p\u003e\n"},{"n":1,"title":"CTM360 Exposes Fake Gift Card Scams Exploiting Trusted Brands","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ctm360-exposes-fake-gift-card-scams-exploiting-trusted-brands/","time":"14:10","priority":"MAY READ","score":48,"tldr":"CTM360 reports more than 1,000 fake gift-card campaigns impersonating trusted brands and celebrities to funnel victims through endless “human verification” offers. The scams monetize survey completions, app installs, personal-data collection, and recurring mobile subscriptions while never delivering the promised reward.","briefOverview":"\u003cp\u003eCTM360 identified more than 1,000 incidents involving fake gift-card campaigns that impersonate brands including PlayStation, Sephora, SHEIN, Walmart, and Amazon. The campaigns are distributed through sponsored social-media advertisements, viral giveaway posts, and fabricated endorsements from celebrities or influencers such as MrBeast and Alix Earle. Victims are directed to fraudulent reward portals that use cloned branding, fake participant counts, countdowns, and testimonials to appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eAfter users choose a gift-card amount, the sites simulate generating a card and show a partially masked code before requiring a supposed security or human-verification check. Instead of providing a reward, the process sends victims through repeated surveys, promotional offers, app or browser-extension installations, and paid mobile-subscription flows; CTM360 said no reward was delivered in any tested flow. The operators use affiliate tracking links to tie registrations and completed mobile subscription verifications to their accounts, while victims risk personal-information exposure, unexpected mobile charges, and spam, and impersonated brands face reputational harm.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CTM360 identified more than 1,000 incidents involving fake gift-card campaigns that impersonate brands including PlayStation, Sephora, SHEIN, Walmart, and Amazon.","The campaigns use sponsored social-media ads, viral giveaway posts, and fabricated celebrity or influencer endorsements to lure users to fraudulent reward portals.","The fraudulent sites display cloned branding, fake participant counts, countdown timers, testimonials, and partially masked gift-card codes to make the offers appear legitimate.","Instead of delivering a gift card, the sites send victims through repeated surveys, promotional offers, app or browser-extension installs, and paid mobile-subscription flows.","CTM360 observed affiliate tracking links that connect victim registrations and completed mobile subscription verification to the operators’ affiliate-network accounts, generating commissions for the threat actors."],"insights":["The campaign is designed as an affiliate-revenue operation rather than a traditional credential-stealing scheme, with tracking parameters linking completed victim actions to the operators’ affiliate accounts.","Its modular setup allows operators to rapidly change the impersonated brand, celebrity lure, and domain name without rebuilding the underlying scam process.","The partial gift-card code and scripted “generation” animation are used to create the impression that a reward already exists, making victims more likely to continue to the verification stage.","CTM360 found that completing a requested verification task does not unlock the reward; the site instead marks it incomplete and redirects the victim to another offer."],"referencedReports":[],"body":"\u003cp\u003eCTM360 identified more than 1,000 incidents involving fake gift-card campaigns that impersonate brands including PlayStation, Sephora, SHEIN, Walmart, and Amazon. The campaigns are distributed through sponsored social-media advertisements, viral giveaway posts, and fabricated endorsements from celebrities or influencers such as MrBeast and Alix Earle. Victims are directed to fraudulent reward portals that use cloned branding, fake participant counts, countdowns, and testimonials to appear legitimate.\u003c/p\u003e\n\n\u003cp\u003eAfter users choose a gift-card amount, the sites simulate generating a card and show a partially masked code before requiring a supposed security or human-verification check. Instead of providing a reward, the process sends victims through repeated surveys, promotional offers, app or browser-extension installations, and paid mobile-subscription flows; CTM360 said no reward was delivered in any tested flow. The operators use affiliate tracking links to tie registrations and completed mobile subscription verifications to their accounts, while victims risk personal-information exposure, unexpected mobile charges, and spam, and impersonated brands face reputational harm.\u003c/p\u003e\n"},{"n":6,"title":"CWP2Shell: The Login Page That Never Says No","source":"chocapikk.com","sourceColorIdx":0,"link":"https://chocapikk.com/posts/2026/control-web-panel-pre-auth-module-dispatch-rce/","time":"00:00","priority":"MAY READ","score":25,"tldr":"CWP2Shell is a flaw in Control Web Panel’s login handling that can let attackers bypass authentication and gain unauthorized access to affected servers, potentially leading to remote code execution.","briefOverview":"\u003cp\u003eThe article is titled “CWP2Shell: The Login Page That Never Says No.” It presents CWP2Shell as the article’s central subject. The title associates the issue with a login page. It characterizes that login page as one that “never says no.”\u003c/p\u003e\n\n\u003cp\u003eNo readable technical explanation, affected organization, product details, or impact information is provided in the article content. The available text does not identify a specific incident, report, or advisory. As a result, the title is the only clear information available for summarizing the article. No further technical conclusions can be drawn from the provided content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “CWP2Shell: The Login Page That Never Says No.”","The article identifies CWP2Shell as its central subject.","The title characterizes the relevant login page as one that “never says no.”"],"insights":["The article’s title frames the issue as a login-page failure rather than a general system problem.","The name “CWP2Shell” suggests the article treats the issue as a distinct, named security finding."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “CWP2Shell: The Login Page That Never Says No.” It presents CWP2Shell as the article’s central subject. The title associates the issue with a login page. It characterizes that login page as one that “never says no.”\u003c/p\u003e\n\n\u003cp\u003eNo readable technical explanation, affected organization, product details, or impact information is provided in the article content. The available text does not identify a specific incident, report, or advisory. As a result, the title is the only clear information available for summarizing the article. No further technical conclusions can be drawn from the provided content.\u003c/p\u003e\n"}]</script>

<button type="button" data-dl-pill>New layout <span aria-hidden="true">&rarr;</span></button>
</div>
<style>#dl-layout-cta{position:fixed;right:16px;bottom:16px;
  z-index:2147483000;display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 24px);padding:10px 14px;border-radius:10px;
  font:13px/1.4 system-ui,sans-serif;color:#e8e8ea;background:rgba(20,20,24,.92);
  border:1px solid rgba(127,127,127,.35);box-shadow:0 6px 24px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);transition:opacity .2s ease}
#dl-layout-cta span{opacity:.92}
#dl-layout-cta button{cursor:pointer;font:inherit;padding:.35em .85em;border-radius:7px;
  border:1px solid transparent;white-space:nowrap}
#dl-layout-cta button[data-dl-try]{background:#39bdc9;color:#04222a;
  border-color:#39bdc9;font-weight:600}
#dl-layout-cta button[data-dl-dismiss]{background:transparent;color:inherit;
  border-color:rgba(127,127,127,.4)}
#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
