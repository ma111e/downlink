<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers exploit critical Adobe Commerce flaw to hijack customer accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-critical-adobe-commerce-flaw-to-hijack-customer-accounts/","time":"20:54","priority":"MUST READ","score":94,"tldr":"Attackers are already trying to exploit a critical Adobe Commerce and Magento flaw, CVE-2026-71362, that can let them hijack customer accounts without authentication. Site administrators should urgently apply Adobe’s August 2026 isolated security patches after updating to the latest supported -p release.","briefOverview":"\u003cp\u003eAttempts to exploit a critical vulnerability, CVE-2026-71362, in Adobe Commerce and Magento have been detected. The flaw could potentially allow attackers to hijack customer accounts. Adobe described it as an incorrect authorization vulnerability that could be used to gain elevated access to sensitive resources without authentication.\u003c/p\u003e\n\n\u003cp\u003eAdobe fixed CVE-2026-71362 as part of a security update that addressed seven issues in Commerce and Magento. Although Adobe said it was not aware of exploits in the wild for any of the fixed flaws, Sansec said its Shield web application firewall is already blocking exploitation attempts. Sansec said exploitation requires no existing account, administrator privileges, or user interaction.\u003c/p\u003e\n\n\u003cp\u003eAfter reviewing Adobe’s patch, Sansec said the issue involved Magento improperly handling customer identity in an account session. The company said the vulnerability lets attackers switch a customer session to another customer account, giving access to the victim’s account and private customer data. Website administrators are advised to apply the August 2026 security update for supported Commerce, Commerce B2B, and Magento release lines as soon as possible, after ensuring they are running the latest -p release for their supported branch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attempts to exploit CVE-2026-71362 in Adobe Commerce and Magento have been detected, potentially allowing attackers to hijack customer accounts.","Adobe described CVE-2026-71362 as an incorrect authorization vulnerability that could allow elevated access to sensitive resources without authentication.","Sansec said its Shield web application firewall is already blocking exploitation attempts, despite Adobe saying it was not aware of exploits in the wild for the fixed flaws.","Sansec’s analysis of Adobe’s patch found that the flaw lets attackers switch a customer session to another customer account, giving access to the victim’s account and private customer data.","Website administrators are advised to apply the August 2026 security update for supported Commerce, Commerce B2B, and Magento release lines as soon as possible."],"insights":["There is a discrepancy between Adobe’s advisory and Sansec’s observations: Adobe said it was not aware of in-the-wild exploitation, while Sansec said its WAF is already blocking attempts targeting CVE-2026-71362.","The flaw is especially actionable for defenders because Sansec says exploitation requires no existing account, administrator privileges, or user interaction.","Applying the fix may require more than a routine package update, because Sansec says the monthly fixes are distributed as isolated patch files rather than a new security release or updated Composer packages.","Administrators must first confirm they are on the latest -p release for their supported branch before applying the corresponding isolated patch."],"referencedReports":[{"title":"Adobe Security Bulletin APSB26-92","url":"http://helpx.adobe.com/security/products/magento/apsb26-92.html","publisher":"Adobe","context":"The article cites Adobe’s advisory for the fixed Adobe Commerce and Magento vulnerabilities and Adobe’s statement that it was not aware of exploitation in the wild.","category":"advisory","primary":true},{"title":"Adobe Commerce Account Takeover APSB26-92","url":"https://sansec.io/research/adobe-commerce-account-takeover-apsb26-92","publisher":"Sansec","context":"The article cites Sansec’s analysis of Adobe’s patch, which says CVE-2026-71362 can let attackers switch a customer session to another customer account.","category":"research","primary":true}],"body":"\u003cp\u003eAttempts to exploit a critical vulnerability, CVE-2026-71362, in Adobe Commerce and Magento have been detected. The flaw could potentially allow attackers to hijack customer accounts. Adobe described it as an incorrect authorization vulnerability that could be used to gain elevated access to sensitive resources without authentication.\u003c/p\u003e\n\n\u003cp\u003eAdobe fixed CVE-2026-71362 as part of a security update that addressed seven issues in Commerce and Magento. Although Adobe said it was not aware of exploits in the wild for any of the fixed flaws, Sansec said its Shield web application firewall is already blocking exploitation attempts. Sansec said exploitation requires no existing account, administrator privileges, or user interaction.\u003c/p\u003e\n\n\u003cp\u003eAfter reviewing Adobe’s patch, Sansec said the issue involved Magento improperly handling customer identity in an account session. The company said the vulnerability lets attackers switch a customer session to another customer account, giving access to the victim’s account and private customer data. Website administrators are advised to apply the August 2026 security update for supported Commerce, Commerce B2B, and Magento release lines as soon as possible, after ensuring they are running the latest -p release for their supported branch.\u003c/p\u003e\n"},{"n":2,"title":"Hundreds of fake Chrome VPN extensions route traffic through a proxy","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hundreds-of-fake-chrome-vpn-extensions-route-traffic-through-a-proxy/","time":"18:54","priority":"SHOULD READ","score":82,"tldr":"Researchers found 737 fake Chrome VPN/proxy extensions impersonating major brands and routing users’ browser traffic through a single operator’s SOCKS5 proxies, potentially exposing destinations, source IPs, and plaintext HTTP data. Google has removed some, but Socket says more than 500 remain available, so users should check for the listed extension IDs and reset Chrome proxy settings if needed.","briefOverview":"\u003cp\u003eMore than 737 browser extensions on the Chrome Web Store impersonated well-known VPN and proxy services while routing users’ traffic through SOCKS5 proxies operated by a single provider. The extensions impersonated brands including Proton VPN, NordVPN, Surfshark, ExpressVPN, and Cloudflare’s 1.1.1.1 DNS resolver. Socket researchers said the campaign used 40 publisher accounts and a shared analytics account.\u003c/p\u003e\n\n\u003cp\u003eThe extensions were downloaded nearly 75,000 times, mainly by Russian users looking for tools to bypass blocked services in the country. Socket said that with all browser traffic forced through the relay, the operator’s server could read every destination, every TLS SNI value, the victim’s source IP, and any request body sent over plain HTTP. Based on strings found in the extensions, the campaign appears to have been an attempt to funnel customers to a subscription-based VPN service in Russia.\u003c/p\u003e\n\n\u003cp\u003eSocket identified several behaviors, including 520 extensions routing all browser traffic through SOCKS5 proxies on port 1082 and 104 extensions resolving proxy hostnames through Cloudflare or Google DNS-over-HTTPS. Some extensions advertised nonexistent premium servers in Japan, Singapore, Canada, Australia, and Turkey for subscription fraud. Google removed more than 200 related extensions, but Socket said over 500 were still available and recommended that users check for the listed extension IDs, remove any matches, and confirm Chrome’s proxy configuration is back to normal.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket researchers found more than 737 Chrome Web Store extensions that impersonated well-known VPN and proxy services while routing users’ traffic through SOCKS5 proxies operated by a single provider.","The extensions impersonated brands including Proton VPN, NordVPN, Surfshark, ExpressVPN, and Cloudflare’s 1.1.1.1 DNS resolver.","The extensions were downloaded nearly 75,000 times, mainly by Russian users looking for tools to bypass blocked services in the country.","Socket identified behaviors including routing all browser traffic through SOCKS5 proxies on port 1082, resolving proxy hostnames through Cloudflare or Google DNS-over-HTTPS, and advertising nonexistent premium server locations for subscription fraud.","Google removed more than 200 related extensions, but Socket said over 500 were still available in the Chrome Web Store and recommended users remove any listed extensions and confirm Chrome’s proxy configuration is normal."],"insights":["The campaign’s scale was obscured by fragmentation across 40 publisher accounts, but Socket linked the extensions through shared infrastructure, including a shared analytics account.","Even though the extensions used a proxy mechanism similar to legitimate services, Socket identified deception indicators such as brand impersonation, nonexistent premium locations, misleading reviewer disclosures, and remote configuration added after approval.","Some extensions used Cloudflare or Google DNS-over-HTTPS to resolve proxy hostnames, which Socket said helped protect the operator’s domain from scrutiny.","Because all browser traffic was forced through the relay, the operator could observe every destination, TLS SNI value, victim source IP, and any request body sent over plain HTTP.","The campaign appears to have targeted demand from Russian users seeking ways around blocked services, while strings in the extensions suggested an attempt to funnel customers to a subscription-based VPN service in Russia."],"referencedReports":[{"title":"Chrome VPN Extension Impersonation","url":"https://socket.dev/blog/chrome-vpn-extension-impersonation","publisher":"Socket","context":"The article cites Socket’s research explaining that the Chrome extensions forced browser traffic through a relay that could expose destinations, TLS SNI values, source IPs, and plaintext HTTP request bodies.","category":"research","primary":true}],"body":"\u003cp\u003eMore than 737 browser extensions on the Chrome Web Store impersonated well-known VPN and proxy services while routing users’ traffic through SOCKS5 proxies operated by a single provider. The extensions impersonated brands including Proton VPN, NordVPN, Surfshark, ExpressVPN, and Cloudflare’s 1.1.1.1 DNS resolver. Socket researchers said the campaign used 40 publisher accounts and a shared analytics account.\u003c/p\u003e\n\n\u003cp\u003eThe extensions were downloaded nearly 75,000 times, mainly by Russian users looking for tools to bypass blocked services in the country. Socket said that with all browser traffic forced through the relay, the operator’s server could read every destination, every TLS SNI value, the victim’s source IP, and any request body sent over plain HTTP. Based on strings found in the extensions, the campaign appears to have been an attempt to funnel customers to a subscription-based VPN service in Russia.\u003c/p\u003e\n\n\u003cp\u003eSocket identified several behaviors, including 520 extensions routing all browser traffic through SOCKS5 proxies on port 1082 and 104 extensions resolving proxy hostnames through Cloudflare or Google DNS-over-HTTPS. Some extensions advertised nonexistent premium servers in Japan, Singapore, Canada, Australia, and Turkey for subscription fraud. Google removed more than 200 related extensions, but Socket said over 500 were still available and recommended that users check for the listed extension IDs, remove any matches, and confirm Chrome’s proxy configuration is back to normal.\u003c/p\u003e\n"},{"n":3,"title":"The Human Risk Layer of AI","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/the-human-risk-layer-of-ai/","time":"21:35","priority":"MAY READ","score":35,"tldr":"AI agents now act like workforce members with access, data, and decision-making authority, so securing them requires managing human risk as well as technical controls. The paper argues that Human Risk Management helps close the gap between what AI systems can do and how employees will actually use them.","briefOverview":"\u003cp\u003eThe article presents a white paper titled “The Human Risk Layer of AI,” published on August 12, 2026. It says the paper explains why securing large language models requires more than technical controls. The article frames Human Risk Management as a way to close the gap between what AI can do and what the workforce will do.\u003c/p\u003e\n\n\u003cp\u003eThe article states that AI agents now share access, data, and decision authority with the people who deploy them. It says these agents can make calls to internal systems, generate code, send communications, summarize documents, and execute multi-step workflows on behalf of human operators. For security purposes, the article says AI agents are indistinguishable from a workforce member with credentials.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies Living Security as a Health-ISAC Community Services Champion. It says readers should read the paper for information on the workforce dimensions of AI security. The page also lists related Health-ISAC resources and news items on cybersecurity, AI agents, human risk management, and healthcare cyber resilience.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article presents a white paper titled “The Human Risk Layer of AI,” dated August 12, 2026.","The paper focuses on why securing large language models requires more than technical controls.","The article states that AI agents can access data, use internal systems, generate code, send communications, summarize documents, and execute multi-step workflows for human operators.","The article says AI agents are indistinguishable from a workforce member with credentials for security purposes.","The paper is presented by Living Security, which is identified as a Health-ISAC Community Services Champion."],"insights":["The article frames AI agents as part of the workforce for security purposes, which shifts AI security from being only a technical control problem to also being a workforce risk problem.","The paper’s central gap is between what AI systems are capable of doing and what employees will actually do with them in real workflows.","The article highlights that AI risk is tied to delegated authority, because agents can act on behalf of human operators across internal systems, communications, documents, and code."],"referencedReports":[],"body":"\u003cp\u003eThe article presents a white paper titled “The Human Risk Layer of AI,” published on August 12, 2026. It says the paper explains why securing large language models requires more than technical controls. The article frames Human Risk Management as a way to close the gap between what AI can do and what the workforce will do.\u003c/p\u003e\n\n\u003cp\u003eThe article states that AI agents now share access, data, and decision authority with the people who deploy them. It says these agents can make calls to internal systems, generate code, send communications, summarize documents, and execute multi-step workflows on behalf of human operators. For security purposes, the article says AI agents are indistinguishable from a workforce member with credentials.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies Living Security as a Health-ISAC Community Services Champion. It says readers should
