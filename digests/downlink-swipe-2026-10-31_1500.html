PI keys they had provided to Northflank.\u003c/p\u003e\n\n\u003cp\u003eEnvironment variables can contain database passwords, cloud credentials, authentication tokens, and API keys, so exposure could enable access to other customer services or unauthorized charges. Northflank applied several network-policy patches, requested Wiz incident-response assistance, enabled rotation for PostgreSQL, MongoDB, MySQL, and Redis credentials, and made audit logs available to all customers. The company has not disclosed how attackers obtained access, how many customers were affected, or whether credentials beyond the reported AI API keys were stolen or abused.\u003c/p\u003e\n"},{"n":2,"title":"New Android SMS of Death exploit can remotely crash unpatched phones","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-android-sms-of-death-exploit-can-remotely-crash-unpatched-phones/","time":"15:35","priority":"SHOULD READ","score":84,"tldr":"A proof-of-concept for Android's \"SMS of Death\" flaw (CVE-2026-58882) can remotely crash unpatched phones and disrupt cellular and emergency calls using a malformed WAP Push data SMS. Users should install the latest Android security updates, as older Android 12 and 13 devices may remain vulnerable.","briefOverview":"\u003cp\u003eA security researcher released a proof-of-concept exploit for CVE-2026-58882, an Android flaw dubbed \u0026ldquo;SMS of Death.\u0026rdquo; A specially crafted data text message can remotely disrupt cellular service or crash unpatched phones without the recipient taking any action. The crash can interrupt ongoing calls, including emergency calls, and victims may not see the malicious message because Android processes it before it reaches the SMS inbox.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is caused by improper validation of a header-length value in Android\u0026rsquo;s WapPushOverSms.decodeWapPdu function. A malformed WAP Push message can produce a negative memory-allocation value and trigger a NegativeArraySizeException that crashes the com.android.phone process, which manages cellular functions. Google reportedly fixed the issue in October 2026 updates for Android 14 through 17, including measures to remove malicious messages from the SMS database, while Android 12 and 13 devices remain vulnerable because they did not receive the fix.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A proof-of-concept exploit for CVE-2026-58882 can cause unpatched Android phones to lose cellular service or crash when sent a specially crafted text message.","The flaw requires no interaction from the target and can interrupt active calls, including emergency calls, before the message appears in the SMS inbox.","The issue stems from improper validation in Android's WapPushOverSms.decodeWapPdu function, which can trigger a crash in the com.android.phone process.","Google reportedly fixed the flaw in its October 2026 Android security updates for Android 14 through 17, while Android 12 and 13 devices did not receive the fix.","Repeated delivery or processing of malicious messages can cause recurring crashes, and testing found that 20 messages could put some phones into reboot loops requiring a factory reset."],"insights":["The malicious message is processed before it reaches the SMS inbox, so a victim may have no visible indication of what caused the phone to crash.","The flaw can disrupt emergency calls because the crashed com.android.phone process manages cellular functions.","Google's fix both catches the processing exceptions and removes malicious messages from the SMS database, helping prevent repeated crashes after a device restarts.","Although Android security updates are generally installed automatically on supported devices, availability depends on the device manufacturer and carrier, and a restart may be needed to complete installation.","An ADB-based method can remove malicious messages, but it requires a computer and advanced technical knowledge."],"referencedReports":[{"title":"SMS of Death","url":"https://smsofdeath.com/","publisher":"mark-blah","context":"The article cites Mark Blah's technical analysis explaining the malformed WAP Push message and the underlying Android processing flaw.","category":"research","primary":true},{"title":"Android Security Bulletin—October 2026","url":"https://source.android.com/docs/security/bulletin/2026/2026-10-01","publisher":"google","context":"The article references Google's October 2026 Android security updates as the reported source of the fix for affected Android versions.","category":"advisory","primary":false}],"body":"\u003cp\u003eA security researcher released a proof-of-concept exploit for CVE-2026-58882, an Android flaw dubbed \u0026ldquo;SMS of Death.\u0026rdquo; A specially crafted data text message can remotely disrupt cellular service or crash unpatched phones without the recipient taking any action. The crash can interrupt ongoing calls, including emergency calls, and victims may not see the malicious message because Android processes it before it reaches the SMS inbox.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is caused by improper validation of a header-length value in Android\u0026rsquo;s WapPushOverSms.decodeWapPdu function. A malformed WAP Push message can produce a negative memory-allocation value and trigger a NegativeArraySizeException that crashes the com.android.phone process, which manages cellular functions. Google reportedly fixed the issue in October 2026 updates for Android 14 through 17, including measures to remove malicious messages from the SMS database, while Android 12 and 13 devices remain vulnerable because they did not receive the fix.\u003c/p\u003e\n"}]</script>
