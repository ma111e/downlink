<script type="application/json" id="dl-articles">[{"n":2,"title":"Mini Shai-Hulud hits openapi-react-query-codegen: 10 malicious npm versions","source":"mend.io","sourceColorIdx":0,"link":"https://www.mend.io/blog/mini-shai-hulud-hits-openapi-react-query-codegen/","time":"16:19","priority":"MUST READ","score":94,"tldr":"Ten malicious versions of @7nohe/openapi-react-query-codegen were published to npm after an attacker abused a GitHub Actions issue_comment release workflow to mint trusted publishing tokens without stealing maintainer credentials. Some versions executed without install scripts via node-gyp, so affected users must check for the listed versions and payload files, update to a clean release, and rotate exposed credentials.","briefOverview":"\u003cp\u003eOn August 28, 2026, ten malicious versions of \u003ccode\u003e@7nohe/openapi-react-query-codegen\u003c/code\u003e were published to npm between 20:00 and 20:21 UTC. The package generates React Query hooks from an OpenAPI schema and has roughly 150,000 weekly downloads. The \u003ccode\u003elatest\u003c/code\u003e tag pointed to malicious version \u003ccode\u003e3.0.4\u003c/code\u003e during the window, and npm removed all ten versions on August 29 while restoring \u003ccode\u003elatest\u003c/code\u003e to \u003ccode\u003e3.0.2\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attacker did not need a stolen npm token or hijacked maintainer account, but instead abused a GitHub release workflow triggered by \u003ccode\u003eissue_comment\u003c/code\u003e events. The workflow lacked an author association check, checked out pull request head code from a fork, and had \u003ccode\u003eid-token: write\u003c/code\u003e, allowing npm trusted publishing tokens to be minted through OIDC. All ten releases had valid SLSA provenance attestations because they were produced by the project’s real release workflow, so provenance did not separate malicious artifacts from legitimate builds.\u003c/p\u003e\n\n\u003cp\u003eThe malicious releases used two execution paths, which makes detection more complicated. Eight versions included \u003ccode\u003ebinding.gyp\u003c/code\u003e and \u003ccode\u003e3FWCvzduYZg.js\u003c/code\u003e, with four of them executing through the native build path without any install script, while two prereleases had a malicious \u003ccode\u003epreinstall\u003c/code\u003e but no payload files. The payload targeted cloud, registry, CI, developer, and AI assistant configuration surfaces, and the article recommends auditing lockfiles and install logs, updating to a clean version, rotating reachable credentials, reviewing AI assistant configuration files, and checking similar release workflow patterns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On August 28, 2026, ten malicious versions of @7nohe/openapi-react-query-codegen were published to npm between 20:00 and 20:21 UTC, with the latest tag pointing to malicious version 3.0.4 during that window.","The attacker abused a GitHub Actions release workflow triggered by issue_comment events that checked out pull request code and had id-token: write permission, allowing npm trusted publishing tokens to be minted without a stolen npm token or hijacked maintainer account.","Eight of the malicious releases contained a multi-stage loader that targeted cloud, registry, and developer credentials, while two prerelease versions used a preinstall script but did not include the payload files.","Four affected versions had no install script and executed through node-gyp evaluation of a malicious binding.gyp file, so scanning only for install hooks would miss them.","The article recommends auditing lockfiles and install logs for the ten affected versions, updating to a clean version, rotating credentials reachable from affected machines or runners, and reviewing AI assistant configuration files for unexpected changes."],"insights":["Valid SLSA provenance did not distinguish the malicious releases from legitimate builds because the artifacts were produced by the project’s genuine release workflow.","Disabling or scanning only for install scripts would not have caught all affected versions because four releases executed through the native build path using binding.gyp despite having no install hook.","Detection must combine package-specific file indicators, such as binding.gyp and 3FWCvzduYZg.js, with direct lockfile checks for the two prereleases that did not include those payload files.","All ten malicious versions were removed from npm, so a pinned affected lockfile now fails with a 404 during npm ci, which is described as a safe outcome but not a self-explanatory one.","The payload referenced multiple AI coding assistant configuration files and included a Model Context Protocol-shaped server stub, making review of assistant configuration files a specific remediation step."],"referencedReports":[{"title":"Upstream incident report and maintainer postmortem","url":"https://github.com/7nohe/openapi-react-query-codegen/issues/217","publisher":"7nohe/openapi-react-query-codegen","context":"The article cites this issue for the maintainer’s postmortem describing how the release workflow was abused and confirming the incident scope.","category":"research","primary":true},{"title":"GHSA-9pvf-vcx3-x239","url":"https://github.com/7nohe/openapi-react-query-codegen/security/advisories/GHSA-9pvf-vcx3-x239","publisher":"GitHub Security Advisory","context":"The article references this advisory as the published security advisory for the malicious @7nohe/openapi-react-query-codegen versions, with CVSS 9.6.","category":"advisory","primary":true}],"body":"\u003cp\u003eOn August 28, 2026, ten malicious versions of \u003ccode\u003e@7nohe/openapi-react-query-codegen\u003c/code\u003e were published to npm between 20:00 and 20:21 UTC. The package generates React Query hooks from an OpenAPI schema and has roughly 150,000 weekly downloads. The \u003ccode\u003elatest\u003c/code\u003e tag pointed to malicious version \u003ccode\u003e3.0.4\u003c/code\u003e during the window, and npm removed all ten versions on August 29 while restoring \u003ccode\u003elatest\u003c/code\u003e to \u003ccode\u003e3.0.2\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe attacker did not need a stolen npm token or hijacked maintainer account, but instead abused a GitHub release workflow triggered by \u003ccode\u003eissue_comment\u003c/code\u003e events. The workflow lacked an author association check, checked out pull request head code from a fork, and had \u003ccode\u003eid-token: write\u003c/code\u003e, allowing npm trusted publishing tokens to be minted through OIDC. All ten releases had valid SLSA provenance attestations because they were produced by the project’s real release workflow, so provenance did not separate malicious artifacts from legitimate builds.\u003c/p\u003e\n\n\u003cp\u003eThe malicious releases used two execution paths, which makes detection more complicated. Eight versions included \u003ccode\u003ebinding.gyp\u003c/code\u003e and \u003ccode\u003e3FWCvzduYZg.js\u003c/code\u003e, with four of them executing through the native build path without any install script, while two prereleases had a malicious \u003ccode\u003epreinstall\u003c/code\u003e but no payload files. The payload targeted cloud, registry, CI, developer, and AI assistant configuration surfaces, and the article recommends auditing lockfiles and install logs, updating to a clean version, rotating reachable credentials, reviewing AI assistant configuration files, and checking similar release workflow patterns.\u003c/p\u003e\n"},{"n":1,"title":"Nothing to Block: A 1990s Domain and a Google Form","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/google-forms-data-harvest-authenticated-legacy-sender-domain","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A phishing email sent from a compromised, decades-old legitimate mailbox passed SPF, DKIM, and DMARC and used a Google Forms link for credential harvesting, leaving no obvious reputation-based indicators to block. The key takeaway is that clean authentication and trusted hosting do not prove an email is safe; detection must evaluate message content, sender relationship, and behavior.","briefOverview":"\u003cp\u003eA general manager at a national in-home care services provider received an unbranded payment notice that appeared to report a settled debit request. The message contained a plain bordered table with a customer identifier, paid date, BILLPAY memo, and check and draft reference number, but no dollar amount. Its only hyperlink was labeled as a way to view transaction details and resolved through a Google Forms shortlink to a form hosted on Google\u0026rsquo;s own domain.\u003c/p\u003e\n\n\u003cp\u003eThe email came from a legitimate property-management business domain registered in the late 1990s, and the recipient\u0026rsquo;s mail system recorded DKIM, SPF, and DMARC passes with an intact relay chain. The article says these clean results occurred because the mailbox was real and had been taken over, allowing the operator to inherit the domain\u0026rsquo;s authentication and reputation. The destination also offered little reputation signal because the collection page was hosted on Google\u0026rsquo;s document platform.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several signs in the message itself, including a mismatch between the reference number in the subject line and the one in the body, the missing payment amount, and visible sender and recipient fields that matched each other while actual delivery went elsewhere. IRONSCALES\u0026rsquo; Themis Adaptive AI classified the message as credential theft at 83 percent confidence and labeled the recipient as high value based on content and behavior rather than infrastructure indicators. The incident is mapped to MITRE techniques for spearphishing links, phishing for information through a link, and use of valid accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A general manager at a national in-home care services provider received an unbranded payment notice from a legitimate property-management business domain registered in the late 1990s.","The email passed DKIM, SPF, and DMARC because it was sent from a real compromised mailbox rather than from spoofed infrastructure.","The single hyperlink in the message was a Google Forms shortlink that redirected to a form page on Google's own document platform.","The lure used fabricated transaction details, including a customer identifier, paid date, BILLPAY memo, and reference number, while omitting the payment amount and showing a mismatch between the subject and body reference numbers.","IRONSCALES' Themis Adaptive AI classified the message as credential theft at 83 percent confidence based on content and behavior rather than infrastructure reputation signals."],"insights":["Clean SPF, DKIM, and DMARC results can be a downstream consequence of account takeover, so they should not be treated as evidence that a message is safe.","A trusted destination domain can hide malicious intent when attackers use a legitimate platform such as Google Forms as the data-collection endpoint.","The missing payment amount was part of the lure’s design, because it created a reason for the recipient to click the transaction-details link.","A mismatch between the reference number in the subject line and the reference number in the body was a visible clue that the payment notice was fabricated.","A self-addressed visible sender and recipient, combined with actual delivery to another mailbox, indicated a blind-copied blast from the hijacked mailbox rather than normal correspondence."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on the human element in breaches, phishing as an initial access vector, and credential involvement in incidents.","category":"research","primary":false},{"title":"2025 FBI IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2025_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the annual report for reported business email compromise losses and total reported losses.","category":"research","primary":false}],"body":"\u003cp\u003eA general manager at a national in-home care services provider received an unbranded payment notice that appeared to report a settled debit request. The message contained a plain bordered table with a customer identifier, paid date, BILLPAY memo, and check and draft reference number, but no dollar amount. Its only hyperlink was labeled as a way to view transaction details and resolved through a Google Forms shortlink to a form hosted on Google\u0026rsquo;s own domain.\u003c/p\u003e\n\n\u003cp\u003eThe email came from a legitimate property-management business domain registered in the late 1990s, and the recipient\u0026rsquo;s mail system recorded DKIM, SPF, and DMARC passes with an intact relay chain. The article says these clean results occurred because the mailbox was real and had been taken over, allowing the operator to inherit the domain\u0026rsquo;s authentication and reputation. The destination also offered little reputation signal because the collection page was hosted on Google\u0026rsquo;s document platform.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights several signs in the message itself, including a mismatch between the reference number in the subject line and the one in the body, the missing payment amount, and visible sender and recipient fields that matched each other while actual delivery went elsewhere. IRONSCALES\u0026rsquo; Themis Adaptive AI classified the message as credential theft at 83 percent confidence and labeled the recipient as high value based on content and behavior rather than infrastructure indicators. The incident is mapped to MITRE techniques for spearphishing links, phishing for information through a link, and use of valid accounts.\u003c/p\u003e\n"}]</script>
