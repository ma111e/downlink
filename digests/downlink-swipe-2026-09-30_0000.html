<script type="application/json" id="dl-articles">[{"n":2,"title":"Cisco warns of new SD-WAN zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-warns-of-new-sd-wan-authentication-bypass-zero-day-exploited-in-attacks/","time":"14:46","priority":"MUST READ","score":98,"tldr":"Cisco has patched CVE-2026-76504, a critical Catalyst SD-WAN Manager authentication-bypass zero-day that is actively exploited to give unauthenticated remote attackers administrator access. Organizations should urgently upgrade to a fixed release and review logs for suspicious URI-encoded %6a requests and unauthorized j_security_check activity.","briefOverview":"\u003cp\u003eCisco released security updates for CVE-2026-76504, a critical zero-day in Catalyst SD-WAN Manager that the company says attackers are actively exploiting. The software, formerly called SD-WAN vManage, allows administrators to monitor and manage up to 6,000 SD-WAN devices from one dashboard. The flaw affects all deployments regardless of configuration and can give an unauthenticated remote attacker administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eCisco said the issue results from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for a specific API endpoint. The company warned that malicious requests use \u003ccode\u003e%6a\u003c/code\u003e, the URI-encoded character for \u003ccode\u003ej\u003c/code\u003e, and advised teams to review serviceproxy-access.log and vmanage-server.log for \u003ccode\u003ej_security_check\u003c/code\u003e entries from unknown or unauthorized IP addresses. Cisco recommends upgrading to fixed releases and collecting admin-tech files before opening a Cisco TAC case for compromise review.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-76504 is the fifth Cisco SD-WAN zero-day reported as actively exploited since the start of 2026. Cisco had previously disclosed actively exploited SD-WAN flaws including CVE-2026-20127, CVE-2026-20182, CVE-2026-20245, and CVE-2026-20262. Since November 2021, CISA has listed 90 Cisco vulnerabilities as exploited in the wild, including four affecting Cisco Catalyst SD-WAN Manager.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco released fixes for CVE-2026-76504, a critical Catalyst SD-WAN Manager flaw that the company says is being actively exploited.","The flaw affects all Catalyst SD-WAN Manager deployments and can allow an unauthenticated remote attacker to obtain administrator privileges through a crafted API request.","Cisco said the issue stems from improper handling of URI encoding, which can bypass an authentication rule protecting a specific API endpoint.","Cisco advised customers to upgrade to fixed releases and to investigate serviceproxy-access.log and vmanage-server.log for j_security_check entries from unknown or unauthorized IP addresses.","CVE-2026-76504 is the fifth Cisco SD-WAN zero-day reported as actively exploited in 2026."],"insights":["The suspected malicious requests use \"%6a,\" the URI-encoded form of the letter \"j,\" making this a concrete indicator for incident responders to search for.","The issue affects every Catalyst SD-WAN Manager deployment regardless of configuration, so changing deployment settings does not remove the need to patch.","Because Catalyst SD-WAN Manager can oversee up to 6,000 SD-WAN devices from one dashboard, compromise of the central management system could have a broad operational reach.","Cisco directs investigators to two specific log sources—serviceproxy-access.log and vmanage-server.log—and recommends collecting admin-tech files before opening a TAC case."],"referencedReports":[{"title":"Cisco Catalyst SD-WAN Manager Authentication Bypass Vulnerability Advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU","publisher":"cisco","context":"Cisco's advisory warns that CVE-2026-76504 is under active exploitation and recommends upgrading to fixed software releases.","category":"advisory","primary":true}],"body":"\u003cp\u003eCisco released security updates for CVE-2026-76504, a critical zero-day in Catalyst SD-WAN Manager that the company says attackers are actively exploiting. The software, formerly called SD-WAN vManage, allows administrators to monitor and manage up to 6,000 SD-WAN devices from one dashboard. The flaw affects all deployments regardless of configuration and can give an unauthenticated remote attacker administrator privileges.\u003c/p\u003e\n\n\u003cp\u003eCisco said the issue results from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for a specific API endpoint. The company warned that malicious requests use \u003ccode\u003e%6a\u003c/code\u003e, the URI-encoded character for \u003ccode\u003ej\u003c/code\u003e, and advised teams to review serviceproxy-access.log and vmanage-server.log for \u003ccode\u003ej_security_check\u003c/code\u003e entries from unknown or unauthorized IP addresses. Cisco recommends upgrading to fixed releases and collecting admin-tech files before opening a Cisco TAC case for compromise review.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-76504 is the fifth Cisco SD-WAN zero-day reported as actively exploited since the start of 2026. Cisco had previously disclosed actively exploited SD-WAN flaws including CVE-2026-20127, CVE-2026-20182, CVE-2026-20245, and CVE-2026-20262. Since November 2021, CISA has listed 90 Cisco vulnerabilities as exploited in the wild, including four affecting Cisco Catalyst SD-WAN Manager.\u003c/p\u003e\n"},{"n":19,"title":"Attackers Exploit NetScaler Flaw for Root Access, Deploy WHIPSHOT and SLAPSHOT","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-exploit-netscaler-flaw-for.html","time":"08:24","priority":"MUST READ","score":98,"tldr":"Threat actors are actively exploiting the critical Citrix NetScaler CVE-2026-88772 flaw to obtain root access and install WHIPSHOT web shells and the SLAPSHOT tunneler for persistent internal reconnaissance and credential theft. Organizations using affected NetScaler ADC and Gateway appliances should apply patches immediately and investigate for malicious PHP files and altered web-server configurations.","briefOverview":"\u003cp\u003eUnknown threat actors exploited the newly patched CVE-2026-88772 flaw in Citrix NetScaler ADC and NetScaler Gateway appliances to obtain root-level access. Mandiant Consulting and Google Threat Intelligence Group observed the activity in September 2026 against organizations in North America and Europe, including government, financial services, technology, education, and legal and professional-services sectors. The vulnerability is a CVSS 9.5 memory-overflow issue in NetScaler\u0026rsquo;s DTLS handling component that can allow execution of arbitrary code on the underlying FreeBSD platform.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers altered web-server configuration files so deceptive .deb and .sig files could run as PHP web shells. They deployed WHIPSHOT to receive Base64-encoded commands through HTTP headers and SLAPSHOT to forward network traffic to internal systems for reconnaissance and credential theft. The activity highlights the risk posed by internet-exposed edge appliances, and GreyNoise reported that exploitation of CVE-2026-88771 and CVE-2026-88772 escalated into broad web-shell and malware deployment on September 28, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unknown threat actors exploited CVE-2026-88772 in Citrix NetScaler ADC and NetScaler Gateway appliances to gain root-level access.","Mandiant Consulting and Google Threat Intelligence Group observed the activity in September 2026 against government, financial services, technology, education, and legal and professional-services organizations in North America and Europe.","The attackers deployed WHIPSHOT, a PHP web shell that receives Base64-encoded commands through HTTP headers, and SLAPSHOT, a Python tool that forwards TCP traffic to internal hosts.","The attackers modified NetScaler web-server configuration files so files with deceptive .deb or .sig extensions could be executed as PHP web shells.","GreyNoise reported that activity tied to CVE-2026-88771 and CVE-2026-88772 escalated from mass reconnaissance to broad exploitation and web-shell and malware deployment on September 28, 2026."],"insights":["The attackers disguised executable PHP web shells as .deb and .sig files by changing NetScaler web-server settings, allowing seemingly harmless file extensions to execute code.","Requests for .ico files under /vpn/media/ could trigger matching hidden .sig web shells, and access logs may misleadingly show HTTP 404 responses despite unusually long processing times and multi-kilobyte responses.","The attackers sought persistence by changing permissions on /bin/sh and rebooting the NetScaler appliance, enabling root-level execution of their web shells after restart.","SLAPSHOT removes its port and lock files and ends its process after 10 minutes without activity, reducing the evidence left for investigators."],"referencedReports":[{"title":"Defending Against Active Exploitation of Citrix NetScaler ADC and Gateway Appliances","url":"https://cloud.google.com/blog/topics/threat-intelligence/defending-against-active-exploitation-of-citrix-netscaler-adc-and-gateway-appliances","publisher":"google-threat-intelligence-group","context":"The article relies on Google Threat Intelligence Group findings describing exploitation behavior, web-shell deployment, persistence, and tunneling activity.","category":"research","primary":true}],"body":"\u003cp\u003eUnknown threat actors exploited the newly patched CVE-2026-88772 flaw in Citrix NetScaler ADC and NetScaler Gateway appliances to obtain root-level access. Mandiant Consulting and Google Threat Intelligence Group observed the activity in September 2026 against organizations in North America and Europe, including government, financial services, technology, education, and legal and professional-services sectors. The vulnerability is a CVSS 9.5 memory-overflow issue in NetScaler\u0026rsquo;s DTLS handling component that can allow execution of arbitrary code on the underlying FreeBSD platform.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the attackers altered web-server configuration files so deceptive .deb and .sig files could run as PHP web shells. They deployed WHIPSHOT to receive Base64-encoded commands through HTTP headers and SLAPSHOT to forward network traffic to internal systems for reconnaissance and credential theft. The activity highlights the risk posed by internet-exposed edge appliances, and GreyNoise reported that exploitation of CVE-2026-88771 and CVE-2026-88772 escalated into broad web-shell and malware deployment on September 28, 2026.\u003c/p\u003e\n"},{"n":25,"title":"Cisco Warns of Attackers Exploiting Critical Authentication Bypass in SD-WAN Manager","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/cisco-warns-of-attackers-exploiting.html","time":"15:24","priority":"MUST READ","score":98,"tldr":"Cisco is warning that attackers are actively exploiting CVE-2026-76504, a critical authentication-bypass flaw in Catalyst SD-WAN Manager that can grant unauthenticated remote attackers administrator-level API access. Organizations should immediately upgrade to Cisco’s fixed releases, restrict management access from the internet, and review logs for suspicious encoded j_security_check requests.","briefOverview":"\u003cp\u003eCisco warned that attackers are actively exploiting CVE-2026-76504, a critical authentication-bypass flaw in Cisco Catalyst SD-WAN Manager. The vulnerability has a CVSS score of 9.8 and can let a remote attacker without credentials use the Manager API as the administrator. Cisco said the issue was discovered while its Technical Assistance Center handled a support case and that its security team became aware of active exploitation in September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw results from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for an API endpoint. Internet-exposed Managers are at particular risk because the default administrator account has the netadmin role, which can perform all operations on the device. Cisco has released fixed versions for supported release trains and says no workaround exists; it advises restricting access from unsecured networks until upgrades are completed. Customers should also review specified logs for suspicious encoded j_security_check requests from unknown IP addresses, although these entries can occur during normal activity and require validation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco reported active exploitation of CVE-2026-76504, a critical authentication bypass vulnerability in Cisco Catalyst SD-WAN Manager with a CVSS score of 9.8.","The flaw lets an unauthenticated remote attacker use the SD-WAN Manager API as the administrator by sending a crafted request that abuses URI encoding.","Cisco has released fixes for affected SD-WAN Manager release trains, and states that no workaround is available.","Cisco advises organizations to restrict SD-WAN Manager access from unsecured networks, particularly the internet, until they can upgrade.","Customers can review specified SD-WAN Manager logs for suspicious encoded j_security_check requests from unknown or unauthorized IP addresses."],"insights":["Organizations that upgraded for the Cisco SD-WAN flaws disclosed in May or June 2026 may still be vulnerable, because the fixes for CVE-2026-76504 require newer releases.","Cisco’s log example encodes the letter “j” in j_security_check, but any character in the request path can be encoded, so defenders should not search only for the specific %6a pattern.","The relevant log entries can also occur during normal operation, meaning suspicious requests must be compared with expected activity to avoid false positives.","Cisco does not state whether applying the update removes an attacker who already obtained access, while earlier SD-WAN advisories warned that updating alone would not resolve a confirmed compromise.","Cisco SD-WAN Cloud (Cisco Managed) is already fixed in release 20.15.605, and customers using that service do not need to take action."],"referencedReports":[{"title":"Cisco Catalyst SD-WAN Manager Web Authentication Bypass Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-sdwan-webauth-xr8beuuU","publisher":"cisco","context":"Cisco's advisory discloses CVE-2026-76504, confirms active exploitation, and provides affected releases and mitigation guidance.","category":"advisory","primary":true},{"title":"Cisco Catalyst SD-WAN Hardening Guide","url":"https://sec.cloudapps.cisco.com/security/center/resources/Cisco-Catalyst-SD-WAN-HardeningGuide","publisher":"cisco","context":"The article cites Cisco's hardening guide for its recommendation not to expose SD-WAN Manager administrative interfaces directly to the internet.","category":"guide","primary":false}],"body":"\u003cp\u003eCisco warned that attackers are actively exploiting CVE-2026-76504, a critical authentication-bypass flaw in Cisco Catalyst SD-WAN Manager. The vulnerability has a CVSS score of 9.8 and can let a remote attacker without credentials use the Manager API as the administrator. Cisco said the issue was discovered while its Technical Assistance Center handled a support case and that its security team became aware of active exploitation in September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe flaw results from improper handling of URI encoding in HTTP requests, allowing a crafted request to bypass an authentication rule for an API endpoint. Internet-exposed Managers are at particular risk because the default administrator account has the netadmin role, which can perform all operations on the device. Cisco has released fixed versions for supported release trains and says no workaround exists; it advises restricting access from unsecured networks until upgrades are completed. Customers should also review specified logs for suspicious encoded j_security_check requests from unknown IP addresses, although these entries can occur during normal activity and require validation.\u003c/p\u003e\n"},{"n":27,"title":"Citrix NetScaler CVE-2026-88772 Exploit Details Show Pre-Auth Path to Shellcode Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/citrix-netscaler-cve-2026-88772-exploit.html","time":"05:30","priority":"MUST READ","score":98,"tldr":"Researchers showed that actively exploited Citrix NetScaler CVE-2026-88772 is a pre-authentication DTLS buffer overflow that can be chained into root-level remote code execution. Organizations using affected NetScaler ADC or Gateway systems should urgently apply Citrix’s patches and hunt for compromise.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed technical details of CVE-2026-88772, a critical Citrix NetScaler ADC and Gateway flaw with a CVSS score of 9.5 that is being actively exploited. The issue affects DTLS handling in the NetScaler Packet Processing Engine and can allow remote code execution or denial of service. CISA has added the vulnerability to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eAccording to watchTowr, the flaw stems from inconsistent handling of DTLS message fragment sizes during reassembly. Attackers can send records that claim to provide only one byte each while causing NetScaler to retain much larger packet data, eventually overflowing a 35,840-byte scratch buffer. watchTowr found that this pre-authentication overflow can be used to redirect execution to attacker-controlled shellcode with root-level privileges by using mprotect() to bypass no-execute protections. CVE-2026-88771 has also been exploited alongside CVE-2026-88772, and watchTowr released a proof of concept for that vulnerability.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-88772 is a critical Citrix NetScaler ADC and Gateway flaw with a CVSS score of 9.5 that is under active exploitation in the wild.","The vulnerability is a memory overflow in DTLS handling within the NetScaler Packet Processing Engine that can enable remote code execution or denial of service.","The flaw arises because NetScaler trusts a small declared fragment size while retaining much larger packet data during message reassembly, allowing data to be written beyond a fixed-size buffer.","watchTowr demonstrated that the overflow can be used before authentication to redirect execution to attacker-controlled code with root-level privileges by using mprotect() to bypass no-execute protections.","CVE-2026-88771 has also been abused alongside CVE-2026-88772 in real-world attacks, and watchTowr released a proof of concept for it."],"insights":["A message that NetScaler considers only 120 bytes long can be assembled from 120 records that collectively retain about 174 KB of data, creating a large gap between the claimed message size and the actual data copied.","The exploit path does not require a user to sign in, meaning the vulnerable DTLS handling can be reached before authentication.","watchTowr found that the overflow can overcome no-execute memory protections by invoking the mprotect() system call, enabling attacker-controlled code to run with root-level privileges."],"referencedReports":[{"title":"Here We Go Again: Citrix NetScaler DTLS Pre-Auth Memory Overflow (CVE-2026-88772)","url":"https://labs.watchtowr.com/here-we-go-again-citrix-netscaler-dtls-preauth-memory-overflow-cve-2026-88772/#rop-to-shellcode-execution","publisher":"watchtowr","context":"The article relies on watchTowr's technical analysis to explain the DTLS reassembly flaw and its path to shellcode execution.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers disclosed technical details of CVE-2026-88772, a critical Citrix NetScaler ADC and Gateway flaw with a CVSS score of 9.5 that is being actively exploited. The issue affects DTLS handling in the NetScaler Packet Processing Engine and can allow remote code execution or denial of service. CISA has added the vulnerability to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eAccording to watchTowr, the flaw stems from inconsistent handling of DTLS message fragment sizes during reassembly. Attackers can send records that claim to provide only one byte each while causing NetScaler to retain much larger packet data, eventually overflowing a 35,840-byte scratch buffer. watchTowr found that this pre-authentication overflow can be used to redirect execution to attacker-controlled shellcode with root-level privileges by using mprotect() to bypass no-execute protections. CVE-2026-88771 has also been exploited alongside CVE-2026-88772, and watchTowr released a proof of concept for that vulnerability.\u003c/p\u003e\n"},{"n":28,"title":"Attackers Exploit Zimbra Flaw to Deploy Web Shells and Harvest Authentication Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-exploit-zimbra-flaw-to-deploy.html","time":"16:46","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting CVE-2026-73570 in Zimbra Collaboration Suite to gain unauthenticated remote code execution, deploy persistent web shells, steal mailbox and authentication secrets, and potentially exfiltrate email data. Organizations should urgently patch to Zimbra 10.1.20 or mitigate by removing zimbra-snmp, disabling SNMP notifications, restricting access, and rotating Zimbra secrets.","briefOverview":"\u003cp\u003eThreat actors exploited CVE-2026-73570, a now-patched unauthenticated command-injection flaw in Zimbra Collaboration Suite. The flaw can allow remote command execution through a specially crafted SMTP request when SNMP notifications are enabled and the optional zimbra-snmp package is installed. Zimbra released a fix in version 10.1.20 in July 2026, and CISA later added the issue to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft observed attackers deploy JSP web shells, reverse shells, recurring execution through cron or systemd, and memory-backed execution. The activity included privilege escalation, collection of Zimbra configuration and authentication secrets, access to mailbox data, and use of Zimbra SSH credentials to move between trusted cluster nodes. In one case, attackers archived mailbox-backup content and attempted to transfer it to Azure Blob Storage using AzCopy, although Microsoft could not confirm the transfer completed.\u003c/p\u003e\n\n\u003cp\u003eOrganizations in more than one region and industry were affected, though Microsoft said not every compromised host showed every stage of the attack chain. Attackers sometimes restored directory permissions after deploying web shells, reducing the visibility of the change during basic checks. Organizations are advised to patch immediately or remove zimbra-snmp, disable SNMP notifications, restrict SNMP and SMTP access, rotate Zimbra authentication secrets, and scan systems for redundant web-shell persistence.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers exploited CVE-2026-73570, an unauthenticated command-injection flaw in Zimbra Collaboration Suite that can allow remote code execution when SNMP notifications are enabled and the optional zimbra-snmp package is installed.","Microsoft observed attackers deploying JSP web shells and reverse shells, escalating privileges, establishing persistence, and accessing email, authentication, and mailbox data on compromised Zimbra servers.","The attackers used Zimbra service and authentication secrets to query LDAP for high-value attributes, including zimbraPreAuthKey, zimbraAuthTokenKey, and zimbraTwoFactorAuthSecret.","Zimbra patched the flaw in version 10.1.20 in July 2026, and CISA later added CVE-2026-73570 to its Known Exploited Vulnerabilities catalog.","Organizations are advised to apply the update immediately or, if patching is not possible, uninstall zimbra-snmp, disable SNMP notifications, restrict SNMP and SMTP access, rotate Zimbra authentication secrets, and scan for web shells."],"insights":["Microsoft observed scanning of the vulnerable command path between July 28 and August 7, 2026, before public disclosure on August 13, indicating attackers were testing exposed servers shortly after Zimbra released the patch.","Attackers sometimes temporarily made a public directory writable to place a web shell and then restored its permissions, which can make a simple check of current directory permissions insufficient for detecting the intrusion.","Rather than seeking individual mailbox passwords, the attackers targeted centralized Zimbra configuration secrets that enabled authenticated LDAP queries for pre-authentication keys, authentication-token keys, and two-factor-authentication secrets.","The activity included use of Zimbra's existing SSH identity and rsync to copy web shells and helper scripts among trusted nodes, meaning a compromised server could be used to reach other systems in a Zimbra cluster.","One observed operation staged mailbox-backup data in a local archive and attempted to send it to Azure Blob Storage with AzCopy, although Microsoft could not confirm that the transfer succeeded."],"referencedReports":[{"title":"Unauthenticated command injection on internet-facing mail servers: Tracking CVE-2026-73570","url":"https://www.microsoft.com/en-us/security/blog/2026/09/30/unauthenticated-command-injection-on-internet-facing-mail-servers-tracking-cve-2026-73570/","publisher":"microsoft","context":"The article relies on Microsoft's technical analysis of active exploitation, including web shells, persistence, credential theft, mailbox collection, and attempted data transfer.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors exploited CVE-2026-73570, a now-patched unauthenticated command-injection flaw in Zimbra Collaboration Suite. The flaw can allow remote command execution through a specially crafted SMTP request when SNMP notifications are enabled and the optional zimbra-snmp package is installed. Zimbra released a fix in version 10.1.20 in July 2026, and CISA later added the issue to its Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft observed attackers deploy JSP web shells, reverse shells, recurring execution through cron or systemd, and memory-backed execution. The activity included privilege escalation, collection of Zimbra configuration and authentication secrets, access to mailbox data, and use of Zimbra SSH credentials to move between trusted cluster nodes. In one case, attackers archived mailbox-backup content and attempted to transfer it to Azure Blob Storage using AzCopy, although Microsoft could not confirm the transfer completed.\u003c/p\u003e\n\n\u003cp\u003eOrganizations in more than one region and industry were affected, though Microsoft said not every compromised host showed every stage of the attack chain. Attackers sometimes restored directory permissions after deploying web shells, reducing the visibility of the change during basic checks. Organizations are advised to patch immediately or remove zimbra-snmp, disable SNMP notifications, restrict SNMP and SMTP access, rotate Zimbra authentication secrets, and scan systems for redundant web-shell persistence.\u003c/p\u003e\n"},{"n":8,"title":"Bitget hacked via zero-day in third-party security products","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bitget-hacked-via-zero-day-in-third-party-security-products/","time":"11:11","priority":"MUST READ","score":93,"tldr":"Bitget says attackers stole $387.5 million from its hot and warm wallets after exploiting zero-day flaws in two unnamed third-party security appliances, then moving laterally into its production wallet environment. Investigators found web shells, malicious packages, and a custom withdrawal tool; Bitget attributes the heist to North Korean hackers.","briefOverview":"\u003cp\u003eBitget said attackers stole $387.5 million from its hot and warm cryptocurrency wallets after exploiting zero-day flaws in two unnamed third-party security products. The exchange suspended withdrawals after detecting unauthorized transfers affecting assets including ETH, XRP, BNB, AVAX, USDT, and USDC across several blockchains. Bitget has since launched a recovery bounty program offering 5% to people who help recover or freeze the stolen funds.\u003c/p\u003e\n\n\u003cp\u003eInvestigations by SlowMist and Mandiant found that attackers gained privileged access to two security appliances and used persistent access on one to move into Bitget’s production wallet job server. The attackers deployed a web shell, malicious packages, and a custom withdrawal tool; SlowMist identified malicious activity as early as August 31 and said the theft lasted nearly three hours. Bitget CEO Gracy Chen attributed the incident to North Korean hackers, citing IP behavior patterns and on-chain analysis, while the affected third-party products and zero-day flaws were not publicly identified.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bitget said attackers stole $387.5 million from its hot and warm cryptocurrency wallets after exploiting zero-day flaws in two unnamed third-party security products.","SlowMist and Mandiant found that the attackers obtained privileged access to the security appliances, placed a web shell on one of them, and then moved into Bitget’s production wallet job server.","The attackers deployed malicious packages and a custom withdrawal tool, with unauthorized transfers occurring for nearly three hours across multiple blockchains.","Bitget suspended withdrawals after detecting the unauthorized transfers and later launched a recovery bounty program offering 5% to people who help recover or freeze stolen funds.","Bitget CEO Gracy Chen attributed the incident to North Korean hackers based on IP behavior patterns and on-chain analysis."],"insights":["The earliest identified malicious activity was August 31, weeks before the theft, indicating the attackers had access to Bitget’s environment before the withdrawal activity was detected.","The intruders reportedly read a database password from an environment variable after exploiting one security-product node, showing that access to a single affected service led to database access.","Bitget said the attackers spoofed transaction data to trigger its authorization process, meaning the theft relied on manipulating the system used to approve fund movements rather than simply bypassing withdrawals.","The names of the exploited third-party security products and the zero-day flaws were not disclosed in the article, limiting other organizations’ ability to determine whether they use the affected technology."],"referencedReports":[{"title":"SlowMist Investigation Progress Report - Bitget","url":"https://github.com/slowmist/Knowledge-Base/blob/master/open-report-V2/incident-response/SlowMist%20Investigation%20Progress%20Report%20-%20Bitget_en-us.pdf","publisher":"slowmist","context":"The article cites SlowMist's investigation for details on the initial zero-day compromise, hidden scripts, database access, and timing of the theft.","category":"research","primary":true},{"title":"MFR26-1029 Status Update Bitget 0930","url":"https://img.bgstatic.com/multiLang/events/MFR26-1029_Status_Update_Bitget_0930.pdf","publisher":"mandiant","context":"The article cites Mandiant's forensic findings on privileged access to two third-party appliances, web-shell deployment, lateral movement, and malicious packages.","category":"research","primary":true}],"body":"\u003cp\u003eBitget said attackers stole $387.5 million from its hot and warm cryptocurrency wallets after exploiting zero-day flaws in two unnamed third-party security products. The exchange suspended withdrawals after detecting unauthorized transfers affecting assets including ETH, XRP, BNB, AVAX, USDT, and USDC across several blockchains. Bitget has since launched a recovery bounty program offering 5% to people who help recover or freeze the stolen funds.\u003c/p\u003e\n\n\u003cp\u003eInvestigations by SlowMist and Mandiant found that attackers gained privileged access to two security appliances and used persistent access on one to move into Bitget’s production wallet job server. The attackers deployed a web shell, malicious packages, and a custom withdrawal tool; SlowMist identified malicious activity as early as August 31 and said the theft lasted nearly three hours. Bitget CEO Gracy Chen attributed the incident to North Korean hackers, citing IP behavior patterns and on-chain analysis, while the affected third-party products and zero-day flaws were not publicly identified.\u003c/p\u003e\n"},{"n":10,"title":"DIVD says Zammad zero-days enabled AI-driven network breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/divd-says-zammad-zero-days-enabled-ai-driven-network-breach/","time":"19:49","priority":"MUST READ","score":93,"tldr":"DIVD says attackers used two zero-day flaws in the Zammad ticketing system to hijack sessions, execute code, and gain root access within seconds through an autonomous AI agent. Zammad users are urged to upgrade to version 7 or take vulnerable instances offline.","briefOverview":"\u003cp\u003eThe Dutch Institute for Vulnerability Disclosure (DIVD) says its network was breached through a chain of two zero-day vulnerabilities in the open-source Zammad ticketing system. The organization says an autonomous AI agent conducted the intrusion, choosing its next steps without outside direction. DIVD was able to reconstruct the incident in detail because the agent left explanations of its decisions.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities, CVE-2026-102489 and CVE-2026-102490, reportedly allowed session hijacking, remote code execution, and privilege escalation from a Zammad user to root access in seconds. The attacker accessed other services and read and exfiltrated data, though network segmentation and incident-response actions prevented deeper movement into DIVD\u0026rsquo;s network. DIVD and Merlon Security notified Zammad, and DIVD recommends users upgrade to version 7 or take vulnerable instances offline while its investigation continues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DIVD says its network breach resulted from a chain of two zero-day vulnerabilities in the open-source Zammad ticketing system.","The flaws, CVE-2026-102489 and CVE-2026-102490, enabled session hijacking, remote code execution, and escalation from a Zammad user account to root privileges.","DIVD said an autonomous AI agent carried out the attack and left explanations of its decisions that helped investigators reconstruct the incident.","The attacker accessed other services and read and exfiltrated data, but network segmentation and incident-response actions prevented deeper movement through DIVD's network.","DIVD recommends that Zammad users upgrade to version 7 or take their instances offline as soon as possible."],"insights":["The AI agent reportedly left clear explanations of its decisions, giving DIVD unusually detailed evidence to reconstruct how the intrusion unfolded.","Combining the two Zammad flaws allowed an attacker to progress from taking over a user session to obtaining full system control in seconds, according to DIVD.","Network segmentation and DIVD’s incident-response actions limited the attacker’s ability to move further into the organization despite access to other services and data.","DIVD and Merlon Security identified the flaws and notified Zammad while the incident investigation remains ongoing."],"referencedReports":[],"body":"\u003cp\u003eThe Dutch Institute for Vulnerability Disclosure (DIVD) says its network was breached through a chain of two zero-day vulnerabilities in the open-source Zammad ticketing system. The organization says an autonomous AI agent conducted the intrusion, choosing its next steps without outside direction. DIVD was able to reconstruct the incident in detail because the agent left explanations of its decisions.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities, CVE-2026-102489 and CVE-2026-102490, reportedly allowed session hijacking, remote code execution, and privilege escalation from a Zammad user to root access in seconds. The attacker accessed other services and read and exfiltrated data, though network segmentation and incident-response actions prevented deeper movement into DIVD\u0026rsquo;s network. DIVD and Merlon Security notified Zammad, and DIVD recommends users upgrade to version 7 or take vulnerable instances offline while its investigation continues.\u003c/p\u003e\n"},{"n":32,"title":"China-nexus UAT-11587 targets government and policy organizations across Asia with Antino backdoor","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/china-nexus-uat-11587-targets-government-and-policy-organizations-across-asia-with-antino-backdoor/","time":"10:00","priority":"MUST READ","score":90,"tldr":"Cisco Talos reports that China-nexus UAT-11587 has targeted government, policy, and security-related organizations across Asia with Antino, a Rust Windows backdoor that uses Microsoft 365 Outlook and OneDrive as stealthy command-and-control dead drops. The campaign relies on tailored spear-phishing lures, Cloudflare-hosted multi-stage loaders, .NET deserialization, and signed-binary DLL sideloading to establish persistent access and collect intelligence.","briefOverview":"\u003cp\u003eCisco Talos identified UAT-11587, a cluster it assesses with high confidence is China-nexus, targeting government, policy, defense, diplomatic, security, academic, and civil-society organizations across Asia. Talos observed activity from September 2025 through July 2026 and identified at least 16 affected or targeted institutional environments and approximately 350 compromised endpoints. The reported countries include Taiwan, India, the Philippines, Cambodia, Pakistan, Thailand, Myanmar, and Syria, and Talos assesses the activity is an intelligence-gathering operation.\u003c/p\u003e\n\n\u003cp\u003eThe actor used tailored spear-phishing emails and decoy documents, including fake Gmail attachment cards, to direct victims to Cloudflare-hosted HTA or WSF files. Its five-stage infection chain used JavaScript downloaders, RC4 decryption, unsafe .NET BinaryFormatter deserialization, and DLL sideloading through the Microsoft-signed GatherOsState.exe binary to launch the Antino backdoor. Antino is a Rust-compiled Windows backdoor that supports reconnaissance, command and PowerShell execution, file transfers, in-memory shellcode loading, and Registry Run persistence. It communicates exclusively through Microsoft Graph, using Outlook messages for commands and OneDrive files for check-ins, tool delivery, and data collection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos assessed with high confidence that UAT-11587 is a China-nexus actor targeting government and policy-related organizations across Asia.","Talos identified at least 16 affected or targeted institutional environments and approximately 350 compromised endpoints across Taiwan, India, the Philippines, Cambodia, Pakistan, Thailand, Myanmar, and Syria by July 2026.","The group used tailored spear-phishing emails, including fake Gmail attachment previews, to deliver a five-stage infection chain hosted largely on Cloudflare services.","The final payload, Antino, is a Rust-compiled Windows backdoor that can collect host information, execute commands, transfer files, load code into memory, and create persistence.","Antino uses Microsoft Graph to communicate through Outlook and OneDrive, allowing its command-and-control traffic to use widely trusted Microsoft 365 services."],"insights":["The phishing emails could pass SPF checks while still spoofing trusted visible senders because the attacker used an authorized envelope-sender domain and exploited non-enforcing DMARC policies on impersonated domains.","The fake Gmail attachment cards used protocol-relative links beginning with \"//\", which the article notes may be missed by security tools that only extract fully qualified HTTP or HTTPS URLs.","The infection chain used two serialized .NET resources in sequence, with the first apparently intended to bypass a security check and the second loading the next-stage DLL directly into the mshta.exe process.","Antino’s OneDrive folder names are from the operator’s perspective: antino_uploads contains tools sent to victims, while antino_downloads contains files taken from victims.","Antino can reduce the visibility of loaded code by encrypting it and making its memory non-executable while it sleeps, then restoring it only when execution resumes."],"referencedReports":[{"title":"Jewelbug: Crypto Fraud and Espionage","url":"https://www.security.com/threat-intelligence/jewelbug-crypto-fraud-espionage","publisher":"symantec","context":"Talos cites Symantec's research on Jewelbug and notes overlaps with UAT-11587 and Antino-related espionage activity.","category":"research","primary":false},{"title":"UNC6384 Weaponizes ZDI-CAN-25373 Vulnerability to Deploy PlugX","url":"https://arcticwolf.com/resources/blog/unc6384-weaponizes-zdi-can-25373-vulnerability-to-deploy-plugx/","publisher":"arctic-wolf","context":"Talos references Arctic Wolf's prior reporting because a UAT-11587 downloader used the same CloudFront distribution reported in UNC6384 delivery activity.","category":"research","primary":false}],"body":"\u003cp\u003eCisco Talos identified UAT-11587, a cluster it assesses with high confidence is China-nexus, targeting government, policy, defense, diplomatic, security, academic, and civil-society organizations across Asia. Talos observed activity from September 2025 through July 2026 and identified at least 16 affected or targeted institutional environments and approximately 350 compromised endpoints. The reported countries include Taiwan, India, the Philippines, Cambodia, Pakistan, Thailand, Myanmar, and Syria, and Talos assesses the activity is an intelligence-gathering operation.\u003c/p\u003e\n\n\u003cp\u003eThe actor used tailored spear-phishing emails and decoy documents, including fake Gmail attachment cards, to direct victims to Cloudflare-hosted HTA or WSF files. Its five-stage infection chain used JavaScript downloaders, RC4 decryption, unsafe .NET BinaryFormatter deserialization, and DLL sideloading through the Microsoft-signed GatherOsState.exe binary to launch the Antino backdoor. Antino is a Rust-compiled Windows backdoor that supports reconnaissance, command and PowerShell execution, file transfers, in-memory shellcode loading, and Registry Run persistence. It communicates exclusively through Microsoft Graph, using Outlook messages for commands and OneDrive files for check-ins, tool delivery, and data collection.\u003c/p\u003e\n"},{"n":9,"title":"Russian state hackers use new RedFlick technique to push malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/russian-state-hackers-use-new-redflick-technique-to-push-malware/","time":"20:34","priority":"SHOULD READ","score":88,"tldr":"Microsoft says Russia-linked Star Blizzard is using a new RedFlick phishing chain that needs only one click on a disguised shortcut to install the CosmicPulse backdoor. The campaign targets Ukraine-related organizations, governments, NGOs, think tanks, and financial institutions, using VHDX files, scheduled tasks, and remote payload delivery to automate infection.","briefOverview":"\u003cp\u003eMicrosoft reports that the Russian state actor Star Blizzard is using a new phishing delivery method called RedFlick to deploy the CosmicPulse backdoor. The technique begins with an email invitation followed by a password-protected ZIP or RAR archive containing a VHDX virtual disk and a shortcut disguised as a PDF. Opening the shortcut runs hidden commands while displaying a decoy PDF, reducing victim interaction to a single click.\u003c/p\u003e\n\n\u003cp\u003eThe hidden commands install scheduled tasks that collect computer and user details, prepare Windows WebDAV access, and launch a remotely hosted next-stage payload. A downloader called NOROBOT and BAITSWITCH retrieves Python components and an encrypted CosmicPulse payload, which can execute attacker-supplied Python code, download and run files, and retrieve documents from infected systems. Microsoft observed at least 13 large-scale phishing campaigns affecting more than 100 organizations, primarily in the United States and United Kingdom, including Ukrainian targets and organizations that support Ukraine politically or financially.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reports that the Russian state actor Star Blizzard is using a new phishing delivery method called RedFlick to deploy its CosmicPulse backdoor.","RedFlick emails deliver a password-protected archive containing a VHDX virtual disk and a shortcut disguised as a PDF, which runs hidden commands while showing the victim a decoy document.","The infection chain installs scheduled tasks that collect system and user information, enable access to remote web resources, and launch a remotely hosted follow-on payload.","The NOROBOT and BAITSWITCH downloader retrieves Python components and an encrypted CosmicPulse payload, whose backdoor can execute attacker-supplied Python code, download and run files, and retrieve documents from infected systems.","Microsoft observed at least 13 large-scale phishing campaigns since the start of the year affecting more than 100 organizations, primarily in the United States and the United Kingdom, including Ukraine-related targets and organizations supporting Ukraine."],"insights":["RedFlick reduces the victim interaction required for infection to opening a single disguised shortcut, unlike Star Blizzard’s earlier ClickFix campaigns that required multiple manual actions.","The use of three scheduled tasks with separate functions distributes the infection process across stages, which Microsoft says helps the attackers evade detection.","The malware chain uses Windows WebDAV functionality and Control Panel applets to retrieve and run remotely hosted components rather than placing all malicious code in the original attachment.","Star Blizzard continues to rely on impersonation of trusted contacts or organizations and free email providers even as it changes its technical delivery methods.","Microsoft recommends phishing-resistant sign-in methods, Conditional Access, email protection, independent verification of suspicious messages, and EDR block mode to reduce the risk from these campaigns."],"referencedReports":[{"title":"Star Blizzard refines phishing and malware delivery with the RedFlick technique","url":"https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/","publisher":"microsoft","context":"Microsoft's technical report provides the analysis of the RedFlick infection chain and its CosmicPulse delivery components.","category":"research","primary":true},{"title":"New malware from Russia's COLDRIVER","url":"http://cloud.google.com/blog/topics/threat-intelligence/new-malware-russia-coldriver","publisher":"google","context":"The article cites Google's October 2025 report for previously documented CosmicPulse backdoor capabilities.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft reports that the Russian state actor Star Blizzard is using a new phishing delivery method called RedFlick to deploy the CosmicPulse backdoor. The technique begins with an email invitation followed by a password-protected ZIP or RAR archive containing a VHDX virtual disk and a shortcut disguised as a PDF. Opening the shortcut runs hidden commands while displaying a decoy PDF, reducing victim interaction to a single click.\u003c/p\u003e\n\n\u003cp\u003eThe hidden commands install scheduled tasks that collect computer and user details, prepare Windows WebDAV access, and launch a remotely hosted next-stage payload. A downloader called NOROBOT and BAITSWITCH retrieves Python components and an encrypted CosmicPulse payload, which can execute attacker-supplied Python code, download and run files, and retrieve documents from infected systems. Microsoft observed at least 13 large-scale phishing campaigns affecting more than 100 organizations, primarily in the United States and United Kingdom, including Ukrainian targets and organizations that support Ukraine politically or financially.\u003c/p\u003e\n"},{"n":17,"title":"Russian FSB-linked hackers scale up phishing attacks against Ukraine supporters","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-hackers-ukraine-blizzard","time":"12:00","priority":"SHOULD READ","score":87,"tldr":"Microsoft reports that the FSB-linked Star Blizzard group has expanded phishing campaigns against Ukraine supporters and global organizations, targeting more than 100 entities primarily in the U.S. and UK. The group’s new RedFlick delivery method installs the CosmicPulse backdoor with fewer victim actions, improving scale and evasion.","briefOverview":"\u003cp\u003eMicrosoft reported that the Russian FSB-linked Star Blizzard group expanded its phishing operations in 2026, affecting more than 100 organizations, primarily in the United States and United Kingdom. The group targets Ukrainian individuals and institutions as well as NGOs, think tanks, governments, and financial institutions that support Ukraine. Researchers observed a shift from highly targeted spear-phishing to campaigns containing tens or hundreds of emails, with at least 13 large-scale campaigns identified since January.\u003c/p\u003e\n\n\u003cp\u003eEarly campaigns impersonated Ukrainian authorities and used claims about tax audits or unpaid fines to target Ukr.net users. From March, the group used accounts created on compromised websites and sent fake invitations or messages made to look like internal communications from reputable organizations. Its RedFlick method sends a password-protected archive after a victim responds, then uses scheduled tasks to install the CosmicPulse backdoor with only one victim action, replacing the more involved ClickFix approach.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that the Russian FSB-linked Star Blizzard group expanded phishing operations in 2026, affecting more than 100 organizations primarily in the United States and United Kingdom.","Star Blizzard targeted Ukrainian individuals and institutions as well as international NGOs, think tanks, governments, and financial institutions that support Ukraine politically or financially.","Researchers identified at least 13 large-scale Star Blizzard phishing campaigns since January, reflecting a shift from highly targeted messages to campaigns involving tens or hundreds of emails.","Since March, the group has used accounts created on compromised websites and sent fake conference or event invitations impersonating reputable think tanks or NGOs.","Star Blizzard’s RedFlick method delivers the CosmicPulse backdoor through a password-protected archive and requires only one victim action, unlike its earlier ClickFix method."],"insights":["Star Blizzard moved from highly tailored spear-phishing to campaigns of tens or hundreds of emails, with Microsoft identifying at least 13 large-scale campaigns since January 2026.","The group changed its sender infrastructure in March by using accounts created on compromised websites instead of primarily relying on free email accounts impersonating familiar people.","Some campaigns targeted multiple people within the same organization and made the messages appear to be internal communications, rather than only impersonating outside contacts or event organizers.","RedFlick reduces the required victim interaction to one action while using scheduled tasks to install CosmicPulse and make the activity harder to detect.","Microsoft said the group’s early Ukraine-focused campaigns may have been used to test its new capabilities before targeting organizations globally."],"referencedReports":[{"title":"Star Blizzard refines phishing and malware delivery with the RedFlick technique","url":"https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/","publisher":"microsoft","context":"The article cites Microsoft’s report as the source for details on Star Blizzard’s expanded phishing campaigns and its RedFlick malware-delivery method.","category":"research","primary":true}],"body":"\u003cp\u003eMicrosoft reported that the Russian FSB-linked Star Blizzard group expanded its phishing operations in 2026, affecting more than 100 organizations, primarily in the United States and United Kingdom. The group targets Ukrainian individuals and institutions as well as NGOs, think tanks, governments, and financial institutions that support Ukraine. Researchers observed a shift from highly targeted spear-phishing to campaigns containing tens or hundreds of emails, with at least 13 large-scale campaigns identified since January.\u003c/p\u003e\n\n\u003cp\u003eEarly campaigns impersonated Ukrainian authorities and used claims about tax audits or unpaid fines to target Ukr.net users. From March, the group used accounts created on compromised websites and sent fake invitations or messages made to look like internal communications from reputable organizations. Its RedFlick method sends a password-protected archive after a victim responds, then uses scheduled tasks to install the CosmicPulse backdoor with only one victim action, replacing the more involved ClickFix approach.\u003c/p\u003e\n"},{"n":3,"title":"CISA warns of critical pre-auth RCE flaw in MikroTik RouterOS","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-critical-pre-auth-rce-flaw-in-mikrotik-routeros/","time":"15:49","priority":"SHOULD READ","score":86,"tldr":"CISA warns that MikroTik RouterOS has a critical pre-authentication integer-underflow flaw, CVE-2026-84411, that can allow a remote attacker to execute code as root or crash a device with one crafted HTTP request. Organizations should update RouterOS and ensure management interfaces are not exposed to the internet.","briefOverview":"\u003cp\u003eCISA has warned about CVE-2026-84411, a critical flaw in MikroTik RouterOS web-management HTTP request handling. The issue is an integer underflow that can be reached before authentication, meaning an attacker does not need to log in first. According to CISA, one crafted request could enable remote code execution with root privileges or cause a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eCISA said RouterOS versions below 7.24 are affected, but also stated that MikroTik recommends updating to version 7.23 or later, creating conflicting version guidance. The article notes that RouterOS 7.24.4 is the latest stable release and 7.23.7 is the latest long-term release, while MikroTik had not published its own advisory at publication time. CISA said it was not aware of active exploitation, but recommended keeping control systems off the internet, isolating control networks, and using updated VPNs for remote access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned of CVE-2026-84411, a critical pre-authentication integer underflow in MikroTik RouterOS web-management HTTP request handling.","A single crafted request can allow an unauthenticated network attacker to execute code with root privileges or cause a denial-of-service condition.","CISA said RouterOS versions below 7.24 are affected, while also stating that MikroTik recommends updating to version 7.23 or later.","CISA said it has no knowledge of active exploitation of CVE-2026-84411.","CISA recommends keeping control systems off the internet, isolating control networks from business networks, and using updated VPNs for remote access."],"insights":["The patch guidance is internally inconsistent: CISA identifies versions below 7.24 as affected but also says MikroTik recommends updating to 7.23 or later, even though 7.23 is below that threshold.","The flaw is reachable before login and can be triggered with a single crafted web request, making exposed RouterOS management services particularly important to restrict.","Although CISA has no evidence of active exploitation of this specific issue, the article notes that attackers recently used two other MikroTik RouterOS flaws together to take full control of internet-exposed devices with SSH enabled."],"referencedReports":[{"title":"ICSA-26-272-06","url":"https://www.cisa.gov/news-events/ics-advisories/icsa-26-272-06","publisher":"cisa","context":"The article cites CISA's advisory describing the pre-authentication RouterOS flaw and its potential for root-level code execution or denial of service.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA has warned about CVE-2026-84411, a critical flaw in MikroTik RouterOS web-management HTTP request handling. The issue is an integer underflow that can be reached before authentication, meaning an attacker does not need to log in first. According to CISA, one crafted request could enable remote code execution with root privileges or cause a denial-of-service condition.\u003c/p\u003e\n\n\u003cp\u003eCISA said RouterOS versions below 7.24 are affected, but also stated that MikroTik recommends updating to version 7.23 or later, creating conflicting version guidance. The article notes that RouterOS 7.24.4 is the latest stable release and 7.23.7 is the latest long-term release, while MikroTik had not published its own advisory at publication time. CISA said it was not aware of active exploitation, but recommended keeping control systems off the internet, isolating control networks, and using updated VPNs for remote access.\u003c/p\u003e\n"},{"n":5,"title":"TeamViewer urges users to patch severe flaws “as soon as possible”","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/teamviewer-urges-users-to-patch-severe-flaws-as-soon-as-possible/","time":"12:25","priority":"SHOULD READ","score":86,"tldr":"TeamViewer is urging customers to update Full Client and Host software to version 15.82 immediately to fix five high-severity flaws, including an access-control bypass that could enable remote code execution. The company says it has found no evidence of public exploits or active exploitation.","briefOverview":"\u003cp\u003eTeamViewer has urged customers to update its Full Client and Host software as soon as possible after releasing fixes for five high-severity vulnerabilities. The company recommends updating to TeamViewer version 15.82, with fixes also available in supported maintenance and legacy releases. TeamViewer said it is not aware of public exploit code, public disclosure, or active exploitation of the flaws.\u003c/p\u003e\n\n\u003cp\u003eThe most severe vulnerability, CVE-2026-92370, is an improper access-control issue affecting Windows, Linux, and macOS that could allow unauthorized actions leading to remote code execution. The other issues include path traversal, a heap-based buffer overflow, a race condition, and improper path validation; some could enable local attackers to run code as the current user or raise privileges to NT AUTHORITY/SYSTEM or root. The update is significant because criminals, including ransomware groups, have previously abused TeamViewer software for remote access and to deploy malicious tools.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["TeamViewer urged users to update its Full Client and Host software to version 15.82 as soon as possible to address five high-severity security vulnerabilities.","The most severe issue, CVE-2026-92370, is an access-control weakness affecting Windows, Linux, and macOS that could allow unauthorized actions leading to remote code execution.","The other fixes address a path traversal flaw, a heap-based buffer overflow, a race condition, and improper path validation that could allow local attackers to execute code or gain higher system privileges.","TeamViewer said the fixes are also available in supported maintenance and legacy releases.","The company said it is not aware of public disclosure, publicly available exploit code, or active exploitation of these vulnerabilities in the wild."],"insights":["TeamViewer described its call for immediate updating as a rare advisory, despite saying it has no evidence the flaws are being actively used.","The affected software runs on Windows, Linux, and macOS, so the update applies across major desktop operating systems.","Some of the flaws could allow an attacker to gain the privileges of the current user or elevate access to NT AUTHORITY/SYSTEM or root.","Updates are available not only in version 15.82 but also in supported maintenance and legacy releases.","The urgency is notable because TeamViewer software has previously been abused by criminals to remotely access systems and deploy malicious tools."],"referencedReports":[{"title":"TV-2026-1010 Security Bulletin","url":"https://www.teamviewer.com/en-us/resources/trust-center/security-bulletins/tv-2026-1010/","publisher":"teamviewer","context":"TeamViewer's security bulletin warns users to update and describes the fixes for multiple vulnerabilities in TeamViewer Full Client and Host software.","category":"advisory","primary":true}],"body":"\u003cp\u003eTeamViewer has urged customers to update its Full Client and Host software as soon as possible after releasing fixes for five high-severity vulnerabilities. The company recommends updating to TeamViewer version 15.82, with fixes also available in supported maintenance and legacy releases. TeamViewer said it is not aware of public exploit code, public disclosure, or active exploitation of the flaws.\u003c/p\u003e\n\n\u003cp\u003eThe most severe vulnerability, CVE-2026-92370, is an improper access-control issue affecting Windows, Linux, and macOS that could allow unauthorized actions leading to remote code execution. The other issues include path traversal, a heap-based buffer overflow, a race condition, and improper path validation; some could enable local attackers to run code as the current user or raise privileges to NT AUTHORITY/SYSTEM or root. The update is significant because criminals, including ransomware groups, have previously abused TeamViewer software for remote access and to deploy malicious tools.\u003c/p\u003e\n"},{"n":13,"title":"Mobile malware warning from Ukrainian researchers includes iPhone exploit kit","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-ssscip-mobile-malware-warning-ios-android","time":"14:00","priority":"SHOULD READ","score":84,"tldr":"Ukrainian authorities warn that Russia-linked hackers are increasingly targeting Ukrainian officials and military personnel with iPhone exploits and malicious Android apps to steal sensitive data. The campaigns use DarkSword watering-hole attacks against iOS and CamelSpy and BTMOB Android malware distributed through convincing decoy websites.","briefOverview":"\u003cp\u003eUkrainian authorities warned that Russian hackers are increasingly targeting the smartphones of Ukrainian military personnel, government officials, and civilians for intelligence gathering, further compromise, and financially motivated activity. Ukraine’s State Service of Special Communications and Information Protection said both Android and iOS devices are being targeted through malicious apps and sophisticated exploits. The activity is significant because smartphones play a growing role in communications among military personnel, government employees, and civilians.\u003c/p\u003e\n\n\u003cp\u003eOne tool, DarkSword, is an iPhone exploit kit used in watering-hole campaigns that compromise websites likely to be visited by targets, including Ukrainian news and government sites. By exploiting Safari and iOS vulnerabilities, it can steal credentials, messages, contacts, and call histories with little or no victim interaction, then rapidly remove traces of itself. Ukrainian authorities also identified UAC-0244 and UAC-0263 distributing CamelSpy and BTMOB Android malware through lure sites, while CERT-UA recorded 3,137 cyber incidents in the first half of 2026, an increase of about 8 percent from the prior six months.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukraine’s State Service of Special Communications and Information Protection warned that Russian hackers are increasingly targeting Android and iOS devices used by Ukrainian military personnel and government officials.","The DarkSword iPhone exploit kit has been used in watering-hole campaigns that compromised Ukrainian news and government websites to target Safari and iOS vulnerabilities.","Lookout reported that the suspected Russia-aligned group UNC6353 had used DarkSword against Ukrainian users since at least late 2025, including through a regional news outlet and a local court website.","UAC-0244 distributed CamelSpy through lure websites, while UAC-0263 used decoy sites offering air-raid alert and fuel-discount apps to distribute BTMOB.","CERT-UA recorded 3,137 cyber incidents in Ukraine during the first half of 2026, about 8 percent more than in the preceding six months."],"insights":["DarkSword can compromise iPhones through websites victims are likely to visit with little or no action required from the user, making ordinary browsing a potential entry point.","Unlike long-term phone-monitoring tools, DarkSword is designed to quickly collect sensitive data and then remove traces of itself within minutes.","The Android campaigns use practical local lures, including military-themed tests, air-raid alerts, and fuel discounts, rather than relying only on overtly military targets.","The reported increase to 3,137 incidents in the first half of 2026 shows that the mobile-focused activity is occurring within a broader rise in cyber incidents affecting Ukraine."],"referencedReports":[{"title":"Analytical Materials of the State Service of Special Communications and Information Protection of Ukraine","url":"https://cip.gov.ua/ua/statics/analitichni-materiali-derzhspeczv-yazku","publisher":"state-service-of-special-communications-and-information-protection-of-ukraine","context":"The article is based on a Ukrainian government report warning of increased mobile targeting of Ukrainian users.","category":"research","primary":true}],"body":"\u003cp\u003eUkrainian authorities warned that Russian hackers are increasingly targeting the smartphones of Ukrainian military personnel, government officials, and civilians for intelligence gathering, further compromise, and financially motivated activity. Ukraine’s State Service of Special Communications and Information Protection said both Android and iOS devices are being targeted through malicious apps and sophisticated exploits. The activity is significant because smartphones play a growing role in communications among military personnel, government employees, and civilians.\u003c/p\u003e\n\n\u003cp\u003eOne tool, DarkSword, is an iPhone exploit kit used in watering-hole campaigns that compromise websites likely to be visited by targets, including Ukrainian news and government sites. By exploiting Safari and iOS vulnerabilities, it can steal credentials, messages, contacts, and call histories with little or no victim interaction, then rapidly remove traces of itself. Ukrainian authorities also identified UAC-0244 and UAC-0263 distributing CamelSpy and BTMOB Android malware through lure sites, while CERT-UA recorded 3,137 cyber incidents in the first half of 2026, an increase of about 8 percent from the prior six months.\u003c/p\u003e\n"},{"n":20,"title":"OpenSSL Fixes High-Severity DTLS Flaw That Can Leak Heap Memory Unencrypted","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/openssl-fixes-high-severity-dtls-flaw.html","time":"08:09","priority":"SHOULD READ","score":84,"tldr":"OpenSSL patched high-severity CVE-2026-84782, a DTLS flaw that can leak unencrypted heap memory to a peer or crash affected applications during handshake retransmissions. Organizations using OpenSSL for DTLS should update to 4.0.3, 3.6.5, 3.5.9, or 3.4.8, while OpenSSL 3.0 users need vendor backports, paid support, or an upgrade to a supported branch.","briefOverview":"\u003cp\u003eOpenSSL released fixes on September 29 for CVE-2026-84782, a High-severity flaw in its DTLS implementation that can leak heap memory to the other side of a connection or crash the affected program. The issue affects software that uses OpenSSL for DTLS, which can protect WebRTC data channels and help establish encryption keys for internet calls. OpenSSL has not said whether an attacker can reliably trigger the condition, and it reported no known attacks exploiting the flaw.\u003c/p\u003e\n\n\u003cp\u003eThe bug can occur when DTLS retransmits an earlier handshake message while a larger handshake message is paused part-way through sending. Before the fix, the retransmission used the paused message\u0026rsquo;s buffer position rather than the beginning of the message being resent, which could send leftover heap bytes as unencrypted handshake data or read into unmapped memory and crash the program. Public fixes are available in OpenSSL 4.0.3, 3.6.5, 3.5.9, and 3.4.8, while fixes for older 3.0, 1.1.1, and 1.0.2 branches are limited to premium support customers; Ubuntu and Debian also released package updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenSSL fixed CVE-2026-84782, a High-severity DTLS flaw that can leak heap memory to the peer of a DTLS connection or crash the affected program.","The flaw occurs when a DTLS handshake message is retransmitted while a larger handshake message is only partly sent, causing the retransmission to use the wrong buffer position and potentially read beyond its buffer.","Public fixes are available in OpenSSL 4.0.3, 3.6.5, 3.5.9, and 3.4.8, while fixes for 3.0, 1.1.1, and 1.0.2 are limited to premium support customers.","The issue affects software only when it uses OpenSSL for DTLS, which is used for purposes including protecting WebRTC data channels and establishing encryption keys for internet calls.","CISA assigned CVE-2026-84782 a CVSS score of 8.2 and, as of September 29, listed no known exploitation."],"insights":["The flaw can expose leftover heap memory as unencrypted handshake data, not merely disrupt a connection, even though Ubuntu's notice describes only incorrect handshake behavior or denial of service.","There is no listed workaround for users unable to update, making a patched package, a move to a supported OpenSSL branch, or paid support the available options described in the article.","Organizations on OpenSSL 3.0 that compile or bundle their own copy cannot obtain a public upstream fix because 3.0.23 is available only through premium support, although Ubuntu has backported fixes for its 22.04 and 24.04 packages.","Distribution package versions may not match OpenSSL's upstream fixed release numbers: Ubuntu and Debian issued fixes in their own packages while retaining older-looking OpenSSL version lines."],"referencedReports":[{"title":"OpenSSL Security Advisory, September 29, 2026","url":"https://openssl-library.org/news/secadv/20260929.txt","publisher":"openssl-project","context":"The article cites OpenSSL's security advisory as the source announcing the high-severity CVE-2026-84782 fix.","category":"advisory","primary":true},{"title":"USN-8847-1: OpenSSL vulnerabilities","url":"https://ubuntu.com/security/notices/USN-8847-1","publisher":"ubuntu","context":"The article references Ubuntu's security notice for its assessment of the issue and the package versions containing fixes.","category":"advisory","primary":false},{"title":"DSA-6531-1: openssl security update","url":"https://security-tracker.debian.org/tracker/DSA-6531-1","publisher":"debian","context":"The article references Debian's security advisory for the OpenSSL update released for Debian 13.","category":"advisory","primary":false}],"body":"\u003cp\u003eOpenSSL released fixes on September 29 for CVE-2026-84782, a High-severity flaw in its DTLS implementation that can leak heap memory to the other side of a connection or crash the affected program. The issue affects software that uses OpenSSL for DTLS, which can protect WebRTC data channels and help establish encryption keys for internet calls. OpenSSL has not said whether an attacker can reliably trigger the condition, and it reported no known attacks exploiting the flaw.\u003c/p\u003e\n\n\u003cp\u003eThe bug can occur when DTLS retransmits an earlier handshake message while a larger handshake message is paused part-way through sending. Before the fix, the retransmission used the paused message\u0026rsquo;s buffer position rather than the beginning of the message being resent, which could send leftover heap bytes as unencrypted handshake data or read into unmapped memory and crash the program. Public fixes are available in OpenSSL 4.0.3, 3.6.5, 3.5.9, and 3.4.8, while fixes for older 3.0, 1.1.1, and 1.0.2 branches are limited to premium support customers; Ubuntu and Debian also released package updates.\u003c/p\u003e\n"},{"n":23,"title":"Attackers Abuse ChatGPT Custom GPTs to Deliver RAT via ClickFix Lures","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-abuse-chatgpt-custom-gpts-to.html","time":"15:00","priority":"SHOULD READ","score":84,"tldr":"Attackers are using malicious ChatGPT Custom GPTs promoted through Google search results to send victims to Google Sites-hosted ClickFix pages that trick them into installing a RAT. The malware uses DLL sideloading, encrypted payloads, AMSI bypasses, and DNS-over-HTTPS C2 to enable surveillance, remote access, and further payload delivery.","briefOverview":"\u003cp\u003eThreat actors abused ChatGPT Custom GPTs masquerading as a product called \u0026ldquo;Plus 5.6\u0026rdquo; and promoted them through sponsored Google search results. The malicious GPTs sent users to Google Sites pages by claiming the primary service had limited availability and recommending a backup domain. Those pages displayed a fake Cloudflare CAPTCHA that used a ClickFix lure to persuade victims to copy and run a malicious PowerShell command. Huntress said at least 40 users were infected.\u003c/p\u003e\n\n\u003cp\u003eThe command downloaded an MSI installer that used Canon-signed COTFileReadApp.exe to load altered DLLs and extract an encrypted loader hidden in a WAV audio file. Before launching the remote-access trojan, the loader bypassed AMSI, removed monitoring hooks from ntdll.dll, and checked for virtual-machine environments. The trojan can collect system and antivirus information, access cameras, microphones, and system audio, run remote desktop sessions, search files, and install additional programs or scripts. It locates its command-and-control server through DNS-over-HTTPS requests sent via Cloudflare, Google, and Quad9 resolvers, which Huntress said do not appear in local DNS logs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers abused ChatGPT Custom GPTs named \"Plus 5.6\" to direct users to Google Sites links that hosted ClickFix-style lures.","The malicious Google Sites pages displayed a fake Cloudflare CAPTCHA and instructed victims to copy and execute a PowerShell command that downloaded the ISOSimple.msi installer.","The installer abused Canon-signed COTFileReadApp.exe to sideload altered DLLs and extract an encrypted loader from a WAV file before launching a RAT.","The RAT can collect system and antivirus information, access cameras and microphones, run remote desktop sessions, search files, and install additional payloads.","Huntress reported that at least 40 users were infected, and the RAT used DNS-over-HTTPS through Cloudflare, Google, and Quad9 resolvers to locate its command-and-control server."],"insights":["The campaign combines several trusted-looking services—Google search ads, ChatGPT Custom GPTs, Google Sites, and a fake Cloudflare check—so victims encounter the scam through familiar brands at multiple stages.","The RAT locates its command server through encrypted DNS requests sent to major public resolvers, meaning those lookups do not appear in local DNS logs.","The installer uses a legitimate Canon-signed program and hides an encrypted loader inside a WAV audio file, adding disguise layers before the remote-control software runs.","Related ClickFix campaigns described in the article have also used compromised websites, fake AI installer pages, and blockchain-based infrastructure to deliver stealers, banking malware, and remote-access tools."],"referencedReports":[{"title":"ChatGPT Custom GPTs ClickFix RAT","url":"https://www.huntress.com/blog/chatgpt-custom-gpts-clickfix-rat","publisher":"huntress","context":"Huntress observed the Custom GPT abuse campaign and provided the technical details of the ClickFix, DLL sideloading, and RAT infection chain.","category":"research","primary":true},{"title":"Fake AI Installer Campaign Delivering an In-Memory Stealer via the ClickFix Technique","url":"https://blog.intellibron.io/fake-ai-installer-campaign-delivering-an-in-memory-stealer-via-the-clickfix-technique/","publisher":"intellibron","context":"The article cites this analysis of Google Sites-hosted phishing pages impersonating OpenAI Codex and Anthropic Claude to distribute an in-memory stealer.","category":"research","primary":false},{"title":"Disposable Domains, Durable Hosting","url":"https://activesoc.blackhillsinfosec.com/blog/disposable-domains-durable-hosting/","publisher":"black-hills-information-security","context":"The article references this analysis of ClickFix delivery through malvertising, phishing emails, and a compromised retail website.","category":"research","primary":false},{"title":"ClearFake WebDAV Infection Chain","url":"https://blog.talosintelligence.com/clearfake-webdav-infection-chain/","publisher":"cisco-talos","context":"The article cites this analysis of a ClearFake and EtherHiding campaign targeting Ukrainian government systems and attributed to UAT-10820.","category":"research","primary":false},{"title":"EtherHiding Exposed: Deep Dive","url":"https://www.guidepointsecurity.com/blog/etherhiding-exposed-deep-dive/","publisher":"guidepoint-security","context":"The article cites this deep dive for findings that an EtherHiding-enabled backdoor was later used to deliver a banking trojan that intercepts credentials and two-factor codes.","category":"research","primary":false}],"body":
