<script type="application/json" id="dl-articles">[{"n":4,"title":"CVE-2026-111497: Node2Shell / HTTP2Shell Vulnerability May Allow RCE","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/cve-2026-111497-node2shell-http2shell-vulnerability-may-allow-rce","time":"16:11","priority":"MUST READ","score":96,"tldr":"CVE-2026-111497 (Node2Shell/HTTP2Shell) is a critical out-of-bounds write in the Brotli decoder that can enable crashes, memory disclosure, or remote code execution when vulnerable software decompresses attacker-controlled Brotli data. Organizations should urgently patch affected Node.js, Bun, .NET, Python, Envoy, and other Brotli-dependent components, especially internet-facing services that accept Content-Encoding: br requests or fetch external content.","briefOverview":"\u003cp\u003eCVE-2026-111497, also known as Node2Shell and HTTP2Shell, is a critical out-of-bounds write vulnerability in Google’s Brotli decoder disclosed by the Node.js project on October 21, 2026. The flaw has a CVSS 4.0 score of 9.2 and can be triggered when vulnerable software decompresses attacker-controlled Brotli data. Successful exploitation may crash a process, disclose process memory, or enable remote code execution. Imperva reported demonstrating code execution in fresh containers using the official Node.js 24.22.0 Linux arm64 image, although multiple attempts were required in its test environment.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects a range of software using the vulnerable decoder, including Node.js, Bun, Python Brotli bindings, .NET, Envoy Proxy, Istio, Java brotli4j, libbrotli, curl/libcurl dependencies, and Linux distribution packages. It may be reached through malicious Brotli-compressed HTTP requests sent to a server or through crafted Brotli-compressed responses processed by clients, such as those used by fetch functions, webhooks, crawlers, URL previews, and API integrations. The technical flaw occurs when Brotli’s block-decoding fast path does not properly handle a failed block-type-and-length decode, allowing processing to continue in an invalid state and potentially causing an out-of-bounds write. Zscaler Deception observed 402 related events from 20 source IP addresses targeting 12 customers within 24 hours of disclosure, with 60% categorized as exploitation attempts.\u003c/p\u003e\n\n\u003cp\u003eZscaler recommends patching affected runtimes, libraries, and infrastructure components, with priority given to services that decompress untrusted data. Organizations should rebuild and redeploy containers with patched images because host library updates do not replace bundled decoder copies in applications or existing container images. Where patching is delayed, the article recommends disabling Brotli decoding on vulnerable paths where supported and monitoring for malformed Brotli payloads, unexpected crashes, abnormal memory faults, child processes, and outbound connections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-111497, also called Node2Shell and HTTP2Shell, is a critical out-of-bounds write flaw in Google’s Brotli decoder that can cause crashes, memory disclosure, or remote code execution when processing attacker-controlled Brotli data.","The vulnerability can be reached through crafted Brotli-compressed HTTP requests sent to servers or through malicious Brotli-compressed responses automatically decoded by client applications.","Affected software may include Node.js, Bun, Python Brotli bindings, .NET, Envoy Proxy, Istio, Java brotli4j, libbrotli, and curl/libcurl through Brotli dependencies.","Zscaler Deception observed 402 events from 20 source IP addresses targeting 12 customers within 24 hours of public disclosure, with 40% classified as reconnaissance and 60% as exploitation attempts.","Organizations are advised to patch vulnerable components, rebuild and redeploy containers using patched images, disable Brotli decoding on vulnerable paths if patching is delayed, and monitor for crashes or unusual process and network behavior."],"insights":["Exposure is not limited to web servers accepting compressed requests: a vulnerable application can also be affected when it automatically decompresses a crafted Brotli response from an external website, webhook, URL preview, crawler, scraper, or API integration.","Updating a system-wide Brotli package may not fix every affected application because some runtimes, libraries, and container images bundle their own copy of the decoder.","Host-level library updates do not update already deployed container images, so organizations need to rebuild and redeploy workloads with patched base images and verify versions running in containers.","Zscaler Deception recorded both reconnaissance and exploitation attempts within 24 hours of disclosure, with exploitation attempts accounting for 60% of the 402 observed events."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-111497, also known as Node2Shell and HTTP2Shell, is a critical out-of-bounds write vulnerability in Google’s Brotli decoder disclosed by the Node.js project on October 21, 2026. The flaw has a CVSS 4.0 score of 9.2 and can be triggered when vulnerable software decompresses attacker-controlled Brotli data. Successful exploitation may crash a process, disclose process memory, or enable remote code execution. Imperva reported demonstrating code execution in fresh containers using the official Node.js 24.22.0 Linux arm64 image, although multiple attempts were required in its test environment.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects a range of software using the vulnerable decoder, including Node.js, Bun, Python Brotli bindings, .NET, Envoy Proxy, Istio, Java brotli4j, libbrotli, curl/libcurl dependencies, and Linux distribution packages. It may be reached through malicious Brotli-compressed HTTP requests sent to a server or through crafted Brotli-compressed responses processed by clients, such as those used by fetch functions, webhooks, crawlers, URL previews, and API integrations. The technical flaw occurs when Brotli’s block-decoding fast path does not properly handle a failed block-type-and-length decode, allowing processing to continue in an invalid state and potentially causing an out-of-bounds write. Zscaler Deception observed 402 related events from 20 source IP addresses targeting 12 customers within 24 hours of disclosure, with 60% categorized as exploitation attempts.\u003c/p\u003e\n\n\u003cp\u003eZscaler recommends patching affected runtimes, libraries, and infrastructure components, with priority given to services that decompress untrusted data. Organizations should rebuild and redeploy containers with patched images because host library updates do not replace bundled decoder copies in applications or existing container images. Where patching is delayed, the article recommends disabling Brotli decoding on vulnerable paths where supported and monitoring for malformed Brotli payloads, unexpected crashes, abnormal memory faults, child processes, and outbound connections.\u003c/p\u003e\n"},{"n":2,"title":"AMOS Malware in AI Agent Skills: Analysis and IoCs","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/tracking-amos-across-the-poisoned-ai-agent-skills-ecosystem","time":"15:44","priority":"SHOULD READ","score":85,"tldr":"Cyera identified 516 poisoned AI-agent skills that used fake setup requirements and encoded commands to deliver the Atomic macOS Stealer (AMOS), often while receiving high automated security grades. Organizations should inspect entire skill packages and block skills that direct users or agents to download external tools, decode Base64 commands, or execute shell installers.","briefOverview":"\u003cp\u003eCyera Research identified 516 samples linked to a campaign distributing Atomic macOS Stealer (AMOS) through poisoned AI-agent skills. The skills appeared on popular marketplaces and used plausible documentation mixed with fake setup requirements to persuade users or agents to install credential-stealing malware. The campaign follows the ClawHavoc pattern of hiding malicious instructions inside skills intended for OpenClaw agents, although the article says the approach can affect any agent that uses skills.\u003c/p\u003e\n\n\u003cp\u003eThe malicious instructions commonly directed macOS users to decode Base64 text and run it through Bash, while Windows users were sent to download archives and execute programs. Researchers found that 91.92.242.30 represented 83.7% of payload-host references, and two glot.io snippets represented 95.9% of paste-relay references. Automated marketplace checks failed to catch the threat: all 70 confirmed-malicious skills found on evaluated platforms received high security grades, and reviewing only a main SKILL.md file can miss harmful content in bundled files or oversized README files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified 516 samples classified as part of an Atomic macOS Stealer (AMOS) campaign distributed through poisoned AI-agent skills.","The malicious skills used fake prerequisites and setup instructions to direct users or agents to download external files or decode and execute commands, with macOS instructions often using Base64-decoded Bash commands.","In the analyzed sample, 91.92.242.30 accounted for 83.7% of payload-host references, and two glot.io snippets accounted for 95.9% of paste-relay references.","All 70 confirmed-malicious skills identified on platforms with automated evaluation received high security grades, indicating that those checks missed malicious instructions embedded in skill files.","AMOS can collect browser passwords and session cookies, keychain information, and sensitive files before sending the data to attacker-controlled infrastructure."],"insights":["High marketplace safety grades were not reliable indicators of safety: all 70 confirmed-malicious skills on evaluated platforms received high grades, and Skills Directory’s grading methodology covers only SKILL.md rather than bundled scripts or other files.","The campaign’s infrastructure was highly reusable, with one payload host, 91.92.242.30, appearing in 83.7% of references and two glot.io snippets accounting for 95.9% of paste-relay references.","Reviewing only a skill’s main instruction file can miss malicious content, as JFrog reported an encoded dropper hidden in an approximately 22 MB README.md.","Specific warning signs identified by the researchers include download links to ZIP or EXE files, glot.io references, claims that a skill “will not work” unless openclaw-agent is installed, and Base64-decoding commands piped into Bash."],"referencedReports":[{"title":"OpenClaw AI Supply Chain Risk","url":"https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/","publisher":"unit-42","context":"The article cites Unit 42's reporting on an AMOS-related malware-distribution operation involving poisoned OpenClaw skills and a separate macOS stealer called cluw.","category":"research","primary":false}],"body":"\u003cp\u003eCyera Research identified 516 samples linked to a campaign distributing Atomic macOS Stealer (AMOS) through poisoned AI-agent skills. The skills appeared on popular marketplaces and used plausible documentation mixed with fake setup requirements to persuade users or agents to install credential-stealing malware. The campaign follows the ClawHavoc pattern of hiding malicious instructions inside skills intended for OpenClaw agents, although the article says the approach can affect any agent that uses skills.\u003c/p\u003e\n\n\u003cp\u003eThe malicious instructions commonly directed macOS users to decode Base64 text and run it through Bash, while Windows users were sent to download archives and execute programs. Researchers found that 91.92.242.30 represented 83.7% of payload-host references, and two glot.io snippets represented 95.9% of paste-relay references. Automated marketplace checks failed to catch the threat: all 70 confirmed-malicious skills found on evaluated platforms received high security grades, and reviewing only a main SKILL.md file can miss harmful content in bundled files or oversized README files.\u003c/p\u003e\n"},{"n":1,"title":"Malicious AI Skills: The Risk to Corporate Endpoints","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/a-malicious-copy-of-anthropics-pdf-skill-carries-a-linux-backdoor","time":"15:44","priority":"SHOULD READ","score":78,"tldr":"Cyera researchers found a trojanized copy of Anthropic’s PDF skill that preserved most legitimate files but replaced its instructions and added an obfuscated Linux reverse-shell binary connecting to a hard-coded server. The case highlights AI-skill supply-chain risk: organizations should verify entire skill packages, including instruction files, executables, and network destinations, before agents can use them.","briefOverview":"\u003cp\u003eCyera Research analyzed a package named “pdf” that impersonated Anthropic’s official PDF skill. It retained the original name, description, and 11 identical files, but replaced the legitimate \u003ccode\u003eSKILL.md\u003c/code\u003e instructions and added two files not present in the original package. The modified instructions directed an agent to contact an external hostname, while the added \u003ccode\u003esystem_linux\u003c/code\u003e executable contained an obfuscated Linux backdoor.\u003c/p\u003e\n\n\u003cp\u003eThe 5 MB, statically linked Go executable decrypts a hard-coded destination, opens a plain TCP connection to \u003ccode\u003e81.70.101[.]115:2345\u003c/code\u003e, and attaches \u003ccode\u003e/bin/bash\u003c/code\u003e to that connection. Researchers observed five similar tar archives from May through July 2026, but could not determine how they were distributed, whether anyone installed them, or whether the binary was launched. The case demonstrates that a familiar skill name and largely legitimate file set can conceal harmful instructions or executables, so organizations should verify complete skill packages and investigate unexpected commands, binaries, and network destinations before allowing agents to use them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research analyzed a package named “pdf” that impersonated Anthropic’s PDF skill by retaining its name, description, and 11 identical files while replacing the SKILL.md instructions.","The package added a 5 MB obfuscated 64-bit Linux Go executable named system_linux that decrypts a hard-coded destination and opens a TCP connection to 81.70.101[.]115:2345, attaching /bin/bash to that connection.","The altered SKILL.md directs the agent to contact scan.100tal[.]com, which resolved during the researchers’ analysis to the private IP address 10.160.65[.]97.","Researchers observed five similar tar files between May 23 and July 14, 2026, but could not establish how the packages were distributed, whether anyone used them, or whether the binary was executed.","The article says organizations should verify an entire skill package against its claimed source and investigate unexpected commands, network destinations, and executable files before allowing an agent to use it."],"insights":["A package can appear trustworthy through its familiar name, description, and mostly unchanged legitimate files while concentrating harmful behavior in a replaced instruction file and an added executable.","Reviewing only bundled scripts would have missed the altered SKILL.md and the added reverse-shell program, demonstrating the need to inspect an entire skill package rather than selected files.","The article distinguishes confirmed malicious capability from an observed compromise: researchers identified the reverse shell and network destinations but did not observe installation, execution, or a successful follow-on response.","The case maps to malicious-skill and software-supply-chain risks, but the article cautions that these frameworks do not establish how the package was distributed or whether an established distribution channel was compromised."],"referencedReports":[],"body":"\u003cp\u003eCyera Research analyzed a package named “pdf” that impersonated Anthropic’s official PDF skill. It retained the original name, description, and 11 identical files, but replaced the legitimate \u003ccode\u003eSKILL.md\u003c/code\u003e instructions and added two files not present in the original package. The modified instructions directed an agent to contact an external hostname, while the added \u003ccode\u003esystem_linux\u003c/code\u003e executable contained an obfuscated Linux backdoor.\u003c/p\u003e\n\n\u003cp\u003eThe 5 MB, statically linked Go executable decrypts a hard-coded destination, opens a plain TCP connection to \u003ccode\u003e81.70.101[.]115:2345\u003c/code\u003e, and attaches \u003ccode\u003e/bin/bash\u003c/code\u003e to that connection. Researchers observed five similar tar archives from May through July 2026, but could not determine how they were distributed, whether anyone installed them, or whether the binary was launched. The case demonstrates that a familiar skill name and largely legitimate file set can conceal harmful instructions or executables, so organizations should verify complete skill packages and investigate unexpected commands, binaries, and network destinations before allowing agents to use them.\u003c/p\u003e\n"},{"n":3,"title":"How to Vet AI Agent Skills: Lessons From a Fake PDF Skill","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/a-trojanized-pdf-skill-reveals-a-broader-ai-supply-chain-risk","time":"15:44","priority":"MAY READ","score":72,"tldr":"Cyera researchers found a trojanized copy of Anthropic’s PDF skill that preserved legitimate scripts and branding but replaced its instructions and added a Linux backdoor. Organizations should verify every file and instruction in AI-agent skill packages, not just names or known code, and restrict agent permissions and network access.","briefOverview":"\u003cp\u003eCyera Research analyzed a fake copy of Anthropic’s PDF skill that retained the familiar name, description, and 11 files matching the official skill. The package replaced the main SKILL.md instructions and added a 5 MB Linux executable containing a backdoor. Cyera identified the original ZIP archive and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe altered SKILL.md was shortened from 315 lines to 19 and directed the agent to make a network call to a Chinese domain. If the bundled executable ran, a remote operator could issue commands with the permissions of the account that launched it, although researchers found no direct instructions to execute the binary. The article says organizations should verify complete skill packages against claimed sources, inspect instructions as well as code, investigate unexpected executables and network destinations, and keep agent permissions proportionate to the task.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified a fake copy of Anthropic’s PDF skill that retained its familiar name, description, and 11 files matching the official skill, while altering its main instructions and adding a Linux executable with a backdoor.","The altered SKILL.md file was reduced from 315 lines to 19 and instructed the agent to make a network call to a Chinese domain.","If executed, the added binary could allow a remote operator to run commands using the permissions of the account that launched it.","Cyera observed the original ZIP archive and five related archives between May 23 and July 14, 2026.","The article recommends that companies verify every file and instruction in AI skill packages, investigate unexpected executables and network destinations, and limit agent permissions for network access and software execution."],"insights":["Checking only a skill’s name, description, or expected scripts can miss malicious changes, because this package preserved 11 legitimate files while replacing the instruction file and adding an executable.","AI-skill reviews need to examine both executable content and written instructions, since the instructions determine what an agent will do with its available tools and permissions.","A file-comparison process across the entire package would have exposed both the shortened, rewritten SKILL.md file and the unexpected 5 MB Linux binary.","The researchers found no direct instruction to execute the bundled binary, but the altered instructions directed the agent to contact an external URL whose domain resolved to a private IP address at the time of the research.","When a suspicious skill is found internally, responders should determine whether it was present, whether its instructions were followed, and whether any bundled program ran."],"referencedReports":[],"body":"\u003cp\u003eCyera Research analyzed a fake copy of Anthropic’s PDF skill that retained the familiar name, description, and 11 files matching the official skill. The package replaced the main SKILL.md instructions and added a 5 MB Linux executable containing a backdoor. Cyera identified the original ZIP archive and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe altered SKILL.md was shortened from 315 lines to 19 and directed the agent to make a network call to a Chinese domain. If the bundled executable ran, a remote operator could issue commands with the permissions of the account that launched it, although researchers found no direct instructions to execute the binary. The article says organizations should verify complete skill packages against claimed sources, inspect instructions as well as code, investigate unexpected executables and network destinations, and keep agent permissions proportionate to the task.\u003c/p\u003e\n"},{"n":5,"title":"The Silent Ransom Group Leak Shows Why Paying for Silence Fails","source":"coveware.com","sourceColorIdx":6,"link":"https://coveware.com/2026/10/the-silent-ransom-group-leak-shows-why-paying-for-silence-fails/","time":"17:00","priority":"MAY READ","score":55,"tldr":"Ransomware crews are increasingly relying on social engineering and stolen-data extortion instead of encrypting systems, especially targeting law firms and other data-sensitive mid-market organizations. Because paying for a promise to delete data offers little protection from leaks or repeat extortion, organizations should prioritize identity defenses, incident coordination, and recoverable operations.","briefOverview":"\u003cp\u003eThe article warns that law-firm senior partners are being personally targeted through tailored emails and phone calls built from information on public firm profile pages. It says the Q3 2026 leak of Silent Ransom Group internal chats revealed victims that had paid to keep incidents private and demonstrated the unreliability of paying for silence. The article describes a shift away from broadly encrypting systems and toward stealing data from cloud and software-service environments, then demanding payment to prevent disclosure.\u003c/p\u003e\n\n\u003cp\u003eCoveware by Veeam reported that the Q3 2026 median ransom payment rose 167% from Q2 to \u003cspan class=\"math inline\"\u003e\\(400,000, while the average payment fell 45% to \\)\u003c/span\u003e1,025,278. Phishing and social engineering accounted for about 29% of initial access, with compromised remote access at 22–23% and compromised credentials at 14–15%; attackers then often use ordinary administrative routes and cloud services to move through environments and remove data. Nearly 80% of data-exfiltration-only incidents were resolved without payment, because payment does not remove notification obligations or provide a verifiable guarantee that stolen data will be deleted, resold, or used in later extortion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Silent Ransom Group leak showed that some extortion actors have moved away from widespread file encryption toward stealing data from cloud and software-service environments, using social engineering and targeted insider activity.","The article warns that senior law-firm partners are being targeted with tailored emails and phone calls based on information published on their firms’ profile pages.","In Q3 2026, the median ransom payment was $400,000, up 167% from Q2 2026, while the average payment fell 45% to $1,025,278.","Phishing and social engineering accounted for about 29% of initial access methods in Q3 2026, followed by compromised remote access at 22–23% and compromised credentials at 14–15%.","Nearly 80% of data-exfiltration-only incidents were resolved without a ransom payment, as victims increasingly view payment as offering no verifiable assurance that stolen data will be deleted."],"insights":["The combination of a higher median payment and a lower average payment suggests that mid-market victims are facing higher baseline demands while larger enterprises are declining multimillion-dollar demands when their operations remain available.","The article finds that tracking individual ransomware-group names is becoming less useful because no group held more than 6% of cases in Q3 2026 and several groups rapidly entered the rankings.","Because attacker activity can resemble ordinary employee or administrator logins, the article recommends validating the user, device, and purpose of access continuously rather than relying only on initial authentication.","The article cautions that isolated efforts to cut off attackers’ control channels can cause them to switch tools or accelerate their actions, making coordinated incident oversight important.","For data-theft-only extortion, the central problem is often legal, regulatory, and reputational management rather than restoring technology, since stolen data cannot be recovered and deletion promises cannot be verified."],"referencedReports":[],"body":"\u003cp\u003eThe article warns that law-firm senior partners are being personally targeted through tailored emails and phone calls built from information on public firm profile pages. It says the Q3 2026 leak of Silent Ransom Group internal chats revealed victims that had paid to keep incidents private and demonstrated the unreliability of paying for silence. The article describes a shift away from broadly encrypting systems and toward stealing data from cloud and software-service environments, then demanding payment to prevent disclosure.\u003c/p\u003e\n\n\u003cp\u003eCoveware by Veeam reported that the Q3 2026 median ransom payment rose 167% from Q2 to \u003cspan class=\"math inline\"\u003e\\(400,000, while the average payment fell 45% to \\)\u003c/span\u003e1,025,278. Phishing and social engineering accounted for about 29% of initial access, with compromised remote access at 22–23% and compromised credentials at 14–15%; attackers then often use ordinary administrative routes and cloud services to move through environments and remove data. Nearly 80% of data-exfiltration-only incidents were resolved without payment, because payment does not remove notification obligations or provide a verifiable guarantee that stolen data will be deleted, resold, or used in later extortion.\u003c/p\u003e\n"}]</script>

  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
