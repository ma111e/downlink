<script type="application/json" id="dl-articles">[{"n":2,"title":"Emerging Threat: (CVE-2026-63030, CVE-2026-60137) WordPress Core Unauthenticated RCE via wp2shell","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-63030-cve-2026-60137-wordpress-core-unauthenticated-rce-via-wp2shell/","time":"08:29","priority":"MUST READ","score":95,"tldr":"WordPress released fixes for the wp2shell vulnerability chain, which enables unauthenticated remote code execution on default WordPress 6.9.0–6.9.4 and 7.0.0–7.0.1 sites, while 6.8.x sites still need patching for the SQL injection component. Administrators should verify updates to 6.8.6, 6.9.5, or 7.0.2 and review exposed sites for possible compromise.","briefOverview":"\u003cp\u003ewp2shell is an unauthenticated remote code execution attack against WordPress core that combines two separately tracked flaws, CVE-2026-63030 and CVE-2026-60137. The article says the chain can let an anonymous attacker run code on a default WordPress installation with no plugins, no valid account, and no user interaction. As of July 18, 2026, a working proof of concept describing the full mechanism had been published, lowering the effort required to probe exposed installations.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-63030 is a REST API batch-route confusion issue in \u003ccode\u003eWP_REST_Server::serve_batch_request_v1()\u003c/code\u003e affecting the \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e endpoint, which has shipped with WordPress since version 5.6. CVE-2026-60137 is a SQL injection in the \u003ccode\u003eauthor__not_in\u003c/code\u003e parameter of \u003ccode\u003eWP_Query\u003c/code\u003e, the core class that builds most WordPress database queries. The full RCE chain affects WordPress core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while WordPress 6.8.0 through 6.8.5 carries only the SQL injection component.\u003c/p\u003e\n\n\u003cp\u003eWordPress released fixes in versions 6.8.6, 6.9.5, and 7.0.2 on July 17, 2026, with the 7.1 beta line fixed in 7.1 beta2. The article emphasizes that automatic updates may fail or be disabled, so administrators should confirm the installed version on each site and treat sites that were exposed while vulnerable as potentially compromised until reviewed. CyCognito’s observed exposure spans multiple sectors, with Consumer Discretionary, Industrials, and Communication Services leading the visible affected asset set.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["wp2shell is an unauthenticated remote code execution chain in WordPress core that combines CVE-2026-63030, a REST API batch-route confusion issue, with CVE-2026-60137, a SQL injection in the author__not_in parameter of WP_Query.","The full remote code execution chain affects WordPress core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while WordPress 6.8.0 through 6.8.5 carries only the SQL injection component.","WordPress released fixed versions 6.8.6, 6.9.5, and 7.0.2 on July 17, 2026, and the 7.1 beta line is fixed in 7.1 beta2.","The article says defenders should verify that automatic updates completed, prioritize sites on 6.9.0 or later, restrict or block /wp-json/batch/v1 until patched, monitor logs, and review potentially affected sites for compromise.","CyCognito’s observed exposure was spread across sectors, led by Consumer Discretionary at 18.6%, Industrials at 15.8%, and Communication Services at 13.0%."],"insights":["The 6.8.x branch could be overlooked if teams track only the full wp2shell RCE chain, because those sites are not exposed to the complete chain but still need 6.8.6 to fix the SQL injection component.","The article emphasizes that forced automatic updates reduce risk but are not proof of remediation, because background updates can fail or be disabled and each site’s installed version must be confirmed.","CyCognito’s exposure data suggests vulnerable WordPress assets are often secondary properties such as campaign, regional, subsidiary, or product-line sites rather than flagship domains, making inventory gaps a major practical risk.","Because the RCE chain requires no plugins, valid account, or user interaction, the usual triage assumption that WordPress risk depends on a vulnerable add-on does not apply for affected core versions.","Patching closes the vulnerable path but does not address any compromise that may have happened before the update, so sites that were reachable while running affected versions require review beyond version verification."],"referencedReports":[],"body":"\u003cp\u003ewp2shell is an unauthenticated remote code execution attack against WordPress core that combines two separately tracked flaws, CVE-2026-63030 and CVE-2026-60137. The article says the chain can let an anonymous attacker run code on a default WordPress installation with no plugins, no valid account, and no user interaction. As of July 18, 2026, a working proof of concept describing the full mechanism had been published, lowering the effort required to probe exposed installations.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-63030 is a REST API batch-route confusion issue in \u003ccode\u003eWP_REST_Server::serve_batch_request_v1()\u003c/code\u003e affecting the \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e endpoint, which has shipped with WordPress since version 5.6. CVE-2026-60137 is a SQL injection in the \u003ccode\u003eauthor__not_in\u003c/code\u003e parameter of \u003ccode\u003eWP_Query\u003c/code\u003e, the core class that builds most WordPress database queries. The full RCE chain affects WordPress core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while WordPress 6.8.0 through 6.8.5 carries only the SQL injection component.\u003c/p\u003e\n\n\u003cp\u003eWordPress released fixes in versions 6.8.6, 6.9.5, and 7.0.2 on July 17, 2026, with the 7.1 beta line fixed in 7.1 beta2. The article emphasizes that automatic updates may fail or be disabled, so administrators should confirm the installed version on each site and treat sites that were exposed while vulnerable as potentially compromised until reviewed. CyCognito’s observed exposure spans multiple sectors, with Consumer Discretionary, Industrials, and Communication Services leading the visible affected asset set.\u003c/p\u003e\n"},{"n":1,"title":"SleeperGem: RubyGems supply chain attack targets dormant maintainer accounts","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/sleepergem-rubygems-supply-chain-attack","time":"08:45","priority":"SHOULD READ","score":86,"tldr":"Attackers compromised dormant RubyGems maintainer accounts to publish malicious gem updates that downloaded and executed payloads on developer machines while avoiding CI environments. The incident shows RubyGems is now facing the same dormant-account supply chain abuse long seen in npm and PyPI.","briefOverview":"\u003cp\u003eA new RubyGems package named \u003ccode\u003egit_credential_manager\u003c/code\u003e published four versions in rapid succession and stood out because it downloaded binaries from a Git repository hosted at \u003ccode\u003ehttps://git.disroot[.]org/git-ecosystem/\u003c/code\u003e. The repository was on a public Forgejo instance where anyone can create repositories, and the username \u003ccode\u003egit-ecosystem\u003c/code\u003e made it appear somewhat legitimate. One submitted binary was quickly flagged as malicious by antivirus vendors on VirusTotal.\u003c/p\u003e\n\n\u003cp\u003eThe article describes how the package evolved over about nine hours. Version \u003ccode\u003e2.8.0\u003c/code\u003e already worked as a dropper by building a URL to the hardcoded Forgejo host, disabling SSL certificate verification, fetching a payload, and executing it with a shell or PowerShell. Later versions made execution quieter, wired the installer into the gem load path so merely requiring \u003ccode\u003egit_credential_manager\u003c/code\u003e could trigger it, and then uncommented the line that executed the downloaded script.\u003c/p\u003e\n\n\u003cp\u003eThe attacker also added \u003ccode\u003egit_credential_manager\u003c/code\u003e as a dependency to new versions of other gems, including Dendreo and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, the latter of which had 574,661 total downloads and belonged to a different maintainer. The package included checks for roughly 30 CI-related environment variables, including GitHub Actions, GitLab CI, CircleCI, Travis, Jenkins, and Vercel, and did nothing if one was found. The article frames the incident as RubyGems’ first real taste of dormant maintainer account compromise patterns that npm and PyPI have faced for more than a year.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new RubyGems package named git_credential_manager published four versions in rapid succession and downloaded binaries from a Git repository hosted at https://git.disroot.org/git-ecosystem/.","Version 2.8.0 of git_credential_manager acted as a dropper by building a hardcoded URL, disabling SSL certificate verification, fetching a payload, and executing it with a shell or PowerShell.","Version 2.8.2 wired the installer into the gem’s load path so that merely requiring git_credential_manager could trigger the installation flow, and version 2.8.3 uncommented the line that executed the downloaded script.","The package included a skip_install? check for roughly 30 CI-related environment variables, including GitHub Actions, GitLab CI, CircleCI, Travis, Jenkins, and Vercel, and did nothing when it found one.","The attacker added git_credential_manager as a dependency to newly published versions of Dendreo and fastlane-plugin-run_tests_firebase_testlab, with the latter belonging to a different maintainer and having 574,661 total downloads."],"insights":["The attacker’s rapid sequence of small version changes shows the malicious delivery mechanism being refined in public, including making Unix execution quieter and later activating execution with a one-line change.","The CI-environment checks indicate the package was designed to avoid disposable build systems and instead focus on developer laptops where credentials and local access may be more valuable.","Adding the malicious package as a dependency to older trusted gems made the campaign more dangerous than simple typosquatting, because existing users could receive the payload through projects they already trusted.","The compromise of fastlane-plugin-run_tests_firebase_testlab, which belonged to a different maintainer than the other affected gems, showed the activity was not limited to a single hijacked RubyGems account.","Dormant maintainer accounts that had not updated packages for six or seven years were specifically highlighted as risky because they can look harmless while still retaining the ability to push trusted package updates."],"referencedReports":[],"body":"\u003cp\u003eA new RubyGems package named \u003ccode\u003egit_credential_manager\u003c/code\u003e published four versions in rapid succession and stood out because it downloaded binaries from a Git repository hosted at \u003ccode\u003ehttps://git.disroot[.]org/git-ecosystem/\u003c/code\u003e. The repository was on a public Forgejo instance where anyone can create repositories, and the username \u003ccode\u003egit-ecosystem\u003c/code\u003e made it appear somewhat legitimate. One submitted binary was quickly flagged as malicious by antivirus vendors on VirusTotal.\u003c/p\u003e\n\n\u003cp\u003eThe article describes how the package evolved over about nine hours. Version \u003ccode\u003e2.8.0\u003c/code\u003e already worked as a dropper by building a URL to the hardcoded Forgejo host, disabling SSL certificate verification, fetching a payload, and executing it with a shell or PowerShell. Later versions made execution quieter, wired the installer into the gem load path so merely requiring \u003ccode\u003egit_credential_manager\u003c/code\u003e could trigger it, and then uncommented the line that executed the downloaded script.\u003c/p\u003e\n\n\u003cp\u003eThe attacker also added \u003ccode\u003egit_credential_manager\u003c/code\u003e as a dependency to new versions of other gems, including Dendreo and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, the latter of which had 574,661 total downloads and belonged to a different maintainer. The package included checks for roughly 30 CI-related environment variables, including GitHub Actions, GitLab CI, CircleCI, Travis, Jenkins, and Vercel, and did nothing if one was found. The article frames the incident as RubyGems’ first real taste of dormant maintainer account compromise patterns that npm and PyPI have faced for more than a year.\u003c/p\u003e\n"}]</script>
