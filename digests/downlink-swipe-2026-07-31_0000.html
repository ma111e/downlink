is decoupled from product release cycles and has grown from 65 rules in 2023 to more than 800 known vulnerable driver rules today.\u003c/p\u003e\n\n\u003cp\u003eBYOVD attacks abuse legitimately signed but vulnerable Windows drivers to gain kernel-level access, disable security software, or tamper with memory. Elastic monitors VirusTotal, the LOLDrivers catalog, and Microsoft’s Vulnerable Driver Block List, filters out already covered drivers, and builds new detection rules from digital signatures and file characteristics. The generated rules are published openly in Elastic’s protections-artifacts repository, and Elastic says malware protection should be enabled and set to Prevent for the full benefit.\u003c/p\u003e\n\n\u003cp\u003eElastic also introduced an automatic troubleshooting skill in Elastic Agent Builder that uses natural language chat to flag policy and performance issues and provide remediation guidance. The skill is intended to help with issues such as third-party antivirus conflicts, policy application failures, and errors that typically require log investigation. Elastic Defend now also supports Windows on ARM, allowing ARM workstations, Snapdragon laptops, and Copilot+ PCs to enroll under existing policies with the same detection rules and telemetry as x64 endpoints.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs Threat Command continuously monitors public vulnerable driver disclosure sources, including VirusTotal, LOLDrivers, and Microsoft’s Vulnerable Driver Block List, and automatically generates and deploys endpoint detection rules.","Elastic’s automated vulnerable driver coverage has grown from an initial 65 rules in 2023 to more than 800 known vulnerable driver rules today.","Elastic says the vulnerable driver protections are decoupled from product release cycles and are published openly in the elastic/protections-artifacts repository.","The automatic troubleshooting skill in Elastic Agent Builder flags policy and performance issues and provides diagnosis and remediation guidance through natural language chat.","Elastic Defend now supports Windows on ARM, allowing ARM workstations, Snapdragon laptops, and Copilot+ PCs to enroll under existing policies with the same detection rules and telemetry as x64 endpoints."],"insights":["Elastic frames BYOVD protection as a race against disclosure timing, because attackers can act as soon as a vulnerable driver becomes public while traditional vendor coverage may wait for a release cycle.","The article makes malware protection configuration operationally important: Elastic says the vulnerable driver protections deliver their full benefit only when malware protection is enabled and set to Prevent.","Elastic emphasizes that its vulnerable driver rules are published in an open repository, which lets security teams inspect the source, triggering driver, and detection logic instead of relying on an opaque vendor threat feed.","The article highlights that BYOVD has shifted from a technique associated with state actors and red teams into a routine step used by ransomware crews to disable endpoint security before deploying payloads.","Elastic’s approach does not rely on a single vulnerable-driver source, because it combines VirusTotal, LOLDrivers, and Microsoft’s Vulnerable Driver Block List to reduce coverage gaps."],"referencedReports":[],"body":"\u003cp\u003eElastic announced three endpoint enhancements for Elastic Defend focused on improving prevention and reducing alerts by stopping more activity at the endpoint. Elastic Security Labs Threat Command now continuously monitors public vulnerable driver disclosure sources and automatically generates and deploys protections for Bring Your Own Vulnerable Driver attacks. The article says this coverage is decoupled from product release cycles and has grown from 65 rules in 2023 to more than 800 known vulnerable driver rules today.\u003c/p\u003e\n\n\u003cp\u003eBYOVD attacks abuse legitimately signed but vulnerable Windows drivers to gain kernel-level access, disable security software, or tamper with memory. Elastic monitors VirusTotal, the LOLDrivers catalog, and Microsoft’s Vulnerable Driver Block List, filters out already covered drivers, and builds new detection rules from digital signatures and file characteristics. The generated rules are published openly in Elastic’s protections-artifacts repository, and Elastic says malware protection should be enabled and set to Prevent for the full benefit.\u003c/p\u003e\n\n\u003cp\u003eElastic also introduced an automatic troubleshooting skill in Elastic Agent Builder that uses natural language chat to flag policy and performance issues and provide remediation guidance. The skill is intended to help with issues such as third-party antivirus conflicts, policy application failures, and errors that typically require log investigation. Elastic Defend now also supports Windows on ARM, allowing ARM workstations, Snapdragon laptops, and Copilot+ PCs to enroll under existing policies with the same detection rules and telemetry as x64 endpoints.\u003c/p\u003e\n"},{"n":19,"title":"6 Reasons Why Device Code Phishing is the Fastest-Growing Threat of 2026","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/6-reasons-why-device-code-phishing-is.html","time":"11:24","priority":"MAY READ","score":55,"tldr":"Device code phishing is rapidly becoming a major threat because it abuses legitimate OAuth authorization flows after login, letting attackers bypass MFA and passkeys while users interact with trusted provider pages. The article argues defenders need browser-level detection and tighter control of device code flows as phishing kits industrialize and expand beyond Microsoft.","briefOverview":"\u003cp\u003eDevice code phishing abuses the OAuth 2.0 device authorization grant to steal access tokens and has grown from a niche red-team technique into an industrial-scale threat in under six months. The article says the technique was first described by researchers in 2020, was used by nation-state actors such as Storm-2372 by 2024, and was later adopted at scale by ShinyHunters and phishing-as-a-service kits including EvilTokens. By April 2026, Microsoft was reporting 10 to 15 entirely new campaigns every 24 hours, Barracuda counted 7 million attacks in four weeks, and the FBI issued a standalone advisory on Kali365.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that device code phishing can defeat every form of MFA, including passkeys, because it targets the authorization layer after a user is already signed in. In a typical attack, the victim enters a short code on the legitimate Microsoft device login page, selects their account, and clicks allow. Push Security says it now tracks more than 25 distinct device code phishing kits, and the article links the rapid kit growth to phishing-as-a-service commercialization and AI-assisted development.\u003c/p\u003e\n\n\u003cp\u003eAlthough Push says 99% of the device code phishing it detects today targets Microsoft, the article states that the underlying device authorization flow is a cross-platform standard and can affect services such as Salesforce, GitHub, and AWS. It describes the threat as part of a broader shift toward abusing authorization mechanisms such as consent flows, device registration, and token exchange rather than attacking the login step directly. The article argues that common tools such as network proxies, URL reputation services, and email gateways may miss these attacks because the user interacts with legitimate provider URLs, and it presents browser-level detection as the vantage point that can see both the phishing lure and the device code approval.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Device code phishing abuses the OAuth 2.0 device authorization grant to steal access tokens and has grown from a niche red-team technique into an industrial-scale threat in under six months.","The article says device code phishing can defeat every form of MFA, including passkeys, because it targets the authorization layer after the user has authenticated.","Push Security reports tracking more than 25 distinct device code phishing kits in the wild, and the article says phishing-as-a-service offerings such as Tycoon2FA, Kali365, and ARToken now include device code phishing capabilities.","Although 99% of the device code phishing detected by Push Security currently targets Microsoft, the article says the technique can affect other platforms that implement device code flows, including Salesforce, GitHub, and AWS.","The article says common controls such as URL reputation services, email gateways, and network proxies may not block these attacks because users enter codes on legitimate provider login pages."],"insights":["The article highlights that device code phishing avoids many traditional blocking points because the victim ultimately enters the code on a legitimate provider login page rather than a cloned login site.","The article says disabling Microsoft device code flows can help but may be difficult in larger organizations because legitimate developer tooling, command-line workflows, and constrained-device scenarios may depend on them.","The article connects the rapid growth of device code phishing kits to AI-assisted development, saying independently built kits can look structurally similar when generated from similar LLM instructions.","The article frames device code phishing as part of a broader shift from stealing credentials during sign-in to abusing authorization steps after sign-in, where fewer defensive controls are concentrated."],"referencedReports":[{"title":"AI-enabled device code phishing campaign","url":"https://www.microsoft.com/en-us/security/blog/2026/04/06/ai-enabled-device-code-phishing-campaign-april-2026/","publisher":"Microsoft","context":"The article cites Microsoft as reporting 10 to 15 entirely new device code phishing campaigns every 24 hours by April 2026.","category":"research","primary":false},{"title":"Threat Spotlight: Device Code Phishing","url":"https://blog.barracuda.com/2026/04/23/threat-spotlight-device-code-phishing","publisher":"Barracuda","context":"The article cites Barracuda as counting 7 million device code phishing attacks in four weeks.","category":"research","primary":false},{"title":"Kali365 advisory","url":"https://www.ic3.gov/PSA/2026/PSA260521","publisher":"FBI Internet Crime Complaint Center","context":"The article says the FBI issued a standalone advisory on Kali365, described as the first US federal agency PSA about a specific phishing-as-a-service kit.","category":"advisory","primary":false},{"title":"ARToken: Inside an EvilTokens affiliate panel targeting Microsoft 365","url":"https://blog.talosintelligence.com/artoken-inside-an-eviltokens-affiliate-panel-targeting-microsoft-365/","publisher":"Cisco Talos","context":"The article references Cisco Talos analysis to describe ARToken features such as PRT persistence, mailbox access, BEC automation, and SharePoint exfiltration.","category":"research","primary":false}],"body":"\u003cp\u003eDevice code phishing abuses the OAuth 2.0 device authorization grant to steal access tokens and has grown from a niche red-team technique into an industrial-scale threat in under six months. The article says the technique was first described by researchers in 2020, was used by nation-state actors such as Storm-2372 by 2024, and was later adopted at scale by ShinyHunters and phishing-as-a-service kits including EvilTokens. By April 2026, Microsoft was reporting 10 to 15 entirely new campaigns every 24 hours, Barracuda counted 7 million attacks in four weeks, and the FBI issued a standalone advisory on Kali365.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that device code phishing can defeat every form of MFA, including passkeys, because it targets the authorization layer after a user is already signed in. In a typical attack, the victim enters a short code on the legitimate Microsoft device login page, selects their account, and clicks allow. Push Security says it now tracks more than 25 distinct device code phishing kits, and the article links the rapid kit growth to phishing-as-a-service commercialization and AI-assisted development.\u003c/p\u003e\n\n\u003cp\u003eAlthough Push says 99% of the device code phishing it detects today targets Microsoft, the article states that the underlying device authorization flow is a cross-platform standard and can affect services such as Salesforce, GitHub, and AWS. It describes the threat as part of a broader shift toward abusing authorization mechanisms such as consent flows, device registration, and token exchange rather than attacking the login step directly. The article argues that common tools such as network proxies, URL reputation services, and email gateways may miss these attacks because the user interacts with legitimate provider URLs, and it presents browser-level detection as the vantage point that can see both the phishing lure and the device code approval.\u003c/p\u003e\n"},{"n":26,"title":"Network Anomaly Detection in KATA","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/network-anomaly-detection-in-kata/120892/","time":"10:00","priority":"MAY READ","score":55,"tldr":"Kaspersky explains how Network Anomaly Detection in KATA detects stealthy attacks like Kerberoasting and DNS tunneling by correlating abnormal behavior across Kerberos and DNS traffic rather than relying on signatures. The key takeaway is that behavioral, baseline-aware detection can reduce false positives and surface attacks that otherwise look like normal corporate network activity.","briefOverview":"\u003cp\u003eThe article explains how Network Anomaly Detection in Kaspersky Anti Targeted Attack is used to identify attacks that blend into ordinary corporate network traffic. It focuses on Kerberoasting and DNS tunneling, two techniques that use standard domain infrastructure protocols and can be difficult for traditional network attack detection tools to distinguish from legitimate activity. KATA’s NAD analyzes traffic such as DNS, DCE/RPC, Kerberos, and other packets to detect suspicious deviations from typical host behavior.\u003c/p\u003e\n\n\u003cp\u003eFor Kerberoasting, KATA looks for a single source IP address and client account receiving successful Kerberos TGS responses for many unique, non-system service principal names within a defined time window. For DNS tunneling via TXT records, KATA looks for a single source host accumulating a large combined volume of unique requested DNS names and TXT response data, while excluding sources such as internal DNS servers to reduce false positives. The article says this behavioral correlation is more effective than IDS signatures for these cases because individual Kerberos and DNS events often look normal on their own.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes how analysts create NAD rules in KATA using SQL queries against a ClickHouse database, either from prebuilt templates or from custom rules. Rule variables allow analysts to tune exclusions, thresholds, DNS server lists, and other infrastructure-specific settings without changing the underlying rule logic. KATA includes 59 prebuilt NAD rule templates across categories such as Large Data Transfers, Suspicious Connections, Domain Attacks, Reconnaissance Activity, Connections to Suspicious Resources, and C2 Communication, but these rules are not enabled by default.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky’s Network Anomaly Detection technology in KATA analyzes network traffic such as DNS, DCE/RPC, Kerberos and other packets to identify suspicious behavior that deviates from a host’s typical activity.","The article uses Kerberoasting and DNS tunneling as practical examples of attacks that can blend into normal corporate network traffic and are difficult for traditional signature-based tools to detect reliably.","KATA’s Kerberoasting detection logic looks for a single source IP address and client account receiving successful Kerberos TGS responses for many unique non-system service principal names within a defined time window.","KATA’s DNS tunneling detection logic looks for DNS sessions with TXT responses where a single source host accumulates a combined volume of unique requested DNS names and TXT response data above a configured threshold.","KATA includes 59 prebuilt Network Anomaly Detection rule templates across categories such as Large Data Transfers, Suspicious Connections, Domain Attacks, Reconnaissance Activity, Connections to Suspicious Resources, and C2 Communication, but these rules are not enabled by default."],"insights":["For Kerberoasting detection, excluding system service principal names is important because those accounts are common in corporate environments, have highly complex passwords, and can otherwise inflate unique SPN counts enough to cause false positives.","The article emphasizes that a Kerberoasting detector based on IDS signatures can count Kerberos packets but cannot evaluate whether the requested service principal names are unique, which is why it would produce many false positives in normal domain traffic.","For DNS tunneling, the rule must exclude traffic between DNS servers because it duplicates client requests and can incorrectly trigger alerts.","KATA’s NAD rules are intentionally not enabled by default because their variables, such as DNS server lists, excluded IP addresses, excluded users, and traffic thresholds, need to be tuned to each organization’s infrastructure.","The DNS tunneling rule treats the tunnel as activity spread across multiple DNS sessions rather than a single suspicious request, which allows it to detect behavior that would otherwise appear as fragmented normal DNS traffic."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how Network Anomaly Detection in Kaspersky Anti Targeted Attack is used to identify attacks that blend into ordinary corporate network traffic. It focuses on Kerberoasting and DNS tunneling, two techniques that use standard domain infrastructure protocols and can be difficult for traditional network attack detection tools to distinguish from legitimate activity. KATA’s NAD analyzes traffic such as DNS, DCE/RPC, Kerberos, and other packets to detect suspicious deviations from typical host behavior.\u003c/p\u003e\n\n\u003cp\u003eFor Kerberoasting, KATA looks for a single source IP address and client account receiving successful Kerberos TGS responses for many unique, non-system service principal names within a defined time window. For DNS tunneling via TXT records, KATA looks for a single source host accumulating a large combined volume of unique requested DNS names and TXT response data, while excluding sources such as internal DNS servers to reduce false positives. The article says this behavioral correlation is more effective than IDS signatures for these cases because individual Kerberos and DNS events often look normal on their own.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes how analysts create NAD rules in KATA using SQL queries against a ClickHouse database, either from prebuilt templates or from custom rules. Rule variables allow analysts to tune exclusions, thresholds, DNS server lists, and other infrastructure-specific settings without changing the underlying rule logic. KATA includes 59 prebuilt NAD rule templates across categories such as Large Data Transfers, Suspicious Connections, Domain Attacks, Reconnaissance Activity, Connections to Suspicious Resources, and C2 Communication, but these rules are not enabled by default.\u003c/p\u003e\n"},{"n":36,"title":"What the Agentic SOC Still Gets Wrong: 15 Years In","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/agentic-soc-lessons-15-years-machine-decisions","time":"15:13","priority":"MAY READ","score":55,"tldr":"The agentic SOC’s biggest challenges are not new: success depends on unified telemetry, natural-language control by domain experts, outcome-based measurement, and circuit breakers to stop machine errors from scaling. AI agents can shorten the distance between detection and response, but only if their reach is carefully governed.","briefOverview":"\u003cp\u003eThe article argues that today’s agentic SOC discussion repeats lessons the author learned while building AI-driven fraud and security systems over the past fifteen years. The author describes a 2011 Fraud Rules Manager platform at MasterCard that let fraud analysts write AI and machine learning rules in plain language to respond to flash-fraud attacks in near real time. The central point is that the hard problems of agentic security operations are not new, but older problems appearing in a more capable form.\u003c/p\u003e\n\n\u003cp\u003eThe author says the real promise of an agentic SOC is not simply better detection, but reducing the distance between signal and response. A key warning is that machines fail differently from people: an analyst may make a few independent mistakes, while an agent can repeat the same mistake thousands of times in a minute. Because of that, the article calls for circuit breakers such as hard limits, rate caps, and automatic kill switches that monitor anomalous agent behavior.\u003c/p\u003e\n\n\u003cp\u003eThe article also emphasizes that agents need unified telemetry and clear natural-language interaction with domain experts to be useful and trustworthy. It says agents reasoning over partial cloud, SaaS, and identity data can produce confident but wrong conclusions, so teams should unify signal before automating. The author argues that organizations should measure agentic SOC efforts by outcomes such as reduced material risk and improved resilience, rather than activity measures like faster triage alone.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The author says the agentic SOC’s real promise is not smarter detection, but reducing the delay between a signal and a response.","The article argues that AI agents need circuit breakers such as hard limits, rate caps, and automatic kill switches because they can repeat the same mistake at large scale very quickly.","The author says domain experts must be able to interrogate, correct, and steer AI agents in natural language rather than treating them as black boxes.","The article states that agentic AI requires unified telemetry because agents reasoning over partial data can produce confident but wrong conclusions.","The author argues that agentic SOC programs should be measured by reduced material risk and improved resilience, not by activity metrics such as faster triage alone."],"insights":["Teams should monitor the behavior of the AI defender itself, not only the attacker, because the article says most teams instrument threats while few instrument anomalous agent behavior.","The article frames explainability as an operational control rather than a compliance exercise, because experts need it to question, correct, and steer the agent.","The author’s fraud examples suggest that agentic SOC programs should be judged against business outcomes such as protected revenue, restored deliverability, and reduced customer friction, not only security workflow speed.","The article argues that adding AI on top of fragmented cloud, SaaS, and identity data can make security worse by producing convincing but incorrect conclusions."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that today’s agentic SOC discussion repeats lessons the author learned while building AI-driven fraud and security systems over the past fifteen years. The author describes a 2011 Fraud Rules Manager platform at MasterCard that let fraud analysts write AI and machine learning rules in plain language to respond to flash-fraud attacks in near real time. The central point is that the hard problems of agentic security operations are not new, but older problems appearing in a more capable form.\u003c/p\u003e\n\n\u003cp\u003eThe author says the real promise of an agentic SOC is not simply better detection, but reducing the distance between signal and response. A key warning is that machines fail differently from people: an analyst may make a few independent mistakes, while an agent can repeat the same mistake thousands of times in a minute. Because of that, the article calls for circuit breakers such as hard limits, rate caps, and automatic kill switches that monitor anomalous agent behavior.\u003c/p\u003e\n\n\u003cp\u003eThe article also emphasizes that agents need unified telemetry and clear natural-language interaction with domain experts to be useful and trustworthy. It says agents reasoning over partial cloud, SaaS, and identity data can produce confident but wrong conclusions, so teams should unify signal before automating. The author argues that organizations should measure agentic SOC efforts by outcomes such as reduced material risk and improved resilience, rather than activity measures like faster triage alone.\u003c/p\u003e\n"},{"n":9,"title":"Data Security Scanning Performance: Why Full Coverage Doesn't Mean Slow Scans","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/data-scanning-performance","time":"16:51","priority":"MAY READ","score":45,"tldr":"Varonis argues that full data security scans do not have to be slow because performance is often limited more by cloud API throttling than compute, and techniques like Dynamic Data Concentration and Smart Scan reduce redundant work while prioritizing high-risk findings. The bigger value is automated remediation, which can turn scan results into rapid risk reduction at scale.","briefOverview":"\u003cp\u003eThe article explains how Varonis approaches data security scanning performance and argues that full coverage does not necessarily mean slow scans. It says the real measure of performance is how much data a platform covers, how quickly it surfaces the most important risk, and whether it can automatically fix what it finds. The article frames automated remediation as essential because scan results can otherwise create large backlogs of exposed data.\u003c/p\u003e\n\n\u003cp\u003eVaronis measures scanning capacity in scan units, which map to compute resources and scale predictably as more units are added. However, the article says scan speed is often constrained by API rate limits from cloud services such as Google Workspace, AWS, and Box. It gives an example where a Google Workspace scan making about 342 API calls per minute per collector would hit a 1,000-call-per-minute limit after roughly three units, making additional units ineffective.\u003c/p\u003e\n\n\u003cp\u003eThe article describes several ways Varonis reduces scanning friction, including private collectors that scan inside the customer’s cloud environment, Dynamic Data Concentration to avoid repeated work on repetitive files, and Smart Scan to prioritize high-risk data early. It also notes tradeoffs for capabilities such as OCR, Cloud Relay, and detailed permission analysis, which can increase processing demands. In one environment, the article says automated remediation addressed 900,000 sensitive files within one day, reduced nearly 64,000 exposed folders to zero within one day, and removed 3 million overexposed records within two days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says the real limit on data security scan speed is often API rate limits set by cloud providers such as Google Workspace, AWS, and Box.","Varonis Data Security Platform measures scanning capacity in scan units, and performance scales predictably as more units are added until an external bottleneck such as API throttling is reached.","Varonis says its private data collector can run inside a customer’s own cloud environment so classified data does not leave that environment and only metadata returns to Varonis.","Dynamic Data Concentration identifies repetitive files, scans enough to classify the pattern confidently, and avoids reopening files that are already classified while still accounting for the full data store.","The article states that automated remediation reduced 900,000 sensitive files within one day, nearly 64,000 exposed folders to zero within one day, and 3 million overexposed records within two days in one environment."],"insights":["Adding more scanning capacity can stop improving scan speed once a cloud provider’s API limit is reached, so teams should check throttling indicators before assuming they need more infrastructure.","Where scanning runs can materially change both cost and privacy exposure, because cloud-to-cloud scanning may move sensitive data across the internet and create egress charges, while an in-environment collector keeps classified data inside the customer’s cloud.","The article separates speed to finish from speed to act: prioritizing high-risk findings early can let remediation begin before a full scan is complete.","Some scan features intentionally trade speed for visibility, such as OCR for scanned documents and images, Cloud Relay for outbound-only connectivity, and deeper processing of rich permissions and metadata."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how Varonis approaches data security scanning performance and argues that full coverage does not necessarily mean slow scans. It says the real measure of performance is how much data a platform covers, how quickly it surfaces the most important risk, and whether it can automatically fix what it finds. The article frames automated remediation as essential because scan results can otherwise create large backlogs of exposed data.\u003c/p\u003e\n\n\u003cp\u003eVaronis measures scanning capacity in scan units, which map to compute resources and scale predictably as more units are added. However, the article says scan speed is often constrained by API rate limits from cloud services such as Google Workspace, AWS, and Box. It gives an example where a Google Workspace scan making about 342 API calls per minute per collector would hit a 1,000-call-per-minute limit after roughly three units, making additional units ineffective.\u003c/p\u003e\n\n\u003cp\u003eThe article describes several ways Varonis reduces scanning friction, including private collectors that scan inside the customer’s cloud environment, Dynamic Data Concentration to avoid repeated work on repetitive files, and Smart Scan to prioritize high-risk data early. It also notes tradeoffs for capabilities such as OCR, Cloud Relay, and detailed permission analysis, which can increase processing demands. In one environment, the article says automated remediation addressed 900,000 sensitive files within one day, reduced nearly 64,000 exposed folders to zero within one day, and removed 3 million overexposed records within two days.\u003c/p\u003e\n"},{"n":29,"title":"Elastic goes all-in on Hacker Summer Camp at Black Hat and DEF CON in Las Vegas","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/elastic-security-black-hat-defcon-2026","time":"23:59","priority":"MAY READ","score":45,"tldr":"Elastic is using Black Hat and DEF CON 2026 to promote new Elastic Security capabilities aimed at reducing SOC alert overload, including agent-assisted Attack Discovery, stronger endpoint protection, and plain-language automation with human approvals. The core message is that Elastic wants to move teams toward “Alert Zero” by combining machine-speed triage with analyst oversight rather than replacing humans.","briefOverview":"\u003cp\u003eElastic is presenting its latest security capabilities at Black Hat and DEF CON in Las Vegas, including events at Black Hat and a Capture the Flag challenge at DEF CON’s Blue Team Village. The company frames these updates around its goal of “Alert Zero,” where agents and analysts work together to reduce raw alert queues into validated threats. Elastic says this approach is meant to help security operations teams avoid being overwhelmed by alerts while keeping human judgment in the process.\u003c/p\u003e\n\n\u003cp\u003eAttack Discovery now investigates alerts by threat-hunting raw events, checking entity risk for users and hosts, corroborating findings across data sources, and classifying events as validated attacks. When it finds activity that existing rules missed, it can draft a detection rule for an analyst to approve. Elastic says the tool shows its reasoning at each step so analysts can understand why an alert became an attack and what action is recommended.\u003c/p\u003e\n\n\u003cp\u003eElastic also announced endpoint and automation updates, including vulnerable driver coverage in Elastic Defend and full endpoint protection for Windows on ARM. Elastic Defend automatically generates and deploys YARA rules as newly disclosed vulnerable drivers appear in sources such as VirusTotal, loldrivers.io, and Microsoft’s blocklist. Elastic Workflows now supports plain-language automation authoring, versioning, visual workflow views, and human-in-the-loop approvals routed to tools such as Slack.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic will showcase its latest security innovations at Black Hat and DEF CON in Las Vegas, including events at Black Hat and a Capture the Flag challenge at DEF CON’s Blue Team Village.","Elastic describes its “Alert Zero” goal as reducing alert queues to validated threats through agents and analysts working together, rather than eliminating alerts or replacing analysts.","Attack Discovery investigates alerts by threat-hunting raw events, checking entity risk for involved users and hosts, corroborating findings across data sources, and classifying events as validated attacks.","Elastic Defend now automatically generates and deploys YARA rules for newly disclosed vulnerable drivers and provides full endpoint protection for Windows on ARM.","Elastic Workflows now supports plain-language automation authoring, version control, visual workflow views, and human-in-the-loop approvals routed to tools such as Slack."],"insights":["Elastic frames analyst burnout as a product-design problem, arguing that tools creating too much work are a central reason security teams struggle.","Attack Discovery’s auto-drafted detection rules are positioned as a feedback loop: when an investigation finds something existing rules missed, the platform can propose a rule to close that same gap after analyst approval.","Elastic is emphasizing transparency in its agentic SOC approach by saying analysts can see the reasoning behind each attack classification and recommended action instead of trusting a black box.","Elastic’s vulnerable-driver protection is designed to update outside normal release cycles by monitoring public disclosure sources and instantly deploying generated YARA rules as new drivers are disclosed.","Elastic’s automation strategy keeps human approvals inside everyday collaboration tools such as Slack, suggesting the platform is intended to automate routine work without removing analyst control over judgment-heavy decisions."],"referencedReports":[],"body":"\u003cp\u003eElastic is presenting its latest security capabilities at Black Hat and DEF CON in Las Vegas, including events at Black Hat and a Capture the Flag challenge at DEF CON’s Blue Team Village. The company frames these updates around its goal of “Alert Zero,” where agents and analysts work together to reduce raw alert queues into validated threats. Elastic says this approach is meant to help security operations teams avoid being overwhelmed by alerts while keeping human judgment in the process.\u003c/p\u003e\n\n\u003cp\u003eAttack Discovery now investigates alerts by threat-hunting raw events, checking entity risk for users and hosts, corroborating findings across data sources, and classifying events as validated attacks. When it finds activity that existing rules missed, it can draft a detection rule for an analyst to approve. Elastic says the tool shows its reasoning at each step so analysts can understand why an alert became an attack and what action is recommended.\u003c/p\u003e\n\n\u003cp\u003eElastic also announced endpoint and automation updates, including vulnerable driver coverage in Elastic Defend and full endpoint protection for Windows on ARM. Elastic Defend automatically generates and deploys YARA rules as newly disclosed vulnerable drivers appear in sources such as VirusTotal, loldrivers.io, and Microsoft’s blocklist. Elastic Workflows now supports plain-language automation authoring, versioning, visual workflow views, and human-in-the-loop approvals routed to tools such as Slack.\u003c/p\u003e\n"},{"n":30,"title":"Alert Zero: AI-driven alert triage and attack investigation for the agentic SOC","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/agentic-soc-alert-triage-alertzero","time":"00:00","priority":"MAY READ","score":45,"tldr":"Elastic Security 9.5 introduces AI-assisted alert triage, Attack Discovery, and Workflows to help SOC teams reduce alert fatigue by filtering false positives and turning related alerts into evidence-backed attack narratives. The key message is that Elastic is promoting a practical “Alert Zero” approach where agents handle repetitive triage while analysts retain control over high-risk decisions.","briefOverview":"\u003cp\u003eElastic describes Alert Zero as a state that security operations centers work toward over time, where the alert queue no longer dictates an analyst’s entire day. Elastic Security 9.5 brings together Security alert analysis, Attack Discovery, and Elastic Workflows to help teams reduce repetitive alert handling while keeping analysts in control. The article emphasizes that Alert Zero does not mean every alert disappears or that decisions are handed over to autopilot.\u003c/p\u003e\n\n\u003cp\u003eSecurity alert analysis provides a first-pass assessment for selected detection rules by gathering alert details, related alerts, frequency, and prior resolution history. It can classify alerts as true positives, false positives, or inconclusive, add notes with confidence and rationale, and optionally auto-close high-confidence false positives only when that setting is enabled. Elastic recommends starting with notes and tags, comparing results with analyst decisions, and adding auto-close gradually.\u003c/p\u003e\n\n\u003cp\u003eAttack Discovery takes the remaining alerts worth investigating and groups them into attack chains with supporting evidence and narratives. In Elastic Security 9.5, discoveries live on the Attacks page under Detections, and the investigation pipeline uses Elastic Agent Builder and Elastic Workflows to retrieve alerts, hunt for related activity, inspect entity context, and search raw logs. Elastic Workflows can schedule or trigger Attack Discovery, connect custom retrieval or validation steps, and integrate attack handling into existing SOC playbooks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security 9.5 brings together Security alert analysis, Attack Discovery, and Elastic Workflows to help SOC teams move toward an Alert Zero operating model.","The Security alert analysis workflow can classify selected rule alerts as true positives, false positives, or inconclusive, add notes with confidence and rationale, and optionally auto-close high-confidence false positives when enabled.","Attack Discovery correlates alerts into attack chains, investigates related activity using Elastic Agent Builder and Elastic Workflows, and presents grounded attack narratives on the Attacks page under Detections.","If Attack Discovery finds activity that existing detections missed, it can show a detection gap analysis and draft an ES|QL rule, but an analyst must review and explicitly approve the draft before any rule is created.","Elastic Workflows lets teams schedule or trigger Attack Discovery, connect custom retrieval or validation workflows, and manage alert and attack status, tags, assignees, and notes through existing SOC playbooks."],"insights":["Elastic recommends beginning with notes and tags rather than auto-close, then comparing the agent’s classifications with analyst decisions before granting more autonomy.","Using Security alert analysis before Attack Discovery can reduce unnecessary token usage by giving Attack Discovery a cleaner set of open alerts to investigate.","Elastic suggests monitoring true-positive escapes more closely than queue reduction, making investigation quality a more important success measure than simply lowering alert volume.","Attack Discovery can expose missed detection coverage during an investigation and draft an ES|QL rule, turning analyst findings directly into detection engineering work while still requiring human approval.","Elastic emphasizes measuring how much time analysts save rebuilding context repeatedly, rather than treating an empty alert queue as the main outcome."],"referencedReports":[],"body":"\u003cp\u003eElastic describes Alert Zero as a state that security operations centers work toward over time, where the alert queue no longer dictates an analyst’s entire day. Elastic Security 9.5 brings together Security alert analysis, Attack Discovery, and Elastic Workflows to help teams reduce repetitive alert handling while keeping analysts in control. The article emphasizes that Alert Zero does not mean every alert disappears or that decisions are handed over to autopilot.\u003c/p\u003e\n\n\u003cp\u003eSecurity alert analysis provides a first-pass assessment for selected detection rules by gathering alert details, related alerts, frequency, and prior resolution history. It can classify alerts as true positives, false positives, or inconclusive, add notes with confidence and rationale, and optionally auto-close high-confidence false positives only when that setting is enabled. Elastic recommends starting with notes and tags, comparing results with analyst decisions, and adding auto-close gradually.\u003c/p\u003e\n\n\u003cp\u003eAttack Discovery takes the remaining alerts worth investigating and groups them into attack chains with supporting evidence and narratives. In Elastic Security 9.5, discoveries live on the Attacks page under Detections, and the investigation pipeline uses Elastic Agent Builder and Elastic Workflows to retrieve alerts, hunt for related activity, inspect entity context, and search raw logs. Elastic Workflows can schedule or trigger Attack Discovery, connect custom retrieval or validation steps, and integrate attack handling into existing SOC playbooks.\u003c/p\u003e\n"},{"n":32,"title":"Socket Is Sponsoring Composer and Packagist","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/socket-sponsoring-composer-and-packagist?utm_medium=feed","time":"07:02","priority":"MAY READ","score":45,"tldr":"Socket is joining the new Composer and Packagist sponsorship program to help fund the operations and security work behind PHP’s package registry. The support comes as Packagist faces rising usage, more supply chain attacks, and plans for stronger defenses like mandatory MFA, transparency logs, and signed provenance.","briefOverview":"\u003cp\u003eSocket is a launch sponsor of the new Composer and Packagist sponsorship program announced by Nils Adermann, Jordi Boggiano, and the team that maintains PHP\u0026rsquo;s package infrastructure. The program expands Packagist\u0026rsquo;s funding beyond Private Packagist and donated infrastructure for the first time. The article says Packagist is facing rising usage, more frequent and sophisticated supply chain attacks, expanding regulatory and compliance requirements, and increased consumption and attacks accelerated by AI.\u003c/p\u003e\n\n\u003cp\u003eThe sponsorship money supports the work needed to keep Packagist running, including around-the-clock operations, publisher support, emergency response to attacks, ongoing maintenance, and engineering for new supply chain defenses. Socket says it has worked with the Packagist team during several supply chain attacks, including the Mini Shai-Hulud incident involving \u003ccode\u003eintercom/intercom-php\u003c/code\u003e, eight Composer packages hiding an install hook in \u003ccode\u003epackage.json\u003c/code\u003e, and the Laravel-Lang backdoor across more than 700 versions. The article emphasizes the Packagist team\u0026rsquo;s responsiveness during incidents, including nights and weekends.\u003c/p\u003e\n\n\u003cp\u003ePackagist has already added several defenses, including making stable versions on Packagist.org immutable, building a public transparency log of package changes, and shipping a unified dependency policy framework in Composer 2.10. The article says future work includes mandatory MFA, organizational package ownership, and signed build provenance for installed packages. Socket says it is supporting Packagist because registries act as stewards of community-created work and encourages other companies that build on Packagist to do the same.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket is a launch sponsor of the new Composer and Packagist sponsorship program announced by Nils Adermann, Jordi Boggiano, and the Packagist team.","Packagist is expanding its funding beyond Private Packagist and donated infrastructure because usage is rising, supply chain attacks are increasing, and compliance requirements are expanding.","The sponsorship money funds around-the-clock operations, publisher support, emergency response to attacks, ongoing maintenance, and engineering for new supply chain defenses.","Socket worked with the Packagist team on several supply chain attacks, including incidents involving intercom/intercom-php, eight Composer packages hiding an install hook in package.json, and the Laravel-Lang backdoor.","The Packagist team has made stable versions on Packagist.org immutable, built a public transparency log of package changes, and shipped a unified dependency policy framework in Composer 2.10."],"insights":["Packagist’s maintainers are treating registry security as a shared ecosystem responsibility by seeking funding from companies that build on the registry, rather than relying mainly on their own commercial product and donated infrastructure.","The article highlights that real-time coordination between external security researchers and registry maintainers was important during multiple PHP supply chain incidents, including the intercom/intercom-php compromise and the Laravel-Lang backdoor.","Packagist is moving beyond reactive incident response by adding structural protections such as immutable stable versions, a public package-change transparency log, and dependency policy controls in Composer 2.10.","The planned additions of mandatory MFA, organizational package ownership, and signed build provenance show that Packagist is prioritizing protections around publisher identity, ownership, and trust in installed code."],"referencedReports":[],"body":"\u003cp\u003eSocket is a launch sponsor of the new Composer and Packagist sponsorship program announced by Nils Adermann, Jordi Boggiano, and the team that maintains PHP\u0026rsquo;s package infrastructure. The program expands Packagist\u0026rsquo;s funding beyond Private Packagist and donated infrastructure for the first time. The article says Packagist is facing rising usage, more frequent and sophisticated supply chain attacks, expanding regulatory and compliance requirements, and increased consumption and attacks accelerated by AI.\u003c/p\u003e\n\n\u003cp\u003eThe sponsorship money supports the work needed to keep Packagist running, including around-the-clock operations, publisher support, emergency response to attacks, ongoing maintenance, and engineering for new supply chain defenses. Socket says it has worked with the Packagist team during several supply chain attacks, including the Mini Shai-Hulud incident involving \u003ccode\u003eintercom/intercom-php\u003c/code\u003e, eight Composer packages hiding an install hook in \u003ccode\u003epackage.json\u003c/code\u003e, and the Laravel-Lang backdoor across more than 700 versions. The article emphasizes the Packagist team\u0026rsquo;s responsiveness during incidents, including nights and weekends.\u003c/p\u003e\n\n\u003cp\u003ePackagist has already added several defenses, including making stable versions on Packagist.org immutable, building a public transparency log of package changes, and shipping a unified dependency policy framework in Composer 2.10. The article says future work includes mandatory MFA, organizational package ownership, and signed build provenance for installed packages. Socket says it is supporting Packagist because registries act as stewards of community-created work and encourages other companies that build on Packagist to do the same.\u003c/p\u003e\n"},{"n":33,"title":"Introducing Censys IOC Investigator: Run Every Lead Like You’ve Got Hours","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/introducing-censys-ioc-investigator/","time":"19:24","priority":"MAY READ","score":45,"tldr":"Censys is launching IOC Investigator, an AI-powered threat investigation tool that automates IOC pivoting, infrastructure mapping, and host profiling using Censys’ Internet Map. The key takeaway is that it aims to turn hours of manual threat hunting into minutes while returning evidence-backed, analyst-verifiable findings.","briefOverview":"\u003cp\u003eCensys is launching Censys IOC Investigator in open beta as an AI-powered threat investigation feature. The tool takes a single network observable, a bulk list, or an intelligence report and automates pivoting, infrastructure mapping, and host profiling. It runs investigations in parallel across Censys’ Internet Map and returns ranked findings with supporting evidence.\u003c/p\u003e\n\n\u003cp\u003eCensys says the feature grew out of internal workflows used by Censys ARC researchers for adversary tracking, threat hunting, fingerprinting, and detection engineering. The article emphasizes that IOC Investigator uses large language models for orchestration and decomposition, while keeping the investigation pipeline deterministic wherever possible. Outputs can include an investigation log, saved query, platform links, written report, relationship diagram, confidence score, and notes on where evidence is thin.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates the tool using a Jumpsec report on a DPRK BlueNoroff ClickFix kit and cites prior ARC investigations into USPS smishing infrastructure and AsyncRAT variants as examples of the kinds of evidence-backed pivots the workflow supports. Censys says durable signals such as DNS history, HTTP banner hashes, asset paths, cookie theme names, and TLS certificate structures can remain useful even when hostnames and IP addresses rotate. The open beta is scheduled for August 10 after Black Hat USA 2026 for organizations on the Adversary Investigation plan, with no credits charged during beta and general availability targeted for September 30.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys is launching Censys IOC Investigator in open beta as an AI-powered threat investigation feature that automates pivoting, infrastructure mapping, and host profiling.","IOC Investigator runs investigations across Censys’ Internet Map and returns ranked findings with evidence, including sources, queries, and confidence scores.","The tool can take a single indicator, a bulk list, or a raw intelligence report, then check history, related infrastructure, and host profiles in parallel.","Censys says large language models are used for orchestration and decomposition, while the pipeline remains deterministic wherever possible rather than relying on the model for verdicts.","The open beta opens on August 10 after Black Hat USA 2026 for organizations on the Adversary Investigation plan, with no credits charged during beta and three concurrent investigations per user."],"insights":["Censys emphasizes that IOC Investigator uses large language models for orchestration and decomposition rather than final judgments, reflecting a design choice to keep security conclusions tied to deterministic evidence instead of model fluency.","The tool grew out of Censys ARC’s internal research workflows rather than a planned product roadmap, meaning its features are based on processes already used for adversary tracking, threat hunting, fingerprinting, and detection engineering.","Censys highlights durable infrastructure patterns, such as HTTP banner hashes, asset paths, DNS history, and TLS certificate structures, as more valuable pivots than hostnames or IP addresses that rotate frequently.","The article positions the strength of AI-based investigation as dependent on the underlying data source, arguing that Censys’ Internet Map is the differentiator because it includes broad protocol coverage, years of history, active DNS resolution, certificates, scans, and threat intelligence."],"referencedReports":[{"title":"Inside a DPRK BlueNoroff ClickFix Kit","url":"https://www.jumpsec.com/guides/inside-a-dprk-bluenoroff-clickfix-kit/","publisher":"Jumpsec","context":"The article uses Jumpsec’s report on a DPRK BlueNoroff ClickFix kit as the example input for demonstrating Censys IOC Investigator.","category":"research","primary":false}],"body":"\u003cp\u003eCensys is launching Censys IOC Investigator in open beta as an AI-powered threat investigation feature. The tool takes a single network observable, a bulk list, or an intelligence report and automates pivoting, infrastructure mapping, and host profiling. It runs investigations in parallel across Censys’ Internet Map and returns ranked findings with supporting evidence.\u003c/p\u003e\n\n\u003cp\u003eCensys says the feature grew out of internal workflows used by Censys ARC researchers for adversary tracking, threat hunting, fingerprinting, and detection engineering. The article emphasizes that IOC Investigator uses large language models for orchestration and decomposition, while keeping the investigation pipeline deterministic wherever possible. Outputs can include an investigation log, saved query, platform links, written report, relationship diagram, confidence score, and notes on where evidence is thin.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates the tool using a Jumpsec report on a DPRK BlueNoroff ClickFix kit and cites prior ARC investigations into USPS smishing infrastructure and AsyncRAT variants as examples of the kinds of evidence-backed pivots the workflow supports. Censys says durable signals such as DNS history, HTTP banner hashes, asset paths, cookie theme names, and TLS certificate structures can remain useful even when hostnames and IP addresses rotate. The open beta is scheduled for August 10 after Black Hat USA 2026 for organizations on the Adversary Investigation plan, with no credits charged during beta and general availability targeted for September 30.\u003c/p\u003e\n"},{"n":5,"title":"ESET tracks rise in malicious AI skills and adaptable malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/eset-tracks-rise-in-malicious-ai-skills-and-adaptable-malware/","time":"14:01","priority":"MAY READ","score":40,"tldr":"ESET’s H1 2026 threat report says attackers are rapidly adapting existing tactics with AI, including malicious AI skills and early AI-assisted malware like PromptSpy. Social engineering methods such as ClickFix and QR-code phishing are also rising, while ransomware crews continue using EDR-killing tools despite fewer victims paying ransoms.","briefOverview":"\u003cp\u003eESET’s H1 2026 Threat Report describes how attackers are improving the efficiency and scalability of their operations by adapting established techniques to new platforms, technologies, and user behaviors. In the first half of 2026, ESET analyzed nearly 900,000 AI skills and found tens of thousands of suspicious instances and thousands of malicious ones. The report says the AI skills ecosystem is growing rapidly, expanding the attack surface.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights PromptSpy, described by ESET researchers as the first known Android malware to use generative AI in its execution flow. PromptSpy uses Google’s Gemini to interpret user interface elements and adapt across devices and environments without relying on hardcoded behavior. The article says this type of AI use in malware remains rare, with LLM guardrails likely slowing adoption.\u003c/p\u003e\n\n\u003cp\u003eSocial engineering and ransomware activity are also emphasized as continuing concerns. ESET says ClickFix detections more than doubled between H2 2025 and H1 2026 as the technique expanded beyond fake CAPTCHA prompts into AI-themed help pages, browser extensions, and cloud authentication scenarios. QR code phishing reached record levels in ESET telemetry, and ESET Research has documented more than 100 EDR killers used in the wild while data from multiple sources suggests a declining share of ransomware victims are paying ransoms.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ESET analyzed nearly 900,000 AI skills in the first half of 2026 and identified tens of thousands of suspicious instances and thousands of malicious ones.","ESET researchers identified PromptSpy as the first known Android malware to use generative AI, specifically Google’s Gemini, in its execution flow.","PromptSpy uses AI to interpret user interface elements and adapt across devices and environments without relying on hardcoded behavior.","ESET detections of ClickFix more than doubled between H2 2025 and H1 2026 as the technique expanded into AI-themed help pages, browser extensions, and cloud authentication scenarios.","ESET Research has documented more than 100 EDR killers used in the wild, with new variants appearing regularly."],"insights":["The growth of malicious AI skills suggests that security attention needs to extend beyond traditional malware to the small functional components used by AI agents.","PromptSpy shows that generative AI can let malware adapt to different devices and environments without hardcoded behavior, making static assumptions about malware behavior less reliable.","ClickFix’s expansion from fake CAPTCHA prompts into AI-themed help pages, browser extensions, and cloud authentication scenarios shows how attackers are reshaping social engineering around current user habits and trusted workflows.","The rise in QR-code phishing indicates that attackers are using the shift to mobile interaction to bypass quick visual checks that users may apply to ordinary links.","The continued use of more than 100 documented EDR killers shows that disabling security tools remains a recurring part of ransomware operations even as fewer victims appear to be paying ransoms."],"referencedReports":[],"body":"\u003cp\u003eESET’s H1 2026 Threat Report describes how attackers are improving the efficiency and scalability of their operations by adapting established techniques to new platforms, technologies, and user behaviors. In the first half of 2026, ESET analyzed nearly 900,000 AI skills and found tens of thousands of suspicious instances and thousands of malicious ones. The report says the AI skills ecosystem is growing rapidly, expanding the attack surface.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights PromptSpy, described by ESET researchers as the first known Android malware to use generative AI in its execution flow. PromptSpy uses Google’s Gemini to interpret user interface elements and adapt across devices and environments without relying on hardcoded behavior. The article says this type of AI use in malware remains rare, with LLM guardrails likely slowing adoption.\u003c/p\u003e\n\n\u003cp\u003eSocial engineering and ransomware activity are also emphasized as continuing concerns. ESET says ClickFix detections more than doubled between H2 2025 and H1 2026 as the technique expanded beyond fake CAPTCHA prompts into AI-themed help pages, browser extensions, and cloud authentication scenarios. QR code phishing reached record levels in ESET telemetry, and ESET Research has documented more than 100 EDR killers used in the wild while data from multiple sources suggests a declining share of ransomware victims are paying ransoms.\u003c/p\u003e\n"},{"n":25,"title":"Top enterprise SAST tools 2026","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/top-enterprise-sast-tools","time":"20:05","priority":"MAY READ","score":40,"tldr":"The article argues that enterprise SAST tools should be judged mainly on false-positive reduction, developer workflow integration, governance, compliance reporting, and predictable cost. It positions Aikido Security as the best option versus legacy tools like Checkmarx, Veracode, Fortify, Snyk Code, and SonarQube because of its AI-assisted noise reduction, remediation, and faster rollout.","briefOverview":"\u003cp\u003eThe article compares enterprise SAST tools for 2026, focusing on Aikido Security, Checkmarx, Veracode, Fortify, Snyk Code, and SonarQube Enterprise. It says many enterprises have adopted SAST, but false positives and developer friction remain major problems at scale. It also argues that enterprise SAST must support audit requirements for frameworks such as SOC 2, ISO 27001, and PCI DSS.\u003c/p\u003e\n\n\u003cp\u003eThe article presents Aikido Security as the best option for enterprise teams that want noise reduction, governance, compliance reporting, private deployment, and faster rollout. It says Aikido uses AI-powered noise reduction and reachability analysis to reduce false positives by up to 95%, includes AI AutoFix and AutoTriage, supports 20+ languages, and integrates with major CI/CD systems. It also describes features such as RBAC, SSO/SCIM, per-repository CI gating, CODEOWNERS routing, audit logs, and compliance reporting.\u003c/p\u003e\n\n\u003cp\u003eThe article says enterprises should evaluate SAST tools based on noise at scale, AI remediation, pipeline integration, policy enforcement, governance, compliance, ownership routing, and cost. It notes that AI-generated code increases code volume and makes SAST accuracy, speed, and pricing models more important. It also describes tradeoffs in other tools, including slower scans, multi-week implementations, opaque or high pricing, separate module costs, noisier findings, limited advanced taint analysis, and security being secondary to code quality in some platforms.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article compares enterprise SAST tools including Aikido Security, Checkmarx, Veracode, Fortify, Snyk Code, and SonarQube Enterprise across noise, remediation, coverage, governance and compliance, and cost.","The article states that untuned SAST tools can produce false positive rates of 30–60%, and that high noise at enterprise scale can cause engineers to disengage.","Enterprise SAST tools are described as important for compliance because SOC 2, ISO 27001, and PCI DSS require evidence that code is tested for vulnerabilities before release.","The article says Aikido Security reduces false positives by up to 95% through AI-powered noise reduction and reachability analysis, supports 20+ languages, and can run on-premises or in-cloud.","The article notes that legacy or broader platforms such as Checkmarx, Veracode, Fortify, Snyk Code, and SonarQube Enterprise may involve tradeoffs such as slower scans, higher or opaque pricing, extra modules, noisier findings, or security being secondary to code quality."],"insights":["Enterprises should evaluate SAST tools by time-to-first-result and ongoing administrative overhead, because the article contrasts tools that return findings on the first commit with legacy platforms that can require six weeks or more of implementation.","AI-generated code changes the economics of SAST because the article says rising code volume makes false-positive rates more damaging and makes line-of-code pricing less predictable.","Finding ownership is an enterprise-scale selection criterion, because the article notes that vulnerabilities in shared libraries can affect many teams but remain unfixed unless findings are routed by repository, path, or code ownership.","A low initial SAST price may not reflect total enterprise cost, because the article highlights add-on charges for modules, AI remediation, enterprise reporting, custom rules, SSO, infrastructure, and admin time.","A tool that combines code quality and SAST may still require a separate security-focused product, as the article says some SonarQube users run it for quality enforcement while layering a dedicated SAST tool on top for security depth."],"referencedReports":[{"title":"DevSecOps statistics","url":"https://appsecsanta.com/research/devsecops-statistics","publisher":"AppSec Santa","context":"The article cites this research for the estimate that 72% of enterprises with 500 or more employees have integrated SAST tools into development pipelines.","category":"research","primary":false}],"body":"\u003cp\u003eThe article compares enterprise SAST tools for 2026, focusing on Aikido Security, Checkmarx, Veracode, Fortify, Snyk Code, and SonarQube Enterprise. It says many enterprises have adopted SAST, but false positives and developer friction remain major problems at scale. It also argues that enterprise SAST must support audit requirements f  standard pricing unchanged for now. GPT-5.6 Sol Fast mode is up to 2.5 times faster than standard processing without reducing the model’s intelligence, but it costs twice the standard API price. OpenAI says the option is designed for time-sensitive coding, research, and agentic workloads, and that other use cases generally do not need it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OpenAI reduced GPT-5.6 Luna API pricing by 80%, lowering it to $0.20 per million input tokens and $1.20 per million output tokens.","OpenAI reduced GPT-5.6 Terra API pricing by 20%, lowering it to $2 per million input tokens and $12 per million output tokens.","OpenAI said the lower prices affect usage counting in Codex and ChatGPT Work, allowing customers to complete more work under the same quota when tasks use these models.","OpenAI is upgrading Auto-review in the ChatGPT app and Codex CLI from GPT-5.4 to GPT-5.6 Luna, which it says should reduce the cost by approximately ten times.","OpenAI introduced GPT-5.6 Sol Fast mode for API customers, offering up to 2.5 times faster processing at twice the standard API price."],"insights":["Customers using Codex or ChatGPT Work may see practical capacity gains without changing plans, because OpenAI says tasks using the cheaper models will deduct less from existing allowances.","OpenAI is positioning GPT-5.6 Luna as both cheaper and highly capable, saying its own intelligence index places Luna at the top among compared models despite its lower cost per task.","The GPT-5.6 Sol Fast mode is targeted only at time-sensitive coding, research, and agentic workloads, with OpenAI explicitly saying most other use cases do not need it.","OpenAI links the Luna and Terra price cuts to recent efficiency improvements in GPT-5.6 Sol, suggesting performance gains in one model are affecting pricing across other GPT-5.6 offerings."],"referencedReports":[],"body":"\u003cp\u003eOpenAI says it has reduced the API prices of two GPT-5.6 models as it works to make its models more efficient. GPT-5.6 Luna now costs \u003cspan class=\"math inline\"\u003e\\(0.20 per million input tokens and \\)\u003c/span\u003e1.20 per million output tokens, down from \u003cspan class=\"math inline\"\u003e\\(1 and \\)\u003c/span\u003e6. GPT-5.6 Terra now costs \u003cspan class=\"math inline\"\u003e\\(2 per million input tokens and \\)\u003c/span\u003e12 per million output tokens, down from \u003cspan class=\"math inline\"\u003e\\(2.50 and \\)\u003c/span\u003e15.\u003c/p\u003e\n\n\u003cp\u003eOpenAI said the new prices also affect how it counts usage in Codex and ChatGPT Work. When new tasks use these models, they deduct less from customers’ allowances, allowing more work to be completed under the same quota. OpenAI is also upgrading Auto-review in the ChatGPT app and Codex CLI from GPT-5.4 to GPT-5.6 Luna, which it says should reduce the cost by approximately ten times.\u003c/p\u003e\n\n\u003cp\u003eOpenAI has also introduced a Fast mode for GPT-5.6 Sol for API customers, while keeping Sol’s standard pricing unchanged for now. GPT-5.6 Sol Fast mode is up to 2.5 times faster than standard processing without reducing the model’s intelligence, but it costs twice the standard API price. OpenAI says the option is designed for time-sensitive coding, research, and agentic workloads, and that other use cases generally do not need it.\u003c/p\u003e\n"}]</script>
