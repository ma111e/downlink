<script type="application/json" id="dl-articles">[{"n":4,"title":"Critical VMware vCenter RCE flaw exploited for reverse SSH access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/critical-vmware-vcenter-rce-flaw-exploited-for-reverse-ssh-access/","time":"16:40","priority":"MUST READ","score":95,"tldr":"Attackers are actively exploiting the critical VMware vCenter Syslog Server flaw CVE-2026-59310 to install reverse_ssh for persistent remote access, with 361 victim IPs observed across 47 countries. Admins should apply Broadcom’s emergency vCenter updates immediately, as no workaround is available.","briefOverview":"\u003cp\u003eA recently patched critical vulnerability, CVE-2026-59310, in VMware vCenter Syslog Server is being exploited in an active campaign to deploy a reverse SSH tool for persistence and remote access. Broadcom disclosed the flaw on July 29 as a critical directory traversal vulnerability that could let an unauthenticated attacker with network access execute arbitrary code. The company provides no workarounds or mitigations and urges administrators to apply the emergency update.\u003c/p\u003e\n\n\u003cp\u003eDigital forensics and incident response company QUIRSO identified compromises at 361 IP addresses across 47 countries, with more than half in Germany, the U.S., Turkey, Iran, and France. QUIRSO said compromised systems began connecting to attacker-controlled infrastructure on August 3, five days after Broadcom disclosed the flaw and released the emergency patch. The campaign expanded quickly, with 151 new victim IP addresses observed on August 4 and 343 victim IPs counted by the next day.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to vulnerable vCenter systems, the attacker deployed the open-source reverse_ssh framework to maintain access and create an outbound command-and-control channel. The article notes that this reverse SSH connection can help bypass firewalls or other network security measures. QUIRSO released a generic YARA rule to detect reverse_ssh client binaries, while noting that legitimate use of the tool can also trigger the alert.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A recently patched critical vulnerability, CVE-2026-59310, in VMware vCenter Syslog Server is being exploited to deploy a reverse SSH tool for persistence and remote access.","QUIRSO identified compromises at 361 IP addresses across 47 countries, with more than half located in Germany, the U.S., Turkey, Iran, and France.","Broadcom disclosed CVE-2026-59310 on July 29 as a critical directory traversal vulnerability that unauthenticated attackers with network access could exploit to execute arbitrary code.","Broadcom provides no workarounds or mitigations and urges administrators to apply the emergency vCenter updates that fix the issue.","QUIRSO said compromised systems began connecting to attacker-controlled infrastructure on August 3, five days after Broadcom disclosed the flaw and released the emergency patch."],"insights":["The exploitation began within five days of Broadcom’s disclosure and emergency patch, showing that the window between public fixes and real-world attacks was very short for this flaw.","The victim count grew rapidly from the first observed callbacks on August 3 to 343 victim IPs by August 5, indicating a fast-moving campaign against exposed vCenter systems.","The attacker’s use of reverse_ssh is especially actionable for defenders because QUIRSO released a YARA rule to detect matching client binaries, though the article notes legitimate use can also trigger it.","Broadcom offered no workaround or mitigation for CVE-2026-59310, making installation of the fixed vCenter releases the only vendor-recommended response described in the article."],"referencedReports":[{"title":"Active Exploitation of CVE-2026-59310: 361 Victim IPs Across 47 Countries","url":"https://medium.com/@quirso_de/active-exploitation-of-cve-2026-59310-361-victim-ips-across-47-countries-9783187cc6ff","publisher":"QUIRSO","context":"The article cites QUIRSO’s analysis for the victim count, timeline, affected countries, and use of reverse_ssh after exploitation.","category":"research","primary":true},{"title":"Broadcom security advisory for CVE-2026-59310","url":"https://support.broadcom.com/web/ecx/support-content-notification/-/external/content/SecurityAdvisories/0/38017","publisher":"Broadcom","context":"The article references Broadcom’s emergency update and affected vCenter releases that address the vulnerability.","category":"advisory","primary":true},{"title":"VMSA-2026-0006 FAQ","url":"https://github.com/vmware/vcf-security-and-compliance-guidelines/tree/main/security-advisories/vmsa-2026-0006","publisher":"VMware","context":"The article says Broadcom urges administrators to consult this FAQ for additional information about the security advisory.","category":"advisory","primary":false}],"body":"\u003cp\u003eA recently patched critical vulnerability, CVE-2026-59310, in VMware vCenter Syslog Server is being exploited in an active campaign to deploy a reverse SSH tool for persistence and remote access. Broadcom disclosed the flaw on July 29 as a critical directory traversal vulnerability that could let an unauthenticated attacker with network access execute arbitrary code. The company provides no workarounds or mitigations and urges administrators to apply the emergency update.\u003c/p\u003e\n\n\u003cp\u003eDigital forensics and incident response company QUIRSO identified compromises at 361 IP addresses across 47 countries, with more than half in Germany, the U.S., Turkey, Iran, and France. QUIRSO said compromised systems began connecting to attacker-controlled infrastructure on August 3, five days after Broadcom disclosed the flaw and released the emergency patch. The campaign expanded quickly, with 151 new victim IP addresses observed on August 4 and 343 victim IPs counted by the next day.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access to vulnerable vCenter systems, the attacker deployed the open-source reverse_ssh framework to maintain access and create an outbound command-and-control channel. The article notes that this reverse SSH connection can help bypass firewalls or other network security measures. QUIRSO released a generic YARA rule to detect reverse_ssh client binaries, while noting that legitimate use of the tool can also trigger the alert.\u003c/p\u003e\n"},{"n":11,"title":"Team PCP Stole 78,330 Secrets From 2,186 Organizations. CloudSEK Just Published the List.","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/teampcp-supply-chain-attack-cicd-secrets-cloudsek-disclosure","time":"17:54","priority":"MUST READ","score":94,"tldr":"CloudSEK published a dataset showing Team PCP exfiltrated 78,330 secrets from CI/CD pipelines at 2,186 organizations in five days by compromising trusted open source components. The main takeaway is that CI/CD runners have become a major supply chain target and need production-grade controls like dependency pinning, runtime monitoring, and outbound network restrictions.","briefOverview":"\u003cp\u003eCloudSEK published a searchable dataset showing that Team PCP exfiltrated 78,330 distinct secrets from the CI/CD pipelines of 2,186 organizations between March 19 and March 24, 2026. StepSecurity’s analysis says the affected organizations include 92 public companies with a combined market capitalization above $6.2 trillion. The article describes Team PCP as a threat actor that compromises trusted open source components, plants credential stealers, collects secrets from build systems, and uses stolen credentials to compromise the next target.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exposure affected multiple CI/CD platforms rather than a single vendor. GitLab led with 1,064 exposed organizations, followed by GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, and CircleCI. The stolen credentials included JWTs, private key blocks, AWS access keys, GitLab and GitHub personal access tokens, OpenAI keys, Slack webhooks, and Google API keys.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity argues that CI/CD pipelines have become a primary target because they often hold cloud deployment keys, signing keys, registry publish tokens, and repository access tokens. The article says common weaknesses include secrets loaded into runners as environment variables, open outbound network access, and mutable dependency references that attackers can silently repoint. It recommends that organizations on the list rotate exposed credentials, audit use of those credentials since March 19, 2026, pin CI/CD dependencies to immutable references, and deploy runtime and network egress controls on runners.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CloudSEK published a searchable dataset showing that Team PCP exfiltrated 78,330 distinct secrets from the CI/CD pipelines of 2,186 organizations between March 19 and March 24, 2026.","The exposed organizations included 92 public companies with a combined market capitalization of $6.2 trillion, according to StepSecurity’s analysis of the CloudSEK dataset.","StepSecurity’s analysis found that GitLab was the most affected CI/CD platform with 1,064 exposed organizations, followed by GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, and CircleCI.","The stolen credentials included JWTs, private key blocks, AWS access keys, GitLab and GitHub personal access tokens, OpenAI keys, Slack webhooks, and Google API keys.","The article says Team PCP’s playbook is to compromise a trusted open source component, run a credential stealer in CI/CD pipelines, exfiltrate secrets over outbound network connections, and use stolen credentials to compromise the next target."],"insights":["The exposure was broader than a GitHub Actions problem: GitLab accounted for the largest number of affected organizations, and Azure DevOps appeared in more than 230 organizations, showing that the same CI/CD weaknesses existed across multiple platforms.","The article identifies outbound network access from build runners as a decisive control point, because Team PCP’s credential theft depended on sending secrets from the runner to attacker-controlled infrastructure.","The leaked secret types show that CI/CD systems can become a path into many other environments, because the dataset included cloud keys, source control tokens, private keys, session tokens, Slack webhooks, and OpenAI API keys.","The article argues that rotating exposed credentials is not sufficient by itself, because the dataset shows what left the runners but not what attackers may already have done with the stolen credentials.","The Team PCP campaign used stolen credentials as fuel for new compromises, making speed of response especially important because each successful theft could help enable the next open source compromise."],"referencedReports":[{"title":"AI Supply Chain Incident","url":"https://exposure.cloudsek.com/ai-supply-chain-incident","publisher":"CloudSEK","context":"The article says CloudSEK's Threat Intelligence team cataloged the Team PCP exposure and published a searchable dataset so organizations can check whether they appear in it.","category":"research","primary":true}],"body":"\u003cp\u003eCloudSEK published a searchable dataset showing that Team PCP exfiltrated 78,330 distinct secrets from the CI/CD pipelines of 2,186 organizations between March 19 and March 24, 2026. StepSecurity’s analysis says the affected organizations include 92 public companies with a combined market capitalization above $6.2 trillion. The article describes Team PCP as a threat actor that compromises trusted open source components, plants credential stealers, collects secrets from build systems, and uses stolen credentials to compromise the next target.\u003c/p\u003e\n\n\u003cp\u003eThe article says the exposure affected multiple CI/CD platforms rather than a single vendor. GitLab led with 1,064 exposed organizations, followed by GitHub Actions, Azure DevOps, Jenkins, Bitbucket Pipelines, and CircleCI. The stolen credentials included JWTs, private key blocks, AWS access keys, GitLab and GitHub personal access tokens, OpenAI keys, Slack webhooks, and Google API keys.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity argues that CI/CD pipelines have become a primary target because they often hold cloud deployment keys, signing keys, registry publish tokens, and repository access tokens. The article says common weaknesses include secrets loaded into runners as environment variables, open outbound network access, and mutable dependency references that attackers can silently repoint. It recommends that organizations on the list rotate exposed credentials, audit use of those credentials since March 19, 2026, pin CI/CD dependencies to immutable references, and deploy runtime and network egress controls on runners.\u003c/p\u003e\n"},{"n":2,"title":"Trezor discloses data breach affecting nearly 14,000 customers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/trezor-discloses-data-breach-affecting-nearly-14-000-customers/","time":"15:13","priority":"MUST READ","score":92,"tldr":"Trezor says nearly 14,000 customers had order contact details exposed after shipping provider ShipMonk was hacked through a Metabase zero-day. Trezor says its own systems and devices were not compromised, but affected customers should watch for targeted phishing attempts.","briefOverview":"\u003cp\u003eTrezor disclosed a data breach affecting nearly 14,000 customers after its shipping and logistics provider, ShipMonk, was hacked. The exposed order data included full names, shipping addresses, email addresses, and phone numbers. Trezor said the incident affects customers from the United States, the United Kingdom, Sweden, Colombia, Brazil, Italy, and Portugal who received orders between May 10 and August 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eTrezor said 11,742 customers had full exposure of name, email, phone number, and shipping address, while 1,947 customers had partial exposure of name, city, and email. The company said its own systems were not compromised, its operations and services were not impacted, and all Trezor devices remain secure. It warned affected customers that the leaked information could be used for more sophisticated phishing attempts, including fake emails, phone calls, fraudulent letters, or impersonation of banks, crypto exchanges, or Trezor.\u003c/p\u003e\n\n\u003cp\u003eShipMonk told affected customers that attackers exploited a vulnerability in the third-party analytics platform Metabase. Metabase previously revealed that threat actors exploited a critical SQL injection zero-day to gain administrator access to compromised customer instances and steal data. BleepingComputer reported that Framework and Tally also notified customers after their Metabase instances were hijacked, and that ShipMonk received extortion emails from the ShinyHunters extortion gang.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trezor disclosed a data breach affecting nearly 14,000 customers after its shipping and logistics provider ShipMonk was hacked.","The exposed order data included full names, shipping addresses, email addresses, and phone numbers for 11,742 customers, while 1,947 customers had partial exposure of name, city, and email.","The breach affects customers from the United States, the United Kingdom, Sweden, Colombia, Brazil, Italy, and Portugal who received orders between May 10 and August 8, 2026.","Trezor said its own systems were not compromised, its operations and services were not impacted, and all Trezor devices remain secure.","ShipMonk told affected customers that attackers exploited a vulnerability in the third-party analytics platform Metabase, which Metabase said was a critical SQL injection zero-day used to access customer instances and steal data."],"insights":["The most immediate risk to affected Trezor customers is not device compromise but targeted social engineering, because attackers obtained contact and shipping details that can make fake emails, calls, letters, or impersonation attempts more convincing.","The incident shows how a breach at a logistics provider can expose sensitive customer information for a hardware wallet maker even when the wallet maker’s own systems and products remain secure.","The Metabase zero-day appears to have had a wider impact beyond ShipMonk, as Framework and Tally also notified customers after their Metabase instances were hijacked.","Trezor has prior evidence that exposed customer contact data can quickly translate into recovery-seed phishing, because attackers used information from its 2024 support portal breach to try to trick users into revealing their 24-word recovery seeds."],"referencedReports":[],"body":"\u003cp\u003eTrezor disclosed a data breach affecting nearly 14,000 customers after its shipping and logistics provider, ShipMonk, was hacked. The exposed order data included full names, shipping addresses, email addresses, and phone numbers. Trezor said the incident affects customers from the United States, the United Kingdom, Sweden, Colombia, Brazil, Italy, and Portugal who received orders between May 10 and August 8, 2026.\u003c/p\u003e\n\n\u003cp\u003eTrezor said 11,742 customers had full exposure of name, email, phone number, and shipping address, while 1,947 customers had partial exposure of name, city, and email. The company said its own systems were not compromised, its operations and services were not impacted, and all Trezor devices remain secure. It warned affected customers that the leaked information could be used for more sophisticated phishing attempts, including fake emails, phone calls, fraudulent letters, or impersonation of banks, crypto exchanges, or Trezor.\u003c/p\u003e\n\n\u003cp\u003eShipMonk told affected customers that attackers exploited a vulnerability in the third-party analytics platform Metabase. Metabase previously revealed that threat actors exploited a critical SQL injection zero-day to gain administrator access to compromised customer instances and steal data. BleepingComputer reported that Framework and Tally also notified customers after their Metabase instances were hijacked, and that ShipMonk received extortion emails from the ShinyHunters extortion gang.\u003c/p\u003e\n"},{"n":7,"title":"New Mirai variant adds stealth capabilities to notorious botnet code","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/new-mirai-variant-adds-stealth-to-botnet-code","time":"15:52","priority":"MUST READ","score":92,"tldr":"FortiGuard Labs reports a new Mirai-based botnet, Evooo1Bot, is exploiting unpatched internet-facing routers and other edge devices from several vendors. Unlike typical Mirai variants, it adds stealthier encrypted command-and-control, honeypot avoidance, credential sniffing, and SOCKS proxy features that let attackers hide their origin and pivot through victims’ infrastructure.","briefOverview":"\u003cp\u003eResearchers at FortiGuard Labs said a previously undocumented Linux-based malware called Evooo1Bot has been actively exploiting vulnerabilities in internet-facing hardware for at least a month. The malware is based on the Mirai botnet code and targets routers and other hardware from Alcatel, D-Link, Mitsubishi Electric, Netgear, Tenda and Telesquare. The report does not say how many devices have been compromised, but FortiGuard Labs telemetry shows activity concentrated in North America, South America, Europe, India, China and Japan.\u003c/p\u003e\n\n\u003cp\u003eEvooo1Bot goes beyond Mirai’s usual distributed denial-of-service functions by adding encrypted communications with command-and-control servers, an SSH scanner that skips devices that appear to be honeypots, and a sniffer for unchanged default access credentials. FortiGuard Labs said these capabilities place Evooo1Bot well beyond the technical baseline of conventional Mirai-derived malware. The malware also abuses the SOCKS protocol to turn compromised routers, firewalls, IP cameras and other edge devices into persistent proxies.\u003c/p\u003e\n\n\u003cp\u003eFortiGuard Labs described the SOCKS capability as arguably the most operationally significant because it can help attackers conceal their true origin, pivot into internal networks, and conduct follow-on operations through a victim’s infrastructure. Mirai’s source code was publicly released in 2016 and has since been used as the basis for numerous variants. The article notes that Mirai descendants such as Aisuru and KimWolf have drawn law enforcement attention, including March actions by agencies from the U.S., Canada and Germany and a May charge against a Canadian man accused of running KimWolf.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["FortiGuard Labs researchers said a previously undocumented Linux-based Mirai variant called Evooo1Bot has been actively exploiting vulnerabilities in internet-facing hardware for at least a month.","Evooo1Bot targets routers and other hardware from Alcatel, D-Link, Mitsubishi Electric, Netgear, Tenda and Telesquare.","FortiGuard Labs telemetry shows Evooo1Bot activity concentrated in North America, South America, Europe, India, China and Japan, but the report does not specify how many devices have been compromised.","Beyond Mirai’s usual distributed denial-of-service functions, Evooo1Bot includes encrypted command-and-control communications, an SSH scanner that avoids apparent honeypots, and a sniffer for unchanged default access credentials.","FortiGuard Labs said Evooo1Bot’s SOCKS proxy capability can turn compromised routers, firewalls, IP cameras and other edge devices into persistent proxies that help attackers conceal their origin and conduct follow-on operations through victims’ infrastructure."],"insights":["FortiGuard Labs described the SOCKS proxy feature as the most operationally significant capability because it can let attackers route later activity through compromised victim devices rather than only use them for denial-of-service traffic.","Evooo1Bot’s credential-sniffing feature shows that unchanged default access credentials remain a practical weakness on internet-facing devices.","The malware’s scanner is designed to skip devices that appear to be honeypots, indicating that this Mirai variant includes measures to avoid some research and detection environments.","The article shows the lasting impact of Mirai’s 2016 source-code release, as Evooo1Bot is another descendant that extends the original botnet’s capabilities nearly a decade later."],"referencedReports":[{"title":"Multi-Functional Linux Botnet Evooo1Bot","url":"https://www.fortinet.com/blog/threat-research/multi-functional-linux-botnet-evooo1bot","publisher":"FortiGuard Labs","context":"The article cites FortiGuard Labs researchers as the source for details about Evooo1Bot’s targets, capabilities, and activity.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at FortiGuard Labs said a previously undocumented Linux-based malware called Evooo1Bot has been actively exploiting vulnerabilities in internet-facing hardware for at least a month. The malware is based on the Mirai botnet code and targets routers and other hardware from Alcatel, D-Link, Mitsubishi Electric, Netgear, Tenda and Telesquare. The report does not say how many devices have been compromised, but FortiGuard Labs telemetry shows activity concentrated in North America, South America, Europe, India, China and Japan.\u003c/p\u003e\n\n\u003cp\u003eEvooo1Bot goes beyond Mirai’s usual distributed denial-of-service functions by adding encrypted communications with command-and-control servers, an SSH scanner that skips devices that appear to be honeypots, and a sniffer for unchanged default access credentials. FortiGuard Labs said these capabilities place Evooo1Bot well beyond the technical baseline of conventional Mirai-derived malware. The malware also abuses the SOCKS protocol to turn compromised routers, firewalls, IP cameras and other edge devices into persistent proxies.\u003c/p\u003e\n\n\u003cp\u003eFortiGuard Labs described the SOCKS capability as arguably the most operationally significant because it can help attackers conceal their true origin, pivot into internal networks, and conduct follow-on operations through a victim’s infrastructure. Mirai’s source code was publicly released in 2016 and has since been used as the basis for numerous variants. The article notes that Mirai descendants such as Aisuru and KimWolf have drawn law enforcement attention, including March actions by agencies from the U.S., Canada and Germany and a May charge against a Canadian man accused of running KimWolf.\u003c/p\u003e\n"},{"n":5,"title":"Microsoft patches LegacyHive Windows zero-day vulnerability","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-patches-legacyhive-windows-zero-day-vulnerability/","time":"17:46","priority":"SHOULD READ","score":88,"tldr":"Microsoft has patched the Windows LegacyHive zero-day, now tracked as CVE-2026-62832, which could let an authenticated local attacker with another account’s credentials load another user’s registry hive and gain administrator privileges. Organizations should apply the August Patch Tuesday updates to mitigate the flaw.","briefOverview":"\u003cp\u003eMicrosoft has released security patches for a Windows zero-day vulnerability known as LegacyHive as part of its August Patch Tuesday updates. The flaw is now tracked as CVE-2026-62832 and affects the Windows User Profile Service. It was disclosed after the July 2026 Patch Tuesday by a security researcher using the handle Nightmare Eclipse, who published a proof-of-concept exploit hours after the July updates were released.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says the vulnerability stems from improper link resolution before file access, also described as “link following,” in the Windows User Profile Service. According to Microsoft, an authenticated attacker with credentials for another local account could run a specially crafted application to load another user’s registry hive. Successful exploitation could allow the attacker to access or modify another user’s data and gain administrator privileges without user interaction.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that the LegacyHive proof-of-concept requires additional credentials, making it harder for threat actors to weaponize than previous exploits released by Nightmare Eclipse. Vulnerability analyst Will Dormann explained that non-admin users could use the exploit to modify the classes registry hive and gain automatic code execution when an admin account logs in to a compromised system. ACROS Security also released free unofficial LegacyHive patches on July 20 for Windows 10 2004 or later and Windows Server 2022 or later before Microsoft’s official fix became available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released security patches for the Windows zero-day vulnerability known as LegacyHive as part of its August Patch Tuesday updates.","Microsoft now tracks LegacyHive as CVE-2026-62832 and says it stems from improper link resolution before file access in the Windows User Profile Service.","Microsoft says an authenticated attacker with credentials for another local account could run a specially crafted application to load another user’s registry hive, access or modify that user’s data, and gain administrator privileges.","The LegacyHive proof-of-concept exploit was published by a researcher using the handle Nightmare Eclipse hours after the July 2026 Patch Tuesday updates were released.","ACROS Security released free unofficial LegacyHive patches on July 20 for systems running Windows 10 2004 or later and Windows Server 2022 or later."],"insights":["The LegacyHive proof-of-concept is harder to weaponize than some previous Nightmare Eclipse exploits because it requires additional credentials.","The vulnerability can be abused by non-admin users to modify the classes registry hive and trigger automatic code execution when an administrator logs in to the compromised system.","Microsoft patched LegacyHive but credited it to an anonymous researcher rather than acknowledging Nightmare Eclipse, who publicly released the proof-of-concept.","Detection queries for Microsoft Defender for Endpoint were published one day after the proof-of-concept release, giving defenders a way to hunt for LegacyHive exploitation before Microsoft’s official patch was available.","LegacyHive is part of a broader pattern of zero-day disclosures by Nightmare Eclipse since April 2026, with several other disclosed Microsoft-related flaws still awaiting official patches."],"referencedReports":[{"title":"CVE-2026-62832","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-62832","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the official tracking and description of the patched LegacyHive vulnerability.","category":"advisory","primary":true},{"title":"LegacyHive exploitation detection queries","url":"https://github.com/GossiTheDog/ThreatHunting/blob/master/AdvancedHuntingQueries/LegacyHive.kql","publisher":"Kevin Beaumont","context":"The article says Kevin Beaumont published Microsoft Defender for Endpoint hunting queries to detect LegacyHive exploitation.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft has released security patches for a Windows zero-day vulnerability known as LegacyHive as part of its August Patch Tuesday updates. The flaw is now tracked as CVE-2026-62832 and affects the Windows User Profile Service. It was disclosed after the July 2026 Patch Tuesday by a security researcher using the handle Nightmare Eclipse, who published a proof-of-concept exploit hours after the July updates were released.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says the vulnerability stems from improper link resolution before file access, also described as “link following,” in the Windows User Profile Service. According to Microsoft, an authenticated attacker with credentials for another local account could run a specially crafted application to load another user’s registry hive. Successful exploitation could allow the attacker to access or modify another user’s data and gain administrator privileges without user interaction.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that the LegacyHive proof-of-concept requires additional credentials, making it harder for threat actors to weaponize than previous exploits released by Nightmare Eclipse. Vulnerability analyst Will Dormann explained that non-admin users could use the exploit to modify the classes registry hive and gain automatic code execution when an admin account logs in to a compromised system. ACROS Security also released free unofficial LegacyHive patches on July 20 for Windows 10 2004 or later and Windows Server 2022 or later before Microsoft’s official fix became available.\u003c/p\u003e\n"},{"n":6,"title":"Flock tightens privacy controls amid scandals over officer abuse","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/flock-safety-audit-assistance-police-departments","time":"16:47","priority":"SHOULD READ","score":78,"tldr":"Flock Safety is tightening controls on its license plate reader system after reports that police officers used it to stalk or track people for personal reasons. Critics say the changes may not prevent abuse because officers can still potentially misrepresent why they are running searches.","briefOverview":"\u003cp\u003eFlock Safety is changing some policies for its license plate reader technology after reports that law enforcement officers used it to track people for personal reasons. The company said all customers will be required by the end of the year to adopt its “Audit Assistance” feature, which flags abnormal activity for review. A user’s account will be automatically suspended while that review takes place.\u003c/p\u003e\n\n\u003cp\u003eFlock will also require officers to enter case codes connected to an investigation when conducting a search, though the requirement can be bypassed in emergencies. The changes follow allegations and reports involving officer misuse, including a New Bedford, Massachusetts, officer accused of using the technology to stalk an ex-girlfriend, three Georgia sheriff’s deputies arrested for similar offenses, and a Washington Post investigation finding at least 50 officers charged with misusing Flock’s tools. Flock described the measures as a continuation of its commitment to safety and privacy, while ACLU senior policy counsel Chad Marlow criticized the announcement as largely a public relations stunt.\u003c/p\u003e\n\n\u003cp\u003eThe new rules are intended to address concerns about the large amount of information collected by Flock cameras and shared across jurisdictions. Flock said clients can limit when their camera data is shared with other agencies, such as allowing searches for missing person investigations but not immigration enforcement, but the article says it is unclear how officers would be prevented from lying about the reason for a search. Flock has contracts with more than 7,000 organizations and about 120,000 license plate readers, while opposition has led to canceled contracts in cities including Los Angeles, Cambridge, Massachusetts, and Eugene, Oregon.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Flock Safety announced it will expand its “Audit Assistance” feature to all customers by the end of the year, with user accounts automatically suspended while abnormal activity is reviewed.","Flock will require officers to enter case codes tied to investigations when conducting searches, though the requirement can be bypassed in emergencies.","The policy changes follow reports that law enforcement officers used Flock license plate readers to track people for personal reasons, including alleged stalking cases in Massachusetts and Georgia.","ACLU senior policy counsel Chad Marlow criticized Flock’s announcement as largely a public relations move and said some measures repeat previously inadequate safeguards.","Flock said customers can limit when camera data is shared with other agencies, such as allowing searches for missing person cases but not for immigration enforcement."],"insights":["Flock’s safeguards rely partly on officers accurately stating the purpose of a search, a weakness the ACLU says has already allowed users to bypass prior controls.","The proposed reduction of retained license plate search data from 30 days to seven days was the one change the ACLU identified as potentially positive, distinguishing it from measures the group viewed as recycled or inadequate.","The scale of Flock’s network, with contracts covering more than 7,000 organizations and about 120,000 license plate readers, means misuse by individual officers can have broad privacy implications across jurisdictions.","Backlash against Flock has already produced concrete consequences, including canceled contracts in Los Angeles, Cambridge, Massachusetts, and Eugene, Oregon."],"referencedReports":[{"title":"How police officers used vast network cameras to spy on their exes","url":"https://www.washingtonpost.com/technology/2026/08/02/how-police-officers-used-vast-network-cameras-spy-their-exes/","publisher":"Washington Post","context":"The article cites a Washington Post investigation that found at least 50 law enforcement officers had been charged with misusing Flock’s tools.","category":"news","primary":false}],"body":"\u003cp\u003eFlock Safety is changing some policies for its license plate reader technology after reports that law enforcement officers used it to track people for personal reasons. The company said all customers will be required by the end of the year to adopt its “Audit Assistance” feature, which flags abnormal activity for review. A user’s account will be automatically suspended while that review takes place.\u003c/p\u003e\n\n\u003cp\u003eFlock will also require officers to enter case codes connected to an investigation when conducting a search, though the requirement can be bypassed in emergencies. The changes follow allegations and reports involving officer misuse, including a New Bedford, Massachusetts, officer accused of using the technology to stalk an ex-girlfriend, three Georgia sheriff’s deputies arrested for similar offenses, and a Washington Post investigation finding at least 50 officers charged with misusing Flock’s tools. Flock described the measures as a continuation of its commitment to safety and privacy, while ACLU senior policy counsel Chad Marlow criticized the announcement as largely a public relations stunt.\u003c/p\u003e\n\n\u003cp\u003eThe new rules are intended to address concerns about the large amount of information collected by Flock cameras and shared across jurisdictions. Flock said clients can limit when their camera data is shared with other agencies, such as allowing searches for missing person investigations but not immigration enforcement, but the article says it is unclear how officers would be prevented from lying about the reason for a search. Flock has contracts with more than 7,000 organizations and about 120,000 license plate readers, while opposition has led to canceled contracts in cities including Los Angeles, Cambridge, Massachusetts, and Eugene, Oregon.\u003c/p\u003e\n"},{"n":8,"title":"When read-only mounts in Docker Sandboxes become writable","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/read-only-mounts-docker-sandboxes-writable","time":"16:21","priority":"MAY READ","score":74,"tldr":"Docker Sandboxes versions 0.35.0 through 0.37.1 allowed read-only host mounts to be modified via a writable /mnt/host VirtioFS path, undermining sandbox file protections. Docker fixed the issue in version 0.38.0 and assigned it CVE-2026-18171.","briefOverview":"\u003cp\u003eDocker Sandboxes versions 0.35.0 through 0.37.1 had an oversight that allowed a directory mounted as read-only to be modified anyway. The issue was assigned CVE-2026-18171 with a CVSS score of 5.7, and Docker fixed it in version 0.38.0. The article explains that the impact depended on what the user mounted into the sandbox, such as source code, CI configuration, infrastructure code, application configuration, or build inputs.\u003c/p\u003e\n\n\u003cp\u003eThe technical issue involved VirtioFS sharing host files with the sandbox microVM. A host directory mounted at a read-only path such as /readonly was also accessible through Docker\u0026rsquo;s host export under /mnt/host, where it remained writable. The article shows a proof of concept where writing to /readonly/file.txt failed, but writing to the same host file through /mnt/host/c/donotchangeme/file.txt succeeded and changed the file on the host.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Docker Sandboxes versions 0.35.0 through 0.37.1 had an issue where a directory mounted as read-only could still be written through another path.","The issue occurred because the same host directory was available both at the intended read-only mount point and through Docker's writable host export under /mnt/host.","A proof of concept showed that writing to /readonly/file.txt failed with a read-only file system error, but writing to /mnt/host/c/donotchangeme/file.txt changed the host file successfully.","The potential impact depended on what was mounted into the sandbox, such as source code, CI configuration, infrastructure code, application configuration, or build inputs.","Docker fixed the issue in Docker Sandboxes 0.38.0 and assigned it CVE-2026-18171 with a CVSS score of 5.7."],"insights":["The bypass was easy to discover from inside the sandbox because running findmnt exposed that /readonly was mounted read-only while /mnt/host was mounted writable.","The real-world risk was delayed execution: a malicious change to a build script or configuration file might only run later when a developer builds the project on the host or when CI processes the changed file.","The article emphasizes that sandbox strength depends heavily on boundary controls, because the testing assumed an agent had already followed malicious instructions and focused on whether it could reach beyond granted access.","Although the article reports a vulnerability, it also notes that other tested escape ideas failed because Docker Sandboxes' microVM, isolated Docker Engine, network controls, and credential proxy worked as intended."],"referencedReports":[{"title":"CVE-2026-18171","url":"https://www.cve.org/CVERecord?id=CVE-2026-18171","publisher":"CVE","context":"The article cites the CVE record for the Docker Sandboxes read-only mount bypass that Docker fixed.","category":"advisory","primary":false},{"title":"Hugging Face Model Evaluation Security Incident","url":"https://openai.com/index/hugging-face-model-evaluation-security-incident/","publisher":"OpenAI","context":"The article references OpenAI's disclosure that models in a cyber evaluation found and exploited a zero-day in a package proxy around their test environment.","category":"advisory","primary":false},{"title":"Anthropic System Cards","url":"https://www.anthropic.com/system-cards","publisher":"Anthropic","context":"The article references Anthropic's documentation of an earlier Claude Mythos Preview version escaping a restricted test environment.","category":"research","primary":false}],"body":"\u003cp\u003eDocker Sandboxes versions 0.35.0 through 0.37.1 had an oversight that allowed a directory mounted as read-only to be modified anyway. The issue was assigned CVE-2026-18171 with a CVSS score of 5.7, and Docker fixed it in version 0.38.0. The article explains that the impact depended on what the user mounted into the sandbox, such as source code, CI configuration, infrastructure code, application configuration, or build inputs.\u003c/p\u003e\n\n\u003cp\u003eThe technical issue involved VirtioFS sharing host files with the sandbox microVM. A host directory mounted at a read-only path such as /readonly was also accessible through Docker\u0026rsquo;s host export under /mnt/host, where it remained writable. The article shows a proof of concept where writing to /readonly/file.txt failed, but writing to the same host file through /mnt/host/c/donotchangeme/file.txt succeeded and changed the file on the host.\u003c/p\u003e\n"},{"n":9,"title":"Attack of The Extensions","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/08/13/chromium-extension-c2-persistence/","time":"16:00","priority":"MAY READ","score":72,"tldr":"The article shows how Chromium profile modification can silently sideload browser extensions, Isolated Web Apps, and Native Messaging Hosts to turn Chrome or Edge into a persistent C2 foothold for cookie theft, OS interaction, and SOCKS-style pivoting. The key defensive takeaway is to monitor unusual browser profile and native messaging changes and enforce policies that disable extension developer mode.","briefOverview":"\u003cp\u003eThe article describes a proof-of-concept technique for turning Chromium-based browsers such as Chrome and Edge into a persistent command-and-control platform. It introduces SilentChrome-BOF, a Beacon object file that modifies Chromium profile settings to install unpacked extensions, Isolated Web Applications, and Native Messaging Hosts. The demonstration centers on Ditto, a Mythic agent that runs primarily as a Chromium extension.\u003c/p\u003e\n\n\u003cp\u003eThe technique matters because Chromium’s Application Bound Encryption made direct cookie theft from disk harder, but the authenticated browser remains valuable. Ditto can collect cookies, enumerate tabs, capture pages, query browser history, and communicate over HTTP(S) from inside the browser extension runtime. With optional sidecar components, it can also use a Native Messaging Host for Windows operating system interaction and an Isolated Web Application for SOCKS-style networking through Direct Sockets.\u003c/p\u003e\n\n\u003cp\u003eSilentChrome-BOF installs extensions by editing the Secure Preferences file, adding extension state, enabling developer mode, recalculating protected preference MACs, removing encrypted hash entries, and recalculating the super_mac. The article also explains how reusing public key material from an existing extension can produce the same extension ID and may bypass allowlists that trust extension IDs alone. For detection and prevention, the article recommends monitoring Chromium Preferences and Secure Preferences changes, Native Messaging Host registry modifications, IWA-related process arguments, native messaging process creation, and enforcing the ExtensionDeveloperModeSettings policy to disallow developer mode.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article introduces SilentChrome-BOF, a Beacon object file that modifies Chromium browser profile settings to install unpacked extensions, Isolated Web Applications, and Native Messaging Hosts.","The proof-of-concept Mythic agent Ditto runs as a Chromium extension and can collect cookies, enumerate tabs, capture pages, query browser history, and communicate with optional sidecar components.","SilentChrome-BOF installs an unpacked extension by editing the Secure Preferences file, adding extension state, enabling developer mode, recalculating legacy preference MACs, removing encrypted hash entries, and recalculating the super_mac.","Ditto can use an Isolated Web Application with Direct Sockets for SOCKS-style pivoting and a Native Messaging Host to interact with the Windows operating system through a local executable.","The article recommends detecting this technique by monitoring changes to Chromium Preferences and Secure Preferences files, Native Messaging Host registry keys, IWA-related Chrome process arguments, and native messaging process creation events."],"insights":["Removing only the injected extension from Chromium’s settings_encrypted_hash was insufficient; SilentChrome-BOF had to remove the entire settings_encrypted_hash dictionary so Chromium would fall back to legacy MAC validation and regenerate the encrypted hashes itself.","Reusing the public key material from an allowed Chrome Web Store extension can give a sideloaded extension the same extension ID, which may bypass enterprise policies that trust extension IDs alone.","Disabling extension developer mode with the mandatory ExtensionDeveloperModeSettings policy prevented the unpacked Ditto extension from starting because Chromium returned DISABLE_UNSUPPORTED_DEVELOPER_EXTENSION.","Native Messaging Host activity can expose the connecting extension ID in process creation command lines through the chrome-extension://\u003cextension-id\u003e argument, giving defenders a concrete way to baseline and investigate unexpected extension-to-host communication.","Launching Ditto’s Isolated Web Application through the extension produced Chrome process arguments such as --enable-isolated-web-apps-in-renderer or --enable-features=IsolatedWebApps, while the hidden-desktop launch path could be detected by monitoring for the --app-id argument."],"referencedReports":[{"title":"Silently Install macOS Chrome Extensions Part 2","url":"https://medium.com/@marcusthebrody/silently-install-macos-chrome-extensions-part-2-c9deab4216cd","publisher":"asaurusrex","context":"The article says this blog on silently installing Chromium extensions by modifying the Secure Preferences file inspired the technique discussed.","category":"research","primary":true},{"title":"ChromeAlone","url":"https://github.com/praetorian-inc/ChromeAlone","publisher":"Michael Weber / Praetorian","context":"The article cites Michael Weber’s DEFCON33 talk ChromeAlone as highlighting how Chromium browsers can be leveraged as a command-and-control platform through the extension ecosystem.","category":"research","primary":true}],"body":"\u003cp\u003eThe article describes a proof-of-concept technique for turning Chromium-based browsers such as Chrome and Edge into a persistent command-and-control platform. It introduces SilentChrome-BOF, a Beacon object file that modifies Chromium profile settings to install unpacked extensions, Isolated Web Applications, and Native Messaging Hosts. The demonstration centers on Ditto, a Mythic agent that runs primarily as a Chromium extension.\u003c/p\u003e\n\n\u003cp\u003eThe technique matters because Chromium’s Application Bound Encryption made direct cookie theft from disk harder, but the authenticated browser remains valuable. Ditto can collect cookies, enumerate tabs, capture pages, query browser history, and communicate over HTTP(S) from inside the browser extension runtime. With optional sidecar components, it can also use a Native Messaging Host for Windows operating system interaction and an Isolated Web Application for SOCKS-style networking through Direct Sockets.\u003c/p\u003e\n\n\u003cp\u003eSilentChrome-BOF installs extensions by editing the Secure Preferences file, adding extension state, enabling developer mode, recalculating protected preference MACs, removing encrypted hash entries, and recalculating the super_mac. The article also explains how reusing public key material from an existing extension can produce the same extension ID and may bypass allowlists that trust extension IDs alone. For detection and prevention, the article recommends monitoring Chromium Preferences and Secure Preferences changes, Native Messaging Host registry modifications, IWA-related process arguments, native messaging process creation, and enforcing the ExtensionDeveloperModeSettings policy to disallow developer mode.\u003c/p\u003e\n"},{"n":10,"title":"Return of the Cookie Monster","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/08/13/chrome-devtools-protocol-cookie-theft/","time":"16:00","priority":"MAY READ","score":72,"tldr":"The article shows that even with Chrome’s newer cookie protections, attackers can still enable the Chrome DevTools Protocol inside a running Chrome or Edge session to steal browser data or take over authenticated browsing. Defenders should monitor for signs of process injection into Chromium browsers, such as suspicious remote thread creation and process access events.","briefOverview":"\u003cp\u003eThe article examines how enabling the Chrome DevTools Protocol inside a running Chrome or Edge process can support post-exploitation activities such as browser enumeration, cookie theft, and browser takeover. It explains that Chrome 136 added protections so \u003ccode\u003e--remote-debugging-port\u003c/code\u003e or \u003ccode\u003e--remote-debugging-pipe\u003c/code\u003e is ignored for the default profile unless a non-standard \u003ccode\u003e--user-data-dir\u003c/code\u003e is supplied. That change makes launching a new browser with remote debugging less useful for accessing a user’s normal cookies, extensions, and browser state.\u003c/p\u003e\n\n\u003cp\u003eThe post focuses on \u003ccode\u003eCDP-Enable-BOF\u003c/code\u003e, which enables CDP from inside a live \u003ccode\u003echrome.exe\u003c/code\u003e or \u003ccode\u003emsedge.exe\u003c/code\u003e process instead of launching a browser with debugging flags. At a high level, the BOF finds the target browser process and window, locates the loaded browser module, resolves internal symbols, allocates a remote stub, installs a temporary remote window procedure, and calls Chromium’s internal \u003ccode\u003eStartRemoteDebuggingServer\u003c/code\u003e on the requested port. The technique depends on masked signatures for internal symbols such as \u003ccode\u003eStartRemoteDebuggingServer\u003c/code\u003e, \u003ccode\u003eoperator new\u003c/code\u003e, and \u003ccode\u003eTCPServerSocketFactory\u003c/code\u003e components, which may need to be refreshed when Chrome or Edge updates.\u003c/p\u003e\n\n\u003cp\u003eOnce CDP is enabled, \u003ccode\u003eCDP-Toolkit\u003c/code\u003e can connect to the endpoint directly or through a SOCKS proxy and perform actions such as listing tabs, dumping cookies, searching history, capturing screenshots, listing bookmarks, managing extensions, and navigating the browser. Some commands are direct CDP API wrappers, while others automate browser pages such as history, bookmarks, extensions, and password-management surfaces. For detection, the article highlights Sysmon Event IDs 8 and 10, especially CreateRemoteThread activity targeting \u003ccode\u003echrome.exe\u003c/code\u003e or \u003ccode\u003emsedge.exe\u003c/code\u003e combined with ProcessAccess showing a Granted Access value of \u003ccode\u003e0x143a\u003c/code\u003e, as possible signs of browser process injection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Chrome 136 changed remote debugging behavior so that --remote-debugging-port or --remote-debugging-pipe is ignored for the default profile unless paired with a non-standard --user-data-dir, which prevents immediate access to the user’s normal cookies, extensions, and browser state when launching a new browser with CDP enabled.","CDP-Enable-BOF enables the Chrome DevTools Protocol from inside a live chrome.exe or msedge.exe process by locating browser internals, installing a remote window procedure, and calling Chromium’s internal StartRemoteDebuggingServer on a requested port.","Once CDP is enabled in a running Chromium browser, CDP-Toolkit can enumerate tabs, dump cookies, search history, capture screenshots, list bookmarks and extensions, extract saved password information, and support browser takeover workflows.","The BOF depends on masked signatures for internal Chromium symbols such as StartRemoteDebuggingServer, operator new, TCPServerSocketFactory::CreateForHttpServer, and TCPServerSocketFactory, which may need to be updated when Chrome or Edge changes.","The article’s detection section highlights Sysmon Event IDs 8 and 10, especially CreateRemoteThread activity targeting chrome.exe or msedge.exe combined with ProcessAccess showing Granted Access 0x143a, as possible indicators of browser process injection."],"insights":["Chrome 136’s remote debugging restriction mainly disrupts launching a new browser with the user’s default profile, but it does not address enabling CDP from inside an already running Chrome or Edge process.","The article emphasizes that authenticated browser access can be more useful than stealing cookie files because CDP can let an operator act through the existing signed-in browser context and sidestep replay limitations from device-bound session cookies.","Some CDP-Toolkit capabilities do not simply call data-retrieval APIs; they automate real browser pages such as history, bookmarks, extensions, and password-management surfaces to extract information from rendered content.","Signature maintenance is an operational dependency for CDP-Enable-BOF because updates to chrome.dll or msedge.dll can change internal symbols and break the BOF unless matching DLL and PDB files are used to refresh patterns.","A practical detection approach in the article is not to look only for unusual browser launch arguments, but to monitor for process injection behavior against chrome.exe or msedge.exe, including Sysmon CreateRemoteThread and ProcessAccess events."],"referencedReports":[{"title":"Modern Session Hijacking by Living off the DevTools Protocol","url":"https://specterops.io/so-con/","publisher":"Cedric Van Bockhaven","context":"The article says Cedric Van Bockhaven’s SOCON 2026 talk inspired the author to recreate CDP-Enable-BOF and CDP Toolkit.","category":"research","primary":true},{"title":"CDP Enabler","url":"https://deathflamingo.com/blog/cdp_enabler/","publisher":"DeathFlamingo","context":"The article says CDP-Enable-BOF and CDP Toolkit were recreated based in part on DeathFlamingo’s blog.","category":"research","primary":true}],"body":"\u003cp\u003eThe article examines how enabling the Chrome DevTools Protocol inside a running Chrome or Edge process can support post-exploitation activities such as browser enumeration, cookie theft, and browser takeover. It explains that Chrome 136 added protections so \u003ccode\u003e--remote-debugging-port\u003c/code\u003e or \u003ccode\u003e--remote-debugging-pipe\u003c/code\u003e is ignored for the default profile unless a non-standard \u003ccode\u003e--user-data-dir\u003c/code\u003e is supplied. That change makes launching a new browser with remote debugging less useful for accessing a user’s normal cookies, extensions, and browser state.\u003c/p\u003e\n\n\u003cp\u003eThe post focuses on \u003ccode\u003eCDP-Enable-BOF\u003c/code\u003e, which enables CDP from inside a live \u003ccode\u003echrome.exe\u003c/code\u003e or \u003ccode\u003emsedge.exe\u003c/code\u003e process instead of launching a browser with debugging flags. At a high level, the BOF finds the target browser process and window, locates the loaded browser module, resolves internal symbols, allocates a remote stub, installs a temporary remote window procedure, and calls Chromium’s internal \u003ccode\u003eStartRemoteDebuggingServer\u003c/code\u003e on the requested port. The technique depends on masked signatures for internal symbols such as \u003ccode\u003eStartRemoteDebuggingServer\u003c/code\u003e, \u003ccode\u003eoperator new\u003c/code\u003e, and \u003ccode\u003eTCPServerSocketFactory\u003c/code\u003e components, which may need to be refreshed when Chrome or Edge updates.\u003c/p\u003e\n\n\u003cp\u003eOnce CDP is enabled, \u003ccode\u003eCDP-Toolkit\u003c/code\u003e can connect to the endpoint directly or through a SOCKS proxy and perform actions such as listing tabs, dumping cookies, searching history, capturing screenshots, listing bookmarks, managing extensions, and navigating the browser. Some commands are direct CDP API wrappers, while others automate browser pages such as history, bookmarks, extensions, and password-management surfaces. For detection, the article highlights Sysmon Event IDs 8 and 10, especially CreateRemoteThread activity targeting \u003ccode\u003echrome.exe\u003c/code\u003e or \u003ccode\u003emsedge.exe\u003c/code\u003e combined with ProcessAccess showing a Granted Access value of \u003ccode\u003e0x143a\u003c/code\u003e, as possible signs of browser process injection.\u003c/p\u003e\n"},{"n":1,"title":"AI 'watermark removers' flood the web. Almost none can prove they work.","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ai-watermark-removers-flood-the-web-almost-none-can-prove-they-work/","time":"17:33","priority":"MAY READ","score":70,"tldr":"A wave of tools claiming to remove Anthropic Claude’s new invisible AI text watermark has appeared, but almost none can prove they work because Anthropic has not released its detector or technical details. Most tools only strip metadata or hidden characters, while removing the real word-choice watermark likely requires heavy rewriting and creates a new supply-chain risk as users wire unvetted tools into AI workflows.","briefOverview":"\u003cp\u003eA market for AI watermark removal tools appeared within days of Anthropic saying that Claude now adds invisible marks to everything it writes. The article names GitHub projects, newly registered web tools, and commercial AI detection evasion services that claim to remove these marks. However, the claims about defeating Anthropic’s text watermark cannot currently be checked because Anthropic has not published how the watermark works or released a detector.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that some parts of these tools are verifiable, such as removing hidden characters from text or stripping C2PA, EXIF, and XMP metadata from files. It says the harder watermark does not live in hidden characters, but in the words the model chose, so the only known way to remove it is heavy rewriting with another model. Guillaume Meyer, creator of the watermarks-remover project, said his tool removes metadata only for now and does not yet strip the actual marks.\u003c/p\u003e\n\n\u003cp\u003eAnthropic says text from models launched on or after August 2, 2026 carries an imperceptible watermark, and supported file types also receive signed C2PA metadata. The article says this is tied to Article 50 of the EU AI Act, and Anthropic acknowledges that a detected mark means content was processed by Claude, not necessarily written by it. The article’s broader concern is that people may wire unvetted watermark-removal tools into agent workflows and feed documents through them, creating a supply chain surface in a market where buyers cannot verify many claims.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A market for AI watermark removal tools appeared shortly after Anthropic disclosed that Claude now adds invisible marks to everything it writes or processes.","Claims that tools can defeat Anthropic’s text watermark cannot currently be verified because Anthropic has not published how the watermark works or released a detector.","Some tools can remove hidden characters and file metadata, but the article says Claude’s watermark is embedded in the model’s word choices rather than in hidden characters.","Guillaume Meyer said his watermarks-remover tool currently removes metadata only and does not yet strip the actual text watermark.","The article warns that people wiring unvetted watermark-removal tools into agent workflows and feeding documents through them creates a supply chain risk."],"insights":["The most verifiable removals offered by these tools target fragile file metadata, but the article notes that this metadata often disappears anyway through ordinary actions like re-saving, converting formats, or taking a screenshot.","A detected Claude mark may not mean Claude originally wrote the text, because Anthropic says content can also be marked after grammar correction, translation, or summarization.","Some commercial services present scores from ordinary AI detectors as evidence, even though those scores do not test Anthropic’s unreleased watermark detector.","The article highlights a mismatch between demand and verification: one remover project has over 4,500 GitHub stars while buyers still have no public way to confirm whether watermark-removal claims are true.","Independent code review found that one popular text cleaner failed to remove a common hidden-payload technique, showing that even simpler cleaning claims may not hold up."],"referencedReports":[{"title":"A Watermark for Large Language Models","url":"https://arxiv.org/abs/2301.10226","publisher":"arxiv","context":"The article links this research when describing open-weight models that use Kirchenbauer-style text watermarks.","category":"research","primary":false},{"title":"Claude Watermark Remover GitHub Tested","url":"https://pasqualepillitteri.it/en/news/10649/claude-watermark-remover-github-tested","publisher":"pasquale-pillitteri","context":"The article cites Pillitteri’s independent code review and testing of watermark-removal projects, including a finding that one cleaner failed to remove a common hidden payload.","category":"research","primary":false}],"body":"\u003cp\u003eA market for AI watermark removal tools appeared within days of Anthropic saying that Claude now adds invisible marks to everything it writes. The article names GitHub projects, newly registered web tools, and commercial AI detection evasion services that claim to remove these marks. However, the claims about defeating Anthropic’s text watermark cannot currently be checked because Anthropic has not published how the watermark works or released a detector.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that some parts of these tools are verifiable, such as removing hidden characters from text or stripping C2PA, EXIF, and XMP metadata from files. It says the harder watermark does not live in hidden characters, but in the words the model chose, so the only known way to remove it is heavy rewriting with another model. Guillaume Meyer, creator of the watermarks-remover project, said his tool removes metadata only for now and does not yet strip the actual marks.\u003c/p\u003e\n\n\u003cp\u003eAnthropic says text from models launched on or after August 2, 2026 carries an imperceptible watermark, and supported file types also receive signed C2PA metadata. The article says this is tied to Article 50 of the EU AI Act, and Anthropic acknowledges that a detected mark means content was processed by Claude, not necessarily written by it. The article’s broader concern is that people may wire unvetted watermark-removal tools into agent workflows and feed documents through them, creating a supply chain surface in a market where buyers cannot verify many claims.\u003c/p\u003e\n"},{"n":3,"title":"Who Vets AI’s Code? The Scale Challenge Facing Open Source Ingestion","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/who-vets-ais-code-the-scale-challenge-facing-open-source-ingestion/","time":"14:00","priority":"MAY READ","score":45,"tldr":"AI coding assistants can introduce hallucinated or unvetted open source dependencies faster than traditional security reviews can catch them, creating slopsquatting and supply-chain risks. The article argues organizations should vet and control packages at the point of selection through curated ingestion gateways rather than relying only on post-commit scans.","briefOverview":"\u003cp\u003eThe article discusses the challenge of vetting code and dependencies suggested by AI coding assistants as developers adopt these tools at scale. It says AI assistants can auto-complete third-party dependency suggestions in milliseconds, while enterprise security teams and open source maintainers still rely heavily on slower review processes. The article argues that when unvetted or hallucinated dependencies enter a codebase quickly, post-commit Software Composition Analysis scans struggle to keep pace.\u003c/p\u003e\n\n\u003cp\u003eA central issue described is “slopsquatting,” where a language model suggests a package name that does not exist in registries such as PyPI or npm. Attackers can monitor hallucinated package names, register them, upload malicious payloads, and wait for developer environments or CI/CD builders to fetch them. The article cites a USENIX Security study of sixteen code-generation models and more than 500,000 code samples, as well as an example in which a hallucinated npm package name, react-codeshift, spread through forks to more than 230 repositories.\u003c/p\u003e\n\n\u003cp\u003eThe article also says AI-generated or AI-assisted contributions are increasing pressure on open source maintainers, with major projects such as Kubernetes, the Linux kernel, LLVM, and Godot adopting differing policies on AI-assisted code. It contrasts high enterprise use of AI coding assistants with much lower use of dedicated AI AppSec controls, describing a governance gap between software generation and verification. The article recommends controlling package intake before builds by restricting direct registry access, isolating AI-suggested dependencies for analysis, and using a governed ingestion gateway such as ActiveState’s Secure Open Source Library and Curated Catalog.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI coding assistants can suggest third-party dependencies faster than traditional post-commit Software Composition Analysis scans can review them.","The article describes slopsquatting as a supply-chain risk where an AI model suggests a nonexistent package name, an attacker registers that name on PyPI or npm with a malicious payload, and developer or CI/CD systems later fetch it.","The article cites a USENIX Security study of sixteen code-generation models across more than 500,000 code samples that found some AI-suggested package names did not exist in public registries and nearly half of resolving dependencies had known CVEs or outdated releases.","The article says automated AI-generated pull requests are increasing review pressure on open source maintainers, while projects such as Kubernetes, the Linux kernel, LLVM, and Godot have published differing policies on AI-assisted contributions.","The article recommends blocking direct public registry fetching, isolating AI-suggested dependencies for analysis, and using a governed ingestion gateway so packages are vetted before they reach builds."],"insights":["The article frames the main risk as an ingestion-control failure rather than a developer intent problem, emphasizing that unsafe dependencies can enter codebases even when no human deliberately selected them.","The react-codeshift example shows that a single hallucinated package name can spread through forks into hundreds of repositories before anyone notices it was never intentionally chosen.","The article suggests that improving model accuracy alone is not enough because the core security issue is the speed at which AI-generated dependencies move through developer workflows.","The article highlights a governance mismatch: 85% of organizations use AI coding assistants, but only 9% have dedicated AI AppSec controls, leaving many teams dependent on late-stage review processes.","The article presents restricting direct access to public package registries from developer workstations and AI agents as a concrete way to stop hallucinated dependencies before they reach builds."],"referencedReports":[],"body":"\u003cp\u003eThe article discusses the challenge of vetting code and dependencies suggested by AI coding assistants as developers adopt these tools at scale. It says AI assistants can auto-complete third-party dependency suggestions in milliseconds, while enterprise security teams and open source maintainers still rely heavily on slower review processes. The article argues that when unvetted or hallucinated dependencies enter a codebase quickly, post-commit Software Composition Analysis scans struggle to keep pace.\u003c/p\u003e\n\n\u003cp\u003eA central issue described is “slopsquatting,” where a language model suggests a package name that does not exist in registries such as PyPI or npm. Attackers can monitor hallucinated package names, register them, upload malicious payloads, and wait for developer environments or CI/CD builders to fetch them. The article cites a USENIX Security study of sixteen code-generation models and more than 500,000 code samples, as well as an example in which a hallucinated npm package name, react-codeshift, spread through forks to more than 230 repositories.\u003c/p\u003e\n\n\u003cp\u003eThe article also says AI-generated or AI-assisted contributions are increasing pressure on open source maintainers, with major projects such as Kubernetes, the Linux kernel, LLVM, and Godot adopting differing policies on AI-assisted code. It contrasts high enterprise use of AI coding assistants with much lower use of dedicated AI AppSec controls, describing a governance gap between software generation and verification. The article recommends controlling package intake before builds by restricting direct registry access, isolating AI-suggested dependencies for analysis, and using a governed ingestion gateway such as ActiveState’s Secure Open Source Library and Curated Catalog.\u003c/p\u003e\n"}]</script>
