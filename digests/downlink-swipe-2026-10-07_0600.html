<script type="application/json" id="dl-articles">[{"n":1,"title":"100+ Compromised Websites Use Fake Cloudflare Checks to Deliver LunexStealer","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/100-compromised-websites-use-fake.html","time":"06:57","priority":"SHOULD READ","score":86,"tldr":"CERT-UA reports that more than 100 compromised websites are using fake Cloudflare verification pages and ClickFix prompts to trick Windows users into installing LunexStealer. The campaign, attributed to UAC-0277, uses blockchain-hosted configuration and can deploy a malicious browser extension capable of stealing credentials, browser data, and files.","briefOverview":"\u003cp\u003eCERT-UA identified more than 100 compromised websites injected with malicious JavaScript that delivers LunexStealer, also known as Psychedelic Stealer. The activity, observed in September 2026 and attributed to UAC-0277, presents visitors with a forged Cloudflare verification page. The page prompts users to run a command that downloads and installs a malicious MSI package through the ClickFix technique.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses EtherHiding to obtain the fake-page domain and operating mode from Polygon or Ethereum smart contracts. The fake prompt is shown only to Windows users who arrive through search results and no more than twice in 12 hours. Different installer variants can install LunexStealer directly, add Microsoft Defender exclusions and use a vulnerable AMD driver to disable security software, or use DLL sideloading; the malware can also install the LUNARAXE browser extension to steal browser data and credentials and remotely control browser activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-UA identified more than 100 compromised websites injected with malicious JavaScript that serves LunexStealer, and attributed the activity observed in September 2026 to UAC-0277.","Visitors to affected websites may see a forged Cloudflare verification page that prompts them to run a command, causing a malicious MSI installer to download and install through the ClickFix technique.","The campaign uses EtherHiding to retrieve the fake-verification resource domain and operating mode from smart contracts on the Polygon or Ethereum network.","LunexStealer can install the LUNARAXE browser extension, which masquerades as Microsoft Office Word Editor and can steal cookies, browsing history, and credentials entered into web forms.","CERT-UA recommends restricting access to the Windows Run dialog and user MSI installation, monitoring msiexec.exe, enabling Microsoft’s vulnerable driver blocklist, and allowlisting browser extensions."],"insights":["The fake verification page is selectively shown only to Windows users arriving from search results and no more than twice in 12 hours, which limits its visibility compared with showing the lure to every visitor.","The campaign’s behavior can be remotely changed between inactive, visitor-tracking, and fake-verification modes through data retrieved from Polygon or Ethereum smart contracts.","One installer variant uses a legitimate but vulnerable AMD driver to disable security software after adding Microsoft Defender exclusions, while another uses DLL sideloading to launch the stealer.","The LUNARAXE extension can remove website security-policy headers, allowing it to run arbitrary JavaScript on pages, in addition to collecting browser data and entered credentials.","CERT-UA’s recommended controls directly target the delivery chain: restrict the Windows Run dialog and non-administrator MSI installation, monitor msiexec.exe, block vulnerable drivers, and allow only approved browser extensions."],"referencedReports":[{"title":"CERT-UA advisory on UAC-0277’s LunexStealer campaign","url":"https://cert.gov.ua/article/6319983","publisher":"cert-ua","context":"CERT-UA’s advisory describes compromised websites using forged Cloudflare verification pages and ClickFix prompts to deliver LunexStealer.","category":"advisory","primary":true}],"body":"\u003cp\u003eCERT-UA identified more than 100 compromised websites injected with malicious JavaScript that delivers LunexStealer, also known as Psychedelic Stealer. The activity, observed in September 2026 and attributed to UAC-0277, presents visitors with a forged Cloudflare verification page. The page prompts users to run a command that downloads and installs a malicious MSI package through the ClickFix technique.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses EtherHiding to obtain the fake-page domain and operating mode from Polygon or Ethereum smart contracts. The fake prompt is shown only to Windows users who arrive through search results and no more than twice in 12 hours. Different installer variants can install LunexStealer directly, add Microsoft Defender exclusions and use a vulnerable AMD driver to disable security software, or use DLL sideloading; the malware can also install the LUNARAXE browser extension to steal browser data and credentials and remotely control browser activity.\u003c/p\u003e\n"},{"n":2,"title":"Anthropic Expands Claude Access for Vetted Cyber Teams as Glasswing Finds 129,000 Flaws","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/anthropic-expands-claude-access-for.html","time":"08:07","priority":"SHOULD READ","score":78,"tldr":"Anthropic expanded vetted cyber teams’ access to Claude models with tiered safeguards, citing Project Glasswing’s discovery of 129,000 verified software flaws. The company says the program supports defenders, though only two of 300 tracked Anthropic-found CVEs have reportedly seen exploitation in the wild.","briefOverview":"\u003cp\u003eAnthropic expanded its Cyber Verification Program (CVP), allowing vetted cybersecurity organizations to access Claude models with reduced safeguards for approved security work. The program has three tiers: Defense Access for tasks such as incident response and software-flaw validation, Red Team Access for authorized penetration testing, and Specialized Access for a limited group authorized to test safety systems. Participants can access Claude Opus 5.5, Claude Sonnet 5.5, Claude Mythos 5.1, and future models.\u003c/p\u003e\n\n\u003cp\u003eAnthropic said Project Glasswing found at least 129,000 verified software vulnerabilities between April and July 2026, while open-source scanning found another 5,500 between April and October. More than 33,000 of the verified flaws were rated critical or high severity, although Anthropic said this figure is likely an undercount based on survey data from only some Glasswing partners. In CyScenarioBench testing, Defense Access blocked 46 of 50 tasks on Claude Opus 5.5, whereas Red Team Access blocked none and completed 34 of 50 tasks, matching the result without safeguards.\u003c/p\u003e\n\n\u003cp\u003eVulnCheck researcher Patrick Garrity found that only 2 of 300 vulnerabilities credited to Anthropic or Project Glasswing had been exploited in the wild: CVE-2026-26980 in Ghost CMS and CVE-2026-61500 in Rejetto HTTP File Server. The article notes that AI may make it easier to find software flaws, but not every discovered flaw is practically exploitable or causes significant harm. It also cites 1Password and Veracode findings that AI-generated fixes can introduce security risks, with Veracode reporting risky flaws in roughly 44% of AI code-generation tasks tested.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic expanded its Cyber Verification Program, which gives vetted cybersecurity organizations tiered access to Claude models with reduced safeguards for approved work.","Anthropic said Project Glasswing identified at least 129,000 verified software vulnerabilities from April through July 2026, including more than 33,000 rated critical or high severity.","The program offers Defense Access for activities such as incident response and vulnerability validation, Red Team Access for authorized penetration testing, and Specialized Access for a limited set of organizations testing safety systems.","In a CyScenarioBench evaluation, Claude Opus 5.5 under Defense Access blocked 46 of 50 tasks, while Red Team Access blocked none and completed 34 of 50 tasks.","VulnCheck reported that only two of 300 vulnerabilities credited to Anthropic or Project Glasswing had been exploited in the wild: CVE-2026-26980 in Ghost CMS and CVE-2026-61500 in Rejetto HTTP File Server."],"insights":["Access controls materially changed Claude Opus 5.5’s behavior in testing: Defense Access blocked 46 of 50 tasks, while Red Team Access blocked none and matched the completion rate seen without safeguards.","The reported volume of AI-assisted findings did not translate directly into known real-world abuse: VulnCheck found active exploitation for only 2 of 300 vulnerabilities credited to Anthropic or Project Glasswing.","Anthropic’s estimate may be incomplete because its 33,000 critical- or high-severity figure comes from survey data from only a subset of Glasswing partners.","AI can create security issues while helping find them, as Veracode reported that roughly 44% of AI code-generation tasks introduced a risky security flaw in its tests."],"referencedReports":[{"title":"Anthropic-Credited-CVEs","url":"https://github.com/patrickmgarrity/Anthropic-Credited-CVEs","publisher":"patrick-garrity / VulnCheck","context":"The article cites VulnCheck researcher Patrick Garrity's analysis of 300 vulnerabilities credited to Anthropic or Project Glasswing and their observed exploitation status.","category":"research","primary":false},{"title":"2026 GenAI Code Security Report: AI Risk","url":"https://www.veracode.com/blog/2026-genai-code-security-report-ai-risk/","publisher":"Veracode","context":"The article cites Veracode's findings that roughly 44% of AI code-generation tasks introduced a risky security vulnerability in tests.","category":"research","primary":false}],"body":"\u003cp\u003eAnthropic expanded its Cyber Verification Program (CVP), allowing vetted cybersecurity organizations to access Claude models with reduced safeguards for approved security work. The program has three tiers: Defense Access for tasks such as incident response and software-flaw validation, Red Team Access for authorized penetration testing, and Specialized Access for a limited group authorized to test safety systems. Participants can access Claude Opus 5.5, Claude Sonnet 5.5, Claude Mythos 5.1, and future models.\u003c/p\u003e\n\n\u003cp\u003eAnthropic said Project Glasswing found at least 129,000 verified software vulnerabilities between April and July 2026, while open-source scanning found another 5,500 between April and October. More than 33,000 of the verified flaws were rated critical or high severity, although Anthropic said this figure is likely an undercount based on survey data from only some Glasswing partners. In CyScenarioBench testing, Defense Access blocked 46 of 50 tasks on Claude Opus 5.5, whereas Red Team Access blocked none and completed 34 of 50 tasks, matching the result without safeguards.\u003c/p\u003e\n\n\u003cp\u003eVulnCheck researcher Patrick Garrity found that only 2 of 300 vulnerabilities credited to Anthropic or Project Glasswing had been exploited in the wild: CVE-2026-26980 in Ghost CMS and CVE-2026-61500 in Rejetto HTTP File Server. The article notes that AI may make it easier to find software flaws, but not every discovered flaw is practically exploitable or causes significant harm. It also cites 1Password and Veracode findings that AI-generated fixes can introduce security risks, with Veracode reporting risky flaws in roughly 44% of AI code-generation tasks tested.\u003c/p\u003e\n"},{"n":3,"title":"UK Cybercrime Journal: Police Cryptocurrency Crime Operations in 2026","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/10/uk-cybercrime-journal-police.html","time":"09:00","priority":"MAY READ","score":40,"tldr":"UK law enforcement actions in 2026 show cryptocurrency crime increasingly combines police-impersonation and seed-phrase scams with physical coercion, while unregistered P2P exchanges enable laundering. Crypto holders should protect recovery phrases, independently verify urgent calls, limit public exposure of holdings, and use multisig or time-locked custody to reduce forced-transfer risk.","briefOverview":"\u003cp\u003eUK enforcement actions in 2026 addressed cryptocurrency crime ranging from a violent London home invasion to phone-based fraud and unregistered peer-to-peer trading operations. In one case, three Sheffield teenagers posing as Amazon delivery drivers forced a victim to transfer £3.1 million in cryptocurrency; police detained them within hours and the assets were recovered within 72 hours. Separate multi-force operations arrested alleged fraudsters who posed as police officers or cryptocurrency-platform representatives to obtain wallet recovery phrases, while another group was jailed after stealing more than £4 million from eight victims.\u003c/p\u003e\n\n\u003cp\u003eThe cases show how criminals combine social engineering with physical coercion, using trusted police branding to make victims reveal recovery phrases or move money to supposed safe accounts. The FCA, HMRC, and Metropolitan Police also targeted three London premises alleged to be operating unregistered peer-to-peer cryptocurrency exchanges outside required anti-money-laundering and counter-terrorist-financing controls. The article advises holders to avoid public disclosure of holdings and locations, never share recovery phrases, verify unexpected calls through official numbers, and consider multi-signature wallets or time-locked storage to limit forced transfers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three Sheffield teenagers posing as Amazon delivery drivers used violence during a London home invasion and forced a victim to transfer £3.1 million in cryptocurrency.","A multi-force UK operation arrested and charged ten suspects accused of calling victims while posing as police officers or cryptocurrency-platform representatives to obtain wallet recovery phrases.","Three men were jailed for defrauding eight victims of more than £4 million in cryptocurrency by impersonating police and directing funds to purported secure police accounts.","The FCA, HMRC, and Metropolitan Police targeted three London premises alleged to be operating unregistered peer-to-peer cryptocurrency exchanges outside anti-money-laundering and counter-terrorist-financing requirements.","The article advises cryptocurrency holders never to disclose recovery phrases, independently verify unexpected police or exchange calls, and consider multi-signature and time-locked storage."],"insights":["Police impersonation can defeat ordinary account protections because victims may be pressured into voluntarily revealing wallet recovery phrases or approving transfers.","Public social-media posts about wealth, holdings, or location can make cryptocurrency owners easier to identify and target for in-person robbery.","Multi-signature wallets and time-locked storage can reduce the immediate ability of criminals to force a cryptocurrency transfer during a physical home invasion.","Unregistered peer-to-peer cryptocurrency businesses can provide a route for illicit digital funds to be converted into cash or apparently legitimate bank transfers.","The Sheffield suspects' Snapchat posts illustrate that criminals’ public online activity can create an investigative opportunity for law enforcement."],"referencedReports":[{"title":"Violent Crypto Wrench Attacks 2026","url":"https://www.chainalysis.com/blog/violent-crypto-wrench-attacks-2026/","publisher":"chainalysis","context":"Listed as a relevant CTI source concerning violent physical attacks targeting cryptocurrency holders.","category":"research","primary":false},{"title":"Operation Asterix: Crypto Fraud Vishing and Phishing","url":"https://www.rapid7.com/blog/post/tr-operation-asterix-crypto-fraud-vishing-phishing/","publisher":"rapid7","context":"Listed as a relevant CTI source on cryptocurrency fraud conducted through voice phishing and phishing.","category":"research","primary":false},{"title":"Scam Alert: Police and Digital Currency Exchange Impersonation Scam","url":"https://www.scamwatch.gov.au/about-us/news-and-alerts/scam-alert-police-and-digital-currency-exchange-impersonation-scam","publisher":"scamwatch","context":"Listed as a relevant CTI source on scams impersonating police and digital-currency exchanges.","category":"advisory","primary":false}],"body":"\u003cp\u003eUK enforcement actions in 2026 addressed cryptocurrency crime ranging from a violent London home invasion to phone-based fraud and unregistered peer-to-peer trading operations. In one case, three Sheffield teenagers posing as Amazon delivery drivers forced a victim to transfer £3.1 million in cryptocurrency; police detained them within hours and the assets were recovered within 72 hours. Separate multi-force operations arrested alleged fraudsters who posed as police officers or cryptocurrency-platform representatives to obtain wallet recovery phrases, while another group was jailed after stealing more than £4 million from eight victims.\u003c/p\u003e\n\n\u003cp\u003eThe cases show how criminals combine social engineering with physical coercion, using trusted police branding to make victims reveal recovery phrases or move money to supposed safe accounts. The FCA, HMRC, and Metropolitan Police also targeted three London premises alleged to be operating unregistered peer-to-peer cryptocurrency exchanges outside required anti-money-laundering and counter-terrorist-financing controls. The article advises holders to avoid public disclosure of holdings and locations, never share recovery phrases, verify unexpected calls through official numbers, and consider multi-signature wallets or time-locked storage to limit forced transfers.\u003c/p\u003e\n"}]</script>
