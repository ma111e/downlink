<script type="application/json" id="dl-articles">[{"n":1,"title":"PostGREShell: The database powering much of the internet had an open door for 12 years","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/postgreshell-the-database-powering-much-of-the-internet-had-an-open-door-for-12-years","time":"22:28","priority":"MUST READ","score":96,"tldr":"Cyera researchers found a critical PostgreSQL flaw, CVE-2026-6471, that lets low-privilege replication accounts load arbitrary plugins and gain remote code execution, superuser access, and persistence. Organizations should patch immediately, audit replication accounts, and restrict replication access and outbound SMB/NFS traffic.","briefOverview":"\u003cp\u003eCyera Research discovered a critical PostgreSQL vulnerability, CVE-2026-6471, which the article calls PostGREShell. The flaw affects every PostgreSQL version since 9.4 and was present from 2014 until the recent security update. The article says a low-privilege account with the REPLICATION attribute can load and execute arbitrary code on the database server.\u003c/p\u003e\n\n\u003cp\u003eThe issue is in PostgreSQL’s logical replication output plugin loading path. The article says plugin names supplied through CREATE_REPLICATION_SLOT are passed directly to the loader without the validation used by the SQL LOAD command, allowing paths such as traversal strings and Windows UNC paths. On Windows, PostgreSQL can load a DLL from an attacker-controlled SMB share, while Linux and macOS scenarios depend on NFS automounting or an attacker already being able to write a file to disk.\u003c/p\u003e\n\n\u003cp\u003eAfter code execution, the attacker can escalate to PostgreSQL superuser by using internal functions and directly modifying pg_authid, bypassing normal SQL permission checks. The article says the attacker can then read database contents, run operating system commands, access files, write files where the postgres user can, and install persistence through pg_hba.conf changes, shared_preload_libraries, and repeated privilege changes. It recommends applying the PostgreSQL security update, auditing REPLICATION accounts, restricting replication access in pg_hba.conf, blocking outbound SMB and NFS, and monitoring suspicious replication activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research discovered CVE-2026-6471, a critical PostgreSQL vulnerability affecting every PostgreSQL version from 9.4 through 18.","The flaw lets an account with the REPLICATION attribute load and execute arbitrary code through the logical replication output plugin path because the plugin name is passed to the loader without validation.","On Windows, an attacker can exploit the issue remotely by using a UNC path over SMB so PostgreSQL loads a DLL from the attacker’s server without placing a file on the target system.","After code execution, the attacker can escalate to PostgreSQL superuser by calling internal functions and directly modifying pg_authid, bypassing normal SQL permission checks.","The article recommends applying the PostgreSQL security update, auditing REPLICATION accounts, restricting replication access in pg_hba.conf, and blocking outbound SMB and NFS from database servers."],"insights":["The vulnerable code path existed because PostgreSQL applied library-name restrictions to the SQL LOAD command but not to the replication path, even though both ultimately load executable plugins into the server process.","The article says the core fix is only two lines of C, making the long exposure since 2014 notable because the missing security check was small but in a widely used path.","The practical risk differs by platform: Windows can be exploited with only network access through an SMB-hosted DLL, while many Linux, macOS, Docker, and Kubernetes cases require the attacker to already have a way to place a local shared library.","The article highlights replication accounts as an overlooked security risk because they are common in backup, standby, CDC, and monitoring setups but can become a path to full database and server compromise.","The persistence mechanisms described are layered so that fixing only one change, such as reverting superuser privileges or cleaning pg_hba.conf, may still leave another backdoor in place."],"referencedReports":[{"title":"CVE-2026-6471","url":"https://www.postgresql.org/support/security/CVE-2026-6471/","publisher":"PostgreSQL","context":"The article links to PostgreSQL’s advisory for the reported vulnerability and notes that CVE-2026-6471 was assigned and published through PostgreSQL’s security release process.","category":"advisory","primary":false}],"body":"\u003cp\u003eCyera Research discovered a critical PostgreSQL vulnerability, CVE-2026-6471, which the article calls PostGREShell. The flaw affects every PostgreSQL version since 9.4 and was present from 2014 until the recent security update. The article says a low-privilege account with the REPLICATION attribute can load and execute arbitrary code on the database server.\u003c/p\u003e\n\n\u003cp\u003eThe issue is in PostgreSQL’s logical replication output plugin loading path. The article says plugin names supplied through CREATE_REPLICATION_SLOT are passed directly to the loader without the validation used by the SQL LOAD command, allowing paths such as traversal strings and Windows UNC paths. On Windows, PostgreSQL can load a DLL from an attacker-controlled SMB share, while Linux and macOS scenarios depend on NFS automounting or an attacker already being able to write a file to disk.\u003c/p\u003e\n\n\u003cp\u003eAfter code execution, the attacker can escalate to PostgreSQL superuser by using internal functions and directly modifying pg_authid, bypassing normal SQL permission checks. The article says the attacker can then read database contents, run operating system commands, access files, write files where the postgres user can, and install persistence through pg_hba.conf changes, shared_preload_libraries, and repeated privilege changes. It recommends applying the PostgreSQL security update, auditing REPLICATION accounts, restricting replication access in pg_hba.conf, blocking outbound SMB and NFS, and monitoring suspicious replication activity.\u003c/p\u003e\n"}]</script>
