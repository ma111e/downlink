<script type="application/json" id="dl-articles">[{"n":3,"title":"Millions of security cameras at risk: DoS vulnerability in Intelbras devices","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/intelbras-camera-vulnerability/121131/","time":"10:00","priority":"MAY READ","score":68,"tldr":"Intelbras patched an unauthenticated firmware-update endpoint in several Mibo IP camera models that let anyone on the local network repeatedly force cameras offline. Users should update to firmware R.260804 to mitigate the denial-of-service flaw.","briefOverview":"\u003cp\u003eResearchers identified a denial-of-service flaw in Intelbras IP cameras that allowed an unauthenticated person on the local Wi-Fi network to force a camera offline. The issue was in the \u003ccode\u003e/firmwareUpgrade_service/Demo\u003c/code\u003e firmware-update endpoint, which accepted requests without checking authentication. A single request disrupted a camera for about a minute, while repeated requests could keep it unavailable indefinitely.\u003c/p\u003e\n\n\u003cp\u003eThe affected firmware initiated a reboot process before verifying that the uploaded firmware was valid, so even an invalid firmware file could cause disruption. The research used an iM3B-C camera running firmware v240927, and Intelbras said the same firmware was compatible with iMX C, iM4 C, iM5 SC, iME 360 C, and iM7+ FC models. Intelbras released firmware R.260804, which requires authentication checks for the endpoint, and users are advised to update because the flaw can prevent access to live monitoring and camera management.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers identified an unauthenticated firmware-update endpoint in Intelbras IP camera firmware that could be used by someone on the local Wi-Fi network to force a camera offline.","The issue affected firmware v240927 on the Intelbras iM3B-C and, according to Intelbras, the same firmware was compatible with the iMX C, iM4 C, iM5 SC, iME 360 C, and iM7+ FC models.","Sending a firmware upload request triggered the camera reboot process even when the supplied firmware was not valid, and periodic requests could keep the device offline indefinitely.","Intelbras released firmware R.260804, which adds checks for authentication session and cookie data before allowing firmware updates through the affected endpoint.","MITRE assigned the issue candidate ID CAN-2026-2035970 and classified it as medium severity with a CVSS 4.0 score of 5.1, pending final CVE assignment."],"insights":["The camera’s normal management functions required an authenticated session, but the firmware-update route bypassed those checks entirely in the affected firmware.","The endpoint initiated a reboot before confirming that the uploaded firmware was legitimate, so even an invalid file could disrupt the camera.","Although one request took a camera offline for only about a minute, repeated requests could maintain the outage indefinitely.","Because the same affected firmware was compatible with multiple Intelbras camera models, a single firmware-level flaw extended beyond the iM3B-C model used in the demonstration."],"referencedReports":[{"title":"Atualização firmware Câmeras im C cartão SD","url":"https://backend.intelbras.com/sites/default/files/2026-10/Atualizacao_firmware_Cameras_im_C_cartao_sd.pdf","publisher":"intelbras","context":"The article links to Intelbras instructions for installing the patched camera firmware.","category":"guide","primary":false}],"body":"\u003cp\u003eResearchers identified a denial-of-service flaw in Intelbras IP cameras that allowed an unauthenticated person on the local Wi-Fi network to force a camera offline. The issue was in the \u003ccode\u003e/firmwareUpgrade_service/Demo\u003c/code\u003e firmware-update endpoint, which accepted requests without checking authentication. A single request disrupted a camera for about a minute, while repeated requests could keep it unavailable indefinitely.\u003c/p\u003e\n\n\u003cp\u003eThe affected firmware initiated a reboot process before verifying that the uploaded firmware was valid, so even an invalid firmware file could cause disruption. The research used an iM3B-C camera running firmware v240927, and Intelbras said the same firmware was compatible with iMX C, iM4 C, iM5 SC, iME 360 C, and iM7+ FC models. Intelbras released firmware R.260804, which requires authentication checks for the endpoint, and users are advised to update because the flaw can prevent access to live monitoring and camera management.\u003c/p\u003e\n"},{"n":1,"title":"Aikido launches external network pentesting","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/aikido-launches-external-network-pentesting","time":"10:00","priority":"MAY READ","score":45,"tldr":"Aikido has launched an AI-powered external network pentesting service that continuously discovers and tests internet-facing assets under a customer’s domain. The service aims to identify and validate exploitable weaknesses safely, providing evidence-backed findings and retesting as the external perimeter changes.","briefOverview":"\u003cp\u003eAikido has launched external network pentesting, an AI-agent service that starts with a customer’s domain and maps publicly reachable systems such as websites, APIs, VPN gateways, mail servers, and self-hosted tools. After ownership verification, agents test each host for known CVEs, misconfigurations, and exposed secrets. Aikido says findings are included only when agents provide concrete evidence that is validated and reproduced by other agents.\u003c/p\u003e\n\n\u003cp\u003eThe launch is presented as a response to attackers using automated tooling to rapidly discover and exploit newly disclosed flaws. Aikido cites Cloudflare observations of escalating PHP2Shell exploit attempts and a16z figures showing that 86.7% of vulnerabilities exploited so far in 2026 were attacked on or before the day they became public. The service can run continuously to test newly discovered public-facing hosts, provides remediation suggestions and retests, and includes safeguards intended to avoid disruption, prevent testing systems the customer does not own, and stop agents immediately through a panic button.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido launched an external network pentesting service that maps and tests publicly reachable systems under a customer’s domain using AI agents.","The service discovers internet-facing assets such as websites, APIs, VPN gateways, mail servers, and self-hosted tools, while filtering out services the customer does not own.","Aikido says its agents test hosts for known CVEs, misconfigurations, and exposed secrets, and only report findings that are supported by validated and reproduced evidence.","The service can run continuously so newly discovered hosts are tested shortly after they go live, and its pricing is based on the number of publicly accessible assets found.","Aikido states that agents operate with safeguards including action review, limits on deeper exploitation, ownership checks, no downloading or storing customer data, and an emergency stop button."],"insights":["The article cites a16z data showing that the share of exploited vulnerabilities attacked on or before public disclosure rose from 18.7% in 2018 to 86.7% so far in 2026, underscoring how little time organizations may have to respond.","Aikido distinguishes external network testing from a web application test: the external test evaluates publicly reachable infrastructure and unauthenticated application surfaces, while logged-in workflows and business logic require a separate web app pentest.","The article illustrates how several individually lower-severity exposures—an exposed .git folder, reused SSH credentials, and Azure credentials on a second server—can be chained into administrative access to a cloud tenant.","According to Aikido’s survey of 400 security and engineering leaders, 48% said pentest findings are already outdated by the time they arrive, supporting the article’s case for testing whenever the public-facing perimeter changes."],"referencedReports":[],"body":"\u003cp\u003eAikido has launched external network pentesting, an AI-agent service that starts with a customer’s domain and maps publicly reachable systems such as websites, APIs, VPN gateways, mail servers, and self-hosted tools. After ownership verification, agents test each host for known CVEs, misconfigurations, and exposed secrets. Aikido says findings are included only when agents provide concrete evidence that is validated and reproduced by other agents.\u003c/p\u003e\n\n\u003cp\u003eThe launch is presented as a response to attackers using automated tooling to rapidly discover and exploit newly disclosed flaws. Aikido cites Cloudflare observations of escalating PHP2Shell exploit attempts and a16z figures showing that 86.7% of vulnerabilities exploited so far in 2026 were attacked on or before the day they became public. The service can run continuously to test newly discovered public-facing hosts, provides remediation suggestions and retests, and includes safeguards intended to avoid disruption, prevent testing systems the customer does not own, and stop agents immediately through a panic button.\u003c/p\u003e\n"},{"n":2,"title":"Fukuoka Jisho Deploys Netskope Across Seven Group Companies to Deliver Secure Access Anywhere, Powered by SSE","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/resources/case-studies/fukuoka-jisho","time":"07:01","priority":"MAY READ","score":35,"tldr":"Fukuoka Jisho has deployed Netskope’s Security Service Edge platform across seven group companies to provide secure, consistent access to applications and data from any location.","briefOverview":"\u003cp\u003eFukuoka Jisho deployed Netskope across seven companies in its group. The stated objective is to provide secure access from any location. The deployment is powered by Security Service Edge (SSE).\u003c/p\u003e\n\n\u003cp\u003eThe rollout applies a shared secure-access approach across multiple group companies. It is intended to support access to company resources regardless of where users are located. Netskope is the technology provider named in the announcement.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fukuoka Jisho deployed Netskope across seven group companies.","The deployment is intended to deliver secure access from any location.","The initiative is powered by Security Service Edge (SSE) technology."],"insights":["The deployment spans multiple group companies rather than a single organization, indicating that the secure-access approach is being applied at the group level.","The stated goal is secure access from any location, making location-independent access the central operational outcome of the deployment."],"referencedReports":[],"body":"\u003cp\u003eFukuoka Jisho deployed Netskope across seven companies in its group. The stated objective is to provide secure access from any location. The deployment is powered by Security Service Edge (SSE).\u003c/p\u003e\n\n\u003cp\u003eThe rollout applies a shared secure-access approach across multiple group companies. It is intended to support access to company resources regardless of where users are located. Netskope is the technology provider named in the announcement.\u003c/p\u003e\n"}]</script>
