<script type="application/json" id="dl-articles">[{"n":5,"title":"Microsoft November 2026 Patch Tuesday fixes 1,235 flaws, Outlook zero-day","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-november-2026-patch-tuesday-fixes-1-235-flaws-outlook-zero-day/","time":"19:07","priority":"MUST READ","score":97,"tldr":"Microsoft's November 2026 Patch Tuesday fixes a record 1,235 vulnerabilities, including an actively exploited Outlook zero-day (CVE-2026-124194) that can leak NTLM authentication hashes when a victim opens a malicious message file. Organizations should prioritize deploying the updates, especially on systems running Outlook, Windows, Office, Edge, and server workloads.","briefOverview":"\u003cp\u003eMicrosoft\u0026rsquo;s November 2026 Patch Tuesday addresses 1,235 vulnerabilities, including 66 rated Critical. The release includes approximately 639 flaws in Windows or Microsoft Windows products and components. Microsoft counts only vulnerabilities released on Patch Tuesday in this total, excluding 108 flaws patched earlier in November.\u003c/p\u003e\n\n\u003cp\u003eThe updates fix one actively exploited Outlook zero-day, CVE-2026-124194, which Microsoft classifies as a spoofing vulnerability. An unauthenticated attacker can send a specially crafted message file that, if opened by a user, causes Outlook to connect to an attacker-controlled network location without its usual external-content warning. That connection can expose NTLMv2 authentication hashes, which an attacker could capture and potentially crack offline to gain unauthorized access to corporate accounts.\u003c/p\u003e\n\n\u003cp\u003eElevation-of-privilege vulnerabilities were the largest category in the release, with 536 issues, followed by 296 remote-code-execution flaws. The update set also includes 157 information-disclosure, 46 denial-of-service, 27 security-feature-bypass, and 22 spoofing vulnerabilities, along with 142 Microsoft Edge flaws. November follows October\u0026rsquo;s record-breaking release of 1,411 flaws, as Microsoft continues using AI to find and patch vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft's November 2026 Patch Tuesday addresses 1,235 vulnerabilities, including 66 rated Critical.","The updates fix one actively exploited Outlook zero-day, CVE-2026-124194, a spoofing flaw that can expose NTLM authentication hashes.","Microsoft says an unauthenticated attacker can send a specially crafted message file that causes Outlook to connect to an attacker-controlled network location if a user opens it.","The November updates include approximately 536 elevation-of-privilege, 296 remote-code-execution, 157 information-disclosure, 46 denial-of-service, 27 security-feature-bypass, and 22 spoofing vulnerabilities.","The reported total excludes 108 flaws fixed earlier in the month, including 82 Mariner and 25 Microsoft Edge vulnerabilities."],"insights":["The reported 1,235-flaw total is deliberately limited to vulnerabilities released on Patch Tuesday itself, while 108 additional flaws patched earlier in November are excluded.","Although the Outlook zero-day is classified as a spoofing vulnerability and rated Moderate in the list, it was actively exploited and could expose NTLMv2 login hashes that may be cracked offline and used to access corporate accounts.","Elevation-of-privilege flaws make up the largest listed category, with 536 issues, exceeding the 296 remote-code-execution vulnerabilities.","About 639 of the 1,235 vulnerabilities are in Windows or Microsoft Windows components, indicating that roughly half of the release concerns the Windows ecosystem.","November follows an October release that fixed 1,411 flaws, with the article attributing the unusually high vulnerability volume to Microsoft's use of AI to find and patch issues."],"referencedReports":[{"title":"CVE-2026-124194 - Microsoft Outlook Spoofing Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-124194","publisher":"microsoft","context":"The article links Microsoft's advisory for the actively exploited Outlook zero-day that can expose NTLM authentication hashes.","category":"advisory","primary":true},{"title":"Microsoft Patch Tuesday November 2026 Report","url":"https://www.bleepingcomputer.com/microsoft-patch-tuesday-reports/Microsoft-Patch-Tuesday-November-2026.html","publisher":"bleepingcomputer","context":"The article directs readers to this full report for vulnerability descriptions and affected systems.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft\u0026rsquo;s November 2026 Patch Tuesday addresses 1,235 vulnerabilities, including 66 rated Critical. The release includes approximately 639 flaws in Windows or Microsoft Windows products and components. Microsoft counts only vulnerabilities released on Patch Tuesday in this total, excluding 108 flaws patched earlier in November.\u003c/p\u003e\n\n\u003cp\u003eThe updates fix one actively exploited Outlook zero-day, CVE-2026-124194, which Microsoft classifies as a spoofing vulnerability. An unauthenticated attacker can send a specially crafted message file that, if opened by a user, causes Outlook to connect to an attacker-controlled network location without its usual external-content warning. That connection can expose NTLMv2 authentication hashes, which an attacker could capture and potentially crack offline to gain unauthorized access to corporate accounts.\u003c/p\u003e\n\n\u003cp\u003eElevation-of-privilege vulnerabilities were the largest category in the release, with 536 issues, followed by 296 remote-code-execution flaws. The update set also includes 157 information-disclosure, 46 denial-of-service, 27 security-feature-bypass, and 22 spoofing vulnerabilities, along with 142 Microsoft Edge flaws. November follows October\u0026rsquo;s record-breaking release of 1,411 flaws, as Microsoft continues using AI to find and patch vulnerabilities.\u003c/p\u003e\n"},{"n":2,"title":"Hackers exploit trusted AWS access to breach multiple cloud environments","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-trusted-aws-access-to-breach-multiple-cloud-environments/","time":"19:31","priority":"MUST READ","score":92,"tldr":"Attackers used compromised Qubole AWS IAM credentials to assume trusted cross-account roles at dozens of customer environments, steal secrets, and exfiltrate data from accessible S3 buckets. Organizations that trusted Qubole’s AWS account should review CloudTrail activity, revoke sessions, rotate credentials, and restrict or remove unused roles.","briefOverview":"\u003cp\u003eA threat actor used compromised AWS identity credentials associated with Qubole, a cloud data processing and analytics platform, to access multiple customer AWS environments. The campaign ran from October 14 to 26 and affected tens of companies that had configured roles allowing Qubole’s AWS account to access their resources. Researchers from Wiz investigated after Sentra reported suspicious customer activity, with Mandiant also involved in the investigation. Sentra confirmed dozens of victims and said millions of files were stolen from one customer alone.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used cross-account roles to enter customer environments within the permissions those roles allowed. They searched cloud resources, collected secrets from AWS Secrets Manager and SSM Parameter Store, reviewed Lambda environment variables, and used TruffleHog to validate discovered AWS, Microsoft Entra ID, and Okta credentials. They then listed accessible S3 buckets and downloaded available data, apparently opportunistically rather than targeting selected files. Administrators potentially affected are advised to review CloudTrail activity from October 1 onward, investigate secret and S3 access, rotate exposed credentials, revoke active role sessions, and restrict or remove unused integrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor used compromised IAM credentials for Qubole’s AWS account to access and steal data from customer AWS environments between October 14 and 26.","The attackers assumed cross-account roles in customer accounts that trusted Qubole, then searched cloud resources, retrieved stored secrets, and inspected Lambda environment variables.","The attackers used TruffleHog to validate discovered AWS keys, Microsoft Entra ID client secrets, and Okta client credentials before downloading accessible S3 bucket data.","Sentra confirmed dozens of victims and reported that millions of files were stolen from one customer, while the method used to compromise Qubole’s accounts remains unspecified.","Potentially affected administrators are advised to review CloudTrail logs from October 1 onward, investigate later secret and S3 access, rotate exposed credentials, revoke active role sessions, and restrict or remove unused integrations."],"insights":["Previously configured but otherwise unused cross-account roles still provided attackers with a pathway into customer environments once Qubole IAM credentials were compromised.","The attackers collected secrets at a reported rate of 100 passwords and keys in seven minutes, highlighting how quickly a cloud intrusion can expand through exposed credentials.","Rather than targeting a predefined dataset, the attackers listed and downloaded data from every S3 bucket reachable through each assumed role, making excessive role permissions especially consequential.","The recommended investigation window begins on October 1 even though the observed campaign ran from October 14 to 26, indicating that administrators should examine activity before the known attack dates."],"referencedReports":[{"title":"Qubole Cross-Account Access Abused in the Wild","url":"https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild","publisher":"wiz","context":"Wiz's technical analysis describes the attackers' use of cross-account role assumption, secret retrieval, credential validation, and S3 data downloads.","category":"research","primary":true},{"title":"Inside the Qubole Supply Chain Attack","url":"http://sentra.io/blog/breaches/inside-the-qubole-supply-chain-attack","publisher":"sentra","context":"Sentra's analysis is cited for confirming dozens of victims and reporting that millions of files were stolen from one customer.","category":"research","primary":true}],"body":"\u003cp\u003eA threat actor used compromised AWS identity credentials associated with Qubole, a cloud data processing and analytics platform, to access multiple customer AWS environments. The campaign ran from October 14 to 26 and affected tens of companies that had configured roles allowing Qubole’s AWS account to access their resources. Researchers from Wiz investigated after Sentra reported suspicious customer activity, with Mandiant also involved in the investigation. Sentra confirmed dozens of victims and said millions of files were stolen from one customer alone.\u003c/p\u003e\n\n\u003cp\u003eThe attackers used cross-account roles to enter customer environments within the permissions those roles allowed. They searched cloud resources, collected secrets from AWS Secrets Manager and SSM Parameter Store, reviewed Lambda environment variables, and used TruffleHog to validate discovered AWS, Microsoft Entra ID, and Okta credentials. They then listed accessible S3 buckets and downloaded available data, apparently opportunistically rather than targeting selected files. Administrators potentially affected are advised to review CloudTrail activity from October 1 onward, investigate secret and S3 access, rotate exposed credentials, revoke active role sessions, and restrict or remove unused integrations.\u003c/p\u003e\n"},{"n":8,"title":"Git Patches Flaw That Lets Malicious Repositories Execute Code During Recursive Clones","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/git-patches-flaw-that-lets-malicious.html","time":"19:23","priority":"SHOULD READ","score":88,"tldr":"Git patched CVE-2026-111760, a flaw that could let a malicious repository execute code during recursive clones by replacing a submodule’s .git file with a symlink to attacker-controlled hooks or configuration. Users should upgrade to Git 2.56.1 or the corresponding patched maintenance release and avoid recursively cloning untrusted repositories until updated.","briefOverview":"\u003cp\u003eGit released fixes for CVE-2026-111760, a flaw that can allow a malicious repository to run attacker-controlled code when it is recursively cloned with its submodules. The fixes are available in Git 2.56.1 and maintenance releases for versions 2.50 through 2.55. GitHub has applied the fixes to github.com and GitHub Enterprise Cloud, and released fixed GitHub Enterprise Server versions 3.19.15, 3.20.11, 3.21.9, and 3.22.4.\u003c/p\u003e\n\n\u003cp\u003eThe issue is caused by an integer truncation in Git’s index handling, where an extremely long path can pass a safety check but later be written under a shorter attacker-chosen name, including .git. In a newly cloned submodule, .git is a file, allowing an attacker to replace it with a symbolic link to a folder containing malicious hooks or configuration; Git hooks can run programs at defined points. The releases also fix five additional issues involving path traversal, memory corruption, crashes from oversized patches, and unsafe fast-import features, while GitHub advises users to update and avoid recursively cloning untrusted repositories until fixed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Git fixed CVE-2026-111760 in Git 2.56.1 and corresponding maintenance releases after an integer truncation issue could enable code execution when a malicious repository is cloned recursively with submodules.","The flaw can cause an extremely long repository path to be written to disk under an attacker-controlled shorter name such as .git, allowing a submodule’s .git file to be replaced with a symbolic link to malicious hooks or configuration.","GitHub has applied the fixes to github.com and GitHub Enterprise Cloud, while GitHub Enterprise Server fixes are available in versions 3.19.15, 3.20.11, 3.21.9, and 3.22.4.","The Git releases also address five other flaws involving path traversal, stack-memory corruption, an out-of-bounds read, heap-memory corruption, and unsafe git fast-import features.","Until users install a fixed version, GitHub advises cloning only from trusted servers and avoiding recursive clones, untrusted merges or tags, binary patches, and fast-import streams from untrusted sources."],"insights":["The recursive-clone issue depends on submodules because a newly cloned submodule uses a .git file, whereas Git refuses to replace an existing .git folder with a symbolic link.","Updating Git itself may not be sufficient where applications ship their own embedded copy of Git, so those applications also need updated versions.","Code-hosting servers may be exposed to CVE-2026-105437 through git merge-tree checks on pull or merge requests, because a repository-controlled .gitattributes setting can trigger the flaw.","Servers unable to immediately upgrade can reduce exposure to CVE-2026-105437 by setting conflict-marker-size=7 in each repository’s info/attributes file or disabling merge checks for untrusted repositories.","Git now blocks three risky git fast-import features in input streams by default, allowing them only when --allow-unsafe-features is explicitly set."],"referencedReports":[{"title":"Git security vulnerabilities announced #7","url":"https://github.blog/open-source/git/git-security-vulnerabilities-announced-7/","publisher":"github","context":"The article cites GitHub’s detailed write-up explaining the Git security fixes and update guidance.","category":"advisory","primary":true},{"title":"Git release announcement","url":"https://lore.kernel.org/git/xmqqh5hosgw5.fsf@gitster.g/","publisher":"git-project","context":"The article cites the Git project’s release announcement for the list of fixed Git versions and the path-length mitigation.","category":"advisory","primary":true}],"body":"\u003cp\u003eGit released fixes for CVE-2026-111760, a flaw that can allow a malicious repository to run attacker-controlled code when it is recursively cloned with its submodules. The fixes are available in Git 2.56.1 and maintenance releases for versions 2.50 through 2.55. GitHub has applied the fixes to github.com and GitHub Enterprise Cloud, and released fixed GitHub Enterprise Server versions 3.19.15, 3.20.11, 3.21.9, and 3.22.4.\u003c/p\u003e\n\n\u003cp\u003eThe issue is caused by an integer truncation in Git’s index handling, where an extremely long path can pass a safety check but later be written under a shorter attacker-chosen name, including .git. In a newly cloned submodule, .git is a file, allowing an attacker to replace it with a symbolic link to a folder containing malicious hooks or configuration; Git hooks can run programs at defined points. The releases also fix five additional issues involving path traversal, memory corruption, crashes from oversized patches, and unsafe fast-import features, while GitHub advises users to update and avoid recursively cloning untrusted repositories until fixed.\u003c/p\u003e\n"},{"n":3,"title":"Railway breach leads to $740,000 in fraudulent AI charges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/apple/railway-breach-leads-to-740-000-in-fraudulent-ai-charges/","time":"22:20","priority":"SHOULD READ","score":86,"tldr":"Railway says attackers exploited two infrastructure flaws, accessed decrypted environment variables for up to 100,000 workspaces, and used stolen AI credentials to incur about $740,000 in fraudulent charges. Customers should rotate secrets, while Railway says it has removed the attackers, remediated the flaws, and will cover unreimbursed charges.","briefOverview":"\u003cp\u003eRailway says attackers exploited a previously unknown flaw in its build infrastructure on October 20, escaping file-system isolation and obtaining an internal credential. They used it to access build histories, retrieve a copy of Railway’s internal source code, and identify further ways into the platform. A second issue involving an improperly configured trust relationship then gave the attackers credentials used to decrypt customer environment variables. Railway says up to 1.85% of workspaces, or about 100,000, could have been affected, though this is a maximum potential estimate rather than a confirmed count of stolen secrets.\u003c/p\u003e\n\n\u003cp\u003eThe attackers reportedly searched for AI-provider credentials and used stolen credentials to create approximately $740,000 in unauthorized AI usage. Linked-account tokens for 1,852 users, including GitHub OAuth tokens and AI agent keys, were also exposed; Railway reset them and notified affected users. Railway says its engineers and the attackers used AI-powered agents during a roughly 26-hour effort involving multiple attack and defense routes. The company says it removed the attackers on October 21, fixed the exploited issues, found no evidence that customer Git repositories or databases were accessed, and will cover AI charges that providers do not refund.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Railway says attackers exploited an unknown flaw in its build infrastructure on October 20 to escape file-system isolation, obtain an internal credential, and access build histories and its internal source code.","The attackers then exploited an improperly configured trust relationship to obtain credentials used to decrypt customer environment variables, potentially affecting up to 1.85% of Railway workspaces, or about 100,000.","Railway says the stolen credentials were used to generate approximately $740,000 in unauthorized AI usage, and it will cover charges that AI providers do not refund.","The incident also exposed linked-account tokens for 1,852 users, including GitHub OAuth tokens and AI agent keys; Railway reset the tokens and notified affected users.","Railway says it removed the attackers from its systems on October 21, remediated the exploited flaws, and found no evidence that customer Git repositories or databases were accessed."],"insights":["The reported 100,000-workspace figure is Railway’s maximum potential exposure estimate, not a confirmed count of workspaces whose secrets were stolen.","Railway describes the response as a roughly 26-hour contest in which attackers and defenders used AI-powered agents to find and close multiple routes in parallel, rather than a one-time intrusion followed by a single fix.","The attackers reportedly searched specifically for AI-provider credentials, while also querying cloud, database, and payment-service credentials, indicating that the exposed environment variables could enable impacts beyond AI-service charges.","Railway found no evidence that customer Git repositories or customer databases were downloaded or accessed, narrowing the reported scope despite the attackers obtaining internal source code and some decrypted customer environment variables.","Railway linked the incident to Wiz’s reported \"Black October\" campaign, which also targeted Northflank, OpenCode, Warp, and Lightning AI."],"referencedReports":[],"body":"\u003cp\u003eRailway says attackers exploited a previously unknown flaw in its build infrastructure on October 20, escaping file-system isolation and obtaining an internal credential. They used it to access build histories, retrieve a copy of Railway’s internal source code, and identify further ways into the platform. A second issue involving an improperly configured trust relationship then gave the attackers credentials used to decrypt customer environment variables. Railway says up to 1.85% of workspaces, or about 100,000, could have been affected, though this is a maximum potential estimate rather than a confirmed count of stolen secrets.\u003c/p\u003e\n\n\u003cp\u003eThe attackers reportedly searched for AI-provider credentials and used stolen credentials to create approximately $740,000 in unauthorized AI usage. Linked-account tokens for 1,852 users, including GitHub OAuth tokens and AI agent keys, were also exposed; Railway reset them and notified affected users. Railway says its engineers and the attackers used AI-powered agents during a roughly 26-hour effort involving multiple attack and defense routes. The company says it removed the attackers on October 21, fixed the exploited issues, found no evidence that customer Git repositories or databases were accessed, and will cover AI charges that providers do not refund.\u003c/p\u003e\n"},{"n":4,"title":"Japanese furniture giant Nitori says hackers stole 37.6M customer records","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/japanese-furniture-giant-nitori-says-hackers-stole-376m-customer-records/","time":"20:54","priority":"SHOULD READ","score":84,"tldr":"Japanese furniture retailer Nitori says unauthorized access to its systems may have exposed up to 37.62 million customer records, including contact details and order information. Passwords and credit-card data were not affected, but customers are being warned about phishing and scams.","briefOverview":"\u003cp\u003eNitori, a major Japanese furniture and home-accessories retailer, said it confirmed unauthorized third-party access to a company-managed system on November 6, 2026. The company blocked the access, but its investigation indicates the intruder may have had access since mid-October. Nitori said up to 37.62 million personal-information records stored on its servers may have been leaked externally.\u003c/p\u003e\n\n\u003cp\u003eThe potentially affected population includes individual customers, corporate members, and non-members who placed orders through official stores or online shops. Exposed information may include names, email and postal addresses, telephone numbers, dates of birth, gender, corporate contact details, and order information from Nitori Net and official marketplace shops. Nitori said member passwords and credit-card information were not exposed, but warned that the information could be used in phishing and scam attempts and said it has notified relevant Japanese authorities and will contact affected customers directly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nitori said unauthorized access to a company-managed system was confirmed on November 6, 2026, and its investigation indicates the attacker may have had access since mid-October.","The company said up to 37.62 million personal-information records may have been leaked externally.","Affected data may include customer and corporate member contact details, dates of birth, gender, company information, and online-order information from Nitori Net and official marketplace shops.","Nitori said registered-member passwords and credit-card information were not exposed.","The company blocked the unauthorized access, addressed system weaknesses, informed relevant Japanese authorities, and warned customers to be alert for phishing and scam attempts."],"insights":["The incident affects not only registered members but also non-members who placed orders, meaning people without a Nitori account may still need to watch for suspicious messages.","Although Nitori says passwords and credit-card information were not exposed, the company specifically warns that the potentially exposed contact and order information could be used in phishing and scam attempts.","Corporate-member information may include company, department, representative, and contact-person details, alongside individual customer information.","Nitori detected the intrusion on November 6, but its investigation indicates the attacker may have had access since mid-October."],"referencedReports":[{"title":"Nitori unauthorized-access notification","url":"https://www.nitorihd.co.jp/news/items/2b702dbe4d438f7fef74945d68e5bd27_3.pdf","publisher":"nitori","context":"The article cites Nitori’s notification as the source for its statement that up to 37.62 million personal-information records may have been leaked.","category":"advisory","primary":true}],"body":"\u003cp\u003eNitori, a major Japanese furniture and home-accessories retailer, said it confirmed unauthorized third-party access to a company-managed system on November 6, 2026. The company blocked the access, but its investigation indicates the intruder may have had access since mid-October. Nitori said up to 37.62 million personal-information records stored on its servers may have been leaked externally.\u003c/p\u003e\n\n\u003cp\u003eThe potentially affected population includes individual customers, corporate members, and non-members who placed orders through official stores or online shops. Exposed information may include names, email and postal addresses, telephone numbers, dates of birth, gender, corporate contact details, and order information from Nitori Net and official marketplace shops. Nitori said member passwords and credit-card information were not exposed, but warned that the information could be used in phishing and scam attempts and said it has notified relevant Japanese authorities and will contact affected customers directly.\u003c/p\u003e\n"},{"n":9,"title":"SGLang RCE Exploit Breaches NEAR AI, Steals Data From 18 Agents and About 100 Users","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/sglang-rce-exploit-breaches-near-ai.html","time":"19:19","priority":"SHOULD READ","score":84,"tldr":"An attacker exploited an SGLang remote-code-execution flaw to breach NEAR AI infrastructure, exposing data from 18 AI agents and account details for about 100 users, with possible access to requests processed on an affected inference server. NEAR AI patched the issue, rotated credentials and tokens, revoked exposed API keys, and notified confirmed affected users.","briefOverview":"\u003cp\u003eAn attacker exploited a remote-code-execution flaw in the open-source SGLang inference engine and ran code on a NEAR AI inference server last Sunday. Because SGLang was running inside NEAR AI’s trusted execution environment, the attacker could potentially view requests processed by that server, including requests sent in confidential mode. NEAR AI said the protected environment does not defend against flaws in software operating within it.\u003c/p\u003e\n\n\u003cp\u003eThe attacker later accessed an internal system behind NEAR AI’s deprecated Private Chat product and downloaded account details for about 100 users, including names, email addresses, and, for some accounts, plan and balance information. The attacker also accessed 18 AI agents on an older deployment outside the protected environment, taking chat histories, settings, and logs; two customers’ NEAR AI Cloud API keys were exposed in logs and revoked. NEAR AI said it found no sign that stored Private Chat conversations or uploaded files were accessed, and it responded by patching its inference servers, revoking sessions and credentials, replacing agent tokens, rotating credentials, and notifying confirmed affected users.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker exploited a remote-code-execution flaw in the SGLang inference engine to run code on a NEAR AI inference server.","The attacker may have viewed requests processed by the affected server, including requests in confidential mode, because SGLang ran inside the protected processing environment.","The attacker accessed an internal system behind NEAR AI’s deprecated Private Chat product and downloaded account details for about 100 users, including names and email addresses.","The attacker accessed 18 AI agents on an older NEAR AI Agents deployment and took chat histories, settings, and logs; logs exposed two customers’ NEAR AI Cloud API keys.","NEAR AI says it patched the SGLang flaw on its inference servers, revoked active sessions and administrator credentials, replaced agent tokens, rotated remaining credentials, and notified confirmed affected users."],"insights":["The incident shows that a protected processing environment cannot keep requests private when the software running inside it contains a code-execution flaw.","The attacker moved from an affected inference server into a deprecated Private Chat system and an older AI-agent deployment outside the protected environment, highlighting that legacy services remained relevant to the incident.","NEAR AI found no evidence that stored Private Chat conversations or uploaded files were accessed, but it said requests passing through the affected server could have been seen.","NEAR AI did not identify the SGLang flaw by CVE, name affected versions, or say whether the SGLang project had released a fix, limiting the public details available about the issue.","Only users whose account details or agents were confirmed accessed were contacted, while NEAR AI did not say whether people whose requests ran through the affected server were included."],"referencedReports":[{"title":"Security Incident Report: SGLang Vulnerability","url":"https://near.ai/blog/security-incident-report-sglang-vulnerability","publisher":"near-ai","context":"The article cites NEAR AI’s incident report for its account of the SGLang remote-code-execution incident and the company’s remediation actions.","category":"advisory","primary":true},{"title":"Browser AI End-to-End Encryption","url":"https://brave.com/blog/browser-ai-e2ee/","publisher":"brave","context":"The article references Brave’s technical write-up stating that its Leo assistant runs chats with the GLM 5.3 Flash model inside a NEAR AI-operated protected processing environment.","category":"research","primary":false}],"body":"\u003cp\u003eAn attacker exploited a remote-code-execution flaw in the open-source SGLang inference engine and ran code on a NEAR AI inference server last Sunday. Because SGLang was running inside NEAR AI’s trusted execution environment, the attacker could potentially view requests processed by that server, including requests sent in confidential mode. NEAR AI said the protected environment does not defend against flaws in software operating within it.\u003c/p\u003e\n\n\u003cp\u003eThe attacker later accessed an internal system behind NEAR AI’s deprecated Private Chat product and downloaded account details for about 100 users, including names, email addresses, and, for some accounts, plan and balance information. The attacker also accessed 18 AI agents on an older deployment outside the protected environment, taking chat histories, settings, and logs; two customers’ NEAR AI Cloud API keys were exposed in logs and revoked. NEAR AI said it found no sign that stored Private Chat conversations or uploaded files were accessed, and it responded by patching its inference servers, revoking sessions and credentials, replacing agent tokens, rotating credentials, and notifying confirmed affected users.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft releases Windows 10 KB5131096 extended security update","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-releases-windows-10-kb5131096-extended-security-update/","time":"20:04","priority":"SHOULD READ","score":82,"tldr":"Microsoft released the Windows 10 KB5131096 extended security update for ESU and Enterprise LTSC users, bringing systems to build 19045.7846 and including November 2026 security fixes. It also resolves remaining USB Audio Class 1.0 problems, printer and Remote Desktop issues, and adds stricter PowerShell script-signing encoding validation.","briefOverview":"\u003cp\u003eMicrosoft released the Windows 10 KB5131096 extended security update, which includes November 2026 Patch Tuesday security fixes and several bug fixes. The update is available to Windows 10 Enterprise LTSC users and people enrolled in the Extended Security Updates program through Windows Update. After installation, Windows 10 is updated to build 19045.7846, while Windows 10 Enterprise LTSC 2021 reaches build 19044.7846.\u003c/p\u003e\n\n\u003cp\u003eKB5131096 includes a daylight saving time adjustment for Cuba, fixes an error when adding Active Directory-published printers, and resolves Remote Desktop policy and shadow-connection issues. It also introduces stricter PowerShell script-signing encoding checks, meaning scripts with invalid UTF-8 encoding may need to be saved with valid UTF-8 encoding and a byte order mark before being signed again. Microsoft says the update resolves all remaining USB Audio Class 1.0 issues introduced by September 2026 security updates, including no audio output, Code 10 startup errors, and unresponsive sound controls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the Windows 10 KB5131096 extended security update, which includes November 2026 Patch Tuesday security fixes and bug fixes.","The update is available through Windows Update for Windows 10 Enterprise LTSC users and users enrolled in the Extended Security Updates program.","After installation, Windows 10 reaches build 19045.7846 and Windows 10 Enterprise LTSC 2021 reaches build 19044.7846.","KB5131096 fixes an Active Directory printer-addition error, Remote Desktop policy and shadow-connection issues, and remaining USB Audio Class 1.0 problems caused by September 2026 security updates.","The update adds stricter encoding validation for PowerShell script signing, which can cause scripts with invalid UTF-8 encoding to fail signature validation."],"insights":["Windows 10 systems that are neither Enterprise LTSC nor enrolled in the Extended Security Updates program are not identified as eligible to receive KB5131096 through the normal update process described in the article.","The update changes PowerShell script-signing behavior: previously accepted signed scripts can now fail if they contain invalid UTF-8 encoding, and affected scripts must be saved as valid UTF-8 with a byte order mark and signed again.","KB5131096 completes Microsoft's fixes for USB Audio Class 1.0 issues that began with the September 2026 security updates, including devices that produced no sound, showed Code 10 startup errors, or had unresponsive sound controls.","The update changes Cuba's time-zone rules so systems remain on UTC-04:00 through the extended 2026–2027 daylight-saving period and do not make the usual November 2026 or March 2027 clock changes."],"referencedReports":[{"title":"KB5131096: Windows 10 21H2/22H2 security update","url":"https://support.microsoft.com/en-us/servicing/os/windows-10/2026/11/kb5131096-windows-10-21h2-22h2-security-update","publisher":"microsoft","context":"The article links to Microsoft's advisory for the KB5131096 Windows 10 security update and its listed fixes.","category":"advisory","primary":true},{"title":"Encoding Guidance for Signed PowerShell Scripts","url":"https://support.microsoft.com/en-us/help/5135999","publisher":"microsoft","context":"The article directs readers to this Microsoft guidance for resolving PowerShell signature-validation failures caused by invalid UTF-8 encoding.","category":"guide","primary":false}],"body":"\u003cp\u003eMicrosoft released the Windows 10 KB5131096 extended security update, which includes November 2026 Patch Tuesday security fixes and several bug fixes. The update is available to Windows 10 Enterprise LTSC users and people enrolled in the Extended Security Updates program through Windows Update. After installation, Windows 10 is updated to build 19045.7846, while Windows 10 Enterprise LTSC 2021 reaches build 19044.7846.\u003c/p\u003e\n\n\u003cp\u003eKB5131096 includes a daylight saving time adjustment for Cuba, fixes an error when adding Active Directory-published printers, and resolves Remote Desktop policy and shadow-connection issues. It also introduces stricter PowerShell script-signing encoding checks, meaning scripts with invalid UTF-8 encoding may need to be saved with valid UTF-8 encoding and a byte order mark before being signed again. Microsoft says the update resolves all remaining USB Audio Class 1.0 issues introduced by September 2026 security updates, including no audio output, Code 10 startup errors, and unresponsive sound controls.\u003c/p\u003e\n"},{"n":7,"title":"US Army member arrested in UK over allegations of spying for Russia","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/us-army-member-arrested-in-uk-spying-for-russia","time":"21:13","priority":"MAY READ","score":72,"tldr":"A 41-year-old U.S. Army soldier was arrested in Gloucestershire, UK, on suspicion of spying for Russia under the UK National Security Act. British counterterrorism police are investigating alongside U.S. authorities, including the FBI and U.S. Army Counterintelligence Command.","briefOverview":"\u003cp\u003eA 41-year-old U.S. Army soldier was arrested near Gloucester, UK, on suspicion of spying for Russia. UK counterterrorism police said they were working closely with U.S. authorities, including the FBI and the military. The unnamed soldier is being held at a London police station.\u003c/p\u003e\n\n\u003cp\u003eThe arrest was made under sections of the UK National Security Act covering espionage, and police searched two locations in Gloucestershire. The head of U.S. Army Counterintelligence Command said the senior soldier had been entrusted with sensitive information. The case comes as GCHQ has warned that Russia is conducting daily activity against the United States and its Western allies, including targeting critical infrastructure, democratic processes, supply chains, and public trust.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A 41-year-old U.S. Army soldier was arrested near Gloucester, UK, on suspicion of spying for Russia.","UK counterterrorism police said they worked closely with U.S. authorities, including the FBI and U.S. military, during the investigation.","The arrest was made under provisions of the UK National Security Act concerning espionage, and police searched two locations in Gloucestershire.","The head of U.S. Army Counterintelligence Command said the arrested senior soldier had been entrusted with sensitive information.","GCHQ Director Anne Keast-Butler said Russia has been relentlessly targeting critical infrastructure, democratic processes, supply chains, and public trust."],"insights":["The investigation is a cross-border effort involving UK counterterrorism police, the FBI, and the U.S. military, showing that the alleged conduct affects both British and U.S. national-security interests.","The arrest took place near Gloucester, close to GCHQ’s headquarters, while the suspect was described as a senior soldier entrusted with sensitive information.","British authorities used the UK National Security Act’s espionage provisions rather than identifying the case as a conventional criminal matter, and explicitly said the allegations relate to Russia.","The case comes amid GCHQ warnings that Russia conducts daily activity against Western allies and targets areas ranging from critical infrastructure and democratic processes to supply chains and public trust."],"referencedReports":[],"body":"\u003cp\u003eA 41-year-old U.S. Army soldier was arrested near Gloucester, UK, on suspicion of spying for Russia. UK counterterrorism police said they were working closely with U.S. authorities, including the FBI and the military. The unnamed soldier is being held at a London police station.\u003c/p\u003e\n\n\u003cp\u003eThe arrest was made under sections of the UK National Security Act covering espionage, and police searched two locations in Gloucestershire. The head of U.S. Army Counterintelligence Command said the senior soldier had been entrusted with sensitive information. The case comes as GCHQ has warned that Russia is conducting daily activity against the United States and its Western allies, including targeting critical infrastructure, democratic processes, supply chains, and public trust.\u003c/p\u003e\n"},{"n":11,"title":"Railway’s Security Incident: Why CI/CD Needs Runtime Security","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/railway-security-incident-cicd-runtime-security","time":"20:39","priority":"MAY READ","score":55,"tldr":"Railway’s incident shows that compromised CI/CD build environments can expose internal credentials, cloud access, and customer secrets. Organizations should isolate build jobs, restrict egress, monitor runtime behavior, and tightly scope OIDC and cloud permissions.","briefOverview":"\u003cp\u003eRailway reported that an attacker partially escaped build isolation on October 20 and 21, obtained a build infrastructure credential, and used it to access stored build histories and internal source code. A separate OIDC configuration error later enabled cloud access and access to systems used to retrieve and decrypt customer variables. Railway said up to 1.85% of workspaces, about 100,000, could have had variables decrypted, while emphasizing that this was an upper bound.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that CI/CD build jobs are a security boundary because they execute code, handle credentials, and can access internal services, cloud roles, artifacts, and deployments. It recommends isolating untrusted build jobs from privileged deployment jobs, using disposable runner environments, restricting network connections, and reviewing service-side authorization. It also recommends using runtime monitoring and egress controls through StepSecurity Harden-Runner, alongside narrowly scoped OIDC trust policies and GitHub environment approvals for production deployments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Railway reported that an attacker partially escaped build isolation, obtained a build credential, and later used a separate OIDC configuration error to gain cloud access and reach systems used to retrieve and decrypt customer variables.","Railway said that at most 1.85% of workspaces, approximately 100,000, could have had variables decrypted, and described this number as an upper bound.","The article recommends separating untrusted build jobs from privileged deployment jobs, using disposable execution environments, and limiting access to internal services and production credentials.","StepSecurity Harden-Runner provides runtime network and process monitoring with workflow-step context and can enforce reviewed outbound connection allowlists on supported runners.","The article recommends using GitHub environment approvals and narrowly scoped OIDC cloud trust policies to restrict production cloud access to intended deployment jobs."],"insights":["A build job with a narrowly scoped workflow token can still be high risk if the runner host exposes broader credentials, cached material, or access to internal services.","Network allowlists reduce where a compromised job can send data, but they do not prevent an allowed service from being misused or stop stolen credentials from being used on another machine.","A protected GitHub environment can keep a deployment job from starting until an authorized reviewer approves it, even when an attacker can trigger the workflow.","File-change checks and other preparation can run in a separate low-privilege job, allowing the production deployment job to avoid running unrelated third-party code while still receiving a simple deployment decision.","Storing a secret in a GitHub environment does not itself require approval; environment protection rules must be configured separately."],"referencedReports":[{"title":"Incident Report: October 21st Security Attack","url":"https://blog.railway.com/p/incident-report-october-security-incident","publisher":"railway","context":"The article relies on Railway’s incident report for its account of the build-isolation escape, credential exposure, OIDC configuration error, and potential customer-variable impact.","category":"news","primary":true}],"body":"\u003cp\u003eRailway reported that an attacker partially escaped build isolation on October 20 and 21, obtained a build infrastructure credential, and used it to access stored build histories and internal source code. A separate OIDC configuration error later enabled cloud access and access to systems used to retrieve and decrypt customer variables. Railway said up to 1.85% of workspaces, about 100,000, could have had variables decrypted, while emphasizing that this was an upper bound.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that CI/CD build jobs are a security boundary because they execute code, handle credentials, and can access internal services, cloud roles, artifacts, and deployments. It recommends isolating untrusted build jobs from privileged deployment jobs, using disposable runner environments, restricting network connections, and reviewing service-side authorization. It also recommends using runtime monitoring and egress controls through StepSecurity Harden-Runner, alongside narrowly scoped OIDC trust policies and GitHub environment approvals for production deployments.\u003c/p\u003e\n"},{"n":6,"title":"Microsoft’s Patch Tuesday surpasses 1,000 bugs for second month in a row","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/patch-tuesday-microsoft-1000-bugs-again","time":"20:55","priority":"MAY READ","score":40,"tldr":"Microsoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday, including an actively exploited Outlook flaw (CVE-2026-124194) that can expose authentication information through a malicious message file. CISA has ordered federal agencies to patch it by month-end, while other actively exploited flaws in Barracuda products also require urgent remediation.","briefOverview":"\u003cp\u003eMicrosoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday release, marking the second consecutive month with more than 1,000 bugs reported. One flaw, CVE-2026-124194 in Microsoft Outlook, is being exploited in the wild and has a severity score of 6.5. CISA added the issue to its Known Exploited Vulnerabilities catalog and ordered federal civilian agencies to patch it by the end of the month.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said an attacker could send a specially crafted message file that, when opened, causes Outlook to contact an attacker-controlled network location without its normal external-content warning. This could expose authentication information that might be used to impersonate the user. CISA also ordered agencies to patch two exploited Barracuda email-security flaws by Friday and investigate possible compromises, while N-able took hosted N-central systems offline after more than 30 serious vulnerabilities and related scanning activity were reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday release, including 63 rated critical.","Microsoft said CVE-2026-124194, an actively exploited Outlook vulnerability rated 6.5, can cause Outlook to contact an attacker-controlled network location when a user opens a specially crafted message file.","CISA added CVE-2026-124194 to its Known Exploited Vulnerabilities catalog and directed federal civilian agencies to patch it by the end of the month.","CISA also gave federal agencies until Friday to patch CVE-2026-116606 and CVE-2026-111560 in Barracuda email security products and to investigate possible compromises.","After more than 30 serious N-Central vulnerabilities were disclosed, N-able took hosted N-central environments offline and told customers to shut down their servers."],"insights":["Although the actively exploited Outlook flaw has a moderate 6.5 severity score, it can expose authentication information that could let an attacker impersonate the affected user.","Microsoft’s disclosures have already exceeded 5,160 vulnerabilities this year, and the article says that pace would surpass every prior year.","N-able reported scanning linked to published proof-of-concept code for N-Central flaws, prompting it to take hosted environments offline despite saying it had no evidence of successful customer exploitation.","For the two Barracuda flaws, CISA required federal agencies not only to apply fixes but also to investigate whether they may already have been compromised."],"referencedReports":[{"title":"Security Advisory: Ivanti Connect Secure CVE-2026-104935","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935?language=en_US","publisher":"ivanti","context":"The article links to Ivanti’s security advisory while noting that Ivanti released patches among other vendors.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft disclosed 1,093 vulnerabilities in its latest Patch Tuesday release, marking the second consecutive month with more than 1,000 bugs reported. One flaw, CVE-2026-124194 in Microsoft Outlook, is being exploited in the wild and has a severity score of 6.5. CISA added the issue to its Known Exploited Vulnerabilities catalog and ordered federal civilian agencies to patch it by the end of the month.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said an attacker could send a specially crafted message file that, when opened, causes Outlook to contact an attacker-controlled network location without its normal external-content warning. This could expose authentication information that might be used to impersonate the user. CISA also ordered agencies to patch two exploited Barracuda email-security flaws by Friday and investigate possible compromises, while N-able took hosted N-central systems offline after more than 30 serious vulnerabilities and related scanning activity were reported.\u003c/p\u003e\n"},{"n":10,"title":"Microsoft’s November 2026 Patch Tuesday addresses 1093 CVEs (CVE-2026-124194)","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/microsoft-november-2026-patch-tuesday-addresses-1093-cves-cve-2026-124194","time":"19:01","priority":"MAY READ","score":40,"tldr":"Microsoft’s November 2026 Patch Tuesday fixes 1,093 CVEs, including 63 critical flaws, with urgent attention warranted for a zero-day Outlook spoofing issue (CVE-2026-124194) exploited in the wild and several more-likely-to-be-exploited remote code execution vulnerabilities in Active Directory, Exchange, and Schannel.","briefOverview":"\u003cp\u003eMicrosoft’s November 2026 Patch Tuesday addressed 1,093 CVEs across 287 products and components: 63 critical, 1,029 important, and one moderate. Elevation-of-privilege issues accounted for 48.9% of the fixes, followed by remote-code-execution issues at 27.1%. Microsoft Office Word, Excel, and SQL Server had the largest numbers of CVEs patched, with 65, 64, and 53 respectively.\u003c/p\u003e\n\n\u003cp\u003eThe moderate Outlook spoofing flaw CVE-2026-124194 was exploited in the wild as a zero-day and can allow an attacker who convinces a person to open a crafted Office file to obtain that person’s NTLMv2 hash for follow-on impersonation. Microsoft also fixed critical remote-code-execution vulnerabilities in Active Directory Domain Services, Exchange Server, and Windows Schannel, each assessed as “Exploitation More Likely.” Other notable more-likely-to-be-exploited issues include flaws in Visual Studio Code, Windows Network Address Translation, Windows Installer, the Windows kernel, and Windows Print Spooler Components.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s advisory credited a security researcher who used Anthropic’s Claude for discovering CVE-2026-124194, without naming the Claude version. The update covers a wide range of Microsoft products, including Windows, Office, Exchange, SharePoint, SQL Server, Azure services, and Visual Studio. Tenable recommends applying patches as soon as possible and regularly scanning environments to find systems that remain unpatched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s November 2026 Patch Tuesday addressed 1,093 CVEs across 287 products and components, including 63 rated critical, 1,029 rated important, and one rated moderate.","CVE-2026-124194 is a moderate Microsoft Outlook spoofing flaw that Microsoft says was exploited in the wild and can allow an attacker to obtain a target’s NTLMv2 hash if the target opens a crafted Office file.","Critical vulnerabilities rated “Exploitation More Likely” include remote code execution flaws in Windows Active Directory Domain Services (CVE-2026-118146), Microsoft Exchange Server (CVE-2026-118207), and Windows Schannel (CVE-2026-119952).","Microsoft Office Word, Microsoft Office Excel, and SQL Server had the highest numbers of CVEs patched, with 65, 64, and 53 respectively.","Elevation of Privilege issues accounted for 48.9% of the vulnerabilities patched, while remote code execution issues accounted for 27.1%."],"insights":["The only moderate-rated issue, CVE-2026-124194 in Outlook, was already exploited in the wild, showing that severity ratings alone do not identify the most urgent patching priority.","Microsoft credited the discovery of CVE-2026-124194 to a researcher using Anthropic’s Claude, although the advisory did not identify a specific Claude version.","Several vulnerabilities assessed as “Exploitation More Likely” affect core enterprise services including Active Directory Domain Services, Exchange Server, Schannel, Windows NAT, and Visual Studio Code.","Although most fixes were rated important rather than critical, elevation-of-privilege issues made up nearly half of all patched vulnerabilities, at 48.9%.","Microsoft SharePoint Server’s CVE-2026-120002 has a CVSSv3 score of 9.9 but is rated important and assessed as “Exploitation Less Likely,” illustrating that the article distinguishes severity scores from expected exploitability."],"referencedReports":[{"title":"Microsoft’s November 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/en-us/releaseNote/2026-Nov","publisher":"microsoft","context":"The article links Microsoft’s November 2026 Security Updates as the official source for the Patch Tuesday release.","category":"advisory","primary":true},{"title":"CVE-2026-124194 | Microsoft Outlook Spoofing Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-124194","publisher":"microsoft","context":"The article links Microsoft’s advisory for the Outlook zero-day that was exploited in the wild.","category":"advisory","primary":true},{"title":"CVE-2026-118146 | Windows Active Directory Domain Services Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-118146","publisher":"microsoft","context":"The article links Microsoft’s advisory for a critical Active Directory Domain Services remote code execution flaw.","category":"advisory","primary":true},{"title":"CVE-2026-120002 | Microsoft SharePoint Server Elevation of Privilege Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-120002","publisher":"microsoft","context":"The article links Microsoft’s advisory for the SharePoint Server privilege elevation issue.","category":"advisory","primary":true},{"title":"CVE-2026-118207 | Microsoft Exchange Server Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2026-118207","publisher":"microsoft","context":"The article links Microsoft’s advisory for a critical Exchange Server remote code execution flaw.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft’s November 2026 Patch Tuesday addressed 1,093 CVEs across 287 products and components: 63 critical, 1,029 important, and one moderate. Elevation-of-privilege issues accounted for 48.9% of the fixes, followed by remote-code-execution issues at 27.1%. Microsoft Office Word, Excel, and SQL Server had the largest numbers of CVEs patched, with 65, 64, and 53 respectively.\u003c/p\u003e\n\n\u003cp\u003eThe moderate Outlook spoofing flaw CVE-2026-124194 was exploited in the wild as a zero-day and can allow an attacker who convinces a person to open a crafted Office file to obtain that person’s NTLMv2 hash for follow-on impersonation. Microsoft also fixed critical remote-code-execution vulnerabilities in Active Directory Domain Services, Exchange Server, and Windows Schannel, each assessed as “Exploitation More Likely.” Other notable more-likely-to-be-exploited issues include flaws in Visual Studio Code, Windows Network Address Translation, Windows Installer, the Windows kernel, and Windows Print Spooler Components.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s advisory credited a security researcher who used Anthropic’s Claude for discovering CVE-2026-124194, without naming the Claude version. The update covers a wide range of Microsoft products, including Windows, Office, Exchange, SharePoint, SQL Server, Azure services, and Visual Studio. Tenable recommends applying patches as soon as possible and regularly scanning environments to find systems that remain unpatched.\u003c/p\u003e\n"}]</script>

  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
