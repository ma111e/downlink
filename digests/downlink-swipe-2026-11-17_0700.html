<script type="application/json" id="dl-articles">[{"n":4,"title":"Hijacked Optimizely Scripts Served Card Skimmer and iOS Exploit Kits to CNN, BBC and Zoom Visitors","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hijacked-optimizely-scripts-served-card.html","time":"07:12","priority":"MUST READ","score":96,"tldr":"Attackers exploited Optimizely Web Experimentation to inject malicious JavaScript into scripts served by at least 178 organizations, including CNN, BBC, and Zoom, enabling crypto-address swapping, payment-card skimming, and conditional iOS exploit-kit delivery. Optimizely says it removed the code and fixed the issue, but affected site owners and visitors should review Monday’s exposure and rotate potentially compromised credentials or payment details.","briefOverview":"\u003cp\u003eAn attacker exploited a flaw in Optimizely Web Experimentation to add malicious JavaScript to customer project scripts, causing visitors to affected websites to receive the code through legitimate Optimizely snippets. Report URI found malicious code in 188 snippets tied to 178 organizations, including CNN, the BBC, Zoom, Salesforce, GitLab, IKEA, HSBC, Equifax, Air France-KLM, Ledger, and Peacock. Optimizely said it removed the code, fixed the flaw, secured affected user accounts, and added protections against unauthorized code delivery.\u003c/p\u003e\n\n\u003cp\u003eThe payload replaced valid cryptocurrency wallet addresses with attacker-controlled addresses and later added a card skimmer that captured submitted card numbers, expiry dates, and CVVs from site form fields. It also conditionally loaded second-stage code for iPhones and iPads associated with the Coruna and DarkSword iOS exploit kits, although researchers reported no confirmed takeover of a physical device. Researchers observed that the malicious code changed during the incident, including a case in which Smartsheet\u0026rsquo;s script was cleaned and then reinfected, so a snippet that is clean now may still have served the code on Monday.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker exploited a vulnerability in Optimizely Web Experimentation to insert malicious JavaScript into customer project scripts served to visitors of affected websites.","Report URI found malicious code in 188 Optimizely snippets belonging to 178 organizations, including CNN, the BBC, Zoom, Salesforce, GitLab, IKEA, HSBC, Equifax, Air France-KLM, Ledger, and Peacock.","The malicious payload could replace cryptocurrency wallet addresses with attacker-controlled addresses and later added code to collect submitted card numbers, expiration dates, and CVVs from site forms.","On iPhones and iPads, the code conditionally loaded follow-on scripts associated with the Coruna and DarkSword iOS exploit kits, although researchers reported no confirmed compromise of a physical device.","Optimizely said it removed the malicious code, fixed the vulnerability, secured affected user accounts, and added protections against unauthorized code delivery."],"insights":["The malicious code was delivered through Optimizely’s legitimate cdn.optimizely.com infrastructure and certificate, meaning affected pages could appear to load scripts from a trusted source while still running attacker code.","A clean Optimizely snippet now does not prove it was safe during the incident, because the injected code changed throughout the day and researchers observed a cleanup followed by reinfection on Smartsheet’s script.","The card-data collection code could not read payment details entered through cross-origin hosted payment fields, such as Stripe-hosted fields or Adyen fields, which limited exposure for sites using that design.","The attackers used multiple loader variants, including one that hid its server address with base64 encoding and another that contained a built-in payload if the attacker’s domain was blocked, making simple domain searches or network blocking less reliable."],"referencedReports":[{"title":"World’s Largest Brands Infected With Malware Via Optimizely","url":"https://blog.report-uri.com/worlds-largest-brands-infected-with-malware-via-optimizely/","publisher":"report-uri","context":"Report URI’s technical analysis identified malicious Optimizely snippets across 178 organizations and described the injected loader variants and timeline.","category":"research","primary":true},{"title":"OPTIMJACK: Malicious Web Injection Across CNN, Zoom, Salesforce, Fox and More","url":"https://www.cynet.com/blog/optimjack-malicious-web-injection-across-cnn-zoom-salesforce-fox-and-more/","publisher":"cynet","context":"Cynet’s endpoint investigation traced the malicious loader to Optimizely-hosted files and examined conditional second-stage delivery to emulated iPhone browsers.","category":"research","primary":false},{"title":"OPTIMJACK: Optimizely-Hosted Scripts Crypto Clipper and Card Skimmer Analysis","url":"https://www.stepsecurity.io/blog/optimjack-optimizely-hosted-scripts-crypto-clipper-card-skimmer","publisher":"stepsecurity","context":"StepSecurity’s payload analysis described cryptocurrency-address replacement behavior, card-data collection, and associated indicators.","category":"research","primary":false},{"title":"Optimizely Incident Notice","url":"https://status.optimizely.com/incidents/ftw0fh9wx43z","publisher":"optimizely","context":"Optimizely’s incident notice stated that an attacker exploited a vulnerability in Web Experimentation to add malicious JavaScript to some customer projects.","category":"advisory","primary":true}],"body":"\u003cp\u003eAn attacker exploited a flaw in Optimizely Web Experimentation to add malicious JavaScript to customer project scripts, causing visitors to affected websites to receive the code through legitimate Optimizely snippets. Report URI found malicious code in 188 snippets tied to 178 organizations, including CNN, the BBC, Zoom, Salesforce, GitLab, IKEA, HSBC, Equifax, Air France-KLM, Ledger, and Peacock. Optimizely said it removed the code, fixed the flaw, secured affected user accounts, and added protections against unauthorized code delivery.\u003c/p\u003e\n\n\u003cp\u003eThe payload replaced valid cryptocurrency wallet addresses with attacker-controlled addresses and later added a card skimmer that captured submitted card numbers, expiry dates, and CVVs from site form fields. It also conditionally loaded second-stage code for iPhones and iPads associated with the Coruna and DarkSword iOS exploit kits, although researchers reported no confirmed takeover of a physical device. Researchers observed that the malicious code changed during the incident, including a case in which Smartsheet\u0026rsquo;s script was cleaned and then reinfected, so a snippet that is clean now may still have served the code on Monday.\u003c/p\u003e\n"},{"n":6,"title":"Operation ShadowCloud: cloud service–based backdoors targeting government networks in Asia and Africa. Part 1","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/operation-shadowcloud-gitdoor/122004/","time":"08:00","priority":"SHOULD READ","score":88,"tldr":"Operation ShadowCloud targets government organizations in Asia and Africa using MeshAgent and DLL sideloading to deploy GitDoor and GraphDoor backdoors that hide C2 traffic in GitHub, SharePoint, and Ably. GitDoor can load plugins and shellcode in memory for espionage, credential theft, keylogging, proxying, file operations, and remote command execution.","briefOverview":"\u003cp\u003eKaspersky identified Operation ShadowCloud, an active campaign targeting government-sector organizations in Asia and Africa. The attackers used the legitimate MeshCentral Agent, apparently after reusing an existing network infection, to install malicious components on victim machines. They deployed two new backdoors, GitDoor and GraphDoor, which conceal communications through legitimate cloud services including GitHub, Microsoft SharePoint, and Ably.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used DLL sideloading, pairing trusted executables with malicious loader DLLs and encrypted payload files. The loaders decrypt the payloads and run them directly in memory, while GitDoor uses GitHub repositories to receive commands and upload victim data and command results. GitDoor can download in-memory plug-ins and shellcode for functions including keylogging, screenshots, process listing, file management, proxying, credential dumping, browser-cookie theft, service and task management, and remote command execution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation ShadowCloud targeted government-sector victims in Asia and Africa and used the legitimate MeshCentral Agent to deploy the GitDoor and GraphDoor backdoors.","The attackers used DLL sideloading with legitimate executables and malicious loader DLLs to decrypt encrypted payloads and run the backdoors directly in memory.","GitDoor used GitHub repositories for command retrieval and data uploads, while also sending victim information through the Ably messaging service.","GitDoor could download plug-ins and shellcode that support capabilities including screen capture, process listing, keylogging, file management, proxying, credential dumping, browser-cookie theft, and remote command execution.","The researchers identified multiple GitHub accounts and repositories associated with the operation, with most created between September 2024 and December 2025."],"insights":["GitDoor uses a GitHub issue’s bug label as a communication signal, repeatedly adding or removing the label before retrieving repository contents until it receives an exit command.","The backdoor assigns each compromised host a random eight-character identifier and embeds it in GitHub filenames and Ably channel names, allowing operators to direct commands and collect results for individual victims.","GitDoor encrypts collected information and command results in two layers: AES-256-ECB with a newly generated key, followed by XOR encryption using the target filename as the key.","The loaders execute decrypted payloads from memory through an MZ-header trampoline, avoiding the need to write the final backdoor executable to disk.","Proxy plug-ins exchange configuration and connection state through Windows shared-memory objects named with the infected process ID, including Local\\pc\u003cPID\u003e and Local\\pcs\u003cPID\u003e."],"referencedReports":[{"title":"Bronze Sandcastle deploys modified Meterpreter shells","url":"https://www.sophos.com/en-us/blog/bronze-sandcastle-deploys-modified-meterpreter-shells","publisher":"sophos","context":"The article states that a recent Sophos brief covered a fragment of the Operation ShadowCloud campaign.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky identified Operation ShadowCloud, an active campaign targeting government-sector organizations in Asia and Africa. The attackers used the legitimate MeshCentral Agent, apparently after reusing an existing network infection, to install malicious components on victim machines. They deployed two new backdoors, GitDoor and GraphDoor, which conceal communications through legitimate cloud services including GitHub, Microsoft SharePoint, and Ably.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used DLL sideloading, pairing trusted executables with malicious loader DLLs and encrypted payload files. The loaders decrypt the payloads and run them directly in memory, while GitDoor uses GitHub repositories to receive commands and upload victim data and command results. GitDoor can download in-memory plug-ins and shellcode for functions including keylogging, screenshots, process listing, file management, proxying, credential dumping, browser-cookie theft, service and task management, and remote command execution.\u003c/p\u003e\n"},{"n":7,"title":"Operation ShadowCloud: cloud service–based backdoors targeting government networks in Asia and Africa. Part 2","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/operation-shadowcloud-graphdoor/122005/","time":"08:00","priority":"SHOULD READ","score":88,"tldr":"Operation ShadowCloud uses the GraphDoor backdoor and modular plug-ins to steal data, log keystrokes, capture screenshots, run commands, and create proxy tunnels through legitimate services including Microsoft SharePoint, Microsoft Graph, and Ably. The campaign targets government networks in Asia and Africa and shows possible links to Chinese-speaking groups such as FamousSparrow and CopperTurtle.","briefOverview":"\u003cp\u003eOperation ShadowCloud uses the GraphDoor backdoor against government networks in Asia and Africa. GraphDoor collects system, network, user, and process information, encrypts the data, and uploads it to attacker-controlled SharePoint storage through the Microsoft Graph API. It authenticates as a malicious application using embedded client credentials and disguises uploaded victim data as JavaScript source-map files. The operation uses legitimate cloud services including Microsoft SharePoint, GitHub, and Ably as communication and payload-delivery channels.\u003c/p\u003e\n\n\u003cp\u003eGraphDoor downloads separate plug-ins for screenshots, process listing, and keylogging, and it can retrieve victim-specific command files from SharePoint for execution. Its plug-ins can also create reverse-proxy channels through a modified Erfrp client and Ably messaging services, while the backdoor can obtain connection details without embedding a command-and-control domain. Researchers observed GitDoor and GraphDoor activity in staging locations also used by FamousSparrow and CopperTurtle, but stated that the available evidence does not support definitive attribution. The campaign’s use of cloud APIs and on-demand modules can make malicious traffic resemble normal enterprise cloud activity and allows attackers to update capabilities without modifying host files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GraphDoor collects system and network information, encrypts it, and uploads it to a SharePoint document library through the Microsoft Graph API using credentials for a malicious application.","GraphDoor retrieves plug-ins for screenshot capture, process listing, and keylogging from SharePoint, and it can download and execute victim-specific command files.","The keylogger records keyboard and mouse activity in an XOR-encrypted file at %APPDATA%\\Microsoft\\SystemCertificates\\Cache\\logs.dat.","GraphDoor includes proxy-channel plug-ins based on Erfrp and Ably that can relay network traffic through reverse-proxy and real-time messaging services.","Researchers found GraphDoor and GitDoor deployments in staging directories used by FamousSparrow and CopperTurtle activity, but stated that the evidence is insufficient for definitive attribution."],"insights":["GraphDoor authenticates to Microsoft as an application rather than a user, then uses Microsoft Graph to store encrypted victim data in files disguised as JavaScript source-map files.","The keylogger plug-in is downloaded only when C:\\Users\\analyst\\AppData\\Roaming\\log.lock exists, unlike the screenshot and process-listing plug-ins.","Plug-ins return collected data through a named pipe created by the main backdoor, allowing the main process to reuse a single local communication channel.","GraphDoor has no embedded command-and-control domain; it can obtain connection details through its proxy-channel plug-in or an Ably messaging channel.","The operation uses legitimate SharePoint, GitHub, and Ably services for communications and payload delivery, which the article notes can resemble ordinary enterprise cloud traffic."],"referencedReports":[{"title":"You will always remember this as the day you finally caught FamousSparrow","url":"https://www.welivesecurity.com/en/eset-research/you-will-always-remember-this-as-the-day-you-finally-caught-famoussparrow/","publisher":"eset","context":"The article cites this ESET research as prior identification of the RC4 key used by the FamousSparrow payload.","category":"research","primary":false}],"body":"\u003cp\u003eOperation ShadowCloud uses the GraphDoor backdoor against government networks in Asia and Africa. GraphDoor collects system, network, user, and process information, encrypts the data, and uploads it to attacker-controlled SharePoint storage through the Microsoft Graph API. It authenticates as a malicious application using embedded client credentials and disguises uploaded victim data as JavaScript source-map files. The operation uses legitimate cloud services including Microsoft SharePoint, GitHub, and Ably as communication and payload-delivery channels.\u003c/p\u003e\n\n\u003cp\u003eGraphDoor downloads separate plug-ins for screenshots, process listing, and keylogging, and it can retrieve victim-specific command files from SharePoint for execution. Its plug-ins can also create reverse-proxy channels through a modified Erfrp client and Ably messaging services, while the backdoor can obtain connection details without embedding a command-and-control domain. Researchers observed GitDoor and GraphDoor activity in staging locations also used by FamousSparrow and CopperTurtle, but stated that the available evidence does not support definitive attribution. The campaign’s use of cloud APIs and on-demand modules can make malicious traffic resemble normal enterprise cloud activity and allows attackers to update capabilities without modifying host files.\u003c/p\u003e\n"},{"n":2,"title":"Uber notifies drivers of data breach affecting nearly 150,000 people","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/uber-notifies-drivers-of-data-breach-affecting-nearly-150-000-people/","time":"08:35","priority":"SHOULD READ","score":84,"tldr":"Uber is notifying 149,346 drivers that names, addresses, dates of birth, and driver’s license numbers were exposed after attackers used compromised Fireworks AI credentials to access Uber data. The incident stems from Fireworks’ October breach, which also affected other customers including Cursor and Notion.","briefOverview":"\u003cp\u003eUber is notifying nearly 150,000 drivers that an unauthorized party accessed their personal information through a third-party service provider. A filing with the Maine Office of the Attorney General says 149,346 drivers were affected. The exposed data included names, driver’s license numbers, dates of birth, and addresses.\u003c/p\u003e\n\n\u003cp\u003eUber said the provider reported compromised internal credentials on October 9, 2026, and its investigation determined on October 13 that those credentials had been used to access Uber data connected to the provider. Uber severed data connections with the provider and launched an investigation after being notified. TechCrunch reported that the provider was Fireworks, whose security incident was attributed to a financially motivated group linked to large-language-model hijacking activity; the Fireworks breach also affected Cursor and Notion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Uber is notifying nearly 150,000 drivers after unauthorized actors accessed Uber data through compromised credentials at a third-party service provider.","A filing with the Maine Office of the Attorney General states that 149,346 drivers had names, driver’s license numbers, dates of birth, and addresses exposed.","Uber said the service provider reported the credential compromise on October 9, 2026, and Uber determined on October 13 that the unauthorized party had accessed its data.","Uber severed data connections with the provider and launched an investigation after learning of the incident.","TechCrunch reported that the incident stemmed from an October security breach at AI training provider Fireworks, which said the attack was linked to a financially motivated group associated with LLMjacking attacks."],"insights":["The incident illustrates that a compromise at a service provider can expose highly sensitive records held by multiple customers, as Fireworks’ breach was also linked to incidents at Cursor and Notion.","The exposed Uber driver information included driver’s license numbers alongside names, addresses, and dates of birth, making the affected records more sensitive than basic contact information alone.","Uber responded by immediately cutting data connections to the service provider, showing that isolating a compromised third-party connection was part of its containment effort.","Fireworks attributed its breach to a financially motivated group associated with large-language-model hijacking activity, linking the Uber incident to a broader pattern of attacks involving AI-service providers."],"referencedReports":[],"body":"\u003cp\u003eUber is notifying nearly 150,000 drivers that an unauthorized party accessed their personal information through a third-party service provider. A filing with the Maine Office of the Attorney General says 149,346 drivers were affected. The exposed data included names, driver’s license numbers, dates of birth, and addresses.\u003c/p\u003e\n\n\u003cp\u003eUber said the provider reported compromised internal credentials on October 9, 2026, and its investigation determined on October 13 that those credentials had been used to access Uber data connected to the provider. Uber severed data connections with the provider and launched an investigation after being notified. TechCrunch reported that the provider was Fireworks, whose security incident was attributed to a financially motivated group linked to large-language-model hijacking activity; the Fireworks breach also affected Cursor and Notion.\u003c/p\u003e\n"},{"n":1,"title":"Ransomware affiliate suspect extradited to US, faces 27 years in prison","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/alleged-inc-lynx-ransomware-affiliate-extradited-to-us-faces-27-years-in-prison/","time":"07:25","priority":"SHOULD READ","score":78,"tldr":"Kazakh national Roman Khlynovskiy was extradited from Italy to the U.S. over allegations that, as part of the 8-Digits Team affiliated with INC Ransom and Lynx, he helped extort U.S. schools and healthcare organizations. Prosecutors say the group stole more than 50 TB of data including 70 million health records and made over $500 million in ransom demands; he faces up to 27 years if convicted.","briefOverview":"\u003cp\u003eKazakh national Roman Khlynovskiy, 43, was extradited from Italy to the United States to face charges related to alleged ransomware-driven data extortion against U.S. schools, hospitals, and healthcare entities. Prosecutors allege that he was a member of the 8-Digits Team, which was affiliated with the INC Ransom and Lynx ransomware operations. He faces up to 27 years in prison if convicted of charges including conspiracy to commit computer fraud, identity theft, wire fraud, extortion, money laundering, and threats to disclose non-consensual intimate images.\u003c/p\u003e\n\n\u003cp\u003eAccording to the U.S. Department of Justice, the alleged conspirators stole data from compromised networks and threatened to publish it unless victims paid ransoms. They claimed to possess more than 50 terabytes of data containing over 70 million confidential health records, and their ransom demands exceeded $500 million. The article also notes that Lynx, which emerged in July 2024, is believed to be a rebrand of INC Ransom based on similarities in encryptors and code analysis.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kazakh national Roman Khlynovskiy was extradited from Italy to the United States over allegations that he participated in ransomware attacks targeting U.S. schools, hospitals, and healthcare entities.","Khlynovskiy allegedly belonged to the 8-Digits Team, which was affiliated with the INC Ransom and Lynx ransomware operations.","The U.S. Department of Justice said the conspirators claimed to possess more than 50 terabytes of data containing over 70 million confidential health records and made more than $500 million in ransom demands.","If convicted of the listed computer fraud, identity theft, wire fraud, extortion, money laundering, and intimate-image disclosure threat charges, Khlynovskiy faces up to 27 years in prison.","Lynx ransomware, which appeared in July 2024, is believed to be a rebrand of INC Ransom and has listed more than 400 victims on its dark-web leak site."],"insights":["The alleged scheme relied on stolen data rather than encryption alone: the conspirators reportedly threatened to publish confidential files to pressure victims into paying.","The group’s claimed cache of more than 70 million health records illustrates how a single criminal operation can aggregate sensitive information from multiple healthcare-related victims.","Lynx may represent continuity rather than a wholly separate operation, as reporting cited shared encryptor characteristics and string-analysis similarities with INC Ransom.","The alleged targeting extended across schools, hospitals, and healthcare entities in at least six U.S. states, showing that the same extortion activity affected both education and health services."],"referencedReports":[],"body":"\u003cp\u003eKazakh national Roman Khlynovskiy, 43, was extradited from Italy to the United States to face charges related to alleged ransomware-driven data extortion against U.S. schools, hospitals, and healthcare entities. Prosecutors allege that he was a member of the 8-Digits Team, which was affiliated with the INC Ransom and Lynx ransomware operations. He faces up to 27 years in prison if convicted of charges including conspiracy to commit computer fraud, identity theft, wire fraud, extortion, money laundering, and threats to disclose non-consensual intimate images.\u003c/p\u003e\n\n\u003cp\u003eAccording to the U.S. Department of Justice, the alleged conspirators stole data from compromised networks and threatened to publish it unless victims paid ransoms. They claimed to possess more than 50 terabytes of data containing over 70 million confidential health records, and their ransom demands exceeded $500 million. The article also notes that Lynx, which emerged in July 2024, is believed to be a rebrand of INC Ransom based on similarities in encryptors and code analysis.\u003c/p\u003e\n"},{"n":3,"title":"Court clears brothers of $25 million Ethereum crypto heist charges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/court-clears-brothers-of-25-million-ethereum-crypto-heist-charges/","time":"09:44","priority":"MAY READ","score":72,"tldr":"A U.S. federal judge acquitted two MIT-educated brothers accused of taking $25 million in cryptocurrency through an Ethereum MEV-Boost relay exploit, finding prosecutors did not prove the material misrepresentations required for wire-fraud convictions.","briefOverview":"\u003cp\u003eU.S. District Judge Jessica Clarke acquitted brothers Anton Peraire-Bueno and James Peraire-Bueno of charges connected to an alleged $25 million cryptocurrency theft. The ruling followed a mistrial one year earlier, when jurors could not agree on a verdict. The brothers had been arrested in May 2024 on wire fraud and money laundering charges and faced up to 20 years in prison on each count if convicted.\u003c/p\u003e\n\n\u003cp\u003eThe judge found that the government had not proved the brothers made material misrepresentations required for wire fraud and related convictions. Prosecutors alleged that the brothers exploited a flaw in MEV-Boost relay code to see a proposed Ethereum block before it was normally released, then reordered its transactions to obtain cryptocurrency from traders. They also alleged the brothers used bait transactions to identify targets and moved assets through multiple cryptocurrency addresses, foreign exchanges, and shell companies to conceal their source and ownership.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. District Judge Jessica Clarke entered judgments of acquittal for Anton Peraire-Bueno and James Peraire-Bueno, who had been charged over an alleged $25 million cryptocurrency theft.","The judge ruled that the government failed to prove the brothers made material misrepresentations, an element required for the wire fraud and related convictions at issue.","The acquittal followed a mistrial one year earlier, when jurors could not reach a verdict in the case.","Prosecutors alleged that the brothers exploited a weakness in MEV-Boost relay code to obtain the contents of a proposed Ethereum block early and reorder transactions to take cryptocurrency from traders.","The brothers were arrested in May 2024 and had faced wire fraud and money laundering charges that could have carried up to 20 years in prison per count if convicted."],"insights":["The court’s ruling did not determine whether the brothers’ conduct was moral or potentially violated other uncharged laws; it found only that the evidence did not support the specific wire-fraud and related charges presented.","The alleged theft depended on obtaining the full contents of a proposed Ethereum block before normal release and then changing the transaction order, showing that transaction sequencing was central to the scheme described by prosecutors.","Prosecutors alleged the brothers used bait transactions before the incident to identify traders whose trading behavior could be targeted.","The case had already produced a mistrial, indicating that jurors previously could not agree on whether the alleged conduct met the charged criminal standards."],"referencedReports":[],"body":"\u003cp\u003eU.S. District Judge Jessica Clarke acquitted brothers Anton Peraire-Bueno and James Peraire-Bueno of charges connected to an alleged $25 million cryptocurrency theft. The ruling followed a mistrial one year earlier, when jurors could not agree on a verdict. The brothers had been arrested in May 2024 on wire fraud and money laundering charges and faced up to 20 years in prison on each count if convicted.\u003c/p\u003e\n\n\u003cp\u003eThe judge found that the government had not proved the brothers made material misrepresentations required for wire fraud and related convictions. Prosecutors alleged that the brothers exploited a flaw in MEV-Boost relay code to see a proposed Ethereum block before it was normally released, then reordered its transactions to obtain cryptocurrency from traders. They also alleged the brothers used bait transactions to identify targets and moved assets through multiple cryptocurrency addresses, foreign exchanges, and shell companies to conceal their source and ownership.\u003c/p\u003e\n"},{"n":8,"title":"Health-ISAC Daily Cyber Headlines – November 17, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-17-2026/","time":"09:56","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s November 17, 2026 daily roundup highlights risks including malicious code delivered through Optimizely, an Infoblox vendor breach, AI-assisted markets for stolen access, and healthcare-sector extortion.","briefOverview":"\u003cp\u003eHealth-ISAC published its Daily Cyber Headlines roundup for November 17, 2026. The roundup covers malicious code delivered through Optimizely and a vendor breach involving Infoblox. It also addresses an AI-assisted market for stolen access and risks involving Telegram widgets.\u003c/p\u003e\n\n\u003cp\u003eAdditional topics include a prosecution related to health-sector extortion, proposed AI liability relief, and federal health-breach trends. The article presents these items as part of its daily coverage of cybersecurity issues relevant to the health sector. Related links include coverage of a cyberattack on a French blood bank, Microsoft 365 outages, ransomware, AI adversaries, and cyber risks in autonomous medical robots.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC published its Daily Cyber Headlines roundup on November 17, 2026.","The roundup covers malicious code delivered through Optimizely and a vendor breach involving Infoblox.","It includes AI-assisted markets for stolen access, a health-sector extortion prosecution, and risks involving Telegram widgets.","The roundup also addresses proposed AI liability relief and federal health breach trends."],"insights":["The roundup connects technology-platform risks, including Optimizely and Telegram widgets, with consequences for the health sector and health-data breaches.","The topics extend beyond individual technical incidents to include legal and policy developments, such as an extortion prosecution and proposed AI liability relief."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC published its Daily Cyber Headlines roundup for November 17, 2026. The roundup covers malicious code delivered through Optimizely and a vendor breach involving Infoblox. It also addresses an AI-assisted market for stolen access and risks involving Telegram widgets.\u003c/p\u003e\n\n\u003cp\u003eAdditional topics include a prosecution related to health-sector extortion, proposed AI liability relief, and federal health-breach trends. The article presents these items as part of its daily coverage of cybersecurity issues relevant to the health sector. Related links include coverage of a cyberattack on a French blood bank, Microsoft 365 outages, ransomware, AI adversaries, and cyber risks in autonomous medical robots.\u003c/p\u003e\n"},{"n":5,"title":"Ask and Assess: Get App and MCP Server Risk Intelligence in Chat","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/ask-and-assess-get-app-and-mcp-server-risk-intelligence-in-chat","time":"08:01","priority":"MAY READ","score":35,"tldr":"Netskope is promoting its CCI Insights Agent, an AgentSkope-integrated conversational tool that helps analysts assess cloud applications and MCP servers using App Catalog data and public-source research. The product aims to speed AI application approvals, risk assessments, and policy decisions.","briefOverview":"\u003cp\u003eNetskope introduced CCI Insights Agent, a conversational tool for researching the risk of applications and Model Context Protocol (MCP) servers. The company positions it as part of Netskope One AgentSkope and makes it available within the Netskope App Catalog. It is intended to help security analysts move from risk questions to approval, policy, or governance decisions more quickly.\u003c/p\u003e\n\n\u003cp\u003eThe article cites Netskope Threat Labs’ 2026 AI Report, which says that more than 95% of organizations use AI chatbots, 92% use AI platforms, and MCP transactions increased 375% between April and June 2026. CCI Insights Agent can retrieve information on more than 86,000 cloud, firewall, and AI applications and over 1,100 MCP servers, with public-source research added when needed. It accepts natural-language questions, can provide ranked and exportable datasets with Cloud Confidence Index and Cloud Confidence Level scores, and retains conversational context for follow-up investigation. Netskope says analysts can deploy the agent through the AgentSkope Marketplace using shared capacity credits.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Netskope Threat Labs’ 2026 AI Report states that more than 95% of organizations use AI chatbots and 92% use AI platforms, while MCP transactions increased 375% over a ten-week period between April and June 2026.","Netskope CCI Insights Agent is a conversational tool in the Netskope App Catalog that helps analysts research application and MCP server risk using natural-language questions.","The agent retrieves information on more than 86,000 cloud, firewall, and AI applications and more than 1,100 Model Context Protocol servers, and can add relevant public information when needed.","The agent retains conversation context so analysts can refine prior results, compare alternatives, validate assumptions, and investigate follow-up questions without rebuilding their research trail.","Netskope says the agent is available through the AgentSkope Marketplace and is intended to accelerate AI approvals, risk assessments, and policy decisions."],"insights":["The article identifies specialized App Catalog query knowledge as a workflow bottleneck because approvals can depend on a small number of senior analysts who know the required syntax and catalog structure.","By retaining context across follow-up questions, the agent is intended to preserve an analyst’s investigative trail rather than requiring repeated searches as the scope of an assessment changes.","For broader investigations, the agent can provide ranked, exportable datasets with Netskope Cloud Confidence Index and Cloud Confidence Level scores, which can support comparisons during governance and approval reviews.","The reported 375% increase in MCP transactions over ten weeks illustrates that the review workload is expanding beyond conventional cloud applications to include AI-connected services."],"referencedReports":[],"body":"\u003cp\u003eNetskope introduced CCI Insights Agent, a conversational tool for researching the risk of applications and Model Context Protocol (MCP) servers. The company positions it as part of Netskope One AgentSkope and makes it available within the Netskope App Catalog. It is intended to help security analysts move from risk questions to approval, policy, or governance decisions more quickly.\u003c/p\u003e\n\n\u003cp\u003eThe article cites Netskope Threat Labs’ 2026 AI Report, which says that more than 95% of organizations use AI chatbots, 92% use AI platforms, and MCP transactions increased 375% between April and June 2026. CCI Insights Agent can retrieve information on more than 86,000 cloud, firewall, and AI applications and over 1,100 MCP servers, with public-source research added when needed. It accepts natural-language questions, can provide ranked and exportable datasets with Cloud Confidence Index and Cloud Confidence Level scores, and retains conversational context for follow-up investigation. Netskope says analysts can deploy the agent through the AgentSkope Marketplace using shared capacity credits.\u003c/p\u003e\n"}]</script>
