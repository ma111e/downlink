<script type="application/json" id="dl-articles">[{"n":1,"title":"New CrashStealer malware poses as Apple crash reporting tool","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-crashstealer-malware-poses-as-apple-crash-reporting-tool/","time":"19:04","priority":"SHOULD READ","score":85,"tldr":"A new macOS infostealer called CrashStealer is impersonating Apple’s CrashReporter tool and using a signed, notarized installer to bypass Gatekeeper and trick users into entering their password. It steals Keychain data, browser credentials, password manager data, crypto wallets, and files before encrypting and exfiltrating them to its C2 server.","briefOverview":"\u003cp\u003eA new macOS information-stealing malware called CrashStealer is pretending to be Apple’s crash-reporting tool to steal credentials, Keychain data, and cryptocurrency wallets. Researchers began tracking it in May while it appeared to still be in development, and observed it being used in attacks in early July. The malware’s binary uses the name “CrashReporter.app,” creates a LaunchAgent named “com.apple.crashreporter.helper,” and uses the legitimate tool’s icon and metadata to look like an Apple component.\u003c/p\u003e\n\n\u003cp\u003eJamf researchers say CrashStealer is delivered through a signed and Apple-notarized installer called “Werkbit Setup,” which allows it to bypass macOS Gatekeeper without warnings. When launched, it displays a fake macOS password prompt and validates the entered password locally using the dscl command-line tool. CrashStealer targets browser credentials and cookies, more than 80 cryptocurrency wallet extensions, 14 password managers, and files from user directories such as Documents and Downloads.\u003c/p\u003e\n\n\u003cp\u003eBefore exfiltrating stolen data, CrashStealer encrypts it with AES-256-GCM, packages it into hidden ZIP archives, and uploads it to a command-and-control server using libcurl. Jamf says CrashStealer is distinct from other infostealer families because of its client-side encryption mechanism and native C++ implementation. The campaign uses a fake software site registered in late June, with downloads gated behind a meeting PIN, and Jamf’s report provides indicators of compromise including malicious tool names, hashes, delivery infrastructure, and filesystem artifacts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrashStealer is a new macOS information-stealing malware that impersonates Apple's CrashReporter.app to steal credentials, Keychain data, and cryptocurrency wallets.","Jamf researchers reported that CrashStealer is delivered through a signed and Apple-notarized installer called “Werkbit Setup,” allowing it to bypass macOS Gatekeeper without warnings.","When launched, CrashStealer shows a fake macOS password prompt and validates the entered password locally using the dscl command-line tool.","CrashStealer targets browser credentials and cookies, more than 80 cryptocurrency wallet extensions, 14 password managers, and files from user directories such as Documents and Downloads.","Before exfiltration, CrashStealer encrypts stolen data with AES-256-GCM, packages it into hidden ZIP archives, and uploads it to a command-and-control server using libcurl."],"insights":["CrashStealer’s signed and Apple-notarized installer shows that macOS Gatekeeper may not warn users even when the delivered application is malicious.","The fake software site requires a meeting PIN before downloading the payload, which Jamf says indicates the campaign is limited to visitors who provide the right code.","CrashStealer re-signs itself for persistence, rewriting code-signature data so the binary’s hash changes even though the code remains untouched.","Jamf highlighted CrashStealer as distinct from other macOS infostealers because it uses client-side AES-256-GCM encryption and is implemented natively in C++."],"referencedReports":[{"title":"CrashStealer macOS Infostealer Analysis","url":"https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/","publisher":"Jamf","context":"The article cites Jamf's analysis and report for details on CrashStealer’s targeted data, behavior, delivery infrastructure, filesystem artifacts, and indicators of compromise.","category":"","primary":false}],"body":"\u003cp\u003eA new macOS information-stealing malware called CrashStealer is pretending to be Apple’s crash-reporting tool to steal credentials, Keychain data, and cryptocurrency wallets. Researchers began tracking it in May while it appeared to still be in development, and observed it being used in attacks in early July. The malware’s binary uses the name “CrashReporter.app,” creates a LaunchAgent named “com.apple.crashreporter.helper,” and uses the legitimate tool’s icon and metadata to look like an Apple component.\u003c/p\u003e\n\n\u003cp\u003eJamf researchers say CrashStealer is delivered through a signed and Apple-notarized installer called “Werkbit Setup,” which allows it to bypass macOS Gatekeeper without warnings. When launched, it displays a fake macOS password prompt and validates the entered password locally using the dscl command-line tool. CrashStealer targets browser credentials and cookies, more than 80 cryptocurrency wallet extensions, 14 password managers, and files from user directories such as Documents and Downloads.\u003c/p\u003e\n\n\u003cp\u003eBefore exfiltrating stolen data, CrashStealer encrypts it with AES-256-GCM, packages it into hidden ZIP archives, and uploads it to a command-and-control server using libcurl. Jamf says CrashStealer is distinct from other infostealer families because of its client-side encryption mechanism and native C++ implementation. The campaign uses a fake software site registered in late June, with downloads gated behind a meeting PIN, and Jamf’s report provides indicators of compromise including malicious tool names, hashes, delivery infrastructure, and filesystem artifacts.\u003c/p\u003e\n"},{"n":2,"title":"Hackers backdoor Jscrambler npm package with infostealer malware","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-backdoor-jscrambler-npm-package-with-infostealer-malware/","time":"19:44","priority":"SHOULD READ","score":84,"tldr":"Jscrambler disclosed that attackers used compromised npm publishing credentials to release malicious versions of its package containing infostealer malware, resulting in about 1,500 downloads before removal. Developers who installed the affected versions should treat their environments as compromised, rotate secrets, and update to the latest safe release.","briefOverview":"\u003cp\u003eJscrambler disclosed that a threat actor published malicious versions of its jscrambler npm package, which is used with the company’s Code Integrity product. The affected releases were 8.14, 8.16, 8.17, and 8.20, and they included information-stealing malware that executed during the preinstall hook. Jscrambler said the incident was limited to that package and did not affect other products, including Webpage Integrity.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package remained available for about two hours before Jscrambler deprecated it and released safe version 8.22. npm statistics showed that the malicious package was downloaded 1,479 times during that window. The affected package was also a dependency for four other Jscrambler packages, which the company deprecated and replaced with new versions.\u003c/p\u003e\n\n\u003cp\u003eSocket detected and analyzed the compromise, reporting that the malware targeted source code, developer credentials, cloud credentials, AI coding tool configurations, cryptocurrency wallets, browser data, and messaging apps. Socket also reported that the malware used strong per-string obfuscation with the ChaCha20-Poly1305 encryption algorithm, making the code difficult to reverse-engineer. Jscrambler said the compromise was possible because of compromised npm publishing credentials, which it revoked, and advised affected developers to treat their environments as compromised, rotate all secrets, and restore from safe backups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jscrambler disclosed that a threat actor published malicious versions of its jscrambler npm package used with the company’s Code Integrity product.","The malicious releases, versions 8.14, 8.16, 8.17, and 8.20, included information-stealing malware that executed during the preinstall hook.","The malicious package remained available for about two hours, was downloaded 1,479 times, and was replaced by safe version 8.22.","Socket reported that the malware targeted source code, developer secrets, cloud credentials, AI coding tool configurations, cryptocurrency wallets, browser data, and messaging app data.","Jscrambler said the incident was caused by compromised npm publishing credentials, which it revoked, and advised affected developers to treat environments as compromised and rotate all secrets."],"insights":["The malicious package was live for only two hours but still reached 1,479 downloads, showing how quickly a compromised npm package can spread through developer environments.","Because the compromised package was also a dependency for four other Jscrambler packages, users could have been exposed even if they installed one of those related packages rather than the main jscrambler package directly.","The malware targeted a broad mix of developer, cloud, browser, messaging, AI coding tool, and cryptocurrency data, so Jscrambler’s guidance to rotate all secrets is more practical than trying to identify only one affected credential type.","Socket reported that the malware used ChaCha20-Poly1305 per-string obfuscation, making analysis harder even though the package was removed quickly."],"referencedReports":[{"title":"Security Advisory: Malicious npm Package","url":"http://jscrambler.com/blog/security-advisory-malicious-npm-package","publisher":"Jscrambler","context":"The article cites Jscrambler’s warning about the unauthorized publication of malicious versions of its npm package and the company’s response.","category":"","primary":false},{"title":"Jscrambler Supply Chain Attack","url":"https://socket.dev/blog/jscrambler-supply-chain-attack","publisher":"Socket","context":"The article references Socket’s analysis of the compromised Jscrambler npm release, including the types of data targeted and the malware’s obfuscation technique.","category":"","primary":false}],"body":"\u003cp\u003eJscrambler disclosed that a threat actor published malicious versions of its jscrambler npm package, which is used with the company’s Code Integrity product. The affected releases were 8.14, 8.16, 8.17, and 8.20, and they included information-stealing malware that executed during the preinstall hook. Jscrambler said the incident was limited to that package and did not affect other products, including Webpage Integrity.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package remained available for about two hours before Jscrambler deprecated it and released safe version 8.22. npm statistics showed that the malicious package was downloaded 1,479 times during that window. The affected package was also a dependency for four other Jscrambler packages, which the company deprecated and replaced with new versions.\u003c/p\u003e\n\n\u003cp\u003eSocket detected and analyzed the compromise, reporting that the malware targeted source code, developer credentials, cloud credentials, AI coding tool configurations, cryptocurrency wallets, browser data, and messaging apps. Socket also reported that the malware used strong per-string obfuscation with the ChaCha20-Poly1305 encryption algorithm, making the code difficult to reverse-engineer. Jscrambler said the compromise was possible because of compromised npm publishing credentials, which it revoked, and advised affected developers to treat their environments as compromised, rotate all secrets, and restore from safe backups.\u003c/p\u003e\n"},{"n":5,"title":"VPN service favored by ransomware groups is sanctioned by US","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/first-vpn-administrator-us-sanctions-ransomware-groups","time":"18:50","priority":"SHOULD READ","score":82,"tldr":"The U.S. sanctioned First VPN Service and its Ukrainian administrator for helping ransomware gangs hide their identities and infrastructure while attacking U.S. critical sectors. A Belarusian seller of malware-obfuscation tools was also sanctioned as part of a broader effort to disrupt cybercrime service providers.","briefOverview":"\u003cp\u003eThe U.S. government sanctioned First VPN Service and its Ukrainian administrator, Dmytro Rashevskyi, for abetting ransomware gangs behind attacks on American municipalities, hospitals, schools, and businesses. The Treasury Department said 1VPNS helped ransomware groups hide their identities, disguise malicious software, and evade detection. It said those attacks caused billions of dollars in losses to U.S. critical infrastructure providers.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions mean no one in the U.S. can complete transactions with the designees, and the article notes that sanctions are also a reputational blow that often leads to lower business revenues. A Belarusian national, Yegeniy Vladimirovich Silayev, was also designated for allegedly selling cryptors, which are methods used to make malware harder to detect by cloaking it as harmless files. European law enforcement agencies and the FBI took down First VPN in May, saying the service had historically been used by cybercriminals to hide fraud, ransomware attacks, and other illegal activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. government sanctioned First VPN Service and its Ukrainian administrator, Dmytro Rashevskyi, for abetting ransomware gangs behind attacks on American municipalities, hospitals, schools, and businesses.","The Treasury Department said First VPN Service helped ransomware groups hide their identities, disguise malicious software, and evade detection, enabling attacks that caused billions of dollars in losses to U.S. critical infrastructure providers.","The Treasury Department said Rashevskyi used fake identities to buy infrastructure from companies that might otherwise refuse to do business with him due to abuse complaints tied to 1VPNS servers.","Belarusian national Yegeniy Vladimirovich Silayev was also designated for allegedly selling cryptors, which are methods used to make malware harder to detect by cloaking it as harmless files.","European law enforcement agencies and the FBI took down First VPN in May, saying the service had historically been used by cybercriminals to hide fraud, ransomware attacks, and other illegal activity."],"insights":["The sanctions focus on the support ecosystem around ransomware, not only the operators, because the Treasury said disrupting service providers and tool suppliers can affect many gangs at once.","First VPN marketed its refusal to keep logs or cooperate with law enforcement as a selling point, showing that noncooperation itself was used to attract criminal customers.","Rashevskyi’s alleged use of fake identities to buy infrastructure highlights that abuse complaints from internet service providers can make hosting access harder for criminal services.","The sanctions may harm the designees beyond legal restrictions because the article notes that sanctions are a reputational blow that often leads to lower business revenues."],"referencedReports":[],"body":"\u003cp\u003eThe U.S. government sanctioned First VPN Service and its Ukrainian administrator, Dmytro Rashevskyi, for abetting ransomware gangs behind attacks on American municipalities, hospitals, schools, and businesses. The Treasury Department said 1VPNS helped ransomware groups hide their identities, disguise malicious software, and evade detection. It said those attacks caused billions of dollars in losses to U.S. critical infrastructure providers.\u003c/p\u003e\n\n\u003cp\u003eThe sanctions mean no one in the U.S. can complete transactions with the designees, and the article notes that sanctions are also a reputational blow that often leads to lower business revenues. A Belarusian national, Yegeniy Vladimirovich Silayev, was also designated for allegedly selling cryptors, which are methods used to make malware harder to detect by cloaking it as harmless files. European law enforcement agencies and the FBI took down First VPN in May, saying the service had historically been used by cybercriminals to hide fraud, ransomware attacks, and other illegal activity.\u003c/p\u003e\n"},{"n":3,"title":"Japan's largest taxi operator shuts systems after cyberattack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/japans-largest-taxi-operator-shuts-systems-after-cyberattack/","time":"20:18","priority":"SHOULD READ","score":78,"tldr":"Japan’s largest taxi operator, Nihon Kotsu, shut down parts of its systems after a malware-related cyberattack disrupted dispatch, reservations, web booking, and other services. The company is investigating whether data was leaked and has advised customers to watch for suspicious messages impersonating it.","briefOverview":"\u003cp\u003eJapan’s largest taxi and chauffeur operator by group revenue, Nihon Kotsu, said its internal systems were subjected to unauthorized external access involving a malware infection. The incident occurred early Saturday morning over the weekend and forced the company to shut down part of its infrastructure. Nihon Kotsu has annual revenue of roughly $1 billion, employs 18,228 people, and operates 8,558 taxis and more than two thousand chauffeur vehicles.\u003c/p\u003e\n\n\u003cp\u003eThe attack disrupted operations including the company’s taxi dispatch system, which remained offline as of the article’s publication. Car hire, web booking, reservation management, the telephone dispatch service, and some internal systems were also unavailable. The company advised people seeking its car services to use the GO taxi app or visit a nearby taxi stand to book a Nihon Kotsu vehicle.\u003c/p\u003e\n\n\u003cp\u003eNihon Kotsu said its “labor taxi” service for pregnant women close to giving birth was suspended in Tokyo, Musashino City, Mitaka City, Tachikawa, Yokohama, and Saitama. The company has engaged external cybersecurity experts to help investigate and recover systems, and it is looking into whether data was leaked, though no leak had been confirmed. Customers were advised not to open suspicious attachments or click links in messages claiming to come from the company, and no ransomware or extortion group had claimed responsibility at the time of writing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Japan’s largest taxi and chauffeur operator by group revenue, Nihon Kotsu, said its internal systems were compromised by unauthorized external access involving a malware infection.","The incident occurred early Saturday morning and led the company to disconnect systems to prevent further damage.","Nihon Kotsu said car hire, web booking, reservation management, telephone dispatch, and some internal systems remain unavailable.","The company said its labor taxi service for pregnant women close to giving birth is suspended in Tokyo, Musashino City, Mitaka City, Tachikawa, Yokohama, and Saitama.","Nihon Kotsu has engaged external cybersecurity experts, is investigating whether data was leaked, and said no ransomware or extortion group had claimed responsibility at the time of writing."],"insights":["The attack affected customer-facing transportation access directly, including dispatch and booking, rather than being limited to back-office systems.","Nihon Kotsu’s advice to use the GO taxi app or visit taxi stands shows the company still has alternative ways for customers to access some taxi services while its own systems are offline.","The suspension of the labor taxi service highlights that the outage affects time-sensitive users, including pregnant women close to giving birth in several service areas.","The company specifically warned customers about suspicious messages claiming to come from Nihon Kotsu, indicating impersonation attempts are a concern during the incident even though no data leak has been confirmed."],"referencedReports":[],"body":"\u003cp\u003eJapan’s largest taxi and chauffeur operator by group revenue, Nihon Kotsu, said its internal systems were subjected to unauthorized external access involving a malware infection. The incident occurred early Saturday morning over the weekend and forced the company to shut down part of its infrastructure. Nihon Kotsu has annual revenue of roughly $1 billion, employs 18,228 people, and operates 8,558 taxis and more than two thousand chauffeur vehicles.\u003c/p\u003e\n\n\u003cp\u003eThe attack disrupted operations including the company’s taxi dispatch system, which remained offline as of the article’s publication. Car hire, web booking, reservation management, the telephone dispatch service, and some internal systems were also unavailable. The company advised people seeking its car services to use the GO taxi app or visit a nearby taxi stand to book a Nihon Kotsu vehicle.\u003c/p\u003e\n\n\u003cp\u003eNihon Kotsu said its “labor taxi” service for pregnant women close to giving birth was suspended in Tokyo, Musashino City, Mitaka City, Tachikawa, Yokohama, and Saitama. The company has engaged external cybersecurity experts to help investigate and recover systems, and it is looking into whether data was leaked, though no leak had been confirmed. Customers were advised not to open suspicious attachments or click links in messages claiming to come from the company, and no ransomware or extortion group had claimed responsibility at the time of writing.\u003c/p\u003e\n"},{"n":4,"title":"EU leaders eye social media ban for children under age 13","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/eu-proposed-social-media-ban-kids-under-13","time":"20:50","priority":"MAY READ","score":55,"tldr":"European Commission President Ursula von der Leyen is considering an EU-wide minimum age of 13 for unsupervised social media use, citing concerns over children’s mental health and online safety. Several EU countries are already pursuing stricter rules, and platforms may be required to prove their services are safe and age-appropriate for teenagers.","briefOverview":"\u003cp\u003eEuropean Commission President Ursula von der Leyen said the European Commission should impose a social media “start date” of age 13 for children. She told the Financial Times she is considering a harmonized EU-wide delay to social media for children under 13 who are not under the supervision of a caregiver. In a separate statement, she said there is already a consensus that there needs to be a start date for the age children can join social media.\u003c/p\u003e\n\n\u003cp\u003eVon der Leyen envisions gradual access for children once they turn 13, depending on proof from platforms that their services are age-appropriate and safe for teenagers. The announcement comes as several EU member states are pressing lawmakers to act quickly on what they see as a major threat to children’s safety. France, Spain and Greece are among the countries that have already imposed their own bans or are working with their legislatures to do so quickly.\u003c/p\u003e\n\n\u003cp\u003eVon der Leyen said European children spend an average of four to six hours a day watching a screen, adding that six hours every day adds up to twenty years of their life. She called on platform architects to prove their services cause no harm, comparing that expectation to requiring car manufacturers to provide seatbelts and air bags. The article notes that the proposed age-13 threshold may not satisfy critics in member countries seeking bans for children age 15 and under, and that most platforms already require users to be over age 12 but those restrictions have been easily sidestepped without force of law.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["European Commission President Ursula von der Leyen said she is considering a harmonized EU-wide delay to social media for children under age 13 who are not under the supervision of a caregiver.","Von der Leyen said children could receive gradual access once they turn 13, depending on proof from platforms that their services are age-appropriate and safe for teenagers.","Several EU countries, including France, Spain and Greece, have already imposed their own bans or are working with their legislatures to do so quickly.","Von der Leyen said European children spend an average of four to six hours a day watching a screen.","Most social media platforms already require users to be over age 12, but the article says those restrictions have been easily sidestepped without force of law."],"insights":["The proposed EU-wide age threshold may not satisfy some member states because the article says several governments are seeking bans for children age 15 and under.","Von der Leyen’s proposal would shift responsibility toward social media platforms by requiring them to prove their services are age-appropriate and safe for teenagers before children receive broader access.","The article highlights a gap between platform rules and enforceable law, noting that most platforms already set a minimum age above 12 but those limits have been easily bypassed.","The proposal distinguishes between unsupervised access and caregiver-supervised access, indicating that the contemplated restriction is not described as an absolute ban for every child under 13."],"referencedReports":[],"body":"\u003cp\u003eEuropean Commission President Ursula von der Leyen said the European Commission should impose a social media “start date” of age 13 for children. She told the Financial Times she is considering a harmonized EU-wide delay to social media for children under 13 who are not under the supervision of a caregiver. In a separate statement, she said there is already a consensus that there needs to be a start date for the age children can join social media.\u003c/p\u003e\n\n\u003cp\u003eVon der Leyen envisions gradual access for children once they turn 13, depending on proof from platforms that their services are age-appropriate and safe for teenagers. The announcement comes as several EU member states are pressing lawmakers to act quickly on what they see as a major threat to children’s safety. France, Spain and Greece are among the countries that have already imposed their own bans or are working with their legislatures to do so quickly.\u003c/p\u003e\n\n\u003cp\u003eVon der Leyen said European children spend an average of four to six hours a day watching a screen, adding that six hours every day adds up to twenty years of their life. She called on platform architects to prove their services cause no harm, comparing that expectation to requiring car manufacturers to provide seatbelts and air bags. The article notes that the proposed age-13 threshold may not satisfy critics in member countries seeking bans for children age 15 and under, and that most platforms already require users to be over age 12 but those restrictions have been easily sidestepped without force of law.\u003c/p\u003e\n"}]</script>

  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
