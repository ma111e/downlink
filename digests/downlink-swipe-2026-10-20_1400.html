<script type="application/json" id="dl-articles">[{"n":4,"title":"Doppelgänger Russian Influence Campaign in Israel","source":"clearskysec.com","sourceColorIdx":6,"link":"https://www.clearskysec.com/doppelganger-russian-influence-campaign-in-israel/","time":"16:50","priority":"SHOULD READ","score":80,"tldr":"ClearSky reports that Russia-linked Doppelgänger operators revived an influence campaign targeting Israel, using fake Walla articles and X accounts to spread misleading narratives. The activity appears intended to erode trust, deepen social divisions, and potentially influence Israel’s October 2026 elections.","briefOverview":"\u003cp\u003eClearSky identified renewed activity in Israel by Doppelgänger, a Russian influence campaign also known as “The Double.” The campaign creates fake copies of established news websites, using similar designs, logos, and layouts to make them appear legitimate. It spreads false and misleading messages that incorporate parts of real publications. These messages are distributed primarily on X through a network of fake accounts.\u003c/p\u003e\n\n\u003cp\u003eClearSky documented at least 76 fake articles on walla[.]ist, a website impersonating Walla, between May and October 2026. The campaign seeks to advance Russian interests, weaken trust in the government and public institutions, deepen divisions in Israeli society, and pollute AI engines. ClearSky states that the resurgence of activity since August 2026 may be tied to an effort to influence Israeli public opinion before the October 27 election. The linked report covers the infrastructure, scale, messages, and accounts identified by the researchers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ClearSky identified renewed activity in Israel by the Russian influence campaign known as Doppelgänger, or “The Double.”","Doppelgänger creates fake copies of recognized news sites, using similar designs, logos, and layouts to appear legitimate.","The campaign spreads false and misleading messages based partly on real publications through fake social-media accounts, mainly on X.","ClearSky documented at least 76 fake articles published between May and October 2026 on walla[.]ist, a website impersonating Walla.","The campaign aims to advance Russian interests, weaken trust in Israeli institutions, deepen divisions in Israeli society, and pollute AI engines."],"insights":["The campaign does not rely solely on fabricated stories; it combines misleading messages with portions of genuine publications, which can make impersonated content appear more credible.","ClearSky describes the operation as a sustained effort to shape public attitudes over time rather than a one-time misinformation event.","The campaign’s stated goal includes polluting AI engines, extending its potential influence beyond social-media audiences.","The renewed activity since August 2026 may be connected to efforts to influence Israeli public opinion ahead of the October 27 election, according to ClearSky."],"referencedReports":[{"title":"ClearSky Russian Influence Campaign Exposure 20.10.26","url":"https://www.clearskysec.com/wp-content/uploads/2026/10/ClearSky-Russian-Influence-Campaign-Exposure-20.10.26.pdf","publisher":"ClearSky","context":"The article links to ClearSky’s full report documenting the Doppelgänger campaign’s infrastructure, scale, messages, and accounts targeting Israel.","category":"research","primary":true}],"body":"\u003cp\u003eClearSky identified renewed activity in Israel by Doppelgänger, a Russian influence campaign also known as “The Double.” The campaign creates fake copies of established news websites, using similar designs, logos, and layouts to make them appear legitimate. It spreads false and misleading messages that incorporate parts of real publications. These messages are distributed primarily on X through a network of fake accounts.\u003c/p\u003e\n\n\u003cp\u003eClearSky documented at least 76 fake articles on walla[.]ist, a website impersonating Walla, between May and October 2026. The campaign seeks to advance Russian interests, weaken trust in the government and public institutions, deepen divisions in Israeli society, and pollute AI engines. ClearSky states that the resurgence of activity since August 2026 may be tied to an effort to influence Israeli public opinion before the October 27 election. The linked report covers the infrastructure, scale, messages, and accounts identified by the researchers.\u003c/p\u003e\n"},{"n":3,"title":"Rust 1.100 Will Add Dependency Cooldowns to Cargo","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/rust-cargo-cooldowns?utm_medium=feed","time":"14:21","priority":"SHOULD READ","score":78,"tldr":"Rust 1.100 will add an opt-in Cargo dependency cooldown that blocks newly published crate versions for a configurable period, helping limit exposure to malicious supply-chain releases. The protection is not enabled by default, so teams must configure a minimum publish age themselves.","briefOverview":"\u003cp\u003eRust 1.100, scheduled for November 12, will add stable support for Cargo’s configurable minimum publish age, allowing teams to delay adoption of newly released dependencies. The feature is opt-in: Cargo’s default minimum publish age remains zero, so teams must configure it themselves. A seven-day delay can be set in \u003ccode\u003e.cargo/config.toml\u003c/code\u003e with \u003ccode\u003eregistry.global-min-publish-age = \u0026quot;7 days\u0026quot;\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eWhen resolving dependencies, Cargo skips releases newer than the configured age and fails if no older eligible version meets the project’s requirements. This behavior is intended to prevent attackers from making a malicious release the only available option by yanking safe versions, a tactic used against \u003ccode\u003earrayref\u003c/code\u003e during an August compromise involving \u003ccode\u003earrayref\u003c/code\u003e, \u003ccode\u003einternment\u003c/code\u003e, \u003ccode\u003eappend-only-vec\u003c/code\u003e, and the malicious \u003ccode\u003eproc-macro1\u003c/code\u003e crate. The cooldown does not apply to \u003ccode\u003ecargo install\u003c/code\u003e, Git dependencies, local path dependencies, or registries without publication-time metadata, and developers can temporarily override it for urgent updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rust 1.100, scheduled for November 12, will add stable support for Cargo’s configurable minimum publish age, although the setting remains disabled by default.","With a configured minimum publish age, Cargo excludes dependency releases that are newer than the specified waiting period and fails resolution if no eligible version satisfies the project’s requirements.","Compromised releases of arrayref, internment, and append-only-vec were available on crates.io for 86, 90, and 107 minutes, respectively, before removal in August.","Cargo preserves dependency versions already recorded in Cargo.lock even when they are younger than the configured minimum age.","The stabilized implementation does not apply the publish-age check to cargo install, Git dependencies, local path dependencies, or registries without publication timestamp metadata."],"insights":["Upgrading to Rust 1.100 alone does not add a waiting period for dependencies, because Cargo’s minimum publish age defaults to zero and teams must explicitly configure it.","Cargo is designed to fail rather than accept a too-new release when no older eligible version is available, preventing an attacker from making a malicious update the only resolvable option by yanking safe versions.","Enabling the cooldown does not remove recently published dependencies that are already listed in Cargo.lock, so existing lockfiles can retain versions younger than the configured threshold.","A temporary override for an urgent update disables the age check not only for the selected package but also for all transitive dependencies needed during that resolution."],"referencedReports":[{"title":"Popular Rust Crates Compromised","url":"https://socket.dev/blog/popular-rust-crates-compromised","publisher":"socket","context":"Socket documented the August compromise involving malicious proc-macro1 dependencies distributed through arrayref, internment, and append-only-vec.","category":"research","primary":false},{"title":"Supply Chain Attack on arrayref","url":"https://blog.rust-lang.org/2026/08/20/supply-chain-attack-on-arrayref/","publisher":"rust-security-response-team","context":"The Rust Security Response Team reported how long the compromised crate releases remained available and noted that legitimate arrayref versions were yanked during the incident.","category":"advisory","primary":false},{"title":"Targeted Attacks","url":"https://blog.rust-lang.org/2026/09/17/targeted-attacks/","publisher":"rust-security-response-team","context":"The crates.io team and Rust security responders warned of a campaign targeting Rust project members and owners of popular crates.","category":"advisory","primary":false}],"body":"\u003cp\u003eRust 1.100, scheduled for November 12, will add stable support for Cargo’s configurable minimum publish age, allowing teams to delay adoption of newly released dependencies. The feature is opt-in: Cargo’s default minimum publish age remains zero, so teams must configure it themselves. A seven-day delay can be set in \u003ccode\u003e.cargo/config.toml\u003c/code\u003e with \u003ccode\u003eregistry.global-min-publish-age = \u0026quot;7 days\u0026quot;\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eWhen resolving dependencies, Cargo skips releases newer than the configured age and fails if no older eligible version meets the project’s requirements. This behavior is intended to prevent attackers from making a malicious release the only available option by yanking safe versions, a tactic used against \u003ccode\u003earrayref\u003c/code\u003e during an August compromise involving \u003ccode\u003earrayref\u003c/code\u003e, \u003ccode\u003einternment\u003c/code\u003e, \u003ccode\u003eappend-only-vec\u003c/code\u003e, and the malicious \u003ccode\u003eproc-macro1\u003c/code\u003e crate. The cooldown does not apply to \u003ccode\u003ecargo install\u003c/code\u003e, Git dependencies, local path dependencies, or registries without publication-time metadata, and developers can temporarily override it for urgent updates.\u003c/p\u003e\n"},{"n":2,"title":"There's only so much code: the rise in vulnerability numbers","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/theres-only-so-much-code-the-rise-in-vulnerability-numbers/","time":"15:31","priority":"MAY READ","score":56,"tldr":"AI-assisted vulnerability discovery is driving a sharp rise in disclosed flaws in legacy software, but most are not being exploited in the wild. Defenders should prioritize vulnerabilities that are demonstrably exploitable in their environments while strengthening layered mitigations and patching processes.","briefOverview":"\u003cp\u003eFrontier AI models such as Mythos are rapidly finding weaknesses in decades-old, widely used software, contributing to a sharp increase in vulnerability disclosures. Microsoft issued 975 vulnerability advisories in September and 1,415 in October, compared with a pre-June monthly average of about 100. The article says this surge is overwhelming some open-source maintainers and increasing pressure on the traditional 90-day coordinated disclosure model.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure increase has not been matched by a proportional increase in known exploitation. Only three of Microsoft’s 975 September advisories had detected in-the-wild exploitation, while Known Exploited Vulnerabilities grew 37% year over year compared with a 105% increase in published CVEs. The article argues that many AI-discovered issues may be impractical for attackers, although AI could also help attackers analyze vendor patches more quickly.\u003c/p\u003e\n\n\u003cp\u003eThe article suggests that the current discovery spike may eventually decline after old code is reviewed and fixed, especially if developers use AI models to evaluate new code before release. It recommends that organizations patch promptly but focus on weaknesses that offer realistic paths into their own environments. It also advises layered protections such as interim mitigations including LiveProtect, custom IPS or Snort triggers, behavioral anomaly detection, and AI-based checks in software build chains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Frontier AI models, including Mythos, are rapidly finding previously undiscovered weaknesses in decades-old, widely used software, contributing to 1,415 Microsoft vulnerability advisories in October after 975 in September.","The article reports that only three of Microsoft’s 975 September vulnerability advisories had detected in-the-wild exploitation, while Known Exploited Vulnerabilities increased 37% year over year compared with a 105% increase in published CVEs.","Open-source projects are being flooded with vulnerability reports, placing pressure on maintainers and challenging the traditional 90-day coordinated disclosure model.","The article suggests AI-assisted discovery may eventually level off as the backlog of historical code is reviewed and new software is checked with AI before release.","The article recommends that organizations prioritize flaws with high exploitability in their own environments, patch promptly, use interim mitigations such as LiveProtect, and deploy layered behavioral and intrusion-prevention protections."],"insights":["The increase in reported vulnerabilities does not translate directly into active attacks: only three of Microsoft’s 975 September advisories had detected in-the-wild exploitation, despite the much larger disclosure volume.","The article notes that Known Exploited Vulnerabilities measure distinct flaws known to be abused, rather than the number of attacks or successful compromises, so attackers can repeatedly use a limited set of useful weaknesses against many organizations.","AI may reduce the time attackers need to understand vendor fixes, because attackers have historically used patches to identify the underlying weakness and AI can remove human analysis bottlenecks.","The traditional 90-day private disclosure period is under pressure because some researchers believe a flaw found by one AI system may effectively be discoverable by others immediately.","For developers, checking new code with current AI models is presented as comparatively inexpensive, while reviewing the accumulated backlog of old code is costly and therefore better approached in manageable chunks."],"referencedReports":[],"body":"\u003cp\u003eFrontier AI models such as Mythos are rapidly finding weaknesses in decades-old, widely used software, contributing to a sharp increase in vulnerability disclosures. Microsoft issued 975 vulnerability advisories in September and 1,415 in October, compared with a pre-June monthly average of about 100. The article says this surge is overwhelming some open-source maintainers and increasing pressure on the traditional 90-day coordinated disclosure model.\u003c/p\u003e\n\n\u003cp\u003eThe disclosure increase has not been matched by a proportional increase in known exploitation. Only three of Microsoft’s 975 September advisories had detected in-the-wild exploitation, while Known Exploited Vulnerabilities grew 37% year over year compared with a 105% increase in published CVEs. The article argues that many AI-discovered issues may be impractical for attackers, although AI could also help attackers analyze vendor patches more quickly.\u003c/p\u003e\n\n\u003cp\u003eThe article suggests that the current discovery spike may eventually decline after old code is reviewed and fixed, especially if developers use AI models to evaluate new code before release. It recommends that organizations patch promptly but focus on weaknesses that offer realistic paths into their own environments. It also advises layered protections such as interim mitigations including LiveProtect, custom IPS or Snort triggers, behavioral anomaly detection, and AI-based checks in software build chains.\u003c/p\u003e\n"},{"n":1,"title":"The Risk of AI-Powered Antidetect Browsers in Online Fraud and Influence Operations","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/the-risk-of-ai-powered-antidetect-browsers-in-online-fraud-and-influence-operations/","time":"14:17","priority":"MAY READ","score":55,"tldr":"AI-enabled antidetect browsers such as Kameleo, AdsPower, and MultiLogin let operators mask device identities, automate thousands of accounts, and evade platform defenses, enabling scalable fraud, account takeover, scraping, and coordinated influence campaigns. Their combination of fingerprint spoofing, residential proxies, cookie injection, account warming, and LLM-driven automation lowers the barrier for sophisticated abuse.","briefOverview":"\u003cp\u003eCheck Point Research examines Kameleo, AdsPower, and MultiLogin, commercially available antidetect browsers that create separate browser profiles with spoofed device characteristics. The article says these tools can let a small team manage thousands of accounts across social media, e-commerce, and financial platforms while attempting to avoid systems that identify coordinated or fraudulent activity. Documented criminal uses include account takeover, payment-card testing, fraudulent loan applications, advertising fraud, phishing, and malware distribution.\u003c/p\u003e\n\n\u003cp\u003eThe tools combine fabricated browser fingerprints, residential proxies, WebRTC leak suppression, isolated cookies and storage, and automated account-warming activity to make accounts appear unrelated and legitimate. The article highlights cookie injection as a way to place stolen pre-authenticated session data into a browser profile without generating a new login event, and describes AI integrations that can generate and distribute content through automated workflows. It concludes that this infrastructure lowers the cost and technical barrier for large-scale fraud and coordinated influence operations, creating challenges for social platforms, financial services, companies, and their users.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Antidetect browsers such as Kameleo, AdsPower, and MultiLogin create isolated browser profiles with fabricated device fingerprints, allowing operators to manage many accounts while attempting to evade platform detection.","The article documents criminal uses including account takeover through stolen session cookies, card testing with stolen payment credentials, fraudulent loan applications, and bulk creation of accounts for advertising fraud.","AdsPower provides automation features, including an RPA marketplace, account warming, and a Model Context Protocol server that can connect large language model workflows to browser profiles for automated content distribution.","Kameleo supports WebRTC suppression and cookie injection, which can insert an already authenticated session into a browser profile without a new login event.","The article argues that the combination of identity spoofing, residential proxies, automated account activity, scraping, and AI-generated content lowers the barrier for large-scale fraud and coordinated inauthentic influence operations."],"insights":["Cookie injection can enable a stolen, already-authenticated session to be placed into a new browser profile without a visible login event, potentially bypassing checks that depend on detecting unusual sign-ins or multi-factor authentication prompts.","Account warming is designed to build weeks of apparently normal activity before abuse begins, meaning accounts may look legitimate during the period when platforms would otherwise assess their trustworthiness.","The article describes an end-to-end automation path in which AI-generated content can be routed through pre-warmed profiles and distributed using ready-made workflows, reducing the need for an operator to actively run the campaign.","Scraping capabilities can turn access to a closed social-media group into targeting data, enabling artificial accounts to tailor messages to members' stated interests, locations, and engagement patterns.","The tools' commercial support, multilingual availability, large profile limits, proxy integrations, and cryptocurrency payment options indicate an operational ecosystem extending beyond isolated custom-built criminal tooling."],"referencedReports":[{"title":"Anthropic Threat Intelligence Report, September 2026","url":"https://www-cdn.anthropic.com/e50be2e51e7695dc4b1366a37a245a597377d3b5/Anthropic-Detecting-and-countering-091026.pdf","publisher":"anthropic","context":"The article cites this report as documenting a fraud campaign that used antidetect browser profiles, residential proxies, CAPTCHA solving, and identity-verification bypass tools to create verified accounts.","category":"research","primary":false},{"title":"First Half 2026 Adversarial Threat Report","url":"https://transparency.meta.com/sr/first-half-2026-Adversarial-threat-report/","publisher":"meta","context":"The article cites Meta's transparency reporting as identifying Russia, Iran, and China as leading global sources of coordinated inauthentic behavior.","category":"research","primary":false},{"title":"Anti-Detect Browsers and Stolen Digital Fingerprints","url":"https://spycloud.com/blog/anti-detect-browsers-stolen-digital-fingerprints/","publisher":"spycloud","context":"The article references SpyCloud threat-intelligence research as independent documentation of cookie-injection workflows used with antidetect browsers.","category":"research","primary":false},{"title":"Antidetect Browsers","url":"https://www.group-ib.com/resources/knowledge-hub/antidetect-browsers/","publisher":"group-ib","context":"The article cites Group-IB security research as confirmation that pre-authenticated session injection is an established criminal workflow.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research examines Kameleo, AdsPower, and MultiLogin, commercially available antidetect browsers that create separate browser profiles with spoofed device characteristics. The article says these tools can let a small team manage thousands of accounts across social media, e-commerce, and financial platforms while attempting to avoid systems that identify coordinated or fraudulent activity. Documented criminal uses include account takeover, payment-card testing, fraudulent loan applications, advertising fraud, phishing, and malware distribution.\u003c/p\u003e\n\n\u003cp\u003eThe tools combine fabricated browser fingerprints, residential proxies, WebRTC leak suppression, isolated cookies and storage, and automated account-warming activity to make accounts appear unrelated and legitimate. The article highlights cookie injection as a way to place stolen pre-authenticated session data into a browser profile without generating a new login event, and describes AI integrations that can generate and distribute content through automated workflows. It concludes that this infrastructure lowers the cost and technical barrier for large-scale fraud and coordinated influence operations, creating challenges for social platforms, financial services, companies, and their users.\u003c/p\u003e\n"},{"n":5,"title":"2027 Global Digital Trust Insights: C‑suite playbook and findings","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/2027-global-digital-trust-insights-c-suite-playbook-and-findings/","time":"17:37","priority":"MAY READ","score":45,"tldr":"PwC’s 2027 Global Digital Trust Insights survey of 3,934 business and technology leaders across 71 countries examines how organizations are managing cyber risk amid rapid AI advances, geopolitical volatility, and increasingly interconnected systems.","briefOverview":"\u003cp\u003ePwC’s 2027 Global Digital Trust Insights report examines cybersecurity in a changing digital environment. The report is based on a survey of 3,934 business and technology leaders across 71 countries. It focuses on how leaders are managing cybersecurity as cyber risk changes.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies rapid advances in AI, geopolitical volatility, and interconnected systems as forces reshaping cyber risk. Health-ISAC presents the resource as being provided by PwC, a Community Services Champion. Readers are directed to PwC’s report for the full findings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PwC’s 2027 Global Digital Trust Insights survey included 3,934 business and technology leaders across 71 countries.","The report examines how leaders are managing cybersecurity in a changing digital environment.","The article identifies rapid advances in AI, geopolitical volatility, and interconnected systems as factors reshaping cyber risk.","The resource is provided by PwC, a Health-ISAC Community Services Champion.","The article links readers to PwC’s full Global Digital Trust Insights report."],"insights":["The report treats cybersecurity risk as a moving target shaped at the same time by advances in AI, geopolitical volatility, and interconnected systems.","The survey draws on a broad international sample of 3,934 business and technology leaders from 71 countries, rather than focusing on a single sector or country."],"referencedReports":[],"body":"\u003cp\u003ePwC’s 2027 Global Digital Trust Insights report examines cybersecurity in a changing digital environment. The report is based on a survey of 3,934 business and technology leaders across 71 countries. It focuses on how leaders are managing cybersecurity as cyber risk changes.\u003c/p\u003e\n\n\u003cp\u003eThe article identifies rapid advances in AI, geopolitical volatility, and interconnected systems as forces reshaping cyber risk. Health-ISAC presents the resource as being provided by PwC, a Community Services Champion. Readers are directed to PwC’s report for the full findings.\u003c/p\u003e\n"},{"n":6,"title":"Advanced Attacks on Embedded Gen AI Tools and Gen AI Apps – What to Watch For","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/advanced-attacks-on-embedded-gen-ai-tools-and-gen-ai-apps-what-to-watch-for/","time":"16:52","priority":"MAY READ","score":25,"tldr":"Healthcare organizations embedding generative AI into patient-facing apps and workflows should address security and compliance risks to avoid exposing patient data and damaging trust.","briefOverview":"\u003cp\u003eHealth-ISAC highlights a Radware blog about advanced attacks affecting embedded generative AI tools and applications. The article says AI-powered applications are changing healthcare while also creating challenges for the industry. It focuses on the hidden risks that security leaders should consider when generative AI is embedded in healthcare applications.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that digitized patient interactions and generative AI workflows can introduce efficiency. It also says organizations must plan carefully to meet security and compliance needs. Without appropriate planning, patient data and an organization’s reputation may be at risk. The page directs readers to Radware’s linked blog for the full discussion.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says AI-powered applications are transforming healthcare while also creating challenges for the industry.","Digitized patient interactions and generative AI workflows can improve efficiency.","Healthcare organizations need to plan carefully to meet security and compliance needs when using these technologies.","The article warns that insufficient planning could put patient data and organizational reputation at risk.","The resource is a blog by Radware, identified as a Health-ISAC Community Services Champion."],"insights":["The article frames generative AI risk in healthcare as extending beyond the AI tool itself to the patient interactions and workflows where it is embedded.","It treats security, compliance, patient-data protection, and organizational reputation as connected concerns that need to be addressed during planning.","The page provides a link to a separate Radware blog for further detail rather than presenting the technical analysis on the page itself."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC highlights a Radware blog about advanced attacks affecting embedded generative AI tools and applications. The article says AI-powered applications are changing healthcare while also creating challenges for the industry. It focuses on the hidden risks that security leaders should consider when generative AI is embedded in healthcare applications.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that digitized patient interactions and generative AI workflows can introduce efficiency. It also says organizations must plan carefully to meet security and compliance needs. Without appropriate planning, patient data and an organization’s reputation may be at risk. The page directs readers to Radware’s linked blog for the full discussion.\u003c/p\u003e\n"}]</script>

<button type="button" data-dl-pill>New layout <span aria-hidden="true">&rarr;</span></button>
</div>
<style>#dl-layout-cta{position:fixed;right:16px;bottom:16px;
  z-index:2147483000;display:flex;align-items:center;gap:12px;
  max-width:calc(100vw - 24px);padding:10px 14px;border-radius:10px;
  font:13px/1.4 system-ui,sans-serif;color:#e8e8ea;background:rgba(20,20,24,.92);
  border:1px solid rgba(127,127,127,.35);box-shadow:0 6px 24px rgba(0,0,0,.35);
  backdrop-filter:blur(8px);transition:opacity .2s ease}
#dl-layout-cta span{opacity:.92}
#dl-layout-cta button{cursor:pointer;font:inherit;padding:.35em .85em;border-radius:7px;
  border:1px solid transparent;white-space:nowrap}
#dl-layout-cta button[data-dl-try]{background:#39bdc9;color:#04222a;
  border-color:#39bdc9;font-weight:600}
#dl-layout-cta button[data-dl-dismiss]{background:transparent;color:inherit;
  border-color:rgba(127,127,127,.4)}
#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
