<script type="application/json" id="dl-articles">[{"n":2,"title":"Police Dismantle Kratos Phishing Kit Built to Steal Microsoft 365 Sessions and Bypass MFA","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/police-dismantle-kratos-phishing-kit.html","time":"06:38","priority":"SHOULD READ","score":84,"tldr":"German and US law enforcement dismantled the Kratos phishing-as-a-service infrastructure, taking over 200 servers offline and disrupting a Microsoft 365 session-theft kit used by about 1,800 customers. The kit could bypass ordinary MFA by stealing session cookies, so affected users may need session revocation and phishing-resistant sign-in, not just password resets.","briefOverview":"\u003cp\u003eGerman and US law enforcement took down the core infrastructure of Kratos, a criminal phishing kit, while Indonesian authorities arrested the man they say developed and ran it. The Frankfurt public prosecutor\u0026rsquo;s cybercrime unit and Germany\u0026rsquo;s Federal Criminal Police Office said they pulled more than 200 servers offline. Investigators estimate about 1,800 paying customers used Kratos to run roughly 15,000 phishing campaigns a month.\u003c/p\u003e\n\n\u003cp\u003eKratos targeted Microsoft 365 logins and was designed to steal session cookies as well as passwords, which the BKA said could let attackers get past two-factor authentication and enter accounts as the user. ANY.RUN found the kit had two modes: a plain PHP page that harvested credentials and a Node.js reverse proxy that relayed logins to Microsoft in real time and captured the resulting session. Microsoft Threat Intelligence tracks the same kit as SneakyLog and linked it to a tax-themed campaign that sent W-2 documents with personalized QR codes to about 100 organizations.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said victims since late 2024 number in the hundreds of thousands across more than 30 countries, mainly in Europe and the United States. The operators are estimated to have earned more than 300,000 euros since 2024, and stolen Microsoft logins could be used for further phishing, sold to other criminals, or turned into a foothold inside companies. The BKA says Kratos-powered campaigns cannot continue for now, but the takedown did not touch the roughly 1,800 customers or the kit code they already hold.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["German and US law enforcement took down the core infrastructure of the Kratos phishing kit, and Indonesian authorities arrested the man they say developed and operated it.","The Frankfurt public prosecutor's cybercrime unit and Germany's Federal Criminal Police Office said they pulled more than 200 servers offline and estimated that about 1,800 paying customers used Kratos to run roughly 15,000 phishing campaigns a month.","Kratos was designed to steal Microsoft 365 session cookies as well as passwords, allowing attackers to bypass two-factor authentication and access accounts as the user.","ANY.RUN found that Kratos offered a plain PHP credential-harvesting mode and a Node.js reverse-proxy mode that relayed logins to Microsoft in real time and captured the resulting session.","Authorities said victims since late 2024 number in the hundreds of thousands across more than 30 countries, with concentrations in Europe and the United States."],"insights":["A password reset alone may not remove access if Kratos captured a live Microsoft 365 session, because the article says those sessions can survive the reset and must be revoked separately.","ANY.RUN identified a practical hunting signal for Kratos exposure: its login pages almost always load barr.svg and lg.svg and then post credentials to endpoints such as next.php or save.php, with 90% recall and near-zero false positives.","The takedown disrupted Kratos’ central servers but did not affect the roughly 1,800 customers or copies of the kit code they may already have, leaving open the possibility that similar campaigns could reappear under a new name.","Kratos lowered the barrier for less-skilled criminals by packaging adversary-in-the-middle Microsoft 365 phishing into a franchise-like service with cryptocurrency payments, a website, and a Telegram shop."],"referencedReports":[{"title":"Kratos PhaaS: Account Takeover","url":"https://any.run/cybersecurity-blog/kratos-phaas-account-takeover/","publisher":"ANY.RUN","context":"The article cites ANY.RUN’s reverse-engineering of the Kratos phishing kit, including its PHP credential-harvesting mode, Node.js reverse-proxy mode, and hunting indicators.","category":"","primary":false},{"title":"When tax season becomes cyberattack season: phishing and malware campaigns using tax-related lures","url":"https://www.microsoft.com/en-us/security/blog/2026/03/19/when-tax-season-becomes-cyberattack-season-phishing-and-malware-campaigns-using-tax-related-lures/","publisher":"Microsoft Threat Intelligence","context":"The article cites Microsoft Threat Intelligence as tracking the same kit as SneakyLog and describing a tax-themed Microsoft 365 phishing campaign.","category":"","primary":false}],"body":"\u003cp\u003eGerman and US law enforcement took down the core infrastructure of Kratos, a criminal phishing kit, while Indonesian authorities arrested the man they say developed and ran it. The Frankfurt public prosecutor\u0026rsquo;s cybercrime unit and Germany\u0026rsquo;s Federal Criminal Police Office said they pulled more than 200 servers offline. Investigators estimate about 1,800 paying customers used Kratos to run roughly 15,000 phishing campaigns a month.\u003c/p\u003e\n\n\u003cp\u003eKratos targeted Microsoft 365 logins and was designed to steal session cookies as well as passwords, which the BKA said could let attackers get past two-factor authentication and enter accounts as the user. ANY.RUN found the kit had two modes: a plain PHP page that harvested credentials and a Node.js reverse proxy that relayed logins to Microsoft in real time and captured the resulting session. Microsoft Threat Intelligence tracks the same kit as SneakyLog and linked it to a tax-themed campaign that sent W-2 documents with personalized QR codes to about 100 organizations.\u003c/p\u003e\n\n\u003cp\u003eAuthorities said victims since late 2024 number in the hundreds of thousands across more than 30 countries, mainly in Europe and the United States. The operators are estimated to have earned more than 300,000 euros since 2024, and stolen Microsoft logins could be used for further phishing, sold to other criminals, or turned into a foothold inside companies. The BKA says Kratos-powered campaigns cannot continue for now, but the takedown did not touch the roughly 1,800 customers or the kit code they already hold.\u003c/p\u003e\n"},{"n":1,"title":"Chick-fil-A discloses data breach after credential stuffing attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/chick-fil-a-discloses-data-breach-after-credential-stuffing-attacks/","time":"06:40","priority":"SHOULD READ","score":78,"tldr":"Chick-fil-A is notifying customers after attackers used stolen third-party credentials in a June credential stuffing campaign to access some Chick-fil-A One accounts. Exposed data may include names, emails, membership/payment identifiers, rewards balances, partial card numbers, and stored contact details, prompting the company to log out affected users, remove payment methods, restore balances, and urge password changes.","briefOverview":"\u003cp\u003eChick-fil-A is notifying an undisclosed number of customers after some Chick-fil-A One accounts were hacked in recent credential stuffing attacks. The company detected the incident after identifying suspicious login activity in certain accounts. In breach notification letters, Chick-fil-A said unauthorized parties launched an automated attack against its website and mobile application between June 17 and June 19, 2026 using account credentials obtained from a third-party source.\u003c/p\u003e\n\n\u003cp\u003eThe exposed information may include customers’ names, email addresses, Chick-fil-A One membership numbers and mobile pay numbers, QR codes, Chick-fil-A credit amounts, and the last four digits of credit or debit card numbers. If stored in the compromised accounts, birth dates, phone numbers, and addresses may also have been accessed. Chick-fil-A told the Texas Attorney General that 2,182 Texans were impacted and also sent notification letters to residents of Iowa, the District of Columbia, Maryland, Massachusetts, New Mexico, New York, North Carolina, Oregon, Vermont, and Rhode Island.\u003c/p\u003e\n\n\u003cp\u003eIn response, Chick-fil-A logged out all impacted accounts, removed payment methods, restored Chick-fil-A One account balances, and added rewards to affected accounts as an apology. The company also advised impacted users to change their passwords because the accounts were compromised using stolen credentials. The article notes that Chick-fil-A confirmed a similar credential stuffing incident in March 2023 involving more than 71,000 customers whose personal information was accessed and whose stored rewards balances were used.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Chick-fil-A is notifying an undisclosed number of customers after suspicious login activity led it to discover that some Chick-fil-A One accounts had been hacked.","The company said unauthorized parties used credentials obtained from a third-party source in an automated attack against its website and mobile application between June 17 and June 19, 2026.","Information potentially accessed includes customers’ names, email addresses, Chick-fil-A One membership numbers, mobile pay numbers, QR codes, Chick-fil-A credit amounts, the last four digits of credit or debit card numbers, and, if stored, birth dates, phone numbers, and addresses.","Chick-fil-A told the Texas Attorney General that the breach impacts 2,182 Texans and also sent notification letters to residents of several other U.S. states and the District of Columbia.","In response, Chick-fil-A logged out impacted accounts, removed payment methods, restored Chick-fil-A One account balances, added rewards to affected accounts, and advised users to change their passwords."],"insights":["The incident shows that Chick-fil-A One accounts can be compromised even when the stolen passwords come from a third-party source, making password reuse across services a direct risk for customers.","Chick-fil-A’s response of restoring account balances and adding rewards indicates that loyalty credits and rewards balances were a meaningful target or impact of the account takeovers, not just personal profile data.","This is the second similar Chick-fil-A credential stuffing incident described in the article, after a 2023 case involving more than 71,000 customers whose personal information and stored rewards balances were accessed.","The exposed data was broader than basic contact information, because compromised accounts could reveal membership numbers, mobile pay numbers, QR codes, Chick-fil-A credit amounts, and partial payment card details."],"referencedReports":[],"body":"\u003cp\u003eChick-fil-A is notifying an undisclosed number of customers after some Chick-fil-A One accounts were hacked in recent credential stuffing attacks. The company detected the incident after identifying suspicious login activity in certain accounts. In breach notification letters, Chick-fil-A said unauthorized parties launched an automated attack against its website and mobile application between June 17 and June 19, 2026 using account credentials obtained from a third-party source.\u003c/p\u003e\n\n\u003cp\u003eThe exposed information may include customers’ names, email addresses, Chick-fil-A One membership numbers and mobile pay numbers, QR codes, Chick-fil-A credit amounts, and the last four digits of credit or debit card numbers. If stored in the compromised accounts, birth dates, phone numbers, and addresses may also have been accessed. Chick-fil-A told the Texas Attorney General that 2,182 Texans were impacted and also sent notification letters to residents of Iowa, the District of Columbia, Maryland, Massachusetts, New Mexico, New York, North Carolina, Oregon, Vermont, and Rhode Island.\u003c/p\u003e\n\n\u003cp\u003eIn response, Chick-fil-A logged out all impacted accounts, removed payment methods, restored Chick-fil-A One account balances, and added rewards to affected accounts as an apology. The company also advised impacted users to change their passwords because the accounts were compromised using stolen credentials. The article notes that Chick-fil-A confirmed a similar credential stuffing incident in March 2023 involving more than 71,000 customers whose personal information was accessed and whose stored rewards balances were used.\u003c/p\u003e\n"},{"n":3,"title":"Trojanized Newtonsoft.Json Fork Hides Game-Rigging Code in a Working Library","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/trojanized-newtonsoftjson-fork-hides.html","time":"06:00","priority":"SHOULD READ","score":78,"tldr":"A typosquatted NuGet package posing as Newtonsoft.Json was a working trojanized fork designed to manipulate Digitain crash-game results and later exfiltrate rigged outcomes to an attacker-controlled server. The malware only activates in Digitain’s specific backend context, making it difficult for other developers who installed it to notice anything wrong.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered a NuGet typosquat named \u003ccode\u003eNewtonsoftt.Json.Net\u003c/code\u003e that masquerades as the Newtonsoft.Json library while hiding code designed to rig live game results on Digitain. Seven versions of the package were published to NuGet by the owner MagicalPuff96, and the package has been downloaded about 1,200 times. The package has been unlisted by its owner, but the artifacts remain available for download from the registry.\u003c/p\u003e\n\n\u003cp\u003eJFrog said the trojan targets Digitain’s FG-Crash online betting game and, in later versions, exfiltrates rigged round results to an attacker-controlled server using the header \u003ccode\u003eX-Seq-ApiKey: theperfectheist2025\u003c/code\u003e. The malicious behavior begins only after the host initializes \u003ccode\u003eJsonConvert.DefaultSettings\u003c/code\u003e, and it can only succeed on systems exposing the target’s specific game backend method. This made the package appear to be a real, working Newtonsoft.Json build for non-targeted users.\u003c/p\u003e\n\n\u003cp\u003eThe package evolved across three generations, with changes in obfuscation, rigging strategy, and exfiltration path, while version 11.0.11 was reportedly left completely unobfuscated. JFrog said package metadata leaked an internal Digitain repository URL in every version, indicating the author had access to FG-Crash source code. Developers are advised to remove the typosquat package, block the command-and-control address, and pin Newtonsoft.Json to a known-good version via \u003ccode\u003epackages.lock.json\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers discovered a NuGet typosquat named Newtonsoftt.Json.Net that masquerades as the Newtonsoft.Json library and contains code designed to rig live game results on Digitain.","Seven versions of Newtonsoftt.Json.Net were published to NuGet by the owner MagicalPuff96, and the package has been downloaded about 1,200 times.","JFrog said the trojanized library activates after JsonConvert.DefaultSettings is initialized and targets servers running Digitain’s FG-Crash crash-game backend.","Later versions of the package exfiltrate rigged round results to an attacker-controlled server at 185.126.237[.]64:5341 using the header X-Seq-ApiKey: theperfectheist2025.","Developers are advised to remove the typosquat package, block the command-and-control address, and pin Newtonsoft.Json to a known-good version via packages.lock.json."],"insights":["The package was unusually targeted because it functioned as a real Newtonsoft.Json build for most users and only attempted its malicious behavior when the host exposed Digitain’s specific FG-Crash backend method.","The malicious code used a randomized delay after JsonConvert.DefaultSettings was assigned, which JFrog said helped it avoid detection before triggering its payload.","The package metadata leaked an internal Digitain repository URL in all seven versions, which JFrog said indicated the author had access to FG-Crash source code.","The attacker appeared to iterate across three generations of the package, changing obfuscation, rigging strategy, and exfiltration behavior before version 11.0.11 was published completely unobfuscated.","Unlisting the package removed it from NuGet search results but did not remove the artifacts from the registry, so the package remained available for download."],"referencedReports":[{"title":"NuGet Typosquat Targets Betting Platform","url":"https://jfrog.com/blog/nuget-typosquat-targets-betting-platform/","publisher":"JFrog","context":"The article cites JFrog’s analysis as the source describing the trojanized NuGet package’s Digitain rigging behavior, exfiltration header, version evolution, and targeting details.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered a NuGet typosquat named \u003ccode\u003eNewtonsoftt.Json.Net\u003c/code\u003e that masquerades as the Newtonsoft.Json library while hiding code designed to rig live game results on Digitain. Seven versions of the package were published to NuGet by the owner MagicalPuff96, and the package has been downloaded about 1,200 times. The package has been unlisted by its owner, but the artifacts remain available for download from the registry.\u003c/p\u003e\n\n\u003cp\u003eJFrog said the trojan targets Digitain’s FG-Crash online betting game and, in later versions, exfiltrates rigged round results to an attacker-controlled server using the header \u003ccode\u003eX-Seq-ApiKey: theperfectheist2025\u003c/code\u003e. The malicious behavior begins only after the host initializes \u003ccode\u003eJsonConvert.DefaultSettings\u003c/code\u003e, and it can only succeed on systems exposing the target’s specific game backend method. This made the package appear to be a real, working Newtonsoft.Json build for non-targeted users.\u003c/p\u003e\n\n\u003cp\u003eThe package evolved across three generations, with changes in obfuscation, rigging strategy, and exfiltration path, while version 11.0.11 was reportedly left completely unobfuscated. JFrog said package metadata leaked an internal Digitain repository URL in every version, indicating the author had access to FG-Crash source code. Developers are advised to remove the typosquat package, block the command-and-control address, and pin Newtonsoft.Json to a known-good version via \u003ccode\u003epackages.lock.json\u003c/code\u003e.\u003c/p\u003e\n"},{"n":5,"title":"Agentic SOC Autonomy: Earn It One Decision at a Time","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/agentic-soc-earning-ai-agent-autonomy","time":"06:35","priority":"MAY READ","score":45,"tldr":"AI agents in the SOC should earn autonomy gradually, starting with low-risk tasks like enrichment and only moving to automated remediation after their decisions are measurable, auditable, and reversible. The key is to grant trust one decision class at a time, with clear outcome metrics and rollback plans before any agent is allowed to act on its own.","briefOverview":"\u003cp\u003eThe article argues that an autonomous security operations center should be treated as a destination rather than something teams simply switch on. The author says AI agents must earn trust one decision class at a time, using evidence collected in the organization’s own environment. Vendor promises of agents that triage, investigate, decide, and remediate while analysts sleep are described as compelling but potentially risky in many environments.\u003c/p\u003e\n\n\u003cp\u003eA central distinction in the article is between an agent that recommends and an agent that acts. A bad recommendation may only cost a few minutes of review, while a bad automated remediation could revoke a credential, quarantine a production workload, or lock an account at a damaging moment. The author recommends separating agent work into detection, enrichment, correlation, recommendation, and action, then granting autonomy to each stage independently.\u003c/p\u003e\n\n\u003cp\u003eThe article says AI agents should be instrumented like new employees on probation, with scoped work, reviewed output, and a full paper trail. Every decision should be logged, attributable, and reconstructable so teams can explain why the agent acted during a post-incident review. Before any automated remediation is enabled, teams should have a tested and fast rollback plan, and they should measure outcomes such as adversary resilience and reduced material risk rather than only alert volume or time-to-triage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that autonomy in a security operations center is not a feature to switch on, but a level of trust an AI agent must earn one decision class at a time.","The author distinguishes between agents that recommend actions and agents that take actions, noting that bad automated remediation can disrupt business operations and damage trust in the security team.","The article recommends separating agent work into detection, enrichment, correlation, recommendation, and action, then granting trust to each stage independently.","The author says every agent decision should be logged, attributable, and reconstructable so teams can explain why the agent acted during a post-incident review.","The article states that automated remediation should not be enabled unless there is a tested, fast, and well-understood rollback plan for when the agent is wrong."],"insights":["Treating an AI agent like a new employee on probation gives teams a practical model for expanding its authority: start with scoped work, review its output, and require a paper trail before granting more access.","The article frames rollback planning as a prerequisite for automation, not an afterthought, by saying unclear answers about how to reverse a wrong action should keep the agent in recommend-only mode.","The author warns that faster ticket closure and lower alert volume can be misleading if they do not also show reduced material risk or improved resilience against adversaries.","The fastest payoff from agentic security work may come from the “unglamorous middle” of the workflow, such as enrichment and reducing repetitive analyst toil, rather than from fully autonomous final decisions."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that an autonomous security operations center should be treated as a destination rather than something teams simply switch on. The author says AI agents must earn trust one decision class at a time, using evidence collected in the organization’s own environment. Vendor promises of agents that triage, investigate, decide, and remediate while analysts sleep are described as compelling but potentially risky in many environments.\u003c/p\u003e\n\n\u003cp\u003eA central distinction in the article is between an agent that recommends and an agent that acts. A bad recommendation may only cost a few minutes of review, while a bad automated remediation could revoke a credential, quarantine a production workload, or lock an account at a damaging moment. The author recommends separating agent work into detection, enrichment, correlation, recommendation, and action, then granting autonomy to each stage independently.\u003c/p\u003e\n\n\u003cp\u003eThe article says AI agents should be instrumented like new employees on probation, with scoped work, reviewed output, and a full paper trail. Every decision should be logged, attributable, and reconstructable so teams can explain why the agent acted during a post-incident review. Before any automated remediation is enabled, teams should have a tested and fast rollback plan, and they should measure outcomes such as adversary resilience and reduced material risk rather than only alert volume or time-to-triage.\u003c/p\u003e\n"},{"n":4,"title":"UK Cybercrime Journal: H1 2026 Dark Web Seizures \u0026 Arrests","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/07/uk-cybercrime-journal-h1-2026-dark-web.html","time":"08:00","priority":"MAY READ","score":40,"tldr":"UK and European law enforcement disrupted several dark web criminal operations in early 2026, including drug markets and a bogus murder-for-hire site, through arrests, infrastructure seizures, and cryptocurrency recovery. The key takeaway is that while Tor, Telegram, and crypto enable these markets, investigators can still contain them by infiltrating platforms, tracing payments, and identifying operators.","briefOverview":"\u003cp\u003eThe article covers several UK-linked dark web law enforcement actions in the first half of 2026. On 14 May 2026, two Cambridgeshire drug dealers were sentenced after being arrested in July 2024 by the Eastern Region Special Operations Unit. They reportedly used the dark web to supply heroin, cocaine, and amphetamine to hundreds of users across the UK, with deals initially arranged through a Telegram channel under the handle Gorgonites.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes the seizure of AEGIS Marketplace, announced on 17 March 2026 by the London Metropolitan Police’s Cyber Crime Unit. AEGIS Marketplace allowed sellers to market drugs to buyers using cryptocurrency, and by March 2026 it had 30 active sellers and an estimated 10,000 drug sales in ten months. Officers infiltrated the site and retrieved server data that helped identify administrators, sellers, and customers.\u003c/p\u003e\n\n\u003cp\u003eA third case involved two suspects arrested in Romania on 19 January 2026 as part of an ERSOU investigation into Online Killers Marketplace, a bogus dark web site offering services including murder and extortion. The investigation led to the seizure of at least $600,000 in cryptocurrency, almost €50,000 in cash, and around £48,000 worth of Romanian Leu. The article argues that while encrypted messaging apps, Tor, cryptocurrency, and online marketplaces make these crimes difficult to prevent, law enforcement can contain them by targeting infrastructure, tracing funds, using undercover accounts, and identifying operational security mistakes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On 14 May 2026, two Cambridgeshire drug dealers were sentenced after ERSOU arrested them in July 2024 for using the dark web to supply heroin, cocaine, and amphetamine to hundreds of users across the UK.","The Gorgonites operation used a Telegram channel to arrange drug deals and was linked to at least 570 individual sales on Nemesis Market since September 2023.","On 17 March 2026, the London Metropolitan Police’s Cyber Crime Unit announced the seizure of AEGIS Marketplace, which had 30 active sellers and an estimated 10,000 drug sales in ten months.","On 19 January 2026, two suspects were arrested in Romania as part of an ERSOU investigation into Online Killers Marketplace, a bogus dark web site offering services including murder and extortion.","The Online Killers Marketplace investigation led to the seizure of at least $600,000 in cryptocurrency, almost €50,000 in cash, and around £48,000 worth of Romanian Leu."],"insights":["Telegram is highlighted as an increasingly important front-end for cybercrime because it is easier for buyers to access than using Tor through a desktop or laptop browser.","The article emphasizes that cryptocurrency can help enable illicit markets while also creating a permanent public record that investigators and threat intelligence firms can analyze to trace funds and identify administrators.","Historical breach data can undermine dark web operators’ anonymity if they reused usernames or passwords years earlier on unrelated compromised sites.","Long-running undercover accounts can help investigators build trust inside dark web ecosystems and gather evidence through interactions with admins, vendors, private portals, or escrow systems.","Misconfigurations in dark web infrastructure, such as exposed IP addresses, trackable certificates, or open port banners, can reveal the real location of hidden services and support server seizures."],"referencedReports":[],"body":"\u003cp\u003eThe article covers several UK-linked dark web law enforcement actions in the first half of 2026. On 14 May 2026, two Cambridgeshire drug dealers were sentenced after being arrested in July 2024 by the Eastern Region Special Operations Unit. They reportedly used the dark web to supply heroin, cocaine, and amphetamine to hundreds of users across the UK, with deals initially arranged through a Telegram channel under the handle Gorgonites.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes the seizure of AEGIS Marketplace, announced on 17 March 2026 by the London Metropolitan Police’s Cyber Crime Unit. AEGIS Marketplace allowed sellers to market drugs to buyers using cryptocurrency, and by March 2026 it had 30 active sellers and an estimated 10,000 drug sales in ten months. Officers infiltrated the site and retrieved server data that helped identify administrators, sellers, and customers.\u003c/p\u003e\n\n\u003cp\u003eA third case involved two suspects arrested in Romania on 19 January 2026 as part of an ERSOU investigation into Online Killers Marketplace, a bogus dark web site offering services including murder and extortion. The investigation led to the seizure of at least $600,000 in cryptocurrency, almost €50,000 in cash, and around £48,000 worth of Romanian Leu. The article argues that while encrypted messaging apps, Tor, cryptocurrency, and online marketplaces make these crimes difficult to prevent, law enforcement can contain them by targeting infrastructure, tracing funds, using undercover accounts, and identifying operational security mistakes.\u003c/p\u003e\n"}]</script>
