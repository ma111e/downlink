<script type="application/json" id="dl-articles">[{"n":2,"title":"F5 patches BIG-IP APM zero-day flaw exploited in RCE attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/f5-warns-of-big-ip-apm-remote-code-execution-zero-day-exploited-in-attacks/","time":"07:17","priority":"MUST READ","score":98,"tldr":"F5 patched CVE-2026-94127, a critical BIG-IP Access Policy Manager flaw that is actively being exploited for remote code execution on deployments configured as OAuth authorization servers. Organizations should apply the updates immediately or use F5’s iRule mitigation and check for compromise indicators.","briefOverview":"\u003cp\u003eF5 released security updates for CVE-2026-94127, a critical zero-day flaw in BIG-IP Access Policy Manager (APM) that has been exploited in remote code execution attacks. The issue affects BIG-IP APM instances configured as OAuth Authorization Servers when both an APM access policy and an OAuth profile are configured on a virtual server. Deployments that use APM only as an OAuth Client or Resource Server, without OAuth authorization-server profiles, are not affected.\u003c/p\u003e\n\n\u003cp\u003eF5 advises customers to investigate for possible compromise when multiple OAuth authentication failures and suspicious commands are followed shortly by a TMM SIGABRT. Organizations unable to install the updates immediately can apply an F5-provided iRule to the affected virtual server as a mitigation. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected networks by Friday; Shadowserver tracks more than 14,700 IP addresses with BIG-IP APM fingerprints, although that number may include patched devices and honeypots.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 released security updates for CVE-2026-94127, a critical BIG-IP Access Policy Manager flaw that the company says has been exploited in remote code execution attacks.","The flaw affects BIG-IP APM deployments configured as OAuth Authorization Servers when an APM access policy and OAuth profile are set on a virtual server.","Deployments that use APM strictly as an OAuth Client or Resource Server without OAuth authorization server profiles are not affected, according to F5.","F5 advises customers to review systems for signs of compromise and provides an iRule mitigation for affected virtual servers when patches cannot be installed immediately.","CISA added CVE-2026-94127 to its Known Exploited Vulnerabilities Catalog and directed U.S. federal agencies to secure affected networks by Friday."],"insights":["A practical sign of possible compromise is a sequence of multiple OAuth authentication failures and suspicious commands followed shortly by a TMM SIGABRT crash.","The affected population is narrower than all BIG-IP APM users: risk depends on the specific combination of an OAuth authorization-server profile and an APM access policy on a virtual server.","Shadowserver identifies more than 14,700 internet-facing IP addresses with BIG-IP APM fingerprints, although the article notes that this total may include patched systems and honeypots.","Organizations unable to patch immediately can apply an F5-provided iRule to the affected virtual server as a temporary mitigation."],"referencedReports":[{"title":"F5 Security Advisory K000162605: CVE-2026-94127","url":"https://my.f5.com/manage/s/article/K000162605","publisher":"f5","context":"The article cites F5's security advisory as the source warning that CVE-2026-94127 has been exploited and describing affected configurations and compromise indicators.","category":"advisory","primary":true},{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/22/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites this CISA alert to report that CVE-2026-94127 was added to the Known Exploited Vulnerabilities Catalog.","category":"advisory","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2026-94127","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-94127","publisher":"cisa","context":"The article references CISA's catalog entry for the federal remediation deadline for this actively exploited flaw.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 released security updates for CVE-2026-94127, a critical zero-day flaw in BIG-IP Access Policy Manager (APM) that has been exploited in remote code execution attacks. The issue affects BIG-IP APM instances configured as OAuth Authorization Servers when both an APM access policy and an OAuth profile are configured on a virtual server. Deployments that use APM only as an OAuth Client or Resource Server, without OAuth authorization-server profiles, are not affected.\u003c/p\u003e\n\n\u003cp\u003eF5 advises customers to investigate for possible compromise when multiple OAuth authentication failures and suspicious commands are followed shortly by a TMM SIGABRT. Organizations unable to install the updates immediately can apply an F5-provided iRule to the affected virtual server as a mitigation. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected networks by Friday; Shadowserver tracks more than 14,700 IP addresses with BIG-IP APM fingerprints, although that number may include patched devices and honeypots.\u003c/p\u003e\n"},{"n":3,"title":"Hackers start exploiting critical WordPress flaw for code execution","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-start-exploiting-critical-wordpress-flaw-for-code-execution/","time":"18:31","priority":"MUST READ","score":98,"tldr":"Attackers are actively exploiting the critical WordPress path-traversal flaw CVE-2026-87902 to write PHP files and potentially execute shell commands on vulnerable sites. Administrators should urgently update to WordPress 7.1.2 or a supported backported release and review logs for malicious requests.","briefOverview":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-87902, a critical WordPress flaw that can allow unauthenticated attackers to write files to disk and potentially execute shell commands. Patchstack observed initial reconnaissance activity less than five hours after WordPress released a patch, and related traffic later increased tenfold. Some payloads merely mark a site as exploitable, while others create files that execute a shell command when accessed.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a path traversal issue in WordPress page-template resolution that can include a chosen readable local PHP file outside the active theme directories. Remote code execution requires specific conditions, including a theme directory whose name starts with \u0026ldquo;page-\u0026rdquo; and a readable local PHP file; the advisory identifies pearcmd.php as an example in certain PHP configurations. WordPress fixed the issue in version 7.1.2 and backported fixes to branches down to 4.7, while versions before 4.6 will not receive a fix. Administrators are advised to update promptly and review logs for malicious requests, including double-encoded traversal sequences in the pagename parameter used with a valid page_id.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are actively exploiting the critical WordPress flaw CVE-2026-87902 to write files that can execute shell commands when accessed.","CVE-2026-87902 is an unauthenticated path traversal issue that can lead to remote code execution under certain conditions, and WordPress assigned it a critical severity score of 9.2 out of 10.","Patchstack observed reconnaissance requests less than five hours after the WordPress 7.1.2 patch was released, followed by a tenfold increase in traffic and payloads intended to write files to disk.","WordPress fixed the flaw in version 7.1.2 and backported fixes to supported branches down to version 4.7, while releases before 4.6 will not receive a fix.","Administrators should update WordPress promptly and review logs for malicious activity, including requests using double-encoded traversal sequences in the pagename parameter alongside a valid page_id."],"insights":["Attackers progressed from identifying vulnerable WordPress sites to attempting file writes within a day, and Patchstack recorded a tenfold increase in related traffic.","Remote command execution depends on specific conditions, including a theme directory beginning with \"page-\" and a readable local PHP file; the article identifies pearcmd.php as a possible target in affected PHP configurations.","Observed payloads use pearcmd's config-create function to write attacker-controlled files to /tmp or /var/tmp, including files designed to execute a shell command when accessed.","The malicious probes use double-encoded directory-traversal sequences in the pagename parameter together with a valid page_id, providing a specific log-review indicator."],"referencedReports":[{"title":"GHSA-7hp8-65ch-5whp","url":"https://github.com/WordPress/wordpress-develop/security/advisories/GHSA-7hp8-65ch-5whp","publisher":"wordpress-security-team","context":"The article cites this official WordPress advisory for the vulnerability's path-traversal behavior, remote-code-execution conditions, and affected PHP environments.","category":"advisory","primary":true},{"title":"CVE-2026-87902: Attackers started probing WordPress sites hours after the patch","url":"https://patchstack.com/articles/cve-2026-87902-attackers-started-probing-wordpress-sites-hours-after-the-patch/","publisher":"patchstack","context":"The article relies on Patchstack's observations of reconnaissance activity, increased exploit traffic, and payloads that write attacker-controlled files.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are actively exploiting CVE-2026-87902, a critical WordPress flaw that can allow unauthenticated attackers to write files to disk and potentially execute shell commands. Patchstack observed initial reconnaissance activity less than five hours after WordPress released a patch, and related traffic later increased tenfold. Some payloads merely mark a site as exploitable, while others create files that execute a shell command when accessed.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is a path traversal issue in WordPress page-template resolution that can include a chosen readable local PHP file outside the active theme directories. Remote code execution requires specific conditions, including a theme directory whose name starts with \u0026ldquo;page-\u0026rdquo; and a readable local PHP file; the advisory identifies pearcmd.php as an example in certain PHP configurations. WordPress fixed the issue in version 7.1.2 and backported fixes to branches down to 4.7, while versions before 4.6 will not receive a fix. Administrators are advised to update promptly and review logs for malicious requests, including double-encoded traversal sequences in the pagename parameter used with a valid page_id.\u003c/p\u003e\n"},{"n":9,"title":"Check Point warns of hackers exploiting Security Gateway VPN RCE flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-warns-of-hackers-exploiting-security-gateway-vpn-rce-flaw/","time":"19:53","priority":"MUST READ","score":97,"tldr":"Check Point confirmed active exploitation of two pre-authentication flaws, CVE-2026-85102 in Security Gateway VPN certificate handling and CVE-2026-93616 in its Management web service. Organizations should immediately apply the specified LivePatch or hotfix updates and restrict VPN access if patching is not possible.","briefOverview":"\u003cp\u003eCheck Point has confirmed active exploitation of CVE-2026-85102, a pre-authentication remote code execution flaw in the VPN certificate-handling functionality of its Security Gateway product. The company also warned about CVE-2026-93616, a pre-authentication path traversal flaw in its Management web service that can allow script execution and Java class loading. Check Point says CVE-2026-93616 has been exploited as a zero-day since July 23, while exploitation attempts against Spark customers involving CVE-2026-85102 began on September 12.\u003c/p\u003e\n\n\u003cp\u003eCheck Point observed the attempts coming from anonymization infrastructure, including VPN services and proxies, and identified several certificate subjects used in current activity. CISA added both flaws to its Known Exploited Vulnerabilities catalog and told U.S. federal agencies to apply fixes or mitigations by September 25, 2026. Check Point recommends LivePatch Take 26 or specified fixed hotfix versions for supported Security Gateway releases, plus updated Spark firewall builds; where updates cannot be installed, it advises restricting VPN access with explicit network rules, although those mitigations do not apply to locally managed Spark firewalls.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point confirmed active exploitation of CVE-2026-85102, a flaw in Security Gateway VPN certificate handling that can let an attacker run code before logging in.","The company also warned that CVE-2026-93616, affecting its Management web service, has been exploited as a previously unknown flaw since July 23 and can enable script execution and Java class loading.","Check Point observed exploitation attempts against Spark customers beginning September 12, 2026, originating from anonymization infrastructure including VPN services and proxies.","CISA added both CVE-2026-85102 and CVE-2026-93616 to its Known Exploited Vulnerabilities catalog and directed U.S. federal agencies to apply fixes or mitigations by September 25, 2026.","Check Point recommends installing LivePatch Take 26 or the applicable fixed Jumbo Hotfix for supported Security Gateway versions, and updating Spark firewalls to the specified fixed releases."],"insights":["Organizations that previously installed an earlier offline LivePatch package may still lack full protection unless they install LivePatch Take 26.","The temporary network-rule mitigation does not apply to locally managed Spark firewalls, making software updates especially important for those deployments.","The certificate subjects observed in attacks are useful for investigation, but Check Point cautions that they represent only current observations and attackers may use additional subjects.","The two actively exploited issues affect different entry points: Security Gateway VPN certificate handling and the Management web service, so addressing only one does not cover both risks."],"referencedReports":[{"title":"Security Advisory: Action Required: Active Exploitation of CVE-2026-85102 and a Management Pre-Authentication Vulnerability CVE-2026-93616","url":"https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/","publisher":"check-point","context":"The article cites this Check Point alert as confirmation that exploitation attempts against Spark customers began on September 12, 2026.","category":"advisory","primary":true},{"title":"CVE-2026-85102 Security Gateway VPN certificate-handling advisory","url":"https://support.checkpoint.com/results/sk/sk1000117","publisher":"check-point","context":"The article references this Check Point advisory for fixed LivePatch and Jumbo Hotfix versions and interim VPN-rule mitigations.","category":"advisory","primary":true},{"title":"CVE-2026-93616 Management web service mitigation and hunting guidance","url":"https://support.checkpoint.com/results/sk/sk1000171/","publisher":"check-point","context":"The article directs readers to this Check Point support article for mitigation and investigation guidance for the Management web service flaw.","category":"advisory","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article notes that CISA added both Check Point flaws to this catalog and set a September 25, 2026 remediation deadline for federal agencies.","category":"advisory","primary":false}],"body":"\u003cp\u003eCheck Point has confirmed active exploitation of CVE-2026-85102, a pre-authentication remote code execution flaw in the VPN certificate-handling functionality of its Security Gateway product. The company also warned about CVE-2026-93616, a pre-authentication path traversal flaw in its Management web service that can allow script execution and Java class loading. Check Point says CVE-2026-93616 has been exploited as a zero-day since July 23, while exploitation attempts against Spark customers involving CVE-2026-85102 began on September 12.\u003c/p\u003e\n\n\u003cp\u003eCheck Point observed the attempts coming from anonymization infrastructure, including VPN services and proxies, and identified several certificate subjects used in current activity. CISA added both flaws to its Known Exploited Vulnerabilities catalog and told U.S. federal agencies to apply fixes or mitigations by September 25, 2026. Check Point recommends LivePatch Take 26 or specified fixed hotfix versions for supported Security Gateway releases, plus updated Spark firewall builds; where updates cannot be installed, it advises restricting VPN access with explicit network rules, although those mitigations do not apply to locally managed Spark firewalls.\u003c/p\u003e\n"},{"n":7,"title":"Arista patches actively exploited VeloCloud Orchestrator zero-day","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/arista-patches-actively-exploited-velocloud-orchestrator-zero-day/","time":"12:29","priority":"MUST READ","score":96,"tldr":"Arista Networks has patched CVE-2026-93952, a maximum-severity VeloCloud Orchestrator zero-day actively exploited to access privileged internal VCO functionality without tenant credentials. Administrators should patch immediately, restrict VCO web access, and investigate logs and indicators tied to the known malicious IP addresses.","briefOverview":"\u003cp\u003eArista Networks released security patches for CVE-2026-93952, a maximum-severity zero-day affecting on-premises VeloCloud Orchestrator deployments that is known to be actively exploited. The flaw is caused by improper input validation and affects setups using certificate-based authentication between VeloCloud Edge and VeloCloud Orchestrator. Arista said an attacker can access privileged internal VCO host functionality through a low-complexity attack without target-system privileges, user interaction, or VCO tenant or operator credentials.\u003c/p\u003e\n\n\u003cp\u003eA successful attack requires network access to the VCO web interface and access to the public portion of a VeloCloud Edge authentication certificate. Arista has already patched hosted deployments on VCO 5.2.3.16 or later and 6.4.2.8 or later, and plans fixes for instances running 6.1.3.7 and below and 7.0.0.2 and below. CISA added the flaw to its Known Exploited Vulnerabilities catalog and ordered U.S. federal civilian executive branch agencies to secure affected networks by September 25. Arista advised administrators to limit VCO web access to administrative networks, review logs and administrator activity, block two listed IP addresses, and preserve relevant logs if compromise is suspected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arista Networks released patches for CVE-2026-93952, a maximum-severity VeloCloud Orchestrator On-Prem flaw that is known to be actively exploited.","The flaw affects deployments where certificate-based authentication is configured between VeloCloud Edge devices and VeloCloud Orchestrator.","An attacker with network access to the VCO web interface and the public portion of an Edge authentication certificate can access privileged internal VCO host functionality without tenant or operator credentials.","Arista said hosted deployments running VCO 5.2.3.16 or later and VCO 6.4.2.8 or later have already been patched, with fixes planned for other affected versions.","CISA added CVE-2026-93952 to its Known Exploited Vulnerabilities catalog and directed U.S. federal civilian executive branch agencies to secure affected systems by September 25."],"insights":["The exposure does not require VCO tenant or operator credentials, but it does require network access to the VCO web interface and the public portion of a VeloCloud Edge authentication certificate.","Arista specifically recommends restricting VCO web-interface access to administrative networks while patches are deployed, indicating that limiting web exposure is an immediate mitigation step.","Defenders can look for the x-vc-opt HTTP header in nginx logs, encoded characters or unusual path components in web requests, and outbound HTTP or HTTPS connections from the VCO host.","Arista has patched two other actively exploited zero-day flaws affecting EOS and on-premises VeloCloud Orchestrator deployments since the start of the year."],"referencedReports":[{"title":"Security Advisory 0183","url":"https://www.arista.com/en/support/advisories-notices/security-advisory/24765-security-advisory-0183","publisher":"arista-networks","context":"Arista's Tuesday advisory warns that CVE-2026-93952 is actively exploited and provides affected versions and mitigation guidance.","category":"advisory","primary":true},{"title":"CISA Adds Four Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/22/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's alert announcing that CVE-2026-93952 was added to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003eArista Networks released security patches for CVE-2026-93952, a maximum-severity zero-day affecting on-premises VeloCloud Orchestrator deployments that is known to be actively exploited. The flaw is caused by improper input validation and affects setups using certificate-based authentication between VeloCloud Edge and VeloCloud Orchestrator. Arista said an attacker can access privileged internal VCO host functionality through a low-complexity attack without target-system privileges, user interaction, or VCO tenant or operator credentials.\u003c/p\u003e\n\n\u003cp\u003eA successful attack requires network access to the VCO web interface and access to the public portion of a VeloCloud Edge authentication certificate. Arista has already patched hosted deployments on VCO 5.2.3.16 or later and 6.4.2.8 or later, and plans fixes for instances running 6.1.3.7 and below and 7.0.0.2 and below. CISA added the flaw to its Known Exploited Vulnerabilities catalog and ordered U.S. federal civilian executive branch agencies to secure affected networks by September 25. Arista advised administrators to limit VCO web access to administrative networks, review logs and administrator activity, block two listed IP addresses, and preserve relevant logs if compromise is suspected.\u003c/p\u003e\n"},{"n":12,"title":"Is This A Joke? In The Auth Header? (F5 BIG-IP UnAuth Heap-Overflow to RCE CVE-2026-94127)","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/is-this-a-joke-in-the-auth-header-f5-big-ip-unauth-heap-overflow-to-rce-cve-2026-94127/","time":"23:19","priority":"MUST READ","score":96,"tldr":"watchTowr Labs found that CVE-2026-94127 is an unauthenticated heap overflow in F5 BIG-IP APM OAuth endpoints, triggered by an oversized Authorization header and potentially enabling remote code execution. Affected BIG-IP APM deployments should apply F5’s hotfixes immediately.","briefOverview":"\u003cp\u003ewatchTowr Labs analyzed CVE-2026-94127, a flaw in F5 BIG-IP Access Policy Manager (APM) OAuth functionality. F5’s advisory lists BIG-IP APM 21.1.0 and specified 17.x versions as affected, with hotfixes available for those branches. The issue is notable because BIG-IP devices can sit at the edge of a network, handling traffic, TLS termination, and authentication-related functions.\u003c/p\u003e\n\n\u003cp\u003eThe researchers found that vulnerable code allocated a fixed 0x4100-byte heap buffer and copied an Authorization header value into it without checking its size first. The patch adds a check that rejects Authorization headers larger than 0x4100 bytes, and the researchers triggered a crash on an unpatched OAuth-configured system by sending an oversized Bearer Authorization header to an OAuth endpoint. They reported that, in many test runs, the overflow could overwrite a nearby callback function pointer; although SELinux blocked a direct shell launch, they described using a crash-triggered script to run a command.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-94127 affects F5 BIG-IP APM OAuth functionality in BIG-IP APM 21.1.0 and selected 17.x releases, while F5 lists hotfixes for the affected branches.","The patched code rejects Authorization header values larger than 0x4100 bytes before copying them into a heap buffer of the same size.","On an unpatched system with an OAuth profile configured, sending an Authorization header larger than 0x4100 bytes to an OAuth endpoint caused the target process to crash.","The researchers reported that a heap object containing a callback function pointer landed after the overflowing buffer in roughly 90% of their test runs, allowing the function pointer to be overwritten.","Although SELinux blocked an attempted shell launch, the researchers described appending a command to the /etc/bigstart/scripts/tmm.finish crash hook script as a way to run a command after the target process crashed."],"insights":["The flaw is confined in F5’s advisory to BIG-IP APM, even though BIG-IP’s other modules and BIG-IQ Centralized Management are listed as not affected.","The vulnerable code allocated a fixed 0x4100-byte buffer and copied the Authorization header into it without first checking the header’s length, while the fix was a direct size check.","The article’s proof of concept required an OAuth profile to be configured and an OAuth endpoint to be reachable, making that configuration relevant to exposure.","System-wide address randomization and non-executable heap and stack protections were enabled, but the main BIG-IP binary was not built as a position-independent executable.","SELinux prevented the researchers from directly launching a shell, but they found that modifying the script run after the traffic-management process crashes could still execute a command."],"referencedReports":[{"title":"K000162605","url":"https://my.f5.com/manage/s/article/K000162605?ref=labs.watchtowr.com","publisher":"f5","context":"The article cites F5’s official advisory for the affected BIG-IP APM versions and available hotfixes for CVE-2026-94127.","category":"advisory","primary":true}],"body":"\u003cp\u003ewatchTowr Labs analyzed CVE-2026-94127, a flaw in F5 BIG-IP Access Policy Manager (APM) OAuth functionality. F5’s advisory lists BIG-IP APM 21.1.0 and specified 17.x versions as affected, with hotfixes available for those branches. The issue is notable because BIG-IP devices can sit at the edge of a network, handling traffic, TLS termination, and authentication-related functions.\u003c/p\u003e\n\n\u003cp\u003eThe researchers found that vulnerable code allocated a fixed 0x4100-byte heap buffer and copied an Authorization header value into it without checking its size first. The patch adds a check that rejects Authorization headers larger than 0x4100 bytes, and the researchers triggered a crash on an unpatched OAuth-configured system by sending an oversized Bearer Authorization header to an OAuth endpoint. They reported that, in many test runs, the overflow could overwrite a nearby callback function pointer; although SELinux blocked a direct shell launch, they described using a crash-triggered script to run a command.\u003c/p\u003e\n"},{"n":20,"title":"MikroTrick Chain Let Attackers Take Over MikroTik Routers Without a Password or SSH Key","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/mikrotrick-chain-let-attackers-take.html","time":"16:06","priority":"MUST READ","score":96,"tldr":"CERT Polska says attackers are actively chaining two MikroTik RouterOS SSH flaws, CVE-2026-67279 and CVE-2026-86060, to gain full administrator access to Internet-exposed routers without credentials. Administrators should urgently update RouterOS, restrict public SSH access, and investigate devices for indicators such as failed logins using the username \"-2\" or unauthorized \"ops\" accounts.","briefOverview":"\u003cp\u003eCERT Polska’s technical analysis identifies the MikroTrick attack chain as two MikroTik RouterOS SSH flaws, CVE-2026-67279 and CVE-2026-86060. When chained, they allow attackers to take full administrative control of Internet-exposed routers without a password, SSH key, or completed authentication. Evidence in logs indicates the chain was exploited before MikroTik released patches on September 3. MikroTik fixed the flaws in RouterOS versions 6.49.21, 7.23.4, and 7.24.2.\u003c/p\u003e\n\n\u003cp\u003eThe first flaw lets an unauthenticated SSH client reach the command stage by forcing key renegotiation during login, while the second makes the RouterOS login program treat the username \u0026ldquo;-2\u0026rdquo; as an option. This enables the attacker to supply a chosen username and a full-administrator privilege level through the SSH session, opening a privileged console. CERT Polska cited indicators including failed SSH logins for \u0026ldquo;-2,\u0026rdquo; unauthorized \u0026ldquo;ops\u0026rdquo; administrator accounts, and activity involving IP addresses 82.192.72.4 and 103.102.31.18. Patching stops the attack but does not remove prior changes, so administrators who find indicators should isolate and reset affected devices, rebuild from a trusted configuration, and change credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT Polska’s MikroTrick analysis describes a chain of CVE-2026-67279 and CVE-2026-86060 that can give an unauthenticated attacker full administrative control of an Internet-exposed MikroTik RouterOS device over SSH.","CVE-2026-67279 lets a client reach the SSH command stage by triggering key renegotiation during authentication, while CVE-2026-86060 allows the username \"-2\" to be interpreted by the RouterOS login program as an option that reads identity and privilege data from the session terminal.","MikroTik released patches in RouterOS versions 6.49.21, 7.23.4, and 7.24.2, but CERT Polska found evidence that the chain was exploited before those fixes were available.","Observed indicators include SSH login attempts using the username \"-2,\" creation of a fully privileged \"ops\" account, and activity involving IP addresses 82.192.72.4 and 103.102.31.18.","CERT Polska recommends that administrators finding compromise indicators isolate the router, preserve logs and configuration, factory reset and rebuild it from a trusted configuration, and change all passwords and keys."],"insights":["Updating RouterOS prevents further use of the chain but does not undo accounts, configuration changes, or data theft that may have occurred before patching.","The RouterOS Flagged status can detect only selected signs of compromise, so a device not marked as flagged cannot be assumed to be clean.","A failed SSH login for the unusual username \"-2\" is a particularly useful investigation clue because it reflects the argument-handling behavior used in the observed attack chain.","The two flaws have complementary roles: one bypasses the normal point at which SSH verifies identity, while the other turns access to the login process into a fully privileged console.","The risk is concentrated on devices whose SSH service is reachable from untrusted public networks; MikroTik says its default home configuration does not expose SSH to the internet."],"referencedReports":[{"title":"MikroTrick Technical Analysis","url":"https://cert.pl/en/posts/2026/09/mikrotrick-technical-analysis/","publisher":"cert-polska","context":"The article relies on CERT Polska's technical analysis to identify the two RouterOS flaws in the MikroTrick chain and explain how they produce administrative access.","category":"research","primary":true},{"title":"Diagnostic Report on the MikroTik Forum","url":"https://forum.mikrotik.com/t/important-security-update/272851/105","publisher":"mikrotik-forum","context":"The article cites this diagnostic report as evidence of an observed attack sequence involving the username \"-2,\" forced renegotiation, and an attempt to create a privileged \"ops\" account.","category":"research","primary":false}],"body":"\u003cp\u003eCERT Polska’s technical analysis identifies the MikroTrick attack chain as two MikroTik RouterOS SSH flaws, CVE-2026-67279 and CVE-2026-86060. When chained, they allow attackers to take full administrative control of Internet-exposed routers without a password, SSH key, or completed authentication. Evidence in logs indicates the chain was exploited before MikroTik released patches on September 3. MikroTik fixed the flaws in RouterOS versions 6.49.21, 7.23.4, and 7.24.2.\u003c/p\u003e\n\n\u003cp\u003eThe first flaw lets an unauthenticated SSH client reach the command stage by forcing key renegotiation during login, while the second makes the RouterOS login program treat the username \u0026ldquo;-2\u0026rdquo; as an option. This enables the attacker to supply a chosen username and a full-administrator privilege level through the SSH session, opening a privileged console. CERT Polska cited indicators including failed SSH logins for \u0026ldquo;-2,\u0026rdquo; unauthorized \u0026ldquo;ops\u0026rdquo; administrator accounts, and activity involving IP addresses 82.192.72.4 and 103.102.31.18. Patching stops the attack but does not remove prior changes, so administrators who find indicators should isolate and reset affected devices, rebuild from a trusted configuration, and change credentials.\u003c/p\u003e\n"},{"n":21,"title":"F5 Patches Critical BIG-IP APM Zero-Day Exploited for Unauthenticated RCE on OAuth Servers","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/f5-patches-critical-big-ip-apm-zero-day.html","time":"08:29","priority":"MUST READ","score":96,"tldr":"F5 has issued emergency hotfixes for CVE-2026-94127, a critical actively exploited BIG-IP APM flaw that enables unauthenticated remote code execution when APM is configured as an OAuth authorization server. Organizations should apply the branch-specific hotfix or F5’s temporary iRule mitigation immediately and investigate affected systems for compromise indicators.","briefOverview":"\u003cp\u003eF5 has disclosed and patched CVE-2026-94127, a critical heap-based buffer overflow in BIG-IP Access Policy Manager that attackers are actively exploiting for remote code execution without authentication. The issue affects deployments where APM acts as an OAuth authorization server, issuing access tokens, and where an APM access policy and OAuth authorization-server profile are configured on the same virtual server. F5 rates the flaw 9.8 out of 10 under CVSS v3.1, and CISA added it to the Known Exploited Vulnerabilities catalog on September 22.\u003c/p\u003e\n\n\u003cp\u003eRestricting the BIG-IP management interface does not protect against the flaw because malicious traffic is sent to the OAuth-facing virtual server; systems in Appliance mode are also vulnerable. F5 released engineering hotfixes for affected BIG-IP 17.1, 17.5, and 21.1 branches, and offers an iRule mitigation through support when patching cannot happen immediately. Organizations should also check for repeated invalid OAuth token requests, suspicious audit-log commands, and TMM crashes, while recognizing that F5 has not stated whether the hotfix removes any attacker access already established.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 reports that CVE-2026-94127 is being actively exploited and can allow unauthenticated remote code execution on affected BIG-IP Access Policy Manager systems.","The flaw affects BIG-IP deployments where Access Policy Manager acts as an OAuth authorization server and has an access policy and authorization-server profile on the same virtual server.","F5 rates the heap-based buffer overflow at 9.8 out of 10 under CVSS v3.1 and has released engineering hotfixes for BIG-IP 17.1, 17.5, and 21.1.","CISA added CVE-2026-94127 to its Known Exploited Vulnerabilities catalog and directed U.S. federal civilian agencies to apply mitigations by September 25.","F5 advises using a branch-specific hotfix or, when that cannot be installed immediately, an iRule mitigation available through F5 support."],"insights":["Restricting access to the BIG-IP management interface does not mitigate this issue because the malicious traffic is sent to the OAuth-facing virtual server, and Appliance mode systems are also vulnerable.","The affected condition is narrower than some early advisories indicated: F5 says only APM deployments acting as OAuth authorization servers are affected, while APM OAuth clients and resource servers without authorization-server profiles are not.","Organizations already running fixes for the earlier APM issue CVE-2025-53521 may still be exposed, because the relevant 17.1 and 17.5 fixed builds remain within the affected ranges for CVE-2026-94127.","F5’s reported compromise pattern is a sequence rather than a single signal: repeated invalid-token UserInfo failures, suspicious audit-log commands, and then a TMM SIGABRT shortly afterward should prompt human review.","F5 did not assess BIG-IP versions that have reached End of Technical Support, so those versions should be treated as having an unknown status rather than as unaffected."],"referencedReports":[{"title":"F5 Security Advisory K000162605","url":"https://my.f5.com/manage/s/article/K000162605","publisher":"f5","context":"F5 disclosed CVE-2026-94127 in this advisory and provided affected-version and hotfix information.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog Entry for CVE-2026-94127","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article says CISA added the actively exploited flaw to its KEV catalog and set a mitigation deadline for U.S. federal civilian agencies.","category":"advisory","primary":false},{"title":"CERT-EU Security Advisory 2026-013","url":"https://cert.europa.eu/publications/security-advisories/2026-013","publisher":"cert-eu","context":"The article cites this advisory for compromise indicators and its recommendation to preserve evidence, patch, and begin incident response if compromise is found.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 has disclosed and patched CVE-2026-94127, a critical heap-based buffer overflow in BIG-IP Access Policy Manager that attackers are actively exploiting for remote code execution without authentication. The issue affects deployments where APM acts as an OAuth authorization server, issuing access tokens, and where an APM access policy and OAuth authorization-server profile are configured on the same virtual server. F5 rates the flaw 9.8 out of 10 under CVSS v3.1, and CISA added it to the Known Exploited Vulnerabilities catalog on September 22.\u003c/p\u003e\n\n\u003cp\u003eRestricting the BIG-IP management interface does not protect against the flaw because malicious traffic is sent to the OAuth-facing virtual server; systems in Appliance mode are also vulnerable. F5 released engineering hotfixes for affected BIG-IP 17.1, 17.5, and 21.1 branches, and offers an iRule mitigation through support when patching cannot happen immediately. Organizations should also check for repeated invalid OAuth token requests, suspicious audit-log commands, and TMM crashes, while recognizing that F5 has not stated whether the hotfix removes any attacker access already established.\u003c/p\u003e\n"},{"n":26,"title":"New cPanel Flaw Lets a Hosting Account Run Code as Root, Take Full Server Control","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/new-cpanel-flaw-lets-hosting-account_0272795595.html","time":"12:16","priority":"MUST READ","score":95,"tldr":"cPanel patched a critical CalDAV/CardDAV flaw (CVE-2026-87899) that lets any logged-in hosting account execute code as root and fully compromise affected shared servers. Administrators should urgently update cPanel \u0026 WHM and WP Toolkit, which also has a separate cross-account database modification flaw.","briefOverview":"\u003cp\u003ecPanel released fixes for three flaws affecting its CalDAV/CardDAV service and WP Toolkit. The most serious, CVE-2026-87899, allows a logged-in cPanel account holder to run code as root and take full control of an affected server. On shared hosting systems, this could allow any customer, or someone with a stolen customer login, to compromise the server.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-87900 affects WP Toolkit and can allow a logged-in cPanel user to modify databases belonging to other accounts, while CVE-2026-68490 can let a local user read other accounts’ calendar events and contacts. The CalDAV/CardDAV issues affect cPanel \u0026amp; WHM version 120 and later, with fixes available in specified 11.134, 11.136, and 11.138 builds, while WP Toolkit is fixed in version 6.11.3 or later. cPanel provided no temporary workaround for systems that cannot be updated, and the advisories did not state whether exploitation had occurred or explain how to identify prior compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["cPanel disclosed CVE-2026-87899, a CalDAV and CardDAV flaw that allows a logged-in hosting account holder to run code as root on affected cPanel \u0026 WHM servers.","The root-level flaw affects cPanel \u0026 WHM version 120 and later and is fixed in specified 11.134, 11.136, and 11.138 builds, as well as WP Squared 11.138.1.11 or later.","CVE-2026-87900 affects WP Toolkit 6.11.2-10794 and older and can allow a logged-in cPanel user to modify databases belonging to other accounts; version 6.11.3 fixes it.","CVE-2026-68490 can allow a local server user to read other accounts’ calendar events and contacts, and the cPanel update repairs calendar and contact permissions for existing accounts.","The advisories did not state whether the flaws had been exploited or provide a method to determine whether a server had been attacked before it was updated."],"insights":["On shared hosting servers, the root-level flaw means any paying customer with a cPanel account, or anyone who obtains that customer’s login, could potentially take control of the entire server.","cPanel provides no temporary workaround for the CalDAV/CardDAV flaws, making installation of the fixed cPanel \u0026 WHM builds the stated remediation path.","Updating cPanel \u0026 WHM alone may not address all three issues because WP Toolkit is installed and updated as a separate package.","The advisories provide neither evidence of exploitation nor a way to determine whether a server was compromised before updating, which limits retrospective verification."],"referencedReports":[{"title":"Security CVE-2026-87899: Vulnerability in cPanel's CalDAV/CardDAV","url":"https://support.cpanel.net/hc/en-us/articles/43591715125271-Security-CVE-2026-87899-Vulnerability-in-cPanel-s-CalDAV-CardDAV-September-22-2026","publisher":"cPanel","context":"The article cites this cPanel security advisory for the flaw allowing a logged-in account holder to run code as root.","category":"advisory","primary":true},{"title":"Security CVE-2026-87900: Vulnerability in WP Toolkit Database Creation","url":"https://support.cpanel.net/hc/en-us/articles/43597969409943-Security-CVE-2026-87900-Vulnerability-in-WP-Toolkit-Database-Creation-September-22-2026","publisher":"cPanel","context":"The article cites this cPanel security advisory for the WP Toolkit issue that can allow database changes in other accounts.","category":"advisory","primary":true},{"title":"Security CVE-2026-68490: Vulnerability in cPanel's CalDAV/CardDAV Functionality","url":"https://support.cpanel.net/hc/en-us/articles/43502940099991-Security-CVE-2026-68490-Vulnerability-in-cPanel-s-CalDAV-CardDAV-Functionality-September-22-2026","publisher":"cPanel","context":"The article cites this cPanel security advisory for the issue exposing other accounts' calendar events and contacts to a local user.","category":"advisory","primary":true},{"title":"Vulnerability in Plesk's Backup Manager: Symlink Race During Restore Allows Root Privilege Escalation","url":"https://support.plesk.com/hc/en-us/articles/43248932867351-Vulnerability-in-Plesk-s-Backup-Manager-symlink-race-during-restore-allows-root-privilege-escalation","publisher":"Plesk","context":"The article references this Plesk advisory as one of two September 10 fixes that could allow a customer to take over a server.","category":"advisory","primary":false},{"title":"Vulnerability in Plesk's Backup Manager: Unsigned Backup Header Allows Path Traversal","url":"https://support.plesk.com/hc/en-us/articles/43248841638551-Vulnerability-in-Plesk-s-Backup-Manager-unsigned-backup-header-allows-path-traversal","publisher":"Plesk","context":"The article references this Plesk advisory for a backup-header handling flaw that could allow server takeover.","category":"advisory","primary":false}],"body":"\u003cp\u003ecPanel released fixes for three flaws affecting its CalDAV/CardDAV service and WP Toolkit. The most serious, CVE-2026-87899, allows a logged-in cPanel account holder to run code as root and take full control of an affected server. On shared hosting systems, this could allow any customer, or someone with a stolen customer login, to compromise the server.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-87900 affects WP Toolkit and can allow a logged-in cPanel user to modify databases belonging to other accounts, while CVE-2026-68490 can let a local user read other accounts’ calendar events and contacts. The CalDAV/CardDAV issues affect cPanel \u0026amp; WHM version 120 and later, with fixes available in specified 11.134, 11.136, and 11.138 builds, while WP Toolkit is fixed in version 6.11.3 or later. cPanel provided no temporary workaround for systems that cannot be updated, and the advisories did not state whether exploitation had occurred or explain how to identify prior compromise.\u003c/p\u003e\n"},{"n":27,"title":"Chinese Hackers Exploit Chrome-Windows Zero-Day Chain to Deploy CLEANGULP Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/chinese-hackers-exploit-chrome-windows.html","time":"08:29","priority":"MUST READ","score":95,"tldr":"Chinese-linked UTA0565 used a zero-day chain in Google Chrome and Windows to escape the browser sandbox and deploy CLEANGULP malware through phishing emails and fake websites targeting Asian government entities.","briefOverview":"\u003cp\u003eChinese threat actor UTA0565 exploited a chain of previously undisclosed flaws in Google Chrome and Microsoft Windows through fake websites on September 3 and 4, 2026. The chain combined CVE-2026-85046, CVE-2026-87491, and CVE-2026-85880 to bypass Chrome’s protective boundary and run code on victims’ computers. Volexity said the group posed as media organizations and an NGO, using multiple fake sites to deceive targets.\u003c/p\u003e\n\n\u003cp\u003eOne campaign sent Chinese- and English-language phishing emails to Asian government entities while impersonating the Center for American Progress and promoting support for Hong Kong activist Chow Hang-tung. The messages linked to imitation China Digital Times and CAP websites, which silently loaded the BlueMoon exploit kit and downloaded CLEANGULP as chrome_cleanup.exe. CLEANGULP can run commands, list processes, transfer files, and execute beacon object files, while communicating with the lookalike command-and-control domain thecovnresation[.]com. Volexity said BlueMoon’s use by multiple Chinese-linked groups suggests its core kit was shared, customized, and weaponized across the Chinese cyber-espionage community.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Chinese threat actor UTA0565 exploited a chain of Chrome and Windows zero-day vulnerabilities through fake websites on September 3 and 4, 2026.","The exploit chain combined CVE-2026-85046, CVE-2026-87491, and CVE-2026-85880 to escape Chrome’s sandbox and execute code on affected Windows systems.","Asian government entities received Chinese- and English-language phishing emails impersonating the Center for American Progress and urging support for Hong Kong activist Chow Hang-tung.","The fake sites chinadigitaltimes[.]top and americanprgoress[.]top loaded the BlueMoon exploit kit and downloaded the CLEANGULP malware as chrome_cleanup.exe.","CLEANGULP can run commands, list processes, upload and download files, and execute beacon object files, and it communicates with the hard-coded domain thecovnresation[.]com."],"insights":["UTA0565 used multiple impersonated websites rather than a single lure, a departure from previously documented attacks attributed to the group.","The campaign hid its exploit-delivery page in an invisible embedded webpage, allowing the visible fake sites to resemble legitimate China Digital Times and Center for American Progress pages.","CLEANGULP’s command-and-control domain, thecovnresation[.]com, was deliberately styled to resemble the legitimate media outlet theconversation[.]com.","Volexity reported that the same BlueMoon exploit kit has been adopted by multiple Chinese-linked threat actors, indicating that its core components were shared and customized across groups."],"referencedReports":[{"title":"Mind the Patch Gap Part 2: Fake Websites Used to Deploy Chrome \u0026 Windows 0-Day Exploits","url":"https://www.volexity.com/blog/2026/09/21/mind-the-patch-gap-part-2-fake-websites-used-to-deploy-chrome-windows-0-day-exploits/","publisher":"volexity","context":"The article relies on Volexity's technical analysis for details of UTA0565's fake websites, exploit chain, and CLEANGULP deployment.","category":"research","primary":true}],"body":"\u003cp\u003eChinese threat actor UTA0565 exploited a chain of previously undisclosed flaws in Google Chrome and Microsoft Windows through fake websites on September 3 and 4, 2026. The chain combined CVE-2026-85046, CVE-2026-87491, and CVE-2026-85880 to bypass Chrome’s protective boundary and run code on victims’ computers. Volexity said the group posed as media organizations and an NGO, using multiple fake sites to deceive targets.\u003c/p\u003e\n\n\u003cp\u003eOne campaign sent Chinese- and English-language phishing emails to Asian government entities while impersonating the Center for American Progress and promoting support for Hong Kong activist Chow Hang-tung. The messages linked to imitation China Digital Times and CAP websites, which silently loaded the BlueMoon exploit kit and downloaded CLEANGULP as chrome_cleanup.exe. CLEANGULP can run commands, list processes, transfer files, and execute beacon object files, while communicating with the lookalike command-and-control domain thecovnresation[.]com. Volexity said BlueMoon’s use by multiple Chinese-linked groups suggests its core kit was shared, customized, and weaponized across the Chinese cyber-espionage community.\u003c/p\u003e\n"},{"n":42,"title":"MemTensor npm and PyPI Packages Compromised in Credential-Stealing Supply Chain Attack","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/memtensor-compromise?utm_medium=feed","time":"09:16","priority":"MUST READ","score":95,"tldr":"Malicious releases of MemTensor’s npm OpenClaw plugin and PyPI MemoryOS package bundled a cross-platform Go payload, sckit, that runs automatically to steal developer credentials and send them to skyleen.fr infrastructure. Organizations that installed the affected versions should treat hosts as compromised, remove or pin the packages, rotate accessible secrets, and hunt for related C2 activity.","briefOverview":"\u003cp\u003eMalicious releases of MemTensor\u0026rsquo;s npm package \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e—versions \u003ccode\u003e0.1.21\u003c/code\u003e, \u003ccode\u003e0.1.23\u003c/code\u003e, and \u003ccode\u003e0.1.25\u003c/code\u003e—and PyPI package \u003ccode\u003eMemoryOS==2.0.34\u003c/code\u003e were published on September 23, 2026. The affected releases bundle cross-platform Go binaries named \u003ccode\u003esckit\u003c/code\u003e that launch in the background and search developer home directories and environment variables for credentials. At the time of writing, npm \u003ccode\u003e0.1.25\u003c/code\u003e and PyPI \u003ccode\u003e2.0.34\u003c/code\u003e were the latest versions, so default installs could retrieve compromised builds.\u003c/p\u003e\n\n\u003cp\u003eIn the npm plugin, the payload runs when the OpenClaw gateway starts and again for each memory recall, receiving the user\u0026rsquo;s prompt text through \u003ccode\u003eSCKIT_EVENT_TEXT\u003c/code\u003e. In the PyPI package, importing \u003ccode\u003ememos\u003c/code\u003e is enough to start the payload because the altered logging setup triggers it during module initialization. The embedded configuration identifies \u003ccode\u003eskyleen[.]fr\u003c/code\u003e subdomains as command-and-control infrastructure and shows that the payload targets credentials for services including npm, PyPI, GitHub, GitLab, AWS, Vault, and SSH.\u003c/p\u003e\n\n\u003cp\u003eThe article advises treating any host that loaded the affected npm versions or imported \u003ccode\u003eMemoryOS==2.0.34\u003c/code\u003e as compromised, including developer machines, CI runners, and test containers. Recommended actions include removing or pinning the packages to known-good versions, rotating secrets available to the affected account, killing \u003ccode\u003esckit\u003c/code\u003e processes, deleting related cache directories, and reviewing network activity for connections to \u003ccode\u003eskyleen[.]fr\u003c/code\u003e. Organizations are also advised to review their own package releases if exposed machines held npm or PyPI publishing tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Malicious releases of the npm package @memtensor/memos-cloud-openclaw-plugin versions 0.1.21, 0.1.23, and 0.1.25, along with PyPI package MemoryOS version 2.0.34, were published on September 23, 2026.","The compromised packages bundle cross-platform Go binaries named sckit that run in the background and search developer home directories and environment variables for credentials.","The npm plugin launches the payload when the OpenClaw gateway starts and during memory recall, passing the user’s prompt text to it, while MemoryOS launches it when the memos module is imported.","The payload configuration identifies skyleen.fr subdomains as command-and-control servers and targets secrets including npm, PyPI, GitHub, GitLab, AWS, Vault, and SSH credentials.","The article advises affected users to remove or pin the packages to known-good versions, rotate secrets accessible from the affected account, remove sckit artifacts, and review logs for connections to skyleen.fr."],"insights":["The malicious npm releases were interleaved with versions 0.1.22 and 0.1.24 that matched the last known-good release except for version strings, while 0.1.25 was assigned the latest tag.","Affected PyPI users may have triggered the payload simply by importing the memos module, because widely used package logging code starts it during module initialization.","The npm payload was launched again for every memory recall and received the user’s prompt through an environment variable, making prompt content an additional exposure concern.","The compromised PyPI distribution included files aimed at MemTensor’s own publishing workflow, and the payload contains strings associated with package publishing, so the article specifically advises reviewing package releases made with tokens present on affected hosts.","The payload’s configuration includes an October 22, 2026 expiration date, but the article still directs organizations to investigate connections to the listed skyleen.fr servers beginning September 23, 2026."],"referencedReports":[],"body":"\u003cp\u003eMalicious releases of MemTensor\u0026rsquo;s npm package \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e—versions \u003ccode\u003e0.1.21\u003c/code\u003e, \u003ccode\u003e0.1.23\u003c/code\u003e, and \u003ccode\u003e0.1.25\u003c/code\u003e—and PyPI package \u003ccode\u003eMemoryOS==2.0.34\u003c/code\u003e were published on September 23, 2026. The affected releases bundle cross-platform Go binaries named \u003ccode\u003esckit\u003c/code\u003e that launch in the background and search developer home directories and environment variables for credentials. At the time of writing, npm \u003ccode\u003e0.1.25\u003c/code\u003e and PyPI \u003ccode\u003e2.0.34\u003c/code\u003e were the latest versions, so default installs could retrieve compromised builds.\u003c/p\u003e\n\n\u003cp\u003eIn the npm plugin, the payload runs when the OpenClaw gateway starts and again for each memory recall, receiving the user\u0026rsquo;s prompt text through \u003ccode\u003eSCKIT_EVENT_TEXT\u003c/code\u003e. In the PyPI package, importing \u003ccode\u003ememos\u003c/code\u003e is enough to start the payload because the altered logging setup triggers it during module initialization. The embedded configuration identifies \u003ccode\u003eskyleen[.]fr\u003c/code\u003e subdomains as command-and-control infrastructure and shows that the payload targets credentials for services including npm, PyPI, GitHub, GitLab, AWS, Vault, and SSH.\u003c/p\u003e\n\n\u003cp\u003eThe article advises treating any host that loaded the affected npm versions or imported \u003ccode\u003eMemoryOS==2.0.34\u003c/code\u003e as compromised, including developer machines, CI runners, and test containers. Recommended actions include removing or pinning the packages to known-good versions, rotating secrets available to the affected account, killing \u003ccode\u003esckit\u003c/code\u003e processes, deleting related cache directories, and reviewing network activity for connections to \u003ccode\u003eskyleen[.]fr\u003c/code\u003e. Organizations are also advised to review their own package releases if exposed machines held npm or PyPI publishing tokens.\u003c/p\u003e\n"},{"n":36,"title":"Novel supplychain.local Go worm appears","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/supplychain-local-memtensor-npm-pypi","time":"07:41","priority":"MUST READ","score":94,"tldr":"Compromised npm and PyPI packages are distributing supplychain.local, a cross-platform Go worm that runs when the packages are invoked, searches for publishing credentials and other secrets, and attempts to spread through npm/PyPI publishing and GitHub Actions workflows.","briefOverview":"\u003cp\u003eOn 23 September 2026, a threat actor published a novel supply-chain worm to npm package \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e version 0.1.21 and later and PyPI package \u003ccode\u003eMemoryOS\u003c/code\u003e version 2.0.34 and later. The article says both packages had substantial benign publishing histories and appear to have been compromised. The multiplatform Golang worm is tracked as \u003ccode\u003esupplychain.local\u003c/code\u003e, based on the threat actor’s name for its core Go module.\u003c/p\u003e\n\n\u003cp\u003eThe affected packages contain language-specific loaders that run a platform-specific binary named \u003ccode\u003esckit\u003c/code\u003e whenever the package is invoked, rather than at installation time. The binary supports Windows, Linux, and macOS on x86 and ARM systems, and the embedded configuration includes several \u003ccode\u003eskyleen.fr\u003c/code\u003e command-and-control domains. The malware searches for package-publishing credentials and other secrets, and contains functionality intended to spread through direct npm and PyPI publishing as well as GitHub Actions workflows that run after repository pushes.\u003c/p\u003e\n\n\u003cp\u003eThe malware includes JavaScript and Python stubs intended to make itself execute from additional infected repositories, including a JavaScript stub likely used through a post-installation script. It appears able to use \u003ccode\u003enpm publish\u003c/code\u003e, \u003ccode\u003enpm version patch\u003c/code\u003e, and \u003ccode\u003etwine upload\u003c/code\u003e with credentials taken from infected workstations or CI environments. At the time of writing, the article had not identified compromised public GitHub workflow files or public repositories containing the self-execution stubs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Versions 0.1.21 and later of the npm package @memtensor/memos-cloud-openclaw-plugin and versions 2.0.34 and later of the PyPI package MemoryOS were reported as containing a novel supply-chain worm tracked as supplychain.local.","The affected packages include loaders that run a platform-specific Golang binary named sckit whenever the package is invoked, rather than attempting execution during installation.","The malware includes code and templates intended to spread through direct npm and PyPI publishing and by adding GitHub Actions workflows that execute on repository pushes.","The malware searches for credentials and secrets including GitHub, GitLab, npm, PyPI, AWS, Hugging Face, Slack, Stripe, SendGrid, and HashiCorp Vault tokens.","Known command-and-control domains are skyleen.fr subdomains that resolved to 139.84.223.178."],"insights":["The malicious code is designed to execute when an affected package is used, not when it is installed, which means installation-only checks may not observe its execution behavior.","Both affected packages reportedly had substantial benign publishing histories, indicating the threat actor appears to have compromised existing packages rather than publishing newly created malicious ones.","The bundled sckit binary supports Windows, Linux, and macOS on both x86 and ARM systems, allowing the same package-based campaign to run across a broad range of developer and CI environments.","Although the malware contains templates for GitHub Actions workflows and package post-installation stubs, the article states that no compromised public GitHub workflow files or repositories containing those stubs had been identified at the time of writing.","The configuration embedded in the npm loader identifies multiple skyleen.fr command-and-control endpoints and sets its inventory root to the user’s home directory."],"referencedReports":[],"body":"\u003cp\u003eOn 23 September 2026, a threat actor published a novel supply-chain worm to npm package \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e version 0.1.21 and later and PyPI package \u003ccode\u003eMemoryOS\u003c/code\u003e version 2.0.34 and later. The article says both packages had substantial benign publishing histories and appear to have been compromised. The multiplatform Golang worm is tracked as \u003ccode\u003esupplychain.local\u003c/code\u003e, based on the threat actor’s name for its core Go module.\u003c/p\u003e\n\n\u003cp\u003eThe affected packages contain language-specific loaders that run a platform-specific binary named \u003ccode\u003esckit\u003c/code\u003e whenever the package is invoked, rather than at installation time. The binary supports Windows, Linux, and macOS on x86 and ARM systems, and the embedded configuration includes several \u003ccode\u003eskyleen.fr\u003c/code\u003e command-and-control domains. The malware searches for package-publishing credentials and other secrets, and contains functionality intended to spread through direct npm and PyPI publishing as well as GitHub Actions workflows that run after repository pushes.\u003c/p\u003e\n\n\u003cp\u003eThe malware includes JavaScript and Python stubs intended to make itself execute from additional infected repositories, including a JavaScript stub likely used through a post-installation script. It appears able to use \u003ccode\u003enpm publish\u003c/code\u003e, \u003ccode\u003enpm version patch\u003c/code\u003e, and \u003ccode\u003etwine upload\u003c/code\u003e with credentials taken from infected workstations or CI environments. At the time of writing, the article had not identified compromised public GitHub workflow files or public repositories containing the self-execution stubs.\u003c/p\u003e\n"},{"n":1,"title":"Malicious AI agents steal 600K credit cards, infect 100+ sites with skimmers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malicious-ai-agents-steal-600k-credit-cards-infect-100-plus-sites-with-skimmers/","time":"16:20","priority":"MUST READ","score":93,"tldr":"A financially motivated actor used open-source AI agents to autonomously scan, compromise, and implant payment skimmers on at least 119 retail websites, stealing over 600,000 credit card records. The campaign shows how AI-driven automation can enable high-volume attacks at a very low per-target cost.","briefOverview":"\u003cp\u003eA financially motivated threat actor has used open-source AI agent frameworks to target online retailers at scale since at least July. Gambit reported that the campaign was still active on September 22 and that, between September 10 and 15, the attacker launched 105 attack waves with varying success against at least 27 companies. The operation used Strix for scanning and finding weaknesses, Cairn to seek access such as a shell or administrator privileges, and Hermes to coordinate activity and make tactical decisions using Claude Opus 4.6.\u003c/p\u003e\n\n\u003cp\u003eGambit found that more than 600,000 valid card records were stolen from two companies and that payment-stealing code was deployed on at least 119 websites. The code was inserted by modifying legitimate JavaScript, checkout pages, Google tag blocks, S3/CDN content, caches, database fields, Kubernetes deployments, and scheduled tasks that could restore the code after removal. The attacker also instructed Hermes to erase card data from Magento databases after taking it, causing data loss and operational disruption at some retailers. Gambit estimated total operating costs of roughly \u003cspan class=\"math inline\"\u003e\\(12,000 to \\)\u003c/span\u003e18,000, or an average of about $25 per target.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A financially motivated threat actor used the AI agent frameworks Strix, Cairn, and Hermes to target online retailers, with Hermes directed by Claude Opus 4.6.","The campaign was active from at least July through September 22 and launched 105 distinct attack waves between September 10 and 15, affecting at least 27 companies to varying degrees.","Gambit reported that more than 600,000 valid credit card records were stolen from two companies and that skimmers were deployed on at least 119 websites.","The attackers inserted payment-stealing code through methods including modified JavaScript files and checkout pages, poisoned S3/CDN content and server-side caches, altered database fields and Kubernetes deployments, and cron jobs that restored removed code.","Gambit estimated the operation cost roughly $12,000 to $18,000 in total, with the operator calculating a mean cost of $25.46 across 101 completed scans."],"insights":["The attacker’s AI agent was instructed to erase stolen card data from Magento databases after downloading it, which created operational disruption and data loss for some retailers beyond the payment-card theft itself.","The campaign used multiple ways to insert and preserve payment-stealing code, including altering cloud-hosted content, databases, Kubernetes deployments, and scheduled tasks that reinstalled the code after removal.","The human operator reportedly provided only short goal-oriented instructions while the AI agents conducted much of the scanning, access attempts, and follow-on activity autonomously.","Gambit’s cost findings indicate that the operation could target companies for as little as $3.13 per completed scan, with a reported average of $25.46 across 101 scans."],"referencedReports":[{"title":"Autonomous AI agents target online retailers for $25 a company","url":"https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company","publisher":"gambit","context":"The article relies on Gambit's investigation into the AI-agent-driven campaign, including its attack activity, skimmer deployments, stolen card data, and operating costs.","category":"research","primary":true}],"body":"\u003cp\u003eA financially motivated threat actor has used open-source AI agent frameworks to target online retailers at scale since at least July. Gambit reported that the campaign was still active on September 22 and that, between September 10 and 15, the attacker launched 105 attack waves with varying success against at least 27 companies. The operation used Strix for scanning and finding weaknesses, Cairn to seek access such as a shell or administrator privileges, and Hermes to coordinate activity and make tactical decisions using Claude Opus 4.6.\u003c/p\u003e\n\n\u003cp\u003eGambit found that more than 600,000 valid card records were stolen from two companies and that payment-stealing code was deployed on at least 119 websites. The code was inserted by modifying legitimate JavaScript, checkout pages, Google tag blocks, S3/CDN content, caches, database fields, Kubernetes deployments, and scheduled tasks that could restore the code after removal. The attacker also instructed Hermes to erase card data from Magento databases after taking it, causing data loss and operational disruption at some retailers. Gambit estimated total operating costs of roughly \u003cspan class=\"math inline\"\u003e\\(12,000 to \\)\u003c/span\u003e18,000, or an average of about $25 per target.\u003c/p\u003e\n"},{"n":14,"title":"FBI investigating alleged ShinyHunters breach of its jobs site","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/fbi-investigating-alleged-shinyhunters-job-site-breach","time":"14:22","priority":"MUST READ","score":93,"tldr":"The FBI is investigating an alleged ShinyHunters compromise of FBIjobs.gov after the group defaced the site and claimed to have stolen records on current and former FBI employees and job applicants. The group is threatening to release the data unless the FBI removes a public warning about its activities.","briefOverview":"\u003cp\u003eShinyHunters allegedly compromised and defaced the FBI’s job applications website, FBIjobs.gov, replacing agency images with a Pokémon associated with the group. The FBI said it is investigating claims of unauthorized activity affecting the site. The group claims to have stolen information on current and former FBI employees as well as job applicants, while the special-agent application portal remained unavailable as of Wednesday morning.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters threatened to release information on FBI agents and applicants unless the FBI removes a May public service announcement about the group. It provided samples of 5,000 alleged FBI agent records to several news outlets, which the article says confirmed the records were legitimate. Experts warned that publication or sale of the data could enable fraud, threats against personnel and their families, and future online or physical targeting.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The FBI is investigating claims of unauthorized activity affecting FBIjobs.gov after ShinyHunters defaced the job applications site.","ShinyHunters claims it stole information on current and former FBI employees and job applicants and threatened to leak it unless the FBI removes a May public warning about the group.","The group provided samples of 5,000 alleged FBI agent records to multiple news outlets, which the article says confirmed their legitimacy.","As of Wednesday morning, FBIjobs.gov displayed a notice that the special-agent application portal was unavailable.","Security experts warned that releasing or selling the alleged data could expose law enforcement personnel and their families to fraud, threats, and targeted physical or online harm."],"insights":["ShinyHunters paired its alleged data theft with a public demand that the FBI remove a May warning about the group, making the incident both a data-extortion threat and an attempt to influence the agency’s public messaging.","The group supplied 5,000 sample FBI agent records to several news outlets, which the article reports were confirmed as legitimate, increasing the significance of its broader claims.","The reported compromise affected a job-application platform, but the alleged stolen information extends beyond applicants to current and former FBI employees.","Experts highlighted that the greatest potential harm may come from the alleged data being sold to other criminal or state-backed groups, rather than from ShinyHunters releasing it directly."],"referencedReports":[{"title":"FBI public service announcement on ShinyHunters","url":"https://www.ic3.gov/PSA/2026/PSA260515","publisher":"federal-bureau-of-investigation","context":"The article says ShinyHunters demanded that the FBI remove this May public warning, which the group criticized for making claims it says are false.","category":"advisory","primary":false}],"body":"\u003cp\u003eShinyHunters allegedly compromised and defaced the FBI’s job applications website, FBIjobs.gov, replacing agency images with a Pokémon associated with the group. The FBI said it is investigating claims of unauthorized activity affecting the site. The group claims to have stolen information on current and former FBI employees as well as job applicants, while the special-agent application portal remained unavailable as of Wednesday morning.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters threatened to release information on FBI agents and applicants unless the FBI removes a May public service announcement about the group. It provided samples of 5,000 alleged FBI agent records to several news outlets, which the article says confirmed the records were legitimate. Experts warned that publication or sale of the data could enable fraud, threats against personnel and their families, and future online or physical targeting.\u003c/p\u003e\n"},{"n":28,"title":"Critical Next.js ImageResponse Flaw Can Lead to Server Code Execution via Crafted SVG Input","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/critical-nextjs-imageresponse-flaw-can.html","time":"07:04","priority":"MUST READ","score":92,"tldr":"Next.js 16.2.0 through 16.3.5 has a critical ImageResponse flaw (CVE-2026-94545) that can enable server-side code execution when attacker-controlled input reaches generated SVG content on the Node.js runtime. Developers should upgrade to Next.js 16.3.6 immediately and prevent untrusted values from entering SVG content, attributes, or styles.","briefOverview":"\u003cp\u003eA critical vulnerability in Next.js ImageResponse, tracked as CVE-2026-94545, could allow attackers to run code on a server through specially crafted SVG-related input. It affects Next.js versions 16.2.0 through 16.3.5 when ImageResponse runs on the Node.js runtime, which is the default. The Edge version of ImageResponse and Next.js 15 are not affected.\u003c/p\u003e\n\n\u003cp\u003eImageResponse uses Vercel\u0026rsquo;s Satori library to turn image layouts into SVG before producing PNG social-preview images. Certain attacker-controlled values could reach Satori\u0026rsquo;s SVG output without proper escaping and be interpreted as SVG code rather than ordinary text, potentially reaching flaws in other unnamed dependencies and leading to code execution. Vercel fixed the issue in Next.js 16.3.6, while developers unable to upgrade are advised to keep untrusted values out of SVG content, attributes, and styles; as of September 23, no public exploitation or exploit code had been reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-94545 is a critical Next.js ImageResponse flaw that could allow server code execution when attacker-controlled values are included in generated SVG content, attributes, or styles.","The issue affects Next.js 16.2.0 through 16.3.5 when ImageResponse runs on the default Node.js runtime, while Next.js 15 and the Edge version of ImageResponse are not affected.","Vercel fixed the vulnerability in Next.js 16.3.6 and advises applications on the 16.2 line to upgrade to that version because no fixed 16.2 release was listed.","The underlying Satori issue allowed certain values to reach SVG output without proper escaping, so specially crafted input could be interpreted as SVG code rather than plain text.","As of September 23, The Hacker News found no public reports of active exploitation or public exploit code for the flaw."],"insights":["Standard dependency checks may miss this issue: npm audit did not flag the affected Next.js 16.3.5 version as of September 23, and the advisory was not yet in the GitHub Advisory Database or published as a CVE record.","The vulnerable Satori component is bundled inside Next.js, so checking a lockfile alone will not show it as a Next.js dependency; applications need to verify their installed Next.js version directly.","Vercel did not state whether applications hosted on its platform are protected, unlike its messaging for two critical Next.js flaws fixed in August.","The advisory provides no method to determine whether an affected image-generation route was abused before patching, and recommends keeping untrusted values out of SVG output if an upgrade must wait."],"referencedReports":[{"title":"Next.js Security Update: September 22, 2026","url":"https://nextjs.org/blog/nextjs-security-update-september-22-2026","publisher":"vercel","context":"Vercel's security update announces the fix for the critical Next.js ImageResponse issue in version 16.3.6.","category":"advisory","primary":true},{"title":"GHSA-vcvr-r3jv-pc5j","url":"https://github.com/vercel/next.js/security/advisories/GHSA-vcvr-r3jv-pc5j","publisher":"vercel","context":"The Next.js security advisory describes the affected versions, impact, and workaround for CVE-2026-94545.","category":"advisory","primary":true},{"title":"GHSA-wx4j-mvgx-mqwp","url":"https://github.com/vercel/satori/security/advisories/GHSA-wx4j-mvgx-mqwp","publisher":"satori","context":"Satori's advisory explains that improperly escaped values could be emitted as SVG code and recommends updating to Satori 0.33.5.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical vulnerability in Next.js ImageResponse, tracked as CVE-2026-94545, could allow attackers to run code on a server through specially crafted SVG-related input. It affects Next.js vers
