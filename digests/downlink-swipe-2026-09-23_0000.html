ions 16.2.0 through 16.3.5 when ImageResponse runs on the Node.js runtime, which is the default. The Edge version of ImageResponse and Next.js 15 are not affected.\u003c/p\u003e\n\n\u003cp\u003eImageResponse uses Vercel\u0026rsquo;s Satori library to turn image layouts into SVG before producing PNG social-preview images. Certain attacker-controlled values could reach Satori\u0026rsquo;s SVG output without proper escaping and be interpreted as SVG code rather than ordinary text, potentially reaching flaws in other unnamed dependencies and leading to code execution. Vercel fixed the issue in Next.js 16.3.6, while developers unable to upgrade are advised to keep untrusted values out of SVG content, attributes, and styles; as of September 23, no public exploitation or exploit code had been reported.\u003c/p\u003e\n"},{"n":40,"title":"Emerging Threat: (CVE-2026-94545) Next.js Remote Code Execution via ImageResponse SVG Injection","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-94545-next-js-remote-code-execution-via-imageresponse-svg-injection/","time":"20:11","priority":"MUST READ","score":92,"tldr":"CVE-2026-94545 is a critical Next.js Node.js ImageResponse flaw that can enable remote code execution when attacker-controlled input is rendered into dynamic SVG-based Open Graph images. Organizations using Next.js 16.2–16.3 should upgrade to 16.3.6 and review public image routes for untrusted request data.","briefOverview":"\u003cp\u003eCVE-2026-94545 is a critical remote code execution vulnerability in Next.js\u0026rsquo;s \u003ccode\u003enext/og\u003c/code\u003e \u003ccode\u003eImageResponse\u003c/code\u003e API. The Node.js implementation can incorrectly escape values during SVG generation, allowing attacker-influenced values in image content, attributes, or styles to be interpreted as SVG markup. Publicly reachable dynamic Open Graph image routes are a common potential exposure point because they often generate images from request parameters, form fields, or API requests.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Next.js versions 16.2.0 through 16.3.5 when the Node.js implementation is used and untrusted data reaches generated SVG output; the Edge implementation is not affected. Next.js 16.3.6 contains the fix, while version 15.5.26 adds hardening for the 15 line, and there is no same-minor backport for 16.2.x. Organizations should inventory internet-facing Next.js sites, identify dynamic \u003ccode\u003eImageResponse\u003c/code\u003e routes, trace request data into generated images, and monitor those routes for malformed or unusually long parameters.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-94545 is a critical remote code execution vulnerability in Next.js's Node.js next/og ImageResponse API, caused by inadequate escaping of values rendered into SVG output.","The issue affects Next.js versions 16.2.0 through 16.3.5 when a Node.js ImageResponse route places attacker-influenced data into generated SVG content, attributes, or styles; the Edge implementation is not affected.","Next.js 16.3.6 fixes the vulnerability, while Next.js 15.5.26 provides hardening for the 15.x line and no backport exists for 16.2.x.","Organizations should inventory internet-facing Next.js sites, identify dynamic ImageResponse routes, determine whether request data reaches generated SVG, and monitor image routes for malformed or unusually long parameters."],"insights":["External scans can identify Next.js services but generally cannot determine the deployed framework version, whether ImageResponse is used, or whether the route runs on Node.js, making exposure difficult to confirm from outside an organization.","Filtering suspicious input is not considered a reliable safeguard because the underlying issue is how values are inserted into SVG output rather than simply the contents of those values.","Organizations on Next.js 16.2.x cannot apply a same-version patch and must upgrade to 16.3.6, which may require planning for teams pinned to 16.2 for dependency reasons.","Potentially affected sites may be owned by marketing or digital teams and deployed through managed hosting, so they can fall outside conventional infrastructure patch-management processes."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-94545 is a critical remote code execution vulnerability in Next.js\u0026rsquo;s \u003ccode\u003enext/og\u003c/code\u003e \u003ccode\u003eImageResponse\u003c/code\u003e API. The Node.js implementation can incorrectly escape values during SVG generation, allowing attacker-influenced values in image content, attributes, or styles to be interpreted as SVG markup. Publicly reachable dynamic Open Graph image routes are a common potential exposure point because they often generate images from request parameters, form fields, or API requests.\u003c/p\u003e\n\n\u003cp\u003eThe issue affects Next.js versions 16.2.0 through 16.3.5 when the Node.js implementation is used and untrusted data reaches generated SVG output; the Edge implementation is not affected. Next.js 16.3.6 contains the fix, while version 15.5.26 adds hardening for the 15 line, and there is no same-minor backport for 16.2.x. Organizations should inventory internet-facing Next.js sites, identify dynamic \u003ccode\u003eImageResponse\u003c/code\u003e routes, trace request data into generated images, and monitor those routes for malformed or unusually long parameters.\u003c/p\u003e\n"},{"n":29,"title":"ShinyHunters Claims FBI Breach, Says It Stole Data on Agents and Job Applicants","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/shinyhunters-claims-fbi-breach-says-it.html","time":"05:30","priority":"SHOULD READ","score":88,"tldr":"ShinyHunters claims it breached the FBI using an Oracle PeopleSoft zero-day, stealing sensitive data on current and former agents and job applicants, though the FBI has only confirmed it is investigating the claim.","briefOverview":"\u003cp\u003eShinyHunters claimed it breached the U.S. Federal Bureau of Investigation and stole sensitive data on current and former FBI personnel as well as job applicants. The group said FBI Criminal Justice, HR, Medlink, and other services were compromised. The FBI said it was aware of claims of unauthorized activity affecting FBIjobs.gov and was investigating.\u003c/p\u003e\n\n\u003cp\u003eA ShinyHunters spokesperson told The Register that the group used a new Oracle PeopleSoft remote-code-execution zero-day and defaced the FBI jobs site. The article states that details of a pre-authenticated PeopleSoft remote-code-execution zero-day are not currently available, although ShinyHunters previously used CVE-2026-35273 against enterprise networks. The group said it targeted the FBI in response to an FBI public service announcement about its alleged Canvas targeting, while an expert said the claim represents an unusually provocative escalation between law enforcement and cybercrime groups.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ShinyHunters claimed it breached the FBI and obtained sensitive data on current and former FBI employees and people who applied for FBI jobs.","The group said it compromised FBI Criminal Justice, HR, and Medlink services, among others.","A ShinyHunters spokesperson told The Register that the group used a new Oracle PeopleSoft remote-code-execution flaw and defaced the FBI jobs site.","The FBI said it is aware of claims of unauthorized activity affecting FBIjobs.gov and is investigating.","The article notes that ShinyHunters previously exploited CVE-2026-35273, a PeopleSoft flaw, to enter enterprise networks and extort victims."],"insights":["ShinyHunters said it targeted the FBI in response to an FBI public warning that described the group’s alleged targeting of the Canvas learning platform and advised victims not to pay.","Although the group claimed use of a new PeopleSoft flaw, the article states that no details of a pre-authenticated PeopleSoft remote-code-execution zero-day are currently available.","The FBI jobs website displayed a maintenance message after the claimed defacement, while the FBI said only that it was investigating reported unauthorized activity.","The article highlights ShinyHunters’ recent focus on manipulating help desks, maliciously approved third-party app access, and stolen software-service connection tokens, emphasizing risks around trusted identities and external relationships.","A threat-intelligence expert noted that the September 23 timestamp on ShinyHunters’ post could be an operational clue pointing to Asia, but said it is not definitive attribution."],"referencedReports":[{"title":"FBI Public Service Announcement PSA260515","url":"https://www.ic3.gov/PSA/2026/PSA260515","publisher":"fbi-internet-crime-complaint-center","context":"The article says this FBI public service announcement detailed ShinyHunters' targeting of Canvas and urged victims not to pay.","category":"advisory","primary":false}],"body":"\u003cp\u003eShinyHunters claimed it breached the U.S. Federal Bureau of Investigation and stole sensitive data on current and former FBI personnel as well as job applicants. The group said FBI Criminal Justice, HR, Medlink, and other services were compromised. The FBI said it was aware of claims of unauthorized activity affecting FBIjobs.gov and was investigating.\u003c/p\u003e\n\n\u003cp\u003eA ShinyHunters spokesperson told The Register that the group used a new Oracle PeopleSoft remote-code-execution zero-day and defaced the FBI jobs site. The article states that details of a pre-authenticated PeopleSoft remote-code-execution zero-day are not currently available, although ShinyHunters previously used CVE-2026-35273 against enterprise networks. The group said it targeted the FBI in response to an FBI public service announcement about its alleged Canvas targeting, while an expert said the claim represents an unusually provocative escalation between law enforcement and cybercrime groups.\u003c/p\u003e\n"},{"n":30,"title":"Exploit Released for Unpatched Ubuntu Linux Flaw Enabling Host-Root Container Escape","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/exploit-released-for-unpatched-ubuntu.html","time":"11:12","priority":"SHOULD READ","score":88,"tldr":"A public exploit for CVE-2026-80521 can let an attacker escape an Ubuntu container and gain root access on the host through a use-after-free flaw in the Linux kernel’s AF_UNIX socket subsystem. Ubuntu 26.04, 24.04, and 22.04 systems using affected kernels remain unpatched, so organizations should update when fixes arrive or isolate untrusted workloads with microVMs.","briefOverview":"\u003cp\u003eDepthFirst published research and exploit code for CVE-2026-80521, a use-after-free flaw in the Linux kernel’s AF_UNIX socket subsystem that can let an attacker escape a container and gain root access on the host. The exploit targets Ubuntu 26.04, while Ubuntu 26.04, 24.04, and 22.04 LTS releases remained unpatched at the time of reporting. Affected Ubuntu kernel packages include versions used on AWS, Azure, and GCP workloads. There are no confirmed reports of the flaw being used in attacks, and it is not listed in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe bug is in the kernel component that cleans up file descriptors passed between local processes through SCM_RIGHTS messages. A race condition can leave a pointer to freed memory in an internal list, allowing a later cleanup pass to follow it. Because AF_UNIX sockets and the necessary ordinary system calls are permitted by default in Docker and Kubernetes seccomp profiles, the exploit can bypass container namespaces, cgroup limits, and seccomp filtering. The upstream fix landed in mainline Linux kernel 7.2 and stable 7.1.10, but neither DepthFirst nor Ubuntu published a temporary workaround; DepthFirst recommends microVM isolation such as Firecracker or Kata Containers for untrusted workloads.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["DepthFirst released exploit code for CVE-2026-80521, a use-after-free flaw in the Linux kernel’s AF_UNIX socket subsystem that can enable a container escape and root access on the host.","Although the issue was fixed upstream on August 6, Ubuntu had not shipped patches for its 26.04, 24.04, or 22.04 LTS releases at the time of the report.","The flaw is reachable from Docker and Kubernetes containers because AF_UNIX sockets and the relevant ordinary system calls are allowed by their default seccomp profiles.","The vulnerable code was introduced in Linux kernel 6.10 and backported to stable 6.1 and 6.6 branches, while the fix landed in mainline 7.2 and stable 7.1.10.","DepthFirst recommends using microVM isolation such as Firecracker or Kata Containers for untrusted workloads, as neither it nor Ubuntu had published a temporary workaround."],"insights":["The issue is especially significant because it can be triggered through normal system calls that are permitted in default Docker and Kubernetes configurations, allowing it to bypass several common container isolation controls.","Affected Ubuntu kernel packages include variants used for AWS, Azure, and GCP workloads, extending the exposure beyond standard on-premises Ubuntu installations.","A public exploit targets Ubuntu 26.04, yet the article reports no confirmed in-the-wild attacks and says the flaw is not listed in CISA’s Known Exploited Vulnerabilities catalog.","DepthFirst said its AI-assisted vulnerability research found the flaw, while the kernel maintainers indicated that an OpenAI researcher independently reported the same issue.","Because no temporary workaround was published, DepthFirst recommends moving untrusted workloads to microVM-based isolation such as Firecracker or Kata Containers, which do not share the host kernel."],"referencedReports":[{"title":"Containers Are No Longer Safe","url":"https://depthfirst.com/research/containers-are-no-longer-safe","publisher":"DepthFirst","context":"The article relies on DepthFirst's research describing CVE-2026-80521, its container-escape impact, and the released exploit code.","category":"research","primary":true}],"body":"\u003cp\u003eDepthFirst published research and exploit code for CVE-2026-80521, a use-after-free flaw in the Linux kernel’s AF_UNIX socket subsystem that can let an attacker escape a container and gain root access on the host. The exploit targets Ubuntu 26.04, while Ubuntu 26.04, 24.04, and 22.04 LTS releases remained unpatched at the time of reporting. Affected Ubuntu kernel packages include versions used on AWS, Azure, and GCP workloads. There are no confirmed reports of the flaw being used in attacks, and it is not listed in CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe bug is in the kernel component that cleans up file descriptors passed between local processes through SCM_RIGHTS messages. A race condition can leave a pointer to freed memory in an internal list, allowing a later cleanup pass to follow it. Because AF_UNIX sockets and the necessary ordinary system calls are permitted by default in Docker and Kubernetes seccomp profiles, the exploit can bypass container namespaces, cgroup limits, and seccomp filtering. The upstream fix landed in mainline Linux kernel 7.2 and stable 7.1.10, but neither DepthFirst nor Ubuntu published a temporary workaround; DepthFirst recommends microVM isolation such as Firecracker or Kata Containers for untrusted workloads.\u003c/p\u003e\n"},{"n":31,"title":"Compromised MemTensor Packages Deliver sckit Credential Stealer via npm and PyPI","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/compromised-memtensor-packages-deliver.html","time":"13:52","priority":"SHOULD READ","score":88,"tldr":"Compromised MemTensor packages on npm and PyPI deployed the cross-platform sckit credential stealer, which targets developer and CI secrets including cloud, source-control, and package-publishing tokens. Users should downgrade to known-safe versions, rotate potentially exposed credentials, terminate sckit processes, and block skyleen.fr.","briefOverview":"\u003cp\u003eUnknown threat actors compromised legitimate MemTensor packages on npm and PyPI to distribute a cross-platform Go-based implant called sckit for Windows, Linux, and macOS. Affected releases include @memtensor/memos-cloud-openclaw-plugin versions 0.1.21, 0.1.23, and 0.1.25, plus MemoryOS version 2.0.34, which is quarantined on PyPI. The malicious npm versions launch the payload when the agent gateway starts and during memory-recall events, while the PyPI version launches it when the memos module is imported.\u003c/p\u003e\n\n\u003cp\u003eSckit searches developer machines and CI jobs for credential files, sensitive environment variables, cloud access keys, source-code tokens, package-registry tokens, private keys, and other secrets, then sends the data to skyleen.fr. SafeDep said the attackers obtained publishing tokens from MemTensor GitHub Actions release pipelines and that the implant contains templates for spreading through npm packages, Python packages, and GitHub Actions workflows. Because malicious npm versions remained available when the article was published, affected users are advised to pin to version 0.1.20 for the npm package or 2.0.33 for the PyPI package, rotate exposed secrets, stop any sckit process, and block skyleen.fr and its subdomains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unknown threat actors compromised MemTensor packages on npm and PyPI to distribute a cross-platform Go-based implant called sckit.","Affected releases include @memtensor/memos-cloud-openclaw-plugin versions 0.1.21, 0.1.23, and 0.1.25, as well as MemoryOS version 2.0.34 on PyPI.","The malicious payload runs when the npm plugin starts or handles a memory-recall event, while the PyPI payload starts when the memos module is imported.","Sckit harvests credentials, tokens, private keys, and sensitive environment variables from developer machines and CI jobs, then exfiltrates them to skyleen.fr.","Researchers said the attacker obtained publishing tokens from MemTensor GitHub Actions release pipelines, and users are advised to use known-safe versions, rotate exposed secrets, terminate sckit processes, and block skyleen.fr."],"insights":["The malicious npm releases were interspersed with clean versions: 0.1.21, 0.1.23, and 0.1.25 were compromised, while 0.1.22 and 0.1.24 were clean.","During memory-recall events, the npm plugin’s launcher passes both the host process environment and the user’s prompt text directly to the malicious executable.","The implant includes templates for placing itself in npm packages, Python packages, and GitHub Actions workflows, giving it the potential to propagate through developer and publishing environments.","Because the malicious npm versions remained available for download when the article was published, pinning to version 0.1.20 and rotating any exposed secrets are immediately actionable measures."],"referencedReports":[{"title":"Supply Chain Attack: MemTensor npm and PyPI Compromise","url":"https://www.aikido.dev/blog/supplychain-local-memtensor-npm-pypi","publisher":"aikido","context":"The article cites Aikido as one of the reporting sources documenting the compromise of MemTensor packages.","category":"research","primary":true},{"title":"MemTensor sckit Worm: npm and PyPI Supply Chain Attack","url":"https://safedep.io/memtensor-sckit-worm-npm-pypi/","publisher":"safedep","context":"The article cites SafeDep's analysis of the supply-chain compromise and its account of how publishing tokens were obtained.","category":"research","primary":true},{"title":"MemTensor Compromise","url":"https://socket.dev/blog/memtensor-compromise","publisher":"socket","context":"The article cites Socket's reporting for the credential files, tokens, and services targeted by sckit.","category":"research","primary":true},{"title":"sckit Supply Chain Worm Hits MemTensor npm and PyPI Scopes","url":"https://www.stepsecurity.io/blog/sckit-supply-chain-worm-hits-memtensor-npm-pypi-scopes","publisher":"stepsecurity","context":"The article cites StepSecurity's analysis of the malicious npm package behavior and execution triggers.","category":"research","primary":true},{"title":"sckit Go Implant Framework","url":"https://safedep.io/sckit-go-implant-framework/","publisher":"safedep","context":"The article references SafeDep's deeper analysis of sckit's credential collection, command-and-control tasks, and self-propagation templates.","category":"research","primary":true}],"body":"\u003cp\u003eUnknown threat actors compromised legitimate MemTensor packages on npm and PyPI to distribute a cross-platform Go-based implant called sckit for Windows, Linux, and macOS. Affected releases include @memtensor/memos-cloud-openclaw-plugin versions 0.1.21, 0.1.23, and 0.1.25, plus MemoryOS version 2.0.34, which is quarantined on PyPI. The malicious npm versions launch the payload when the agent gateway starts and during memory-recall events, while the PyPI version launches it when the memos module is imported.\u003c/p\u003e\n\n\u003cp\u003eSckit searches developer machines and CI jobs for credential files, sensitive environment variables, cloud access keys, source-code tokens, package-registry tokens, private keys, and other secrets, then sends the data to skyleen.fr. SafeDep said the attackers obtained publishing tokens from MemTensor GitHub Actions release pipelines and that the implant contains templates for spreading through npm packages, Python packages, and GitHub Actions workflows. Because malicious npm versions remained available when the article was published, affected users are advised to pin to version 0.1.20 for the npm package or 2.0.33 for the PyPI package, rotate exposed secrets, stop any sckit process, and block skyleen.fr and its subdomains.\u003c/p\u003e\n"},{"n":43,"title":"Sckit Supply Chain Worm Hits MemTensor npm \u0026 PyPi scopes","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/sckit-supply-chain-worm-hits-memtensor-npm-pypi-scopes","time":"13:56","priority":"SHOULD READ","score":88,"tldr":"Malicious releases of MemTensor’s OpenClaw npm plugin and MemoryOS 2.0.34 for PyPI bundled the Sckit payload, which can launch silently during normal use or import, inherit environment credentials, and scan home directories for secrets. Organizations should remove affected versions, investigate process and network activity, and promptly rotate potentially exposed package, cloud, source-control, and CI credentials.","briefOverview":"\u003cp\u003eMalicious versions 0.1.21, 0.1.23, and 0.1.25 of the \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e npm package included a hidden Sckit executable. The plugin could launch the payload during gateway startup and memory recall, passing the host process environment and, for recall events, the user’s prompt text. The package contents briefly returned to clean versions twice before malicious artifacts reappeared minutes later, indicating that recovery must address unauthorized publishing access as well as affected installations.\u003c/p\u003e\n\n\u003cp\u003eThe bundled payload configuration identifies the user’s home directory as an inventory root, and static strings include patterns for cloud, source-control, package-registry, and other credentials. The article also directly analyzes \u003ccode\u003eMemoryOS 2.0.34\u003c/code\u003e, whose Python logging setup can reach a similar platform-specific launcher during a normal \u003ccode\u003ememos\u003c/code\u003e import. Organizations that ran affected versions are advised to contain impacted hosts or runners, rebuild from trusted artifacts, investigate process and network activity, and revoke potentially exposed credentials from a clean system.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Malicious versions 0.1.21, 0.1.23, and 0.1.25 of @memtensor/memos-cloud-openclaw-plugin included a hidden Sckit executable that could be launched during gateway startup and memory recall.","The npm launcher starts the payload as a detached background process with the parent process environment and, during memory recall, passes the user’s prompt in the SCKIT_EVENT_TEXT environment variable.","Static analysis of the bundled payloads found credential-related patterns for cloud platforms, source-control services, package registries, and developer tools, while the configuration identifies the user’s home directory as an inventory root.","MemoryOS 2.0.34 contains a Python launcher reachable through logging initialization during a normal memos import, which can start a platform-specific Sckit executable with a copy of the environment.","The article recommends isolating affected hosts or runners, rebuilding from trusted artifacts, investigating process and network activity, and revoking potentially exposed credentials from a clean system."],"insights":["The malicious npm package contents were briefly replaced with clean artifacts twice before payloads reappeared within about three and a half minutes, meaning remediation must include revoking unauthorized publishing access rather than only replacing the package version.","The npm payload does not rely on an installation-time script; it can launch later when the affected plugin starts or recalls memory, so installing with package scripts disabled does not prevent execution during subsequent use.","Version 0.1.25 added a bundled certificate authority file that is used only when Linux lacks a usable system certificate bundle, potentially making the payload’s encrypted network connections more reliable in minimal containers and CI environments.","Although the MemoryOS build backend includes a function that could modify the GitHub Actions environment, the supplied source does not call that function, so the article does not establish that builds or installations automatically activate the CI path.","If the conditional MemoryOS publishing bridge is sourced by its intended upload shell, its final \"exit 0\" would terminate that shell after the helper runs, potentially preventing the remaining upload commands from continuing."],"referencedReports":[{"title":"MemOS-Cloud-OpenClaw-Plugin Issue #173","url":"https://github.com/MemTensor/MemOS-Cloud-OpenClaw-Plugin/issues/173","publisher":"memtensor","context":"The article cites this repository incident report as describing malicious npm artifacts that lacked corresponding repository commits or tags.","category":"advisory","primary":false}],"body":"\u003cp\u003eMalicious versions 0.1.21, 0.1.23, and 0.1.25 of the \u003ccode\u003e@memtensor/memos-cloud-openclaw-plugin\u003c/code\u003e npm package included a hidden Sckit executable. The plugin could launch the payload during gateway startup and memory recall, passing the host process environment and, for recall events, the user’s prompt text. The package contents briefly returned to clean versions twice before malicious artifacts reappeared minutes later, indicating that recovery must address unauthorized publishing access as well as affected installations.\u003c/p\u003e\n\n\u003cp\u003eThe bundled payload configuration identifies the user’s home directory as an inventory root, and static strings include patterns for cloud, source-control, package-registry, and other credentials. The article also directly analyzes \u003ccode\u003eMemoryOS 2.0.34\u003c/code\u003e, whose Python logging setup can reach a similar platform-specific launcher during a normal \u003ccode\u003ememos\u003c/code\u003e import. Organizations that ran affected versions are advised to contain impacted hosts or runners, rebuild from trusted artifacts, investigate process and network activity, and revoke potentially exposed credentials from a clean system.\u003c/p\u003e\n"},{"n":25,"title":"A Leaked GitLab Issue Email Address Lets Anyone Push Code and Run CI Jobs as You","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/a-leaked-gitlab-issue-email-address.html","time":"16:53","priority":"SHOULD READ","score":87,"tldr":"GitLab’s non-expiring incoming-email token can act as a reusable credential: anyone who obtains a user’s project email address can submit patches that GitLab commits under that user’s permissions, potentially to main and with CI/CD execution. The feature bypasses sender verification, IP restrictions, and 2FA, so users should rotate exposed tokens and self-managed administrators should consider disabling incoming email.","briefOverview":"\u003cp\u003eAikido Security reported that GitLab’s private incoming-email address for creating work items contains a non-expiring token tied to a user account. The token is reused across the user’s project addresses and can apply to every public or private project that the account can access. GitLab does not verify the email sender, so anyone who obtains the address can submit email that GitLab handles with the account owner’s permissions.\u003c/p\u003e\n\n\u003cp\u003eBy changing the address suffix from \u003ccode\u003e-issue\u003c/code\u003e to \u003ccode\u003e-merge-request\u003c/code\u003e, a holder can email an attached patch and specify a target branch in the subject line. GitLab can apply the patch as a commit authored by the account owner, including to \u003ccode\u003emain\u003c/code\u003e where that user has permission, and a changed \u003ccode\u003e.gitlab-ci.yml\u003c/code\u003e can trigger CI/CD jobs. Incoming email is exempt from IP restrictions and can work without two-factor authentication; users can reset their incoming-email token to invalidate addresses, while self-managed administrators can disable incoming email across the instance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab’s incoming-email address contains a non-expiring token tied to a user account, and the same token is used across that user’s project email addresses.","Aikido Security demonstrated that a person with this address can change its suffix to create merge requests by email and send an attached patch that GitLab commits under the account owner’s identity.","The email sender is not verified, and incoming email is exempt from GitLab IP restrictions and can work without two-factor authentication.","An attacker’s access is limited to the leaked account’s permissions, but a Maintainer-level account may be able to modify protected branches and run CI/CD jobs with access to project secrets.","Users can invalidate exposed addresses by resetting the incoming-email token, while self-managed GitLab administrators can disable incoming email for the entire instance."],"insights":["Although GitLab presents the address as belonging to a particular project, its embedded token applies to every public or private project that the account can access.","An address intended for emailing work items can be converted into a code-submission route simply by replacing its “-issue” suffix with “-merge-request.”","A private project is not fully reachable from the token alone: an attacker also needs the project path and numeric ID, while public projects expose both values.","GitLab changed its wording to acknowledge that the address can create merge requests, but the article says the non-expiring token, unverified senders, and lack of an individual opt-out remain unchanged.","Resetting the incoming-email token invalidates all of a user’s project email addresses at once, and self-managed GitLab offers only an instance-wide disable option rather than a per-user setting."],"referencedReports":[{"title":"GitLab Email Push to Main","url":"https://www.aikido.dev/blog/gitlab-email-push-to-main","publisher":"aikido-security","context":"The article relies on Aikido Security’s report and demonstration that a leaked GitLab incoming-email address can be used to submit patches and run CI/CD jobs under the account owner’s permissions.","category":"research","primary":true}],"body":"\u003cp\u003eAikido Security reported that GitLab’s private incoming-email address for creating work items contains a non-expiring token tied to a user account. The token is reused across the user’s project addresses and can apply to every public or private project that the account can access. GitLab does not verify the email sender, so anyone who obtains the address can submit email that GitLab handles with the account owner’s permissions.\u003c/p\u003e\n\n\u003cp\u003eBy changing the address suffix from \u003ccode\u003e-issue\u003c/code\u003e to \u003ccode\u003e-merge-request\u003c/code\u003e, a holder can email an attached patch and specify a target branch in the subject line. GitLab can apply the patch as a commit authored by the account owner, including to \u003ccode\u003emain\u003c/code\u003e where that user has permission, and a changed \u003ccode\u003e.gitlab-ci.yml\u003c/code\u003e can trigger CI/CD jobs. Incoming email is exempt from IP restrictions and can work without two-factor authentication; users can reset their incoming-email token to invalidate addresses, while self-managed administrators can disable incoming email across the instance.\u003c/p\u003e\n"},{"n":32,"title":"Attackers Use Malicious Terraform Providers to Deliver Go Malware via HashiCorp Registry","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/attackers-use-malicious-terraform.html","time":"18:06","priority":"SHOULD READ","score":86,"tldr":"North Korea-linked attackers are expanding the Graphalgo supply-chain campaign to HashiCorp Terraform Registry and Go modules, using trojanized packages to deploy malware with Slack and blockchain-based command-and-control. The activity reinforces the risk of fake-job-interview lures and compromised developer ecosystems as routes into production environments.","briefOverview":"\u003cp\u003eResearchers at Aikido identified Go-based malware distributed through two Terraform providers in HashiCorp Registry and two Go modules. The packages, including gocommunity-io/dockerd and kreuzwenker/docker, share infrastructure with the Graphalgo campaign, which has been attributed to North Korean threat actors. The discovery marks the first reported use of HashiCorp’s centralized Terraform Registry to distribute malicious payloads. Aikido said the tactic may offer a more direct route to credentials used in critical production environments.\u003c/p\u003e\n\n\u003cp\u003eThe malware collects system and hardware information, hostname, operating-system details, and Node.js availability before sending the data to an attacker-controlled Slack channel. It then creates temporary encryption keys and uses Slack plus an Ethereum smart contract on the Arbitrum Sepolia testnet to receive encrypted commands, which can run Go or JavaScript code. Related npm packages were also found using encrypted payloads, cryptographic conditions that trigger execution, blockchain-based communications, and Slack channels. The article also describes fake job-interview and coding-task lures used to involve developers with seemingly legitimate repositories containing malicious dependencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido identified Go-based malware distributed through two Terraform providers, gocommunity-io/dockerd and kreuzwenker/docker, and two Go modules, gocommunity.io/orderedbtree and gogets.dev/btreex.","The malicious Terraform and Go packages share blockchain and Slack communications infrastructure with the Graphalgo campaign, which has been attributed to North Korean threat actors.","The Go malware gathers system details, sends them to an attacker-controlled Slack channel, and polls an Ethereum smart contract on the Arbitrum Sepolia testnet for encrypted commands that can run Go or JavaScript code.","Researchers said Graphalgo commonly uses fake Web3 companies and job-interview coding tasks to persuade developers to work with repositories containing malicious dependencies.","CloudSEK also reported that a compromised npm package, @dforge-core/dforge-mcp version 0.2.21, distributed the GHAPPIER JavaScript loader for 35 minutes before a clean version was published."],"insights":["The malware’s use of both Slack and blockchain-based communication channels gives operators more than one way to send instructions to infected computers.","Some related npm packages activate only after a specific cryptographic calculation, which researchers described as evidence of a targeted operation and a way to hinder analysis without the matching front-end component.","Terraform providers are an especially consequential distribution route because Terraform can offer a direct path to credentials used for critical production environments.","The blockchain command system limits operators because every infected client receives all messages but only acts on messages it can decrypt, reducing the risk of commands or data being exposed between infected hosts.","The GHAPPIER loader remained available through npm for only 35 minutes and 38 seconds, yet similar code was found in 65 public repositories after attackers used developers’ stored credentials to write to repositories they could access."],"referencedReports":[{"title":"Graphalgo Terraform Go Modules","url":"https://www.aikido.dev/blog/graphalgo-terraform-go-modules","publisher":"aikido","context":"Aikido reported the malicious Terraform providers and Go modules and analyzed their shared Slack and blockchain command infrastructure.","category":"research","primary":true},{"title":"Mathmain Encrypted Loader","url":"https://safedep.io/mathmain-encrypted-loader/","publisher":"safedep","context":"The article cites this research among analyses that identified malicious npm packages delivering related malware.","category":"research","primary":false},{"title":"Equation of Compromise","url":"https://research.jfrog.com/post/equation-of-compromise/","publisher":"jfrog","context":"The article references this analysis in connection with npm packages that conceal an encrypted payload and use blockchain and Slack-based communications.","category":"research","primary":false},{"title":"GHAPPIER Malware Loader: npm Supply Chain Attack","url":"https://www.cloudsek.com/blog/ghappier-malware-loader-npm-supply-chain-attack","publisher":"cloudsek","context":"CloudSEK reported on the GHAPPIER JavaScript loader distributed through a compromised legitimate npm package.","category":"research","primary":false},{"title":"Targeted Attacks","url":"https://blog.rust-lang.org/2026/09/17/targeted-attacks/","publisher":"rust-project","context":"The Rust project warned crate owners and contributors about fake interview calls used to get targets to install software or execute commands.","category":"advisory","primary":false}],"body":"\u003cp\u003eResearchers at Aikido identified Go-based malware distributed through two Terraform providers in HashiCorp Registry and two Go modules. The packages, including gocommunity-io/dockerd and kreuzwenker/docker, share infrastructure with the Graphalgo campaign, which has been attributed to North Korean threat actors. The discovery marks the first reported use of HashiCorp’s centralized Terraform Registry to distribute malicious payloads. Aikido said the tactic may offer a more direct route to credentials used in critical production environments.\u003c/p\u003e\n\n\u003cp\u003eThe malware collects system and hardware information, hostname, operating-system details, and Node.js availability before sending the data to an attacker-controlled Slack channel. It then creates temporary encryption keys and uses Slack plus an Ethereum smart contract on the Arbitrum Sepolia testnet to receive encrypted commands, which can run Go or JavaScript code. Related npm packages were also found using encrypted payloads, cryptographic conditions that trigger execution, blockchain-based communications, and Slack channels. The article also describes fake job-interview and coding-task lures used to involve developers with seemingly legitimate repositories containing malicious dependencies.\u003c/p\u003e\n"},{"n":44,"title":"An INC Ransomware Affiliate’s BYOVD Buffet","source":"labs.beazley.security","sourceColorIdx":2,"link":"https://labs.beazley.security/articles/an-inc-ransomware-affiliates-byovd-buffet","time":"07:00","priority":"SHOULD READ","score":85,"tldr":"A Beazley investigation found an INC ransomware affiliate used a ClickFix infection to gain access, then deployed four BYOVD toolkits to disable endpoint defenses and a backdoor hidden in a modified SentinelOne DLL. The case signals that ransomware operators are increasingly operationalizing reusable EDR-killing tools and legitimate-software camouflage.","briefOverview":"\u003cp\u003eBeazley Security investigated an INC ransomware incident in which an affiliate gained access through a ClickFix-style trick that led a user to run a malicious PowerShell command. The actor then installed a Python implant identified as TWINLOOT, harvested credentials, attempted RDP logins, and used pass-the-hash activity to move through the network. The backdoor was used for interactive activity including downloading utilities, changing local firewall rules, and installing a Wasabi client for data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found four separate bring-your-own-vulnerable-driver packages deployed across multiple hosts, an unusual volume for a ransomware case according to Beazley. Three involved known drivers, while the novel Redacted EDR Blinder installed a vulnerable IoDrv driver and overwrote key functions in several endpoint-security products so they would immediately exit. The affiliate also concealed a backdoor in a modified SentinelOne DLL that retained much of the original file’s appearance but had its signature removed and an encrypted payload embedded in its resources. The incident illustrates how ransomware operators may increasingly use reusable tools to disable endpoint defenses and disguise malicious code as legitimate security-related software.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The INC ransomware affiliate gained initial access through a ClickFix-style attack that tricked a user into running a malicious PowerShell command after visiting pet-care-related websites.","After gaining access, the threat actor used credential harvesting, RDP login attempts, and pass-the-hash activity to move across the victim network.","Investigators found four distinct bring-your-own-vulnerable-driver toolkits across multiple hosts, including xhunter1.sys, BdApiUtil64.sys, havoc.sys, and a newly observed package using the IoDrv driver.","The novel \"Redacted EDR Blinder\" utility installed a vulnerable driver and attempted to disable functions in security products including Microsoft Defender, Field Effect Covalence, Kaspersky Endpoint Security, Bitdefender, Qihoo 360, and SentinelOne.","The attackers used a modified SentinelOne DLL with its signature removed and an encrypted payload embedded in its resources to conceal a backdoor that supported file downloads, firewall changes, and Wasabi cloud-storage-based data exfiltration."],"insights":["Beazley’s DFIR team reported that this was the first ransomware intrusion it had seen using four distinct vulnerable-driver toolkits across multiple hosts, rather than the more typical single toolkit.","The Redacted EDR Blinder included a polished help interface for criminal users, which the article says suggests it was designed as a reusable, commoditized tool rather than for one intrusion.","The modified SentinelOne library retained the original icon and metadata but had its digital signature removed, showing that superficial file characteristics can still resemble legitimate security software.","Windows Defender did not identify the modified SentinelOne DLL as malicious during the incident, despite its missing signature, added entry point, and encrypted payload embedded in its resources.","The article advises keeping Microsoft’s vulnerable driver blocklist current because known vulnerable drivers are increasingly being used to disable endpoint protections."],"referencedReports":[{"title":"TerminalFix campaign deploys a reverse tunnel through multistage intrusion","url":"https://www.microsoft.com/en-us/security/blog/2026/08/28/terminalfix-campaign-deploys-reverse-tunnel-through-multistage-intrusion/","publisher":"microsoft","context":"The article says the fake Cloudflare verification page in the infection chain matched tactics documented by Microsoft’s TerminalFix campaign reporting.","category":"research","primary":false},{"title":"Living Off the Cloud: A Python Implant Hiding Its Entire C2 Inside Microsoft 365 \u0026 Azure","url":"https://www.ontinue.com/resource/python-implant-hiding-its-entire-c2-inside-microsoft-365-azure/","publisher":"ontinue","context":"The article uses Ontinue’s documentation to attribute the bootstrap-fat.pyc implant to the TWINLOOT Python malware family.","category":"research","primary":false},{"title":"Hunting the Hunter: A Live Kernel LPE 0day in Anti-Cheat on a Billion Machines","url":"https://blacksnufkin.github.io/posts/Hunting-the-Hunter/","publisher":"blacksnufkin","context":"The article links this technical analysis in its discussion of the vulnerable xhunter1.sys driver from Wellbia XIGNCODE3.","category":"research","primary":false},{"title":"From W-2 to BYOVD: How a Tax Search Leads to Kernel-Mode AV/EDR Kill","url":"https://www.huntress.com/blog/w2-malvertising-to-kernel-mode-edr-kill","publisher":"huntress","context":"The article states that Huntress discovered and reported the vulnerable Huawei audio driver havoc.sys in March.","category":"research","primary":false},{"title":"Killing me gently: Inside Gentlemen’s EDR killer framework","url":"https://www.welivesecurity.com/en/eset-research/killing-me-gently-inside-gentlemens-edr-killer-framework/","publisher":"eset","context":"The article cites ESET’s research on the Gentlemen ransomware group’s curated EDR-killer toolkit as related evidence of reusable criminal tooling.","category":"research","primary":false}],"body":"\u003cp\u003eBeazley Security investigated an INC ransomware incident in which an affiliate gained access through a ClickFix-style trick that led a user to run a malicious PowerShell command. The actor then installed a Python implant identified as TWINLOOT, harvested credentials, attempted RDP logins, and used pass-the-hash activity to move through the network. The backdoor was used for interactive activity including downloading utilities, changing local firewall rules, and installing a Wasabi client for data exfiltration.\u003c/p\u003e\n\n\u003cp\u003eInvestigators found four separate bring-your-own-vulnerable-driver packages deployed across multiple hosts, an unusual volume for a ransomware case according to Beazley. Three involved known drivers, while the novel Redacted EDR Blinder installed a vulnerable IoDrv driver and overwrote key functions in several endpoint-security products so they would immediately exit. The affiliate also concealed a backdoor in a modified SentinelOne DLL that retained much of the original file’s appearance but had its signature removed and an encrypted payload embedded in its resources. The incident illustrates how ransomware operators may increasingly use reusable tools to disable endpoint defenses and disguise malicious code as legitimate security-related software.\u003c/p\u003e\n"},{"n":45,"title":"UK Cybercrime Journal: Manchester Airport Group Breached by FulcrumSec","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/09/uk-cybercrime-journal-manchester.html","time":"09:00","priority":"SHOULD READ","score":85,"tldr":"Manchester Airports Group reportedly suffered a data-extortion breach affecting about 8.7 million customers after FulcrumSec allegedly used exposed Iterable API credentials in client-side JavaScript to steal 86 GB of data. Core aviation operations were unaffected, but the exposed customer information could enable targeted phishing and fraud.","briefOverview":"\u003cp\u003eManchester Airports Group (MAG), which operates Manchester Airport, London Stansted Airport, and East Midlands Airport, reported a data breach on 25 August 2026. The incident reportedly affected personal information belonging to about 8.7 million customers, largely from airport Wi-Fi sign-ups, parking, lounge, and Fast Track security booking services. MAG temporarily suspended its online Manage My Booking service, while stating that passenger safety, aviation security, and flight operations continued normally.\u003c/p\u003e\n\n\u003cp\u003eFulcrumSec claimed the breach on 30 August and told BleepingComputer it had stolen about 86 GB of data. The group alleged that it accessed airport-specific Iterable API credentials exposed in client-side JavaScript and obtained nearly 200,000 records concerning travel planned for the rest of 2026. The article says that although payment-card information was not taken, information such as email addresses, phone numbers, postcodes, and vehicle registrations could be used for targeted email and text-message scams or identity fraud. It also highlights that separating customer-facing platforms from core operational systems limited disruption to airport operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Manchester Airports Group reported on 25 August 2026 that it had suffered a data breach affecting personal information from approximately 8.7 million customers.","The affected information was primarily collected through airport Wi-Fi sign-ups, car parking, airport lounge, and Fast Track security booking services.","MAG temporarily suspended its online \"Manage My Booking\" service, while stating that passenger safety, aviation security, and flight operations were not compromised.","FulcrumSec claimed responsibility on 30 August and said it stole approximately 86 GB of data by using airport-specific Iterable API credentials exposed in client-side JavaScript.","The article says the stolen information could support targeted phishing text and email scams as well as identity theft fraud."],"insights":["Customer-facing services such as Wi-Fi portals, parking, lounge bookings, and Fast Track reservations can hold substantial personal data even when they are separate from core airport operations.","Segregating ancillary web platforms from aviation and operational systems allowed MAG to suspend its booking portal without disrupting flight operations, passenger safety, or aviation security.","The alleged exposure of Iterable API credentials in client-side JavaScript reflects a technique the article says FulcrumSec also used against Arup Group, making continuous reviews of web application code especially important.","MAG’s public guidance about what information was and was not taken may reduce fraud risk by warning customers before criminals use the data for scams."],"referencedReports":[],"body":"\u003cp\u003eManchester Airports Group (MAG), which operates Manchester Airport, London Stansted Airport, and East Midlands Airport, reported a data breach on 25 August 2026. The incident reportedly affected personal information belonging to about 8.7 million customers, largely from airport Wi-Fi sign-ups, parking, lounge, and Fast Track security booking services. MAG temporarily suspended its online Manage My Booking service, while stating that passenger safety, aviation security, and flight operations continued normally.\u003c/p\u003e\n\n\u003cp\u003eFulcrumSec claimed the breach on 30 August and told BleepingComputer it had stolen about 86 GB of data. The group alleged that it accessed airport-specific Iterable API credentials exposed in client-side JavaScript and obtained nearly 200,000 records concerning travel planned for the rest of 2026. The article says that although payment-card information was not taken, information such as email addresses, phone numbers, postcodes, and vehicle registrations could be used for targeted email and text-message scams or identity fraud. It also highlights that separating customer-facing platforms from core operational systems limited disruption to airport operations.\u003c/p\u003e\n"},{"n":37,"title":"Send GitLab an email, push to main","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/gitlab-email-push-to-main","time":"06:00","priority":"SHOULD READ","score":84,"tldr":"GitLab’s project “incoming email” addresses embed a long-lived, account-wide token that can be used by anyone who obtains it to create merge requests, push patches to branches including main, and trigger CI/CD across projects the owner can access. The email path also bypasses GitLab IP restrictions, so users should rotate these tokens and scan repositories and documentation for exposed addresses.","briefOverview":"\u003cp\u003eGitLab’s “Email work item to this project” feature provides an incoming email address containing a long-lived token tied to the user’s account. The article reports that this token is identical in addresses generated for different projects and can reach every project the account can access, rather than only the project displayed in the interface. GitLab processes messages sent from any sender address as the token owner, according to the article.\u003c/p\u003e\n\n\u003cp\u003eChanging an address suffix from \u003ccode\u003e-issue\u003c/code\u003e to \u003ccode\u003e-merge-request\u003c/code\u003e allows merge-request emails, and a Git patch attachment can modify a source branch, including adding a CI/CD job. The researchers report confirming that this path could push code to a protected branch in a private project and run jobs even when the project was protected by an IP allowlist that blocked their browser and Git access. GitLab updated UI wording and documentation after disclosure, but the article says users should rotate incoming email tokens, scan for exposed addresses, and not treat IP allowlists as absolute boundaries for email-based changes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitLab’s “Email work item to this project” addresses contain a long-lived incoming-email token tied to the user account, and the same token appears in addresses generated for different projects.","The article reports that anyone who has an incoming-email address can send mail from any sender address and have GitLab process it as the token owner.","By replacing the address suffix from “-issue” to “-merge-request” and attaching a Git patch, an attacker can create or update a source branch and potentially alter .gitlab-ci.yml to run a CI/CD job.","The researchers confirmed that incoming merge-request email was accepted for a private project protected by an IP allowlist even when browser and Git access from their location were blocked.","GitLab updated its UI and documentation after disclosure but did not change the underlying incoming-email mechanism; the article recommends rotating incoming-email tokens and scanning for exposed addresses."],"insights":["Although GitLab presents each address as belonging to one project, the embedded token is account-wide and identical across addresses generated for the same user, including for private projects.","An attacker does not need access to the victim’s email inbox or control of the sender address, because GitLab does not verify that the message sender matches the token owner.","The token alone is not sufficient to target another private project: the attacker must also know that project’s path slug and ID, while public projects expose both values.","The article found publicly documented incoming-email addresses that maintainers intentionally shared for bug reporting, showing that users may reasonably publish what GitLab labels and formats as an email address.","GitLab’s available reset control invalidates all of a user’s incoming-email addresses at once, and the article states there is no per-project disablement, sender-verification requirement, or bulk-revocation mechanism."],"referencedReports":[],"body":"\u003cp\u003eGitLab’s “Email work item to this project” feature provides an incoming email address containing a long-lived token tied to the user’s account. The article reports that this token is identical in addresses generated for different projects and can reach every project the account can access, rather than only the project displayed in the interface. GitLab processes messages sent from any sender address as the token owner, according to the article.\u003c/p\u003e\n\n\u003cp\u003eChanging an address suffix from \u003ccode\u003e-issue\u003c/code\u003e to \u003ccode\u003e-merge-request\u003c/code\u003e allows merge-request emails, and a Git patch attachment can modify a source branch, including adding a CI/CD job. The researchers report confirming that this path could push code to a protected branch in a private project and run jobs even when the project was protected by an IP allowlist that blocked their browser and Git access. GitLab updated UI wording and documentation after disclosure, but the article says users should rotate incoming email tokens, scan for exposed addresses, and not treat IP allowlists as absolute boundaries for email-based changes.\u003c/p\u003e\n"},{"n":10,"title":"New RemControl Android banking malware targets users in Europe and Canada","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-remcontrol-android-banking-malware-targets-users-in-europe-and-canada/","time":"21:25","priority":"SHOULD READ","score":82,"tldr":"Group-IB reports that the RemControl Android banking trojan is being distributed through fake TVTap Google Play pages and malvertising campaigns targeting users in Europe, Canada, and the Middle East. Once granted Accessibility permissions, it can overlay banking apps, steal credentials, remotely control devices, and evade Google Play Protect by blocking its traffic.","briefOverview":"\u003cp\u003eGroup-IB has identified RemControl, a new Android malware-as-a-service platform distributed through malvertising campaigns and fake Google Play pages impersonating the TVTap IPTV app. The first samples appeared in July, although associated infrastructure has been active since at least May. The malware targets users in Italy, France, Spain, Poland, Portugal, Canada, and countries in the Middle East. Researchers found more than 30 fake banking-app screens designed to steal banking credentials.\u003c/p\u003e\n\n\u003cp\u003eAfter obtaining Accessibility Service permission, RemControl can display full-screen fake screens over legitimate banking apps, capture PINs, banking codes, card expiry dates, and credentials, and remotely perform actions on the device. It can stream screenshots and interface data in real time, record user input, capture pattern-lock coordinates on multiple Android device brands, and make removal more difficult by exiting when certain settings pages are opened. The dropper also starts a VPN service that blocks Google Play services traffic, hindering Play Protect real-time checks, while encrypted control-server details are retrieved through Telegram channels to support infrastructure changes. Group-IB tracks the operator as UNKK based on a shared identifier, found Russian language in some overlay files, and suspects a possible connection to the Medusa banking trojan.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Group-IB identified RemControl, a new Android malware-as-a-service platform spread through malvertising and fake Google Play pages impersonating the TVTap IPTV app.","The malware targets users in Italy, France, Spain, Poland, Portugal, Canada, and countries in the Middle East, with its first observed samples appearing in July.","After receiving Accessibility Service permission, RemControl can show fake screens over banking apps, steal banking information, record user input, stream screen and interface data, and remotely control phone interactions.","RemControl starts a VPN service to block Google Play services traffic and hinder Play Protect real-time checks, and it retrieves encrypted command-and-control details from Telegram channels.","Group-IB linked the operator to the identifier UNKK, found Russian language in some phishing-overlay files, and suspects a connection to the Medusa banking trojan."],"insights":["RemControl uses a VPN service to block Google Play services traffic, which prevents Play Protect from conducting real-time checks against known malicious apps.","The malware obtains encrypted control-server information through Telegram channels, allowing its operators to change their infrastructure if it is disrupted.","RemControl can detect when a victim opens app-management, accessibility, or factory-reset settings and automatically exit to make removal more difficult.","The fake download sites contain Meta Pixel tracking IDs, which Group-IB says suggests the operators used Meta’s advertising ecosystem to direct people to the malicious pages.","One phishing screen displays an AI assistant response, which Group-IB identifies as a strong indication that AI models helped create the malware."],"referencedReports":[{"title":"RemControl Android Banking Trojan","url":"https://www.group-ib.com/blog/remcontrol-android-banking-trojan/","publisher":"group-ib","context":"The article relies on Group-IB's research into the RemControl Android banking malware, its distribution, capabilities, and infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eGroup-IB has identified RemControl, a new Android malware-as-a-service platform distributed through malvertising campaigns and fake Google Play pages impersonating the TVTap IPTV app. The first samples appeared in July, although associated infrastructure has been active since at least May. The malware targets users in Italy, France, Spain, Poland, Portugal, Canada, and countries in the Middle East. Researchers found more than 30 fake banking-app screens designed to steal banking credentials.\u003c/p\u003e\n\n\u003cp\u003eAfter obtaining Accessibility Service permission, RemControl can display full-screen fake screens over legitimate banking apps, capture PINs, banking codes, card expiry dates, and credentials, and remotely perform actions on the device. It can stream screenshots and interface data in real time, record user input, capture pattern-lock coordinates on multiple Android device brands, and make removal more difficult by exiting when certain settings pages are opened. The dropper also starts a VPN service that blocks Google Play services traffic, hindering Play Protect real-time checks, while encrypted control-server details are retrieved through Telegram channels to support infrastructure changes. Group-IB tracks the operator as UNKK based on a shared identifier, found Russian language in some overlay files, and suspects a possible connection to the Medusa banking trojan.\u003c/p\u003e\n"},{"n":41,"title":"Malicious Firefox Extension Poses as PDF Identity Verifier to Hijack Google Accounts","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/firefox-google-account-takeover?utm_medium=feed","time":"21:37","priority":"SHOULD READ","score":82,"tldr":"A malicious Firefox extension posing as a PDF identity verifier remotely arms itself after installation to inject scripts into real Google sign-in pages, steal OAuth session cookies, and potentially reset victims’ passwords. Organizations should remove pdf-para-texto@extensao.local, revoke affected Google sessions, reset credentials from clean devices, and block pdf.gusercontent.com.","briefOverview":"\u003cp\u003eSocket identified a malicious Firefox extension, \u003ccode\u003epdf-para-texto@extensao.local\u003c/code\u003e, that posed as a PDF identity-verification tool and was published to the Firefox Add-ons store on September 3, 2026. Its malicious functionality was introduced in version 1.4 on September 11, 2026, targeting Portuguese- and Spanish-speaking users. The extension had no significant user base at publication, but Socket highlighted its design to avoid detection by shipping without hardcoded malicious code, target URLs, or theft endpoints.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, the extension opened an attacker-controlled lookalike domain, \u003ccode\u003epdf.gusercontent.com\u003c/code\u003e, which delivered configuration and a payload through an open message bridge. Once armed, it watched Google responses for \u003ccode\u003eoauth_token\u003c/code\u003e cookies, sent captured values to an attacker endpoint, and injected a script into real \u003ccode\u003eaccounts.google.com\u003c/code\u003e pages. The injected script hid its activity behind a fake identity-validation overlay, automated Google\u0026rsquo;s sign-in flow, and could silently set a new password when Google prompted for a password reset, giving the attacker both session access and potentially attacker-controlled credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket identified a malicious Firefox extension, pdf-para-texto@extensao.local, that impersonates a PDF identity-verification utility and targets Google accounts.","The extension initially contains no hardcoded credential-stealing code or attacker addresses, instead retrieving its configuration and payload from attacker-controlled infrastructure after installation.","After being armed, the extension injects a script into real accounts.google.com pages, displays a fake identity-validation overlay, and automates parts of Google’s sign-in and recovery flows.","The extension monitors Google responses for Set-Cookie headers containing oauth_token and sends captured cookie values to the attacker’s collection endpoint.","Socket said the extension had no significant user base at publication, but its post-install payload delivery design makes detection more difficult."],"insights":["The extension was designed so that store review and static scanning would see a generic, apparently harmless dispatcher rather than hardcoded malicious URLs, credential theft logic, or payload code.","A page opened automatically after installation could send messages through an exposed bridge and direct the extension’s privileged background component to save attacker-supplied settings, which then activated its monitoring and code-injection behavior.","The attackers had two concurrent routes to access an account: capturing an OAuth session cookie from Google responses and, when Google required it, silently setting a new password controlled by the attackers.","The injected script ran on Google’s real account pages and used a full-screen “Validating your identity…” overlay to conceal the automated account-takeover process from the victim."],"referencedReports":[],"body":"\u003cp\u003eSocket identified a malicious Firefox extension, \u003ccode\u003epdf-para-texto@extensao.local\u003c/code\u003e, that posed as a PDF identity-verification tool and was published to the Firefox Add-ons store on September 3, 2026. Its malicious functionality was introduced in version 1.4 on September 11, 2026, targeting Portuguese- and Spanish-speaking users. The extension had no significant user base at publication, but Socket highlighted its design to avoid detection by shipping without hardcoded malicious code, target URLs, or theft endpoints.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, the extension opened an attacker-controlled lookalike domain, \u003ccode\u003epdf.gusercontent.com\u003c/code\u003e, which delivered configuration and a payload through an open message bridge. Once armed, it watched Google responses for \u003ccode\u003eoauth_token\u003c/code\u003e cookies, sent captured values to an attacker endpoint, and injected a script into real \u003ccode\u003eaccounts.google.com\u003c/code\u003e pages. The injected script hid its activity behind a fake identity-validation overlay, automated Google\u0026rsquo;s sign-in flow, and could silently set a new password when Google prompted for a password reset, giving the attacker both session access and potentially attacker-controlled credentials.\u003c/p\u003e\n"},{"n":4,"title":"Placeholder domain used in dev docs now serves ClickFix attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/placeholder-domain-used-in-dev-docs-now-serves-clickfix-attacks/","time":"22:46","priority":"SHOULD READ","score":78,"tldr":"The commonly used but unreserved placeholder domain third-party.com is serving a fake Cloudflare verification page that tricks Windows users into pasting and running a malicious PowerShell command. Developers should replace literal references to the domain with IANA-reserved example domains, as copied documentation or test code could direct users to attacker-controlled content.","briefOverview":"\u003cp\u003eThe domain third-party.com, long used as a placeholder in developer documentation, is serving a fake Cloudflare verification page to Windows users. The page uses a ClickFix scheme: after a visitor clicks its verification box, it copies a PowerShell command to the clipboard and instructs the visitor to open Windows Run, paste the command, and execute it. Manifold Security first reported the behavior after finding references to the domain in public AI skills and MCP server documentation, and BleepingComputer confirmed the fake CAPTCHA page.\u003c/p\u003e\n\n\u003cp\u003eThe command reconstructs a payload URL, downloads a PowerShell script, and runs it. A May 2026 Hybrid Analysis report showed that the script previously downloaded a 134MB ZIP archive, extracted it, and attempted to launch draw.io.exe, although the archive was unavailable for further analysis and the payload host no longer resolved during testing. The campaign selectively targets Windows users; macOS and Linux visitors instead receive an unsupported-system message.\u003c/p\u003e\n\n\u003cp\u003eThe incident is notable because third-party.com is not reserved for documentation, unlike IANA-maintained example.com, example.net, and example.org. The domain appears in more than 1,500 files across over 1,700 repositories and is used in some examples that could make real network requests if copied literally. There are no reports that these references have led to ClickFix execution on developers\u0026rsquo; devices or in applications, but the live domain could be switched to another active payload source.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The domain third-party.com is serving a fake Cloudflare verification page that targets Windows users and attempts to trick them into running a PowerShell command.","After a visitor clicks the fake verification box, the site copies a command to the Windows clipboard and instructs the user to open Run, paste it, and press Enter.","The command reconstructs a payload URL, downloads a PowerShell script, and executes it; at the time of testing, the referenced domain no longer resolved.","A May 2026 Hybrid Analysis report showed the site previously distributed a script that downloaded and extracted a 134MB ZIP archive before attempting to launch draw.io.exe.","Unlike IANA-reserved example domains, third-party.com is a registered domain that has been widely used as a placeholder in public developer documentation and code examples."],"insights":["The malicious page delivers its command-copying behavior only to Windows users, while macOS and Linux visitors receive an unsupported-system message, making a casual review from those systems less likely to reveal the harmful behavior.","third-party.com has appeared in more than 1,500 files across over 1,700 repositories, including documentation associated with Chromium, Sanity, and Vercel, despite not being reserved for documentation.","Some published examples use third-party.com in code that can make real network requests when copied literally, rather than only displaying it as a written example.","The observed payload host was no longer reachable during testing, but third-party.com remained live and could be changed to point to another active payload source."],"referencedReports":[{"title":"Hybrid Analysis report for sample daf619aa8cc74dab02c360f46f9f4b7b1654ba478ee89992a3512a46f1f4c209","url":"http://hybrid-analysis.com/sample/daf619aa8cc74dab02c360f46f9f4b7b1654ba478ee89992a3512a46f1f4c209/69f58b7b764663dc310e3548","publisher":"hybrid-analysis","context":"The article cites this May 2, 2026 report as evidence that the site previously distributed a PowerShell script that downloaded a 134MB ZIP archive and attempted to launch draw.io.exe.","category":"research","primary":false}],"body":"\u003cp\u003eThe domain third-party.com, long used as a placeholder in developer documentation, is serving a fake Cloudflare verification page to Windows users. The page uses a ClickFix scheme: after a visitor clicks its verification box, it copies a PowerShell command to the clipboard and instructs the visitor to open Windows Run, paste the command, and execute it. Manifold Security first reported the behavior after finding references to the domain in public AI skills and MCP server documentation, and BleepingComputer confirmed the fake CAPTCHA page.\u003c/p\u003e\n\n\u003cp\u003eThe command reconstructs a payload URL, downloads a PowerShell script, and runs it. A May 2026 Hybrid Analysis report showed that the script previously downloaded a 134MB ZIP archive, extracted it, and attempted to launch draw.io.exe, although the archive was unavailable for further analysis and the payload host no longer resolved during testing. The campaign selectively targets Windows users; macOS and Linux visitors instead receive an unsupported-system message.\u003c/p\u003e\n\n\u003cp\u003eThe incident is notable because third-party.com is not reserved for documentation, unlike IANA-maintained example.com, example.net, and example.org. The domain appears in more than 1,500 files across over 1,700 repositories and is used in some examples that could make real network requests if copied literally. There are no reports that these references have led to ClickFix execution on developers\u0026rsquo; devices or in applications, but the live domain could be switched to another active payload source.\u003c/p\u003e\n"},{"n":6,"title":"Microsoft: September Windows updates break Always On VPN connections","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-september-2026-windows-updates-break-always-on-vpn-connections/","time":"11:18","priority":"SHOULD READ","score":78,"tldr":"Microsoft says September 2026 Windows 11 security updates can cause Always On VPN connections using automatic IKEv2/SSTP protocol fallback to hang or fail with a port-in-use error. Until a permanent fix is available, administrators should configure affected VPN profiles to use either IKEv2-only or SSTP-only.","briefOverview":"\u003cp\u003eMicrosoft has warned that September 2026 Windows 11 security updates can cause Always On VPN connection problems for users trying to reach their organization’s enterprise network. Always On VPN automatically establishes a secure connection to a corporate network when a device connects to the internet and supports IKEv2 and SSTP connection protocols. Microsoft lists Windows 11 versions 26H1, 25H2, and 24H2 as affected, through KB5124012 and KB5124008.\u003c/p\u003e\n\n\u003cp\u003eThe problem occurs when an Always On VPN profile is configured to automatically try another connection method after the initial method fails, such as switching between IKEv2 and SSTP. Affected connections may remain stuck in a “Connecting” state, repeatedly attempt to connect unsuccessfully, or later show the error, “The specified port is already in use.” While it works on a permanent fix, Microsoft advises IT administrators to configure affected profiles to use one protocol only—either SSTP or IKEv2—based on organizational requirements.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says the September 2026 Windows 11 security updates can disrupt Always On VPN connections to enterprise networks.","The issue can occur when an Always On VPN profile automatically tries another protocol after the first connection method fails, such as switching between IKEv2 and SSTP.","Affected VPN connections may remain stuck in a connecting state, repeatedly fail to connect, or display the error \"The specified port is already in use.\"","Microsoft lists Windows 11 versions 26H1, 25H2, and 24H2 as affected by updates KB5124012 and KB5124008.","Until a permanent fix is available, Microsoft recommends configuring affected Always On VPN profiles to use only SSTP or only IKEv2."],"insights":["The affected configuration is specifically automatic protocol fallback, meaning organizations using a single Always On VPN protocol can avoid the documented failure mode without removing the service entirely.","Microsoft’s interim mitigation requires an operational trade-off: administrators must choose either SSTP or IKEv2 based on their environment, security, and deployment requirements while the permanent fix is pending.","The VPN issue is part of a broader set of September 2026 update problems that also prompted emergency fixes for Hyper-V, Remote Desktop Services, and USB audio issues.","The documented symptoms include both persistent connection attempts and a misleading-looking port-in-use error on later attempts, which can help distinguish this issue from a simple loss of network access."],"referencedReports":[{"title":"Windows Release Health service alert WI1477233","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1477233","publisher":"microsoft","context":"Microsoft’s service alert describes the Always On VPN connection failures after September 2026 Windows 11 updates and provides the temporary single-protocol mitigation.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft has warned that September 2026 Windows 11 security updates can cause Always On VPN connection problems for users trying to reach their organization’s enterprise network. Always On VPN automatically establishes a secure connection to a corporate network when a device connects to the internet and supports IKEv2 and SSTP connection protocols. Microsoft lists Windows 11 versions 26H1, 25H2, and 24H2 as affected, through KB5124012 and KB5124008.\u003c/p\u003e\n\n\u003cp\u003eThe problem occurs when an Always On VPN profile is configured to automatically try another connection method after the initial method fails, such as switching between IKEv2 and SSTP. Affected connections may remain stuck in a “Connecting” state, repeatedly attempt to connect unsuccessfully, or later show the error, “The specified port is already in use.” While it works on a permanent fix, Microsoft advises IT administrators to configure affected profiles to use one protocol only—either SSTP or IKEv2—based on organizational requirements.\u003c/p\u003e\n"},{"n":13,"title":"Meet AvisLoader: A Windows Loader Built to Outlast a Takedown","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/meet-avisloader-a-windows-loader-built-to-outlast-a-takedown","time":"13:00","priority":"SHOULD READ","score":78,"tldr":"Varonis researchers uncovered A
