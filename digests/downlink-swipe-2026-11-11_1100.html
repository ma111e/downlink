<script type="application/json" id="dl-articles">[{"n":8,"title":"CERT-In’s CRAFTY FALCON Advisory: AI Is the Accelerant, Your Payment APIs Are the Target","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/crafty-falcon-ai-assisted-financial-threat-actor/","time":"11:19","priority":"MUST READ","score":93,"tldr":"CERT-In warns that the active CRAFTY FALCON campaign is using AI-assisted offensive tools to exploit weak staging environments, shared credentials, and trusted payment API paths to steal funds from Indian financial organizations. Defenses should prioritize strict production isolation, short-lived secrets, server-side payment validation, cloud monitoring, and rapid fraud detection.","briefOverview":"\u003cp\u003eCERT-In has named an active campaign targeting Indian financial organizations CRAFTY FALCON, describing it as an AI-assisted financial threat actor. The campaign affects NBFCs, digital lenders, fintechs, payment aggregators, payment service providers, and cryptocurrency exchanges. Organizations that addressed an earlier warning were reportedly targeted again, including after incomplete cleanup, with attacks timed for holidays and weekends.\u003c/p\u003e\n\n\u003cp\u003eThe attackers exploit exposed UAT and staging servers, hardcoded API tokens, plaintext credentials, missing MFA, file-upload flaws, and deserialization flaws. Shared production and non-production credentials or network paths enable movement into production, while AWS Systems Manager and Lambda are used as legitimate cloud channels for commands. The attackers test fraudulent routes with Rs 1 transfers, then send larger amounts to mule accounts; CERT-In says requests routed through victims\u0026rsquo; allow-listed infrastructure can appear normal to payment partners and bypass controls including KYC, beneficiary verification, balance checks, and transaction limits.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that AI tooling chiefly increases the speed of the attack cycle by rapidly refining scripts, adapting to target responses, rotating infrastructure, and retesting organizations. CERT-In recommends separating non-production from production, replacing client and source-IP trust with server-side validation and signed requests, rotating long-lived secrets, monitoring cloud-control-plane activity, and strengthening weekend and holiday response. It also notes reports that a GitHub copy of the ARTEX tool pulled a Docker image containing a hidden root shell, although the article says this has not been tied to CRAFTY FALCON.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-In says the active CRAFTY FALCON campaign targets Indian NBFCs, digital lenders, fintechs, payment firms, and cryptocurrency exchanges by abusing their payment and disbursement APIs.","The campaign gains access through exposed UAT or staging servers, hardcoded API tokens, plaintext credentials, missing MFA, and flaws in file-upload or deserialization functionality.","Attackers move from non-production to production environments through shared credentials and network paths, then use legitimate AWS Systems Manager and Lambda channels to run commands.","CERT-In reports that attackers test routes with Rs 1 transfers before sending larger amounts to mule accounts, including through merchant settlement APIs.","The advisory recommends separating non-production from production, replacing IP-based trust with server-side signed requests and mutual TLS or scoped keys, rotating long-lived secrets, and monitoring cloud-control-plane activity."],"insights":["The campaign can make fraudulent payment requests appear legitimate to payment partners because the requests originate through the victim’s own allow-listed infrastructure, allowing them to bypass checks such as beneficiary verification and transaction limits.","The article emphasizes that AI’s main impact is speed: automated tools can rapidly tailor scripts, adapt to target responses, rotate infrastructure, and revisit organizations to test whether remediation was incomplete.","A Rs 1 transfer is used as a practical signal that a fraudulent payment route works before attackers attempt larger transfers to mule accounts.","Weekend and holiday timing is a meaningful operational risk because the attackers have deliberately scheduled activity for periods when monitoring and response may be weaker."],"referencedReports":[{"title":"Advisory CIAD-2026-0058: Escalation of AI-Driven Attacks on BFSI Entities by Threat Actor \"CRAFTY FALCON\"","url":"https://www.cert-in.org.in/s2cMainServlet?VLCODE=CIAD-2026-0058\u0026pageid=PUBVLNOTES02","publisher":"cert-in","context":"The article is based primarily on this CERT-In advisory, which describes the active CRAFTY FALCON campaign and its recommended mitigations.","category":"advisory","primary":true},{"title":"Crafty Falcon: Weaponized Pentest Agents Hit the Financial Sector","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-crafty-falcon-autonomous-offensive-ai-fram/","publisher":"cloud-security-alliance","context":"The article lists this Cloud Security Alliance research note as a source on the CRAFTY FALCON campaign.","category":"research","primary":false}],"body":"\u003cp\u003eCERT-In has named an active campaign targeting Indian financial organizations CRAFTY FALCON, describing it as an AI-assisted financial threat actor. The campaign affects NBFCs, digital lenders, fintechs, payment aggregators, payment service providers, and cryptocurrency exchanges. Organizations that addressed an earlier warning were reportedly targeted again, including after incomplete cleanup, with attacks timed for holidays and weekends.\u003c/p\u003e\n\n\u003cp\u003eThe attackers exploit exposed UAT and staging servers, hardcoded API tokens, plaintext credentials, missing MFA, file-upload flaws, and deserialization flaws. Shared production and non-production credentials or network paths enable movement into production, while AWS Systems Manager and Lambda are used as legitimate cloud channels for commands. The attackers test fraudulent routes with Rs 1 transfers, then send larger amounts to mule accounts; CERT-In says requests routed through victims\u0026rsquo; allow-listed infrastructure can appear normal to payment partners and bypass controls including KYC, beneficiary verification, balance checks, and transaction limits.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that AI tooling chiefly increases the speed of the attack cycle by rapidly refining scripts, adapting to target responses, rotating infrastructure, and retesting organizations. CERT-In recommends separating non-production from production, replacing client and source-IP trust with server-side validation and signed requests, rotating long-lived secrets, monitoring cloud-control-plane activity, and strengthening weekend and holiday response. It also notes reports that a GitHub copy of the ARTEX tool pulled a Docker image containing a hidden root shell, although the article says this has not been tied to CRAFTY FALCON.\u003c/p\u003e\n"},{"n":9,"title":"Emerging Threat: (CVE-2026-88243) Windows DHCP Server Remote Code Execution via Out-of-Bounds Read","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-88243-windows-dhcp-server-remote-code-execution-via-out-of-bounds-read/","time":"13:23","priority":"MUST READ","score":92,"tldr":"Microsoft’s November 2026 updates patch CVE-2026-88243, a critical unauthenticated remote-code-execution flaw in the Windows DHCP Server service affecting Windows Server 2016 through 2025. Organizations should urgently patch DHCP servers and block untrusted inbound UDP/67 exposure.","briefOverview":"\u003cp\u003eCVE-2026-88243 is a critical out-of-bounds read vulnerability in the Windows DHCP Server service that can allow unauthenticated remote code execution over a network. Microsoft addressed the issue in its November 2026 security updates. The flaw has a CVSS v3.1 score of 9.8, requires no credentials, privileges, or user interaction, and has low attack complexity.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include Windows Server 2016, 2019, 2022, and 2025, including Server Core installations, when the DHCP Server role is installed. Successful exploitation could give an attacker control of a server that may be close to directory and network infrastructure, affecting confidentiality, integrity, and availability. Organizations should confirm the relevant patches are installed, inventory DHCP servers, block inbound UDP/67 from untrusted networks, audit cloud security groups, and monitor DHCP Server logs for crashes or unexpected restarts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-88243 is a critical out-of-bounds read flaw in the Windows DHCP Server service that can allow an unauthenticated attacker to execute code remotely over a network.","Microsoft addressed the vulnerability in its November 2026 security updates, with affected Windows Server 2016, 2019, 2022, and 2025 builds requiring the relevant fixes.","The vulnerability has a CVSS v3.1 score of 9.8 and requires no credentials, privileges, user interaction, or high attack complexity.","At the time of writing, the issue was not listed in CISA’s Known Exploited Vulnerabilities catalog and no public proof of concept had been reported.","Organizations should inventory servers with the DHCP Server role, block inbound UDP/67 from untrusted networks, audit cloud security groups, and monitor DHCP Server logs for crashes or unexpected restarts."],"insights":["Externally reachable Windows Server assets may only be potentially affected because outside observation cannot confirm whether the DHCP Server role is actually enabled.","Internet exposure of DHCP servers is described as commonly resulting from configuration drift, including permissive cloud security groups, flat networks, VPN or partner links, and legacy systems.","Windows Server 2016 hosts merit a direct verification because the article identifies them as the systems most likely to have fallen out of the regular patch cycle.","Although no public proof of concept or known exploitation was reported, researchers have grouped the flaw with potentially wormable network bugs because it can be reached without credentials or user interaction."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-88243 is a critical out-of-bounds read vulnerability in the Windows DHCP Server service that can allow unauthenticated remote code execution over a network. Microsoft addressed the issue in its November 2026 security updates. The flaw has a CVSS v3.1 score of 9.8, requires no credentials, privileges, or user interaction, and has low attack complexity.\u003c/p\u003e\n\n\u003cp\u003eAffected systems include Windows Server 2016, 2019, 2022, and 2025, including Server Core installations, when the DHCP Server role is installed. Successful exploitation could give an attacker control of a server that may be close to directory and network infrastructure, affecting confidentiality, integrity, and availability. Organizations should confirm the relevant patches are installed, inventory DHCP servers, block inbound UDP/67 from untrusted networks, audit cloud security groups, and monitor DHCP Server logs for crashes or unexpected restarts.\u003c/p\u003e\n"},{"n":4,"title":"Hackers Target Qlik Sense Servers With Reverse Shells, Stage ActiveMQ and Veeam Exploits","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-target-qlik-sense-servers-with.html","time":"14:01","priority":"SHOULD READ","score":86,"tldr":"Threat actors targeted Qlik Sense servers in Europe with PowerShell reverse shells and infrastructure containing ActiveMQ and Veeam exploit tooling, echoing tactics associated with past CACTUS ransomware intrusions. Organizations should patch Qlik Sense and monitor for scheduler.exe-launched PowerShell, OpenSSH persistence, and connections to 45.115.26.23.","briefOverview":"\u003cp\u003eCynet detected attempts in October 2026 to run PowerShell reverse-shell commands on Qlik Sense servers used by several E.U.-based customers. The activity occurred within a little more than three minutes and resembled elements of a November 2023 campaign associated with the CACTUS ransomware operation. The exact Qlik Sense flaw used in the latest activity is not known.\u003c/p\u003e\n\n\u003cp\u003eThe attempted command, launched under scheduler.exe, tried to connect to 45.115.26[.]23 on port 4455, but the reverse-shell attempts were blocked. Cynet’s controlled testing found that the shell could support reconnaissance and delivery of scripts that establish continued access, including a Windows Go reverse shell and an OpenSSH-based scheduled task named WinUpdCheck. The related infrastructure also hosted an Apache ActiveMQ exploit for CVE-2023-46604 and a modified Veeam toolchain for CVE-2024-40711, alongside Qlik-related persistence tools.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cynet detected attempts in October 2026 to run PowerShell reverse-shell commands on Qlik Sense servers belonging to several European Union-based customers within a period of just over three minutes.","The attempted reverse shell connected to 45.115.26[.]23 on port 4455 and was executed under scheduler.exe, but the attempts were blocked.","The exact Qlik Sense vulnerability used in the latest activity is unknown, although the activity overlaps with a November 2023 CACTUS ransomware campaign that exploited Qlik Sense flaws.","Analysis of the attackers’ infrastructure found a Windows Go backdoor, SSH persistence scripts, an Apache ActiveMQ exploit for CVE-2023-46604, and a modified Veeam toolchain for CVE-2024-40711.","A PowerShell script variant attempted to install OpenSSH and create a scheduled task named WinUpdCheck to run a reverse shell every five minutes."],"insights":["CVE-2023-48365, also called DoubleQlik, was an incomplete fix for the earlier Qlik Sense flaw CVE-2023-41265.","Although the observed reverse-shell attempts were blocked, Cynet’s controlled testing showed the shell could be used for system reconnaissance and delivery of persistence-enabling PowerShell scripts.","One persistence script used a legitimate OpenSSH package, configured the SSH service to start automatically, and opened inbound TCP port 22 if the service was unavailable.","The suspected activity against multiple E.U.-based customers occurred within a window of only slightly more than three minutes."],"referencedReports":[{"title":"November 2023 CACTUS ransomware campaign targeting Qlik Sense","url":"https://thehackernews.com/2023/11/cactus-ransomware-exploits-qlik-sense.html","publisher":"arctic-wolf","context":"The article cites Arctic Wolf’s documentation of a November 2023 campaign in which CACTUS-linked actors likely exploited newly disclosed Qlik Sense flaws.","category":"research","primary":false},{"title":"Critical Security fixes for Qlik Sense Enterprise for Windows","url":"https://community.qlik.com/t5/Official-Support-Articles/Critical-Security-fixes-for-Qlik-Sense-Enterprise-for-Windows/ta-p/2110801","publisher":"qlik","context":"The article references this Qlik advisory for patches addressing CVE-2023-41265 and CVE-2023-41266.","category":"advisory","primary":false},{"title":"Critical Security fixes for Qlik Sense Enterprise for Windows","url":"https://community.qlik.com/t5/Official-Support-Articles/Critical-Security-fixes-for-Qlik-Sense-Enterprise-for-Windows/tac-p/2120510","publisher":"qlik","context":"The article references this Qlik advisory for the patch addressing CVE-2023-48365, also known as DoubleQlik.","category":"advisory","primary":false}],"body":"\u003cp\u003eCynet detected attempts in October 2026 to run PowerShell reverse-shell commands on Qlik Sense servers used by several E.U.-based customers. The activity occurred within a little more than three minutes and resembled elements of a November 2023 campaign associated with the CACTUS ransomware operation. The exact Qlik Sense flaw used in the latest activity is not known.\u003c/p\u003e\n\n\u003cp\u003eThe attempted command, launched under scheduler.exe, tried to connect to 45.115.26[.]23 on port 4455, but the reverse-shell attempts were blocked. Cynet’s controlled testing found that the shell could support reconnaissance and delivery of scripts that establish continued access, including a Windows Go reverse shell and an OpenSSH-based scheduled task named WinUpdCheck. The related infrastructure also hosted an Apache ActiveMQ exploit for CVE-2023-46604 and a modified Veeam toolchain for CVE-2024-40711, alongside Qlik-related persistence tools.\u003c/p\u003e\n"},{"n":5,"title":"eMudhra Revokes 8 More CAs It Previously Declared Unaffected by Key Compromise","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/emudhra-revokes-8-more-cas-it.html","time":"12:00","priority":"SHOULD READ","score":84,"tldr":"eMudhra revoked eight additional intermediate certificate authorities after discovering that their RSA private keys were exported into a Python process during a flawed 2025 key-transfer ceremony, despite initially saying they were unaffected. The incident expands the company’s certificate-authority failures and reinforces its planned exit from the publicly trusted TLS business.","briefOverview":"\u003cp\u003eeMudhra revoked eight additional intermediate certificate authorities after determining that their RSA private keys were read from hardware security modules into a Python process during an April 30, 2025 transfer practice run. The company had previously said these issuers were unaffected, but later concluded it could not prove the key material was handled in compliance with its own rules. Six of the revoked authorities issued TLS website certificates and two issued code-signing certificates. eMudhra says all holders of the 195 listed certificates have been moved to replacements.\u003c/p\u003e\n\n\u003cp\u003eThe same transfer script caused the earlier October incident involving eight ECDSA keys by truncating each private value to its first byte, making the resulting keys extremely weak despite still producing valid signatures. The weak-key certificates passed linting and two WebTrust audit cycles, and invalid certificate-revocation-list signatures in June 2025 were an earlier sign of the process fault. eMudhra says it knows of no misuse, though someone holding one of the October keys could have impersonated websites; browsers enforcing Certificate Transparency could not have been fooled. The company is leaving the publicly trusted TLS business, while Microsoft, Chrome, Firefox, and Apple are ending or limiting trust in certificates from its remaining G1 hierarchy on their stated schedules.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["eMudhra revoked eight additional intermediate certificate authorities after determining that their RSA private keys had been read from hardware security modules into a Python process during an April 30, 2025 key-transfer practice run.","The company had previously said the eight RSA issuers were unaffected, but later concluded it could not demonstrate that their key material had been handled in accordance with its own rules.","Six of the newly revoked authorities issued website certificates and two issued code-signing certificates; eMudhra listed 195 certificates from them and said all holders had been moved to new certificates.","The same script had reduced eight separate ECDSA private keys to a single leading byte, leading to the October compromise and revocation of those authorities.","eMudhra says it knows of no misuse, while Microsoft, Chrome, Firefox, and Apple are ending or limiting trust in certificates from its remaining G1 hierarchy on the stated schedules."],"insights":["The flawed transfer script produced ECDSA keys weak enough to be derived from public certificates, yet the resulting certificates passed linting and two WebTrust audit cycles because the weak keys still generated valid signatures.","The eight RSA authorities were revoked even though their keys were not shortened and their signatures remained valid, because eMudhra could not prove that copying private-key material into the ceremony computer's memory met its own handling requirements.","Invalid certificate-revocation-list signatures in June 2025 were an earlier indicator of the same process fault, but eMudhra resolved them by signing with the weak keys rather than identifying the underlying problem.","Certificate Transparency-enforcing browsers could not have been deceived by holders of the compromised October keys, while the article says potential misuse against software that does not perform that check is unknown."],"referencedReports":[{"title":"eMudhra Incident Report","url":"https://bugzilla.mozilla.org/show_bug.cgi?id=2083449#c82","publisher":"emudhra","context":"The article relies on eMudhra's full incident report for details of the April 2025 key ceremony, the script failure, and the subsequent RSA key-handling findings.","category":"advisory","primary":true},{"title":"Microsoft Response to Compromised eMudhra Certificate Authority Keys","url":"https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys","publisher":"microsoft","context":"The article cites Microsoft's security response post for its schedule to remove the remaining eMudhra roots from Windows and Edge trust.","category":"advisory","primary":false},{"title":"Apple Support Note 149555","url":"https://support.apple.com/en-us/149555","publisher":"apple","context":"The article cites Apple's support note for changes in specified macOS versions that stop bundled command-line tools from accepting compromised TLS CA certificates and remove affected roots.","category":"advisory","primary":false}],"body":"\u003cp\u003eeMudhra revoked eight additional intermediate certificate authorities after determining that their RSA private keys were read from hardware security modules into a Python process during an April 30, 2025 transfer practice run. The company had previously said these issuers were unaffected, but later concluded it could not prove the key material was handled in compliance with its own rules. Six of the revoked authorities issued TLS website certificates and two issued code-signing certificates. eMudhra says all holders of the 195 listed certificates have been moved to replacements.\u003c/p\u003e\n\n\u003cp\u003eThe same transfer script caused the earlier October incident involving eight ECDSA keys by truncating each private value to its first byte, making the resulting keys extremely weak despite still producing valid signatures. The weak-key certificates passed linting and two WebTrust audit cycles, and invalid certificate-revocation-list signatures in June 2025 were an earlier sign of the process fault. eMudhra says it knows of no misuse, though someone holding one of the October keys could have impersonated websites; browsers enforcing Certificate Transparency could not have been fooled. The company is leaving the publicly trusted TLS business, while Microsoft, Chrome, Firefox, and Apple are ending or limiting trust in certificates from its remaining G1 hierarchy on their stated schedules.\u003c/p\u003e\n"},{"n":6,"title":"Over 35,000 Grok-Built Apps Exposed Online, Some Leaking Confidential Data and Passwords","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/over-35000-grok-built-apps-exposed.html","time":"12:19","priority":"SHOULD READ","score":84,"tldr":"Researchers found that 35,578 of 37,571 publicly discoverable Grok-built apps were accessible without sign-in, exposing internal and personal data from dozens of organizations, including xAI and X. The issue is amplified by insecure default sharing settings, DNS discoverability, and test apps with flawed access controls.","briefOverview":"\u003cp\u003eSecurity company Claroc found that 35,578 of 37,571 Grok-built apps it identified online could be opened without sign-in. The researchers said roughly 2% of these open apps contained high- or critical-severity material, including internal business information, personal data, patient information, employee directories, live shift boards, and passwords stored in plain text. They identified data from 30 organizations beyond X and SpaceXSI, including six Fortune 500 companies, and found 24 publicly accessible apps created by X and SpaceXSI staff.\u003c/p\u003e\n\n\u003cp\u003eGrok Build assigns published apps a grok.me subdomain, and Claroc said the publishing flow in its paid account had “Anyone with the link” preselected. Although Grok suggests random-word names that are difficult to guess, passive DNS services can record and make those subdomains searchable after visitors open them. In tests on apps they created, Claroc found one app had no sign-in protection and another let an uninvited account access, edit, and delete customer data because the generated code added users before verifying they belonged to the team.\u003c/p\u003e\n\n\u003cp\u003eSpaceXSI removed the 24 staff apps after the researchers reported them, but Claroc said it did not receive a response before publication and the company did not state it would contact other affected app owners. Claroc recommended that organizations identify AI app builders used by staff, search relevant domains in passive DNS data, verify that apps containing internal data are restricted to invited users or their owner, and test whether outside accounts can access them. The researchers said setting an app to “Only you” returned a 401 error to an outsider for both its page and data, while unpublishing took an app offline within seconds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Claroc found 35,578 of 37,571 Grok-built apps online were accessible without sign-in, and estimated that about 2% of the open apps contained high- or critical-severity material.","The exposed apps included 24 created by X and SpaceXSI staff, with examples such as a confidential sales-hire onboarding plan, a 594-account sales territory map, and a confidential X advertising proposal to a U.S. federal agency.","Researchers identified internal data from 30 additional organizations, including a hospital employee directory, an intensive-care patient briefing, a fire department shift board, and a contractor timesheet application containing employee passwords in plain text.","Claroc said Grok publishes apps on grok.me subdomains and defaults the sharing setting to “Anyone with the link,” while passive DNS records can reveal those subdomains.","In tests on their own Grok apps, the researchers found that one app had no sign-in protection and another allowed an uninvited account to access, edit, and delete customer data because its membership check was implemented incorrectly."],"insights":["Hard-to-guess Grok app names did not protect exposed apps because visiting an app creates a DNS lookup that can be recorded and searched through passive DNS services.","Grok-generated sign-in buttons were not sufficient protection in one test: the app added a new user to its team before verifying authorization, allowing an uninvited account to view, alter, and delete customer data.","Although SpaceXSI said employee accounts default to “Only you,” researchers still found 24 publicly accessible apps created by company and X staff.","In the researchers’ tests, selecting “Only you” returned a 401 error for both an app’s page and its data to an outsider, and unpublishing removed an app within seconds.","The researchers noted that employees can use AI app builders such as Grok, Lovable, Replit, v0, Bolt, Base44, and Google AI Studio without company setup or an organization account."],"referencedReports":[{"title":"GhostShares: Grok Build Apps","url":"https://blog.claroc.io/ghostshares-grok-build-apps/","publisher":"claroc","context":"Claroc's report is the primary source for the findings on publicly accessible Grok-built apps and exposed data.","category":"research","primary":true},{"title":"GhostShares: Muse Passive DNS","url":"https://blog.claroc.io/ghostshares-muse-passive-dns","publisher":"claroc","context":"The article cites this earlier Claroc research on Meta Muse AI agent pages being discoverable through passive DNS records.","category":"research","primary":false}],"body":"\u003cp\u003eSecurity company Claroc found that 35,578 of 37,571 Grok-built apps it identified online could be opened without sign-in. The researchers said roughly 2% of these open apps contained high- or critical-severity material, including internal business information, personal data, patient information, employee directories, live shift boards, and passwords stored in plain text. They identified data from 30 organizations beyond X and SpaceXSI, including six Fortune 500 companies, and found 24 publicly accessible apps created by X and SpaceXSI staff.\u003c/p\u003e\n\n\u003cp\u003eGrok Build assigns published apps a grok.me subdomain, and Claroc said the publishing flow in its paid account had “Anyone with the link” preselected. Although Grok suggests random-word names that are difficult to guess, passive DNS services can record and make those subdomains searchable after visitors open them. In tests on apps they created, Claroc found one app had no sign-in protection and another let an uninvited account access, edit, and delete customer data because the generated code added users before verifying they belonged to the team.\u003c/p\u003e\n\n\u003cp\u003eSpaceXSI removed the 24 staff apps after the researchers reported them, but Claroc said it did not receive a response before publication and the company did not state it would contact other affected app owners. Claroc recommended that organizations identify AI app builders used by staff, search relevant domains in passive DNS data, verify that apps containing internal data are restricted to invited users or their owner, and test whether outside accounts can access them. The researchers said setting an app to “Only you” returned a 401 error to an outsider for both its page and data, while unpublishing took an app offline within seconds.\u003c/p\u003e\n"},{"n":1,"title":"Poland shuts down government services platform ePUAP following cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/poland-shuts-down-government-services-platform-cyberattack","time":"13:18","priority":"SHOULD READ","score":78,"tldr":"Poland temporarily took its ePUAP government services platform offline after detecting and stopping a cyberattack, though officials say no compromise or data theft has been confirmed. The outage also affects ePUAP mailboxes and may disrupt the Trusted Profile digital identity service until security checks are complete.","briefOverview":"\u003cp\u003ePoland temporarily shut down its ePUAP government services platform after detecting and stopping a cyberattack. The system allows citizens and businesses to submit official documents, communicate with government agencies, and complete administrative procedures online. Digital Affairs Minister Krzysztof Gawkowski said security teams responded immediately and were working to restore full functionality.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the platform was disabled as a precaution rather than because the attack had compromised or disrupted it. Poland’s Central Information Technology Center, which maintains ePUAP and other key digital services, was reported to remain secure, and authorities have not confirmed unauthorized access or data theft. ePUAP electronic mailboxes remain unavailable, the Trusted Profile digital identity system may be affected, and no restoration timeline has been provided.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Poland temporarily shut down the ePUAP government services platform after detecting and stopping a cyberattack.","ePUAP enables citizens and businesses to submit official documents, communicate with government agencies, and complete administrative procedures online.","Officials said ePUAP was taken offline as a precaution and have not confirmed that government systems were accessed or that sensitive information was stolen.","ePUAP electronic mailboxes remain unavailable, and the disruption may temporarily affect the Trusted Profile digital identity system.","The Ministry of Digital Affairs said services will resume after security specialists complete their work, but did not provide a restoration timeline."],"insights":["The shutdown was described as a precautionary containment measure rather than evidence that the ePUAP platform had been damaged or taken over.","Poland’s Central Information Technology Center, which maintains ePUAP and other key digital services, was reported to remain secure despite the incident.","The disruption reaches beyond one website because ePUAP mailboxes are unavailable and Trusted Profile may also be affected, potentially limiting access to public services and online document signing.","Officials have not disclosed the attack method, responsible party, whether any systems were accessed, or a timeline for restoring the platform."],"referencedReports":[],"body":"\u003cp\u003ePoland temporarily shut down its ePUAP government services platform after detecting and stopping a cyberattack. The system allows citizens and businesses to submit official documents, communicate with government agencies, and complete administrative procedures online. Digital Affairs Minister Krzysztof Gawkowski said security teams responded immediately and were working to restore full functionality.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the platform was disabled as a precaution rather than because the attack had compromised or disrupted it. Poland’s Central Information Technology Center, which maintains ePUAP and other key digital services, was reported to remain secure, and authorities have not confirmed unauthorized access or data theft. ePUAP electronic mailboxes remain unavailable, the Trusted Profile digital identity system may be affected, and no restoration timeline has been provided.\u003c/p\u003e\n"},{"n":2,"title":"Britain, France set out first guidelines for commercial hacking firms","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/britain-france-set-out-guidelines-for-commercial-hacking-firms","time":"13:11","priority":"SHOULD READ","score":78,"tldr":"Britain, France, and 12 other governments endorsed voluntary guidelines for commercial spyware and hacking firms, calling for customer vetting, safeguards against misuse, and suspension of sales where abuse is likely. The non-binding rules create no penalties and rely on government buyers and export controls for enforcement.","briefOverview":"\u003cp\u003eFourteen governments participating in the Britain- and France-led Pall Mall Process adopted voluntary guidelines for companies that develop, sell, or finance commercial cyber intrusion capabilities. The guidelines are described by France as the first global standard for responsible conduct in this industry. They were endorsed at the initiative’s third conference, which was attended by representatives from 43 countries.\u003c/p\u003e\n\n\u003cp\u003eThe rules call for customer vetting, technical protections against misuse, and systems to monitor and report abuse. Companies should stop sales and support when serious misuse is a credible risk and are asked to consider remedies for victims of human-rights abuses. The guidelines create no legal obligations or penalties, leaving enforcement pressure largely to governments that purchase the tools or license their export.\u003c/p\u003e\n\n\u003cp\u003eCommercial intrusion tools can silently penetrate phones and have been used for intelligence operations and efforts against organized crime. They have also been implicated in surveillance campaigns targeting journalists, political officials, activists, and businesses. The Pall Mall Process has faced concerns about whether it can meaningfully change how these tools are sold and used, while participants say emerging artificial intelligence, automation, and new business models raise further issues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Fourteen governments in the Britain- and France-led Pall Mall Process adopted voluntary guidelines for businesses that develop, sell, or finance commercial cyber intrusion capabilities.","The guidelines call on companies to vet customers, implement safeguards against misuse, monitor and report abuses, and halt sales and support when serious misuse presents a credible risk.","The guidelines are non-binding, impose no penalties for non-compliance, and are expected to rely on governments that buy the tools and license their export for enforcement pressure.","The tools covered can silently penetrate phones and have been used for intelligence and organized-crime investigations but have also been implicated in surveillance of journalists, political officials, activists, and businesses.","The guidelines were endorsed at the Pall Mall Process’s third conference, attended by representatives from 43 countries, with signatories including the United Kingdom, France, the United States, Germany, Italy, and Japan."],"insights":["The guidelines target not only companies that build or sell commercial hacking tools, but also financiers of those businesses, extending responsibility across the supply chain.","Although representatives from 43 countries attended the conference, only 14 governments endorsed the new guidelines, and the article does not explain why the other 15 countries did not sign.","The guidelines are endorsed by governments rather than industry organizations, despite being directed at company behavior.","The Pall Mall Process previously produced a government code of practice signed by 27 countries, but participants had raised concerns that the initiative lacked practical means to change how commercial hacking tools are traded and used.","The guidelines explicitly preserve uses that states consider legitimate for national security, defense, organized-crime investigations, and cybersecurity."],"referencedReports":[],"body":"\u003cp\u003eFourteen governments participating in the Britain- and France-led Pall Mall Process adopted voluntary guidelines for companies that develop, sell, or finance commercial cyber intrusion capabilities. The guidelines are described by France as the first global standard for responsible conduct in this industry. They were endorsed at the initiative’s third conference, which was attended by representatives from 43 countries.\u003c/p\u003e\n\n\u003cp\u003eThe rules call for customer vetting, technical protections against misuse, and systems to monitor and report abuse. Companies should stop sales and support when serious misuse is a credible risk and are asked to consider remedies for victims of human-rights abuses. The guidelines create no legal obligations or penalties, leaving enforcement pressure largely to governments that purchase the tools or license their export.\u003c/p\u003e\n\n\u003cp\u003eCommercial intrusion tools can silently penetrate phones and have been used for intelligence operations and efforts against organized crime. They have also been implicated in surveillance campaigns targeting journalists, political officials, activists, and businesses. The Pall Mall Process has faced concerns about whether it can meaningfully change how these tools are sold and used, while participants say emerging artificial intelligence, automation, and new business models raise further issues.\u003c/p\u003e\n"},{"n":7,"title":"We Built An Agent That Broke All of Our Security Rules. Here's What We Learned.","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/we-built-agent-that-broke-all-of-our.html","time":"12:01","priority":"MAY READ","score":55,"tldr":"Browser-based AI agents often operate inside a user’s authenticated session, making their actions indistinguishable from the user’s and potentially giving them excessive, untraceable access. Until standards support agent identity, verifiable human delegation, and task-scoped permissions, organizations should discover, constrain, audit, and require step-up approval for sensitive agent-driven actions.","briefOverview":"\u003cp\u003eToken built a browser-based agent called Rehearsal to answer questions inside its platform by opening pages, setting filters, and filling forms. The company found that the agent breaks three core security expectations by default: separate identity, limited access, and traceability distinct from the human user. Because the agent operates in a user’s authenticated browser session, the application server sees the user’s session and cannot inherently distinguish the agent’s clicks from the user’s.\u003c/p\u003e\n\n\u003cp\u003eBecause Token controls both Rehearsal and its own platform, it can lock and dim the application while the agent is active, record every move including blocked actions, and restrict the agent to read-only dashboard access. The article says emerging measures such as browser controls, WebMCP, and Web Bot Auth each provide part of the needed context, but do not yet combine agent identity, proof of the person it represents, and a narrower task-specific permission scope. It recommends that security teams identify browser and endpoint agents using authenticated sessions, map them to users and owners, review their access, and require explicit approval or stronger authentication before sensitive or irreversible actions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Token’s Rehearsal browser agent operates within a user’s authenticated session, so the application server cannot inherently distinguish its actions from those of the user.","Because Token controls both Rehearsal and its platform, it can lock the interface while the agent acts, record all agent moves, and limit the agent to read-only dashboard access unless the user approves a change.","The article says Chrome and Microsoft provide some controls for agentic browsing, while WebMCP can expose website actions to agents and Web Bot Auth can verify which agent made a request.","The article argues that current approaches do not combine agent identity, proof of the person an agent represents, and a permission scope narrower than that person’s access.","It recommends that security teams inventory agents that use authenticated sessions, trace their users and access, identify agent-based paths around access controls, and require explicit approval or stronger sign-in checks for sensitive actions."],"insights":["A browser agent’s use of a person’s existing session means that a session cookie does not reveal whether the person or the agent is operating the application.","Token limited Rehearsal’s risk by making dashboard access read-only, refusing to fill secret fields, and requiring user approval before saving changes.","The article identifies a gap between emerging controls: browsers may know an agent is driving, WebMCP can label actions as read-only or consequential, and Web Bot Auth can identify an agent, but these mechanisms do not yet combine delegation and narrower permissions.","Organizations can add a passkey prompt or similar stronger confirmation for sensitive or irreversible actions even when they cannot determine whether a person or an agent performed a click."],"referencedReports":[],"body":"\u003cp\u003eToken built a browser-based agent called Rehearsal to answer questions inside its platform by opening pages, setting filters, and filling forms. The company found that the agent breaks three core security expectations by default: separate identity, limited access, and traceability distinct from the human user. Because the agent operates in a user’s authenticated browser session, the application server sees the user’s session and cannot inherently distinguish the agent’s clicks from the user’s.\u003c/p\u003e\n\n\u003cp\u003eBecause Token controls both Rehearsal and its own platform, it can lock and dim the application while the agent is active, record every move including blocked actions, and restrict the agent to read-only dashboard access. The article says emerging measures such as browser controls, WebMCP, and Web Bot Auth each provide part of the needed context, but do not yet combine agent identity, proof of the person it represents, and a narrower task-specific permission scope. It recommends that security teams identify browser and endpoint agents using authenticated sessions, map them to users and owners, review their access, and require explicit approval or stronger authentication before sensitive or irreversible actions.\u003c/p\u003e\n"},{"n":3,"title":"Field Intelligence #5: Scareware at scale. Investment scams built on AI platforms.","source":"blog.confiant.com","sourceColorIdx":8,"link":"https://blog.confiant.com/p/field-intelligence-5-scareware-at","time":"13:44","priority":"MAY READ","score":40,"tldr":"Confiant reports that ad-tech abuse is enabling mobile scareware, crypto-stealing Android malware, and cloaked investment and tech-support scams at scale. The campaigns use trusted cloud and AI app-builder platforms to evade reputation controls and redirect victims toward fraudulent payments or wallet-draining contracts.","briefOverview":"\u003cp\u003eConfiant’s Field Intelligence briefing describes several ad-delivered and cloaked scam operations, including the newly named ZoidWays mobile scareware redirector. ZoidWays showed fake phone-security warnings and sent victims toward antivirus affiliate checkouts, paid support lines, or subscription traps. The campaign appeared across at least six buying platforms and reached roughly 1.5 million blocked impressions on September 12. The article states that its redirects do not escape properly sandboxed cross-origin frames, succeeding instead where frames are unsandboxed, same-origin, or lack client-side coverage.\u003c/p\u003e\n\n\u003cp\u003eThe briefing also covers a fake Microsoft Teams APK that functions as a cryptocurrency-stealing remote-access trojan, including searches for wallet recovery phrases in clipboard data, device files, accessibility data, and photographs. PseudoCamo uses AI app-builder platforms such as lovable[.]app and base44[.]app for localized age-gate decoys that redirect visitors to investment-scam pages, while D-Shortiez has moved tech-support scam pages to BunnyCDN and Microsoft Azure Cloud hosts and added fake CAPTCHA pages. A separate Claude-branded scam persuades UK-targeted victims to deploy and fund a supposed MetaMask trading-bot contract, with a final transaction transferring the entire balance to the scammer. The article provides public indicators for the campaigns and asks organizations to flag them in their advertising demand paths.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ZoidWays is a mobile forced-redirect scareware campaign that peaked at roughly 1.5 million blocked impressions in one day and appeared across at least six buying platforms.","A fake Microsoft Teams APK delivered through teamsapk[.]cyou is a remote-access trojan that searches for cryptocurrency seed phrases in clipboard data, accessibility-service data, files, and photos using OCR.","PseudoCamo uses AI app-builder platforms including lovable[.]app and base44[.]app to host localized age-gate decoys that redirect visitors to investment-scam pages.","D-Shortiez shifted some tech-support scam pages from Azure Blob static websites to BunnyCDN and Microsoft Azure Cloud hosts, adding a fake CAPTCHA before the scam landing page.","A UK-targeted Claude-branded scam convinces victims to deploy and fund a purported MetaMask trading-bot contract, whose Start transaction forwards the full balance to the scammer."],"insights":["ZoidWays does not appear to defeat a properly sandboxed, cross-origin browser frame; according to the article, successful redirects occur when the frame is unsandboxed, same-origin, or lacks client-side coverage.","Hosting scam decoy pages on legitimate AI app-builder platforms can obscure them from domain-reputation systems because those systems may assess the shared platform domain as trustworthy rather than each individual hosted page.","A fake CAPTCHA in these campaigns is not necessarily a sign of malware delivery: the D-Shortiez examples use it as an intermediate step before a tech-support scam.","The Claude-branded wallet scam relies on victims approving three transactions themselves, with the final “Start” action transferring the wallet’s entire funded balance to the scammer.","The fake Teams app’s ability to search photographs with text recognition means a screenshot of a cryptocurrency recovery phrase can expose a victim’s wallet."],"referencedReports":[{"title":"Discover-Tech Technical Analysis","url":"https://www.confiant.com/e3t/Ctc/OP+113/cK3zv04/VVFqV346NgVPW818ZGc12fY7FW7zr5cm5WXCcWN6fpSV85nR3bW50kH_H6lZ3p7W7m7pQQ9g_L7fW7p8Ncd2SK41MW27HZ4G1MM3NTW6qDWFv2H7xk_W4Yk9ZZ7J4vP1W2th87C7bxzhRW838sxl2_W5kgW46PHkM2b9KDsW5wZnZ52PjY2rVSfG482gQmk3W3s_Z791tJBLQW3YxSgr5X2F8FW6nnkSK4N6RkZW3KJ--n7DKVk0W3P24l78MRn7xV6RBdz8N3DJ2W1v1Rvg6Bj-ZnW7Hr0P33Xwk3TN4rbLkVQFLYbVWXRz84ghnq7W6wccKX6S8d1lW1sHm-19jQSlMW5Wlkxs32Ny7QW984PTp7rn9xGW5hfFSS7Qzmp4W4HM7Wb3xcJD-W2zLkCV7P2LGXW1WnXjX3_dNPFN4dNK_nZbvvZW6932dd97sB-bW64z0hH1nTGVYW5Hh3TZ2xlns6f77JZY004","publisher":"confiant","context":"The article links to Confiant's technical analysis of Discover-Tech's ad infrastructure, describing zero-click spyware delivery and large-scale identity collection.","category":"research","primary":false}],"body":"\u003cp\u003eConfiant’s Field Intelligence briefing describes several ad-delivered and cloaked scam operations, including the newly named ZoidWays mobile scareware redirector. ZoidWays showed fake phone-security warnings and sent victims toward antivirus affiliate checkouts, paid support lines, or subscription traps. The campaign appeared across at least six buying platforms and reached roughly 1.5 million blocked impressions on September 12. The article states that its redirects do not escape properly sandboxed cross-origin frames, succeeding instead where frames are unsandboxed, same-origin, or lack client-side coverage.\u003c/p\u003e\n\n\u003cp\u003eThe briefing also covers a fake Microsoft Teams APK that functions as a cryptocurrency-stealing remote-access trojan, including searches for wallet recovery phrases in clipboard data, device files, accessibility data, and photographs. PseudoCamo uses AI app-builder platforms such as lovable[.]app and base44[.]app for localized age-gate decoys that redirect visitors to investment-scam pages, while D-Shortiez has moved tech-support scam pages to BunnyCDN and Microsoft Azure Cloud hosts and added fake CAPTCHA pages. A separate Claude-branded scam persuades UK-targeted victims to deploy and fund a supposed MetaMask trading-bot contract, with a final transaction transferring the entire balance to the scammer. The article provides public indicators for the campaigns and asks organizations to flag them in their advertising demand paths.\u003c/p\u003e\n"}]</script>
