<script type="application/json" id="dl-articles">[{"n":1,"title":"Amgen says cloud data breach exposed patient health, proprietary info","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/amgen-says-cloud-data-breach-exposed-patient-health-proprietary-info/","time":"22:16","priority":"SHOULD READ","score":84,"tldr":"Amgen says attackers stole proprietary corporate data and patient protected health information from cloud environments run by third-party providers. The company is still investigating what was accessed and who was affected, but says it does not currently expect a material financial impact.","briefOverview":"\u003cp\u003eAmgen says it suffered a data breach after threat actors stole corporate data and patient information stored in multiple cloud systems operated by third-party service providers. The California-based biotechnology company develops and manufactures medicines for serious illnesses, including cancer, cardiovascular disease, inflammation, and rare diseases. Amgen detected the unauthorized activity in July 2026 and responded by activating its cybersecurity response plan, implementing containment measures, and hiring independent forensic experts.\u003c/p\u003e\n\n\u003cp\u003eThe company said the attackers exfiltrated proprietary data, patient protected health information, and other information from the cloud environments. Amgen is still determining whether additional information was accessed or stolen, including confidential business information, intellectual property, research and development data, and other patient information. It has not disclosed which third-party cloud providers were involved, how the environments were compromised, how many people may have been affected, or whether a known threat actor was involved.\u003c/p\u003e\n\n\u003cp\u003eAmgen determined on July 29 that the incident was material after evaluating the volume of potentially impacted files and the possibility that they contained sensitive information. The company currently does not believe the incident is reasonably likely to materially affect its financial condition or operating results. Amgen said it is continuing to investigate with third-party cybersecurity experts, evaluating legal and regulatory notification requirements, and will notify impacted patients where required.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Amgen said threat actors stole corporate data and patient information stored in multiple cloud systems operated by third-party service providers.","The company detected unauthorized activity in July 2026 and activated its cybersecurity response plan, implemented containment measures, and hired independent forensic experts.","Amgen said the stolen data included proprietary data, patient protected health information, and other information from the cloud environments.","The company is still determining whether additional information was accessed or stolen, including confidential business information, intellectual property, research and development data, and other patient information.","Amgen determined on July 29 that the incident was material but said it does not currently believe it is reasonably likely to materially affect its financial condition or operating results."],"insights":["Amgen deemed the incident material based on the volume of potentially impacted files and their possible sensitivity even though the investigation had not yet determined the full scope of accessed or stolen data.","The confirmed theft came from multiple third-party cloud environments, showing the incident was not limited to a single cloud system or solely to Amgen-operated infrastructure.","Amgen has confirmed patient protected health information was exfiltrated, but it is still evaluating notification requirements and has not yet disclosed how many patients may be affected.","The unresolved scope includes possible intellectual property and research and development data, so the incident may involve both patient privacy concerns and exposure of sensitive business information."],"referencedReports":[],"body":"\u003cp\u003eAmgen says it suffered a data breach after threat actors stole corporate data and patient information stored in multiple cloud systems operated by third-party service providers. The California-based biotechnology company develops and manufactures medicines for serious illnesses, including cancer, cardiovascular disease, inflammation, and rare diseases. Amgen detected the unauthorized activity in July 2026 and responded by activating its cybersecurity response plan, implementing containment measures, and hiring independent forensic experts.\u003c/p\u003e\n\n\u003cp\u003eThe company said the attackers exfiltrated proprietary data, patient protected health information, and other information from the cloud environments. Amgen is still determining whether additional information was accessed or stolen, including confidential business information, intellectual property, research and development data, and other patient information. It has not disclosed which third-party cloud providers were involved, how the environments were compromised, how many people may have been affected, or whether a known threat actor was involved.\u003c/p\u003e\n\n\u003cp\u003eAmgen determined on July 29 that the incident was material after evaluating the volume of potentially impacted files and the possibility that they contained sensitive information. The company currently does not believe the incident is reasonably likely to materially affect its financial condition or operating results. Amgen said it is continuing to investigate with third-party cybersecurity experts, evaluating legal and regulatory notification requirements, and will notify impacted patients where required.\u003c/p\u003e\n"},{"n":2,"title":"Elastic goes all-in on Hacker Summer Camp at Black Hat and DEF CON in Las Vegas","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/elastic-security-black-hat-defcon-2026","time":"23:59","priority":"MAY READ","score":45,"tldr":"Elastic is using Black Hat and DEF CON 2026 to promote new Elastic Security capabilities aimed at reducing SOC alert overload, including agent-assisted Attack Discovery, stronger endpoint protection, and plain-language automation with human approvals. The core message is that Elastic wants to move teams toward “Alert Zero” by combining machine-speed triage with analyst oversight rather than replacing humans.","briefOverview":"\u003cp\u003eElastic is presenting its latest security capabilities at Black Hat and DEF CON in Las Vegas, including events at Black Hat and a Capture the Flag challenge at DEF CON’s Blue Team Village. The company frames these updates around its goal of “Alert Zero,” where agents and analysts work together to reduce raw alert queues into validated threats. Elastic says this approach is meant to help security operations teams avoid being overwhelmed by alerts while keeping human judgment in the process.\u003c/p\u003e\n\n\u003cp\u003eAttack Discovery now investigates alerts by threat-hunting raw events, checking entity risk for users and hosts, corroborating findings across data sources, and classifying events as validated attacks. When it finds activity that existing rules missed, it can draft a detection rule for an analyst to approve. Elastic says the tool shows its reasoning at each step so analysts can understand why an alert became an attack and what action is recommended.\u003c/p\u003e\n\n\u003cp\u003eElastic also announced endpoint and automation updates, including vulnerable driver coverage in Elastic Defend and full endpoint protection for Windows on ARM. Elastic Defend automatically generates and deploys YARA rules as newly disclosed vulnerable drivers appear in sources such as VirusTotal, loldrivers.io, and Microsoft’s blocklist. Elastic Workflows now supports plain-language automation authoring, versioning, visual workflow views, and human-in-the-loop approvals routed to tools such as Slack.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic will showcase its latest security innovations at Black Hat and DEF CON in Las Vegas, including events at Black Hat and a Capture the Flag challenge at DEF CON’s Blue Team Village.","Elastic describes its “Alert Zero” goal as reducing alert queues to validated threats through agents and analysts working together, rather than eliminating alerts or replacing analysts.","Attack Discovery investigates alerts by threat-hunting raw events, checking entity risk for involved users and hosts, corroborating findings across data sources, and classifying events as validated attacks.","Elastic Defend now automatically generates and deploys YARA rules for newly disclosed vulnerable drivers and provides full endpoint protection for Windows on ARM.","Elastic Workflows now supports plain-language automation authoring, version control, visual workflow views, and human-in-the-loop approvals routed to tools such as Slack."],"insights":["Elastic frames analyst burnout as a product-design problem, arguing that tools creating too much work are a central reason security teams struggle.","Attack Discovery’s auto-drafted detection rules are positioned as a feedback loop: when an investigation finds something existing rules missed, the platform can propose a rule to close that same gap after analyst approval.","Elastic is emphasizing transparency in its agentic SOC approach by saying analysts can see the reasoning behind each attack classification and recommended action instead of trusting a black box.","Elastic’s vulnerable-driver protection is designed to update outside normal release cycles by monitoring public disclosure sources and instantly deploying generated YARA rules as new drivers are disclosed.","Elastic’s automation strategy keeps human approvals inside everyday collaboration tools such as Slack, suggesting the platform is intended to automate routine work without removing analyst control over judgment-heavy decisions."],"referencedReports":[],"body":"\u003cp\u003eElastic is presenting its latest security capabilities at Black Hat and DEF CON in Las Vegas, including events at Black Hat and a Capture the Flag challenge at DEF CON’s Blue Team Village. The company frames these updates around its goal of “Alert Zero,” where agents and analysts work together to reduce raw alert queues into validated threats. Elastic says this approach is meant to help security operations teams avoid being overwhelmed by alerts while keeping human judgment in the process.\u003c/p\u003e\n\n\u003cp\u003eAttack Discovery now investigates alerts by threat-hunting raw events, checking entity risk for users and hosts, corroborating findings across data sources, and classifying events as validated attacks. When it finds activity that existing rules missed, it can draft a detection rule for an analyst to approve. Elastic says the tool shows its reasoning at each step so analysts can understand why an alert became an attack and what action is recommended.\u003c/p\u003e\n\n\u003cp\u003eElastic also announced endpoint and automation updates, including vulnerable driver coverage in Elastic Defend and full endpoint protection for Windows on ARM. Elastic Defend automatically generates and deploys YARA rules as newly disclosed vulnerable drivers appear in sources such as VirusTotal, loldrivers.io, and Microsoft’s blocklist. Elastic Workflows now supports plain-language automation authoring, versioning, visual workflow views, and human-in-the-loop approvals routed to tools such as Slack.\u003c/p\u003e\n"}]</script>
