<script type="application/json" id="dl-articles">[{"n":1,"title":"Warning: Two Unpatched Citrix NetScaler RCE Zero-Days Under Active Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/warning-two-unpatched-citrix-netscaler.html","time":"07:47","priority":"MUST READ","score":96,"tldr":"Security firm watchTowr reports that two unpatched Citrix NetScaler ADC and Gateway remote-code-execution zero-days are being actively exploited, while Citrix has not yet confirmed the flaws or released fixes. Organizations using exposed NetScaler appliances should consider isolation and incident-response measures because patching, once available, may not remove pre-existing attacker access.","briefOverview":"\u003cp\u003eSecurity firm watchTowr said on September 26 that two unpatched remote-code-execution vulnerabilities in Citrix NetScaler ADC and NetScaler Gateway appliances are being actively exploited. Citrix had not confirmed the flaws or issued fixes as of Sunday morning, although watchTowr said vendor communications and patches were expected early in the week of September 28. The reported issues are separate from CVE-2026-19490, an authentication-bypass flaw Citrix fixed on August 19.\u003c/p\u003e\n\n\u003cp\u003eNetScaler appliances sit at enterprise network edges and handle remote access, traffic distribution, and user authentication, so organizations operating them must decide whether to keep them online, isolate them, or power them off while no vendor workaround or compromise indicators are available. Because exploitation reportedly began before a fix existed, applying a future patch would not establish whether attackers had already accessed an appliance. Citrix’s existing suspected-compromise guidance recommends preserving evidence before isolation, resetting stored and affected user credentials, revoking certificates and private keys, and ensuring the management interface is not exposed to the public internet.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security firm watchTowr said on September 26 that two unpatched remote-code-execution flaws in Citrix NetScaler ADC and NetScaler Gateway appliances are being actively exploited.","Citrix had not confirmed the reported flaws or released fixes as of Sunday morning, and watchTowr said Citrix communications and patches were expected early in the week of September 28.","The reported flaws are distinct from CVE-2026-19490, an authentication-bypass issue that Citrix fixed on August 19.","Because the reported exploitation occurred before any fix was available, installing a future fix would not show whether an attacker had already gained access.","Citrix’s guidance for suspected NetScaler compromise recommends preserving evidence, isolating the appliance, changing stored credentials and affected user passwords, revoking certificates and private keys, and keeping the management interface off the public internet."],"insights":["Organizations cannot rely on a future patch alone to establish whether they were affected, because watchTowr said the reported exploitation began before any fix existed.","No vendor workaround or indicators of compromise had been published, leaving operators to make containment decisions without confirmed technical guidance for the newly reported flaws.","NetScaler 13.1 reached End of Maintenance on September 15, and Citrix had not said whether that version would receive a fix for the reported issues.","The Netherlands National Cyber Security Center's 2025 NetScaler checking scripts may help investigate systems, but their documentation says they only look for possible signs of compromise and do not guarantee detection.","Citrix recommends preserving snapshots, logs, support bundles, and packet-engine core dumps before isolating an appliance suspected of compromise."],"referencedReports":[{"title":"You're Back in the Room: Citrix NetScaler Pre-Auth RCE (CVE-2026-8452)","url":"https://labs.watchtowr.com/youre-back-in-the-room-citrix-netscaler-pre-auth-rce-cve-2026-8452/","publisher":"watchtowr","context":"The article references this August technical analysis as watchTowr's demonstration that a Citrix-patched NetScaler heap overflow could be used for remote code execution.","category":"research","primary":false},{"title":"Steps to Take if NetScaler ADC Is Suspected to Be Compromised","url":"https://support.citrix.com/external/article/CTX694799/steps-to-take-if-netscaler-adc-is-suspected-to-be-compromised.html","publisher":"citrix","context":"The article cites Citrix's guidance on evidence preservation, isolation, credential resets, certificate revocation, and management-interface exposure following a suspected compromise.","category":"advisory","primary":false},{"title":"Citrix 2025 Live Host Bash Check README","url":"https://github.com/NCSC-NL/citrix-2025/blob/main/live-host-bash-check/README.md","publisher":"netherlands-national-cyber-security-center","context":"The article references the Dutch agency's check-script documentation, which states that the live-appliance script searches for possible compromise artifacts but does not guarantee detection.","category":"guide","primary":false}],"body":"\u003cp\u003eSecurity firm watchTowr said on September 26 that two unpatched remote-code-execution vulnerabilities in Citrix NetScaler ADC and NetScaler Gateway appliances are being actively exploited. Citrix had not confirmed the flaws or issued fixes as of Sunday morning, although watchTowr said vendor communications and patches were expected early in the week of September 28. The reported issues are separate from CVE-2026-19490, an authentication-bypass flaw Citrix fixed on August 19.\u003c/p\u003e\n\n\u003cp\u003eNetScaler appliances sit at enterprise network edges and handle remote access, traffic distribution, and user authentication, so organizations operating them must decide whether to keep them online, isolate them, or power them off while no vendor workaround or compromise indicators are available. Because exploitation reportedly began before a fix existed, applying a future patch would not establish whether attackers had already accessed an appliance. Citrix’s existing suspected-compromise guidance recommends preserving evidence before isolation, resetting stored and affected user credentials, revoking certificates and private keys, and ensuring the management interface is not exposed to the public internet.\u003c/p\u003e\n"},{"n":2,"title":"Frequently asked questions about reported Citrix NetScaler zero-day vulnerabilities","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/frequently-asked-questions-about-reported-citrix-netscaler-zero-day-vulnerabilities","time":"09:35","priority":"MUST READ","score":95,"tldr":"Reports indicate two unpatched Citrix NetScaler zero-days enabling remote code execution are being actively exploited, but Citrix had not yet issued CVEs, an advisory, patches, or public indicators of compromise as of September 27, 2026.","briefOverview":"\u003cp\u003eReports surfaced on September 25–26, 2026, that two unpatched Citrix NetScaler zero-day vulnerabilities capable of remote code execution were being actively exploited. The reports were tied to an alleged NCSC-NL pre-notification and subsequent confirmations from watchTowr and Kevin Beaumont, although Tenable had not independently reviewed the pre-notification. As of September 27, Citrix had not published a formal security advisory, assigned CVE identifiers, or provided patches.\u003c/p\u003e\n\n\u003cp\u003eThe reported issues were not believed to be related to CVE-2026-19490 or CVE-2026-19489, previously disclosed NetScaler vulnerabilities for which patches were available. No public proof-of-concept, indicators of compromise, or threat-actor details were available, and reporting had not determined whether the attacks were widespread. Citrix NetScaler has been a frequent target historically: CISA\u0026rsquo;s KEV catalog contained 13 NetScaler-related entries as of September 27, 2026, and Tenable stated that patches were expected early in the week of September 28.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Public reports indicated that two unpatched Citrix NetScaler zero-day flaws capable of remote code execution were being actively exploited in the wild.","As of September 27, 2026, Citrix had not published a formal security advisory, assigned CVE identifiers, or released patches for the reported flaws.","The reported zero-days were not believed to be related to CVE-2026-19490 or CVE-2026-19489, which were previously disclosed Citrix NetScaler vulnerabilities with patches available.","No public proof-of-concept code, indicators of compromise, or details identifying the responsible threat actors were available as of September 27, 2026.","Citrix NetScaler devices have been frequent targets historically, with 13 NetScaler-related entries in CISA's Known Exploited Vulnerabilities catalog as of September 27, 2026."],"insights":["The initial reporting stemmed from an alleged NCSC-NL pre-notification distributed under TLP:AMBER+STRICT restrictions, and Tenable stated that it had not independently reviewed that notification.","Public reporting had not established whether the active exploitation was widespread, despite confirmation that attacks were occurring.","Tenable's historical research found that roughly two-thirds of threat activity targeting Citrix NetScaler over the prior seven years involved advanced persistent threat groups, while about one-third involved ransomware groups and affiliates.","Tenable expected to classify the issues under its Vulnerability Watch program and release product detection coverage only after CVE identifiers were assigned and patches became available."],"referencedReports":[],"body":"\u003cp\u003eReports surfaced on September 25–26, 2026, that two unpatched Citrix NetScaler zero-day vulnerabilities capable of remote code execution were being actively exploited. The reports were tied to an alleged NCSC-NL pre-notification and subsequent confirmations from watchTowr and Kevin Beaumont, although Tenable had not independently reviewed the pre-notification. As of September 27, Citrix had not published a formal security advisory, assigned CVE identifiers, or provided patches.\u003c/p\u003e\n\n\u003cp\u003eThe reported issues were not believed to be related to CVE-2026-19490 or CVE-2026-19489, previously disclosed NetScaler vulnerabilities for which patches were available. No public proof-of-concept, indicators of compromise, or threat-actor details were available, and reporting had not determined whether the attacks were widespread. Citrix NetScaler has been a frequent target historically: CISA\u0026rsquo;s KEV catalog contained 13 NetScaler-related entries as of September 27, 2026, and Tenable stated that patches were expected early in the week of September 28.\u003c/p\u003e\n"}]</script>
