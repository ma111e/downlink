<script type="application/json" id="dl-articles">[{"n":2,"title":"EU sanctions Russian GRU military hackers over cyberattacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/eu-and-uk-hit-russia-with-first-joint-cyber-sanctions-package/","time":"11:19","priority":"SHOULD READ","score":84,"tldr":"The EU and UK sanctioned Russian GRU officers, FSB-linked hackers, cybercriminals, and related entities accused of coordinating cyberattacks, espionage, influence operations, and critical infrastructure targeting across Europe. Officials specifically linked Russian groups including Turla and Sandworm to campaigns against government, defense, energy, and nuclear research targets, including failed attacks in Poland.","briefOverview":"\u003cp\u003eThe European Union and the United Kingdom jointly sanctioned Russian individuals and entities accused of supporting a network of hacking groups responsible for attacks across Europe. The EU sanctioned nine individuals and four entities, including Russian GRU officers and cybercriminals, while the UK sanctioned 24 individuals and entities. UK officials named senior GRU figures Vyacheslav Stafeyev, Ivan Senin, and Ivan Kasyanenko as directing cyber and hybrid operations.\u003c/p\u003e\n\n\u003cp\u003eThe Council of the EU also publicly identified the 16th Centre of Russia\u0026rsquo;s Federal Security Service as controlling several cyber threat groups, including Turla. Officials said the unit has targeted government networks and critical infrastructure in several European countries and has run cyberespionage campaigns against government and defense targets since 2010. The sanctions also covered members of IMPULS, individuals tied to the Lumma Stealer malware operation, and people connected to Rybar LLC.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights failed Russian-linked attacks against Polish critical infrastructure, including energy grid organizations such as heat and power plants. A late-December cyberattack damaged key operational technology equipment beyond repair but did not disrupt power, and it was later attributed to Sandworm, which attempted to deploy DynoWiper data-wiping malware and disable compromised devices. Poland also recently blocked a cyberattack targeting the IT infrastructure of the National Centre for Nuclear Research.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Union sanctioned nine individuals and four entities, including Russian GRU officers and cybercriminals, over malicious cyber activity targeting the EU, its member states, and international partners.","The United Kingdom separately sanctioned 24 individuals and entities, including senior GRU figures Vyacheslav Stafeyev, Ivan Senin, and Ivan Kasyanenko, whom officials said directed cyber and hybrid operations.","The Council of the EU publicly identified the 16th Centre of Russia's Federal Security Service as controlling several cyber threat groups, including Turla.","Officials said the FSB-linked unit has targeted government networks and critical infrastructure in multiple European countries and conducted cyberespionage against government and defense targets since 2010.","The article says Russian-linked hackers were connected to failed attacks on Polish critical infrastructure, including a late-December incident affecting dozens of power grid entities and another blocked attack against Poland's National Centre for Nuclear Research."],"insights":["The sanctions describe Russia’s cyber activity as an ecosystem that includes military intelligence officers, security service-linked groups, private companies, criminals, self-described hacktivists, and media operators rather than only formal state agencies.","The UK linked the Lumma Stealer operation to at least 2,100 domestic victims over six months, showing that commodity-style credential theft was treated as part of the same broader Russian-linked activity targeted by sanctions.","The EU publicly tied the FSB’s 16th Centre to Turla, adding an attribution claim that connects a long-running espionage group to a specific Russian security service unit.","The Poland power-grid incident showed that attacks on operational technology can cause permanent equipment damage even when they fail to interrupt electricity delivery."],"referencedReports":[],"body":"\u003cp\u003eThe European Union and the United Kingdom jointly sanctioned Russian individuals and entities accused of supporting a network of hacking groups responsible for attacks across Europe. The EU sanctioned nine individuals and four entities, including Russian GRU officers and cybercriminals, while the UK sanctioned 24 individuals and entities. UK officials named senior GRU figures Vyacheslav Stafeyev, Ivan Senin, and Ivan Kasyanenko as directing cyber and hybrid operations.\u003c/p\u003e\n\n\u003cp\u003eThe Council of the EU also publicly identified the 16th Centre of Russia\u0026rsquo;s Federal Security Service as controlling several cyber threat groups, including Turla. Officials said the unit has targeted government networks and critical infrastructure in several European countries and has run cyberespionage campaigns against government and defense targets since 2010. The sanctions also covered members of IMPULS, individuals tied to the Lumma Stealer malware operation, and people connected to Rybar LLC.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights failed Russian-linked attacks against Polish critical infrastructure, including energy grid organizations such as heat and power plants. A late-December cyberattack damaged key operational technology equipment beyond repair but did not disrupt power, and it was later attributed to Sandworm, which attempted to deploy DynoWiper data-wiping malware and disable compromised devices. Poland also recently blocked a cyberattack targeting the IT infrastructure of the National Centre for Nuclear Research.\u003c/p\u003e\n"},{"n":6,"title":"Forg365 PhaaS Targets Microsoft 365 with Device Code and AitM Session Theft","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/forg365-phaas-targets-microsoft-365.html","time":"13:03","priority":"SHOULD READ","score":84,"tldr":"Forg365 is a Telegram-sold phishing-as-a-service platform targeting Microsoft 365 with device code phishing, adversary-in-the-middle session theft, antibot evasion, and tools to maintain access and operate inside compromised mailboxes. The key defense is to restrict device code authentication and closely audit mailbox activity, mail rules, tokens, and legacy forwarding aliases.","briefOverview":"\u003cp\u003eA new phishing-as-a-service operation called Forg365 is targeting Microsoft 365 accounts using device code phishing, adversary-in-the-middle tactics, antibot evasion, AI-assisted lure creation, and post-compromise mailbox operations. The service is distributed via Telegram and costs \u003cspan class=\"math inline\"\u003e\\(400 per month or \\)\u003c/span\u003e3,800 per year. ZeroBAC said the platform includes workflows for accounts, links, invitations, OAuth app configuration, redirect links, SVG generation, campaign sending, SMTP profiles, SMTP rotation, AI email generation, token vaulting, account intelligence, keyword alerts, viewer links, and browser-extension support.\u003c/p\u003e\n\n\u003cp\u003eForg365 campaigns have used business document-themed or remittance approval lures and relied on legitimate email delivery infrastructure such as Amazon SES and Twilio SendGrid before redirecting victims to Forg365-controlled domains. Its device-auth phishing branch presents a Microsoft-styled verification code page and pushes the victim into a legitimate Microsoft Authentication Broker sign-in flow, where the code authorizes an attacker-controlled session. For adversary-in-the-middle phishing, the platform uses route tokens, session cookies, and traffic classification to decide whether to show phishing content or a benign decoy, including redirecting VPN users to innocuous content.\u003c/p\u003e\n\n\u003cp\u003eThe platform includes a Chromium browser extension called ForgCookie that is designed to maintain access to compromised accounts by generating and injecting refresh-token credential cookies and capturing Microsoft cookies across Microsoft domains. Forg365 also supports post-compromise actions such as monitoring compromised mailboxes for specific keywords and using AI to draft replies in email threads. The article recommends blocking device code authentication unless required, reviewing mailbox artifacts after device code events, auditing mail-flow rules, and decommissioning legacy aliases that no longer correspond to active employees.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Forg365 is a phishing-as-a-service operation sold via Telegram for $400 per month or $3,800 per year and targets Microsoft 365 accounts.","Forg365 attack chains use phishing lures delivered through legitimate email infrastructure such as Amazon SES and Twilio SendGrid before redirecting victims to Forg365-controlled domains.","The platform supports device code phishing that shows a Microsoft-styled verification code page and pushes victims into a legitimate Microsoft Authentication Broker sign-in flow that authorizes an attacker-controlled session.","Forg365 includes a Chromium browser extension called ForgCookie that is designed to maintain access to compromised Microsoft accounts by generating and injecting refresh-token credential cookies and capturing Microsoft cookies.","The platform supports post-compromise mailbox operations such as monitoring compromised email accounts for specific keywords and using AI assistance to draft replies in email threads."],"insights":["Blocking or restricting device code authentication is especially actionable because Forg365 and several related kits use legitimate Microsoft sign-in flows rather than only fake login pages.","Security reviews that rely on VPN-based inspection may miss Forg365 phishing pages because the kit redirects VPN users to harmless decoy content.","Legacy email aliases and forwarding relationships can create hidden exposure, as one campaign reached a current mailbox through a still-resolvable historical identity with no visible cue to the user.","Forg365 combines lure creation, delivery, token handling, mailbox monitoring, and AI-assisted replies in one subscription platform, showing that phishing services are moving beyond credential theft into full post-compromise operations.","Mailbox artifacts after device code events are important investigation points because the article recommends reviewing them for unusual activity alongside auditing mail-flow rules."],"referencedReports":[{"title":"Inside Forg365: Telegram-Distributed Sneaky2FA-Style PhaaS","url":"https://zerobec.com/blog/inside-forg365-telegram-distributed-sneaky2fa-style-phaas","publisher":"ZeroBAC","context":"The article relies on ZeroBAC's analysis of the Forg365 phishing-as-a-service platform and quotes its findings about the operator panel, device-auth phishing branch, and operational workflow.","category":"","primary":false},{"title":"Sneaky 2FA Returns: Trusted Sender, Tenant-Branded Microsoft 365 Replay","url":"https://zerobec.com/blog/sneaky-2fa-returns-trusted-sender-tenant-branded-microsoft-365-replay","publisher":"ZeroBAC","context":"The article references this analysis while describing campaigns that sent fake Microsoft account activity alerts from a compromised third-party SaaS sender account to Sneaky 2FA-style phishing pages.","category":"","primary":false},{"title":"Kali365 Device Code Phishing Kit","url":"https://www.huntress.com/blog/kali365-device-code-phishing-kit","publisher":"Huntress","context":"The article cites this analysis when describing phishing emails that routed victims through Canva-hosted pages into a Kali365 device code phishing flow targeting Microsoft accounts.","category":"","primary":false},{"title":"Token Bingo: Don't Let Your Code Be the Winner","url":"https://arcticwolf.com/resources/blog/token-bingo-dont-let-your-code-be-the-winner/","publisher":"Arctic Wolf","context":"The article references this research in connection with Kali365 campaigns and later quotes Arctic Wolf on Kali365's expansion into Russia's MAX messenger-themed phishing.","category":"","primary":false},{"title":"Kali365 Expands into AWS, Microsoft, Okta, Xerox, MAX Messenger","url":"https://arcticwolf.com/resources/blog/kali365-expands-into-aws-microsoft-okta-xerox-max-messenger/","publisher":"Arctic Wolf","context":"The article cites and quotes this Arctic Wolf analysis about Kali365 phishing pages impersonating Russia's MAX messenger.","category":"","primary":false},{"title":"The Quarry PhaaS: IRS \u0026 SSA Phishing","url":"https://socradar.io/blog/the-quarry-phaas-irs-ssa-phishing/","publisher":"SOCRadar","context":"The article references this research while describing phishing campaigns using The Quarry PhaaS kit to impersonate the IRS, Social Security Administration, and other brands.","category":"","primary":false},{"title":"Following a USPS Smishing Kit Through Censys DNS Data","url":"https://censys.com/blog/following-a-usps-smishing-kit-through-censys-dns-data/","publisher":"Censys","context":"The article cites and quotes this Censys analysis of USPS and UPS smishing pages that stream victims' card data in real time.","category":"","primary":false},{"title":"Nyasher: Google Account Takeover via Webflow and Cloudflare Workers","url":"https://zerobec.com/blog/nyasher-google-account-takeover-webflow-cloudflare-workers","publisher":"ZeroBAC","context":"The article references this analysis while describing fake bid proposal workflows that used Nyasher to take over Google accounts.","category":"","primary":false},{"title":"GPPStorm: Google Partners Phishing Workspace Credentials","url":"https://zerobec.com/blog/gppstorm-google-partners-phishing-workspace-credentials","publisher":"ZeroBAC","context":"The article cites this analysis of phishing emails using bogus Google Partners and Google Premier Partner enrollment workflows to capture Google credentials.","category":"","primary":false},{"title":"EvilTokens Device Code Phishing Legacy Aliases","url":"https://zerobec.com/blog/eviltokens-device-code-phishing-legacy-aliases","publisher":"ZeroBAC","context":"The article references and quotes this ZeroBAC analysis of a device code phishing flow that used the EvilTokens kit and reached a mailbox through a legacy alias.","category":"","primary":false}],"body":"\u003cp\u003eA new phishing-as-a-service operation called Forg365 is targeting Microsoft 365 accounts using device code phishing, adversary-in-the-middle tactics, antibot evasion, AI-assisted lure creation, and post-compromise mailbox operations. The service is distributed via Telegram and costs \u003cspan class=\"math inline\"\u003e\\(400 per month or \\)\u003c/span\u003e3,800 per year. ZeroBAC said the platform includes workflows for accounts, links, invitations, OAuth app configuration, redirect links, SVG generation, campaign sending, SMTP profiles, SMTP rotation, AI email generation, token vaulting, account intelligence, keyword alerts, viewer links, and browser-extension support.\u003c/p\u003e\n\n\u003cp\u003eForg365 campaigns have used business document-themed or remittance approval lures and relied on legitimate email delivery infrastructure such as Amazon SES and Twilio SendGrid before redirecting victims to Forg365-controlled domains. Its device-auth phishing branch presents a Microsoft-styled verification code page and pushes the victim into a legitimate Microsoft Authentication Broker sign-in flow, where the code authorizes an attacker-controlled session. For adversary-in-the-middle phishing, the platform uses route tokens, session cookies, and traffic classification to decide whether to show phishing content or a benign decoy, including redirecting VPN users to innocuous content.\u003c/p\u003e\n\n\u003cp\u003eThe platform includes a Chromium browser extension called ForgCookie that is designed to maintain access to compromised accounts by generating and injecting refresh-token credential cookies and capturing Microsoft cookies across Microsoft domains. Forg365 also supports post-compromise actions such as monitoring compromised mailboxes for specific keywords and using AI to draft replies in email threads. The article recommends blocking device code authentication unless required, reviewing mailbox artifacts after device code events, auditing mail-flow rules, and decommissioning legacy aliases that no longer correspond to active employees.\u003c/p\u003e\n"},{"n":5,"title":"Attacker Uses Suspected AI-Generated PowerShell Script to Map Active Directory","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/attacker-uses-suspected-ai-generated.html","time":"11:02","priority":"SHOULD READ","score":82,"tldr":"Huntress observed an intruder using a likely AI-generated PowerShell script to aggressively enumerate Active Directory after gaining RDP access with stolen credentials, then exfiltrating the results. The key takeaway is that AI is helping lower-skilled attackers execute familiar intrusion playbooks faster and at greater scale, even without novel malware or zero-days.","briefOverview":"\u003cp\u003eHuntress researchers reported an early June 2026 intrusion in which an unknown threat actor used pre-compromised credentials to establish Remote Desktop Protocol access to a domain-joined Windows Server. The attacker staged tools in the \u003ccode\u003eC:\\ProgramData\\\u003c/code\u003e folder and used a suspected AI-generated PowerShell script to map the Active Directory environment. The script looked for the Domain Controller, mapped users, computers, and domains, exported files, and created an \u003ccode\u003eAD_Report.html\u003c/code\u003e file to measure the enumeration attempt.\u003c/p\u003e\n\n\u003cp\u003eHuntress described the PowerShell script as highly aggressive and noisy, with a five-step cascading fallback mechanism for reconnaissance and discovery. The researchers said signs of AI generation included a prompt-like title, placeholder strings, over-engineered methods to find a Domain Controller, and colorful console output. About 30 minutes later, the attacker deployed s5cmd and SharpShares to look for user-accessible data repositories, then archived and exfiltrated CSV data to a remote server.\u003c/p\u003e\n\n\u003cp\u003eThe article says the incident reflects how threat actors are adding AI-generated tools to familiar attack chains rather than using entirely new techniques. Sygnia separately reported an AI-assisted cloud attack against a large AWS-based environment that moved from initial access to broad compromise in about 72 hours. Sygnia said the attacker chained weaknesses across application services, AWS resources, source-control repositories, CI/CD workflows, runtime components, and data stores while using familiar cloud techniques rather than novel malware or zero-days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Huntress reported an early June 2026 intrusion in which an unknown threat actor used pre-compromised credentials to gain RDP access to a domain-joined Windows Server.","The attacker staged tools in C:\\ProgramData\\ and used a suspected AI-generated PowerShell script to locate the Domain Controller and enumerate Active Directory users, computers, groups, organizational units, and trusts.","Huntress said the PowerShell script showed signs of AI generation, including a prompt-like title, placeholder strings, over-engineered fallback methods, and beautified console output.","About 30 minutes after the Active Directory enumeration, the attacker deployed s5cmd and SharpShares to search for user-accessible data repositories.","Sygnia separately reported an AI-assisted cloud attack against a large AWS-based environment that moved from initial access to broad compromise in about 72 hours using familiar cloud techniques rather than novel malware or zero-days."],"insights":["The suspected AI-generated PowerShell script was not especially stealthy; Huntress described it as aggressive and noisy, suggesting AI assistance in this case prioritized speed and functionality over concealment.","The script’s creation of an HTML Active Directory Inventory Report appears to have been an unnecessary LLM-added feature that the attacker kept, showing how AI-generated tooling may include operationally odd or unintended artifacts.","Both the Active Directory incident and Sygnia’s AWS case indicate that AI-assisted attackers can amplify well-known techniques rather than depend on new malware or zero-days.","Sygnia’s cloud case shows that each newly obtained credential can become a rapid launch point for fresh discovery, secrets harvesting, persistence attempts, and exfiltration across a complex environment.","The attacker-created artifacts in the AWS case were masked as a pentest or red teaming exercise, making legitimate security activity a potential cover for malicious operations."],"referencedReports":[{"title":"AI-Coded Malware: Vibe Coding Active Directory","url":"https://www.huntress.com/blog/ai-coded-malware-vibe-coding-active-directory","publisher":"Huntress","context":"The article bases its main incident description on Huntress researchers' analysis of a suspected AI-generated PowerShell script used for Active Directory enumeration.","category":"","primary":false},{"title":"Inside an AI-Assisted Cloud Attack","url":"https://www.sygnia.co/blog/inside-an-ai-assisted-cloud-attack/","publisher":"Sygnia","context":"The article references Sygnia's report on an AI-assisted cloud attack that progressed from initial access to broad AWS compromise in about 72 hours.","category":"","primary":false}],"body":"\u003cp\u003eHuntress researchers reported an early June 2026 intrusion in which an unknown threat actor used pre-compromised credentials to establish Remote Desktop Protocol access to a domain-joined Windows Server. The attacker staged tools in the \u003ccode\u003eC:\\ProgramData\\\u003c/code\u003e folder and used a suspected AI-generated PowerShell script to map the Active Directory environment. The script looked for the Domain Controller, mapped users, computers, and domains, exported files, and created an \u003ccode\u003eAD_Report.html\u003c/code\u003e file to measure the enumeration attempt.\u003c/p\u003e\n\n\u003cp\u003eHuntress described the PowerShell script as highly aggressive and noisy, with a five-step cascading fallback mechanism for reconnaissance and discovery. The researchers said signs of AI generation included a prompt-like title, placeholder strings, over-engineered methods to find a Domain Controller, and colorful console output. About 30 minutes later, the attacker deployed s5cmd and SharpShares to look for user-accessible data repositories, then archived and exfiltrated CSV data to a remote server.\u003c/p\u003e\n\n\u003cp\u003eThe article says the incident reflects how threat actors are adding AI-generated tools to familiar attack chains rather than using entirely new techniques. Sygnia separately reported an AI-assisted cloud attack against a large AWS-based environment that moved from initial access to broad compromise in about 72 hours. Sygnia said the attacker chained weaknesses across application services, AWS resources, source-control repositories, CI/CD workflows, runtime components, and data stores while using familiar cloud techniques rather than novel malware or zero-days.\u003c/p\u003e\n"},{"n":7,"title":"Authenticated at Delivery, Forged at Origin","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/esignature-lure-arc-authentication-laundering-nepal-redirect","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A phishing email that failed SPF and DMARC at its origin was made to look legitimate after mailbox auto-forwarding gave it aligned authentication and ARC preserved the new pass verdict. Defenders should inspect the full Received chain and decoded redirect path, not trust final DMARC results or trusted-domain links alone.","briefOverview":"\u003cp\u003eA fake eSignature notification titled \u003cem\u003eAgreementDOC-79488 Is Ready For You\u003c/em\u003e reached a reporting inbox at a Canadian legal advocacy organization with clean delivery authentication results. At delivery, the message showed DKIM pass, DMARC pass, and \u003ccode\u003ecompauth=pass reason=100\u003c/code\u003e, even though its first hop had failed SPF and DMARC. The article describes this as a high-severity credential harvesting and spoofing case where authentication at delivery did not reflect authenticity at origin.\u003c/p\u003e\n\n\u003cp\u003eThe message first entered from \u003ccode\u003e188[.]215[.]229[.]105\u003c/code\u003e (\u003ccode\u003ev519eu[.]mailgun[.]net\u003c/code\u003e), where Microsoft recorded \u003ccode\u003espf=fail\u003c/code\u003e, \u003ccode\u003edmarc=fail\u003c/code\u003e, and \u003ccode\u003edkim=none\u003c/code\u003e. It then passed through an ordinary mailbox auto-forward to a second affiliated inbox, which gave it a fresh aligned envelope sender and allowed SPF, DMARC, and composite authentication to pass downstream. Microsoft sealed the later hops into an Authenticated Received Chain, creating what the article calls “authentication laundering.”\u003c/p\u003e\n\n\u003cp\u003eThe email body used a long corporate legal thread as camouflage for one call to action: \u003cem\u003eYour Secured documents are ready. View Document Here.\u003c/em\u003e That link began with a Google open redirect, passed through \u003ccode\u003eadservice[.]google[.]com[.]ar\u003c/code\u003e, and ended at \u003ccode\u003eruslanstudio[.]com\u003c/code\u003e, a domain registered in 2022 to a registrant in Lalitpur, Nepal. The article says the message was ultimately caught by behavioral signals, including first-time sender behavior, contradictory authentication history, and a redirect chain matching community-reported patterns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fake eSignature notification with the subject “AgreementDOC-79488 Is Ready For You” reached a Canadian legal advocacy organization’s reporting inbox with DKIM pass, DMARC pass, and compauth pass at delivery.","At the first hop, Microsoft recorded the message from 188[.]215[.]229[.]105 on v519eu[.]mailgun[.]net as SPF fail, DMARC fail, and DKIM none because the sending host was not authorized for the From domain.","An ordinary mailbox auto-forward gave the message a fresh envelope sender aligned to the forwarding organization, after which subsequent Microsoft hops sealed the authentication results into an Authenticated Received Chain.","The message body used a repurposed-looking corporate legal thread to support a single call to action labeled “Your Secured documents are ready. View Document Here.”","The call-to-action link began with a Google open redirect, passed through an ad-click redirect on adservice[.]google[.]com[.]ar, and landed on ruslanstudio[.]com, a domain registered in 2022 to a registrant in Lalitpur, Nepal."],"insights":["A final DMARC pass can be misleading when mailbox forwarding and ARC are involved, because the article shows a message that failed authentication at origin but appeared clean by delivery.","Defenders should alert on contradictions between origin-hop authentication and delivery-time authentication rather than relying on the final authentication stamp alone.","A link that initially points to google.com can still be malicious if it immediately uses Google’s redirect services to hide the final destination.","Domain-age checks are insufficient for this lure because the final decoy domain was registered in 2022 and therefore did not look like a newly created throwaway domain.","The article shows that a convincing legal email thread can function mainly as camouflage for a single call-to-action link, making the body content less important than the one link placed above it."],"referencedReports":[{"title":"RFC 9989","url":"https://datatracker.ietf.org/doc/html/rfc9989","publisher":"IETF","context":"The article references RFC 9989 as the formal specification for DMARC when discussing how receivers handle SPF and DKIM failures against the From domain.","category":"","primary":false},{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for the claim that phishing remains the initial access vector in 16% of breaches.","category":"","primary":false},{"title":"2024 Cost of a Data Breach Report","url":"https://www.ibm.com/reports/data-breach","publisher":"IBM","context":"The article cites the report for the average breach cost of $4.88 million and the role of stolen credentials as a common and costly entry point.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article cites the report as documenting a shift toward identity-based attacks that rely on trusted infrastructure.","category":"","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article cites CISA guidance to support the point that authentication controls raise the cost of spoofing but do not close the behavioral gap exploited by phishing lures.","category":"","primary":false}],"body":"\u003cp\u003eA fake eSignature notification titled \u003cem\u003eAgreementDOC-79488 Is Ready For You\u003c/em\u003e reached a reporting inbox at a Canadian legal advocacy organization with clean delivery authentication results. At delivery, the message showed DKIM pass, DMARC pass, and \u003ccode\u003ecompauth=pass reason=100\u003c/code\u003e, even though its first hop had failed SPF and DMARC. The article describes this as a high-severity credential harvesting and spoofing case where authentication at delivery did not reflect authenticity at origin.\u003c/p\u003e\n\n\u003cp\u003eThe message first entered from \u003ccode\u003e188[.]215[.]229[.]105\u003c/code\u003e (\u003ccode\u003ev519eu[.]mailgun[.]net\u003c/code\u003e), where Microsoft recorded \u003ccode\u003espf=fail\u003c/code\u003e, \u003ccode\u003edmarc=fail\u003c/code\u003e, and \u003ccode\u003edkim=none\u003c/code\u003e. It then passed through an ordinary mailbox auto-forward to a second affiliated inbox, which gave it a fresh aligned envelope sender and allowed SPF, DMARC, and composite authentication to pass downstream. Microsoft sealed the later hops into an Authenticated Received Chain, creating what the article calls “authentication laundering.”\u003c/p\u003e\n\n\u003cp\u003eThe email body used a long corporate legal thread as camouflage for one call to action: \u003cem\u003eYour Secured documents are ready. View Document Here.\u003c/em\u003e That link began with a Google open redirect, passed through \u003ccode\u003eadservice[.]google[.]com[.]ar\u003c/code\u003e, and ended at \u003ccode\u003eruslanstudio[.]com\u003c/code\u003e, a domain registered in 2022 to a registrant in Lalitpur, Nepal. The article says the message was ultimately caught by behavioral signals, including first-time sender behavior, contradictory authentication history, and a redirect chain matching community-reported patterns.\u003c/p\u003e\n"},{"n":1,"title":"UK charges suspects linked to Russian Coms call spoofing platform","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/uk-charges-suspects-linked-to-russian-coms-call-spoofing-platform/","time":"13:23","priority":"SHOULD READ","score":78,"tldr":"UK authorities charged five London suspects linked to Russian Coms, a caller ID spoofing platform used to make over 1.8 million scam calls by impersonating banks, telecoms, and law enforcement. The platform has been tied to tens of millions in losses and an estimated 170,000 victims worldwide.","briefOverview":"\u003cp\u003eUK authorities charged five people following a National Crime Agency investigation into Russian Coms, a caller ID spoofing platform used by criminals to make over 1.8 million scam calls. The five charged are Ayoub Sehailia, Zakkaria Sehailia, Usman Din, Denis Ozmus, and Fadila Salem, all from London. The charges include conspiracy to supply articles for use in connection with fraud, transferring or converting criminal property, and, for Zakkaria Sehailia, failing to comply with a notice to provide phone passcodes.\u003c/p\u003e\n\n\u003cp\u003eRussian Coms was established in 2020 and began as a handset before moving to a web-based application, with both versions marketed and sold. The platform allowed criminals to hide their identity by making calls appear to come from pre-selected numbers, often belonging to financial institutions, telecommunications companies, and law enforcement agencies. Since 2020, it has been linked to tens of millions in financial losses affecting an estimated 170,000 victims.\u003c/p\u003e\n\n\u003cp\u003eBefore its shutdown, criminals used Russian Coms to make over 1.3 million calls to 500,000 unique phone numbers across more than 107 countries, including the United Kingdom, the United States, New Zealand, Norway, and France. The platform was promoted on Telegram, Snapchat, and Instagram and offered features including encrypted calls, a web phone, no-logs, international calls, voice-changing services, instant handset wipes, and \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e support. Its shutdown was part of Operation Henhouse, which led to 290 arrests across England, Scotland, Wales, and Northern Ireland.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["UK authorities charged five London residents following a National Crime Agency investigation into Russian Coms, a caller ID spoofing platform used by criminals to make over 1.8 million scam calls.","The charges include conspiracy to supply articles for use in connection with fraud, transferring or converting criminal property, and, for Zakkaria Sehailia, failing to comply with a notice to provide phone passcodes.","Russian Coms allowed criminals to hide their identity by making calls appear to come from pre-selected numbers belonging to financial institutions, telecommunications companies, and law enforcement agencies.","Since 2020, Russian Coms has been linked to tens of millions in financial losses affecting an estimated 170,000 victims.","The NCA said criminals used the platform to call 500,000 unique phone numbers across more than 107 countries before it was shut down."],"insights":["Russian Coms was run like a paid commercial service for criminals, offering six-month contracts, 24/7 support, encrypted calls, voice-changing services, and instant handset wipes.","The platform’s promotion on Telegram, Snapchat, and Instagram shows that access to scam-enabling tools was marketed through mainstream and social messaging channels, not only hidden forums.","The scam model relied on impersonating trusted institutions such as banks, telecom companies, and law enforcement, with victims persuaded to move money themselves to attacker-controlled accounts.","The platform had a broad international reach, with calls made to 500,000 unique phone numbers across more than 107 countries before its shutdown."],"referencedReports":[],"body":"\u003cp\u003eUK authorities charged five people following a National Crime Agency investigation into Russian Coms, a caller ID spoofing platform used by criminals to make over 1.8 million scam calls. The five charged are Ayoub Sehailia, Zakkaria Sehailia, Usman Din, Denis Ozmus, and Fadila Salem, all from London. The charges include conspiracy to supply articles for use in connection with fraud, transferring or converting criminal property, and, for Zakkaria Sehailia, failing to comply with a notice to provide phone passcodes.\u003c/p\u003e\n\n\u003cp\u003eRussian Coms was established in 2020 and began as a handset before moving to a web-based application, with both versions marketed and sold. The platform allowed criminals to hide their identity by making calls appear to come from pre-selected numbers, often belonging to financial institutions, telecommunications companies, and law enforcement agencies. Since 2020, it has been linked to tens of millions in financial losses affecting an estimated 170,000 victims.\u003c/p\u003e\n\n\u003cp\u003eBefore its shutdown, criminals used Russian Coms to make over 1.3 million calls to 500,000 unique phone numbers across more than 107 countries, including the United Kingdom, the United States, New Zealand, Norway, and France. The platform was promoted on Telegram, Snapchat, and Instagram and offered features including encrypted calls, a web phone, no-logs, international calls, voice-changing services, instant handset wipes, and \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e support. Its shutdown was part of Operation Henhouse, which led to 290 arrests across England, Scotland, Wales, and Northern Ireland.\u003c/p\u003e\n"},{"n":3,"title":"Meta Files Patent for AI That Can Listen All Day and Track How You're Feeling","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/meta-files-patent-for-ai-that-can.html","time":"11:54","priority":"MAY READ","score":64,"tldr":"Meta has filed a patent for an AI system that could listen to users throughout the day, infer emotions from voice and other signals like eye tracking and phone activity, and log those readings with time and context. The idea is not a product yet, but it raises major privacy and regulatory concerns around always-on emotion tracking.","briefOverview":"\u003cp\u003eMeta has filed patent application US \u003csup\u003e2026\u003c/sup\u003e\u0026frasl;\u003csub\u003e0182881\u003c/sub\u003e for an AI system that can listen to a user’s voice during the day, infer how the user is feeling, and keep timestamped logs of those readings. The filing was submitted in December 2025, published on July 2, names Lachlan Dunn as the inventor, and traces back to a December 2024 provisional filing. Meta has not announced a product based on the filing, and the article notes that patent filings can stake a claim on an idea before any product is built.\u003c/p\u003e\n\n\u003cp\u003eThe patent describes devices such as smart glasses, phones, smartwatches, headphones, and smart home speakers recording speech, transcribing it, and analyzing both words and vocal cues like tone, pace, sighs, and laughter. The system could connect emotional readings to context including time, location, activity, and phone use, and in some versions could log speech patterns on servers. It could also incorporate biometric and eye-tracking signals such as pupil size, blink rate, and eye moisture, as well as device behavior such as posts viewed or liked, screen time, and app-switching speed.\u003c/p\u003e\n\n\u003cp\u003eThe filing also describes a real-time fitness coach that uses smart glasses to watch workout form and adjust coaching based on the user’s inferred mood. The article compares the idea with Amazon Halo’s former Tone feature, which analyzed voice tone and was shut down with the Halo line in 2023, while noting that Meta’s filing reaches beyond voice to eyes and phone activity. It also notes that the EU AI Act has banned AI emotion inference in workplaces and schools except for medical or safety reasons, while a later rule will require disclosure for systems that read emotions from biometric signals.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Meta filed patent application US 2026/0182881 for an AI system that can record speech across the day, infer emotional state from words and vocal cues, and keep timestamped logs tied to context such as time, location, activity, and phone use.","The filing says the system could run on devices including smart glasses, phones, smartwatches, headphones, or smart home speakers, with some versions listening all day and others checking only at set times.","The patent describes using additional signals beyond voice, including pupil size, blink rate, eye moisture, viewed or liked posts, screen time, and app-switching speed, to build an emotional profile.","The application also describes a real-time fitness coach that uses smart glasses to monitor workout form and adjust coaching based on the user's inferred mood.","The article states that Meta has not announced a product based on the filing, and notes that EU AI Act rules already ban emotion-inference AI in workplaces and schools except for medical or safety reasons."],"insights":["Although the filing’s title includes real-time fitness coaching, the article notes that all three independent claims cover emotional analysis on its own, while workout coaching appears only in dependent claims.","The article highlights that Meta’s proposed system is broader than Amazon Halo’s former Tone feature because it could combine voice analysis with eye-tracking signals and phone-use behavior.","The filing includes versions where processing stays on-device and versions where speech patterns are logged on servers, making the system’s privacy impact dependent on implementation.","The EU AI Act already bans workplace and school emotion-inference AI except for medical or safety reasons, but the article notes that this ban does not cover consumer tools like the kind described in Meta’s filing."],"referencedReports":[{"title":"Meta AI Tracks Your Emotions in Real-Time","url":"https://patentlyze.com/patent/meta-ai-tracks-your-emotions-time/","publisher":"Patentlyze","context":"The article says the patent-analysis site Patentlyze first flagged Meta's patent filing.","category":"","primary":false}],"body":"\u003cp\u003eMeta has filed patent application US \u003csup\u003e2026\u003c/sup\u003e\u0026frasl;\u003csub\u003e0182881\u003c/sub\u003e for an AI system that can listen to a user’s voice during the day, infer how the user is feeling, and keep timestamped logs of those readings. The filing was submitted in December 2025, published on July 2, names Lachlan Dunn as the inventor, and traces back to a December 2024 provisional filing. Meta has not announced a product based on the filing, and the article notes that patent filings can stake a claim on an idea before any product is built.\u003c/p\u003e\n\n\u003cp\u003eThe patent describes devices such as smart glasses, phones, smartwatches, headphones, and smart home speakers recording speech, transcribing it, and analyzing both words and vocal cues like tone, pace, sighs, and laughter. The system could connect emotional readings to context including time, location, activity, and phone use, and in some versions could log speech patterns on servers. It could also incorporate biometric and eye-tracking signals such as pupil size, blink rate, and eye moisture, as well as device behavior such as posts viewed or liked, screen time, and app-switching speed.\u003c/p\u003e\n\n\u003cp\u003eThe filing also describes a real-time fitness coach that uses smart glasses to watch workout form and adjust coaching based on the user’s inferred mood. The article compares the idea with Amazon Halo’s former Tone feature, which analyzed voice tone and was shut down with the Halo line in 2023, while noting that Meta’s filing reaches beyond voice to eyes and phone activity. It also notes that the EU AI Act has banned AI emotion inference in workplaces and schools except for medical or safety reasons, while a later rule will require disclosure for systems that read emotions from biometric signals.\u003c/p\u003e\n"},{"n":8,"title":"Rust-proof your code with our new Testing Handbook chapter","source":"blog.trailofbits.com","sourceColorIdx":6,"link":"https://blog.trailofbits.com/2026/07/13/rust-proof-your-code-with-our-new-testing-handbook-chapter/","time":"11:00","priority":"MAY READ","score":55,"tldr":"Trail of Bits added a new Rust chapter to its Testing Handbook covering security testing tools, review gotchas, memory zeroization, dependency vetting, and specialized testing like Miri, Clippy, proptest, and Kani. It also released rust-review, a Claude Code plugin for automated Rust security reviews.","briefOverview":"\u003cp\u003eTrail of Bits has added a new chapter to its Testing Handbook focused on security testing Rust programs. The chapter is described as a comprehensive guide to the tools and techniques Trail of Bits uses to validate the security of Rust programs and systems. It begins with an overview of what Rust’s guarantees do and do not cover, including unwind safety, nondeterminism, and arithmetic errors.\u003c/p\u003e\n\n\u003cp\u003eThe chapter covers dynamic analysis topics such as unit test boosters, using Miri to detect undefined behavior, property testing with \u003ccode\u003eproptest\u003c/code\u003e, coverage measurement, and mutation testing. Its static analysis section covers Clippy in depth and includes a list of Trail of Bits’ favorite lints. It also includes guidance from direct Rust codebase audits, including a gotchas and footguns checklist, operator precedence issues, and three approaches to memory zeroization.\u003c/p\u003e\n\n\u003cp\u003eTrail of Bits also released rust-review, a Claude Code plugin for automated Rust security reviews that was co-built with Aptos Labs. The plugin targets more than a dozen bug classes, including memory safety, concurrency hazards, FFI pitfalls, and async cancellation issues. Trail of Bits says it aims to keep the handbook current as the Rust ecosystem evolves and invites contributions through pull requests.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trail of Bits added a new chapter to its Testing Handbook that provides a comprehensive guide to security testing Rust programs.","The chapter covers Rust security guarantees and limitations, including unwind safety, nondeterminism, and arithmetic errors.","The chapter describes dynamic and static analysis tools and techniques, including Miri, proptest, coverage measurement, mutation testing, and Clippy.","The chapter includes guidance for manual Rust code reviews, including gotchas and footguns, operator precedence issues, and memory zeroization approaches.","Trail of Bits released rust-review, a Claude Code plugin co-built with Aptos Labs for automated Rust security reviews across more than a dozen bug classes."],"insights":["The chapter emphasizes that Rust’s safety guarantees do not eliminate security review needs, calling out issues such as unwind safety, nondeterminism, and arithmetic errors as areas developers may overlook.","Trail of Bits treats manual review as still important for Rust code, highlighting subtle language pitfalls such as `a \u0026 b == c` having different operator precedence than in C.","The chapter presents memory zeroization as a difficult problem rather than a solved default behavior, offering three separate approaches for ensuring secrets are erased from memory.","The rust-review plugin is positioned as a pre-audit tool, intended to catch Rust security issues earlier across areas including memory safety, concurrency, FFI, and async cancellation."],"referencedReports":[],"body":"\u003cp\u003eTrail of Bits has added a new chapter to its Testing Handbook focused on security testing Rust programs. The chapter is described as a comprehensive guide to the tools and techniques Trail of Bits uses to validate the security of Rust programs and systems. It begins with an overview of what Rust’s guarantees do and do not cover, including unwind safety, nondeterminism, and arithmetic errors.\u003c/p\u003e\n\n\u003cp\u003eThe chapter covers dynamic analysis topics such as unit test boosters, using Miri to detect undefined behavior, property testing with \u003ccode\u003eproptest\u003c/code\u003e, coverage measurement, and mutation testing. Its static analysis section covers Clippy in depth and includes a list of Trail of Bits’ favorite lints. It also includes guidance from direct Rust codebase audits, including a gotchas and footguns checklist, operator precedence issues, and three approaches to memory zeroization.\u003c/p\u003e\n\n\u003cp\u003eTrail of Bits also released rust-review, a Claude Code plugin for automated Rust security reviews that was co-built with Aptos Labs. The plugin targets more than a dozen bug classes, including memory safety, concurrency hazards, FFI pitfalls, and async cancellation issues. Trail of Bits says it aims to keep the handbook current as the Rust ecosystem evolves and invites contributions through pull requests.\u003c/p\u003e\n"},{"n":10,"title":"Introducing Precursor: detecting agentic behavior with continuous client-side signals","source":"blog.cloudflare.com","sourceColorIdx":2,"link":"https://blog.cloudflare.com/introducing-precursor/","time":"13:00","priority":"MAY READ","score":55,"tldr":"Cloudflare launched Precursor, a client-side, session-based bot detection system that continuously analyzes behavioral signals across a user’s journey to better distinguish humans from automated agents. It integrates with Cloudflare Bot Management and Turnstile to improve bot scoring while reducing unnecessary challenges for legitimate users.","briefOverview":"\u003cp\u003eCloudflare introduced Precursor, a client-side, session-based verification system for detecting automated or agentic behavior across a full web application. Precursor uses dynamically injected JavaScript to continuously collect behavioral signals as visitors interact with a site, extending client-side detection beyond specific Challenge or Turnstile moments. Cloudflare says this addresses a visibility gap in understanding how humans and bots behave across the full user journey.\u003c/p\u003e\n\n\u003cp\u003ePrecursor collects interaction signals such as pointer movement, keyboard activity, focus changes, and page visibility, then sends buffered data to an edge evaluation layer for analysis. Evaluators cross-reference signals, such as whether pointer activity matches page visibility duration or whether keyboard events occur only when a text field is focused. The system is session-scoped, so behavioral signals accumulate throughout a session and cannot be reset simply by refreshing the page or starting over with a new challenge.\u003c/p\u003e\n\n\u003cp\u003eCloudflare says Precursor is designed to improve bot detection precision while reducing unnecessary interruptions for legitimate users. The company states that the system captures minimum useful information, such as keyboard timing and rhythm rather than actual keys pressed, and uses behavioral signals internally rather than exposing them in customer dashboards or tying them to user accounts. Precursor is rolling out now, can be enabled from the Cloudflare dashboard, and will be free to use until its general availability release later this year.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cloudflare introduced Precursor, a client-side, session-based verification system that uses dynamically injected JavaScript to continuously collect behavioral signals as visitors interact with an application.","Precursor is an optional complement to Cloudflare Turnstile and is available as part of Cloudflare Enterprise Bot Management.","The system collects signals such as pointer movement, keyboard activity, focus changes, and visibility, then sends buffered data to an edge evaluation layer for analysis.","Precursor evaluates behavior across an entire session so automated activity cannot reset its behavioral signature simply by refreshing the page or starting over with a new challenge.","Cloudflare says Precursor is designed with privacy in mind by collecting minimum behavioral information, such as keyboard timing and rhythm rather than actual keys pressed, and by consuming signals internally rather than exposing them in customer dashboards."],"insights":["Cloudflare is shifting bot detection from isolated checkpoints like logins, signups, and checkouts to analysis of the full user journey, because the article says modern automation can pass short interactions and individual CAPTCHAs.","Precursor specifically raises the cost for bot operators by forcing them to simulate consistent behavior over an entire session rather than only solving or bypassing a single challenge.","Cloudflare’s examples show that Precursor treats human imperfection as a security signal, including irregular mouse paths, timing delays, overshoots, and movement constrained by wrist and hand behavior.","Customers can initially use Precursor in a low-friction mode to observe behavior in the background, or choose a stricter mode that enforces Challenges when a verified session does not already exist.","The new session-based Security Analytics views are intended to reveal behavior that per-request analytics cannot capture, especially activity that happens between requests."],"referencedReports":[],"body":"\u003cp\u003eCloudflare introduced Precursor, a client-side, session-based verification system for detecting automated or agentic behavior across a full web application. Precursor uses dynamically injected JavaScript to continuously collect behavioral signals as visitors interact with a site, extending client-side detection beyond specific Challenge or Turnstile moments. Cloudflare says this addresses a visibility gap in understanding how humans and bots behave across the full user journey.\u003c/p\u003e\n\n\u003cp\u003ePrecursor collects interaction signals such as pointer movement, keyboard activity, focus changes, and page visibility, then sends buffered data to an edge evaluation layer for analysis. Evaluators cross-reference signals, such as whether pointer activity matches page visibility duration or whether keyboard events occur only when a text field is focused. The system is session-scoped, so behavioral signals accumulate throughout a session and cannot be reset simply by refreshing the page or starting over with a new challenge.\u003c/p\u003e\n\n\u003cp\u003eCloudflare says Precursor is designed to improve bot detection precision while reducing unnecessary interruptions for legitimate users. The company states that the system captures minimum useful information, such as keyboard timing and rhythm rather than actual keys pressed, and uses behavioral signals internally rather than exposing them in customer dashboards or tying them to user accounts. Precursor is rolling out now, can be enabled from the Cloudflare dashboard, and will be free to use until its general availability release later this year.\u003c/p\u003e\n"},{"n":4,"title":"Thinking Fast and Slow in the SOC: The Case for Combining Autonomous AI with Analyst Copilots","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/thinking-fast-and-slow-in-soc-case-for.html","time":"11:37","priority":"MAY READ","score":45,"tldr":"The article argues that effective SOC AI should mirror human “fast and slow” thinking: autonomous systems should triage and investigate nearly all alerts at scale, while analyst copilots and humans focus only on the small percentage of cases requiring judgment. Without this split, teams either burn out on manual triage or misuse expensive frontier AI on raw alert queues without solving coverage gaps.","briefOverview":"\u003cp\u003eThe article argues that many security operations centers are designing AI systems around only the small share of alerts that need deep human judgment while ignoring the larger alert volume. It uses Daniel Kahneman’s \u003cem\u003eThinking, Fast and Slow\u003c/em\u003e to compare SOC work to two modes of thinking: fast automatic processing and slow deliberate reasoning. The author says a successful SOC should mirror this split by using autonomous AI for the majority of alert investigation and reserving analysts and AI copilots for the cases that need judgment.\u003c/p\u003e\n\n\u003cp\u003eThe article cites research based on more than 25 million enterprise alerts, saying 98% of alerts can be resolved autonomously and less than 2% warrant human review. It says an enterprise with 450,000 alerts per year can expect 54 real threats to be hidden in low-severity alerts that often never reach the front of the queue. The author argues that forcing analysts to manually triage large volumes of alerts exhausts them, reduces coverage, and leaves threats hidden in alert backlogs.\u003c/p\u003e\n\n\u003cp\u003eThe proposed architecture has a “fast brain” that automatically investigates all signals, performs forensic analysis, correlates evidence across endpoint, identity, network, and cloud, and produces verdicts. A “slow brain” made up of analysts and tools such as Claude, Codex, and Cursor would then work on escalated cases, detection rules, incident reporting, and threat hunting. The article also argues that organizations outsourcing alert investigation to MDR providers may not own the accumulated case history, triage logic, rules, and context needed to make analyst copilots useful.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article compares SOC decision-making to Daniel Kahneman’s System 1 and System 2 model, arguing that most alerts need fast, automatic processing while a small minority need deliberate human judgment.","Research cited in the article says 98% of enterprise alerts can be resolved autonomously, while less than 2% warrant human review.","The article argues that forcing human analysts to manually triage large alert volumes exhausts their capacity and can leave real threats hidden in low-severity alerts.","The article says frontier AI tools such as Claude, Codex, and Cursor are best used for escalated cases, detection rule engineering, incident reporting, and threat hunting rather than raw alert triage at full scale.","The article argues that enterprises using MDR providers may not own the accumulated investigation knowledge layer needed to make analyst copilots useful."],"insights":["The article frames the common practice of connecting a frontier AI model directly to detection tools as an incomplete architecture because it may improve deep investigations while still leaving most alerts outside meaningful review.","The article argues that low-severity alert backlogs are strategically important because real threats can be hidden there, with the cited research estimating 54 real threats per year in such alerts for an enterprise with 450,000 annual alerts.","The article highlights cost and scale as practical limits of using general-purpose frontier models for every raw alert, saying teams may quietly skip low-priority alerts when the economics do not hold.","The article presents analyst copilots as more valuable when they receive already-investigated, evidence-backed cases rather than raw alerts, shifting analysts from queue grinding to judgment and supervision.","The article identifies ownership of investigation history, rules, triage logic, and organizational context as a strategic reason to bring alert investigation in-house rather than outsourcing it to an MDR provider."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that many security operations centers are designing AI systems around only the small share of alerts that need deep human judgment while ignoring the larger alert volume. It uses Daniel Kahneman’s \u003cem\u003eThinking, Fast and Slow\u003c/em\u003e to compare SOC work to two modes of thinking: fast automatic processing and slow deliberate reasoning. The author says a successful SOC should mirror this split by using autonomous AI for the majority of alert investigation and reserving analysts and AI copilots for the cases that need judgment.\u003c/p\u003e\n\n\u003cp\u003eThe article cites research based on more than 25 million enterprise alerts, saying 98% of alerts can be resolved autonomously and less than 2% warrant human review. It says an enterprise with 450,000 alerts per year can expect 54 real threats to be hidden in low-severity alerts that often never reach the front of the queue. The author argues that forcing analysts to manually triage large volumes of alerts exhausts them, reduces coverage, and leaves threats hidden in alert backlogs.\u003c/p\u003e\n\n\u003cp\u003eThe proposed architecture has a “fast brain” that automatically investigates all signals, performs forensic analysis, correlates evidence across endpoint, identity, network, and cloud, and produces verdicts. A “slow brain” made up of analysts and tools such as Claude, Codex, and Cursor would then work on escalated cases, detection rules, incident reporting, and threat hunting. The article also argues that organizations outsourcing alert investigation to MDR providers may not own the accumulated case history, triage logic, rules, and context needed to make analyst copilots useful.\u003c/p\u003e\n"},{"n":9,"title":"13th July – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/13th-july-threat-intelligence-report/","time":"13:06","priority":"MAY READ","score":40,"tldr":"This week’s threat intelligence roundup highlights major data breaches, emerging AI-enabled attack risks, and critical vulnerabilities affecting routers, Linux KVM, U-Boot, and Opera GX. It also tracks active threat groups including Cavern Manticore, ShinyHunters, JadePuffer, and UAT-7810 targeting government, cloud, crypto, and networking ecosystems.","briefOverview":"\u003cp\u003eThe article is a weekly threat intelligence roundup for 13 July covering major attacks, breaches, AI-related threats, vulnerabilities, and threat research. It reports that AssuranceAmerica disclosed a breach affecting about 7 million people, while Moody Bible Institute disclosed a breach affecting more than 2.3 million donors, students, alumni, and supporters. It also describes a ransomware attack on Latvia’s state-owned forestry company Latvijas Valsts Meži and a supply chain compromise at Injective Labs involving malicious npm packages that stole cryptocurrency wallet private keys and seed phrases.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights AI-related risks, including JadePuffer, an autonomous ransomware operation that used a large language model to conduct an intrusion without direct human control. Researchers also showed that hidden instructions in open-source project files could trigger remote code execution through Anthropic Claude Code and OpenAI Codex when operating with automated permissions. Another issue, Rogue Agent in Google Dialogflow CX, allowed limited users to insert persistent malicious code capable of capturing and exfiltrating chatbot conversations, though Google addressed the issue and no known customer environments were compromised.\u003c/p\u003e\n\n\u003cp\u003eThe roundup also covers several significant vulnerabilities and threat intelligence reports. It notes CVE-2026-11405 in multiple Tenda router models, CVE-2026-53359 in Linux KVM, six U-Boot flaws affecting secure boot, and an Opera GX flaw that allowed malicious websites to install browser modifications without user confirmation. It also summarizes research on Cavern Manticore, global June 2026 attack activity, a student employment phishing campaign using compromised school email accounts and Google Forms, and UAT-7810’s use of unpatched networking devices to build relay infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AssuranceAmerica disclosed a data breach affecting approximately 7 million people after attackers used compromised employee credentials to access company systems and steal personal, insurance, vehicle, and claims information.","Latvijas Valsts Meži suffered a ransomware attack that disrupted mapping, hunting, contractor, and customer systems after attackers exploited a system that had remained unpatched for two years and leaked about 44GB of internal data.","Injective Labs experienced a supply chain compromise in which attackers accessed its SDK project and published malicious npm packages that exfiltrated cryptocurrency wallet private keys and seed phrases.","Researchers profiled JadePuffer, an autonomous ransomware operation that used a large language model to exploit CVE-2025-3248 in an exposed Langflow instance, access a production MySQL server, exfiltrate data, delete the database, and issue an extortion demand.","Several significant vulnerabilities were reported or patched, including a Tenda router authentication backdoor, a Linux KVM flaw that could allow a malicious guest virtual machine to corrupt host memory, U-Boot secure boot verification flaws, and an Opera GX issue allowing malicious browser modifications."],"insights":["Compromised but trusted accounts and channels recur across multiple incidents, including AssuranceAmerica employee credentials, school email accounts used in the student job scam, and Injective Labs’ legitimate SDK project used to publish malicious npm packages.","Unpatched internet-facing or exposed systems were a repeated entry point, with the Latvia forestry ransomware attack tied to a system left unpatched for two years, JadePuffer exploiting an exposed Langflow instance, and UAT-7810 exploiting unpatched Ruckus and ASUS devices.","AI-related risks in the article were not limited to fake content or chat scams; they included an autonomous ransomware operation, coding agents executing hidden project-file instructions, and chatbot conversation theft through persistent malicious code in Dialogflow CX.","Several reported weaknesses affected foundational or widely reused technology layers, including router firmware, the Linux KVM hypervisor, U-Boot secure boot verification, and npm packages used by developers."],"referencedReports":[{"title":"UAT-7810","url":"https://blog.talosintelligence.com/uat-7810/","publisher":"Talos Intelligence","context":"The article references researchers’ analysis of UAT-7810, a China-linked threat actor that compromises internet-facing networking devices to expand operational relay box infrastructure.","category":"","primary":false}],"body":"\u003cp\u003eThe article is a weekly threat intelligence roundup for 13 July covering major attacks, breaches, AI-related threats, vulnerabilities, and threat research. It reports that AssuranceAmerica disclosed a breach affecting about 7 million people, while Moody Bible Institute disclosed a breach affecting more than 2.3 million donors, students, alumni, and supporters. It also describes a ransomware attack on Latvia’s state-owned forestry company Latvijas Valsts Meži and a supply chain compromise at Injective Labs involving malicious npm packages that stole cryptocurrency wallet private keys and seed phrases.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights AI-related risks, including JadePuffer, an autonomous ransomware operation that used a large language model to conduct an intrusion without direct human control. Researchers also showed that hidden instructions in open-source project files could trigger remote code execution through Anthropic Claude Code and OpenAI Codex when operating with automated permissions. Another issue, Rogue Agent in Google Dialogflow CX, allowed limited users to insert persistent malicious code capable of capturing and exfiltrating chatbot conversations, though Google addressed the issue and no known customer environments were compromised.\u003c/p\u003e\n\n\u003cp\u003eThe roundup also covers several significant vulnerabilities and threat intelligence reports. It notes CVE-2026-11405 in multiple Tenda router models, CVE-2026-53359 in Linux KVM, six U-Boot flaws affecting secure boot, and an Opera GX flaw that allowed malicious websites to install browser modifications without user confirmation. It also summarizes research on Cavern Manticore, global June 2026 attack activity, a student employment phishing campaign using compromised school email accounts and Google Forms, and UAT-7810’s use of unpatched networking devices to build relay infrastructure.\u003c/p\u003e\n"}]</script>
