<script type="application/json" id="dl-articles">[{"n":4,"title":"CISA Warns of 4 Exploited Flaws Linked to Ransomware, Cryptomining, and LLMjacking Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/cisa-warns-of-4-exploited-flaws-linked.html","time":"08:00","priority":"MUST READ","score":94,"tldr":"CISA added four actively exploited flaws in Synology DSM, LiteLLM, Apache Axis, and REDCap to its KEV catalog, linking them to ransomware, cryptomining, and LLMjacking activity. Organizations should urgently patch or mitigate the affected systems, especially because Apache Axis 1.x is end-of-life and lacks an official fix.","briefOverview":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting Synology DiskStation Manager, BerriAI LiteLLM, Apache Axis, and Vanderbilt University REDCap to its Known Exploited Vulnerabilities catalog. The flaws include three remote code execution issues with CVSS scores of 9.8 and a LiteLLM issue rated 8.8 that can enable code execution through a guardrails testing endpoint. CISA said the REDCap flaw can be triggered through crafted HTTP requests in a public survey context when an attacker knows a valid survey hash.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Axis flaw has reportedly been used alongside N-able N-central vulnerabilities to install cryptocurrency miners, but Axis 1.x is end-of-life and has no official patch. Separately, Safe Security observed REDCap exploitation that deployed a temporary web shell, loaded XMRig disguised as image files, and established persistence through cron and an added SSH key. The LiteLLM flaw has been used in LLMjacking activity to turn limited-access inference keys into administrator credentials, while the Synology DSM flaw has been linked to C3RB3R ransomware attacks on network-attached storage devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added four actively exploited vulnerabilities affecting Synology DiskStation Manager, BerriAI LiteLLM, Apache Axis, and Vanderbilt REDCap to its Known Exploited Vulnerabilities catalog.","The Apache Axis flaw CVE-2026-90436 has been used with N-able N-central vulnerabilities to deploy cryptocurrency miners, and Axis 1.x is end-of-life without an official patch.","Attackers have abused the REDCap flaw CVE-2026-90817 to deploy a temporary web shell and retrieve XMRig cryptocurrency-mining software disguised as image files.","Threat actors used the LiteLLM flaw CVE-2026-40217 to turn limited AI-service access keys into full administrator credentials and maintain access in LLMjacking campaigns.","Synology disclosed that CVE-2024-10441 in DiskStation Manager has been exploited to deploy C3RB3R ransomware on network-attached storage devices."],"insights":["Apache Axis 1.x presents an unusual remediation problem because it is end-of-life and has no official patch; users are advised to migrate to Axis 2/Java or apply a build containing a specific July 2026 commit.","The REDCap exploitation described was designed to be less visible: attackers used a temporary web shell, loaded XMRig into memory, disguised it as image files, and made it appear as the syslog-ng service.","The LiteLLM flaw can turn a limited-access inference key into full administrator credentials, meaning a credential intended for restricted AI use can provide much broader control.","The four flaws are associated with distinct criminal outcomes—cryptocurrency mining, persistence in AI-service environments, and C3RB3R ransomware—rather than a single type of misuse.","CISA set different remediation deadlines, requiring action for the DSM, REDCap, and Axis flaws by November 21, 2026, while allowing until December 2, 2026 for the LiteLLM flaw."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/18/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites CISA's advisory announcing the addition of four actively exploited vulnerabilities to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true},{"title":"This Week in CVEs: The Week Defenders Lost the Head Start","url":"https://safe.security/resources/blog/this-week-in-cves-the-week-defenders-lost-the-head-start/","publisher":"safe-security","context":"The article references Safe Security's report describing observed exploitation of the REDCap flaw to deploy XMRig cryptocurrency-mining software.","category":"research","primary":false},{"title":"Agentic Threat Activity Crosses a Significant Threshold","url":"https://cloud.google.com/blog/topics/threat-intelligence/agentic-threat-activity-crosses-a-significant-threshold","publisher":"google-threat-intelligence-group","context":"The article cites Google's threat intelligence report on actors exploiting the LiteLLM flaw to escalate inference keys into administrator credentials in LLMjacking activity.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added four actively exploited vulnerabilities affecting Synology DiskStation Manager, BerriAI LiteLLM, Apache Axis, and Vanderbilt University REDCap to its Known Exploited Vulnerabilities catalog. The flaws include three remote code execution issues with CVSS scores of 9.8 and a LiteLLM issue rated 8.8 that can enable code execution through a guardrails testing endpoint. CISA said the REDCap flaw can be triggered through crafted HTTP requests in a public survey context when an attacker knows a valid survey hash.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Axis flaw has reportedly been used alongside N-able N-central vulnerabilities to install cryptocurrency miners, but Axis 1.x is end-of-life and has no official patch. Separately, Safe Security observed REDCap exploitation that deployed a temporary web shell, loaded XMRig disguised as image files, and established persistence through cron and an added SSH key. The LiteLLM flaw has been used in LLMjacking activity to turn limited-access inference keys into administrator credentials, while the Synology DSM flaw has been linked to C3RB3R ransomware attacks on network-attached storage devices.\u003c/p\u003e\n"},{"n":7,"title":"Ruby2Shell: critical Ruby RCE, affected versions and how to fix it (GHSA-34m4-m9fh-gqp5)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/ruby2shell","time":"09:42","priority":"MUST READ","score":93,"tldr":"Ruby2Shell (GHSA-34m4-m9fh-gqp5) is a critical Ruby heap-overflow flaw that can enable unauthenticated remote code execution in Rails and classic Sinatra applications handling legacy-encoded untrusted strings. Upgrade to Ruby 3.3.14, 3.4.13, or 4.0.10 immediately; Ruby 3.2 and earlier are unsupported and require migration.","briefOverview":"\u003cp\u003eRuby2Shell, tracked as GHSA-34m4-m9fh-gqp5, is a critical Ruby flaw that can allow an unauthenticated attacker to run code on a server. It is a one-byte heap overflow in Ruby’s string case-conversion handling for certain legacy single-byte encodings, including ISO-8859-1. UTF-8 strings are not affected, but Rails and classic-style Sinatra applications are exposed by default because they can change the case of untrusted strings in ISO-8859-x or Windows-125x encodings.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include Ruby 2.4.0 through 3.3.13, Ruby 3.4.0 through 3.4.12, and Ruby 4.0.0 through 4.0.9. Ruby fixed the issue in versions 3.3.14, 3.4.13, and 4.0.10; Ruby 3.2 and older are end of life and have no fix. The article says that GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot still bundled affected Ruby versions as of November 19, 2026, and recommends restricting access to such self-hosted servers until vendors release fixes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ruby2Shell, tracked as GHSA-34m4-m9fh-gqp5, is a critical one-byte heap overflow in Ruby’s handling of string case changes in legacy single-byte encodings such as ISO-8859-1.","The article states that Ruby 2.4.0 through 3.3.13, Ruby 3.4.0 through 3.4.12, and Ruby 4.0.0 through 4.0.9 are affected, while UTF-8 strings are not affected.","Rails and classic-style Sinatra applications are exposed by default because they can change the case of untrusted strings in ISO-8859-x or Windows-125x encodings.","Ruby fixed the flaw in versions 3.3.14, 3.4.13, and 4.0.10, while Ruby 3.2 and older are end of life and have no fix.","As of November 19, 2026, the article says GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot releases still bundle affected Ruby versions."],"insights":["The flaw is limited to legacy single-byte character encodings, so UTF-8 strings are not affected, but Rails and classic Sinatra can still be exposed under their default setups.","Ruby lists no workaround, meaning remediation requires upgrading to a fixed Ruby release or, for unsupported Ruby 3.2 and older, moving to a supported release series.","Even organizations that do not manage Ruby directly may be exposed because several self-hosted products bundle vulnerable Ruby versions; the article recommends making those servers private behind a VPN or IP allowlist until vendor fixes are available.","Although no attacks had been reported when the article was published, Ruby maintainers knew of proof-of-concept exploits and the researchers planned to publish theirs in about a week."],"referencedReports":[],"body":"\u003cp\u003eRuby2Shell, tracked as GHSA-34m4-m9fh-gqp5, is a critical Ruby flaw that can allow an unauthenticated attacker to run code on a server. It is a one-byte heap overflow in Ruby’s string case-conversion handling for certain legacy single-byte encodings, including ISO-8859-1. UTF-8 strings are not affected, but Rails and classic-style Sinatra applications are exposed by default because they can change the case of untrusted strings in ISO-8859-x or Windows-125x encodings.\u003c/p\u003e\n\n\u003cp\u003eAffected releases include Ruby 2.4.0 through 3.3.13, Ruby 3.4.0 through 3.4.12, and Ruby 4.0.0 through 4.0.9. Ruby fixed the issue in versions 3.3.14, 3.4.13, and 4.0.10; Ruby 3.2 and older are end of life and have no fix. The article says that GitLab, GitHub Enterprise Server, Mastodon, OpenProject, Discourse, and Chatwoot still bundled affected Ruby versions as of November 19, 2026, and recommends restricting access to such self-hosted servers until vendors release fixes.\u003c/p\u003e\n"},{"n":3,"title":"Ruby Releases Fixes for 7 Regex and String Flaws, Warns 5 Have Proof-of-Concept RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/ruby-releases-fixes-for-7-regex-and.html","time":"08:42","priority":"SHOULD READ","score":89,"tldr":"Ruby has patched seven memory-safety flaws in its regex engine and string case-conversion code, five of which have proof-of-concept remote code execution exploits. Organizations should upgrade to Ruby 4.0.10, 3.4.13, or 3.3.14 and rebuild or restart affected deployments, as older Ruby versions will not be fixed.","briefOverview":"\u003cp\u003eRuby released versions 4.0.10, 3.4.13, and 3.3.14 to fix seven memory-safety flaws in its regular-expression engine and string case-conversion code. The maintainers said proof-of-concept exploits show that five of the flaws can be used to trigger remote code execution with crafted input, though no attacks have been reported. The issues include heap overflows, a double free, and out-of-bounds reads; the remaining flaws may cause attacker-controlled memory corruption, memory disclosure, or program crashes.\u003c/p\u003e\n\n\u003cp\u003eAn application\u0026rsquo;s exposure depends on whether an attacker can control regular-expression patterns or strings processed by vulnerable Ruby code. Most regex issues require an application to build and compile or execute a regex from attacker-controlled input, while one moderate issue can be triggered by a crafted subject string against a fixed pattern using a case-insensitive backreference. Ruby 3.2 and earlier are end of life and will not receive fixes, and updating gems or frameworks alone does not replace the vulnerable Ruby interpreter running on servers, workers, or container images.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ruby released versions 4.0.10, 3.4.13, and 3.3.14 to address seven memory-safety flaws in its regular-expression engine and string case-conversion code.","Ruby maintainers said proof-of-concept exploits demonstrate that five of the flaws can be used to trigger remote code execution with crafted input.","The affected flaws include heap overflows, a double free, and out-of-bounds reads, with the remaining two issues potentially causing memory disclosure, crashes, or attacker-controlled memory corruption.","Applications are exposed when attackers can influence regular-expression patterns or strings processed by vulnerable Ruby code, although one flaw can be triggered by a crafted subject string against a fixed case-insensitive backreference pattern.","Ruby 3.2 and earlier versions are end of life and will not receive fixes, while updating gems or frameworks alone does not replace a vulnerable Ruby interpreter."],"insights":["Updating application gems or frameworks will not remove the risk; the Ruby interpreter running on servers, background workers, and container images must be upgraded and then restarted or rebuilt.","Most regex-related flaws require an attacker to control a pattern that the application compiles or runs, but the moderate backreference flaw can be triggered by a crafted input string even when the application uses a fixed pattern.","The flaws cannot yet be tracked by CVE number, so organizations must use the GitHub advisory identifiers in scanners and software inventories until CVEs are assigned.","Ruby 3.2 and older releases are end of life and will not receive fixes, making migration to a supported Ruby release necessary rather than waiting for a patch."],"referencedReports":[{"title":"Multiple Vulnerabilities in Regexp and String","url":"https://www.ruby-lang.org/en/news/2026/11/18/multiple-vulnerabilities-in-regexp-and-string/","publisher":"ruby-project","context":"The article cites Ruby's security announcement as the source outlining the seven flaws and fixed releases.","category":"advisory","primary":true},{"title":"GHSA-34m4-m9fh-gqp5","url":"https://github.com/ruby/ruby/security/advisories/GHSA-34m4-m9fh-gqp5","publisher":"ruby-project","context":"This advisory describes a one-byte heap overflow during string case conversion in certain single-byte encodings and notes a remote-code-execution proof of concept.","category":"advisory","primary":true},{"title":"GHSA-7x2q-68qv-6p8x","url":"https://github.com/ruby/ruby/security/advisories/GHSA-7x2q-68qv-6p8x","publisher":"ruby-project","context":"This advisory covers a double-free condition when compiling crafted regular expressions using character-class intersections.","category":"advisory","primary":true},{"title":"GHSA-3p8q-wmhx-vm2w","url":"https://github.com/ruby/ruby/security/advisories/GHSA-3p8q-wmhx-vm2w","publisher":"ruby-project","context":"This advisory details a heap overflow caused by compiled regular-expression size overflow during compilation.","category":"advisory","primary":true},{"title":"GHSA-87fm-7w84-j2px","url":"https://github.com/ruby/ruby/security/advisories/GHSA-87fm-7w84-j2px","publisher":"ruby-project","context":"This advisory addresses a heap overflow when string case conversion produces output larger than 4 GiB.","category":"advisory","primary":true},{"title":"GHSA-7whj-cfh7-xgm4","url":"https://github.com/ruby/ruby/security/advisories/GHSA-7whj-cfh7-xgm4","publisher":"ruby-project","context":"This advisory covers a heap overflow when Ruby converts a crafted compiled regular expression back to text using Regexp#to_s.","category":"advisory","primary":true},{"title":"GHSA-wpqw-5qxg-m68r","url":"https://github.com/ruby/ruby/security/advisories/GHSA-wpqw-5qxg-m68r","publisher":"ruby-project","context":"This advisory describes an out-of-bounds read during case-insensitive matching that has proof-of-concept attacker-controlled memory corruption.","category":"advisory","primary":true},{"title":"GHSA-pvgc-g7gj-pv6h","url":"https://github.com/ruby/ruby/security/advisories/GHSA-pvgc-g7gj-pv6h","publisher":"ruby-project","context":"This advisory describes an out-of-bounds read when a case-insensitive backreference is matched against a crafted subject string.","category":"advisory","primary":true}],"body":"\u003cp\u003eRuby released versions 4.0.10, 3.4.13, and 3.3.14 to fix seven memory-safety flaws in its regular-expression engine and string case-conversion code. The maintainers said proof-of-concept exploits show that five of the flaws can be used to trigger remote code execution with crafted input, though no attacks have been reported. The issues include heap overflows, a double free, and out-of-bounds reads; the remaining flaws may cause attacker-controlled memory corruption, memory disclosure, or program crashes.\u003c/p\u003e\n\n\u003cp\u003eAn application\u0026rsquo;s exposure depends on whether an attacker can control regular-expression patterns or strings processed by vulnerable Ruby code. Most regex issues require an application to build and compile or execute a regex from attacker-controlled input, while one moderate issue can be triggered by a crafted subject string against a fixed pattern using a case-insensitive backreference. Ruby 3.2 and earlier are end of life and will not receive fixes, and updating gems or frameworks alone does not replace the vulnerable Ruby interpreter running on servers, workers, or container images.\u003c/p\u003e\n"},{"n":5,"title":"Researcher Demonstrates Database RCE Exploits Affecting PostgreSQL, MySQL and Oracle","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/researcher-demonstrates-database-rce.html","time":"08:14","priority":"SHOULD READ","score":84,"tldr":"Researcher Zheng Yu demonstrated that low-privilege database users can potentially achieve server-side code execution through memory-safety flaws in PostgreSQL, MySQL, ClickHouse, and Oracle. Organizations should promptly apply available patches and restrict unnecessary TEMPORARY and temporary-table creation privileges.","briefOverview":"\u003cp\u003eDepthfirst researcher Zheng Yu published proof-of-concept exploits showing that low-privilege database accounts can potentially run code on the servers hosting PostgreSQL, MySQL, and ClickHouse. The research also describes an Oracle chain that reportedly reaches command execution through an exposed web endpoint without requiring a login. The article states that none of the chains has been observed in real-world attacks and that the full attack chains were not independently reproduced.\u003c/p\u003e\n\n\u003cp\u003eThe work highlights that database permissions limiting access to application tables do not necessarily prevent the database engine from processing malicious input through memory-unsafe code. PostgreSQL\u0026rsquo;s default TEMPORARY privilege and temporary-table creation rights in MySQL and ClickHouse can provide sufficient access to reach some of the reported flaws. PostgreSQL, MySQL, and Oracle have issued fixes for the listed CVEs, while the ClickHouse issue has no assigned CVE or confirmed fixed version; the article advises applying updates and removing unnecessary temporary-object privileges.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Depthfirst researcher Zheng Yu published proof-of-concept exploits showing that low-privilege database accounts can potentially run code on database servers through memory-corruption flaws in PostgreSQL, MySQL, and ClickHouse, along with an Oracle chain that reportedly requires no login.","PostgreSQL fixed CVE-2026-116331, which can allow accounts able to create database objects to run code as the operating-system user running the database.","MySQL fixed CVE-2026-101786 in Server and Cluster versions 26.7.0 through 26.7.1, and the researcher reported code execution with an account limited to creating temporary tables.","Oracle patched Oracle Text CVE-2026-114819 and Oracle REST Data Services CVE-2026-91609, which the researcher chained through an exposed web endpoint before login.","The ClickHouse issue has no assigned CVE or confirmed fixed version, and the article recommends that operators check with the vendor for a fix."],"insights":["Database permissions that prevent access to application tables may still not prevent server compromise, because ordinary SQL can reach memory-unsafe code used to process queries and database objects.","PostgreSQL's default TEMPORARY privilege, and temporary-table creation rights in MySQL and ClickHouse, can provide enough access to trigger flaws without reading existing application data.","Oracle rated the MySQL issue as requiring high privileges, but the researcher reported code execution using an account that could only create temporary tables.","The two Oracle flaws were each rated as not exploitable without a login on their own, yet the researcher reported that chaining them through an exposed web endpoint enabled command execution before authentication.","The ClickHouse issue can reportedly be reached by setting format_binary_max_string_size to zero, but it has neither an assigned CVE nor a confirmed fixed version."],"referencedReports":[{"title":"CVE-2026-116331","url":"https://www.postgresql.org/support/security/CVE-2026-116331/","publisher":"postgresql-global-development-group","context":"The article cites this PostgreSQL security advisory as the notice for the fix released for the reported code-execution flaw.","category":"advisory","primary":false},{"title":"Narrow Grants, Wide Engines","url":"https://depthfirst.com/research/narrow-grants-wide-engines","publisher":"depthfirst","context":"The article cites Zheng Yu's technical analysis describing the proof-of-concept database exploitation chains.","category":"research","primary":true},{"title":"MySQL October 2026 Security Advisory","url":"https://dev.mysql.com/community/security/advisories/2026-10-20/","publisher":"oracle","context":"The article cites Oracle's MySQL advisory for its severity assessment and fix for CVE-2026-101786.","category":"advisory","primary":false},{"title":"Oracle November 2026 Critical Patch Update","url":"https://www.oracle.com/security-alerts/cspunov2026.html","publisher":"oracle","context":"The article cites Oracle's November update as the patch source for the Oracle Text flaw CVE-2026-114819.","category":"advisory","primary":false},{"title":"Oracle October 2026 Critical Patch Update","url":"https://www.oracle.com/security-alerts/cpuoct2026.html","publisher":"oracle","context":"The article cites Oracle's October update as the patch source for the Oracle REST Data Services GraphQL flaw CVE-2026-91609.","category":"advisory","primary":false}],"body":"\u003cp\u003eDepthfirst researcher Zheng Yu published proof-of-concept exploits showing that low-privilege database accounts can potentially run code on the servers hosting PostgreSQL, MySQL, and ClickHouse. The research also describes an Oracle chain that reportedly reaches command execution through an exposed web endpoint without requiring a login. The article states that none of the chains has been observed in real-world attacks and that the full attack chains were not independently reproduced.\u003c/p\u003e\n\n\u003cp\u003eThe work highlights that database permissions limiting access to application tables do not necessarily prevent the database engine from processing malicious input through memory-unsafe code. PostgreSQL\u0026rsquo;s default TEMPORARY privilege and temporary-table creation rights in MySQL and ClickHouse can provide sufficient access to reach some of the reported flaws. PostgreSQL, MySQL, and Oracle have issued fixes for the listed CVEs, while the ClickHouse issue has no assigned CVE or confirmed fixed version; the article advises applying updates and removing unnecessary temporary-object privileges.\u003c/p\u003e\n"},{"n":6,"title":"Hackers Breach N-able Cloud Server, Disrupting Email Security Management Across 3 Regions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/n-able-confirms-hackers-accessed-cloud.html","time":"09:31","priority":"SHOULD READ","score":83,"tldr":"N-able says unauthorized actors accessed a server supporting its Mail Assure and SpamExperts Hosted Cloud services, taking management portals, APIs, quarantine, and logging offline across the Americas, APAC, and Europe. Core email filtering remains operational, and the company says it currently has no evidence of customer-data or mailbox access.","briefOverview":"\u003cp\u003eN-able disclosed that unknown threat actors gained unauthorized access to a server in its Mail Assure and SpamExperts Hosted Cloud environment. The company disabled management interfaces and APIs while investigating and mitigating the incident. It said it currently has no evidence that customer data was compromised, including access to tenants’ mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe disruption affects Mail Assure and SpamExperts services across the Americas, Asia-Pacific, and Europe. Core mail flow and inbound and outbound email filtering remain available, but the management portal, APIs, quarantine, and logging are offline while N-able restores them securely. N-able initially linked the November 16, 2026 disruption to configuration and service dependencies, but later determined it was caused by a security incident; it said the event is unrelated to the Able2Shell, 4EverAble2Shell, and Agent2Shell issues affecting N-central.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able said unknown threat actors gained unauthorized access to a server supporting its Mail Assure and SpamExperts Hosted Cloud services.","The incident affected Mail Assure and SpamExperts Hosted Cloud management services in the Americas, Asia-Pacific, and Europe.","N-able disabled management interfaces and APIs, while the management portal, APIs, quarantine, and logging remained offline during secure restoration work.","Core mail flow and inbound and outbound email filtering remained available.","N-able said it had no evidence at the time that customer data, including tenant mailbox access, had been compromised."],"insights":["N-able initially attributed the disruption to platform configuration and service dependencies, but later determined it was caused by a security incident involving unauthorized server access.","The incident disrupted administrative and investigative capabilities such as the management portal, APIs, quarantine access, and logging, even though core mail delivery and filtering continued to operate.","N-able said it contacted affected Mail Assure and SpamExperts partners directly to indicate whether action was required for their specific environments.","The company stated that this incident is unrelated to the Able2Shell, 4EverAble2Shell, and Agent2Shell issues affecting N-central."],"referencedReports":[],"body":"\u003cp\u003eN-able disclosed that unknown threat actors gained unauthorized access to a server in its Mail Assure and SpamExperts Hosted Cloud environment. The company disabled management interfaces and APIs while investigating and mitigating the incident. It said it currently has no evidence that customer data was compromised, including access to tenants’ mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe disruption affects Mail Assure and SpamExperts services across the Americas, Asia-Pacific, and Europe. Core mail flow and inbound and outbound email filtering remain available, but the management portal, APIs, quarantine, and logging are offline while N-able restores them securely. N-able initially linked the November 16, 2026 disruption to configuration and service dependencies, but later determined it was caused by a security incident; it said the event is unrelated to the Able2Shell, 4EverAble2Shell, and Agent2Shell issues affecting N-central.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft confirms app installation, launch issues after hotpatch","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-confirms-app-installation-launch-issues-after-hotpatch/","time":"10:35","priority":"SHOULD READ","score":78,"tldr":"Microsoft confirmed that Windows 11 24H2 and later systems using the November 2026 hotpatch update through Windows Autopatch may fail to install, launch, or run some applications due to msi.dll errors. Until a permanent fix is released, administrators can mitigate the issue by increasing the HotPatchTableSize registry value to 2000 and restarting affected devices.","briefOverview":"\u003cp\u003eMicrosoft confirmed that some Office and third-party applications may fail to install, launch, or run after the November 2026 Windows 11 hotpatch update. The issue affects Windows 11 24H2 and later devices receiving hotpatches through Windows Autopatch, rather than systems that installed the standard November 2026 Patch Tuesday security updates. Affected applications may show an \u003ccode\u003eERROR_ALLOTTED_SPACE_EXCEEDED (0xC0000099)\u003c/code\u003e error.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s investigation indicates the problem involves applications that load the 32-bit Windows Installer library, \u003ccode\u003emsi.dll\u003c/code\u003e. It occurs more frequently with 32-bit applications, although certain 64-bit applications can also be affected. Until Microsoft releases a fix, it advises administrators to back up the Windows Registry, change the \u003ccode\u003eHotPatchTableSize\u003c/code\u003e value to \u003ccode\u003e2000\u003c/code\u003e, and restart affected devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that the November 2026 Windows 11 hotpatch update can cause some Office and third-party applications to fail during installation, launch, or normal use.","The issue affects Windows 11 24H2 and later devices that received hotpatch updates through Windows Autopatch, not devices that installed the standard November 2026 Patch Tuesday security updates.","Affected applications may display an ERROR_ALLOTTED_SPACE_EXCEEDED (0xC0000099) error, and Microsoft says the issue appears related to applications loading the 32-bit Windows Installer library, msi.dll.","Microsoft’s temporary workaround is to set the HotPatchTableSize registry value to 2000 and restart the affected device.","Microsoft said it is investigating the issue and has not yet announced a permanent fix."],"insights":["The problem is limited to hotpatch updates delivered through Windows Autopatch, so systems using the standard November 2026 Patch Tuesday updates are not expected to be affected.","Although the issue occurs more often with 32-bit applications that load the Windows Installer file msi.dll, Microsoft says certain 64-bit applications can also be affected.","Microsoft’s interim mitigation is a registry change that increases HotPatchTableSize to 2000, followed by a device restart; it advises backing up the registry before making the change."],"referencedReports":[{"title":"Microsoft Windows Release Health service alert (WI1559710)","url":"https://admin.cloud.microsoft/Adminportal/Home?source=applauncher#/windowsreleasehealth/:/issue/WI1559710","publisher":"microsoft","context":"The article cites this Microsoft service alert as the source confirming application installation, launch, and runtime errors after the November 2026 Windows 11 hotpatch update.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft confirmed that some Office and third-party applications may fail to install, launch, or run after the November 2026 Windows 11 hotpatch update. The issue affects Windows 11 24H2 and later devices receiving hotpatches through Windows Autopatch, rather than systems that installed the standard November 2026 Patch Tuesday security updates. Affected applications may show an \u003ccode\u003eERROR_ALLOTTED_SPACE_EXCEEDED (0xC0000099)\u003c/code\u003e error.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s investigation indicates the problem involves applications that load the 32-bit Windows Installer library, \u003ccode\u003emsi.dll\u003c/code\u003e. It occurs more frequently with 32-bit applications, although certain 64-bit applications can also be affected. Until Microsoft releases a fix, it advises administrators to back up the Windows Registry, change the \u003ccode\u003eHotPatchTableSize\u003c/code\u003e value to \u003ccode\u003e2000\u003c/code\u003e, and restart affected devices.\u003c/p\u003e\n"},{"n":2,"title":"NVIDIA investigating Gentlemen ransomware breach claims","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/nvidia-investigating-gentlemen-ransomware-breach-claims/","time":"09:23","priority":"SHOULD READ","score":78,"tldr":"NVIDIA is investigating claims by the Gentlemen ransomware group that it breached the company, but says it has found no evidence that NVIDIA systems or networks were compromised. The company believes the incident may instead involve a third-party partner, while the group has not published proof of its claims.","briefOverview":"\u003cp\u003eThe Gentlemen ransomware group has listed NVIDIA on its dark web leak site and threatened to release data, with a countdown ending on November 28. The group has not provided proof that it breached NVIDIA. NVIDIA said it is investigating the claim and an incident that may have affected a third-party partner.\u003c/p\u003e\n\n\u003cp\u003eNVIDIA said it has found no indication that its systems or networks were affected and is continuing to monitor the situation. The Gentlemen uses a double-extortion approach, stealing sensitive data before encrypting systems and threatening to publish the data. Since emerging, the group has claimed more than 1,100 victims across sectors including manufacturing, healthcare, transportation, energy, education, and financial services.\u003c/p\u003e\n\n\u003cp\u003eNVIDIA previously confirmed that a May breach at a regional GeForce NOW Alliance partner exposed some Armenian users\u0026rsquo; information, while stating that its network and NVIDIA-operated services were not affected. It also disclosed a March 2022 breach claimed by Lapsus$ that affected more than 71,000 employees after attackers accessed NVIDIA\u0026rsquo;s network. The Gentlemen initially operated as a closed group before moving to a ransomware-as-a-service model that offers affiliates up to 90% of ransom proceeds.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Gentlemen ransomware group added NVIDIA to its dark web leak site and threatened to release data, but it has not provided proof of a breach.","NVIDIA said it found no indication that its systems or networks were affected and is investigating an incident that may have involved a third-party partner.","The group's leak-site countdown was set to end in nine days, on November 28.","NVIDIA confirmed a separate breach affecting some Armenian GeForce NOW users in May and disclosed a 2022 breach that affected more than 71,000 employees.","The Gentlemen operates by stealing data before encrypting victims' systems and has claimed more than 1,100 victims since emerging."],"insights":["NVIDIA’s statement separates its own systems from a potentially affected third-party partner, meaning the ransomware group’s listing does not by itself establish that NVIDIA’s network was compromised.","The Gentlemen uses a data-release deadline as leverage even though it had not published evidence supporting its claim against NVIDIA.","The group’s affiliate model offers up to 90% of ransom proceeds, above the 70%–80% range cited for other ransomware groups, which may help explain its scale of more than 1,100 claimed victims.","NVIDIA’s prior confirmed incidents were also described as limited in scope: a regional GeForce NOW partner breach affecting Armenian users and a separate 2022 employee breach."],"referencedReports":[{"title":"Unmasking the Gentlemen Ransomware","url":"https://www.trendmicro.com/en_us/research/25/i/unmasking-the-gentlemen-ransomware.html","publisher":"trend-micro","context":"The article links to Trend Micro research when noting that The Gentlemen surfaced last year as a closed ransomware group before adopting a ransomware-as-a-service model.","category":"research","primary":false}],"body":"\u003cp\u003eThe Gentlemen ransomware group has listed NVIDIA on its dark web leak site and threatened to release data, with a countdown ending on November 28. The group has not provided proof that it breached NVIDIA. NVIDIA said it is investigating the claim and an incident that may have affected a third-party partner.\u003c/p\u003e\n\n\u003cp\u003eNVIDIA said it has found no indication that its systems or networks were affected and is continuing to monitor the situation. The Gentlemen uses a double-extortion approach, stealing sensitive data before encrypting systems and threatening to publish the data. Since emerging, the group has claimed more than 1,100 victims across sectors including manufacturing, healthcare, transportation, energy, education, and financial services.\u003c/p\u003e\n\n\u003cp\u003eNVIDIA previously confirmed that a May breach at a regional GeForce NOW Alliance partner exposed some Armenian users\u0026rsquo; information, while stating that its network and NVIDIA-operated services were not affected. It also disclosed a March 2022 breach claimed by Lapsus$ that affected more than 71,000 employees after attackers accessed NVIDIA\u0026rsquo;s network. The Gentlemen initially operated as a closed group before moving to a ransomware-as-a-service model that offers affiliates up to 90% of ransom proceeds.\u003c/p\u003e\n"},{"n":8,"title":"Health-ISAC Daily Cyber Headlines – November 19, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-19-2026/","time":"09:58","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s daily briefing highlights urgent risks for healthcare defenders, including actively exploited Apache Roller and NGINX flaws, upcoming critical PHP patches, a potential Colla Health patient-data exposure, and ransomware arrests.","briefOverview":"\u003cp\u003eHealth-ISAC’s November 19, 2026 Daily Cyber Headlines compiles cyber developments relevant to the health sector. The briefing covers suspected ransomware gang members arrested by Ukrainian police and the FBI in connection with $40.5 million in ransoms. It also includes Colla Health’s notice of potential patient-data exposure after unauthorized access to its Metabase application.\u003c/p\u003e\n\n\u003cp\u003eThe roundup highlights a reported Apache Roller remote-code-execution issue being exploited in attacks, upcoming critical PHP security updates for all supported versions, and NGINX HTTP/2 flaws that could allow unauthenticated remote code execution. It also references Microsoft’s Windows Server 2028 security protections enabled by default. In addition, the briefing notes that regulators are seeking feedback on risks associated with autonomous and remotely operated medical devices.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 19, 2026 daily briefing covers upcoming critical PHP security updates affecting all supported versions.","The briefing includes a report that Colla Health identified potential patient-data exposure following unauthorized access to its Metabase application.","The article highlights arrests by Ukrainian police and the FBI of suspected ransomware gang members tied to $40.5 million in ransom payments.","The briefing covers an Apache Roller remote-code-execution flaw that Apache says has been exploited in attacks.","The article also addresses FDA requests for feedback on risks associated with autonomous and remotely operated medical devices."],"insights":["The briefing spans both traditional IT systems, including PHP, Apache Roller, NGINX, and Windows Server, and healthcare-specific concerns such as patient data and remotely operated medical devices.","Several items have immediate operational relevance because they involve reported exploitation, critical updates affecting all supported PHP versions, or unauthorized access to an application holding patient-related data.","The inclusion of ransomware arrests alongside software flaws and regulatory feedback shows the briefing tracks both active criminal activity and emerging technology risks relevant to the health sector."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s November 19, 2026 Daily Cyber Headlines compiles cyber developments relevant to the health sector. The briefing covers suspected ransomware gang members arrested by Ukrainian police and the FBI in connection with $40.5 million in ransoms. It also includes Colla Health’s notice of potential patient-data exposure after unauthorized access to its Metabase application.\u003c/p\u003e\n\n\u003cp\u003eThe roundup highlights a reported Apache Roller remote-code-execution issue being exploited in attacks, upcoming critical PHP security updates for all supported versions, and NGINX HTTP/2 flaws that could allow unauthenticated remote code execution. It also references Microsoft’s Windows Server 2028 security protections enabled by default. In addition, the briefing notes that regulators are seeking feedback on risks associated with autonomous and remotely operated medical devices.\u003c/p\u003e\n"}]</script>
