<script type="application/json" id="dl-articles">[{"n":8,"title":"Researchers Show a Single Malicious Webpage Visit Can Compromise Tor Browser","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/researchers-show-single-malicious.html","time":"11:57","priority":"SHOULD READ","score":88,"tldr":"Nebula Security disclosed a patched Firefox JIT flaw, CVE-2026-10702, that could let a malicious webpage execute code in the browser renderer and also affected Tor Browser versions based on vulnerable Firefox releases. Users should update Firefox and Tor Browser, while noting the related Android root chain also relies on a separate Linux kernel futex bug.","briefOverview":"\u003cp\u003eNebula Security says CVE-2026-10702, a patched Firefox JIT flaw, could be triggered simply by visiting a malicious webpage. The bug provides arbitrary code execution inside the browser\u0026rsquo;s renderer process, and Mozilla rated it High and fixed it in Firefox 151.0.3. Nebula said every Tor Browser release that incorporated a vulnerable Firefox version was affected, although the exact Tor releases have not been identified.\u003c/p\u003e\n\n\u003cp\u003eThe Hacker News traced the faulty alias declaration to Mozilla Bug 1995077, which landed for Firefox 147, placing the affected stable-release range at Firefox 147 through 151.0.2. Mozilla\u0026rsquo;s advisory does not list Firefox ESR, and the faulty override is absent from Firefox ESR 140.12. As of July 28, 2026, the available primary-source record does not establish exploitation against users in the wild.\u003c/p\u003e\n\n\u003cp\u003eNebula used the flaw as the first stage of IonStack, a browser-to-kernel chain built for an ARM64 device running Android 17. The issue involved Firefox treating an operation as a read even though resolving a lazy property could replace and free a dynamic-slots buffer, allowing optimization logic to reuse a stale pointer. IonStack\u0026rsquo;s second stage is CVE-2026-43499, a separate Linux kernel futex flaw called GhostLock, and updating Firefox blocks the documented browser entry point but does not patch GhostLock itself.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nebula Security said CVE-2026-10702 is a Firefox JIT flaw that can be triggered by simply visiting a malicious webpage and provides arbitrary code execution inside the browser's renderer process.","Mozilla rated CVE-2026-10702 High and fixed it in the Firefox 151.0.3 update, with the affected stable-release range traced to Firefox 147 through 151.0.2.","Nebula Security said every Tor Browser release that incorporated a vulnerable Firefox version was affected, although researchers have not identified the exact Tor releases.","Nebula used CVE-2026-10702 as the first stage of IonStack, a browser-to-kernel chain built for an ARM64 device running Android 17.","IonStack's second stage is CVE-2026-43499, a separate Linux kernel futex flaw called GhostLock that carries the compromise to root on the supported Android build."],"insights":["Firefox ESR is not listed in Mozilla's advisory, and the faulty override is absent from Firefox ESR 140.12, so the available source record in the article points to stable Firefox releases rather than ESR.","The public end-to-end exploit code targets one supported ARM64 Android 17 build, but Nebula said the browser flaw itself is not ARM-specific and described the x86 path as more stable.","Updating Firefox blocks the documented browser entry point, but it does not patch the separate GhostLock Linux kernel flaw used later in the IonStack chain.","The article says the available primary-source record as of July 28, 2026, does not establish exploitation against users in the wild."],"referencedReports":[{"title":"Mozilla Foundation Security Advisory 2026-54","url":"https://www.mozilla.org/en-US/security/advisories/mfsa2026-54/","publisher":"Mozilla","context":"The article cites Mozilla's advisory as the source for the High severity rating and the Firefox 151.0.3 fix for CVE-2026-10702.","category":"advisory","primary":true},{"title":"IonStack Part 1: CVE-2026-10702","url":"https://nebusec.ai/research/ionstack-part-1-cve-2026-10702/","publisher":"Nebula Security","context":"The article references Nebula Security's technical analysis explaining the Firefox JIT issue and how the exploit achieves arbitrary memory read and write.","category":"research","primary":true}],"body":"\u003cp\u003eNebula Security says CVE-2026-10702, a patched Firefox JIT flaw, could be triggered simply by visiting a malicious webpage. The bug provides arbitrary code execution inside the browser\u0026rsquo;s renderer process, and Mozilla rated it High and fixed it in Firefox 151.0.3. Nebula said every Tor Browser release that incorporated a vulnerable Firefox version was affected, although the exact Tor releases have not been identified.\u003c/p\u003e\n\n\u003cp\u003eThe Hacker News traced the faulty alias declaration to Mozilla Bug 1995077, which landed for Firefox 147, placing the affected stable-release range at Firefox 147 through 151.0.2. Mozilla\u0026rsquo;s advisory does not list Firefox ESR, and the faulty override is absent from Firefox ESR 140.12. As of July 28, 2026, the available primary-source record does not establish exploitation against users in the wild.\u003c/p\u003e\n\n\u003cp\u003eNebula used the flaw as the first stage of IonStack, a browser-to-kernel chain built for an ARM64 device running Android 17. The issue involved Firefox treating an operation as a read even though resolving a lazy property could replace and free a dynamic-slots buffer, allowing optimization logic to reuse a stale pointer. IonStack\u0026rsquo;s second stage is CVE-2026-43499, a separate Linux kernel futex flaw called GhostLock, and updating Firefox blocks the documented browser entry point but does not patch GhostLock itself.\u003c/p\u003e\n"},{"n":4,"title":"Cyberattack hits Angola’s largest telco hours before landmark stock debut","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/angola-unitel-cyberattack-outage","time":"12:15","priority":"SHOULD READ","score":82,"tldr":"Angola’s largest telecom operator, Unitel, suffered a cyberattack that knocked out voice, mobile data, internet, and payment services nationwide just hours before its landmark stock market debut. The IPO still proceeded, raising about $321 million, while evidence suggested the outage stemmed from internal core systems rather than an external connectivity failure.","briefOverview":"\u003cp\u003eAngola’s largest telecommunications operator, Unitel, said it was hit by a cyberattack in the early hours of Tuesday. The incident left millions of people nationwide without voice services, mobile data, and internet access. Unitel detected the incident shortly after 2 a.m. local time and said it activated response and containment mechanisms while technical and cybersecurity teams worked to restore services.\u003c/p\u003e\n\n\u003cp\u003eThe attack occurred less than 24 hours before Unitel’s landmark debut on Angola’s BODIVA securities exchange. The listing went ahead Wednesday and became the largest initial public offering in Angola’s capital market history, valuing the company at \u003cspan class=\"math inline\"\u003e\\(2.14 billion and raising around \\)\u003c/span\u003e321 million for the Angolan government’s 15% stake. The listing is part of President João Lourenço’s privatization program and was seen as a test of investor appetite for Angolan state assets.\u003c/p\u003e\n\n\u003cp\u003eRIPE NCC data reviewed by Recorded Future News showed Unitel’s IP prefixes remained announced to the global internet during the incident, while Cloudflare Radar showed Unitel traffic collapsing sharply and staying well below baseline into Wednesday. The article says this suggests the cause was not an upstream connectivity cut or volumetric DDoS attack, but instead an incident disabling core internal systems. The outage also disrupted point-of-sale payment terminals running on Unitel’s network, affecting business communications and digital services dependent on internet access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Angola’s largest telecommunications operator, Unitel, said it was hit by a cyberattack in the early hours of Tuesday that disrupted voice services, mobile data, and internet access for millions of people nationwide.","The attack occurred less than 24 hours before Unitel’s debut on Angola’s BODIVA securities exchange, the largest initial public offering in the country’s capital market history.","Unitel said it activated response and containment mechanisms and mobilized technical and cybersecurity teams, but it did not provide a restoration timeline or describe the nature of the attack.","RIPE NCC data showed Unitel’s IP prefixes remained announced during the incident, while Cloudflare Radar showed Unitel traffic collapsed sharply, suggesting the disruption was specific to Unitel and not caused by an upstream connectivity cut or volumetric DDoS attack.","Unitel’s stock listing proceeded despite the outage, valuing the company at $2.14 billion and raising around $321 million for the Angolan government’s 15% stake."],"insights":["The fact that Unitel’s IP prefixes stayed visible on the global internet while traffic collapsed points away from a broad external connectivity failure and toward a problem inside Unitel’s own core systems.","The disruption appears narrowly focused on Unitel because Cloudflare Radar showed no comparable degradation at other Angolan network operators during the same period.","The outage affected more than telecommunications, disrupting point-of-sale payment terminals and showing how dependent business payments and digital services are on Unitel’s network.","The IPO proceeded despite the ongoing outage and lack of public statements from BODIVA or Angola’s capital markets regulator, highlighting that the market debut was not delayed by the operational disruption."],"referencedReports":[],"body":"\u003cp\u003eAngola’s largest telecommunications operator, Unitel, said it was hit by a cyberattack in the early hours of Tuesday. The incident left millions of people nationwide without voice services, mobile data, and internet access. Unitel detected the incident shortly after 2 a.m. local time and said it activated response and containment mechanisms while technical and cybersecurity teams worked to restore services.\u003c/p\u003e\n\n\u003cp\u003eThe attack occurred less than 24 hours before Unitel’s landmark debut on Angola’s BODIVA securities exchange. The listing went ahead Wednesday and became the largest initial public offering in Angola’s capital market history, valuing the company at \u003cspan class=\"math inline\"\u003e\\(2.14 billion and raising around \\)\u003c/span\u003e321 million for the Angolan government’s 15% stake. The listing is part of President João Lourenço’s privatization program and was seen as a test of investor appetite for Angolan state assets.\u003c/p\u003e\n\n\u003cp\u003eRIPE NCC data reviewed by Recorded Future News showed Unitel’s IP prefixes remained announced to the global internet during the incident, while Cloudflare Radar showed Unitel traffic collapsing sharply and staying well below baseline into Wednesday. The article says this suggests the cause was not an upstream connectivity cut or volumetric DDoS attack, but instead an incident disabling core internal systems. The outage also disrupted point-of-sale payment terminals running on Unitel’s network, affecting business communications and digital services dependent on internet access.\u003c/p\u003e\n"},{"n":3,"title":"Russia accuses Telegram founder of aiding terrorism, seeks international arrest","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/russia-telegram-durov-arrest","time":"12:45","priority":"SHOULD READ","score":78,"tldr":"Russia has charged Telegram founder Pavel Durov with aiding terrorism and is seeking an international arrest warrant, alleging Telegram was used by Ukrainian intelligence to recruit Russians for sabotage and espionage. The claims are unverified, and the case escalates Russia’s long-running pressure campaign against Telegram over content control and cooperation with security services.","briefOverview":"\u003cp\u003eRussia is seeking to place Telegram founder Pavel Durov on an international wanted list after the Federal Security Service said it charged him with aiding terrorist activity. The FSB alleges Telegram failed to remove channels and bots used by Ukrainian intelligence, as well as terrorist and extremist groups. Recorded Future News said it could not independently verify the agency’s claims or the authenticity of videos released by Russian authorities.\u003c/p\u003e\n\n\u003cp\u003eThe FSB claimed Ukrainian intelligence used Telegram to recruit Russians, including teenagers, for sabotage missions through the Daivinchik dating bot. Russian authorities said 46 people aged 12 to 22 had been detained since last summer over the alleged recruitment campaign. Daivinchik runs within Telegram, has up to 16 million monthly users, and was added to Russia’s register of banned websites in December over content authorities classified as child pornography and “LGBT propaganda.”\u003c/p\u003e\n\n\u003cp\u003eThe case comes amid Russia’s long-running conflict with Telegram over content removal, user data localization, and cooperation with government demands. Telegram is reportedly inaccessible in Russia without a VPN or other circumvention tools, but Russian government institutions, including the Kremlin, still post updates on the platform daily. Durov also faces legal pressure in France, where authorities charged him over allegations that Telegram failed to adequately combat criminal activity and cooperate with law enforcement.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russia’s Federal Security Service said it charged Telegram founder Pavel Durov with aiding terrorist activity and is seeking to place him on an international wanted list.","The FSB alleged that Ukrainian intelligence used Telegram channels, bots, and the Daivinchik dating bot to recruit Russians, including teenagers, for sabotage missions inside Russia.","Russian authorities said 46 people aged 12 to 22 had been detained since last summer over the alleged recruitment campaign, but Recorded Future News could not independently verify the claims or the authenticity of released confession videos.","Telegram did not immediately issue a formal response, but its press service account on X posted an image of Durov raising his middle finger shortly after the FSB announcement.","The Russian case adds to Durov’s legal troubles abroad, including a French investigation into allegations that Telegram failed to adequately combat criminal activity and cooperate with law enforcement."],"insights":["Russian government institutions, including the Kremlin, continue to publish updates on Telegram daily even though the platform is reportedly inaccessible in Russia without a VPN or other circumvention tools.","Russia’s stated conditions for Telegram to keep operating legally include opening a local representative office, storing Russian users’ personal data inside Russia, and cooperating with Russian security services on terrorism investigations.","The Daivinchik bot is central to Russia’s allegations even though it had already been added to Russia’s banned websites register in December over content authorities classified as child pornography and “LGBT propaganda.”","Durov is facing legal pressure from both Russia and France, but the two cases frame Telegram’s obligations differently: Russia emphasizes alleged Ukrainian intelligence use and terrorism, while France focused on child sexual abuse material, drug trafficking, fraud, and organized crime."],"referencedReports":[],"body":"\u003cp\u003eRussia is seeking to place Telegram founder Pavel Durov on an international wanted list after the Federal Security Service said it charged him with aiding terrorist activity. The FSB alleges Telegram failed to remove channels and bots used by Ukrainian intelligence, as well as terrorist and extremist groups. Recorded Future News said it could not independently verify the agency’s claims or the authenticity of videos released by Russian authorities.\u003c/p\u003e\n\n\u003cp\u003eThe FSB claimed Ukrainian intelligence used Telegram to recruit Russians, including teenagers, for sabotage missions through the Daivinchik dating bot. Russian authorities said 46 people aged 12 to 22 had been detained since last summer over the alleged recruitment campaign. Daivinchik runs within Telegram, has up to 16 million monthly users, and was added to Russia’s register of banned websites in December over content authorities classified as child pornography and “LGBT propaganda.”\u003c/p\u003e\n\n\u003cp\u003eThe case comes amid Russia’s long-running conflict with Telegram over content removal, user data localization, and cooperation with government demands. Telegram is reportedly inaccessible in Russia without a VPN or other circumvention tools, but Russian government institutions, including the Kremlin, still post updates on the platform daily. Durov also faces legal pressure in France, where authorities charged him over allegations that Telegram failed to adequately combat criminal activity and cooperate with law enforcement.\u003c/p\u003e\n"},{"n":7,"title":"Russia Charges Telegram Founder Pavel Durov With Aiding Terrorist Activity","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/russia-charges-telegram-founder-pavel.html","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"Russia’s FSB charged Telegram founder Pavel Durov with aiding terrorist activity, accusing Telegram of failing to remove channels and bots allegedly used by Ukrainian services and extremist groups to coordinate sabotage, terrorism, and fraud in Russia. The charges come amid Russia’s escalating restrictions and near-blockade of Telegram.","briefOverview":"\u003cp\u003eRussia’s Federal Security Service said it charged Telegram founder Pavel Durov with aiding terrorist activity and failing to remove prohibited information under Russian law. The agency alleged that Telegram failed to remove channels, chats, and bots used by Ukrainian special services and terrorist or extremist organizations to plan sabotage, terrorism, mass killings, and cyber-fraud operations inside Russia. Durov has been charged under Article 205.1 of the Russian Criminal Code and placed on the international wanted list.\u003c/p\u003e\n\n\u003cp\u003eThe FSB said Ukrainian special services used a Telegram chatbot named “Daivinchik/Leo-Dating, Chatting, and New Friends” to recruit Russian citizens through deception and psychological manipulation. Russian authorities said 46 citizens aged 12 to 22 were detained between July 2025 and the present for alleged armed attacks on law enforcement officers, arson targeting infrastructure, and courier activity involving funds from defrauded citizens. The agency also claimed Ukrainian intelligence agents posed as young women, then later as Russian law enforcement or financial-monitoring officials, to pressure targets into carrying out attacks.\u003c/p\u003e\n\n\u003cp\u003eTelegram’s official account on X responded by posting a photo of Durov giving the middle finger, while Durov, who lives in Dubai, had not publicly commented on the development. The charges follow Russian restrictions on Telegram, including throttling at the start of the year and a near-complete blockade in April 2026. The article also notes that Durov was arrested and charged in France almost two years earlier for failing to tackle illicit activity on the messaging platform.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Russia’s Federal Security Service said it charged Telegram founder Pavel Durov with aiding terrorist activity and failing to remove prohibited information in violation of Russian law.","The FSB alleged Telegram failed to remove channels, chats, and bots used by Ukrainian special services and terrorist or extremist organizations to plan sabotage, terrorism, mass killings, and cyber-fraud operations in Russia.","The FSB said Ukrainian special services used the Telegram chatbot Daivinchik/Leo-Dating, Chatting, and New Friends to recruit Russian citizens for sabotage and terrorist activities through deception and psychological manipulation.","Russian authorities said 46 Russian citizens aged 12 to 22 were detained between July 2025 and the present for alleged armed attacks, arson, and courier activity tied to fraud proceeds and cryptocurrency exchange points.","The charges come after Russia introduced restrictions on Telegram, including throttling at the start of the year and a near-complete blockade in April 2026."],"insights":["The FSB’s allegations focus not only on public Telegram channels but also on chats, bots, and a dating chatbot, showing that Russia is treating multiple parts of Telegram’s ecosystem as potential tools for recruitment and coordination.","The alleged recruitment scheme combined romance-based deception, phishing links, fake law enforcement pressure, and threats of prosecution, according to the FSB, rather than relying on a single method of coercion.","The FSB said the detained suspects were between 12 and 22 years old, making minors and young adults a central part of the alleged recruitment activity described in the article.","Telegram’s public response, according to the article, was a provocative image posted on X rather than a detailed denial or policy explanation, while Durov himself had not publicly commented.","The criminal charges against Durov are occurring alongside Russia’s technical restrictions on Telegram, including throttling and a near-complete blockade, indicating parallel legal and access-control pressure on the platform."],"referencedReports":[],"body":"\u003cp\u003eRussia’s Federal Security Service said it charged Telegram founder Pavel Durov with aiding terrorist activity and failing to remove prohibited information under Russian law. The agency alleged that Telegram failed to remove channels, chats, and bots used by Ukrainian special services and terrorist or extremist organizations to plan sabotage, terrorism, mass killings, and cyber-fraud operations inside Russia. Durov has been charged under Article 205.1 of the Russian Criminal Code and placed on the international wanted list.\u003c/p\u003e\n\n\u003cp\u003eThe FSB said Ukrainian special services used a Telegram chatbot named “Daivinchik/Leo-Dating, Chatting, and New Friends” to recruit Russian citizens through deception and psychological manipulation. Russian authorities said 46 citizens aged 12 to 22 were detained between July 2025 and the present for alleged armed attacks on law enforcement officers, arson targeting infrastructure, and courier activity involving funds from defrauded citizens. The agency also claimed Ukrainian intelligence agents posed as young women, then later as Russian law enforcement or financial-monitoring officials, to pressure targets into carrying out attacks.\u003c/p\u003e\n\n\u003cp\u003eTelegram’s official account on X responded by posting a photo of Durov giving the middle finger, while Durov, who lives in Dubai, had not publicly commented on the development. The charges follow Russian restrictions on Telegram, including throttling at the start of the year and a near-complete blockade in April 2026. The article also notes that Durov was arrested and charged in France almost two years earlier for failing to tackle illicit activity on the messaging platform.\u003c/p\u003e\n"},{"n":9,"title":"Two-Stage Bank Scam Splits the Link to Starve Scanners","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/two-stage-bank-change-bec-deferred-link-legitimate-relay","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"Attackers abused legitimate ServiceNow email infrastructure to send an authenticated bank-details update lure while withholding the malicious link for a second email, letting the first message evade legacy scanners. The key takeaway is that SPF/DMARC-passing emails with no payload can still be BEC attempts, especially when they request financial documents and promise a separate follow-up link.","briefOverview":"\u003cp\u003eA supplier employee received a bank-details-update request that came through ServiceNow’s own outbound mail infrastructure and passed SPF, DMARC, and Microsoft compauth checks. The message impersonated a global beverage company’s outsourced procurement desk and asked for a bank certificate or statement listing the account holder name, account number, SWIFT code, and IBAN. It also told the recipient that the needed link would arrive in a second, separate email.\u003c/p\u003e\n\n\u003cp\u003eThe article describes this as split-delivery phishing, where the lure and the payload are kept apart so scanners do not see both in the same message. The recipient’s legacy gateway scored the email clean with a phishing score of zero because there was no link or attachment to detonate or reputationally check. The article emphasizes that authentication results showed the message was genuinely sent from service-now.com, not that the claimed procurement request was trustworthy.\u003c/p\u003e\n\n\u003cp\u003eIRONSCALES’ Themis flagged the email through behavioral signals including a first-time external sender, a procurement identity arriving from an unrelated ServiceNow mailbox, a high-value request for financial documents, and the instruction to expect a separate link. The message was delivered at 14:52 UTC and quarantined roughly an hour later, before the promised second stage arrived. The article recommends treating emails that promise a link, attachment, or action in a separate message as a split-delivery warning sign and verifying bank-detail changes through an out-of-band channel.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A supplier employee received a bank-details-update request through ServiceNow’s outbound mail infrastructure that passed SPF, DMARC, and Microsoft compauth checks.","The attacker withheld the malicious link for a second, separate email so scanners would not see the lure and the payload together in one message.","The email impersonated a global beverage company’s outsourced procurement desk and requested a bank certificate or statement showing the account holder name, account number, SWIFT code, and IBAN.","The recipient’s legacy gateway scored the first message clean with a phishing score of zero because it contained no link or attachment to analyze.","IRONSCALES’ Themis behavioral analysis quarantined the message roughly an hour after delivery and before the promised second-stage email arrived."],"insights":["Passing SPF, DMARC, and Microsoft compauth only proved the email was authentic to service-now.com, not that the procurement request or claimed beverage-company identity was legitimate.","The phrase telling the recipient to expect a link in a separate email was itself a detection clue because it signaled a split-delivery tactic designed to keep the lure and payload apart.","A mismatch between a trusted sending platform and the business identity claimed in the display name can be more meaningful than traditional header authentication results.","For bank-detail changes, the article recommends using an out-of-band verification channel rather than relying on the same email thread that initiated the request."],"referencedReports":[{"title":"FBI IC3 2024 Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI Internet Crime Complaint Center","context":"The article cites the report for broader business-email-compromise complaint patterns involving payment and vendor-account manipulation.","category":"research","primary":false},{"title":"Verizon DBIR 2026","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report’s statistics on breaches involving the human element and phishing for initial access.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references this guidance when recommending out-of-band verification for bank-detail changes.","category":"guide","primary":false}],"body":"\u003cp\u003eA supplier employee received a bank-details-update request that came through ServiceNow’s own outbound mail infrastructure and passed SPF, DMARC, and Microsoft compauth checks. The message impersonated a global beverage company’s outsourced procurement desk and asked for a bank certificate or statement listing the account holder name, account number, SWIFT code, and IBAN. It also told the recipient that the needed link would arrive in a second, separate email.\u003c/p\u003e\n\n\u003cp\u003eThe article describes this as split-delivery phishing, where the lure and the payload are kept apart so scanners do not see both in the same message. The recipient’s legacy gateway scored the email clean with a phishing score of zero because there was no link or attachment to detonate or reputationally check. The article emphasizes that authentication results showed the message was genuinely sent from service-now.com, not that the claimed procurement request was trustworthy.\u003c/p\u003e\n\n\u003cp\u003eIRONSCALES’ Themis flagged the email through behavioral signals including a first-time external sender, a procurement identity arriving from an unrelated ServiceNow mailbox, a high-value request for financial documents, and the instruction to expect a separate link. The message was delivered at 14:52 UTC and quarantined roughly an hour later, before the promised second stage arrived. The article recommends treating emails that promise a link, attachment, or action in a separate message as a split-delivery warning sign and verifying bank-detail changes through an out-of-band channel.\u003c/p\u003e\n"},{"n":2,"title":"Windows 11 KB5101684 update released with 42 changes and fixes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-11-kb5101684-update-released-with-42-changes-and-fixes/","time":"13:56","priority":"MAY READ","score":66,"tldr":"Microsoft released the optional Windows 11 KB5101684 preview update for versions 24H2 and 25H2, bringing 42 fixes and improvements ahead of next month’s Patch Tuesday. Key changes include fixes for File History, MDM compliance, DFS file warnings, and new/rolling features for File Explorer, Voice Access, Windows Hello, touchpad controls, and system reliability.","briefOverview":"\u003cp\u003eMicrosoft released the KB5101684 preview cumulative update for Windows 11 24H2 and 25H2, with 42 bug fixes and feature improvements. The update is part of Microsoft’s optional non-security preview update schedule, which tests fixes and features before the next month’s Patch Tuesday. It does not include security updates and can be installed through Windows Update or manually from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, Windows 11 24H2 systems are updated to build 26100.8973 and Windows 11 25H2 systems to build 26200.8973. The update fixes File History automatic backups to SMB network shares failing with a false “invalid credentials” error, newly enrolled or recovered devices remaining incorrectly noncompliant in mobile device management services such as Microsoft Intune, and files on DFS mapped drives being wrongly treated as originating from the Internet. It also improves Office application stability in virtualized environments and expands device targeting data for Secure Boot certificate deployment.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is gradually rolling out additional changes, including File Explorer improvements, better Windows Search results for typos and partial app names, Voice Isolation support and Korean language support for Voice Access, new precision touchpad controls, and Windows Hello Enhanced Sign-in Security support for compatible external fingerprint readers. Other improvements affect Widgets, Start menu reliability, voice typing, Magnifier, fonts, taskbar reliability, power and battery settings, Windows Update progress calculation, network reliability, printing, clipboard reliability, and explorer.exe stability. Microsoft says there are currently no known issues with this update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released the KB5101684 optional non-security preview cumulative update for Windows 11 24H2 and 25H2 with 42 bug fixes and feature improvements.","After installation, KB5101684 updates Windows 11 24H2 systems to build 26100.8973 and Windows 11 25H2 systems to build 26200.8973.","The update fixes issues including File History backups failing with false invalid credential errors, newly enrolled devices remaining incorrectly noncompliant, and DFS mapped drive files being wrongly treated as originating from the Internet.","Microsoft is gradually rolling out new features including improved File Explorer navigation, better search for misspelled or partial app names, Voice Isolation support for Voice Access, new precision touchpad controls, and Windows Hello Enhanced Sign-in Security support for external fingerprint readers.","Microsoft says there are currently no known issues with the KB5101684 update."],"insights":["Because KB5101684 is an optional non-security preview update, users normally must choose “Download and install” unless the “Get the latest updates as soon as they're available” setting is enabled.","Organizations using Microsoft Intune or another mobile device management service may find this update especially actionable because it addresses newly provisioned or recovered devices being incorrectly blocked from corporate resources after enrollment.","Users who rely on File History backups to SMB network shares may benefit from installing the preview update before the next Patch Tuesday because it fixes a false “invalid credentials” error that prevented automatic backups.","Some improvements will not appear for everyone immediately after installation because Microsoft is rolling out several features gradually, including File Explorer, Voice Access, Widgets, touchpad, and Windows Hello changes.","Windows Hello Enhanced Sign-in Security is no longer limited to built-in fingerprint sensors on supported devices, as this rollout begins support for compatible external fingerprint readers on desktops and other Windows 11 PCs."],"referencedReports":[{"title":"July 28, 2026—KB5101684 Preview","url":"https://support.microsoft.com/en-us/servicing/os/windows-11/2026/07/july-28-2026-kb5101684-preview","publisher":"Microsoft","context":"The article says the full release notes for the KB5101684 Windows 11 preview update are available in this Microsoft support bulletin.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft released the KB5101684 preview cumulative update for Windows 11 24H2 and 25H2, with 42 bug fixes and feature improvements. The update is part of Microsoft’s optional non-security preview update schedule, which tests fixes and features before the next month’s Patch Tuesday. It does not include security updates and can be installed through Windows Update or manually from the Microsoft Update Catalog.\u003c/p\u003e\n\n\u003cp\u003eAfter installation, Windows 11 24H2 systems are updated to build 26100.8973 and Windows 11 25H2 systems to build 26200.8973. The update fixes File History automatic backups to SMB network shares failing with a false “invalid credentials” error, newly enrolled or recovered devices remaining incorrectly noncompliant in mobile device management services such as Microsoft Intune, and files on DFS mapped drives being wrongly treated as originating from the Internet. It also improves Office application stability in virtualized environments and expands device targeting data for Secure Boot certificate deployment.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft is gradually rolling out additional changes, including File Explorer improvements, better Windows Search results for typos and partial app names, Voice Isolation support and Korean language support for Voice Access, new precision touchpad controls, and Windows Hello Enhanced Sign-in Security support for compatible external fingerprint readers. Other improvements affect Widgets, Start menu reliability, voice typing, Magnifier, fonts, taskbar reliability, power and battery settings, Windows Update progress calculation, network reliability, printing, clipboard reliability, and explorer.exe stability. Microsoft says there are currently no known issues with this update.\u003c/p\u003e\n"},{"n":5,"title":"73% of Organizations Say They Are Not Fully Ready for a Major Cyberattack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/73-of-organizations-say-they-are-not.html","time":"11:13","priority":"MAY READ","score":55,"tldr":"A Sygnia survey of 600 senior security decision makers found that 73% of organizations do not feel fully ready for a major cyberattack, despite widespread incident response plans and tools. The biggest gaps are not just technical, but in executive alignment, cross-team coordination, visibility across IT/cloud/OT environments, and tested decision-making under pressure.","briefOverview":"\u003cp\u003eA Sygnia report titled \u003cem\u003eThe State of Incident Response Readiness 2026\u003c/em\u003e found that 73% of organizations say they would not be fully ready if a significant cybersecurity attack occurred tomorrow. The report is based on a survey of 600 senior IT security decision makers conducted by Vanson Bourne in January and February 2026. It also found that 76% of organizations experienced at least one cyberattack in the past 12 months, while 32% experienced more than one.\u003c/p\u003e\n\n\u003cp\u003eThe article says the main issue is not simply whether organizations have incident response plans, tools, or technical teams, but whether those capabilities work together under pressure. Ninety percent of organizations expect difficulty coordinating stakeholders during a significant incident, and 75% say delays or uncertainty around legal and communications involvement slow decision-making. The report also found that 89% cite limited executive or board involvement in incident response readiness and decision-making.\u003c/p\u003e\n\n\u003cp\u003eTechnical visibility is another major concern, with 78% of respondents saying blind spots create persistent attacker access and increase the risk of repeated incidents. The article notes that these blind spots can span on-premises infrastructure, public cloud environments, endpoints, SaaS platforms, identity systems, and operational technology environments. The report also found that 84% of organizations are concerned about attackers crossing from corporate IT systems into operational technology or industrial control system environments, where incidents can affect production, safety, service delivery, and recovery timelines.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A survey of 600 senior IT security decision makers found that 73% of organizations say they would not be fully ready if a significant cybersecurity attack occurred tomorrow.","The report found that 76% of organizations experienced at least one cyberattack in the past 12 months, and 32% experienced more than one.","Ninety percent of organizations expect difficulty coordinating stakeholders during a significant incident, and 75% say delays or uncertainty around legal and communications involvement slow decision-making.","Seventy-eight percent of respondents agree that blind spots in their environments create persistent attacker access and increase the risk of repeated incidents.","Eighty-four percent of organizations are concerned about attackers crossing from corporate IT systems into operational technology or industrial control system environments."],"insights":["The main readiness gap is not the absence of incident response tools or plans, but the inability to coordinate executives, legal teams, communications teams, IT, and security teams quickly during a live incident.","Legal and communications teams can become a direct source of response delay when their roles and approval paths are not agreed before an incident begins.","Visibility gaps across endpoints, identity systems, cloud platforms, SaaS applications, on-premises infrastructure, and OT environments can leave organizations unsure whether attackers have actually been removed after recovery.","AI use appears most useful when it is integrated into mature response workflows, but the article stresses that it cannot fix unclear decision authority, weak coordination, or incomplete visibility.","Organizations are reassessing external incident response providers because narrow technology coverage may limit investigations when attacks span IT, cloud, identity, SaaS, and OT environments."],"referencedReports":[{"title":"The State of Incident Response Readiness 2026","url":"https://www.sygnia.co/guides-and-tools/ciso-survey-2026/","publisher":"Sygnia","context":"The article is based on this report, which surveyed 600 senior IT security decision makers about incident response readiness in January and February 2026.","category":"research","primary":true}],"body":"\u003cp\u003eA Sygnia report titled \u003cem\u003eThe State of Incident Response Readiness 2026\u003c/em\u003e found that 73% of organizations say they would not be fully ready if a significant cybersecurity attack occurred tomorrow. The report is based on a survey of 600 senior IT security decision makers conducted by Vanson Bourne in January and February 2026. It also found that 76% of organizations experienced at least one cyberattack in the past 12 months, while 32% experienced more than one.\u003c/p\u003e\n\n\u003cp\u003eThe article says the main issue is not simply whether organizations have incident response plans, tools, or technical teams, but whether those capabilities work together under pressure. Ninety percent of organizations expect difficulty coordinating stakeholders during a significant incident, and 75% say delays or uncertainty around legal and communications involvement slow decision-making. The report also found that 89% cite limited executive or board involvement in incident response readiness and decision-making.\u003c/p\u003e\n\n\u003cp\u003eTechnical visibility is another major concern, with 78% of respondents saying blind spots create persistent attacker access and increase the risk of repeated incidents. The article notes that these blind spots can span on-premises infrastructure, public cloud environments, endpoints, SaaS platforms, identity systems, and operational technology environments. The report also found that 84% of organizations are concerned about attackers crossing from corporate IT systems into operational technology or industrial control system environments, where incidents can affect production, safety, service delivery, and recovery timelines.\u003c/p\u003e\n"},{"n":6,"title":"Mythos Asks the Right Question. It Doesn't Answer It.","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/mythos-asks-right-question-it-doesnt.html","time":"12:15","priority":"MAY READ","score":45,"tldr":"AI tools like Mythos are shrinking the time from vulnerability disclosure to exploitation, but the bigger problem is that many teams still prioritize fixes by CVSS score instead of real attack paths. The article argues that organizations need context from identity, reachability, and crown-jewel exposure to know which vulnerabilities actually matter.","briefOverview":"\u003cp\u003eThe article argues that Mythos and similar AI models are compressing the time between vulnerability disclosure and exploitation, potentially reducing patching windows from weeks to days or hours. It says the main issue is not simply that attackers can move faster, but that many security teams were already struggling to prioritize vulnerabilities before AI accelerated exploit timelines. The article presents CVSS-based prioritization as insufficient because it does not include identity context, reachability, or whether a vulnerability forms a real path to a critical business asset.\u003c/p\u003e\n\n\u003cp\u003eThe article describes a common enterprise security stack with tools such as Okta or Entra for identity, Wiz or Orca for cloud security, Qualys, Tenable, or Rapid7 for vulnerability management, CrowdStrike or SentinelOne for endpoint, Zscaler or Palo Alto for network, and Splunk or Sentinel for SIEM. It argues that these tools provide useful individual signals but do not automatically connect those signals into a complete attack path to assets such as a customer database. The article promotes Mesh as a unified intelligence layer that ingests existing tool data, correlates identity, reachability, crown-jewel mapping, and validation from Horizon3.ai, and produces a smaller set of evidence-backed exposures to prioritize.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that Mythos and similar AI models compress the time between vulnerability disclosure and exploitation from weeks to days or even hours.","The article says many security teams were already struggling to prioritize vulnerabilities before Mythos because they often rely on CVSS-sorted backlogs without enough context.","The article identifies missing identity context, network reachability, and path continuity as the key gaps that CVSS scores do not provide.","The article argues that tools such as Wiz, Okta, CrowdStrike, and Qualys each provide useful signals but do not by themselves show the full attack path to critical business assets.","The article promotes Mesh as a unified intelligence layer that correlates data from existing security tools to identify evidence-backed exposures with confirmed paths to critical assets."],"insights":["A lower-scored vulnerability can be more urgent than a high-scored one if it is close to a customer database or another critical asset.","The article frames AI-compressed exploit timelines as exposing a preexisting prioritization failure rather than creating an entirely new vulnerability management problem.","Manual correlation across identity, cloud, endpoint, network, and vulnerability tools is presented as a specific weakness because attackers accelerated by AI may not leave teams enough time to piece those signals together.","The article argues that a defensible remediation decision requires evidence of a real path to a critical asset, not just severity ratings from individual security tools.","The recommended change is not replacing existing scanners or security tools, but adding a layer that connects their findings into a single view of which exposures actually matter."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that Mythos and similar AI models are compressing the time between vulnerability disclosure and exploitation, potentially reducing patching windows from weeks to days or hours. It says the main issue is not simply that attackers can move faster, but that many security teams were already struggling to prioritize vulnerabilities before AI accelerated exploit timelines. The article presents CVSS-based prioritization as insufficient because it does not include identity context, reachability, or whether a vulnerability forms a real path to a critical business asset.\u003c/p\u003e\n\n\u003cp\u003eThe article describes a common enterprise security stack with tools such as Okta or Entra for identity, Wiz or Orca for cloud security, Qualys, Tenable, or Rapid7 for vulnerability management, CrowdStrike or SentinelOne for endpoint, Zscaler or Palo Alto for network, and Splunk or Sentinel for SIEM. It argues that these tools provide useful individual signals but do not automatically connect those signals into a complete attack path to assets such as a customer database. The article promotes Mesh as a unified intelligence layer that ingests existing tool data, correlates identity, reachability, crown-jewel mapping, and validation from Horizon3.ai, and produces a smaller set of evidence-backed exposures to prioritize.\u003c/p\u003e\n"},{"n":1,"title":"These near-mint ASUS Chromebook refurbs are only $145","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/these-near-mint-asus-chromebook-refurbs-are-only-145/","time":"11:12","priority":"MAY READ","score":20,"tldr":"BleepingComputer is promoting a StackCommerce deal for a Grade A refurbished ASUS Chromebook CM30 priced at $144.97 through August 9. The 2-in-1 Chromebook includes a touchscreen, detachable keyboard, stylus, 8GB RAM, 128GB storage, and a 90-day third-party warranty.","briefOverview":"\u003cp\u003eThe article promotes a Grade “A” refurbished ASUS Chromebook CM30 being sold for \u003cspan class=\"math inline\"\u003e\\(144.97, compared with a listed regular price of \\)\u003c/span\u003e369.99. The deal is available until August 9 at 11:59 p.m. PT, with prices subject to change. The article says the device arrives in near-mint condition with minimal to no scuffing on the case.\u003c/p\u003e\n\n\u003cp\u003eThe Chromebook is described as a 2-in-1 device that can be used as both a tablet and a laptop. It has a 10.5-inch WUXGA 1920×1200 touchscreen, a MediaTek Kompanio 520 processor, 8GB of RAM, and 128GB of eMMC storage. The article says this setup handles Chrome OS, multiple browser tabs, and streaming without stalling, and is aimed at lightweight tasks and portability.\u003c/p\u003e\n\n\u003cp\u003eThe device includes a detachable keyboard, magnetic stand cover, push-pop stylus, dual 5MP cameras, Wi-Fi 6, Bluetooth 5.3, a USB-C port, and a headphone jack. Its chassis is described as military-grade aluminum made with 30% recycled material, meeting MIL-STD 810H durability standards, with battery life of up to 12 hours. The article discloses that the offer is a StackCommerce deal in partnership with BleepingComputer.com, and that BleepingComputer.com earns a commission for sales made through StackCommerce.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article promotes a Grade “A” refurbished ASUS Chromebook CM30 priced at $144.97, down from a listed regular price of $369.99.","The Chromebook has a 10.5-inch WUXGA 1920×1200 touchscreen, a MediaTek Kompanio 520 processor, 8GB of RAM, and 128GB of eMMC storage.","The device includes a detachable keyboard, magnetic stand cover, built-in push-pop stylus, dual 5MP cameras, Wi-Fi 6, Bluetooth 5.3, a USB-C port, and a headphone jack.","The chassis is described as military-grade aluminum made with 30% recycled material, meeting MIL-STD 810H durability standards, with battery life of up to 12 hours.","The deal is available until August 9 at 11:59 p.m. PT and includes a 90-day parts and labor warranty from a third party."],"insights":["The article discloses that BleepingComputer earns a commission through StackCommerce, so readers should treat the offer as paid promotional content rather than independent product coverage.","The included warranty is from a third party and lasts only 90 days, which is important for buyers comparing this refurbished device with new hardware warranties.","The article frames the Chromebook as suitable for Chrome OS, browser tabs, streaming, and portability, so its advertised value is tied to lightweight everyday use rather than demanding computing tasks.","The sale has a stated deadline of August 9 at 11:59 p.m. PT, and the article notes that prices are subject to change, making the offer time-sensitive."],"referencedReports":[],"body":"\u003cp\u003eThe article promotes a Grade “A” refurbished ASUS Chromebook CM30 being sold for \u003cspan class=\"math inline\"\u003e\\(144.97, compared with a listed regular price of \\)\u003c/span\u003e369.99. The deal is available until August 9 at 11:59 p.m. PT, with prices subject to change. The article says the device arrives in near-mint condition with minimal to no scuffing on the case.\u003c/p\u003e\n\n\u003cp\u003eThe Chromebook is described as a 2-in-1 device that can be used as both a tablet and a laptop. It has a 10.5-inch WUXGA 1920×1200 touchscreen, a MediaTek Kompanio 520 processor, 8GB of RAM, and 128GB of eMMC storage. The article says this setup handles Chrome OS, multiple browser tabs, and streaming without stalling, and is aimed at lightweight tasks and portability.\u003c/p\u003e\n\n\u003cp\u003eThe device includes a detachable keyboard, magnetic stand cover, push-pop stylus, dual 5MP cameras, Wi-Fi 6, Bluetooth 5.3, a USB-C port, and a headphone jack. Its chassis is described as military-grade aluminum made with 30% recycled material, meeting MIL-STD 810H durability standards, with battery life of up to 12 hours. The article discloses that the offer is a StackCommerce deal in partnership with BleepingComputer.com, and that BleepingComputer.com earns a commission for sales made through StackCommerce.\u003c/p\u003e\n"}]</script>
