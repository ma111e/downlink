<script type="application/json" id="dl-articles">[{"n":1,"title":"Microsoft Entra Connect Health flaw exploited to steal tenant data","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/","time":"18:01","priority":"SHOULD READ","score":88,"tldr":"Microsoft fixed an Entra Connect Health API flaw that attackers exploited to access tenant contact and configuration metadata, including administrator email addresses, but not passwords, tokens, or active cryptographic keys. Affected organizations should watch for targeted phishing, enforce phishing-resistant MFA for privileged accounts, and review Entra logs and Connect Health settings.","briefOverview":"\u003cp\u003eMicrosoft said attackers exploited a vulnerability in the Microsoft Entra Connect Health API, gaining unauthorized read-only access to tenant-level contact and configuration metadata. The cloud-based service is used to monitor on-premises identity infrastructure through the Microsoft Entra admin center. Microsoft discovered the issue on November 9, 2026, said it had been introduced on July 23, and deployed a server-side fix on November 19.\u003c/p\u003e\n\n\u003cp\u003eExposed information could include technical contact and administrator email addresses, tenant identifiers and names, initial domain names, regional details, license tiers, directory synchronization status, and Connect Health onboarding status. An expired certificate for a decommissioned internal service was also still stored in Connect Health and returned by the API, though Microsoft said it was no longer in use. Microsoft said passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises topology details, and Azure subscription information were not exposed.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft completed its investigation on November 20 and began notifying affected organizations, but did not disclose the number of impacted tenants, the party responsible, or when exploitation began. No customer software update is required, but Microsoft advised organizations to prepare for targeted phishing and social-engineering attempts using the exposed information. It also recommended phishing-resistant multifactor authentication for privileged accounts, reviewing Connect Health settings, and checking Entra audit and sign-in logs for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft said attackers exploited a vulnerability in the Entra Connect Health API to obtain unauthorized read-only access to tenant-level contact and configuration metadata.","The exposed data included technical contact and administrator email addresses, tenant IDs and names, initial domain names, country and regional information, Entra license tiers, directory synchronization status, and Connect Health onboarding status.","Microsoft said passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises Active Directory topology details, and Azure subscription information were not exposed.","Microsoft deployed a server-side fix on November 19, 2026, completed its investigation on November 20, and began notifying affected organizations.","Microsoft advised organizations to prepare for targeted phishing or social-engineering attempts, use phishing-resistant multifactor authentication for privileged accounts, and review Connect Health configurations and Entra audit and sign-in logs."],"insights":["The API continued returning an expired certificate that had been unused since its associated internal service was decommissioned in late 2024, because the certificate remained stored in Connect Health.","Microsoft’s response required no customer software update because the company deployed a server-side fix on November 19, 2026.","Microsoft’s PowerShell script can show the categories of tenant metadata that could have been exposed, but it shows current values rather than the exact data accessed during the incident.","Some managed service providers received notifications for multiple customer tenants, indicating that a single provider may need to assess exposure across more than one organization."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft said attackers exploited a vulnerability in the Microsoft Entra Connect Health API, gaining unauthorized read-only access to tenant-level contact and configuration metadata. The cloud-based service is used to monitor on-premises identity infrastructure through the Microsoft Entra admin center. Microsoft discovered the issue on November 9, 2026, said it had been introduced on July 23, and deployed a server-side fix on November 19.\u003c/p\u003e\n\n\u003cp\u003eExposed information could include technical contact and administrator email addresses, tenant identifiers and names, initial domain names, regional details, license tiers, directory synchronization status, and Connect Health onboarding status. An expired certificate for a decommissioned internal service was also still stored in Connect Health and returned by the API, though Microsoft said it was no longer in use. Microsoft said passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises topology details, and Azure subscription information were not exposed.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft completed its investigation on November 20 and began notifying affected organizations, but did not disclose the number of impacted tenants, the party responsible, or when exploitation began. No customer software update is required, but Microsoft advised organizations to prepare for targeted phishing and social-engineering attempts using the exposed information. It also recommended phishing-resistant multifactor authentication for privileged accounts, reviewing Connect Health settings, and checking Entra audit and sign-in logs for suspicious activity.\u003c/p\u003e\n"},{"n":2,"title":"BADBOX botnet returns with record-breaking 40 billion daily ad requests","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/badbox-30-botnet-returns-with-record-breaking-40-billion-daily-ad-requests/","time":"15:17","priority":"SHOULD READ","score":84,"tldr":"BADBOX 3.0 rebuilt after prior disruptions and became the largest documented ad-fraud botnet, generating up to 40 billion fraudulent daily ad bid requests through compromised low-cost Android devices. It also covertly enrolls infected devices in residential proxy networks, and researchers warn its operators are likely to adapt again after the latest takedowns.","briefOverview":"\u003cp\u003eHUMAN\u0026rsquo;s Satori researchers reported that the rebuilt BADBOX 3.0 botnet generated roughly 40 billion fraudulent advertising bid requests per day at its peak, representing more than 4% of connected-TV traffic observed by the Human Defense Platform. HUMAN described it as the largest documented ad-fraud operation by daily bid-request volume, exceeding the prior record holder VASTFLUX by more than three times. The operation returned after earlier disruption efforts against BADBOX 2.0, which cut more than 500,000 devices off from control servers in March 2025.\u003c/p\u003e\n\n\u003cp\u003eBADBOX 3.0 targets inexpensive Android Open Source Project phones, tablets, and streaming TV boxes, where it plays video ads in hidden windows while impersonating legitimate streaming applications. It also generated fraudulent server-side ad-insertion requests and enrolled infected devices in 11 residential proxy networks without their owners\u0026rsquo; knowledge, including PXYEDGE, a service identified as a rebranded successor to IpMoYu. HUMAN linked the malware to a Chinese electronics manufacturer and said the operators used public code repositories and mirrored hosting to distribute malware modules and resist takedowns.\u003c/p\u003e\n\n\u003cp\u003eHUMAN participated in efforts that removed BADBOX 3.0 command-and-control domains, took down one malware repository, and filtered associated fraudulent advertising traffic. The researchers nevertheless warned that the operators are likely to adapt, as they have after previous disruptions. The article advises users to buy certified Android devices from reputable manufacturers and ensure Google Play Protect is available and active.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["HUMAN reported that BADBOX 3.0 generated roughly 40 billion fraudulent advertising bid requests per day at its peak, representing more than 4% of connected-TV traffic observed by its platform.","BADBOX 3.0 infects low-cost Android Open Source Project phones, tablets, and streaming TV boxes to run hidden video ads while impersonating legitimate streaming applications.","The botnet also enrolled infected devices into 11 residential proxy networks without owners' knowledge, including PXYEDGE, which HUMAN identified as a rebranded successor to IpMoYu.","HUMAN linked the operation to a Chinese electronics manufacturer through associated domains, device-specific code checks, a factory-installed TV launcher, and a repository maintainer.","HUMAN, Google, and other partners disrupted BADBOX 3.0 infrastructure, but HUMAN warned that the operators are likely to adapt to the latest disruption."],"insights":["BADBOX 3.0 exceeded the prior daily ad-fraud record holder, VASTFLUX, by more than three times and had a larger peak than the previous five years of published HUMAN Satori investigations combined.","The operation combined fake advertising activity with residential proxy services, allowing some fraudulent traffic to be routed through real users’ internet connections to appear more legitimate and avoid abuse filters.","Its use of public code repositories and mirrored hosting for malware modules gave the operators redundancy that could help the operation withstand individual takedowns.","Evidence cited by HUMAN suggests the compromise may be tied to the device supply chain, including a factory-installed TV launcher and checks targeting specific devices."],"referencedReports":[{"title":"BADBOX 3.0 Hides the Largest Ad Fraud Operation Ever Disclosed Inside Infected TV Boxes","url":"https://www.humansecurity.com/learn/blog/satori-threat-intelligence-disruption-badbox-3-0-hides-the-largest-ad-fraud-operation-ever-disclosed-inside-infected-tv-boxes/","publisher":"human-security","context":"The article relies on HUMAN's Satori research for the discovery, scale, techniques, and disruption of the BADBOX 3.0 operation.","category":"research","primary":true}],"body":"\u003cp\u003eHUMAN\u0026rsquo;s Satori researchers reported that the rebuilt BADBOX 3.0 botnet generated roughly 40 billion fraudulent advertising bid requests per day at its peak, representing more than 4% of connected-TV traffic observed by the Human Defense Platform. HUMAN described it as the largest documented ad-fraud operation by daily bid-request volume, exceeding the prior record holder VASTFLUX by more than three times. The operation returned after earlier disruption efforts against BADBOX 2.0, which cut more than 500,000 devices off from control servers in March 2025.\u003c/p\u003e\n\n\u003cp\u003eBADBOX 3.0 targets inexpensive Android Open Source Project phones, tablets, and streaming TV boxes, where it plays video ads in hidden windows while impersonating legitimate streaming applications. It also generated fraudulent server-side ad-insertion requests and enrolled infected devices in 11 residential proxy networks without their owners\u0026rsquo; knowledge, including PXYEDGE, a service identified as a rebranded successor to IpMoYu. HUMAN linked the malware to a Chinese electronics manufacturer and said the operators used public code repositories and mirrored hosting to distribute malware modules and resist takedowns.\u003c/p\u003e\n\n\u003cp\u003eHUMAN participated in efforts that removed BADBOX 3.0 command-and-control domains, took down one malware repository, and filtered associated fraudulent advertising traffic. The researchers nevertheless warned that the operators are likely to adapt, as they have after previous disruptions. The article advises users to buy certified Android devices from reputable manufacturers and ensure Google Play Protect is available and active.\u003c/p\u003e\n"}]</script>
