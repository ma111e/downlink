<script type="application/json" id="dl-articles">[{"n":2,"title":"WordPress Core \"wp2shell\" RCE flaws get public exploits, patch now","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/wordpress-core-wp2shell-rce-flaws-get-public-exploits-patch-now/","time":"17:22","priority":"MUST READ","score":98,"tldr":"Public exploits are now available for the critical WordPress Core “wp2shell” flaws that can enable unauthenticated remote code execution on affected 6.9.x and 7.0.x sites. Administrators should immediately update to WordPress 7.0.2 or 6.9.5, with WAF or REST API blocking only as temporary mitigation.","briefOverview":"\u003cp\u003ePublic proof-of-concept exploits have been released for the critical “wp2shell” remote code execution vulnerabilities affecting WordPress Core. The flaws, tracked as CVE-2026-63030 and CVE-2026-60137, can be chained to achieve pre-authentication remote code execution against WordPress installs running affected 6.9.x and 7.0.x versions. Searchlight Cyber said the attack has no preconditions and can be exploited by an anonymous user against a stock WordPress installation with no plugins.\u003c/p\u003e\n\n\u003cp\u003eThe complete RCE chain affects WordPress 6.9.0 through 6.9.4 and WordPress 7.0.0 through 7.0.1, and it has been fixed in WordPress 6.9.5 and 7.0.2. WordPress enabled forced automatic security updates for supported installations running affected versions and urged site owners to update immediately. The SQL injection flaw also affects WordPress 6.8.0 through 6.8.5, but the article says it cannot be chained to RCE there because the REST API batch-route confusion bug was added in WordPress 6.9.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber is withholding technical details and created wp2shell.com so administrators can test whether their installations are vulnerable. For organizations unable to update immediately, it recommends temporarily blocking anonymous REST API access or blocking \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e and \u003ccode\u003e?rest_route=/batch/v1\u003c/code\u003e at a WAF level. Cloudflare deployed WAF protections for both vulnerabilities, and watchTowr said it has seen public exploit code in circulation and the first signs of in-the-wild exploitation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Public proof-of-concept exploits have been released for the critical “wp2shell” remote code execution vulnerabilities affecting WordPress Core.","The wp2shell attack chains CVE-2026-63030, a REST API batch-route confusion flaw, with CVE-2026-60137, an SQL injection flaw in the author__not_in parameter of WP_Query.","The complete remote code execution chain affects WordPress 6.9.0 through 6.9.4 and WordPress 7.0.0 through 7.0.1, and it has been fixed in WordPress 6.9.5 and 7.0.2.","WordPress has enabled forced automatic security updates for supported installations running affected versions and urged site owners to update immediately.","Cloudflare deployed WAF protections for both vulnerabilities, while watchTowr said it has seen public exploit code in circulation and the first signs of in-the-wild exploitation."],"insights":["The RCE risk is version-dependent: WordPress 6.8.x is affected by the SQL injection flaw, but the article says it cannot be chained to remote code execution because the REST API batch-route confusion bug was introduced only in WordPress 6.9.","Searchlight Cyber withheld technical details and created a testing site for administrators, but multiple public GitHub proof-of-concept exploits appeared anyway, shrinking the patching window for site owners.","Some public exploits reportedly rely on cracking an administrator password after extracting WordPress password hashes, while others claim pre-authentication remote code execution, showing that the public exploit landscape is not uniform.","The recommended temporary mitigations focus specifically on blocking anonymous REST API access or the batch endpoint, indicating that reducing exposure to `/wp-json/batch/v1` and `?rest_route=/batch/v1` is a practical short-term control when immediate patching is not possible.","Cloudflare’s WAF protections were deployed even for free accounts, but Cloudflare explicitly said these protections only reduce exposure and are not a substitute for updating WordPress."],"referencedReports":[{"title":"wp2shell: Pre-Authentication RCE in WordPress Core","url":"http://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core/","publisher":"Searchlight Cyber","context":"The article cites Searchlight Cyber's research describing the pre-authentication remote code execution issue in WordPress Core and the lack of preconditions for exploitation.","category":"","primary":false},{"title":"WordPress 7.0.2 Release","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article references WordPress's security announcement urging immediate updates and noting forced automatic security updates for affected versions.","category":"","primary":false},{"title":"CVE-2026-63030 WordPress Core Security Advisory","url":"http://github.com/WordPress/wordpress-develop/security/advisories/GHSA-ff9f-jf42-662q","publisher":"WordPress","context":"The article links to the advisory for CVE-2026-63030, described as a REST API batch-route confusion vulnerability introduced in WordPress 6.9.","category":"","primary":false},{"title":"CVE-2026-60137 WordPress Core Security Advisory","url":"http://github.com/WordPress/wordpress-develop/security/advisories/GHSA-fpp7-x2x2-2mjf","publisher":"WordPress","context":"The article links to the advisory for CVE-2026-60137, described as a high-severity SQL injection vulnerability in the author__not_in parameter of WP_Query.","category":"","primary":false}],"body":"\u003cp\u003ePublic proof-of-concept exploits have been released for the critical “wp2shell” remote code execution vulnerabilities affecting WordPress Core. The flaws, tracked as CVE-2026-63030 and CVE-2026-60137, can be chained to achieve pre-authentication remote code execution against WordPress installs running affected 6.9.x and 7.0.x versions. Searchlight Cyber said the attack has no preconditions and can be exploited by an anonymous user against a stock WordPress installation with no plugins.\u003c/p\u003e\n\n\u003cp\u003eThe complete RCE chain affects WordPress 6.9.0 through 6.9.4 and WordPress 7.0.0 through 7.0.1, and it has been fixed in WordPress 6.9.5 and 7.0.2. WordPress enabled forced automatic security updates for supported installations running affected versions and urged site owners to update immediately. The SQL injection flaw also affects WordPress 6.8.0 through 6.8.5, but the article says it cannot be chained to RCE there because the REST API batch-route confusion bug was added in WordPress 6.9.\u003c/p\u003e\n\n\u003cp\u003eSearchlight Cyber is withholding technical details and created wp2shell.com so administrators can test whether their installations are vulnerable. For organizations unable to update immediately, it recommends temporarily blocking anonymous REST API access or blocking \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e and \u003ccode\u003e?rest_route=/batch/v1\u003c/code\u003e at a WAF level. Cloudflare deployed WAF protections for both vulnerabilities, and watchTowr said it has seen public exploit code in circulation and the first signs of in-the-wild exploitation.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft warns of surge in ACR Stealer attacks on customers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-warns-of-surge-in-acr-stealer-attacks-on-customers/","time":"14:17","priority":"MUST READ","score":92,"tldr":"Microsoft says ACR Stealer attacks are surging against enterprise customers, using ClickFix lures, WebDAV, MSHTA, and obfuscated PowerShell to steal browser credentials, tokens, and business documents. Organizations should restrict risky script/tool execution and web-based delivery paths to reduce exposure.","briefOverview":"\u003cp\u003eMicrosoft has observed a surge in attacks using ACR Stealer malware against its enterprise customers between late April and mid-June. The malware is used to steal browser-stored passwords, authentication tokens, and sensitive documents. Microsoft says ACR Stealer is a malware-as-a-service operation believed to be a rebranding of Amatera Stealer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft highlighted two prevalent delivery chains involving ClickFix social-engineering lures. One chain runs a malicious DLL from a remote WebDAV share using rundll32.exe, then uses obfuscated PowerShell, a bundled Python loader, a scheduled task for persistence, timestamp manipulation, PowerShell history clearing, and in-memory payload execution. Some variants use public blockchain services as dead-drop resolvers to obtain updated payload locations or command-and-control addresses.\u003c/p\u003e\n\n\u003cp\u003eA second chain uses ClickFix to launch MSHTA, retrieve malicious content from the attacker’s server, and run an obfuscated PowerShell downloader that extracts an encrypted payload hidden inside a publicly hosted JPEG image. The malware targets passwords, cookies, session data, authentication tokens, Chromium browser databases on Chrome and Edge, PDFs, Microsoft 365 documents, Desktop and Downloads folders, and enterprise-synchronized OneDrive and SharePoint directories. Microsoft recommends avoiding copied command instructions, filtering and blocking low-reputation or new domains, restricting unnecessary online resources, and using application control rules for tools such as PowerShell, Python, mshta.exe, and rundll32.exe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft observed a surge between late April and mid-June in attacks using ACR Stealer to steal browser-stored passwords, authentication tokens, and sensitive documents from enterprise customers.","The threat actor used ClickFix social engineering, WebDAV servers, and the MSHTA utility to deliver the ACR Stealer payload.","One common intrusion chain uses a ClickFix lure to run a malicious DLL from a remote WebDAV share with rundll32.exe, followed by obfuscated PowerShell, a bundled Python loader, persistence through a scheduled task, and in-memory payload execution.","A second common intrusion chain uses ClickFix to launch MSHTA, retrieve malicious content from the attacker’s server, run an obfuscated PowerShell downloader, and execute an encrypted payload hidden inside a publicly hosted JPEG image.","Microsoft recommends defenses including avoiding copied command instructions from websites, filtering or blocking low-reputation and new domains, restricting unnecessary online resources, and using application control rules for tools such as PowerShell, Python, mshta.exe, and rundll32.exe."],"insights":["The ACR Stealer campaigns rely heavily on trusted Windows utilities such as MSHTA, rundll32.exe, PowerShell, and scheduled tasks, making application control around these tools especially relevant when they launch content from remote or user-writeable locations.","Some ACR Stealer variants use public blockchain services as dead-drop resolvers for updated payload locations or command-and-control addresses, so blocking only fixed attacker servers may be insufficient for the observed activity.","The WebDAV-based campaign uses GUID-style directories and legitimate-looking filenames such as google.ct to make malicious network paths appear normal, which makes domain and resource reputation filtering more important than filename appearance alone.","The malware specifically targets enterprise-synchronized OneDrive and SharePoint directories in addition to local Desktop and Downloads folders, increasing the potential business impact beyond a single infected device."],"referencedReports":[{"title":"ACR Stealer: Two observed intrusion chains amid increased threat activity","url":"https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/#campaign-1-webdav-based-clickfix-with-python-loaders-and-blockchain-c2","publisher":"Microsoft","context":"The article cites a Microsoft report describing two prevalent ACR Stealer intrusion chains, mitigations, and indicators of compromise.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft has observed a surge in attacks using ACR Stealer malware against its enterprise customers between late April and mid-June. The malware is used to steal browser-stored passwords, authentication tokens, and sensitive documents. Microsoft says ACR Stealer is a malware-as-a-service operation believed to be a rebranding of Amatera Stealer.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft highlighted two prevalent delivery chains involving ClickFix social-engineering lures. One chain runs a malicious DLL from a remote WebDAV share using rundll32.exe, then uses obfuscated PowerShell, a bundled Python loader, a scheduled task for persistence, timestamp manipulation, PowerShell history clearing, and in-memory payload execution. Some variants use public blockchain services as dead-drop resolvers to obtain updated payload locations or command-and-control addresses.\u003c/p\u003e\n\n\u003cp\u003eA second chain uses ClickFix to launch MSHTA, retrieve malicious content from the attacker’s server, and run an obfuscated PowerShell downloader that extracts an encrypted payload hidden inside a publicly hosted JPEG image. The malware targets passwords, cookies, session data, authentication tokens, Chromium browser databases on Chrome and Edge, PDFs, Microsoft 365 documents, Desktop and Downloads folders, and enterprise-synchronized OneDrive and SharePoint directories. Microsoft recommends avoiding copied command instructions, filtering and blocking low-reputation or new domains, restricting unnecessary online resources, and using application control rules for tools such as PowerShell, Python, mshta.exe, and rundll32.exe.\u003c/p\u003e\n"}]</script>
