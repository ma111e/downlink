<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA warns of actively exploited RCE flaws in Joomla extensions","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-actively-exploited-rce-flaws-in-joomla-extensions/","time":"15:20","priority":"MUST READ","score":94,"tldr":"CISA warns that attackers are actively exploiting arbitrary file upload flaws in the Joomla iCagenda and Balbooa Forms extensions to achieve remote code execution and potentially take over websites. Joomla administrators should urgently update iCagenda to 4.0.8/3.9.15 and Balbooa Forms to 2.4.1 or apply mitigations.","briefOverview":"\u003cp\u003eCISA is warning that attackers are exploiting vulnerabilities in the iCagenda and Balbooa Forms extensions for Joomla to achieve remote code execution through arbitrary file uploads. The agency categorized the flaws as maximum priority and ordered federal agencies to apply available security updates or mitigations within three days, with the deadline set for today. Website administrators managing Joomla sites are advised to check for these extensions and take action where needed.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-48939 affects the iCagenda extension, which is used for registering and scheduling events and creating calendars. CISA says the flaw allows arbitrary files to be uploaded through the file attachment feature, ultimately resulting in PHP code upload and execution. The article states that exploitation can lead to data theft, web shell installation, and complete website compromise.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56291 affects the Balbooa Forms extension, a drag-and-drop form builder for Joomla sites with file upload support. CISA says this functionality can be used to upload dangerous file types, such as executable files, leading to remote code execution and full website takeover. The flaws are fixed in iCagenda versions 4.0.8 and 3.9.15, released on June 15-16, and Balbooa Forms version 2.4.1, released on July 9.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that attackers are exploiting vulnerabilities in the iCagenda and Balbooa Forms extensions for Joomla to achieve remote code execution through arbitrary file uploads.","CISA categorized the flaws as maximum priority and ordered federal agencies to apply available security updates or mitigations within three days, with the deadline set for today.","CVE-2026-48939 affects the iCagenda extension and can allow attackers to upload arbitrary files, including PHP scripts, leading to data theft, web shell installation, and complete website compromise.","CVE-2026-56291 affects the Balbooa Forms extension and can allow dangerous file types, such as executable files, to be uploaded, leading to remote code execution and full website takeover.","The flaws are fixed in iCagenda versions 4.0.8 and 3.9.15 and Balbooa Forms version 2.4.1."],"insights":["Both Joomla extension flaws were reportedly exploited in automated attacks before the vendors released fixes, so administrators should not assume unpatched sites were safe before the update dates.","CISA gave federal agencies only three days to apply updates or mitigations, indicating the agency treated these Joomla extension flaws as especially urgent.","The vulnerable features are ordinary file upload or attachment functions in event scheduling and form-building extensions, so sites using those features should be prioritized for review.","The fixed versions were released on different dates, with iCagenda fixes released June 15-16 and the Balbooa Forms fix released July 9, making version checks essential for each extension separately."],"referencedReports":[{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/10/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites CISA's alert adding the two Joomla extension flaws to the Known Exploited Vulnerabilities catalog and ordering federal agencies to apply updates or mitigations.","category":"advisory","primary":true},{"title":"iCagenda zero-day file upload RCE","url":"https://mysites.guru/blog/icagenda-zero-day-file-upload-rce/","publisher":"mySites.guru","context":"The article references mySites.guru's write-up as the source for observed attacks against iCagenda shortly before version 4.0.8 was released.","category":"research","primary":false},{"title":"Balbooa Forms unauthenticated file upload flaw","url":"http://mysites.guru/blog/balbooa-forms-unauthenticated-file-upload-flaw/","publisher":"mySites.guru","context":"The article references mySites.guru's write-up as the source for claims that the Balbooa Forms flaw was exploited as a zero-day before the vendor fix.","category":"research","primary":false}],"body":"\u003cp\u003eCISA is warning that attackers are exploiting vulnerabilities in the iCagenda and Balbooa Forms extensions for Joomla to achieve remote code execution through arbitrary file uploads. The agency categorized the flaws as maximum priority and ordered federal agencies to apply available security updates or mitigations within three days, with the deadline set for today. Website administrators managing Joomla sites are advised to check for these extensions and take action where needed.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-48939 affects the iCagenda extension, which is used for registering and scheduling events and creating calendars. CISA says the flaw allows arbitrary files to be uploaded through the file attachment feature, ultimately resulting in PHP code upload and execution. The article states that exploitation can lead to data theft, web shell installation, and complete website compromise.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-56291 affects the Balbooa Forms extension, a drag-and-drop form builder for Joomla sites with file upload support. CISA says this functionality can be used to upload dangerous file types, such as executable files, leading to remote code execution and full website takeover. The flaws are fixed in iCagenda versions 4.0.8 and 3.9.15, released on June 15-16, and Balbooa Forms version 2.4.1, released on July 9.\u003c/p\u003e\n"},{"n":5,"title":"CrashStealer macOS Malware Uses Notarized Dropper to Pass Gatekeeper Checks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/crashstealer-macos-malware-uses.html","time":"17:36","priority":"SHOULD READ","score":84,"tldr":"Researchers found CrashStealer, a new native C++ macOS infostealer delivered through a signed and Apple-notarized dropper that can pass Gatekeeper checks. It steals browser credentials, crypto wallet data, password manager data, files, and keychain material before encrypting and exfiltrating it to attacker infrastructure.","briefOverview":"\u003cp\u003eCybersecurity researchers have identified a new macOS information stealer called CrashStealer that can harvest sensitive data from compromised systems. Jamf Threat Labs said the malware is implemented in native C++, unlike other stealers built on AppleScript droppers or Objective-C-based wrappers. The malware validates the victim’s login password locally before collecting data, encrypts harvested files with AES-GCM, and exfiltrates them over libcurl.\u003c/p\u003e\n\n\u003cp\u003eCrashStealer is distributed through a signed and Apple-notarized dropper delivered as a disk image named “Werkbit.app.” Because both the disk image and binary are notarized and use a valid developer ID, the dropper passes Gatekeeper checks. The download is served from werkbit[.]io and is gated behind a meeting PIN, while additional domains and shared backend infrastructure suggest the operation is part of a larger, multi-platform campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter launch, the dropper contacts a GitHub repository to retrieve “sys.cache,” extracts a curl command, and downloads a shell script that stages “CrashReporter.dmg” in the /tmp directory. The malware establishes persistence as a LaunchAgent, resists analysis, unlocks the login keychain using the validated password, and collects browser credentials, cryptocurrency wallet extensions, password manager data, keychain material, and files from Documents and Downloads. The harvested data is packaged into a ZIP archive and sent to an attacker-controlled server at 179.43.166[.]242.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CrashStealer is a new macOS information stealer implemented in native C++ and analyzed by Jamf Threat Labs.","CrashStealer is distributed through a signed and Apple-notarized dropper named Werkbit.app, allowing it to pass Gatekeeper checks because the disk image and binary are notarized and use a valid developer ID.","The dropper contacts a GitHub repository to retrieve a file named sys.cache, uses it to extract a curl command, and downloads a shell script that fetches and stages CrashReporter.dmg in the /tmp directory.","After execution, CrashStealer establishes persistence as a LaunchAgent, validates the victim’s login password locally, unlocks the login keychain, and collects browser data, cryptocurrency wallet extensions, password manager data, keychain material, and files from Documents and Downloads.","The harvested data is packaged into a ZIP archive, encrypted with AES-GCM, and exfiltrated to an attacker-controlled server at 179.43.166[.]242."],"insights":["The campaign’s use of a signed and Apple-notarized dropper shows that passing Gatekeeper checks is not sufficient evidence that a macOS app is safe.","The download being gated behind a meeting PIN indicates the operators limited access to the installer rather than openly serving it to every visitor.","CrashStealer validates the victim’s login password locally before stealing data, allowing it to unlock the login keychain as part of its collection process.","Jamf assessed that shared backend infrastructure and additional related domains point to CrashStealer being part of a larger, multi-platform campaign.","CrashStealer’s use of native C++, AES-GCM encryption, encrypted strings, control-flow flattening, and layered anti-debugging distinguishes it from more common macOS stealers built with AppleScript droppers or Objective-C wrappers."],"referencedReports":[{"title":"CrashStealer macOS Infostealer Analysis","url":"https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/","publisher":"Jamf Threat Labs","context":"The article cites Jamf Threat Labs' analysis as the source for technical details about CrashStealer’s implementation, delivery chain, data collection, encryption, exfiltration, persistence, and anti-analysis behavior.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers have identified a new macOS information stealer called CrashStealer that can harvest sensitive data from compromised systems. Jamf Threat Labs said the malware is implemented in native C++, unlike other stealers built on AppleScript droppers or Objective-C-based wrappers. The malware validates the victim’s login password locally before collecting data, encrypts harvested files with AES-GCM, and exfiltrates them over libcurl.\u003c/p\u003e\n\n\u003cp\u003eCrashStealer is distributed through a signed and Apple-notarized dropper delivered as a disk image named “Werkbit.app.” Because both the disk image and binary are notarized and use a valid developer ID, the dropper passes Gatekeeper checks. The download is served from werkbit[.]io and is gated behind a meeting PIN, while additional domains and shared backend infrastructure suggest the operation is part of a larger, multi-platform campaign.\u003c/p\u003e\n\n\u003cp\u003eAfter launch, the dropper contacts a GitHub repository to retrieve “sys.cache,” extracts a curl command, and downloads a shell script that stages “CrashReporter.dmg” in the /tmp directory. The malware establishes persistence as a LaunchAgent, resists analysis, unlocks the login keychain using the validated password, and collects browser credentials, cryptocurrency wallet extensions, password manager data, keychain material, and files from Documents and Downloads. The harvested data is packaged into a ZIP archive and sent to an attacker-controlled server at 179.43.166[.]242.\u003c/p\u003e\n"},{"n":7,"title":"Google and Microsoft Pull ModHeader With 1.6 Million Installs After Dormant Collector Found","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/google-and-microsoft-pull-modheader.html","time":"17:17","priority":"SHOULD READ","score":82,"tldr":"Google and Microsoft removed the popular ModHeader browser extension after researchers found a dormant browsing-history collection system hidden in the official Chrome and Edge versions. Although the collector’s allow-list was empty and no exfiltration was proven, it could have been activated through a routine update without new permissions.","briefOverview":"\u003cp\u003eGoogle and Microsoft removed ModHeader, a popular header-editing browser extension with about 1.6 million installs across Chrome and Edge, after researchers found a hidden browsing-history collector in the official store version. Stripe OLT analyzed the Chrome build, checked the code against Google’s Web Store signature, and confirmed the collector was inside the genuine extension rather than a counterfeit. Microsoft pulled the Edge listing on July 3, and Google removed the Chrome listing on July 10.\u003c/p\u003e\n\n\u003cp\u003eThe collector was dormant because an internal allow-list shipped empty, and the article says there is no proof it ever gathered or sent browsing domains. In version 7.0.18, the same minified background code that supported normal header editing also contained logic to build a device fingerprint, encrypt visited domains, store up to 1,000 distinct domains locally, and post the bundle once a day to api.stanfordstudies.com. Separate analyses by HackIndex and researcher Yunus Aydin described the same pipeline in versions 7.0.18 and 7.0.17.\u003c/p\u003e\n\n\u003cp\u003eThe article says the design is significant because the collector could have been activated by populating the allow-list through a routine update without new permissions or a user click. Automated checkers had rated ModHeader low risk, while the encrypted data, dormant upload path, minified code, unflagged endpoints, and signed popular extension status could frustrate different checks. Users are advised to remove ModHeader, prevent sync or managed policies from reinstalling it, and rotate secrets such as API keys, bearer tokens, and session cookies if they pasted them into the extension.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google and Microsoft removed the ModHeader browser extension from Chrome and Edge after researchers found a hidden browsing-history collector in the official store version.","Researchers said the collector was dormant because an internal allow-list shipped empty, and no proof has emerged that it ever collected or sent browsing domains.","The extension’s code could build a device fingerprint, encrypt visited domains, store up to 1,000 distinct domains locally, and post the data once a day to api.stanfordstudies.com if enabled.","The extension also pinged extensions-hub.com on install, update, and uninstall with the product, version, and browser.","Users are advised to remove ModHeader, ensure browser sync or managed policies do not reinstall it, and rotate any secrets such as API keys, bearer tokens, or session cookies that were pasted into it."],"insights":["A store signature only confirmed that the suspicious code came from the genuine ModHeader extension, not that the code was safe or consistent with the extension’s advertised purpose.","The collector’s empty allow-list made the upload path invisible during normal testing while leaving the endpoint, encryption key, scheduler, fingerprinting logic, and local storage logic already present on users’ machines.","Automated extension risk tools rated ModHeader as low risk even though its design combined encrypted data, dormant uploads, minified code, new endpoints, and the trust of a popular signed extension.","The article highlights that a routine extension update could have activated the collector by populating the allow-list without requiring new browser permissions or a user click.","Users who pasted API keys, bearer tokens, or session cookies into ModHeader face a separate risk because researchers found its header-history feature storing full HTTP headers on disk."],"referencedReports":[{"title":"Chrome Extension Hidden Data Exfiltration 900k Users","url":"https://stripeolt.com/knowledge-hub/threat-research/chrome-extension-hidden-data-exfiltration-900k-users/","publisher":"Stripe OLT","context":"The article says Stripe OLT analyzed ModHeader’s code, checked it against Google’s Web Store signature, and published hunting queries for defenders.","category":"research","primary":true},{"title":"ModHeader Malware Chrome Spyware","url":"https://hackindex.io/research/modheader-malware-chrome-spyware","publisher":"HackIndex","context":"The article cites HackIndex as a separate teardown of ModHeader version 7.0.18 that described the same data collection and upload pipeline.","category":"research","primary":false},{"title":"ModHeader Data Exfiltration StanfordStudies","url":"https://aydinnyunus.github.io/2026/07/12/modheader-data-exfiltration-stanfordstudies/","publisher":"Yunus Aydin","context":"The article cites researcher Yunus Aydin’s analysis of ModHeader version 7.0.17 as another teardown describing the same pipeline.","category":"research","primary":false}],"body":"\u003cp\u003eGoogle and Microsoft removed ModHeader, a popular header-editing browser extension with about 1.6 million installs across Chrome and Edge, after researchers found a hidden browsing-history collector in the official store version. Stripe OLT analyzed the Chrome build, checked the code against Google’s Web Store signature, and confirmed the collector was inside the genuine extension rather than a counterfeit. Microsoft pulled the Edge listing on July 3, and Google removed the Chrome listing on July 10.\u003c/p\u003e\n\n\u003cp\u003eThe collector was dormant because an internal allow-list shipped empty, and the article says there is no proof it ever gathered or sent browsing domains. In version 7.0.18, the same minified background code that supported normal header editing also contained logic to build a device fingerprint, encrypt visited domains, store up to 1,000 distinct domains locally, and post the bundle once a day to api.stanfordstudies.com. Separate analyses by HackIndex and researcher Yunus Aydin described the same pipeline in versions 7.0.18 and 7.0.17.\u003c/p\u003e\n\n\u003cp\u003eThe article says the design is significant because the collector could have been activated by populating the allow-list through a routine update without new permissions or a user click. Automated checkers had rated ModHeader low risk, while the encrypted data, dormant upload path, minified code, unflagged endpoints, and signed popular extension status could frustrate different checks. Users are advised to remove ModHeader, prevent sync or managed policies from reinstalling it, and rotate secrets such as API keys, bearer tokens, and session cookies if they pasted them into the extension.\u003c/p\u003e\n"},{"n":2,"title":"Lidl discloses online shop breach after service provider hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/lidl-discloses-online-shop-breach-after-service-provider-hack/","time":"14:19","priority":"SHOULD READ","score":78,"tldr":"Lidl warned online shop customers in Germany, Belgium, and the Netherlands that attackers stole personal data from a file hosted by an IT service provider. Exposed data includes names, phone numbers, emails, birth dates, and customer numbers, while Lidl says it cannot yet rule out exposure of passwords, addresses, or payment details.","briefOverview":"\u003cp\u003eGerman discount supermarket chain Lidl notified customers in Germany, Belgium, and the Netherlands that attackers stole personal information in a breach at a service provider. The breach affected customers who used Lidl’s online shop, and the company said the online shop system itself was not affected. Lidl, owned by Schwarz Group, has over 376,000 employees and operates 12,000 stores across Europe and the United States.\u003c/p\u003e\n\n\u003cp\u003eLidl said unknown individuals briefly gained access to a separately stored file containing customer data and stole part of the data from it. The confirmed stolen information includes salutation, first and last name, telephone number, email address, date of birth, and customer number. The company said it cannot yet rule out that passwords, billing and delivery addresses, bank details, or other payment information may also be involved.\u003c/p\u003e\n\n\u003cp\u003eThe hacked IT service provider filed a police report and engaged IT forensic experts to investigate the full scope and impact of the incident. Lidl also notified the Dutch Data Protection Authority and warned affected customers to watch for possible phishing attempts or identity fraud. The company advised customers to verify unexpected messages, avoid unknown links, and not provide data if they notice anything unusual.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Lidl notified customers in Germany, Belgium, and the Netherlands that attackers stole personal information in a breach at a service provider.","Lidl said unknown individuals briefly accessed a separately stored file containing customer data, while the online shop system itself was not affected.","The stolen data includes online shop customers’ salutation, first and last name, telephone number, email address, date of birth, and customer number.","Lidl said it cannot yet rule out that affected customers’ passwords, billing and delivery addresses, bank details, or other payment information may also be involved.","The hacked IT service provider filed a police report and engaged IT forensic experts, and Lidl notified the Dutch Data Protection Authority."],"insights":["The incident highlights third-party risk because Lidl said the online shop system itself was not affected, but customer data was still stolen through a hacked IT service provider.","Customers should treat unexpected messages as suspicious even though Lidl has no concrete evidence of misuse, because the stolen data could make phishing attempts appear more convincing.","The investigation remains incomplete because Lidl said it cannot yet rule out exposure of passwords, addresses, bank details, or other payment information beyond the confirmed stolen customer details.","The breach has regulatory significance because Lidl notified the Dutch Data Protection Authority in addition to contacting affected customers."],"referencedReports":[],"body":"\u003cp\u003eGerman discount supermarket chain Lidl notified customers in Germany, Belgium, and the Netherlands that attackers stole personal information in a breach at a service provider. The breach affected customers who used Lidl’s online shop, and the company said the online shop system itself was not affected. Lidl, owned by Schwarz Group, has over 376,000 employees and operates 12,000 stores across Europe and the United States.\u003c/p\u003e\n\n\u003cp\u003eLidl said unknown individuals briefly gained access to a separately stored file containing customer data and stole part of the data from it. The confirmed stolen information includes salutation, first and last name, telephone number, email address, date of birth, and customer number. The company said it cannot yet rule out that passwords, billing and delivery addresses, bank details, or other payment information may also be involved.\u003c/p\u003e\n\n\u003cp\u003eThe hacked IT service provider filed a police report and engaged IT forensic experts to investigate the full scope and impact of the incident. Lidl also notified the Dutch Data Protection Authority and warned affected customers to watch for possible phishing attempts or identity fraud. The company advised customers to verify unexpected messages, avoid unknown links, and not provide data if they notice anything unusual.\u003c/p\u003e\n"},{"n":4,"title":"Russian celebrity journalist Ksenia Sobchak says hackers accessed Telegram channels via email breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ksenia-sobchak-russian-hackers-leak","time":"17:15","priority":"MAY READ","score":68,"tldr":"Russian journalist Ksenia Sobchak said hackers briefly hijacked several of her Telegram channels through a compromised email account and posted fabricated private correspondence. The Black Mirror hacker group claims it stole more than 350GB of her data, but the authenticity of the leaked material has not been independently verified.","briefOverview":"\u003cp\u003eHackers briefly took control of several Telegram channels belonging to Russian journalist and media executive Ksenia Sobchak last week. The channels, including Sobchak and Bloody Lady, published what the hackers claimed were excerpts from her private correspondence. Sobchak’s news channel, Caution, News, later said the posts were made by hackers who had compromised the channels.\u003c/p\u003e\n\n\u003cp\u003eSobchak said the hackers gained access through her email account and claimed the correspondence was fabricated. In comments to Meduza, she said screenshots of her interactions were fake and had been published on her hijacked channel “to serve someone\u0026rsquo;s interests.” The authenticity of the leaked material or the hackers’ claims could not be independently verified.\u003c/p\u003e\n\n\u003cp\u003eThe leaked materials carried the watermark of the hacker group Black Mirror, which claimed it stole more than 350 gigabytes of Sobchak’s data spanning 2015 to 2026 and offered the archive for sale. The group claimed the archive includes conversations between Sobchak and senior Russian officials, as well as Andriy Yermak, the former head of Ukraine’s presidential office. Sobchak runs the Ostorozhno Media holding, which operates a YouTube channel and several Telegram news channels with millions of subscribers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers briefly took control of several Telegram channels belonging to Russian journalist and media executive Ksenia Sobchak last week and posted what they claimed were excerpts from her private correspondence.","Sobchak said the hackers gained access through her email account and claimed the screenshots of her interactions were fake.","The leaked materials carried the watermark of the hacker group Black Mirror, which claimed to have stolen more than 350 gigabytes of Sobchak's data spanning 2015 to 2026.","The authenticity of the leaked material and the hackers' claims could not be independently verified.","Sobchak runs the Ostorozhno Media holding, which operates a YouTube channel and several Telegram news channels with millions of subscribers."],"insights":["Sobchak’s account indicates that access to an email account was sufficient for hackers to compromise multiple high-reach Telegram channels, making the email account a central point of failure for her media presence.","The hackers used Sobchak’s own Telegram channels to publish the disputed material, which gave the posts immediate visibility to her existing audience before her news channel said the channels had been compromised.","Black Mirror paired public leaks with an offer to sell a much larger alleged archive, showing that the incident involved both public influence through Telegram posts and attempted monetization of claimed stolen data.","The article emphasizes that neither the leaked materials nor Black Mirror’s claims have been independently verified, which is especially important because Sobchak says the screenshots were fabricated."],"referencedReports":[],"body":"\u003cp\u003eHackers briefly took control of several Telegram channels belonging to Russian journalist and media executive Ksenia Sobchak last week. The channels, including Sobchak and Bloody Lady, published what the hackers claimed were excerpts from her private correspondence. Sobchak’s news channel, Caution, News, later said the posts were made by hackers who had compromised the channels.\u003c/p\u003e\n\n\u003cp\u003eSobchak said the hackers gained access through her email account and claimed the correspondence was fabricated. In comments to Meduza, she said screenshots of her interactions were fake and had been published on her hijacked channel “to serve someone\u0026rsquo;s interests.” The authenticity of the leaked material or the hackers’ claims could not be independently verified.\u003c/p\u003e\n\n\u003cp\u003eThe leaked materials carried the watermark of the hacker group Black Mirror, which claimed it stole more than 350 gigabytes of Sobchak’s data spanning 2015 to 2026 and offered the archive for sale. The group claimed the archive includes conversations between Sobchak and senior Russian officials, as well as Andriy Yermak, the former head of Ukraine’s presidential office. Sobchak runs the Ostorozhno Media holding, which operates a YouTube channel and several Telegram news channels with millions of subscribers.\u003c/p\u003e\n"},{"n":8,"title":"Identity Due Diligence: The Missing Piece of M\u0026A Risk Assessment","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/identity-due-diligence/","time":"15:29","priority":"MAY READ","score":45,"tldr":"M\u0026A cybersecurity due diligence often misses identity risk, even though exposed employee, executive, contractor, vendor, and privileged accounts can become inherited attack paths after closing. The article argues that identity exposure assessments should become a standard part of acquisitions to reduce integration risk, remediation costs, and post-deal security surprises.","briefOverview":"\u003cp\u003eThe article argues that mergers and acquisitions often evaluate financial, legal, operational, technology, and cybersecurity issues, but may overlook the identities that are also acquired. These identities include employees, executives, contractors, vendors, privileged accounts, and other digital identities. The article says this identity exposure can become part of the acquiring organization’s risk profile once the transaction closes.\u003c/p\u003e\n\n\u003cp\u003eTraditional cybersecurity due diligence may focus on vulnerability scans, network architecture, endpoint protection, security policies, and compliance certifications. The article says those reviews may not answer which identities are already exposed, how often executive accounts have appeared in exposure datasets, which privileged users present elevated risk, or what the organization’s identity exposure trend looks like. It presents Identity Intelligence as a way to add visibility into employee and executive exposure, privileged account risk, third-party relationships, historical exposure patterns, and remediation priorities.\u003c/p\u003e\n\n\u003cp\u003eThe article says missed identity risk can increase integration risk, cause operational disruption, expand the attack surface, create regulatory and compliance challenges, and raise post-closing costs. It recommends that acquiring organizations ask about known identity exposure, executive risk, privileged accounts needing review, identity monitoring, credential remediation processes, and third-party identity evaluation. It concludes that identity due diligence should become a standard part of acquisition planning because organizations acquire not only a business, but also its identities and related risks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Many M\u0026A cybersecurity assessments focus on technical controls such as vulnerability scans, network architecture, endpoint protection, security policies, and compliance certifications while overlooking organizational identities.","An acquisition transfers employee accounts, executive identities, contractor credentials, vendor relationships, privileged accounts, and other digital identities into the acquiring organization’s risk profile.","Unidentified identity exposure can increase integration risk, disrupt operations, expand the attack surface, create regulatory and compliance challenges, and raise post-closing costs.","Identity Intelligence can help organizations understand exposure across employees, executives, privileged accounts, third parties, historical exposure patterns, identity concentration, and remediation priorities.","The article argues that identity exposure assessments, executive identity reviews, third-party identity evaluations, identity governance maturity, and exposure trend analysis are likely to become standard parts of acquisition due diligence."],"insights":["Identity exposure can affect acquisition valuation because it may change expected remediation costs, integration complexity, operational risk, regulatory obligations, and executive confidence.","Penetration tests and compliance audits may not reveal high-risk identity issues such as exposed employee credentials, dormant privileged accounts, contractors with excessive access, or vendor access to critical systems.","Assessing identity exposure before Day One can turn post-acquisition remediation from a reactive effort into a structured integration plan focused on credential resets, privileged access review, orphaned accounts, and third-party access validation.","The article treats third-party and contractor identities as part of the acquired risk profile, not just the target company’s internal employee accounts."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that mergers and acquisitions often evaluate financial, legal, operational, technology, and cybersecurity issues, but may overlook the identities that are also acquired. These identities include employees, executives, contractors, vendors, privileged accounts, and other digital identities. The article says this identity exposure can become part of the acquiring organization’s risk profile once the transaction closes.\u003c/p\u003e\n\n\u003cp\u003eTraditional cybersecurity due diligence may focus on vulnerability scans, network architecture, endpoint protection, security policies, and compliance certifications. The article says those reviews may not answer which identities are already exposed, how often executive accounts have appeared in exposure datasets, which privileged users present elevated risk, or what the organization’s identity exposure trend looks like. It presents Identity Intelligence as a way to add visibility into employee and executive exposure, privileged account risk, third-party relationships, historical exposure patterns, and remediation priorities.\u003c/p\u003e\n\n\u003cp\u003eThe article says missed identity risk can increase integration risk, cause operational disruption, expand the attack surface, create regulatory and compliance challenges, and raise post-closing costs. It recommends that acquiring organizations ask about known identity exposure, executive risk, privileged accounts needing review, identity monitoring, credential remediation processes, and third-party identity evaluation. It concludes that identity due diligence should become a standard part of acquisition planning because organizations acquire not only a business, but also its identities and related risks.\u003c/p\u003e\n"},{"n":6,"title":"⚡ Weekly Recap: ShareFile Threat, Citrix Bleed 2 Ransomware, AI Coding Attacks, and More","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/weekly-recap-sharefile-threat-citrix.html","time":"15:05","priority":"MAY READ","score":40,"tldr":"This week’s threats show attackers rapidly abusing trusted software, unpatched internet-facing systems, compromised packages, and AI-assisted workflows before defenders can catch up. The key takeaway is to prioritize urgent patching, close exposed services and stale sessions, and treat AI and developer tooling as critical attack surfaces.","briefOverview":"\u003cp\u003eThis weekly recap covers a broad set of security developments involving trusted software, unpatched systems, compromised packages, ransomware activity, fake installers, and AI-assisted development risks. The main threat highlighted is Progress urging ShareFile customers to shut down Windows servers running Storage Zone Controllers because of a credible external security threat. Progress also temporarily disabled access to affected accounts while working with internal and external security experts, though it said there were no indications of unauthorized access to ShareFile accounts or data.\u003c/p\u003e\n\n\u003cp\u003eSeveral major incidents involve widely used software and developer ecosystems. Zimbra urged customers to patch a critical Classic Web Client issue where specially crafted emails could run malicious code and expose mailbox information, session data, or account settings. The Jscrambler npm package was compromised through an npm publishing credential and used to deliver a Rust-based information stealer targeting developer secrets across Windows, macOS, and Linux, while a fake Braintree NuGet package was reported to skim payment card data and steal merchant API keys.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights active exploitation and newer attacker techniques, including Citrix Bleed 2 being used to deploy DragonForce ransomware and HalluSquatting attacks that trick AI coding assistants into installing attacker-controlled resources. Other covered activity includes a GigaWiper backdoor with destructive capabilities, the SHELLSTORM web shell operation targeting WordPress plugin flaws, AI gateway compromise for cryptomining, RedHook Android malware abusing wireless debugging, and Helix data extortion using identity compromise against SharePoint environments. The broader message is that the time between available fixes and real-world exploitation is shrinking, making urgent patching, session cleanup, and reducing exposed internet-facing systems especially important.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Progress urged ShareFile customers to shut down Windows servers running Storage Zone Controllers due to a credible external security threat, while saying there were no indications of unauthorized access to ShareFile accounts or data.","Zimbra urged customers to apply updates for a critical Classic Web Client issue where a specially crafted email could run malicious code when opened and potentially expose mailbox information, session data, or account settings.","The Jscrambler npm package was compromised through an npm publishing credential and used to publish versions containing a Rust-based information stealer targeting developer secrets on Windows, macOS, and Linux.","Threat actors are exploiting Citrix Bleed 2 to deploy DragonForce ransomware, with Huntress observing a repeatable seven-step attack chain across unrelated organizations in the first half of 2026.","Researchers described HalluSquatting, a technique that uses AI hallucinations and prompt injections to trick AI coding assistants into installing attacker-controlled resources and running malicious code."],"insights":["Progress’s response to the ShareFile threat was not just to recommend patching, but to tell customers to shut down affected Storage Zone Controller Windows servers and temporarily disable access to impacted accounts despite no confirmed unauthorized access.","The Citrix Bleed 2 intrusions followed the same seven-step pattern across unrelated organizations, indicating defenders should look for a standardized chain involving SYSTEM escalation, rogue local admin accounts, ScreenConnect, Zoho Assist, and DragonForce ransomware rather than isolated indicators.","HalluSquatting shows that AI coding assistants can become a software supply-chain entry point when attackers register package or resource names invented by the AI and then use prompt injection to get the assistant to run them.","The article highlights that AI infrastructure itself is becoming a critical attack surface, with attackers compromising an internet-exposed LiteLLM Proxy instance connected to Amazon Bedrock to run unauthorized cryptomining workloads.","Helix’s extortion workflow can split roles across two compromised identities, using one account for quiet SharePoint data theft and a separate account later to deliver the extortion message through Microsoft Teams and email."],"referencedReports":[{"title":"When AI Infrastructure Becomes Part of the Attack Surface","url":"https://www.darktrace.com/blog/when-ai-infrastructure-becomes-part-of-the-attack-surface","publisher":"Darktrace","context":"The article cites Darktrace’s analysis of attackers compromising a LiteLLM Proxy instance connected to Amazon Bedrock for unauthorized cryptomining.","category":"research","primary":false},{"title":"CVE-2026-1207 VulnTracking Report","url":"https://www.crowdsec.net/vulntracking-report/cve-2026-1207","publisher":"CrowdSec","context":"The article references CrowdSec’s report on active exploitation volumes and targeting patterns for Django CVE-2026-1207.","category":"research","primary":false},{"title":"Hiding in the Chain: Multi-stage LNK Attack Leveraging TON Blockchain to Deliver Node.js Backdoor","url":"https://www.levelblue.com/blogs/spiderlabs-blog/hiding-in-the-chain-multi-stage-lnk-attack-leveraging-ton-blockchain-to-deliver-node.js-backdoor","publisher":"LevelBlue","context":"The article cites LevelBlue’s technical analysis of a malicious ZIP and LNK campaign that deploys a Node.js backdoor and uses the TON blockchain for command-and-control discovery.","category":"research","primary":false},{"title":"CitrixBleed 2 DragonForce Ransomware","url":"https://www.huntress.com/blog/citrixbleed-2-dragonforce-ransomware","publisher":"Huntress","context":"The article references Huntress’s analysis of Citrix Bleed 2 intrusions leading to DragonForce ransomware deployment and a repeated seven-step attack chain.","category":"research","primary":false},{"title":"GoodPersonRAT: Fake Chinese VPN Drops Extensive C2 Client","url":"https://www.threatlocker.com/blog/goodpersonrat-fake-chinese-vpn-drops-extensive-c2-client","publisher":"Threatdown","context":"The article cites Threatdown’s analysis of a fake Kuailian VPN installer that drops GoodPersonRAT with remote control, keylogging, persistence, and auto-updating features.","category":"research","primary":false},{"title":"Braintree NuGet Typosquat Skims Credit Cards","url":"https://socket.dev/blog/braintree-nuget-typosquat-skims-credit-cards","publisher":"Socket","context":"The article references Socket’s analysis of a malicious Braintree.Net NuGet package that impersonates Braintree’s SDK and steals payment and environment data.","category":"research","primary":false},{"title":"RedHook Android RAT Upgraded","url":"https://www.group-ib.com/blog/redhook-android-rat-upgraded/","publisher":"Group-IB","context":"The article cites Group-IB’s research on a resurfaced RedHook Android trojan that abuses Android Wireless Debugging for shell-level access.","category":"research","primary":false},{"title":"From Invoice to AnyDesk: Uncovering a Phishing Campaign Targeting Russian Aerospace Organizations","url":"https://www.seqrite.com/blog/from-invoice-to-anydesk-uncovering-a-phishing-campaign-targeting-russian-aerospace-organizations/","publisher":"Seqrite Labs","context":"The article references Seqrite Labs’ analysis of a spear-phishing campaign against Russian aerospace organizations that silently configures AnyDesk for unattended access.","category":"research","primary":false},{"title":"Threat Spotlight: Helix, New Name in Data Extortion Ecosystem","url":"https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem","publisher":"ReliaQuest","context":"The article cites ReliaQuest’s threat spotlight on Helix’s use of vishing, device code phishing, MFA abuse, SharePoint data theft, and internal extortion messages.","category":"research","primary":false}],"body":"\u003cp\u003eThis weekly recap covers a broad set of security developments involving trusted software, unpatched systems, compromised packages, ransomware activity, fake installers, and AI-assisted development risks. The main threat highlighted is Progress urging ShareFile customers to shut down Windows servers running Storage Zone Controllers because of a credible external security threat. Progress also temporarily disabled access to affected accounts while working with internal and external security experts, though it said there were no indications of unauthorized access to ShareFile accounts or data.\u003c/p\u003e\n\n\u003cp\u003eSeveral major incidents involve widely used software and developer ecosystems. Zimbra urged customers to patch a critical Classic Web Client issue where specially crafted emails could run malicious code and expose mailbox information, session data, or account settings. The Jscrambler npm package was compromised through an npm publishing credential and used to deliver a Rust-based information stealer targeting developer secrets across Windows, macOS, and Linux, while a fake Braintree NuGet package was reported to skim payment card data and steal merchant API keys.\u003c/p\u003e\n\n\u003cp\u003eThe article also highlights active exploitation and newer attacker techniques, including Citrix Bleed 2 being used to deploy DragonForce ransomware and HalluSquatting attacks that trick AI coding assistants into installing attacker-controlled resources. Other covered activity includes a GigaWiper backdoor with destructive capabilities, the SHELLSTORM web shell operation targeting WordPress plugin flaws, AI gateway compromise for cryptomining, RedHook Android malware abusing wireless debugging, and Helix data extortion using identity compromise against SharePoint environments. The broader message is that the time between available fixes and real-world exploitation is shrinking, making urgent patching, session cleanup, and reducing exposed internet-facing systems especially important.\u003c/p\u003e\n"},{"n":3,"title":"Breach at the Beach: Play the Ultimate Entra ID CTF","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/breach-at-the-beach-play-the-ultimate-entra-id-ctf/","time":"14:01","priority":"MAY READ","score":35,"tldr":"Varonis is promoting Breach at the Beach, a free Entra ID capture-the-flag training exercise focused on hands-on detection of real-world identity and data exfiltration techniques involving non-human identities and AI-era workflows. Players can earn CPE credits online or participate at Black Hat USA 2026 and DEF CON 34.","briefOverview":"\u003cp\u003eVaronis Threat Labs researchers Doron Kapah and Mark Vaitsman created Breach at the Beach, a free online capture-the-flag training experience focused on Entra ID. The scenario follows Pixel, Varonis’ threat-detecting cat, as she investigates a breach and traces a threat actor’s steps to determine what sensitive data the attacker is trying to access. The article says the CTF was built from real customer cases the researchers have encountered in cloud-native environments.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes Entra ID as a control plane that connects users, applications, permissions, automation, and AI-powered workflows. It highlights the growing role of non-human identities such as AI agents, service principals, and automated workflows, and says these can expand the attack surface when compromised. The CTF is designed to show how legitimate features can be abused, how defenders can work through raw Entra logs, and how AI-related visibility gaps can make defense more challenging.\u003c/p\u003e\n\n\u003cp\u003eBreach at the Beach is intended for red teamers, blue teamers, CISOs, threat intelligence roles, and other security professionals. Completing each stage awards 1 CPE credit and a themed badge, and completing all four stages provides a certificate of completion. Varonis will also feature the CTF at Black Hat USA 2026 and DEF CON 34, while online play is available from anywhere.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis Threat Labs researchers Doron Kapah and Mark Vaitsman created Breach at the Beach as a free Entra ID capture-the-flag training experience focused on data exfiltration scenarios.","The article says Breach at the Beach is based on real customer cases involving Entra ID, non-human identities, AI agents, service principals, and automated workflows.","The CTF is designed to teach players how legitimate Entra ID features can be abused, how to work through raw Entra logs, and how to learn without relying on AI assistance.","Completing each stage of Breach at the Beach awards players 1 CPE credit and a themed badge, and completing all four stages provides a certificate of completion.","Varonis will feature Breach at the Beach at Black Hat USA 2026 in its booth and at DEF CON 34 in the Cloud Village, while the game is also available online."],"insights":["The CTF emphasizes that attackers may abuse legitimate Entra ID functionality rather than relying on obvious misconfigurations, making normal-looking activity an important focus for defenders.","Varonis deliberately designed the challenges to limit the usefulness of large language models, reflecting a newer training concern that AI tools can help participants skip the intended learning process.","The article highlights raw and evolving Entra logs as a core part of the exercise, underscoring that creating clarity from noisy identity data is a practical skill defenders need.","The inclusion of Dataverse, Copilot, and AI agent audit logs points to visibility gaps that many security professionals may not encounter in their daily work but may need to understand as AI adoption grows."],"referencedReports":[],"body":"\u003cp\u003eVaronis Threat Labs researchers Doron Kapah and Mark Vaitsman created Breach at the Beach, a free online capture-the-flag training experience focused on Entra ID. The scenario follows Pixel, Varonis’ threat-detecting cat, as she investigates a breach and traces a threat actor’s steps to determine what sensitive data the attacker is trying to access. The article says the CTF was built from real customer cases the researchers have encountered in cloud-native environments.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes Entra ID as a control plane that connects users, applications, permissions, automation, and AI-powered workflows. It highlights the growing role of non-human identities such as AI agents, service principals, and automated workflows, and says these can expand the attack surface when compromised. The CTF is designed to show how legitimate features can be abused, how defenders can work through raw Entra logs, and how AI-related visibility gaps can make defense more challenging.\u003c/p\u003e\n\n\u003cp\u003eBreach at the Beach is intended for red teamers, blue teamers, CISOs, threat intelligence roles, and other security professionals. Completing each stage awards 1 CPE credit and a themed badge, and completing all four stages provides a certificate of completion. Varonis will also feature the CTF at Black Hat USA 2026 and DEF CON 34, while online play is available from anywhere.\u003c/p\u003e\n"}]</script>
