<script type="application/json" id="dl-articles">[{"n":2,"title":"Adobe Patches Magento Zero-Day Exploited to Deploy Rust Backdoor and PHP Web Shell","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/adobe-patches-magento-zero-day.html","time":"09:13","priority":"MUST READ","score":98,"tldr":"Adobe released an emergency hotfix for a critical Adobe Commerce and Magento Open Source zero-day, CVE-2026-75650, that is already being exploited to achieve unauthenticated remote code execution. Attackers have used the flaw to deploy a Rust-based Linux backdoor and PHP web shells, so affected merchants should apply the VULN-39341 patch and rotate encryption keys immediately.","briefOverview":"\u003cp\u003eAdobe released security patches for a maximum-severity flaw affecting Adobe Commerce and Magento Open Source that is being actively exploited in the wild. The vulnerability is tracked as CVE-2026-75650, has a CVSS score of 10.0, and has been codenamed StyleSmuggler by Sansec. Adobe said the flaw could result in arbitrary code execution and that it is aware of exploitation targeting Adobe Commerce merchants.\u003c/p\u003e\n\n\u003cp\u003eThe flaw abuses Magento\u0026rsquo;s template system through PHP code injection to generate a \u0026ldquo;Payment Transaction Failed Reminder\u0026rdquo; email, which triggers code execution. Affected products include multiple versions of Adobe Commerce, Adobe Commerce B2B, and Magento Open Source up to the listed August 2026 releases. Adobe said affected users must apply the VULN-39341 patch for their version and rotate their encryption keys.\u003c/p\u003e\n\n\u003cp\u003eSansec reported zero-day exploitation beginning on September 4, 2026, and said attackers used the vulnerability to deploy a Rust-based Linux backdoor that connects to an external server and waits for instructions. The issue has also been used to deliver a PHP dropper on vulnerable sites that writes a web shell capable of executing arbitrary PHP code. Disrex said a Magento server it managed was compromised 50 minutes after the first confirmed StyleSmuggler exploitation was reported.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adobe released security patches for a maximum-severity flaw in Adobe Commerce and Magento Open Source that is being actively exploited in the wild.","The vulnerability is tracked as CVE-2026-75650, has a CVSS score of 10.0, and was codenamed StyleSmuggler by Sansec.","The flaw abuses Magento's template system through PHP code injection to generate a \"Payment Transaction Failed Reminder\" email, triggering code execution.","Adobe said affected users must apply the VULN-39341 patch for their version and rotate their encryption keys.","Sansec reported that attackers exploited CVE-2026-75650 to deploy a Rust-based Linux backdoor, and the issue has also been used to deliver a PHP dropper that writes a web shell."],"insights":["Applying the hotfix alone is not the full remediation Adobe recommends; affected merchants must also rotate their encryption keys.","Systems that had already installed the August 2026 releases are still listed as affected, so being recently patched does not rule out exposure.","The reported compromise of a Magento server 50 minutes after the first confirmed StyleSmuggler exploitation shows that vulnerable sites may have been targeted very quickly once exploitation began.","Attackers used more than one follow-on payload, including a Rust-based Linux backdoor and a PHP web shell, so defenders may need to look for multiple signs of compromise rather than a single malware artifact."],"referencedReports":[{"title":"Adobe Security Bulletin APSB26-146","url":"https://helpx.adobe.com/security/products/magento/apsb26-146.html","publisher":"Adobe","context":"The article cites Adobe's security bulletin stating that CVE-2026-75650 could result in arbitrary code execution and has been exploited in the wild against Adobe Commerce merchants.","category":"","primary":false},{"title":"Commerce APSB26-146","url":"https://experienceleague.adobe.com/en/docs/commerce-knowledge-base/kb/announcements/commerce-apsb26-146","publisher":"Adobe","context":"The article cites Adobe's Commerce knowledge base notice saying affected users must apply the VULN-39341 patch and rotate encryption keys.","category":"","primary":false}],"body":"\u003cp\u003eAdobe released security patches for a maximum-severity flaw affecting Adobe Commerce and Magento Open Source that is being actively exploited in the wild. The vulnerability is tracked as CVE-2026-75650, has a CVSS score of 10.0, and has been codenamed StyleSmuggler by Sansec. Adobe said the flaw could result in arbitrary code execution and that it is aware of exploitation targeting Adobe Commerce merchants.\u003c/p\u003e\n\n\u003cp\u003eThe flaw abuses Magento\u0026rsquo;s template system through PHP code injection to generate a \u0026ldquo;Payment Transaction Failed Reminder\u0026rdquo; email, which triggers code execution. Affected products include multiple versions of Adobe Commerce, Adobe Commerce B2B, and Magento Open Source up to the listed August 2026 releases. Adobe said affected users must apply the VULN-39341 patch for their version and rotate their encryption keys.\u003c/p\u003e\n\n\u003cp\u003eSansec reported zero-day exploitation beginning on September 4, 2026, and said attackers used the vulnerability to deploy a Rust-based Linux backdoor that connects to an external server and waits for instructions. The issue has also been used to deliver a PHP dropper on vulnerable sites that writes a web shell capable of executing arbitrary PHP code. Disrex said a Magento server it managed was compromised 50 minutes after the first confirmed StyleSmuggler exploitation was reported.\u003c/p\u003e\n"},{"n":3,"title":"BengalSEO Poisons Bing Search Results to Deliver MayaBot and Tech Support Scams","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/bengalseo-poisons-bing-search-results.html","time":"08:43","priority":"SHOULD READ","score":86,"tldr":"Researchers detailed BengalSEO, a long-running India-linked SEO poisoning operation that manipulates Bing results with fake support and software pages to deliver MayaBot malware, XMRig miners, or tech support scams. The campaign uses trusted hosting platforms, cloaking, CAPTCHA challenges, and traffic distribution systems to filter victims and evade detection.","briefOverview":"\u003cp\u003eCybersecurity researchers disclosed details of a search engine optimization poisoning campaign called \u003cstrong\u003eBengalSEO\u003c/strong\u003e that enables malware delivery and tech support scams. The DFIR Report discovered the campaign in March 2026 and said it has operated out of Rajasthan, India since at least 2015. The operation is linked to WeConnect Solutions LLC and Garage2Global, with evidence indicating that Garage2Global develops malicious web infrastructure used in the campaigns.\u003c/p\u003e\n\n\u003cp\u003eBengalSEO creates and promotes fake lure pages that appear high in Microsoft Bing search results for technical support, service activation, software downloads, tax utilities, gaming software, antivirus tools, and card activation topics. Victims are routed through redirector domains and filtering systems before reaching payload pages or scam contact pages. One payload is \u003cstrong\u003eMayaBot\u003c/strong\u003e, a custom malware used for command-and-control, system monitoring, and delivery of an XMRig cryptocurrency miner.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses black hat SEO techniques including backlinks, DOM injection, DOM shuffling, keyword stuffing, and user-generated content spam to boost search visibility and evade spam filters. Its traffic distribution system uses redirect chains, Cloudflare Turnstile or hCaptcha challenges, and Matomo tracking to profile visitors and screen out unwanted traffic. The article also describes a separate Check Point Research report on Gambling Goblin, which has targeted Brazilian government and educational websites with malicious Apache modules to manipulate search rankings and proxy visitors to phishing pages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The DFIR Report disclosed a search engine optimization poisoning campaign called BengalSEO that has operated out of Rajasthan, India since at least 2015 and is tied to WeConnect Solutions LLC and Garage2Global.","BengalSEO promotes malicious lure pages in Microsoft Bing search results to deliver MayaBot malware, deploy an XMRig cryptocurrency miner, or redirect victims to tech support scam call centers.","The campaign uses black hat SEO techniques including backlinks, DOM injection, DOM shuffling, keyword stuffing, and user-generated content spam to boost lure pages and evade spam filters.","BengalSEO uses a traffic distribution system with redirector chains, Cloudflare Turnstile or hCaptcha challenges, and Matomo tracking to filter, fingerprint, and route visitors to final landing pages.","Check Point Research also reported a separate Gambling Goblin campaign that compromises Brazilian government and educational websites with malicious Apache modules to proxy visitors to phishing pages for SEO manipulation."],"insights":["BengalSEO’s use of legitimate hosting platforms such as github.io, pages.dev, sites.google.com, and readthedocs.io shows that high-reputation services can help malicious lure pages rank well and appear trustworthy to users.","The group constantly updates GitHub-hosted lure pages to rotate redirector domains or temporarily replace them with legitimate URLs, indicating that takedowns and blocking are actively anticipated in its workflow.","Matomo tracking on lure and landing pages, including the domain stats.us3.org with more than 1,100 urlscan.io results, provides a concrete infrastructure clue for hunting BengalSEO-linked activity.","The campaign does not rely on a single end goal: the same search-poisoning and redirection infrastructure can lead either to MayaBot payload delivery or to tech support scam phone pages.","The separate Gambling Goblin activity shows a related SEO-abuse pattern in which trusted Brazilian government and educational websites are hijacked so attacker-controlled phishing pages inherit the legitimate domain’s reputation."],"referencedReports":[{"title":"BengalSEO Part 1: Anatomy of the Operation","url":"https://thedfirreport.com/2026/08/24/bengalseo-part-1-anatomy-of-the-operation/","publisher":"The DFIR Report","context":"The article cites this technical analysis as the source for details on BengalSEO’s SEO poisoning infrastructure, traffic distribution system, lure pages, and MayaBot delivery.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers disclosed details of a search engine optimization poisoning campaign called \u003cstrong\u003eBengalSEO\u003c/strong\u003e that enables malware delivery and tech support scams. The DFIR Report discovered the campaign in March 2026 and said it has operated out of Rajasthan, India since at least 2015. The operation is linked to WeConnect Solutions LLC and Garage2Global, with evidence indicating that Garage2Global develops malicious web infrastructure used in the campaigns.\u003c/p\u003e\n\n\u003cp\u003eBengalSEO creates and promotes fake lure pages that appear high in Microsoft Bing search results for technical support, service activation, software downloads, tax utilities, gaming software, antivirus tools, and card activation topics. Victims are routed through redirector domains and filtering systems before reaching payload pages or scam contact pages. One payload is \u003cstrong\u003eMayaBot\u003c/strong\u003e, a custom malware used for command-and-control, system monitoring, and delivery of an XMRig cryptocurrency miner.\u003c/p\u003e\n\n\u003cp\u003eThe campaign uses black hat SEO techniques including backlinks, DOM injection, DOM shuffling, keyword stuffing, and user-generated content spam to boost search visibility and evade spam filters. Its traffic distribution system uses redirect chains, Cloudflare Turnstile or hCaptcha challenges, and Matomo tracking to profile visitors and screen out unwanted traffic. The article also describes a separate Check Point Research report on Gambling Goblin, which has targeted Brazilian government and educational websites with malicious Apache modules to manipulate search rankings and proxy visitors to phishing pages.\u003c/p\u003e\n"},{"n":1,"title":"220 million traveler records exposed in Vietnam-linked APIS leak","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/220-million-traveler-records-exposed-in-vietnam-linked-apis-leak/","time":"07:35","priority":"SHOULD READ","score":85,"tldr":"A misconfigured Elasticsearch APIS database linked to Vietnam exposed over 220 million passenger and crew travel records, including passport details and flight information spanning 2017 to 2026. Researchers said access was secured on June 8, but it is unknown whether anyone copied or abused the data before then.","briefOverview":"\u003cp\u003eAn Advance Passenger Information System database containing more than 220 million passenger and crew records was accessible online through a chain of security misconfigurations. The system appears linked to a Vietnamese organization, and the records span January 2017 to April 2026. The exposed data could involve travelers of many nationalities who flew to, from, or through Vietnam during that period.\u003c/p\u003e\n\n\u003cp\u003eKinryū Labs discovered the Elasticsearch cluster, named \u003ccode\u003epax-info\u003c/code\u003e, on June 3 while surveying exposed databases as part of research into ransomware activity. The cluster contained 29 indices and about 107 GB of data, including 210,318,069 passenger records and 10,465,631 crew records. The exposed information included names, dates of birth, sex, nationalities, passport or travel-document numbers, document expiration dates, issuing countries, and flight details such as airlines, routes, seat assignments, baggage references, and flight times.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the database was reachable by chaining two misconfigurations: the direct internet endpoint returned an HTTP 401 response, but a cloud-based path led to the cluster, which accepted default credentials. Kinryū Labs reported the issue to Vietnamese authorities, airlines represented in the database, and national computer emergency response teams beginning June 3, and said access was remediated on June 8. It remains unclear whether the database was downloaded, sold, ransomed, or otherwise exploited before it was secured, because the researchers did not have access to server logs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kinryū Labs discovered an exposed Elasticsearch cluster named “pax-info” on June 3 that contained 210,318,069 passenger records and 10,465,631 crew records.","The exposed records included names, dates of birth, sex, nationalities, passport or travel-document numbers, document expiration dates, issuing countries, and associated flight details.","The records span January 2017 to April 2026 and could involve travelers of many nationalities who flew to, from, or through Vietnam during that period.","Kinryū Labs said the database was reachable through a cloud-based path and accepted default credentials, despite the direct internet endpoint returning an HTTP 401 response.","Kinryū Labs reported the issue beginning June 3, and the researchers said access to the database was remediated on June 8."],"insights":["The exposure was not simply an open database on the public internet; researchers said access required chaining a cloud-based path with default credentials after the direct endpoint returned an HTTP 401 response.","The dataset’s size does not equal the number of affected people, because the article states the 220 million entries are travel records and repeat travelers or crew may appear multiple times.","Although the records span more than nine years, the article says the actual duration of public retrievability is unknown because researchers could not determine when the second access path became usable.","The article notes there is no indication that the airlines whose passenger records appeared in the database operated the exposed system or had their own networks compromised.","Researchers found no ransom notes, unfamiliar indices, or online sale listing for the dataset, but they could not determine whether the data had been copied because they lacked server logs."],"referencedReports":[],"body":"\u003cp\u003eAn Advance Passenger Information System database containing more than 220 million passenger and crew records was accessible online through a chain of security misconfigurations. The system appears linked to a Vietnamese organization, and the records span January 2017 to April 2026. The exposed data could involve travelers of many nationalities who flew to, from, or through Vietnam during that period.\u003c/p\u003e\n\n\u003cp\u003eKinryū Labs discovered the Elasticsearch cluster, named \u003ccode\u003epax-info\u003c/code\u003e, on June 3 while surveying exposed databases as part of research into ransomware activity. The cluster contained 29 indices and about 107 GB of data, including 210,318,069 passenger records and 10,465,631 crew records. The exposed information included names, dates of birth, sex, nationalities, passport or travel-document numbers, document expiration dates, issuing countries, and flight details such as airlines, routes, seat assignments, baggage references, and flight times.\u003c/p\u003e\n\n\u003cp\u003eResearchers said the database was reachable by chaining two misconfigurations: the direct internet endpoint returned an HTTP 401 response, but a cloud-based path led to the cluster, which accepted default credentials. Kinryū Labs reported the issue to Vietnamese authorities, airlines represented in the database, and national computer emergency response teams beginning June 3, and said access was remediated on June 8. It remains unclear whether the database was downloaded, sold, ransomed, or otherwise exploited before it was secured, because the researchers did not have access to server logs.\u003c/p\u003e\n"},{"n":4,"title":"Grindr to Pay £26 Million to Settle U.K. Claims Over HIV Status Data Sharing","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/grindr-to-pay-26-million-to-settle-uk.html","time":"07:00","priority":"MAY READ","score":68,"tldr":"Grindr will pay £26 million to settle U.K. claims that it improperly shared users’ sensitive personal data, including HIV status, under pre-2020 ownership. The company admits no liability but says it has since overhauled its privacy practices.","briefOverview":"\u003cp\u003eGrindr has agreed to pay £26 million ($35.1 million) to settle a U.K. lawsuit over allegations that it shared users’ personal information, including HIV status, with third parties. The lawsuit was filed in April 2024 and accused the LGBTQ+ dating app of violating U.K. privacy laws by sharing sensitive data for commercial purposes such as advertising. The claims were brought on behalf of more than 10,000 clients.\u003c/p\u003e\n\n\u003cp\u003eIn a September 2, 2026 filing with the U.S. Securities and Exchange Commission, Grindr said the settlement relates to historical data practices before 2020, when the platform was managed by Kunlun. The settlement includes no findings or admission of liability, and Grindr said it disputes the allegations while acknowledging distress and loss of trust expressed by some U.K. users. Grindr said it has revamped its privacy program since 2020 and remains committed to transparency, user control, and responsible data practices.\u003c/p\u003e\n\n\u003cp\u003eThe allegations trace back to April 2018, when SINTEF reported that Grindr was sharing users’ HIV status and last tested date with Apptimize and Localytics, which were used to optimize its apps. Grindr said at the time that it had never sold personal user information, especially HIV status or last test date, to third parties or advertisers, and that the data was used by Apptimize and Localytics only to provide services to Grindr. The article also notes that Norway’s data protection authority fined Grindr for GDPR violations involving sharing personal data with advertisers, and that Norway’s court of appeal upheld the fine last October.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Grindr agreed to pay £26 million to settle a U.K. lawsuit alleging it shared users’ personal information, including HIV status, with third parties.","The lawsuit, filed in April 2024 on behalf of more than 10,000 clients, accused Grindr of violating U.K. privacy laws by sharing sensitive data for commercial purposes such as advertising.","Grindr said in a September 2, 2026 SEC filing that the settlement concerns historical data practices before 2020, when the platform was managed by Kunlun.","The settlement includes no findings or admission of liability, and Grindr said it has revamped its privacy program since 2020.","The allegations trace back to 2018, when SINTEF reported that Grindr shared users’ HIV status and last tested date with Apptimize and Localytics, which Grindr said were used only to provide services to the app."],"insights":["The settlement targets practices from before Grindr’s 2020 ownership change, showing that privacy-related legal exposure can persist for years after a company changes management or ownership.","Grindr’s distinction between selling data and sharing data with service providers did not prevent major legal and regulatory scrutiny over sensitive user information.","The same broader privacy controversy has led to consequences in multiple jurisdictions, including a U.K. settlement and a Norwegian GDPR fine that was upheld on appeal.","Health details were shared alongside other app data such as testing dates, making the issue especially sensitive because the platform serves LGBTQ+ users who may rely on trust and discretion."],"referencedReports":[{"title":"grindr-privacy-leaks","url":"https://github.com/SINTEF-9012/grindr-privacy-leaks","publisher":"SINTEF","context":"The article says SINTEF uncovered in April 2018 that Grindr was sharing users’ HIV status and last tested date with Apptimize and Localytics.","category":"","primary":false}],"body":"\u003cp\u003eGrindr has agreed to pay £26 million ($35.1 million) to settle a U.K. lawsuit over allegations that it shared users’ personal information, including HIV status, with third parties. The lawsuit was filed in April 2024 and accused the LGBTQ+ dating app of violating U.K. privacy laws by sharing sensitive data for commercial purposes such as advertising. The claims were brought on behalf of more than 10,000 clients.\u003c/p\u003e\n\n\u003cp\u003eIn a September 2, 2026 filing with the U.S. Securities and Exchange Commission, Grindr said the settlement relates to historical data practices before 2020, when the platform was managed by Kunlun. The settlement includes no findings or admission of liability, and Grindr said it disputes the allegations while acknowledging distress and loss of trust expressed by some U.K. users. Grindr said it has revamped its privacy program since 2020 and remains committed to transparency, user control, and responsible data practices.\u003c/p\u003e\n\n\u003cp\u003eThe allegations trace back to April 2018, when SINTEF reported that Grindr was sharing users’ HIV status and last tested date with Apptimize and Localytics, which were used to optimize its apps. Grindr said at the time that it had never sold personal user information, especially HIV status or last test date, to third parties or advertisers, and that the data was used by Apptimize and Localytics only to provide services to Grindr. The article also notes that Norway’s data protection authority fined Grindr for GDPR violations involving sharing personal data with advertisers, and that Norway’s court of appeal upheld the fine last October.\u003c/p\u003e\n"}]</script>
