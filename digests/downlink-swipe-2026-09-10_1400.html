<script type="application/json" id="dl-articles">[{"n":1,"title":"AI-powered attack exploited PaperCut flaws to hack 395 organizations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ai-powered-attack-exploited-papercut-flaws-to-hack-395-organizations/","time":"15:55","priority":"MUST READ","score":97,"tldr":"A likely Russian-speaking threat actor used AI agents and commodity tools to rapidly exploit PaperCut NG/MF flaws, compromising at least 395 organizations across 48 countries and often escalating to domain administrator access. Administrators should urgently apply PaperCut's emergency updates for CVE-2026-81578 and CVE-2026-82078.","briefOverview":"\u003cp\u003eGreyNoise reported that a likely Russian-speaking threat actor used hundreds of AI agents, including OpenAI Codex and DeepSeek models, to build, test, and refine exploits for CVE-2026-81578 and CVE-2026-82078 in PaperCut NG/MF. The campaign began on August 31 and used Netlas to generate lists of internet-accessible targets. It compromised at least 440 PaperCut instances linked to 395 organizations across 48 countries. Education organizations accounted for roughly half of the affected victims, and the United States was the most targeted country.\u003c/p\u003e\n\n\u003cp\u003eThe attackers harvested credentials from 280 victims, obtained operating-system or domain secrets from 147, and gained administrator privileges at 12 organizations. GreyNoise observed paths that involved extracting credentials from server memory and registry data, abusing still-unpatched noPac flaws, or directly adding an account to Domain Admins where PaperCut was running with highly privileged access. In every observed path, the attackers used DCSync to obtain a complete domain credential database. GreyNoise said the speed of the operation reduced defenders\u0026rsquo; response time, citing an instance in which an attacker reached full domain administrator access at a U.S. high school within seven minutes; administrators are advised to immediately apply PaperCut\u0026rsquo;s emergency updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GreyNoise reported that a likely Russian-speaking threat actor used hundreds of AI agents, including OpenAI Codex and DeepSeek models, to develop and launch a campaign against vulnerable PaperCut NG/MF servers beginning August 31.","The campaign compromised at least 440 PaperCut instances associated with 395 organizations in 48 countries, with education organizations accounting for roughly half of the breaches.","The attackers harvested credentials from 280 victims, obtained operating-system or domain secrets from 147, and gained administrator privileges at 12 organizations.","After exploiting the PaperCut flaws, the attackers used methods including extracting credentials from server memory and registry data, abusing unpatched noPac weaknesses, and adding accounts to domain administrator groups.","PaperCut administrators are advised to immediately install the emergency updates for CVE-2026-81578 and CVE-2026-82078."],"insights":["GreyNoise observed the attacker achieve remote code execution against a real victim in under four hours, then obtain domain administrator access two hours later, illustrating the sharply reduced response window described in the report.","The AI agents did not consistently honor the attacker’s list of countries to avoid, meaning the campaign also affected locations the operator had reportedly sought to exclude.","PaperCut deployments running on a domain controller or using a domain-administrator service account created a direct path for the attacker to add a new account to the Domain Admins group.","In every observed attack path, the attackers ultimately used DCSync to obtain a complete copy of domain credential data."],"referencedReports":[{"title":"AI-Orchestrated Campaign Against PaperCut NG/MF","url":"https://www.greynoise.io/blog/ai-orchestrated-campaign-against-papercut-ng-mf","publisher":"greynoise","context":"The article relies on GreyNoise's analysis for details of the AI-assisted campaign, its timeline, victim count, and post-compromise activity.","category":"research","primary":true},{"title":"Security Bulletin 27 Aug 2026: Urgent Security Advisory","url":"https://www.papercut.com/kb/Main/security-bulletin-27-aug-2026-urgent-security-advisory/","publisher":"papercut-software","context":"The article directs administrators to PaperCut's bulletin for recommendations related to emergency updates for CVE-2026-81578 and CVE-2026-82078.","category":"advisory","primary":false}],"body":"\u003cp\u003eGreyNoise reported that a likely Russian-speaking threat actor used hundreds of AI agents, including OpenAI Codex and DeepSeek models, to build, test, and refine exploits for CVE-2026-81578 and CVE-2026-82078 in PaperCut NG/MF. The campaign began on August 31 and used Netlas to generate lists of internet-accessible targets. It compromised at least 440 PaperCut instances linked to 395 organizations across 48 countries. Education organizations accounted for roughly half of the affected victims, and the United States was the most targeted country.\u003c/p\u003e\n\n\u003cp\u003eThe attackers harvested credentials from 280 victims, obtained operating-system or domain secrets from 147, and gained administrator privileges at 12 organizations. GreyNoise observed paths that involved extracting credentials from server memory and registry data, abusing still-unpatched noPac flaws, or directly adding an account to Domain Admins where PaperCut was running with highly privileged access. In every observed path, the attackers used DCSync to obtain a complete domain credential database. GreyNoise said the speed of the operation reduced defenders\u0026rsquo; response time, citing an instance in which an attacker reached full domain administrator access at a U.S. high school within seven minutes; administrators are advised to immediately apply PaperCut\u0026rsquo;s emergency updates.\u003c/p\u003e\n"},{"n":2,"title":"Cisco FMC flaws exploited by ransomware gang, state-sponsored hackers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-fmc-flaws-exploited-by-ransomware-gang-state-sponsored-hackers/","time":"15:43","priority":"MUST READ","score":96,"tldr":"Cisco says two actively exploited Secure Firewall Management Center flaws, including a critical authentication bypass, were used by Qilin ransomware affiliates and a Sandworm-linked group to gain access, steal credentials, and deploy malware. Organizations should apply Cisco’s hotfixes immediately and investigate FMC systems for signs of compromise.","briefOverview":"\u003cp\u003eCisco Talos reported that three threat clusters exploited two recently patched Cisco Secure Firewall Management Center (FMC) flaws: CVE-2026-20079 and CVE-2026-20316. CVE-2026-20079 is a maximum-severity authentication bypass that lets unauthenticated remote attackers execute scripts as root, while CVE-2026-20316 permits login through static credentials for a low-privileged account. The intruders used compromised FMC devices to deploy web shells, steal credentials, establish reverse shells and proxies, and in some cases deploy Qilin ransomware or Cyclops Blink malware.\u003c/p\u003e\n\n\u003cp\u003eTalos attributed UAT-11988 with high confidence to Qilin ransomware affiliates, which used the static credentials to conduct network reconnaissance, collect credentials and infrastructure data, and encrypt endpoint files. UAT-11823, attributed with high confidence to an actor whose tooling overlaps with the Sandworm group, exploited one or both flaws, used a modified \u003ccode\u003elicense.tmp\u003c/code\u003e file and Cisco\u0026rsquo;s \u003ccode\u003epackage_info.pl\u003c/code\u003e utility to obtain root-level execution, and deployed a Cyclops Blink variant. A third cluster, UAT-12197, exploited CVE-2026-20079 to install a web shell and a malicious JAR file that queried internal databases for authentication data; Cisco has released hotfixes for both flaws and urged customers to install them immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos reported that three threat clusters exploited two recently patched Cisco Secure Firewall Management Center vulnerabilities, CVE-2026-20079 and CVE-2026-20316.","CVE-2026-20079 allows unauthenticated remote attackers to bypass authentication and execute scripts as root, while CVE-2026-20316 permits login through static credentials for a low-privileged account.","Talos attributed UAT-11988 with high confidence to Qilin ransomware affiliates, which used static credentials to access FMC devices, collect network and credential data, and ultimately deploy Qilin ransomware on endpoints.","Talos attributed UAT-11823 with high confidence to an advanced persistent threat actor with tooling overlapping Sandworm, which used a malicious license.tmp file to establish root-level access and deployed a Cyclops Blink variant.","Cisco has released hotfixes for both vulnerabilities and urged customers to install them immediately, with broader hardening and additional patches planned for the following week."],"insights":["A flaw that provides only a low-privileged static account was sufficient for Qilin affiliates to conduct broad network reconnaissance and ultimately deploy ransomware, demonstrating the impact of access to an FMC device.","Talos confirmed that UAT-11823 used both FMC flaws and the same malicious license.tmp mechanism cited in both Cisco advisories, resolving the previously unclear connection between the July exploitation activity.","Attackers abused legitimate FMC utilities, including package_info.pl, to run a modified license file as root, allowing malicious activity to blend with built-in management functions.","In the Qilin-linked activity, collected network and credential data was staged in publicly accessible files on the compromised FMC server and retrieved through HTTP GET requests before ransomware deployment."],"referencedReports":[{"title":"FMC ongoing exploitation","url":"http://blog.talosintelligence.com/fmc-ongoing-exploitation/","publisher":"cisco-talos","context":"The article relies on Cisco Talos analysis of three threat clusters exploiting Cisco FMC vulnerabilities.","category":"research","primary":true}],"body":"\u003cp\u003eCisco Talos reported that three threat clusters exploited two recently patched Cisco Secure Firewall Management Center (FMC) flaws: CVE-2026-20079 and CVE-2026-20316. CVE-2026-20079 is a maximum-severity authentication bypass that lets unauthenticated remote attackers execute scripts as root, while CVE-2026-20316 permits login through static credentials for a low-privileged account. The intruders used compromised FMC devices to deploy web shells, steal credentials, establish reverse shells and proxies, and in some cases deploy Qilin ransomware or Cyclops Blink malware.\u003c/p\u003e\n\n\u003cp\u003eTalos attributed UAT-11988 with high confidence to Qilin ransomware affiliates, which used the static credentials to conduct network reconnaissance, collect credentials and infrastructure data, and encrypt endpoint files. UAT-11823, attributed with high confidence to an actor whose tooling overlaps with the Sandworm group, exploited one or both flaws, used a modified \u003ccode\u003elicense.tmp\u003c/code\u003e file and Cisco\u0026rsquo;s \u003ccode\u003epackage_info.pl\u003c/code\u003e utility to obtain root-level execution, and deployed a Cyclops Blink variant. A third cluster, UAT-12197, exploited CVE-2026-20079 to install a web shell and a malicious JAR file that queried internal databases for authentication data; Cisco has released hotfixes for both flaws and urged customers to install them immediately.\u003c/p\u003e\n"},{"n":3,"title":"IDScan confirms breach tied to 153 million stolen driver’s licenses","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/idscan-confirms-breach-tied-to-153-million-stolen-drivers-licenses/","time":"14:55","priority":"MUST READ","score":92,"tldr":"IDScan confirmed that an unauthorized party may have accessed or copied customer data from its cloud platform, following reports linking it to a database of more than 153 million U.S. and Canadian driver’s license scans. The company is investigating with federal law enforcement and offering affected people credit monitoring and identity protection.","briefOverview":"\u003cp\u003eIDScan confirmed that an unauthorized third party may have accessed or copied customer information stored in accounts on its IDScan.net cloud platform. The company said it learned of the possible unauthorized access on or around September 1 and published a security notice on September 4. Potentially exposed information includes full names and driver’s license or other government-issued identification numbers.\u003c/p\u003e\n\n\u003cp\u003eThe incident was linked by reports to a dark-web service called Nexus that advertised access to more than 153 million U.S. and Canadian driver’s license scans, as well as millions of other identity and travel documents. Krebs verified samples associated with himself and other consenting individuals and traced the exposed information back to IDScan. IDScan is investigating with third-party specialists, cooperating with federal law enforcement, and offering potentially affected individuals free credit monitoring and identity protection services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["IDScan confirmed that an unauthorized third party may have accessed or copied customer information stored in accounts on its IDScan.net cloud platform.","The potentially exposed information includes customers’ full names and driver’s license or other government-issued identification numbers.","Reports linked the incident to a database advertised on the dark web that allegedly contained more than 153 million U.S. and Canadian driver’s license scans.","IDScan said it is investigating the incident with third-party specialists, cooperating with federal law enforcement, and offering potentially affected people free credit monitoring and identity protection services."],"insights":["IDScan’s breach notice was published on September 4 but configured to tell search engines not to index it, delaying its visibility despite the scale of the reported exposure.","The advertised database was not limited to driver’s licenses: it allegedly also included 10 million ID cards, 3 million travel documents, and 579,000 medical cards.","Although the Nexus platform was taken offline after reports emerged, the article notes that the cybercriminals likely still retain access to the database.","IDScan’s services are used across industries including car rentals, retail, finance, cannabis dispensaries, gun shops, and hospitality, meaning the incident may affect people who submitted identification to many types of businesses."],"referencedReports":[{"title":"Notification of Data Security Incident","url":"https://idscan.net/notification-data-security-incident/","publisher":"idscan","context":"IDScan’s security notice confirms that an unauthorized party may have accessed or copied customer information from its cloud platform.","category":"advisory","primary":true}],"body":"\u003cp\u003eIDScan confirmed that an unauthorized third party may have accessed or copied customer information stored in accounts on its IDScan.net cloud platform. The company said it learned of the possible unauthorized access on or around September 1 and published a security notice on September 4. Potentially exposed information includes full names and driver’s license or other government-issued identification numbers.\u003c/p\u003e\n\n\u003cp\u003eThe incident was linked by reports to a dark-web service called Nexus that advertised access to more than 153 million U.S. and Canadian driver’s license scans, as well as millions of other identity and travel documents. Krebs verified samples associated with himself and other consenting individuals and traced the exposed information back to IDScan. IDScan is investigating with third-party specialists, cooperating with federal law enforcement, and offering potentially affected individuals free credit monitoring and identity protection services.\u003c/p\u003e\n"},{"n":5,"title":"Google Play Early Access Abused to Push Thousands of Deceptive Android Apps","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/google-play-early-access-abused-to-push.html","time":"14:36","priority":"SHOULD READ","score":82,"tldr":"Threat actors are exploiting Google Play’s Early Access program, where users cannot post public ratings or reviews, to distribute thousands of deceptive Android apps promising fake rewards, casino winnings, and utilities. These apps are promoted through social-media ads, including AI celebrity deepfakes, and monetize victims through persistent advertising or links to unregulated gambling sites.","briefOverview":"\u003cp\u003eThreat actors are abusing Google Play’s Early Access program to distribute thousands of deceptive Android apps that promise money, rewards, casino winnings, premium content, or useful tools. Early Access apps cannot receive public reviews or star ratings, removing a key signal that could help users identify untrustworthy software. Bitdefender identified examples including a Grand Theft Auto imitator, “Vice Streets: Open World,” which had more than 1 million downloads and no reviews or ratings before it became unavailable on Google Play.\u003c/p\u003e\n\n\u003cp\u003eThe apps are promoted through TikTok, Facebook, and other social-media platforms, including advertisements that use AI-generated celebrity deepfakes. Fake reward apps may provide generous virtual rewards at first, then slow users’ progress when they reach a withdrawal threshold so the promised payout never arrives, while operators earn revenue by serving advertisements. Casino-style apps also reportedly disguise themselves as casual slot or puzzle games to bypass licensing, location, and age-verification requirements, with lures extending to PDF readers, QR scanners, phone trackers, utilities, and trademark-themed games.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are abusing Google Play’s Early Access program to distribute deceptive Android apps that advertise cash rewards, casino winnings, premium content, and utility functions.","Google Play does not allow public reviews or star ratings for Early Access apps, removing trust signals that could warn users about deceptive software.","Bitdefender identified an Early Access Grand Theft Auto imitator called \"Vice Streets: Open World\" that had more than 1 million downloads and no reviews or ratings before becoming unavailable on Google Play.","Suspicious apps are promoted through TikTok, Facebook, and other social-media advertisements, including ads using AI-generated celebrity deepfakes.","Many fake reward apps provide early virtual rewards but slow progress at payout thresholds so users never receive the promised money while the operators generate advertising revenue."],"insights":["A feature intended to protect legitimate developers from unfair review bombing also prevents users from seeing early warnings from critical reviews and low ratings.","The deceptive reward apps are designed to keep users engaged by granting virtual rewards at first, then making progress extremely slow when a withdrawal threshold is reached so that the promised payment never arrives.","Casino-style apps can evade licensing, location, and age-verification requirements by presenting themselves as casual slot or puzzle games and directing users to gambling websites.","The campaign uses a broad range of lures beyond gambling, including PDF readers, QR scanners, phone trackers, utility apps, and games themed around third-party trademarks."],"referencedReports":[{"title":"Google Play Early Access Exploit: Deceptive Apps","url":"https://www.bitdefender.com/en-au/blog/hotforsecurity/google-play-early-access-exploit-deceptive-apps","publisher":"bitdefender","context":"The article relies on Bitdefender's report describing thousands of deceptive Google Play Early Access apps and their promotion through social-media ads.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are abusing Google Play’s Early Access program to distribute thousands of deceptive Android apps that promise money, rewards, casino winnings, premium content, or useful tools. Early Access apps cannot receive public reviews or star ratings, removing a key signal that could help users identify untrustworthy software. Bitdefender identified examples including a Grand Theft Auto imitator, “Vice Streets: Open World,” which had more than 1 million downloads and no reviews or ratings before it became unavailable on Google Play.\u003c/p\u003e\n\n\u003cp\u003eThe apps are promoted through TikTok, Facebook, and other social-media platforms, including advertisements that use AI-generated celebrity deepfakes. Fake reward apps may provide generous virtual rewards at first, then slow users’ progress when they reach a withdrawal threshold so the promised payout never arrives, while operators earn revenue by serving advertisements. Casino-style apps also reportedly disguise themselves as casual slot or puzzle games to bypass licensing, location, and age-verification requirements, with lures extending to PDF readers, QR scanners, phone trackers, utilities, and trademark-themed games.\u003c/p\u003e\n"},{"n":8,"title":"SloppyRAT: A New Tool For Ransomware Attacks","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/sloppyrat-new-tool-ransomware-attacks","time":"14:43","priority":"SHOULD READ","score":82,"tldr":"Zscaler researchers identified SloppyRAT, a developing ransomware-linked remote-access tool delivered through ClickFix chains that enables reconnaissance, command execution, reverse SOCKS proxying, and resilient HTTPS/Polygon-based C2. Its anti-analysis features include encrypted code, indirect syscalls, and certificate pinning, though several persistence mechanisms are flawed.","briefOverview":"\u003cp\u003eIn June 2026, Zscaler ThreatLabz identified SloppyRAT, a new malware family likely used by a ransomware-related threat actor. The malware was delivered through a multi-stage ClickFix infection chain that used \u003ccode\u003efinger.exe\u003c/code\u003e to retrieve a batch script, followed by downloads of IronPython, CastleLoader, CastleRAT, and a SloppyRAT DLL. SloppyRAT is designed to establish a foothold for reconnaissance, command execution, and movement to other systems within an organization. Its code contains multiple flaws, suggesting that the malware remains under development.\u003c/p\u003e\n\n\u003cp\u003eSloppyRAT uses several methods intended to hinder analysis and monitoring, including encrypted code that is decrypted while running, obfuscated strings, junk code, indirect Windows system calls, and certificate pinning for HTTPS connections. It communicates with its control server using JSON-formatted HTTPS requests, API-key authentication, session tokens, and RC4-encrypted system information and command results. Some variants can use a Polygon blockchain-based EtherHiding mechanism as a backup way to obtain control-server information, though ThreatLabz had not observed samples with a smart-contract address.\u003c/p\u003e\n\n\u003cp\u003eThe malware supports 47 built-in commands that imitate PowerShell commands but are implemented directly in C++ using Windows APIs. It can also run PowerShell through the .NET runtime, start a PowerShell process with a falsified parent process, execute commands through WMI, and create a reverse SOCKS connection that can allow access to internal corporate systems. Its persistence code attempts to use a Windows Run registry key or COM hijacking, but both observed implementations omit required DLL execution details and appear not to function correctly.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz identified SloppyRAT in June 2026 as a new malware family likely used by a ransomware-related threat actor.","SloppyRAT was delivered through a multi-stage ClickFix chain that used finger.exe to download a batch script and ultimately loaded a SloppyRAT DLL from Azure Blob Storage.","The malware communicates with its command-and-control server over HTTPS using JSON messages, certificate pinning, API-key authentication, and RC4-encrypted data.","SloppyRAT can execute numerous built-in PowerShell-like commands, run PowerShell through the .NET runtime, launch commands through WMI, and establish a reverse SOCKS connection for access to internal networks.","The malware includes encrypted code blocks, junk code, indirect system calls, and a Polygon blockchain-based EtherHiding backup mechanism, although its observed persistence implementations contain flaws."],"insights":["Blocking outbound TCP port 79 and preventing execution of finger.exe can disrupt the observed initial delivery method, because the ClickFix chain used Finger protocol traffic to retrieve its next-stage script.","SloppyRAT’s certificate pinning verifies the SHA-256 hash of the entire server certificate, which prevents TLS interception tools from inspecting its traffic unless they present the expected certificate.","Many commands that look like PowerShell cmdlets are implemented directly in C++ with Windows APIs, so they can provide reconnaissance and system-management functions without launching PowerShell.","The malware’s two observed persistence methods appear incorrectly implemented: its Run key entry omits the DLL path and export, while its COM hijacking logic creates a new CLSID instead of replacing an existing one.","Although SloppyRAT includes a Polygon blockchain-based backup method for finding its control server, ThreatLabz had not identified samples containing the required smart-contract address, indicating that this capability had not been observed in active use."],"referencedReports":[],"body":"\u003cp\u003eIn June 2026, Zscaler ThreatLabz identified SloppyRAT, a new malware family likely used by a ransomware-related threat actor. The malware was delivered through a multi-stage ClickFix infection chain that used \u003ccode\u003efinger.exe\u003c/code\u003e to retrieve a batch script, followed by downloads of IronPython, CastleLoader, CastleRAT, and a SloppyRAT DLL. SloppyRAT is designed to establish a foothold for reconnaissance, command execution, and movement to other systems within an organization. Its code contains multiple flaws, suggesting that the malware remains under development.\u003c/p\u003e\n\n\u003cp\u003eSloppyRAT uses several methods intended to hinder analysis and monitoring, including encrypted code that is decrypted while running, obfuscated strings, junk code, indirect Windows system calls, and certificate pinning for HTTPS connections. It communicates with its control server using JSON-formatted HTTPS requests, API-key authentication, session tokens, and RC4-encrypted system information and command results. Some variants can use a Polygon blockchain-based EtherHiding mechanism as a backup way to obtain control-server information, though ThreatLabz had not observed samples with a smart-contract address.\u003c/p\u003e\n\n\u003cp\u003eThe malware supports 47 built-in commands that imitate PowerShell commands but are implemented directly in C++ using Windows APIs. It can also run PowerShell through the .NET runtime, start a PowerShell process with a falsified parent process, execute commands through WMI, and create a reverse SOCKS connection that can allow access to internal corporate systems. Its persistence code attempts to use a Windows Run registry key or COM hijacking, but both observed implementations omit required DLL execution details and appear not to function correctly.\u003c/p\u003e\n"},{"n":7,"title":"PuzzleMask: Abusing Plain Prose as a Covert AI Attack Vector","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/puzzlemask-abusing-plain-prose-as-a-covert-ai-attack-vector/","time":"14:32","priority":"MAY READ","score":70,"tldr":"Check Point Research describes PuzzleMask, a plain-prose obfuscation technique that can hide policy-violating prompts from lightweight LLM gatekeepers while stronger, tool-enabled target models recover and act on them. The findings show that input-only “quick check” moderation is vulnerable and should be supplemented with paraphrasing, suspicious-pattern detection, and output/action monitoring.","briefOverview":"\u003cp\u003eCheck Point Research describes PuzzleMask, a plain-prose technique for concealing a policy-violating instruction inside ordinary-looking text. It is designed to bypass a pipeline in which a fast LLM first screens prompts for safety before passing approved prompts to a more capable target model. The researchers emphasize that PuzzleMask is not itself a jailbreak: it can get an arbitrary hidden prompt considered by the target, but does not itself cause the target to override its own safeguards.\u003c/p\u003e\n\n\u003cp\u003eThe researchers generated 23 crafted prompts based on requests to print a flag, reproduce the full lyrics to “Macarena,” or encrypt documents and remove the originals. In all reported gatekeeper trials, gpt-4o-mini, gpt-oss-safeguard, Claude 3 Haiku, and Llama Guard 3 classified the crafted prompts as safe, even though they blocked the same instructions in plain form. In target testing, gpt-5-thinking with high reasoning effort and a Python code interpreter recovered and acted on the hidden instructions in 17 of 18 trials; the article recommends paraphrasing untrusted input, detecting certain self-referential quantitative phrases, monitoring outputs and actions, and, where feasible, using a gatekeeper as capable as the target.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Check Point Research introduced PuzzleMask, a technique that embeds a policy-violating prompt in ordinary-looking prose so a quick LLM gatekeeper may classify it as safe while a stronger target model recovers it.","The researchers tested 23 crafted prompts against gpt-4o-mini, gpt-oss-safeguard, Claude 3 Haiku, and Llama Guard 3, and every gatekeeper trial classified the crafted prompts as safe despite blocking the same payloads when sent plainly.","In tests using gpt-5-thinking with high reasoning effort and a Python code interpreter, the target recovered, considered, and acted on embedded instructions in 17 of 18 tested prompts.","The article recommends mitigations including paraphrasing untrusted input, adding a gatekeeper rule to flag quantitative self-referential phrases, monitoring model outputs and actions, and using a gatekeeper as capable as the target model."],"insights":["The attack depends on an imbalance in capability: successful target recovery in the reported tests required more than a minute of reasoning and more than two Python script executions, resources the quick gatekeepers did not have.","The researchers found that adding one policy clause directing a gpt-4o-mini gatekeeper to reject quantitative phrases that refer to the entire text caused it to flag all 23 crafted prompts, although they expect this approach to create false positives.","PuzzleMask bypasses an external screening step rather than the target model’s own safeguards, so it only gets a hidden instruction considered by the target and does not itself make the target disobey its safety training.","The technique reportedly failed against Anthropic Opus-class models because built-in classifiers terminated conversations when they detected the model processing an obfuscated prompt, illustrating the value of monitoring model behavior in addition to incoming text."],"referencedReports":[{"title":"OWASP LLM Top 10: Prompt Injection","url":"https://genai.owasp.org/llmrisk2023-24/llm01-24-prompt-injection/","publisher":"owasp","context":"The article cites the OWASP LLM Top 10 as framing prompt injection, including direct jailbreaks and indirect injection through external content, as a major LLM application risk.","category":"research","primary":false},{"title":"Not What You've Signed Up For: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection","url":"https://arxiv.org/abs/2302.12173","publisher":"greshake-et-al","context":"The article references this study as an early systematic examination of indirect prompt injection against real LLM-integrated applications.","category":"research","primary":false},{"title":"InjecAgent: Benchmarking Indirect Prompt Injections in Tool-Integrated Large Language Model Agents","url":"https://arxiv.org/abs/2403.02691","publisher":"zhan-et-al","context":"The article cites InjecAgent as a benchmark measuring how often tool-using LLM agents succumb to indirect prompt injection.","category":"research","primary":false},{"title":"RedAgent","url":"https://arxiv.org/abs/2407.16667","publisher":"redagent-authors","context":"The article references RedAgent as an agentic red-teaming framework that uses autonomous LLM agents to generate context-aware jailbreaks and multi-turn attacks.","category":"research","primary":false},{"title":"HARM","url":"https://arxiv.org/abs/2409.16783","publisher":"harm-authors","context":"The article references HARM as an agentic red-teaming framework for generating context-aware jailbreaks and multi-turn attacks.","category":"research","primary":false},{"title":"Linguistic Steganography for Language Models","url":"https://aclanthology.org/2024.naacl-long.289/","publisher":"lin-et-al","context":"The article cites Lin et al. as prior work using LLMs to embed hidden messages in fluent text, focused on perceptual imperceptibility.","category":"research","primary":false},{"title":"Norelli and Bronstein Message Embedding Research","url":"https://arxiv.org/pdf/2510.20075","publisher":"norelli-and-bronstein","context":"The article references this work as demonstrating message embedding whose recovery exceeds the resources of even a typical powerful target model.","category":"research","primary":false},{"title":"Adversarial Poems","url":"https://arxiv.org/html/2511.15304v1","publisher":"bisconti-et-al","context":"The article distinguishes its external-gatekeeper technique from Bisconti et al.'s work using adversarial poems to defeat internal LLM guardrails.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research describes PuzzleMask, a plain-prose technique for concealing a policy-violating instruction inside ordinary-looking text. It is designed to bypass a pipeline in which a fast LLM first screens prompts for safety before passing approved prompts to a more capable target model. The researchers emphasize that PuzzleMask is not itself a jailbreak: it can get an arbitrary hidden prompt considered by the target, but does not itself cause the target to override its own safeguards.\u003c/p\u003e\n\n\u003cp\u003eThe researchers generated 23 crafted prompts based on requests to print a flag, reproduce the full lyrics to “Macarena,” or encrypt documents and remove the originals. In all reported gatekeeper trials, gpt-4o-mini, gpt-oss-safeguard, Claude 3 Haiku, and Llama Guard 3 classified the crafted prompts as safe, even though they blocked the same instructions in plain form. In target testing, gpt-5-thinking with high reasoning effort and a Python code interpreter recovered and acted on the hidden instructions in 17 of 18 trials; the article recommends paraphrasing untrusted input, detecting certain self-referential quantitative phrases, monitoring outputs and actions, and, where feasible, using a gatekeeper as capable as the target.\u003c/p\u003e\n"},{"n":6,"title":"Unmasking SCCM Application Execution","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/09/10/unmasking-sccm-application-execution/","time":"16:00","priority":"MAY READ","score":58,"tldr":"SCCM application deployments do not launch directly from CcmExec.exe; CcmExec uses CITaskMgr.dll to submit a WMI EnforceApp request, after which WmiPrvSE.exe loads SCCM provider DLLs and creates the deployed process. Defenders can detect anomalous SCCM application execution by correlating WmiPrvSE.exe instances that load AppProvider.dll with their child processes and baselining uncommon deployments.","briefOverview":"\u003cp\u003eThe article examines why SCCM client script execution and client application execution create different process artifacts. Script execution commonly follows \u003ccode\u003eCcmExec.exe\u003c/code\u003e launching \u003ccode\u003ePowerShell.exe\u003c/code\u003e, while application execution can result in \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e launching the deployed program. This difference matters because detections focused on direct children of \u003ccode\u003eCcmExec.exe\u003c/code\u003e may miss SCCM application deployments used to run an unwanted executable.\u003c/p\u003e\n\n\u003cp\u003eThe author’s analysis found that \u003ccode\u003eCcmExec.exe\u003c/code\u003e loads \u003ccode\u003eCITaskMgr.dll\u003c/code\u003e, which submits an asynchronous WMI request for \u003ccode\u003eCCM_AppDeliveryType.EnforceApp\u003c/code\u003e with deployment and execution-context details. \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e then hosts \u003ccode\u003eAppProvider.dll\u003c/code\u003e, \u003ccode\u003eScriptHandler.dll\u003c/code\u003e, \u003ccode\u003eAppExcnLib.dll\u003c/code\u003e, and \u003ccode\u003eccmcore.dll\u003c/code\u003e, ultimately using \u003ccode\u003eCreateProcessW\u003c/code\u003e to start the deployed application. A proposed detection method correlates a \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e process that loaded \u003ccode\u003eAppProvider.dll\u003c/code\u003e with its child process, then identifies uncommon child processes or command lines across SCCM clients; package deployments are a separate blind spot because they may use \u003ccode\u003eCcm32BitLauncher.exe\u003c/code\u003e without \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SCCM client script execution typically produces a process chain in which CcmExec.exe launches PowerShell.exe, while SCCM client application execution can result in WmiPrvSE.exe being the parent of the deployed application.","For application deployments, CcmExec.exe loads CITaskMgr.dll, which submits a CCM_AppDeliveryType.EnforceApp request through WMI with deployment details including the application delivery type, content path, action type, user SID, and session ID.","WmiPrvSE.exe hosts AppProvider.dll and related SCCM DLLs, which process the WMI request and ultimately call CreateProcessW to launch the deployed application.","A detection approach can correlate WmiPrvSE.exe processes that load AppProvider.dll with their child processes, then identify uncommon child processes or command lines across SCCM clients.","SCCM package deployments followed a different chain in the author’s testing, using CcmExec.exe and Ccm32BitLauncher.exe without WmiPrvSE.exe."],"insights":["The connection between CcmExec.exe and WmiPrvSE.exe during SCCM application deployment is indirect: CITaskMgr.dll posts deployment details through an asynchronous local WMI request rather than CcmExec.exe directly creating the application process.","The specific WmiPrvSE.exe instance responsible for an SCCM deployment can be distinguished from other WMI provider processes by identifying one that loads C:\\Windows\\CCM\\AppProvider.dll and correlating it to its child process using Sysmon process GUIDs.","An administrator or adversary can run PowerShell through SCCM application deployment, producing WmiPrvSE.exe rather than CcmExec.exe as PowerShell’s parent, but PowerShell Script Block Logging Event ID 4104 can still expose decoded script activity.","Package deployments were observed to use CcmExec.exe followed by Ccm32BitLauncher.exe and bypass WmiPrvSE.exe, meaning detection logic focused only on AppProvider.dll-loaded WmiPrvSE.exe does not cover that deployment method."],"referencedReports":[{"title":"A Detection Engineer’s Guide to SCCM Misconfiguration Abuse","url":"https://blog.snapattack.com/a-detection-engineers-guide-to-sccm-misconfiguration-abuse-50fa059a446e","publisher":"SnapAttack","context":"The article cites this technical detection guide for prior research on SharpSCCM execution techniques and related detection logic.","category":"research","primary":false},{"title":"WMI Win32_Process Class and Create Method for Remote Execution","url":"https://threathunterplaybook.com/hunts/windows/190810-RemoteWMIExecution/notebook.html","publisher":"Threat Hunter Playbook","context":"The article references this technical analysis while investigating why WmiPrvSE.exe appears in the SCCM application-execution process chain.","category":"research","primary":false},{"title":"SCCM-LAB-part0x3","url":"https://mayfly277.github.io/posts/SCCM-LAB-part0x3/#execute-commands","publisher":"Mayfly277","context":"The article cites this SCCM lab write-up as an additional source for proof-of-concept command-execution validation and testing.","category":"guide","primary":false}],"body":"\u003cp\u003eThe article examines why SCCM client script execution and client application execution create different process artifacts. Script execution commonly follows \u003ccode\u003eCcmExec.exe\u003c/code\u003e launching \u003ccode\u003ePowerShell.exe\u003c/code\u003e, while application execution can result in \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e launching the deployed program. This difference matters because detections focused on direct children of \u003ccode\u003eCcmExec.exe\u003c/code\u003e may miss SCCM application deployments used to run an unwanted executable.\u003c/p\u003e\n\n\u003cp\u003eThe author’s analysis found that \u003ccode\u003eCcmExec.exe\u003c/code\u003e loads \u003ccode\u003eCITaskMgr.dll\u003c/code\u003e, which submits an asynchronous WMI request for \u003ccode\u003eCCM_AppDeliveryType.EnforceApp\u003c/code\u003e with deployment and execution-context details. \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e then hosts \u003ccode\u003eAppProvider.dll\u003c/code\u003e, \u003ccode\u003eScriptHandler.dll\u003c/code\u003e, \u003ccode\u003eAppExcnLib.dll\u003c/code\u003e, and \u003ccode\u003eccmcore.dll\u003c/code\u003e, ultimately using \u003ccode\u003eCreateProcessW\u003c/code\u003e to start the deployed application. A proposed detection method correlates a \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e process that loaded \u003ccode\u003eAppProvider.dll\u003c/code\u003e with its child process, then identifies uncommon child processes or command lines across SCCM clients; package deployments are a separate blind spot because they may use \u003ccode\u003eCcm32BitLauncher.exe\u003c/code\u003e without \u003ccode\u003eWmiPrvSE.exe\u003c/code\u003e.\u003c/p\u003e\n"},{"n":4,"title":"The Top 4 Threats We Found by Investigating Every Alert for a Quarter","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-top-4-threats-we-found-by-investigating-every-alert-for-a-quarter/","time":"14:00","priority":"MAY READ","score":55,"tldr":"Prophet Security’s sponsored quarterly report says stolen authenticated browser sessions were a key driver of account takeovers, often bypassing password and MFA protections and surviving password resets. The report also highlights targeted phishing, browser-delivered infostealers, and long-running intrusions on unmanaged devices as major threats.","briefOverview":"\u003cp\u003eProphet Security reviewed every alert received across its customer environments from May 1 through July 31, 2026, completing investigations with 4.7 million questions asked to customer systems. Of the completed investigations, about 93% were benign and 7% were confirmed malicious. The company said identity was the target in roughly half of confirmed malicious activity, with credential phishing the largest category at about 28% and malicious code execution and tooling accounting for about 23%.\u003c/p\u003e\n\n\u003cp\u003eThe report found that stolen, already authenticated browser sessions frequently enabled account takeovers because they could bypass checks normally performed during sign-in. It said these sessions, along with hidden email rules and persistent remote-support tools, can remain effective after a password reset; in some cases, attackers continued access after an account was disabled. It also described targeted phishing against finance-related roles, browser-delivered infostealers that extract authentication cookies, and long-running intrusions originating from unmanaged devices without endpoint coverage. The article concludes that attackers commonly rely on established techniques that exploit gaps between existing security controls rather than novel methods.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Prophet Security reported that 7% of completed alert investigations between May 1 and July 31, 2026 were confirmed malicious, and identity was the target in roughly half of those cases.","Direct account and session attacks represented about 18% of confirmed malicious activity, with replayed authenticated sessions repeatedly succeeding because they bypassed standard checks performed during sign-in.","Credential phishing was the largest single category at about 28% of confirmed malicious activity and frequently targeted finance-related roles, executives, and invoice-processing mailboxes.","Infostealer activity affected roughly one-quarter of investigated organizations and was primarily delivered through browsers via compromised websites, malicious advertising, sponsored search results, fake CAPTCHA prompts, and fake software updates.","Several long-running intrusions originated on unmanaged devices without endpoint security coverage, while commercial remote-access tools were used to maintain access at about 15% of organizations."],"insights":["Password resets and even account disabling did not always end an intrusion because stolen active sessions, hidden mailbox rules, and remote-support tools could preserve access.","A sign-in from one country followed by an MFA approval from another only seconds later revealed the likely use of a real-time proxy that relayed the victim’s credentials and approval.","Comparing endpoint-agent coverage with authentication logs exposed unmanaged machines that were still connecting to the network, including systems tied to two of the quarter’s longest-running campaigns.","Automated email remediation could remove malicious messages within seconds, while a CEO-impersonation lure remained in a finance director’s inbox for nearly a full workday where such automation was absent.","Automatic account-unlock policies enabled one attacker to combine brute-force attempts, lockouts, unlocks, and repeated approval prompts to register a new device."],"referencedReports":[],"body":"\u003cp\u003eProphet Security reviewed every alert received across its customer environments from May 1 through July 31, 2026, completing investigations with 4.7 million questions asked to customer systems. Of the completed investigations, about 93% were benign and 7% were confirmed malicious. The company said identity was the target in roughly half of confirmed malicious activity, with credential phishing the largest category at about 28% and malicious code execution and tooling accounting for about 23%.\u003c/p\u003e\n\n\u003cp\u003eThe report found that stolen, already authenticated browser sessions frequently enabled account takeovers because they could bypass checks normally performed during sign-in. It said these sessions, along with hidden email rules and persistent remote-support tools, can remain effective after a password reset; in some cases, attackers continued access after an account was disabled. It also described targeted phishing against finance-related roles, browser-delivered infostealers that extract authentication cookies, and long-running intrusions originating from unmanaged devices without endpoint coverage. The article concludes that attackers commonly rely on established techniques that exploit gaps between existing security controls rather than novel methods.\u003c/p\u003e\n"}]</script>
