<script type="application/json" id="dl-articles">[{"n":5,"title":"Microsoft Store App Found Delivering Vinci RAT Capable of Remote System Control","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/microsoft-store-app-found-delivering.html","time":"11:49","priority":"SHOULD READ","score":84,"tldr":"A malicious Microsoft Store app called Setup Assistant was used to deliver Vinci RAT, giving attackers persistent remote control through obfuscated JavaScript and PowerShell payloads. The campaign used fake software download sites and a Microsoft-signed installer to lure victims before the app was removed from the Store.","briefOverview":"\u003cp\u003eCybersecurity firm eSentire reported that attackers used a fake snipping-tool website to distribute a Microsoft-signed installer named Snipping-Tool.exe. Running it installed Setup Assistant, an Electron-based application published by ETPS Ltd. through the Microsoft Store. The application was designed to act as a backdoor, communicating with attacker-controlled servers and executing supplied PowerShell or JavaScript code.\u003c/p\u003e\n\n\u003cp\u003eThe activity ultimately deployed Vinci RAT, which can identify the affected system, list installed security tools, provide remote and reverse-shell access, deliver files, and run several kinds of code. Its PowerShell stager disabled Windows AMSI, created a scheduled task that ran every 10 minutes, contacted monkeysholder[.]info, and downloaded the RAT payload. eSentire also identified related codes-team[.]com subdomains that appeared to impersonate Microsoft Teams and Roblox download pages; Setup Assistant was no longer available in the Microsoft Store when the article was published.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at eSentire reported that attackers used a fake snipping-tool website to deliver a Microsoft-signed installer named Snipping-Tool.exe, which installed the Microsoft Store app Setup Assistant.","Setup Assistant, an Electron-based application published by ETPS Ltd., used obfuscated JavaScript to communicate with attacker-controlled infrastructure and execute PowerShell or JavaScript supplied by that infrastructure.","The campaign deployed Vinci RAT, which can identify the infected computer, check installed security tools, provide remote shell access, transfer files, and run shellcode, DLL, EXE, and PowerShell payloads.","A PowerShell stager disabled Windows AMSI, created a scheduled task that ran every 10 minutes, contacted monkeysholder[.]info, and downloaded the Vinci RAT payload.","The Setup Assistant app was no longer accessible in the Microsoft Store at the time of reporting, and eSentire said Microsoft had previously responded to its abuse report by stating that the app did not violate its terms."],"insights":["The campaign combined a Microsoft-signed installer and a Microsoft Store-hosted application with fake download pages, showing that trusted-looking distribution paths were part of the delivery chain.","Setup Assistant could wait for specific filenames such as MSTeamsSetup.exe or Reader_install.exe to appear in the Downloads folder before contacting its control server and running the response.","The attackers’ codes-team[.]com infrastructure included subdomains impersonating Microsoft Teams and Roblox download pages, indicating that the same infrastructure supported multiple software-themed lures.","eSentire said it reported the app through Microsoft’s abuse form on November 10, 2026, but received a response that the app was not a terms violation before the app later became unavailable."],"referencedReports":[{"title":"Vinci RAT Lives in the Microsoft Store","url":"https://www.esentire.com/blog/vinci-rat-lives-in-the-microsoft-store","publisher":"esentire","context":"The article relies on eSentire's technical analysis for details of the Setup Assistant application, Vinci RAT delivery chain, and command-and-control behavior.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity firm eSentire reported that attackers used a fake snipping-tool website to distribute a Microsoft-signed installer named Snipping-Tool.exe. Running it installed Setup Assistant, an Electron-based application published by ETPS Ltd. through the Microsoft Store. The application was designed to act as a backdoor, communicating with attacker-controlled servers and executing supplied PowerShell or JavaScript code.\u003c/p\u003e\n\n\u003cp\u003eThe activity ultimately deployed Vinci RAT, which can identify the affected system, list installed security tools, provide remote and reverse-shell access, deliver files, and run several kinds of code. Its PowerShell stager disabled Windows AMSI, created a scheduled task that ran every 10 minutes, contacted monkeysholder[.]info, and downloaded the RAT payload. eSentire also identified related codes-team[.]com subdomains that appeared to impersonate Microsoft Teams and Roblox download pages; Setup Assistant was no longer available in the Microsoft Store when the article was published.\u003c/p\u003e\n"},{"n":3,"title":"Software giant SAP confirms cyber incident amid reports of source code breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/sap-germany-cyberattack-github","time":"13:15","priority":"SHOULD READ","score":83,"tldr":"SAP confirmed a cybersecurity incident involving suspicious activity in its GitHub-based development environment, with reports that stolen employee tokens may have enabled source-code access or modification. SAP says it has found no evidence that customer business data was accessed and has restricted development systems while investigating.","briefOverview":"\u003cp\u003eSAP confirmed it identified suspicious activity and took steps to protect customers and secure its services after reports of a cyber incident affecting its software development infrastructure. The company said it had found no evidence of unauthorized access to customer business data, but did not disclose the intrusion’s nature or scope. German reporting said attackers may have targeted SAP’s GitHub-hosted development environment using employee authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eAccording to those reports, the tokens could have allowed attackers to copy and modify SAP source code. SAP reportedly launched an internal response called Project Granite, restricted GitHub access, halted automated development processes, and replaced digital keys used to verify software integrity. It remains unclear whether proprietary source code was accessed, whether altered code reached customers, who was responsible, or whether the incident has been fully contained. The issue is significant because SAP software supports critical business and public-sector functions including accounting, procurement, supply chains, and human resources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP confirmed it identified suspicious activity and took steps to protect customers and secure its services.","Reports said attackers targeted SAP’s GitHub-hosted software development environment using employee authentication tokens that may have allowed source code to be copied or modified.","SAP said its investigation had found no evidence of unauthorized access to customer business data.","SAP reportedly restricted GitHub access, halted automated development processes, and replaced digital keys used to verify software integrity.","It remains unclear whether proprietary source code was accessed or whether any altered code was delivered to customers."],"insights":["The reported access to employee authentication tokens could have enabled both copying and modifying source code, making the concern broader than data exposure alone.","SAP’s response included replacing digital keys used to verify software authenticity, alongside restricting GitHub access and stopping automated development processes.","The company had reportedly alerted employees to suspicious GitHub activity several days before the incident was publicly reported.","The incident follows an April compromise of SAP-developed open-source packages, although the article states that any connection between the two events is unclear."],"referencedReports":[{"title":"CAP Developers: Call to Action to Mitigate and Apply Solution Provided in April 2025","url":"https://community.sap.com/t5/technology-blog-posts-by-sap/cap-developers-call-to-action-to-mitigate-and-apply-solution-provided-in/ba-p/14387683","publisher":"sap","context":"The article links to SAP’s call to action regarding an April software supply chain attack involving malicious code in SAP-developed open-source packages.","category":"advisory","primary":false}],"body":"\u003cp\u003eSAP confirmed it identified suspicious activity and took steps to protect customers and secure its services after reports of a cyber incident affecting its software development infrastructure. The company said it had found no evidence of unauthorized access to customer business data, but did not disclose the intrusion’s nature or scope. German reporting said attackers may have targeted SAP’s GitHub-hosted development environment using employee authentication tokens.\u003c/p\u003e\n\n\u003cp\u003eAccording to those reports, the tokens could have allowed attackers to copy and modify SAP source code. SAP reportedly launched an internal response called Project Granite, restricted GitHub access, halted automated development processes, and replaced digital keys used to verify software integrity. It remains unclear whether proprietary source code was accessed, whether altered code reached customers, who was responsible, or whether the incident has been fully contained. The issue is significant because SAP software supports critical business and public-sector functions including accounting, procurement, supply chains, and human resources.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft removes WSUS server role in Windows Server 2028","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-removes-wsus-server-role-in-windows-server-2028/","time":"11:18","priority":"SHOULD READ","score":78,"tldr":"Microsoft will remove the WSUS server role from Windows Server 2028, though WSUS remains supported on earlier releases such as Windows Server 2025 for their support lifecycles. Organizations are being directed toward cloud-based update-management tools including Windows Autopatch, Microsoft Intune, and Azure Update Manager.","briefOverview":"\u003cp\u003eMicrosoft has confirmed that Windows Server 2028 will remove the Windows Server Update Services (WSUS) server role. WSUS, introduced in 2005, lets IT administrators centrally manage and distribute Microsoft product updates across corporate networks instead of having every device download updates separately. Microsoft formally deprecated WSUS in September 2024, while stating that it would continue maintaining its existing functionality and publishing updates through the channel.\u003c/p\u003e\n\n\u003cp\u003eWSUS will remain supported on earlier Windows Server versions, including Windows Server 2025, for the duration of their support lifecycles, and those installations can still manage updates for supported Windows clients and Windows Server 2028. Microsoft recommends organizations move to Windows Autopatch and Microsoft Intune for client updates and Azure Update Manager for server updates, while acknowledging the needs of disconnected and tightly controlled environments. Windows Server 2028 will also remove VBScript, the WMIC command-line utility, and WINS support; Microsoft links the removal of some of these older components to reducing abuse by malware and attack techniques.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft will remove the Windows Server Update Services (WSUS) server role from Windows Server 2028.","WSUS remains available and supported on earlier Windows Server releases, including Windows Server 2025, for each release’s support lifecycle.","Organizations can continue using WSUS hosted on earlier supported Windows Server releases to manage updates for supported Windows clients and servers, including Windows Server 2028.","Microsoft recommends that organizations move client update management to Windows Autopatch and Microsoft Intune and server update management to Azure Update Manager.","Windows Server 2028 will also remove VBScript, WMIC, and Windows Internet Name Service (WINS) support."],"insights":["Removing the WSUS role from Windows Server 2028 does not prevent WSUS hosted on earlier supported Windows Server releases from distributing updates to Windows Server 2028 systems.","Microsoft has acknowledged that disconnected and highly controlled environments still need update-management support, but it has not yet provided details on its planned approach.","The WSUS change follows its September 2024 deprecation, meaning the service remains operational on supported earlier server releases but is no longer receiving new features.","Windows Server 2028 combines the WSUS removal with the removal of older components such as VBScript, WMIC, and WINS, which Microsoft links to reducing abuse by malware and attack techniques."],"referencedReports":[{"title":"Features removed or deprecated in Windows Server","url":"https://learn.microsoft.com/en-us/windows-server/get-started/removed-deprecated-features-windows-server?tabs=ws28#:~:text=Next%20steps.-,Windows%20Server%20Update%20Services%20%28WSUS%29,-Windows%20Server%202028","publisher":"microsoft","context":"Microsoft's updated support documentation confirms that the WSUS server role is removed in Windows Server 2028 and describes continued support on earlier server releases.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft has confirmed that Windows Server 2028 will remove the Windows Server Update Services (WSUS) server role. WSUS, introduced in 2005, lets IT administrators centrally manage and distribute Microsoft product updates across corporate networks instead of having every device download updates separately. Microsoft formally deprecated WSUS in September 2024, while stating that it would continue maintaining its existing functionality and publishing updates through the channel.\u003c/p\u003e\n\n\u003cp\u003eWSUS will remain supported on earlier Windows Server versions, including Windows Server 2025, for the duration of their support lifecycles, and those installations can still manage updates for supported Windows clients and Windows Server 2028. Microsoft recommends organizations move to Windows Autopatch and Microsoft Intune for client updates and Azure Update Manager for server updates, while acknowledging the needs of disconnected and tightly controlled environments. Windows Server 2028 will also remove VBScript, the WMIC command-line utility, and WINS support; Microsoft links the removal of some of these older components to reducing abuse by malware and attack techniques.\u003c/p\u003e\n"},{"n":4,"title":"Japan’s education ministry discloses breach of government procurement system","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/japan-education-ministry-cyberattack","time":"14:15","priority":"SHOULD READ","score":78,"tldr":"Japan’s education ministry said hackers breached its government procurement system, potentially exposing 164,000 business records and nearly 1,700 email addresses. MEXT isolated the system, reported the incident to data protection authorities, and says it has found no evidence of public disclosure or misuse.","briefOverview":"\u003cp\u003eJapan’s Ministry of Education, Culture, Sports, Science and Technology (MEXT) disclosed that hackers breached its government procurement system. The ministry detected the intrusion on October 1, nearly two months before announcing it publicly. Its investigation found that the intruders may have obtained information stored in the system’s database.\u003c/p\u003e\n\n\u003cp\u003eThe potentially exposed information includes nearly 1,700 email addresses and 164,000 records containing company names, employee names, and other business information. The system publishes government tenders, contracts, and procurement opportunities, and the affected records concern companies eligible to participate in ministry bidding processes. MEXT said it blocked the system’s communications with internal and external networks, found no evidence of public disclosure or misuse, and reported the incident to Japan’s data protection authorities while continuing its investigation with other government agencies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Japan’s Ministry of Education, Culture, Sports, Science and Technology detected an intrusion into its government procurement system on October 1 and disclosed it nearly two months later.","Hackers may have accessed the system’s database, potentially exposing nearly 1,700 email addresses and 164,000 records containing company names, employee names, and other business information.","The affected system publishes government tender, contract, and procurement opportunities, and the potentially exposed information concerns companies eligible to participate in the ministry’s bidding processes.","MEXT blocked communications between the affected system and internal and external networks and said it found no evidence that the potentially compromised information had been publicly disclosed or misused.","The ministry reported the incident to Japan’s data protection authorities and is continuing its investigation with relevant government agencies."],"insights":["The ministry detected the intrusion on October 1 but did not publicly disclose it until nearly two months later.","The potentially exposed records concern companies eligible for ministry bidding processes, meaning the incident may affect organizations that interact with the government procurement system rather than only ministry staff.","MEXT isolated the affected system from both internal and external networks, indicating containment involved cutting off its communications broadly.","The ministry has not identified the perpetrators or explained how access was gained, and it said there is no indication that this incident is connected to other recent cyber incidents in Japan."],"referencedReports":[],"body":"\u003cp\u003eJapan’s Ministry of Education, Culture, Sports, Science and Technology (MEXT) disclosed that hackers breached its government procurement system. The ministry detected the intrusion on October 1, nearly two months before announcing it publicly. Its investigation found that the intruders may have obtained information stored in the system’s database.\u003c/p\u003e\n\n\u003cp\u003eThe potentially exposed information includes nearly 1,700 email addresses and 164,000 records containing company names, employee names, and other business information. The system publishes government tenders, contracts, and procurement opportunities, and the affected records concern companies eligible to participate in ministry bidding processes. MEXT said it blocked the system’s communications with internal and external networks, found no evidence of public disclosure or misuse, and reported the incident to Japan’s data protection authorities while continuing its investigation with other government agencies.\u003c/p\u003e\n"},{"n":1,"title":"Malwarebytes Antivirus: Get 50% off during Black Friday 2026","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malwarebytes-antivirus-get-50-percent-off-during-black-friday-2026/","time":"14:22","priority":"MAY READ","score":15,"tldr":"Malwarebytes is offering 50% off its individual, family, and small-business security subscriptions through December 6, 2026, with plans starting at $29.99 per year for three devices.","briefOverview":"\u003cp\u003eMalwarebytes has launched its 2026 Black Friday and Cyber Monday \u0026ldquo;Block Friday\u0026rdquo; promotion, offering 50% off annual security subscriptions for individuals, families, and small businesses. The sale runs through December 6, 2026, at 11:59 PM PST. Discounted individual plans begin at $29.99 per year for Malwarebytes Standard, which covers three devices.\u003c/p\u003e\n\n\u003cp\u003eThe plans provide varying combinations of antivirus and anti-malware protection, scam and malicious website protection, ad blocking, and a no-log VPN. Essential and Ultimate plans add identity theft protection, while Ultimate includes up to $2 million in insurance coverage, three-bureau credit monitoring, and personal data removal. Family subscriptions cover up to 10 devices, and small-business subscriptions cover three, 10, or 20 devices across PCs, Macs, Android devices, and iPhones.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Malwarebytes' \"Block Friday\" sale offers 50% off individual, family, and small-business security subscriptions through December 6, 2026, at 11:59 PM PST.","Individual plans start at $29.99 per year for Malwarebytes Standard, which covers three devices with antivirus, anti-malware, scam protection, and ad blocking.","Family subscriptions cover up to 10 devices and start at $59.99 per year for Malwarebytes Standard Family.","Small-business plans cover three, 10, or 20 devices and range from $59.99 to $399.99 per year during the promotion.","Higher-tier Essential and Ultimate plans add identity protection, while Ultimate also includes three-bureau credit monitoring and personal data removal."],"insights":["The lowest-priced individual plan provides protection for three devices, while the family plan expands coverage to 10 devices for twice the discounted annual price.","Malwarebytes’ higher-tier plans extend beyond device protection by adding identity theft coverage, while Ultimate adds three-bureau credit monitoring and personal data removal.","Small-business plans use the same 50% discount structure as consumer plans but scale from three to 20 protected devices.","Feature availability can differ by operating system, so the exact protections included may depend on the device being used.","Existing Malwarebytes customers may have personalized offers available through their MyAccount dashboard."],"referencedReports":[],"body":"\u003cp\u003eMalwarebytes has launched its 2026 Black Friday and Cyber Monday \u0026ldquo;Block Friday\u0026rdquo; promotion, offering 50% off annual security subscriptions for individuals, families, and small businesses. The sale runs through December 6, 2026, at 11:59 PM PST. Discounted individual plans begin at $29.99 per year for Malwarebytes Standard, which covers three devices.\u003c/p\u003e\n\n\u003cp\u003eThe plans provide varying combinations of antivirus and anti-malware protection, scam and malicious website protection, ad blocking, and a no-log VPN. Essential and Ultimate plans add identity theft protection, while Ultimate includes up to $2 million in insurance coverage, three-bureau credit monitoring, and personal data removal. Family subscriptions cover up to 10 devices, and small-business subscriptions cover three, 10, or 20 devices across PCs, Macs, Android devices, and iPhones.\u003c/p\u003e\n"}]</script>
