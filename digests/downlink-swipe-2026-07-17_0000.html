<script type="application/json" id="dl-articles">[{"n":12,"title":"CISA Adds Exploited SharePoint RCE Zero-Day CVE-2026-58644 to KEV","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/cisa-adds-exploited-sharepoint-rce-zero.html","time":"06:42","priority":"MUST READ","score":96,"tldr":"CISA added a newly patched Microsoft SharePoint Server zero-day, CVE-2026-58644, to its Known Exploited Vulnerabilities catalog after confirming active exploitation, requiring U.S. federal agencies to patch by July 19, 2026. Organizations running on-premises SharePoint should urgently apply updates, verify defenses like AMSI, and check for signs of compromise.","briefOverview":"\u003cp\u003eCISA added a newly patched Microsoft SharePoint Server vulnerability, CVE-2026-58644, to its Known Exploited Vulnerabilities catalog. Federal Civilian Executive Branch agencies are required to apply the fixes by July 19, 2026. Microsoft revised its bulletin to clarify that the flaw has been exploited in the wild, meaning it was used as a zero-day before patches were available.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-58644 is a critical deserialization of untrusted data vulnerability with a CVSS score of 9.8. Microsoft said that, in a network-based attack, an attacker authenticated as at least a Site Owner could write arbitrary code to inject and execute code remotely on the SharePoint Server. The flaw affects Microsoft SharePoint Server Subscription Edition, Microsoft SharePoint Server 2019, and Microsoft SharePoint Enterprise Server 2016.\u003c/p\u003e\n\n\u003cp\u003eCISA also warned of active exploitation of multiple SharePoint Server vulnerabilities, including CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, and CVE-2026-58644, that could allow unauthorized access to on-premises instances. The agency said the activity can involve remote code execution and post-exploitation actions such as stealing IIS machine keys, using deserialization techniques for persistence, and deploying malware. CISA recommended applying Microsoft updates, verifying AMSI integration, removing intrusion artifacts before rotating IIS machine keys, improving logging, limiting internet exposure, and restricting access to SharePoint Central Administration.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-58644, a newly patched Microsoft SharePoint Server flaw, to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by July 19, 2026.","CVE-2026-58644 is a critical deserialization of untrusted data vulnerability with a CVSS score of 9.8 that allows an unauthorized attacker to execute arbitrary code.","Microsoft said the vulnerability can be exploited remotely over the internet and has low attack complexity because attackers need no significant prior system knowledge and can repeatedly succeed with a payload against the vulnerable component.","The vulnerability affects Microsoft SharePoint Server Subscription Edition, Microsoft SharePoint Server 2019, and Microsoft SharePoint Enterprise Server 2016.","CISA warned that multiple SharePoint Server vulnerabilities, including CVE-2026-58644, are being actively exploited to gain unauthorized access to on-premises instances and support post-exploitation activity such as stealing IIS machine keys and deploying malware."],"insights":["CISA’s July 19, 2026 deadline gives federal agencies only a few days from the July 14 Patch Tuesday release to remediate CVE-2026-58644, reflecting the urgency created by confirmed exploitation before fixes were available.","CISA specifically advises removing intrusion artifacts before rotating IIS machine keys, because rotating keys while harvesting tools remain present could allow attackers to steal the new keys as well.","The SharePoint hardening guidance goes beyond patching by recommending reduced internet exposure, blocked external access to Central Administration, and restricted farm and database communications, indicating that configuration changes are part of the immediate containment strategy.","Microsoft revised its bulletin after release to clarify that CVE-2026-58644 had been exploited in the wild, meaning organizations relying only on the original Patch Tuesday context may have underestimated the urgency of the update."],"referencedReports":[{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/16/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites this CISA alert as the source for adding CVE-2026-58644 and two Fortinet flaws to the KEV catalog.","category":"advisory","primary":true},{"title":"CVE-2026-58644","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-58644","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for details on the SharePoint Server vulnerability, its exploitability, and affected versions.","category":"advisory","primary":true},{"title":"CISA Urges SharePoint Hardening After New Exploitations","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations","publisher":"CISA","context":"The article references this CISA warning about active exploitation of multiple SharePoint Server vulnerabilities and recommended hardening measures.","category":"advisory","primary":false},{"title":"SharePoint Server security hardening","url":"https://learn.microsoft.com/en-us/sharepoint/security-for-sharepoint-server/security-hardening","publisher":"Microsoft","context":"The article points readers to Microsoft’s SharePoint Server security-hardening guidance as part of CISA’s recommended containment measures.","category":"guide","primary":false},{"title":"CVE-2026-39808 Fortinet FortiSandbox Command Injection","url":"https://www.crowdsec.net/vulntracking-report/cve-2026-39808-fortinet-fortisandbox-command-injection","publisher":"CrowdSec","context":"The article cites this report in connection with active exploitation of a Fortinet FortiSandbox flaw added to CISA’s KEV catalog.","category":"research","primary":false}],"body":"\u003cp\u003eCISA added a newly patched Microsoft SharePoint Server vulnerability, CVE-2026-58644, to its Known Exploited Vulnerabilities catalog. Federal Civilian Executive Branch agencies are required to apply the fixes by July 19, 2026. Microsoft revised its bulletin to clarify that the flaw has been exploited in the wild, meaning it was used as a zero-day before patches were available.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-58644 is a critical deserialization of untrusted data vulnerability with a CVSS score of 9.8. Microsoft said that, in a network-based attack, an attacker authenticated as at least a Site Owner could write arbitrary code to inject and execute code remotely on the SharePoint Server. The flaw affects Microsoft SharePoint Server Subscription Edition, Microsoft SharePoint Server 2019, and Microsoft SharePoint Enterprise Server 2016.\u003c/p\u003e\n\n\u003cp\u003eCISA also warned of active exploitation of multiple SharePoint Server vulnerabilities, including CVE-2026-32201, CVE-2026-45659, CVE-2026-56164, and CVE-2026-58644, that could allow unauthorized access to on-premises instances. The agency said the activity can involve remote code execution and post-exploitation actions such as stealing IIS machine keys, using deserialization techniques for persistence, and deploying malware. CISA recommended applying Microsoft updates, verifying AMSI integration, removing intrusion artifacts before rotating IIS machine keys, improving logging, limiting internet exposure, and restricting access to SharePoint Central Administration.\u003c/p\u003e\n"},{"n":16,"title":"New wp2shell WordPress Core Flaw Lets Unauthenticated Attackers Run Code","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-wp2shell-wordpress-core-flaw-lets.html","time":"21:20","priority":"MUST READ","score":96,"tldr":"WordPress patched a critical pre-authentication remote code execution flaw in core affecting versions 6.9.0–6.9.4 and 7.0.0–7.0.1, where anonymous requests could exploit the REST API batch endpoint on default installs. Site owners should verify they are running 6.9.5 or 7.0.2 rather than relying on auto-updates, since there is no CVE yet and scanners may miss it.","briefOverview":"\u003cp\u003eWordPress released versions 6.9.5 and 7.0.2 on July 17, 2026, to fix a pre-authentication remote code execution flaw in core. The article says an anonymous HTTP request could run code on a default WordPress site with no plugins installed. The affected ranges are WordPress 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, and WordPress enabled forced updates through its auto-update system.\u003c/p\u003e\n\n\u003cp\u003eAdam Kues at Assetnote, Searchlight Cyber’s attack surface management arm, found the flaw and reported it through WordPress’s HackerOne program. Searchlight Cyber published a writeup under the name wp2shell, but it is withholding technical details for now and instead provides a checker for site owners. WordPress described the issue as “a REST API batch-route confusion and SQL injection issue leading to Remote Code Execution,” and the 7.0.2 version page lists changes touching REST API and query-related files.\u003c/p\u003e\n\n\u003cp\u003eThe article stresses that site owners should check their actual WordPress version because WordPress has not said whether the forced push reaches sites that turned auto-updates off. There was no CVE ID or CVSS score by July 18, meaning CVE-based scanners and inventories would not flag the issue and CISA could not add it to the KEV catalog. Searchlight Cyber’s temporary mitigations focus on blocking anonymous access to the batch endpoint, but the article says these are stopgaps that may break legitimate integrations until sites update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress released versions 6.9.5 and 7.0.2 on July 17, 2026, to fix a pre-authentication remote code execution flaw in core that anonymous requests could trigger on a default install with no plugins.","The affected WordPress versions are 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while WordPress 7.1 beta2 also carries the same fix.","WordPress described the issue reported by Adam Kues of Assetnote as a REST API batch-route confusion and SQL injection issue leading to remote code execution.","No CVE ID or CVSS score had been assigned by July 18, so CVE-based scanners, inventories, and CISA’s KEV catalog would not flag the issue.","Searchlight Cyber recommended temporary mitigations that block anonymous access to the batch endpoint, including WAF rules for both /wp-json/batch/v1 and rest_route=/batch/v1, disabling unauthenticated REST API access, or using a drop-in plugin."],"insights":["Administrators should verify the installed WordPress version directly, because WordPress has not said whether its forced update reaches sites that disabled auto-updates.","CVE-based vulnerability management will miss this issue for now, because neither advisory includes a CVE ID and no CVE record had appeared by July 18.","Mitigations that block only the /wp-json/batch/v1 path are incomplete, because the article says the query-string route rest_route=/batch/v1 remains open unless it is also blocked.","The vulnerable population is smaller than the headline WordPress install base, because the flawed code exists only from WordPress 6.9 onward and 6.9 shipped on December 2, 2025.","Open-source patch diffing may quickly reveal the bug despite withheld technical details, because WordPress 7.0.1 and 7.0.2 are both publicly available in the release archive."],"referencedReports":[{"title":"wp2shell: Pre-Authentication RCE in WordPress Core","url":"https://slcyber.io/research-center/wp2shell-pre-authentication-rce-in-wordpress-core","publisher":"Searchlight Cyber","context":"The article cites Searchlight Cyber's writeup on the wp2shell flaw, which says the attack has no preconditions and can be exploited by an anonymous user.","category":"research","primary":true},{"title":"WordPress 7.0.2 Release","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article references WordPress's release post for its description of the flaw as a REST API batch-route confusion and SQL injection issue leading to remote code execution.","category":"advisory","primary":true},{"title":"Keys to the Kingdom: Anonymous SQL Injection in Drupal Core CVE-2026-9082","url":"https://slcyber.io/research-center/keys-to-the-kingdom-anonymous-sql-injection-in-drupal-core-cve-2026-9082/","publisher":"Searchlight Cyber","context":"The article cites this prior Searchlight Cyber teardown as an example of how quickly a public open-source fix can be turned into working proof-of-concept exploits.","category":"research","primary":false}],"body":"\u003cp\u003eWordPress released versions 6.9.5 and 7.0.2 on July 17, 2026, to fix a pre-authentication remote code execution flaw in core. The article says an anonymous HTTP request could run code on a default WordPress site with no plugins installed. The affected ranges are WordPress 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, and WordPress enabled forced updates through its auto-update system.\u003c/p\u003e\n\n\u003cp\u003eAdam Kues at Assetnote, Searchlight Cyber’s attack surface management arm, found the flaw and reported it through WordPress’s HackerOne program. Searchlight Cyber published a writeup under the name wp2shell, but it is withholding technical details for now and instead provides a checker for site owners. WordPress described the issue as “a REST API batch-route confusion and SQL injection issue leading to Remote Code Execution,” and the 7.0.2 version page lists changes touching REST API and query-related files.\u003c/p\u003e\n\n\u003cp\u003eThe article stresses that site owners should check their actual WordPress version because WordPress has not said whether the forced push reaches sites that turned auto-updates off. There was no CVE ID or CVSS score by July 18, meaning CVE-based scanners and inventories would not flag the issue and CISA could not add it to the KEV catalog. Searchlight Cyber’s temporary mitigations focus on blocking anonymous access to the batch endpoint, but the article says these are stopgaps that may break legitimate integrations until sites update.\u003c/p\u003e\n"},{"n":24,"title":"Unauthenticated RCE in WordPress core (wp2shell)","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/unauthenticated-rce-in-wordpress-wp2shell","time":"21:19","priority":"MUST READ","score":96,"tldr":"WordPress issued emergency updates for a critical unauthenticated RCE in core affecting versions 6.9.0–6.9.4 and 7.0.0–7.0.1, with fixes in 6.9.5 and 7.0.2. Site owners should patch immediately or temporarily block the vulnerable REST batch endpoint until they can update.","briefOverview":"\u003cp\u003eWordPress released an emergency security update on July 17 for an unauthenticated remote code execution flaw in WordPress core. Version 7.0.2 fixes the issue, and WordPress.org has turned on forced auto-updates for affected sites because of its severity. The article says an anonymous attacker can trigger the flaw against a stock WordPress install with no plugins involved.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is described as a REST API batch-route confusion and SQL injection issue that chains into remote code execution. The batch endpoint at \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e is identified as the entry point, and the issue is tracked in Aikido Intel as \u003ccode\u003eAIKIDO-2026-696183\u003c/code\u003e. Adam Kues at Searchlight Cyber reported the flaw and published a checker at \u003ccode\u003ewp2shell.com\u003c/code\u003e, though the article notes the site has sometimes gone offline.\u003c/p\u003e\n\n\u003cp\u003eThe remote code execution flaw affects WordPress 6.9.0 through 6.9.4, WordPress 7.0.0 through 7.0.1, and WordPress 7.1 beta. Fixed versions are 6.9.5, 7.0.2, and 7.1 beta2, while WordPress 6.8 is exposed to a separate SQL injection issue patched by moving to 6.8.6. If sites cannot update immediately, the article lists temporary measures such as blocking unauthenticated REST API access, blocking \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e and \u003ccode\u003erest_route=/batch/v1\u003c/code\u003e, or requiring authentication on the REST batch route.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["WordPress released emergency security update 7.0.2 on July 17 to fix an unauthenticated remote code execution flaw in WordPress core.","The flaw can be triggered by an anonymous attacker against a stock WordPress install with no plugins involved and uses the REST API batch endpoint at `/wp-json/batch/v1` as the entry point.","The remote code execution flaw affects WordPress 6.9.0 through 6.9.4, WordPress 7.0.0 through 7.0.1, and WordPress 7.1 beta.","WordPress.org has turned on forced auto-updates for affected sites because of the severity of the issue.","If immediate updating is not possible, the article says temporary measures include blocking unauthenticated REST API access, blocking `/wp-json/batch/v1` and `rest_route=/batch/v1` at a WAF, or requiring authentication on the REST batch route."],"insights":["The article says WordPress.org enabled forced auto-updates for affected sites, which signals that normal optional update behavior was considered insufficient for this issue.","Sites running versions below 6.9.0 are not vulnerable to the remote code execution flaw, but WordPress 6.8 still needs attention because it is exposed to a separate SQL injection issue fixed in the same update round.","The suggested temporary mitigations can disrupt legitimate REST API traffic, so the article frames them only as short-term cover until patching is possible.","The vulnerability chain starts from a REST API batch-route issue and SQL injection, showing that an input-handling flaw can escalate into full remote code execution in WordPress core.","The article emphasizes that the flaw affects stock WordPress installations with no plugins, making plugin removal or plugin auditing irrelevant as a primary response for this issue."],"referencedReports":[{"title":"WordPress 7.0.2 Release","url":"https://wordpress.org/news/2026/07/wordpress-7-0-2-release/","publisher":"WordPress","context":"The article cites WordPress's emergency security update as the source for the fixed unauthenticated remote code execution flaw in WordPress core.","category":"advisory","primary":true}],"body":"\u003cp\u003eWordPress released an emergency security update on July 17 for an unauthenticated remote code execution flaw in WordPress core. Version 7.0.2 fixes the issue, and WordPress.org has turned on forced auto-updates for affected sites because of its severity. The article says an anonymous attacker can trigger the flaw against a stock WordPress install with no plugins involved.\u003c/p\u003e\n\n\u003cp\u003eThe flaw is described as a REST API batch-route confusion and SQL injection issue that chains into remote code execution. The batch endpoint at \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e is identified as the entry point, and the issue is tracked in Aikido Intel as \u003ccode\u003eAIKIDO-2026-696183\u003c/code\u003e. Adam Kues at Searchlight Cyber reported the flaw and published a checker at \u003ccode\u003ewp2shell.com\u003c/code\u003e, though the article notes the site has sometimes gone offline.\u003c/p\u003e\n\n\u003cp\u003eThe remote code execution flaw affects WordPress 6.9.0 through 6.9.4, WordPress 7.0.0 through 7.0.1, and WordPress 7.1 beta. Fixed versions are 6.9.5, 7.0.2, and 7.1 beta2, while WordPress 6.8 is exposed to a separate SQL injection issue patched by moving to 6.8.6. If sites cannot update immediately, the article lists temporary measures such as blocking unauthenticated REST API access, blocking \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e and \u003ccode\u003erest_route=/batch/v1\u003c/code\u003e, or requiring authentication on the REST batch route.\u003c/p\u003e\n"},{"n":3,"title":"CISA urges immediate action on actively exploited Fortinet flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-feds-to-patch-exploited-fortinet-fortisandbox-flaws-by-sunday/","time":"07:03","priority":"MUST READ","score":95,"tldr":"CISA says two critical Fortinet FortiSandbox command-injection flaws are being actively exploited and ordered U.S. federal agencies to patch affected systems by July 19. Admins should upgrade FortiSandbox immediately to block unauthenticated remote code execution attacks.","briefOverview":"\u003cp\u003eCISA ordered U.S. government agencies to prioritize patching two actively exploited critical vulnerabilities in Fortinet FortiSandbox, tracked as CVE-2026-39808 and CVE-2026-25089. Fortinet addressed the flaws on April 14 and June 9, respectively. Under Binding Operational Directive 26-04, federal agencies must patch vulnerable FortiSandbox instances by Sunday, July 19.\u003c/p\u003e\n\n\u003cp\u003eFortinet said successful exploitation can allow unauthenticated threat actors to execute unauthorized code remotely through low-complexity command injection attacks that require no user interaction. Admins are advised to upgrade affected deployments to the latest released versions to resolve the issues and block incoming attacks. Although Fortinet had not yet marked the two flaws as exploited, threat intelligence company Defused reported on June 16 that attackers had begun abusing multiple FortiSandbox vulnerabilities in the wild.\u003c/p\u003e\n\n\u003cp\u003eCISA also confirmed that the flaws are actively exploited and added them to its Known Exploited Vulnerabilities catalog. The article notes that Fortinet vulnerabilities are often exploited in cyber espionage campaigns and ransomware attacks, including as zero-days. CISA tracks 28 Fortinet vulnerabilities exploited in attacks in recent years, 13 of which have also been abused in ransomware attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA ordered U.S. government agencies to prioritize patching two actively exploited critical vulnerabilities in Fortinet FortiSandbox, tracked as CVE-2026-39808 and CVE-2026-25089.","Fortinet addressed CVE-2026-39808 on April 14 and CVE-2026-25089 on June 9.","Successful exploitation of the flaws can allow unauthenticated threat actors to execute unauthorized code remotely through low-complexity command injection attacks that require no user interaction.","CISA added the two FortiSandbox vulnerabilities to its Known Exploited Vulnerabilities catalog and required U.S. federal agencies to patch vulnerable instances by July 19.","Defused reported on June 16 that attackers had started exploiting multiple Fortinet FortiSandbox vulnerabilities in the wild, including CVE-2026-39808 and CVE-2026-25089."],"insights":["Fortinet had not labeled the two FortiSandbox flaws as exploited at the time of the article, but CISA still added them to its Known Exploited Vulnerabilities catalog after Defused reported in-the-wild abuse.","The federal patch deadline was very short: CISA added the flaws on Thursday and required U.S. federal agencies to patch vulnerable FortiSandbox instances by Sunday, July 19.","Defused reported exploitation of CVE-2026-39813 alongside the two CISA-listed flaws, noting that CVE-2026-39813 had no previous recorded exploitation.","CISA tracks 28 Fortinet vulnerabilities exploited in attacks in recent years, and 13 of those have also been abused in ransomware attacks."],"referencedReports":[{"title":"FortiSandbox - Command Injection Vulnerability in CLI component","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-100","publisher":"Fortinet","context":"The article cites this Fortinet security advisory as the source for details on CVE-2026-39808, one of the critical FortiSandbox flaws addressed by Fortinet.","category":"advisory","primary":true},{"title":"FortiSandbox - Command Injection Vulnerability","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-141","publisher":"Fortinet","context":"The article cites this Fortinet security advisory as the source for details on CVE-2026-25089, one of the critical FortiSandbox flaws addressed by Fortinet.","category":"advisory","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/15/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references this CISA alert to report that CISA confirmed the FortiSandbox flaws are actively exploited in the wild and added them to its Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA ordered U.S. government agencies to prioritize patching two actively exploited critical vulnerabilities in Fortinet FortiSandbox, tracked as CVE-2026-39808 and CVE-2026-25089. Fortinet addressed the flaws on April 14 and June 9, respectively. Under Binding Operational Directive 26-04, federal agencies must patch vulnerable FortiSandbox instances by Sunday, July 19.\u003c/p\u003e\n\n\u003cp\u003eFortinet said successful exploitation can allow unauthenticated threat actors to execute unauthorized code remotely through low-complexity command injection attacks that require no user interaction. Admins are advised to upgrade affected deployments to the latest released versions to resolve the issues and block incoming attacks. Although Fortinet had not yet marked the two flaws as exploited, threat intelligence company Defused reported on June 16 that attackers had begun abusing multiple FortiSandbox vulnerabilities in the wild.\u003c/p\u003e\n\n\u003cp\u003eCISA also confirmed that the flaws are actively exploited and added them to its Known Exploited Vulnerabilities catalog. The article notes that Fortinet vulnerabilities are often exploited in cyber espionage campaigns and ransomware attacks, including as zero-days. CISA tracks 28 Fortinet vulnerabilities exploited in attacks in recent years, 13 of which have also been abused in ransomware attacks.\u003c/p\u003e\n"},{"n":17,"title":"GoldenEyeDog Subgroup Linked to DigiCert Breach and Code-Signing Certificate Theft","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/goldeneyedog-subgroup-linked-to.html","time":"16:39","priority":"MUST READ","score":94,"tldr":"Researchers attributed DigiCert’s April 2026 breach to CylindricalCanine, a GoldenEyeDog subgroup that compromised support analyst workstations via a malicious “screenshot” file and stole EV code-signing certificate access. The attackers used the certificates to sign Golden Gh0st RAT/Zhong Stealer malware, highlighting the risk of certificate abuse in malware delivery.","briefOverview":"\u003cp\u003eCybersecurity researchers at Expel attributed the April 2026 DigiCert security incident to CylindricalCanine, a subgroup of GoldenEyeDog, also known as APT-Q-27, Dragon Breath, and Miuuti Group. DigiCert said the threat actor contacted its support team through a customer chat channel and delivered a ZIP file disguised as a customer screenshot, which contained a malicious .scr executable. The attackers gained access to two support analyst workstations and used a customer-support portal function to access initialization codes for approved but pending EV Code Signing certificate orders.\u003c/p\u003e\n\n\u003cp\u003eDigiCert revoked 60 certificates issued by several certificate authorities, and 27 of them were explicitly linked to the threat actor. The article says the stolen or abused certificates were used to sign Zhong Stealer malware artifacts, helping the malware appear more trustworthy. DigiCert said the issue stemmed from a threat model that did not account for initialization codes being visible to a compromised support analyst account through the portal function.\u003c/p\u003e\n\n\u003cp\u003eExpel said CylindricalCanine commonly distributes files disguised as screenshots through phishing emails or support-portal submissions. The attack chain uses a link to download additional payloads, triggers DLL side-loading through a legitimate executable, displays a decoy PDF with an HTTP 503 error, and then loads an encrypted payload. The final malware, Golden Gh0st RAT, can set up persistence, steal sensitive data, create a SOCKS proxy tunnel, log keystrokes, take screenshots, execute shell commands, drop more payloads, and clear Windows Event logs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Expel attributed the April 2026 DigiCert security incident to CylindricalCanine, described as a subgroup of the Chinese cybercrime group GoldenEyeDog, also known as APT-Q-27, Dragon Breath, and Miuuti Group.","DigiCert said the threat actor contacted its support team through a customer chat channel on April 2, 2026, and delivered a ZIP file disguised as a customer screenshot that contained a malicious .scr executable.","The attackers compromised two DigiCert support analyst workstations and used a customer-support portal function to access initialization codes for approved but pending EV Code Signing certificate orders across a finite set of customer accounts.","DigiCert revoked 60 fraudulently obtained certificates, including 27 explicitly linked to the threat actor, and the exploited certificates were used to sign Zhong Stealer malware artifacts.","Expel said CylindricalCanine’s attack chain uses phishing files disguised as screenshots, DLL side-loading, and Golden Gh0st RAT, which can steal data, log keystrokes, take screenshots, execute shell commands, and clear Windows Event logs."],"insights":["DigiCert said the critical weakness was not certificate issuance approval itself, but that initialization codes visible inside an internal support portal were functionally sufficient, together with approved orders, to obtain EV Code Signing certificates.","The incident shows that customer support channels can become a direct path into high-value internal systems, because the initial payload was delivered through a customer chat interaction rather than a conventional email-only phishing route.","CylindricalCanine’s use of decoy screenshot-themed files and a fake HTTP 503 PDF indicates the attack chain was designed to look like a normal support troubleshooting exchange while malware executed in the background.","DigiCert’s mitigation focused on masking initialization codes from proxied users in both the UI and API, showing that sensitive support-portal data exposure can matter as much as account compromise in certificate abuse scenarios."],"referencedReports":[{"title":"Introducing CylindricalCanine","url":"https://expel.com/blog/introducing-cylindricalcanine/","publisher":"Expel","context":"The article cites Expel’s analysis as the source attributing the April 2026 DigiCert incident to CylindricalCanine and describing the actor’s malware and attack chain.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers at Expel attributed the April 2026 DigiCert security incident to CylindricalCanine, a subgroup of GoldenEyeDog, also known as APT-Q-27, Dragon Breath, and Miuuti Group. DigiCert said the threat actor contacted its support team through a customer chat channel and delivered a ZIP file disguised as a customer screenshot, which contained a malicious .scr executable. The attackers gained access to two support analyst workstations and used a customer-support portal function to access initialization codes for approved but pending EV Code Signing certificate orders.\u003c/p\u003e\n\n\u003cp\u003eDigiCert revoked 60 certificates issued by several certificate authorities, and 27 of them were explicitly linked to the threat actor. The article says the stolen or abused certificates were used to sign Zhong Stealer malware artifacts, helping the malware appear more trustworthy. DigiCert said the issue stemmed from a threat model that did not account for initialization codes being visible to a compromised support analyst account through the portal function.\u003c/p\u003e\n\n\u003cp\u003eExpel said CylindricalCanine commonly distributes files disguised as screenshots through phishing emails or support-portal submissions. The attack chain uses a link to download additional payloads, triggers DLL side-loading through a legitimate executable, displays a decoy PDF with an HTTP 503 error, and then loads an encrypted payload. The final malware, Golden Gh0st RAT, can set up persistence, steal sensitive data, create a SOCKS proxy tunnel, log keystrokes, take screenshots, execute shell commands, drop more payloads, and clear Windows Event logs.\u003c/p\u003e\n"},{"n":26,"title":"New North Korean campaign uses fake coding interviews to steal developer credentials","source":"elastic.co","sourceColorIdx":1,"link":"https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography","time":"00:00","priority":"MUST READ","score":94,"tldr":"Elastic Security Labs uncovered a DPRK-aligned Contagious Interview campaign that lures developers with fake coding challenges and hides OTTERCOOKIE-like malware inside SVG files. Running the trojanized projects can steal browser credentials, crypto wallets, sensitive files and clipboard data while installing a Socket.IO-based remote access backdoor.","briefOverview":"\u003cp\u003eElastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter targeted its community Slack workspace with a job posting and coding challenge. The trojanized projects were fully functional e-commerce templates, but they silently executed malicious code when users ran the server. Elastic said the activity overlaps with prior reporting on OTTERCOOKIE based on code similarity, behavior, and related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaign matters because developers are the direct targets, and a compromised developer machine can provide attackers with access to credentials, keys, wallets, files, and potentially downstream organizations. The payload delivered four main capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The malware collected browser login data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.\u003c/p\u003e\n\n\u003cp\u003eA key technique in the infection chain was hiding Base64 payload fragments inside HTML comments across SVG flag images in the project’s assets directory. A JavaScript file reassembled the fragments in alphabetical order, decoded them with a custom Base64 function, and executed the result with eval during server startup. Elastic also observed command-and-control activity using rightwidth[.]dev subdomains, including upload endpoints, a Socket.IO controller, and Windows second-stage download paths.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Elastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter posted a job offer in its community Slack workspace and sent developers a trojanized coding challenge.","The trojanized projects hid Base64-encoded payload fragments inside HTML comments across SVG flag images, then reassembled and executed the payload when the project server started.","Running the malicious project delivered four OTTERCOOKIE-aligned capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer.","The malware targeted developer machines across Windows, macOS, and Linux by collecting browser data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.","Elastic linked the activity to Contagious Interview based on code similarity, behavior, and infrastructure overlapping with prior reporting on OTTERCOOKIE and related DPRK campaigns."],"insights":["The trojanized repositories had zero antivirus detections at the time of writing, showing that benign-looking coding assignments can evade standard file reputation checks even when they contain active credential theft and remote access code.","The campaign used fully functional e-commerce projects copied from legitimate templates, so a project running correctly was not evidence that it was safe.","The malware avoided simple detection patterns by hiding payload fragments in SVG comments and decoding them with a custom Base64 function before using eval, rather than relying on common decoding methods such as Buffer.from or atob.","The file stealer’s exclusion list deliberately avoided many common developer and AI-coding-tool directories such as .claude, .cursor, .gemini, and .windsurf, indicating the attackers tuned collection to reduce noise on developer systems.","The malware tagged virtual machines and sandboxes in its command-and-control response but did not stop running, which means analysis environments may still observe behavior while operators can separately prioritize likely real victims."],"referencedReports":[{"title":"Contagious Interview malware delivered through fake developer job interviews","url":"https://www.microsoft.com/en-us/security/blog/2026/03/11/contagious-interview-malware-delivered-through-fake-developer-job-interviews/","publisher":"Microsoft","context":"The article cites this Microsoft blog as prior public reporting whose strings, behavior, and script layout overlap with the malicious JavaScript analyzed by Elastic.","category":"research","primary":false},{"title":"OTTERCOOKIE Contagious Interview analysis","url":"https://jp.security.ntt/insights_resources/tech_blog/en-contagious-interview-ottercookie/","publisher":"NTT Security","context":"The article references NTT Security’s OTTERCOOKIE analysis as prior research on the malware family that Elastic says its samples resemble.","category":"research","primary":false},{"title":"Rollup polyfill masquerading infrastructure","url":"https://research.jfrog.com/post/rollup-polyfill-masquerading/","publisher":"JFrog Security","context":"The article cites JFrog Security research because the observed API endpoints in Elastic’s samples matched infrastructure recently linked by JFrog.","category":"research","primary":false}],"body":"\u003cp\u003eElastic Security Labs discovered a new DPRK-aligned Contagious Interview campaign, tracked as REF9403, after a fake recruiter targeted its community Slack workspace with a job posting and coding challenge. The trojanized projects were fully functional e-commerce templates, but they silently executed malicious code when users ran the server. Elastic said the activity overlaps with prior reporting on OTTERCOOKIE based on code similarity, behavior, and related infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe campaign matters because developers are the direct targets, and a compromised developer machine can provide attackers with access to credentials, keys, wallets, files, and potentially downstream organizations. The payload delivered four main capabilities: a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The malware collected browser login data, wallet extension databases, sensitive files, shell histories, cloud and SSH configuration paths, and macOS keychain data.\u003c/p\u003e\n\n\u003cp\u003eA key technique in the infection chain was hiding Base64 payload fragments inside HTML comments across SVG flag images in the project’s assets directory. A JavaScript file reassembled the fragments in alphabetical order, decoded them with a custom Base64 function, and executed the result with eval during server startup. Elastic also observed command-and-control activity using rightwidth[.]dev subdomains, including upload endpoints, a Socket.IO controller, and Windows second-stage download paths.\u003c/p\u003e\n"},{"n":18,"title":"New NadMesh Botnet Hunts Exposed AI Services for Cloud Keys and Kubernetes Tokens","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-nadmesh-botnet-hunts-exposed-ai.html","time":"17:12","priority":"MUST READ","score":92,"tldr":"The new Go-based NadMesh botnet is scanning exposed AI and developer services to steal AWS keys, Kubernetes tokens, Docker credentials, and model/tool access rather than just hijacking compute. Organizations running ComfyUI, Ollama, n8n, Gradio, MCP, Docker, Jenkins, Redis, or similar services should remove them from the public internet, enforce authentication, check persistence paths, and revoke exposed credentials.","briefOverview":"\u003cp\u003eA Go botnet called \u003cstrong\u003eNadMesh\u003c/strong\u003e appeared in early July and is scanning exposed AI services such as ComfyUI, Ollama, n8n, Open WebUI, Langflow, and Gradio. QiAnXin’s XLab named the malware after the “n4d mesh controller” string in its source and published analysis of the botnet, its operator panel, and observed traffic. The operator’s dashboard claimed 3,811 unique AWS keys, while XLab’s sensors saw distinct source IPs pushing NadMesh rise to around 139 per day in the first week of July.\u003c/p\u003e\n\n\u003cp\u003eThe article says NadMesh is primarily after cloud and platform access rather than the infected host itself. It collects cloud keys from environment variables, Kubernetes service account tokens, and files including \u003ccode\u003e~/.aws/config\u003c/code\u003e, \u003ccode\u003e.env\u003c/code\u003e, and \u003ccode\u003e~/.docker/config.json\u003c/code\u003e. XLab’s observed exploit traffic was led by Docker API remote code execution at 30.31% and Jenkins script console remote code execution at 22.28%, while MCP command execution appeared at 0.78%.\u003c/p\u003e\n\n\u003cp\u003eNadMesh uses adaptive scanning, repeatedly prioritizing subnets and IPs that previously produced hits and blacklisting targets that absorb ten deployment attempts without returning results. The article says the agent persists in three ways, uses Garble obfuscation, UPX packing, and random padding, and therefore does not share one stable hash across builds. It advises operators to place exposed services behind authentication or remove them from the public internet, check specified drop paths, isolate infected hosts, and revoke credentials the host could access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["QiAnXin’s XLab reported that the Go botnet NadMesh appeared in early July and is scanning exposed AI services including ComfyUI, Ollama, n8n, Open WebUI, Langflow, and Gradio.","NadMesh collects cloud keys from environment variables, Kubernetes service account tokens, and files such as ~/.aws/config, .env, and ~/.docker/config.json.","The operator’s dashboard claimed 3,811 unique AWS keys, while XLab observed distinct source IPs pushing NadMesh rise to about 139 per day in the first week of July.","XLab’s observed exploit traffic was led by docker_containers_api_rce at 30.31% and jenkins_scripttext_rce at 22.28%, while mcp_cmd_execute appeared in the smaller unlabeled tail at 0.78%.","The article advises operators of exposed services to place them behind authentication or remove them from the public internet, check listed persistence paths, isolate infected hosts, and revoke credentials the host could access."],"insights":["NadMesh’s own dashboard metrics are internally inconsistent, so XLab’s sensor data and observed exploit traffic provide a more reliable view than the operator’s claimed bot counts or success totals.","Although NadMesh is positioned around exposed AI services, XLab’s traffic chart shows most observed exploit attempts still target Docker APIs and Jenkins consoles, with MCP command execution accounting for only 0.78% of observed traffic.","The botnet’s success scoring explicitly excludes Ollama and AWS harvesting, meaning the operator’s scoreboard does not count some of the most important data the campaign is stealing.","The article emphasizes that credential revocation alone is insufficient because NadMesh uses three persistence methods, so new credentials could be stolen again if the host is not cleaned first.","NadMesh’s scanning logic prioritizes networks and hosts that previously produced results, while blacklisting targets that absorb repeated deployment attempts without response as suspected honeypots."],"referencedReports":[{"title":"NadMesh Botnet Analysis: A Product-Grade Threat for the AI Service Era","url":"https://blog.xlab.qianxin.com/nadmesh-botnet-analysis-a-product-grade-threat-for-the-ai-service-era-en/","publisher":"QiAnXin XLab","context":"The article is based heavily on XLab’s report naming and analyzing the NadMesh botnet, its dashboard, scanning behavior, exploit traffic, persistence, and indicators.","category":"research","primary":true},{"title":"MCP Servers on the Internet","url":"https://censys.com/blog/mcp-servers-on-the-internet/","publisher":"Censys","context":"The article cites Censys’s MCP census for counts of reachable MCP services and services advertising command-running tools.","category":"research","primary":false},{"title":"ComfyUI Servers: Cryptomining Proxy Botnet","url":"https://censys.com/blog/comfyui-servers-cryptomining-proxy-botnet/","publisher":"Censys","context":"The article references Censys’s earlier findings about exposed ComfyUI instances being used for GPU mining and proxy infrastructure.","category":"research","primary":false}],"body":"\u003cp\u003eA Go botnet called \u003cstrong\u003eNadMesh\u003c/strong\u003e appeared in early July and is scanning exposed AI services such as ComfyUI, Ollama, n8n, Open WebUI, Langflow, and Gradio. QiAnXin’s XLab named the malware after the “n4d mesh controller” string in its source and published analysis of the botnet, its operator panel, and observed traffic. The operator’s dashboard claimed 3,811 unique AWS keys, while XLab’s sensors saw distinct source IPs pushing NadMesh rise to around 139 per day in the first week of July.\u003c/p\u003e\n\n\u003cp\u003eThe article says NadMesh is primarily after cloud and platform access rather than the infected host itself. It collects cloud keys from environment variables, Kubernetes service account tokens, and files including \u003ccode\u003e~/.aws/config\u003c/code\u003e, \u003ccode\u003e.env\u003c/code\u003e, and \u003ccode\u003e~/.docker/config.json\u003c/code\u003e. XLab’s observed exploit traffic was led by Docker API remote code execution at 30.31% and Jenkins script console remote code execution at 22.28%, while MCP command execution appeared at 0.78%.\u003c/p\u003e\n\n\u003cp\u003eNadMesh uses adaptive scanning, repeatedly prioritizing subnets and IPs that previously produced hits and blacklisting targets that absorb ten deployment attempts without returning results. The article says the agent persists in three ways, uses Garble obfuscation, UPX packing, and random padding, and therefore does not share one stable hash across builds. It advises operators to place exposed services behind authentication or remove them from the public internet, check specified drop paths, isolate infected hosts, and revoke credentials the host could access.\u003c/p\u003e\n"},{"n":11,"title":"New GoSerpent Malware Targets Southeast Asian Governments and Diplomats for Espionage","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-goserpent-malware-targets-southeast.html","time":"08:46","priority":"MUST READ","score":91,"tldr":"Kaspersky uncovered GoSerpent, a previously undocumented Go-based backdoor used since late 2025 to spy on Southeast Asian government and diplomatic entities, harvest sensitive files, dump credentials, and enable proxy access for long-term espionage. The campaign shows overlaps with the APAC-focused TetrisPhantom actor and involved follow-on tools for staged data collection and exfiltration.","briefOverview":"\u003cp\u003eKaspersky discovered a previously undocumented malware called \u003cstrong\u003eGoSerpent\u003c/strong\u003e that has been used in cyber attacks targeting government and diplomatic entities in Southeast Asia since late 2025. The activity focuses on long-term access and intelligence gathering. GoSerpent contacts an external server and deploys secondary payloads for sensitive data collection and credential dumping.\u003c/p\u003e\n\n\u003cp\u003eThe malware receives encrypted and Base64-encoded command-line arguments containing the command-and-control address and communication password. It can alert the server of an active infection, open and close listening ports, connect to remote servers, spawn a shell, transfer files, start a SOCKS5 proxy, and forward traffic to connected nodes. Kaspersky said the backdoor can deploy tools including ThumbcacheService, Mimikatz, and QuarksDumpLocalHash.\u003c/p\u003e\n\n\u003cp\u003eAfter months of covert data harvesting, the attackers returned in May 2026 with additional tools including Stowaway, TmcLoader, and TmcPayload to support proxying, remote access, and exfiltration of stored sensitive data. Kaspersky said the campaign shares targeting, technical capabilities, and operational overlaps with TetrisPhantom, a threat actor previously documented targeting government entities in the Asia-Pacific region. The article also notes a separate Cyderes Howler Cell report on a DoNot Team espionage operation targeting Bangladesh’s military and defence establishments with spear-phishing emails carrying a malicious RTF document.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky discovered a previously undocumented malware called GoSerpent that has been used since late 2025 to target government and diplomatic entities in Southeast Asia for long-term access and intelligence gathering.","GoSerpent contacts an external command-and-control server, supports encrypted communications, and can deploy secondary tools for sensitive data collection and credential dumping.","The campaign used tools including ThumbcacheService for file collection, Mimikatz for LSASS credential dumping, QuarksDumpLocalHash for extracting local account password hashes, and later Stowaway, TmcLoader, and TmcPayload for proxying, remote access, and exfiltration.","Kaspersky said the campaign shares targeting, technical capabilities, and operational overlaps with TetrisPhantom, a threat actor previously documented as targeting government entities in the Asia-Pacific region.","Cyderes Howler Cell also detailed a separate DoNot Team cyber espionage operation targeting Bangladesh’s military and defence establishments through spear-phishing emails carrying a malicious RTF document."],"insights":["GoSerpent’s command-and-control address and communication password are supplied as encrypted and Base64-encoded command-line arguments, making launch parameters themselves part of the malware’s concealment and configuration process.","The attackers returned months after initial collection activity to deploy TmcLoader and TmcPayload, showing that the operation separated long-term data staging from later exfiltration.","GoSerpent can create SOCKS5 proxy servers and route traffic through compromised hosts, allowing the attackers to move through victim networks while hiding their original IP addresses.","The DoNot Team operation used server-side geofencing so that only victims inside the target region received the malicious payload, while non-targets were served clean templates."],"referencedReports":[{"title":"GoSerpent backdoor in Southeast Asia","url":"https://securelist.com/goserpent-backdoor-in-southeast-asia/120687/","publisher":"Kaspersky Securelist","context":"The article relies on Kaspersky’s research describing the newly documented GoSerpent malware campaign against Southeast Asian government and diplomatic entities.","category":"research","primary":true},{"title":"Tracking DoNot APT-C-35 Bangladesh Military Intrusion","url":"https://www.cyderes.com/howler-cell/tracking-donot-apt-c-35-bangladesh-military-intrusion","publisher":"Cyderes Howler Cell","context":"The article references Cyderes Howler Cell’s analysis of a DoNot Team espionage operation targeting Bangladesh’s military and defence establishments.","category":"research","primary":true},{"title":"APT trends report Q3 2023","url":"https://securelist.com/apt-trends-report-q3-2023/110752/","publisher":"Kaspersky Securelist","context":"The article cites Kaspersky’s earlier reporting as part of the background on TetrisPhantom activity in the Asia-Pacific region.","category":"research","primary":false},{"title":"TetrisPhantom: Targeted attacks using secure USB drives","url":"https://www.virusbulletin.com/uploads/pdf/conference/vb2023/papers/TetrisPhantom-targeted-attacks-using-secure-USB.pdf","publisher":"Virus Bulletin","context":"The article links to a Virus Bulletin paper describing TetrisPhantom attacks using secure USB drives against Asia-Pacific government entities.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky discovered a previously undocumented malware called \u003cstrong\u003eGoSerpent\u003c/strong\u003e that has been used in cyber attacks targeting government and diplomatic entities in Southeast Asia since late 2025. The activity focuses on long-term access and intelligence gathering. GoSerpent contacts an external server and deploys secondary payloads for sensitive data collection and credential dumping.\u003c/p\u003e\n\n\u003cp\u003eThe malware receives encrypted and Base64-encoded command-line arguments containing the command-and-control address and communication password. It can alert the server of an active infection, open and close listening ports, connect to remote servers, spawn a shell, transfer files, start a SOCKS5 proxy, and forward traffic to connected nodes. Kaspersky said the backdoor can deploy tools including ThumbcacheService, Mimikatz, and QuarksDumpLocalHash.\u003c/p\u003e\n\n\u003cp\u003eAfter months of covert data harvesting, the attackers returned in May 2026 with additional tools including Stowaway, TmcLoader, and TmcPayload to support proxying, remote access, and exfiltration of stored sensitive data. Kaspersky said the campaign shares targeting, technical capabilities, and operational overlaps with TetrisPhantom, a threat actor previously documented targeting government entities in the Asia-Pacific region. The article also notes a separate Cyderes Howler Cell report on a DoNot Team espionage operation targeting Bangladesh’s military and defence establishments with spear-phishing emails carrying a malicious RTF document.\u003c/p\u003e\n"},{"n":2,"title":"Abbott Laboratories probes two cyber incidents amid extortion claims","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/abbott-laboratories-probes-two-cyber-incidents-amid-extortion-claims/","time":"20:45","priority":"SHOULD READ","score":88,"tldr":"Abbott Laboratories is investigating two cyber incidents: confirmed unauthorized access to legacy Exact Sciences systems in its Cancer Diagnostics business claimed by ShinyHunters, and a separate alleged LabCentral portal breach. Abbott says operations, product availability, and patient services are unaffected, while the attackers claim they stole large amounts of sensitive data that has not been independently verified.","briefOverview":"\u003cp\u003eAbbott Laboratories is investigating two separate cybersecurity incidents involving its diagnostics businesses. The company confirmed unauthorized access to a limited number of internal legacy Exact Sciences systems in its Cancer Diagnostics business after ShinyHunters listed Abbott on its extortion site. Abbott said the incident does not affect business operations, product or product availability, manufacturing or lab operations, or its ability to serve patients.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it gained access through a mid-June vishing attack targeting Abbott employees, which allegedly compromised a Microsoft Entra single sign-on account. The group claimed it exfiltrated data from Microsoft Entra, ServiceNow, SharePoint, Databricks, and Coupa, including internal documents, contracts, customer information, and large datasets containing personal and medical-related information. BleepingComputer said it has not independently verified the threat actor’s claims about the stolen data.\u003c/p\u003e\n\n\u003cp\u003eA second threat actor, ShadowByt3\u003cspan class=\"math inline\"\u003e\\(, claimed to have breached Abbott’s Core Laboratory diagnostics business through the LabCentral customer portal using compromised customer credentials. Abbott said it is aware of the potential incident but disputed the actor’s characterization of the data, stating that LabCentral contains publicly available technical product reference documents and no proprietary, sensitive customer, or business information. At the time of the article, neither ShinyHunters nor ShadowByt3\\)\u003c/span\u003e had publicly released the data they claimed to have stolen.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Abbott Laboratories is investigating unauthorized access to a limited number of internal legacy Exact Sciences systems in its Cancer Diagnostics business.","Abbott said the Cancer Diagnostics incident does not affect business operations, product availability, manufacturing or lab operations, its ability to serve patients, or other Abbott businesses and systems.","ShinyHunters claimed it accessed Abbott through a mid-June vishing attack that compromised a Microsoft Entra single sign-on account and allowed access to internal systems.","ShinyHunters claimed it stole data from Microsoft Entra, ServiceNow, SharePoint, Databricks, and Coupa, including internal documents, contracts, customer information, and large datasets containing personal and medical-related information, but BleepingComputer has not independently verified those claims.","Abbott is also investigating a separate potential incident involving its LabCentral customer portal, but said the portal contains publicly available technical product reference documents and does not contain proprietary, sensitive customer, or business information."],"insights":["Abbott is handling the two claims as separate incidents affecting different parts of its diagnostics business, with one tied to legacy Exact Sciences systems and the other to a third-party hosted LabCentral portal.","ShinyHunters’ claimed access path fits the group’s broader pattern described in the article: targeting employees’ single sign-on accounts and then using that access to reach connected business applications.","The article highlights a major gap between attacker claims and confirmed facts, as ShinyHunters alleges theft of highly sensitive personal and medical-related data while BleepingComputer says those claims have not been independently verified.","The LabCentral claim is disputed not only on whether access occurred but on the value of the data itself, with the threat actor describing sensitive business documents and Abbott saying the portal stores only publicly available technical product reference materials.","Neither threat actor had publicly released the data they claimed to have stolen at the time of the article, despite ShinyHunters setting and extending a publication deadline on its leak site."],"referencedReports":[],"body":"\u003cp\u003eAbbott Laboratories is investigating two separate cybersecurity incidents involving its diagnostics businesses. The company confirmed unauthorized access to a limited number of internal legacy Exact Sciences systems in its Cancer Diagnostics business after ShinyHunters listed Abbott on its extortion site. Abbott said the incident does not affect business operations, product or product availability, manufacturing or lab operations, or its ability to serve patients.\u003c/p\u003e\n\n\u003cp\u003eShinyHunters claimed it gained access through a mid-June vishing attack targeting Abbott employees, which allegedly compromised a Microsoft Entra single sign-on account. The group claimed it exfiltrated data from Microsoft Entra, ServiceNow, SharePoint, Databricks, and Coupa, including internal documents, contracts, customer information, and large datasets containing personal and medical-related information. BleepingComputer said it has not independently verified the threat actor’s claims about the stolen data.\u003c/p\u003e\n\n\u003cp\u003eA second threat actor, ShadowByt3\u003cspan class=\"math inline\"\u003e\\(, claimed to have breached Abbott’s Core Laboratory diagnostics business through the LabCentral customer portal using compromised customer credentials. Abbott said it is aware of the potential incident but disputed the actor’s characterization of the data, stating that LabCentral contains publicly available technical product reference documents and no proprietary, sensitive customer, or business information. At the time of the article, neither ShinyHunters nor ShadowByt3\\)\u003c/span\u003e had publicly released the data they claimed to have stolen.\u003c/p\u003e\n"},{"n":5,"title":"HollowByte DDoS flaw bloats OpenSSL server memory with 11-byte payload","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hollowbyte-ddos-flaw-bloats-openssl-server-memory-with-11-byte-payload/","time":"17:56","priority":"SHOULD READ","score":88,"tldr":"A DoS flaw dubbed HollowByte lets unauthenticated attackers bloat OpenSSL server memory with only an 11-byte TLS payload, potentially leaving services permanently memory-heavy until restarted. OpenSSL has fixed it in 4.0.1 and backported patches to 3.6.3, 3.5.7, 3.4.6, and 3.0.21, so organizations should update promptly.","briefOverview":"\u003cp\u003eA vulnerability dubbed HollowByte allows unauthenticated attackers to trigger a denial-of-service condition on OpenSSL servers using a malicious payload of just 11 bytes. The OpenSSL team has fixed the issue without assigning an identifier and has backported the patch to older releases. Because OpenSSL is widely used as a foundation for secure internet communication, the article says organizations should prioritize moving to a fixed version.\u003c/p\u003e\n\n\u003cp\u003eOkta’s Red Team explained that vulnerable OpenSSL versions allocate memory based on the size declared in a TLS handshake header before receiving and checking the actual payload. An attacker can open TLS connections and send an 11-byte input whose header claims a much larger message body will follow, causing the server to allocate memory and then wait for data that never arrives. Repeating this across multiple connections can consume significant memory with relatively little transmitted data.\u003c/p\u003e\n\n\u003cp\u003eOkta reported that glibc may keep freed small-to-medium memory allocations for reuse instead of immediately returning them to the operating system, which can leave the server bloated even after connections drop. In Okta’s NGINX tests, low-capacity environments could be depleted of memory, while higher-spec servers could lose up to 25% of memory while attack bandwidth stayed below security alerting thresholds. The issue is fixed in OpenSSL 4.0.1 and backported to 3.6.3, 3.5.7, 3.4.6, and 3.0.21, which grow buffers only when data arrives.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A vulnerability dubbed HollowByte allows unauthenticated attackers to trigger a denial-of-service condition on OpenSSL servers with a malicious payload of just 11 bytes.","Vulnerable OpenSSL versions allocate memory based on the length declared in a TLS handshake header before receiving and validating the payload.","Okta researchers said repeated connections with randomized claimed sizes can fragment the heap and cause a server’s Resident Set Size to climb continuously, with a restart required to fully reclaim the space.","The OpenSSL library is embedded in software such as NGINX, Apache, Node.js, Python, Ruby, PHP, MySQL, and PostgreSQL, and is pre-installed on most Linux distributions for TLS encryption and certificate handling.","The issue has been fixed in OpenSSL 4.0.1 and backported to versions 3.6.3, 3.5.7, 3.4.6, and 3.0.21."],"insights":["The attack can stay below security alerting thresholds while still causing higher-spec servers to lose up to 25% of their memory, according to Okta’s NGINX tests.","The memory impact can persist even after attacker connections drop because glibc may keep freed small-to-medium allocations for reuse instead of immediately returning them to the operating system.","OpenSSL treated the change as a hardening fix rather than a security vulnerability, so defenders may need to look for fixed package versions rather than relying on a vulnerability identifier.","The patch changes OpenSSL’s behavior so buffers grow only as data actually arrives, directly removing the trust in the size claimed by the handshake header."],"referencedReports":[{"title":"OpenSSL HollowByte: A DoS Hiding in 11 Bytes","url":"https://sec.okta.com/articles/2026/06/openssl-hollowbtye-a-dos-hiding-in-11-bytes/","publisher":"Okta Red Team","context":"The article cites Okta’s advisory as the source explaining how the HollowByte denial-of-service vulnerability works and its real-world impact.","category":"advisory","primary":true}],"body":"\u003cp\u003eA vulnerability dubbed HollowByte allows unauthenticated attackers to trigger a denial-of-service condition on OpenSSL servers using a malicious payload of just 11 bytes. The OpenSSL team has fixed the issue without assigning an identifier and has backported the patch to older releases. Because OpenSSL is widely used as a foundation for secure internet communication, the article says organizations should prioritize moving to a fixed version.\u003c/p\u003e\n\n\u003cp\u003eOkta’s Red Team explained that vulnerable OpenSSL versions allocate memory based on the size declared in a TLS handshake header before receiving and checking the actual payload. An attacker can open TLS connections and send an 11-byte input whose header claims a much larger message body will follow, causing the server to allocate memory and then wait for data that never arrives. Repeating this across multiple connections can consume significant memory with relatively little transmitted data.\u003c/p\u003e\n\n\u003cp\u003eOkta reported that glibc may keep freed small-to-medium memory allocations for reuse instead of immediately returning them to the operating system, which can leave the server bloated even after connections drop. In Okta’s NGINX tests, low-capacity environments could be depleted of memory, while higher-spec servers could lose up to 25% of memory while attack bandwidth stayed below security alerting thresholds. The issue is fixed in OpenSSL 4.0.1 and backported to 3.6.3, 3.5.7, 3.4.6, and 3.0.21, which grow buffers only when data arrives.\u003c/p\u003e\n"},{"n":15,"title":"ACR Stealer Uses ClickFix Lures to Steal Browser Tokens and Microsoft 365 Files","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/acr-stealer-uses-clickfix-lures-to.html","time":"08:56","priority":"SHOULD READ","score":88,"tldr":"ACR Stealer campaigns are using ClickFix lures that trick users into pasting commands into Windows Run, leading to theft of browser passwords, session tokens, Microsoft 365 files, and synced OneDrive/SharePoint data. Because stolen tokens remain valid after password resets, defenders should revoke tokens and block the paste-and-run execution path.","briefOverview":"\u003cp\u003eACR Stealer, an infostealer active since 2024, is being delivered through ClickFix lures that convince users to paste a command into the Windows Run box and press Enter. Microsoft said its Defender Experts team observed ACR Stealer activity increase across customer environments from late April to mid-June. The campaigns are stealing saved browser passwords, live session tokens, PDFs, Microsoft 365 documents, and files from synced OneDrive and SharePoint folders.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft described two delivery chains: one that runs almost entirely in memory and another that leaves more traces on disk. The fileless chain uses \u003ccode\u003emshta.exe\u003c/code\u003e, remote HTA content, VBScript, PowerShell, and a JPEG-hosted payload that is extracted, decrypted, decompressed, and reflectively executed. The disk-based chain pulls a DLL from a WebDAV share, uses obfuscated PowerShell and \u003ccode\u003epythonw.exe\u003c/code\u003e, persists through a hidden scheduled task, copies timestamps from \u003ccode\u003enotepad.exe\u003c/code\u003e, and clears PowerShell history.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that neither chain exploits a software vulnerability; both depend on a user following the paste-and-run prompt. Microsoft’s remediation guidance includes isolating suspected hosts, rotating credentials, revoking tokens, and checking outbound connections to remote shares and image-hosting services. The article also notes that the ACR Stealer label describes the code and not necessarily who is operating it, because the malware has been rebranded and may have changed ownership.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft reported that ACR Stealer activity increased across customer environments from late April to mid-June and that campaigns are using ClickFix lures to steal browser credentials, authentication tokens, and sensitive documents.","The fileless delivery chain starts when a pasted command launches mshta.exe to retrieve remote HTA content, then uses scripts and a JPEG-hosted payload to execute malware in memory.","ACR Stealer targets Chrome and Edge data stores, uses DPAPI to decrypt saved passwords, cookies, and tokens, and also steals PDFs from the Desktop and Downloads folders.","A second delivery chain pulls a DLL from a WebDAV share, uses obfuscated PowerShell and a bundled pythonw.exe, persists through a hidden scheduled task, and clears PowerShell history.","Microsoft’s remediation guidance says suspected victims should isolate affected hosts, rotate credentials, revoke tokens, and check outbound connections to remote shares and image-hosting services."],"insights":["Microsoft specifically advises token revocation, not just password rotation, because ACR Stealer steals live browser session tokens that can remain useful after passwords are changed.","The two observed infection chains use very different execution styles, with one leaving files and scheduled-task artifacts on disk while the other runs almost entirely in memory, so defenders need both endpoint artifact hunting and behavior-based detection.","The same Claude-themed lure infrastructure described by SANS and Red Canary appears to overlap with Microsoft’s campaign indicators, showing that these campaigns reused or shared visible infrastructure across multiple reports.","The article emphasizes that there is no CVE or software bug involved, making user prompt abuse through ClickFix the central control point rather than patching.","Microsoft treats the ACR Stealer label as a behavioral identification of the code rather than an attribution to a specific operator, because the malware family has been rebranded and may have changed ownership."],"referencedReports":[{"title":"ACR Stealer: Two observed intrusion chains amid increased threat activity","url":"https://www.microsoft.com/en-us/security/blog/2026/07/16/acr-stealer-two-observed-intrusion-chains-amid-increased-threat-activity/","publisher":"Microsoft","context":"The article says Microsoft laid out two ACR Stealer delivery chains and provided remediation guidance, indicators, and hunting queries.","category":"research","primary":true},{"title":"Possible ACR Stealer From Page Impersonating Claude","url":"https://isc.sans.edu/diary/Possible+ACR+Stealer+From+Page+Impersonating+Claude/33018/","publisher":"SANS Internet Storm Center","context":"The article cites Brad Duncan’s SANS diary documenting a Windows infection traced to a page impersonating Claude and overlapping with Microsoft’s indicators.","category":"research","primary":false},{"title":"Intelligence Insights: May 2026","url":"https://redcanary.com/blog/threat-intelligence/intelligence-insights-may-2026/","publisher":"Red Canary","context":"The article references Red Canary’s May report for prior telemetry on Claude-branded lures, ACR Stealer delivery, WebDAV execution patterns, and prevalence data.","category":"research","primary":false},{"title":"Evalusion Campaign Delivers Amatera Stealer and NetSupport RAT","url":"https://www.esentire.com/blog/evalusion-campaign-delivers-amatera-stealer-and-netsupport-rat","publisher":"eSentire","context":"The article cites eSentire’s account of ACR Stealer’s history and the claim that its source code was sold off.","category":"research","primary":false},{"title":"Amatera Stealer: Rebranded ACR Stealer with Improved Evasion and Sophistication","url":"https://www.proofpoint.com/us/blog/threat-insight/amatera-stealer-rebranded-acr-stealer-improved-evasion-sophistication","publisher":"Proofpoint","context":"The article cites Proofpoint’s June 2025 report stating that ACR Stealer was updated and rebranded as Amatera Stealer.","category":"research","primary":false}],"body":"\u003cp\u003eACR Stealer, an infostealer active since 2024, is being delivered through ClickFix lures that convince users to paste a command into the Windows Run box and press Enter. Microsoft said its Defender Experts team observed ACR Stealer activity increase across customer environments from late April to mid-June. The campaigns are stealing saved browser passwords, live session tokens, PDFs, Microsoft 365 documents, and files from synced OneDrive and SharePoint folders.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft described two delivery chains: one that runs almost entirely in memory and another that leaves more traces on disk. The fileless chain uses \u003ccode\u003emshta.exe\u003c/code\u003e, remote HTA content, VBScript, PowerShell, and a JPEG-hosted payload that is extracted, decrypted, decompressed, and reflectively executed. The disk-based chain pulls a DLL from a WebDAV share, uses obfuscated PowerShell and \u003ccode\u003epythonw.exe\u003c/code\u003e, persists through a hidden scheduled task, copies timestamps from \u003ccode\u003enotepad.exe\u003c/code\u003e, and clears PowerShell history.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that neither chain exploits a software vulnerability; both depend on a user following the paste-and-run prompt. Microsoft’s remediation guidance includes isolating suspected hosts, rotating credentials, revoking tokens, and checking outbound connections to remote shares and image-hosting services. The article also notes that the ACR Stealer label describes the code and not necessarily who is operating it, because the malware has been rebranded and may have changed ownership.\u003c/p\u003e\n"},{"n":20,"title":"Fake Coding Tests Deliver OtterCookie-Aligned Malware Hidden in SVG Flag Images","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/north-korea-linked-hackers-hide.html","time":"13:48","priority":"SHOULD READ","score":86,"tldr":"North Korean actors behind the Contagious Interview campaign are using fake developer job tests with malicious code hidden in SVG flag images to deploy OtterCookie-aligned malware. Victims who run the projects risk browser and crypto wallet theft, file exfiltration, clipboard capture, and a Socket.IO-based backdoor.","briefOverview":"\u003cp\u003eNorth Korean threat actors linked to the Contagious Interview campaign have been observed using fake job postings and coding challenges to target software developers. Elastic Security Labs said the campaign delivered a four-stage payload aligned with OtterCookie, including a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The activity is being tracked as REF9403 and reflects the continued targeting of developers to steal sensitive data and cryptocurrency wallet contents.\u003c/p\u003e\n\n\u003cp\u003eElastic discovered the campaign after actors targeted members of its community Slack workspace with job-offer lures in late May 2026. The messages, posted by a user named Maxwell in the #jobs Slack channel, advertised work on an e-commerce platform using Next.js, NestJS, PostgreSQL, Auth.js, and Stripe integration. Interested developers were moved into direct messages and told to complete a coding assessment that involved running a trojanized repository.\u003c/p\u003e\n\n\u003cp\u003eThe repositories contained functional code but also hid malicious payload fragments inside SVG country flag images in an assets directory. Elastic said the payloads were split into Base64 fragments inside HTML comments across the SVG files and then assembled by a JavaScript file named serverValidation.js, with execution designed to occur on each server boot. The malware can harvest browser and cryptocurrency wallet data, collect files with specified extensions, enable persistent remote control through Socket.IO, capture clipboard content, and drop Windows executables.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["North Korean threat actors linked to the Contagious Interview campaign used fake job postings and coding challenges to target software developers with malicious repositories.","Elastic Security Labs said the trojanized projects hid Base64-encoded malicious payload fragments inside HTML comments across SVG country flag images in an assets directory.","A JavaScript file named serverValidation.js assembled the hidden payload, and the attack chain was designed to execute the malware on each server boot.","The delivered malware was aligned with OtterCookie and included modules for stealing browser and cryptocurrency wallet data, collecting files, enabling Socket.IO-based remote control, and capturing clipboard content.","Elastic discovered the campaign after actors targeted members of its community Slack workspace with job-offer lures in late May 2026."],"insights":["The use of community Slack job channels represents a newly documented initial access avenue for Contagious Interview activity, expanding beyond previously reported delivery paths.","The malware’s collection list includes AI coding tool directories such as .claude, .cursor, .gemini, .windsurf, .pearai, and .llama, showing the operators are adapting their theft targets to developers’ current workflows.","Because the malicious projects remain fully functional, successful execution of the coding assessment may not give victims an obvious sign that anything harmful occurred.","The overlap between this campaign and bogus npm packages masquerading as Rollup polyfill tooling indicates the same threat activity is using multiple developer-focused propagation vectors at the same time."],"referencedReports":[{"title":"Contagious Interview malware uses SVG steganography","url":"https://www.elastic.co/security-labs/contagious-interview-malware-svg-steganography","publisher":"Elastic Security Labs","context":"The article is ba
