sed on Elastic Security Labs' report describing North Korea-linked fake coding tests that hide OtterCookie-aligned payloads in SVG flag images.","category":"research","primary":true},{"title":"Contagious Interview malware delivered through fake developer job interviews","url":"https://www.microsoft.com/en-us/security/blog/2026/03/11/contagious-interview-malware-delivered-through-fake-developer-job-interviews/","publisher":"Microsoft","context":"The article cites Microsoft’s March analysis to describe how OtterCookie evolved into a modular program for data theft, command execution, and Socket.IO-based command-and-control.","category":"research","primary":false}],"body":"\u003cp\u003eNorth Korean threat actors linked to the Contagious Interview campaign have been observed using fake job postings and coding challenges to target software developers. Elastic Security Labs said the campaign delivered a four-stage payload aligned with OtterCookie, including a browser credential and crypto wallet stealer, a file stealer, a Socket.IO-based remote access trojan, and a clipboard stealer. The activity is being tracked as REF9403 and reflects the continued targeting of developers to steal sensitive data and cryptocurrency wallet contents.\u003c/p\u003e\n\n\u003cp\u003eElastic discovered the campaign after actors targeted members of its community Slack workspace with job-offer lures in late May 2026. The messages, posted by a user named Maxwell in the #jobs Slack channel, advertised work on an e-commerce platform using Next.js, NestJS, PostgreSQL, Auth.js, and Stripe integration. Interested developers were moved into direct messages and told to complete a coding assessment that involved running a trojanized repository.\u003c/p\u003e\n\n\u003cp\u003eThe repositories contained functional code but also hid malicious payload fragments inside SVG country flag images in an assets directory. Elastic said the payloads were split into Base64 fragments inside HTML comments across the SVG files and then assembled by a JavaScript file named serverValidation.js, with execution designed to occur on each server boot. The malware can harvest browser and cryptocurrency wallet data, collect files with specified extensions, enable persistent remote control through Socket.IO, capture clipboard content, and drop Windows executables.\u003c/p\u003e\n"},{"n":6,"title":"New Windows LegacyHive zero-day gives hackers admin privileges","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-windows-legacyhive-zero-day-exploit-grants-hackers-admin-access/","time":"11:05","priority":"SHOULD READ","score":85,"tldr":"A researcher released a proof-of-concept Windows zero-day called LegacyHive that can let standard users gain admin-level code execution by abusing the Windows User Profile Service. Microsoft has not yet assigned a CVE or issued a fix, though the public PoC was partially restricted to reduce easy exploitation.","briefOverview":"\u003cp\u003eA security researcher using the handle “Nightmare Eclipse” released a Windows zero-day proof-of-concept exploit called LegacyHive shortly after Microsoft’s July 2026 Patch Tuesday updates. The exploit abuses a Windows User Profile Service vulnerability that had not yet received a CVE ID at the time of the article. The researcher said the public proof of concept was stripped down to require additional credentials in an attempt to prevent public exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe article says LegacyHive can allow attackers to escalate privileges on up-to-date Windows systems. Will Dormann tested the exploit and explained that successful exploitation could let non-admin users modify the classes registry hive and gain automatic code execution when an admin account logs into a compromised system. Dormann gave an example of associating .txt files with calc.exe, while noting that more useful actions would be possible.\u003c/p\u003e\n\n\u003cp\u003eKevin Beaumont confirmed that the exploit works and published Microsoft Defender for Endpoint detection queries for LegacyHive exploitation. The article places LegacyHive in a broader series of recent Nightmare Eclipse disclosures involving Microsoft Defender, BitLocker, and other Windows components. Microsoft had patched several previously disclosed flaws in June and July 2026, but a Microsoft spokesperson was not immediately available for comment on LegacyHive.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A security researcher using the handle Nightmare Eclipse released a proof-of-concept exploit called LegacyHive for an unpatched Windows User Profile Service vulnerability.","The LegacyHive exploit can allow attackers to escalate privileges on up-to-date Windows systems, but the released proof of concept was modified to require additional credentials.","Will Dormann tested the exploit and said successful exploitation could let non-admin users modify the classes registry hive and gain automatic code execution when an admin account logs into the compromised system.","Kevin Beaumont confirmed that the LegacyHive exploit works and published Microsoft Defender for Endpoint detection queries for it.","Microsoft had not assigned a CVE ID to the LegacyHive vulnerability at the time of the article, and a Microsoft spokesperson was not immediately available for comment."],"insights":["The publicly released LegacyHive proof of concept is intentionally less capable than the original exploit, which the researcher said did not require additional user credentials and was not limited to the usrclass.dat hive.","The exploit’s impact can depend on a later administrator login, because Dormann said a non-admin user could gain automatic code execution when the admin account logs into the compromised system.","Defenders using Microsoft Defender for Endpoint have a concrete detection option, as Kevin Beaumont published LegacyHive exploitation detection queries for that platform one day after the proof of concept was released.","LegacyHive continues a pattern of recent Nightmare Eclipse disclosures affecting multiple Microsoft security and Windows components, several of which Microsoft patched in the June and July 2026 updates."],"referencedReports":[],"body":"\u003cp\u003eA security researcher using the handle “Nightmare Eclipse” released a Windows zero-day proof-of-concept exploit called LegacyHive shortly after Microsoft’s July 2026 Patch Tuesday updates. The exploit abuses a Windows User Profile Service vulnerability that had not yet received a CVE ID at the time of the article. The researcher said the public proof of concept was stripped down to require additional credentials in an attempt to prevent public exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe article says LegacyHive can allow attackers to escalate privileges on up-to-date Windows systems. Will Dormann tested the exploit and explained that successful exploitation could let non-admin users modify the classes registry hive and gain automatic code execution when an admin account logs into a compromised system. Dormann gave an example of associating .txt files with calc.exe, while noting that more useful actions would be possible.\u003c/p\u003e\n\n\u003cp\u003eKevin Beaumont confirmed that the exploit works and published Microsoft Defender for Endpoint detection queries for LegacyHive exploitation. The article places LegacyHive in a broader series of recent Nightmare Eclipse disclosures involving Microsoft Defender, BitLocker, and other Windows components. Microsoft had patched several previously disclosed flaws in June and July 2026, but a Microsoft spokesperson was not immediately available for comment on LegacyHive.\u003c/p\u003e\n"},{"n":14,"title":"Seven Malicious Vite npm Packages Use Blockchain C2 to Deliver a RAT","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/seven-malicious-vite-npm-packages-use.html","time":"18:54","priority":"SHOULD READ","score":84,"tldr":"Researchers found seven malicious npm packages impersonating Vite tooling that use resilient blockchain-based command-and-control infrastructure to deliver a remote access trojan. Developers who installed them should remove the packages, audit systems, rotate credentials, and check shell profile files for persistence.","briefOverview":"\u003cp\u003eCybersecurity researchers discovered seven malicious npm packages targeting the Vite frontend tooling ecosystem as part of a software supply chain attack. Checkmarx named the campaign ViteVenom and described it as an expansion of ChainVeil, which used blockchain-based command-and-control infrastructure to deliver a remote access trojan. The activity has been attributed to a threat actor named SuccessKey, with evidence of related malicious activity dating back to February 27, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe packages were published between June 29 and July 3, 2026, and used scoped names intended to resemble the @vitejs/* namespace. The article lists packages including @uw010010/vite-tree, @vite-tab/tab, @vite-ln/build-ts, @vite-mcp/vite-type, @vite-pro/vite-ui, @vitets/vite-ts, and @vite-ts/vite-ui. Unlike ChainVeil’s unscoped typosquats, ViteVenom focused specifically on developers building applications with the Vite JavaScript and frontend build tool.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code executes at import time rather than install time and acts as a loader that queries blockchain infrastructure to obtain the next stage. It uses Tron, Aptos, and Binance Smart Chain infrastructure to retrieve and decrypt payload data, with fallback mechanisms including Aptos and direct HTTP retrieval from the command-and-control server. Users who installed the packages are advised to remove them immediately, audit dependencies, rotate all credentials, and check .bashrc, .zshrc, and .profile files for unauthorized modifications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers discovered seven malicious npm packages targeting developers in the Vite frontend tooling ecosystem as part of a software supply chain attack.","Checkmarx named the campaign ViteVenom and linked it to an expansion of ChainVeil, attributing the activity to a threat actor called SuccessKey.","The packages were published between June 29 and July 3, 2026, and used scoped names intended to impersonate the @vitejs/* namespace.","The malicious code runs when imported and retrieves later-stage payloads through blockchain-based infrastructure involving Tron, Aptos, and Binance Smart Chain.","Users who installed the packages are advised to remove them immediately, audit dependencies, rotate all credentials, and check .bashrc, .zshrc, and .profile for unauthorized modifications."],"insights":["ViteVenom does not execute its malicious code at install time but at import time, which the article says limits endpoint security detections.","The campaign uses scoped package names to resemble the @vitejs/* namespace, a shift from ChainVeil’s earlier unscoped typosquats and a tactic meant to appear more legitimate to Vite developers.","The blockchain setup is resilient because payload pointers are stored in public blockchain transaction data rather than domain names that can be seized.","The malware has multiple retrieval paths: Tron is the primary method, Aptos is a backup, and a separate HTTP fallback can fetch the RAT directly from the C2 server.","Checkmarx says differences in package names, maintainer accounts, Tier-1 wallets, and malicious file paths are consistent with one operator compartmentalizing multiple distribution tracks to reduce exposure."],"referencedReports":[{"title":"Sequel to ChainVeil: NPM Malware Targets Vite Ecosystem","url":"https://checkmarx.com/zero-post/sequel-to-chainveil-npm-malware-targets-vite-ecosystem/","publisher":"Checkmarx","context":"The article cites Checkmarx’s analysis naming the Vite-targeting malicious npm campaign ViteVenom and describing its blockchain-based command-and-control infrastructure.","category":"research","primary":true},{"title":"ChainVeil: A Malicious NPM Supply Chain Attack by SuccessKey","url":"https://checkmarx.com/zero-post/chainveil-a-malicious-npm-supply-chain-attack-by-successkey/","publisher":"Checkmarx","context":"The article references Checkmarx’s prior ChainVeil research to explain that ViteVenom is an expansion of that earlier malicious npm campaign.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers discovered seven malicious npm packages targeting the Vite frontend tooling ecosystem as part of a software supply chain attack. Checkmarx named the campaign ViteVenom and described it as an expansion of ChainVeil, which used blockchain-based command-and-control infrastructure to deliver a remote access trojan. The activity has been attributed to a threat actor named SuccessKey, with evidence of related malicious activity dating back to February 27, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe packages were published between June 29 and July 3, 2026, and used scoped names intended to resemble the @vitejs/* namespace. The article lists packages including @uw010010/vite-tree, @vite-tab/tab, @vite-ln/build-ts, @vite-mcp/vite-type, @vite-pro/vite-ui, @vitets/vite-ts, and @vite-ts/vite-ui. Unlike ChainVeil’s unscoped typosquats, ViteVenom focused specifically on developers building applications with the Vite JavaScript and frontend build tool.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code executes at import time rather than install time and acts as a loader that queries blockchain infrastructure to obtain the next stage. It uses Tron, Aptos, and Binance Smart Chain infrastructure to retrieve and decrypt payload data, with fallback mechanisms including Aptos and direct HTTP retrieval from the command-and-control server. Users who installed the packages are advised to remove them immediately, audit dependencies, rotate all credentials, and check .bashrc, .zshrc, and .profile files for unauthorized modifications.\u003c/p\u003e\n"},{"n":22,"title":"OpenSSL HollowByte Flaw Could Freeze Server Memory with 11-Byte TLS Requests","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/openssl-hollowbyte-flaw-could-freeze.html","time":"20:20","priority":"SHOULD READ","score":84,"tldr":"Okta disclosed an OpenSSL flaw dubbed HollowByte that lets an attacker force unpatched TLS servers to retain memory with tiny 11-byte requests, potentially causing denial of service. OpenSSL quietly fixed it in June releases without a CVE or advisory, making it harder for organizations to know whether they are protected.","briefOverview":"\u003cp\u003eOkta\u0026rsquo;s Red Team disclosed HollowByte, an OpenSSL denial-of-service flaw that can make an unpatched server reserve up to 131 KB of memory after receiving an 11-byte TLS request. The issue affects releases on the OpenSSL 4.0, 3.6, 3.5, 3.4, and 3.0 branches before the June 9 fixed versions 4.0.1, 3.6.3, 3.5.7, 3.4.6, and 3.0.21. OpenSSL shipped the fix without a CVE, advisory, or changelog entry identifying it.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs because older OpenSSL versions grew the TLS receive buffer based on the length declared in a handshake header before the message body arrived or handshake checks ran. For an inbound ClientHello, the allocation ceiling is 131 KB, and the worker thread then waits for a body that never comes. Okta said that on glibc systems it tested, freed buffers were not returned to the kernel, so varied connection sizes caused heap fragmentation and persistent resident memory growth.\u003c/p\u003e\n\n\u003cp\u003eOkta reported that in NGINX testing, a 1 GB server was OOM-killed with 547 MB of memory frozen in fragments, and a 16 GB server had 25% of system memory locked up without exceeding the connection ceiling. The article says this makes standard connection-limiting defenses insufficient and complicates downstream patch tracking because packages may be backported without changing their OpenSSL version string. The fix covers TLS only, while the article states that DTLS was left unchanged and still sizes its buffer from the peer-declared length in OpenSSL 4.0.1.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Okta's Red Team disclosed HollowByte, an OpenSSL denial-of-service bug where an 11-byte TLS handshake request can make an unpatched server allocate up to 131 KB of memory for a message body that never arrives.","Okta said glibc systems it tested did not return the freed OpenSSL buffers to the kernel after connections closed, allowing memory fragmentation to persist until the process restarts.","OpenSSL fixed HollowByte in releases 4.0.1, 3.6.3, 3.5.7, 3.4.6, and 3.0.21 on June 9, but did not assign a CVE, issue an advisory, or mention the fix in release notes or the changelog.","Okta's NGINX testing reportedly caused a 1 GB server to be OOM-killed with 547 MB frozen in fragments and locked up 25% of memory on a 16 GB server without exceeding connection limits.","The fix covers TLS only, while the article states that the DTLS handshake path still sizes its buffer from the peer-declared length in OpenSSL 4.0.1."],"insights":["Standard vulnerability scanners and patch pipelines may miss HollowByte because OpenSSL did not assign it a CVE, publish an advisory, or call it out in the changelog.","Checking only the reported OpenSSL version may be unreliable for downstream Linux packages because vendors such as Red Hat often backport fixes while keeping the older version string.","Connection limits alone may not prevent the issue, because Okta reported that memory remained fragmented after connections closed and did not require exceeding the connection ceiling.","Organizations that build OpenSSL themselves have a clearer remediation path than many downstream users: upgrade to the June 9 fixed releases and restart processes that loaded the old library.","The article highlights a classification inconsistency because OpenSSL assigned CVEs to other memory-exhaustion issues in the same release cycle while treating HollowByte as only a bug or hardening fix."],"referencedReports":[{"title":"OpenSSL HollowByte: A DoS Hiding in 11 Bytes","url":"https://sec.okta.com/articles/2026/06/openssl-hollowbtye-a-dos-hiding-in-11-bytes/","publisher":"Okta","context":"The article says Okta's Red Team reported, named, and published details of the HollowByte denial-of-service bug.","category":"research","primary":true},{"title":"CVE-2025-66199","url":"https://openssl-library.org/news/vulnerabilities-3.6/#CVE-2025-66199","publisher":"OpenSSL Project","context":"The article cites this OpenSSL vulnerability entry as a comparison to HollowByte because it involved peer-supplied length growing a heap buffer before validation.","category":"advisory","primary":false},{"title":"CVE-2026-34183","url":"https://openssl-library.org/news/vulnerabilities-3.6/#CVE-2026-34183","publisher":"OpenSSL Project","context":"The article cites this OpenSSL vulnerability entry as another memory-exhaustion denial-of-service issue that received a CVE in the same June 9 release.","category":"advisory","primary":false}],"body":"\u003cp\u003eOkta\u0026rsquo;s Red Team disclosed HollowByte, an OpenSSL denial-of-service flaw that can make an unpatched server reserve up to 131 KB of memory after receiving an 11-byte TLS request. The issue affects releases on the OpenSSL 4.0, 3.6, 3.5, 3.4, and 3.0 branches before the June 9 fixed versions 4.0.1, 3.6.3, 3.5.7, 3.4.6, and 3.0.21. OpenSSL shipped the fix without a CVE, advisory, or changelog entry identifying it.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs because older OpenSSL versions grew the TLS receive buffer based on the length declared in a handshake header before the message body arrived or handshake checks ran. For an inbound ClientHello, the allocation ceiling is 131 KB, and the worker thread then waits for a body that never comes. Okta said that on glibc systems it tested, freed buffers were not returned to the kernel, so varied connection sizes caused heap fragmentation and persistent resident memory growth.\u003c/p\u003e\n\n\u003cp\u003eOkta reported that in NGINX testing, a 1 GB server was OOM-killed with 547 MB of memory frozen in fragments, and a 16 GB server had 25% of system memory locked up without exceeding the connection ceiling. The article says this makes standard connection-limiting defenses insufficient and complicates downstream patch tracking because packages may be backported without changing their OpenSSL version string. The fix covers TLS only, while the article states that DTLS was left unchanged and still sizes its buffer from the peer-declared length in OpenSSL 4.0.1.\u003c/p\u003e\n"},{"n":1,"title":"Ernst \u0026 Young discloses data breach after support system hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ernst-and-young-discloses-data-breach-after-support-system-hack/","time":"14:55","priority":"SHOULD READ","score":82,"tldr":"Ernst \u0026 Young is notifying clients that a third-party support ticket system used by its IT staff was accessed by an unauthorized party, who downloaded documents that may contain client tax-related personal and financial information. EY says it has secured the system, notified law enforcement, and is offering affected clients 24 months of Experian identity monitoring.","briefOverview":"\u003cp\u003eErnst \u0026amp; Young is notifying customers of a data breach after a third-party support ticket system used by its IT personnel was compromised. The company said support tickets submitted through the platform may have included documents containing client tax information. EY is one of the world’s four largest auditing and professional services providers, with operations in more than 150 countries.\u003c/p\u003e\n\n\u003cp\u003eAccording to the breach notification, EY detected anomalous activity on its networks on April 23 and began an investigation. With help from external cybersecurity experts, the company determined that an unauthorized third party accessed the platform between March 28 and April 12 and downloaded multiple documents. The affected information included certain personal and financial data contained in or used to prepare tax filings, though the specific exposed data types remain unclear.\u003c/p\u003e\n\n\u003cp\u003eEY has not disclosed how many customers were affected or whether the incident impacts only U.S. customers or other countries as well. The company said it secured its systems, notified federal law enforcement, and removed the unauthorized access. EY said it is not aware of misuse or further exposure of the stolen files and is offering affected clients 24 months of identity monitoring and restoration services through Experian.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ernst \u0026 Young is notifying customers of a data breach caused by the compromise of a third-party support ticket system used by its IT personnel.","The company determined that an unauthorized third party accessed the support platform between March 28 and April 12 and downloaded multiple documents.","The exposed information included certain personal and financial data contained in or used to prepare tax filings, but the specific data types remain unclear.","Ernst \u0026 Young has not disclosed how many customers were affected or whether the incident impacts only U.S. customers or customers in other countries.","Ernst \u0026 Young says it secured its systems, notified federal law enforcement, and is offering affected clients 24 months of identity monitoring and restoration services through Experian."],"insights":["The incident shows that support ticket systems can hold highly sensitive client tax documents, even when they are not the primary systems used for tax filing work.","EY detected anomalous activity on April 23, after the unauthorized access window of March 28 to April 12 had already ended.","The public notice leaves major exposure details unresolved because the sample notification uses placeholders for specific data types and EY has not disclosed the number or location of affected customers.","No ransomware or data extortion group had claimed responsibility at the time of publication, despite the theft of multiple documents."],"referencedReports":[],"body":"\u003cp\u003eErnst \u0026amp; Young is notifying customers of a data breach after a third-party support ticket system used by its IT personnel was compromised. The company said support tickets submitted through the platform may have included documents containing client tax information. EY is one of the world’s four largest auditing and professional services providers, with operations in more than 150 countries.\u003c/p\u003e\n\n\u003cp\u003eAccording to the breach notification, EY detected anomalous activity on its networks on April 23 and began an investigation. With help from external cybersecurity experts, the company determined that an unauthorized third party accessed the platform between March 28 and April 12 and downloaded multiple documents. The affected information included certain personal and financial data contained in or used to prepare tax filings, though the specific exposed data types remain unclear.\u003c/p\u003e\n\n\u003cp\u003eEY has not disclosed how many customers were affected or whether the incident impacts only U.S. customers or other countries as well. The company said it secured its systems, notified federal law enforcement, and removed the unauthorized access. EY said it is not aware of misuse or further exposure of the stolen files and is offering affected clients 24 months of identity monitoring and restoration services through Experian.\u003c/p\u003e\n"},{"n":13,"title":"E.U. Orders Google to Open Android Mic, Camera and Screen to Rival AI Assistants","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/eu-orders-google-to-open-android-mic.html","time":"11:44","priority":"SHOULD READ","score":82,"tldr":"The European Commission ordered Google to make Android’s powerful AI-assistant capabilities, including access to the mic, camera, screen, wake word, and app automation, available to rival assistants by Android 18 or August 2027. Google warns this could weaken device security and privacy, but the EU says access must be user-consented and subject to limited safeguards.","briefOverview":"\u003cp\u003eThe European Commission ordered Google to give rival AI assistants the same reach into Android that Gemini already has, including access to the camera, microphone, screen contents, wake word functionality, and the ability to drive other apps in the background. Google must ship the changes in Android 18 and by 1 August 2027 at the latest. The Android decision is one of two binding specification decisions under the Digital Markets Act, with the second requiring Google to provide anonymised Search query, click, and ranking data to rival search engines and AI chatbots that do search.\u003c/p\u003e\n\n\u003cp\u003eThe Android decision covers 11 operating system features, five of which Google may place behind certification through a Qualified AI Assistant Programme. Six other features, including ambient data, always-on hotword detection, system-level on-device models, third-party model implementation, and background execution, carry no certification requirement. Ambient data includes microphone input, system audio, camera, screen contents, location, and sensors, continuously and in the background, under the same consent prompts that Google\u0026rsquo;s own AI services get.\u003c/p\u003e\n\n\u003cp\u003eGoogle objected that the Android decision threatens device security by granting external apps sensitive and powerful device permissions, while the article notes that the decision still gates access with user consent and allows process isolation and encryption. The article highlights a concrete risk involving notification content, citing SafeBreach\u0026rsquo;s hijacking of Gemini\u0026rsquo;s Android Utilities agent through indirect prompt injection. For app developers, the article says that by August 2027 a certified or user-approved assistant could open an app on a virtual display, read its screen, and click through it while the user does something else.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The European Commission ordered Google to give rival AI assistants the same reach into Android as Gemini, including access to the camera, microphone, screen contents, wake word functionality, and the ability to drive other apps in the background.","Google must implement the Android interoperability measures in the next major Android release, Android 18, and by 1 August 2027 at the latest.","The Android decision covers 11 operating system features, with Google allowed to require certification for five restricted features but barred from restricting access to six others, including ambient data, always-on hotword detection, and background execution.","For the restricted features, Google must create a Qualified AI Assistant Programme and allow third-party Trusted Certification Authorities to certify assistants free of charge under terms that must be reasonable, non-discriminatory, and cleared with the Commission before changes.","A second European Commission decision requires Google to provide anonymised Search query, click, and ranking data to rival search engines and AI chatbots that do search for a cost-based fee."],"insights":["Android app developers should decide before the Android 18 beta whether to block sensitive views from screen automation, because certified or user-approved assistants will be able to open apps on a virtual display, read their screens, and click through them in the background by August 2027.","Google won significant safeguards compared with the April draft, including restricted features, a certification programme, eligibility limits for Search data access, and later deadlines, but it did not win discretion to apply tougher integrity requirements to rivals than to Gemini.","The decision creates a narrow but important user override: paragraph 135 requires Google to let users bypass certification for restricted features on a per-service, per-device basis without hiding the option behind developer mode.","The security risk highlighted by Google is concrete rather than theoretical, because the article cites a SafeBreach case in which notification content was used to hijack Gemini’s Android Utilities agent through indirect prompt injection.","Some of the most sensitive capabilities, including ambient microphone, camera, screen, location, sensors, always-on hotword detection, and background execution, are not subject to certification unless Google later persuades the Commission to move them onto the restricted list."],"referencedReports":[{"title":"ENISA view on cybersecurity in the frontier AI era","url":"https://www.enisa.europa.eu/sites/default/files/2026-07/ENISA%20view%20on%20cybersecurity%20in%20the%20frontier%20AI%20era_en_0.pdf","publisher":"enisa","context":"The article cites this ENISA paper because Google referenced it while arguing that the EU’s Android decision raises security concerns, but the article notes that the paper does not mention Android, interoperability, or app permissions.","category":"opinion","primary":false}],"body":"\u003cp\u003eThe European Commission ordered Google to give rival AI assistants the same reach into Android that Gemini already has, including access to the camera, microphone, screen contents, wake word functionality, and the ability to drive other apps in the background. Google must ship the changes in Android 18 and by 1 August 2027 at the latest. The Android decision is one of two binding specification decisions under the Digital Markets Act, with the second requiring Google to provide anonymised Search query, click, and ranking data to rival search engines and AI chatbots that do search.\u003c/p\u003e\n\n\u003cp\u003eThe Android decision covers 11 operating system features, five of which Google may place behind certification through a Qualified AI Assistant Programme. Six other features, including ambient data, always-on hotword detection, system-level on-device models, third-party model implementation, and background execution, carry no certification requirement. Ambient data includes microphone input, system audio, camera, screen contents, location, and sensors, continuously and in the background, under the same consent prompts that Google\u0026rsquo;s own AI services get.\u003c/p\u003e\n\n\u003cp\u003eGoogle objected that the Android decision threatens device security by granting external apps sensitive and powerful device permissions, while the article notes that the decision still gates access with user consent and allows process isolation and encryption. The article highlights a concrete risk involving notification content, citing SafeBreach\u0026rsquo;s hijacking of Gemini\u0026rsquo;s Android Utilities agent through indirect prompt injection. For app developers, the article says that by August 2027 a certified or user-approved assistant could open an app on a virtual display, read its screen, and click through it while the user does something else.\u003c/p\u003e\n"},{"n":27,"title":"White House Launches Gold Eagle Initiative to Manage Surge in AI-Discovered Vulnerabilities","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/white-house-gold-eagle-initiative-ai-discovered-vulnerabilities?utm_medium=feed","time":"05:51","priority":"SHOULD READ","score":82,"tldr":"The White House launched the Gold Eagle clearinghouse to coordinate AI-discovered software vulnerabilities, but has disclosed little about its staffing, governance, funding, or how it will actually help overwhelmed maintainers validate and patch findings. The key risk is that AI may produce vulnerabilities faster than the existing ecosystem can process them, and Gold Eagle has not yet shown it can solve that bottleneck.","briefOverview":"\u003cp\u003eThe White House has launched Gold Eagle, a central clearinghouse meant to triage AI-discovered vulnerabilities and coordinate patches. The initiative is intended to collect findings from government and industry, coordinate which software gets scanned, validate reported vulnerabilities, and prioritize remediation across federal systems, critical infrastructure, and open source software. The administration publicly announced Gold Eagle on July 14, after it was reportedly launched internally by July 2 to meet a deadline in President Trump’s June executive order on AI security.\u003c/p\u003e\n\n\u003cp\u003eGold Eagle comes as frontier AI models become more capable of reviewing code, identifying vulnerabilities, and developing working proof-of-concept exploits. The article says this creates a bottleneck because finding thousands of possible flaws is not enough if maintainers, vendors, and government agencies cannot validate, disclose, patch, and distribute fixes at the same speed. The pressure is already visible in open source, with curl reporting security submissions at four to five times its 2024 rate and later pausing vulnerability reports for July.\u003c/p\u003e\n\n\u003cp\u003eThe White House says Gold Eagle has begun receiving and prioritizing vulnerabilities and coordinating verification of scanning results, but it has not named participants, disclosed how many findings are in the system, or identified completed patches. The article says the initiative will use Carnegie Mellon University’s VINCE platform, operated by the CERT Coordination Center, as its central reporting platform. The administration has not explained Gold Eagle’s day-to-day operations, staffing, funding, governance, prioritization criteria, or how it will work alongside existing programs such as the CVE program, the National Vulnerability Database, and CISA disclosure efforts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The White House launched the Gold Eagle initiative as a central clearinghouse to triage AI-discovered vulnerabilities, coordinate software scanning, validate reported flaws, and prioritize patches across federal systems, critical infrastructure, and open source software.","Gold Eagle was publicly announced on July 14 after being launched internally by July 2 to meet a deadline in President Trump’s June executive order on AI security.","The White House said Gold Eagle has begun receiving and prioritizing vulnerabilities and coordinating verification of scanning results, but it has not named participating companies or open source organizations, disclosed how many findings are in the system, or identified patches completed through it.","The initiative is meant to address a growing bottleneck in which AI tools can find large numbers of possible software flaws faster than maintainers, vendors, and government agencies can validate, disclose, patch, and distribute fixes.","The administration has not explained Gold Eagle’s day-to-day operations, staffing, funding, governance, prioritization criteria, or how it will work alongside existing vulnerability programs such as the CVE program, the National Vulnerability Database, and CISA disclosure efforts."],"insights":["Gold Eagle is not introducing an entirely new reporting platform; the article says it will use Carnegie Mellon University’s existing VINCE system operated by the CERT Coordination Center.","The pressure from AI-assisted vulnerability reporting is already visible in open source, with curl reporting security submissions at four to five times its 2024 rate and later pausing vulnerability reports for July to give maintainers relief.","The article highlights a mismatch between Gold Eagle’s ambitions and its authority, because the initiative can prioritize and coordinate reports but cannot compel vendors or open source maintainers to fix them.","The National Vulnerability Database’s backlog problems are presented as a warning sign for Gold Eagle, showing that coordination efforts can fail without clear ownership, sufficient capacity, and a sustainable operating plan."],"referencedReports":[],"body":"\u003cp\u003eThe White House has launched Gold Eagle, a central clearinghouse meant to triage AI-discovered vulnerabilities and coordinate patches. The initiative is intended to collect findings from government and industry, coordinate which software gets scanned, validate reported vulnerabilities, and prioritize remediation across federal systems, critical infrastructure, and open source software. The administration publicly announced Gold Eagle on July 14, after it was reportedly launched internally by July 2 to meet a deadline in President Trump’s June executive order on AI security.\u003c/p\u003e\n\n\u003cp\u003eGold Eagle comes as frontier AI models become more capable of reviewing code, identifying vulnerabilities, and developing working proof-of-concept exploits. The article says this creates a bottleneck because finding thousands of possible flaws is not enough if maintainers, vendors, and government agencies cannot validate, disclose, patch, and distribute fixes at the same speed. The pressure is already visible in open source, with curl reporting security submissions at four to five times its 2024 rate and later pausing vulnerability reports for July.\u003c/p\u003e\n\n\u003cp\u003eThe White House says Gold Eagle has begun receiving and prioritizing vulnerabilities and coordinating verification of scanning results, but it has not named participants, disclosed how many findings are in the system, or identified completed patches. The article says the initiative will use Carnegie Mellon University’s VINCE platform, operated by the CERT Coordination Center, as its central reporting platform. The administration has not explained Gold Eagle’s day-to-day operations, staffing, funding, governance, prioritization criteria, or how it will work alongside existing programs such as the CVE program, the National Vulnerability Database, and CISA disclosure efforts.\u003c/p\u003e\n"},{"n":7,"title":"US charges two over laundering $43 million from investment fraud","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-charges-two-over-laundering-43-million-from-investment-fraud/","time":"08:13","priority":"SHOULD READ","score":78,"tldr":"U.S. prosecutors charged Zhuoying Chen and Haojie Zhang with laundering at least $43 million stolen from cyber investment scam victims through 140 bank accounts tied to shell companies. If convicted of money laundering conspiracy, they each face up to 20 years in prison.","briefOverview":"\u003cp\u003eU.S. prosecutors charged 27-year-old Zhuoying Chen and 38-year-old Haojie Zhang over their alleged roles in a crime ring that laundered money stolen through cyber investment fraud scams. The indictment says the two Chinese nationals managed a network of more than a dozen people based in Queens and Brooklyn between 2020 and 2022. Prosecutors allege the network moved at least $43 million in scam proceeds to bank accounts in China.\u003c/p\u003e\n\n\u003cp\u003eThe laundering operation allegedly used 140 bank accounts under roughly 45 shell companies. The underlying scams involved criminals contacting potential victims through social media or messaging services, building trust, and persuading them to invest in fraudulent opportunities. Victims were shown fake profiles with profits to encourage more investment before additional funds were stolen.\u003c/p\u003e\n\n\u003cp\u003eIf convicted of conspiracy to commit money laundering, Chen and Zhang each face a maximum sentence of 20 years in prison. The article notes that investment fraud accounted for 49% of all scam-related incidents in the FBI’s 2025 Internet Crime Report, with reported losses of \u003cspan class=\"math inline\"\u003e\\(8.6 billion, up from \\)\u003c/span\u003e6.5 billion in 2024. It also cites recent U.S. and European enforcement actions against other pig butchering and investment fraud networks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. prosecutors charged Zhuoying Chen and Haojie Zhang for their alleged roles in a crime ring that laundered money stolen from cyber investment fraud scams.","Chen and Zhang allegedly managed a network of more than a dozen people in Queens and Brooklyn between 2020 and 2022.","The criminal network allegedly moved at least $43 million in scam proceeds to bank accounts in China using 140 bank accounts under roughly 45 shell companies.","The underlying scams involved contacting potential victims through social media or messaging services, building trust, showing fake profits, and stealing additional funds invested by victims.","If convicted of conspiracy to commit money laundering, Chen and Zhang each face a maximum sentence of 20 years in prison."],"insights":["Investment fraud made up 49% of all scam-related incidents in the FBI’s 2025 Internet Crime Report, showing that this type of scam represented nearly half of reported scam activity last year.","Reported investment fraud losses rose from $6.5 billion in 2024 to $8.6 billion in 2025, indicating a sharp increase despite ongoing law enforcement actions.","The alleged laundering operation relied on a large number of bank accounts and shell companies, showing that moving stolen funds was organized as a separate support network for the scammers.","Recent U.S. and European actions cited in the article show that authorities are targeting both the scammers and the financial networks that help move victim money."],"referencedReports":[],"body":"\u003cp\u003eU.S. prosecutors charged 27-year-old Zhuoying Chen and 38-year-old Haojie Zhang over their alleged roles in a crime ring that laundered money stolen through cyber investment fraud scams. The indictment says the two Chinese nationals managed a network of more than a dozen people based in Queens and Brooklyn between 2020 and 2022. Prosecutors allege the network moved at least $43 million in scam proceeds to bank accounts in China.\u003c/p\u003e\n\n\u003cp\u003eThe laundering operation allegedly used 140 bank accounts under roughly 45 shell companies. The underlying scams involved criminals contacting potential victims through social media or messaging services, building trust, and persuading them to invest in fraudulent opportunities. Victims were shown fake profiles with profits to encourage more investment before additional funds were stolen.\u003c/p\u003e\n\n\u003cp\u003eIf convicted of conspiracy to commit money laundering, Chen and Zhang each face a maximum sentence of 20 years in prison. The article notes that investment fraud accounted for 49% of all scam-related incidents in the FBI’s 2025 Internet Crime Report, with reported losses of \u003cspan class=\"math inline\"\u003e\\(8.6 billion, up from \\)\u003c/span\u003e6.5 billion in 2024. It also cites recent U.S. and European enforcement actions against other pig butchering and investment fraud networks.\u003c/p\u003e\n"},{"n":9,"title":"Dairy company Fairlife suspends production in US after cyber incident","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/dairy-company-fairlife-suspends-production-us-cyber-incident","time":"13:40","priority":"SHOULD READ","score":78,"tldr":"Fairlife, Coca-Cola’s dairy unit, temporarily halted U.S. production after detecting a ransomware intrusion, though it says product quality and safety were not affected. The company is still investigating the scope of the incident and has notified law enforcement.","briefOverview":"\u003cp\u003eA ransomware attack forced Coca-Cola Company’s Fairlife dairy unit to temporarily halt production in the United States. Coca-Cola said in a filing that Fairlife detected the intrusion on Thursday, and the full scope of the incident is not yet known. The company said product quality and safety have not been impacted, and Fairlife’s operations in Canada were not affected.\u003c/p\u003e\n\n\u003cp\u003eAn internal investigation is ongoing, and law enforcement has been notified. Coca-Cola did not specify the ransomware group behind the incident and did not announce any breach of corporate or consumer information. Fairlife’s U.S. operation includes plants in Michigan, New York and Arizona, and the brand surpassed $1 billion in annual retail sales in 2022.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that food and beverage companies worldwide have been prominent targets of cybercrime. It cites recent incidents involving Japanese brewer Sapporo, Japan’s largest refrigerated logistics company, Russian dairy companies, United Natural Foods, and South Africa’s largest chicken producer. These examples show that cyber incidents have recently disrupted organizations across food production, distribution, logistics and restaurants.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A ransomware attack forced Coca-Cola Company’s Fairlife dairy unit to temporarily halt production in the United States.","Coca-Cola said Fairlife detected the intrusion on Thursday and that the full scope of the incident is not yet known.","Coca-Cola said product quality and safety were not impacted, and Fairlife’s operations in Canada were not affected.","An internal investigation is ongoing, and law enforcement has been notified.","Coca-Cola did not name the ransomware group behind the incident or announce any breach of corporate or consumer information."],"insights":["The incident appears operationally disruptive even though Coca-Cola said product quality and safety were not impacted, showing that cyber incidents in food production can interrupt output without directly affecting the safety of goods.","Fairlife’s Canadian operations were not affected while U.S. production was suspended, indicating the disruption was not described as companywide across all Fairlife operations.","Coca-Cola’s filing did not identify the ransomware group or report a breach of corporate or consumer information, leaving the public details focused on operational impact rather than data exposure.","The article places Fairlife’s disruption alongside recent incidents affecting food, beverage, logistics and grocery organizations in Japan, Russia, the United States and South Africa, underscoring that this sector is being repeatedly disrupted across multiple countries."],"referencedReports":[],"body":"\u003cp\u003eA ransomware attack forced Coca-Cola Company’s Fairlife dairy unit to temporarily halt production in the United States. Coca-Cola said in a filing that Fairlife detected the intrusion on Thursday, and the full scope of the incident is not yet known. The company said product quality and safety have not been impacted, and Fairlife’s operations in Canada were not affected.\u003c/p\u003e\n\n\u003cp\u003eAn internal investigation is ongoing, and law enforcement has been notified. Coca-Cola did not specify the ransomware group behind the incident and did not announce any breach of corporate or consumer information. Fairlife’s U.S. operation includes plants in Michigan, New York and Arizona, and the brand surpassed $1 billion in annual retail sales in 2022.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that food and beverage companies worldwide have been prominent targets of cybercrime. It cites recent incidents involving Japanese brewer Sapporo, Japan’s largest refrigerated logistics company, Russian dairy companies, United Natural Foods, and South Africa’s largest chicken producer. These examples show that cyber incidents have recently disrupted organizations across food production, distribution, logistics and restaurants.\u003c/p\u003e\n"},{"n":4,"title":"Windows Server 2022 reach end of mainstream support in 90 days","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/windows-server-2022-reach-end-of-mainstream-support-in-90-days/","time":"09:10","priority":"MAY READ","score":68,"tldr":"Windows Server 2022 will leave mainstream support on October 13, 2026, but will continue receiving free monthly security updates under extended support until October 14, 2031. Microsoft recommends organizations begin planning and testing upgrades to Windows Server 2025 for full mainstream support.","briefOverview":"\u003cp\u003eMicrosoft announced that Windows Server 2022 will reach the end of mainstream support on October 13, 2026. The October 2026 security update will be the last mainstream support update for this version. After that date, Windows Server 2022 will move to extended support and continue receiving monthly security updates at no additional cost through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2022 was first announced in March 2021 and became generally available in September 2021 as a Long-Term Servicing Channel release with 10 years of support. Microsoft is advising customers to upgrade to Windows Server 2025, the latest Long-Term Servicing Channel release for Windows Server, to keep environments protected and supported with full mainstream support. Windows Server 2025 became generally available in November 2024 and can be tested through a free 180-day trial from the Microsoft Evaluation Center.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2025 will reach the end of mainstream support on November 13, 2029, with extended support ending on November 14, 2034. Microsoft also recently extended Windows Server 2022 hotpatching until October 2027 for systems running Datacenter: Azure Edition. The company pointed customers to its Lifecycle Policy search tool and Windows Lifecycle FAQ for more information about servicing dates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Windows Server 2022 will reach the end of mainstream support on October 13, 2026, with the October 2026 security update being the last mainstream support update for this version.","After October 13, 2026, Windows Server 2022 will move to extended support and continue receiving monthly security updates at no additional cost through October 14, 2031.","Microsoft advises customers to upgrade to Windows Server 2025, the latest Long-Term Servicing Channel release for Windows Server, to receive full mainstream support.","Windows Server 2025 became generally available in November 2024 and is available for testing through a free 180-day trial from the Microsoft Evaluation Center.","Microsoft extended Windows Server 2022 hotpatching until October 2027 for systems running the Datacenter: Azure Edition."],"insights":["Organizations do not need paid extended security coverage to keep Windows Server 2022 receiving monthly security updates after mainstream support ends, because Microsoft says extended support includes those updates at no additional cost through October 14, 2031.","Microsoft is urging customers to start upgrade testing now rather than waiting for the October 2026 cutoff, and it points to a free 180-day Windows Server 2025 trial as the way to test before deployment.","Windows Server 2022 Datacenter: Azure Edition has a different timeline for hotpatching than the general mainstream support deadline, with hotpatching extended until October 2027.","Moving to Windows Server 2025 provides a longer support timeline than staying on Windows Server 2022, with mainstream support ending on November 13, 2029 and extended support ending on November 14, 2034."],"referencedReports":[{"title":"Windows Server 2022 end of mainstream support message center update","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#4900","publisher":"Microsoft","context":"The article cites Microsoft’s message center update as the source for the October 13, 2026 mainstream support end date and the extended support timeline for Windows Server 2022.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft announced that Windows Server 2022 will reach the end of mainstream support on October 13, 2026. The October 2026 security update will be the last mainstream support update for this version. After that date, Windows Server 2022 will move to extended support and continue receiving monthly security updates at no additional cost through October 14, 2031.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2022 was first announced in March 2021 and became generally available in September 2021 as a Long-Term Servicing Channel release with 10 years of support. Microsoft is advising customers to upgrade to Windows Server 2025, the latest Long-Term Servicing Channel release for Windows Server, to keep environments protected and supported with full mainstream support. Windows Server 2025 became generally available in November 2024 and can be tested through a free 180-day trial from the Microsoft Evaluation Center.\u003c/p\u003e\n\n\u003cp\u003eWindows Server 2025 will reach the end of mainstream support on November 13, 2029, with extended support ending on November 14, 2034. Microsoft also recently extended Windows Server 2022 hotpatching until October 2027 for systems running Datacenter: Azure Edition. The company pointed customers to its Lifecycle Policy search tool and Windows Lifecycle FAQ for more information about servicing dates.\u003c/p\u003e\n"},{"n":21,"title":"Armenia Detains Russian Tourist on U.S. Warrant for REvil Hacker, Lawyers Say Wrong Man","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/armenia-detains-russian-tourist-on-us.html","time":"10:53","priority":"MAY READ","score":68,"tldr":"Armenia detained a Russian tourist named Aleksandr Ermakov on a U.S. extradition request for a suspected REvil ransomware operator, but his lawyers say authorities have confused him with a different Aleksandr Ermakov already serving a sentence in Russia. The case appears to hinge on incomplete identity data in the warrant or Interpol notice, with no public confirmation yet from Armenian or U.S. authorities.","briefOverview":"\u003cp\u003eArmenia has detained a Russian tourist named Aleksandr Ermakov since June 28 on a U.S. extradition request for a REvil ransomware suspect with the same name. His wife said he was stopped at Yerevan’s Zvartnots airport, and his lawyers say the United States has the wrong person. They identify the detained man as Aleksandr Yuryevich Ermakov from Omsk, a former prison-service lawyer who does not speak English.\u003c/p\u003e\n\n\u003cp\u003eThe person sought by the United States is described in sanctions records as Aleksandr Gennadievich Ermakov, who was sanctioned by Australia, the United States, and the United Kingdom in January 2024 over the theft of 9.7 million records from Medibank Private. Russian reporting cited in the article says that man is serving a two-year Russian sentence that bars him from leaving the country. The U.S. charging document reportedly accuses an Aleksandr Ermakov of taking part in Sodinokibi/REvil attacks from about April 2019 to July 12, 2021, affecting more than 1,000 victims including companies, law enforcement, government offices, schools, and hospitals.\u003c/p\u003e\n\n\u003cp\u003eThe article says the possible confusion may involve incomplete identity information, because Russian passports include a patronymic that distinguishes people with the same first and last name. Australia’s and the United Kingdom’s records include the patronymic Gennadievich, while OFAC’s public sanctions entry lists only Aleksandr Ermakov with a date of birth and several handles. Armenian authorities have not commented, the U.S. Justice Department has announced no charges, and the detained man is being held on a 30-day Interpol detention order while Moscow seeks consular access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Armenia has detained Russian tourist Aleksandr Yuryevich Ermakov since June 28 on a U.S. extradition request for a REvil ransomware suspect named Aleksandr Ermakov.","The U.S.-wanted person is identified in sanctions records as Aleksandr Gennadievich Ermakov, who was sanctioned by Australia, the United States, and the United Kingdom in January 2024 over the Medibank Private data theft.","Lawyers for the detained man say he is a former prison-service lawyer from Omsk who does not speak English and is not the same person as the sanctioned hacker.","Russian reporting cited in the article says Aleksandr Gennadievich Ermakov is serving a two-year Russian sentence that bars him from leaving the country.","The article says Armenian authorities have not commented, the U.S. Justice Department has announced no charges, and the detained man is being held on a 30-day Interpol detention order while Moscow seeks consular access."],"insights":["The article highlights a concrete identity-matching risk: Russian passports include a patronymic that distinguishes people with the same first and last name, but OFAC’s public sanctions entry for Aleksandr Ermakov omits that field.","The reported U.S. REvil charging window ends on July 12, 2021, while the Medibank Private hack attributed to the sanctioned Ermakov occurred in October 2022, showing that the public sanctions record and the reported warrant describe partly different activity timelines.","Several Russian outlets cited as separate sources are linked through National Media Group, and the article notes that Izvestia has supplied news for REN TV and Channel Five since 2017.","The defense says standard identity checks such as fingerprints or full passport data have not been produced, leaving the case, in their account, dependent on an arrest warrant rather than confirmed biometric or full-document matching."],"referencedReports":[{"title":"Medibank's attacker: IT businessman, claimed psychologist and alleged cybercriminal","url":"https://www.intel471.com/blog/medibanks-attacker-it-businessman-claimed-psychologist-and-alleged-cybercriminal","publisher":"Intel 471","context":"The article cites Intel 471’s analysis of forum data tying the sanctioned Aleksandr Ermakov to handles including SHTAZI, shtaziIT, and JimJones.","category":"research","primary":false}],"body":"\u003cp\u003eArmenia has detained a Russian tourist named Aleksandr Ermakov since June 28 on a U.S. extradition request for a REvil ransomware suspect with the same name. His wife said he was stopped at Yerevan’s Zvartnots airport, and his lawyers say the United States has the wrong person. They identify the detained man as Aleksandr Yuryevich Ermakov from Omsk, a former prison-service lawyer who does not speak English.\u003c/p\u003e\n\n\u003cp\u003eThe person sought by the United States is described in sanctions records as Aleksandr Gennadievich Ermakov, who was sanctioned by Australia, the United States, and the United Kingdom in January 2024 over the theft of 9.7 million records from Medibank Private. Russian reporting cited in the article says that man is serving a two-year Russian sentence that bars him from leaving the country. The U.S. charging document reportedly accuses an Aleksandr Ermakov of taking part in Sodinokibi/REvil attacks from about April 2019 to July 12, 2021, affecting more than 1,000 victims including companies, law enforcement, government offices, schools, and hospitals.\u003c/p\u003e\n\n\u003cp\u003eThe article says the possible confusion may involve incomplete identity information, because Russian passports include a patronymic that distinguishes people with the same first and last name. Australia’s and the United Kingdom’s records include the patronymic Gennadievich, while OFAC’s public sanctions entry lists only Aleksandr Ermakov with a date of birth and several handles. Armenian authorities have not commented, the U.S. Justice Department has announced no charges, and the detained man is being held on a 30-day Interpol detention order while Moscow seeks consular access.\u003c/p\u003e\n"},{"n":23,"title":"Three Brands, One Lure: A Chase 'Secure Message via Virtru' That Actually Came From LinkedIn","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/chase-virtru-linkedin-brand-mismatch-mimecast-credential-harvest","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing email impersonated a Chase secure message via Virtru while actually using a LinkedIn sender address and Mimecast-wrapped links, creating a three-brand mismatch designed to look trustworthy. The key warning sign was that the visible brand, sender, and link destination did not align, alongside stale and generic message content.","briefOverview":"\u003cp\u003eA phishing email impersonated Chase using a pixel-accurate secure-message template that claimed the recipient had a new secure message via Virtru. The message reached an organization’s mailboxes in June and used Chase branding, a Chase-blue header, the Chase logo, and a JPMorgan Chase footer. IRONSCALES Themis classified it as phishing at 90% confidence and remediated it across the affected mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that the email presented three unrelated identities at once: Chase as the visible brand, Virtru as the claimed secure-message provider, and LinkedIn as the actual sender through the From header \u003ccode\u003emessages-noreply@linkedin.com\u003c/code\u003e. The call-to-action buttons pointed to real Mimecast URL-protection domains rather than directly to Chase, using a recognized security vendor’s link-wrapping infrastructure to appear more trustworthy. The article describes this as a redirect-laundering pattern where the wrapper’s reputation helps maintain the illusion.\u003c/p\u003e\n\n\u003cp\u003eSeveral content details also indicated reused, mass-produced phishing material. The secure-message expiration date was already past when the incident was raised, the grammar was broken, and the \u003ccode\u003eACH_Incoming_Payments\u003c/code\u003e label was generic with no personalization. The article says defenders should compare the visible brand, sender address, and link destination, avoid treating recognized rewrite domains as proof of safety, and verify bank messages outside the email itself.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing email impersonated Chase with a secure-message template that claimed the recipient had a new secure message via Virtru.","The email’s visible Chase branding, claimed Virtru provider, and actual From header of messages-noreply@linkedin.com created three unrelated identities in one message.","The call-to-action buttons used real Mimecast URL-protection domains, including a link with a chase.com parameter, instead of pointing directly to Chase.","The message contained signs of reused canned content, including an already-expired notice, broken grammar, and a generic ACH_Incoming_Payments label with no personalization.","IRONSCALES Themis classified the message as phishing at 90% confidence and remediated it across the affected mailboxes."],"insights":["The article emphasizes that a familiar link-wrapping domain such as mimecastprotect.com should not be treated as proof a link is safe, because attackers can use the reputation of security infrastructure to make a malicious path look legitimate.","A fast manual check can catch this kind of phish: the brand shown in the email, the address it was sent from, and the link destination should all point to the same organization.","The phishing message’s strongest warning signs were relational inconsistencies between Chase, Virtru, LinkedIn, and Mimecast rather than a single bad domain or authentication failure.","The already-expired date, broken grammar, and generic finance label showed that reused mass-campaign content can undermine even highly accurate brand imitation."],"referencedReports":[{"title":"Verizon 2025 DBIR","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article cites the report as showing phishing remains among the top initial-access vectors, with credential harvesting as a dominant objective.","category":"research","primary":false},{"title":"FBI IC3 2024 Internet Crime Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI IC3","context":"The article cites the report for its tally of $2.77 billion in business email compromise losses and notes finance functions are in the blast radius.","category":"research","primary":false}],"body":"\u003cp\u003eA phishing email impersonated Chase using a pixel-accurate secure-message template that claimed the recipient had a new secure message via Virtru. The message reached an organization’s mailboxes in June and used Chase branding, a Chase-blue header, the Chase logo, and a JPMorgan Chase footer. IRONSCALES Themis classified it as phishing at 90% confidence and remediated it across the affected mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that the email presented three unrelated identities at once: Chase as the visible brand, Virtru as the claimed secure-message provider, and LinkedIn as the actual sender through the From header \u003ccode\u003emessages-noreply@linkedin.com\u003c/code\u003e. The call-to-action buttons pointed to real Mimecast URL-protection domains rather than directly to Chase, using a recognized security vendor’s link-wrapping infrastructure to appear more trustworthy. The article describes this as a redirect-laundering pattern where the wrapper’s reputation helps maintain the illusion.\u003c/p\u003e\n\n\u003cp\u003eSeveral content details also indicated reused, mass-produced phishing material. The secure-message expiration date was already past when the incident was raised, the grammar was broken, and the \u003ccode\u003eACH_Incoming_Payments\u003c/code\u003e label was generic with no personalization. The article says defenders should compare the visible brand, sender address, and link destination, avoid treating recognized rewrite domains as proof of safety, and verify bank messages outside the email itself.\u003c/p\u003e\n"},{"n":10,"title":"Zelensky appoints Ukraine's acting security service chief as acting defense minister","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-acting-defense-minister-yevhenii-khmara","time":"12:50","priority":"MAY READ","score":62,"tldr":"Ukrainian President Volodymyr Zelensky named acting SBU chief Yevhenii Khmara as acting defense minister after a cabinet reshuffle sparked protests. Some lawmakers questioned whether the appointment is legal because Ukraine requires the defense minister to be a civilian.","briefOverview":"\u003cp\u003eUkrainian President Volodymyr Zelensky named intelligence and counterterrorism official Yevhenii Khmara as acting defense minister after a controversial government reshuffle sparked protests across Ukraine. Zelensky said he would formally ask parliament to approve Khmara as defense minister once the required legal procedures had been completed. The appointment follows public anger over Zelensky’s dismissal of Defense Minister Mykhailo Fedorov earlier in the week, with demonstrations in Kyiv and other cities continuing on Friday.\u003c/p\u003e\n\n\u003cp\u003eKhmara, a major general, has served as acting head of the Security Service of Ukraine since January after the dismissal of Vasyl Malyuk. He previously led the SBU’s Alpha Special Operations Center, an elite unit responsible for counterterrorism operations and intelligence support, as well as some of Ukraine’s long-range strikes against Russian targets. Zelensky said Khmara’s experience with technology-driven long-range strike operations made him well suited to oversee Ukraine’s defense during the war.\u003c/p\u003e\n\n\u003cp\u003eParliament approved most members of Zelensky’s new cabinet on Thursday, but the defense and foreign minister posts remained vacant because those candidates must be nominated separately by the president under Ukrainian law. Following Khmara’s appointment, his first deputy, Oleksandr Poklad, is expected to become acting head of the SBU. Several Ukrainian lawmakers questioned whether Khmara’s appointment complied with legislation requiring the defense minister and deputy defense ministers to be civilians rather than serving military officers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian President Volodymyr Zelensky named intelligence and counterterrorism official Yevhenii Khmara as acting defense minister after a government reshuffle sparked protests across Ukraine.","Zelensky said he would formally ask parliament to approve Khmara as defense minister once the required legal procedures had been completed.","Khmara has served as acting head of the Security Service of Ukraine since January and previously led the SBU's Alpha Special Operations Center.","Zelensky said Khmara's experience with technology-driven long-range strike operations made him well suited to oversee Ukraine's defense during the war.","Several Ukrainian lawmakers questioned whether Khmara's appointment complied with laws requiring the defense minister and deputy defense ministers to be civilians rather than serving military officers."],"insights":["Zelensky’s stated rationale indicates that Ukraine’s defense leadership is being oriented around technology-driven long-range strike operations during the war.","Khmara’s status as a major general creates an immediate legal controversy because lawmakers cited requirements that defense ministry leaders be civilians.","The appointment would trigger a broader leadership change in Ukraine’s security apparatus, with Oleksandr Poklad expected to become acting head of the SBU.","The reshuffle has already produced public demonstrations in multiple Ukrainian cities, showing that defense leadership changes are politically sensitive inside Ukraine."],"referencedReports":[],"body":"\u003cp\u003eUkrainian President Volodymyr Zelensky named intelligence and counterterrorism official Yevhenii Khmara as acting defense minister after a controversial government reshuffle sparked protests across Ukraine. Zelensky said he would formally ask parliament to approve Khmara as defense minister once the required legal procedures had been completed. The appointment follows public anger over Zelensky’s dismissal of Defense Minister Mykhailo Fedorov earlier in the week, with demonstrations in Kyiv and other cities continuing on Friday.\u003c/p\u003e\n\n\u003cp\u003eKhmara, a major general, has served as acting head of the Security Service of Ukraine since January after the dismissal of Vasyl Malyuk. He previously led the SBU’s Alpha Special Operations Center, an elite unit responsible for counterterrorism operations and intelligence support, as well as some of Ukraine’s long-range strikes against Russian targets. Zelensky said Khmara’s experience with technology-driven long-range strike operations made him well suited to oversee Ukraine’s defense during the war.\u003c/p\u003e\n\n\u003cp\u003eParliament approved most members of Zelensky’s new cabinet on Thursday, but the defense and foreign minister posts remained vacant because those candidates must be nominated separately by the president under Ukrainian law. Following Khmara’s appointment, his first deputy, Oleksandr Poklad, is expected to become acting head of the SBU. Several Ukrainian lawmakers questioned whether Khmara’s appointment complied with legislation requiring the defense minister and deputy defense ministers to be civilians rather than serving military officers.\u003c/p\u003e\n"},{"n":8,"title":"Inside the Search for \"Clean\" Residential Proxies for Carding","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/inside-the-search-for-clean-residential-proxies-for-carding/","time":"14:00","priority":"MAY READ","score":58,"tldr":"Criminal carding actors increasingly see residential proxies as only one fragile part of a broader identity-simulation setup, prioritizing “clean” IP reputation, precise location matching, and browser/device consistency. Defenders should not trust residential traffic by default and should focus on cross-session signals like fingerprints, billing data, behavior, and transaction velocity.","briefOverview":"\u003cp\u003eFlare researchers analyzed 2,889 unique underground posts from the past two years across about 545 discussion threads to understand how criminal carding actors use and evaluate residential proxies. The article says these actors no longer treat residential IP addresses as a reliable bypass by themselves, but as one part of a broader setup that includes device fingerprints, browser profiles, billing data, time zones, cookies, and transaction behavior. Carders increasingly separate proxy pools into “clean” and “dirty” based on history, reputation, and whether the addresses can reach fraud-sensitive financial services.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that carders are trying to construct a coherent digital identity rather than simply hide their real IP address. Underground posts discuss matching proxy geography not just to a country, but to details such as city, ZIP code, time zone, operating-system language, browser characteristics, and billing information. Other discussions connect residential proxies with antidetect browsers, isolated devices, cookie history, WebRTC configuration, Canvas and WebGL fingerprints, and user-agent consistency.\u003c/p\u003e\n\n\u003cp\u003eProvider restrictions on banks, payment processors, government portals, and other sensitive services are creating demand for residential proxies advertised as “finance enabled” or “bank compatible.” The article also cites recent FBI and industry action against domains associated with the NetNut residential proxy platform and the Popa botnet, which researchers linked to at least two million compromised devices. For defenders, the main takeaway is that residential traffic should be treated as context rather than proof of legitimacy, with stronger signals coming from consistency across device history, account age, browser fingerprint, payment details, billing information, velocity, and behavior after checkout.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Flare researchers analyzed 2,889 unique underground posts from the past two years across about 545 discussion threads about residential proxies and carding.","Carders increasingly distinguish between “clean” and “dirty” residential proxy pools based on prior use, reputation scores, and whether financial services have blocked the addresses.","Underground discussions show actors trying to match proxy location with stolen identity details such as billing ZIP code, device time zone, operating-system language, and browser characteristics.","Residential proxies are frequently discussed alongside antidetect browsers, isolated devices, cookie history, WebRTC configuration, Canvas and WebGL fingerprints, and user-agent consistency.","The article says defenders should treat residential traffic as context rather than proof that a user is legitimate, and should evaluate consistency across device history, account age, browser fingerprint, payment information, billing information, transaction velocity, and behavior after checkout."],"insights":["Carders view proxy reputation as dynamic, meaning an IP address can shift from “clean” to high-risk quickly because of how other customers use the same proxy infrastructure.","Some underground actors interpret provider blocks on banks and payment processors as evidence that those restricted proxy pools may be cleaner because they have not been repeatedly abused against financial services.","The loss of ZIP-code targeting from major residential-proxy providers is treated by some actors as a material obstacle because city-level targeting may not be precise enough to satisfy fraud controls.","The article indicates that fraud controls are raising operational costs for carders, who are spending more time comparing conflicting reputation scores, finding usable infrastructure, and aligning granular identity signals."],"referencedReports":[{"title":"Evading Residential Proxy Networks: Protecting Your Devices from Becoming a Tool for Criminals","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/evading-residential-proxy-networks-protecting-your-devices-from-becoming-a-tool-for-criminals","publisher":"FBI","context":"The article cites a March 2026 FBI alert warning that criminals can select residential proxy addresses down to the state and city level and use them for account takeover.","category":"advisory","primary":false}],"body":"\u003cp\u003eFlare researchers analyzed 2,889 unique underground posts from the past two years across about 545 discussion threads to understand how criminal carding actors use and evaluate residential proxies. The article says these actors no longer treat residential IP addresses as a reliable bypass by themselves, but as one part of a broader setup that includes device fingerprints, browser profiles, billing data, time zones, cookies, and transaction behavior. Carders increasingly separate proxy pools into “clean” and “dirty” based on history, reputation, and whether the addresses can reach fraud-sensitive financial services.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that carders are trying to construct a coherent digital identity rather than simply hide their real IP address. Underground posts discuss matching proxy geography not just to a country, but to details s
