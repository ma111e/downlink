<script type="application/json" id="dl-articles">[{"n":3,"title":"Hackers exploit SSHole OpenSSH flaw to breach Linux systems","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-sshole-openssh-flaw-to-breach-linux-systems/","time":"16:04","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting the SSHole flaw (CVE-2026-123158) in OpenSSH on certain musl-based Linux systems to bypass password protections, steal credentials, and establish persistence. Administrators should upgrade to OpenSSH 10.6p2 or disable SSH password authentication and investigate suspicious logins, SSH keys, and TAC Agent artifacts.","briefOverview":"\u003cp\u003eAttackers are actively exploiting the SSHole vulnerability, CVE-2026-123158, in OpenSSH on certain musl-based Linux systems, including Alpine Linux. The flaw can let an attacker sign in to accounts configured with an asterisk (*) in their password field to prevent password logins. Exploitation attempts began on November 5, when proof-of-concept code became available, and successful exploitation was recorded the following day. OpenSSH fixed the issue in version 10.6p2, released on November 5.\u003c/p\u003e\n\n\u003cp\u003eSSHole works because an oversized password can cause musl’s password-hashing function to return an asterisk on error, which OpenSSH incorrectly accepts as matching the account’s stored value. GreyNoise observed attackers performing system and container reconnaissance, querying cloud metadata services, attempting to obtain password hashes and root SSH keys, and modifying authorized_keys files for persistent access. One attacker gained root privileges and installed the TAC Agent command-and-control implant, although it could not reach its server. Administrators should update OpenSSH or disable SSH password authentication, and review systems for unexpected successful password logins to asterisk-marked accounts, unauthorized SSH keys, and TAC Agent files or startup services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are actively exploiting SSHole, tracked as CVE-2026-123158, to bypass authentication in OpenSSH on certain musl-based Linux systems such as Alpine Linux.","SSHole can allow login to accounts whose password field is set to an asterisk because an oversized password can cause musl’s password-hashing function to return the same value.","OpenSSH maintainers fixed the flaw in version 10.6p2 on November 5, and public exploit code became available about four hours later.","GreyNoise recorded successful attacks involving system and container reconnaissance, cloud metadata requests, attempts to obtain password hashes and root SSH keys, and changes to authorized_keys files for persistence.","Administrators are advised to update OpenSSH promptly or disable SSH password authentication and check for unexpected logins, unauthorized SSH keys, and TAC Agent files or startup services."],"insights":["The flaw does not affect accounts with valid password hashes; it requires specific authentication settings and targets accounts marked with an asterisk to block password logins.","Successful exploitation was recorded roughly 40 hours after the fix was released, highlighting how quickly public exploit code was used in observed intrusions.","One observed attacker obtained root access and installed TAC Agent, but the implant failed to contact its command-and-control server and did not receive tasks.","GreyNoise’s 27.5 million port-22 scans and 20.1 million attempted SSH sessions are not, by themselves, confirmed SSHole attacks, so raw internet scanning volume should not be treated as proof of compromise.","Unexpected successful password logins to accounts whose /etc/shadow password entry is an asterisk are a particularly relevant indicator for investigating this issue."],"referencedReports":[{"title":"SSHole Events","url":"http://sshole.events.greynoise.io/","publisher":"GreyNoise","context":"The article cites GreyNoise telemetry documenting the first successful in-the-wild SSHole exploitation and the post-compromise actions observed.","category":"research","primary":false},{"title":"CVE-2026-123158 Evidence","url":"https://previdian.com/CVE-2026-123158#evidence","publisher":"Previdian","context":"The article cites Previdian sensor telemetry confirming successful SSHole exploitation attempts from attacker IP addresses in multiple countries.","category":"research","primary":false}],"body":"\u003cp\u003eAttackers are actively exploiting the SSHole vulnerability, CVE-2026-123158, in OpenSSH on certain musl-based Linux systems, including Alpine Linux. The flaw can let an attacker sign in to accounts configured with an asterisk (*) in their password field to prevent password logins. Exploitation attempts began on November 5, when proof-of-concept code became available, and successful exploitation was recorded the following day. OpenSSH fixed the issue in version 10.6p2, released on November 5.\u003c/p\u003e\n\n\u003cp\u003eSSHole works because an oversized password can cause musl’s password-hashing function to return an asterisk on error, which OpenSSH incorrectly accepts as matching the account’s stored value. GreyNoise observed attackers performing system and container reconnaissance, querying cloud metadata services, attempting to obtain password hashes and root SSH keys, and modifying authorized_keys files for persistent access. One attacker gained root privileges and installed the TAC Agent command-and-control implant, although it could not reach its server. Administrators should update OpenSSH or disable SSH password authentication, and review systems for unexpected successful password logins to asterisk-marked accounts, unauthorized SSH keys, and TAC Agent files or startup services.\u003c/p\u003e\n"},{"n":9,"title":"Hackers Exploit Qubole's Trusted AWS Access to Breach Customer Accounts and Steal Data","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-quboles-trusted-aws.html","time":"17:51","priority":"MUST READ","score":94,"tldr":"Attackers used compromised Qubole AWS credentials to assume trusted customer IAM roles and steal secrets and S3 data from multiple AWS accounts between October 14 and 26. Organizations that have ever connected Qubole should review CloudTrail logs, revoke unused trust relationships, rotate exposed credentials, and restrict vendor role assumptions by source network and least privilege.","briefOverview":"\u003cp\u003eAn attacker accessed AWS accounts belonging to multiple Qubole customers between October 14 and October 26 by using credentials for Qubole’s AWS account. Qubole customers had created AWS roles that trusted Qubole’s account, allowing it to take on those roles’ permissions when supplying a matching External ID. Wiz said many of the abused roles were unused but still retained this trust relationship, enabling the attacker’s requests.\u003c/p\u003e\n\n\u003cp\u003eIn affected environments, the attacker collected credentials from Lambda environment variables, AWS Secrets Manager, and SSM Parameter Store, then used TruffleHog to test them. The attacker also copied accessible Amazon S3 data, at times downloading an entire bucket during a single session. Wiz advised organizations that have connected Qubole to AWS to examine CloudTrail records from October 1 onward, rotate accessible secrets and revoke active sessions where roles were abused, remove unneeded roles, restrict role assumptions by source network, and enable S3 data events or server access logs for sensitive buckets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers accessed multiple Qubole customers’ AWS accounts between October 14 and October 26 by using credentials for Qubole’s AWS account to assume customer roles that trusted it.","The attackers searched compromised environments for credentials in Lambda environment variables, AWS Secrets Manager, and SSM Parameter Store, then used TruffleHog to test stolen AWS, Entra ID, and Okta credentials.","The attackers also downloaded data from accessible Amazon S3 buckets, sometimes retrieving an entire bucket during one session.","Wiz advised organizations that have connected Qubole to AWS to review CloudTrail logs from October 1 onward for suspicious AssumeRole activity involving account 805246085872, attacker-linked IAM principals, IP addresses, or session names.","Wiz recommended removing unneeded Qubole roles, rotating secrets accessible to compromised roles, restricting role assumptions by source IP or VPC endpoint, and enabling S3 data events or server access logs for sensitive buckets."],"insights":["Most of the customer roles abused by the attacker were reportedly unused, but they remained accessible because they still trusted Qubole’s AWS account.","The required External ID did not prevent the misuse because AWS does not treat it as a secret and it can be viewed by parties with access to the role.","Simply rotating stolen credentials is insufficient after a compromise because existing role sessions remain active unless they are separately revoked.","CloudTrail management logs can show role assumptions and bucket listings but not the specific S3 objects read, leaving organizations without S3 data events or server access logs unable to determine exactly what data was taken."],"referencedReports":[{"title":"Qubole Cross-Account Access Abused in the Wild","url":"https://www.wiz.io/blog/qubole-cross-account-access-abused-in-the-wild","publisher":"wiz","context":"The article cites Wiz's technical analysis for details on the accepted AssumeRole requests, attacker activity, indicators, and mitigation guidance.","category":"research","primary":true}],"body":"\u003cp\u003eAn attacker accessed AWS accounts belonging to multiple Qubole customers between October 14 and October 26 by using credentials for Qubole’s AWS account. Qubole customers had created AWS roles that trusted Qubole’s account, allowing it to take on those roles’ permissions when supplying a matching External ID. Wiz said many of the abused roles were unused but still retained this trust relationship, enabling the attacker’s requests.\u003c/p\u003e\n\n\u003cp\u003eIn affected environments, the attacker collected credentials from Lambda environment variables, AWS Secrets Manager, and SSM Parameter Store, then used TruffleHog to test them. The attacker also copied accessible Amazon S3 data, at times downloading an entire bucket during a single session. Wiz advised organizations that have connected Qubole to AWS to examine CloudTrail records from October 1 onward, rotate accessible secrets and revoke active sessions where roles were abused, remove unneeded roles, restrict role assumptions by source network, and enable S3 data events or server access logs for sensitive buckets.\u003c/p\u003e\n"},{"n":1,"title":"France blames Iranian hackers for supermarket attacks that sparked fires","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/france-blames-iranian-hackers-for-supermarket-attacks-that-sparked-fires/","time":"18:32","priority":"SHOULD READ","score":88,"tldr":"France has attributed October cyberattacks on refrigeration controllers at roughly 700 retail locations, which caused major food losses and at least 15 fires, to the Iranian IRGC-linked Shahid Kaveh unit. The campaign also targeted Schneider Electric equipment at small hydroelectric facilities.","briefOverview":"\u003cp\u003eFrance has attributed October cyberattacks on refrigeration systems at approximately 700 retail locations to Shahid Kaveh, a cyber-offensive unit linked to Iran’s Islamic Revolutionary Guard Corps. The attacks affected major supermarket chains including Casino, Leclerc, Carrefour, and Intermarché, as well as smaller food businesses, a slaughterhouse, and cooperative food-processing facilities. French authorities said the incidents caused tens of millions of euros in food losses, significant material damage, and at least 15 fires.\u003c/p\u003e\n\n\u003cp\u003eAttackers reportedly compromised industrial refrigeration controllers overnight on October 11–12 and changed defrost settings to high temperatures, disrupting food-preservation systems. France’s CERT-FR linked the activity to Shahid Kaveh through shared infrastructure, use of the FOFA device-search platform, Farsi-language traces, and publicity by the CyberbanNews outlet. Investigators also connected attacks on Schneider Electric equipment at small hydroelectric installations to the same campaign, while France said it would summon Iran’s ambassador and seek new European Union sanctions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["France attributed October cyberattacks on refrigeration systems at French retail locations to Shahid Kaveh, a cyber-offensive unit linked to Iran's Islamic Revolutionary Guard Corps.","Attackers reportedly changed refrigeration-controller defrost settings to high temperatures overnight on October 11–12, disrupting food-preservation systems.","French authorities said approximately 700 retail locations were targeted, causing tens of millions of euros in food losses, significant material damage, and at least 15 fires.","The affected organizations included Casino, Leclerc, Coopérative U, Metro, Carrefour, and Intermarché, as well as smaller butcher shops, a slaughterhouse, and cooperative food-processing facilities.","Investigators also linked attacks against Schneider Electric equipment at small French hydroelectric installations to the same campaign, though those incidents had moderate effects."],"insights":["The incident demonstrates that remotely changing refrigeration defrost settings can produce physical consequences, including food spoilage, equipment damage, and fires.","France’s attribution relied on several converging indicators, including shared infrastructure used for Schneider Electric reconnaissance, use of FOFA, Farsi-language traces, and publicity from the CyberbanNews outlet.","The same campaign reportedly included reconnaissance against industrial equipment at small hydroelectric sites, extending beyond food retail systems.","Although later refrigeration incidents affected stores across six European countries and a French blood-storage incident used similar temperature-setting changes, France attributed only the October French supermarket attacks to Shahid Kaveh.","U.S. agencies FBI and CISA separately warned that industrial refrigeration and cold-chain monitoring systems are facing ongoing attacks worldwide."],"referencedReports":[{"title":"CERTFR-2026-CTI-009","url":"http://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/","publisher":"cert-fr","context":"The article cites this CERT-FR technical report for details on the affected organizations and France's attribution of the October attacks to Shahid Kaveh.","category":"research","primary":true}],"body":"\u003cp\u003eFrance has attributed October cyberattacks on refrigeration systems at approximately 700 retail locations to Shahid Kaveh, a cyber-offensive unit linked to Iran’s Islamic Revolutionary Guard Corps. The attacks affected major supermarket chains including Casino, Leclerc, Carrefour, and Intermarché, as well as smaller food businesses, a slaughterhouse, and cooperative food-processing facilities. French authorities said the incidents caused tens of millions of euros in food losses, significant material damage, and at least 15 fires.\u003c/p\u003e\n\n\u003cp\u003eAttackers reportedly compromised industrial refrigeration controllers overnight on October 11–12 and changed defrost settings to high temperatures, disrupting food-preservation systems. France’s CERT-FR linked the activity to Shahid Kaveh through shared infrastructure, use of the FOFA device-search platform, Farsi-language traces, and publicity by the CyberbanNews outlet. Investigators also connected attacks on Schneider Electric equipment at small hydroelectric installations to the same campaign, while France said it would summon Iran’s ambassador and seek new European Union sanctions.\u003c/p\u003e\n"},{"n":7,"title":"France blames Iran for fridge cyberattacks, says some caused fires","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/france-blames-iran-for-fridge-cyberattacks","time":"18:45","priority":"SHOULD READ","score":88,"tldr":"France has formally attributed cyberattacks that disrupted refrigeration systems at roughly 700 grocery stores, causing food losses and at least 15 fires, to the IRGC-linked Shahid Kaveh/CyberAv3ngers group. Authorities are pursuing sanctions and criminal action against alleged operators while warning of a broader Iranian campaign against French industrial targets.","briefOverview":"\u003cp\u003eFrench authorities accused Iran’s Islamic Revolutionary Guard Corps of sabotaging refrigeration systems at around 700 French grocery stores last month. France said the incidents caused extensive food losses and at least 15 fires, affecting major retail chains, smaller butchers, a slaughterhouse, and cooperative food-processing plants. ANSSI also identified simultaneous targeting of Schneider Electric equipment at several small hydroelectric facilities, where disruption was described as moderate.\u003c/p\u003e\n\n\u003cp\u003eA French Cyber Crisis Coordination Centre report attributed the activity to the IRGC’s Shahid Kaveh unit, also known as CyberAv3ngers, citing Farsi-language artifacts, attacker tools, infrastructure, and reconnaissance involving other industrial equipment. France summoned Iran’s ambassador, said it would pursue European sanctions, and opened a judicial investigation seeking arrest warrants for the unit’s alleged leader, deputies, and unidentified suspects. The report also connected another IRGC unit, Shahid Shoostari or Emennet Pasargad, to earlier actions against French interests, including an unsuccessful attempt to display anti-Israel imagery on advertising screens during the 2024 Paris Olympics.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["French authorities attributed cyberattacks on refrigeration systems at about 700 French grocery stores to Shahid Kaveh, an Iranian Islamic Revolutionary Guard Corps cyber unit also known as CyberAv3ngers.","France said the attacks caused extensive food losses and at least 15 fires, affecting large store chains as well as butchers, a slaughterhouse, and cooperative food-processing plants.","ANSSI said the same Iranian hackers also targeted Schneider Electric equipment at several small hydroelectric facilities, where the reported disruption was moderate.","France summoned Iran’s ambassador, plans to seek European sanctions, and opened a judicial investigation targeting Shahid Kaveh’s leader, two deputies, and other unidentified suspects.","French authorities said another IRGC unit, Shahid Shoostari or Emennet Pasargad, was linked to earlier operations against French interests, including attempted disruption of advertising displays during the 2024 Paris Olympics."],"insights":["The reported incidents demonstrate that interference with commercial refrigeration can extend beyond spoiled inventory to physical safety consequences, as France linked the disruptions to at least 15 fires.","French investigators based the attribution on multiple forms of evidence, including Farsi-language artifacts, attacker tools and infrastructure, and reconnaissance activity involving other industrial equipment.","The reported targeting was not limited to food retail: the same group was also linked to disruption at small hydroelectric facilities, while another IRGC unit was tied to attempted manipulation of public advertising displays during the Paris Olympics.","France’s published attribution addressed the October refrigeration attacks but did not cover the separate early-November wave that affected businesses across at least 11 European countries."],"referencedReports":[{"title":"CERTFR-2026-CTI-009","url":"https://cert.cyber.gouv.fr/cti/CERTFR-2026-CTI-009/","publisher":"france-cyber-crisis-coordination-centre","context":"The article relies on this five-page French government report for its attribution of the refrigeration-system sabotage to the IRGC-linked Shahid Kaveh unit.","category":"research","primary":true}],"body":"\u003cp\u003eFrench authorities accused Iran’s Islamic Revolutionary Guard Corps of sabotaging refrigeration systems at around 700 French grocery stores last month. France said the incidents caused extensive food losses and at least 15 fires, affecting major retail chains, smaller butchers, a slaughterhouse, and cooperative food-processing plants. ANSSI also identified simultaneous targeting of Schneider Electric equipment at several small hydroelectric facilities, where disruption was described as moderate.\u003c/p\u003e\n\n\u003cp\u003eA French Cyber Crisis Coordination Centre report attributed the activity to the IRGC’s Shahid Kaveh unit, also known as CyberAv3ngers, citing Farsi-language artifacts, attacker tools, infrastructure, and reconnaissance involving other industrial equipment. France summoned Iran’s ambassador, said it would pursue European sanctions, and opened a judicial investigation seeking arrest warrants for the unit’s alleged leader, deputies, and unidentified suspects. The report also connected another IRGC unit, Shahid Shoostari or Emennet Pasargad, to earlier actions against French interests, including an unsuccessful attempt to display anti-Israel imagery on advertising screens during the 2024 Paris Olympics.\u003c/p\u003e\n"},{"n":10,"title":"Hackers Compromise Ethersphere's bee-js and Swarm Desktop to Deliver Wallet-Stealing Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-compromise-etherspheres-bee-js.html","time":"17:36","priority":"SHOULD READ","score":88,"tldr":"Attackers used stolen Ethersphere CI credentials to publish malicious bee-js 13.3.0 and Swarm Desktop 0.56.2 releases that stole Swarm wallet keys and passwords and installed cross-platform backdoors. Anyone who installed or ran either version should treat the system and wallet credentials as compromised, rotate secrets from a clean machine, and rebuild or thoroughly remediate affected hosts.","briefOverview":"\u003cp\u003eAttackers used stolen Ethersphere continuous-integration credentials to publish malicious versions of bee-js and Swarm Desktop through the project’s own automated release workflows. bee-js 13.3.0 was available on npm for about 75 minutes, while Swarm Desktop 0.56.2 remained available for roughly 8.5 hours. The affected releases were withdrawn, and Ethersphere issued Swarm Desktop 0.56.3 as a clean replacement. However, updating does not remove any backdoor already installed or protect keys already sent to the attackers.\u003c/p\u003e\n\n\u003cp\u003eThe malware downloaded additional code that collected Swarm Desktop’s encrypted wallet key and the plain-text password stored in its configuration file, allowing attackers to access the node wallet’s funds, chequebook, and stake. It also installed the evjawbreaker remote shell on Linux and macOS and a ScreenConnect remote-access client on Windows. The bee-js package could execute its malicious code automatically during installation through a postinstall script, even if an application never imported the library. The malicious packages were built or signed through legitimate project workflows, including valid npm provenance and Apple notarization for the macOS application, showing that these checks did not establish that the release code had been reviewed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers used stolen Ethersphere CI credentials to publish malicious bee-js 13.3.0 and Swarm Desktop 0.56.2 releases through the project’s own automated release workflows.","The malicious code stole Swarm Desktop’s encrypted wallet key file and the plain-text password stored alongside it, and it installed backdoors on Windows, macOS, and Linux systems.","bee-js 13.3.0 was available on npm for about 75 minutes, while Swarm Desktop 0.56.2 was available for about 8.5 hours before both malicious releases were withdrawn.","Ethersphere released Swarm Desktop 0.56.3 as a clean replacement, but updating or reinstalling does not remove any backdoor already installed or protect wallet keys already sent to attackers.","The malware contacted api.frameworkmetrics[.]xyz, installed an evjawbreaker remote shell on Linux and macOS, and installed a ScreenConnect remote-access client on Windows."],"insights":["The malicious bee-js package could run automatically during installation through its postinstall script, meaning a project did not need to import or use the library for the malicious code to execute.","The compromised releases were built and signed through Ethersphere’s legitimate workflows, so bee-js carried valid npm provenance and the malicious macOS app was signed and notarized by Apple despite containing harmful code.","Swarm Desktop’s updater could distribute version 0.56.2 to Windows x64 systems and Apple Silicon Macs within about 10 minutes, while Intel Macs were not offered the update and Linux installations did not update automatically.","The Linux and macOS backdoor obtained its control-server address from an Ethereum smart contract, allowing the attackers to change where infected machines connect without replacing the installed backdoor."],"referencedReports":[{"title":"bee-js Compromise","url":"https://socket.dev/blog/bee-js-compromise","publisher":"socket","context":"The article cites Socket's incident analysis for the release timeline, automated update exposure, publishing workflow details, and valid npm provenance.","category":"research","primary":true},{"title":"Ethersphere bee-js npm Compromise","url":"https://safedep.io/blog/ethersphere-bee-js-npm-compromise","publisher":"safedep","context":"The article cites SafeDep's technical analysis for details of the shared loader, wallet-file theft, and cross-platform backdoor installation.","category":"research","primary":true},{"title":"GitHub Advisory GHSA-hh7j-5m3j-23pf","url":"https://github.com/advisories/GHSA-hh7j-5m3j-23pf","publisher":"github","context":"The article references the advisory warning that any computer where bee-js 13.3.0 was installed or running should be considered fully compromised.","category":"advisory","primary":false},{"title":"EtherDuck Analysis","url":"https://pluto.security/blog/sleepyduck-malware-open-vsx-extensions/","publisher":"pluto-security","context":"The article cites Pluto Security's analysis of malicious Open VSX extensions whose infrastructure and file-name patterns overlap with the payloads in this incident.","category":"research","primary":false}],"body":"\u003cp\u003eAttackers used stolen Ethersphere continuous-integration credentials to publish malicious versions of bee-js and Swarm Desktop through the project’s own automated release workflows. bee-js 13.3.0 was available on npm for about 75 minutes, while Swarm Desktop 0.56.2 remained available for roughly 8.5 hours. The affected releases were withdrawn, and Ethersphere issued Swarm Desktop 0.56.3 as a clean replacement. However, updating does not remove any backdoor already installed or protect keys already sent to the attackers.\u003c/p\u003e\n\n\u003cp\u003eThe malware downloaded additional code that collected Swarm Desktop’s encrypted wallet key and the plain-text password stored in its configuration file, allowing attackers to access the node wallet’s funds, chequebook, and stake. It also installed the evjawbreaker remote shell on Linux and macOS and a ScreenConnect remote-access client on Windows. The bee-js package could execute its malicious code automatically during installation through a postinstall script, even if an application never imported the library. The malicious packages were built or signed through legitimate project workflows, including valid npm provenance and Apple notarization for the macOS application, showing that these checks did not establish that the release code had been reviewed.\u003c/p\u003e\n"},{"n":4,"title":"Russian cloud firm Beget rebuilds from scratch after data wiper attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/russian-cloud-firm-beget-rebuilds-from-scratch-after-data-wiper-attack/","time":"17:50","priority":"SHOULD READ","score":83,"tldr":"Russian cloud provider Beget is rebuilding its infrastructure after an attacker accessed its management layer and deployed data-wiping scripts, destroying cloud, VPS, S3, Kubernetes, CDN, and configuration data. The company has restored part of its services but says much VPS data and backups cannot be recovered.","briefOverview":"\u003cp\u003eRussian cloud services provider Beget said a data-wiping malware incident forced it to rebuild its cloud infrastructure from scratch. On the night of November 1, an attacker gained access to management systems for the company’s full architecture and deployed scripts that erased server data. Beget detected the activity shortly after it began and disconnected all servers from the network to stop it from spreading. The company serves more than 200,000 customers, including online stores, media, and educational services.\u003c/p\u003e\n\n\u003cp\u003eBeget said data in its VPS, S3, and Kubernetes infrastructure was lost, along with CDN settings and IP configurations. VPS binary backups were completely lost, and only some VPS file backups survived; Beget estimated that file backups would be available for roughly half of VPS users. The company said matching available backups to specific users is technically complex and that it is impossible to recover all data.\u003c/p\u003e\n\n\u003cp\u003eMore than a week after the incident, Beget reported restoring 60% of shared hosting and 40% of the dedicated servers it manages. About 1,000 servers require manual checks for vulnerabilities and hidden scripts before they can return online, as the company is treating all infrastructure components as potentially infected. Beget said it found no evidence of data downloads or modifications and believes the observed activity was focused solely on destruction; it has notified police and government agencies and is working with cybersecurity firms on recovery.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On November 1, an attacker accessed Beget’s management systems and deployed scripts that erased server data across its cloud infrastructure.","Beget said the incident destroyed data for its VPS, S3, and Kubernetes services, as well as CDN settings and IP configurations.","VPS binary backups were completely lost, while file backups survived only partially and may be available for about half of VPS users.","More than a week after the attack, Beget reported restoring 60% of shared hosting and 40% of the dedicated servers it manages.","Beget is manually checking roughly 1,000 servers for vulnerabilities and hidden scripts before bringing them back online."],"insights":["A single compromise of Beget’s central management layer was sufficient to erase data across multiple services, including VPS, S3, Kubernetes, CDN settings, and IP configurations.","The incident also destroyed VPS binary backups, while surviving file backups may only be usable for about half of VPS customers, limiting the company’s ability to restore affected users.","Beget is prioritizing cautious recovery over rapid restoration by treating all infrastructure components as potentially compromised and manually checking about 1,000 servers before returning them to service.","Beget reported no evidence that the attacker downloaded or altered data, indicating that the observed activity was focused on destroying infrastructure rather than taking information."],"referencedReports":[],"body":"\u003cp\u003eRussian cloud services provider Beget said a data-wiping malware incident forced it to rebuild its cloud infrastructure from scratch. On the night of November 1, an attacker gained access to management systems for the company’s full architecture and deployed scripts that erased server data. Beget detected the activity shortly after it began and disconnected all servers from the network to stop it from spreading. The company serves more than 200,000 customers, including online stores, media, and educational services.\u003c/p\u003e\n\n\u003cp\u003eBeget said data in its VPS, S3, and Kubernetes infrastructure was lost, along with CDN settings and IP configurations. VPS binary backups were completely lost, and only some VPS file backups survived; Beget estimated that file backups would be available for roughly half of VPS users. The company said matching available backups to specific users is technically complex and that it is impossible to recover all data.\u003c/p\u003e\n\n\u003cp\u003eMore than a week after the incident, Beget reported restoring 60% of shared hosting and 40% of the dedicated servers it manages. About 1,000 servers require manual checks for vulnerabilities and hidden scripts before they can return online, as the company is treating all infrastructure components as potentially infected. Beget said it found no evidence of data downloads or modifications and believes the observed activity was focused solely on destruction; it has notified police and government agencies and is working with cybersecurity firms on recovery.\u003c/p\u003e\n"},{"n":8,"title":"Vanderbilt cybersecurity incident impacting campus devices and systems","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/vanderbilt-cyberattack-ransomware-alert","time":"18:30","priority":"SHOULD READ","score":82,"tldr":"Vanderbilt University is investigating and containing a cybersecurity incident that may affect campus devices and systems, advising students and staff to shut down devices and disconnect from university Wi‑Fi. The BYOD ransomware group has claimed responsibility and alleges it stole data.","briefOverview":"\u003cp\u003eVanderbilt University announced a cybersecurity incident on Monday that may affect campus devices and systems. Its IT team said it was actively investigating and working to contain the situation. The university told students and employees to shut down devices, disconnect from university Wi-Fi, and remain vigilant for suspicious activity such as pop-ups, security warnings, file changes, or password requests.\u003c/p\u003e\n\n\u003cp\u003eThe ransomware group BYOD added Vanderbilt to its leak site and claimed it stole data, although the university’s statement focused on its ongoing investigation. Vanderbilt serves about 14,000 students and employs more than 6,000 staff members, making potential disruption significant for the campus community. BYOD has also recently been linked to incidents involving Michigan State University and the University of New Mexico, where the attack affected medical facilities and led one hospital to turn away ambulances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Vanderbilt University announced that it is investigating and working to contain a cybersecurity incident that may affect campus devices and systems.","The university instructed students and employees to shut down their devices, disconnect from university Wi-Fi, and report suspicious activity to campus IT officials.","The ransomware group BYOD added Vanderbilt University to its leak site and claimed it had stolen data from the university.","BYOD has recently been linked to incidents involving Michigan State University and the University of New Mexico.","Halcyon reported a 40% increase in ransomware activity between July and September, with 111 groups claiming 2,766 attacks in 122 countries."],"insights":["Vanderbilt’s instruction to shut down devices and disconnect from university Wi-Fi indicates that its immediate response is focused on limiting potential effects across campus-connected systems.","BYOD appears to have escalated quickly: the group’s first observed victim was not until September 29, yet it has since been associated with claims involving several prominent universities and Trump Mobile.","The University of New Mexico incident shows that a university cyber incident can extend beyond academic operations, as its medical facilities were affected and one hospital diverted ambulances.","Reports from Halcyon and Trellix indicate that ransomware activity is becoming more fragmented, with more groups operating and newer groups accounting for a third of victim posts in August."],"referencedReports":[{"title":"Ransomware Evolution Report: Q3 2026","url":"https://www.halcyon.ai/ransomware-evolution-report/q3-2026","publisher":"halcyon","context":"The article cites Halcyon’s report for its finding of a 40% increase in ransomware activity between July and September.","category":"research","primary":false},{"title":"November 2026 Threat Report","url":"https://www.trellix.com/advanced-research-center/threat-reports/november-2026/","publisher":"trellix","context":"The article cites Trellix research reporting record numbers of ransomware groups and victim posts from April through September.","category":"research","primary":false}],"body":"\u003cp\u003eVanderbilt University announced a cybersecurity incident on Monday that may affect campus devices and systems. Its IT team said it was actively investigating and working to contain the situation. The university told students and employees to shut down devices, disconnect from university Wi-Fi, and remain vigilant for suspicious activity such as pop-ups, security warnings, file changes, or password requests.\u003c/p\u003e\n\n\u003cp\u003eThe ransomware group BYOD added Vanderbilt to its leak site and claimed it stole data, although the university’s statement focused on its ongoing investigation. Vanderbilt serves about 14,000 students and employs more than 6,000 staff members, making potential disruption significant for the campus community. BYOD has also recently been linked to incidents involving Michigan State University and the University of New Mexico, where the attack affected medical facilities and led one hospital to turn away ambulances.\u003c/p\u003e\n"},{"n":2,"title":"Binance denies data breach after alleged ShinyHunters claims","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/binance-denies-data-breach-after-alleged-shinyhunters-claims/","time":"16:12","priority":"SHOULD READ","score":78,"tldr":"Binance says it found no evidence that its systems or customer data were breached, dismissing a purported ShinyHunters listing claiming to sell data from 335 million users for $900,000 as likely a scam or infostealer-derived data.","briefOverview":"\u003cp\u003eA threat actor using the ShinyHunters name claimed to be selling data for 335 million Binance users for $900,000. The alleged records included identity-verification documents, account passwords, crypto wallet private keys, transaction histories, email addresses, phone numbers, and internal infrastructure information. Binance said it found no evidence that its systems, customer data, credentials, private keys, or infrastructure information were compromised in connection with the listing.\u003c/p\u003e\n\n\u003cp\u003eBinance said aspects of the claim were inconsistent with its data practices, including that it does not hold private keys for users’ external wallets and does not store passwords in plain text. The company said similar listings have often consisted of information-stealing malware data taken from users’ own devices rather than from Binance systems. It advised users not to share passwords, two-factor authentication codes, seed phrases, or private keys and to remain alert to phishing attempts. The claim follows Binance’s confirmation that North Korean hackers used a fake job interview to compromise an employee’s device, leading to the theft of about $6.34 billion in cryptocurrency from its wallet infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor using the ShinyHunters name claimed to be selling records for 335 million Binance users for $900,000.","The claimed data allegedly included KYC documents, passwords, crypto wallet private keys, transaction histories, email addresses, phone numbers, and internal infrastructure information.","Binance said it found no evidence that its systems, customer KYC data, account credentials, wallet private keys, or internal infrastructure information were compromised in connection with the listing.","Binance said similar listings can involve data collected by infostealer malware from users’ own devices rather than data stolen from Binance systems.","Binance advised customers not to share passwords, two-factor authentication codes, seed phrases, or private keys and to remain alert to phishing attempts."],"insights":["Binance identified several inconsistencies in the alleged dataset: it does not hold private keys for users’ external wallets, does not store passwords in plain text, and no longer operates in some jurisdictions cited by the seller.","Other forum users questioned the credibility of selling wallet private keys, noting that someone who genuinely controlled them could potentially take the associated funds instead.","The denial comes shortly after Binance confirmed that North Korean hackers used a fake job interview to get an employee to install malware, which the company said led to the theft of about $6.34 billion in cryptocurrency."],"referencedReports":[],"body":"\u003cp\u003eA threat actor using the ShinyHunters name claimed to be selling data for 335 million Binance users for $900,000. The alleged records included identity-verification documents, account passwords, crypto wallet private keys, transaction histories, email addresses, phone numbers, and internal infrastructure information. Binance said it found no evidence that its systems, customer data, credentials, private keys, or infrastructure information were compromised in connection with the listing.\u003c/p\u003e\n\n\u003cp\u003eBinance said aspects of the claim were inconsistent with its data practices, including that it does not hold private keys for users’ external wallets and does not store passwords in plain text. The company said similar listings have often consisted of information-stealing malware data taken from users’ own devices rather than from Binance systems. It advised users not to share passwords, two-factor authentication codes, seed phrases, or private keys and to remain alert to phishing attempts. The claim follows Binance’s confirmation that North Korean hackers used a fake job interview to compromise an employee’s device, leading to the theft of about $6.34 billion in cryptocurrency from its wallet infrastructure.\u003c/p\u003e\n"},{"n":6,"title":"Ukraine arrests four in $5 million crypto scam targeting Germans","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-arrests-scam-call-centers-germany","time":"15:24","priority":"MAY READ","score":68,"tldr":"Ukrainian police arrested four suspects, including the alleged leader, over a fraudulent call-center network that reportedly stole more than €4.3 million from 135 German victims through fake cryptocurrency and stock investment schemes.","briefOverview":"\u003cp\u003eUkrainian police arrested four people suspected of operating fraudulent call centers that targeted German citizens with fake cryptocurrency and stock investment platforms. Investigators identified 135 victims in Germany who collectively lost more than €4.3 million ($4.8 million). The arrests included the alleged leader of the group, with three men held before trial and a suspected co-organizer placed under house arrest.\u003c/p\u003e\n\n\u003cp\u003ePolice said the callers posed as financial advisers, gained victims’ trust, and helped them open cryptocurrency exchange accounts before directing funds to wallets controlled by the group. In some cases, the suspects allegedly accessed victims’ online banking accounts, then moved stolen money through bank accounts and cryptocurrency wallets to obscure its origin. Raids at more than 50 properties in Kyiv and other cities seized computers, phones, cryptocurrency wallets, documents, and more than $90,000 in cash; the case is part of a wider Ukrainian crackdown on scam call centers and alleged official protection of such operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian police arrested four suspects, including the alleged leader, over a network of fraudulent call centers that targeted people in Germany with fake cryptocurrency and stock investment platforms.","Investigators identified 135 German victims who collectively lost more than €4.3 million, and said scammers sometimes gained access to victims’ online banking accounts.","Ukrainian authorities searched more than 50 properties in Kyiv and other cities during raids in August and September, seizing devices, cryptocurrency wallets, documents, and more than $90,000 in cash.","Three suspects are being held before trial and a suspected co-organizer is under house arrest; those convicted could face up to 12 years in prison and property confiscation.","Ukraine has introduced legislation targeting scam call-center operations, while a separate anti-corruption investigation alleges officials accepted bribes to protect such centers from scrutiny."],"insights":["The alleged scheme relied on building victims’ trust before directing them to open cryptocurrency exchange accounts and send money to wallets controlled by the group.","The suspects allegedly used both bank accounts and cryptocurrency wallets to move stolen funds and conceal their origin, showing that the fraud extended beyond the initial fake investment pitch.","The investigation is part of a broader Ukrainian crackdown that has also uncovered allegations that senior security and law-enforcement officials were bribed to protect fraudulent call centers.","Ukraine’s new legislation targets not only organizers of scam call centers but also workers and recruiters, with some related offenses carrying prison terms of up to 12 years."],"referencedReports":[],"body":"\u003cp\u003eUkrainian police arrested four people suspected of operating fraudulent call centers that targeted German citizens with fake cryptocurrency and stock investment platforms. Investigators identified 135 victims in Germany who collectively lost more than €4.3 million ($4.8 million). The arrests included the alleged leader of the group, with three men held before trial and a suspected co-organizer placed under house arrest.\u003c/p\u003e\n\n\u003cp\u003ePolice said the callers posed as financial advisers, gained victims’ trust, and helped them open cryptocurrency exchange accounts before directing funds to wallets controlled by the group. In some cases, the suspects allegedly accessed victims’ online banking accounts, then moved stolen money through bank accounts and cryptocurrency wallets to obscure its origin. Raids at more than 50 properties in Kyiv and other cities seized computers, phones, cryptocurrency wallets, documents, and more than $90,000 in cash; the case is part of a wider Ukrainian crackdown on scam call centers and alleged official protection of such operations.\u003c/p\u003e\n"},{"n":11,"title":"9th November – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/9th-november-threat-intelligence-report/","time":"16:15","priority":"MAY READ","score":40,"tldr":"This weekly threat intelligence roundup highlights ransomware and supply-chain incidents, AI-enabled cybercrime, and active exploitation of critical flaws in SonicWall, Android, Barracuda, and OpenSSH. Organizations should prioritize patching exposed systems and reviewing credentials, update channels, and authentication controls.","briefOverview":"\u003cp\u003eThis weekly threat intelligence report covers ransomware, destructive attacks, supply-chain compromises, false emergency alerts, AI-assisted intrusions, and actively exploited software flaws. Queens Public Library had systems encrypted by ransomware, disrupting public computers, Wi-Fi, checkout equipment, digital media services, and its app, while Beget suffered a destructive attack that wiped cloud data and disrupted hundreds of websites. A compromise of OPSSHIELD\u0026rsquo;s cPGuard update channel caused about 2,950 customer servers to execute a malicious script that installed a backdoor and collected sensitive data.\u003c/p\u003e\n\n\u003cp\u003eThe report also describes cybercriminal use of the ARTEX AI framework, including campaigns that obtained more than 300 iOS signing certificates and about 190,000 gaming credentials. It highlights patches for SonicWall SonicOS SSL VPN, Android, Barracuda Email Security Gateway, and OpenSSH, including flaws linked to active exploitation that could bypass authentication or enable remote code execution. Additional research covers HYFLOCK ransomware, an APT29 mobile-targeting campaign, BITTER APT\u0026rsquo;s PapRAT spyware activity in South Asia, and SlippyNunchucks\u0026rsquo; abuse of Sogou Input Method delivery mechanisms to distribute DarkVigil malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Queens Public Library suffered a ransomware incident that encrypted systems and disrupted computers, Wi-Fi, checkout equipment, digital media services, and its mobile app while all 66 branches remained open.","A compromise of OPSSHIELD’s cPGuard update channel caused roughly 2,950 customer servers to run a malicious script that installed a backdoor and collected password hashes, credentials, and sensitive files.","Check Point Research identified 1,608 publicly accessible ARTEX instances and observed campaigns using the AI-powered framework to obtain more than 300 iOS signing certificates and approximately 190,000 gaming credentials.","SonicWall patched CVE-2026-19868, an actively exploited flaw in SonicOS SSL VPN services using SAML that could let attackers with valid alternative credentials bypass SAML controls, including multi-factor authentication.","OpenSSH version 10.6p2 fixes CVE-2026-123158, an actively exploited flaw affecting certain musl-based Linux systems without PAM that can allow oversized passwords to bypass authentication."],"insights":["The Queens Public Library incident disrupted many digital and checkout services without closing any of its 66 branches, showing that a ransomware event can severely limit services even when physical locations remain open.","The cPGuard compromise reached approximately 2,950 customer servers through a trusted update channel, demonstrating how one set of compromised credentials can affect many downstream systems at once.","Researchers found that October HYFLOCK ransomware builds had weaknesses in their file-encryption process that allowed partial data recovery without a decryption key.","SlippyNunchucks used DNS hijacking to abuse Sogou Input Method’s trusted update and configuration delivery mechanisms, and Tencent addressed the affected mechanism in version 16.10.","ARTEX was publicly reachable in 1,608 live instances, while observed campaigns using it obtained over 300 iOS signing certificates and about 190,000 gaming credentials."],"referencedReports":[{"title":"SonicWall Security Advisory AV26-1133","url":"https://www.cyber.gc.ca/en/alerts-advisories/sonicwall-security-advisory-av26-1133?utm_source=chatgpt.com","publisher":"canadian-centre-for-cyber-security","context":"The article links this advisory when reporting SonicWall's patch for CVE-2026-19868.","category":"advisory","primary":false},{"title":"Pre-Authentication Authorization Bypass \u0026 Command Injection","url":"https://trust.barracuda.com/security/pre-authentication-authorization-bypass-command-injection?utm_source=chatgpt.com","publisher":"barracuda","context":"The article links this vendor security advisory for the Barracuda Email Security Gateway flaws CVE-2026-116606 and CVE-2026-111560.","category":"advisory","primary":false},{"title":"BITTER Expands Its Arsenal With PapRAT","url":"https://www.fortinet.com/blog/threat-research/bitter-expands-its-arsenal-with-paprat","publisher":"fortinet","context":"The article cites Fortinet's technical analysis of BITTER APT's PapRAT espionage campaign against organizations in South Asia.","category":"research","primary":false},{"title":"SlippyNunchucks hijacks Sogou Input Method's brand promotion mechanism to distribute malware","url":"https://www.welivesecurity.com/en/eset-research/slippynunchucks-hijacks-sogou-input-methods-brand-promotion-mechanism-to-distribute-malware/","publisher":"eset","context":"The article cites ESET's research into SlippyNunchucks abusing Sogou Input Method delivery mechanisms through DNS hijacking.","category":"research","primary":false}],"body":"\u003cp\u003eThis weekly threat intelligence report covers ransomware, destructive attacks, supply-chain compromises, false emergency alerts, AI-assisted intrusions, and actively exploited software flaws. Queens Public Library had systems encrypted by ransomware, disrupting public computers, Wi-Fi, checkout equipment, digital media services, and its app, while Beget suffered a destructive attack that wiped cloud data and disrupted hundreds of websites. A compromise of OPSSHIELD\u0026rsquo;s cPGuard update channel caused about 2,950 customer servers to execute a malicious script that installed a backdoor and collected sensitive data.\u003c/p\u003e\n\n\u003cp\u003eThe report also describes cybercriminal use of the ARTEX AI framework, including campaigns that obtained more than 300 iOS signing certificates and about 190,000 gaming credentials. It highlights patches for SonicWall SonicOS SSL VPN, Android, Barracuda Email Security Gateway, and OpenSSH, including flaws linked to active exploitation that could bypass authentication or enable remote code execution. Additional research covers HYFLOCK ransomware, an APT29 mobile-targeting campaign, BITTER APT\u0026rsquo;s PapRAT spyware activity in South Asia, and SlippyNunchucks\u0026rsquo; abuse of Sogou Input Method delivery mechanisms to distribute DarkVigil malware.\u003c/p\u003e\n"},{"n":5,"title":"The Biggest Threat to Your GRC Job Isn’t AI. It’s Ignoring AI.","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-biggest-threat-to-your-grc-job-isnt-ai-its-ignoring-ai/","time":"15:05","priority":"MAY READ","score":25,"tldr":"Sponsored by Anecdotes, the article argues that GRC professionals should reskill for AI-driven operations by developing data literacy, governing agent performance, and maintaining auditable communication trails for agent actions.","briefOverview":"\u003cp\u003eThe sponsored article argues that AI agents are increasingly performing governance, risk, and compliance (GRC) tasks such as control testing, evidence collection, and framework mapping. It says this changes the role of GRC managers from carrying out routine tasks to directing and governing the agents that perform them. The article identifies three skills it considers critical: context through data literacy, agent governance, and communication.\u003c/p\u003e\n\n\u003cp\u003eIt warns that agents given screenshots, outdated exports, or manually rebuilt spreadsheets can produce confident but inaccurate outputs, making trustworthy data sources important. The article recommends tracing evidence to its original API or configuration source, setting agents measurable goals and boundaries, and monitoring outcomes including accuracy and escalation rates. It also calls for visible, time-stamped records of agent actions and handoffs so people can review and reverse automated decisions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says AI agents are already being used for GRC tasks such as control testing, evidence collection, and framework mapping.","It argues that GRC professionals should build data literacy so they can trace control evidence to its original source and assess whether data is trustworthy.","The article recommends treating AI agents like direct reports by setting measurable objectives, boundaries, accuracy standards, costs, and escalation rates.","It says organizations should ensure agent actions and handoffs are visible and time-stamped so humans can review and reverse them.","The article concludes that GRC managers who learn to direct and govern AI agents will be better positioned than those who continue only performing tasks that agents can automate."],"insights":["The article frames reliable data as a prerequisite for AI use in GRC, warning that agents can rapidly produce credible-looking but incorrect results when they rely on screenshots, stale exports, or manually rebuilt spreadsheets.","It proposes evaluating AI agents with operational metrics such as business outcome, efficiency, cost, accuracy, and escalation rate, rather than treating automation as automatically beneficial.","The article treats visibility into communications between AI agents as a control mechanism: recorded, time-stamped handoffs make automated actions reviewable and potentially reversible.","It suggests that the human role shifts from collecting evidence to designing and overseeing the data flows and rules that allow agents to perform that work."],"referencedReports":[],"body":"\u003cp\u003eThe sponsored article argues that AI agents are increasingly performing governance, risk, and compliance (GRC) tasks such as control testing, evidence collection, and framework mapping. It says this changes the role of GRC managers from carrying out routine tasks to directing and governing the agents that perform them. The article identifies three skills it considers critical: context through data literacy, agent governance, and communication.\u003c/p\u003e\n\n\u003cp\u003eIt warns that agents given screenshots, outdated exports, or manually rebuilt spreadsheets can produce confident but inaccurate outputs, making trustworthy data sources important. The article recommends tracing evidence to its original API or configuration source, setting agents measurable goals and boundaries, and monitoring outcomes including accuracy and escalation rates. It also calls for visible, time-stamped records of agent actions and handoffs so people can review and reverse automated decisions.\u003c/p\u003e\n"}]</script>
