<script type="application/json" id="dl-articles">[{"n":40,"title":"Active exploitation of Cisco Secure Firewall Management Center vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/fmc-ongoing-exploitation/","time":"16:08","priority":"MUST READ","score":98,"tldr":"Cisco Talos warns that two Cisco Secure Firewall Management Center vulnerabilities, including a critical authentication bypass, are being actively exploited by state-sponsored and ransomware actors. Organizations should apply Cisco’s hotfixes immediately and investigate for signs of web shells, reverse shells, Cyclops Blink malware, and Qilin-related activity.","briefOverview":"\u003cp\u003eCisco Talos is tracking active exploitation of two Cisco Secure Firewall Management Center Software vulnerabilities: CVE-2026-20079 and CVE-2026-20316. CVE-2026-20079 is a critical authentication bypass vulnerability with a CVSS score of 10.0 that can allow an unauthenticated remote attacker to execute scripts and obtain root access. CVE-2026-20316 has a CVSS score of 5.3 and allows a remote attacker to log in using a low-privileged account, but Talos says it can be combined with other Cisco Secure FMC vulnerabilities to elevate privileges.\u003c/p\u003e\n\n\u003cp\u003eTalos identified three clusters of post-compromise activity on FMC instances associated with state-sponsored and crimeware threat actors. UAT-12197 exploited CVE-2026-20079 to deploy a JSP web shell, place a malicious cmd.jar command executor, and query internal databases for user authentication data and credentials. UAT-11823 exploited CVE-2026-20079 and CVE-2026-20316, used a malicious license.tmp file to establish a Netcat-based reverse shell, exfiltrated managed-device configurations, and deployed a Cyclops Blink variant. UAT-11988, assessed by Talos with high confidence as a ransomware operator, used static credentials linked to CVE-2026-20316 for access and later carried out activity consistent with Qilin ransomware affiliates.\u003c/p\u003e\n\n\u003cp\u003eCisco advises customers to apply already released hotfixes for affected software versions for both CVEs as soon as possible. The article says a comprehensive hardening release containing these hotfixes and fixes for other internally discovered vulnerabilities will be released the following week. Talos also provides detection guidance, including Snort SIDs for CVE-2026-20079, CVE-2026-20316, and related malware, and lists indicators of compromise including web shell and command-executor hashes, attacker IP addresses, and a Cyclops Blink malware hash.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos is tracking active exploitation of CVE-2026-20079, a critical authentication bypass vulnerability in Cisco Secure Firewall Management Center Software, and CVE-2026-20316, a static-credentials vulnerability that allows remote login with a low-privileged account.","Cisco says hotfixes are already available for affected software versions and strongly advises customers to apply them immediately, with a broader hardening release planned for the week of September 14 or September 16 as stated in the article.","Talos identified a UAT-12197 activity cluster in which attackers exploited CVE-2026-20079 to deploy a JSP web shell, place a malicious cmd.jar command executor, and query internal databases for user authentication data and credentials.","Talos attributes a UAT-11823 cluster to an advanced persistent threat actor overlapping with Sandworm tooling, involving exploitation of the vulnerabilities, Netcat-based reverse shells, configuration exfiltration, and deployment of a Cyclops Blink variant.","Talos also describes UAT-11988 as a ransomware operator that used CVE-2026-20316 static credentials to access an FMC device, conduct reconnaissance and credential theft, create tunnels into the victim network, and later deploy Qilin ransomware on selected endpoints."],"insights":["The lower-severity CVE-2026-20316 is especially important because Talos says it can be combined with other Cisco Secure FMC vulnerabilities to elevate privileges, and it was used in both the UAT-11823 and UAT-11988 activity clusters.","Legitimate FMC functionality became part of the attack path, as both UAT-11823 and UAT-11988 abused package_info.pl and attacker-crafted license.tmp files to execute malicious actions with root privileges.","The compromised FMC systems were not just end targets; in the UAT-11988 case, the device was used as a foothold for broader internal reconnaissance, credential harvesting, tunneling, and preparation for endpoint encryption.","Detection should not focus only on the two CVEs, because the article provides separate Snort SIDs for the vulnerabilities and for malware, and describes post-compromise artifacts such as JSP web shells, cmd.jar, license.tmp abuse, Netcat reverse shells, SOCKS5 proxying, and Cyclops Blink."],"referencedReports":[{"title":"AA22-054A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-054a","publisher":"CISA","context":"The article references this cybersecurity advisory when stating that Cyclops Blink was previously attributed to the Russian APT Sandworm by the United States and United Kingdom.","category":"advisory","primary":false},{"title":"Cyclops Blink Malware Analysis Report","url":"https://www.ncsc.gov.uk/files/Cyclops-Blink-Malware-Analysis-Report.pdf","publisher":"NCSC","context":"The article links to this malware analysis report while describing the Cyclops Blink ELF implant deployed in the UAT-11823 activity cluster.","category":"research","primary":false}],"body":"\u003cp\u003eCisco Talos is tracking active exploitation of two Cisco Secure Firewall Management Center Software vulnerabilities: CVE-2026-20079 and CVE-2026-20316. CVE-2026-20079 is a critical authentication bypass vulnerability with a CVSS score of 10.0 that can allow an unauthenticated remote attacker to execute scripts and obtain root access. CVE-2026-20316 has a CVSS score of 5.3 and allows a remote attacker to log in using a low-privileged account, but Talos says it can be combined with other Cisco Secure FMC vulnerabilities to elevate privileges.\u003c/p\u003e\n\n\u003cp\u003eTalos identified three clusters of post-compromise activity on FMC instances associated with state-sponsored and crimeware threat actors. UAT-12197 exploited CVE-2026-20079 to deploy a JSP web shell, place a malicious cmd.jar command executor, and query internal databases for user authentication data and credentials. UAT-11823 exploited CVE-2026-20079 and CVE-2026-20316, used a malicious license.tmp file to establish a Netcat-based reverse shell, exfiltrated managed-device configurations, and deployed a Cyclops Blink variant. UAT-11988, assessed by Talos with high confidence as a ransomware operator, used static credentials linked to CVE-2026-20316 for access and later carried out activity consistent with Qilin ransomware affiliates.\u003c/p\u003e\n\n\u003cp\u003eCisco advises customers to apply already released hotfixes for affected software versions for both CVEs as soon as possible. The article says a comprehensive hardening release containing these hotfixes and fixes for other internally discovered vulnerabilities will be released the following week. Talos also provides detection guidance, including Snort SIDs for CVE-2026-20079, CVE-2026-20316, and related malware, and lists indicators of compromise including web shell and command-executor hashes, attacker IP addresses, and a Cyclops Blink malware hash.\u003c/p\u003e\n"},{"n":8,"title":"Cisco confirms CVE-2026-20079 Secure FMC flaw exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-confirms-cve-2026-20079-secure-fmc-flaw-exploited-in-attacks/","time":"21:40","priority":"MUST READ","score":96,"tldr":"Cisco confirmed that the maximum-severity CVE-2026-20079 authentication bypass flaw in Secure Firewall Management Center is being actively exploited, allowing unauthenticated remote attackers to run commands as root. Customers should apply Cisco’s fixes immediately and check for indicators of compromise, as patching will not clean already-compromised devices.","briefOverview":"\u003cp\u003eCisco confirmed that CVE-2026-20079, a maximum-severity authentication bypass vulnerability in Secure Firewall Management Center software, is being actively exploited in attacks. The flaw has a CVSS score of 10.0 and allows unauthenticated remote attackers to bypass authentication and execute scripts and commands as root on vulnerable devices. Cisco said its PSIRT became aware of active exploitation in August 2026, but it did not disclose when attacks began, who was behind them, or what activity occurred after exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is caused by an improper system process created at boot time and can be exploited by sending crafted HTTP requests to the web interface of an affected device. It affects Cisco Secure FMC Software and Cisco Security Cloud Control Firewall Management, and Cisco says the cloud-hosted Security Cloud Control service has already been patched. Cisco says there are no workarounds and recommends that customers upgrade to the latest software release.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-20079 to its Known Exploited Vulnerabilities catalog and ordered Federal Civilian Executive Branch agencies to secure vulnerable systems by September 12, 2026. The article notes that Cisco previously shared indicators of compromise for CVE-2026-20079 that overlapped with CVE-2026-20316, including a July 23 log entry involving \u003ccode\u003e/var/tmp/license.tmp\u003c/code\u003e. Cisco advises customers who find the indicators to contact TAC, warning that hot fixes will prevent future exploitation but will not remediate devices that are already compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco confirmed that CVE-2026-20079, a maximum-severity authentication bypass vulnerability in Secure Firewall Management Center software, is being actively exploited in attacks.","CVE-2026-20079 has a CVSS score of 10.0 and can allow unauthenticated remote attackers to execute scripts and commands as root on vulnerable devices.","Cisco says the flaw affects Cisco Secure FMC Software and Cisco Security Cloud Control Firewall Management, and that the cloud-hosted Security Cloud Control service has already been patched.","CISA added CVE-2026-20079 to its Known Exploited Vulnerabilities catalog and ordered Federal Civilian Executive Branch agencies to secure vulnerable systems by September 12, 2026.","Cisco advises customers to upgrade to the latest software release and says installing hot fixes will prevent future exploitation but will not remediate devices that are already compromised."],"insights":["Cisco’s own example indicator of compromise is dated July 23, which is weeks before the company says its PSIRT became aware of active exploitation of CVE-2026-20079 in August.","Cisco published the same indicators of compromise and the same Secure FMC hot fixes for CVE-2026-20079 and CVE-2026-20316, suggesting administrators should investigate both issues together when reviewing affected devices.","The presence of the /var/tmp/license.tmp log entry means the vulnerability may have been exploited, so Cisco advises customers who find it to contact TAC rather than relying only on software updates.","Cisco explicitly warns that the available hot fixes only prevent future exploitation and do not remediate Secure FMC devices that were already compromised."],"referencedReports":[{"title":"Cisco CVE-2026-20079 advisory","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-onprem-fmc-authbypass-5JPp45V2","publisher":"Cisco","context":"The article cites Cisco’s advisory update confirming active exploitation of CVE-2026-20079 in Secure Firewall Management Center software.","category":"advisory","primary":true},{"title":"Cisco CVE-2026-20316 advisory","url":"https://www.cisco.com/c/en/us/support/docs/csa/cisco-sa-fmc-static-cred-BET3Cjh.html","publisher":"Cisco","context":"The article references Cisco’s July advisory for a Secure FMC static credential vulnerability and notes that it shared indicators and hot fixes with the CVE-2026-20079 advisory.","category":"advisory","primary":false}],"body":"\u003cp\u003eCisco confirmed that CVE-2026-20079, a maximum-severity authentication bypass vulnerability in Secure Firewall Management Center software, is being actively exploited in attacks. The flaw has a CVSS score of 10.0 and allows unauthenticated remote attackers to bypass authentication and execute scripts and commands as root on vulnerable devices. Cisco said its PSIRT became aware of active exploitation in August 2026, but it did not disclose when attacks began, who was behind them, or what activity occurred after exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is caused by an improper system process created at boot time and can be exploited by sending crafted HTTP requests to the web interface of an affected device. It affects Cisco Secure FMC Software and Cisco Security Cloud Control Firewall Management, and Cisco says the cloud-hosted Security Cloud Control service has already been patched. Cisco says there are no workarounds and recommends that customers upgrade to the latest software release.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-20079 to its Known Exploited Vulnerabilities catalog and ordered Federal Civilian Executive Branch agencies to secure vulnerable systems by September 12, 2026. The article notes that Cisco previously shared indicators of compromise for CVE-2026-20079 that overlapped with CVE-2026-20316, including a July 23 log entry involving \u003ccode\u003e/var/tmp/license.tmp\u003c/code\u003e. Cisco advises customers who find the indicators to contact TAC, warning that hot fixes will prevent future exploitation but will not remediate devices that are already compromised.\u003c/p\u003e\n"},{"n":19,"title":"N-able N-central Pre-Auth RCE Flaw Exploited in the Wild","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/n-able-n-central-pre-auth-rce-flaw.html","time":"04:27","priority":"MUST READ","score":96,"tldr":"CISA added a critical N-able N-central pre-auth remote code execution flaw, CVE-2026-86218, to its exploited vulnerabilities catalog after N-able confirmed it is being exploited in the wild. Organizations running N-central should urgently apply the hotfix and check for signs of compromise, because a successful attack could give threat actors control over connected managed systems.","briefOverview":"\u003cp\u003eCISA added CVE-2026-86218, a maximum-severity flaw in N-able N-central, to its Known Exploited Vulnerabilities catalog. The flaw is described as a static code injection issue that could allow pre-authentication remote code execution. Federal Civilian Executive Branch agencies were required to apply fixes by September 11, 2026.\u003c/p\u003e\n\n\u003cp\u003eN-able patched CVE-2026-86218 in N-central 2026.3 Hotfix 4, released on September 5, 2026, and told customers the flaw has been observed being exploited in the wild. Huntress said it began investigating after a customer\u0026rsquo;s fully patched N-central production environment was compromised on September 4, 2026. Huntress said limited historical logging on the appliance meant it could not confirm which specific exploit was used or rule out alternative vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes two other N-central flaws, CVE-2026-86206 and CVE-2026-86207, which Rapid7 said can be chained to let a remote unauthenticated attacker bypass authentication and create a new attacker-controlled System Administrator account. watchTowr said it reproduced CVE-2026-86218 and warned that attackers could make changes in N-central that propagate across connected systems. The article says N-central is widely used by MSPs, MSSPs, and large IT organizations, making compromise of the product especially significant for connected customer and corporate environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-86218, a maximum-severity N-able N-central static code injection flaw, to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by September 11, 2026.","N-able said CVE-2026-86218 has been observed being exploited in the wild and urged customers to apply the hotfix immediately.","The flaw allows pre-authentication remote code execution and was patched in N-central 2026.3 Hotfix 4, released on September 5, 2026.","Huntress investigated the compromise of a customer's fully patched N-central production environment on September 4, 2026, but said limited logging prevented it from confirming which exploit was used.","Rapid7 reported that CVE-2026-86206 and CVE-2026-86207 can be chained to let a remote unauthenticated attacker bypass authentication and create a new attacker-controlled System Administrator account on an affected server."],"insights":["Patching alone may not be sufficient for exposed N-central instances because organizations are advised to review for indicators of compromise and anomalous activity that may show exploitation occurred before the update was applied.","The investigated compromise involved a fully patched N-central production environment, but Huntress said limited historical logging on the appliance prevented confirmation of which exploit was used.","N-central is described as especially valuable to attackers because compromising it can provide access to all connected computers and downstream systems managed through the platform.","Multiple serious N-central flaws were patched around the same time, including CVE-2026-86218 and the chainable CVE-2026-86206 and CVE-2026-86207, making post-incident attribution to a specific vulnerability difficult in the reported investigation."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/08/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article says CISA added the N-able N-central flaw CVE-2026-86218 to its Known Exploited Vulnerabilities catalog and set a remediation deadline for federal agencies.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA's KEV catalog as the catalog to which CVE-2026-86218 was added.","category":"advisory","primary":true},{"title":"N-central 2026.3 Hotfix 4 Release Notes","url":"https://documentation.n-able.com/N-central/Release_Notes/GA/Content/N-central_2026.3_HF3_Release_Notes.htm","publisher":"N-able","context":"The article cites N-able release notes for the N-central hotfix that patched CVE-2026-86218.","category":"advisory","primary":true},{"title":"N-central 2026.3 Hotfix 3 Release Notes","url":"https://documentation.n-able.com/N-central/Release_Notes/GA/Content/N-central_2026.3_HF4_Release_Notes.htm","publisher":"N-able","context":"The article cites N-able release notes for two other vulnerabilities, CVE-2026-86206 and CVE-2026-86207, patched the same day.","category":"advisory","primary":false},{"title":"VE: CVE-2026-86206, CVE-2026-86207: N-able N-central Authentication Bypass Fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-86206-cve-2026-86207-n-able-n-central-authentication-bypass-fixed/","publisher":"Rapid7","context":"The article references Rapid7's Stephen Fewer for technical details on chaining CVE-2026-86206 and CVE-2026-86207 to create an attacker-controlled System Administrator account.","category":"research","primary":false},{"title":"N-able Vulnerability Exploitation","url":"https://www.huntress.com/blog/n-able-vulnerability-exploitation","publisher":"Huntress","context":"The article cites Huntress's investigation into a compromised N-central production environment and its statement that limited logging prevented definitive attribution to a specific exploit.","category":"research","primary":true},{"title":"N-able Urgent Notice","url":"https://uptime.n-able.com/event/201814/","publisher":"N-able","context":"The article cites N-able's urgent customer notice stating that CVE-2026-86218 has been observed being exploited in the wild and urging immediate hotfix deployment.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added CVE-2026-86218, a maximum-severity flaw in N-able N-central, to its Known Exploited Vulnerabilities catalog. The flaw is described as a static code injection issue that could allow pre-authentication remote code execution. Federal Civilian Executive Branch agencies were required to apply fixes by September 11, 2026.\u003c/p\u003e\n\n\u003cp\u003eN-able patched CVE-2026-86218 in N-central 2026.3 Hotfix 4, released on September 5, 2026, and told customers the flaw has been observed being exploited in the wild. Huntress said it began investigating after a customer\u0026rsquo;s fully patched N-central production environment was compromised on September 4, 2026. Huntress said limited historical logging on the appliance meant it could not confirm which specific exploit was used or rule out alternative vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article also notes two other N-central flaws, CVE-2026-86206 and CVE-2026-86207, which Rapid7 said can be chained to let a remote unauthenticated attacker bypass authentication and create a new attacker-controlled System Administrator account. watchTowr said it reproduced CVE-2026-86218 and warned that attackers could make changes in N-central that propagate across connected systems. The article says N-central is widely used by MSPs, MSSPs, and large IT organizations, making compromise of the product especially significant for connected customer and corporate environments.\u003c/p\u003e\n"},{"n":22,"title":"Four Spy Groups Used the Same Chrome and Windows Exploit Kit Within a Week","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/four-spy-groups-used-same-chrome-and.html","time":"16:34","priority":"MUST READ","score":96,"tldr":"Multiple espionage groups, mostly suspected China-linked, rapidly adopted a new BlueMoon exploit kit chaining Chrome V8 and Windows ALPC flaws to compromise targets via phishing links. Patching Chrome and Windows blocks the initial exploit path, but organizations that may have been targeted should also hunt for persistence and payload artifacts such as GemStone, ShadowPad, suspicious scheduled tasks, and temp-folder executables.","briefOverview":"\u003cp\u003eMultiple espionage-motivated threat activity clusters have been found using a previously undocumented exploit kit called BlueMoon. Proofpoint attributed the first observed in-the-wild use to the China-aligned APT31 group on August 28, 2026, and said several other clusters adopted it within days. Most of the activity has a suspected China nexus, although some use remains unattributed.\u003c/p\u003e\n\n\u003cp\u003eBlueMoon chains together three flaws: CVE-2026-85046 in Google Chrome’s V8 engine, an unassigned V8 sandbox escape, and CVE-2026-85880 in Windows Advanced Local Procedure Call. The attacks begin with phishing emails that lure targets to actor-controlled URLs, where the Chrome flaws are used to gain code execution and escape the browser sandbox before the Windows flaw is used for local privilege escalation. The kit then injects shellcode that downloads payloads selected by the threat cluster operating the campaign.\u003c/p\u003e\n\n\u003cp\u003eObserved campaigns targeted U.S. non-governmental organizations, mining companies, commodity trading firms, aerospace companies, a Vietnamese manufacturing entity, and government, consulting, and financial organizations in Indonesia and Singapore. Payloads and follow-on activity included the GemStone malicious Chrome extension, ShadowPad, DLL sideloading sequences, Cloudflare Workers and R2 infrastructure, and scheduled tasks for persistence. Proofpoint said browser updates close the initial route in, but already installed artifacts such as extensions and scheduled tasks can remain after patching.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Proofpoint reported that multiple espionage-motivated threat activity clusters used a previously undocumented exploit kit called BlueMoon within days of its first observed in-the-wild use by APT31 on August 28, 2026.","BlueMoon chains CVE-2026-85046 in Google Chrome’s V8 engine, an unassigned V8 sandbox escape, and CVE-2026-85880 in Windows Advanced Local Procedure Call to achieve code execution, escape Chrome’s sandbox, and elevate privileges on Windows.","The attacks began with phishing emails that led victims to actor-controlled URLs serving BlueMoon, after which the kit downloaded different payloads depending on the threat cluster, including GemStone, ShadowPad, Rust malware, and DLL sideloading components.","Observed targets included U.S. non-governmental organizations, mining companies, physical commodity trading firms, U.S. aerospace companies, a Vietnamese manufacturing entity, and government, consulting, and financial sector organizations in Indonesia and Singapore.","Proofpoint said updating the browser closes the initial access route but does not remove already installed artifacts such as the GemStone extension, scheduled tasks, files in the Windows TEMP folder, or related registry and mutex indicators."],"insights":["The Chrome flaws were described as “patch-gap” zero-days, meaning the fixes were already visible in public Chromium source code before stable Chrome and other Chromium-based browsers had received them.","Proofpoint said BlueMoon’s verbose comments, extensive logging, and references to Google’s v8CTF may indicate AI-assisted development or an attempt to frame exploit work in a way that bypasses large language model guardrails.","The same high-value Chrome exploit chain appeared across multiple threat clusters within days, which Proofpoint said may reflect a reduced cost and barrier to entry for developing and sharing this class of capability.","Patching Chrome and Windows is not sufficient for organizations that may already have been targeted, because the article says installed artifacts such as the GemStone extension and scheduled tasks survive the updates.","Despite campaign-specific changes such as obfuscation, redirects, landing pages, operating system checks, and telemetry, Proofpoint found that the underlying BlueMoon exploit chain remained the same across variants."],"referencedReports":[{"title":"Once in a BlueMoon: Multiple State-Aligned Threat Actors Rapidly Adopt Novel Exploit Kit","url":"https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit","publisher":"Proofpoint","context":"The article cites Proofpoint's report as the source for the BlueMoon exploit kit findings and the assessment that multiple espionage clusters rapidly adopted it.","category":"research","primary":true},{"title":"The Phantom Extension: Backdooring Chrome Through Uncharted Pathways","url":"https://www.synacktiv.com/en/publications/the-phantom-extension-backdooring-chrome-through-uncharted-pathways","publisher":"Synacktiv","context":"The article references this technical analysis while describing the GhostChrome-X Chrome extension integrity bypass technique used to install the GemStone browser extension.","category":"research","primary":false}],"body":"\u003cp\u003eMultiple espionage-motivated threat activity clusters have been found using a previously undocumented exploit kit called BlueMoon. Proofpoint attributed the first observed in-the-wild use to the China-aligned APT31 group on August 28, 2026, and said several other clusters adopted it within days. Most of the activity has a suspected China nexus, although some use remains unattributed.\u003c/p\u003e\n\n\u003cp\u003eBlueMoon chains together three flaws: CVE-2026-85046 in Google Chrome’s V8 engine, an unassigned V8 sandbox escape, and CVE-2026-85880 in Windows Advanced Local Procedure Call. The attacks begin with phishing emails that lure targets to actor-controlled URLs, where the Chrome flaws are used to gain code execution and escape the browser sandbox before the Windows flaw is used for local privilege escalation. The kit then injects shellcode that downloads payloads selected by the threat cluster operating the campaign.\u003c/p\u003e\n\n\u003cp\u003eObserved campaigns targeted U.S. non-governmental organizations, mining companies, commodity trading firms, aerospace companies, a Vietnamese manufacturing entity, and government, consulting, and financial organizations in Indonesia and Singapore. Payloads and follow-on activity included the GemStone malicious Chrome extension, ShadowPad, DLL sideloading sequences, Cloudflare Workers and R2 infrastructure, and scheduled tasks for persistence. Proofpoint said browser updates close the initial route in, but already installed artifacts such as extensions and scheduled tasks can remain after patching.\u003c/p\u003e\n"},{"n":7,"title":"Google warns of new Chrome zero-day bug exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-patches-seventh-chrome-zero-day-exploited-in-attacks-this-year/","time":"06:25","priority":"MUST READ","score":95,"tldr":"Google patched an actively exploited Chrome zero-day, CVE-2026-87491, an out-of-bounds write flaw in the V8 engine that could allow remote code execution via crafted web pages. Users should update Chrome to the latest stable version as soon as possible.","briefOverview":"\u003cp\u003eGoogle patched 230 vulnerabilities on Tuesday, including an actively exploited Chrome zero-day tracked as CVE-2026-87491. The company said it is aware that an exploit for the flaw exists in the wild. This is the seventh actively exploited Chrome zero-day patched since the start of the year.\u003c/p\u003e\n\n\u003cp\u003ePatched Chrome versions are rolling out in the Stable Desktop channel for Windows, Mac, and Linux. The fixed versions are 153.0.8010.36 for Windows and Linux and 153.0.8010.37 for Mac. Google said the update could take days or weeks to reach all users worldwide, but it was available immediately when BleepingComputer checked for updates.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-87491 is a high-severity out-of-bounds write vulnerability in Chrome’s V8 JavaScript and WebAssembly engine. Remote attackers can exploit it through crafted HTML pages to execute arbitrary code inside the browser’s sandbox. Successful exploitation can also expose sensitive information through heap corruption or trigger a crash, while Google is keeping bug details restricted until most users have updated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google patched 230 vulnerabilities on Tuesday, including an actively exploited Chrome zero-day tracked as CVE-2026-87491.","Patched Chrome versions are rolling out as 153.0.8010.36 for Windows and Linux and 153.0.8010.37 for Mac in the Stable Desktop channel.","CVE-2026-87491 is a high-severity out-of-bounds write vulnerability in Chrome’s V8 JavaScript and WebAssembly engine.","Remote attackers can exploit CVE-2026-87491 with crafted HTML pages to execute arbitrary code inside Chrome’s sandbox.","Google said access to bug details may remain restricted until most users have updated with the fix."],"insights":["Chrome users do not necessarily need to wait for the staged rollout, because BleepingComputer found the patched update was available immediately through a manual update check.","Google released fixes only two days after the CVE-2026-87491 report, indicating a rapid patch turnaround for this actively exploited flaw.","V8 has appeared in multiple actively exploited Chrome zero-days this year, including CVE-2026-3910, CVE-2026-85046, and CVE-2026-87491.","Google is withholding technical details until most users are updated, which makes applying the patch promptly especially important for reducing exposure while exploit information is limited."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_0808145027.html","publisher":"Google","context":"The article cites Google's Tuesday security advisory as the source for the statement that an exploit for CVE-2026-87491 exists in the wild and for the patched Chrome versions.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle patched 230 vulnerabilities on Tuesday, including an actively exploited Chrome zero-day tracked as CVE-2026-87491. The company said it is aware that an exploit for the flaw exists in the wild. This is the seventh actively exploited Chrome zero-day patched since the start of the year.\u003c/p\u003e\n\n\u003cp\u003ePatched Chrome versions are rolling out in the Stable Desktop channel for Windows, Mac, and Linux. The fixed versions are 153.0.8010.36 for Windows and Linux and 153.0.8010.37 for Mac. Google said the update could take days or weeks to reach all users worldwide, but it was available immediately when BleepingComputer checked for updates.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-87491 is a high-severity out-of-bounds write vulnerability in Chrome’s V8 JavaScript and WebAssembly engine. Remote attackers can exploit it through crafted HTML pages to execute arbitrary code inside the browser’s sandbox. Successful exploitation can also expose sensitive information through heap corruption or trigger a crash, while Google is keeping bug details restricted until most users have updated.\u003c/p\u003e\n"},{"n":21,"title":"SAP Patches CVSS 10.0 Kernel Flaw Enabling Unauthenticated Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/sap-patches-cvss-100-kernel-flaw.html","time":"06:25","priority":"MUST READ","score":95,"tldr":"SAP released urgent patches for several critical flaws, including a CVSS 10.0 SAP Kernel Extended Passport bug that allows unauthenticated remote code execution with SAP admin privileges. Organizations should prioritize patching exposed SAP systems because standard SAP access controls cannot mitigate the pre-authentication attack path.","briefOverview":"\u003cp\u003eSAP released security updates for multiple vulnerabilities, including CVE-2026-44756, a maximum-severity flaw in SAP Extended Passport Processing with a CVSS score of 10.0. The flaw, codenamed OVERPASS by Onapsis, is a memory corruption issue in the SAP kernel’s processing of Extended Passport data. It is remotely exploitable without authentication and can allow attackers to run arbitrary operating system commands on the SAP host with SAP administrative privileges.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-44756 stems from missing boundary validation during deserialization of EPP data, causing a memory safety violation when externally supplied length fields are processed. Onapsis said the vulnerable EPP processing is shared kernel code reachable through the internet-facing web layer, the SAP GUI layer, and the RFC layer, none of which require credentials. Successful exploitation could expose database credentials, password hashes, live session data, stored credentials for lateral movement, application data, system configuration, and SAP binaries.\u003c/p\u003e\n\n\u003cp\u003eSAP also patched CVE-2026-58240, a CVSS 9.8 missing authentication check in SAP NetWeaver Message Server that Onapsis named S4GET. Other critical flaws include CVE-2026-76969 in multi-tenant applications using SAP Cloud Application Programming Model and CVE-2026-66768 in SAP NetWeaver SAP GUI for Java. Although the article says none of the vulnerabilities have been exploited to date, Onapsis recommends inventorying every SAP system, prioritizing internet-facing systems for patching, reducing exposure where possible, and monitoring for exploitation attempts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP released security updates for multiple vulnerabilities, including CVE-2026-44756, a CVSS 10.0 memory corruption flaw in SAP Extended Passport Processing.","CVE-2026-44756, codenamed OVERPASS by Onapsis, is remotely exploitable without authentication and can allow attackers to run arbitrary operating system commands on the SAP host with SAP administrative privileges.","Onapsis said OVERPASS is reachable through several SAP components and communication protocols, including the internet-facing web layer, SAP GUI layer, and RFC layer.","SAP also patched CVE-2026-58240, a CVSS 9.8 missing authentication check in SAP NetWeaver Message Server that Onapsis named S4GET.","Onapsis recommended that users inventory every SAP system, patch internet-facing systems before internal instances, reduce exposure where possible, and monitor for exploitation attempts."],"insights":["SAP authorizations, Segregation of Duties controls, locked users, tighter roles, password policies, and restricted transaction access do not reduce the OVERPASS risk because the vulnerable code runs before authentication.","Onapsis said no single network control can fully mitigate OVERPASS because the shared EPP processing code is reachable through multiple SAP components and protocols.","S4GET cannot be firewalled away without breaking end-user logon because it is triggered through the same public port used by every SAP GUI client.","Successful exploitation of OVERPASS could expose the SAP secure store, database credentials, password hashes, live user session data, stored credentials for lateral movement, application data, system configuration, and SAP binaries.","Onapsis specifically recommends patching internet-facing SAP systems before internal instances while monitoring for exploitation attempts during the rollout."],"referencedReports":[{"title":"September 2026 Security Patch Day","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/september-2026.html?isu_page=1","publisher":"SAP","context":"The article cites SAP's released security updates addressing multiple vulnerabilities, including the CVSS 10.0 SAP Extended Passport Processing flaw.","category":"advisory","primary":true},{"title":"SAP Security Patch Day September 2026","url":"https://onapsis.com/blog/sap-security-patch-day-september-2026/","publisher":"Onapsis","context":"The article cites Onapsis as the company that discovered and reported CVE-2026-44756.","category":"advisory","primary":true},{"title":"SAP OVERPASS Remediation","url":"https://onapsis.com/blog/sap-overpass-remediation/","publisher":"Onapsis","context":"The article references Onapsis' named analysis and remediation material for the CVE-2026-44756 flaw codenamed OVERPASS.","category":"advisory","primary":true},{"title":"S4GET CVE-2026-58240 SAP Message Server Threat Advisory","url":"https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/","publisher":"Onapsis","context":"The article cites Onapsis' threat advisory describing the S4GET flaw in SAP NetWeaver Message Server.","category":"advisory","primary":true}],"body":"\u003cp\u003eSAP released security updates for multiple vulnerabilities, including CVE-2026-44756, a maximum-severity flaw in SAP Extended Passport Processing with a CVSS score of 10.0. The flaw, codenamed OVERPASS by Onapsis, is a memory corruption issue in the SAP kernel’s processing of Extended Passport data. It is remotely exploitable without authentication and can allow attackers to run arbitrary operating system commands on the SAP host with SAP administrative privileges.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-44756 stems from missing boundary validation during deserialization of EPP data, causing a memory safety violation when externally supplied length fields are processed. Onapsis said the vulnerable EPP processing is shared kernel code reachable through the internet-facing web layer, the SAP GUI layer, and the RFC layer, none of which require credentials. Successful exploitation could expose database credentials, password hashes, live session data, stored credentials for lateral movement, application data, system configuration, and SAP binaries.\u003c/p\u003e\n\n\u003cp\u003eSAP also patched CVE-2026-58240, a CVSS 9.8 missing authentication check in SAP NetWeaver Message Server that Onapsis named S4GET. Other critical flaws include CVE-2026-76969 in multi-tenant applications using SAP Cloud Application Programming Model and CVE-2026-66768 in SAP NetWeaver SAP GUI for Java. Although the article says none of the vulnerabilities have been exploited to date, Onapsis recommends inventorying every SAP system, prioritizing internet-facing systems for patching, reducing exposure where possible, and monitoring for exploitation attempts.\u003c/p\u003e\n"},{"n":27,"title":"Chrome V8 Zero-Day Exploited in the Wild Enables Code Execution Inside Sandbox","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/chrome-v8-zero-day-exploited-in-wild.html","time":"09:11","priority":"MUST READ","score":95,"tldr":"Google patched an actively exploited Chrome V8 zero-day, CVE-2026-87491, that could let a remote attacker run code inside Chrome’s sandbox via a crafted HTML page. Users should update Chrome to the latest fixed versions immediately, and Chromium-based browsers should apply fixes when available.","briefOverview":"\u003cp\u003eGoogle released Chrome updates to patch 230 security vulnerabilities, including CVE-2026-87491, which has been actively exploited in the wild. The flaw is a medium-severity out-of-bounds write bug in V8, Chrome’s JavaScript and WebAssembly engine. According to the NIST National Vulnerability Database description cited in the article, it allowed a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page.\u003c/p\u003e\n\n\u003cp\u003eSecurity researcher Jihyeon Jeong of Compsec Lab, Seoul National University, discovered and reported the flaw on August 6, 2026, and received a $2,500 bug bounty reward. Google said it is aware that an exploit for CVE-2026-87491 exists in the wild, but it has not shared details on how the flaw is being used or who is behind the activity. Google also said access to bug details and links may remain restricted until most users have updated with a fix.\u003c/p\u003e\n\n\u003cp\u003eThe update also fixes five critical security flaws in WebGL and Cast components, including use-after-free, out-of-bounds write, and buffer overflow issues. Google said 195 of the 230 fixed flaws were reported by Google, and noted that many security bugs are detected using tools such as AddressSanitizer, MemorySanitizer, UndefinedBehaviorSanitizer, Control Flow Integrity, libFuzzer, or AFL. Users are advised to update Chrome to versions 153.0.8010.36/.37 for Windows and macOS and 153.0.8010.36 for Linux, while users of Chromium-based browsers such as Microsoft Edge, Brave, Opera, and Vivaldi should apply fixes when available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google released Chrome updates to patch 230 security vulnerabilities, including CVE-2026-87491, which has been exploited in the wild.","CVE-2026-87491 is a medium-severity out-of-bounds write bug in Chrome’s V8 JavaScript and WebAssembly engine that can allow a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page.","Security researcher Jihyeon Jeong of Compsec Lab at Seoul National University reported CVE-2026-87491 to Google on August 6, 2026, and received a $2,500 bug bounty reward.","The update also fixes five critical flaws in WebGL and Cast components, including use-after-free, out-of-bounds write, and buffer overflow issues.","Users are advised to update Chrome to versions 153.0.8010.36/.37 for Windows and macOS and 153.0.8010.36 for Linux, while users of other Chromium-based browsers should apply fixes when available."],"insights":["Google rated CVE-2026-87491 as medium severity even though it acknowledged an exploit exists in the wild and the flaw can enable arbitrary code execution inside Chrome’s sandbox.","Google is withholding bug details and links until most users have updated, which means public technical information about the actively exploited flaw may remain limited for now.","This is the seventh actively exploited Chrome zero-day Google has patched in 2026, indicating repeated real-world targeting of Chrome vulnerabilities this year.","The update is unusually broad, fixing 230 vulnerabilities in total, with Google reporting 195 of them itself.","The affected ecosystem extends beyond Chrome because users of Microsoft Edge, Brave, Opera, and Vivaldi are also advised to apply fixes when they become available."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_0808145027.html","publisher":"Google Chrome Releases","context":"The article cites Google's Chrome release notice as the source for the security update that patches 230 vulnerabilities, including the actively exploited CVE-2026-87491.","category":"advisory","primary":true},{"title":"CVE-2026-87491 Detail","url":"https://nvd.nist.gov/vuln/detail/cve-2026-87491","publisher":"NIST National Vulnerability Database","context":"The article references the NVD entry for its description of CVE-2026-87491 as an out-of-bounds write in V8 that allowed arbitrary code execution inside the sandbox via a crafted HTML page.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle released Chrome updates to patch 230 security vulnerabilities, including CVE-2026-87491, which has been actively exploited in the wild. The flaw is a medium-severity out-of-bounds write bug in V8, Chrome’s JavaScript and WebAssembly engine. According to the NIST National Vulnerability Database description cited in the article, it allowed a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page.\u003c/p\u003e\n\n\u003cp\u003eSecurity researcher Jihyeon Jeong of Compsec Lab, Seoul National University, discovered and reported the flaw on August 6, 2026, and received a $2,500 bug bounty reward. Google said it is aware that an exploit for CVE-2026-87491 exists in the wild, but it has not shared details on how the flaw is being used or who is behind the activity. Google also said access to bug details and links may remain restricted until most users have updated with a fix.\u003c/p\u003e\n\n\u003cp\u003eThe update also fixes five critical security flaws in WebGL and Cast components, including use-after-free, out-of-bounds write, and buffer overflow issues. Google said 195 of the 230 fixed flaws were reported by Google, and noted that many security bugs are detected using tools such as AddressSanitizer, MemorySanitizer, UndefinedBehaviorSanitizer, Control Flow Integrity, libFuzzer, or AFL. Users are advised to update Chrome to versions 153.0.8010.36/.37 for Windows and macOS and 153.0.8010.36 for Linux, while users of Chromium-based browsers such as Microsoft Edge, Brave, Opera, and Vivaldi should apply fixes when available.\u003c/p\u003e\n"},{"n":32,"title":"Microsoft Patches Record 974 Flaws, Including Two Exploited Windows Zero-Days","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/microsoft-patches-record-974-flaws.html","time":"04:41","priority":"MUST READ","score":95,"tldr":"Microsoft’s September Patch Tuesday fixed a record 974 vulnerabilities, including two Windows zero-days already exploited in the wild that allow local attackers to gain SYSTEM privileges. Organizations should prioritize patching CVE-2026-85880 and CVE-2026-81963, both now listed in CISA’s Known Exploited Vulnerabilities catalog.","briefOverview":"\u003cp\u003eMicrosoft addressed a record 974 vulnerabilities in its September 2026 Patch Tuesday updates, spanning Windows, Office and Office 2016, SQL, Developer Tools, and other parts of its software portfolio. The release included 723 flaws in Windows, 111 in Office and Office 2016, 62 in SQL, and 22 in Developer Tools, with more than 110 rated critical. Along with fixes for 25 non-Microsoft CVEs, the total number of vulnerabilities resolved reached 999.\u003c/p\u003e\n\n\u003cp\u003eTwo Windows vulnerabilities were actively exploited in the wild: CVE-2026-85880 in Windows Advanced Local Procedure Call and CVE-2026-81963 in the Windows Update Stack. Both have CVSS scores of 7.8 and can allow an authorized local attacker to elevate privileges and gain SYSTEM privileges. Microsoft said CVE-2026-85880 could let an attacker running code in a low-privilege AppContainer escape the sandbox without additional user interaction.\u003c/p\u003e\n\n\u003cp\u003eCISA added both exploited flaws to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by September 22, 2026. The article also highlights other notable flaws affecting Microsoft Exchange Server, Microsoft Authenticator, SharePoint, SQL Server, Windows Remote Desktop Services, Windows DNS server, Windows Shell, and Windows DHCP Server. Security experts quoted in the article emphasized that the huge patch volume makes prioritization critical, especially based on which vulnerabilities apply to an organization and whether they are reachable and exploitable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft addressed a record 974 vulnerabilities in its September 2026 Patch Tuesday updates, including 723 in Windows, 111 in Office and Office 2016, 62 in SQL, and 22 in Developer Tools.","Two Windows zero-days, CVE-2026-85880 in Windows Advanced Local Procedure Call and CVE-2026-81963 in the Windows Update Stack, were actively exploited in the wild and allow local privilege escalation to SYSTEM privileges.","CISA added CVE-2026-85880 and CVE-2026-81963 to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by September 22, 2026.","Microsoft also patched notable critical flaws affecting products including Exchange Server, Microsoft Authenticator, SharePoint, SQL Server, Remote Desktop Services, Windows Services for NFS, Windows DNS Server, Windows Shell, and Windows DHCP Server.","Security experts quoted in the article said the unusually large patch volume makes prioritization essential, with organizations needing to focus first on vulnerabilities that apply to them and are reachable and exploitable."],"insights":["The two actively exploited Windows zero-days should take priority over the broader patch volume because both allow local attackers to gain SYSTEM privileges and are now in CISA’s Known Exploited Vulnerabilities catalog.","The Windows Update Stack zero-day is especially notable because Tenable said it is the first Windows Update Stack privilege escalation flaw since 2022 to be exploited in the wild.","The record patch count does not necessarily mean every organization faces equal risk, because Tenable noted that the vulnerabilities expected to affect most organizations remains relatively low and prioritization should depend on whether affected systems are reachable and exploitable.","Microsoft’s 2026 patch volume has already surpassed previous annual records, with ZDI saying Microsoft has patched 2,760 flaws this year and Tenable saying the total is already more than double the 2020 record with three months remaining."],"referencedReports":[{"title":"September 2026 Security Updates","url":"https://msrc.microsoft.com/update-guide/releaseNote/2026-Sep","publisher":"Microsoft Security Response Center","context":"The article uses Microsoft’s September 2026 release notes as the source for the record 974 vulnerabilities patched across its software portfolio.","category":"advisory","primary":true},{"title":"CVE-2026-85880","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-85880","publisher":"Microsoft Security Response Center","context":"The article cites Microsoft’s advisory for details on the exploited Windows ALPC flaw that can let a low-privilege AppContainer escape the sandbox and gain elevated privileges.","category":"advisory","primary":true},{"title":"CVE-2026-81963","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-81963","publisher":"Microsoft Security Response Center","context":"The article links Microsoft’s advisory for the exploited Windows Update Stack flaw that can allow local privilege escalation to SYSTEM privileges.","category":"advisory","primary":true},{"title":"Patch Tuesday Analysis: September 2026","url":"https://www.crowdstrike.com/en-us/blog/patch-tuesday-analysis-september-2026/","publisher":"CrowdStrike","context":"The article cites CrowdStrike’s analysis for the finding that privilege escalation, remote code execution, and information disclosure account for nearly 90% of the flaws patched this month.","category":"research","primary":false},{"title":"Patch Tuesday September 2026","url":"https://www.action1.com/patch-tuesday/patch-tuesday-september-2026/","publisher":"Action1","context":"The article quotes Action1’s Patch Tuesday analysis on the challenge of prioritizing urgent fixes when hundreds of updates arrive at once.","category":"research","primary":false},{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/08/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references CISA’s alert adding the two exploited Microsoft flaws to the Known Exploited Vulnerabilities catalog and setting a September 22, 2026 remediation deadline for federal civilian agencies.","category":"advisory","primary":false},{"title":"The September 2026 Security Update Review","url":"https://www.zerodayinitiative.com/blog/2026/9/8/the-september-2026-security-update-review","publisher":"Zero Day Initiative","context":"The article cites ZDI’s September 2026 security update review for Microsoft’s year-to-date total of 2,760 patched security flaws.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft addressed a record 974 vulnerabilities in its September 2026 Patch Tuesday updates, spanning Windows, Office and Office 2016, SQL, Developer Tools, and other parts of its software portfolio. The release included 723 flaws in Windows, 111 in Office and Office 2016, 62 in SQL, and 22 in Developer Tools, with more than 110 rated critical. Along with fixes for 25 non-Microsoft CVEs, the total number of vulnerabilities resolved reached 999.\u003c/p\u003e\n\n\u003cp\u003eTwo Windows vulnerabilities were actively exploited in the wild: CVE-2026-85880 in Windows Advanced Local Procedure Call and CVE-2026-81963 in the Windows Update Stack. Both have CVSS scores of 7.8 and can allow an authorized local attacker to elevate privileges and gain SYSTEM privileges. Microsoft said CVE-2026-85880 could let an attacker running code in a low-privilege AppContainer escape the sandbox without additional user interaction.\u003c/p\u003e\n\n\u003cp\u003eCISA added both exploited flaws to its Known Exploited Vulnerabilities catalog and required Federal Civilian Executive Branch agencies to apply fixes by September 22, 2026. The article also highlights other notable flaws affecting Microsoft Exchange Server, Microsoft Authenticator, SharePoint, SQL Server, Windows Remote Desktop Services, Windows DNS server, Windows Shell, and Windows DHCP Server. Security experts quoted in the article emphasized that the huge patch volume makes prioritization critical, especially based on which vulnerabilities apply to an organization and whether they are reachable and exploitable.\u003c/p\u003e\n"},{"n":14,"title":"Multiple Chinese hacking groups seen using identical Chrome zero-day exploit","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/china-hackers-chrome-browser-zero-day-multiple-groups","time":"16:30","priority":"MUST READ","score":94,"tldr":"Proofpoint says at least four mostly China-linked espionage groups used the same Chrome zero-day exploit kit, BlueMoon, against U.S. defense contractors, NGOs and Southeast Asian government targets. The case highlights how shared offensive tooling and patch-gap exploitation are letting multiple actors weaponize browser fixes before users receive updates.","briefOverview":"\u003cp\u003eProofpoint said at least four cyber-espionage groups, most linked to Chinese state intelligence, used the same previously unknown Google Chrome vulnerability in attacks beginning in late August and continuing into this week. The groups used an exploit kit called BlueMoon to compromise Chrome browsers and deploy malware against U.S. defense contractors, NGOs and Southeast Asian government agencies. Proofpoint said two additional groups are also believed to have used the kit.\u003c/p\u003e\n\n\u003cp\u003eThe case is significant because Proofpoint said the groups were conducting separate operations with different targets, malware and command-and-control infrastructure, yet shared the same exploit kit. A Proofpoint researcher said the code was practically identical, including variable names and comments, and that it could not be parallel development. The episode fits a recurring pattern in which otherwise separate China-linked hackers gain access to the same offensive tooling at about the same time.\u003c/p\u003e\n\n\u003cp\u003eBlueMoon exploited a vulnerability that had been fixed in Chromium in early August, but the fix took four weeks to reach stable Chrome users, creating a patch gap. The exploit kit combined two browser flaws with a Windows vulnerability and then handed off to malware chosen by each group, including ShadowPad in one campaign. Proofpoint also found signs that AI may have helped develop BlueMoon, including debugging comments resembling exchanges with an AI tool and references to a document used to carry context between AI sessions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Proofpoint said at least four cyber-espionage groups, most linked to Chinese state intelligence, used the same previously unknown Google Chrome vulnerability in attacks beginning in late August and continuing into this week.","The shared exploit kit, called BlueMoon by Proofpoint, was used to compromise Chrome browsers and deploy malware against U.S. defense contractors, NGOs and Southeast Asian government agencies.","Proofpoint said the groups were conducting separate operations with different targets, malware and command-and-control infrastructure, but the exploit kit code was effectively identical across them.","BlueMoon exploited a vulnerability that had been fixed in Chromium in early August, but the fix took four weeks to reach users of the stable Chrome browser, creating a patch gap attackers could use.","Proofpoint found signs that AI may have helped develop BlueMoon, including debugging comments resembling exchanges with an AI tool and references to a document used to carry context between AI sessions."],"insights":["The identical code, variable names and comments in BlueMoon led Proofpoint to conclude that the exploit kit was shared rather than independently developed by multiple groups.","The four-week delay between a Chromium fix and its arrival in stable Chrome is no longer reliably safe, according to Proofpoint, because attackers were able to reverse-engineer and weaponize the fix within that window.","Despite using a valuable Chrome exploit chain, BlueMoon’s final malware download step was described as crude and detectable, suggesting the operators prioritized speed over stealth before Chrome users received the patch.","The use of the same exploit kit by separate groups with different targets, malware and infrastructure reinforces a recurring pattern in which China-linked hacking groups gain access to the same offensive tools around the same time.","Proofpoint found signs that BlueMoon’s developers may have framed exploit development as legitimate security research to an AI system by referencing Google’s V8 bug-bounty challenge."],"referencedReports":[{"title":"Once in a BlueMoon: Multiple State-Aligned Threat Actors Rapidly Adopt Novel Exploit","url":"https://www.proofpoint.com/us/blog/threat-insight/once-bluemoon-multiple-state-aligned-threat-actors-rapidly-adopt-novel-exploit","publisher":"Proofpoint","context":"The article is based on Proofpoint research describing multiple state-aligned threat actors using the BlueMoon Chrome exploit kit.","category":"research","primary":true},{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_01882797386.html","publisher":"Google","context":"The article links to Google’s Chrome release information while discussing the fix reaching stable Chrome users after a patch gap.","category":"advisory","primary":false}],"body":"\u003cp\u003eProofpoint said at least four cyber-espionage groups, most linked to Chinese state intelligence, used the same previously unknown Google Chrome vulnerability in attacks beginning in late August and continuing into this week. The groups used an exploit kit called BlueMoon to compromise Chrome browsers and deploy malware against U.S. defense contractors, NGOs and Southeast Asian government agencies. Proofpoint said two additional groups are also believed to have used the kit.\u003c/p\u003e\n\n\u003cp\u003eThe case is significant because Proofpoint said the groups were conducting separate operations with different targets, malware and command-and-control infrastructure, yet shared the same exploit kit. A Proofpoint researcher said the code was practically identical, including variable names and comments, and that it could not be parallel development. The episode fits a recurring pattern in which otherwise separate China-linked hackers gain access to the same offensive tooling at about the same time.\u003c/p\u003e\n\n\u003cp\u003eBlueMoon exploited a vulnerability that had been fixed in Chromium in early August, but the fix took four weeks to reach stable Chrome users, creating a patch gap. The exploit kit combined two browser flaws with a Windows vulnerability and then handed off to malware chosen by each group, including ShadowPad in one campaign. Proofpoint also found signs that AI may have helped develop BlueMoon, including debugging comments resembling exchanges with an AI tool and references to a document used to carry context between AI sessions.\u003c/p\u003e\n"},{"n":30,"title":"F5 BIG-IP APM Malware Injects a PHP Web Shell Into Memory, Evading Disk Scans","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/f5-big-ip-apm-malware-injects-php-web.html","time":"07:36","priority":"MUST READ","score":94,"tldr":"Sophos found that malware tied to exploited F5 BIG-IP APM systems can inject a PHP web shell into Apache/PHP memory without changing the on-disk scripts, allowing it to evade normal file scans. Defenders should investigate even patched appliances, checking memory, modified binaries, logs, and F5 integrity signals for compromise.","briefOverview":"\u003cp\u003eSophos said malware linked to break-ins at F5 BIG-IP Access Policy Manager appliances hides a PHP web shell in memory instead of storing it as a file on disk. When Apache loads one of three BIG-IP APM PHP scripts, the malware adds the web shell to the in-memory copy, so checks of the file on disk can appear clean. The three scripts are apm_css.php3, full_wt.php3, and webtop_popup_css.php3, which F5 had previously listed in indicators of compromise for malware it tracks as c05d5254.\u003c/p\u003e\n\n\u003cp\u003eF5 has linked the c05d5254 activity to appliances affected by CVE-2025-53521, which it reclassified on March 27, 2026 as an exploited unauthenticated remote code execution flaw. The flaw applies where a BIG-IP APM access policy is set on a virtual server, and F5 lists fixed releases for affected versions. The article says patching does not settle whether an appliance was compromised before the patch, and UK NCSC advises investigating for compromise regardless of when the system was updated.\u003c/p\u003e\n\n\u003cp\u003eSophos said a separate installer sample named umount infects /usr/sbin/httpd by adding malicious code to the front of the real Apache web server file. The malware hooks Apache and PHP-related behavior so that, when one of the three scripts is mapped into memory, it places the web shell in front of the original content. Suggested investigation leads include sys-eicheck failures, mismatches in /usr/bin/umount or /usr/sbin/httpd, suspicious logs, HTTP 201 responses with a CSS content type, and differences between modules in memory and copies on disk.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sophos said malware linked to break-ins at F5 BIG-IP Access Policy Manager appliances hides a PHP web shell in memory instead of storing it as a file on disk.","The malware injects the web shell into Apache’s in-memory copy of apm_css.php3, full_wt.php3, or webtop_popup_css.php3, so disk checks of those scripts can appear clean.","F5 linked the c05d5254 activity to CVE-2025-53521, a BIG-IP APM flaw it reclassified on March 27, 2026 as unauthenticated remote code execution that had been exploited.","Sophos said an installer sample named umount infects /usr/sbin/httpd by adding malicious code to the front of the real Apache web server file.","Defenders are advised to investigate patched systems for prior compromise using signals such as sys-eicheck failures, modified /usr/bin/umount or /usr/sbin/httpd files, suspicious logs, HTTP 201 CSS responses, and memory-versus-disk differences."],"insights":["A clean file comparison of the three named PHP scripts is not enough to rule out compromise, because the article says the web shell can be added only after Apache loads the scripts into memory.","Patching CVE-2025-53521 does not answer whether an appliance was already compromised, and the article notes that UK NCSC advises investigation regardless of when the system was updated.","The earlier infection stages can still leave disk-based evidence even though the final web shell is memory-only, including changes to /usr/sbin/httpd, /usr/bin/umount, and BIG-IP install images described by Sophos and ESET.","HTTP 201 responses with a CSS content type from the appliance are a notable investigation lead because the web shell is designed to make its command traffic look like a stylesheet request.","The article highlights that no public source has said whether upgrading to a fixed release removes already installed malware, while Sophos and ESET describe a component designed to survive upgrade images."],"referencedReports":[{"title":"Dissecting a PHP Web Server Rootkit","url":"https://www.sophos.com/en-us/blog/dissecting-a-php-web-server-rootkit","publisher":"Sophos","context":"The article says Sophos published an analysis explaining how the malware injects a PHP web shell into memory instead of leaving it on disk.","category":"research","primary":true},{"title":"Indicators of Compromise for c05d5254","url":"https://my.f5.com/manage/s/article/K000160486","publisher":"F5","context":"The article cites F5's published indicators of compromise for the c05d5254 malware, including the three BIG-IP APM PHP scripts.","category":"advisory","primary":false},{"title":"K000156741: CVE-2025-53521 BIG-IP APM advisory","url":"https://my.f5.com/manage/s/article/K000156741","publisher":"F5","context":"The article references F5's advisory as the source for affected and fixed BIG-IP APM releases for CVE-2025-53521.","category":"advisory","primary":false},{"title":"CVE-2025-53521 advisory","url":"https://ncsc.gov.ie/pdfs/2603311419_CVE-2025-53521.pdf","publisher":"Ireland National Cyber Security Center","context":"The article cites Ireland's NCSC March 31 advisory saying the October patch remains valid and noting uncertainty about the exploitation timeline.","category":"advisory","primary":false}],"body":"\u003cp\u003eSophos said malware linked to break-ins at F5 BIG-IP Access Policy Manager appliances hides a PHP web shell in memory instead of storing it as a file on disk. When Apache loads one of three BIG-IP APM PHP scripts, the malware adds the web shell to the in-memory copy, so checks of the file on disk can appear clean. The three scripts are apm_css.php3, full_wt.php3, and webtop_popup_css.php3, which F5 had previously listed in indicators of compromise for malware it tracks as c05d5254.\u003c/p\u003e\n\n\u003cp\u003eF5 has linked the c05d5254 activity to appliances affected by CVE-2025-53521, which it reclassified on March 27, 2026 as an exploited unauthenticated remote code execution flaw. The flaw applies where a BIG-IP APM access policy is set on a virtual server, and F5 lists fixed releases for affected versions. The article says patching does not settle whether an appliance was compromised before the patch, and UK NCSC advises investigating for compromise regardless of when the system was updated.\u003c/p\u003e\n\n\u003cp\u003eSophos said a separate installer sample named umount infects /usr/sbin/httpd by adding malicious code to the front of the real Apache web server file. The malware hooks Apache and PHP-related behavior so that, when one of the three scripts is mapped into memory, it places the web shell in front of the original content. Suggested investigation leads include sys-eicheck failures, mismatches in /usr/bin/umount or /usr/sbin/httpd, suspicious logs, HTTP 201 responses with a CSS content type, and differences between modules in memory and copies on disk.\u003c/p\u003e\n"},{"n":9,"title":"New Microsoft Defender 'ShieldCrash' zero-day grants SYSTEM access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-microsoft-defender-shieldcrash-zero-day-grants-system-access/","time":"07:30","priority":"MUST READ","score":92,"tldr":"A researcher released a new Microsoft Defender zero-day called ShieldCrash that can grant SYSTEM-level arbitrary file read on fully patched Windows systems, claiming Microsoft’s September patch failed to fully fix the earlier ShieldBreak flaw. Microsoft had not yet commented or released an official fix.","briefOverview":"\u003cp\u003eAn anonymous security researcher known as Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldCrash shortly after Microsoft issued its September 2026 Patch Tuesday security updates. ShieldCrash is described as a bypass for the ShieldBreak Defender privilege escalation flaw, which Microsoft patched as CVE-2026-69414. ShieldBreak itself was described as a bypass for RoguePlanet, another Defender flaw disclosed in June and patched by Microsoft in July.\u003c/p\u003e\n\n\u003cp\u003eAccording to Nightmare Eclipse, the ShieldCrash proof-of-concept exploit can let attackers gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems, but it will not give them write access. The researcher said Microsoft failed to properly patch ShieldBreak under specific conditions and that the same problem can still be triggered. They described the current proof of concept as demonstrating arbitrary file read as SYSTEM on all supported Windows versions with the September 2026 updates installed.\u003c/p\u003e\n\n\u003cp\u003eThe article says Nightmare Eclipse has released these zero-day exploits as part of an ongoing dispute with Microsoft over bug bounty and vulnerability disclosure practices. Since April, the researcher has disclosed multiple zero-days affecting Microsoft Defender, BitLocker, and other Windows components, including ShieldBreak, LegacyHive, RoguePlanet, BlueHammer, RedSun, YellowKey, GreenPlasma, MiniPlasma, and UnDefend. Microsoft has fixed several of those flaws, but the article states that others still lack an official patch, and Microsoft was not immediately available to comment on ShieldCrash.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An anonymous security researcher known as Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldCrash after Microsoft issued its September 2026 Patch Tuesday security updates.","Nightmare Eclipse described ShieldCrash as a bypass for the ShieldBreak Defender privilege escalation flaw that Microsoft patched as CVE-2026-69414.","The ShieldCrash proof-of-concept exploit is said to allow attackers to gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems, but not write access.","Nightmare Eclipse said the proof of concept demonstrates arbitrary file read as SYSTEM on all supported Windows versions with the September 2026 updates installed.","Microsoft was not immediately available to comment when BleepingComputer asked about the ShieldCrash zero-day."],"insights":["ShieldCrash is presented as part of a chain of incomplete or bypassed fixes, since ShieldBreak bypassed RoguePlanet and ShieldCrash is described as a bypass for Microsoft’s ShieldBreak patch.","The released proof of concept currently demonstrates SYSTEM-level arbitrary file read rather than full write access, which narrows what the public exploit can do while still exposing sensitive data risks.","Nightmare Eclipse is releasing these zero-days amid an ongoing dispute with Microsoft over bug bounty and vulnerability disclosure practices, showing that the disclosure context is central to the repeated public releases.","Microsoft has patched several of Nightmare Eclipse’s previously disclosed flaws, but the article states that other disclosed vulnerabilities still lack official patches."],"referencedReports":[{"title":"CVE-2026-69414","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-69414","publisher":"Microsoft Security Response Center","context":"The article links Microsoft’s advisory when stating that the ShieldBreak Defender privilege escalation flaw was patched on Thursday.","category":"advisory","primary":false}],"body":"\u003cp\u003eAn anonymous security researcher known as Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldCrash shortly after Microsoft issued its September 2026 Patch Tuesday security updates. ShieldCrash is described as a bypass for the ShieldBreak Defender privilege escalation flaw, which Microsoft patched as CVE-2026-69414. ShieldBreak itself was described as a bypass for RoguePlanet, another Defender flaw disclosed in June and patched by Microsoft in July.\u003c/p\u003e\n\n\u003cp\u003eAccording to Nightmare Eclipse, the ShieldCrash proof-of-concept exploit can let attackers gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems, but it will not give them write access. The researcher said Microsoft failed to properly patch ShieldBreak under specific conditions and that the same problem can still be triggered. They described the current proof of concept as demonstrating arbitrary file read as SYSTEM on all supported Windows versions with the September 2026 updates installed.\u003c/p\u003e\n\n\u003cp\u003eThe article says Nightmare Eclipse has released these zero-day exploits as part of an ongoing dispute with Microsoft over bug bounty and vulnerability disclosure practices. Since April, the researcher has disclosed multiple zero-days affecting Microsoft Defender, BitLocker, and other Windows components, including ShieldBreak, LegacyHive, RoguePlanet, BlueHammer, RedSun, YellowKey, GreenPlasma, MiniPlasma, and UnDefend. Microsoft has fixed several of those flaws, but the article states that others still lack an official patch, and Microsoft was not immediately available to comment on ShieldCrash.\u003c/p\u003e\n"},{"n":11,"title":"AdaptHealth confirms 4.1 million people exposed in July cyberattack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/adapthealth-confirms-41-million-people-exposed-in-july-cyberattack/","time":"21:30","priority":"MUST READ","score":92,"tldr":"AdaptHealth confirmed that a June cyberattack exposed personal and health-related data of 4,115,802 people after attackers used social engineering to compromise a third-party contractor’s privileged account. The company says affected individuals are being offered 12 months of free credit monitoring and has found no evidence of data misuse so far.","briefOverview":"\u003cp\u003eHealthcare company AdaptHealth confirmed that data belonging to 4,115,802 individuals was exposed in a cyberattack discovered in July. The company provides home medical devices, supplies, and related services, including sleep-apnea and respiratory equipment, oxygen therapy, hospital beds, and mobility products. AdaptHealth first disclosed the incident in a July 2, 2026 SEC filing, saying attackers accessed its systems and exfiltrated private data.\u003c/p\u003e\n\n\u003cp\u003eAdaptHealth said the compromise occurred on June 5 and involved cloud-based business applications, including certain internal patient management systems, document storage platforms, and electronic health record system portals. On June 15, an unnamed threat actor contacted the company to demand a ransom payment in exchange for not leaking the stolen data. The company said the breach happened through a successful social engineering ploy that compromised the privileged account of a third-party contractor.\u003c/p\u003e\n\n\u003cp\u003eThe data that may have been exposed includes full names, contact information, demographic information, health insurance information, and health information. Impacted individuals should have received data breach notifications with instructions for enrolling in 12 months of free credit monitoring and identity protection services. AdaptHealth said it had found no evidence of identity theft, fraud, or other misuse of the stolen data, while prior reporting attributed the attack to ShinyHunters based on the company being added to the group’s victim list.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AdaptHealth confirmed that data belonging to 4,115,802 individuals was exposed in a cyberattack discovered in July and attributed by prior reporting to the ShinyHunters threat group.","The company said attackers accessed cloud-based business applications, including internal patient management systems, document storage platforms, and electronic health record system portals.","AdaptHealth stated that the breach occurred through a successful social engineering ploy that compromised the privileged account of a third-party contractor.","The potentially exposed data includes full names, contact information, demographic information, health insurance information, and health information.","Impacted individuals should have received breach notifications with instructions for enrolling in 12 months of free credit monitoring and identity protection services."],"insights":["The compromise of a third-party contractor’s privileged account shows that access held by external partners can expose sensitive patient systems, including patient management, document storage, and electronic health record portals.","The incident
