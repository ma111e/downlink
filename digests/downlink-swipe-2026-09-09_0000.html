became known to AdaptHealth as an extortion attempt before the company publicly confirmed the full impact, with an unnamed actor demanding payment on June 15 and the affected population later reported to HHS as 4,115,802 people.","Although ShinyHunters was previously reported as responsible, BleepingComputer could not find AdaptHealth on the group’s extortion portal, suggesting the public leak-site record did not clearly match the prior attribution at the time of reporting.","AdaptHealth’s disclosure follows several other recent health and health-tech breach announcements, indicating that the company’s incident is part of a broader cluster of large healthcare-related data exposure reports described in the article."],"referencedReports":[],"body":"\u003cp\u003eHealthcare company AdaptHealth confirmed that data belonging to 4,115,802 individuals was exposed in a cyberattack discovered in July. The company provides home medical devices, supplies, and related services, including sleep-apnea and respiratory equipment, oxygen therapy, hospital beds, and mobility products. AdaptHealth first disclosed the incident in a July 2, 2026 SEC filing, saying attackers accessed its systems and exfiltrated private data.\u003c/p\u003e\n\n\u003cp\u003eAdaptHealth said the compromise occurred on June 5 and involved cloud-based business applications, including certain internal patient management systems, document storage platforms, and electronic health record system portals. On June 15, an unnamed threat actor contacted the company to demand a ransom payment in exchange for not leaking the stolen data. The company said the breach happened through a successful social engineering ploy that compromised the privileged account of a third-party contractor.\u003c/p\u003e\n\n\u003cp\u003eThe data that may have been exposed includes full names, contact information, demographic information, health insurance information, and health information. Impacted individuals should have received data breach notifications with instructions for enrolling in 12 months of free credit monitoring and identity protection services. AdaptHealth said it had found no evidence of identity theft, fraud, or other misuse of the stolen data, while prior reporting attributed the attack to ShinyHunters based on the company being added to the group’s victim list.\u003c/p\u003e\n"},{"n":15,"title":"Electronic health record company says customer data stolen in breach","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/electronic-health-record-company-says-customer-data-stolen-in-breach","time":"17:03","priority":"MUST READ","score":92,"tldr":"Veradigm said hackers used credentials stolen from a vendor to access a Veradigm API and download patient personal data, including some Social Security numbers, though it says no clinical or medical data was involved. The Gentlemen ransomware gang claims it stole records for 3.5 million patients, amid a wave of healthcare-sector cyberattacks.","briefOverview":"\u003cp\u003eElectronic health records company Veradigm told regulators that hackers infiltrated a vendor’s systems and stole customer information, including Social Security numbers in some instances. The company said an unauthorized party obtained credentials from the vendor’s environment for a Veradigm application programming interface used by the vendor to provide services for Veradigm customers. Veradigm said no clinical or medical data was involved.\u003c/p\u003e\n\n\u003cp\u003eVeradigm said access was limited to a specific interface and did not affect its broader environment, including networks, servers, or databases. The company said the incident did not cause operational disruptions, and an investigation is ongoing after the breach was reported to law enforcement. The Gentlemen ransomware gang added Veradigm to its leak site and claimed it stole the health records of 3.5 million patients.\u003c/p\u003e\n\n\u003cp\u003eThe article places the incident within a broader wave of cyberattacks affecting healthcare data firms this year. It cites recent incidents involving Aesto, Baylor Genetics, CareCloud, Paylogix, and Boston Scientific, including exposures of data belonging to millions of people and ongoing operational issues at Boston Scientific. Veradigm has also experienced previous cybersecurity incidents, including a SamSam ransomware attack in 2019 and a separate incident reported in December 2025 involving health data exposure for 2,672,036 people.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Veradigm told regulators that hackers infiltrated a vendor’s systems and stole customer information, including Social Security numbers in some instances.","Veradigm said the unauthorized party obtained credentials from the vendor’s environment to a Veradigm application programming interface used by the vendor to provide services for Veradigm customers.","The company said no clinical or medical data was involved, access was limited to a specific interface, and its broader networks, servers, and databases were not impacted.","The Gentlemen ransomware gang added Veradigm to its leak site and claimed it stole the health records of 3.5 million patients.","The article says healthcare data firms have faced multiple major cyberattacks this year, including incidents affecting Aesto, Baylor Genetics, CareCloud, Paylogix, and Boston Scientific."],"insights":["Veradigm’s SEC filing narrows the incident to vendor-held credentials for a specific API, showing that a third-party service path can expose patient data even when the company says its own networks, servers, and databases were not broadly compromised.","There is a discrepancy between Veradigm’s statement that no clinical or medical data was involved and the Gentlemen ransomware gang’s claim that it stole health records of 3.5 million patients.","Veradigm has now disclosed multiple major cybersecurity incidents across recent years, including a SamSam ransomware attack in 2019, a December 2025 report involving 2,672,036 people, and the newly reported vendor-linked breach.","The article shows that healthcare technology and data-service providers are becoming high-impact targets because attacks on firms such as Veradigm, Aesto, Baylor Genetics, CareCloud, Paylogix, and Boston Scientific can affect millions of patients or disrupt medical operations."],"referencedReports":[{"title":"Ungentlemanly Behavior: Insights into a Ransomware Operation","url":"https://www.sophos.com/en-us/blog/ungentlemanly-behavior-insights-into-a-ransomware-operation","publisher":"Sophos","context":"The article cites Sophos’ analysis while describing the Gentlemen ransomware gang as having launched hundreds of attacks since emerging last fall.","category":"research","primary":false}],"body":"\u003cp\u003eElectronic health records company Veradigm told regulators that hackers infiltrated a vendor’s systems and stole customer information, including Social Security numbers in some instances. The company said an unauthorized party obtained credentials from the vendor’s environment for a Veradigm application programming interface used by the vendor to provide services for Veradigm customers. Veradigm said no clinical or medical data was involved.\u003c/p\u003e\n\n\u003cp\u003eVeradigm said access was limited to a specific interface and did not affect its broader environment, including networks, servers, or databases. The company said the incident did not cause operational disruptions, and an investigation is ongoing after the breach was reported to law enforcement. The Gentlemen ransomware gang added Veradigm to its leak site and claimed it stole the health records of 3.5 million patients.\u003c/p\u003e\n\n\u003cp\u003eThe article places the incident within a broader wave of cyberattacks affecting healthcare data firms this year. It cites recent incidents involving Aesto, Baylor Genetics, CareCloud, Paylogix, and Boston Scientific, including exposures of data belonging to millions of people and ongoing operational issues at Boston Scientific. Veradigm has also experienced previous cybersecurity incidents, including a SamSam ransomware attack in 2019 and a separate incident reported in December 2025 involving health data exposure for 2,672,036 people.\u003c/p\u003e\n"},{"n":20,"title":"New cPanel Flaw Lets a Hosting Account With Mail Privileges Run Code as Root","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/new-cpanel-flaw-lets-hosting-account.html","time":"08:19","priority":"MUST READ","score":92,"tldr":"cPanel patched CVE-2026-67401, an EmailTrack SQL injection flaw affecting all supported cPanel/WHM versions that could let an authenticated hosting account with mail privileges create files and execute code as root. Admins should upgrade to the fixed builds immediately, though cPanel has not provided mitigations or guidance for checking prior compromise.","briefOverview":"\u003cp\u003ecPanel has patched CVE-2026-67401, a flaw it describes as an SQL injection issue in EmailTrack. The company says an authenticated hosting account holder with mail-related privileges can create files on the server and then run code as the root user. cPanel published the advisory on September 8 and said every supported version of cPanel and WHM is affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because cPanel is used by customers to manage individual hosting accounts, while WHM lets providers manage the whole machine as root. An attacker with root access could read every hosting account on the server, change files and databases, create hidden accounts, install malware, steal credentials, and move into customer networks. cPanel named fixed builds for release lines 11.110, 11.134, 11.136, 11.138, and WP Squared, and said servers can be updated through WHM or by running \u003ccode\u003e/usr/local/cpanel/scripts/upcp --force\u003c/code\u003e as root.\u003c/p\u003e\n\n\u003cp\u003eThe advisory does not explain how the SQL injection leads to file creation and root access, and it does not provide temporary steps for servers that cannot update immediately. It also does not say whether installing the patched build helps a server that was attacked before the update or how administrators would check for compromise. As of September 9, no public exploit code or exploitation report for CVE-2026-67401 appeared in searches, and it was not listed in CISA’s Known Exploited Vulnerabilities catalog released on September 8.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["cPanel patched CVE-2026-67401, an SQL injection flaw in EmailTrack that can let an authenticated account holder with mail-related privileges create files on the server and run code as the root user.","cPanel said every supported version of cPanel and WHM is affected and named fixed builds for release lines 11.110, 11.134, 11.136, 11.138, and WP Squared.","The advisory does not explain how the SQL injection leads to file creation and root access, and it does not provide temporary mitigation steps for servers that cannot update immediately.","cPanel also does not say whether installing the patched build helps a server that was attacked before the update or how an administrator would check for prior compromise.","As of September 9, no public exploit code or exploitation report for CVE-2026-67401 appeared in searches, and the flaw was absent from CISA’s Known Exploited Vulnerabilities catalog released September 8."],"insights":["The lack of a temporary workaround is notable because cPanel provided one in a July advisory for a different database flaw, leaving immediate upgrading as the only concrete action described for this issue.","The affected and fixed release lines leave uncertainty around cPanel 11.118 and 11.126, which were patched in July advisories but have not appeared in later patched-build lists and were not clearly described as still supported.","This is the third recently disclosed cPanel issue described as starting from an ordinary hosting account, and two recent related flaws already had repositories online presenting themselves as working exploits when The Hacker News checked.","The advisory’s practical risk is harder to assess because it omits a severity score, does not explain the path from SQL injection to root access, and gives no guidance for determining whether a server was compromised before patching."],"referencedReports":[{"title":"Security CVE-2026-67401 SQL Injection Vulnerability in cPanel's EmailTrack Functionality - September 8, 2026","url":"https://support.cpanel.net/hc/en-us/articles/43187903921559-Security-CVE-2026-67401-SQL-Injection-Vulnerability-in-cPanel-s-EmailTrack-Functionality-September-8-2026","publisher":"cPanel","context":"The article cites cPanel's September 8 advisory as the source for the patched EmailTrack SQL injection flaw affecting supported cPanel and WHM versions.","category":"advisory","primary":true},{"title":"How do I update cPanel \u0026 WHM","url":"https://support.cpanel.net/hc/en-us/articles/1500004959421-How-do-I-update-cPanel-WHM","publisher":"cPanel","context":"The article links to cPanel's instructions for updating cPanel and WHM from the command line.","category":"guide","primary":false},{"title":"Security CVE-2026-58048 - Database Privilege Escalation","url":"https://support.cpanel.net/hc/en-us/articles/42285745783703-Security-CVE-2026-58048-Database-Privilege-Escalation","publisher":"cPanel","context":"The article references this July 30 advisory as an example where cPanel provided a temporary mitigation for administrators who could not upgrade immediately.","category":"advisory","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article says CVE-2026-67401 was absent from CISA's Known Exploited Vulnerabilities catalog in the version released on September 8.","category":"advisory","primary":false}],"body":"\u003cp\u003ecPanel has patched CVE-2026-67401, a flaw it describes as an SQL injection issue in EmailTrack. The company says an authenticated hosting account holder with mail-related privileges can create files on the server and then run code as the root user. cPanel published the advisory on September 8 and said every supported version of cPanel and WHM is affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because cPanel is used by customers to manage individual hosting accounts, while WHM lets providers manage the whole machine as root. An attacker with root access could read every hosting account on the server, change files and databases, create hidden accounts, install malware, steal credentials, and move into customer networks. cPanel named fixed builds for release lines 11.110, 11.134, 11.136, 11.138, and WP Squared, and said servers can be updated through WHM or by running \u003ccode\u003e/usr/local/cpanel/scripts/upcp --force\u003c/code\u003e as root.\u003c/p\u003e\n\n\u003cp\u003eThe advisory does not explain how the SQL injection leads to file creation and root access, and it does not provide temporary steps for servers that cannot update immediately. It also does not say whether installing the patched build helps a server that was attacked before the update or how administrators would check for compromise. As of September 9, no public exploit code or exploitation report for CVE-2026-67401 appeared in searches, and it was not listed in CISA’s Known Exploited Vulnerabilities catalog released on September 8.\u003c/p\u003e\n"},{"n":39,"title":"Untracked Nightmares: The Threats Hiding Behind Commodity Infrastructure","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/ppi-network-malware-campaign-analysis/","time":"10:00","priority":"MUST READ","score":92,"tldr":"Unit 42 uncovered CL-CRI-1171, a pay-per-install operation using YouTube gaming content and SEO-poisoned software downloads to spread a generic loader called OfferLoader. The key risk is that seemingly routine commodity loader infections can hide multiple serious payloads, including Insomnia RAT, ARKTunnel and Docro Hijacker.","briefOverview":"\u003cp\u003eUnit 42 investigated two seemingly routine enterprise infections and traced them to a larger cybercrime campaign tracked as CL-CRI-1171. The group has operated under the radar for at least two years and provides a pay-per-install infection service for other threat actors. Its distribution relied on at least two funnels: gaming-focused YouTube channels and SEO-poisoned search results that led users to trojanized software downloads.\u003c/p\u003e\n\n\u003cp\u003eThe campaign mainly targeted young gamers through YouTube videos about improving frame rates, fixing crashes and adjusting game settings, while also reaching corporate endpoints through fake software downloads. Unit 42 identified 11 related YouTube channels with hundreds of thousands of subscribers and millions of views, and YouTube terminated them after notification. The SEO path promoted trojanized software and resulted in malware deployment on corporate endpoints, including critical infrastructure and government entities.\u003c/p\u003e\n\n\u003cp\u003eThe common component was OfferLoader, an Inno Setup-based loader that used gating mechanisms and rotational domains to control who received payloads and to limit exposure to scanners, crawlers and analysts. In April 2026, OfferLoader delivered three separate malware families: Insomnia RAT, ARKTunnel and Docro Hijacker. Unit 42 also identified more than 10,000 distinct OfferLoader samples, indicating a much larger distribution pipeline capable of delivering many different payload combinations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 tracks the activity as CL-CRI-1171, a pay-per-install operation that has operated under the radar for at least two years and provides an infection service for other threat actors.","CL-CRI-1171 used at least two delivery funnels: gaming-focused YouTube channels and SEO-poisoned search results leading to trojanized software downloads.","Unit 42 identified more than 10,000 distinct OfferLoader samples and more than 200 rotational domains following a distinctive two-word compound naming pattern across several top-level domains.","In April 2026, OfferLoader delivered three separate malware families in two intrusion sets: Insomnia RAT, ARKTunnel and Docro Hijacker.","Unit 42 identified 11 YouTube channels tied to CL-CRI-1171 that collectively had hundreds of thousands of subscribers and millions of views, and YouTube terminated the channels after being notified."],"insights":["The campaign had almost no public footprint because its gate required a valid, fresh Base64-encoded victim fingerprint, causing scanners, crawlers and analysts to receive decoy pages or broken links instead of malware.","A loader that appeared generic enough to be dismissed as commodity adware was actually the common link between unrelated enterprise infections and a much larger pay-per-install distribution network.","The YouTube videos were not purely fake lures; they included real gaming optimization content while using download links in descriptions to route viewers into the same infection infrastructure as the SEO-poisoning funnel.","Docro Hijacker shows that an older Chrome browser-hijacking technique first seen in 2015 had been re-engineered to bypass modern Secure Preferences integrity protections and was deployed in the wild.","ARKTunnel had at least 50 samples spanning a year and multiple fabricated company identity rotations, yet it had no public reporting or dedicated tracking before this investigation."],"referencedReports":[{"title":"“WinYahoo” PUP Modifies Chrome Secure Preferences","url":"https://www.malwarebytes.com/blog/news/2015/05/winyahoo-pup-modifies-chrome-secure-preferences","publisher":"Malwarebytes","context":"The article cites this Malwarebytes analysis as prior documentation of the browser-hijacking technique that Docro Hijacker revives.","category":"research","primary":false},{"title":"NodeJS backdoors delivering proxyware and monetization schemes","url":"https://medium.com/walmartglobaltech/nodejs-backdoors-delivering-proxyware-and-monetization-schemes-1562917ed107","publisher":"Walmart Global Tech","context":"The article references this 2025 Walmart Global Tech analysis as prior reporting on the Node.js backdoor variant related to Insomnia RAT.","category":"research","primary":false},{"title":"The Phantom Extension: Backdooring Chrome Through Uncharted Pathways","url":"https://www.synacktiv.com/en/publications/the-phantom-extension-backdooring-chrome-through-uncharted-pathways","publisher":"Synacktiv","context":"The article says Docro Hijacker closely mirrors a proof-of-concept detailed by Synacktiv in 2025.","category":"research","primary":false}],"body":"\u003cp\u003eUnit 42 investigated two seemingly routine enterprise infections and traced them to a larger cybercrime campaign tracked as CL-CRI-1171. The group has operated under the radar for at least two years and provides a pay-per-install infection service for other threat actors. Its distribution relied on at least two funnels: gaming-focused YouTube channels and SEO-poisoned search results that led users to trojanized software downloads.\u003c/p\u003e\n\n\u003cp\u003eThe campaign mainly targeted young gamers through YouTube videos about improving frame rates, fixing crashes and adjusting game settings, while also reaching corporate endpoints through fake software downloads. Unit 42 identified 11 related YouTube channels with hundreds of thousands of subscribers and millions of views, and YouTube terminated them after notification. The SEO path promoted trojanized software and resulted in malware deployment on corporate endpoints, including critical infrastructure and government entities.\u003c/p\u003e\n\n\u003cp\u003eThe common component was OfferLoader, an Inno Setup-based loader that used gating mechanisms and rotational domains to control who received payloads and to limit exposure to scanners, crawlers and analysts. In April 2026, OfferLoader delivered three separate malware families: Insomnia RAT, ARKTunnel and Docro Hijacker. Unit 42 also identified more than 10,000 distinct OfferLoader samples, indicating a much larger distribution pipeline capable of delivering many different payload combinations.\u003c/p\u003e\n"},{"n":10,"title":"Veradigm warns of patient data breach after ransomware gang claims attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/veradigm-discloses-patient-data-breach-after-gentlemen-gang-claims-attack/","time":"15:31","priority":"SHOULD READ","score":86,"tldr":"Veradigm disclosed that attackers used compromised third-party vendor credentials to access a limited customer API and steal patient personal data, including some Social Security numbers, though medical records and core systems were not accessed. The Gentlemen ransomware gang claims it stole 3.5 million patient records and is threatening to leak them unless paid.","briefOverview":"\u003cp\u003eHealthcare technology company Veradigm disclosed a data breach after a cybersecurity incident at one of its third-party vendors exposed patients’ personal data. The company said the incident did not disrupt operations but affected a small number of customers. Veradigm, formerly Allscripts Healthcare Solutions, provides electronic health records, e-prescribing, patient-engagement, practice-management, and revenue-cycle software used by thousands of hospitals, clinics, and biopharmaceutical firms in the United States.\u003c/p\u003e\n\n\u003cp\u003eIn an SEC filing, Veradigm said an attacker obtained credentials from a vendor’s environment for a Veradigm API reserved for customer services and used that access to copy patient data. The stolen data includes personal details and Social Security numbers for some patients, while clinical or medical information remained safe. Veradigm said the compromised credentials only allowed access through the limited interface and did not provide access to its broader network, servers, databases, or other systems.\u003c/p\u003e\n\n\u003cp\u003eThe Gentlemen ransomware group claimed the intrusion on September 5 and alleged it holds 3.5 million patient records, including names, home addresses, Social Security numbers, email addresses, phone numbers, and guarantor information. The group threatened to leak the data by Friday, September 11, if Veradigm does not engage in ransom payment negotiations. Veradigm said it initiated incident-response procedures, notified law enforcement, is investigating the scope, and is notifying affected customers and individuals with credit-monitoring services offered where applicable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Veradigm disclosed a data breach after an attacker used credentials obtained from a third-party vendor’s environment to access a Veradigm customer services API and copy patient data.","The stolen data includes personal details and Social Security numbers for some patients, while Veradigm said clinical or medical information remained safe.","Veradigm said the compromised credentials only allowed access through a limited interface and did not provide access to its broader network, servers, databases, or other systems.","The Gentlemen ransomware group claimed the intrusion on September 5 and alleged it holds 3.5 million patient records including names, addresses, Social Security numbers, email addresses, phone numbers, and guarantor information.","Veradigm said it has initiated incident-response procedures, notified law enforcement, is investigating the scope, and is notifying affected customers and individuals with credit monitoring offered where applicable."],"insights":["The incident shows that a vendor’s compromised credentials can expose patient data even when the victim company says its broader network, servers, databases, and other systems were not accessed.","Veradigm’s SEC filing says the breach affected a small number of customers, while The Gentlemen claims to hold 3.5 million patient records, creating a notable gap between the company’s current assessment and the attacker’s public claims.","The exposed data is especially sensitive because Veradigm says some Social Security numbers were stolen, even though clinical or medical information remained safe.","The Gentlemen’s claimed activity spans more than 800 victims in 86 countries, indicating that the group’s operations are broad and opportunistic rather than focused only on healthcare."],"referencedReports":[],"body":"\u003cp\u003eHealthcare technology company Veradigm disclosed a data breach after a cybersecurity incident at one of its third-party vendors exposed patients’ personal data. The company said the incident did not disrupt operations but affected a small number of customers. Veradigm, formerly Allscripts Healthcare Solutions, provides electronic health records, e-prescribing, patient-engagement, practice-management, and revenue-cycle software used by thousands of hospitals, clinics, and biopharmaceutical firms in the United States.\u003c/p\u003e\n\n\u003cp\u003eIn an SEC filing, Veradigm said an attacker obtained credentials from a vendor’s environment for a Veradigm API reserved for customer services and used that access to copy patient data. The stolen data includes personal details and Social Security numbers for some patients, while clinical or medical information remained safe. Veradigm said the compromised credentials only allowed access through the limited interface and did not provide access to its broader network, servers, databases, or other systems.\u003c/p\u003e\n\n\u003cp\u003eThe Gentlemen ransomware group claimed the intrusion on September 5 and alleged it holds 3.5 million patient records, including names, home addresses, Social Security numbers, email addresses, phone numbers, and guarantor information. The group threatened to leak the data by Friday, September 11, if Veradigm does not engage in ransom payment negotiations. Veradigm said it initiated incident-response procedures, notified law enforcement, is investigating the scope, and is notifying affected customers and individuals with credit-monitoring services offered where applicable.\u003c/p\u003e\n"},{"n":16,"title":"US disrupts Xinbi Guarantee marketplace fueling the cyber scam economy","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/us-disrupts-xinbi-guarantee-marketplace-cybercrime","time":"19:54","priority":"SHOULD READ","score":85,"tldr":"The U.S. sanctioned and disrupted Xinbi Guarantee, a Telegram-based illicit marketplace that allegedly processed at least $24 billion for cyber scams, money laundering and related crime. Authorities seized Telegram channels and $52.8 million in crypto wallets, though researchers expect the platform may try to relaunch.","briefOverview":"\u003cp\u003eThe U.S. government took action against Xinbi Guarantee, a Telegram-based illicit marketplace accused of facilitating billions of dollars in transactions tied to cyber scams, money laundering, human trafficking, and other crime. The Treasury Department sanctioned Xinbi Guarantee and two businesses it accused of supporting the platform’s operations. The government also seized $52.8 million from 52 cryptocurrency wallets connected to the platform.\u003c/p\u003e\n\n\u003cp\u003eAccording to Elliptic, Xinbi was created in 2022 and processed at least $24 billion in transactions, making it the second-largest illicit online marketplace in history. Vendors used its channels to offer services such as money laundering, stolen personal data, and deepfake technology, with payments made through the platform in Tether’s USDT stablecoin. A district court authorized the seizure of Telegram channels hosting the marketplace, and Xinbi’s main Telegram channel was no longer available on Wednesday.\u003c/p\u003e\n\n\u003cp\u003eThe actions were carried out by the DOJ’s Scam Center Task Force, an interagency effort created to target cyber scams largely carried out by Chinese organized crime groups based in Southeast Asia. With Tether’s cooperation, authorities seized two wallets holding $12 million used to collect vendor payments, along with dozens of other wallets allegedly tied to money laundering and scamming activity. The DOJ also said the strike force would expand its scope globally and had recently worked with law enforcement in Madagascar to take down 13 scam centers operated by Chinese organized crime syndicates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Treasury Department sanctioned the Telegram-based marketplace Xinbi Guarantee and two businesses it accused of supporting the platform’s operations.","The U.S. government seized $52.8 million from 52 cryptocurrency wallets connected to Xinbi Guarantee, and a district court authorized the seizure of Telegram channels hosting the marketplace.","Elliptic said Xinbi Guarantee was created in 2022 and had processed at least $24 billion in transactions, making it the second-largest illicit online marketplace in history.","Xinbi Guarantee vendors used its channels to offer services including money laundering, stolen personal data, and deepfake technology, with payments made through the platform in Tether’s USDT stablecoin.","The DOJ said its Scam Center Task Force would expand its scope to attack scam compounds globally and had recently worked with local law enforcement in Madagascar to take down 13 scam centers."],"insights":["Criminal activity shifted to Xinbi after Telegram took down Huione Guarantee, showing that removing one marketplace can push users to a similar platform if alternatives remain available.","Tether’s cooperation was central to freezing and seizing funds, and Xinbi administrators responded by telling users they would move to USDD on the TRON blockchain because it is harder to seize.","Telegram’s role was significant because Xinbi operated through Telegram channels, and the article says researchers had urged Telegram to act against Xinbi before the U.S. court-authorized seizure.","The DOJ’s Scam Center Task Force is broadening its focus beyond online marketplaces to physical scam compounds globally, including a recent operation in Madagascar that took down 13 scam centers."],"referencedReports":[{"title":"Elliptic helps US Secret Service freeze Xinbi scam marketplace assets","url":"https://www.elliptic.co/insights/elliptic-helps-us-secret-service-freeze-xinbi-scam-marketplace-assets/","publisher":"Elliptic","context":"The article cites Elliptic for Xinbi Guarantee’s transaction volume, its ranking among illicit online marketplaces, and details about asset freezes and the platform’s response.","category":"research","primary":true}],"body":"\u003cp\u003eThe U.S. government took action against Xinbi Guarantee, a Telegram-based illicit marketplace accused of facilitating billions of dollars in transactions tied to cyber scams, money laundering, human trafficking, and other crime. The Treasury Department sanctioned Xinbi Guarantee and two businesses it accused of supporting the platform’s operations. The government also seized $52.8 million from 52 cryptocurrency wallets connected to the platform.\u003c/p\u003e\n\n\u003cp\u003eAccording to Elliptic, Xinbi was created in 2022 and processed at least $24 billion in transactions, making it the second-largest illicit online marketplace in history. Vendors used its channels to offer services such as money laundering, stolen personal data, and deepfake technology, with payments made through the platform in Tether’s USDT stablecoin. A district court authorized the seizure of Telegram channels hosting the marketplace, and Xinbi’s main Telegram channel was no longer available on Wednesday.\u003c/p\u003e\n\n\u003cp\u003eThe actions were carried out by the DOJ’s Scam Center Task Force, an interagency effort created to target cyber scams largely carried out by Chinese organized crime groups based in Southeast Asia. With Tether’s cooperation, authorities seized two wallets holding $12 million used to collect vendor payments, along with dozens of other wallets allegedly tied to money laundering and scamming activity. The DOJ also said the strike force would expand its scope globally and had recently worked with law enforcement in Madagascar to take down 13 scam centers operated by Chinese organized crime syndicates.\u003c/p\u003e\n"},{"n":29,"title":"Researcher Drops New Microsoft Defender PoC Showing ShieldBreak Patch Can Be Bypassed","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/researcher-drops-new-microsoft-defender.html","time":"06:47","priority":"SHOULD READ","score":85,"tldr":"A researcher released a new proof-of-concept called ShieldCrash showing Microsoft’s recent patch for the Defender vulnerability ShieldBreak can still be bypassed to read arbitrary files as SYSTEM. The issue reportedly affects supported Windows versions despite the latest Malware Protection Engine update.","briefOverview":"\u003cp\u003eSecurity researcher Chaotic Eclipse released a proof-of-concept for a new Microsoft Defender zero-day called \u003cstrong\u003eShieldCrash\u003c/strong\u003e. The vulnerability is described as a patch bypass for CVE-2026-69414, also known as \u003cstrong\u003eShieldBreak\u003c/strong\u003e, which the researcher reported last month. Chaotic Eclipse said Microsoft did not fully patch the earlier issue and that the same problem can still be triggered under specific conditions.\u003c/p\u003e\n\n\u003cp\u003eThe proof-of-concept demonstrates an arbitrary file read as SYSTEM on the latest version of Windows. The article says all supported versions of the desktop operating system are impacted. Microsoft recently shipped an update to the Microsoft Malware Protection Engine to address CVE-2026-69414, with the issue patched in version 1.1.26080.3.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said its antimalware software relies on timely updates to malware definitions and the Malware Protection Engine, and that default configurations help keep those updates automatic. The company said the update does not require customer action and does not affect systems that have disabled Microsoft Defender. The article also notes that Chaotic Eclipse recently released proof-of-concept exploits for issues affecting CrowdStrike Falcon Sensor, Kaspersky, Avast Antivirus, and NVIDIA.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Chaotic Eclipse released a proof-of-concept for a new Microsoft Defender zero-day called ShieldCrash.","ShieldCrash is described as a patch bypass for CVE-2026-69414, also known as ShieldBreak, which Chaotic Eclipse reported the previous month.","The proof-of-concept demonstrates arbitrary file read as SYSTEM on the latest version of Windows, and all supported desktop versions of Windows are said to be impacted.","Microsoft recently shipped an update to the Microsoft Malware Protection Engine to address CVE-2026-69414 in version 1.1.26080.3.","Chaotic Eclipse has also recently released proof-of-concept exploits for vulnerabilities affecting CrowdStrike Falcon Sensor, Kaspersky, Avast Antivirus, and NVIDIA."],"insights":["The new proof-of-concept targets a gap left after Microsoft’s fix, showing that the earlier ShieldBreak issue may still be reachable under specific conditions despite several patch changes.","Microsoft’s advisory says the Malware Protection Engine update requires no customer action when automatic updates are enabled, making update configuration a key factor in whether systems receive the fix promptly.","Systems with Microsoft Defender disabled are stated by Microsoft to be unaffected by CVE-2026-69414, narrowing the scope to environments where Defender is active.","Chaotic Eclipse’s recent releases span multiple major security vendors, with Kaspersky and Avast already patching their reported issues while CrowdStrike is still investigating its report."],"referencedReports":[{"title":"ShieldCrash","url":"https://github.com/MSNightmare/ShieldCrash","publisher":"Chaotic Eclipse","context":"The article references this linked proof-of-concept as the basis for the newly disclosed Microsoft Defender patch bypass.","category":"research","primary":true},{"title":"CVE-2026-69414","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-69414","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for details on the Malware Protection Engine update that addressed CVE-2026-69414.","category":"advisory","primary":false}],"body":"\u003cp\u003eSecurity researcher Chaotic Eclipse released a proof-of-concept for a new Microsoft Defender zero-day called \u003cstrong\u003eShieldCrash\u003c/strong\u003e. The vulnerability is described as a patch bypass for CVE-2026-69414, also known as \u003cstrong\u003eShieldBreak\u003c/strong\u003e, which the researcher reported last month. Chaotic Eclipse said Microsoft did not fully patch the earlier issue and that the same problem can still be triggered under specific conditions.\u003c/p\u003e\n\n\u003cp\u003eThe proof-of-concept demonstrates an arbitrary file read as SYSTEM on the latest version of Windows. The article says all supported versions of the desktop operating system are impacted. Microsoft recently shipped an update to the Microsoft Malware Protection Engine to address CVE-2026-69414, with the issue patched in version 1.1.26080.3.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said its antimalware software relies on timely updates to malware definitions and the Malware Protection Engine, and that default configurations help keep those updates automatic. The company said the update does not require customer action and does not affect systems that have disabled Microsoft Defender. The article also notes that Chaotic Eclipse recently released proof-of-concept exploits for issues affecting CrowdStrike Falcon Sensor, Kaspersky, Avast Antivirus, and NVIDIA.\u003c/p\u003e\n"},{"n":26,"title":"U.S. Disrupts Xinbi Guarantee Scam Marketplace, Freezes $52.8 Million in Crypto","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/us-disrupts-xinbi-guarantee-scam.html","time":"18:26","priority":"SHOULD READ","score":84,"tldr":"U.S. authorities disrupted the Xinbi Guarantee scam marketplace by seizing Telegram channels and crypto wallets and freezing $52.8 million tied to scam laundering. The action targets a major Telegram-based ecosystem used by organized crime groups to support pig-butchering scams and global scam compounds.","briefOverview":"\u003cp\u003eThe U.S. Department of Justice announced coordinated actions against Xinbi Guarantee, an illicit Telegram-oriented marketplace that offered scam services. The actions included seizing Telegram channels used to run the service, confiscating two cryptocurrency wallets, and deploying the Scam Center Strike Force to Madagascar to help disrupt 13 scam compounds run by Chinese organized crime syndicates. The Treasury Department’s Office of Foreign Assets Control also sanctioned the Chinese-language media for facilitating cyber scams, fraud, money laundering, and other criminal activity targeting Americans.\u003c/p\u003e\n\n\u003cp\u003eAuthorities froze \u003cspan class=\"math inline\"\u003e\\(52.8 million in cryptocurrency from 52 wallets associated with Xinbi and its merchant network, bringing the Scam Center Strike Force’s total restrained funds to about \\)\u003c/span\u003e938 million. Elliptic said Xinbi is the second-largest illicit marketplace of its kind, with \u003cspan class=\"math inline\"\u003e\\(30 billion in transactions since around 2022, and helped the U.S. Secret Service identify and freeze wallets holding \\)\u003c/span\u003e52.8 million in Tether’s USDT stablecoin. Xinbi acted as an intermediary between vendors and scam center operators by holding payments until services were completed, including custom scam investment websites, laundering funds, and soliciting trafficking victims to work in scam compounds.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said the Madagascar operation led to the takedown of 13 scam centers, the seizure of more than 3,200 electronic devices, and investigations based on interviews with nearly 400 arrestees. Historically, payments on Xinbi were made in Tether’s USDT stablecoin, mainly on the TRON blockchain, but Xinbi switched to USDD after the asset freeze. Elliptic described the actions as a severe setback to the Guarantee marketplace ecosystem because merchants and users may now operate knowing their wallets could be identified and frozen at any time.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The U.S. Department of Justice announced coordinated actions against Xinbi Guarantee, including seizing Telegram channels, confiscating two cryptocurrency wallets, and deploying the Scam Center Strike Force to Madagascar.","Authorities froze $52.8 million in cryptocurrency from 52 wallets associated with Xinbi Guarantee and its merchant network, bringing the Scam Center Strike Force’s total restrained funds to about $938 million.","Elliptic said Xinbi Guarantee is the second-largest illicit marketplace of its kind, with $30 billion in transactions since around 2022, and helped the U.S. Secret Service identify and freeze wallets holding $52.8 million in Tether’s USDT.","Xinbi Guarantee acted as an intermediary between vendors and scam center operators by holding payments until services such as scam investment websites, money laundering, and recruitment for scam compounds were completed.","The Justice Department said the Scam Center Strike Force helped take down 13 scam centers in Madagascar, where more than 3,200 electronic devices were seized and investigations were opened after interviews with nearly 400 arrestees."],"insights":["The freeze is designed to undermine trust in the marketplace model itself, because Xinbi’s escrow-like role depends on merchants and criminal users believing their funds are safe from seizure.","Xinbi’s immediate move from USDT to USDD shows that the ability to freeze stablecoin assets is a practical pressure point for law enforcement actions against scam marketplaces.","Telegram intervention against earlier marketplaces did not eliminate the ecosystem, as Xinbi rose after HuiOne Guarantee and Tudou Guarantee were closed and other markets also emerged on the platform.","The operation connected online marketplace disruption with physical scam-compound enforcement, including the takedown of 13 compounds in Madagascar and interviews with nearly 400 arrestees.","Xinbi’s reported use by North Korean hackers and OFAC-designated entities shows the marketplace served multiple types of sanctioned or criminal actors, not only operators of pig-butchering scams."],"referencedReports":[{"title":"Elliptic Helps U.S. Secret Service Freeze Xinbi Scam Marketplace Assets","url":"https://www.elliptic.co/insights/elliptic-helps-us-secret-service-freeze-xinbi-scam-marketplace-assets/","publisher":"Elliptic","context":"The article cites Elliptic’s analysis explaining the freezing of Xinbi-linked assets, Xinbi’s switch from USDT to USDD, and the impact on the Guarantee marketplace ecosystem.","category":"research","primary":true}],"body":"\u003cp\u003eThe U.S. Department of Justice announced coordinated actions against Xinbi Guarantee, an illicit Telegram-oriented marketplace that offered scam services. The actions included seizing Telegram channels used to run the service, confiscating two cryptocurrency wallets, and deploying the Scam Center Strike Force to Madagascar to help disrupt 13 scam compounds run by Chinese organized crime syndicates. The Treasury Department’s Office of Foreign Assets Control also sanctioned the Chinese-language media for facilitating cyber scams, fraud, money laundering, and other criminal activity targeting Americans.\u003c/p\u003e\n\n\u003cp\u003eAuthorities froze \u003cspan class=\"math inline\"\u003e\\(52.8 million in cryptocurrency from 52 wallets associated with Xinbi and its merchant network, bringing the Scam Center Strike Force’s total restrained funds to about \\)\u003c/span\u003e938 million. Elliptic said Xinbi is the second-largest illicit marketplace of its kind, with \u003cspan class=\"math inline\"\u003e\\(30 billion in transactions since around 2022, and helped the U.S. Secret Service identify and freeze wallets holding \\)\u003c/span\u003e52.8 million in Tether’s USDT stablecoin. Xinbi acted as an intermediary between vendors and scam center operators by holding payments until services were completed, including custom scam investment websites, laundering funds, and soliciting trafficking victims to work in scam compounds.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said the Madagascar operation led to the takedown of 13 scam centers, the seizure of more than 3,200 electronic devices, and investigations based on interviews with nearly 400 arrestees. Historically, payments on Xinbi were made in Tether’s USDT stablecoin, mainly on the TRON blockchain, but Xinbi switched to USDD after the asset freeze. Elliptic described the actions as a severe setback to the Guarantee marketplace ecosystem because merchants and users may now operate knowing their wallets could be identified and frozen at any time.\u003c/p\u003e\n"},{"n":28,"title":"U.S. Agencies Accuse China AI Firms of Distilling Claude, GPT, Gemini, and Grok","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/us-agencies-accuse-china-ai-firms-of.html","time":"09:32","priority":"SHOULD READ","score":84,"tldr":"U.S. agencies warned that China-based AI firms are allegedly using industrial-scale model distillation to extract proprietary capabilities from U.S. frontier models like Claude, GPT, Gemini, and Grok. The advisory urges AI providers to strengthen detection, share signals across platforms, and counter abuse of APIs, proxies, and compromised or fraudulent accounts.","briefOverview":"\u003cp\u003eU.S. cybersecurity and intelligence agencies accused China-based AI companies of conducting “systematic extraction” of proprietary capabilities from American frontier AI models through industrial-scale distillation attacks. The NSA, CISA, and FBI said the activity forms the core of those companies’ AI development strategy and targets models including Anthropic Claude, OpenAI GPT, Google Gemini, and SpaceXAI Grok. The advisory named DeepSeek, Moonshot AI, Alibaba, MiniMax, StepFun, and Z.AI as companies that allegedly extracted billions of tokens across millions of exchanges or requests since at least late 2024.\u003c/p\u003e\n\n\u003cp\u003eThe article says the campaigns use premium subscriptions shared across developer teams, APIs, remote cloud providers, third-party aggregators, obfuscated accounts, automated agents, and gray-market proxies to gain or hide access. The agencies described tactics such as chain-of-thought reasoning extraction, automated failover between pathways during blocking attempts, and quality evaluation frameworks to detect defensive countermeasures. Because U.S. frontier models are officially restricted and not offered in China, Chinese developers allegedly used alternative access methods to bypass geographic controls.\u003c/p\u003e\n\n\u003cp\u003eThe agencies warned that this activity can shorten AI development timelines and reduce the cost of training frontier models for the companies involved. They recommended that U.S. AI companies implement detection and mitigation measures, subtly alter responses for suspected malicious distillation attempts, and correlate activity across model providers, cloud platforms, and API aggregators. The article also notes similar concerns from Anthropic and Google Threat Intelligence Group, and quotes Arctic Wolf’s Ismael Valenzuela saying the issue is an abuse of legitimate access that can make API keys and service accounts valuable targets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The NSA, CISA, and FBI accused China-based AI companies of conducting industrial-scale distillation attacks to extract proprietary capabilities from U.S. frontier AI models.","The advisory names DeepSeek, Moonshot AI, Alibaba, MiniMax, StepFun, and Z.AI as having extracted billions of tokens across millions of exchanges from models including Anthropic Claude, OpenAI GPT, Google Gemini, and SpaceXAI Grok since at least late 2024.","The agencies said the campaigns use methods such as chain-of-thought reasoning extraction, automated failover during blocking attempts, and quality evaluation frameworks to detect defensive countermeasures.","The article says the requests are routed through APIs, remote cloud providers, third-party aggregators, virtual private networks, obfuscated accounts, automated agents, and gray-market proxy services to bypass restrictions and avoid detection.","The agencies recommended that U.S. AI companies implement detection and mitigation measures, subtly alter responses for suspected malicious distillation attempts, and correlate activity across model providers, cloud platforms, and API aggregators."],"insights":["The advisory frames the activity as abuse of legitimate model access rather than a conventional system compromise, meaning the traffic can appear similar to normal customer use.","The article says bulk procurement of premium subscriptions shared across developer teams is one way the campaigns reduce the cost of large-scale extraction.","The use of third-party aggregators and gray-market proxy services means enforcement by a single AI provider may miss campaigns that are deliberately spread across multiple access paths.","The agencies’ recommendation to subtly alter responses for suspected malicious requests suggests detection alone is not enough; providers may need ways to degrade extraction attempts without immediately revealing their defenses.","The article warns that businesses outside the frontier AI sector may still be exposed because API keys and service accounts connected to model access can become valuable targets."],"referencedReports":[{"title":"China-Based AI Companies Targeting U.S. AI Models via Industrial-Scale Knowledge Distillation","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-251a","publisher":"CISA, NSA, and FBI","context":"The article relies on this joint advisory for allegations that China-based AI companies conducted industrial-scale distillation against U.S. frontier AI models and for recommended mitigations.","category":"advisory","primary":true}],"body":"\u003cp\u003eU.S. cybersecurity and intelligence agencies accused China-based AI companies of conducting “systematic extraction” of proprietary capabilities from American frontier AI models through industrial-scale distillation attacks. The NSA, CISA, and FBI said the activity forms the core of those companies’ AI development strategy and targets models including Anthropic Claude, OpenAI GPT, Google Gemini, and SpaceXAI Grok. The advisory named DeepSeek, Moonshot AI, Alibaba, MiniMax, StepFun, and Z.AI as companies that allegedly extracted billions of tokens across millions of exchanges or requests since at least late 2024.\u003c/p\u003e\n\n\u003cp\u003eThe article says the campaigns use premium subscriptions shared across developer teams, APIs, remote cloud providers, third-party aggregators, obfuscated accounts, automated agents, and gray-market proxies to gain or hide access. The agencies described tactics such as chain-of-thought reasoning extraction, automated failover between pathways during blocking attempts, and quality evaluation frameworks to detect defensive countermeasures. Because U.S. frontier models are officially restricted and not offered in China, Chinese developers allegedly used alternative access methods to bypass geographic controls.\u003c/p\u003e\n\n\u003cp\u003eThe agencies warned that this activity can shorten AI development timelines and reduce the cost of training frontier models for the companies involved. They recommended that U.S. AI companies implement detection and mitigation measures, subtly alter responses for suspected malicious distillation attempts, and correlate activity across model providers, cloud platforms, and API aggregators. The article also notes similar concerns from Anthropic and Google Threat Intelligence Group, and quotes Arctic Wolf’s Ismael Valenzuela saying the issue is an abuse of legitimate access that can make API keys and service accounts valuable targets.\u003c/p\u003e\n"},{"n":41,"title":"Malicious Chrome and Firefox Extensions Steal Crypto Traders’ Session and Wallet Data","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/chrome-firefox-crypto-data-theft?utm_medium=feed","time":"21:40","priority":"SHOULD READ","score":83,"tldr":"Socket researchers found malicious Chrome and Firefox extensions targeting crypto traders by stealing authenticated Axiom Trade and Padre session tokens, wallet-related data, cookies, and app state, then exfiltrating it to attacker-controlled infrastructure. Users and organizations should block the listed extension IDs, revoke affected sessions, rotate credentials, and review trading and wallet activity for unauthorized access.","briefOverview":"\u003cp\u003eSocket Threat Research identified six Chrome and Firefox extensions connected by shared code, command-and-control infrastructure, publishing history, cloned crypto trading tools, marketplace artifacts, and targeting of Axiom Trade and Padre users. Four of the extensions, J7Tracker, VREO for Chrome, VREO for Firefox, and Orbit Tracker, are described as malicious because they collect authenticated session and wallet-related data from crypto traders. The Chrome listings were removed in July 2026, while Orbit Tracker later appeared on Mozilla Add-ons and remained live as of publication.\u003c/p\u003e\n\n\u003cp\u003eThe malicious J7Tracker and VREO extensions contain the same byte-identical module, vamp/axiom-fetch-intercept.js, which retrieves authenticated user information, wallet-related bundle data, Firebase access tokens, and application state. The code runs inside logged-in Axiom Trade and Padre sessions, checks browser storage and Firebase Auth persistence, and sends stolen data to threat actor-controlled Vercel infrastructure using browser navigation. Orbit Tracker uses different logic and infrastructure but targets the same distinctive Axiom data, including sBundles, bundleKey, authenticated user information, browser tokens, and cookies.\u003c/p\u003e\n\n\u003cp\u003eThe article says the campaign matters because it targets active trading communities handling substantial cryptocurrency volumes, including Axiom and Padre users. The malware does not require users to manually export credentials or wallet data after installation; once the targeted trading platform is open and the needed application state is available, collection occurs automatically. Socket recommends blocking the malicious extension IDs, revoking affected sessions and tokens, rotating credentials, reviewing wallet and trading activity, and hunting for listed infrastructure such as dcfdc-eight.vercel.app, snipex-iota.vercel.app, and susi.bonto.run.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket Threat Research identified six Chrome and Firefox extensions linked by shared code, command-and-control infrastructure, publishing history, cloned crypto trading tools, marketplace artifacts, and targeting of Axiom Trade and Padre users.","The Chrome extensions J7Tracker and VREO and the Firefox version of VREO contain a byte-identical malicious module that retrieves authenticated user information, wallet-related bundle data, Firebase access tokens, and application state, then sends it to threat actor-controlled Vercel deployments.","The Firefox extension Orbit Tracker appeared several weeks later with different malicious logic and infrastructure, but it targets the same Axiom data including sBundles, bundleKey, authenticated user information, browser tokens, and cookies.","The malicious extensions run inside authenticated Axiom Trade and Padre sessions and automatically collect session and wallet-related data without requiring users to intentionally export credentials or wallet information after installation.","The article recommends blocking confirmed malicious extension IDs, revoking affected Axiom Trade and Padre sessions and authentication tokens, rotating relevant credentials, reviewing wallet and trading activity, and hunting for listed infrastructure such as dcfdc-eight.vercel.app, snipex-iota.vercel.app, and susi.bonto.run."],"insights":["The malware used browser navigation rather than normal web requests to send stolen data, which made the destination less obvious from extension permission reviews and avoided controls that apply to fetch, XHR, and WebSocket traffic.","The same malicious Axiom and Padre collection module was byte-identical across J7Tracker, VREO for Chrome, and VREO for Firefox, making the listed SHA-256 hash and file path useful for detecting multiple extensions at once.","The article identifies behavior as a more durable detection point than marketplace listings because the actors can republish cloned or rebranded crypto extensions under new extension IDs and publisher accounts.","Preserving full URLs in DNS, proxy, browser, and EDR telemetry is especially important because the exfiltrated data is encoded directly into URL parameters or paths.","The Orbit Tracker extension opened axiom.trade when installed or updated, showing that the extension tried to bring victims into the targeted trading session where its collector could access valuable application data."],"referencedReports":[],"body":"\u003cp\u003eSocket Threat Research identified six Chrome and Firefox extensions connected by shared code, command-and-control infrastructure, publishing history, cloned crypto trading tools, marketplace artifacts, and targeting of Axiom Trade and Padre users. Four of the extensions, J7Tracker, VREO for Chrome, VREO for Firefox, and Orbit Tracker, are described as malicious because they collect authenticated session and wallet-related data from crypto traders. The Chrome listings were removed in July 2026, while Orbit Tracker later appeared on Mozilla Add-ons and remained live as of publication.\u003c/p\u003e\n\n\u003cp\u003eThe malicious J7Tracker and VREO extensions contain the same byte-identical module, vamp/axiom-fetch-intercept.js, which retrieves authenticated user information, wallet-related bundle data, Firebase access tokens, and application state. The code runs inside logged-in Axiom Trade and Padre sessions, checks browser storage and Firebase Auth persistence, and sends stolen data to threat actor-controlled Vercel infrastructure using browser navigation. Orbit Tracker uses different logic and infrastructure but targets the same distinctive Axiom data, including sBundles, bundleKey, authenticated user information, browser tokens, and cookies.\u003c/p\u003e\n\n\u003cp\u003eThe article says the campaign matters because it targets active trading communities handling substantial cryptocurrency volumes, including Axiom and Padre users. The malware does not require users to manually export credentials or wallet data after installation; once the targeted trading platform is open and the needed application state is available, collection occurs automatically. Socket recommends blocking the malicious extension IDs, revoking affected sessions and tokens, rotating credentials, reviewing wallet and trading activity, and hunting for listed infrastructure such as dcfdc-eight.vercel.app, snipex-iota.vercel.app, and susi.bonto.run.\u003c/p\u003e\n"},{"n":4,"title":"US says Chinese firms extracted billions of tokens from frontier AI models","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-says-chinese-firms-extracted-billions-of-tokens-from-frontier-ai-models/","time":"16:48","priority":"SHOULD READ","score":82,"tldr":"U.S. cyber and intelligence agencies say six Chinese AI companies extracted billions of tokens from U.S. frontier AI models through large-scale distillation attacks, likely with Chinese government awareness. The advisory urges AI providers to improve detection and response for abuse patterns such as shared fraudulent accounts, proxy routing, chain-of-thought extraction attempts, and coordinated provider switching.","briefOverview":"\u003cp\u003eU.S. cybersecurity and intelligence agencies say six Chinese AI companies conducted industrial-scale distillation attacks on American frontier AI models since at least late 2024. A joint advisory from CISA, NSA, and the FBI states that DeepSeek, Moonshot AI, Alibaba, MiniMax, StepFun, and Z.AI extracted billions of tokens through millions of requests from models from Anthropic, OpenAI, Google, and xAI. The agencies assess that the scale and sophistication of the operations indicate Chinese government awareness and say this approach is likely a core development strategy for the firms involved.\u003c/p\u003e\n\n\u003cp\u003eThe advisory explains that the companies allegedly distributed API requests across fraudulent or shared accounts, APIs, cloud services, aggregators, and “transfer station” proxies to bypass geographic restrictions, usage limits, and detection. Some prompts attempted to expose restricted chain-of-thought reasoning, while automated systems switched providers and checked whether defenders had degraded responses. The agencies said these tactics can shorten AI development timelines and reduce the financial cost of training a frontier model.\u003c/p\u003e\n\n\u003cp\u003eDeepSeek and Moonshot AI were identified as the top offenders, with alleged targeting of multiple Claude, GPT, Gemini, and Grok models. MiniMax was accused of targeting Claude, Gemini, and GPT models, while Alibaba and StepFun allegedly targeted Claude and GPT models, and Z.AI allegedly targeted GPT-5.5 and Claude Opus 4.8. The advisory recommends that AI companies improve behavioral and infrastructure-level detection, modify responses when distillation is suspected, and share intelligence about these campaigns with stakeholders.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA, NSA, and the FBI said six Chinese AI companies extracted billions of tokens through millions of requests from frontier AI models made by Anthropic, OpenAI, Google, and xAI.","The agencies identified DeepSeek, Moonshot AI, Alibaba, MiniMax, StepFun, and Z.AI as the companies involved in the alleged industrial-scale distillation activity since at least late 2024.","The advisory said the firms used methods such as fraudulent or shared accounts, cloud services, aggregators, and proxy routes to bypass geographic restrictions, usage limits, and detection.","Some prompts attempted to expose restricted chain-of-thought reasoning, and automated systems switched providers and checked whether defenders had degraded responses.","The advisory recommended that AI companies improve behavioral and infrastructure-level detection, modify responses when suspected distillation is detected, and share intelligence about these campaigns."],"insights":["The advisory treats distillation abuse as a behavioral and infrastructure-detection problem, highlighting signals such as new accounts immediately maxing out usage, continuous activity without human idle periods, and shared accounts accessed from many IP addresses or user agents.","The alleged campaigns did not rely on a single access path, as the article says the firms distributed requests across fraudulent or shared accounts, APIs, cloud services, aggregators, and “transfer station” proxies to avoid restrictions and detection.","The article identifies quality-checking by attackers as part of the activity, saying automated systems tested whether defenders had degraded responses and switched providers during blocking attempts.","DeepSeek and Moonshot AI were described as the top offenders because they allegedly targeted multiple Claude, GPT, Gemini, and Grok models, while the other named firms were tied to narrower sets of models."],"referencedReports":[{"title":"AA26-251A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-251a","publisher":"CISA, NSA, and FBI","context":"The article is based on a joint advisory stating that six Chinese AI companies conducted industrial-scale distillation attacks against U.S. frontier AI models.","category":"advisory","primary":true}],"body":"\u003cp\u003eU.S. cybersecurity and intelligence agencies say six Chinese AI companies conducted industrial-scale distillation attacks on American frontier AI models since at least late 2024. A joint advisory from CISA, NSA, and the FBI states that DeepSeek, Moonshot AI, Alibaba, MiniMax, StepFun, and Z.AI extracted billions of tokens through millions of requests from models from Anthropic, OpenAI, Google, and xAI. The agencies assess that the scale and sophistication of the operations indicate Chinese government awareness and say this approach is likely a core development strategy for the firms involved.\u003c/p\u003e\n\n\u003cp\u003eThe advisory explains that the companies allegedly distributed API requests across fraudulent or shared accounts, APIs, cloud services, aggregators, and “transfer station” proxies to bypass geographic restrictions, usage limits, and detection. Some prompts attempted to expose restricted chain-of-thought reasoning, while automated systems switched providers and checked whether defenders had degraded responses. The agencies said these tactics can shorten AI development timelines and reduce the financial cost of training a frontier model.\u003c/p\u003e\n\n\u003cp\u003eDeepSeek and Moonshot AI were identified as the top offenders, with alleged targeting of multiple Claude, GPT, Gemini, and Grok models. MiniMax was accused of targeting Claude, Gemini, and GPT models, while Alibaba and StepFun allegedly targeted Claude and GPT models, and Z.AI allegedly targeted GPT-5.5 and Claude Opus 4.8. The advisory recommends that AI companies improve behavioral and infrastructure-level detection, modify responses when distillation is suspected, and share intelligence about these campaigns with stakeholders.\u003c/p\u003e\n"},{"n":6,"title":"Over 36,000 exposed Plex servers vulnerable to recent flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/over-36-000-plex-servers-unpatched-against-recently-disclosed-flaws/","time":"10:11","priority":"SHOULD READ","score":82,"tldr":"Over 36,000 internet-exposed Plex Media Server instances are still running vulnerable versions despite Plex urging users to update immediately. Users should upgrade Plex Media Server to 1.43.3 and Plex Desktop to 1.115.0 before attackers reverse-engineer the fixes and exploit the flaws.","briefOverview":"\u003cp\u003eOver 36,000 internet-exposed Plex Media Server instances remain unpatched against multiple security vulnerabilities, according to Shadowserver. Plex urged users to secure their media servers immediately after releasing updates for Plex Media Server and Plex Desktop. The flaws affect Plex Media Server version 1.43.2 and earlier, and CVE IDs have been requested but have not yet been issued.\u003c/p\u003e\n\n\u003cp\u003ePlex advised server owners to upgrade Plex Media Server installations to version 1.43.3 and Plex Desktop users to update to version 1.115.0. The company said NAS users may not yet see the updated server version in their package manager and may need to install the package manually. Shadowserver said it has been scanning and reporting daily unpatched versions since 2026-09-04 and warned that the lack of CVEs makes the vulnerabilities less visible to the security community.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Plex has not shared details about the flaws, but users are urged to update before attackers reverse-engineer the patches and develop an exploit. It also cites past Plex security incidents, including CVE-2025-34158, which could be used to steal a server owner’s credentials, and CVE-2020-5741, a remote code execution flaw that CISA flagged as actively exploited. CVE-2020-5741 was likely used to hack a LastPass senior DevOps engineer’s computer, leading to a major 2022 data breach.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Shadowserver warned that over 36,000 internet-exposed Plex Media Server instances remain unpatched against multiple security vulnerabilities.","Plex said the security issues affect Plex Media Server version 1.43.2 and earlier, and advised server owners to upgrade to Plex Media Server 1.43.3.","Plex also recommended Plex Desktop users update to version 1.115.0, which was released on August 13.","Plex said CVEs have been requested for the vulnerabilities but have not yet been published.","The article notes that Plex previously warned users about CVE-2025-34158 in August 2025 and that CISA had flagged CVE-2020-5741 as actively exploited two years earlier."],"insights":["The absence of CVE IDs is limiting visibility for the security community, according to Shadowserver, even though tens of thousands of vulnerable Plex servers are exposed online.","Plex’s decision to email customers about patching is notable because the article says this has happened only a limited number of times, underscoring the urgency of the update.","Users running Plex Media Server on NAS devices may need to install the update manually because Plex said the patched version may not yet be available through NAS package managers.","The article highlights a real-world risk from delayed patching by citing a previously exploited Plex flaw that was likely used in the compromise of a LastPass senior DevOps engineer’s computer."],"referencedReports":[],"body":"\u003cp\u003eOver 36,000 internet-exposed Plex Media Server instances remain unpatched against multiple security vulnerabilities, according to Shadowserver. Plex urged users to secure their media servers immediately after releasing updates for Plex Media Server and Plex Desktop. The flaws affect Plex Media Server version 1.43.2 and earlier, and CVE IDs have been requested but have not yet been issued.\u003c/p\u003e\n\n\u003cp\u003ePlex advised server owners to upgrade Plex Media Server installations to version 1.43.3 and Plex Desktop users to update to version 1.115.0. The company said NAS users may not yet see the updated server version in their package manager and may need to install the package manually. Shadowserver said it has been scanning and reporting daily unpatched versions since 2026-09-04 and warned that the lack of CVEs makes the vulnerabilities less visible to the security community.\u003c/p\u003e\n\n\u003cp\u003eThe article notes that Plex has not shared details about the flaws, but users are urged to update before attackers reverse-engineer the patches and develop an exploit. It also cites past Plex security incidents, including CVE-2025-34158, which could be used to steal a server owner’s credentials, and CVE-2020-5741, a remote code execution flaw that CISA flagged as actively exploited. CVE-2020-5741 was likely used to hack a LastPass senior DevOps engineer’s computer, leading to a major 2022 data breach.\u003c/p\u003e\n"},{"n":24,"title":"DeepSeek Harness Flaw Let AI Agents Disable Their Own File Sandbox Without Approval","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/deepseek-harness-flaw-let-ai-agents.html","time":"11:17","priority":"SHOULD READ","score":82,"tldr":"DeepSeek fixed a critical DeepSeek Harness flaw that let a sandboxed AI coding agent disable its own file sandbox via the tool’s unauthenticated local web interface, enabling commands to run with full access without approval. Users should upgrade to 0.1.2-alpha.2 or later, or verify third-party desktop builds include the fix.","briefOverview":"\u003cp\u003eDeepSeek fixed a flaw in DeepSeek Harness, its open-source tool for running AI coding agents on a developer’s machine, that let a sandboxed agent disable its own file sandbox with a single command. The flaw is tracked as CVE-2026-82533, and VulnCheck rated it 9.4 out of 10. Versions 0.1.1-rc.2 and earlier are affected, and the first fixed release published to npm was 0.1.2-alpha.2.\u003c/p\u003e\n\n\u003cp\u003eThe issue involved the tool’s local web interface, which had no authentication in the affected release and relied on a client-supplied Host header rather than checking where the connection came from. OX Research said the agent could use the interface to switch its session to danger-full-access, turning off the sandbox and approval prompts. The article notes that the default sandbox limited file writes, but reads and network access were not confined, leaving the interface reachable from inside the sandbox.\u003c/p\u003e\n\n\u003cp\u003eDeepSeek’s fix added a one-time token at startup and a signed cookie requirement for calls to the interface. Users are advised to install 0.1.2-alpha.2 or later, check the harness version bundled in third-party desktop apps, and remove tunnels, proxies, or port forwards if they cannot upgrade. The article also says earlier community reports described the same escape in August, and that the project had no security policy file or published repository advisory when checked.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A flaw tracked as CVE-2026-82533 allowed a sandboxed DeepSeek Harness AI coding agent to disable its own file sandbox by calling the tool’s local web interface.","OX Research said a single shell command could switch the agent’s session to danger-full-access, which turns off the sandbox and stops approval prompts.","The affected interface had no authentication, and its trust check relied on the client-supplied Host header rather than the origin of the connection.","DeepSeek fixed the issue on August 27 by adding a one-time token and signed-cookie authentication requirement for calls to the web interface.","Versions 0.1.1-rc.2 and earlier are affected, and the first fixed release published to npm was 0.1.2-alpha.2."],"insights":["The CVE record names 0.1.2-alpha.1 as fixed, but the article says that release was not published to npm, making 0.1.2-alpha.2 the first fixed version available through the project’s documented npm installation path.","Restricting the interface to the local machine did not stop the sandbox escape because the agent was already running on the same machine and could reach the interface itself.","The default sandbox only limited file writes, while reads and network access were not confined, which left the tool’s own local interface reachable from inside the agent’s environment.","Users who installed DeepSeek Harness through third-party desktop wrappers need to check the bundled harness version because those wrappers ship their own copy and may lag behind the fixed release.","Community members described the same escape on DeepSeek’s discussion board before the CVE existed, but the project still had no security policy file or published repository security advisory when the article was checked."],"referencedReports":[{"title":"DeepSeek Harness Alpha.1 Authentication Bypass via Host Header Spoofing","url":"https://www.vulncheck.com/advisories/deepseek-harness-alpha-1-authentication-bypass-via-host-header-spoofing","publisher":"VulnCheck","context":"The article says VulnCheck published the CVE-2026-82533 record on September 8 and rated the flaw 9.4 out of 10.","category":"advisory","primary":true},{"title":"CVE-2026-82533: DeepSeek Harness AI Agent Sandbox Escape","url":"https://www.ox.security/blog/cve-2026-82533-deepseek-harness-ai-agent-sandbox-escape/","publisher":"OX Research","context":"The article cites OX Research as the security firm that reported the flaw and described the one-command sandbox escape.","category":"research","primary":true},{"title":"DeepSeek Harness discussion report #250","url":"https://github.com/deepseek-ai/deepseek-harness/discussions/250","publisher":"DeepSeek Harness community","context":"The article says a developer posted this August 13 report showing a sandboxed process reaching the local interface and switching the session to danger-full-access.","category":"research","primary":false},{"title":"DeepSeek Harness discussion report #853","url":"https://github.com/deepseek-ai/deepseek-harness/discussions/853","publisher":"DeepSeek Harness community","context":"The article says another developer posted this August 14 report on the same interface, listing requests it accepted without credentials.","category":"research","primary":false}],"body":"\u003cp\u003eDeepSeek fixed a flaw in DeepSeek Harness, its open-source tool for running AI coding agents on a developer’s machine, that let a sandboxed agent disable its own file sandbox with a single command. The flaw is tracked as CVE-2026-82533, and VulnCheck rated it 9.4 out of 10. Versions 0.1.1-rc.2 and earlier are affected, and the first fixed release published to npm was 0.1.2-alpha.2.\u003c/p\u003e\n\n\u003cp\u003eThe issue involved the tool’s local web interface, which had no authentication in the affected release and relied on a client-supplied Host header rather than checking where the connection came from. OX Research said t
