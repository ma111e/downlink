<script type="application/json" id="dl-articles">[{"n":4,"title":"GoldenEyeDog Subgroup Linked to DigiCert Breach and Code-Signing Certificate Theft","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/goldeneyedog-subgroup-linked-to.html","time":"16:39","priority":"MUST READ","score":94,"tldr":"Researchers attributed DigiCert’s April 2026 breach to CylindricalCanine, a GoldenEyeDog subgroup that compromised support analyst workstations via a malicious “screenshot” file and stole EV code-signing certificate access. The attackers used the certificates to sign Golden Gh0st RAT/Zhong Stealer malware, highlighting the risk of certificate abuse in malware delivery.","briefOverview":"\u003cp\u003eCybersecurity researchers at Expel attributed the April 2026 DigiCert security incident to CylindricalCanine, a subgroup of GoldenEyeDog, also known as APT-Q-27, Dragon Breath, and Miuuti Group. DigiCert said the threat actor contacted its support team through a customer chat channel and delivered a ZIP file disguised as a customer screenshot, which contained a malicious .scr executable. The attackers gained access to two support analyst workstations and used a customer-support portal function to access initialization codes for approved but pending EV Code Signing certificate orders.\u003c/p\u003e\n\n\u003cp\u003eDigiCert revoked 60 certificates issued by several certificate authorities, and 27 of them were explicitly linked to the threat actor. The article says the stolen or abused certificates were used to sign Zhong Stealer malware artifacts, helping the malware appear more trustworthy. DigiCert said the issue stemmed from a threat model that did not account for initialization codes being visible to a compromised support analyst account through the portal function.\u003c/p\u003e\n\n\u003cp\u003eExpel said CylindricalCanine commonly distributes files disguised as screenshots through phishing emails or support-portal submissions. The attack chain uses a link to download additional payloads, triggers DLL side-loading through a legitimate executable, displays a decoy PDF with an HTTP 503 error, and then loads an encrypted payload. The final malware, Golden Gh0st RAT, can set up persistence, steal sensitive data, create a SOCKS proxy tunnel, log keystrokes, take screenshots, execute shell commands, drop more payloads, and clear Windows Event logs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Expel attributed the April 2026 DigiCert security incident to CylindricalCanine, described as a subgroup of the Chinese cybercrime group GoldenEyeDog, also known as APT-Q-27, Dragon Breath, and Miuuti Group.","DigiCert said the threat actor contacted its support team through a customer chat channel on April 2, 2026, and delivered a ZIP file disguised as a customer screenshot that contained a malicious .scr executable.","The attackers compromised two DigiCert support analyst workstations and used a customer-support portal function to access initialization codes for approved but pending EV Code Signing certificate orders across a finite set of customer accounts.","DigiCert revoked 60 fraudulently obtained certificates, including 27 explicitly linked to the threat actor, and the exploited certificates were used to sign Zhong Stealer malware artifacts.","Expel said CylindricalCanine’s attack chain uses phishing files disguised as screenshots, DLL side-loading, and Golden Gh0st RAT, which can steal data, log keystrokes, take screenshots, execute shell commands, and clear Windows Event logs."],"insights":["DigiCert said the critical weakness was not certificate issuance approval itself, but that initialization codes visible inside an internal support portal were functionally sufficient, together with approved orders, to obtain EV Code Signing certificates.","The incident shows that customer support channels can become a direct path into high-value internal systems, because the initial payload was delivered through a customer chat interaction rather than a conventional email-only phishing route.","CylindricalCanine’s use of decoy screenshot-themed files and a fake HTTP 503 PDF indicates the attack chain was designed to look like a normal support troubleshooting exchange while malware executed in the background.","DigiCert’s mitigation focused on masking initialization codes from proxied users in both the UI and API, showing that sensitive support-portal data exposure can matter as much as account compromise in certificate abuse scenarios."],"referencedReports":[{"title":"Introducing CylindricalCanine","url":"https://expel.com/blog/introducing-cylindricalcanine/","publisher":"Expel","context":"The article cites Expel’s analysis as the source attributing the April 2026 DigiCert incident to CylindricalCanine and describing the actor’s malware and attack chain.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers at Expel attributed the April 2026 DigiCert security incident to CylindricalCanine, a subgroup of GoldenEyeDog, also known as APT-Q-27, Dragon Breath, and Miuuti Group. DigiCert said the threat actor contacted its support team through a customer chat channel and delivered a ZIP file disguised as a customer screenshot, which contained a malicious .scr executable. The attackers gained access to two support analyst workstations and used a customer-support portal function to access initialization codes for approved but pending EV Code Signing certificate orders.\u003c/p\u003e\n\n\u003cp\u003eDigiCert revoked 60 certificates issued by several certificate authorities, and 27 of them were explicitly linked to the threat actor. The article says the stolen or abused certificates were used to sign Zhong Stealer malware artifacts, helping the malware appear more trustworthy. DigiCert said the issue stemmed from a threat model that did not account for initialization codes being visible to a compromised support analyst account through the portal function.\u003c/p\u003e\n\n\u003cp\u003eExpel said CylindricalCanine commonly distributes files disguised as screenshots through phishing emails or support-portal submissions. The attack chain uses a link to download additional payloads, triggers DLL side-loading through a legitimate executable, displays a decoy PDF with an HTTP 503 error, and then loads an encrypted payload. The final malware, Golden Gh0st RAT, can set up persistence, steal sensitive data, create a SOCKS proxy tunnel, log keystrokes, take screenshots, execute shell commands, drop more payloads, and clear Windows Event logs.\u003c/p\u003e\n"},{"n":5,"title":"New NadMesh Botnet Hunts Exposed AI Services for Cloud Keys and Kubernetes Tokens","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-nadmesh-botnet-hunts-exposed-ai.html","time":"17:12","priority":"MUST READ","score":92,"tldr":"The new Go-based NadMesh botnet is scanning exposed AI and developer services to steal AWS keys, Kubernetes tokens, Docker credentials, and model/tool access rather than just hijacking compute. Organizations running ComfyUI, Ollama, n8n, Gradio, MCP, Docker, Jenkins, Redis, or similar services should remove them from the public internet, enforce authentication, check persistence paths, and revoke exposed credentials.","briefOverview":"\u003cp\u003eA Go botnet called \u003cstrong\u003eNadMesh\u003c/strong\u003e appeared in early July and is scanning exposed AI services such as ComfyUI, Ollama, n8n, Open WebUI, Langflow, and Gradio. QiAnXin’s XLab named the malware after the “n4d mesh controller” string in its source and published analysis of the botnet, its operator panel, and observed traffic. The operator’s dashboard claimed 3,811 unique AWS keys, while XLab’s sensors saw distinct source IPs pushing NadMesh rise to around 139 per day in the first week of July.\u003c/p\u003e\n\n\u003cp\u003eThe article says NadMesh is primarily after cloud and platform access rather than the infected host itself. It collects cloud keys from environment variables, Kubernetes service account tokens, and files including \u003ccode\u003e~/.aws/config\u003c/code\u003e, \u003ccode\u003e.env\u003c/code\u003e, and \u003ccode\u003e~/.docker/config.json\u003c/code\u003e. XLab’s observed exploit traffic was led by Docker API remote code execution at 30.31% and Jenkins script console remote code execution at 22.28%, while MCP command execution appeared at 0.78%.\u003c/p\u003e\n\n\u003cp\u003eNadMesh uses adaptive scanning, repeatedly prioritizing subnets and IPs that previously produced hits and blacklisting targets that absorb ten deployment attempts without returning results. The article says the agent persists in three ways, uses Garble obfuscation, UPX packing, and random padding, and therefore does not share one stable hash across builds. It advises operators to place exposed services behind authentication or remove them from the public internet, check specified drop paths, isolate infected hosts, and revoke credentials the host could access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["QiAnXin’s XLab reported that the Go botnet NadMesh appeared in early July and is scanning exposed AI services including ComfyUI, Ollama, n8n, Open WebUI, Langflow, and Gradio.","NadMesh collects cloud keys from environment variables, Kubernetes service account tokens, and files such as ~/.aws/config, .env, and ~/.docker/config.json.","The operator’s dashboard claimed 3,811 unique AWS keys, while XLab observed distinct source IPs pushing NadMesh rise to about 139 per day in the first week of July.","XLab’s observed exploit traffic was led by docker_containers_api_rce at 30.31% and jenkins_scripttext_rce at 22.28%, while mcp_cmd_execute appeared in the smaller unlabeled tail at 0.78%.","The article advises operators of exposed services to place them behind authentication or remove them from the public internet, check listed persistence paths, isolate infected hosts, and revoke credentials the host could access."],"insights":["NadMesh’s own dashboard metrics are internally inconsistent, so XLab’s sensor data and observed exploit traffic provide a more reliable view than the operator’s claimed bot counts or success totals.","Although NadMesh is positioned around exposed AI services, XLab’s traffic chart shows most observed exploit attempts still target Docker APIs and Jenkins consoles, with MCP command execution accounting for only 0.78% of observed traffic.","The botnet’s success scoring explicitly excludes Ollama and AWS harvesting, meaning the operator’s scoreboard does not count some of the most important data the campaign is stealing.","The article emphasizes that credential revocation alone is insufficient because NadMesh uses three persistence methods, so new credentials could be stolen again if the host is not cleaned first.","NadMesh’s scanning logic prioritizes networks and hosts that previously produced results, while blacklisting targets that absorb repeated deployment attempts without response as suspected honeypots."],"referencedReports":[{"title":"NadMesh Botnet Analysis: A Product-Grade Threat for the AI Service Era","url":"https://blog.xlab.qianxin.com/nadmesh-botnet-analysis-a-product-grade-threat-for-the-ai-service-era-en/","publisher":"QiAnXin XLab","context":"The article is based heavily on XLab’s report naming and analyzing the NadMesh botnet, its dashboard, scanning behavior, exploit traffic, persistence, and indicators.","category":"","primary":false},{"title":"MCP Servers on the Internet","url":"https://censys.com/blog/mcp-servers-on-the-internet/","publisher":"Censys","context":"The article cites Censys’s MCP census for counts of reachable MCP services and services advertising command-running tools.","category":"","primary":false},{"title":"ComfyUI Servers: Cryptomining Proxy Botnet","url":"https://censys.com/blog/comfyui-servers-cryptomining-proxy-botnet/","publisher":"Censys","context":"The article references Censys’s earlier findings about exposed ComfyUI instances being used for GPU mining and proxy infrastructure.","category":"","primary":false}],"body":"\u003cp\u003eA Go botnet called \u003cstrong\u003eNadMesh\u003c/strong\u003e appeared in early July and is scanning exposed AI services such as ComfyUI, Ollama, n8n, Open WebUI, Langflow, and Gradio. QiAnXin’s XLab named the malware after the “n4d mesh controller” string in its source and published analysis of the botnet, its operator panel, and observed traffic. The operator’s dashboard claimed 3,811 unique AWS keys, while XLab’s sensors saw distinct source IPs pushing NadMesh rise to around 139 per day in the first week of July.\u003c/p\u003e\n\n\u003cp\u003eThe article says NadMesh is primarily after cloud and platform access rather than the infected host itself. It collects cloud keys from environment variables, Kubernetes service account tokens, and files including \u003ccode\u003e~/.aws/config\u003c/code\u003e, \u003ccode\u003e.env\u003c/code\u003e, and \u003ccode\u003e~/.docker/config.json\u003c/code\u003e. XLab’s observed exploit traffic was led by Docker API remote code execution at 30.31% and Jenkins script console remote code execution at 22.28%, while MCP command execution appeared at 0.78%.\u003c/p\u003e\n\n\u003cp\u003eNadMesh uses adaptive scanning, repeatedly prioritizing subnets and IPs that previously produced hits and blacklisting targets that absorb ten deployment attempts without returning results. The article says the agent persists in three ways, uses Garble obfuscation, UPX packing, and random padding, and therefore does not share one stable hash across builds. It advises operators to place exposed services behind authentication or remove them from the public internet, check specified drop paths, isolate infected hosts, and revoke credentials the host could access.\u003c/p\u003e\n"},{"n":2,"title":"HollowByte DDoS flaw bloats OpenSSL server memory with 11-byte payload","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hollowbyte-ddos-flaw-bloats-openssl-server-memory-with-11-byte-payload/","time":"17:56","priority":"SHOULD READ","score":88,"tldr":"OpenSSL has quietly fixed a DoS flaw called HollowByte that lets unauthenticated attackers bloat server memory using an 11-byte TLS handshake payload. Organizations should update OpenSSL packages to the fixed versions as soon as possible, especially on servers using software like NGINX or Apache.","briefOverview":"\u003cp\u003eA vulnerability dubbed HollowByte allows unauthenticated attackers to trigger a denial-of-service condition on OpenSSL servers with a malicious payload of just 11 bytes. The OpenSSL team has fixed the issue without assigning an identifier and has backported the patch to older releases. Because OpenSSL is widely used for secure internet communication, the article says organizations should prioritize moving to a fixed version.\u003c/p\u003e\n\n\u003cp\u003eOkta’s Red Team explained that vulnerable OpenSSL versions allocate memory based on the declared length in a TLS handshake message before receiving and checking the payload. An attacker can open a TLS connection and send a small malicious input whose header claims that a much larger message body will follow. Repeating this across many connections can force the server to allocate significant memory while the worker thread waits for data that never arrives.\u003c/p\u003e\n\n\u003cp\u003eOkta said glibc may keep freed small-to-medium allocations for reuse instead of immediately returning them to the operating system, which can leave the server bloated even after connections drop. In Okta’s NGINX tests, low-capacity environments could be depleted of memory, while higher-spec servers could lose up to 25% of memory with attack bandwidth below security alerting thresholds. The issue is fixed in OpenSSL 4.0.1 and backported to 3.6.3, 3.5.7, 3.4.6, and 3.0.21, which grow the buffer only when data arrives.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A vulnerability dubbed HollowByte allows unauthenticated attackers to trigger a denial-of-service condition on OpenSSL servers with a malicious payload of just 11 bytes.","Vulnerable OpenSSL versions allocate memory based on the declared length in a TLS handshake header before receiving and validating the payload.","Okta researchers said repeated connections with randomized claimed sizes can cause heap fragmentation and make a server’s Resident Set Size climb continuously, even after the attacker disconnects.","The open-source OpenSSL library is embedded in software including NGINX, Apache web servers, Node.js, Python, Ruby, PHP, MySQL, and PostgreSQL.","The issue has been fixed in OpenSSL 4.0.1 and backported to versions 3.6.3, 3.5.7, 3.4.6, and 3.0.21."],"insights":["The attack can remain below security alerting thresholds while still causing higher-spec servers to lose up to 25% of their memory.","Restarting the affected process is the only way to fully reclaim memory once the server remains bloated after the attack.","The issue was treated as a hardening fix rather than a security vulnerability, but Okta still recommends immediate upgrades to distribution OpenSSL packages.","glibc’s memory handling can worsen the impact because it may keep freed small-to-medium allocations for reuse instead of immediately returning them to the operating system."],"referencedReports":[{"title":"OpenSSL HollowByte: A DoS hiding in 11 bytes","url":"https://sec.okta.com/articles/2026/06/openssl-hollowbtye-a-dos-hiding-in-11-bytes/","publisher":"Okta","context":"The article cites Okta’s Red Team advisory as the source describing how the HollowByte denial-of-service vulnerability works and its real-world impact.","category":"","primary":false}],"body":"\u003cp\u003eA vulnerability dubbed HollowByte allows unauthenticated attackers to trigger a denial-of-service condition on OpenSSL servers with a malicious payload of just 11 bytes. The OpenSSL team has fixed the issue without assigning an identifier and has backported the patch to older releases. Because OpenSSL is widely used for secure internet communication, the article says organizations should prioritize moving to a fixed version.\u003c/p\u003e\n\n\u003cp\u003eOkta’s Red Team explained that vulnerable OpenSSL versions allocate memory based on the declared length in a TLS handshake message before receiving and checking the payload. An attacker can open a TLS connection and send a small malicious input whose header claims that a much larger message body will follow. Repeating this across many connections can force the server to allocate significant memory while the worker thread waits for data that never arrives.\u003c/p\u003e\n\n\u003cp\u003eOkta said glibc may keep freed small-to-medium allocations for reuse instead of immediately returning them to the operating system, which can leave the server bloated even after connections drop. In Okta’s NGINX tests, low-capacity environments could be depleted of memory, while higher-spec servers could lose up to 25% of memory with attack bandwidth below security alerting thresholds. The issue is fixed in OpenSSL 4.0.1 and backported to 3.6.3, 3.5.7, 3.4.6, and 3.0.21, which grow the buffer only when data arrives.\u003c/p\u003e\n"},{"n":1,"title":"Ernst \u0026 Young discloses data breach after support system hack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ernst-and-young-discloses-data-breach-after-support-system-hack/","time":"14:55","priority":"SHOULD READ","score":82,"tldr":"Ernst \u0026 Young is notifying clients after attackers compromised a third-party support ticket system used by its IT staff and downloaded documents that may contain tax-related personal and financial data. EY says it has removed the unauthorized access and is offering affected clients 24 months of Experian identity monitoring.","briefOverview":"\u003cp\u003eErnst \u0026amp; Young is notifying customers of a data breach caused by the compromise of a third-party support ticket system used by its IT personnel. The company said support tickets submitted through the platform may have included documents containing client tax information. EY is one of the world’s four largest auditing and professional services providers, with operations in more than 150 countries.\u003c/p\u003e\n\n\u003cp\u003eEY said it detected anomalous activity on its networks on April 23 and began an investigation with external cybersecurity experts. The investigation found that an unauthorized third party accessed the support platform between March 28 and April 12 and downloaded multiple documents. The affected information included certain personal and financial data contained in or used to prepare tax filings, but the exact data types remain unclear because the notification sample includes a placeholder.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed how many customers were affected or whether the incident affects only U.S. customers or customers in other countries. EY said it secured its systems, notified federal law enforcement, removed the unauthorized access, and is not aware of misuse or further exposure of the stolen files. The company is offering affected clients 24 months of identity monitoring and restoration service through Experian, with enrollment available until October 31, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ernst \u0026 Young is notifying customers of a data breach caused by the compromise of a third-party support ticket system used by its IT personnel.","The company determined that an unauthorized third party accessed the platform between March 28 and April 12 and downloaded multiple documents.","The affected information included certain personal and financial data contained in or used to prepare tax filings, but the specific data types remain unclear.","Ernst \u0026 Young has not disclosed how many customers were affected or whether the incident impacts only U.S. customers or customers in other countries as well.","EY says it secured its systems, notified federal law enforcement, and is offering affected clients 24 months of identity monitoring and restoration service through Experian."],"insights":["The unauthorized access ended on April 12, but EY detected anomalous network activity on April 23, showing the investigation identified earlier activity in the third-party support platform.","The breach involved support tickets, which can contain sensitive client documents even when the system is not primarily described as a tax filing platform.","EY’s notification sample uses a placeholder for the specific exposed data types, so affected clients may need their individual notices to know what personal or financial information was involved.","Affected clients have a specific deadline of October 31, 2026, to enroll in the 24 months of Experian identity monitoring and restoration services."],"referencedReports":[],"body":"\u003cp\u003eErnst \u0026amp; Young is notifying customers of a data breach caused by the compromise of a third-party support ticket system used by its IT personnel. The company said support tickets submitted through the platform may have included documents containing client tax information. EY is one of the world’s four largest auditing and professional services providers, with operations in more than 150 countries.\u003c/p\u003e\n\n\u003cp\u003eEY said it detected anomalous activity on its networks on April 23 and began an investigation with external cybersecurity experts. The investigation found that an unauthorized third party accessed the support platform between March 28 and April 12 and downloaded multiple documents. The affected information included certain personal and financial data contained in or used to prepare tax filings, but the exact data types remain unclear because the notification sample includes a placeholder.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed how many customers were affected or whether the incident affects only U.S. customers or customers in other countries. EY said it secured its systems, notified federal law enforcement, removed the unauthorized access, and is not aware of misuse or further exposure of the stolen files. The company is offering affected clients 24 months of identity monitoring and restoration service through Experian, with enrollment available until October 31, 2026.\u003c/p\u003e\n"},{"n":3,"title":"Inside the Search for \"Clean\" Residential Proxies for Carding","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/inside-the-search-for-clean-residential-proxies-for-carding/","time":"14:00","priority":"MAY READ","score":55,"tldr":"Carders increasingly view residential proxies as only one fragile part of a broader fraud stack, prioritizing “clean” IP history, precise location matching, and consistency with device and identity signals. Defenders should not trust residential traffic by itself and should focus on cross-session inconsistencies, velocity, fingerprints, and payment behavior.","briefOverview":"\u003cp\u003eFlare researchers analyzed 2,889 unique underground posts from the past two years across about 545 discussion threads to understand how carders use and evaluate residential proxies. The article says residential IP addresses remain important to carders, but they are no longer seen as a reliable bypass on their own. Carders increasingly separate proxy pools into “clean” and “dirty” based on address history, prior use against fraud-sensitive services, and changing reputation scores.\u003c/p\u003e\n\n\u003cp\u003eThe discussions show that carders are trying to build a coherent digital identity rather than simply hide their real IP address. Recent posts describe matching proxy location with billing ZIP code, city, time zone, operating-system language, browser characteristics, cookies, device fingerprints, and transaction behavior. The article also says residential proxies are often paired with antidetect browsers, WebRTC configuration, Canvas and WebGL fingerprints, and user-agent consistency.\u003c/p\u003e\n\n\u003cp\u003eSeveral posts complain that proxy providers restrict access to banks, payment processors, government portals, and other fraud-sensitive services, creating demand for services advertised as “finance enabled” or “bank compatible.” The article cites the July 2026 seizure of domains tied to the NetNut residential proxy platform and Popa botnet, as well as a March 2026 FBI alert about criminals using residential proxies for account takeover. For defenders, the article says residential traffic should be treated as context rather than proof of legitimacy, with stronger attention paid to consistency across device history, account age, browser fingerprint, payment information, billing details, transaction velocity, and behavior after checkout.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Flare researchers analyzed 2,889 unique underground posts from the past two years across about 545 discussion threads to study how carders use and evaluate residential proxies.","Carders increasingly distinguish between “clean” and “dirty” residential proxy pools based on an IP address’s history and reputation, especially whether it has been used against banks, payment processors, or other fraud-sensitive services.","Recent underground discussions describe attempts to match proxy location with stolen identity details such as billing ZIP code, city, time zone, device language, and browser characteristics.","The article says residential proxies are frequently combined with antidetect browsers, isolated devices, cookie history, WebRTC configuration, Canvas and WebGL fingerprints, and user-agent consistency.","Defenders are advised not to treat residential IP addresses as inherently trustworthy and instead to evaluate consistency across device history, account age, browser fingerprint, payment instrument, billing information, transaction velocity, and post-checkout behavior."],"insights":["Criminal discussions indicate that proxy reputation can deteriorate quickly because the behavior of other customers using the same proxy infrastructure can affect whether an address is treated as high risk.","Restrictions by major proxy providers on access to banks and payment processors are creating demand in underground markets for services advertised as “finance enabled” or “bank compatible.”","Some carders view proxy provider restrictions as evidence that those proxy pools may be cleaner because they have not been repeatedly used against financial institutions.","The loss of ZIP-code targeting from some residential proxy providers is seen by carders as a meaningful operational problem because city-level matching may not be precise enough to avoid fraud controls.","The article suggests defenders are already increasing the cost of carding because criminals are spending more effort resolving conflicting reputation scores and aligning granular identity signals."],"referencedReports":[{"title":"Evading Residential Proxy Networks: Protecting Your Devices from Becoming a Tool for Criminals","url":"https://www.fbi.gov/investigate/cyber/alerts/2026/evading-residential-proxy-networks-protecting-your-devices-from-becoming-a-tool-for-criminals","publisher":"FBI","context":"The article cites a March 2026 FBI alert warning that criminals can select residential proxy addresses by state and city and use them for account takeover, including matching a victim’s city to avoid bank geolocation controls.","category":"","primary":false}],"body":"\u003cp\u003eFlare researchers analyzed 2,889 unique underground posts from the past two years across about 545 discussion threads to understand how carders use and evaluate residential proxies. The article says residential IP addresses remain important to carders, but they are no longer seen as a reliable bypass on their own. Carders increasingly separate proxy pools into “clean” and “dirty” based on address history, prior use against fraud-sensitive services, and changing reputation scores.\u003c/p\u003e\n\n\u003cp\u003eThe discussions show that carders are trying to build a coherent digital identity rather than simply hide their real IP address. Recent posts describe matching proxy location with billing ZIP code, city, time zone, operating-system language, browser characteristics, cookies, device fingerprints, and transaction behavior. The article also says residential proxies are often paired with antidetect browsers, WebRTC configuration, Canvas and WebGL fingerprints, and user-agent consistency.\u003c/p\u003e\n\n\u003cp\u003eSeveral posts complain that proxy providers restrict access to banks, payment processors, government portals, and other fraud-sensitive services, creating demand for services advertised as “finance enabled” or “bank compatible.” The article cites the July 2026 seizure of domains tied to the NetNut residential proxy platform and Popa botnet, as well as a March 2026 FBI alert about criminals using residential proxies for account takeover. For defenders, the article says residential traffic should be treated as context rather than proof of legitimacy, with stronger attention paid to consistency across device history, account age, browser fingerprint, payment information, billing details, transaction velocity, and behavior after checkout.\u003c/p\u003e\n"},{"n":6,"title":"Top Pentera alternatives for automated penetration testing","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/pentera-alternatives","time":"16:17","priority":"MAY READ","score":40,"tldr":"Pentera is strong for automated infrastructure and network security validation, but it does not deeply test application and API logic where many fast-moving engineering teams now face the most risk. The article positions Aikido Security as the best alternative for AI-driven application-layer pentesting, while Horizon3 NodeZero is framed as the closest direct alternative for infrastructure-focused testing.","briefOverview":"\u003cp\u003eThe article compares Pentera with several alternatives for automated penetration testing, arguing that Pentera is strong for infrastructure, internal networks, external attack surfaces, and cloud identity paths. It says Pentera is useful for validating whether tools such as EDR, SIEM, and network controls block expected attacks. The central limitation identified is that Pentera does not deeply test the application and API layer, including issues such as IDORs, business logic flaws, broken access controls, and multi-step authenticated workflow problems.\u003c/p\u003e\n\n\u003cp\u003eThe article says this gap matters because many organizations now deploy significant software changes weekly or faster, while far fewer validate security on every release. It cites Aikido’s 2026 State of AI in Pentesting report to argue that security testing often misses application flaws or becomes outdated by the time findings arrive. The article presents application and API testing as especially important for engineering-led organizations that ship code frequently.\u003c/p\u003e\n\n\u003cp\u003eAikido Security is presented as the top alternative for teams that need application and API-layer AI pentesting, using autonomous agents, white-box testing, exploit confirmation, and pull requests for fixes. Horizon3 NodeZero is described as the closest direct competitor to Pentera for infrastructure and network-focused automated pentesting. Other alternatives discussed include XBOW, Hadrian, RunSybil, Terra, and Astra, each positioned around different strengths such as app-layer testing, external attack surface management, black-box testing, human-in-the-loop governance, or scanner-based testing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Pentera is described as an automated security validation platform focused on infrastructure, internal networks, external attack surfaces, and cloud identity paths, with strengths in Active Directory attack chains, credential abuse, lateral movement, and privilege escalation.","The article says Pentera does not deeply test application and API business logic issues such as IDORs, broken access controls, BOLA, or multi-step authenticated workflow flaws.","The article argues that application and API testing matters because many organizations deploy significant changes weekly or faster, while only a smaller share validate security on every release.","Aikido Security is presented as the strongest alternative for teams needing application and API-layer AI pentesting with autonomous agents, white-box testing, exploit confirmation, and pull requests for fixes.","Horizon3 NodeZero is described as the closest direct competitor to Pentera for teams seeking infrastructure and network-focused automated pentesting."],"insights":["The article suggests that teams may need to pair tools rather than replace Pentera outright, using Pentera for infrastructure validation and a separate application-focused platform such as Aikido for app and API risk.","The article highlights a mismatch between software release speed and security validation, citing that 76% of organizations deploy significant changes weekly or faster while only 21% validate security on every release.","The article frames white-box AI pentesting as especially actionable for finding access-control flaws because agents can inspect routes, controllers, and permission models before testing instead of guessing from the outside.","The article notes that even within infrastructure-focused automated pentesting, Pentera may be less suitable for some teams because its licensing is built around IP counts and domain minimums, which can force smaller organizations to buy more capacity than they need.","The article distinguishes between AI-assisted testing and agentic AI testing, arguing that Pentera’s pre-written attack techniques with AI-adapted payloads are different from autonomous agents that reason through targets and chain weaknesses without a predefined playbook."],"referencedReports":[],"body":"\u003cp\u003eThe article compares Pentera with several alternatives for automated penetration testing, arguing that Pentera is strong for infrastructure, internal networks, external attack surfaces, and cloud identity paths. It says Pentera is useful for validating whether tools such as EDR, SIEM, and network controls block expected attacks. The central limitation identified is that Pentera does not deeply test the application and API layer, including issues such as IDORs, business logic flaws, broken access controls, and multi-step authenticated workflow problems.\u003c/p\u003e\n\n\u003cp\u003eThe article says this gap matters because many organizations now deploy significant software changes weekly or faster, while far fewer validate security on every release. It cites Aikido’s 2026 State of AI in Pentesting report to argue that security testing often misses application flaws or becomes outdated by the time findings arrive. The article presents application and API testing as especially important for engineering-led organizations that ship code frequently.\u003c/p\u003e\n\n\u003cp\u003eAikido Security is presented as the top alternative for teams that need application and API-layer AI pentesting, using autonomous agents, white-box testing, exploit confirmation, and pull requests for fixes. Horizon3 NodeZero is described as the closest direct competitor to Pentera for infrastructure and network-focused automated pentesting. Other alternatives discussed include XBOW, Hadrian, RunSybil, Terra, and Astra, each positioned around different strengths such as app-layer testing, external attack surface management, black-box testing, human-in-the-loop governance, or scanner-based testing.\u003c/p\u003e\n"},{"n":7,"title":"Black Hat Asia 2026: Cleartext Cookie Exposure | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/black-hat-asia-2026-cleartext-cookie-exposure","time":"14:30","priority":"MAY READ","score":25,"tldr":"Corelight is highlighting cleartext cookie exposure at Black Hat Asia 2026, underscoring the risk of sensitive session data being transmitted or observed without proper protection.","briefOverview":"\u003cp\u003eThe article is titled “Black Hat Asia 2026: Cleartext Cookie Exposure | Corelight.” The title identifies Black Hat Asia 2026, cleartext cookie exposure, and Corelight as the main named elements. The provided article body does not contain readable prose that explains the event, findings, or context.\u003c/p\u003e\n\n\u003cp\u003eNo specific affected organization, product, system, or user group is identified in the readable text. No technical details are provided beyond the phrase “cleartext cookie exposure” in the title. The article text also does not state any impact, mitigation, recommendation, or linked third-party report.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “Black Hat Asia 2026: Cleartext Cookie Exposure | Corelight.”","The article references Black Hat Asia 2026 in its title.","The article references cleartext cookie exposure in its title.","The article references Corelight in its title."],"insights":["The provided article body is not readable prose, so it does not support extracting actionable technical details beyond the title.","The readable content does not identify affected organizations, affected technologies, technical evidence, or recommended mitigations."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Black Hat Asia 2026: Cleartext Cookie Exposure | Corelight.” The title identifies Black Hat Asia 2026, cleart
