<script type="application/json" id="dl-articles">[{"n":3,"title":"Drupal warns of new site takeover flaw exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/drupal-warns-of-new-access-bypass-flaw-exploited-in-attacks/","time":"10:10","priority":"MUST READ","score":96,"tldr":"Drupal warns that attackers are actively exploiting CVE-2026-136716 to take over sites left in vulnerable installer states, including some production deployments. Administrators should immediately update to the fixed Drupal releases or block access to /core/install.php and investigate potential compromise.","briefOverview":"\u003cp\u003eDrupal has warned that attackers are actively exploiting CVE-2026-136716, a critical flaw that can allow vulnerable websites to be taken over. The issue affects sites in unusual or incomplete installation states, including production sites, and may not be apparent through the Drupal user interface. Drupal also cautioned that sites already compromised might no longer appear to be in the vulnerable state.\u003c/p\u003e\n\n\u003cp\u003eThe flaw addresses attack paths left after Drupal patched the earlier CVE-2026-132165 remote code execution issue, which attackers began exploiting one day after patches were released. Administrators should upgrade to Drupal 10.6.23, 11.3.23, or 11.4.14, or block access to \u003ccode\u003e/core/install.php\u003c/code\u003e if an immediate upgrade is not possible. Drupal recommends confirming control of the user 1 email address, reviewing logs for unexpected user 1 account activity, and following its compromise-response guidance where needed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Drupal says CVE-2026-136716 is being exploited in the wild to take over sites in unusual or incomplete installation states, including production sites.","The flaw addresses attack paths left unpatched after Drupal fixed the earlier CVE-2026-132165 remote code execution issue.","Drupal warns that sites which left their installer remotely accessible after the earlier advisory may already have been compromised.","Administrators should upgrade to Drupal 10.6.23, 11.3.23, or 11.4.14, or block access to /core/install.php if they cannot upgrade immediately.","Drupal advises site owners to verify control of the user 1 email address, review logs for unexpected user 1 account activity, and follow its incident-response guidance if compromise is suspected."],"insights":["A site can be in the affected state without that being visible in Drupal’s user interface, making ordinary visual checks insufficient.","Drupal warns that a site already taken over may no longer appear vulnerable, so applying the fix does not by itself rule out an earlier compromise.","The earlier Drupal flaw began to be exploited one day after patches were released, illustrating the short time administrators may have to apply critical updates.","For organizations unable to update immediately, blocking access to /core/install.php is a specific temporary measure Drupal recommends for both new and existing sites."],"referencedReports":[{"title":"SA-CORE-2026-019","url":"https://www.drupal.org/sa-core-2026-019","publisher":"drupal","context":"Drupal’s security advisory states that sites in certain unusual or incomplete installation states remain vulnerable to takeover and that the issue is being exploited in the wild.","category":"advisory","primary":true},{"title":"Your Drupal site got hacked: Now what?","url":"https://www.drupal.org/docs/develop/security/your-drupal-site-got-hacked-now-what","publisher":"drupal","context":"The article directs administrators to this Drupal guide if they find signs that their site may have been compromised.","category":"guide","primary":false}],"body":"\u003cp\u003eDrupal has warned that attackers are actively exploiting CVE-2026-136716, a critical flaw that can allow vulnerable websites to be taken over. The issue affects sites in unusual or incomplete installation states, including production sites, and may not be apparent through the Drupal user interface. Drupal also cautioned that sites already compromised might no longer appear to be in the vulnerable state.\u003c/p\u003e\n\n\u003cp\u003eThe flaw addresses attack paths left after Drupal patched the earlier CVE-2026-132165 remote code execution issue, which attackers began exploiting one day after patches were released. Administrators should upgrade to Drupal 10.6.23, 11.3.23, or 11.4.14, or block access to \u003ccode\u003e/core/install.php\u003c/code\u003e if an immediate upgrade is not possible. Drupal recommends confirming control of the user 1 email address, reviewing logs for unexpected user 1 account activity, and following its compromise-response guidance where needed.\u003c/p\u003e\n"},{"n":2,"title":"SAP confirms security incident after suspicious GitHub activity","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/sap-confirms-security-incident-after-suspicious-github-activity/","time":"09:56","priority":"SHOULD READ","score":84,"tldr":"SAP confirmed suspicious activity in its IT environment and says it acted to protect customers, while reporting no evidence so far that customer business data was accessed. Reports indicate attackers may have used stolen employee GitHub tokens to copy and modify SAP source code.","briefOverview":"\u003cp\u003eSAP confirmed that it identified suspicious activity in its IT environment and said it promptly took measures to protect customers and preserve the security of its services. The company said its investigation had found no evidence of unauthorized access to customer business data. SAP did not disclose the affected environments or provide further details when asked.\u003c/p\u003e\n\n\u003cp\u003eDer Spiegel, citing an internal SAP memo, reported that the company tracked the cyberattack as “Project Granite” and instructed employees to keep details confidential. Sources cited by the outlet said attackers may have breached SAP’s GitHub environment by stealing employee authentication tokens, which were allegedly used to copy and modify SAP source code. SAP has not said whether customers downloading code from its GitHub repositories, or using updates connected to them, need to take action.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP confirmed that it identified suspicious activity in its IT environment and implemented measures intended to protect customers and secure its services.","SAP said its investigation had found no evidence of unauthorized access to customer business data.","Der Spiegel reported that SAP tracked the incident under the code name “Project Granite” and that attackers may have breached SAP’s GitHub environment.","According to insider sources cited by Der Spiegel, attackers allegedly stole SAP employee authentication tokens and used them to copy and modify SAP source code on GitHub.","SAP did not disclose which environments were affected or whether customers using code or updates connected to its GitHub repositories should take action."],"insights":["SAP’s statement distinguishes between protecting customer business data and the reported compromise of its source-code environment, leaving the status of code obtained through or connected to its GitHub repositories undisclosed.","The reported use of stolen employee authentication tokens means the alleged activity could have occurred through valid employee access credentials rather than an openly disclosed software flaw.","SAP declined to identify the affected environments or advise whether customers should act, despite reports that source code was copied and modified.","The incident emerged alongside a German government warning about agentic AI tools and reports from Switzerland and Italy of large-scale AI-driven attacks against critical infrastructure organizations."],"referencedReports":[{"title":"SAP wird Opfer von Hackerangriff","url":"https://www.spiegel.de/netzwelt/sap-wird-opfer-von-hackerangriff-a-6648b5ce-5d74-48dc-86ea-9469705bb91d","publisher":"der-spiegel","context":"Der Spiegel reported, based on an internal SAP memo, that SAP was hit by a cyberattack tracked as Project Granite and that its GitHub environment may have been breached.","category":"news","primary":true},{"title":"Public warning on agentic AI tools","url":"https://www.bsi.bund.de/DE/Service-Navi/Presse/Pressemitteilungen/Presse2026/261126_agentische-KI.html","publisher":"federal-office-for-information-security","context":"Germany's Federal Office for Information Security warned organizations about agentic AI tools that can enable cyberattacks and urged incident-response and security-strengthening measures.","category":"advisory","primary":false}],"body":"\u003cp\u003eSAP confirmed that it identified suspicious activity in its IT environment and said it promptly took measures to protect customers and preserve the security of its services. The company said its investigation had found no evidence of unauthorized access to customer business data. SAP did not disclose the affected environments or provide further details when asked.\u003c/p\u003e\n\n\u003cp\u003eDer Spiegel, citing an internal SAP memo, reported that the company tracked the cyberattack as “Project Granite” and instructed employees to keep details confidential. Sources cited by the outlet said attackers may have breached SAP’s GitHub environment by stealing employee authentication tokens, which were allegedly used to copy and modify SAP source code. SAP has not said whether customers downloading code from its GitHub repositories, or using updates connected to them, need to take action.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft pushes emergency hotpatch to fix Windows Server crashes","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/new-out-of-band-oob-emergency-hotpatch-fixes-windows-server-2025-crashes/","time":"09:08","priority":"SHOULD READ","score":78,"tldr":"Microsoft released emergency out-of-band hotpatch KB5138318 for Windows Server 2025 to fix 0x139 crashes affecting some servers with Router Advertisement enabled when time-limited IPv6 routes expire. The update installs automatically for affected hotpatch-enrolled systems and requires no restart.","briefOverview":"\u003cp\u003eMicrosoft released emergency out-of-band hotpatch KB5138318 to fix Windows Server 2025 crashes linked to November 2026 security hotpatch KB5131077. The issue affects a limited number of servers with Router Advertisement enabled that receive time-bound IPv6 routes. When a route timer expires, affected devices can stop unexpectedly with error 0x139, identified as KERNEL_SECURITY_CHECK_FAILURE.\u003c/p\u003e\n\n\u003cp\u003eKB5138318 is rolling out through Windows Update to affected Windows Server 2025 devices enrolled in hotpatch updates. It downloads and installs automatically and takes effect without requiring administrators or users to restart systems. Microsoft also reported separate November 2026 hotpatch problems on Windows 11, including app installation and launch issues and printing issues on systems using Forcepoint\u0026rsquo;s DLP Endpoint Agent.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft released out-of-band hotpatch KB5138318 to address Windows Server 2025 stop errors with code 0x139 after the November 2026 security hotpatch update.","The crashes affect a limited number of Windows Server 2025 devices with Router Advertisement enabled that receive time-bound IPv6 routes, occurring when a route timer expires.","KB5138318 is rolling out through Windows Update to affected Windows Server 2025 devices enrolled in hotpatch updates and takes effect without a restart.","Microsoft said November 2026 hotpatch updates also caused application installation and launch issues on Windows 11 and printing issues on systems using Forcepoint's DLP Endpoint Agent."],"insights":["The server crash condition is tied specifically to expiry of temporary IPv6 routes on systems with Router Advertisement enabled, rather than affecting all Windows Server 2025 deployments.","The emergency fix is delivered through the hotpatch update channel and applies without a reboot, which allows affected enrolled servers to receive the correction without planned downtime.","Microsoft's November 2026 hotpatch updates have produced separate problems across both Windows Server 2025 and Windows 11, including application and printing issues in addition to the server crashes."],"referencedReports":[{"title":"Windows Message Center update 5097","url":"https://learn.microsoft.com/en-us/windows/release-health/windows-message-center#5097","publisher":"microsoft","context":"Microsoft's message center update states that an out-of-band update was released to address Windows Server 2025 crashes involving expiring time-bound IPv6 routes.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft released emergency out-of-band hotpatch KB5138318 to fix Windows Server 2025 crashes linked to November 2026 security hotpatch KB5131077. The issue affects a limited number of servers with Router Advertisement enabled that receive time-bound IPv6 routes. When a route timer expires, affected devices can stop unexpectedly with error 0x139, identified as KERNEL_SECURITY_CHECK_FAILURE.\u003c/p\u003e\n\n\u003cp\u003eKB5138318 is rolling out through Windows Update to affected Windows Server 2025 devices enrolled in hotpatch updates. It downloads and installs automatically and takes effect without requiring administrators or users to restart systems. Microsoft also reported separate November 2026 hotpatch problems on Windows 11, including app installation and launch issues and printing issues on systems using Forcepoint\u0026rsquo;s DLP Endpoint Agent.\u003c/p\u003e\n"},{"n":5,"title":"Aikido's external network pentest found 31 issues vs 13 for ARTEX","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/aikido-vs-artex","time":"08:00","priority":"MAY READ","score":48,"tldr":"Aikido claims its external network pentest found 31 issues, including 11 critical findings, in a controlled comparison with ARTEX, which found 13 issues and two critical findings. The vendor argues that Aikido provides stronger validation, safer production testing, and easier setup than the open-source AI pentesting tool.","briefOverview":"\u003cp\u003eAikido compared its external network pentest with ARTEX, an open-source AI pentesting tool, in the same internally built test environment. Aikido reported 31 findings, including 11 critical findings, while ARTEX reported 13 findings, including two critical findings. The article states that both tools were run from outside the environment against the same targets, with ARTEX using DeepSeek V4.1 Flash.\u003c/p\u003e\n\n\u003cp\u003eThe tools both identified five issues, including unauthenticated customer-data access, exposed credentials in a public file share, and access to another customer’s workspace. Aikido says it additionally found issues involving reused darknet credentials, trial-issued AWS IAM credentials, publicly accessible S3 backups containing Tomcat Manager credentials, unauthenticated GraphQL endpoints, and anonymous access to customer export files. The article argues that Aikido validates and reproduces findings with evidence before reporting them, while ARTEX labeled its findings unverified, and says organizations should be cautious about relying on ARTEX as their only external pentest.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido says its external network pentest identified 31 findings, including 11 rated critical, while ARTEX identified 13 findings, including two rated critical, in the same internal test environment.","Both tools reported five of the same issues, including customer data available through an API without login, a public file share exposing credentials, and access to another customer’s workspace.","Aikido reported additional findings involving reused darknet-sourced credentials, AWS IAM credentials returned by a trial signup flow, public S3 backup files containing Tomcat Manager credentials, and unauthenticated customer-data endpoints.","ARTEX reported a Next.js middleware bypass, access to a quarterly report, and Host-header reflection findings that Aikido did not flag.","The article states that Aikido requires concrete evidence for findings that other agents validate and reproduce, while ARTEX labeled its findings unverified."],"insights":["The comparison found that detecting a potentially exposed Azure storage access token was not enough on its own: ARTEX reported the token, while Aikido tested the external endpoint and confirmed that it could access the storage container.","Several of Aikido’s additional findings chained exposed information into demonstrated access, such as using credentials from a public S3 backup to authenticate to Tomcat Manager and using trial-issued AWS credentials to access finance logs.","ARTEX required the operator to provide targets and all testing instructions, whereas Aikido says it can begin with one verified domain and discover related public-facing hosts itself.","The article notes that a reported backdoored ARTEX Docker image means organizations running the open-source tool need to verify the copy they use, in addition to reviewing its unverified findings."],"referencedReports":[{"title":"FBI IC3 Cybersecurity Advisory 261113","url":"https://www.ic3.gov/CSA/2026/261113.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article cites an FBI advisory stating that criminals have been using ARTEX and references weaknesses it says criminals use the tool against.","category":"advisory","primary":false},{"title":"CSA Research Note: Trojanized Offensive AI Tooling","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-trojanized-offensive-ai-tooling-20261106-c/","publisher":"cloud-security-alliance","context":"The article cites this research note for the reported existence of a backdoored ARTEX Docker image.","category":"research","primary":false}],"body":"\u003cp\u003eAikido compared its external network pentest with ARTEX, an open-source AI pentesting tool, in the same internally built test environment. Aikido reported 31 findings, including 11 critical findings, while ARTEX reported 13 findings, including two critical findings. The article states that both tools were run from outside the environment against the same targets, with ARTEX using DeepSeek V4.1 Flash.\u003c/p\u003e\n\n\u003cp\u003eThe tools both identified five issues, including unauthenticated customer-data access, exposed credentials in a public file share, and access to another customer’s workspace. Aikido says it additionally found issues involving reused darknet credentials, trial-issued AWS IAM credentials, publicly accessible S3 backups containing Tomcat Manager credentials, unauthenticated GraphQL endpoints, and anonymous access to customer export files. The article argues that Aikido validates and reproduces findings with evidence before reporting them, while ARTEX labeled its findings unverified, and says organizations should be cautious about relying on ARTEX as their only external pentest.\u003c/p\u003e\n"},{"n":6,"title":"Health-ISAC Daily Cyber Headlines – November 27, 2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-daily-cyber-headlines-november-27-2026/","time":"09:48","priority":"MAY READ","score":40,"tldr":"Health-ISAC’s daily briefing highlights escalating threats to healthcare and pharmaceutical organizations, including active exploitation of a critical Juniper flaw, Gh0stRAT campaigns, and risks from malicious use of AI and cloud-connected medical devices.","briefOverview":"\u003cp\u003eHealth-ISAC’s November 27, 2026 Daily Cyber Headlines briefing compiles open-source reporting on threats relevant to the health sector. Topics include escalating cyber threats against pharmaceutical drug research, vaccine development, and manufacturing, as well as a data breach involving Gleneagles Hospital Hong Kong. The briefing also covers risks associated with cloud-connected medical devices and their potential effects on patient care, safety, and compliance.\u003c/p\u003e\n\n\u003cp\u003eThe roundup highlights Silver Fox actors using fake software downloads to distribute Gh0stRAT, which can spy on PCs. It also reports that a critical Juniper Session Smart Conductor flaw is being actively exploited in attacks. Additional coverage addresses malicious adoption of Microsoft’s ARTEX AI framework and the European Union’s proposed Quantum Act, which is intended to strengthen industrial capabilities, secure supply chains, and advance post-quantum readiness.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Health-ISAC’s November 27, 2026 daily briefing covers cyber threats affecting pharmaceutical research, vaccine development, and manufacturing.","The briefing includes a report that Gleneagles Hospital Hong Kong’s eHealth registration was suspended after a data breach.","The roundup includes reporting on Silver Fox actors using fake software downloads to distribute Gh0stRAT, which can spy on PCs.","Health-ISAC highlights active attacks exploiting a critical flaw in Juniper Session Smart Conductor.","The briefing also covers malicious use of the ARTEX AI framework, cloud-connected medical-device risks, and the European Union’s proposed Quantum Act."],"insights":["The briefing links cyber risk across the healthcare ecosystem, from hospital registration systems and connected medical devices to pharmaceutical research, vaccine development, and manufacturing.","The reported Juniper Session Smart Conductor issue is especially urgent because the article says it is being actively exploited in attacks, rather than merely identified as a flaw.","The inclusion of fake software downloads distributing Gh0stRAT shows that PC surveillance threats are being delivered through software users may believe is legitimate.","The roundup pairs immediate incidents and technical threats with longer-term policy and technology issues, including malicious use of an AI framework and the European Union’s proposed Quantum Act."],"referencedReports":[],"body":"\u003cp\u003eHealth-ISAC’s November 27, 2026 Daily Cyber Headlines briefing compiles open-source reporting on threats relevant to the health sector. Topics include escalating cyber threats against pharmaceutical drug research, vaccine development, and manufacturing, as well as a data breach involving Gleneagles Hospital Hong Kong. The briefing also covers risks associated with cloud-connected medical devices and their potential effects on patient care, safety, and compliance.\u003c/p\u003e\n\n\u003cp\u003eThe roundup highlights Silver Fox actors using fake software downloads to distribute Gh0stRAT, which can spy on PCs. It also reports that a critical Juniper Session Smart Conductor flaw is being actively exploited in attacks. Additional coverage addresses malicious adoption of Microsoft’s ARTEX AI framework and the European Union’s proposed Quantum Act, which is intended to strengthen industrial capabilities, secure supply chains, and advance post-quantum readiness.\u003c/p\u003e\n"},{"n":4,"title":"Black Friday + Cyber Monday: 50% off AI external network pentests","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/black-friday-cyber-monday-50-off-ai-external-network-pentests","time":"10:17","priority":"MAY READ","score":18,"tldr":"Aikido Security is offering 50% off its AI-driven external network pentests through December 1, with automated testing of internet-facing assets for exploitable CVEs, misconfigurations, exposed secrets, and leaked credentials.","briefOverview":"\u003cp\u003eAikido Security is offering a 50% discount on its AI external network pentests through Tuesday, December 1, for new and existing users who launch a qualifying assessment between November 26 and December 1. The discount is applied automatically, and pricing is based on the number of publicly accessible assets found under a customer’s domain. Aikido says around 87% of bugs are exploited on or before the day they become public, compared with 23% in 2020, making internet-facing systems a priority.\u003c/p\u003e\n\n\u003cp\u003eCustomers enter a root domain, and Aikido’s agents identify subdomains and internet-facing systems, test open ports for known CVEs, configuration errors, exposed secrets, and leaked credentials, and attempt to use proven access to reach further systems. The service returns proof of each successful finding, steps to reproduce it, an attack-chain view, remediation guidance, and an exportable audit-ready report. It covers publicly reachable websites, APIs, VPN gateways, mail servers, and self-hosted tools, while excluding systems available only within an organization’s network and third-party services hosted on its subdomains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Aikido Security is offering a 50% discount on external network pentests launched between November 26 and December 1, with the discount applied automatically.","The service identifies subdomains and internet-facing systems under a supplied root domain, then tests open ports for known CVEs, configuration mistakes, exposed secrets, and leaked credentials.","The pentest report includes proof for each successful finding, reproduction steps, the full path used to gain further access, remediation guidance, and an exportable audit report.","The assessment covers internet-reachable systems such as websites, APIs, VPN gateways, mail servers, and self-hosted tools, but excludes systems accessible only inside the organization’s network and third-party services.","Aikido says fixed findings can be retested at no additional cost for six months after the pentest."],"insights":["The article says that around 87% of bugs are exploited on or before the day they become public, compared with 23% in 2020, underscoring the shrinking time available to address exposed systems.","The testing is designed to follow successful access from one system to another, producing an attack-chain view rather than only a list of isolated issues.","Aikido states that automated agents stop after proving access and require approval before going deeper, while a panic button can halt all agents immediately.","Pricing is based on the number of publicly accessible assets found beneath a domain, and the exact price is shown before the test begins."],"referencedReports":[],"body":"\u003cp\u003eAikido Security is offering a 50% discount on its AI external network pentests through Tuesday, December 1, for new and existing users who launch a qualifying assessment between November 26 and December 1. The discount is applied automatically, and pricing is based on the number of publicly accessible assets found under a customer’s domain. Aikido says around 87% of bugs are exploited on or before the day they become public, compared with 23% in 2020, making internet-facing systems a priority.\u003c/p\u003e\n\n\u003cp\u003eCustomers enter a root domain, and Aikido’s agents identify subdomains and internet-facing systems, test open ports for known CVEs, configuration errors, exposed secrets, and leaked credentials, and attempt to use proven access to reach further systems. The service returns proof of each successful finding, steps to reproduce it, an attack-chain view, remediation guidance, and an exportable audit-ready report. It covers publicly reachable websites, APIs, VPN gateways, mail servers, and self-hosted tools, while excluding systems available only within an organization’s network and third-party services hosted on its subdomains.\u003c/p\u003e\n"}]</script>

  border-color:rgba(127,127,127,.4)}
#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
