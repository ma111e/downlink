<script type="application/json" id="dl-articles">[{"n":2,"title":"The Sender Domain You Never Audit Is Your Own","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/own-domain-sender-history-reveals-self-spoof-identity-rotation","time":"11:00","priority":"MAY READ","score":68,"tldr":"A UK property consultancy was targeted by a sustained self-spoofing phishing campaign that rotated through employees’ identities and used bodyless Word attachments containing QR codes to evade conventional email inspection. The key defensive lesson is to audit your own domain’s sender history and correlate structural signals—such as external self-addressed mail and attachment-only MIME messages—rather than relying on individual sender blocks, payload verdicts, or authentication alone.","briefOverview":"\u003cp\u003eA UK property consultancy found 15 incidents when it queried its own domain as though it were an external sender. Ten were automatically resolved phishing incidents involving self-spoofed employee identities between May and August 2026, rotating across eight mailboxes. The messages used varied HR and payroll pretexts, so each individual impersonated sender appeared to be a first occurrence.\u003c/p\u003e\n\n\u003cp\u003eThe worked example was a self-addressed spoof email with no message body, where the entire top-level MIME entity was a Word document attachment. The document contained two QR codes that decoded to the same URL on a Brazilian website path, ending with the recipient’s corporate email address in cleartext. SPF, DKIM, and DMARC checks failed at the real sending hop, but the message still reached the mailbox, while the attachment and QR-derived links received clean automated verdicts. The article argues that grouping messages by claimed domain and examining structural signals, including externally originated self-addressed mail and attachment-only messages, can reveal campaigns that sender blocks, content checks, and reputation scoring may not aggregate.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A sender-history query for the UK property consultancy’s own domain found 15 incidents, including 10 automatically resolved phishing incidents involving self-spoofed employee identities between May and August 2026.","The worked example was a self-addressed spoofed email with no message body; its top-level MIME entity was a Word document containing two QR codes that both decoded to the same URL.","The email failed SPF, had no DKIM signature, and failed DMARC at the real sending hop, yet it was still delivered to the recipient’s mailbox.","The campaign rotated through eight distinct real employee mailboxes and used varying HR and payroll-themed subjects, limiting the usefulness of blocking a single spoofed sender or matching one subject line.","The article recommends querying and grouping an organization’s own sender domain by claimed domain and counting distinct impersonated mailboxes to identify aggregate self-spoofing patterns."],"insights":["A message can evade body-focused inspection entirely when the email itself is a Word attachment with no text or HTML message body, making the absence of a body a useful warning sign.","The QR-code destination used a legitimate Brazilian website and was graded clean, illustrating that reputation at a site’s main address may not identify a phishing kit hosted deeper in its directories.","The claimed HELO name of [127.0.0.1] was not evidence of a local sender because the actual peer was a routable ColoCrossing host; the distinction between a claimed hostname and the real connecting IP is important.","Grouping suspicious messages by the claimed company domain, rather than by individual spoofed employee addresses, exposed identity rotation across eight mailboxes that would otherwise appear as unrelated first-time spoofs.","The tenant also had legitimate internal service messages reported as impersonation attempts, showing that real self-spoofs and mistaken reports can coexist within the same internal email namespace without evidence that one caused the other."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s statistics on phishing as an initial access vector and the overall human element in breaches.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article references Microsoft’s report as supporting email authentication as a structural phishing defense.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article cites CISA’s phishing guidance alongside Microsoft’s report in discussing authentication-based defenses.","category":"guide","primary":false}],"body":"\u003cp\u003eA UK property consultancy found 15 incidents when it queried its own domain as though it were an external sender. Ten were automatically resolved phishing incidents involving self-spoofed employee identities between May and August 2026, rotating across eight mailboxes. The messages used varied HR and payroll pretexts, so each individual impersonated sender appeared to be a first occurrence.\u003c/p\u003e\n\n\u003cp\u003eThe worked example was a self-addressed spoof email with no message body, where the entire top-level MIME entity was a Word document attachment. The document contained two QR codes that decoded to the same URL on a Brazilian website path, ending with the recipient’s corporate email address in cleartext. SPF, DKIM, and DMARC checks failed at the real sending hop, but the message still reached the mailbox, while the attachment and QR-derived links received clean automated verdicts. The article argues that grouping messages by claimed domain and examining structural signals, including externally originated self-addressed mail and attachment-only messages, can reveal campaigns that sender blocks, content checks, and reputation scoring may not aggregate.\u003c/p\u003e\n"},{"n":1,"title":"Anthropic asks Claude users to share voice data for AI model training","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/artificial-intelligence/anthropic-asks-claude-users-to-share-voice-data-for-ai-model-training/","time":"10:53","priority":"MAY READ","score":64,"tldr":"Anthropic is asking Claude voice-feature users to voluntarily allow audio recordings and voice chat data to be used for AI training. The separate voice-data setting is off by default and can be changed or deleted later in Privacy settings.","briefOverview":"\u003cp\u003eAnthropic has started asking Claude users who use voice features to voluntarily permit the use of their voice data for AI model training. The prompt says that audio recordings and voice chat data can help Anthropic’s models understand and respond to speech. Users can select either “Allow” or “Not now.”\u003c/p\u003e\n\n\u003cp\u003eThe voice-data permission is managed through a separate option in Claude’s Settings \u0026gt; Privacy area. It is distinct from Anthropic’s existing setting for using regular chats and Claude Code sessions for training, allowing users to choose different preferences for voice and text-based activity. The setting shown in the article is disabled by default, and Anthropic says users can later turn it off or delete voice data through settings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anthropic has begun asking Claude users to voluntarily allow voice recordings and voice chat data to be used to improve its AI models.","Users can choose “Allow” or “Not now,” and a separate voice-data option is available under Claude’s Settings and Privacy section.","The voice-data training setting is disabled by default in the interface described in the article.","Voice-data training is separate from Anthropic’s setting for using regular chats and Claude Code sessions for model training.","Anthropic says users can turn off the voice-data option and delete their voice data later through settings."],"insights":["Claude treats voice conversations as a separate data-sharing category from written chats and Claude Code sessions, allowing users to make different choices for each.","The voice-data setting is disabled by default, so users are not automatically enrolled in sharing recordings for model improvement.","Anthropic states that users can later withdraw permission and delete voice data through Claude’s settings."],"referencedReports":[],"body":"\u003cp\u003eAnthropic has started asking Claude users who use voice features to voluntarily permit the use of their voice data for AI model training. The prompt says that audio recordings and voice chat data can help Anthropic’s models understand and respond to speech. Users can select either “Allow” or “Not now.”\u003c/p\u003e\n\n\u003cp\u003eThe voice-data permission is managed through a separate option in Claude’s Settings \u0026gt; Privacy area. It is distinct from Anthropic’s existing setting for using regular chats and Claude Code sessions for training, allowing users to choose different preferences for voice and text-based activity. The setting shown in the article is disabled by default, and Anthropic says users can later turn it off or delete voice data through settings.\u003c/p\u003e\n"}]</script>
