<script type="application/json" id="dl-articles">[{"n":4,"title":"CISA: Microsoft SharePoint RCE flaw now actively exploited","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-microsoft-sharepoint-rce-flaw-now-actively-exploited/","time":"10:52","priority":"MUST READ","score":94,"tldr":"CISA says attackers are now actively exploiting CVE-2026-45659, a Microsoft SharePoint remote code execution flaw that lets low-privileged authenticated users run code on vulnerable servers. Federal agencies have been ordered to patch by Saturday, and exposed SharePoint servers should be updated urgently.","briefOverview":"\u003cp\u003eCISA warned that attackers have begun exploiting CVE-2026-45659, a high-severity Microsoft SharePoint remote code execution vulnerability. The flaw stems from deserialization of untrusted data and can allow low-privileged authenticated attackers to execute arbitrary code on unpatched SharePoint servers. Microsoft says the attack can be carried out over the network, has low complexity, and does not require user interaction.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft released security updates for SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition on May 21. The company said the CVE had been accidentally omitted from the May 2026 Security Updates. Shadowserver is tracking over 10,000 SharePoint servers exposed online, though the article says there is no information on how many have been secured against the ongoing attacks.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-45659 to its Known Exploited Vulnerabilities Catalog and ordered Federal Civilian Executive Branch agencies to secure their servers by Saturday under Binding Operational Directive 26-04. The directive requires agencies to prioritize patching based on factors including KEV inclusion, internet exposure, automation potential, and the level of control successful exploitation grants attackers. Since 2021, CISA has tagged 11 Microsoft SharePoint vulnerabilities abused in the wild, seven of which were also exploited in ransomware attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that attackers have begun exploiting CVE-2026-45659, a high-severity Microsoft SharePoint remote code execution vulnerability.","Microsoft says the flaw stems from deserialization of untrusted data and allows an authenticated attacker with minimum Site Member permissions to execute code remotely on SharePoint Server without user interaction.","Microsoft released security updates for SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition on May 21 after the CVE was accidentally omitted from the May 2026 Security Updates.","CISA added CVE-2026-45659 to its Known Exploited Vulnerabilities Catalog and ordered Federal Civilian Executive Branch agencies to secure their servers by Saturday under Binding Operational Directive 26-04.","Shadowserver is tracking over 10,000 SharePoint servers exposed online, but the article says there is no information on how many have been secured against ongoing CVE-2026-45659 attacks."],"insights":["The flaw is especially actionable for defenders because exploitation does not require administrator access; Microsoft says a user with only minimum Site Member permissions can trigger it remotely.","The patching timeline is unusually urgent for U.S. federal civilian agencies because BOD 26-04 requires action by Saturday after CISA added the flaw to the KEV catalog.","The exposure risk is broad but uncertain: Shadowserver sees more than 10,000 SharePoint servers online, yet the article says there is no information on how many are already patched against the active attacks.","SharePoint has a repeated history of real-world abuse, with CISA tagging 11 exploited Microsoft SharePoint vulnerabilities since 2021 and seven of them also used in ransomware attacks."],"referencedReports":[{"title":"CVE-2026-45659 Microsoft SharePoint Server Remote Code Execution Vulnerability","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-45659","publisher":"Microsoft","context":"The article cites Microsoft's vulnerability page for the flaw description, exploit requirements, affected SharePoint versions, and released security updates.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2026-45659","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-45659","publisher":"CISA","context":"The article says CISA added CVE-2026-45659 to its Known Exploited Vulnerabilities Catalog and ordered federal civilian agencies to secure affected servers.","category":"","primary":false},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/01/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article references CISA's alert warning that this type of vulnerability is frequently used by malicious cyber actors and poses risks to the federal enterprise.","category":"","primary":false}],"body":"\u003cp\u003eCISA warned that attackers have begun exploiting CVE-2026-45659, a high-severity Microsoft SharePoint remote code execution vulnerability. The flaw stems from deserialization of untrusted data and can allow low-privileged authenticated attackers to execute arbitrary code on unpatched SharePoint servers. Microsoft says the attack can be carried out over the network, has low complexity, and does not require user interaction.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft released security updates for SharePoint Enterprise Server 2016, SharePoint Server 2019, and SharePoint Server Subscription Edition on May 21. The company said the CVE had been accidentally omitted from the May 2026 Security Updates. Shadowserver is tracking over 10,000 SharePoint servers exposed online, though the article says there is no information on how many have been secured against the ongoing attacks.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-45659 to its Known Exploited Vulnerabilities Catalog and ordered Federal Civilian Executive Branch agencies to secure their servers by Saturday under Binding Operational Directive 26-04. The directive requires agencies to prioritize patching based on factors including KEV inclusion, internet exposure, automation potential, and the level of control successful exploitation grants attackers. Since 2021, CISA has tagged 11 Microsoft SharePoint vulnerabilities abused in the wild, seven of which were also exploited in ransomware attacks.\u003c/p\u003e\n"},{"n":13,"title":"AI Agent Exploits Langflow RCE to Automate Database Ransomware Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ai-agent-exploits-langflow-rce-to.html","time":"09:13","priority":"MUST READ","score":94,"tldr":"Sysdig says an AI agent dubbed JADEPUFFER autonomously exploited an unpatched Langflow RCE, stole credentials, pivoted through exposed services, and destroyed a production database in a ransomware-style extortion attempt. The key lesson is that neglected internet-facing AI tools, config stores, and databases are now easy targets for automated agents chaining old vulnerabilities at scale.","briefOverview":"\u003cp\u003eSysdig says it found what it believes is the first ransomware attack run from start to finish by an AI agent, which it calls JADEPUFFER. The agent allegedly handled the full chain of activity, including breaking in, stealing credentials, moving deeper into the network, and encrypting and wiping a company’s production database. The article says this matters because it lowers the skill needed to run a ransomware-style operation to the cost of renting an AI agent.\u003c/p\u003e\n\n\u003cp\u003eThe entry point was CVE-2025-3248, an already-patched Langflow flaw that allowed unauthenticated remote Python code execution on reachable servers. After gaining access, the agent searched for API keys, cloud credentials, crypto wallet keys, and database logins, and it accessed a MinIO server that still used the default minioadmin:minioadmin login. It then pivoted to a separate internet-facing MySQL and Nacos server, used root database access, abused CVE-2021-29441 and a default Nacos signing key, and created its own admin account.\u003c/p\u003e\n\n\u003cp\u003eThe agent encrypted 1,342 Nacos settings, dropped original tables, deleted whole databases, and left a ransom note demanding Bitcoin, but Sysdig says the encryption key was printed once and never saved or sent anywhere. Sysdig cited plain-English commentary in payloads, rapid self-correction, and more than 600 purposeful payloads as signs that an AI model was driving the operation. The article concludes that old, exposed systems are especially at risk as agent tools mature and can chain known issues into complete attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sysdig says it found what it believes is the first ransomware attack run from start to finish by an AI agent, which it calls JADEPUFFER.","JADEPUFFER exploited CVE-2025-3248, a missing-authentication flaw in Langflow that allows unauthenticated remote Python code execution on reachable servers.","After gaining access, the agent searched for API keys, cloud credentials, crypto wallet keys, and database logins, and it also accessed a MinIO server that still used the default minioadmin:minioadmin login.","The agent pivoted to an internet-facing MySQL and Nacos server, logged into the database as root, took over Nacos using CVE-2021-29441 and a default signing key, and created its own admin account.","The agent encrypted 1,342 Nacos settings, dropped the original tables, deleted whole databases, and left a ransom note, but Sysdig says the encryption key was never saved or sent anywhere."],"insights":["The ransom process was functionally unrecoverable because the agent generated an encryption key, printed it once, and did not save or transmit it, meaning payment could not restore the victim’s data.","The payloads contained plain-English explanations of their own steps, which Sysdig viewed as evidence of AI-generated activity because a human intruder would not normally include that kind of running commentary.","The agent corrected a failed login attempt in 31 seconds by diagnosing the cause and applying a multi-step fix, showing how automated attacks can adapt quickly instead of simply retrying commands.","The ransom note used the same Bitcoin address that appears in Bitcoin developer documentation, raising the possibility that the model reused a familiar training-data example rather than an attacker-controlled wallet.","Sysdig argues that runtime behavior monitoring is important because attackers can weaponize newly disclosed flaws in hours, while this case also showed old unpatched systems remained an easy entry point."],"referencedReports":[{"title":"JADEPUFFER: Agentic Ransomware for Automated Database Extortion","url":"https://www.sysdig.com/blog/jadepuffer-agentic-ransomware-for-automated-database-extortion","publisher":"Sysdig","context":"The article is based on Sysdig's analysis of the JADEPUFFER operation and cites it for details of the AI-driven ransomware activity.","category":"","primary":false},{"title":"First known AI-powered ransomware uncovered by ESET Research","url":"https://www.welivesecurity.com/en/ransomware/first-known-ai-powered-ransomware-uncovered-eset-research/","publisher":"ESET","context":"The article references ESET's research on PromptLock as part of the broader history of AI-driven ransomware developments.","category":"","primary":false},{"title":"Large Language Models Can Execute Complete Ransomware Attacks Autonomously","url":"https://engineering.nyu.edu/news/large-language-models-can-execute-complete-ransomware-attacks-autonomously-nyu-tandon-research","publisher":"NYU Tandon School of Engineering","context":"The article references NYU's Ransomware 3.0 prototype to clarify that PromptLock was a lab prototype rather than a real attack.","category":"","primary":false},{"title":"Detecting and countering misuse of Claude Code","url":"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025","publisher":"Anthropic","context":"The article cites Anthropic's report on an extortion campaign that used Claude Code against at least 17 organizations.","category":"","primary":false},{"title":"Disrupting the first reported AI-orchestrated cyber espionage campaign","url":"https://www.anthropic.com/news/disrupting-AI-espionage","publisher":"Anthropic","context":"The article cites Anthropic's disclosure of what it called the first largely autonomous cyberattack involving a Chinese state-linked spying effort.","category":"","primary":false}],"body":"\u003cp\u003eSysdig says it found what it believes is the first ransomware attack run from start to finish by an AI agent, which it calls JADEPUFFER. The agent allegedly handled the full chain of activity, including breaking in, stealing credentials, moving deeper into the network, and encrypting and wiping a company’s production database. The article says this matters because it lowers the skill needed to run a ransomware-style operation to the cost of renting an AI agent.\u003c/p\u003e\n\n\u003cp\u003eThe entry point was CVE-2025-3248, an already-patched Langflow flaw that allowed unauthenticated remote Python code execution on reachable servers. After gaining access, the agent searched for API keys, cloud credentials, crypto wallet keys, and database logins, and it accessed a MinIO server that still used the default minioadmin:minioadmin login. It then pivoted to a separate internet-facing MySQL and Nacos server, used root database access, abused CVE-2021-29441 and a default Nacos signing key, and created its own admin account.\u003c/p\u003e\n\n\u003cp\u003eThe agent encrypted 1,342 Nacos settings, dropped original tables, deleted whole databases, and left a ransom note demanding Bitcoin, but Sysdig says the encryption key was printed once and never saved or sent anywhere. Sysdig cited plain-English commentary in payloads, rapid self-correction, and more than 600 purposeful payloads as signs that an AI model was driving the operation. The article concludes that old, exposed systems are especially at risk as agent tools mature and can chain known issues into complete attacks.\u003c/p\u003e\n"},{"n":15,"title":"FortiBleed Credential Theft Linked to INC and Lynx Ransomware Operations","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/fortibleed-credential-theft-linked-to.html","time":"08:00","priority":"MUST READ","score":94,"tldr":"SOCRadar linked the FortiBleed credential-theft campaign to INC and Lynx ransomware operations, showing stolen FortiGate admin access is being used for follow-on ransomware attacks. The campaign reportedly scanned thousands of FortiGate portals, compromised hundreds of targets, and led to at least 12 ransomware deployments.","briefOverview":"\u003cp\u003eThe FortiBleed credential-theft campaign has been attributed to INC and Lynx ransomware operations, according to SOCRadar. The company said an operator tied to FortiBleed infrastructure was found actively working negotiation panels for both groups. SOCRadar said this links mass FortiGate credential theft directly to ransomware deployment for the first time.\u003c/p\u003e\n\n\u003cp\u003eSOCRadar tracked scanning activity against about 11,250 FortiGate portals in more than 150 countries, followed by confirmed admin-level access on 409 targets and successful completion of the full attack chain on 354 of them. At least 12 ransomware deployments have resulted from this access, encrypting hundreds of endpoints across affected organizations. The broader campaign is assessed to have targeted 430,000 FortiGate firewalls globally and gathered more than 110 million credentials.\u003c/p\u003e\n\n\u003cp\u003eThe campaign involved scanning exposed Fortinet devices, trying known credential combinations, and deploying custom Golang packet sniffers to collect credentials and authentication data from network traffic. SOCRadar said tooling, logs, and working hours indicate a Russian-speaking threat actor likely operating as an initial access broker, with much targeting focused on manufacturing, technology, and logistics sectors in Latin America and the Asia Pacific. The article also notes that eSentire observed threat actors exploiting Fortinet FortiClient EMS CVE-2026-35616 to deploy EKZ Stealer against a customer in the energy, utilities, and waste sector.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SOCRadar attributed the FortiBleed campaign to INC and Lynx ransomware operations after finding an operator tied to FortiBleed infrastructure actively working negotiation panels for both groups.","SOCRadar tracked scanning activity against about 11,250 FortiGate portals in more than 150 countries, with confirmed admin-level access on 409 targets and full attack chain completion on 354 of them.","At least 12 ransomware deployments have resulted from the FortiBleed access, encrypting hundreds of endpoints across affected organizations.","The campaign involved scanning exposed Fortinet devices, trying known credential combinations, and deploying custom packet sniffers to passively collect credentials and other authentication data from network traffic.","SOCRadar said tooling, logs, and working hours indicate a Russian-speaking threat actor likely operating as an initial access broker, with much of the targeting focused on manufacturing, technology, and logistics sectors in Latin America and the Asia Pacific regions."],"insights":["The article says FortiBleed is the first case tying mass FortiGate credential theft directly to ransomware deployment, making stolen firewall access a demonstrated ransomware pathway rather than only an access-theft concern.","SOCRadar’s numbers show that only a subset of scanned FortiGate portals progressed to confirmed administrator access and completed attack chains, but that subset still produced real ransomware deployments affecting hundreds of endpoints.","The attackers’ own operational security failure exposed a server containing stolen credentials, which became a major source of visibility into the campaign’s scale and links to ransomware operations.","The discovery of an internal document describing about 20 people with divided roles suggests the operation was organized with lead operators, specialists, and support staff rather than being an ad hoc campaign.","SOCRadar’s finding that the actors may possess a Nextcloud zero-day broadens the concern beyond Fortinet devices, and the firm said it is coordinating with the affected vendor."],"referencedReports":[{"title":"FortiBleed INC Lynx Ransomware Link","url":"https://socradar.io/blog/fortibleed-inc-lynx-ransomware-link/","publisher":"SOCRadar","context":"The article cites a new SOCRadar report as the source linking FortiBleed infrastructure to INC and Lynx ransomware operations.","category":"","primary":false},{"title":"Fortinet Vulnerability CVE-2026-35616 and EKZ Stealer: Attacking \u0026 Obfuscating Compilers with Binary Ninja Workflows","url":"https://www.esentire.com/blog/fortinet-vulnerability-cve-2026-35616-and-ekz-stealer-attacking-obfuscating-compilers-with-binary-ninja-workflows","publisher":"eSentire","context":"The article references eSentire’s analysis of threat actors exploiting Fortinet FortiClient EMS CVE-2026-35616 to deploy EKZ Stealer.","category":"","primary":false}],"body":"\u003cp\u003eThe FortiBleed credential-theft campaign has been attributed to INC and Lynx ransomware operations, according to SOCRadar. The company said an operator tied to FortiBleed infrastructure was found actively working negotiation panels for both groups. SOCRadar said this links mass FortiGate credential theft directly to ransomware deployment for the first time.\u003c/p\u003e\n\n\u003cp\u003eSOCRadar tracked scanning activity against about 11,250 FortiGate portals in more than 150 countries, followed by confirmed admin-level access on 409 targets and successful completion of the full attack chain on 354 of them. At least 12 ransomware deployments have resulted from this access, encrypting hundreds of endpoints across affected organizations. The broader campaign is assessed to have targeted 430,000 FortiGate firewalls globally and gathered more than 110 million credentials.\u003c/p\u003e\n\n\u003cp\u003eThe campaign involved scanning exposed Fortinet devices, trying known credential combinations, and deploying custom Golang packet sniffers to collect credentials and authentication data from network traffic. SOCRadar said tooling, logs, and working hours indicate a Russian-speaking threat actor likely operating as an initial access broker, with much targeting focused on manufacturing, technology, and logistics sectors in Latin America and the Asia Pacific. The article also notes that eSentire observed threat actors exploiting Fortinet FortiClient EMS CVE-2026-35616 to deploy EKZ Stealer against a customer in the energy, utilities, and waste sector.\u003c/p\u003e\n"},{"n":18,"title":"SharePoint RCE CVE-2026-45659 Added to CISA KEV After Active Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/sharepoint-rce-cve-2026-45659-added-to.html","time":"05:46","priority":"MUST READ","score":94,"tldr":"CISA added Microsoft SharePoint Server RCE flaw CVE-2026-45659 to its Known Exploited Vulnerabilities catalog after confirmed active exploitation, requiring U.S. federal agencies to patch by July 4, 2026. The flaw lets authenticated low-privilege SharePoint users execute code remotely, raising urgency for organizations running affected on-prem SharePoint versions.","briefOverview":"\u003cp\u003eCISA added CVE-2026-45659, a high-severity Microsoft SharePoint Server flaw, to its Known Exploited Vulnerabilities catalog after evidence of active exploitation. The vulnerability has a CVSS score of 8.8 and involves remote code execution caused by deserialization of untrusted data. Microsoft addressed the issue in May 2026 for SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Enterprise Server 2016.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the flaw can be triggered by an authenticated attacker and does not require administrator or other elevated privileges. In a network-based attack, an authenticated attacker with minimum Site Member permissions could use it to execute code remotely on the SharePoint Server. CISA advised Federal Civilian Executive Branch agencies to apply the fixes by July 4, 2026, though the article says it is not currently known how the flaw is being exploited, who is behind the activity, or what the attackers’ goals are.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes Microsoft’s recent finding that two unrelated attackers were operating at the same time in one investigated network. One activity cluster was attributed to Storm-2603, a threat actor known for deploying Warlock ransomware and exploiting known vulnerabilities in on-premises SharePoint servers since mid-2025. Microsoft said the attackers used tools and access methods including Velociraptor, Cloudflare tunneling, Zoho Assist, SSH through Visual Studio Code, local and domain administrator accounts, and a vulnerable driver named NSecKrnl.sys to sustain access and reduce visibility.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added CVE-2026-45659, a high-severity Microsoft SharePoint Server remote code execution flaw, to its Known Exploited Vulnerabilities catalog after evidence of active exploitation.","Microsoft fixed CVE-2026-45659 in May 2026 for SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Enterprise Server 2016.","Microsoft said an authenticated attacker with minimum Site Member permissions could exploit the flaw over a network to execute code remotely on the SharePoint Server.","Federal Civilian Executive Branch agencies are advised to apply the fixes for CVE-2026-45659 by July 4, 2026.","Microsoft recently reported a separate investigation in which two unrelated threat actors were operating simultaneously in the same network, including Storm-2603 activity associated with Warlock ransomware."],"insights":["CVE-2026-45659 was labeled by Microsoft as “Exploitation Less Likely,” yet CISA added it to the KEV catalog after active exploitation, showing that defenders should not rely solely on exploitability ratings when prioritizing patches.","The SharePoint flaw does not require administrator privileges, meaning ordinary authenticated users with basic Site Member permissions can represent a serious risk on affected servers.","Microsoft’s incident response case shows that what appears to be one ransomware intrusion may involve multiple unrelated attackers operating in the same environment at the same time.","The attackers used legitimate or administrative tools such as Velociraptor, Cloudflare tunneling, Zoho Assist, SSH through Visual Studio Code, and a vulnerable driver, highlighting how trusted tools can complicate detection and response."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/01/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites this CISA alert as the source for adding CVE-2026-45659 to the Known Exploited Vulnerabilities catalog after active exploitation.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2026-45659","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=CVE-2026-45659","publisher":"CISA","context":"The article quotes CISA's catalog description of the Microsoft SharePoint Server vulnerability.","category":"","primary":false},{"title":"One intrusion, two cyberattackers: Uncovering parallel threat activity","url":"https://www.microsoft.com/en-us/security/blog/2026/06/22/one-intrusion-two-cyberattackers-uncovering-parallel-threat-activity/","publisher":"Microsoft","context":"The article references Microsoft’s analysis of a ransomware investigation that found two unrelated attackers operating simultaneously in the same network.","category":"","primary":false}],"body":"\u003cp\u003eCISA added CVE-2026-45659, a high-severity Microsoft SharePoint Server flaw, to its Known Exploited Vulnerabilities catalog after evidence of active exploitation. The vulnerability has a CVSS score of 8.8 and involves remote code execution caused by deserialization of untrusted data. Microsoft addressed the issue in May 2026 for SharePoint Server Subscription Edition, SharePoint Server 2019, and SharePoint Enterprise Server 2016.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the flaw can be triggered by an authenticated attacker and does not require administrator or other elevated privileges. In a network-based attack, an authenticated attacker with minimum Site Member permissions could use it to execute code remotely on the SharePoint Server. CISA advised Federal Civilian Executive Branch agencies to apply the fixes by July 4, 2026, though the article says it is not currently known how the flaw is being exploited, who is behind the activity, or what the attackers’ goals are.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes Microsoft’s recent finding that two unrelated attackers were operating at the same time in one investigated network. One activity cluster was attributed to Storm-2603, a threat actor known for deploying Warlock ransomware and exploiting known vulnerabilities in on-premises SharePoint servers since mid-2025. Microsoft said the attackers used tools and access methods including Velociraptor, Cloudflare tunneling, Zoho Assist, SSH through Visual Studio Code, local and domain administrator accounts, and a vulnerable driver named NSecKrnl.sys to sustain access and reduce visibility.\u003c/p\u003e\n"},{"n":35,"title":"ShinyHunters \u0026 Rockstar: Snowflake Data Breach Leads to Compromise | Mitiga","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/shinyhunters-snowflake-and-rockstar-another-saas-leads-to-compromise","time":"21:42","priority":"MUST READ","score":94,"tldr":"ShinyHunters allegedly compromised Rockstar by stealing service account tokens from third-party analytics provider Anodot and using that trusted access to exfiltrate Snowflake data. The key lesson is that supply chain attacks often look like legitimate logins, so organizations must monitor service accounts and integration behavior for anomalies.","briefOverview":"\u003cp\u003eShinyHunters breached Rockstar Games by first compromising Anodot, a SaaS analytics provider with authenticated access to customer Snowflake environments. The attackers stole service account tokens, logged in as legitimate users, and exfiltrated 78.6 million records containing financial data and player spending metrics. The article states that no vulnerability in Snowflake itself was exploited.\u003c/p\u003e\n\n\u003cp\u003eThe incident is presented as a supply chain attack in which attackers used trusted third-party access rather than directly breaking into Rockstar’s environment. Anodot’s public status page showed a broad outage on April 4, 2026, affecting all data collectors, including Snowflake, S3, and Kinesis. ShinyHunters posted demands on April 11 with an April 14 deadline, and then published the records on April 12 after Rockstar refused to pay.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that stolen service account tokens can defeat detection systems that focus on unauthorized access attempts because the activity appears to come from legitimate users. It recommends checking whether an organization uses Anodot, reviewing known infrastructure such as Mullvad VPN nodes and Tor exit nodes, and baselining service account behavior. It also provides example detections for anomalous service account logins, service account external stage creation in Snowflake, and rapid database reconnaissance in a new session.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ShinyHunters breached Rockstar Games by first compromising Anodot, a SaaS analytics provider with authenticated access to customer Snowflake environments.","The attackers stole service account tokens, used them to log in as legitimate users, and exfiltrated 78.6 million records containing financial data and player spending metrics.","The article states that no vulnerability in Snowflake itself was exploited.","Anodot’s public status page showed a broad outage on April 4, 2026, affecting all data collectors, including Snowflake, S3, and Kinesis.","The article recommends checking whether an organization uses Anodot, reviewing known infrastructure indicators such as Mullvad and Tor nodes, and baselining service account activity."],"insights":["The article emphasizes that detection must focus on trusted service accounts because stolen third-party tokens can make attacker activity appear like normal authenticated access.","The reported timeline from Anodot’s outage on April 4 to ShinyHunters publishing Rockstar data on April 12 shows that organizations may have only days to detect and contain this type of compromise before extortion escalates.","The article recommends starting hunts by identifying whether Anodot is used before attempting broader behavioral analysis, because that can quickly narrow the investigation scope.","External stage creation by service accounts in Snowflake is highlighted as a practical warning sign because external stages can be used as preparation for moving data out of Snowflake.","Rapid database reconnaissance immediately after a new session starts is presented as a strong behavioral signal for suspicious Snowflake activity."],"referencedReports":[{"title":"Unpacking the 2024 Snowflake Data Breach","url":"https://cloudsecurityalliance.org/blog/2025/05/07/unpacking-the-2024-snowflake-data-breach","publisher":"Cloud Security Alliance","context":"The article cites this analysis for the claim that companies reported up to $3 million in direct financial consequences from Snowflake-related breaches.","category":"","primary":false}],"body":"\u003cp\u003eShinyHunters breached Rockstar Games by first compromising Anodot, a SaaS analytics provider with authenticated access to customer Snowflake environments. The attackers stole service account tokens, logged in as legitimate users, and exfiltrated 78.6 million records containing financial data and player spending metrics. The article states that no vulnerability in Snowflake itself was exploited.\u003c/p\u003e\n\n\u003cp\u003eThe incident is presented as a supply chain attack in which attackers used trusted third-party access rather than directly breaking into Rockstar’s environment. Anodot’s public status page showed a broad outage on April 4, 2026, affecting all data collectors, including Snowflake, S3, and Kinesis. ShinyHunters posted demands on April 11 with an April 14 deadline, and then published the records on April 12 after Rockstar refused to pay.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that stolen service account tokens can defeat detection systems that focus on unauthorized access attempts because the activity appears to come from legitimate users. It recommends checking whether an organization uses Anodot, reviewing known infrastructure such as Mullvad VPN nodes and Tor exit nodes, and baselining service account behavior. It also provides example detections for anomalous service account logins, service account external stage creation in Snowflake, and rapid database reconnaissance in a new session.\u003c/p\u003e\n"},{"n":6,"title":"Cisco finally confirms attackers exploiting Unified CM flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisco-finally-confirms-attackers-exploiting-unified-cm-flaw/","time":"11:35","priority":"MUST READ","score":93,"tldr":"Cisco confirmed that attackers are actively exploiting CVE-2026-20230, a Unified CM server-side request forgery flaw with public exploit code. Customers should upgrade to fixed releases immediately or disable the vulnerable WebDialer service until patched.","briefOverview":"\u003cp\u003eCisco confirmed that attackers are actively exploiting CVE-2026-20230, a Unified Communications Manager vulnerability that was patched in early June. Unified CM is Cisco’s central control system for IP telephony, handling call routing, device management, and phone features. Cisco had previously said proof-of-concept exploit code was public but that it had no evidence of active exploitation at the time patches were released.\u003c/p\u003e\n\n\u003cp\u003eThe flaw can be exploited remotely by attackers without privileges through low-complexity server-side request forgery attacks using crafted HTTP requests. Defused reported on June 22 that attackers were using properly constructed file:// payloads to create files on targeted devices, and SSD Secure later published a technical write-up with a proof-of-concept exploit. Cisco urged customers to upgrade to fixed Unified CM releases and advised those unable to patch immediately to disable the vulnerable WebDialer service.\u003c/p\u003e\n\n\u003cp\u003eShadowserver is tracking more than 200 Cisco Unified CM instances exposed online, mostly in Asia and North America, though the article says it is unclear how many have been secured. The article also notes that Cisco has patched several other Unified CM flaws in recent years, including issues enabling root access and remote code execution. CISA has tagged 93 Cisco vulnerabilities as actively exploited in the wild since November 2021, including six abused in ransomware attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco confirmed that attackers are actively exploiting CVE-2026-20230, a Unified Communications Manager vulnerability patched in early June.","CVE-2026-20230 can be exploited remotely by unauthenticated attackers in low-complexity server-side request forgery attacks using crafted HTTP requests.","Defused reported on June 22 that attackers had begun exploiting the flaw with properly constructed file:// payloads to create files on targeted devices.","Cisco urged customers to upgrade to fixed Cisco Unified CM releases and advised those who cannot immediately patch to disable the vulnerable WebDialer service.","Shadowserver is tracking over 200 Cisco Unified CM instances exposed online, mostly in Asia and North America."],"insights":["Public proof-of-concept exploit code was already available when Cisco released patches on June 3, but Cisco did not confirm active exploitation until after outside researchers reported attacks later in June.","The reported exploitation used file:// payloads to create files on targeted devices, connecting the SSRF flaw to arbitrary file creation rather than only request redirection.","Cisco named the WebDialer service as the component administrators can disable to block incoming CVE-2026-20230 attacks when immediate patching is not possible.","The article places CVE-2026-20230 in a broader pattern for Unified CM, noting recent Cisco patches for other Unified CM flaws that enabled root access or remote code execution, including one exploited as a zero-day."],"referencedReports":[{"title":"Cisco Unified Communications Manager and Unified Communications Manager Session Management Edition Server-Side Request Forgery Vulnerability","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-cucm-ssrf-cXPnHcW","publisher":"Cisco","context":"The article cites Cisco's updated security advisory as the source for Cisco's confirmation of active exploitation and mitigation guidance.","category":"","primary":false},{"title":"Cisco Unified Communications Manager Arbitrary File Write to RCE","url":"https://ssd-disclosure.com/cisco-unified-communications-manager-arbitrary-file-write-to-rce/","publisher":"SSD Secure","context":"The article says SSD Secure published a technical write-up with a proof-of-concept exploit and an explanation of how the vulnerability works.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?f%5B0%5D=vendor_project%3A801","publisher":"CISA","context":"The article references CISA's catalog to state that 93 Cisco vulnerabilities have been tagged as actively exploited since November 2021.","category":"","primary":false}],"body":"\u003cp\u003eCisco confirmed that attackers are actively exploiting CVE-2026-20230, a Unified Communications Manager vulnerability that was patched in early June. Unified CM is Cisco’s central control system for IP telephony, handling call routing, device management, and phone features. Cisco had previously said proof-of-concept exploit code was public but that it had no evidence of active exploitation at the time patches were released.\u003c/p\u003e\n\n\u003cp\u003eThe flaw can be exploited remotely by attackers without privileges through low-complexity server-side request forgery attacks using crafted HTTP requests. Defused reported on June 22 that attackers were using properly constructed file:// payloads to create files on targeted devices, and SSD Secure later published a technical write-up with a proof-of-concept exploit. Cisco urged customers to upgrade to fixed Unified CM releases and advised those unable to patch immediately to disable the vulnerable WebDialer service.\u003c/p\u003e\n\n\u003cp\u003eShadowserver is tracking more than 200 Cisco Unified CM instances exposed online, mostly in Asia and North America, though the article says it is unclear how many have been secured. The article also notes that Cisco has patched several other Unified CM flaws in recent years, including issues enabling root access and remote code execution. CISA has tagged 93 Cisco vulnerabilities as actively exploited in the wild since November 2021, including six abused in ransomware attacks.\u003c/p\u003e\n"},{"n":3,"title":"Medtronic notifies customers impacted by ShinyHunters data breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/medtronic-notifies-customers-impacted-by-shinyhunters-data-breach/","time":"04:25","priority":"MUST READ","score":92,"tldr":"Medtronic is notifying customers after ShinyHunters accessed corporate IT systems and exposed personal and health-related data, potentially including names, contact details, dates of birth, Social Security numbers, and health information. The company says its medical devices were not affected and that the stolen data has not been posted online.","briefOverview":"\u003cp\u003eMedtronic is notifying affected customers about a data breach that exposed personal data to an unauthorized third party. The company said it became aware of unusual activity on certain corporate IT systems on April 15, 2026. An investigation with third-party cybersecurity experts found that an unauthorized actor accessed certain Medtronic corporate IT systems from April 13 to April 19, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data may include full names, contact information, dates of birth, Social Security numbers, and health-related information. The ShinyHunters data extortion group claimed responsibility and said it held 9 million Medtronic records containing personally identifiable information and internal corporate data. The group listed Medtronic on its dark web extortion portal on April 18 and threatened to release the data if a ransom was not paid by April 21.\u003c/p\u003e\n\n\u003cp\u003eThe Medtronic entry was later removed from ShinyHunters\u0026rsquo; listing, and Medtronic said the stolen data was not exposed online. Medtronic also said its devices remain safe to use and were not affected by the cybersecurity incident. Notification recipients are advised to enroll in the offered 24-month credit monitoring and identity theft protection services, watch for suspicious communications, and monitor account activity closely.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Medtronic is notifying affected customers about a data breach that exposed personal data to an unauthorized third party.","Medtronic said it detected unusual activity on certain corporate IT systems on April 15, 2026, and an investigation found unauthorized access from April 13 to April 19, 2026.","The exposed data may include full names, contact information, dates of birth, Social Security numbers, and health-related information.","The ShinyHunters group claimed it held 9 million Medtronic records and listed Medtronic on its dark web extortion portal on April 18 before later removing the entry.","Medtronic said the stolen data was not exposed online and that its medical devices remain safe to use and were not affected by the incident."],"insights":["Affected customers have a concrete mitigation step available because Medtronic is offering 24 months of credit monitoring and identity theft protection services.","The article separates the corporate IT breach from device safety, with Medtronic saying its medical devices remain safe to use and were not affected by the incident.","Although ShinyHunters threatened to publish allegedly stolen records by April 21, Medtronic says the stolen data was not exposed online after the group’s listing was later removed.","The combination of personal, Social Security, and health-related information makes suspicious communications especially important to watch for, because the article warns that exposed data may be used in scams, social engineering, and phishing attempts."],"referencedReports":[],"body":"\u003cp\u003eMedtronic is notifying affected customers about a data breach that exposed personal data to an unauthorized third party. The company said it became aware of unusual activity on certain corporate IT systems on April 15, 2026. An investigation with third-party cybersecurity experts found that an unauthorized actor accessed certain Medtronic corporate IT systems from April 13 to April 19, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe exposed data may include full names, contact information, dates of birth, Social Security numbers, and health-related information. The ShinyHunters data extortion group claimed responsibility and said it held 9 million Medtronic records containing personally identifiable information and internal corporate data. The group listed Medtronic on its dark web extortion portal on April 18 and threatened to release the data if a ransom was not paid by April 21.\u003c/p\u003e\n\n\u003cp\u003eThe Medtronic entry was later removed from ShinyHunters\u0026rsquo; listing, and Medtronic said the stolen data was not exposed online. Medtronic also said its devices remain safe to use and were not affected by the cybersecurity incident. Notification recipients are advised to enroll in the offered 24-month credit monitoring and identity theft protection services, watch for suspicious communications, and monitor account activity closely.\u003c/p\u003e\n"},{"n":14,"title":"Ransomware Groups Turn to Citrix Bleed 2, BYOVD, and Supply Chain Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ransomware-groups-turn-to-citrix-bleed.html","time":"18:30","priority":"MUST READ","score":92,"tldr":"Ransomware groups are increasingly combining Citrix Bleed 2 exploitation, stolen or weak credentials, legitimate remote management tools, BYOVD techniques, and supply-chain-derived access to break into networks, evade defenses, and deploy ransomware. The activity highlights a shift toward more industrialized, credential-driven ransomware operations involving groups such as Anubis, The Gentlemen, VECT, and TeamPCP.","briefOverview":"\u003cp\u003eThreat actors associated with the Anubis ransomware operation have been observed exploiting the Citrix Bleed 2 vulnerability, CVE-2025-5777, to gain initial access. Arctic Wolf said Anubis affiliates also used valid VPN credentials, legitimate remote management tools, credential access, and hands-on-keyboard procedures for lateral movement. The group has targeted sectors including healthcare, business services, manufacturing, technology, and financial services, with more than half of reported victims located in the U.S.\u003c/p\u003e\n\n\u003cp\u003eThe Anubis intrusions involved tools such as ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, Total Software Deployment, RDP, PsExec, and cloudflared. Attackers used tools including S3 Browser, rclone, s5cmd, WinSCP, and PuTTY for data transfer or exfiltration before ransomware deployment. Arctic Wolf also observed defense impairment and anti-analysis steps, including Windows Defender real-time protection disablement, SophosUninstall activity, PCHunter-related artifacts, log clearing or manipulation, and deletion of an Anubis encryptor after execution in at least one intrusion.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes activity linked to The Gentlemen, VECT, and TeamPCP. Kaspersky detailed The Gentlemen’s use of known vulnerabilities, stolen or weak credentials, a Go-based backdoor, and BYOVD techniques, while Expel reported the group used a zero-day vulnerability in the ktapi.sys driver to kill protected security processes. Sophos reported that VECT and TeamPCP partnered to combine supply chain attack-driven credential theft with ransomware deployment, and recent analyses found VECT flaws that permanently destroy files larger than 128 KB rather than encrypting them.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Anubis ransomware affiliates have exploited the Citrix Bleed 2 vulnerability, CVE-2025-5777, and used valid VPN credentials to gain initial access to victim environments.","Anubis intrusions involved legitimate remote management tools such as ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, and Total Software Deployment, along with RDP, PsExec, cloudflared, and data transfer tools including S3 Browser, rclone, s5cmd, WinSCP, and PuTTY.","The Gentlemen ransomware-as-a-service group used known vulnerabilities, stolen or weak credentials, a Go-based backdoor, and a BYOVD technique involving the ktapi.sys driver to bypass Windows security protections and kill protected security processes.","Sophos reported that VECT and TeamPCP formed a partnership to combine supply chain attack-driven credential theft with ransomware deployment across organizations compromised in the Trivy and LiteLLM supply chain attacks.","Recent analyses found that VECT contains implementation flaws that permanently destroy files larger than 128 KB rather than encrypting them, while TeamPCP claimed it had never used VECT's encryptor in attacks."],"insights":["Anubis affiliates repeatedly used legitimate remote administration tools such as ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, and Total Software Deployment, showing that normal-looking IT software was central to maintaining access and blending into victim environments.","Anubis’s /WIPEMODE can reduce files to 0 KB regardless of whether a ransom is paid, making the threat more destructive than simple encryption and increasing pressure on victims before the wiper is fully activated.","The Gentlemen’s use of ktapi.sys shows that even fully updated Windows systems with exploit mitigations enabled may not be fully protected against BYOVD techniques that disable endpoint security tools.","The VECT and TeamPCP partnership ties large-scale supply chain credential theft directly to ransomware deployment, which Sophos described as lowering the barrier to entry for cybercrime.","VECT’s technical flaws can permanently destroy files larger than 128 KB instead of encrypting them, meaning victims may lose data even when the ransomware is operationally flawed."],"referencedReports":[{"title":"CitrixBleed 2 to Cloudflared: The Tools and Techniques Behind Anubis Ransomware Attacks","url":"https://arcticwolf.com/resources/blog/citrixbleed-2-to-cloudflared-the-tools-and-techniques-behind-anubis-ransomware-attacks/","publisher":"Arctic Wolf","context":"The article cites Arctic Wolf's report as the source for Anubis affiliates exploiting Citrix Bleed 2 and abusing legitimate remote administration tools.","category":"","primary":false},{"title":"Anubis Ransomware Stresses Need for Advanced Data Backup","url":"https://zerolabs.rubrik.com/blog/anubis-ransomware-stresses-need-advanced-data-backup","publisher":"Rubrik Zero Labs","context":"The article references Rubrik Zero Labs' July 2025 report describing Anubis's affiliate profit split and irreversible /WIPEMODE feature.","category":"","primary":false},{"title":"The Gentlemen RaaS","url":"https://securelist.com/the-gentlemen-raas/120447/","publisher":"Kaspersky","context":"The article cites Kaspersky's analysis of The Gentlemen ransomware group's use of known vulnerabilities, stolen or weak credentials, a Go-based backdoor, and BYOVD techniques.","category":"","primary":false},{"title":"Not Very Gentlemanly: Analyzing a Zero-Day Exploit Used by The Gentlemen Ransomware to Disable Targets’ EDRs","url":"https://expel.com/blog/not-very-gentlemanly-analyzing-a-zero-day-exploit-used-by-the-gentlemen-ransomware-to-disable-targets-edrs/","publisher":"Expel","context":"The article references Expel's analysis of The Gentlemen's use of a zero-day vulnerability in the ktapi.sys driver to disable endpoint security protections.","category":"","primary":false},{"title":"VECT and TeamPCP Partner for Ransomware Campaigns","url":"https://www.sophos.com/en-us/blog/vect-and-teampcp-partner-for-ransomware-campaigns","publisher":"Sophos","context":"The article cites Sophos Counter Threat Unit's investigation into the partnership between VECT and TeamPCP involving supply chain credential theft and ransomware deployment.","category":"","primary":false},{"title":"VECT Ransomware Analysis","url":"https://www.jumpsec.com/guides/vect-ransomware-analysis/","publisher":"JUMPSEC","context":"The article references JUMPSEC's analysis finding that VECT implementation flaws can permanently destroy files larger than 128 KB rather than encrypt them.","category":"","primary":false}],"body":"\u003cp\u003eThreat actors associated with the Anubis ransomware operation have been observed exploiting the Citrix Bleed 2 vulnerability, CVE-2025-5777, to gain initial access. Arctic Wolf said Anubis affiliates also used valid VPN credentials, legitimate remote management tools, credential access, and hands-on-keyboard procedures for lateral movement. The group has targeted sectors including healthcare, business services, manufacturing, technology, and financial services, with more than half of reported victims located in the U.S.\u003c/p\u003e\n\n\u003cp\u003eThe Anubis intrusions involved tools such as ScreenConnect, Zoho Assist, MeshAgent, Remotely, UltraVNC, Total Software Deployment, RDP, PsExec, and cloudflared. Attackers used tools including S3 Browser, rclone, s5cmd, WinSCP, and PuTTY for data transfer or exfiltration before ransomware deployment. Arctic Wolf also observed defense impairment and anti-analysis steps, including Windows Defender real-time protection disablement, SophosUninstall activity, PCHunter-related artifacts, log clearing or manipulation, and deletion of an Anubis encryptor after execution in at least one intrusion.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes activity linked to The Gentlemen, VECT, and TeamPCP. Kaspersky detailed The Gentlemen’s use of known vulnerabilities, stolen or weak credentials, a Go-based backdoor, and BYOVD techniques, while Expel reported the group used a zero-day vulnerability in the ktapi.sys driver to kill protected security processes. Sophos reported that VECT and TeamPCP partnered to combine supply chain attack-driven credential theft with ransomware deployment, and recent analyses found VECT flaws that permanently destroy files larger than 128 KB rather than encrypting them.\u003c/p\u003e\n"},{"n":9,"title":"It’s 37oC, And All We Can Think About Is ColdFusion (Adobe ColdFusion Security Bulletin APSB26-68 CVE Bonanza)","source":"labs.watchtowr.com","sourceColorIdx":8,"link":"https://labs.watchtowr.com/its-37oc-and-all-we-can-think-about-is-coldfusion-adobe-coldfusion-security-bulletin-apsb26-68-cve-bonanza/","time":"16:38","priority":"SHOULD READ","score":88,"tldr":"Adobe patched a large set of ColdFusion vulnerabilities, including RDS file operations that could allow unauthenticated arbitrary file read/write and remote code execution when RDS is enabled with authentication disabled. Additional CKEditor file manager flaws could also allow path traversal-based uploads or directory listing when the feature is explicitly enabled.","briefOverview":"\u003cp\u003eAdobe released security advisory APSB26-68 on June 30, covering numerous CVEs affecting Adobe ColdFusion 2025 Update 9 and below and ColdFusion 2023 Update 20 and below. The article analyzes changes between ColdFusion 2025.0.0.331385 and 2025.0.0.331899 to understand what was fixed. The researchers state that, because of the number of issues addressed, they were not fully confident in mapping each vulnerability to a specific CVE.\u003c/p\u003e\n\n\u003cp\u003eA major focus is ColdFusion’s Remote Development Services feature, which allows development tools to interact with a ColdFusion server over HTTP. The article says the described RDS file issues require RDS to be enabled and, based on testing, authentication to be disabled. The FILEIO service previously accepted user-supplied paths directly for operations such as reading and writing files, while the patch added canonical path resolution through RdsFileSecurity to reject null bytes and parent directory traversal sequences.\u003c/p\u003e\n\n\u003cp\u003eThe article shows that arbitrary file read could retrieve files such as C:\\Windows\\win.ini, and arbitrary file write could place a ColdFusion file in the web root to achieve remote code execution. It also describes CKEditor file manager path traversal issues affecting upload and directory listing behavior, while noting that uploads, directory creation, and directory navigation are disabled by default. The researchers additionally observed fixes related to XSLT, SSRF, XXE, and file write behavior involving several CFML tags, but said those require a custom .cfm page using the affected tag and user-controlled input reaching it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adobe’s June 30 security advisory APSB26-68 addressed multiple vulnerabilities affecting ColdFusion 2025 Update 9 and below and ColdFusion 2023 Update 20 and below.","The researchers found that ColdFusion’s Remote Development Services FILEIO functionality could allow arbitrary file read and write when RDS is enabled and authentication is disabled.","The article states that the FILEIO write capability could be used to place a ColdFusion file in the web root and achieve remote code execution.","The patch changed RDS file handling to use canonical path resolution through RdsFileSecurity, adding checks intended to reject null bytes and parent directory traversal sequences.","The researchers also identified path traversal issues in the CKEditor file manager upload and directory listing functionality, while noting that file uploads are disabled by default."],"insights":["The most severe RDS file read and write issues require an unsafe configuration: RDS must be enabled and, based on the researchers’ testing, authentication must also be disabled.","The RDS patch appears broader than the advisory labels suggest, because the same path validation change also affected file move, file delete, directory creation, and directory listing operations.","The CKEditor upload issue is limited by default settings because file uploads, directory creation, and directory navigation are disabled by default in both vulnerable and patched versions.","The researchers explicitly cautioned that they could not confidently map every fixed weakness to a specific CVE because the advisory bundled many vulnerabilities together."],"referencedReports":[{"title":"Adobe ColdFusion Security Bulletin APSB26-68","url":"https://helpx.adobe.com/security/products/coldfusion/apsb26-68.html?ref=labs.watchtowr.com","publisher":"Adobe","context":"The article states that Adobe released this June 30 security advisory covering numerous CVEs affecting Adobe ColdFusion and uses it as the basis for the vulnerability analysis.","category":"","primary":false}],"body":"\u003cp\u003eAdobe released security advisory APSB26-68 on June 30, covering numerous CVEs affecting Adobe ColdFusion 2025 Update 9 and below and ColdFusion 2023 Update 20 and below. The article analyzes changes between ColdFusion 2025.0.0.331385 and 2025.0.0.331899 to understand what was fixed. The researchers state that, because of the number of issues addressed, they were not fully confident in mapping each vulnerability to a specific CVE.\u003c/p\u003e\n\n\u003cp\u003eA major focus is ColdFusion’s Remote Development Services feature, which allows development tools to interact with a ColdFusion server over HTTP. The article says the described RDS file issues require RDS to be enabled and, based on testing, authentication to be disabled. The FILEIO service previously accepted user-supplied paths directly for operations such as reading and writing files, while the patch added canonical path resolution through RdsFileSecurity to reject null bytes and parent directory traversal sequences.\u003c/p\u003e\n\n\u003cp\u003eThe article shows that arbitrary file read could retrieve files such as C:\\Windows\\win.ini, and arbitrary file write could place a ColdFusion file in the web root to achieve remote code execution. It also describes CKEditor file manager path traversal issues affecting upload and directory listing behavior, while noting that uploads, directory creation, and directory navigation are disabled by default. The researchers additionally observed fixes related to XSLT, SSRF, XXE, and file write behavior involving several CFML tags, but said those require a custom .cfm page using the affected tag and user-controlled input reaching it.\u003c/p\u003e\n"},{"n":2,"title":"Alleged Scattered Spider hacker extradited to the United States","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/alleged-scattered-spider-hacker-extradited-to-the-united-states/","time":"08:58","priority":"SHOULD READ","score":86,"tldr":"A 19-year-old dual U.S.-Estonian citizen accused of being a Scattered Spider member has been extradited to the United States after his arrest in Finland. Prosecutors allege he helped breach major companies through social engineering and extortion schemes that caused millions in losses.","briefOverview":"\u003cp\u003eA dual United States and Estonian citizen, 19-year-old Peter Stokes, has been extradited to the United States to face charges alleging he was a member of the Scattered Spider hacking collective. Stokes, who allegedly used the online handles \u0026ldquo;Bouquet,\u0026rdquo; \u0026ldquo;Spencer,\u0026rdquo; and \u0026ldquo;Jordan,\u0026rdquo; was arrested in Finland on April 10 while attempting to board a flight to Japan. Prosecutors accuse him of helping extort millions of dollars from multiple high-profile companies worldwide.\u003c/p\u003e\n\n\u003cp\u003eCourt documents allege Stokes was involved in at least four Scattered Spider breaches, including a March 2023 hack of an online communication platform when he was 16 years old. In a May 2025 incident involving an unnamed multibillion-dollar luxury item retailer, hackers allegedly called the company’s IT helpdesk while posing as employees to reset credentials and gain administrator access. The attackers demanded an \u003cspan class=\"math inline\"\u003e\\(8 million ransom and claimed to have 100 gigabytes of stolen data, but the company refused to pay and still incurred more than \\)\u003c/span\u003e2 million in disruption and remediation costs.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said Scattered Spider has been involved in over 100 network intrusions, resulting in more than $100 million in ransom payments and millions more in damages. The group is also tracked as 0ktapus, Octo Tempest, Scatter Swine, UNC3944, and Muddled Libra, and is described as a loosely knit collective mainly composed of teenagers and young adults from the United States and Great Britain. The article says the group uses social engineering, targeted multi-factor authentication bombing, SMS credential phishing, the Genymobile Android emulator during MFA attacks, and the DragonForce encryptor in ransomware attacks against UK retail companies.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A 19-year-old dual United States and Estonian citizen, Peter Stokes, has been extradited to the United States to face charges alleging he was a member of the Scattered Spider hacking collective.","Stokes was arrested in Finland on April 10 while attempting to board a flight to Japan and is accused of helping extort millions of dollars from multiple high-profile companies worldwide.","Court documents allege Stokes was involved in at least four Scattered Spider breaches, including a March 2023 hack of an online communication platform and a May 2025 breach of an unnamed multibillion-dollar luxury item retailer.","In the luxury retailer incident, hackers allegedly posed as employees when calling the IT helpdesk to reset credentials, demanded an $8 million ransom, and caused the company over $2 million in disruption and remediation costs after it refused to pay.","The Justice Department said Scattered Spider has been involved in over 100 network intrusions, resulting in more than $100 million in ransom payments and millions more in victim damages."],"insights":["Scattered Spider’s alleged intrusions show that helpdesk impersonation can be enough to reach administrator accounts, as the luxury retailer breach allegedly began with calls posing as employees to reset credentials.","The luxury retailer’s refusal to pay the $8 million ransom did not prevent major losses, since the company still incurred more than $2 million from operational disruption and remediation.","The case highlights how young members can play major roles in high-impact cybercrime, with Stokes allegedly involved in a March 2023 breach when he was 16 years old.","The article shows Scattered Spider’s activity spans many sectors, with listed victims including casinos, game companies, delivery platforms, email marketing providers, retailers, airlines, and transportation organizations."],"referencedReports":[],"body":"\u003cp\u003eA dual United States and Estonian citizen, 19-year-old Peter Stokes, has been extradited to the United States to face charges alleging he was a member of the Scattered Spider hacking collective. Stokes, who allegedly used the online handles \u0026ldquo;Bouquet,\u0026rdquo; \u0026ldquo;Spencer,\u0026rdquo; and \u0026ldquo;Jordan,\u0026rdquo; was arrested in Finland on April 10 while attempting to board a flight to Japan. Prosecutors accuse him of helping extort millions of dollars from multiple high-profile companies worldwide.\u003c/p\u003e\n\n\u003cp\u003eCourt documents allege Stokes was involved in at least four Scattered Spider breaches, including a March 2023 hack of an online communication platform when he was 16 years old. In a May 2025 incident involving an unnamed multibillion-dollar luxury item retailer, hackers allegedly called the company’s IT helpdesk while posing as employees to reset credentials and gain administrator access. The attackers demanded an \u003cspan class=\"math inline\"\u003e\\(8 million ransom and claimed to have 100 gigabytes of stolen data, but the company refused to pay and still incurred more than \\)\u003c/span\u003e2 million in disruption and remediation costs.\u003c/p\u003e\n\n\u003cp\u003eThe Justice Department said Scattered Spider has been involved in over 100 network intrusions, resulting in more than $100 million in ransom payments and millions more in damages. The group is also tracked as 0ktapus, Octo Tempest, Scatter Swine, UNC3944, and Muddled Libra, and is described as a loosely knit collective mainly composed of teenagers and young adults from the United States and Great Britain. The article says the group uses social engineering, targeted multi-factor authentication bombing, SMS credential phishing, the Genymobile Android emulator during MFA attacks, and the DragonForce encryptor in ransomware attacks against UK retail companies.\u003c/p\u003e\n"},{"n":12,"title":"ToddyCat-Linked Umbrij Malware Abuses OAuth to Access Gmail via Google API","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/toddycat-linked-umbrij-malware-abuses.html","time":"13:04","priority":"SHOULD READ","score":86,"tldr":"Kaspersky says the ToddyCat APT is using a new tool called Umbrij to hijack active Gmail sessions in Chrome or Edge, abuse OAuth via Google APIs, and gain covert access to corporate email. Organizations should review and revoke suspicious Google Workspace Migration/Sync for Microsoft Outlook app permissions if they are not legitimately used.","briefOverview":"\u003cp\u003eKaspersky attributed a new malware called Umbrij to the threat actor ToddyCat, saying it is designed to gain surreptitious access to victims’ Gmail correspondence via the Google API. The campaign focused on corporate email communications hosted on Gmail and targeted access compromise through APIs. Kaspersky said the malware abuses OAuth 2.0 authorization to acquire a token that can be used to reach requested email resources.\u003c/p\u003e\n\n\u003cp\u003eUmbrij works against Chromium-based browsers and relies on an active Gmail session. The tool launches the browser in headless mode, connects to it through a remote debugging port, and uses the existing logged-in session to request an OAuth authorization code. That code is then exchanged for an OAuth access token, which the attackers use to connect to the Gmail account through the API.\u003c/p\u003e\n\n\u003cp\u003eKaspersky discovered Umbrij during a threat hunting operation involving a scheduled task impersonating its software and a digitally signed file that used DLL side-loading to launch the Umbrij DLL. The malware can target Google Chrome or Microsoft Edge, copy browser profile data, and use Puppeteer to grant permissions to a Google migration-related application. Kaspersky advised organizations to review Google account connections for “Google Workspace Migration for Microsoft Outlook” or “Google Workspace Sync for Microsoft Outlook” and revoke access if those applications are not actually used.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky attributed a new malware called Umbrij to the ToddyCat threat actor, saying it is designed to access victims’ Gmail correspondence through the Google API.","Umbrij abuses an active Gmail session in Chromium-based browsers by launching the browser in headless mode, connecting through a remote debugging port, and obtaining an OAuth authorization code.","The malware was discovered during a threat hunting operation in which a scheduled task impersonating Kaspersky software launched a digitally signed file that used DLL side-loading to run the Umbrij DLL.","Kaspersky said Umbrij can target Google Chrome or Microsoft Edge, copy browser profile data into BackupFiles folders, and use Puppeteer to interact with the browser and grant permissions to a Google migration-related application.","Kaspersky advised organizations to review Google account application connections for “Google Workspace Migration for Microsoft Outlook” or “Google Workspace Sync for Microsoft Outlook” and revoke access if those applications are not used."],"insights":["Umbrij does not need to steal a Gmail password directly because it can reuse an already authenticated browser profile and obtain Google API access through the victim’s active session.","The abuse of Google Workspace Migration for Microsoft Outlook and Google Workspace Sync for Microsoft Outlook provides a concrete review point for defenders because Kaspersky specifically recommends revoking those app connections when they are not legitimately used.","ToddyCat’s use of three different legitimate binaries for DLL side-loading shows that the same Umbrij payload can be launched through multiple trusted-looking executables, including Bitdefender, Microsoft Visual Studio, and Google Desktop components.","The malware’s detailed logging creates an exfiltration target for the operator because Kaspersky said Umbrij saves the retrieved authorization code to a log file on the compromised host."],"referencedReports":[{"title":"ToddyCat APT: Umbrij tool and OAuth","url":"https://securelist.com/toddycat-apt-umbrij-tool-and-oauth/120251/","publisher":"Kaspersky","context":"The article says Kaspersky published a detailed report on ToddyCat’s Umbrij malware and its abuse of OAuth to access Gmail via Google APIs.","category":"","primary":false}],"body":"\u003cp\u003eKaspersky attributed a new malware called Umbrij to the threat actor ToddyCat, saying it is designed to gain surreptitious access to victims’ Gmail correspondence via the Google API. The campaign focused on corporate email communications hosted on Gmail and targeted access compromise through APIs. Kaspersky said the malware abuses OAuth 2.0 authorization to acquire a token that can be used to reach requested email resources.\u003c/p\u003e\n\n\u003cp\u003eUmbrij works against Chromium-based browsers and relies on an active Gmail session. The tool launches the browser in headless mode, connects to it through a remote debugging port, and uses the existing logged-in session to request an OAuth authorization code. That code is then exchanged for an OAuth access token, which the attackers use to connect to the Gmail account through the API.\u003c/p\u003e\n\n\u003cp\u003eKaspersky discovered Umbrij during a threat hunting operation involving a scheduled task impersonating its software and a digitally signed file that used DLL side-loading to launch the Umbrij DLL. The malware can target Google Chrome or Microsoft Edge, copy browser profile data, and use Puppeteer to grant permissions to a Google migration-related application. Kaspersky advised organizations to review Google account connections for “Google Workspace Migration for Microsoft Outlook” or “Google Workspace Sync for Microsoft Outlook” and revoke access if those applications are not actually used.\u003c/p\u003e\n"},{"n":19,"title":"New ChocoPoC RAT Targets Vulnerability Researchers via Fake PoC Exploit Repos","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-chocopoc-rat-targets-vulnerability.html","time":"07:24","priority":"SHOULD READ","score":86,"tldr":"Attackers are targeting vulnerability researchers with fake GitHub PoC exploit repositories that pull malicious Python dependencies, installing the ChocoPoC RAT to steal credentials, browser data, files, and provide remote shell access. Researchers should avoid running untrusted PoCs, inspect dependency chains, and rebuild/rotate credentials if packages like frint, skytext, slogsec, or logcrypt.cryptography were installed.","briefOverview":"\u003cp\u003eAttackers are using fake Python proof-of-concept repositories on GitHub to target vulnerability researchers with a data-stealing trojan called ChocoPoC. The repositories claim to exploit newly public high-profile CVEs, but running them can steal saved passwords, browser cookies, files, and other local data while giving the attacker shell access. YesWeHack and Sekoia published joint findings on July 1 and warned that the malware and its servers were still live at the time of their report.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code is hidden in the dependency chain rather than in the visible PoC code, which makes a quick review less likely to catch it. Installing the PoC requirements pulls in a package named frint, which pulls in skytext, whose compiled component runs when the PoC is launched. The malware checks for the real PoC context, such as a file named EXPLOIT_POC.py or similar, so detonating the package by itself may show nothing.\u003c/p\u003e\n\n\u003cp\u003eOnce active, ChocoPoC collects data from Chrome, Brave, Edge, and Firefox, along with text files, notes, local databases, shell history, network settings, and process lists. The malware reads commands from a Mapbox dataset using DNS-over-HTTPS and domain fronting, while larger uploads go to a separate server at 91.132.163.78. YesWeHack and Sekoia found at least seven fake PoC repositories, and the article warns that compromising researchers could create downstream risk for trusted tools and frameworks such as Nuclei and MDUT.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers are distributing the ChocoPoC data-stealing remote access trojan through fake Python proof-of-concept repositories on GitHub that claim to exploit high-profile CVEs.","The visible proof-of-concept code appears clean because the malware is hidden in a Python dependency chain involving the frint and skytext packages.","ChocoPoC steals saved passwords, browser cookies, autofill data, browsing history, files, shell history, network settings, and process lists, and it can give attackers shell access to the victim’s machine.","YesWeHack and Sekoia found at least seven fake proof-of-concept repositories, and the skytext package alone had about 2,400 downloads, mostly on Linux.","Researchers advised checking systems for frint, skytext, slogsec, and logcrypt.cryptography, and rotating credentials and rebuilding hosts if any of them were run."],"insights":["A quick review of the visible PoC code is insufficient because the malicious component is hidden in the dependency chain rather than in the repository code researchers are likely to inspect first.","Basic sandbox detonation may miss the malware because the payload only activates when it detects the real PoC context, such as a file named EXPLOIT_POC.py or similar.","Using a throwaway virtual machine is not enough by itself, because the article says the safer control is avoiding installation of suspicious packages in the first place.","The campaign creates a potential second-order supply chain risk because compromising one researcher could let malicious code or tainted outputs reach trusted tools and frameworks such as Nuclei and MDUT.","The attackers used normal services such as Mapbox, DNS-over-HTTPS, and domain fronting to make command traffic resemble ordinary API activity."],"referencedReports":[{"title":"ChocoPoCs: Vulnerability Researchers’ Trojanised Exploits","url":"https://www.yeswehack.com/news/chocopocs-vulnerability-researchers-trojanised-exploits","publisher":"YesWeHack and Sekoia","context":"The article is based on joint findings from YesWeHack and Sekoia about ChocoPoC malware hidden in fake PoC exploit repositories.","category":"","primary":false},{"title":"Information Stealer Masquerades as LDAPNightmare PoC Exploit","url":"https://www.trendmicro.com/en_us/research/25/a/information-stealer-masquerades-as-ldapnightmare-poc-exploit.html","publisher":"Trend Micro","context":"The article cites Trend Micro’s finding of a fake PoC for CVE-2024-49113 that stole researcher data as a related prior campaign.","category":"","primary":false}],"body":"\u003cp\u003eAttackers are using fake Python proof-of-concept repositories on GitHub to target vulnerability researchers with a data-stealing trojan called ChocoPoC. The repositories claim to exploit newly public high-profile CVEs, but running them can steal saved passwords, browser cookies, files, and other local data while giving the attacker shell access. YesWeHack and Sekoia published joint findings on July 1 and warned that the malware and its servers were still live at the time of their report.\u003c/p\u003e\n\n\u003cp\u003eThe malicious code is hidden in the dependency chain rather than in the visible PoC code, which makes a quick review less likely to catch it. Installing the PoC requirements pulls in a package named frint, which pulls in skytext, whose compiled component runs when the PoC is launched. The malware checks for the real PoC context, such as a file named EXPLOIT_POC.py or similar, so detonating the package by itself may show nothing.\u003c/p\u003e\n\n\u003cp\u003eOnce active, ChocoPoC collects data from Chrome, Brave, Edge, and Firefox, along with text files, notes, local databases, shell history, network settings, and process lists. The malware reads commands from a Mapbox dataset using DNS-over-HTTPS and domain fronting, while larger uploads go to a separate server at 91.132.163.78. YesWeHack and Sekoia found at least seven fake PoC repositories, and the article warns that compromising researchers could create downstream risk for trusted tools and frameworks such as Nuclei and MDUT.\u003c/p\u003e\n"},{"n":20,"title":"Google Disrupts NetNut Residential Proxy Network Spanning 2 Million Home Devices","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/google-di
