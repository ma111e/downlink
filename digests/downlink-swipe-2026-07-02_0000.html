srupts-netnut-residential.html","time":"18:54","priority":"SHOULD READ","score":85,"tldr":"Google, working with the FBI, Lumen, and others, says it has significantly degraded NetNut/Popa, a residential proxy network that used millions of home devices such as smart TVs and streaming boxes to relay other people’s traffic. The main risk for consumers is that hidden or poorly disclosed bandwidth-sharing apps can turn their internet connection into an exit node for criminals and other threat actors.","briefOverview":"\u003cp\u003eGoogle’s Threat Intelligence Group said it worked with the FBI, Lumen, and others to significantly degrade NetNut, also tracked as Popa, a residential proxy network spread across home devices worldwide. Google estimates the network includes at least 2 million devices, including smart TVs and streaming boxes. If one of these devices is in a home, strangers can route their traffic through that household’s internet connection, leaving the home address associated with whatever activity occurs.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that residential proxy networks sell access to real home internet addresses so traffic appears to come from ordinary home browsing rather than datacenters. Operators build these networks by getting their code onto home devices, sometimes through cheap off-brand hardware with pre-installed software or free apps that hide the bandwidth-sharing function. Google said an exit node can bring outside traffic inside the home network, and in one week in June it counted 316 distinct threat clusters using suspected NetNut exit nodes, including cybercriminal and espionage groups conducting password-guessing attacks.\u003c/p\u003e\n\n\u003cp\u003eResearchers at Qurium, Synthient, Nokia Deepfield, and Spur tied Popa to NetNut, which is owned by publicly traded Israeli company Alarum Technologies. Alarum rejects the “botnet” label and says its software is for consented bandwidth-sharing that does not compromise devices, while Synthient reported that none of more than 20 apps it examined showed users a consent prompt. Google described the action as degradation rather than a complete takedown because NetNut uses reseller relationships, and similar networks can buy capacity from rivals or reappear under other brands.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google’s Threat Intelligence Group said it worked with the FBI, Lumen, and others to significantly degrade NetNut, also tracked as Popa, reducing its pool of usable devices by millions.","Google identifies NetNut as a residential proxy network spread across at least 2 million home devices worldwide, including smart TVs and streaming boxes.","In one week in June, Google counted 316 distinct threat clusters using suspected NetNut exit nodes, including cybercriminal and espionage groups conducting password-guessing attacks.","Researchers at Qurium, Synthient, Nokia Deepfield, and Spur tied Popa to NetNut, which is owned by the publicly traded Israeli company Alarum Technologies.","Google said the disruption is degradation rather than a kill because NetNut uses reseller relationships and similar networks can buy capacity from rivals or resurface under other brands."],"insights":["A seemingly separate proxy brand may still depend on the same NetNut device pool because Google says NetNut’s reseller program lets other companies sell the network under their own names.","The clearest consumer warning sign is an app that offers payment for “unused bandwidth” or “sharing your internet,” since the article identifies this as a main way these networks grow.","Alarum’s consent-based defense is weakened by Synthient’s finding that none of the more than 20 apps it examined showed users a consent prompt.","Disrupting one residential proxy network may not produce lasting impact because Google says operators can buy capacity from rivals and effectively become resellers themselves."],"referencedReports":[{"title":"Google’s Continued Disruption of Residential Proxy Networks","url":"https://cloud.google.com/blog/topics/threat-intelligence/google-continued-disruption-residential-proxy-networks","publisher":"Google Threat Intelligence Group","context":"The article cites Google Threat Intelligence Group’s post as the source for its claim that Google and partners degraded NetNut’s usable device pool by millions.","category":"","primary":false},{"title":"Popa: From Sourcing to Distribution","url":"https://synthient.com/blog/popa-from-sourcing-to-distribution","publisher":"Synthient","context":"The article cites Synthient’s controlled test showing traffic sent into NetNut’s commercial gateway came out through a device enrolled in Popa.","category":"","primary":false}],"body":"\u003cp\u003eGoogle’s Threat Intelligence Group said it worked with the FBI, Lumen, and others to significantly degrade NetNut, also tracked as Popa, a residential proxy network spread across home devices worldwide. Google estimates the network includes at least 2 million devices, including smart TVs and streaming boxes. If one of these devices is in a home, strangers can route their traffic through that household’s internet connection, leaving the home address associated with whatever activity occurs.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that residential proxy networks sell access to real home internet addresses so traffic appears to come from ordinary home browsing rather than datacenters. Operators build these networks by getting their code onto home devices, sometimes through cheap off-brand hardware with pre-installed software or free apps that hide the bandwidth-sharing function. Google said an exit node can bring outside traffic inside the home network, and in one week in June it counted 316 distinct threat clusters using suspected NetNut exit nodes, including cybercriminal and espionage groups conducting password-guessing attacks.\u003c/p\u003e\n\n\u003cp\u003eResearchers at Qurium, Synthient, Nokia Deepfield, and Spur tied Popa to NetNut, which is owned by publicly traded Israeli company Alarum Technologies. Alarum rejects the “botnet” label and says its software is for consented bandwidth-sharing that does not compromise devices, while Synthient reported that none of more than 20 apps it examined showed users a consent prompt. Google described the action as degradation rather than a complete takedown because NetNut uses reseller relationships, and similar networks can buy capacity from rivals or reappear under other brands.\u003c/p\u003e\n"},{"n":11,"title":"Supreme Court decision threatens EU-US data transfer agreement","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/supreme-court-decision-threatens-eu-us-data-sharing","time":"16:50","priority":"SHOULD READ","score":82,"tldr":"A U.S. Supreme Court ruling allowing presidents to fire FTC commissioners without cause may undermine the EU-U.S. Data Privacy Framework by weakening claims that U.S. oversight is independent. Privacy advocate Max Schrems plans to sue to invalidate the framework, threatening major transatlantic data transfers used by companies like Meta and Google.","briefOverview":"\u003cp\u003eA key data privacy agreement between the European Union and the U.S. may be in danger after a Supreme Court ruling that allows presidents to remove members of so-called independent agencies at will. Max Schrems, founder of the Vienna-based privacy advocacy organization noyb, told European officials he plans to sue to invalidate the EU-U.S. Data Privacy Framework. The framework, formally adopted by the European Commission in 2023, allows personal data to be transferred from the EU to U.S. companies.\u003c/p\u003e\n\n\u003cp\u003eThe framework requires an independent U.S. body to oversee data transfers and ensure they are regulated and limited, with the Federal Trade Commission playing the key role. On Monday, the Supreme Court held that President Donald Trump acted legally in firing FTC Commissioner Rebecca Slaughter without cause, raising questions about the FTC’s independence. Schrems said the basis for any EU-U.S. data transfer deal is dead and called on the Commission to begin an orderly exit from the U.S. cloud.\u003c/p\u003e\n\n\u003cp\u003eEuropean bodies are reviewing the ruling, with the European Commission saying it will analyze implications for the EU-U.S. agenda and the European Data Protection Board reviewing potential effects on the framework’s oversight mechanisms. If a court sides with Schrems, the decision could threaten data flows between Europe and the U.S., and Meta and Google have said they will pull out of Europe if transfers to America are no longer allowed. Experts cited in the article said the framework supports €1.7 trillion in annual transatlantic trade and that the Commission faces pressure to explain whether a lack of independence is acceptable or what it will do in response.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Max Schrems told European officials he plans to sue to invalidate the EU-U.S. Data Privacy Framework following a Supreme Court ruling affecting the independence of U.S. agencies.","The Supreme Court held that President Donald Trump acted legally in firing FTC Commissioner Rebecca Slaughter without cause, raising questions about the FTC’s independence under the data transfer framework.","The EU-U.S. Data Privacy Framework allows personal data to move from the EU to U.S. companies and relies on an independent U.S. body, with the FTC playing a key oversight role.","European officials, including the European Commission and the European Data Protection Board, said they are reviewing or analyzing the Supreme Court decision and its implications for the framework.","If a court sides with Schrems, the decision could threaten data flows between Europe and the U.S., and Meta and Google have said they will pull out of Europe if transfers to America are no longer allowed."],"insights":["Schrems argues that Europe has relied on the FTC’s independence 259 times in its data flow decisions under the current framework, making the Supreme Court ruling a direct challenge to a repeated legal foundation of the DPF.","The European Commission faces a difficult choice because, according to Joe Jones, it cannot interpret U.S. law differently from the U.S. Supreme Court and must either defend why reduced independence is acceptable or decide what action to take.","The economic exposure is unusually large for a privacy-law dispute, with the DPF supporting an estimated €1.7 trillion in annual transatlantic trade.","Replacing U.S.-based data transfers with European storage would be expensive and slow, as illustrated by TikTok’s Ireland data center effort, which Jones said has taken significant time and cost more than $10 billion."],"referencedReports":[],"body":"\u003cp\u003eA key data privacy agreement between the European Union and the U.S. may be in danger after a Supreme Court ruling that allows presidents to remove members of so-called independent agencies at will. Max Schrems, founder of the Vienna-based privacy advocacy organization noyb, told European officials he plans to sue to invalidate the EU-U.S. Data Privacy Framework. The framework, formally adopted by the European Commission in 2023, allows personal data to be transferred from the EU to U.S. companies.\u003c/p\u003e\n\n\u003cp\u003eThe framework requires an independent U.S. body to oversee data transfers and ensure they are regulated and limited, with the Federal Trade Commission playing the key role. On Monday, the Supreme Court held that President Donald Trump acted legally in firing FTC Commissioner Rebecca Slaughter without cause, raising questions about the FTC’s independence. Schrems said the basis for any EU-U.S. data transfer deal is dead and called on the Commission to begin an orderly exit from the U.S. cloud.\u003c/p\u003e\n\n\u003cp\u003eEuropean bodies are reviewing the ruling, with the European Commission saying it will analyze implications for the EU-U.S. agenda and the European Data Protection Board reviewing potential effects on the framework’s oversight mechanisms. If a court sides with Schrems, the decision could threaten data flows between Europe and the U.S., and Meta and Google have said they will pull out of Europe if transfers to America are no longer allowed. Experts cited in the article said the framework supports €1.7 trillion in annual transatlantic trade and that the Commission faces pressure to explain whether a lack of independence is acceptable or what it will do in response.\u003c/p\u003e\n"},{"n":24,"title":"Field reports from Patch the Planet","source":"blog.trailofbits.com","sourceColorIdx":6,"link":"https://blog.trailofbits.com/2026/07/02/field-reports-from-patch-the-planet/","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"Trail of Bits says OpenAI’s GPT-5.5-Cyber autonomously built a sophisticated fuzzing campaign for zlib in about a day, showing that advanced models can now perform security research work that once required significant expert time. The key takeaway is that maintainers need to proactively use similar tooling and strict validation rules before attackers do.","briefOverview":"\u003cp\u003eTrail of Bits is running Patch the Planet, an ongoing collaboration with OpenAI that pairs Trail of Bits engineers with more than 30 open-source projects. The effort aims to address the expected increase in bug reports from highly capable models such as GPT-5.5-Cyber, while open-source maintainers are already stretched thin. The plan is to use OpenAI’s latest models on real codebases, find security bugs first, work with maintainers to patch them, and reduce maintainer burden over time.\u003c/p\u003e\n\n\u003cp\u003eIn the first field report, GPT-5.5-Cyber was pointed at zlib through Codex with the \u003ccode\u003e/goal\u003c/code\u003e command and asked to find a specific class of bugs that are critically dangerous in compression libraries. The model chose to build dynamic fuzzing tooling instead of relying on static source review, which it judged to be a poor use of tokens for a heavily reviewed project. In a single day, it built harnesses across a dozen entrypoints, sanitizer and variant builds, seeds, and produced multiple findings currently undergoing coordinated disclosure.\u003c/p\u003e\n\n\u003cp\u003eThe article says the model used ASan and UBSan builds, repurposed existing edge-case tests as fuzz seeds, wrote C/C++ harnesses for many zlib entrypoints, and used compile-time variants such as \u003ccode\u003eINFLATE_STRICT\u003c/code\u003e, \u003ccode\u003eBUILDFIXED\u003c/code\u003e, and \u003ccode\u003ePKZIP_BUG_WORKAROUND\u003c/code\u003e. It also stresses that reporting discipline is essential, because models can otherwise escalate crashes that are not realistically reachable or report invalid API usage and expected parser errors. Trail of Bits concludes that bespoke fuzzing is no longer limited to skilled researchers or mature projects, and that security-critical projects should run it first with strict validity rules.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trail of Bits is running Patch the Planet with OpenAI to pair its engineers with more than 30 open-source projects and find security bugs before highly capable models create large volumes of bug reports for maintainers.","In one Patch the Planet field report, GPT-5.5-Cyber built a custom fuzzing campaign for zlib in a single day, including harnesses across a dozen entrypoints, sanitizer and variant builds, seeds, and multiple findings under coordinated disclosure.","GPT-5.5-Cyber decided that dynamic fuzz testing was a higher-value path than static source review for zlib and used the Codex /goal command to maintain the objective across multiple turns.","The model used ASan and UBSan builds, repurposed existing edge-case tests for fuzz seeds, wrote C/C++ harnesses for multiple zlib entrypoints, and used compile-time variants such as INFLATE_STRICT, BUILDFIXED, and PKZIP_BUG_WORKAROUND.","The article says bespoke fuzzing is no longer out of reach for low-skill attackers or limited to mature projects, so maintainers of security-critical code should run this kind of testing first with strict validity rules."],"insights":["The model’s most important contribution was not just generating fuzzing code, but choosing fuzzing over static review after judging that manual source inspection was unlikely to pay off for a heavily reviewed project like zlib.","The article emphasizes that useful automated security research depends on strict rules for what counts as reportable, because otherwise models can produce large volumes of confident but invalid findings.","GPT-5.5-Cyber reportedly dismissed a real crash in inflateBack because it required an unrealistic caller state, showing that reachability judgment is treated as central to reducing maintainer burden.","The most successful harness found bugs in valid gz* states created through operating system backpressure, which went beyond the default OSS-Fuzz harness shape for zlib.","Patch the Planet’s defensive premise is that the same model capabilities that help maintainers find bugs faster also remove the traditional expertise barrier that slowed casual attackers."],"referencedReports":[],"body":"\u003cp\u003eTrail of Bits is running Patch the Planet, an ongoing collaboration with OpenAI that pairs Trail of Bits engineers with more than 30 open-source projects. The effort aims to address the expected increase in bug reports from highly capable models such as GPT-5.5-Cyber, while open-source maintainers are already stretched thin. The plan is to use OpenAI’s latest models on real codebases, find security bugs first, work with maintainers to patch them, and reduce maintainer burden over time.\u003c/p\u003e\n\n\u003cp\u003eIn the first field report, GPT-5.5-Cyber was pointed at zlib through Codex with the \u003ccode\u003e/goal\u003c/code\u003e command and asked to find a specific class of bugs that are critically dangerous in compression libraries. The model chose to build dynamic fuzzing tooling instead of relying on static source review, which it judged to be a poor use of tokens for a heavily reviewed project. In a single day, it built harnesses across a dozen entrypoints, sanitizer and variant builds, seeds, and produced multiple findings currently undergoing coordinated disclosure.\u003c/p\u003e\n\n\u003cp\u003eThe article says the model used ASan and UBSan builds, repurposed existing edge-case tests as fuzz seeds, wrote C/C++ harnesses for many zlib entrypoints, and used compile-time variants such as \u003ccode\u003eINFLATE_STRICT\u003c/code\u003e, \u003ccode\u003eBUILDFIXED\u003c/code\u003e, and \u003ccode\u003ePKZIP_BUG_WORKAROUND\u003c/code\u003e. It also stresses that reporting discipline is essential, because models can otherwise escalate crashes that are not realistically reachable or report invalid API usage and expected parser errors. Trail of Bits concludes that bespoke fuzzing is no longer limited to skilled researchers or mature projects, and that security-critical projects should run it first with strict validity rules.\u003c/p\u003e\n"},{"n":31,"title":"Roblox, Minecraft, and the Insidious Internet for Children","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/roblox-minecraft-and-the-insidious-internet-for-children/","time":"19:44","priority":"SHOULD READ","score":82,"tldr":"Censys research found a large, fast-changing ecosystem of Roblox and Minecraft offerwall scams and phishing sites targeting children, with at least 437 Roblox reward sites and hundreds of spoofing domains. The key takeaway is that defenders cannot rely on threat feeds alone and need content, hostname, and infrastructure fingerprinting to detect and disrupt this abuse.","briefOverview":"\u003cp\u003eCensys researched websites targeting children who play Roblox and Minecraft with promises of free in-game currency, gift cards, perks, or account verification. The article separates the ecosystem into offerwall reward sites, which pay or claim to pay users for tasks such as surveys and app installs, and phishing or generator lures, which aim to steal credentials or private data. In a June 2026 snapshot, Censys found 437 Roblox offerwall web properties and 20 Minecraft offerwall web properties, with 6 overlapping both sets.\u003c/p\u003e\n\n\u003cp\u003eThe research argues that these sites matter because they monetize children’s time, attention, and personal data, and some run on poorly maintained infrastructure with known vulnerabilities. The Roblox offerwall population was fragmented across many brands, heavily used free domain-validated certificates, and frequently sat behind Cloudflare or cheap hosting. Censys also found exposed origins and shared operator signals, including the Rocash and RbxBest example where content pivots, certificates, analytics IDs, ad IDs, and backend services linked related properties.\u003c/p\u003e\n\n\u003cp\u003eThe phishing portion highlights a Roblox cluster on 179.43.150[.]242 using typosquats, fake Bloxlink and RoVer verification pages, short-link front doors, and repeated kit subdomains such as auth, arkoselabs, twostepverification, thumbnails, and metrics. The article says Minecraft phishing differs because it often targets Microsoft accounts through Minecraft-themed sign-in or verification lures, and some abuse happens inside Discord through one-time-code social engineering. Its conclusion is that defenders should rely on content fingerprints, hostname patterns, certificate names, and infrastructure analysis rather than waiting for conventional threat feeds to flag fast-rotating domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys research found 437 web properties matching a Roblox offerwall reward-site fingerprint in a June 2026 snapshot.","The Roblox offerwall sites commonly promise Robux or gift cards in exchange for tasks such as surveys, app installs, watching videos, or completing offers.","Censys found that many Roblox phishing domains impersonate Roblox, Bloxlink, or RoVer, including typosquats, fake verification pages, and short-link front doors.","The article states that Minecraft phishing often targets Microsoft accounts because Minecraft accounts migrated to Microsoft logins.","The research concludes that defenders should use content fingerprints and infrastructure analysis because conventional threat feeds may miss or lag behind these fast-changing child-targeted fraud sites."],"insights":["The Rocash example showed that pivoting on page content can reveal an unproxied origin behind Cloudflare, and in this case the origin certificate linked a children’s reward site to a gambling-adjacent brand.","Shared monetization identifiers such as Google Analytics tags, AdSense publisher IDs, and NitroPay ad units were described as higher-fidelity links between offerwall properties than page titles or branding.","The Roblox phishing cluster reused a repeated subdomain skeleton, including auth, games, arkoselabs, twostepverification, thumbnails, and metrics, making the kit structure a more durable detection signal than individual rotating domains.","The article notes that offerwall operators tend to use Cloudflare and budget hosting to appear trustworthy, while the highlighted phishing operator used exposed bulletproof hosting to resist takedowns.","Minecraft phishing has a different detection surface from Roblox phishing because it often leads to Microsoft sign-in theft or Discord one-time-code social engineering rather than direct game-currency or username-based lures."],"referencedReports":[],"body":"\u003cp\u003eCensys researched websites targeting children who play Roblox and Minecraft with promises of free in-game currency, gift cards, perks, or account verification. The article separates the ecosystem into offerwall reward sites, which pay or claim to pay users for tasks such as surveys and app installs, and phishing or generator lures, which aim to steal credentials or private data. In a June 2026 snapshot, Censys found 437 Roblox offerwall web properties and 20 Minecraft offerwall web properties, with 6 overlapping both sets.\u003c/p\u003e\n\n\u003cp\u003eThe research argues that these sites matter because they monetize children’s time, attention, and personal data, and some run on poorly maintained infrastructure with known vulnerabilities. The Roblox offerwall population was fragmented across many brands, heavily used free domain-validated certificates, and frequently sat behind Cloudflare or cheap hosting. Censys also found exposed origins and shared operator signals, including the Rocash and RbxBest example where content pivots, certificates, analytics IDs, ad IDs, and backend services linked related properties.\u003c/p\u003e\n\n\u003cp\u003eThe phishing portion highlights a Roblox cluster on 179.43.150[.]242 using typosquats, fake Bloxlink and RoVer verification pages, short-link front doors, and repeated kit subdomains such as auth, arkoselabs, twostepverification, thumbnails, and metrics. The article says Minecraft phishing differs because it often targets Microsoft accounts through Minecraft-themed sign-in or verification lures, and some abuse happens inside Discord through one-time-code social engineering. Its conclusion is that defenders should rely on content fingerprints, hostname patterns, certificate names, and infrastructure analysis rather than waiting for conventional threat feeds to flag fast-rotating domains.\u003c/p\u003e\n"},{"n":33,"title":"Indirect Prompt Injection in Web Content Targets AI Agents","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/indirect-prompt-injection-web-content-targets-ai-agents","time":"17:48","priority":"SHOULD READ","score":82,"tldr":"Zscaler ThreatLabz found malicious websites using hidden indirect prompt injection, SEO poisoning, and typosquatting to manipulate AI agents into trusting fake sites or even making payments. Testing across 26 LLMs showed some models were successfully misled, highlighting web content as a growing attack surface for autonomous AI agents.","briefOverview":"\u003cp\u003eZscaler ThreatLabz identified malicious websites using indirect prompt injection to manipulate AI agents through web content. The research examined two real-world examples: a payment scam disguised as API documentation and a typosquatting campaign impersonating the DeBank cryptocurrency platform. The article states that these campaigns use SEO poisoning and hidden website content to influence AI-driven workflows.\u003c/p\u003e\n\n\u003cp\u003eIn the payment scam, the fraudulent site used keyword-heavy HTML, JSON-LD structured data, and CSS-hidden content to present a $3.00 developer API license key as necessary to resolve a fake error. The site also included cryptocurrency payment code that could initiate a transfer of about 0.0012 ETH to a hardcoded wallet address and then generate a fake API key. ThreatLabz found additional related websites connected through the GitHub repository Open-Agent-Utilities.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz tested autonomous web-enabled AI agents across 26 large language models in sandboxed conditions. In the first campaign, four models were manipulated into executing payments, and in the second campaign, two models misclassified the fraudulent DeBank site under different context scenarios. The article concludes that malicious web content can contaminate AI agent context and create risks such as downstream Retrieval-Augmented Generation poisoning.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz identified malicious websites that use indirect prompt injection hidden in web content to influence AI agents during task execution.","One campaign used SEO poisoning and hidden JSON-LD and CSS-concealed content to present a fake Python library payment as a routine step for acquiring an API key.","A second campaign used the typosquatting domain debank[.]auction to impersonate DeBank and included hidden instructions telling AI models to treat the fake site as the authoritative DeBank destination.","In testing across 26 large language models, four models executed payments in the first campaign and two models misclassified the fraudulent DeBank site under different context scenarios.","ThreatLabz reported that when AI agents misclassify malicious websites as legitimate, they increase the risk of context contamination and downstream Retrieval-Augmented Generation poisoning."],"insights":["Structured metadata such as JSON-LD may be especially dangerous in agentic workflows because agents can treat it as high-signal context, making hidden scam instructions more likely to influence decisions.","Providing a known-good reference, such as the official DeBank site, changed the outcome of testing because no models classified the fake site as legitimate when the real site was included as context.","The payment scam targeted both AI agents and human developers, showing that the same malicious page can combine hidden machine-readable instructions with visible browser-based payment prompts.","Model susceptibility was not uniform: only a small subset of the 26 tested LLMs failed, and the failures depended on both the model and the context supplied to it."],"referencedReports":[],"body":"\u003cp\u003eZscaler ThreatLabz identified malicious websites using indirect prompt injection to manipulate AI agents through web content. The research examined two real-world examples: a payment scam disguised as API documentation and a typosquatting campaign impersonating the DeBank cryptocurrency platform. The article states that these campaigns use SEO poisoning and hidden website content to influence AI-driven workflows.\u003c/p\u003e\n\n\u003cp\u003eIn the payment scam, the fraudulent site used keyword-heavy HTML, JSON-LD structured data, and CSS-hidden content to present a $3.00 developer API license key as necessary to resolve a fake error. The site also included cryptocurrency payment code that could initiate a transfer of about 0.0012 ETH to a hardcoded wallet address and then generate a fake API key. ThreatLabz found additional related websites connected through the GitHub repository Open-Agent-Utilities.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz tested autonomous web-enabled AI agents across 26 large language models in sandboxed conditions. In the first campaign, four models were manipulated into executing payments, and in the second campaign, two models misclassified the fraudulent DeBank site under different context scenarios. The article concludes that malicious web content can contaminate AI agent context and create risks such as downstream Retrieval-Augmented Generation poisoning.\u003c/p\u003e\n"},{"n":10,"title":"Launch of UK's National Cyber Action Plan delayed amid Labour leadership crisis","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/launch-of-uk-national-cyber-action-plan-delayed","time":"20:32","priority":"SHOULD READ","score":78,"tldr":"The UK’s National Cyber Action Plan has been delayed again due to political uncertainty after Keir Starmer’s resignation and the Labour leadership contest. The postponement adds to concerns that major cybersecurity policy efforts are being slowed despite serious recent cyber incidents affecting UK critical sectors and businesses.","briefOverview":"\u003cp\u003eBritain\u0026rsquo;s National Cyber Action Plan has been delayed again following Prime Minister Keir Starmer\u0026rsquo;s resignation, according to multiple sources cited in the article. The plan had been due for publication on Monday but was postponed amid uncertainty over the Labour Party leadership contest opening July 9. A government spokesperson said the government remains committed to publishing the plan and cited work on the Cyber Security and Resilience Bill, the Cyber Resilience Pledge, and National Cyber Security Centre support.\u003c/p\u003e\n\n\u003cp\u003eThe delay adds to concerns that cybersecurity remains a low political priority in Westminster. The article notes that the Cyber Security and Resilience Bill took more than four years to reach Parliament and is not expected to be enforced until 2028. It also cites recent major incidents, including the Synnovis ransomware attack that disrupted London hospitals and a Jaguar Land Rover cyberattack that halted vehicle production for more than a month and was estimated to cost the British economy £1.9 billion.\u003c/p\u003e\n\n\u003cp\u003eRecorded Future News understands the plan will include three pillars focused on Threat, Growth and Resilience. NCSC chief executive Richard Horne described a focus on the “near, mid and far spaces” of cyberspace, including individual organizations, privately owned cloud and telecommunications infrastructure, and offensive action against adversaries. A related Cyber Resilience Pledge is still expected to proceed, with FTSE 350 companies asked to commit to board-level cybersecurity responsibility, use of the NCSC Early Warning service, and Cyber Essentials certification across supply chains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Britain's National Cyber Action Plan, which is intended to defend the wider economy against state-backed and criminal hacking, has been delayed following Prime Minister Keir Starmer's resignation and uncertainty over the Labour Party leadership contest.","A government spokesperson said the government remains committed to publishing the National Cyber Action Plan and cited work on the Cyber Security and Resilience Bill, the Cyber Resilience Pledge, and support from the National Cyber Security Centre.","A number of FTSE 350 companies are still expected to sign the government's voluntary Cyber Resilience Pledge, which commits firms to improving their digital defenses.","The Cyber Security and Resilience Bill took more than four years to reach Parliament and is not expected to be enforced until 2028, according to the article.","Recorded Future News understands the National Cyber Action Plan will include three pillars focused on Threat, Growth and Resilience."],"insights":["The Cyber Security and Resilience Bill is now not expected to be enforced until 2028, meaning the replacement for the NIS Regulations may arrive a decade after the rules it was designed to update.","The government underwrote a £1.5 billion loan for Jaguar Land Rover after a major cyberattack while the Cyber Security and Resilience Bill remained unintroduced, showing that cyber incidents have already forced direct economic intervention.","The National Cyber Action Plan is expected to emphasize privately owned cloud, technology and telecommunications infrastructure as a central area where government wants to work with providers to disrupt attackers.","The Cyber Resilience Pledge’s requirements would push cybersecurity responsibility to company boards, connect firms to the NCSC’s Early Warning service, and extend Cyber Essentials certification demands into supply chains."],"referencedReports":[],"body":"\u003cp\u003eBritain\u0026rsquo;s National Cyber Action Plan has been delayed again following Prime Minister Keir Starmer\u0026rsquo;s resignation, according to multiple sources cited in the article. The plan had been due for publication on Monday but was postponed amid uncertainty over the Labour Party leadership contest opening July 9. A government spokesperson said the government remains committed to publishing the plan and cited work on the Cyber Security and Resilience Bill, the Cyber Resilience Pledge, and National Cyber Security Centre support.\u003c/p\u003e\n\n\u003cp\u003eThe delay adds to concerns that cybersecurity remains a low political priority in Westminster. The article notes that the Cyber Security and Resilience Bill took more than four years to reach Parliament and is not expected to be enforced until 2028. It also cites recent major incidents, including the Synnovis ransomware attack that disrupted London hospitals and a Jaguar Land Rover cyberattack that halted vehicle production for more than a month and was estimated to cost the British economy £1.9 billion.\u003c/p\u003e\n\n\u003cp\u003eRecorded Future News understands the plan will include three pillars focused on Threat, Growth and Resilience. NCSC chief executive Richard Horne described a focus on the “near, mid and far spaces” of cyberspace, including individual organizations, privately owned cloud and telecommunications infrastructure, and offensive action against adversaries. A related Cyber Resilience Pledge is still expected to proceed, with FTSE 350 companies asked to commit to board-level cybersecurity responsibility, use of the NCSC Early Warning service, and Cyber Essentials certification across supply chains.\u003c/p\u003e\n"},{"n":21,"title":"One Hyphen From Trusted: A Lookalike-Domain Vendor Impersonation That Beat the Eye and the Authentication Stack","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/vendor-lookalike-domain-display-name-impersonation-pnone","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"An attacker impersonated a trusted supplier using a one-hyphen lookalike domain and exact contact display name, with SPF, DKIM, and DMARC all passing because the domain was attacker-controlled. The key lesson is that email authentication alone cannot stop lookalike-domain vendor impersonation; defenses must verify sender relationships and link destinations.","briefOverview":"\u003cp\u003eA manufacturing engineering staffer received an email that appeared to come from a supplier contact they already knew. The display name matched the real contact, the message used a routine sales pitch about lowering beveling costs, and the signature included typical business details. The sender’s domain, however, was a lookalike that was one hyphen different from the legitimate supplier’s domain.\u003c/p\u003e\n\n\u003cp\u003eThe article describes this as vendor email compromise, where an attacker abuses trust between an organization and a supplier. The attacker registered two lookalike domains through GoDaddy with WHOIS privacy, both on one-year terms and with unsigned DNSSEC, while the legitimate supplier’s domain had existed since 2016. The message pointed recipients toward the supplier’s real website, so the deception was concentrated in the From line and the familiar-looking domain.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, and DMARC because it was genuinely sent from infrastructure authorized for the attacker-owned lookalike domain through a Gmail-API sales-engagement platform. The lookalike domain’s DMARC policy was set to p=none, meaning there was no enforcement action. The article says the message was ultimately caught by relationship analysis that recognized the known contact name arriving from a domain that contact had never used, along with a malicious verdict on a link whose visible text did not match its actual destination.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker registered lookalike domains for a known supplier, including a hyphenated near-miss used as the sending and reply-to domain.","The email used the exact display name of a supplier contact the recipient already knew and presented a routine sales pitch about lowering beveling costs.","SPF, DKIM, and DMARC all passed because the attacker controlled the lookalike sending domain and sent the message through a Gmail-API sales-engagement platform.","The lookalike domain’s DMARC policy was set to p=none, meaning it was monitor-only and did not require enforcement action.","The message was flagged through relationship analysis that recognized the known contact name was arriving from a domain that contact had never used, along with a malicious link verdict."],"insights":["Email authentication can give a false sense of safety when an attacker owns the lookalike domain, because the checks only confirm authorization for the displayed sending domain and do not compare it with the supplier’s real domain.","A monitor-only DMARC policy on an attacker-controlled domain helps preserve deliverability, so DMARC enforcement on legitimate domains cannot prevent abuse of newly registered lookalikes.","Commodity sales-engagement tooling can make malicious vendor impersonation resemble normal business outreach, including campaign sequencing and Gmail API delivery.","The most effective detection signal in this case was relationship history: a familiar contact name appearing from a domain that contact had never used before.","Visible link text is not enough to judge safety, because the article describes a link whose displayed domain-like text differed from the actual destination and was flagged by scanning."],"referencedReports":[],"body":"\u003cp\u003eA manufacturing engineering staffer received an email that appeared to come from a supplier contact they already knew. The display name matched the real contact, the message used a routine sales pitch about lowering beveling costs, and the signature included typical business details. The sender’s domain, however, was a lookalike that was one hyphen different from the legitimate supplier’s domain.\u003c/p\u003e\n\n\u003cp\u003eThe article describes this as vendor email compromise, where an attacker abuses trust between an organization and a supplier. The attacker registered two lookalike domains through GoDaddy with WHOIS privacy, both on one-year terms and with unsigned DNSSEC, while the legitimate supplier’s domain had existed since 2016. The message pointed recipients toward the supplier’s real website, so the deception was concentrated in the From line and the familiar-looking domain.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, and DMARC because it was genuinely sent from infrastructure authorized for the attacker-owned lookalike domain through a Gmail-API sales-engagement platform. The lookalike domain’s DMARC policy was set to p=none, meaning there was no enforcement action. The article says the message was ultimately caught by relationship analysis that recognized the known contact name arriving from a domain that contact had never used, along with a malicious verdict on a link whose visible text did not match its actual destination.\u003c/p\u003e\n"},{"n":32,"title":"The 2026 Verizon DBIR Stopped Asking How Attackers Get in and Started Asking Where They Go","source":"xmcyber.com","sourceColorIdx":9,"link":"https://xmcyber.com/blog/the-2026-verizon-dbir-stopped-asking-how-attackers-get-in-and-started-asking-where-they-go/","time":"12:12","priority":"SHOULD READ","score":78,"tldr":"The article argues that the 2026 Verizon DBIR shows organizations should focus less exclusively on patching and more on mapping attack paths through permissions, configurations, and trust relationships. Verizon’s data suggests privilege management and attack graph analysis are critical because most privilege escalation does not rely on vulnerabilities.","briefOverview":"\u003cp\u003eThe article discusses the 2026 Verizon DBIR, which found that exploitation of vulnerabilities became the top initial access vector at 31% of breaches, up from 20% the year before. The author argues that the natural response of “patch faster” is not enough. For the first time, the DBIR also used attack graph analysis on real environments to examine what happens after attackers get in.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, Verizon found that 16% of organizations had about 80% exposure, meaning an attacker with low-level privileges had an 80% or better chance of reaching a key administrative account. The article says 83% of privilege escalation incidents involve no vulnerability, and that privilege management, configurations, and password policies address more escalation techniques than patches. It presents permissions, group memberships, trust relationships, and misconfigured delegations as the paths attackers can use after initial access.\u003c/p\u003e\n\n\u003cp\u003eThe article also cites Verizon’s patching data, including that only 26% of CISA KEV vulnerabilities were fully remediated in 2025 and that median time to full resolution rose to 43 days. It says organizations had 50% more critical vulnerabilities to patch than the previous year, while many KEV vulnerabilities remained open seven days after detection regardless of maturity. The article concludes that organizations should map attack paths, find choke points where one fix closes many routes, and give privilege management the same operational maturity as patching.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The 2026 Verizon DBIR reported that exploitation of vulnerabilities became the top initial access vector at 31% of breaches, up from 20% the previous year.","The DBIR found that 83% of privilege escalation incidents involve no vulnerability.","Verizon’s attack graph analysis found that 16% of organizations had about 80% exposure, meaning an attacker with low-level privileges had an 80% or better chance of reaching a key administrative account.","The article states that escalation mitigation is more strongly addressed by privilege management, configurations, and password policies than by patches.","Verizon found that only 26% of CISA KEV vulnerabilities were fully remediated in 2025, while the median time to full resolution rose to 43 days."],"insights":["The article argues that responding to the rise in vulnerability exploitation by simply trying to patch faster misses the larger risk, because most escalation paths are created by permissions, configurations, and trust relationships rather than unpatched flaws.","Attack graph analysis is presented as a way to find shared weak points, such as over-permissioned service accounts or nested group memberships, where one fix can close many possible attacker paths.","The article highlights an operational imbalance: patch management often has mature teams and reporting, while privilege hygiene is described as relying on spreadsheets and unpopular quarterly reviews despite addressing a larger share of escalation risk.","Verizon’s patching data supports a shift from patching everything to prioritizing vulnerabilities with recent exploitation activity, because remediation rates are falling while critical vulnerability volume and resolution time are increasing."],"referencedReports":[{"title":"2026 Verizon Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/reports/dbir/","publisher":"Verizon","context":"The article builds its argument around findings from Verizon’s 2026 DBIR, including initial access trends, attack graph analysis, privilege escalation data, and patching metrics.","category":"","primary":false}],"body":"\u003cp\u003eThe article discusses the 2026 Verizon DBIR, which found that exploitation of vulnerabilities became the top initial access vector at 31% of breaches, up from 20% the year before. The author argues that the natural response of “patch faster” is not enough. For the first time, the DBIR also used attack graph analysis on real environments to examine what happens after attackers get in.\u003c/p\u003e\n\n\u003cp\u003eAccording to the article, Verizon found that 16% of organizations had about 80% exposure, meaning an attacker with low-level privileges had an 80% or better chance of reaching a key administrative account. The article says 83% of privilege escalation incidents involve no vulnerability, and that privilege management, configurations, and password policies address more escalation techniques than patches. It presents permissions, group memberships, trust relationships, and misconfigured delegations as the paths attackers can use after initial access.\u003c/p\u003e\n\n\u003cp\u003eThe article also cites Verizon’s patching data, including that only 26% of CISA KEV vulnerabilities were fully remediated in 2025 and that median time to full resolution rose to 43 days. It says organizations had 50% more critical vulnerabilities to patch than the previous year, while many KEV vulnerabilities remained open seven days after detection regardless of maturity. The article concludes that organizations should map attack paths, find choke points where one fix closes many routes, and give privilege management the same operational maturity as patching.\u003c/p\u003e\n"},{"n":1,"title":"Opera rolls out Paste Protect feature to fight ClickFix attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/opera-rolls-out-paste-protect-feature-to-fight-clickfix-attacks/","time":"10:46","priority":"MAY READ","score":72,"tldr":"Opera has launched Paste Protect, a default-on browser security feature that blocks suspicious commands from being copied to the clipboard to prevent ClickFix-style social engineering attacks. Users can review blocked content, manually approve it after a delay, or allow trusted sites.","briefOverview":"\u003cp\u003eOpera has introduced Paste Protect, a security feature designed to block ClickFix-style attacks that trick users into executing malicious commands through social engineering. ClickFix attacks deceive victims into copying dangerous code or commands to the clipboard and then running them in a command-line interface. These commands execute with the user’s privileges, can bypass existing security defenses, and often lead to information-stealer malware.\u003c/p\u003e\n\n\u003cp\u003ePaste Protect blocks potentially harmful commands before they reach the browser clipboard, whether the copy action is initiated by the user or by a website. Opera says the feature uses platform-specific detection rules to scan copied content for patterns commonly associated with malicious scripts and commands on Windows, macOS, and Linux. The feature builds on Opera’s Hijack protection and adds a new Injection protection component.\u003c/p\u003e\n\n\u003cp\u003eWhen Paste Protect detects suspicious clipboard content, it blocks the copy operation, displays a warning, and shows a red security indicator in the browser address bar. Users can view the first 120 characters of the blocked script and approve copying after a 5-second timeout. Users can also create allow-lists for trusted websites, and Paste Protect is enabled by default in the latest Opera release.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Opera has introduced Paste Protect, a security feature designed to block ClickFix-style attacks that trick users into copying and executing malicious commands.","Paste Protect blocks potentially harmful commands before they reach the browser clipboard, whether the copy action is initiated by the user or by a website.","Opera says the feature uses platform-specific detection rules to scan copied content for malicious script and command patterns on Windows, macOS, and Linux.","When suspicious clipboard content is detected, Opera blocks the copy action, displays a warning, and shows a red security indicator in the browser address bar.","Users can view the first 120 characters of a blocked script, approve copying after a 5-second timeout, or allow trusted websites to copy scripts."],"insights":["Opera is moving the defensive check earlier in the attack chain by blocking harmful content before it reaches the clipboard, rather than only warning when a user pastes into a command-line interface.","Paste Protect covers both user-initiated copying and copy actions initiated by websites, addressing cases where the clipboard could be manipulated without the user intentionally selecting a command.","The feature balances protection with developer workflows by allowing users to inspect the first 120 characters of blocked content, override the block after a 5-second delay, and create trusted-site allow-lists.","The article shows that browser-level protections are becoming more relevant against ClickFix attacks because the technique relies on social engineering rather than exploiting a software flaw."],"referencedReports":[],"body":"\u003cp\u003eOpera has introduced Paste Protect, a security feature designed to block ClickFix-style attacks that trick users into executing malicious commands through social engineering. ClickFix attacks deceive victims into copying dangerous code or commands to the clipboard and then running them in a command-line interface. These commands execute with the user’s privileges, can bypass existing security defenses, and often lead to information-stealer malware.\u003c/p\u003e\n\n\u003cp\u003ePaste Protect blocks potentially harmful commands before they reach the browser clipboard, whether the copy action is initiated by the user or by a website. Opera says the feature uses platform-specific detection rules to scan copied content for patterns commonly associated with malicious scripts and commands on Windows, macOS, and Linux. The feature builds on Opera’s Hijack protection and adds a new Injection protection component.\u003c/p\u003e\n\n\u003cp\u003eWhen Paste Protect detects suspicious clipboard content, it blocks the copy operation, displays a warning, and shows a red security indicator in the browser address bar. Users can view the first 120 characters of the blocked script and approve copying after a 5-second timeout. Users can also create allow-lists for trusted websites, and Paste Protect is enabled by default in the latest Opera release.\u003c/p\u003e\n"},{"n":25,"title":"Missed incidents, persistent threats, and response gaps: Insights from compromise assessment projects","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/compromise-assessment-findings-2025/120542/","time":"09:00","priority":"MAY READ","score":60,"tldr":"Kaspersky’s 2025 compromise assessments found that many organizations miss serious intrusions for months or years because tools are poorly monitored, untuned, or lack sufficient detection coverage. The key takeaway is that regular compromise assessments, continuous monitoring, threat hunting, and mature incident response processes are essential to find hidden persistence before incidents become severe.","briefOverview":"\u003cp\u003eKaspersky’s analysis of 2025 compromise assessment engagements found that many organizations had missed incidents that remained undetected for weeks, months, or years. The report says 30.8% of incidents had activity spanning more than three months, and 52% of high-severity compromises were discovered only after 90 days of going undetected. The oldest incident found in 2025 had gone undetected for four years.\u003c/p\u003e\n\n\u003cp\u003eThe assessment data showed that post-incident checkups had the highest share of high-severity findings, while regular audits had the lowest share of high-severity issues. Kaspersky linked missed incidents to gaps such as insufficient detection fidelity, missing alert-driven monitoring, weak vulnerability and configuration management, lack of structured threat hunting, and inadequate security awareness. The report also found that 40% of discovered web shells were located in backups, creating a risk that malicious files could be restored after response work.\u003c/p\u003e\n\n\u003cp\u003eSeveral case studies illustrated the impact of these gaps, including dormant backdoors found after incident response, four-year-old NSABuffMiner activity on domain controllers, Impacket activity leading to Cobalt Strike and Mimikatz deployment, and in-memory PurpleFox infections missed because memory inspection was disabled. Remote management tools and living-off-the-land binaries appeared in every engagement that resulted in incident detection. Kaspersky recommended detection engine health checks, low-confidence alert validation, \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e monitoring, threat hunting, stronger vulnerability management, updated awareness training, tabletop exercises, and clearer communication procedures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky’s 2025 compromise assessments found that 30.8% of incidents had activity spanning more than three months, and 52% of high-severity compromises were discovered only after 90 days of going undetected.","Organizations that requested compromise assessments after a cybersecurity incident had the highest proportion of high-severity findings at 40.7%, while regular audit engagements had the lowest high-severity share at 27.7%.","Kaspersky reported that 40% of discovered web shells were located in backups, creating a risk that malicious files could be restored after incident response activities.","Remote management tools and living-off-the-land binaries were observed in every compromise assessment engagement that resulted in an incident detection in 2025.","The report states that 60.7% of incidents involved insufficient detection fidelity, including cases where no high-confidence alerts were generated by endpoint protection, endpoint detection, or related log sources."],"insights":["Post-incident response alone often leaves blind spots because it is usually limited to containing the known incident, while broader compromise assessments in the article uncovered additional backdoors on systems outside the original response scope.","Backups can preserve an intrusion rather than protect against it, as the article describes web shells stored in backups and later restored to systems after cleanup efforts.","Outsourcing security monitoring does not guarantee effective detection, since the article found that MSSP-supported projects still had missed incidents tied to low detection coverage and about half had basic Windows audit gaps.","Incident response plans need to be updated during an investigation, as 39% of engagements required mid-engagement plan changes after new evidence such as hidden tasks, new command-and-control details, or lateral movement paths was discovered.","Internal reverse engineering capability was associated with no high-severity malware-analysis cases in the article’s sample, suggesting that in-house technical analysis skills can materially improve incident outcomes."],"referencedReports":[{"title":"From Albania to the Middle East: The Scarred Manticore is Listening","url":"https://research.checkpoint.com/2023/from-albania-to-the-middle-east-the-scarred-manticore-is-listening/","publisher":"Check Point Research","context":"The article references this research when discussing LionTail variants attributed to the Scarred Manticore actor.","category":"","primary":false},{"title":"Microsoft Security Bulletin MS17-010 - Critical","url":"https://learn.microsoft.com/en-us/security-updates/securitybulletins/2017/ms17-010","publisher":"Microsoft","context":"The article links to Microsoft’s MS17-010 bulletin while describing NSABuffMiner spreading via SMB by exploiting the EternalBlue vulnerability.","category":"","primary":false}],"body":"\u003cp\u003eKaspersky’s analysis of 2025 compromise assessment engagements found that many organizations had missed incidents that remained undetected for weeks, months, or years. The report says 30.8% of incidents had activity spanning more than three months, and 52% of high-severity compromises were discovered only after 90 days of going undetected. The oldest incident found in 2025 had gone undetected for four years.\u003c/p\u003e\n\n\u003cp\u003eThe assessment data showed that post-incident checkups had the highest share of high-severity findings, while regular audits had the lowest share of high-severity issues. Kaspersky linked missed incidents to gaps such as insufficient detection fidelity, missing alert-driven monitoring, weak vulnerability and configuration management, lack of structured threat hunting, and inadequate security awareness. The report also found that 40% of discovered web shells were located in backups, creating a risk that malicious files could be restored after response work.\u003c/p\u003e\n\n\u003cp\u003eSeveral case studies illustrated the impact of these gaps, including dormant backdoors found after incident response, four-year-old NSABuffMiner activity on domain controllers, Impacket activity leading to Cobalt Strike and Mimikatz deployment, and in-memory PurpleFox infections missed because memory inspection was disabled. Remote management tools and living-off-the-land binaries appeared in every engagement that resulted in incident detection. Kaspersky recommended detection engine health checks, low-confidence alert validation, \u003csup\u003e24\u003c/sup\u003e\u0026frasl;\u003csub\u003e7\u003c/sub\u003e monitoring, threat hunting, stronger vulnerability management, updated awareness training, tabletop exercises, and clearer communication procedures.\u003c/p\u003e\n"},{"n":7,"title":"ConsentFix and ClickFix: How Microsoft 365 Accounts are Hijacked in 3 Seconds","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/consentfix-and-clickfix-how-microsoft-365-accounts-are-hijacked-in-3-seconds/","time":"14:00","priority":"MAY READ","score":58,"tldr":"ConsentFix and ClickFix phishing attacks hijack Microsoft 365 accounts by tricking users into routine-looking actions, such as pressing hotkeys or dragging a localhost link, that expose OAuth/session tokens and bypass passwords and MFA. The key defense is to pair user skepticism with endpoint and identity monitoring for suspicious PowerShell activity and unusual session logins.","briefOverview":"\u003cp\u003eThe article explains how ClickFix and ConsentFix attacks turn routine user actions into account compromise. ClickFix uses fake prompts that tell victims to press keyboard shortcuts, which paste and execute attacker-supplied commands on their own machine. ConsentFix is described as a newer variant that targets Microsoft 365 sign-in and consent flows, where a victim may unknowingly surrender tokens needed for session access.\u003c/p\u003e\n\n\u003cp\u003eConsentFix lures often arrive through trusted platforms such as Dropbox or DocSend and may be placed behind a password that makes security inspection harder. The victim is shown what appears to be a standard Microsoft authentication screen and is asked to drag a localhost callback link into the browser. According to the article, that step can give attackers access to Microsoft 365 email and other services without the victim typing a password into a fake form.\u003c/p\u003e\n\n\u003cp\u003eThe article says a detailed ConsentFix walkthrough, including working code, infrastructure screenshots, and a video tutorial, appeared on a public Russian cybercrime forum by early March 2026. It argues that awareness is useful because these attacks depend on people moving through familiar workflows without pausing, but awareness alone is not enough. The article recommends detection coverage for signs such as unusual PowerShell activity from normal user processes and new session logins from unexpected locations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ClickFix attacks trick victims with fake prompts that instruct them to press keyboard shortcuts, causing attacker-supplied commands to be pasted and executed on the victim’s own machine.","ConsentFix targets Microsoft 365 OAuth consent flows by using phishing lures and a drag-and-drop localhost callback link to steal OAuth tokens and gain session access without a password or MFA.","ConsentFix lures are often delivered through trusted platforms such as Dropbox or DocSend, sometimes protected by a password that makes security inspection harder.","By early March 2026, a detailed ConsentFix walkthrough with working code, infrastructure screenshots, and a video tutorial had been posted to a public Russian cybercrime forum.","The article says defenders should combine user awareness with endpoint and identity monitoring for signals such as unusual PowerShell activity from normal user processes and new session logins from unexpected locations."],"insights":["These attacks succeed by abusing routine online habits, such as accepting prompts or following verification steps, rather than relying on a software vulnerability or direct firewall bypass.","ConsentFix is especially deceptive because victims are not entering credentials into a fake form; they are completing what appears to be a legitimate Microsoft 365 sign-in flow while the session itself is stolen.","Password-protected lures sent through trusted services like Dropbox or DocSend can make the phishing flow appear more credible while also making it harder for security tools to inspect.","The public release of working ConsentFix code, screenshots, and a tutorial lowers the skill required to run the attack, increasing the risk that more criminals can adopt it.","The article highlights that detection should focus on behavioral traces after the user action, such as unusual PowerShell activity from normal user processes and new session logins from unexpected locations."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how ClickFix and ConsentFix attacks turn routine user actions into account compromise. ClickFix uses fake prompts that tell victims to press keyboard shortcuts, which paste and execute attacker-supplied commands on their own machine. ConsentFix is described as a newer variant that targets Microsoft 365 sign-in and consent flows, where a victim may unknowingly surrender tokens needed for session access.\u003c/p\u003e\n\n\u003cp\u003eConsentFix lures often arrive through trusted platforms such as Dropbox or DocSend and may be placed behind a password that makes security inspection harder. The victim is shown what appears to be a standard Microsoft authentication screen and is asked to drag a localhost callback link into the browser. According to the article, that step can give attackers access to Microsoft 365 email and other services without the victim typing a password into a fake form.\u003c/p\u003e\n\n\u003cp\u003eThe article says a detailed ConsentFix walkthrough, including working code, infrastructure screenshots, and a video tutorial, appeared on a public Russian cybercrime forum by early March 2026. It argues that awareness is useful because these attacks depend on people moving through familiar workflows without pausing, but awareness alone is not enough. The article recommends detection coverage for signs such as unusual PowerShell activity from normal user processes and new session logins from unexpected locations.\u003c/p\u003e\n"},{"n":8,"title":"Microsoft fixes bug that removed Copilot buttons in Outlook","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-fixes-bug-that-removed-copilot-button-in-outlook/","time":"12:15","priority":"MAY READ","score":58,"tldr":"Microsoft fixed a Classic Outlook bug that made Copilot Chat/Copilot buttons disappear for Windows users with Copilot Chat Basic licenses. Affected users should restart Outlook and update Office, or use new Outlook/OWA or roll back to an earlier Current Channel build if needed.","briefOverview":"\u003cp\u003eMicrosoft fixed a known issue that caused the Copilot Chat or Copilot buttons in Classic Outlook to disappear for Windows users with the Copilot Chat Basic license. Affected users could lose the Copilot button from the top-right area above the ribbon, the left app bar, the More Apps area, or the side navigation. Copilot could also appear in Add Apps but fail to open, or show as unavailable or grayed out when added through ribbon customization.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the Outlook Team addressed the issue with a service change on June 29, 2026. Users who still cannot see the Copilot buttons in Classic Outlook are advised to restart the email client to receive the change immediately. Microsoft also recommended updating to the latest build through File, Office Account, Update Options, and Update Now.\u003c/p\u003e\n\n\u003cp\u003eFor users who cannot upgrade, Microsoft listed workarounds including reverting to Current Channel build 16.0.20026.20168 or using the new Outlook or Outlook Web Access. The article also notes that Microsoft is investigating a separate known issue causing unexpected Outlook crashes on systems running Kaspersky Antivirus, linked to Kaspersky Mail Checker mcou.dll. Affected Outlook for Microsoft 365 users are told to check for Application log Event 1000 entries with OUTLOOK.EXE as the faulting app and MCOU.DLL as the faulting module, and to contact Kaspersky support if they experience the crash.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft fixed a known issue that caused Copilot Chat or Copilot buttons in Classic Outlook to disappear for Windows users with the Copilot Chat Basic license.","Affected users could lose Copilot buttons from the side navigation, the area above the ribbon, the left app bar, the More Apps area, or see Copilot commands unavailable or grayed out.","Microsoft said the Outlook Team addressed the issue with a service change on June 29, 2026, and advised users who still cannot see the buttons to restart Classic Outlook.","Affected customers are also advised to update to the latest build through File, Office Account, Update Options, and Update Now.","Users who cannot upgrade can work around the issue by reverting to Current Channel build 16.0.20026.20168 or using the new Outlook or Outlook Web Access."],"insights":["The fix was delivered as a service change, so Microsoft says restarting Classic Outlook may be enough to receive it immediately even before taking other steps.","Copilot may still appear as an available app in Add Apps while failing to open, so its presence in that menu does not confirm the feature is working.","Users can confirm the separate Kaspersky-related crash issue by checking for Application log Event 1000 entries that list OUTLOOK.EXE as the faulting app and MCOU.DLL as the faulting module.","Microsoft’s suggested fallback options include both reverting to a specific earlier Current Channel build and switching to new Outlook or Outlook Web Access."],"referencedReports":[{"title":"Copilot buttons gone in classic Outlook for Windows","url":"https://support.microsoft.com/en-US/Support/known-issues/copilot-buttons-gone-classic-outlook-windows","publisher":"Microsoft","context":"The article cites this Microsoft support document as the source explaining the Classic Outlook issue where Copilot buttons disappeared and the service-side fix.","category":"","primary":false},{"title":"Outlook crashes unexpectedly when use Kaspersky Antivirus","url":"https://support.microsoft.com/en-US/Support/known-issues/outlook-crashes-unexpectedly-when-use-kaspersky-antivirus","publisher":"Microsoft","context":"The article references this Microsoft known-issue advisory for a separate Outlook crash problem linked to Kaspersky Antivirus and the Kaspersky Mail Checker module.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft fixed a known issue that caused the Copilot Chat or Copilot buttons in Classic Outlook to disappear for Windows users with the Copilot Chat Basic license. Affected users could lose the Copilot button from the top-right area above the ribbon, the left app bar, the More Apps area, or the side navigation. Copilot could also appear in Add Apps but fail to open, or show as unavailable or grayed out when added through ribbon customization.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the Outlook Team addressed the issue with a service change on June 29, 2026. Users who still cannot see the Copilot buttons in Classic Outlook are advised to restart the email client to receive the change immediately. Microsoft also recommended updating to the latest build through File, Office Account, Update Options, and Update Now.\u003c/p\u003e\n\n\u003cp\u003eFor users who cannot upgrade, Microsoft listed workarounds including reverting to Current Channel build 16.0.20026.20168 or using the new Outlook or Outlook Web Access. The article also notes that Microsoft is investigating a separate known issue causing unexpected Outlook crashes on systems running Kaspersky Antivirus, linked to Kaspersky Mail Checker mcou.dll. Affected Outlook for Microsoft 365 users are told to check for Application log Event 1000 entries with OUTLOOK.EXE as the faulting app and MCOU.DLL as the faulting module, and to contact Kaspersky support if they experience the crash.\u003c/p\u003e\n"},{"n":5,"title":"Google loses final appeal to overturn €4.1 billion EU fine","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/legal/google-loses-final-appeal-to-overturn-41-billion-eu-fine/","time":"15:18","priority":"MAY READ","score":55,"tldr":"The EU’s top court rejected Google’s final appeal against a €4.1 billion antitrust fine over Android agreements that favored Google Search and Chrome. Google says it has already changed its practices and argues Android remains open and competitive.","briefOverview":"\u003cp\u003eThe Court of Justice of the European Union dismissed Google’s final appeal against a €4.1 billion antitrust fine tied to its use of Android to promote Chrome and Google Search. The case stems from a 2018 European Commission decision that found Google abused its dominant market position through Android agreements. The original fine was reduced from €4.34 billion to €4.125 billion in 2022 after the General Court partially annulled findings related to some revenue-sharing agreements.\u003c/p\u003e\n\n\u003cp\u003eThe CJEU affirmed the lower court’s ruling that Google’s Android agreements had anti-competitive effects and strengthened Google’s dominant position. The practices at issue included requiring device manufacturers to pre-install Google Search and Chrome to license the Play Store, preventing manufacturers from selling devices running Android versions not approved by Google, and tying revenue-sharing agreements to exclusive Google Search pre-installation. The court also found that the General Court was not required to perform a counterfactual analysis in every instance to establish abuse of dominance.\u003c/p\u003e\n\n\u003cp\u003eGoogle responded that Android provides choice, supports thousands of businesses, and remains open, interoperable, and free. The company said it adapted its agreements after the 2018 decision, added user-choice measures in 2021, and made more than 20 targeted product changes after the Digital Markets Act took effect in 2024. Google also argued that the Commission underestimated competition from Apple’s iOS and noted that Android device manufacturers compete intensely on features, functionality, and pricing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Court of Justice of the European Union dismissed Google’s final appeal against a €4.1 billion antitrust fine over its use of Android to promote Chrome and Google Search.","The European Commission’s 2018 decision found that Google abused its dominant market position through Android agreements with device manufacturers.","The practices deemed illegal included requiring Google Search and Chrome pre-installation to license the Play Store, restricting manufacturers from selling unapproved Android versions, and tying revenue sharing to exclusive Google Search pre-installation.","The CJEU affirmed the General Court’s ruling that Google’s pre-installation and anti-fragmentation agreements restricted competition within the Android ecosystem and strengthened Google’s dominant position.","Google said it changed its contractual practices after the 2018 decision, added user-choice measures in 2021, and made more than 20 targeted product changes after the Digital Markets Act took effect in 2024."],"insights":["The CJEU said a counterfactual analysis was not required in every instance to establish abuse of dominance, which was central to upholding the case against Google.","The final fine was lower than the original €4.34 billion because the General Court partially annulled findings related to some revenue-sharing agreements in 2022.","Google’s response emphasizes that the case is based on past market conditions, noting that it had already revised its Android agreements after the Commission’s 2018 decision.","Google linked its compliance efforts not only to the 2018 antitrust decision but also to later EU rules, saying it added user-choice measures in 2021 and made more than 20 product changes after the Digital Markets Act took effect in 2024."],"referencedReports":[],"body":"\u003cp\u003eThe Court of Justice of the European Union dismissed Google’s final appeal against a €4.1 billion antitrust fine tied to its use of Android to promote Chrome and Google Search. The case stems from a 2018 European Commission decision that found Google abused its dominant market position through Android agreements. The original fine was reduced from €4.34 billion to €4.125 billion in 2022 after the General Court partially annulled findings related to some revenue-sharing agreements.\u003c/p\u003e\n\n\u003cp\u003eThe CJEU affirmed the lower court’s ruling that Google’s Android agreements had anti-competitive effects and strengthened Google’s dominant position. The practices at issue included requiring device manufacturers to pre-install Google Search and Chrome to license the Play Store, preventing manufacturers from selling devices running Android versions not approved by Google, and tying revenue-sharing agreements to exclusive Google Search pre-installation. The court also found that the General Court was not required to perform a counterfactual analysis in every instance to establish abuse of dominance.\u003c/p\u003e\n\n\u003cp\u003eGoogle responded that Android provides choice, supports thousands of businesses, and remains open, interoperable, and free. The company said it adapted its agreements after the 2018 decision, added user-choice measures in 2021, and made more than 20 targeted product changes after the Digital Markets Act took effect in 2024. Google also argued that the Commission underestimated competition from Apple’s iOS and noted that Android device manufacturers compete intensely on features, functionality, and pricing.\u003c/p\u003e\n"},{"n":17,"title":"Identity Lifecycle Management Wasn't Built for AI Agents","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/identity-lifecycle-management.html","time":"11:30","priority":"MAY READ","score":55,"tldr":"Traditional identity lifecycle management is built around human HR events like hiring, role changes, and termination, so it misses AI agents that are created, modified, and retired through deployment systems. Enterprises need continuous discovery, behavior-based monitoring, scoped provisioning, and operational-status-based deprovisioning to govern agent identities safely.","briefOverview":"\u003cp\u003eThe article explains that identity lifecycle management was built around human employees who have HR records, managers, role changes, and termination dates. This model works for traditional joiner, mover, and leaver events because HR systems can trigger provisioning, entitlement changes, access reviews, and deprovisioning. AI agents fall outside that structure because they are created by engineers, orchestration frameworks, automated deployment pipelines, or platform APIs rather than through HR-driven workflows.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that AI agen
