<script type="application/json" id="dl-articles">[{"n":5,"title":"Hackers Exploit Critical VMware, Cisco, and Apache Flaws as Espionage Attacks Emerge","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-vmware-cisco.html","time":"08:49","priority":"MUST READ","score":96,"tldr":"CISA added four actively exploited flaws in Apache Roller, Cisco Expressway, SAP NetWeaver, and VMware vCenter to its KEV catalog, urging U.S. federal agencies to patch by November 23, 2026. The VMware vCenter flaw has been linked to suspected China-nexus espionage group Armory Castle, while Cisco Expressway was used in a breach of a Russian organization.","briefOverview":"\u003cp\u003eCISA added four flaws affecting Apache Roller, Cisco Expressway, SAP NetWeaver Enterprise Portal, and Broadcom VMware vCenter to its Known Exploited Vulnerabilities catalog after citing evidence of active exploitation. The affected issues include CVE-2026-129448 in Apache Roller, CVE-2026-76466 in Cisco Expressway, CVE-2025-42884 in SAP NetWeaver, and CVE-2026-123890 in VMware vCenter. Federal Civilian Executive Branch agencies were directed to patch all four by November 23, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Roller issue can let an unauthenticated remote attacker execute code through its XML-RPC endpoint, and its maintainers acknowledged that it is being actively exploited. Cisco Expressway\u0026rsquo;s hard-coded credentials flaw can enable root-level command execution on clustered devices, and F6 reported it was used to breach a Russian organization after a proof-of-concept exploit was released. The VMware vCenter authentication-bypass flaw has been linked to suspected China-nexus group Armory Castle, which reportedly combined it with a BeyondTrust Remote Support flaw to deploy custom backdoors for persistence and data theft.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added four vulnerabilities affecting Apache Roller, Cisco Expressway, SAP NetWeaver Enterprise Portal, and Broadcom VMware vCenter to its Known Exploited Vulnerabilities catalog after finding evidence of active exploitation.","The Apache Roller flaw, CVE-2026-129448, can allow an unauthenticated remote attacker to run arbitrary code through its XML-RPC endpoint, and Apache Roller maintainers said it is being actively exploited.","CVE-2026-76466 in Cisco Expressway can allow an unauthenticated remote attacker with persistent cookies and network access to run commands as root on a clustered device through the database service.","A suspected China-nexus espionage group called Armory Castle reportedly used the VMware vCenter authentication-bypass flaw CVE-2026-123890 alongside a BeyondTrust Remote Support flaw to install custom backdoors and steal data.","U.S. Federal Civilian Executive Branch agencies were directed to patch all four vulnerabilities by November 23, 2026."],"insights":["SAP NetWeaver Enterprise Portal was added to CISA's actively exploited catalog even though the article says there were no public reports documenting exploitation of CVE-2025-42884 at the time of writing.","The Cisco Expressway flaw was reportedly used against a Russian organization after a proof-of-concept exploit became available, and the intruders then moved through the network and accessed sensitive data.","Armory Castle reportedly combined the VMware vCenter authentication bypass with a separate BeyondTrust Remote Support flaw, illustrating that attackers used multiple weaknesses together to maintain access and steal data."],"referencedReports":[{"title":"CISA Adds Four Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/11/20/cisa-adds-four-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"The article cites this CISA alert as the source for adding the Apache Roller, Cisco Expressway, SAP NetWeaver, and VMware vCenter flaws to the Known Exploited Vulnerabilities catalog.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA added four flaws affecting Apache Roller, Cisco Expressway, SAP NetWeaver Enterprise Portal, and Broadcom VMware vCenter to its Known Exploited Vulnerabilities catalog after citing evidence of active exploitation. The affected issues include CVE-2026-129448 in Apache Roller, CVE-2026-76466 in Cisco Expressway, CVE-2025-42884 in SAP NetWeaver, and CVE-2026-123890 in VMware vCenter. Federal Civilian Executive Branch agencies were directed to patch all four by November 23, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe Apache Roller issue can let an unauthenticated remote attacker execute code through its XML-RPC endpoint, and its maintainers acknowledged that it is being actively exploited. Cisco Expressway\u0026rsquo;s hard-coded credentials flaw can enable root-level command execution on clustered devices, and F6 reported it was used to breach a Russian organization after a proof-of-concept exploit was released. The VMware vCenter authentication-bypass flaw has been linked to suspected China-nexus group Armory Castle, which reportedly combined it with a BeyondTrust Remote Support flaw to deploy custom backdoors for persistence and data theft.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft Entra Connect Health flaw exploited to steal tenant data","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/microsoft-entra-connect-health-flaw-exploited-to-steal-tenant-data/","time":"18:01","priority":"SHOULD READ","score":88,"tldr":"Microsoft fixed an Entra Connect Health API flaw that attackers exploited to access tenant contact and configuration metadata, including administrator email addresses, but not passwords, tokens, or active cryptographic keys. Affected organizations should watch for targeted phishing, enforce phishing-resistant MFA for privileged accounts, and review Entra logs and Connect Health settings.","briefOverview":"\u003cp\u003eMicrosoft said attackers exploited a vulnerability in the Microsoft Entra Connect Health API, gaining unauthorized read-only access to tenant-level contact and configuration metadata. The cloud-based service is used to monitor on-premises identity infrastructure through the Microsoft Entra admin center. Microsoft discovered the issue on November 9, 2026, said it had been introduced on July 23, and deployed a server-side fix on November 19.\u003c/p\u003e\n\n\u003cp\u003eExposed information could include technical contact and administrator email addresses, tenant identifiers and names, initial domain names, regional details, license tiers, directory synchronization status, and Connect Health onboarding status. An expired certificate for a decommissioned internal service was also still stored in Connect Health and returned by the API, though Microsoft said it was no longer in use. Microsoft said passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises topology details, and Azure subscription information were not exposed.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft completed its investigation on November 20 and began notifying affected organizations, but did not disclose the number of impacted tenants, the party responsible, or when exploitation began. No customer software update is required, but Microsoft advised organizations to prepare for targeted phishing and social-engineering attempts using the exposed information. It also recommended phishing-resistant multifactor authentication for privileged accounts, reviewing Connect Health settings, and checking Entra audit and sign-in logs for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft said attackers exploited a vulnerability in the Entra Connect Health API to obtain unauthorized read-only access to tenant-level contact and configuration metadata.","The exposed data included technical contact and administrator email addresses, tenant IDs and names, initial domain names, country and regional information, Entra license tiers, directory synchronization status, and Connect Health onboarding status.","Microsoft said passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises Active Directory topology details, and Azure subscription information were not exposed.","Microsoft deployed a server-side fix on November 19, 2026, completed its investigation on November 20, and began notifying affected organizations.","Microsoft advised organizations to prepare for targeted phishing or social-engineering attempts, use phishing-resistant multifactor authentication for privileged accounts, and review Connect Health configurations and Entra audit and sign-in logs."],"insights":["The API continued returning an expired certificate that had been unused since its associated internal service was decommissioned in late 2024, because the certificate remained stored in Connect Health.","Microsoft’s response required no customer software update because the company deployed a server-side fix on November 19, 2026.","Microsoft’s PowerShell script can show the categories of tenant metadata that could have been exposed, but it shows current values rather than the exact data accessed during the incident.","Some managed service providers received notifications for multiple customer tenants, indicating that a single provider may need to assess exposure across more than one organization."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft said attackers exploited a vulnerability in the Microsoft Entra Connect Health API, gaining unauthorized read-only access to tenant-level contact and configuration metadata. The cloud-based service is used to monitor on-premises identity infrastructure through the Microsoft Entra admin center. Microsoft discovered the issue on November 9, 2026, said it had been introduced on July 23, and deployed a server-side fix on November 19.\u003c/p\u003e\n\n\u003cp\u003eExposed information could include technical contact and administrator email addresses, tenant identifiers and names, initial domain names, regional details, license tiers, directory synchronization status, and Connect Health onboarding status. An expired certificate for a decommissioned internal service was also still stored in Connect Health and returned by the API, though Microsoft said it was no longer in use. Microsoft said passwords, password hashes, authentication tokens, valid cryptographic keys, on-premises topology details, and Azure subscription information were not exposed.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft completed its investigation on November 20 and began notifying affected organizations, but did not disclose the number of impacted tenants, the party responsible, or when exploitation began. No customer software update is required, but Microsoft advised organizations to prepare for targeted phishing and social-engineering attempts using the exposed information. It also recommended phishing-resistant multifactor authentication for privileged accounts, reviewing Connect Health settings, and checking Entra audit and sign-in logs for suspicious activity.\u003c/p\u003e\n"},{"n":7,"title":"Attackers' AI Agents Found a Zero-Day in Medical-Imaging Software and Gained Root Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/attackers-ai-agents-found-zero-day-in.html","time":"11:03","priority":"SHOULD READ","score":88,"tldr":"China-linked operators reportedly used Cairn AI agents to discover and exploit a critical path-traversal zero-day in exposed MONAI Label servers, achieving root access on at least one university system. No patched release is available yet, so organizations should restrict network exposure, enable authentication, and run MONAI Label with minimal privileges.","briefOverview":"\u003cp\u003eSuspected China-linked operators used Cairn, an open-source framework for automated AI penetration-testing agents, to find a previously unknown flaw in MONAI Label. Amazon Threat Intelligence said the agents mapped the application\u0026rsquo;s interface and obtained the ability to write files on a university server in roughly 11 minutes. The operator reportedly selected targets and set the goal of gaining shell access, while the agents chose methods independently.\u003c/p\u003e\n\n\u003cp\u003eThe issue, CVE-2026-133968, is a critical path-traversal flaw affecting MONAI Label 0.8.5 and earlier in the default configuration, where authentication is disabled. It allows a network-reachable, unauthenticated caller to write files outside the intended storage folder; on one university server, the attackers later used this capability to place a Python startup file and gain root access when a training feature launched a new Python process. Project MONAI has merged a source-code fix but has not released a patched package, so affected users are advised to restrict network access, enable authentication, limit service-account permissions, and check exposed systems for unexpected Python startup files or unusual training jobs.\u003c/p\u003e\n\n\u003cp\u003eAmazon based its account on a reconstruction aided by an exposed, unprotected Cairn control panel belonging to the operators, which revealed prompts, settings, and run history. The company linked the activity to a China-related actor with moderate confidence based on Simplified Chinese prompts, China Standard Time settings, and target selection, but did not name a group or establish government involvement. The report does not show that patient records were taken or that clinical systems were reached, and it notes that root access on one server does not mean every MONAI Label deployment would be affected in the same way.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Suspected China-linked operators used Cairn, an open-source AI-agent framework, to discover and exploit a previously unknown path-traversal flaw in MONAI Label.","The flaw affects MONAI Label 0.8.5 and earlier default installations, where authentication is disabled and user-provided file identifiers can cause files to be written outside the intended storage folder.","Amazon Threat Intelligence reported that the agents reached the ability to write files to a university server in roughly 11 minutes and later obtained root access on one server by placing a Python startup file and triggering a training feature.","Project MONAI merged a source-code fix on October 19, but its advisory says no patched release is yet available; the CVE record identifies the issue as CVE-2026-133968 with a critical 9.8 score.","Organizations running MONAI Label should restrict untrusted network access, enable authentication, use limited service accounts, confirm source builds include the fix, and inspect exposed systems for unexpected Python startup files or unusual training jobs."],"insights":["Amazon reconstructed the campaign because the attackers exposed their own Cairn control panel without a password, revealing agent prompts, task settings, and run history.","The reported root compromise was not an automatic result of the file-writing flaw: it depended on placing a Python startup file and triggering a feature that launched a new Python process, and would vary with each server's configuration and permissions.","Although the fix has been merged into MONAI Label’s source code, the latest published package remains version 0.8.5, so users cannot assume an ordinary package installation contains the correction.","The operator reportedly provided the targets and a goal of obtaining shell access, while the AI agents independently mapped the application and selected methods to pursue that goal."],"referencedReports":[{"title":"Chinese Nexus Actors Used Cairn AI Agents to Find a Zero-Day on Their Own","url":"https://aws.amazon.com/blogs/security/chinese-nexus-actors-cairn-ai-agents-found-a-zero-day-on-their-own/","publisher":"amazon-threat-intelligence","context":"The article cites Amazon's incident report for its reconstruction of the campaign, including the agents' activity and the reported root compromise.","category":"research","primary":true},{"title":"GHSA-qc22-rmgc-vg94","url":"https://github.com/Project-MONAI/MONAILabel/security/advisories/GHSA-qc22-rmgc-vg94","publisher":"project-monai","context":"The article cites Project MONAI's security advisory to confirm that no patched MONAI Label release was available at publication time.","category":"advisory","primary":false}],"body":"\u003cp\u003eSuspected China-linked operators used Cairn, an open-source framework for automated AI penetration-testing agents, to find a previously unknown flaw in MONAI Label. Amazon Threat Intelligence said the agents mapped the application\u0026rsquo;s interface and obtained the ability to write files on a university server in roughly 11 minutes. The operator reportedly selected targets and set the goal of gaining shell access, while the agents chose methods independently.\u003c/p\u003e\n\n\u003cp\u003eThe issue, CVE-2026-133968, is a critical path-traversal flaw affecting MONAI Label 0.8.5 and earlier in the default configuration, where authentication is disabled. It allows a network-reachable, unauthenticated caller to write files outside the intended storage folder; on one university server, the attackers later used this capability to place a Python startup file and gain root access when a training feature launched a new Python process. Project MONAI has merged a source-code fix but has not released a patched package, so affected users are advised to restrict network access, enable authentication, limit service-account permissions, and check exposed systems for unexpected Python startup files or unusual training jobs.\u003c/p\u003e\n\n\u003cp\u003eAmazon based its account on a reconstruction aided by an exposed, unprotected Cairn control panel belonging to the operators, which revealed prompts, settings, and run history. The company linked the activity to a China-related actor with moderate confidence based on Simplified Chinese prompts, China Standard Time settings, and target selection, but did not name a group or establish government involvement. The report does not show that patient records were taken or that clinical systems were reached, and it notes that root access on one server does not mean every MONAI Label deployment would be affected in the same way.\u003c/p\u003e\n"},{"n":8,"title":"GnuPG Warns Critical GPGME Flaw Could Expose App Data via Malicious OpenPGP Keys","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/gnupg-warns-critical-gpgme-flaw-could.html","time":"11:05","priority":"SHOULD READ","score":88,"tldr":"GnuPG has patched a critical double-free flaw (CVE-2026-129975) in GPGME that malicious OpenPGP keys could use to expose application data and potentially enable remote code execution. Users should update to GPGME 2.3.1, Gpg4win 5.1.2, or rebuild applications with bundled or statically linked vulnerable copies.","briefOverview":"\u003cp\u003eGnuPG warned of CVE-2026-129975, a critical flaw in GPGME that can be triggered by a malicious OpenPGP key with an unusually long user ID. The issue affects software using GPGME versions before 2.3.0, including programs that load it as a shared library, Windows DLL, or statically linked component. GnuPG said the flaw could expose data from affected applications, and remote code execution cannot be ruled out.\u003c/p\u003e\n\n\u003cp\u003eThe problem is a double-free memory error in the read_status() and read_colon_line() routines, which process status lines and key listings from GnuPG. When long input causes buffer expansion and an error occurs before the new buffer address is saved, cleanup can attempt to release already freed memory again. GnuPG released GPGME 2.3.1 and Gpg4win 5.1.2, while legacy users can use version 1.24.4 or the advisory\u0026rsquo;s patch; bundled and statically linked copies require rebuilt application releases.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GnuPG warned that CVE-2026-129975 is a critical double-free flaw in GPGME triggered by malicious OpenPGP keys with unusually long user IDs.","The flaw affects software using GPGME versions before 2.3.0, including shared, Windows DLL, and statically linked installations.","Affected software can include many mail and XMPP clients, Samba, Gpg4win, GnuPG Desktop, and GnuPG VS-Desktop.","GnuPG has released GPGME 2.3.1 and Gpg4win 5.1.2 to address the issue, while the legacy branch received version 1.24.4.","The project reported no known exploitation, but said the flaw could expose application data and that remote code execution cannot be ruled out."],"insights":["Updating only a system-installed GPGME library will not protect applications that include their own bundled or statically linked copy; those applications require rebuilt releases from their developers.","The advisory provides no temporary workaround for software that cannot yet update, making installation of a fixed release or patch the stated remediation path.","The bug can be reached through signed data sent to an application, rather than necessarily requiring a user to manually import a malicious key.","The double-free occurs when an error interrupts buffer resizing, leaving the program with a reference to memory that has already been released.","GnuPG moved disclosure forward because GitLab needed to update earlier in response to the separate Ruby2Shell issue."],"referencedReports":[{"title":"GnuPG Security Advisory 000517","url":"https://lists.gnupg.org/pipermail/gnupg-announce/2026q4/000517.html","publisher":"gnupg-project","context":"The article links GnuPG's security advisory for details on the fixed GPGME release and available remediation options.","category":"advisory","primary":true},{"title":"T8557","url":"https://static.dev.gnupg.org/T8557.html","publisher":"gnupg-project","context":"The article cites this GnuPG tracker entry for technical details of the double-free condition in the affected routines.","category":"research","primary":true}],"body":"\u003cp\u003eGnuPG warned of CVE-2026-129975, a critical flaw in GPGME that can be triggered by a malicious OpenPGP key with an unusually long user ID. The issue affects software using GPGME versions before 2.3.0, including programs that load it as a shared library, Windows DLL, or statically linked component. GnuPG said the flaw could expose data from affected applications, and remote code execution cannot be ruled out.\u003c/p\u003e\n\n\u003cp\u003eThe problem is a double-free memory error in the read_status() and read_colon_line() routines, which process status lines and key listings from GnuPG. When long input causes buffer expansion and an error occurs before the new buffer address is saved, cleanup can attempt to release already freed memory again. GnuPG released GPGME 2.3.1 and Gpg4win 5.1.2, while legacy users can use version 1.24.4 or the advisory\u0026rsquo;s patch; bundled and statically linked copies require rebuilt application releases.\u003c/p\u003e\n"},{"n":2,"title":"BADBOX botnet returns with record-breaking 40 billion daily ad requests","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/badbox-30-botnet-returns-with-record-breaking-40-billion-daily-ad-requests/","time":"15:17","priority":"SHOULD READ","score":84,"tldr":"BADBOX 3.0 rebuilt after prior disruptions and became the largest documented ad-fraud botnet, generating up to 40 billion fraudulent daily ad bid requests through compromised low-cost Android devices. It also covertly enrolls infected devices in residential proxy networks, and researchers warn its operators are likely to adapt again after the latest takedowns.","briefOverview":"\u003cp\u003eHUMAN\u0026rsquo;s Satori researchers reported that the rebuilt BADBOX 3.0 botnet generated roughly 40 billion fraudulent advertising bid requests per day at its peak, representing more than 4% of connected-TV traffic observed by the Human Defense Platform. HUMAN described it as the largest documented ad-fraud operation by daily bid-request volume, exceeding the prior record holder VASTFLUX by more than three times. The operation returned after earlier disruption efforts against BADBOX 2.0, which cut more than 500,000 devices off from control servers in March 2025.\u003c/p\u003e\n\n\u003cp\u003eBADBOX 3.0 targets inexpensive Android Open Source Project phones, tablets, and streaming TV boxes, where it plays video ads in hidden windows while impersonating legitimate streaming applications. It also generated fraudulent server-side ad-insertion requests and enrolled infected devices in 11 residential proxy networks without their owners\u0026rsquo; knowledge, including PXYEDGE, a service identified as a rebranded successor to IpMoYu. HUMAN linked the malware to a Chinese electronics manufacturer and said the operators used public code repositories and mirrored hosting to distribute malware modules and resist takedowns.\u003c/p\u003e\n\n\u003cp\u003eHUMAN participated in efforts that removed BADBOX 3.0 command-and-control domains, took down one malware repository, and filtered associated fraudulent advertising traffic. The researchers nevertheless warned that the operators are likely to adapt, as they have after previous disruptions. The article advises users to buy certified Android devices from reputable manufacturers and ensure Google Play Protect is available and active.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["HUMAN reported that BADBOX 3.0 generated roughly 40 billion fraudulent advertising bid requests per day at its peak, representing more than 4% of connected-TV traffic observed by its platform.","BADBOX 3.0 infects low-cost Android Open Source Project phones, tablets, and streaming TV boxes to run hidden video ads while impersonating legitimate streaming applications.","The botnet also enrolled infected devices into 11 residential proxy networks without owners' knowledge, including PXYEDGE, which HUMAN identified as a rebranded successor to IpMoYu.","HUMAN linked the operation to a Chinese electronics manufacturer through associated domains, device-specific code checks, a factory-installed TV launcher, and a repository maintainer.","HUMAN, Google, and other partners disrupted BADBOX 3.0 infrastructure, but HUMAN warned that the operators are likely to adapt to the latest disruption."],"insights":["BADBOX 3.0 exceeded the prior daily ad-fraud record holder, VASTFLUX, by more than three times and had a larger peak than the previous five years of published HUMAN Satori investigations combined.","The operation combined fake advertising activity with residential proxy services, allowing some fraudulent traffic to be routed through real users’ internet connections to appear more legitimate and avoid abuse filters.","Its use of public code repositories and mirrored hosting for malware modules gave the operators redundancy that could help the operation withstand individual takedowns.","Evidence cited by HUMAN suggests the compromise may be tied to the device supply chain, including a factory-installed TV launcher and checks targeting specific devices."],"referencedReports":[{"title":"BADBOX 3.0 Hides the Largest Ad Fraud Operation Ever Disclosed Inside Infected TV Boxes","url":"https://www.humansecurity.com/learn/blog/satori-threat-intelligence-disruption-badbox-3-0-hides-the-largest-ad-fraud-operation-ever-disclosed-inside-infected-tv-boxes/","publisher":"human-security","context":"The article relies on HUMAN's Satori research for the discovery, scale, techniques, and disruption of the BADBOX 3.0 operation.","category":"research","primary":true}],"body":"\u003cp\u003eHUMAN\u0026rsquo;s Satori researchers reported that the rebuilt BADBOX 3.0 botnet generated roughly 40 billion fraudulent advertising bid requests per day at its peak, representing more than 4% of connected-TV traffic observed by the Human Defense Platform. HUMAN described it as the largest documented ad-fraud operation by daily bid-request volume, exceeding the prior record holder VASTFLUX by more than three times. The operation returned after earlier disruption efforts against BADBOX 2.0, which cut more than 500,000 devices off from control servers in March 2025.\u003c/p\u003e\n\n\u003cp\u003eBADBOX 3.0 targets inexpensive Android Open Source Project phones, tablets, and streaming TV boxes, where it plays video ads in hidden windows while impersonating legitimate streaming applications. It also generated fraudulent server-side ad-insertion requests and enrolled infected devices in 11 residential proxy networks without their owners\u0026rsquo; knowledge, including PXYEDGE, a service identified as a rebranded successor to IpMoYu. HUMAN linked the malware to a Chinese electronics manufacturer and said the operators used public code repositories and mirrored hosting to distribute malware modules and resist takedowns.\u003c/p\u003e\n\n\u003cp\u003eHUMAN participated in efforts that removed BADBOX 3.0 command-and-control domains, took down one malware repository, and filtered associated fraudulent advertising traffic. The researchers nevertheless warned that the operators are likely to adapt, as they have after previous disruptions. The article advises users to buy certified Android devices from reputable manufacturers and ensure Google Play Protect is available and active.\u003c/p\u003e\n"},{"n":3,"title":"Rackspace Spot breach let hackers access customer Kubernetes secrets","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/rackspace-spot-breach-let-hackers-access-customer-kubernetes-secrets/","time":"22:59","priority":"SHOULD READ","score":82,"tldr":"Rackspace Spot was breached using leaked credentials, allowing attackers to impersonate users, deploy unauthorized Kubernetes pods, and access secrets that may contain passwords, API keys, and tokens. Affected customers should rotate exposed credentials and review logs from November 17 for misuse.","briefOverview":"\u003cp\u003eRackspace said attackers used leaked credentials to access parts of its Rackspace Spot cloud platform on November 17, 2026. The intruders could act as legitimate users in some customer organizations, create Kubernetes pods, read Kubernetes Secrets, and list nodes and volumes. Rackspace learned of the incident on November 18 after a customer report and confirmed that organization was affected the same day.\u003c/p\u003e\n\n\u003cp\u003eThe exposure could extend beyond the platform because Kubernetes Secrets may contain passwords, authentication tokens, and API keys for databases, cloud services, and other systems. Rackspace revoked affected tokens and sessions, removed unauthorized pods, rotated keys, strengthened controls and monitoring, and restored service on November 21 after disabling access during containment. Affected customers were instructed to replace API and refresh tokens, download new Kubernetes configuration files, rotate credentials in Secrets, review relevant logs from November 17, and check for the listed indicators, including IP address 23.224.79.106 and object prefixes i1, glm-, and probe.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Rackspace said an unauthorized party used leaked credentials to access parts of its Rackspace Spot cloud platform on November 17, 2026.","The attackers could act as legitimate users in some customer organizations, create Kubernetes pods, read Kubernetes Secrets, and list nodes and volumes.","Rackspace warned that any Secret in an affected user’s clusters, along with that user’s Spot API and refresh tokens, could have been exposed.","Rackspace revoked affected tokens and sessions, removed unauthorized pods, rotated keys, and restored the Spot service on November 21 after temporarily disabling access.","Affected customers were told to reissue tokens, replace automation refresh tokens, obtain new Kubernetes configuration files, rotate stored credentials, and examine relevant logs dating from November 17."],"insights":["The potential impact extended beyond the Rackspace Spot platform because Kubernetes Secrets can contain credentials for databases, cloud services, code repositories, storage, and third-party services.","Rackspace’s response required customers to replace several different forms of access material, including Spot API tokens, automation refresh tokens, Kubernetes configuration files, and credentials held in cluster Secrets.","The administration-console outage temporarily prevented customers from managing clusters and rotating potentially compromised credentials, illustrating the operational disruption caused by the containment effort.","Customers can use the reported IP address 23.224.79.106 and the suspicious Kubernetes object prefixes i1, glm-, and probe when reviewing activity associated with the incident."],"referencedReports":[],"body":"\u003cp\u003eRackspace said attackers used leaked credentials to access parts of its Rackspace Spot cloud platform on November 17, 2026. The intruders could act as legitimate users in some customer organizations, create Kubernetes pods, read Kubernetes Secrets, and list nodes and volumes. Rackspace learned of the incident on November 18 after a customer report and confirmed that organization was affected the same day.\u003c/p\u003e\n\n\u003cp\u003eThe exposure could extend beyond the platform because Kubernetes Secrets may contain passwords, authentication tokens, and API keys for databases, cloud services, and other systems. Rackspace revoked affected tokens and sessions, removed unauthorized pods, rotated keys, strengthened controls and monitoring, and restored service on November 21 after disabling access during containment. Affected customers were instructed to replace API and refresh tokens, download new Kubernetes configuration files, rotate credentials in Secrets, review relevant logs from November 17, and check for the listed indicators, including IP address 23.224.79.106 and object prefixes i1, glm-, and probe.\u003c/p\u003e\n"},{"n":4,"title":"A Single Malicious Webpage Let Researchers Hijack Meta Muse and Access Private Chats","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/a-single-malicious-webpage-let.html","time":"11:53","priority":"SHOULD READ","score":82,"tldr":"Researchers showed that a malicious webpage could hijack Meta Muse’s cloud environment to access and alter private chats, memories, and potentially connected-account credentials, though the attack was contained to one user’s machine. NebuSec said Meta fixed the reported flaws before disclosure.","briefOverview":"\u003cp\u003eNebuSec researchers demonstrated in a laboratory that a malicious webpage could extract and alter a Meta Muse user’s private conversations and stored memories without an approval prompt. The same approach could potentially reach credentials Muse keeps for connected accounts. The demonstration did not target real users and remained inside the individual user’s cloud machine.\u003c/p\u003e\n\n\u003cp\u003eThe researchers chained a flaw in Muse’s built-in browser with a Linux kernel flaw to gain full control of that cloud machine. This access reached the credential store, saved files, and Sentinel, the monitoring layer intended to control outbound actions and isolate sensitive data from the agent. The compromise did not extend to the shared server beneath the machine or to other users’ machines, and NebuSec said all reported exploits were fixed before publication.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NebuSec researchers demonstrated that a malicious webpage could extract and alter Meta Muse users’ private conversations and stored memories without showing an approval prompt.","The researchers chained a flaw in Muse’s built-in browser with a Linux kernel flaw to take full control of an individual user’s cloud machine.","Full control of the cloud machine could reach Muse’s credential store, saved files, and Sentinel monitoring layer, although the test did not escape to the underlying shared server or other users’ machines.","The demonstration was conducted in a laboratory and did not target real users, according to the article.","NebuSec said it reported the findings to Meta Muse’s team and that all described exploits were fixed before publication."],"insights":["Muse’s protections were designed on the assumption that the AI agent itself could be manipulated, yet the researchers found a path that reached protected components by taking over the user’s cloud machine rather than relying on the agent alone.","The reported issue was not limited to reading private information: the malicious webpage could also alter a user’s stored conversations and memories without an approval prompt.","Although connected-account passwords and tokens were intended to be inaccessible to the agent, the researchers said full control of the cloud machine could reach the credential store.","The demonstrated compromise remained confined to a single user’s cloud machine and did not extend to the shared underlying server or other users’ machines."],"referencedReports":[{"title":"Meta Muse Credential Exposure","url":"https://nebusec.ai/research/meta-muse-credential-exposure/","publisher":"nebusec","context":"The article cites NebuSec's research write-up describing how a malicious webpage could access and alter Muse conversations and stored memories without user approval.","category":"research","primary":true},{"title":"Inside Meta Muse","url":"https://nebusec.ai/research/inside-meta-muse/","publisher":"nebusec","context":"The article cites this NebuSec technical breakdown for the browser and Linux kernel flaw chain used to take control of a user's Muse cloud machine.","category":"research","primary":true}],"body":"\u003cp\u003eNebuSec researchers demonstrated in a laboratory that a malicious webpage could extract and alter a Meta Muse user’s private conversations and stored memories without an approval prompt. The same approach could potentially reach credentials Muse keeps for connected accounts. The demonstration did not target real users and remained inside the individual user’s cloud machine.\u003c/p\u003e\n\n\u003cp\u003eThe researchers chained a flaw in Muse’s built-in browser with a Linux kernel flaw to gain full control of that cloud machine. This access reached the credential store, saved files, and Sentinel, the monitoring layer intended to control outbound actions and isolate sensitive data from the agent. The compromise did not extend to the shared server beneath the machine or to other users’ machines, and NebuSec said all reported exploits were fixed before publication.\u003c/p\u003e\n"},{"n":6,"title":"Signal Blocks AI Agents From Reading Private Chats via Screenshots on Android and iOS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/signal-blocks-ai-agents-from-reading.html","time":"08:49","priority":"SHOULD READ","score":78,"tldr":"Signal now blocks screenshots by default on supported Android and iOS devices to limit OS-level AI agents from reading private chats, though it acknowledges the safeguard cannot prevent all data-access paths. The change follows concerns that agents with broad accessibility, screenshot, or notification permissions can extract Signal content outside the app’s encryption protections.","briefOverview":"\u003cp\u003eSignal announced that it will restrict screenshots by default on supported Android and iOS devices to prevent operating-system AI agents from reading private chats. The feature applies to agentic systems built into iOS 27 and Android versions where Signal can detect an AI assistant attempting to read its screen. Signal said these systems can scan what is displayed, capture Signal data, and make it available to AI agents outside the app’s control. Meredith Whittaker, president of the Signal Foundation, called the integrations an existential threat to Signal’s privacy guarantees.\u003c/p\u003e\n\n\u003cp\u003eUsers can disable the controls through Signal’s App Security settings, but Signal warned that doing so could expose their content and their contacts’ content to AI agents. The company acknowledged that screenshot blocking is incomplete because agents may retrieve data already present on a device through the file system or other methods. Reuters reported that Meta’s Muse agent accessed Signal messages through macOS accessibility and screenshot tools, and through Android push-notification access. Signal is urging technology companies to provide documented controls that let apps fully opt out of AI access to screens, files, notifications, APIs, and other operating-system functions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Signal will restrict screenshots by default on supported Android and iOS devices to prevent operating-system AI agents from reading private chats, while acknowledging that the protection is incomplete.","Signal says users can disable the setting through its privacy and app-security controls, but doing so may expose their Signal content and their contacts’ content to AI agents.","Signal warned that screenshot blocking cannot prevent AI agents from obtaining data through other routes, including files already on a user’s device.","Reuters reported that Meta’s Muse AI agent accessed Signal messages on Apple and Android devices by using broad permissions, including macOS accessibility and screenshot tools and Android push-notification access.","Signal is urging technology companies to provide documented app-level controls that can fully opt apps out of AI data access and processing."],"insights":["Signal’s encryption cannot independently preserve privacy when an operating-system AI agent can capture chat content from the screen, notifications, or files after it is displayed on a device.","A single user granting broad permissions to an AI agent can create privacy exposure for every participant in that user’s Signal conversations, not only the person who enabled the agent.","Meta’s Muse reportedly accessed Signal on macOS through accessibility and screenshot permissions, while on Android it read Signal messages through push-notification access, showing that the access route can differ by operating system.","Signal’s screenshot restriction is only a partial safeguard because it does not stop an AI agent from retrieving Signal content that may already be stored on the device.","Apple’s iOS 27.2 includes an Excluded Apps setting for Siri, Search, and suggestions, giving users a separate operating-system control over which apps those features can access."],"referencedReports":[{"title":"Meta Bets Big on Muse AI Agent as Early Safety Mishaps Surface","url":"https://www.reuters.com/investigations/meta-bets-big-muse-ai-agent-early-safety-mishaps-surface-2026-11-18/","publisher":"reuters","context":"The article cites a Reuters investigation reporting that Meta’s Muse AI agent accessed Signal messages on macOS and Android by using broad operating-system permissions.","category":"news","primary":false}],"body":"\u003cp\u003eSignal announced that it will restrict screenshots by default on supported Android and iOS devices to prevent operating-system AI agents from reading private chats. The feature applies to agentic systems built into iOS 27 and Android versions where Signal can detect an AI assistant attempting to read its screen. Signal said these systems can scan what is displayed, capture Signal data, and make it available to AI agents outside the app’s control. Meredith Whittaker, president of the Signal Foundation, called the integrations an existential threat to Signal’s privacy guarantees.\u003c/p\u003e\n\n\u003cp\u003eUsers can disable the controls through Signal’s App Security settings, but Signal warned that doing so could expose their content and their contacts’ content to AI agents. The company acknowledged that screenshot blocking is incomplete because agents may retrieve data already present on a device through the file system or other methods. Reuters reported that Meta’s Muse agent accessed Signal messages through macOS accessibility and screenshot tools, and through Android push-notification access. Signal is urging technology companies to provide documented controls that let apps fully opt out of AI access to screens, files, notifications, APIs, and other operating-system functions.\u003c/p\u003e\n"},{"n":9,"title":"The Asana Digest Said Tuesday. It Arrived on a Thursday.","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/recycled-asana-digest-weekday-date-mismatch-ses-swapped-button","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing email reused a genuine Asana digest template and assets but was sent through an unrelated Uruguayan domain via Amazon SES, with one malicious Lovable-hosted link substituted for a legitimate button. The mismatched weekday and date exposed the recycled template, underscoring that authentic branding and passing email authentication do not prove a message came from the claimed service.","briefOverview":"\u003cp\u003eA regional airport authority’s accounts-receivable mailbox received an email styled as an Asana daily task digest. The message used real Asana branding, CDN-hosted images, task links, and an embedded tracking pixel, but it was sent from an unrelated .com.uy domain through Amazon SES. Its heading said “Tuesday” beside October 1, 2026, which was a Thursday, indicating that the sender had reused and incompletely edited an older template.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, and Microsoft composite authentication checks for the sending domain, not for Asana, illustrating that successful authentication did not prove the claimed brand sent the message. The attacker changed the subject, added a hidden preheader about a security task, and replaced the primary “View in Ticket” button with a malicious Lovable-hosted link while leaving the other Asana links intact. The phishing page displayed a “Verify you are human” checkbox on the delivery date, and the incident was automatically resolved as phishing and removed from the mailbox.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A regional airport authority’s accounts-receivable mailbox received an email that copied an Asana daily task digest but was sent from an unrelated .com.uy domain through Amazon SES.","The message passed SPF, DKIM, and DMARC checks for the sending domain, but none of those checks showed that Asana sent it.","The email’s heading said Tuesday next to October 1, 2026, a Thursday, while an embedded Asana tracking pixel indicated that the original template had been generated on Tuesday, August 18, 2026.","The attacker changed the subject line and replaced the main “View in Ticket” button with a link to a malicious Lovable-hosted page, while retaining the other genuine Asana links and branding.","The incident was automatically classified as phishing and the message was removed from the mailbox."],"insights":["Passing SPF, DKIM, and DMARC only confirmed that the unrelated .com.uy domain was authorized to send the message; they did not establish that Asana had sent the digest.","The mismatch between “Tuesday” and the Thursday date exposed a recycled email template, and Asana’s embedded tracking pixel independently dated the original template to an earlier Tuesday.","By retaining genuine Asana links, branding, and tracking while changing only one call-to-action button, the sender created an email in which most URLs would appear legitimate to scanners.","Shared finance mailboxes can be especially susceptible to this type of lure because multiple people read them and no single person may be responsible for deciding whether a task assignment is expected."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s statistics on the human element in breaches, phishing as an initial access vector, and phishing’s share of email gateway attack traffic.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA guidance recommending that unexpected requests be verified through a separate channel.","category":"guide","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"microsoft","context":"The article cites the report in connection with attackers’ abuse of legitimate cloud services.","category":"research","primary":false},{"title":"2024 IC3 Annual Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"fbi-internet-crime-complaint-center","context":"The article references the FBI IC3 report as support for the significance of phishing as an entry point.","category":"research","primary":false},{"title":"Cost of a Data Breach Report 2024","url":"https://www.ibm.com/reports/data-breach","publisher":"ibm","context":"The article references IBM’s report alongside other sources noting phishing among leading entry points.","category":"research","primary":false}],"body":"\u003cp\u003eA regional airport authority’s accounts-receivable mailbox received an email styled as an Asana daily task digest. The message used real Asana branding, CDN-hosted images, task links, and an embedded tracking pixel, but it was sent from an unrelated .com.uy domain through Amazon SES. Its heading said “Tuesday” beside October 1, 2026, which was a Thursday, indicating that the sender had reused and incompletely edited an older template.\u003c/p\u003e\n\n\u003cp\u003eThe email passed SPF, DKIM, DMARC, and Microsoft composite authentication checks for the sending domain, not for Asana, illustrating that successful authentication did not prove the claimed brand sent the message. The attacker changed the subject, added a hidden preheader about a security task, and replaced the primary “View in Ticket” button with a malicious Lovable-hosted link while leaving the other Asana links intact. The phishing page displayed a “Verify you are human” checkbox on the delivery date, and the incident was automatically resolved as phishing and removed from the mailbox.\u003c/p\u003e\n"}]</script>
