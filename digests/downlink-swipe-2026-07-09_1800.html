<script type="application/json" id="dl-articles">[{"n":1,"title":"Injective SDK on npm infected with cryptocurrency wallet stealer","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/injective-sdk-on-npm-infected-with-cryptocurrency-wallet-stealer/","time":"20:10","priority":"SHOULD READ","score":88,"tldr":"Hackers compromised Injective Labs’ GitHub repository to publish malicious npm versions of its SDK and related packages that stole crypto wallet private keys and seed phrases when wallet functions were used. Developers who installed the affected version should assume wallets and secrets may be compromised, move funds to new wallets, and rotate credentials.","briefOverview":"\u003cp\u003eHackers compromised a GitHub account belonging to a legitimate contributor to the Injective Labs SDK project and used it to publish a malicious npm package. The affected package was version 1.20.21 of @injectivelabs/sdk-ts, a TypeScript/JavaScript SDK used to build applications on the Injective blockchain. Security companies Socket, Ox Security, and StepSecurity detected the supply-chain attack.\u003c/p\u003e\n\n\u003cp\u003eThe package has 50,000 weekly downloads and is used by developers building cryptocurrency wallets, trading bots, decentralized exchanges, DeFi applications, and payment tools. The attacker also published version 1.20.21 for 17 other packages associated with the project, pinning all of them to the compromised SDK version. Socket said the malicious version was downloaded 310 times before it was deprecated, while Ox Security reported that 87 dependent packages had a cumulative download count of a little over 112,000.\u003c/p\u003e\n\n\u003cp\u003eThe malware activated when developers used SDK functions that generate or import wallet keys, rather than when the package was installed. It captured mnemonic seed phrases and private keys, encoded them in base64, and sent them through an HTTP POST request to an Injective Labs public infrastructure endpoint to make the traffic appear legitimate. The legitimate account owner detected the compromise within minutes, reverted the changes, and published a clean version, 1.20.23, while developers who suspect compromise were advised to transfer cryptocurrency to new wallets and rotate all secrets in their environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers compromised a GitHub account belonging to a legitimate Injective Labs SDK project contributor and used it to publish malicious version 1.20.21 of the @injectivelabs/sdk-ts npm package.","The malicious package stole cryptocurrency wallet private keys and mnemonic seed phrases when developers used SDK functions that generate or import wallet keys.","The attacker also published version 1.20.21 for 17 other packages associated with the project, pinning all of them to the compromised SDK version.","Socket reported that the malicious package version was downloaded 310 times before it was deprecated, and Ox Security warned that 87 dependent packages had a cumulative download count of just over 112,000.","The legitimate account owner detected the compromise within minutes, reverted the changes, and published a clean release, version 1.20.23."],"insights":["The malware did not run on installation, so compromise depends on whether developers used SDK functions that generate or import wallet keys after installing the affected packages.","The malicious code sent stolen wallet data to an Injective Labs public infrastructure endpoint, which made the outbound traffic appear legitimate.","Deprecation did not fully eliminate exposure because Socket reported that the malicious npm version was deprecated rather than removed and the malicious GitHub release artifacts were still available.","The attacker amplified the impact by publishing the same malicious version number across 17 related packages and pinning them to the compromised SDK version."],"referencedReports":[{"title":"Compromised Injective SDK npm Package","url":"http://socket.dev/blog/compromised-injective-sdk-npm-package","publisher":"Socket","context":"The article cites Socket’s analysis for the number of downloads before deprecation and the availability of malicious GitHub release artifacts.","category":"","primary":false},{"title":"InjectiveLabs NPM Package Hijacked, Impacting 87 Dependent Packages","url":"https://www.ox.security/blog/injectivelabs-npm-package-hijacked-impacting-87-dependent-packages/","publisher":"Ox Security","context":"The article references an Ox Security report warning that 87 dependent packages had a cumulative download count of just over 112,000.","category":"","primary":false},{"title":"Injective NPM Supply Chain Attack: 18 Packages Backdoored to Steal Crypto Wallet Keys","url":"http://www.stepsecurity.io/blog/injective-npm-supply-chain-attack-18-packages-backdoored-to-steal-crypto-wallet-keys","publisher":"StepSecurity","context":"The article cites StepSecurity’s report for details on how the malware queued stolen keys and mnemonics before sending them in an HTTP request header.","category":"","primary":false}],"body":"\u003cp\u003eHackers compromised a GitHub account belonging to a legitimate contributor to the Injective Labs SDK project and used it to publish a malicious npm package. The affected package was version 1.20.21 of @injectivelabs/sdk-ts, a TypeScript/JavaScript SDK used to build applications on the Injective blockchain. Security companies Socket, Ox Security, and StepSecurity detected the supply-chain attack.\u003c/p\u003e\n\n\u003cp\u003eThe package has 50,000 weekly downloads and is used by developers building cryptocurrency wallets, trading bots, decentralized exchanges, DeFi applications, and payment tools. The attacker also published version 1.20.21 for 17 other packages associated with the project, pinning all of them to the compromised SDK version. Socket said the malicious version was downloaded 310 times before it was deprecated, while Ox Security reported that 87 dependent packages had a cumulative download count of a little over 112,000.\u003c/p\u003e\n\n\u003cp\u003eThe malware activated when developers used SDK functions that generate or import wallet keys, rather than when the package was installed. It captured mnemonic seed phrases and private keys, encoded them in base64, and sent them through an HTTP POST request to an Injective Labs public infrastructure endpoint to make the traffic appear legitimate. The legitimate account owner detected the compromise within minutes, reverted the changes, and published a clean version, 1.20.23, while developers who suspect compromise were advised to transfer cryptocurrency to new wallets and rotate all secrets in their environment.\u003c/p\u003e\n"},{"n":6,"title":"Fake Braintree NuGet Package Skims Credit Cards and Harvests Merchant Credentials","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/braintree-nuget-typosquat-skims-credit-cards?utm_medium=feed","time":"19:58","priority":"SHOULD READ","score":88,"tldr":"A malicious NuGet typosquat, Braintree.Net, impersonated PayPal Braintree’s official SDK while stealing live payment card data, Braintree merchant API keys, and host secrets through a companion DependencyInjector.Core package. Any organization that used the affected packages should remove them, rotate credentials, investigate possible card-data exposure, and block the attacker domain.","briefOverview":"\u003cp\u003eSocket’s AI scanner flagged a suspicious NuGet package, \u003ccode\u003eBraintree.Net\u003c/code\u003e, masquerading as the official PayPal Braintree .NET SDK, with the first malicious version published on July 3, 2026. The package copied the surface API, README content, metadata, and project URL of the legitimate Braintree library while using a different package name and version scheme. Socket’s Threat Research team found that affected versions routed stolen data to attacker-controlled infrastructure at \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package intercepted live payment card data and stole Braintree merchant API credentials when used in production. Its added \u003ccode\u003eCardOperationLogger\u003c/code\u003e hooked payment-related methods to send card numbers, CVVs, expiration dates, customer IDs, amounts, and related transaction details to \u003ccode\u003e/api/card\u003c/code\u003e. Its modified \u003ccode\u003eBraintreeGateway.PrivateKey\u003c/code\u003e setter sent the \u003ccode\u003emerchantId\u003c/code\u003e, \u003ccode\u003epublicKey\u003c/code\u003e, and \u003ccode\u003eprivateKey\u003c/code\u003e to \u003ccode\u003e/api/account\u003c/code\u003e when the gateway was configured for Braintree’s production environment.\u003c/p\u003e\n\n\u003cp\u003eStarting with \u003ccode\u003eBraintree.Net\u003c/code\u003e 3.36.0, the package also depended on \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, which used module initializers to run on assembly load and harvest environment variables, configuration files, cloud and container metadata, dependencies, and loaded assemblies. The article also identifies related affected packages, including \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, \u003ccode\u003eSipNet\u003c/code\u003e, and \u003ccode\u003eSipNet.OpenAI.Realtime\u003c/code\u003e, and notes that some were affected transitively. Recommended actions include removing \u003ccode\u003eBraintree.Net\u003c/code\u003e, replacing it with the official \u003ccode\u003eBraintree\u003c/code\u003e package, rotating Braintree credentials, treating production card data as potentially disclosed, auditing dependency graphs, blocking the attacker domain, and hunting for outbound POSTs to \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Socket’s AI scanner flagged a malicious NuGet package named Braintree.Net that masqueraded as PayPal Braintree’s official .NET SDK and routed stolen data to api.348672-shakepay[.]com.","Confirmed malicious Braintree.Net versions 3.35.8 through 3.36.1 intercepted live payment card data, including full card numbers, CVVs, expiration dates, customer IDs, amounts, operations, gateways, card types, and timestamps.","The typosquat stole Braintree merchant credentials by sending merchantId, publicKey, and privateKey values to the attacker endpoint when a production gateway was configured.","Starting with Braintree.Net 3.36.0, the package depended on DependencyInjector.Core, which used module initializers to collect environment variables, appsettings JSON contents, cloud and container metadata, dependencies, and loaded assemblies on assembly load.","Socket recommended removing Braintree.Net, replacing it with the official Braintree package, rotating Braintree merchant credentials, auditing for DependencyInjector.Core, SipNet, and SipNet.OpenAI.Realtime, and hunting for outbound POSTs to api.348672-shakepay[.]com."],"insights":["The package’s reported popularity was misleading: roughly 11 million of its approximately 14 million downloads came from 120 empty placeholder versions, while the confirmed malicious releases had only about 334 real installs.","The payment-card and merchant-credential theft paths activated only for Braintree production environments, which reduced the chance of discovery during sandbox or development testing.","The companion DependencyInjector.Core harvester ran on assembly load through module initializers, so victim applications could leak environment and configuration secrets without calling any malicious API directly.","The attacker used different hiding strategies for different payloads: the card and account theft endpoints were plaintext strings, while the broader analytics/report endpoint was XOR-obfuscated.","SipNet became malicious through a manifest-only dependency change for .NET 8, .NET 9, and .NET 10 targets, while its own DLL remained a clean recompile of SIPSorcery."],"referencedReports":[],"body":"\u003cp\u003eSocket’s AI scanner flagged a suspicious NuGet package, \u003ccode\u003eBraintree.Net\u003c/code\u003e, masquerading as the official PayPal Braintree .NET SDK, with the first malicious version published on July 3, 2026. The package copied the surface API, README content, metadata, and project URL of the legitimate Braintree library while using a different package name and version scheme. Socket’s Threat Research team found that affected versions routed stolen data to attacker-controlled infrastructure at \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eThe malicious package intercepted live payment card data and stole Braintree merchant API credentials when used in production. Its added \u003ccode\u003eCardOperationLogger\u003c/code\u003e hooked payment-related methods to send card numbers, CVVs, expiration dates, customer IDs, amounts, and related transaction details to \u003ccode\u003e/api/card\u003c/code\u003e. Its modified \u003ccode\u003eBraintreeGateway.PrivateKey\u003c/code\u003e setter sent the \u003ccode\u003emerchantId\u003c/code\u003e, \u003ccode\u003epublicKey\u003c/code\u003e, and \u003ccode\u003eprivateKey\u003c/code\u003e to \u003ccode\u003e/api/account\u003c/code\u003e when the gateway was configured for Braintree’s production environment.\u003c/p\u003e\n\n\u003cp\u003eStarting with \u003ccode\u003eBraintree.Net\u003c/code\u003e 3.36.0, the package also depended on \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, which used module initializers to run on assembly load and harvest environment variables, configuration files, cloud and container metadata, dependencies, and loaded assemblies. The article also identifies related affected packages, including \u003ccode\u003eDependencyInjector.Core\u003c/code\u003e, \u003ccode\u003eSipNet\u003c/code\u003e, and \u003ccode\u003eSipNet.OpenAI.Realtime\u003c/code\u003e, and notes that some were affected transitively. Recommended actions include removing \u003ccode\u003eBraintree.Net\u003c/code\u003e, replacing it with the official \u003ccode\u003eBraintree\u003c/code\u003e package, rotating Braintree credentials, treating production card data as potentially disclosed, auditing dependency graphs, blocking the attacker domain, and hunting for outbound POSTs to \u003ccode\u003eapi.348672-shakepay[.]com\u003c/code\u003e.\u003c/p\u003e\n"},{"n":3,"title":"New GigaWiper Windows Backdoor Bundles Disk Wiping, Fake Ransomware, and Spyware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-gigawiper-windows-backdoor-bundles.html","time":"18:08","priority":"SHOULD READ","score":86,"tldr":"Microsoft analyzed GigaWiper, a Windows backdoor also tracked as BLUERABBIT, that combines spying and remote-control features with multiple destructive wipers disguised partly as ransomware. Defenders should focus on early detection and offline backups because once deployed, the malware can irreversibly destroy systems rather than enable recovery or ransom payment.","briefOverview":"\u003cp\u003eMicrosoft analyzed a destructive Windows backdoor called GigaWiper, which combines three older destructive programs into operator-selectable commands. The same malicious files are also tracked by Binary Defense as BLUERABBIT, with both reports listing the same four hashes and matching command servers. Binary Defense, citing Google’s Threat Intelligence Group, ties the malware to a likely Iran-nexus group aimed at Israeli organizations, while Microsoft names no country.\u003c/p\u003e\n\n\u003cp\u003eGigaWiper can wipe a physical drive and its partition table, run fake ransomware based on Crucio that encrypts files with a key it never saves, or overwrite the Windows drive using a Go rewrite of FlockWiper. The article emphasizes that these actions leave no recovery path except rebuilding from clean backups, because wiped drives and files encrypted without a saved key cannot be restored. Microsoft also found links between GigaWiper, Crucio, and FlockWiper, including a recurring “GRAT” tag in debug paths and function names.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor also has spyware and remote-control functions, including screenshots, screen recording, hidden VNC access, system collection, process and service management, registry editing, and event log wiping. It hides as a OneDrive Update scheduled task, stores information under a OneDrive registry path, and uses RabbitMQ, Redis, and MinIO for command traffic, results, and exfiltration. Microsoft recommends watching for specific signs such as the recurring OneDrive Update task, RabbitMQ or Redis traffic from ordinary desktops, and unusual use of takeown and icacls on Windows boot files, along with blocking known command servers and enabling protective Microsoft security features.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft analyzed a destructive Windows backdoor called GigaWiper that combines three older destructive programs into operator-selectable commands.","The same malicious files are tracked by Binary Defense as BLUERABBIT, and both reports list the same four hashes and matching command servers.","GigaWiper can wipe the physical drive, run fake ransomware based on Crucio that encrypts files without saving a key, or overwrite the Windows drive using a Go rewrite of FlockWiper.","The backdoor can also take screenshots, record the screen, open a hidden VNC session, collect system details, manage programs and services, edit the registry, and wipe Windows event logs.","Microsoft recommends watching for signals such as a recurring OneDrive Update scheduled task, RabbitMQ or Redis traffic from ordinary desktops, and processes using takeown and icacls on Windows boot files outside maintenance windows."],"insights":["GigaWiper’s use of RabbitMQ, Redis, and MinIO for command traffic and exfiltration can make malicious activity blend in on networks where those business services are already normal.","The fake ransomware component is especially destructive because it encrypts files but does not save the key, meaning payment or negotiation cannot restore the data.","The same malware being tracked as both GigaWiper and BLUERABBIT shows that defenders may need to correlate vendor reports by hashes and command servers rather than relying only on malware names.","The implant’s combination of spying, remote control, and multiple destructive options means finding it does not reveal whether the operator intends theft, surveillance, or system destruction.","Specific host and network signals, such as a one-minute OneDrive Update scheduled task and RabbitMQ or Redis traffic from ordinary desktops, give defenders concrete ways to look for activity before the wiper commands are used."],"referencedReports":[{"title":"GigaWiper: Anatomy of a Destructive Backdoor Assembled from Multiple Malware","url":"https://www.microsoft.com/en-us/security/blog/2026/07/09/gigawiper-anatomy-of-a-destructive-backdoor-assembled-from-multiple-malware/","publisher":"Microsoft","context":"The article is based heavily on Microsoft’s analysis of the GigaWiper Windows backdoor, including its destructive modules, command structure, infrastructure, and detection guidance.","category":"","primary":false},{"title":"BLUERABBIT: A Golang-Based Backdoor with Ransomware and Destructive Capabilities","url":"https://binarydefense.com/resources/blog/bluerabbit-a-golang-based-backdoor-with-ransomware-and-destructive-capabilities","publisher":"Binary Defense","context":"The article says Binary Defense reported the same malicious files as BLUERABBIT and listed the same hashes and command servers as Microsoft’s GigaWiper report.","category":"","primary":false},{"title":"IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors","url":"https://www.cisa.gov/sites/default/files/2023-12/aa23-335a-irgc-affiliated-cyber-actors-exploit-plcs-in-multiple-sectors-1.pdf","publisher":"CISA","context":"The article cites a December 2023 CISA advisory that listed Crucio as suspected ransomware connected to CyberAv3ngers.","category":"","primary":false},{"title":"Handala Hack Wiper Attacks","url":"https://unit42.paloaltonetworks.com/handala-hack-wiper-attacks/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s tracking of a parallel surge in Iran-linked wiper activity against Israel, much of it attributed to Handala Hack.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft analyzed a destructive Windows backdoor called GigaWiper, which combines three older destructive programs into operator-selectable commands. The same malicious files are also tracked by Binary Defense as BLUERABBIT, with both reports listing the same four hashes and matching command servers. Binary Defense, citing Google’s Threat Intelligence Group, ties the malware to a likely Iran-nexus group aimed at Israeli organizations, while Microsoft names no country.\u003c/p\u003e\n\n\u003cp\u003eGigaWiper can wipe a physical drive and its partition table, run fake ransomware based on Crucio that encrypts files with a key it never saves, or overwrite the Windows drive using a Go rewrite of FlockWiper. The article emphasizes that these actions leave no recovery path except rebuilding from clean backups, because wiped drives and files encrypted without a saved key cannot be restored. Microsoft also found links between GigaWiper, Crucio, and FlockWiper, including a recurring “GRAT” tag in debug paths and function names.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor also has spyware and remote-control functions, including screenshots, screen recording, hidden VNC access, system collection, process and service management, registry editing, and event log wiping. It hides as a OneDrive Update scheduled task, stores information under a OneDrive registry path, and uses RabbitMQ, Redis, and MinIO for command traffic, results, and exfiltration. Microsoft recommends watching for specific signs such as the recurring OneDrive Update task, RabbitMQ or Redis traffic from ordinary desktops, and unusual use of takeown and icacls on Windows boot files, along with blocking known command servers and enabling protective Microsoft security features.\u003c/p\u003e\n"},{"n":2,"title":"Dormant GitHub Accounts Help Attackers Blend In While Mapping Corporate Orgs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/dormant-github-accounts-help-attackers.html","time":"18:38","priority":"SHOULD READ","score":82,"tldr":"Datadog Security Labs warns that attackers are using years-old dormant GitHub “ghost” accounts and compromised tokens to quietly enumerate corporate GitHub orgs, repos, and users via the GitHub API. Most activity targets public data for reconnaissance, but some cases escalated to cloning private repositories.","briefOverview":"\u003cp\u003eDatadog Security Labs warned of several overlapping campaigns systematically enumerating corporate GitHub organizations, repositories, and user accounts through the GitHub API. The operators rely on automated scraping tools with custom or legitimate-sounding user agents. They also use GitHub “ghost” accounts that are often years old, along with compromised OAuth tokens and personal access tokens from legitimate users.\u003c/p\u003e\n\n\u003cp\u003eMost of the activity targets public data, but Datadog said some cases went beyond public information enumeration. In a few scenarios, data access was confirmed and attackers took steps to clone a private repository belonging to a single organization. The campaign used more than 50 dormant accounts and dozens of legitimate accounts whose personal access tokens were exposed unintentionally or compromised through some other method.\u003c/p\u003e\n\n\u003cp\u003eThe “ghost” accounts were created two to five years ago and intentionally left inactive for long periods before being used to issue API traffic across multiple organizations. Datadog said this helps the activity blend into normal GitHub API usage, especially because many API requests hit public endpoints and return successful responses. The concern is the aggregate pattern of accounts moving in sync across companies’ GitHub organizations over weeks, and in the worst case shifting from enumeration to cloning.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Datadog Security Labs warned of several overlapping campaigns systematically enumerating corporate GitHub organizations, repositories, and user accounts through the GitHub API.","The operators use automated scraping tools with custom or legitimate-sounding user agents, GitHub “ghost” accounts that are often years old, and compromised OAuth tokens or personal access tokens from legitimate users.","More than 50 dormant accounts and dozens of legitimate accounts with exposed or compromised personal access tokens were used to facilitate the enumeration.","The GitHub “ghost” accounts were created two to five years ago and left inactive for long periods before being used to issue API traffic across multiple organizations.","Most activity involved public data, but Datadog confirmed a few scenarios where attackers went beyond enumeration and cloned a private repository belonging to a single organization."],"insights":["The use of GitHub accounts created two to five years earlier shows the operators deliberately built or preserved credibility over long periods before using the accounts for scraping.","The activity is difficult to spot because individual requests often look normal, hit public endpoints, and may not require authentication at all.","The main warning sign is not a single suspicious request but coordinated behavior across multiple accounts and companies over weeks.","Reconnaissance against public GitHub data can still create real risk because it can map an organization’s repositories, members, relationships, and project activity.","The same campaigns that mostly enumerate public data have, in some confirmed cases, progressed to cloning private repositories."],"referencedReports":[{"title":"Coordinated GitHub API Enumeration","url":"https://securitylabs.datadoghq.com/articles/coordinated-github-api-enumeration/","publisher":"Datadog Security Labs","context":"The article is based on Datadog Security Labs' analysis warning of overlapping campaigns enumerating corporate GitHub organizations, repositories, and users through the GitHub API.","category":"","primary":false}],"body":"\u003cp\u003eDatadog Security Labs warned of several overlapping campaigns systematically enumerating corporate GitHub organizations, repositories, and user accounts through the GitHub API. The operators rely on automated scraping tools with custom or legitimate-sounding user agents. They also use GitHub “ghost” accounts that are often years old, along with compromised OAuth tokens and personal access tokens from legitimate users.\u003c/p\u003e\n\n\u003cp\u003eMost of the activity targets public data, but Datadog said some cases went beyond public information enumeration. In a few scenarios, data access was confirmed and attackers took steps to clone a private repository belonging to a single organization. The campaign used more than 50 dormant accounts and dozens of legitimate accounts whose personal access tokens were exposed unintentionally or compromised through some other method.\u003c/p\u003e\n\n\u003cp\u003eThe “ghost” accounts were created two to five years ago and intentionally left inactive for long periods before being used to issue API traffic across multiple organizations. Datadog said this helps the activity blend into normal GitHub API usage, especially because many API requests hit public endpoints and return successful responses. The concern is the aggregate pattern of accounts moving in sync across companies’ GitHub organizations over weeks, and in the worst case shifting from enumeration to cloning.\u003c/p\u003e\n"},{"n":4,"title":"Winning 54% of the time","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/winning-54-of-the-time/","time":"18:00","priority":"MAY READ","score":40,"tldr":"Cisco Talos reports that China-nexus actor UAT-7810 is expanding covert Operational Relay Box networks by exploiting unpatched Ruckus and ASUS routers and deploying custom backdoors like LONGLEASH and DOGLEASH. Defenders should prioritize patching edge devices and monitoring for unusual proxying or unauthorized connections.","briefOverview":"\u003cp\u003eCisco Talos’ latest findings say the China-nexus threat actor UAT-7810 is expanding its Operational Relay Box networks with a fresh suite of custom malware. The group exploits known vulnerabilities in unpatched Ruckus and ASUS routers to deploy new tools. These tools include the upgraded LONGLEASH and DOGLEASH backdoors.\u003c/p\u003e\n\n\u003cp\u003eThe article says UAT-7810 builds these covert networks to provide infrastructure for other APT groups to launch attacks against high-value targets. ORB networks create a blind spot by allowing secondary threat actors to mask their origins and route malicious traffic through seemingly innocuous nodes. By compromising edge devices like wireless routers, the group builds a decentralized proxy network that can bypass traditional perimeter defenses.\u003c/p\u003e\n\n\u003cp\u003eThe newsletter says the active development of multi-platform tools like LONGLEASH shows UAT-7810 is investing in resilient infrastructure that is hard to dismantle. Because the group relies on n-day vulnerabilities, defenders are urged to ensure edge devices, particularly Ruckus and ASUS routers, are fully patched. The article also recommends monitoring network traffic for unusual proxying behavior or unauthorized connections on devices that typically lack complex services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos reported that the China-nexus threat actor UAT-7810 is expanding its Operational Relay Box networks with a new suite of custom malware.","UAT-7810 exploits known vulnerabilities in unpatched Ruckus and ASUS routers to deploy tools including upgraded LONGLEASH and DOGLEASH backdoors.","Talos says UAT-7810 builds covert networks to provide infrastructure for other APT groups to launch attacks against high-value targets.","The article states that ORB networks allow secondary threat actors to mask their origins and route malicious traffic through seemingly innocuous nodes.","Defenders are advised to fully patch edge devices, particularly Ruckus and ASUS routers, and monitor for unusual proxying behavior or unauthorized connections."],"insights":["UAT-7810’s use of n-day vulnerabilities makes basic patch hygiene on edge devices a direct countermeasure against the group’s current activity.","Routers that appear innocuous can become part of covert infrastructure used by other APT groups, making the device owner’s network a potential relay point rather than the final target.","The article highlights traffic patterns on devices that typically lack complex services as a practical detection focus, especially unusual proxying behavior or unauthorized connections.","The newsletter frames SOC work as a sequence of judgment calls where context improves decisions, rather than as a pursuit of perfect prevention."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos’ latest findings say the China-nexus threat actor UAT-7810 is expanding its Operational Relay Box networks with a fresh suite of custom malware. The group exploits known vulnerabilities in unpatched Ruckus and ASUS routers to deploy new tools. These tools include the upgraded LONGLEASH and DOGLEASH backdoors.\u003c/p\u003e\n\n\u003cp\u003eThe article says UAT-7810 builds these covert networks to provide infrastructure for other APT groups to launch attacks against high-value targets. ORB networks create a blind spot by allowing secondary threat actors to mask their origins and route malicious traffic through seemingly innocuous nodes. By compromising edge devices like wireless routers, the group builds a decentralized proxy network that can bypass traditional perimeter defenses.\u003c/p\u003e\n\n\u003cp\u003eThe newsletter says the active development of multi-platform tools like LONGLEASH shows UAT-7810 is investing in resilient infrastructure that is hard to dismantle. Because the group relies on n-day vulnerabilities, defenders are urged to ensure edge devices, particularly Ruckus and ASUS routers, are fully patched. The article also recommends monitoring network traffic for unusual proxying behavior or unauthorized connections on devices that typically lack complex services.\u003c/p\u003e\n"},{"n":5,"title":"WolfSSL, GeoVision, VTK vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/wolfssl-vulnerabilities/","time":"18:52","priority":"MAY READ","score":40,"tldr":"Cisco Talos disclosed and coordinated patches for vulnerabilities in WolfSSL, GeoVision, and VTK-DICOM, including input validation, command injection, buffer overflow, privilege escalation, and authentication issues. The largest impact is GeoVision, with 14 advisories covering 37 CVEs.","briefOverview":"\u003cp\u003eCisco Talos’ Vulnerability Discovery \u0026amp; Research team disclosed three vulnerabilities in WolfSSL, fourteen vulnerabilities in GeoVision, and one vulnerability in VTK-DICOM. The article states that the vulnerabilities have been patched by their respective vendors in adherence to Cisco’s third-party vulnerability disclosure policy. It also notes that Snort coverage is available through the latest rule sets from Snort.org, and that Talos posts its latest Vulnerability Advisories on the Talos Intelligence website.\u003c/p\u003e\n\n\u003cp\u003eIn WolfSSL, Talos found two improper input validation vulnerabilities, TALOS-2026-2409 and TALOS-2026-2410, and one integer underflow vulnerability, TALOS-2026-2408. WolfSSL is described as an open-source product that provides secure data transfer and aims to provide lightweight and embedded security solutions. These WolfSSL vulnerabilities were discovered by Ankur Tyagi of Cisco Talos.\u003c/p\u003e\n\n\u003cp\u003eGeoVision accounted for the largest set of disclosures, with 14 advisories covering 37 CVEs across issues such as memory corruption, OS command injection, buffer overflows, stack overflows, privilege escalation, reflected XSS, a guessable session cookie, insufficient encryption, out-of-bounds reads, and lack of authentication. GeoVision is described as specializing in security technologies, including cameras and monitoring solutions, access control, and machine-identification. Talos also found one VTK-DICOM vulnerability, TALOS-2026-2366, tracked as CVE-2026-22879, which is a heap-based buffer overflow in software used to parse DICOM medical data for VTK users.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos’ Vulnerability Discovery \u0026 Research team disclosed three vulnerabilities in WolfSSL, fourteen in GeoVision, and one in VTK-DICOM.","The vulnerabilities discussed in the article have been patched by their respective vendors in line with Cisco’s third-party vulnerability disclosure policy.","The WolfSSL issues include two improper input validation vulnerabilities, TALOS-2026-2409 and TALOS-2026-2410, and one integer underflow vulnerability, TALOS-2026-2408.","Talos released 14 advisories for GeoVision vulnerabilities, covering 37 CVEs across issues such as memory corruption, OS command injection, buffer overflows, privilege escalation, reflected XSS, insufficient encryption, and lack of authentication.","Talos found one VTK-DICOM vulnerability, TALOS-2026-2366, tracked as CVE-2026-22879, which is a heap-based buffer overflow vulnerability."],"insights":["Organizations can take two concrete actions from the article: apply the vendor patches and download the latest Snort rule sets to detect attempted exploitation of these vulnerabilities.","The GeoVision disclosures are the broadest part of the roundup, with 14 advisories covering 37 CVEs across many weakness types, making GeoVision the highest-volume affected vendor in the article.","The affected products span different operational areas, including secure data transfer through WolfSSL, physical security and access-control technology through GeoVision, and medical data parsing through VTK-DICOM.","The article indicates the disclosures followed Cisco’s third-party vulnerability disclosure policy, meaning the vulnerabilities were publicly discussed after patches were available from the vendors."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos’ Vulnerability Discovery \u0026amp; Research team disclosed three vulnerabilities in WolfSSL, fourteen vulnerabilities in GeoVision, and one vulnerability in VTK-DICOM. The article states that the vulnerabilities have been patched by their respective vendors in adherence to Cisco’s third-party vulnerability disclosure policy. It also notes that Snort coverage is available through the latest rule sets from Snort.org, and that Talos posts its latest Vulnerability Advisories on the Talos Intelligence website.\u003c/p\u003e\n\n\u003cp\u003eIn WolfSSL, Talos found two improper input validation vulnerabilities, TALOS-2026-2409 and TALOS-2026-2410, and one integer underflow vulnerability, TALOS-2026-2408. WolfSSL is described as an open-source product that provides secure data transfer and aims to provide lightweight and embedded security solutions. These WolfSSL vulnerabilities were discovered by Ankur Tyagi of Cisco Talos.\u003c/p\u003e\n\n\u003cp\u003eGeoVision accounted for the largest set of disclosures, with 14 advisories covering 37 CVEs across issues such as memory corruption, OS command injection, buffer overflows, stack overflows, privilege escalation, reflected XSS, a guessable session cookie, insufficient encryption, out-of-bounds reads, and lack of authentication. GeoVision is described as specializing in security technologies, including cameras and monitoring solutions, access control, and machine-identification. Talos also found one VTK-DICOM vulnerability, TALOS-2026-2366, tracked as CVE-2026-22879, which is a heap-based buffer overflow in software used to parse DICOM medical data for VTK users.\u003c/p\u003e\n"},{"n":7,"title":"Why Do F1 Teams Need Cybersecurity, and How Is AI Changing the Threat Landscape?","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/f1-cybersecurity-ai-threats","time":"19:10","priority":"MAY READ","score":35,"tldr":"F1 teams face enterprise-grade cyber risks because their competitive advantage depends on fast-moving telemetry, software, partner access, and global operations. The article argues that AI is making phishing, deepfakes, and discovery faster for attackers, while zero trust and AI-driven security controls are needed to protect data, identities, vendors, and AI systems.","briefOverview":"\u003cp\u003eThe article explains that Formula 1 teams operate as traveling engineering environments that generate and move hundreds of gigabytes of telemetry during a race weekend. This data flows from the car to the garage, trackside systems, the factory, and back to the pit wall. The article says the competitive edge is inside those data flows, making F1 teams attractive to rivals, criminal groups, and nation-state actors.\u003c/p\u003e\n\n\u003cp\u003eThe risks include live telemetry, proprietary software and analytics, sponsor financials, contracts, planning documents, and global operations across more than 20 countries in a season. Third-party vendors, suppliers, partners, contractors, media, and sponsors can expand the attack surface because each integration or temporary access point creates another path into the team environment. The article identifies IP theft, ransomware, and social engineering as familiar enterprise threats that become especially urgent in the time-sensitive setting of a race weekend.\u003c/p\u003e\n\n\u003cp\u003eThe article says AI is changing the threat landscape by helping attackers generate convincing phishing content, create audio or video deepfakes, and automate discovery of exposed systems. It also says AI can help defenders establish normal behavior patterns, track human and non-human identities, and correlate risks that become dangerous in combination. The article argues that zero trust security is needed because F1 does not have a stable inside perimeter, and it describes Zscaler’s AI Security portfolio as a set of controls for users, apps, data paths, AI tools, models, and connected assets.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Formula 1 teams generate hundreds of gigabytes of telemetry across a race weekend, and this data moves between the car, garage, trackside systems, factory, and pit wall.","The article says F1 teams must protect live telemetry, proprietary software and analytics, business data, and global operations across more than 20 countries in a season.","Third-party vendors, suppliers, contractors, media, and sponsors can extend an F1 team’s attack surface because they may need temporary or integrated access to systems.","The article identifies IP theft, ransomware, and social engineering as key threats facing F1 teams, with race timing increasing pressure during outages.","The article states that AI can help attackers create convincing phishing content, deepfakes, and automated discovery campaigns, while also helping defenders baseline normal behavior and correlate risks."],"insights":["The article frames F1’s most valuable assets as the services, identities, and workflows that move data through the organization, rather than as a single database or isolated system.","The article highlights that race-weekend urgency changes ransomware economics because downtime shortly before qualifying can pressure a team to pay quickly or lose the weekend.","The article argues that temporary access for contractors, media, and sponsors can create lasting risk when short-term permissions are not removed after the event.","The article notes that AI-based detection can become less useful in messy environments because fragmented identity, inconsistent segmentation, and unclear ownership can create false positives and alert fatigue.","The article presents non-human identities, such as automated pipelines, service accounts, and AI agents, as entities that security teams must track alongside human users."],"referencedReports":[],"body":"\u003cp\u003eThe article explains that Formula 1 teams operate as traveling engineering environments that generate and move hundreds of gigabytes of telemetry during a race weekend. This data flows from the car to the garage, trackside systems, the factory, and back to the pit wall. The article says the competitive edge is inside those data flows, making F1 teams attractive to rivals, criminal groups, and nation-state actors.\u003c/p\u003e\n\n\u003cp\u003eThe risks include live telemetry, proprietary software and analytics, sponsor financials, contracts, planning documents, and global operations across more than 20 countries in a season. Third-party vendors, suppliers, partners, contractors, media, and sponsors can expand the attack surface because each integration or temporary access point creates another path into the team environment. The article identifies IP theft, ransomware, and social engineering as familiar enterprise threats that become especially urgent in the time-sensitive setting of a race weekend.\u003c/p\u003e\n\n\u003cp\u003eThe article says AI is changing the threat landscape by helping attackers generate convincing phishing content, create audio or video deepfakes, and automate discovery of exposed systems. It also says AI can help defenders establish normal behavior patterns, track human and non-human identities, and correlate risks that become dangerous in combination. The article argues that zero trust security is needed because F1 does not have a stable inside perimeter, and it describes Zscaler’s AI Security portfolio as a set of controls for users, apps, data paths, AI tools, models, and connected assets.\u003c/p\u003e\n"}]</script>
