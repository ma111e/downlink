<script type="application/json" id="dl-articles">[{"n":4,"title":"Hackers target US firms in FastJson RCE zero-day attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-target-us-firms-in-fastjson-rce-zero-day-attacks/","time":"23:49","priority":"MUST READ","score":96,"tldr":"Hackers are actively exploiting a critical FastJson 1.x zero-day (CVE-2026-16723) to achieve remote code execution against mostly U.S. organizations, especially Spring Boot fat-JAR deployments. No patch is available, so affected users should enable SafeMode or move to an unaffected version such as fastjson2.","briefOverview":"\u003cp\u003eHackers are actively exploiting CVE-2026-16723, a remote code execution vulnerability in the FastJson open-source Java library. The issue affects FastJson versions 1.2.68 through 1.2.83 and can be exploited without user interaction or elevated privileges. ThreatBook observed the malicious activity last week, and Imperva said attacks are targeting a wide range of organizations, mostly in the United States, with some activity in Singapore and Canada.\u003c/p\u003e\n\n\u003cp\u003eFastJson is an Alibaba-developed Java library used to serialize Java objects to JSON and deserialize JSON back into Java objects. FearsOff discovered the vulnerability and published a technical write-up explaining that the flaw comes from the library’s type-resolution logic, which performs attacker-controlled resource lookups before enforcing AutoType restrictions. The researchers said this allows malicious classes to be loaded and executed in Spring Boot fat-JAR deployments without AutoType enabled or third-party gadget chains.\u003c/p\u003e\n\n\u003cp\u003eAlibaba confirmed the vulnerability’s critical severity and said it is exploitable in the common Spring Boot executable fat-JAR deployment model. The vendor said specifying a target class during deserialization does not mitigate the issue because attackers can embed malicious payloads in Object or Map fields. There is currently no fix for CVE-2026-16723, and developers using affected versions are urged to enable SafeMode or switch to a non-impacted build.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hackers are actively exploiting CVE-2026-16723, a remote code execution vulnerability in the FastJson open-source Java library that requires no user interaction or elevated privileges.","The vulnerability affects FastJson versions 1.2.68 through 1.2.83 and is being used in attacks targeting a wide range of mostly U.S.-based organizations, with some attacks in Singapore and Canada.","Imperva said the attacks target organizations across Financial Services, Healthcare, Computing, Retail, Business, and other industries.","Alibaba said the issue is exploitable in the common Spring Boot executable fat-JAR deployment model and that specifying a target class during deserialization does not mitigate the vulnerability.","There is currently no fix for CVE-2026-16723, and developers using affected versions are urged to enable SafeMode immediately or switch to a non-impacted build."],"insights":["FastJson 1.2.60 and earlier are not affected, so upgrading is not the only possible version-change path; moving to a non-impacted build is also cited as mitigation.","The flaw can be exploited even when AutoType is not enabled and without third-party gadget chains, which weakens assumptions that those conditions would prevent this class of issue.","Specifying a target class during deserialization is explicitly not a mitigation because attackers can place malicious payloads inside Object or Map fields.","The vulnerable type-resolution logic is absent from fastjson2, which uses an allowlist-first model for polymorphic deserialization, making migration to fastjson2 a more durable remediation path than waiting for a FastJson 1.x patch."],"referencedReports":[{"title":"FastJson RCE 1.2.83 Active Exploitation Detected: Detection \u0026 Mitigation","url":"http://threatbook.io/blog/fastjson-rce-1.2.83-active-exploitation-detected-detection-mitigation","publisher":"ThreatBook","context":"The article says ThreatBook observed the malicious FastJson exploitation activity last week.","category":"research","primary":true},{"title":"FastJson 1.2.83 RCE","url":"https://fearsoff.org/research/fastjson-1-2-83-rce","publisher":"FearsOff","context":"The article says FearsOff discovered CVE-2026-16723 and published a technical write-up explaining the flaw.","category":"research","primary":true},{"title":"Security Advisory: Remote Code Execution in fastjson 1.2.68–1.2.83","url":"https://github.com/alibaba/fastjson2/wiki/Security-Advisory:-Remote-Code-Execution-in-fastjson-1.2.68%E2%80%931.2.83","publisher":"Alibaba","context":"The article cites Alibaba's security bulletin confirming the critical severity of the vulnerability and describing affected deployment conditions.","category":"advisory","primary":true}],"body":"\u003cp\u003eHackers are actively exploiting CVE-2026-16723, a remote code execution vulnerability in the FastJson open-source Java library. The issue affects FastJson versions 1.2.68 through 1.2.83 and can be exploited without user interaction or elevated privileges. ThreatBook observed the malicious activity last week, and Imperva said attacks are targeting a wide range of organizations, mostly in the United States, with some activity in Singapore and Canada.\u003c/p\u003e\n\n\u003cp\u003eFastJson is an Alibaba-developed Java library used to serialize Java objects to JSON and deserialize JSON back into Java objects. FearsOff discovered the vulnerability and published a technical write-up explaining that the flaw comes from the library’s type-resolution logic, which performs attacker-controlled resource lookups before enforcing AutoType restrictions. The researchers said this allows malicious classes to be loaded and executed in Spring Boot fat-JAR deployments without AutoType enabled or third-party gadget chains.\u003c/p\u003e\n\n\u003cp\u003eAlibaba confirmed the vulnerability’s critical severity and said it is exploitable in the common Spring Boot executable fat-JAR deployment model. The vendor said specifying a target class during deserialization does not mitigate the issue because attackers can embed malicious payloads in Object or Map fields. There is currently no fix for CVE-2026-16723, and developers using affected versions are urged to enable SafeMode or switch to a non-impacted build.\u003c/p\u003e\n"},{"n":7,"title":"Arista patches VeloCloud Orchestrator zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/arista-patches-velocloud-orchestrator-zero-day-exploited-in-attacks/","time":"22:49","priority":"MUST READ","score":95,"tldr":"Arista has patched a maximum-severity unauthenticated command injection zero-day in on-premises VeloCloud Orchestrator that is already being exploited. Administrators should upgrade immediately, restrict web interface access, and check logs for compromise indicators.","briefOverview":"\u003cp\u003eArista has patched CVE-2026-16812, a maximum-severity unauthenticated OS command injection vulnerability in on-premises VeloCloud Orchestrator deployments. The flaw is being actively exploited in attacks and has a severity score of 10.0. VeloCloud Orchestrator is a centralized management platform used to configure, monitor, and manage VeloCloud SD-WAN deployments and associated edge devices.\u003c/p\u003e\n\n\u003cp\u003eAccording to Arista, attackers only need network access to the VCO web interface and do not need VCO tenant or operator credentials. Successful exploitation could compromise the confidentiality, integrity, and availability of the orchestrator and the data it manages, and Arista warns that attackers could also gain access to VeloCloud Edge devices. Affected versions include VCO 5.2.x before 5.2.3.14, 6.1.x before 6.1.3.4, 6.4.x before 6.4.2.4, and 7.0.x before 7.0.0.1.\u003c/p\u003e\n\n\u003cp\u003eVeloCloud Orchestrator Hosted and Dedicated deployments were patched before the advisory was published, and VeloCloud Gateway and VeloCloud Edge products are not vulnerable. CISA added the flaw to its Known Exploited Vulnerabilities catalog and ordered U.S. federal civilian executive branch agencies to mitigate it by July 30, 2026. Arista advised administrators to restrict access to the VCO web interface, monitor for malicious IP addresses, review logs for signs of exploitation, rotate credentials, and consider restoring or replacing compromised instances.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arista patched CVE-2026-16812, a maximum-severity unauthenticated OS command injection vulnerability in on-premises VeloCloud Orchestrator deployments that is being actively exploited.","The vulnerability allows remote attackers with network access to the VCO web interface to access privileged functionality without VCO tenant or operator credentials.","Affected versions include VCO 5.2.x before 5.2.3.14, 6.1.x before 6.1.3.4, 6.4.x before 6.4.2.4, and 7.0.x before 7.0.0.1.","VeloCloud Orchestrator Hosted and Dedicated deployments were patched before the advisory, and VeloCloud Gateway and VeloCloud Edge products are not vulnerable.","CISA added CVE-2026-16812 to its Known Exploited Vulnerabilities catalog and ordered U.S. federal civilian executive branch agencies to mitigate it by July 30, 2026."],"insights":["Arista says the VCO web interface is exposed by default and has no built-in configuration option to prevent that exposure, so administrators are advised to restrict access to administrative networks while patching.","Installing the security update may not be sufficient for already compromised systems because successful exploitation can compromise both the orchestrator host and the data it manages.","The three malicious IP addresses shared by Arista are not a complete indicator set, so organizations should review logs for broader signs such as unusual web requests, unexpected outbound traffic, and unauthorized configuration changes.","If compromise is suspected, Arista advises preserving logs and filesystem timestamps before remediation, indicating that evidence collection is an important part of the response.","End-of-support VCO versions have not been assessed for exposure, so customers on unsupported release trains are directed to contact Arista Technical Assistance Center about upgrade options."],"referencedReports":[{"title":"Security Advisory 0144","url":"https://www.arista.com/en/support/advisories-notices/security-advisory/24364-security-advisory-0144","publisher":"Arista","context":"The article cites Arista's security advisory as the source for details on CVE-2026-16812, affected VCO versions, impact, fixes, and mitigation guidance.","category":"advisory","primary":true}],"body":"\u003cp\u003eArista has patched CVE-2026-16812, a maximum-severity unauthenticated OS command injection vulnerability in on-premises VeloCloud Orchestrator deployments. The flaw is being actively exploited in attacks and has a severity score of 10.0. VeloCloud Orchestrator is a centralized management platform used to configure, monitor, and manage VeloCloud SD-WAN deployments and associated edge devices.\u003c/p\u003e\n\n\u003cp\u003eAccording to Arista, attackers only need network access to the VCO web interface and do not need VCO tenant or operator credentials. Successful exploitation could compromise the confidentiality, integrity, and availability of the orchestrator and the data it manages, and Arista warns that attackers could also gain access to VeloCloud Edge devices. Affected versions include VCO 5.2.x before 5.2.3.14, 6.1.x before 6.1.3.4, 6.4.x before 6.4.2.4, and 7.0.x before 7.0.0.1.\u003c/p\u003e\n\n\u003cp\u003eVeloCloud Orchestrator Hosted and Dedicated deployments were patched before the advisory was published, and VeloCloud Gateway and VeloCloud Edge products are not vulnerable. CISA added the flaw to its Known Exploited Vulnerabilities catalog and ordered U.S. federal civilian executive branch agencies to mitigate it by July 30, 2026. Arista advised administrators to restrict access to the VCO web interface, monitor for malicious IP addresses, review logs for signs of exploitation, rotate credentials, and consider restoring or replacing compromised instances.\u003c/p\u003e\n"},{"n":30,"title":"Emerging Threat: (CVE-2026-60358) Oracle Access Manager Takeover via Authentication Engine","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-60358-oracle-access-manager-takeover-via-authentication-engine/","time":"10:14","priority":"MUST READ","score":93,"tldr":"Oracle patched CVE-2026-60358, a critical pre-authentication Oracle Access Manager flaw that can let an unauthenticated attacker take over the authentication broker and potentially affect all applications trusting it. Organizations should urgently verify patch coverage, restrict exposed Access Manager endpoints where possible, and review logs and trust secrets after remediation.","briefOverview":"\u003cp\u003eOracle disclosed CVE-2026-60358 on July 21, 2026 as part of the July 2026 Critical Patch Update. The flaw affects the Authentication Engine component of Oracle Access Manager, the single sign-on product in the Oracle Fusion Middleware stack. Oracle assigned it a CVSS v3.1 base score of 10.0 and describes it as exploitable before authentication by an unauthenticated attacker with network access over HTTP.\u003c/p\u003e\n\n\u003cp\u003eA successful attack can result in takeover of Oracle Access Manager, which matters because Access Manager issues and validates sessions that other applications trust. Oracle states that attacks may significantly impact products beyond Access Manager itself, and the article explains that the blast radius can include systems sitting behind the login service. At the time of writing, Oracle had not published root cause details, and there was no public exploit code or confirmed exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe affected supported versions are Oracle Access Manager 12.2.1.4.0 and 14.1.2.1.0, while earlier unsupported releases are likely affected but do not receive patches. The article says exposed Access Manager assets commonly appear as web-facing login endpoints for supplier, procurement, dealer, partner, customer self-service, and ERP environments, with exposure concentrated in energy and automotive and a smaller presence in banking. Recommended actions include inventorying internet-facing instances, restricting HTTP access where possible, reviewing logs for suspicious sessions, auditing administrative changes, rotating service account credentials and federation trust secrets after remediation, and treating applications that trust Access Manager sessions as in scope.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-60358 is a critical vulnerability in the Authentication Engine component of Oracle Access Manager with a CVSS v3.1 base score of 10.0.","Oracle describes the flaw as easily exploitable by an unauthenticated attacker with network access over HTTP, with no user interaction or credentials required.","Oracle Access Manager versions 12.2.1.4.0 and 14.1.2.1.0 are the affected supported versions, and earlier unsupported releases are likely affected without receiving patches.","Oracle addressed CVE-2026-60358 in the July 2026 Critical Patch Update released on July 21, 2026.","The article recommends inventorying internet-facing Oracle Access Manager instances, restricting HTTP access where possible, reviewing logs, auditing administrative changes, rotating credentials and federation trust secrets after remediation, and treating applications that trust Access Manager sessions as in scope."],"insights":["The article emphasizes that the real blast radius is not limited to Oracle Access Manager itself because applications behind it trust the sessions it issues and validates.","The affected assets are often internet-facing by design, so taking them offline can also make every application behind the login service unavailable to external users.","Exposure in the article’s data is concentrated in energy and automotive organizations, with a smaller presence in banking, particularly around supplier, procurement, dealer, and SSO portals.","The July 2026 Critical Patch Update contains 1,449 new security patches, so teams should specifically verify that their Fusion Middleware patching covers CVE-2026-60358 rather than assuming it does.","Organizations on unsupported Access Manager versions cannot rely on a patch for this issue and should assume exposure because Oracle says earlier releases are likely affected but are not receiving fixes."],"referencedReports":[],"body":"\u003cp\u003eOracle disclosed CVE-2026-60358 on July 21, 2026 as part of the July 2026 Critical Patch Update. The flaw affects the Authentication Engine component of Oracle Access Manager, the single sign-on product in the Oracle Fusion Middleware stack. Oracle assigned it a CVSS v3.1 base score of 10.0 and describes it as exploitable before authentication by an unauthenticated attacker with network access over HTTP.\u003c/p\u003e\n\n\u003cp\u003eA successful attack can result in takeover of Oracle Access Manager, which matters because Access Manager issues and validates sessions that other applications trust. Oracle states that attacks may significantly impact products beyond Access Manager itself, and the article explains that the blast radius can include systems sitting behind the login service. At the time of writing, Oracle had not published root cause details, and there was no public exploit code or confirmed exploitation in the wild.\u003c/p\u003e\n\n\u003cp\u003eThe affected supported versions are Oracle Access Manager 12.2.1.4.0 and 14.1.2.1.0, while earlier unsupported releases are likely affected but do not receive patches. The article says exposed Access Manager assets commonly appear as web-facing login endpoints for supplier, procurement, dealer, partner, customer self-service, and ERP environments, with exposure concentrated in energy and automotive and a smaller presence in banking. Recommended actions include inventorying internet-facing instances, restricting HTTP access where possible, reviewing logs for suspicious sessions, auditing administrative changes, rotating service account credentials and federation trust secrets after remediation, and treating applications that trust Access Manager sessions as in scope.\u003c/p\u003e\n"},{"n":8,"title":"Coca-Cola confirms data theft in Fairlife ransomware attack","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/coca-cola-confirms-data-theft-in-fairlife-ransomware-attack/","time":"15:39","priority":"MUST READ","score":92,"tldr":"Coca-Cola confirmed that hackers stole data from Fairlife during a ransomware attack that temporarily disrupted U.S. production. The Anubis ransomware gang has claimed responsibility and published allegedly stolen data after its ransom deadline expired.","briefOverview":"\u003cp\u003eCoca-Cola confirmed that hackers stole data from its dairy subsidiary Fairlife during a ransomware attack earlier this month. The company previously disclosed the incident in a July 16 filing with the U.S. Securities and Exchange Commission, saying the attack disrupted Fairlife production operations. Coca-Cola said it is still working to restore some impacted systems and operations, but most U.S. production has resumed.\u003c/p\u003e\n\n\u003cp\u003eFairlife produces ultra-filtered milk, protein shakes, and nutritional drinks, operates four production facilities in the U.S., and has more than $1 billion in annual retail sales. Coca-Cola said the event involved unauthorized access to part of the company’s systems, the taking of certain data, and a temporary suspension of production operations. The company also said existing inventory helped cover temporary shortages, while product quality and safety were never jeopardized.\u003c/p\u003e\n\n\u003cp\u003eThe Anubis ransomware gang claimed the attack and added Fairlife to its extortion site, threatening to leak one terabyte of allegedly stolen files unless a ransom was paid. The threat actor told BleepingComputer that Fairlife’s Nutanix systems had been encrypted and claimed there was no possibility of recovery. Coca-Cola reported the intrusion to authorities after discovering the breach and did not follow the attacker’s instructions to negotiate, and the article says the stolen data became available for download after the leak timer expired.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Coca-Cola confirmed that hackers stole data from its dairy subsidiary Fairlife during a ransomware attack earlier this month.","Coca-Cola said it is still restoring some impacted systems and operations, but most U.S. production has resumed.","The Anubis ransomware gang claimed the attack and threatened to leak one terabyte of files allegedly stolen from Fairlife unless a ransom was paid.","Coca-Cola said the incident involved unauthorized access to a portion of the company’s systems, the taking of certain data, and a temporary suspension of production operations.","Coca-Cola said product quality and safety were never jeopardized, while existing inventory helped cover temporary shortages caused by the production disruption."],"insights":["Coca-Cola says it reported the intrusion to authorities as soon as it discovered the breach and did not follow the attacker’s instructions to negotiate.","The Anubis ransomware gang’s leak deadline had expired by the time of the article, and the allegedly stolen data was already available for download.","The attack affected production operations, but Coca-Cola said existing inventory helped limit product shortages and that product quality and safety were not jeopardized.","The threat actor specifically told BleepingComputer that Fairlife’s Nutanix systems were encrypted and claimed there was no possibility of recovery."],"referencedReports":[],"body":"\u003cp\u003eCoca-Cola confirmed that hackers stole data from its dairy subsidiary Fairlife during a ransomware attack earlier this month. The company previously disclosed the incident in a July 16 filing with the U.S. Securities and Exchange Commission, saying the attack disrupted Fairlife production operations. Coca-Cola said it is still working to restore some impacted systems and operations, but most U.S. production has resumed.\u003c/p\u003e\n\n\u003cp\u003eFairlife produces ultra-filtered milk, protein shakes, and nutritional drinks, operates four production facilities in the U.S., and has more than $1 billion in annual retail sales. Coca-Cola said the event involved unauthorized access to part of the company’s systems, the taking of certain data, and a temporary suspension of production operations. The company also said existing inventory helped cover temporary shortages, while product quality and safety were never jeopardized.\u003c/p\u003e\n\n\u003cp\u003eThe Anubis ransomware gang claimed the attack and added Fairlife to its extortion site, threatening to leak one terabyte of allegedly stolen files unless a ransom was paid. The threat actor told BleepingComputer that Fairlife’s Nutanix systems had been encrypted and claimed there was no possibility of recovery. Coca-Cola reported the intrusion to authorities after discovering the breach and did not follow the attacker’s instructions to negotiate, and the article says the stolen data became available for download after the leak timer expired.\u003c/p\u003e\n"},{"n":3,"title":"New Certighost PoC exploit lets attackers hijack Windows domains","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-certighost-poc-exploit-lets-attackers-hijack-windows-domains/","time":"21:00","priority":"SHOULD READ","score":88,"tldr":"A public proof-of-concept exploit for the Certighost AD CS flaw can let an authenticated low-privileged Windows domain user obtain a certificate as a domain controller and potentially compromise the entire domain. Microsoft patched the issue in July 2026, and admins should apply the updates or temporarily disable the vulnerable chase fallback.","briefOverview":"\u003cp\u003eA proof-of-concept exploit has been released for “Certighost,” a Windows Active Directory Certificate Services vulnerability tracked as CVE-2026-54121. Microsoft fixed the flaw in the July 2026 Patch Tuesday security updates after it was reported by researchers H0j3n and Aniq Fakhrul on May 14, 2026. The article says authenticated attackers could potentially compromise a Windows domain by obtaining a certificate that allows authentication as a machine account via PKINIT.\u003c/p\u003e\n\n\u003cp\u003eThe researchers said Certighost allowed a low-privileged domain user to impersonate a Domain Controller and achieve domain compromise in the tested AD CS configuration. The issue involved an AD CS fallback mechanism called a “chase,” where attacker-controlled certificate request values could direct the Certification Authority to a supplied server and account search target. Systems previously did not verify that the supplied server was a legitimate domain controller, allowing attackers to run rogue SMB, LSA, and LDAP services and return false directory information.\u003c/p\u003e\n\n\u003cp\u003eThe released certighost.py proof-of-concept automates the attack by using the certificate to authenticate through PKINIT as a targeted domain controller, saving Kerberos credentials to a .ccache file and extracting the account’s NT hash. The researchers demonstrated using those Kerberos credentials with Impacket’s secretsdump tool to perform a DCSync attack and retrieve the krbtgt account’s credentials. Microsoft’s fix validates that the cdc server maps to a legitimate domain controller and that the returned identity matches the expected account, while the researchers also provided a temporary workaround to disable the optional chase fallback for admins who cannot install the updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A proof-of-concept exploit for the Certighost Windows Active Directory Certificate Services vulnerability has been released and can allow authenticated attackers to potentially compromise a Windows domain.","Microsoft tracked the vulnerability as CVE-2026-54121 and fixed it in the July 2026 Patch Tuesday security updates.","The vulnerability allowed attackers to direct the Certification Authority to attacker-controlled services because systems did not verify that the server supplied through the cdc value was a legitimate domain controller.","The released certighost.py proof-of-concept automates the process of using a certificate to authenticate through PKINIT as a targeted domain controller, saving Kerberos credentials to a .ccache file and extracting the account’s NT hash.","Microsoft’s fix adds validation so the Certification Authority verifies that the cdc server maps to a legitimate domain controller in Active Directory and confirms that the returned identity matches the expected account."],"insights":["The attack can begin with a low-privileged user creating a machine account, which the article says is allowed under the default ms-DS-MachineAccountQuota configuration.","The vulnerable “chase” fallback trusted identity information from attacker-controlled SMB, LSA, and LDAP services because it did not verify that the supplied server was a legitimate domain controller.","A successful attack against a domain controller account can be escalated into a DCSync attack because domain controller accounts have directory replication rights.","Administrators who cannot immediately install the July 2026 updates can temporarily disable the optional chase fallback with certutil, but the researchers warned that this mitigation has not been fully tested in production environments."],"referencedReports":[{"title":"CVE-2026-54121","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-54121","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for the Certighost vulnerability and quotes Microsoft’s description of the flaw and its impact.","category":"advisory","primary":true},{"title":"Certighost technical writeup","url":"https://gist.github.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26","publisher":"H0j3n and Aniq Fakhrul","context":"The article says the researchers publicly disclosed technical details of Certighost in this writeup and quotes their explanation of the vulnerability and exploitation path.","category":"research","primary":true}],"body":"\u003cp\u003eA proof-of-concept exploit has been released for “Certighost,” a Windows Active Directory Certificate Services vulnerability tracked as CVE-2026-54121. Microsoft fixed the flaw in the July 2026 Patch Tuesday security updates after it was reported by researchers H0j3n and Aniq Fakhrul on May 14, 2026. The article says authenticated attackers could potentially compromise a Windows domain by obtaining a certificate that allows authentication as a machine account via PKINIT.\u003c/p\u003e\n\n\u003cp\u003eThe researchers said Certighost allowed a low-privileged domain user to impersonate a Domain Controller and achieve domain compromise in the tested AD CS configuration. The issue involved an AD CS fallback mechanism called a “chase,” where attacker-controlled certificate request values could direct the Certification Authority to a supplied server and account search target. Systems previously did not verify that the supplied server was a legitimate domain controller, allowing attackers to run rogue SMB, LSA, and LDAP services and return false directory information.\u003c/p\u003e\n\n\u003cp\u003eThe released certighost.py proof-of-concept automates the attack by using the certificate to authenticate through PKINIT as a targeted domain controller, saving Kerberos credentials to a .ccache file and extracting the account’s NT hash. The researchers demonstrated using those Kerberos credentials with Impacket’s secretsdump tool to perform a DCSync attack and retrieve the krbtgt account’s credentials. Microsoft’s fix validates that the cdc server maps to a legitimate domain controller and that the returned identity matches the expected account, while the researchers also provided a temporary workaround to disable the optional chase fallback for admins who cannot install the updates.\u003c/p\u003e\n"},{"n":12,"title":"Hackers used autonomous AI agent to spy on Thailand's finance ministry","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/thailand-hackers-ai-finance-ministry","time":"12:00","priority":"SHOULD READ","score":88,"tldr":"Hackers used the open-source Hermes autonomous AI agent in “YOLO mode” to conduct cyber-espionage against Thailand’s Ministry of Finance, autonomously mapping systems, stealing credentials and deploying a custom backdoor. Researchers found no confirmed data exfiltration, but the incident shows AI agents are already being used to accelerate real-world government intrusions.","briefOverview":"\u003cp\u003eHackers used an autonomous artificial intelligence agent to carry out a cyber-espionage campaign against Thailand\u0026rsquo;s Ministry of Finance, according to Hunt.io researchers. The firm said it found hundreds of attacker files left publicly accessible while the intrusion was still in progress. Those files included malware, stolen credentials, attack scripts, AI agent logs, and evidence that multiple ministry systems had already been accessed.\u003c/p\u003e\n\n\u003cp\u003eThe operation appeared to be orchestrated in large part by Hermes, an open-source AI agent released by Nous Research, with its \u0026ldquo;YOLO mode\u0026rdquo; enabled so it could execute commands without human approval. Researchers said the agent independently explored the ministry\u0026rsquo;s network, searched internal files, gathered system information, and looked for ways to gain elevated privileges. The exposed infrastructure also included exploits for known vulnerabilities, scripts tailored to ministry systems, active authentication cookies, and a previously undocumented backdoor called Hades.\u003c/p\u003e\n\n\u003cp\u003eHunt.io said it found no indication that data had been exfiltrated, and the activity appeared focused on reconnaissance, credential theft, and mapping the ministry\u0026rsquo;s network for possible follow-on operations. The firm did not attribute the campaign to a known hacking group, but said multiple indicators suggested the operators were Chinese-speaking. ThaiCERT and Thailand\u0026rsquo;s National Cyber Security Agency were notified on July 15, and Thai cybersecurity officials later said they would strengthen defenses against cyberattacks involving AI agents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Hunt.io researchers said hackers used an autonomous AI agent to conduct a cyber-espionage campaign against Thailand's Ministry of Finance.","The attackers used Hermes, an open-source AI agent from Nous Research, with \"YOLO mode\" enabled so it could execute commands without human approval.","The exposed attacker infrastructure contained malware, stolen credentials, attack scripts, AI agent logs, active authentication cookies and a previously undocumented backdoor called Hades.","Hunt.io found evidence that multiple ministry systems had been compromised, but said it found no indication that data had been exfiltrated.","Thailand's ThaiCERT and National Cyber Security Agency were notified on July 15, and Thai cybersecurity officials later said they would strengthen defenses against AI-agent cyberattacks."],"insights":["The attackers’ own server was left publicly accessible while the intrusion was still in progress, exposing logs, scripts, credentials and malware that revealed how the operation worked.","The AI agent was not just assisting a human operator; Hunt.io said it independently explored the ministry’s network, searched internal files, gathered system information and looked for privilege-escalation opportunities.","The operation appeared focused on reconnaissance, credential theft and network mapping rather than confirmed data theft, suggesting the compromise may have been preparation for follow-on activity.","The attackers used scripts tailored to the Ministry of Finance’s internal portals, email systems and document platforms, showing the campaign was specifically customized for that agency.","Thailand’s cybersecurity response announcement did not directly name the Hunt.io case, but its new focus on AI-agent threats closely followed the notification of the incident."],"referencedReports":[{"title":"Thailand Ministry Finance Targeted with Hermes AI Agent","url":"https://hunt.io/blog/thailand-ministry-finance-targeted-with-hermes-ai-agent","publisher":"Hunt.io","context":"The article cites Hunt.io's report as the source for findings about the attacker infrastructure, Hermes AI agent use, stolen credentials, and Hades malware in the campaign against Thailand's Ministry of Finance.","category":"research","primary":true}],"body":"\u003cp\u003eHackers used an autonomous artificial intelligence agent to carry out a cyber-espionage campaign against Thailand\u0026rsquo;s Ministry of Finance, according to Hunt.io researchers. The firm said it found hundreds of attacker files left publicly accessible while the intrusion was still in progress. Those files included malware, stolen credentials, attack scripts, AI agent logs, and evidence that multiple ministry systems had already been accessed.\u003c/p\u003e\n\n\u003cp\u003eThe operation appeared to be orchestrated in large part by Hermes, an open-source AI agent released by Nous Research, with its \u0026ldquo;YOLO mode\u0026rdquo; enabled so it could execute commands without human approval. Researchers said the agent independently explored the ministry\u0026rsquo;s network, searched internal files, gathered system information, and looked for ways to gain elevated privileges. The exposed infrastructure also included exploits for known vulnerabilities, scripts tailored to ministry systems, active authentication cookies, and a previously undocumented backdoor called Hades.\u003c/p\u003e\n\n\u003cp\u003eHunt.io said it found no indication that data had been exfiltrated, and the activity appeared focused on reconnaissance, credential theft, and mapping the ministry\u0026rsquo;s network for possible follow-on operations. The firm did not attribute the campaign to a known hacking group, but said multiple indicators suggested the operators were Chinese-speaking. ThaiCERT and Thailand\u0026rsquo;s National Cyber Security Agency were notified on July 15, and Thai cybersecurity officials later said they would strengthen defenses against cyberattacks involving AI agents.\u003c/p\u003e\n"},{"n":33,"title":"Helpdesk Hijackers: Teams Vishing, Quick Assist, and GoGRPC Backdoor","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/helpdesk-hijackers-teams-vishing-quick-assist-and-gogrpc-backdoor","time":"14:51","priority":"SHOULD READ","score":88,"tldr":"Zscaler ThreatLabz reports a likely ransomware initial-access broker using Microsoft Teams vishing and Quick Assist to compromise organizations, then deploying the evolving GoGRPC backdoor and related proxy/exfiltration tools. The campaigns have grown more sophisticated and selective, with recent activity focused on corporate environments and tooling such as Kind, RevSocket, PyGRPC, S3Siphon, and RSOX.","briefOverview":"\u003cp\u003eZscaler ThreatLabz has been tracking attacks since January 2026 from a threat actor that is likely an initial access broker for ransomware attacks. The campaigns begin with targeted vishing through Microsoft Teams, where the actor poses as IT or helpdesk staff and persuades the victim to launch a Quick Assist remote support session. After gaining access, the actor uses PowerShell scripts to gather host information, create persistence, and deploy malware tools.\u003c/p\u003e\n\n\u003cp\u003eThe main malware examined in the article is GoGRPC, a Go-based backdoor with four observed variants named Lep, Giver, Pet, and Kind. These variants share overlapping capabilities but differ in areas such as fingerprinting, agent ID generation, mutex checks, obfuscation, TLS support, and gRPC protocol details. GoGRPC communicates with its command-and-control server using gRPC over HTTP/2, with later variants adding TLS support and the Kind variant changing the endpoint to /Refuse/Connect.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz also observed additional tools deployed in these campaigns, including BlindDoor, S3Siphon, RevSocket, PyGRPC, and RSOX. These tools provide functions such as command execution, file exfiltration to an AWS S3 bucket, and SOCKS proxy tunneling over gRPC or WebSockets. The article states that recent activity has become more selective, using PowerShell scripts to assess antivirus and endpoint detection tools, domain controllers, and corporate environment characteristics before further payload deployment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz has tracked attacks since January 2026 from a threat actor that likely acts as an initial access broker for ransomware attacks.","The attacks begin with vishing through Microsoft Teams, where the threat actor poses as IT or helpdesk staff and persuades victims to launch a Quick Assist remote support session.","After initial access, the threat actor uses PowerShell scripts to collect host information, establish persistence, and deploy the Go-based GoGRPC backdoor or other malware tools.","ThreatLabz identified four GoGRPC variants named Lep, Giver, Pet, and Kind, with overlapping capabilities and implementation differences including TLS support, fingerprinting behavior, and obfuscation.","The threat actor has also deployed tools named BlindDoor, RevSocket, PyGRPC, S3Siphon, and RSOX for backdoor access, proxying, reconnaissance, and file exfiltration."],"insights":["GoGRPC uses gRPC over HTTP/2 directly for command-and-control communications, which the article notes is unlike common public C2 frameworks where gRPC is typically used only for internal communication between framework components.","The Lep and Giver variants communicated over port 443 without TLS, while the later Pet and Kind variants added TLS support, showing a concrete shift toward more protected network traffic.","Recent activity became more selective, with PowerShell scripts used to assess antivirus, endpoint detection, domain controller presence, and broader corporate environment value before deploying later-stage payloads.","S3Siphon is designed to avoid many system and temporary files while targeting common user folders such as Desktop, Documents, Downloads, OneDrive, Pictures, and Videos, indicating file theft focused on user data rather than indiscriminate collection.","RSOX can take its server URL and authentication token from environment variables instead of only using hardcoded values, allowing the threat actor to reconfigure infrastructure without changing the binary."],"referencedReports":[],"body":"\u003cp\u003eZscaler ThreatLabz has been tracking attacks since January 2026 from a threat actor that is likely an initial access broker for ransomware attacks. The campaigns begin with targeted vishing through Microsoft Teams, where the actor poses as IT or helpdesk staff and persuades the victim to launch a Quick Assist remote support session. After gaining access, the actor uses PowerShell scripts to gather host information, create persistence, and deploy malware tools.\u003c/p\u003e\n\n\u003cp\u003eThe main malware examined in the article is GoGRPC, a Go-based backdoor with four observed variants named Lep, Giver, Pet, and Kind. These variants share overlapping capabilities but differ in areas such as fingerprinting, agent ID generation, mutex checks, obfuscation, TLS support, and gRPC protocol details. GoGRPC communicates with its command-and-control server using gRPC over HTTP/2, with later variants adding TLS support and the Kind variant changing the endpoint to /Refuse/Connect.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz also observed additional tools deployed in these campaigns, including BlindDoor, S3Siphon, RevSocket, PyGRPC, and RSOX. These tools provide functions such as command execution, file exfiltration to an AWS S3 bucket, and SOCKS proxy tunneling over gRPC or WebSockets. The article states that recent activity has become more selective, using PowerShell scripts to assess antivirus and endpoint detection tools, domain controllers, and corporate environment characteristics before further payload deployment.\u003c/p\u003e\n"},{"n":2,"title":"Ernst \u0026 Young data breach claimed by ShinyHunters extortion gang","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ernst-and-young-data-breach-claimed-by-shinyhunters-extortion-gang/","time":"15:12","priority":"SHOULD READ","score":86,"tldr":"ShinyHunters claims it breached Ernst \u0026 Young using credentials obtained through a supply-chain attack, accessing systems including Jira, GitHub, and Azure. EY has confirmed a third-party support ticket platform was compromised and client tax-related documents were stolen, but has not verified ShinyHunters’ claims or disclosed the number of affected people.","briefOverview":"\u003cp\u003eThe ShinyHunters extortion gang has claimed responsibility for a recently disclosed Ernst \u0026amp; Young data breach. EY previously said a third-party information technology service management platform used by its IT personnel was compromised. Support tickets submitted through the platform may include documents containing client tax information, and EY said multiple documents were downloaded.\u003c/p\u003e\n\n\u003cp\u003eEY detected unusual activity on April 23 and determined that the attacker accessed the platform between March 28 and April 12. ShinyHunters claimed to BleepingComputer that EY credentials were obtained through a supply-chain attack and used to access EY’s Jira, GitHub, and Azure environments. BleepingComputer said it could not independently verify the threat actor’s claims, and EY has not confirmed that ShinyHunters was behind the attack.\u003c/p\u003e\n\n\u003cp\u003eThe stolen documents contained personal and financial information included in or used to prepare tax filings, according to EY’s notification. The company has not disclosed the name of the compromised support system, the specific types of information exposed, or how many people were affected. EY said it secured its systems, removed the unauthorized access, notified federal law enforcement, and is offering affected clients 24 months of identity monitoring and restoration services through Experian.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The ShinyHunters extortion gang claimed responsibility for Ernst \u0026 Young’s recently disclosed data breach and threatened to release allegedly stolen data if EY does not contact the group by July 31, 2026.","Ernst \u0026 Young said a third-party IT service management support ticket platform used by its IT personnel was compromised, and support tickets that may contain client tax information were stolen.","EY detected unusual activity on April 23 and determined that the attacker accessed the platform between March 28 and April 12, downloading multiple documents.","ShinyHunters claimed to BleepingComputer that EY credentials were obtained through a supply-chain attack and used to access EY’s Jira, GitHub, and Azure environments.","EY has not disclosed the name of the compromised support system, the specific types of information exposed, or how many people were affected, and BleepingComputer could not independently verify ShinyHunters’ claims."],"insights":["The breach involved a support ticket platform used for IT help with tax-related work, showing that sensitive client tax documents can be exposed through routine support workflows rather than only through primary tax systems.","EY’s public notice confirms stolen documents but omits the support system name, exposed data types, and affected population size, leaving clients without several details needed to judge their personal risk.","The attacker’s claimed access went beyond the acknowledged support-ticket compromise to Jira, GitHub, and Azure environments, but the article emphasizes that BleepingComputer could not verify those broader claims and EY had not confirmed them.","Affected clients are being offered 24 months of Experian identity monitoring and restoration services, indicating EY considers the stolen tax-related documents sensitive enough to warrant identity-protection support."],"referencedReports":[],"body":"\u003cp\u003eThe ShinyHunters extortion gang has claimed responsibility for a recently disclosed Ernst \u0026amp; Young data breach. EY previously said a third-party information technology service management platform used by its IT personnel was compromised. Support tickets submitted through the platform may include documents containing client tax information, and EY said multiple documents were downloaded.\u003c/p\u003e\n\n\u003cp\u003eEY detected unusual activity on April 23 and determined that the attacker accessed the platform between March 28 and April 12. ShinyHunters claimed to BleepingComputer that EY credentials were obtained through a supply-chain attack and used to access EY’s Jira, GitHub, and Azure environments. BleepingComputer said it could not independently verify the threat actor’s claims, and EY has not confirmed that ShinyHunters was behind the attack.\u003c/p\u003e\n\n\u003cp\u003eThe stolen documents contained personal and financial information included in or used to prepare tax filings, according to EY’s notification. The company has not disclosed the name of the compromised support system, the specific types of information exposed, or how many people were affected. EY said it secured its systems, removed the unauthorized access, notified federal law enforcement, and is offering affected clients 24 months of identity monitoring and restoration services through Experian.\u003c/p\u003e\n"},{"n":18,"title":"Operation BlueDash Deploys Level RMM and ScreenConnect via Fake Teams Update","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/operation-bluedash-deploys-level-rmm.html","time":"12:37","priority":"SHOULD READ","score":85,"tldr":"Operation BlueDash is using fake Microsoft Teams update pages and secure-document phishing lures to install legitimate RMM tools like Level RMM and ScreenConnect, giving attackers persistent remote access. Researchers tied the campaign to Nigerian operators and found related infrastructure suggesting a broader multi-brand phishing operation using Teams and Zoom lures.","briefOverview":"\u003cp\u003eCybersecurity researchers have flagged a Microsoft Teams-themed phishing campaign called Operation BlueDash that uses “secure document” lures to deliver legitimate remote monitoring and management tools. Victims are directed through compromised web infrastructure to a fake Microsoft Store page claiming that Microsoft Teams must be updated before a shared document can be opened. ZeroBEC attributed the campaign with moderate-to-high confidence to a threat actor group operating from Nigeria based on infrastructure, code history, and a GitHub environment used to run the campaigns.\u003c/p\u003e\n\n\u003cp\u003eThe fake Teams page, teamvem[.]com, delivers supportdev.exe, an Inno Setup-based loader that launches PowerShell in a hidden window. The PowerShell command fetches an official Level RMM installer, registers the endpoint using an attacker-controlled enrollment secret, and has also been found deploying ConnectWise ScreenConnect in parallel. Researchers said installing multiple RMM tools on the same host appears intended to create redundant access and improve resilience if one tool is detected and removed.\u003c/p\u003e\n\n\u003cp\u003eAfter deployment, the threat actors were observed running commands to check system state, volume protection, firewall profiles, local Administrators group membership, and the local Administrators group name. ZeroBEC said this behavior creates a detection opportunity because the commands originate through an unauthorized RMM context rather than an approved IT workflow. Related GitHub repositories showed a fake Microsoft Store Teams update page active since at least February 2026 and a separate Zoom-themed operation that downloads Tactical RMM and registers compromised hosts with the attacker.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation BlueDash uses Microsoft Teams-themed phishing emails with “secure document” lures that send victims to a counterfeit Microsoft Store page claiming Teams must be updated before the document can be opened.","The fake Teams update delivers supportdev.exe, an Inno Setup-based loader that runs hidden PowerShell to download and install Level RMM using an attacker-controlled enrollment secret.","The same PowerShell command has also been observed deploying ConnectWise ScreenConnect in parallel, indicating the attackers are installing multiple remote monitoring and management tools for persistent access.","ZeroBEC attributed Operation BlueDash with moderate-to-high confidence to a threat actor group operating from Nigeria based on infrastructure, code history, and a GitHub environment used in the campaigns.","Researchers found related GitHub repositories containing phishing source code and payload-delivery components, including a Zoom-themed operation that downloads Tactical RMM and registers compromised hosts with the attacker."],"insights":["The attackers install multiple legitimate remote management tools on the same host, which ZeroBEC says is intended to preserve access if one tool is detected and removed.","The post-installation commands provide a detection opportunity because they check reboot status, volume protection, firewall profiles, and local administrator membership from an unauthorized remote management context rather than an approved IT workflow.","The GitHub commit history showed the fake Microsoft Store Teams update page had been in place since at least February 2026, indicating the campaign infrastructure was not newly created at the time of reporting.","The same GitHub account hosted both Teams-themed and Zoom-themed lures, showing that the operators reuse the core delivery approach while changing the workplace brand, payload host, and remote management platform."],"referencedReports":[{"title":"Operation BlueDash: Multi-RMM Workplace Phishing","url":"https://zerobec.com/blog/operation-bluedash-multi-rmm-workplace-phishing","publisher":"ZeroBEC","context":"The article is primarily based on ZeroBEC's report describing Operation BlueDash, a Teams-themed phishing campaign that deploys Level RMM and ScreenConnect.","category":"research","primary":true},{"title":"ScreenConnect Phishing: DKIM, SPF, DMARC Passed","url":"https://zerobec.com/blog/screenconnect-phishing-dkim-spf-dmarc-passed","publisher":"ZeroBEC","context":"The article references a May 2026 ZeroBEC analysis of phishing emails that used secure-document lures to stealthily drop RMM backdoors.","category":"research","primary":false},{"title":"JIVS PhishKit: Domain-Adaptive Credential Harvester","url":"https://zerobec.com/blog/jivs-phishkit-domain-adaptive-credential-harvester","publisher":"ZeroBEC","context":"The article says ZeroBEC detailed JIVS PhishKit, a coordinated mailbox credential-harvesting campaign targeting multiple users within the same organization.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers have flagged a Microsoft Teams-themed phishing campaign called Operation BlueDash that uses “secure document” lures to deliver legitimate remote monitoring and management tools. Victims are directed through compromised web infrastructure to a fake Microsoft Store page claiming that Microsoft Teams must be updated before a shared document can be opened. ZeroBEC attributed the campaign with moderate-to-high confidence to a threat actor group operating from Nigeria based on infrastructure, code history, and a GitHub environment used to run the campaigns.\u003c/p\u003e\n\n\u003cp\u003eThe fake Teams page, teamvem[.]com, delivers supportdev.exe, an Inno Setup-based loader that launches PowerShell in a hidden window. The PowerShell command fetches an official Level RMM installer, registers the endpoint using an attacker-controlled enrollment secret, and has also been found deploying ConnectWise ScreenConnect in parallel. Researchers said installing multiple RMM tools on the same host appears intended to create redundant access and improve resilience if one tool is detected and removed.\u003c/p\u003e\n\n\u003cp\u003eAfter deployment, the threat actors were observed running commands to check system state, volume protection, firewall profiles, local Administrators group membership, and the local Administrators group name. ZeroBEC said this behavior creates a detection opportunity because the commands originate through an unauthorized RMM context rather than an approved IT workflow. Related GitHub repositories showed a fake Microsoft Store Teams update page active since at least February 2026 and a separate Zoom-themed operation that downloads Tactical RMM and registers compromised hosts with the attacker.\u003c/p\u003e\n"},{"n":29,"title":"Emerging Threat: (CVE-2026-10818) WPForms Pro Arbitrary File Upload Leading to Remote Code Execution","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-10818-wpforms-pro-arbitrary-file-upload-leading-to-remote-code-execution/","time":"11:05","priority":"SHOULD READ","score":85,"tldr":"WPForms Pro has a high-severity arbitrary file upload flaw, CVE-2026-10818, that can let unauthenticated attackers leave executable files on WordPress servers and potentially achieve remote code execution. Sites using public file upload forms should update to WPForms 2.0.0 or later and check upload directories for suspicious executable files.","briefOverview":"\u003cp\u003eCVE-2026-10818 is an arbitrary file upload vulnerability in WPForms Pro, the paid edition of a widely deployed WordPress form builder plugin. The flaw was published on July 25, 2026, with Wordfence as the assigning CNA, and carries a CVSS v3.1 base score of 8.1. The affected product is listed as WPForms Pro in versions up to and including 1.10.1.1, while WPForms Lite is not listed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is in the \u003ccode\u003eajax_chunk_upload_finalize\u003c/code\u003e function, which handles the final step of a chunked file upload. File type validation happens only after chunk metadata and file contents have already been written to disk, and the assembled file is not deleted when validation fails. As a result, an unauthenticated attacker can leave a file of their choosing in the WordPress uploads directory, and if the web server executes that file, the result is remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that exposure depends not only on version but also on whether a published form exposes a file upload field. It identifies marketing sites, campaign microsites, brand or product sites, press pages, and careers portals as common affected assets, and says Communication Services made up 62.1% of observed impacted assets in CyCognito’s data. WPForms released version 2.0.0 on July 14, 2026, with a changelog entry matching the described behavior, and the article recommends treating anything below 2.0.0 as in scope until WPForms states otherwise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-10818 is an arbitrary file upload vulnerability in WPForms Pro that affects versions up to and including 1.10.1.1 according to the CVE record.","The flaw is in the ajax_chunk_upload_finalize function, where validation happens after upload chunks and file contents have already been written to disk, and rejected files are not deleted.","An unauthenticated attacker can leave a chosen file in the WordPress uploads directory, which can lead to remote code execution if the web server executes that file.","The article says sites running affected WPForms Pro versions with public forms that include file upload fields are the main exposure concern.","WPForms version 2.0.0 includes a changelog entry matching the vulnerability behavior, and the article recommends treating anything below 2.0.0 as in scope until WPForms states otherwise."],"insights":["The article warns that teams should not rely strictly on the CVE’s affected-version range, because WPForms 1.10.2.x is outside the listed range but the vendor changelog suggests the relevant fix did not appear until 2.0.0.","Exposure triage should prioritize whether a public form has a file upload field, because the article distinguishes between a site merely running the affected plugin and a site exposing the vulnerable upload path.","The article highlights that the most exposed systems are often marketing, campaign, brand, press, or careers WordPress sites rather than core corporate applications, making ownership and inventory harder to manage.","Communication Services accounted for 62.1% of observed exposed assets in CyCognito’s data, which the article links to media organizations’ large numbers of WordPress publishing sites and frequent need to accept public file submissions.","The article recommends checking whether WordPress plugin auto-updates have already applied the fix before scheduling emergency work, since some sites may already be patched."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-10818 is an arbitrary file upload vulnerability in WPForms Pro, the paid edition of a widely deployed WordPress form builder plugin. The flaw was published on July 25, 2026, with Wordfence as the assigning CNA, and carries a CVSS v3.1 base score of 8.1. The affected product is listed as WPForms Pro in versions up to and including 1.10.1.1, while WPForms Lite is not listed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability is in the \u003ccode\u003eajax_chunk_upload_finalize\u003c/code\u003e function, which handles the final step of a chunked file upload. File type validation happens only after chunk metadata and file contents have already been written to disk, and the assembled file is not deleted when validation fails. As a result, an unauthenticated attacker can leave a file of their choosing in the WordPress uploads directory, and if the web server executes that file, the result is remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that exposure depends not only on version but also on whether a published form exposes a file upload field. It identifies marketing sites, campaign microsites, brand or product sites, press pages, and careers portals as common affected assets, and says Communication Services made up 62.1% of observed impacted assets in CyCognito’s data. WPForms released version 2.0.0 on July 14, 2026, with a changelog entry matching the described behavior, and the article recommends treating anything below 2.0.0 as in scope until WPForms states otherwise.\u003c/p\u003e\n"},{"n":5,"title":"New Dysphoria DDoS botnet spreads to 200k devices worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-dysphoria-ddos-botnet-spreads-to-200k-devices-worldwide/","time":"21:08","priority":"SHOULD READ","score":84,"tldr":"The Dysphoria botnet has infected about 200,000 routers, cameras, and other IoT devices worldwide, using blockchain-based command-and-control to make takedown harder. It is being used for DDoS attacks and proxy relay operations, spreading through weak credentials and known device vulnerabilities.","briefOverview":"\u003cp\u003eA botnet called Dysphoria has compromised around 200,000 devices worldwide and is using them for distributed denial of service attacks and traffic relay operations. QiAnXin XLab researchers say the botnet evolved from the jackskid and fbot malware families. They first spotted Dysphoria on March 25 and observed multiple iterations that added meaningful updates over the following months.\u003c/p\u003e\n\n\u003cp\u003eDysphoria uses a covert blockchain-based command-and-control resolution mechanism that relies on Ethereum ENS and Solana SNS domains to retrieve infrastructure information. Its command-and-control addresses are concealed inside fake IPv6 strings and recovered using a custom byte-transformation algorithm. XLab said this use of blockchain makes the botnet’s infrastructure harder to trace and dismantle.\u003c/p\u003e\n\n\u003cp\u003eThe botnet spreads through weak Telnet and SSH credentials and known vulnerabilities in routers, cameras, and various IoT devices. XLab observed a late-June variant that focused only on turning infected devices into network proxies and discarded DDoS functionality, using UPnP to create 155 port forwarding rules. The operators claim a maximum DDoS capacity of 4 Tbps, while the article notes users can reduce infection risk by updating firmware, changing default administrator passwords, disabling unnecessary remote access, and strengthening available security settings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["QiAnXin XLab researchers estimate that the Dysphoria botnet has compromised around 200,000 devices worldwide and is being used for DDoS attacks and traffic relay operations.","Dysphoria evolved from the jackskid and fbot malware by adding a blockchain-based command-and-control resolution mechanism that uses Ethereum ENS and Solana SNS domains.","XLab observed Dysphoria variants that added features such as a C2 acquisition algorithm, multi-chain support, new domains, and separation between relaying and DDoS functions.","The botnet spreads through weak Telnet and SSH credentials and known vulnerabilities in routers, cameras, and various IoT devices, including several recent and older CVEs.","Dysphoria’s operators claim a maximum DDoS capacity of 4 Tbps on a clearnet site that promotes the service as a legitimate stress-tester."],"insights":["Dysphoria’s use of Ethereum ENS and Solana SNS for command-and-control resolution makes its infrastructure harder to trace and dismantle than a botnet relying only on conventional domains or IP addresses.","The late-June variant that removed DDoS functionality and focused only on proxying shows the same infected device pool can be repurposed for different criminal infrastructure needs.","The botnet’s exploitation of both recent flaws and older issues such as CVE-2017-17215 and CVE-2020-8515 shows that long-unpatched routers and IoT devices remain valuable targets years after vulnerabilities are disclosed.","Because Dysphoria spreads through weak Telnet and SSH credentials as well as known device flaws, changing default administrator passwords and disabling unnecessary remote access are directly relevant defenses mentioned in the article."],"referencedReports":[{"title":"Dysphoria","url":"https://blog.xlab.qianxin.com/dysphoria/","publisher":"QiAnXin XLab","context":"The article cites XLab's report as the basis for details on Dysphoria's bot count, evolution, blockchain-based command-and-control, variants, and attack capabilities.","category":"research","primary":true}],"body":"\u003cp\u003eA botnet called Dysphoria has compromised around 200,000 devices worldwide and is using them for distributed denial of service attacks and traffic relay operations. QiAnXin XLab researchers say the botnet evolved from the jackskid and fbot malware families. They first spotted Dysphoria on March 25 and observed multiple iterations that added meaningful updates over the following months.\u003c/p\u003e\n\n\u003cp\u003eDysphoria uses a covert blockchain-based command-and-control resolution mechanism that relies on Ethereum ENS and Solana SNS domains to retrieve infrastructure information. Its command-and-control addresses are concealed inside fake IPv6 strings and recovered using a custom byte-transformation algorithm. XLab said this use of blockchain makes the botnet’s infrastructure harder to trace and dismantle.\u003c/p\u003e\n\n\u003cp\u003eThe botnet spreads through weak Telnet and SSH credentials and known vulnerabilities in routers, cameras, and various IoT devices. XLab observed a late-June variant that focused only on turning infected devices into network proxies and discarded DDoS functionality, using UPnP to create 155 port forwarding rules. The operators claim a maximum DDoS capacity of 4 Tbps, while the article notes users can reduce infection risk by updating firmware, changing default administrator passwords, disabling unnecessary remote access, and strengthening available security settings.\u003c/p\u003e\n"},{"n":19,"title":"n8n Sandbox Escape Lets Workflow Editors Run OS Commands as the n8n Process","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/n8n-sandbox-escape-lets-workflow.html","time":"13:05","priority":"SHOULD READ","score":84,"tldr":"n8n patched a high-severity expression sandbox escape that lets authenticated workflow editors execute operating-system commands as the n8n process. Admins should upgrade to 2.31.5 or 2.32.1, review suspicious workflows, and rotate credentials if compromise is suspected.","briefOverview":"\u003cp\u003en8n patched a high-severity expression-sandbox escape that could let an authenticated workflow editor execute operating-system commands on the server running the automation platform. The affected ranges are \u003ccode\u003e\u0026lt;2.31.5\u003c/code\u003e and \u003ccode\u003e\u0026gt;=2.32.0,\u0026lt;2.32.1\u003c/code\u003e, and the flaw was fixed in versions \u003ccode\u003e2.31.5\u003c/code\u003e and \u003ccode\u003e2.32.1\u003c/code\u003e. The issue is tracked as \u003ccode\u003eGHSA-gv7g-jm28-cr3m\u003c/code\u003e, rated High with a CVSS 4.0 score of 8.7, and had no CVE assigned as of July 27, 2026.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires a valid account with permission to create or modify workflows and does not require action from another user. A successful exploit runs commands with the privileges of the n8n process. Security Joes said this access could expose \u003ccode\u003eN8N_ENCRYPTION_KEY\u003c/code\u003e, allow decryption of credentials stored in n8n, and open paths to connected databases, internal services, and cloud endpoints.\u003c/p\u003e\n\n\u003cp\u003eSecurity Joes found the flaw while probing n8n\u0026rsquo;s February fix for \u003ccode\u003eCVE-2026-27577\u003c/code\u003e for another bypass. The researchers said the escape involved a gap in handling \u003ccode\u003eArrowFunctionExpression\u003c/code\u003e and a blind spot in property checks involving \u003ccode\u003eReflect.get()\u003c/code\u003e, which they used to recover \u003ccode\u003eprocess.getBuiltinModule\u003c/code\u003e, load \u003ccode\u003echild_process\u003c/code\u003e, and run a command on the host. Administrators are advised to update rather than rely on interim access restrictions, and defenders should review recent workflows and hunt for suspicious child processes spawned by n8n or Node.js.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["n8n patched a high-severity expression-sandbox escape that could let an authenticated workflow editor execute operating-system commands on the server running the automation platform.","The affected n8n ranges are versions before 2.31.5 and versions from 2.32.0 before 2.32.1, and the fixes are in versions 2.31.5 and 2.32.1.","The issue is tracked as GHSA-gv7g-jm28-cr3m, rated High with a CVSS 4.0 score of 8.7, and had no CVE assigned as of July 27, 2026.","Security Joes said successful access could expose N8N_ENCRYPTION_KEY, allow decryption of credentials stored in n8n, and open paths to connected databases, internal services, and cloud endpoints.","Defenders are advised to review recently created or modified workflows for unexpected arrow functions or obfuscated JavaScript and to hunt for shells, PowerShell, curl, or wget spawned as children of the n8n or Node.js process."],"insights":["The flaw was found while Security Joes was testing n8n’s February fix for CVE-2026-27577, showing that the earlier sandbox repair left a bypass in the same identifier-rewriting layer.","Security Joes said the exploit depended on two separate blind spots, the arrow-function handling gap and Reflect.get() property access, and noted that neither condition had been covered by tests.","The advisory’s interim mitigation of restricting access and workflow editing to fully trusted users is described as incomplete, so upgrading is the recommended action rather than relying on access controls alone.","The public advisory lists no patched 1.x release and does not say whether n8n Cloud was affected, leaving some deployment questions unanswered.","Defenders have concrete post-upgrade hunting leads from the article, including unexpected arrow functions or obfuscated JavaScript in workflows and command-line tools spawned by the n8n or Node.js process."],"referencedReports":[{"title":"GHSA-gv7g-jm28-cr3m","url":"https://github.com/n8n-io/n8n/security/advisories/GHSA-gv7g-jm28-cr3m","publisher":"n8n","context":"The article cites n8n's public advisory for the affected versions, fixed releases, severity rating, and CVSS score.","category":"advisory","primary":true},{"title":"Breaking the Sandbox Again: Bypassing n8n's CVE-2026-27577 Patch","url":"https://www.securityjoes.com/blog/breaking-the-sandbox-again-bypassing-n8n-s-cve-2026-27577-patch","publisher":"Security Joes","context":"The article says Security Joes shared this report describing the sandbox escape, its impact, and the technical conditions behind the exploit.","category":"research","primary":true},{"title":"GHSA-vpcf-gvg4-6qwr","url":"https://github.com/n8n-io/n8n/security/advisories/GHSA-vpcf-gvg4-6qwr","publisher":"n8n","context":"The article references this earlier advisory for CVE-2026-27577 as part of the series of expression-sandbox escapes n8n has patched since 2025.","category":"advisory","primary":false}],"body":"\u003cp\u003en8n patched a high-severity expression-sandbox escape that could let an authenticated workflow editor execute operating-system commands on the server running the automation platform. The affected ranges are \u003ccode\u003e\u0026lt;2.31.5\u003c/code\u003e and \u003ccode\u003e\u0026gt;=2.32.0,\u0026lt;2.32.1\u003c/code\u003e, and the flaw was fixed in versions \u003ccode\u003e2.31.5\u003c/code\u003e and \u003ccode\u003e2.32.1\u003c/code\u003e. The issue is tracked as \u003ccode\u003eGHSA-gv7g-jm28-cr3m\u003c/code\u003e, rated High with a CVSS 4.0 score of 8.7, and had no CVE assigned as of July 27, 2026.\u003c/p\u003e\n\n\u003cp\u003eExploitation requires a valid account with permission to create or modify workflows and does not require action from another user. A successful exploit runs commands with the privileges of the n8n process. Security Joes said this access could expose \u003ccode\u003eN8N_ENCRYPTION_KEY\u003c/code\u003e, allow decryption of credentials stored in n8n, and open paths to connected databases, internal services, and cloud endpoints.\u003c/p\u003e\n\n\u003cp\u003eSecurity Joes found the flaw while probing n8n\u0026rsquo;s February fix for \u003ccode\u003eCVE-2026-27577\u003c/code\u003e for another bypass. The researchers said the escape involved a gap in handling \u003ccode\u003eArrowFunctionExpression\u003c/code\u003e and a blind spot in property checks involving \u003ccode\u003eReflect.get()\u003c/code\u003e, which they used to recover \u003ccode\u003eprocess.getBuiltinModule\u003c/code\u003e, load \u003ccode\u003echild_process\u003c/code\u003e, and run a command on the host. Administrators are advised to update rather than rely on interim access restrictions, and defenders should review recent workflows and hunt for suspicious child processes spawned by n8n or Node.js.\u003c/p\u003e\n"},{"n":31,"title":"Socket Releases Free Certified Patches for Nuxt Security Vulnerabilities","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/patches-for-nuxt-security-vulnerabilities?utm_medium=feed","time":"22:57","priority":"SHOULD READ","score":84,"tldr":"Nuxt released security updates for multiple 3.x and 4.x vulnerabilities, including server-side RCE, authorization bypass, denial of service, payload disclosure, and a critical development-only RCE in @nuxt/devtools. Users should upgrade to Nuxt 4.5.1 or 3.21.10 and @nuxt/devtools 3.3.1, or use Socket’s free Certified Patches where immediate upgrades are not practical.","briefOverview":"\u003cp\u003eNuxt released security updates for multiple vulnerabilities affecting Nuxt 3.x and 4.x, along with a separate critical development-only vulnerability in \u003ccode\u003e@nuxt/devtools\u003c/code\u003e. Nuxt 4.5.1 and 3.21.10 address issues including server-side remote code execution, authorization bypass, denial of service, and cross-user payload disclosure. \u003ccode\u003e@nuxt/devtools\u003c/code\u003e 3.3.1 fixes a critical remote code execution vulnerability affecting development servers.\u003c/p\u003e\n\n\u003cp\u003eThe most serious production issue, GHSA-9473-5f9j-94wq, can enable server-side remote code execution through server island props. It requires \u003ccode\u003evue.runtimeCompiler\u003c/code\u003e to be enabled, which is off by default, and an application pattern where attacker-controlled island props reach Vue’s dynamic component resolution. A related vulnerability, GHSA-48hr-524c-v5w3, can allow unauthorized instantiation of HTML elements or globally registered components through server island props, but does not enable code execution.\u003c/p\u003e\n\n\u003cp\u003eSocket has published free Certified Patches for GHSA-9473-5f9j-94wq and GHSA-48hr-524c-v5w3, and is preparing patches for the remaining Nuxt advisories. Nuxt recommends upgrading to Nuxt 4.5.1 or 3.21.10 and refreshing lockfiles to ensure \u003ccode\u003e@nuxt/devtools@3.3.1\u003c/code\u003e or later is resolved. Teams using authenticated pages with Nuxt \u003ccode\u003ecache\u003c/code\u003e, \u003ccode\u003eswr\u003c/code\u003e, or \u003ccode\u003eisr\u003c/code\u003e route rules should purge CDN and edge caches after upgrading because previously cached \u003ccode\u003e_payload.json\u003c/code\u003e responses may remain available until explicitly evicted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nuxt released security updates for multiple vulnerabilities affecting Nuxt 3.x and 4.x, along with a separate critical development-only vulnerability in @nuxt/devtools.","Nuxt 4.5.1 and 3.21.10 address issues including server-side remote code execution, authorization bypass, denial of service, and cross-user payload disclosure.","@nuxt/devtools 3.3.1 fixes a critical remote code execution vulnerability affecting development servers.","Socket published free Certified Patches for GHSA-9473-5f9j-94wq and GHSA-48hr-524c-v5w3 and is preparing patches for the remaining Nuxt advisories.","Organizations using authenticated pages with Nuxt cache, swr, or isr route rules should purge CDN and edge caches after upgrading because previously cached _payload.json responses may remain available until explicitly evicted."],"insights":["The highest-severity production remote code execution issue requires vue.runtimeCompiler to be enabled, which is not the default, and also depends on attacker-controlled server island props reaching Vue dynamic component resolution.","The Nuxt DevTools remote code execution issue is limited to development environments, but it can still be reached through another local process, an exposed dev server on the local network, or a malicious site visited while the dev server is running.","Upgrading alone may not fully remove exposure for authenticated pages using Nuxt cache, swr, or isr route rules because previously cached _payload.json responses can remain available until CDN and edge caches are purged.","The route-rule authorization bypass specifically involves appMiddleware used with route rules containing uppercase characters, making route-rule key casing an actionable review target."],"referencedReports":[{"title":"Nuxt 4.5 Security","url":"https://nuxt.com/blog/v4-5-security","publisher":"Nuxt","context":"The article cites Nuxt’s security update as the source for the disclosed Nuxt 3.x, Nuxt 4.x, and @nuxt/devtools vulnerabilities and fixes.","category":"advisory","primary":true}],"body":"\u003cp\u003eNuxt released security updates for multiple vulnerabilities affecting Nuxt 3.x and 4.x, along with a separate critical development-only vulnerability in \u003ccode\u003e@nuxt/devtools\u003c/code\u003e. Nuxt 4.5.1 and 3.21.10 address issues including server-side remote code execution, authorization bypass, denial of service, and cross-user payload disclosure. \u003ccode\u003e@nuxt/devtools\u003c/code\u003e 3.3.1 fixes a critical remote code execution vulnerability affecting development servers.\u003c/p\u003e\n\n\u003cp\u003eThe most serious production issue, GHS
