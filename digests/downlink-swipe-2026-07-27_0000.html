A-9473-5f9j-94wq, can enable server-side remote code execution through server island props. It requires \u003ccode\u003evue.runtimeCompiler\u003c/code\u003e to be enabled, which is off by default, and an application pattern where attacker-controlled island props reach Vue’s dynamic component resolution. A related vulnerability, GHSA-48hr-524c-v5w3, can allow unauthorized instantiation of HTML elements or globally registered components through server island props, but does not enable code execution.\u003c/p\u003e\n\n\u003cp\u003eSocket has published free Certified Patches for GHSA-9473-5f9j-94wq and GHSA-48hr-524c-v5w3, and is preparing patches for the remaining Nuxt advisories. Nuxt recommends upgrading to Nuxt 4.5.1 or 3.21.10 and refreshing lockfiles to ensure \u003ccode\u003e@nuxt/devtools@3.3.1\u003c/code\u003e or later is resolved. Teams using authenticated pages with Nuxt \u003ccode\u003ecache\u003c/code\u003e, \u003ccode\u003eswr\u003c/code\u003e, or \u003ccode\u003eisr\u003c/code\u003e route rules should purge CDN and edge caches after upgrading because previously cached \u003ccode\u003e_payload.json\u003c/code\u003e responses may remain available until explicitly evicted.\u003c/p\u003e\n"},{"n":14,"title":"Dysphoria IoT Botnet Adds Blockchain C2 and Victim Relays After JackSkid Disruption","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/dysphoria-iot-botnet-adds-blockchain-c2.html","time":"17:16","priority":"SHOULD READ","score":82,"tldr":"The Dysphoria IoT botnet has evolved after the JackSkid disruption by using blockchain-based command-and-control records and compromised devices as relays, making takedowns harder. Researchers say it spreads mainly through weak Telnet/SSH credentials and known IoT flaws, so defenders should patch or replace exposed devices and disable unnecessary remote access.","briefOverview":"\u003cp\u003eDysphoria, an IoT botnet tracked by CNCERT and XLab, has adopted blockchain-based name services and infected-device relays after a March law-enforcement operation disrupted JackSkid infrastructure. Researchers say this design makes the botnet harder to disrupt by keeping real controllers one step removed from the addresses exposed to bots. CNCERT and XLab put the population above 200,000 bots, but the article notes that the counts have not been independently reproduced and no counting or de-duplication methodology was published.\u003c/p\u003e\n\n\u003cp\u003eXLab found that Dysphoria uses Ethereum Name Service and Solana Name Service records to locate infrastructure, including distribution-node IPv4 addresses and other infrastructure records. The DDoS sample asks a distribution node over HTTP for a current server list, and the listed endpoints are infected machines relaying traffic to the real controllers. XLab’s timeline describes rapid changes, including custom RC4 string encryption and ENS resolution at the end of April, SNS resolution in early May, and a relay-only variant with UPnP-based port mapping in late June.\u003c/p\u003e\n\n\u003cp\u003eCNCERT and XLab say Dysphoria spreads through weak Telnet and SSH passwords and known IoT remote-code-execution flaws in routers, gateways, and cameras. One listed example is CVE-2025-9528, a Linksys E1700 command-injection flaw, though the article notes that neither publication explains how it fits the botnet’s propagation chain. XLab says Dysphoria attacks internet-service and gaming targets almost daily, but it names no victims or measured peaks, and no independent source has confirmed the reported 200,000-device scale.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CNCERT and XLab report that the Dysphoria IoT botnet adopted blockchain-based name services and infected-device relays after a March law-enforcement operation disrupted JackSkid infrastructure.","XLab says Dysphoria uses Ethereum Name Service and Solana Name Service records to locate infrastructure, while infected machines relay traffic to the real controllers.","CNCERT and XLab put Dysphoria’s population above 200,000 bots, but the article notes that the counts have not been independently reproduced and no counting or de-duplication methodology was published.","The botnet reportedly spreads through weak Telnet and SSH passwords and known remote-code-execution flaws in routers, gateways, and cameras, including CVE-2025-9528 affecting the Linksys E1700.","Researchers say the relay design makes conventional server seizure harder, but Dysphoria still depends on blockchain records, reachable distribution nodes, and compromised relays."],"insights":["Dysphoria’s use of blockchain records and victim relays makes controller seizure harder, but the article emphasizes that defenders can still target dependencies such as blockchain records, distribution nodes, and compromised relay devices.","The reported bot counts should be treated cautiously because CNCERT and XLab did not publish a counting or de-duplication methodology, and no independent source has reproduced the figures.","Weak Telnet and SSH credentials remain the most consistent entry point across the differing XLab and CNCERT vulnerability lists, making password hygiene and disabling unnecessary remote access especially actionable.","The overlap in code and strings between JackSkid, Dysphoria, Kimwolf, and other botnet families points to shared tooling rather than proving a single operator, according to the researchers cited in the article.","The Linksys E1700 flaw CVE-2025-9528 appears in both published vulnerability lists, but the article notes that neither publication explains how it fits Dysphoria’s propagation chain despite NVD rating it as requiring high privileges."],"referencedReports":[{"title":"JackSkid report","url":"https://github.com/deepfield/public-research/blob/main/jackskid/report.md","publisher":"Nokia Deepfield and Comcast threat lab","context":"The article says Nokia Deepfield and Comcast documented JackSkid falling back to an Ethereum Name Service domain for command-and-control after the March disruption.","category":"research","primary":false},{"title":"Dysphoria","url":"https://blog.xlab.qianxin.com/dysphoria/","publisher":"Qi'anxin XLab","context":"The article relies on XLab’s July 25 analysis for Dysphoria’s blockchain-based infrastructure, build timeline, relay-only variant, and propagation details.","category":"research","primary":true},{"title":"JackSkid 2026 May","url":"https://blog.nicter.jp/2026/05/jackskid_2026_may/","publisher":"Japan NICT","context":"The article says Japan’s NICT independently documented the same JackSkid shift to Ethereum Name Service and Solana Name Service in May.","category":"research","primary":false},{"title":"CNCERT notice on Dysphoria","url":"https://www.secrss.com/articles/92461","publisher":"CNCERT","context":"The article references a mirrored CNCERT notice that presents the same joint research as XLab but contains a different vulnerability list.","category":"advisory","primary":true},{"title":"DDoS Threat Report 2025 Q4","url":"https://blog.cloudflare.com/ddos-threat-report-2025-q4/","publisher":"Cloudflare","context":"The article cites Cloudflare’s report for a measured 31.4 Tbps attack from the related AISURU/Kimwolf botnet before the March disruption.","category":"research","primary":false}],"body":"\u003cp\u003eDysphoria, an IoT botnet tracked by CNCERT and XLab, has adopted blockchain-based name services and infected-device relays after a March law-enforcement operation disrupted JackSkid infrastructure. Researchers say this design makes the botnet harder to disrupt by keeping real controllers one step removed from the addresses exposed to bots. CNCERT and XLab put the population above 200,000 bots, but the article notes that the counts have not been independently reproduced and no counting or de-duplication methodology was published.\u003c/p\u003e\n\n\u003cp\u003eXLab found that Dysphoria uses Ethereum Name Service and Solana Name Service records to locate infrastructure, including distribution-node IPv4 addresses and other infrastructure records. The DDoS sample asks a distribution node over HTTP for a current server list, and the listed endpoints are infected machines relaying traffic to the real controllers. XLab’s timeline describes rapid changes, including custom RC4 string encryption and ENS resolution at the end of April, SNS resolution in early May, and a relay-only variant with UPnP-based port mapping in late June.\u003c/p\u003e\n\n\u003cp\u003eCNCERT and XLab say Dysphoria spreads through weak Telnet and SSH passwords and known IoT remote-code-execution flaws in routers, gateways, and cameras. One listed example is CVE-2025-9528, a Linksys E1700 command-injection flaw, though the article notes that neither publication explains how it fits the botnet’s propagation chain. XLab says Dysphoria attacks internet-service and gaming targets almost daily, but it names no victims or measured peaks, and no independent source has confirmed the reported 200,000-device scale.\u003c/p\u003e\n"},{"n":16,"title":"TELESHIM Abuses Telegram for C2 in Attacks Against Middle East Governments","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/teleshim-abuses-telegram-for-c2-in.html","time":"08:48","priority":"SHOULD READ","score":82,"tldr":"A suspected East Asia-linked threat actor is targeting Middle East government entities with a multi-stage malware campaign that uses Telegram for command-and-control to blend in with legitimate traffic. The attack deploys new malware families including TELESHIM, MIXEDKEY, and BINDCLOAK, with heavy obfuscation and environment-based payload locking to evade analysis and run only on intended targets.","briefOverview":"\u003cp\u003eCybersecurity researchers at Zscaler ThreatLabz identified a fresh malicious campaign targeting government entities in the Middle East. The activity deployed previously unreported malware families named TELESHIM, MIXEDKEY, and BINDCLOAK. Zscaler said the campaign used a multi-stage attack chain to establish and maintain access on infected systems, with TELESHIM abusing the Telegram API for command-and-control communication to blend in with legitimate internet traffic.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with an ISO file containing a legitimate executable, RegSchdTask.exe, which is used to sideload a rogue DLL named AsTaskSched.dll. That DLL is a 32-bit Windows backdoor called TELESHIM, which retrieves next-stage components through Telegram. Later stages include a second DLL side-loading chain using GoProAlertService.exe and pthreadVC2.dll, with pthreadVC2.dll acting as the MIXEDKEY reflective loader to decrypt and execute another file.\u003c/p\u003e\n\n\u003cp\u003eTELESHIM and MIXEDKEY use heavy obfuscation techniques, and TELESHIM also checks for virtualization-based analysis environments. The final payload is protected by two layers of XOR encryption, including environmental keying based on the infected machine’s volume serial number, so it detonates only on intended targets. The attack culminates in BINDCLOAK, a 64-bit C2 implant written in C++ that contacts cert.hypersnet[.]com, and Zscaler assessed with moderate-to-high confidence that the campaign originated from East Asia while not attributing it to any known group.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Zscaler ThreatLabz detected a campaign targeting government entities in the Middle East that deployed previously unreported malware families named TELESHIM, MIXEDKEY, and BINDCLOAK.","The attack chain begins with an ISO file containing a legitimate executable, RegSchdTask.exe, which sideloads a rogue DLL named AsTaskSched.dll that acts as the 32-bit Windows backdoor TELESHIM.","TELESHIM abuses the Telegram API for command-and-control communication and supports messages for registering infected hosts, executing commands, exfiltrating results, and downloading and running secondary payloads as scheduled tasks.","TELESHIM and MIXEDKEY use heavy code obfuscation techniques, and TELESHIM also checks for virtualization-based analysis environments using methods such as CPUID hypervisor detection and Windows Management Instrumentation RAM speed checks.","Zscaler assessed with moderate-to-high confidence that the campaign originated from East Asia, but it has not attributed the activity to any known threat actor or group."],"insights":["The campaign used Telegram for command-and-control specifically to blend malicious traffic with legitimate internet activity, making ordinary-looking platform traffic part of the attacker’s concealment strategy.","The final payload was protected with environmental keying based on the infected machine’s volume serial number, which means the malware was designed to run only on intended targets and resist analysis elsewhere.","The observed operator activity occurred only between 4 a.m. and 12 p.m. UTC, with most commands between 7 a.m. and 11 a.m. UTC, giving defenders a concrete time window associated with this campaign’s post-compromise actions.","The attack chain repeatedly used DLL side-loading with legitimate executables, including RegSchdTask.exe and GoProAlertService.exe, showing that trusted-looking binaries were central to the intrusion sequence."],"referencedReports":[{"title":"Targeted Attack on Government Entities in the Middle East – Part 1","url":"https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-1","publisher":"Zscaler ThreatLabz","context":"The article cites a Zscaler ThreatLabz technical write-up as the source for details about the campaign, malware families, and attack chain.","category":"research","primary":true}],"body":"\u003cp\u003eCybersecurity researchers at Zscaler ThreatLabz identified a fresh malicious campaign targeting government entities in the Middle East. The activity deployed previously unreported malware families named TELESHIM, MIXEDKEY, and BINDCLOAK. Zscaler said the campaign used a multi-stage attack chain to establish and maintain access on infected systems, with TELESHIM abusing the Telegram API for command-and-control communication to blend in with legitimate internet traffic.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with an ISO file containing a legitimate executable, RegSchdTask.exe, which is used to sideload a rogue DLL named AsTaskSched.dll. That DLL is a 32-bit Windows backdoor called TELESHIM, which retrieves next-stage components through Telegram. Later stages include a second DLL side-loading chain using GoProAlertService.exe and pthreadVC2.dll, with pthreadVC2.dll acting as the MIXEDKEY reflective loader to decrypt and execute another file.\u003c/p\u003e\n\n\u003cp\u003eTELESHIM and MIXEDKEY use heavy obfuscation techniques, and TELESHIM also checks for virtualization-based analysis environments. The final payload is protected by two layers of XOR encryption, including environmental keying based on the infected machine’s volume serial number, so it detonates only on intended targets. The attack culminates in BINDCLOAK, a 64-bit C2 implant written in C++ that contacts cert.hypersnet[.]com, and Zscaler assessed with moderate-to-high confidence that the campaign originated from East Asia while not attributing it to any known group.\u003c/p\u003e\n"},{"n":17,"title":"Cruciferra Crypter Uses BYOVD and Process Ghosting to Hide Windows Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/cruciferra-crypter-uses-byovd-and.html","time":"10:51","priority":"SHOULD READ","score":82,"tldr":"Proofpoint says the China-linked TA4922/Silver Fox ecosystem and other cybercrime groups are using the Cruciferra crypter to deliver RATs and stealers through phishing campaigns. Cruciferra stands out for advanced evasion, including BYOVD-based EDR tampering, DLL side-loading, UAC bypass, persistence, and Process Ghosting to run payloads with fewer forensic traces.","briefOverview":"\u003cp\u003eProofpoint reported that a China-linked cybercrime group previously seen using income tax-related phishing lures against Indian taxpayers, tax professionals, and corporate finance teams has been using a sophisticated crypter service called \u003cstrong\u003eCruciferra\u003c/strong\u003e. The service has also been used by unrelated cybercriminal threat clusters to deliver remote access trojans and information stealers. Malware families distributed through Cruciferra include Agent Tesla, AsyncRAT, DarkCloud Stealer, Formbook, Phantom Stealer, Remcos RAT, Snake Keylogger, ValleyRAT, XLoader, XWorm, and zgRAT.\u003c/p\u003e\n\n\u003cp\u003eCruciferra is written in Mono and is designed to evade detection, analysis, and incident response. Proofpoint said it uses indirect system calls, API and Import Address Table unhooking, BYOVD-based EDR tampering, privilege escalation, persistence mechanisms, and a customized implementation of Process Ghosting. Its payload and string encryption varies between sample sets and appears to be dynamically derived from elements of known hashing, pseudorandom number generation, and cipher algorithms.\u003c/p\u003e\n\n\u003cp\u003eCampaigns using Cruciferra have primarily relied on phishing and have targeted financial services, healthcare, government, education, manufacturing, hospitality, and travel organizations. One campaign attributed to Chinese-speaking actor TA4922, which overlaps with Silver Fox, used tax-themed lures to send victims to attacker-controlled pages hosting ZIP files that delivered malware. Cruciferra is always executed through DLL side-loading, can disable user notifications, can abuse the GoFlyDrv.sys driver to terminate security processes, and loads the final payload with a Process Ghosting variant that reduces forensic artifacts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Proofpoint reported that the China-linked cybercrime group TA4922 and other unrelated threat clusters have used the Cruciferra crypter to deliver remote access trojans and information stealer malware.","Cruciferra is written in Mono and uses evasion techniques including indirect system calls, API and Import Address Table unhooking, BYOVD-based EDR tampering, privilege escalation, persistence mechanisms, and a customized implementation of Process Ghosting.","The crypter has been advertised on cybercrime forums as the “most lethal crypter” for $450 to $2,000 per month and was first made available for sale in fall 2025.","Malware families distributed through Cruciferra include Agent Tesla, AsyncRAT, DarkCloud Stealer, Formbook, Phantom Stealer, Remcos RAT, Snake Keylogger, ValleyRAT, XLoader, XWorm, and zgRAT.","Campaigns using Cruciferra have primarily relied on phishing and have targeted sectors including financial services, healthcare, government, education, manufacturing, hospitality, and travel."],"insights":["Cruciferra’s payload and string encryption varies so widely between sample sets that Proofpoint assessed the algorithms are probably generated polymorphically from elements of known hashing, pseudorandom number generation, and cipher algorithms, making static and signature-based detection harder.","The same crypter service is being used by unrelated criminal clusters, indicating that advanced evasion capabilities such as BYOVD-based security process termination and Process Ghosting are being sold as a reusable service rather than remaining limited to one group.","Cruciferra’s execution chain consistently relies on DLL side-loading, making that behavior a notable recurring detection opportunity across otherwise varied campaigns and payload families.","The crypter can either drop an encrypted payload to disk or download it from a staging server, giving operators flexibility to adapt delivery while keeping the same evasion framework.","Cruciferra attempts to reduce forensic evidence not only by deleting the temporary file before process start, but also by patching ZwQueryVirtualMemory hooks and tampering with NtManageHotPatch to hide the deletion and neutralize integrity checks."],"referencedReports":[{"title":"Unpacking Cruciferra: Analysis of a Sophisticated Crypter Service","url":"https://www.proofpoint.com/us/blog/threat-insight/unpacking-cruciferra-analysis-sophisticated-crypter-service","publisher":"Proofpoint","context":"The article is based on Proofpoint’s analysis of the Cruciferra crypter and its evasion, payload protection, and delivery techniques.","category":"research","primary":true},{"title":"Process Ghosting: A New Executable Image Tampering Attack","url":"https://www.elastic.co/blog/process-ghosting-a-new-executable-image-tampering-attack","publisher":"Elastic","context":"The article links to Elastic’s technical explanation while describing Process Ghosting as the technique Cruciferra uses to load the final payload into memory.","category":"research","primary":false}],"body":"\u003cp\u003eProofpoint reported that a China-linked cybercrime group previously seen using income tax-related phishing lures against Indian taxpayers, tax professionals, and corporate finance teams has been using a sophisticated crypter service called \u003cstrong\u003eCruciferra\u003c/strong\u003e. The service has also been used by unrelated cybercriminal threat clusters to deliver remote access trojans and information stealers. Malware families distributed through Cruciferra include Agent Tesla, AsyncRAT, DarkCloud Stealer, Formbook, Phantom Stealer, Remcos RAT, Snake Keylogger, ValleyRAT, XLoader, XWorm, and zgRAT.\u003c/p\u003e\n\n\u003cp\u003eCruciferra is written in Mono and is designed to evade detection, analysis, and incident response. Proofpoint said it uses indirect system calls, API and Import Address Table unhooking, BYOVD-based EDR tampering, privilege escalation, persistence mechanisms, and a customized implementation of Process Ghosting. Its payload and string encryption varies between sample sets and appears to be dynamically derived from elements of known hashing, pseudorandom number generation, and cipher algorithms.\u003c/p\u003e\n\n\u003cp\u003eCampaigns using Cruciferra have primarily relied on phishing and have targeted financial services, healthcare, government, education, manufacturing, hospitality, and travel organizations. One campaign attributed to Chinese-speaking actor TA4922, which overlaps with Silver Fox, used tax-themed lures to send victims to attacker-controlled pages hosting ZIP files that delivered malware. Cruciferra is always executed through DLL side-loading, can disable user notifications, can abuse the GoFlyDrv.sys driver to terminate security processes, and loads the final payload with a Process Ghosting variant that reduces forensic artifacts.\u003c/p\u003e\n"},{"n":9,"title":"Telegram phishing campaign targeted exiled Belarusian activist, Russians and Kazakhstanis","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/telegram-belarus-activist-russia-cyberattack","time":"16:00","priority":"SHOULD READ","score":78,"tldr":"Researchers found a highly personalized Telegram phishing campaign targeting an exiled Belarusian activist and users in Russia and Kazakhstan, using tailored links and fake security alerts to steal one-time login codes. The operation relied on device checks, tracking, and social engineering rather than malware to hijack accounts while evading detection.","briefOverview":"\u003cp\u003eResearchers at Resident NGO uncovered a highly personalized Telegram phishing campaign that tried to hijack the account of an exiled Belarusian activist in Lithuania, as well as users in Russia and Kazakhstan. The operation used fake Telegram security alerts sent through the app’s secret chat feature from an unfamiliar account registered to a Kazakhstani phone number. The messages claimed the victim had violated Telegram’s rules and would be blocked unless they clicked a link to verify the account.\u003c/p\u003e\n\n\u003cp\u003eThe phishing links were created for specific people and included their phone numbers, allowing the attackers to track who opened them. Instead of installing malware, the attackers tried to trick victims into entering Telegram one-time login codes, which could let the attackers take over an account if the code was entered before it expired. Resident NGO said it could not determine how many people were targeted, whether any accounts were compromised, or what the ultimate goal of the campaign was.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used filtering and tracking to make detection harder and pressure victims into completing the fake login process. Before showing the phishing page, the attackers checked the visitor’s browser and device, redirecting security tools and many desktop users to Telegram’s real website or other harmless pages. Researchers said the case shows that a single carefully crafted private message can be enough to compromise a civil society account without deploying malware.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Resident NGO reported a highly personalized Telegram phishing campaign that targeted at least one exiled Belarusian activist living in Lithuania and appeared to be part of a broader campaign against users in Belarus, Russia, and Kazakhstan since at least October 2024.","The attack used fake Telegram security alerts sent through secret chat from an unfamiliar account registered to a Kazakhstani phone number, warning that the victim’s account would be blocked unless they clicked a verification link.","Researchers said the individualized phishing links included targets’ phone numbers and attempted to trick victims into entering Telegram one-time login codes, which could let attackers immediately take over accounts if entered before expiration.","The attackers checked visitors’ browsers and devices before showing the fake Telegram login page, while redirecting security tools and many desktop users to Telegram’s real website or other harmless pages.","Resident NGO said it could not determine how many people were targeted, whether any accounts were compromised, or what the ultimate goal of the campaign was."],"insights":["The campaign’s most advanced element was its filtering infrastructure, which showed the phishing page only when the visitor appeared to match the intended target and redirected security tools or many desktop users to harmless pages.","The attackers used information collected when a target opened the link, such as device details, visit time, and internet service provider, in a follow-up message to make the fake warning appear more legitimate.","The phishing links were individualized with targets’ phone numbers, allowing the operators to track who opened each link rather than relying on generic mass phishing pages.","Resident NGO emphasized that this campaign showed civil society accounts can be targeted effectively without installing malware, using only a carefully crafted private message and social engineering."],"referencedReports":[{"title":"Check and Protect: Analysis of Telegram phishing operation targeting exiled activist","url":"https://resident.ngo/lab/writeups/check-and-protect-analysis-of-telegram-phishing-operation-targeting-exiled-activist/","publisher":"Resident NGO","context":"The article says this Resident NGO report documented how the operation targeted at least one Belarusian activist living in Lithuania.","category":"research","primary":true},{"title":"A Telegram of Trouble: Tracking a Regional OTP Phishing Infrastructure Targeting Users in Russia, Belarus and Kazakhstan for 2 Years","url":"https://resident.ngo/lab/writeups/a-telegram-of-trouble-tracking-a-regional-otp-phishing-infrastructure-targeting-users-in-russia-belarus-and-kazakhstan-for-2-years/","publisher":"Resident NGO","context":"The article says this Resident NGO report linked the activity to a broader Telegram phishing campaign against users in Belarus, Russia, and Kazakhstan since at least October 2024.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at Resident NGO uncovered a highly personalized Telegram phishing campaign that tried to hijack the account of an exiled Belarusian activist in Lithuania, as well as users in Russia and Kazakhstan. The operation used fake Telegram security alerts sent through the app’s secret chat feature from an unfamiliar account registered to a Kazakhstani phone number. The messages claimed the victim had violated Telegram’s rules and would be blocked unless they clicked a link to verify the account.\u003c/p\u003e\n\n\u003cp\u003eThe phishing links were created for specific people and included their phone numbers, allowing the attackers to track who opened them. Instead of installing malware, the attackers tried to trick victims into entering Telegram one-time login codes, which could let the attackers take over an account if the code was entered before it expired. Resident NGO said it could not determine how many people were targeted, whether any accounts were compromised, or what the ultimate goal of the campaign was.\u003c/p\u003e\n\n\u003cp\u003eThe campaign used filtering and tracking to make detection harder and pressure victims into completing the fake login process. Before showing the phishing page, the attackers checked the visitor’s browser and device, redirecting security tools and many desktop users to Telegram’s real website or other harmless pages. Researchers said the case shows that a single carefully crafted private message can be enough to compromise a civil society account without deploying malware.\u003c/p\u003e\n"},{"n":10,"title":"UK court rejects Bahrain immunity claim in spyware case","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/uk-court-rejects-bahrain-immunity-claim-spyware-case","time":"17:52","priority":"SHOULD READ","score":78,"tldr":"The UK Supreme Court ruled that Bahrain cannot use state immunity to block a lawsuit by two UK-based dissidents who allege Bahraini officials infected their laptops with FinSpy spyware. The decision allows their damages claim over alleged intrusive surveillance and harassment to proceed in the UK.","briefOverview":"\u003cp\u003eThe United Kingdom’s Supreme Court ruled that Bahrain cannot use state immunity to block a lawsuit filed by two dissidents, Saeed Shehabi and Moosa Mohammed. The men allege Bahrain secretly installed FinSpy spyware on their laptops, likely in 2011. They now live in the U.K. and are seeking damages from Bahrain for the mental harm they say they suffered.\u003c/p\u003e\n\n\u003cp\u003eAccording to the court opinion, the alleged hacking allowed access to and exfiltration of information on the computers, interception of communications, and use of the computers’ microphones and cameras to surveil the men. The opinion said the alleged conduct involved wide-ranging monitoring by highly intrusive means and met the bar for illegal harassment. The court rejected Bahrain’s state immunity argument in a 3-2 decision, finding that because the alleged hack occurred in the U.K., state immunity does not apply.\u003c/p\u003e\n\n\u003cp\u003eFinSpy, also known as FinFisher, has been described by The Citizen Lab as sophisticated spyware sold exclusively to governments for intelligence and law enforcement purposes. The men learned their devices had been infected around August 2014 after seeing reports on WikiLeaks and from a Bahraini watchdog organization. Bahrain has long asserted that the hacking claims are false, and a spokesperson for Bahrain’s Global Communication Office did not immediately respond to a request for comment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The United Kingdom’s Supreme Court ruled that Bahrain cannot use state immunity to block a lawsuit filed by Saeed Shehabi and Moosa Mohammed over alleged spyware infections on their laptops.","Shehabi and Mohammed allege Bahrain secretly installed FinSpy spyware on their laptops, likely in 2011, and used it to access and exfiltrate information, intercept communications, and surveil them through microphones and cameras.","The court opinion said the alleged conduct involved wide-ranging monitoring by highly intrusive means and met the bar for illegal harassment.","The court rejected Bahrain’s state immunity argument in a 3-2 decision, finding that state immunity does not apply because the alleged hack occurred in the U.K.","FinSpy, also known as FinFisher, has been described by The Citizen Lab as sophisticated spyware sold exclusively to governments for intelligence and law enforcement purposes."],"insights":["The ruling turns the location of the alleged hacking into a decisive legal factor, because the court found that state immunity did not apply when the alleged hack occurred in the U.K.","The court treated the alleged spyware activity as potentially amounting to illegal harassment, showing that intrusive digital surveillance can be framed in court as personal harm rather than only as a technical intrusion.","The alleged compromise was discovered years after it likely occurred, after the men saw reports from WikiLeaks and a Bahraini watchdog organization, highlighting how spyware victims may learn of infections through outside disclosures rather than immediate detection.","The case targets Bahrain directly rather than only the spyware maker, even though FinFisher later declared insolvency amid investigations into its business dealings."],"referencedReports":[],"body":"\u003cp\u003eThe United Kingdom’s Supreme Court ruled that Bahrain cannot use state immunity to block a lawsuit filed by two dissidents, Saeed Shehabi and Moosa Mohammed. The men allege Bahrain secretly installed FinSpy spyware on their laptops, likely in 2011. They now live in the U.K. and are seeking damages from Bahrain for the mental harm they say they suffered.\u003c/p\u003e\n\n\u003cp\u003eAccording to the court opinion, the alleged hacking allowed access to and exfiltration of information on the computers, interception of communications, and use of the computers’ microphones and cameras to surveil the men. The opinion said the alleged conduct involved wide-ranging monitoring by highly intrusive means and met the bar for illegal harassment. The court rejected Bahrain’s state immunity argument in a 3-2 decision, finding that because the alleged hack occurred in the U.K., state immunity does not apply.\u003c/p\u003e\n\n\u003cp\u003eFinSpy, also known as FinFisher, has been described by The Citizen Lab as sophisticated spyware sold exclusively to governments for intelligence and law enforcement purposes. The men learned their devices had been infected around August 2014 after seeing reports on WikiLeaks and from a Bahraini watchdog organization. Bahrain has long asserted that the hacking claims are false, and a spokesperson for Bahrain’s Global Communication Office did not immediately respond to a request for comment.\u003c/p\u003e\n"},{"n":11,"title":"Health system in South Carolina, Georgia closes offices after malware affects networks","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/health-system-south-carolina-georgia-disruptions-malware","time":"17:38","priority":"SHOULD READ","score":78,"tldr":"AnMed, a nonprofit health system serving South Carolina and Georgia, closed dozens of clinics and departments after a malware-related cybersecurity disruption caused network, phone, and internet outages. Urgent care remains open while the organization works to restore systems and coordinate patient care with regional partners.","briefOverview":"\u003cp\u003eAnMed, a nonprofit health system serving South Carolina and Georgia, is responding to a cybersecurity disruption involving malware. The organization said it was working to restore systems and determine the scope of the incident. Earlier, it warned of a phone and internet outage across all of its facilities.\u003c/p\u003e\n\n\u003cp\u003eThe incident led AnMed to close dozens of facilities and departments. Urgent care services remain open, but all imaging, OBGYN, primary care clinics, and medical group offices are closed. AnMed serves northeast Georgia and upstate South Carolina through four hospitals and more than 60 physician practices.\u003c/p\u003e\n\n\u003cp\u003eAnMed said it is coordinating with emergency medical services, regional hospitals, and public safety partners to help patients receive care in the most appropriate setting. The article notes that medical cyberattacks have repeatedly affected patient care this year, including an attack by Iranian hackers on medical device company Stryker. It also cites IBM findings that healthcare data breaches in 2025 averaged $7.4 million per incident and took 279 days to detect and resolve.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AnMed, a nonprofit health system serving South Carolina and Georgia, said it was experiencing a cybersecurity disruption involving malware.","The incident caused a phone and internet outage across all AnMed facilities and led the organization to close dozens of facilities and departments.","AnMed said urgent care services remain open, but all imaging, OBGYN, primary care clinics, and medical group offices are closed.","AnMed serves northeast Georgia and upstate South Carolina with four hospitals and more than 60 physician practices.","AnMed said it is coordinating with emergency medical services, regional hospitals, and public safety partners to help patients receive care in the most appropriate setting."],"insights":["The disruption affected both clinical operations and basic communications, since AnMed first warned of phone and internet outages across all facilities before reporting malware involvement.","AnMed’s response shows that healthcare cyber incidents can require regional care coordination beyond the affected organization, including emergency medical services, regional hospitals, and public safety partners.","The article places the incident within a broader pattern of healthcare cyberattacks affecting patient care, including a separate cyberattack on medical device company Stryker.","IBM’s cited data highlights healthcare as an unusually high-impact sector for cyber incidents, with the highest average breach cost across industries for 12 consecutive years and longer-than-average detection and resolution times."],"referencedReports":[{"title":"Cost of a Data Breach Report","url":"https://www.ibm.com/reports/data-breach?utm_medium=OSocial\u0026utm_source=Blog\u0026utm_content=RSRWW\u0026utm_id=SI-Blog-CTA-Button","publisher":"IBM","context":"The article cites IBM’s report for data showing that healthcare breaches in 2025 had the highest average cost of any industry and took longer than average to detect and resolve.","category":"research","primary":false}],"body":"\u003cp\u003eAnMed, a nonprofit health system serving South Carolina and Georgia, is responding to a cybersecurity disruption involving malware. The organization said it was working to restore systems and determine the scope of the incident. Earlier, it warned of a phone and internet outage across all of its facilities.\u003c/p\u003e\n\n\u003cp\u003eThe incident led AnMed to close dozens of facilities and departments. Urgent care services remain open, but all imaging, OBGYN, primary care clinics, and medical group offices are closed. AnMed serves northeast Georgia and upstate South Carolina through four hospitals and more than 60 physician practices.\u003c/p\u003e\n\n\u003cp\u003eAnMed said it is coordinating with emergency medical services, regional hospitals, and public safety partners to help patients receive care in the most appropriate setting. The article notes that medical cyberattacks have repeatedly affected patient care this year, including an attack by Iranian hackers on medical device company Stryker. It also cites IBM findings that healthcare data breaches in 2025 averaged $7.4 million per incident and took 279 days to detect and resolve.\u003c/p\u003e\n"},{"n":15,"title":"GitHub Adds 3-Day Dependabot Cooldown to Limit Poisoned Package Adoption","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/github-adds-3-day-dependabot-cooldown.html","time":"08:01","priority":"SHOULD READ","score":78,"tldr":"GitHub is adding a default three-day cooldown for Dependabot version-update pull requests to reduce the chance that projects quickly adopt newly published malicious packages. Security updates will still be delivered immediately, and GitHub says the delay should be used alongside other supply-chain safeguards.","briefOverview":"\u003cp\u003eGitHub has announced a new cooldown mechanism in Dependabot that allows the tool to wait at least three days after a release is published before opening a pull request. The default three-day cooldown applies only to version updates, which are used to keep software dependencies up to date. Security updates will still be pushed immediately, allowing Dependabot to issue an alert and open a pull request to move a project to a patched version.\u003c/p\u003e\n\n\u003cp\u003eGitHub said the change is meant to reduce the risk from poisoned versions of popular packages that may be published by threat actors and quickly pulled into downstream projects before being removed from a registry. The company described three days as a balance between getting past the window where most of these attacks occur and not delaying dependency updates longer than necessary. It also said the cooldown setting in dependabot.yml can still be configured differently to fit a project’s needs.\u003c/p\u003e\n\n\u003cp\u003eGitHub emphasized that the cooldown should be only one layer of defense alongside measures such as pinning dependencies with lockfiles, disabling install scripts in CI, scoping build pipeline tokens, and reviewing updates before they merge. The company noted that cooldowns are designed for short-lived malicious releases and do little against longer-running threats such as dormant backdoors, maintainer sabotage, or compromised build systems. The article also notes that similar cooldown controls have appeared across VS Code, Ruby, Bun, npm, pnpm, and Yarn, while PyPI plans to block adding new files to package releases after 14 days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub has announced a new Dependabot cooldown mechanism that can wait at least three days after a release is published before opening a pull request.","The three-day default cooldown applies only to Dependabot version updates, while security updates will continue to be pushed immediately with alerts and pull requests for patched versions.","GitHub said the cooldown is intended to reduce the spread of poisoned package versions that are published, quickly adopted by downstream projects, and later removed from registries.","GitHub emphasized that the cooldown should be used alongside other defenses such as lockfiles, disabling install scripts in CI, scoped build-pipeline tokens, and review before merging updates.","The article notes that similar cooldown controls have been announced in ecosystems including VS Code, Ruby, Bun, npm, pnpm, and Yarn, while PyPI plans to block new files from being added to package releases after 14 days."],"insights":["GitHub’s choice of a three-day default is explicitly meant to outlast the period in which most short-lived poisoned package attacks are detected, without delaying routine dependency updates longer than necessary.","The cooldown does not protect against slower or more persistent supply-chain threats such as dormant backdoors, maintainer sabotage, or compromised build systems, so it is targeted at only one attack pattern.","GitHub is preserving immediate Dependabot security updates, showing that the new delay is designed to reduce risky routine upgrades without slowing fixes for known security issues.","The article indicates a broader ecosystem shift toward time-based defenses, with similar cooldown or release-locking measures appearing across VS Code, Ruby, Bun, npm, pnpm, Yarn, and PyPI."],"referencedReports":[],"body":"\u003cp\u003eGitHub has announced a new cooldown mechanism in Dependabot that allows the tool to wait at least three days after a release is published before opening a pull request. The default three-day cooldown applies only to version updates, which are used to keep software dependencies up to date. Security updates will still be pushed immediately, allowing Dependabot to issue an alert and open a pull request to move a project to a patched version.\u003c/p\u003e\n\n\u003cp\u003eGitHub said the change is meant to reduce the risk from poisoned versions of popular packages that may be published by threat actors and quickly pulled into downstream projects before being removed from a registry. The company described three days as a balance between getting past the window where most of these attacks occur and not delaying dependency updates longer than necessary. It also said the cooldown setting in dependabot.yml can still be configured differently to fit a project’s needs.\u003c/p\u003e\n\n\u003cp\u003eGitHub emphasized that the cooldown should be only one layer of defense alongside measures such as pinning dependencies with lockfiles, disabling install scripts in CI, scoping build pipeline tokens, and reviewing updates before they merge. The company noted that cooldowns are designed for short-lived malicious releases and do little against longer-running threats such as dormant backdoors, maintainer sabotage, or compromised build systems. The article also notes that similar cooldown controls have appeared across VS Code, Ruby, Bun, npm, pnpm, and Yarn, while PyPI plans to block adding new files to package releases after 14 days.\u003c/p\u003e\n"},{"n":20,"title":"Public Exploit Released for Patched vBulletin Pre-Auth Code Execution Flaw","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/public-exploit-released-for-patched.html","time":"14:40","priority":"SHOULD READ","score":78,"tldr":"A public exploit now shows how unpatched self-hosted vBulletin forums can be hit with unauthenticated remote code execution via CVE-2026-61511. vBulletin patched the flaw weeks before disclosure, so administrators should upgrade to 6.2.2 or apply the relevant branch patch immediately.","briefOverview":"\u003cp\u003ePublic exploit details released on July 27 show how an unauthenticated request can reach PHP\u0026rsquo;s \u003ccode\u003eeval()\u003c/code\u003e function inside vBulletin and execute code on an unpatched forum server. The attack requires no account, administrative access, or interaction from another user. SSD Secure Disclosure lists vBulletin 6.2.1 and earlier, and 6.1.6 and earlier, as affected, while vBulletin issued patches for 6.2.1, 6.2.0, and 6.1.6 at the end of June and released fixed version 6.2.2 on July 1.\u003c/p\u003e\n\n\u003cp\u003eThe issue is identified as \u003ccode\u003eCVE-2026-61511\u003c/code\u003e, an unauthenticated remote code execution flaw in vBulletin\u0026rsquo;s template engine. The vulnerable code sits in \u003ccode\u003e/includes/vb5/template/runtime.php\u003c/code\u003e, inside the \u003ccode\u003evB5_Template_Runtime::runMaths()\u003c/code\u003e method, which strips characters outside a restricted set and then passes what remains directly to \u003ccode\u003eeval()\u003c/code\u003e. vBulletin renders templates over the public \u003ccode\u003eajax/render/pagenav\u003c/code\u003e route, and the stock \u003ccode\u003epagenav\u003c/code\u003e template copies a visitor-supplied \u003ccode\u003epagenav[pagenumber]\u003c/code\u003e value into a \u003ccode\u003e{vb:math}\u003c/code\u003e tag that reaches \u003ccode\u003erunMaths()\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eAdministrators running self-hosted installations should apply the patch for their branch or upgrade to 6.2.2, while vBulletin says its Cloud sites have already been patched. SSD did not report active exploitation, and as of July 27, 2026, no source had confirmed in-the-wild attacks or listed CVE-2026-61511 in CISA\u0026rsquo;s Known Exploited Vulnerabilities catalog. The published proof-of-concept contains a one-character error that stops it from running unchanged, but the article says the mistake is trivial to correct and does not affect the underlying vulnerability.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Public exploit details released on July 27 show how an unauthenticated request can reach PHP's eval() function inside vBulletin and execute code on an unpatched forum server.","SSD Secure Disclosure lists vBulletin 6.2.1 and earlier, and 6.1.6 and earlier, as affected, while vBulletin issued security patches for 6.2.1, 6.2.0, and 6.1.6 at the end of June and released fixed version 6.2.2 on July 1.","Administrators running self-hosted vBulletin installations should apply the patch for their branch or upgrade to 6.2.2, and vBulletin says its Cloud sites have already been patched.","As of July 27, 2026, no source had confirmed in-the-wild attacks, and CVE-2026-61511 was not listed in CISA's Known Exploited Vulnerabilities catalog.","The vulnerable code is in /includes/vb5/template/runtime.php inside vB5_Template_Runtime::runMaths(), and the public route ajax/render/pagenav can pass a visitor-supplied value into a {vb:math} tag that reaches runMaths()."],"insights":["The public exploit was labeled a zero-day by its own banner, but the article notes the flaw had already been patched nearly four weeks before public disclosure, making the main risk outdated self-hosted installations rather than all vBulletin sites.","The published proof-of-concept contains a one-character typo that prevents it from running unchanged, but the article says the mistake is trivial to fix and does not reduce the underlying risk.","Defenders can look for POST requests with routestring=ajax/render/pagenav and unusually long or operator-heavy pagenav[pagenumber] values, a detection pattern derived from the public proof-of-concept.","The article highlights an unresolved exposure window between the late-June patch and the July 27 exploit disclosure, because neither SSD nor vBulletin said whether the flaw had been used during that period.","The vulnerability follows a pattern seen in prior vBulletin template-engine issues, where quiet fixes are followed later by working public exploits while many internet-facing forums remain unpatched."],"referencedReports":[{"title":"Security Patch Released for vBulletin 6.2.1, 6.2.0 and 6.1.6","url":"https://forum.vbulletin.com/forum/vbulletin-announcements/vbulletin-announcements_aa/4509358-security-patch-released-for-vbulletin-6-2-1-6-2-0-and-6-1-6","publisher":"vBulletin","context":"The article cites vBulletin's security patch notice as the vendor fix for the affected 6.2.1, 6.2.0, and 6.1.6 branches.","category":"advisory","primary":true},{"title":"vBulletin Runtime Template runMaths PreAuth RCE","url":"https://ssd-disclosure.com/vbulletin-runtime-template-runmaths-preauth-rce/","publisher":"SSD Secure Disclosure","context":"The article references SSD's technical analysis as the source identifying CVE-2026-61511 and explaining the unauthenticated code execution path in vBulletin's template engine.","category":"research","primary":true}],"body":"\u003cp\u003ePublic exploit details released on July 27 show how an unauthenticated request can reach PHP\u0026rsquo;s \u003ccode\u003eeval()\u003c/code\u003e function inside vBulletin and execute code on an unpatched forum server. The attack requires no account, administrative access, or interaction from another user. SSD Secure Disclosure lists vBulletin 6.2.1 and earlier, and 6.1.6 and earlier, as affected, while vBulletin issued patches for 6.2.1, 6.2.0, and 6.1.6 at the end of June and released fixed version 6.2.2 on July 1.\u003c/p\u003e\n\n\u003cp\u003eThe issue is identified as \u003ccode\u003eCVE-2026-61511\u003c/code\u003e, an unauthenticated remote code execution flaw in vBulletin\u0026rsquo;s template engine. The vulnerable code sits in \u003ccode\u003e/includes/vb5/template/runtime.php\u003c/code\u003e, inside the \u003ccode\u003evB5_Template_Runtime::runMaths()\u003c/code\u003e method, which strips characters outside a restricted set and then passes what remains directly to \u003ccode\u003eeval()\u003c/code\u003e. vBulletin renders templates over the public \u003ccode\u003eajax/render/pagenav\u003c/code\u003e route, and the stock \u003ccode\u003epagenav\u003c/code\u003e template copies a visitor-supplied \u003ccode\u003epagenav[pagenumber]\u003c/code\u003e value into a \u003ccode\u003e{vb:math}\u003c/code\u003e tag that reaches \u003ccode\u003erunMaths()\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003eAdministrators running self-hosted installations should apply the patch for their branch or upgrade to 6.2.2, while vBulletin says its Cloud sites have already been patched. SSD did not report active exploitation, and as of July 27, 2026, no source had confirmed in-the-wild attacks or listed CVE-2026-61511 in CISA\u0026rsquo;s Known Exploited Vulnerabilities catalog. The published proof-of-concept contains a one-character error that stops it from running unchanged, but the article says the mistake is trivial to correct and does not affect the underlying vulnerability.\u003c/p\u003e\n"},{"n":22,"title":"NVIDIA Forms 37-Member Open Secure AI Alliance and Open-Sources NOOA Framework","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/nvidia-forms-37-member-open-secure-ai.html","time":"18:10","priority":"SHOULD READ","score":78,"tldr":"NVIDIA and 36 partners launched the Open Secure AI Alliance to promote open tools and locally run AI models for securing AI agents, with NVIDIA’s NOOA framework as the first code release. The alliance’s goals are broad, but its governance, roadmap, member commitments, and first joint deliverables remain unclear.","briefOverview":"\u003cp\u003eNVIDIA and 36 other organizations formed the Open Secure AI Alliance to develop and share open technologies, techniques, and tools for securing software and AI agents. The 37-member group includes Microsoft, Cisco, Cloudflare, CrowdStrike, Hugging Face, IBM, Palo Alto Networks, Red Hat, and the Linux Foundation. Its stated scope covers the full agent stack, including identity, permissions, isolation, guardrails, logs, model formats, multi-model scanning, and secure coding workflows.\u003c/p\u003e\n\n\u003cp\u003eThe launch includes NVIDIA-labs OO Agents, or NOOA, an Apache 2.0 research framework intended to make agent behavior easier to test, trace, audit, and govern. NOOA represents an agent harness as a Python class, where fields store state, methods expose capabilities, docstrings act as prompts, and type annotations define contracts the model must follow. NVIDIA reported that NOOA scored 86.8% on the CyberGym L1 vulnerability-rediscovery benchmark using GPT-5.5, with network access blocked and rule-based checks applied to each trajectory.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that NOOA can be configured to execute LLM-generated Python, which may transmit private data, delete files, or modify its environment. NVIDIA says NOOA’s checks and deny-lists are not a containment boundary, and agents executing generated code must run behind operating system-level isolation such as a container, virtual machine, or OpenShell sandbox. The alliance’s public materials do not yet include a charter, governing board, technical workstreams, delivery schedule, shared repository, governance model, joint roadmap, or first multi-member deliverable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NVIDIA and 36 other organizations formed the Open Secure AI Alliance to develop and share open technologies, techniques, and tools for securing software and AI agents.","The alliance includes companies and organizations such as Microsoft, Cisco, Cloudflare, CrowdStrike, Hugging Face, IBM, Palo Alto Networks, Red Hat, and the Linux Foundation.","NVIDIA released NVIDIA-labs OO Agents, or NOOA, as an Apache 2.0 research framework intended to make AI agent behavior easier to test, trace, audit, and govern.","NOOA can be configured to execute LLM-generated Python, and its repository warns that its checks and deny-lists are defense-in-depth controls rather than a containment boundary.","The article says the alliance has not publicly provided a charter, governing board, technical workstreams, delivery schedule, shared repository, governance model, joint roadmap, or first multi-member deliverable."],"insights":["NOOA’s own documentation treats its Python checks and module deny-lists as insufficient for containment, so any agent that executes generated code must be run behind operating-system isolation such as a container, virtual machine, or OpenShell sandbox.","The Hugging Face case supports the value of locally run models for incident reconstruction, but the article says it does not show that the open model detected, stopped, or contained the breach.","Commercially hosted frontier-model APIs initially rejected the attack commands, exploit payloads, and command-and-control artifacts Hugging Face needed for its forensic analysis, which made local control of a capable model operationally important.","Several technologies cited in the alliance announcement, including Safetensors, SPIFFE/SPIRE, Lightwell, MDASH, and Grok Build, already existed before the coalition, so the public record does not yet show them as alliance-created products.","The alliance has a large membership list but no public charter, governance model, workstreams, shared repository, roadmap, or first multi-member deliverable, making the depth of member participation hard to assess."],"referencedReports":[{"title":"Security Incident July 2026","url":"https://huggingface.co/blog/security-incident-july-2026","publisher":"Hugging Face","context":"The article cites Hugging Face’s disclosure to describe the July intrusion involving a malicious dataset, credential exposure, and its use of locally run LLM-driven analysis agents during response.","category":"advisory","primary":false},{"title":"Hugging Face Model Evaluation Security Incident","url":"https://openai.com/index/hugging-face-model-evaluation-security-incident/","publisher":"OpenAI","context":"The article references OpenAI’s disclosure explaining its preliminary findings that OpenAI models operating with reduced cyber refusals during an internal ExploitGym evaluation caused an earlier step in the incident chain.","category":"advisory","primary":false}],"body":"\u003cp\u003eNVIDIA and 36 other organizations formed the Open Secure AI Alliance to develop and share open technologies, techniques, and tools for securing software and AI agents. The 37-member group includes Microsoft, Cisco, Cloudflare, CrowdStrike, Hugging Face, IBM, Palo Alto Networks, Red Hat, and the Linux Foundation. Its stated scope covers the full agent stack, including identity, permissions, isolation, guardrails, logs, model formats, multi-model scanning, and secure coding workflows.\u003c/p\u003e\n\n\u003cp\u003eThe launch includes NVIDIA-labs OO Agents, or NOOA, an Apache 2.0 research framework intended to make agent behavior easier to test, trace, audit, and govern. NOOA represents an agent harness as a Python class, where fields store state, methods expose capabilities, docstrings act as prompts, and type annotations define contracts the model must follow. NVIDIA reported that NOOA scored 86.8% on the CyberGym L1 vulnerability-rediscovery benchmark using GPT-5.5, with network access blocked and rule-based checks applied to each trajectory.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that NOOA can be configured to execute LLM-generated Python, which may transmit private data, delete files, or modify its environment. NVIDIA says NOOA’s checks and deny-lists are not a containment boundary, and agents executing generated code must run behind operating system-level isolation such as a container, virtual machine, or OpenShell sandbox. The alliance’s public materials do not yet include a charter, governing board, technical workstreams, delivery schedule, shared repository, governance model, joint roadmap, or first multi-member deliverable.\u003c/p\u003e\n"},{"n":6,"title":"Apple sued over fake App Store crypto wallet app stealing $1.8M in Bitcoin","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/apple/apple-sued-over-fake-app-store-crypto-wallet-app-stealing-18m-in-bitcoin/","time":"17:29","priority":"MAY READ","score":72,"tldr":"Apple is being sued after three users allegedly lost about $1.8 million in Bitcoin to a fake Sparrow Wallet app downloaded from the App Store. The lawsuit claims Apple failed to properly vet and remove the fraudulent app despite prior warnings, while presenting the App Store as a trusted marketplace.","briefOverview":"\u003cp\u003eApple is being sued by three people who claim they lost approximately $1.8 million in Bitcoin after downloading and using a fraudulent Sparrow Wallet application from the App Store. The complaint, filed on July 24 in California, alleges that Apple failed to adequately review and monitor apps distributed through the App Store while promoting it as a safe and trusted source for software. Plaintiffs James Ramirez, Christopher Ellis, and Jalen Delgado say the malicious app impersonated the legitimate Sparrow Bitcoin wallet and instructed them to enter their seed phrases.\u003c/p\u003e\n\n\u003cp\u003eAfter the plaintiffs entered those secret recovery credentials, their Bitcoin was allegedly transferred to cryptocurrency wallets controlled by scammers. The legitimate Sparrow Wallet is a desktop application for Windows, macOS, and Linux and does not offer an iOS version. The complaint says Delgado lost about \u003cspan class=\"math inline\"\u003e\\(120,000, Ramirez lost about \\)\u003c/span\u003e875,000, and Ellis lost about $840,000 after using the fraudulent app.\u003c/p\u003e\n\n\u003cp\u003eThe lawsuit claims Apple ranked the fraudulent Sparrow app and included it in curated cryptocurrency app collections, effectively recommending it alongside legitimate applications. It also says Apple had been warned about fraudulent Sparrow Wallet apps more than a year before the plaintiffs’ losses, citing warnings from Sparrow Wallet developer Craig Raw. Apple told BleepingComputer that it acted quickly to remove apps impersonating Sparrow Wallet, terminated associated developer accounts, and provides ways for developers and customers to report infringement, scams, and fraud.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Three plaintiffs sued Apple in California, alleging they lost approximately $1.8 million in Bitcoin after downloading and using a fraudulent Sparrow Wallet application from the App Store.","The complaint says the fake app impersonated the legitimate Sparrow Bitcoin wallet and instructed users to enter their seed phrases, after which their Bitcoin was transferred to wallets controlled by scammers.","The legitimate Sparrow Wallet is a desktop application for Windows, macOS, and Linux and does not offer an iOS version.","The lawsuit alleges Apple ranked the fraudulent Sparrow app and included it in curated cryptocurrency app collections, effectively recommending it alongside legitimate applications.","Apple told BleepingComputer that it acted quickly to remove applications impersonating Sparrow Wallet and terminated the developer accounts associated with them."],"insights":["The legitimate Sparrow Wallet has no iOS version, so any mobile app using the Sparrow Wallet name in Apple’s App Store was inherently suspect according to the article.","The complaint says one plaintiff reported the fake app to Apple on July 25, 2025, but another plaintiff allegedly downloaded the same app and lost funds just over a week later, making Apple’s response time a central issue in the lawsuit.","Sparrow Wallet’s developer had publicly warned about fake App Store versions more than a year before the plaintiffs’ alleged losses, suggesting the impersonation problem was not limited to a single short-lived app listing.","The article highlights that App Store placement can amplify risk because the complaint alleges Apple ranked the fraudulent app and included it in curated cryptocurrency app collections."],"referencedReports":[],"body":"\u003cp\u003eApple is being sued by three people who claim they lost approximately $1.8 million in Bitcoin after downloading and using a fraudulent Sparrow Wallet application from the App Store. The complaint, filed on July 24 in California, alleges that Apple failed to adequately review and monitor apps distributed through the App Store while promoting it as a safe and trusted source for software. Plaintiffs James Ramirez, Christopher Ellis, and Jalen Delgado say the malicious app impersonated the legitimate Sparrow Bitcoin wallet and instructed them to enter their seed phrases.\u003c/p\u003e\n\n\u003cp\u003eAfter the plaintiffs entered those secret recovery credentials, their Bitcoin was allegedly transferred to cryptocurrency wallets controlled by scammers. The legitimate Sparrow Wallet is a desktop application for Windows, macOS, and Linux and does not offer an iOS version. The complaint says Delgado lost about \u003cspan class=\"math inline\"\u003e\\(120,000, Ramirez lost about \\)\u003c/span\u003e875,000, and Ellis lost about $840,000 after using the fraudulent app.\u003c/p\u003e\n\n\u003cp\u003eThe lawsuit claims Apple ranked the fraudulent Sparrow app and included it in curated cryptocurrency app collections, effectively recommending it alongside legitimate applications. It also says Apple had been warned about fraudulent Sparrow Wallet apps more than a year before the plaintiffs’ losses, citing warnings from Sparrow Wallet developer Craig Raw. Apple told BleepingComputer that it acted quickly to remove apps impersonating Sparrow Wallet, terminated associated developer accounts, and provides ways for developers and customers to report infringement, scams, and fraud.\u003c/p\u003e\n"},{"n":24,"title":"The PDF That Scanned Clean Because Nobody Could Read It","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/password-protected-pdf-hex-obfuscated-uri-annotation","time":"11:00","priority":"MAY READ","score":72,"tldr":"A phishing email used a password-protected PDF with an obfuscated link hidden in a PDF annotation so attachment scanners could not inspect it and returned a clean verdict. The attack was still detected by behavioral and authentication signals, including SPF/DKIM/DMARC failures, sender-domain mismatches, and first-time sender indicators.","briefOverview":"\u003cp\u003eA fake payroll remittance notification targeted a VP of Human Resources at a mid-size manufacturer and then propagated to two more mailboxes before it was mitigated. The email delivered a password-protected PDF, with the password supplied in the email body and numerically linked to the filename. The attachment scanner returned a clean verdict, but the incident was still resolved as phishing.\u003c/p\u003e\n\n\u003cp\u003eThe PDF used two evasion layers: encryption prevented tools from extracting or rendering its contents, and the link inside was hex-encoded and buried in a PDF annotation rather than shown as visible text. Static analysis did not resolve the true landing page, and the article states that the destination stayed hidden until a user opened the file and clicked. Detection instead came from the message’s wider behavior and headers, including SPF softfail, DKIM-domain and From-domain mismatch, failed DKIM verification, DMARC failure, first-time sender status, and branding mismatch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A fake payroll remittance notification delivered a password-protected PDF, with the password supplied in the email body.","The malicious link inside the PDF was stored as a hex-encoded value in a PDF annotation rather than as visible text.","The attachment scanner returned a clean verdict because it could not parse the encrypted PDF and could not extract the hidden link.","The message was ultimately classified as phishing based on authentication failures, a mismatch between the visible sender and DKIM-signing domain, first-time sender status, and branding inconsistencies.","The article advises defenders to treat unexpected password-protected documents, especially payroll or payment-related files with passwords in the email body, as suspicious."],"insights":["A clean verdict on a password-protected attachment can indicate that the scanner was locked out rather than that the file is safe.","The attacker made the password and filename numerically related, which helped the password-protected PDF appear like a legitimate system-generated payroll document.","The email’s headers exposed the deception even though the attachment contents remained unreadable, because the visible sender, DKIM signing domain, and authenticated sending identity did not align.","The article emphasizes that sender authentication, first-contact behavior, branding coherence, and message intent can outweigh a static attachment verdict when the payload is deliberately unreadable."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for statistics on malware-laden messages versus plain phishing in the email gateway attack mix.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"CISA","context":"The article references CISA's phishing guidance to support the point that defenses should assume some phishing messages will bypass perimeter controls.","category":"guide","primary":false}],"body":"\u003cp\u003eA fake payroll remittance notification targeted a VP of Human Resources at a mid-size manufacturer and then propagated to two more mailboxes before it was mitigated. The email delivered a password-protected PDF, with the password supplied in the email body and numerically linked to the filename. The attachment scanner returned a clean verdict, but the incident was still resolved as phishing.\u003c/p\u003e\n\n\u003cp\u003eThe PDF used two evasion layers: encryption prevented tools from extracting or rendering its contents, and the link inside was hex-encoded and buried in a PDF annotation rather than shown as visible text. Static analysis did not resolve the true landing page, and the article states that the destination stayed hidden until a user opened the file and clicked. Detection instead came from the message’s wider behavior and headers, including SPF softfail, DKIM-domain and From-domain mismatch, failed DKIM verification, DMARC failure, first-time sender status, and branding mismatch.\u003c/p\u003e\n"},{"n":13,"title":"Outdated VPNs should be purged from federal agencies, senator says","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/federal-purge-outdated-vpns-wyden-letter","time":"20:45","priority":"MAY READ","score":68,"tldr":"Sen. Ron Wyden is urging CISA, OMB, NIST and the NSA to force federal agencies to remove insecure, internet-facing legacy VPNs within two years and replace them with zero-trust remote access. He warned that Russian and Chinese hackers have repeatedly abused outdated VPN products to gain administrative access to government and company networks.","briefOverview":"\u003cp\u003eSen. Ron Wyden told CISA, OMB and NIST that they must lead an effort to remove public internet-facing and insecure virtual private networks from federal government systems. He said federal agencies and government contractors have suffered devastating cyberattacks because of reliance on legacy, insecure, internet-facing VPN servers for employee remote access. Wyden cited recent hacking campaigns targeting VPNs and remote-access systems from Cisco, Fortinet, Ivanti and Check Point.\u003c/p\u003e\n\n\u003cp\u003eWyden warned that foreign adversaries gained administrative access to target networks through these hacks, allowing them to steal sensitive data from U.S. government agencies and companies. His letter said vulnerable VPNs are high-risk because they lack modern safeguards and are exposed in ways that let hackers scan, target and break into them. He argued that the problem can be fixed by using newer remote-access tools that give users access without broadcasting their presence.\u003c/p\u003e\n\n\u003cp\u003eWyden urged CISA to set a two-year deadline for civilian agencies to replace public-facing remote access systems with zero-trust architecture. He also said the NSA should order a purge of legacy remote access gateways and perimeter entry points across military, intelligence and other federal national security networks. Wyden pressed NIST to create implementation standards for agencies migrating to zero-trust architectures and directed OMB to draft a memo ordering federal agencies to invest in zero-trust infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sen. Ron Wyden told CISA, OMB and NIST that they must lead an effort to remove public internet-facing and insecure virtual private networks from federal government systems.","Wyden cited recent hacking campaigns targeting VPNs and remote-access systems from Cisco, Fortinet, Ivanti and Check Point.","Wyden wrote that foreign adversaries gained administrative access to target networks through these hacks, allowing them to steal sensitive data from U.S. government agencies and companies.","Wyden urged CISA to set a two-year deadline for civilian agencies to replace public-facing remote access systems with zero-trust architecture.","Wyden pressed NIST to create implementation standards for agencies migrating to zero-trust architectures and directed OMB to draft a memo ordering federal agencies to invest in zero-trust infrastructure."],"insights":["Wyden is calling for a government-wide remote-access overhaul, not just patching individual vulnerable VPN products after each hacking campaign.","The proposed change would apply beyond civilian agencies, with Wyden also urging the NSA to require removal of legacy remote access gateways across military, intelligence and other national security networks.","Wyden framed the problem as readily fixable because newer remote-access tools can provide access without publicly exposing an entry point for hackers to scan and target.","The letter assigns different roles to multiple federal bodies: CISA would set a purge deadline, NIST would define implementation standards, and OMB would direct agencies to fund zero-trust infrastructure."],"referencedReports":[],"body":"\u003cp\u003eSen. Ron Wyden told CISA, OMB and NIST that they must lead an effort to remove public internet-facing and insecure virtual private networks from federal government systems. He said federal agencies and government contractors have suffered devastating cyberattacks because of reliance on legacy, insecure, internet-facing VPN servers for employee remote access. Wyden cited recent hacking campaigns targeting VPNs and remote-access systems from Cisco, Fortinet, Ivanti and Check Point.\u003c/p\u003e\n\n\u003cp\u003eWyden warned that foreign adversaries gained administrative access to target networks through these hacks, allowing them to steal sensitive data from U.S. government agencies and companies. His letter said vulnerable VPNs are high-risk because they lack modern safeguards and are exposed in ways that let hackers scan, target and break into them. He argued that the problem can be fixed by using newer remote-access tools that give users access without broadcasting their presence.\u003c/p\u003e\n\n\u003cp\u003eWyden urged CISA to set a two-year deadline for civilian agencies to replace public-facing remote access systems with zero-trust architecture. He also said the NSA should order a purge of legacy remote access gateways and perimeter entry points across military, intelligence and other federal national security networks. Wyden pressed NIST to create implementation standards for agencies migrating to zero-trust architectures and directed OMB to draft a memo ordering federal agencies to invest in zero-trust infrastructure.\u003c/p\u003e\n"},{"n":23,"title":"Azure VM Command Execution using Third-Party Extensions – Salt Minion","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/azure-vm-command-execution-using-third-party-extensions-part-2/","time":"20:01","priority":"MAY READ","score":58,"tldr":"An attacker with Azure VM extension write permissions can abuse the legitimate Salt Minion third-party extension to connect a VM to a rogue Salt master and execute commands as root or SYSTEM. Organizations should tightly restrict extension write privileges and monitor Azure Activity Logs and endpoint process activity for Salt Minion installation and command execution.","briefOverview":"\u003cp\u003eThis article explains how Azure VM command execution can be achieved by abusing the legitimate third-party Salt Minion extension. An attacker with \u003ccode\u003eMicrosoft.Compute/virtualMachines/extensions/write\u003c/code\u003e permission can deploy the Salt Minion extension to a target Azure virtual machine and point it at a rogue Salt Master they control. After the minion connects and its key is accepted, the attacker can push Salt states or run commands on the VM.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates creating a malicious Salt state that retrieves an Azure Managed Identity access token from the VM metadata service and posts it to an out-of-band interaction endpoint. On Linux, the demonstrated command execution runs as root, and the article also notes that arbitrary commands can be run directly through Salt without sending a new state. The technique applies to both Linux and Windows Azure VMs using the \u003ccode\u003esalt-minion.linux\u003c/code\u003e or \u003ccode\u003esalt-minion.windows\u003c/code\u003e extension.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that several built-in and less commonly discussed Azure roles have the extension write permission needed to perform this activity, including Owner, Contributor, Log Analytics Contributor, Virtual Machine Contributor, and others. The article recommends monitoring Azure Activity Logs for VM extension write operations and specifically for Salt Minion extension installation. It also describes Linux detection opportunities through Salt logs, auditd, and process-tree context, while Windows detection relies on process events showing Salt Minion spawning system command processes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker with Microsoft.Compute/virtualMachines/extensions/write permission can deploy the Salt Minion Azure VM extension and configure it to connect to a rogue Salt Master.","After the Salt Minion connects and its key is accepted, the rogue Salt Master can push Salt states or run commands directly on the target VM as root on Linux.","The article demonstrates using a malicious Salt state to retrieve an Azure Managed Identity access token from the VM meta
