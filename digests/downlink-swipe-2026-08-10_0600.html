<script type="application/json" id="dl-articles">[{"n":1,"title":"Critical Progress LoadMaster flaw now actively exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-critical-progress-loadmaster-flaw-exploited-in-attacks/","time":"09:49","priority":"MUST READ","score":94,"tldr":"CISA says attackers are actively exploiting a critical Progress Kemp LoadMaster command injection flaw, CVE-2026-8037, that allows unauthenticated remote command execution on unpatched appliances. Federal agencies have been ordered to patch immediately, and all organizations using affected LoadMaster or MOVEit WAF versions should prioritize updates.","briefOverview":"\u003cp\u003eCISA warned that hackers are exploiting a critical Progress Kemp LoadMaster command injection vulnerability tracked as CVE-2026-8037. Kemp LoadMaster is an Application Delivery Controller and server load balancer used by technology companies and government entities worldwide. Progress Software says 80% of Fortune 500 companies use its products and services, and Kemp LoadMaster has more than 100,000 deployments worldwide.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated attackers to execute arbitrary commands on unpatched LoadMaster appliances by exploiting unsanitized API inputs in multiple command endpoints. Progress released security updates in June for Kemp LoadMaster GA v7.2.63.1 or older and LTSF v7.2.54.17 or older. The company also confirmed that all MOVEit WAF versions before GA v7.2.63.2 are affected.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-8037 to its Known Exploited Vulnerabilities catalog and ordered U.S. Federal Civilian Executive Branch agencies to secure their servers within three days under Binding Operational Directive 26-04. CISA said this type of vulnerability is a frequent attack vector for malicious cyber actors and poses significant risks to the federal enterprise. Shadowserver reported nearly 300 Kemp LoadMaster instances exposed online, though the article says it is unclear how many are honeypots or already secured.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that hackers are exploiting CVE-2026-8037, a critical Progress Kemp LoadMaster command injection vulnerability.","CVE-2026-8037 allows unauthenticated attackers to execute arbitrary commands on unpatched LoadMaster appliances by exploiting unsanitized API inputs in multiple command endpoints.","Progress Software released security updates in June for affected Kemp LoadMaster versions and said the flaw also impacts all MOVEit WAF versions before GA v7.2.63.2.","CISA added CVE-2026-8037 to its Known Exploited Vulnerabilities catalog and ordered U.S. Federal Civilian Executive Branch agencies to secure affected servers within three days.","Shadowserver reported that nearly 300 Kemp LoadMaster instances are exposed online, though it is unknown how many are honeypots or already secured against CVE-2026-8037 attacks."],"insights":["CISA gave federal civilian agencies only three days to secure affected servers, signaling unusually high urgency for this actively exploited flaw.","The issue is not limited to Kemp LoadMaster appliances because Progress also confirmed that all MOVEit WAF versions before GA v7.2.63.2 are affected.","Although Kemp LoadMaster has more than 100,000 deployments worldwide, Shadowserver observed nearly 300 instances exposed online, making internet-facing systems a particularly actionable patching priority.","Progress has dealt with multiple security issues across its products recently, including the LoadMaster flaw and a separate ShareFile path traversal zero-day that prompted customer shutdown guidance."],"referencedReports":[{"title":"LoadMaster Critical Security Bulletin June 2026 CVE-2026-8037 CVE-2026-33691","url":"https://community.progress.com/s/article/LoadMaster-Critical-Security-Bulletin-June-2026-CVE-2026-8037-CVE-2026-33691","publisher":"Progress Software","context":"The article cites this Progress security bulletin as the source for June security updates that patch the Kemp LoadMaster vulnerability.","category":"advisory","primary":true},{"title":"MOVEit WAF Critical Security Bulletin June 2026 CVE-2026-8037 CVE-2026-33691","url":"https://community.progress.com/s/article/MOVEit-WAF-Critical-Security-Bulletin-June-2026-CVE-2026-8037-CVE-2026-33691","publisher":"Progress Software","context":"The article references this Progress bulletin for confirmation that MOVEit WAF versions before GA v7.2.63.2 are also affected.","category":"advisory","primary":true},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites this CISA alert for the addition of CVE-2026-8037 to the Known Exploited Vulnerabilities catalog and the required federal remediation timeline.","category":"advisory","primary":true},{"title":"Known Exploited Vulnerabilities Catalog: CVE-2026-8037","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-8037","publisher":"CISA","context":"The article links to CISA's catalog entry identifying CVE-2026-8037 as an actively exploited vulnerability.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA warned that hackers are exploiting a critical Progress Kemp LoadMaster command injection vulnerability tracked as CVE-2026-8037. Kemp LoadMaster is an Application Delivery Controller and server load balancer used by technology companies and government entities worldwide. Progress Software says 80% of Fortune 500 companies use its products and services, and Kemp LoadMaster has more than 100,000 deployments worldwide.\u003c/p\u003e\n\n\u003cp\u003eThe flaw allows unauthenticated attackers to execute arbitrary commands on unpatched LoadMaster appliances by exploiting unsanitized API inputs in multiple command endpoints. Progress released security updates in June for Kemp LoadMaster GA v7.2.63.1 or older and LTSF v7.2.54.17 or older. The company also confirmed that all MOVEit WAF versions before GA v7.2.63.2 are affected.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-8037 to its Known Exploited Vulnerabilities catalog and ordered U.S. Federal Civilian Executive Branch agencies to secure their servers within three days under Binding Operational Directive 26-04. CISA said this type of vulnerability is a frequent attack vector for malicious cyber actors and poses significant risks to the federal enterprise. Shadowserver reported nearly 300 Kemp LoadMaster instances exposed online, though the article says it is unclear how many are honeypots or already secured.\u003c/p\u003e\n"},{"n":2,"title":"Solidity Pro VS Code Extensions Steal Crypto Wallets, API Keys, and Credentials","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/08/solidity-pro-vs-code-extensions-steal.html","time":"07:38","priority":"SHOULD READ","score":82,"tldr":"Malicious VS Code extensions posing as Solidity Pro tools targeted Web3 developers by stealing crypto wallets, API keys, source-control tokens, SSH keys, and other credentials, then exfiltrating them via Telegram. Researchers warn the extensions used obfuscation and delayed activation to evade marketplace review and automated scanning.","briefOverview":"\u003cp\u003eCybersecurity researchers flagged malicious Microsoft Visual Studio Code extensions named Solidity Pro, including \u003ccode\u003ehelper-beeps.solidity-pro\u003c/code\u003e and \u003ccode\u003eweb3devtoolsx.solidity-pro\u003c/code\u003e, that delivered a browser wallet and credential stealer. The extensions are no longer available on Open VSX, but the GitHub repository for \u003ccode\u003eweb3devtoolsx/solidity-pro\u003c/code\u003e remained accessible at the time of writing. Yeeth Security said earlier versions retrieved an encrypted Python payload from Cloudflare Workers endpoints and executed it.\u003c/p\u003e\n\n\u003cp\u003eStarting with version 3.0.0, the extensions shifted to a full information stealer that could collect browser profiles, crypto wallets, source-control tokens, API keys, SSH keys, and Telegram bot tokens. The captured data was exfiltrated through a Telegram bot upload. The stealer targeted data including GitHub, GitLab, AWS, Cloudflare, OpenAI, Telegram, MetaMask, Phantom, Rabby, Coinbase, Trust, Keplr, Bitcoin, SSH, URL credentials, and 1Password MFA tokens.\u003c/p\u003e\n\n\u003cp\u003eThe malware used heavy obfuscation, clean intermediate versions, and randomized delayed activation to bypass marketplace review, static scanning, and casual sandboxing. Yeeth Security said the activity shares a high-level playbook with WhiteCobra, a threat cluster previously detected distributing Lumma Stealer through malicious VS Code extensions. Users who installed the extensions are advised to remove them, inspect dependency graphs, block known command-and-control domains, and alert on use of \u003ccode\u003ecscript\u003c/code\u003e, \u003ccode\u003emshta\u003c/code\u003e, \u003ccode\u003ecmd\u003c/code\u003e, \u003ccode\u003ecurl\u003c/code\u003e, and \u003ccode\u003epowershell\u003c/code\u003e commands.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybersecurity researchers flagged malicious Microsoft Visual Studio Code extensions named helper-beeps.solidity-pro and web3devtoolsx.solidity-pro that delivered a browser wallet and credential stealer.","Yeeth Security said early versions 1.0.0 through 2.4.x retrieved an encrypted Python payload from Cloudflare Workers endpoints and executed it.","Versions starting with 3.0.0 shifted to an information stealer that collects browser profiles, crypto wallets, source-control tokens, API keys, SSH keys, and Telegram bot tokens, then exfiltrates the data through a Telegram bot upload.","The malware used heavy obfuscation, intermediate clean versions, and randomized delayed activation to bypass marketplace review, static scanning, and casual sandboxing.","Users who installed the extensions are advised to remove them, inspect dependency graphs, block known command-and-control domains, and alert on use of cscript, mshta, cmd, curl, and powershell commands."],"insights":["The extensions used intermediate clean versions to build trust before malicious behavior appeared in later releases, so prior benign versions are not enough to treat a developer extension as safe.","Randomized delayed activation means short automated scans can miss malicious behavior because the harmful code may run only hours or days after installation.","The article highlights that malicious VS Code extensions can steal sensitive data without relying only on obvious dangerous patterns, such as the cited clipboard stealer that used a first-party VS Code clipboard API rather than child_process, network access, or file writes.","The campaign specifically targets high-value developer secrets, including GitHub, GitLab, AWS, Cloudflare, OpenAI, Telegram, SSH, and crypto wallet data, making installed extensions a direct risk to both personal funds and development infrastructure."],"referencedReports":[{"title":"Solidity Pro: WhiteCobra C2 to Telegram","url":"https://yeethsecurity.com/blog/2026-08-06-Solidity-Pro-WhiteCobra-C2-to-Telegram","publisher":"Yeeth Security","context":"The article cites Yeeth Security's analysis as the source for details on Solidity Pro versions retrieving encrypted Python payloads and later stealing wallets, tokens, keys, and credentials.","category":"research","primary":true},{"title":"WhiteCobra","url":"https://yeethsecurity.com/blog/2025-09-03-WhiteCobra","publisher":"Yeeth Security","context":"The article references Yeeth Security's WhiteCobra analysis to compare the Solidity Pro activity with a similar playbook used by another threat cluster.","category":"research","primary":false},{"title":"ethdevtools Clipboard Crypto Stealer","url":"https://yeethsecurity.com/blog/2026-06-21-ethdevtools-Clipboard-Crypto-Stealer","publisher":"Yeeth Security","context":"The article cites Yeeth Security's analysis of ethdevtools.solidity-language-support as another malicious Solidity-themed extension targeting Ethereum developers.","category":"research","primary":false},{"title":"The jsononifier npm Dropper","url":"https://yeethsecurity.com/blog/2026-07-02-The-jsononifier-npm-Dropper","publisher":"Yeeth Security","context":"The article references Yeeth Security's analysis of the ascii-fetcher npm package and its malicious dependency @jaymara/jsononifier.","category":"research","primary":false},{"title":"The Windows Installer Dropper Family","url":"https://yeethsecurity.com/blog/2026-07-02-The-Windows-Installer-Dropper-Family","publisher":"Yeeth Security","context":"The article cites Yeeth Security's analysis of 10 VS Code extensions that delivered Windows-based BAT, JavaScript, and HTA droppers.","category":"research","primary":false},{"title":"DigitalBarberTrim Multi-IDE VSIX Installer","url":"https://yeethsecurity.com/blog/2026-07-02-DigitalBarberTrim-Multi-IDE-VSIX-Installer","publisher":"Yeeth Security","context":"The article references Yeeth Security's analysis of the DigitalBarberTrim.html-entity-codec VS Code extension that dropped a remote VSIX file in select versions.","category":"research","primary":false}],"body":"\u003cp\u003eCybersecurity researchers flagged malicious Microsoft Visual Studio Code extensions named Solidity Pro, including \u003ccode\u003ehelper-beeps.solidity-pro\u003c/code\u003e and \u003ccode\u003eweb3devtoolsx.solidity-pro\u003c/code\u003e, that delivered a browser wallet and credential stealer. The extensions are no longer available on Open VSX, but the GitHub repository for \u003ccode\u003eweb3devtoolsx/solidity-pro\u003c/code\u003e remained accessible at the time of writing. Yeeth Security said earlier versions retrieved an encrypted Python payload from Cloudflare Workers endpoints and executed it.\u003c/p\u003e\n\n\u003cp\u003eStarting with version 3.0.0, the extensions shifted to a full information stealer that could collect browser profiles, crypto wallets, source-control tokens, API keys, SSH keys, and Telegram bot tokens. The captured data was exfiltrated through a Telegram bot upload. The stealer targeted data including GitHub, GitLab, AWS, Cloudflare, OpenAI, Telegram, MetaMask, Phantom, Rabby, Coinbase, Trust, Keplr, Bitcoin, SSH, URL credentials, and 1Password MFA tokens.\u003c/p\u003e\n\n\u003cp\u003eThe malware used heavy obfuscation, clean intermediate versions, and randomized delayed activation to bypass marketplace review, static scanning, and casual sandboxing. Yeeth Security said the activity shares a high-level playbook with WhiteCobra, a threat cluster previously detected distributing Lumma Stealer through malicious VS Code extensions. Users who installed the extensions are advised to remove them, inspect dependency graphs, block known command-and-control domains, and alert on use of \u003ccode\u003ecscript\u003c/code\u003e, \u003ccode\u003emshta\u003c/code\u003e, \u003ccode\u003ecmd\u003c/code\u003e, \u003ccode\u003ecurl\u003c/code\u003e, and \u003ccode\u003epowershell\u003c/code\u003e commands.\u003c/p\u003e\n"},{"n":3,"title":"Agents and the EU Act: Navigating Your Responsibilities","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/agents-and-the-eu-act-navigating-your-responsibilities","time":"07:01","priority":"MAY READ","score":58,"tldr":"Companies deploying AI agents that EU users can interact with are likely covered by the EU AI Act, even though the Act does not explicitly use the word “agent.” At minimum they must meet Article 50 transparency duties, and higher-risk or model-modifying uses can trigger broader provider and high-risk system obligations.","briefOverview":"\u003cp\u003eThe article explains how the EU Artificial Intelligence Act applies to AI agents, even though the word “agent” does not appear in the Act itself. It says companies anywhere in the world that deploy public-facing AI applications reachable by EU citizens may fall within the Act’s scope. The author emphasizes that Article 50 creates minimum transparency duties for companies deploying agents that interact with humans.\u003c/p\u003e\n\n\u003cp\u003eThe article cites European Commission guidance stating that AI agents are covered by Article 50 when they can interact with the people instructing them or with other natural persons while carrying out tasks such as bookings, correspondence, contract negotiation, or purchases. It gives examples including voice assistants, chatbots, AI hotlines, humanoid robots, AI companions, social media bots, and coding agents. Deployers must inform people that they are interacting with AI, using written, visual, auditory, or verifiable AI identity disclosures as appropriate.\u003c/p\u003e\n\n\u003cp\u003eThe article also explains that AI agents are treated as AI systems under the Act, so broader AI system rules can apply to them. If a company heavily modifies a model and attaches agents to it, the company may become a provider and face additional obligations under Articles 53, 54, and 55. Agents used as safety components or for activities involving sensitive or personal information can trigger high-risk system requirements under Chapter III, along with Article 50 and possible general-purpose AI obligations depending on whether the model is modified.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Companies anywhere in the world that deploy public-facing AI applications reachable by EU citizens may fall within the scope of the EU AI Act.","Article 50 and the European Commission’s transparency guidelines require deployers of AI agents that interact with people to inform those people that they are interacting with AI.","Agents that generate or manipulate synthetic text, image, audio, or video content must mark human-perceptible content as AI-generated under Article 50(2).","The article states that AI agents are treated as AI systems under the EU AI Act, so rules that apply to AI systems can also apply to AI agents.","Deployers that modify models above the Act’s threshold can become providers with additional obligations, and agents used as safety components or for sensitive or personal information can trigger high-risk system requirements under Chapter III."],"insights":["The absence of the word “agent” from the EU AI Act does not reduce compliance duties, because later European Commission guidance explicitly says AI agents can be covered by Article 50 when they interact with people.","A company can move from being only a deployer to also being a provider if it modifies an AI model enough, which changes the applicable obligations from basic transparency duties to additional provider duties under Articles 53, 54, and potentially 55.","Simply attaching an agent to a model is not treated as modifying the model, so the article separates agent-building from model modification when determining provider obligations.","The article recommends treating systemic-risk model obligations as a default planning assumption because it says contemporary models now exceed the Act’s training-compute threshold.","High-risk classification can be triggered by what the agent does, such as acting as a safety component or processing sensitive or personal information, regardless of whether the underlying model was modified."],"referencedReports":[{"title":"Guidelines on the implementation of the transparency obligations for certain AI systems under Article 50 of Regulation (EU) 2024/1689 (the ‘AI Act’)","url":"https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems","publisher":"European Commission","context":"The article cites these guidelines to explain that AI agents interacting with people are covered by Article 50 and to provide examples of required AI disclosures.","category":"guide","primary":true},{"title":"Code of Practice on Transparency of AI-Generated Content","url":"https://digital-strategy.ec.europa.eu/en/policies/code-practice-ai-generated-content","publisher":"European Commission","context":"The article says this code explains the rules for marking human-perceptible synthetic content as AI-generated under Article 50(2).","category":"guide","primary":false},{"title":"Guidelines on general-purpose AI model providers","url":"https://digital-strategy.ec.europa.eu/en/policies/guidelines-gpai-providers","publisher":"European Commission","context":"The article cites these guidelines to explain when modifying a model can make a company a provider subject to additional EU AI Act obligations.","category":"guide","primary":true},{"title":"General-Purpose Code of AI Practice","url":"https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai","publisher":"European Commission","context":"The article references this code as guidance for transparency, copyright, safety, and security aspects for providers of general-purpose AI models.","category":"guide","primary":false},{"title":"AI Agents Under EU Law: A Compliance Architecture for AI Providers","url":"https://arxiv.org/html/2604.04604v1","publisher":"arXiv","context":"The article recommends this working paper as thorough guidance for companies whose agents are reachable by EU citizens.","category":"research","primary":false}],"body":"\u003cp\u003eThe article explains how the EU Artificial Intelligence Act applies to AI agents, even though the word “agent” does not appear in the Act itself. It says companies anywhere in the world that deploy public-facing AI applications reachable by EU citizens may fall within the Act’s scope. The author emphasizes that Article 50 creates minimum transparency duties for companies deploying agents that interact with humans.\u003c/p\u003e\n\n\u003cp\u003eThe article cites European Commission guidance stating that AI agents are covered by Article 50 when they can interact with the people instructing them or with other natural persons while carrying out tasks such as bookings, correspondence, contract negotiation, or purchases. It gives examples including voice assistants, chatbots, AI hotlines, humanoid robots, AI companions, social media bots, and coding agents. Deployers must inform people that they are interacting with AI, using written, visual, auditory, or verifiable AI identity disclosures as appropriate.\u003c/p\u003e\n\n\u003cp\u003eThe article also explains that AI agents are treated as AI systems under the Act, so broader AI system rules can apply to them. If a company heavily modifies a model and attaches agents to it, the company may become a provider and face additional obligations under Articles 53, 54, and 55. Agents used as safety components or for activities involving sensitive or personal information can trigger high-risk system requirements under Chapter III, along with Article 50 and possible general-purpose AI obligations depending on whether the model is modified.\u003c/p\u003e\n"},{"n":4,"title":"AI Governance Fails Without Identity Intelligence – Part 1","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/ai-governance-fails-without-identity-intelligence-part-1/","time":"06:00","priority":"MAY READ","score":50,"tldr":"AI governance must extend beyond models, data, and outputs to the human and machine identities that build, deploy, modify, and operate AI systems. Without identity intelligence, organizations cannot prove accountability, traceability, or security for AI decisions and changes.","briefOverview":"\u003cp\u003eThe article argues that AI governance has a dangerous blind spot because organizations often govern models, data, use cases, outputs, and regulatory obligations while failing to govern the identities behind AI systems. It says AI systems are created, trained, authorized, modified, deployed, and operated by people, pipelines, service accounts, applications, data sources, administrators, and increasingly autonomous agents. Every one of those interactions involves identity, authority, and trust.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that AI governance must cover more than generative AI, including classifiers, recommendation engines, predictive models, autonomous systems, computer vision, behavioral analytics, robotics, and biometric recognition. These systems already influence areas such as credit and fraud decisions, medical diagnostics, hiring, industrial operations, cybersecurity response, logistics, and autonomous vehicles. The article says identity intelligence goes beyond traditional identity and access management by connecting identities through attribution and examining relationships, behavior, exposure, privilege, device use, historical activity, and indicators of compromise.\u003c/p\u003e\n\n\u003cp\u003eThe article states that governance requires attributable accountability, meaning organizations should be able to identify the people and identities responsible for approvals, deployments, overrides, data sources, system versions, and outcomes. It warns that attackers may compromise AI systems through trusted identities such as stolen credentials, compromised service accounts, excessive privileges, exposed API keys, weak workload authentication, or unmonitored administrative access. The article concludes that the real governance boundary is not the model itself, but the full ecosystem of identities and authority surrounding it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that AI governance has a blind spot because organizations often govern models, data, use cases, outputs, and regulations while failing to govern the identities that create, train, authorize, modify, deploy, and operate AI systems.","The article says AI governance must cover more than generative AI, including systems that produce predictions, recommendations, classifications, decisions, or autonomous actions across areas such as credit, healthcare, hiring, industrial operations, biometrics, cybersecurity, logistics, and autonomous vehicles.","The article distinguishes identity intelligence from traditional identity and access management by saying identity intelligence connects identities through attribution and examines relationships, behavior, external exposure, historical activity, privilege, device use, and signs of compromise.","The article states that governance requires attributable accountability, meaning organizations should be able to identify the business owner, technical owner, approving identities, data sources, authorized override identities, affected individuals, and responsible person for an AI system.","The article warns that attackers may compromise AI systems through trusted identities such as stolen credentials, compromised service accounts, excessive privileges, exposed API keys, weak workload authentication, or unmonitored administrative access."],"insights":["AI audit logs may be insufficient on their own because a record such as a service account changing a model threshold has limited value unless it can be tied to an accountable human, application, approval, and business purpose.","The article frames the governance boundary for AI as the full ecosystem of identities and authority around the model, rather than the model itself.","A practical governance test is whether the organization can build an identity-based chain of custody for a GenAI system, from data sourcing and transformation through training, approval, deployment, invocation, modification, and retirement.","The article highlights that an attacker may not need to defeat an AI model directly if they can impersonate a trusted identity that already has authority to change data, replace models, alter thresholds, disable monitori
