<script type="application/json" id="dl-articles">[{"n":3,"title":"SonicWall SMA Zero-Days Exploited Before Disclosure to Gain Root Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/sonicwall-sma-zero-days-exploited.html","time":"13:18","priority":"MUST READ","score":96,"tldr":"A previously unknown threat actor, UTA0533, exploited two SonicWall SMA 1000 zero-days before disclosure to gain root access, install custom backdoors, and potentially capture credentials from affected appliances. SonicWall has released patches, and the flaws can be chained for unauthenticated access, command execution, and privilege escalation.","briefOverview":"\u003cp\u003eA previously undocumented threat actor tracked by Volexity as \u003cstrong\u003eUTA0533\u003c/strong\u003e exploited SonicWall Secure Mobile Access 1000 series appliances as zero-days before public disclosure, with activity observed since June 22, 2026. The vulnerabilities are \u003cstrong\u003eCVE-2026-15409\u003c/strong\u003e and \u003cstrong\u003eCVE-2026-15410\u003c/strong\u003e, which can be chained to enable arbitrary command execution and device takeover. SonicWall released patches for both vulnerabilities this week.\u003c/p\u003e\n\n\u003cp\u003eVolexity identified two compromised SonicWall SMA VPN devices at an unnamed organization. On one appliance, the threat actor wrote a setuid binary called \u003cstrong\u003eROOTRUN\u003c/strong\u003e, deployed \u003cstrong\u003eKNUCKLEBALL\u003c/strong\u003e containing embedded JAR payloads, and installed the \u003cstrong\u003eSuo5\u003c/strong\u003e proxy and a Behinder-like Java web shell called \u003cstrong\u003eORANGETAIL\u003c/strong\u003e. The attacker also modified startup and NGINX Unit configuration files to establish persistence and route traffic to the malicious components.\u003c/p\u003e\n\n\u003cp\u003eThe exploitation chain involved an unauthenticated \u003cstrong\u003e/wsproxy\u003c/strong\u003e request that could establish a WebSocket tunnel to localhost-only services, followed by access to CouchDB and escalation through the SMA control service. Volexity said root access could allow the threat actor to access stored or cached credentials, capture network traffic, and potentially intercept credentials processed by the appliances. Available evidence suggested the actor was less successful at moving laterally or gaining access to other systems.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Volexity attributed the exploitation of SonicWall Secure Mobile Access 1000 series appliances to a previously undocumented threat actor tracked as UTA0533.","The attackers exploited CVE-2026-15409 and CVE-2026-15410 as zero-days before public disclosure, and SonicWall released patches for both vulnerabilities this week.","On one compromised appliance, the threat actor installed a setuid binary called ROOTRUN, a Python script called KNUCKLEBALL, the Suo5 HTTP proxy, and a Behinder-like Java web shell dubbed ORANGETAIL.","On a second compromised appliance, the attackers modified the NGINX Unit configuration and created files in the /var/tmp directory, including a script that launched tcpdump to inspect unencrypted LDAP traffic for usernames and passwords.","Volexity said UTA0533 obtained root-level access to the SonicWall appliances, but available evidence suggests the actor was less successful at moving laterally or gaining access to other systems."],"insights":["A reboot of the second appliance removed memory-resident artifacts and backdoors, showing that some evidence and attacker access on affected SMA devices may be lost after restart.","The attackers exposed their Suo5 proxy and ORANGETAIL web shell through internet-accessible paths under /workplace, making those specific URI paths useful indicators for investigation.","The exploitation chain abused localhost-only services through the /wsproxy bypass, so services not directly exposed to the internet were still reachable by unauthenticated external requests.","Physical SMA appliances had an additional weakness because the ctrl-service authentication password could be derived from the locally readable product_uuid value, while virtual appliances were not affected by that specific issue.","The attackers created a script to inspect unencrypted LDAP traffic for usernames and passwords, indicating that credential exposure could occur through traffic handled by the compromised appliances."],"referencedReports":[{"title":"Proxying to Compromise: SonicWall Secure Mobile Access 0-Day Exploitation","url":"https://www.volexity.com/blog/2026/07/17/proxying-to-compromise-sonicwall-secure-mobile-access-0-day-exploitation/","publisher":"Volexity","context":"The article cites Volexity's analysis as the source attributing the activity to UTA0533 and describing the zero-day exploitation and malware used against SonicWall SMA appliances.","category":"research","primary":true},{"title":"ETR: Rapid7 MDR Team Discovers New SonicWall SMA1000 Zero-Days Being Actively Exploited (CVE-2026-15409, CVE-2026-15410)","url":"https://www.rapid7.com/blog/post/etr-rapid7-mdr-team-discovers-new-sonicwall-sma1000-zero-days-being-actively-exploited-cve-2026-15409-cve-2026-15410/","publisher":"Rapid7","context":"The article references Rapid7's analysis to explain how the /wsproxy bypass can reach localhost-only services and support code execution on SonicWall SMA 1000 devices.","category":"research","primary":false}],"body":"\u003cp\u003eA previously undocumented threat actor tracked by Volexity as \u003cstrong\u003eUTA0533\u003c/strong\u003e exploited SonicWall Secure Mobile Access 1000 series appliances as zero-days before public disclosure, with activity observed since June 22, 2026. The vulnerabilities are \u003cstrong\u003eCVE-2026-15409\u003c/strong\u003e and \u003cstrong\u003eCVE-2026-15410\u003c/strong\u003e, which can be chained to enable arbitrary command execution and device takeover. SonicWall released patches for both vulnerabilities this week.\u003c/p\u003e\n\n\u003cp\u003eVolexity identified two compromised SonicWall SMA VPN devices at an unnamed organization. On one appliance, the threat actor wrote a setuid binary called \u003cstrong\u003eROOTRUN\u003c/strong\u003e, deployed \u003cstrong\u003eKNUCKLEBALL\u003c/strong\u003e containing embedded JAR payloads, and installed the \u003cstrong\u003eSuo5\u003c/strong\u003e proxy and a Behinder-like Java web shell called \u003cstrong\u003eORANGETAIL\u003c/strong\u003e. The attacker also modified startup and NGINX Unit configuration files to establish persistence and route traffic to the malicious components.\u003c/p\u003e\n\n\u003cp\u003eThe exploitation chain involved an unauthenticated \u003cstrong\u003e/wsproxy\u003c/strong\u003e request that could establish a WebSocket tunnel to localhost-only services, followed by access to CouchDB and escalation through the SMA control service. Volexity said root access could allow the threat actor to access stored or cached credentials, capture network traffic, and potentially intercept credentials processed by the appliances. Available evidence suggested the actor was less successful at moving laterally or gaining access to other systems.\u003c/p\u003e\n"},{"n":7,"title":"Emerging Threat: (CVE-2026-63030, CVE-2026-60137) WordPress Core Unauthenticated RCE via wp2shell","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-63030-cve-2026-60137-wordpress-core-unauthenticated-rce-via-wp2shell/","time":"08:29","priority":"MUST READ","score":95,"tldr":"WordPress released fixes for the wp2shell vulnerability chain, which enables unauthenticated remote code execution on default WordPress 6.9.0–6.9.4 and 7.0.0–7.0.1 sites, while 6.8.x sites still need patching for the SQL injection component. Administrators should verify updates to 6.8.6, 6.9.5, or 7.0.2 and review exposed sites for possible compromise.","briefOverview":"\u003cp\u003ewp2shell is an unauthenticated remote code execution attack against WordPress core that combines two separately tracked flaws, CVE-2026-63030 and CVE-2026-60137. The article says the chain can let an anonymous attacker run code on a default WordPress installation with no plugins, no valid account, and no user interaction. As of July 18, 2026, a working proof of concept describing the full mechanism had been published, lowering the effort required to probe exposed installations.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-63030 is a REST API batch-route confusion issue in \u003ccode\u003eWP_REST_Server::serve_batch_request_v1()\u003c/code\u003e affecting the \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e endpoint, which has shipped with WordPress since version 5.6. CVE-2026-60137 is a SQL injection in the \u003ccode\u003eauthor__not_in\u003c/code\u003e parameter of \u003ccode\u003eWP_Query\u003c/code\u003e, the core class that builds most WordPress database queries. The full RCE chain affects WordPress core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while WordPress 6.8.0 through 6.8.5 carries only the SQL injection component.\u003c/p\u003e\n\n\u003cp\u003eWordPress released fixes in versions 6.8.6, 6.9.5, and 7.0.2 on July 17, 2026, with the 7.1 beta line fixed in 7.1 beta2. The article emphasizes that automatic updates may fail or be disabled, so administrators should confirm the installed version on each site and treat sites that were exposed while vulnerable as potentially compromised until reviewed. CyCognito’s observed exposure spans multiple sectors, with Consumer Discretionary, Industrials, and Communication Services leading the visible affected asset set.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["wp2shell is an unauthenticated remote code execution chain in WordPress core that combines CVE-2026-63030, a REST API batch-route confusion issue, with CVE-2026-60137, a SQL injection in the author__not_in parameter of WP_Query.","The full remote code execution chain affects WordPress core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while WordPress 6.8.0 through 6.8.5 carries only the SQL injection component.","WordPress released fixed versions 6.8.6, 6.9.5, and 7.0.2 on July 17, 2026, and the 7.1 beta line is fixed in 7.1 beta2.","The article says defenders should verify that automatic updates completed, prioritize sites on 6.9.0 or later, restrict or block /wp-json/batch/v1 until patched, monitor logs, and review potentially affected sites for compromise.","CyCognito’s observed exposure was spread across sectors, led by Consumer Discretionary at 18.6%, Industrials at 15.8%, and Communication Services at 13.0%."],"insights":["The 6.8.x branch could be overlooked if teams track only the full wp2shell RCE chain, because those sites are not exposed to the complete chain but still need 6.8.6 to fix the SQL injection component.","The article emphasizes that forced automatic updates reduce risk but are not proof of remediation, because background updates can fail or be disabled and each site’s installed version must be confirmed.","CyCognito’s exposure data suggests vulnerable WordPress assets are often secondary properties such as campaign, regional, subsidiary, or product-line sites rather than flagship domains, making inventory gaps a major practical risk.","Because the RCE chain requires no plugins, valid account, or user interaction, the usual triage assumption that WordPress risk depends on a vulnerable add-on does not apply for affected core versions.","Patching closes the vulnerable path but does not address any compromise that may have happened before the update, so sites that were reachable while running affected versions require review beyond version verification."],"referencedReports":[],"body":"\u003cp\u003ewp2shell is an unauthenticated remote code execution attack against WordPress core that combines two separately tracked flaws, CVE-2026-63030 and CVE-2026-60137. The article says the chain can let an anonymous attacker run code on a default WordPress installation with no plugins, no valid account, and no user interaction. As of July 18, 2026, a working proof of concept describing the full mechanism had been published, lowering the effort required to probe exposed installations.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-63030 is a REST API batch-route confusion issue in \u003ccode\u003eWP_REST_Server::serve_batch_request_v1()\u003c/code\u003e affecting the \u003ccode\u003e/wp-json/batch/v1\u003c/code\u003e endpoint, which has shipped with WordPress since version 5.6. CVE-2026-60137 is a SQL injection in the \u003ccode\u003eauthor__not_in\u003c/code\u003e parameter of \u003ccode\u003eWP_Query\u003c/code\u003e, the core class that builds most WordPress database queries. The full RCE chain affects WordPress core versions 6.9.0 through 6.9.4 and 7.0.0 through 7.0.1, while WordPress 6.8.0 through 6.8.5 carries only the SQL injection component.\u003c/p\u003e\n\n\u003cp\u003eWordPress released fixes in versions 6.8.6, 6.9.5, and 7.0.2 on July 17, 2026, with the 7.1 beta line fixed in 7.1 beta2. The article emphasizes that automatic updates may fail or be disabled, so administrators should confirm the installed version on each site and treat sites that were exposed while vulnerable as potentially compromised until reviewed. CyCognito’s observed exposure spans multiple sectors, with Consumer Discretionary, Industrials, and Communication Services leading the visible affected asset set.\u003c/p\u003e\n"},{"n":2,"title":"Critical NGINX Vulnerability Can Crash Workers and May Allow Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/critical-nginx-vulnerability-can-crash.html","time":"20:42","priority":"MUST READ","score":94,"tldr":"F5 patched a critical NGINX heap buffer overflow, CVE-2026-42533, that can let unauthenticated attackers crash worker processes and may enable remote code execution in certain configurations. Organizations should upgrade to nginx 1.30.4/1.31.3 or NGINX Plus 37.0.3.1 because temporary mitigations may not fully close the issue.","briefOverview":"\u003cp\u003eF5 shipped fixes for CVE-2026-42533, a critical nginx flaw that allows a remote, unauthenticated attacker to trigger a heap buffer overflow in the worker process with crafted HTTP requests. The issue was patched on July 15 in nginx 1.30.4 stable, nginx 1.31.3 mainline, and NGINX Plus 37.0.3.1. Triggering the flaw can crash or restart the worker process, causing denial of service, and F5 says it may allow remote code execution where ASLR is disabled or can be bypassed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability depends on configuration, not just version, and appears in a specific pattern involving a regex-based map whose output variable is referenced after a capture from an earlier regex match. The article explains that nginx’s two-pass script engine first measures the needed buffer size and then writes the result, but the shared capture state can be overwritten between those passes. As a result, the buffer may be sized for one capture while the write uses a different attacker-sized capture, producing an overflow controlled by the request.\u003c/p\u003e\n\n\u003cp\u003eF5 lists the flaw as affecting core nginx, NGINX Plus, NGINX Ingress Controller, Gateway Fabric, App Protect WAF, and Instance Manager, though fixed builds for the latter four were not listed at publication. F5 recommends upgrading and offers a temporary mitigation of switching affected regex maps to named captures, but researcher Stan Shaw says upgrading is the only complete fix because a narrower named-capture path remains. As of July 20, CVE-2026-42533 was not in CISA’s Known Exploited Vulnerabilities catalog and no public exploit code had appeared, while Shaw said he would publish a proof-of-concept 21 days after the patch.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 patched CVE-2026-42533 on July 15 in nginx 1.30.4, nginx 1.31.3, and NGINX Plus 37.0.3.1.","The flaw can let a remote, unauthenticated attacker trigger a heap buffer overflow in the nginx worker process using crafted HTTP requests.","Triggering the vulnerability can crash or restart the worker process and may allow remote code execution where ASLR is disabled or can be bypassed.","Exposure depends on configuration and involves a regex-based map whose output variable is referenced in a string expression after a capture from an earlier regex match.","F5’s temporary mitigation is to switch affected regex maps to named captures, but researcher Stan Shaw said upgrading is the only complete fix."],"insights":["The vulnerability is configuration-dependent, so simply running a vulnerable nginx version is not enough to confirm exposure; administrators need to inspect whether regex-based maps and capture variables are used in the specific ordering described.","Researcher Stan Shaw claims the bug can leak uninitialized heap data when the clobbered capture is smaller than the original, potentially providing the address information needed to bypass ASLR on a default Ubuntu 24.04 build.","F5’s suggested mitigation of switching affected regex maps to named captures may not fully address the issue, because Shaw says a map that defines the same named group as the location regex can still reach the overflow through another code path.","The article says no public exploit code or CISA Known Exploited Vulnerabilities listing existed as of July 20, but Shaw plans to publish a proof-of-concept 21 days after the patch, creating a limited window to upgrade before exploit details may become public."],"referencedReports":[{"title":"F5 advisory for CVE-2026-42533","url":"https://my.f5.com/manage/s/article/K000162097","publisher":"F5","context":"The article cites F5's advisory for affected products, severity ratings, impact, and mitigation guidance for CVE-2026-42533.","category":"advisory","primary":true},{"title":"NGINX security advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"nginx","context":"The article references nginx's security advisories for the vulnerable version range, stating that versions from 0.9.6 through 1.31.2 are affected.","category":"advisory","primary":true},{"title":"CVE-2026-42533 nginx RCE writeup","url":"https://cyberstan.co.uk/nginx-rce/","publisher":"Stan Shaw / cyberstan","context":"The article cites Stan Shaw's detailed writeup for technical claims about ASLR bypass, heap data leakage, and a mitigation bypass variant.","category":"research","primary":true}],"body":"\u003cp\u003eF5 shipped fixes for CVE-2026-42533, a critical nginx flaw that allows a remote, unauthenticated attacker to trigger a heap buffer overflow in the worker process with crafted HTTP requests. The issue was patched on July 15 in nginx 1.30.4 stable, nginx 1.31.3 mainline, and NGINX Plus 37.0.3.1. Triggering the flaw can crash or restart the worker process, causing denial of service, and F5 says it may allow remote code execution where ASLR is disabled or can be bypassed.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerability depends on configuration, not just version, and appears in a specific pattern involving a regex-based map whose output variable is referenced after a capture from an earlier regex match. The article explains that nginx’s two-pass script engine first measures the needed buffer size and then writes the result, but the shared capture state can be overwritten between those passes. As a result, the buffer may be sized for one capture while the write uses a different attacker-sized capture, producing an overflow controlled by the request.\u003c/p\u003e\n\n\u003cp\u003eF5 lists the flaw as affecting core nginx, NGINX Plus, NGINX Ingress Controller, Gateway Fabric, App Protect WAF, and Instance Manager, though fixed builds for the latter four were not listed at publication. F5 recommends upgrading and offers a temporary mitigation of switching affected regex maps to named captures, but researcher Stan Shaw says upgrading is the only complete fix because a narrower named-capture path remains. As of July 20, CVE-2026-42533 was not in CISA’s Known Exploited Vulnerabilities catalog and no public exploit code had appeared, while Shaw said he would publish a proof-of-concept 21 days after the patch.\u003c/p\u003e\n"},{"n":4,"title":"UAC-0145 Uses ClickFix CAPTCHAs to Infect Ukrainian Devices wih Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/uac-0145-uses-clickfix-captchas-to.html","time":"13:30","priority":"MUST READ","score":94,"tldr":"CERT-UA says Russian Sandworm sub-cluster UAC-0145 is using fake ClickFix CAPTCHA pages on compromised websites to trick Ukrainian users into running PowerShell commands that install stealers, loaders, and backdoors. The group is also targeting Android devices with disguised APK backdoors that collect files, contacts, and live geolocation.","briefOverview":"\u003cp\u003eRussian state-sponsored threat actors have been observed using the ClickFix strategy to trick Ukrainian targets into infecting their own machines with data-stealing malware. CERT-UA attributed the activity to UAC-0145, a sub-cluster within Sandworm affiliated with Russia’s GRU military intelligence agency. The attacks used fake CAPTCHA checks on compromised websites that instructed visitors to execute a PowerShell command in the terminal.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA said the command could download and save a VBS file in the Startup autorun directory, with one variant called GHETTOVIBE. The campaign also involved SCOUTCURL, a PowerShell reconnaissance script, along with FLUIDLEECH and LOADLOOP loaders and the FREAKYPOLL Python backdoor. At least 10 websites were assessed to have been compromised between June and July 2026, with the attackers using Cloaking.House and a bespoke tool called SMARTAXE to alter web page content depending on the visitor.\u003c/p\u003e\n\n\u003cp\u003eThe injected CAPTCHA content used the EtherHiding technique to retrieve a remote resource domain name from an Ethereum smart contract. CERT-UA also identified Android APK files distributed via messaging apps and disguised as security tools, carrying the COWARDDUCK backdoor. COWARDDUCK can collect contacts, selected files, and real-time geolocation, while using the Dropbox API to upload files and retrieving commands or data from an external server or legitimate sites such as steamcommunity[.]com.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CERT-UA attributed the campaign to UAC-0145, a sub-cluster within Sandworm affiliated with Russia's GRU military intelligence agency.","The attackers used fake CAPTCHA checks on compromised websites to instruct Ukrainian targets to execute PowerShell commands that could download and save a VBS file such as GHETTOVIBE in the Startup autorun directory.","CERT-UA identified additional malware on infected endpoints, including the SCOUTCURL reconnaissance script, FLUIDLEECH and LOADLOOP loaders, and the FREAKYPOLL Python backdoor.","At least 10 websites were assessed to have been compromised between June and July 2026, with the attackers using Cloaking.House and a bespoke tool called SMARTAXE to selectively display CAPTCHA checks.","CERT-UA also found that the threat actor distributed Android APK files disguised as security tools via messaging apps, containing the COWARDDUCK backdoor that can collect contacts, certain files, and real-time geolocation."],"insights":["UAC-0145’s use of ClickFix marks a shift from its earlier reported delivery methods, which included trojanized Microsoft Windows or Office installers and bogus antivirus software shared through Signal.","The campaign combined Cloaking.House with the custom SMARTAXE tool to show different web content to different visitors, making the fake CAPTCHA delivery selective rather than universally visible.","The injected CAPTCHA content used EtherHiding to retrieve a remote resource domain from an Ethereum smart contract, showing that the operation relied on blockchain-hosted data as part of its delivery chain.","The Android backdoor COWARDDUCK used legitimate services such as Dropbox and steamcommunity.com for file upload or command retrieval, blending malicious activity with normal cloud and web traffic."],"referencedReports":[{"title":"CERT-UA alert on UAC-0145 ClickFix activity","url":"https://cert.gov.ua/article/6318437","publisher":"CERT-UA","context":"The article cites a CERT-UA alert as the source attributing the activity to UAC-0145 and describing the fake CAPTCHA, PowerShell, Windows malware, and Android backdoor activity.","category":"advisory","primary":true}],"body":"\u003cp\u003eRussian state-sponsored threat actors have been observed using the ClickFix strategy to trick Ukrainian targets into infecting their own machines with data-stealing malware. CERT-UA attributed the activity to UAC-0145, a sub-cluster within Sandworm affiliated with Russia’s GRU military intelligence agency. The attacks used fake CAPTCHA checks on compromised websites that instructed visitors to execute a PowerShell command in the terminal.\u003c/p\u003e\n\n\u003cp\u003eCERT-UA said the command could download and save a VBS file in the Startup autorun directory, with one variant called GHETTOVIBE. The campaign also involved SCOUTCURL, a PowerShell reconnaissance script, along with FLUIDLEECH and LOADLOOP loaders and the FREAKYPOLL Python backdoor. At least 10 websites were assessed to have been compromised between June and July 2026, with the attackers using Cloaking.House and a bespoke tool called SMARTAXE to alter web page content depending on the visitor.\u003c/p\u003e\n\n\u003cp\u003eThe injected CAPTCHA content used the EtherHiding technique to retrieve a remote resource domain name from an Ethereum smart contract. CERT-UA also identified Android APK files distributed via messaging apps and disguised as security tools, carrying the COWARDDUCK backdoor. COWARDDUCK can collect contacts, selected files, and real-time geolocation, while using the Dropbox API to upload files and retrieving commands or data from an external server or legitimate sites such as steamcommunity[.]com.\u003c/p\u003e\n"},{"n":8,"title":"SleeperGem: Compromised git_credential_manager, Dendreo, and fastlane RubyGems Drop a Persistent Backdoor","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/sleepergem-compromised-rubygems-drop-persistent-backdoor","time":"16:06","priority":"MUST READ","score":92,"tldr":"Malicious versions of three RubyGems packages in the SleeperGem campaign acted as loaders that avoided CI, targeted developer machines, downloaded a backdoor from git.disroot.org, and installed persistence via systemd and cron. Anyone who installed the affected gem versions should treat the machine and accessible secrets as compromised, remove the dropped artifacts, and rotate credentials.","briefOverview":"\u003cp\u003eBetween July 18 and July 19, 2026, malicious versions of three RubyGems packages were published to RubyGems.org in a coordinated supply chain attack named SleeperGem. The affected packages were \u003ccode\u003egit_credential_manager\u003c/code\u003e versions 2.8.0 through 2.8.3, \u003ccode\u003eDendreo\u003c/code\u003e versions 1.1.3 and 1.1.4, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e version 0.3.2. The releases were published directly to the registry with no matching commit or tag in the source projects, and two of the gems had been dormant for years before suddenly receiving new versions.\u003c/p\u003e\n\n\u003cp\u003eThe malicious gems acted as loaders that checked for continuous integration environment variables and exited if they appeared to be running in a build system. On a developer machine, the loader downloaded \u003ccode\u003edeploy.sh\u003c/code\u003e and a native \u003ccode\u003egit-credential-manager\u003c/code\u003e binary from an attacker-controlled Forgejo host at \u003ccode\u003egit.disroot.org\u003c/code\u003e, using certificate verification disabled and a \u003ccode\u003eUser-Agent\u003c/code\u003e of \u003ccode\u003eGit\u003c/code\u003e. StepSecurity ran the compromised versions with Harden-Runner in audit mode and captured the process tree, network connections, and file activity showing the full chain.\u003c/p\u003e\n\n\u003cp\u003eIn \u003ccode\u003egit_credential_manager\u003c/code\u003e version 2.8.3, the installer copied the downloaded binary to \u003ccode\u003e$HOME/.local/share/gcm/git-credential-manager\u003c/code\u003e, launched it as a background daemon, and installed persistence through both a systemd user service and a cron entry named \u003ccode\u003egit-credential-manager\u003c/code\u003e. The script also probed the \u003ccode\u003esudo\u003c/code\u003e and \u003ccode\u003ewheel\u003c/code\u003e groups and included a code path that, if run as root, planted a setuid root shell at \u003ccode\u003e/usr/local/sbin/ping6\u003c/code\u003e. The article advises anyone who installed or required the affected gems on a developer machine to treat the machine and all reachable secrets as compromised, remove the dropped artifacts and persistence, check for the setuid shell, and rotate credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Between July 18 and July 19, 2026, malicious versions of the RubyGems packages git_credential_manager, Dendreo, and fastlane-plugin-run_tests_firebase_testlab were published to RubyGems.org in a coordinated supply chain attack named SleeperGem.","The malicious gems check for about thirty continuous integration environment variables and exit without running if they detect a build system, indicating that developer machines were the intended target.","The gems act as loaders that download deploy.sh and a native git-credential-manager binary from an attacker-controlled Forgejo host at git.disroot.org, with certificate verification disabled and a User-Agent of Git.","In version 2.8.3, the installer copies the downloaded binary to $HOME/.local/share/gcm/git-credential-manager, starts it as a background daemon, and installs persistence through both a systemd user service and a cron entry.","The article advises anyone who installed or required the affected gems on a developer machine to treat that machine and every reachable secret as compromised, remove the dropped artifacts and persistence, check for /usr/local/sbin/ping6, and rotate credentials."],"insights":["A clean CI run does not rule out compromise because the malicious gems deliberately exit when they detect common build-system environment variables, so developer-machine checks are necessary.","RubyGems releases that appear without matching source repository tags, especially after years of package dormancy, were a useful signal for identifying the malicious versions.","The attackers appeared to iterate their payloads in public: git_credential_manager 2.8.2 downloaded the payload but did not execute it, while 2.8.3 ran the full chain.","For git_credential_manager 2.8.2 and later, merely requiring the library can trigger the loader, so exposure is not limited to package installation time.","The article notes that credential harvesting and exfiltration live in the dropped native daemon rather than in the gem source itself, meaning file and process artifacts on developer machines are central to confirming impact."],"referencedReports":[{"title":"SleeperGem RubyGems supply chain attack","url":"https://www.aikido.dev/blog/sleepergem-rubygems-supply-chain-attack","publisher":"Aikido Security","context":"The article says the SleeperGem supply chain attack was first reported and named by Aikido Security and points readers to Aikido’s write-up for its analysis.","category":"research","primary":true}],"body":"\u003cp\u003eBetween July 18 and July 19, 2026, malicious versions of three RubyGems packages were published to RubyGems.org in a coordinated supply chain attack named SleeperGem. The affected packages were \u003ccode\u003egit_credential_manager\u003c/code\u003e versions 2.8.0 through 2.8.3, \u003ccode\u003eDendreo\u003c/code\u003e versions 1.1.3 and 1.1.4, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e version 0.3.2. The releases were published directly to the registry with no matching commit or tag in the source projects, and two of the gems had been dormant for years before suddenly receiving new versions.\u003c/p\u003e\n\n\u003cp\u003eThe malicious gems acted as loaders that checked for continuous integration environment variables and exited if they appeared to be running in a build system. On a developer machine, the loader downloaded \u003ccode\u003edeploy.sh\u003c/code\u003e and a native \u003ccode\u003egit-credential-manager\u003c/code\u003e binary from an attacker-controlled Forgejo host at \u003ccode\u003egit.disroot.org\u003c/code\u003e, using certificate verification disabled and a \u003ccode\u003eUser-Agent\u003c/code\u003e of \u003ccode\u003eGit\u003c/code\u003e. StepSecurity ran the compromised versions with Harden-Runner in audit mode and captured the process tree, network connections, and file activity showing the full chain.\u003c/p\u003e\n\n\u003cp\u003eIn \u003ccode\u003egit_credential_manager\u003c/code\u003e version 2.8.3, the installer copied the downloaded binary to \u003ccode\u003e$HOME/.local/share/gcm/git-credential-manager\u003c/code\u003e, launched it as a background daemon, and installed persistence through both a systemd user service and a cron entry named \u003ccode\u003egit-credential-manager\u003c/code\u003e. The script also probed the \u003ccode\u003esudo\u003c/code\u003e and \u003ccode\u003ewheel\u003c/code\u003e groups and included a code path that, if run as root, planted a setuid root shell at \u003ccode\u003e/usr/local/sbin/ping6\u003c/code\u003e. The article advises anyone who installed or required the affected gems on a developer machine to treat the machine and all reachable secrets as compromised, remove the dropped artifacts and persistence, check for the setuid shell, and rotate credentials.\u003c/p\u003e\n"},{"n":6,"title":"SleeperGem: RubyGems supply chain attack targets dormant maintainer accounts","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/sleepergem-rubygems-supply-chain-attack","time":"08:45","priority":"SHOULD READ","score":88,"tldr":"Attackers compromised dormant RubyGems maintainer accounts to publish malicious updates that added a dropper dependency, targeting developer machines while avoiding CI environments. The incident shows RubyGems is facing the same supply-chain account-takeover threat pattern seen in npm and PyPI.","briefOverview":"\u003cp\u003eA suspicious new RubyGems package named \u003ccode\u003egit_credential_manager\u003c/code\u003e published four versions in rapid succession and downloaded binaries from a Forgejo repository at \u003ccode\u003egit.disroot.org/git-ecosystem\u003c/code\u003e. The repository contained binaries, some zipped, and one submitted to VirusTotal was flagged as malicious by antivirus vendors. The package used a username, \u003ccode\u003egit-ecosystem\u003c/code\u003e, that made the project look just legitimate enough to avoid immediate suspicion.\u003c/p\u003e\n\n\u003cp\u003eAcross its versions, \u003ccode\u003egit_credential_manager\u003c/code\u003e developed into a dropper that built a URL to the hardcoded Forgejo host, disabled SSL certificate verification, and executed the downloaded payload through a shell or PowerShell. Later releases made the Unix execution quieter, wired the installer into the gem load path so that simply requiring the library could trigger it, and then re-enabled execution of the downloaded script. The package also checked for roughly 30 CI-related environment variables and did nothing when it detected platforms such as GitHub Actions, GitLab CI, CircleCI, Travis, Jenkins, or Vercel.\u003c/p\u003e\n\n\u003cp\u003eThe publisher account also maintained other gems, some of which had not been updated since 2019 but suddenly received new releases. Dendreo, first published in 2017, added \u003ccode\u003egit_credential_manager\u003c/code\u003e as a dependency, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, a separate project with 574,661 total downloads, also received a new version from a different maintainer account. The article says this suggests more than one dormant maintainer account was compromised and describes it as RubyGems’ first real taste of a pattern already seen in npm and PyPI.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new RubyGems package named git_credential_manager published four versions in rapid succession and downloaded binaries from a Forgejo repository at git.disroot.org/git-ecosystem.","Version 2.8.0 of git_credential_manager fetched payloads with SSL certificate verification disabled and executed them through a shell or PowerShell.","Later versions made the package quieter, wired the installer into the gem load path so requiring the library could trigger it, and then enabled execution of the downloaded script.","The package included a skip_install? check for about 30 continuous integration environment variables and did nothing when it detected platforms such as GitHub Actions, GitLab CI, CircleCI, Travis, Jenkins, or Vercel.","The attacker also published new versions of Dendreo and fastlane-plugin-run_tests_firebase_testlab, with Dendreo adding git_credential_manager as a dependency and the fastlane plugin belonging to a different maintainer account with 574,661 total downloads."],"insights":["Dormant maintainer accounts can be especially attractive takeover targets because their long inactivity may make sudden malicious updates appear less risky or go unnoticed.","The attacker’s decision to avoid CI environments shows the campaign was aimed at real developer laptops rather than disposable automated build systems.","The rapid version changes in git_credential_manager show the attacker actively refined the delivery mechanism after publication, including making execution quieter and moving the trigger from explicit use to simply loading the library.","The compromise of two unrelated maintainer accounts within hours suggests the issue was not limited to one abandoned project or one owner’s package set.","Adding the malicious package as a dependency to older trusted gems allowed the attacker to reach existing users without needing them to discover or install the new package directly."],"referencedReports":[],"body":"\u003cp\u003eA suspicious new RubyGems package named \u003ccode\u003egit_credential_manager\u003c/code\u003e published four versions in rapid succession and downloaded binaries from a Forgejo repository at \u003ccode\u003egit.disroot.org/git-ecosystem\u003c/code\u003e. The repository contained binaries, some zipped, and one submitted to VirusTotal was flagged as malicious by antivirus vendors. The package used a username, \u003ccode\u003egit-ecosystem\u003c/code\u003e, that made the project look just legitimate enough to avoid immediate suspicion.\u003c/p\u003e\n\n\u003cp\u003eAcross its versions, \u003ccode\u003egit_credential_manager\u003c/code\u003e developed into a dropper that built a URL to the hardcoded Forgejo host, disabled SSL certificate verification, and executed the downloaded payload through a shell or PowerShell. Later releases made the Unix execution quieter, wired the installer into the gem load path so that simply requiring the library could trigger it, and then re-enabled execution of the downloaded script. The package also checked for roughly 30 CI-related environment variables and did nothing when it detected platforms such as GitHub Actions, GitLab CI, CircleCI, Travis, Jenkins, or Vercel.\u003c/p\u003e\n\n\u003cp\u003eThe publisher account also maintained other gems, some of which had not been updated since 2019 but suddenly received new releases. Dendreo, first published in 2017, added \u003ccode\u003egit_credential_manager\u003c/code\u003e as a dependency, and \u003ccode\u003efastlane-plugin-run_tests_firebase_testlab\u003c/code\u003e, a separate project with 574,661 total downloads, also received a new version from a different maintainer account. The article says this suggests more than one dormant maintainer account was compromised and describes it as RubyGems’ first real taste of a pattern already seen in npm and PyPI.\u003c/p\u003e\n"},{"n":1,"title":"Hackers abuse ViPNet software to target Russian govt agencies","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-abuse-vipnet-software-to-target-russian-govt-agencies/","time":"14:23","priority":"SHOULD READ","score":86,"tldr":"A threat actor dubbed HelloNet is abusing the local update mechanism of Russia’s ViPNet security software to sideload malware against Russian government and critical-sector organizations. Kaspersky says there is no evidence ViPNet’s update infrastructure was compromised, and attribution to a Chinese-speaking APT is low confidence.","briefOverview":"\u003cp\u003eAn advanced threat actor is abusing the update mechanism for the ViPNet private networking product suite to target Russian organizations, including government agencies. The campaign is dubbed HelloNet and has been active since at least May. Kaspersky says it has impacted organizations in the government, energy, transport, education, and logistics sectors.\u003c/p\u003e\n\n\u003cp\u003eViPNet is a Russian information-security product suite from InfoTeCS that provides VPN, endpoint and network access protection, firewall, certificate management, centralized administration, and secure messaging and file transfer. The software is commonly used in Russia and is certified for use in government and other regulated environments. The article notes that ViPNet’s market reach in Russia, especially among high-value organizations, has made it a frequent target for hackers.\u003c/p\u003e\n\n\u003cp\u003eIn the latest campaign, attackers placed a malicious file named wtsapi32.dll, dubbed HelloInjector, inside the local ViPNet Update System directory so it would be sideloaded at system startup by the legitimate itcsrvup64.exe process. HelloInjector injects into svchost.exe, runs the HelloProxy payload in memory, and contacts a command-and-control server to receive additional modules including HelloExecutor, HelloCleaner, and HelloBackdoor. Kaspersky does not describe how the attackers gained initial access and does not claim that ViPNet’s update infrastructure was compromised.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An advanced threat actor dubbed HelloNet is abusing the update mechanism for the ViPNet private networking product suite to target Russian organizations, including government agencies.","Kaspersky says HelloNet has impacted organizations in Russia’s government, energy, transport, education, and logistics sectors.","Attackers placed a malicious wtsapi32.dll file named HelloInjector inside the local ViPNet Update System directory so it would be sideloaded at system startup by the legitimate itcsrvup64.exe process.","HelloInjector injects into svchost.exe and runs an embedded payload called HelloProxy in memory, which contacts a command-and-control server to receive additional modules.","Kaspersky has tentatively attributed the campaign to an unidentified Chinese-speaking APT group with low confidence and recommends monitoring ViPNet systems for traffic on ports 5003, 5060, and 443."],"insights":["The campaign abuses a local ViPNet Update System directory and a legitimate ViPNet updater process, but Kaspersky does not claim that ViPNet’s update infrastructure itself was compromised.","Because ViPNet is certified for Russian government and regulated environments, abusing it gives attackers a path into high-value organizations that are likely to trust the software.","The malware set includes a dedicated log-cleaning component, HelloCleaner, specifically designed to remove ViPNet log data and hide the malicious activity.","Kaspersky’s attribution to a Chinese-speaking APT is low confidence because it is based mainly on weak indicators, including an unused sina.com reference and a malware mirror hosted by the University of Science and Technology of China.","Traffic on ports 5003 and 5060 for HelloProxy and port 443 for HelloBackdoor is specifically highlighted by Kaspersky as monitoring focus for systems running ViPNet."],"referencedReports":[{"title":"New backdoor mimics security software update","url":"https://securelist.com/new-backdoor-mimics-security-software-update/116246/","publisher":"Kaspersky","context":"The article cites Kaspersky’s April 2025 report that threat actors impersonated a ViPNet update in earlier attacks.","category":"research","primary":false}],"body":"\u003cp\u003eAn advanced threat actor is abusing the update mechanism for the ViPNet private networking product suite to target Russian organizations, including government agencies. The campaign is dubbed HelloNet and has been active since at least May. Kaspersky says it has impacted organizations in the government, energy, transport, education, and logistics sectors.\u003c/p\u003e\n\n\u003cp\u003eViPNet is a Russian information-security product suite from InfoTeCS that provides VPN, endpoint and network access protection, firewall, certificate management, centralized administration, and secure messaging and file transfer. The software is commonly used in Russia and is certified for use in government and other regulated environments. The article notes that ViPNet’s market reach in Russia, especially among high-value organizations, has made it a frequent target for hackers.\u003c/p\u003e\n\n\u003cp\u003eIn the latest campaign, attackers placed a malicious file named wtsapi32.dll, dubbed HelloInjector, inside the local ViPNet Update System directory so it would be sideloaded at system startup by the legitimate itcsrvup64.exe process. HelloInjector injects into svchost.exe, runs the HelloProxy payload in memory, and contacts a command-and-control server to receive additional modules including HelloExecutor, HelloCleaner, and HelloBackdoor. Kaspersky does not describe how the attackers gained initial access and does not claim that ViPNet’s update infrastructure was compromised.\u003c/p\u003e\n"},{"n":5,"title":"The Policy PDF That Hid Its Link From Every Scanner","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/pdf-uri-annotation-redirect-m365-admin-credential-harvest","time":"11:00","priority":"SHOULD READ","score":78,"tldr":"A phishing email that passed SPF, DKIM, and DMARC used a mostly image-based PDF with hidden URI annotations to redirect finance leaders through a compromised WordPress site toward the Microsoft 365 admin portal. The key lesson is that authenticated email and clean static file scans do not prove safety when malicious links are embedded outside readable text.","briefOverview":"\u003cp\u003eA finance team at an insurance company received a “Revised Policy” email from a life-insurance administrator they had corresponded with before. The message passed SPF, DKIM, DMARC, and Microsoft compauth checks, and its visible body contained only a corporate signature block and data-protection disclaimer. The attached scanned PDF was named \u003ccode\u003ePolicy_Revision...KY.pdf\u003c/code\u003e and was judged clean by static engines because it had no JavaScript, forms, macros, or embedded executables.\u003c/p\u003e\n\n\u003cp\u003eThe malicious element was hidden in the PDF’s URI link annotations rather than in the email body or readable PDF text. Forensic extraction found seven URI annotations, including one that redirected through a compromised WordPress site to \u003ccode\u003ehxxps://admin[.]microsoft[.]com/AdminPortal/Home?ref=Domains\u003c/code\u003e. The article says this targeted admin-tier credentials for tenant takeover, because Microsoft 365 admin access can allow control over accounts, security settings, mail-flow rules, domains, and mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe only visible text-level warning sign was a phone number in the signature block that was one digit different from the sender organization’s real published line. Themis flagged the message at 90% confidence using behavioral and contextual signals, including the low-text scanned attachment, redirecting link annotations, administrative sign-in destination, signature inconsistency, and VIP finance recipients. The message was quarantined across four affected mailboxes within minutes of delivery before anyone clicked.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A finance team at an insurance company received a “Revised Policy” email that passed SPF, DKIM, DMARC, and Microsoft compauth checks.","The attached scanned PDF was judged clean by static scanners because it contained no JavaScript, forms, macros, or embedded executables and had very little extractable text.","Forensic extraction found seven URI annotations in the PDF, including one that redirected through a compromised WordPress site to the Microsoft 365 admin sign-in portal.","The only visible text-level warning sign was a phone number in the signature block that was one digit different from the sender organization’s real published line.","Themis flagged the message at 90% confidence using behavioral and contextual signals and quarantined it across four affected mailboxes before anyone clicked."],"insights":["Passing SPF, DKIM, and DMARC can still indicate that a real authorized sender infrastructure was used, which makes authenticated mail a useful delivery path for credential harvesting rather than proof of safety.","PDF URI annotations need to be treated as links during attachment analysis because they can exist outside the readable text that many scanners inspect.","A low-text scanned PDF can be suspicious when the business context normally calls for a text-based document such as a policy, invoice, or contract.","The final destination of a redirect chain matters more than the reputation of the first domain, especially when a link resolves to an administrative sign-in surface such as the Microsoft 365 admin portal.","Out-of-band verification should use already-known contact details because even a one-digit phone-number change in a signature block can redirect a callback to an attacker."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites the report for findings that credentials were involved in 39% of breaches and phishing was behind 16% of breaches as an initial-access vector.","category":"research","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article references the report to support that attackers prioritize high-privilege, high-trust roles for financial and administrative reach.","category":"research","primary":false}],"body":"\u003cp\u003eA finance team at an insurance company received a “Revised Policy” email from a life-insurance administrator they had corresponded with before. The message passed SPF, DKIM, DMARC, and Microsoft compauth checks, and its visible body contained only a corporate signature block and data-protection disclaimer. The attached scanned PDF was named \u003ccode\u003ePolicy_Revision...KY.pdf\u003c/code\u003e and was judged clean by static engines because it had no JavaScript, forms, macros, or embedded executables.\u003c/p\u003e\n\n\u003cp\u003eThe malicious element was hidden in the PDF’s URI link annotations rather than in the email body or readable PDF text. Forensic extraction found seven URI annotations, including one that redirected through a compromised WordPress site to \u003ccode\u003ehxxps://admin[.]microsoft[.]com/AdminPortal/Home?ref=Domains\u003c/code\u003e. The article says this targeted admin-tier credentials for tenant takeover, because Microsoft 365 admin access can allow control over accounts, security settings, mail-flow rules, domains, and mailboxes.\u003c/p\u003e\n\n\u003cp\u003eThe only visible text-level warning sign was a phone number in the signature block that was one digit different from the sender organization’s real published line. Themis flagged the message at 90% confidence using behavioral and contextual signals, including the low-text scanned attachment, redirecting link annotations, administrative sign-in destination, signature inconsistency, and VIP finance recipients. The message was quarantined across four affected mailboxes within minutes of delivery before anyone clicked.\u003c/p\u003e\n"}]</script>

#dl-layout-cta button{cursor:pointer;font:inherit;padding:.35em .85em;border-radius:7px;
  border:1px solid transparent;white-space:nowrap}
#dl-layout-cta button[data-dl-try]{background:#39bdc9;color:#04222a;
  border-color:#39bdc9;font-weight:600}
#dl-layout-cta button[data-dl-dismiss]{background:transparent;color:inherit;
  border-color:rgba(127,127,127,.4)}
#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
