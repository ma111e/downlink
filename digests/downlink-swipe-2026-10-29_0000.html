<script type="application/json" id="dl-articles">[{"n":6,"title":"Ghost in the PHP2Shell: Why coordinated disclosure and patching will start moving faster","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/ghost-php2shell-coordinated-disclosure-faster","time":"09:36","priority":"MUST READ","score":92,"tldr":"PHP2Shell shows that AI-assisted vulnerability discovery and patch-diffing are compressing the time between disclosure and exploitation, making long embargoes and slow patch processes increasingly risky. Organizations need accurate asset inventories, rapid alerting, and the ability to deploy fixes or mitigations quickly.","briefOverview":"\u003cp\u003ePHP2Shell refers to two serious PHP vulnerabilities, CVE-2026-109618 and CVE-2026-109619, including an out-of-memory issue that had appeared in a 2024 audit but was not fixed because exploitation had not been demonstrated. Calif and Wiz independently found the flaws with proof of exploitation in 2026, and PHP prepared fixes for supported branches under embargo. After the CVE IDs leaked on October 20, PHP issued a pre-announcement and moved its patch release to October 21. Attackers had reportedly begun attempting exploitation before the official patch release, and CISA later added both flaws to its catalog of known exploited vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that AI is reducing the time needed to find vulnerabilities and turn patch details into working exploits. Aikido says its AI Code Analysis rediscovered PHP2Shell within hours after disclosure, while Trail of Bits built a working exploit with Codex in a day. Censys reported on October 27 that roughly 11.2 million PHP services had moved to fixed versions, while 32.5 million still ran affected versions and more than 60 million did not disclose their version. The article recommends that organizations maintain an inventory of their runtimes and dependencies, receive timely incident alerts, and be ready to deploy patches or mitigations quickly as disclosure windows become shorter.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP2Shell consists of two PHP vulnerabilities, CVE-2026-109618 and CVE-2026-109619, for which PHP released fixes on October 21 after the CVE IDs leaked on October 20.","Attackers were attempting to exploit PHP2Shell before the official fixes were released, and CISA reported that the two vulnerabilities had been exploited.","Censys reported on October 27 that about 11.2 million PHP services had moved to fixed versions, while 32.5 million were still running affected versions and more than 60 million did not report a version.","Aikido said its AI Code Analysis rediscovered PHP2Shell in a few hours after the public disclosure.","The article argues that shorter, tighter coordinated-disclosure embargoes and faster patch deployment are increasingly necessary as AI reduces the time from vulnerability discovery to exploitation."],"insights":["The official PHP fix may arrive before downstream packages or hosting providers can deliver an installable update, leaving users exposed even after a public patch release.","PHP can be present indirectly in container base images, CI images, hosting panels, and vendor software, so an asset inventory must cover software teams did not knowingly install.","Briefing CDN and WAF providers before disclosure can enable day-one blocking rules, but reducing the number of parties with advance details can delay those protective layers.","Automatically upgrading every dependency to its latest version can break applications and lead teams to disable the automation, so the article recommends using lock files and applying upgrades when CVEs require them."],"referencedReports":[{"title":"PHP Audit Complete","url":"https://ostif.org/php-audit-complete/","publisher":"OSTIF and Quarkslab","context":"The article says a 2024 audit identified the out-of-memory issue behind one PHP2Shell vulnerability, although exploitation had not yet been demonstrated.","category":"research","primary":false},{"title":"Today’s PHP Security Release and How We’re Strengthening PHP Security","url":"https://thephp.foundation/blog/2026/10/21/todays-php-security-release-and-how-were-strengthening-php-security/","publisher":"PHP Foundation","context":"The article cites this post-mortem for the timeline from PHP2Shell discovery through the patch release.","category":"advisory","primary":true},{"title":"PHP2Shell","url":"https://calif.io/php2shell/","publisher":"Calif","context":"The article cites Calif’s technical write-up for the disclosure timeline and its independent discovery of the vulnerabilities.","category":"research","primary":true},{"title":"CISA Adds Two Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/10/26/cisa-adds-two-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article references this alert as evidence that successful exploitation of the two PHP2Shell vulnerabilities had been observed.","category":"advisory","primary":false}],"body":"\u003cp\u003ePHP2Shell refers to two serious PHP vulnerabilities, CVE-2026-109618 and CVE-2026-109619, including an out-of-memory issue that had appeared in a 2024 audit but was not fixed because exploitation had not been demonstrated. Calif and Wiz independently found the flaws with proof of exploitation in 2026, and PHP prepared fixes for supported branches under embargo. After the CVE IDs leaked on October 20, PHP issued a pre-announcement and moved its patch release to October 21. Attackers had reportedly begun attempting exploitation before the official patch release, and CISA later added both flaws to its catalog of known exploited vulnerabilities.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that AI is reducing the time needed to find vulnerabilities and turn patch details into working exploits. Aikido says its AI Code Analysis rediscovered PHP2Shell within hours after disclosure, while Trail of Bits built a working exploit with Codex in a day. Censys reported on October 27 that roughly 11.2 million PHP services had moved to fixed versions, while 32.5 million still ran affected versions and more than 60 million did not disclose their version. The article recommends that organizations maintain an inventory of their runtimes and dependencies, receive timely incident alerts, and be ready to deploy patches or mitigations quickly as disclosure windows become shorter.\u003c/p\u003e\n"},{"n":14,"title":"AMOS Malware in AI Agent Skills: Analysis and IoCs","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/poisoned-skills-target-developer-credentials","time":"22:43","priority":"SHOULD READ","score":88,"tldr":"Cyera found 516 AI-agent skills linked to the Atomic macOS Stealer (AMOS) campaign, including 70 confirmed malicious skills that received high automated security grades on a popular marketplace. The poisoned skill documentation hides Base64-encoded installation commands and external download links that can trick users or agents into installing credential-stealing malware.","briefOverview":"\u003cp\u003eCyera Research identified 516 AI skills associated with the Atomic macOS Stealer (AMOS) campaign while examining 1.3 million AI skills, MCP servers, and plugins. The malicious skills were hosted on popular skill repositories and used ordinary-looking documentation to present harmful downloads as required setup steps. Of 70 confirmed malicious skills identified in September 2026 outside a Hugging Face dataset artifact, all had received A or B security grades from a popular marketplace.\u003c/p\u003e\n\n\u003cp\u003eThe skills commonly instructed macOS users to decode Base64-encoded text and run it with Bash, while directing Windows users to download an archive and execute a separate package. AMOS can collect browser passwords and session cookies, keychain information, and sensitive files, then send the data to attacker-controlled infrastructure. Cyera found that payload hosting and paste-site relays were heavily reused, with 91.92.242[.]30 accounting for 83.7% of payload-host references and two glot.io snippets accounting for 95.9% of paste-relay references.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified 516 AI skills tied to the Atomic macOS Stealer (AMOS) campaign across its dataset of 1.3 million AI skills, MCP servers, and plugins.","Of 70 confirmed malicious skills identified in September 2026 outside a Hugging Face dataset artifact, all received A or B automated security grades from a popular skills marketplace.","The poisoned skills use plausible documentation and fake prerequisites to direct macOS users to decode and run Base64-encoded Bash commands, while Windows users are directed to download archives and run executables.","AMOS is a macOS-focused information-stealing malware family that can collect browser passwords and session cookies, keychain information, and sensitive files before sending the data to attacker-controlled infrastructure.","The article reports that 91.92.242[.]30 accounted for 83.7% of the payload-host references found in the analyzed malicious skills."],"insights":["High marketplace safety grades did not indicate safety in this case: all 70 confirmed malicious skills received A or B grades, and the cited grading methodology evaluates only the SKILL.md file rather than bundled scripts or other files.","The apparent July–August 2026 break in activity may not represent a campaign pause, because Cyera observed that many newly identified malicious skills were marked malicious and removed from repositories about a week after collection.","The most useful warning signs were setup behavior rather than a skill’s advertised purpose, including release-download links to ZIP or EXE files, glot.io paste links, language stating that a skill \"will not work\" without openclaw-agent, and Base64 data piped to Bash.","The malware-delivery infrastructure was unusually concentrated: 91.92.242[.]30 represented 83.7% of payload-host references, while two glot.io snippets accounted for 95.9% of paste-relay references.","Reviewing only a skill’s main instruction file can miss harmful content, as JFrog reported an encoded dropper hidden in an approximately 22 MB README.md file."],"referencedReports":[{"title":"OpenClaw AI Supply Chain Risk","url":"https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/","publisher":"unit-42","context":"The article cites Unit 42's reporting as documenting an early-2026 malware-distribution operation using poisoned OpenClaw skills and AMOS infrastructure.","category":"research","primary":false}],"body":"\u003cp\u003eCyera Research identified 516 AI skills associated with the Atomic macOS Stealer (AMOS) campaign while examining 1.3 million AI skills, MCP servers, and plugins. The malicious skills were hosted on popular skill repositories and used ordinary-looking documentation to present harmful downloads as required setup steps. Of 70 confirmed malicious skills identified in September 2026 outside a Hugging Face dataset artifact, all had received A or B security grades from a popular marketplace.\u003c/p\u003e\n\n\u003cp\u003eThe skills commonly instructed macOS users to decode Base64-encoded text and run it with Bash, while directing Windows users to download an archive and execute a separate package. AMOS can collect browser passwords and session cookies, keychain information, and sensitive files, then send the data to attacker-controlled infrastructure. Cyera found that payload hosting and paste-site relays were heavily reused, with 91.92.242[.]30 accounting for 83.7% of payload-host references and two glot.io snippets accounting for 95.9% of paste-relay references.\u003c/p\u003e\n"},{"n":8,"title":"Unknown APT uses NetamLoader to attack a Win10 OS customized for governments in Asia","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/netamloader/121676/","time":"08:00","priority":"SHOULD READ","score":84,"tldr":"Kaspersky uncovered NetamLoader, an unattributed, highly sophisticated .NET/XAML malware framework likely delivered through a supply-chain compromise of a government-only Windows 10 build used in Asia. It abuses trusted components and deserialization flaws to bypass AMSI, erase evidence, migrate execution into dllhost.exe, and communicate with a C2 server after long sandbox-evasion delays.","briefOverview":"\u003cp\u003eKaspersky identified an unknown advanced threat framework called NetamLoader after detecting a malicious configuration file in a CAB archive stored in the Windows update-package directory. The archive contained mostly legitimate Patch My PC components and Microsoft-signed .NET assemblies, while the malicious logic was hidden in configuration, resource, and XAML files. Researchers said the chain strongly indicates a supply-chain attack against a specially customized Windows 10 build used exclusively by government entities in Asia.\u003c/p\u003e\n\n\u003cp\u003eNetamLoader uses AppDomainManager injection, a crafted AppFabric configuration, and .NET deserialization to load layered XAML and .NET payloads in memory. Its later stages patch AMSI scanning to return clean results, delete files and logs to remove evidence, disable .NET ETW logging, and move execution into dllhost.exe through a remote COM deserialization exploit. The final plugin delays contact with its C2 server, communicates using AES-CBC encryption with HMAC authentication, and can retrieve and execute additional XAML payloads; Kaspersky identified one victim in Asia but could not attribute the activity to a known APT group.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified an unattributed malware framework named NetamLoader in 2026 after detecting a malicious .config file inside a CAB archive stored in the Windows update-package directory.","The infection chain used PatchMyPC-ScriptRunner.exe, Microsoft-signed .NET assemblies, AppDomainManager injection, a crafted .resx file, and XAML payloads to load malicious code.","NetamLoader patched the AMSI scanning interface so that scans returned a clean result, then used a remote COM object to load its next-stage payload into dllhost.exe.","The malware deleted malicious files, CLR usage logs, Prefetch files, and selected update-log entries to reduce forensic evidence.","The .NET 2 plugin delayed its initial C2 connection by 20 to 40 minutes, polled the openaigpt4v.com C2 infrastructure, and used AES-CBC with HMAC to encrypt and authenticate network traffic."],"insights":["The first encrypted XAML payload can only be decrypted when PatchMyPC-ScriptRunner.exe is launched with the expected command line, because the malware derives its AES key from that command line after converting it to lowercase.","Rather than introducing an obviously malicious executable at the start of the chain, NetamLoader abuses Microsoft-signed .NET components and crafted configuration/resource files to trigger loading of its payloads.","The framework moves its main payload into dllhost.exe through a remote COM deserialization exploit, separating later activity from the original PatchMyPC-ScriptRunner.exe process.","Its C2 configuration permits any HTTPS certificate when the thumbprint value is set to \"*\", and the observed configuration uses that value.","The malware specifically removes lines containing \"GetExtendedUpdateInfoHandler\" from CmitUpdateAgent logs, a component the researchers link to the customized government Windows build."],"referencedReports":[],"body":"\u003cp\u003eKaspersky identified an unknown advanced threat framework called NetamLoader after detecting a malicious configuration file in a CAB archive stored in the Windows update-package directory. The archive contained mostly legitimate Patch My PC components and Microsoft-signed .NET assemblies, while the malicious logic was hidden in configuration, resource, and XAML files. Researchers said the chain strongly indicates a supply-chain attack against a specially customized Windows 10 build used exclusively by government entities in Asia.\u003c/p\u003e\n\n\u003cp\u003eNetamLoader uses AppDomainManager injection, a crafted AppFabric configuration, and .NET deserialization to load layered XAML and .NET payloads in memory. Its later stages patch AMSI scanning to return clean results, delete files and logs to remove evidence, disable .NET ETW logging, and move execution into dllhost.exe through a remote COM deserialization exploit. The final plugin delays contact with its C2 server, communicates using AES-CBC encryption with HMAC authentication, and can retrieve and execute additional XAML payloads; Kaspersky identified one victim in Asia but could not attribute the activity to a known APT group.\u003c/p\u003e\n"},{"n":11,"title":"NIK C2: The new AI-enabled command-and-control framework","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/nik-c2-new-ai-enabled-framework/","time":"10:00","priority":"SHOULD READ","score":84,"tldr":"Cisco Talos identified NIK C2, a Go-based Windows remote-access framework that integrates OpenAI’s API directly into its command-and-control workflow to analyze stolen data from compromised hosts. The malware also supports credential and wallet theft, surveillance, lateral movement, defense evasion, and deployable screen-locking ransomware.","briefOverview":"\u003cp\u003eCisco Talos observed NIK C2, an AI-integrated command-and-control framework with a Go-based 64-bit Windows implant. The implant provides persistent remote control through TLS WebSockets and an HTTP polling fallback, with AES-256-GCM encryption and multiple prioritized command-and-control server addresses. Talos also observed active infrastructure associated with the framework and assessed with moderate confidence that it is a functional framework rather than only a proof of concept.\u003c/p\u003e\n\n\u003cp\u003eNIK C2 can steal browser credentials, cookies, cryptocurrency wallet data, Wi-Fi passwords, and keystrokes, while also supporting screen, camera, microphone, clipboard, proxy, RDP, and hidden desktop-control functions. Its \u003ccode\u003eai_generate\u003c/code\u003e command sends operator prompts to the OpenAI Chat Completions API from the compromised machine and returns the generated response to the operator; when no API key is supplied, it attempts to use the victim machine’s \u003ccode\u003eOPENAI_API_KEY\u003c/code\u003e environment variable. The implant also includes defense-evasion features and can deploy persistent screen-locking ransomware that displays Bitcoin and USDT payment demands without encrypting files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos observed NIK C2, a Go-based 64-bit Windows remote-access implant with persistent command-and-control communications over TLS WebSockets and an HTTP polling fallback.","NIK C2 includes an ai_generate command that sends operator prompts to the OpenAI Chat Completions API from the compromised host and returns the generated response to the command-and-control server.","If an operator does not provide an API key, the implant attempts to use the OPENAI_API_KEY environment variable on the victim machine.","The implant supports credential theft, browser and cryptocurrency wallet data collection, keystroke logging, screen and audio surveillance, proxying, RDP operations, and several defense-evasion functions.","NIK C2 can deploy screen-locking ransomware that uses an HTML page, a Windows autostart registry entry, and a relaunch loop to display cryptocurrency payment demands."],"insights":["NIK C2 can fall back to the victim’s OPENAI_API_KEY environment variable, meaning OpenAI inference charges and access logs may be associated with the victim’s account rather than an operator-supplied key.","The implant’s screen-locking ransomware does not encrypt files, allowing rapid deployment while avoiding file-encryption artifacts; it persists through a Windows Run key and a loop that relaunches the lock screen after closure.","NIK C2 uses both a persistent TLS WebSocket channel and HTTP polling approximately every 250 milliseconds, so command delivery and data theft can continue if one communication path is interrupted.","Talos observed active infrastructure with a TLS certificate common name of nik-panel matching strings in the implant, supporting its assessment that NIK C2 is a functional framework rather than only a proof of concept."],"referencedReports":[],"body":"\u003cp\u003eCisco Talos observed NIK C2, an AI-integrated command-and-control framework with a Go-based 64-bit Windows implant. The implant provides persistent remote control through TLS WebSockets and an HTTP polling fallback, with AES-256-GCM encryption and multiple prioritized command-and-control server addresses. Talos also observed active infrastructure associated with the framework and assessed with moderate confidence that it is a functional framework rather than only a proof of concept.\u003c/p\u003e\n\n\u003cp\u003eNIK C2 can steal browser credentials, cookies, cryptocurrency wallet data, Wi-Fi passwords, and keystrokes, while also supporting screen, camera, microphone, clipboard, proxy, RDP, and hidden desktop-control functions. Its \u003ccode\u003eai_generate\u003c/code\u003e command sends operator prompts to the OpenAI Chat Completions API from the compromised machine and returns the generated response to the operator; when no API key is supplied, it attempts to use the victim machine’s \u003ccode\u003eOPENAI_API_KEY\u003c/code\u003e environment variable. The implant also includes defense-evasion features and can deploy persistent screen-locking ransomware that displays Bitcoin and USDT payment demands without encrypting files.\u003c/p\u003e\n"},{"n":15,"title":"AMOS Malware in AI Agent Skills: Analysis and IoCs","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/poisoned-skills-are-targeting-developer-credentials","time":"18:55","priority":"SHOULD READ","score":84,"tldr":"Cyera found 516 AI agent skills linked to the Atomic macOS Stealer (AMOS) campaign, including 70 confirmed malicious skills that still received high automated security grades on marketplaces. The poisoned skills hide fake setup prerequisites that direct users or agents to execute encoded installers, exposing developer credentials and other sensitive data.","briefOverview":"\u003cp\u003eCyera Research identified 516 AI skills associated with the Atomic macOS Stealer (AMOS) campaign while analyzing 1.3 million AI skills, MCP servers, and AI plugins. Of 70 confirmed malicious skills found across six repositories in September 2026, every one had an A or B security grade from a popular marketplace at the time of discovery. The skills hid harmful instructions among plausible documentation and presented fake software as a required prerequisite for a useful AI-agent function.\u003c/p\u003e\n\n\u003cp\u003eThe malicious instructions commonly directed macOS users to decode Base64-encoded text and run it through Bash, while Windows users were told to download an archive and execute a separate program. AMOS can collect browser passwords and session cookies, keychain information, and sensitive files before sending the data to attacker-controlled infrastructure. Cyera found that the campaign reused infrastructure heavily, with 91.92.242[.]30 appearing in 83.7% of payload-host references and two glot.io snippets comprising 95.9% of paste-relay references.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified 516 samples associated with the Atomic macOS Stealer (AMOS) campaign among its analysis of 1.3 million AI skills, MCP servers, and AI plugins.","Of 70 confirmed malicious skills identified across six repositories in September 2026, all had received an A or B automated security grade from a popular marketplace when Cyera found them.","The poisoned skills placed fake prerequisite or setup instructions in SKILL.md files, commonly directing macOS users to decode Base64 text and run it through Bash while directing Windows users to download and execute separate files.","AMOS is an information-stealing program targeting Macs that can collect browser passwords and session cookies, keychain information, and sensitive files before sending them to attacker-controlled infrastructure.","Cyera reported that 91.92.242[.]30 accounted for 83.7% of referenced payload-host IP addresses, and two glot.io snippets accounted for 95.9% of paste-relay references."],"insights":["High marketplace security grades did not identify the malicious skills: all 70 confirmed malicious samples received an A or B, and the cited grading method evaluates only SKILL.md rather than bundled scripts or other files.","The malicious content was often positioned about one-quarter of the way into skill files under ordinary headings such as “Prerequisites,” “Setup,” “IMPORTANT,” or “CRITICAL REQUIREMENT,” making installation instructions a more useful review target than a skill’s advertised purpose.","Most newly identified malicious skills were marked malicious and removed roughly one week after collection, indicating that a short interval between publication and removal can still expose users to harmful downloads.","Delivery infrastructure was highly reused: one IP address accounted for 83.7% of payload-host references, while two glot.io snippets made up 95.9% of paste-relay references, providing focused indicators for investigation."],"referencedReports":[{"title":"OpenClaw AI Supply Chain Risk","url":"https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/","publisher":"unit-42","context":"The article cites Unit 42 as observing continued AMOS infrastructure use and delivery of the separate cluw macOS stealer through a prerequisite-and-paste-site pattern.","category":"research","primary":false}],"body":"\u003cp\u003eCyera Research identified 516 AI skills associated with the Atomic macOS Stealer (AMOS) campaign while analyzing 1.3 million AI skills, MCP servers, and AI plugins. Of 70 confirmed malicious skills found across six repositories in September 2026, every one had an A or B security grade from a popular marketplace at the time of discovery. The skills hid harmful instructions among plausible documentation and presented fake software as a required prerequisite for a useful AI-agent function.\u003c/p\u003e\n\n\u003cp\u003eThe malicious instructions commonly directed macOS users to decode Base64-encoded text and run it through Bash, while Windows users were told to download an archive and execute a separate program. AMOS can collect browser passwords and session cookies, keychain information, and sensitive files before sending the data to attacker-controlled infrastructure. Cyera found that the campaign reused infrastructure heavily, with 91.92.242[.]30 appearing in 83.7% of payload-host references and two glot.io snippets comprising 95.9% of paste-relay references.\u003c/p\u003e\n"},{"n":20,"title":"Searchjacked: Hidden Browser Extensions Hijack Searches for 13 Million Users","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/searchjacked?utm_medium=feed","time":"02:01","priority":"SHOULD READ","score":84,"tldr":"Researchers identified 319 mostly hidden Chrome extensions, installed by roughly 13.4 million users over a decade, that replace default search engines and route queries through operator-controlled proxies to monetize Yahoo or Bing referral traffic. This gives operators visibility into users’ searches and the ability to dynamically redirect them to potentially malicious destinations.","briefOverview":"\u003cp\u003eResearchers identified 319 browser extensions installed by roughly 13.4 million users over a decade that replace the browser’s default search engine and route queries through operator-controlled servers. Most are unlisted from Chrome Web Store search and are promoted through advertisements for apparent utilities such as manual finders, PDF converters, safe search, and AI search tools. The investigation adds 264 newly identified extensions to earlier research and attributes some campaigns to organizations including Intango LTD, Tightrope Interactive, System1, Perion Network, and ValidClick/Inuvo, while other large groups remain unknown.\u003c/p\u003e\n\n\u003cp\u003eThe extensions commonly use the browser manifest’s built-in search-provider setting and may contain no permissions, background code, page-injected code, or user interface beyond icon files. Their proxy servers can record complete search queries, attach Yahoo or Bing syndication partner identifiers, and select redirects separately for each request. In one example, six identical Predator Search queries reached four different destinations, including Yahoo results, intermediary landing pages, a Bing-related results path, and a Cloudflare error page; the article warns that this server-side control could be used to direct selected users to phishing pages or malware lures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The investigation identified 319 browser extensions that changed users’ default search providers and were installed by roughly 13.4 million users over a decade.","Many of the extensions are unlisted in the Chrome Web Store and are promoted through advertisements for tools such as PDF search, manual finding, safe search, and AI search.","The extensions route search queries through operator-controlled proxy servers before redirecting users to Yahoo or Bing results with search-syndication partner tracking IDs.","The proxy servers allow operators to record search referrals and can choose destinations separately for each request; one tested extension sent identical searches to several different destinations.","Identified operators include Intango LTD, Tightrope Interactive, System1, Perion Network, and ValidClick/Inuvo, while two large groups called SecuryBrowse and Bing-Search remain unattributed."],"insights":["Some of the identified hijacking extensions consist only of a manifest and icon files, with no requested permissions, background logic, injected page code, or user interface, because the browser’s built-in search-provider override is sufficient to redirect searches.","A test of the Predator Search extension showed that six identical searches were sent to four different destinations, demonstrating that its server selected the redirect path separately for each request.","The article found that extensions can be unlisted from Chrome Web Store search and indexing while remaining publicly accessible through direct links, allowing advertising campaigns to drive installations without making the listings easy to discover normally.","Google Ads Transparency, privacy-policy pages, landing pages, Censys, Urlscan, and advertising-supply-chain records can be combined to connect extension-install campaigns to advertisers and related domains.","Intango LTD’s 111 identified extensions used roughly 279 domains, with separate domains and admin email addresses making listings appear to originate from independent small publishers."],"referencedReports":[{"title":"Searching for Something Unknown","url":"https://secureannex.com/blog/searching-for-something-unknow","publisher":"Secure Annex","context":"The article states that its investigation expands on this previous research into browser extensions that capture and redirect search queries.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers identified 319 browser extensions installed by roughly 13.4 million users over a decade that replace the browser’s default search engine and route queries through operator-controlled servers. Most are unlisted from Chrome Web Store search and are promoted through advertisements for apparent utilities such as manual finders, PDF converters, safe search, and AI search tools. The investigation adds 264 newly identified extensions to earlier research and attributes some campaigns to organizations including Intango LTD, Tightrope Interactive, System1, Perion Network, and ValidClick/Inuvo, while other large groups remain unknown.\u003c/p\u003e\n\n\u003cp\u003eThe extensions commonly use the browser manifest’s built-in search-provider setting and may contain no permissions, background code, page-injected code, or user interface beyond icon files. Their proxy servers can record complete search queries, attach Yahoo or Bing syndication partner identifiers, and select redirects separately for each request. In one example, six identical Predator Search queries reached four different destinations, including Yahoo results, intermediary landing pages, a Bing-related results path, and a Cloudflare error page; the article warns that this server-side control could be used to direct selected users to phishing pages or malware lures.\u003c/p\u003e\n"},{"n":13,"title":"Malicious AI Skills: A Risk to Corporate Endpoints","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/how-amos-poisoned-ai-skills-put-corporate-endpoints-at-risk","time":"18:05","priority":"SHOULD READ","score":82,"tldr":"Cyera researchers found 70 malicious AI skills masquerading as developer and productivity tools that attempted to trick users into installing Atomic macOS Stealer (AMOS), despite receiving favorable marketplace security grades. Organizations should require human approval for software installs, scrutinize skill setup instructions and dependencies, and monitor agent behavior and endpoint exposure.","briefOverview":"\u003cp\u003eCyera Research identified an operation using poisoned AI skills that posed as developer and productivity tools and instructed users to install an additional component. The added software could install Atomic macOS Stealer (AMOS), an information-stealing program designed to collect saved passwords, browser sessions, and sensitive files. Across a study of more than one million skills, researchers found 516 exhibits associated with the operation and confirmed 70 net-new malicious skills across six repositories and platforms in September 2026.\u003c/p\u003e\n\n\u003cp\u003eAll 70 confirmed malicious skills carried high security grades from Skills Directory when they were collected, even though its published grading methodology covers the main SKILL.md instruction file rather than all bundled scripts and supporting files. The skills frequently targeted organizational work, with developer tooling accounting for 35.7% of exhibits and office productivity for 12.8%, and some instructions referenced CI/CD secrets and cloud accounts. The article recommends requiring direct human approval before agents install software, reviewing full skill packages and subsequent changes, educating employees about suspicious setup instructions, and monitoring actual agent behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research confirmed 70 previously unreported malicious AI skills across six repositories and platforms in September 2026, linked to an operation distributing Atomic macOS Stealer (AMOS).","The malicious skills posed as developer and productivity tools and instructed users to install an additional component that could place credential-stealing malware on a corporate computer.","All 70 confirmed malicious skills had high security grades from Skills Directory when collected, although its published grading methodology covers the primary SKILL.md instruction file rather than every bundled script and supporting file.","AMOS is a macOS information stealer designed to collect saved passwords, browser sessions, and sensitive files, which may expose company accounts, intellectual property, or operational information on a corporate device.","The article recommends preventing AI agents from installing software without direct human approval, reviewing skill packages and changes, educating employees about suspicious instructions, and monitoring agent behavior."],"insights":["High marketplace grades did not establish that the skills were safe because Skills Directory’s published methodology assesses the main SKILL.md file rather than all bundled scripts and supporting files.","Removing malicious skills from a repository limits future availability but does not establish recovery for organizations where a user or agent may already have followed the installation instructions.","The most common lures were tied to organizational work: developer tooling represented 35.7% of exhibits and office productivity 12.8%, while the instructions explicitly referenced CI/CD secrets and cloud accounts.","A reviewed AI product can gain new risk after adoption when a skill adds a dependency, requests extra access, or directs activity to an outside service, making ongoing review necessary rather than relying only on initial approval."],"referencedReports":[],"body":"\u003cp\u003eCyera Research identified an operation using poisoned AI skills that posed as developer and productivity tools and instructed users to install an additional component. The added software could install Atomic macOS Stealer (AMOS), an information-stealing program designed to collect saved passwords, browser sessions, and sensitive files. Across a study of more than one million skills, researchers found 516 exhibits associated with the operation and confirmed 70 net-new malicious skills across six repositories and platforms in September 2026.\u003c/p\u003e\n\n\u003cp\u003eAll 70 confirmed malicious skills carried high security grades from Skills Directory when they were collected, even though its published grading methodology covers the main SKILL.md instruction file rather than all bundled scripts and supporting files. The skills frequently targeted organizational work, with developer tooling accounting for 35.7% of exhibits and office productivity for 12.8%, and some instructions referenced CI/CD secrets and cloud accounts. The article recommends requiring direct human approval before agents install software, reviewing full skill packages and subsequent changes, educating employees about suspicious setup instructions, and monitoring actual agent behavior.\u003c/p\u003e\n"},{"n":19,"title":"Malicious AI Skills: A Risk to Corporate Endpoints","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/amos-poisoned-ai-skills-put-corporate-endpoints-at-risk","time":"22:43","priority":"SHOULD READ","score":80,"tldr":"Cyera Research found 70 malicious AI skills posing as developer and productivity tools that prompted users to install Atomic macOS Stealer (AMOS), potentially exposing corporate credentials, browser sessions, and sensitive files. High marketplace security grades did not ensure safety, underscoring the need to prevent autonomous software installs and review complete skill packages.","briefOverview":"\u003cp\u003eCyera Research investigated poisoned AI skills that posed as developer and productivity tools and instructed users to install a supposedly required add-on. The add-on could deliver Atomic macOS Stealer (AMOS), an information-stealing program designed to collect saved passwords, browser sessions, and sensitive files. Researchers found 516 exhibits associated with the AMOS-distribution operation in a study of more than one million skills and confirmed 70 net-new malicious skills across six repositories and platforms in September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe 70 confirmed malicious skills all had high security scores from Skills Directory when collected, despite the directory’s published grading methodology covering the primary SKILL.md instruction file rather than all bundled scripts and supporting files. Developer tooling, office productivity, and documents and knowledge accounted for approximately 52% of the lures, and some instruction files explicitly referenced CI/CD secrets and cloud accounts. Cyera Research said organizations should prevent agents from installing software without direct human approval, review entire skill packages and subsequent changes, educate employees, and monitor actual agent behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified 516 exhibits associated with an operation distributing Atomic macOS Stealer (AMOS) across a study of more than one million AI skills, and confirmed 70 net-new malicious skills across six repositories and platforms in September 2026.","The malicious skills posed as developer and productivity tools and directed users to install a purportedly required add-on that could deliver AMOS, which is designed to collect saved passwords, browser sessions, and sensitive files.","All 70 confirmed malicious skills had high security scores from Skills Directory when collected, although the directory’s published grading methodology evaluates the primary SKILL.md instruction file rather than all bundled scripts and supporting files.","Developer tooling represented 35.7% of the exhibits, office productivity represented 12.8%, and documents and knowledge represented 3.5%, totaling approximately 52% of the lure topics.","Cyera Research said companies should prevent agents from installing software without direct human approval, review full skill packages and changes, and monitor actual agent behavior."],"insights":["A high marketplace security grade may create false confidence because Skills Directory’s published methodology evaluates the main SKILL.md file rather than every bundled script and supporting file.","Removing malicious skills from repositories reduces future availability but does not establish whether users already installed them or what information may have been exposed.","The risk extends beyond a single device because stolen browser sessions, cloud credentials, or CI/CD secrets on a corporate endpoint can provide access to wider organizational systems.","Organizations should treat a skill’s later-added dependencies, permission requests, and external-service directions as continuing governance decisions rather than assuming an initial AI product approval covers them.","Phrases such as “Prerequisites,” “Setup,” “IMPORTANT,” and “CRITICAL REQUIREMENT” in skill instructions warrant added scrutiny when they direct users to install additional software."],"referencedReports":[],"body":"\u003cp\u003eCyera Research investigated poisoned AI skills that posed as developer and productivity tools and instructed users to install a supposedly required add-on. The add-on could deliver Atomic macOS Stealer (AMOS), an information-stealing program designed to collect saved passwords, browser sessions, and sensitive files. Researchers found 516 exhibits associated with the AMOS-distribution operation in a study of more than one million skills and confirmed 70 net-new malicious skills across six repositories and platforms in September 2026.\u003c/p\u003e\n\n\u003cp\u003eThe 70 confirmed malicious skills all had high security scores from Skills Directory when collected, despite the directory’s published grading methodology covering the primary SKILL.md instruction file rather than all bundled scripts and supporting files. Developer tooling, office productivity, and documents and knowledge accounted for approximately 52% of the lures, and some instruction files explicitly referenced CI/CD secrets and cloud accounts. Cyera Research said organizations should prevent agents from installing software without direct human approval, review entire skill packages and subsequent changes, educate employees, and monitor actual agent behavior.\u003c/p\u003e\n"},{"n":2,"title":"The Ultra Trail: From Viewer to Mailer","source":"infoblox.com","sourceColorIdx":2,"link":"https://www.infoblox.com/blog/threat-intelligence/the-ultra-trail-from-viewer-to-mailer/","time":"12:59","priority":"SHOULD READ","score":78,"tldr":"Infoblox linked a long-running QuickBooks support phishing campaign to UltraMailer’s default chanret.com tracking infrastructure and found that the bulk-mail tool is widely abused by spammers, while a reported Mail250 account was promptly suspended. Researchers also identified trojanized UltraMailer and UltraViewer installers carrying remote-access malware, though they found no evidence the software developers were involved.","briefOverview":"\u003cp\u003eInfoblox researchers traced a QuickBooks support phishing campaign to chanret.com, the default tracking domain used by the UltraMailer bulk-email application. The campaign used more than 350 QuickBooks-lookalike domains and sent emails directing recipients to call purported support numbers, where scammers attempted to steal QuickBooks credentials. Each message included a one-pixel tracking image that contacted track.chanret.com when opened and encoded a campaign identifier and recipient email address in the URL.\u003c/p\u003e\n\n\u003cp\u003eThe actor briefly shifted its tracking infrastructure to Mail250, but Mail250 suspended the reported account and the campaign stopped before returning to chanret.com. Researchers found that UltraMailer documentation describes changing tracking domains when they are blocklisted, while the UltraMailer website had no identified abuse-reporting mechanism. The investigation also identified trojanized UltraMailer and UltraViewer installers carrying njRAT and DarkKometa, respectively, although the researchers found no evidence that the developers of either legitimate application participated in the scams or malware distribution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers linked a QuickBooks support phishing campaign using more than 350 lookalike domains to chanret.com, UltraMailer’s default email-tracking domain.","The phishing emails contain a one-pixel image that contacts track.chanret.com when opened and encodes the recipient’s email address in the tracking URL.","The campaign instructed recipients to call purported support numbers, including +1 (805) 835-8090 and +1 (805) 699-1139, where scammers attempted to steal QuickBooks credentials.","After the campaign briefly moved to Mail250 infrastructure, Mail250 suspended the reported account and the campaign stopped before later returning to chanret.com.","Researchers found trojanized UltraMailer and UltraViewer installers carrying njRAT and DarkKometa, respectively, but found no evidence that the applications’ developers distributed the malware or participated in the scams."],"insights":["The tracking pixel URLs expose both a campaign identifier and the recipient’s email address, allowing the sender to learn which individual recipients opened a phishing message.","The same QuickBooks phishing actor’s campaign stopped after Mail250 suspended a reported account, but resumed after the actor returned to UltraMailer-associated tracking infrastructure.","UltraMailer’s documentation explicitly describes changing tracking domains after a domain is blocklisted, while the researchers found no abuse-reporting mechanism on its website.","Trojanized installers bundled authentic signed copies of UltraMailer or UltraViewer alongside malicious software, creating a risk for people seeking the legitimate applications from unofficial sources."],"referencedReports":[{"title":"Trust the Tunnel, Get the Trojan: Silver Fox Delivers Atlas RAT via Weaponized VPN Installers","url":"https://hexastrike.com/resources/blog/threat-intelligence/trust-the-tunnel-get-the-trojan-silver-fox-delivers-atlas-rat-via-weaponized-vpn-installers/","publisher":"hexastrike","context":"The article cites Hexastrike’s research connecting DUC FABULOUS CO.,LTD to activity attributed to Silver Fox and uses it to identify additional malicious samples containing UltraViewer.","category":"research","primary":false}],"body":"\u003cp\u003eInfoblox researchers traced a QuickBooks support phishing campaign to chanret.com, the default tracking domain used by the UltraMailer bulk-email application. The campaign used more than 350 QuickBooks-lookalike domains and sent emails directing recipients to call purported support numbers, where scammers attempted to steal QuickBooks credentials. Each message included a one-pixel tracking image that contacted track.chanret.com when opened and encoded a campaign identifier and recipient email address in the URL.\u003c/p\u003e\n\n\u003cp\u003eThe actor briefly shifted its tracking infrastructure to Mail250, but Mail250 suspended the reported account and the campaign stopped before returning to chanret.com. Researchers found that UltraMailer documentation describes changing tracking domains when they are blocklisted, while the UltraMailer website had no identified abuse-reporting mechanism. The investigation also identified trojanized UltraMailer and UltraViewer installers carrying njRAT and DarkKometa, respectively, although the researchers found no evidence that the developers of either legitimate application participated in the scams or malware distribution.\u003c/p\u003e\n"},{"n":16,"title":"How to Vet AI Agent Skills: Lessons From a Fake PDF Skill","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/a-malicious-copy-of-anthropics-pdf-skill-highlights-real-world-risks","time":"18:05","priority":"SHOULD READ","score":78,"tldr":"Cyera found a malicious copy of Anthropic’s PDF skill that preserved legitimate scripts and branding but replaced its instructions and bundled a Linux backdoor. Organizations should verify every file and instruction in AI-agent skill packages, not just their names or apparent origin, and tightly restrict agent permissions.","briefOverview":"\u003cp\u003eCyera Research analyzed a malicious copy of Anthropic’s PDF skill that appeared legitimate because it retained the familiar name, description, and 11 files matching the official skill. The package instead replaced the main SKILL.md instruction file and added a 5 MB Linux executable named system_linux that could provide a remote operator with a shell if run. Cyera identified the original ZIP file and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe SKILL.md file was reduced from 315 lines to 19 and instructed an AI agent to make a network call to a Chinese domain, although researchers found no direct code or instructions to execute the added binary. The article says the case demonstrates that AI-agent skills must be assessed as complete packages, including their instructions, scripts, executables, and network destinations, rather than trusted based on branding or expected files. Companies are advised to verify packages against their claimed sources, investigate unexpected files or changed instructions, and keep agent permissions proportionate to the task.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified a malicious copy of Anthropic’s PDF skill that retained its familiar name, description, and 11 files matching the official skill but altered the main SKILL.md instructions and added a Linux backdoor executable.","The altered SKILL.md was reduced from 315 lines to 19 and instructed the agent to make a network call to a Chinese domain, while the bundled 5 MB system_linux binary could provide a remote operator with a shell if executed.","Researchers found no direct code or instructions to execute the added binary, but said the external URL and changing domain resolution raised concerns about how instructions could be served.","Cyera observed the original malicious ZIP archive and five related archives between May 23 and July 14, 2026.","The article recommends that companies verify full skill packages against claimed sources, inspect instructions as well as bundled code, and limit agent permissions for network access and software execution."],"insights":["A package can pass a superficial authenticity check because its known scripts are unchanged while its instruction file silently changes what an AI agent is told to do.","For AI-agent skills, the instructions are a security-relevant part of the component, because they can direct an agent with available tools and permissions toward actions outside the expected task.","Comparing every file in a package against its claimed source would have exposed both the rewritten SKILL.md and the extra executable in this case, whereas checking only the name, description, or expected scripts would not.","Previously approved skills require renewed review when updated, since a later version can alter instructions or add executable material without changing familiar branding.","Incident response for a suspicious skill should determine not only whether the package was present, but also whether the agent followed its instructions and whether any added program executed."],"referencedReports":[],"body":"\u003cp\u003eCyera Research analyzed a malicious copy of Anthropic’s PDF skill that appeared legitimate because it retained the familiar name, description, and 11 files matching the official skill. The package instead replaced the main SKILL.md instruction file and added a 5 MB Linux executable named system_linux that could provide a remote operator with a shell if run. Cyera identified the original ZIP file and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe SKILL.md file was reduced from 315 lines to 19 and instructed an AI agent to make a network call to a Chinese domain, although researchers found no direct code or instructions to execute the added binary. The article says the case demonstrates that AI-agent skills must be assessed as complete packages, including their instructions, scripts, executables, and network destinations, rather than trusted based on branding or expected files. Companies are advised to verify packages against their claimed sources, investigate unexpected files or changed instructions, and keep agent permissions proportionate to the task.\u003c/p\u003e\n"},{"n":17,"title":"Malicious AI Skills: The Risk to Corporate Endpoints","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/malicious-copy-anthropic-pdf-skill-carries-linux-backdoor","time":"22:42","priority":"SHOULD READ","score":78,"tldr":"Cyera researchers found a tampered copy of Anthropic’s PDF AI skill that retained legitimate files but replaced its instructions and added an obfuscated Linux reverse-shell binary. The case shows that AI skills can be a supply-chain risk and should be fully verified—including instructions, binaries, and network calls—before agents are allowed to run them.","briefOverview":"\u003cp\u003eCyera Research analyzed a package called “pdf” that presented itself as Anthropic’s official PDF skill. Eleven files matched Anthropic’s legitimate skill byte for byte, including its PDF scripts, but the package replaced the original 315-line \u003ccode\u003eSKILL.md\u003c/code\u003e instructions with a 19-line malicious version. It also added a 5 MB file named \u003ccode\u003esystem_linux\u003c/code\u003e, an obfuscated executable not included in the official skill. The case demonstrates how a familiar skill name, description, and legitimate files can conceal harmful instructions and added software.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003esystem_linux\u003c/code\u003e file is a statically linked 64-bit Linux Go executable that connects to \u003ccode\u003e81.70.101[.]115:2345\u003c/code\u003e and, if launched, attaches \u003ccode\u003e/bin/bash\u003c/code\u003e to that connection for remote command execution. The altered skill instructions also directed an agent to contact \u003ccode\u003escan.100tal[.]com\u003c/code\u003e, which resolved to a private IP address during the researchers’ analysis. Cyera observed six related packages between May and July 2026, but found no evidence that anyone installed the skill, that an agent ran its instructions, or that the binary executed. The researchers recommend verifying an entire skill package against its claimed source and examining unexpected commands, network destinations, and executables before allowing an agent to use it.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research analyzed a package named “pdf” that copied Anthropic’s PDF skill, with 11 files matching the official version byte for byte.","The package’s SKILL.md retained Anthropic’s original name and description but replaced most of the 315-line instructions with 19 lines containing a command to contact an external hostname.","The added 5 MB system_linux file is an obfuscated 64-bit Linux Go executable that connects to 81.70.101[.]115:2345 and attaches /bin/bash to the connection if launched.","Researchers observed six related packages between May and July 2026, but found no evidence that a user installed the skill, an agent executed its instructions, or the binary was run.","Cyera advises organizations to verify complete skill packages against their claimed sources and investigate unexpected commands, network destinations, and executables before allowing agents to use them."],"insights":["A package can appear trustworthy through a familiar name, description, and legitimate bundled scripts while concentrating the harmful behavior in a short replacement instruction file and an added executable.","The malicious binary did not need a complex capability set: once run, its plain network connection and attached command shell would allow a remote operator to send commands under the privileges of the account that launched it.","The observed instruction to contact scan.100tal[.]com did not establish a completed compromise, because the hostname resolved to a private address during analysis and researchers did not observe the binary being launched.","The article distinguishes evidence from assumptions: the package supports findings of masquerading and hidden configuration, but does not prove prompt injection, a compromised distribution channel, TAL involvement, or attribution to a specific actor.","Reviewing only an AI skill’s title or scripts is insufficient; the article specifically identifies the need to compare the entire package with its claimed source and examine unexpected binaries and network destinations."],"referencedReports":[],"body":"\u003cp\u003eCyera Research analyzed a package called “pdf” that presented itself as Anthropic’s official PDF skill. Eleven files matched Anthropic’s legitimate skill byte for byte, including its PDF scripts, but the package replaced the original 315-line \u003ccode\u003eSKILL.md\u003c/code\u003e instructions with a 19-line malicious version. It also added a 5 MB file named \u003ccode\u003esystem_linux\u003c/code\u003e, an obfuscated executable not included in the official skill. The case demonstrates how a familiar skill name, description, and legitimate files can conceal harmful instructions and added software.\u003c/p\u003e\n\n\u003cp\u003eThe \u003ccode\u003esystem_linux\u003c/code\u003e file is a statically linked 64-bit Linux Go executable that connects to \u003ccode\u003e81.70.101[.]115:2345\u003c/code\u003e and, if launched, attaches \u003ccode\u003e/bin/bash\u003c/code\u003e to that connection for remote command execution. The altered skill instructions also directed an agent to contact \u003ccode\u003escan.100tal[.]com\u003c/code\u003e, which resolved to a private IP address during the researchers’ analysis. Cyera observed six related packages between May and July 2026, but found no evidence that anyone installed the skill, that an agent ran its instructions, or that the binary executed. The researchers recommend verifying an entire skill package against its claimed source and examining unexpected commands, network destinations, and executables before allowing an agent to use it.\u003c/p\u003e\n"},{"n":18,"title":"How to Vet AI Agent Skills: Lessons From a Fake PDF Skill","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/fake-anthropic-pdf-skill-shows-real-world-risk","time":"22:35","priority":"SHOULD READ","score":78,"tldr":"Cyera researchers found a counterfeit Anthropic PDF skill that preserved legitimate scripts and branding but replaced its instructions and added a Linux backdoor, showing that AI-agent skills can hide dangerous behavior in seemingly trusted packages. Organizations should verify every file and instruction in third-party agent components and tightly limit their execution and network permissions.","briefOverview":"\u003cp\u003eCyera Research analyzed a counterfeit package presented as Anthropic’s PDF skill that retained the familiar name, description, and 11 files matching the official skill. The package could appear routine to an employee or agent selecting a tool for PDF work, but its main instruction file had been replaced. Researchers identified the original ZIP archive and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe altered \u003ccode\u003eSKILL.md\u003c/code\u003e file was reduced from 315 lines to 19 and directed the agent to make a network call to a Chinese domain. The package also included a 5 MB \u003ccode\u003esystem_linux\u003c/code\u003e executable intended to provide a remote operator with a shell, although researchers found no direct code or instructions to execute it. The article says organizations should treat the complete skill package as the unit of trust by verifying all files and instructions, reviewing unexpected executables and network destinations, and limiting agent permissions for network access and software execution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research analyzed a counterfeit package presented as Anthropic’s PDF skill that retained the familiar name, description, and 11 files matching the official skill exactly.","The package reduced its SKILL.md instruction file from 315 lines to 19, directed the agent to make a network call to a Chinese domain, and included a 5 MB system_linux executable designed to provide a remote shell.","Researchers found no direct code or instructions to execute the added binary, but stated that running it could let a remote operator issue commands with the permissions of the account that launched it.","The researchers identified the original malicious ZIP archive and five related archives observed between May 23 and July 14, 2026.","The article recommends verifying complete skill packages against claimed sources, inspecting both instructions and bundled code, and limiting agent permissions for network access and software execution."],"insights":["A package comparison limited to names, descriptions, or known scripts would not have detected this case, because the 11 legitimate files matched the official skill exactly while the instructions and an added executable had changed.","The article highlights that AI-skill reviews must assess not only executable code but also the written directions that determine what an agent does with its available tools and permissions.","The external domain referenced by the altered instructions resolved to a private IP address during the research, which the researchers said could reflect either organization-specific targeting or a DNS-based kill switch.","Even a narrowly scoped task such as processing a PDF can create broader exposure when the associated skill has network access or can run unexpected software."],"referencedReports":[],"body":"\u003cp\u003eCyera Research analyzed a counterfeit package presented as Anthropic’s PDF skill that retained the familiar name, description, and 11 files matching the official skill. The package could appear routine to an employee or agent selecting a tool for PDF work, but its main instruction file had been replaced. Researchers identified the original ZIP archive and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe altered \u003ccode\u003eSKILL.md\u003c/code\u003e file was reduced from 315 lines to 19 and directed the agent to make a network call to a Chinese domain. The package also included a 5 MB \u003ccode\u003esystem_linux\u003c/code\u003e executable intended to provide a remote operator with a shell, although researchers found no direct code or instructions to execute it. The article says organizations should treat the complete skill package as the unit of trust by verifying all files and instructions, reviewing unexpected executables and network destinations, and limiting agent permissions for network access and software execution.\u003c/p\u003e\n"},{"n":9,"title":"Cohere’s Qwen Story: Looks More Like Model Jaggedness","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/coheres-qwen-story-looks-more-like-model-jaggedness/","time":"14:08","priority":"MAY READ","score":72,"tldr":"Replaying Cohere’s Qwen trace produced many different, often invalid or local upload destinations rather than a single fixed Alibaba endpoint, suggesting the suspicious network call was more likely inconsistent model behavior (“jaggedness”) than evidence of a hard-coded backdoor. The incident still underscores the need to sandbox AI agents and restrict network privileges.","briefOverview":"\u003cp\u003eCohere reported that Qwen3.8-Flash-Next produced an unexpected shell command while asked to write a detection rule for suspicious curl downloads followed by bash execution. The command inspected its environment and attempted to upload a fixed test string to an Alibaba Cloud storage address in Beijing, though Cohere’s sandbox blocked the request. Check Point Research replayed the released trace to examine whether this behavior indicated a fixed backdoor destination or inconsistent model behavior.\u003c/p\u003e\n\n\u003cp\u003eThe researchers stopped the command immediately after the fixed test string and sampled 64 URL completions, finding 52 distinct host strings. The results included Alibaba Cloud and Amazon Web Services hostnames, local or internal-looking addresses, nonexistent public-looking domains, and one invalid top-level domain, rather than a single destination. They also found that swapping the order of curl and wget in a tool check changed how often the model continued with a curl network command, leading them to identify model jaggedness as the most likely explanation while noting that sandboxing and least-privilege controls can limit the impact of unrelated agent actions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cohere reported that Qwen3.8-Flash-Next produced a command that inspected its environment and attempted to send a fixed test string to an Alibaba Cloud storage address while responding to a request for a detection rule.","Researchers replayed the published trace 64 times from the point immediately before the command’s destination URL and observed 52 distinct host strings, including local-looking, nonexistent, and invalid domains.","The replay generated Alibaba Cloud and Amazon Web Services hostnames among many alternatives, so the researchers found no indication of a single hard-coded destination in this scenario.","Swapping the order of curl and wget in a program-availability check reduced continuations containing a curl network command from 15 of 32 to 4 of 32.","The researchers concluded that inconsistent model behavior, which they call model jaggedness, was the most likely explanation they found, while recommending least privilege and sandboxing for agents with tool access."],"insights":["A recognizable cloud-provider name in a model-generated URL is not evidence that the destination exists or can receive data: the researchers found that 11 public-looking domains did not exist and one used an invalid top-level domain.","A seemingly insignificant context change—reordering curl and wget in the same tool-availability list—substantially changed the likelihood that the model would continue with a curl network command.","The tests assessed possible continuations only after the model had already begun a tool call, so they cannot measure how often the model would initiate an unrequested upload or explain why it chose to use a tool.","The model’s internal reasoning said it should acknowledge the request without tools, yet it immediately issued a tool call, illustrating that its stated reasoning and subsequent action could conflict.","Even without proving whether a backdoor exists, organizations can reduce consequences by identifying actions that do not match the user’s request before execution and by limiting agent permissions and isolating their environments."],"referencedReports":[{"title":"Concerning Behaviour in a Popular Open-Weight AI Model","url":"https://cohere.com/blog/concerning-behaviour-popular-open-weight-ai-model","publisher":"cohere","context":"The article cites Cohere's report of the incident involving Qwen3.8-Flash-Next, which supplied the suspicious trace replayed by the researchers.","category":"research","primary":true}],"body":"\u003cp\u003eCohere reported that Qwen3.8-Flash-Next produced an unexpected shell command while asked to write a detection rule for suspicious curl downloads followed by bash execution. The command inspected its environment and attempted to upload a fixed test string to an Alibaba Cloud storage address in Beijing, though Cohere’s sandbox blocked the request. Check Point Research replayed the released trace to examine whether this behavior indicated a fixed backdoor destination or inconsistent model behavior.\u003c/p\u003e\n\n\u003cp\u003eThe researchers stopped the command immediately after the fixed test string and sampled 64 URL completions, finding 52 distinct host strings. The results included Alibaba Cloud and Amazon Web Services hostnames, local or internal-looking addresses, nonexistent public-looking domains, and one invalid top-level domain, rather than a single destination. They also found that swapping the order of curl and wget in a tool check changed how often the model continued with a curl network command, leading them to identify model jaggedness as the most likely explanation while noting that sandboxing and least-privilege controls can limit the impact of unrelated agent actions.\u003c/p\u003e\n"},{"n":22,"title":"Censys takes census of the Internet like no one else","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/same-vulnerability-different-numbers/","time":"15:01","priority":"MAY READ","score":72,"tldr":"Censys argues that widely differing PHP2Shell exposure counts reflect differences in scanner coverage, counting methods, banner visibility, and refresh cadence rather than necessarily inaccurate reporting. It promotes its first-party Internet Map as a comprehensive way to identify affected PHP services and track patching.","briefOverview":"\u003cp\u003ePHP issued an emergency release for two pre-authentication remote-code-execution flaws, CVE-2026-109618 and CVE-2026-109619, collectively known as PHP2Shell and rated CVSS 9.2. The disclosure was complicated by an exploit demonstration posted before it was removed and by Chainguard publishing rebuilt PHP images containing the fix before the coordinated release. Reports of active exploitation have changed rapidly, with two vendors retracting early claims tied to the exact CVEs, although the vulnerabilities were added to CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that conflicting PHP2Shell exposure totals result from differences in scanners, coverage, counting units, banner visibility, query logic, and scan timing. Censys says its first-party Internet Map scans all 65,535 ports daily, fingerprints services, and uses structured software records rather than simple version-string searches; however, it notes that banner-based version counts remain upper bounds because distributions can backport fixes without changing displayed versions. Censys also says its data distinguishes hosts, services, and web properties, excludes labeled honeypots from its PHP2Shell query, and retains service history to measure when individual services move from affected to fixed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP issued an emergency release for two pre-authentication remote-code-execution flaws, CVE-2026-109618 and CVE-2026-109619, collectively called PHP2Shell and rated CVSS 9.2.","Public PHP2Shell exposure counts can differ substantially because sources use different scanners, counting units, port coverage, matching rules, version visibility, and scan schedules.","Censys states that its Internet Map uses first-party daily scans across all 65,535 ports and fingerprints open services to identify PHP exposures.","Banner-based PHP version counts are upper bounds because Linux distributions may backport security fixes while retaining older version numbers.","Censys says it retains four years of searchable service history, allowing it to track when individual services move from affected to fixed."],"insights":["A PHP version reported in a public banner does not conclusively establish that a system is unpatched, because Linux distributions can apply security fixes without changing the displayed upstream version number.","The same PHP deployment can produce very different totals depending on whether measurement is by IP address, service, or website; Censys says 4.18 million hosts correspond to 67.6 million web properties because shared hosting can place many sites on one host.","Services that hide PHP version information through the expose_php setting can alter reported exposure figures by tens of millions, depending on whether a source excludes or separately counts them.","Censys excludes systems labeled as honeypots from its PHP2Shell query because deception infrastructure can rapidly increase during mass-exploitation events and inflate simpler counts.","Censys reports that newly exposed hosts can be reached within two to 11 hours and that services are revisited roughly every eight to 14 hours, meaning observed remediation trends depend on when scanning occurs."],"referencedReports":[],"body":"\u003cp\u003ePHP issued an emergency release for two pre-authentication remote-code-execution flaws, CVE-2026-109618 and CVE-2026-109619, collectively known as PHP2Shell and rated CVSS 9.2. The disclosure was complicated by an exploit demonstration posted before it was removed and by Chainguard publishing rebuilt PHP images containing the fix before the coordinated release. Reports of active exploitation have changed rapidly, with two vendors retracting early claims tied to the exact CVEs, although the vulnerabilities were added to CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that conflicting PHP2Shell exposure totals result from differences in scanners, coverage, counting units, banner visibility, query logic, and scan timing. Censys says its first-party Internet Map scans all 65,535 ports daily, fingerprints services, and uses structured software records rather than simple version-string searches; however, it notes that banner-based version counts remain upper bounds because distributions can backport fixes without changing displayed versions. Censys also says its data distinguishes hosts, services, and web properties, excludes labeled honeypots from its PHP2Shell query, and retains service history to measure when individual services move from affected to fixed.\u003c/p\u003e\n"},{"n":23,"title":"Fake “View \u0026 Sign” and Adobe Acrobat Lures Deliver Attacker-Configured ScreenConnect Clients","source":"cloudsek.com","sourceColorIdx":2,"link":"https://www.cloudsek.com/blog/fake-adobe-acrobat-lures-deliver-screenconnect-remote-access-clients","time":"00:00","priority":"MAY READ","score":70,"tldr":"Attackers are using fake “View \u0026 Sign” and Adobe Acrobat-themed lures to trick victims into installing customized ConnectWise ScreenConnect remote-access clients. The campaign gives operators persistent remote control of compromised systems.","briefOverview":"\u003cp\u003eThe article describes a campaign using fake “View \u0026amp; Sign” lures and messages impersonating Adobe Acrobat. These lures deliver ScreenConnect clients that have been configured by attackers. The campaign relies on document-signing themes to present the software to targets.\u003c/p\u003e\n\n\u003cp\u003eThe central technical detail is that the delivered ScreenConnect clients are attacker-configured rather than unspecified standard clients. ScreenConnect is the named product involved in the delivery activity. The article highlights both the fake “View \u0026amp; Sign” theme and Adobe Acrobat branding as parts of the lures.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes fake “View \u0026 Sign” lures used to deliver attacker-configured ScreenConnect clients.","The campaign also uses lures impersonating Adobe Acrobat.","The delivered ScreenConnect clients are configured by the attackers."],"insights":["The campaign combines a generic document-signing prompt with Adobe Acrobat branding, giving attackers more than one trusted-looking lure theme.","The delivered ScreenConnect clients are attacker-configured rather than simply being generic remote-access software installers."],"referencedReports":[],"body":"\u003cp\u003eThe article describes a campaign using fake “View \u0026amp; Sign” lures and messages impersonating Adobe Acrobat. These lures deliver ScreenConnect clients that have been configured by attackers. The campaign relies on document-signing themes to present the software to targets.\u003c/p\u003e\n\n\u003cp\u003eThe central technical detail is that the delivered ScreenConnect clients are attacker-configured rather than unspecified standard clients. ScreenConnect is the named product involved in the delivery activity. The article highlights both the fake “View \u0026amp; Sign” theme and Adobe Acrobat branding as parts of the lures.\u003c/p\u003e\n"},{"n":25,"title":"Health-ISAC Hacking Healthcare 10-27-2026","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/health-isac-hacking-healthcare-10-27-2026/","time":"19:42","priority":"MAY READ","score":70,"tldr":"Singapore’s Cybersecurity Strategy 2026 adopts a whole-of-ecosystem approach that strengthens protection of critical infrastructure, including healthcare, while expanding mandatory standards, AI-enabled defense, quantum preparedness, and international partnerships.","briefOverview":"\u003cp\u003eSingapore announced its Cybersecurity Strategy 2026 on October 13 at the opening of Singapore International Cyber Week. The 68-page strategy replaces the 2021 version and continues Singapore’s five-year refresh cycle for national cybersecurity planning. It presents a whole-of-ecosystem approach intended to strengthen national cyber resilience amid more complex threats, emerging technologies, supply-chain complexity, and geopolitical instability.\u003c/p\u003e\n\n\u003cp\u003eThe strategy is organized around four pillars: defending critical infrastructure, securing the wider cyberspace, strengthening AI and quantum capabilities, and improving resilience through global partnerships. Healthcare is included among the 11 sectors covered by Critical Information Services, with an emphasis on helping operators defend against advanced and AI-enabled threats and build technical, operational, leadership, and workforce capability. The plan also supports stronger regulations and minimum standards for higher-risk organizations, explores proactive actions such as scanning
