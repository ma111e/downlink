<script type="application/json" id="dl-articles">[{"n":4,"title":"Hackers Exploit Critical ScreenConnect Flaw to Hijack MSP Technician PCs Without Warning","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-exploit-critical-screenconnect.html","time":"12:41","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting the critical ConnectWise ScreenConnect flaw CVE-2026-84869 to silently push and execute malicious files on MSP technicians’ workstations, enabling remote takeover and access to customer environments. Organizations should update ScreenConnect host clients to version 26.6.5 or later and investigate potentially exposed technician systems.","briefOverview":"\u003cp\u003eThreat actors are exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect client flaw rated 9.9, to target managed service provider (MSP) technician workstations. The flaw enables a guest in a remote session to send and run a malicious file on the connecting technician’s computer without a prompt appearing. Huntress observed one such compromise execute a guest-pushed batch file, contact a Telegram bot, download a fake Windows update installer, and launch a rogue ScreenConnect client in about nine seconds.\u003c/p\u003e\n\n\u003cp\u003eHuntress recorded at least 688,000 guest “run file” requests across 42 ScreenConnect servers from 29 IP addresses between October 20 and November 16, 2026. Attackers also used harmless marker files to check whether the technique worked before sending a payload, while another activity cluster registered thousands of fake guest sessions with cryptocurrency exchange-themed names. A compromised technician workstation is especially valuable because it can contain remote-management consoles, saved credentials, and access to many customer environments. Organizations are advised to update ScreenConnect host clients to version 26.6.5 or later, investigate affected systems, and remove the TransferFiles permission if they cannot patch immediately.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect client flaw with a CVSS score of 9.9, to transfer and execute files on a connecting technician’s host.","Huntress observed an MSP technician workstation run a guest-pushed batch file that contacted a Telegram bot, downloaded a Windows-update-themed MSI installer, and launched a rogue ScreenConnect client within about nine seconds.","Between October 20 and November 16, 2026, Huntress recorded at least 688,000 guest “run file” requests targeting 42 ScreenConnect servers from 29 IP addresses.","Huntress also identified 2,408 unauthorized ScreenConnect guest sessions across at least 118 self-hosted servers belonging to 109 protected organizations, with many using cryptocurrency exchange-themed names.","Organizations are advised to update technician ScreenConnect host clients to version 26.6.5 or later, or remove the TransferFiles permission if patching cannot occur immediately."],"insights":["The flaw can be triggered simply by a technician joining a remote session, with no warning or approval prompt shown before the malicious file is run on the technician’s computer.","Attackers used a harmless file named marker.txt seconds after a technician connected as a canary test, allowing them to verify that the technique worked before delivering a harmful payload.","Some attackers created fake ScreenConnect guest sessions with cryptocurrency exchange-themed computer names to entice technicians to connect, even when no later file transfer or command activity was observed.","Because technician workstations may contain remote-management tools and saved credentials for many customers, compromising one technician can provide access well beyond a single affected computer.","If organizations cannot immediately update ScreenConnect, removing the TransferFiles permission from relevant roles and session groups is a documented interim mitigation."],"referencedReports":[{"title":"CVE-2026-84869 ScreenConnect Technician Exploitation","url":"https://www.huntress.com/blog/cve-2026-84869-screenconnect-technician-exploitation","publisher":"huntress","context":"The article cites Huntress research detailing exploitation of a ScreenConnect technician workstation through a guest-pushed batch file.","category":"research","primary":true},{"title":"Fake Crypto Exchange Sessions in ScreenConnect","url":"https://www.huntress.com/blog/fake-crypto-exchange-sessions-screenconnect","publisher":"huntress","context":"The article cites Huntress analysis of unauthorized ScreenConnect guest sessions impersonating cryptocurrency exchange-related systems.","category":"research","primary":true},{"title":"ScreenConnect Abuse","url":"https://www.trendaisecurity.com/en/resources-insights/trendai-security-blog/screenconnect-abuse","publisher":"trend-ai-security","context":"The article references this technical analysis for details on extracting relay addresses from publicly downloadable ScreenConnect Access installers.","category":"research","primary":false},{"title":"2026-09-08 ScreenConnect Security Bulletin","url":"https://www.connectwise.com/company/trust/security-bulletins/2026-09-08-screenconnect-bulletin","publisher":"connectwise","context":"The article references ConnectWise's security bulletin for the interim mitigation of removing the TransferFiles permission when immediate patching is not possible.","category":"advisory","primary":false}],"body":"\u003cp\u003eThreat actors are exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect client flaw rated 9.9, to target managed service provider (MSP) technician workstations. The flaw enables a guest in a remote session to send and run a malicious file on the connecting technician’s computer without a prompt appearing. Huntress observed one such compromise execute a guest-pushed batch file, contact a Telegram bot, download a fake Windows update installer, and launch a rogue ScreenConnect client in about nine seconds.\u003c/p\u003e\n\n\u003cp\u003eHuntress recorded at least 688,000 guest “run file” requests across 42 ScreenConnect servers from 29 IP addresses between October 20 and November 16, 2026. Attackers also used harmless marker files to check whether the technique worked before sending a payload, while another activity cluster registered thousands of fake guest sessions with cryptocurrency exchange-themed names. A compromised technician workstation is especially valuable because it can contain remote-management consoles, saved credentials, and access to many customer environments. Organizations are advised to update ScreenConnect host clients to version 26.6.5 or later, investigate affected systems, and remove the TransferFiles permission if they cannot patch immediately.\u003c/p\u003e\n"},{"n":3,"title":"N-able Discloses Critical Mail Assure Vulnerability Found During Breach Investigation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/n-able-discloses-critical-mail-assure.html","time":"12:28","priority":"SHOULD READ","score":86,"tldr":"N-able fixed a critical SSRF flaw (CVE-2026-134624) in its Mail Assure/SpamExperts Hosted Cloud platform after investigating an unauthorized server access incident. The company says no customer data compromise has been found, but customers must replace revoked API and OAuth credentials.","briefOverview":"\u003cp\u003eN-able disclosed and fixed CVE-2026-134624, a critical server-side request forgery issue in its Mail Assure and SpamExperts Hosted Cloud email-filtering service. The issue was discovered while the company investigated unauthorized access to one Hosted Cloud server. N-able restored dashboard and API access late Saturday after an outage that began the previous Monday, while email delivery and spam filtering continued operating. The company has not said whether the flaw was used to gain access.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was in an LDAP synchronization connection check used when a relay is configured. A user with high-level API access could direct the server to connect to chosen internal hosts and ports, determine which were reachable, and send crafted data to internal services; N-able assigned it a CVSS 4.0 score of 9.3 and fixed it in build 20261121.1943. During its response, the company took the affected server offline, rotated internal credentials, revoked customer API and OAuth tokens, and reset local user passwords. N-able says it has found no evidence of compromised customer data or activity beyond the affected server, but customers must replace revoked credentials used by scripts and integrations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able disclosed CVE-2026-134624, a critical server-side request forgery flaw in its Mail Assure and SpamExperts Hosted Cloud email-filtering service.","The flaw allowed authenticated users with high-level API access to make the platform connect to chosen internal hosts and ports and send crafted data to internal services.","N-able patched the issue in build 20261121.1943 and restored dashboard and API access late Saturday after an outage that began the previous Monday.","During the incident response, N-able took an affected Hosted Cloud server offline, rotated internal credentials, revoked customer API and OAuth tokens, and reset local user passwords.","N-able says it has found no evidence of customer-data compromise or exploitation beyond one server, and its investigation remains ongoing."],"insights":["Hosted Cloud customers do not need to install a patch because N-able says the service was already updated, but integrations using revoked API or OAuth tokens must be reconnected with replacement credentials.","The disclosed flaw was limited to users with high-level API access and enabled internal network reachability checks and crafted requests; N-able's advisory does not state that it enabled code execution.","SpamExperts Local Cloud runs on customer hardware and is covered by weekly software updates, so its operators should verify that they are running build 20261121.1943.","N-able has not determined or disclosed how the unauthorized party initially accessed the Hosted Cloud server, and says a formal root-cause analysis is expected within two weeks of its update."],"referencedReports":[{"title":"CVE-2026-134624: Mail Assure LDAP Sync Connection Check SSRF","url":"https://me.n-able.com/s/security-advisory/aArVy0000002mrlKAA/cve2026134624-mailassure-ldap-sync-connection-check-ssrf","publisher":"n-able","context":"The article cites N-able's security advisory for the flaw's impact, affected builds, and fix version.","category":"advisory","primary":true}],"body":"\u003cp\u003eN-able disclosed and fixed CVE-2026-134624, a critical server-side request forgery issue in its Mail Assure and SpamExperts Hosted Cloud email-filtering service. The issue was discovered while the company investigated unauthorized access to one Hosted Cloud server. N-able restored dashboard and API access late Saturday after an outage that began the previous Monday, while email delivery and spam filtering continued operating. The company has not said whether the flaw was used to gain access.\u003c/p\u003e\n\n\u003cp\u003eThe flaw was in an LDAP synchronization connection check used when a relay is configured. A user with high-level API access could direct the server to connect to chosen internal hosts and ports, determine which were reachable, and send crafted data to internal services; N-able assigned it a CVSS 4.0 score of 9.3 and fixed it in build 20261121.1943. During its response, the company took the affected server offline, rotated internal credentials, revoked customer API and OAuth tokens, and reset local user passwords. N-able says it has found no evidence of compromised customer data or activity beyond the affected server, but customers must replace revoked credentials used by scripts and integrations.\u003c/p\u003e\n"},{"n":5,"title":"Critical binary-parser Flaw Enables JavaScript Injection via Malicious Parser Definitions","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/critical-binary-parser-flaw-enables.html","time":"13:22","priority":"SHOULD READ","score":84,"tldr":"Binary-parser versions before 2.3.1 have a critical code-injection flaw (CVE-2026-134814) that can let attackers who control parser definitions execute arbitrary JavaScript in Node.js during parser compilation. Users should upgrade to version 2.3.1 or later.","briefOverview":"\u003cp\u003eA critical code-injection flaw, CVE-2026-134814, affects binary-parser versions before 2.3.1. The issue can allow attackers who control parser definitions to execute arbitrary JavaScript in the Node.js process when a parser is compiled. The vulnerability has been assigned CVSS scores of 9.2 and 8.1.\u003c/p\u003e\n\n\u003cp\u003eThe problem arose because certain user-controlled string options were inserted into generated JavaScript without sufficient validation. Affected options include length, lengthInBytes, key, tag, offset, and aliases supplied through namely(). Parsing untrusted binary data with a trusted parser definition is not affected, according to the maintainer. Version 2.3.1 validates these values as identifier paths and rejects expressions such as \u0026ldquo;len - 1,\u0026rdquo; while CVE-2026-134814 is also described as an incomplete fix for the earlier CVE-2026-1245.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Binary-parser versions before 2.3.1 contain CVE-2026-134814, a code-injection flaw that can allow arbitrary JavaScript execution when an attacker controls parser definitions.","The flaw stems from string options such as length, lengthInBytes, key, tag, offset, and aliases passed to namely() being inserted into generated JavaScript without adequate validation.","The vulnerability is triggered when a crafted parser definition is compiled in a Node.js process, not simply by parsing untrusted binary data with a trusted parser definition.","The binary-parser maintainer stated that version 2.3.1 validates these options as identifier paths and rejects expressions such as \"len - 1.\"","CVE-2026-134814 is described as an incomplete fix for CVE-2026-1245, an earlier code-injection issue involving insufficient validation of field names and encoding parameters."],"insights":["The risk depends on who controls the parser definition: processing untrusted binary data alone is not affected when the parser definition is trusted.","The patch deliberately disallows expression-style option values such as \"len - 1\" and requires a function instead, which may require application changes beyond simply updating the package.","The issue was identified as an incomplete fix for CVE-2026-1245, showing that earlier validation improvements did not cover all user-controlled parser options.","The malicious code executes when the parser is compiled, meaning the dangerous input is the parser setup information rather than the binary data being parsed."],"referencedReports":[{"title":"GHSA-xmxc-6c22-m377: Code injection in binary-parser","url":"https://github.com/keichi/binary-parser/security/advisories/GHSA-xmxc-6c22-m377","publisher":"binary-parser project maintainer","context":"The article cites the project maintainer's advisory explaining that trusted parser definitions are not affected and that affected options are now validated as identifier paths.","category":"advisory","primary":true}],"body":"\u003cp\u003eA critical code-injection flaw, CVE-2026-134814, affects binary-parser versions before 2.3.1. The issue can allow attackers who control parser definitions to execute arbitrary JavaScript in the Node.js process when a parser is compiled. The vulnerability has been assigned CVSS scores of 9.2 and 8.1.\u003c/p\u003e\n\n\u003cp\u003eThe problem arose because certain user-controlled string options were inserted into generated JavaScript without sufficient validation. Affected options include length, lengthInBytes, key, tag, offset, and aliases supplied through namely(). Parsing untrusted binary data with a trusted parser definition is not affected, according to the maintainer. Version 2.3.1 validates these values as identifier paths and rejects expressions such as \u0026ldquo;len - 1,\u0026rdquo; while CVE-2026-134814 is also described as an incomplete fix for the earlier CVE-2026-1245.\u003c/p\u003e\n"},{"n":1,"title":"Call center operator gets 8 years for helping scam 30,000 Americans","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/call-center-operator-gets-8-years-for-helping-scam-30-000-americans/","time":"12:02","priority":"MAY READ","score":68,"tldr":"A Peruvian call-center operator received an eight-year U.S. prison sentence for running a government-impersonation scam that defrauded more than 30,000 Spanish-speaking U.S. residents of roughly $15 million.","briefOverview":"\u003cp\u003eCarla Magaly Alcedo Mendoza, a 45-year-old call center operator from Lima, Peru, was sentenced to eight years in prison after pleading guilty to conspiracy to commit mail and wire fraud. She was arrested in March 2023 and extradited to the United States in April 2025 following an 18-count indictment. Court documents said she managed Peruvian call centers connected to fraud and extortion schemes between January 2013 and December 2018.\u003c/p\u003e\n\n\u003cp\u003eThe operation targeted Spanish-speaking U.S. residents with unsolicited calls offering free services or products, then falsely claimed that victims were obligated to make large payments. Callers impersonated U.S. government officials and lawyers and threatened court action, arrest, and immigration consequences. The Department of Justice said the scheme defrauded more than 30,000 people of $15 million, and other call-center and distribution-center operators connected to it have also been convicted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Carla Magaly Alcedo Mendoza, a Peruvian call center operator, was sentenced to eight years in prison after pleading guilty to conspiracy to commit mail and wire fraud.","Alcedo managed Peruvian call centers linked to fraud and extortion schemes between January 2013 and December 2018.","The scheme targeted Spanish-speaking U.S. residents with calls falsely claiming they owed money and threats of court action, arrest, and immigration consequences.","The U.S. Department of Justice said the scheme defrauded more than 30,000 Spanish-speaking U.S. residents of $15 million.","The Federal Trade Commission reported that Americans lost $3.5 billion to impersonation scams in 2025, including about $920 million to government impersonators."],"insights":["The fraud combined an initial offer of free products or services with later threats from people posing as government officials or lawyers, showing how the scheme shifted from a seemingly beneficial call into intimidation.","The prosecution extended beyond a single operator: ten Peruvian call-center owner-operators and four distribution-center owner-operators had also been convicted in connection with the scheme.","Reported U.S. losses to impersonation scams nearly tripled from 2020 to 2025, reaching $3.5 billion in 2025, with government impersonators responsible for about $920 million of that total."],"referencedReports":[],"body":"\u003cp\u003eCarla Magaly Alcedo Mendoza, a 45-year-old call center operator from Lima, Peru, was sentenced to eight years in prison after pleading guilty to conspiracy to commit mail and wire fraud. She was arrested in March 2023 and extradited to the United States in April 2025 following an 18-count indictment. Court documents said she managed Peruvian call centers connected to fraud and extortion schemes between January 2013 and December 2018.\u003c/p\u003e\n\n\u003cp\u003eThe operation targeted Spanish-speaking U.S. residents with unsolicited calls offering free services or products, then falsely claimed that victims were obligated to make large payments. Callers impersonated U.S. government officials and lawyers and threatened court action, arrest, and immigration consequences. The Department of Justice said the scheme defrauded more than 30,000 people of $15 million, and other call-center and distribution-center operators connected to it have also been convicted.\u003c/p\u003e\n"},{"n":2,"title":"Microsoft testing fix for Windows 11 Bluetooth audio quality drops","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-testing-fix-for-windows-11-bluetooth-audio-quality-drops/","time":"13:28","priority":"MAY READ","score":62,"tldr":"Microsoft is testing a Windows 11 fix that lets compatible Bluetooth LE Audio headsets maintain full-quality stereo sound while their microphone is active, addressing the longstanding quality drop caused by switching to hands-free audio mode.","briefOverview":"\u003cp\u003eMicrosoft is testing a Windows 11 fix for Bluetooth audio quality drops that occur when an app or game begins using a headset microphone. Windows normally switches from high-quality stereo headphone audio to a call-focused audio mode, where limited two-way bandwidth reduces sound quality. The feature is available in preview builds released to Windows 11 Insiders in the Beta and Experimental channels.\u003c/p\u003e\n\n\u003cp\u003eCompatible Bluetooth LE Audio devices can retain full-range stereo sound while their microphones are active for game chat, calls, voice typing, or Copilot Chat. Devices must support 48 kHz playback, and PCs that support Super Wideband Stereo can select a new two-channel, 16-bit, 48 kHz format in Windows sound settings when the microphone is active. The change applies to Bluetooth LE Audio headphones, earbuds, and speakers, potentially removing the need to accept lower-quality audio while using a microphone.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is testing a Windows 11 fix intended to prevent Bluetooth audio quality from dropping when an application uses a headset microphone.","The quality drop occurs when Windows switches from the stereo headphone mode to a call-focused headset mode with limited two-way audio capacity.","Windows 11 Insiders in the Beta and Experimental channels can test full-range stereo playback with microphone use on compatible Bluetooth LE Audio devices.","Users with a PC supporting Super Wideband Stereo can select a new two-channel, 16-bit, 48 kHz audio format when the microphone is active.","The feature supports Bluetooth LE Audio headphones, earbuds, and speakers that support 48 kHz playback."],"insights":["The improvement is not limited to voice calls: Microsoft says it also applies during game chat, voice typing, and Copilot Chat when a compatible device microphone is active.","The feature requires both a Bluetooth LE Audio device that supports 48 kHz playback and, for the new stereo format option, a PC that supports Super Wideband Stereo.","Users can enable the new microphone-active format through the Bluetooth device's output settings in Windows 11, where Microsoft identifies a two-channel, 16-bit, 48 kHz option.","The change is currently being tested only with Windows 11 Insider preview builds in the Beta and Experimental channels."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft is testing a Windows 11 fix for Bluetooth audio quality drops that occur when an app or game begins using a headset microphone. Windows normally switches from high-quality stereo headphone audio to a call-focused audio mode, where limited two-way bandwidth reduces sound quality. The feature is available in preview builds released to Windows 11 Insiders in the Beta and Experimental channels.\u003c/p\u003e\n\n\u003cp\u003eCompatible Bluetooth LE Audio devices can retain full-range stereo sound while their microphones are active for game chat, calls, voice typing, or Copilot Chat. Devices must support 48 kHz playback, and PCs that support Super Wideband Stereo can select a new two-channel, 16-bit, 48 kHz format in Windows sound settings when the microphone is active. The change applies to Bluetooth LE Audio headphones, earbuds, and speakers, potentially removing the need to accept lower-quality audio while using a microphone.\u003c/p\u003e\n"}]</script>
