<script type="application/json" id="dl-articles">[{"n":2,"title":"Google warns of new Chrome zero-day bug exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/google-patches-seventh-chrome-zero-day-exploited-in-attacks-this-year/","time":"06:25","priority":"MUST READ","score":95,"tldr":"Google patched an actively exploited Chrome zero-day, CVE-2026-87491, an out-of-bounds write flaw in the V8 engine that could allow remote code execution via crafted web pages. Users should update Chrome to the latest stable version as soon as possible.","briefOverview":"\u003cp\u003eGoogle patched 230 vulnerabilities on Tuesday, including an actively exploited Chrome zero-day tracked as CVE-2026-87491. The company said it is aware that an exploit for the flaw exists in the wild. This is the seventh actively exploited Chrome zero-day patched since the start of the year.\u003c/p\u003e\n\n\u003cp\u003ePatched Chrome versions are rolling out in the Stable Desktop channel for Windows, Mac, and Linux. The fixed versions are 153.0.8010.36 for Windows and Linux and 153.0.8010.37 for Mac. Google said the update could take days or weeks to reach all users worldwide, but it was available immediately when BleepingComputer checked for updates.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-87491 is a high-severity out-of-bounds write vulnerability in Chrome’s V8 JavaScript and WebAssembly engine. Remote attackers can exploit it through crafted HTML pages to execute arbitrary code inside the browser’s sandbox. Successful exploitation can also expose sensitive information through heap corruption or trigger a crash, while Google is keeping bug details restricted until most users have updated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google patched 230 vulnerabilities on Tuesday, including an actively exploited Chrome zero-day tracked as CVE-2026-87491.","Patched Chrome versions are rolling out as 153.0.8010.36 for Windows and Linux and 153.0.8010.37 for Mac in the Stable Desktop channel.","CVE-2026-87491 is a high-severity out-of-bounds write vulnerability in Chrome’s V8 JavaScript and WebAssembly engine.","Remote attackers can exploit CVE-2026-87491 with crafted HTML pages to execute arbitrary code inside Chrome’s sandbox.","Google said access to bug details may remain restricted until most users have updated with the fix."],"insights":["Chrome users do not necessarily need to wait for the staged rollout, because BleepingComputer found the patched update was available immediately through a manual update check.","Google released fixes only two days after the CVE-2026-87491 report, indicating a rapid patch turnaround for this actively exploited flaw.","V8 has appeared in multiple actively exploited Chrome zero-days this year, including CVE-2026-3910, CVE-2026-85046, and CVE-2026-87491.","Google is withholding technical details until most users are updated, which makes applying the patch promptly especially important for reducing exposure while exploit information is limited."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_0808145027.html","publisher":"Google","context":"The article cites Google's Tuesday security advisory as the source for the statement that an exploit for CVE-2026-87491 exists in the wild and for the patched Chrome versions.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle patched 230 vulnerabilities on Tuesday, including an actively exploited Chrome zero-day tracked as CVE-2026-87491. The company said it is aware that an exploit for the flaw exists in the wild. This is the seventh actively exploited Chrome zero-day patched since the start of the year.\u003c/p\u003e\n\n\u003cp\u003ePatched Chrome versions are rolling out in the Stable Desktop channel for Windows, Mac, and Linux. The fixed versions are 153.0.8010.36 for Windows and Linux and 153.0.8010.37 for Mac. Google said the update could take days or weeks to reach all users worldwide, but it was available immediately when BleepingComputer checked for updates.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-87491 is a high-severity out-of-bounds write vulnerability in Chrome’s V8 JavaScript and WebAssembly engine. Remote attackers can exploit it through crafted HTML pages to execute arbitrary code inside the browser’s sandbox. Successful exploitation can also expose sensitive information through heap corruption or trigger a crash, while Google is keeping bug details restricted until most users have updated.\u003c/p\u003e\n"},{"n":5,"title":"SAP Patches CVSS 10.0 Kernel Flaw Enabling Unauthenticated Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/sap-patches-cvss-100-kernel-flaw.html","time":"06:25","priority":"MUST READ","score":95,"tldr":"SAP released urgent patches for several critical flaws, including a CVSS 10.0 SAP Kernel Extended Passport bug that allows unauthenticated remote code execution with SAP admin privileges. Organizations should prioritize patching exposed SAP systems because standard SAP access controls cannot mitigate the pre-authentication attack path.","briefOverview":"\u003cp\u003eSAP released security updates for multiple vulnerabilities, including CVE-2026-44756, a maximum-severity flaw in SAP Extended Passport Processing with a CVSS score of 10.0. The flaw, codenamed OVERPASS by Onapsis, is a memory corruption issue in the SAP kernel’s processing of Extended Passport data. It is remotely exploitable without authentication and can allow attackers to run arbitrary operating system commands on the SAP host with SAP administrative privileges.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-44756 stems from missing boundary validation during deserialization of EPP data, causing a memory safety violation when externally supplied length fields are processed. Onapsis said the vulnerable EPP processing is shared kernel code reachable through the internet-facing web layer, the SAP GUI layer, and the RFC layer, none of which require credentials. Successful exploitation could expose database credentials, password hashes, live session data, stored credentials for lateral movement, application data, system configuration, and SAP binaries.\u003c/p\u003e\n\n\u003cp\u003eSAP also patched CVE-2026-58240, a CVSS 9.8 missing authentication check in SAP NetWeaver Message Server that Onapsis named S4GET. Other critical flaws include CVE-2026-76969 in multi-tenant applications using SAP Cloud Application Programming Model and CVE-2026-66768 in SAP NetWeaver SAP GUI for Java. Although the article says none of the vulnerabilities have been exploited to date, Onapsis recommends inventorying every SAP system, prioritizing internet-facing systems for patching, reducing exposure where possible, and monitoring for exploitation attempts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SAP released security updates for multiple vulnerabilities, including CVE-2026-44756, a CVSS 10.0 memory corruption flaw in SAP Extended Passport Processing.","CVE-2026-44756, codenamed OVERPASS by Onapsis, is remotely exploitable without authentication and can allow attackers to run arbitrary operating system commands on the SAP host with SAP administrative privileges.","Onapsis said OVERPASS is reachable through several SAP components and communication protocols, including the internet-facing web layer, SAP GUI layer, and RFC layer.","SAP also patched CVE-2026-58240, a CVSS 9.8 missing authentication check in SAP NetWeaver Message Server that Onapsis named S4GET.","Onapsis recommended that users inventory every SAP system, patch internet-facing systems before internal instances, reduce exposure where possible, and monitor for exploitation attempts."],"insights":["SAP authorizations, Segregation of Duties controls, locked users, tighter roles, password policies, and restricted transaction access do not reduce the OVERPASS risk because the vulnerable code runs before authentication.","Onapsis said no single network control can fully mitigate OVERPASS because the shared EPP processing code is reachable through multiple SAP components and protocols.","S4GET cannot be firewalled away without breaking end-user logon because it is triggered through the same public port used by every SAP GUI client.","Successful exploitation of OVERPASS could expose the SAP secure store, database credentials, password hashes, live user session data, stored credentials for lateral movement, application data, system configuration, and SAP binaries.","Onapsis specifically recommends patching internet-facing SAP systems before internal instances while monitoring for exploitation attempts during the rollout."],"referencedReports":[{"title":"September 2026 Security Patch Day","url":"https://support.sap.com/en/my-support/knowledge-base/security-notes-news/september-2026.html?isu_page=1","publisher":"SAP","context":"The article cites SAP's released security updates addressing multiple vulnerabilities, including the CVSS 10.0 SAP Extended Passport Processing flaw.","category":"advisory","primary":true},{"title":"SAP Security Patch Day September 2026","url":"https://onapsis.com/blog/sap-security-patch-day-september-2026/","publisher":"Onapsis","context":"The article cites Onapsis as the company that discovered and reported CVE-2026-44756.","category":"advisory","primary":true},{"title":"SAP OVERPASS Remediation","url":"https://onapsis.com/blog/sap-overpass-remediation/","publisher":"Onapsis","context":"The article references Onapsis' named analysis and remediation material for the CVE-2026-44756 flaw codenamed OVERPASS.","category":"advisory","primary":true},{"title":"S4GET CVE-2026-58240 SAP Message Server Threat Advisory","url":"https://onapsis.com/blog/s4get-cve-2026-58240-sap-message-server-threat-advisory/","publisher":"Onapsis","context":"The article cites Onapsis' threat advisory describing the S4GET flaw in SAP NetWeaver Message Server.","category":"advisory","primary":true}],"body":"\u003cp\u003eSAP released security updates for multiple vulnerabilities, including CVE-2026-44756, a maximum-severity flaw in SAP Extended Passport Processing with a CVSS score of 10.0. The flaw, codenamed OVERPASS by Onapsis, is a memory corruption issue in the SAP kernel’s processing of Extended Passport data. It is remotely exploitable without authentication and can allow attackers to run arbitrary operating system commands on the SAP host with SAP administrative privileges.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-44756 stems from missing boundary validation during deserialization of EPP data, causing a memory safety violation when externally supplied length fields are processed. Onapsis said the vulnerable EPP processing is shared kernel code reachable through the internet-facing web layer, the SAP GUI layer, and the RFC layer, none of which require credentials. Successful exploitation could expose database credentials, password hashes, live session data, stored credentials for lateral movement, application data, system configuration, and SAP binaries.\u003c/p\u003e\n\n\u003cp\u003eSAP also patched CVE-2026-58240, a CVSS 9.8 missing authentication check in SAP NetWeaver Message Server that Onapsis named S4GET. Other critical flaws include CVE-2026-76969 in multi-tenant applications using SAP Cloud Application Programming Model and CVE-2026-66768 in SAP NetWeaver SAP GUI for Java. Although the article says none of the vulnerabilities have been exploited to date, Onapsis recommends inventorying every SAP system, prioritizing internet-facing systems for patching, reducing exposure where possible, and monitoring for exploitation attempts.\u003c/p\u003e\n"},{"n":6,"title":"Chrome V8 Zero-Day Exploited in the Wild Enables Code Execution Inside Sandbox","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/chrome-v8-zero-day-exploited-in-wild.html","time":"09:11","priority":"MUST READ","score":95,"tldr":"Google patched an actively exploited Chrome V8 zero-day, CVE-2026-87491, that could let a remote attacker run code inside Chrome’s sandbox via a crafted HTML page. Users should update Chrome to the latest fixed versions immediately, and Chromium-based browsers should apply fixes when available.","briefOverview":"\u003cp\u003eGoogle released Chrome updates to patch 230 security vulnerabilities, including CVE-2026-87491, which has been actively exploited in the wild. The flaw is a medium-severity out-of-bounds write bug in V8, Chrome’s JavaScript and WebAssembly engine. According to the NIST National Vulnerability Database description cited in the article, it allowed a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page.\u003c/p\u003e\n\n\u003cp\u003eSecurity researcher Jihyeon Jeong of Compsec Lab, Seoul National University, discovered and reported the flaw on August 6, 2026, and received a $2,500 bug bounty reward. Google said it is aware that an exploit for CVE-2026-87491 exists in the wild, but it has not shared details on how the flaw is being used or who is behind the activity. Google also said access to bug details and links may remain restricted until most users have updated with a fix.\u003c/p\u003e\n\n\u003cp\u003eThe update also fixes five critical security flaws in WebGL and Cast components, including use-after-free, out-of-bounds write, and buffer overflow issues. Google said 195 of the 230 fixed flaws were reported by Google, and noted that many security bugs are detected using tools such as AddressSanitizer, MemorySanitizer, UndefinedBehaviorSanitizer, Control Flow Integrity, libFuzzer, or AFL. Users are advised to update Chrome to versions 153.0.8010.36/.37 for Windows and macOS and 153.0.8010.36 for Linux, while users of Chromium-based browsers such as Microsoft Edge, Brave, Opera, and Vivaldi should apply fixes when available.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google released Chrome updates to patch 230 security vulnerabilities, including CVE-2026-87491, which has been exploited in the wild.","CVE-2026-87491 is a medium-severity out-of-bounds write bug in Chrome’s V8 JavaScript and WebAssembly engine that can allow a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page.","Security researcher Jihyeon Jeong of Compsec Lab at Seoul National University reported CVE-2026-87491 to Google on August 6, 2026, and received a $2,500 bug bounty reward.","The update also fixes five critical flaws in WebGL and Cast components, including use-after-free, out-of-bounds write, and buffer overflow issues.","Users are advised to update Chrome to versions 153.0.8010.36/.37 for Windows and macOS and 153.0.8010.36 for Linux, while users of other Chromium-based browsers should apply fixes when available."],"insights":["Google rated CVE-2026-87491 as medium severity even though it acknowledged an exploit exists in the wild and the flaw can enable arbitrary code execution inside Chrome’s sandbox.","Google is withholding bug details and links until most users have updated, which means public technical information about the actively exploited flaw may remain limited for now.","This is the seventh actively exploited Chrome zero-day Google has patched in 2026, indicating repeated real-world targeting of Chrome vulnerabilities this year.","The update is unusually broad, fixing 230 vulnerabilities in total, with Google reporting 195 of them itself.","The affected ecosystem extends beyond Chrome because users of Microsoft Edge, Brave, Opera, and Vivaldi are also advised to apply fixes when they become available."],"referencedReports":[{"title":"Stable Channel Update for Desktop","url":"https://chromereleases.googleblog.com/2026/09/stable-channel-update-for-desktop_0808145027.html","publisher":"Google Chrome Releases","context":"The article cites Google's Chrome release notice as the source for the security update that patches 230 vulnerabilities, including the actively exploited CVE-2026-87491.","category":"advisory","primary":true},{"title":"CVE-2026-87491 Detail","url":"https://nvd.nist.gov/vuln/detail/cve-2026-87491","publisher":"NIST National Vulnerability Database","context":"The article references the NVD entry for its description of CVE-2026-87491 as an out-of-bounds write in V8 that allowed arbitrary code execution inside the sandbox via a crafted HTML page.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle released Chrome updates to patch 230 security vulnerabilities, including CVE-2026-87491, which has been actively exploited in the wild. The flaw is a medium-severity out-of-bounds write bug in V8, Chrome’s JavaScript and WebAssembly engine. According to the NIST National Vulnerability Database description cited in the article, it allowed a remote attacker to execute arbitrary code inside the sandbox via a crafted HTML page.\u003c/p\u003e\n\n\u003cp\u003eSecurity researcher Jihyeon Jeong of Compsec Lab, Seoul National University, discovered and reported the flaw on August 6, 2026, and received a $2,500 bug bounty reward. Google said it is aware that an exploit for CVE-2026-87491 exists in the wild, but it has not shared details on how the flaw is being used or who is behind the activity. Google also said access to bug details and links may remain restricted until most users have updated with a fix.\u003c/p\u003e\n\n\u003cp\u003eThe update also fixes five critical security flaws in WebGL and Cast components, including use-after-free, out-of-bounds write, and buffer overflow issues. Google said 195 of the 230 fixed flaws were reported by Google, and noted that many security bugs are detected using tools such as AddressSanitizer, MemorySanitizer, UndefinedBehaviorSanitizer, Control Flow Integrity, libFuzzer, or AFL. Users are advised to update Chrome to versions 153.0.8010.36/.37 for Windows and macOS and 153.0.8010.36 for Linux, while users of Chromium-based browsers such as Microsoft Edge, Brave, Opera, and Vivaldi should apply fixes when available.\u003c/p\u003e\n"},{"n":8,"title":"F5 BIG-IP APM Malware Injects a PHP Web Shell Into Memory, Evading Disk Scans","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/f5-big-ip-apm-malware-injects-php-web.html","time":"07:36","priority":"MUST READ","score":94,"tldr":"Sophos found that malware tied to exploited F5 BIG-IP APM systems can inject a PHP web shell into Apache/PHP memory without changing the on-disk scripts, allowing it to evade normal file scans. Defenders should investigate even patched appliances, checking memory, modified binaries, logs, and F5 integrity signals for compromise.","briefOverview":"\u003cp\u003eSophos said malware linked to break-ins at F5 BIG-IP Access Policy Manager appliances hides a PHP web shell in memory instead of storing it as a file on disk. When Apache loads one of three BIG-IP APM PHP scripts, the malware adds the web shell to the in-memory copy, so checks of the file on disk can appear clean. The three scripts are apm_css.php3, full_wt.php3, and webtop_popup_css.php3, which F5 had previously listed in indicators of compromise for malware it tracks as c05d5254.\u003c/p\u003e\n\n\u003cp\u003eF5 has linked the c05d5254 activity to appliances affected by CVE-2025-53521, which it reclassified on March 27, 2026 as an exploited unauthenticated remote code execution flaw. The flaw applies where a BIG-IP APM access policy is set on a virtual server, and F5 lists fixed releases for affected versions. The article says patching does not settle whether an appliance was compromised before the patch, and UK NCSC advises investigating for compromise regardless of when the system was updated.\u003c/p\u003e\n\n\u003cp\u003eSophos said a separate installer sample named umount infects /usr/sbin/httpd by adding malicious code to the front of the real Apache web server file. The malware hooks Apache and PHP-related behavior so that, when one of the three scripts is mapped into memory, it places the web shell in front of the original content. Suggested investigation leads include sys-eicheck failures, mismatches in /usr/bin/umount or /usr/sbin/httpd, suspicious logs, HTTP 201 responses with a CSS content type, and differences between modules in memory and copies on disk.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sophos said malware linked to break-ins at F5 BIG-IP Access Policy Manager appliances hides a PHP web shell in memory instead of storing it as a file on disk.","The malware injects the web shell into Apache’s in-memory copy of apm_css.php3, full_wt.php3, or webtop_popup_css.php3, so disk checks of those scripts can appear clean.","F5 linked the c05d5254 activity to CVE-2025-53521, a BIG-IP APM flaw it reclassified on March 27, 2026 as unauthenticated remote code execution that had been exploited.","Sophos said an installer sample named umount infects /usr/sbin/httpd by adding malicious code to the front of the real Apache web server file.","Defenders are advised to investigate patched systems for prior compromise using signals such as sys-eicheck failures, modified /usr/bin/umount or /usr/sbin/httpd files, suspicious logs, HTTP 201 CSS responses, and memory-versus-disk differences."],"insights":["A clean file comparison of the three named PHP scripts is not enough to rule out compromise, because the article says the web shell can be added only after Apache loads the scripts into memory.","Patching CVE-2025-53521 does not answer whether an appliance was already compromised, and the article notes that UK NCSC advises investigation regardless of when the system was updated.","The earlier infection stages can still leave disk-based evidence even though the final web shell is memory-only, including changes to /usr/sbin/httpd, /usr/bin/umount, and BIG-IP install images described by Sophos and ESET.","HTTP 201 responses with a CSS content type from the appliance are a notable investigation lead because the web shell is designed to make its command traffic look like a stylesheet request.","The article highlights that no public source has said whether upgrading to a fixed release removes already installed malware, while Sophos and ESET describe a component designed to survive upgrade images."],"referencedReports":[{"title":"Dissecting a PHP Web Server Rootkit","url":"https://www.sophos.com/en-us/blog/dissecting-a-php-web-server-rootkit","publisher":"Sophos","context":"The article says Sophos published an analysis explaining how the malware injects a PHP web shell into memory instead of leaving it on disk.","category":"research","primary":true},{"title":"Indicators of Compromise for c05d5254","url":"https://my.f5.com/manage/s/article/K000160486","publisher":"F5","context":"The article cites F5's published indicators of compromise for the c05d5254 malware, including the three BIG-IP APM PHP scripts.","category":"advisory","primary":false},{"title":"K000156741: CVE-2025-53521 BIG-IP APM advisory","url":"https://my.f5.com/manage/s/article/K000156741","publisher":"F5","context":"The article references F5's advisory as the source for affected and fixed BIG-IP APM releases for CVE-2025-53521.","category":"advisory","primary":false},{"title":"CVE-2025-53521 advisory","url":"https://ncsc.gov.ie/pdfs/2603311419_CVE-2025-53521.pdf","publisher":"Ireland National Cyber Security Center","context":"The article cites Ireland's NCSC March 31 advisory saying the October patch remains valid and noting uncertainty about the exploitation timeline.","category":"advisory","primary":false}],"body":"\u003cp\u003eSophos said malware linked to break-ins at F5 BIG-IP Access Policy Manager appliances hides a PHP web shell in memory instead of storing it as a file on disk. When Apache loads one of three BIG-IP APM PHP scripts, the malware adds the web shell to the in-memory copy, so checks of the file on disk can appear clean. The three scripts are apm_css.php3, full_wt.php3, and webtop_popup_css.php3, which F5 had previously listed in indicators of compromise for malware it tracks as c05d5254.\u003c/p\u003e\n\n\u003cp\u003eF5 has linked the c05d5254 activity to appliances affected by CVE-2025-53521, which it reclassified on March 27, 2026 as an exploited unauthenticated remote code execution flaw. The flaw applies where a BIG-IP APM access policy is set on a virtual server, and F5 lists fixed releases for affected versions. The article says patching does not settle whether an appliance was compromised before the patch, and UK NCSC advises investigating for compromise regardless of when the system was updated.\u003c/p\u003e\n\n\u003cp\u003eSophos said a separate installer sample named umount infects /usr/sbin/httpd by adding malicious code to the front of the real Apache web server file. The malware hooks Apache and PHP-related behavior so that, when one of the three scripts is mapped into memory, it places the web shell in front of the original content. Suggested investigation leads include sys-eicheck failures, mismatches in /usr/bin/umount or /usr/sbin/httpd, suspicious logs, HTTP 201 responses with a CSS content type, and differences between modules in memory and copies on disk.\u003c/p\u003e\n"},{"n":3,"title":"New Microsoft Defender 'ShieldCrash' zero-day grants SYSTEM access","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-microsoft-defender-shieldcrash-zero-day-grants-system-access/","time":"07:30","priority":"MUST READ","score":92,"tldr":"A researcher released a new Microsoft Defender zero-day called ShieldCrash that can grant SYSTEM-level arbitrary file read on fully patched Windows systems, claiming Microsoft’s September patch failed to fully fix the earlier ShieldBreak flaw. Microsoft had not yet commented or released an official fix.","briefOverview":"\u003cp\u003eAn anonymous security researcher known as Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldCrash shortly after Microsoft issued its September 2026 Patch Tuesday security updates. ShieldCrash is described as a bypass for the ShieldBreak Defender privilege escalation flaw, which Microsoft patched as CVE-2026-69414. ShieldBreak itself was described as a bypass for RoguePlanet, another Defender flaw disclosed in June and patched by Microsoft in July.\u003c/p\u003e\n\n\u003cp\u003eAccording to Nightmare Eclipse, the ShieldCrash proof-of-concept exploit can let attackers gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems, but it will not give them write access. The researcher said Microsoft failed to properly patch ShieldBreak under specific conditions and that the same problem can still be triggered. They described the current proof of concept as demonstrating arbitrary file read as SYSTEM on all supported Windows versions with the September 2026 updates installed.\u003c/p\u003e\n\n\u003cp\u003eThe article says Nightmare Eclipse has released these zero-day exploits as part of an ongoing dispute with Microsoft over bug bounty and vulnerability disclosure practices. Since April, the researcher has disclosed multiple zero-days affecting Microsoft Defender, BitLocker, and other Windows components, including ShieldBreak, LegacyHive, RoguePlanet, BlueHammer, RedSun, YellowKey, GreenPlasma, MiniPlasma, and UnDefend. Microsoft has fixed several of those flaws, but the article states that others still lack an official patch, and Microsoft was not immediately available to comment on ShieldCrash.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An anonymous security researcher known as Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldCrash after Microsoft issued its September 2026 Patch Tuesday security updates.","Nightmare Eclipse described ShieldCrash as a bypass for the ShieldBreak Defender privilege escalation flaw that Microsoft patched as CVE-2026-69414.","The ShieldCrash proof-of-concept exploit is said to allow attackers to gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems, but not write access.","Nightmare Eclipse said the proof of concept demonstrates arbitrary file read as SYSTEM on all supported Windows versions with the September 2026 updates installed.","Microsoft was not immediately available to comment when BleepingComputer asked about the ShieldCrash zero-day."],"insights":["ShieldCrash is presented as part of a chain of incomplete or bypassed fixes, since ShieldBreak bypassed RoguePlanet and ShieldCrash is described as a bypass for Microsoft’s ShieldBreak patch.","The released proof of concept currently demonstrates SYSTEM-level arbitrary file read rather than full write access, which narrows what the public exploit can do while still exposing sensitive data risks.","Nightmare Eclipse is releasing these zero-days amid an ongoing dispute with Microsoft over bug bounty and vulnerability disclosure practices, showing that the disclosure context is central to the repeated public releases.","Microsoft has patched several of Nightmare Eclipse’s previously disclosed flaws, but the article states that other disclosed vulnerabilities still lack official patches."],"referencedReports":[{"title":"CVE-2026-69414","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-69414","publisher":"Microsoft Security Response Center","context":"The article links Microsoft’s advisory when stating that the ShieldBreak Defender privilege escalation flaw was patched on Thursday.","category":"advisory","primary":false}],"body":"\u003cp\u003eAn anonymous security researcher known as Nightmare Eclipse released a new Microsoft Defender zero-day exploit named ShieldCrash shortly after Microsoft issued its September 2026 Patch Tuesday security updates. ShieldCrash is described as a bypass for the ShieldBreak Defender privilege escalation flaw, which Microsoft patched as CVE-2026-69414. ShieldBreak itself was described as a bypass for RoguePlanet, another Defender flaw disclosed in June and patched by Microsoft in July.\u003c/p\u003e\n\n\u003cp\u003eAccording to Nightmare Eclipse, the ShieldCrash proof-of-concept exploit can let attackers gain SYSTEM privileges on fully patched Windows 10, Windows 11, and Windows Server systems, but it will not give them write access. The researcher said Microsoft failed to properly patch ShieldBreak under specific conditions and that the same problem can still be triggered. They described the current proof of concept as demonstrating arbitrary file read as SYSTEM on all supported Windows versions with the September 2026 updates installed.\u003c/p\u003e\n\n\u003cp\u003eThe article says Nightmare Eclipse has released these zero-day exploits as part of an ongoing dispute with Microsoft over bug bounty and vulnerability disclosure practices. Since April, the researcher has disclosed multiple zero-days affecting Microsoft Defender, BitLocker, and other Windows components, including ShieldBreak, LegacyHive, RoguePlanet, BlueHammer, RedSun, YellowKey, GreenPlasma, MiniPlasma, and UnDefend. Microsoft has fixed several of those flaws, but the article states that others still lack an official patch, and Microsoft was not immediately available to comment on ShieldCrash.\u003c/p\u003e\n"},{"n":4,"title":"New cPanel Flaw Lets a Hosting Account With Mail Privileges Run Code as Root","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/new-cpanel-flaw-lets-hosting-account.html","time":"08:19","priority":"MUST READ","score":92,"tldr":"cPanel patched CVE-2026-67401, an EmailTrack SQL injection flaw affecting all supported cPanel/WHM versions that could let an authenticated hosting account with mail privileges create files and execute code as root. Admins should upgrade to the fixed builds immediately, though cPanel has not provided mitigations or guidance for checking prior compromise.","briefOverview":"\u003cp\u003ecPanel has patched CVE-2026-67401, a flaw it describes as an SQL injection issue in EmailTrack. The company says an authenticated hosting account holder with mail-related privileges can create files on the server and then run code as the root user. cPanel published the advisory on September 8 and said every supported version of cPanel and WHM is affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because cPanel is used by customers to manage individual hosting accounts, while WHM lets providers manage the whole machine as root. An attacker with root access could read every hosting account on the server, change files and databases, create hidden accounts, install malware, steal credentials, and move into customer networks. cPanel named fixed builds for release lines 11.110, 11.134, 11.136, 11.138, and WP Squared, and said servers can be updated through WHM or by running \u003ccode\u003e/usr/local/cpanel/scripts/upcp --force\u003c/code\u003e as root.\u003c/p\u003e\n\n\u003cp\u003eThe advisory does not explain how the SQL injection leads to file creation and root access, and it does not provide temporary steps for servers that cannot update immediately. It also does not say whether installing the patched build helps a server that was attacked before the update or how administrators would check for compromise. As of September 9, no public exploit code or exploitation report for CVE-2026-67401 appeared in searches, and it was not listed in CISA’s Known Exploited Vulnerabilities catalog released on September 8.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["cPanel patched CVE-2026-67401, an SQL injection flaw in EmailTrack that can let an authenticated account holder with mail-related privileges create files on the server and run code as the root user.","cPanel said every supported version of cPanel and WHM is affected and named fixed builds for release lines 11.110, 11.134, 11.136, 11.138, and WP Squared.","The advisory does not explain how the SQL injection leads to file creation and root access, and it does not provide temporary mitigation steps for servers that cannot update immediately.","cPanel also does not say whether installing the patched build helps a server that was attacked before the update or how an administrator would check for prior compromise.","As of September 9, no public exploit code or exploitation report for CVE-2026-67401 appeared in searches, and the flaw was absent from CISA’s Known Exploited Vulnerabilities catalog released September 8."],"insights":["The lack of a temporary workaround is notable because cPanel provided one in a July advisory for a different database flaw, leaving immediate upgrading as the only concrete action described for this issue.","The affected and fixed release lines leave uncertainty around cPanel 11.118 and 11.126, which were patched in July advisories but have not appeared in later patched-build lists and were not clearly described as still supported.","This is the third recently disclosed cPanel issue described as starting from an ordinary hosting account, and two recent related flaws already had repositories online presenting themselves as working exploits when The Hacker News checked.","The advisory’s practical risk is harder to assess because it omits a severity score, does not explain the path from SQL injection to root access, and gives no guidance for determining whether a server was compromised before patching."],"referencedReports":[{"title":"Security CVE-2026-67401 SQL Injection Vulnerability in cPanel's EmailTrack Functionality - September 8, 2026","url":"https://support.cpanel.net/hc/en-us/articles/43187903921559-Security-CVE-2026-67401-SQL-Injection-Vulnerability-in-cPanel-s-EmailTrack-Functionality-September-8-2026","publisher":"cPanel","context":"The article cites cPanel's September 8 advisory as the source for the patched EmailTrack SQL injection flaw affecting supported cPanel and WHM versions.","category":"advisory","primary":true},{"title":"How do I update cPanel \u0026 WHM","url":"https://support.cpanel.net/hc/en-us/articles/1500004959421-How-do-I-update-cPanel-WHM","publisher":"cPanel","context":"The article links to cPanel's instructions for updating cPanel and WHM from the command line.","category":"guide","primary":false},{"title":"Security CVE-2026-58048 - Database Privilege Escalation","url":"https://support.cpanel.net/hc/en-us/articles/42285745783703-Security-CVE-2026-58048-Database-Privilege-Escalation","publisher":"cPanel","context":"The article references this July 30 advisory as an example where cPanel provided a temporary mitigation for administrators who could not upgrade immediately.","category":"advisory","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article says CVE-2026-67401 was absent from CISA's Known Exploited Vulnerabilities catalog in the version released on September 8.","category":"advisory","primary":false}],"body":"\u003cp\u003ecPanel has patched CVE-2026-67401, a flaw it describes as an SQL injection issue in EmailTrack. The company says an authenticated hosting account holder with mail-related privileges can create files on the server and then run code as the root user. cPanel published the advisory on September 8 and said every supported version of cPanel and WHM is affected.\u003c/p\u003e\n\n\u003cp\u003eThe issue matters because cPanel is used by customers to manage individual hosting accounts, while WHM lets providers manage the whole machine as root. An attacker with root access could read every hosting account on the server, change files and databases, create hidden accounts, install malware, steal credentials, and move into customer networks. cPanel named fixed builds for release lines 11.110, 11.134, 11.136, 11.138, and WP Squared, and said servers can be updated through WHM or by running \u003ccode\u003e/usr/local/cpanel/scripts/upcp --force\u003c/code\u003e as root.\u003c/p\u003e\n\n\u003cp\u003eThe advisory does not explain how the SQL injection leads to file creation and root access, and it does not provide temporary steps for servers that cannot update immediately. It also does not say whether installing the patched build helps a server that was attacked before the update or how administrators would check for compromise. As of September 9, no public exploit code or exploitation report for CVE-2026-67401 appeared in searches, and it was not listed in CISA’s Known Exploited Vulnerabilities catalog released on September 8.\u003c/p\u003e\n"},{"n":7,"title":"Researcher Drops New Microsoft Defender PoC Showing ShieldBreak Patch Can Be Bypassed","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/researcher-drops-new-microsoft-defender.html","time":"06:47","priority":"SHOULD READ","score":85,"tldr":"A researcher released a new proof-of-concept called ShieldCrash showing Microsoft’s recent patch for the Defender vulnerability ShieldBreak can still be bypassed to read arbitrary files as SYSTEM. The issue reportedly affects supported Windows versions despite the latest Malware Protection Engine update.","briefOverview":"\u003cp\u003eSecurity researcher Chaotic Eclipse released a proof-of-concept for a new Microsoft Defender zero-day called \u003cstrong\u003eShieldCrash\u003c/strong\u003e. The vulnerability is described as a patch bypass for CVE-2026-69414, also known as \u003cstrong\u003eShieldBreak\u003c/strong\u003e, which the researcher reported last month. Chaotic Eclipse said Microsoft did not fully patch the earlier issue and that the same problem can still be triggered under specific conditions.\u003c/p\u003e\n\n\u003cp\u003eThe proof-of-concept demonstrates an arbitrary file read as SYSTEM on the latest version of Windows. The article says all supported versions of the desktop operating system are impacted. Microsoft recently shipped an update to the Microsoft Malware Protection Engine to address CVE-2026-69414, with the issue patched in version 1.1.26080.3.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said its antimalware software relies on timely updates to malware definitions and the Malware Protection Engine, and that default configurations help keep those updates automatic. The company said the update does not require customer action and does not affect systems that have disabled Microsoft Defender. The article also notes that Chaotic Eclipse recently released proof-of-concept exploits for issues affecting CrowdStrike Falcon Sensor, Kaspersky, Avast Antivirus, and NVIDIA.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Security researcher Chaotic Eclipse released a proof-of-concept for a new Microsoft Defender zero-day called ShieldCrash.","ShieldCrash is described as a patch bypass for CVE-2026-69414, also known as ShieldBreak, which Chaotic Eclipse reported the previous month.","The proof-of-concept demonstrates arbitrary file read as SYSTEM on the latest version of Windows, and all supported desktop versions of Windows are said to be impacted.","Microsoft recently shipped an update to the Microsoft Malware Protection Engine to address CVE-2026-69414 in version 1.1.26080.3.","Chaotic Eclipse has also recently released proof-of-concept exploits for vulnerabilities affecting CrowdStrike Falcon Sensor, Kaspersky, Avast Antivirus, and NVIDIA."],"insights":["The new proof-of-concept targets a gap left after Microsoft’s fix, showing that the earlier ShieldBreak issue may still be reachable under specific conditions despite several patch changes.","Microsoft’s advisory says the Malware Protection Engine update requires no customer action when automatic updates are enabled, making update configuration a key factor in whether systems receive the fix promptly.","Systems with Microsoft Defender disabled are stated by Microsoft to be unaffected by CVE-2026-69414, narrowing the scope to environments where Defender is active.","Chaotic Eclipse’s recent releases span multiple major security vendors, with Kaspersky and Avast already patching their reported issues while CrowdStrike is still investigating its report."],"referencedReports":[{"title":"ShieldCrash","url":"https://github.com/MSNightmare/ShieldCrash","publisher":"Chaotic Eclipse","context":"The article references this linked proof-of-concept as the basis for the newly disclosed Microsoft Defender patch bypass.","category":"research","primary":true},{"title":"CVE-2026-69414","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-69414","publisher":"Microsoft","context":"The article cites Microsoft’s advisory for details on the Malware Protection Engine update that addressed CVE-2026-69414.","category":"advisory","primary":false}],"body":"\u003cp\u003eSecurity researcher Chaotic Eclipse released a proof-of-concept for a new Microsoft Defender zero-day called \u003cstrong\u003eShieldCrash\u003c/strong\u003e. The vulnerability is described as a patch bypass for CVE-2026-69414, also known as \u003cstrong\u003eShieldBreak\u003c/strong\u003e, which the researcher reported last month. Chaotic Eclipse said Microsoft did not fully patch the earlier issue and that the same problem can still be triggered under specific conditions.\u003c/p\u003e\n\n\u003cp\u003eThe proof-of-concept demonstrates an arbitrary file read as SYSTEM on the latest version of Windows. The article says all supported versions of the desktop operating system are impacted. Microsoft recently shipped an update to the Microsoft Malware Protection Engine to address CVE-2026-69414, with the issue patched in version 1.1.26080.3.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said its antimalware software relies on timely updates to malware definitions and the Malware Protection Engine, and that default configurations help keep those updates automatic. The company said the update does not require customer action and does not affect systems that have disabled Microsoft Defender. The article also notes that Chaotic Eclipse recently released proof-of-concept exploits for issues affecting CrowdStrike Falcon Sensor, Kaspersky, Avast Antivirus, and NVIDIA.\u003c/p\u003e\n"},{"n":1,"title":"Man gets 15 years for extorting women with AI-generated porn videos","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/man-gets-15-years-in-prison-for-cyberstalking-and-sextortion/","time":"08:44","priority":"MAY READ","score":72,"tldr":"An Ohio man was sentenced to 15 years in prison for cyberstalking and sextortion after using AI tools to create and share explicit deepfake images and videos of victims, including child sexual abuse material. He is the first person convicted under the new Take It Down Act, which bans nonconsensual explicit AI forgeries and revenge porn.","briefOverview":"\u003cp\u003eAn Ohio man, 37-year-old James Strahler II, was sentenced to 15 years in prison for multiple cybercrimes, including sextortion and cyberstalking of numerous victims. He harassed victims through phone calls, voicemails, text messages, and online posts. When he was arrested on federal charges on June 23, 2025, he was also charged with anonymous telecommunications harassment and child pornography production and distribution.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Strahler used more than 100 AI web-based models and more than 24 AI platforms to generate sexually explicit videos and images of his victims. The Justice Department said he sent harassing messages to at least six adult female victims from December 2024 until June 2025, including nude images that were both real and AI-generated. He also created more than 700 images of real victims and animated persons and posted them to a website dedicated to child sexual abuse, while an additional 2,400 images and videos on his phone were flagged as depicting nudity, morphed child sexual abuse material, or violence.\u003c/p\u003e\n\n\u003cp\u003eStrahler shared AI-generated pornographic videos with victims’ co-workers, demanded nude photos from the mothers of multiple women he was harassing, and threatened to leak forged obscene content of their daughters if they did not comply. He also left voicemails with rape threats that mentioned victims’ home addresses and posted online child sexual abuse material generated with AI. Strahler pleaded guilty in April to cyberstalking, producing obscene visual representations of child sexual abuse, and publication of digital forgeries, and the article says he was the first defendant convicted under the 2025 Take It Down Act.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An Ohio man, James Strahler II, was sentenced to 15 years in prison for cybercrimes including sextortion and cyberstalking of numerous victims through phone calls, voicemails, text messages, and online posts.","Court documents said Strahler used more than 100 AI web-based models and more than 24 AI platforms to generate sexually explicit videos and images of his victims.","The Justice Department said Strahler sent harassing messages to at least six adult female victims from December 2024 until June 2025, including nude images that were both real and AI-generated.","Strahler pleaded guilty in April to cyberstalking, producing obscene visual representations of child sexual abuse, and publication of digital forgeries charges.","The article says Strahler was the first defendant convicted of violating the Take It Down Act, a 2025 law prohibiting online publication of explicit content and AI forgeries without consent."],"insights":["The case shows that AI-generated explicit images can be prosecuted alongside traditional cyberstalking and sextortion when they are used to harass, threaten, or coerce victims.","Strahler’s conduct extended beyond direct victims to their co-workers and mothers, showing that nonconsensual explicit forgeries can be used to pressure a wider circle of people around the target.","The article points victims to the FTC’s Take It Down platform as a practical resource for responding when images or videos are shared online without consent.","The scale of Strahler’s use of AI tools was unusually broad, with court documents citing more than 100 AI web-based models and more than 24 AI platforms used to create explicit material."],"referencedReports":[{"title":"Take It Down","url":"https://takeitdown.ftc.gov/#what-else-you-can-do","publisher":"Federal Trade Commission","context":"The article links to the FTC’s Take It Down platform for details on how to protect yourself from cyberstalking attempts and remove images or videos shared online without consent.","category":"guide","primary":false}],"body":"\u003cp\u003eAn Ohio man, 37-year-old James Strahler II, was sentenced to 15 years in prison for multiple cybercrimes, including sextortion and cyberstalking of numerous victims. He harassed victims through phone calls, voicemails, text messages, and online posts. When he was arrested on federal charges on June 23, 2025, he was also charged with anonymous telecommunications harassment and child pornography production and distribution.\u003c/p\u003e\n\n\u003cp\u003eAccording to court documents, Strahler used more than 100 AI web-based models and more than 24 AI platforms to generate sexually explicit videos and images of his victims. The Justice Department said he sent harassing messages to at least six adult female victims from December 2024 until June 2025, including nude images that were both real and AI-generated. He also created more than 700 images of real victims and animated persons and posted them to a website dedicated to child sexual abuse, while an additional 2,400 images and videos on his phone were flagged as depicting nudity, morphed child sexual abuse material, or violence.\u003c/p\u003e\n\n\u003cp\u003eStrahler shared AI-generated pornographic videos with victims’ co-workers, demanded nude photos from the mothers of multiple women he was harassing, and threatened to leak forged obscene content of their daughters if they did not comply. He also left voicemails with rape threats that mentioned victims’ home addresses and posted online child sexual abuse material generated with AI. Strahler pleaded guilty in April to cyberstalking, producing obscene visual representations of child sexual abuse, and publication of digital forgeries, and the article says he was the first defendant convicted under the 2025 Take It Down Act.\u003c/p\u003e\n"}]</script>
