<script type="application/json" id="dl-articles">[{"n":3,"title":"AMOS Malware in AI Agent Skills: Analysis and IoCs","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/poisoned-skills-are-targeting-developer-credentials","time":"18:55","priority":"SHOULD READ","score":88,"tldr":"Cyera identified 516 AI-agent skills linked to the Atomic macOS Stealer (AMOS) campaign, including 70 confirmed malicious skills that received high automated security grades on popular marketplaces. The skills hide fake setup prerequisites that trick users or agents into downloading and executing credential-stealing payloads, demonstrating a major supply-chain risk for AI skill ecosystems.","briefOverview":"\u003cp\u003eCyera Research identified 516 AI skills associated with the Atomic macOS Stealer (AMOS) campaign across AI-skill repositories and related datasets. Of 70 skills confirmed as malicious across six repositories in September 2026, every one had received an A or B automated security grade from a popular marketplace when Cyera found it. The findings show that apparently useful AI-agent skills can conceal harmful installation instructions within ordinary-looking documentation.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned skills commonly present fake software prerequisites, directing macOS users to decode Base64 text and run it through Bash, while Windows users may be told to download and execute a separate package. AMOS can collect browser passwords and session cookies, keychain information, and sensitive files before sending them to attacker-controlled infrastructure. Cyera found substantial infrastructure reuse, with 91.92.242.30 accounting for 83.7% of payload-host references and two glot.io snippets accounting for 95.9% of paste-relay references.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified 516 AI skills associated with the Atomic macOS Stealer (AMOS) campaign across its broader dataset of AI skills, MCP servers, and plugins.","Of 70 skills confirmed as malicious across six repositories in September 2026, all had received an A or B automated security grade from a popular skills marketplace when Cyera found them.","The poisoned skills placed malicious instructions in documentation, commonly presenting a fake prerequisite that directs macOS users to decode and run an encoded Bash command or Windows users to download and run an executable.","AMOS is a macOS information-stealing malware family that can collect browser passwords and session cookies, keychain information, and sensitive files before sending them to attacker-controlled infrastructure.","Cyera found that 91.92.242.30 accounted for 83.7% of payload-host references and that two glot.io snippets accounted for 95.9% of paste-relay references in the analyzed skills."],"insights":["High marketplace safety grades did not reliably identify these threats: all 70 confirmed malicious skills had an A or B grade, and Skills Directory's stated methodology evaluates only the SKILL.md file rather than bundled scripts or other files.","The malicious instructions were commonly embedded about one-quarter of the way through a file under headings such as “Prerequisites,” “Setup,” “IMPORTANT,” or “CRITICAL REQUIREMENT,” making review of setup documentation particularly important.","The campaign's infrastructure showed strong reuse, with one IP address, 91.92.242.30, accounting for 83.7% of payload-host references and two glot.io snippets accounting for 95.9% of paste-relay references.","Most newly identified malicious skills were marked malicious and removed from repositories roughly one week after collection, indicating a period in which published skills could remain available before removal.","Reviewing only SKILL.md may be insufficient because the article cites a JFrog finding of an encoded dropper hidden in a roughly 22 MB README.md file."],"referencedReports":[{"title":"OpenClaw AI Supply Chain Risk","url":"https://unit42.paloaltonetworks.com/openclaw-ai-supply-chain-risk/","publisher":"unit-42","context":"The article cites Unit 42's reporting on a malware-distribution operation using poisoned OpenClaw skills and AMOS-related infrastructure.","category":"research","primary":false}],"body":"\u003cp\u003eCyera Research identified 516 AI skills associated with the Atomic macOS Stealer (AMOS) campaign across AI-skill repositories and related datasets. Of 70 skills confirmed as malicious across six repositories in September 2026, every one had received an A or B automated security grade from a popular marketplace when Cyera found it. The findings show that apparently useful AI-agent skills can conceal harmful installation instructions within ordinary-looking documentation.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned skills commonly present fake software prerequisites, directing macOS users to decode Base64 text and run it through Bash, while Windows users may be told to download and execute a separate package. AMOS can collect browser passwords and session cookies, keychain information, and sensitive files before sending them to attacker-controlled infrastructure. Cyera found substantial infrastructure reuse, with 91.92.242.30 accounting for 83.7% of payload-host references and two glot.io snippets accounting for 95.9% of paste-relay references.\u003c/p\u003e\n"},{"n":2,"title":"Malicious AI Skills: A Risk to Corporate Endpoints","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/how-amos-poisoned-ai-skills-put-corporate-endpoints-at-risk","time":"18:05","priority":"SHOULD READ","score":82,"tldr":"Cyera Research found 70 malicious AI skills posing as developer and productivity tools that instructed users to install the Atomic macOS Stealer (AMOS), potentially exposing corporate credentials, browser sessions, and sensitive files. All carried favorable marketplace security grades, underscoring that organizations must review full skill packages and prevent agents from installing software without explicit human approval.","briefOverview":"\u003cp\u003eCyera Research found 516 exhibits linked to an operation distributing Atomic macOS Stealer (AMOS) and confirmed 70 new malicious AI skills across six repositories and platforms in September 2026. The skills posed as developer and productivity tools, then instructed users to install a supposedly required additional component that delivered credential-stealing malware. All 70 skills had high security grades from Skills Directory when collected, despite being malicious.\u003c/p\u003e\n\n\u003cp\u003eAMOS is designed to collect saved passwords, browser sessions, and sensitive files, which on a corporate Mac could expose company accounts, code, cloud access, or operational information. Skills Directory’s published grading methodology covers the main SKILL.md instruction file rather than all bundled scripts and supporting files, so its grades do not guarantee safety. The article recommends requiring direct human approval before agents install software, reviewing complete skill packages, educating employees to report suspicious AI assets, assigning owners to sensitive skills, and continuously monitoring agent behavior.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera Research identified 516 exhibits associated with an operation distributing Atomic macOS Stealer (AMOS) and confirmed 70 new malicious AI skills across six repositories and platforms in September 2026.","The malicious skills posed as developer and productivity tools and instructed users to install an additional component that delivered AMOS, an information-stealing program for macOS.","All 70 confirmed malicious skills had high security grades from Skills Directory when collected, although its grading methodology focuses on the main instruction file rather than bundled scripts and supporting files.","Developer tooling represented 35.7% of the exhibits, office productivity represented 12.8%, and documents and knowledge represented 3.5%.","The article recommends preventing AI agents from installing software without direct human approval, reviewing full skill packages, educating employees, and monitoring agent behavior."],"insights":["A favorable marketplace grade can create misplaced confidence because Skills Directory’s published methodology evaluates the main SKILL.md instruction file rather than every bundled script and supporting file.","Removing malicious skills from a repository reduces future availability but does not establish whether users or agents already followed their instructions, installed software, or exposed information.","The risk extends beyond the initial AI product approval: a skill can later introduce a dependency, request additional access, or direct activity to an outside service, changing what the agent can do.","Instructions labeled “Prerequisites,” “Setup,” “IMPORTANT,” or “CRITICAL REQUIREMENT” should receive added scrutiny when they demand extra installation before a skill can perform its promised function."],"referencedReports":[],"body":"\u003cp\u003eCyera Research found 516 exhibits linked to an operation distributing Atomic macOS Stealer (AMOS) and confirmed 70 new malicious AI skills across six repositories and platforms in September 2026. The skills posed as developer and productivity tools, then instructed users to install a supposedly required additional component that delivered credential-stealing malware. All 70 skills had high security grades from Skills Directory when collected, despite being malicious.\u003c/p\u003e\n\n\u003cp\u003eAMOS is designed to collect saved passwords, browser sessions, and sensitive files, which on a corporate Mac could expose company accounts, code, cloud access, or operational information. Skills Directory’s published grading methodology covers the main SKILL.md instruction file rather than all bundled scripts and supporting files, so its grades do not guarantee safety. The article recommends requiring direct human approval before agents install software, reviewing complete skill packages, educating employees to report suspicious AI assets, assigning owners to sensitive skills, and continuously monitoring agent behavior.\u003c/p\u003e\n"},{"n":4,"title":"How to Vet AI Agent Skills: Lessons From a Fake PDF Skill","source":"cyera.com","sourceColorIdx":9,"link":"https://www.cyera.com/research/a-malicious-copy-of-anthropics-pdf-skill-highlights-real-world-risks","time":"18:05","priority":"SHOULD READ","score":78,"tldr":"Cyera researchers found a malicious copy of Anthropic’s PDF skill that preserved legitimate-looking files and branding while replacing its instructions and adding a Linux backdoor. Organizations should verify every file and instruction in AI skill packages, restrict agent permissions, and scrutinize unexpected executables or network destinations.","briefOverview":"\u003cp\u003eCyera Research analyzed a malicious copy of Anthropic’s PDF skill that retained the familiar name, description, and 11 files matching the official package. The altered package replaced the main SKILL.md instructions and added a 5 MB Linux executable containing a backdoor. Cyera identified the original ZIP file and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe SKILL.md file was reduced from 315 lines to 19 and instructed the agent to make a network call to a Chinese domain. If the added executable runs, a remote operator may be able to issue commands using the permissions of the account that launched it, although researchers found no direct code or instructions to execute the binary. The article says organizations should verify complete skill packages against their claimed sources, inspect instructions as well as bundled code, investigate unexpected files and network destinations, and limit agent permissions for network access and software execution.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyera researchers identified a malicious copy of Anthropic’s PDF skill that retained its familiar name, description, and 11 legitimate matching files while altering its main instruction file and adding a Linux executable containing a backdoor.","The malicious SKILL.md was reduced from 315 lines to 19 lines and instructed the agent to make a network call to a Chinese domain.","If the added program runs, a remote operator may be able to issue commands with the permissions of the account that launched it.","The researchers found no direct code or instructions to execute the added binary, but the instructions were configured to call an external URL whose domain resolved to a private IP address during the research.","Cyera recommends that organizations verify complete AI skill packages against claimed sources, inspect changed instructions and unexpected files, and limit agent permissions for network access and software execution."],"insights":["A package can appear trustworthy even when its recognizable name, description, and legitimate processing scripts are unchanged, because altered instructions can redefine what an AI agent is asked to do.","Traditional scanning of executable code alone may miss AI-skill risks, since the written instructions that guide an agent’s actions also require review for hidden or unexpected behavior.","Comparing every file in a downloaded skill against its claimed source would have exposed both the rewritten instruction file and the added executable, despite 11 files matching the official package exactly.","The risk from a suspicious skill depends heavily on the permissions available to the agent or account running it, making limits on network access and program execution an important safeguard."],"referencedReports":[],"body":"\u003cp\u003eCyera Research analyzed a malicious copy of Anthropic’s PDF skill that retained the familiar name, description, and 11 files matching the official package. The altered package replaced the main SKILL.md instructions and added a 5 MB Linux executable containing a backdoor. Cyera identified the original ZIP file and five related archives observed between May 23 and July 14, 2026.\u003c/p\u003e\n\n\u003cp\u003eThe SKILL.md file was reduced from 315 lines to 19 and instructed the agent to make a network call to a Chinese domain. If the added executable runs, a remote operator may be able to issue commands using the permissions of the account that launched it, although researchers found no direct code or instructions to execute the binary. The article says organizations should verify complete skill packages against their claimed sources, inspect instructions as well as bundled code, investigate unexpected files and network destinations, and limit agent permissions for network access and software execution.\u003c/p\u003e\n"},{"n":6,"title":"Censys takes census of the Internet like no one else","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/same-vulnerability-different-numbers/","time":"15:01","priority":"MAY READ","score":72,"tldr":"Censys argues that widely differing PHP2Shell exposure counts reflect differences in scanners, units of measurement, banner visibility, query logic, and scan timing. It promotes its first-party Internet Map as a comprehensive way to track affected PHP hosts, web properties, patching progress, and related attacker infrastructure.","briefOverview":"\u003cp\u003ePHP announced emergency fixes on October 20 for two pre-authentication remote code execution flaws, CVE-2026-109618 and CVE-2026-109619, known together as PHP2Shell. The disclosure was complicated by an exploit-chain video posted by a credited research team and by Chainguard publishing rebuilt PHP images before the coordinated release. Reports of real-world exploitation changed rapidly, with two vendors retracting early claims tying incidents to these CVEs, while the flaws were added to CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that differing PHP2Shell exposure totals often reflect different scanners, counting methods, banner availability, search behavior, and scan timing rather than a simple disagreement over facts. A shared-hosting IP can serve thousands of websites, version banners may be hidden or may reflect distributions that have backported fixes, and text searches can accidentally count overlapping version strings repeatedly. Censys says its first-party Internet Map scans all ports daily, identifies services on both common and uncommon ports, excludes honeypots from its PHP2Shell query, and retains historical records to measure when individual services move from affected to fixed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PHP announced emergency fixes on October 20 for two pre-authentication remote code execution flaws, CVE-2026-109618 and CVE-2026-109619, collectively known as PHP2Shell.","Public PHP2Shell exposure counts can differ substantially because sources use different scanners, count different objects such as IP addresses or websites, and apply different matching and timing methods.","Censys states that its Internet Map uses first-party scanners to scan all 65,535 ports daily and fingerprint open services, including PHP services on nonstandard ports.","PHP version banners can overstate exposure because Linux distributions may backport security fixes while retaining older visible version numbers.","Censys says it retains four years of searchable service history, allowing it to track when individual services move from affected to fixed."],"insights":["A single shared-hosting IP address can represent thousands of websites, which Censys says explains how 4.18 million hosts can correspond to 67.6 million web properties.","PHP services that hide their version by disabling the X-Powered-By header can shift reported exposure totals by tens of millions depending on whether a measurement excludes or separately counts them.","Text-based searches for a version such as PHP/5.4.1 can unintentionally include PHP 5.4.10 through 5.4.19, and summing version-by-version results can count the same hosts repeatedly.","During widespread exploitation events, rapidly deployed honeypots can inflate simple exposure counts, which is why Censys excludes services labeled as honeypots from its PHP2Shell query.","Censys reports that newly exposed hosts can be reached within 2 to 11 hours and that services are revisited roughly every 8 to 14 hours, so reported patching changes depend on when scanners observe the updated service."],"referencedReports":[],"body":"\u003cp\u003ePHP announced emergency fixes on October 20 for two pre-authentication remote code execution flaws, CVE-2026-109618 and CVE-2026-109619, known together as PHP2Shell. The disclosure was complicated by an exploit-chain video posted by a credited research team and by Chainguard publishing rebuilt PHP images before the coordinated release. Reports of real-world exploitation changed rapidly, with two vendors retracting early claims tying incidents to these CVEs, while the flaws were added to CISA’s Known Exploited Vulnerabilities catalog.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that differing PHP2Shell exposure totals often reflect different scanners, counting methods, banner availability, search behavior, and scan timing rather than a simple disagreement over facts. A shared-hosting IP can serve thousands of websites, version banners may be hidden or may reflect distributions that have backported fixes, and text searches can accidentally count overlapping version strings repeatedly. Censys says its first-party Internet Map scans all ports daily, identifies services on both common and uncommon ports, excludes honeypots from its PHP2Shell query, and retains historical records to measure when individual services move from affected to fixed.\u003c/p\u003e\n"},{"n":5,"title":"OpenCode User Hit with Hostile Backlash After Reporting Free AI Loophole","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/opencode-free-usage-bypass?utm_medium=feed","time":"16:20","priority":"MAY READ","score":63,"tldr":"An OpenCode user who publicized and later promoted an IP-switching workaround for free hosted AI-model limits was subjected to severe harassment after users blamed them for tighter restrictions. It remains unclear whether OpenCode fully fixed the bypass, while shared VPN users report being caught by network-level enforcement.","briefOverview":"\u003cp\u003eAn OpenCode user reported that free hosted AI-model limits tied to IP addresses could allegedly be bypassed by changing IP addresses through a VPN while keeping a coding session active. The author initially suggested tying limits to accounts and detecting rapid IP changes, but later reopened the issue to promote the workaround and claimed to have used it extensively. The public GitHub thread was later deleted, though an archived version remains available.\u003c/p\u003e\n\n\u003cp\u003eThe discussion drew severe harassment against the reporter, including suicide encouragement, requests for identifying information, and an unsupported claimed million-dollar reward. OpenCode contributors said that enforcing limits without authentication was difficult and that abuse harmed efforts to provide free access. Users also reported that shared VPN addresses were being blocked, sometimes affecting people who said they had not abused the service, while it remained unclear whether OpenCode’s October infrastructure and IP-handling changes fully stopped the IP-switching workaround.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A GitHub issue reported that OpenCode’s free hosted-model usage limits, which were tied to IP addresses, could allegedly be bypassed by switching IP addresses through a VPN while preserving a coding session.","The issue’s author later promoted the workaround and claimed to have run 130 agents across concurrent sessions, changing IP addresses after reaching usage limits.","The public GitHub thread attracted harassment against the reporter, including comments encouraging suicide and requests for identifying information, before it was deleted.","OpenCode contributors said enforcing limits without authentication was difficult and that shared VPN addresses could be flagged, leaving some VPN users unable to access free models.","OpenCode made October infrastructure and IP-handling changes, but the article says it remains unclear whether the reported IP-switching bypass was fully fixed."],"insights":["The reporter’s position reversed over time: they initially proposed binding free-use limits to accounts and detecting rapid IP changes, then later reopened the issue to promote the same IP-switching method.","OpenCode’s October change addressing spoofed IP headers did not necessarily prevent users from switching to a genuinely different IP address through a VPN.","Network-based enforcement can affect users sharing VPN addresses, as OpenCode said it could not make individual exceptions for shared addresses that had been flagged.","The workaround had circulated beyond the GitHub issue before the late-October backlash, with a September Hacker News commenter recommending high-quality proxies for effectively unlimited agent compute.","OpenCode’s application release notes did not announce a fix for the bypass, and the article notes that hosted-service enforcement could have changed separately from a software release."],"referencedReports":[],"body":"\u003cp\u003eAn OpenCode user reported that free hosted AI-model limits tied to IP addresses could allegedly be bypassed by changing IP addresses through a VPN while keeping a coding session active. The author initially suggested tying limits to accounts and detecting rapid IP changes, but later reopened the issue to promote the workaround and claimed to have used it extensively. The public GitHub thread was later deleted, though an archived version remains available.\u003c/p\u003e\n\n\u003cp\u003eThe discussion drew severe harassment against the reporter, including suicide encouragement, requests for identifying information, and an unsupported claimed million-dollar reward. OpenCode contributors said that enforcing limits without authentication was difficult and that abuse harmed efforts to provide free access. Users also reported that shared VPN addresses were being blocked, sometimes affecting people who said they had not abused the service, while it remained unclear whether OpenCode’s October infrastructure and IP-handling changes fully stopped the IP-switching workaround.\u003c/p\u003e\n"},{"n":1,"title":"A quiet week in infosec \u003c.\u003c","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/a-quiet-week-in-infosec/","time":"18:00","priority":"MAY READ","score":40,"tldr":"The key takeaway is that amid actively exploited PHP flaws and other major security issues, effective defense depends on asset visibility, prompt patching, accountable exceptions, and well-supported analysts. Cisco Talos also highlighted NIK C2, an AI-enabled Windows command-and-control framework that can process stolen data using victims’ OpenAI API keys.","briefOverview":"\u003cp\u003eThe newsletter argues that, despite major headlines around PHP and Node.js flaws, the essential security work remains familiar: organizations need to know what systems they own, who owns them, what versions are running, and which are exposed to the internet. It stresses that patches must reach the intended systems and that unpatched systems need an assigned owner, deadline, reduced exposure, and added monitoring. The article emphasizes that capable security teams need enough time and expertise to distinguish unusual behavior from normal activity and act on evidence.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos highlighted NIK C2, a Go-based Windows command-and-control framework that can dump credentials, record keystrokes, deploy screen-locking ransomware, and use an integrated OpenAI model to analyze stolen data. The framework can use victims\u0026rsquo; OpenAI API keys, allowing attackers to process collected data during the compromised session. Talos recommends monitoring for unusual local proxy routing, unexpected PowerShell execution, and unauthorized access to browser databases or crypto wallets, while also using the published ClamAV signature and indicators of compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos reported NIK C2, a Go-based Windows command-and-control framework that can dump credentials, stream keystrokes, deploy screen-locking ransomware, and use an integrated OpenAI model to analyze collected data.","The article says NIK C2 can use victims’ OpenAI API keys for its requests, and recommends monitoring for unusual local proxy routing, unexpected PowerShell activity, and unauthorized browser database or crypto-wallet access.","CISA added two PHP vulnerabilities to its Known Exploited Vulnerabilities catalog and gave agencies days to patch them.","A Google Brotli decoder out-of-bounds write affects Node.js, .NET, PowerShell, and Python packages and can lead to code execution.","The article argues that organizations need accurate knowledge of their systems, prompt patching, assigned owners and deadlines for unpatched systems, reduced exposure, and ongoing monitoring."],"insights":["NIK C2 is notable because it combines data theft and analysis in the same compromised Windows system, while using the victim’s own OpenAI API keys instead of attacker-controlled infrastructure.","For the Gheist activity, deleting the GitHub branch or the workflow run that exposed secrets does not reverse the exposure.","The article emphasizes that systems which cannot yet be patched should have a named owner and deadline, reduced exposure, and continued monitoring rather than an open-ended promise to fix them later."],"referencedReports":[],"body":"\u003cp\u003eThe newsletter argues that, despite major headlines around PHP and Node.js flaws, the essential security work remains familiar: organizations need to know what systems they own, who owns them, what versions are running, and which are exposed to the internet. It stresses that patches must reach the intended systems and that unpatched systems need an assigned owner, deadline, reduced exposure, and added monitoring. The article emphasizes that capable security teams need enough time and expertise to distinguish unusual behavior from normal activity and act on evidence.\u003c/p\u003e\n\n\u003cp\u003eCisco Talos highlighted NIK C2, a Go-based Windows command-and-control framework that can dump credentials, record keystrokes, deploy screen-locking ransomware, and use an integrated OpenAI model to analyze stolen data. The framework can use victims\u0026rsquo; OpenAI API keys, allowing attackers to process collected data during the compromised session. Talos recommends monitoring for unusual local proxy routing, unexpected PowerShell execution, and unauthorized access to browser databases or crypto wallets, while also using the published ClamAV signature and indicators of compromise.\u003c/p\u003e\n"}]</script>

#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
