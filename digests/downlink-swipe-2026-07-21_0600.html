<script type="application/json" id="dl-articles">[{"n":4,"title":"WordPress wp2shell Exploitation Grows as Public Exploit Fuels Mass Scanning","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/wordpress-wp2shell-exploitation-grows.html","time":"08:59","priority":"MUST READ","score":98,"tldr":"Attackers are widely exploiting the wp2shell WordPress vulnerability chain to achieve unauthenticated remote code execution on vulnerable sites, with mass scanning and post-exploitation activity including malicious plugins, web shells, and backdoor admin accounts. Defenders should patch immediately and inspect even patched sites for signs of compromise.","briefOverview":"\u003cp\u003eAttackers have begun exploiting two critical WordPress vulnerabilities, CVE-2026-63030 and CVE-2026-60137, which have been codenamed wp2shell. When chained together, the flaws allow unauthenticated remote code execution and full compromise of vulnerable WordPress websites. WatchTowr said exploitation was already underway by early Saturday UTC, first using public exploit code to exfiltrate hashed credentials and then moving to remote code execution after more details became public.\u003c/p\u003e\n\n\u003cp\u003eThe exploit chain was discovered by Searchlight Cyber using OpenAI GPT 5.6 Sol and is described as affecting default WordPress installations with no plugins and no preconditions. Cloudflare said CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use, while CVE-2026-60137 is present from WordPress 6.8 onward and the RCE affects versions from 6.9. Intruder described CVE-2026-60137 as an entry point involving route confusion in the REST API batch endpoint that can bypass authentication and invoke internal handlers without permission checks.\u003c/p\u003e\n\n\u003cp\u003eWiz observed post-exploitation activity including malicious plugin uploads, user enumeration, local file inclusion attacks targeting database credentials and authentication keys, admin panel access, and PHP web shell uploads. WatchTowr said public exploit release led to indiscriminate internet scanning, with honeypots recording tens of thousands of exploitation attempts and more than 100 backdoor administrator accounts created after exploitation. Defenders are advised to inspect WordPress instances for new administrator accounts, malicious plugins, and suspicious files even if they have already patched.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers have begun exploiting two critical WordPress vulnerabilities, CVE-2026-63030 and CVE-2026-60137, together under the name wp2shell to achieve unauthenticated remote code execution and compromise vulnerable websites.","KEVIntel telemetry linked exploitation of CVE-2026-63030 to 13 unique IP addresses from Switzerland, Germany, the U.K., Indonesia, Lithuania, the Netherlands, and Singapore.","Cloudflare said CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use, while CVE-2026-60137 is present from WordPress version 6.8 onward and the RCE affects versions from 6.9.","Wiz observed post-exploitation activity including malicious plugin uploads, user enumeration, local file inclusion attacks targeting database credentials and authentication keys, admin panel access, and PHP web shell uploads.","WatchTowr said public exploit release led attackers to scan the internet indiscriminately, with honeypots registering tens of thousands of exploitation attempts and more than 100 backdoor administrator accounts created after exploitation."],"insights":["The article says defenders should inspect WordPress instances for compromise even after patching, because exploitation has already resulted in backdoor administrator accounts, malicious plugins, and suspicious files.","Persistent object cache changes the exposure described by Cloudflare, because CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use.","The impact window is broad because the exploit chain reportedly affects default WordPress installations with no plugins and no preconditions across WordPress versions released since December 2025.","The observed CMSmap web shell is more than a simple backdoor, because Wiz described it as a 150 KB full-featured attack platform with file management, database access, port scanning, batch code injection, and privilege escalation modules.","The public exploit appears to have shifted activity from targeted abuse to indiscriminate internet-wide scanning, with WatchTowr honeypots registering tens of thousands of exploitation attempts."],"referencedReports":[{"title":"CVE-2026-63030 Sensor Telemetry","url":"https://kevintel.com/CVE-2026-63030#sensor-telemetry","publisher":"KEVIntel","context":"The article cites KEVIntel telemetry showing 13 unique IP addresses linked to exploitation of CVE-2026-63030.","category":"research","primary":false},{"title":"Exploit Brokers Pay $500,000 for a WordPress RCE. I Found One with GPT-5.6","url":"https://slcyber.io/research-center/exploit-brokers-pay-500000-for-a-wordpress-rce-i-found-one-with-gpt5-6/","publisher":"Searchlight Cyber","context":"The article says Searchlight Cyber discovered the wp2shell exploit chain using OpenAI GPT 5.6 Sol.","category":"research","primary":true},{"title":"WordPress Vulnerabilities","url":"https://blog.cloudflare.com/wordpress-vulnerabilities/","publisher":"Cloudflare","context":"The article references Cloudflare's analysis of when CVE-2026-63030 enables unauthenticated remote code execution and which WordPress versions are affected.","category":"research","primary":false},{"title":"wp2shell CVE-2026-63030 CVE-2026-60137","url":"https://www.wiz.io/blog/wp2shell-cve-2026-63030-cve-2026-60137","publisher":"Wiz","context":"The article cites Wiz data on exposure among WordPress-using organizations and observed post-exploitation activity.","category":"research","primary":true}],"body":"\u003cp\u003eAttackers have begun exploiting two critical WordPress vulnerabilities, CVE-2026-63030 and CVE-2026-60137, which have been codenamed wp2shell. When chained together, the flaws allow unauthenticated remote code execution and full compromise of vulnerable WordPress websites. WatchTowr said exploitation was already underway by early Saturday UTC, first using public exploit code to exfiltrate hashed credentials and then moving to remote code execution after more details became public.\u003c/p\u003e\n\n\u003cp\u003eThe exploit chain was discovered by Searchlight Cyber using OpenAI GPT 5.6 Sol and is described as affecting default WordPress installations with no plugins and no preconditions. Cloudflare said CVE-2026-63030 enables unauthenticated remote code execution only when persistent object cache is not in use, while CVE-2026-60137 is present from WordPress 6.8 onward and the RCE affects versions from 6.9. Intruder described CVE-2026-60137 as an entry point involving route confusion in the REST API batch endpoint that can bypass authentication and invoke internal handlers without permission checks.\u003c/p\u003e\n\n\u003cp\u003eWiz observed post-exploitation activity including malicious plugin uploads, user enumeration, local file inclusion attacks targeting database credentials and authentication keys, admin panel access, and PHP web shell uploads. WatchTowr said public exploit release led to indiscriminate internet scanning, with honeypots recording tens of thousands of exploitation attempts and more than 100 backdoor administrator accounts created after exploitation. Defenders are advised to inspect WordPress instances for new administrator accounts, malicious plugins, and suspicious files even if they have already patched.\u003c/p\u003e\n"},{"n":3,"title":"Critical ServiceNow AI Platform Flaw Exploited for Unauthenticated Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/critical-servicenow-ai-platform-flaw.html","time":"06:29","priority":"MUST READ","score":95,"tldr":"Threat actors are actively exploiting CVE-2026-6875, a critical pre-authentication sandbox escape flaw in ServiceNow AI Platform that can allow unauthenticated arbitrary code execution and full instance compromise. Self-hosted ServiceNow customers should apply the June patches immediately.","briefOverview":"\u003cp\u003eThreat actors are exploiting CVE-2026-6875, a critical security flaw affecting the ServiceNow AI Platform, according to Defused Cyber. The vulnerability has a CVSS score of 9.5 and is described as a sandbox escape issue. It could allow an unauthenticated user to run arbitrary code.\u003c/p\u003e\n\n\u003cp\u003eServiceNow released patches for the flaw throughout June in Brazil EA and Brazil GA, Australia Patch 2, Zurich Patch 7b and Zurich Patch 9, and Yokohama Patch 12 Hot Fix 1b and Yokohama Patch 13. Searchlight Cyber said it reported the issue on April 1, 2026. The company said the flaw allows complete compromise of the ServiceNow instance as well as all connected proxy servers.\u003c/p\u003e\n\n\u003cp\u003eDefused Cyber said exploitation efforts target the pre-authentication endpoint “/assessment_thanks.do” using HTTP POST requests. The firm said the sandbox-escape gadget leads to the same code execution primitive by a different route documented in the proof-of-concept exploit. In light of active exploitation, customers of self-hosted versions are advised to apply the fixes if they have not already done so.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Threat actors are exploiting CVE-2026-6875, a critical sandbox escape vulnerability in the ServiceNow AI Platform, according to Defused Cyber.","CVE-2026-6875 has a CVSS score of 9.5 and could allow an unauthenticated user to run arbitrary code.","ServiceNow released patches for the flaw throughout June in Brazil EA and GA, Australia Patch 2, Zurich Patch 7b and Patch 9, and Yokohama Patch 12 Hot Fix 1b and Patch 13.","Searchlight Cyber said it reported the issue on April 1, 2026, and that the flaw allows complete compromise of the ServiceNow instance and all connected proxy servers.","Defused Cyber said exploitation efforts target the pre-authentication endpoint “/assessment_thanks.do” using HTTP POST requests."],"insights":["Defenders can look specifically for HTTP POST requests to the pre-authentication endpoint “/assessment_thanks.do” because Defused Cyber said current exploitation targets that path.","Detection or mitigation based only on the documented proof-of-concept route may be incomplete, because Defused Cyber said attackers are reaching the same code execution result through a different sandbox-escape route.","ServiceNow’s response goes beyond a direct fix, as the company is also severely restricting what code can run in sandbox contexts to strengthen instance security.","The article specifically calls out self-hosted ServiceNow customers for urgent patching, indicating they need to ensure the June fixes are applied rather than relying on the issue being handled elsewhere."],"referencedReports":[{"title":"KB3137947","url":"https://support.servicenow.com/kb?id=kb_article_view\u0026sysparm_article=KB3137947","publisher":"ServiceNow","context":"The article cites ServiceNow’s support article as the source for the June patch releases addressing the flaw.","category":"advisory","primary":true},{"title":"Smashing the ServiceNow Sandbox: Pre-Authentication RCE","url":"https://slcyber.io/research-center/smashing-the-servicenow-sandbox-pre-authentication-rce/","publisher":"Searchlight Cyber","context":"The article says Searchlight Cyber disclosed additional technical specifics about the vulnerability and reported the issue to ServiceNow on April 1, 2026.","category":"research","primary":true}],"body":"\u003cp\u003eThreat actors are exploiting CVE-2026-6875, a critical security flaw affecting the ServiceNow AI Platform, according to Defused Cyber. The vulnerability has a CVSS score of 9.5 and is described as a sandbox escape issue. It could allow an unauthenticated user to run arbitrary code.\u003c/p\u003e\n\n\u003cp\u003eServiceNow released patches for the flaw throughout June in Brazil EA and Brazil GA, Australia Patch 2, Zurich Patch 7b and Zurich Patch 9, and Yokohama Patch 12 Hot Fix 1b and Yokohama Patch 13. Searchlight Cyber said it reported the issue on April 1, 2026. The company said the flaw allows complete compromise of the ServiceNow instance as well as all connected proxy servers.\u003c/p\u003e\n\n\u003cp\u003eDefused Cyber said exploitation efforts target the pre-authentication endpoint “/assessment_thanks.do” using HTTP POST requests. The firm said the sandbox-escape gadget leads to the same code execution primitive by a different route documented in the proof-of-concept exploit. In light of active exploitation, customers of self-hosted versions are advised to apply the fixes if they have not already done so.\u003c/p\u003e\n"},{"n":5,"title":"New ENCFORGE Ransomware Targets AI Model Files in Langflow RCE Attack","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-encforge-ransomware-targets-ai.html","time":"07:34","priority":"MUST READ","score":94,"tldr":"A threat actor tracked as JADEPUFFER is exploiting an unauthenticated Langflow RCE flaw to deploy ENCFORGE, a new Go-based ransomware built to encrypt AI model weights, vector indexes, and training datasets. Organizations should urgently patch Langflow, rotate exposed credentials, remove unnecessary Docker socket access, and keep immutable backups of AI assets.","briefOverview":"\u003cp\u003eSysdig researchers linked a second attack on the same Langflow server to JADEPUFFER, the AI-agent-driven operator it documented earlier in the month. In this activity, the operator deployed ENCFORGE, a new compiled Go ransomware aimed at encrypting AI infrastructure files such as model weights, vector indexes, training datasets, and other host filesystem data. The entry point was CVE-2025-3248, an unauthenticated remote code execution flaw in Langflow versions before 1.3.0 affecting the \u003ccode\u003e/api/v1/validate/code\u003c/code\u003e endpoint.\u003c/p\u003e\n\n\u003cp\u003eENCFORGE was recovered from the attacker’s command-and-control server as a hidden \u003ccode\u003e/.lockd\u003c/code\u003e file and was described as a UPX-packed static Go ELF. Its default extension list includes PyTorch and TensorFlow checkpoints, Hugging Face SafeTensors, ONNX, GGUF, GGML, FAISS indexes, Parquet and Arrow datasets, NumPy arrays, and TensorFlow records. The ransomware uses AES-256-CTR, wraps the per-run key with an embedded RSA-2048 public key, renames processed files with a \u003ccode\u003e.locked\u003c/code\u003e extension, drops ransom notes, and deletes itself after running.\u003c/p\u003e\n\n\u003cp\u003eAfter confirming code execution, the operator found the Docker socket at \u003ccode\u003e/var/run/docker.sock\u003c/code\u003e and adapted when an initial attempt to pull ENCFORGE failed. Over five minutes and 24 seconds, the operator created and revised six Python scripts through the Langflow RCE channel until it could create a privileged container, mount the host filesystem, copy ENCFORGE through \u003ccode\u003e/proc/\u0026lt;pid\u0026gt;/root\u003c/code\u003e, and run it on the host with \u003ccode\u003ensenter\u003c/code\u003e. The article recommends upgrading Langflow to 1.9.1 or a current supported release, rotating credentials, removing unnecessary Docker socket access, alerting on privileged container behavior, and keeping model weights, vector indexes, and training datasets in offline or immutable snapshots.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sysdig linked a second attack on the same Langflow server to JADEPUFFER, an AI-agent-driven operator previously documented earlier in the month.","The attacker deployed ENCFORGE, a new compiled Go ransomware designed to encrypt AI-related files such as model weights, vector indexes, training datasets, PyTorch and TensorFlow checkpoints, SafeTensors, ONNX, GGUF, FAISS indexes, Parquet, Arrow, NumPy arrays, and TensorFlow records.","The entry point was CVE-2025-3248, an unauthenticated remote code execution flaw in Langflow versions before 1.3.0 affecting the /api/v1/validate/code endpoint.","After finding the Docker socket at /var/run/docker.sock, the operator created and revised six Python scripts through Langflow RCE to launch a privileged container, mount the host filesystem, copy ENCFORGE to the host, and run it with nsenter.","The article recommends upgrading Langflow to 1.9.1 or a current supported release, rotating credentials accessible to Langflow, removing unnecessary Docker socket access, alerting on privileged container behavior, and keeping model artifacts in offline or immutable snapshots."],"insights":["ENCFORGE’s focus on LoRA adapters, GGUF and GGML weights, FAISS indexes, and training data shows the attacker is deliberately targeting AI infrastructure rather than using a generic file-locking tool.","The exposed Docker socket turned a vulnerable Langflow container into host-level control because the operator could create privileged containers with host PID, host networking, and read-write host filesystem mounts.","The attacker adapted quickly when its first payload delivery attempt failed, creating and revising six Python scripts in just over five minutes to reach the host through Docker.","Because ENCFORGE has no exfiltration capability, leak site, Tor portal, or observed data theft, its extortion pressure depends entirely on whether victims can restore encrypted AI files.","Patching Langflow alone is insufficient after compromise because the article states that AI provider keys, cloud credentials, database secrets, and other tokens accessible to the Langflow process may already have been harvested."],"referencedReports":[{"title":"JADEPUFFER evolves: the agentic threat actor deploys ransomware built to destroy AI models","url":"https://www.sysdig.com/blog/jadepuffer-evolves-the-agentic-threat-actor-deploys-ransomware-built-to-destroy-ai-models","publisher":"Sysdig","context":"The article relies on Sysdig’s technical analysis of the ENCFORGE payload, JADEPUFFER activity, indicators, and mitigations.","category":"research","primary":true},{"title":"Langflow security advisory GHSA-rvqx-wpfh-mfx7","url":"https://github.com/langflow-ai/langflow/security/advisories/GHSA-rvqx-wpfh-mfx7","publisher":"Langflow / GitHub","context":"The article cites this advisory for the unauthenticated Langflow /api/v1/validate/code remote code execution flaw fixed in version 1.3.0.","category":"advisory","primary":false},{"title":"CVE-2025-3248 Detail","url":"https://nvd.nist.gov/vuln/detail/CVE-2025-3248","publisher":"National Vulnerability Database","context":"The article links to the NVD entry for CVE-2025-3248, the Langflow vulnerability used as the entry point in the campaign.","category":"advisory","primary":false},{"title":"CISA Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/news-events/alerts/2025/05/05/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article notes that CVE-2025-3248 has been added to CISA’s Known Exploited Vulnerabilities catalog.","category":"advisory","primary":false}],"body":"\u003cp\u003eSysdig researchers linked a second attack on the same Langflow server to JADEPUFFER, the AI-agent-driven operator it documented earlier in the month. In this activity, the operator deployed ENCFORGE, a new compiled Go ransomware aimed at encrypting AI infrastructure files such as model weights, vector indexes, training datasets, and other host filesystem data. The entry point was CVE-2025-3248, an unauthenticated remote code execution flaw in Langflow versions before 1.3.0 affecting the \u003ccode\u003e/api/v1/validate/code\u003c/code\u003e endpoint.\u003c/p\u003e\n\n\u003cp\u003eENCFORGE was recovered from the attacker’s command-and-control server as a hidden \u003ccode\u003e/.lockd\u003c/code\u003e file and was described as a UPX-packed static Go ELF. Its default extension list includes PyTorch and TensorFlow checkpoints, Hugging Face SafeTensors, ONNX, GGUF, GGML, FAISS indexes, Parquet and Arrow datasets, NumPy arrays, and TensorFlow records. The ransomware uses AES-256-CTR, wraps the per-run key with an embedded RSA-2048 public key, renames processed files with a \u003ccode\u003e.locked\u003c/code\u003e extension, drops ransom notes, and deletes itself after running.\u003c/p\u003e\n\n\u003cp\u003eAfter confirming code execution, the operator found the Docker socket at \u003ccode\u003e/var/run/docker.sock\u003c/code\u003e and adapted when an initial attempt to pull ENCFORGE failed. Over five minutes and 24 seconds, the operator created and revised six Python scripts through the Langflow RCE channel until it could create a privileged container, mount the host filesystem, copy ENCFORGE through \u003ccode\u003e/proc/\u0026lt;pid\u0026gt;/root\u003c/code\u003e, and run it on the host with \u003ccode\u003ensenter\u003c/code\u003e. The article recommends upgrading Langflow to 1.9.1 or a current supported release, rotating credentials, removing unnecessary Docker socket access, alerting on privileged container behavior, and keeping model weights, vector indexes, and training datasets in offline or immutable snapshots.\u003c/p\u003e\n"},{"n":6,"title":"New Project CAV3RN module abuses Outlook calendar events for C2 and DNS AAAA records for configuration recovery","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/project-cav3rn-cyberespionage-framework-using-outlook-and-dns/120757/","time":"08:40","priority":"SHOULD READ","score":88,"tldr":"Kaspersky analyzed a new Project CAV3RN communication module that replaces traditional C2 with Microsoft Graph access to hidden Outlook calendar events for commands, results, and heartbeats. If Microsoft Graph access fails, the module can recover updated tenant, app, secret, and mailbox settings through actor-controlled DNS AAAA records, reinforcing the assessment that the OilRig-linked framework remains actively developed.","briefOverview":"\u003cp\u003eKaspersky analyzed a new Project CAV3RN communication module named \u003ccode\u003eAzureCommunication.dll\u003c/code\u003e, a .NET Native AOT DLL that appears designed to replace the framework’s previous HTTP/WebSocket communication component. The module exchanges commands, heartbeats, and command results through Outlook calendar events accessed with Microsoft Graph. Project CAV3RN has been used for cyberespionage activity against targets in Israel, and Kaspersky retains a low-confidence assessment that it is associated with OilRig.\u003c/p\u003e\n\n\u003cp\u003eThe module stores its Microsoft Graph configuration in a relative file named \u003ccode\u003elogAzure.txt\u003c/code\u003e or creates it from hardcoded values if the file is absent. It uses a configured Microsoft Entra tenant, application credentials, and target mailbox to access the mailbox’s default calendar, placing all command, heartbeat, and result events in the fixed one-hour window of May 13, 2050, from 22:00 to 23:00 UTC. Commands and results are carried as encrypted attachments, using RSA-OAEP with SHA-256 and AES-256-GCM.\u003c/p\u003e\n\n\u003cp\u003eIf OAuth token acquisition or the Microsoft Graph organization validation request fails, the module attempts to recover replacement TenantId, ClientId, ClientSecret, and UserEmail values through DNS AAAA responses from \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e. The DNS recovery system embeds the agent ID and field index into queries and treats returned IPv6 addresses as containers for length and configuration fragments rather than network destinations. Kaspersky states that the framework changed repeatedly between December 2025 and May 2026, indicating that development remains active.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky identified a .NET Native AOT communication module named AzureCommunication.dll that appears designed to replace Project CAV3RN’s previous HTTP/WebSocket communication component.","The module exchanges commands, heartbeats, and command results through Outlook calendar events accessed via Microsoft Graph in the default calendar of a configured mailbox.","Commands and results are stored as encrypted calendar event attachments using RSA-OAEP with SHA-256 and AES-256-GCM, with events placed in a fixed one-hour window on May 13, 2050.","If Microsoft Graph authentication or organization validation fails, the module attempts to recover replacement TenantId, ClientId, ClientSecret, and UserEmail values through DNS AAAA responses from cloudlanecdn.com.","Kaspersky retains a low-confidence assessment that Project CAV3RN is associated with OilRig based on behavioral similarities such as use of Microsoft-hosted services, attachment-based command exchange, and a secondary mechanism for restoring cloud C2 access."],"insights":["The module keeps all command, heartbeat, and result events in the same one-hour calendar window in 2050, making that unusual future date range and the specific subject prefixes actionable hunting criteria in Microsoft 365 environments.","The legacy URL argument is still accepted but ignored, which indicates the new module was built to remain compatible with the existing CAV3RN controller interface while shifting the actual communication path to Microsoft Graph.","The DNS recovery mechanism updates only TenantId, ClientId, ClientSecret, and UserEmail, so the hardcoded recovery domain and RSA keys remain fixed even when Microsoft Graph connection details are rotated.","The module writes its complete Microsoft Graph configuration to a relative file named logAzure.txt in the host process’s current working directory, creating a local artifact that may expose tenant, application, mailbox, DNS host, and key material.","Command and result attachments differ consistently by capitalization, with inbound commands using file0.txt and outbound results using File0.txt, providing a small but concrete detail for distinguishing traffic direction in recovered calendar artifacts."],"referencedReports":[{"title":"CAVERN Manticore: Exposing Iran-linked modular C2 framework","url":"https://research.checkpoint.com/2026/cavern-manticore-exposing-iran-linked-modular-c2-framework/","publisher":"Check Point Research","context":"The article says Check Point Research publicly reported on the same controller-based Project CAV3RN architecture in July 2026.","category":"research","primary":false},{"title":"HollowGraph: Microsoft 365","url":"https://www.group-ib.com/blog/hollowgraph-microsoft-365/","publisher":"Group-IB","context":"The article says additional public research covering the same communication component became available during preparation of the report.","category":"research","primary":false},{"title":"OilRig Uses Novel C2 Channel Steganography","url":"https://unit42.paloaltonetworks.com/oilrig-novel-c2-channel-steganography/","publisher":"Unit 42","context":"The article cites Unit 42 research on RDAT malware using Microsoft-hosted services for command-and-control activity.","category":"research","primary":false},{"title":"OilRig’s persistent attacks using cloud service-powered downloaders","url":"https://www.welivesecurity.com/en/eset-research/oilrig-persistent-attacks-cloud-service-powered-downloaders/","publisher":"ESET Research","context":"The article cites ESET research for prior cases involving SC5k, OilCheck, and OilBooster malware using Microsoft cloud services and recovery mechanisms.","category":"research","primary":false},{"title":"OilRig’s Outer Space and Juicy Mix: Same ol’ rig, new drill pipes!","url":"https://www.welivesecurity.com/en/eset-research/oilrigs-outer-space-juicy-mix-same-ol-rig-new-drill-pipes/","publisher":"ESET Research","context":"The article cites ESET research describing OilRig’s use of compromised regional infrastructure, including Solar malware communicating through an Israeli human-resources company website.","category":"research","primary":false},{"title":"Iranian malware attacks Iraqi government","url":"https://research.checkpoint.com/2024/iranian-malware-attacks-iraqi-government/","publisher":"Check Point Research","context":"The article cites Check Point Research on Whisper and Veaty malware using compromised Iraqi government Microsoft 365 mailboxes.","category":"research","primary":false}],"body":"\u003cp\u003eKaspersky analyzed a new Project CAV3RN communication module named \u003ccode\u003eAzureCommunication.dll\u003c/code\u003e, a .NET Native AOT DLL that appears designed to replace the framework’s previous HTTP/WebSocket communication component. The module exchanges commands, heartbeats, and command results through Outlook calendar events accessed with Microsoft Graph. Project CAV3RN has been used for cyberespionage activity against targets in Israel, and Kaspersky retains a low-confidence assessment that it is associated with OilRig.\u003c/p\u003e\n\n\u003cp\u003eThe module stores its Microsoft Graph configuration in a relative file named \u003ccode\u003elogAzure.txt\u003c/code\u003e or creates it from hardcoded values if the file is absent. It uses a configured Microsoft Entra tenant, application credentials, and target mailbox to access the mailbox’s default calendar, placing all command, heartbeat, and result events in the fixed one-hour window of May 13, 2050, from 22:00 to 23:00 UTC. Commands and results are carried as encrypted attachments, using RSA-OAEP with SHA-256 and AES-256-GCM.\u003c/p\u003e\n\n\u003cp\u003eIf OAuth token acquisition or the Microsoft Graph organization validation request fails, the module attempts to recover replacement TenantId, ClientId, ClientSecret, and UserEmail values through DNS AAAA responses from \u003ccode\u003ecloudlanecdn[.]com\u003c/code\u003e. The DNS recovery system embeds the agent ID and field index into queries and treats returned IPv6 addresses as containers for length and configuration fragments rather than network destinations. Kaspersky states that the framework changed repeatedly between December 2025 and May 2026, indicating that development remains active.\u003c/p\u003e\n"},{"n":2,"title":"Windows LegacyHive zero-day flaw gets free, unofficial patches","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/windows-legacyhive-zero-day-flaw-gets-free-unofficial-patches/","time":"08:06","priority":"SHOULD READ","score":84,"tldr":"Free unofficial 0patch micropatches are available for the Windows LegacyHive zero-day, which lets non-admin users gain access to other users’ registry hives and potentially escalate privileges. Microsoft is still investigating and has not yet issued an official patch or CVE.","briefOverview":"\u003cp\u003eFree unofficial patches are available for a recently disclosed Windows zero-day flaw called LegacyHive. The flaw allows attackers to escalate privileges on up-to-date Windows systems and was found in the Windows User Profile Service by a researcher using the handle Nightmare Eclipse. Microsoft said it is aware of the reported vulnerability and is actively investigating the validity and potential applicability of the claims.\u003c/p\u003e\n\n\u003cp\u003eAfter analyzing the proof-of-concept exploit, Tharros principal vulnerability analyst Will Dormann said non-admin users can exploit LegacyHive to modify the classes registry hive and gain automatic code execution when an admin account logs into a compromised device. ACROS Security CEO Mitja Kolsek said the vulnerability allows a regular non-admin user to mount any other user\u0026rsquo;s registry hive in full access mode, extract stored secrets, or modify registry values that affect what runs the next time that user logs in. Cybersecurity expert Kevin Beaumont confirmed that the exploit works and published LegacyHive detection queries for Microsoft Defender for Endpoint.\u003c/p\u003e\n\n\u003cp\u003eACROS Security, the company behind the 0Patch platform, released free micropatches for Windows 10 2004 or later and Windows Server 2022 or later. The company said the flaw does not affect systems running Windows versions older than Windows 10 2004 and Windows Server 2019. According to ACROS Security, with 0patch enabled, the exploit still appears to work but loads a temporary user profile hive instead of the admin user\u0026rsquo;s hive, which is of no use to the attacker.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Free unofficial patches are available from ACROS Security’s 0Patch platform for the Windows LegacyHive zero-day flaw.","LegacyHive was disclosed by a researcher using the handle Nightmare Eclipse and affects the Windows User Profile Service.","The vulnerability allows a regular non-admin user to mount another user’s registry hive with full access, potentially extracting stored secrets or changing registry values that affect what runs when that user next logs in.","Microsoft said it is aware of the reported vulnerability and is actively investigating its validity and potential applicability.","ACROS Security provides micropatches for Windows 10 2004 or later and Windows Server 2022 or later, and says the flaw does not affect Windows versions older than Windows 10 2004 and Windows Server 2019."],"insights":["The unofficial 0Patch fix does not stop the exploit from appearing to run, but redirects it to load a temporary user profile hive that ACROS Security says is useless to the attacker.","LegacyHive can be abused without administrator rights, making it relevant to any scenario where an attacker or local user already has ordinary access to a Windows system.","Detection content for LegacyHive was published for Microsoft Defender for Endpoint shortly after the proof-of-concept was released, giving defenders an option to hunt for activity while Microsoft investigates.","The disclosed proof-of-concept was intentionally stripped down to make weaponization harder, but multiple experts still confirmed the exploit works."],"referencedReports":[{"title":"Micropatches Available for LegacyHive Windows User Profile Service Elevation of Privilege Vulnerability","url":"https://0patch.com/blog/micropatches-available-for-legacyhive-windows-user-profile-service-elevation-of-p","publisher":"ACROS Security / 0patch","context":"The article cites ACROS Security’s 0patch blog explaining the LegacyHive flaw and announcing free unofficial micropatches.","category":"advisory","primary":true}],"body":"\u003cp\u003eFree unofficial patches are available for a recently disclosed Windows zero-day flaw called LegacyHive. The flaw allows attackers to escalate privileges on up-to-date Windows systems and was found in the Windows User Profile Service by a researcher using the handle Nightmare Eclipse. Microsoft said it is aware of the reported vulnerability and is actively investigating the validity and potential applicability of the claims.\u003c/p\u003e\n\n\u003cp\u003eAfter analyzing the proof-of-concept exploit, Tharros principal vulnerability analyst Will Dormann said non-admin users can exploit LegacyHive to modify the classes registry hive and gain automatic code execution when an admin account logs into a compromised device. ACROS Security CEO Mitja Kolsek said the vulnerability allows a regular non-admin user to mount any other user\u0026rsquo;s registry hive in full access mode, extract stored secrets, or modify registry values that affect what runs the next time that user logs in. Cybersecurity expert Kevin Beaumont confirmed that the exploit works and published LegacyHive detection queries for Microsoft Defender for Endpoint.\u003c/p\u003e\n\n\u003cp\u003eACROS Security, the company behind the 0Patch platform, released free micropatches for Windows 10 2004 or later and Windows Server 2022 or later. The company said the flaw does not affect systems running Windows versions older than Windows 10 2004 and Windows Server 2019. According to ACROS Security, with 0patch enabled, the exploit still appears to work but loads a temporary user profile hive instead of the admin user\u0026rsquo;s hive, which is of no use to the attacker.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft shares manual fix for WSUS sync delays and timeouts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-shares-manual-fix-for-wsus-sync-delays-and-timeouts/","time":"09:05","priority":"SHOULD READ","score":78,"tldr":"Microsoft provided manual cleanup steps for existing WSUS servers still suffering from synchronization delays and timeouts caused by excess publishing metadata. Admins should back up SUSDB, run Microsoft’s cleanup query, reindex and clean up WSUS, then reset IIS or recycle WsusPool to restore normal update scans.","briefOverview":"\u003cp\u003eMicrosoft shared manual mitigations for Windows Server Update Services servers affected by a known issue that causes Windows Update scans to fail or time out. The issue affects Windows 10 version 1607 and later and Windows Server 2012 and later. On impacted WSUS servers, administrators may be unable to deploy the latest Windows updates through WSUS or Configuration Manager because of increased synchronization times or sync operation timeouts caused by a buildup of publishing metadata.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft rolled out a service-side mitigation on Saturday for newly installed or rebuilt WSUS servers after heightened impact was observed starting July 13. The company said synchronization times and sync operations have been restored and are operating normally for new WSUS installations and rebuilds. For organizations with existing WSUS installations that still have long sync times, Microsoft said unneeded metadata can be safely removed.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s manual steps require administrators to back up each SUSDB database, run a cleanup query from SQL Management Studio against all SUSDB databases including WSUS replicas, and update the MaxXMLPerRequest value to its default setting. After cleanup, Microsoft says the first Windows Update scan may take longer than usual, but later scans should return to normal timing. Microsoft also recommends reindexing SUSDB, running the WSUS Server Cleanup Wizard, and running IISReset or recycling the WsusPool application pool to clear cached catalog state.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft shared manual mitigations for Windows Server Update Services servers affected by a known issue that causes Windows Update scans to fail or time out.","The issue affects Windows 10 version 1607 and later, as well as Windows Server 2012 and later, and can prevent admins from deploying the latest Windows updates through WSUS or Configuration Manager.","Microsoft said synchronization times and operations have been restored for new WSUS installations and rebuilds after a service-side mitigation was rolled out.","For existing affected WSUS installations, Microsoft recommends backing up each SUSDB database, running a cleanup query against all SUSDB databases, and resetting MaxXMLPerRequest to its default setting.","After cleanup, Microsoft says administrators should reindex SUSDB, run the WSUS Server Cleanup Wizard, and run IISReset or recycle the WsusPool application pool to clear cached catalog state."],"insights":["Microsoft’s service-side mitigation only restores normal synchronization for newly installed or rebuilt WSUS servers, so organizations with existing affected servers may still need to perform the manual cleanup.","The problematic metadata in existing WSUS installations can be safely removed, according to Microsoft, making database cleanup an endorsed remediation rather than a risky workaround.","Microsoft specifically says the cleanup query must be run against all SUSDB databases, including WSUS replicas, which means partial cleanup may not fully resolve the issue in replicated environments.","The first Windows Update scan after cleanup may still take longer than usual, so administrators should not treat one slow post-cleanup scan as evidence that the fix failed.","Microsoft says the client-side DataStore.edb file does not shrink automatically after the metadata is removed, but this is expected and does not affect scan performance."],"referencedReports":[{"title":"Resolved issues in Windows Server 2025","url":"https://learn.microsoft.com/en-us/windows/release-health/resolved-issues-windows-server-2025#3549msgdesc:~:text=Resolution","publisher":"microsoft","context":"The article cites Microsoft’s Windows release health dashboard update for the explanation that existing WSUS installations can be cleaned up by removing unneeded metadata.","category":"advisory","primary":true},{"title":"KB5121986: Windows Server Update Service sync operations issues and timeouts","url":"https://support.microsoft.com/en-us/servicing/os/windows/docs/2026/07/kb5121986-windows-server-update-service-sync-operations-issues-and-timeouts","publisher":"microsoft","context":"The article references Microsoft’s support advisory for the manual cleanup steps, including backing up SUSDB, running the cleanup query, reindexing, using the WSUS Server Cleanup Wizard, and resetting IIS or WsusPool.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft shared manual mitigations for Windows Server Update Services servers affected by a known issue that causes Windows Update scans to fail or time out. The issue affects Windows 10 version 1607 and later and Windows Server 2012 and later. On impacted WSUS servers, administrators may be unable to deploy the latest Windows updates through WSUS or Configuration Manager because of increased synchronization times or sync operation timeouts caused by a buildup of publishing metadata.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft rolled out a service-side mitigation on Saturday for newly installed or rebuilt WSUS servers after heightened impact was observed starting July 13. The company said synchronization times and sync operations have been restored and are operating normally for new WSUS installations and rebuilds. For organizations with existing WSUS installations that still have long sync times, Microsoft said unneeded metadata can be safely removed.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft’s manual steps require administrators to back up each SUSDB database, run a cleanup query from SQL Management Studio against all SUSDB databases including WSUS replicas, and update the MaxXMLPerRequest value to its default setting. After cleanup, Microsoft says the first Windows Update scan may take longer than usual, but later scans should return to normal timing. Microsoft also recommends reindexing SUSDB, running the WSUS Server Cleanup Wizard, and running IISReset or recycling the WsusPool application pool to clear cached catalog state.\u003c/p\u003e\n"},{"n":7,"title":"When Production Stops Anyway","source":"radiflow.com","sourceColorIdx":2,"link":"https://www.radiflow.com/blog/when-production-stops-anyway/","time":"06:47","priority":"MAY READ","score":70,"tldr":"The Fairlife ransomware incident shows that food and beverage production can be forced to stop even without confirmed OT compromise, because plants depend on IT systems for traceability, quality release, scheduling, and logistics. The key lesson is that manufacturers need clear visibility and segmentation across IT and plant environments so they can make evidence-based shutdown and restart decisions.","briefOverview":"\u003cp\u003eOn 16 July, The Coca-Cola Company disclosed that its dairy subsidiary Fairlife detected unauthorised access to part of its systems, including production-related systems, in connection with a ransomware attack. Production across Fairlife’s US operations was temporarily suspended, while Canadian operations were not affected. The company reported that product quality and safety were not impacted, no group had claimed responsibility at the time of writing, and the full scope was still under investigation.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that there is no public confirmation the attackers reached Fairlife’s OT network, yet production stopped anyway. It argues that food and beverage production depends not only on control systems, but also on scheduling, recipe management, quality release, traceability, labelling, and logistics systems. If a ransomware incident undermines trust in those records or takes them offline, stopping production is presented as the only defensible decision in a regulated food environment.\u003c/p\u003e\n\n\u003cp\u003eThe article says food and beverage manufacturers face particular pressure during cyber incidents because inputs and outputs are perishable, delivery windows matter, and food safety requirements do not flex for cyber disruption. Recovery is described as unfinished when servers are restored, because quality and food safety teams must be able to stand behind the product before lines restart. It recommends that operators understand which IT systems production depends on, maintain visibility into plant networks and their connections, and use segmentation and separation to support evidence-based stop, contain, and restart decisions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Coca-Cola Company disclosed on 16 July that its dairy subsidiary Fairlife detected unauthorised access to part of its systems, including production-related systems, in connection with a ransomware attack.","Production across Fairlife’s US operations was temporarily suspended, while Canadian operations were not affected and product quality and safety were reported as unimpacted.","The article states that there is no public confirmation that the attackers reached Fairlife’s OT network, but production stopped anyway because food and beverage manufacturing depends on systems for scheduling, recipe management, quality release, traceability, labelling, and logistics.","The article argues that if a ransomware incident casts doubt on the integrity of traceability records or takes them offline, stopping production is the only defensible decision in a regulated food environment.","The article says food and beverage manufacturers should understand which IT systems production depends on, maintain visibility into plant networks and their connections, and use segmentation and separation to support incident response decisions."],"insights":["A food manufacturer may have to halt production because it cannot trust or access traceability, quality, labeling, or logistics records, even when there is no confirmed compromise of plant control systems.","In food and beverage operations, recovery from a cyber incident is not complete when servers are restored; production can only resume when quality and food safety teams can stand behind the product again.","Perishable inputs and outputs make downtime more costly in food manufacturing because raw materials keep arriving, finished products have shelf lives, and missed retail delivery windows can quickly create visible shelf gaps.","The article frames segmentation and separation as tools that buy operators decision-making options during an incident, as illustrated by Fairlife’s US operations being affected while Canadian operations were not.","The most actionable distinction is whether an operator can decide to stop or continue based on evidence from its own environment, rather than stopping simply because it lacks visibility into what systems are affected."],"referencedReports":[],"body":"\u003cp\u003eOn 16 July, The Coca-Cola Company disclosed that its dairy subsidiary Fairlife detected unauthorised access to part of its systems, including production-related systems, in connection with a ransomware attack. Production across Fairlife’s US operations was temporarily suspended, while Canadian operations were not affected. The company reported that product quality and safety were not impacted, no group had claimed responsibility at the time of writing, and the full scope was still under investigation.\u003c/p\u003e\n\n\u003cp\u003eThe article emphasizes that there is no public confirmation the attackers reached Fairlife’s OT network, yet production stopped anyway. It argues that food and beverage production depends not only on control systems, but also on scheduling, recipe management, quality release, traceability, labelling, and logistics systems. If a ransomware incident undermines trust in those records or takes them offline, stopping production is presented as the only defensible decision in a regulated food environment.\u003c/p\u003e\n\n\u003cp\u003eThe article says food and beverage manufacturers face particular pressure during cyber incidents because inputs and outputs are perishable, delivery windows matter, and food safety requirements do not flex for cyber disruption. Recovery is described as unfinished when servers are restored, because quality and food safety teams must be able to stand behind the product before lines restart. It recommends that operators understand which IT systems production depends on, maintain visibility into plant networks and their connections, and use segmentation and separation to support evidence-based stop, contain, and restart decisions.\u003c/p\u003e\n"}]</script>
