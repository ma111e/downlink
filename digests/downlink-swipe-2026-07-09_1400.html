<script type="application/json" id="dl-articles">[{"n":10,"title":"Injective npm Supply Chain Attack: 18 Packages Backdoored to Steal Crypto Wallet Keys","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/injective-npm-supply-chain-attack-18-packages-backdoored-to-steal-crypto-wallet-keys","time":"16:42","priority":"MUST READ","score":94,"tldr":"Attackers compromised a trusted Injective Labs developer account and published backdoored npm packages that stole wallet seed phrases and private keys during wallet creation or loading. Anyone who installed the affected 1.20.21 packages should treat touched wallet secrets as exposed and rotate funds to new wallets.","briefOverview":"\u003cp\u003eOn July 8, 2026, attackers used access to a trusted developer\u0026rsquo;s account to add a backdoor to Injective Labs\u0026rsquo; official TypeScript SDK for the Injective blockchain. The malicious version, 1.20.21, was published across 18 related \u003ccode\u003e@injectivelabs\u003c/code\u003e npm packages and remained live for less than an hour before being pulled and fixed. Applications that installed any affected package during that window, or later used a cached copy, should treat any wallet secrets handled by those packages as exposed.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor was disguised as harmless key-derivation telemetry and was placed directly in \u003ccode\u003ePrivateKey.fromMnemonic()\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex()\u003c/code\u003e, the SDK entry points for turning wallet recovery phrases or raw private keys into signing keys. When those functions were called, the code captured the mnemonic or private key, batched the data briefly, base64-encoded it, and sent it to \u003ccode\u003ehttps://testnet.archival.chain.grpc-web.injective.network/\u003c/code\u003e. The data was carried in the \u003ccode\u003eX-Request-Id\u003c/code\u003e request header with an empty body and a \u003ccode\u003eContent-Type\u003c/code\u003e meant to resemble legitimate gRPC-Web traffic.\u003c/p\u003e\n\n\u003cp\u003eThe article says the malicious release came through the repository\u0026rsquo;s own GitHub Actions trusted-publishing workflow, with provenance pointing to a commit on \u003ccode\u003emaster\u003c/code\u003e authored under the existing maintainer identity \u003ccode\u003ethomasRalee\u003c/code\u003e. The 17 non-\u003ccode\u003esdk-ts\u003c/code\u003e packages did not contain the payload themselves, but they pinned the exact backdoored \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e dependency. A later revert removed the telemetry file and call sites, and clean version \u003ccode\u003e1.20.23\u003c/code\u003e was published across all 18 affected packages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On July 8, 2026, attackers used access to a trusted developer's account to add a backdoor to Injective Labs' TypeScript SDK for the Injective blockchain.","The malicious code was disguised as key derivation telemetry and sent wallet recovery phrases or raw private keys to an attacker-controlled server when PrivateKey.fromMnemonic() or PrivateKey.fromHex() was called.","The malicious version 1.20.21 was published across 18 @injectivelabs packages, with 17 packages carrying risk because they pinned the backdoored @injectivelabs/sdk-ts dependency exactly.","The npm provenance for the malicious release pointed to a GitHub Actions trusted-publishing workflow from the InjectiveLabs/injective-ts repository, and the commits were authored under the existing maintainer identity thomasRalee.","Injective Labs removed the payload, deprecated version 1.20.21, and republished clean version 1.20.23 across all 18 affected packages about 49 minutes after the malicious packages went live."],"insights":["The attack did not require a stolen npm token because the malicious packages were published through the repository’s own GitHub Actions trusted-publishing workflow after code was pushed to master.","The exfiltration endpoint was hidden as a character-code array and made to resemble legitimate Injective gRPC-Web infrastructure, which would make simple source searches for URLs less effective.","The stolen wallet secrets were sent in the X-Request-Id header with an empty body, so defenders would need to inspect headers in egress or proxy logs rather than only request bodies.","The 17 related packages did not contain the payload themselves but still created exposure because they pinned the exact malicious @injectivelabs/sdk-ts version.","Because the malicious code ran only when wallet keys were created or loaded, affected users must treat any wallet secrets touched by applications using the tainted package as exposed, not merely remove the package."],"referencedReports":[],"body":"\u003cp\u003eOn July 8, 2026, attackers used access to a trusted developer\u0026rsquo;s account to add a backdoor to Injective Labs\u0026rsquo; official TypeScript SDK for the Injective blockchain. The malicious version, 1.20.21, was published across 18 related \u003ccode\u003e@injectivelabs\u003c/code\u003e npm packages and remained live for less than an hour before being pulled and fixed. Applications that installed any affected package during that window, or later used a cached copy, should treat any wallet secrets handled by those packages as exposed.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor was disguised as harmless key-derivation telemetry and was placed directly in \u003ccode\u003ePrivateKey.fromMnemonic()\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex()\u003c/code\u003e, the SDK entry points for turning wallet recovery phrases or raw private keys into signing keys. When those functions were called, the code captured the mnemonic or private key, batched the data briefly, base64-encoded it, and sent it to \u003ccode\u003ehttps://testnet.archival.chain.grpc-web.injective.network/\u003c/code\u003e. The data was carried in the \u003ccode\u003eX-Request-Id\u003c/code\u003e request header with an empty body and a \u003ccode\u003eContent-Type\u003c/code\u003e meant to resemble legitimate gRPC-Web traffic.\u003c/p\u003e\n\n\u003cp\u003eThe article says the malicious release came through the repository\u0026rsquo;s own GitHub Actions trusted-publishing workflow, with provenance pointing to a commit on \u003ccode\u003emaster\u003c/code\u003e authored under the existing maintainer identity \u003ccode\u003ethomasRalee\u003c/code\u003e. The 17 non-\u003ccode\u003esdk-ts\u003c/code\u003e packages did not contain the payload themselves, but they pinned the exact backdoored \u003ccode\u003e@injectivelabs/sdk-ts@1.20.21\u003c/code\u003e dependency. A later revert removed the telemetry file and call sites, and clean version \u003ccode\u003e1.20.23\u003c/code\u003e was published across all 18 affected packages.\u003c/p\u003e\n"},{"n":1,"title":"New Helix vishing group emerges in SharePoint data theft attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-helix-vishing-group-emerges-in-sharepoint-data-theft-attacks/","time":"17:08","priority":"MUST READ","score":92,"tldr":"A new extortion group called Helix is using vishing, device-code phishing, and MFA abuse to compromise Microsoft 365 accounts and steal data from SharePoint. ReliaQuest says the group’s SharePoint exfiltration patterns are its clearest fingerprint and recommends disabling device code authentication where possible.","briefOverview":"\u003cp\u003eA new data-extortion group called Helix is using identity-focused tactics to steal data from SharePoint environments. The group makes initial contact through vishing and, in some cases, calls employees while impersonating their manager by name or with caller ID spoofing. The goal is to trick targets into device-code phishing schemes that give the attackers access to their accounts.\u003c/p\u003e\n\n\u003cp\u003eOnce inside, Helix operators quickly register a new multi-factor authenticator app for persistence, then browse and enumerate SharePoint before exfiltrating files. ReliaQuest said the strongest technical fingerprint is automated SharePoint enumeration and collection from 179.43.185[.]230 using the \u003ccode\u003epython-requests/2.28.1\u003c/code\u003e user-agent. The operators issued \u003ccode\u003econtentclass:STS_Site\u003c/code\u003e and wildcard SharePoint searches to inventory reachable content, then bulk-downloaded files from the same IP and user-agent.\u003c/p\u003e\n\n\u003cp\u003eReliaQuest believes Helix may have emerged from the ShinyHunters and BlackFile data-extortion groups based on techniques and infrastructure, but it did not find a definitive connection. The stolen data is typically used to extort victim organizations by threatening publication unless a ransom is paid, or it is sold to other cybercriminals. ReliaQuest recommends disabling device code authentication where possible, restricting SharePoint access to managed devices, and blocking exchanges with newly registered domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A new data-extortion group called Helix is using vishing, device-code phishing, and MFA abuse to steal data from SharePoint environments.","Helix operators have impersonated employees' managers by name or caller ID spoofing to trick targets into device-code phishing schemes.","After gaining access, Helix quickly registers a new multi-factor authenticator app, enumerates SharePoint, and exfiltrates files.","ReliaQuest said Helix’s strongest technical fingerprint is automated SharePoint enumeration and collection from 179.43.185[.]230 using the python-requests/2.28.1 user-agent.","ReliaQuest believes Helix may be linked to ShinyHunters and BlackFile based on similar techniques and infrastructure, but it did not find a definitive connection."],"insights":["Disabling device code authentication where possible is described by ReliaQuest as the highest-impact defensive measure against Helix attacks.","Helix’s most reliable detection clue is not the initial phone call but the repeated SharePoint enumeration and bulk download pattern using 179.43.185[.]230 and the python-requests/2.28.1 user-agent.","Restricting SharePoint access to managed devices can reduce exposure because Helix’s theft focuses on reachable SharePoint content after account access is obtained.","Blocking exchanges with newly registered domains is specifically relevant because Helix typically uses them in its attacks.","ReliaQuest found possible continuity with BlackFile through shared autonomous system infrastructure and timing, but the article stresses that no definitive connection was established."],"referencedReports":[{"title":"Threat Spotlight: Helix: New Name in Data Extortion Ecosystem","url":"https://reliaquest.com/blog/threat-spotlight-helix-new-name-in-data-extortion-ecosystem","publisher":"ReliaQuest","context":"The article cites ReliaQuest researchers’ analysis of Helix tactics, infrastructure, SharePoint exfiltration behavior, and defensive recommendations.","category":"","primary":false}],"body":"\u003cp\u003eA new data-extortion group called Helix is using identity-focused tactics to steal data from SharePoint environments. The group makes initial contact through vishing and, in some cases, calls employees while impersonating their manager by name or with caller ID spoofing. The goal is to trick targets into device-code phishing schemes that give the attackers access to their accounts.\u003c/p\u003e\n\n\u003cp\u003eOnce inside, Helix operators quickly register a new multi-factor authenticator app for persistence, then browse and enumerate SharePoint before exfiltrating files. ReliaQuest said the strongest technical fingerprint is automated SharePoint enumeration and collection from 179.43.185[.]230 using the \u003ccode\u003epython-requests/2.28.1\u003c/code\u003e user-agent. The operators issued \u003ccode\u003econtentclass:STS_Site\u003c/code\u003e and wildcard SharePoint searches to inventory reachable content, then bulk-downloaded files from the same IP and user-agent.\u003c/p\u003e\n\n\u003cp\u003eReliaQuest believes Helix may have emerged from the ShinyHunters and BlackFile data-extortion groups based on techniques and infrastructure, but it did not find a definitive connection. The stolen data is typically used to extort victim organizations by threatening publication unless a ransom is paid, or it is sold to other cybercriminals. ReliaQuest recommends disabling device code authentication where possible, restricting SharePoint access to managed devices, and blocking exchanges with newly registered domains.\u003c/p\u003e\n"},{"n":8,"title":"Compromised @injectivelabs/sdk-ts exfiltrates wallet keys through fake telemetry","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/compromised-injectivelabs-exfiltrates-keys","time":"15:26","priority":"SHOULD READ","score":88,"tldr":"A malicious npm release of @injectivelabs/sdk-ts@1.20.21 stole wallet mnemonics and private keys during normal key derivation and exfiltrated them through fake gRPC-web telemetry, with 17 related @injectivelabs packages republished to pull it transitively. Anyone who used the affected version should upgrade to 1.20.23 and treat any exposed wallet keys or seed phrases as compromised.","briefOverview":"\u003cp\u003eA malicious release of \u003ccode\u003e@injectivelabs/sdk-ts\u003c/code\u003e, version \u003ccode\u003e1.20.21\u003c/code\u003e, was published to npm and shipped code that recorded wallet mnemonics and private keys as they were derived. The bad version was live for under an hour on June 8, 2026 before the maintainer noticed and published a clean fix. During that window, the attacker also republished 17 other packages in the \u003ccode\u003e@injectivelabs\u003c/code\u003e scope at the same version, each pinned to the poisoned SDK so projects could receive it transitively.\u003c/p\u003e\n\n\u003cp\u003eThe stealer did not run during installation and did not break normal SDK behavior, which made it harder for install-time scanners and sandboxes to catch. It hooked \u003ccode\u003ePrivateKey.fromMnemonic\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex\u003c/code\u003e, captured the secret during normal wallet use, and sent it to \u003ccode\u003ehttps://testnet[.]archival[.]chain[.]grpc-web[.]injective[.]network/\u003c/code\u003e. The stolen data was placed in the \u003ccode\u003eX-Request-Id\u003c/code\u003e header of requests disguised as gRPC-web traffic, with failures silently ignored.\u003c/p\u003e\n\n\u003cp\u003eAccording to npm stats cited in the article, the malicious version was downloaded 310 times before it was pulled. The article says the malicious npm version had been deprecated but not removed at the time of the source report, and compromised release artifacts were still present on the project\u0026rsquo;s GitHub releases page. It recommends upgrading any \u003ccode\u003e@injectivelabs\u003c/code\u003e package pinned or resolvable to \u003ccode\u003e1.20.21\u003c/code\u003e to clean version \u003ccode\u003e1.20.23\u003c/code\u003e, and treating any mnemonic or private key that passed through the affected packages as exposed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A malicious release of @injectivelabs/sdk-ts version 1.20.21 recorded wallet mnemonics and private keys during normal key derivation and sent them to an attacker-controlled endpoint.","The malicious version was live on npm for under an hour on June 8, 2026, and npm statistics showed it was downloaded 310 times before it was pulled.","The attacker also republished 17 other @injectivelabs packages at version 1.20.21 with hard dependency pins to the poisoned @injectivelabs/sdk-ts package, allowing projects to pull in the stealer transitively.","The exfiltration traffic was disguised as gRPC-web telemetry to testnet.archival.chain.grpc-web.injective.network, with stolen data placed in the X-Request-Id request header.","The article recommends upgrading any @injectivelabs package pinned or resolvable to 1.20.21 to the clean 1.20.23 release and treating any mnemonic or private key that passed through the affected packages as exposed."],"insights":["Install-time checks alone would not catch this package because the malicious code had no install hook and only ran when an application derived a wallet key during normal use.","Auditing only direct dependencies is insufficient in this case because the attacker used 17 related @injectivelabs packages to pull the poisoned SDK into projects transitively.","Network monitoring that only inspects request bodies could miss the stolen data because the payload was placed in the X-Request-Id header while the request body could be empty.","Deprecating the malicious npm version did not fully eliminate exposure because the article says it remained downloadable and the compromised release artifacts were still present on GitHub releases.","For affected wallets, simply upgrading the package is not enough because any mnemonic or private key that passed through the malicious version should be treated as exposed."],"referencedReports":[],"body":"\u003cp\u003eA malicious release of \u003ccode\u003e@injectivelabs/sdk-ts\u003c/code\u003e, version \u003ccode\u003e1.20.21\u003c/code\u003e, was published to npm and shipped code that recorded wallet mnemonics and private keys as they were derived. The bad version was live for under an hour on June 8, 2026 before the maintainer noticed and published a clean fix. During that window, the attacker also republished 17 other packages in the \u003ccode\u003e@injectivelabs\u003c/code\u003e scope at the same version, each pinned to the poisoned SDK so projects could receive it transitively.\u003c/p\u003e\n\n\u003cp\u003eThe stealer did not run during installation and did not break normal SDK behavior, which made it harder for install-time scanners and sandboxes to catch. It hooked \u003ccode\u003ePrivateKey.fromMnemonic\u003c/code\u003e and \u003ccode\u003ePrivateKey.fromHex\u003c/code\u003e, captured the secret during normal wallet use, and sent it to \u003ccode\u003ehttps://testnet[.]archival[.]chain[.]grpc-web[.]injective[.]network/\u003c/code\u003e. The stolen data was placed in the \u003ccode\u003eX-Request-Id\u003c/code\u003e header of requests disguised as gRPC-web traffic, with failures silently ignored.\u003c/p\u003e\n\n\u003cp\u003eAccording to npm stats cited in the article, the malicious version was downloaded 310 times before it was pulled. The article says the malicious npm version had been deprecated but not removed at the time of the source report, and compromised release artifacts were still present on the project\u0026rsquo;s GitHub releases page. It recommends upgrading any \u003ccode\u003e@injectivelabs\u003c/code\u003e package pinned or resolvable to \u003ccode\u003e1.20.21\u003c/code\u003e to clean version \u003ccode\u003e1.20.23\u003c/code\u003e, and treating any mnemonic or private key that passed through the affected packages as exposed.\u003c/p\u003e\n"},{"n":4,"title":"New Forg365 phishing platform uses AI to target Microsoft 365 accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-forg365-phishing-platform-uses-ai-to-target-microsoft-365-accounts/","time":"14:39","priority":"SHOULD READ","score":82,"tldr":"A new phishing-as-a-service platform called Forg365 targets Microsoft 365 accounts using device-code and adversary-in-the-middle phishing, with AI-generated lures and tools to maintain access by refreshing stolen cookies. Defenders should restrict device-code authentication, monitor Entra and mailbox activity, and revoke sessions quickly if compromise is suspected.","briefOverview":"\u003cp\u003eA new phishing-as-a-service operation called Forg365 targets Microsoft 365 accounts by combining adversary-in-the-middle phishing, device-code phishing, and AI-assisted lure generation. ZeroBEC researchers say the platform includes features seen in other PhaaS platforms such as Kali365 and Sneaky2FA, though they could not establish a connection. The operation uses legitimate services including Amazon SES, SendGrid-hosted resources, Cloudflare Pages, and Gophish infrastructure to support phishing delivery and landing pages.\u003c/p\u003e\n\n\u003cp\u003eZeroBEC obtained access to the Forg365 dashboard, which allows operators to create campaigns, manage phishing links, configure OAuth apps and SMTP profiles, manage tokens, and generate phishing emails with AI. The researchers note that integrating AI directly into the panel lets operators create, prepare, and refine malicious emails from the same dashboard used for post-compromise activity. The platform also includes account intelligence and keyword monitoring to scan compromised mailboxes for predefined terms and alert operators when matches are found.\u003c/p\u003e\n\n\u003cp\u003eForg365 provides a browser extension called ForgCookie for Chrome, Edge, and Brave that is designed to refresh Microsoft SSO cookies and help maintain access to Microsoft services linked to compromised accounts. The platform supports device-code phishing, which tricks victims into authorizing an attacker-controlled device through Microsoft’s OAuth 2.0 device code flow, and AiTM phishing, which proxies authentication traffic to capture session cookies. ZeroBEC recommends restricting or disabling Microsoft device-code authentication unless required, monitoring Microsoft Entra logs, investigating unexpected mailbox rules, device sign-ins, Authentication Broker activity, and OAuth grants, and revoking tokens and sessions if compromise is suspected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Forg365 is a phishing-as-a-service operation focused on stealing Microsoft 365 accounts by combining adversary-in-the-middle phishing, device-code phishing, and AI-assisted lure generation.","ZeroBEC researchers accessed the Forg365 dashboard, which supports creating phishing campaigns, managing phishing links, configuring OAuth apps and SMTP profiles, managing tokens, and generating phishing emails with AI.","Forg365 includes a browser extension called ForgCookie that refreshes Microsoft SSO cookies to help attackers maintain access to Microsoft services linked to compromised accounts.","The platform supports device-code phishing that tricks victims into authorizing an attacker-controlled device through Microsoft’s legitimate OAuth 2.0 device code flow.","ZeroBEC recommends restricting or disabling Microsoft device-code authentication unless required, monitoring Microsoft Entra logs, investigating unexpected mailbox rules and OAuth grants, and revoking tokens and sessions if compromise is suspected."],"insights":["Forg365 blends legitimate services into its phishing chain by using Amazon SES for delivery and SendGrid-hosted image or tracking resources, which ZeroBEC says indicates a mature operation capable of making malicious messages resemble normal email traffic.","The AI lure-generation feature is built directly into the same dashboard used for campaign control and post-compromise activity, reducing the effort required to create customized phishing emails from within one platform.","ForgCookie is designed for Chrome, Edge, and Brave and refreshes Microsoft SSO cookies by clearing session cookies and triggering a silent OAuth flow, making cookie and token revocation especially important after suspected compromise.","Forg365 includes anti-analysis controls such as AES-encrypted redirectors, bot detection, debugger traps, sandbox checks, polymorphic code, and VPN-based redirection to innocuous content, which can make investigation of its phishing pages harder."],"referencedReports":[{"title":"Inside Forg365: Telegram-Distributed Sneaky2FA-Style PhaaS","url":"https://zerobec.com/blog/inside-forg365-telegram-distributed-sneaky2fa-style-phaas","publisher":"ZeroBEC","context":"The article is based on ZeroBEC's research into the Forg365 phishing-as-a-service platform and cites its findings throughout.","category":"","primary":false}],"body":"\u003cp\u003eA new phishing-as-a-service operation called Forg365 targets Microsoft 365 accounts by combining adversary-in-the-middle phishing, device-code phishing, and AI-assisted lure generation. ZeroBEC researchers say the platform includes features seen in other PhaaS platforms such as Kali365 and Sneaky2FA, though they could not establish a connection. The operation uses legitimate services including Amazon SES, SendGrid-hosted resources, Cloudflare Pages, and Gophish infrastructure to support phishing delivery and landing pages.\u003c/p\u003e\n\n\u003cp\u003eZeroBEC obtained access to the Forg365 dashboard, which allows operators to create campaigns, manage phishing links, configure OAuth apps and SMTP profiles, manage tokens, and generate phishing emails with AI. The researchers note that integrating AI directly into the panel lets operators create, prepare, and refine malicious emails from the same dashboard used for post-compromise activity. The platform also includes account intelligence and keyword monitoring to scan compromised mailboxes for predefined terms and alert operators when matches are found.\u003c/p\u003e\n\n\u003cp\u003eForg365 provides a browser extension called ForgCookie for Chrome, Edge, and Brave that is designed to refresh Microsoft SSO cookies and help maintain access to Microsoft services linked to compromised accounts. The platform supports device-code phishing, which tricks victims into authorizing an attacker-controlled device through Microsoft’s OAuth 2.0 device code flow, and AiTM phishing, which proxies authentication traffic to capture session cookies. ZeroBEC recommends restricting or disabling Microsoft device-code authentication unless required, monitoring Microsoft Entra logs, investigating unexpected mailbox rules, device sign-ins, Authentication Broker activity, and OAuth grants, and revoking tokens and sessions if compromise is suspected.\u003c/p\u003e\n"},{"n":5,"title":"Latvian forestry company still restoring systems weeks after ransomware attack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/latvia-state-owned-foresty-company-lvm-ransomware","time":"14:20","priority":"SHOULD READ","score":82,"tldr":"Latvia’s state-owned forestry company LVM is still restoring systems weeks after a ransomware attack that disrupted services and exposed stolen data, including internal documents, credentials, certificates and code. CERT.LV attributed the incident to an unnamed foreign financially motivated ransomware group and said Latvia’s election infrastructure was not compromised.","briefOverview":"\u003cp\u003eLatvia\u0026rsquo;s state-owned forestry company, LVM, said it is still working to restore IT systems weeks after a ransomware attack disrupted several internal and customer services. The attack, first disclosed in late June, knocked offline the company\u0026rsquo;s mapping platform, hunting application, and systems used to exchange information with contractors and customers. LVM\u0026rsquo;s chief technology officer, Maris Kuzmins, said the situation has stabilized, but returning operations to normal remains quite challenging.\u003c/p\u003e\n\n\u003cp\u003eKuzmins said about two-thirds of customers with service contracts still do not have access to the affected systems. He said the attackers exploited a vulnerability in a system that had not been updated for two years, but did not identify the affected software. CERT.LV attributed the intrusion to a foreign, financially motivated ransomware group that has previously targeted companies and public institutions in NATO and European Union countries.\u003c/p\u003e\n\n\u003cp\u003eThe attackers leaked roughly 44 gigabytes of stolen data online, including internal documents, email correspondence, software code repositories, digital certificates, cryptographic keys, and user credentials. Latvian authorities said election infrastructure was not compromised because LVM\u0026rsquo;s work on electronic voter registration software was developed in a separate environment and its code was never stored in LVM\u0026rsquo;s corporate repositories. CERT.LV also said the same threat actor compromised a server belonging to Latvian pharmaceutical company Olpha, but authorities said the two breaches were technically unrelated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Latvia's state-owned forestry company LVM is still working to restore IT systems weeks after a ransomware attack disrupted internal and customer services.","The attack knocked LVM's mapping platform, hunting application, and systems used to exchange information with contractors and customers offline.","LVM's chief technology officer said about two-thirds of customers with service contracts still do not have access to the affected systems.","CERT.LV attributed the intrusion to a foreign, financially motivated ransomware group and said the attackers leaked roughly 44 gigabytes of stolen data online.","Latvian authorities said election infrastructure was not compromised because the voter registration software was developed in a separate environment and its code was never stored in LVM's corporate repositories."],"insights":["A system left unupdated for two years was identified by LVM’s chief technology officer as the entry point, showing that long-delayed patching can lead to extended operational disruption.","The attackers reportedly remained undetected in LVM’s network for more than a week, indicating that the incident involved not only initial access but also a period of unnoticed activity before discovery.","The leaked data included digital certificates, cryptographic keys, user credentials, and software code repositories, which are especially sensitive because they can affect trust in systems beyond the initially disrupted services.","Latvian authorities emphasized that the election software was developed and stored separately from LVM’s corporate systems, making separation of development environments a concrete factor in limiting the incident’s impact.","CERT.LV said the same threat actor continues looking for vulnerabilities in Latvian public- and private-sector organizations, making the incident part of an active broader campaign rather than an isolated breach."],"referencedReports":[{"title":"AS “Latvijas valsts meži” kiberdrošības incidents: aktuālā informācija","url":"https://cert.lv/lv/2026/06/as-latvijas-valsts-mezi-kiberdrosibas-incidents-aktuala-informacija?utm","publisher":"CERT.LV","context":"The article cites CERT.LV for attribution of the intrusion to a foreign financially motivated ransomware group and details about the stolen data.","category":"","primary":false},{"title":"CERT.LV apstiprina Latvijas Valsts mežu izstrādātā koda drošu izmantošanu vēlēšanās","url":"https://cert.lv/lv/2026/06/cert-lv-apstiprina-latvijas-valsts-mezu-izstradata-koda-drosu-izmantosanu-velesanas","publisher":"CERT.LV","context":"The article cites CERT.LV’s review of software deliveries for Latvia’s electronic voter registration system and its conclusion that the system is safe to use.","category":"","primary":false}],"body":"\u003cp\u003eLatvia\u0026rsquo;s state-owned forestry company, LVM, said it is still working to restore IT systems weeks after a ransomware attack disrupted several internal and customer services. The attack, first disclosed in late June, knocked offline the company\u0026rsquo;s mapping platform, hunting application, and systems used to exchange information with contractors and customers. LVM\u0026rsquo;s chief technology officer, Maris Kuzmins, said the situation has stabilized, but returning operations to normal remains quite challenging.\u003c/p\u003e\n\n\u003cp\u003eKuzmins said about two-thirds of customers with service contracts still do not have access to the affected systems. He said the attackers exploited a vulnerability in a system that had not been updated for two years, but did not identify the affected software. CERT.LV attributed the intrusion to a foreign, financially motivated ransomware group that has previously targeted companies and public institutions in NATO and European Union countries.\u003c/p\u003e\n\n\u003cp\u003eThe attackers leaked roughly 44 gigabytes of stolen data online, including internal documents, email correspondence, software code repositories, digital certificates, cryptographic keys, and user credentials. Latvian authorities said election infrastructure was not compromised because LVM\u0026rsquo;s work on electronic voter registration software was developed in a separate environment and its code was never stored in LVM\u0026rsquo;s corporate repositories. CERT.LV also said the same threat actor compromised a server belonging to Latvian pharmaceutical company Olpha, but authorities said the two breaches were technically unrelated.\u003c/p\u003e\n"},{"n":6,"title":"npm 12 Disables Install Scripts by Default to Reduce Supply Chain Risk","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/npm-12-disables-install-scripts-by.html","time":"16:49","priority":"SHOULD READ","score":82,"tldr":"GitHub released npm 12 with install scripts, Git dependencies, and remote URL dependencies disabled by default to reduce supply chain risk. It is also phasing out 2FA-bypass granular access tokens for sensitive npm actions and direct publishing, pushing maintainers toward trusted publishing or human approval workflows.","briefOverview":"\u003cp\u003eGitHub announced the release of npm version 12 with install scripts disabled by default. The release also deprecates granular access tokens designed to bypass two-factor authentication. GitHub said several npm install behaviors that previously ran automatically are now opt-in.\u003c/p\u003e\n\n\u003cp\u003eIn npm 12, dependency lifecycle scripts such as preinstall, install, and postinstall no longer run unless explicitly allowed. Implicit node-gyp builds are also disabled by default, and Git dependencies or dependencies from remote URLs are no longer resolved unless explicitly allowed. To review and approve trusted scripts, users must run “npm approve-scripts \u0026ndash;allow-scripts-pending” and commit the resulting allowlist in package.json.\u003c/p\u003e\n\n\u003cp\u003eGitHub also said npm granular access tokens configured to bypass two-factor authentication will lose access to sensitive account, package, and organization management actions in early August 2026. In January 2027, those tokens will no longer be able to publish directly, and GitHub recommends moving automated publishing to trusted publishing using OIDC or staged publishing with human approval. The article also notes that pnpm 11.10 introduced a new “_auth” setting intended to keep registry credentials tied to the host they belong to and prevent project files from redirecting valid tokens.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["GitHub announced the release of npm version 12 with install scripts disabled by default and deprecated granular access tokens designed to bypass two-factor authentication.","In npm 12, dependency lifecycle scripts and implicit node-gyp builds no longer run unless explicitly allowed, and Git dependencies or remote URL dependencies are no longer resolved unless explicitly allowed.","Users must run “npm approve-scripts --allow-scripts-pending” to review and approve trusted scripts, then commit the resulting allowlist in the package.json file.","In early August 2026, npm granular access tokens configured to bypass two-factor authentication will no longer be able to perform sensitive account, package, and organization management actions.","In January 2027, npm granular access tokens will no longer be able to publish directly, and GitHub recommends moving automated publishing to trusted publishing using OIDC or staged publishing with human approval."],"insights":["npm 12 makes previously automatic install-time behaviors opt-in, so projects may need to commit an explicit script allowlist in package.json to preserve trusted build steps.","GitHub is creating a transition window for token changes: sensitive management actions using 2FA-bypass tokens are affected in early August 2026, while direct publishing with those tokens remains available until January 2027.","The article points maintainers away from long-lived publish tokens and toward trusted publishing using OIDC or staged publishing with a human approval step.","pnpm 11.10’s new _auth handling reduces token exposure by reading authentication only from the environment or global config, not from project files that could be tampered with."],"referencedReports":[{"title":"pnpm 11.1 Hardens Registry Authentication","url":"https://socket.dev/blog/pnpm-11-1-hardens-registry-authentication","publisher":"Socket","context":"The article cites Socket’s explanation of pnpm’s new _auth handling and its security benefit of keeping credentials tied to their intended host.","category":"","primary":false}],"body":"\u003cp\u003eGitHub announced the release of npm version 12 with install scripts disabled by default. The release also deprecates granular access tokens designed to bypass two-factor authentication. GitHub said several npm install behaviors that previously ran automatically are now opt-in.\u003c/p\u003e\n\n\u003cp\u003eIn npm 12, dependency lifecycle scripts such as preinstall, install, and postinstall no longer run unless explicitly allowed. Implicit node-gyp builds are also disabled by default, and Git dependencies or dependencies from remote URLs are no longer resolved unless explicitly allowed. To review and approve trusted scripts, users must run “npm approve-scripts \u0026ndash;allow-scripts-pending” and commit the resulting allowlist in package.json.\u003c/p\u003e\n\n\u003cp\u003eGitHub also said npm granular access tokens configured to bypass two-factor authentication will lose access to sensitive account, package, and organization management actions in early August 2026. In January 2027, those tokens will no longer be able to publish directly, and GitHub recommends moving automated publishing to trusted publishing using OIDC or staged publishing with human approval. The article also notes that pnpm 11.10 introduced a new “_auth” setting intended to keep registry credentials tied to the host they belong to and prevent project files from redirecting valid tokens.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft expects more Windows security updates from AI-discovered flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-expects-more-windows-security-updates-from-ai-discovered-flaws/","time":"17:00","priority":"MAY READ","score":70,"tldr":"Microsoft says its growing use of AI to find and validate Windows vulnerabilities will likely lead to more security fixes in monthly Patch Tuesday updates. The company says human engineers will still review fixes, while it also updates its development practices for AI-enabled attack techniques.","briefOverview":"\u003cp\u003eMicrosoft says Windows users should expect more security updates as the company increasingly uses artificial intelligence to find vulnerabilities in its codebase. The company said advances in AI are speeding up vulnerability discovery, allowing engineers to identify more security issues before they can be exploited in zero-day attacks. Microsoft said this will likely result in a higher volume of security updates in each monthly Patch Tuesday release.\u003c/p\u003e\n\n\u003cp\u003eAs part of this effort, Microsoft is using Microsoft Security\u0026rsquo;s multi-model agentic scanning harness, known as MDASH, to scan critical Windows binaries and validate potential vulnerabilities with multiple AI models. Vulnerability candidates then pass through a second Windows-specific validation pipeline to reduce false positives before engineers investigate them. Microsoft also says AI is helping engineers understand failures faster, suggest possible fixes, and identify similar bugs elsewhere in Windows source code.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said human engineers will still oversee and review all proposed code and validate fixes before release into production. The company is also updating its Secure Development Lifecycle practices to account for AI-enabled attack techniques and to use AI earlier in the software development process. The announcement follows a Reuters report that CISA has begun using Anthropic\u0026rsquo;s Fable AI model to scan government software for vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft says Windows users should expect more security updates as the company increasingly uses artificial intelligence to discover vulnerabilities in its codebase.","Microsoft is using Microsoft Security's multi-model agentic scanning harness, known as MDASH, to scan critical Windows binaries and validate potential vulnerabilities using multiple AI models.","Vulnerability candidates found by MDASH go through a Windows-specific validation pipeline to reduce false positives before engineers investigate them.","Microsoft says human engineers will oversee and review all proposed code and validate fixes before they are released into production.","Microsoft is updating its Secure Development Lifecycle practices to account for AI-enabled attack techniques and to use AI earlier in software development."],"insights":["A higher number of Patch Tuesday fixes may reflect Microsoft finding more flaws earlier with AI, rather than a newly disclosed wave of active attacks.","Microsoft is using multiple AI models plus a separate Windows-specific validation pipeline, showing that AI-generated vulnerability findings still require filtering before engineers act on them.","Microsoft is applying AI beyond discovery by using it to help engineers understand failures, suggest fixes, and find similar bugs elsewhere in Windows source code.","The article shows AI-assisted vulnerability discovery is moving beyond Microsoft, with CISA reportedly using Anthropic's Fable model to audit government software."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft says Windows users should expect more security updates as the company increasingly uses artificial intelligence to find vulnerabilities in its codebase. The company said advances in AI are speeding up vulnerability discovery, allowing engineers to identify more security issues before they can be exploited in zero-day attacks. Microsoft said this will likely result in a higher volume of security updates in each monthly Patch Tuesday release.\u003c/p\u003e\n\n\u003cp\u003eAs part of this effort, Microsoft is using Microsoft Security\u0026rsquo;s multi-model agentic scanning harness, known as MDASH, to scan critical Windows binaries and validate potential vulnerabilities with multiple AI models. Vulnerability candidates then pass through a second Windows-specific validation pipeline to reduce false positives before engineers investigate them. Microsoft also says AI is helping engineers understand failures faster, suggest possible fixes, and identify similar bugs elsewhere in Windows source code.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said human engineers will still oversee and review all proposed code and validate fixes before release into production. The company is also updating its Secure Development Lifecycle practices to account for AI-enabled attack techniques and to use AI earlier in the software development process. The announcement follows a Reuters report that CISA has begun using Anthropic\u0026rsquo;s Fable AI model to scan government software for vulnerabilities.\u003c/p\u003e\n"},{"n":9,"title":"Finding SOCKS with Proxywatch","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/09/finding-socks-with-proxywatch/","time":"16:00","priority":"MAY READ","score":68,"tldr":"SpecterOps released ProxyWatch, a proof-of-concept tool that detects SOCKS proxy pivots, C2 sessions, and beaconing by analyzing endpoint behavior rather than relying on static indicators or process-port baselines. The key takeaway is that proxy-based attacker activity can be detected more reliably by profiling how processes communicate and relay traffic.","briefOverview":"\u003cp\u003eSpecterOps highlighted ProxyWatch, a proof-of-concept tool for detecting SOCKS proxies and other proxy pivoting methods through behavior-based detection. The article explains that adversaries use SOCKS proxy tunnels to pivot within environments and execute actions against compromised systems without bringing tools to the system. It notes that defenders often lack reliable guidance for detecting this behavior and may fall back to static indicators or process-port baselines.\u003c/p\u003e\n\n\u003cp\u003eProxyWatch collects endpoint telemetry on Linux and Windows, including network, user, and process context, and builds process profiles through a scoring engine. Its rule engine includes 83 behavioral signals such as raw socket usage, loopback address usage, periodic callback cadence, measured jitter, writable paths, uncommon traffic destinations, named pipe C2 patterns, and parent-child tunnel inheritance. The tool assigns process roles such as C2 session, SOCKS proxy pivot, and beaconing behavior, and also runs a local machine learning model trained against the rule engine’s output.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates ProxyWatch detecting a Sliver Beacon SOCKS tunnel, identifying a Sliver C2 beacon callback pattern, collecting host-user-process-endpoint relationships through ProxyHound, and probing egress paths through Contour. It emphasizes that proxied execution can reduce disk presence and avoid detections based on process spawning because the attacker’s tools remain on the attacker system. At the same time, it notes that detecting the target activity itself, such as registry run key modification, can still reveal the technique being performed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Adversaries use SOCKS proxy tunnels to pivot within environments and execute code against compromised systems without bringing tools to those systems.","SpecterOps created ProxyWatch as a proof-of-concept tool to detect SOCKS proxies and other pivoting methods through behavior-based detection.","ProxyWatch collects endpoint telemetry on Linux and Windows, including network, user, and process context, then scores processes using behavioral signals to assign roles such as C2 session, SOCKS proxy pivot, or beaconing behavior.","ProxyWatch includes a local machine learning model that reads 122 features per process and trains against the rule engine’s output while the rules provide detections from day one.","The article shows ProxyWatch detecting a Sliver Beacon SOCKS tunnel, a Sliver C2 beacon callback pattern, BloodHound-style relationship collection through ProxyHound, and egress paths through Contour."],"insights":["Proxied execution can evade detections built around process creation because the attacker’s tools run on the attacker’s machine while the compromised host only relays network traffic.","Detecting the action performed against the target, such as a registry run key modification, may succeed even when the proxied execution method itself is missed.","Process-port baselines for detecting proxy activity are difficult to maintain because legitimate and malicious use of ports such as Kerberos, LDAP, and Windows RPC can vary widely across environments.","ProxyWatch’s rule engine and local machine learning model are designed to work together, with rules providing immediate detections and the model taking over role assignment only after it reaches agreement with the rules.","Egress testing in ProxyWatch’s Contour component feeds results back into the classifier, so confirmed outbound paths in a specific network can influence later detection scoring."],"referencedReports":[{"title":"Bitdefender Whitepaper: Chafer","url":"https://www.bitdefender.com/files/News/CaseStudies/study/332/Bitdefender-Whitepaper-Chafer-creat4491-en-EN-interactive.pdf","publisher":"Bitdefender","context":"The article cites this whitepaper as an example of an APT group using custom tooling to establish a SOCKS5 TCP session through an intermediary server.","category":"","primary":false},{"title":"UNC3524: Eye Spy on Your Email","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc3524-eye-spy-email","publisher":"Google Cloud Threat Intelligence","context":"The article references this analysis as an example of adversaries using SOCKS proxies to exfiltrate data from a victim’s cloud-based email services.","category":"","primary":false},{"title":"Lucky Mouse: Incident Response to Detection Engineering","url":"https://blog.sekoia.io/lucky-mouse-incident-response-to-detection-engineering/#h-socks-tunneling-with-chisel","publisher":"Sekoia","context":"The article cites Sekoia’s reporting that an adversary group used a renamed version of the Chisel project for SOCKS tunneling.","category":"","primary":false},{"title":"Sliver C2 Leveraged by Many Threat Actors","url":"https://www.cybereason.com/blog/sliver-c2-leveraged-by-many-threat-actors","publisher":"Cybereason","context":"The article references Cybereason’s analysis of the rise of Sliver, including its SOCKS functionality, among threat groups.","category":"","primary":false},{"title":"The Curious Case of an Egg-cellent Resume","url":"https://thedfirreport.com/2024/12/02/the-curious-case-of-an-egg-cellent-resume/#case-summary","publisher":"The DFIR Report","context":"The article cites this case report as an example where adversaries installed Cloudflare Tunnels to enable RDP access to a server.","category":"","primary":false}],"body":"\u003cp\u003eSpecterOps highlighted ProxyWatch, a proof-of-concept tool for detecting SOCKS proxies and other proxy pivoting methods through behavior-based detection. The article explains that adversaries use SOCKS proxy tunnels to pivot within environments and execute actions against compromised systems without bringing tools to the system. It notes that defenders often lack reliable guidance for detecting this behavior and may fall back to static indicators or process-port baselines.\u003c/p\u003e\n\n\u003cp\u003eProxyWatch collects endpoint telemetry on Linux and Windows, including network, user, and process context, and builds process profiles through a scoring engine. Its rule engine includes 83 behavioral signals such as raw socket usage, loopback address usage, periodic callback cadence, measured jitter, writable paths, uncommon traffic destinations, named pipe C2 patterns, and parent-child tunnel inheritance. The tool assigns process roles such as C2 session, SOCKS proxy pivot, and beaconing behavior, and also runs a local machine learning model trained against the rule engine’s output.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates ProxyWatch detecting a Sliver Beacon SOCKS tunnel, identifying a Sliver C2 beacon callback pattern, collecting host-user-process-endpoint relationships through ProxyHound, and probing egress paths through Contour. It emphasizes that proxied execution can reduce disk presence and avoid detections based on process spawning because the attacker’s tools remain on the attacker system. At the same time, it notes that detecting the target activity itself, such as registry run key modification, can still reveal the technique being performed.\u003c/p\u003e\n"},{"n":12,"title":"Unmasking BitRAT's C2 over HTTPS | Corelight","source":"corelight.com","sourceColorIdx":1,"link":"https://corelight.com/blog/detecting-bitrat-c2-over-https","time":"15:00","priority":"MAY READ","score":65,"tldr":"Corelight analyzes how BitRAT hides command-and-control traffic inside HTTPS and shows that network telemetry can still expose its distinctive C2 behavior. The key takeaway is that encrypted malware traffic can often be detected through protocol metadata and traffic patterns rather than payload inspection.","briefOverview":"\u003cp\u003eThe article is titled “Unmasking BitRAT\u0026rsquo;s C2 over HTTPS” and is associated with Corelight. It indicates that the article focuses on BitRAT and its command-and-control communications over HTTPS. The provided article text does not include readable details about specific victims, dates, indicators, or outcomes.\u003c/p\u003e\n\n\u003cp\u003eThe significance presented by the title is that BitRAT’s C2 activity over HTTPS is the subject being examined. HTTPS is explicitly named as the communication channel in the title. No additional technical findings, detection details, or impact statements are clearly readable in the provided article content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled “Unmasking BitRAT's C2 over HTTPS.”","The article focuses on BitRAT.","The article discusses BitRAT command-and-control activity over HTTPS.","The article is associated with Corelight."],"insights":["The article frames HTTPS as the key layer involved in BitRAT command-and-control activity, rather than treating it as a minor implementation detail.","The title’s use of “unmasking” indicates the article focuses on exposing or identifying BitRAT’s command-and-control behavior despite its use of HTTPS."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Unmasking BitRAT\u0026rsquo;s C2 over HTTPS” and is associated with Corelight. It indicates that the article focuses on BitRAT and its command-and-control communications over HTTPS. The provided article text does not include readable details about specific victims, dates, indicators, or outcomes.\u003c/p\u003e\n\n\u003cp\u003eThe significance presented by the title is that BitRAT’s C2 activity over HTTPS is the subject being examined. HTTPS is explicitly named as the communication channel in the title. No additional technical findings, detection details, or impact statements are clearly readable in the provided article content.\u003c/p\u003e\n"},{"n":2,"title":"The Hidden Security Risks of Reduced Summer IT Coverage","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/the-hidden-security-risks-of-reduced-summer-it-coverage/","time":"14:02","priority":"MAY READ","score":55,"tldr":"Reduced summer IT staffing gives attackers more time to exploit phishing, unpatched systems, and delayed response processes. Organizations can reduce this risk by using automation, monitoring, and AI-driven alert prioritization to maintain security coverage when key staff are away.","briefOverview":"\u003cp\u003eThe article argues that summer vacation periods create security risks because IT and security teams often operate with reduced staffing while attackers continue probing for weaknesses. It says cybercriminals take advantage of slower response times, reduced oversight, and suspicious activity that is more likely to go unnoticed. The article cites data indicating a 40% increase in cyberattacks during holiday periods, with summer months described as especially vulnerable.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that smaller teams must handle the same workload, senior engineers may be unavailable, and institutional knowledge can become harder to access. These gaps can delay patch cycles, leave vulnerabilities unaddressed for longer, and slow investigations. It also says lean staffing can make phishing and Business Email Compromise harder to spot, especially when approval chains are disrupted and key decision makers are out of the office.\u003c/p\u003e\n\n\u003cp\u003eThe article says many security operations still depend too heavily on human availability, causing alert fatigue and manual processes to become bottlenecks when staffing is reduced. It presents AI-driven automation, automated patching, intelligent alert prioritization, autonomous runbook execution, and continuous monitoring as ways to maintain coverage during vacations, holidays, weekends, and staffing shortages. It concludes that security resilience should reduce dependence on manual processes and remain valuable year-round, not only during summer.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cybercriminals exploit summer vacation periods because reduced IT and security staffing can lead to slower response times and less oversight.","The article cites data indicating a 40% increase in cyberattacks during holiday periods, with summer months described as particularly vulnerable.","Lean staffing can make phishing and Business Email Compromise harder to spot, especially when approval chains are disrupted and key decision makers are out of the office.","Manual security processes such as ticket triage, threat investigations, patch deployment, and containment actions can become bottlenecks when staffing levels are reduced.","The article argues that AI-driven automation, automated patching, alert prioritization, runbook execution, and continuous monitoring can help maintain security coverage during staffing shortages."],"insights":["Vacation coverage plans should account for missing institutional knowledge, not just headcount, because the article notes that the person who understands unusual server behavior or obscure alerts may be unavailable.","Approval workflows are a summer-specific weak point for phishing and Business Email Compromise because disrupted approval chains and absent decision makers can make employees less likely to verify urgent requests.","Patch delays during lean staffing are presented as more than an operational backlog because they extend the time attackers have to exploit known weaknesses.","Automation is framed as a way to reduce dependence on someone being available at the exact right moment, rather than simply as a tool for efficiency.","The article emphasizes that resilience built for summer staffing gaps is useful year-round because similar reduced-coverage risks also occur during holidays, weekends, and the October-to-December holiday season."],"referencedReports":[{"title":"Are cyberattacks seasonal?","url":"https://kpmg.com/ca/en/insights/2025/06/are-cyberattacks-seasonal.html","publisher":"KPMG","context":"The article cites KPMG research saying vacation periods, including summer breaks and the October-to-December holiday season, are often prime opportunities for cyberattacks.","category":"","primary":false}],"body":"\u003cp\u003eThe article argues that summer vacation periods create security risks because IT and security teams often operate with reduced staffing while attackers continue probing for weaknesses. It says cybercriminals take advantage of slower response times, reduced oversight, and suspicious activity that is more likely to go unnoticed. The article cites data indicating a 40% increase in cyberattacks during holiday periods, with summer months described as especially vulnerable.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that smaller teams must handle the same workload, senior engineers may be unavailable, and institutional knowledge can become harder to access. These gaps can delay patch cycles, leave vulnerabilities unaddressed for longer, and slow investigations. It also says lean staffing can make phishing and Business Email Compromise harder to spot, especially when approval chains are disrupted and key decision makers are out of the office.\u003c/p\u003e\n\n\u003cp\u003eThe article says many security operations still depend too heavily on human availability, causing alert fatigue and manual processes to become bottlenecks when staffing is reduced. It presents AI-driven automation, automated patching, intelligent alert prioritization, autonomous runbook execution, and continuous monitoring as ways to maintain coverage during vacations, holidays, weekends, and staffing shortages. It concludes that security resilience should reduce dependence on manual processes and remain valuable year-round, not only during summer.\u003c/p\u003e\n"},{"n":11,"title":"Mitiga Joins Anthropic’s Cyber Verification Program","source":"mitiga.io","sourceColorIdx":0,"link":"https://www.mitiga.io/blog/mitiga-joins-anthropic-cyber-verification-program","time":"15:08","priority":"MAY READ","score":45,"tldr":"Mitiga has joined Anthropic’s Cyber Verification Program to use Claude’s advanced, vetted cyber reasoning for legitimate defensive work, especially improving runtime detections against AI-speed attacker tradecraft. The main takeaway is that as exploits increasingly outpace patches, Mitiga argues defenders need runtime controls that detect and stop attacks in progress, not just faster vulnerability remediation.","briefOverview":"\u003cp\u003eMitiga announced that it has joined Anthropic’s Cyber Verification Program, a vetting process that unlocks certain restricted AI cyber capabilities for legitimate defensive work. The article explains that frontier AI models block some cyber reasoning by default because the same capabilities can help both defenders and attackers. Through the program, verified organizations can use dual-use capabilities such as exploitation analysis, adversarial simulation, and threat modeling, while activities such as ransomware code and mass data theft remain blocked for everyone.\u003c/p\u003e\n\n\u003cp\u003eMitiga says the program matters because AI has compressed attackers’ timelines and made traditional patching strategies insufficient on their own. The article argues that in some cases exploitation can happen before a patch is available, and that a public patch can also show attackers what changed and where to look. Mitiga frames this as a reason defenders need compensating controls that detect and stop attacks while they are happening, rather than relying only on faster finding and fixing.\u003c/p\u003e\n\n\u003cp\u003eFor Mitiga, verified access to Claude’s reasoning is intended to improve Agentic Runtime Security detections powered by Helios AIDR. The company says it will use this access to better understand real attacker tradecraft, including how exploits are reasoned through, how exfiltration patterns form, and how footholds are chained across modern infrastructure. The article presents Agentic Runtime Security as a runtime layer across cloud, SaaS, identity, AI, and third-party services that aims to anticipate, detect, interrupt, and stop attacks before they create business impact.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Mitiga has joined Anthropic’s Cyber Verification Program so it can use Claude’s advanced cyber reasoning for legitimate defensive work that is normally blocked by default.","Anthropic’s Cyber Verification Program unlocks certain dual-use activities, such as exploitation analysis, adversarial simulation, and threat modeling, for verified organizations while keeping activities such as ransomware code and mass data theft blocked for everyone.","The article argues that AI has compressed attackers’ timelines so much that exploitation can happen before patches are available, making patching alone insufficient.","Mitiga says verified access will help improve detections in Helios AIDR and Agentic Runtime Security by applying frontier-model reasoning to real attacker tradecraft.","The article presents Agentic Runtime Security as a compensating control that watches cloud, SaaS, identity, AI, and third-party services to detect, interrupt, and stop attacks before they cause business impact."],"insights":["The article frames Anthropic’s Cyber Verification Program as a practical way to separate legitimate defensive use from harmful use, rather than relying on the model to infer intent from prompts that may look offensive on the surface.","Mitiga argues that a public patch can become an attacker’s roadmap because it reveals what changed and where to look, so the act of fixing a flaw can also accelerate attacks against unpatched systems.","The article treats the shrinking exploit window as a cost-curve problem, saying AI made attacking dramatically cheaper before it made defending cheaper, rather than simply blaming slow security teams.","Mitiga positions logs as the ground truth for defense across cloud, SaaS, identity, AI, and third-party services, because security cannot depend on any single fix being delivered in time.","The article distinguishes Mitiga’s use of verified AI access from faster code scanning, emphasizing attacker-minded detection engineering for runtime defense instead of vulnerability discovery alone."],"referencedReports":[],"body":"\u003cp\u003eMitiga announced that it has joined Anthropic’s Cyber Verification Program, a vetting process that unlocks certain restricted AI cyber capabilities for legitimate defensive work. The article explains that frontier AI models block some cyber reasoning by default because the same capabilities can help both defenders and attackers. Through the program, verified organizations can use dual-use capabilities such as exploitation analysis, adversarial simulation, and threat modeling, while activities such as ransomware code and mass data theft remain blocked for everyone.\u003c/p\u003e\n\n\u003cp\u003eMitiga says the program matters because AI has compressed attackers’ timelines and made traditional patching strategies insufficient on their own. The article argues that in some cases exploitation can happen before a patch is available, and that a public patch can also show attackers what changed and where to look. Mitiga frames this as a reason defenders need compensating controls that detect and stop attacks while they are happening, rather than relying only on faster finding and fixing.\u003c/p\u003e\n\n\u003cp\u003eFor Mitiga, verified access to Claude’s reasoning is intended to improve Agentic Runtime Security detections powered by Helios AIDR. The company says it will use this access to better understand real attacker tradecraft, including how exploits are reasoned through, how exfiltration patterns form, and how footholds are chained across modern infrastructure. The article presents Agentic Runtime Security as a runtime layer across cloud, SaaS, identity, AI, and third-party services that aims to anticipate, detect, interrupt, and stop attacks before they create business impact.\u003c/p\u003e\n"},{"n":7,"title":"ThreatsDay: Cloud Bucket Hijacking, Windows LPE Chain, Global Fraud Bust + 17 More Stories","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/threatsday-cloud-bucket-hijacking.html","time":"15:09","priority":"MAY READ","score":40,"tldr":"This week’s threats show how ordinary operational gaps—reused cloud bucket names, trusted remote tools, typosquatted packages, stale credentials, and loose egress controls—can quickly become paths for data theft, privilege escalation, and ransomware. The key takeaway is to scrutinize normal-looking workflows and permissions before attackers turn them into quiet compromise channels.","briefOverview":"\u003cp\u003eThis ThreatsDay roundup covers 20 security stories centered on ordinary administrative gaps becoming serious risks. It includes a global fraud operation that led to 5,811 arrests and the interception of $293 million, malicious npm and PyPI packages typosquatting payment SDKs, and a critical Esri ArcGIS Server flaw that could allow unauthenticated access to sensitive files. The article also highlights social engineering campaigns using Microsoft Teams, Meta Business Account Manager, tax refund lures, and remote access tools to steal credentials or deploy malware.\u003c/p\u003e\n\n\u003cp\u003eSeveral items focus on technical methods that avoid detection or abuse trusted systems. Researchers described Process Parameter Poisoning for stealthy code injection, a Windows local privilege escalation chain involving RPC spoofing and the Data Sharing Service, and multiple flaws in Realtek’s RtsPer.sys driver that could expose kernel memory or allow physical memory access. Other reports covered GhostChrome-X modifying Chrome extension integrity metadata, fileless and steganographic Remcos delivery, and ransomware activity involving Interlock, Rhysida, WhiteLock, Prinz Eugen, Bumblebee, AdaptixC2, and Akira.\u003c/p\u003e\n\n\u003cp\u003eCloud and identity risks are a major theme across the roundup. Mandiant warned that manually rotated ADFS certificates can leave active signing keys exposed through Machine DPAPI, creating a risk of forged high-privilege SAML tokens, while AWS emphasized layered egress controls to reduce data exfiltration risk. Palo Alto Networks Unit 42 described cloud bucket hijacking, where deleting and recreating a globally unique bucket name under another account can reroute logs and sensitive data to an attacker-controlled environment.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Operation First Light 2026 involved 97 countries and territories, led to 5,811 arrests, intercepted $293 million in illicit assets, and identified more than 142,000 victims of social engineering scams and related money laundering.","Seventeen malicious npm and PyPI packages typosquatted Paysafe, Skrill, and Neteller SDKs to steal system information and developer secrets and send them to an Ngrok endpoint.","A critical Esri ArcGIS Server flaw, CVE-2026-9181, could allow unauthenticated attackers to access sensitive files by using crafted path parameters in the REST Uploads resource.","A fake IT support campaign used phishing emails and Microsoft Teams calls to get victims to install remote access tools and ultimately deliver EtherRAT.","Palo Alto Networks Unit 42 described a cloud bucket hijacking technique in which an attacker can recreate a deleted globally unique bucket name under their own account and reroute logs or sensitive data to their environment."],"insights":["Several campaigns relied on legitimate or trusted channels, including Microsoft Teams, Meta Business Account Manager, Chrome extensions, remote management tools, and cloud storage services, showing that normal business tools can become attacker infrastructure when permissions and trust are too broad.","The cloud bucket hijacking risk is especially actionable because it depends on globally unique bucket names: deleting and recreating a bucket name under another account can silently redirect active data streams without exploiting a software bug.","Multiple items show attackers designing malware to avoid early detection, including packages that skip sandbox-like machines, fileless Remcos execution, Process Parameter Poisoning, and GhostChrome-X forging Chrome extension integrity metadata.","Old or leftover trusted state created major exposure in more than one case, including manually rotated ADFS signing keys remaining recoverable through Machine DPAPI and reused cloud bucket names becoming hijackable after deletion.","Remote access tools were both targeted and abused: WhiteLock terminates AnyDesk and TeamViewer to block defenders, while fake Teams support campaigns guided victims into installing HopToDesk and AnyDesk for attacker persistence."],"referencedReports":[{"title":"Coordinated npm and PyPI Campaign Typosquats Secure Payment Apps","url":"https://socket.dev/blog/npm-pypi-campaign-typosquats-popular-secure-payment-apps#Campaign-Attributes","publisher":"Socket","context":"The article cites Socket’s analysis of 17 malicious npm and PyPI packages typosquatting Paysafe, Skrill, and Neteller SDKs.","category":"","primary":false},{"title":"Process Parameter Poisoning to Avoid Detection","url":"https://sensepost.com/blog/2026/process-parameter-poisoning/","publisher":"SensePost","context":"The article references SensePost research describing Process Parameter Poisoning as a stealthy code injection technique.","category":"","primary":false},{"title":"Critical Directory Traversal Flaw in Esri ArcGIS Server","url":"https://horizon3.ai/attack-research/vulnerabilities/cve-2026-9181/","publisher":"Horizon3.ai","context":"The article cites Horizon3.ai’s analysis of CVE-2026-9181 in Esri ArcGIS Server.","category":"","primary":false},{"title":"Interlock and Rhysida Ransomware Ecosystem Detailed","url":"https://www.ibm.com/think/x-force/interlock-and-rhysida-within-the-ransonware-ecosystem","publisher":"IBM X-Force","context":"The article references IBM X-Force’s analysis of tooling overlaps in the Interlock and Rhysida ransomware ecosystems.","category":"","primary":false},{"title":"China Urges Developers to Ditch Claude","url":"https://cnvdb.org.cn/announcement/2074682031259299842","publisher":"China National Vulnerability Database","context":"The article cites CNVDB’s warning urging developers to uninstall or update affected Claude Code versions over sensitive data collection concerns.","category":"","primary":false},{"title":"Fake IT Support Scheme Delivers EtherRAT","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-06-28-Fake-IT-support-abuses-Teams-to-deliver-EtherRAT.txt","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s threat intelligence on a fake IT support campaign abusing Microsoft Teams to deliver EtherRAT.","category":"","primary":false},{"title":"Are Scattered Spider and 0ktapus the Same?","url":"https://www.group-ib.com/blog/connecting-scattered-spider/","publisher":"Group-IB","context":"The article cites Group-IB’s analysis connecting Scattered Spider activity with 0ktapus as a sub-cluster.","category":"","primary":false},{"title":"Meta Phishers Abuse Business Account Manager Service","url":"https://www.huntress.com/blog/meta-business-manager-phishing","publisher":"Huntress","context":"The article references Huntress research on phishing emails sent through Meta’s Business Account Manager service.","category":"","primary":false},{"title":"Extending EPM Poisoning to Achieve LPE on Windows","url":"https://www.safebreach.com/blog/an-update-on-you-snooze-you-lose-winning-lpes-by-racing-services-for-rpc-endpoints/","publisher":"SafeBreach","context":"The article cites SafeBreach’s technical analysis of a Windows local privilege escalation chain involving RPC spoofing and the Data Sharing Service.","category":"","primary":false},{"title":"Multiple Flaws in Realtek SD Card Reader Driver","url":"https://zwclose.github.io/2026/07/08/rtsper2.html","publisher":"zwclose","context":"The article references a researcher’s disclosure of multiple vulnerabilities in Realtek’s RtsPer.sys SD card reader driver.","category":"","primary":false},{"title":"WhiteLock and Prinz Eugen Ransomware Analyzed","url":"https://asec.ahnlab.com/en/94390/","publisher":"AhnLab","context":"The article cites AhnLab’s analysis of WhiteLock ransomware behavior, including terminating remote access services.","category":"","primary":false},{"title":"Prinz Eugen Ransomware: A Deep Dive into a New Go-Based Encryptor","url":"https://www.threatdown.com/blog/prinz-eugen-ransomware-a-deep-dive-into-a-new-go-based-encryptor/","publisher":"ThreatDown","context":"The article references ThreatDown’s deep dive on Prinz Eugen ransomware, a Go-based encryptor detected in May 2026.","category":"","primary":false},{"title":"GhostChrome-X, a Chrome Extension Integrity Bypass","url":"https://zerolabs.rubrik.com/blog/inside-ghostchrome-x-chrome-extension-integrity-bypass","publisher":"Rubrik Zero Labs","context":"The article cites Rubrik Zero Labs’ analysis of GhostChrome-X and its bypass of Chrome extension integrity protections.","category":"","primary":false},{"title":"Indian Income Tax Lures Used to Deliver AsyncRAT and LX RAT","url":"https://zerobec.com/blog/lx-rat-itr-phishing-finance-tech","publisher":"ZeroBEC","context":"The article references ZeroBEC’s analysis of phishing campaigns using Indian Income Tax Return refund lures to deliver AsyncRAT and LX RAT.","category":"","primary":false},{"title":"An Income Tax Assessment Notice Phishing Campaign Delivering Malware","url":"https://www.cyfirma.com/research/an-income-tax-assessment-notice-phishing-campaign-delivering-malware/","publisher":"CYFIRMA","context":"The article cites CYFIRMA’s research on fraudulent tax assessment notifications used to distribute a trojan-like payload.","category":"","primary":false},{"title":"Steganographic Loader Campaign Drops Remcos RAT","url":"https://labs.k7computing.com/index.php/a-multi-stage-steganographic-loader-campaign-deploying-diverse-payloads-globally/","publisher":"K7 Labs","context":"The article references K7 Labs’ analysis of a GST-themed ZIP lure campaign using steganography and in-memory execution to deliver Remcos RAT.","category":"","primary":false},{"title":"Microsoft Teams-Themed Remote Access Phishing Campaign Spotted","url":"https://www.cyfirma.com/research/microsoft-teams-themed-remote-access-phishing-campaign/","publisher":"CYFIRMA","context":"The article cites CYFIRMA’s research on a Microsoft Teams-themed phishing campaign distributing a legitimate remote access tool configured for unauthorized access.","category":"","primary":false},{"title":"Recovering Active ADFS Signing Keys via Machine DPAPI","url":"https://cloud.google.com/blog/topics/threat-intelligence/recovering-active-adfs-signing-keys-machine-dpapi/","publisher":"Mandiant","context":"The article references Mandiant’s technical analysis showing how active ADFS signing keys can remain exposed through Machine DPAPI after manual certificate rotation.","category":"","primary":false},{"title":"AWS Egress Controls to Prevent Data Exfiltration","url":"https://aws.amazon.com/blogs/security/prevent-data-exfiltration-aws-egress-controls-for-cloud-workloads/","publisher":"Amazon Web Services","context":"The article cites AWS guidance on using layered egress controls to prevent data exfiltration from cloud workloads and AI agents.","category":"","primary":false},{"title":"Cloud Bucket Hijacking Attack","url":"https://unit42.paloaltonetworks.com/cloud-bucket-hijacking-risks/","publisher":"Palo Alto Networks Unit 42","context":"The article cites Unit 42’s analysis of a cloud bucket hijacking technique that can reroute active data streams to an attacker-controlled bucket.","category":"","primary":false},{"title":"Active Directory Certificate Services Exploitation","url":"https://unit42.paloaltonetworks.com/active-directory-certificate-services-exploitation/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s warning that insecure AD CS defaults and overly permissive enrollment rights can enable privilege escalation and persistence.","category":"","primary":false},{"title":"Modern Kubernetes Threats","url":"https://unit42.paloaltonetworks.com/modern-kubernetes-threats/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s analysis of Kubernetes identities being abused with exposed attack surfaces to reach sensitive backend cloud infrastructure.","category":"","primary":false},{"title":"Amazon Bedrock Multiagent Applications","url":"https://unit42.paloaltonetworks.com/amazon-bedrock-multiagent-applications/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s research on exploitation paths in multi-agent AI systems through inter-agent communication and prompt injection.","category":"","primary":false},{"title":"Bypass of AWS Sandbox Network Isolation Mode","url":"https://unit42.paloaltonetworks.com/bypass-of-aws-sandbox-network-isolation-mode/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s finding that Amazon Bedrock AgentCore Code Interpreter sandbox network isolation mode can be bypassed via DNS tunneling.","category":"","primary":false},{"title":"Exploit of AWS AgentCore IAM God Mode","url":"https://unit42.paloaltonetworks.com/exploit-of-aws-agentcore-iam-god-mode/","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s analysis of AgentCore starter toolkit auto-created IAM roles that grant broad privileges across an AWS account.","category":"","primary":false}],"body":"\u003cp\u003eThis ThreatsDay roundup covers 20 security stories centered on ordinary administrative gaps becoming serious risks. It includes a global fraud operation that led to 5,811 arrests and the interception of $293 million, malicious npm and PyPI packages typosquatting payment SDKs, and a critical Esri ArcGIS Server flaw that could allow unauthenticated access to sensitive files. The article also highlights social engineering campaigns using Microsoft Teams, Meta Business Account Manager, tax refund lures, and remote access tools to steal credentials or deploy malware.\u003c/p\u003e\n\n\u003cp\u003eSeveral items focus on technical methods that avoid detection or abuse trusted systems. Researchers described Process Parameter Poisoning for stealthy code injection, a Windows local privilege escalation chain involving RPC spoofing and the Data Sharing Service, and multiple flaws in Realtek’s RtsPer.sys driver that could expose kernel memory or allow physical memory access. Other reports covered GhostChrome-X modifying Chrome extension integrity metadata, fileless and steganographic Remcos delivery, and ransomware activity involving Interlock, Rhysida, WhiteLock, Prinz Eugen, Bumblebee, AdaptixC2, and Akira.\u003c/p\u003e\n\n\u003cp\u003eCloud and identity risks are a major theme across the roundup. Mandiant warned that manually rotated ADFS certificates can leave active signing keys exposed through Machine DPAPI, creating a risk of forged high-privilege SAML tokens, while AWS emphasized layered egress controls to reduce data exfiltration risk. Palo Alto Networks Unit 42 described cloud bucket hijacking, where deleting and recreating a globally unique bucket name under another account can reroute logs and sensitive data to an attacker-controlled environment.\u003c/p\u003e\n"}]</script>
