<script type="application/json" id="dl-articles">[{"n":1,"title":"Hackers Use Compromised ConnectWise Credential to Sign In to 173 Microsoft 365 Tenants","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/hackers-use-compromised-connectwise.html","time":"06:16","priority":"MUST READ","score":94,"tldr":"A compromised ConnectWise Cloud Backup credential was used to access 173 Microsoft 365 customer tenants, potentially exposing email, files, Teams data, and directory information through the app’s broad permissions. Organizations using the app should disable it, investigate Entra service-principal and audit logs, and review newly added application credentials until ConnectWise completes credential rotation.","briefOverview":"\u003cp\u003eUnknown threat actors used a compromised Microsoft 365 credential for ConnectWise Cloud Backup, formerly SkyKick, to obtain Microsoft Graph tokens and access 173 partner or customer tenants. Huntress observed the activity from IP address 144.172.64.128 on October 15, with the actor moving through tenants in sorted GUID order seconds apart. ConnectWise Cloud Backup is granted broad permissions to back up customer Microsoft 365 data, including mailboxes, OneDrive, SharePoint, Teams, and directory information.\u003c/p\u003e\n\n\u003cp\u003eThe stolen credential could give an attacker the same access the backup application has in every tenant where it is installed, potentially exposing customer email, files, chats, and directory data. In one partner tenant, Huntress found a separate ConnectWise Teams application assigning itself the Global Administrator role and adding new secrets to two trusted applications, which could extend access to other privileged tools. ConnectWise closed Cloud Backup application access until further notice and said it found no evidence that partner backup data had been compromised; affected organizations are advised to disable the app, review service-principal sign-in and Entra audit logs, and check for credentials added since October 13, 2026.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unknown threat actors used a compromised ConnectWise Cloud Backup Microsoft 365 credential to obtain Microsoft Graph tokens and sign in to 173 partner or customer tenants.","ConnectWise Cloud Backup has broad access to Microsoft 365 data, including mailboxes, OneDrive, SharePoint, Teams, and directory data, so its compromised credential could provide comparable access in each tenant where the app was installed.","Huntress observed activity from IP address 144.172.64.128 on October 15, with the actor moving through tenants in sorted GUID order within seconds, suggesting scripted targeting.","In one partner tenant, a separate ConnectWise Cloud Management app for Microsoft Teams added itself to the Global Administrator role and added new client secrets to two other trusted applications.","ConnectWise closed Cloud Backup application access until further notice, said it found no evidence that partner backup data was compromised, and advised customers to review relevant Microsoft Entra service-principal sign-in logs."],"insights":["Revoking user sessions does not stop this form of access; disabling the application prevents new tokens, but tokens already issued can remain valid for up to 90 minutes.","Some directory-reading activity through Microsoft Graph may leave no audit trail, so organizations are advised to act even if they cannot find proof that data was accessed.","Adding new credentials to trusted MSP-management or security applications can extend access beyond a single tenant because those tools may already be authorized in customer environments.","The relevant evidence is in Microsoft Entra service-principal sign-in logs rather than the default user sign-in logs, and suspicious activity can be identified by comparing source IP addresses with the application’s expected Azure private IPv6 traffic."],"referencedReports":[{"title":"Vendor Credential Enables Unauthorized Access","url":"https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access","publisher":"huntress","context":"Huntress reported confirmed unauthorized sign-ins across 173 ConnectWise Cloud Backup partner and customer Microsoft 365 tenants and described observed follow-on activity.","category":"research","primary":true},{"title":"Investigation: Unauthorized Access Through the ConnectWise Cloud Backup Microsoft 365 App","url":"https://www.todyl.com/blog/investigation-unauthorized-access-through-the-connectwise-cloud-backup-microsoft-365-app","publisher":"todyl","context":"Todyl published a similar technical analysis describing unauthorized Microsoft Graph authentication using the ConnectWise Cloud Backup application.","category":"research","primary":false},{"title":"ConnectWise Trust Advisories","url":"https://www.connectwise.com/company/trust/advisories","publisher":"connectwise","context":"ConnectWise’s advisory states that Cloud Backup application access was closed and provides indicators and log-review guidance for customers.","category":"advisory","primary":false}],"body":"\u003cp\u003eUnknown threat actors used a compromised Microsoft 365 credential for ConnectWise Cloud Backup, formerly SkyKick, to obtain Microsoft Graph tokens and access 173 partner or customer tenants. Huntress observed the activity from IP address 144.172.64.128 on October 15, with the actor moving through tenants in sorted GUID order seconds apart. ConnectWise Cloud Backup is granted broad permissions to back up customer Microsoft 365 data, including mailboxes, OneDrive, SharePoint, Teams, and directory information.\u003c/p\u003e\n\n\u003cp\u003eThe stolen credential could give an attacker the same access the backup application has in every tenant where it is installed, potentially exposing customer email, files, chats, and directory data. In one partner tenant, Huntress found a separate ConnectWise Teams application assigning itself the Global Administrator role and adding new secrets to two trusted applications, which could extend access to other privileged tools. ConnectWise closed Cloud Backup application access until further notice and said it found no evidence that partner backup data had been compromised; affected organizations are advised to disable the app, review service-principal sign-in and Entra audit logs, and check for credentials added since October 13, 2026.\u003c/p\u003e\n"}]</script>
