<script type="application/json" id="dl-articles">[{"n":1,"title":"PamStealer Uses Fake Maccy Sites and PAM Checks to Steal Mac Login Passwords","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/pamstealer-uses-fake-maccy-sites-and.html","time":"08:03","priority":"SHOULD READ","score":82,"tldr":"Researchers found a new macOS infostealer, PamStealer, spread through fake Maccy websites that tricks users into running a malicious AppleScript and then steals passwords, browser data, crypto wallet data, iCloud Keychain content, and clipboard contents. Its key tactic is validating the victim’s macOS login password locally through PAM before exfiltrating data, making the credential theft more reliable and stealthy.","briefOverview":"\u003cp\u003eCybersecurity researchers at Jamf Threat Labs have identified a new macOS information stealer called \u003cstrong\u003ePamStealer\u003c/strong\u003e. The malware is distributed as a compiled AppleScript file that impersonates Maccy, a legitimate open-source clipboard manager. It is delivered through a lookalike website, \u003ccode\u003emaccyapp[.]com\u003c/code\u003e, that mimics the official Maccy site, \u003ccode\u003emaccy[.]app\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003ePamStealer uses a two-stage infection chain in which an AppleScript inside a disk image downloads a Rust-based second-stage payload. The AppleScript includes environment checks and only continues after fingerprinting the host, including CPU architecture, locale, keyboard layout, and time zone. It avoids Intel-based Macs, sandboxed or analysis environments, and systems whose regional settings resolve to several Eastern European countries.\u003c/p\u003e\n\n\u003cp\u003eThe Rust-based payload can steal data from web browsers, cryptocurrency wallet extensions, iCloud Keychain, and clipboard content, and it exfiltrates encrypted data to attacker-controlled infrastructure. It also shows a native password prompt to capture the victim’s macOS login password and validates the entered password through the PAM API, repeating the prompt until the correct password is supplied. After stealing the password and setting up persistence, it displays a fake message claiming Maccy is damaged and should be moved to the Trash.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Jamf Threat Labs discovered a new macOS information stealer called PamStealer that is distributed as a compiled AppleScript file impersonating the legitimate open-source clipboard manager Maccy.","PamStealer is delivered through a lookalike website, maccyapp.com, that mimics the official Maccy website at maccy.app.","The malware uses a two-stage chain in which an AppleScript inside a disk image downloads a Rust-based information stealer capable of credential theft, browser data collection, persistence, and exfiltration.","The AppleScript dropper only continues after fingerprinting the host, including CPU architecture, locale, keyboard layout, and time zone, and it avoids Intel-based Macs, sandboxed or analysis environments, and systems associated with several Eastern European countries.","The Rust payload steals data from web browsers, cryptocurrency wallet extensions, iCloud Keychain, and clipboard content, and it uses a native password prompt to capture and validate the victim’s macOS login password through the PAM API."],"insights":["PamStealer’s AppleScript can still run while carrying the com.apple.quarantine attribute, making its Script Editor-based execution chain attractive as Apple tightens Gatekeeper and Terminal controls.","The lure hides its malicious logic below a large block of empty lines and instructs victims to run the script manually with Command-R or the Script Editor Run button, turning a normal user action into the trigger for infection.","PamStealer derives a decryption key from local system traits, so the encrypted configuration only unlocks on targeted environments and fails on Intel-based Macs or disallowed regional settings.","The stealer does not merely ask for the victim’s Mac password once; it validates the entered password locally through PAM and repeatedly prompts until the correct password is supplied.","After stealing the password and registering persistence, PamStealer displays a fake “Maccy is damaged” message to make the victim believe the download was broken and discard the lure."],"referencedReports":[{"title":"PamStealer macOS Infostealer AppleScript Rust","url":"https://www.jamf.com/blog/pamstealer-macos-infostealer-applescript-rust/","publisher":"Jamf Threat Labs","context":"The article relies on Jamf Threat Labs’ analysis describing PamStealer’s AppleScript dropper, Rust-based second stage, PAM password validation, and macOS evasion behavior.","category":"","primary":false}],"body":"\u003cp\u003eCybersecurity researchers at Jamf Threat Labs have identified a new macOS information stealer called \u003cstrong\u003ePamStealer\u003c/strong\u003e. The malware is distributed as a compiled AppleScript file that impersonates Maccy, a legitimate open-source clipboard manager. It is delivered through a lookalike website, \u003ccode\u003emaccyapp[.]com\u003c/code\u003e, that mimics the official Maccy site, \u003ccode\u003emaccy[.]app\u003c/code\u003e.\u003c/p\u003e\n\n\u003cp\u003ePamStealer uses a two-stage infection chain in which an AppleScript inside a disk image downloads a Rust-based second-stage payload. The AppleScript includes environment checks and only continues after fingerprinting the host, including CPU architecture, locale, keyboard layout, and time zone. It avoids Intel-based Macs, sandboxed or analysis environments, and systems whose regional settings resolve to several Eastern European countries.\u003c/p\u003e\n\n\u003cp\u003eThe Rust-based payload can steal data from web browsers, cryptocurrency wallet extensions, iCloud Keychain, and clipboard content, and it exfiltrates encrypted data to attacker-controlled infrastructure. It also shows a native password prompt to capture the victim’s macOS login password and validates the entered password through the PAM API, repeating the prompt until the correct password is supplied. After stealing the password and setting up persistence, it displays a fake message claiming Maccy is damaged and should be moved to the Trash.\u003c/p\u003e\n"},{"n":5,"title":"Powerful Pivots: Hunting with Infrastructure Fingerprints","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/video/powerful-pivots-hunting-with-infrastructure-fingerprints/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=powerful-pivots-hunting-with-infrastructure-fingerprints","time":"09:08","priority":"MAY READ","score":50,"tldr":"Silent Push demonstrates how defenders can find related phishing sites by pivoting on shared infrastructure fingerprints like HTTP Hash and JARM instead of changing domain names or page content. The example shows these fingerprints linking a Harbor Freight-themed phishing domain to other high-confidence phishing infrastructure such as gmaii.email.","briefOverview":"\u003cp\u003eThe article explains a hunting technique based on server infrastructure fingerprints rather than website content. It says threat actors often reuse the same server configurations even when hosting different campaigns. The example begins with an identified phishing domain, harborfrieght[.]shop, whose server signatures can be extracted and used for pivots.\u003c/p\u003e\n\n\u003cp\u003eThe key indicators highlighted are HHV, or HTTP Hash, \u003ccode\u003ef2bbb45599ecd7349b164c98a8\u003c/code\u003e, and JARM, or TLS Fingerprint, \u003ccode\u003e27d40d40d00040d00042d43d00041df04c41293ba84f6efe3a613b22f983e6\u003c/code\u003e. The article says the goal is to query for all domains hosted on infrastructure with those exact HHV and JARM fingerprints. This approach is meant to cut through different domain names and changing website content by tying separate campaigns to a single actor.\u003c/p\u003e\n\n\u003cp\u003eThe article states that this precise, multi-layered search can identify high-fidelity phishing sites, including the clone gmaii.email. It also says the search ignores legitimate Google infrastructure. The article invites readers to try the example using Silent Push’s free Community Edition.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says threat actors often reuse the same server configurations even when hosting different campaigns.","A phishing domain, harborfrieght[.]shop, was identified as an example for extracting a server’s unique technical signatures.","The article identifies HHV f2bbb45599ecd7349b164c98a8 and JARM 27d40d40d00040d00042d43d00041df04c41293ba84f6efe3a613b22f983e6 as key indicators for pivoting.","The goal of the technique is to find all domains hosted on infrastructure with the exact same HHV and JARM fingerprints.","The article says this multi-layered search identifies high-fidelity phishing sites such as gmaii.email while ignoring legitimate Google infrastructure."],"insights":["Hunting on shared infrastructure fingerprints can reveal related phishing campaigns even when the visible lure changes completely, such as from a Harbor Freight-themed domain to an unrelated jeans ad.","Combining HHV and JARM creates a more precise search than relying on domain names or page content, because it ties sites to the same underlying server setup.","The article highlights that fingerprint-based pivots can distinguish a phishing clone like gmaii.email from legitimate Google infrastructure despite the similar branding.","The specific HHV and JARM values provided are immediately actionable indicators for finding other domains hosted on matching infrastructure."],"referencedReports":[],"body":"\u003cp\u003eThe article explains a hunting technique based on server infrastructure fingerprints rather than website content. It says threat actors often reuse the same server configurations even when hosting different campaigns. The example begins with an identified phishing domain, harborfrieght[.]shop, whose server signatures can be extracted and used for pivots.\u003c/p\u003e\n\n\u003cp\u003eThe key indicators highlighted are HHV, or HTTP Hash, \u003ccode\u003ef2bbb45599ecd7349b164c98a8\u003c/code\u003e, and JARM, or TLS Fingerprint, \u003ccode\u003e27d40d40d00040d00042d43d00041df04c41293ba84f6efe3a613b22f983e6\u003c/code\u003e. The article says the goal is to query for all domains hosted on infrastructure with those exact HHV and JARM fingerprints. This approach is meant to cut through different domain names and changing website content by tying separate campaigns to a single actor.\u003c/p\u003e\n\n\u003cp\u003eThe article states that this precise, multi-layered search can identify high-fidelity phishing sites, including the clone gmaii.email. It also says the search ignores legitimate Google infrastructure. The article invites readers to try the example using Silent Push’s free Community Edition.\u003c/p\u003e\n"},{"n":2,"title":"Powerful Pivots: From a Single Phish to a Full Campaign","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/video/powerful-pivots-from-a-single-phish-to-a-full-campaign/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=powerful-pivots-from-a-single-phish-to-a-full-campaign","time":"09:19","priority":"MAY READ","score":45,"tldr":"A single Ledger phishing email can be used as a starting point to uncover a broader campaign by pivoting from headers, links, page titles, domain patterns, WHOIS data, and registrars. The key takeaway is to turn reactive phishing investigations into proactive hunts for related infrastructure before it is used.","briefOverview":"\u003cp\u003eThe article explains how a reactive investigation into a real-world “Ledger” phishing email can be turned into a proactive hunt. The investigation starts with email headers and identifies IPs such as 149.72.223.116 and 159.183.183.61, which indicate compromised SendGrid accounts. It also notes that PTR records can help identify the sender, but describes this as after-the-fact analysis. The malicious link in the email was ledger-recovery-app.com.\u003c/p\u003e\n\n\u003cp\u003eThe article then shows how the domain can be used as a starting point for broader pivots. One content-based pivot is to search for other sites with an HTML title of “Are you human?” and a URL containing “ledger.” This approach widens the search beyond the original phishing message. The article presents this as a way to move from a single clue to a larger set of related domains.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a domain and WHOIS pivot based on predictable attacker patterns. It suggests searching for domains matching ledger-\u003cem\u003e-\u003c/em\u003e.com or \u003cem\u003e-ledger-\u003c/em\u003e.com where the registrar is Amazon Registrar, Inc. According to the article, this kind of query can find domains as soon as they are registered, before they are used in an email campaign. The article frames these pivots as a way to build proactive hunts from reactive investigations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article uses a real-world “Ledger” phishing email to show how a reactive investigation can become a proactive hunt.","The investigation begins with email headers and identifies IPs such as 149.72.223.116 and 159.183.183.61 as indicators of compromised SendGrid accounts.","The malicious link in the phishing email was ledger-recovery-app.com.","The article describes using the domain as a pivot to find other sites with an HTML title of “Are you human?” and a URL containing “ledger.”","The article describes a proactive domain query for ledger-*-*.com or *-ledger-*.com domains registered through Amazon Registrar, Inc. to find domains when they are registered before they are used in an email campaign."],"insights":["A single phishing domain can be used as a starting point to expand an investigation from one email into a broader search for related infrastructure.","Shared page characteristics, such as the HTML title “Are you human?” combined with “ledger” in the URL, can reveal additional suspicious sites connected by content patterns.","Domain registration patterns such as ledger-*-*.com or *-ledger-*.com can be monitored before the domains appear in an email campaign.","Filtering similar Ledger-themed domains by registrar, specifically Amazon Registrar, Inc., can make proactive hunting more focused and actionable."],"referencedReports":[],"body":"\u003cp\u003eThe article explains how a reactive investigation into a real-world “Ledger” phishing email can be turned into a proactive hunt. The investigation starts with email headers and identifies IPs such as 149.72.223.116 and 159.183.183.61, which indicate compromised SendGrid accounts. It also notes that PTR records can help identify the sender, but describes this as after-the-fact analysis. The malicious link in the email was ledger-recovery-app.com.\u003c/p\u003e\n\n\u003cp\u003eThe article then shows how the domain can be used as a starting point for broader pivots. One content-based pivot is to search for other sites with an HTML title of “Are you human?” and a URL containing “ledger.” This approach widens the search beyond the original phishing message. The article presents this as a way to move from a single clue to a larger set of related domains.\u003c/p\u003e\n\n\u003cp\u003eThe article also describes a domain and WHOIS pivot based on predictable attacker patterns. It suggests searching for domains matching ledger-\u003cem\u003e-\u003c/em\u003e.com or \u003cem\u003e-ledger-\u003c/em\u003e.com where the registrar is Amazon Registrar, Inc. According to the article, this kind of query can find domains as soon as they are registered, before they are used in an email campaign. The article frames these pivots as a way to build proactive hunts from reactive investigations.\u003c/p\u003e\n"},{"n":6,"title":"Powerful Pivots: Uncovering Brand Impersonation with Multi-Layered Queries","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/video/powerful-pivots-uncovering-brand-impersonation-with-multi-layered-queries/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=powerful-pivots-uncovering-brand-impersonation-with-multi-layered-queries","time":"08:53","priority":"MAY READ","score":45,"tldr":"Silent Push describes a multi-layered search method for finding Gmail impersonation sites by combining the official Gmail favicon hash, Gmail-related page titles, and exclusions for legitimate Google Trust Services certificates. This approach can surface convincing phishing clones like gmaii.email while filtering out real Google infrastructure.","briefOverview":"\u003cp\u003eThe article describes a method for finding convincing fake sites that impersonate Gmail. It says this is difficult because many legitimate and benign sites use the word “gmail.” The main idea is to use a multi-layered query that combines several data points to filter out noise.\u003c/p\u003e\n\n\u003cp\u003eThe search logic starts by finding sites that use the official Gmail favicon hash. It then adds a condition that the HTML title must contain “gmail.” The article identifies the most important step as excluding any site where the SSL Issuer Organization is “Google Trust Services,” because that would indicate a real Google-owned property.\u003c/p\u003e\n\n\u003cp\u003eThe article says this precise search can identify high-fidelity phishing sites while ignoring legitimate Google infrastructure. It gives gmaii.email as an example of a convincing clone found by the technique. The article also invites readers to try the example using Silent Push’s free Community Edition.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says proactively finding convincing clones of a major brand like Gmail is difficult because many legitimate and benign sites use the word “gmail.”","The described technique uses a multi-layered query that combines several data points to filter out noise.","The search logic first pivots on the official Gmail favicon hash and then requires the HTML title to contain “gmail.”","The query excludes sites where the SSL Issuer Organization is “Google Trust Services” because those would be real Google-owned properties.","The article says this search identifies high-fidelity phishing sites such as gmaii.email while ignoring legitimate Google infrastructure."],"insights":["A single indicator such as the word “gmail” is too noisy for brand impersonation hunting, but combining it with favicon and certificate issuer data makes the search precise enough to find convincing clones.","Excluding certificates issued by “Google Trust Services” is presented as the crucial step that separates likely fake Gmail-themed sites from real Google-owned infrastructure.","The example shows that favicon reuse can help identify high-fidelity phishing pages even when many benign sites share similar brand-related wording."],"referencedReports":[],"body":"\u003cp\u003eThe article describes a method for finding convincing fake sites that impersonate Gmail. It says this is difficult because many legitimate and benign sites use the word “gmail.” The main idea is to use a multi-layered query that combines several data points to filter out noise.\u003c/p\u003e\n\n\u003cp\u003eThe search logic starts by finding sites that use the official Gmail favicon hash. It then adds a condition that the HTML title must contain “gmail.” The article identifies the most important step as excluding any site where the SSL Issuer Organization is “Google Trust Services,” because that would indicate a real Google-owned property.\u003c/p\u003e\n\n\u003cp\u003eThe article says this precise search can identify high-fidelity phishing sites while ignoring legitimate Google infrastructure. It gives gmaii.email as an example of a convincing clone found by the technique. The article also invites readers to try the example using Silent Push’s free Community Edition.\u003c/p\u003e\n"},{"n":4,"title":"Staying \"Left of Boom\" with Preemptive Cyber Defense","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/video/staying-left-of-boom-with-preemptive-cyber-defense/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=staying-left-of-boom-with-preemptive-cyber-defense","time":"09:53","priority":"MAY READ","score":35,"tldr":"Silent Push’s webinar explains how security teams can stay “left of boom” by monitoring static and change data to identify attacker infrastructure before it is used in campaigns. The key takeaway is that proactive tracking of DNS and infrastructure changes can give defenders earlier warning of emerging threats.","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Senior Threat Researcher Zach Edwards explains how to stay “left of boom” with proactive cyber defence.","The session says organizations can identify attacker infrastructure before it is weaponized by tracking both static data and change data.","The article covers the difference between static data and change data in threat detection.","The article discusses how threat actors adapt to evade detection and how fingerprinting attacker infrastructure can help spot emerging campaigns.","The session covers monitoring DNS and infrastructure changes for early warning, along with tools and strategies for proactive threat hunting."],"insights":["The article frames attacker infrastructure as detectable before it is used, making preparation activity itself a target for defenders rather than only the later attack.","The article emphasizes change data alongside static data, suggesting that watching how infrastructure shifts over time can reveal threats that a one-time snapshot may miss.","The session treats DNS and infrastructure changes as early-warning signals, implying that defenders can look outside their own environments for signs of emerging campaigns.","Fingerprinting attacker infrastructure is presented as a way to spot new campaigns even when threat actors adapt to evade existing detection methods."],"referencedReports":[],"body":""},{"n":3,"title":"Get Started with Silent Push Community Edition","source":"silentpush.com","sourceColorIdx":6,"link":"https://www.silentpush.com/video/get-started-with-silent-push-community-edition/?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=get-started-with-silent-push-community-edition","time":"08:40","priority":"MAY READ","score":25,"tldr":"Silent Push is promoting its free Community Edition, which offers introductory access to its cyber defense platform and datasets for investigating relationships across Internet infrastructure.","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Silent Push Community Edition is a free cyber defense tool that provides introductory access to the Silent Push platform and datasets.","Researchers use Silent Push to uncover relationships between billions of Internet datapoints.","The platform helps expose how adversaries deploy and manage their infrastructure.","Silent Push invites users to sign up for the Community Edition for free and provide feedback."],"insights":["The free Community Edition gives researchers a low-barrier way to evaluate Silent Push datasets before committing to broader platform use.","Silent Push emphasizes relationship mapping across Internet datapoints, indicating the tool is positioned for infrastructure investigation rather than isolated lookup tasks.","The request for users to share feedback suggests Silent Push is seeking input from the community as part of the Community Edition rollout."],"referencedReports":[],"body":""}]</script>
