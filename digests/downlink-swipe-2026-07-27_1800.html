<script type="application/json" id="dl-articles">[{"n":2,"title":"New Dysphoria DDoS botnet spreads to 200k devices worldwide","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-dysphoria-ddos-botnet-spreads-to-200k-devices-worldwide/","time":"21:08","priority":"MUST READ","score":92,"tldr":"The Dysphoria botnet has infected about 200,000 routers, cameras, and IoT devices worldwide, using blockchain-based command-and-control to make takedowns harder. It is being used for DDoS attacks and proxy operations, spreading through weak credentials and both new and old device vulnerabilities.","briefOverview":"\u003cp\u003eA botnet called Dysphoria has compromised around 200,000 devices worldwide and is being used for distributed denial of service attacks and traffic relay operations. QiAnXin XLab researchers say the botnet has been tracked since the first quarter of 2026 and has undergone frequent updates in only a few months. Its operators claim a maximum DDoS capacity of 4 Tbps on a clearnet site that presents the service as a legitimate stress-tester.\u003c/p\u003e\n\n\u003cp\u003eXLab says Dysphoria evolved from the jackskid and fbot malware by adding a covert blockchain-based command-and-control resolution mechanism. The botnet uses Ethereum ENS and Solana SNS domains to retrieve infrastructure information, with C2 addresses hidden inside fake IPv6 strings and recovered using a custom byte-transformation algorithm. Infected clients send fixed 78-byte login and heartbeat packets to the C2 and receive DDoS commands that include duration, type, targets, and configurable flags.\u003c/p\u003e\n\n\u003cp\u003eIn late June, XLab observed a Dysphoria variant focused only on turning infected devices into network proxies and discarding DDoS functionality. That variant abuses UPnP on compromised devices to create 155 port forwarding rules that expose internal services to inbound internet connections. The malware spreads through weak Telnet and SSH credentials and known vulnerabilities in routers, cameras, and IoT devices, and users are advised to update firmware, change default administrator passwords, disable unnecessary remote access, and strengthen available security settings.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["QiAnXin XLab researchers say the Dysphoria botnet has compromised around 200,000 devices worldwide and is used for DDoS attacks and traffic relay operations.","Dysphoria evolved from the jackskid and fbot malware by adding a covert blockchain-based command-and-control resolution mechanism using Ethereum ENS and Solana SNS domains.","The botnet spreads through weak Telnet and SSH credentials and known vulnerabilities in routers, cameras, and other IoT devices, including CVE-2025-55182, CVE-2025-34152, CVE-2025-28137, CVE-2025-9528, CVE-2017-17215, and CVE-2020-8515.","In late June, XLab observed a Dysphoria variant that discarded DDoS functionality and focused only on turning infected devices into network proxies by abusing UPnP to create 155 port forwarding rules.","Dysphoria’s operators claim a maximum DDoS capacity of 4 Tbps on a clearnet site that promotes the service as a legitimate stress-tester."],"insights":["Dysphoria’s use of both Ethereum ENS and Solana SNS for command-and-control resolution makes its infrastructure harder to trace and dismantle than a botnet relying only on conventional domains or servers.","The botnet is rapidly evolving, with XLab observing multiple iterations since March 25 that added multi-chain support, new domains, a C2 acquisition algorithm, and separation between DDoS and relay-focused variants.","One Dysphoria variant removed DDoS features entirely and used UPnP to create 155 port forwarding rules, showing that infected devices can be repurposed from attack traffic generators into exposed proxy infrastructure.","Dysphoria’s spread depends on both weak Telnet and SSH credentials and a mix of recent and older device flaws, making firmware updates and removal of default passwords directly relevant defenses for ordinary device owners.","Although Dysphoria’s claimed 4 Tbps DDoS capacity is far below the 31.4 Tbps Aisuru/Kimwolf record cited in the article, the article notes it is still enough to cause notable disruptions."],"referencedReports":[{"title":"Dysphoria","url":"https://blog.xlab.qianxin.com/dysphoria/","publisher":"QiAnXin XLab","context":"The article cites XLab's report as the basis for details on Dysphoria's bot count, evolution, blockchain-based command-and-control, variants, and infection methods.","category":"research","primary":true}],"body":"\u003cp\u003eA botnet called Dysphoria has compromised around 200,000 devices worldwide and is being used for distributed denial of service attacks and traffic relay operations. QiAnXin XLab researchers say the botnet has been tracked since the first quarter of 2026 and has undergone frequent updates in only a few months. Its operators claim a maximum DDoS capacity of 4 Tbps on a clearnet site that presents the service as a legitimate stress-tester.\u003c/p\u003e\n\n\u003cp\u003eXLab says Dysphoria evolved from the jackskid and fbot malware by adding a covert blockchain-based command-and-control resolution mechanism. The botnet uses Ethereum ENS and Solana SNS domains to retrieve infrastructure information, with C2 addresses hidden inside fake IPv6 strings and recovered using a custom byte-transformation algorithm. Infected clients send fixed 78-byte login and heartbeat packets to the C2 and receive DDoS commands that include duration, type, targets, and configurable flags.\u003c/p\u003e\n\n\u003cp\u003eIn late June, XLab observed a Dysphoria variant focused only on turning infected devices into network proxies and discarding DDoS functionality. That variant abuses UPnP on compromised devices to create 155 port forwarding rules that expose internal services to inbound internet connections. The malware spreads through weak Telnet and SSH credentials and known vulnerabilities in routers, cameras, and IoT devices, and users are advised to update firmware, change default administrator passwords, disable unnecessary remote access, and strengthen available security settings.\u003c/p\u003e\n"},{"n":1,"title":"New Certighost PoC exploit lets attackers hijack Windows domains","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/new-certighost-poc-exploit-lets-attackers-hijack-windows-domains/","time":"21:00","priority":"SHOULD READ","score":88,"tldr":"A public proof-of-concept exploit for the Certighost AD CS flaw CVE-2026-54121 can let authenticated attackers impersonate a domain controller and potentially compromise an entire Windows domain. Microsoft fixed the issue in July 2026 updates, and admins should patch urgently or temporarily disable the affected chase fallback.","briefOverview":"\u003cp\u003eA proof-of-concept exploit has been released for “Certighost,” a Windows Active Directory Certificate Services vulnerability tracked as CVE-2026-54121. Microsoft fixed the flaw in the July 2026 Patch Tuesday security updates. Microsoft said an authenticated attacker could manipulate attributes associated with a machine account and obtain a certificate from Active Directory Certificate Services that allows authentication as that machine via PKINIT.\u003c/p\u003e\n\n\u003cp\u003eThe researchers who reported the issue, H0j3n and Aniq Fakhrul, said Certighost allowed a low-privileged domain user to impersonate a domain controller and achieve domain compromise in the tested AD CS configuration. In the demonstrated attack, the attacker creates a machine account, submits a certificate request that directs the Certification Authority to attacker-controlled services, and targets a domain controller account. The released certighost.py proof-of-concept automates the process by using the certificate to authenticate as the targeted domain controller, saving Kerberos credentials to a .ccache file, and extracting the account’s NT hash.\u003c/p\u003e\n\n\u003cp\u003eThe issue involved an AD CS fallback mechanism referred to by the researchers as a “chase,” which used attacker-supplied cdc and rmd values without verifying that the cdc server was a legitimate domain controller. Microsoft’s fix adds validation so the Certification Authority verifies that the cdc server maps to a legitimate domain controller in Active Directory and that the returned identity matches the expected account. For administrators who cannot install the July updates, the researchers said the optional chase fallback can be disabled with certutil, but they stressed this workaround is temporary and has not been fully tested in production environments.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A proof-of-concept exploit for the Windows Active Directory Certificate Services vulnerability known as Certighost, tracked as CVE-2026-54121, has been released publicly.","Microsoft fixed CVE-2026-54121 in the July 2026 Patch Tuesday security updates after researchers H0j3n and Aniq Fakhrul reported it on May 14, 2026.","The vulnerability allowed an authenticated attacker to manipulate attributes tied to a machine account and obtain a certificate that could authenticate as that machine via PKINIT.","The researchers demonstrated that a low-privileged domain user could impersonate a domain controller and use the resulting Kerberos credentials to perform a DCSync attack and retrieve the krbtgt account’s credentials.","Microsoft’s fix adds validation so the Certification Authority verifies that the server specified in the cdc attribute maps to a legitimate domain controller and that the returned identity matches the expected account."],"insights":["The exploit chain can start from a low-privileged domain user because the default ms-DS-MachineAccountQuota setting allows users to create machine accounts that are valid domain principals.","The flaw depends on an optional AD CS fallback mechanism, so organizations that cannot immediately apply the July 2026 updates can temporarily reduce exposure by disabling the chase fallback with certutil and restarting CertSvc.","The researchers warned that the workaround has not been fully tested in production environments, making patching the recommended fix rather than relying on the configuration change.","The attack abuses trust in attacker-supplied certificate request values by directing the Certification Authority to attacker-controlled services that return false directory information for a targeted machine account."],"referencedReports":[{"title":"CVE-2026-54121","url":"https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2026-54121","publisher":"microsoft","context":"The article links to Microsoft’s advisory for the Certighost vulnerability and quotes Microsoft’s description of the issue and fix.","category":"advisory","primary":false},{"title":"Certighost technical writeup","url":"https://gist.github.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26","publisher":"h0j3n-and-aniq-fakhrul","context":"The article says the researchers publicly disclosed technical details of Certighost in this writeup and uses it to explain the attack flow and impact.","category":"research","primary":true}],"body":"\u003cp\u003eA proof-of-concept exploit has been released for “Certighost,” a Windows Active Directory Certificate Services vulnerability tracked as CVE-2026-54121. Microsoft fixed the flaw in the July 2026 Patch Tuesday security updates. Microsoft said an authenticated attacker could manipulate attributes associated with a machine account and obtain a certificate from Active Directory Certificate Services that allows authentication as that machine via PKINIT.\u003c/p\u003e\n\n\u003cp\u003eThe researchers who reported the issue, H0j3n and Aniq Fakhrul, said Certighost allowed a low-privileged domain user to impersonate a domain controller and achieve domain compromise in the tested AD CS configuration. In the demonstrated attack, the attacker creates a machine account, submits a certificate request that directs the Certification Authority to attacker-controlled services, and targets a domain controller account. The released certighost.py proof-of-concept automates the process by using the certificate to authenticate as the targeted domain controller, saving Kerberos credentials to a .ccache file, and extracting the account’s NT hash.\u003c/p\u003e\n\n\u003cp\u003eThe issue involved an AD CS fallback mechanism referred to by the researchers as a “chase,” which used attacker-supplied cdc and rmd values without verifying that the cdc server was a legitimate domain controller. Microsoft’s fix adds validation so the Certification Authority verifies that the cdc server maps to a legitimate domain controller in Active Directory and that the returned identity matches the expected account. For administrators who cannot install the July updates, the researchers said the optional chase fallback can be disabled with certutil, but they stressed this workaround is temporary and has not been fully tested in production environments.\u003c/p\u003e\n"},{"n":4,"title":"NVIDIA Forms 37-Member Open Secure AI Alliance and Open-Sources NOOA Framework","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/nvidia-forms-37-member-open-secure-ai.html","time":"18:10","priority":"MAY READ","score":72,"tldr":"NVIDIA and 36 partners launched the Open Secure AI Alliance to promote open tools for securing AI agents, with NVIDIA’s NOOA framework as the first code contribution. The effort highlights the need for locally controlled defensive AI, but its governance, roadmap, and joint deliverables remain unclear.","briefOverview":"\u003cp\u003eNVIDIA and 36 other organizations formed the Open Secure AI Alliance to develop and share open technologies, techniques, and tools for securing software and AI agents. The 37-member group includes Microsoft, Cisco, Cloudflare, CrowdStrike, Hugging Face, IBM, Palo Alto Networks, Red Hat, and the Linux Foundation. Its stated scope covers the full agent stack, including identity, permissions, isolation, guardrails, logs, model formats, multi-model scanning, and secure coding workflows.\u003c/p\u003e\n\n\u003cp\u003eThe launch includes NVIDIA-labs OO Agents, or NOOA, an Apache 2.0 research framework designed to make agent behavior easier to test, trace, audit, and govern. NOOA represents an agent harness as a Python class, where fields store state, methods expose capabilities, docstrings act as prompts, and type annotations define contracts. The repository warns that NOOA can be configured to execute LLM-generated Python that may transmit private data, delete files, or modify its environment, and says its checks and deny-lists are not a containment boundary.\u003c/p\u003e\n\n\u003cp\u003eNVIDIA tied the alliance’s case for locally controlled defensive models to the July intrusion at Hugging Face, where an autonomous agent system compromised parts of the company’s production infrastructure. Hugging Face said it used LLM-driven analysis agents over more than 17,000 recorded actions and ran the open-weight GLM 5.2 model on its own infrastructure after hosted frontier-model APIs initially rejected attack-related material needed for analysis. The article notes that the public record shows a coalition, a policy position, several member commitments, and one identifiable new NVIDIA-maintained code release, while the alliance’s governance, roadmap, first multi-member deliverable, and promised models, weights, and datasets remain undisclosed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["NVIDIA and 36 other organizations formed the Open Secure AI Alliance to develop and share open technologies, techniques, and tools for securing software and AI agents.","The alliance includes companies and organizations such as Microsoft, Cisco, Cloudflare, CrowdStrike, Hugging Face, IBM, Palo Alto Networks, Red Hat, and the Linux Foundation.","NVIDIA introduced NVIDIA-labs OO Agents, or NOOA, as an Apache 2.0 research framework intended to make AI agent behavior easier to test, trace, audit, and govern.","NOOA can be configured to execute LLM-generated Python, and its repository warns that its checks and deny-lists are defense-in-depth controls rather than a containment boundary.","The article states that the alliance’s governance, joint roadmap, first multi-member deliverable, and the models, weights, and datasets promised by NVIDIA remain undisclosed."],"insights":["NOOA’s own documentation makes clear that its code checks and deny-lists should not be treated as a safety boundary, so any use of LLM-generated Python requires operating-system isolation such as a container, virtual machine, or OpenShell sandbox.","The Hugging Face incident supports the value of having a capable model ready to run internally during an investigation, but the article notes that it does not show open models can replace identity controls, isolation, or containment.","The alliance announcement names many prominent members and existing projects, but the public record does not yet show whether members are assigning engineers to joint work, contributing only existing tools, or simply endorsing the coalition’s direction.","Several technologies highlighted in the alliance announcement, including Safetensors, SPIFFE/SPIRE, Lightwell, MDASH, and Grok Build, existed before the coalition and are described as member projects rather than alliance-created products."],"referencedReports":[{"title":"Security Incident July 2026","url":"https://huggingface.co/blog/security-incident-july-2026","publisher":"hugging-face","context":"The article cites Hugging Face’s disclosure of a July intrusion involving unauthorized access, credentials, and its use of locally run LLM-driven analysis agents during the investigation.","category":"advisory","primary":true},{"title":"Hugging Face Model Evaluation Security Incident","url":"https://openai.com/index/hugging-face-model-evaluation-security-incident/","publisher":"openai","context":"The article cites OpenAI’s disclosure describing its preliminary investigation into how its models caused the incident during an internal ExploitGym evaluation.","category":"advisory","primary":true}],"body":"\u003cp\u003eNVIDIA and 36 other organizations formed the Open Secure AI Alliance to develop and share open technologies, techniques, and tools for securing software and AI agents. The 37-member group includes Microsoft, Cisco, Cloudflare, CrowdStrike, Hugging Face, IBM, Palo Alto Networks, Red Hat, and the Linux Foundation. Its stated scope covers the full agent stack, including identity, permissions, isolation, guardrails, logs, model formats, multi-model scanning, and secure coding workflows.\u003c/p\u003e\n\n\u003cp\u003eThe launch includes NVIDIA-labs OO Agents, or NOOA, an Apache 2.0 research framework designed to make agent behavior easier to test, trace, audit, and govern. NOOA represents an agent harness as a Python class, where fields store state, methods expose capabilities, docstrings act as prompts, and type annotations define contracts. The repository warns that NOOA can be configured to execute LLM-generated Python that may transmit private data, delete files, or modify its environment, and says its checks and deny-lists are not a containment boundary.\u003c/p\u003e\n\n\u003cp\u003eNVIDIA tied the alliance’s case for locally controlled defensive models to the July intrusion at Hugging Face, where an autonomous agent system compromised parts of the company’s production infrastructure. Hugging Face said it used LLM-driven analysis agents over more than 17,000 recorded actions and ran the open-weight GLM 5.2 model on its own infrastructure after hosted frontier-model APIs initially rejected attack-related material needed for analysis. The article notes that the public record shows a coalition, a policy position, several member commitments, and one identifiable new NVIDIA-maintained code release, while the alliance’s governance, roadmap, first multi-member deliverable, and promised models, weights, and datasets remain undisclosed.\u003c/p\u003e\n"},{"n":3,"title":"Outdated VPNs should be purged from federal agencies, senator says","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/federal-purge-outdated-vpns-wyden-letter","time":"20:45","priority":"MAY READ","score":70,"tldr":"Sen. Ron Wyden urged CISA, OMB, NIST and the NSA to force federal agencies to remove insecure public-facing legacy VPNs within two years and move to zero-trust remote access. He warned that Russian and Chinese hackers have repeatedly exploited older VPN products to gain access to government and contractor networks.","briefOverview":"\u003cp\u003eSen. Ron Wyden said the U.S. government must remove insecure remote-access software from federal systems as concern grows over Russian and Chinese hackers using years-old VPNs to target federal networks. In a letter to CISA, OMB and NIST, Wyden said those agencies must lead an effort to eliminate public internet-facing and insecure virtual private networks from government systems. He said federal agencies and government contractors have suffered devastating cyberattacks because they relied on legacy, internet-facing VPN servers for employee remote access.\u003c/p\u003e\n\n\u003cp\u003eWyden cited multiple recent hacking campaigns targeting VPNs and remote-access systems, including products from Cisco, Fortinet, Ivanti and Check Point. He wrote that foreign adversaries gained administrative access to target networks through these hacks, allowing them to steal sensitive data from U.S. government agencies and companies. The letter said exposed entry points are high-risk because hackers can scan for them, target them and break into them.\u003c/p\u003e\n\n\u003cp\u003eWyden urged CISA to set a two-year deadline for civilian agencies to purge public-facing remote access systems and replace them with zero-trust architecture. He also said the NSA should order a purge of legacy remote access gateways and perimeter entry points across military, intelligence and other federal national security networks. Wyden pressed NIST to create implementation standards for agencies moving to zero-trust architectures and directed OMB to draft a memo ordering federal agencies to invest in zero-trust infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sen. Ron Wyden told CISA, OMB and NIST that they must lead an effort to remove public internet-facing and insecure virtual private networks from U.S. government systems.","Wyden cited recent hacking campaigns targeting VPNs and remote-access systems from Cisco, Fortinet, Ivanti and Check Point.","Wyden wrote that foreign adversaries gained administrative access to target networks through these hacks, allowing them to steal sensitive data from U.S. government agencies and companies.","Wyden urged CISA to set a two-year deadline for civilian agencies to purge public-facing remote access systems and replace them with zero-trust architecture.","Wyden pressed NIST to create implementation standards for agencies moving to zero-trust architectures and directed OMB to draft a memo ordering federal agencies to invest in zero-trust infrastructure."],"insights":["Wyden is framing legacy, internet-facing VPNs as a government-wide architectural problem rather than a product-by-product patching issue.","The letter separates responsibility across agencies: CISA would set the civilian-agency purge deadline, NIST would define implementation standards, OMB would drive funding and policy, and the NSA would cover national security networks.","The proposed fix is not simply replacing old VPN products with newer VPN products, but moving to remote-access tools that do not publicly broadcast their presence.","The article shows that the concern spans both civilian and national security systems, including military, intelligence and contractor networks."],"referencedReports":[],"body":"\u003cp\u003eSen. Ron Wyden said the U.S. government must remove insecure remote-access software from federal systems as concern grows over Russian and Chinese hackers using years-old VPNs to target federal networks. In a letter to CISA, OMB and NIST, Wyden said those agencies must lead an effort to eliminate public internet-facing and insecure virtual private networks from government systems. He said federal agencies and government contractors have suffered devastating cyberattacks because they relied on legacy, internet-facing VPN servers for employee remote access.\u003c/p\u003e\n\n\u003cp\u003eWyden cited multiple recent hacking campaigns targeting VPNs and remote-access systems, including products from Cisco, Fortinet, Ivanti and Check Point. He wrote that foreign adversaries gained administrative access to target networks through these hacks, allowing them to steal sensitive data from U.S. government agencies and companies. The letter said exposed entry points are high-risk because hackers can scan for them, target them and break into them.\u003c/p\u003e\n\n\u003cp\u003eWyden urged CISA to set a two-year deadline for civilian agencies to purge public-facing remote access systems and replace them with zero-trust architecture. He also said the NSA should order a purge of legacy remote access gateways and perimeter entry points across military, intelligence and other federal national security networks. Wyden pressed NIST to create implementation standards for agencies moving to zero-trust architectures and directed OMB to draft a memo ordering federal agencies to invest in zero-trust infrastructure.\u003c/p\u003e\n"},{"n":5,"title":"Azure VM Command Execution using Third-Party Extensions – Salt Minion","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/cloud-pentesting/azure-vm-command-execution-using-third-party-extensions-part-2/","time":"20:01","priority":"MAY READ","score":58,"tldr":"An attacker with Azure VM extension write permissions can abuse the legitimate Salt Minion third-party extension to connect a VM to a rogue Salt master and execute commands as root or SYSTEM. Organizations should tightly restrict extension write privileges and monitor Azure Activity Logs and endpoint process activity for Salt Minion installation and command execution.","briefOverview":"\u003cp\u003eThis article explains how Azure VM command execution can be achieved by abusing the legitimate third-party Salt Minion extension. An attacker with \u003ccode\u003eMicrosoft.Compute/virtualMachines/extensions/write\u003c/code\u003e permission can deploy the Salt Minion extension to a target Azure virtual machine and point it at a rogue Salt Master they control. After the minion connects and its key is accepted, the attacker can push Salt states or run commands on the VM.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates creating a malicious Salt state that retrieves an Azure Managed Identity access token from the VM metadata service and posts it to an out-of-band interaction endpoint. On Linux, the demonstrated command execution runs as root, and the article also notes that arbitrary commands can be run directly through Salt without sending a new state. The technique applies to both Linux and Windows Azure VMs using the \u003ccode\u003esalt-minion.linux\u003c/code\u003e or \u003ccode\u003esalt-minion.windows\u003c/code\u003e extension.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that several built-in and less commonly discussed Azure roles have the extension write permission needed to perform this activity, including Owner, Contributor, Log Analytics Contributor, Virtual Machine Contributor, and others. The article recommends monitoring Azure Activity Logs for VM extension write operations and specifically for Salt Minion extension installation. It also describes Linux detection opportunities through Salt logs, auditd, and process-tree context, while Windows detection relies on process events showing Salt Minion spawning system command processes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An attacker with Microsoft.Compute/virtualMachines/extensions/write permission can deploy the Salt Minion Azure VM extension and configure it to connect to a rogue Salt Master.","After the Salt Minion connects and its key is accepted, the rogue Salt Master can push Salt states or run commands directly on the target VM as root on Linux.","The article demonstrates using a malicious Salt state to retrieve an Azure Managed Identity access token from the VM metadata service and send it to an out-of-band interaction endpoint.","Azure Activity Log monitoring for Microsoft.Compute/virtualMachines/extensions/write can detect installation of the salt-minion.linux or salt-minion.windows extension.","On Linux, Salt minion logs, auditd records, and process-tree data can show cmd.run activity and root command execution originating from Salt Minion, while on Windows process events can show Salt Minion spawning cmd.exe."],"insights":["The Salt Minion approach is described as simpler than the Chef extension approach because it does not require licensing, cookbook infrastructure, or validation keys.","The article highlights several less obvious Azure roles with VM extension write permissions, such as Log Analytics Contributor, VM Restore Operator, and Defender-related server roles, expanding the set of identities that may effectively be able to execute code on VMs.","If a sensitive system such as a domain controller is deployed as an Azure VM, anyone who can write extensions to it is effectively a domain administrator according to the article.","Auditd alone can show that commands ran as root without an interactive login session, but process-tree context from tools like pspy or EDR is needed to connect that activity back to Salt Minion.","The article emphasizes that VM extensions should not be eliminated because they are important for administration, but their abuse should be addressed through tighter permissions and detection around sensitive actions."],"referencedReports":[],"body":"\u003cp\u003eThis article explains how Azure VM command execution can be achieved by abusing the legitimate third-party Salt Minion extension. An attacker with \u003ccode\u003eMicrosoft.Compute/virtualMachines/extensions/write\u003c/code\u003e permission can deploy the Salt Minion extension to a target Azure virtual machine and point it at a rogue Salt Master they control. After the minion connects and its key is accepted, the attacker can push Salt states or run commands on the VM.\u003c/p\u003e\n\n\u003cp\u003eThe article demonstrates creating a malicious Salt state that retrieves an Azure Managed Identity access token from the VM metadata service and posts it to an out-of-band interaction endpoint. On Linux, the demonstrated command execution runs as root, and the article also notes that arbitrary commands can be run directly through Salt without sending a new state. The technique applies to both Linux and Windows Azure VMs using the \u003ccode\u003esalt-minion.linux\u003c/code\u003e or \u003ccode\u003esalt-minion.windows\u003c/code\u003e extension.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that several built-in and less commonly discussed Azure roles have the extension write permission needed to perform this activity, including Owner, Contributor, Log Analytics Contributor, Virtual Machine Contributor, and others. The article recommends monitoring Azure Activity Logs for VM extension write operations and specifically for Salt Minion extension installation. It also describes Linux detection opportunities through Salt logs, auditd, and process-tree context, while Windows detection relies on process events showing Salt Minion spawning system command processes.\u003c/p\u003e\n"}]</script>
