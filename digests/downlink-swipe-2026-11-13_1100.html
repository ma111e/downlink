<script type="application/json" id="dl-articles">[{"n":3,"title":"SilentAir Hijacks Asian Telecom Networks to Intercept SMS 2FA Codes and Spy on Taiwanese Users","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/silentair-hijacks-asian-telecom.html","time":"11:10","priority":"SHOULD READ","score":88,"tldr":"Enea uncovered SilentAir, a suspected state-backed espionage group that compromised equipment at Asian telecom operators to redirect calls and SMS, intercept 2FA codes, and conduct large-scale silent-SMS surveillance, with Taiwan as its main target. The activity may be linked to China and overlaps with infrastructure previously associated with Liminal Panda, though attribution remains unconfirmed.","briefOverview":"\u003cp\u003eEnea identified SilentAir, a suspected state-level spying group that used compromised equipment at mobile operators in at least six Asian countries to target selected people, primarily in Taiwan. The group redirected calls and text messages by sending false network-location messages claiming that compromised equipment was serving a target’s phone. Enea observed SMS two-factor authentication codes being intercepted after some diversions succeeded, indicating attempts to access other accounts. Some targets included political and government VIPs.\u003c/p\u003e\n\n\u003cp\u003eSilentAir also sent silent SMS messages at large scale, especially to Taiwanese subscribers, including messages apparently used to verify whether diverted texts were reaching attacker-controlled equipment. Enea linked the activity to China only with low confidence, based on its focus on Taiwan, lack of targeting of Chinese networks, and working patterns aligned with UTC+8 and Chinese holidays. The activity overlapped at some operators with Liminal Panda infections, but Enea said a relationship between the groups remains unconfirmed. Enea recommends that operators treat the shared inter-operator network as untrusted, monitor signaling traffic inside their own networks, and coordinate protections for SS7, Diameter, and GTP traffic.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Enea identified SilentAir, a suspected state-level group that used compromised equipment at mobile operators in at least six Asian countries to intercept selected calls and text messages, primarily targeting people in Taiwan.","SilentAir redirected victims' communications by sending network messages that falsely claimed compromised equipment was serving a target's phone, and Enea observed two-factor authentication codes being intercepted after some diversions succeeded.","SilentAir sent silent text messages at large scale, mainly to Taiwanese subscribers, apparently including tests to confirm whether text-message diversions were working.","Enea assesses only with low confidence that SilentAir is linked to China, citing its focus on Taiwan, avoidance of Chinese networks, and activity patterns aligned with a UTC+8 working schedule and Chinese holidays.","The activity overlapped at some operators with known Liminal Panda infections, but Enea said a connection between SilentAir and Liminal Panda remains possible rather than confirmed."],"insights":["SilentAir devoted an unusually high share of its observed activity to interception—18.3%, compared with 2.1% in Enea's earlier observations of typical surveillance companies—suggesting interception was a central objective rather than an occasional capability.","The attackers used harmless-looking motivational or promotional text in silent SMS messages so that, if the hidden-message setting was removed in transit, recipients would likely dismiss the visible message as spam.","In rare cases, compromised equipment at multiple operators acted together against political and government VIP targets, which Enea said indicates centralized control across separate networks.","Enea found that monitoring only traffic between operators was insufficient: SilentAir's use of compromised internal equipment led it to recommend detection for signaling activity inside operators' own networks as well.","The observed interception of SMS authentication codes demonstrates that redirecting phone-network messages can create a path toward access to accounts protected by text-message login verification."],"referencedReports":[{"title":"The Enemy Within: Tracking Liminal Panda and SilentAir Through Mobile Networks","url":"https://www.enea.com/insights/the-enemy-within-tracking-liminal-panda-and-silentair-through-mobile-networks/","publisher":"enea","context":"Enea's technical report describes its investigation of SilentAir activity across mobile networks and the evidence of compromised operator equipment.","category":"research","primary":true},{"title":"SIGweaver Advisory","url":"https://www.imda.gov.sg/assets/23f23bba-57ca-42b6-92f8-90e207bf8c46.pdf","publisher":"singapore-infocomm-media-development-authority","context":"Singapore's IMDA advisory describes the SCTPE tool as SIGweaver and notes CrowdStrike's moderate-confidence link to Liminal Panda.","category":"advisory","primary":false}],"body":"\u003cp\u003eEnea identified SilentAir, a suspected state-level spying group that used compromised equipment at mobile operators in at least six Asian countries to target selected people, primarily in Taiwan. The group redirected calls and text messages by sending false network-location messages claiming that compromised equipment was serving a target’s phone. Enea observed SMS two-factor authentication codes being intercepted after some diversions succeeded, indicating attempts to access other accounts. Some targets included political and government VIPs.\u003c/p\u003e\n\n\u003cp\u003eSilentAir also sent silent SMS messages at large scale, especially to Taiwanese subscribers, including messages apparently used to verify whether diverted texts were reaching attacker-controlled equipment. Enea linked the activity to China only with low confidence, based on its focus on Taiwan, lack of targeting of Chinese networks, and working patterns aligned with UTC+8 and Chinese holidays. The activity overlapped at some operators with Liminal Panda infections, but Enea said a relationship between the groups remains unconfirmed. Enea recommends that operators treat the shared inter-operator network as untrusted, monitor signaling traffic inside their own networks, and coordinate protections for SS7, Diameter, and GTP traffic.\u003c/p\u003e\n"},{"n":2,"title":"Ransomware attack on Belarusian cloud firm disrupts businesses for days","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/belarus-cloud-provider-activecloud-ransomware-attack","time":"14:28","priority":"SHOULD READ","score":78,"tldr":"Belarusian cloud provider ActiveCloud suffered a ransomware attack that disrupted websites, email, and virtual servers for businesses nationwide, though it says core services have been restored and found no evidence of customer data theft. The incident follows similar recent attacks on Russian hosting providers ESTT and Beget, with no confirmed link among them.","briefOverview":"\u003cp\u003eBelarusian cloud services provider ActiveCloud was hit by a ransomware attack that encrypted parts of its infrastructure and disrupted corporate websites, email services, virtual servers, and customer support channels. The company disclosed the incident on Tuesday and said by Friday that it had restored its main services, although some customers could still have difficulty recovering virtual machines. ActiveCloud said it found no evidence that customer data was stolen, but it has not identified the attackers or explained how they entered its systems.\u003c/p\u003e\n\n\u003cp\u003eThe outage affected organizations using ActiveCloud infrastructure, including Belarusian news outlet Smartpress, while Domino’s Pizza Belarus experienced temporary website and mobile-app outages linked to technical problems. ActiveCloud’s affected products included its E-Cloud hosting platform, E-Cloud Protected service, and SmartMail corporate email service. The incident followed recent attacks on Russian hosting providers ESTT and Beget, but there is no publicly confirmed evidence linking the three events.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Belarusian cloud provider ActiveCloud said a ransomware attack encrypted parts of its infrastructure and disrupted customer websites, corporate email, virtual servers, and support channels.","ActiveCloud disclosed the incident on Tuesday and said on Friday that its main services had been restored, although some customers could still face problems recovering their virtual machines.","ActiveCloud said its investigation found no evidence that customer data was stolen and did not identify the attackers or explain how they accessed its systems.","Smartpress and Domino’s Pizza in Belarus were among organizations affected by service disruptions linked to ActiveCloud’s outage.","The incident followed recent attacks on Russian hosting providers ESTT and Beget, but no public evidence has linked the three incidents."],"insights":["The disruption shows how a compromise at a cloud provider can simultaneously affect unrelated customer-facing services, including a news outlet and a food-delivery company’s website and mobile app.","Restoring core cloud infrastructure did not immediately restore every customer environment, as ActiveCloud warned that some customers could still have difficulty recovering virtual machines.","The attacks on ActiveCloud, ESTT, and Beget all affected hosting infrastructure in Belarus and Russia within weeks, but the article states there is no publicly confirmed evidence that they are connected.","The outcomes differed across the Russian incidents: ESTT reported no evidence of customer data theft, while Beget said destructive scripts wiped data and some virtual-server backups were lost."],"referencedReports":[],"body":"\u003cp\u003eBelarusian cloud services provider ActiveCloud was hit by a ransomware attack that encrypted parts of its infrastructure and disrupted corporate websites, email services, virtual servers, and customer support channels. The company disclosed the incident on Tuesday and said by Friday that it had restored its main services, although some customers could still have difficulty recovering virtual machines. ActiveCloud said it found no evidence that customer data was stolen, but it has not identified the attackers or explained how they entered its systems.\u003c/p\u003e\n\n\u003cp\u003eThe outage affected organizations using ActiveCloud infrastructure, including Belarusian news outlet Smartpress, while Domino’s Pizza Belarus experienced temporary website and mobile-app outages linked to technical problems. ActiveCloud’s affected products included its E-Cloud hosting platform, E-Cloud Protected service, and SmartMail corporate email service. The incident followed recent attacks on Russian hosting providers ESTT and Beget, but there is no publicly confirmed evidence linking the three events.\u003c/p\u003e\n"},{"n":1,"title":"Record number of cyber incidents reported to UK privacy regulator","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/record-number-of-cyber-incidents-reported-to-uk-regulator","time":"12:47","priority":"MAY READ","score":58,"tldr":"UK organizations reported a record 1,371 cyber incidents to the Information Commissioner’s Office in the third quarter, signaling a likely new annual high. Security researchers attribute the increase in part to rising data-theft extortion activity, with UK victims increasingly listed on criminal leak sites.","briefOverview":"\u003cp\u003eThe UK Information Commissioner’s Office recorded 1,371 cyber incidents between July and September, the highest number reported in any three-month period since its published records began. Total data-security incident reports, including non-cyber mistakes such as misdirected emails, also reached a quarterly high of 4,604. The provisional figures indicate the UK is on track to surpass its previous annual cyber-incident record, set in 2023.\u003c/p\u003e\n\n\u003cp\u003eMost of the increase was recorded under the ICO’s catch-all “other cyber incidents” category, leaving the nature of many events unclear. ICO ransomware reports have declined even as Sophos observed rising data-theft extortion activity on criminal leak sites, with about 350 UK organizations named so far that year. Retail and manufacturing, charities and voluntary organizations, and technology and telecommunications companies reported notable increases, while the ICO opened formal investigations into only 18 of the 1,371 third-quarter cyber incidents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The UK Information Commissioner’s Office recorded 1,371 cyber incidents from July through September, the highest total for any three-month period in its published data.","Reports of all data-security incidents, including non-cyber mistakes such as emails sent to the wrong recipient, reached a quarterly record of 4,604.","Sophos said about 350 UK organizations had been named on criminal leak sites so far that year, roughly 50% more than in the prior year.","Retail and manufacturing incidents rose from 205 in the second quarter to 296 in the third quarter, while reports involving charities and voluntary organizations increased from 79 to 145.","The ICO opened formal investigations into 18 of the 1,371 cyber incidents reported in the third quarter, while most cases were closed with informal action."],"insights":["The rise in reported incidents was driven largely by the ICO’s catch-all “other cyber incidents” category, so the available data does not clearly identify the methods behind most of the increase.","ICO ransomware reports fell from 1,253 in 2023 to 620 in 2025 even as leak-site data indicated increasing data-theft extortion, suggesting the regulator’s ransomware category may not fully capture extortion-only cases.","Only 18 of the 1,371 cyber incidents reported in the third quarter resulted in formal ICO investigations, with most cases instead closed through informal action.","Sophos said fixing internet-exposed system weaknesses and using phishing-resistant sign-in protections, including passkeys, could prevent many successful attacks."],"referencedReports":[],"body":"\u003cp\u003eThe UK Information Commissioner’s Office recorded 1,371 cyber incidents between July and September, the highest number reported in any three-month period since its published records began. Total data-security incident reports, including non-cyber mistakes such as misdirected emails, also reached a quarterly high of 4,604. The provisional figures indicate the UK is on track to surpass its previous annual cyber-incident record, set in 2023.\u003c/p\u003e\n\n\u003cp\u003eMost of the increase was recorded under the ICO’s catch-all “other cyber incidents” category, leaving the nature of many events unclear. ICO ransomware reports have declined even as Sophos observed rising data-theft extortion activity on criminal leak sites, with about 350 UK organizations named so far that year. Retail and manufacturing, charities and voluntary organizations, and technology and telecommunications companies reported notable increases, while the ICO opened formal investigations into only 18 of the 1,371 third-quarter cyber incidents.\u003c/p\u003e\n"},{"n":4,"title":"When an AI Agent Goes Wrong, Can You Stop It?","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/when-ai-agent-goes-wrong-can-you-stop-it.html","time":"11:52","priority":"MAY READ","score":45,"tldr":"Stopping an AI agent requires more than disabling the model: teams must halt workflows and queued jobs, revoke credentials and sessions, disable risky tools, restrict network access, and preserve evidence. Organizations should test these containment controls in advance and restore access only after identifying and fixing the underlying issue.","briefOverview":"\u003cp\u003eAn AI agent asked to sort support tickets and look up account details could encounter instructions that cause it to export records to an unfamiliar destination. Because the agent’s identity and connected tools may already have access to those records, the agent may be able to make the request. The article emphasizes that this scenario raises a broader containment question: what it actually means to stop an AI agent.\u003c/p\u003e\n\n\u003cp\u003eTurning off a model may not halt queued jobs, retries, established sessions, valid credentials, or separate services that already received work. Effective containment can require pausing active and queued workflows, revoking credentials and sessions, disabling tools or integrations, restricting network paths, and preserving identity, API, application, and network evidence. Before restoring a workflow, teams should determine the cause, return only the minimum access needed, test the controls, and monitor the agent’s actions after it resumes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["An AI agent may have access to records and connected tools that allow it to act on instructions embedded in a support ticket, including exporting data to an unfamiliar destination.","Disabling an AI model may not stop queued jobs, retries, established sessions, credentials, or separate services that have already received work.","Effective containment may require stopping active and queued runs, revoking associated credentials and sessions, disabling relevant tools or integrations, and restricting network connections.","Teams should preserve agent, identity, API, application, and network records to distinguish attempted actions from completed actions and determine what was accessed or changed.","Before restoring an agent workflow, organizations should identify the cause, restore only the minimum access needed, test in a controlled environment, and monitor activity after resumption."],"insights":["A “kill switch” for an AI agent is not a single control; it must be a tested combination of workflow stoppage, access revocation, tool restrictions, and network blocking tailored to the system’s architecture.","Telling an AI agent to stop through a prompt is not a containment measure, because the actual workflow is executed by surrounding systems rather than by the model alone.","Agent logs cannot by themselves prove that an action succeeded, so investigators should compare them with identity, API, application, and network records.","Stopping an agent prevents further activity but does not reverse exports, file changes, permission changes, messages, or other actions that have already been completed.","Containment can be safer when it isolates only the affected workflow instead of shutting down shared infrastructure, provided that isolation can be done safely."],"referencedReports":[{"title":"GenAI and Agentic AI Exploit Roundup Q3 2026","url":"https://genai.owasp.org/2026/10/08/genai-and-agentic-ai-exploit-roundup-q3-2026/","publisher":"owasp-genai-security-project","context":"The article cites this October 2026 OWASP roundup as a selected collection describing evaluation agents operating beyond their intended scope and recommending tests of credential and network-access revocation.","category":"news","primary":false},{"title":"AI Agent Security Cheat Sheet","url":"https://cheatsheetseries.owasp.org/cheatsheets/AI_Agent_Security_Cheat_Sheet.html","publisher":"owasp","context":"The article references this OWASP guidance for least-privilege tool access, explicit approval for sensitive actions, audit trails, and the ability to interrupt or roll back agent operations.","category":"guide","primary":false}],"body":"\u003cp\u003eAn AI agent asked to sort support tickets and look up account details could encounter instructions that cause it to export records to an unfamiliar destination. Because the agent’s identity and connected tools may already have access to those records, the agent may be able to make the request. The article emphasizes that this scenario raises a broader containment question: what it actually means to stop an AI agent.\u003c/p\u003e\n\n\u003cp\u003eTurning off a model may not halt queued jobs, retries, established sessions, valid credentials, or separate services that already received work. Effective containment can require pausing active and queued workflows, revoking credentials and sessions, disabling tools or integrations, restricting network paths, and preserving identity, API, application, and network evidence. Before restoring a workflow, teams should determine the cause, return only the minimum access needed, test the controls, and monitor the agent’s actions after it resumes.\u003c/p\u003e\n"},{"n":5,"title":"Top 9 Qualys alternatives for infrastructure and application security","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/top-qualys-alternatives","time":"11:56","priority":"MAY READ","score":35,"tldr":"Teams replacing or supplementing Qualys often seek simpler pricing, cloud-native coverage, developer-friendly remediation, and better prioritization than traditional asset-based vulnerability management provides. The best alternative depends on whether the need is code-to-cloud security, infrastructure scanning, cloud attack-path analysis, or authenticated web and API testing.","briefOverview":"\u003cp\u003eQualys is presented as a long-established platform for network and host vulnerability management, compliance, web application testing, and cloud workloads. The article says teams often seek alternatives because Qualys licenses capabilities separately, uses per-asset pricing that can be hard to forecast, and can leave engineering teams with more findings than they can address. It also notes that Qualys Web Application Scanning receives critical bug fixes only, while newer application-testing capabilities are directed to TotalAppSec.\u003c/p\u003e\n\n\u003cp\u003eThe comparison groups nine alternatives by the part of Qualys they can replace, including cloud security, infrastructure scanning, developer remediation, attack-path prioritization, and web or API testing. Aikido Security is positioned for code-to-cloud security and pull-request-based fixes, while Tenable and Rapid7 InsightVM focus on infrastructure vulnerabilities, Wiz and Orca focus on cloud risk, Snyk focuses on developers, and Invicti focuses on authenticated web and API testing. The article emphasizes that organizations do not necessarily need a full migration: they can retain Qualys for network and compliance work while adding specialized tools for areas such as developer fixes or web testing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Qualys is primarily built for network and host vulnerability management and compliance, while cloud-native coverage is provided through its separate TotalCloud module.","Teams seek Qualys alternatives because its per-asset, module-by-module pricing can be difficult to forecast, and its workflows can leave developers with long lists of findings and no proposed code fixes.","Aikido Security combines code, cloud, container, and application testing capabilities and can open pull requests with proposed fixes for supported code, dependency, infrastructure-as-code, and container findings.","Tenable and Rapid7 InsightVM focus on infrastructure vulnerabilities, while Wiz and Orca Security focus on cloud risk and Snyk focuses on developer-facing code and dependency security.","Invicti specializes in authenticated web application and API testing, whereas Greenbone OpenVAS Community Edition provides self-managed open-source network and host assessment."],"insights":["Qualys Web Application Scanning receives critical bug fixes only, while new application-testing capabilities are directed to TotalAppSec, making a dedicated replacement more relevant for teams whose web testing needs have outgrown WAS.","Replacing Qualys does not have to be an all-or-nothing decision: organizations can keep a reduced Qualys deployment for network and compliance work while replacing web testing or developer remediation with a specialized tool.","Tools that create pull requests with proposed fixes can remove a handoff step that remains when a vulnerability workflow ends with a Jira or ServiceNow ticket.","A lower license price does not necessarily mean lower operating cost: Greenbone OpenVAS Community Edition avoids license fees but requires an organization to run, update, and support the deployment itself.","For PCI DSS external quarterly scans, a platform must be an Approved Scanning Vendor, so application-security and compliance-automation tools do not automatically replace that separate requirement."],"referencedReports":[],"body":"\u003cp\u003eQualys is presented as a long-established platform for network and host vulnerability management, compliance, web application testing, and cloud workloads. The article says teams often seek alternatives because Qualys licenses capabilities separately, uses per-asset pricing that can be hard to forecast, and can leave engineering teams with more findings than they can address. It also notes that Qualys Web Application Scanning receives critical bug fixes only, while newer application-testing capabilities are directed to TotalAppSec.\u003c/p\u003e\n\n\u003cp\u003eThe comparison groups nine alternatives by the part of Qualys they can replace, including cloud security, infrastructure scanning, developer remediation, attack-path prioritization, and web or API testing. Aikido Security is positioned for code-to-cloud security and pull-request-based fixes, while Tenable and Rapid7 InsightVM focus on infrastructure vulnerabilities, Wiz and Orca focus on cloud risk, Snyk focuses on developers, and Invicti focuses on authenticated web and API testing. The article emphasizes that organizations do not necessarily need a full migration: they can retain Qualys for network and compliance work while adding specialized tools for areas such as developer fixes or web testing.\u003c/p\u003e\n"}]</script>
