<script type="application/json" id="dl-articles">[{"n":1,"title":"Critical ScreenConnect flaw now actively exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-of-hackers-exploiting-critical-screenconnect-flaw/","time":"11:14","priority":"MUST READ","score":96,"tldr":"CISA warns that attackers are actively exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect authorization flaw that can enable unauthorized file transfer and execution during remote sessions. Organizations should upgrade to ScreenConnect 26.6.5 or later immediately, as more than 1,000 exposed instances reportedly remain unpatched.","briefOverview":"\u003cp\u003eCISA says attackers are actively exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect flaw involving improper privilege management and missing authorization. The issue can allow an attacker with basic privileges to transfer or execute files through an active remote session without authorization or confirmation from the host. ConnectWise patched the flaw in ScreenConnect 26.6.5 and later, after initially advising customers to disable TransferFiles permissions as a temporary measure.\u003c/p\u003e\n\n\u003cp\u003eCISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected systems within three days. Shadowserver tracks more than 1,000 unpatched ScreenConnect instances exposed online, primarily in North America and Europe. ScreenConnect is used by managed service providers and IT teams for troubleshooting, patching, and maintenance, and ConnectWise provides services to more than 100,000 IT providers worldwide.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA says attackers are actively exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect flaw involving improper privilege management and missing authorization.","The flaw can allow attackers with basic privileges to transfer or execute files through active remote sessions without authorization or host confirmation.","ConnectWise patched the issue in ScreenConnect version 26.6.5 and later, after previously recommending that teams disable TransferFiles permissions as a temporary mitigation.","CISA added CVE-2026-84869 to its Known Exploited Vulnerabilities catalog and directed U.S. federal agencies to secure affected systems within three days.","Shadowserver tracked more than 1,000 unpatched ScreenConnect instances exposed online, with most located in North America and Europe."],"insights":["The issue does not require user interaction and can be abused by an attacker with only basic privileges, making it a comparatively low-effort route to move or run files during an active remote session.","The temporary mitigation specifically targeted the TransferFiles permission, indicating that disabling this capability was intended to reduce exposure before the patch was available.","CISA has identified four actively exploited ScreenConnect issues since 2024, and two of those earlier issues were also used in ransomware attacks.","ScreenConnect is widely used by managed service providers and IT teams, and ConnectWise says it serves more than 100,000 IT providers worldwide, increasing the practical importance of prompt remediation."],"referencedReports":[{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/09/11/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"cisa","context":"CISA's alert states that CVE-2026-84869 was added to the Known Exploited Vulnerabilities Catalog and directs U.S. federal agencies to remediate it within three days.","category":"advisory","primary":true}],"body":"\u003cp\u003eCISA says attackers are actively exploiting CVE-2026-84869, a critical ConnectWise ScreenConnect flaw involving improper privilege management and missing authorization. The issue can allow an attacker with basic privileges to transfer or execute files through an active remote session without authorization or confirmation from the host. ConnectWise patched the flaw in ScreenConnect 26.6.5 and later, after initially advising customers to disable TransferFiles permissions as a temporary measure.\u003c/p\u003e\n\n\u003cp\u003eCISA added the flaw to its Known Exploited Vulnerabilities Catalog and ordered U.S. federal agencies to secure affected systems within three days. Shadowserver tracks more than 1,000 unpatched ScreenConnect instances exposed online, primarily in North America and Europe. ScreenConnect is used by managed service providers and IT teams for troubleshooting, patching, and maintenance, and ConnectWise provides services to more than 100,000 IT providers worldwide.\u003c/p\u003e\n"},{"n":11,"title":"Google Patches Pixel Modem Flaw Amid Signs of Limited Targeted Exploitation","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/google-patches-pixel-modem-flaw-amid.html","time":"11:15","priority":"MUST READ","score":93,"tldr":"Google patched CVE-2026-58704, a high-severity Pixel cellular modem permission-bypass flaw that may be under limited targeted exploitation. Pixel users should install the September 2026 update with security patch level 2026-09-05 or later.","briefOverview":"\u003cp\u003eGoogle disclosed that CVE-2026-58704, a high-severity flaw in the Pixel Cellular Modem, may be under limited, targeted exploitation. The flaw has a CVSS score of 8.0 and stems from a logic error that can bypass permissions. It could allow a nearby attacker to gain elevated access without needing prior execution privileges or user interaction. Google did not provide details about the attacks or the responsible threat actor.\u003c/p\u003e\n\n\u003cp\u003eGoogle\u0026rsquo;s September 2026 Pixel updates also address 109 additional security flaws. These include 88 privilege-escalation issues, 10 information-disclosure issues, nine remote-code-execution issues, and two denial-of-service issues. The update includes two high-severity Kernel privilege-escalation flaws and 46 critical-severity flaws affecting components such as BigOcean, Bootloader, IP Multimedia Subsystem, and Trusted Execution Environment. Google said Pixel devices with security patch level 2026-09-05 or later resolve all identified flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google disclosed that CVE-2026-58704 is a high-severity privilege-escalation flaw in the Pixel Cellular Modem and may be under limited, targeted exploitation.","The flaw is caused by a logic error that can enable a nearby attacker to bypass permissions and gain elevated access without user interaction.","Google's September 2026 Pixel updates address CVE-2026-58704 and 109 other security flaws.","Google said that applying a Pixel security patch level of 2026-09-05 or later resolves all of the identified flaws.","The September update includes 46 critical-severity flaws in Pixel components including BigOcean, Bootloader, IP Multimedia Subsystem, and Trusted Execution Environment."],"insights":["The modem flaw does not require the phone owner to do anything for it to be exploited, which makes installing the available update especially important.","Google described the observed activity as limited and targeted, but did not disclose how the flaw was being used or who was behind it.","The modem issue is part of a much larger September 2026 Pixel update that fixes 109 additional flaws, including nine that could allow remote code execution.","A security patch level of 2026-09-05 or later resolves every flaw identified in the update."],"referencedReports":[{"title":"Pixel Update Bulletin—September 2026","url":"https://source.android.com/docs/security/bulletin/pixel/2026/2026-09-01","publisher":"google","context":"Google's Pixel security bulletin discloses CVE-2026-58704 and the September 2026 fixes for Pixel devices.","category":"advisory","primary":true}],"body":"\u003cp\u003eGoogle disclosed that CVE-2026-58704, a high-severity flaw in the Pixel Cellular Modem, may be under limited, targeted exploitation. The flaw has a CVSS score of 8.0 and stems from a logic error that can bypass permissions. It could allow a nearby attacker to gain elevated access without needing prior execution privileges or user interaction. Google did not provide details about the attacks or the responsible threat actor.\u003c/p\u003e\n\n\u003cp\u003eGoogle\u0026rsquo;s September 2026 Pixel updates also address 109 additional security flaws. These include 88 privilege-escalation issues, 10 information-disclosure issues, nine remote-code-execution issues, and two denial-of-service issues. The update includes two high-severity Kernel privilege-escalation flaws and 46 critical-severity flaws affecting components such as BigOcean, Bootloader, IP Multimedia Subsystem, and Trusted Execution Environment. Google said Pixel devices with security patch level 2026-09-05 or later resolve all identified flaws.\u003c/p\u003e\n"},{"n":8,"title":"Acronis cPanel Backup Plugin Vulnerability Exploited in Targeted Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/acronis-cpanel-backup-plugin.html","time":"11:08","priority":"SHOULD READ","score":88,"tldr":"Acronis says attackers have exploited CVE-2026-87886, a high-severity local privilege-escalation flaw caused by insecure file permissions in its cPanel/WHM Backup plugin. Organizations should immediately update to version 1.9.3 HF3 or later; the related Plesk extension is fixed in build 1.8.11.638.","briefOverview":"\u003cp\u003eAcronis has warned that a high-severity security flaw in its Backup plugin for cPanel and Web Host Manager (WHM) has been exploited in limited, targeted attacks. The issue, tracked as CVE-2026-87886, has a CVSS score of 7.8 and stems from insecure file permissions. Acronis said all users should install the available fix immediately.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects Acronis Backup plugin for cPanel and WHM on Linux before build 1.9.3.1021, with a fix included in version 1.9.3 HF3. It also affects the Acronis Backup extension for Plesk on Linux before build 1.8.11.638. An attacker with low privileges could gain greater permissions, potentially enabling unauthorized actions or arbitrary code execution that affects the application\u0026rsquo;s confidentiality and integrity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Acronis reported that CVE-2026-87886, a high-severity local privilege-escalation flaw in its Backup plugin for cPanel and WHM, has been exploited in limited, targeted attacks.","The flaw has a CVSS score of 7.8 and is caused by insecure file permissions.","Acronis Backup plugin for cPanel and WHM on Linux versions before build 1.9.3.1021 are affected, and version 1.9.3 HF3 contains a fix.","The Acronis Backup extension for Plesk on Linux versions before build 1.8.11.638 is also affected.","An attacker with low privileges could use the flaw to gain greater permissions and potentially perform unauthorized actions or run arbitrary code affecting the application's confidentiality and integrity."],"insights":["Although the flaw requires an attacker to already have low-level access, successful use can give them much greater control and allow unauthorized actions or code execution.","Acronis confirmed real-world exploitation but provided no public details about the attackers, their goals, the detection date, or how long the flaw may have been abused.","The issue affects both Acronis backup integrations for cPanel/WHM and Plesk on Linux, so users of either platform should verify they have applied the relevant update."],"referencedReports":[{"title":"SEC-10986","url":"https://security-advisory.acronis.com/advisories/SEC-10986","publisher":"acronis","context":"The article cites this Acronis security advisory as the source for details on CVE-2026-87886.","category":"advisory","primary":true}],"body":"\u003cp\u003eAcronis has warned that a high-severity security flaw in its Backup plugin for cPanel and Web Host Manager (WHM) has been exploited in limited, targeted attacks. The issue, tracked as CVE-2026-87886, has a CVSS score of 7.8 and stems from insecure file permissions. Acronis said all users should install the available fix immediately.\u003c/p\u003e\n\n\u003cp\u003eThe flaw affects Acronis Backup plugin for cPanel and WHM on Linux before build 1.9.3.1021, with a fix included in version 1.9.3 HF3. It also affects the Acronis Backup extension for Plesk on Linux before build 1.8.11.638. An attacker with low privileges could gain greater permissions, potentially enabling unauthorized actions or arbitrary code execution that affects the application\u0026rsquo;s confidentiality and integrity.\u003c/p\u003e\n"},{"n":13,"title":"NightEagle targets Russian companies","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/tr/nighteagle-apt-ghostcontainer-and-tunneling/121323/","time":"10:00","priority":"SHOULD READ","score":88,"tldr":"Kaspersky reports that the NightEagle (APT-Q-95) group has expanded from Asian targets to Russian companies, using stolen VPN credentials, the GhostContainer Exchange backdoor, and legitimate tunneling tools to retain access. The group also exploits Active Directory weaknesses and BlueKeep to move laterally, steal credentials, and potentially compromise domain controllers.","briefOverview":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated several incidents involving NightEagle (APT-Q-95), a group active since at least 2023 that has expanded from targets in Asia to businesses in Russia. The attackers commonly entered corporate VPNs using compromised valid credentials, with connections traced to Russian IP addresses associated with Cloudflare WARP tunnels and European virtual infrastructure providers. They deployed the GhostContainer backdoor on Microsoft Exchange servers during initial access and later stages of the intrusion.\u003c/p\u003e\n\n\u003cp\u003eGhostContainer receives commands through Exchange request headers, can redirect network traffic, and attempts to evade Windows security monitoring by altering functions in AMSI and Windows event logging components. NightEagle used Microsoft dev tunnels, rdp2tcp, GitHub-hosted tools disguised as legitimate software, and Impacket’s atexec utility to maintain access and move through internal networks. In one incident, the group exploited the BlueKeep vulnerability, requested Kerberos tickets with unusual flags, and attempted Active Directory replication to obtain password hashes and ultimately compromise domain controllers and the victim’s Active Directory infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Kaspersky’s Global Emergency Response Team investigated NightEagle (APT-Q-95) incidents targeting businesses in Russia, expanding beyond the group’s previously reported focus on organizations in Asia.","Attackers commonly used compromised valid credentials to access corporate VPNs, with connections originating from Russian IP addresses linked to Cloudflare WARP tunnels and European virtual infrastructure providers.","NightEagle deployed the GhostContainer backdoor on Microsoft Exchange servers, using it to process command-and-control instructions, evade security monitoring, and redirect network traffic.","The group used Microsoft dev tunnels and rdp2tcp to expose and tunnel Remote Desktop Protocol access, and used Impacket’s atexec utility to create scheduled tasks for port forwarding.","In one incident, attackers exploited CVE-2019-0708 (BlueKeep), requested Kerberos tickets with unusual flags, and attempted DCSync activity to obtain domain account password hashes and compromise Active Directory infrastructure."],"insights":["NightEagle combined Microsoft dev tunnels with rdp2tcp to preserve remote access through legitimate services while avoiding additional suspicious open ports.","Use of rdp2tcp can be identified in Windows Remote Desktop logs because virtual-channel events 132 and 148 may contain the channel name \"rdp2tcp\" or attacker-selected random alphanumeric names.","The group disguised tools in GitHub repositories and archives with legitimate-looking names, while the executable names inside the archives mimicked unrelated well-known software.","GhostContainer is designed to receive commands through Microsoft Exchange request headers and to weaken Windows security monitoring by altering functions in AMSI and Windows event logging components.","The attackers used long-lived Kerberos tickets, password-hash theft, and attempted Active Directory replication to establish persistence and potentially take control of an organization’s identity infrastructure."],"referencedReports":[],"body":"\u003cp\u003eKaspersky’s Global Emergency Response Team investigated several incidents involving NightEagle (APT-Q-95), a group active since at least 2023 that has expanded from targets in Asia to businesses in Russia. The attackers commonly entered corporate VPNs using compromised valid credentials, with connections traced to Russian IP addresses associated with Cloudflare WARP tunnels and European virtual infrastructure providers. They deployed the GhostContainer backdoor on Microsoft Exchange servers during initial access and later stages of the intrusion.\u003c/p\u003e\n\n\u003cp\u003eGhostContainer receives commands through Exchange request headers, can redirect network traffic, and attempts to evade Windows security monitoring by altering functions in AMSI and Windows event logging components. NightEagle used Microsoft dev tunnels, rdp2tcp, GitHub-hosted tools disguised as legitimate software, and Impacket’s atexec utility to maintain access and move through internal networks. In one incident, the group exploited the BlueKeep vulnerability, requested Kerberos tickets with unusual flags, and attempted Active Directory replication to obtain password hashes and ultimately compromise domain controllers and the victim’s Active Directory infrastructure.\u003c/p\u003e\n"},{"n":14,"title":"Atomic macOS (AMOS) Stealer Activity","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/atomic-macos-amos-stealer-activity/","time":"10:00","priority":"SHOULD READ","score":78,"tldr":"Atomic macOS (AMOS) stealer is an actively evolving macOS infostealer spread through malicious software-installation pages that trick users into pasting commands into Terminal. It establishes persistence, requests access to user data and applications, and exfiltrates credentials, browser data, messaging data, cryptocurrency-wallet information, and other files to changing command-and-control infrastructure.","briefOverview":"\u003cp\u003eUnit 42 analyzed an Atomic macOS (AMOS) stealer infection generated in a lab on Aug. 5, 2026, after a user followed instructions from a malicious website advertising a “macOS toolkit.” The site at getmacouscloud[.]com instructed the user to copy text into Terminal, which downloaded a Zsh script and launched a multi-stage installation process. The authors note that this copy-and-paste lure resembles ClickFix activity but does not meet their definition of a traditional ClickFix campaign because it did not use a fake CAPTCHA or clipboard-injection verification page.\u003c/p\u003e\n\n\u003cp\u003eThe infection saved AMOS components in hidden-looking directories under the user’s Library/Application Support folder and requested the user’s password and permissions to control Finder and Notes and access Desktop and Documents files. It collected information into /tmp/out.zip, including data associated with browsers, messaging applications, cryptocurrency wallets, cloud tools, and shell history, then sent HTTP POST requests to a command-and-control server. The article emphasizes that AMOS infrastructure, file names, hashes, directory paths, and command-and-control addresses change frequently, while its overall collection and upload patterns remain consistent.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article analyzes an Atomic macOS (AMOS) stealer infection generated in a lab on August 5, 2026, after a user followed instructions on a malicious website advertising a “macOS toolkit.”","The malicious page at getmacouscloud[.]com instructed users to copy and paste text into Terminal, which downloaded a Zsh script and ultimately installed AMOS stealer components.","The infection saved persistent files under hidden-looking directories in the user’s Library/Application Support folder, including AccountsHelper and mdworker_shared Mach-O binaries.","After the user entered an administrative password, Terminal requested access to Finder, the Desktop and Documents folders, and the Notes application.","AMOS collected data into /tmp/out.zip and sent HTTP POST requests to a command-and-control server, with URL paths indicating collection of messengers, credentials, browsers, wallets, and local data."],"insights":["The article distinguishes this copy-and-paste lure from a traditional ClickFix campaign: it did not use a fake CAPTCHA or clipboard-injection verification page, even though it similarly directed the victim to run text in Terminal.","The initial downloaded Zsh script concealed its next stage as Base64-encoded, GZIP-compressed content, showing that the visible first-stage command was only part of a multi-stage installation chain.","The infected test Mac had no additional applications installed, yet the collected archive included paths for Binance, TonKeeper, AWS, Docker, FileZilla, and Google Cloud data, revealing the range of applications and data sources AMOS was designed to search for.","A comparison of infections only days apart found different command-and-control IP addresses while retaining similar data-upload URL patterns, indicating that behavioral patterns may remain useful even as domains, IPs, filenames, hashes, and storage paths change.","The malware used hidden-looking directory names resembling Apple-related locations under the user’s Application Support folder, which could make its persistent files less noticeable during a manual review."],"referencedReports":[{"title":"Atomic macOS (AMOS) Stealer infection","url":"https://www.malware-traffic-analysis.net/2026/06/09/index.html","publisher":"Malware-Traffic-Analysis.net","context":"The article cites this prior AMOS infection analysis as an example of malware distribution through malicious advertisements.","category":"research","primary":false},{"title":"Atomic MacOS (AMOS) stealer infection","url":"https://isc.sans.edu/diary/Atomic+MacOS+AMOS+stealer+infection/33208/","publisher":"SANS Technology Institute, Internet Storm Center","context":"The article references this prior infection analysis when comparing AMOS command-and-control traffic and discussing fake macOS toolkit installation pages.","category":"research","primary":false},{"title":"Inside Amos Stealer: How This Threat Targets macOS Credentials and Keychains","url":"https://www.cyberproof.com/blog/inside-amos-stealer-how-this-threat-targets-macos-credentials-and-keychains/","publisher":"CyberProof","context":"The article cites this analysis in support of AMOS stealing sensitive information from browsers and cryptocurrency wallets.","category":"research","primary":false},{"title":"Threat Actor Selling New Atomic macOS (AMOS) Stealer on Telegram","url":"https://cyble.com/blog/threat-actor-selling-new-atomic-macos-amos-stealer-on-telegram/","publisher":"Cyble","context":"The article cites this report to note that AMOS was advertised on Telegram as early as April 2024.","category":"news","primary":false},{"title":"Why AMOS matters: The macOS malware stealing data at scale","url":"https://www.sophos.com/en-us/blog/why-amos-matters-the-macos-malware-stealing-data-at-scale","publisher":"Sophos","context":"The article cites this threat analysis to characterize AMOS as a growing macOS stealer threat.","category":"research","primary":false}],"body":"\u003cp\u003eUnit 42 analyzed an Atomic macOS (AMOS) stealer infection generated in a lab on Aug. 5, 2026, after a user followed instructions from a malicious website advertising a “macOS toolkit.” The site at getmacouscloud[.]com instructed the user to copy text into Terminal, which downloaded a Zsh script and launched a multi-stage installation process. The authors note that this copy-and-paste lure resembles ClickFix activity but does not meet their definition of a traditional ClickFix campaign because it did not use a fake CAPTCHA or clipboard-injection verification page.\u003c/p\u003e\n\n\u003cp\u003eThe infection saved AMOS components in hidden-looking directories under the user’s Library/Application Support folder and requested the user’s password and permissions to control Finder and Notes and access Desktop and Documents files. It collected information into /tmp/out.zip, including data associated with browsers, messaging applications, cryptocurrency wallets, cloud tools, and shell history, then sent HTTP POST requests to a command-and-control server. The article emphasizes that AMOS infrastructure, file names, hashes, directory paths, and command-and-control addresses change frequently, while its overall collection and upload patterns remain consistent.\u003c/p\u003e\n"},{"n":4,"title":"TrustSink: How a Rogue External MFA Provider Steals Passwords","source":"varonis.com","sourceColorIdx":9,"link":"https://www.varonis.com/blog/trustsink","time":"13:00","priority":"MAY READ","score":72,"tldr":"Varonis researchers demonstrated TrustSink, a post-compromise technique in which a privileged attacker registers a rogue Microsoft Entra External Authentication Method that silently captures users’ plaintext passwords during legitimate MFA flows. Defenders should monitor Authentication Methods Policy and related application changes, remove unauthorized providers before resetting passwords, and restrict privileged identity roles.","briefOverview":"\u003cp\u003eVaronis Threat Labs demonstrated TrustSink, a credential-phishing technique that turns a trusted Microsoft Entra External Authentication Method provider into a persistent password-capture mechanism. An attacker with a Global Administrator or Authentication Policy Administrator role can register a rogue provider that presents users with a convincing Microsoft-style password page during a normal MFA sign-in flow. The provider records the password in plaintext, then returns a valid signed token so the user reaches the intended application without an error.\u003c/p\u003e\n\n\u003cp\u003eThe proof of concept used a minimal FastAPI OpenID Connect server that supplied Entra with a discovery document and public signing key, redirected users to a fake password page, and posted a signed response back to Microsoft. Resetting a user’s password alone does not remove the threat because the rogue provider can capture the replacement password at the next sign-in. Defenders should monitor Authentication Methods Policy changes, newly created related applications and service principals, unfamiliar external-provider issuers in sign-in logs, and remove unauthorized providers before resetting affected credentials.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Varonis Threat Labs demonstrated TrustSink, a technique that uses a rogue Microsoft Entra External Authentication Method provider to capture plaintext passwords during a legitimate sign-in flow.","TrustSink requires a Global Administrator or Authentication Policy Administrator account to register the external authentication provider, making it a post-compromise technique.","The rogue provider can present a convincing password page to users, record the submitted password, and return a valid signed token that allows the sign-in to complete without an error.","Resetting a captured password does not stop TrustSink if the rogue provider remains registered, because it can capture the replacement password at the user’s next sign-in.","Defenders should monitor Authentication Methods Policy changes, related application and service-principal creation, unfamiliar provider issuers in sign-in logs, and remove unauthorized providers before resetting affected credentials."],"insights":["Microsoft Entra accepted tokens signed by the rogue provider’s self-generated key as long as the key ID and signature matched, without validating a certificate chain or the key’s origin.","The phishing page appears after users have already entered their real password on Microsoft’s site, making a second password request seem plausible within the same sign-in process.","An unfamiliar external-provider issuer reporting hardware-key claims such as \"amr: [hwk]\" is a particularly reliable sign-in-log indicator because the provider cannot avoid identifying itself there.","Registering the external method unexpectedly added a FIDO key to the test user’s SearchableDeviceKey property, creating an additional artifact defenders can investigate.","Automated deployment created an application, service principal, and delegated permission grant within seconds of one another, providing a correlated audit trail even though the tool’s user-agent string can be changed."],"referencedReports":[{"title":"Bringing Your Own Identity in Entra ID","url":"https://www.youtube.com/watch?v=eKFgOtNpxwU","publisher":"Dirk-jan Mollema","context":"The article says TrustSink builds on this x33fcon 2025 talk, which showed that a rogue registered External Authentication Method provider could bypass MFA by returning a signed JWT without a real authentication check.","category":"research","primary":true}],"body":"\u003cp\u003eVaronis Threat Labs demonstrated TrustSink, a credential-phishing technique that turns a trusted Microsoft Entra External Authentication Method provider into a persistent password-capture mechanism. An attacker with a Global Administrator or Authentication Policy Administrator role can register a rogue provider that presents users with a convincing Microsoft-style password page during a normal MFA sign-in flow. The provider records the password in plaintext, then returns a valid signed token so the user reaches the intended application without an error.\u003c/p\u003e\n\n\u003cp\u003eThe proof of concept used a minimal FastAPI OpenID Connect server that supplied Entra with a discovery document and public signing key, redirected users to a fake password page, and posted a signed response back to Microsoft. Resetting a user’s password alone does not remove the threat because the rogue provider can capture the replacement password at the next sign-in. Defenders should monitor Authentication Methods Policy changes, newly created related applications and service principals, unfamiliar external-provider issuers in sign-in logs, and remove unauthorized providers before resetting affected credentials.\u003c/p\u003e\n"},{"n":5,"title":"Ukraine moves to crack down on scam call centers after corruption scandal","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/ukraine-call-center-scam-crackdown","time":"12:45","priority":"MAY READ","score":72,"tldr":"Ukraine’s parliament approved legislation imposing up to 12 years in prison for organizing, operating or recruiting for fraudulent call centers, following allegations that Prosecutor General’s Office officials accepted bribes to shield such operations.","briefOverview":"\u003cp\u003eUkraine’s parliament approved legislation imposing tougher penalties for electronic fraud, the misuse of personal or banking data, and involvement in fraudulent call centers. The bill would make it a distinct crime to establish, manage, work for, or recruit people for such operations. Organizers and workers could face seven to 12 years in prison if the measure is signed by President Volodymyr Zelenskyy.\u003c/p\u003e\n\n\u003cp\u003eThe legislation was advanced after anti-corruption investigators alleged that Prosecutor General’s Office officials accepted bribes from scam call centers in exchange for protection from law enforcement. NABU said five people were named as suspects, while former Prosecutor General Ruslan Kravchenko denied protecting such centers and has not been charged. Ukrainian authorities have also reported disrupting large scam operations, including a Kyiv center accused of stealing more than $500,000 from dozens of Americans and a nationwide action that shut down 94 suspected call centers after 411 searches.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukraine’s parliament approved legislation creating separate crimes for electronic fraud, personal or banking data misuse, and establishing, operating, working for, or recruiting people into fraudulent call centers.","Under the legislation, people convicted of organizing or working for fraudulent call centers could face seven to 12 years in prison, pending President Volodymyr Zelenskyy’s signature.","The bill advanced after anti-corruption investigators alleged that Prosecutor General’s Office officials had collected bribes from scam call centers since mid-2025 in exchange for law-enforcement protection.","Ukraine’s National Anti-Corruption Bureau said five people were named as suspects, while former Prosecutor General Ruslan Kravchenko denied protecting call centers and has not been charged.","Ukrainian authorities reported dismantling a Kyiv call center accused of taking more than $500,000 from dozens of Americans and later shutting down 94 suspected fraudulent call centers during a nationwide operation."],"insights":["The legislation treats participation in a fraudulent call center, including recruitment, as a distinct offense rather than only pursuing the individuals who directly deceive victims.","The alleged protection scheme indicates that enforcement against scam call centers was reportedly undermined from within the Prosecutor General’s Office, not solely by the operators’ ability to evade police.","The reported Kyiv operation used English-speaking workers from the United States, West Africa, and Europe to impersonate financial advisers, showing that victims abroad were targeted through internationally sourced staff.","Ukraine’s nationwide operation involved 411 searches and the closure of 94 suspected call centers in one week, indicating that authorities described the problem as widespread rather than isolated."],"referencedReports":[],"body":"\u003cp\u003eUkraine’s parliament approved legislation imposing tougher penalties for electronic fraud, the misuse of personal or banking data, and involvement in fraudulent call centers. The bill would make it a distinct crime to establish, manage, work for, or recruit people for such operations. Organizers and workers could face seven to 12 years in prison if the measure is signed by President Volodymyr Zelenskyy.\u003c/p\u003e\n\n\u003cp\u003eThe legislation was advanced after anti-corruption investigators alleged that Prosecutor General’s Office officials accepted bribes from scam call centers in exchange for protection from law enforcement. NABU said five people were named as suspects, while former Prosecutor General Ruslan Kravchenko denied protecting such centers and has not been charged. Ukrainian authorities have also reported disrupting large scam operations, including a Kyiv center accused of stealing more than $500,000 from dozens of Americans and a nationwide action that shut down 94 suspected call centers after 411 searches.\u003c/p\u003e\n"},{"n":7,"title":"Flock camera use by internal affairs unit puts DC police at odds with officers’ union ","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/dc-police-union-opposes-flock-camera-use-probing-officers","time":"13:41","priority":"MAY READ","score":68,"tldr":"Washington, D.C.’s police union is challenging the Metropolitan Police Department’s use of Flock license-plate-reader cameras to secretly track officers under internal-affairs investigation, citing inadequate controls and transparency. The dispute, headed to arbitration, adds to growing nationwide backlash against Flock’s surveillance technology.","briefOverview":"\u003cp\u003eWashington, D.C.’s police union says the Metropolitan Police Department’s Internal Affairs investigators used Flock automated license plate recognition cameras to track sworn officers under investigation without their knowledge. The union learned of the practice in July and subsequently filed a complaint demanding that MPD stop using Flock to track officers. MPD said its position is that license plate reader use in the misconduct investigation was appropriate, while the union said the dispute is headed to arbitration.\u003c/p\u003e\n\n\u003cp\u003eThe union argues that MPD has not established or enforced sufficient controls for Flock’s broad tracking capabilities, including consistent justification, logging, and audit requirements for personnel at every rank. It said MPD denied its grievance and declined to investigate managers involved in the searches, then issued a department-wide access restriction the same day, though MPD did not comment on the alleged restrictions or their timing. The case comes amid nationwide scrutiny of Flock, with Secure Justice reporting that more than 90 U.S. cities and counties ended work with the company in August, and a DC Council committee chair requesting answers about MPD’s Flock data use and need for the technology.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The DC Police Union says Metropolitan Police Department Internal Affairs investigators used Flock automated license plate recognition cameras to track sworn officers under investigation without their knowledge.","The union filed a complaint seeking to stop the practice, but says MPD denied it and declined to investigate managers involved in the searches; MPD says the dispute is headed to arbitration.","MPD said its position is that using license plate reader data in the misconduct investigation was appropriate.","DC Councilmember Brooke Pinto asked MPD Interim Chief Jeffery Carroll 10 questions about the department’s use of Flock data and why it needs the technology.","The dispute comes amid wider scrutiny of Flock, with Secure Justice reporting that more than 90 U.S. cities and counties stopped working with the company during August."],"insights":["The union’s opposition is notable because a police union is calling for limits on police surveillance powers, which a Center for Democracy and Technology expert said he had not previously seen expressed so forcefully by a rank-and-file union.","According to the union, MPD issued a department-wide access restriction on the same day it denied the union’s grievance, suggesting that access rules were changed amid the dispute.","The article says there are no known prior cases of police departments using Flock automated license plate recognition cameras to monitor their own personnel, making the MPD case unusual.","The scrutiny extends beyond the labor dispute: a DC Council committee chair requested detailed information on how MPD uses Flock data and why the department needs the technology."],"referencedReports":[{"title":"Flock Safety backlash: Places with biggest impact","url":"https://therecord.media/flock-safety-backlash-places-with-biggest-impact","publisher":"secure-justice","context":"The article cites an analysis by digital-rights nonprofit Secure Justice finding that more than 90 U.S. cities and counties stopped working with Flock during August.","category":"research","primary":false}],"body":"\u003cp\u003eWashington, D.C.’s police union says the Metropolitan Police Department’s Internal Affairs investigators used Flock automated license plate recognition cameras to track sworn officers under investigation without their knowledge. The union learned of the practice in July and subsequently filed a complaint demanding that MPD stop using Flock to track officers. MPD said its position is that license plate reader use in the misconduct investigation was appropriate, while the union said the dispute is headed to arbitration.\u003c/p\u003e\n\n\u003cp\u003eThe union argues that MPD has not established or enforced sufficient controls for Flock’s broad tracking capabilities, including consistent justification, logging, and audit requirements for personnel at every rank. It said MPD denied its grievance and declined to investigate managers involved in the searches, then issued a department-wide access restriction the same day, though MPD did not comment on the alleged restrictions or their timing. The case comes amid nationwide scrutiny of Flock, with Secure Justice reporting that more than 90 U.S. cities and counties ended work with the company in August, and a DC Council committee chair requesting answers about MPD’s Flock data use and need for the technology.\u003c/p\u003e\n"},{"n":10,"title":"N0va Phishkit Targets US and EU Businesses: A New Challenge for Identity Security","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/n0va-phishkit-targets-us-and-eu.html","time":"11:58","priority":"MAY READ","score":67,"tldr":"The N0va phishing kit targets North American and European organizations by impersonating trusted business platforms and abusing legitimate device-code authentication flows to steal tokens and gain SSO access. Organizations should prioritize identity-focused detection and rapid containment of suspicious authentication activity.","briefOverview":"\u003cp\u003eN0va is a phishing kit targeting organizations in North America and Europe, including those in government, technology, consulting, and healthcare. It impersonates familiar business services such as Microsoft Teams, SharePoint, OneDrive, DocuSign, Google Drive, Dropbox, Zoom, and Adobe Sign. The campaign is significant because it can compromise valid business accounts without relying on obvious malware activity.\u003c/p\u003e\n\n\u003cp\u003eRather than using only fake login pages, N0va can lead victims through legitimate sign-in processes and capture their access and refresh tokens. Attackers can then use token exchange or device-registration mechanisms to establish single sign-on access to email, files, cloud applications, and other corporate resources. A compromised identity can lead to financial fraud, exposure of sensitive data, operational disruption, compliance or legal consequences, and reputational damage.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N0va targets organizations in North America and Europe, including government, technology, consulting, and healthcare organizations.","The phishing kit impersonates business platforms such as Microsoft Teams, SharePoint, OneDrive, DocuSign, Google Drive, Dropbox, Zoom, and Adobe Sign.","N0va can guide victims through legitimate authentication flows, capture access and refresh tokens, and use token exchange or device registration to gain SSO access to corporate resources.","A compromised identity can expose email, files, cloud applications, sensitive data, and other business systems, potentially causing financial loss, operational disruption, compliance consequences, and reputational damage.","The article promotes ANY.RUN's threat intelligence, interactive sandbox, and threat intelligence feeds as tools for investigating and detecting N0va activity."],"insights":["N0va does not need obvious malicious software to compromise an organization because it can abuse legitimate sign-in processes and steal valid access credentials.","The campaign’s use of recognizable services can make phishing interactions appear more credible than a conventional fake login page.","The article identifies a characteristic N0va URL structure, \"/api/verification/init?session=*\u0026flow=*prompt_profile=\", that can help analysts link related campaign activity.","In an example involving a Microsoft-themed lure, ANY.RUN reported its sandbox produced an initial malicious verdict in 24 seconds while showing the full attack chain in the same session.","The article says that distributing confirmed indicators into existing security tools can extend detection beyond the single phishing case that first exposed the campaign."],"referencedReports":[],"body":"\u003cp\u003eN0va is a phishing kit targeting organizations in North America and Europe, including those in government, technology, consulting, and healthcare. It impersonates familiar business services such as Microsoft Teams, SharePoint, OneDrive, DocuSign, Google Drive, Dropbox, Zoom, and Adobe Sign. The campaign is significant because it can compromise valid business accounts without relying on obvious malware activity.\u003c/p\u003e\n\n\u003cp\u003eRather than using only fake login pages, N0va can lead victims through legitimate sign-in processes and capture their access and refresh tokens. Attackers can then use token exchange or device-registration mechanisms to establish single sign-on access to email, files, cloud applications, and other corporate resources. A compromised identity can lead to financial fraud, exposure of sensitive data, operational disruption, compliance or legal consequences, and reputational damage.\u003c/p\u003e\n"},{"n":12,"title":"The Fake IRS Notice That Disproved Itself","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/irs-cp2000-lure-notice-table-names-a-tax-year-that-cannot-exist-yet","time":"11:00","priority":"MAY READ","score":67,"tldr":"A phishing email impersonating the IRS exposed itself through an impossible CP2000 tax-year claim: it referenced a return that could not yet have been filed or reconciled. The case shows that checking internal inconsistencies in authoritative-looking messages can identify fraud before analyzing links or headers.","briefOverview":"\u003cp\u003eA phishing email impersonating the IRS reached a commercial construction contractor with a government-style header, logo, detail table, public IRS phone number, and a “Download Your Document” button. It contradicted itself by referring to a document for the “2026 filing year” while its table named a “CP2000 Notice - Tax Year 2026.” The article explains that a CP2000 compares a filed return against third-party reporting, so it cannot be issued for a tax year whose return has not yet been filed.\u003c/p\u003e\n\n\u003cp\u003eThe sender used the display name “IRS.GOV” on an unrelated, long-established domain, while the visible To field was a fabricated no-reply address and the real recipient was delivered BCC-style. SPF passed for the sending domain, but no DKIM signature or DMARC result appeared, and the article stresses that authentication of the unrelated sender did not validate the IRS identity in the message. The sole button led to attacker-registered imahdyirs.es behind a shared CDN proxy, which returned a 403 response to scanning; IRONSCALES quarantined the message roughly seven seconds after receipt based on its malicious-link verdict, language and structure analysis, and community resolutions of similar incidents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The phishing email impersonated the IRS and contained conflicting claims about a “2026 filing year” and a “CP2000 Notice - Tax Year 2026.”","A CP2000 notice compares a filed tax return with third-party reporting, so the article states that it cannot exist before the return for the named tax year has been filed.","The message used the display name “IRS.GOV” on an unrelated sending domain and placed the real recipient only in the envelope and delivery header.","The email’s single download button linked to imahdyirs.es, which was behind a shared CDN proxy and returned a 403 response to the scanner.","IRONSCALES quarantined the message roughly seven seconds after receipt based on its malicious-link verdict, language and structure analysis, and community resolutions of similar incidents."],"insights":["The forged notice was most easily disproved by the precise details intended to make it credible: its formal table contained claims that could be checked against each other and against the tax calendar.","A clean SPF result for a long-established sending domain did not validate the IRS identity, because the authentication applied to the unrelated sending domain rather than the agency named in the message.","The attacker avoided hosted images by embedding the IRS-style logo directly in the email as base64 data, leaving no remote image or tracking pixel to inspect.","The destination site’s 403 response meant the scanner did not observe its final content, so the article cautions against assuming what the link would have served.","The visible recipient field was fabricated to repeat the IRS brand while the actual target was delivered BCC-style, showing that email address fields a reader sees may not identify the real recipient."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report for statistics on phishing, human involvement in breaches, pretexting, and AI-assisted malicious email text.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA guidance when explaining that IRS-themed email notices and download links should be treated as phishing pretexts.","category":"guide","primary":false}],"body":"\u003cp\u003eA phishing email impersonating the IRS reached a commercial construction contractor with a government-style header, logo, detail table, public IRS phone number, and a “Download Your Document” button. It contradicted itself by referring to a document for the “2026 filing year” while its table named a “CP2000 Notice - Tax Year 2026.” The article explains that a CP2000 compares a filed return against third-party reporting, so it cannot be issued for a tax year whose return has not yet been filed.\u003c/p\u003e\n\n\u003cp\u003eThe sender used the display name “IRS.GOV” on an unrelated, long-established domain, while the visible To field was a fabricated no-reply address and the real recipient was delivered BCC-style. SPF passed for the sending domain, but no DKIM signature or DMARC result appeared, and the article stresses that authentication of the unrelated sender did not validate the IRS identity in the message. The sole button led to attacker-registered imahdyirs.es behind a shared CDN proxy, which returned a 403 response to scanning; IRONSCALES quarantined the message roughly seven seconds after receipt based on its malicious-link verdict, language and structure analysis, and community resolutions of similar incidents.\u003c/p\u003e\n"},{"n":6,"title":"EU chief wants joint response to cyberattacks, sabotage","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/eu-chief-wants-joint-response-to-cyberattacks","time":"13:14","priority":"MAY READ","score":65,"tldr":"European Commission President Ursula von der Leyen proposed an EU Emergency Security Protocol that would let any member state convene all 27 governments to coordinate responses to cyberattacks, sabotage, arson, and drone incursions. The proposal aims to address escalating hybrid threats but leaves unclear whether it would overcome the EU’s unanimity-based decision-making constraints.","briefOverview":"\u003cp\u003eEuropean Commission President Ursula von der Leyen proposed an Emergency Security Protocol that would allow any EU member state to summon all 27 governments after security threats including cyberattacks, sabotage, arson, and drone incursions. Speaking in Strasbourg, she said such threats were increasing and cited recent incidents in Denmark, Lithuania, Poland, and an attempted drone attack in Leipzig. The mechanism would be modeled on NATO’s Article 4, which enables consultations when a member’s security is threatened.\u003c/p\u003e\n\n\u003cp\u003eThe proposal is intended to coordinate a European response, deter escalation, and limit the consequences of an incident, particularly for hostile acts below the threshold of armed aggression. However, it does not explain what action would follow a meeting or whether it would alter EU rules requiring unanimous approval for many foreign-policy decisions and sanctions. Von der Leyen also announced plans for a European Security Council and an instrument supporting capabilities including air and missile defence, transport, refuelling, space systems, and cyber capabilities, with further details expected in a forthcoming European security strategy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["European Commission President Ursula von der Leyen proposed an Emergency Security Protocol that would allow any EU member state to call a meeting of all 27 governments after threats such as cyberattacks, sabotage, arson, or drone incursions.","Von der Leyen said the proposed protocol would be modeled on NATO’s Article 4 consultation mechanism and would aim to coordinate a European response, deter escalation, and limit an incident’s consequences.","The proposal does not specify what governments would do after convening or whether it would change EU foreign and security policy rules that often require unanimous approval.","Von der Leyen also announced plans for a European Security Council involving EU leaders and partners including Britain, Canada, Norway, and Ukraine.","The Commission plans to include the protocol and other defence initiatives in a forthcoming European security strategy."],"insights":["The proposed protocol is designed for hostile acts below the level of armed aggression, addressing a gap between routine national incidents and formal collective-defence commitments.","Its practical impact remains uncertain because convening governments does not itself remove the EU’s unanimity requirement for many foreign-policy decisions, including sanctions.","The failure to promptly renew Russia sanctions illustrates the agreement problems the proposal would face: EU ambassadors extended the measures for only seven days while negotiations continued.","The planned European Security Council would extend discussions beyond EU members by including partners such as Britain, Canada, Norway, and Ukraine."],"referencedReports":[],"body":"\u003cp\u003eEuropean Commission President Ursula von der Leyen proposed an Emergency Security Protocol that would allow any EU member state to summon all 27 governments after security threats including cyberattacks, sabotage, arson, and drone incursions. Speaking in Strasbourg, she said such threats were increasing and cited recent incidents in Denmark, Lithuania, Poland, and an attempted drone attack in Leipzig. The mechanism would be modeled on NATO’s Article 4, which enables consultations when a member’s security is threatened.\u003c/p\u003e\n\n\u003cp\u003eThe proposal is intended to coordinate a European response, deter escalation, and limit the consequences of an incident, particularly for hostile acts below the threshold of armed aggression. However, it does not explain what action would follow a meeting or whether it would alter EU rules requiring unanimous approval for many foreign-policy decisions and sanctions. Von der Leyen also announced plans for a European Security Council and an instrument supporting capabilities including air and missile defence, transport, refuelling, space systems, and cyber capabilities, with further details expected in a forthcoming European security strategy.\u003c/p\u003e\n"},{"n":3,"title":"Microsoft says Copilot buttons still missing in classic Outlook","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-shares-workaround-for-missing-outlook-copilot-buttons/","time":"12:16","priority":"MAY READ","score":52,"tldr":"Microsoft is still investigating a Classic Outlook for Windows bug that can make Copilot and Copilot Chat buttons disappear after build 20026.20182. A temporary workaround is to enable “Show Apps in Outlook,” while creating a new Outlook profile or using Outlook on the web also avoids the issue.","briefOverview":"\u003cp\u003eMicrosoft is still investigating an issue that causes Copilot and Copilot Chat buttons to disappear in Classic Outlook for Windows. The problem affects some users with Copilot Chat (Basic) licenses or paid Microsoft 365 Copilot accounts after updating Outlook to build 20026.20182 or later. Users may lose the Copilot button above the ribbon, the icon in the left app bar or More Apps area, and the ability to open Copilot through Add Apps or ribbon customization.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says its analysis indicates that Outlook cannot locate the \u003ccode\u003ePR_PROFILE_USER_SMTP_EMAIL_ADDRESS_W\u003c/code\u003e MAPI property in the null profile section in affected environments. This can stop the Outlook Copilot component from saving Copilot-related settings and prevent its navigation-pane entry point from appearing. Until a permanent fix is available, Microsoft recommends enabling “Show Apps in Outlook” under File \u0026gt; Options \u0026gt; Advanced \u0026gt; Outlook panes; users can also create a new Outlook profile or use New Outlook or Outlook on the web, which are not affected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is still investigating an issue that causes Copilot and Copilot Chat buttons to disappear in Classic Outlook for Windows for some users with Copilot Chat (Basic) or paid Microsoft 365 Copilot accounts.","Microsoft says the issue occurs after Classic Outlook for Windows is upgraded to build 20026.20182 or later and may prevent Copilot from appearing in the navigation pane.","Affected users may find that Copilot is missing above the ribbon or from the app bar, cannot be opened from Add Apps, or appears unavailable when added through ribbon customization.","Microsoft’s temporary workaround is to enable the “Show Apps in Outlook” setting under File, Options, Advanced, and Outlook panes; users can also create a new Outlook profile or use new Outlook or Outlook on the web.","Microsoft also confirmed that some systems running Kaspersky Antivirus can experience unexpected Outlook crashes associated with the Kaspersky Mail Checker component."],"insights":["The missing Copilot entry points are not necessarily caused by an unavailable Copilot service: Microsoft says Copilot can still be accessed through Outlook on the web and the standalone Microsoft 365 Copilot experience.","Microsoft’s current analysis ties the problem to Outlook being unable to find a specific email-address setting in a profile’s null section, which prevents the Copilot component from saving its related settings.","Enabling “Show Apps in Outlook” is a temporary workaround that may restore access without waiting for a permanent software fix, while creating a new Outlook profile is another available option.","The article identifies a separate Outlook reliability issue on systems with Kaspersky Antivirus, where crashes are associated with Kaspersky Mail Checker’s mcou.dll component and Event 1000 application-log entries."],"referencedReports":[{"title":"Copilot buttons gone in classic Outlook for Windows","url":"https://support.microsoft.com/en-us/support/known-issues/copilot-buttons-gone-classic-outlook-windows","publisher":"microsoft","context":"Microsoft's known-issues advisory provides the vendor's analysis of why Copilot entry points disappear in Classic Outlook and lists temporary workarounds.","category":"advisory","primary":true},{"title":"Outlook crashes unexpectedly when using Kaspersky Antivirus","url":"https://support.microsoft.com/en-US/Support/known-issues/outlook-crashes-unexpectedly-when-use-kaspersky-antivirus","publisher":"microsoft","context":"The article references this Microsoft known-issues advisory for a separate Outlook crash problem associated with Kaspersky Mail Checker.","category":"advisory","primary":false}],"body":"\u003cp\u003eMicrosoft is still investigating an issue that causes Copilot and Copilot Chat buttons to disappear in Classic Outlook for Windows. The problem affects some users with Copilot Chat (Basic) licenses or paid Microsoft 365 Copilot accounts after updating Outlook to build 20026.20182 or later. Users may lose the Copilot button above the ribbon, the icon in the left app bar or More Apps area, and the ability to open Copilot through Add Apps or ribbon customization.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft says its analysis indicates that Outlook cannot locate the \u003ccode\u003ePR_PROFILE_USER_SMTP_EMAIL_ADDRESS_W\u003c/code\u003e MAPI property in the null profile section in affected environments. This can stop the Outlook Copilot component from saving Copilot-related settings and prevent its navigation-pane entry point from appearing. Until a permanent fix is available, Microsoft recommends enabling “Show Apps in Outlook” under File \u0026gt; Options \u0026gt; Advanced \u0026gt; Outlook panes; users can also create a new Outlook profile or use New Outlook or Outlook on the web, which are not affected.\u003c/p\u003e\n"},{"n":15,"title":"Securing the unpatchable in an age of AI-driven vulnerabilities","source":"blog.talosintelligence.com","sourceColorIdx":6,"link":"https://blog.talosintelligence.com/securing-the-unpatchable-in-an-age-of-ai-driven-vulnerabilities/","time":"10:00","priority":"MAY READ","score":45,"tldr":"AI is accelerating discovery of vulnerabilities in legacy, unpatchable OT systems, making passive acceptance of risk untenable. Organizations should compensate with asset visibility, strict micro-segmentation, and upstream NGFW/IPS controls to restrict and inspect the limited traffic these systems require.","briefOverview":"\u003cp\u003eAI-assisted code analysis is finding longstanding software flaws faster, increasing the patching burden for organizations. This creates particular risk for operational technology systems that cannot be patched because they rely on certified software or unsupported platforms. Medical equipment, building management systems, and industrial systems in chemical plants may fall into this category, and even systems on bespoke platforms can contain common libraries and protocols with newly discovered flaws.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that when patching is not possible, defenders should use the predictable network behavior of these systems as a compensating safeguard. They should first identify legacy devices, isolate them with private network segments so only authorized systems can communicate with them, and use next-generation firewalls with intrusion-prevention capabilities to inspect and block known exploit attempts. Air gaps and one-way data-transfer hardware can help, but they may be undermined when temporary connections, VPNs, wireless links, or other shortcuts become semi-permanent.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["AI-assisted code analysis is identifying longstanding software flaws, increasing pressure on organizations to apply patches more frequently.","Operational technology systems, including medical equipment, building management systems, and industrial systems in chemical plants, may be unable to receive patches because they use certified or unsupported software.","When patching is not possible, organizations can identify vulnerable legacy systems, isolate them so only authorized devices can connect, and inspect traffic for known exploit attempts.","The 2017 WannaCry outbreak significantly affected the U.K.'s NHS, with a significant minority of systems running end-of-life Windows XP contributing to the problem.","Air gaps and one-way data-transfer hardware can be undermined when staff or contractors introduce temporary connections or other operational shortcuts."],"insights":["The limited and predictable communications of many OT systems can be used as a defensive advantage: access can be restricted to the small number of devices that legitimately need to connect.","A system does not need to be publicly exposed to be at risk, because an attacker who reaches an internal network may still locate and target vulnerable legacy equipment.","Even supposedly bespoke OT platforms commonly rely on shared libraries and protocols where vulnerabilities may be discovered.","Air gaps and one-way data-transfer devices are not permanent guarantees of isolation when temporary VPN, wireless, or data-transfer connections become operational shortcuts.","Combining network isolation with traffic inspection provides two compensating safeguards for systems that cannot be patched: limiting who can reach them and blocking known malicious content."],"referencedReports":[{"title":"Lessons Learned Review of the WannaCry Ransomware Cyber Attack","url":"https://www.england.nhs.uk/wp-content/uploads/2018/02/lessons-learned-review-wannacry-ransomware-cyber-attack-cio-review.pdf","publisher":"nhs-england","context":"The article cites this review when describing the significant effect of the 2017 WannaCry worm on the U.K. NHS and the contribution of end-of-life Windows XP systems.","category":"research","primary":false},{"title":"People’s Republic of China-Linked Cyber Actors Hide in Router Firmware","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-339a","publisher":"cisa","context":"The article cites this CISA advisory as an example of end-of-life software exploitation being used to gain access to governmental systems in 2023.","category":"advisory","primary":false}],"body":"\u003cp\u003eAI-assisted code analysis is finding longstanding software flaws faster, increasing the patching burden for organizations. This creates particular risk for operational technology systems that cannot be patched because they rely on certified software or unsupported platforms. Medical equipment, building management systems, and industrial systems in chemical plants may fall into this category, and even systems on bespoke platforms can contain common libraries and protocols with newly discovered flaws.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that when patching is not possible, defenders should use the predictable network behavior of these systems as a compensating safeguard. They should first identify legacy devices, isolate them with private network segments so only authorized systems can communicate with them, and use next-generation firewalls with intrusion-prevention capabilities to inspect and block known exploit attempts. Air gaps and one-way data-transfer hardware can help, but they may be undermined when temporary connections, VPNs, wireless links, or other shortcuts become semi-permanent.\u003c/p\u003e\n"},{"n":9,"title":"Threat Intelligence Alone Won't Close the Exploitation Gap","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/threat-intelligence-alone-wont-close.html","time":"11:15","priority":"MAY READ","score":30,"tldr":"The article argues that threat intelligence is most valuable when organizations can rapidly validate whether leaked credentials and disclosed vulnerabilities are exploitable in their own environments. It promotes Pentera and Recorded Future’s threat-led penetration testing integration as a way to automate that validation.","briefOverview":"\u003cp\u003eThe article argues that security teams often receive alerts about leaked credentials or disclosed software flaws but lack the time and specialized testing skills to quickly determine whether those findings can be used against their own environments. It says attackers are combining such intelligence with AI-assisted exploitation, accelerating the path from exposure to breach. The author identifies this validation backlog, rather than a shortage of threat data, as the main source of accumulating risk.\u003c/p\u003e\n\n\u003cp\u003eThe article presents threat-led penetration testing as an approach that starts with current intelligence and tests a specific credential or flaw directly instead of working through a static, calendar-based backlog. Pentera’s collaboration with Recorded Future is described as connecting leaked-credential intelligence to automated testing of an organization’s external attack surface, to determine which credentials can actually be used. Wyndham Hotels \u0026amp; Resorts participated in early testing, and its cybersecurity vice president said the ability to test threats in the company’s own environment at speed improves resilience.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article argues that threat intelligence alerts about leaked credentials and disclosed vulnerabilities often wait in security-team queues before anyone can test whether they are usable in a specific environment.","It states that attackers are combining threat intelligence with AI-assisted exploitation to move from exposure to breach faster than many security programs can respond.","Threat-led penetration testing starts with current intelligence, such as a particular leaked credential or disclosed vulnerability, and directly tests whether it is exploitable.","Pentera's collaboration with Recorded Future connects leaked-credential intelligence to automated testing of an organization's external attack surface.","Wyndham Hotels \u0026 Resorts participated in early testing of the approach, according to Pentera."],"insights":["The article identifies the main operational bottleneck as the time and specialized offensive-testing skill needed to verify alerts, rather than a lack of threat-intelligence data.","It presents validation of a specific leaked credential as a way to distinguish actionable exposure from alerts that may no longer matter, allowing teams to prioritize based on evidence.","The proposed testing model shifts security work from a fixed, calendar-based backlog toward testing the threats currently appearing in intelligence feeds.","Pentera’s described integration is intended to act on threat signals from Recorded Future, Pentera itself, or other intelligence sources rather than requiring a single source of alerts."],"referencedReports":[],"body":"\u003cp\u003eThe article argues that security teams often receive alerts about leaked credentials or disclosed software flaws but lack the time and specialized testing skills to quickly determine whether those findings can be used against their own environments. It says attackers are combining such intelligence with AI-assisted exploitation, accelerating the path from exposure to breach. The author identifies this validation backlog, rather than a shortage of threat data, as the main source of accumulating risk.\u003c/p\u003e\n\n\u003cp\u003eThe article presents threat-led penetration testing as an approach that starts with current intelligence and tests a specific credential or flaw directly instead of working through a static, calendar-based backlog. Pentera’s collaboration with Recorded Future is described as connecting leaked-credential intelligence to automated testing of an organization’s external attack surface, to determine which credentials can actually be used. Wyndham Hotels \u0026amp; Resorts participated in early testing, and its cybersecurity vice president said the ability to test threats in the company’s own environment at speed improves resilience.\u003c/p\u003e\n"},{"n":2,"title":"Webinar: What happens in the first hours of a Google Workspace breach","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/webinar-what-happens-in-the-first-hours-of-a-google-workspace-breach/","time":"12:11","priority":"MAY READ","score":25,"tldr":"BleepingComputer and Material Security will host a September 23, 2026 webinar examining real Google Workspace breaches, with a focus on the critical first-hours response decisions that can contain or worsen an incident.","briefOverview":"\u003cp\u003eBleepingComputer will host a live webinar with Material Security on September 23, 2026, titled “Breach autopsy: How fast-growing companies are breached through Google Workspace.” Material Security Vice President of Security Rajan Kapoor and Fireside Consulting LLC President Rick Fitzgerald will examine real, publicly documented Google Workspace breaches. The session focuses on the decisions organizations made during the critical first hours after discovering suspicious access.\u003c/p\u003e\n\n\u003cp\u003eThe webinar will cover attacks in which threat actors combined social engineering with malicious OAuth applications to access Google Workspace environments. It will explore how responders determine which users and data may have been exposed, whether an attacker still has access, and how to contain an incident without overlooking other entry points. The speakers will also discuss overlooked weaknesses, high-value security controls, and the challenges faced by fast-growing companies with limited security resources.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["BleepingComputer will host a live webinar with Material Security on September 23, 2026, titled \"Breach autopsy: How fast-growing companies are breached through Google Workspace.\"","The webinar will feature Material Security Vice President of Security Rajan Kapoor and Fireside Consulting LLC President Rick Fitzgerald.","The speakers will examine publicly documented Google Workspace breaches and the decisions organizations made during the first hours of the incidents.","Two attacks covered in the webinar involved threat actors combining social engineering with malicious OAuth applications to access Google Workspace environments.","The webinar will discuss response decisions, overlooked weaknesses, and security controls that can help fast-growing companies with limited security resources."],"insights":["Understanding how an intruder first gained access is only part of responding to a Google Workspace compromise; teams must also determine what users and data were exposed and whether any access remains.","Early containment actions can either reduce the incident’s impact or potentially make it worse, particularly when responders have incomplete information.","Connected applications can remain an overlooked exposure point, as the webinar’s examples include attackers using malicious OAuth applications alongside social engineering.","Fast-growing organizations with lean security teams face the added challenge of investigating an incident while trying to prevent it from spreading."],"referencedReports":[],"body":"\u003cp\u003eBleepingComputer will host a live webinar with Material Security on September 23, 2026, titled “Breach autopsy: How fast-growing companies are breached through Google Workspace.” Material Security Vice President of Security Rajan Kapoor and Fireside Consulting LLC President Rick Fitzgerald will examine real, publicly documented Google Workspace breaches. The session focuses on the decisions organizations made during the critical first hours after discovering suspicious access.\u003c/p\u003e\n\n\u003cp\u003eThe webinar will cover attacks in which threat actors combined social engineering with malicious OAuth applications to access Google Workspace environments. It will explore how responders determine which users and data may have been exposed, whether an attacker still has access, and how to contain an incident without overlooking other entry points. The speakers will also discuss overlooked weaknesses, high-value security controls, and the challenges faced by fast-growing companies with limited security resources.\u003c/p\u003e\n"}]</script>
