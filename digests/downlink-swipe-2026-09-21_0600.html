<script type="application/json" id="dl-articles">[{"n":1,"title":"Jade Sleet Linked to Indian IT Provider Breach With FLATROOF and ROOFDECK Backdoors","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/jade-sleet-linked-to-indian-it-provider.html","time":"06:06","priority":"SHOULD READ","score":84,"tldr":"North Korean-linked Jade Sleet compromised an Indian IT services provider’s DevOps engineer using macOS backdoors FLATROOF and ROOFDECK, likely as part of its developer-focused supply-chain operations. The campaign uses fake job-interview repositories with malicious Terraform lockfiles to infect Apple Silicon Macs and steal data, maintain persistence, and enable remote control.","briefOverview":"\u003cp\u003eSentinelOne attributed the compromise of an India-based IT services provider to the North Korean threat actor Jade Sleet, also known as PUKCHONG, Slow Pisces, TraderTraitor, and UNC4899. The group is known for targeting cryptocurrency and blockchain organizations, as well as vendors connected to them. In this case, the affected device was an Apple Silicon MacBook belonging to a DevOps engineer. FLATROOF and ROOFDECK backdoors were detected on the system as early as March 18, 2026.\u003c/p\u003e\n\n\u003cp\u003eJade Sleet uses job-interview lures that present victims with coding repositories themed around infrastructure engineering projects. These repositories contain a weaponized Terraform dependency lock file that points Terraform to attacker-controlled modules when a developer runs \u003ccode\u003eterraform init\u003c/code\u003e. FLATROOF can execute commands, transfer files, and steal browser data, command histories, system details, and the Mac login keychain database, while ROOFDECK supports reconnaissance, file operations, remote shell access, lateral movement, and persistence. SentinelOne said the implants became active after Cursor opened a specific development workspace, and an updated ROOFDECK version later removed existing malware binaries and stripped debugging information to evade detection.\u003c/p\u003e\n\n\u003cp\u003eThe incident highlights the risk posed by compromised developer endpoints, which can hold access to cloud environments, software pipelines, and source code. SentinelOne said Jade Sleet’s campaigns target third parties and software supply chains one engineer at a time, using backdoored Terraform builds tailored to individual victims. ROOFDECK was also observed as a follow-up tool after initial access had been established, using the decentralized Nostr protocol for command-and-control communications. The article notes that the exact delivery method used against the Indian IT services provider is not yet known.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SentinelOne attributed the compromise of an India-based IT services provider to the North Korean threat actor Jade Sleet, also known as PUKCHONG, Slow Pisces, TraderTraitor, and UNC4899.","The campaign uses fake job-interview coding repositories containing a malicious Terraform dependency lock file that directs developers running terraform init to attacker-controlled modules.","The attackers deployed the Rust-based macOS backdoors FLATROOF and ROOFDECK, which can steal information, execute commands, manipulate files, and establish persistent access.","The compromised system was an Apple Silicon MacBook used by a DevOps engineer, where the backdoors were detected from March 18, 2026, and became active on March 29.","SentinelOne said developer endpoints can expose cloud environments, software pipelines, and source code, making them a high-priority target in third-party and software supply-chain compromises."],"insights":["The implants remained dormant on the DevOps engineer’s MacBook until activity began when Cursor opened a specific cloudshield development workspace, showing that the malicious tools were tied to a developer’s working environment.","The malicious Terraform project files were tailored for individual victims and directed Terraform to download attacker-controlled modules through lookalike registry domains.","ROOFDECK uses the decentralized Nostr protocol for communications and verifies operator-signed commands with an embedded public key before running them.","An updated ROOFDECK version deployed after the KelpDAO incident removed earlier malware binaries and stripped debugging information, making analysis and detection more difficult."],"referencedReports":[{"title":"Don’t Call Us, We’ll Call Your APIs: TraderTraitor Backdoors Resurface on Victim With No Crypto Ties","url":"https://www.sentinelone.com/labs/dont-call-us-well-call-your-apis-tradertraitor-backdoors-resurface-on-victim-with-no-crypto-ties/","publisher":"sentinelone","context":"The article relies on SentinelOne’s disclosure for the attribution of the Indian IT services provider compromise and analysis of FLATROOF and ROOFDECK.","category":"research","primary":true},{"title":"KelpDAO Incident Report","url":"https://layerzero.network/publications/kelpdao-incident-report.pdf","publisher":"layerzero","context":"The article references this incident report for details on the Rust-based FLATROOF and ROOFDECK malware families used in the KelpDAO-related attack.","category":"research","primary":false},{"title":"In-Depth Technical Analysis of the Bybit Hack","url":"https://www.nccgroup.com/research/in-depth-technical-analysis-of-the-bybit-hack/","publisher":"ncc-group","context":"The article cites NCC Group’s technical analysis in connection with Jade Sleet’s alleged role in the 2025 Bybit theft following a Safe{Wallet} developer-environment compromise.","category":"research","primary":false}],"body":"\u003cp\u003eSentinelOne attributed the compromise of an India-based IT services provider to the North Korean threat actor Jade Sleet, also known as PUKCHONG, Slow Pisces, TraderTraitor, and UNC4899. The group is known for targeting cryptocurrency and blockchain organizations, as well as vendors connected to them. In this case, the affected device was an Apple Silicon MacBook belonging to a DevOps engineer. FLATROOF and ROOFDECK backdoors were detected on the system as early as March 18, 2026.\u003c/p\u003e\n\n\u003cp\u003eJade Sleet uses job-interview lures that present victims with coding repositories themed around infrastructure engineering projects. These repositories contain a weaponized Terraform dependency lock file that points Terraform to attacker-controlled modules when a developer runs \u003ccode\u003eterraform init\u003c/code\u003e. FLATROOF can execute commands, transfer files, and steal browser data, command histories, system details, and the Mac login keychain database, while ROOFDECK supports reconnaissance, file operations, remote shell access, lateral movement, and persistence. SentinelOne said the implants became active after Cursor opened a specific development workspace, and an updated ROOFDECK version later removed existing malware binaries and stripped debugging information to evade detection.\u003c/p\u003e\n\n\u003cp\u003eThe incident highlights the risk posed by compromised developer endpoints, which can hold access to cloud environments, software pipelines, and source code. SentinelOne said Jade Sleet’s campaigns target third parties and software supply chains one engineer at a time, using backdoored Terraform builds tailored to individual victims. ROOFDECK was also observed as a follow-up tool after initial access had been established, using the decentralized Nostr protocol for command-and-control communications. The article notes that the exact delivery method used against the Indian IT services provider is not yet known.\u003c/p\u003e\n"},{"n":2,"title":"ClickFix Lures Deploy ChainScript RAT Using Polygon to Rotate C2 Infrastructure","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/clickfix-lures-deploy-chainscript-rat.html","time":"08:39","priority":"SHOULD READ","score":82,"tldr":"Threat actors are using ClickFix lures and fake software installers to deploy the ChainScript Node.js RAT, which uses a Polygon smart contract to rotate its WebSocket command-and-control infrastructure and resist takedowns. Related ClickFix campaigns also abuse trusted accounts, search results, and fake AI-tool downloads to deliver information stealers on Windows and macOS.","briefOverview":"\u003cp\u003eThreat actors are using ClickFix-style lures to distribute ChainScript, a previously undocumented remote-access trojan that has appeared under names including ComponentTask33, UpdateDigital, HostShared, and OrchidViolet66. A malicious Windows installer disguised as Spotify deploys the Node.js runtime and launches the ChainScript agent through hidden PowerShell and VBScript stages. The malware provides operators with command-line access, file operations, screenshots, payload deployment, cryptocurrency-wallet enumeration, and remote JavaScript execution.\u003c/p\u003e\n\n\u003cp\u003eChainScript uses a Polygon smart contract to locate its active WebSocket control infrastructure, enabling operators to redirect infected devices to new servers without changing the implant. It establishes user-level persistence with a scheduled task and a Registry Run key fallback, while its components are stored in Microsoft-looking folders under \u003ccode\u003e%LOCALAPPDATA%\u003c/code\u003e. The article also describes separate ClickFix campaigns that used HBO Max\u0026rsquo;s compromised Reddit account and fake Codex download pages to distribute information stealers to Windows and macOS users, showing how trusted accounts, search results, and fake installation instructions can be used to persuade users to infect themselves.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ClickFix-style lures deliver the previously undocumented ChainScript remote-access trojan through a malicious Windows installer disguised as Spotify.","ChainScript deploys a Node.js runtime and JavaScript agent, establishes persistence through a scheduled task with a Registry Run key fallback, and connects to its command server over WebSockets.","The malware uses a Polygon smart contract to discover active command-and-control infrastructure, allowing operators to redirect infected systems while retaining the same implant.","ChainScript supports command-line and PowerShell access, file operations, screenshot capture, payload deployment, cryptocurrency-wallet enumeration, and remote JavaScript execution.","Separate ClickFix campaigns used HBO Max’s compromised Reddit account and fake Codex download pages to distribute information-stealing malware to Windows and macOS users."],"insights":["ChainScript separates its instructions for finding the operator’s server from the malware itself by using a Polygon smart contract, allowing the operator to change servers without replacing the malware on infected computers.","The ChainScript installer uses several hidden stages—Windows Installer, PowerShell, and VBScript—to place its components in Microsoft-looking folders under the user’s local application-data directory.","The PasteSwitch operation used HBO Max’s verified Reddit account to publish 108 malicious advertisements over 48 hours, leveraging a trusted corporate identity to reduce user skepticism.","The macOS ClickFix activity evolved to use browser fingerprinting on the server side, showing the lure mainly to visitors whose environment appears to be a genuine macOS browser and reducing exposure to crawlers and automated analysis."],"referencedReports":[{"title":"ChainScript: Tracing a Node.js RAT Across the Blockchain","url":"https://blackpointcyber.com/blog/chainscript-tracing-a-nodejs-rat-across-the-blockchain/","publisher":"blackpoint-cyber","context":"Blackpoint Adversary Pursuit Group researchers documented the ChainScript RAT, its capabilities, and its Polygon-based command-and-control discovery method.","category":"research","primary":true},{"title":"macOS ClickFix Campaign Learned to Hide","url":"https://www.microsoft.com/en-us/security/blog/2026/08/05/macos-clickfix-campaign-learned-hide/","publisher":"microsoft","context":"Microsoft reported on a macOS ClickFix campaign distributing MacSync and Atomic Stealer through a large set of look-alike domains and browser-fingerprinting gates.","category":"research","primary":false}],"body":"\u003cp\u003eThreat actors are using ClickFix-style lures to distribute ChainScript, a previously undocumented remote-access trojan that has appeared under names including ComponentTask33, UpdateDigital, HostShared, and OrchidViolet66. A malicious Windows installer disguised as Spotify deploys the Node.js runtime and launches the ChainScript agent through hidden PowerShell and VBScript stages. The malware provides operators with command-line access, file operations, screenshots, payload deployment, cryptocurrency-wallet enumeration, and remote JavaScript execution.\u003c/p\u003e\n\n\u003cp\u003eChainScript uses a Polygon smart contract to locate its active WebSocket control infrastructure, enabling operators to redirect infected devices to new servers without changing the implant. It establishes user-level persistence with a scheduled task and a Registry Run key fallback, while its components are stored in Microsoft-looking folders under \u003ccode\u003e%LOCALAPPDATA%\u003c/code\u003e. The article also describes separate ClickFix campaigns that used HBO Max\u0026rsquo;s compromised Reddit account and fake Codex download pages to distribute information stealers to Windows and macOS users, showing how trusted accounts, search results, and fake installation instructions can be used to persuade users to infect themselves.\u003c/p\u003e\n"},{"n":3,"title":"Government AI Use Cases Have Passed 3,600. Security Must Catch Up","source":"netskope.com","sourceColorIdx":2,"link":"https://www.netskope.com/blog/government-ai-use-cases-have-passed-3600-security-must-catch-up","time":"07:01","priority":"MAY READ","score":48,"tldr":"Federal agencies are rapidly deploying thousands of AI use cases, but legacy security tools lack the visibility and controls needed to manage AI-driven risks. Agencies should continuously discover AI use, classify risk, monitor autonomous agents, and enforce inline safeguards and red-team testing.","briefOverview":"\u003cp\u003eThe Office of Management and Budget\u0026rsquo;s 2025 inventory documented 3,611 AI use cases across 56 submitting federal agencies, and several civilian agencies have since reported more than 300 use cases each. The article says this rapid adoption could repeat problems seen during the federal government\u0026rsquo;s Cloud First push if security architecture does not keep pace. Agencies must accelerate deployment while meeting security, transparency, and risk-management requirements under the NIST AI Risk Management Framework, OMB M-25-21, and CISA guidance.\u003c/p\u003e\n\n\u003cp\u003eTraditional enterprise security tools often cannot see AI use, inspect prompts or model interactions, or enforce policy across AI-driven workflows. The article recommends continuous discovery of AI tools and shadow AI, classifying use cases by risk and data sensitivity, tracking AI agents and their connected assets, and applying controls during AI interactions rather than only reviewing logs afterward. It also recommends early and continuous red-team testing for self-hosted AI, noting that NIST red-team exercises in 2025 found novel attacks against AI agents succeeded 81% of the time.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["OMB's 2025 Federal Agency Artificial Intelligence Use Case Inventory documented 3,611 AI use cases across 56 submitting federal agencies.","The article says traditional enterprise security tools often lack visibility into AI usage, prompts, model interactions, and AI-driven workflows.","Federal agencies are expected to meet security, transparency, and risk-management requirements under the NIST AI Risk Management Framework, OMB M-25-21, and CISA guidance while deploying AI rapidly.","The article recommends continuous discovery of AI tools and usage, risk classification based on data sensitivity and mission impact, visibility into AI agents, and inline safeguards.","NIST red-team exercises in 2025 found that novel attacks against AI agents succeeded 81% of the time, according to the article."],"insights":["AI oversight must be continuous rather than based on periodic inventories, because unmanaged or \"shadow\" AI can appear between review cycles.","The article identifies subscription-based AI services as a major concern because employees may obtain them without going through larger procurement processes.","As AI systems evolve from chatbots into agents that can act across systems, agencies need to track not only human use but also which assets each agent can access.","The article argues that controls applied during AI interactions are more effective than reviewing logs afterward, especially when sensitive data could be involved.","For self-hosted AI, ongoing adversarial testing before and after deployment can help detect new attack paths or declining model resilience."],"referencedReports":[{"title":"2025 Federal Agency Artificial Intelligence Use Case Inventory","url":"https://github.com/ombegov/2025-Federal-Agency-AI-Use-Case-Inventory","publisher":"office-of-management-and-budget","context":"The article cites this inventory as documenting 3,611 AI use cases across 56 submitting federal agencies.","category":"research","primary":false},{"title":"AI Risk Management Framework","url":"https://www.nist.gov/itl/ai-risk-management-framework","publisher":"national-institute-of-standards-and-technology","context":"The article identifies this framework as part of the security, transparency, and risk-management requirements agencies must meet while deploying AI.","category":"guide","primary":false},{"title":"Technical Blog: Strengthening AI Agent Hijacking Evaluations","url":"https://www.nist.gov/news-events/news/2025/01/technical-blog-strengthening-ai-agent-hijacking-evaluations","publisher":"national-institute-of-standards-and-technology","context":"The article references NIST red-team exercises described in this technical blog, stating that novel attacks against AI agents succeeded 81% of the time.","category":"research","primary":false}],"body":"\u003cp\u003eThe Office of Management and Budget\u0026rsquo;s 2025 inventory documented 3,611 AI use cases across 56 submitting federal agencies, and several civilian agencies have since reported more than 300 use cases each. The article says this rapid adoption could repeat problems seen during the federal government\u0026rsquo;s Cloud First push if security architecture does not keep pace. Agencies must accelerate deployment while meeting security, transparency, and risk-management requirements under the NIST AI Risk Management Framework, OMB M-25-21, and CISA guidance.\u003c/p\u003e\n\n\u003cp\u003eTraditional enterprise security tools often cannot see AI use, inspect prompts or model interactions, or enforce policy across AI-driven workflows. The article recommends continuous discovery of AI tools and shadow AI, classifying use cases by risk and data sensitivity, tracking AI agents and their connected assets, and applying controls during AI interactions rather than only reviewing logs afterward. It also recommends early and continuous red-team testing for self-hosted AI, noting that NIST red-team exercises in 2025 found novel attacks against AI agents succeeded 81% of the time.\u003c/p\u003e\n"}]</script>
