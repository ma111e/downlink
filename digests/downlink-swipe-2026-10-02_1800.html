<script type="application/json" id="dl-articles">[{"n":2,"title":"Warlock ransomware breach SharePoint in water, telecom operator attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/warlock-ransomware-breach-sharepoint-in-water-telecom-operator-attacks/","time":"18:33","priority":"SHOULD READ","score":89,"tldr":"China-linked Warlock ransomware operators are exploiting Microsoft SharePoint ToolShell vulnerabilities to breach critical organizations, then disabling AV/EDR protections and rapidly encrypting systems. Recent targets include water, telecom, government, and university entities in Portuguese- and Spanish-speaking regions.","briefOverview":"\u003cp\u003eChina-linked Warlock ransomware operators targeted a water utility, telecom provider, regional government body, and university by exploiting vulnerabilities in on-premises Microsoft SharePoint deployments. Symantec identifies the actor as Longlegs and attributes development of the Warlock ransomware to the group. Over the past two months, the activity appears to have focused on Portuguese- and Spanish-speaking countries in Europe, Africa, and Latin America.\u003c/p\u003e\n\n\u003cp\u003eIn one intrusion that began on July 22, the attackers disabled protection software on at least 40 hosts in roughly two hours and deployed Warlock ransomware to at least 33 hosts. They used a signed K7RKScan driver vulnerable to CVE-2025-1055 to disable AV/EDR protections, staged the ransomware in the domain SYSVOL share, and installed Visual Studio Code Insiders as a service for remote connections through its tunneling feature. The ransomware appeared almost immediately after protections were disabled, and researchers warn that ToolShell and other SharePoint flaws remain viable ways for attackers to gain initial access.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The China-linked Warlock ransomware group targeted a water utility, telecom provider, regional government body, and university by exploiting vulnerabilities in on-premises Microsoft SharePoint deployments.","Symantec identifies the actor as Longlegs and attributes development of the Warlock ransomware to the group.","In an intrusion beginning July 22, the attackers deployed a tool that disabled protection software on at least 40 hosts in about two hours and then launched Warlock ransomware on at least 33 hosts.","The attackers used a signed K7RKScan driver vulnerable to CVE-2025-1055 to disable AV/EDR tools through the bring-your-own-vulnerable-driver technique.","The ransomware payload was staged in the domain SYSVOL share, and Visual Studio Code Insiders was installed as a service to enable remote connections through its built-in tunneling capability."],"insights":["The attackers used the SYSVOL share, which is replicated across domain controllers, to position ransomware for broad network-wide execution rather than deploying it to systems individually.","Warlock ransomware appeared almost immediately after security protections were disabled on each host, highlighting that the window between defense evasion and file encryption was very short in the observed incident.","The group installed Visual Studio Code Insiders as a service to use its built-in tunneling feature for remote access to compromised machines.","In the July 22 intrusion, the attackers conducted reconnaissance and deleted apparent staging artifacts two days after initial access, before the final ransomware deployment on July 31.","Although Warlock emerged exploiting SharePoint flaws more than a year earlier, Symantec and Carbon Black warn that ToolShell and other SharePoint vulnerabilities remain usable routes for initial access."],"referencedReports":[{"title":"Warlock ransomware critical infrastructure","url":"https://www.security.com/threat-intelligence/warlock-ransomware-critical-infrastructure","publisher":"Symantec and Carbon Black","context":"The article relies on this threat-research report for details of Warlock/Longlegs intrusions, including SYSVOL staging, EDR disabling, VS Code tunneling, and indicators of compromise.","category":"research","primary":true}],"body":"\u003cp\u003eChina-linked Warlock ransomware operators targeted a water utility, telecom provider, regional government body, and university by exploiting vulnerabilities in on-premises Microsoft SharePoint deployments. Symantec identifies the actor as Longlegs and attributes development of the Warlock ransomware to the group. Over the past two months, the activity appears to have focused on Portuguese- and Spanish-speaking countries in Europe, Africa, and Latin America.\u003c/p\u003e\n\n\u003cp\u003eIn one intrusion that began on July 22, the attackers disabled protection software on at least 40 hosts in roughly two hours and deployed Warlock ransomware to at least 33 hosts. They used a signed K7RKScan driver vulnerable to CVE-2025-1055 to disable AV/EDR protections, staged the ransomware in the domain SYSVOL share, and installed Visual Studio Code Insiders as a service for remote connections through its tunneling feature. The ransomware appeared almost immediately after protections were disabled, and researchers warn that ToolShell and other SharePoint flaws remain viable ways for attackers to gain initial access.\u003c/p\u003e\n"},{"n":1,"title":"Frontline Education breach exposes school district employee data","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/frontline-education-data-breach-impacts-school-district-employees/","time":"19:01","priority":"SHOULD READ","score":78,"tldr":"Frontline Education says attackers exploited an undisclosed third-party software vulnerability to access its systems and expose school district employee data, including Social Security numbers, email addresses, and physical addresses. The total number of affected districts and individuals remains unknown, while affected adults are being offered two years of credit and identity monitoring.","briefOverview":"\u003cp\u003eFrontline Education is notifying school districts after attackers used a vulnerability in an unnamed third-party software product to gain unauthorized access to part of its environment. The company said its security team identified the issue on August 14, 2026, investigated with an independent cybersecurity firm, remediated the vulnerability, contacted law enforcement, and reinforced its systems. Frontline has not disclosed which third-party application was involved or when the unauthorized access began.\u003c/p\u003e\n\n\u003cp\u003eNotifications reviewed by BleepingComputer indicate that affected district employees may have had Social Security numbers, email addresses, and physical addresses exposed; one district notification listed 1,210 affected employees. School IT administrators reported that they independently confirmed the notifications were legitimate. Frontline will notify affected people unless districts opt out by October 16, and it is offering adults two years of TransUnion credit monitoring and identity theft protection, while minors will receive cyber monitoring services. The number of affected districts and individuals remains unknown.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Frontline Education said it identified on August 14, 2026, that a vulnerability in an unnamed third-party software product had allowed unauthorized access to part of its environment.","The company said the unauthorized access resulted in the theft of employee information, and notices cited by BleepingComputer listed Social Security numbers, email addresses, and physical addresses among the exposed data.","School IT administrators reported receiving and independently confirming the legitimacy of Frontline breach notifications, including one notice affecting 1,210 employees at a district.","Frontline said it will notify affected individuals unless a district opts out by October 16, and it is offering adults two years of TransUnion credit monitoring and identity theft protection while minors will receive cyber monitoring services.","The number of affected school districts and individuals has not been disclosed."],"insights":["The breach’s entry point remains opaque because Frontline did not identify the third-party software product involved or say when the unauthorized access began.","Frontline is centralizing the response for school districts by offering to send individual and state attorney general notifications and cover associated notification and protection-service costs.","The response distinguishes between adults and minors, offering credit and identity protection to adults but cyber monitoring to minors.","Districts face a time-sensitive decision: opting out of Frontline’s notification process by October 16 means Frontline will not provide notification services or reimburse the district’s own notification costs."],"referencedReports":[],"body":"\u003cp\u003eFrontline Education is notifying school districts after attackers used a vulnerability in an unnamed third-party software product to gain unauthorized access to part of its environment. The company said its security team identified the issue on August 14, 2026, investigated with an independent cybersecurity firm, remediated the vulnerability, contacted law enforcement, and reinforced its systems. Frontline has not disclosed which third-party application was involved or when the unauthorized access began.\u003c/p\u003e\n\n\u003cp\u003eNotifications reviewed by BleepingComputer indicate that affected district employees may have had Social Security numbers, email addresses, and physical addresses exposed; one district notification listed 1,210 affected employees. School IT administrators reported that they independently confirmed the notifications were legitimate. Frontline will notify affected people unless districts opt out by October 16, and it is offering adults two years of TransUnion credit monitoring and identity theft protection, while minors will receive cyber monitoring services. The number of affected districts and individuals remains unknown.\u003c/p\u003e\n"},{"n":4,"title":"Bipartisan backlash to ALPRs grows as two high-profile bills are introduced","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/alpr-legislation-hawley-sanders-merkley-aoc","time":"19:30","priority":"SHOULD READ","score":78,"tldr":"Bipartisan lawmakers introduced competing federal bills targeting AI-powered automatic license plate reader networks, with one proposing safeguards and the other seeking to ban federal use and restrict funding for state deployments. The measures reflect growing concern over Flock Safety and similar systems’ surveillance reach, alleged misuse, and wrongful-arrest risks.","briefOverview":"\u003cp\u003eSen. Josh Hawley introduced the Stop Flock Abuse Act, while Sens. Bernie Sanders and Jeff Merkley, joined by Rep. Alexandria Ocasio-Cortez, introduced a broader proposal targeting automatic license plate reader cameras. Hawley’s bill would add safeguards for AI-enabled cameras, and the other bill would prohibit federal use of the systems, restrict federal funding for states deploying them, and permit lawsuits against the federal government over rights violations. Both measures would apply not only to Flock Safety but also to other ALPR providers such as Motorola and Axon.\u003c/p\u003e\n\n\u003cp\u003eHawley’s proposal would limit data retention to 10 days, require encryption, restrict sharing and third-party access, require approval and supervisory audits for searches, and prohibit facial-recognition additions. The legislation follows reports of wrongful arrests, alleged improper searches by officers, and cameras reportedly installed without authorization, including 14 cameras discovered by St. Lucie County officials. Cybersecurity researcher Joshua Michael also published a map that he said identified roughly 300,000 Flock-connected devices and more than 170,000 Flock cameras, exceeding Flock’s stated total of 120,000 cameras.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Sen. Josh Hawley introduced the Stop Flock Abuse Act, which would impose safeguards on AI-enabled automatic license plate reader cameras, including a 10-day data-retention limit and restrictions on sharing driver data with nongovernmental third parties.","Sens. Bernie Sanders and Jeff Merkley, joined by Rep. Alexandria Ocasio-Cortez, introduced a bill that would bar federal use of automatic license plate reader cameras and deny federal funding to states that deploy them.","The proposed bills would apply to automatic license plate reader companies beyond Flock Safety, including Motorola and Axon.","At a Senate hearing, Florida resident Lindsey Isaacs said she was arrested and jailed for 13 days after an AI-powered Flock Safety license plate reader incorrectly linked her car model to a suspected crime.","Five Indianapolis police officers were arrested on September 23 for allegedly using Flock searches to track personal contacts."],"insights":["The legislative push spans ideologically distant lawmakers: Hawley’s narrower Republican bill focuses on safeguards, while Sanders, Merkley, and Ocasio-Cortez support a broader ban on federal use and funding restrictions for states that deploy the cameras.","Ending a Flock contract may not end automated license-plate surveillance, because the article says some police departments have switched to another ALPR provider with similar practices.","Hawley’s proposed 10-day data-retention limit is materially shorter than the 30-day retention period Flock allows departments in many cases.","The article describes both operational and governance concerns: officers allegedly used searches to track personal contacts, while officials in St. Lucie County reportedly found 14 Flock cameras that had not been permitted.","Joshua Michael’s reported map identified roughly 300,000 Flock-connected devices and more than 170,000 Flock cameras, figures that exceed Flock’s stated deployment total of 120,000 cameras."],"referencedReports":[{"title":"Flock Surveillance Map","url":"https://flocksurveillance.org/index.html","publisher":"joshua-michael","context":"Cybersecurity researcher Joshua Michael published a surveillance map that he said showed approximately 300,000 Flock-connected devices and more than 170,000 Flock cameras nationwide.","category":"research","primary":false}],"body":"\u003cp\u003eSen. Josh Hawley introduced the Stop Flock Abuse Act, while Sens. Bernie Sanders and Jeff Merkley, joined by Rep. Alexandria Ocasio-Cortez, introduced a broader proposal targeting automatic license plate reader cameras. Hawley’s bill would add safeguards for AI-enabled cameras, and the other bill would prohibit federal use of the systems, restrict federal funding for states deploying them, and permit lawsuits against the federal government over rights violations. Both measures would apply not only to Flock Safety but also to other ALPR providers such as Motorola and Axon.\u003c/p\u003e\n\n\u003cp\u003eHawley’s proposal would limit data retention to 10 days, require encryption, restrict sharing and third-party access, require approval and supervisory audits for searches, and prohibit facial-recognition additions. The legislation follows reports of wrongful arrests, alleged improper searches by officers, and cameras reportedly installed without authorization, including 14 cameras discovered by St. Lucie County officials. Cybersecurity researcher Joshua Michael also published a map that he said identified roughly 300,000 Flock-connected devices and more than 170,000 Flock cameras, exceeding Flock’s stated total of 120,000 cameras.\u003c/p\u003e\n"},{"n":3,"title":"Judge dismisses spyware case brought by Salvadoran journalists targeted with Pegasus","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/judge-dismisses-spyware-case-brought-by-salvadoran-journalists","time":"20:30","priority":"MAY READ","score":68,"tldr":"A California federal judge dismissed a lawsuit by El Faro journalists alleging NSO Group’s Pegasus spyware targeted their phones, finding the case lacked jurisdiction in California. The Knight First Amendment Institute plans to appeal.","briefOverview":"\u003cp\u003eA California federal judge dismissed a lawsuit brought by Salvadoran journalists from the independent news outlet El Faro against Pegasus maker NSO Group. The journalists alleged that their devices were infected with powerful zero-click spyware, which can access a phone without requiring the target to click anything. The court found that the plaintiffs had not established jurisdiction in California.\u003c/p\u003e\n\n\u003cp\u003eLead plaintiff Carlos Dada and colleagues were allegedly targeted with Pegasus at least 226 times between June 2020 and November 2021, according to the Knight First Amendment Institute. The plaintiffs argued that California was an appropriate venue because the surveillance used compromised infrastructure located in the state, and they sought deletion of collected information and disclosure of the client who ordered the spying. The case, described as the first filed against NSO Group in a U.S. court, may be revived because the Knight Institute said it plans to appeal.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A California federal judge dismissed a lawsuit filed by Salvadoran journalists from El Faro whose devices were infected with Pegasus spyware.","The court found that the plaintiffs did not establish that California had jurisdiction over the case.","The journalists alleged that Pegasus was deployed against lead plaintiff Carlos Dada and colleagues at least 226 times between June 2020 and November 2021.","The plaintiffs argued that California was an appropriate venue because the spying used compromised infrastructure located in the state.","The Knight First Amendment Institute, which filed the case on the journalists’ behalf, said it plans to appeal the dismissal."],"insights":["Although the alleged Pegasus targeting was extensive, the case was dismissed on where it could be heard rather than on whether the alleged phone surveillance occurred.","The lawsuit was the first U.S. court case filed against Pegasus maker NSO Group, making the jurisdiction ruling significant for this specific legal effort.","The journalists alleged that surveillance became more frequent shortly before major investigations were published, linking the claimed monitoring to their reporting activity.","The requested remedies went beyond financial relief: the plaintiffs sought deletion of collected data and disclosure of the client who ordered the surveillance."],"referencedReports":[],"body":"\u003cp\u003eA California federal judge dismissed a lawsuit brought by Salvadoran journalists from the independent news outlet El Faro against Pegasus maker NSO Group. The journalists alleged that their devices were infected with powerful zero-click spyware, which can access a phone without requiring the target to click anything. The court found that the plaintiffs had not established jurisdiction in California.\u003c/p\u003e\n\n\u003cp\u003eLead plaintiff Carlos Dada and colleagues were allegedly targeted with Pegasus at least 226 times between June 2020 and November 2021, according to the Knight First Amendment Institute. The plaintiffs argued that California was an appropriate venue because the surveillance used compromised infrastructure located in the state, and they sought deletion of collected information and disclosure of the client who ordered the spying. The case, described as the first filed against NSO Group in a U.S. court, may be revived because the Knight Institute said it plans to appeal.\u003c/p\u003e\n"}]</script>
