<script type="application/json" id="dl-articles">[{"n":2,"title":"CISA warns admins to patch actively exploited SharePoint flaws","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-warns-admins-to-patch-actively-exploited-sharepoint-flaws/","time":"09:44","priority":"MUST READ","score":95,"tldr":"CISA warns that attackers are actively exploiting three on-premises Microsoft SharePoint Server flaws to bypass authentication, achieve remote code execution, and steal IIS machine keys for persistence. Admins should urgently apply Microsoft’s latest patches, verify installation, monitor for compromise, and reduce or protect internet exposure.","briefOverview":"\u003cp\u003eCISA warned that attackers are actively exploiting three vulnerabilities to hack internet-exposed on-premises SharePoint Server instances. The flaws are tracked as CVE-2026-32201, CVE-2026-45659, and CVE-2026-56164, and they affect all supported self-hosted SharePoint Server versions, including SharePoint Server Subscription Edition. CISA said attackers are using the flaws to bypass authentication, gain remote code execution, steal Internet Information Services machine keys, and gain persistence to deploy malware on compromised systems.\u003c/p\u003e\n\n\u003cp\u003eCISA also flagged two more SharePoint Server vulnerabilities, CVE-2026-55040 and CVE-2026-58644, which Microsoft patched and described as attractive targets for attackers, though they are not yet known to be exploited in the wild. Shadowserver currently tracks nearly 10,000 internet-exposed Microsoft SharePoint servers, with more than 800 unpatched against CVE-2026-32201 and CVE-2026-45659. The article notes that there are no details on how many exposed systems are vulnerable to CVE-2026-56164 attacks or are honeypots.\u003c/p\u003e\n\n\u003cp\u003eCISA urged security teams to apply Microsoft’s latest patches, verify successful installation, shorten patching cycles, monitor affected servers, and enable AMSI integration and Microsoft Defender Antivirus detections. It also recommended hunting for and remediating intrusion artifacts before rotating IIS machine keys, reducing direct internet exposure, blocking external access to SharePoint Central Administration, and placing exposed servers behind a Layer 7 reverse proxy or similar control where needed. Federal agencies have until July 17 to secure SharePoint servers affected by CVE-2026-56164 under Binding Operational Directive 26-04 or discontinue them if mitigations cannot be applied.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA warned that attackers are actively exploiting CVE-2026-32201, CVE-2026-45659, and CVE-2026-56164 to hack internet-exposed on-premises SharePoint Server instances.","The three actively exploited vulnerabilities affect all supported self-hosted SharePoint Server versions, including SharePoint Server Subscription Edition.","CISA said attackers are using the flaws to bypass authentication, gain remote code execution, steal Internet Information Services machine keys, and gain persistence to deploy malware on compromised systems.","Shadowserver tracks nearly 10,000 internet-exposed Microsoft SharePoint servers and more than 800 that are unpatched against CVE-2026-32201 and CVE-2026-45659.","CISA recommended applying Microsoft’s latest patches, verifying successful installation, shortening patching cycles, enabling AMSI integration and Microsoft Defender Antivirus detections, and reducing direct internet exposure where possible."],"insights":["CISA specifically advises hunting for and removing intrusion artifacts before rotating IIS machine keys, indicating that key rotation alone may not be sufficient if attackers already have persistence on a compromised server.","CISA highlighted two additional SharePoint Server flaws, CVE-2026-55040 and CVE-2026-58644, as attractive attacker targets even though they are not yet known to be exploited in the wild.","Federal agencies have only until July 17 to secure SharePoint servers affected by CVE-2026-56164 or discontinue them if mitigations cannot be applied.","CISA’s guidance goes beyond patching by recommending reduced direct internet exposure, blocking external access to SharePoint Central Administration, and placing exposed servers behind a Layer 7 reverse proxy or similar application-layer control.","Since November 2021, CISA has flagged 11 Microsoft SharePoint vulnerabilities exploited in attacks, and 7 of those were also exploited in ransomware attacks."],"referencedReports":[{"title":"CISA Urges SharePoint Hardening After New Exploitations","url":"https://www.cisa.gov/news-events/alerts/2026/07/14/cisa-urges-sharepoint-hardening-after-new-exploitations","publisher":"CISA","context":"The article cites this Tuesday advisory as the source for details on active exploitation of three SharePoint Server vulnerabilities and recommended mitigations.","category":"","primary":false},{"title":"Security hardening for SharePoint Server","url":"https://learn.microsoft.com/en-us/sharepoint/security-for-sharepoint-server/security-hardening","publisher":"Microsoft","context":"The article recommends reviewing Microsoft’s official SharePoint Server security-hardening guidance as an additional hardening measure.","category":"","primary":false}],"body":"\u003cp\u003eCISA warned that attackers are actively exploiting three vulnerabilities to hack internet-exposed on-premises SharePoint Server instances. The flaws are tracked as CVE-2026-32201, CVE-2026-45659, and CVE-2026-56164, and they affect all supported self-hosted SharePoint Server versions, including SharePoint Server Subscription Edition. CISA said attackers are using the flaws to bypass authentication, gain remote code execution, steal Internet Information Services machine keys, and gain persistence to deploy malware on compromised systems.\u003c/p\u003e\n\n\u003cp\u003eCISA also flagged two more SharePoint Server vulnerabilities, CVE-2026-55040 and CVE-2026-58644, which Microsoft patched and described as attractive targets for attackers, though they are not yet known to be exploited in the wild. Shadowserver currently tracks nearly 10,000 internet-exposed Microsoft SharePoint servers, with more than 800 unpatched against CVE-2026-32201 and CVE-2026-45659. The article notes that there are no details on how many exposed systems are vulnerable to CVE-2026-56164 attacks or are honeypots.\u003c/p\u003e\n\n\u003cp\u003eCISA urged security teams to apply Microsoft’s latest patches, verify successful installation, shorten patching cycles, monitor affected servers, and enable AMSI integration and Microsoft Defender Antivirus detections. It also recommended hunting for and remediating intrusion artifacts before rotating IIS machine keys, reducing direct internet exposure, blocking external access to SharePoint Central Administration, and placing exposed servers behind a Layer 7 reverse proxy or similar control where needed. Federal agencies have until July 17 to secure SharePoint servers affected by CVE-2026-56164 under Binding Operational Directive 26-04 or discontinue them if mitigations cannot be applied.\u003c/p\u003e\n"},{"n":12,"title":"UK Cybercrime Journal: University of Nottingham Breached by ShinyHunters","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/07/uk-cybercrime-journal-university-of.html","time":"08:00","priority":"MUST READ","score":95,"tldr":"ShinyHunters breached the University of Nottingham and leaked over 40GB of sensitive student, finance, and campus data, including more than 455,000 unique email addresses and highly personal details. The incident is part of a broader campaign targeting education organizations through Oracle PeopleSoft infrastructure using the critical CVE-2026-35273 zero-day.","briefOverview":"\u003cp\u003eOn 9 June 2026, the University of Nottingham was listed as a victim on the ShinyHunters Tor data leak site. The attackers leaked over 40GB of billing and payment records, student finance data, and campus portal exports from the University of Nottingham and its Malaysia and China campuses. The stolen data included contact information, transaction amounts, IP addresses, full names, home addresses, postcodes, email addresses, phone numbers, dates of birth, and other internal campus data.\u003c/p\u003e\n\n\u003cp\u003eHave I Been Pwned analysis found that the leaked data also contained over 455,000 unique email addresses, along with personal information including ethnicities, disabilities, and passport numbers. On 11 June 2026, Mandiant and Google Threat Intelligence Group disclosed an active compromise and extortion campaign attributed to UNC6240, also known as ShinyHunters, targeting Oracle PeopleSoft application infrastructure. The campaign used a critical remote code execution vulnerability tracked as CVE-2026-35273, with a CVSS score of 9.8.\u003c/p\u003e\n\n\u003cp\u003eThe article says ShinyHunters has a focus on the education sector and had targeted Instructure Canvas in May 2026, affecting a number of UK universities. Google identified over 100 exposed organizations in the Oracle PeopleSoft campaign and noted that 68% were academic institutions, including universities and colleges worldwide. The defensive takeaways emphasize patching Oracle PeopleSoft, checking system integrity while patching, ingesting event logs, threat hunting, and following data breach response steps such as rotating credentials, replacing identity documents where needed, and using credit monitoring services.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On 9 June 2026, the University of Nottingham was listed as a victim on the ShinyHunters Tor data leak site.","ShinyHunters leaked over 40GB of billing and payment records, student finance data, and campus portal exports from the University of Nottingham and its Malaysia and China campuses.","Have I Been Pwned analysis found the leaked data contained over 455,000 unique email addresses and personal information including ethnicities, disabilities, and passport numbers.","Mandiant and Google Threat Intelligence Group attributed an active compromise and extortion campaign targeting Oracle PeopleSoft infrastructure to UNC6240, also known as ShinyHunters.","Google identified over 100 exposed organizations in the Oracle PeopleSoft campaign and noted that 68% were academic institutions, including universities and colleges worldwide."],"insights":["The article links the Nottingham breach to a wider education-sector pattern, noting that ShinyHunters had targeted Instructure Canvas the previous month and that other UK universities were also affected by that incident.","The exposed ShinyHunters server reportedly showed MeshCentral agent use against Oracle PeopleSoft servers and bash_history entries connecting to the IP address hosting the group’s Tor leak site, providing an unusual operational link between targeting activity and leak infrastructure.","Google’s finding that 68% of more than 100 exposed organizations were academic institutions makes the campaign especially relevant for universities and colleges rather than being a broadly distributed enterprise issue.","The article emphasizes that patching alone is insufficient for internet-facing systems, because organizations should also check system integrity and hunt through event logs for evidence of compromise while applying updates.","The breach response burden extends beyond password changes because the leaked data reportedly includes passports, national insurance numbers or similar identity codes, and other information that may require replacement documents and credit monitoring."],"referencedReports":[{"title":"University of Nottingham","url":"https://haveibeenpwned.com/Breach/UniversityOfNottingham","publisher":"Have I Been Pwned","context":"The article cites Have I Been Pwned's analysis of the leaked University of Nottingham data, which found over 455,000 unique email addresses and additional personal information.","category":"","primary":false},{"title":"ShinyHunters Targets Education Sector Using Oracle Exploit","url":"https://cloud.google.com/blog/topics/threat-intelligence/shinyhunters-targets-education-sector-oracle-exploit","publisher":"Mandiant and Google Threat Intelligence Group","context":"The article cites this disclosure for the attribution of an active compromise and extortion campaign against Oracle PeopleSoft infrastructure to UNC6240, also known as ShinyHunters.","category":"","primary":false},{"title":"Oracle E-Business Suite Zero-Day Exploitation","url":"https://cloud.google.com/blog/topics/threat-intelligence/oracle-ebusiness-suite-zero-day-exploitation/","publisher":"Google Threat Intelligence Group","context":"The article references this earlier Google analysis as context for a prior CLOP campaign exploiting an Oracle E-Business Suite zero-day.","category":"","primary":false}],"body":"\u003cp\u003eOn 9 June 2026, the University of Nottingham was listed as a victim on the ShinyHunters Tor data leak site. The attackers leaked over 40GB of billing and payment records, student finance data, and campus portal exports from the University of Nottingham and its Malaysia and China campuses. The stolen data included contact information, transaction amounts, IP addresses, full names, home addresses, postcodes, email addresses, phone numbers, dates of birth, and other internal campus data.\u003c/p\u003e\n\n\u003cp\u003eHave I Been Pwned analysis found that the leaked data also contained over 455,000 unique email addresses, along with personal information including ethnicities, disabilities, and passport numbers. On 11 June 2026, Mandiant and Google Threat Intelligence Group disclosed an active compromise and extortion campaign attributed to UNC6240, also known as ShinyHunters, targeting Oracle PeopleSoft application infrastructure. The campaign used a critical remote code execution vulnerability tracked as CVE-2026-35273, with a CVSS score of 9.8.\u003c/p\u003e\n\n\u003cp\u003eThe article says ShinyHunters has a focus on the education sector and had targeted Instructure Canvas in May 2026, affecting a number of UK universities. Google identified over 100 exposed organizations in the Oracle PeopleSoft campaign and noted that 68% were academic institutions, including universities and colleges worldwide. The defensive takeaways emphasize patching Oracle PeopleSoft, checking system integrity while patching, ingesting event logs, threat hunting, and following data breach response steps such as rotating credentials, replacing identity documents where needed, and using credit monitoring services.\u003c/p\u003e\n"},{"n":4,"title":"Compromised AsyncAPI npm Packages Deliver Multi-Stage Botnet Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/compromised-asyncapi-npm-packages.html","time":"09:16","priority":"MUST READ","score":92,"tldr":"Compromised @asyncapi npm packages were used to deliver a multi-stage botnet loader that downloads the Miasma payload from IPFS and can steal credentials, persist, move laterally, and spread through package registries. The attackers abused legitimate GitHub Actions publishing workflows with valid provenance, so affected systems should be treated as potentially compromised if the poisoned modules were loaded.","briefOverview":"\u003cp\u003eFour compromised npm packages in the @asyncapi namespace were observed distributing a multi-stage botnet loader, according to findings from OX Security, SafeDep, Socket, and StepSecurity. The affected versions were @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, @asyncapi/generator@3.3.1, and @asyncapi/specs versions 6.11.2 and 6.11.2-alpha.1. All five malicious versions have since been unpublished from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned packages contained a hidden JavaScript implant that decoded to the same second-stage downloader. Unlike earlier cases that used install hooks, this malicious code ran when the infected module was loaded by Node.js, then launched a detached background node that downloaded and executed malware from IPFS. The next-stage payload was an encrypted JavaScript loader named \u0026ldquo;sync.js,\u0026rdquo; which decoded to the Miasma tasking framework and included support for multiple command-and-control channels.\u003c/p\u003e\n\n\u003cp\u003eThe Miasma framework supported HTTP, Nostr relay, IPFS, BitTorrent DHT, libp2p GossipSub, and an Ethereum smart contract, and the article says it could facilitate credential theft, AI tool poisoning, LAN lateral movement, worm-like propagation, and persistence across several operating systems. StepSecurity said the attacker gained push access to repositories and used legitimate GitHub Actions release workflows with npm’s GitHub OIDC trusted-publisher integration, rather than stealing an npm token. The article advises treating any endpoint that imported or executed one of the affected package versions as potentially compromised, while noting that exposure depends on whether the infected module was loaded during a build or developer workflow.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Four compromised npm packages in the @asyncapi namespace were observed distributing a multi-stage botnet loader, affecting @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, @asyncapi/generator@3.3.1, and @asyncapi/specs versions 6.11.2 and 6.11.2-alpha.1.","The poisoned packages contained a hidden JavaScript implant that executed when the infected module was loaded by Node.js, not through npm install hooks.","The implant downloaded an encrypted second-stage JavaScript loader named sync.js from IPFS, which decoded to the Miasma tasking framework.","The Miasma framework supported six command-and-control communication channels: HTTP, Nostr relay, IPFS, BitTorrent DHT, libp2p GossipSub, and an Ethereum smart contract.","StepSecurity said the attacker gained push access to repositories and used legitimate GitHub Actions release workflows to publish the packages with valid OIDC provenance attestations, rather than stealing an npm token."],"insights":["Valid SLSA provenance attestations did not mean the packages were safe, because they only showed that an authorized GitHub Actions workflow published them, not that the commits triggering the workflow were legitimate.","Organizations should assess whether the poisoned modules were actually loaded during builds or developer workflows, because the malware did not run at npm install time.","Revoking a stolen token could trigger the malware’s dead man’s switch to wipe directories, according to the article’s description of its behavior.","The malware avoided running on systems with Russian language settings or with several named security tools installed, which could reduce visibility in some analysis and monitoring environments.","Although the code contained the Miasma string and resembled earlier Shai-Hulud and Miasma campaigns, OX Security stated that it was not attributed to those prior campaigns."],"referencedReports":[{"title":"AsyncAPI npm Organization Compromised: 2M Weekly Downloads Affected","url":"https://www.ox.security/blog/asyncapi-npm-organization-compromised-2m-weekly-downloads-affected/","publisher":"OX Security","context":"The article cites OX Security as one of the entities whose findings documented compromised @asyncapi npm packages distributing a multi-stage botnet loader.","category":"","primary":false},{"title":"AsyncAPI Generator Supply Chain Attack: Miasma RAT","url":"https://safedep.io/asyncapi-generator-supply-chain-attack-miasma-rat/","publisher":"SafeDep","context":"The article cites SafeDep as one of the entities whose findings described the AsyncAPI package compromise and Miasma-related payload.","category":"","primary":false},{"title":"AsyncAPI Supply Chain Attack","url":"https://socket.dev/blog/asyncapi-supply-chain-attack","publisher":"Socket","context":"The article cites Socket’s findings and quotes its description of the compromised packages deploying an obfuscated first-stage payload that downloads an encrypted Miasma payload from IPFS.","category":"","primary":false},{"title":"Compromised Next Branch Pushes Malicious AsyncAPI Generator, Generator Helpers, and Generator Components to npm","url":"https://www.stepsecurity.io/blog/compromised-next-branch-pushes-malicious-asyncapi-generator-generator-helpers-and-generator-components-to-npm","publisher":"StepSecurity","context":"The article cites StepSecurity’s analysis that the attacker gained repository push access and used legitimate GitHub Actions release workflows to publish the malicious packages.","category":"","primary":false}],"body":"\u003cp\u003eFour compromised npm packages in the @asyncapi namespace were observed distributing a multi-stage botnet loader, according to findings from OX Security, SafeDep, Socket, and StepSecurity. The affected versions were @asyncapi/generator-helpers@1.1.1, @asyncapi/generator-components@0.7.1, @asyncapi/generator@3.3.1, and @asyncapi/specs versions 6.11.2 and 6.11.2-alpha.1. All five malicious versions have since been unpublished from the npm registry.\u003c/p\u003e\n\n\u003cp\u003eThe poisoned packages contained a hidden JavaScript implant that decoded to the same second-stage downloader. Unlike earlier cases that used install hooks, this malicious code ran when the infected module was loaded by Node.js, then launched a detached background node that downloaded and executed malware from IPFS. The next-stage payload was an encrypted JavaScript loader named \u0026ldquo;sync.js,\u0026rdquo; which decoded to the Miasma tasking framework and included support for multiple command-and-control channels.\u003c/p\u003e\n\n\u003cp\u003eThe Miasma framework supported HTTP, Nostr relay, IPFS, BitTorrent DHT, libp2p GossipSub, and an Ethereum smart contract, and the article says it could facilitate credential theft, AI tool poisoning, LAN lateral movement, worm-like propagation, and persistence across several operating systems. StepSecurity said the attacker gained push access to repositories and used legitimate GitHub Actions release workflows with npm’s GitHub OIDC trusted-publisher integration, rather than stealing an npm token. The article advises treating any endpoint that imported or executed one of the affected package versions as potentially compromised, while noting that exposure depends on whether the infected module was loaded during a build or developer workflow.\u003c/p\u003e\n"},{"n":9,"title":"Thousands of compromised websites abused by DriveSurge in active ClickFix and FakeUpdates campaigns","source":"techradar.com","sourceColorIdx":2,"link":"https://www.techradar.com/pro/security/thousands-of-compromised-websites-abused-by-drivesurge-in-active-clickfix-and-fakeupdates-campaigns#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=thousands-of-compromised-websites-abused-by-drivesurge-in-active-clickfix-and-fakeupdates-campaigns","time":"08:29","priority":"MUST READ","score":92,"tldr":"Thousands of compromised websites are being abused by DriveSurge to redirect visitors into active ClickFix and FakeUpdates campaigns. The key risk is that ordinary-looking legitimate sites can silently funnel users toward social-engineering lures and malware delivery.","briefOverview":"\u003cp\u003eThe article reports that thousands of compromised websites are being abused by DriveSurge. It says this activity is part of active ClickFix and FakeUpdates campaigns. The central event is the use of already-compromised websites as part of those campaigns.\u003c/p\u003e\n\n\u003cp\u003eThe significance is the scale described in the article: thousands of websites are involved. The affected parties include the compromised websites and the people exposed to the active ClickFix and FakeUpdates campaigns. The key named technical elements in the article are DriveSurge, ClickFix, and FakeUpdates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Thousands of compromised websites are being abused by DriveSurge.","DriveSurge is using the compromised websites in active ClickFix campaigns.","DriveSurge is also using the compromised websites in active FakeUpdates campaigns."],"insights":["DriveSurge is tied to more than one active campaign type, with both ClickFix and FakeUpdates activity linked to the same abuse of compromised websites.","The article frames the websites as compromised and abused, which means the sites themselves are not presented as the original intended destinations of the campaigns but as infrastructure being misused by DriveSurge."],"referencedReports":[],"body":"\u003cp\u003eThe article reports that thousands of compromised websites are being abused by DriveSurge. It says this activity is part of active ClickFix and FakeUpdates campaigns. The central event is the use of already-compromised websites as part of those campaigns.\u003c/p\u003e\n\n\u003cp\u003eThe significance is the scale described in the article: thousands of websites are involved. The affected parties include the compromised websites and the people exposed to the active ClickFix and FakeUpdates campaigns. The key named technical elements in the article are DriveSurge, ClickFix, and FakeUpdates.\u003c/p\u003e\n"},{"n":6,"title":"DriveSurge Hijacks Thousands of Sites for ClickFix, FakeUpdate Attacks","source":"darkreading.com","sourceColorIdx":4,"link":"https://www.darkreading.com/cyberattacks-data-breaches/drivesurge-hijacks-thousands-sites-clickfix-fakeupdate-attacks#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=drivesurge-hijacks-thousands-of-sites-for-clickfix-fakeupdate-attacks","time":"08:52","priority":"SHOULD READ","score":86,"tldr":"DriveSurge has compromised thousands of websites to deliver ClickFix and FakeUpdate social-engineering attacks, turning legitimate sites into lures for malware installation. The key takeaway is that users and site owners should treat unexpected update prompts or verification fixes on compromised sites as highly suspicious.","briefOverview":"\u003cp\u003eThe article reports that DriveSurge hijacked thousands of sites. The hijacked sites were used for ClickFix attacks. The same activity also involved FakeUpdate attacks.\u003c/p\u003e\n\n\u003cp\u003eThe significance presented in the article is the scale of the site hijacking, which involved thousands of sites. The named activity connects DriveSurge with both ClickFix and FakeUpdate attacks. The article’s key technical detail is that compromised sites were used as the delivery setting for those attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports that DriveSurge hijacked thousands of sites.","The hijacked sites were used for ClickFix attacks.","The hijacked sites were also used for FakeUpdate attacks."],"insights":["The article ties both ClickFix and FakeUpdate activity to the same DriveSurge site-hijacking campaign.","The reported use of thousands of hijacked sites shows the activity is described as a broad campaign rather than a single-site incident."],"referencedReports":[],"body":"\u003cp\u003eThe article reports that DriveSurge hijacked thousands of sites. The hijacked sites were used for ClickFix attacks. The same activity also involved FakeUpdate attacks.\u003c/p\u003e\n\n\u003cp\u003eThe significance presented in the article is the scale of the site hijacking, which involved thousands of sites. The named activity connects DriveSurge with both ClickFix and FakeUpdate attacks. The article’s key technical detail is that compromised sites were used as the delivery setting for those attacks.\u003c/p\u003e\n"},{"n":3,"title":"US charges alleged operators of Russian bulletproof hosting service","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/us-charges-alleged-russian-bulletproof-hosting-service-operators/","time":"07:45","priority":"SHOULD READ","score":82,"tldr":"U.S. prosecutors charged three Russian nationals accused of running the Media Land and ML.Cloud bulletproof hosting services, which allegedly supported ransomware and cybercrime operations causing over $62 million in damages. The U.S. is also offering up to $10 million for information on foreign government-linked associates or use of the companies.","briefOverview":"\u003cp\u003eU.S. federal prosecutors unsealed charges against three Russian nationals accused of providing bulletproof hosting services to ransomware gangs that caused over \u003cspan class=\"math inline\"\u003e\\(62 million in damages to victims worldwide. The indictment says Aleksandr Volosovik owned Media Land, Yulia Pankova owned ML Cloud and assisted with legal and financial matters, and Kirill Zatolokin collected customer payments. The U.S. Department of State is also offering a reward of up to \\)\u003c/span\u003e10 million for information on foreign government-linked associates of the actors, their malicious cyber activities, or foreign government-linked use of the companies.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that bulletproof hosting providers lease servers that help hinder disruption efforts targeting malicious activity, including malware delivery, command-and-control operations, phishing attacks, and illicit content hosting. Media Land and ML.Cloud allegedly provided customers with infrastructure in multiple countries outside Russia, including China, Finland, the Netherlands, and the United States. OFAC previously said Media Land infrastructure was used to launch DDoS attacks against U.S. companies and critical infrastructure, including telecommunications systems.\u003c/p\u003e\n\n\u003cp\u003eThe United States, the United Kingdom, and Australia previously sanctioned the three defendants and two companies in November for providing attack infrastructure and technical support to operations including LockBit, Blacksuit, and Play. United States Attorney David M. Toepfer said victims were located in Ohio and 20 other U.S. states and included banks, schools, government entities, hospitals, and media companies. The Council of the European Union also announced sanctions against Media Land, ML.Cloud, and Alexander Volosovik as part of the first joint cyber sanctions package issued against Russia in collaboration with the United Kingdom.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["U.S. federal prosecutors unsealed charges against three Russian nationals accused of providing bulletproof hosting services to ransomware gangs that caused over $62 million in damages worldwide.","The indictment says Aleksandr Volosovik owned Media Land, Yulia Pankova owned ML Cloud and assisted with legal and financial matters, and Kirill Zatolokin collected customer payments.","Media Land and ML.Cloud allegedly provided infrastructure in multiple countries outside Russia, including China, Finland, the Netherlands, and the United States.","The U.S. Department of State is offering a reward of up to $10 million for information on foreign government-linked associates of the defendants, their malicious cyber activities, or foreign government-linked use of the companies.","The United States, the United Kingdom, and Australia previously sanctioned the three defendants and two companies for providing attack infrastructure and technical support to operations including LockBit, Blacksuit, and Play."],"insights":["The case shows a layered enforcement approach against the same alleged hosting operators, combining U.S. criminal charges, prior U.S.-U.K.-Australia sanctions, a State Department reward, and new EU-U.K. sanctions.","Although the defendants and companies are tied to Russia, the alleged hosting infrastructure extended into China, Finland, the Netherlands, and the United States, showing that disruption efforts may involve systems spread across multiple jurisdictions.","The State Department reward specifically asks for information about foreign government-linked associates or use of the companies, indicating investigators are interested in connections beyond ordinary cybercrime customers.","Media Land’s alleged role was not limited to ransomware support, as OFAC said its infrastructure was also used for DDoS attacks against U.S. companies and critical infrastructure, including telecommunications systems."],"referencedReports":[],"body":"\u003cp\u003eU.S. federal prosecutors unsealed charges against three Russian nationals accused of providing bulletproof hosting services to ransomware gangs that caused over \u003cspan class=\"math inline\"\u003e\\(62 million in damages to victims worldwide. The indictment says Aleksandr Volosovik owned Media Land, Yulia Pankova owned ML Cloud and assisted with legal and financial matters, and Kirill Zatolokin collected customer payments. The U.S. Department of State is also offering a reward of up to \\)\u003c/span\u003e10 million for information on foreign government-linked associates of the actors, their malicious cyber activities, or foreign government-linked use of the companies.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that bulletproof hosting providers lease servers that help hinder disruption efforts targeting malicious activity, including malware delivery, command-and-control operations, phishing attacks, and illicit content hosting. Media Land and ML.Cloud allegedly provided customers with infrastructure in multiple countries outside Russia, including China, Finland, the Netherlands, and the United States. OFAC previously said Media Land infrastructure was used to launch DDoS attacks against U.S. companies and critical infrastructure, including telecommunications systems.\u003c/p\u003e\n\n\u003cp\u003eThe United States, the United Kingdom, and Australia previously sanctioned the three defendants and two companies in November for providing attack infrastructure and technical support to operations including LockBit, Blacksuit, and Play. United States Attorney David M. Toepfer said victims were located in Ohio and 20 other U.S. states and included banks, schools, government entities, hospitals, and media companies. The Council of the European Union also announced sanctions against Media Land, ML.Cloud, and Alexander Volosovik as part of the first joint cyber sanctions package issued against Russia in collaboration with the United Kingdom.\u003c/p\u003e\n"},{"n":7,"title":"DriveSurge actor uses ClickFix and FakeUpdates to distribute malware via compromised websites","source":"scworld.com","sourceColorIdx":3,"link":"https://www.scworld.com/brief/drivesurge-actor-uses-clickfix-and-fakeupdates-to-distribute-malware-via-compromised-websites#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=drivesurge-actor-uses-clickfix-and-fakeupdates-to-distribute-malware-via-compromised-websites","time":"08:44","priority":"SHOULD READ","score":82,"tldr":"The DriveSurge threat actor is compromising websites and using ClickFix social-engineering prompts alongside FakeUpdates lures to deliver malware. The key takeaway is that users should be wary of browser update or fix prompts on websites, as they may be part of an active malware distribution campaign.","briefOverview":"\u003cp\u003eThe article reports that a threat actor named DriveSurge is using compromised websites to distribute malware. The title identifies ClickFix and FakeUpdates as part of the activity. The central event is the use of already-compromised sites as a delivery path for malicious software.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that the activity involves websites that have been compromised, meaning the delivery mechanism is tied to sites under attacker control rather than a standalone lure described in isolation. The article specifically names DriveSurge as the actor associated with the campaign. It also names ClickFix and FakeUpdates as the mechanisms or lures used in the malware distribution activity.\u003c/p\u003e\n\n\u003cp\u003eThe key technical detail available from the article is the combination of ClickFix and FakeUpdates in the distribution chain. The described impact is malware distribution through compromised websites. No further victims, malware families, geography, or technical indicators are clearly provided in the article text.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports that a threat actor named DriveSurge is distributing malware.","DriveSurge is using ClickFix as part of the malware distribution activity.","DriveSurge is also using FakeUpdates to distribute malware through compromised websites.","The malware distribution described in the article involves websites that have been compromised."],"insights":["The same DriveSurge activity uses both ClickFix and FakeUpdates, showing the campaign is not limited to a single delivery lure.","Because the malware is delivered through compromised websites, the risk is tied to visits to otherwise legitimate sites rather than only obviously malicious domains.","The title identifies DriveSurge as the actor behind the activity, making actor-focused detection and tracking relevant to this campaign."],"referencedReports":[],"body":"\u003cp\u003eThe article reports that a threat actor named DriveSurge is using compromised websites to distribute malware. The title identifies ClickFix and FakeUpdates as part of the activity. The central event is the use of already-compromised sites as a delivery path for malicious software.\u003c/p\u003e\n\n\u003cp\u003eThe significance is that the activity involves websites that have been compromised, meaning the delivery mechanism is tied to sites under attacker control rather than a standalone lure described in isolation. The article specifically names ion of accounts is presented as the central outcome of the crackdown."],"insights":["The article highlights disrupted accounts as the main measure of impact, rather than focusing on arrests, seized infrastructure, or recovered funds.","The reported figure of more than 1.4 million accounts suggests the crackdown targeted cybercrime activity at very large scale."],"referencedReports":[],"body":"\u003cp\u003eThe article reports that a cybercrime crackdown disrupted more than 1.4 million accounts. The disruption of accounts is the central impact described by the readable title. The title presents the event as a large-scale action against cybercrime.\u003c/p\u003e\n\n\u003cp\u003eNo readable article text provides further details about who carried out the crackdown, which accounts were affected, or what methods were used. The provided content does not identify specific victims, platforms, countries, agencies, tools, or malware. As a result, the only grounded technical or impact detail is the reported disruption of over 1.4 million accounts.\u003c/p\u003e\n"},{"n":11,"title":"Meta, Microsoft, DOJ, and Others Disrupt Southeast Asia Scam Compounds","source":"securityboulevard.com","sourceColorIdx":3,"link":"https://securityboulevard.com/2026/06/meta-microsoft-doj-and-others-disrupt-southeast-asia-scam-compounds/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=over-1-4-million-accounts-disrupted-in-cybercrime-crackdown-2","time":"09:14","priority":"SHOULD READ","score":78,"tldr":"Meta, Microsoft, the U.S. Department of Justice, and partners coordinated actions to disrupt Southeast Asia-based scam compounds that run large-scale online fraud operations. The key takeaway is that major tech platforms and law enforcement are increasingly targeting the infrastructure and accounts enabling these transnational scams.","briefOverview":"\u003cp\u003eThe article is titled “Meta, Microsoft, DOJ, and Others Disrupt Southeast Asia Scam Compounds.” It identifies Meta, Microsoft, the DOJ, and other unnamed parties as involved in disrupting scam compounds. The title places the activity in Southeast Asia.\u003c/p\u003e\n\n\u003cp\u003eThe core significance presented is that multiple major stakeholders took action against scam compounds. The provided article text does not include readable details about the exact methods, technical mechanisms, victims, or outcomes of the disruption. No specific technical indicators, tools, malware, vulnerabilities, or operational impact can be extracted from the readable article content.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article reports that Meta, Microsoft, the DOJ, and others disrupted scam compounds.","The disrupted scam compounds were located in Southeast Asia.","The article identifies Meta, Microsoft, and the DOJ as participants in the disruption effort."],"insights":["The disruption involved both private technology companies and a government law enforcement agency, indicating the operation was not handled by a single sector alone.","The article’s focus on “scam compounds” points to organized, location-based fraud operations rather than isolated individual scammers."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Meta, Microsoft, DOJ, and Others Disrupt Southeast Asia Scam Compounds.” It identifies Meta, Microsoft, the DOJ, and other unnamed parties as involved in disrupting scam compounds. The title places the activity in Southeast Asia.\u003c/p\u003e\n\n\u003cp\u003eThe core significance presented is that multiple major stakeholders took action against scam compounds. The provided article text does not include readable details about the exact methods, technical mechanisms, victims, or outcomes of the disruption. No specific technical indicators, tools, malware, vulnerabilities, or operational impact can be extracted from the readable article content.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft: Some Dell PCs shut down after recent Windows updates","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-some-dell-devices-shut-down-after-windows-update/","time":"08:26","priority":"MAY READ","score":72,"tldr":"Microsoft is temporarily blocking the KB5101650 Windows 11 security update on some Dell PCs after an Intel driver incompatibility caused shutdowns, overheating, poor performance, and battery drain. A fix is being developed with Dell and is expected soon.","briefOverview":"\u003cp\u003eMicrosoft is blocking this month’s Windows 11 security updates on some Dell devices because they are causing shutdowns and performance issues. The known issue affects only some Dell systems after installing the KB5101650 cumulative update for Windows 11 25H2 and 24H2 devices. Affected devices may experience unexpected shutdowns, poor performance, increased heat, and battery drain.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the root cause is a change introduced in the June 2026 KB5095093 preview cumulative update. The change creates a conflict between the new Windows USB-C Connection Manager interface and the Intel Innovation Platform Framework Processor Participant driver. Windows may show a yellow exclamation point next to the Processor Participant driver in Device Manager.\u003c/p\u003e\n\n\u003cp\u003eThe Intel IPF Processor Participant driver manages system power and thermals by adjusting processor cooling, power consumption, and thermal performance. Dell reported the issue during testing, and Microsoft identified it as an incompatibility between the Intel driver and the new Windows USB-C Connection Manager interface. Microsoft is working with Dell on a fix and plans to release a resolution for affected devices in the coming days.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft is blocking the KB5101650 Windows 11 security update on some Dell devices because it can cause shutdowns and performance issues.","The issue affects a limited number of Dell systems after installing the KB5101650 cumulative update for Windows 11 25H2 and 24H2 devices.","Microsoft said the root cause is a conflict between the new Windows USB-C Connection Manager interface introduced in the KB5095093 preview update and the Intel Innovation Platform Framework Processor Participant driver.","Affected devices may show a yellow exclamation point in Device Manager next to the Intel Innovation Platform Framework Processor Participant driver.","Microsoft is working with Dell on a fix and plans to release a resolution for affected devices in the coming days."],"insights":["The problem traces back to a change introduced in the earlier KB5095093 preview update, but it is affecting delivery of the later KB5101650 security update on affected Dell systems.","A yellow exclamation point next to the Intel Innovation Platform Framework Processor Participant driver in Device Manager is a visible sign associated with the issue.","The symptoms are tied to a driver that manages processor cooling, power use, and thermal performance, which explains why affected devices can show shutdowns, heat, battery drain, and poor performance together.","Dell reported the issue during testing, and Microsoft is using an update block to prevent the affected systems from receiving KB5101650 until a fix is available."],"referencedReports":[{"title":"Some Dell devices with a specific Intel driver might experience poor performance","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-25h2#some-dell-devices-with-a-specific-intel-driver-might-experience-poor-performance","publisher":"Microsoft","context":"The article cites Microsoft's Windows release health dashboard as the source for the known issue affecting some Dell devices after recent Windows updates.","category":"","primary":false}],"body":"\u003cp\u003eMicrosoft is blocking this month’s Windows 11 security updates on some Dell devices because they are causing shutdowns and performance issues. The known issue affects only some Dell systems after installing the KB5101650 cumulative update for Windows 11 25H2 and 24H2 devices. Affected devices may experience unexpected shutdowns, poor performance, increased heat, and battery drain.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft said the root cause is a change introduced in the June 2026 KB5095093 preview cumulative update. The change creates a conflict between the new Windows USB-C Connection Manager interface and the Intel Innovation Platform Framework Processor Participant driver. Windows may show a yellow exclamation point next to the Processor Participant driver in Device Manager.\u003c/p\u003e\n\n\u003cp\u003eThe Intel IPF Processor Participant driver manages system power and thermals by adjusting processor cooling, power consumption, and thermal performance. Dell reported the issue during testing, and Microsoft identified it as an incompatibility between the Intel driver and the new Windows USB-C Connection Manager interface. Microsoft is working with Dell on a fix and plans to release a resolution for affected devices in the coming days.\u003c/p\u003e\n"},{"n":8,"title":"Coinbase and Meta Back DOJ Anti-Scam Operation","source":"coincentral.com","sourceColorIdx":0,"link":"https://coincentral.com/coinbase-and-meta-back-doj-anti-scam-operation/#new_tab?utm_source=rss\u0026utm_medium=rss\u0026utm_campaign=coinbase-and-meta-back-doj-anti-scam-operation","time":"08:59","priority":"MAY READ","score":65,"tldr":"Coinbase and Meta are supporting a U.S. Department of Justice operation aimed at disrupting online scams. The key takeaway is increased cooperation between major tech/crypto platforms and law enforcement to combat fraud.","briefOverview":"\u003cp\u003eThe article is titled “Coinbase and Meta Back DOJ Anti-Scam Operation.” The readable portion identifies Coinbase, Meta, and the DOJ as the central entities. It states that Coinbase and Meta are backing a DOJ anti-scam operation.\u003c/p\u003e\n\n\u003cp\u003eNo clear technical details, operational specifics, affected victims, or impact information are readable in the provided article body. The body content appears corrupted or otherwise unintelligible, so the title is the only usable source of substantive information. Based strictly on the readable text, the article concerns support for an anti-scam operation involving Coinbase, Meta, and the DOJ.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article is titled \"Coinbase and Meta Back DOJ Anti-Scam Operation.\"","The title states that Coinbase is backing a DOJ anti-scam operation.","The title states that Meta is backing the same DOJ anti-scam operation."],"insights":["The article body appears to be unreadable or corrupted, leaving the title as the only clear source of substantive information.","The readable information does not identify the specific scam operation, the type of scams targeted, or the concrete roles played by Coinbase and Meta."],"referencedReports":[],"body":"\u003cp\u003eThe article is titled “Coinbase and Meta Back DOJ Anti-Scam Operation.” The readable portion identifies Coinbase, Meta, and the DOJ as the central entities. It states that Coinbase and Meta are backing a DOJ anti-scam operation.\u003c/p\u003e\n\n\u003cp\u003eNo clear technical details, operational specifics, affected victims, or impact information are readable in the provided article body. The body content appears corrupted or otherwise unintelligible, so the title is the only usable source of substantive information. Based strictly on the readable text, the article concerns support for an anti-scam operation involving Coinbase, Meta, and the DOJ.\u003c/p\u003e\n"},{"n":5,"title":"ADPathFinder: OpenGraph Attack Path Mapping in BloodHound CE","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/technical-blog/network-pentesting/adpathfinder-opengraph-attack-path-mapping-in-bloodhound-ce/","time":"07:40","priority":"MAY READ","score":58,"tldr":"NetSPI released ADPathFinder, a tool that uses BloodHound CE graph data to automatically find and group privilege escalation paths across AD, ADCS, MSSQL, and SCCM. It also enriches password audit results with BloodHound context so cracked or weak credentials can be prioritized by real attack-path risk.","briefOverview":"\u003cp\u003eADPathFinder is a NetSPI tool for mapping privilege escalation paths across Active Directory, ADCS, MSSQL, and SCCM using BloodHound graph data. It combines SharpHound with OpenGraph collectors such as MSSQLHound and ConfigManBearPig so relationships across different datasets can be queried together. The article presents it as a way to find and prioritize attack paths in large internal assessment graphs where BloodHound may contain the answer but the tester may not have time to locate it manually.\u003c/p\u003e\n\n\u003cp\u003eThe tool maps shortest paths from low-privileged users and computers to high-value targets such as Domain Admins and Domain Controllers. It groups principals that reach the same target through the same chain, which reduces duplicate findings and surfaces the paths that affect the most users. It also reports standalone issues such as SMB signing disabled, delegation misconfigurations, WebClient on servers, and checks for ADCS, SCCM, and MSSQL, with severity increasing when an issue sits on an escalation path.\u003c/p\u003e\n\n\u003cp\u003eADPathFinder also performs password auditing when provided with an NTDS dump and hashcat potfile. It checks enabled accounts for issues such as blank passwords, password reuse, username-similar passwords, LM hash use, weak patterns, and cracked Kerberoastable or AS-REP roastable accounts, then adds BloodHound context such as group membership and escalation-path relevance. The tool generates per-domain HTML reports with severity-organized findings, attack path graphs, PowerShell confirmation commands, and supporting text and JSON outputs.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["ADPathFinder maps privilege escalation paths across Active Directory, ADCS, MSSQL, and SCCM using BloodHound graph data.","The tool combines SharpHound data with OpenGraph collector data from tools such as MSSQLHound and ConfigManBearPig so cross-dataset paths appear as one finding.","ADPathFinder groups users and computers that reach the same target through the same chain, reducing duplicate findings in large environments.","The tool can run password audits using NTDS dumps and hashcat potfiles, adding BloodHound context such as group membership, roastability, delegation, and account risk.","ADPathFinder generates per-domain HTML reports, along with text and JSON outputs, containing severity-organized findings, attack path graphs, and PowerShell commands to confirm each step."],"insights":["ADPathFinder changes prioritization by raising the severity of standalone issues, such as SMB signing disabled, when the affected host also has an onward path to a high-value target.","The tool can turn a multi-system chain that spans Active Directory, MSSQL, and SCCM into a single reported finding instead of requiring a tester to manually combine separate leads from different datasets.","Password audit results are separated by operational impact, so a cracked password on a Domain Admin member or an account on an escalation path is treated differently from a cracked password on a standard user account.","Partial collection data is still useful because ADPathFinder can produce findings from a single SharpHound zip and layer in MSSQLHound or ConfigManBearPig data when available.","The `--unsafe-report` option is disabled by default because it includes cleartext passwords in output files, making those reports as sensitive as the original NTDS data."],"referencedReports":[],"body":"\u003cp\u003eADPathFinder is a NetSPI tool for mapping privilege escalation paths across Active Directory, ADCS, MSSQL, and SCCM using BloodHound graph data. It combines SharpHound with OpenGraph collectors such as MSSQLHound and ConfigManBearPig so relationships across different datasets can be queried together. The article presents it as a way to find and prioritize attack paths in large internal assessment graphs where BloodHound may contain the answer but the tester may not have time to locate it manually.\u003c/p\u003e\n\n\u003cp\u003eThe tool maps shortest paths from low-privileged users and computers to high-value targets such as Domain Admins and Domain Controllers. It groups principals that reach the same target through the same chain, which reduces duplicate findings and surfaces the paths that affect the most users. It also reports standalone issues such as SMB signing disabled, delegation misconfigurations, WebClient on servers, and checks for ADCS, SCCM, and MSSQL, with severity increasing when an issue sits on an escalation path.\u003c/p\u003e\n\n\u003cp\u003eADPathFinder also performs password auditing when provided with an NTDS dump and hashcat potfile. It checks enabled accounts for issues such as blank passwords, password reuse, username-similar passwords, LM hash use, weak patterns, and cracked Kerberoastable or AS-REP roastable accounts, then adds BloodHound context such as group membership and escalation-path relevance. The tool generates per-domain HTML reports with severity-organized findings, attack path graphs, PowerShell confirmation commands, and supporting text and JSON outputs.\u003c/p\u003e\n"}]</script>

  border-color:#39bdc9;font-weight:600}
#dl-layout-cta button[data-dl-dismiss]{background:transparent;color:inherit;
  border-color:rgba(127,127,127,.4)}
#dl-layout-cta [data-dl-pill]{display:none;gap:.4em;align-items:center;
  background:transparent;color:#39bdc9;border-color:rgba(57,189,201,.5);font-weight:600}
#dl-layout-cta [data-dl-pill] span{opacity:1}
#dl-layout-cta.is-pill{padding:6px 8px;gap:0}
#dl-layout-cta.is-pill [data-dl-full],
#dl-layout-cta.is-pill [data-dl-try],
#dl-layout-cta.is-pill [data-dl-dismiss]{display:none}
#dl-layout-cta.is-pill [data-dl-pill]{display:inline-flex}
#dl-layout-cta[hidden]{display:none}
@media (max-width:600px){#dl-layout-cta{left:50%;right:auto;transform:translateX(-50%);
  max-width:calc(100vw - 24px)}}
@media print{#dl-layout-cta{display:none}}</style>
<script>
(function(){
  var box=document.getElementById("dl-layout-cta"); if(!box)return;
  var full=true;
  try{
    if(localStorage.getItem("downlink.layout")||localStorage.getItem("downlink.layout.dismissed")) full=false;
  }catch(e){}
  function render(){ box.classList.toggle("is-pill",!full); box.hidden=false; }
  function go(){ if(window.__dlLayout) window.__dlLayout.go("v2"); }
  box.querySelector("[data-dl-try]").addEventListener("click",go);
  box.querySelector("[data-dl-pill]").addEventListener("click",go);
  box.querySelector("[data-dl-dismiss]").addEventListener("click",function(){
    try{localStorage.setItem("downlink.layout.dismissed","1");}catch(e){} full=false; render();
  });
  render();
})();
</script></body>
</html>
