<script type="application/json" id="dl-articles">[{"n":6,"title":"CVE-2026-114938: OpenJDK Base64 Decoder Vulnerable To Pre-Authentication RCE (Java4Shell)","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/cve-2026-114938-openjdk-base64-decoder-vulnerable-pre-authentication-rce","time":"02:39","priority":"MUST READ","score":95,"tldr":"CVE-2026-114938 (“Java4Shell”) is a critical OpenJDK Base64-decoder flaw that can enable pre-authentication RCE on AVX-512 VBMI-capable x86-64 systems. Organizations should immediately upgrade to patched JDK builds or temporarily start JVMs with -XX:-UseBASE64Intrinsics and restart all Java workloads.","briefOverview":"\u003cp\u003eCVE-2026-114938, also called Java4Shell, is a critical heap memory-corruption flaw in OpenJDK’s hardware-accelerated Base64 decoder that was publicly disclosed on November 17, 2026. The issue can be reached when applications decode attacker-controlled Base64 data, and researchers demonstrated pre-authentication remote code execution in default deployments of Keycloak, Jira, Confluence, Artifactory, Jenkins, and PingFederate. The article also reports post-authentication remote code execution in products including Apache Kafka Broker, Solr, Elasticsearch, Gerrit, and Netflix Spinnaker, plus a client-side TLS attack affecting Java clients connecting to malicious servers.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs in an optimized x86-64 decoding routine used by the HotSpot C2 compiler on CPUs supporting AVX-512 VBMI, where malformed Base64 padding can cause a 62-byte write outside the intended heap memory area. It affects OpenJDK 17.0.6 and later and specified Oracle Java SE, Oracle GraalVM, and downstream OpenJDK builds, while ARM64 and older x86-64 processors without the required instruction support are not affected. Organizations are advised to install patched JDK releases and restart JVMs; where updates are delayed, they can temporarily disable the affected path with \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-114938, called Java4Shell, is a critical OpenJDK Base64 decoder flaw that can cause a 62-byte heap out-of-bounds write on certain x86-64 CPUs.","The issue affects OpenJDK 17.0.6 and later and certain Oracle Java SE, Oracle GraalVM, and downstream OpenJDK builds that use the affected Base64 decoder.","Researchers demonstrated pre-authentication remote code execution in default configurations of Keycloak, Atlassian Jira, Atlassian Confluence, JFrog Artifactory, Jenkins, and PingFederate.","The vulnerable code path requires x86-64 CPUs with avx512f, avx512bw, avx512vbmi, and bmi2 support; ARM64 systems and older x86-64 CPUs without AVX-512 VBMI are not affected.","Organizations should install patched Java builds and restart JVMs, or temporarily disable Base64 intrinsics with -XX:-UseBASE64Intrinsics if patching is delayed."],"insights":["Exposure is hardware-dependent: administrators can check Linux /proc/cpuinfo for avx512f, avx512bw, avx512vbmi, and bmi2 to determine whether a host can execute the vulnerable decoder path.","Disabling Base64 intrinsics with -XX:-UseBASE64Intrinsics is the recommended temporary workaround because it forces Java to use safer non-hardware-accelerated code; -XX:UseAVX=2 is limited to x86-64 systems and will prevent ARM64 JVMs from starting.","Reverse-proxy request-body buffering can disrupt some multi-connection heap-grooming techniques, but the article states it does not fully protect against single-request chains such as Elasticsearch or WebSocket tunnels.","The risk is not limited to servers: the article describes a client-side TLS attack path affecting Java clients that connect to a malicious server.","Possible warning signs include bursts of Base64 parsing errors, repeated JVM crash logs referencing StubRoutines::base64_decodeBlock, and Java processes launching unexpected shells or reconnaissance commands."],"referencedReports":[],"body":"\u003cp\u003eCVE-2026-114938, also called Java4Shell, is a critical heap memory-corruption flaw in OpenJDK’s hardware-accelerated Base64 decoder that was publicly disclosed on November 17, 2026. The issue can be reached when applications decode attacker-controlled Base64 data, and researchers demonstrated pre-authentication remote code execution in default deployments of Keycloak, Jira, Confluence, Artifactory, Jenkins, and PingFederate. The article also reports post-authentication remote code execution in products including Apache Kafka Broker, Solr, Elasticsearch, Gerrit, and Netflix Spinnaker, plus a client-side TLS attack affecting Java clients connecting to malicious servers.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs in an optimized x86-64 decoding routine used by the HotSpot C2 compiler on CPUs supporting AVX-512 VBMI, where malformed Base64 padding can cause a 62-byte write outside the intended heap memory area. It affects OpenJDK 17.0.6 and later and specified Oracle Java SE, Oracle GraalVM, and downstream OpenJDK builds, while ARM64 and older x86-64 processors without the required instruction support are not affected. Organizations are advised to install patched JDK releases and restart JVMs; where updates are delayed, they can temporarily disable the affected path with \u003ccode\u003e-XX:-UseBASE64Intrinsics\u003c/code\u003e.\u003c/p\u003e\n"},{"n":2,"title":"NGINX ( HTTP/2 ) – Critical Remote Code Execution Vulnerability (CVE-2026-123007)","source":"netspi.com","sourceColorIdx":5,"link":"https://www.netspi.com/blog/executive-blog/critical-vulnerability/nginx-http-2-critical-remote-code-execution-vulnerability-cve-2026-123007/","time":"00:29","priority":"MUST READ","score":94,"tldr":"F5 disclosed CVE-2026-123007, a critical unauthenticated HTTP/2 flaw in nginx that can enable remote code execution on affected servers with HTTP/2 enabled. Upgrade to nginx 1.31.9 or 1.30.7 (or the applicable fixed NGINX Plus release) immediately, or disable HTTP/2 until patching is complete.","briefOverview":"\u003cp\u003eF5 disclosed CVE-2026-123007, a critical vulnerability in nginx’s HTTP/2 implementation that can allow an unauthenticated remote attacker to read and overwrite memory in an nginx worker process and potentially achieve remote code execution. The flaw affects nginx Open Source 1.9.5 through 1.30.6 and 1.31.0 through 1.31.8, along with several NGINX Plus releases, where HTTP/2 is enabled. HTTP/1.1-only servers are not affected through this path. Researchers have confirmed working unauthenticated remote code execution against affected builds, although no exploitation in the wild had been reported at the time of the notice.\u003c/p\u003e\n\n\u003cp\u003eThe issue is an integer underflow in HTTP/2 flow-control accounting that can result in out-of-bounds memory reads and writes when queued data frames are handled after a stream ends. Possible consequences include worker-process crashes, disclosure of memory contents such as heap and library addresses, and potential access to data or backend systems reachable from nginx. F5 fixed the issue in nginx Open Source 1.31.9 and 1.30.7, plus NGINX Plus 37.3.0.1 and 37.0.8.1, and organizations are advised to update and restart nginx or perform a supported live binary upgrade. If patching is delayed, disabling HTTP/2 mitigates this flaw, but it does not address several other vulnerabilities fixed in the same release.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5 disclosed CVE-2026-123007, a critical integer-underflow flaw in nginx HTTP/2 flow-control accounting that can allow unauthenticated remote code execution.","The issue affects nginx Open Source 1.9.5 through 1.30.6 and 1.31.0 through 1.31.8, plus specified NGINX Plus releases, only when HTTP/2 is enabled.","F5 fixed the flaw in nginx Open Source 1.31.9 and 1.30.7 and in NGINX Plus 37.3.0.1 and 37.0.8.1.","Organizations should identify nginx deployments, verify whether HTTP/2 is enabled, apply the relevant update, and restart nginx or perform a supported live binary upgrade.","If patching must be delayed, the article recommends disabling HTTP/2 by removing the HTTP/2 setting from affected nginx server configuration."],"insights":["A reported nginx version alone may not establish exposure because Linux distribution packages can include a backported fix without changing the displayed nginx version, so installed package versions should be checked against distribution security advisories.","A configuration reload does not replace the running nginx executable, and existing HTTP/2 connections can remain on old worker processes; a restart or supported live binary upgrade is required after updating.","The vulnerable HTTP/2 code has been present since nginx 1.9.5 in 2015, making long-lived deployments and bundled nginx installations relevant to the review.","Although researchers confirmed working unauthenticated remote code execution, the article notes that an exploit may require substantial HTTP/2 traffic on one connection and may be less reliable over slow networks or proxied HTTP/2 connections.","Disabling HTTP/2 mitigates CVE-2026-123007 but does not address the additional high-severity flaws fixed in the same release."],"referencedReports":[{"title":"nginx Security Advisories","url":"http://nginx.org/en/security_advisories.html","publisher":"nginx","context":"The article links to nginx's security-advisory page as an additional resource for the disclosed nginx vulnerabilities.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 disclosed CVE-2026-123007, a critical vulnerability in nginx’s HTTP/2 implementation that can allow an unauthenticated remote attacker to read and overwrite memory in an nginx worker process and potentially achieve remote code execution. The flaw affects nginx Open Source 1.9.5 through 1.30.6 and 1.31.0 through 1.31.8, along with several NGINX Plus releases, where HTTP/2 is enabled. HTTP/1.1-only servers are not affected through this path. Researchers have confirmed working unauthenticated remote code execution against affected builds, although no exploitation in the wild had been reported at the time of the notice.\u003c/p\u003e\n\n\u003cp\u003eThe issue is an integer underflow in HTTP/2 flow-control accounting that can result in out-of-bounds memory reads and writes when queued data frames are handled after a stream ends. Possible consequences include worker-process crashes, disclosure of memory contents such as heap and library addresses, and potential access to data or backend systems reachable from nginx. F5 fixed the issue in nginx Open Source 1.31.9 and 1.30.7, plus NGINX Plus 37.3.0.1 and 37.0.8.1, and organizations are advised to update and restart nginx or perform a supported live binary upgrade. If patching is delayed, disabling HTTP/2 mitigates this flaw, but it does not address several other vulnerabilities fixed in the same release.\u003c/p\u003e\n"},{"n":3,"title":"NGINX2Root (CVE-2026-123007): Frequently asked questions about five critical NGINX vulnerabilities","source":"tenable.com","sourceColorIdx":5,"link":"https://www.tenable.com/blog/nginx2root-cve-2026-123007-frequently-asked-questions-about-five-critical-nginx","time":"00:18","priority":"MUST READ","score":93,"tldr":"F5 released out-of-band fixes for ten NGINX flaws, including five critical NGINX2Root RCE vulnerabilities; organizations should urgently upgrade to NGINX Open Source 1.30.7/1.31.9 or the applicable NGINX Plus fixed release and restart NGINX. CVE-2026-123007 is the highest priority because HTTP/2 over TLS alone exposes servers and a public PoC is available.","briefOverview":"\u003cp\u003eF5 issued an out-of-band security release on November 18, 2026, fixing ten NGINX vulnerabilities in NGINX Open Source and NGINX Plus. Five of these critical flaws are collectively called NGINX2Root by Xint and can enable remote code execution in NGINX HTTP/2, HTTP/3, the resolver, and the mail proxy module. The article identifies CVE-2026-123007 as the most urgent because HTTP/2 over TLS is its only stated requirement, and it has a public proof of concept.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-123007 has existed since HTTP/2 support was introduced in NGINX 1.9.5, and Wiz confirmed code execution against an instance serving only static content. Rapid7’s public exploit is described as constrained: it depends on x86-64-specific glibc behavior, approximately 128 GB of HTTP/2 traffic, recovery of heap addresses to overcome address randomization, and execution in an NGINX worker process. Organizations should upgrade NGINX Open Source to 1.30.7 or 1.31.9, or move NGINX Plus to the applicable fixed 37.x release, then restart NGINX because a configuration reload does not replace the running executable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["F5’s November 18 out-of-band release fixed ten NGINX vulnerabilities, including five critical remote-code-execution flaws referred to by Xint as NGINX2Root.","CVE-2026-123007 is an unauthenticated NGINX HTTP/2 remote-code-execution flaw that requires HTTP/2 over TLS and has a public proof of concept.","The five NGINX2Root flaws affect NGINX HTTP/2, HTTP/3, the resolver, and the mail proxy module, depending on whether the relevant feature is enabled.","NGINX Open Source users should upgrade to 1.30.7 or 1.31.9, while NGINX Plus users should move to fixed 37.x releases because R33–R36 have no patch.","The article states that there were no reports of these NGINX CVEs being exploited as zero-days or by threat actors as of November 18."],"insights":["CVE-2026-123007 can be exploited against an NGINX server serving only static content, so no application logic or extra NGINX modules are required when HTTP/2 is enabled.","A configuration reload after upgrading does not replace the running NGINX executable, so NGINX must be restarted for the fixes to take effect.","Disabling HTTP/2 only addresses the two HTTP/2 flaws and does not mitigate the resolver, HTTP/3, or mail-proxy NGINX2Root vulnerabilities.","The public CVE-2026-123007 exploit is constrained by x86-64-specific glibc behavior, the need to send roughly 128 GB of HTTP/2 traffic, and the need to recover heap addresses to bypass address randomization.","Xint reported that an unpatched Linux kernel SCTP flaw can be chained with the NGINX bugs to gain root access, including escape from Docker containers to the host kernel."],"referencedReports":[{"title":"F5 out-of-band security notification K000164058","url":"https://my.f5.com/manage/s/article/K000164058","publisher":"f5","context":"The article cites F5’s out-of-band security notification as the release that fixed the ten NGINX vulnerabilities.","category":"advisory","primary":true},{"title":"nginx2root","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"xint","context":"The article relies on Xint’s NGINX2Root research for details on the five NGINX flaws and the separate Linux kernel SCTP issue.","category":"research","primary":true},{"title":"NGINX HTTP/2 RCE vulnerabilities","url":"https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities","publisher":"wiz","context":"The article cites Wiz as confirming code execution against an NGINX instance serving static content and as confirming working exploits exist.","category":"research","primary":false},{"title":"CVE-2026-123007 critical NGINX HTTP/2 integer underflow leads to RCE fixed","url":"https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","publisher":"rapid7","context":"The article references Rapid7’s technical analysis of CVE-2026-123007 and its discussion of the public exploit’s constraints.","category":"research","primary":false},{"title":"NGINX2root FAQ","url":"https://watchtowr.com/intelligence/nginx-nginx2root-cve-2026-123633-faq/","publisher":"watchtowr","context":"The article lists watchTowr’s FAQ as further information about NGINX2Root and CVE-2026-123633.","category":"guide","primary":false},{"title":"NGINX security advisories","url":"https://nginx.org/en/security_advisories.html","publisher":"nginx","context":"The article links to NGINX security advisories as additional information on the disclosed flaws.","category":"advisory","primary":false}],"body":"\u003cp\u003eF5 issued an out-of-band security release on November 18, 2026, fixing ten NGINX vulnerabilities in NGINX Open Source and NGINX Plus. Five of these critical flaws are collectively called NGINX2Root by Xint and can enable remote code execution in NGINX HTTP/2, HTTP/3, the resolver, and the mail proxy module. The article identifies CVE-2026-123007 as the most urgent because HTTP/2 over TLS is its only stated requirement, and it has a public proof of concept.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-123007 has existed since HTTP/2 support was introduced in NGINX 1.9.5, and Wiz confirmed code execution against an instance serving only static content. Rapid7’s public exploit is described as constrained: it depends on x86-64-specific glibc behavior, approximately 128 GB of HTTP/2 traffic, recovery of heap addresses to overcome address randomization, and execution in an NGINX worker process. Organizations should upgrade NGINX Open Source to 1.30.7 or 1.31.9, or move NGINX Plus to the applicable fixed 37.x release, then restart NGINX because a configuration reload does not replace the running executable.\u003c/p\u003e\n"},{"n":5,"title":"Attackers Exploit Optimizely Flaw To Inject Malicious JavaScript","source":"zscaler.com","sourceColorIdx":5,"link":"https://www.zscaler.com/blogs/security-research/attackers-exploit-optimizely-flaw-inject-malicious-javascript","time":"00:45","priority":"MUST READ","score":92,"tldr":"Attackers exploited Optimizely Web Experimentation’s signup flow to inject malicious JavaScript into customer snippets, potentially exposing visitors to cryptocurrency wallet replacement, payment-card skimming, cookie theft, screenshots, and iOS exploit delivery. Organizations should audit Optimizely Project JavaScript and access logs, rotate credentials and tokens, and strengthen CSP and third-party script monitoring.","briefOverview":"\u003cp\u003eOn November 16, 2026, an attacker exploited a weakness in Optimizely Web Experimentation’s account signup flow to alter the Project JavaScript field in customer projects. Because this field runs custom code on pages that load an Optimizely snippet, the attacker’s JavaScript was delivered to website visitors through legitimate Optimizely delivery paths, including its CDN. Optimizely said it blocked the vulnerable path, fixed the issue, removed injected code, ended active sessions, revoked tokens, reset affected account access, and notified customers.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz identified more than 450 unique domains and over 3,000 URLs serving the malicious script across industries including banking, e-commerce, travel, retail, media, and telecommunications. The injected loader commonly retrieved a second-stage payload, track.js, from attacker-controlled infrastructure, where it could replace cryptocurrency wallet addresses, collect JavaScript-accessible cookies, capture screenshots, and monitor payment-card data entered directly on compromised pages. The payload also attempted to load iOS- and iPadOS-focused exploit components for some iPhone and iPad visitors, while most of its activity remained limited to the browser context of the compromised website.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On November 16, 2026, an attacker exploited a weakness in Optimizely Web Experimentation’s account signup flow to gain unauthorized ability to alter the Project JavaScript field in customer projects.","The injected code was delivered through legitimate Optimizely snippets and loaded a second-stage script, track.js, from attacker-controlled infrastructure including 1688360[.]cc.","ThreatLabz identified more than 450 unique domains and more than 3,000 URLs serving the malicious script across sectors including banking, e-commerce, travel, media, retail, and telecommunications.","The payload could replace cryptocurrency wallet addresses, collect JavaScript-accessible cookies, capture screenshots, and later versions monitored payment-card data entered on compromised pages.","Optimizely said it blocked the vulnerable path, deployed a fix, removed injected code, ended active sessions, revoked tokens, reset access for affected accounts, and notified impacted customers."],"insights":["The cookie theft and screenshot behavior was conditional: the payload performed it only after replacing a valid cryptocurrency wallet address when the related page element was visible.","The payment-card skimmer could monitor card data entered directly into compromised pages, but it could not read details entered within secure cross-origin payment frames such as hosted Stripe or Adyen fields.","Most of the payload’s activity was limited to the affected website’s browser page and could not directly access unrelated tabs, other websites’ cookies, local files, or browser-wide activity.","The iPhone and iPad branch represented a potentially broader risk because a successful iOS or WebKit exploit could exceed the normal restrictions placed on website code.","Because malicious code was served through legitimate Optimizely snippets and its CDN, affected websites may already have trusted and allowed the delivery path used by the attacker."],"referencedReports":[],"body":"\u003cp\u003eOn November 16, 2026, an attacker exploited a weakness in Optimizely Web Experimentation’s account signup flow to alter the Project JavaScript field in customer projects. Because this field runs custom code on pages that load an Optimizely snippet, the attacker’s JavaScript was delivered to website visitors through legitimate Optimizely delivery paths, including its CDN. Optimizely said it blocked the vulnerable path, fixed the issue, removed injected code, ended active sessions, revoked tokens, reset affected account access, and notified customers.\u003c/p\u003e\n\n\u003cp\u003eThreatLabz identified more than 450 unique domains and over 3,000 URLs serving the malicious script across industries including banking, e-commerce, travel, retail, media, and telecommunications. The injected loader commonly retrieved a second-stage payload, track.js, from attacker-controlled infrastructure, where it could replace cryptocurrency wallet addresses, collect JavaScript-accessible cookies, capture screenshots, and monitor payment-card data entered directly on compromised pages. The payload also attempted to load iOS- and iPadOS-focused exploit components for some iPhone and iPad visitors, while most of its activity remained limited to the browser context of the compromised website.\u003c/p\u003e\n"},{"n":4,"title":"nginx2root: A simple test for the HTTP/2 flaw and three use-after-free reproductions","source":"censys.com","sourceColorIdx":5,"link":"https://censys.com/blog/nginx2root-a-simple-test-for-the-http-2-flaw-and-three-use-after-free-reproductions/","time":"23:18","priority":"SHOULD READ","score":89,"tldr":"Censys confirmed several nginx2root memory-safety flaws in lab testing, including an HTTP/2 flow-control issue and three use-after-free conditions, though it did not reproduce RCE. Organizations should promptly upgrade nginx to 1.30.7+ or 1.31.9+ (or the corresponding NGINX Plus releases), as disabling HTTP/2 mitigates only some affected paths.","briefOverview":"\u003cp\u003eCensys ARC tested the five disclosed nginx2root vulnerabilities in isolated labs and confirmed an HTTP/2 flow-control accounting error in vulnerable nginx 1.31.8. Its compact cleartext HTTP/2 test produced different results on vulnerable 1.31.8 and patched 1.31.9, with the patched version rejecting the sequence. Censys also reproduced use-after-free memory conditions for CVE-2026-123633, CVE-2026-123634, and CVE-2026-113425, but did not reproduce CVE-2026-121810 or achieve remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities require particular nginx configurations, including HTTP/2, HTTP/3 upstream proxying, runtime DNS resolution with subrequests, or mail proxy authentication. Disabling HTTP/2 addresses only two of the five CVEs, so the article recommends upgrading nginx Open Source to 1.30.7 or later or 1.31.9 or later, updating NGINX Plus to 37.0.8.1 or 37.3.0.1, and fully restarting the service. Network detection is limited because the relevant HTTP/2 control frames are hidden by TLS encryption, and the article advises combining any network indicators with server logs, package versions, and active configuration details.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Censys tested five nginx2root vulnerabilities in isolated labs and confirmed an HTTP/2 flow-control accounting error in nginx 1.31.8 that nginx 1.31.9 rejected.","Researchers reproduced use-after-free conditions for CVE-2026-123633, CVE-2026-123634, and CVE-2026-113425, but did not reproduce CVE-2026-121810.","The CVEs require different nginx configurations, including HTTP/2, HTTP/3 upstream proxying, runtime DNS resolution with subrequests, or mail proxy authentication.","Organizations should upgrade nginx Open Source to 1.30.7 or later or 1.31.9 or later, or update NGINX Plus to 37.0.8.1 or 37.3.0.1, and fully restart the service afterward.","Disabling HTTP/2 addresses only two of the five CVEs, and Censys reported no known in-the-wild exploitation as of November 18, 2026."],"insights":["A 5.69 MB cleartext HTTP/2 test distinguished vulnerable nginx 1.31.8 from patched 1.31.9, offering a much smaller patch-validation option than the 60–119 GiB traffic volume reported for later Rapid7 exploit stages.","Network signatures require decrypted HTTP/2 telemetry or cleartext HTTP/2 because TLS hides the relevant control frames, while high traffic volume, resets, and worker disconnects alone are not specific indicators.","The tested Suricata rule fired once on the vulnerable capture and zero times on the patched comparison capture, but the article cautions that this validates only that traffic pair rather than making it a general exploit detector.","A configuration reload does not replace nginx binaries already running in memory, so organizations must fully restart nginx after applying updates.","Version checks alone cannot establish exposure because each CVE depends on specific enabled features such as proxying, runtime DNS resolution with subrequests, or mail proxy authentication."],"referencedReports":[{"title":"NGINX2Root: New Remote Code Execution Vulnerabilities in nginx Require Urgent Patching","url":"https://xint.io/blog/nginx2root-remote-code-execution","publisher":"xint","context":"The article cites Xint's disclosure of five nginx vulnerabilities and its claim that they can enable unauthenticated command execution.","category":"research","primary":true},{"title":"CVE-2026-123007: Critical nginx HTTP/2 Integer Underflow Leads to RCE (FIXED)","url":"https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/","publisher":"rapid7","context":"The article references Rapid7's report for the large traffic volume associated with later crash and remote-code-execution stages.","category":"research","primary":false}],"body":"\u003cp\u003eCensys ARC tested the five disclosed nginx2root vulnerabilities in isolated labs and confirmed an HTTP/2 flow-control accounting error in vulnerable nginx 1.31.8. Its compact cleartext HTTP/2 test produced different results on vulnerable 1.31.8 and patched 1.31.9, with the patched version rejecting the sequence. Censys also reproduced use-after-free memory conditions for CVE-2026-123633, CVE-2026-123634, and CVE-2026-113425, but did not reproduce CVE-2026-121810 or achieve remote code execution.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities require particular nginx configurations, including HTTP/2, HTTP/3 upstream proxying, runtime DNS resolution with subrequests, or mail proxy authentication. Disabling HTTP/2 addresses only two of the five CVEs, so the article recommends upgrading nginx Open Source to 1.30.7 or later or 1.31.9 or later, updating NGINX Plus to 37.0.8.1 or 37.3.0.1, and fully restarting the service. Network detection is limited because the relevant HTTP/2 control frames are hidden by TLS encryption, and the article advises combining any network indicators with server logs, package versions, and active configuration details.\u003c/p\u003e\n"},{"n":1,"title":"Ukraine, FBI arrest ransomware gang members tied to $40M in ransoms","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ukraine-fbi-arrest-ransomware-gang-members-tied-to-40m-in-ransoms/","time":"23:08","priority":"SHOULD READ","score":84,"tldr":"Ukrainian police and the FBI arrested four suspected members of a multinational ransomware network linked to more than $40.5 million in payments from at least 28 victims. The group allegedly used AI-generated IT-support calls, phishing pages, and remote-access tools to steal data, encrypt systems, and extort companies worldwide.","briefOverview":"\u003cp\u003eUkrainian authorities, working with the FBI, arrested four suspected key members of an international ransomware organization connected to more than $40.5 million in payments from at least 28 companies. Investigators said the wider organization included at least 27 people from Ukraine, Kazakhstan, Russia, and other countries, and was linked to a network of more than 60 members across eight jurisdictions. The group targeted organizations in sectors including oil and gas, pharmaceuticals, manufacturing, logistics, finance, and critical infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe suspects allegedly researched victims before stealing company data, locking access to systems, and demanding cryptocurrency in exchange for restoring access and withholding stolen information. To enter corporate networks, they allegedly impersonated IT-support staff through fraudulent calls using AI-generated voices, phishing pages resembling company VPN services, spoofed phone numbers, and remote-access software including TeamViewer and AnyDesk. Ukrainian authorities conducted 66 searches across Kyiv and 11 other regions, seized devices, bank cards, nearly $370,000 in cash and €20,000, and said the detained suspects could face up to 15 years in prison if convicted.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ukrainian authorities and the FBI arrested four suspected key members of an international ransomware organization linked to more than $40.5 million in ransom payments from at least 28 companies.","Investigators said the organization included at least 27 people from Ukraine, Kazakhstan, Russia, and other countries and was connected to a larger network of more than 60 members across eight jurisdictions.","The group allegedly posed as IT support personnel, using AI-generated voice messages, phishing pages, spoofed phone numbers, and remote-access tools such as TeamViewer and AnyDesk to obtain access to corporate networks.","Ukrainian court records identify Warren Oil Company, Maxxis International-USA, Newpark Resources, and Quantum Health as victims, with Warren Oil allegedly paying 84.5 BTC, approximately $5 million at the time, after an August 2024 attack.","Authorities conducted 66 searches in Kyiv and 11 other Ukrainian regions, seized devices, bank cards, nearly $370,000 in cash and €20,000, and said the detained suspects could face up to 15 years in prison if convicted."],"insights":["The group reportedly combined AI-generated support calls with a second attacker working in parallel, keeping an employee on the phone until the attackers confirmed they had entered the company’s systems.","Investigators said the criminals researched a target’s finances, assets, employees, and technology weaknesses before attacking, indicating that ransom demands were informed by the victim’s perceived ability to pay.","The alleged Warren Oil intrusion shows that obtaining both a worker’s login details and a two-factor authentication code was enough to enable remote access to the corporate network.","Although the network was linked to former Conti members and one victim was claimed by BlackSuit, Ukrainian authorities did not confirm that the four arrested people belonged to Conti, BlackSuit, or Chaos.","The group’s alleged use of stolen-data publication threats alongside system lockouts put victims under two separate forms of pressure to pay."],"referencedReports":[],"body":"\u003cp\u003eUkrainian authorities, working with the FBI, arrested four suspected key members of an international ransomware organization connected to more than $40.5 million in payments from at least 28 companies. Investigators said the wider organization included at least 27 people from Ukraine, Kazakhstan, Russia, and other countries, and was linked to a network of more than 60 members across eight jurisdictions. The group targeted organizations in sectors including oil and gas, pharmaceuticals, manufacturing, logistics, finance, and critical infrastructure.\u003c/p\u003e\n\n\u003cp\u003eThe suspects allegedly researched victims before stealing company data, locking access to systems, and demanding cryptocurrency in exchange for restoring access and withholding stolen information. To enter corporate networks, they allegedly impersonated IT-support staff through fraudulent calls using AI-generated voices, phishing pages resembling company VPN services, spoofed phone numbers, and remote-access software including TeamViewer and AnyDesk. Ukrainian authorities conducted 66 searches across Kyiv and 11 other regions, seized devices, bank cards, nearly $370,000 in cash and €20,000, and said the detained suspects could face up to 15 years in prison if convicted.\u003c/p\u003e\n"}]</script>
