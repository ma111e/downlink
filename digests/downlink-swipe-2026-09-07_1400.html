<script type="application/json" id="dl-articles">[{"n":1,"title":"Magento StyleSmuggler zero-day exploited to deploy Linux backdoor","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/magento-stylesmuggler-zero-day-exploited-to-deploy-linux-backdoor/","time":"16:50","priority":"MUST READ","score":96,"tldr":"A zero-day vulnerability dubbed StyleSmuggler is being actively exploited in Magento and Adobe Commerce sites to install a stealthy Linux backdoor with cron-based persistence. Adobe has not yet released a fix, and admins are advised to disable GraphQL, watch for failed-payment reminder emails and suspicious kworker or fc-cache processes, and rotate credentials if compromise is suspected.","briefOverview":"\u003cp\u003eA zero-day vulnerability dubbed “StyleSmuggler” affects all versions of Magento and Adobe Commerce and is being exploited to deploy a backdoor. Sansec recorded the first exploitation incident on September 4 against a target running the latest security updates. Adobe Enterprise Support confirmed it is working on a fix but did not provide a release timeline.\u003c/p\u003e\n\n\u003cp\u003eMagento is an Adobe open-source e-commerce platform installed on more than 160,000 websites, including 14,000 of the top 1 million sites. The exploit observed by Sansec abuses Magento’s template system through PHP code injection to generate a fake “failed-payment” email, which triggers code execution. Successful exploitation installs a small Rust-based backdoor as a background process on Linux.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor has been disguised as [kworker/u:8:0], while newer versions disguise the process as fc-cache and copy it to ~/.cache/fontconfig/fc-cache. Sansec says the attacker also adds a cron job that repeats every 30 minutes for persistence, and newer samples disguise communications as Network Time Protocol traffic over UDP port 123. Until fixes are available, Sansec recommends disabling GraphQL, monitoring for suspicious emails, processes, cron entries, and temporary files, and rotating Magento credentials if compromise is suspected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A zero-day vulnerability dubbed “StyleSmuggler” affects all versions of Magento and Adobe Commerce and is being exploited to deploy a backdoor.","Sansec observed the first exploitation incident on September 4 against a target running the latest security updates.","The exploit abuses Magento’s template system through PHP code injection to generate a fake “failed-payment” email, which triggers code execution.","Successful exploitation installs a small Rust-based Linux backdoor that is disguised as processes such as kworker/u:8:0 or fc-cache and is made persistent with a cron job running every 30 minutes.","Adobe Enterprise Support confirmed it is working on a fix, but no patch had been released at the time of writing, and Sansec recommends disabling GraphQL as a mitigation."],"insights":["An unexpected surge of Magento “Payment Transaction Failed Reminder” emails is a practical warning sign of possible exploitation because the exploit generates a fake failed-payment email to trigger code execution.","The backdoor’s newer versions disguise their network traffic as NTP by sending UDP packets to port 123 and using time-sync-like hostnames, which may help the traffic pass through firewalls unnoticed.","The malware checks Linux’s TracerPid value and, if tracing is active, still installs but does not beacon, meaning analysis or monitoring activity can change its visible behavior.","Newer backdoor samples disguise themselves as fc-cache and copy themselves to ~/.cache/fontconfig/fc-cache, giving defenders a specific process name and file path to inspect.","Sansec recommends rotating Magento credentials if compromise is suspected, indicating that cleanup should include credential changes in addition to searching for the backdoor and cron entries."],"referencedReports":[{"title":"StyleSmuggler 0day","url":"https://sansec.io/research/stylesmuggler-0day","publisher":"Sansec","context":"The article cites Sansec’s research for indicators of exploitation and recommended monitoring steps for the Magento StyleSmuggler zero-day.","category":"research","primary":true}],"body":"\u003cp\u003eA zero-day vulnerability dubbed “StyleSmuggler” affects all versions of Magento and Adobe Commerce and is being exploited to deploy a backdoor. Sansec recorded the first exploitation incident on September 4 against a target running the latest security updates. Adobe Enterprise Support confirmed it is working on a fix but did not provide a release timeline.\u003c/p\u003e\n\n\u003cp\u003eMagento is an Adobe open-source e-commerce platform installed on more than 160,000 websites, including 14,000 of the top 1 million sites. The exploit observed by Sansec abuses Magento’s template system through PHP code injection to generate a fake “failed-payment” email, which triggers code execution. Successful exploitation installs a small Rust-based backdoor as a background process on Linux.\u003c/p\u003e\n\n\u003cp\u003eThe backdoor has been disguised as [kworker/u:8:0], while newer versions disguise the process as fc-cache and copy it to ~/.cache/fontconfig/fc-cache. Sansec says the attacker also adds a cron job that repeats every 30 minutes for persistence, and newer samples disguise communications as Network Time Protocol traffic over UDP port 123. Until fixes are available, Sansec recommends disabling GraphQL, monitoring for suspicious emails, processes, cron entries, and temporary files, and rotating Magento credentials if compromise is suspected.\u003c/p\u003e\n"},{"n":4,"title":"Fake IT Calls Target Executives in Microsoft 365 Data Theft and Extortion Attacks","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/microsoft-365-attackers-use-help-desk.html","time":"15:51","priority":"MUST READ","score":92,"tldr":"A threat cluster tracked as PREY-0058 is using fake IT help desk calls and adversary-in-the-middle Microsoft 365 login pages to steal executive session tokens, access SaaS data, and extort victims. Organizations should prioritize phishing-resistant MFA, Conditional Access, and monitoring for residential-proxy token replay and bulk SharePoint/Exchange access.","briefOverview":"\u003cp\u003eThreat hunters disclosed details of a widespread data theft and extortion threat cluster targeting Microsoft 365 and other SaaS offerings. Arctic Wolf tracks the activity as PREY-0058 and said it shares significant tradecraft similarities with UNC6671. The activity mainly targets directors, vice presidents, and other executive staff, with targets primarily in the United States across sectors including construction and engineering, healthcare and pharmaceuticals, real estate and property management, finance, and professional services.\u003c/p\u003e\n\n\u003cp\u003eThe attack chains begin with threat actors impersonating internal IT or help desk personnel in phone calls and directing targets to authentication-themed URLs. These pages lead to operator-controlled Microsoft 365 login flows designed to harvest credentials, MFA approvals, and authenticated session tokens. The captured tokens are then used in session replay attacks from proxy infrastructure such as NodeMaven and from IP addresses matching the victim’s geography and ASN.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the threat actors perform discovery against SharePoint and Entra ID, then collect and exfiltrate data from SharePoint, OneDrive, Exchange, and Box before sending extortion demands. Arctic Wolf noted that PREY-0058 does not involve endpoint malware deployment or network-based lateral movement. The article says defenders can disrupt the activity by detecting anomalous residential-proxy token replay, SharePoint discovery and bulk access, mailbox harvesting, and newly registered authentication-themed lure infrastructure.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arctic Wolf is tracking a widespread data theft and extortion threat cluster as PREY-0058, which targets Microsoft 365 and other SaaS offerings through IT help desk vishing, adversary-in-the-middle token theft, and residential-proxy sign-ins.","The activity mainly targets directors, vice presidents, and other executive staff, with victims primarily in the United States across construction and engineering, healthcare and pharmaceuticals, real estate and property management, finance, and professional services.","Attackers impersonate internal IT or help desk personnel in phone calls and direct targets to authentication-themed URLs that lead to operator-controlled Microsoft 365 login flows designed to steal credentials, MFA approvals, and authenticated session tokens.","After gaining access, the threat actors perform discovery in SharePoint and Entra ID, then collect and exfiltrate data from SharePoint, OneDrive, Exchange, and Box before sending extortion demands.","Arctic Wolf reported that PREY-0058 activity has not involved endpoint malware deployment or network-based lateral movement, and it recommended Conditional Access policies, phishing-resistant MFA, SharePoint access restrictions, and vishing awareness training."],"insights":["The threat activity does not rely on endpoint malware or network lateral movement, so detection efforts need to focus on cloud account behavior such as token replay, SharePoint discovery, bulk access, and mailbox harvesting.","The attackers use residential proxy infrastructure and IP addresses matching the victim’s geography and ASN, which can make suspicious sign-ins appear more legitimate if defenders only check for unusual locations.","The lure infrastructure is broad and tailored, with hundreds of subdomains impersonating real companies and authentication-themed domains such as passkey and MFA registration sites.","The article emphasizes that names such as PREY-0058, UNC6671, Cinder, and Pink may describe overlapping affiliates or infrastructure rather than a single confirmed actor identity."],"referencedReports":[{"title":"202609-cloud-data-theft-extortion-vishing-proxies","url":"https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202609-cloud-data-theft-extortion-vishing-proxies","publisher":"Arctic Wolf","context":"The article cites this Arctic Wolf material as the source tracking the Microsoft 365 and SaaS data theft and extortion activity as PREY-0058.","category":"research","primary":true}],"body":"\u003cp\u003eThreat hunters disclosed details of a widespread data theft and extortion threat cluster targeting Microsoft 365 and other SaaS offerings. Arctic Wolf tracks the activity as PREY-0058 and said it shares significant tradecraft similarities with UNC6671. The activity mainly targets directors, vice presidents, and other executive staff, with targets primarily in the United States across sectors including construction and engineering, healthcare and pharmaceuticals, real estate and property management, finance, and professional services.\u003c/p\u003e\n\n\u003cp\u003eThe attack chains begin with threat actors impersonating internal IT or help desk personnel in phone calls and directing targets to authentication-themed URLs. These pages lead to operator-controlled Microsoft 365 login flows designed to harvest credentials, MFA approvals, and authenticated session tokens. The captured tokens are then used in session replay attacks from proxy infrastructure such as NodeMaven and from IP addresses matching the victim’s geography and ASN.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining access, the threat actors perform discovery against SharePoint and Entra ID, then collect and exfiltrate data from SharePoint, OneDrive, Exchange, and Box before sending extortion demands. Arctic Wolf noted that PREY-0058 does not involve endpoint malware deployment or network-based lateral movement. The article says defenders can disrupt the activity by detecting anomalous residential-proxy token replay, SharePoint discovery and bulk access, mailbox harvesting, and newly registered authentication-themed lure infrastructure.\u003c/p\u003e\n"},{"n":2,"title":"BigBear Microsoft 365 phishing service bypassed MFA at 258 organizations","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/bigbear-microsoft-365-phishing-service-bypassed-mfa-at-258-organizations/","time":"15:39","priority":"SHOULD READ","score":86,"tldr":"BigBear 2.0, an Evilginx2-based phishing-as-a-service platform, bypassed Microsoft 365 MFA at 258 organizations by stealing passwords and authenticated session cookies. Defenders should revoke sessions, reset exposed credentials, and enforce phishing-resistant authentication such as FIDO2/WebAuthn with managed-device conditional access.","briefOverview":"\u003cp\u003eA phishing-as-a-service framework called BigBear 2.0 has been used to bypass multi-factor authentication at 258 organizations and steal more than 5,000 Microsoft 365 credentials. CloudSEK researchers gained administrator access to the control panel and found 42 VPS nodes configured to target Microsoft 365. The operation affected victims across more than 40 countries and was still active at the time of CloudSEK’s writing.\u003c/p\u003e\n\n\u003cp\u003eAccording to CloudSEK, BigBear uses an Evilginx2-based adversary-in-the-middle framework to intercept passwords and authenticated session cookies after victims complete MFA. The service uses a configuration called “offy” to place a proxy between the victim and Microsoft’s legitimate authentication infrastructure. CloudSEK reported 5,137 credential records, including 474 complete MFA-bypassed authentications, 1,032 plaintext passwords, and 4,148 session cookies.\u003c/p\u003e\n\n\u003cp\u003eThe article says BigBear also uses custom JavaScript to interfere with FIDO2/WebAuthn authentication and geo-matched residential proxies for 69 countries to reduce suspicious signals during Microsoft authentication. Compromising a Microsoft 365 session can expose email and files and may provide access to other applications connected through single sign-on. CloudSEK notified law enforcement and several affected organizations, and potentially affected organizations were advised to reset exposed passwords, revoke active sessions, refresh tokens, and force re-authentication for high-privileged accounts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A phishing-as-a-service framework called BigBear 2.0 has been used to bypass multi-factor authentication at 258 organizations and steal more than 5,000 Microsoft 365 credentials.","CloudSEK researchers gained administrator access to the BigBear control panel and found 42 VPS nodes configured to target Microsoft 365 in the observed operation.","BigBear uses an Evilginx2-based adversary-in-the-middle framework to intercept passwords and authenticated session cookies, allowing attackers to hijack accounts after victims complete MFA.","CloudSEK reported that the panel exfiltrated 5,137 credential records, including 474 complete MFA-bypassed authentications, 1,032 plaintext passwords, and 4,148 session cookies affecting 3,331 unique victim IPs across more than 40 countries.","CloudSEK found that BigBear uses custom JavaScript to interfere with FIDO2/WebAuthn authentication and geo-matched residential proxies for 69 countries to reduce suspicious signals during Microsoft authentication."],"insights":["BigBear’s custom JavaScript specifically interferes with FIDO2/WebAuthn browser functionality, showing the campaign attempted to push victims away from stronger authentication methods toward weaker ones.","The use of geo-matched residential proxies across 69 countries means location-based trust signals alone are not sufficient, because the attackers tried to make sign-ins appear to come from the victim’s region.","CloudSEK’s finding that the panel served at least five affiliate operators through Telegram exfiltration bots indicates BigBear operated as a shared phishing service rather than a single-operator campaign.","The article recommends requiring managed devices through Conditional Access policies, which is more actionable than relying on geo-location signals that BigBear was designed to evade.","Although the administration panel remained online, the phishing infrastructure had been offline for nearly three weeks at the time of writing, creating a distinction between the service’s control layer and its active phishing delivery infrastructure."],"referencedReports":[{"title":"Tracking BigBear 2.0 Evilginx2 Phishing Campaign","url":"https://www.cloudsek.com/blog/tracking-bigbear-2-0-evilginx2-phishing-campaign","publisher":"CloudSEK","context":"The article cites CloudSEK’s report as the source of findings about BigBear 2.0’s credential theft, MFA bypasses, affected organizations, and infrastructure.","category":"research","primary":true}],"body":"\u003cp\u003eA phishing-as-a-service framework called BigBear 2.0 has been used to bypass multi-factor authentication at 258 organizations and steal more than 5,000 Microsoft 365 credentials. CloudSEK researchers gained administrator access to the control panel and found 42 VPS nodes configured to target Microsoft 365. The operation affected victims across more than 40 countries and was still active at the time of CloudSEK’s writing.\u003c/p\u003e\n\n\u003cp\u003eAccording to CloudSEK, BigBear uses an Evilginx2-based adversary-in-the-middle framework to intercept passwords and authenticated session cookies after victims complete MFA. The service uses a configuration called “offy” to place a proxy between the victim and Microsoft’s legitimate authentication infrastructure. CloudSEK reported 5,137 credential records, including 474 complete MFA-bypassed authentications, 1,032 plaintext passwords, and 4,148 session cookies.\u003c/p\u003e\n\n\u003cp\u003eThe article says BigBear also uses custom JavaScript to interfere with FIDO2/WebAuthn authentication and geo-matched residential proxies for 69 countries to reduce suspicious signals during Microsoft authentication. Compromising a Microsoft 365 session can expose email and files and may provide access to other applications connected through single sign-on. CloudSEK notified law enforcement and several affected organizations, and potentially affected organizations were advised to reset exposed passwords, revoke active sessions, refresh tokens, and force re-authentication for high-privileged accounts.\u003c/p\u003e\n"},{"n":3,"title":"⚡ Weekly Recap: Chrome 0-Day, Router Hijacks, Coder Supply Chain Attack and More","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/09/weekly-recap-chrome-0-day-router.html","time":"14:36","priority":"MAY READ","score":40,"tldr":"This week’s major security stories show attackers exploiting patched and unpatched weaknesses across browsers, routers, e-commerce platforms, and trusted software supply chains. The key takeaway is that patching remains urgent, but teams also need strong logging and monitoring because “fully patched” does not prove an environment was never compromised.","briefOverview":"\u003cp\u003eThis weekly recap covers several major security developments, including active attacks on Chrome, MikroTik routers, Magento and Adobe Commerce stores, and N-able N-central systems. N-able released hotfixes for severe N-central flaws that could allow authentication bypass and pre-authenticated remote code execution, while Huntress observed signs that attackers likely leveraged one or both authentication bypass flaws in a customer compromise. Google also patched an actively exploited Chrome zero-day, CVE-2026-85046, a type confusion bug in V8 that could allow arbitrary code execution inside the sandbox through a crafted HTML page.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights multiple cases where trusted or commonly used technologies became paths for compromise. CERT Polska warned that attackers are exploiting two MikroTik RouterOS zero-days in a chain called MikroTrick to take full control of devices without authentication when SSH remote access is supported. Sansec reported exploitation of an unpatched Magento and Adobe Commerce zero-day called StyleSmuggler to inject malicious code and deploy backdoors in online stores, while Coder said attackers compromised its Cloudflare infrastructure to serve malicious Terraform modules that stole credentials and secrets.\u003c/p\u003e\n\n\u003cp\u003eOther developments include RevStealer spreading through game-cheat lures and fake Claude Desktop repositories, new Microsoft 365 token theft attacks using the Knight Office phishing kit, and research showing SNMPv3 can leak useful information before login. The recap also describes phishing emails that build QR codes from text and markup so they still appear even when images are blocked. The conclusion emphasizes that patching remains important, but organizations also need enough logging to investigate because being fully patched does not prove that nobody got in.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able released hotfixes for severe N-central flaws, including CVE-2026-86218 with a CVSS score of 10.0, while Huntress reported signs that attackers likely leveraged CVE-2026-86206 or CVE-2026-86207 in a customer compromise.","Google patched 12 Chrome vulnerabilities, including the actively exploited CVE-2026-85046 type confusion flaw in V8 that could allow remote code execution inside the sandbox via a crafted HTML page.","CERT Polska warned that attackers are actively exploiting two MikroTik RouterOS zero-day flaws in a chain called MikroTrick to take full control of affected devices without authentication when SSH remote access is supported.","Sansec reported that attackers are exploiting an unpatched Magento and Adobe Commerce zero-day called StyleSmuggler to inject a backdoor into e-commerce storefronts.","Coder said attackers compromised its Cloudflare infrastructure and added unauthorized registry servers that delivered malicious Terraform modules designed to steal credentials and secrets."],"insights":["Blocking email images is not enough to stop QR phishing, because attackers can build a scannable QR code from text and markup that still appears when images are disabled.","N-able’s case shows that limited historical logging on an appliance can prevent investigators from confirming which flaw was used, even after a compromise is detected.","SNMPv3 deployments can still expose useful information before login, including vendor details, valid usernames, and likely encryption settings, even though the protocol is considered the secure standard for network management.","The Coder incident highlights that a trusted software source can become a credential-stealing channel when infrastructure used to serve registry content is compromised.","The article emphasizes that being fully patched only confirms fixes are installed and does not prove attackers did not already gain access."],"referencedReports":[{"title":"N-central 2026.3 Hotfix 4 — CVE-2026-86218","url":"https://status.n-able.com/2026/09/06/n-central-2026-3-hotfix-4-cve-2026-86218/","publisher":"N-able","context":"The article cites N-able’s hotfix advisory for a maximum-severity pre-authenticated remote code execution flaw in N-central.","category":"advisory","primary":true},{"title":"N-central 2026.3 Hotfix 3 — CVE-2026-86206 and CVE-2026-86207","url":"https://status.n-able.com/2026/09/05/n-central-2026-3-hotfix-3-cve-2026-86206-and-cve-86207/","publisher":"N-able","context":"The article cites N-able’s advisory for authentication bypass flaws in N-central.","category":"advisory","primary":true},{"title":"MikroTik RouterOS CVE advisory","url":"https://cert.pl/en/posts/2026/09/mikrotik-routeros-cve/","publisher":"CERT Polska","context":"The article references CERT Polska’s warning and technical details about the MikroTrick exploit chain affecting MikroTik RouterOS.","category":"advisory","primary":true},{"title":"Inside Knight Office M365 AiTM Attack","url":"https://www.huntress.com/blog/inside-knight-office-m365-aitm-attack","publisher":"Huntress","context":"The article cites Huntress’s analysis of the Knight Office Microsoft 365 phishing toolkit and token theft attacks.","category":"research","primary":false},{"title":"SNMPv3 Was Supposed to Be the Fix","url":"https://www.malanta.ai/blog-posts/snmpv3-was-supposed-to-be-the-fix","publisher":"Malanta","context":"The article references Malanta’s research showing that SNMPv3 can leak pre-authentication information across internet-exposed endpoints.","category":"research","primary":false},{"title":"GHSA-vx42-ghc9-gw65","url":"https://github.com/coder/coder/security/advisories/GHSA-vx42-ghc9-gw65","publisher":"Coder","context":"The article cites Coder’s security advisory about compromised Cloudflare infrastructure serving malicious Terraform modules.","category":"advisory","primary":true},{"title":"Exodus Crypto Wallet Installer RAT","url":"https://www.huntress.com/blog/exodus-crypto-wallet-installer-rat","publisher":"Huntress","context":"The article cites Huntress’s technical analysis of a tampered Exodus installer that delivers a modular remote access tool.","category":"research","primary":false},{"title":"Kaspersky warns of attackers using text symbols to form malicious QR codes","url":"https://www.kaspersky.co.za/about/press-releases/kaspersky-warns-of-attackers-using-text-symbols-to-form-malicious-qr-codes","publisher":"Kaspersky","context":"The article references Kaspersky’s report on phishing emails that render QR codes from text rather than images.","category":"research","primary":false},{"title":"Text Rendered QR Phishing in the PhishU Framework","url":"https://phishu.net/blogs/blog-text-rendered-qr-phishing-in-the-phishu-framework.html","publisher":"PhishU","context":"The article cites PhishU’s explanation of how text-rendered QR phishing avoids image-based scanning and image blocking.","category":"research","primary":false},{"title":"What Two Independent Datasets Reveal About Who’s Exploiting Your Perimeter","url":"https://www.sentinelone.com/blog/what-two-independent-datasets-reveal-about-whos-exploiting-your-perimeter/","publisher":"SentinelOne","context":"The article references a joint SentinelOne and Tenable analysis of attacker focus on exposed edge-device vendor ecosystems.","category":"research","primary":false},{"title":"SentinelOne and Tenable Find Cyber Attackers Routinely Target Edge Device Vendor Ecosystems Rather Than Individual Vulnerabilities","url":"https://www.sentinelone.com/press/sentinelone-and-tenable-find-cyber-attackers-routinely-target-edge-device-vendor-ecosystems-rather-than-individual-vulnerabilities/","publisher":"SentinelOne and Tenable","context":"The article links to the SentinelOne and Tenable announcement summarizing their joint findings on edge-device exploitation patterns.","category":"research","primary":false},{"title":"HTML Payload Hijacks Email Summarizer","url":"https://www.forcepoint.com/blog/x-labs/html-payload-hijacks-email-summarizer","publisher":"Forcepoint","context":"The article cites Forcepoint research showing that hidden instructions in email can manipulate an unguarded AI email summarizer.","category":"research","primary":false}],"body":"\u003cp\u003eThis weekly recap covers several major security developments, including active attacks on Chrome, MikroTik routers, Magento and Adobe Commerce stores, and N-able N-central systems. N-able released hotfixes for severe N-central flaws that could allow authentication bypass and pre-authenticated remote code execution, while Huntress observed signs that attackers likely leveraged one or both authentication bypass flaws in a customer compromise. Google also patched an actively exploited Chrome zero-day, CVE-2026-85046, a type confusion bug in V8 that could allow arbitrary code execution inside the sandbox through a crafted HTML page.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights multiple cases where trusted or commonly used technologies became paths for compromise. CERT Polska warned that attackers are exploiting two MikroTik RouterOS zero-days in a chain called MikroTrick to take full control of devices without authentication when SSH remote access is supported. Sansec reported exploitation of an unpatched Magento and Adobe Commerce zero-day called StyleSmuggler to inject malicious code and deploy backdoors in online stores, while Coder said attackers compromised its Cloudflare infrastructure to serve malicious Terraform modules that stole credentials and secrets.\u003c/p\u003e\n\n\u003cp\u003eOther developments include RevStealer spreading through game-cheat lures and fake Claude Desktop repositories, new Microsoft 365 token theft attacks using the Knight Office phishing kit, and research showing SNMPv3 can leak useful information before login. The recap also describes phishing emails that build QR codes from text and markup so they still appear even when images are blocked. The conclusion emphasizes that patching remains important, but organizations also need enough logging to investigate because being fully patched does not prove that nobody got in.\u003c/p\u003e\n"},{"n":5,"title":"7th September – Threat Intelligence Report","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/7th-september-threat-intelligence-report/","time":"14:54","priority":"MAY READ","score":40,"tldr":"This week’s threat intelligence highlights major breaches at Thomson Reuters, Baylor Genetics and Dropbox, alongside AI-assisted intrusions that are accelerating ransomware and exploit development. Critical exploited flaws in SonicWall SMA 1000 and JFrog Artifactory require urgent attention, while new campaigns from Chinese, Iranian and North Korean-linked actors continue to target government, crypto, fintech and job-seeker ecosystems.","briefOverview":"\u003cp\u003eCheck Point Research’s 7th September Threat Intelligence Report summarizes major attacks, breaches, AI-related threats, vulnerabilities, and threat intelligence findings from the week. It includes breaches affecting Thomson Reuters’ C-Track court case-management platform, Baylor Genetics, and Dropbox, as well as a cyberattack that disrupted Hit’s casinos and related services in Slovenia. The reported impacts include exposed court records and personal information, stolen medical and insurance data, unauthorized Dropbox file access, and temporary closures or service outages for casino and hotel operations.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights several AI-related security issues, including an AI-assisted ransomware intrusion that compromised an enterprise network in under 10 hours. Researchers also disclosed GitSpawn, a vulnerability class affecting AI coding agents where malicious repository Git configurations can trigger arbitrary code execution as the developer. Another cited case showed an AI coding assistant helping port a known PLC exploit to a different controller model, producing working payloads after guided analysis.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers critical vulnerabilities and active threat campaigns. SonicWall addressed CVE-2026-83548 and CVE-2026-83549 in SMA 1000 remote access gateways, while JFrog addressed CVE-2026-82329 in self-hosted Artifactory deployments after exploitation was observed against internet-exposed systems. Threat intelligence items include Check Point Research’s findings on Gambling Goblin compromising Brazilian government and education websites, analysis of the JSCeal information stealer, Mirage Kitten’s fake LinkedIn coding tests delivering NodeRabbit and PollCat, and North Korea-linked Contagious Interview activity using trojanized macOS installers.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Thomson Reuters disclosed a breach of its C-Track court case-management platform affecting courts across 11 U.S. states and Canada, with unauthorized access to files containing court records, names, and other personal information.","Baylor Genetics disclosed a data breach affecting 2.8 million patients and employees after unauthorized access to part of its IT environment, with stolen data including names, birth dates, medical testing and laboratory results, health insurance information, and some Social Security numbers.","Researchers detailed an AI-assisted ransomware intrusion in which autonomous agents compromised an enterprise network in under 10 hours by mapping internal systems, mining code repositories, obtaining root credentials from a secrets manager, and abusing build pipelines and cloud resources.","SonicWall addressed two critical vulnerabilities, CVE-2026-83548 and CVE-2026-83549, affecting SMA 1000 remote access gateways, both of which were exploited as zero-days.","Check Point Research reported on a Chinese-speaking cybercrime cluster called Gambling Goblin that compromises Brazilian government and education websites to redirect visitors to gambling and phishing pages while manipulating search rankings."],"insights":["The reported AI-assisted ransomware intrusion shows that autonomous agents can compress multiple stages of an enterprise compromise into under 10 hours, including finding credentials, using code repositories, and abusing build pipelines and cloud resources.","GitSpawn is especially notable because malicious repository settings can trigger code execution when AI coding agents gather project context, in some cases before a developer is shown a trust prompt.","The Dropbox incident shows that account exposure can occur through a third party’s identity verification weakness even when attackers do not have the victim’s Dropbox password.","The JFrog Artifactory flaw was reportedly exploited shortly after disclosure against internet-facing self-hosted systems, making rapid patching especially important for organizations running their own deployments.","The FalconFlank proof of concept is unusual because it abuses CrowdStrike Falcon’s own Microsoft Office macro-removal remediation behavior to gain higher privileges on affected Windows systems."],"referencedReports":[{"title":"AI-Assisted Cyber Attack: Inside a Unit 42 Investigation","url":"https://unit42.paloaltonetworks.com/ai-assisted-cyber-attack-inside-a-unit-42-investigation/","publisher":"Unit 42","context":"The article cites this research as detailing an AI-assisted ransomware intrusion that compromised an enterprise network in under 10 hours.","category":"research","primary":false},{"title":"AI Coding Agents Git Hijack","url":"https://www.manifold.security/blog/ai-coding-agents-git-hijack","publisher":"Manifold Security","context":"The article cites this research as disclosing GitSpawn, a vulnerability class affecting multiple AI coding agents.","category":"research","primary":false},{"title":"Can AI Create PLC Attacks? Yes, But It’s Not That Easy Yet","url":"https://www.forescout.com/blog/can-ai-create-plc-attacks-yes-but-it%E2%80%99s-not-that-easy-yet/","publisher":"Forescout","context":"The article cites this research as showing how an AI coding assistant can help port a known PLC exploit to a different controller model.","category":"research","primary":false},{"title":"Mirage Kitten: New Backdoors NodeRabbit and PollCat","url":"https://securelist.com/mirage-kitten-new-backdoors-noderabbit-pollcat/121244/","publisher":"Securelist","context":"The article cites this analysis as mapping an Iran-linked Mirage Kitten campaign using fake LinkedIn coding tests to deliver NodeRabbit and PollCat malware.","category":"research","primary":false},{"title":"Contagious Interview: Trojanized macOS Installers","url":"https://www.jamf.com/blog/contagious-interview-trojanized-macos-installers/","publisher":"Jamf","context":"The article cites this analysis as covering new macOS delivery activity linked to North Korea’s Contagious Interview campaign.","category":"research","primary":false}],"body":"\u003cp\u003eCheck Point Research’s 7th September Threat Intelligence Report summarizes major attacks, breaches, AI-related threats, vulnerabilities, and threat intelligence findings from the week. It includes breaches affecting Thomson Reuters’ C-Track court case-management platform, Baylor Genetics, and Dropbox, as well as a cyberattack that disrupted Hit’s casinos and related services in Slovenia. The reported impacts include exposed court records and personal information, stolen medical and insurance data, unauthorized Dropbox file access, and temporary closures or service outages for casino and hotel operations.\u003c/p\u003e\n\n\u003cp\u003eThe report highlights several AI-related security issues, including an AI-assisted ransomware intrusion that compromised an enterprise network in under 10 hours. Researchers also disclosed GitSpawn, a vulnerability class affecting AI coding agents where malicious repository Git configurations can trigger arbitrary code execution as the developer. Another cited case showed an AI coding assistant helping port a known PLC exploit to a different controller model, producing working payloads after guided analysis.\u003c/p\u003e\n\n\u003cp\u003eThe article also covers critical vulnerabilities and active threat campaigns. SonicWall addressed CVE-2026-83548 and CVE-2026-83549 in SMA 1000 remote access gateways, while JFrog addressed CVE-2026-82329 in self-hosted Artifactory deployments after exploitation was observed against internet-exposed systems. Threat intelligence items include Check Point Research’s findings on Gambling Goblin compromising Brazilian government and education websites, analysis of the JSCeal information stealer, Mirage Kitten’s fake LinkedIn coding tests delivering NodeRabbit and PollCat, and North Korea-linked Contagious Interview activity using trojanized macOS installers.\u003c/p\u003e\n"}]</script>
