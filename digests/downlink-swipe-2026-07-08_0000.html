<script type="application/json" id="dl-articles">[{"n":1,"title":"CISA orders feds to patch max severity ColdFusion flaw by Friday","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-patch-max-severity-coldfusion-flaw-by-friday/","time":"07:16","priority":"MUST READ","score":95,"tldr":"CISA ordered U.S. federal agencies to patch an actively exploited maximum-severity Adobe ColdFusion flaw, CVE-2026-48282, by Friday. The bug enables unauthenticated remote code execution and began being exploited shortly after Adobe released fixes.","briefOverview":"\u003cp\u003eCISA has ordered U.S. Federal Civilian Executive Branch agencies to patch an actively exploited maximum-severity Adobe ColdFusion flaw by Friday, June 10. The vulnerability, tracked as CVE-2026-48282, affects ColdFusion versions 2025.9, 2023.20, and earlier. Adobe released security updates one week ago and urged administrators to deploy them immediately because the issue posed a high risk of exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe flaw can be exploited remotely by attackers without privileges in low-complexity attacks to gain code execution on unpatched systems. KEVIntel founder Ryan Dewhurst warned that attackers began exploiting CVE-2026-48282 within two hours of Adobe’s disclosure, and the Canadian Center for Cyber Security encouraged defenders to secure their systems. Shadowserver currently tracks nearly 800 Adobe ColdFusion instances exposed online, though the article says it is unknown how many are honeypots or have been secured.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-48282 to its Known Exploited Vulnerabilities catalog and issued the federal patch deadline under Binding Operational Directive 26-04. The directive prioritizes patching based on factors such as KEV catalog inclusion, whether exploitation can be automated, whether vulnerable assets are exposed online, and whether attackers can gain partial or total control of a device. Adobe also patched six other maximum-severity flaws in ColdFusion and Campaign Classic, but said it was not aware of exploits in the wild for those issues.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA ordered U.S. Federal Civilian Executive Branch agencies to patch the actively exploited Adobe ColdFusion vulnerability CVE-2026-48282 by Friday, June 10.","CVE-2026-48282 affects Adobe ColdFusion versions 2025.9, 2023.20, and earlier, and can be exploited remotely without privileges in low-complexity attacks to gain code execution on unpatched systems.","Adobe released security updates one week ago and urged administrators to install them immediately because the flaw posed a high risk of exploitation.","KEVIntel founder Ryan Dewhurst warned that attackers began exploiting CVE-2026-48282 within two hours of Adobe’s disclosure, and the Canadian Center for Cyber Security encouraged defenders to secure their systems.","Shadowserver currently tracks nearly 800 Adobe ColdFusion instances exposed online, but it is unknown how many are honeypots or have been secured against attacks targeting CVE-2026-48282."],"insights":["CISA’s three-day patch deadline reflects BOD 26-04’s newer prioritization approach, which considers factors such as KEV inclusion, internet exposure, automation potential, and whether exploitation can give attackers control of a device.","Adobe’s own guidance recommended installing the ColdFusion update within 72 hours, which aligns with the urgency later imposed on federal agencies by CISA.","Although Shadowserver tracks nearly 800 internet-exposed ColdFusion instances, the article notes that this count does not show how many are patched or honeypots, limiting how precisely the real-world exposure can be assessed.","Adobe patched six other maximum-severity ColdFusion and Campaign Classic flaws at the same time, but only CVE-2026-48282 is described in the article as exploited in the wild and added to CISA’s KEV catalog."],"referencedReports":[{"title":"Adobe Security Advisory AV26-647","url":"http://www.cyber.gc.ca/en/alerts-advisories/adobe-security-advisory-av26-647","publisher":"Canadian Centre for Cyber Security","context":"The article says the Canadian Center for Cyber Security encouraged network defenders to secure their systems against ongoing attacks targeting the ColdFusion flaw.","category":"","primary":false},{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/07/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites this CISA alert as the notice that CVE-2026-48282 was added to the Known Exploited Vulnerabilities catalog.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2026-48282","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-48282","publisher":"CISA","context":"The article references CISA’s catalog entry for CVE-2026-48282 as the basis for the federal patch deadline.","category":"","primary":false}],"body":"\u003cp\u003eCISA has ordered U.S. Federal Civilian Executive Branch agencies to patch an actively exploited maximum-severity Adobe ColdFusion flaw by Friday, June 10. The vulnerability, tracked as CVE-2026-48282, affects ColdFusion versions 2025.9, 2023.20, and earlier. Adobe released security updates one week ago and urged administrators to deploy them immediately because the issue posed a high risk of exploitation.\u003c/p\u003e\n\n\u003cp\u003eThe flaw can be exploited remotely by attackers without privileges in low-complexity attacks to gain code execution on unpatched systems. KEVIntel founder Ryan Dewhurst warned that attackers began exploiting CVE-2026-48282 within two hours of Adobe’s disclosure, and the Canadian Center for Cyber Security encouraged defenders to secure their systems. Shadowserver currently tracks nearly 800 Adobe ColdFusion instances exposed online, though the article says it is unknown how many are honeypots or have been secured.\u003c/p\u003e\n\n\u003cp\u003eCISA added CVE-2026-48282 to its Known Exploited Vulnerabilities catalog and issued the federal patch deadline under Binding Operational Directive 26-04. The directive prioritizes patching based on factors such as KEV catalog inclusion, whether exploitation can be automated, whether vulnerable assets are exposed online, and whether attackers can gain partial or total control of a device. Adobe also patched six other maximum-severity flaws in ColdFusion and Campaign Classic, but said it was not aware of exploits in the wild for those issues.\u003c/p\u003e\n"},{"n":5,"title":"CISA orders feds to prioritize patching Langflow auth bypass flaw","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/cisa-orders-feds-to-prioritize-patching-langflow-auth-bypass-flaw/","time":"09:58","priority":"MUST READ","score":95,"tldr":"CISA has ordered U.S. federal agencies to urgently patch an actively exploited Langflow authorization bypass flaw, CVE-2026-55255, that lets authenticated attackers access other users’ AI workflows and sensitive data. Researchers say attackers are abusing exposed Langflow systems for code execution, implant delivery, compute theft, and credential harvesting.","briefOverview":"\u003cp\u003eThe U.S. Cybersecurity and Infrastructure Security Agency gave federal agencies until Friday to patch an actively exploited vulnerability in Langflow, a visual framework for building AI agents. The flaw is tracked as CVE-2026-55255 and affects a popular tool in the AI development ecosystem that provides a drag-and-drop interface and a REST API. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and said this type of vulnerability is a frequent attack vector that poses significant risks to the federal enterprise.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-55255 is described as an Insecure Direct Object Reference issue that allows authenticated attackers to access other users’ flows. Attackers can do this by sending a crafted request to the /api/v1/responses endpoint with the victim’s UUID, or flow_id. Successful exploitation can let attackers access sensitive data processed by the victim’s flows and consume the victim’s resources.\u003c/p\u003e\n\n\u003cp\u003eSysdig’s Threat Research Team first observed exploitation of CVE-2026-55255 in the wild on June 25 and said the objective was code execution and second-stage implant delivery. Sysdig characterized the activity as opportunistic, financially motivated, cheap, repeatable, and low sophistication, with attackers pursuing compromised AI hosts’ compute resources and credentials. The article also notes that CISA previously added other Langflow issues to its catalog and that attackers have been exploiting a Langflow path traversal vulnerability since June.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA gave U.S. federal agencies until Friday to patch an actively exploited vulnerability in the Langflow visual framework for building AI agents.","CVE-2026-55255 is an Insecure Direct Object Reference flaw that allows authenticated attackers to access other users’ flows by sending a crafted request to the /api/v1/responses endpoint with a victim’s UUID.","Successful exploitation of CVE-2026-55255 can let attackers access sensitive data processed by a victim’s flows and consume the victim’s resources.","Sysdig’s Threat Research Team first observed in-the-wild exploitation of CVE-2026-55255 on June 25 and said the activity aimed at code execution and second-stage implant delivery.","CISA added CVE-2026-55255 to its Known Exploited Vulnerabilities Catalog under Binding Operational Directive 26-04 and warned that this type of flaw is a frequent attack vector posing significant risks to the federal enterprise."],"insights":["CISA set an unusually short remediation window for federal agencies, requiring action by Friday after adding CVE-2026-55255 to the KEV catalog on Tuesday.","Sysdig said attackers pursued two monetizable assets on compromised AI hosts: compute capacity for botnet or implant activity and credentials such as LLM or cloud keys.","The article shows repeated active exploitation of Langflow issues, citing multiple KEV-listed flaws and a separate path traversal vulnerability exploited since June.","Sysdig characterized the observed CVE-2026-55255 activity as opportunistic, financially motivated, and low sophistication despite its goal of code execution and second-stage implant delivery."],"referencedReports":[{"title":"Understanding Langflow CVE-2026-55255 and why higher CVSS vulnerabilities aren’t always the most exploited","url":"https://webflow.sysdig.com/blog/understanding-langflow-cve-2026-55255-and-why-higher-cvss-vulnerabilities-arent-always-the-most-exploited","publisher":"Sysdig Threat Research Team","context":"The article cites Sysdig’s research as the first observation of in-the-wild exploitation of CVE-2026-55255 and quotes its assessment of attacker motivation.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2026-55255","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-55255","publisher":"CISA","context":"The article says CISA added the Langflow authorization bypass flaw CVE-2026-55255 to its Known Exploited Vulnerabilities Catalog.","category":"","primary":false},{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/07/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article links to CISA’s alert warning that the vulnerability type is a frequent attack vector and poses significant risks to the federal enterprise.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog entry for CVE-2025-3248","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2025-3248","publisher":"CISA","context":"The article notes that CISA flagged the earlier Langflow missing authentication issue CVE-2025-3248 as exploited by ransomware gangs.","category":"","primary":false}],"body":"\u003cp\u003eThe U.S. Cybersecurity and Infrastructure Security Agency gave federal agencies until Friday to patch an actively exploited vulnerability in Langflow, a visual framework for building AI agents. The flaw is tracked as CVE-2026-55255 and affects a popular tool in the AI development ecosystem that provides a drag-and-drop interface and a REST API. CISA added the flaw to its Known Exploited Vulnerabilities Catalog and said this type of vulnerability is a frequent attack vector that poses significant risks to the federal enterprise.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-55255 is described as an Insecure Direct Object Reference issue that allows authenticated attackers to access other users’ flows. Attackers can do this by sending a crafted request to the /api/v1/responses endpoint with the victim’s UUID, or flow_id. Successful exploitation can let attackers access sensitive data processed by the victim’s flows and consume the victim’s resources.\u003c/p\u003e\n\n\u003cp\u003eSysdig’s Threat Research Team first observed exploitation of CVE-2026-55255 in the wild on June 25 and said the objective was code execution and second-stage implant delivery. Sysdig characterized the activity as opportunistic, financially motivated, cheap, repeatable, and low sophistication, with attackers pursuing compromised AI hosts’ compute resources and credentials. The article also notes that CISA previously added other Langflow issues to its catalog and that attackers have been exploiting a Langflow path traversal vulnerability since June.\u003c/p\u003e\n"},{"n":18,"title":"CISA Adds 4 Actively Exploited Adobe, Joomla, and Langflow Flaws to KEV","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/cisa-adds-4-actively-exploited-adobe.html","time":"05:33","priority":"MUST READ","score":95,"tldr":"CISA added four actively exploited flaws in Adobe ColdFusion, Joomla page builder plugins, and Langflow to its KEV catalog, including critical RCE and arbitrary file upload bugs. Federal agencies must patch by July 10, 2026, as exploitation is already being used for web shells, credential theft, and suspected botnet or cryptojacking activity.","briefOverview":"\u003cp\u003eCISA added four actively exploited vulnerabilities to its Known Exploited Vulnerabilities catalog, covering Adobe ColdFusion, Joomlack Page Builder, Langflow, and JoomShaper SP Page Builder. The flaws include CVE-2026-48282, CVE-2026-56290, CVE-2026-55255, and CVE-2026-48908. Federal Civilian Executive Branch agencies are advised to apply fixes by July 10, 2026, to safeguard their networks.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-48282 is a critical Adobe ColdFusion path traversal flaw that could lead to arbitrary code execution, and exploitation was observed within hours of public disclosure. CVE-2026-48908 in JoomShaper SP Page Builder was reportedly exploited as a zero-day through an HTTP POST request to upload and execute PHP code, followed by the appearance of a new Super User account. CVE-2026-56290 in Page Builder CK has been exploited to deliver a web shell on vulnerable sites and was fixed in version 3.6.0.\u003c/p\u003e\n\n\u003cp\u003eSysdig reported that CVE-2026-55255 in Langflow was exploited with CVE-2026-33017 during a campaign between June 22 and June 25, 2026. The activity involved application and authentication reconnaissance, flow enumeration, use of the Langflow authorization bypass, and repeated remote code execution attempts with outbound connections. Sysdig assessed the activity as opportunistic and financially motivated, with payload activity consistent with botnet and cryptojacking attacks.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CISA added four actively exploited vulnerabilities to its Known Exploited Vulnerabilities catalog: CVE-2026-48282 in Adobe ColdFusion, CVE-2026-56290 in Joomlack Page Builder, CVE-2026-55255 in Langflow, and CVE-2026-48908 in JoomShaper SP Page Builder.","CVE-2026-48282 is a path traversal vulnerability in Adobe ColdFusion with a CVSS score of 10.0 that could lead to arbitrary code execution, and exploitation was observed within hours of public disclosure.","CVE-2026-48908 in JoomShaper SP Page Builder was reportedly exploited as a zero-day to upload and execute PHP code, and users are advised to update to version 6.6.2 or later.","CVE-2026-56290 in Page Builder CK has been exploited since June 27, 2026, to deliver a web shell on vulnerable Joomla sites, and the issue was fixed in Page Builder CK version 3.6.0.","Sysdig reported that CVE-2026-55255 in Langflow was exploited along with CVE-2026-33017 in a campaign from June 22 to June 25, 2026, involving credential theft and activity consistent with botnet and cryptojacking attacks."],"insights":["The Adobe ColdFusion flaw was reportedly exploited within hours of public disclosure, showing that public vulnerability details can translate into real attack attempts very quickly.","For Page Builder CK, mySites.guru warned that defenders should not only check obvious upload folders because the flaw lets attackers choose the destination folder for planted PHP files.","The Langflow case shows that a medium-severity authorization flaw can be highly valuable to attackers when it exposes other users’ flows and stored keys.","Sysdig reported that the Langflow operator combined access to other tenants’ flows with a separate remote code execution flaw, targeting both stored credentials and the host system in the same campaign.","CISA’s July 10, 2026 remediation deadline gives federal agencies only a short window to apply fixes after the vulnerabilities were added to the KEV catalog."],"referencedReports":[{"title":"CISA Adds One Known Exploited Vulnerability to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/07/cisa-adds-one-known-exploited-vulnerability-catalog","publisher":"CISA","context":"The article cites this CISA alert as part of the agency’s addition of actively exploited vulnerabilities to the KEV catalog.","category":"","primary":false},{"title":"CISA Adds Three Known Exploited Vulnerabilities to Catalog","url":"https://www.cisa.gov/news-events/alerts/2026/07/07/cisa-adds-three-known-exploited-vulnerabilities-catalog","publisher":"CISA","context":"The article cites this CISA alert as part of the agency’s addition of three actively exploited vulnerabilities to the KEV catalog.","category":"","primary":false},{"title":"CVE-2026-48282 Adobe ColdFusion RDS Path Traversal Leading to RCE","url":"https://www.resecurity.com/blog/article/cve-2026-48282-adobe-coldfusion-rds-path-traversal-leading-to-rce","publisher":"Resecurity","context":"The article references Resecurity’s analysis when discussing exploitation of CVE-2026-48282 in Adobe ColdFusion.","category":"","primary":false},{"title":"SP Page Builder Zero Day UploadCustomIcon RCE","url":"https://mysites.guru/blog/sp-page-builder-zero-day-uploadcustomicon-rce/","publisher":"mySites.guru","context":"The article cites mySites.guru for details on CVE-2026-48908 being exploited as a zero-day to upload and execute PHP code.","category":"","primary":false},{"title":"PageBuilderCK Unauthenticated File Upload RCE","url":"https://mysites.guru/blog/pagebuilderck-unauthenticated-file-upload-rce/","publisher":"mySites.guru","context":"The article cites mySites.guru’s write-up on exploitation of CVE-2026-56290 to deliver a web shell on vulnerable sites.","category":"","primary":false},{"title":"Understanding Langflow CVE-2026-55255 and Why Higher CVSS Vulnerabilities Aren’t Always the Most Exploited","url":"https://www.sysdig.com/blog/understanding-langflow-cve-2026-55255-and-why-higher-cvss-vulnerabilities-arent-always-the-most-exploited","publisher":"Sysdig","context":"The article references Sysdig’s analysis of a campaign exploiting CVE-2026-55255 together with CVE-2026-33017 in Langflow.","category":"","primary":false}],"body":"\u003cp\u003eCISA added four actively exploited vulnerabilities to its Known Exploited Vulnerabilities catalog, covering Adobe ColdFusion, Joomlack Page Builder, Langflow, and JoomShaper SP Page Builder. The flaws include CVE-2026-48282, CVE-2026-56290, CVE-2026-55255, and CVE-2026-48908. Federal Civilian Executive Branch agencies are advised to apply fixes by July 10, 2026, to safeguard their networks.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-48282 is a critical Adobe ColdFusion path traversal flaw that could lead to arbitrary code execution, and exploitation was observed within hours of public disclosure. CVE-2026-48908 in JoomShaper SP Page Builder was reportedly exploited as a zero-day through an HTTP POST request to upload and execute PHP code, followed by the appearance of a new Super User account. CVE-2026-56290 in Page Builder CK has been exploited to deliver a web shell on vulnerable sites and was fixed in version 3.6.0.\u003c/p\u003e\n\n\u003cp\u003eSysdig reported that CVE-2026-55255 in Langflow was exploited with CVE-2026-33017 during a campaign between June 22 and June 25, 2026. The activity involved application and authentication reconnaissance, flow enumeration, use of the Langflow authorization bypass, and repeated remote code execution attempts with outbound connections. Sysdig assessed the activity as opportunistic and financially motivated, with payload activity consistent with botnet and cryptojacking attacks.\u003c/p\u003e\n"},{"n":6,"title":"Hackers exploit Roundcube flaw to spy on academic researchers","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-exploit-roundcube-flaw-to-spy-on-academic-researchers/","time":"18:56","priority":"MUST READ","score":94,"tldr":"A China-linked espionage cluster is exploiting vulnerable Roundcube webmail servers at U.S. and Canadian universities to steal credentials and deploy backdoors against academic researchers. Administrators should urgently patch CVE-2024-42009 and CVE-2025-49113 and treat exposed mail servers as high-risk remote access points.","briefOverview":"\u003cp\u003eA China-linked threat cluster has been exploiting vulnerable Roundcube servers at U.S. and Canadian universities to steal credentials and deploy backdoor malware. Proofpoint tracks the activity as UNK_MassTraction and says it has been observed since May. The campaign focuses on physics and engineering departments, administrators and professors, and organizations involved in astrophysics, particle physics, or national security-related research.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with a malicious email sent from compromised accounts or spoofed domains and using a generic lure. When the email is opened in a vulnerable Roundcube webmail client, CVE-2024-42009 triggers JavaScript execution in the victim’s browser and loads a payload called IceCube. Proofpoint describes IceCube as a Roundcube stealer that can harvest usernames, passwords, cookies, two-factor authentication data, and browser information.\u003c/p\u003e\n\n\u003cp\u003eProofpoint says the malware uses helpers to exploit CVE-2025-49113 and attempts to install SquareShell, a PHP webshell with remote code execution capabilities. If that succeeds, the attacker gains remote code execution on the mail server; otherwise, the malware downloads a shell script that loads the VShell backdoor directly in memory. Administrators of Roundcube systems are advised to apply the latest security updates and treat mail servers with the same diligence as VPNs and other remote access nodes.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A China-linked threat cluster tracked by Proofpoint as UNK_MassTraction has been exploiting vulnerable Roundcube servers at U.S. and Canadian universities since May.","The campaign targets physics and engineering departments, administrators and professors, and organizations involved in astrophysics, particle physics, or national security-related research.","The attack begins with malicious email from compromised accounts or spoofed domains, and opening it in a vulnerable Roundcube webmail client triggers CVE-2024-42009 to run JavaScript in the victim’s browser.","Proofpoint says the IceCube payload can steal usernames, passwords, cookies, two-factor authentication data, and browser information from Roundcube users.","The malware can use helpers to exploit CVE-2025-49113 and attempt to install the SquareShell PHP webshell, or download a shell script that loads the VShell backdoor in memory."],"insights":["Proofpoint assesses that UNK_MassTraction likely performed reconnaissance before the attacks because the group appears to have selected servers previously deemed vulnerable to CVE-2024-42009 and CVE-2025-49113.","The campaign shows that a single malicious email can lead from browser-based code execution in Roundcube to attempted remote code execution on the mail server through a second flaw.","Proofpoint explicitly cautions that the China-aligned attribution is an assessment and not a high-confidence conclusion, despite infrastructure overlap, Chinese-language artifacts, and tactics associated with Chinese attacks.","The article highlights that administrators should treat mail servers with the same diligence as VPNs and other remote access nodes because attackers are using internet-facing mail servers as footholds into internal networks."],"referencedReports":[{"title":"One Email Closer to the Edge: UNK_MassTraction Physics Exploitation","url":"https://www.proofpoint.com/us/blog/threat-insight/one-email-closer-edge-unkmasstraction-physics-exploitation","publisher":"Proofpoint","context":"The article cites Proofpoint’s threat research as the basis for details on UNK_MassTraction, IceCube, Roundcube flaw exploitation, and the campaign’s targeting and attribution assessment.","category":"","primary":false}],"body":"\u003cp\u003eA China-linked threat cluster has been exploiting vulnerable Roundcube servers at U.S. and Canadian universities to steal credentials and deploy backdoor malware. Proofpoint tracks the activity as UNK_MassTraction and says it has been observed since May. The campaign focuses on physics and engineering departments, administrators and professors, and organizations involved in astrophysics, particle physics, or national security-related research.\u003c/p\u003e\n\n\u003cp\u003eThe attack begins with a malicious email sent from compromised accounts or spoofed domains and using a generic lure. When the email is opened in a vulnerable Roundcube webmail client, CVE-2024-42009 triggers JavaScript execution in the victim’s browser and loads a payload called IceCube. Proofpoint describes IceCube as a Roundcube stealer that can harvest usernames, passwords, cookies, two-factor authentication data, and browser information.\u003c/p\u003e\n\n\u003cp\u003eProofpoint says the malware uses helpers to exploit CVE-2025-49113 and attempts to install SquareShell, a PHP webshell with remote code execution capabilities. If that succeeds, the attacker gains remote code execution on the mail server; otherwise, the malware downloads a shell script that loads the VShell backdoor directly in memory. Administrators of Roundcube systems are advised to apply the latest security updates and treat mail servers with the same diligence as VPNs and other remote access nodes.\u003c/p\u003e\n"},{"n":3,"title":"Ubiquiti warns of new max severity  UniFi OS vulnerability","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/ubiquiti-warns-of-new-max-severity-unifi-os-vulnerability/","time":"08:15","priority":"MUST READ","score":92,"tldr":"Ubiquiti released patches for seven critical UniFi OS vulnerabilities, including a maximum-severity command injection flaw in the UniFi Connect Application that can be exploited by attackers with network access. Users should update affected UniFi applications and devices immediately, especially given the large number of internet-exposed UniFi OS instances and prior active exploitation of Ubiquiti flaws.","briefOverview":"\u003cp\u003eUbiquiti released security updates to patch seven critical vulnerabilities in UniFi OS, including a maximum-severity flaw tracked as CVE-2026-50746. The flaw affects UniFi Connect Application versions 3.4.16 and earlier, which are used to automate and manage commercial building operations such as smart LED lighting systems and electric vehicle chargers. Ubiquiti said a malicious actor with network access could exploit the improper access control issue to execute command injection on the host device.\u003c/p\u003e\n\n\u003cp\u003eThe company advised users to update the impacted UniFi Connect Application to version 3.4.20 or later. Ubiquiti also patched six more critical-severity issues affecting UniFi Talk, UniFi Access, UniFi Protect, UniFi OS Server, and a wide range of Ubiquiti routers, gateways, NAS, and surveillance systems. Ubiquiti has not disclosed whether any of the vulnerabilities were exploited before being fixed, but said six can be exploited in low-complexity attacks that do not require user interaction.\u003c/p\u003e\n\n\u003cp\u003eCensys tracks more than 100,000 UniFi OS instances exposed online, with nearly 50,000 IP addresses in the United States, though the article notes the data may include historical scan results and honeypots. The article says state-sponsored and cybercrime hacking groups have often targeted Ubiquiti products in recent years, including hijacking them to build botnets used to conceal malicious activity. It also cites recent cases involving Moobot, a previously exploited Ubiquiti AirOS command injection flaw, and June CISA warnings about active exploitation of three maximum-severity UniFi OS flaws.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ubiquiti released security updates for seven critical vulnerabilities in UniFi OS, including the maximum-severity CVE-2026-50746 command injection flaw.","CVE-2026-50746 affects UniFi Connect Application versions 3.4.16 and earlier and can allow a malicious actor with network access to execute command injection on the host device.","Ubiquiti advised users to update the impacted UniFi Connect Application to version 3.4.20 or later.","Ubiquiti also patched six other critical issues affecting UniFi Talk, UniFi Access, UniFi Protect, UniFi OS Server, and a wide range of Ubiquiti routers, gateways, NAS, and surveillance systems.","Censys tracks over 100,000 UniFi OS instances exposed online, with nearly 50,000 IP addresses in the United States, though the data may include historical scan results and honeypots."],"insights":["Six of the seven newly patched vulnerabilities can be exploited in low-complexity attacks without user interaction, making delayed patching especially risky for exposed systems.","The number of internet-exposed UniFi OS instances reported by Censys is large, but the article cautions that the figure may include historical scan results and honeypots, so it should not be treated as an exact count of currently vulnerable systems.","Ubiquiti has not said whether any of the newly patched vulnerabilities were exploited before the fixes were released, leaving defenders without confirmation either way.","Recent history shows Ubiquiti flaws can quickly become operationally important, as CISA warned in June that hackers were actively exploiting three maximum-severity UniFi OS flaws patched only one month earlier."],"referencedReports":[{"title":"Security Advisory Bulletin 066-066","url":"https://community.ui.com/releases/Security-Advisory-Bulletin-066-066/984eceb3-49c8-4227-942d-671c289b3afc","publisher":"Ubiquiti","context":"The article cites Ubiquiti's advisory as the source for the newly patched critical UniFi OS vulnerabilities and affected products.","category":"","primary":false},{"title":"Known Exploited Vulnerabilities Catalog","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?f%5B0%5D=vendor_project%3A916","publisher":"CISA","context":"The article references CISA's catalog when discussing earlier actively exploited Ubiquiti flaws and past patching mandates for government agencies.","category":"","primary":false}],"body":"\u003cp\u003eUbiquiti released security updates to patch seven critical vulnerabilities in UniFi OS, including a maximum-severity flaw tracked as CVE-2026-50746. The flaw affects UniFi Connect Application versions 3.4.16 and earlier, which are used to automate and manage commercial building operations such as smart LED lighting systems and electric vehicle chargers. Ubiquiti said a malicious actor with network access could exploit the improper access control issue to execute command injection on the host device.\u003c/p\u003e\n\n\u003cp\u003eThe company advised users to update the impacted UniFi Connect Application to version 3.4.20 or later. Ubiquiti also patched six more critical-severity issues affecting UniFi Talk, UniFi Access, UniFi Protect, UniFi OS Server, and a wide range of Ubiquiti routers, gateways, NAS, and surveillance systems. Ubiquiti has not disclosed whether any of the vulnerabilities were exploited before being fixed, but said six can be exploited in low-complexity attacks that do not require user interaction.\u003c/p\u003e\n\n\u003cp\u003eCensys tracks more than 100,000 UniFi OS instances exposed online, with nearly 50,000 IP addresses in the United States, though the article notes the data may include historical scan results and honeypots. The article says state-sponsored and cybercrime hacking groups have often targeted Ubiquiti products in recent years, including hijacking them to build botnets used to conceal malicious activity. It also cites recent cases involving Moobot, a previously exploited Ubiquiti AirOS command injection flaw, and June CISA warnings about active exploitation of three maximum-severity UniFi OS flaws.\u003c/p\u003e\n"},{"n":7,"title":"Entra passkey enrollment vishing targets Microsoft 365 users","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/entra-passkey-enrollment-vishing-targets-microsoft-365-users/","time":"16:47","priority":"MUST READ","score":92,"tldr":"A threat actor tracked as O-UNC-066, linked to the Pink extortion group, is using vishing to trick Microsoft 365 users into enrolling attacker-controlled Entra passkeys through fake Microsoft-branded registration pages. Once access is gained, the group quickly steals data from services like SharePoint and OneDrive for extortion.","briefOverview":"\u003cp\u003eA threat actor is targeting organizations across multiple sectors with voice-based fake security requests that ask Microsoft 365 users to enroll a new Microsoft Entra passkey. Okta attributes the activity to O-UNC-066, which operates the Pink extortion operation. The campaign has been running since April and targets users in industries including food and beverage, technology, healthcare, automotive, construction, and aviation.\u003c/p\u003e\n\n\u003cp\u003eThe attacker calls targeted employees and claims they must enroll a new Microsoft Entra passkey for security reasons, then directs them to phishing URLs that include the word “passkey” in the domain name. The malicious sites use the victim organization’s branding and imitate the legitimate Entra passkey enrollment portal. While victims believe they are registering a new passkey on their own accounts, the attacker is actually registering a passkey they control.\u003c/p\u003e\n\n\u003cp\u003eOkta says the phishing kit is an operator-controlled PHP panel rather than a common adversary-in-the-middle proxy, allowing the attacker to guide victims through authentication in close to real time using a 1-second heartbeat polling mechanism. The operator can adapt the flow to the victim’s multi-factor authentication method, including TOTP, push notification with number matching, or SMS OTP. After gaining access, Pink quickly exfiltrates data from SharePoint and OneDrive and uses stolen data samples on an extortion site to pressure victims into paying a ransom.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A threat actor has been targeting organizations across multiple sectors by calling Microsoft 365 users and asking them to enroll a new Microsoft Entra passkey.","Okta attributes the activity to O-UNC-066, an actor that operates the Pink extortion operation and has targeted organizations in the food and beverage, technology, healthcare, automotive, construction, and aviation industries.","The attacker directs victims to phishing URLs containing the word “passkey,” where fake Microsoft-branded pages imitate the legitimate Entra passkey enrollment process.","The phishing kit is an operator-controlled PHP panel that lets the attacker guide victims through authentication in near real time and adapt the process to the victim’s multi-factor authentication method.","After gaining access to a victim’s account, Pink quickly exfiltrates data from SharePoint and OneDrive services and uses stolen data samples on an extortion site to pressure victims into paying a ransom."],"insights":["The campaign abuses Microsoft’s recent administrator-facing passkey registration campaign capability, turning a legitimate security-upgrade workflow into a convincing social-engineering pretext.","The phishing kit is not a typical adversary-in-the-middle proxy; it uses an operator-controlled PHP panel with a 1-second heartbeat so the attacker can steer each victim through authentication in near real time.","The fake BIP-39 recovery phrase is a notable deception because Okta says seed phrases have no role in legitimate Microsoft Entra passkey enrollment, making it a distraction for users unfamiliar with the real process.","Okta’s recommendation to verify helpdesk personnel identities highlights that defensive controls need to address phone-based impersonation, not just web phishing pages or stolen credentials."],"referencedReports":[{"title":"Vishing actors target Microsoft Entra passkey enrollment","url":"https://www.okta.com/en-au/blog/threat-intelligence/vishing-actors-target-microsoft-entra-passkey-enrollment-/","publisher":"Okta","context":"The article cites Okta’s threat intelligence analysis as the source for attribution to O-UNC-066 and details of the phishing kit and campaign.","category":"","primary":false},{"title":"Pink Extortion Brand Activity","url":"https://github.com/PaloAltoNetworks/Unit42-timely-threat-intel/blob/main/2026-06-03-Pink-Extortion-Brand-Activity.txt","publisher":"Palo Alto Networks Unit 42","context":"The article references Unit 42’s threat intelligence noting phishing domains used by Pink that included the word “passkey.”","category":"","primary":false}],"body":"\u003cp\u003eA threat actor is targeting organizations across multiple sectors with voice-based fake security requests that ask Microsoft 365 users to enroll a new Microsoft Entra passkey. Okta attributes the activity to O-UNC-066, which operates the Pink extortion operation. The campaign has been running since April and targets users in industries including food and beverage, technology, healthcare, automotive, construction, and aviation.\u003c/p\u003e\n\n\u003cp\u003eThe attacker calls targeted employees and claims they must enroll a new Microsoft Entra passkey for security reasons, then directs them to phishing URLs that include the word “passkey” in the domain name. The malicious sites use the victim organization’s branding and imitate the legitimate Entra passkey enrollment portal. While victims believe they are registering a new passkey on their own accounts, the attacker is actually registering a passkey they control.\u003c/p\u003e\n\n\u003cp\u003eOkta says the phishing kit is an operator-controlled PHP panel rather than a common adversary-in-the-middle proxy, allowing the attacker to guide victims through authentication in close to real time using a 1-second heartbeat polling mechanism. The operator can adapt the flow to the victim’s multi-factor authentication method, including TOTP, push notification with number matching, or SMS OTP. After gaining access, Pink quickly exfiltrates data from SharePoint and OneDrive and uses stolen data samples on an extortion site to pressure victims into paying a ransom.\u003c/p\u003e\n"},{"n":10,"title":"Telco giant KDDI says data breach affects over 12 million people","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/japanese-telecom-giant-kddi-says-data-breach-affects-12-million-people/","time":"11:24","priority":"MUST READ","score":92,"tldr":"KDDI says a zero-day breach of a third-party email platform exposed over 12 million email addresses and 7.6 million passwords across several Japanese ISPs. The company says it has fixed the flaw, deployed additional monitoring, and is forcing password changes for affected accounts.","briefOverview":"\u003cp\u003eJapanese telecommunications giant KDDI said attackers breached an email platform used by five internet service providers in Japan. The affected providers are STNet, JCOM, Chubu Telecommunications C, NIFTY Corporation, and BIGLOBE. KDDI said the incident exposed email addresses for 12,233,087 people and passwords for 7,616,173 people.\u003c/p\u003e\n\n\u003cp\u003eKDDI said the attackers breached the platform on May 16 by exploiting a zero-day vulnerability in third-party software. As of June 17, 2026, KDDI said the software vendor had not recognized the vulnerability, and the vendor had reported it to public authorities and was working toward disclosure. KDDI previously said the incident may have exposed up to 14.22 million email addresses and passwords from current and former customers, as well as inactive accounts.\u003c/p\u003e\n\n\u003cp\u003eKDDI said it is working to change affected customers’ email account passwords, and many customers who regularly use email services have already changed them. The company said it is also working with ISP providers to complete mandatory password changes within one or two days for customers who do not frequently use email services. KDDI deployed Endpoint Detection and Response software, said a June 23 forensic audit confirmed the exploited vulnerability had been addressed, and notified Japan’s Personal Information Protection Commission and Ministry of Internal Affairs and Communications.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["KDDI said attackers breached an email platform used by five Japanese internet service providers: STNet, JCOM, Chubu Telecommunications C, NIFTY Corporation, and BIGLOBE.","KDDI reported that the breach exposed email addresses of 12,233,087 people and passwords of 7,616,173 people.","KDDI said attackers breached the platform on May 16 by exploiting a zero-day vulnerability in third-party software that the vendor had not recognized as of June 17, 2026.","KDDI is working with the affected ISP providers to change passwords for affected email accounts, including mandatory password changes for customers who do not frequently use email services.","KDDI said it deployed Endpoint Detection and Response software and that a June 23 forensic audit confirmed the exploited vulnerability had been addressed and no other security issues affected the systems."],"insights":["KDDI disclosed that some passwords were hashed and/or encrypted, but did not say how many were stored in plaintext or what encryption was used, leaving uncertainty about how easily exposed passwords could be abused.","The breach affected inactive accounts as well as current and former customers, which is why KDDI is requiring password changes even for people who do not frequently use the email services.","The exploited flaw was unknown to the third-party software vendor as of KDDI’s June 17 confirmation date, showing that the attackers used a vulnerability that had no vendor-recognized fix at the time of discovery.","KDDI’s later investigation reduced the confirmed impact from a possible 14.22 million exposed email logins to 12,233,087 exposed email addresses and 7,616,173 exposed passwords."],"referencedReports":[],"body":"\u003cp\u003eJapanese telecommunications giant KDDI said attackers breached an email platform used by five internet service providers in Japan. The affected providers are STNet, JCOM, Chubu Telecommunications C, NIFTY Corporation, and BIGLOBE. KDDI said the incident exposed email addresses for 12,233,087 people and passwords for 7,616,173 people.\u003c/p\u003e\n\n\u003cp\u003eKDDI said the attackers breached the platform on May 16 by exploiting a zero-day vulnerability in third-party software. As of June 17, 2026, KDDI said the software vendor had not recognized the vulnerability, and the vendor had reported it to public authorities and was working toward disclosure. KDDI previously said the incident may have exposed up to 14.22 million email addresses and passwords from current and former customers, as well as inactive accounts.\u003c/p\u003e\n\n\u003cp\u003eKDDI said it is working to change affected customers’ email account passwords, and many customers who regularly use email services have already changed them. The company said it is also working with ISP providers to complete mandatory password changes within one or two days for customers who do not frequently use email services. KDDI deployed Endpoint Detection and Response software, said a June 23 forensic audit confirmed the exploited vulnerability had been addressed, and notified Japan’s Personal Information Protection Commission and Ministry of Internal Affairs and Communications.\u003c/p\u003e\n"},{"n":22,"title":"China-Linked UAT-7810 Expands ORB Network With New LONGLEASH Malware","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/china-linked-uat-7810-expands-orb.html","time":"09:04","priority":"MUST READ","score":92,"tldr":"China-linked UAT-7810 is expanding its LapDogs ORB network by compromising internet-facing routers and deploying newly developed malware including LONGLEASH, DOGLEASH, LEASHTEST, and JARLEASH. Cisco Talos says the group is actively refining its tooling to provide relay infrastructure that other China-nexus actors can use in attacks against high-value targets.","briefOverview":"\u003cp\u003eA Chinese threat actor tracked as UAT-7810 is actively refining bespoke malware to expand its Operational Relay Box network by breaking into internet-facing networking devices. Cisco Talos says UAT-7810 is responsible for maintaining and proliferating LapDogs, an ORB network first disclosed in June 2025. The infrastructure can be leveraged by associated secondary threat actors for malicious attacks against high-value targets.\u003c/p\u003e\n\n\u003cp\u003eOne China-nexus actor that has used this infrastructure is UAT-5918, which has been linked to attacks on critical infrastructure entities in Taiwan since at least 2023. Cisco Talos reports that UAT-7810 has continued developing ShortLeash into a newer version called LONGLEASH. The group has also used previously unreported tools named DOGLEASH, LEASHTEST, and JARLEASH.\u003c/p\u003e\n\n\u003cp\u003eThe group’s attack chains have weaponized known vulnerabilities in unpatched Ruckus wireless routers, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717. Campaigns observed earlier this year also targeted ASUS AiCloud routers vulnerable to CVE-2025-2492, indicating possible attempts to broaden the ORB network. LONGLEASH adds functions for proxying over multiple protocols, managing network connections, authorizing clients, relaying commands and data, and removing the implant and traces if tampering is detected.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cisco Talos reports that the Chinese threat actor UAT-7810 is refining bespoke malware to expand its LapDogs Operational Relay Box network by compromising internet-facing networking devices.","UAT-7810 is assessed as responsible for maintaining and proliferating the LapDogs network, which can be leveraged by associated secondary threat actors for attacks against high-value targets.","The group has developed a newer version of ShortLeash called LONGLEASH and has also used previously unreported tools named DOGLEASH, LEASHTEST, and JARLEASH.","UAT-7810 attack chains have weaponized known vulnerabilities in unpatched Ruckus wireless routers, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717.","Campaigns observed earlier in the year targeted ASUS AiCloud routers vulnerable to CVE-2025-2492, indicating possible attempts to broaden the ORB network."],"insights":["UAT-7810 appears to function as an infrastructure-enabling actor, building ORB networks that other China-linked groups such as UAT-5918 can use for their own operations.","The addition of LONGLEASH capabilities to act as an intermediate command-and-control relay shows that compromised devices are being used not just as endpoints but as routing infrastructure between primary servers and peers.","LEASHTEST indicates that UAT-7810 is still validating behavior on MIPS-based embedded devices even after developing the more complete LONGLEASH backdoor framework.","LONGLEASH includes tamper-detection behavior that can remove the implant and its traces from a server, making investigation and recovery more difficult if defenders interact with it incorrectly.","The targeting of both Ruckus wireless routers and ASUS AiCloud routers shows the group is broadening the types of internet-facing devices it uses to expand the LapDogs network."],"referencedReports":[{"title":"UAT-7810","url":"https://blog.talosintelligence.com/uat-7810/","publisher":"Cisco Talos","context":"The article says its findings are based on Cisco Talos research into UAT-7810’s malware development and expansion of the LapDogs ORB network.","category":"","primary":false}],"body":"\u003cp\u003eA Chinese threat actor tracked as UAT-7810 is actively refining bespoke malware to expand its Operational Relay Box network by breaking into internet-facing networking devices. Cisco Talos says UAT-7810 is responsible for maintaining and proliferating LapDogs, an ORB network first disclosed in June 2025. The infrastructure can be leveraged by associated secondary threat actors for malicious attacks against high-value targets.\u003c/p\u003e\n\n\u003cp\u003eOne China-nexus actor that has used this infrastructure is UAT-5918, which has been linked to attacks on critical infrastructure entities in Taiwan since at least 2023. Cisco Talos reports that UAT-7810 has continued developing ShortLeash into a newer version called LONGLEASH. The group has also used previously unreported tools named DOGLEASH, LEASHTEST, and JARLEASH.\u003c/p\u003e\n\n\u003cp\u003eThe group’s attack chains have weaponized known vulnerabilities in unpatched Ruckus wireless routers, including CVE-2020-22653, CVE-2020-22658, and CVE-2023-25717. Campaigns observed earlier this year also targeted ASUS AiCloud routers vulnerable to CVE-2025-2492, indicating possible attempts to broaden the ORB network. LONGLEASH adds functions for proxying over multiple protocols, managing network connections, authorizing clients, relaying commands and data, and removing the implant and traces if tampering is detected.\u003c/p\u003e\n"},{"n":27,"title":"Ubiquiti Patches Critical UniFi Flaws Across Connect, Talk, Access, Protect, and OS","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/ubiquiti-patches-critical-unifi-flaws.html","time":"14:38","priority":"MUST READ","score":92,"tldr":"Ubiquiti released patches for multiple critical UniFi Connect, Talk, Access, Protect, and OS vulnerabilities that could allow network-accessible attackers to escalate privileges or execute arbitrary commands. Users should update to the fixed versions immediately, though there is no evidence these specific flaws have been exploited in the wild.","briefOverview":"\u003cp\u003eUbiquiti has shipped updates to address multiple critical security flaws affecting UniFi Connect, UniFi Talk, UniFi Access, UniFi Protect, and UniFi OS. The issues could result in privilege escalation and arbitrary command execution. The affected products include UniFi Connect versions 3.4.16 and earlier, UniFi Talk versions 5.1.2 and earlier, UniFi Access versions 4.2.28 and earlier, UniFi Protect versions 7.1.77 and earlier, and UniFi OS versions 5.1.15 and earlier.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities include improper access control, SQL injection, improper input validation, and server-side request forgery. CVE-2026-50746 in UniFi Connect has a CVSS score of 10.0 and could allow an attacker with network access to execute command injection on the host device. Other high-severity issues could allow privilege escalation, command injection, or unauthorized changes to certain devices.\u003c/p\u003e\n\n\u003cp\u003eThe article states there is no evidence that these flaws have been exploited in the wild. However, CISA flagged three UniFi OS vulnerabilities last month as having been weaponized in real-world attacks. Russian state-sponsored threat actors have also been observed using compromised Ubiquiti Edge OS routers in the MooBot botnet, which was disrupted by law enforcement in February 2024.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Ubiquiti shipped updates to fix multiple critical security flaws affecting UniFi Connect, UniFi Talk, UniFi Access, UniFi Protect, and UniFi OS.","The vulnerabilities could allow attackers with network access to escalate privileges, execute command injections, make unauthorized device changes, or exploit a server-side request forgery flaw.","The affected and fixed versions include UniFi Connect 3.4.16 and earlier fixed in 3.4.20, UniFi Talk 5.1.2 and earlier fixed in 5.2.2, UniFi Access 4.2.28 and earlier fixed in 4.2.29, UniFi Protect 7.1.77 and earlier fixed in 7.1.83, and UniFi OS 5.1.15 and earlier fixed in 5.1.19.","The article states there is no evidence that these newly disclosed flaws have been exploited in the wild.","CISA previously flagged three UniFi OS vulnerabilities as exploited in real-world attacks, and Russian state-sponsored threat actors have been observed using compromised Ubiquiti Edge OS routers in the MooBot botnet."],"insights":["The flaws span multiple UniFi applications and UniFi OS itself, so organizations using several UniFi services may need to apply more than one update rather than treating this as a single-product patch.","Several issues require only network access, and one UniFi Connect flaw has the maximum CVSS score of 10.0, making rapid patching especially important even though the article says there is no known exploitation yet.","The newly patched flaws appear in a product ecosystem that has already drawn attacker interest, as CISA recently flagged other UniFi OS vulnerabilities as exploited and Russian state-sponsored actors have used compromised Ubiquiti Edge OS routers in the MooBot botnet.","The fixes are tied to specific version numbers for each product, meaning affected users need to verify the exact installed versions of UniFi Connect, Talk, Access, Protect, and UniFi OS rather than relying on a general assumption that they are up to date."],"referencedReports":[{"title":"Security Advisory Bulletin 066-066","url":"https://community.ui.com/releases/Security-Advisory-Bulletin-066-066/984eceb3-49c8-4227-942d-671c289b3afc","publisher":"Ubiquiti","context":"The article cites Ubiquiti's advisory as the source for updates addressing critical flaws across UniFi Connect, Talk, Access, Protect, and OS.","category":"","primary":false}],"body":"\u003cp\u003eUbiquiti has shipped updates to address multiple critical security flaws affecting UniFi Connect, UniFi Talk, UniFi Access, UniFi Protect, and UniFi OS. The issues could result in privilege escalation and arbitrary command execution. The affected products include UniFi Connect versions 3.4.16 and earlier, UniFi Talk versions 5.1.2 and earlier, UniFi Access versions 4.2.28 and earlier, UniFi Protect versions 7.1.77 and earlier, and UniFi OS versions 5.1.15 and earlier.\u003c/p\u003e\n\n\u003cp\u003eThe vulnerabilities include improper access control, SQL injection, improper input validation, and server-side request forgery. CVE-2026-50746 in UniFi Connect has a CVSS score of 10.0 and could allow an attacker with network access to execute command injection on the host device. Other high-severity issues could allow privilege escalation, command injection, or unauthorized changes to certain devices.\u003c/p\u003e\n\n\u003cp\u003eThe article states there is no evidence that these flaws have been exploited in the wild. However, CISA flagged three UniFi OS vulnerabilities last month as having been weaponized in real-world attacks. Russian state-sponsored threat actors have also been observed using compromised Ubiquiti Edge OS routers in the MooBot botnet, which was disrupted by law enforcement in February 2024.\u003c/p\u003e\n"},{"n":38,"title":"Emerging Threats: (CVE-2026-20896, CVE-2026-27771) Authentication Bypasses in Self-Hosted Gitea","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threats-cve-2026-20896-cve-2026-27771-authentication-bypasses-in-self-hosted-gitea/","time":"11:45","priority":"MUST READ","score":92,"tldr":"Two pre-authentication Gitea flaws can let attackers impersonate users via trusted reverse-proxy headers or anonymously pull private container images from the built-in registry. Self-hosted Gitea and Forgejo instances should be inventoried, restricted from direct exposure, and upgraded to Gitea 1.26.3 or later to address both issues.","briefOverview":"\u003cp\u003eThe article covers two authentication-related vulnerabilities in self-hosted Gitea: CVE-2026-20896 and CVE-2026-27771. CVE-2026-20896 is a critical default-configuration flaw in Gitea’s official Docker images involving \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES\u003c/code\u003e being set to \u003ccode\u003e*\u003c/code\u003e. When reverse-proxy authentication is enabled and an attacker can reach the container’s HTTP port directly, the attacker can use the \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header to impersonate a known or guessable user.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-27771 is a separate high-severity access control failure in Gitea’s built-in container registry. The article says private container repositories were only private in the user interface, while registry API endpoints such as \u003ccode\u003e/v2/\u0026lt;name\u0026gt;/manifests/\u0026lt;ref\u0026gt;\u003c/code\u003e and \u003ccode\u003e/v2/\u0026lt;name\u0026gt;/blobs/\u0026lt;digest\u0026gt;\u003c/code\u003e served manifests and layers to anonymous requests. Forgejo, a community fork of Gitea, shares the same container registry implementation and has been independently confirmed as affected by CVE-2026-27771.\u003c/p\u003e\n\n\u003cp\u003eThe article says both flaws are pre-authentication and affect self-hosted deployments that may be exposed directly to the internet, including systems run by development teams, smaller organizations, and academic environments. CVE-2026-27771 was fixed in Gitea 1.26.2, while CVE-2026-20896 was fixed in Gitea 1.26.3 and carried forward into 1.26.4, meaning only 1.26.3 or newer addresses both issues. Recommended actions include inventorying Gitea and Forgejo instances, restricting direct access to the Gitea HTTP port, disabling unnecessary reverse-proxy authentication, setting \u003ccode\u003eREQUIRE_SIGNIN_VIEW=true\u003c/code\u003e as an interim control, auditing registry contents for secrets, and monitoring logs for suspicious activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-20896 is a critical default-configuration flaw in Gitea’s official Docker images that can let an unauthenticated attacker impersonate any known or guessable user when reverse-proxy authentication is enabled and the container’s HTTP port is directly reachable.","CVE-2026-27771 is a high-severity access control failure in Gitea’s built-in container registry that allowed anonymous requests to retrieve private image manifests and layers regardless of repository visibility settings.","CVE-2026-20896 has seen in-the-wild probing within two weeks of disclosure, while CVE-2026-27771 has a public proof-of-concept exploit but no confirmed active exploitation reported in the article.","CVE-2026-27771 was fixed in Gitea 1.26.2, while CVE-2026-20896 was fixed in Gitea 1.26.3 and carried forward into 1.26.4, so only Gitea 1.26.3 or newer addresses both flaws.","The article recommends inventorying self-hosted Gitea and Forgejo instances, restricting direct access to the Gitea HTTP port, disabling unnecessary reverse-proxy authentication, setting REQUIRE_SIGNIN_VIEW=true as an interim registry control, auditing registry contents for secrets, and monitoring logs for suspicious activity."],"insights":["Gitea 1.26.2 is only a partial fix because it addresses CVE-2026-27771 but leaves CVE-2026-20896 unresolved, so defenders must verify the exact version rather than treating all 1.26.x upgrades as sufficient.","The two flaws affect different trust boundaries, but both expose cases where access controls appeared to exist while the reachable network or protocol layer did not actually enforce them.","Forgejo users cannot assume they are safe because the article says Forgejo shares the same container registry implementation and has been independently confirmed as affected by CVE-2026-27771.","The article identifies direct reachability of the Gitea container’s HTTP port as a critical exposure condition for CVE-2026-20896, making network restriction to the intended reverse proxy an immediate risk-reduction step before patching.","The exposure pattern is tied less to a specific industry and more to self-hosted developer tooling that is quickly provisioned, poorly decommissioned, and easy to lose track of after the original team moves on."],"referencedReports":[],"body":"\u003cp\u003eThe article covers two authentication-related vulnerabilities in self-hosted Gitea: CVE-2026-20896 and CVE-2026-27771. CVE-2026-20896 is a critical default-configuration flaw in Gitea’s official Docker images involving \u003ccode\u003eREVERSE_PROXY_TRUSTED_PROXIES\u003c/code\u003e being set to \u003ccode\u003e*\u003c/code\u003e. When reverse-proxy authentication is enabled and an attacker can reach the container’s HTTP port directly, the attacker can use the \u003ccode\u003eX-WEBAUTH-USER\u003c/code\u003e header to impersonate a known or guessable user.\u003c/p\u003e\n\n\u003cp\u003eCVE-2026-27771 is a separate high-severity access control failure in Gitea’s built-in container registry. The article says private container repositories were only private in the user interface, while registry API endpoints such as \u003ccode\u003e/v2/\u0026lt;name\u0026gt;/manifests/\u0026lt;ref\u0026gt;\u003c/code\u003e and \u003ccode\u003e/v2/\u0026lt;name\u0026gt;/blobs/\u0026lt;digest\u0026gt;\u003c/code\u003e served manifests and layers to anonymous requests. Forgejo, a community fork of Gitea, shares the same container registry implementation and has been independently confirmed as affected by CVE-2026-27771.\u003c/p\u003e\n\n\u003cp\u003eThe article says both flaws are pre-authentication and affect self-hosted deployments that may be exposed directly to the internet, including systems run by development teams, smaller organizations, and academic environments. CVE-2026-27771 was fixed in Gitea 1.26.2, while CVE-2026-20896 was fixed in Gitea 1.26.3 and carried forward into 1.26.4, meaning only 1.26.3 or newer addresses both issues. Recommended actions include inventorying Gitea and Forgejo instances, restricting direct access to the Gitea HTTP port, disabling unnecessary reverse-proxy authentication, setting \u003ccode\u003eREQUIRE_SIGNIN_VIEW=true\u003c/code\u003e as an interim control, auditing registry contents for secrets, and monitoring logs for suspicious activity.\u003c/p\u003e\n"},{"n":40,"title":"Malicious Go Module Exposes GitHub Malware Lure Network Spanning 222 Repositories","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/malicious-go-module-exposes-github-malware-lure-network?utm_medium=feed","time":"20:23","priority":"MUST READ","score":92,"tldr":"A malicious Go module posing as a DNS/subdomain scanner exposed Operation Muck and Load, a GitHub-based malware lure network spanning 222 repositories across 190 accounts. The campaign used fake active projects, hidden PowerShell loaders, public dead-drop resolvers, protected archives, and RAT/infostealer payloads to trick developers and users into running malware.","briefOverview":"\u003cp\u003eResearchers investigated a malicious Go module, \u003ccode\u003egithub[.]com/kaleidora/dnsub-scanning-tool\u003c/code\u003e, that posed as a DNS/subdomain scanner while embedding Windows malware-staging logic. The module impersonated the expectations of a legitimate developer utility and launched hidden PowerShell before any meaningful scanner logic could run. Pivoting from the module revealed Operation Muck and Load, a GitHub-based lure network of 222 confirmed repositories across 190 accounts.\u003c/p\u003e\n\n\u003cp\u003eThe operation used GitHub repositories to make malicious or deceptive software projects look active, plausible, and recently maintained. A repeated GitHub Actions workflow generated synthetic commit activity using the threat actor-linked email \u003ccode\u003eischhfd83@rambler[.]ru\u003c/code\u003e, force-push automation, every-minute scheduling, and owner-name commit attribution. The lure themes included cryptocurrency and Web3 tooling, wallet integrations, Telegram bots, game auto-farm utilities, game cheats, crypters, password tools, and offensive or gray-market automation.\u003c/p\u003e\n\n\u003cp\u003eThe malware chain used hidden PowerShell execution, \u003ccode\u003ecertutil\u003c/code\u003e decoding, public dead-drop resolver sources, encrypted payload-location material, a password-protected \u003ccode\u003eQuixo.7z\u003c/code\u003e archive, and a fake Microsoft Photos directory to launch \u003ccode\u003eMicrosoft.exe\u003c/code\u003e. The analyzed payload activity included AsyncRAT, Quasar, Remcos-style RAT activity, Vidar infostealer, spyware/dropper payloads, trojan-downloaders, and XMRig/BitMiner-related Monero cryptominers. The confirmed GitHub infrastructure was reported to GitHub’s security team, and the Go security team blocked the malicious module from the Go module proxy.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers investigated a malicious Go module, github[.]com/kaleidora/dnsub-scanning-tool, that posed as a DNS/subdomain scanner while embedding Windows malware-staging logic.","Pivoting from the module revealed Operation Muck and Load, a GitHub-based lure network of 222 confirmed repositories across 190 accounts that used synthetic GitHub Actions commit activity to appear active and maintained.","The loader chain used hidden PowerShell execution, certutil decoding, public dead-drop sources, encrypted payload-location material, a password-protected Quixo.7z archive, and a fake Microsoft Photos directory to launch Microsoft.exe.","The analyzed payload activity included AsyncRAT, Quasar, Remcos-style RAT activity, Vidar infostealer, spyware/dropper payloads, trojan-downloaders, and XMRig/BitMiner-related Monero cryptominers.","The Go security team reviewed the report and blocked the malicious module from the Go module proxy, while the confirmed GitHub infrastructure was reported to GitHub’s security team."],"insights":["The module’s more than 1,200 published versions, including over 700 malicious versions, were likely produced by the threat actor’s own GitHub Actions timestamp-commit workflow rather than normal release engineering.","The GitHub Actions workflow left a reusable defender pivot because it changed the visible commit username to each repository owner while repeatedly using the same underlying email address, ischhfd83@rambler[.]ru.","The loader’s use of multiple public dead-drop locations meant the attacker could update or preserve payload resolution even if one paste, post, domain, or final archive URL was removed or blocked.","The campaign’s lure repositories did not all need to host malware directly; many were used as a trust and search-visibility layer to make deceptive projects look active, plausible, and recently maintained.","The fake Microsoft Photos execution path was explicitly identified as a masquerade because C:\\ProgramData\\Windows.Microsoft.Photos\\ is not a standard Microsoft Photos installation location."],"referencedReports":[{"title":"The strange tale of ischhfd83: when cybercriminals eat their own","url":"https://www.sophos.com/en-us/blog/the-strange-tale-of-ischhfd83-when-cybercriminals-eat-their-own","publisher":"Sophos","context":"The article cites Sophos researchers Matt Wixey and Andrew O’Donnell as having previously reported related ischhfd83-linked repository-backdoor activity with overlapping lure themes, staging methods, and payload behavior.","category":"","primary":false}],"body":"\u003cp\u003eResearchers investigated a malicious Go module, \u003ccode\u003egithub[.]com/kaleidora/dnsub-scanning-tool\u003c/code\u003e, that posed as a DNS/subdomain scanner while embedding Windows malware-staging logic. The module impersonated the expectations of a legitimate developer utility and launched hidden PowerShell before any meaningful scanner logic could run. Pivoting from the module revealed Operation Muck and Load, a GitHub-based lure network of 222 confirmed repositories across 190 accounts.\u003c/p\u003e\n\n\u003cp\u003eThe operation used GitHub repositories to make malicious or deceptive software projects look active, plausible, and recently maintained. A repeated GitHub Actions workflow generated synthetic commit activity using the threat actor-linked email \u003ccode\u003eischhfd83@rambler[.]ru\u003c/code\u003e, force-push automation, every-minute scheduling, and owner-name commit attribution. The lure themes included cryptocurrency and Web3 tooling, wallet integrations, Telegram bots, game auto-farm utilities, game cheats, crypters, password tools, and offensive or gray-market automation.\u003c/p\u003e\n\n\u003cp\u003eThe malware chain used hidden PowerShell execution, \u003ccode\u003ecertutil\u003c/code\u003e decoding, public dead-drop resolver sources, encrypted payload-location material, a password-protected \u003ccode\u003eQuixo.7z\u003c/code\u003e archive, and a fake Microsoft Photos directory to launch \u003ccode\u003eMicrosoft.exe\u003c/code\u003e. The analyzed payload activity included AsyncRAT, Quasar, Remcos-style RAT activity, Vidar infostealer, spyware/dropper payloads, trojan-downloaders, and XMRig/BitMiner-related Monero cryptominers. The confirmed GitHub infrastructure was reported to GitHub’s security team, and the Go security team blocked the malicious module from the Go module proxy.\u003c/p\u003e\n"},{"n":25,"title":"15-Year-Old GhostLock Flaw Enables Root and Container Escape on Most Linux Distros","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/15-year-old-ghostlock-flaw-enables-root.html","time":"06:16","priority":"MUST READ","score":90,"tldr":"GhostLock (CVE-2026-43499) is a 15-year-old Linux kernel flaw that lets any local user gain root and escape containers on many unpatched distributions, with public exploit code now available. Administrators should urgently update to their distribution’s latest kernel, especially on shared, cloud, container, and CI systems.","briefOverview":"\u003cp\u003eResearchers at Nebula Security disclosed GhostLock (CVE-2026-43499), a 15-year-old Linux kernel flaw that lets any logged-in user gain full root control on an unpatched machine. The vulnerable code has shipped by default in essentially every mainstream Linux distribution since 2011. Nebula developed a working exploit that was 97% reliable in testing, escapes containers, and took about five seconds on its test machine.\u003c/p\u003e\n\n\u003cp\u003eThe flaw needs no special permissions, unusual settings, or network access because ordinary threading calls from any local program are enough. It is a use-after-free bug caused by a cleanup step that runs at the wrong moment during a failed lock operation and leaves the kernel trusting a stale pointer. The flaw was fixed in April, but distributions are still rolling out patches, and the article warns that the original fix introduced a separate crash bug, CVE-2026-53166.\u003c/p\u003e\n\n\u003cp\u003eThe article says there is no complete workaround because the operations that trigger the issue are routine for local processes. It recommends installing the distribution’s current kernel and prioritizing shared and multi-tenant machines, cloud servers, containers, and CI runners. GhostLock is also part of Nebula’s IonStack chain, where a Firefox flaw runs code inside the browser and escapes its sandbox while GhostLock carries it to root.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Nebula Security disclosed GhostLock (CVE-2026-43499), a 15-year-old Linux kernel flaw that can let any logged-in user gain root control on an unpatched machine.","The vulnerable code has shipped by default in essentially every mainstream Linux distribution since 2011 and requires no special permission, unusual settings, or network access.","Nebula developed a working exploit that was 97% reliable in its testing, escapes containers, and took about five seconds on its test machine.","The flaw was fixed in April, but distributions are still rolling out patches, and the article says users should install their distribution’s current kernel rather than only the first patched build.","Nebula says GhostLock is the second half of its IonStack chain, where a Firefox flaw runs code inside the browser and escapes its sandbox while GhostLock provides root access."],"insights":["The article warns that installing the first patched kernel may not be enough because the original GhostLock fix introduced a separate crash bug, CVE-2026-53166, so administrators should use the current kernel package confirmed by their distribution.","GhostLock is rated high rather than critical because it requires local access, but the article shows that this limitation can be removed when it is chained with a browser flaw such as CVE-2026-10702 in Firefox.","Shared and multi-tenant environments are the most urgent patching targets because the exploit needs only an ordinary local foothold and can escape containers.","The article highlights a broader pattern in 2026 Linux privilege-escalation flaws: automated tools such as Nebula’s VEGA and Anthropic’s Mythos are finding bugs in old, heavily used kernel code that had existed for years."],"referencedReports":[{"title":"IonStack Part 2","url":"https://nebusec.ai/research/ionstack-part-2/","publisher":"Nebula Security","context":"The article cites Nebula Security's research as the disclosure source for GhostLock (CVE-2026-43499).","category":"","primary":false}],"body":"\u003cp\u003eResearchers at Nebula Security disclosed GhostLock (CVE-2026-43499), a 15-year-old Linux kernel flaw that lets any logged-in user gain full root control on an unpatched machine. The vulnerable code has shipped by default in essentially every mainstream Linux distribution since 2011. Nebula developed a working exploit that was 97% reliable in testing, escapes containers, and took about five seconds on its test machine.\u003c/p\u003e\n\n\u003cp\u003eThe flaw needs no special permissions, unusual settings, or network access because ordinary threading calls from any local program are enough. It is a use-after-free bug caused by a cleanup step that runs at the wrong moment during a failed lock operation and leaves the kernel trusting a stale pointer. The flaw was fixed in April, but distributions are still rolling out patches, and the article warns that the original fix introduced a separate crash bug, CVE-2026-53166.\u003c/p\u003e\n\n\u003cp\u003eThe article says there is no complete workaround because the operations that trigger the issue are routine for local processes. It recommends installing the distribution’s current kernel and prioritizing shared and multi-tenant machines, cloud servers, containers, and CI runners. GhostLock is also part of Nebula’s IonStack chain, where a Firefox flaw runs code inside the browser and escapes its sandbox while GhostLock carries it to root.\u003c/p\u003e\n"},{"n":37,"title":"Emerging Threat: (CVE-2026-57517) Control Web Panel Remote Code Execution via SQL Injection","source":"cycognito.com","sourceColorIdx":2,"link":"https://www.cycognito.com/blog/emerging-threat-cve-2026-57517-control-web-panel-remote-code-execution-via-sql-injection/","time":"11:49","priority":"SHOULD READ","score":89,"tldr":"CVE-2026-57517 is a critical unauthenticated blind SQL injection in Control Web Panel 0.9.8.1224 and earlier that can be chained to write PHP files and achieve remote code execution. Organizations should upgrade to 0.9.8.1225 or later and restrict access to CWP management ports immediately.","briefOverview":"\u003cp\u003eCVE-2026-57517 is a critical blind SQL injection vulnerability in Control Web Panel caused by insufficient sanitization of the userRes POST parameter before it is used in a SQL query. The flaw affects Control Web Panel versions 0.9.8.1224 and earlier and has a CVSS v3.1 base score of 9.8. Exploitation does not require a login session, but it does require the attacker to know or correctly guess the username of a valid non-root account on the target instance.\u003c/p\u003e\n\n\u003cp\u003eThe impact extends beyond data exposure because the MySQL root account on a CWP install has the global FILE privilege. Researchers demonstrated that an attacker can use INTO DUMPFILE to write arbitrary files to writable locations on the server, including a PHP payload in a web-accessible logs directory. This can result in remote code execution with the privileges of the cwpsvc account.\u003c/p\u003e\n\n\u003cp\u003eThe vendor fixed the issue in Control Web Panel version 0.9.8.1225, and the article says organizations running earlier versions should prioritize upgrading. A public proof of concept is already available, increasing the likelihood of opportunistic scanning and exploitation attempts against unpatched instances. The article also recommends inventorying CWP instances, restricting access to port 2083, auditing usernames, monitoring logs for anomalous userRes values, checking for unexpected PHP files, and rotating MySQL root credentials when immediate patching is not possible.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-57517 is a blind SQL injection vulnerability in the Control Web Panel user endpoint caused by insufficient sanitization of the userRes POST parameter.","The vulnerability affects Control Web Panel versions 0.9.8.1224 and earlier and has been fixed in version 0.9.8.1225.","Exploitation does not require a login session, but it does require the attacker to know or correctly guess the username of a valid non-root account on the target CWP instance.","Researchers demonstrated that the vulnerability
