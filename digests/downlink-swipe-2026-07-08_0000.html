ing activity tied to GStack’s /browse skill running under Claude Code. Other examples included Claude Code enumerating Windows Credential Manager with cmdkey /list, OpenAI Codex switching from certutil to bitsadmin after a download attempt was blocked, and Cursor writing a PowerShell script into the startup folder.\u003c/p\u003e\n\n\u003cp\u003eThe article says these behaviors matter because similar actions can now come from benign AI agents, attacker-run agents, or hijacked agents acting inside a user’s trusted session. Sophos suggests that some execution-related noise can be scoped around known agent parent processes, workspaces, temp paths, or download reputation. However, it says credential-touching behavior should remain restricted, and it specifically points to disabling Claude Code’s \u0026ndash;dangerously-skip-permissions mode through managed settings when that mode causes noise.\u003c/p\u003e\n"},{"n":20,"title":"New Ghost Phishing Wave Is Breaking Traditional Email Security","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/new-ghost-phishing-wave-is-breaking.html","time":"13:00","priority":"SHOULD READ","score":78,"tldr":"A new EvilTokens “ghost phishing” campaign hides encrypted phishing content until it decrypts inside the victim’s browser, allowing Microsoft 365 device-code account takeover to evade traditional URL and email security checks. The key takeaway is that defenders need browser-level sandbox visibility to see the real attack behavior and respond before accounts are compromised.","briefOverview":"\u003cp\u003eA recent EvilTokens campaign targeting businesses across the United States and Europe is using a “ghost phishing” technique that hides the malicious page until it decrypts inside the victim’s browser. The attack targets Microsoft 365 access by using Microsoft Device Code Phishing, which convinces victims to complete a legitimate Microsoft login flow and unknowingly authorize account access. The article says this creates a blind spot for traditional email security because static URL checks and network-level controls may not see what the employee actually sees in the browser.\u003c/p\u003e\n\n\u003cp\u003eThe phishing page’s HTML is encrypted with AES-GCM and only becomes visible after the browser decrypts it and renders the content in the DOM. The article says this can lead to longer exposure to Microsoft 365 account takeover, delayed containment, unauthorized access to corporate email, files, and cloud services, and incomplete evidence for blocking related infrastructure. ANY.RUN’s Threat Intelligence reports recent EvilTokens activity across sectors including technology, manufacturing, education, banking, consulting, financial services, and managed security providers.\u003c/p\u003e\n\n\u003cp\u003eThe article presents ANY.RUN’s Interactive Sandbox as a way to expose the full browser-level attack flow. It says analysts can observe decrypted DOM content, Fetch/XHR requests, URL details, indicators, and the Microsoft device code traced back to the /api/device/start endpoint. It also says the investigation can generate a report with an AI summary and recommended next steps to support faster handoffs from Tier 1 to Tier 2 analysts.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A recent EvilTokens campaign targeting businesses across the United States and Europe uses a “ghost phishing” technique that keeps the malicious page hidden until it decrypts inside the victim’s browser.","The kit uses Microsoft Device Code Phishing to convince victims to complete a legitimate Microsoft login flow and unknowingly authorize access to their Microsoft 365 accounts without directly stealing the password.","The phishing page’s HTML is encrypted with AES-GCM and becomes visible only after the browser decrypts it and renders the phishing content in the DOM, which can cause static URL checks and network-level controls to miss what the employee sees.","ANY.RUN’s Threat Intelligence reports recent EvilTokens activity against sectors including technology, manufacturing, education, banking, consulting, financial services, and managed security providers.","The article says ANY.RUN’s Interactive Sandbox can expose the attack flow by showing decrypted DOM content, HTTP requests, URL details, indicators, and an auto-generated report for analyst handoff."],"insights":["A clean initial URL or email inspection result is not enough to clear a suspicious link because the article says the real phishing content may only appear after browser-side decryption and rendering.","The attack does not need to capture a user’s password directly; by abusing Microsoft’s device code login flow, it can trick the user into authorizing account access through a legitimate Microsoft process.","The most actionable evidence for this type of phishing is found after page rendering, including DOM changes, Fetch/XHR activity, and the /api/device/start endpoint tied to the Microsoft device-code flow.","The article highlights a handoff problem in security operations: without browser-level evidence, senior analysts may receive uncertain escalations and have to rebuild the case from incomplete data.","The sectors named as current EvilTokens targets overlap with industries where ANY.RUN reports high phishing exposure, making a single Microsoft 365 account compromise especially consequential for consulting, financial services, manufacturing, technology, banking, and MSSPs."],"referencedReports":[],"body":"\u003cp\u003eA recent EvilTokens campaign targeting businesses across the United States and Europe is using a “ghost phishing” technique that hides the malicious page until it decrypts inside the victim’s browser. The attack targets Microsoft 365 access by using Microsoft Device Code Phishing, which convinces victims to complete a legitimate Microsoft login flow and unknowingly authorize account access. The article says this creates a blind spot for traditional email security because static URL checks and network-level controls may not see what the employee actually sees in the browser.\u003c/p\u003e\n\n\u003cp\u003eThe phishing page’s HTML is encrypted with AES-GCM and only becomes visible after the browser decrypts it and renders the content in the DOM. The article says this can lead to longer exposure to Microsoft 365 account takeover, delayed containment, unauthorized access to corporate email, files, and cloud services, and incomplete evidence for blocking related infrastructure. ANY.RUN’s Threat Intelligence reports recent EvilTokens activity across sectors including technology, manufacturing, education, banking, consulting, financial services, and managed security providers.\u003c/p\u003e\n\n\u003cp\u003eThe article presents ANY.RUN’s Interactive Sandbox as a way to expose the full browser-level attack flow. It says analysts can observe decrypted DOM content, Fetch/XHR requests, URL details, indicators, and the Microsoft device code traced back to the /api/device/start endpoint. It also says the investigation can generate a report with an AI summary and recommended next steps to support faster handoffs from Tier 1 to Tier 2 analysts.\u003c/p\u003e\n"},{"n":44,"title":"UK Cybercrime Journal: SMS Blaster Gang Convicted","source":"blog.bushidotoken.net","sourceColorIdx":2,"link":"https://blog.bushidotoken.net/2026/07/uk-cybercrime-journal-sms-blaster-gang.html","time":"08:00","priority":"SHOULD READ","score":78,"tldr":"UK police secured a conviction against an organiser behind a London SMS Blaster operation that sent spoofed HMRC smishing texts to tens of thousands of people by forcing nearby phones onto 2G. The case highlights how criminals can bypass SMS safeguards locally and why organisations should move away from SMS-based authentication.","briefOverview":"\u003cp\u003eCity of London Police’s Dedicated Card and Payment Crime Unit secured the conviction of Di Li for his role in an organised SMS Blaster fraud operation in London. The investigation had previously led to the sentencing of Ruichen Xiong in July 2025, after he was caught driving in North London while the device was operating. Between 22 and 27 March 2025, Xiong drove around London using the SMS Blaster to send messages to tens of thousands of potential victims, including fraudulent texts purporting to be from HMRC.\u003c/p\u003e\n\n\u003cp\u003eInvestigators identified Li as a key organiser who arranged access to the device, helped obtain a vehicle, and supported Xiong’s day-to-day living costs. The article says Xiong had built up significant gambling debts after arriving in the UK as a student, and Li instructed that he could repay what he owed by driving routes with the SMS Blaster. Police recovered digital evidence from Li’s home showing communications between Li and Xiong about deployment of the device, and Li was later arrested and charged.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that an SMS Blaster acts like a portable mobile phone mast that forces nearby phones to connect by silently downgrading them to 2G. This allows criminals to bypass safeguards, spoof trusted senders such as HMRC, and deliver fraudulent messages to nearby victims without needing their phone numbers. The defensive takeaways include reporting suspicious texts to 7726, moving away from SMS-based one-time passcodes, and using proactive domain monitoring to detect and take down malicious lookalike domains.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["City of London Police’s Dedicated Card and Payment Crime Unit secured the conviction of Di Li for his role in an organised London operation that used an SMS Blaster device to send fraudulent text messages.","Ruichen Xiong drove around London between 22 and 27 March 2025 using the SMS Blaster to send messages to tens of thousands of potential victims, including messages purporting to be from HMRC.","Investigators said Li arranged access to the SMS Blaster, helped obtain a vehicle, and supported Xiong’s day-to-day living costs after Xiong accrued significant gambling debts.","An SMS Blaster can force nearby mobile devices to connect through 2G, allowing criminals to send spoofed fraudulent messages without needing victims’ phone numbers.","The article recommends reporting suspicious texts to 7726, moving away from SMS-based one-time passcodes, and monitoring for malicious lookalike domains."],"insights":["SMS Blaster attacks can make a fraudulent message appear to come from a trusted organisation like HMRC while avoiding normal sender-blocking safeguards, which makes SMS-based trust cues unreliable for nearby victims.","The operation did not require the criminals to know victims’ phone numbers, because the device could deliver scam messages directly to nearby phones in busy areas.","The article highlights SMS one-time passcodes as a weak authentication method in this scenario and recommends authenticator apps, hardware tokens, or app push notifications instead.","The case shows that financially vulnerable people, such as students with gambling debts, can be recruited into high-risk in-person cybercrime roles by organised gangs.","Because the scam still depends on malicious links that host credential-harvesting websites, rapid detection and takedown of lookalike domains can reduce the impact even when the text messages are successfully delivered."],"referencedReports":[],"body":"\u003cp\u003eCity of London Police’s Dedicated Card and Payment Crime Unit secured the conviction of Di Li for his role in an organised SMS Blaster fraud operation in London. The investigation had previously led to the sentencing of Ruichen Xiong in July 2025, after he was caught driving in North London while the device was operating. Between 22 and 27 March 2025, Xiong drove around London using the SMS Blaster to send messages to tens of thousands of potential victims, including fraudulent texts purporting to be from HMRC.\u003c/p\u003e\n\n\u003cp\u003eInvestigators identified Li as a key organiser who arranged access to the device, helped obtain a vehicle, and supported Xiong’s day-to-day living costs. The article says Xiong had built up significant gambling debts after arriving in the UK as a student, and Li instructed that he could repay what he owed by driving routes with the SMS Blaster. Police recovered digital evidence from Li’s home showing communications between Li and Xiong about deployment of the device, and Li was later arrested and charged.\u003c/p\u003e\n\n\u003cp\u003eThe article explains that an SMS Blaster acts like a portable mobile phone mast that forces nearby phones to connect by silently downgrading them to 2G. This allows criminals to bypass safeguards, spoof trusted senders such as HMRC, and deliver fraudulent messages to nearby victims without needing their phone numbers. The defensive takeaways include reporting suspicious texts to 7726, moving away from SMS-based one-time passcodes, and using proactive domain monitoring to detect and take down malicious lookalike domains.\u003c/p\u003e\n"},{"n":45,"title":"DHS Revives Critical Infrastructure Threat Sharing, Without the Legal Shield Industry Wants","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/dhs-revives-critical-infrastructure-threat-sharing-without-the-legal-shield-industry-wants/","time":"18:32","priority":"SHOULD READ","score":78,"tldr":"DHS has launched ANCHOR-CI to restore formal cyber and physical threat-sharing between government and critical infrastructure sectors, replacing the dismantled CIPAC system. However, the new structure lacks the liability protections industry relied on for candid discussions about sensitive incidents and vulnerabilities.","briefOverview":"\u003cp\u003eThe Department of Homeland Security has stood up a successor to the critical infrastructure partnership system it dismantled 15 months ago. The new advisory structure is called the Alliance of National Councils for Homeland Operational Resilience – Critical Infrastructure, or ANCHOR-CI. The move restores a formal channel for government and industry to discuss cyber and physical threats.\u003c/p\u003e\n\n\u003cp\u003eA key difference from the former system is that ANCHOR-CI does not include the liability protections that industry participants valued under CIPAC. Those protections gave executives confidence to discuss incidents in group settings without antitrust or regulatory exposure. The DHS filing establishing ANCHOR-CI omits those protections.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, flagged the gap in the new structure. He said the government must address the legal exposures that keep companies from discussing sensitive cyber incidents. The article notes that industry leaders relied on CIPAC protections to hold candid, strategic conversations about vulnerabilities.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The Department of Homeland Security has established the Alliance of National Councils for Homeland Operational Resilience – Critical Infrastructure, known as ANCHOR-CI, as a successor to the critical infrastructure partnership system it dismantled 15 months ago.","ANCHOR-CI restores a formal channel for government and industry to discuss cyber and physical threats.","The DHS filing establishing ANCHOR-CI omits the liability protections that participants had under the former Critical Infrastructure Partnership Advisory Council system.","Errol Weiss, chief security officer at Health-ISAC, said the government must address the legal exposures that keep companies from discussing sensitive cyber incidents.","Industry leaders relied on CIPAC protections to hold candid, strategic conversations about vulnerabilities."],"insights":["The article shows that the value of the former threat-sharing system depended not only on having a government-industry forum, but on legal protections that made sensitive group discussions safer for participants.","The main barrier identified by Health-ISAC is not technical capability, but executives’ concern about antitrust or regulatory exposure when discussing incidents in group settings.","The revived structure may restore formal communication while still failing to recreate the conditions that industry leaders used for candid, strategic conversations about vulnerabilities."],"referencedReports":[],"body":"\u003cp\u003eThe Department of Homeland Security has stood up a successor to the critical infrastructure partnership system it dismantled 15 months ago. The new advisory structure is called the Alliance of National Councils for Homeland Operational Resilience – Critical Infrastructure, or ANCHOR-CI. The move restores a formal channel for government and industry to discuss cyber and physical threats.\u003c/p\u003e\n\n\u003cp\u003eA key difference from the former system is that ANCHOR-CI does not include the liability protections that industry participants valued under CIPAC. Those protections gave executives confidence to discuss incidents in group settings without antitrust or regulatory exposure. The DHS filing establishing ANCHOR-CI omits those protections.\u003c/p\u003e\n\n\u003cp\u003eErrol Weiss, chief security officer at Health-ISAC, flagged the gap in the new structure. He said the government must address the legal exposures that keep companies from discussing sensitive cyber incidents. The article notes that industry leaders relied on CIPAC protections to hold candid, strategic conversations about vulnerabilities.\u003c/p\u003e\n"},{"n":39,"title":"pnpm 11.10 Hardens Registry Authentication to Block Token Redirection","source":"socket.dev","sourceColorIdx":2,"link":"https://socket.dev/blog/pnpm-11-1-hardens-registry-authentication?utm_medium=feed","time":"05:01","priority":"MAY READ","score":72,"tldr":"pnpm 11.10 adds a new registry authentication model that binds tokens to their intended registry and prevents project files from redirecting credentials to attacker-controlled hosts. The release also includes several smaller supply-chain hardening changes and an install path for the pre-release Rust-based pnpm v12.","briefOverview":"\u003cp\u003epnpm 11.10 was released as a small update with several supply chain hardening changes. Its main change is a new \u003ccode\u003e_auth\u003c/code\u003e setting that stores registry credentials in one structured value keyed by registry URL. pnpm reads \u003ccode\u003e_auth\u003c/code\u003e only from the environment or global config, not from project files, so a malicious or compromised \u003ccode\u003epnpm-workspace.yaml\u003c/code\u003e or \u003ccode\u003e.npmrc\u003c/code\u003e cannot redirect a valid token to another host.\u003c/p\u003e\n\n\u003cp\u003eThe new authentication approach also addresses a problem created when pnpm stopped expanding environment variables in registry credentials set from project files, which broke authentication for teams using \u003ccode\u003e.npmrc\u003c/code\u003e environment variables with private registries. The release adds an install path for the pre-release Rust-based pnpm v12 through \u003ccode\u003epnpm self-update next-12\u003c/code\u003e. Other hardening changes include rejecting deploy and pack-app output paths outside the project, preventing a repository from swapping in its own macOS code signer, fixing a prototype pollution hazard tied to a dependency named \u003ccode\u003e__proto__\u003c/code\u003e, stopping upstream registry credentials from being passed to install-accelerator servers, and adding a new Node.js release signing key.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["pnpm 11.10 introduces an `_auth` setting that stores registry credentials in one structured value keyed by registry URL.","pnpm reads `_auth` only from the environment or global config, not from project files, preventing a malicious `pnpm-workspace.yaml` or `.npmrc` from redirecting a valid token to another host.","The new `_auth` setting replaces legitimate uses of environment variables in `.npmrc` for private registries after pnpm stopped expanding those variables in project files in June.","pnpm 11.10 adds an install path for the pre-release Rust-based pnpm v12 using `pnpm self-update next-12`.","The release also hardens `pnpm deploy` and `pnpm pack-app`, fixes a prototype pollution hazard tied to a dependency named `__proto__`, stops passing upstream registry credentials to install-accelerator servers, and adds a new Node.js release signing key."],"insights":["Teams that moved registry tokens into project `.npmrc` files to support private registries now have a sanctioned replacement in `_auth`, because pnpm no longer treats project files as a safe place for credential expansion.","The security model in pnpm 11.10 focuses on reducing what a malicious repository can control, including registry destinations, deployment output paths, packaging output paths, and code-signing tool selection.","pnpm’s June hardening created compatibility problems for legitimate private-registry workflows, and version 11.10 addresses that by shifting trusted authentication configuration to global config or CI environment variables.","The pre-release pnpm v12 install path signals that pnpm’s Rust rewrite is moving from development work toward user testing, with the article specifically noting reduced startup overhead from removing the Node.js launcher."],"referencedReports":[],"body":"\u003cp\u003epnpm 11.10 was released as a small update with several supply chain hardening changes. Its main change is a new \u003ccode\u003e_auth\u003c/code\u003e setting that stores registry credentials in one structured value keyed by registry URL. pnpm reads \u003ccode\u003e_auth\u003c/code\u003e only from the environment or global config, not from project files, so a malicious or compromised \u003ccode\u003epnpm-workspace.yaml\u003c/code\u003e or \u003ccode\u003e.npmrc\u003c/code\u003e cannot redirect a valid token to another host.\u003c/p\u003e\n\n\u003cp\u003eThe new authentication approach also addresses a problem created when pnpm stopped expanding environment variables in registry credentials set from project files, which broke authentication for teams using \u003ccode\u003e.npmrc\u003c/code\u003e environment variables with private registries. The release adds an install path for the pre-release Rust-based pnpm v12 through \u003ccode\u003epnpm self-update next-12\u003c/code\u003e. Other hardening changes include rejecting deploy and pack-app output paths outside the project, preventing a repository from swapping in its own macOS code signer, fixing a prototype pollution hazard tied to a dependency named \u003ccode\u003e__proto__\u003c/code\u003e, stopping upstream registry credentials from being passed to install-accelerator servers, and adding a new Node.js release signing key.\u003c/p\u003e\n"},{"n":15,"title":"Cash App owner to pay $45 million to settle allegations of lax security","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/cash-app-owner-to-pay-45-million-security-allegations","time":"20:14","priority":"MAY READ","score":70,"tldr":"Block, the owner of Cash App, will pay $45 million to settle allegations from 46 states that it misled users about Cash App’s security and failed to protect or help fraud victims. The settlement also requires stronger customer support, including live support coverage.","briefOverview":"\u003cp\u003eBlock, Inc., the owner of Cash App, will pay $45 million to dozens of states to settle allegations that it misled users about the payment app’s security and exposed them to fraud. State attorneys general said the company incorrectly promised users that Cash App offered the same protections as a bank. New York Attorney General Letitia James said Block failed to help users when they were scammed and failed to provide promised and legally required fraud protection and resolution.\u003c/p\u003e\n\n\u003cp\u003eThe agreement involved 46 states, with Texas receiving \u003cspan class=\"math inline\"\u003e\\(5 million and New York receiving \\)\u003c/span\u003e1.6 million. Texas Attorney General Ken Paxton said lax verification standards, a years-long absence of phone support, and deceptive social media promotions left users exposed to scammers. Investigators found that users searching online for a Cash App support number sometimes called fake numbers set up by scammers because the app had no customer support phone number.\u003c/p\u003e\n\n\u003cp\u003eInvestigators also found that Cash App did not require a Social Security number or date of birth for signup and did not limit how many accounts one person could open. The New York consent judgment requires Block to maintain live support 24 hours a day, with at least 13.5 hours covered by a real person. The agreement also reaffirms a related January 2025 Consumer Financial Protection Bureau consent order requiring Block to distribute between \u003cspan class=\"math inline\"\u003e\\(75 million and \\)\u003c/span\u003e120 million to states.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Block, Inc., the owner of Cash App, will pay $45 million to settle allegations by dozens of states that it misled users about Cash App’s security and exposed them to fraud.","State attorneys general said Block incorrectly promised users that Cash App offered the same protections as a bank.","Investigators found that Cash App had no customer support phone number for years, leading some users to call fake support numbers set up by scammers.","Investigators said Cash App did not require a Social Security number or date of birth for signup and did not limit how many accounts one person could open.","The consent judgment requires Block to maintain 24-hour live support, with at least 13.5 hours covered by a real person."],"insights":["The absence of an official Cash App support phone number created an opportunity for scammers to capture users who searched online for help and called fake support lines.","The settlement treats customer support availability as a security issue by requiring Block to maintain 24-hour live support with at least 13.5 hours handled by a real person.","Investigators linked weak signup requirements, including no Social Security number or date of birth and no limit on accounts per person, to the ability of one bad actor to operate a network of scam accounts.","The $45 million state settlement is separate from and reaffirms a related federal agreement requiring Block to distribute between $75 million and $120 million to states under a January 2025 CFPB consent order."],"referencedReports":[],"body":"\u003cp\u003eBlock, Inc., the owner of Cash App, will pay $45 million to dozens of states to settle allegations that it misled users about the payment app’s security and exposed them to fraud. State attorneys general said the company incorrectly promised users that Cash App offered the same protections as a bank. New York Attorney General Letitia James said Block failed to help users when they were scammed and failed to provide promised and legally required fraud protection and resolution.\u003c/p\u003e\n\n\u003cp\u003eThe agreement involved 46 states, with Texas receiving \u003cspan class=\"math inline\"\u003e\\(5 million and New York receiving \\)\u003c/span\u003e1.6 million. Texas Attorney General Ken Paxton said lax verification standards, a years-long absence of phone support, and deceptive social media promotions left users exposed to scammers. Investigators found that users searching online for a Cash App support number sometimes called fake numbers set up by scammers because the app had no customer support phone number.\u003c/p\u003e\n\n\u003cp\u003eInvestigators also found that Cash App did not require a Social Security number or date of birth for signup and did not limit how many accounts one person could open. The New York consent judgment requires Block to maintain live support 24 hours a day, with at least 13.5 hours covered by a real person. The agreement also reaffirms a related January 2025 Consumer Financial Protection Bureau consent order requiring Block to distribute between \u003cspan class=\"math inline\"\u003e\\(75 million and \\)\u003c/span\u003e120 million to states.\u003c/p\u003e\n"},{"n":16,"title":"Greek victims file lawsuit against Intellexa over Predator spyware","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/greek-victims-file-lawsuit-against-intellexa-spyware","time":"20:20","priority":"MAY READ","score":68,"tldr":"Eight Greeks allegedly targeted with Predator spyware are suing Intellexa and 13 associated individuals for about €7.6 million in damages over privacy and communications violations. The case follows Greece’s Predator scandal, prior prison sentences for Intellexa’s founder and associates, and claims by the founder that the Greek government was responsible for targeting.","briefOverview":"\u003cp\u003eEight Greeks who were snooped on by Predator spyware sued surveillance technology manufacturer Intellexa on Tuesday, along with 13 individuals tied to the company. Their lawyer, Zacharias Kesses, said the victims are seeking about €7.6 million in total compensation. The damages are meant to address alleged moral harm from illegal violations of privacy, communications confidentiality, and personal data after spyware was confirmed on their devices.\u003c/p\u003e\n\n\u003cp\u003eThe Predator spyware scandal became public in 2022, when traces of the spyware were found on dozens of phones. The scandal led to the resignations of Greece’s intelligence service chief and the prime minister’s chief of staff. Plaintiffs in the lawsuit include a former Meta security manager, financial journalist Thanassis Koukakis, two lawyers, a former director of the Hellenic Police’s Forensic Laboratories, the former head of a Greek intelligence agency, journalist Spyridon Sideris, and a former intelligence and law enforcement official.\u003c/p\u003e\n\n\u003cp\u003eA trial is scheduled to start in April 2027. Intellexa founder Tal Dilian and three associates were previously sentenced to more than 126 years in prison for their role in the scandal, but under Greek law they will serve only 8 years and remain free until the appeals process ends. Dilian has said Intellexa sold Predator only to government customers, including the Greek government and its national intelligence agency, and accused them of using the case to hide their own wrongdoing.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Eight Greeks who were snooped on by Predator spyware sued Intellexa and 13 individuals tied to the company on Tuesday.","The victims are seeking about €7.6 million in total compensation for alleged moral damage from violations of their privacy, communications confidentiality and personal data.","The Predator spyware scandal became public in 2022 after traces were found on dozens of phones and led to the resignations of Greece’s intelligence service chief and the prime minister’s chief of staff.","Plaintiffs include a former Meta security manager, financial journalist Thanassis Koukakis, two lawyers, a former director of the Hellenic Police’s Forensic Laboratories, the former head of a Greek intelligence agency, journalist Spyridon Sideris and a former intelligence and law enforcement official.","Intellexa founder Tal Dilian and three associates were sentenced to more than 126 years in prison, but under Greek law they will serve only 8 years and remain free until appeals end."],"insights":["The civil lawsuit targets not only Intellexa but also 13 individuals tied to the company, indicating the plaintiffs are pursuing accountability across the alleged company and personal network behind Predator rather than only the corporate entity.","The lawsuit is framed as a step toward accountability at both national and European levels, showing the case may have significance beyond compensation for the eight named victims.","Tal Dilian’s public defense shifts responsibility to the Greek government and national intelligence agency, creating a direct conflict between the spyware vendor’s account and the accountability process described by the victims’ lawyer.","Although Intellexa’s founder and associates received sentences totaling more than 126 years, the article notes they would serve only 8 years under Greek law and remain free during appeals, highlighting a major gap between headline sentences and immediate consequences."],"referencedReports":[],"body":"\u003cp\u003eEight Greeks who were snooped on by Predator spyware sued surveillance technology manufacturer Intellexa on Tuesday, along with 13 individuals tied to the company. Their lawyer, Zacharias Kesses, said the victims are seeking about €7.6 million in total compensation. The damages are meant to address alleged moral harm from illegal violations of privacy, communications confidentiality, and personal data after spyware was confirmed on their devices.\u003c/p\u003e\n\n\u003cp\u003eThe Predator spyware scandal became public in 2022, when traces of the spyware were found on dozens of phones. The scandal led to the resignations of Greece’s intelligence service chief and the prime minister’s chief of staff. Plaintiffs in the lawsuit include a former Meta security manager, financial journalist Thanassis Koukakis, two lawyers, a former director of the Hellenic Police’s Forensic Laboratories, the former head of a Greek intelligence agency, journalist Spyridon Sideris, and a former intelligence and law enforcement official.\u003c/p\u003e\n\n\u003cp\u003eA trial is scheduled to start in April 2027. Intellexa founder Tal Dilian and three associates were previously sentenced to more than 126 years in prison for their role in the scandal, but under Greek law they will serve only 8 years and remain free until the appeals process ends. Dilian has said Intellexa sold Predator only to government customers, including the Greek government and its national intelligence agency, and accused them of using the case to hide their own wrongdoing.\u003c/p\u003e\n"},{"n":30,"title":"The OneDrive Share Notice Everyone Clicks, Undone by the Attacker's Own Broken Template","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/onedrive-share-notification-fresh-domain-leaked-kit-template-credential-harvest","time":"11:00","priority":"MAY READ","score":68,"tldr":"A phishing email impersonating a OneDrive file-share notice passed SPF, DKIM, and DMARC because it used legitimate sending infrastructure, but behavioral signals exposed it: an unrelated sender domain, a newly registered payload domain, and broken template variables in the fake reply chain. The key takeaway is that email authentication and reputation checks alone are not enough to catch credential-harvesting attacks.","briefOverview":"\u003cp\u003eA credential-harvesting email impersonated a Microsoft OneDrive document-share notification sent to the chief financial officer at a consumer-goods organization. The message used familiar OneDrive styling, echoed the recipient’s address, and presented a blue “AccessFile” link to access a supposedly shared document. It also included a fabricated reply chain about a quarterly review, file permissions, and folder placement to make the lure appear like part of an existing internal discussion.\u003c/p\u003e\n\n\u003cp\u003eThe email came from admin2@unrelated-domain[.]de, which had no relationship to Microsoft, OneDrive, or the recipient’s company. Despite that mismatch, SPF, DKIM, and DMARC all passed because the attacker used a legitimate third-party delivery service and a properly configured sending domain. The article emphasizes that these authentication checks confirmed authorized delivery infrastructure, but did not prove that the message content or claimed brand was legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe “AccessFile” link redirected through link.unrelated-domain[.]de to document.boomgodbold[.]co[.]uk, a domain registered on 2026-05-29 and described as a credential-harvest landing page. The phishing kit also exposed broken merge fields and raw template variables inside the fake reply chain, producing malformed reply addresses and revealing the automated nature of the message. Behavioral detection quarantined and mitigated the message by correlating the OneDrive brand mismatch, prior display-name history, the freshly registered destination, and phishing-like language patterns.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A credential-harvesting email impersonated a Microsoft OneDrive document-share notification sent to the chief financial officer at a consumer-goods organization.","The message came from admin2@unrelated-domain[.]de, which had no relationship to Microsoft, OneDrive, or the recipient’s company, even though SPF, DKIM, and DMARC all passed.","The AccessFile link redirected through link.unrelated-domain[.]de to document.boomgodbold[.]co[.]uk, a domain registered on 2026-05-29 and used as the credential-harvest landing page.","The phishing kit exposed unfilled merge fields and raw template variables in the fabricated reply chain, creating malformed reply addresses that revealed the email was automated mass phishing.","The message was quarantined and mitigated after behavioral detection correlated the brand-to-domain mismatch, prior display-name history, freshly registered destination, and phishing-like language patterns."],"insights":["Passing SPF, DKIM, and DMARC did not make the email trustworthy, because those checks only showed that the sender’s infrastructure was authorized, not that the OneDrive claim was truthful.","The external-sender banner was one of the clearest warning signs because it directly exposed the mismatch between a supposed Microsoft OneDrive notice and an unrelated German sender domain.","The newly registered payload domain mattered precisely because it had little or no reputation history, leaving reputation-based defenses with nothing established to score against.","The broken merge fields were highly revealing because they showed the message was produced by an automated phishing kit rather than being part of a real internal discussion.","The article’s practical recommendation is to verify file-share invitations inside the actual platform instead of using email links, especially when the message is marked as coming from an external sender."],"referencedReports":[{"title":"2024 Internet Crime Report","url":"https://www.ic3.gov/AnnualReport/Reports/2024_IC3Report.pdf","publisher":"FBI","context":"The article cites the FBI report to note that business email compromise remains among the costliest cybercrime categories and that credential theft is a common entry point.","category":"","primary":false},{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/T742/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"Verizon","context":"The article cites Verizon's report for statistics that stolen credentials feature in 39 percent of breaches across the kill chain and phishing drives 16 percent of initial access.","category":"","primary":false},{"title":"Microsoft Digital Defense Report 2024","url":"https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2024","publisher":"Microsoft","context":"The article cites Microsoft's report as documenting attackers' use of brand impersonation and short-lived infrastructure to avoid reputation scoring.","category":"","primary":false},{"title":"T1583.001: Acquire Infrastructure: Domains","url":"https://attack.mitre.org/techniques/T1583/001/","publisher":"MITRE ATT\u0026CK","context":"The article references this MITRE ATT\u0026CK technique to describe attackers acquiring domains as infrastructure for the phishing campaign.","category":"","primary":false},{"title":"T1566.002: Phishing: Spearphishing Link","url":"https://attack.mitre.org/techniques/T1566/002/","publisher":"MITRE ATT\u0026CK","context":"The article lists this MITRE ATT\u0026CK technique for the credential-harvesting link used in the OneDrive impersonation email.","category":"","primary":false}],"body":"\u003cp\u003eA credential-harvesting email impersonated a Microsoft OneDrive document-share notification sent to the chief financial officer at a consumer-goods organization. The message used familiar OneDrive styling, echoed the recipient’s address, and presented a blue “AccessFile” link to access a supposedly shared document. It also included a fabricated reply chain about a quarterly review, file permissions, and folder placement to make the lure appear like part of an existing internal discussion.\u003c/p\u003e\n\n\u003cp\u003eThe email came from admin2@unrelated-domain[.]de, which had no relationship to Microsoft, OneDrive, or the recipient’s company. Despite that mismatch, SPF, DKIM, and DMARC all passed because the attacker used a legitimate third-party delivery service and a properly configured sending domain. The article emphasizes that these authentication checks confirmed authorized delivery infrastructure, but did not prove that the message content or claimed brand was legitimate.\u003c/p\u003e\n\n\u003cp\u003eThe “AccessFile” link redirected through link.unrelated-domain[.]de to document.boomgodbold[.]co[.]uk, a domain registered on 2026-05-29 and described as a credential-harvest landing page. The phishing kit also exposed broken merge fields and raw template variables inside the fake reply chain, producing malformed reply addresses and revealing the automated nature of the message. Behavioral detection quarantined and mitigated the message by correlating the OneDrive brand mismatch, prior display-name history, the freshly registered destination, and phishing-like language patterns.\u003c/p\u003e\n"},{"n":42,"title":"Introducing Secret Exfiltration Protection for GitHub Actions","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/introducing-secret-exfiltration-protection-for-github-actions","time":"19:46","priority":"MAY READ","score":68,"tldr":"Recent supply chain campaigns show attackers are using stolen GitHub tokens to add malicious GitHub Actions workflows that dump repository secrets from CI runners. StepSecurity is introducing controls to block unreviewed workflows from accessing secrets and detect exfiltration attempts when they run.","briefOverview":"\u003cp\u003eStepSecurity describes recent supply chain campaigns in which attackers used stolen GitHub tokens to commit malicious GitHub Actions workflows into repositories. The workflows caused CI runners to read repository secrets and exfiltrate them before the run finished. The article highlights GhostAction, Megalodon, Miasma, and Hades as campaigns that used or evolved toward this pattern.\u003c/p\u003e\n\n\u003cp\u003eGhostAction reached 327 users across 817 repositories and stole 3,325 secrets, while Megalodon injected backdoored workflow files into more than 5,500 repositories in a six-hour window. Hades planted a workflow named Run Copilot that used toJSON(secrets) to dump repository secrets into a file, uploaded it as an artifact named format-results, and then deleted evidence such as the run and branch. The article says branch protection and code review often miss this activity because attackers can push workflows to temporary non-default branches without opening pull requests.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity presents two defenses for this problem: a Secret Exfiltration Policy and a Secret Exfiltration Attempt detection in Harden-Runner. The policy blocks unreviewed modified workflows in non-default branches from using secrets unless explicitly approved. The detection flags runs that combine indicators such as known malicious workflow names, toJSON(secrets), matching commit messages, and exfiltration artifacts, and notifications can be enabled for these detections.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article says recent supply chain campaigns used stolen GitHub tokens to commit malicious GitHub Actions workflows that allowed CI runners to read and exfiltrate repository secrets.","The GhostAction campaign reached 327 users across 817 repositories and stole 3,325 secrets, including npm, PyPI, and DockerHub tokens.","The Megalodon campaign injected backdoored workflow files into more than 5,500 repositories in a six-hour window by targeting repositories where branch protection did not require review.","The Hades campaign committed a workflow named Run Copilot that used toJSON(secrets) to dump repository secrets into a file, uploaded it as an artifact named format-results, then deleted the run and branch.","StepSecurity’s Secret Exfiltration Policy blocks unreviewed workflows from using secrets, while Harden-Runner’s Secret Exfiltration Attempt detection flags runs with indicators such as known workflow names, toJSON(secrets), matching commit messages, and exfiltration artifacts."],"insights":["Branch protection and code review can be bypassed when attackers push malicious workflows to temporary non-default branches, because no pull request is opened and the default branch is not changed.","Workflow files can look hardened while still being malicious, as the Hades payload used ordinary names, pinned GitHub Actions by commit SHA, and hid the secret-dumping behavior in an environment variable.","The CI runner is a high-value exfiltration point because it is described as the one place that legitimately holds every repository secret at once.","Detecting secret theft attempts is more effective when multiple signals appear together in one run, such as a known malicious workflow name, toJSON(secrets), a known commit message, and an exfiltration artifact.","The article emphasizes that prevention and detection serve different roles: blocking unreviewed workflow secret access stops the payoff, while detections help identify targeted repositories and guide follow-up actions such as secret rotation and token compromise investigation."],"referencedReports":[],"body":"\u003cp\u003eStepSecurity describes recent supply chain campaigns in which attackers used stolen GitHub tokens to commit malicious GitHub Actions workflows into repositories. The workflows caused CI runners to read repository secrets and exfiltrate them before the run finished. The article highlights GhostAction, Megalodon, Miasma, and Hades as campaigns that used or evolved toward this pattern.\u003c/p\u003e\n\n\u003cp\u003eGhostAction reached 327 users across 817 repositories and stole 3,325 secrets, while Megalodon injected backdoored workflow files into more than 5,500 repositories in a six-hour window. Hades planted a workflow named Run Copilot that used toJSON(secrets) to dump repository secrets into a file, uploaded it as an artifact named format-results, and then deleted evidence such as the run and branch. The article says branch protection and code review often miss this activity because attackers can push workflows to temporary non-default branches without opening pull requests.\u003c/p\u003e\n\n\u003cp\u003eStepSecurity presents two defenses for this problem: a Secret Exfiltration Policy and a Secret Exfiltration Attempt detection in Harden-Runner. The policy blocks unreviewed modified workflows in non-default branches from using secrets unless explicitly approved. The detection flags runs that combine indicators such as known malicious workflow names, toJSON(secrets), matching commit messages, and exfiltration artifacts, and notifications can be enabled for these detections.\u003c/p\u003e\n"},{"n":12,"title":"Former UK privacy chief preparing legal action against woman who reported him, minister says","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/former-uk-privacy-chief-preparing-legal-action-against-woman-who-reported-him","time":"14:20","priority":"MAY READ","score":62,"tldr":"UK science secretary Liz Kendall said she was appalled by independent findings of sexual harassment and bullying at the Information Commissioner’s Office involving former commissioner John Edwards, who recently resigned. She also said Edwards is preparing legal action against one of the women who reported concerns, prompting a wider independent review of the ICO’s culture, accountability and governance.","briefOverview":"\u003cp\u003eBritain’s former Information Commissioner John Edwards is preparing to file legal papers against a female employee who raised concerns about him, according to science secretary Liz Kendall. Kendall told the Science, Innovation and Technology Committee that she was “absolutely appalled” by the findings of “sexual harassment and bullying” made by an independent investigation at the Information Commissioner’s Office. The article says the nature of the complaints against Edwards had not previously been publicly reported.\u003c/p\u003e\n\n\u003cp\u003eEdwards announced his formal resignation in June after voluntarily stepping back from his duties in February amid a workplace investigation into what was then unspecified conduct. In a LinkedIn post, he said he did not agree with how the investigation had been conducted but accepted that his position had become untenable. He also wrote that he had exercised poor judgment and made attempts at humor that were inappropriate and caused offense.\u003c/p\u003e\n\n\u003cp\u003eKendall said the government will launch an independent review of the ICO’s culture, accountability and governance. She also said recruitment for Edwards’ successor would begin next week, alongside the appointment of a new board of non-executive directors, the majority of whom will be women. Kendall said the women who spoke up had been “incredibly brave” and should know they will be listened to without being put at personal risk.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Britain’s former Information Commissioner John Edwards is preparing to file legal papers against a female employee who raised concerns about him, according to science secretary Liz Kendall.","Liz Kendall told Parliament she was “absolutely appalled” by independent investigation findings of “sexual harassment and bullying” at the Information Commissioner’s Office.","Edwards formally resigned in June after stepping back from his duties in February amid a workplace investigation into his conduct.","Edwards wrote on LinkedIn that he had exercised poor judgment and made attempts at humor that were inappropriate and caused offense, while saying he disagreed with how the investigation was conducted.","Kendall said the government will launch an independent review of the ICO’s culture, accountability and governance, along with recruitment for Edwards’ successor and appointment of a new board of non-executive directors."],"insights":["The case has escalated from an individual resignation over “inappropriate humor” to a broader government concern about workplace culture, accountability and governance at the ICO.","Kendall’s statement that the women who spoke up were “incredibly brave” and should not be put at personal risk highlights the government’s concern about retaliation against people who report misconduct.","The government’s plan to appoint a new board of non-executive directors with a female majority shows that the response is intended to change oversight structures, not just replace the former commissioner.","The article notes that the nature of the complaints against Edwards had not previously been publicly reported, making Kendall’s committee testimony a significant disclosure about the investigation’s findings."],"referencedReports":[],"body":"\u003cp\u003eBritain’s former Information Commissioner John Edwards is preparing to file legal papers against a female employee who raised concerns about him, according to science secretary Liz Kendall. Kendall told the Science, Innovation and Technology Committee that she was “absolutely appalled” by the findings of “sexual harassment and bullying” made by an independent investigation at the Information Commissioner’s Office. The article says the nature of the complaints against Edwards had not previously been publicly reported.\u003c/p\u003e\n\n\u003cp\u003eEdwards announced his formal resignation in June after voluntarily stepping back from his duties in February amid a workplace investigation into what was then unspecified conduct. In a LinkedIn post, he said he did not agree with how the investigation had been conducted but accepted that his position had become untenable. He also wrote that he had exercised poor judgment and made attempts at humor that were inappropriate and caused offense.\u003c/p\u003e\n\n\u003cp\u003eKendall said the government will launch an independent review of the ICO’s culture, accountability and governance. She also said recruitment for Edwards’ successor would begin next week, alongside the appointment of a new board of non-executive directors, the majority of whom will be women. Kendall said the women who spoke up had been “incredibly brave” and should know they will be listened to without being put at personal risk.\u003c/p\u003e\n"},{"n":32,"title":"Mutation testing comes to DAML","source":"blog.trailofbits.com","sourceColorIdx":6,"link":"https://blog.trailofbits.com/2026/07/08/mutation-testing-comes-to-daml/","time":"11:00","priority":"MAY READ","score":58,"tldr":"Trail of Bits added DAML support to its Mewt mutation-testing tool, letting Canton Network developers test whether their suites actually catch authorization and logic mistakes rather than merely achieving coverage. The key takeaway is that surviving mutants expose missing negative tests, especially around DAML controller permissions, where green test runs and 100% coverage can still miss serious security gaps.","briefOverview":"\u003cp\u003eTrail of Bits expanded Mewt, its open-source mutation-testing engine, with support for DAML, the language used for Canton Network applications. Mewt can now read DAML, generate mutants, and run them through an existing test suite to count how many survive. The article says this gives teams shipping DAML to production a more meaningful measure of what their tests actually check than a passing test run alone.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that DAML coverage reports can be misleading because they show whether templates were created and choices were exercised, not whether tests verified the behavior inside those choices. Mutation testing instead makes small deliberate changes, such as flipped comparisons, removed branches, or changed parties, and checks whether the test suite fails. A surviving mutant represents either harmless equivalent code or a specific gap where the tests did not catch a behavior change.\u003c/p\u003e\n\n\u003cp\u003eFor DAML, Mewt adds controller party swap and controller party removal mutations to test whether changes to choice authorization would be caught. In the article’s conditional-payment example, a happy-path test and 100% coverage did not catch a mutant that changed a release choice from requiring both buyer and seller approval to requiring only the seller. The article also notes practical limits: mutation campaigns take time because the test suite runs once per mutant, and human review is needed because some surviving mutants are equivalent or unreachable.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Trail of Bits expanded its open-source Mewt mutation-testing engine with support for DAML, allowing it to read DAML code, generate mutants, and run them through existing test suites.","The article argues that DAML’s built-in coverage reports can be misleading because they show which templates and choices were exercised but do not prove that tests verify the results or catch incorrect behavior.","Mewt adds two DAML-specific authorization mutations: controller party swap, which replaces one party in a controller clause with another in scope, and controller party removal, which drops one party from a multi-party controller list.","In the article’s conditional-payment example, a test suite with 100% coverage failed to catch a mutant that changed the Release choice from requiring both buyer and seller approval to requiring only seller approval.","The article notes that mutation-testing campaigns require time to run and triage, and that some surviving mutants may be equivalent code or otherwise not represent real missing test cases."],"insights":["A DAML test suite can report 100% coverage even when it never checks whether a required party’s approval is actually required, because coverage only records that a choice was exercised.","Happy-path tests can hide authorization mistakes in DAML because they supply all requested signatures, so removing a required signer from the contract may not cause any existing test to fail.","Mewt was able to support many DAML mutations without a dedicated DAML parser by reusing the Haskell tree-sitter grammar, even though DAML-specific contract constructs are parsed as error-recovered subtrees.","Surviving mutants are not automatically bugs; in the OpenZeppelin canton-stablecoin example, some survivors were equivalent code or unreachable, while others represented genuine missing test cases.","The article presents negative tests that expect ledger rejection as the checkable form of authorization requirements, because static analysis cannot know which party should hold which authority in a contract."],"referencedReports":[],"body":"\u003cp\u003eTrail of Bits expanded Mewt, its open-source mutation-testing engine, with support for DAML, the language used for Canton Network applications. Mewt can now read DAML, generate mutants, and run them through an existing test suite to count how many survive. The article says this gives teams shipping DAML to production a more meaningful measure of what their tests actually check than a passing test run alone.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that DAML coverage reports can be misleading because they show whether templates were created and choices were exercised, not whether tests verified the behavior inside those choices. Mutation testing instead makes small deliberate changes, such as flipped comparisons, removed branches, or changed parties, and checks whether the test suite fails. A surviving mutant represents either harmless equivalent code or a specific gap where the tests did not catch a behavior change.\u003c/p\u003e\n\n\u003cp\u003eFor DAML, Mewt adds controller party swap and controller party removal mutations to test whether changes to choice authorization would be caught. In the article’s conditional-payment example, a happy-path test and 100% coverage did not catch a mutant that changed a release choice from requiring both buyer and seller approval to requiring only the seller. The article also notes practical limits: mutation campaigns take time because the test suite runs once per mutant, and human review is needed because some surviving mutants are equivalent or unreachable.\u003c/p\u003e\n"},{"n":31,"title":"Building a Mental Model for Kubernetes Security Research","source":"specterops.io","sourceColorIdx":1,"link":"https://specterops.io/blog/2026/07/08/building-a-mental-model-for-kubernetes-security-research/","time":"16:00","priority":"MAY READ","score":55,"tldr":"The article presents a Kubernetes/AKS security research framework that turns complex cluster identity, access, workload, and cloud-integration decisions into a reusable mental model and YAML/Terraform-based lab specification. Its core takeaway is that structured, scenario-driven environments make it easier to understand, test, and later analyze real production Kubernetes security posture.","briefOverview":"\u003cp\u003eThe article describes how the author used Codex to turn Kubernetes and Azure Kubernetes Service security research into a usable mental model and research framework. The author says the recurring challenge in production Kubernetes engagements is understanding a cluster’s security posture as identity, access, configuration, and application behavior change over time. The framework is intended to help organize those moving parts so researchers can deliberately create scenarios, study them, and later apply that understanding to real environments.\u003c/p\u003e\n\n\u003cp\u003eThe mental model separates Kubernetes into control-side and workload-side concerns, then explains how AKS extends those areas through Azure and Entra integration. It organizes cluster decisions into lenses such as cluster control, credential retrieval, authentication, authorization, admission, workload management, data and storage, computing, networking, and observability. The article emphasizes that these lenses make it easier to understand how different decisions combine to shape trust relationships, workload behavior, and attack surface.\u003c/p\u003e\n\n\u003cp\u003eThe author turned the model into a YAML-based cluster specification that Terraform realizes as AKS environments, with templates for scenarios such as local kubeconfig access, managed Entra authentication, Azure RBAC authorization, and workload identity. The workload side uses FastAPI applications to make authentication behavior visible through routes for runtime inspection, explanation, testing, and tracing. The broader goal is to use these controlled scenarios to build better tools and tradecraft for collecting and analyzing security posture in existing, changing production clusters.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article describes how Codex helped the author turn Kubernetes and AKS security research into a reusable mental model and research framework.","The framework organizes cluster decisions into lenses including cluster control, credential retrieval, authentication, authorization, admission, workload management, data and storage, computing, networking, and observability.","The author implemented the mental model as a YAML-based cluster specification that Terraform uses to deploy AKS scenarios shaped around the declared security and identity choices.","The framework includes scenario templates such as local-kubeconfig-baseline, entra-auth-baseline, and entra-azure-rbac-workload-identity-baseline to explore different trust models.","The workload side includes FastAPI applications that expose routes for inspecting runtime configuration and testing or tracing authentication mechanisms such as managed identity, client secret, certificate, and federated workload identity."],"insights":["Separating the cluster’s application side from its management side helps clarify why identity, authorization, and admission controls must be analyzed as different parts of the same control path rather than as isolated settings.","The same Kubernetes workload can behave differently depending on the surrounding AKS configuration, because cluster-level choices affect how the workload receives identity, authenticates, gets permissions, and interacts with services.","Organizing AKS configuration by security meaning rather than by provider settings makes the same framework useful both for designing lab scenarios and for reading back the posture of an existing environment.","The author found that many framework improvements could be made at the YAML specification and root translation layer without rewriting the Terraform modules underneath, keeping provider mechanics stable while improving scenario readability.","Making authentication flows visible through application routes such as runtime inspection, explanation, testing, and tracing turns normally hidden SDK and platform behavior into observable research data."],"referencedReports":[],"body":"\u003cp\u003eThe article describes how the author used Codex to turn Kubernetes and Azure Kubernetes Service security research into a usable mental model and research framework. The author says the recurring challenge in production Kubernetes engagements is understanding a cluster’s security posture as identity, access, configuration, and application behavior change over time. The framework is intended to help organize those moving parts so researchers can deliberately create scenarios, study them, and later apply that understanding to real environments.\u003c/p\u003e\n\n\u003cp\u003eThe mental model separates Kubernetes into control-side and workload-side concerns, then explains how AKS extends those areas through Azure and Entra integration. It organizes cluster decisions into lenses such as cluster control, credential retrieval, authentication, authorization, admission, workload management, data and storage, computing, networking, and observability. The article emphasizes that these lenses make it easier to understand how different decisions combine to shape trust relationships, workload behavior, and attack surface.\u003c/p\u003e\n\n\u003cp\u003eThe author turned the model into a YAML-based cluster specification that Terraform realizes as AKS environments, with templates for scenarios such as local kubeconfig access, managed Entra authentication, Azure RBAC authorization, and workload identity. The workload side uses FastAPI applications to make authentication behavior visible through routes for runtime inspection, explanation, testing, and tracing. The broader goal is to use these controlled scenarios to build better tools and tradecraft for collecting and analyzing security posture in existing, changing production clusters.\u003c/p\u003e\n"},{"n":34,"title":"Inside the Underground Economy: 5 Dark Web Trends Shaping the 2026 Threat Landscape","source":"cyble.com","sourceColorIdx":0,"link":"https://cyble.com/blog/dark-web-trends-2026-cyber-threat-landscape/","time":"09:47","priority":"MAY READ","score":55,"tldr":"The dark web has evolved into an operational hub for cybercrime in 2026, where ransomware services, initial access, stolen identities, geopolitical campaign activity, and AI-enabled tools are traded before attacks begin. Organizations need proactive dark web monitoring to spot exposed credentials, access listings, and emerging threats before they are weaponized.","briefOverview":"\u003cp\u003eThe article says the dark web has expanded beyond a marketplace for stolen credentials into an operational hub that affects nearly every phase of the cyberattack lifecycle. In the first half of 2026, underground markets were described as supporting ransomware supply chains, geopolitical campaigns, identity-based attacks, and the trade of access, intelligence, and malicious services before attacks begin. March 2026 alone recorded 702 ransomware attacks and 54 major publicly reported data breaches and leaks worldwide.\u003c/p\u003e\n\n\u003cp\u003eRansomware remained a major threat, with Qilin, Akira, The Gentlemen, DragonForce, and INC Ransom responsible for more than 56% of ransomware activity recorded in March 2026. The article emphasizes that modern ransomware campaigns often include data theft, using dark web leak sites to publish or auction stolen information when organizations do not pay. It also highlights initial access brokers, noting that researchers observed 20 March 2026 listings advertising access to compromised corporate networks, with three sellers accounting for more than 55% of observed access sales.\u003c/p\u003e\n\n\u003cp\u003eThe article describes identity as a primary attack surface because credential theft, session hijacking, multi-factor authentication bypass techniques, and third-party access abuse all rely on valid credentials. It also connects geopolitical events to cyber activity, citing the February 2026 Middle East escalation, more than 70 active hacktivist groups, over 8,000 conflict-themed domains, and navigation disruptions affecting more than 1,100 vessels near the Strait of Hormuz. Finally, it says artificial intelligence is accelerating both attackers and defenders by helping scale offensive activity and enabling faster analysis of dark web data for threat detection.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article states that the dark web has expanded beyond stolen credentials into an operational hub for ransomware services, initial network access, exploit kits, phishing infrastructure, and AI-powered attack tools.","In March 2026, five ransomware operations—Qilin, Akira, The Gentlemen, DragonForce, and INC Ransom—were responsible for more than 56% of recorded ransomware activity.","Researchers observed 20 March 2026 listings advertising access to compromised corporate networks, with professional services accounting for 25% and retail for 20% of those listings.","The article says identity-focused attacks are increasing, with stolen usernames, passwords, authentication tokens, and corporate accounts remaining among the most valuable assets traded across dark web communities.","During the February 2026 escalation in the Middle East, the article reports that more than 70 hacktivist groups became active, over 8,000 conflict-themed domains were registered, and navigation disruptions affected more than 1,100 vessels near the Strait of Hormuz."],"insights":["Ransomware activity appears highly concentrated, with just five operations accounting for more than 56% of recorded activity in March 2026 and nearly 58% of claimed attacks in the Americas in Q1 2026 attributed to five groups.","Initial access sales also show concentration among sellers, as vexin, holyduxy, and algoyim accounted for more than 55% of observed access sales in March 2026.","The article highlights that defenders have a shrinking response window because compromised network access is typically sold soon after a breach.","The dark web is described as useful for early warning because it can reveal access listings, leaked data discussions, and campaign chatter before attacks reach production environments.","Geopolitical cyber activity can blend state-sponsored groups, hacktivists, and financially motivated criminals at the same time, making attribution more difficult during periods of tension."],"referencedReports":[],"body":"\u003cp\u003eThe article says the dark web has expanded beyond a marketplace for stolen credentials into an operational hub that affects nearly every phase of the cyberattack lifecycle. In the first half of 2026, underground markets were described as supporting ransomware supply chains, geopolitical campaigns, identity-based attacks, and the trade of access, intelligence, and malicious services before attacks begin. March 2026 alone recorded 702 ransomware attacks and 54 major publicly reported data breaches and leaks worldwide.\u003c/p\u003e\n\n\u003cp\u003eRansomware remained a major threat, with Qilin, Akira, The Gentlemen, DragonForce, and INC Ransom responsible for more than 56% of ransomware activity recorded in March 2026. The article emphasizes that modern ransomware campaigns often include data theft, using dark web leak sites to publish or auction stolen information when organizations do not pay. It also highlights initial access brokers, noting that researchers observed 20 March 2026 listings advertising access to compromised corporate networks, with three sellers accounting for more than 55% of observed access sales.\u003c/p\u003e\n\n\u003cp\u003eThe article describes identity as a primary attack surface because credential theft, session hijacking, multi-factor authentication bypass techniques, and third-party access abuse all rely on valid credentials. It also connects geopolitical events to cyber activity, citing the February 2026 Middle East escalation, more than 70 active hacktivist groups, over 8,000 conflict-themed domains, and navigation disruptions affecting more than 1,100 vessels near the Strait of Hormuz. Finally, it says artificial intelligence is accelerating both attackers and defenders by helping scale offensive activity and enabling faster analysis of dark web data for threat detection.\u003c/p\u003e\n"},{"n":33,"title":"Why Identity Intelligence Is Becoming Critical to Cyber Insurance Readiness","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/why-identity-intelligence-is-becoming-critical-to-cyber-insurance-readiness/","time":"05:00","priority":"MAY READ","score":52,"tldr":"Cyber insurers are increasingly evaluating how well organizations understand and reduce identity exposure, since compromised credentials, stolen sessions, and account takeover are now major drivers of cyber risk. Identity Intelligence helps organizations prove resilience by continuously measuring, prioritizing, and remediating identity-based risks.","briefOverview":"\u003cp\u003eThe article explains that cyber insurance has become more demanding as cyberattacks have grown more frequent, sophisticated, and costly. Insurers are now placing greater emphasis on an organization’s overall cyber resilience rather than only checking for controls such as firewalls, endpoint protection, or multi-factor authentication. Identity has become central to this evaluation because compromised credentials, stolen session tokens, phishing, business email compromise, and account takeover are common ways attackers gain unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that traditional security assessments can miss identity exposure that exists outside standard controls. Credentials may appear in breach datasets, session tokens may be captured by infostealer malware, and executive identities may be exposed across digital channels. Identity Intelligence is presented as a way to provide measurable insight into these risks by identifying exposed identities, continuously monitoring exposure, prioritizing high-risk users, and reducing identity-based risk over time.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights identity metrics such as Executive Exposure Score, Third-Party Exposure Score, Exposure Velocity, Time-to-Remediation, and Repeat Exposure Rate as useful for governance and insurer discussions. It says this visibility can also support enterprise risk management, board reporting, fraud prevention, incident response, third-party risk management, and executive protection. The final takeaway is that Identity Intelligence complements traditional security controls by helping organizations measure, monitor, and reduce identity exposure as part of cyber insurance readiness.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cyber insurance providers have tightened underwriting standards and now place greater emphasis on an organization’s overall cyber resilience.","Identity has become a central cyber risk because attackers commonly use compromised credentials, stolen session tokens, phishing, business email compromise, and account takeover to gain unauthorized access.","Traditional security assessments may confirm controls such as MFA, endpoint protection, patch management, and vulnerability scanning, but they may not show how exposed an organization’s identities are.","Identity Intelligence provides measurable insight into identity exposure and helps organizations identify exposed identities, monitor exposure continuously, prioritize high-risk users, and reduce identity-based risk over time.","Organizations can use identity metrics such as Executive Exposure Score, Third-Party Exposure Score, Exposure Velocity, Time-to-Remediation, and Repeat Exposure Rate to support governance and discussions with insurers."],"insights":["Organizations that perform well in standard security assessments may still underestimate risk if they lack visibility into credentials, session tokens, and executive identities exposed outside traditional security controls.","Tracking identity exposure over time can turn cyber insurance discussions from policy-based claims into evidence-based conversations using metrics such as exposure velocity, repeat exposure rate, and time-to-remediation.","Third-party identities are part of the insurance-readiness discussion, so vendors, contractors, and partners should be included in identity exposure monitoring rather than focusing only on employees.","Identity Intelligence can support functions beyond security, including board reporting, fraud prevention, incident response, third-party risk management, and executive protection."],"referencedReports":[],"body":"\u003cp\u003eThe article explains that cyber insurance has become more demanding as cyberattacks have grown more frequent, sophisticated, and costly. Insurers are now placing greater emphasis on an organization’s overall cyber resilience rather than only checking for controls such as firewalls, endpoint protection, or multi-factor authentication. Identity has become central to this evaluation because compromised credentials, stolen session tokens, phishing, business email compromise, and account takeover are common ways attackers gain unauthorized access.\u003c/p\u003e\n\n\u003cp\u003eThe article argues that traditional security assessments can miss identity exposure that exists outside standard controls. Credentials may appear in breach datasets, session tokens may be captured by infostealer malware, and executive identities may be exposed across digital channels. Identity Intelligence is presented as a way to provide measurable insight into these risks by identifying exposed identities, continuously monitoring exposure, prioritizing high-risk users, and reducing identity-based risk over time.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights identity metrics such as Executive Exposure Score, Third-Party Exposure Score, Exposure Velocity, Time-to-Remediation, and Repeat Exposure Rate as useful for governance and insurer discussions. It says this visibility can also support enterprise risk management, board reporting, fraud prevention, incident response, third-party risk management, and executive protection. The final takeaway is that Identity Intelligence complements traditional security controls by helping organizations measure, monitor, and reduce identity exposure as part of cyber insurance readiness.\u003c/p\u003e\n"},{"n":23,"title":"The Verification Step Is the New ATO Battleground in 2026","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/07/the-verification-step-is-new-ato.html","time":"11:30","priority":"MAY READ","score":50,"tldr":"As passkeys and passwordless login make credential stuffing less effective, attackers are shifting account takeover efforts to identity verification, recovery, magic-link, and step-up flows. Organizations should treat verification as a primary security battleground by adding liveness checks, AI-resistant fraud detection, and stronger intent binding for high-risk actions.","briefOverview":"\u003cp\u003eThe article argues that account takeover is shifting from stolen-password attacks toward identity verification and recovery flows. It says credential stuffing is becoming less effective as passkeys and passwordless authentication become more common, citing FIDO Alliance research that 75% of global consumers have enabled a passkey on at least one account. As a result, attackers are moving to account recovery, device re-enrollment, step-up verification, and magic-link flows.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights generative AI as a major reason identity verification is becoming a larger target. Veriff’s Identity Fraud Report 2026 found that 4.18% of verification attempts were fraudulent, and that digitally presented media was 300% more likely to be AI-generated or altered than in prior periods. It also says impersonation accounts for
