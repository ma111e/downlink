<script type="application/json" id="dl-articles">[{"n":11,"title":"PHP2Shell Exploitation on Check Point Gateway","source":"research.checkpoint.com","sourceColorIdx":4,"link":"https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/","time":"13:56","priority":"MUST READ","score":96,"tldr":"Attackers exploited unpatched Check Point Mobile Access gateways using PHP2Shell and CVE-2026-123039, deploying PhiliKit-linked TSGA/TSProxy backdoors and, in some Israeli intrusions, pivoting to ESXi hosts to run the destroy_v6 wiper. The campaign has links to China-nexus UNC5221 tooling, but its destructive, Israel-focused elements leave attribution uncertain.","briefOverview":"\u003cp\u003eBeginning October 30, 2026, attackers targeted organizations with unpatched Check Point Security Gateways through vulnerable Mobile Access portals, with the first wave concentrating on Israeli organizations. The activity was consistent with PHP2Shell exploitation associated with CVE-2026-109618 and CVE-2026-109619, followed by exploitation of CVE-2026-123039 in the DynamicCLI interface to gain root access. A broader second wave on November 2 targeted organizations in multiple countries and sectors, with no observed destructive activity.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining privileged access, the attackers installed PHP webshells and deployed the persistent TSGA backdoor and its embedded TSProxy networking component. They used the gogo scanner to discover internal assets, accessed a VMware ESXi host over SSH with the vpxuser service account, and in destructive cases ran the destroy_v6 wiper and left DREAM_ANNEXATION.txt notes. TSGA and TSProxy share code, configuration, and cryptographic material with the PhiliKit framework previously associated with China-nexus UNC5221, but the article states that the operation’s true nature and attribution cannot be assessed with high confidence.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Beginning on October 30, 2026, attackers targeted unpatched Check Point Security Gateways through Mobile Access portals using activity consistent with PHP2Shell exploitation.","After initial access, the attackers exploited CVE-2026-123039 in the DynamicCLI interface to gain root-level control and installed PHP webshells plus the TSGA and TSProxy backdoors.","The attackers used the gogo scanner to identify internal systems, accessed a VMware ESXi host over SSH using the vpxuser account, and executed the destroy_v6 wiper in the destructive stage.","The first wave focused on Israeli organizations and included destructive activity in some cases, while a November 2 wave targeted organizations in multiple countries without observed destructive activity.","TSGA and TSProxy share code, configuration, and cryptographic material with the PhiliKit framework, but the article states that the operation’s true nature and attribution cannot be assessed with high confidence."],"insights":["The campaign began about one week after a security fix became available, showing that organizations with unpatched Check Point Mobile Access portals were rapidly targeted.","Repeated PHP session files containing the \"upload_progress_pwn\" marker and hundreds of Apache/PHP worker crashes are described as evidence that defenders can use to identify attempted PHP2Shell activity.","The TSGA implant combined several persistence methods, including relocating itself to a boot-persistence directory and installing TSProxy into an existing appliance library path, allowing concealed access through normal-looking services.","Although TSGA and TSProxy strongly share a lineage with PhiliKit, the article cautions that the destructive activity, Israel focus, and politically themed note do not fully align with known UNC5221 patterns, so attribution remains uncertain."],"referencedReports":[{"title":"ESET APT Activity Report Q4 2025–Q1 2026","url":"https://web-assets.esetstatic.com/wls/en/papers/threat-reports/eset-apt-activity-report-q4-2025-q1-2026.pdf","publisher":"eset","context":"The article cites this ESET threat report as prior documentation of PhiliKit in attacks exploiting Ivanti vulnerabilities.","category":"research","primary":false},{"title":"Chained PHP2Shell Exploit Roots 25 Servers","url":"https://dreamgroup.com/blog/chained-php2shell-exploit-roots-25-servers","publisher":"dream-security","context":"The article references Dream Security research on PHP2Shell exploitation of Palo Alto Networks devices by China-nexus actors.","category":"research","primary":false},{"title":"CISA Cybersecurity Advisory AA25-022A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-022a","publisher":"cisa","context":"The article cites this CISA advisory as reporting use of the gogo scanner in activity involving Chinese-nexus actors exploiting Ivanti vulnerabilities.","category":"advisory","primary":false}],"body":"\u003cp\u003eBeginning October 30, 2026, attackers targeted organizations with unpatched Check Point Security Gateways through vulnerable Mobile Access portals, with the first wave concentrating on Israeli organizations. The activity was consistent with PHP2Shell exploitation associated with CVE-2026-109618 and CVE-2026-109619, followed by exploitation of CVE-2026-123039 in the DynamicCLI interface to gain root access. A broader second wave on November 2 targeted organizations in multiple countries and sectors, with no observed destructive activity.\u003c/p\u003e\n\n\u003cp\u003eAfter gaining privileged access, the attackers installed PHP webshells and deployed the persistent TSGA backdoor and its embedded TSProxy networking component. They used the gogo scanner to discover internal assets, accessed a VMware ESXi host over SSH with the vpxuser service account, and in destructive cases ran the destroy_v6 wiper and left DREAM_ANNEXATION.txt notes. TSGA and TSProxy share code, configuration, and cryptographic material with the PhiliKit framework previously associated with China-nexus UNC5221, but the article states that the operation’s true nature and attribution cannot be assessed with high confidence.\u003c/p\u003e\n"},{"n":12,"title":"CVE-2026-126187: React Server Components Flaw Lets Attackers Execute Code Through Smuggled Flight Rows","source":"stepsecurity.io","sourceColorIdx":4,"link":"https://www.stepsecurity.io/blog/cve-2026-126187-react-flight-rce","time":"14:55","priority":"MUST READ","score":94,"tldr":"React Server Components packages before 19.0.9, 19.1.10, 19.2.9, and 19.3.1 reportedly contain a critical Flight transport framing flaw that can enable unauthenticated server-side code execution under specific shared-ArrayBuffer conditions. Upgrade affected React/framework dependencies, rebuild and redeploy, and avoid sending multiple typed-array views over a shared ArrayBuffer until patched.","briefOverview":"\u003cp\u003eReact published CVE-2026-126187 on November 10, 2026, describing a critical unauthenticated remote code execution issue in React Server Components with a CVSS 4.0 score of 9.5. The affected packages are react-server-dom-webpack, react-server-dom-parcel, and react-server-dom-turbopack across specified React 19 release lines. The issue can affect server-side and edge rendering environments, while client-only React applications without a server and applications without an RSC-capable framework or bundler plugin are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when a response carries multiple typed-array views over a shared ArrayBuffer, attacker-controlled bytes are present in one view, and a downstream consumer transfers the backing storage. In vulnerable versions, a binary row\u0026rsquo;s length header can be sent while its payload is silently skipped, allowing the Flight parser to consume later bytes incorrectly and potentially interpret attacker-controlled data as a module-loading row. React fixed the issue in versions 19.0.9, 19.1.10, 19.2.9, and 19.3.1 by copying large typed-array payloads into exact-size buffers before they cross the destination boundary. Organizations should upgrade their framework or direct dependencies, verify resolved versions in lockfiles, rebuild and redeploy affected applications, and avoid transporting multiple shared-buffer views in RSC payloads until updated.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CVE-2026-126187 is described as a critical, unauthenticated remote code execution flaw in React Server Components, with a CVSS 4.0 score of 9.5.","The affected packages are react-server-dom-webpack, react-server-dom-parcel, and react-server-dom-turbopack in versions through 19.0.8, 19.1.9, 19.2.8, and 19.3.0.","The issue requires a response containing multiple typed-array views over a shared ArrayBuffer, attacker-influenced bytes in one view, and a downstream path that transfers the backing storage.","React fixed the issue in versions 19.0.9, 19.1.10, 19.2.9, and 19.3.1 by copying large typed-array payloads into exact-size buffers before sending them.","Organizations should upgrade framework-managed or direct dependencies, confirm the resolved package versions in lockfiles, and rebuild and redeploy affected applications."],"insights":["The patched Flight parser can still process a deliberately corrupted stream, so the fix depends primarily on the writer no longer emitting a binary-row header without its promised bytes.","The vulnerable behavior can occur silently: a transferred or detached shared buffer may cause the writer to retain the binary length header while skipping the now-zero-length payload, without surfacing an error.","A smuggled module row can turn data into executable code because a framing mismatch causes the parser to consume later rows as binary data and then resume parsing inside attacker-controlled bytes.","Many organizations may not see the affected packages declared directly because they are commonly installed transitively through RSC frameworks, making resolved lockfile versions more important than declared dependencies.","A practical stopgap before upgrading is to copy shared typed-array views, such as with sharedView.slice(), before placing them in an RSC payload."],"referencedReports":[{"title":"GHSA-xqc2-xf4c-x3h3","url":"https://github.com/react/react/security/advisories/GHSA-xqc2-xf4c-x3h3","publisher":"react","context":"The article cites React's GitHub security advisory for CVE-2026-126187 and its affected packages, versions, and preconditions.","category":"advisory","primary":true},{"title":"CVE-2026-126187","url":"https://www.cve.org/CVERecord?id=CVE-2026-126187","publisher":"cve-program","context":"The article links the official CVE record for the React Server Components flaw.","category":"advisory","primary":true},{"title":"Unit 42 on CVE-2025-55182 React and CVE-2025-66478 Next","url":"https://unit42.paloaltonetworks.com/cve-2025-55182-react-and-cve-2025-66478-next","publisher":"unit-42","context":"The article references this Unit 42 analysis as coverage of the prior Flight-protocol vulnerability.","category":"research","primary":false}],"body":"\u003cp\u003eReact published CVE-2026-126187 on November 10, 2026, describing a critical unauthenticated remote code execution issue in React Server Components with a CVSS 4.0 score of 9.5. The affected packages are react-server-dom-webpack, react-server-dom-parcel, and react-server-dom-turbopack across specified React 19 release lines. The issue can affect server-side and edge rendering environments, while client-only React applications without a server and applications without an RSC-capable framework or bundler plugin are not affected.\u003c/p\u003e\n\n\u003cp\u003eThe flaw occurs when a response carries multiple typed-array views over a shared ArrayBuffer, attacker-controlled bytes are present in one view, and a downstream consumer transfers the backing storage. In vulnerable versions, a binary row\u0026rsquo;s length header can be sent while its payload is silently skipped, allowing the Flight parser to consume later bytes incorrectly and potentially interpret attacker-controlled data as a module-loading row. React fixed the issue in versions 19.0.9, 19.1.10, 19.2.9, and 19.3.1 by copying large typed-array payloads into exact-size buffers before they cross the destination boundary. Organizations should upgrade their framework or direct dependencies, verify resolved versions in lockfiles, rebuild and redeploy affected applications, and avoid transporting multiple shared-buffer views in RSC payloads until updated.\u003c/p\u003e\n"},{"n":6,"title":"PTC Patches Critical Windchill and FlexPLM Flaw That Could Enable Remote Code Execution","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/ptc-patches-critical-windchill-and.html","time":"11:33","priority":"SHOULD READ","score":88,"tldr":"PTC released patches for CVE-2026-126325, a critical 9.2-severity deserialization flaw in Windchill and FlexPLM that could let remote attackers execute code. Organizations running self-hosted affected versions should patch immediately or restrict network exposure, especially given prior active exploitation of Windchill flaws by Cl0p-linked actors.","briefOverview":"\u003cp\u003ePTC has released patches for CVE-2026-126325, a critical remote code execution flaw affecting Windchill and FlexPLM. The vulnerability has a CVSS v4 score of 9.2 and stems from improper input validation and deserialization of untrusted data. An attacker could exploit it through specially crafted requests to run code remotely on vulnerable systems.\u003c/p\u003e\n\n\u003cp\u003eAffected versions span multiple Windchill and FlexPLM releases, including versions from 11.0 M030 through 13.1.4.0 for Windchill and through 13.1.3.0 for FlexPLM. PTC said systems hosted by the company have already been patched, but organizations running their own environments should apply the update as soon as possible. If patching cannot happen immediately, organizations should restrict network access and watch for unauthorized code execution, backdoor access, or JSP web shells.\u003c/p\u003e\n\n\u003cp\u003eThe advisory follows an earlier critical Windchill and FlexPLM flaw, CVE-2026-12569, that was actively exploited. In July 2026, Cl0p-linked threat actors were reported to have used that previous flaw to deploy JSP web shells and steal sensitive product data from manufacturing and industrial organizations. The article notes that compromises of these environments can disrupt industrial processes and create downstream effects for manufacturing, logistics, and fulfillment operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["PTC released patches for CVE-2026-126325, a critical remote code execution flaw affecting Windchill and FlexPLM with a CVSS v4 score of 9.2.","The flaw involves improper input validation and deserialization of untrusted data, allowing remote code execution through crafted requests.","PTC said customers whose Windchill or FlexPLM environments are hosted by PTC have already had the patches applied.","Organizations operating non-PTC-hosted affected systems are urged to patch promptly or apply network restrictions if patching cannot happen immediately.","A prior critical Windchill and FlexPLM flaw, CVE-2026-12569, was actively exploited and later used by Cl0p-linked actors to deploy JSP web shells and steal sensitive product data."],"insights":["The required response differs by deployment model: PTC says its hosted customers need take no action because patches were applied, while organizations hosting the software themselves must patch or restrict network access.","The urgency is heightened by the recent history of a separate Windchill and FlexPLM flaw that was actively exploited by Cl0p-linked actors to install web shells and take sensitive product data.","A compromise could have consequences beyond data loss, because the article notes that disruption to industrial systems can affect time-sensitive manufacturing, logistics, and fulfillment operations.","Organizations that cannot patch immediately are advised not only to limit network exposure but also to look for signs of unauthorized code running, hidden backdoor access, or web shells on affected hosts."],"referencedReports":[{"title":"Windchill / FlexPLM RCE Vulnerability","url":"https://www.ptc.com/en/about/trust-center/advisory-center/active-advisories/windchill-flexplm-rce-vulnerability","publisher":"ptc","context":"PTC's advisory states that its hosted Windchill and FlexPLM environments have already been patched and urges self-hosted customers to apply the patch promptly.","category":"advisory","primary":true}],"body":"\u003cp\u003ePTC has released patches for CVE-2026-126325, a critical remote code execution flaw affecting Windchill and FlexPLM. The vulnerability has a CVSS v4 score of 9.2 and stems from improper input validation and deserialization of untrusted data. An attacker could exploit it through specially crafted requests to run code remotely on vulnerable systems.\u003c/p\u003e\n\n\u003cp\u003eAffected versions span multiple Windchill and FlexPLM releases, including versions from 11.0 M030 through 13.1.4.0 for Windchill and through 13.1.3.0 for FlexPLM. PTC said systems hosted by the company have already been patched, but organizations running their own environments should apply the update as soon as possible. If patching cannot happen immediately, organizations should restrict network access and watch for unauthorized code execution, backdoor access, or JSP web shells.\u003c/p\u003e\n\n\u003cp\u003eThe advisory follows an earlier critical Windchill and FlexPLM flaw, CVE-2026-12569, that was actively exploited. In July 2026, Cl0p-linked threat actors were reported to have used that previous flaw to deploy JSP web shells and steal sensitive product data from manufacturing and industrial organizations. The article notes that compromises of these environments can disrupt industrial processes and create downstream effects for manufacturing, logistics, and fulfillment operations.\u003c/p\u003e\n"},{"n":7,"title":"New N-central Exploits Work Against Patched Servers, Enable Root RCE and Windows SYSTEM Access","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/new-n-central-exploits-work-against.html","time":"11:51","priority":"SHOULD READ","score":88,"tldr":"New public exploits dubbed 4EverAble2Shell and Agent2Shell reportedly bypass N-able’s recent N-central patch, enabling unauthenticated root RCE on exposed servers and SYSTEM-level command execution on managed Windows agents. N-able says the server issue requires the non-default Legacy API to be enabled and internet-accessible, and urges customers to disable it immediately.","briefOverview":"\u003cp\u003eN-able is investigating newly disclosed vulnerabilities in on-premise N-central 2026.4.1 HF2 that reportedly remain exploitable after the company’s November 10, 2026 security update. Researcher Sean Bales has called the new issues 4EverAble2Shell and Agent2Shell, and stated that their proof-of-concept exploits work against patched build 2026.4.1.26. N-able said the server issue requires the Legacy API to be enabled and exposed to the public internet; the feature is disabled by default and is not recommended. Hosted N-central environments are not affected, according to the company.\u003c/p\u003e\n\n\u003cp\u003eBales said 4EverAble2Shell enables unauthenticated remote code execution with root privileges on N-central servers. He said Agent2Shell uses more than 10 zero-day vulnerabilities to run commands as NT AUTHORITY\\SYSTEM on managed Windows agents if an attacker knows the target appliance ID. N-able urged customers to disable the Legacy API immediately if it is enabled.\u003c/p\u003e\n\n\u003cp\u003ePrevidian reported observing targeted probes for 4EverAble2Shell within hours of the proof-of-concept release, although it said there was no evidence of successful exploitation at the time of writing. The observed activity attempted initial code execution through Apache Axis flaw CVE-2026-90436, then attempted to use 4EverAble2Shell to gain root privileges and download a shell script using curl. WatchTowr also reported seeing probes aimed at N-central builds with the Legacy API enabled.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["N-able is investigating a public disclosure alleging additional vulnerabilities in on-premise N-central version 2026.4.1 HF2.","N-able said the server issue depends on the Legacy API being enabled and exposed to the public internet, although the feature is disabled by default and not recommended.","Researcher Sean Bales said the 4EverAble2Shell proof of concept can enable unauthenticated remote code execution with root privileges on N-central servers patched to build 2026.4.1.26.","Bales said Agent2Shell combines more than 10 zero-day vulnerabilities to run commands as NT AUTHORITY\\SYSTEM on managed Windows agents when an attacker knows the target appliance ID.","Previdian and watchTowr reported observing probes targeting 4EverAble2Shell, but Previdian said there was no evidence of successful exploitation at the time of writing."],"insights":["N-able’s November 10, 2026 update for the earlier Able2Shell flaws did not prevent the newly published 4EverAble2Shell and Agent2Shell proof-of-concept exploits from working against build 2026.4.1.26.","The reported server takeover risk is tied to a non-default exposure: the Legacy API must be both enabled and reachable from the public internet, making disabling that feature an immediate mitigation identified by N-able.","Observed activity combined an attempt to gain initial access through Apache Axis flaw CVE-2026-90436 with an attempted 4EverAble2Shell privilege increase to root, showing the flaws being probed as part of a multi-step sequence.","Managed Windows agents may be affected separately from the N-central server because Agent2Shell reportedly can run commands as the highest Windows system account if the attacker knows the appliance ID."],"referencedReports":[{"title":"N-central Legacy API advisory","url":"https://uptime.n-able.com/event/202609/","publisher":"n-able","context":"N-able’s advisory states that the reported server issue requires the Legacy API to be enabled and exposed to the public internet, and urges customers to disable it.","category":"advisory","primary":true},{"title":"N-Central N-Able zero-day disclosures","url":"https://github.com/MSPNightmare/CVEs/tree/main/0-Days/N-Central%20N-Able","publisher":"sean-bales","context":"The article cites Sean Bales’s technical disclosure and proof-of-concept exploits for 4EverAble2Shell and Agent2Shell.","category":"research","primary":true},{"title":"VULN-2026-0009 telemetry","url":"https://previdian.com/VULN-2026-0009#telemetry","publisher":"previdian","context":"Previdian’s telemetry reports targeted probing for 4EverAble2Shell following the public proof-of-concept release.","category":"research","primary":false}],"body":"\u003cp\u003eN-able is investigating newly disclosed vulnerabilities in on-premise N-central 2026.4.1 HF2 that reportedly remain exploitable after the company’s November 10, 2026 security update. Researcher Sean Bales has called the new issues 4EverAble2Shell and Agent2Shell, and stated that their proof-of-concept exploits work against patched build 2026.4.1.26. N-able said the server issue requires the Legacy API to be enabled and exposed to the public internet; the feature is disabled by default and is not recommended. Hosted N-central environments are not affected, according to the company.\u003c/p\u003e\n\n\u003cp\u003eBales said 4EverAble2Shell enables unauthenticated remote code execution with root privileges on N-central servers. He said Agent2Shell uses more than 10 zero-day vulnerabilities to run commands as NT AUTHORITY\\SYSTEM on managed Windows agents if an attacker knows the target appliance ID. N-able urged customers to disable the Legacy API immediately if it is enabled.\u003c/p\u003e\n\n\u003cp\u003ePrevidian reported observing targeted probes for 4EverAble2Shell within hours of the proof-of-concept release, although it said there was no evidence of successful exploitation at the time of writing. The observed activity attempted initial code execution through Apache Axis flaw CVE-2026-90436, then attempted to use 4EverAble2Shell to gain root privileges and download a shell script using curl. WatchTowr also reported seeing probes aimed at N-central builds with the Legacy API enabled.\u003c/p\u003e\n"},{"n":4,"title":"Kazakhstan-linked hackers used AI agent to spy on Central Asian governments","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/kazakhstan-hackers-central-asia","time":"13:00","priority":"SHOULD READ","score":86,"tldr":"Kazakhstan-linked espionage group Silent Lynx used a DeepSeek-powered Hermes AI agent, controlled through Telegram, to automate reconnaissance, data theft and cleanup during intrusions into Central Asian government networks. The group reportedly accessed Tajikistan’s railway and government document systems and also compromised an Uzbek forestry platform.","briefOverview":"\u003cp\u003eCloudSEK reported that suspected Kazakhstan-linked group Silent Lynx used the open-source Hermes AI agent, primarily powered by DeepSeek models, in espionage operations against Central Asian government targets. The researchers found an exposed Silent Lynx server containing more than a dozen gigabytes of stolen government documents, hacking tools, and records showing the AI agent’s use. The operator communicated with the agent in Russian and linked it to a Telegram bot to send instructions remotely from a phone.\u003c/p\u003e\n\n\u003cp\u003eThe agent assisted with reconnaissance, data collection, and removing evidence from compromised systems, and it could run some potentially destructive commands without further approval. In Tajikistan, the group reportedly accessed the national railway network and, using one employee’s credentials, reached a government document platform used by ministries and agencies, downloading thousands of files including Defense Ministry documents. CloudSEK also found evidence of a compromise involving Uzbekistan’s Smart Forestry system and files disguised as Turkmenistan government documents that may have been prepared for a phishing campaign.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["CloudSEK found an exposed server associated with Silent Lynx containing more than a dozen gigabytes of stolen government documents, hacking tools, and records of AI-agent use.","The operator used the open-source Hermes AI agent, primarily with DeepSeek models, for reconnaissance, data collection, and removing traces from compromised systems.","Silent Lynx maintained access to Tajikistan’s national railway network from at least mid-August through early October and stole databases with login credentials, internal documents, and operational reports.","Using a railway employee’s credentials, the group accessed Tajikistan’s national electronic document management platform and automated downloads of thousands of documents, including documents sent to or processed by the Defense Ministry in 2026.","CloudSEK found evidence of a compromise involving Uzbekistan’s Smart Forestry server and malicious files posing as Turkmenistan official documents that appeared to be prepared for a phishing campaign."],"insights":["The Hermes agent was connected to a Telegram bot, allowing the operator to issue instructions remotely from a phone rather than working directly from a single computer.","The agent was configured to run some potentially destructive commands without additional approval, increasing the level of autonomy available to the operator.","Credentials from one Tajik railway employee reportedly provided access to the country’s broader electronic document platform used by ministries and agencies, showing how access to one organization extended into wider government communications.","CloudSEK assessed Silent Lynx’s Kazakhstan ties with only medium confidence and stated that the evidence does not establish a connection to the Kazakh government.","The exposed server included newly created and tested files disguised as Turkmenistan official documents, but researchers could not determine whether the apparent phishing activity against Turkmenistan succeeded."],"referencedReports":[{"title":"Off the Rails: Inside an Exposed Silent Lynx Server","url":"https://www.cloudsek.com/blog/off-the-rails-inside-an-exposed-silent-lynx-server","publisher":"cloudsek","context":"The article relies on CloudSEK's report for findings on Silent Lynx's exposed server, AI-agent use, and intrusions affecting Central Asian government systems.","category":"research","primary":true}],"body":"\u003cp\u003eCloudSEK reported that suspected Kazakhstan-linked group Silent Lynx used the open-source Hermes AI agent, primarily powered by DeepSeek models, in espionage operations against Central Asian government targets. The researchers found an exposed Silent Lynx server containing more than a dozen gigabytes of stolen government documents, hacking tools, and records showing the AI agent’s use. The operator communicated with the agent in Russian and linked it to a Telegram bot to send instructions remotely from a phone.\u003c/p\u003e\n\n\u003cp\u003eThe agent assisted with reconnaissance, data collection, and removing evidence from compromised systems, and it could run some potentially destructive commands without further approval. In Tajikistan, the group reportedly accessed the national railway network and, using one employee’s credentials, reached a government document platform used by ministries and agencies, downloading thousands of files including Defense Ministry documents. CloudSEK also found evidence of a compromise involving Uzbekistan’s Smart Forestry system and files disguised as Turkmenistan government documents that may have been prepared for a phishing campaign.\u003c/p\u003e\n"},{"n":5,"title":"Calendar Invites and Live Proxies: Inside a Google Session Hijacking Campaign","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/calendar-invites-and-live-proxies.html","time":"11:51","priority":"SHOULD READ","score":84,"tldr":"Material Security uncovered a phishing campaign that used trusted Google Calendar and Drive links plus Nyasher reverse proxies to steal live Google Workspace sessions while bypassing conventional link reputation and MFA protections. The campaign relied on compromised sender accounts and rapidly rotating infrastructure, prompting hundreds of Cloudflare-backed takedowns.","briefOverview":"\u003cp\u003eSince mid-August 2026, Material Security researchers tracked a phishing operation targeting corporate Google users with Google Calendar invitations and, later, Google Drive file and document share invitations. Many invitations came from compromised accounts belonging to organizations the recipients had already communicated with, using routine themes such as voicemail notices, payment notices, and RFP requests. The links often used Google’s own redirector, share.google, Drive links, or Intuit notification links, allowing them to appear trustworthy to reputation-based checks.\u003c/p\u003e\n\n\u003cp\u003eAfter a victim clicked through, the Nyasher framework placed a live reverse proxy in front of the genuine Google sign-in process and captured the resulting active session as the victim entered credentials and approved real multi-factor authentication prompts. The phishing pages were built in the browser after a Cloudflare Turnstile challenge, limiting what conventional crawlers could retrieve and inspect. During one month of Operation CloudFire, Material Security blocked 68,676 campaign messages and reported infrastructure to Cloudflare, which placed warnings in front of confirmed phishing destinations; a stolen session could give an attacker access to email, Drive, and the ability to grant OAuth access in the victim’s name.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Since mid-August 2026, a phishing operation has used Google Calendar invites and later Google Drive sharing invitations to target corporate Google users.","The campaign used Google redirect links, compromised sender accounts, and a live reverse proxy called Nyasher to capture active Google sessions after victims completed real sign-in and multi-factor authentication prompts.","Material Security reported malicious gateways and endpoints to Cloudflare, which placed phishing warnings in front of confirmed fake interstitials and proxied Google sign-in pages.","During one month of Operation CloudFire, researchers recorded 68,676 blocked campaign messages, 2,112 unique malicious URLs, 897 unique domains taken down, and 8,570 compromised sender addresses across 6,354 root domains.","A stolen live Google session can provide access to email, Google Drive, and the ability to grant OAuth access in the victim's name."],"insights":["The campaign was designed to defeat reputation-based checks by routing victims through legitimate Google links and sending invitations from compromised accounts with established, trusted histories.","The phishing page was created in the victim’s browser only after a Cloudflare Turnstile challenge, leaving no static page for conventional crawlers to retrieve and inspect.","Email security gateways may miss calendar-invite threats because such systems are built primarily to inspect email in transit, making calendar invitations a separate attack surface that requires account-history context.","Reporting malicious infrastructure to Cloudflare did more than protect the researchers’ customers: it placed warning pages in front of reported links for anyone who clicked them and forced the operator to rebuild infrastructure.","The Nyasher framework included unfinished Microsoft 365-related components, including a title string for a Microsoft sign-in prompt, although the related paths did not resolve at the time of reporting."],"referencedReports":[{"title":"Calendar Invite Whitepaper","url":"https://content.material.security/hubfs/Material%20Security%20Site%20CMS/CalendarInviteWhitepaper-sep2026.pdf","publisher":"material-security","context":"The article directs teams to this companion whitepaper for the full technical breakdown, indicators of compromise, and campaign timeline.","category":"research","primary":true}],"body":"\u003cp\u003eSince mid-August 2026, Material Security researchers tracked a phishing operation targeting corporate Google users with Google Calendar invitations and, later, Google Drive file and document share invitations. Many invitations came from compromised accounts belonging to organizations the recipients had already communicated with, using routine themes such as voicemail notices, payment notices, and RFP requests. The links often used Google’s own redirector, share.google, Drive links, or Intuit notification links, allowing them to appear trustworthy to reputation-based checks.\u003c/p\u003e\n\n\u003cp\u003eAfter a victim clicked through, the Nyasher framework placed a live reverse proxy in front of the genuine Google sign-in process and captured the resulting active session as the victim entered credentials and approved real multi-factor authentication prompts. The phishing pages were built in the browser after a Cloudflare Turnstile challenge, limiting what conventional crawlers could retrieve and inspect. During one month of Operation CloudFire, Material Security blocked 68,676 campaign messages and reported infrastructure to Cloudflare, which placed warnings in front of confirmed phishing destinations; a stolen session could give an attacker access to email, Drive, and the ability to grant OAuth access in the victim’s name.\u003c/p\u003e\n"},{"n":1,"title":"Microsoft: Recent Windows updates cause SQL Server performance issues","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-recent-windows-updates-cause-sql-server-performance-issues/","time":"12:11","priority":"SHOULD READ","score":82,"tldr":"Microsoft says Windows updates released since October 2026 Patch Tuesday can cause SQL Server linked-server queries using OLE DB to leave external database connections open, degrading performance and stability. An out-of-band fix is expected within days; administrators can contact Microsoft Support for an interim mitigation.","briefOverview":"\u003cp\u003eMicrosoft confirmed that Windows updates released since the October 2026 Patch Tuesday are causing SQL Server performance and stability problems. The issue occurs when SQL Server linked-server queries using OLE DB providers connect to external databases and leave connections open after the queries finish. Oracle and PostgreSQL connections are among those known to be affected.\u003c/p\u003e\n\n\u003cp\u003eThe accumulating open connections can degrade server performance over time, even after the related queries have stopped running. Microsoft says the issue affects Windows 10, Windows 11, and Windows Server 2012 and later. Administrators can manually close leftover connections or restart the SQL service as a temporary measure, but doing so can end active queries and the issue may return; Microsoft plans an out-of-band Windows update within days and offers an interim mitigation through Microsoft Support for Business.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft confirmed that Windows updates released since the October 2026 Patch Tuesday can cause SQL Server performance and stability issues.","The issue affects SQL Server linked-server queries that use OLE DB providers to connect to external databases, including known Oracle and PostgreSQL connections.","Affected queries can leave connections open after completion, causing the number of open external database connections to grow and degrading server performance over time.","The problem affects Windows 10, Windows 11, and Windows Server 2012 and later, and Microsoft plans to release an out-of-band Windows update within days.","Administrators can manually close leftover connections or restart the SQL service as a temporary measure, but these actions can terminate active queries and the issue may return."],"insights":["The issue may not be immediately visible because completed linked-server queries can continue leaving external database connections open, with performance degrading as those connections accumulate over time.","The available temporary recovery actions are disruptive: manually closing connections or restarting the SQL service can terminate active queries and do not prevent the problem from returning.","Although the problem centers on SQL Server, Microsoft says it affects both Windows client systems and Windows Server systems, rather than only dedicated server installations.","Organizations needing relief before the planned out-of-band update can contact Microsoft Support for Business for an interim mitigation."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft confirmed that Windows updates released since the October 2026 Patch Tuesday are causing SQL Server performance and stability problems. The issue occurs when SQL Server linked-server queries using OLE DB providers connect to external databases and leave connections open after the queries finish. Oracle and PostgreSQL connections are among those known to be affected.\u003c/p\u003e\n\n\u003cp\u003eThe accumulating open connections can degrade server performance over time, even after the related queries have stopped running. Microsoft says the issue affects Windows 10, Windows 11, and Windows Server 2012 and later. Administrators can manually close leftover connections or restart the SQL service as a temporary measure, but doing so can end active queries and the issue may return; Microsoft plans an out-of-band Windows update within days and offers an interim mitigation through Microsoft Support for Business.\u003c/p\u003e\n"},{"n":2,"title":"Romania says it stopped Russian cyberattack targeting government emails","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/romania-russia-cyberattack-emails","time":"13:30","priority":"SHOULD READ","score":82,"tldr":"Romania’s intelligence service says it contained a December 2025 cyberespionage intrusion attributed to Russia-linked Turla that targeted government Microsoft Exchange email servers, including communications with NATO and EU institutions. Officials said no sensitive data exfiltration was identified.","briefOverview":"\u003cp\u003eRomania’s intelligence service said it detected and contained a cyberespionage intrusion at an unspecified government institution in December 2025. The agency attributed the operation to Turla, a Russian state-linked group associated with Russia’s Federal Security Service. Romanian specialists restored the affected email service and said they found no evidence that sensitive data had been taken.\u003c/p\u003e\n\n\u003cp\u003eESET reported that Turla used a previously unknown toolkit called Cereal to compromise Microsoft Exchange email servers in Romania and Kazakhstan. The malware could monitor email traffic, collect selected messages, and retain access while avoiding detection; in Romania, it was configured to intercept messages exchanged with NATO and European Union institutions. Romania said it notified relevant authorities, shared information with European intelligence services and NATO and EU partners, and is investigating other potentially related Russia-linked operations.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Romania’s intelligence service said it detected and contained a December 2025 intrusion targeting an unspecified government institution and restored the affected email service.","The Romanian Intelligence Service attributed the operation to Turla, a Russian cyberespionage group linked to Russia’s Federal Security Service.","ESET said Turla used previously unknown malware called Cereal to compromise government Microsoft Exchange email servers in Romania and Kazakhstan.","According to ESET, the malware in Romania was configured to intercept emails sent to or received from NATO and European Union institutions.","Romania said it found no evidence that sensitive data was taken and shared information about the incident with relevant authorities and European intelligence partners."],"insights":["The operation appears to have been tailored for diplomatic intelligence collection, because the malware in Romania was specifically configured to watch emails exchanged with NATO and European Union institutions.","Cereal was designed to retain access to compromised Microsoft Exchange servers while collecting selected messages and avoiding detection, rather than simply disrupting services.","Romanian authorities said they found no sensitive-data exfiltration despite identifying the intrusion, indicating that the response contained the incident before confirmed data removal.","The incident was not treated as isolated: Romania said it is investigating other potentially related Russia-linked cyber operations and shared information with NATO, EU, and European intelligence partners."],"referencedReports":[],"body":"\u003cp\u003eRomania’s intelligence service said it detected and contained a cyberespionage intrusion at an unspecified government institution in December 2025. The agency attributed the operation to Turla, a Russian state-linked group associated with Russia’s Federal Security Service. Romanian specialists restored the affected email service and said they found no evidence that sensitive data had been taken.\u003c/p\u003e\n\n\u003cp\u003eESET reported that Turla used a previously unknown toolkit called Cereal to compromise Microsoft Exchange email servers in Romania and Kazakhstan. The malware could monitor email traffic, collect selected messages, and retain access while avoiding detection; in Romania, it was configured to intercept messages exchanged with NATO and European Union institutions. Romania said it notified relevant authorities, shared information with European intelligence services and NATO and EU partners, and is investigating other potentially related Russia-linked operations.\u003c/p\u003e\n"},{"n":9,"title":"Google Cloud Warns Three AMD Turin CPU Flaws Could Leak Data Across Processes in VMs","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/google-cloud-warns-three-amd-turin-cpu.html","time":"12:09","priority":"SHOULD READ","score":82,"tldr":"Google Cloud warns that three AMD EPYC Turin transient scheduler side-channel flaws could expose data between processes inside a VM; customers must apply guest OS patches and stop then start affected VMs once Google’s CPU-information update is available. Google has already mitigated cross-VM and VM-to-host risks, while bare-metal users need firmware and OS updates.","briefOverview":"\u003cp\u003eGoogle Cloud warned that three AMD EPYC Turin processor flaws could allow code running on the same processor core within a virtual machine to infer data from other processes or the kernel. The affected Google Cloud machine series are C4D, N4D, H4D, Z4D, and G4, including C4D and Z4D bare-metal instances. Google rated the issue Medium and said it has already applied mitigations for attacks between VMs and between VMs and the host. The remaining concern is exposure among processes inside an affected VM.\u003c/p\u003e\n\n\u003cp\u003eThe flaws are transient scheduler attacks: TSA-SQ (CVE-2024-36350), TSA-L1 (CVE-2024-36357), and CVE-2026-0004, which the Xen Project calls TSA-Fill. AMD says Zen 5 processors, including Turin, are affected differently than previously characterized AMD processors. AMD classifies all three as local attacks with high attack complexity and low privilege requirements, and neither AMD nor Google reported exploitation. None of the flaws was in CISA’s Known Exploited Vulnerabilities catalog at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eFor affected VMs, customers should install their operating-system vendor’s fix when available, then stop and start the VM after Google updates the CPU information reported to it; Google states that rebooting the guest OS alone is not enough. Bare-metal customers running their own operating system or hypervisor should apply vendor fixes, while GKE node images for Turin-based bare-metal instances are planned and Cloud Run requires no action. For Turin systems on customer-owned hardware, AMD says both platform firmware and OS updates are needed for full mitigation, which may affect performance.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Google Cloud warned that three AMD EPYC Turin CPU flaws could allow code running on the same processor core inside a virtual machine to infer data from other processes or the kernel.","Google says it has already applied mitigations for attacks between virtual machines and between virtual machines and the host, while affected machine series include C4D, N4D, H4D, Z4D, and G4.","The flaws are TSA-SQ (CVE-2024-36350), TSA-L1 (CVE-2024-36357), and the newly disclosed CVE-2026-0004, also called TSA-Fill by the Xen Project.","Affected Google Cloud VM customers should install their operating system vendor’s fix when available and stop then start the VM after Google’s CPU-information update arrives, because a guest reboot alone is insufficient.","AMD says full mitigation for Turin servers on customer-owned hardware requires both platform firmware and operating-system updates, and may affect performance."],"insights":["For affected Google Cloud VMs, an ordinary reboot is explicitly insufficient; customers must stop and start the VM after Google updates the CPU information it reports.","Google has addressed the higher-isolation risks between VMs and between a VM and its host, but processes within the same VM may still be exposed until the guest operating system mitigation is enabled.","Customers may face a remediation gap because Google provides no interim action for operating systems whose vendors have not released a fix, and does not explain how to determine when its CPU-information update has reached a VM.","As of the article’s publication, none of the three flaws was listed in CISA’s Known Exploited Vulnerabilities catalog, and neither AMD nor Google reported active exploitation."],"referencedReports":[{"title":"Google Cloud Security Bulletin GCP-2026-081","url":"https://docs.cloud.google.com/support/bulletins#gcp-2026-081","publisher":"google-cloud","context":"Google’s security bulletin provides the mitigation and restart instructions for affected services.","category":"advisory","primary":true},{"title":"AMD Security Bulletin AMD-SB-7073","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-7073.html","publisher":"amd","context":"AMD’s Zen 5 bulletin classifies the transient scheduler flaws as local, high-complexity attacks requiring low privileges.","category":"advisory","primary":false},{"title":"AMD Security Bulletin AMD-SB-3055","url":"https://www.amd.com/en/resources/product-security/bulletin/amd-sb-3055.html","publisher":"amd","context":"AMD’s advisory covers the newly disclosed CVE-2026-0004 flaw.","category":"advisory","primary":false},{"title":"Technical Guidance for Mitigating Transient Scheduler Attacks","url":"https://www.amd.com/content/dam/amd/en/documents/resources/bulletin/technical-guidance-for-mitigating-transient-scheduler-attacks.pdf","publisher":"amd","context":"AMD’s technical guidance states that customer-owned Turin servers need both firmware and operating-system updates and that mitigation may affect performance.","category":"guide","primary":false},{"title":"Xen Security Advisory 525","url":"https://xenbits.xen.org/xsa/advisory-525.html","publisher":"xen-project","context":"The Xen Project advisory publishes hypervisor patches and notes that Zen 5 microcode for the TSA flaws has been available in linux-firmware since September 23.","category":"advisory","primary":false}],"body":"\u003cp\u003eGoogle Cloud warned that three AMD EPYC Turin processor flaws could allow code running on the same processor core within a virtual machine to infer data from other processes or the kernel. The affected Google Cloud machine series are C4D, N4D, H4D, Z4D, and G4, including C4D and Z4D bare-metal instances. Google rated the issue Medium and said it has already applied mitigations for attacks between VMs and between VMs and the host. The remaining concern is exposure among processes inside an affected VM.\u003c/p\u003e\n\n\u003cp\u003eThe flaws are transient scheduler attacks: TSA-SQ (CVE-2024-36350), TSA-L1 (CVE-2024-36357), and CVE-2026-0004, which the Xen Project calls TSA-Fill. AMD says Zen 5 processors, including Turin, are affected differently than previously characterized AMD processors. AMD classifies all three as local attacks with high attack complexity and low privilege requirements, and neither AMD nor Google reported exploitation. None of the flaws was in CISA’s Known Exploited Vulnerabilities catalog at the time of publication.\u003c/p\u003e\n\n\u003cp\u003eFor affected VMs, customers should install their operating-system vendor’s fix when available, then stop and start the VM after Google updates the CPU information reported to it; Google states that rebooting the guest OS alone is not enough. Bare-metal customers running their own operating system or hypervisor should apply vendor fixes, while GKE node images for Turin-based bare-metal instances are planned and Cloud Run requires no action. For Turin systems on customer-owned hardware, AMD says both platform firmware and OS updates are needed for full mitigation, which may affect performance.\u003c/p\u003e\n"},{"n":3,"title":"Hijacked email accounts complicate investigations into European bomb hoaxes","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/europe-hoax-email-threats","time":"14:45","priority":"SHOULD READ","score":79,"tldr":"Mass bomb-hoax emails targeting schools, airports and newsrooms across Europe were sent through compromised accounts at legitimate institutions, helping them bypass email checks and complicating attribution. Authorities deem the threats non-credible, but cross-border investigations are challenged by anonymized access and slow international evidence requests.","briefOverview":"\u003cp\u003eBomb-hoax emails were sent to thousands of schools across Europe, including Italian schools, roughly 1,000 Scottish schools, and schools in Northern Ireland and the Republic of Ireland. The messages also targeted airports and newsrooms in an earlier wave, according to Proofpoint. Police in Scotland and Ireland assessed the school threats as not credible, though the Italian threats prompted evacuations from Milan to Sicily.\u003c/p\u003e\n\n\u003cp\u003eThe emails were sent from compromised accounts at legitimate institutions, including an account at Taiwan’s Da-Yeh University and reportedly an address belonging to the Philippines’ Department of Education. Proofpoint said the threats it examined came from compromised accounts rather than forged addresses, allowing them to pass authentication checks and avoid spam filters. Attribution remains unresolved, and investigators may face difficulty because account access could be hidden through VPNs or proxy networks and evidence requests across jurisdictions can be slow.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Bomb-hoax emails sent to thousands of schools across Europe were transmitted through a compromised Da-Yeh University email account in Taiwan.","Authorities in Scotland and Ireland assessed the school threats as not credible, while the messages nonetheless prompted evacuations in Italy.","Proofpoint said the threats it examined came from compromised accounts rather than forged sender addresses, helping the emails pass authentication checks and avoid spam filters.","Investigators face obstacles because account-access records may be obscured by VPNs or proxy networks and evidence must be sought across multiple jurisdictions.","No government has attributed the hoaxes to a specific actor, although some messages were signed by \"fighters of the Male State\" or \"Mikhail Andropov.\""],"insights":["Using compromised accounts from legitimate institutions allows hoax emails to pass normal sender-authentication checks and evade spam filters, making them more credible-looking than forged messages.","The absence of malicious links or attachments led Proofpoint to assess disruption or intimidation, rather than malware delivery or credential theft, as the apparent objective of the messages.","Email signatures such as “fighters of the Male State” and “Mikhail Andropov” do not establish who sent the messages, so they are not reliable evidence of attribution.","The campaign’s use of accounts in multiple countries creates an investigation bottleneck because authorities may need to obtain evidence through slow cross-border legal-assistance processes."],"referencedReports":[],"body":"\u003cp\u003eBomb-hoax emails were sent to thousands of schools across Europe, including Italian schools, roughly 1,000 Scottish schools, and schools in Northern Ireland and the Republic of Ireland. The messages also targeted airports and newsrooms in an earlier wave, according to Proofpoint. Police in Scotland and Ireland assessed the school threats as not credible, though the Italian threats prompted evacuations from Milan to Sicily.\u003c/p\u003e\n\n\u003cp\u003eThe emails were sent from compromised accounts at legitimate institutions, including an account at Taiwan’s Da-Yeh University and reportedly an address belonging to the Philippines’ Department of Education. Proofpoint said the threats it examined came from compromised accounts rather than forged addresses, allowing them to pass authentication checks and avoid spam filters. Attribution remains unresolved, and investigators may face difficulty because account access could be hidden through VPNs or proxy networks and evidence requests across jurisdictions can be slow.\u003c/p\u003e\n"},{"n":13,"title":"FDA Flags Cyber, AI Risks in Autonomous Medical Robots","source":"health-isac.org","sourceColorIdx":8,"link":"https://health-isac.org/fda-flags-cyber-ai-risks-in-autonomous-medical-robots/","time":"14:00","priority":"MAY READ","score":52,"tldr":"FDA and cybersecurity experts warn that autonomous and remotely operated medical robots can expose patients to real-time harm if attackers hijack communications, inject commands, or disrupt device performance. They recommend cyber-informed clinical risk assessments linking technical threats to patient-safety outcomes.","briefOverview":"\u003cp\u003eFederal regulators and cybersecurity experts are warning that artificial intelligence and remote connectivity in robotic medical devices can introduce risks to patient safety. The devices may improve surgical precision and patient access to specialized care, but cyberattacks, AI malfunctions, and communications failures could cause harm before clinicians can intervene. Health-ISAC Vice President of Medical Device Security Phil Englert said cyber threats are especially serious when they can directly affect treatment during a procedure.\u003c/p\u003e\n\n\u003cp\u003eEnglert said that, for remote or autonomous devices, the communication connection between the operator and the device becomes part of the attack surface. Potential actions include hijacking sessions, injecting commands, stealing credentials, causing denial-of-service conditions, and creating packet loss or latency that interferes with device performance. He recommended cyber-informed clinical risk assessments that connect each cybersecurity threat to its possible effects on clinical care and patient safety, noting that an attack could influence clinical decisions or alter treatment in real time.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Federal regulators and cybersecurity experts warn that cyberattacks, AI malfunctions, and communications failures in robotic medical devices could cause serious patient harm before clinicians can intervene.","Phil Englert of Health-ISAC said remotely operated and autonomous medical devices add risk because the communication link between operator and device becomes part of the potential exposure.","Potential actions against these devices include taking over sessions, sending commands, stealing credentials, causing service disruption, and introducing packet loss or delay that affects device performance.","Health-ISAC recommends cyber-informed clinical risk assessments that evaluate how each cybersecurity threat could affect clinical care or patient safety.","According to Englert, a cyberattack on a robotic medical device could influence clinical decisions or alter patient treatment in real time."],"insights":["For remote and autonomous medical devices, the connection between the operator and the device is itself a safety-critical point that must be considered when assessing risk.","The article emphasizes that disruption can be dangerous even without taking full control of a device, because packet loss, delay, or denial of service can interfere with performance during care.","Risk assessments should connect each technical threat to a specific effect on clinical care or patient safety rather than treating device security as only a data-protection issue.","The potential impact extends beyond stolen patient information or temporary device outages to real-time changes in treatment and clinical decision-making."],"referencedReports":[],"body":"\u003cp\u003eFederal regulators and cybersecurity experts are warning that artificial intelligence and remote connectivity in robotic medical devices can introduce risks to patient safety. The devices may improve surgical precision and patient access to specialized care, but cyberattacks, AI malfunctions, and communications failures could cause harm before clinicians can intervene. Health-ISAC Vice President of Medical Device Security Phil Englert said cyber threats are especially serious when they can directly affect treatment during a procedure.\u003c/p\u003e\n\n\u003cp\u003eEnglert said that, for remote or autonomous devices, the communication connection between the operator and the device becomes part of the attack surface. Potential actions include hijacking sessions, injecting commands, stealing credentials, causing denial-of-service conditions, and creating packet loss or latency that interferes with device performance. He recommended cyber-informed clinical risk assessments that connect each cybersecurity threat to its possible effects on clinical care and patient safety, noting that an attack could influence clinical decisions or alter treatment in real time.\u003c/p\u003e\n"},{"n":10,"title":"Top AI network and infrastructure pentesting tools in 2026","source":"aikido.dev","sourceColorIdx":7,"link":"https://www.aikido.dev/blog/top-network-infrastructure-pentesting-tools","time":"14:01","priority":"MAY READ","score":35,"tldr":"The article compares six AI-driven network and infrastructure pentesting tools, recommending Aikido Security for external attack-surface testing and Pentera or Horizon3 NodeZero for internal network and Active Directory testing. It emphasizes choosing tools based on attacker starting point, deployment requirements, AI autonomy, and whether remediation retests can identify newly introduced exposure.","briefOverview":"\u003cp\u003eThe article compares six AI-driven tools for external and internal network infrastructure pentesting: Aikido Security, Pentera, Horizon3 NodeZero, Ridge Security RidgeBot, Hadrian, and Escape. It distinguishes external testing of internet-facing systems from internal testing that begins from a compromised device or stolen credentials and can move through internal systems and Active Directory. It recommends selecting a tool based on where the simulated attacker starts, how much setup is required, what the AI actually decides, and how fixes are verified.\u003c/p\u003e\n\n\u003cp\u003eAikido Security is presented as the preferred option for external network pentesting because it starts from verified domains, discovers internet-facing assets, uses agents to test hosts, and includes retests intended to find new entry points created by a fix. Pentera and Horizon3 NodeZero are positioned for internal network and Active Directory testing, while their internal tests require a server or Docker host within the organization’s network. The article argues that annual pentest reports can become outdated as organizations make frequent production changes, and it warns that retesting only an original finding can miss exposure introduced during remediation.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article distinguishes external network infrastructure pentesting, which examines internet-facing systems, from internal network infrastructure pentesting, which examines internal systems and Active Directory from an assumed foothold.","Aikido Security is presented as an external network pentesting option that begins with verified domains, discovers internet-facing assets, and includes retesting intended to identify whether fixes created new entry points.","Pentera and Horizon3 NodeZero are presented as options for internal network and Active Directory testing, with internal testing requiring a system deployed inside the organization’s network.","The article states that annual pentest reports can become outdated as organizations make frequent production changes, leaving newly deployed hosts untested until a later engagement.","The article advises buyers to assess where an attacker would start, what decisions the tool’s AI makes, what must be installed, and whether remediation verification checks more than the original finding."],"insights":["A retest that merely reruns the original exploit may miss new exposure introduced by the fix, such as a firewall change that closes one port while exposing another.","External testing can require only verified root domains, while internal assumed-breach testing typically requires deploying a host inside the organization’s network and arranging change requests or firewall access first.","The article distinguishes tools that follow prewritten attack paths from agents that choose their next action based on what they discover, arguing that fixed paths may leave other routes untested.","Aikido Security’s reported process uses separate agents to reproduce findings before they are included in a report, rather than relying solely on the original agent’s result.","For a business-critical application, the article recommends testing the application first and then testing the broader external perimeter around it."],"referencedReports":[],"body":"\u003cp\u003eThe article compares six AI-driven tools for external and internal network infrastructure pentesting: Aikido Security, Pentera, Horizon3 NodeZero, Ridge Security RidgeBot, Hadrian, and Escape. It distinguishes external testing of internet-facing systems from internal testing that begins from a compromised device or stolen credentials and can move through internal systems and Active Directory. It recommends selecting a tool based on where the simulated attacker starts, how much setup is required, what the AI actually decides, and how fixes are verified.\u003c/p\u003e\n\n\u003cp\u003eAikido Security is presented as the preferred option for external network pentesting because it starts from verified domains, discovers internet-facing assets, uses agents to test hosts, and includes retests intended to find new entry points created by a fix. Pentera and Horizon3 NodeZero are positioned for internal network and Active Directory testing, while their internal tests require a server or Docker host within the organization’s network. The article argues that annual pentest reports can become outdated as organizations make frequent production changes, and it warns that retesting only an original finding can miss exposure introduced during remediation.\u003c/p\u003e\n"},{"n":8,"title":"Webinar: See How Identity Blind Spots Put Your SOC at Risk and How to Close Them","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/your-soc-sees-alert-but-does-it-know.html","time":"12:02","priority":"MAY READ","score":25,"tldr":"A forthcoming webinar will discuss how integrating real-time identity context with SIEM and EDR alerts can help SOC teams assess permissions, blast radius, and safe containment options for human, machine, and AI identities.","briefOverview":"\u003cp\u003eThe article promotes a free webinar, “Fuel the SOC with Identity Context: Securing Humans, Machines, and AI Agents,” focused on bringing identity and access information into security investigations. It says security teams may detect suspicious logins or API activity but still lack key information about who or what is responsible, what permissions the identity has, and which systems it can reach. This gap can delay incident response and make it harder to determine the likely impact of a compromised account.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that organizations now use service accounts, API keys, automated workloads, and AI agents alongside employee accounts, and these identities can access important systems and data. Connecting identity intelligence with existing SIEM and EDR alerts can help analysts identify involved identities, assess connected systems and possible lateral movement, and contain threats without unnecessarily disrupting critical automation. The webinar will cover alert enrichment, blast-radius assessment, incident response, and shared workflows, escalation paths, metrics, and response playbooks for IAM and security operations teams.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article promotes a free webinar titled “Fuel the SOC with Identity Context: Securing Humans, Machines, and AI Agents.”","Security operations teams may detect suspicious activity but lack information about the identity involved, its permissions, and the systems it can access.","Service accounts, API keys, automated workloads, and AI agents can access important systems and data, increasing the complexity of security investigations.","Connecting identity information with existing SIEM and EDR alerts can help analysts assess potential lateral movement and respond without unnecessarily disrupting critical automation.","The webinar will cover practical methods for enriching alerts with identity context, investigating lateral movement, assessing potential attack impact, and aligning IAM and security operations workflows."],"insights":["A compromised account cannot always be disabled immediately, because it may support a critical business process and shutting it down could disrupt production.","The article frames identity context as necessary for judging an incident’s potential “blast radius,” including which connected systems and permissions could enable an intruder to move further.","Machine identities and AI agents may act without direct human involvement, so investigations must account for more than employee accounts.","The proposed improvement is not another alerting dashboard, but shared information, escalation paths, metrics, and response playbooks between identity and security operations teams."],"referencedReports":[],"body":"\u003cp\u003eThe article promotes a free webinar, “Fuel the SOC with Identity Context: Securing Humans, Machines, and AI Agents,” focused on bringing identity and access information into security investigations. It says security teams may detect suspicious logins or API activity but still lack key information about who or what is responsible, what permissions the identity has, and which systems it can reach. This gap can delay incident response and make it harder to determine the likely impact of a compromised account.\u003c/p\u003e\n\n\u003cp\u003eThe article highlights that organizations now use service accounts, API keys, automated workloads, and AI agents alongside employee accounts, and these identities can access important systems and data. Connecting identity intelligence with existing SIEM and EDR alerts can help analysts identify involved identities, assess connected systems and possible lateral movement, and contain threats without unnecessarily disrupting critical automation. The webinar will cover alert enrichment, blast-radius assessment, incident response, and shared workflows, escalation paths, metrics, and response playbooks for IAM and security operations teams.\u003c/p\u003e\n"}]</script>
