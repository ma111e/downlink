<script type="application/json" id="dl-articles">[{"n":2,"title":"Malicious npm packages evade install-script defenses at runtime","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/malicious-npm-packages-evade-install-script-defenses-at-runtime/","time":"14:11","priority":"SHOULD READ","score":88,"tldr":"Malicious npm packages led by indexed-btree evaded install-script protections by embedding a runtime loader in a commonly used library method, allowing malware to execute only when triggered by application behavior. Developers who installed the affected packages should rotate secrets and restore affected environments from known-safe backups.","briefOverview":"\u003cp\u003eCheckmarx researchers identified an npm malware campaign involving indexed-btree, a package that impersonates the legitimate sorted-btree library and has amassed 2 million weekly downloads. The package avoids npm\u0026rsquo;s install-script approval protections by hiding a malicious loader in the normal BTree.prototype.set() method rather than using preinstall, install, or postinstall scripts. This means installation appears clean, while the malicious code can run later when an application calls the method with a specific key value.\u003c/p\u003e\n\n\u003cp\u003eOnce triggered, the malware gathers system details such as architecture, hostname, CPU, memory, and uptime and sends them through hardcoded Slack and Telegram channels. It also polls an Ethereum Sepolia test-network smart contract for command-and-control information, using X25519 key exchange and AES decryption to retrieve a second-stage payload. Checkmarx linked nine additional removed npm packages to the operation, and advises anyone who installed the affected packages to rotate all secrets and restore their development environment from a safe backup.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Checkmarx identified indexed-btree as a malicious npm package impersonating the legitimate sorted-btree library, with roughly 2 million weekly downloads.","The package avoids npm install-script protections by placing its loader in the BTree.prototype.set() function, where it runs only when the application calls the function with a specific key value.","After execution, the malware collects system details and sends them through hardcoded Slack and Telegram channels, then retrieves command-and-control information from an Ethereum Sepolia test-network smart contract.","Checkmarx linked nine additional npm packages to the operation, and npm has removed them.","Developers who installed indexed-btree or the related packages are advised to rotate all secrets and restore their development environments from safe backups."],"insights":["Blocking installation scripts alone did not stop this campaign because the malicious code was embedded in a normal library function and activated during ordinary runtime use.","The runtime trigger was placed in BTree.prototype.set(), described by Checkmarx as the library's main function that users would call frequently, increasing the likelihood that affected applications would activate the loader.","The operators used an Ethereum Sepolia test-network smart contract to hold encrypted second-stage payload information, while X25519 key exchange and AES were used to decrypt it.","The malware includes a cleanup capability that can delete its files and remove the malicious package trigger, making it possible for operators to erase traces when ending the operation.","The campaign's apparently legitimate GitHub repository, fabricated commit history, and curated developer account show that package reputation signals can be deliberately constructed to appear trustworthy."],"referencedReports":[{"title":"NPM BTree Malware Campaign Affects Millions of Downloads, No Need for Install Script","url":"https://checkmarx.com/zero-post/npm-btree-malware-campaign-affects-millions-of-downloads-no-need-for-install-script/","publisher":"checkmarx","context":"The article relies on Checkmarx researchers' technical analysis of the malicious indexed-btree npm package and its runtime loader.","category":"research","primary":true}],"body":"\u003cp\u003eCheckmarx researchers identified an npm malware campaign involving indexed-btree, a package that impersonates the legitimate sorted-btree library and has amassed 2 million weekly downloads. The package avoids npm\u0026rsquo;s install-script approval protections by hiding a malicious loader in the normal BTree.prototype.set() method rather than using preinstall, install, or postinstall scripts. This means installation appears clean, while the malicious code can run later when an application calls the method with a specific key value.\u003c/p\u003e\n\n\u003cp\u003eOnce triggered, the malware gathers system details such as architecture, hostname, CPU, memory, and uptime and sends them through hardcoded Slack and Telegram channels. It also polls an Ethereum Sepolia test-network smart contract for command-and-control information, using X25519 key exchange and AES decryption to retrieve a second-stage payload. Checkmarx linked nine additional removed npm packages to the operation, and advises anyone who installed the affected packages to rotate all secrets and restore their development environment from a safe backup.\u003c/p\u003e\n"},{"n":1,"title":"Researchers escape OpenAI Codex sandbox to run commands on host","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/researchers-escape-openai-codex-sandbox-to-run-commands-on-host/","time":"12:00","priority":"SHOULD READ","score":83,"tldr":"Researchers found two Codex sandbox escapes—Heapjack and Overpatch—that could let malicious repositories execute commands or write outside intended boundaries on developers’ machines. OpenAI fixed the issues in Codex Desktop 26.818.21641 and Codex CLI 0.149.0, so users should update.","briefOverview":"\u003cp\u003eResearchers at Accomplish AI discovered two methods for escaping OpenAI Codex’s sandbox, named Heapjack and Overpatch. Heapjack could allow a malicious repository opened in Codex to run commands on a developer’s computer even from Codex’s read-only mode, without an approval prompt or visible output. Overpatch could let Codex CLI write outside its intended project folder in workspace-write mode.\u003c/p\u003e\n\n\u003cp\u003eHeapjack targeted the default-enabled \u003ccode\u003enode_repl\u003c/code\u003e component, where trusted and untrusted JavaScript contexts shared a single Node.js process and memory heap. Untrusted code could scan memory for the trusted context’s authorization token, then use that token to send requests to an unsandboxed parent process. Overpatch abused the \u003ccode\u003eapply_patch\u003c/code\u003e tool’s handling of patch paths to widen write permissions and append a line to \u003ccode\u003e.zshrc\u003c/code\u003e through a symlink. OpenAI fixed Heapjack in Codex Desktop build 26.818.21641 and Overpatch in Codex CLI version 0.149.0, and users are advised to update.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers at Accomplish AI reported two OpenAI Codex sandbox escapes, Heapjack and Overpatch, on August 12, and OpenAI fixed them within eight days.","Heapjack could allow a malicious repository opened in Codex to run commands on a developer’s machine from Codex’s read-only mode without an approval prompt or visible output.","Heapjack exploited node_repl by reading a trusted authorization token from the shared memory heap of a Node.js process and using it to communicate with an unsandboxed parent process.","Overpatch abused Codex CLI’s apply_patch tool in workspace-write mode to expand write permissions and append a line to a user’s .zshrc through a symlink.","OpenAI fixed Heapjack in Codex Desktop build 26.818.21641 and Overpatch in Codex CLI version 0.149.0."],"insights":["Codex Desktop installed the node_repl component in the shared ~/.codex/config.toml file by default, causing Codex CLI users to inherit it without being asked.","Heapjack worked even in Codex’s read-only mode, showing that a mode intended to prevent file changes could still be used to reach an unsandboxed parent process.","In Overpatch, including /tmp as a path in a patch caused apply_patch to grant write access to the disk’s root directory, even though that patch change did not need to modify anything useful.","Both flaws resulted from placing a security check inside the environment controlled by untrusted code: one trusted an attacker-supplied path, while the other stored its authorization secret in memory accessible to untrusted JavaScript."],"referencedReports":[{"title":"Escaping the OpenAI Codex Sandbox Twice","url":"https://www.accomplish.ai/blog/escaping-the-openai-codex-sandbox-twice/","publisher":"accomplish-ai","context":"The article relies on Oren Yomtov of Accomplish AI's technical writeup for the Heapjack and Overpatch sandbox-escape details.","category":"research","primary":true}],"body":"\u003cp\u003eResearchers at Accomplish AI discovered two methods for escaping OpenAI Codex’s sandbox, named Heapjack and Overpatch. Heapjack could allow a malicious repository opened in Codex to run commands on a developer’s computer even from Codex’s read-only mode, without an approval prompt or visible output. Overpatch could let Codex CLI write outside its intended project folder in workspace-write mode.\u003c/p\u003e\n\n\u003cp\u003eHeapjack targeted the default-enabled \u003ccode\u003enode_repl\u003c/code\u003e component, where trusted and untrusted JavaScript contexts shared a single Node.js process and memory heap. Untrusted code could scan memory for the trusted context’s authorization token, then use that token to send requests to an unsandboxed parent process. Overpatch abused the \u003ccode\u003eapply_patch\u003c/code\u003e tool’s handling of patch paths to widen write permissions and append a line to \u003ccode\u003e.zshrc\u003c/code\u003e through a symlink. OpenAI fixed Heapjack in Codex Desktop build 26.818.21641 and Overpatch in Codex CLI version 0.149.0, and users are advised to update.\u003c/p\u003e\n"},{"n":3,"title":"The Phishing Kit That Emailed Us Its Own Billing Meter","source":"ironscales.com","sourceColorIdx":9,"link":"https://ironscales.com/threat-intelligence/phishing-as-a-service-console-log-shipped-inside-the-delivered-email-body","time":"11:00","priority":"SHOULD READ","score":82,"tldr":"A phishing-as-a-service campaign accidentally pasted its live operator console into a document-invite email, exposing its Enterprise subscription, 138,291 lifetime sends, 4,043 loaded targets, SMTP configuration, and delivery logs. The message passed conventional email authentication and bypassed the recipient gateway, showing why behavioral and content-based detection is needed against legitimate-account abuse and credential-harvesting lures.","briefOverview":"\u003cp\u003eA document-invite phishing email sent to the chief executive of a US Midwest grocery retailer on September 4, 2026 accidentally included the live web console of the phishing-as-a-service platform that delivered it. The pasted panel showed an active Enterprise subscription with 23 days remaining, 138,291 lifetime emails, 4,043 loaded leads, one SMTP server, 25 concurrent sends, and zero batch delay. Its delivery log contained fifty successful SMTP 250 responses to distinct recipients across forty-nine domains, and the reported throughput and completion estimates matched the displayed timestamps.\u003c/p\u003e\n\n\u003cp\u003eThe receiving cloud gateway assigned the email a score of 0.50 against a blocking threshold of 3.0, with the only nonzero signal caused by a non-standard HTTP port exposed in the pasted console log. The message passed SPF at the true inbound edge because it was sent through an abused legitimate provider account, while later authentication failures resulted from the recipient-side mail-routing topology and body rewriting after signing. Detection instead relied on a malicious final destination, exact display-name impersonation, and community reputation similarity; Themis assessed it at 88% confidence, and the single affected mailbox was mitigated six seconds after receipt.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A document-invite phishing email delivered to the chief executive of a US Midwest grocery retailer on September 4, 2026 accidentally included a copy of the phishing service's live operator console in its HTML body.","The exposed console showed an active Enterprise plan with 23 days remaining, 138,291 lifetime emails, 4,043 loaded leads, one SMTP server, 25 concurrent sends, and no batch delay.","Its delivery log showed 50 successful deliveries with SMTP 250 responses, while the displayed sending rates and completion estimates were consistent with the log timestamps.","The recipient gateway assigned the message a total score of 0.50 against a blocking threshold of 3.0, and its only weighted signal came from a non-standard HTTP port shown in the accidentally exposed console log.","The article states that detection ultimately relied on a malicious final-destination verdict, display-name impersonation, and community reputation similarity, and that the single affected mailbox was mitigated six seconds after receipt."],"insights":["The console’s throughput and remaining-time estimates matched the elapsed timestamps, providing evidence that the pasted panel reflected live campaign activity rather than static or fabricated text.","The only gateway rule with a nonzero score was triggered by the exposed relay port inside the accidental console log, meaning the leaked operational data—not the lure itself—supplied the message’s entire conventional gateway score.","The email passed SPF at the actual inbound edge because it was sent through an abused legitimate provider account, illustrating that successful sender-authentication checks did not establish that the message was safe.","The article distinguishes infrastructure controlled by the sender from infrastructure merely abused or compromised, including a legitimate insurance-brand domain, an older relay host, and a compromised personal website.","Because custom HTML can be appended to generated phishing templates, kit banners, licence meters, lead-loader lines, and delivery-log patterns can serve as inexpensive high-confidence body-content detection signals."],"referencedReports":[{"title":"2026 Data Breach Investigations Report","url":"https://www.verizon.com/business/resources/Ta2/reports/2026-dbir-data-breach-investigations-report.pdf","publisher":"verizon","context":"The article cites the report’s findings on phishing as an initial access vector and the human element in breaches.","category":"research","primary":false},{"title":"Phishing Guidance: Stopping the Attack Cycle at Phase One","url":"https://www.cisa.gov/resources-tools/resources/phishing-guidance-stopping-attack-cycle-phase-one","publisher":"cisa","context":"The article references CISA’s guidance to support its emphasis on behavioral and content-based phishing detection.","category":"guide","primary":false}],"body":"\u003cp\u003eA document-invite phishing email sent to the chief executive of a US Midwest grocery retailer on September 4, 2026 accidentally included the live web console of the phishing-as-a-service platform that delivered it. The pasted panel showed an active Enterprise subscription with 23 days remaining, 138,291 lifetime emails, 4,043 loaded leads, one SMTP server, 25 concurrent sends, and zero batch delay. Its delivery log contained fifty successful SMTP 250 responses to distinct recipients across forty-nine domains, and the reported throughput and completion estimates matched the displayed timestamps.\u003c/p\u003e\n\n\u003cp\u003eThe receiving cloud gateway assigned the email a score of 0.50 against a blocking threshold of 3.0, with the only nonzero signal caused by a non-standard HTTP port exposed in the pasted console log. The message passed SPF at the true inbound edge because it was sent through an abused legitimate provider account, while later authentication failures resulted from the recipient-side mail-routing topology and body rewriting after signing. Detection instead relied on a malicious final destination, exact display-name impersonation, and community reputation similarity; Themis assessed it at 88% confidence, and the single affected mailbox was mitigated six seconds after receipt.\u003c/p\u003e\n"},{"n":4,"title":"GHAPPIER - One loader, sixty-five repositories, twenty-two accounts: an unreported loader family beside DPRK's PolinRider campaign","source":"cloudsek.com","sourceColorIdx":2,"link":"https://www.cloudsek.com/blog/ghappier-malware-loader-npm-supply-chain-attack","time":"00:00","priority":"SHOULD READ","score":82,"tldr":"Researchers uncovered GHAPPIER, a previously unreported malware loader family distributed through 65 GitHub repositories operated by 22 accounts and linked to infrastructure associated with DPRK-aligned PolinRider activity.","briefOverview":"\u003cp\u003eThe article describes GHAPPIER as a previously unreported loader family. Its title connects the activity to 65 repositories and 22 accounts. The article places GHAPPIER alongside the DPRK-linked PolinRider campaign.\u003c/p\u003e\n\n\u003cp\u003eThe reported scale suggests that GHAPPIER activity was spread across many repositories rather than limited to one location. The article highlights the use of multiple accounts as part of this activity. Its central significance is the identification of an additional loader family connected in the article to activity beside PolinRider.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["The article identifies GHAPPIER as a previously unreported loader family.","GHAPPIER is associated in the article with 65 repositories and 22 accounts.","The article places GHAPPIER alongside North Korea-linked PolinRider campaign activity."],"insights":["The activity was distributed across 65 repositories operated through 22 accounts, indicating that the loader family was not confined to a single repository or account.","GHAPPIER is described as previously unreported and positioned beside the DPRK-linked PolinRider campaign, expanding the set of activity tracked in connection with that campaign."],"referencedReports":[],"body":"\u003cp\u003eThe article describes GHAPPIER as a previously unreported loader family. Its title connects the activity to 65 repositories and 22 accounts. The article places GHAPPIER alongside the DPRK-linked PolinRider campaign.\u003c/p\u003e\n\n\u003cp\u003eThe reported scale suggests that GHAPPIER activity was spread across many repositories rather than limited to one location. The article highlights the use of multiple accounts as part of this activity. Its central significance is the identification of an additional loader family connected in the article to activity beside PolinRider.\u003c/p\u003e\n"}]</script>
