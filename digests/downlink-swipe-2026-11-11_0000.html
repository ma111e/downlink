 Server issues caused by October updates that prevented Outlook on the web sign-ins and disrupted email delivery. Organizations unable to patch immediately can temporarily raise the Endpoint Mapper limit through a registry change and reboot the affected server.","briefOverview":"\u003cp\u003eMicrosoft said its November 2026 Patch Tuesday updates, KB5131080 and KB5131090, fix Outlook sign-in and mail-delivery problems affecting some on-premises Exchange Server systems. The issues began after October 2026 Windows Server security updates were installed on Windows Server 2019 and later. Affected users could be unable to sign in to Outlook on the web, while messages sent through Outlook could remain in the Outbox and fail to deliver.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft attributed the issue to a new default limit on Endpoint Mapper memory for handling Endpoint Lookup calls, introduced in the October updates. The severity and speed of impact can vary with Exchange server load, and some servers may never encounter the issue; mailbox replication can also be affected. Organizations unable to immediately deploy the November updates can temporarily increase the Endpoint Mapper limit through the EpmapSavedContextCap registry value, restart the server, and monitor for recurrence. Microsoft said the problem is not related to October 2026 Exchange Server security updates and advised customers not to uninstall those updates.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft said its November 2026 Patch Tuesday updates, KB5131080 and KB5131090, fix Exchange Server sign-in and mail delivery problems caused by October 2026 Windows Server security updates.","The affected systems are on-premises Exchange servers running Windows Server 2019 and later, where users may be unable to sign in to Outlook on the web and messages can remain undelivered in the Outbox.","Microsoft attributed the issue to a new default limit on memory used by Endpoint Mapper for Endpoint Lookup calls, introduced in the October 2026 updates.","Organizations that cannot immediately install the November cumulative updates can temporarily increase the Endpoint Mapper limit by modifying the EpmapSavedContextCap registry value and restarting the Exchange Server.","Microsoft said the issue is not connected to the October 2026 Exchange Server security updates and advised customers not to remove those updates."],"insights":["The impact is uneven: Microsoft said the severity and timing of failures depend on Exchange server load, and some servers may never experience the problem.","The issue can also interfere with mailbox replication, extending the impact beyond user sign-ins and messages stuck in the Outbox.","Microsoft’s temporary registry workaround requires administrators to monitor the Exchange environment after restarting and raise the Endpoint Mapper memory limit again if the issue returns.","Microsoft explicitly said the problem is unrelated to the October 2026 Exchange Server security updates, so customers should not uninstall those updates."],"referencedReports":[],"body":"\u003cp\u003eMicrosoft said its November 2026 Patch Tuesday updates, KB5131080 and KB5131090, fix Outlook sign-in and mail-delivery problems affecting some on-premises Exchange Server systems. The issues began after October 2026 Windows Server security updates were installed on Windows Server 2019 and later. Affected users could be unable to sign in to Outlook on the web, while messages sent through Outlook could remain in the Outbox and fail to deliver.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft attributed the issue to a new default limit on Endpoint Mapper memory for handling Endpoint Lookup calls, introduced in the October updates. The severity and speed of impact can vary with Exchange server load, and some servers may never encounter the issue; mailbox replication can also be affected. Organizations unable to immediately deploy the November updates can temporarily increase the Endpoint Mapper limit through the EpmapSavedContextCap registry value, restart the server, and monitor for recurrence. Microsoft said the problem is not related to October 2026 Exchange Server security updates and advised customers not to uninstall those updates.\u003c/p\u003e\n"},{"n":11,"title":"Hackers use AntiFox AI agents in AWS credential-theft attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/hackers-use-antifox-ai-agents-in-aws-credential-theft-attacks/","time":"15:12","priority":"SHOULD READ","score":84,"tldr":"Attackers are hosting the AntiFox AI penetration-testing platform on Alibaba Cloud to automate web intrusions and abuse valid AWS credentials, sometimes stealing production secrets and manipulating S3 data. Defenders should investigate unusual bursts of AWS API activity alongside IIS webshell indicators and promptly revoke or rotate exposed credentials.","briefOverview":"\u003cp\u003eAttackers are hosting self-managed instances of AntiFox, an open-source AI-driven penetration-testing platform, on Alibaba Cloud to target internet-facing web services and connected AWS environments. Arctic Wolf linked this infrastructure to vulnerability exploitation, webshell deployment, credential validation, configuration discovery, and the harvesting of AWS secrets. AntiFox, originally forked from ARTEX 0.1.1, can automate tasks such as mapping exposed services and probing endpoints for weaknesses.\u003c/p\u003e\n\n\u003cp\u003eIn one reported intrusion, an attacker installed an ASPX webshell on an exposed IIS server, ran operating-system commands, accessed application settings and database connection strings, and copied configuration and log files to a web-accessible location. The attackers also used valid AWS IAM credentials and assumed EC2 roles to make hundreds of authenticated API requests in roughly 30 minutes, obtaining production secrets in some cases; a separate incident involved reading, copying, and deleting S3 objects. Arctic Wolf recommends correlating IIS webshell activity with unusual AWS access, reviewing successful calls amid bursts of denials, revoking affected AWS sessions and keys, and rotating credentials exposed in application files.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Attackers hosted self-managed instances of the open-source AntiFox AI penetration-testing platform on Alibaba Cloud to target web services and AWS environments.","Arctic Wolf observed AntiFox-linked infrastructure used for vulnerability exploitation, webshell deployment, credential validation, configuration discovery, and AWS secret harvesting.","In one incident, an attacker deployed an ASPX webshell on an internet-exposed IIS server and copied application configuration and log files to a web-accessible directory.","Attackers used valid AWS IAM credentials and assumed EC2 roles to make authenticated AWS API requests, with some attempts obtaining production secrets.","Arctic Wolf recommends correlating IIS webshell activity with unusual AWS access, revoking affected AWS sessions and keys, and rotating credentials exposed through application files."],"insights":["A burst of denied AWS API calls followed by successful requests can indicate attackers cycling through valid IAM users or assumed EC2 roles until they find permissions that work.","Activity on an exposed IIS server can directly endanger connected AWS environments when application configuration files contain cloud credentials or production secrets.","AntiFox’s stated prohibition on real-world or illegal use is not backed by technical controls described in the article, so the tool remains available for misuse despite its published restrictions.","The reported intrusions show that valid AWS credentials can be used not only to probe cloud services but also to read, copy, and delete S3 objects."],"referencedReports":[{"title":"AntiFox Alibaba-hosted platforms facilitate web/cloud intrusions","url":"https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202611-antifox-alibaba-hosted-platforms-facilitate-web-cloud-intrusions","publisher":"arctic-wolf","context":"The article relies on Arctic Wolf’s report for its observations of AntiFox-linked Alibaba Cloud infrastructure and associated web and AWS intrusions.","category":"research","primary":true}],"body":"\u003cp\u003eAttackers are hosting self-managed instances of AntiFox, an open-source AI-driven penetration-testing platform, on Alibaba Cloud to target internet-facing web services and connected AWS environments. Arctic Wolf linked this infrastructure to vulnerability exploitation, webshell deployment, credential validation, configuration discovery, and the harvesting of AWS secrets. AntiFox, originally forked from ARTEX 0.1.1, can automate tasks such as mapping exposed services and probing endpoints for weaknesses.\u003c/p\u003e\n\n\u003cp\u003eIn one reported intrusion, an attacker installed an ASPX webshell on an exposed IIS server, ran operating-system commands, accessed application settings and database connection strings, and copied configuration and log files to a web-accessible location. The attackers also used valid AWS IAM credentials and assumed EC2 roles to make hundreds of authenticated API requests in roughly 30 minutes, obtaining production secrets in some cases; a separate incident involved reading, copying, and deleting S3 objects. Arctic Wolf recommends correlating IIS webshell activity with unusual AWS access, reviewing successful calls amid bursts of denials, revoking affected AWS sessions and keys, and rotating credentials exposed in application files.\u003c/p\u003e\n"},{"n":12,"title":"Iran-backed network directed London attacks over FaceTime, US prosecutors say","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/iran-backed-network-directed-london-attacks-over-facetime","time":"16:57","priority":"SHOULD READ","score":84,"tldr":"U.S. prosecutors allege that an IRGC-linked Kataib Hezbollah network remotely directed and recorded arson, stabbing, and attempted attacks on Jewish, American, and military-linked sites across Europe, including London, using FaceTime and other apps. Evidence recovered from a defendant’s seized iPhone reportedly documented the coordination, propaganda recordings, and plots including an attempted attack on RAF Fairford.","briefOverview":"\u003cp\u003eU.S. prosecutors have accused three men of directing a Europe-wide campaign of attacks and attempted attacks on behalf of Iran’s Islamic Revolutionary Guard Corps (IRGC), according to a superseding indictment. The alleged targets included Jewish sites in Belgium, the Netherlands, and London; U.S. bank buildings in Amsterdam and Paris; Iran International in London; and RAF Fairford, a British air base used by U.S. bombers. Mohammad al-Saadi, an alleged Kataib Hezbollah commander, is jailed in New York, while the two added defendants, alleged IRGC operative Mohsen Mohajeri and Mohammed Ali al-Hassani, are believed to be in Iran.\u003c/p\u003e\n\n\u003cp\u003eProsecutors say al-Hassani gave attackers live instructions through FaceTime during London arson incidents, with calls streamed to a room displaying a militia logo and recorded for propaganda. Investigators recovered recordings of FaceTime calls, raw attack footage, and messages from al-Saadi’s seized iPhone; the article notes that FaceTime’s end-to-end encryption did not prevent access to recordings stored on the device. The indictment also alleges planning for an attack on RAF Fairford involving vans, fuel, potential shrapnel, and intended explosives, although British authorities said they found petrol but no explosives after stopping and recovering the vehicles.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["A U.S. superseding indictment alleges that three men linked to Iran’s Islamic Revolutionary Guard Corps and Kataib Hezbollah orchestrated attacks and attempted attacks at Jewish, American, and military-linked sites across Europe.","Prosecutors say attackers in London received live instructions over FaceTime during arson incidents targeting a Jewish charity building, Iran International, and a synagogue, while the calls were recorded for propaganda.","The indictment alleges that the network later planned an attack on RAF Fairford using vans, fuel, potential shrapnel, and intended explosives, but British authorities reported finding petrol and no explosives after stopping the vehicles.","Much of the cited evidence was recovered from Mohammad al-Saadi’s iPhone, including recorded FaceTime calls, raw attack footage, and messages with a Kataib Hezbollah contact.","Mohsen Mohajeri and Mohammed Ali al-Hassani are at large and believed to be in Iran, while al-Saadi has been jailed in New York since May."],"insights":["The alleged organizers treated filmed proof of attacks as operationally important: prosecutors say attacks were livestreamed to a room displaying a militia logo, and an IRGC operative filmed the people directing them.","Although FaceTime calls are end-to-end encrypted and Apple cannot access their contents during calls, investigators reportedly obtained recordings because they were stored on al-Saadi’s seized iPhone.","The alleged network used several consumer platforms—FaceTime, Telegram, WhatsApp, Snapchat, and X—while the FBI linked al-Saadi’s accounts through a single phone number.","The indictment alleges that the group combined physical attacks with false or unverified public claims, including a claim that a drone carrying radioactive material targeted the Israeli Embassy in London, despite police finding no hazardous material.","The evidence described spans both digital records and physical preparations, including videos, messages, cryptocurrency payments, surveillance of RAF Fairford, vans, fuel, and items that could serve as shrapnel."],"referencedReports":[],"body":"\u003cp\u003eU.S. prosecutors have accused three men of directing a Europe-wide campaign of attacks and attempted attacks on behalf of Iran’s Islamic Revolutionary Guard Corps (IRGC), according to a superseding indictment. The alleged targets included Jewish sites in Belgium, the Netherlands, and London; U.S. bank buildings in Amsterdam and Paris; Iran International in London; and RAF Fairford, a British air base used by U.S. bombers. Mohammad al-Saadi, an alleged Kataib Hezbollah commander, is jailed in New York, while the two added defendants, alleged IRGC operative Mohsen Mohajeri and Mohammed Ali al-Hassani, are believed to be in Iran.\u003c/p\u003e\n\n\u003cp\u003eProsecutors say al-Hassani gave attackers live instructions through FaceTime during London arson incidents, with calls streamed to a room displaying a militia logo and recorded for propaganda. Investigators recovered recordings of FaceTime calls, raw attack footage, and messages from al-Saadi’s seized iPhone; the article notes that FaceTime’s end-to-end encryption did not prevent access to recordings stored on the device. The indictment also alleges planning for an attack on RAF Fairford involving vans, fuel, potential shrapnel, and intended explosives, although British authorities said they found petrol but no explosives after stopping and recovering the vehicles.\u003c/p\u003e\n"},{"n":17,"title":"Hackers Target Qlik Sense Servers With Reverse Shells, Stage ActiveMQ and Veeam Exploits","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/hackers-target-qlik-sense-servers-with.html","time":"14:01","priority":"SHOULD READ","score":84,"tldr":"Threat actors are targeting Qlik Sense servers with PowerShell reverse shells and staging tools to exploit Apache ActiveMQ and Veeam flaws, suggesting preparation for wider attacks. Organizations should urgently patch Qlik Sense, ActiveMQ, and Veeam systems and investigate suspicious scheduler.exe, OpenSSH, and scheduled-task activity.","briefOverview":"\u003cp\u003eCynet detected unsuccessful attempts to deliver PowerShell reverse shells to several European Union-based Qlik Sense environments in October 2026, within a window of just over three minutes. The command ran under scheduler.exe and attempted to connect to 45.115.26[.]23 on port 4455. Cynet said the activity shares overlap with a November 2023 campaign in which actors likely linked to the CACTUS ransomware operation targeted Qlik Sense flaws, although the exact entry vulnerability in the latest activity is unknown.\u003c/p\u003e\n\n\u003cp\u003eIn controlled testing, Cynet found the reverse shell could support reconnaissance and delivery of scripts intended to maintain access. One variant used a Windows Go reverse shell connecting to port 4456 and checked for Apache ActiveMQ processes; on Linux, it also attempted to gather system information and read the /etc/shadow and /etc/passwd files. Another variant tried to install OpenSSH and created a WinUpdCheck scheduled task that launched a PowerShell reverse shell every five minutes, while the actor’s exposed infrastructure contained an ActiveMQ exploit for CVE-2023-46604 and a modified Veeam toolchain for CVE-2024-40711.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Cynet detected unsuccessful PowerShell reverse-shell attempts against several European Union-based Qlik Sense environments during a period of just over three minutes in October 2026.","The PowerShell command was executed under scheduler.exe and attempted to connect to 45.115.26[.]23 on port 4455 using a one-line reverse shell.","The observed activity overlaps with a November 2023 campaign linked to the CACTUS ransomware operation that exploited Qlik Sense flaws for initial access.","Cynet found that the operator's exposed infrastructure included a Windows Go backdoor, OpenSSH persistence scripts, an Apache ActiveMQ exploit for CVE-2023-46604, and a modified Veeam toolchain for CVE-2024-40711.","A second PowerShell-script variant attempted to install OpenSSH and create a scheduled task named WinUpdCheck that ran a reverse shell every five minutes."],"insights":["CVE-2023-48365, known as DoubleQlik, was identified as an incomplete fix for the earlier Qlik Sense flaw CVE-2023-41265.","The observed operation used separate network ports for different purposes: port 4455 for the initial PowerShell reverse shell and port 4456 for a Windows Go-based backdoor.","The persistence mechanism used a scheduled task named WinUpdCheck to run a reverse-shell script every five minutes and attempted to enable remote access through OpenSSH.","The actor reused a legitimate OpenSSH package while adding an inbound firewall rule for TCP port 22, making the installation component itself less obviously malicious."],"referencedReports":[{"title":"Critical Security Fixes for Qlik Sense Enterprise for Windows","url":"https://community.qlik.com/t5/Official-Support-Articles/Critical-Security-fixes-for-Qlik-Sense-Enterprise-for-Windows/ta-p/2110801","publisher":"qlik","context":"The article cites this Qlik security advisory for CVE-2023-41265 and CVE-2023-41266.","category":"advisory","primary":false},{"title":"Critical Security Fixes for Qlik Sense Enterprise for Windows","url":"https://community.qlik.com/t5/Official-Support-Articles/Critical-Security-fixes-for-Qlik-Sense-Enterprise-for-Windows/tac-p/2120510","publisher":"qlik","context":"The article cites this Qlik security advisory for CVE-2023-48365, also known as DoubleQlik.","category":"advisory","primary":false}],"body":"\u003cp\u003eCynet detected unsuccessful attempts to deliver PowerShell reverse shells to several European Union-based Qlik Sense environments in October 2026, within a window of just over three minutes. The command ran under scheduler.exe and attempted to connect to 45.115.26[.]23 on port 4455. Cynet said the activity shares overlap with a November 2023 campaign in which actors likely linked to the CACTUS ransomware operation targeted Qlik Sense flaws, although the exact entry vulnerability in the latest activity is unknown.\u003c/p\u003e\n\n\u003cp\u003eIn controlled testing, Cynet found the reverse shell could support reconnaissance and delivery of scripts intended to maintain access. One variant used a Windows Go reverse shell connecting to port 4456 and checked for Apache ActiveMQ processes; on Linux, it also attempted to gather system information and read the /etc/shadow and /etc/passwd files. Another variant tried to install OpenSSH and created a WinUpdCheck scheduled task that launched a PowerShell reverse shell every five minutes, while the actor’s exposed infrastructure contained an ActiveMQ exploit for CVE-2023-46604 and a modified Veeam toolchain for CVE-2024-40711.\u003c/p\u003e\n"},{"n":20,"title":"AntiFox AI Pentesting Platform Linked to Attacks That Accessed AWS Production Secrets","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/antifox-ai-pentesting-platform-linked.html","time":"15:34","priority":"SHOULD READ","score":84,"tldr":"Researchers linked the AntiFox AI penetration-testing platform to intrusions that compromised IIS applications or abused valid AWS credentials, enabling attackers to enumerate cloud services and access production secrets. The case highlights how agentic security tools can accelerate multi-stage attacks with minimal operator effort.","briefOverview":"\u003cp\u003eArctic Wolf Labs reported that Alibaba Cloud systems hosting the AntiFox AI penetration-testing platform were associated with malicious activity against internet-facing web services and Amazon Web Services (AWS) environments. AntiFox is an open-source, AI-driven platform designed to automate stages of an authorized penetration test, from reconnaissance through reporting. In observed intrusions, attackers used web exploitation and web shells to find configuration data, validate credentials, enumerate cloud services, access secrets, and conduct storage operations.\u003c/p\u003e\n\n\u003cp\u003eIn one intrusion pattern, a compromised Microsoft IIS application was used to create an ASPX web shell through the IIS worker process, w3wp.exe. Commands then searched for web.config files and backups, read application settings and database connection strings, inspected logs, tested database access using extracted credentials, and copied files to a web-accessible upload directory. Arctic Wolf said the precise flaw used to execute code on the IIS server was unknown; in other cases, attackers began with valid AWS credentials obtained by undetermined means.\u003c/p\u003e\n\n\u003cp\u003eUsing valid AWS identities, the activity enumerated many AWS services, including IAM, EC2, S3, Lambda, Secrets Manager, KMS, RDS, ECS, EKS, and Amazon Bedrock. Although many API requests were denied, researchers observed successful discovery activity, a GetSecretValue request for a production secret, and S3 discovery and object operations. The article places AntiFox within a broader rise of AI-powered agentic tools such as ARTEX, which can let operators assign an objective and automate reconnaissance, exploitation, and post-compromise steps at greater speed and scale.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Arctic Wolf Labs reported that Alibaba Cloud systems hosting AntiFox interfaces were associated with malicious actions against internet-facing web services and AWS environments.","In some intrusions, attackers compromised an IIS application, created an ASPX web shell through the IIS worker process, and searched configuration files and logs for application settings, database credentials, and other data.","Attackers used valid AWS identities to enumerate numerous AWS services, and some activity successfully retrieved a production secret through AWS Secrets Manager and performed Amazon S3 object operations.","The exact vulnerability used to gain code execution on the compromised IIS server was not identified, while other incidents began with valid AWS credentials obtained through unknown means.","The article states that agentic penetration-testing tools such as AntiFox and ARTEX can automate reconnaissance, exploitation, and post-compromise activity, increasing the speed and scale of attacks."],"insights":["A compromised web application can become a path into cloud environments because its configuration files may contain database connection strings and AWS credentials.","Even though many AWS service requests were denied, valid cloud identities still enabled successful discovery activity and, in some cases, access to a production secret and S3 object operations.","ARTEX operators reportedly often set an objective and then left agent fleets to work with little further interaction, showing that human involvement can be limited mainly to checking progress or changing priorities.","Internet exposure is itself a concern for these platforms: Censys identified 1,465 exposed ARTEX consoles, while Check Point found 10 ARTEX instances that exposed their full databases.","The article identifies roughly 45 open-source agentic attack frameworks that can connect language models to tools and act on their results autonomously."],"referencedReports":[{"title":"AntiFox Alibaba-Hosted Platforms Facilitate Web and Cloud Intrusions","url":"https://github.com/rtkwlf/wolf-tools/tree/main/pack_alerts/202611-antifox-alibaba-hosted-platforms-facilitate-web-cloud-intrusions","publisher":"Arctic Wolf Labs","context":"The article relies on this Arctic Wolf Labs report for its findings linking AntiFox-hosting Alibaba Cloud systems to web and AWS intrusions.","category":"research","primary":true},{"title":"Investigation: Operation Ghost-Campus — Artificial Intelligence Agents, Academic Fraud and Global...","url":"https://medium.com/@vecert/investigation-operation-ghost-campus-artificial-intelligence-agents-academic-fraud-and-global-0ea0ded1e688","publisher":"VECERT","context":"The article cites VECERT's investigation of Operation Ghost-Campus, in which AI agents were used for account creation, server scanning, API-key theft, and academic fraud.","category":"research","primary":false},{"title":"ARTEX Agentic Asbestos","url":"https://censys.com/blog/artex-agentic-asbestos/","publisher":"Censys","context":"The article cites Censys data identifying 1,465 hosts with exposed ARTEX consoles as of November 4, 2026.","category":"research","primary":false},{"title":"Inside ARTEX: How Autonomous AI Agents Are Being Used in Real-World Cyberattacks","url":"https://blog.checkpoint.com/research/inside-artex-how-autonomous-ai-agents-are-being-used-in-real-world-cyberattacks/","publisher":"Check Point Research","context":"The article references Check Point Research's analysis of ARTEX deployments, operator behavior, exposed databases, and attacks involving cryptocurrency, code-signing certificates, and gaming accounts.","category":"research","primary":false},{"title":"From Penetration Testing to Cyber Threat: Beware of ARTEX","url":"https://www.cert.europa.eu/blog/from-penetration-testing-to-cyber-threat-beware-of-artex","publisher":"CERT-EU","context":"The article cites this CERT-EU alert about ARTEX's ability to test large numbers of misconfigurations and pursue long attack chains.","category":"advisory","primary":false},{"title":"AI Pentesting Tools Beyond ARTEX","url":"https://blog.gitguardian.com/ai-pentesting-tools-beyond-artex/","publisher":"GitGuardian","context":"The article cites GitGuardian's analysis identifying about 45 open-source agentic attack frameworks that connect language models to tools and act on their results.","category":"research","primary":false}],"body":"\u003cp\u003eArctic Wolf Labs reported that Alibaba Cloud systems hosting the AntiFox AI penetration-testing platform were associated with malicious activity against internet-facing web services and Amazon Web Services (AWS) environments. AntiFox is an open-source, AI-driven platform designed to automate stages of an authorized penetration test, from reconnaissance through reporting. In observed intrusions, attackers used web exploitation and web shells to find configuration data, validate credentials, enumerate cloud services, access secrets, and conduct storage operations.\u003c/p\u003e\n\n\u003cp\u003eIn one intrusion pattern, a compromised Microsoft IIS application was used to create an ASPX web shell through the IIS worker process, w3wp.exe. Commands then searched for web.config files and backups, read application settings and database connection strings, inspected logs, tested database access using extracted credentials, and copied files to a web-accessible upload directory. Arctic Wolf said the precise flaw used to execute code on the IIS server was unknown; in other cases, attackers began with valid AWS credentials obtained by undetermined means.\u003c/p\u003e\n\n\u003cp\u003eUsing valid AWS identities, the activity enumerated many AWS services, including IAM, EC2, S3, Lambda, Secrets Manager, KMS, RDS, ECS, EKS, and Amazon Bedrock. Although many API requests were denied, researchers observed successful discovery activity, a GetSecretValue request for a production secret, and S3 discovery and object operations. The article places AntiFox within a broader rise of AI-powered agentic tools such as ARTEX, which can let operators assign an objective and automate reconnaissance, exploitation, and post-compromise steps at greater speed and scale.\u003c/p\u003e\n"},{"n":34,"title":"ARTEX and AI-Powered Red Teaming Tools: What Defenders Need to Know","source":"unit42.paloaltonetworks.com","sourceColorIdx":0,"link":"https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/","time":"23:00","priority":"SHOULD READ","score":84,"tldr":"Unit 42 reports that attackers are using AI-powered red-team frameworks such as ARTEX to autonomously probe exposed identity flows and APIs, rapidly validate credentials, and pursue cloud access at scale. Defenders should reduce public attack surface, protect self-service and write endpoints, remove exposed specifications and secrets, and detect the distinctive high-volume, adaptive behavior of autonomous agents.","briefOverview":"\u003cp\u003eUnit 42 reports that attackers are using AI-enabled red-teaming and penetration-testing tools, including ARTEX and CyberStrikeAI, to autonomously conduct offensive operations. The organization observed ARTEX in intrusion attempts against multiple targets, including cases where attacker infrastructure hosted an ARTEX console or used ARTEX-associated infrastructure and user agents. ARTEX is described as an open-source, multi-agent AI penetration-testing framework that can evaluate responses, adapt after failures, and continue pursuing an objective. Unit 42 states that attackers can use it against internet-exposed identity workflows and APIs, then use obtained credentials and trust relationships to reach cloud environments.\u003c/p\u003e\n\n\u003cp\u003eAs of October 2026, Unit 42 identified 1,323 internet-facing CyberStrikeAI hosts and 609 ARTEX hosts, with 21 running both tools. Observed behavior associated with autonomous tooling included request bursts followed by 25–31 second pauses, rapid credential validation, immediate targeting of paths disclosed in OpenAPI specifications and source maps, retries after HTTP 422 errors, and repeated polling loops. Unit 42 recommends reducing public exposure by removing public attack maps and exposed tokens, authenticating every write endpoint, strengthening password-reset and registration flows, moving secrets into a secrets manager, and enforcing least privilege. It also advises detecting behavior such as canary usernames, cloud-key use from new IP addresses, write-then-delete storage tests, and early probing that precedes later intrusion activity.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Unit 42 observed ARTEX in intrusion attempts against multiple targets and investigated intrusions where attacker infrastructure hosted an ARTEX console or used ARTEX-associated infrastructure and user agents.","As of October 2026, Unit 42 identified 1,323 internet-facing hosts running CyberStrikeAI and 609 running ARTEX, including 21 hosts running both tools.","The article states that ARTEX can adapt after failed attempts, target internet-exposed identity workflows and APIs, and use associated credentials and trust relationships to reach cloud environments.","Observed ARTEX-like activity included brief request bursts followed by 25–31 second pauses, rapid validation of more than 200 client secrets, immediate targeting of routes found in OpenAPI specifications and source maps, and successful retries after HTTP 422 errors.","Unit 42 recommends removing public OpenAPI specifications, source maps and configuration files containing tokens or client IDs; requiring authentication for every write endpoint; hardening password-reset and registration flows; and hunting for behavior such as canary usernames, new-IP cloud-key use, and write-then-delete storage tests."],"insights":["Unit 42 found that automated ARTEX activity could turn public password-reset pages and exposed APIs into a route to cloud access without exploiting a software vulnerability.","The observed request pattern of one to 14 requests followed by 25–31 second pauses may reveal an automated system waiting for an AI model response, providing a behavioral detection opportunity even when infrastructure changes.","Current autonomous testing frameworks can be highly conspicuous: Unit 42 reported that Cairn generated hundreds of thousands of high-frequency requests across multiple edge protocols from one source IP address.","Generic error responses and silent connection throttling may hinder AI-driven tools because they rely on target responses to decide their next actions, potentially causing them to waste computing resources.","Unit 42 observed humans or browser automation still participating in sensitive stages of some operations, including password resets and initial token requests, despite the use of autonomous tooling."],"referencedReports":[],"body":"\u003cp\u003eUnit 42 reports that attackers are using AI-enabled red-teaming and penetration-testing tools, including ARTEX and CyberStrikeAI, to autonomously conduct offensive operations. The organization observed ARTEX in intrusion attempts against multiple targets, including cases where attacker infrastructure hosted an ARTEX console or used ARTEX-associated infrastructure and user agents. ARTEX is described as an open-source, multi-agent AI penetration-testing framework that can evaluate responses, adapt after failures, and continue pursuing an objective. Unit 42 states that attackers can use it against internet-exposed identity workflows and APIs, then use obtained credentials and trust relationships to reach cloud environments.\u003c/p\u003e\n\n\u003cp\u003eAs of October 2026, Unit 42 identified 1,323 internet-facing CyberStrikeAI hosts and 609 ARTEX hosts, with 21 running both tools. Observed behavior associated with autonomous tooling included request bursts followed by 25–31 second pauses, rapid credential validation, immediate targeting of paths disclosed in OpenAPI specifications and source maps, retries after HTTP 422 errors, and repeated polling loops. Unit 42 recommends reducing public exposure by removing public attack maps and exposed tokens, authenticating every write endpoint, strengthening password-reset and registration flows, moving secrets into a secrets manager, and enforcing least privilege. It also advises detecting behavior such as canary usernames, cloud-key use from new IP addresses, write-then-delete storage tests, and early probing that precedes later intrusion activity.\u003c/p\u003e\n"},{"n":22,"title":"Over 35,000 Grok-Built Apps Exposed Online, Some Leaking Confidential Data and Passwords","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/over-35000-grok-built-apps-exposed.html","time":"12:19","priority":"SHOULD READ","score":82,"tldr":"Researchers found that more than 35,000 publicly accessible Grok-built apps could be discovered through passive DNS, with some exposing confidential corporate and personal data. Tests also showed Grok-generated authentication can be flawed, potentially allowing unauthorized users to access and alter app data.","briefOverview":"\u003cp\u003eClaroc researchers found 37,571 Grok-built apps online, including 35,578 that could be accessed without signing in. About one in ten of the open apps contained internal business or personal information, and roughly 2% were estimated to contain material serious enough to be rated high or critical. Exposed content included employee data, patient information, work schedules, confidential sales materials, and a timesheet application whose code contained employees’ passwords in plain text.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also identified 24 publicly accessible apps created by staff at X and SpaceXSI, although SpaceXSI later removed those staff apps. Grok Build’s publishing flow preselected “Anyone with the link” in the researchers’ paid account, while published app subdomains could be found through passive DNS records. In tests on their own apps, the researchers found that one Grok-generated sign-in implementation allowed an uninvited account to view, edit, and delete customer records because the code added a user to the team before checking authorization.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Claroc found 37,571 Grok-built apps online, of which 35,578 were accessible without signing in.","About one in ten publicly accessible apps contained internal business or personal data, including employee lists, patient information, schedules, sales documents, and passwords stored in plain text.","The researchers found 24 publicly accessible apps created by staff at X and SpaceXSI, including a confidential sales-hire onboarding plan and an X advertising proposal marked confidential.","Grok Build selected \"Anyone with the link\" by default in the researchers' paid account, while app subdomains could be discovered through passive DNS records.","In a test app created by the researchers, Grok-generated sign-in code allowed an uninvited Google account to view, edit, and delete customer data."],"insights":["“Anyone with the link” was the preselected publishing option in the researchers’ paid Grok account, even though published app subdomains can be found through searchable DNS lookup records.","In the researchers’ test, Grok-generated access control added a person to a sales team before checking whether they were authorized, allowing an uninvited account to read, edit, and delete records.","Setting a Grok app to “Only you” returned a 401 error to an outsider for both the app page and its data, while unpublishing removed an app from the internet within seconds.","Although SpaceXSI said employee accounts default to “Only you,” Claroc found 24 apps made by SpaceXSI and X staff that were open to anyone."],"referencedReports":[{"title":"GhostShares: Grok Build Apps","url":"https://blog.claroc.io/ghostshares-grok-build-apps/","publisher":"claroc","context":"The article relies on Claroc's report documenting publicly accessible Grok-built apps and exposed data.","category":"research","primary":true},{"title":"GhostShares: Muse Passive DNS","url":"https://blog.claroc.io/ghostshares-muse-passive-dns","publisher":"claroc","context":"The article references Claroc's earlier research showing that shared pages from Meta's Muse AI agent could be discovered through passive DNS.","category":"research","primary":false}],"body":"\u003cp\u003eClaroc researchers found 37,571 Grok-built apps online, including 35,578 that could be accessed without signing in. About one in ten of the open apps contained internal business or personal information, and roughly 2% were estimated to contain material serious enough to be rated high or critical. Exposed content included employee data, patient information, work schedules, confidential sales materials, and a timesheet application whose code contained employees’ passwords in plain text.\u003c/p\u003e\n\n\u003cp\u003eThe researchers also identified 24 publicly accessible apps created by staff at X and SpaceXSI, although SpaceXSI later removed those staff apps. Grok Build’s publishing flow preselected “Anyone with the link” in the researchers’ paid account, while published app subdomains could be found through passive DNS records. In tests on their own apps, the researchers found that one Grok-generated sign-in implementation allowed an uninvited account to view, edit, and delete customer records because the code added a user to the team before checking authorization.\u003c/p\u003e\n"},{"n":26,"title":"Microsoft Researchers Show AI Agents Can Be Backdoored by Editing Fewer Than 10 Neurons","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/11/microsoft-researchers-show-ai-agents.html","time":"07:21","priority":"SHOULD READ","score":82,"tldr":"Microsoft researchers showed that an attacker with access to an AI model’s weights can implant a hidden agent backdoor by directly modifying fewer than 10 dormant neurons, causing trigger-based execution of attacker commands while largely preserving normal model behavior. The finding underscores the need to verify model provenance and checkpoint integrity, sandbox agent actions, and restrict permissions.","briefOverview":"\u003cp\u003eMicrosoft researchers demonstrated a method called Lazarus that can implant a hidden backdoor in an AI model by directly editing fewer than 10 rarely used neurons, without retraining the model. When a chosen trigger appears in a user request or a tool’s output, the modified model can generate an attacker-selected command for an AI agent to run with its existing permissions. The researchers tested the technique on Nemotron-Terminal-8B, Qwen3.6-27B, and Gemma-4-31B-IT, and said they had not observed threat actors using it.\u003c/p\u003e\n\n\u003cp\u003eOn Nemotron-Terminal-8B, the team altered and tuned seven neurons in the final feed-forward layer using 23 example sessions, causing a harmless test command to appear in at least 98.8% of triggered recorded sessions and none of the checked trigger-free sessions. The altered models could still perform normally on ordinary evaluations, although one Qwen version’s Terminal-Bench result declined from 46.59% to 42.05%. Microsoft said the principal risk is to organizations using AI agents with powerful access, because anyone able to modify a model checkpoint before deployment could plant the backdoor; recommended defenses include checking models against their original weights, restricting agent permissions, isolating generated code, limiting outbound network access, and requiring approval for high-impact actions.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft researchers demonstrated Lazarus, a method for adding a hidden backdoor to an AI model by directly editing fewer than 10 rarely used neurons without retraining the full model.","When a selected trigger appears in a user request or tool output, the edited model can generate an attacker-chosen command that an AI agent may execute with its own permissions.","In tests on Nemotron-Terminal-8B, seven edited neurons produced a harmless marker command in at least 98.8% of triggered recorded sessions and in none of the checked trigger-free sessions.","The researchers said that anyone able to modify a model checkpoint before deployment, including insiders, compromised build-pipeline users, or publishers of altered public models, could plant this type of backdoor.","Microsoft recommends verifying checkpoints against their declared base models, obtaining models from original publishers, restricting agent permissions, isolating agent-generated code, limiting outbound connections, and requiring human approval for high-impact actions."],"insights":["The potential harm is driven more by the permissions granted to an AI agent than by the small size of the model edit, because a generated command can download and run any remote script the agent is allowed to execute.","The backdoor can be triggered by text returned from a tool, not only by a user’s request, creating a path in which apparently routine agent interactions activate the hidden behavior.","Ordinary model-quality tests may not expose the alteration: the edited Qwen models retained most math-test performance and had a relatively limited drop on the Terminal-Bench agent-task test.","Comparing a deployed checkpoint with its known original version is the most reliable proposed detection approach, while a detector tested without an original copy missed some edits and falsely flagged some clean models.","The researchers found that asking AI models themselves to inspect checkpoints was unreliable, with Claude Opus 5.5 classifying 41% of edited checkpoints as clean."],"referencedReports":[{"title":"Lazarus","url":"https://github.com/anadim/anadim.github.io/blob/master/papers/Lazarus.pdf","publisher":"microsoft-research","context":"The article cites this research paper for the Lazarus neuron-editing method, experimental results, and detection findings.","category":"research","primary":true},{"title":"Lazare Veni Foras: Reprogramming Dormant Neurons to Backdoor AI Agents","url":"https://www.microsoft.com/en-us/research/blog/lazare-veni-foras-reprogramming-dormant-neurons-to-backdoor-ai-agents/","publisher":"microsoft-research","context":"The article cites Microsoft’s research summary for its assessment that comparing a checkpoint with its original weights is needed for reliable detection.","category":"research","primary":false},{"title":"Detecting Sleeper Agents Hiding in AI Model Neurons","url":"https://www.microsoft.com/en-us/security/blog/2026/11/10/detecting-sleeper-agents-hiding-in-ai-model-neurons/","publisher":"microsoft","context":"The article cites Microsoft’s mitigation guidance for recommended checkpoint verification, supply-chain controls, sandboxing, and approval requirements.","category":"advisory","primary":false},{"title":"How Abliterated Models Can Get You Pwned","url":"https://projectdiscovery.io/research/how-abliterated-models-can-get-you-pwned","publisher":"projectdiscovery","context":"The article references this earlier proof of concept showing a trigger-trained Qwen model causing Codex CLI to run a script.","category":"research","primary":false}],"body":"\u003cp\u003eMicrosoft researchers demonstrated a method called Lazarus that can implant a hidden backdoor in an AI model by directly editing fewer than 10 rarely used neurons, without retraining the model. When a chosen trigger appears in a user request or a tool’s output, the modified model can generate an attacker-selected command for an AI agent to run with its existing permissions. The researchers tested the technique on Nemotron-Terminal-8B, Qwen3.6-27B, and Gemma-4-31B-IT, and said they had not observed threat actors using it.\u003c/p\u003e\n\n\u003cp\u003eOn Nemotron-Terminal-8B, the team altered and tuned seven neurons in the final feed-forward layer using 23 example sessions, causing a harmless test command to appear in at least 98.8% of triggered recorded sessions and none of the checked trigger-free sessions. The altered models could still perform normally on ordinary evaluations, although one Qwen version’s Terminal-Bench result declined from 46.59% to 42.05%. Microsoft said the principal risk is to organizations using AI agents with powerful access, because anyone able to modify a model checkpoint before deployment could plant the backdoor; recommended defenses include checking models against their original weights, restricting agent permissions, isolating generated code, limiting outbound network access, and requiring approval for high-impact actions.\u003c/p\u003e\n"},{"n":30,"title":"Citrus Ransomware: VLESS for traffic, Sn00py for encryption, and LLMs lending a hand","source":"securelist.com","sourceColorIdx":5,"link":"https://securelist.com/citrus-ransomware/121879/","time":"10:00","priority":"SHOULD READ","score":82,"tldr":"Citrus Ransomware targets Russian organizations by abusing compromised contractor accounts, escalating privileges, and spreading Sn00py ransomware through malicious Group Policy Objects. The group combines familiar tools with VLESS/Xray tunnels and apparent LLM-generated scripts, making tight control of third-party access and early detection critical.","briefOverview":"\u003cp\u003eCitrus Ransomware is a previously undocumented group that targeted Russian companies by using stolen contractor credentials to access corporate VPNs or internet-facing Remote Desktop servers. The group then tried to gain higher privileges, move between systems, collect credentials and messaging-app data, and disable security protections. Its activity combines widely available tools with VLESS tunnels intended to make its communications resemble ordinary HTTPS traffic and apparent LLM-generated commands and scripts.\u003c/p\u003e\n\n\u003cp\u003eCitrus attempted to exploit CVE-2026-54121 (Certighost) to obtain certificates that could let it authenticate as a domain controller, and it also targeted insecurely configured 1C:Enterprise servers. It used Xray reverse VLESS tunnels over port 443, AnyDesk for remote control, and tools including mimikatz, Snaffler, ADRecon, SharpHound, and fscan. Before encryption, it archived data associated with Telegram Desktop sessions and uploaded it to an external web service.\u003c/p\u003e\n\n\u003cp\u003eFor impact, the group deployed Go-based Sn00py ransomware through malicious Group Policy Objects, encrypting user files with the .citrus extension and leaving CITRUS_README.txt ransom notes. The malicious policy disabled Windows Defender and the Volume Shadow Copy service, enabled WinRM, created a scheduled task to launch the ransomware, and excluded selected domain controllers from encryption so distribution could continue. The incidents highlight the importance of tightly controlling and restricting contractor access, which Citrus used for initial entry.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Citrus Ransomware gained initial access through contractor employee credentials stolen to connect to corporate VPNs or internet-facing RDP terminal servers.","The group attempted to escalate privileges by exploiting CVE-2026-54121 (Certighost), which could allow it to authenticate as a domain controller after obtaining a forged certificate.","Citrus used Xray reverse VLESS tunnels over port 443 with REALITY settings designed to disguise its traffic as requests to legitimate Yandex sites.","Before encryption, the attackers collected Telegram Desktop session-related data, archived it with 7-Zip, and uploaded it to an external web service through Google Chrome.","Citrus deployed Go-based Sn00py ransomware through malicious Group Policy Objects, encrypting user files with a .citrus extension and disabling Windows Defender and Volume Shadow Copy as part of the deployment."],"insights":["Comments embedded in otherwise routine commands and PowerShell scripts were unusual for the attackers and were assessed as likely evidence of LLM-generated or LLM-edited content.","The ransomware configuration excluded specific domain controllers from encryption, allowing the malicious Group Policy used to distribute the ransomware to continue propagating across the network.","Citrus did not only disable security software on individual hosts; after gaining sufficient privileges, it also targeted centralized security-management consoles to disable protection at scale.","Xray configuration files were sometimes deleted immediately after the tunnel started, reducing the evidence available to defenders while retaining remote access.","Citrus and Toy Ghouls were observed compromising the same infrastructure in several incidents, while sharing Russian-language targeting, tools, directories, and several operating methods."],"referencedReports":[{"title":"Detecting CVE-2026-54121 Certighost with Microsoft Defender","url":"https://techcommunity.microsoft.com/blog/microsoftthreatprotectionblog/detecting-cve-2026-54121-certighost-with-microsoft-defender/4542861","publisher":"microsoft","context":"The article links to Microsoft’s analysis of the Certighost authentication-bypass vulnerability that Citrus attempted to exploit for privilege escalation.","category":"advisory","primary":false},{"title":"How 1C compromise could have been avoided","url":"https://securelist.ru/how-1c-compromise-could-have-been-avoided/114764/","publisher":"kaspersky","context":"The article references this Russian-language analysis when discussing insecure 1C:Enterprise server configurations targeted by Citrus.","category":"research","primary":false}],"body":"\u003cp\u003eCitrus Ransomware is a previously undocumented group that targeted Russian companies by using stolen contractor credentials to access corporate VPNs or internet-facing Remote Desktop servers. The group then tried to gain higher privileges, move between systems, collect credentials and messaging-app data, and disable security protections. Its activity combines widely available tools with VLESS tunnels intended to make its communications resemble ordinary HTTPS traffic and apparent LLM-generated commands and scripts.\u003c/p\u003e\n\n\u003cp\u003eCitrus attempted to exploit CVE-2026-54121 (Certighost) to obtain certificates that could let it authenticate as a domain controller, and it also targeted insecurely configured 1C:Enterprise servers. It used Xray reverse VLESS tunnels over port 443, AnyDesk for remote control, and tools including mimikatz, Snaffler, ADRecon, SharpHound, and fscan. Before encryption, it archived data associated with Telegram Desktop sessions and uploaded it to an external web service.\u003c/p\u003e\n\n\u003cp\u003eFor impact, the group deployed Go-based Sn00py ransomware through malicious Group Policy Objects, encrypting user files with the .citrus extension and leaving CITRUS_README.txt ransom notes. The malicious policy disabled Windows Defender and the Volume Shadow Copy service, enabled WinRM, created a scheduled task to launch the ransomware, and excluded selected domain controllers from encryption so distribution could continue. The incidents highlight the importance of tightly controlling and restricting contractor access, which Citrus used for initial entry.\u003c/p\u003e\n"},{"n":31,"title":"A Potential Binance Employee’s Mac Was Infected Seconds After a Fake Homebrew Ad","source":"constella.ai","sourceColorIdx":4,"link":"https://constella.ai/blog/a-potential-binance-employees-mac-was-infected-seconds-after-a-fake-homebrew-ad/","time":"17:12","priority":"SHOULD READ","score":82,"tldr":"An infostealer log from a potential Binance employee’s Mac shows it visited a Google-advertised fake Homebrew page and ran a MacSync-like stealer within 16 seconds, exposing corporate credentials and sessions. The evidence does not link this March 2026 compromise to Binance’s later $6.34 billion theft, but it warrants investigation because of the breadth of access exposed.","briefOverview":"\u003cp\u003eA Constella Intelligence infostealer log from a potential Binance employee’s MacBook Air shows the browser reached macdev.slab.com through a Google ad on 24 March 2026. A same-day Homebrew GitHub report identified that domain as a sponsored fake Homebrew installer page offering a malicious command. Sixteen seconds after the ad click, an \u003ccode\u003eosascript\u003c/code\u003e process was running, and the report found artifacts consistent with the MacSync stealer. The log does not contain the exact page URL, command, or browser history.\u003c/p\u003e\n\n\u003cp\u003eThe stolen data included the Mac login password, Chrome Keychain data, 532 saved credentials across 365 services, and credentials for Binance-related data-platform tools including Kibana, Airflow, Kafka, Zeppelin, and Git. The report says the exposed Okta password was a variant of the Mac login password and that passwords for 15 other corporate email accounts were also present. Some browser sessions were still nominally valid as of 4 November 2026. Although the incident predates Binance’s reported $6.34 billion theft, the article states there is no evidence that this log was used in that attack and notes that the date and systems in the log do not match Binance’s disclosed Wallet DevOps compromise.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["On 24 March 2026, a potential Binance employee’s Mac reached macdev.slab.com through a Google ad, and an osascript process associated with MacSync-like artifacts began 16 seconds later.","The log captured the Mac login password, 532 saved credentials across 365 services, credentials for Binance-related data-platform tools, and passwords for 15 other corporate email accounts.","The report links macdev.slab.com to a same-day public Homebrew report describing a sponsored page that offered a fake Homebrew installation command.","The log does not contain the exact command, browsing history, a container-deployment token, an internal AI-tool session, or Wallet DevOps systems.","The article states there is no evidence that this log was used in Binance’s 29 October 2026 theft, and its March capture date does not match Binance’s reported June compromise of Engineer A."],"insights":["The browser cookie timestamps and recorded Asia/Taipei time zone allowed the report to align the Mac’s local process times with the Google ad click and rule out a larger UTC offset.","The exposed Okta password was a variant of the Mac login password, and the report found the same password family in 334 of 545 saved credential records, indicating broad password reuse within the captured data.","The Mac had no listed EDR, MDM, VPN, or Okta Verify processes at capture, while the stealer had already obtained the Mac password and Chrome’s keychain-protection item.","The evidence supports the ad click, the domain visit, and the stealer’s rapid execution, but not the exact fake page path or command because the log lacks browser and shell history.","Some captured browser sessions were still nominally valid more than seven months later, including sessions for Google, ChatGPT, Slab, and Grammarly."],"referencedReports":[{"title":"29 October Binance Security Incident: Initial Findings and Response Update","url":"https://github.com/FeeiCN/FEEI.CN/issues/788","publisher":"binance","context":"The article uses Binance’s initial incident report to describe the publicly disclosed compromise chain behind the October 2026 theft.","category":"news","primary":false},{"title":"Binance Hack: How Attackers Stole $6.34 Billion Through Developer Laptops","url":"https://safedep.io/blog/binance-hack-developer-supply-chain-attack-path","publisher":"safedep","context":"The article cites SafeDep’s technical analysis for details of the reported developer-laptop compromise path, including pyenv under /opt/homebrew and the signing-service timeline.","category":"research","primary":false},{"title":"Reverse Engineering the Six Stages of MacSync Stealer and RAT","url":"https://www.huntress.com/blog/macsync-stealer-rat-reverse-engineering","publisher":"huntress","context":"The article relies on Huntress’s technical analysis to compare the captured /tmp/sync staging directory and zsh-to-osascript execution chain with MacSync artifacts.","category":"research","primary":false},{"title":"Malicious Ad for Homebrew Leads to MacSync Stealer","url":"https://isc.sans.edu/diary/32942","publisher":"sans-internet-storm-center","context":"The article links this technical analysis as supporting material on malicious Homebrew ads leading to the MacSync stealer.","category":"research","primary":false}],"body":"\u003cp\u003eA Constella Intelligence infostealer log from a potential Binance employee’s MacBook Air shows the browser reached macdev.slab.com through a Google ad on 24 March 2026. A same-day Homebrew GitHub report identified that domain as a sponsored fake Homebrew installer page offering a malicious command. Sixteen seconds after the ad click, an \u003ccode\u003eosascript\u003c/code\u003e process was running, and the report found artifacts consistent with the MacSync stealer. The log does not contain the exact page URL, command, or browser history.\u003c/p\u003e\n\n\u003cp\u003eThe stolen data included the Mac login password, Chrome Keychain data, 532 saved credentials across 365 services, and credentials for Binance-related data-platform tools including Kibana, Airflow, Kafka, Zeppelin, and Git. The report says the exposed Okta password was a variant of the Mac login password and that passwords for 15 other corporate email accounts were also present. Some browser sessions were still nominally valid as of 4 November 2026. Although the incident predates Binance’s reported $6.34 billion theft, the article states there is no evidence that this log was used in that attack and notes that the date and systems in the log do not match Binance’s disclosed Wallet DevOps compromise.\u003c/p\u003e\n"},{"n":13,"title":"Poland shuts down government services platform ePUAP following cyberattack","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/poland-shuts-down-government-services-platform-cyberattack","time":"13:18","priority":"SHOULD READ","score":79,"tldr":"Poland temporarily took its ePUAP public-services platform offline after detecting and stopping a cyberattack, though officials say the underlying government infrastructure was not compromised. The outage also affects ePUAP mailboxes and may disrupt Trusted Profile digital identity services until security checks are complete.","briefOverview":"\u003cp\u003ePoland temporarily shut down its ePUAP government-services platform after detecting and stopping a cyberattack. ePUAP allows citizens and businesses to submit official documents, communicate with government agencies, and complete administrative procedures online. Digital Affairs Minister Krzysztof Gawkowski said security teams responded immediately and were working to restore full functionality.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the platform was disabled as a precaution, not because the attack had compromised the system or disrupted its operation. The Central Information Technology Center\u0026rsquo;s infrastructure, which maintains ePUAP and other key digital services, was said to remain secure, and authorities have not confirmed data access or theft. ePUAP electronic mailboxes are unavailable to citizens and public institutions, and the outage could also temporarily affect the Trusted Profile system used to access public services and electronically sign documents.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Poland temporarily shut down the ePUAP government-services platform after detecting and stopping a cyberattack.","Officials said ePUAP was taken offline as a precaution and that the Central Information Technology Center's infrastructure remained secure.","Authorities have not disclosed how the attack was conducted or who was responsible, and there is no public confirmation that data was accessed or stolen.","The outage leaves ePUAP electronic mailboxes unavailable and may temporarily affect Trusted Profile, which is used to access public services and sign official documents electronically."],"insights":["Polish officials said they disabled ePUAP proactively rather than because the attack had already disrupted or compromised the platform, illustrating that a service outage can result from a protective response.","The impact extends beyond the ePUAP portal itself: its unavailable electronic mailboxes affect both citizens and public institutions, while Trusted Profile may also be disrupted.","Officials provided no restoration timeline, stating that services will return only after security specialists finish their work.","The incident follows other recent Polish cyber incidents involving invoicing and healthcare software providers, including a MyDr-related breach that authorities said could involve data tied to about 19 million people and roughly 12,000 healthcare organizations."],"referencedReports":[],"body":"\u003cp\u003ePoland temporarily shut down its ePUAP government-services platform after detecting and stopping a cyberattack. ePUAP allows citizens and businesses to submit official documents, communicate with government agencies, and complete administrative procedures online. Digital Affairs Minister Krzysztof Gawkowski said security teams responded immediately and were working to restore full functionality.\u003c/p\u003e\n\n\u003cp\u003eOfficials said the platform was disabled as a precaution, not because the attack had compromised the system or disrupted its operation. The Central Information Technology Center\u0026rsquo;s infrastructure, which maintains ePUAP and other key digital services, was said to remain secure, and authorities have not confirmed data access or theft. ePUAP electronic mailboxes are unavailable to citizens and public institutions, and the outage could also temporarily affect the Trusted Profile system used to access public services and electronically sign documents.\u003c/p\u003e\n"},{"n":10,"title":"Notion says Fireworks breach exposed customer AI chat transcripts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/notion-says-fireworks-breach-exposed-customer-ai-chat-transcripts/","time":"20:54","priority":"SHOULD READ","score":78,"tldr":"A breach at AI provider Fireworks AI exposed Notion AI Insights chat transcripts from fewer than 1% of Notion users. Notion cut off Fireworks, deleted vendor-held data, disabled Insights, and advises affected users to rotate any credentials shared in impacted chats.","briefOverview":"\u003cp\u003eNotion disclosed that a breach at its AI infrastructure provider, Fireworks AI, exposed Notion AI chat transcripts from a small number of workspaces. Fireworks AI had reported that an attacker accessed its development environment through a third-party cloud provider on October 23. Notion learned on November 8 that customer data, including data from Notion users, had been accessed.\u003c/p\u003e\n\n\u003cp\u003eThe affected data came from the dataset for Notion Insights, a feature that lets workspace administrators review how their teams use AI, and the feature has been disabled. Notion said fewer than 1% of its users were affected, and that most impacted transcripts were not labeled with the author or originating workspace and did not include tool-call results. Notion cut off Fireworks traffic, deleted data from the vendor’s systems, halted training runs, and advises affected users to rotate passwords, API keys, or other credentials entered into affected chats.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Notion said a security breach at its AI infrastructure provider, Fireworks AI, exposed Notion AI chat transcripts in a small number of workspaces.","Fireworks AI told Notion on November 8 that customer data had been accessed, after initially alerting Notion on November 2 about an exposed dataset said to contain only synthetic test data.","The exposed transcripts came from Notion Insights, a feature that helps workspace administrators view how their teams use AI, and Notion has disabled the feature.","Notion said fewer than 1% of its users were affected and that most impacted transcripts were not labeled with the author or the workspace they came from.","Notion cut off traffic to Fireworks AI, deleted its data from the vendor's systems, halted training runs, and advised affected users to rotate passwords, API keys, or other credentials entered in affected chats."],"insights":["Notion initially acted after Fireworks AI described the exposed dataset as synthetic test data, but later learned that it contained real Notion AI chat transcripts, illustrating that the scope of third-party incidents can change after an initial notification.","Although Fireworks AI had contractually committed to retain no Notion data, Notion said the affected dataset included transcripts collected for its Insights feature.","Most affected transcripts were not tied to a specific writer or workspace and did not include tool-call results, which limited attribution but did not remove the need to rotate any credentials entered into those chats.","Notion provides affected workspace owners with a way to review the data and share a link that lets individual members download their own transcripts."],"referencedReports":[{"title":"Security incident involving a third-party AI vendor","url":"https://www.notion.com/security/advisories/security-incident-involving-a-third-party-ai-vendor-nov9","publisher":"notion","context":"Notion's security advisory states that the exposed dataset included Notion AI chat transcripts used for the Insights feature.","category":"advisory","primary":true}],"body":"\u003cp\u003eNotion disclosed that a breach at its AI infrastructure provider, Fireworks AI, exposed Notion AI chat transcripts from a small number of workspaces. Fireworks AI had reported that an attacker accessed its development environment through a third-party cloud provider on October 23. Notion learned on November 8 that customer data, including data from Notion users, had been accessed.\u003c/p\u003e\n\n\u003cp\u003eThe affected data came from the dataset for Notion Insights, a feature that lets workspace administrators review how their teams use AI, and the feature has been disabled. Notion said fewer than 1% of its users were affected, and that most impacted transcripts were not labeled with the author or originating workspace and did not include tool-call results. Notion cut off Fireworks traffic, deleted data from the vendor’s systems, halted training runs, and advises affected users to rotate passwords, API keys, or other credentials entered into affected chats.\u003c/p\u003e\n"},{"n":2,"title":"Baker Tilly notifies clients of data breach at third-party provider","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/baker-tilly-notifies-clients-of-data-breach-at-third-party-provider/","time":"23:01","priority":"MAY READ","score":72,"tldr":"Baker Tilly disclosed that a breach at an unnamed third-party service provider exposed client and dependent data, including names, addresses, and Social Security numbers. More than 10,000 Texans were affected, and the firm is offering 24 months of Experian credit and identity monitoring.","briefOverview":"\u003cp\u003eBaker Tilly Advisory Group is notifying certain clients that an unauthorized actor obtained data stored on a platform operated by an unnamed third-party service provider. The firm became aware of the potential incident on September 6, 2026, and completed its review of the affected data on October 28, 2026. Baker Tilly said it contained the incident, engaged external experts, and notified law enforcement.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed the total number of affected people, the provider involved, or the precise information exposed in its sample notice. However, the Texas Attorney General reports that 10,456 people in Texas were affected and lists Social Security numbers, full names, addresses, and other information among the exposed data types. Baker Tilly said it has no evidence of unauthorized activity on its own network and no reports of identity theft or fraud tied to the exposure, and it is offering 24 months of Experian credit and identity monitoring to affected individuals.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Baker Tilly said an unauthorized actor obtained data relating to certain clients from a platform operated by a third-party service provider.","The company became aware of the potential incident on September 6, 2026, and completed its review of the affected data on October 28, 2026.","Texas Attorney General data shows that 10,456 Texas residents were affected, with Social Security numbers, full names, addresses, and other information listed as exposed.","Baker Tilly said it found no evidence of unauthorized activity on its own network and had received no reports of identity theft or fraud linked to the incident.","The firm is offering affected individuals 24 months of credit and identity monitoring through Experian."],"insights":["The public customer notification leaves the specific data types as a placeholder and does not identify the third-party provider, while the Texas Attorney General portal provides more detail about the exposed information.","Baker Tilly said it found no evidence of unauthorized activity on its own network, indicating the disclosed exposure was associated with a platform operated by an outside provider used for client services.","Although the total number of affected people was not disclosed, Texas reporting alone lists 10,456 impacted individuals, showing that the incident affected a substantial number of clients or dependents.","BleepingComputer found no public ransomware-group claim for the incident at the time the article was published."],"referencedReports":[{"title":"Baker Tilly Sample Individual Notice","url":"https://www.documentcloud.org/documents/28880646-baker-tilly-sample-individual-notice/","publisher":"baker-tilly","context":"The article cites this breach notification as Baker Tilly's notice to affected customers about the third-party provider incident.","category":"advisory","primary":true}],"body":"\u003cp\u003eBaker Tilly Advisory Group is notifying certain clients that an unauthorized actor obtained data stored on a platform operated by an unnamed third-party service provider. The firm became aware of the potential incident on September 6, 2026, and completed its review of the affected data on October 28, 2026. Baker Tilly said it contained the incident, engaged external experts, and notified law enforcement.\u003c/p\u003e\n\n\u003cp\u003eThe company has not disclosed the total number of affected people, the provider involved, or the precise information exposed in its sample notice. However, the Texas Attorney General reports that 10,456 people in Texas were affected and lists Social Security numbers, full names, addresses, and other information among the exposed data types. Baker Tilly said it has no evidence of unauthorized activity on its own network and no reports of identity theft or fraud tied to the exposure, and it is offering 24 months of Experian credit and identity monitoring to affected individuals.\u003c/p\u003e\n"},{"n":7,"title":"Microsoft fixes audio issues caused by September security updates","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/microsoft/microsoft-fixes-usb-audio-issues-caused-by-september-security-updates/","time":"11:18","priority":"MAY READ","score":72,"tldr":"Microsoft’s November 2026 cumulative updates, including KB5132061, fix USB Audio Class 1.0 failures caused by Windows security updates released since September. Affected users who cannot update may be able to restore audio temporarily by switching devices to 2-channel mode.","briefOverview":"\u003cp\u003eMicrosoft says its November 2026 cumulative updates resolve USB audio problems caused by Windows security updates released since September. The issue affected USB Audio Class 1.0 devices on some Windows 10, Windows 11, and Windows Server 2012 or later systems. Users reported no sound output, unresponsive volume and sound settings, and Device Manager messages stating that the device could not start with Code 10.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft had previously issued out-of-band updates on September 14 for devices using 8-channel or 3D audio modes, but the November 10, 2026 security update KB5132061 and later updates address the remaining symptoms. Microsoft recommends installing the latest security update because it includes this fix along with other improvements and issue resolutions. For users unable to install the update immediately, some have reportedly restored audio by switching affected devices to 2-channel mode, though Microsoft has not provided an official workaround.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Microsoft’s November 2026 cumulative updates, including KB5132061, resolve USB audio issues caused by Windows security updates released since September 2026.","The issue affected USB Audio Class 1.0 devices on some Windows 10, Windows 11, and Windows Server 2012 or later systems, causing missing audio, unresponsive sound controls, and Device Manager Code 10 errors.","Microsoft released out-of-band updates on September 14 to fix issues affecting devices in 8-channel or 3D audio modes, while the November updates address the remaining problems.","Users unable to install the November 2026 updates may be able to restore audio by switching affected devices to 2-channel mode, although Microsoft has not provided an official workaround."],"insights":["The audio failure was not limited to consumer PCs: it also affected Windows Server 2012 and later, making it relevant to both client and server environments.","Microsoft’s September 14 out-of-band updates addressed only the 8-channel and 3D-audio symptoms, while the November security updates resolved the remaining USB audio issues.","Although Microsoft has not published an official workaround for systems that cannot install the November updates, some users reported that switching to 2-channel audio restored sound.","The same November 2026 cumulative updates also resolved Outlook sign-in and mail-delivery problems on Exchange Server systems caused by October Windows Server security updates."],"referencedReports":[{"title":"Windows 11, version 26H2 known issues and notifications","url":"https://learn.microsoft.com/en-us/windows/release-health/status-windows-11-26h2#4984msgdesc","publisher":"microsoft","context":"Microsoft's Windows release health dashboard update states that the November 10, 2026 security update KB5132061 and later updates resolve the USB audio symptoms.","category":"advisory","primary":true}],"body":"\u003cp\u003eMicrosoft says its November 2026 cumulative updates resolve USB audio problems caused by Windows security updates released since September. The issue affected USB Audio Class 1.0 devices on some Windows 10, Windows 11, and Windows Server 2012 or later systems. Users reported no sound output, unresponsive volume and sound settings, and Device Manager messages stating that the device could not start with Code 10.\u003c/p\u003e\n\n\u003cp\u003eMicrosoft had previously issued out-of-band updates on September 14 for devices using 8-channel or 3D audio modes, but the November 10, 2026 security update KB5132061 and later updates address the remaining symptoms. Microsoft recommends installing the latest security update because it includes this fix along with other improvements and issue resolutions. For users unable to install the update immediately, some have reportedly restored audio by switching affected devices to 2-channel mode, though Microsoft has not provided an official workaround.\u003c/p\u003e\n"},{"n":14,"title":"Britain, France set out first guidelines for commercial hacking firms","source":"therecord.media","sourceColorIdx":7,"link":"https://therecord.media/britain-france-set-out-guidelines-for-commercial-hacking-firms","time":"13:11","priority":"MAY READ","score":68,"tldr":"Fourteen governments led by the UK and France adopted volun
