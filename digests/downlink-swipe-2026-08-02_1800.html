<script type="application/json" id="dl-articles">[{"n":1,"title":"COLDCARD wallet RNG flaw likely linked to $88 million Bitcoin theft","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/coldcard-wallet-rng-flaw-likely-linked-to-88-million-bitcoin-theft/","time":"21:14","priority":"MUST READ","score":94,"tldr":"Researchers believe a flawed random number generator in COLDCARD hardware wallet firmware allowed attackers to predict wallet seeds and steal about $88.6 million in Bitcoin from thousands of addresses. Updating firmware fixes future seed generation, but users with affected seeds must create a new wallet and move funds.","briefOverview":"\u003cp\u003eResearchers suspect that a vulnerability in COLDCARD hardware wallet firmware was exploited to steal an estimated \u003cspan class=\"math inline\"\u003e\\(88.6 million in Bitcoin from thousands of wallets. Galaxy Research identified multiple waves of transactions that it believes were linked to the flaw, totaling 1,367 Bitcoin stolen from 4,585 addresses. Chainalysis said the attacker prioritized high-value wallets, stealing about \\)\u003c/span\u003e30 million in the first ten minutes and $1.8 million from one victim.\u003c/p\u003e\n\n\u003cp\u003eBlock said the issue was an RNG integration error that caused COLDCARD firmware to use MicroPython’s deterministic Yasmarang fallback instead of the STM32 hardware random number generator. This could allow attackers to generate possible wallet seeds offline, derive their Bitcoin addresses, compare them with addresses on the blockchain, and use matching seeds to steal funds. Coinkite says affected users should install fixed firmware, generate and record a new seed, verify the new wallet address, test with a small transaction, and then move remaining funds because updating firmware does not repair a previously generated seed.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Researchers suspect a vulnerability in COLDCARD hardware wallet firmware was exploited to steal an estimated $88.6 million in Bitcoin from 4,585 addresses.","Galaxy Research said the first wave on July 30 drained about 1,083 BTC from 1,196 addresses around 30 hours before Coinkite publicly disclosed the flaw.","Block said the issue was an RNG integration error that caused COLDCARD firmware to use MicroPython’s deterministic Yasmarang fallback instead of the STM32 hardware random number generator.","Coinkite said affected seeds include those generated on specified Mk2, Mk3, Mk4, Mk5, and Q firmware versions, and that updating firmware does not repair a seed that was previously generated.","Affected users are advised to verify their backup, install fixed firmware, generate and securely record a new seed, test the new wallet, and move their remaining funds."],"insights":["The theft began about 30 hours before Coinkite publicly disclosed the flaw, indicating affected funds were already being drained before many users could act on the public advisory.","Galaxy Research said the identical 30 sat/vB fee rate and absence of change outputs across transactions made the activity look like an automated tool spending keys the attacker already held, rather than normal owner activity.","Chainalysis said the attacker prioritized high-value wallets, stealing about $30 million in the first ten minutes and $1.8 million from one victim, suggesting the affected wallets had been identified and studied before the thefts began.","Updating COLDCARD firmware is not enough for users whose seeds were generated by affected versions, because the old seed remains unsafe and funds must be migrated to a newly generated seed.","Coinkite said seeds supplemented with at least 50 fair, independent, and private dice rolls are not considered at risk from this flaw alone, making dice-added entropy a concrete mitigation mentioned in the advisory."],"referencedReports":[{"title":"Predictable RNG Fallback and 32-bit Reseed in COLDCARD Firmware","url":"https://engineering.block.xyz/blog/predictable-rng-fallback-and-32-bit-reseed-in-coldcard-firmware","publisher":"Block","context":"The article cites Block's report as the technical analysis that traced the COLDCARD issue to an RNG integration error.","category":"research","primary":true},{"title":"COLDCARD Mk3 Seed Generation Warning","url":"https://blog.coinkite.com/coldcard-mk3-seed-generation-warning/","publisher":"Coinkite","context":"The article cites Coinkite's advisory for the affected firmware versions, fixed versions, and user migration guidance.","category":"advisory","primary":true}],"body":"\u003cp\u003eResearchers suspect that a vulnerability in COLDCARD hardware wallet firmware was exploited to steal an estimated \u003cspan class=\"math inline\"\u003e\\(88.6 million in Bitcoin from thousands of wallets. Galaxy Research identified multiple waves of transactions that it believes were linked to the flaw, totaling 1,367 Bitcoin stolen from 4,585 addresses. Chainalysis said the attacker prioritized high-value wallets, stealing about \\)\u003c/span\u003e30 million in the first ten minutes and $1.8 million from one victim.\u003c/p\u003e\n\n\u003cp\u003eBlock said the issue was an RNG integration error that caused COLDCARD firmware to use MicroPython’s deterministic Yasmarang fallback instead of the STM32 hardware random number generator. This could allow attackers to generate possible wallet seeds offline, derive their Bitcoin addresses, compare them with addresses on the blockchain, and use matching seeds to steal funds. Coinkite says affected users should install fixed firmware, generate and record a new seed, verify the new wallet address, test with a small transaction, and then move remaining funds because updating firmware does not repair a previously generated seed.\u003c/p\u003e\n"}]</script>
