d the article says facial age estimation has become one of the most accessible ways for platforms to comply because it does not require a government ID or database lookup. Incode says users in regulated markets choose facial age estimation eight out of ten times over other age assurance methods. The article argues that the main concern is what happens to the face data collected during these checks, especially when traditional systems send the face to a server for analysis.\u003c/p\u003e\n\n\u003cp\u003eIncode’s On-Device Age Estimation runs facial age estimation and passive liveness detection directly on a user’s phone, tablet, or laptop, so the face is not transmitted or stored. The system sends onward only whether the user meets the platform’s required age threshold, while server-side analysis of session metadata is used to detect injection attacks, tampering, and other session integrity issues. Incode says it compressed the models to roughly one-tenth of their original size using knowledge distillation so they can run in an ordinary browser or app without special hardware.\u003c/p\u003e\n\n\u003cp\u003eThe article connects the product to Incode’s $100 million commitment to privacy-preserving identity infrastructure and its acquisition of Identiq, which focuses on privacy-enhancing technology for anti-fraud collaboration. It says Identiq’s technology is intended to let organizations share fraud signals without exposing customer data to a third party or creating central data lakes. Incode presents these efforts as part of a broader approach in which privacy and fraud prevention are handled together as age checks become law around the world.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Incode says more than 30 age assurance laws are now in force worldwide, including the UK Online Safety Act, Australia’s under-16 rules, Brazil’s Digital ECA, and age verification mandates in about half of U.S. states.","Incode’s On-Device Age Estimation runs facial age estimation and passive liveness detection on the user’s phone, tablet, or laptop so the face is not transmitted or stored.","The system sends only the age-threshold outcome onward, while a server-side layer analyzes session metadata to detect injection attacks, tampering, and other session integrity issues without facial or biometric information.","Incode says it compressed its facial age estimation and passive liveness models to roughly one-tenth of their original size using knowledge distillation so they can run in ordinary browsers or apps without special hardware.","Incode announced a $100 million commitment to privacy-preserving identity infrastructure alongside its acquisition of Identiq, whose technology is intended to let organizations share fraud signals without exposing customer data to a third party."],"insights":["The article frames privacy policies as insufficient for biometric age checks because they only assign responsibility after misuse or a breach, while on-device processing is presented as removing the face from the data flow entirely.","Incode’s design still relies on server-side session metadata because the article says a purely local age check could be easier to cheat through injected camera feeds or manipulated devices.","The article positions facial age estimation as a practical compliance option for users without government ID because it does not require documents or database lookup.","Incode links rising age-verification regulation with increasing AI-assisted fraud, arguing that age checks must solve both privacy concerns and spoofing resistance at the same time.","The acquisition of Identiq expands the article’s privacy theme beyond age checks into shared fraud intelligence, emphasizing collaboration without creating centralized pools of customer data."],"referencedReports":[{"title":"2025 Annual Data Breach Report","url":"https://www.idtheftcenter.org/publication/2025-data-breach-report/","publisher":"Identity Theft Resource Center","context":"The article cites the report for statistics on U.S. data compromises and supply-chain breaches.","category":"research","primary":false}],"body":"\u003cp\u003eMore than 30 age assurance laws are now in force worldwide, and the article says facial age estimation has become one of the most accessible ways for platforms to comply because it does not require a government ID or database lookup. Incode says users in regulated markets choose facial age estimation eight out of ten times over other age assurance methods. The article argues that the main concern is what happens to the face data collected during these checks, especially when traditional systems send the face to a server for analysis.\u003c/p\u003e\n\n\u003cp\u003eIncode’s On-Device Age Estimation runs facial age estimation and passive liveness detection directly on a user’s phone, tablet, or laptop, so the face is not transmitted or stored. The system sends onward only whether the user meets the platform’s required age threshold, while server-side analysis of session metadata is used to detect injection attacks, tampering, and other session integrity issues. Incode says it compressed the models to roughly one-tenth of their original size using knowledge distillation so they can run in an ordinary browser or app without special hardware.\u003c/p\u003e\n\n\u003cp\u003eThe article connects the product to Incode’s $100 million commitment to privacy-preserving identity infrastructure and its acquisition of Identiq, which focuses on privacy-enhancing technology for anti-fraud collaboration. It says Identiq’s technology is intended to let organizations share fraud signals without exposing customer data to a third party or creating central data lakes. Incode presents these efforts as part of a broader approach in which privacy and fraud prevention are handled together as age checks become law around the world.\u003c/p\u003e\n"}]</script>
