GraphQL API.","briefOverview":"\u003cp\u003eSpecterOps has introduced Ghostwriter Skills, a collection of portable Agent Skills for recurring Ghostwriter workflows. The initial release covers converting sample reports into templates, reviewing DOCX and PPTX templates, checking whether projects are ready for reporting, and drafting executive summaries from report data. The project is maintained separately from Ghostwriter and versioned independently. It is intended to work with Agent Skills-compatible tools including Claude Code, Codex, Cursor, and GitHub Copilot.\u003c/p\u003e\n\n\u003cp\u003eThe template-creation skill analyzes supplied documents and identifies material that can be replaced with Ghostwriter variables, loops, or fields while preserving document structure where possible. The review skill checks for Ghostwriter compatibility issues and broader document problems, including problematic Jinja placement, broken references, missing styles, and PowerPoint layout or placeholder issues. The report-readiness skill sorts results into blockers, warnings, passed checks, and items it could not assess, while the executive-summary skill creates a draft grounded in existing report content. Most skills can operate offline, and connected workflows use Ghostwriter\u0026rsquo;s GraphQL API with project-read service tokens that cannot alter Ghostwriter data.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SpecterOps introduced Ghostwriter Skills, a separately maintained and independently versioned collection of portable Agent Skills for common Ghostwriter workflows.","The initial release includes skills to convert sample reports into Ghostwriter templates, review DOCX and PPTX templates, assess a project's report readiness, and draft an executive summary from existing report content.","The create-template skill analyzes supplied documents, preserves structure where possible, and produces a converted template with a report describing mappings, suggested custom fields, and items needing review.","The report-readiness skill evaluates a Ghostwriter project for issues such as incomplete findings, unresolved objectives, placeholders, CVSS inconsistencies, and missing expected BloodHound data.","Most skills support offline use, while connected workflows can use Ghostwriter's GraphQL API with a project-read service token that does not allow the LLM to alter Ghostwriter data."],"insights":["A template can appear correct in Word or PowerPoint yet still fail during Ghostwriter rendering or final PDF preparation because of hidden issues such as bookmarks, document relationships, page breaks, fields, or Jinja syntax placement.","The template-creation workflow can reuse a live Ghostwriter instance's existing custom-field specification to recommend fields already used by an organization, rather than only proposing new fields.","Report-readiness results are organized into blockers, warnings, passed checks, and checks that could not be assessed, giving reviewers a prioritized list instead of a simple pass-or-fail answer.","Connected use relies on project-read service tokens, so the skills can retrieve relevant Ghostwriter information without allowing the language model to modify data in Ghostwriter.","The executive-summary skill is explicitly positioned as a draft based on existing report material, with the report author retaining responsibility for risk judgment, client context, and final communication."],"referencedReports":[],"body":"\u003cp\u003eSpecterOps has introduced Ghostwriter Skills, a collection of portable Agent Skills for recurring Ghostwriter workflows. The initial release covers converting sample reports into templates, reviewing DOCX and PPTX templates, checking whether projects are ready for reporting, and drafting executive summaries from report data. The project is maintained separately from Ghostwriter and versioned independently. It is intended to work with Agent Skills-compatible tools including Claude Code, Codex, Cursor, and GitHub Copilot.\u003c/p\u003e\n\n\u003cp\u003eThe template-creation skill analyzes supplied documents and identifies material that can be replaced with Ghostwriter variables, loops, or fields while preserving document structure where possible. The review skill checks for Ghostwriter compatibility issues and broader document problems, including problematic Jinja placement, broken references, missing styles, and PowerPoint layout or placeholder issues. The report-readiness skill sorts results into blockers, warnings, passed checks, and items it could not assess, while the executive-summary skill creates a draft grounded in existing report content. Most skills can operate offline, and connected workflows use Ghostwriter\u0026rsquo;s GraphQL API with project-read service tokens that cannot alter Ghostwriter data.\u003c/p\u003e\n"},{"n":1,"title":"Reducing shadow IT visibility gaps with Wazuh","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/reducing-shadow-it-visibility-gaps-with-wazuh/","time":"17:17","priority":"MAY READ","score":0,"tldr":"","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":[],"insights":[],"referencedReports":[],"body":""},{"n":2,"title":"Check Point warns of Management Server zero-day exploited in attacks","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/check-point-patches-management-server-zero-day-exploited-in-attacks/","time":"16:32","priority":"MAY READ","score":0,"tldr":"","briefOverview":"","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":[],"insights":[],"referencedReports":[],"body":""},{"n":3,"title":"EvilTokens PhaaS disrupted after compromising 12,000 Microsoft accounts","source":"bleepingcomputer.com","sourceColorIdx":10,"link":"https://www.bleepingcomputer.com/news/security/eviltokens-phaas-disrupted-after-compromising-12-000-microsoft-accoun
