<script type="application/json" id="dl-articles">[{"n":2,"title":"Attackers Exploit CVSS 10.0 Bricksforge WordPress Flaw Enabling Unauthenticated RCE","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/attackers-exploit-cvss-100-bricksforge.html","time":"09:02","priority":"MUST READ","score":96,"tldr":"Attackers are actively exploiting CVE-2026-85097, a CVSS 10.0 flaw in Bricksforge for WordPress versions through 3.1.8.9, to upload PHP payloads and achieve unauthenticated remote code execution. Site owners should update Bricksforge to a patched release immediately and investigate suspicious form submissions and PHP files in its temporary upload directory.","briefOverview":"\u003cp\u003ePatchstack reported active exploitation of CVE-2026-85097, a CVSS 10.0 vulnerability in the Bricksforge WordPress plugin. The flaw affects versions through 3.1.8.9 and allows unauthenticated attackers to upload and run arbitrary PHP code, potentially taking control of a website, stealing data, deploying web shells, and maintaining access. Bricksforge patched the issue in version 3.1.8.10, and the article advises users to update to the latest release, version 4.0.1.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs because Bricksforge validates a file\u0026rsquo;s type at upload but later trusts file metadata supplied during form submission, including an unvalidated URL field in the \u003ccode\u003etemporaryFileUploads\u003c/code\u003e parameter. Attackers can obtain a valid nonce, upload an image file containing PHP code, then submit manipulated metadata that points to the image on disk while assigning it a PHP filename for execution. Patchstack observed attacks against Bricksforge form-submission endpoints, including automated attempts using alternate, mixed-case, and encoded PHP extensions, and recommends reviewing suspicious submissions and unexpected PHP files in the Bricksforge temporary upload directory.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["Patchstack reported active exploitation of CVE-2026-85097, a CVSS 10.0 Bricksforge vulnerability that permits unauthenticated attackers to upload and execute arbitrary PHP code on affected WordPress sites.","The flaw affects Bricksforge versions through 3.1.8.9 and was patched in version 3.1.8.10; the article advises updating to the latest version, 4.0.1.","Attackers obtain a nonce, upload a GIF or PNG file containing PHP code, and then submit manipulated file metadata that causes the content to be written under a PHP filename.","Patchstack observed attacks against the Bricksforge REST form-submission endpoint and the WordPress admin AJAX endpoint, including attempts using alternate, mixed-case, and encoded PHP extensions.","The article also reports exploited XSS flaws in WPC Product Bundles for WooCommerce and Ninja Forms that can deliver a script to install a backdoor plugin and create unauthorized administrator accounts."],"insights":["The Bricksforge issue arises not because the initial upload check fails, but because the plugin later trusts file-location information supplied during form submission, allowing an already accepted image file to be placed under a PHP filename.","Attackers tested alternate, mixed-case, and encoded PHP filename extensions, indicating that simple filtering for only the standard “.php” extension may not detect all observed attempts.","Patchstack observed one cluster of 44 IP addresses sending 56 identical requests within seconds and another testing 25 filename variations, patterns it said indicate automated activity using rotating proxies or distributed infrastructure.","Updating WPC Product Bundles for WooCommerce or Ninja Forms stops additional exploitation but does not remove an existing infection, so owners must also check directly for hidden administrator accounts, must-use plugins, and server logs.","For Bricksforge, the article specifically identifies repeated submissions containing the “temporaryFileUploads” parameter and unexpected PHP files in the plugin’s temporary upload directory as useful signs to investigate."],"referencedReports":[{"title":"Critical Unauthenticated Arbitrary File Upload Vulnerability Exploited in Bricksforge Plugin","url":"https://patchstack.com/articles/critical-unauthenticated-arbitrary-file-upload-vulnerability-exploited-in-bricksforge-plugin/","publisher":"patchstack","context":"Patchstack's technical analysis reports active exploitation of the Bricksforge file-upload flaw and explains the unvalidated URL metadata issue.","category":"research","primary":true},{"title":"Bricksforge 3.1.8.9 - Unauthenticated Arbitrary File Upload via temporaryFileUploads Parameter","url":"https://www.wordfence.com/threat-intel/vulnerabilities/wordpress-plugins/bricksforge/bricksforge-3189-unauthenticated-arbitrary-file-upload-via-temporaryfileuploads-parameter","publisher":"wordfence","context":"The article cites Wordfence's advisory for technical details on obtaining a nonce and submitting manipulated temporary file-upload metadata.","category":"advisory","primary":false},{"title":"Four Ways Back in the WordPress XSS Campaign That Hides Its Own Admin Account","url":"https://patchstack.com/articles/four-ways-back-in-the-wordpress-xss-campaign-that-hides-its-own-admin-account/","publisher":"patchstack","context":"Patchstack's analysis is cited regarding an XSS campaign that installs a malicious plugin, creates administrator accounts, and establishes persistence.","category":"research","primary":false},{"title":"Quarterly WordPress Threat Intelligence Report Q2 2026","url":"https://www.wordfence.com/blog/2026/09/quarterly-wordpress-threat-intelligence-report-q2-2026/","publisher":"wordfence","context":"The article references Wordfence's quarterly report for statistics on WordPress vulnerabilities, compromised sites, and commonly targeted flaws.","category":"research","primary":false}],"body":"\u003cp\u003ePatchstack reported active exploitation of CVE-2026-85097, a CVSS 10.0 vulnerability in the Bricksforge WordPress plugin. The flaw affects versions through 3.1.8.9 and allows unauthenticated attackers to upload and run arbitrary PHP code, potentially taking control of a website, stealing data, deploying web shells, and maintaining access. Bricksforge patched the issue in version 3.1.8.10, and the article advises users to update to the latest release, version 4.0.1.\u003c/p\u003e\n\n\u003cp\u003eThe issue occurs because Bricksforge validates a file\u0026rsquo;s type at upload but later trusts file metadata supplied during form submission, including an unvalidated URL field in the \u003ccode\u003etemporaryFileUploads\u003c/code\u003e parameter. Attackers can obtain a valid nonce, upload an image file containing PHP code, then submit manipulated metadata that points to the image on disk while assigning it a PHP filename for execution. Patchstack observed attacks against Bricksforge form-submission endpoints, including automated attempts using alternate, mixed-case, and encoded PHP extensions, and recommends reviewing suspicious submissions and unexpected PHP files in the Bricksforge temporary upload directory.\u003c/p\u003e\n"},{"n":1,"title":"CyberXero Uses Claude Code in Campaign That Stole Over 628,000 Ukrainian Records","source":"thehackernews.com","sourceColorIdx":8,"link":"https://thehackernews.com/2026/10/cyberxero-uses-claude-code-in-campaign.html","time":"07:26","priority":"MUST READ","score":92,"tldr":"SOCRadar reports that Russian-speaking initial-access broker CyberXero used Claude Code and other AI agents alongside Cobalt Strike to automate attacks on WordPress, e-commerce, Redis, and Ukrainian critical-infrastructure targets, stealing more than 628,000 Ukrainian records. The exposed attacker workspace also shows how AI-assisted offensive tooling is being used to scale both access-broker activity and financially motivated fraud operations.","briefOverview":"\u003cp\u003eSOCRadar reported that a Russian-speaking initial-access broker called CyberXero conducted two AI-assisted campaigns: a global automated effort against WordPress and e-commerce platforms, and a more selective effort against Ukrainian energy and critical-infrastructure organizations. Confirmed theft from four Ukrainian organizations reportedly exposed more than 628,000 records related to Ukrainian individuals, while confirmed compromises also occurred in Poland, China, and the Netherlands. Researchers discovered an exposed directory containing the actor\u0026rsquo;s AI session logs, scripts, reconnaissance data, tooling, configurations, and exfiltrated victim data.\u003c/p\u003e\n\n\u003cp\u003eCyberXero used Claude Code with 51 specialized agents for scanning, exploit chaining, reconnaissance, and post-exploitation, and linked the self-hosted PentAGI agent to Cobalt Strike for payload generation and penetration-testing execution. In one recorded automated run, the operation scanned 4,708 targets, identified access to 429 WordPress administration panels, and deployed 32 web shells in 61 seconds. The article also describes Operation Master, a separate SOCRadar-tracked operation that combined network compromises and data theft with a Brazilian invoice-fraud platform that sent more than 2.4 million email, SMS, and WhatsApp messages.\u003c/p\u003e\n","standardSynthesis":"","comprehensiveSynthesis":"","keyPoints":["SOCRadar attributed a two-pronged campaign targeting WordPress, e-commerce platforms, and Ukrainian critical infrastructure to a Russian-speaking initial-access broker it calls CyberXero.","The campaign reportedly caused confirmed data theft from four Ukrainian organizations, exposing more than 628,000 records tied to Ukrainian individuals, with additional confirmed compromises in Poland, China, and the Netherlands.","An exposed directory on a server at 46.21.250[.]135 contained CyberXero's AI session logs, scripts with plaintext tokens, exploitation tools, reconnaissance output, AI agent configurations, and victim data.","CyberXero used Claude Code with 51 specialized agents and connected the self-hosted PentAGI AI agent to Cobalt Strike for payload generation and penetration-testing execution.","SOCRadar also described Operation Master, which allegedly combined enterprise intrusions and stolen databases with an automated invoice-fraud platform that generated more than 2.4 million email, SMS, and WhatsApp messages targeting Brazilian recipients."],"insights":["CyberXero separated its activity into a high-volume, automated path aimed at monetizable WordPress and e-commerce access and a selective path focused on deep reconnaissance of Ukrainian energy and utility targets, for which SOCRadar found no obvious direct financial motive.","One automated run scanned 4,708 targets, identified access to 429 WordPress administration panels, and deployed 32 web shells within 61 seconds, illustrating the speed documented in the exposed operational data.","The leaked AI transcripts show that safety controls sometimes blocked harmful tasks, including backdoor installation, firewall disabling, lateral movement, web-shell deployment, and a scan using a forged ownership token; however, the operator reportedly retried by opening new sessions framed as authorized testing.","The Operation Master fraud platform generated more than 2.4 million messages and 622,666 personalized invoice links, but recorded 169,906 target interactions, indicating that the campaign tracked recipient engagement at scale.","Organizations exposing Redis servers were specifically advised to check for unexpected SSH authorized-key entries, in addition to rogue WordPress administrators and WSO web shells."],"referencedReports":[{"title":"CyberXero: AI-Powered Initial Access Broker Targeting Ukraine Critical Infrastructure","url":"https://socradar.io/blog/cyberxero-ai-iab-ukraine-critical-infrastructure/","publisher":"socradar","context":"The article relies on SOCRadar's report for its analysis of CyberXero's AI-assisted campaigns against WordPress, e-commerce, and Ukrainian critical-infrastructure targets.","category":"research","primary":true},{"title":"Operation Master: An Intrusion-to-Monetization Pipeline","url":"https://socradar.io/blog/operation-master-intrusion-monetization-pipeline/","publisher":"socradar","context":"The article cites SOCRadar's analysis of Operation Master, an operation combining enterprise intrusions, data theft, and automated invoice fraud.","category":"research","primary":true}],"body":"\u003cp\u003eSOCRadar reported that a Russian-speaking initial-access broker called CyberXero conducted two AI-assisted campaigns: a global automated effort against WordPress and e-commerce platforms, and a more selective effort against Ukrainian energy and critical-infrastructure organizations. Confirmed theft from four Ukrainian organizations reportedly exposed more than 628,000 records related to Ukrainian individuals, while confirmed compromises also occurred in Poland, China, and the Netherlands. Researchers discovered an exposed directory containing the actor\u0026rsquo;s AI session logs, scripts, reconnaissance data, tooling, configurations, and exfiltrated victim data.\u003c/p\u003e\n\n\u003cp\u003eCyberXero used Claude Code with 51 specialized agents for scanning, exploit chaining, reconnaissance, and post-exploitation, and linked the self-hosted PentAGI agent to Cobalt Strike for payload generation and penetration-testing execution. In one recorded automated run, the operation scanned 4,708 targets, identified access to 429 WordPress administration panels, and deployed 32 web shells in 61 seconds. The article also describes Operation Master, a separate SOCRadar-tracked operation that combined network compromises and data theft with a Brazilian invoice-fraud platform that sent more than 2.4 million email, SMS, and WhatsApp messages.\u003c/p\u003e\n"}]</script>
